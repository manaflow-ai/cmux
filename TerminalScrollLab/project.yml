name: TerminalScrollLab
options:
  bundleIdPrefix: ai.manaflow
  deploymentTarget:
    iOS: "18.0"
  generateEmptyDirectories: true
settings:
  base:
    DEVELOPMENT_TEAM: 7WLXT3NR37
    SWIFT_VERSION: 6.0
    SWIFT_STRICT_CONCURRENCY: complete
packages:
  CmuxMobileTerminal:
    path: ../Packages/iOS/CmuxMobileTerminal
targets:
  TerminalScrollLab:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Resources
    dependencies:
      - package: CmuxMobileTerminal
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.manaflow.TerminalScrollLab
        PRODUCT_NAME: TerminalScrollLab
        INFOPLIST_KEY_CFBundleDisplayName: Scroll Lab
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: 1
        GENERATE_INFOPLIST_FILE: true
        CODE_SIGN_STYLE: Automatic
        OTHER_LDFLAGS: "$(inherited) -lc++"
  TerminalScrollLabTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/TerminalScrollLabTests
    dependencies:
      - target: TerminalScrollLab
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
  TerminalScrollLabUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/TerminalScrollLabUITests
    dependencies:
      - target: TerminalScrollLab
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
schemes:
  TerminalScrollLab:
    build:
      targets:
        TerminalScrollLab: all
        TerminalScrollLabTests: [test]
        TerminalScrollLabUITests: [test]
    test:
      targets:
        - TerminalScrollLabTests
        - TerminalScrollLabUITests
