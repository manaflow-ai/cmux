# Rust test code: inside any item under `#[cfg(test)]` (a module, a function, an impl), or a
# `#[test]` / `#[tokio::test]` function. The attribute is the item's previous sibling in the tree
# (other attributes may sit between them).
id: rust-test-code
language: rust
rule:
  inside:
    stopBy: end
    any:
      - follows:
          stopBy: { not: { kind: attribute_item } }
          kind: attribute_item
          regex: '^#\[cfg\((all\()?test\b'
      - kind: function_item
        follows:
          stopBy: { not: { kind: attribute_item } }
          kind: attribute_item
          regex: '^#\[(tokio::)?test\b'
