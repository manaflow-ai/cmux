# Not a port: `std::thread::sleep` inside an `async fn` or `async` block parks the runtime's worker
# thread, and every task queued on it waits too. A text grep cannot tell an async body from a
# sync one; the tree can. (scripts/lint-connection-lifetimes.py R5 covers sleep loops with no
# deadline, a different shape.)
id: rust-blocking-sleep-in-async
language: rust
severity: warning
message: std::thread::sleep in async code blocks the runtime's worker thread
note: >-
  Use `tokio::time::sleep(..).await` (or move the blocking work to `spawn_blocking`). New rule, no original
  detector; plans/cmux-next/threading-model.md says what each thread may block on.
files:
  - 'cmux-tui/crates/**/*.rs'
ignores:
  - '**/tests/**'
  - '**/benches/**'
  - '**/tests.rs'
  - '**/*_tests.rs'
  - '**/*_test.rs'
rule:
  kind: call_expression
  any:
    - pattern: std::thread::sleep($$$)
    - pattern: thread::sleep($$$)
  inside:
    stopBy:
      any: [ { kind: closure_expression }, { kind: function_item, not: { has: { kind: function_modifiers, regex: async } } } ]
    any:
      - kind: async_block
      - kind: function_item
        has: { kind: function_modifiers, regex: '\basync\b' }
  not:
    matches: rust-test-code
