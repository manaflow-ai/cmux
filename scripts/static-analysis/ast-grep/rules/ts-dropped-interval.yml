# Partial port of rule R4 of scripts/lint-connection-lifetimes.py: a `setInterval(..)` whose id is
# thrown away (a statement of its own), so nothing can ever clear it. R4's other halves (a kept id
# never cleared, a WebSocket with no close) read the whole file and stay the original's.
id: ts-dropped-interval
language: tsx
severity: warning
message: setInterval whose id is not kept; it can never be cleared and runs until the page dies
note: >-
  Ports part of R4 of scripts/lint-connection-lifetimes.py. Keep the id and clearInterval it on unmount or
  teardown (or drive the work from an event); or mark the line `// lifetime-ok: <reason>`.
metadata:
  escape: 'lifetime-ok:'
files:
  - 'webviews/src/**/*.ts'
  - 'webviews/src/**/*.tsx'
ignores:
  - '**/*.test.*'
  - '**/*.spec.*'
  - '**/*.stories.*'
  - '**/*.bench.*'
  - '**/*.d.ts'
rule:
  any:
    - pattern: setInterval($$$)
    - pattern: window.setInterval($$$)
    - pattern: globalThis.setInterval($$$)
  inside: { kind: expression_statement }
