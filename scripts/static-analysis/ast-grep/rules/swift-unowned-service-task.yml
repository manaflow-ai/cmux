# Port of the "unowned Task in service code" rule of scripts/cmux-next/check-concurrency.sh
# (plans/cmux-next/state-audit.md): a `Task { }` / `Task.detached { }` whose handle nobody keeps.
# The original matches a line that starts with `Task {`; this matches the call wherever its result is
# thrown away (a statement, or `_ = Task { }`), on one line or many, and never inside a string.
# The escape comment is checked by ast-grep.sh (metadata.escape), on the line or the comment lines
# directly above, as the original does: comments are siblings in the tree, and which line one sits on
# is not something a rule can ask.
id: swift-unowned-service-task
language: swift
severity: warning
message: unowned Task in service code; store and cancel the handle with its owner
note: >-
  Ports the service-code rule of scripts/cmux-next/check-concurrency.sh (the gate). Store the handle and cancel
  it with its owner, or say who owns it with `// task-owner: <reason>` on the line or the comment just above.
metadata:
  escape: '//\s*(task-owner|concurrency-allow):\s*\S'
files:
  - 'Packages/macOS/CmuxNext/Sources/CmuxNextDaemon/**/*.swift'
  - 'Packages/macOS/CmuxNext/Sources/CmuxNextCloud/**/*.swift'
  - 'Packages/macOS/CmuxNext/Sources/CmuxNextMobile/**/*.swift'
  - 'Packages/macOS/CmuxNext/Sources/CmuxNextControl/**/*.swift'
  - 'Packages/macOS/CmuxNext/Sources/CmuxNextApp/Cloud/**/*.swift'
  - 'Packages/macOS/CmuxNext/Sources/CmuxNextApp/**/*Service.swift'
  - 'Packages/macOS/CmuxNext/Sources/CmuxNextApp/**/*Service+*.swift'
  - 'Packages/macOS/CmuxNext/Sources/CmuxNextApp/**/*Store.swift'
  - 'Packages/macOS/CmuxNext/Sources/CmuxNextApp/**/*Store+*.swift'
rule:
  kind: call_expression
  all:
    - any:
        - has: { kind: simple_identifier, regex: '^Task$', nthChild: 1 }
        - has: { kind: navigation_expression, regex: '^Task\s*\.\s*detached$', nthChild: 1 }
    - has: { kind: call_suffix, has: { kind: lambda_literal } }
    # The handle is thrown away: the call is a statement, or `_ = Task { }`.
    - any:
        - inside: { kind: statements }
        - inside:
            kind: assignment
            has: { field: target, regex: '^_$' }
