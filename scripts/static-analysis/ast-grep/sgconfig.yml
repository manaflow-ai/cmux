# ast-grep project for scripts/static-analysis/ast-grep.sh (report-only; no CI gate).
# Each rule is a structural port of an existing regex detector, or a small rule of its own; its
# `note` names the detector or page it ports. The originals stay the gates; these only report.
ruleDirs:
  - rules
utilDirs:
  - utils
# One TypeScript grammar for .ts and .tsx (webviews has both; the rules are not JSX-specific).
languageGlobs:
  tsx: ['*.ts', '*.mts', '*.cts']
