<!doctype html>
<!-- The SIM icon of a side-instance.sh copy (AppIcon-Side.icns): the stable icon art at 1024 px, redrawn. The shipped
     variant is "dark"; "hazard", "gray" and "teal" were the other candidates. To remake it (any Mac with Chrome):
       chrome --headless=new --allow-file-access-from-files --default-background-color=00000000 --window-size=1024,1024 \
         --virtual-time-budget=3000 --screenshot=side.png "file://$PWD/render.html?variant=dark"
     then sips each iconset size (16 to 512, @2x up to 256) from side.png and `iconutil -c icns`. -->
<html><head><style>html,body{margin:0;background:transparent}canvas{display:block}</style></head>
<body><canvas id="c" width="1024" height="1024"></canvas>
<script>
const q = new URLSearchParams(location.search);
const v = q.get("variant") || "dark";
const img = new Image();
img.src = q.get("base") || "../../../Assets.xcassets/AppIcon.appiconset/512@2x.png";
img.onload = () => {
  const c = document.getElementById("c"), x = c.getContext("2d");
  // art bounds from alpha
  const t = document.createElement("canvas"); t.width = t.height = 1024;
  const tx = t.getContext("2d"); tx.drawImage(img, 0, 0);
  const d = tx.getImageData(0, 0, 1024, 1024).data;
  let minX=1024,minY=1024,maxX=0,maxY=0;
  for (let y=0;y<1024;y++) for (let i=0;i<1024;i++) if (d[(y*1024+i)*4+3]>=128){minX=Math.min(minX,i);maxX=Math.max(maxX,i);minY=Math.min(minY,y);maxY=Math.max(maxY,y);}
  const aw=maxX-minX+1, ah=maxY-minY+1;
  const layer = (draw) => { const l=document.createElement("canvas"); l.width=l.height=1024; const lx=l.getContext("2d"); draw(lx); lx.globalCompositeOperation="destination-in"; lx.drawImage(img,0,0); x.drawImage(l,0,0); };
  const label = (text, color, bx, by, bw, bh) => {
    let size = bh*0.62; x.font = `800 ${size}px -apple-system, "SF Pro Display", Helvetica, sans-serif`;
    while (x.measureText(text).width > aw*0.7) { size*=0.95; x.font = `800 ${size}px -apple-system, Helvetica, sans-serif`; }
    x.fillStyle=color; x.textAlign="center"; x.textBaseline="middle"; x.fillText(text, bx+bw/2, by+bh/2+size*0.04);
  };
  const bh = Math.round(ah*0.18), by = maxY+1-bh;
  if (v === "hazard") {
    // the art, then a yellow and black striped band with SIM
    x.drawImage(img,0,0);
    layer(lx => { lx.fillStyle="#FFC400"; lx.fillRect(minX,by,aw,bh); lx.fillStyle="#111";
      for (let s=-bh; s<aw+bh; s+=bh*0.9) { lx.beginPath(); lx.moveTo(minX+s,by); lx.lineTo(minX+s+bh*0.45,by); lx.lineTo(minX+s+bh*0.45-bh,by+bh); lx.lineTo(minX+s-bh,by+bh); lx.closePath(); lx.fill(); } });
    const pw = aw*0.42; layer(lx => { lx.fillStyle="#111"; lx.beginPath(); lx.roundRect(minX+(aw-pw)/2, by+bh*0.12, pw, bh*0.76, bh*0.2); lx.fill(); });
    label("SIM", "#FFC400", minX, by, aw, bh);
  } else if (v === "dark") {
    // the tile turned charcoal, the chevron kept, an amber SIM band
    layer(lx => { lx.fillStyle="#1d1f24"; lx.fillRect(0,0,1024,1024); });
    layer(lx => { lx.globalCompositeOperation="source-over"; lx.drawImage(img,0,0); lx.globalCompositeOperation="source-in"; lx.fillStyle="#1d1f24"; lx.fillRect(0,0,1024,1024); });
    // chevron: base pixels that are saturated (blue), drawn over
    const cv=document.createElement("canvas"); cv.width=cv.height=1024; const cx=cv.getContext("2d"); cx.drawImage(img,0,0);
    const id=cx.getImageData(0,0,1024,1024); const p=id.data;
    for (let i=0;i<p.length;i+=4){ const r=p[i],g=p[i+1],b=p[i+2]; const sat=Math.max(r,g,b)-Math.min(r,g,b); p[i+3]=Math.min(p[i+3], Math.max(0,Math.min(255,(sat-20)*2.2))); }
    cx.putImageData(id,0,0); x.drawImage(cv,0,0);
    layer(lx => { lx.fillStyle="#FF9F0A"; lx.fillRect(minX,by,aw,bh); });
    label("SIM", "#1d1f24", minX, by, aw, bh);
  } else if (v === "gray") {
    // the art in grey, an orange SIM band
    x.filter = "grayscale(1) brightness(0.92)"; x.drawImage(img,0,0); x.filter = "none";
    layer(lx => { lx.fillStyle="#FF6A00"; lx.fillRect(minX,by,aw,bh); });
    label("SIM", "#fff", minX, by, aw, bh);
  } else if (v === "teal") {
    // the channel look: the art, a teal TRY band
    x.drawImage(img,0,0);
    layer(lx => { lx.fillStyle="#0FA3A3"; lx.fillRect(minX,by,aw,bh); });
    label("TRY", "#fff", minX, by, aw, bh);
  }
  document.title = "done";
};
</script></body></html>
