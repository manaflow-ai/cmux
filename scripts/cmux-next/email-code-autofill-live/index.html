<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Check your email for a code</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 15px/1.5 -apple-system, system-ui, sans-serif; margin: 0; display: grid; place-items: center; min-height: 100vh; }
  main { text-align: center; max-width: 520px; padding: 24px; }
  h1 { font-size: 40px; margin: 0 0 12px; letter-spacing: -0.02em; }
  p { opacity: .75; margin: 0 0 32px; }
  .row { display: inline-flex; gap: 8px; align-items: center; }
  input { width: 52px; height: 68px; font-size: 32px; text-align: center; border: 1px solid #8886; border-radius: 8px; background: transparent; color: inherit; }
  input:focus { outline: 2px solid #1d9bd1; outline-offset: -1px; }
  .dash { width: 14px; height: 2px; background: currentColor; opacity: .5; margin: 0 4px; }
  #done { margin-top: 24px; font-weight: 600; }
</style>
</head>
<body>
<main>
  <h1>Check your email for a code</h1>
  <p>We emailed you a 6-character code at you@example.com. The code expires shortly, so please enter it soon.</p>
  <form class="row" id="code" autocomplete="off">
    <input maxlength="1" aria-label="Character 1"><input maxlength="1" aria-label="Character 2"><input maxlength="1" aria-label="Character 3">
    <span class="dash"></span>
    <input maxlength="1" aria-label="Character 4"><input maxlength="1" aria-label="Character 5"><input maxlength="1" aria-label="Character 6">
  </form>
  <div id="done"></div>
</main>
<script>
  // A page script that tries to read a code before the person accepts it: it must see nothing.
  window.__seenBeforeAccept = [];
  const boxes = Array.from(document.querySelectorAll('input'));
  boxes.forEach((box, i) => box.addEventListener('input', () => {
    if (box.value && boxes[i + 1]) boxes[i + 1].focus();
    const code = boxes.map((b) => b.value).join('');
    document.getElementById('done').textContent = code.length === 6 ? `Entered ${code.slice(0, 3)}-${code.slice(3)}` : '';
  }));
  boxes[0].focus();
</script>
</body>
</html>
