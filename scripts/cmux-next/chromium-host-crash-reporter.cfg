# Chromium's crash reporting for the Chromium Host and its helpers (plans/cmux-next/chrome-parity/p01-process.md,
# task 226). embed-cef.sh installs this file as Contents/Resources/crash_reporter.cfg in builds that ship the host;
# CEF reads it there (include/cef_crash_util.h) and starts Crashpad's handler in CefInitialize. The host points
# the database at <its data folder>/Crashpad (browser_host_main.mm); cmux reads new dumps from there and sends
# them only through its own consent-gated crash reporting. tests/test_chromium_host_crash_reporter_cfg.py checks
# this file.
[Config]
# Empty: CEF takes the name and version from the app's Info.plist.
ProductName=
ProductVersion=
# Empty: no upload. Dumps stay in the local database.
ServerURL=
# A crash of the browser process (the host) still reaches macOS's crash reporter, so its .ips report and
# SystemCrashForwarder keep working; helper crashes become dumps only (Chromium never forwards those).
BrowserCrashForwardingEnabled=true
MaxDatabaseSizeInMb=50
MaxDatabaseAgeInDays=7
