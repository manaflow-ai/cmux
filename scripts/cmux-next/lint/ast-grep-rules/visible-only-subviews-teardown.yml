id: visible-only-subviews-teardown
language: swift
severity: warning
message: "tear-down-and-rebuild: removing every subview and adding them back rebuilds the whole list on each change. Reuse row views keyed by id, and give views only to rows in the viewport, or `// visible-only: <reason>`"
note: >-
  Matches `subviews.forEach { $0.removeFromSuperview() }` (arrangedSubviews too) and
  `for v in x.subviews { v.removeFromSuperview() }` (not with a `where` clause: that removes some, a diff). Ratcheted per file by scripts/cmux-next/check-visible-only.py.
ignores:
  # The detach helper (a page's view must leave its hierarchy before dealloc): a teardown, never a list's rebuild.
  - "**/CmuxNextDesign/NSView+DetachingSubviews.swift"
rule:
  any:
    - all:
        - kind: call_expression
        - has:
            kind: navigation_expression
            regex: '(^|\.)(subviews|arrangedSubviews)\s*\.forEach$'
        - has:
            kind: call_suffix
            has:
              stopBy: end
              kind: navigation_suffix
              regex: '^\.removeFromSuperview$'
    - all:
        - kind: for_statement
        # `for v in x.subviews where <test>` removes only some: a diff, not a rebuild.
        - not:
            has:
              kind: where_clause
        - has:
            field: collection
            regex: '(^|\.)(subviews|arrangedSubviews)$'
        - has:
            stopBy: end
            kind: navigation_suffix
            regex: '^\.removeFromSuperview$'
