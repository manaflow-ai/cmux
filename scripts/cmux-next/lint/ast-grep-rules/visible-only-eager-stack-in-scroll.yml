id: visible-only-eager-stack-in-scroll
language: swift
severity: warning
message: "eager list: a ForEach in a VStack/HStack inside a ScrollView builds every row, seen or not. Use LazyVStack/LazyHStack (or a List), bound it with a named cap <= 100 rows, or `// visible-only: <reason>`"
note: >-
  Leo 2026-11-18: "we draw the visible area, right? ... there are so many places where I'm pretty sure we're just
  drawing the whole list". Ratcheted per file by scripts/cmux-next/check-visible-only.py
  (visible-only-baseline.tsv); the pre-push ast-grep layer leaves visible-only-* rules to it.
utils:
  # The ForEach's first argument is a fixed, small set: a literal range (`0..<3`), an enum's `.allCases`, an array
  # literal, or a list cut to a cap (`.prefix(N)`). Not an unbounded list.
  over-fixed-set:
    has:
      kind: call_suffix
      has:
        kind: value_arguments
        has:
          kind: value_argument
          nthChild: 1
          any:
            - regex: '^\(?\s*\d+\s*(\.\.<|\.\.\.)\s*\d+\s*\)?$'
            - regex: '^[\w.]*\.allCases$'
            - has:
                kind: array_literal
            # Bounded by a cap: items.prefix(5), items.prefix(Self.maxRows).
            - regex: '\.prefix\(\s*[\w.]+\s*\)\)?$'
rule:
  kind: call_expression
  has:
    kind: simple_identifier
    regex: '^ForEach$'
  inside:
    kind: call_expression
    stopBy: end
    has:
      kind: simple_identifier
      regex: '^(VStack|HStack)$'
    inside:
      kind: call_expression
      stopBy: end
      has:
        kind: simple_identifier
        regex: '^ScrollView$'
  not:
    any:
      - matches: over-fixed-set
      - inside:
          kind: call_expression
          stopBy: end
          has:
            kind: simple_identifier
            regex: '^(LazyVStack|LazyHStack|LazyVGrid|LazyHGrid|List|Table|OutlineGroup)$'
