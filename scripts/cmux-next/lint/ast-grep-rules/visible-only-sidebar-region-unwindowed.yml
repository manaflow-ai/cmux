id: visible-only-sidebar-region-unwindowed
language: swift
severity: warning
message: "a SidebarRegionView whose itemWindow is never set draws every item. Set `itemWindow` (the list's realization rect), or `// visible-only: <reason>` for a band that is bounded"
note: >-
  SidebarRegionView.init(region:) has no itemWindow argument; it is a property (nil draws every item). A creation
  in a file that never assigns `.itemWindow =` is matched. Ratcheted per file by scripts/cmux-next/check-visible-only.py.
rule:
  # `all` runs in order: the cheap name test first, the whole-file walk only for a SidebarRegionView call.
  all:
    - kind: call_expression
    - has:
        kind: simple_identifier
        regex: '^SidebarRegionView$'
    - not:
        inside:
          kind: source_file
          stopBy: end
          has:
            kind: assignment
            stopBy: end
            regex: '\.itemWindow\s*='
