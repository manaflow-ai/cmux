id: visible-only-stack-set-views
language: swift
severity: warning
message: "eager rows: NSStackView.setViews with a computed array makes a view for every row, seen or not. Window it, bound it with a named cap <= 100 rows, or `// visible-only: <reason>`"
note: >-
  An array literal (`setViews([icon, label], in: .leading)`) is a fixed set of parts and is not matched.
  Ratcheted per file by scripts/cmux-next/check-visible-only.py (visible-only-baseline.tsv).
rule:
  pattern: '$S.setViews($A, in: $G)'
  not:
    has:
      kind: call_suffix
      has:
        kind: value_arguments
        has:
          kind: value_argument
          nthChild: 1
          has:
            kind: array_literal
