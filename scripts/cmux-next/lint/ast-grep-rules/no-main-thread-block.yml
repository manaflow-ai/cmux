id: no-main-thread-block
language: swift
severity: error
message: "blocking call: use the async/background API (openInBackground, async reads, an injected Clock), or `// concurrency-allow: <reason>` when it provably never runs on the main thread"
note: plans/cmux-next/architecture.md 5a, "The main thread never waits" (check-concurrency.sh)
ignores:
  - "**/CmuxNextCompatAppKit/NSWorkspace+Background.swift"
rule:
  any:
    - pattern: Thread.sleep($$$ARGS)
    - pattern: DispatchQueue.main.sync($$$ARGS)
    - pattern: DispatchQueue.main.sync { $$$BODY }
    - pattern: DispatchSemaphore($$$ARGS)
    - pattern: $W.wait()
    - pattern: '$W.wait(timeout: $T)'
    - pattern: $H.readDataToEndOfFile()
    - pattern: $H.readToEnd()
    - pattern: $P.waitUntilExit()
    - pattern: usleep($$$ARGS)
    - pattern: NSWorkspace.shared.open($URL)
    - pattern: NSWorkspace.shared.activateFileViewerSelecting($$$ARGS)
    - pattern: NSWorkspace.shared.selectFile($$$ARGS)
    - pattern: $Q.asyncAfter($$$ARGS)
