# SwiftFormat --lint rules for the cmux-next pre-push gate. Token-based, milliseconds per file.
# The repo has no house Swift format yet, so only objective hygiene rules; the gate flags a rule
# only where a push adds a new hit, so widening this list never blocks on old code.
--swiftversion 6.2
--rules trailingSpace,consecutiveBlankLines,duplicateImports,semicolons,linebreakAtEndOfFile
