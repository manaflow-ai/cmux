# The dogfood tags whose `scripts/reload.sh --release` builds the bench configuration: Release optimization (-O,
# whole module, no debug dylib, no previews, no DEBUG) plus the bench defines (scripts/cmux-next/lib/bench-swift-defines.sh),
# so an optimized dogfood app keeps the debug.* socket commands that the dogfood gate, the smoke, the journeys and the
# benches drive. The fleet's `cmux-ci build cmux --release` passes only --release to reload.sh, so the tags live here,
# in the checkout the fleet builds. `--config release` is the plain Release build for any tag.
#
#   release_bench_tags=   space-separated shell globs matched against --tag (the last such line counts);
#                         empty: every --release is plain Release
#
# A bench build never ships: reload.sh checks its marker (check-no-bench-hooks.sh --expect), and the release and
# nightly pipelines, which build with xcodebuild and never with reload.sh, refuse an app that has it.
# This file is outside Resources/ on purpose: everything in Resources/ is copied into the app bundle.
# cap<sha10> is pr-capture's capture build of a commit (cmuxterm-hq build-fleet/pr-capture): its `--release`
# reads back a Release path (DevTools.isEnabled false) through the same debug.* commands its Debug captures drive.
release_bench_tags=chrome-parity-* cap[0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]
