<!doctype html>
<meta charset="utf-8">
<title>bu-viewport</title>
<button id="enter">Enter fullscreen</button>
<button id="exit">Exit fullscreen</button>
<script>
  window.fullscreenTransitions = [];
  document.addEventListener('fullscreenchange', () => {
    window.fullscreenTransitions.push(!!document.fullscreenElement);
  });
  document.getElementById('enter').onclick = () => document.documentElement.requestFullscreen();
  document.getElementById('exit').onclick = () => document.exitFullscreen();
</script>
