<!doctype html><meta charset=utf-8><title>bu-tabs</title>
<style>body{font:16px -apple-system;margin:60px}a,button{font-size:18px;margin:10px;display:inline-block}</style>
<h2>Multi-tab</h2><a id=newtab href="search.html" target=_blank>Open search in new tab</a>
<a id=noopener href="search.html?route=noopener" target=_blank rel=noopener>Open link without opener</a>
<button id=window-open onclick="window.open('search.html?route=window-open','_blank','noopener')">Open window without opener</button>
<a id=cmd-click href="search.html?route=cmd-click">Command-click link</a>
<a id=middle-click href="search.html?route=middle-click">Middle-click link</a>
<button id=popup onclick="window.open('login.html','pop','width=500,height=500')">Open popup</button>
<button id=alert onclick="out.textContent=confirm('Proceed?')?'confirmed':'cancelled'">Confirm dialog</button><div id=out></div>
