<!doctype html><meta charset=utf-8><title>bu-search</title>
<style>body{font:16px -apple-system;margin:60px}input{width:480px;padding:12px;font-size:18px;border-radius:24px;border:1px solid #ccc}select{font-size:16px;margin-left:12px}li{margin:10px 0}</style>
<h2>Fruit search</h2><input id=q placeholder="Search fruit"><select id=sort><option value=az>A-Z</option><option value=za>Z-A</option></select>
<ul id=res></ul><script>
const all=["apple","apricot","banana","blueberry","cherry","grape","mango","melon","peach","pear","plum"];
function draw(){const v=q.value.toLowerCase();let r=all.filter(x=>x.includes(v));if(sort.value=="za")r.reverse();res.innerHTML=r.map(x=>"<li><a href=#"+x+">"+x+"</a></li>").join("")}
q.oninput=draw;sort.onchange=draw;draw();</script>
