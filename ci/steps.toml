run = '''
python3 -I tests/test_ci_daemon_pr_crate_steps.py
cd cmux-tui
channel="$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' rust-toolchain.toml)"
rustup toolchain install "$channel" --profile minimal
export CARGO_NET_RETRY=10 CARGO_HTTP_TIMEOUT=120 CARGO_INCREMENTAL=0
log="$(mktemp)"
status=0
# Each run must pass at least one test: a filter that matches nothing is red, as in the gate.
ran() { tee "$log"; grep -qE 'test result: ok\. [1-9][0-9]* passed' "$log" || { echo "::error::no cmux_next_ test ran"; return 1; }; }
cargo test --locked -p cmux-tui-machine-protocol --test machine_metadata_compat cmux_next_ 2>&1 | ran || status=1
cargo test --locked -p cmux-tui-hooks --lib cmux_next_ 2>&1 | ran || status=1
cargo test --locked -p cmux-server-core --lib cmux_next_ 2>&1 | ran || status=1
cargo test --locked -p cmux-sdk --lib cmux_next_ 2>&1 | ran || status=1
cargo test --locked -p cmux-sdk --test machine_catalog_reads cmux_next_ 2>&1 | ran || status=1
cargo test --locked -p cmux-auto-session --lib cmux_next_ 2>&1 | ran || status=1
rm -f "$log"
exit "$status"
'''

# The cmux_next_ daemon tests of the gate's three big members, each on the pull request that touches it. Their path
# dependencies are most of the workspace (114 to 168 members), so routing them by every file that can break them would
# run them on nearly every cmux-tui pull request; these steps route by the member's own files and the fixtures its
# cmux_next_ tests read (cmux-tui/persisted-formats, cmux-tui/spec/sdk-schema.json), and a break that comes from a
# dependency stays the post-merge gate's. Each restores the gate's saved target (scripts/ci/cmux-next-member-tests.sh),
# so only the member and what depends on it compile. tests/test_ci_daemon_pr_member_steps.py keeps the inputs whole
# and the targets the gate's. Nothing on a pull request that touches none of them.
