sim=0
if [[ "$mode" == on && -f "$pool_dir/submitted" ]] && (( ! status )); then
  pool="$(CMUX_IOS_SIM_POOL_DIR="$pool_dir" CMUX_IOS_SIM_POOL_WAIT=1200 bash scripts/ci/ios-sim-pool.sh collect)"
  echo "fleet pool: $pool"
fi
# A red macOS kit run already fails the step: the simulator leg (the kit's tests again, 40-45 min on a Mac, up to 20
# of them waiting on the pool) would only spend the machine. The re-run that fixes the red runs it.
if (( status )); then
  echo "::notice title=ios-kit::the macOS kit tests failed (the ios macos job); the iOS simulator tests are skipped this run"
  pool="skipped"
fi
case "${pool%% *}" in
skipped) ;;
pass) echo "iOS simulator tests passed on the fleet pool; this Mac skips them" ;;
fail) echo "::error title=fleet pool::iOS simulator tests failed on the fleet pool (${pool#* })"; sim=1 ;;
*)
[[ "$mode" == on ]] && echo "::notice title=fleet pool::no verdict from the fleet pool (${pool#* }); this Mac runs the simulator tests"
mac_start=$(date +%s)
udid="$(python3 -I scripts/ci/ios_sim_udid.py)"
bundle="${RUNNER_TEMP:-$CI_TOOLS}/ios-sim.xcresult"
rm -rf "$bundle"
(cd cmux-next-ios/CmuxMobileKit && xcodebuild test -scheme CmuxMobileKit-Package -destination "id=$udid,arch=arm64" \
  -enableCodeCoverage NO -derivedDataPath "${CMUX_DERIVED_DATA_SLOT:-${RUNNER_TEMP:-$CI_TOOLS}/dd-ios-sim}" \
  CODE_SIGNING_ALLOWED=NO -quiet -skip-testing:CmuxMobileInstantPerfTests -resultBundlePath "$bundle") || sim=$?
mac_seconds=$(( $(date +%s) - mac_start ))
# -quiet drops Swift Testing's output: report from the result bundle (counts, suites that did not pass, and every failure).
xcrun xcresulttool get test-results tests --path "$bundle" --compact 2>/dev/null | python3 -c '
import json, sys
counts = {}
def walk(node, path):
    kind, result = node.get("nodeType"), node.get("result")
    if kind == "Test Case":
        counts[result] = counts.get(result, 0) + 1
        if result == "Failed":
            print("FAILED:", " / ".join(path))
    if kind == "Test Suite" and (result != "Passed" or node.get("name") == "WaitingBannerTests"):
        print("suite", node.get("name"), result, len(node.get("children", [])), "tests")
    for child in node.get("children", []):
        if child.get("nodeType") == "Failure Message":
            print("   ", child.get("name"))
        else:
            walk(child, path + [child.get("name", "")])
for root in json.load(sys.stdin).get("testNodes", []):
    walk(root, [root.get("name", "")])
print("iOS simulator test cases:", ", ".join(f"{k} {v}" for k, v in sorted(counts.items())))
' || echo "::warning::could not read the result bundle"
if [[ "$mode" == shadow && -f "$pool_dir/submitted" ]]; then
  # Advisory: the pool started before the swift tests, so a short wait is enough; its verdict never fails the step.
  pool="$(CMUX_IOS_SIM_POOL_DIR="$pool_dir" CMUX_IOS_SIM_POOL_WAIT=300 bash scripts/ci/ios-sim-pool.sh collect 2>/dev/null)"
  read -r pool_verdict pool_seconds _ <<< "$pool"
  echo "fleet pool (shadow): $pool; this Mac: exit $sim in $mac_seconds s"
  printf '\n**iOS simulator, fleet pool shadow:** pool %s in %s s, this Mac exit %s in %s s\n' \
    "$pool_verdict" "$pool_seconds" "$sim" "$mac_seconds" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
fi
;;
esac
# The macOS leg usually ends first (8 min against the simulator's 15 or more): a red one fails this step too, so the
# phone cells after it are skipped and `ios` is red, as before the split. One read, no wait: a leg still running is
# its own `ios macos` check.
if (( ! status )); then
  macos="$(python3 -I scripts/ci/ios_macos_leg.py state)"
  echo "ios macos leg after the simulator: $macos"
  if [[ "$macos" == failure ]]; then
    echo "::error title=ios-kit::the macOS kit tests failed in the ios macos job"
    status=1
  fi
fi
exit $(( status || sim ))
'''

[step.ios-phone-cells]
job = "ios"
# After the kit, on the same simulator; it builds the xcframework itself when the kit did not run.
alone = true
timeout = 2700
title = "iOS matrix: phone cells (iOS simulator)"
about = "the matrix's ios cells (ConnectivityMatrixTests, link recovery, pairing retry, cached lists, the terminal projection's resize harness) on an iOS 26 iPhone simulator, then the matrix report for the ios suite"
needs = ["rust"]
inputs = [
  "cmux-next-ios/rust/**",
  "cmux-next-ios/CmuxMobileKit/Sources/CmuxMobileLive/**",
  "cmux-next-ios/CmuxMobileKit/Sources/CmuxMobileTransport/**",
  "cmux-next-ios/CmuxMobileKit/Sources/CmuxMobileLinkFFI/**",
  "cmux-next-ios/CmuxMobileKit/Tests/CmuxMobileLiveTests/**",
  "cmux-next-ios/reliability-matrix/**",
  "cmux-next-ios/CmuxMobileKit/Sources/CmuxMobileTerminal/**",
  "cmux-next-ios/CmuxMobileKit/Tests/CmuxMobileTerminalTests/TerminalProjection*",
  "cmux-tui/crates/cmux-terminal-projection/**",
  "cmux-tui/crates/cmux-wg/**",
  "cmux-tui/crates/cmux-transport/**",
  "cmux-tui/vendor/smoltcp/**",
  "scripts/ci/ios_reliability_matrix.py",
  "scripts/ci/ios_sim_udid.py",
  "scripts/ci/ios_link_ffi.sh",
  "scripts/ci/ios_link_ffi_key.py",
]
run = '''
out="${RUNNER_TEMP:-$CI_TOOLS}/matrix"
mkdir -p "$out"
(cd cmux-next-ios/rust && rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" --profile minimal)
# The kit's copy when it took the fleet's; else the fleet's, else incremental after the kit's build on this
# checkout, or the whole build when the kit was not routed.
bash scripts/ci/ios_link_ffi.sh 4
udid="$(python3 -I scripts/ci/ios_sim_udid.py)"
# Not -quiet: the report reads each test's result and its MATRIX lines.
(cd cmux-next-ios/CmuxMobileKit && xcodebuild test -scheme CmuxMobileKit-Package -destination "id=$udid,arch=arm64" \
  -enableCodeCoverage NO -derivedDataPath "${CMUX_DERIVED_DATA_SLOT:-${RUNNER_TEMP:-$CI_TOOLS}/dd-ios-sim}" \
  CODE_SIGNING_ALLOWED=NO \
  -only-testing:CmuxMobileLiveTests/ConnectivityMatrixTests \
  -only-testing:CmuxMobileLiveTests/LinkRecoveryTests \
  -only-testing:CmuxMobileLiveTests/PairingRetryTests \
  -only-testing:CmuxMobileWorkspacesTests/WorkspacesLaunchStateTests \
  -only-testing:CmuxMobileTerminalTests/TerminalProjectionResizeHarnessTests \
  2>&1 | tee "$out/ios.log") || true
python3 scripts/ci/ios_reliability_matrix.py --ios "$out/ios.log" --json "$out/matrix-ios.json"
'''

# The `mac` job: the Mac tiers of a feat-cmux-next pull request, which were cmux-next.yml's swift-canary and
# fast-tier jobs (with their build-fleet variants) on a pull request; cmux-next.yml keeps them for a push to
# feat-cmux-next and a dispatch. pr-pipeline.yml's job leases the owned Mac's build root and restores the fast
# tier's seed first, and names the root in $CMUX_MAC_ROOT (the checkout where there is none). `inputs` are a
# superset of what scripts/ci/cmux_next_route.py routes to the tier (it reads the SwiftPM target graph), and each
# step's first line asks scripts/ci/mac_tiers.py, which runs that router over $CI_PATHS_FILE, so a path the globs
# over-route skips in a second.
[step.swift-canary]
# Was the `mac` job's mac-swift-canary: a Mac compiled each CmuxNext target the change reaches in Debug. The build
# fleet's pool already compiles and links the whole app (every production target the canary could name) in Debug at
# every same-repository pull request head (scripts/ci/fleet_compile_result.py --phase app-debug, the record
# cmux-next.yml's app-compile-fleet reads), so this step reads that one compile instead of compiling again on a Mac.
# `alone`: it runs after the job's other steps, by when the fleet's compile (submitted at the push) has an answer.
# A fork's head is not compiled by the fleet; its Mac Release compile (cmux-next.yml release-compile) compiles it.
# No pass (a fail, or no verdict in 25 min): the Mac fallback compiles it (Leo, 2026-11-25: "having our mac fleet be
# able to like... exist as fallbacks if we fucked up logic for linux and whatnot is still fine").
#
# Leo, 2026-11-25: "stop waiting on ci to get these fucking things in" and "we need to not only build, but use".
job = "linux"
timeout = 1800
alone = true
title = "Swift canary (build fleet)"
about = "the build fleet's Debug compile of the app at the pull request's head, every target the change reaches (fleet_compile_result.py --phase app-debug)"
inputs = ["Packages/macOS/CmuxNext/Sources/**.swift"]
run = '''
python3 -I scripts/ci/mac_tiers.py has swift_canary > "$CI_TOOLS/canary-tiers.txt" || exit 0
event="${GITHUB_EVENT_PATH:-}"
read -r head pr fork < <(python3 -I - "$event" <<'PY'
import json, sys
try:
    e = json.load(open(sys.argv[1]))
except (OSError, ValueError, IndexError):
    e = {}
pr = e.get("pull_request") or {}
head = (pr.get("head") or {})
repo = (head.get("repo") or {}).get("full_name") or ""
base = (e.get("repository") or {}).get("full_name") or ""
print(head.get("sha") or "-", pr.get("number") or "-", "1" if repo and base and repo != base else "0")
PY
)
if [ "$head" = "-" ]; then
  head="$(git rev-parse -q --verify 'HEAD^2' 2>/dev/null || git rev-parse HEAD)"
fi
if [ "$fork" = "1" ]; then
  echo "a fork's head: the build fleet compiles only same-repository heads; the Mac Release compile compiles this one"
  exit 0
fi
repo="${GITHUB_REPOSITORY:-manaflow-ai/cmux}"
args=(--sha "$head" --repo "$repo" --phase app-debug --wait 1500 --no-record 600)
[ "$pr" = "-" ] || args+=(--pr "$pr")
word="$(python3 -I scripts/ci/fleet_compile_result.py "${args[@]}")" || word=none
fallback() {
  # The Mac fallback (pr-pipeline.yml mac-fallback) compiles the targets on a Mac and its verdict is the canary's.
  # Each one is logged (a warning here, the mac-fallback job's run in the timing records) so the fleet side gets fixed.
  echo "::warning title=fleet fallback::Swift canary: the build fleet said $word at $head; a Mac compiles it (mac-fallback)"
  if [ -n "${GITHUB_OUTPUT:-}" ]; then
    echo "mac_fallback=swift-canary" >> "$GITHUB_OUTPUT"
    echo "canary_targets=$(sed -n 's/^swift_canary_targets=//p' "$CI_TOOLS/canary-tiers.txt")" >> "$GITHUB_OUTPUT"
  fi
}
case "$word" in
  pass) echo "the build fleet compiled and linked the app at $head (Debug): every target the change reaches compiles" ;;
  superseded) echo "a newer head of this pull request replaced $head; its own run reads its compile" ;;
  *) fallback ;;
esac
'''

# Slice 16 (ci-v2 step 11): router callees and the Linux test halves of deploy workflows.
#
# Was fleet-artifact-cdn.yml's test job (cmux-linux, 5 min, Node 24) on a pull request. Its pull_request trigger now
# ignores feat-cmux-next; the workflow keeps its other pull requests, its main pushes and the dispatch deploy (whose
# `needs: test` runs the job first). Its inputs are the workflow's own paths.
[step.fleet-artifact-cdn-test]
job = "linux"
tier = "push"
timeout = 300
title = "Fleet artifact edge tests"
about = "the fleet artifact edge Worker (workers/fleet-artifacts) passes its edge authentication and read-only deployment check tests (node --test)"
needs = ["node"]
inputs = ["workers/fleet-artifacts/**", ".github/workflows/fleet-artifact-cdn.yml"]
run = '''
cd workers/fleet-artifacts
npm test
'''

[step.mac-fast-tier]
job = "mac"
timeout = 6600
# After the canary: both build in the same CmuxNext .build, and the suites take every core.
alone = true
title = "Fast tier (Swift)"
about = "the fast tier's Swift suites: one build-for-testing per package, then each suite (scripts/cmux-next/fast-tier.py --kind swift)"
# Every tracked path cmux_next_route.py routed to fast_tier on 2026-11-24 (one path at a time), by its directory
# where the router reads all of it; the router reads SwiftPM test targets' `reads`, so new ones may need a line.
inputs = [
  "Packages/**", "vendor/stack-auth-swift-sdk-prerelease/**", "Resources/**", "plans/cmux-next/**", "schemas/**",
  "cmux-tui/spec/**", "Native/OptChat/optchat-chief/inspector/**", "tests/fixtures/classic-to-next/**",
  ".xcode-version", "scripts/select-ci-xcode.sh", "scripts/ci/xcode-pins.txt", ".github/actions/cache-restore/**",
  ".github/workflows/cmux-next.yml", "scripts/cmux-next/lib/**", "scripts/cmux-next/fast-tier*",
  "scripts/ci/fleet-test-products.py", "scripts/cmux-next/quarantine.json", "scripts/cmux-next/bundle-ghostty-resources.sh",
  "scripts/cmux-next/cef-manifest.json", "scripts/cmux-next/check-release-compile.sh",
  "scripts/cmux-next/ci-target-graph.py", "scripts/cmux-next/clear-stale-scheme-build-state.sh",
  "scripts/cmux-next/compile-string-catalogs.sh", "scripts/cmux-next/main-thread-heavy-suites.py",
  "scripts/cmux-next/pin-cmux-tui.sh", "scripts/cmux-next/release-derived-data-path.sh",
  "scripts/cmux-next/stale-pcm-retry-needed.sh", "scripts/cmux-next/swift-test-shards.py",
  "scripts/cmux-next/swift-test-with-hang-sampler.sh", "scripts/cmux-next/web-bundle-key.py",
  "cmux-tui/crates/acpmux/tests/fake_agent.py", "cmux-tui/crates/cmux-agent-pane-policy/tests/cases/environment.json",
  "cmux-tui/crates/cmux-layout-reducer/tests/data/*_corpus.txt", "cmux-tui/crates/cmux-tui/src/cli/app.rs",
  "web/scripts/cloud-vm/cmux-tui-upgrade.sh", "webviews/src/agent-session/acpmux/flickerLog.ts",
  "webviews/src/gallery/golden/looks.json", "webviews/test/fixtures/mermaid-front-door.mmd",
  "webviews/test/fixtures/new-tab-intents.json", "webviews/test/fixtures/chat-sim/replay-lane-session.ndjson",
]
run = '''
python3 -I scripts/ci/mac_tiers.py has fast_tier > "$CI_TOOLS/fast-tiers.txt" || exit 0
selected=()
# A pure app FFI re-pin runs only the handler coverage suite (cmux_next_route.py pure_ffi_repin).
if grep -qx 'ffi_repin=true' "$CI_TOOLS/fast-tiers.txt"; then selected=(--only "app handler coverage"); fi
# Otherwise only the suites (and the package builds) the change reaches run; the post-merge batch runs every suite
# (cmux-next-pr-pipeline-mac-batch.yml sets it to `0`). `vars.CI_FAST_TIER_PR_SCOPE` set to `0` runs them all here again.
if [ ${#selected[@]} -eq 0 ] && [ "${CI_FAST_TIER_PR_SCOPE:-1}" != 0 ] && [ -n "${CI_PATHS_FILE:-}" ]; then
  selected=(--changed-files "$CI_PATHS_FILE")
fi
python3 -I scripts/cmux-next/fast-tier.py --root "${CMUX_MAC_ROOT:-$PWD}" --kind swift ${selected[@]+"${selected[@]}"} \
  --receipt "${RUNNER_TEMP:-$CI_TOOLS}/cmux-next-fast-tier.json"
'''
