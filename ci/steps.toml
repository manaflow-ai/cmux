python3 -I scripts/ci/web_subareas.py has agent_pane || exit 0
root="$PWD"
(cd webviews && flock "$CI_TOOLS/bun-install.lock" bun install --frozen-lockfile)
cd cmux-tui
# The last feat-cmux-next push's daemon-tests build (read only; a miss builds cold): its dependencies are acpmux's.
set -o pipefail
restore_log="$(mktemp)" cargo_log="$(mktemp)"
../scripts/ci/cmux-tui-test-target.sh restore | tee "$restore_log"
# No incremental state: it only fills the disk (No space left writing dep-graph.part.bin, #53426).
CARGO_INCREMENTAL=0 cargo build --locked -p acpmux --bin acpmux 2>&1 | tee "$cargo_log"
# A hit should leave third-party crates fresh (a registry crate's Compiling line names no path). Many of them
# rebuilding means the saved target was built with other features than this build's (cmux-tui-test-target.sh save).
rebuilt="$(grep -cE '^ +Compiling [^ ]+ v[^ ]+$' "$cargo_log" || true)"
if grep -q 'test target: hit' "$restore_log" && ((rebuilt > 20)); then
  echo "::warning title=acpmux cache hit rebuilt third-party crates::$rebuilt registry crates compiled after a cmux-tui test target hit; the saved build's dependency features no longer match -p acpmux (scripts/ci/cmux-tui-test-target.sh save)"
fi
# CARGO_TARGET_DIR (a fleet runner's shared target) moves the binary out of cmux-tui/target.
target_dir="$(cargo metadata --format-version 1 --no-deps | python3 -c 'import json,sys; print(json.load(sys.stdin)["target_directory"])')"
export ACPMUX_BIN="$target_dir/debug/acpmux"
cd "$root/webviews"
"$root/scripts/ci/apt-no-service-restarts.sh"
./node_modules/.bin/playwright install --with-deps webkit
log="$(mktemp)"
bash "$root/scripts/ci/ensure-system-chrome.sh" | tee "$log"
chrome="$(tail -n 1 "$log")"
case "$chrome" in CMUX_CHROME_HEADLESS_SHELL=*) export "$chrome" ;; esac
export CMUX_REAL_ACPMUX=1 CMUX_BROWSER_TESTS=1 FAST_CHECKS_OUT="${RUNNER_TEMP:-$root/.ci-tmp}/agent-pane-real-acpmux"
status=0
for file in test/agent-pane-new-chat-settles.test.ts test/agent-pane-picks-hold.test.ts; do
  echo "== $file"
  bun test "$file" || status=1
done
exit "$status"
'''

