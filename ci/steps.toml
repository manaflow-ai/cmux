# ci-guards.yml's workflow-guard-submodule-forward-only job, which a feat-cmux-next pull request reached through
# cmux-next-guards.yml's nightly-guards call on every change but a docs-only one. A docs-only change stays out
# of the pipeline (test_the_router_starts_it_only_when_a_step_is_routed) and globs cannot say "not docs-only", so
# `inputs` is what the step's verdict reads: the gitlinks and .gitmodules (a change touching neither passes the
# guard, which only compares gitlinks that moved), every build.zig.zon (the Zig host check reads all of the tree's),
# the lock, the three commands' scripts and what they import, and the job's workflow. The job keeps pushes,
# dispatch, the post-merge batch and pull requests into other bases, and skips only feat-cmux-next's pull
# requests, where Guard status counts that skip as fine. The job's checkout was this one's (depth 2, no
# submodules): the guard compares the merge commit against its first parent, which that depth holds, and fetches
# what else it needs itself (a changed gitlink's submodule, bounded deepening). This job passes no GITHUB_TOKEN, so
# the guard's GitHub compare fallback is unauthenticated; its bounded deepening is the fallback after that. One
# failed command does not stop the others. 110 s on 2 CPUs (its unit test is 102 s of that).
[step.submodule-forward-only]
job = "linux"
timeout = 300
title = "Submodule forward-only guard"
about = "no submodule gitlink moves backwards from the merge base (unless a commit declares the rollback), the guard's tests pass, and no Ghostty build fetches a Zig package from a third-party host"
inputs = [
  ".gitmodules",
  "ghostty",
  "ghostty-next",
  "homebrew-cmux",
  "**/build.zig.zon",
  "scripts/ci/zig-packages.lock",
  "scripts/ci/zig_package_mirror.py",
  "scripts/ci/deadline_http.py",
  "scripts/ci/submodule_forward_only.py",
  "scripts/ci/ci_process_tree.py",
  "scripts/ci/git_fetch_retry.py",
  "tests/test_submodule_forward_only.py",
  "tests/git_fixture_env.py",
  ".github/workflows/ci-guards.yml",
]
run = '''
base="$(git rev-parse HEAD^1)"
git cat-file -e "$base^{commit}"
export GITHUB_BASE_SHA="$base" GITHUB_HEAD_SHA="$(git rev-parse HEAD)"
status=0
python3 scripts/ci/submodule_forward_only.py || status=1
python3 tests/test_submodule_forward_only.py || status=1
# A change to the lock, a Ghostty gitlink or the detector also downloads every mirrored copy and checks it.
git submodule update --init --depth 1 ghostty ghostty-next
args=()
if git diff --name-only HEAD^1 HEAD -- scripts/ci/zig-packages.lock scripts/ci/zig_package_mirror.py ghostty ghostty-next | grep -q .; then
  args+=(--online)
fi
python3 scripts/ci/zig_package_mirror.py check ${args[@]+"${args[@]}"} || status=1
exit "$status"
'''

# Every on-disk format a build leaves for the next build ships its migration (Leo, 2026-11-24,
# ask-1f9e8b7422: "we need to make sure in the future these kinds of cutovers always have proper migrations.").
# Registries: cmux-tui/persisted-formats/formats.toml (the acpmux store, hosts, caches) and persisted-formats/formats.toml
# (Swift app state, webviews versions and storage keys); settings keys: schemas/settings/published-keys.txt and
# retired-keys.json. The cmux_next_persisted_* Rust tests load the fixtures through the real readers and check every
# published settings key is a row or retired (the cmux_next_ daemon tests step). Seconds.
[step.persisted-formats]
job = "linux"
timeout = 300
title = "Persisted formats ship their migration"
about = "every stored-format version constant (cmux-tui Rust, app Swift, webviews) and webviews storage key is registered; a migrate format keeps every old fixture byte for byte and has one for its current version; no version goes down; an unreviewed format changes only with a policy; a storage key the code stops naming is migrated or retired; published settings keys and retired-keys entries are never removed"
inputs = [
  "cmux-tui/**",
  "persisted-formats/**",
  "Packages/**",
  "cmux-next-ios/**",
  "webviews/src/**",
  "schemas/settings/**",
  "scripts/ci/persisted_formats.py",
  "tests/test_ci_persisted_formats.py",
  "tests/git_fixture_env.py",
]
run = '''
base="$(git rev-parse HEAD^1)"
git cat-file -e "$base^{commit}"
status=0
python3 -I scripts/ci/persisted_formats.py --base "$base" || status=1
python3 -I tests/test_ci_persisted_formats.py || status=1
exit "$status"
'''

# ci-web.yml's web-typecheck job, which a feat-cmux-next pull request reached through ci.yml's `web` call when
# web_subareas.py routed its `typecheck` subarea: a TS/JS/JSON file under web/, web/bun.lock, or ci-web.yml and
# web_subareas.py themselves. The job keeps pushes, dispatch, the post-merge batch and pull requests into other
# bases, and skips only feat-cmux-next's pull requests, where Web status counts that skip as fine. `inputs` is that
# route, plus what the commands read outside it: the files web's sources import from outside web/
# (workers/presence/src, images/cmux-vm/auto-roll.ts), the relay catalog the catalog check compares, and the
# fixit-compile and retry wrappers (scripts/ci/oops). The same commands: the locked install, the relay catalog
# check, and the type check through retry.py (one retry of a classified infrastructure failure) and
# fixit_compile.py (on errors that each have one safe fix, the patch in $RUNNER_TEMP/fixit-compile, which
# pr-pipeline.yml's linux job uploads on failure as a fixit-compile-* artifact for the cmuxterm-hq reconciler),
# then one more run when the native compiler aborts. The patch names the pull request's head (the merge commit's
# second parent), as the job's FIXIT_COMPILE_HEAD_SHA did. The job's always-uploaded ci_oops ledger artifact
# (ci-oops-web-typecheck-RUN-ATTEMPT) is not kept: nothing reads it; retry.py still prints its verdict in the log.
# 32 s cold on 2 CPUs through ci/run (an empty bun cache), 85 s when fixit-compile fixes an error and compiles again.
[step.web-typecheck]
job = "linux"
timeout = 300
title = "Web typecheck"
about = "web's locked dependencies install, the managed relay catalog's generated copies match config/iroh, and web typechecks (tsgo)"
needs = ["bun"]
inputs = [
  "web/**/*.ts",
  "web/**/*.tsx",
  "web/**/*.mts",
  "web/**/*.cts",
  "web/**/*.js",
  "web/**/*.jsx",
  "web/**/*.mjs",
  "web/**/*.cjs",
  "web/**/*.json",
  "web/bun.lock",
  "workers/presence/src/**",
  "images/cmux-vm/auto-roll.ts",
  "config/iroh/managed-relay-catalog.json",
  "scripts/ci/oops/**",
  "scripts/ci/web_subareas.py",
  ".github/workflows/ci-web.yml",
]
run = '''
export RUNNER_TEMP="${RUNNER_TEMP:-$(mktemp -d)}"
if head="$(git rev-parse -q --verify 'HEAD^2')"; then
  export FIXIT_COMPILE_HEAD_SHA="$head"
fi
cd web
flock "$CI_TOOLS/bun-install.lock" bun install --frozen-lockfile
status=0
bun tools/generate-managed-iroh-relay-catalog.ts --check || status=1
log="$(mktemp "$RUNNER_TEMP/web-typecheck.XXXXXX.log")"
set +e
python3 -I ../scripts/ci/oops/retry.py --job web-typecheck -- \
  python3 -I ../scripts/ci/oops/fixit_compile.py run --kind tsc -- bun run typecheck 2>&1 | tee "$log"
typecheck=${PIPESTATUS[0]}
set -e
# The native TypeScript preview compiler can abort on a healthy runner: once more, then its status stands.
if [ "$typecheck" -ne 0 ] && grep -Fq 'Aborted (core dumped)' "$log"; then
  echo "::warning::native tsgo aborted during web typecheck; retrying once"
  typecheck=0
  bun run typecheck || typecheck=$?
fi
[ "$typecheck" -eq 0 ] || status=1
exit "$status"
'''

# ci-web.yml's diff-sidecar-check job, which checks the generated protocol types and the Rust sidecar for changes in
# webviews' diff surface, Native/DiffSidecar or its linked cmux-git crate. Its old job installs the pinned Rust 1.98.1
# toolchain after the shared Linux Rust setup (which stays on coderouter's 1.94.0), so the step does that locally too.
# Rust fmt and clippy are warnings for feat-cmux-next pull requests, while the sidecar tests and generated protocol
# check remain blocking. The old job's warm 4-vCPU p90 was about 63 s, under this step's 300-second limit.
[step.diff-sidecar-check]
job = "linux"
timeout = 300
title = "Diff sidecar checks"
about = "the diff sidecar's Rust tests and generated protocol types pass, with fmt and clippy reported as warnings on feat-cmux-next"
needs = ["bun", "rust"]
inputs = [
  "scripts/benchmark-diff-viewer.sh",
  "scripts/build-diff-sidecar.sh",
  "scripts/generate-diff-sidecar-types.sh",
  "scripts/install-rust-ci.sh",
  "scripts/run-diff-sidecar-cargo.sh",
  "webviews/bun.lock",
  "webviews/package.json",
  "Native/DiffSidecar/**",
  "cmux-tui/crates/cmux-git/**",
  "webviews/bench/**",
  "webviews/src/diff/**",
  ".github/workflows/ci-web.yml",
  "scripts/ci/web_subareas.py",
]
run = '''
rustup toolchain install 1.98.1 --profile minimal --component clippy,rustfmt
cd webviews
flock "$CI_TOOLS/bun-install.lock" bun install --frozen-lockfile
cd ..
status=0
lint_status=0
./scripts/run-diff-sidecar-cargo.sh fmt --manifest-path Native/DiffSidecar/Cargo.toml --all --check || lint_status=1
./scripts/run-diff-sidecar-cargo.sh clippy --manifest-path Native/DiffSidecar/Cargo.toml --all-targets --locked --no-default-features -- -D warnings || lint_status=1
./scripts/run-diff-sidecar-cargo.sh clippy --manifest-path Native/DiffSidecar/Cargo.toml --all-targets --all-features --locked -- -D warnings || lint_status=1
if [ "$lint_status" -ne 0 ]; then
  if [ "${GITHUB_BASE_REF:-}" = "feat-cmux-next" ] || [ "${GITHUB_REF:-}" = "refs/heads/feat-cmux-next" ]; then
    echo "::warning::Rust sidecar fmt or clippy found issues (warn-only); see the lint commands above."
  else
    echo "::error::Rust sidecar fmt or clippy failed; see the lint commands above."
    status=1
  fi
fi
./scripts/run-diff-sidecar-cargo.sh test --manifest-path Native/DiffSidecar/Cargo.toml --all-targets --locked --no-default-features || status=1
./scripts/run-diff-sidecar-cargo.sh test --manifest-path Native/DiffSidecar/Cargo.toml --all-targets --all-features --locked || status=1
./scripts/generate-diff-sidecar-types.sh --check || status=1
exit "$status"
'''

# ci-web.yml's `Web tests (1/4..4/4)` matrix, one step a shard: the same `scripts/run-tests.sh --shard N/4` with its
# JUnit report. `inputs` cover web_subareas.py's unit_tests subarea (every web/ path, the docs references the tests
# build at the head, the relay catalog), and the step's first line asks web_subareas.py itself (`has`, over
# $CI_PATHS_FILE), so a web/e2e-only change skips in a second. A failed shard keeps its report in
# $RUNNER_TEMP/web-test-junit/shardN, which pr-pipeline.yml uploads under the name the old job used
# (web-test-junit-shardN-attemptA, read by scripts/ci/web_test_failure_census.py); a passing shard drops it, as the
# old job uploaded only failed shards. Each shard is `alone`, as its old job had a runner to itself: four at once beside
# the other linux steps on the pipeline's runner took 345 s a shard and timed out 16 tests (#54820's first runs).
# One shard alone, 121 s on 8 CPUs.
[step.web-tests-1]
job = "linux"
timeout = 360
alone = true
title = "Web tests (1/4)"
about = "the first of web's four bun test shards (web/scripts/run-tests.sh --shard 1/4)"
needs = ["bun"]
inputs = [
  "web/**",
  "CHANGELOG.md",
