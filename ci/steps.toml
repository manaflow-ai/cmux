# runs, and nightly.yml's check-nightly-app-store-shelf runs the same script. The job's 45-minute bound (a cold
# cmux-tui test compile). The build env the job set: the ghostty-next gitlink's sources, Zig from PATH.
[step.app-store-shelf]
