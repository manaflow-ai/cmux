[step.design-spec]
job = "advisory"
blocks = false
class = "idle"
timeout = 120
title = "Design spec"
about = "a pull request that changes a UI surface's files cites the surface's design spec (.github/design-surfaces.json)"
run = '''
if [ "${PATHS_LISTED:-}" != true ] || [ "${TREE_LISTED:-}" != true ]; then
  echo "The changed paths or the merged tree could not be listed from git; skipped."
  exit 0
fi
if [ ! -f scripts/ci/pr_design_spec_check.py ] || [ ! -f .github/design-surfaces.json ]; then
  # The pull request that adds the check: its base has no check or map yet.
  echo "::notice::The base branch has no design spec check or surface map yet; nothing to check."
  exit 0
fi
printf '%s' "$BODY" > "$RUNNER_TEMP/design-body.md"
python3 scripts/ci/pr_design_spec_check.py --body-file "$RUNNER_TEMP/design-body.md" \
  --paths-file "$RUNNER_TEMP/paths.txt" --tree-file "$RUNNER_TEMP/tree.txt" \
  --map .github/design-surfaces.json --pr-map "$RUNNER_TEMP/design-surfaces.json" \
  || echo "::warning title=Design spec::the design spec check could not run (exit $?); see this job's log"
'''

# Capture: a pull request that changes native app UI shows a real capture of it in its description (what
# `cmux-ci capture` prints, the media-tour label, or a `No capture: <why>` line). It was the one description lint
# that could turn its job red (exit 2 on bad input); as a step of the `advisory` job it warns, like the rest
# ("Advisory checks never block", CI v2). Leo, 2026-10-31: "WE DONT NEED F***ING SCREENSHOTS JUST LET ME TRY
# THE STUFF OUT". A media-tour label event re-runs it. When git could not list the paths it reads the files API.
[step.capture]
job = "advisory"
blocks = false
class = "idle"
timeout = 180
title = "Capture"
about = "a pull request that changes native app UI shows a real capture in its description, or a No capture line"
labels = ["media-tour", "media-tour-mac"]
run = '''
if [ ! -f scripts/ci/pr_capture_check.py ]; then
  # The pull request that adds the check: its base has no check to run yet.
  echo "::notice::The base branch has no scripts/ci/pr_capture_check.py yet; nothing to check."
  exit 0
fi
printf '%s' "$BODY" > "$RUNNER_TEMP/capture-body.md"
paths="$RUNNER_TEMP/capture-paths.txt"
if [ "${CAPTURE_LISTED:-}" != true ]; then
  paths="$RUNNER_TEMP/capture-api-paths.txt"
  gh api --paginate "repos/$REPOSITORY/pulls/$PR/files?per_page=100" --jq '.[].filename' > "$paths"
fi
python3 scripts/ci/pr_capture_check.py --body-file "$RUNNER_TEMP/capture-body.md" --paths-file "$paths" \
  --labels "$LABELS" --head-sha "$HEAD_SHA" --pr "$PR"
'''

# Leo, 2026-11-27: "like we can have fast retrieval of bench reference per product area". The relevance map
# (docs/benches/relevance-map.toml) and `cmux-bench for-paths`: the prefix index agrees with the old scan on random
# paths, a 2,000-path change resolves in under 1 s and stays flat at 10x the rules, each risky area of
# docs/benches/coverage-map.md has a mapping, every template exists, and the generated units match the layout.
[step.bench-relevance-map]
job = "linux"
timeout = 180
title = "Bench relevance map"
about = "cmux-bench for-paths: the index matches the scan (model-based), a 2,000-path lookup under 1 s and flat at 10x, joined with the coverage map, fails open; per-area baselines: only own areas fetched, 3-of-3 >15% rule, fail open"
inputs = [
  "docs/benches/*",
  "docs/benches/templates/*",
  "scripts/bench/cmux-bench",
  "scripts/bench/benchlib/relevance.py",
  "scripts/bench/benchlib/baselines.py",
  "tests/test_bench_relevance_map.py",
  "tests/test_bench_baselines.py",
  "cmux-tui/crates/*/Cargo.toml",
  "cmux-next-ios/rust/crates/*/Cargo.toml",
  "Packages/*/*/Package.swift",
]
run = "python3 -I tests/test_bench_relevance_map.py && python3 -I tests/test_bench_baselines.py"

# What a pull request's paths need: the areas, benches, targeted tests and check templates the relevance map names
# for them, in the advisory log, and the Linux benches those areas name (`run`), each against its area's budget_s.
# Fail open: an unmapped path is a warning, a base with no for-paths, a broken map or a missing or failing bench is
# a notice; only a measured result over budget_s turns this (non-blocking) check red.
[step.bench-relevance]
job = "advisory"
blocks = false
class = "idle"
timeout = 300
title = "Benches and tests for these paths"
about = "cmux-bench for-paths --run on the pull request's paths: areas, benches, targeted tests, check templates, and the areas' Linux benches against budget_s; unmapped paths warn"
run = '''
if ! grep -q "for-paths" scripts/bench/cmux-bench 2>/dev/null; then
  echo "::notice::The base branch has no cmux-bench for-paths yet; nothing to report."
  exit 0
fi
paths="${CI_PATHS_FILE:-$RUNNER_TEMP/paths.txt}"
if [ ! -s "$paths" ]; then
  echo "::notice::No changed-paths list; for-paths has nothing to read."
  exit 0
fi
if ! grep -q -- "--run" scripts/bench/cmux-bench 2>/dev/null; then
  python3 -I scripts/bench/cmux-bench for-paths --stdin --markdown < "$paths" || echo "::notice::for-paths failed; fail open"
  exit 0
fi
# --run also runs the benches the matched areas name (`run`) and exits 1 only on a measured result over the
# area's budget_s. A missing or failing bench, a timeout with no budget, or a broken map warns and passes.
# --baselines (Leo, 2026-11-27: "A PR fetches only the baselines for its own areas"): each bench runs 3 times
# against its areas' nightly baseline on this runner class (bench-baselines-nightly.yml, R2); it is red only when
# all 3 repeats are more than 15% over. A missing baseline or an unreachable store warns and passes.
extra=""
if grep -q -- "--baselines" scripts/bench/cmux-bench 2>/dev/null; then
  extra="--repeats 3 --baselines"
fi
set +e
python3 -I scripts/bench/cmux-bench for-paths --stdin --markdown --run --timeout 120 $extra < "$paths"
code=$?
set -e
if [ "$code" -eq 1 ]; then
  echo "::error::A bench for these paths is over its budget_s, or 3 of 3 repeats are >15% over its area's nightly baseline (docs/benches/relevance-map.toml); see the Bench runs above."
  exit 1
elif [ "$code" -ne 0 ]; then
  echo "::notice::for-paths --run exited $code; fail open"
fi
'''

# A missing table is an ::error annotation on the run and never a red check. A perf label event re-runs
# it. When git could not list the paths it reads the files API, into its own file: the other steps run
# beside it and read paths.txt.
[step.perf-section]
job = "advisory"
blocks = false
class = "idle"
timeout = 180
title = "Performance table"
about = "a performance pull request records a ## Performance table of before/after deltas, or a No perf numbers line"
labels = ["perf", "performance"]
run = '''
if [ ! -f scripts/ci/pr_perf_section_check.py ]; then
  # The pull request that adds the check: its base has no check to run yet.
  echo "::notice::The base branch has no scripts/ci/pr_perf_section_check.py yet; nothing to check."
  exit 0
fi
printf '%s' "$BODY" > "$RUNNER_TEMP/perf-body.md"
paths="$RUNNER_TEMP/paths.txt"
if [ "${PATHS_LISTED:-}" != true ]; then
  paths="$RUNNER_TEMP/perf-paths.txt"
  gh api --paginate "repos/$REPOSITORY/pulls/$PR/files?per_page=100" --jq '.[] | .filename, (.previous_filename // empty)' > "$paths"
fi
size=()
# The base copy runs; one from before the light path has no size flags.
if grep -q -- "--additions" scripts/ci/pr_perf_section_check.py; then
  size=(--additions "$ADDITIONS" --deletions "$DELETIONS")
fi
python3 scripts/ci/pr_perf_section_check.py --body-file "$RUNNER_TEMP/perf-body.md" \
  --paths-file "$paths" --title "$TITLE" --labels "$LABELS" "${size[@]}"
'''

[step.cloud-backend]
job = "advisory"
blocks = false
class = "idle"
timeout = 120
title = "Cloud backend belongs in cmux-platform"
about = "a pull request that adds or changes a path in .github/cloud-backend-paths.json has a cmux-platform: line"
run = '''
if [ "${PATHS_LISTED:-}" != true ]; then
  echo "The changed paths could not be listed from git; skipped."
  exit 0
fi
if [ ! -f scripts/ci/pr_cloud_backend_check.py ] || [ ! -f .github/cloud-backend-paths.json ]; then
  # The pull request that adds the check: its base has no check or map yet.
  echo "::notice::The base branch has no cloud backend check or path map yet; nothing to check."
  exit 0
fi
printf '%s' "$BODY" > "$RUNNER_TEMP/cloud-body.md"
python3 scripts/ci/pr_cloud_backend_check.py --body-file "$RUNNER_TEMP/cloud-body.md" \
  --status-file "$RUNNER_TEMP/status.txt" --map .github/cloud-backend-paths.json \
  || echo "::warning title=Cloud backend belongs in cmux-platform::the check could not run (exit $?); see this job's log"
'''

# pr-checks.yml's advisory checks, once five jobs on five runners for every feat-cmux-next pull request push
# (24 h to 2026-11-21T12Z: 10,498 jobs and 9,754 runner-minutes, 7,132 of them split-plan's fetch of every
# branch), now steps of its one `advisory` job (CI v2 step 6, cmuxterm-hq docs/design/ci-v2.md). The job's
# "Pick the steps" step keeps each old job's conditions (drafts, CI_QUOTA_HOLD, fork pull requests, a
# base-only update, a description edit) and names the steps to run with `--only`. None ever failed a pull
# request and none does now.
#
# Leo, 2026-11-21: "we need to absolutely get that f***ing CI V2, that Borg design up and running everywhere.
# Like as much as possible, as fast as possible, as efficiently as possible".
#
# They run at once in the base checkout, so each writes only its own files under $RUNNER_TEMP (pr-size-*,
# ui-review-*, split-plan/, swift-logic*, review-link.md). The workflow step sets what they read: GH_TOKEN,
# REPOSITORY, SERVER, URL, PR, ACTION, HEAD_SHA, HEAD_REF, BASE_SHA, BASE_REF, MERGE_SHA (the event's merge
# commit) and BODY.

# Warns on a pull request over about 800 changed lines (added + deleted, less the paths in
# scripts/ci/pr_size_exclusions.json) whose body has no `Size:` line with the reason. Never a gate: Leo,
# 2026-10-28, "as long as you're mindful about it, I feel like it's reasonable, but you don't need to make it,
# like, a hard gate". One paginated GraphQL query reads the files and the current body (not the event's copy:
# a re-run of an older run must not answer with a `Size:` line the body no longer has); REST is only its
# fallback. It runs on a base-only update too: a previous head's green run from before it could fail (or that
# a later Size: edit changed) must not answer for it.
[step.pr-size]
job = "advisory"
blocks = false
class = "idle"
timeout = 300
title = "PR size"
about = "a pull request over about 800 changed lines says why in a Size: line"
run = '''
if [ ! -f scripts/ci/pr_size.py ]; then
  echo "::notice title=PR size::the base predates the size check; skipped"
  exit 0
fi
# GraphQL has its own hourly pool; the REST reads below, the GITHUB_TOKEN pool every workflow shares (it ran
# out at 00:50Z on 2026-10-31), are only the fallback. --paginate advances only a cursor named $endCursor.
# Each page repeats the body line.
# shellcheck disable=SC2016 # GraphQL's $variables, not the shell's
query='query($owner:String!,$name:String!,$number:Int!,$endCursor:String){repository(owner:$owner,name:$name){pullRequest(number:$number){body changedFiles files(first:100,after:$endCursor){pageInfo{hasNextPage endCursor} nodes{path additions deletions}}}}}'
rows='.data.repository.pullRequest | ({pull_request: {body, changed_files: .changedFiles}} | @json), (.files.nodes[] | {filename: .path, additions, deletions} | @json)'
event="$GITHUB_EVENT_PATH"
if gh api graphql --paginate -f query="$query" -f owner="${REPOSITORY%%/*}" -f name="${REPOSITORY#*/}" \
  -F number="$PR" --jq "$rows" > "$RUNNER_TEMP/pr-size-graphql.jsonl" 2>/dev/null \
  && grep -m1 '^{"pull_request":' "$RUNNER_TEMP/pr-size-graphql.jsonl" > "$RUNNER_TEMP/pr-size-live-event.json"; then
  grep -v '^{"pull_request":' "$RUNNER_TEMP/pr-size-graphql.jsonl" > "$RUNNER_TEMP/pr-size-files.jsonl" || true
  event="$RUNNER_TEMP/pr-size-live-event.json"
else
  echo "::notice title=PR size::GraphQL read failed; reading the files over REST"
  # An API error (rate limit, outage) warns and passes, as an oversized pull request does.
  if ! gh api --paginate "repos/$REPOSITORY/pulls/$PR/files?per_page=100" \
    --jq '.[] | {filename, additions, deletions} | @json' > "$RUNNER_TEMP/pr-size-files.jsonl"; then
    echo "::warning title=PR size::could not read the pull request's files; size not measured"
    exit 0
  fi
  # A failed read of the current body keeps the event's.
  if gh api "repos/$REPOSITORY/pulls/$PR" --jq '{pull_request: {body, changed_files}}' \
    > "$RUNNER_TEMP/pr-size-live-event.json" 2>/dev/null && [ -s "$RUNNER_TEMP/pr-size-live-event.json" ]; then
    event="$RUNNER_TEMP/pr-size-live-event.json"
  else
    echo "::notice title=PR size::could not read the current body; using the event's"
  fi
fi
status=0
python3 scripts/ci/pr_size.py --files "$RUNNER_TEMP/pr-size-files.jsonl" --event "$event" || status=$?
case "$status" in
  0) ;;
  3) ;;  # over the limit with no `Size:` line: the script printed the warning; never a gate
  *) echo "::warning title=PR size::the size script failed (exit $status); size not measured" ;;
esac
'''

# Webview and native UI changes carry the review loop from the aiforui course: a missing `## UI review`
# section, `Verdict:` line or `Try:` line (the command that opens the pull request in a copy of cmux NEXT,
# so a reviewer clicks through before reading the diff) warns. The changed paths come from the event's merge commit without blobs, as
# pr-body-checks.yml reads them (no API call); the paginated REST file list is only the fallback.
[step.ui-review]
job = "advisory"
blocks = false
class = "idle"
timeout = 300
title = "UI review"
about = "a pull request that changes webview or native UI files has a ## UI review section with Verdict: and Try: lines"
run = '''
if [ ! -f scripts/ci/ui_review_advisory.py ]; then
  echo "::warning title=UI review::the advisory script is not present on the base; review the UI section manually"
  exit 0
fi
paths="$RUNNER_TEMP/ui-review-paths.txt"
files="$RUNNER_TEMP/ui-review-files.json"
body_file="$RUNNER_TEMP/ui-review-body.md"
# Its own scratch repository: the other steps run beside it in the shared base checkout.
repo="$RUNNER_TEMP/ui-review-git"
listed() {
  if git init -q "$repo" && git -C "$repo" remote add origin "${URL:-}" \
    && timeout 120 git -C "$repo" fetch --no-tags --no-recurse-submodules --quiet --depth=2 --filter=blob:none origin "$MERGE_SHA" \
    && [ "$(git -C "$repo" rev-parse "$MERGE_SHA^2")" = "$HEAD_SHA" ] \
    && git -C "$repo" diff --name-only -z --no-renames "$MERGE_SHA^1" "$MERGE_SHA" | tr '\0' '\n' > "$paths"; then
    echo "changed files: $(wc -l < "$paths" | tr -d ' ') from the merge commit (git)"
    return 0
  fi
  echo "::notice title=UI review::git could not list the changed files; reading them over the API"
  timeout 120 gh api --paginate "repos/$REPOSITORY/pulls/$PR/files?per_page=100" --jq '.[].filename' > "$paths"
}
if ! listed || ! python3 -c 'import json, sys; json.dump([{"filename": l} for l in open(sys.argv[1]).read().splitlines() if l], open(sys.argv[2], "w"))' \
  "$paths" "$files"; then
  echo "::warning title=UI review::could not check out the advisory or read changed files; review the UI section manually"
  exit 0
fi
printf '%s' "$BODY" > "$body_file"
python3 scripts/ci/ui_review_advisory.py --body-file "$body_file" --files-json "$files" --pr "${PR:-}" \
  || echo "::warning title=UI review::the advisory script could not run; review the UI section manually"
'''

# The split-plan advisory (scripts/cmux-next/check-pr-split.py, the base's copy: a head branched before the
# guard has none, and a pull request should not grade itself with its own edits to it). The classifier reads
# only `merge-base`, `rev-list --count` and `diff --name-only` of the base and head commits, so a scratch
# repository fetches those two commits' last 14 days of commits and trees, no blobs, no tags, no submodules
# (cmuxterm-hq docs/handbook/whole-origin-fetch-pulls-submodule-pins.md), and deepens only when their merge
# base is older. It was a head checkout plus `git fetch --unshallow origin` of every branch: 7,132
# runner-minutes a day.
[step.split-plan]
job = "advisory"
blocks = false
class = "idle"
timeout = 540
title = "split-plan advisory"
about = "a pull request that spans many surfaces or commits gets split-plan triggers as a warning"
run = '''
if [ ! -f scripts/cmux-next/check-pr-split.py ]; then
  echo "::notice title=split-plan advisory::the base has no scripts/cmux-next/check-pr-split.py; skipped"
  exit 0
fi
repo="$RUNNER_TEMP/split-plan"
rm -rf "$repo"
git init -q "$repo"
git -C "$repo" remote add origin "$URL"
# At most four fetches (the window, its fallback, the deepen, its fallback), each bounded, inside the step's 540 s.
fetch() { timeout 120 git -C "$repo" fetch -q --no-tags --no-recurse-submodules --filter=blob:none "$@"; }
# A SHA fetch works on GitHub; the pull request's head ref and the base branch are the fallback. Either
# can find no commit that new (a head or base older than 14 days): the whole history below answers that.
fetch --shallow-since="14 days ago" origin "$BASE_SHA" "$HEAD_SHA" \
  || fetch --shallow-since="14 days ago" origin "+refs/pull/$PR/head:refs/remotes/pr/head" "+refs/heads/$BASE_REF:refs/remotes/origin/base" \
  || true
# A merge base found while the window cut history between it and the head (an old branch that merged the
# base since; a cut commit lists in .git/shallow) skews commits= and files=: deepen for it as for none.
# A window fetch that fails still records origin as a promisor remote: without GIT_NO_LAZY_FETCH a merge-base or
# rev-list over a missing commit fetches it from origin one object at a time, unbounded, and finds a merge base
# the window never had (git 2.45+), so the deepen below never ran.
mb=$(GIT_NO_LAZY_FETCH=1 git -C "$repo" merge-base "$BASE_SHA" "$HEAD_SHA" 2>/dev/null || true)
cut=""
if [ -n "$mb" ] && [ -f "$repo/.git/shallow" ]; then
  cut=$({ echo "$mb"; GIT_NO_LAZY_FETCH=1 git -C "$repo" rev-list "$mb..$HEAD_SHA"; } | grep -Fxf "$repo/.git/shallow" | head -1 || true)
fi
if [ -z "$mb" ] || [ -n "$cut" ]; then
  echo "No merge base in the last 14 days, or history cut inside the pull request; fetching the whole history of the two commits."
  # --unshallow deepens what the window fetched; a window that fetched nothing left no shallow file.
  deepen=()
  if [ -f "$repo/.git/shallow" ]; then deepen=(--unshallow); fi
  fetch "${deepen[@]}" origin "$BASE_SHA" "$HEAD_SHA" \
    || fetch "${deepen[@]}" origin "+refs/pull/$PR/head:refs/remotes/pr/head" "+refs/heads/$BASE_REF:refs/remotes/origin/base"
fi
python3 scripts/cmux-next/check-pr-split.py --repo "$repo" --base "$BASE_SHA" --head "$HEAD_SHA" --mode advisory
'''

# The pull request's own Swift logic growth, as the `swift-logic` line of its status comment
# (scripts/cmux-next/swift-logic-pr-status.py, swift-logic-delta.py): goal swift-share-falls. Lawrence
# 2026-11-02: "move as much from swift into rust as possible"; Leo 2026-11-07: "swift to anything but swift".
# A report, never a gate: growth and a count that cannot be made ("not counted") both pass. A pull request
# that changes no *.swift file gets no line. The pull request's commits are only fetched and read as data.
# Cost: one cold count (about a minute) on a pull request's first push, a few seconds after that: the
# workflow restores the facts cache under $RUNNER_TEMP/swift-logic, kept per pull request.
[step.swift-logic]
job = "advisory"
blocks = false
class = "idle"
timeout = 540
title = "Swift logic report"
about = "the pull request's own Swift logic growth, as the swift-logic line of its status comment"
run = '''
if [ ! -f scripts/cmux-next/swift-logic-pr-status.py ] || [ ! -f scripts/ci/pr_status.py ]; then
  echo "::notice title=Swift logic report::the base has no swift-logic-pr-status.py or pr_status.py; skipped"
  exit 0
fi
out="$RUNNER_TEMP/swift-logic.md"
python3 -I scripts/cmux-next/swift-logic-pr-status.py --url "$URL" --base-ref "$BASE_REF" \
  --head "$HEAD_SHA" --work "$RUNNER_TEMP/swift-logic" --out "$out" \
  || echo "Swift logic: not counted (swift-logic-pr-status.py exited $?; see this run)" > "$out"
if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then cat "$out" >> "$GITHUB_STEP_SUMMARY"; fi
if [ -s "$out" ]; then
  python3 scripts/ci/pr_status.py set --repo "$REPOSITORY" --pr "$PR" --section swift-logic --body-file "$out"
else
  python3 scripts/ci/pr_status.py set --repo "$REPOSITORY" --pr "$PR" --section swift-logic --clear
fi
'''

# Keep pull requests navigable without publishing internal gallery payloads: the visual evidence stays in the
# private HQ feed and Actions artifacts, and the pull request gets one stable link to them as the `review`
# line of its status comment (scripts/ci/pr_status.py), naming the newest head. No link to this run: it only
# writes the line, and the HQ feed would read an Actions run link here as the pull request's build.
[step.review-link]
job = "advisory"
blocks = false
class = "idle"
timeout = 300
title = "link"
about = "the review line of the pull request's status comment: its HQ feed card, gallery runs, checks and app"
run = '''
if [ ! -f scripts/ci/pr_status.py ]; then
  echo "::notice title=link::the base has no scripts/ci/pr_status.py; skipped"
  exit 0
fi
feed_url="${FEED_URL:-https://cmux-lawrences-mac-mini.tail137216.ts.net:18443/feed/}"
repo_url="$SERVER/$REPOSITORY"
ref_query=$(jq -rn --arg q "branch:$HEAD_REF" '$q|@uri')
# The branch keeps reload-build's cache warm; a name that is not shell-safe to paste falls back to the SHA.
build_ref=$HEAD_SHA
if [[ "$HEAD_REF" =~ ^[A-Za-z0-9._/-]+$ ]]; then build_ref=$HEAD_REF; fi
cat > "$RUNNER_TEMP/review-link.md" <<EOF
Review [\`${HEAD_SHA:0:7}\`]($repo_url/commit/$HEAD_SHA): [HQ feed card](${feed_url}?pr=${PR}&view=all) · [gallery before/after runs]($repo_url/actions/workflows/gallery-advisory.yml?query=$ref_query) · [checks]($repo_url/pull/$PR/checks?sha=$HEAD_SHA)
<details><summary>App of this head (app.zip, kept 1 day)</summary>

\`gh workflow run reload-build.yml -R $REPOSITORY --ref feat-cmux-next -f tag=pr$PR -f ref=$build_ref -f platform=macos -f backend_mode=local\`
</details>
EOF
python3 scripts/ci/pr_status.py set --repo "$REPOSITORY" --pr "$PR" --section review \
  --body-file "$RUNNER_TEMP/review-link.md" --legacy "<!-- cmux-gallery-link -->"
'''

# The `web-browser` job: browser suites that each had a ci-web.yml job, a runner and a checkout of their own on a
# feat-cmux-next pull request (web-instant-navigation, agent-pane-real-acpmux). ci-web.yml keeps them for a push,
# a dispatch, the post-merge batch and a pull request into another base. `inputs` cover web_subareas.py's subarea
# (a superset: its react inputs are derived from the bundle key's imports), and the step's first line asks
# web_subareas.py itself (`has`, over $CI_PATHS_FILE), so a path the globs over-route skips in a second.
[step.web-instant-navigation]
job = "web-browser"
tier = "push"
timeout = 600
title = "Instant navigation"
about = "web's instant-navigation Playwright suite against system Chrome (web/e2e/instant, test:instant)"
needs = ["bun", "node"]
inputs = [
  "web/bun.lock",
  "web/next.config.ts",
  "web/package.json",
  "web/playwright.instant.config.ts",
  "web/proxy.ts",
  "web/services/coderouter/vmGuestEnv.ts",
  "web/app/**",
  "web/data/**",
  "web/e2e/instant/**",
  "web/i18n/**",
  "web/messages/**",
  "scripts/ci/ensure-system-chrome.sh",
  "scripts/ci/web_subareas.py",
  ".github/workflows/ci-web.yml",
]
run = '''
python3 -I scripts/ci/web_subareas.py has instant || exit 0
cd web
flock "$CI_TOOLS/bun-install.lock" bun install --frozen-lockfile
# Its last line names the pinned headless shell the tests launch (test/support/systemChrome.ts reads it).
log="$(mktemp)"
bash ../scripts/ci/ensure-system-chrome.sh | tee "$log"
chrome="$(tail -n 1 "$log")"
case "$chrome" in CMUX_CHROME_HEADLESS_SHELL=*) export "$chrome" ;; esac
# web-typecheck (the linux job) type-checks web; this browser lane does not launch tsgo again.
CMUX_INSTANT_SKIP_TYPECHECK=1 bun run test:instant
'''

# ci-web.yml's react-apps-check (its 8-shard matrix and react-apps-base-check) for a feat-cmux-next pull request
# whose shard pick runs only touched tests: one runner pays the checkout, install, bundles and engines once, the
# PR-scoped rules run beside the build, and the touched tests' reds are judged on the base in the same step
# (scripts/ci/react-apps-check-fleet.sh). scripts/ci/react_apps_fleet.py decides, the same way on both sides: a push,
# full-ci, a whole-shard pick, the audit sample and CI_REACT_APPS_FLEET=0 keep the matrix, and this step exits 0.
[step.react-apps-check]
job = "web-browser"
tier = "push"
timeout = 1800
# Its verdict follows the head's base and labels too: pr_receipt.py's key pins the paths the merge changes against
# the base, and a full-ci run never takes a receipt.
title = "React apps check"
about = "webviews' source checks, bundles, PR-scoped rules and touched tests, judged against the base"
needs = ["bun", "node"]
inputs = [
  "webviews/**",
  "Resources/markdown-viewer/**",
  "config/vite-plus/**",
  "schemas/**",
  "release-notes/next/highlights/*.md",
  "web/data/**",
  "Packages/macOS/CmuxNext/Sources/**/*.xcstrings",
  "Packages/macOS/CmuxNext/Sources/**/Resources/**",
  "scripts/build-webviews-app.sh",
  "scripts/check-webviews-bun-version.sh",
  "scripts/check-webviews-diff-budget.mjs",
  "scripts/check-webviews-react-compiler.mjs",
