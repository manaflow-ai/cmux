# The one step table (the CI v2 design, "One step table").
#
# Leo, 2026-11-13: "Few jobs on warm trees; the PR runs what base runs on the tree that lands. 267 jobs
# per PR become one step table and at most 8 jobs; a landing train tests the merge result (3.81 base
# reds per 100 landings today). Advisory steps run idle-class and never block."
#
# A step is one command. It names the job that runs it (one of `jobs` below, at most 8), the paths that
# route it (`inputs`, globs; none means every change), whether it blocks, its class and its timeout;
# `alone = true` runs it by itself, after the job's other steps; `ignore` (globs) names paths among its inputs that
# route nothing (notes beside the code a step builds), and a later `!glob` there takes paths back (last match decides).
# `ci/run` (scripts/ci/ci_steps.py) routes a diff to steps and runs one job's steps in parallel. A step
# with `blocks = false` runs in the `advisory` job, in class `idle`, and its failure is a warning: the
# job still passes. tests/test_ci_step_table.py holds both rules.
#
# `tier = "push"` marks a step the pull request's own run leaves to the push tier (cmux-next-base-linux.yml runs every
# routed linux step on the feat-cmux-next tip after each landing; a red there is fixed forward). The pull request runs
# `ci/run run --tier pr`, which skips them, and the router starts no runner for a change that routes only such steps.
# The `full-ci` label, or vars.CI_PR_PIPELINE_TIER=full, runs them on the pull request again. Every step that needs a
# tool (a bun, node, rust, zig, go or zlib download and build) and every web-browser step is `push`; the rest are
# scripts that finish in seconds.
#
# `linux` steps run on the pull request's merge commit, in pr-pipeline.yml's one job, which pr-router.yml
# starts only when a step's inputs changed. `advisory` steps run from the base branch's checkout, never
# the pull request's code, and read the event from the environment the calling workflow step sets (BODY,
# TITLE, LABELS, PATHS_LISTED, ...).

# The PR pipeline's jobs (the design's table). A step names one of these; there is no ninth.
[jobs]
linux = "one warm Linux VM: route, guards, lints, Rust and web unit tests, the compile check"
web-browser = "the Playwright and gallery suites, sharded, only when routed"
mac = "a Mac holding the app tree: incremental compile and the changed targets' Swift tests"
ios = "a mini with simulators, only when routed"
advisory = "every blocks = false step, class idle, posts warnings, never fails"
verdict = "no machine: the one check may_merge reads"

# What a job's steps share, made once before them and only when one is routed. It fills $CI_TOOLS, whose
# bin leads the steps' PATH. A warm tree will hold this already; until then it is a few seconds a job.
[setup]
linux = '''
# The workflow parser the contract tests import (PyYAML, pinned). A machine whose python3 already has
# that version needs nothing; any other gets a venv beside what its python3 has.
if python3 -c 'import sys, yaml; sys.exit(yaml.__version__ != "6.0.3")' 2>/dev/null; then
  echo "python3 already has PyYAML 6.0.3"
  exit 0
fi
python3 -m venv --system-site-packages "$CI_TOOLS"
"$CI_TOOLS/bin/python" -m pip install --disable-pip-version-check --no-input --quiet PyYAML==6.0.3
'''
# The iOS job's toolchain: the Xcode pr-pipeline.yml's "Select Xcode" step chose, its Swift, and
# the iOS simulator runtimes the runner has (the steps pick an iOS 26 iPhone from them).
ios = '''
echo "DEVELOPER_DIR=${DEVELOPER_DIR:-unset}"
xcrun swift --version
xcrun simctl list runtimes available
'''
# The Mac job's toolchain: the Xcode pr-pipeline.yml's "Select Xcode" step chose (DEVELOPER_DIR), and the Swift
# it ships, named in the log before any Swift step builds. A runner with neither fails here, once, not in each step.
mac = '''
echo "DEVELOPER_DIR=${DEVELOPER_DIR:-unset}"
xcrun swift --version
'''

# What only some steps need, made only when a routed step of the job lists it in `needs` (so a pull request
# that routes no bun step never downloads bun). Each runs in the job's checkout after [setup], all at once, and
# puts its binaries in "$CI_TOOLS/bin". No root, no apt: a download into $CI_TOOLS (or the runner's tool
# cache, which a persistent runner keeps, so its next job downloads nothing).
[tools]
# The version every workflow that moved here pinned for oven-sh/setup-bun; only that exact version passes.
# Steps run at once and every `bun install` shares bun's one global cache: two at a time failed copying from it
# (ENOENT, #53426's first run). Each step's install holds "$CI_TOOLS/bun-install.lock" (flock), so the later ones find
# the cache filled and finish fast; tests/test_ci_step_table.py says every install does.
bun = 'scripts/ci/ensure-bun.sh 1.4.4 "$CI_TOOLS/bin"'
# The `24.22.1` the repository's other workflows pin for setup-node (the moved one asked for `24`).
node = '''
export RUNNER_TOOL_CACHE="${RUNNER_TOOL_CACHE:-$CI_TOOLS/tool-cache}"
export GITHUB_PATH="$CI_TOOLS/github-path"
: > "$GITHUB_PATH"
scripts/ci/ensure-setup-node.sh 24.22.1
mkdir -p "$CI_TOOLS/bin"
node_bin="$(tail -n 1 "$GITHUB_PATH")"
[ -n "$node_bin" ] || node_bin="$(dirname "$(command -v node)")"
for tool in node npm npx; do ln -sf "$node_bin/$tool" "$CI_TOOLS/bin/$tool"; done
'''
# The exact Go of daemon/remote/go.mod's `toolchain` line (setup-go's go-version-file; the daemon's release
# script refuses any other). A host go of that version is used as is. Otherwise tailnet-go.sh's Go (the host's
# Go 1.21+, or its pinned, checksummed download into $CI_TOOLS) fetches it as Go's toolchain module, checked
# against sum.golang.org, into a module cache the runner keeps (Go extracts it beside and renames it).
go = '''
want="$(sed -n 's/^toolchain \(go[0-9.]*\)$/\1/p' daemon/remote/go.mod)"
if [ "$(GOTOOLCHAIN=local go env GOVERSION 2>/dev/null)" = "$want" ]; then
  goroot="$(GOTOOLCHAIN=local go env GOROOT)"
else
  . scripts/ci/tailnet-go.sh
  ensure_tailnet_go "$CI_TOOLS"
  export GOMODCACHE="${RUNNER_TOOL_CACHE:-$CI_TOOLS}/go-toolchains"
  goroot="$(GOTOOLCHAIN="$want" go env GOROOT)"
fi
mkdir -p "$CI_TOOLS/bin"
ln -sf "$goroot/bin/go" "$goroot/bin/gofmt" "$CI_TOOLS/bin/"
"$CI_TOOLS/bin/go" version
'''
# zlib's headers and its deflate and inflate, for the CEF shim's packed-page test (test-cmux-page-path-cpp.sh) on a runner
# with no zlib.h (no apt here). zlib 1.3.1's release tarball, checked against its pinned sha256, built into a
# static libz.a under "$CI_TOOLS/zlib". A runner whose compiler already finds zlib.h needs nothing.
zlib = '''
if echo '#include <zlib.h>' | clang -x c -fsyntax-only - 2>/dev/null; then
  echo "the compiler already finds zlib.h"
  exit 0
fi
url="https://github.com/madler/zlib/releases/download/v1.3.1/zlib-1.3.1.tar.gz"
curl -fsSL --retry 3 --max-time 120 -o "$CI_TOOLS/zlib.tar.gz" "$url"
echo "9a93b2b7dfdac77ceba5a558a580e74667dd6fede4585b91eefb60f03b72df23  $CI_TOOLS/zlib.tar.gz" | sha256sum -c -
src="$CI_TOOLS/zlib-1.3.1"
tar -xzf "$CI_TOOLS/zlib.tar.gz" -C "$CI_TOOLS"
mkdir -p "$CI_TOOLS/zlib/include" "$CI_TOOLS/zlib/lib"
cp "$src/zlib.h" "$src/zconf.h" "$CI_TOOLS/zlib/include/"
objs=()
for f in adler32 crc32 deflate inffast inflate inftrees trees zutil; do
  clang -O2 -c "$src/$f.c" -o "$CI_TOOLS/zlib/$f.o"
  objs+=("$CI_TOOLS/zlib/$f.o")
done
ar rcs "$CI_TOOLS/zlib/lib/libz.a" "${objs[@]}"
'''
# rustup's proxies, so a directory's rust-toolchain.toml or the step's RUSTUP_TOOLCHAIN picks the toolchain, and
# the 1.94.0 coderouter-ci.yml pinned for dtolnay/rust-toolchain (rustup checks each download against its
# manifest). A runner with no rustup gets it the way setup-cmux-tui-rust does, from a checksummed rustup-init.
rust = '''
cargo_bin="${CARGO_HOME:-$HOME/.cargo}/bin"
if [ ! -x "$cargo_bin/rustup" ]; then
  # The ios job runs on a Mac: rustup-init for its triple, checked with the shasum macOS ships.
  case "$(uname -s)" in
    Darwin) triple="$(uname -m | sed 's/^arm64$/aarch64/')-apple-darwin"; sha256() { shasum -a 256 "$@"; } ;;
    *) triple="$(uname -m)-unknown-linux-gnu"; sha256() { sha256sum "$@"; } ;;
  esac
  url="https://static.rust-lang.org/rustup/dist/$triple/rustup-init"
  curl -fsSL --retry 3 --max-time 120 -o "$CI_TOOLS/rustup-init" "$url"
  sum="$(curl -fsSL --retry 3 --max-time 30 "$url.sha256" | cut -d' ' -f1)"
  echo "$sum  $CI_TOOLS/rustup-init" | sha256 -c -
  chmod +x "$CI_TOOLS/rustup-init"
  # A system rustc/cargo on PATH makes rustup-init refuse ("cannot install while Rust is installed"); skip that check.
  RUSTUP_INIT_SKIP_PATH_CHECK=yes "$CI_TOOLS/rustup-init" -y --profile minimal --default-toolchain none --no-modify-path
fi
"$cargo_bin/rustup" toolchain install 1.94.0 --profile minimal --component clippy,rustfmt
mkdir -p "$CI_TOOLS/bin"
for tool in rustup cargo rustc rustdoc rustfmt cargo-fmt cargo-clippy clippy-driver; do
  ln -sf "$cargo_bin/$tool" "$CI_TOOLS/bin/$tool"
done
# A persistent runner of the GHA pool (cmuxterm-hq build-fleet/swift-linux-builder/gha-runners/pool-startup.sh) keeps
# sccache in /usr/local/bin and SCCACHE_DIR in the runner user's HOME, which outlives the job, while the job-done hook
# wipes the checkout and its target/: with no wrapper every cmux_next_ daemon test run compiled all 626 crates cold
# (20 to 54 min, pr pipeline / linux, 2026-11-24). The checkout path is the same for every job of a runner user
# (/home/USER/work/cmux/cmux), so sccache's path-keyed entries hit there. cargo runs through sccache only on such a
# runner: a set RUSTC_WRAPPER (the fleet's kache) is kept, and a runner with no SCCACHE_DIR or no sccache is as before.
# Only the step table's test jobs read this cache; no release or artifact job sets the wrapper.
if [ "${GITHUB_ACTIONS:-}" = true ] && [ -z "${RUSTC_WRAPPER:-}" ] && [ -n "${SCCACHE_DIR:-}" ] \
  && [ -d "$SCCACHE_DIR" ] && [ -w "$SCCACHE_DIR" ] && command -v sccache >/dev/null 2>&1; then
  rm -f "$CI_TOOLS/bin/cargo"
  printf '#!/bin/sh\nRUSTC_WRAPPER="%s" exec "%s" "$@"\n' "$(command -v sccache)" "$cargo_bin/cargo" > "$CI_TOOLS/bin/cargo"
  chmod +x "$CI_TOOLS/bin/cargo"
  echo "cargo compiles through $(command -v sccache) into $SCCACHE_DIR"
fi
'''

# The Zig that builds libghostty-vt from the ghostty-next gitlink (scripts/install-zig-ci.sh: the reviewed, checksummed
# version the submodule asks for). A host zig of that version is used as is; any other is installed into $CI_TOOLS.
zig = '''
bash scripts/ci/init-submodule.sh ghostty-next
export GITHUB_PATH="$CI_TOOLS/zig-path" GITHUB_ENV="$CI_TOOLS/zig-env"
: > "$GITHUB_PATH"
: > "$GITHUB_ENV"
# Job-local, never sudo: a root-owned install in $CI_TOOLS failed the job at cleanup after every step passed.
# A machine that keeps RUNNER_TOOL_CACHE between jobs (a persistent runner, a build fleet pool VM whose image holds
# it) keeps the verified tarball there, so its next job checks the sha256 and unpacks, with no download.
export ZIG_TARBALL_CACHE_DIR="${ZIG_TARBALL_CACHE_DIR:-${RUNNER_TOOL_CACHE:+$RUNNER_TOOL_CACHE/zig}}"
GHOSTTY_ZIG_SOURCE=ghostty-next ZIG_FORCE_LOCAL_INSTALL=1 RUNNER_TEMP="$CI_TOOLS" ./scripts/install-zig-ci.sh
mkdir -p "$CI_TOOLS/bin"
zig_bin="$(sed -n 's/^CMUX_ZIG=//p' "$CI_TOOLS/zig-env" | tail -n 1)"
[ -x "$zig_bin" ] || { echo "no zig was installed"; exit 1; }
ln -sf "$zig_bin" "$CI_TOOLS/bin/zig"
'''

# Valgrind for the instruction-count step (Callgrind). A host valgrind is used as is; otherwise the distribution's
# package is fetched with `apt-get download` (no root: apt checks it against the signed index) and unpacked into
# $CI_TOOLS, with a wrapper that points it at its own tool directory. A runner whose apt index lacks the package (a
# hosted image ships its lists pruned: "Can't select candidate version from package valgrind") gets a job-local index
# fetched into $CI_TOOLS/apt, still signature-checked, still without root.
valgrind = '''
if command -v valgrind >/dev/null 2>&1; then
  valgrind --version
  exit 0
fi
mkdir -p "$CI_TOOLS/valgrind-deb" "$CI_TOOLS/bin"
if ! (cd "$CI_TOOLS/valgrind-deb" && apt-get download valgrind); then
  apt_dir="$CI_TOOLS/apt"
  mkdir -p "$apt_dir/lists/partial" "$apt_dir/cache/archives/partial"
  apt_opts=(-o "Dir::State::Lists=$apt_dir/lists" -o "Dir::Cache=$apt_dir/cache" -o Debug::NoLocking=1)
  echo "the host apt index has no valgrind; fetching a job-local index into $apt_dir"
  apt-get "${apt_opts[@]}" -o Acquire::Retries=3 update -qq
  (cd "$CI_TOOLS/valgrind-deb" && apt-get "${apt_opts[@]}" download valgrind)
fi
dpkg -x "$CI_TOOLS"/valgrind-deb/valgrind_*.deb "$CI_TOOLS/valgrind-root"
lib="$(dirname "$(find "$CI_TOOLS/valgrind-root" -name 'callgrind-*-linux' | head -n 1)")"
[ -d "$lib" ] || { echo "the valgrind package holds no callgrind"; exit 1; }
printf '#!/bin/sh\nVALGRIND_LIB=%s exec %s "$@"\n' "$lib" "$CI_TOOLS/valgrind-root/usr/bin/valgrind" > "$CI_TOOLS/bin/valgrind"
chmod +x "$CI_TOOLS/bin/valgrind"
"$CI_TOOLS/bin/valgrind" --version
'''

# Python contract tests that each had a workflow, a runner and a checkout of their own
# (indexnow-tests.yml, vendored-agent-cursor.yml, r2-upload-tests.yml, cmux-skill-contract.yml,
# ci-cache-receipts.yml). `inputs` is each one's former path filter.
[step.indexnow]
job = "linux"
timeout = 300
title = "IndexNow notification tests"
about = "the IndexNow notifier's tests (scripts/ci/notify-indexnow.py)"
inputs = [
  ".github/workflows/indexnow.yml",
  "scripts/ci/notify-indexnow.py",
  "tests/test_indexnow_notification.py",
  "tests/workflow_jobs.py",
  "scripts/ci/gh_expressions.py",
  "web/app/lib/indexnow.ts",
]
run = "python3 tests/test_indexnow_notification.py"

[step.update-replay-diagnostics]
job = "linux"
timeout = 60
title = "Signed update replay diagnostics"
about = "staging failures retain bounded status and check-response evidence without changing the replay verdict"
inputs = ["scripts/cmux-next/update-e2e.py", "tests/test_update_e2e_diagnostics.py"]
run = "python3 tests/test_update_e2e_diagnostics.py"

# A local reusable workflow that asks for more than its caller grants fails the caller at startup: no job runs.
# The guard lived only in ci-guards.yml's `ci` group, which a feat-cmux-next pull request skips unless labeled
# full-ci, so #55503 (base-coalesce.yml asks `actions: read`) landed at 19:08Z on 2026-11-25 with two callers
# granting none, and every cmux-next and cmux-tui artifacts run ended in startup_failure with 0 jobs until #56935
# at 20:07Z (31 runs on the artifacts workflow alone; the Cloud channel stayed on an 18:56Z commit). Its tree fails
# this step: "2 reusable-workflow permission mismatch(es) across 69 local call site(s)". Under a second, offline.
[step.cargo-proc-macros-unstripped]
job = "linux"
timeout = 120
title = "Cargo proc-macros unstripped"
about = "every Cargo.toml whose release profile strips also sets `[profile.release.build-override] strip = false`, so Xcode 27's strip can't break proc-macro dylibs (rustc E0463)"
inputs = ["**/Cargo.toml", "tests/test_cargo_proc_macros_unstripped.py"]
run = "python3 tests/test_cargo_proc_macros_unstripped.py"

[step.reusable-workflow-permissions]
job = "linux"
timeout = 120
title = "Reusable workflow permissions"
about = "every local `uses: ./.github/workflows/*.yml` call stays within its caller's permissions, so no workflow fails at startup"
inputs = [
  ".github/workflows/**",
  "scripts/ci/check_reusable_workflow_permissions.py",
  "tests/test_ci_reusable_workflow_permissions.py",
]
run = "python3 tests/test_ci_reusable_workflow_permissions.py"

# The compile preflight's own rules (cmux-next-compile-preflight.yml: no tier gate, no job-level if:, the build
# NIGHTLY runs; scripts/ci/compile_preflight.py's web-touched and error lines). It ran as a step of the preflight job
# on every pull request head, 14-15 s of a 40 s run that changed no web source, ~1.8k runner-min/day; here it runs
# when one of the files it tests changes.
[step.compile-preflight-rules]
job = "linux"
timeout = 60
title = "Compile preflight rules"
about = "the compile preflight runs on every tier, skips only heads no web bundle reads, and names the bundler's errors"
inputs = [
  ".github/workflows/cmux-next-compile-preflight.yml",
  ".github/workflows/cmux-next-size-budget.yml",
  ".github/workflows/pr-pipeline.yml",
  ".github/workflows/pr-router.yml",
  ".github/actions/r2-artifact/**",
  "scripts/ci/compile_preflight.py",
  "scripts/ci/react-apps-check-fleet.sh",
  "scripts/ci/pr_router.json",
  "scripts/ci/pr_router.py",
  "scripts/ci/workflow_paths_cover_inputs.py",
  "scripts/cmux-next/web-bundle-key.py",
  "scripts/cmux-next/build-web-bundles.sh",
  "tests/test_ci_compile_preflight.py",
]
run = "python3 -I tests/test_ci_compile_preflight.py"

# Packages/Shared/CmuxAgentCursor is vendored verbatim from manaflow-ai/cmux-cua at CMUX_CUA_PINNED_SHA
# (scripts/cmux_agent_cursor_vendor.py). This fails when the copy was edited by hand or the pin moved
# without a re-sync.
[step.vendored-agent-cursor]
job = "linux"
timeout = 300
title = "Vendored agent cursor"
about = "Packages/Shared/CmuxAgentCursor is the pinned upstream copy, unedited"
inputs = [
  "Packages/Shared/CmuxAgentCursor/**",
  "scripts/cmux_agent_cursor_vendor.py",
  "tests/test_vendored_cmux_agent_cursor.py",
  "tests/git_fixture_env.py",
]
run = "python3 tests/test_vendored_cmux_agent_cursor.py"

[step.r2-upload]
job = "linux"
timeout = 300
title = "R2 upload tests"
about = "the release uploaders and publishers: R2 object upload, GitHub release publication, the cmux-tui artifact retry, Mac live delivery"
inputs = [
  ".github/workflows/nightly.yml",
  ".github/workflows/release.yml",
  ".github/workflows/cmux-tui-artifacts.yml",
  "scripts/ci/publish-release-assets.py",
  "scripts/ci/finalize-release.py",
  "tests/test_github_release_publication.py",
  "scripts/ci/upload-r2-object.py",
  "tests/test_ci_r2_upload_python.sh",
  "tests/test_r2_upload_requests.py",
  "scripts/ci/cmux_tui_artifacts_retry.py",
  "tests/test_cmux_tui_artifacts_retry.py",
  "tests/test_mac_live_delivery.py",
  # What test_mac_live_delivery.py reads through tests/runs_on_labels.py.
  "tests/runs_on_labels.py",
  "tests/workflow_jobs.py",
  "tests/test_ci_fleet_rule_lints.py",
  "tests/fleet-rule-allowlist.json",
  "scripts/ci/gh_expressions.py",
  "scripts/ci/repair-nightly-appcast-content-types.py",
]
run = '''
bash tests/test_ci_r2_upload_python.sh
python3 tests/test_github_release_publication.py
# finalize-release.py runs only at real publish time; at least prove it loads.
python3 scripts/ci/finalize-release.py publish --help
python3 scripts/ci/finalize-release.py download --help
python3 tests/test_cmux_tui_artifacts_retry.py
python3 tests/test_mac_live_delivery.py
# The uploader's CLI and the headers R2 receives (scripts/ci/upload-r2-object.py).
python3 tests/test_r2_upload_requests.py
'''

# ci-guards.yml's release-notary group (the nightly, signing and cmux-tui publication guards), which a
# feat-cmux-next pull request reached only through cmux-next-guards.yml's ci-guard-group: a Tier B
# pull_request_skip job (scripts/ci/affected-jobs.json), so it was skipped there. #53861, #56394, #53840 and
# #54859 added nightly.yml jobs and #55067 a cmux-tui-artifacts.yml one without the guard lists naming them, and
# the guards went red only on the feat-cmux-next push. A change to a nightly or cmux-tui workflow, the step
# coverage list or one of the guard tests now runs the release-notary steps it reaches before the merge.
[step.nightly-guards]
job = "linux"
# Alone: its steps run at once on every CPU (8 on the pool, 175-359 s for the whole guard group there).
alone = true
timeout = 1200
title = "Nightly and cmux-tui release guards"
about = "the release-notary guard steps (nightly routing, signing runners, owned minis, step coverage, cmux-tui publication) that a change to the nightly or cmux-tui workflows reaches"
inputs = [
  ".github/workflows/nightly*.yml",
  ".github/workflows/cmux-tui*.yml",
  ".github/nightly-step-coverage.json",
  "tests/test_nightly_*",
  "tests/test_cmux_tui_*",
  "tests/test_ci_recovery_runs_after_a_timeout.py",
  "scripts/ci/nightly_guard_steps.py",
  "tests/test_nightly_guard_steps.py",
]
run = '''
python3 tests/test_nightly_guard_steps.py
python3 scripts/ci/nightly_guard_steps.py
'''

# ci-guards.yml's ci group, which a feat-cmux-next pull request reached only through cmux-next-guards.yml's
# ci-guard-group: a Tier B pull_request_skip job (scripts/ci/affected-jobs.json), so it was skipped there. #57964
# added a bare urlopen of files-next.cmux.com (the CDN refuses Python-urllib's agent, 403 error code 1010) and
# test_ci_cdn_user_agent.py, which finds that read, went red only on the feat-cmux-next push (cas/1 replay; fixed
# by #59707). Any Python or JSON change now runs it before the merge.
[step.cdn-user-agent]
job = "linux"
timeout = 300
title = "CDN readers name their client"
about = "every read of a cmux CDN host (files-next.cmux.com and the rest) sends a User-Agent, since the CDN refuses Python-urllib's default with 403 error code 1010"
inputs = ["**/*.py", "**/*.json"]
run = '''
python3 tests/test_ci_cdn_user_agent.py
'''

# The other cheap (under 2 s each) pure-Python guards of ci-guards.yml's ci group that a feat-cmux-next pull
# request skipped for the same reason (cdn-user-agent, above), on the scripts and workflows they read.
[step.ci-group-guards]
job = "linux"
timeout = 300
title = "CI tooling guards (timing readout, repo variables, iOS fast verdict, proof record and UI proof, routed jobs, pair scope)"
about = "the ci guard group's quick unit tests: the CI timing readout, the repository variable check, the iOS fast verdict, the proof record and UI proof verdict, routed job dependencies and pair-run attachment selection"
inputs = [
  ".github/workflows/**",
  "scripts/ci/ci_timing_readout.py",
  "scripts/ci/check_repo_variables.py",
  "scripts/ci/ios_fast_verdict.*",
  "scripts/ci/ios_fast_dispatch.py",
  "scripts/ci/proof_record.py",
  "scripts/ci/ui_proof_verdict.py",
  "scripts/cmux-next/hot-verify.py",
  "scripts/ci/ios_verify.py",
  "scripts/ci/ios_gate_screen_diff.py",
  "scripts/ci/ios-verify.sh",
  "ci/proof-record/**",
  "cmux-next-ios/FlowSuite/**",
  "tests/test_ci_proof_record.py",
  "tests/test_ci_ui_proof_verdict.py",
  "tests/test_ci_timing_readout.py",
  "tests/test_ci_check_repo_variables.py",
  "tests/test_ci_ios_fast_verdict.py",
  "tests/test_ci_ios_fast_dispatch.py",
  "tests/test_ci_routed_jobs_check_needs.py",
  "scripts/ci/cmux_next_pair_e2e.py",
  "tests/test_cmux_next_pair_e2e_guards.py",
]
run = '''
status=0
python3 tests/test_ci_timing_readout.py || status=1
