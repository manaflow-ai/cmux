# The one step table (the CI v2 design, "One step table").
#
# Leo, 2026-11-13: "Few jobs on warm trees; the PR runs what base runs on the tree that lands. 267 jobs
# per PR become one step table and at most 8 jobs; a landing train tests the merge result (3.81 base
# reds per 100 landings today). Advisory steps run idle-class and never block."
#
# A step is one command. It names the job that runs it (one of `jobs` below, at most 8), the paths that
# route it (`inputs`, globs; none means every change), whether it blocks, its class and its timeout;
# `alone = true` runs it by itself, after the job's other steps.
# `ci/run` (scripts/ci/ci_steps.py) routes a diff to steps and runs one job's steps in parallel. A step
# with `blocks = false` runs in the `advisory` job, in class `idle`, and its failure is a warning: the
# job still passes. tests/test_ci_step_table.py holds both rules.
#
# `linux` steps run on the pull request's merge commit, in pr-pipeline.yml's one job, which pr-router.yml
# starts only when a step's inputs changed. `advisory` steps run from the base branch's checkout, never
# the pull request's code, and read the event from the environment the calling workflow step sets (BODY,
# TITLE, LABELS, PATHS_LISTED, ...).

# The PR pipeline's jobs (the design's table). A step names one of these; there is no ninth.
[jobs]
linux = "one warm Linux VM: route, guards, lints, Rust and web unit tests, the compile check"
web-browser = "the Playwright and gallery suites, sharded, only when routed"
mac = "a Mac holding the app tree: incremental compile and the changed targets' Swift tests"
ios = "a mini with simulators, only when routed"
advisory = "every blocks = false step, class idle, posts warnings, never fails"
verdict = "no machine: the one check may_merge reads"

# What a job's steps share, made once before them and only when one is routed. It fills $CI_TOOLS, whose
# bin leads the steps' PATH. A warm tree will hold this already; until then it is a few seconds a job.
[setup]
linux = '''
# The workflow parser the contract tests import (PyYAML, pinned). A machine whose python3 already has
# that version needs nothing; any other gets a venv beside what its python3 has.
if python3 -c 'import sys, yaml; sys.exit(yaml.__version__ != "6.0.3")' 2>/dev/null; then
  echo "python3 already has PyYAML 6.0.3"
  exit 0
fi
python3 -m venv --system-site-packages "$CI_TOOLS"
"$CI_TOOLS/bin/python" -m pip install --disable-pip-version-check --no-input --quiet PyYAML==6.0.3
'''
# The Mac job's toolchain: the Xcode pr-pipeline.yml's "Select Xcode" step chose (DEVELOPER_DIR), and the Swift
# it ships, named in the log before any Swift step builds. A runner with neither fails here, once, not in each step.
mac = '''
echo "DEVELOPER_DIR=${DEVELOPER_DIR:-unset}"
xcrun swift --version
'''

# What only some steps need, made only when a routed step of the job lists it in `needs` (so a pull request
# that routes no bun step never downloads bun). Each runs in the job's checkout after [setup], all at once, and
# puts its binaries in "$CI_TOOLS/bin". No root, no apt: a download into $CI_TOOLS (or the runner's tool
# cache, which a persistent runner keeps, so its next job downloads nothing).
[tools]
# The version every workflow that moved here pinned for oven-sh/setup-bun; only that exact version passes.
# Steps run at once and every `bun install` shares bun's one global cache: two at a time failed copying from it
# (ENOENT, #53426's first run). Each step's install holds "$CI_TOOLS/bun-install.lock" (flock), so the later ones find
# the cache filled and finish fast; tests/test_ci_step_table.py says every install does.
bun = 'scripts/ci/ensure-bun.sh 1.4.4 "$CI_TOOLS/bin"'
# The `24.22.1` the repository's other workflows pin for setup-node (the moved one asked for `24`).
node = '''
export RUNNER_TOOL_CACHE="${RUNNER_TOOL_CACHE:-$CI_TOOLS/tool-cache}"
export GITHUB_PATH="$CI_TOOLS/github-path"
: > "$GITHUB_PATH"
scripts/ci/ensure-setup-node.sh 24.22.1
mkdir -p "$CI_TOOLS/bin"
node_bin="$(tail -n 1 "$GITHUB_PATH")"
[ -n "$node_bin" ] || node_bin="$(dirname "$(command -v node)")"
for tool in node npm npx; do ln -sf "$node_bin/$tool" "$CI_TOOLS/bin/$tool"; done
'''
# The exact Go of daemon/remote/go.mod's `toolchain` line (setup-go's go-version-file; the daemon's release
# script refuses any other). A host go of that version is used as is. Otherwise tailnet-go.sh's Go (the host's
# Go 1.21+, or its pinned, checksummed download into $CI_TOOLS) fetches it as Go's toolchain module, checked
# against sum.golang.org, into a module cache the runner keeps (Go extracts it beside and renames it).
go = '''
want="$(sed -n 's/^toolchain \(go[0-9.]*\)$/\1/p' daemon/remote/go.mod)"
if [ "$(GOTOOLCHAIN=local go env GOVERSION 2>/dev/null)" = "$want" ]; then
  goroot="$(GOTOOLCHAIN=local go env GOROOT)"
else
  . scripts/ci/tailnet-go.sh
  ensure_tailnet_go "$CI_TOOLS"
  export GOMODCACHE="${RUNNER_TOOL_CACHE:-$CI_TOOLS}/go-toolchains"
  goroot="$(GOTOOLCHAIN="$want" go env GOROOT)"
fi
mkdir -p "$CI_TOOLS/bin"
ln -sf "$goroot/bin/go" "$goroot/bin/gofmt" "$CI_TOOLS/bin/"
"$CI_TOOLS/bin/go" version
'''
# rustup's proxies, so a directory's rust-toolchain.toml or the step's RUSTUP_TOOLCHAIN picks the toolchain, and
# the 1.94.0 coderouter-ci.yml pinned for dtolnay/rust-toolchain (rustup checks each download against its
# manifest). A runner with no rustup gets it the way setup-cmux-tui-rust does, from a checksummed rustup-init.
rust = '''
cargo_bin="${CARGO_HOME:-$HOME/.cargo}/bin"
if [ ! -x "$cargo_bin/rustup" ]; then
  url="https://static.rust-lang.org/rustup/dist/$(uname -m)-unknown-linux-gnu/rustup-init"
  curl -fsSL --retry 3 --max-time 120 -o "$CI_TOOLS/rustup-init" "$url"
  sum="$(curl -fsSL --retry 3 --max-time 30 "$url.sha256" | cut -d' ' -f1)"
  echo "$sum  $CI_TOOLS/rustup-init" | sha256sum -c -
  chmod +x "$CI_TOOLS/rustup-init"
  # A system rustc/cargo on PATH makes rustup-init refuse ("cannot install while Rust is installed"); skip that check.
  RUSTUP_INIT_SKIP_PATH_CHECK=yes "$CI_TOOLS/rustup-init" -y --profile minimal --default-toolchain none --no-modify-path
fi
"$cargo_bin/rustup" toolchain install 1.94.0 --profile minimal --component clippy,rustfmt
mkdir -p "$CI_TOOLS/bin"
for tool in rustup cargo rustc rustdoc rustfmt cargo-fmt cargo-clippy clippy-driver; do
  ln -sf "$cargo_bin/$tool" "$CI_TOOLS/bin/$tool"
done
'''

# The Zig that builds libghostty-vt from the ghostty-next gitlink (scripts/install-zig-ci.sh: the reviewed, checksummed
# version the submodule asks for). A host zig of that version is used as is; any other is installed into $CI_TOOLS.
zig = '''
bash scripts/ci/init-submodule.sh ghostty-next
export GITHUB_PATH="$CI_TOOLS/zig-path" GITHUB_ENV="$CI_TOOLS/zig-env"
: > "$GITHUB_PATH"
: > "$GITHUB_ENV"
GHOSTTY_ZIG_SOURCE=ghostty-next ZIG_SYSTEM_PREFIX="$CI_TOOLS/zig-prefix" RUNNER_TEMP="$CI_TOOLS" ./scripts/install-zig-ci.sh
mkdir -p "$CI_TOOLS/bin"
zig_bin="$(sed -n 's/^CMUX_ZIG=//p' "$CI_TOOLS/zig-env" | tail -n 1)"
[ -x "$zig_bin" ] || { echo "no zig was installed"; exit 1; }
ln -sf "$zig_bin" "$CI_TOOLS/bin/zig"
'''

