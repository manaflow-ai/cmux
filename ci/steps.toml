title = "App Store shelf"
about = "every App Store listing installs and shows something (the three cmux-tui shelf tests run and pass)"
needs = ["rust", "zig"]
# The nightly's shelf job runs the same script on the build commit; its red reds the run and files
# report-nightly-shelf-red (it holds no publish since 2026-11-25). cmux#46903 reached it only through
