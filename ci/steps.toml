# cmux-tui-artifacts.yml's `cmux_next_ daemon tests` job, which ran after the branch push only (its pass writes the
# tree's daemon-tests marker, which that workflow keeps). The same cargo test, on the pull request's merge commit:
# only the workspace members whose sources name cmux_next_, retried only on a recognized Cargo fetch failure.
[step.cmux-next-daemon-tests]
job = "linux"
tier = "push"
# 22 to 27 minutes of test compile cold (a few warm from the push's saved target), then the tests: the job's own
# 65-minute bound for this step.
alone = true
timeout = 3900
title = "cmux_next_ daemon tests"
about = "the cmux_next_ daemon tests of the cmux-tui workspace members that name them pass, on Linux, in a home of their own"
needs = ["rust", "zig"]
inputs = [
  "cmux-tui/**",
  "schemas/settings/**",
  "scripts/ci/cmux-next-daemon-test-packages.sh",
  "scripts/cmux-next/cargo-locks.py",
  "scripts/ci/cmux-tui-test-target.sh",
  "scripts/ci/r2-cache.sh",
  "scripts/blacksmith-testbox-source-mtimes.py",
  "scripts/ci/crate_results.py",
  "ghostty-next",
]
run = '''
cd cmux-tui
# Each crate's tests are reused when its own inputs (its files, its path dependencies' files, what its sources name
# outside it, Cargo.lock, the toolchain) passed before anywhere in the fleet: scripts/ci/crate_results.py. Only the
# crates that missed run; when none did, nothing is installed, restored or compiled.
# It prints REUSED_ALL for that; any other failure (no output) runs every crate.
crates="$(mktemp /tmp/cmux-next-crates.XXXXXX.json)"
all_members="$(../scripts/ci/cmux-next-daemon-test-packages.sh)"
plan="$(python3 ../scripts/ci/crate_results.py plan "$crates" -- $all_members || true)"
if [ "$plan" = REUSED_ALL ]; then
  echo "cmux_next_ test members: every one reused; nothing to run"
  rm -f "$crates"
  exit 0
fi
[ -n "$plan" ] || plan="$all_members"
read -r -a members <<<"$plan"
channel="$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' rust-toolchain.toml)"
rustup toolchain install "$channel" --profile minimal --component clippy,rustfmt
# The build env cmux-tui-artifacts.yml's feat-cmux-next push job tests with, so its saved target is fresh here: no
# incremental state (it only fills the disk), the ghostty-next gitlink's sources, Zig from PATH.
export CARGO_NET_RETRY=10 CARGO_HTTP_TIMEOUT=120 CARGO_HTTP_MULTIPLEXING=false TMPDIR=/tmp CMUX_GHOSTTY_SRC=""
# Fork pull requests use a 4-vCPU Linux runner. Keep cold rustc fan-out within that
# runner's memory budget after an unrestricted compile killed rustc with SIGKILL.
export GHOSTTY_ZIG_SOURCE=ghostty-next CARGO_INCREMENTAL=0 CARGO_BUILD_JOBS=2
unset CMUX_ZIG ZIG
# The last feat-cmux-next push's build (read only; a miss builds cold): unchanged crates are not compiled again.
../scripts/ci/cmux-tui-test-target.sh restore
home="$(mktemp -d /tmp/acpmux-home.XXXXXX)"
export ACPMUX_HOME="$home" ACPMUX_SOCKET=""
log="$(mktemp /tmp/cmux-next-tests.XXXXXX.txt)"
echo "cmux_next_ test members: ${members[*]}"
status=1
for attempt in 1 2 3; do
  cargo test "${members[@]}" --locked cmux_next_ 2>&1 | tee "$log"
  status=${PIPESTATUS[0]}
  if [ "$status" -ne 0 ] && python3 ../scripts/cmux-next/cargo-locks.py explain "$log"; then break; fi
  if [ "$status" -eq 0 ]; then
    grep -qE 'test result: ok\. [1-9][0-9]* passed' "$log" && break
    echo "::error::cargo test ran no cmux_next_ test (the filter matched nothing)"
    status=1
    break
  fi
  if grep -qE 'test result: FAILED|error(\[E[0-9]+\])?: could not compile|^error\[E[0-9]+\]' "$log" \
    || ! grep -qiE 'spurious network error|failed to download|unable to update registry|failed to (fetch|get|query)|could not resolve host|couldn.t resolve host|connection (reset|refused|timed out)|operation timed out|ssl (connect )?error|http2 error|early eof|download of .* failed|registry index .*(failed|error)' "$log"; then
    echo "::error::cmux_next_ daemon tests failed with a result that is not a Cargo fetch failure; not retrying"
    break
  fi
  [ "$attempt" -lt 3 ] && sleep $((attempt * 10))
done
# The compile cache's hits and misses, when the rust tool sent cargo through the runner's sccache.
case "$(head -c 300 "$(command -v cargo)" 2>/dev/null | tr -d '\0')" in
  *RUSTC_WRAPPER=*sccache*) sccache --show-stats || true ;;
esac
# End the daemon of this home and its agents, then delete the home (a path this step made).
acpmux="$(command -v acpmux || true)"
[ -z "$acpmux" ] || env -u ACPMUX_SOCKET ACPMUX_HOME="$home" "$acpmux" daemon shutdown --end-agents || true
rm -rf "$home" "$log"
[ "$status" -ne 0 ] || python3 ../scripts/ci/crate_results.py post "$crates" || true
rm -f "$crates"
exit "$status"
'''

# The settings-keys half of the cmux_next_ daemon tests above, on the pull request itself. That step's inputs are
# whole-directory globs (`cmux-tui/**`, `schemas/settings/**`), so --pr-scope leaves it to the post-merge batch and
# cmux-tui-artifacts.yml (which a lane/** push does not run): a pull request that added a settings row without its
# published-keys.txt line merged green and failed the channel's gate after the merge. From 2026-11-25 21:43Z to
# 2026-11-26 21:26Z every feat-cmux-next artifacts run failed that gate (the last cause: 36 live rows missing from
# published-keys.txt, fixed by #59554), and the channel held every merged daemon fix meanwhile. This step names the
# files a settings row lives in, so a pull request that touches one runs the one test, cmux-config's published_keys:
# about 150 s cold on a 32-vCPU host (2m29s compile, the test 0.05 s), nothing on a pull request that touches none.
[step.settings-published-keys]
job = "linux"
tier = "push"
timeout = 360
title = "Settings keys are published or retired"
about = "every live settings row is in schemas/settings/published-keys.txt, and every published key is a row or has a retired-keys.json entry (cmux-config's published_keys test, one of the cmux_next_ daemon tests)"
needs = ["rust"]
inputs = [
  "schemas/settings/settings-schema.json",
  "schemas/settings/published-keys.txt",
  "schemas/settings/retired-keys.json",
  "schemas/settings/source/*.json",
  "schemas/settings/source/*/*.json",
  "cmux-tui/crates/cmux-config/tests/published_keys.rs",
  "cmux-tui/crates/cmux-config/src/schema/*.rs",
  "cmux-tui/crates/cmux-config/Cargo.toml",
]
run = '''
cd cmux-tui
channel="$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' rust-toolchain.toml)"
rustup toolchain install "$channel" --profile minimal
export CARGO_NET_RETRY=10 CARGO_HTTP_TIMEOUT=120 CARGO_INCREMENTAL=0
cargo test -p cmux-config --locked --test published_keys cmux_next_
'''

# Six more checks whose feat-cmux-next pull request runs each took a Linux job: risk-tier-tests.yml's tests,
# cmux-next-crash-class.yml's crash-class, cmux-cloud-cli.yml's test, cmux-vm-cloud.yml's check,
# app-store-shelf.yml's shelf and cmux-vm-clients.yml's rust. A feat-cmux-next pull request runs the same commands
# here; each workflow keeps its other runs (pushes, dispatch, pull requests into other bases). `inputs` is each
# workflow's former pull_request path filter. A failure in one command of a step does not stop the step's others,
# as the jobs' `!cancelled()` steps did. Failure-only artifact uploads (a regenerated client or contract) are not
# steps: a failed step prints its `git diff --stat`. The cargo steps are `alone`, so their compile does not raise
# the shared wave bound. helm-chart.yml (helm, which no tool supplies, on an ephemeral runner for untrusted chart
# input) and cloud-vm-guest-install.yml (a Postgres service container) stay in their workflows.

# risk-tier-tests.yml ran on pull requests into feat-cmux-next only; it now runs on dispatch alone.
# 6 s on an 8-CPU lane machine; the job's bound was 5 min.
[step.risk-tier-tests]
job = "linux"
timeout = 300
title = "risk tier tests"
about = "the risk classifier's unit tests (scripts/ci/risk_tier.py) pass"
inputs = [
  "scripts/ci/risk_tier.py",
  "tests/test_risk_tier.py",
  "tests/git_fixture_env.py",
  "tests/fleet_test_host.py",
  ".github/workflows/risk-tier-tests.yml",
]
run = '''
python3 tests/test_risk_tier.py -v
'''

# On a merge commit (a pull request's) the gate fails only for findings in the files the change touches (--pr), as
# the job's pull request runs did; on a commit with one parent it keeps the whole-tree verdict, as the push run did.
# 125 s on an 8-CPU lane machine (the whole-tree gate and the five rule checks); the job's bound was 5 min.
[step.cmux-next-crash-class]
job = "linux"
timeout = 300
title = "cmux-next crash-class rules"
about = "CmuxNext Sources pass the crash-class concurrency rules, their rule tests, the unrecognized-selector rule and the Chromium Objective-C contract"
inputs = [
  "Packages/macOS/CmuxNext/Sources/**",
  "Packages/macOS/CmuxNext/Package.swift",
  "scripts/cmux-next/check-concurrency.sh",
  "scripts/cmux-next/check-main-actor-work.py",
  "scripts/cmux-next/swift_scope.py",
  "tests/test_check_concurrency_generic_deinit.py",
  "tests/test_check_concurrency_pipe_reads.py",
  "tests/test_check_concurrency_caller_isolated.py",
  "scripts/cmux-next/caller_isolation.py",
  "scripts/cmux-next/caller-isolated-blocking-pending.json",
  "scripts/ci/crash-class-gate.sh",
  "scripts/ci/pr_owned_findings.py",
  "scripts/cmux-next/check-objc-selectors.py",
  "scripts/cmux-next/objc-selector-table.json",
  "scripts/cmux-next/check-cef-objc-contract.py",
  "scripts/cmux-next/chromium-objc-contract.json",
  "scripts/cmux-next/cef-manifest.json",
  "scripts/cmux-next/check-bridge-on-main.py",
  "scripts/cmux-next/bridge-on-main-baseline.json",
  "tests/test_check_bridge_on_main.py",
  ".github/workflows/cmux-next-crash-class.yml",
]
run = '''
scope=()
git rev-parse -q --verify 'HEAD^2' >/dev/null && scope=(--pr)
status=0
scripts/ci/crash-class-gate.sh "${scope[@]}" || status=1
python3 -I tests/test_check_concurrency_generic_deinit.py || status=1
python3 -I tests/test_check_concurrency_pipe_reads.py || status=1
python3 -I tests/test_check_concurrency_caller_isolated.py || status=1
python3 -I tests/test_check_bridge_on_main.py || status=1
python3 -I scripts/cmux-next/check-objc-selectors.py || status=1
python3 -I scripts/cmux-next/check-cef-objc-contract.py || status=1
exit "$status"
'''

# The job's 2026-11 runs took about 2 min (its bound was 30). Its tests need no database.
[step.cmux-vm-cloud]
job = "linux"
tier = "push"
timeout = 360
title = "cmux VM cloud API"
about = "the backend API typechecks, the protocol catalog and generated clients match, the Team VM and server pairing tests pass, and backend sources stay under the size limit"
needs = ["bun", "node"]
inputs = [
  "workers/cmux-vm/sdk/**",
  "workers/cmux-vm/src/**",
  "libs/vm-instance-identity/**",
  "backend/apps/api/src/team-vm-api*",
  "backend/apps/api/test/team-vm-api*",
  ".github/workflows/cmux-vm-cloud.yml",
]
run = '''
cd backend
flock "$CI_TOOLS/bun-install.lock" bun install --frozen-lockfile
status=0
(cd apps/api && bun run typecheck) || status=1
if bun run catalog:export && bun run catalog:client && bun run catalog:rust; then
  paths=(catalog/cloud-operations.json ../clients/ts/cloud/src/generated.ts ../cmux-tui/crates/cmux-cloud-wire/src/generated)
  if [[ -n "$(git status --porcelain -- "${paths[@]}")" ]]; then
    git --no-pager diff --stat -- "${paths[@]}"
    echo "::error::Protocol catalog or generated clients are stale: run bun run catalog:export, catalog:client and catalog:rust in backend and commit the result"
    status=1
  fi
else
  status=1
fi
(cd apps/api && bun run test -- test/team-vm-api) || status=1
(cd apps/api && bun run test -- test/team-vm-bind.test.ts test/team-vm.test.ts test/team-vm-taint.test.ts test/team-vm-retired-fence.test.ts test/team-vm-export.test.ts) || status=1
(cd apps/api && bun run test -- test/server-pairing.test.ts test/server-pairing-failures.test.ts) || status=1
bun run lint:size || status=1
exit "$status"
'''

# The job's 15-minute bound. Warnings never fail a pull request's compile (Leo, 2026-11-19): CI_WARNINGS is soft on
# a pull request, deny in the post-merge batch. The job's release binary upload (cmux-cloud-cli-<sha>) stays with
# the workflow's push and dispatch runs; here the musl release build only has to succeed.
[step.cmux-cloud-cli]
job = "linux"
tier = "push"
timeout = 900
alone = true
title = "cmux cloud CLI"
about = "cmux-cloud-cli and cmux-cloud-wire are rustfmt-clean, pass clippy and their tests, and the CLI builds for x86_64 musl"
needs = ["rust"]
inputs = [
  "cmux-tui/crates/cmux-cloud-cli/**",
  "cmux-tui/crates/cmux-cloud-wire/**",
  "backend/catalog/cloud-operations.json",
  "backend/catalog/cloud-vectors.json",
  "cmux-tui/Cargo.*",
  ".github/workflows/cmux-cloud-cli.yml",
]
run = '''
cd cmux-tui
channel="$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' rust-toolchain.toml)"
rustup toolchain install "$channel" --profile minimal --component clippy,rustfmt
export CARGO_NET_RETRY=10 CARGO_HTTP_TIMEOUT=120 CARGO_INCREMENTAL=0
[ -z "${GITHUB_BASE_REF:-}" ] || export CI_WARNINGS=soft
status=0
cargo fmt -p cmux-cloud-cli -p cmux-cloud-wire --check || status=1
python3 ../scripts/ci/warnings_policy.py run -- cargo clippy -p cmux-cloud-cli -p cmux-cloud-wire --locked --all-targets -- -D warnings || status=1
cargo test -p cmux-cloud-cli -p cmux-cloud-wire --locked || status=1
rustup target add x86_64-unknown-linux-musl --toolchain "$channel" || status=1
cargo build -p cmux-cloud-cli --release --locked --target x86_64-unknown-linux-musl || status=1
exit "$status"
'''

