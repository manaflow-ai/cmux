# ci-web.yml's web-production-build job: `bun run vercel-build` with the job's build-only env (no secrets: placeholder
# keys and an unreachable database URL). `inputs` cover web_subareas.py's production_build subarea (a superset: its
# web/e2e, web/tests and test-runner exclusions are left to the step's first line, `has production_build`). It runs
# `alone`: `next build` writes web/.next/types and web/next-env.d.ts, which web's tsconfig includes, so beside the
# web-typecheck step it could change what tsgo reads mid-run. 145 s on 8 CPUs, alone, warm bun cache.
[step.web-production-build]
job = "linux"
timeout = 360
alone = true
title = "Web production build"
about = "web compiles and bundles for production (bun run vercel-build); web-typecheck reports type errors"
needs = ["bun"]
inputs = [
  "web/**",
  ".npmrc",
  ".vercelignore",
  "CHANGELOG.md",
  "bun.lock",
  "bunfig.toml",
  "config/iroh/managed-relay-catalog.json",
  "package.json",
  "vercel.json",
  "workers/presence/src/generated/managedRelayCatalog.ts",
  "scripts/ci/web_subareas.py",
  ".github/workflows/ci-web.yml",
]
run = '''
python3 -I scripts/ci/web_subareas.py has production_build || exit 0
cd web
flock "$CI_TOOLS/bun-install.lock" bun install --frozen-lockfile
export RESEND_API_KEY=re_ci_build
export CMUX_FEEDBACK_FROM_EMAIL=ci@example.test
export STACK_SECRET_SERVER_KEY=ci-build-only
export NEXT_PUBLIC_STACK_PROJECT_ID=00000000-0000-4000-8000-000000000000
export NEXT_PUBLIC_STACK_PUBLISHABLE_CLIENT_KEY=ci-build-only
export DATABASE_URL=postgres://cmux:cmux@127.0.0.1:1/cmux
export DIRECT_DATABASE_URL=postgres://cmux:cmux@127.0.0.1:1/cmux
export CMUX_ANALYTICS_TEST_MODE=1
# web-typecheck reports type errors; this build proves the app compiles and bundles (web/next.config.ts).
export CMUX_CI_TYPECHECK_SEPARATE=1
bun run vercel-build
'''

# cmux-next-guards.yml's security-holes job, which every feat-cmux-next pull request ran: 3,725 jobs and 8,327
# runner-minutes a day, a median 85 s for about 30 s of work. It judged every change whatever it touched (gitleaks
# reads any file a change adds), so its `inputs` are `**` and every change routes it, but a docs-only change
# alone does not start the pipeline for it (scripts/ci/pr_router.py table_steps), as the workflow's docs-only path
# filter started no run. The job's `if:` now
# skips feat-cmux-next's pull requests; nothing requires the job, so no rollup counts its skip. The same commands,
# with CMUX_STATIC_ANALYSIS_BLOCKING=1: the ratchet's own tests, zizmor and gitleaks judged on the merge commit
# against its first parent (checked out at depth 2, as the job's was), and the two runner-size guards. The job ran
# each with `!cancelled()`, so one failed command does not stop the others. The pinned, checksummed zizmor and
# gitleaks binaries download into ~/.cache/static-analysis (a persistent runner keeps them).
# 31 s on 2 CPUs through ci/run (a warm tool cache; the zizmor and gitleaks downloads add a few seconds cold).
[step.security-holes]
job = "linux"
timeout = 300
title = "Workflow security holes and secrets"
about = "the ratchet's tests pass, the change adds no workflow security hole (zizmor) and no secret (gitleaks), and no job is pinned to one runner size"
inputs = ["**"]
run = '''
export CMUX_STATIC_ANALYSIS_BLOCKING=1
status=0
python3 tests/test_static_analysis_ratchet.py || status=1
python3 scripts/static-analysis/ratchet.py zizmor --base HEAD^1 --head HEAD || status=1
python3 scripts/static-analysis/ratchet.py gitleaks --base HEAD^1 --head HEAD || status=1
python3 tests/test_ci_linux_single_size.py && python3 tests/test_ci_no_single_size_pins.py || status=1
exit "$status"
'''

# cmux-next-guards.yml's tooling-tests job: the tests of feat-cmux-next's own CI tooling. A pull request into
# feat-cmux-next runs these five steps (the job's tt- steps in its order, split so each stays well under the cap
# on a slow runner: tt-objc-selectors-step and tt-display-suites took 83 s and 139 s there, so they sit in different steps); the job
# keeps its push and docs-only fallback runs, and on such a pull request runs only the tt- steps the linux job cannot:
# tt-webviews-tests-per-file and tt-web-lint-prepush (pytest -n 4), tt-remote-p10k (zsh from apt) and tt-tailnet
# (cmux-tui's pinned Rust). Each step asks tooling_steps.py which tt- steps the change reaches, as the job's
# setup-tooling-route step does, and runs those. `inputs` is the job's: no path filter (a docs-only change starts no
# pipeline; scripts/ci/pr_router.py).

[step.tooling-tests-1]
job = "linux"
timeout = 300
title = "Tooling tests 1 (release, publication and PR comment scripts)"
about = "cmux-next-guards.yml tooling-tests' steps tt-asc-developer-id-app to tt-backdrop-art, those the change reaches"
inputs = ["**"]
run = '''
# Only the tt- steps tooling_steps.py routes this change to (the old job's selection); every one with no list.
sel=all
if [ -n "${CI_PATHS_FILE:-}" ]; then
  out="$(mktemp)"
  added=()
  git diff --no-renames --name-only --diff-filter=AD HEAD^1 HEAD > "$out.ad" 2>/dev/null && added=(--added-deleted "$out.ad")
  # --pr-scope, as the job passes it: a step only a wide reach selects is left to the post-merge batch
  # (cmux-next-tooling-tests-batch.yml). `vars.CI_TOOLING_TESTS_PR_SCOPE` set to `0` runs the whole selection here again.
  scope=(--pr-scope)
  [ "${CI_TOOLING_TESTS_PR_SCOPE:-1}" = 0 ] && scope=()
  if python3 scripts/ci/tooling_steps.py route --workflow .github/workflows/cmux-next-guards.yml --job tooling-tests \
      --changed-files "$CI_PATHS_FILE" ${added[@]+"${added[@]}"} --event pull_request ${scope[@]+"${scope[@]}"} \
      --github-output "$out" >/dev/null \
      && grep -qx 'tooling_all=false' "$out"; then
    sel="$(sed -n 's/^tooling_steps=//p' "$out")"
  fi
fi
want() { [ "$sel" = all ] || [[ "$sel" == *" $1 "* ]]; }
status=0
if want tt-asc-developer-id-app; then python3 tests/test_asc_developer_id_app.py || status=1; fi
if want tt-fixture-dates-2101; then CMUX_NOW_EPOCH=4133980800 python3 tests/test_asc_developer_id_app.py && CMUX_NOW_EPOCH=4133980800 python3 -m unittest tests/test_lint_feature_flags_scope.py tests/test_lint_feature_flags_review_date.py || status=1; fi
if want tt-cmux-now-epoch; then python3 -I tests/test_cmux_now_epoch.py || status=1; fi
if want tt-tooling-tests-batch; then python3 tests/test_ci_tooling_tests_batch.py || status=1; fi
if want tt-ios-placeholder-bounds; then python3 -I tests/test_ios_placeholder_bounds.py || status=1; fi
if want tt-cmux-tui-republish; then python3 tests/test_cmux_tui_republish_same_commit.py || status=1; fi
if want tt-verify-cmux-tui-hosted; then python3 tests/test_verify_cmux_tui_hosted.py || status=1; fi
if want tt-crash-ratchet; then python3 tests/test_crash_ratchet_compare.py || status=1; fi
if want tt-spawn-owner-ratchet; then python3 tests/test_spawn_owner_ratchet.py || status=1; fi
