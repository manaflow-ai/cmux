# acpmux's hot paths in instructions, not time (Leo: "are we also doing more work on perf while we're here? for the
# app especially?"): Callgrind counts each case of cmux-tui/crates/acpmux/benches/icount.rs (an MCP connect to the
# chat's tool servers, the chat pane's client core on v2 chat frames, a JSON-RPC parse and serialize) and the step
# fails when one is more than the baseline file's tolerance (2%) over benches/icount_baseline.json. A count does not
# move with the runner's load, so this is not a timing gate. A change that costs more on purpose rewrites the
# baseline in the same pull request: `cargo bench --profile gate -p acpmux --bench icount -- check --update` on Linux.
# The gate profile: release's code generation at opt-level 3 without its link-time cost (a release build of acpmux
# runs past 40 minutes on a CI runner, Cargo.toml's [profile.gate] note).
[step.acpmux-icount]
job = "linux"
# A cold gate-profile build of acpmux, then three Callgrind runs of a few seconds each.
alone = true
timeout = 2400
title = "acpmux instruction counts (Callgrind)"
about = "each acpmux hot-path case's Callgrind instruction count is within its tolerance of benches/icount_baseline.json"
needs = ["rust", "valgrind"]
inputs = [
  "cmux-tui/crates/acpmux/**",
  "cmux-tui/crates/acpmux-client/**",
  "cmux-tui/crates/acpmux-list-types/**",
  "cmux-tui/Cargo.toml",
  "cmux-tui/Cargo.lock",
  "cmux-tui/rust-toolchain.toml",
]
ignore = [
  "cmux-tui/crates/acpmux/**/*.md",
  "cmux-tui/crates/acpmux/spec/**",
]
run = '''
cd cmux-tui
channel="$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' rust-toolchain.toml)"
rustup toolchain install "$channel" --profile minimal
export CARGO_NET_RETRY=10 CARGO_HTTP_TIMEOUT=120 CARGO_INCREMENTAL=0
cargo bench --profile gate -p acpmux --bench icount --locked -- check
'''

# cmux-tui-artifacts.yml's `cmux_next_ daemon tests` job, which ran after the branch push only (its pass writes the
# tree's daemon-tests marker, which that workflow keeps). The same cargo test, on the pull request's merge commit:
# only the workspace members whose sources name cmux_next_, retried only on a recognized Cargo fetch failure.
[step.cmux-next-daemon-tests]
job = "linux"
# 22 to 27 minutes of test compile cold (a few warm from the push's saved target), then the tests: the job's own
# 65-minute bound for this step.
alone = true
timeout = 3900
title = "cmux_next_ daemon tests"
about = "the cmux_next_ daemon tests of the cmux-tui workspace members that name them pass, on Linux, in a home of their own"
needs = ["rust", "zig"]
inputs = [
  "cmux-tui/**",
  "schemas/settings/**",
  "scripts/ci/cmux-next-daemon-test-packages.sh",
  "scripts/cmux-next/cargo-locks.py",
  "scripts/ci/cmux-tui-test-target.sh",
  "scripts/ci/r2-cache.sh",
  "scripts/blacksmith-testbox-source-mtimes.py",
  "scripts/ci/crate_results.py",
  "ghostty-next",
]
run = '''
cd cmux-tui
# Each crate's tests are reused when its own inputs (its files, its path dependencies' files, what its sources name
# outside it, Cargo.lock, the toolchain) passed before anywhere in the fleet: scripts/ci/crate_results.py. Only the
# crates that missed run; when none did, nothing is installed, restored or compiled.
# It prints REUSED_ALL for that; any other failure (no output) runs every crate.
crates="$(mktemp /tmp/cmux-next-crates.XXXXXX.json)"
all_members="$(../scripts/ci/cmux-next-daemon-test-packages.sh)"
plan="$(python3 ../scripts/ci/crate_results.py plan "$crates" -- $all_members || true)"
if [ "$plan" = REUSED_ALL ]; then
  echo "cmux_next_ test members: every one reused; nothing to run"
  rm -f "$crates"
  exit 0
fi
[ -n "$plan" ] || plan="$all_members"
read -r -a members <<<"$plan"
channel="$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' rust-toolchain.toml)"
rustup toolchain install "$channel" --profile minimal --component clippy,rustfmt
# The build env cmux-tui-artifacts.yml's feat-cmux-next push job tests with, so its saved target is fresh here: no
# incremental state (it only fills the disk), the ghostty-next gitlink's sources, Zig from PATH.
export CARGO_NET_RETRY=10 CARGO_HTTP_TIMEOUT=120 CARGO_HTTP_MULTIPLEXING=false TMPDIR=/tmp CMUX_GHOSTTY_SRC=""
export GHOSTTY_ZIG_SOURCE=ghostty-next CARGO_INCREMENTAL=0
unset CMUX_ZIG ZIG
# The last feat-cmux-next push's build (read only; a miss builds cold): unchanged crates are not compiled again.
../scripts/ci/cmux-tui-test-target.sh restore
home="$(mktemp -d /tmp/acpmux-home.XXXXXX)"
export ACPMUX_HOME="$home" ACPMUX_SOCKET=""
log="$(mktemp /tmp/cmux-next-tests.XXXXXX.txt)"
echo "cmux_next_ test members: ${members[*]}"
status=1
for attempt in 1 2 3; do
  cargo test "${members[@]}" --locked cmux_next_ 2>&1 | tee "$log"
  status=${PIPESTATUS[0]}
  if [ "$status" -ne 0 ] && python3 ../scripts/cmux-next/cargo-locks.py explain "$log"; then break; fi
  if [ "$status" -eq 0 ]; then
    grep -qE 'test result: ok\. [1-9][0-9]* passed' "$log" && break
    echo "::error::cargo test ran no cmux_next_ test (the filter matched nothing)"
    status=1
    break
  fi
  if grep -qE 'test result: FAILED|error(\[E[0-9]+\])?: could not compile|^error\[E[0-9]+\]' "$log" \
    || ! grep -qiE 'spurious network error|failed to download|unable to update registry|failed to (fetch|get|query)|could not resolve host|couldn.t resolve host|connection (reset|refused|timed out)|operation timed out|ssl (connect )?error|http2 error|early eof|download of .* failed|registry index .*(failed|error)' "$log"; then
    echo "::error::cmux_next_ daemon tests failed with a result that is not a Cargo fetch failure; not retrying"
    break
  fi
  [ "$attempt" -lt 3 ] && sleep $((attempt * 10))
done
# The compile cache's hits and misses, when the rust tool sent cargo through the runner's sccache.
case "$(head -c 300 "$(command -v cargo)" 2>/dev/null | tr -d '\0')" in
  *RUSTC_WRAPPER=*sccache*) sccache --show-stats || true ;;
esac
# End the daemon of this home and its agents, then delete the home (a path this step made).
acpmux="$(command -v acpmux || true)"
[ -z "$acpmux" ] || env -u ACPMUX_SOCKET ACPMUX_HOME="$home" "$acpmux" daemon shutdown --end-agents || true
rm -rf "$home" "$log"
[ "$status" -ne 0 ] || python3 ../scripts/ci/crate_results.py post "$crates" || true
rm -f "$crates"
exit "$status"
'''

# The iOS steps: what cmux-next-ios-kit.yml (the CmuxMobileKit tests) and ios-reliability-matrix.yml (the
# connectivity and reliability matrix, cmux-next-ios/reliability-matrix/cells.json) ran on a feat-cmux-next pull
# request; both keep their push, schedule and dispatch runs (the kit's advisory Instant list bench among them).
# The matrix's protocol cells are Linux cargo tests, a `linux` step; its phone cells and the kit share one iPhone
# simulator in the `ios` job, one after the other. pr-pipeline.yml's ios job takes its Mac from
# scripts/ci/ios_runner_pool.py (the `pipeline` lane) and selects Xcode first. Each step judges its own cells: the
# matrix report (scripts/ci/ios_reliability_matrix.py) fails a step when a `gate: true` cell of its suite failed or
# did not run, as the workflow's report job did for both logs.
[step.ios-matrix-protocol]
job = "linux"
# Every test of the cmux-next-ios/rust workspace on all cores, and a scroll gate that times itself under load.
alone = true
timeout = 2700
title = "iOS matrix: protocol cells (Rust)"
about = "the cmux-next-ios/rust workspace's tests and the matrix's rust cells, the Mac scroll to iPhone display gate, and the matrix report for the rust suite"
needs = ["rust"]
inputs = [
  "cmux-next-ios/rust/**",
  "cmux-next-ios/CmuxMobileKit/Sources/CmuxMobileLive/**",
  "cmux-next-ios/CmuxMobileKit/Sources/CmuxMobileTransport/**",
  "cmux-next-ios/CmuxMobileKit/Sources/CmuxMobileLinkFFI/**",
  "cmux-next-ios/CmuxMobileKit/Tests/CmuxMobileLiveTests/**",
  "cmux-next-ios/reliability-matrix/**",
  "cmux-next-ios/CmuxMobileKit/Sources/CmuxMobileTerminal/**",
  "cmux-next-ios/CmuxMobileKit/Tests/CmuxMobileTerminalTests/TerminalProjection*",
  "cmux-tui/crates/cmux-terminal-projection/**",
  "cmux-tui/crates/cmux-wg/**",
  "cmux-tui/crates/cmux-transport/**",
  "cmux-tui/vendor/smoltcp/**",
  "scripts/ci/ios_reliability_matrix.py",
]
run = '''
root="$PWD"
out="${RUNNER_TEMP:-$CI_TOOLS}/matrix"
mkdir -p "$out"
export CARGO_TERM_COLOR=never
cd cmux-next-ios/rust
rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" --profile minimal
# Every suite, no early stop: the report decides what gates. The matrix cells time themselves, so they run one at a
# time, in release (the app's host and the phone's FFI ship optimized).
{ cargo test --locked --workspace --no-fail-fast
  cargo test --release --locked -p cmux-mobile-host --test reliability_matrix --no-fail-fast -- --ignored --nocapture --test-threads=1
} 2>&1 | tee "$out/rust.log" || true
# Mac scroll to iPhone display (Leo, 2026-11-22, ask-0e9bbe35bb), Mac idle and Mac CPU busy (one spinning thread
# per core), over the good-wifi shaper: red when either arm's p95 passes tests/scroll_to_display_baseline.json's limit.
scroll=0
cargo test --release --locked -p cmux-mobile-host --test scroll_to_display -- --ignored --nocapture --test-threads=1 \
  2>&1 | tee "$out/scroll.log" || scroll=$?
echo "Mac scroll to phone display (ms):"
grep -E '^SCROLL-(ROW|GATE)' "$out/scroll.log" || echo 'no rows'
cd "$root"
matrix=0
python3 scripts/ci/ios_reliability_matrix.py --rust "$out/rust.log" --json "$out/matrix-rust.json" || matrix=$?
exit $(( scroll || matrix ))
'''

# cmux-next-pr-autofix.yml's generated-drift job: a generated file the pull request changes with none of its inputs.
# The job keeps its docs-only fallback runs; a pull request into feat-cmux-next runs this step. As the job did, the
# judge is the base's generated_outputs.py (with the settings-exports.txt it reads), not the pull request's, and the
# label generated-drift-ok skips it. The changed list is the merge commit's diff against the base tip (the job read
# action-areas' list or the files API: the same paths). Measured 0.3 s.
[step.generated-drift]
job = "linux"
timeout = 120
title = "Generated drift"
about = "no generated file changes unless one of its inputs does (the base's scripts/cmux-next/generated_outputs.py drift)"
inputs = ["**"]
run = '''
export RUNNER_TEMP="${RUNNER_TEMP:-$(mktemp -d)}"
if python3 -I - "${GITHUB_EVENT_PATH:-}" <<'PY'
import json, sys
try:
    labels = (json.load(open(sys.argv[1])).get("pull_request") or {}).get("labels") or []
except (OSError, ValueError):
    labels = []
sys.exit(0 if any(label.get("name") == "generated-drift-ok" for label in labels) else 1)
PY
then
  echo "::notice title=generated drift::skipped: the pull request has the generated-drift-ok label"
  exit 0
fi
git rev-parse -q --verify 'HEAD^2' >/dev/null || { echo "not a merge commit: no pull request diff to judge"; exit 0; }
base="$RUNNER_TEMP/drift-base"
mkdir -p "$base"
git show 'HEAD^1:scripts/cmux-next/generated_outputs.py' > "$base/generated_outputs.py" 2>/dev/null \
  || { echo "The base has no generated_outputs.py yet."; exit 0; }
git show 'HEAD^1:scripts/cmux-next/settings-exports.txt' > "$base/settings-exports.txt" 2>/dev/null || true
git diff --name-only --no-renames 'HEAD^1' HEAD > "$RUNNER_TEMP/drift-changed.txt"
if ! python3 -I "$base/generated_outputs.py" drift --changed "$RUNNER_TEMP/drift-changed.txt" > "$RUNNER_TEMP/drift.txt"; then
  sed 's/^/::error::/' "$RUNNER_TEMP/drift.txt"
  exit 1
fi
echo "no generated file drift"
'''

# test-ios.yml's package-conventions-lint job, split in two: the lint's own tests (always gate) and the conventions
# gate. Into feat-cmux-next the gate is warn-only (Leo, 2026-10-19; CMUX_NEXT_STYLE_GUARDS) except for a namespace
# type the pull request adds that --namespace-fix rewrites (pr_added_namespace_types.py; label
# namespace-lint-override skips that). The job keeps its push, dispatch and other-base runs; the iOS suites after it
# already run on a skipped or warn-only lint. `inputs` is detect-ios-changes' should_lint list.
# Measured locally: 43 s (tests) and 123-247 s (gate, with its worktree); the whole job took 310 s on cmux-linux
# (tests, gate and checkout). The gate runs alone, in its own worktree (--namespace-fix rewrites files), so no other
# step sees its edits or competes for its CPUs.
[step.package-conventions-tests]
job = "linux"
timeout = 180
title = "Package conventions lint tests"
about = "the iOS package conventions lint's own tests (test_ios_package_conventions.py, test_pr_scoped_lint_gates.py)"
inputs = [
  "ios/**",
  "Packages/**",
  "vendor/stack-auth-swift-sdk-prerelease/**",
  "scripts/lint-ios-package-conventions.sh",
  "scripts/lint_swift_namespaces.py",
  "scripts/swift_source_mask.py",
  "scripts/tests/test_ios_package_conventions.py",
  "scripts/tests/test_pr_scoped_lint_gates.py",
  "scripts/ci/package-conventions-gate.sh",
  "scripts/ci/crash-class-gate.sh",
  "scripts/cmux-next/check-concurrency.sh",
  "scripts/cmux-next/check-closure-mutex.py",
  "scripts/cmux-next/check-main-actor-work.py",
  "scripts/cmux-next/swift_scope.py",
  "scripts/cmux-next/caller_isolation.py",
  "scripts/cmux-next/caller-isolated-blocking-pending.json",
  "scripts/ci/pr_owned_findings.py",
  "scripts/lint-ios-package-conventions-baseline.txt",
  "scripts/lint-namespace-types-baseline.txt",
  "scripts/lint-namespace-types-ratchet.txt",
]
run = '''
python3 scripts/tests/test_ios_package_conventions.py
python3 scripts/tests/test_pr_scoped_lint_gates.py
'''

[step.package-conventions-gate]
job = "linux"
timeout = 360
alone = true
title = "Package conventions lint"
about = "the iOS package conventions gate on the files the pull request changes (package-conventions-gate.sh --pr), warn-only into feat-cmux-next but for an added namespace type"
inputs = [
  "ios/**",
  "Packages/**",
  "vendor/stack-auth-swift-sdk-prerelease/**",
  "scripts/lint-ios-package-conventions.sh",
  "scripts/lint_swift_namespaces.py",
  "scripts/swift_source_mask.py",
  "scripts/tests/test_ios_package_conventions.py",
  "scripts/tests/test_pr_scoped_lint_gates.py",
  "scripts/ci/package-conventions-gate.sh",
  "scripts/ci/crash-class-gate.sh",
  "scripts/cmux-next/check-concurrency.sh",
  "scripts/cmux-next/check-closure-mutex.py",
  "scripts/cmux-next/check-main-actor-work.py",
  "scripts/cmux-next/swift_scope.py",
  "scripts/cmux-next/caller_isolation.py",
  "scripts/cmux-next/caller-isolated-blocking-pending.json",
  "scripts/ci/pr_owned_findings.py",
  "scripts/lint-ios-package-conventions-baseline.txt",
  "scripts/lint-namespace-types-baseline.txt",
  "scripts/lint-namespace-types-ratchet.txt",
]
run = '''
export RUNNER_TEMP="${RUNNER_TEMP:-$(mktemp -d)}"
scope=()
git rev-parse -q --verify 'HEAD^2' >/dev/null && scope=(--pr)
override="$(python3 -I - "${GITHUB_EVENT_PATH:-}" <<'PY'
import json, sys
try:
    labels = (json.load(open(sys.argv[1])).get("pull_request") or {}).get("labels") or []
except (OSError, ValueError):
    labels = []
print("true" if any(label.get("name") == "namespace-lint-override" for label in labels) else "false")
PY
)"
tree="$(mktemp -d "$RUNNER_TEMP/pcl.XXXXXX")"
git worktree add --detach "$tree" HEAD >/dev/null
trap 'git worktree remove --force "$tree" >/dev/null 2>&1 || true' EXIT
cd "$tree"
rc=0
CMUX_NEXT_STYLE_GUARDS=warn scripts/ci/package-conventions-gate.sh ${scope[@]+"${scope[@]}"} || rc=$?
# Warn-only still fails a pull request that adds a namespace type the safe rewrite fixes.
if (( rc != 0 )) && [ ${#scope[@]} -gt 0 ] && [ "$override" != true ]; then
  python3 scripts/ci/pr_added_namespace_types.py || exit 1
fi
if (( rc != 0 )); then
  echo "::warning title=package conventions (warn-only)::the package conventions lint reported findings; see this step's log"
fi
exit 0
'''

[step.ios-connection-notices]
job = "linux"
timeout = 120
title = "Phone connection notices"
about = "a phone connection state waits QuietStatusGate's 10 s or carries an action (check-connection-notices.py)"
# Every surface the detector judges (its SURFACES, the bound's schema, its allowlist): a web or Mac change that adds an
# offender fails on its own PR, not on the next phone PR (GitHubConnectCard.tsx from #56129 reddened every iOS PR).
inputs = ["cmux-next-ios/**", "webviews/src/**", "Packages/macOS/CmuxNext/Sources/**", "Packages/iOS/**",
          "schemas/notice-timing/**", "scripts/cmux-next/check-connection-notices.py",
          "scripts/cmux-next/connection-notices-allowlist.tsv"]
ignore = ["cmux-next-ios/verify/**", "**/*.md", "!cmux-next-ios/CmuxMobileKit/**/Resources/**",
          "!Packages/Shared/**/Resources/**", "!Packages/iOS/**/Resources/**"]
run = '''
python3 -I scripts/cmux-next/check-connection-notices.py --root "$PWD"
'''

[step.ios-kit]
job = "ios"
# Takes the Mac's cores and its one simulator; the phone cells follow it.
alone = true
# 60 min, plus up to 20 for the fleet pool's verdict before a Mac fallback (vars.CMUX_IOS_SIM_LINUX=on).
timeout = 4800
title = "CmuxMobileKit tests (macOS swift test, iOS simulator)"
about = "takes CmuxMobileLinkFFI.xcframework from the build fleet or builds it (and checks the checked-in bindings match), runs the kit's swift test on macOS, then its tests on an iOS 26 iPhone simulator"
# The kit and every local package it links (scripts/ci/ios_app_package_paths.py --check keeps the list exact), and
# its toolchain. A change to only notes or cmux-next-ios/verify/ evidence builds nothing new (cmux#43251 took a
# simulator Mac for SECURITY.md and verify/parity-mac.md). A note under a package's Resources/ ships in the bundle,
# so it still routes (the workflow's re-include, kept).
inputs = [
  "cmux-next-ios/**",
  "Packages/Shared/CMUXAuthCore/**",
  "Packages/Shared/CMUXMobileCore/**",
  "Packages/Shared/CmuxAgentBrands/**",
  "Packages/Shared/CmuxAgentQuestion/**",
  "Packages/Shared/CmuxAuthRuntime/**",
  "Packages/Shared/CmuxChiefList/**",
  "Packages/Shared/CmuxChiefVoiceCore/**",
  "Packages/Shared/CmuxConnectivityTelemetry/**",
  "Packages/Shared/CmuxDeviceHub/**",
  "Packages/Shared/CmuxEgress/**",
  "Packages/Shared/CmuxGhosttyKit/**",
  "Packages/Shared/CmuxHomeCore/**",
  "Packages/Shared/CmuxScreenKit/**",
  "Packages/Shared/CmuxSpinner/**",
  "Packages/Shared/CmuxTheme/**",
  "Packages/Shared/CmuxVNC/**",
  "Packages/Shared/CmuxVNCWebRTC/**",
  "Packages/iOS/CmuxConversation/**",
  "Packages/iOS/CmuxMobileBilling/**",
  "Packages/iOS/CmuxMobileSupport/**",
  "Packages/iOS/CmuxTabsKit/**",
  "vendor/stack-auth-swift-sdk-prerelease/**",
  "scripts/select-ci-xcode.sh",
  "scripts/ci/xcode-pins.txt",
  ".xcode-version",
  "scripts/ci/ios_app_package_paths.py",
  "scripts/ci/ios_link_ffi_key.py",
  "scripts/ci/ios_link_ffi.sh",
  "scripts/ci/ios_sim_udid.py",
  "scripts/ci/ios-sim-pool.sh",
  ".github/actions/setup-cmux-tui-rust/**",
  ".github/actions/runner-cargo-home/**",
  "cmux-tui/rust-toolchain.toml",
]
# Agent tools beside the app (review.sh, try.sh, the hand-off host) and the mobile Worker build nothing in the iPhone app
# (#53223, scripts/cmux-next/build_select.py reads the kit workflow's filter); the scripts the kit or the app build
# reads stay in. The fixtures the kit's own tests read (cmux-next-ios/verify/agent-cli-hybrid/) stay in too (#54725).
ignore = ["cmux-next-ios/verify/**", "**/*.md", "!cmux-next-ios/verify/agent-cli-hybrid/**",
          "cmux-next-ios/scripts/**", "cmux-next-ios/backend/**",
          "!cmux-next-ios/scripts/instant_perf_table.py", "!cmux-next-ios/scripts/generate-launch-mark.swift",
          "!cmux-next-ios/scripts/check-notification-extension.sh", "!cmux-next-ios/scripts/check-production-binary.sh",
          "!cmux-next-ios/CmuxMobileKit/**/Resources/**",
          "!Packages/Shared/**/Resources/**", "!Packages/iOS/**/Resources/**"]
needs = ["rust"]
run = '''
(cd cmux-next-ios/rust && rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" --profile minimal)
# The build fleet's copy of the head when it has one for these inputs, else this Mac builds it (a logged Mac fallback).
bash scripts/ci/ios_link_ffi.sh 8
# The xcframework and target/ are gitignored; a Mac build rewrites the bindings and restores Cargo.lock, so any
# tracked change is drift (the fleet's build passes only when its bindings match the checked-in ones).
if ! git diff --exit-code -- cmux-next-ios/; then
  echo "::error::build-xcframework.sh changed tracked files (CmuxMobileLinkFFI.swift or Cargo.lock); run it and commit the result"
  exit 1
fi
status=0
# The suites that bound wall-clock time or the process footprint run alone after the rest (among 2580 parallel tests
# in one process they measured their neighbours). The Instant list bench stays in the kit workflow's push runs.
# CmuxMobileAuthTests, CmuxMobileDesignCoreTests, CmuxMobileModelTests, CmuxMobileNotificationsTests,
# CmuxMobileRealtimeTests and CmuxMobileTransportTests run on Linux (swift-linux-packages.yml, group ios-kit, which
# pr-router.yml starts for every change this step's inputs reach in those modules), as cmux-next-ios-kit.yml's macOS
# swift test already skips them; the simulator run below still runs all six.
swift test --package-path cmux-next-ios/CmuxMobileKit --skip CmuxMobileInstantPerfTests --skip TerminalSelfRecoveryTests --skip MockTerminalStreamMemoryTests \
  --skip CmuxMobileAuthTests --skip CmuxMobileDesignCoreTests --skip CmuxMobileModelTests --skip CmuxMobileNotificationsTests \
  --skip CmuxMobileRealtimeTests --skip CmuxMobileTransportTests || status=1
swift test --package-path cmux-next-ios/CmuxMobileKit --no-parallel --filter TerminalSelfRecoveryTests --filter MockTerminalStreamMemoryTests || status=1
# LiveCoordinator, the banner and the FFI-backed transport are iOS only, so their tests run only on the simulator.
# Coverage off: its profiler crashes Swift 6.3.3 on an isolated deinit. arm64 only: the xcframework has no x86_64
# simulator slice.
# The fleet pool runs these simulator tests too when the job submitted them (scripts/ci/ios-sim-pool.sh, the ios
# job's "Fleet pool" steps). vars.CMUX_IOS_SIM_LINUX=on: the pool's verdict is the check, and this Mac runs them only
# when the pool gave none (a logged Mac fallback). shadow: this Mac runs them and the pool is timed beside it.
# Unset or off: the pool is left out.
mode="${CMUX_IOS_SIM_LINUX:-off}"
pool_dir="${CMUX_IOS_SIM_POOL_DIR:-${RUNNER_TEMP:-$CI_TOOLS}/sim-pool}"
pool=""
sim=0
if [[ "$mode" == on && -f "$pool_dir/submitted" ]] && (( ! status )); then
  pool="$(CMUX_IOS_SIM_POOL_DIR="$pool_dir" CMUX_IOS_SIM_POOL_WAIT=1200 bash scripts/ci/ios-sim-pool.sh collect)"
  echo "fleet pool: $pool"
fi
# A red macOS kit run already fails the step: the simulator leg (the kit's tests again, 40-45 min on a Mac, up to 20
# of them waiting on the pool) would only spend the machine. The re-run that fixes the red runs it.
if (( status )); then
  echo "::notice title=ios-kit::the macOS kit tests failed above; the iOS simulator tests are skipped this run"
  pool="skipped"
fi
case "${pool%% *}" in
skipped) ;;
pass) echo "iOS simulator tests passed on the fleet pool; this Mac skips them" ;;
fail) echo "::error title=fleet pool::iOS simulator tests failed on the fleet pool (${pool#* })"; sim=1 ;;
*)
[[ "$mode" == on ]] && echo "::notice title=fleet pool::no verdict from the fleet pool (${pool#* }); this Mac runs the simulator tests"
mac_start=$(date +%s)
udid="$(python3 -I scripts/ci/ios_sim_udid.py)"
bundle="${RUNNER_TEMP:-$CI_TOOLS}/ios-sim.xcresult"
rm -rf "$bundle"
(cd cmux-next-ios/CmuxMobileKit && xcodebuild test -scheme CmuxMobileKit-Package -destination "id=$udid,arch=arm64" \
  -enableCodeCoverage NO -derivedDataPath "${CMUX_DERIVED_DATA_SLOT:-${RUNNER_TEMP:-$CI_TOOLS}/dd-ios-sim}" \
  CODE_SIGNING_ALLOWED=NO -quiet -skip-testing:CmuxMobileInstantPerfTests -resultBundlePath "$bundle") || sim=$?
mac_seconds=$(( $(date +%s) - mac_start ))
# -quiet drops Swift Testing's output: report from the result bundle (counts, suites that did not pass, and every failure).
xcrun xcresulttool get test-results tests --path "$bundle" --compact 2>/dev/null | python3 -c '
import json, sys
counts = {}
def walk(node, path):
    kind, result = node.get("nodeType"), node.get("result")
    if kind == "Test Case":
        counts[result] = counts.get(result, 0) + 1
        if result == "Failed":
            print("FAILED:", " / ".join(path))
    if kind == "Test Suite" and (result != "Passed" or node.get("name") == "WaitingBannerTests"):
        print("suite", node.get("name"), result, len(node.get("children", [])), "tests")
    for child in node.get("children", []):
        if child.get("nodeType") == "Failure Message":
            print("   ", child.get("name"))
        else:
            walk(child, path + [child.get("name", "")])
for root in json.load(sys.stdin).get("testNodes", []):
    walk(root, [root.get("name", "")])
print("iOS simulator test cases:", ", ".join(f"{k} {v}" for k, v in sorted(counts.items())))
' || echo "::warning::could not read the result bundle"
if [[ "$mode" == shadow && -f "$pool_dir/submitted" ]]; then
  # Advisory: the pool started before the swift tests, so a short wait is enough; its verdict never fails the step.
  pool="$(CMUX_IOS_SIM_POOL_DIR="$pool_dir" CMUX_IOS_SIM_POOL_WAIT=300 bash scripts/ci/ios-sim-pool.sh collect 2>/dev/null)"
  read -r pool_verdict pool_seconds _ <<< "$pool"
  echo "fleet pool (shadow): $pool; this Mac: exit $sim in $mac_seconds s"
  printf '\n**iOS simulator, fleet pool shadow:** pool %s in %s s, this Mac exit %s in %s s\n' \
    "$pool_verdict" "$pool_seconds" "$sim" "$mac_seconds" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
fi
;;
esac
exit $(( status || sim ))
'''

[step.ios-phone-cells]
job = "ios"
# After the kit, on the same simulator; it builds the xcframework itself when the kit did not run.
alone = true
timeout = 2700
title = "iOS matrix: phone cells (iOS simulator)"
about = "the matrix's ios cells (ConnectivityMatrixTests, link recovery, pairing retry, cached lists, the terminal projection's resize harness) on an iOS 26 iPhone simulator, then the matrix report for the ios suite"
needs = ["rust"]
inputs = [
  "cmux-next-ios/rust/**",
