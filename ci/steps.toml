# cmux-next-web-lint.yml's `webviews typecheck (whole tree)` job and its hook tests, which ran on every
# feat-cmux-next push only. Leo's ask for it: "Every push to main gets a webview type check, so a break shows up on
# the status board within minutes." A pull request now runs it on the merge commit, so the break shows before the
# merge. The range lint beside it (`web lint (fast)`) is cmux-next-fast-gates.yml's, which pull requests already ran.
# `nightly`: `webviews/**` is a whole-directory glob, so a pull request's --pr-scope route dropped this step and a
# landing head of the affected tier ran no type check at all; cmux#61720 fixed the type errors that reached
# feat-cmux-next that way (a duplicate import, a missing module) after the nightly's webview checks went red on them.
# Naming the nightly's check keeps the whole route and starts it on the landing head (pr_router.py
# nightly_gate_steps), about 2 min. Leo, 2026-11-25: "if checks fail, fix the checks or ignore and just merge".
[step.webviews-typecheck]
job = "linux"
tier = "push"
timeout = 360
title = "Webviews typecheck (whole tree)"
about = "the pre-push web lint hook's tests pass, webviews' locked dependencies install and the whole tree typechecks (vp check --no-fmt --no-lint)"
needs = ["bun", "node"]
nightly = ["nightly.yml:check-nightly-webviews:Webview checks on the build commit"]
