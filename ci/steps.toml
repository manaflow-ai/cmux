# Chrome ships its security fixes in stable first (CVE-2026-106378 was fixed in Chrome 155 while cmux
# shipped 154). One HTTPS request to Google's version history API.
[step.chromium-currency]
job = "linux"
timeout = 300
title = "Shipped Chromium is at most one stable milestone behind"
about = "the Chromium cmux-next ships (scripts/cmux-next/cef-manifest.json) is at most one Chrome stable milestone behind, and no sandbox-weakening switch reaches Chromium"
inputs = [
  "scripts/cmux-next/cef-manifest.json",
  "scripts/cmux-next/check-chromium-currency.py",
  "scripts/cmux-next/tests/chromium-currency.test.sh",
]
run = '''
rc=0
# The check itself (fixed versions).
bash scripts/cmux-next/tests/chromium-currency.test.sh || rc=1
# A pull request that leaves the pin alone inherits the pin's age from the base: it warns. One that
# changes the pin is judged (cmuxterm-hq#5745). HEAD^1 is the base side of the merge commit; when it
# can't be read, the step judges.
if git diff --quiet HEAD^1 HEAD -- scripts/cmux-next/cef-manifest.json; then
  python3 scripts/cmux-next/check-chromium-currency.py \
    || echo "::warning::The base's Chromium pin is behind stable; this PR does not change it."
else
  python3 scripts/cmux-next/check-chromium-currency.py || rc=1
fi
# Sandbox-weakening switches never reach Chromium.
./scripts/cmux-next/test-shim-switches-cpp.sh || rc=1
exit "$rc"
'''

