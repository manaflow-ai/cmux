  ".github/workflows/ci-web.yml",
]
run = '''
python3 -I scripts/ci/web_subareas.py has unit_tests || exit 0
export RUNNER_TEMP="${RUNNER_TEMP:-$(mktemp -d)}"
cd web
flock "$CI_TOOLS/bun-install.lock" bun install --frozen-lockfile
report_dir="$RUNNER_TEMP/web-test-junit/shard1"
mkdir -p "$report_dir"
status=0
./scripts/run-tests.sh --shard 1/4 --reporter=junit --reporter-outfile="$report_dir/junit.xml" || status=$?
[ "$status" -ne 0 ] || rm -f "$report_dir/junit.xml"
