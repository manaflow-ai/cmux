\* liveness: fixed variant, EventuallyConverged under fairness; 2 tabs so the behavior graph stays small
SPECIFICATION Spec
CONSTANTS
  NTabs = 2
  NPanes = 4
  NWorkspaces = 3
  NClients = 2
  MaxOps = 2
  MaxFaults = 1
  BUGGY_DETACH = FALSE
  NSpawn = 0
  RESPAWN = FALSE
INVARIANTS
  I1_TabConservation
  I2_ExactlyOnePane
  I3_NoEmptyPaneOrWorkspace
  P1_Projection
  Convergence
  VisibleNoDuplicate
  DP1_DragPresentation
  Idempotency
  ConcurrentSerializable
  QuiescentConvergence
PROPERTIES
  EventuallyConverged
  I4_OwnPlaceNoOp
  IdempotentReplay
  DP1_EndsExactlyOnce
CHECK_DEADLOCK FALSE
