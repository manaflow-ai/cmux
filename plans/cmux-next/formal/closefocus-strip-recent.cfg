\* Column strip, Policy recent: 3 columns (one split), up to 5 panes, columns 2 wide in a
\* viewport 5 wide (two columns show), 5 user steps. plans/cmux-next/close-focus.md
CONSTANTS
    Kind = "strip"
    Policy = "recent"
    Items = {"a", "b", "c", "d", "e"}
    InitLayout <- StripInit
    CW = 2
    VW = 5
    MaxSteps = 5
    None = none
    MUTANT = "none"

SPECIFICATION Spec
INVARIANT Safety
PROPERTY UnfocusedCloseKeepsFocus
PROPERTY NoJump
PROPERTY MinimalReveal
PROPERTY SuccessorRule
PROPERTY NoSecondScroll
PROPERTY Settles
