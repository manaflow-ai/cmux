\* Sidebar list: 5 workspaces and one to create, rows 1 tall in a viewport
\* 3 tall, 5 user steps. plans/cmux-next/close-focus.md
CONSTANTS
    Kind = "list"
    Policy = "previous"
    Items = {"w1", "w2", "w3", "w4", "w5", "w6"}
    InitLayout <- ListInit
    CW = 1
    VW = 3
    MaxSteps = 5
    None = none
    MUTANT = "none"

SPECIFICATION Spec
INVARIANT Safety
PROPERTY UnfocusedCloseKeepsFocus
PROPERTY NoJump
PROPERTY MinimalReveal
PROPERTY SuccessorRule
PROPERTY NoSecondScroll
PROPERTY Settles
