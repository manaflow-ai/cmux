\* respawn variant (RESPAWN = TRUE, tab-split-respawn-v1): own-pane split of the only tab creates one fresh tab
SPECIFICATION Spec
CONSTANTS
  NTabs = 2
  NPanes = 4
  NWorkspaces = 3
  NClients = 2
  MaxOps = 2
  MaxFaults = 1
  BUGGY_DETACH = FALSE
  NSpawn = 1
  RESPAWN = TRUE
INVARIANTS
  I1_TabConservation
  I2_ExactlyOnePane
  I3_NoEmptyPaneOrWorkspace
  P1_Projection
  Convergence
  VisibleNoDuplicate
  DP1_DragPresentation
  Idempotency
  ConcurrentSerializable
  QuiescentConvergence
PROPERTIES
  I4_OwnPlaceNoOp
  IdempotentReplay
  DP1_EndsExactlyOnce
CHECK_DEADLOCK FALSE
