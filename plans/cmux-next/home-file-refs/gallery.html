<!doctype html>
<html><head><meta charset="utf-8"><title>Home file references · gallery</title>
<style>
/* Home bubble metrics (Fixture.swift): body 13 pt system, line 16 pt, pad 7/12, radius 15. */
:root{--font:13px/16px -apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif}
*{box-sizing:border-box}
body{margin:0;padding:24px 28px 80px;font:var(--font);background:#f5f5f7;color:#1d1d1f}
h1{font-size:18px;line-height:24px;margin:0 0 4px}
.sub{color:#6e6e73;margin:0 0 20px;max-width:900px}
.v{margin:0 0 26px}
.v h2{font-size:14px;line-height:20px;margin:0 0 2px;display:flex;gap:8px;align-items:center}
.v .why{color:#6e6e73;margin:0 0 8px;max-width:900px}
.rec{font-size:11px;line-height:16px;background:#0a84ff;color:#fff;border-radius:6px;padding:0 7px;font-weight:600}
.pair{display:grid;grid-template-columns:1fr 1fr}
.pane{padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.light{background:#fff;border-radius:12px 0 0 12px;border:1px solid #e5e5ea;border-right:0;--fg:#000;--sec:#6e6e73;--link:#0a6cdf;--bub:#e9e9eb;--card:#fff;--line:#d2d2d7;--well:#f2f2f7}
.dark{background:#1e1e1e;border-radius:0 12px 12px 0;border:1px solid #2c2c2e;border-left:0;--fg:#fff;--sec:#98989d;--link:#4aa8ff;--bub:#3a3a3c;--card:#2c2c2e;--line:#48484a;--well:#1c1c1e}
.bubble{max-width:430px;border-radius:15px;padding:7px 12px;background:var(--bub);color:var(--fg);align-self:flex-start}
.bubble p{margin:0}
a{color:var(--link);text-decoration:none;cursor:pointer}a:hover{text-decoration:underline;text-underline-offset:2px}
.ic{display:inline-block;width:13px;height:13px;vertical-align:-2px;margin-right:3px}
/* Cards sit outside the text bubble, like an iMessage attachment. */
.card{align-self:flex-start;width:300px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:9px 11px;display:flex;gap:10px;align-items:center;color:var(--fg);cursor:pointer}
.card:hover{border-color:var(--link)}
.card .big{width:30px;height:36px;flex:none}
.card .n{font-weight:600}.card .p{color:var(--sec);font-size:11px;line-height:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:230px}
.prev{align-self:flex-start;width:300px;border:1px solid var(--line);background:var(--card);border-radius:12px;overflow:hidden;color:var(--fg);cursor:pointer}
.prev .body{padding:10px 12px;background:var(--well);font-size:12px;line-height:16px;height:112px;overflow:hidden;position:relative}
.prev .body:after{content:"";position:absolute;left:0;right:0;bottom:0;height:28px;background:linear-gradient(transparent,var(--well))}
.prev .body h4{margin:0 0 4px;font-size:13px}.prev .body ul{margin:0;padding-left:16px}
.prev .img{height:150px;background:linear-gradient(135deg,#355c7d,#6c5b7b 55%,#c06c84)}
.prev .foot{padding:7px 11px;display:flex;justify-content:space-between;font-size:11px;color:var(--sec)}
.prev .foot b{color:var(--fg);font-weight:600}
.lab{font-size:11px;color:var(--sec);margin-top:4px}
</style></head><body>
<h1>File references in Home chat</h1>
<p class="sub">Five ways a Chief reply can point at a file. All text is the body font (13 pt). Click opens the file in the right column. Left: light. Right: dark. Nothing here ships until you pick; reply with a number, for example <b>"ship 5"</b>.</p>
<div id="out"></div>
<script>
const doc = `<svg class="ic" viewBox="0 0 16 16"><path d="M4 1.5h5l3 3v10H4z" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M9 1.5v3h3" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>`;
const bigDoc = c => `<svg class="big" viewBox="0 0 30 36"><path d="M3 1h16l8 8v26H3z" fill="${c}" opacity=".16"/><path d="M3 1h16l8 8v26H3z" fill="none" stroke="${c}" stroke-width="1.4"/><path d="M19 1v8h8" fill="none" stroke="${c}" stroke-width="1.4"/><text x="15" y="28" font-size="7" text-anchor="middle" fill="${c}" font-family="-apple-system" font-weight="700">MD</text></svg>`;
const say = h => `<div class="bubble"><p>${h}</p></div>`;
const fileCard = `<div class="card">${bigDoc("var(--link)")}<div><div class="n">REPORT.md</div><div class="p">~/fun/cmux/plans/cmux-next · 4 KB · edited 2 min ago</div></div></div>`;
const mdPrev = `<div class="prev"><div class="body"><h4>Update check perf</h4><ul><li>Sparkle session setup: 1.8 s</li><li>Appcast fetch (2 redirects): 0.9 s</li><li>Helper version checks, one after another: 2.4 s</li><li>Plan: one small latest.json GET</li></ul></div><div class="foot"><b>update-check-PERF.md</b><span>Markdown · 3 KB</span></div></div>`;
const imgPrev = `<div class="prev"><div class="img"></div><div class="foot"><b>hover-card-after.png</b><span>PNG · 1440×900 · 212 KB</span></div></div>`;
const variants = [
  [1,"Inline plain link","The file name is a normal link in the sentence. Same look as every other link.",
    say(`a341 wrote the cause and the timings in <a>update-check-PERF.md</a>. The fix lands next.`)],
  [2,"Inline link with file icon","A small document icon before the name, in the link color, sized to the text so the line does not grow.",
    say(`a341 wrote the cause and the timings in <a>${doc}update-check-PERF.md</a>. The fix lands next.`)],
  [3,"File card","An attachment card under the bubble: icon, name, folder, size and edit time. Click opens it on the right.",
    say(`Here is the report.`) + fileCard],
  [4,"Preview card (Markdown and images)","Markdown shows its first lines; an image shows a thumbnail. Name and size underneath.",
    say(`The report and the after screenshot:`) + mdPrev + imgPrev],
  [5,"Link when mentioned, card when sent","A file the Chief only talks about stays an inline link. A file the Chief hands to you (\"here is…\", a finished deliverable) gets a card under the bubble, with a preview for Markdown and images.",
    say(`a341 is still timing the check; the notes so far are in <a>update-check-PERF.md</a>.`) +
    `<div class="lab">Later, when the report is done:</div>` + say(`The update-check report is done.`) + mdPrev, true],
];
document.getElementById("out").innerHTML = variants.map(([n,name,why,html,rec]) => `
<section class="v"><h2>${n}. ${name}${rec?'<span class="rec">Recommended</span>':''}</h2><p class="why">${why}</p>
<div class="pair"><div class="pane light">${html}</div><div class="pane dark">${html}</div></div></section>`).join("");
</script>
</body></html>
