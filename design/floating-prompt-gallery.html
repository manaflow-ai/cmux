<!doctype html>
<!-- Floating prompts over every app (ask-7ae09a0dcf): the join consent, the device-control banner and the
     Computer Use question, before and after the prompt glass pass. A token mock of the native cards
     (CmuxDialogView overApps, cmux Remote's ApprovalView and ApprovalQuestionView), not a capture.
     ?v=before|dark|light|tinted picks one variant; no query shows them all. -->
<html><head><meta charset="utf-8"><title>Floating prompt gallery</title>
<style>
  :root { font: 13px/1.35 -apple-system, "SF Pro Text", "Inter", system-ui, sans-serif; }
  body { margin: 0; background: #111; color: #eee; }
  h2 { font-size: 15px; font-weight: 600; margin: 18px 20px 8px; }
  .variant { padding: 0 0 12px; }
  .row { display: flex; gap: 0; }
  /* Two pages an app could show under the prompt: a bright document and a dark editor. */
  .page { position: relative; width: 520px; height: 430px; overflow: hidden; }
  .page.bright { background: linear-gradient(135deg, #fff 0 40%, #e9f1ff 40% 60%, #fff3d6 60%); }
  .page.bright::before { content: ""; position: absolute; inset: 30px; background: repeating-linear-gradient(#0000 0 18px, #c9d3e2 18px 20px); }
  .page.dark { background: linear-gradient(160deg, #0c0f14, #1c2533 55%, #3a1f2b); }
  .page.dark::before { content: ""; position: absolute; inset: 30px; background: repeating-linear-gradient(#0000 0 18px, #2c3a52 18px 20px); }
  .card { position: absolute; top: 14px; right: 14px; width: 400px; box-sizing: border-box; padding: 16px;
    border-radius: 24px; backdrop-filter: blur(30px) saturate(1.6); -webkit-backdrop-filter: blur(30px) saturate(1.6);
    background: var(--veil); color: var(--text); box-shadow: 0 12px 36px #0006, inset 0 1px 0 var(--rim-top), inset 0 -1px 0 var(--rim-bottom); }
  .head { display: flex; align-items: center; gap: 8px; }
  .icon { width: 20px; height: 20px; border-radius: 5px; background: linear-gradient(135deg, #5b8cff, #a35bff); flex: none; }
  .title { font-size: 15px; font-weight: 600; }
  .q { color: var(--secondary); margin-top: 8px; }
  .note { color: var(--tertiary); font-size: 11px; margin-top: 8px; }
  .well { font: 12px/1.4 ui-monospace, Menlo, monospace; margin-top: 8px; padding: 6px 10px; border-radius: 8px;
    background: color-mix(in srgb, var(--text) 6%, transparent); box-shadow: inset 0 0 0 0.5px color-mix(in srgb, var(--text) 14%, transparent); }
  .buttons { display: flex; flex-direction: column; gap: 4px; margin-top: 12px; }
  .b { height: 26px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 500; }
  .b.primary { background: var(--text); color: var(--card); font-weight: 600; }
  .b.secondary { background: color-mix(in srgb, var(--text) 9%, transparent); }
  .b.quiet { color: var(--danger); }
  .hrow { display: flex; gap: 6px; margin-top: 12px; }
  .hrow .b { flex: 1; background: color-mix(in srgb, var(--text) 9%, transparent); }
  .hrow .b.primary { background: var(--accent); color: #fff; }
  /* Before: the system's popover glass with no theme: one look for every theme, thin over a bright page. */
  .before { --veil: rgba(246,246,246,.42); --text: #1d1d1f; --secondary: #6e6e73; --tertiary: #8e8e93; --danger: #ff3b30;
    --card: #fff; --accent: #0a84ff; --rim-top: #fff6; --rim-bottom: #0001; }
  .before .card.big-icon .head .icon { width: 40px; height: 40px; border-radius: 9px; }
  .before .card { border-radius: 12px; }
  .before .page.dark .card { --veil: rgba(40,40,44,.38); --text: #f5f5f7; --secondary: #a1a1a6; --tertiary: #8e8e93; --card: #1c1c1e; }
  /* After: SurfaceRole.prompt: the theme's glass tint at 74% (dark) / 80% (light), inks fit over any page. */
  .dark-theme { --veil: rgba(30,30,32,.74); --text: #F2F2F2; --secondary: #C4C4C6; --tertiary: #9A9A9E; --danger: #FF7A70;
    --card: #2A2A2C; --accent: #4C8DFF; --rim-top: #ffffff4d; --rim-bottom: #ffffff0f; }
  .light-theme { --veil: rgba(247,243,234,.80); --text: #2B2A27; --secondary: #4F4D48; --tertiary: #6E6B64; --danger: #B3261E;
    --card: #F4EFE4; --accent: #9A5B13; --rim-top: #ffffffd9; --rim-bottom: #0000001a; }
  .tinted-theme { --veil: rgba(30,43,58,.74); --text: #E4ECF5; --secondary: #BFCCDA; --tertiary: #93A4B8; --danger: #FF8C82;
    --card: #23384C; --accent: #6FB3FF; --rim-top: #ffffff4d; --rim-bottom: #ffffff0f; }
  .label { font-size: 12px; color: #aaa; margin: 0 20px 6px; }
</style></head><body>
<template id="cards">
  <div class="row">
    <div class="page bright"><div class="card join">
      <div class="head"><span class="icon"></span><span class="title">A machine on your team asked to control this Mac.</span></div>
      <div class="q">Allow control from your team's machines?</div>
      <div class="note">You can change this later in Settings &gt; Devices.</div>
      <div class="buttons"><div class="b primary">Allow</div><div class="b secondary">Settings…</div><div class="b quiet">Deny</div></div>
    </div></div>
    <div class="page dark"><div class="card device">
      <div class="head"><span class="icon"></span><span class="title">Studio Mac wants to control this Mac</span></div>
      <div class="q">It can see your screen and use your mouse and keyboard.</div>
      <div class="note">Allow lets Studio Mac control this Mac from now on. Change it in Devices.</div>
      <div class="note">Device key</div><div class="well">78BE 18E0 C08C 9C4D<br>7443 D95E 2DB6 8074</div>
      <div class="buttons"><div class="b primary">Allow</div><div class="b secondary">Allow Only This Time</div><div class="b quiet">Not Now</div></div>
    </div></div>
    <div class="page bright"><div class="card cua">
      <div class="head"><span class="icon" style="background:var(--accent);border-radius:50%"></span><span class="title">Claude wants to use Safari</span></div>
      <div class="q">It can see Safari's windows and click and type in them.</div>
      <div class="hrow"><div class="b">Deny</div><div class="b primary">Allow Once</div></div>
      <div class="hrow" style="margin-top:4px"><div class="b">Allow for This Session</div><div class="b">Always Allow Safari</div></div>
    </div></div>
  </div>
</template>
<script>
  const variants = [
    ["before", "Before: the system's glass, no theme (the same card in every theme)"],
    ["dark", "After: default dark theme, prompt glass (veil 74%)"],
    ["light", "After: a light theme, prompt glass (veil 80%)"],
    ["tinted", "After: a tinted dark theme (glass tint is the theme's)"],
  ];
  const only = new URLSearchParams(location.search).get("v");
  for (const [id, label] of variants) {
    if (only && only !== id) continue;
    const section = document.createElement("section");
    section.className = "variant " + (id === "before" ? "before" : id + "-theme");
    section.innerHTML = `<h2>${label}</h2>`;
    section.append(document.getElementById("cards").content.cloneNode(true));
    if (id === "before") section.querySelectorAll(".card").forEach(c => c.classList.add("big-icon"));
    document.body.append(section);
  }
</script>
</body></html>
