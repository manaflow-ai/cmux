# Alacritty config fixture
[general]
import = ["themes/tokyo.toml"]

[font]
size = 13.5

[font.normal]
family = "Iosevka Term"
style = "Regular"

[cursor]
style = { shape = "Beam", blinking = "On" }

[window]
opacity = 0.9
blur = true
option_as_alt = "OnlyLeft"
padding = { x = 12, y = 8 }
decorations = "Buttonless"

[scrolling]
history = 50_000

[colors.primary]
foreground = "#c0caf5"

[[keyboard.bindings]]
key = "N"
mods = "Command"
action = "CreateNewWindow"
