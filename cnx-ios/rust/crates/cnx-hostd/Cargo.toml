[package]
name = "cnx-hostd"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "cnx-ios Mac bridge: registers the Mac, answers WebRTC and WireGuard dials, serves link channels"

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
base64.workspace = true
bytes.workspace = true
cnx-link.workspace = true
cmux-rd-core.workspace = true
cmux-rd-proto.workspace = true
futures-util.workspace = true
libc = "0.2"
reqwest.workspace = true
# P-256 verification of the phone's pairing keys (src/pairing.rs); already in
# the graph through rustls.
ring = "0.17"
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["process"] }
tokio-tungstenite.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[features]
# cnx-fake-backend: the fake backend from cnx-link's test support.
fake-backend = ["cnx-link/testing"]

[[bin]]
name = "cnx-fake-backend"
required-features = ["fake-backend"]

[dev-dependencies]
cnx-link = { workspace = true, features = ["testing"] }
cmux-rd-core.workspace = true
cmux-rd-engine.workspace = true
tempfile = "3"
