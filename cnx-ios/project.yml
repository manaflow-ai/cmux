# cnx-ios app project. Generate with `xcodegen generate` in cnx-ios/.
# The project file is generated and not checked in.
name: CnxApp
configs:
  Debug: debug
  Release: release
  # Demo: optimized like Release, with the DEBUG developer surface
  # (dev sign-in, Settings → Developer, scripted demos). Built by
  # scripts/demo-build.sh for hand-installed demo builds; never uploaded.
  Demo: release
options:
  bundleIdPrefix: dev.cmux.cnx
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    CNX_TAG: ""
    CNX_DISPLAY_NAME: cmux
  configs:
    Demo:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG CNX_DEMO
      SWIFT_OPTIMIZATION_LEVEL: -O
packages:
  CnxKit:
    path: CnxKit
targets:
  CnxApp:
    type: application
    platform: iOS
    sources:
      - App
      - path: ../AppIcon.icon
        buildPhase: resources
    dependencies:
      - package: CnxKit
        product: CnxShell
      - package: CnxKit
        product: CnxAuth
      - package: CnxKit
        product: CnxModel
      - package: CnxKit
        product: CnxTerminal
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.cmux.cnx$(CNX_TAG)
        PRODUCT_NAME: CnxApp
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_TEAM: 7WLXT3NR37
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: $(CNX_DISPLAY_NAME)
        CNXTag: $(CNX_TAG)
        NSCameraUsageDescription: Take a photo to attach to a message for your agent.
        NSPhotoLibraryAddUsageDescription: Save images from your sessions to Photos.
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchMark
          UIImageRespectsSafeAreaInsets: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
