[package]
name = "mux-link"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Connects a machine to a mux server and lets its muxes drive local acpmux agents."

[[bin]]
name = "mux-link"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.52", features = [
  "rt-multi-thread",
  "macros",
  "process",
  "io-util",
  "net",
  "sync",
  "time",
  "fs",
] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
