# Declarative CI ownership table. Include rules win over neutral rules.
# macOS defaults to run so every new or unknown path receives native coverage.
version: 1

force_all:
  default: skip
  include:
    - ".github/workflows/ci.yml"
    - ".github/ci-areas.yml"
    - "scripts/ci/**"
    - "tests/test_ci_change_areas.py"

macos:
  default: run
  include:
    - ".github/workflows/ci-macos.yml"
    - "docs/cli-contract.md"
    - "webviews/src/agent-session/**"
    - "package.json"
    - "bun.lock"
    - "biome.json"
    - "Resources/agent-session-react/**"
    - "Resources/agent-session-solid/**"
    - "skills/cmux-cua/**"
  neutral:
    - ".github/workflows/**"
    - ".github/actionlint.yaml"
    - "docs/**"
    - "design/**"
    - "plans/**"
    - "ios/**"
    - "web/**"
    - "webviews/**"
    - "cmux-tui/**"
    - "README.md"
    - "README.*.md"
    - "**/CLAUDE.md"
