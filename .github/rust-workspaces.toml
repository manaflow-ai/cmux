# Every Cargo workspace in the repository, and how pull requests check it.
#
# A workspace is a Cargo.toml with a [workspace] table, or a package outside every
# workspace (none above it, or excluded by the one above it). Each one has exactly
# one entry here, and `.github/scripts/rust-workspaces.py check` fails the
# rust-workspaces workflow when the tree and this list disagree, so a new workspace
# cannot land without saying how it is checked.
#
# An entry is one of:
#   run = true             rust-workspaces.yml runs `cargo clippy --workspace
#                          --all-targets -- -D warnings` and `cargo test --workspace`
#                          on it when a pull request changes it or a path dependency
#                          of it (--locked when it tracks a Cargo.lock). Optional:
#                          `args` (added to both commands), `apt` (packages to
#                          install), `ghostty` is derived (ghostty-vt-sys in its
#                          path dependencies), `inputs` (more paths whose change
#                          plans it, for files its code reads that the source scan
#                          cannot see). Without a tracked Cargo.lock the dependencies
#                          resolve fresh each run.
#   covered_by = "FILE"    another workflow runs clippy --all-targets and the tests
#                          on its own paths; FILE must name the root.
#   skip = "why"           nothing checks it, for the reason given.

[[workspace]]
root = "cmux-screen"
skip = "standalone screen host on LiveKit's prebuilt libwebrtc; not linked into the app, which streams with CmuxScreenKit"

[[workspace]]
root = "cmux-tui"
covered_by = ".github/workflows/cmux-tui-spec.yml"

