name: cmux-next crash-class rules

# The crash classes found by the socket action sweep (cx-t7hu, cx-bpcj,
# cx-050n): isolated deinits, task locals bound outside a task, and
# synchronous NSWorkspace opens; and availableData in a pipe's
# readabilityHandler (cmuxterm-hq#4753). The full check-concurrency.sh also blocks
# through the cmux-next checks job's final outcome aggregate. This narrower
# blocking Linux check runs on every pull request and push that touches
# CmuxNext Sources or the rules (about ten seconds, no build). It also runs
# the unrecognized-selector rule (scripts/cmux-next/check-objc-selectors.py):
# a Swift `super` call to a method the framework superclass does not implement
# at runtime (2026-10-20, `-[PageWKWebView draggingEnded:]`).
on:
  pull_request:
    paths:
      - "Packages/macOS/CmuxNext/Sources/**"
      - "Packages/macOS/CmuxNext/Package.swift"
      - "scripts/cmux-next/check-concurrency.sh"
      - "scripts/cmux-next/check-main-actor-work.py"
      - "scripts/cmux-next/check-bridge-on-main.py"
      - "scripts/cmux-next/bridge-on-main-baseline.json"
      - "tests/test_check_bridge_on_main.py"
      - "scripts/cmux-next/swift_scope.py"
      - "tests/test_check_concurrency_generic_deinit.py"
      - "tests/test_check_concurrency_pipe_reads.py"
      - "tests/test_check_concurrency_caller_isolated.py"
      - "scripts/cmux-next/caller_isolation.py"
      - "scripts/cmux-next/caller-isolated-blocking-pending.json"
      - "scripts/ci/crash-class-gate.sh"
      - "scripts/ci/pr_owned_findings.py"
      - "scripts/cmux-next/check-objc-selectors.py"
      - "scripts/cmux-next/objc-selector-table.json"
      - "scripts/cmux-next/check-cef-objc-contract.py"
      - "scripts/cmux-next/chromium-objc-contract.json"
      - "scripts/cmux-next/cef-manifest.json"
      - ".github/workflows/cmux-next-crash-class.yml"
  push:
    branches:
      - feat-cmux-next
    paths:
      - "Packages/macOS/CmuxNext/Sources/**"
      - "Packages/macOS/CmuxNext/Package.swift"
      - "scripts/cmux-next/check-concurrency.sh"
      - "scripts/cmux-next/check-main-actor-work.py"
      - "scripts/cmux-next/check-bridge-on-main.py"
      - "scripts/cmux-next/bridge-on-main-baseline.json"
      - "tests/test_check_bridge_on_main.py"
      - "scripts/cmux-next/swift_scope.py"
      - "tests/test_check_concurrency_generic_deinit.py"
      - "tests/test_check_concurrency_pipe_reads.py"
      - "tests/test_check_concurrency_caller_isolated.py"
      - "scripts/cmux-next/caller_isolation.py"
      - "scripts/cmux-next/caller-isolated-blocking-pending.json"
      - "scripts/ci/crash-class-gate.sh"
      - "scripts/ci/pr_owned_findings.py"
      - "scripts/cmux-next/check-objc-selectors.py"
      - "scripts/cmux-next/objc-selector-table.json"
      - "scripts/cmux-next/check-cef-objc-contract.py"
      - "scripts/cmux-next/chromium-objc-contract.json"
      - "scripts/cmux-next/cef-manifest.json"
      - ".github/workflows/cmux-next-crash-class.yml"
  workflow_dispatch:

concurrency:
  group: cmux-next-crash-class-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Temporary REST budget attribution: one gh-call line per GitHub API call (scripts/ci/api_call_log/env.sh, fetched at a fixed commit when the checkout has no copy).
  BASH_ENV: '$({ w="${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh"; t="${RUNNER_TEMP:-/nonexistent}/api-call-log-src"; if [ -f "$w" ]; then echo "$w"; elif [ -n "${RUNNER_TEMP:-}" ]; then if [ ! -f "$t/env.sh" ] && [ ! -e "$t.tried" ] && { [ "${RUNNER_OS:-}" = Linux ] || [ "${RUNNER_OS:-}" = macOS ]; } && [ "$(date -u +%Y%m%d%H)" -lt 2026112300 ]; then : > "$t.tried"; mkdir -p "$t.part" && for x in env.sh gh sitecustomize.py isolated.py; do curl -fsSL --max-time 5 -o "$t.part/$x" "https://raw.githubusercontent.com/manaflow-ai/cmux/27647ffd3ae838c63be28ca3e5883dcd68c34518/scripts/ci/api_call_log/$x" || break; done; [ -s "$t.part/isolated.py" ] && mv "$t.part" "$t"; fi; if [ -f "$t/env.sh" ]; then echo "$t/env.sh"; else echo unset BASH_ENV > "$t.off.sh" && echo "$t.off.sh"; fi; fi; } 2>/dev/null)'

jobs:
  crash-class:
    name: cmux-next crash-class rules
    # A feat-cmux-next pull request runs this job's commands as the ci/steps.toml step `cmux-next-crash-class`
    # (pr-pipeline.yml); a push and a pull request into any other base still run them here. Tier A of the merged
    # pull request replay (scripts/ci/affected-jobs.json pull_request_skip): a pull request into a stacked
    # feat-cmux-next-* base skips it unless labeled full-ci; the feat-cmux-next push runs it.
    if: ${{ (github.event_name != 'pull_request' || github.base_ref != 'feat-cmux-next') && (github.event_name != 'pull_request' || !startsWith(github.event.pull_request.base.ref, 'feat-cmux-next') || contains(github.event.pull_request.labels.*.name, 'full-ci')) }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || 'cmux-linux' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # A pull request's merge commit with its parents: the gate fails the
          # PR only for findings in the files it changes.
          fetch-depth: ${{ github.event_name == 'pull_request' && '2' || '1' }}
          persist-credentials: false
          sparse-checkout: |
            Packages/macOS/CmuxNext/Sources
            Packages/macOS/CmuxNext/Package.swift
            scripts/cmux-next
            scripts/ci/crash-class-gate.sh
            scripts/ci/pr_owned_findings.py
            tests/test_check_concurrency_generic_deinit.py
            tests/test_check_concurrency_pipe_reads.py
            tests/test_check_concurrency_caller_isolated.py
            tests/test_check_bridge_on_main.py
            .gitmodules
          sparse-checkout-cone-mode: false

      - name: Crash-class concurrency rules
        env:
          GATE_SCOPE: ${{ github.event_name == 'pull_request' && '--pr' || '' }}
        run: scripts/ci/crash-class-gate.sh ${GATE_SCOPE:+"$GATE_SCOPE"}

      # The generic-class rule is red on #23050's shape and green with `nonisolated deinit`.
      - name: Crash-class rule tests
        if: ${{ !cancelled() }}
        run: python3 -I tests/test_check_concurrency_generic_deinit.py

      # The pipe-read rule is red on availableData in a readabilityHandler and green with readReady().
      - name: Pipe-read rule tests
        if: ${{ !cancelled() }}
        run: python3 -I tests/test_check_concurrency_pipe_reads.py

      # The caller-isolated blocking rule is red on ProcessRunner's shape (a blocking call in a nonisolated
      # async function, awaited from the main actor) and green with @concurrent or work.run.
      - name: Caller-isolated blocking rule tests
        if: ${{ !cancelled() }}
        run: python3 -I tests/test_check_concurrency_caller_isolated.py

      # The bridge-on-main rules are red on cmux#59531's shape (fileRoot to a welcome op, reached per sidebar
      # row) and green on cmux#60927's. The tree-wide ratchet runs with check-main-actor-work.py in the checks
      # job's slow checks (scripts/ci/cmux-next-slow-checks.txt).
      - name: Bridge-on-main rule tests
        if: ${{ !cancelled() }}
        run: python3 -I tests/test_check_bridge_on_main.py

      # Every `super.<member>` must reach a selector its framework superclass
      # answers on each macOS recorded in the table, or be guarded.
      - name: Unrecognized-selector rule (super calls)
        if: ${{ !cancelled() }}
        run: python3 -I scripts/cmux-next/check-objc-selectors.py

      # Every selector Chromium can send to NSApp or its delegate has a reviewed
      # verdict, `implemented` ones are declared, and the contract was reviewed
      # for the pinned engine (a CEF bump fails here until it is). The engine
      # binary itself is read in cmux-next.yml's Release compile job.
      - name: Chromium Objective-C contract
        if: ${{ !cancelled() }}
        run: python3 -I scripts/cmux-next/check-cef-objc-contract.py
