name: cmux VM secrets seal to cmux-platform

# Cutover step 1 of manaflow-ai/cmux-platform workers/cmux-vm/MOVED.md: the cmux VM API Worker's GitHub environment
# secrets go from this repository's environments cmux-vm-staging and cmux-vm-production into cmux-platform's
# environments of the same names. GitHub secrets are write-only and no App here holds secrets write on cmux-platform, so
# each job reads its environment's values, seals them to the matching cmux-platform environment's public key and
# publishes ciphertext only (artifact sealed-secrets, 1 day; scripts/ci/sealed_secrets.py, docs/ci-sealed-secrets.md).
# Then an account with write access to cmux-platform's environment secrets stores both bundles:
#   D="$(mktemp -d)"; gh run download RUN_ID -R manaflow-ai/cmux -n sealed-secrets -D "$D"
#   python3 scripts/ci/sealed_secrets.py put "$D"
#
# Names: every environment secret cmux-vm.yml reads in that environment (its header and each job's secrets.X), except
# the repository-level CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID and the CMUX_PR_AUTOFIX_APP_* push App (a repository
# secret too, not the Worker's). A name whose value is empty is skipped and listed in the summary, by name only.
#
# The public keys: by default job `keys` reads them live with the manaflow-cmux-pr-autofix App (environments: read on
# cmux-platform). When that App cannot read them (not installed there, or not granted), pass them as the four inputs;
# they are public values (`gh api repos/manaflow-ai/cmux-platform/environments/ENV/secrets/public-key`). Either way
# `put` reads the live key again and writes nothing when it differs.
#
# Values exist only in the seal step's environment (GitHub masks them) and the Python process that seals them: never
# printed, written in the clear or passed as an argument. Nothing in Cloudflare, cmux or cmux-platform changes here.
# Dispatch it from feat-cmux-next. The push trigger exists only so GitHub registers a dispatch-only workflow that the
# default branch does not carry: on push and on a pull request every job is skipped, so no edit of this file runs with a
# secret undispatched.
on:
  workflow_dispatch:
    inputs:
      staging_key_id:
        description: "Optional: cmux-platform cmux-vm-staging public key_id (empty: read it with the App)"
        required: false
        default: ""
      staging_key:
        description: "Optional: cmux-platform cmux-vm-staging public key, base64"
        required: false
        default: ""
      production_key_id:
        description: "Optional: cmux-platform cmux-vm-production public key_id (empty: read it with the App)"
        required: false
        default: ""
      production_key:
        description: "Optional: cmux-platform cmux-vm-production public key, base64"
        required: false
        default: ""
  push:
    branches: [feat-cmux-next]
    paths: [.github/workflows/cmux-vm-secrets-seal.yml]
  # A pull request that edits this file starts it too (every job skipped), so it cannot first go red after the merge
  # (tests/test_ci_post_merge_checks.py).
  pull_request:
    branches: [feat-cmux-next]
    paths: [.github/workflows/cmux-vm-secrets-seal.yml]

permissions:
  contents: read

concurrency:
  # One group per pull request (every job is skipped there, so a newer push cancels the older run); dispatches and the
  # push on feat-cmux-next share one group and queue.
  group: cmux-vm-secrets-seal-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Temporary REST budget attribution: one gh-call line per GitHub API call (scripts/ci/api_call_log/env.sh, fetched at a fixed commit when the checkout has no copy).
  BASH_ENV: '$({ w="${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh"; t="${RUNNER_TEMP:-/nonexistent}/api-call-log-src"; if [ -f "$w" ]; then echo "$w"; elif [ -n "${RUNNER_TEMP:-}" ]; then if [ ! -f "$t/env.sh" ] && [ ! -e "$t.tried" ] && { [ "${RUNNER_OS:-}" = Linux ] || [ "${RUNNER_OS:-}" = macOS ]; } && [ "$(date -u +%Y%m%d%H)" -lt 2026112300 ]; then : > "$t.tried"; mkdir -p "$t.part" && for x in env.sh gh sitecustomize.py isolated.py; do curl -fsSL --max-time 5 -o "$t.part/$x" "https://raw.githubusercontent.com/manaflow-ai/cmux/27647ffd3ae838c63be28ca3e5883dcd68c34518/scripts/ci/api_call_log/$x" || break; done; [ -s "$t.part/isolated.py" ] && mv "$t.part" "$t"; fi; if [ -f "$t/env.sh" ]; then echo "$t/env.sh"; else echo unset BASH_ENV > "$t.off.sh" && echo "$t.off.sh"; fi; fi; } 2>/dev/null)'

jobs:
  # The target public keys, in the App's own cmux-pr-autofix environment, which holds none of the Worker's secrets: the
  # App key never meets them.
  keys:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/feat-cmux-next'
    environment:
      name: cmux-pr-autofix
      deployment: false
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && (vars.CI_FORK_LINUX_RUNNER || 'ubuntu-24.04') || vars.CI_OVERFLOW_LINUX || 'cmux-linux' }}
    timeout-minutes: 5
    outputs:
      staging_key_id: ${{ steps.keys.outputs.staging_key_id }}
      staging_key: ${{ steps.keys.outputs.staging_key }}
      production_key_id: ${{ steps.keys.outputs.production_key_id }}
      production_key: ${{ steps.keys.outputs.production_key }}
    steps:
      - name: Mint a cmux-platform read token
        id: token
        if: inputs.staging_key == '' || inputs.production_key == ''
        # A refusal (App not installed on cmux-platform, or not granted environments read) leaves the inputs.
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.CMUX_PR_AUTOFIX_APP_ID }}
          private-key: ${{ secrets.CMUX_PR_AUTOFIX_APP_KEY }}
          owner: manaflow-ai
          repositories: cmux-platform
          permission-environments: read

      - name: Resolve the public keys
        id: keys
        env:
          TOKEN: ${{ steps.token.outputs.token }}
          STAGING_KEY_ID: ${{ inputs.staging_key_id }}
          STAGING_KEY: ${{ inputs.staging_key }}
          PRODUCTION_KEY_ID: ${{ inputs.production_key_id }}
          PRODUCTION_KEY: ${{ inputs.production_key }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, os, re, sys, urllib.error, urllib.request
          token = os.environ.get("TOKEN", "")
          failed = False
          with open(os.environ["GITHUB_OUTPUT"], "a") as out, open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              for short in ("staging", "production"):
                  env = f"cmux-vm-{short}"
                  key_id = os.environ[f"{short.upper()}_KEY_ID"].strip()
                  key = os.environ[f"{short.upper()}_KEY"].strip()
                  source = "dispatch input"
                  if bool(key_id) != bool(key):
                      print(f"::error::{env}: pass both {short}_key_id and {short}_key, or neither")
                      failed = True
                      continue
                  if not key:
                      if not token:
                          print(f"::error::{env}: the App token could not be minted for cmux-platform; dispatch again with "
                                f"{short}_key_id and {short}_key (gh api repos/manaflow-ai/cmux-platform/environments/{env}/secrets/public-key)")
                          failed = True
                          continue
                      request = urllib.request.Request(
                          f"https://api.github.com/repos/manaflow-ai/cmux-platform/environments/{env}/secrets/public-key",
                          headers={"Authorization": f"Bearer {token}", "Accept": "application/vnd.github+json",
                                   "X-GitHub-Api-Version": "2022-11-28"})
                      try:
                          with urllib.request.urlopen(request, timeout=30) as response:
                              live = json.load(response)
                      except urllib.error.HTTPError as error:
                          print(f"::error::{env}: the App cannot read cmux-platform's public key (HTTP {error.code}); dispatch "
                                f"again with {short}_key_id and {short}_key")
                          failed = True
                          continue
                      key_id, key, source = str(live.get("key_id", "")), str(live.get("key", "")), "read live with the App"
                  try:
                      valid = re.fullmatch(r"[0-9]{1,40}", key_id) and len(base64.b64decode(key, validate=True)) == 32
                  except ValueError:
                      valid = False
                  if not valid:
                      print(f"::error::{env}: key_id must be digits and key a base64 32-byte key")
                      failed = True
                      continue
                  out.write(f"{short}_key_id={key_id}\n{short}_key={key}\n")
                  print(f"{env}: key_id {key_id} ({source})")
                  summary.write(f"- cmux-platform `{env}` public key_id `{key_id}` ({source})\n")
          sys.exit(1 if failed else 0)
          PY

  seal:
    needs: keys
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/feat-cmux-next'
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && (vars.CI_FORK_LINUX_RUNNER || 'ubuntu-24.04') || vars.CI_OVERFLOW_LINUX || 'cmux-linux' }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          # cmux-vm.yml deploy-staging, smoke-staging, hyperdrive-ensure, db-connections-staging, journey-machines-staging.
          - environment: cmux-vm-staging
            names: >-
              CMUX_VM_UPSTREAM_API_KEY CMUX_VM_STACK_PROJECT_ID CMUX_VM_STACK_SECRET_SERVER_KEY CMUX_VM_DATABASE_URL
              CMUX_VM_SERVICE_KEYS CMUX_VM_SERVICE_KEYS_EXTRA CMUX_VM_SERVICE_KEYS_CLOUD_PLATFORM
              CMUX_DOGFOOD_STACK_EMAIL CMUX_DOGFOOD_STACK_PASSWORD
              CMUX_VM_SMOKE_API_KEY CMUX_VM_SMOKE_API_KEY_B CMUX_VM_SMOKE_SERVICE_KEY
          # cmux-vm.yml deploy-production, smoke-production, migrate-production, migrate-staging, sweep-orphans-production.
          - environment: cmux-vm-production
            names: >-
              CMUX_VM_UPSTREAM_API_KEY CMUX_VM_STACK_PROJECT_ID CMUX_VM_STACK_SECRET_SERVER_KEY CMUX_VM_DATABASE_URL
              CMUX_VM_SERVICE_KEYS CMUX_VM_SERVICE_KEYS_EXTRA CMUX_VM_SERVICE_KEYS_CLOUD_PLATFORM
              CMUX_JOURNEY_PROD_STACK_EMAIL CMUX_JOURNEY_PROD_STACK_PASSWORD
              CMUX_VM_SMOKE_SERVICE_KEY PLANETSCALE_SERVICE_TOKEN_ID PLANETSCALE_SERVICE_TOKEN
    environment: ${{ matrix.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # The dispatched commit itself: the Worker's secrets go only to code that was reviewed.
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: scripts/ci/sealed_secrets.py
          sparse-checkout-cone-mode: false

      - name: libsodium
        run: |
          set -euo pipefail
          if ! ldconfig -p | grep -q 'libsodium\.so\.23'; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends libsodium23
          fi

      - name: Seal ${{ matrix.environment }} to cmux-platform
        env:
          TARGET: ${{ matrix.environment }}
          NAMES: ${{ matrix.names }}
          SEAL_KEY_ID: ${{ matrix.environment == 'cmux-vm-production' && needs.keys.outputs.production_key_id || needs.keys.outputs.staging_key_id }}
          SEAL_KEY: ${{ matrix.environment == 'cmux-vm-production' && needs.keys.outputs.production_key || needs.keys.outputs.staging_key }}
          OUT: ${{ runner.temp }}/sealed
          # Only the names in NAMES are read; the rest are empty in the other environment.
          CMUX_VM_UPSTREAM_API_KEY: ${{ secrets.CMUX_VM_UPSTREAM_API_KEY }}
          CMUX_VM_STACK_PROJECT_ID: ${{ secrets.CMUX_VM_STACK_PROJECT_ID }}
          CMUX_VM_STACK_SECRET_SERVER_KEY: ${{ secrets.CMUX_VM_STACK_SECRET_SERVER_KEY }}
          CMUX_VM_DATABASE_URL: ${{ secrets.CMUX_VM_DATABASE_URL }}
          CMUX_VM_SERVICE_KEYS: ${{ secrets.CMUX_VM_SERVICE_KEYS }}
          CMUX_VM_SERVICE_KEYS_EXTRA: ${{ secrets.CMUX_VM_SERVICE_KEYS_EXTRA }}
          CMUX_VM_SERVICE_KEYS_CLOUD_PLATFORM: ${{ secrets.CMUX_VM_SERVICE_KEYS_CLOUD_PLATFORM }}
          CMUX_DOGFOOD_STACK_EMAIL: ${{ matrix.environment == 'cmux-vm-staging' && secrets.CMUX_DOGFOOD_STACK_EMAIL || '' }}
          CMUX_DOGFOOD_STACK_PASSWORD: ${{ matrix.environment == 'cmux-vm-staging' && secrets.CMUX_DOGFOOD_STACK_PASSWORD || '' }}
          CMUX_JOURNEY_PROD_STACK_EMAIL: ${{ matrix.environment == 'cmux-vm-production' && secrets.CMUX_JOURNEY_PROD_STACK_EMAIL || '' }}
          CMUX_JOURNEY_PROD_STACK_PASSWORD: ${{ matrix.environment == 'cmux-vm-production' && secrets.CMUX_JOURNEY_PROD_STACK_PASSWORD || '' }}
          CMUX_VM_SMOKE_API_KEY: ${{ matrix.environment == 'cmux-vm-staging' && secrets.CMUX_VM_SMOKE_API_KEY || '' }}
          CMUX_VM_SMOKE_API_KEY_B: ${{ matrix.environment == 'cmux-vm-staging' && secrets.CMUX_VM_SMOKE_API_KEY_B || '' }}
          CMUX_VM_SMOKE_SERVICE_KEY: ${{ secrets.CMUX_VM_SMOKE_SERVICE_KEY }}
          PLANETSCALE_SERVICE_TOKEN_ID: ${{ matrix.environment == 'cmux-vm-production' && secrets.PLANETSCALE_SERVICE_TOKEN_ID || '' }}
          PLANETSCALE_SERVICE_TOKEN: ${{ matrix.environment == 'cmux-vm-production' && secrets.PLANETSCALE_SERVICE_TOKEN || '' }}
        run: |
          set +x
          set -euo pipefail
          mkdir -p "$OUT"
          python3 - "$GITHUB_WORKSPACE/scripts/ci" <<'PY'
          import os, sys
          sys.path.insert(0, sys.argv[1])
          import sealed_secrets as s
          target = os.environ["TARGET"]
          names = os.environ["NAMES"].split()
          values, skipped = {}, []
          for name in names:
              value = os.environ.get(name, "")
              if value:
                  values[name] = value
              else:
                  skipped.append(name)
          if not values:
              print(f"::error::{target} holds none of the names; nothing sealed")
              sys.exit(1)
          bundle = s.seal_bundle("manaflow-ai/cmux-platform", target, os.environ["SEAL_KEY_ID"], os.environ["SEAL_KEY"], values)
          values = None
          s.write_bundle(os.path.join(os.environ["OUT"], f"bundle-{target}.json"), bundle)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(f"### {target} -> manaflow-ai/cmux-platform {target}\n\n")
              summary.write(f"Sealed ({len(bundle['secrets'])}): {', '.join(sorted(bundle['secrets']))}\n\n")
              summary.write(f"Skipped, empty in {target} ({len(skipped)}): {', '.join(skipped) or 'none'}\n")
          print(f"{target}: sealed {len(bundle['secrets'])}, skipped {len(skipped)} empty: {' '.join(skipped) or 'none'}")
          PY

      - name: Upload this environment's bundle (ciphertext only)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sealed-part-${{ matrix.environment }}
          path: ${{ runner.temp }}/sealed/bundle-${{ matrix.environment }}.json
          retention-days: 1
          if-no-files-found: error

  # One artifact `sealed-secrets` with bundle-cmux-vm-staging.json and bundle-cmux-vm-production.json, for `put DIR`.
  # Only when both environments sealed: a half set is never published.
  collect:
    needs: seal
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/feat-cmux-next'
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && (vars.CI_FORK_LINUX_RUNNER || 'ubuntu-24.04') || vars.CI_OVERFLOW_LINUX || 'cmux-linux' }}
    timeout-minutes: 5
    steps:
      - name: Merge the bundles into sealed-secrets
        uses: actions/upload-artifact/merge@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sealed-secrets
          pattern: sealed-part-*
          retention-days: 1
          delete-merged: true

      - name: Next step
        run: |
          {
            echo
            echo "Store both bundles as an account with write access to manaflow-ai/cmux-platform's environment secrets,"
            echo "from a manaflow-ai/cmux checkout of feat-cmux-next:"
            echo
            echo '```sh'
            echo 'D="$(mktemp -d)"'
            echo "gh run download ${GITHUB_RUN_ID} -R manaflow-ai/cmux -n sealed-secrets -D \"\$D\""
            echo 'python3 scripts/ci/sealed_secrets.py put "$D"'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
