name: iOS E2E

# End-to-end Mac-to-iPhone gate: a Linux runner owns a fresh backend for this
# run, while one macOS runner builds both the tagged Mac app and iOS simulator
# app. The apps use the backend for sign-in and pairing, then terminal traffic
# is forced through Iroh relays. Topology, ACLs, secrets, and promotion live in
# docs/ci/ios-e2e.md.
#
# No workflow-level path filter on purpose: the route job decides skips so the
# ios-e2e-status aggregate always reports a deterministic conclusion.
# The pull_request trigger stays off until the owner approves promotion (see
# docs/ci/ios-e2e.md). The workflow is dispatchable while infrastructure and
# the product path are validated.
# pull_request:
on: [workflow_dispatch]

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ios-e2e-pr-{0}', github.event.pull_request.number) || format('ios-e2e-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CMUX_E2E_DONE_FILE: /tmp/e2e-done-${{ github.run_id }}-${{ github.run_attempt }}
  CMUX_E2E_BACKEND_DONE_FILE: /tmp/e2e-backend-done-${{ github.run_id }}-${{ github.run_attempt }}
  CMUX_E2E_MAC_TAILNET_HOSTNAME: cmux-e2e-mac-${{ github.run_id }}-${{ github.run_attempt }}
  CMUX_E2E_BACKEND_TAILNET_HOSTNAME: cmux-e2e-backend-${{ github.run_id }}-${{ github.run_attempt }}
  CMUX_E2E_BACKEND_FQDN: cmux-e2e-backend-${{ github.run_id }}-${{ github.run_attempt }}.tail137216.ts.net
  CMUX_E2E_RUNNER_SSH_USER: runner

jobs:
  route:
    # Cheap Linux layer so every PR gets a routed conclusion once the trigger
    # is promoted. The classifier integration remains intentionally explicit.
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 5
    outputs:
      run_e2e: ${{ steps.decide.outputs.run_e2e }}
      run_clients: ${{ steps.decide.outputs.run_clients }}
      backend_tag: ${{ steps.decide.outputs.backend_tag }}
      web_changed: ${{ steps.decide.outputs.web_changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Depth 2 reaches both parents of a PR merge commit, which is all
          # the backend-tag path check needs to diff.
          fetch-depth: 2
          persist-credentials: false

      - name: Decide route and backend tag
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # TODO(ios-e2e): integrate scripts/ci/detect_ci_change_areas.py so
          # docs-only and unrelated diffs skip the expensive Mac job. Until
          # then the lane runs in shadow mode when dispatched.
          run_e2e=true
          run_clients=true
          web_changed=false
          if [ "$EVENT_NAME" = "pull_request" ]; then
            if git rev-parse -q --verify HEAD^2 >/dev/null; then
              if git diff --name-only HEAD^1 HEAD | grep -Eq '^web/'; then
                web_changed=true
              fi
            else
              # Isolate a rebase or detached edge rather than mutating the
              # shared stack when the changed-file diff is unavailable.
              web_changed=true
            fi
          fi
          if [ "$web_changed" = "true" ] && [ -n "${PR_NUMBER:-}" ]; then
            backend_tag="ci${PR_NUMBER}"
          else
            backend_tag="ci-main"
          fi
          # Forks cannot safely receive the tailnet and Stack secrets used by
          # this lane. Keep dispatches on forks as a deterministic skip too.
          if [ "${GITHUB_REPOSITORY_OWNER:-}" != "manaflow-ai" ]; then
            run_e2e=false
            run_clients=false
          fi
          {
            echo "run_e2e=$run_e2e"
            echo "run_clients=$run_clients"
            echo "web_changed=$web_changed"
            echo "backend_tag=$backend_tag"
          } >> "$GITHUB_OUTPUT"
          echo "route: run_e2e=$run_e2e web_changed=$web_changed backend_tag=$backend_tag"

  backend:
    # A fresh backend for this run on its own Linux runner: Postgres, web/
    # (Next.js), and the iroh-v2 + presence Workers with their Durable Objects
    # in local workerd, published on the tailnet by Tailscale Serve
    # (scripts/e2e/backend-up.sh). It holds until the iOS job touches its
    # done-file, so the macOS jobs start in PARALLEL and wait on its health
    # endpoints (scripts/e2e/backend-env.sh wait) instead of `needs:`-ing a
    # job that must stay alive for them.
    needs: route
    # Every job that mounts secrets is fenced off from fork heads: a fork PR
    # controls this workflow file's content, so it must never reach the
    # tailnet OAuth client, the CI Stack account, or the relay signing key.
    # success() must be spelled out — a custom `if:` replaces the implicit
    # needs-succeeded condition. The aggregate reports forks as a neutral skip.
    if: >-
      success()
      && needs.route.outputs.run_e2e == 'true'
      && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    # 8 vCPU: a cold `next build` dominates bring-up; warm runs restore it.
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || 'blacksmith-8vcpu-ubuntu-2404' }}
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: false

      # Sticky disks keep node_modules on Blacksmith's co-located storage
      # across runs, so `bun install` below is a lockfile check plus the
      # delta instead of a full extract. Each job gets its own clone of the
      # disk and commits it at job end; concurrent runs never share a mount.
      - name: Mount web node_modules
        if: github.repository_owner == 'manaflow-ai'
        uses: useblacksmith/stickydisk@94697d49e77d0dd78b77deb85ad3de63a28b4b8a # v1.7.1
        with:
          key: ${{ github.repository }}-ios-e2e-web-node-modules
          path: web/node_modules

      - name: Mount iroh-v2 node_modules
        if: github.repository_owner == 'manaflow-ai'
        uses: useblacksmith/stickydisk@94697d49e77d0dd78b77deb85ad3de63a28b4b8a # v1.7.1
        with:
          key: ${{ github.repository }}-ios-e2e-iroh-v2-node-modules
          path: workers/iroh-v2/node_modules

      - name: Mount presence node_modules
        if: github.repository_owner == 'manaflow-ai'
        uses: useblacksmith/stickydisk@94697d49e77d0dd78b77deb85ad3de63a28b4b8a # v1.7.1
        with:
          key: ${{ github.repository }}-ios-e2e-presence-node-modules
          path: workers/presence/node_modules

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: |
          set -euo pipefail
          for dir in web workers/iroh-v2 workers/presence; do
            (cd "$dir" && bun install --frozen-lockfile)
          done

      # The web build is keyed by the git tree of web/ plus the files the
      # build reads from outside it. An exact hit restores a finished .next
      # and skips `next build` entirely; any other hit (restore-keys) still
      # restores .next/cache, so the rebuild is incremental. Bump v1 when the
      # CI Stack project changes: NEXT_PUBLIC_* values are baked in.
      - name: Compute web build key
        id: web-key
        run: |
          set -euo pipefail
          tree="$(git rev-parse HEAD:web)"
          extra="$(git rev-parse HEAD:config/iroh/managed-relay-catalog.json)"
          echo "key=ios-e2e-web-next-v1-${tree}-${extra}" >> "$GITHUB_OUTPUT"

      - name: Restore web build
        id: web-cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: web/.next
          key: ${{ steps.web-key.outputs.key }}
          restore-keys: ios-e2e-web-next-v1-

      - name: Join tailnet
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          # The live ACL already grants tag:ci ownership of this per-run role.
          tags: tag:e2e-backend
          hostname: ${{ env.CMUX_E2E_BACKEND_TAILNET_HOSTNAME }}

      - name: Materialize backend dev secret bundle
        env:
          CMUXTERM_DEV_ENV_B64: ${{ secrets.CMUXTERM_DEV_ENV_B64 }}
        run: |
          set -euo pipefail
          if [ -z "${CMUXTERM_DEV_ENV_B64:-}" ]; then
            echo "::error::[infra-preflight] CMUXTERM_DEV_ENV_B64 is missing"
            exit 1
          fi
          secret_file="$RUNNER_TEMP/cmux-e2e-dev.env"
          printf '%s' "$CMUXTERM_DEV_ENV_B64" | base64 --decode > "$secret_file"
          chmod 600 "$secret_file"
          echo "CMUX_E2E_SECRET_FILE=$secret_file" >> "$GITHUB_ENV"

      - name: Start per-run backend
        env:
          CMUX_E2E_SKIP_WEB_BUILD: ${{ steps.web-cache.outputs.cache-hit == 'true' && '1' || '0' }}
        run: |
          set -euo pipefail
          set -a
          # The existing bundle is already used by ios-streamed-validate.yml.
          # Keep secret values in this step's environment and never put them
          # into GitHub outputs or command arguments.
          # shellcheck source=/dev/null
          source "$CMUX_E2E_SECRET_FILE"
          set +a
          export CMUX_E2E_STACK_PROJECT_ID="${STACK_PROJECT_ID:-${NEXT_PUBLIC_STACK_PROJECT_ID:-}}"
          export CMUX_E2E_STACK_PUBLISHABLE_KEY="${STACK_PUBLISHABLE_KEY:-${NEXT_PUBLIC_STACK_PUBLISHABLE_CLIENT_KEY:-}}"
          export CMUX_E2E_STACK_SERVER_KEY="${STACK_SERVER_KEY:-${STACK_SECRET_SERVER_KEY:-}}"
          export CMUX_E2E_RELAY_SIGNING_KEY="${RELAY_SIGNING_KEY:-}"
          export CMUX_E2E_RELAY_KEY_ID="${RELAY_KEY_ID:-}"
          for key in CMUX_E2E_STACK_PROJECT_ID CMUX_E2E_STACK_PUBLISHABLE_KEY \
              CMUX_E2E_STACK_SERVER_KEY CMUX_E2E_RELAY_SIGNING_KEY CMUX_E2E_RELAY_KEY_ID; do
            if [ -z "${!key:-}" ]; then
              echo "::error::[infra-preflight] backend secret $key is missing from CMUXTERM_DEV_ENV_B64"
              exit 1
            fi
          done
          ./scripts/e2e/backend-up.sh up

      # Saved before the hold, so a run that is still serving already warms
      # the next one. Exact-key hits skip the save.
      - name: Save web build
        if: steps.web-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: web/.next
          key: ${{ steps.web-key.outputs.key }}

      - name: Serve until the iOS job finishes
        if: needs.route.outputs.run_clients == 'true'
        # Above the iOS job's own ceiling, so the backend can never be the
        # first thing to disappear under a live client.
        timeout-minutes: 50
        env:
          CMUX_E2E_WAIT_TIMEOUT_SECONDS: "2700"
        run: ./scripts/e2e/backend-up.sh hold

      - name: Upload backend logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-e2e-backend-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/e2e-backend/logs
          if-no-files-found: warn
          retention-days: 7

      - name: Remove backend secret material
        if: always()
        run: |
          rm -f "${CMUX_E2E_SECRET_FILE:-}" workers/iroh-v2/.dev.vars workers/presence/.dev.vars


  mac-ios-e2e:
    # The Mac and simulator share one runner. That removes the runner-to-runner
    # network shortcut while relay-only policy keeps terminal traffic on the
    # same Iroh path the gate is meant to exercise.
    needs: route
    if: >-
      success()
      && needs.route.outputs.run_e2e == 'true'
      && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.MACOS_RUNNER_IOS || vars.MACOS_RUNNER_PR || 'blacksmith-6vcpu-macos-26' }}
    timeout-minutes: 120
    env:
      CMUX_E2E_TAG: ${{ needs.route.outputs.backend_tag }}
      CMUX_IROH_V2_FORCE_RELAY: "1"
      CMUX_SKIP_ZIG_BUILD: "1"
      SWIFT_BACKTRACE: interactive=no,timeout=0s,symbolicate=off,color=no
    steps:
      - name: Checkout cmux
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: recursive

      - name: Select Xcode
        run: ./scripts/select-ci-xcode.sh

      - name: Install build prerequisites
        run: |
          set -euo pipefail
          ./scripts/install-zig-ci.sh
          ./scripts/download-prebuilt-ghosttykit.sh || ./scripts/ensure-ghosttykit.sh
          brew_bin="$(brew --prefix)/bin"
          export PATH="$brew_bin:$PATH"
          echo "$brew_bin" >> "$GITHUB_PATH"
          if ! command -v axe >/dev/null 2>&1; then
            brew install cameroncooke/axe/axe
          fi
          command -v axe >/dev/null 2>&1 || {
            echo "::error::[infra-preflight] axe is missing from the simulator runner"
            exit 1
          }

      - name: Ensure iOS simulator runtime
        run: xcrun simctl list runtimes available | grep -Eq '\biOS\b' || xcodebuild -downloadPlatform iOS

      - name: Materialize CI auth profile
        env:
          CMUX_DOGFOOD_STACK_EMAIL: ${{ secrets.CMUX_DOGFOOD_STACK_EMAIL }}
          CMUX_DOGFOOD_STACK_PASSWORD: ${{ secrets.CMUX_DOGFOOD_STACK_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${CMUX_DOGFOOD_STACK_EMAIL:-}" ] || [ -z "${CMUX_DOGFOOD_STACK_PASSWORD:-}" ]; then
            echo "::error::[infra-preflight] CI Stack credentials are missing"
            exit 1
          fi
          mkdir -p "$HOME/.secrets"
          (
            umask 077
            # The agent profile reads CMUX_UITEST_*; the secret names retain
            # their existing CI account naming for compatibility.
            printf 'CMUX_UITEST_STACK_EMAIL=%s\n' "$CMUX_DOGFOOD_STACK_EMAIL"
            printf 'CMUX_UITEST_STACK_PASSWORD=%s\n' "$CMUX_DOGFOOD_STACK_PASSWORD"
          ) > "$HOME/.secrets/cmuxterm-dev.env"
          chmod 600 "$HOME/.secrets/cmuxterm-dev.env"

      - name: Join tailnet
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Point apps at the per-run backend
        run: ./scripts/e2e/backend-env.sh env --simctl >> "$GITHUB_ENV"

      - name: Wait for the per-run backend
        timeout-minutes: 21
        run: ./scripts/e2e/backend-env.sh wait 1200

      - name: Configure Mac relay-only policy
        run: |
          set -euo pipefail
          source scripts/lib/mobile-attach.sh
          mac_bundle_id="$(cmux_attach_mac_bundle_id "$CMUX_E2E_TAG")"
          defaults write "$mac_bundle_id" cmux.iroh.debug.transport-mode -string relayOnly
          defaults write "$mac_bundle_id" cmux.iroh.v2.force-relay -bool true

      - name: Boot fresh named simulator
        run: |
          set -euo pipefail
          devtype="$(xcrun simctl list devicetypes -j | python3 -c 'import json,sys; ts=[t["identifier"] for t in json.load(sys.stdin)["devicetypes"] if t.get("productFamily")=="iPhone"]; print(ts[-1])')"
          udid="$(xcrun simctl create "cmux-e2e-${GITHUB_RUN_ID}" "$devtype")"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          echo "CMUX_E2E_SIM_UDID=$udid" >> "$GITHUB_ENV"
          echo "simulator: $udid ($devtype)"

      - name: Build and launch Mac app
        run: |
          set -euo pipefail
          ./scripts/reload.sh \
            --tag "$CMUX_E2E_TAG" \
            --launch \
            --auth-profile agent \
            --credentials-file "$HOME/.secrets/cmuxterm-dev.env" \
            --swift-frontend-workaround

      - name: Build iOS simulator app
        run: |
          set -euo pipefail
          ./ios/scripts/reload.sh \
            --tag "$CMUX_E2E_TAG" \
            --simulator-id "$CMUX_E2E_SIM_UDID" \
            --simulator-only \
            --no-launch \
            --swift-frontend-workaround

      - name: Configure and verify simulator relay-only policy
        run: |
          set -euo pipefail
          source scripts/lib/mobile-attach.sh
          mac_bundle_id="$(cmux_attach_mac_bundle_id "$CMUX_E2E_TAG")"
          ios_bundle_id="dev.cmux.ios.$(cmux_attach__slug "$CMUX_E2E_TAG")"
          xcrun simctl spawn "$CMUX_E2E_SIM_UDID" defaults write \
            "$ios_bundle_id" cmux.iroh.debug.transport-mode -string relayOnly
          xcrun simctl spawn "$CMUX_E2E_SIM_UDID" defaults write \
            "$ios_bundle_id" cmux.iroh.v2.config.CMUX_IROH_V2_FORCE_RELAY -string 1
          [ "$(defaults read "$mac_bundle_id" cmux.iroh.debug.transport-mode)" = "relayOnly" ]
          [ "$(defaults read "$mac_bundle_id" cmux.iroh.v2.force-relay)" = "1" ]
          [ "$(xcrun simctl spawn "$CMUX_E2E_SIM_UDID" defaults read "$ios_bundle_id" cmux.iroh.debug.transport-mode)" = "relayOnly" ]
          [ "$(xcrun simctl spawn "$CMUX_E2E_SIM_UDID" defaults read "$ios_bundle_id" cmux.iroh.v2.config.CMUX_IROH_V2_FORCE_RELAY)" = "1" ]
          echo "relay policy: Mac and iOS simulator forced to relayOnly" >> "$GITHUB_STEP_SUMMARY"

      - name: Sign in and pair simulator
        run: |
          set -euo pipefail
          ./scripts/mobile-dev-launch.sh \
            --tag "$CMUX_E2E_TAG" \
            --simulator-id "$CMUX_E2E_SIM_UDID" \
            --ensure-mac \
            --detach \
            --auth-profile agent \
            --credentials-file "$HOME/.secrets/cmuxterm-dev.env"

      - name: Verify relay policy after launch
        run: |
          set -euo pipefail
          source scripts/lib/mobile-attach.sh
          mac_bundle_id="$(cmux_attach_mac_bundle_id "$CMUX_E2E_TAG")"
          ios_bundle_id="dev.cmux.ios.$(cmux_attach__slug "$CMUX_E2E_TAG")"
          [ "$(defaults read "$mac_bundle_id" cmux.iroh.v2.force-relay)" = "1" ]
          [ "$(xcrun simctl spawn "$CMUX_E2E_SIM_UDID" defaults read "$ios_bundle_id" cmux.iroh.v2.config.CMUX_IROH_V2_FORCE_RELAY)" = "1" ]

      - name: Run iOS E2E
        env:
          CMUX_E2E_EVIDENCE_DIR: ${{ runner.temp }}/e2e-evidence
        run: |
          set -euo pipefail
          ./scripts/e2e/ios-e2e-run.sh \
            --tag "$CMUX_E2E_TAG" \
            --sim-udid "$CMUX_E2E_SIM_UDID" \
            --evidence-dir "$CMUX_E2E_EVIDENCE_DIR"

      - name: Release per-run backend
        if: always()
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 \
            "$CMUX_E2E_RUNNER_SSH_USER@$CMUX_E2E_BACKEND_TAILNET_HOSTNAME" \
            "touch '$CMUX_E2E_BACKEND_DONE_FILE'" \
            || echo "::warning::[infra-preflight] could not signal backend holder; its bounded wait will expire"

      - name: Upload E2E evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-e2e-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/e2e-evidence
          if-no-files-found: warn
          retention-days: 7

      - name: Stop tagged Mac app
        if: always()
        run: |
          set -euo pipefail
          pkill -f "DerivedData/cmux-${CMUX_E2E_TAG}/.*/cmux DEV" 2>/dev/null || true

      - name: Delete simulator
        if: always()
        run: |
          set -euo pipefail
          [ -n "${CMUX_E2E_SIM_UDID:-}" ] || exit 0
          xcrun simctl shutdown "$CMUX_E2E_SIM_UDID" 2>/dev/null || true
          xcrun simctl delete "$CMUX_E2E_SIM_UDID" || true

      - name: Remove CI auth profile
        if: always()
        run: |
          rm -f "$HOME/.secrets/cmuxterm-dev.env"
          rmdir "$HOME/.secrets" 2>/dev/null || true

  ios-e2e-status:
    # The one conclusion branch protection will eventually require: green when
    # the route skipped the lane or the Mac job passed, red when the route ran
    # and the Mac job failed. Fork PRs are a neutral skip because secret-fenced
    # jobs cannot run there.
    needs: [route, backend, mac-ios-e2e]
    if: always()
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 5
    steps:
      - name: Aggregate
        env:
          ROUTE_RESULT: ${{ needs.route.result }}
          RUN_E2E: ${{ needs.route.outputs.run_e2e }}
          BACKEND_TAG: ${{ needs.route.outputs.backend_tag }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          MAC_IOS_RESULT: ${{ needs.mac-ios-e2e.result }}
          IS_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          set -euo pipefail
          {
            echo "### iOS E2E"
            echo "- route: $ROUTE_RESULT (run_e2e=${RUN_E2E:-<unset>}, backend tag=${BACKEND_TAG:-<unset>})"
            echo "- backend: $BACKEND_RESULT · mac-ios-e2e: $MAC_IOS_RESULT"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$IS_FORK" = "true" ]; then
            echo "- conclusion: neutral skip (fork PR; secret-fenced job cannot run)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$ROUTE_RESULT" != "success" ]; then
            echo "::error::route job did not succeed ($ROUTE_RESULT)"
            exit 1
          fi
          if [ "$RUN_E2E" != "true" ]; then
            echo "- conclusion: pass (route skipped the lane)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          fail=0
          if [ "$BACKEND_RESULT" != "success" ]; then
            echo "::error::backend: $BACKEND_RESULT (needed because route said run)"
            fail=1
          fi
          if [ "$MAC_IOS_RESULT" != "success" ]; then
            echo "::error::mac-ios-e2e: $MAC_IOS_RESULT (needed because route said run)"
            fail=1
          fi
          if [ "$fail" -ne 0 ]; then
            echo "- conclusion: FAIL" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "- conclusion: pass" >> "$GITHUB_STEP_SUMMARY"
