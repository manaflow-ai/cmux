name: iOS E2E

# End-to-end Mac<->iPhone gate: a real Mac app on one runner, a real iOS
# simulator app on another, and a fresh per-run backend (web + Postgres + the
# iroh-v2 and presence Durable Object Workers) on a third, Linux runner. The
# iOS side signs in, pairs to the remote Mac, connects over Iroh, and drives a
# 6-step streamed-terminal script whose steps each cover a shipped regression
# (scripts/e2e/README.md). Topology, ACLs, secrets and the promotion plan live
# in docs/ci/ios-e2e.md.
#
# No workflow-level path filter on purpose: the `route` job decides skips so
# the `ios-e2e-status` aggregate always reports a deterministic conclusion.
# ci.yml takes the same approach — a paths: filter leaves the check MISSING
# on unrelated PRs, which branch protection cannot require; a routed skip
# still reports green.
on:
  workflow_dispatch:
    inputs:
      backend_only:
        description: "Bring up and health-check the per-run backend, then stop (no macOS jobs)"
        type: boolean
        default: false
  # The pull_request trigger stays off until the owner approves this check's
  # promotion (see docs/ci/ios-e2e.md): tests enter a CI lane by proposal and
  # approval, and the product-download stubs below would red every PR today.
  # pull_request:

permissions:
  contents: read

# A newer push to the same pull request replaces its run; dispatches never
# cancel each other (same shape as test-ios.yml).
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ios-e2e-pr-{0}', github.event.pull_request.number) || format('ios-e2e-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Teardown is one file per holder, touched over Tailscale SSH by the iOS job:
  # the Mac host and the backend each watch a local path instead of polling
  # the GitHub API for the iOS job's status. A ~25-minute per-PR status-poll
  # loop would draw down the repo-wide API rate limit that every other
  # workflow shares (secondary-rate-limit stalls have hit this repo's CI
  # before), and a local file needs no token on the holder at all.
  CMUX_E2E_DONE_FILE: /tmp/e2e-done-${{ github.run_id }}-${{ github.run_attempt }}
  CMUX_E2E_BACKEND_DONE_FILE: /tmp/e2e-backend-done-${{ github.run_id }}-${{ github.run_attempt }}
  # Deterministic tailnet names. Every job must address the others while ALL
  # of them are still running, and GitHub job outputs only publish when the
  # producing job completes — so names derive from the run up front rather
  # than being exchanged at runtime. run_attempt keeps a rerun from colliding
  # with a not-yet-expired ephemeral node of the previous attempt.
  CMUX_E2E_MAC_TAILNET_HOSTNAME: cmux-e2e-mac-${{ github.run_id }}-${{ github.run_attempt }}
  CMUX_E2E_BACKEND_TAILNET_HOSTNAME: cmux-e2e-backend-${{ github.run_id }}-${{ github.run_attempt }}
  CMUX_E2E_BACKEND_FQDN: cmux-e2e-backend-${{ github.run_id }}-${{ github.run_attempt }}.tail137216.ts.net
  # Tag the prebuilt Mac and iOS products are stamped with (bundle id
  # suffix, /tmp/cmux-debug-<tag>.sock). Stack state is per run, so one tag
  # serves every run.
  CMUX_E2E_TAG: e2eci

jobs:
  route:
    # Decides whether the lane runs. Cheap Linux layer so every PR gets a
    # routed conclusion (see header).
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 5
    outputs:
      run_e2e: ${{ steps.decide.outputs.run_e2e }}
      run_clients: ${{ steps.decide.outputs.run_clients }}
    steps:
      - name: Decide route
        id: decide
        env:
          BACKEND_ONLY: ${{ inputs.backend_only }}
        run: |
          set -euo pipefail
          # TODO(ios-e2e): stub router. Integrate
          # scripts/ci/detect_ci_change_areas.py (the classifier ci.yml's
          # `changes` job uses) so docs-only and unrelated diffs skip all three
          # runners; until then every routed run says "run" and the lane's
          # cost is bounded by it not being required (shadow mode,
          # docs/ci/ios-e2e.md#promotion-plan). No web/-changed special case:
          # every run builds this revision's backend, so a PR's schema and
          # API changes are exactly what its run exercises.
          run_e2e=true
          run_clients=true
          if [ "${BACKEND_ONLY:-false}" = "true" ]; then
            run_clients=false
          fi
          {
            echo "run_e2e=$run_e2e"
            echo "run_clients=$run_clients"
          } >> "$GITHUB_OUTPUT"
          echo "route: run_e2e=$run_e2e run_clients=$run_clients"

  backend:
    # A fresh backend for this run on its own Linux runner: Postgres, web/
    # (Next.js), and the iroh-v2 + presence Workers with their Durable Objects
    # in local workerd, published on the tailnet by Tailscale Serve
    # (scripts/e2e/backend-up.sh). It holds until the iOS job touches its
    # done-file, so the macOS jobs start in PARALLEL and wait on its health
    # endpoints (scripts/e2e/backend-env.sh wait) instead of `needs:`-ing a
    # job that must stay alive for them.
    needs: route
    # Every job that mounts secrets is fenced off from fork heads: a fork PR
    # controls this workflow file's content, so it must never reach the
    # tailnet OAuth client, the CI Stack account, or the relay signing key.
    # success() must be spelled out — a custom `if:` replaces the implicit
    # needs-succeeded condition. The aggregate reports forks as a neutral skip.
    if: >-
      success()
      && needs.route.outputs.run_e2e == 'true'
      && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    # 8 vCPU: a cold `next build` dominates bring-up; warm runs restore it.
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || 'blacksmith-8vcpu-ubuntu-2404' }}
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: false

      # Sticky disks keep node_modules on Blacksmith's co-located storage
      # across runs, so `bun install` below is a lockfile check plus the
      # delta instead of a full extract. Each job gets its own clone of the
      # disk and commits it at job end; concurrent runs never share a mount.
      - name: Mount web node_modules
        if: github.repository_owner == 'manaflow-ai'
        uses: useblacksmith/stickydisk@94697d49e77d0dd78b77deb85ad3de63a28b4b8a # v1.7.1
        with:
          key: ${{ github.repository }}-ios-e2e-web-node-modules
          path: web/node_modules

      - name: Mount iroh-v2 node_modules
        if: github.repository_owner == 'manaflow-ai'
        uses: useblacksmith/stickydisk@94697d49e77d0dd78b77deb85ad3de63a28b4b8a # v1.7.1
        with:
          key: ${{ github.repository }}-ios-e2e-iroh-v2-node-modules
          path: workers/iroh-v2/node_modules

      - name: Mount presence node_modules
        if: github.repository_owner == 'manaflow-ai'
        uses: useblacksmith/stickydisk@94697d49e77d0dd78b77deb85ad3de63a28b4b8a # v1.7.1
        with:
          key: ${{ github.repository }}-ios-e2e-presence-node-modules
          path: workers/presence/node_modules

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: |
          set -euo pipefail
          for dir in web workers/iroh-v2 workers/presence; do
            (cd "$dir" && bun install --frozen-lockfile)
          done

      # The web build is keyed by the git tree of web/ plus the files the
      # build reads from outside it. An exact hit restores a finished .next
      # and skips `next build` entirely; any other hit (restore-keys) still
      # restores .next/cache, so the rebuild is incremental. Bump v1 when the
      # CI Stack project changes: NEXT_PUBLIC_* values are baked in.
      - name: Compute web build key
        id: web-key
        run: |
          set -euo pipefail
          tree="$(git rev-parse HEAD:web)"
          extra="$(git rev-parse HEAD:config/iroh/managed-relay-catalog.json)"
          echo "key=ios-e2e-web-next-v1-${tree}-${extra}" >> "$GITHUB_OUTPUT"

      - name: Restore web build
        id: web-cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: web/.next
          key: ${{ steps.web-key.outputs.key }}
          restore-keys: ios-e2e-web-next-v1-

      - name: Join tailnet
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          hostname: ${{ env.CMUX_E2E_BACKEND_TAILNET_HOSTNAME }}

      - name: Start per-run backend
        env:
          CMUX_E2E_SKIP_WEB_BUILD: ${{ steps.web-cache.outputs.cache-hit == 'true' && '1' || '0' }}
          # Dev Stack project of the CI account (CMUX_DOGFOOD_STACK_*), and
          # the dev v2 relay key the managed relays trust. Environment-only:
          # backend-up.sh writes them to 0600 .dev.vars files, never argv.
          CMUX_E2E_STACK_PROJECT_ID: ${{ secrets.CMUX_E2E_STACK_PROJECT_ID }}
          CMUX_E2E_STACK_PUBLISHABLE_KEY: ${{ secrets.CMUX_E2E_STACK_PUBLISHABLE_KEY }}
          CMUX_E2E_STACK_SERVER_KEY: ${{ secrets.CMUX_E2E_STACK_SERVER_KEY }}
          CMUX_E2E_RELAY_SIGNING_KEY: ${{ secrets.CMUX_E2E_RELAY_SIGNING_KEY }}
          CMUX_E2E_RELAY_KEY_ID: ${{ secrets.CMUX_E2E_RELAY_KEY_ID }}
        run: ./scripts/e2e/backend-up.sh up

      # Saved before the hold, so a run that is still serving already warms
      # the next one. Exact-key hits skip the save.
      - name: Save web build
        if: steps.web-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: web/.next
          key: ${{ steps.web-key.outputs.key }}

      - name: Serve until the iOS job finishes
        if: needs.route.outputs.run_clients == 'true'
        # Above the iOS job's own ceiling, so the backend can never be the
        # first thing to disappear under a live client.
        timeout-minutes: 50
        env:
          CMUX_E2E_WAIT_TIMEOUT_SECONDS: "2700"
        run: ./scripts/e2e/backend-up.sh hold

      - name: Upload backend logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-e2e-backend-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/e2e-backend/logs
          if-no-files-found: warn
          retention-days: 7

  mac-host:
    # Compiles nothing: reuses the prebuilt tagged Mac app, signs it into the
    # CI Stack account, advertises it through this run's backend so the iOS
    # client can discover it, then blocks on the done-file until the iOS job
    # signals (or the bounded wait expires). Starts in PARALLEL with backend
    # and ios-e2e: it waits on the backend's health endpoints, and the sim's
    # sign-in/pair sequence retries until the Mac is advertised, so
    # serializing the jobs would only add queue time.
    # Deliberately not `needs: backend`: the backend job holds until this
    # run's iOS job finishes, so waiting for its completion would deadlock.
    needs: route
    if: >-
      success()
      && needs.route.outputs.run_clients == 'true'
      && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'macos-14' || vars.MACOS_RUNNER_PR || 'blacksmith-6vcpu-macos-26' }}
    timeout-minutes: 45
    outputs:
      # Debug/audit only. A job output is readable by dependents only after
      # this job completes, and this job completes only after the signal —
      # the iOS job addresses the Mac by CMUX_E2E_MAC_TAILNET_HOSTNAME (the
      # deterministic name it joined with) instead.
      tailnet_hostname: ${{ steps.tailnet-name.outputs.hostname }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          # The app arrives prebuilt; the checkout is for the driver scripts.
          submodules: false

      - name: Select Xcode
        run: ./scripts/select-ci-xcode.sh

      - name: Download tagged Mac app product
        run: |
          set -euo pipefail
          # TODO(ios-e2e): reuse the compiled Mac app instead of building.
          # ci-macos.yml's admission job is the pattern: `python3
          # scripts/ci/reuse_app_host_products.py key <derived-data>` derives
          # the reuse key from the source/Xcode fingerprint, then `... restore
          # <derived-data>` (GH_TOKEN in env) pulls a producer-`seal`ed
          # Build/Products tree from a prior run's artifact or its R2 copy
          # into an isolated DerivedData root, with hit/miss reasons on the
          # step outputs. This job wants exactly that consumer path plus the
          # tag stamping scripts/reload.sh applies (bundle
          # com.cmuxterm.app.debug.<tag>, socket /tmp/cmux-debug-<tag>.sock),
          # and needs `permissions: actions: read` once wired. Until then,
          # fail fast with the infra label rather than idle for 45 minutes.
          echo "::error::[infra-preflight] Mac app product download not implemented (see reuse_app_host_products.py TODO)"
          exit 1

      - name: Join tailnet
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          # Deterministic name (see workflow env): the parallel iOS job must
          # be able to SSH here without a runtime hostname exchange.
          hostname: ${{ env.CMUX_E2E_MAC_TAILNET_HOSTNAME }}

      - name: Publish tailnet hostname
        id: tailnet-name
        run: |
          set -euo pipefail
          # TODO(ios-e2e): the original design exchanged the hostname from
          # `tailscale status --self --json` via a job output written before
          # the wait. That cannot work for a PARALLEL consumer — job outputs
          # publish only when the job completes, which here is after the
          # signal — so the deterministic join hostname above is the real
          # addressing mechanism. This output stays for logs, the aggregate,
          # and any future sequential consumer.
          hostname="$(tailscale status --self --json | python3 -c 'import json,sys; print(json.load(sys.stdin)["Self"]["DNSName"].rstrip("."))')"
          echo "hostname=$hostname" >> "$GITHUB_OUTPUT"
          echo "tailnet hostname: $hostname (expected prefix: $CMUX_E2E_MAC_TAILNET_HOSTNAME)"

      - name: Point the app at this run's backend
        run: ./scripts/e2e/backend-env.sh env >> "$GITHUB_ENV"

      - name: Wait for the per-run backend
        timeout-minutes: 21
        run: ./scripts/e2e/backend-env.sh wait 1200

      - name: Launch Mac host and wait for the iOS job
        # Step ceiling above the driver's own ~25m bounded wait so a wedged
        # driver can never consume the whole job timeout doing nothing.
        timeout-minutes: 30
        env:
          # ~25m bounded done-file loop inside the driver; the done-file path
          # itself comes from the workflow env (no GitHub API polling — see
          # the CMUX_E2E_DONE_FILE comment at the top).
          CMUX_E2E_WAIT_TIMEOUT_SECONDS: "1500"
          # Dedicated CI Stack account, the same secret pair
          # ios-streamed-validate.yml uses; the app's dev-secrets resolution
          # reads CMUX_DOGFOOD_STACK_* from the environment first. Values
          # travel only through the environment — never echoed, never argv,
          # never written to disk.
          CMUX_DOGFOOD_STACK_EMAIL: ${{ secrets.CMUX_DOGFOOD_STACK_EMAIL }}
          CMUX_DOGFOOD_STACK_PASSWORD: ${{ secrets.CMUX_DOGFOOD_STACK_PASSWORD }}
        run: ./scripts/e2e/mac-host.sh

  ios-e2e:
    # The client half: fresh named simulator, prebuilt sim app, sign-in ->
    # pair -> Iroh connect -> 6-step terminal script (scripts/e2e/README.md).
    # Runs in parallel with mac-host (see that job's comment) and ALWAYS
    # signals the Mac's done-file at the end, pass or fail, so the Mac never
    # waits out its full timeout on a failed client.
    # Deliberately not `needs: backend`: the backend job holds until this
    # run's iOS job finishes, so waiting for its completion would deadlock.
    needs: route
    if: >-
      success()
      && needs.route.outputs.run_clients == 'true'
      && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    # Simulator-capable pool: MACOS_RUNNER_IOS is the variable the iOS
    # simulator lanes read (test-ios.yml, ios-streamed-validate.yml).
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'macos-14' || vars.MACOS_RUNNER_IOS || vars.MACOS_RUNNER_PR || 'blacksmith-6vcpu-macos-26' }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: false

      - name: Select Xcode
        # Canonical fleet selector (ranks by macOS SDK, aligns xcode-select);
        # simctl needs a toolchain with an iOS 26 simulator runtime.
        run: ./scripts/select-ci-xcode.sh

      - name: Ensure iOS simulator runtime
        run: xcrun simctl list runtimes available | grep -Eq '\biOS\b' || xcodebuild -downloadPlatform iOS

      - name: Download iOS simulator app product
        run: |
          set -euo pipefail
          # TODO(ios-e2e): reuse the iOS lane's compiled product instead of
          # building. test-ios.yml's ios-simulator-build job stages and stamps
          # the simulator Build/Products tree
          # (scripts/ci/ios_simulator_test_product.py stamp) and uploads it
          # as artifact `ios-test-product-<run_id>-<run_attempt>` (tar.gz);
          # its consumers download by artifact id, trying
          # scripts/ci/parallel_artifact_download.py first. This lane needs a
          # cross-workflow lookup of the newest compatible product for this
          # head SHA (the way reuse_app_host_products.py locates Mac
          # products), or a tagged ios/scripts/reload.sh-style build as the
          # cold fallback. Caveat to resolve while wiring: that artifact is
          # the TEST-host product — confirm its bundle id and entitlements
          # suit the dogfood sign-in path (dev.cmux.ios.<tag>) or re-stamp.
          # Needs `permissions: actions: read` once wired. Until then, fail
          # fast with the infra label.
          echo "::error::[infra-preflight] iOS sim app product download not implemented (see test-ios.yml product-upload TODO)"
          exit 1

      - name: Join tailnet
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          hostname: cmux-e2e-ios-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Point the app at this run's backend
        # --simctl also exports SIMCTL_CHILD_* copies, which simctl passes to
        # the launched app.
        run: ./scripts/e2e/backend-env.sh env --simctl >> "$GITHUB_ENV"

      - name: Wait for the per-run backend
        timeout-minutes: 21
        run: ./scripts/e2e/backend-env.sh wait 1200

      - name: Boot fresh named simulator
        run: |
          set -euo pipefail
          # Per-run named sim so parallel runs on a shared mini never boot,
          # install onto, or reset each other's device; the newest iPhone
          # device type on the image keeps this from pinning a model name
          # that ages out of the runner image.
          DEVTYPE="$(xcrun simctl list devicetypes -j | python3 -c 'import json,sys; ts=[t["identifier"] for t in json.load(sys.stdin)["devicetypes"] if t.get("productFamily")=="iPhone"]; print(ts[-1])')"
          UDID="$(xcrun simctl create "cmux-e2e-${GITHUB_RUN_ID}" "$DEVTYPE")"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          echo "CMUX_E2E_SIM_UDID=$UDID" >> "$GITHUB_ENV"
          echo "sim: cmux-e2e-${GITHUB_RUN_ID} ($DEVTYPE) $UDID"

      - name: Run iOS E2E
        env:
          CMUX_E2E_EVIDENCE_DIR: ${{ runner.temp }}/e2e-evidence
          # Same CI Stack account as mac-host: pairing's same-account RPC
          # gate requires both ends to resolve one account. Environment-only,
          # never echoed.
          CMUX_DOGFOOD_STACK_EMAIL: ${{ secrets.CMUX_DOGFOOD_STACK_EMAIL }}
          CMUX_DOGFOOD_STACK_PASSWORD: ${{ secrets.CMUX_DOGFOOD_STACK_PASSWORD }}
        run: >-
          ./scripts/e2e/ios-e2e-run.sh
          --tag "$CMUX_E2E_TAG"
          --sim-udid "$CMUX_E2E_SIM_UDID"
          --evidence-dir "$CMUX_E2E_EVIDENCE_DIR"

      - name: Signal holders teardown
        # Always, pass or fail: these touches release the Mac host's and the
        # backend's done-file waits. They ride Tailscale SSH because the ACL
        # grants tag:ci -> tag:ci on port 22 plus the backend's three HTTPS
        # Serve ports ONLY — no UDP and nothing wider, so Iroh's path probing
        # can never carry the terminal stream between the runners over the
        # tailnet and silently bypass the transport this lane exists to gate
        # (docs/ci/ios-e2e.md#tailscale-acl-requirements).
        if: always()
        run: |
          set -euo pipefail
          # TODO(ios-e2e): confirm the login users Tailscale SSH maps for the
          # Blacksmith runner accounts in the tailnet ACL ("runner" assumed on
          # both macOS and Linux). Best-effort: a missed signal only costs a
          # holder its own bounded wait, so it must not repaint a green E2E red.
          signal() {
            ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 \
              "runner@$1" "touch '$2'" \
              || echo "::warning::[infra-preflight] could not signal $1; its wait expires at its own bound"
          }
          signal "$CMUX_E2E_MAC_TAILNET_HOSTNAME" "$CMUX_E2E_DONE_FILE"
          signal "$CMUX_E2E_BACKEND_TAILNET_HOSTNAME" "$CMUX_E2E_BACKEND_DONE_FILE"

      - name: Upload E2E evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-e2e-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/e2e-evidence
          if-no-files-found: warn
          retention-days: 7

      - name: Delete simulator
        if: always()
        run: |
          [ -n "${CMUX_E2E_SIM_UDID:-}" ] || exit 0
          xcrun simctl shutdown "$CMUX_E2E_SIM_UDID" 2>/dev/null || true
          xcrun simctl delete "$CMUX_E2E_SIM_UDID" || true

  ios-e2e-status:
    # The one conclusion branch protection will eventually require
    # (docs/ci/ios-e2e.md#promotion-plan): green when the route skipped the
    # lane or every needed job passed; red when the route said run and any
    # needed job failed, was cancelled, or was skipped unexpectedly. Fork PRs
    # are a neutral skip — the secret-fenced jobs cannot run there, and a red
    # would block every outside contribution.
    needs: [route, backend, mac-host, ios-e2e]
    if: always()
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 5
    steps:
      - name: Aggregate
        env:
          ROUTE_RESULT: ${{ needs.route.result }}
          RUN_E2E: ${{ needs.route.outputs.run_e2e }}
          RUN_CLIENTS: ${{ needs.route.outputs.run_clients }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          MAC_RESULT: ${{ needs.mac-host.result }}
          IOS_RESULT: ${{ needs.ios-e2e.result }}
          IS_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          set -euo pipefail
          {
            echo "### iOS E2E"
            echo "- route: $ROUTE_RESULT (run_e2e=${RUN_E2E:-<unset>}, run_clients=${RUN_CLIENTS:-<unset>})"
            echo "- backend: $BACKEND_RESULT · mac-host: $MAC_RESULT · ios-e2e: $IOS_RESULT"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$IS_FORK" = "true" ]; then
            # Neutral skip: report it and pass without judging jobs the fork
            # fence intentionally skipped.
            echo "- conclusion: neutral skip (fork PR; secret-fenced jobs cannot run)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$ROUTE_RESULT" != "success" ]; then
            echo "::error::route job did not succeed ($ROUTE_RESULT)"
            exit 1
          fi
          if [ "$RUN_E2E" != "true" ]; then
            echo "- conclusion: pass (route skipped the lane)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          fail=0
          needed=("backend:$BACKEND_RESULT")
          if [ "$RUN_CLIENTS" = "true" ]; then
            needed+=("mac-host:$MAC_RESULT" "ios-e2e:$IOS_RESULT")
          fi
          for pair in "${needed[@]}"; do
            job="${pair%%:*}"; result="${pair#*:}"
            if [ "$result" != "success" ]; then
              echo "::error::$job: $result (needed because route said run)"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "- conclusion: FAIL" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "- conclusion: pass" >> "$GITHUB_STEP_SUMMARY"
