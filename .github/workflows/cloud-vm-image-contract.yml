name: Cloud VM image contract

on:
  pull_request:
    branches: [main]
    paths:
      - web/package.json
      - web/bun.lock
      - web/scripts/devbox-image-common.ts
      - web/scripts/derive-devbox-sizes.ts
      - web/scripts/promote-devbox-image.ts
      - web/scripts/validate-devbox-ladder.ts
      - web/scripts/build-devbox-freestyle.ts
      - web/scripts/verify-devbox-image.ts
      - web/scripts/devbox-agent-launch.*
      - web/tests/devbox-agent-launch-test.py
      - web/scripts/devbox-codex-hook-trust.py
      - web/tests/devbox-codex-hook-trust-test.py
      - web/scripts/check-devbox-agent-pins.ts
      - web/services/vms/images/manifest.json
      - web/services/vms/images/sizes.ts
      - web/services/vms/images/devbox/**
      - tests/test_devbox_bubblewrap.py
      - web/tests/vm-image-*.test.ts
      - .github/workflows/cloud-vm-image-contract.yml
  push:
    branches: [main]
    paths:
      - web/package.json
      - web/bun.lock
      - web/scripts/devbox-image-common.ts
      - web/scripts/derive-devbox-sizes.ts
      - web/scripts/promote-devbox-image.ts
      - web/scripts/validate-devbox-ladder.ts
      - web/scripts/build-devbox-freestyle.ts
      - web/scripts/verify-devbox-image.ts
      - web/scripts/devbox-agent-launch.*
      - web/tests/devbox-agent-launch-test.py
      - web/scripts/devbox-codex-hook-trust.py
      - web/tests/devbox-codex-hook-trust-test.py
      - web/scripts/check-devbox-agent-pins.ts
      - web/services/vms/images/manifest.json
      - web/services/vms/images/sizes.ts
      - web/services/vms/images/devbox/**
      - tests/test_devbox_bubblewrap.py
      - web/tests/vm-image-*.test.ts
      - .github/workflows/cloud-vm-image-contract.yml
  workflow_dispatch:
    inputs:
      promote:
        description: "Run the verified Freestyle bake and stage a manifest artifact"
        required: false
        default: false
        type: boolean
      confirm:
        description: "Type PROMOTE when promote is true"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  # A live provider bake must finish even if a normal contract run starts on
  # the same ref. Ordinary contract runs keep the existing cancel-on-new-push
  # behavior; explicit promotions use a separate non-canceling lane.
  group: cloud-vm-image-contract-${{ inputs.promote == true && 'promote' || github.ref }}
  cancel-in-progress: ${{ inputs.promote != true }}

jobs:
  contract:
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-4vcpu-ubuntu-2404' || vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Independent of the manifest: runs first so a stale manifest cannot hide it.
      - name: Test bubblewrap installation and unprivileged sandbox
        run: python3 ../tests/test_devbox_bubblewrap.py

      - name: Validate the checked-in image ladder
        run: bun run devbox:manifest:check

      - name: Test image contracts
        run: bun test tests/vm-image-manifest.test.ts tests/vm-image-sizes.test.ts tests/vm-devbox-image.test.ts

  promote:
    if: github.repository == 'manaflow-ai/cmux' && github.ref_type == 'branch' && inputs.promote == true && inputs.confirm == 'PROMOTE'
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-4vcpu-ubuntu-2404' || contains(fromJSON('["blacksmith-4vcpu-ubuntu-2404","blacksmith-16vcpu-ubuntu-2404","blacksmith-32vcpu-ubuntu-2404"]'), vars.LINUX_RUNNER) && vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 180
    environment: cloud-vm-image-checks
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout the requested source ref
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Confirm provider credential
        env:
          HAS_KEY: ${{ secrets.FREESTYLE_API_KEY != '' }}
        run: |
          set -euo pipefail
          if [ "$HAS_KEY" != "true" ]; then
            echo "::error::cloud-vm-image-checks has no FREESTYLE_API_KEY"
            exit 1
          fi
          printf 'source ref: %s\nsource sha: %s\n' "$GITHUB_REF" "$(git rev-parse HEAD)"

      # Everything the cleanup below deletes by name must also be newer than this.
      - name: Record when this run started creating machines
        id: started
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Bake, verify, derive, and stage the manifest
        id: bake
        env:
          CMUX_BAKE_ALLOW_BRANCH: "1"
          FREESTYLE_API_KEY: ${{ secrets.FREESTYLE_API_KEY }}
          PROMOTION_OUT: ${{ runner.temp }}/devbox-promotion.json
          # The attempt keeps a re-run's snapshots apart from the first
          # attempt's, so the cleanup below never touches another attempt.
          SLUG: cmux-devbox-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          # The log is the cleanup's ledger of the snapshots this run took.
          bun run devbox:promote -- freestyle \
            --slug "$SLUG" \
            --pointer-slug none \
            --out "$PROMOTION_OUT" 2>&1 | tee "$RUNNER_TEMP/devbox-promote.log"
          bun run devbox:manifest:check
          cp services/vms/images/manifest.json "$RUNNER_TEMP/devbox-manifest.json"

      # Runs after a failure, a cancel, or a timeout too. Deletes every machine
      # this run created (the builder, and the verify and derive machines) and
      # every snapshot it made that nothing references: the checkout's manifest
      # (what promote wrote; the staged artifact is a copy of it) and the
      # manifests on main and feat-cmux-next are protected. A failed or
      # cancelled run leaves no image behind. Anything matched by name must
      # also be newer than this run's start.
      - name: Delete this run's machines and unreferenced snapshots
        if: always() && steps.bake.outcome != 'skipped' && steps.bake.outcome != ''
        env:
          FREESTYLE_API_KEY: ${{ secrets.FREESTYLE_API_KEY }}
          SLUG: cmux-devbox-${{ github.run_id }}-${{ github.run_attempt }}
          SINCE: ${{ steps.started.outputs.at }}
        run: |
          set -uo pipefail
          status=0
          bun scripts/cloud-vm/ci-leftovers.ts vms --builder-of "$SLUG" --since "$SINCE" || status=1
          # The checkout's manifest at HEAD always, plus what promote wrote to it
          # when that write finished (the staged artifact is a copy of it).
          git show HEAD:web/services/vms/images/manifest.json > "$RUNNER_TEMP/manifest-head.json"
          args=(--manifest "$RUNNER_TEMP/manifest-head.json" --manifest-if-readable services/vms/images/manifest.json --ledger "$RUNNER_TEMP/devbox-promote.log")
          for branch in main feat-cmux-next; do
            git fetch --quiet origin "$branch" || { echo "::error::could not read the $branch manifest; keeping every snapshot"; exit 1; }
            git show "origin/$branch:web/services/vms/images/manifest.json" > "$RUNNER_TEMP/manifest-$branch.json"
            args+=(--manifest "$RUNNER_TEMP/manifest-$branch.json")
          done
          bun scripts/cloud-vm/ci-leftovers.ts snapshots --slug "$SLUG" --since "$SINCE" "${args[@]}" || status=1
          exit "$status"

      - name: Summarize the staged promotion
        if: success()
        env:
          PROMOTION_OUT: ${{ runner.temp }}/devbox-promotion.json
        run: |
          set -euo pipefail
          {
            echo "### Verified devbox promotion"
            echo
            echo "Source: $(git rev-parse HEAD)"
            echo
            jq -r '.entries[] | "- \(.version): \(.imageId)"' "$PROMOTION_OUT"
            echo
            echo "The manifest and promotion receipt are attached as an artifact for review."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload manifest and promotion receipt
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: devbox-promotion-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ runner.temp }}/devbox-manifest.json
            ${{ runner.temp }}/devbox-promotion.json
