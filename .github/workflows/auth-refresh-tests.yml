name: Auth and session lifecycle

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    paths:
      - Packages/Shared/CmuxAuthRuntime/**
      - Packages/Shared/CmuxIrxTransport/**
      - Packages/macOS/CmuxPhonePush/**
      - vendor/stack-auth-swift-sdk-prerelease/**
      - .github/workflows/auth-refresh-tests.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auth-refresh-${{ github.ref }}${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'feat-cmux-next' && (github.event.action == 'labeled' || github.event.action == 'unlabeled') && !contains(fromJSON('["full-ci","ready-to-land"]'), github.event.label.name) && format('-label-{0}', github.run_id) || '' }}
  cancel-in-progress: true

env:
  # Temporary REST budget attribution: one gh-call line per GitHub API call (scripts/ci/api_call_log/env.sh, fetched at a fixed commit when the checkout has no copy).
  BASH_ENV: '$({ w="${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh"; t="${RUNNER_TEMP:-/nonexistent}/api-call-log-src"; if [ -f "$w" ]; then echo "$w"; elif [ -n "${RUNNER_TEMP:-}" ]; then if [ ! -f "$t/env.sh" ] && [ ! -e "$t.tried" ] && { [ "${RUNNER_OS:-}" = Linux ] || [ "${RUNNER_OS:-}" = macOS ]; } && [ "$(date -u +%Y%m%d%H)" -lt 2026112300 ]; then : > "$t.tried"; mkdir -p "$t.part" && for x in env.sh gh sitecustomize.py isolated.py; do curl -fsSL --max-time 5 -o "$t.part/$x" "https://raw.githubusercontent.com/manaflow-ai/cmux/27647ffd3ae838c63be28ca3e5883dcd68c34518/scripts/ci/api_call_log/$x" || break; done; [ -s "$t.part/isolated.py" ] && mv "$t.part" "$t"; fi; if [ -f "$t/env.sh" ]; then echo "$t/env.sh"; else echo unset BASH_ENV > "$t.off.sh" && echo "$t.off.sh"; fi; fi; } 2>/dev/null)'

jobs:
  auth-refresh-tests:
    if: ${{ (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci') || (github.event.pull_request.draft == true && (vars.CI_DRAFT_CHEAP_TIER || '1') == '0') || (github.event.pull_request.draft != true && (contains(github.event.pull_request.labels.*.name, 'ready-to-land') || github.event.pull_request.base.ref != 'feat-cmux-next' || github.event.pull_request.head.repo.full_name != github.repository || (vars.CI_LAND_TIER || '1') == '0'))) && !(github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'feat-cmux-next' && (github.event.action == 'labeled' || github.event.action == 'unlabeled') && !contains(fromJSON('["full-ci","ready-to-land"]'), github.event.label.name)) }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-6vcpu-macos-15' || vars.CI_OVERFLOW_MAC || 'cmux-mac' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Select pinned Xcode
        run: ./scripts/select-ci-xcode.sh
      - name: Exercise shared refresh transport and deadlines without credentials
        run: swift test --package-path vendor/stack-auth-swift-sdk-prerelease --filter 'RefreshLifecycleTests|RefreshRejectionTests|RefreshDeadlineTests|RefreshTransportTimingTests|RateLimitRetryTests|TokenRefreshAlgorithmTests/[a-zA-Z]*Fresh'
      # Every other CmuxAuthRuntime suite runs on Linux (scripts/ci/swift-linux-packages.txt). These compile only
      # on Apple platforms: the two Stack boundaries need Network, the rest AuthenticationServices, Security,
      # Darwin's URLProtocol redirects or the macOS debug log.
      - name: Exercise the Stack refresh boundaries over loopback and the Apple-only auth suites
        run: swift test --package-path Packages/Shared/CmuxAuthRuntime --filter 'StackRateLimitBoundaryTests|StackTokenRefreshBoundaryTests|ASWebBrowserAuthSessionFactoryTests|KeychainStackTokenStoreTests|AuthDebugLogTests|ImportingTokenStoreTests/anAdoptedTokenNeverReachesTheAuthLogFile|PushRegistrationServiceTests/(sameOrigin|originChanges)'
      # CmuxPhonePush runs on Linux too; its Keychain migrations need Security.
      - name: Exercise the phone push Keychain migrations
        run: swift test --package-path Packages/macOS/CmuxPhonePush --filter 'PhonePushSharedStateTests/(sharedPushStateIsDeviceOnly|phonePushKeyMaterialIsDeviceOnly)'
      - name: Verify retired session watcher completion over loopback
        run: swift test --package-path Packages/Shared/CmuxIrxTransport --filter 'IrxLiveQUICTests.keepaliveAndAutoRedial'
