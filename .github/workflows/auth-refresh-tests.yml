name: Auth and session lifecycle

on:
  pull_request:
    paths:
      - Packages/Shared/CmuxAuthRuntime/**
      - Packages/Shared/CmuxIrxTransport/**
      - vendor/stack-auth-swift-sdk-prerelease/**
      - .github/workflows/auth-refresh-tests.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auth-refresh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  auth-refresh-tests:
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'macos-15' || vars.MACOS_RUNNER_TESTS || vars.MACOS_RUNNER_26 || 'blacksmith-6vcpu-macos-26' }}
    timeout-minutes: 15
    steps:
      - name: Verify GitHub-hosted route
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          REQUESTED_RUNNER: ${{ github.repository_owner != 'manaflow-ai' && 'macos-15' || vars.MACOS_RUNNER_TESTS || vars.MACOS_RUNNER_26 || 'blacksmith-6vcpu-macos-26' }}
          RUNNER_CONTEXT_NAME: ${{ runner.name }}
        run: |
          # The self-hosted fleet also carries a macos-26 label, so a macos-*
          # request must prove it landed on GitHub-hosted capacity before any
          # checkout.
          case "$REQUESTED_RUNNER" in
            macos-*)
              if [ "$RUNNER_ENVIRONMENT" != "github-hosted" ]; then
                echo "::error::$REQUESTED_RUNNER resolved outside GitHub-hosted capacity: $RUNNER_CONTEXT_NAME"
                exit 1
              fi
              ;;
          esac
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Exercise shared refresh transport and deadlines without credentials
        run: swift test --package-path vendor/stack-auth-swift-sdk-prerelease --filter 'RefreshLifecycleTests|RefreshDeadlineTests|RefreshTransportTimingTests|RateLimitRetryTests'
      - name: Exercise coordinator cancellation, sessions, and recovery
        run: swift test --package-path Packages/Shared/CmuxAuthRuntime --filter 'AuthCoordinator|AuthError'
      - name: Verify retired session watcher completion over loopback
        run: swift test --package-path Packages/Shared/CmuxIrxTransport --filter 'IrxLiveQUICTests.keepaliveAndAutoRedial'
