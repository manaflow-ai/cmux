name: Auth and session lifecycle

on:
  pull_request:
    paths:
      - Packages/Shared/CmuxAuthRuntime/**
      - Packages/Shared/CmuxIrxTransport/**
      - vendor/stack-auth-swift-sdk-prerelease/**
      - .github/workflows/auth-refresh-tests.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auth-refresh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  auth-refresh-tests:
    runs-on: ${{ vars.MACOS_RUNNER_26 || 'blacksmith-6vcpu-macos-26' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Exercise shared refresh transport and deadlines without credentials
        run: swift test --package-path vendor/stack-auth-swift-sdk-prerelease --filter 'RefreshLifecycleTests|RefreshDeadlineTests|RefreshTransportTimingTests|RateLimitRetryTests'
      - name: Exercise coordinator cancellation, sessions, and recovery
        run: swift test --package-path Packages/Shared/CmuxAuthRuntime --filter 'AuthCoordinator|AuthError'
      - name: Verify retired session watcher completion over loopback
        run: swift test --package-path Packages/Shared/CmuxIrxTransport --filter 'IrxLiveQUICTests.keepaliveAndAutoRedial'
