name: classic deploy guard

# Every push to main that changes a web build input redeploys classic cmux.com and its API: Vercel's Git
# integration builds it on its own (web/vercel.json), and docs-channels.yml deploys the docs projects. This
# checks each commit the push lands before it ships: one that changes a deployed classic path passes only when
# its pull request carries Leo's `classic-migration` label (the one classic-frozen-guard accepts) or a teammate
# opened it (scripts/ci/classic-auto-deploy.json `deploy_guard`). A refusal turns this red and cancels the
# Vercel production deployment of the pushed commit while it is still building; docs-channels.yml calls this
# first and does not deploy past a refusal. scripts/ci/classic_deploy_guard.py decides.
# Leo, 2026-11-04: "apparently the api if we change it it'll auto deploy so we wanna make extra sure we dont
# change it for clasisc".
#
# Each run judges every commit since the last green push run of this workflow (the last deploy it passed; before
# the first one, deploy_guard.seed_baseline), so a refused commit stays refused on later pushes until its pull
# request is approved; a push that rewrote history past that baseline is refused. workflow_dispatch judges one
# commit and never cancels anything (a dry run).
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "CHANGELOG.md"
      - ".vercelignore"
      - "config/iroh/managed-relay-catalog.json"
      - "workers/presence/src/generated/managedRelayCatalog.ts"
  workflow_call:
    inputs:
      role:
        description: "who calls: `docs` (docs-channels.yml) only checks; the push run cancels"
        required: true
        type: string
    secrets:
      CMUX_BOT_APP_KEY:
        description: "the cmux bot App key: the guard's reads go out on the App's own hour, not the job token's shared pool"
        required: false
      VERCEL_TOKEN:
        description: "only the push run's cancel step uses it; the docs caller checks and never cancels"
        required: false
      VERCEL_ORG_ID:
        description: "as VERCEL_TOKEN"
        required: false
  workflow_dispatch:
    inputs:
      sha:
        description: "the main commit to judge (dry run: nothing is cancelled)"
        required: true
        type: string

permissions: {}

env:
  # Temporary REST budget attribution: one gh-call line per GitHub API call (scripts/ci/api_call_log/env.sh, fetched at a fixed commit when the checkout has no copy).
  BASH_ENV: '$({ w="${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh"; t="${RUNNER_TEMP:-/nonexistent}/api-call-log-src"; if [ -f "$w" ]; then echo "$w"; elif [ -n "${RUNNER_TEMP:-}" ]; then if [ ! -f "$t/env.sh" ] && [ ! -e "$t.tried" ] && { [ "${RUNNER_OS:-}" = Linux ] || [ "${RUNNER_OS:-}" = macOS ]; } && [ "$(date -u +%Y%m%d%H)" -lt 2026112300 ]; then : > "$t.tried"; mkdir -p "$t.part" && for x in env.sh gh sitecustomize.py isolated.py; do curl -fsSL --max-time 5 -o "$t.part/$x" "https://raw.githubusercontent.com/manaflow-ai/cmux/27647ffd3ae838c63be28ca3e5883dcd68c34518/scripts/ci/api_call_log/$x" || break; done; [ -s "$t.part/isolated.py" ] && mv "$t.part" "$t"; fi; if [ -f "$t/env.sh" ]; then echo "$t/env.sh"; else echo unset BASH_ENV > "$t.off.sh" && echo "$t.off.sh"; fi; fi; } 2>/dev/null)'

jobs:
  guard:
    name: classic-deploy-guard
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.CI_SECRET_SKIP_FLEET != '1' && 'cmux-gcp-secret-jit-x64' || contains(fromJSON('["blacksmith-4vcpu-ubuntu-2404","blacksmith-8vcpu-ubuntu-2404","blacksmith-16vcpu-ubuntu-2404","blacksmith-32vcpu-ubuntu-2404"]'), vars.LINUX_RUNNER) && vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 10
    permissions:
      actions: read # the last green push run: the baseline every later commit is judged from
      contents: read
      pull-requests: read
    steps:
      - name: Check out the guard from main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            scripts/ci/classic_deploy_guard.py
            scripts/ci/classic_api_guard.py
            scripts/ci/classic-auto-deploy.json
          sparse-checkout-cone-mode: false

      # The job token shares the repository's per-hour installation pool with every other workflow; spent, the
      # baseline read ended "HTTP 403: API rate limit exceeded for installation" and the guard refused a deploy it
      # never judged (run 45910223426, 2026-11-26, red on main for hours). The cmux bot App's token has its own
      # hour; the job token stays the fallback when it cannot be minted (the cmux#57719 fix, whose detector
      # scripts/ci/cron_dispatch_token_lint.py covers dispatches; this step only reads).
      - name: Mint the cmux bot App token
        id: app-token
        if: ${{ vars.CMUX_BOT_APP_ID != '' }}
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.CMUX_BOT_APP_ID }}
          private-key: ${{ secrets.CMUX_BOT_APP_KEY }}
          permission-actions: read
          permission-contents: read
          permission-pull-requests: read

      - name: Judge the commits this push lands
        id: check
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          REPOSITORY: ${{ github.repository }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event_name == 'workflow_dispatch' && inputs.sha || github.event.after }}
          BASELINE: ${{ github.event_name == 'workflow_dispatch' && 'before' || 'auto' }}
        run: python3 scripts/ci/classic_deploy_guard.py check --repo "$REPOSITORY" --before "$BEFORE" --after "$AFTER" --baseline "$BASELINE"

      - name: Cancel the refused Vercel production deployment
        if: ${{ failure() && steps.check.outcome == 'failure' && github.event_name == 'push' && inputs.role != 'docs' }}
        env:
          AFTER: ${{ github.event.after }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: python3 scripts/ci/classic_deploy_guard.py cancel --sha "$AFTER" --wait 300
