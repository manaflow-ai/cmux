name: Zero to going (staging)

# How many steps and how long it takes a person to get from nothing to a working agent on cmux Cloud, at each level
# the Start page offers: point an agent at one URL, in the app, from the CLI, through Chief, from a phone
# (scripts/cmux-next/zero-to-going.ts; Leo, 2026-11-22: "i want all these to just be super accessible and usable,
# from human to agent to what we expect on our end."). It counts each level's steps by kind from the Start page,
# times the Cloud part (sign-in, the routes behind `cmux chat --on vm ... --wait`, one more turn) on staging as the
# agent test account, and writes the table to the job summary and an artifact. A measurement, not a gate: it runs
# on a pull request that changes the script or this file, and by hand; a failed route is a row in the table.
#
# The machine the run made is deleted at its end, pass, fail or cancel (the script's own cleanup and SIGTERM
# handler); the always() step deletes what a run killed before its cleanup left, by its tag.
#
# Secrets: the staging agent test account, CMUX_DOGFOOD_STACK_EMAIL and _PASSWORD in cmux-next-vm-image-dev, the pair
# cloud-journey-pr.yml reads on pull requests. (vm-hassle.yml's cmux-next-cloud-journey pair reaches no lane pull
# request: its run 44956448419 wrote the documented path only.) Same-repo pull requests only. Without the pair the
# script writes the counted steps and passes. The second path reads the repository's CLAUDE_CODE_OAUTH_TOKEN, the
# login cloud-harness-matrix.yml copies to its machine; it goes to the agent as its launch credential and is
# scrubbed from every line the script writes.

on:
  pull_request:
    branches: [feat-cmux-next]
    paths:
      - scripts/cmux-next/zero-to-going*.ts
      - .github/workflows/zero-to-going.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zero-to-going-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # A workflow sweep that reaches this only through workflow files skips its heavy jobs (self-edit-sweep.yml,
  # scripts/ci/self_edit_sweep.py); a pull request under 10 changed files or with full-ci never starts the gate.
  self-edit:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.changed_files >= 10 && !contains(github.event.pull_request.labels.*.name, 'full-ci') }}
    uses: ./.github/workflows/self-edit-sweep.yml
    with:
      workflow: .github/workflows/zero-to-going.yml
    permissions:
      contents: read

  measure:
    needs: self-edit
    if: ${{ !cancelled() && needs.self-edit.outputs.run != 'false' && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-4vcpu-ubuntu-2404' || contains(fromJSON('["blacksmith-8vcpu-ubuntu-2404","blacksmith-16vcpu-ubuntu-2404","blacksmith-4vcpu-ubuntu-2404"]'), vars.LINUX_RUNNER) && vars.LINUX_RUNNER || vars.CI_CLOUD_OVERFLOW_SAVED && fromJSON(vars.RUNNER_POOLS).linux_16 || fromJSON(vars.RUNNER_POOLS).linux_8 }}
    environment:
      name: cmux-next-vm-image-dev
      deployment: false
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          submodules: false
      - name: Restore pinned Bun 1.4.4 from the CI cache bucket
        shell: bash
        continue-on-error: true
        run: bash "$GITHUB_WORKSPACE/scripts/ci/toolchain-r2.sh" restore bun 1.4.4 || true

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          no-cache: ${{ !startsWith(github.workspace, '/home/runner/work/') || !(github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && github.event_name != 'merge_group' && contains(fromJSON('["refs/heads/main","refs/heads/feat-cmux-next","refs/heads/nightly-next"]'), github.ref)) }}
          bun-version: "1.4.4"
      - name: Tag this run
        id: tag
        run: echo "tag=zg-$(date +%s | xargs printf '%x')${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - name: Measure (staging)
        env:
          CMUX_DOGFOOD_STACK_EMAIL: ${{ secrets.CMUX_DOGFOOD_STACK_EMAIL }}
          CMUX_DOGFOOD_STACK_PASSWORD: ${{ secrets.CMUX_DOGFOOD_STACK_PASSWORD }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ZG_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -o pipefail
          out="$RUNNER_TEMP/zero-to-going"
          status=0
          # Two paths, each its own machine and its own rows: the newcomer with no Claude login, then the person
          # who signs in to Claude on the machine (skipped, and said so, where the run has no Claude login).
          login="${CLAUDE_CODE_OAUTH_TOKEN:-}"
          CLAUDE_CODE_OAUTH_TOKEN="" bun scripts/cmux-next/zero-to-going.ts --backend staging --model none --tag "${ZG_TAG}a" --out "$out/newcomer" </dev/null || status=$?
          cat "$out/newcomer/summary.md" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "(newcomer: no summary written)" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$login" ] && [ -n "${CMUX_DOGFOOD_STACK_EMAIL:-}" ]; then
            bun scripts/cmux-next/zero-to-going.ts --backend staging --model real --tag "${ZG_TAG}b" --out "$out/claude-login" </dev/null || status=$?
            cat "$out/claude-login/summary.md" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "(Claude login: no summary written)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The Claude login path did not run: this run has no CLAUDE_CODE_OAUTH_TOKEN or no agent test account." >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"
      - name: Delete what a cut-off run left
        if: always()
        env:
          CMUX_DOGFOOD_STACK_EMAIL: ${{ secrets.CMUX_DOGFOOD_STACK_EMAIL }}
          CMUX_DOGFOOD_STACK_PASSWORD: ${{ secrets.CMUX_DOGFOOD_STACK_PASSWORD }}
          ZG_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if [ -z "${CMUX_DOGFOOD_STACK_EMAIL:-}" ] || [ -z "$ZG_TAG" ]; then exit 0; fi
          status=0
          for t in "${ZG_TAG}a" "${ZG_TAG}b"; do
            bun scripts/cmux-next/zero-to-going.ts --backend staging --cleanup-tag "$t" </dev/null || status=$?
          done
          exit "$status"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: zero-to-going
          path: ${{ runner.temp }}/zero-to-going
          if-no-files-found: ignore
          retention-days: 3  # retention-class: report
