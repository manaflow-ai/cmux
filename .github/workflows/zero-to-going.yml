name: Zero to going (staging)

# How many steps and how long it takes a person to get from nothing to a working agent on cmux Cloud, at each level
# the Start page offers: point an agent at one URL, in the app, from the CLI, through Chief, from a phone
# (scripts/cmux-next/zero-to-going.ts; Leo, 2026-11-22: "i want all these to just be super accessible and usable,
# from human to agent to what we expect on our end."). It counts each level's steps by kind from the Start page,
# times the Cloud part (sign-in, the routes behind `cmux chat --on vm ... --wait`, one more turn) on staging as the
# agent test account, and writes the table to the job summary and an artifact. A measurement, not a gate: it runs
# on a pull request that changes the script or this file, and by hand; a failed route is a row in the table.
#
# The machine the run made is deleted at its end, pass, fail or cancel (the script's own cleanup and SIGTERM
# handler); the always() step deletes what a run killed before its cleanup left, by its tag.
#
# Secrets: the staging agent test account (CMUX_JOURNEY_DEV_STACK_*) in cmux-next-cloud-journey, as vm-hassle.yml
# and cloud-journey-pr.yml read it. Same-repo pull requests only. Without the pair the script writes the counted
# steps and passes.

on:
  pull_request:
    branches: [feat-cmux-next]
    paths:
      - scripts/cmux-next/zero-to-going*.ts
      - .github/workflows/zero-to-going.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zero-to-going-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  measure:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-4vcpu-ubuntu-2404' || contains(fromJSON('["blacksmith-8vcpu-ubuntu-2404","blacksmith-16vcpu-ubuntu-2404","blacksmith-4vcpu-ubuntu-2404"]'), vars.LINUX_RUNNER) && vars.LINUX_RUNNER || vars.CI_CLOUD_OVERFLOW_SAVED && fromJSON(vars.RUNNER_POOLS).linux_16 || fromJSON(vars.RUNNER_POOLS).linux_8 }}
    environment:
      name: cmux-next-cloud-journey
      deployment: false
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
      - name: Tag this run
        id: tag
        run: echo "tag=zg-$(date +%s | xargs printf '%x')${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - name: Measure (staging)
        env:
          CMUX_DOGFOOD_STACK_EMAIL: ${{ secrets.CMUX_JOURNEY_DEV_STACK_EMAIL }}
          CMUX_DOGFOOD_STACK_PASSWORD: ${{ secrets.CMUX_JOURNEY_DEV_STACK_PASSWORD }}
          ZG_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -o pipefail
          out="$RUNNER_TEMP/zero-to-going"
          status=0
          bun scripts/cmux-next/zero-to-going.ts --backend staging --tag "$ZG_TAG" --out "$out" </dev/null || status=$?
          cat "$out/summary.md" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "(no summary written)" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Delete what a cut-off run left
        if: always()
        env:
          CMUX_DOGFOOD_STACK_EMAIL: ${{ secrets.CMUX_JOURNEY_DEV_STACK_EMAIL }}
          CMUX_DOGFOOD_STACK_PASSWORD: ${{ secrets.CMUX_JOURNEY_DEV_STACK_PASSWORD }}
          ZG_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if [ -z "${CMUX_DOGFOOD_STACK_EMAIL:-}" ] || [ -z "$ZG_TAG" ]; then exit 0; fi
          bun scripts/cmux-next/zero-to-going.ts --backend staging --cleanup-tag "$ZG_TAG" </dev/null
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: zero-to-going
          path: ${{ runner.temp }}/zero-to-going
          if-no-files-found: ignore
          retention-days: 14
