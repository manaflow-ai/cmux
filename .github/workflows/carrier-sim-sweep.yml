name: carrier simulation sweep

# The large run of the carrier's deterministic simulation (cmux-tui/crates/cmux-remote/tests/
# carrier_sim.rs): thousands of seeds, a new window each run. The per-change run (cmux-tui-spec.yml,
# carrier-sim) keeps a fixed window. A red run lists each failing seed with the command that replays
# it; every run uploads its numbers (carrier-sim-report.json: lost and duplicated events, recovery
# p50/p95/max per fault kind), which cmuxterm-hq's synthetic probe carrier-sim-no-lost-events reads.
#
# A schedule fires only from the default branch's copy of this file, so landings on feat-cmux-next
# that touch cmux-remote run it too.

on:
  schedule:
    - cron: "41 6 * * *"
  push:
    branches:
      - feat-cmux-next
    paths:
      - "cmux-tui/crates/cmux-remote/**"
      - "cmux-tui/crates/cmux-remote-protocol/**"
      - "cmux-tui/Cargo.lock"
      - ".github/workflows/carrier-sim-sweep.yml"
  workflow_dispatch:
    inputs:
      seeds:
        description: "Seeds to run"
        required: false
        default: "4000"
        type: string

# A started sweep always finishes; the group keeps at most one running and one waiting.
concurrency:
  group: carrier-sim-sweep-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sweep:
    name: carrier simulation sweep
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || !startsWith(vars.LINUX_RUNNER, 'blacksmith-') && vars.LINUX_RUNNER || vars.CI_CLOUD_OVERFLOW_SAVED && fromJSON(vars.RUNNER_POOLS).linux_16 || fromJSON(vars.RUNNER_POOLS).linux_8 }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          # The schedule runs main's copy of this file; the simulation lives on feat-cmux-next.
          ref: ${{ github.event_name == 'schedule' && 'feat-cmux-next' || github.sha }}

      - name: Set up pinned Rust
        uses: ./.github/actions/setup-cmux-tui-rust

      - name: Cache cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          workspaces: cmux-tui -> target
          shared-key: cmux-tui-carrier-sim
          save-if: false

      - name: Run the seeds
        working-directory: cmux-tui
        env:
          CARRIER_SIM_SEEDS: ${{ inputs.seeds || '4000' }}
          # Past the per-change window, a new window every run.
          CARRIER_SIM_SEED_BASE: ${{ github.run_number }}0000
          CARRIER_SIM_REPORT: ${{ runner.temp }}/carrier-sim-report.json
        run: |
          set -o pipefail
          status=0
          cargo test --locked -p cmux-remote --test carrier_sim seeds_hold -- --nocapture 2>&1 | tee "$RUNNER_TEMP/sim.log" || status=$?
          {
            grep -E '^sim: ' "$RUNNER_TEMP/sim.log" || true
            grep -E '^seed [0-9]+:|replay:' "$RUNNER_TEMP/sim.log" | head -60 || true
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Upload the numbers
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: carrier-sim-report
          path: ${{ runner.temp }}/carrier-sim-report.json
          if-no-files-found: warn
          retention-days: 30
