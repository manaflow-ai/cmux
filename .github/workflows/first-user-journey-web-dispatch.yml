name: First-user journey (web) nightly dispatcher

# Leo 2026-11-12: "We need to, like, actually properly, like, click through and utilize every single
# thing." The web first-user journey matrix (feat-cmux-next's first-user-journey-web.yml: every harness
# in four states plus every mock page, every control clicked) has its own 05:00Z cron, but scheduled
# workflows fire only from the default branch, and it lives only on feat-cmux-next. Once a day this file
# on main starts it on feat-cmux-next, unless a run is already pending. The run uploads the
# first-user-journey-web artifact (results.json at its root) that the quality report reads.
on:
  schedule:
    - cron: "7 5 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: first-user-journey-web-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    if: github.repository == 'manaflow-ai/cmux'
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    permissions:
      actions: write
      contents: read
    timeout-minutes: 5
    steps:
      - name: Start the first-user journey on feat-cmux-next unless one is pending
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const source = 'feat-cmux-next';
            const workflow = 'first-user-journey-web.yml';
            for (const status of ['queued', 'in_progress', 'waiting', 'pending', 'requested']) {
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner, repo, workflow_id: workflow, branch: source, status, per_page: 5,
              });
              if (data.total_count > 0) {
                core.notice(`A first-user journey run is already ${status} (run ${data.workflow_runs[0].id}); nothing to start`);
                return;
              }
            }
            await github.rest.actions.createWorkflowDispatch({
              owner, repo, workflow_id: workflow,
              // Fully qualified: a tag named feat-cmux-next must never be picked.
              ref: `refs/heads/${source}`,
            });
            core.notice(`Started the first-user journey (web) on ${source}`);
