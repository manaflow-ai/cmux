name: CI failure attribution

# Says whether a red pull request CI run failed because of the machine or the
# code, and re-runs the failed jobs once when every failure is the machine's
# (scripts/ci/classify_failures.py has the signatures and the rules). On every
# completed pull request run of CI:
#
#   red or cancelled   each failed job gets a verdict (machine, code, unknown)
#                      in the job summary and in one comment on the pull
#                      request, edited in place; when every failed job of a
#                      failed attempt 1 or 2 is machine, the failed jobs are
#                      re-run (attempt 3 goes to Blacksmith, which ends it)
#   green              that comment, if any, says it passes now; a green run
#                      whose macOS jobs never ran says that instead
#
# One run per CI completion. It no longer also starts on `requested` (CI
# starting): that doubled the runs, about 200 an hour on 2026-10-26, while
# the installation's GITHUB_TOKEN budget ran out. A comment about an older
# head is rewritten to "pending" when the newer head's run completes instead.
# vars.CI_QUOTA_HOLD=1 pauses the report while that budget is reserved for the
# nightly (tests/test_ci_quota_hold_gate.py); the next completion reports.
#
# A PR's code never runs here: main's script reads the run's job logs and
# annotations as data. Everything is event driven: nothing polls.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

env:
  SOURCE_WORKFLOW_PATHS: .github/workflows/ci.yml

permissions: {}

concurrency:
  # One report at a time per branch, never cancelled halfway (between the
  # re-run and the comment that says so). A report takes seconds, and one for
  # a head the pull request has moved past only marks the comment pending.
  group: ci-failure-attribution-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  attribute:
    name: Attribute
    if: ${{ vars.CI_QUOTA_HOLD != '1' && github.repository == 'manaflow-ai/cmux' && github.event.workflow_run.event == 'pull_request' && contains(fromJSON('["success","failure","cancelled"]'), github.event.workflow_run.conclusion) }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || contains(fromJSON('["ubuntu-24.04","blacksmith-2vcpu-ubuntu-2404","blacksmith-4vcpu-ubuntu-2404"]'), vars.CI_TRUSTED_RUNNER) && vars.CI_TRUSTED_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }} # ephemeral-required: write token; the re-run must follow CI within a minute; CI_TRUSTED_RUNNER picks Blacksmith (default) or GitHub-hosted
    timeout-minutes: 10
    permissions:
      actions: write
      checks: read
      contents: read
      # Read main's red full-suite issue (without it the label search finds none) and keep the
      # record of failures seen on other pull requests in issue 17286's body.
      issues: write
      pull-requests: write
    steps:
      - name: Mint the cmux-bot token
        id: cmux-bot-token
        if: vars.CMUX_BOT_APP_ID != ''
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.CMUX_BOT_APP_ID }}
          private-key: ${{ secrets.CMUX_BOT_APP_KEY }}
          permission-actions: write
          permission-checks: read
          permission-contents: read
          permission-issues: write
          permission-pull-requests: write

      # Reads (jobs, logs, the pull request, its comments and files) draw on the
      # manaflow-glaeda-route App's own budget, not the GITHUB_TOKEN budget every
      # workflow shares (it ran out on 2026-10-21). Writes stay on GH_TOKEN: the
      # re-run must come from github-actions[bot] (ci-macos.yml routes attempt 3
      # by its triggering actor) and pr_status finds the comment by its author.
      # Check-run annotations need `checks`, which the App lacks: GH_TOKEN reads
      # them (guard_attribution.GitHub).
      - name: Mint the glaeda-route token
        id: glaeda-token
        if: vars.GLAEDA_ROUTE_APP_ID != ''
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.GLAEDA_ROUTE_APP_ID }}
          private-key: ${{ secrets.GLAEDA_ROUTE_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-actions: read
          permission-contents: read
          permission-issues: read
          permission-pull-requests: read

      - name: Checkout main's classifier
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: scripts/ci

      - name: Attribute failures and re-run machine failures
        env:
          GH_TOKEN: ${{ steps.cmux-bot-token.outputs.token || github.token }}
          READ_TOKEN: ${{ steps.cmux-bot-token.outputs.token || steps.glaeda-token.outputs.token }}
        run: python3 scripts/ci/classify_failures.py act
