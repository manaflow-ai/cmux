name: CI failure attribution

# Says whether a red pull request CI run failed because of the machine or the
# code, and re-runs the failed jobs once when every failure is the machine's
# (scripts/ci/classify_failures.py has the signatures and the rules). On every
# completed pull request run of CI:
#
#   red or cancelled   each failed job gets a verdict (machine, code, unknown)
#                      in the job summary and in one comment on the pull
#                      request, edited in place; when every failed job of a
#                      failed attempt 1 or 2 is machine, the failed jobs are
#                      re-run (attempt 3 goes to Blacksmith, which ends it)
#   green              that comment, if any, says it passes now; a green run
#                      whose macOS jobs never ran says that instead
#
# One run per CI completion. It no longer also starts on `requested` (CI
# starting): that doubled the runs, about 200 an hour on 2026-10-26, while
# the installation's GITHUB_TOKEN budget ran out. A comment about an older
# head is rewritten to "pending" when the newer head's run completes instead.
# vars.CI_QUOTA_HOLD=1 pauses the report while that budget is reserved for the
# nightly (tests/test_ci_quota_hold_gate.py); the next completion reports.
#
# A PR's code never runs here: main's script reads the run's job logs and
# annotations as data. Everything is event driven: nothing polls.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

env:
  # Temporary REST budget attribution until 2026-11-22 00:00 UTC: one gh-call line per GitHub API call
  # (scripts/ci/api_call_log/env.sh). GitHub runs this file from main, and it had no attribution.
  BASH_ENV: '$({ w="${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh"; t="${RUNNER_TEMP:-/nonexistent}/api-call-log-src"; if [ -f "$w" ]; then echo "$w"; elif [ -n "${RUNNER_TEMP:-}" ]; then if [ ! -f "$t/env.sh" ] && [ ! -e "$t.tried" ] && { [ "${RUNNER_OS:-}" = Linux ] || [ "${RUNNER_OS:-}" = macOS ]; } && [ "$(date -u +%Y%m%d%H)" -lt 2026112300 ]; then : > "$t.tried"; mkdir -p "$t.part" && for x in env.sh gh sitecustomize.py isolated.py; do curl -fsSL --max-time 5 -o "$t.part/$x" "https://raw.githubusercontent.com/manaflow-ai/cmux/27647ffd3ae838c63be28ca3e5883dcd68c34518/scripts/ci/api_call_log/$x" || break; done; [ -s "$t.part/isolated.py" ] && mv "$t.part" "$t"; fi; if [ -f "$t/env.sh" ]; then echo "$t/env.sh"; else echo unset BASH_ENV > "$t.off.sh" && echo "$t.off.sh"; fi; fi; } 2>/dev/null)'
  SOURCE_WORKFLOW_PATHS: .github/workflows/ci.yml

permissions: {}

concurrency:
  # One report at a time per branch, never cancelled halfway (between the
  # re-run and the comment that says so). A report takes seconds, and one for
  # a head the pull request has moved past only marks the comment pending.
  group: ci-failure-attribution-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  attribute:
    name: Attribute
    if: ${{ vars.CI_QUOTA_HOLD != '1' && github.repository == 'manaflow-ai/cmux' && github.event.workflow_run.event == 'pull_request' && contains(fromJSON('["success","failure","cancelled"]'), github.event.workflow_run.conclusion) }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || 'blacksmith-4vcpu-ubuntu-2404' }} # ephemeral-required: write token; the re-run must follow CI within a minute
    timeout-minutes: 10
    permissions:
      actions: write
      checks: read
      contents: read
      # Read main's red full-suite issue (without it the label search finds none) and keep the
      # record of failures seen on other pull requests in issue 17286's body.
      issues: write
      pull-requests: write
    steps:
      - name: Mint the cmux-bot token
        id: cmux-bot-token
        if: vars.CMUX_BOT_APP_ID != ''
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.CMUX_BOT_APP_ID }}
          private-key: ${{ secrets.CMUX_BOT_APP_KEY }}
          permission-actions: write
          permission-checks: read
          permission-contents: read
          permission-issues: write
          permission-pull-requests: write

      # Reads (jobs, logs, the pull request, its comments and files) draw on the
      # manaflow-glaeda-route App's own budget, not the GITHUB_TOKEN budget every
      # workflow shares (it ran out on 2026-10-21). Writes stay on GH_TOKEN: the
      # re-run must come from github-actions[bot] (ci-macos.yml routes attempt 3
      # by its triggering actor) and pr_status finds the comment by its author.
      # Check-run annotations need `checks`, which the App lacks: GH_TOKEN reads
      # them (guard_attribution.GitHub).
      # Only when the cmux-bot mint gave nothing: READ_TOKEN below prefers cmux-bot's
      # token, so a glaeda-route token minted beside it went unused and its mint
      # still spent the shared glaeda-route installation budget on every CI run.
      - name: Mint the glaeda-route token
        id: glaeda-token
        if: vars.GLAEDA_ROUTE_APP_ID != '' && steps.cmux-bot-token.outputs.token == ''
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.GLAEDA_ROUTE_APP_ID }}
          private-key: ${{ secrets.GLAEDA_ROUTE_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-actions: read
          permission-contents: read
          permission-issues: read
          permission-pull-requests: read
          skip-token-revoke: true

      - name: Checkout main's classifier
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: scripts/ci

      # The cmux-bot installation's hour before this job spends any of it (GET /rate_limit is free), as an
      # `app-spend-pool:` line HQ's spend publisher sums, and the floor (HQ's default floor, 2,500): below it
      # this job's calls go out on the token a failed mint leaves (scripts/ci/app_spend_mark.py).
      - name: Read the cmux-bot budget before this job
        id: app-spend
        continue-on-error: true
        timeout-minutes: 1
        env:
          APP_SPEND_TOKEN: ${{ steps.cmux-bot-token.outputs.token }}
        run: python3 scripts/ci/app_spend_mark.py start ci-failure-attribution/attribute --floor pass

      # The glaeda-route App installation's budget around the reads below (a free
      # rate_limit read): the installation is shared, so the delta between `before`
      # and `after` is this step's reads plus whatever else ran meanwhile.
      - name: Log the glaeda-route App budget before
        if: ${{ (steps.glaeda-token.outputs.token) != '' }}
        continue-on-error: true
        timeout-minutes: 1
        env:
          GH_TOKEN: ${{ steps.glaeda-token.outputs.token }}
          PROBE: ${{ github.workflow }}/attribute/before
        run: >-
          gh api rate_limit --jq
          '"app-budget \(env.PROBE) used=\(.resources.core.used) reset=\(.resources.core.reset) at=\(now | floor)"'

      - name: Attribute failures and re-run machine failures
        env:
          GH_TOKEN: ${{ steps.app-spend.outputs.low != 'true' && steps.cmux-bot-token.outputs.token || github.token }}
          READ_TOKEN: ${{ steps.app-spend.outputs.low != 'true' && steps.cmux-bot-token.outputs.token || steps.glaeda-token.outputs.token }}
        run: python3 scripts/ci/classify_failures.py act

      - name: Log the glaeda-route App budget after
        if: ${{ !cancelled() && (steps.glaeda-token.outputs.token) != '' }}
        continue-on-error: true
        timeout-minutes: 1
        env:
          GH_TOKEN: ${{ steps.glaeda-token.outputs.token }}
          PROBE: ${{ github.workflow }}/attribute/after
        run: >-
          gh api rate_limit --jq
          '"app-budget \(env.PROBE) used=\(.resources.core.used) reset=\(.resources.core.reset) at=\(now | floor)"'

      # This job's spend: the pool again and the difference from the reading above (an upper bound, since
      # every job holding a cmux-bot token spends the same pool).
      - name: Read the cmux-bot budget after this job
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        env:
          APP_SPEND_TOKEN: ${{ steps.cmux-bot-token.outputs.token }}
        run: python3 scripts/ci/app_spend_mark.py end ci-failure-attribution/attribute
