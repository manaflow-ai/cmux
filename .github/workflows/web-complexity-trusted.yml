name: Web complexity

on:
  # This workflow is read from the base branch. It checks the pull-request
  # source as data and executes only the trusted checker from the base.
  pull_request_target:
    branches:
      - main
    types: [opened, edited, reopened, synchronize, ready_for_review]
    # Not a required check on main, so a pull request that touches no web/
    # source or complexity policy starts no run at all (2026-10-06: 648 jobs
    # in one day, most for pull requests with no web change). GitHub matches
    # the pull request's own diff, so main's later web commits do not queue
    # a stale branch. Keep this list equal to the policy paths below.
    paths:
      - web/**
      - .github/workflows/web-complexity.yml
      - .github/workflows/web-complexity-trusted.yml
      - scripts/ci/scope-web-complexity.py
      - scripts/ci/web_complexity_scope.py
  # The merge queue's commit is checked the same way, as data, against the
  # policy on the branch it is about to join.
  merge_group:
  push:
    branches:
      - main
    paths:
      - web/**
      - .github/workflows/web-complexity.yml
      - .github/workflows/web-complexity-trusted.yml

permissions:
  contents: read
  pull-requests: read

# Metadata-only edits must not cancel a useful content check. A separate
# group also keeps them from replacing a pending content run.
concurrency:
  group: web-complexity-trusted-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}${{ github.event_name == 'pull_request_target' && github.event.action == 'edited' && !github.event.changes.base && (github.event.changes.body || github.event.changes.title) && '-metadata' || '' }}
  cancel-in-progress: true

jobs:
  complexity:
    # Keep the required context literal and evaluate the real verdict on edits.
    # GitHub can publish an unevaluated name expression when a job is skipped.
    name: Web complexity
    # The job reads untrusted source bytes, so it needs an ephemeral runner;
    # no repository variable may select a persistent host. CI_TRUSTED_RUNNER
    # only chooses GitHub-hosted or a one-job Blacksmith VM from the list
    # below (anything else falls back to Blacksmith).
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || contains(fromJSON('["ubuntu-24.04","blacksmith-2vcpu-ubuntu-2404","blacksmith-4vcpu-ubuntu-2404"]'), vars.CI_TRUSTED_RUNNER) && vars.CI_TRUSTED_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 10
    env:
      # The policy comes from the base of a pull request or merge group, and
      # from the pushed commit itself on main. The tree being judged is the
      # pull request's head or the merge group's commit.
      TRUSTED_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.sha }}
      CANDIDATE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout trusted policy revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ github.repository }}
          ref: ${{ env.TRUSTED_SHA }}
          path: trusted
          # Pull requests and merge groups only read the exact trusted policy
          # snapshot, so avoid cloning the repository's full history and tags.
          # Main pushes compare github.event.before..github.sha and still need
          # enough history to reach an arbitrarily large pushed commit range.
          fetch-depth: ${{ github.event_name != 'push' && 1 || 0 }}
          persist-credentials: false

      - name: Require an ephemeral runner
        # Blacksmith VMs report self-hosted; their runner names identify them.
        if: runner.environment != 'github-hosted' && !startsWith(runner.name, 'blacksmith-')
        run: |
          set -euo pipefail
          echo "::error::Web complexity requires a GitHub-hosted or Blacksmith runner"
          exit 1

      - name: Verify trusted checkout
        run: |
          set -euo pipefail
          [[ "$TRUSTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git -C trusted rev-parse HEAD)" == "$TRUSTED_SHA" ]]
          [[ -f trusted/scripts/ci/scope-web-complexity.py ]]
          [[ -f trusted/web/scripts/check-complexity.mjs ]]
          [[ -f trusted/web/oxlint-complexity-baseline.txt ]]

      - name: Check complete current-base API scope
        id: api_scope
        if: github.event_name == 'pull_request_target'
        env:
          GH_TOKEN: ${{ github.token }}
          CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
        run: |
          set -euo pipefail
          if [[ ! -f "$GITHUB_WORKSPACE/trusted/scripts/ci/web_complexity_scope.py" ]]; then
            echo "scan=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! gh api "repos/${GITHUB_REPOSITORY}/compare/${TRUSTED_SHA}...${CANDIDATE_SHA}" > "$RUNNER_TEMP/complexity-compare.json"; then
            echo "scan=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 "$GITHUB_WORKSPACE/trusted/scripts/ci/web_complexity_scope.py" \
            --compare-json "$RUNNER_TEMP/complexity-compare.json" \
            --trusted-base "$TRUSTED_SHA" --expected-count "$CHANGED_FILES" >> "$GITHUB_OUTPUT"

      - name: Checkout pull-request or merge-group source
        if: github.event_name != 'push' && steps.api_scope.outputs.scan != 'false'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ env.CANDIDATE_REPOSITORY }}
          ref: ${{ env.CANDIDATE_SHA }}
          path: candidate
          fetch-depth: 1
          persist-credentials: false

      - name: Select complexity work before installing Bun
        id: scope
        if: github.event_name != 'push' && steps.api_scope.outputs.scan != 'false'
        env:
          UPSTREAM_URL: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          set -euo pipefail
          [[ "$TRUSTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]

          # Judge the pull request by its own changes: diff its head against
          # its merge base with the trusted base (what lands), never against
          # the base tip. A two-dot diff of a stale branch counts every later
          # main commit as the pull request's: on 2026-10-06 357 runs took the
          # full scan of a stale head and failed on code main had already
          # fixed. The commit graph alone (no trees or blobs) finds the merge
          # base; any failure keeps the stricter base tip.
          diff_base="$TRUSTED_SHA"
          history="$RUNNER_TEMP/web-complexity-history.git"
          rm -rf "$history"
          if git init -q --bare "$history" &&
            git -C "$history" -c protocol.version=2 fetch -q --no-tags --filter=tree:0 \
              "$UPSTREAM_URL" "$TRUSTED_SHA" "$CANDIDATE_SHA" &&
            merge_base="$(git -C "$history" merge-base "$TRUSTED_SHA" "$CANDIDATE_SHA")" &&
            [[ "$merge_base" =~ ^[0-9a-f]{40}$ ]]; then
            diff_base="$merge_base"
          else
            echo "::warning::no merge base of $CANDIDATE_SHA and $TRUSTED_SHA; diffing against the base tip"
          fi
          echo "Diff base: $diff_base (trusted base $TRUSTED_SHA)"
          echo "diff_base=$diff_base" >> "$GITHUB_OUTPUT"

          if ! git -C candidate cat-file -e "${diff_base}^{commit}" 2>/dev/null; then
            git -C candidate -c protocol.version=2 fetch --no-tags --depth=1 "$UPSTREAM_URL" "$diff_base"
          fi

          DIFF_BASE="$diff_base" python3 - <<'PY'
          import os
          import subprocess

          root = os.environ["GITHUB_WORKSPACE"] + "/candidate"
          base = os.environ["DIFF_BASE"]
          head = os.environ["CANDIDATE_SHA"]
          changed = subprocess.check_output(
              ["git", "-C", root, "diff", "--no-renames", "--name-only", "-z", base, head, "--"]
          ).split(b"\0")

          policy = {
              b".github/workflows/web-complexity-trusted.yml",
              b".github/workflows/web-complexity.yml",
              b"scripts/ci/scope-web-complexity.py",
              b"scripts/ci/web_complexity_scope.py",
              b"web/.oxlintrc.json",
              b"web/bun.lock",
              b"web/bunfig.toml",
              b"web/package.json",
              b"web/oxlint-complexity-baseline.txt",
              b"web/scripts/check-complexity.mjs",
          }
          excluded = (
              b".next/",
              b"coverage/",
              b"db/migrations/",
              b"e2e/",
              b"node_modules/",
              b"out/",
              b"public/",
              b"scripts/",
              b"tests/",
              b"tools/",
          )
          extensions = (b".js", b".jsx", b".mjs", b".cjs", b".ts", b".tsx", b".mts", b".cts")

          relevant = []
          for path in filter(None, changed):
              if path in policy:
                  relevant.append(path)
                  continue
              if not path.startswith(b"web/"):
                  continue
              web_path = path[len(b"web/"):]
              if web_path.startswith(excluded):
                  continue
              if web_path.endswith(extensions):
                  relevant.append(path)

          run = bool(relevant)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"run={str(run).lower()}\n")
              output.write(f"count={len(relevant)}\n")

          if run:
              print(f"Complexity-relevant changes: {len(relevant)}")
              for path in relevant[:50]:
                  print("  " + os.fsdecode(path))
          else:
              print("No production web source or complexity policy changed; skipping Bun and Oxlint.")
          PY

      - name: Determine pull-request complexity scope
        if: github.event_name == 'pull_request_target' && steps.api_scope.outputs.scan != 'false' && steps.scope.outputs.run == 'true'
        id: selected_scope
        env:
          # The merge base the step above found (the base tip when it found none).
          DIFF_BASE: ${{ steps.scope.outputs.diff_base }}
        run: |
          set -euo pipefail
          [[ "$(git -C candidate rev-parse HEAD)" == "$CANDIDATE_SHA" ]]
          [[ "$DIFF_BASE" =~ ^[0-9a-f]{40}$ ]]
          git -C candidate cat-file -e "${DIFF_BASE}^{commit}"
          python3 -I -S trusted/scripts/ci/scope-web-complexity.py \
            --repo-root candidate \
            --base "$DIFF_BASE" \
            --head "$CANDIDATE_SHA" \
            --base-baseline trusted/web/oxlint-complexity-baseline.txt \
            --selected-output "$RUNNER_TEMP/web-complexity-selected.zlist" \
            --github-output "$GITHUB_OUTPUT"

      - name: Setup Bun
        if: github.event_name == 'push' || steps.scope.outputs.run == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Install trusted web tooling
        if: github.event_name == 'push' || steps.scope.outputs.run == 'true'
        working-directory: trusted/web
        run: bun install --frozen-lockfile

      # Bun reads bunfig.toml and .env from its working directory. Every check
      # below runs from the trusted checkout with this empty config and no env
      # file, so the tree being judged cannot configure the runtime judging it.
      # --config needs the = form: given a separate argument, Bun runs the config
      # file as the script, exits 0, and the check never happens.
      - name: Create empty trusted Bun config
        if: github.event_name == 'push' || steps.scope.outputs.run == 'true'
        run: |
          set -euo pipefail
          : > "$GITHUB_WORKSPACE/trusted/.bunfig-empty.toml"

      # A stale branch still carries old copies of trusted files that main has
      # since updated, and those copies never land. Squash and merge-commit
      # landings both produce the merge of the head into its base, so merge it
      # the same way (git merge-tree follows renames and criss-cross history)
      # and let the checker judge the trusted files in that merge. A rebase
      # merge replays commits one by one instead, so while the repository
      # allows it the check stays strict. The setting is read when the check
      # runs, so re-enabling rebase merging leaves earlier passes standing: keep
      # rebase off with a ruleset, or re-run this check on open pull requests
      # after turning it on. The history is fetched without file contents; any
      # failure or a conflicted merge also stays strict.
      - name: Merge pull request into its base for the trusted-file check
        id: merge
        if: github.event_name == 'pull_request_target' && steps.scope.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The GraphQL variables are literal; gh substitutes them, not the shell.
          # shellcheck disable=SC2016
          rebase_allowed="$(gh api graphql -f owner="${GITHUB_REPOSITORY%%/*}" -f name="${GITHUB_REPOSITORY#*/}" \
            -f query='query($owner: String!, $name: String!) { repository(owner: $owner, name: $name) { rebaseMergeAllowed } }' \
            --jq '.data.repository.rebaseMergeAllowed' || true)"
          if [[ "$rebase_allowed" != "false" ]]; then
            echo "Rebase merging is allowed (or unknown); comparing trusted files strictly."
            exit 0
          fi
          merge_repo="$RUNNER_TEMP/merge.git"
          upstream="https://github.com/${GITHUB_REPOSITORY}.git"
          if ! git clone -q --bare --filter=blob:none --no-tags --single-branch --branch main "$upstream" "$merge_repo" ||
            ! git -C "$merge_repo" cat-file -e "${TRUSTED_SHA}^{commit}" ||
            ! git -C "$merge_repo" -c protocol.version=2 fetch -q --no-tags --filter=blob:none "$upstream" "$CANDIDATE_SHA"; then
            echo "Merge unavailable; comparing trusted files strictly."
            exit 0
          fi
          if ! merge_output="$(git -C "$merge_repo" merge-tree --write-tree "$TRUSTED_SHA" "$CANDIDATE_SHA")"; then
            echo "The pull request does not merge cleanly; comparing trusted files strictly."
            exit 0
          fi
          tree="${merge_output%%$'\n'*}"
          [[ "$tree" =~ ^[0-9a-f]{40}$ ]]
          echo "repo=$merge_repo" >> "$GITHUB_OUTPUT"
          echo "tree=$tree" >> "$GITHUB_OUTPUT"

      - name: Check pull-request or merge-group source with trusted policy
        if: github.event_name != 'push' && steps.scope.outputs.run == 'true'
        working-directory: trusted/web
        env:
          SCOPE_MODE: ${{ steps.selected_scope.outputs.mode || 'full' }}
          SELECTED_COUNT: ${{ steps.selected_scope.outputs.selected_count }}
          MERGE_REPO: ${{ steps.merge.outputs.repo }}
          MERGE_TREE: ${{ steps.merge.outputs.tree }}
        run: |
          set -euo pipefail
          checker=(
            bun --no-env-file --config="$GITHUB_WORKSPACE/trusted/.bunfig-empty.toml"
            scripts/check-complexity.mjs
            --repo-root "$GITHUB_WORKSPACE/candidate"
            --tool-root "$GITHUB_WORKSPACE/trusted"
            --base-baseline "$GITHUB_WORKSPACE/trusted/web/oxlint-complexity-baseline.txt"
            --head "$CANDIDATE_SHA"
          )
          if [[ -n "$MERGE_REPO" && -n "$MERGE_TREE" ]]; then
            checker+=(--merge-repo "$MERGE_REPO" --merge-tree "$MERGE_TREE")
          fi
          case "$SCOPE_MODE" in
            full|skip)
              echo "Web complexity: selected $SELECTED_COUNT production file(s) for conservative full scan."
              "${checker[@]}"
              ;;
            changed)
              mapfile -d '' -t selected < "$RUNNER_TEMP/web-complexity-selected.zlist"
              [[ "${#selected[@]}" -eq "$SELECTED_COUNT" ]]
              echo "Web complexity: selected ${#selected[@]} changed existing production file(s)."
              if [[ "${#selected[@]}" -eq 0 ]]; then
                exit 0
              fi
              "${checker[@]}" --files "${selected[@]}"
              ;;
            *)
              echo "::error::Unexpected Web complexity scope mode: $SCOPE_MODE"
              exit 1
              ;;
          esac

      - name: Check main push with trusted policy
        if: github.event_name == 'push'
        working-directory: trusted/web
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -n "${BEFORE_SHA:-}" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            bun --no-env-file --config="$GITHUB_WORKSPACE/trusted/.bunfig-empty.toml" scripts/check-complexity.mjs --base "$BEFORE_SHA" --head "$HEAD_SHA"
          else
            bun --no-env-file --config="$GITHUB_WORKSPACE/trusted/.bunfig-empty.toml" scripts/check-complexity.mjs
          fi
