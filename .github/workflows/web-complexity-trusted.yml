name: Web complexity

on:
  # This workflow is read from the base branch. It checks the pull-request
  # source as data and executes only the trusted checker from the base.
  pull_request_target:
    branches:
      - main
    types: [opened, edited, reopened, synchronize, ready_for_review]
  push:
    branches:
      - main
    paths:
      - web/**
      - .github/workflows/web-complexity.yml
      - .github/workflows/web-complexity-trusted.yml

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: web-complexity-trusted-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  complexity:
    name: Web complexity
    # The job reads untrusted source bytes. Keep it on an ephemeral GitHub
    # hosted runner and never allow a repository variable to select the host.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout trusted policy revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.base.sha || github.sha }}
          path: trusted
          fetch-depth: 0
          persist-credentials: false

      - name: Require GitHub-hosted runner
        if: runner.environment != 'github-hosted'
        run: |
          set -euo pipefail
          echo "::error::Web complexity requires a GitHub-hosted runner"
          exit 1

      - name: Verify trusted checkout
        env:
          TRUSTED_SHA: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.base.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$TRUSTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git -C trusted rev-parse HEAD)" == "$TRUSTED_SHA" ]]
          [[ -f trusted/web/scripts/check-complexity.mjs ]]
          [[ -f trusted/web/oxlint-complexity-baseline.txt ]]

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Install trusted web tooling
        working-directory: trusted/web
        run: bun install --frozen-lockfile

      - name: Checkout pull-request source
        if: github.event_name == 'pull_request_target'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          fetch-depth: 1
          persist-credentials: false

      - name: Check pull-request source with trusted policy
        if: github.event_name == 'pull_request_target'
        working-directory: candidate/web
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          bun "$GITHUB_WORKSPACE/trusted/web/scripts/check-complexity.mjs" \
            --repo-root "$GITHUB_WORKSPACE/candidate" \
            --tool-root "$GITHUB_WORKSPACE/trusted" \
            --base-baseline "$GITHUB_WORKSPACE/trusted/web/oxlint-complexity-baseline.txt" \
            --head "$HEAD_SHA"

      - name: Check main push with trusted policy
        if: github.event_name == 'push'
        working-directory: trusted/web
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -n "${BEFORE_SHA:-}" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            bun scripts/check-complexity.mjs --base "$BEFORE_SHA" --head "$HEAD_SHA"
          else
            bun scripts/check-complexity.mjs
          fi
