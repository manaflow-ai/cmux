name: Web complexity

on:
  # This workflow is read from the base branch. It checks the pull-request
  # source as data and executes only the trusted checker from the base.
  pull_request_target:
    branches:
      - main
    types: [opened, edited, reopened, synchronize, ready_for_review]
  # The merge queue's commit is checked the same way, as data, against the
  # policy on the branch it is about to join.
  merge_group:
  push:
    branches:
      - main
    paths:
      - web/**
      - .github/workflows/web-complexity.yml
      - .github/workflows/web-complexity-trusted.yml

permissions:
  contents: read
  pull-requests: read

# Metadata-only edits must not cancel a useful content check. A separate
# group also keeps them from replacing a pending content run.
concurrency:
  group: web-complexity-trusted-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}${{ github.event_name == 'pull_request_target' && github.event.action == 'edited' && !github.event.changes.base && (github.event.changes.body || github.event.changes.title) && '-metadata' || '' }}
  cancel-in-progress: true

jobs:
  complexity:
    # Keep the required context literal and evaluate the real verdict on edits.
    # GitHub can publish an unevaluated name expression when a job is skipped.
    name: Web complexity
    # The job reads untrusted source bytes. Keep it on an ephemeral GitHub
    # hosted runner and never allow a repository variable to select the host.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # The policy comes from the base of a pull request or merge group, and
      # from the pushed commit itself on main. The tree being judged is the
      # pull request's head or the merge group's commit.
      TRUSTED_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.sha }}
      CANDIDATE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout trusted policy revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ github.repository }}
          ref: ${{ env.TRUSTED_SHA }}
          path: trusted
          # Pull requests and merge groups only read the exact trusted policy
          # snapshot, so avoid cloning the repository's full history and tags.
          # Main pushes compare github.event.before..github.sha and still need
          # enough history to reach an arbitrarily large pushed commit range.
          fetch-depth: ${{ github.event_name != 'push' && 1 || 0 }}
          persist-credentials: false

      - name: Require GitHub-hosted runner
        if: runner.environment != 'github-hosted'
        run: |
          set -euo pipefail
          echo "::error::Web complexity requires a GitHub-hosted runner"
          exit 1

      - name: Verify trusted checkout
        run: |
          set -euo pipefail
          [[ "$TRUSTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git -C trusted rev-parse HEAD)" == "$TRUSTED_SHA" ]]
          [[ -f trusted/scripts/ci/scope-web-complexity.py ]]
          [[ -f trusted/web/scripts/check-complexity.mjs ]]
          [[ -f trusted/web/oxlint-complexity-baseline.txt ]]

      - name: Check complete current-base API scope
        id: api_scope
        if: github.event_name == 'pull_request_target'
        env:
          GH_TOKEN: ${{ github.token }}
          CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
        run: |
          set -euo pipefail
          if [[ ! -f "$GITHUB_WORKSPACE/trusted/scripts/ci/web_complexity_scope.py" ]]; then
            echo "scan=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! gh api "repos/${GITHUB_REPOSITORY}/compare/${TRUSTED_SHA}...${CANDIDATE_SHA}" > "$RUNNER_TEMP/complexity-compare.json"; then
            echo "scan=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 "$GITHUB_WORKSPACE/trusted/scripts/ci/web_complexity_scope.py" \
            --compare-json "$RUNNER_TEMP/complexity-compare.json" \
            --trusted-base "$TRUSTED_SHA" --expected-count "$CHANGED_FILES" >> "$GITHUB_OUTPUT"

      - name: Checkout pull-request or merge-group source
        if: github.event_name != 'push' && steps.api_scope.outputs.scan != 'false'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ env.CANDIDATE_REPOSITORY }}
          ref: ${{ env.CANDIDATE_SHA }}
          path: candidate
          fetch-depth: 1
          persist-credentials: false

      - name: Select complexity work before installing Bun
        id: scope
        if: github.event_name != 'push' && steps.api_scope.outputs.scan != 'false'
        env:
          UPSTREAM_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$TRUSTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]

          if ! git -C candidate cat-file -e "${TRUSTED_SHA}^{commit}" 2>/dev/null; then
            git -C candidate -c protocol.version=2 fetch --no-tags --depth=1               "https://github.com/${UPSTREAM_REPOSITORY}.git" "$TRUSTED_SHA"
          fi

          python3 - <<'PY'
          import os
          import subprocess

          root = os.environ["GITHUB_WORKSPACE"] + "/candidate"
          base = os.environ["TRUSTED_SHA"]
          head = os.environ["CANDIDATE_SHA"]
          changed = subprocess.check_output(
              ["git", "-C", root, "diff", "--no-renames", "--name-only", "-z", base, head, "--"]
          ).split(b"\0")

          policy = {
              b".github/workflows/web-complexity-trusted.yml",
              b".github/workflows/web-complexity.yml",
              b"scripts/ci/scope-web-complexity.py",
              b"scripts/ci/web_complexity_scope.py",
              b"web/.oxlintrc.json",
              b"web/bun.lock",
              b"web/bunfig.toml",
              b"web/package.json",
              b"web/oxlint-complexity-baseline.txt",
              b"web/scripts/check-complexity.mjs",
          }
          excluded = (
              b".next/",
              b"coverage/",
              b"db/migrations/",
              b"e2e/",
              b"node_modules/",
              b"out/",
              b"public/",
              b"scripts/",
              b"tests/",
              b"tools/",
          )
          extensions = (b".js", b".jsx", b".mjs", b".cjs", b".ts", b".tsx", b".mts", b".cts")

          relevant = []
          for path in filter(None, changed):
              if path in policy:
                  relevant.append(path)
                  continue
              if not path.startswith(b"web/"):
                  continue
              web_path = path[len(b"web/"):]
              if web_path.startswith(excluded):
                  continue
              if web_path.endswith(extensions):
                  relevant.append(path)

          run = bool(relevant)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"run={str(run).lower()}\n")
              output.write(f"count={len(relevant)}\n")

          if run:
              print(f"Complexity-relevant changes: {len(relevant)}")
              for path in relevant[:50]:
                  print("  " + os.fsdecode(path))
          else:
              print("No production web source or complexity policy changed; skipping Bun and Oxlint.")
          PY

      - name: Determine pull-request complexity scope
        if: github.event_name == 'pull_request_target' && steps.api_scope.outputs.scan != 'false' && steps.scope.outputs.run == 'true'
        id: selected_scope
        run: |
          set -euo pipefail
          [[ "$(git -C candidate rev-parse HEAD)" == "$CANDIDATE_SHA" ]]
          git -C candidate fetch --no-tags --depth=1 "$GITHUB_WORKSPACE/trusted" "$TRUSTED_SHA"
          python3 -I -S trusted/scripts/ci/scope-web-complexity.py \
            --repo-root candidate \
            --base "$TRUSTED_SHA" \
            --head "$CANDIDATE_SHA" \
            --base-baseline trusted/web/oxlint-complexity-baseline.txt \
            --selected-output "$RUNNER_TEMP/web-complexity-selected.zlist" \
            --github-output "$GITHUB_OUTPUT"

      - name: Setup Bun
        if: github.event_name == 'push' || steps.scope.outputs.run == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Install trusted web tooling
        if: github.event_name == 'push' || steps.scope.outputs.run == 'true'
        working-directory: trusted/web
        run: bun install --frozen-lockfile

      # Bun reads bunfig.toml and .env from its working directory. Every check
      # below runs from the trusted checkout with this empty config and no env
      # file, so the tree being judged cannot configure the runtime judging it.
      # --config needs the = form: given a separate argument, Bun runs the config
      # file as the script, exits 0, and the check never happens.
      - name: Create empty trusted Bun config
        if: github.event_name == 'push' || steps.scope.outputs.run == 'true'
        run: |
          set -euo pipefail
          : > "$GITHUB_WORKSPACE/trusted/.bunfig-empty.toml"

      - name: Check pull-request or merge-group source with trusted policy
        if: github.event_name != 'push' && steps.scope.outputs.run == 'true'
        working-directory: trusted/web
        env:
          SCOPE_MODE: ${{ steps.selected_scope.outputs.mode || 'full' }}
          SELECTED_COUNT: ${{ steps.selected_scope.outputs.selected_count }}
        run: |
          set -euo pipefail
          checker=(
            bun --no-env-file --config="$GITHUB_WORKSPACE/trusted/.bunfig-empty.toml"
            scripts/check-complexity.mjs
            --repo-root "$GITHUB_WORKSPACE/candidate"
            --tool-root "$GITHUB_WORKSPACE/trusted"
            --base-baseline "$GITHUB_WORKSPACE/trusted/web/oxlint-complexity-baseline.txt"
            --head "$CANDIDATE_SHA"
          )
          case "$SCOPE_MODE" in
            full|skip)
              echo "Web complexity: selected $SELECTED_COUNT production file(s) for conservative full scan."
              "${checker[@]}"
              ;;
            changed)
              mapfile -d '' -t selected < "$RUNNER_TEMP/web-complexity-selected.zlist"
              [[ "${#selected[@]}" -eq "$SELECTED_COUNT" ]]
              echo "Web complexity: selected ${#selected[@]} changed existing production file(s)."
              if [[ "${#selected[@]}" -eq 0 ]]; then
                exit 0
              fi
              "${checker[@]}" --files "${selected[@]}"
              ;;
            *)
              echo "::error::Unexpected Web complexity scope mode: $SCOPE_MODE"
              exit 1
              ;;
          esac

      - name: Check main push with trusted policy
        if: github.event_name == 'push'
        working-directory: trusted/web
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -n "${BEFORE_SHA:-}" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            bun --no-env-file --config="$GITHUB_WORKSPACE/trusted/.bunfig-empty.toml" scripts/check-complexity.mjs --base "$BEFORE_SHA" --head "$HEAD_SHA"
          else
            bun --no-env-file --config="$GITHUB_WORKSPACE/trusted/.bunfig-empty.toml" scripts/check-complexity.mjs
          fi
