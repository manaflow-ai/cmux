name: Web complexity

on:
  # This workflow is read from the base branch. It checks the pull-request
  # source as data and executes only the trusted checker from the base.
  pull_request_target:
    branches:
      - main
    types: [opened, edited, reopened, synchronize, ready_for_review]
  # The merge queue's commit is checked the same way, as data, against the
  # policy on the branch it is about to join.
  merge_group:
  push:
    branches:
      - main
    paths:
      - web/**
      - .github/workflows/web-complexity.yml
      - .github/workflows/web-complexity-trusted.yml

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: web-complexity-trusted-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: true

jobs:
  complexity:
    name: Web complexity
    # The job reads untrusted source bytes. Keep it on an ephemeral GitHub
    # hosted runner and never allow a repository variable to select the host.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # The policy comes from the base of a pull request or merge group, and
      # from the pushed commit itself on main. The tree being judged is the
      # pull request's head or the merge group's commit.
      TRUSTED_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.sha }}
      CANDIDATE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout trusted policy revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ github.repository }}
          ref: ${{ env.TRUSTED_SHA }}
          path: trusted
          fetch-depth: 0
          persist-credentials: false

      - name: Require GitHub-hosted runner
        if: runner.environment != 'github-hosted'
        run: |
          set -euo pipefail
          echo "::error::Web complexity requires a GitHub-hosted runner"
          exit 1

      - name: Verify trusted checkout
        run: |
          set -euo pipefail
          [[ "$TRUSTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git -C trusted rev-parse HEAD)" == "$TRUSTED_SHA" ]]
          [[ -f trusted/web/scripts/check-complexity.mjs ]]
          [[ -f trusted/web/oxlint-complexity-baseline.txt ]]
          [[ -f trusted/scripts/ci/web_complexity_scope.py ]]

      - name: Scope the scan to changed paths
        id: scope
        if: github.event_name == 'pull_request_target'
        env:
          GH_TOKEN: ${{ github.token }}
          CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
        run: |
          set -euo pipefail
          # Pin the diff to the exact pair of revisions this job judges. The
          # pull-request files endpoint takes no ref and always describes the
          # PR's current head, so it can disagree with CANDIDATE_SHA while a
          # push is still settling. `compare` is three-dot, so base...head is
          # the same merge-base diff the checker is evaluated against.
          #
          # Candidate filenames are data: they come from the compare API rather
          # than the candidate tree, and the trusted classifier only compares
          # them as strings, so no candidate code runs here.
          if ! gh api \
              -H "Accept: application/vnd.github+json" \
              "repos/${GITHUB_REPOSITORY}/compare/${TRUSTED_SHA}...${CANDIDATE_SHA}" \
              --jq '.files[]? | [.status, .filename, (.previous_filename // "")] | @tsv' \
              > "$RUNNER_TEMP/changed-files.tsv"; then
            echo "Could not list changed files; running the full scan."
            echo "scan=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 "$GITHUB_WORKSPACE/trusted/scripts/ci/web_complexity_scope.py" \
            --changed-files "$RUNNER_TEMP/changed-files.tsv" \
            --expected-count "$CHANGED_FILES" >> "$GITHUB_OUTPUT"

      - name: Setup Bun
        if: steps.scope.outputs.scan != 'false'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Install trusted web tooling
        if: steps.scope.outputs.scan != 'false'
        working-directory: trusted/web
        run: bun install --frozen-lockfile

      # Bun reads bunfig.toml and .env from its working directory. Every check
      # below runs from the trusted checkout with this empty config and no env
      # file, so the tree being judged cannot configure the runtime judging it.
      # --config needs the = form: given a separate argument, Bun runs the config
      # file as the script, exits 0, and the check never happens.
      - name: Create empty trusted Bun config
        if: steps.scope.outputs.scan != 'false'
        run: |
          set -euo pipefail
          : > "$GITHUB_WORKSPACE/trusted/.bunfig-empty.toml"

      - name: Checkout pull-request or merge-group source
        if: github.event_name != 'push' && steps.scope.outputs.scan != 'false'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ env.CANDIDATE_REPOSITORY }}
          ref: ${{ env.CANDIDATE_SHA }}
          path: candidate
          fetch-depth: 1
          persist-credentials: false

      - name: Check pull-request or merge-group source with trusted policy
        if: github.event_name != 'push' && steps.scope.outputs.scan != 'false'
        working-directory: trusted/web
        run: |
          set -euo pipefail
          bun --no-env-file --config="$GITHUB_WORKSPACE/trusted/.bunfig-empty.toml" scripts/check-complexity.mjs \
            --repo-root "$GITHUB_WORKSPACE/candidate" \
            --tool-root "$GITHUB_WORKSPACE/trusted" \
            --base-baseline "$GITHUB_WORKSPACE/trusted/web/oxlint-complexity-baseline.txt" \
            --head "$CANDIDATE_SHA"

      - name: Check main push with trusted policy
        if: github.event_name == 'push'
        working-directory: trusted/web
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -n "${BEFORE_SHA:-}" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            bun --no-env-file --config="$GITHUB_WORKSPACE/trusted/.bunfig-empty.toml" scripts/check-complexity.mjs --base "$BEFORE_SHA" --head "$HEAD_SHA"
          else
            bun --no-env-file --config="$GITHUB_WORKSPACE/trusted/.bunfig-empty.toml" scripts/check-complexity.mjs
          fi

      - name: Report skipped scan
        if: steps.scope.outputs.scan == 'false'
        run: |
          set -euo pipefail
          echo "No production web source and no complexity policy file changed."
          echo "The trusted baseline is unchanged, so the scan result cannot differ"
          echo "from the base it would be compared against. Skipping Bun setup,"
          echo "dependency install, and the Oxlint scan."
