name: fleet rd-host macOS (advisory)

# Advisory: cmux-rd-host's macOS fmt, clippy and tests on a fleet Mac, run on the
# feat-cmux-next tip at most once per 2-hour window, and a red that names the
# range of landings since the last tip it checked.
#
# rust-workspaces.yml checks cmux-rd-host (its .github/rust-workspaces.toml entry)
# on Linux only, so the code behind #[cfg(target_os = "macos")] (src/mac/, the
# hardware encoder path) is never linted by a pull request. On 2026-11-15
# `cmux-tui-rust-check.sh rd-host` (clippy --all-targets --no-default-features
# --features bench -D warnings, then the tests, on macOS) was red on
# feat-cmux-next with two dead_code errors in src/hybrid.rs (fixed in #43668),
# and no pull request job had seen them.
#
# Tip, not pull request (2026-11-22): as a pull request check it ran 70 times in
# 24 h (2026-11-21T03..22T03, ci_per_pr.py timing feed), 1,358 runner-minutes
# of gateway wall time, about 2.1 a merged PR, plus the fleet Mac's time behind
# each, and it was red 0 times. A check that never reds on pull requests runs
# once per interval at the tip (base-coalesce.yml): the first feat-cmux-next push
# of each 2-hour window that changes the crate runs it, at most twelve runs a
# day, and a red names the range since the last tip it checked, for
# base-red-watch to bisect. A crate push that a window's earlier run already
# claimed is checked by the next crate push's run (it checks the whole crate at
# that tip), or by a dispatch. A pull request that wants the verdict before it
# lands dispatches this workflow on its branch (workflow_dispatch, ref = the
# branch). vars.CI_RD_HOST_COALESCE = '0' runs it on every crate push again.
#
# It gates nothing, as fleet-test-compile.yml: the landing gate and the required
# compiles neither wait for it nor read it. The workflow's name says "(advisory)"
# like its job's, so a reader that judges a whole check suite skips it as well.
#
# It runs on its own gateway label, vars.CI_RD_HOST_GATEWAY, and falls back
# to the advisory test-compile label vars.CI_TEST_COMPILE_GATEWAY, never the
# required compile's CI_COMPILE_CHECK_GATEWAY: a gateway job holds a fleet runner
# while its client waits on the controller (fleet-test-compile.yml's header has
# the 2026-10-22 numbers). With both unset this job is skipped and nothing queues.
#
# The path filter is the plan: only a change to the crate, the check script or
# this file starts it. tests/test_ci_rd_host_macos_route.py fails when no
# feat-cmux-next push that changes a macOS-only file of the crate runs this
# check on macOS.

on:
  push:
    branches: [feat-cmux-next]
    paths:
      - "cmux-tui/crates/cmux-rd-host/**"
      - "scripts/ci/cmux-tui-rust-check.sh"
      - ".github/workflows/fleet-rd-host-macos.yml"
  workflow_dispatch:

permissions: {}

env:
  # Temporary REST budget attribution: one gh-call line per GitHub API call (scripts/ci/api_call_log/env.sh, fetched at a fixed commit when the checkout has no copy).
  BASH_ENV: '$({ w="${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh"; t="${RUNNER_TEMP:-/nonexistent}/api-call-log-src"; if [ -f "$w" ]; then echo "$w"; elif [ -n "${RUNNER_TEMP:-}" ]; then if [ ! -f "$t/env.sh" ] && [ ! -e "$t.tried" ] && { [ "${RUNNER_OS:-}" = Linux ] || [ "${RUNNER_OS:-}" = macOS ]; } && [ "$(date -u +%Y%m%d%H)" -lt 2026112300 ]; then : > "$t.tried"; mkdir -p "$t.part" && for x in env.sh gh sitecustomize.py isolated.py; do curl -fsSL --max-time 5 -o "$t.part/$x" "https://raw.githubusercontent.com/manaflow-ai/cmux/27647ffd3ae838c63be28ca3e5883dcd68c34518/scripts/ci/api_call_log/$x" || break; done; [ -s "$t.part/isolated.py" ] && mv "$t.part" "$t"; fi; if [ -f "$t/env.sh" ]; then echo "$t/env.sh"; else echo unset BASH_ENV > "$t.off.sh" && echo "$t.off.sh"; fi; fi; } 2>/dev/null)'

# One tip run at a time; a started one is never cancelled (the fleet step would be lost).
concurrency:
  group: fleet-rd-host-macos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  coalesce:
    if: github.repository == 'manaflow-ai/cmux'
    uses: ./.github/workflows/base-coalesce.yml
    with:
      key: fleet-rd-host-macos
      hold_minutes: 120
      no_coalesce: ${{ format('{0}', vars.CI_RD_HOST_COALESCE) == '0' }}

  check:
    needs: coalesce
    name: fleet/rd-host-macos (advisory)
    # The fleet takes this repository's own refs only; a push a window's earlier run covers skips (no runner).
    if: ${{ !cancelled() && needs.coalesce.outputs.run != 'false' && github.repository == 'manaflow-ai/cmux' && (vars.CI_RD_HOST_GATEWAY != '' || vars.CI_TEST_COMPILE_GATEWAY != '') }}
    # The gateway label, as fleet-compile-check.yml's: the `if:` above already skips a fork or a repository with
    # neither variable set, so the Linux branches only keep the expression readable (a gateway job hands the step to
    # the controller; the Mac is the fleet worker, not this runner).
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.CI_RD_HOST_GATEWAY || vars.CI_TEST_COMPILE_GATEWAY || fromJSON(vars.RUNNER_POOLS).linux_4 }}
    permissions: {}
    # Longer than the client's queue (1200 s) plus run (3600 s) timeouts and its
    # report: a job timeout concludes as a failure, which would read as red.
    timeout-minutes: 90
    steps:
      # The gateway checks nothing out: the fleet fetches the tip commit itself.
      # Exit 0 is a pass. A FAIL row for `rd-host fmt`, `rd-host clippy` or
      # `rd-host test` in the script's summary table is a red whatever the exit.
      # Anything else (queue or run timeout, setup, the client) is no verdict:
      # a warning, and this check stays green.
      - name: Run cmux-rd-host's macOS fmt, clippy and tests on a fleet Mac
        env:
          REF: ${{ github.sha }}
          SINCE: ${{ needs.coalesce.outputs.base }}
          SERVER: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -uo pipefail
          client="${CMUX_CI_CLIENT:-$HOME/.local/bin/cmux-ci}"
          if ! [[ -x "$client" ]]; then
            echo "::warning title=fleet rd-host macOS::$client is not installed on runner $RUNNER_NAME; no rd-host verdict."
            exit 0
          fi
          log="$RUNNER_TEMP/rd-host-macos.log"
          status=0
          "$client" run --class isolated --script scripts/ci/cmux-tui-rust-check.sh --ref "$REF" \
            --os macos --arg rd-host --timeout 3600 --queue-timeout 1200 2>&1 | tee "$log" || status=$?
          failed="$(grep -E -o 'rd-host (fmt|clippy|test) +FAIL \(exit [0-9]+\)' "$log" | sed -E 's/ +FAIL/: FAIL/' | sort -u | paste -sd ',' - || true)"
          if [[ -n "$failed" ]]; then
            range="$REF"
            if [[ "$SINCE" =~ ^[0-9a-f]{40}$ ]]; then range="$SERVER/compare/$SINCE...$REF (the landings since the last tip checked)"; fi
            echo "::error title=fleet rd-host macOS::$failed on macOS at ${REF:0:12}; red range: $range (advisory; see the errors above)."
            exit 1
          elif [[ "$status" -eq 0 ]]; then
            echo "cmux-rd-host's macOS fmt, clippy and tests passed."
          else
            echo "::warning title=fleet rd-host macOS::No rd-host verdict (exit $status)."
          fi
