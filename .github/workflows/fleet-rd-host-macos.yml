name: fleet rd-host macOS (advisory)

# Advisory: cmux-rd-host's macOS fmt, clippy and tests on a fleet Mac, for a pull
# request that changes the crate, and a red when one of them fails.
#
# rust-workspaces.yml checks cmux-rd-host (its .github/rust-workspaces.toml entry)
# on Linux only, so the code behind #[cfg(target_os = "macos")] (src/mac/, the
# hardware encoder path) is never linted by a pull request. On 2026-11-15
# `cmux-tui-rust-check.sh rd-host` (clippy --all-targets --no-default-features
# --features bench -D warnings, then the tests, on macOS) was red on
# feat-cmux-next with two dead_code errors in src/hybrid.rs (fixed in #43668),
# and no pull request job had seen them.
#
# It gates nothing, as fleet-test-compile.yml: the landing gate and the required
# compiles neither wait for it nor read it. The workflow's name says "(advisory)"
# like its job's, so a reader that judges a whole check suite skips it as well.
#
# It runs on its own gateway label, vars.CI_RD_HOST_GATEWAY, and falls back
# to the advisory test-compile label vars.CI_TEST_COMPILE_GATEWAY, never the
# required compile's CI_COMPILE_CHECK_GATEWAY: a gateway job holds a fleet runner
# while its client waits on the controller (fleet-test-compile.yml's header has
# the 2026-10-22 numbers). With both unset this job is skipped and nothing queues.
# The path filter is the plan: only a change to the crate, the check script or
# this file starts it, so no Linux plan job runs first.
#
# tests/test_ci_rd_host_macos_route.py fails when no pull_request workflow both
# starts for a change under cmux-tui/crates/cmux-rd-host/ and runs this check on
# macOS.

on:
  pull_request:
    branches: [feat-cmux-next]
    paths:
      - "cmux-tui/crates/cmux-rd-host/**"
      - "scripts/ci/cmux-tui-rust-check.sh"
      - ".github/workflows/fleet-rd-host-macos.yml"

permissions: {}

env:
  # Temporary REST budget attribution: one gh-call line per GitHub API call (scripts/ci/api_call_log/env.sh).
  BASH_ENV: ${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh

concurrency:
  group: fleet-rd-host-macos-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: fleet/rd-host-macos (advisory)
    # The fleet takes same-repository pull requests only (as fleet-test-compile.yml).
    if: ${{ github.repository_owner == 'manaflow-ai' && github.event.pull_request.head.repo.full_name == github.repository && (vars.CI_RD_HOST_GATEWAY != '' || vars.CI_TEST_COMPILE_GATEWAY != '') }}
    # The gateway label, as fleet-compile-check.yml's: the `if:` above already skips a fork or a repository with
    # neither variable set, so the Linux branches only keep the expression readable (a gateway job hands the step to
    # the controller; the Mac is the fleet worker, not this runner).
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.CI_RD_HOST_GATEWAY || vars.CI_TEST_COMPILE_GATEWAY || fromJSON(vars.RUNNER_POOLS).linux_4 }}
    permissions: {}
    # Longer than the client's queue (1200 s) plus run (3600 s) timeouts and its
    # report: a job timeout concludes as a failure, which would read as red.
    timeout-minutes: 90
    steps:
      # The gateway checks nothing out: the fleet fetches the merge commit itself.
      # Exit 0 is a pass. A FAIL row for `rd-host fmt`, `rd-host clippy` or
      # `rd-host test` in the script's summary table is a red whatever the exit.
      # Anything else (queue or run timeout, setup, the client) is no verdict:
      # a warning, and this check stays green.
      - name: Run cmux-rd-host's macOS fmt, clippy and tests on a fleet Mac
        env:
          REF: ${{ github.sha }}
        run: |
          set -uo pipefail
          client="${CMUX_CI_CLIENT:-$HOME/.local/bin/cmux-ci}"
          if ! [[ -x "$client" ]]; then
            echo "::warning title=fleet rd-host macOS::$client is not installed on runner $RUNNER_NAME; no rd-host verdict."
            exit 0
          fi
          log="$RUNNER_TEMP/rd-host-macos.log"
          status=0
          "$client" run --class isolated --script scripts/ci/cmux-tui-rust-check.sh --ref "$REF" \
            --os macos --arg rd-host --timeout 3600 --queue-timeout 1200 2>&1 | tee "$log" || status=$?
          failed="$(grep -E -o 'rd-host (fmt|clippy|test) +FAIL \(exit [0-9]+\)' "$log" | sed -E 's/ +FAIL/: FAIL/' | sort -u | paste -sd ',' - || true)"
          if [[ -n "$failed" ]]; then
            echo "::error title=fleet rd-host macOS::$failed on macOS (advisory; see the errors above)."
            exit 1
          elif [[ "$status" -eq 0 ]]; then
            echo "cmux-rd-host's macOS fmt, clippy and tests passed."
          else
            echo "::warning title=fleet rd-host macOS::No rd-host verdict (exit $status)."
          fi
