name: cmux NEXT base tier kick

# Leo (2026-10-30, on the fleet dashboard): "do we REALLY need to be compiling/testing THAT often...?"
# feat-cmux-next took 557 pushes in a day, a median 1.4 minutes apart, and each ran the base Mac tier
# (daemon tests, generated files, the Debug app scheme compile); 203 Mac hours of base jobs started
# after a newer landing already existed (cmuxterm-hq#5424). A push now leaves that tier to this kick,
# which dispatches one `cmux-next base tier · <tip>` run of cmux-next.yml at most once every 15 minutes,
# on the tip it reads then, when a cmux-next push path changed since the last one
# (scripts/ci/cmux_next_base_tier.py). That tip contains every landing before it, so each landing gets
# a base tier run within 15 minutes. The Release compiles (nightly-next's input), the DEV landing
# compile, the fast tier and every nightly, DEV or promote build still run on each push, untouched.
# Once the tip has a base tier run, the kick cancels older base tier runs none of whose Mac jobs has
# started or queued for a Mac runner (a queued one keeps its place; while one waits nothing is
# dispatched; vars.CMUX_NEXT_BASE_TIER_KEEP_QUEUED = '0' cancels queued ones again): the tip's run covers their landings (on 2026-10-31 82% of base tier Mac minutes started
# after a newer base tier run was dispatched). Nothing else is ever cancelled.
# vars.CMUX_NEXT_BASE_TIER_COALESCE = '0' turns this off and puts the tier back on every push.
# The kick calls GitHub with its own cmux-bot App token, never github.token: every workflow's
# GITHUB_TOKEN shares one REST budget an hour, and on 2026-11-10 14 of 40 kicks crashed on HTTP 403 when
# other workflows had spent it. Waiting that out with github.token is a sleeping loop on the shared
# budget, which tests/test_ci_no_github_token_polling.py (scripts/ci/github_token_polling.py) refuses.
# The App installation has its own budget. There is no github.token fallback: one would bring the
# shared-budget polling back, so a failed mint fails the kick red with the mint's error.
on:
  push:
    branches: [feat-cmux-next]

permissions: {}

# One kick at a time: the running one waits once for the window to open and dispatches; a newer
# push's kick replaces a pending one, which never started. It cancels no Mac job that started.
concurrency:
  group: cmux-next-base-tier-kick
  cancel-in-progress: false

env:
  # Temporary REST budget attribution: one gh-call line per GitHub API call (scripts/ci/api_call_log/env.sh, fetched at a fixed commit when the checkout has no copy).
  BASH_ENV: '$({ w="${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh"; t="${RUNNER_TEMP:-/nonexistent}/api-call-log-src"; if [ -f "$w" ]; then echo "$w"; elif [ -n "${RUNNER_TEMP:-}" ]; then if [ ! -f "$t/env.sh" ] && [ ! -e "$t.tried" ] && { [ "${RUNNER_OS:-}" = Linux ] || [ "${RUNNER_OS:-}" = macOS ]; } && [ "$(date -u +%Y%m%d%H)" -lt 2026112300 ]; then : > "$t.tried"; mkdir -p "$t.part" && for x in env.sh gh sitecustomize.py isolated.py; do curl -fsSL --max-time 5 -o "$t.part/$x" "https://raw.githubusercontent.com/manaflow-ai/cmux/27647ffd3ae838c63be28ca3e5883dcd68c34518/scripts/ci/api_call_log/$x" || break; done; [ -s "$t.part/isolated.py" ] && mv "$t.part" "$t"; fi; if [ -f "$t/env.sh" ]; then echo "$t/env.sh"; else echo unset BASH_ENV > "$t.off.sh" && echo "$t.off.sh"; fi; fi; } 2>/dev/null)'

jobs:
  kick:
    if: github.repository == 'manaflow-ai/cmux' && format('{0}', vars.CMUX_NEXT_BASE_TIER_COALESCE) != '0'
    name: Dispatch the base tier on the tip at most every 15 minutes
    # This job sleeps for most of a 15-minute window, then makes a GitHub API
    # dispatch. It reads the reconciled Linux pool (runner_pools.py keeps it on a
    # live small member), never a fixed Blacksmith size that can stall; the fork
    # routes in front of it never reach the pool read.
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || 'cmux-linux' }}
    # The one wait (at most the 15-minute window) plus the listing and the dispatch.
    timeout-minutes: 20
    # github.token only checks out; the API calls use the cmux-bot token minted below.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: |
            scripts/ci/cmux_next_base_tier.py
            scripts/ci/cmux_next_tree_notify.py
            scripts/ci/github_quota_client.py
            scripts/ci/deadline_http.py
            .github/workflows/cmux-next.yml
            scripts/ci/cmux_tui_tree_handoff.py
            scripts/ci/cmux_tui_tree_takeover.py
            scripts/ci/gh_pages.py
            .gitmodules
          sparse-checkout-cone-mode: false

      # The kick lists runs and their jobs, dispatches cmux-next.yml and cancels superseded base tier
      # runs (actions: write), and reads the branch ref and compares commits (contents: read).
      - name: Mint the cmux-bot token
        id: cmux-bot-token
        timeout-minutes: 1
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.CMUX_BOT_APP_ID }}
          private-key: ${{ secrets.CMUX_BOT_APP_KEY }}
          permission-actions: write
          permission-contents: read

      - name: Dispatch the base tier when it is due
        env:
          GH_TOKEN: ${{ steps.cmux-bot-token.outputs.token }}
          # '0' cancels and replaces base tier runs whose Mac jobs wait for a Mac runner again (the default
          # since 2026-11-22 keeps them: a queued or started generated-files job runs to its verdict).
          CMUX_NEXT_BASE_TIER_KEEP_QUEUED: ${{ vars.CMUX_NEXT_BASE_TIER_KEEP_QUEUED }}
        run: python3 -I scripts/ci/cmux_next_base_tier.py kick --repo "$GITHUB_REPOSITORY"
