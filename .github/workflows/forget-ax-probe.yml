name: Temporary forgotten-Mac accessibility probe
on:
  push:
    branches: [feat-forget-ax-probe]
permissions:
  contents: read
jobs:
  probe:
    runs-on: blacksmith-6vcpu-macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - run: ./scripts/select-ci-xcode.sh
      - run: |
          xcrun swiftc scripts/ci/forget-ax-probe.swift -o "$RUNNER_TEMP/forget-ax-probe"
          "$RUNNER_TEMP/forget-ax-probe"
