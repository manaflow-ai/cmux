name: cmux-tui

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-core-tests:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Init ghostty submodule
        run: git submodule update --init --depth 1 ghostty

      - name: Install zig
        run: ./scripts/install-zig-ci.sh

      - name: Set up Rust
        run: |
          rustc --version || true
          if ! command -v cargo >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs |
              sh -s -- -y --default-toolchain stable
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi

      - name: Compile core tests with visible diagnostics
        working-directory: cmux-tui
        run: cargo test -p cmux-tui-core --lib --no-run --locked
