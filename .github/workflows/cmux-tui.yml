name: cmux-tui
run-name: cmux-tui ${{ inputs.mode }} ${{ inputs.request_id }} @ ${{ inputs.commit }}

on:
  workflow_dispatch:
    inputs:
      commit:
        description: "Exact pushed 40-character commit SHA to verify"
        required: true
        type: string
      mode:
        description: "Focused Rust tests or the full cross-platform merge gate"
        required: true
        type: choice
        options:
          - focused
          - full
      test_filter:
        description: "Rust test-name substring; required in focused mode"
        required: false
        default: ""
        type: string
      request_id:
        description: "Unique caller token used to find this run"
        required: true
        type: string

concurrency:
  # Every caller waits for one exact commit. A newer request must not cancel it.
  group: cmux-tui-${{ inputs.request_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-inputs:
    name: validate exact commit request
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - name: Validate dispatch inputs
        env:
          EXACT_COMMIT: ${{ inputs.commit }}
          WORKFLOW_COMMIT: ${{ github.sha }}
          MODE: ${{ inputs.mode }}
          TEST_FILTER: ${{ inputs.test_filter }}
          REQUEST_ID: ${{ inputs.request_id }}
        shell: bash
        run: |
          if [[ ! "$EXACT_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::commit must be a lowercase 40-character SHA" >&2
            exit 1
          fi
          if [[ "$WORKFLOW_COMMIT" != "$EXACT_COMMIT" ]]; then
            echo "::error::workflow revision $WORKFLOW_COMMIT does not match requested commit $EXACT_COMMIT" >&2
            exit 1
          fi
          if [[ ! "$REQUEST_ID" =~ ^[A-Za-z0-9._-]{1,100}$ ]]; then
            echo "::error::request_id contains unsupported characters" >&2
            exit 1
          fi
          case "$MODE" in
            focused)
              if [[ ! "$TEST_FILTER" =~ ^[A-Za-z0-9_][A-Za-z0-9_:.-]{0,199}$ ]]; then
                echo "::error::focused mode needs one safe Rust test-name substring" >&2
                exit 1
              fi
              ;;
            full)
              if [[ -n "$TEST_FILTER" ]]; then
                echo "::error::full mode does not accept test_filter" >&2
                exit 1
              fi
              ;;
            *)
              echo "::error::unsupported mode: $MODE" >&2
              exit 1
              ;;
          esac

  web-frontend:
    needs: validate-inputs
    if: inputs.mode == 'full'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ inputs.commit }}

      - name: Require exact checkout
        env:
          EXACT_COMMIT: ${{ inputs.commit }}
        run: test "$(git rev-parse HEAD)" = "$EXACT_COMMIT"

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22.14.0"
          cache: npm
          cache-dependency-path: |
            cmux-tui/bindings/typescript/package-lock.json
            cmux-tui/frontends/web/package-lock.json

      - name: Build TypeScript SDK
        working-directory: cmux-tui/bindings/typescript
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Build and test web frontend
        working-directory: cmux-tui/frontends/web
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npm test

  valgrind-leak-check-shard:
    name: valgrind-leak-check (${{ matrix.shard }})
    needs: validate-inputs
    if: inputs.mode == 'full'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # Full behavior stays in the normal macOS and Linux suites. Valgrind owns
    # the bounded startup parsers and terminal replay state only.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [startup]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ inputs.commit }}

      - name: Require exact checkout
        env:
          EXACT_COMMIT: ${{ inputs.commit }}
        run: test "$(git rev-parse HEAD)" = "$EXACT_COMMIT"

      - name: Init ghostty submodule
        run: git submodule update --init --depth 1 ghostty

      - name: Install valgrind
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind

      - name: Install zig
        run: ./scripts/install-zig-ci.sh

      - name: Set up pinned Rust
        uses: ./.github/actions/setup-cmux-tui-rust

      - name: Build test binaries
        working-directory: cmux-tui
        env:
          # Force libghostty-vt's zig build onto a baseline CPU target so its
          # SIMD codegen stays within what valgrind's instruction emulation
          # supports (see crates/ghostty-vt-sys/build.rs).
          CMUX_GHOSTTY_VT_ZIG_CPU: baseline
          VALGRIND_SHARD: ${{ matrix.shard }}
        run: |
          mkdir -p target
          cargo test --workspace --locked --no-run --message-format=json > target/cargo-test-binaries.jsonl
          python3 <<'PY'
          import json
          import os
          import re
          import sys

          shard = os.environ["VALGRIND_SHARD"]
          known_shards = {"startup"}
          if shard not in known_shards:
              raise SystemExit(f"unknown Valgrind shard: {shard}")

          def shard_for(executable):
              name = os.path.basename(executable)
              if re.fullmatch(r"(?:cmux_tui|terminal)-[0-9a-f]+", name):
                  return "startup"
              return None

          seen = set()
          selected = []
          with open("target/cargo-test-binaries.jsonl", "r", encoding="utf-8") as messages:
              for line in messages:
                  try:
                      message = json.loads(line)
                  except json.JSONDecodeError:
                      continue
                  if not message.get("profile", {}).get("test"):
                      continue
                  executable = message.get("executable")
                  if not executable or executable in seen:
                      continue
                  seen.add(executable)
                  if shard_for(executable) == shard:
                      selected.append(executable)

          if not seen:
              raise SystemExit("cargo did not report any test binaries")
          if not selected:
              raise SystemExit(f"Valgrind shard {shard} selected no test binaries")

          with open("target/valgrind-test-binaries.txt", "w", encoding="utf-8") as output:
              for executable in selected:
                  print(executable, file=output)

          print(
              f"Valgrind shard {shard} selected {len(selected)} of {len(seen)} test binaries",
              file=sys.stderr,
          )
          PY

      - name: Verify baseline terminal replay behavior
        if: matrix.shard == 'startup'
        working-directory: cmux-tui
        run: |
          matches=0
          while IFS= read -r bin; do
            [ -n "$bin" ] || continue
            case "$(basename "$bin")" in
              terminal-*)
                if ! "$bin" --list \
                  | grep -Fqx 'pending_wrap_replay_preserves_cursor_with_origin_mode: test'; then
                  echo "::error::terminal replay test binary does not contain the exact baseline test" >&2
                  exit 1
                fi
                "$bin" pending_wrap_replay_preserves_cursor_with_origin_mode \
                  --exact \
                  --test-threads=1
                matches=$((matches + 1))
                ;;
            esac
          done < target/valgrind-test-binaries.txt
          if [[ "$matches" -ne 1 ]]; then
            echo "::error::expected one terminal integration test binary, found $matches" >&2
            exit 1
          fi

      - name: Run test binaries under valgrind
        working-directory: cmux-tui
        run: |
          run_valgrind() {
            local bin="$1"
            shift
            valgrind \
              "${valgrind_args[@]}" \
              --error-exitcode=1 \
              --leak-check=full \
              --show-leak-kinds=definite \
              --errors-for-leak-kinds=definite \
              -- "$bin" "$@"
          }

          require_exact_test() {
            local bin="$1"
            local test_name="$2"
            if ! "$bin" --list | grep -Fqx "$test_name: test"; then
              echo "::error::$(basename "$bin") does not contain exact test '$test_name'" >&2
              exit 1
            fi
          }

          cmux_tui_bin=""
          terminal_bin=""
          while IFS= read -r bin; do
            case "$(basename "$bin")" in
              cmux_tui-*) cmux_tui_bin="$bin" ;;
              terminal-*) terminal_bin="$bin" ;;
            esac
          done < target/valgrind-test-binaries.txt
          if [[ -z "$cmux_tui_bin" || -z "$terminal_bin" ]]; then
            echo "::error::startup memory check did not find both test binaries" >&2
            exit 1
          fi

          valgrind_args=(--track-origins=yes)
          require_exact_test \
            "$terminal_bin" \
            pending_wrap_replay_preserves_cursor_with_origin_mode
          run_valgrind \
            "$terminal_bin" \
            pending_wrap_replay_preserves_cursor_with_origin_mode \
            --exact \
            --test-threads=1

          startup_tests=(
            config::tests::load_uses_file_ghostty_defaults_without_invoking_external_resolver
            config::tests::ghostty_file_reader_enforces_byte_limit_during_read
            config::tests::ghostty_config_helper_output_reader_enforces_byte_limit
          )
          for test_name in "${startup_tests[@]}"; do
            require_exact_test "$cmux_tui_bin" "$test_name"
            run_valgrind \
              "$cmux_tui_bin" \
              "$test_name" \
              --exact \
              --test-threads=1
          done

  valgrind-leak-check:
    name: valgrind-leak-check
    if: always() && inputs.mode == 'full'
    needs: valgrind-leak-check-shard
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 2
    steps:
      - name: Require every Valgrind shard
        env:
          SHARD_RESULT: ${{ needs.valgrind-leak-check-shard.result }}
        run: test "$SHARD_RESULT" = success

  test:
    name: test (${{ matrix.os }})
    needs: validate-inputs
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos
            runner: blacksmith-6vcpu-macos-15
          - os: linux
            runner: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ inputs.commit }}

      - name: Require exact checkout
        env:
          EXACT_COMMIT: ${{ inputs.commit }}
        run: test "$(git rev-parse HEAD)" = "$EXACT_COMMIT"

      - name: Init ghostty submodule
        run: git submodule update --init --depth 1 ghostty

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap clang libclang-dev pkg-config
          bwrap_binary="$(command -v bwrap)"
          test -x "$bwrap_binary"
          printf 'CMUX_BENCH_LINUX_BWRAP=%s\n' "$bwrap_binary" >> "$GITHUB_ENV"

      - name: Install zig
        run: ./scripts/install-zig-ci.sh

      - name: Ghostty VT cursor replay checks
        if: inputs.mode == 'full'
        working-directory: ghostty
        run: |
          "$CMUX_ZIG" build test-lib-vt -Dtest-filter="Terminal vt"

      - name: Set up pinned Rust
        uses: ./.github/actions/setup-cmux-tui-rust

      - name: cargo fmt
        id: rustfmt-check
        working-directory: cmux-tui
        run: cargo fmt --check

      - name: Prepare hosted rustfmt patch
        if: ${{ failure() && steps.rustfmt-check.outcome == 'failure' }}
        working-directory: cmux-tui
        run: |
          cargo fmt
          git diff --binary -- . > "$RUNNER_TEMP/rustfmt.patch"
          test -s "$RUNNER_TEMP/rustfmt.patch"

      - name: Upload hosted rustfmt patch
        if: ${{ failure() && steps.rustfmt-check.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rustfmt-${{ runner.os }}-${{ github.sha }}
          path: ${{ runner.temp }}/rustfmt.patch
          if-no-files-found: error
          retention-days: 1

      - name: cargo clippy
        if: inputs.mode == 'full'
        working-directory: cmux-tui
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Prepare startup containment fixture
        shell: bash
        run: |
          set -euo pipefail
          fixture_parent="/tmp/cbt-${GITHUB_RUN_ID: -8}-$GITHUB_RUN_ATTEMPT-${{ matrix.os }}"
          mkdir -p "$fixture_parent" "$RUNNER_TEMP/startup-containment"
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            backend="macos-seatbelt"
          else
            backend="linux-bwrap"
          fi
          {
            printf 'CMUX_BENCH_TEST_FIXTURE_PARENT=%s\n' "$fixture_parent"
            printf 'CMUX_BENCH_TEST_BACKEND=%s\n' "$backend"
            printf 'CMUX_BENCH_TEST_TARGET=%s\n' "$RUNNER_TEMP/startup-containment"
          } >> "$GITHUB_ENV"

      - name: Prepare macOS per-launch containment policy
        id: macos-policy
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          test -x /usr/bin/sandbox-exec
          sudo -n true
          tail="${GITHUB_RUN_ID: -6}${GITHUB_RUN_ATTEMPT: -2}"
          prefix="cmxb$tail"
          group="cmxg$tail"
          if dscl . -list /Users | awk -v prefix="$prefix" 'index($1, prefix) == 1 { found = 1 } END { exit !found }'; then
            echo "a current-run per-launch benchmark account already exists" >&2
            exit 1
          fi
          if dscl . -read "/Groups/$group" >/dev/null 2>&1; then
            echo "the current-run macOS benchmark group already exists" >&2
            exit 1
          fi
          gid="$(dscl . -list /Groups PrimaryGroupID | awk 'BEGIN { max = 55000 } { if ($2 > max) max = $2 } END { print max + 1 }')"
          sudo -n dscl . -create "/Groups/$group"
          {
            printf 'prefix=%s\n' "$prefix"
            printf 'group=%s\n' "$group"
          } >> "$GITHUB_OUTPUT"
          sudo -n dscl . -create "/Groups/$group" PrimaryGroupID "$gid"
          profile="$RUNNER_TEMP/startup-containment/macos.sb"
          {
            echo '(version 1)'
            echo '(deny default)'
            echo '(allow process*)'
            echo '(allow sysctl-read)'
            echo '(allow mach-lookup)'
            echo '(allow ipc-posix*)'
            echo '(allow file-read*)'
            echo '(allow file-map-executable)'
            echo '(allow file-write* (regex #"^/dev/(null|tty.*|ttys.*)$"))'
            echo '(allow file-write* (subpath (param "CMUX_FIXTURE_ROOT")))'
            echo '(allow network* (local unix-socket (subpath (param "CMUX_FIXTURE_ROOT"))) (remote unix-socket (subpath (param "CMUX_FIXTURE_ROOT"))))'
          } > "$profile"
          {
            printf 'CMUX_BENCH_MACOS_PROFILE=%s\n' "$profile"
            printf 'CMUX_BENCH_MACOS_ACCOUNT_PREFIX=%s\n' "$prefix"
            printf 'CMUX_BENCH_MACOS_UID_BASE=200000\n'
            printf 'CMUX_BENCH_MACOS_GROUP=%s\n' "$group"
            printf 'CMUX_BENCH_MACOS_GID=%s\n' "$gid"
          } >> "$GITHUB_ENV"

      - name: Build and prove trusted startup supervisor
        id: startup-containment-preflight
        shell: bash
        working-directory: cmux-tui
        run: |
          set -euo pipefail
          supervisor="$CMUX_BENCH_TEST_TARGET/release/examples/startup_benchmark_supervisor"
          preflight="$CMUX_BENCH_TEST_TARGET/release/examples/startup_benchmark_preflight"
          evidence="$RUNNER_TEMP/startup-containment/preflight.json"
          CARGO_TARGET_DIR="$CMUX_BENCH_TEST_TARGET" cargo build -p cmux-tui \
            --example startup_benchmark_supervisor \
            --example startup_benchmark_preflight \
            --release --locked
          run_preflight() {
            local output
            output="$1"
            "$preflight" \
              --supervisor "$supervisor" \
              --fixture-parent "$CMUX_BENCH_TEST_FIXTURE_PARENT" \
              --output "$output" \
              --backend "$CMUX_BENCH_TEST_BACKEND"
          }
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            unprivileged_evidence="$RUNNER_TEMP/startup-containment/preflight-unprivileged.json"
            if run_preflight "$unprivileged_evidence"; then
              mv "$unprivileged_evidence" "$evidence"
            else
              rm -f "$unprivileged_evidence" "$evidence"
              tail="${GITHUB_RUN_ID: -8}${GITHUB_RUN_ATTEMPT}"
              user="cmt$tail"
              group="$user"
              if getent passwd "$user" >/dev/null || getent group "$group" >/dev/null; then
                echo "Linux containment identity already exists: $user" >&2
                exit 1
              fi
              sudo -n groupadd --system "$group"
              printf 'linux_group=%s\n' "$group" >> "$GITHUB_OUTPUT"
              sudo -n useradd --system --gid "$group" --no-create-home \
                --home-dir /nonexistent --shell /usr/sbin/nologin "$user"
              printf 'linux_user=%s\n' "$user" >> "$GITHUB_OUTPUT"
              sandbox_uid="$(id -u "$user")"
              sandbox_gid="$(id -g "$user")"
              sudo -n chgrp "$sandbox_gid" "$CMUX_BENCH_TEST_FIXTURE_PARENT"
              sudo -n chmod 0710 "$CMUX_BENCH_TEST_FIXTURE_PARENT"
              export CMUX_BENCH_LINUX_SUDO=1
              export CMUX_BENCH_LINUX_UID="$sandbox_uid"
              export CMUX_BENCH_LINUX_GID="$sandbox_gid"
              {
                printf 'CMUX_BENCH_LINUX_SUDO=1\n'
                printf 'CMUX_BENCH_LINUX_UID=%s\n' "$sandbox_uid"
                printf 'CMUX_BENCH_LINUX_GID=%s\n' "$sandbox_gid"
                printf 'CMUX_BENCH_LINUX_USER=%s\n' "$user"
                printf 'CMUX_BENCH_LINUX_GROUP=%s\n' "$group"
              } >> "$GITHUB_ENV"
              run_preflight "$evidence"
            fi
          else
            run_preflight "$evidence"
          fi
          test -s "$evidence"
          printf 'CMUX_BENCH_TEST_SUPERVISOR=%s\n' "$supervisor" >> "$GITHUB_ENV"

      - name: Upload startup containment failure checkpoint
        if: ${{ failure() && steps.startup-containment-preflight.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: startup-containment-failure-${{ runner.os }}-${{ inputs.commit }}
          path: |
            ${{ runner.temp }}/startup-containment/*-bootstrap-failure.json
            ${{ runner.temp }}/startup-containment/*-bootstrap-hang.json
            ${{ runner.temp }}/startup-containment/*-bootstrap-hang.dmp
          if-no-files-found: warn
          retention-days: 7

      - name: focused Linux journal process-fence test
        if: runner.os == 'Linux'
        working-directory: cmux-tui
        run: >-
          cargo test -p cmux-tui-core --lib
          journal_hooks::tests::unix_hook_tree_kills_a_descendant_that_created_a_new_session
          -- --exact

      - name: focused macOS journal process-fence tests
        if: runner.os == 'macOS'
        working-directory: cmux-tui
        run: cargo test -p cmux-tui-core --lib unix_process_scope::tests::mac_process_scope_

      - name: focused journal writer shutdown test
        working-directory: cmux-tui
        run: >-
          cargo test -p cmux-tui-core --lib
          journal_ingress::tests::shutdown_returns_when_an_admitted_commit_stays_blocked
          -- --exact

      - name: focused final journal ownership tests
        working-directory: cmux-tui
        run: |
          cargo test -p cmux-tui-core --lib \
            journal_ingress::tests::shutdown_closes_admission_while_a_terminal_producer_waits_for_space \
            -- --exact
          cargo test -p cmux-tui-core --lib \
            journal_checkpoint::tests::replaying_an_old_producer_put_keeps_the_current_validator \
            -- --exact
          cargo test -p cmux-tui-core --test browser_runtime \
            socket_browser_attach_streams_frames_input_and_cell_pixels \
            -- --exact

      - name: cargo test
        working-directory: cmux-tui
        env:
          MODE: ${{ inputs.mode }}
          TEST_FILTER: ${{ inputs.test_filter }}
        shell: bash
        run: |
          if [[ "$MODE" == "full" ]]; then
            cargo test --workspace --exclude cmux-tui-core --locked
            mkdir -p target
            cargo test -p cmux-tui-core --locked --no-run --message-format=json \
              > target/cmux-tui-core-test-binaries.jsonl
            python3 ../.github/scripts/run-cmux-tui-core-tests-isolated.py \
              target/cmux-tui-core-test-binaries.jsonl \
              crates/cmux-tui-core
            cargo test -p cmux-tui-core --doc --locked
            exit 0
          fi
          cargo test --workspace --locked "$TEST_FILTER" -- --list \
            | tee "$RUNNER_TEMP/cmux-tui-focused-tests.txt"
          if ! grep -Eq ': test$' "$RUNNER_TEMP/cmux-tui-focused-tests.txt"; then
            echo "::error::test_filter '$TEST_FILTER' selected no Rust tests" >&2
            exit 1
          fi
          cargo test --workspace --locked "$TEST_FILTER"

      - name: crossterm parser tests
        if: inputs.mode == 'full'
        working-directory: cmux-tui
        run: cargo test --manifest-path vendor/crossterm/Cargo.toml --lib

      - name: TUI smoke test (scripted pty)
        if: inputs.mode == 'full'
        working-directory: cmux-tui
        run: |
          cargo build -p cmux-tui
          python3 scripts/smoke-tui.py

      - name: Detach/reattach smoke test
        if: inputs.mode == 'full'
        working-directory: cmux-tui
        run: python3 scripts/smoke-attach.py

      - name: Remove residual macOS startup containment accounts
        if: always() && runner.os == 'macOS'
        shell: bash
        env:
          OWNED_MACOS_ACCOUNT_PREFIX: ${{ steps.macos-policy.outputs.prefix }}
          OWNED_MACOS_GROUP: ${{ steps.macos-policy.outputs.group }}
        run: |
          set -euo pipefail
          prefix="$OWNED_MACOS_ACCOUNT_PREFIX"
          group="$OWNED_MACOS_GROUP"
          if [[ -z "$prefix" || -z "$group" ]]; then
            exit 0
          fi
          accounts="$(dscl . -list /Users | awk -v prefix="$prefix" 'index($1, prefix) == 1 { print $1 }')"
          for user in $accounts; do
            python3 - "$user" <<'PY'
          import select
          import subprocess
          import sys
          import time

          user = sys.argv[1]
          listed = subprocess.run(["pgrep", "-u", user], capture_output=True, text=True)
          pids = {int(value) for value in listed.stdout.split()}
          queue = select.kqueue()
          pending = set()
          for pid in pids:
              try:
                  queue.control(
                      [select.kevent(pid, filter=select.KQ_FILTER_PROC,
                                     flags=select.KQ_EV_ADD | select.KQ_EV_ONESHOT,
                                     fflags=select.KQ_NOTE_EXIT)],
                      0,
                      0,
                  )
                  pending.add(pid)
              except ProcessLookupError:
                  pass
          subprocess.run(["sudo", "-n", "pkill", "-KILL", "-u", user], check=False)
          deadline = time.monotonic() + 30
          while pending:
              remaining = deadline - time.monotonic()
              if remaining <= 0:
                  raise SystemExit(f"process-exit deadline expired for {sorted(pending)}")
              events = queue.control(None, len(pending), remaining)
              if not events:
                  raise SystemExit(f"process-exit deadline expired for {sorted(pending)}")
              pending.difference_update(event.ident for event in events)
          final = subprocess.run(["pgrep", "-u", user], capture_output=True, text=True)
          if final.returncode == 0:
              raise SystemExit(f"a process survived startup containment cleanup: {final.stdout.strip()}")
          PY
            sudo -n dscl . -delete "/Users/$user"
          done
          if dscl . -read "/Groups/$group" >/dev/null 2>&1; then
            sudo -n dscl . -delete "/Groups/$group"
          fi
          if dscl . -list /Users | awk -v prefix="$prefix" 'index($1, prefix) == 1 { found = 1 } END { exit !found }'; then
            echo "a current-run per-launch macOS containment account remains" >&2
            exit 1
          fi
          if dscl . -read "/Groups/$group" >/dev/null 2>&1; then
            echo "the current-run macOS containment group remains" >&2
            exit 1
          fi

      - name: Remove Linux startup containment account
        if: always() && runner.os == 'Linux'
        shell: bash
        env:
          OWNED_LINUX_USER: ${{ steps.startup-containment-preflight.outputs.linux_user }}
          OWNED_LINUX_GROUP: ${{ steps.startup-containment-preflight.outputs.linux_group }}
        run: |
          set -euo pipefail
          user="$OWNED_LINUX_USER"
          group="$OWNED_LINUX_GROUP"
          if [[ -z "$user" && -z "$group" ]]; then
            exit 0
          fi
          containment_failed=0
          if [[ -n "$user" ]] && getent passwd "$user" >/dev/null; then
            mapfile -t remaining < <(pgrep -u "$user" || true)
            if (( ${#remaining[@]} != 0 )); then
              containment_failed=1
              sudo -n kill -KILL "${remaining[@]}"
              python3 - "${remaining[@]}" <<'PY'
          import os
          import select
          import sys
          import time

          poller = select.poll()
          descriptors = {}
          for value in sys.argv[1:]:
              pid = int(value)
              try:
                  descriptor = os.pidfd_open(pid)
              except ProcessLookupError:
                  continue
              descriptors[descriptor] = pid
              poller.register(descriptor, select.POLLIN)
          deadline = time.monotonic() + 30
          while descriptors:
              remaining = deadline - time.monotonic()
              if remaining <= 0:
                  raise SystemExit(f"process-exit deadline expired for {sorted(descriptors.values())}")
              events = poller.poll(max(1, int(remaining * 1000)))
              if not events:
                  raise SystemExit(f"process-exit deadline expired for {sorted(descriptors.values())}")
              for descriptor, _ in events:
                  poller.unregister(descriptor)
                  os.close(descriptor)
                  descriptors.pop(descriptor)
          PY
              echo "Linux containment processes survived the sandbox: ${remaining[*]}" >&2
            fi
            if pgrep -u "$user" >/dev/null; then
              echo "a Linux containment process survived cleanup" >&2
              exit 1
            fi
            sudo -n userdel "$user"
          fi
          if [[ -n "$group" ]] && getent group "$group" >/dev/null; then
            sudo -n groupdel "$group"
          fi
          if { [[ -n "$user" ]] && getent passwd "$user" >/dev/null; } \
            || { [[ -n "$group" ]] && getent group "$group" >/dev/null; }; then
            echo "Linux containment identity removal was incomplete" >&2
            exit 1
          fi
          if (( containment_failed != 0 )); then
            exit 1
          fi

  startup-containment-windows:
    name: startup containment (windows-gnu)
    needs: validate-inputs
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ inputs.commit }}

      - name: Require exact checkout
        env:
          EXACT_COMMIT: ${{ inputs.commit }}
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$EXACT_COMMIT"

      - name: Init ghostty submodule
        shell: bash
        run: git submodule update --init --depth 1 ghostty

      - name: Resolve exact Zig version
        id: windows-zig-version
        shell: bash
        run: |
          set -euo pipefail
          version="$(./scripts/ghostty-zig-version.sh .)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Install exact Zig
        uses: mlugg/setup-zig@8d6198c65fb0feaa111df26e6b467fea8345e46f # v2.0.5
        with:
          version: ${{ steps.windows-zig-version.outputs.version }}

      - name: Set up pinned Rust
        uses: ./.github/actions/setup-cmux-tui-rust

      - name: Install maintained GNU target
        shell: bash
        run: |
          set -euo pipefail
          toolchain="$(cd cmux-tui && rustup show active-toolchain | awk '{print $1}')"
          rustup target add --toolchain "$toolchain" x86_64-pc-windows-gnu
          printf '%s\n' 'C:\msys64\mingw64\bin' >> "$GITHUB_PATH"
          printf 'CMUX_BENCH_TEST_TARGET=%s\n' "$RUNNER_TEMP/startup-containment" >> "$GITHUB_ENV"
          printf 'CMUX_BENCH_TEST_FIXTURE_PARENT=%s\n' "$RUNNER_TEMP/cbt" >> "$GITHUB_ENV"

      - name: Prepare Windows containment account and firewall rule
        id: windows-account
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tail = $env:GITHUB_RUN_ID.Substring([Math]::Max(0, $env:GITHUB_RUN_ID.Length - 8))
          $user = "cmt$tail$env:GITHUB_RUN_ATTEMPT"
          $rule = "cmux-test-$tail-$env:GITHUB_RUN_ATTEMPT"
          if (Get-LocalUser -Name $user -ErrorAction SilentlyContinue) { throw "containment account exists" }
          if (Get-NetFirewallRule -Name "$rule-*" -ErrorAction SilentlyContinue) { throw "containment firewall rule exists" }
          $password = "$(New-Guid)Aa1!"
          Write-Output "::add-mask::$password"
          $secure = ConvertTo-SecureString $password -AsPlainText -Force
          New-LocalUser -Name $user -Password $secure -PasswordNeverExpires -UserMayNotChangePassword | Out-Null
          "username=$user" | Add-Content -Encoding utf8 $env:GITHUB_OUTPUT
          "password=$password" | Add-Content -Encoding utf8 $env:GITHUB_OUTPUT
          Add-LocalGroupMember -SID 'S-1-5-32-545' -Member $user
          $sid = (Get-LocalUser -Name $user).SID.Value
          "sid=$sid" | Add-Content -Encoding utf8 $env:GITHUB_OUTPUT
          $quotaRight = "SeIncreaseQuotaPrivilege"
          "quota_right=$quotaRight" | Add-Content -Encoding utf8 $env:GITHUB_OUTPUT
          & "$env:GITHUB_WORKSPACE/cmux-tui/scripts/windows-account-right.ps1" `
            -Operation Add -Sid $sid -Right $quotaRight
          $localUser = "D:(A;;CC;;;$sid)"
          New-NetFirewallRule -Name "$rule-out" -DisplayName "$rule outbound" -Direction Outbound -Action Block -Profile Any -LocalUser $localUser | Out-Null
          "outbound_rule=$rule-out" | Add-Content -Encoding utf8 $env:GITHUB_OUTPUT
          New-NetFirewallRule -Name "$rule-in" -DisplayName "$rule inbound" -Direction Inbound -Action Block -Profile Any -LocalUser $localUser | Out-Null
          "inbound_rule=$rule-in" | Add-Content -Encoding utf8 $env:GITHUB_OUTPUT

      - name: Build native MSVC startup bootstrap
        working-directory: cmux-tui
        shell: pwsh
        env:
          CMUX_BENCH_WINDOWS_USER: ${{ steps.windows-account.outputs.username }}
        run: |
          $ErrorActionPreference = "Stop"
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path -LiteralPath $vswhere -PathType Leaf)) {
            throw "vswhere.exe is unavailable"
          }
          $installation = (& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath).Trim()
          if (-not $installation) { throw "MSVC x64 build tools are unavailable" }
          Import-Module (Join-Path $installation "Common7\Tools\Microsoft.VisualStudio.DevShell.dll")
          Enter-VsDevShell -VsInstallPath $installation -SkipAutomaticLocation -DevCmdArguments "-arch=x64 -host_arch=x64"
          $source = Join-Path $PWD "crates\cmux-startup-bootstrap\native\windows_bootstrap.c"
          $targetRoot = Join-Path $env:CMUX_BENCH_TEST_TARGET "msvc"
          $outDir = Join-Path $targetRoot "x86_64-pc-windows-msvc\release"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          $bootstrap = Join-Path $outDir "cmux-startup-bootstrap.exe"
          $object = Join-Path $outDir "cmux-startup-bootstrap.obj"
          & cl.exe /nologo /O2 /Oi /W4 /WX /GS /guard:cf /utf-8 /Zl `
            /DUNICODE /D_UNICODE /D_WIN32_WINNT=0x0A00 /TC $source `
            "/Fo$object" "/Fe$bootstrap" `
            /link /ENTRY:bootstrap_entry /NODEFAULTLIB /INCREMENTAL:NO `
            /SUBSYSTEM:WINDOWS /DYNAMICBASE /NXCOMPAT /HIGHENTROPYVA /GUARD:CF `
            /OPT:REF /OPT:ICF kernel32.lib advapi32.lib bcrypt.lib `
            libcmt.lib libvcruntime.lib
          if ($LASTEXITCODE -ne 0) { throw "native MSVC startup bootstrap build failed" }
          if (-not (Test-Path -LiteralPath $bootstrap -PathType Leaf)) {
            throw "native MSVC startup bootstrap is missing"
          }
          Remove-Item -LiteralPath $object -Force
          $accountSid = (Get-LocalUser $env:CMUX_BENCH_WINDOWS_USER).Sid.Value
          $runnerSid = [Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          & icacls.exe $outDir /inheritance:r /grant:r `
            "*S-1-5-18:(OI)(CI)(F)" "*S-1-5-32-544:(OI)(CI)(F)" `
            "*${runnerSid}:(OI)(CI)(F)" "*${accountSid}:(RX)"
          if ($LASTEXITCODE -ne 0) { throw "trusted bootstrap directory ACL failed" }
          & icacls.exe $bootstrap /inheritance:r /grant:r `
            "*S-1-5-18:(F)" "*S-1-5-32-544:(F)" `
            "*${runnerSid}:(F)" "*${accountSid}:(RX)"
          if ($LASTEXITCODE -ne 0) { throw "trusted bootstrap file ACL failed" }
          $sha256 = (Get-FileHash -LiteralPath $bootstrap -Algorithm SHA256).Hash.ToLowerInvariant()
          $dumpbin = Get-Command dumpbin.exe -ErrorAction Stop
          $imports = @(& $dumpbin.Source /DEPENDENTS $bootstrap | ForEach-Object {
            if ($_ -match '^\s+([A-Za-z0-9._-]+\.dll)\s*$') { $Matches[1] }
          } | Sort-Object -Unique)
          if ($LASTEXITCODE -ne 0 -or $imports.Count -eq 0) {
            throw "minimal MSVC startup bootstrap import audit failed"
          }
          foreach ($dll in $imports) {
            $apiSet = $dll -match '^(?i:(api|ext)-[a-z0-9-]+-l[0-9]+-[0-9]+-[0-9]+\.dll)$'
            $physical = $dll.ToLowerInvariant()
            if (-not $apiSet -and $physical -notin @("advapi32.dll", "bcrypt.dll", "kernel32.dll")) {
              throw "bootstrap dependency is not approved: $dll"
            }
            if (-not $apiSet -and -not (Test-Path -LiteralPath (Join-Path $env:WINDIR "System32\$dll") -PathType Leaf)) {
              throw "approved bootstrap dependency is not a System32 DLL: $dll"
            }
            if (Test-Path -LiteralPath (Join-Path (Split-Path $bootstrap) $dll)) {
              throw "bootstrap has a local DLL dependency override: $dll"
            }
          }
          $imports -join ',' | Write-Output
          "CMUX_BENCH_TEST_WINDOWS_BOOTSTRAP=$bootstrap" | Add-Content -Encoding utf8 $env:GITHUB_ENV
          "CMUX_BENCH_TEST_WINDOWS_BOOTSTRAP_SHA256=$sha256" | Add-Content -Encoding utf8 $env:GITHUB_ENV

      - name: Build and prove restricted-token startup supervisor
        id: windows-startup-containment-preflight
        working-directory: cmux-tui
        shell: bash
        env:
          CMUX_BENCH_WINDOWS_USER: ${{ steps.windows-account.outputs.username }}
          CMUX_BENCH_WINDOWS_PASSWORD: ${{ steps.windows-account.outputs.password }}
        run: |
          set -euo pipefail
          mkdir -p "$CMUX_BENCH_TEST_FIXTURE_PARENT" "$CMUX_BENCH_TEST_TARGET"
          CARGO_TARGET_DIR="$CMUX_BENCH_TEST_TARGET" cargo build -p cmux-tui \
            --example startup_benchmark_supervisor \
            --example startup_benchmark_preflight \
            --release --locked --target x86_64-pc-windows-gnu
          release="$CMUX_BENCH_TEST_TARGET/x86_64-pc-windows-gnu/release/examples"
          supervisor="$release/startup_benchmark_supervisor.exe"
          preflight="$release/startup_benchmark_preflight.exe"
          evidence="$RUNNER_TEMP/startup-containment/preflight.json"
          appcontainer_evidence="$RUNNER_TEMP/startup-containment/windows-appcontainer-feasibility.json"
          test -f "$CMUX_BENCH_TEST_WINDOWS_BOOTSTRAP"
          "$preflight" \
            --appcontainer-feasibility \
            --fixture-parent "$CMUX_BENCH_TEST_FIXTURE_PARENT" \
            --output "$appcontainer_evidence"
          test -s "$appcontainer_evidence"
          if "$preflight" \
              --supervisor "$supervisor" \
              --windows-bootstrap-binary "$CMUX_BENCH_TEST_WINDOWS_BOOTSTRAP" \
              --windows-bootstrap-sha256 "$CMUX_BENCH_TEST_WINDOWS_BOOTSTRAP_SHA256" \
              --fixture-parent "$CMUX_BENCH_TEST_FIXTURE_PARENT" \
              --output "$evidence" \
              --backend windows-restricted-token-job; then
            printf 'claim_status=verified\n' >> "$GITHUB_OUTPUT"
          else
            preflight_status=$?
            if [[ "$preflight_status" -ne 78 ]]; then
              echo "Windows startup containment preflight failed with exit $preflight_status" >&2
              exit "$preflight_status"
            fi
            printf 'claim_status=unverified\n' >> "$GITHUB_OUTPUT"
            printf '%s\n' 'trusted Windows preflight could not observe all required native security signals' \
              > "$RUNNER_TEMP/startup-containment/windows-preflight-unverified.txt"
            printf '%s\n' '{"schema_version":1,"status":"skipped","claim":"windows-startup-containment","reason":"trusted Windows preflight could not observe all required native security signals"}' \
              > "$RUNNER_TEMP/startup-containment/windows-preflight-claim.json"
            printf '%s\n' 'Windows startup containment claim skipped: required native security signals were unavailable.' \
              >> "$GITHUB_STEP_SUMMARY"
          fi
          test -s "$evidence"
          printf 'CMUX_BENCH_TEST_SUPERVISOR=%s\n' "$supervisor" >> "$GITHUB_ENV"

      - name: Upload startup containment failure checkpoint
        if: ${{ failure() && steps.windows-startup-containment-preflight.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: startup-containment-failure-${{ runner.os }}-${{ inputs.commit }}
          path: |
            ${{ runner.temp }}/startup-containment/*-bootstrap-failure.json
            ${{ runner.temp }}/startup-containment/*-bootstrap-hang.json
            ${{ runner.temp }}/startup-containment/*-bootstrap-hang.dmp
            ${{ runner.temp }}/startup-containment/windows-appcontainer-feasibility-failure.json
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Windows AppContainer feasibility evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-appcontainer-feasibility-${{ inputs.commit }}
          path: |
            ${{ runner.temp }}/startup-containment/windows-appcontainer-feasibility.json
            ${{ runner.temp }}/startup-containment/windows-appcontainer-feasibility-failure.json
            ${{ runner.temp }}/startup-containment/windows-preflight-unverified.txt
            ${{ runner.temp }}/startup-containment/windows-preflight-claim.json
          if-no-files-found: warn
          retention-days: 7

      - name: Run release startup harness gate
        if: steps.windows-startup-containment-preflight.outputs.claim_status != 'unverified'
        working-directory: cmux-tui
        shell: bash
        env:
          CMUX_BENCH_WINDOWS_USER: ${{ steps.windows-account.outputs.username }}
          CMUX_BENCH_WINDOWS_PASSWORD: ${{ steps.windows-account.outputs.password }}
        run: |
          set -euo pipefail
          args=(
            cargo test -p cmux-tui --example startup_benchmark
            --release --locked --target x86_64-pc-windows-gnu
          )
          test_list="$RUNNER_TEMP/windows-startup-harness-tests.txt"
          CARGO_TARGET_DIR="$CMUX_BENCH_TEST_TARGET" \
            "${args[@]}" -- --list --format terse | tee "$test_list"
          selected_count="$(grep -Ec ': test$' "$test_list" || true)"
          if [[ "$selected_count" -eq 0 ]]; then
            echo "::error::trusted startup harness selected zero tests" >&2
            exit 1
          fi
          printf 'Windows startup harness tests: %s\n' "$selected_count" \
            >> "$GITHUB_STEP_SUMMARY"
          CARGO_TARGET_DIR="$CMUX_BENCH_TEST_TARGET" "${args[@]}"

      - name: Remove Windows containment account and firewall rule
        if: always()
        shell: pwsh
        env:
          WINDOWS_CONTAINMENT_USER: ${{ steps.windows-account.outputs.username }}
          WINDOWS_CONTAINMENT_SID: ${{ steps.windows-account.outputs.sid }}
          WINDOWS_CONTAINMENT_QUOTA_RIGHT: ${{ steps.windows-account.outputs.quota_right }}
          WINDOWS_CONTAINMENT_OUTBOUND_RULE: ${{ steps.windows-account.outputs.outbound_rule }}
          WINDOWS_CONTAINMENT_INBOUND_RULE: ${{ steps.windows-account.outputs.inbound_rule }}
        run: |
          $ErrorActionPreference = "Stop"
          $user = $env:WINDOWS_CONTAINMENT_USER
          $rules = @($env:WINDOWS_CONTAINMENT_OUTBOUND_RULE, $env:WINDOWS_CONTAINMENT_INBOUND_RULE) |
            Where-Object { $_ }
          $sid = if ($env:WINDOWS_CONTAINMENT_SID) { $env:WINDOWS_CONTAINMENT_SID } elseif ($user -and (Get-LocalUser -Name $user -ErrorAction SilentlyContinue)) { (Get-LocalUser -Name $user).SID.Value } else { "" }
          $quotaRight = $env:WINDOWS_CONTAINMENT_QUOTA_RIGHT
          if (-not $user -and $rules.Count -eq 0 -and -not $sid -and -not $quotaRight) { exit 0 }
          function Get-OwnedProcess {
            @(Get-CimInstance Win32_Process | ForEach-Object {
              $owner = Invoke-CimMethod -InputObject $_ -MethodName GetOwner -ErrorAction SilentlyContinue
              if ($owner.ReturnValue -eq 0 -and $owner.User -eq $user -and $owner.Domain -eq $env:COMPUTERNAME) { $_ }
            })
          }
          if ($user -and (Get-LocalUser -Name $user -ErrorAction SilentlyContinue)) {
            $owned = @(Get-OwnedProcess)
            if ($owned.Count -ne 0) {
              $ids = @($owned.ProcessId)
              Stop-Process -Id $ids -Force
              Wait-Process -Id $ids -Timeout 30 -ErrorAction SilentlyContinue
            }
            if (@(Get-OwnedProcess).Count -ne 0) { throw "a process survived Windows containment cleanup" }
          }
          foreach ($rule in $rules) {
            Get-NetFirewallRule -Name $rule -ErrorAction SilentlyContinue | Remove-NetFirewallRule
          }
          if ($sid) {
            $profiles = @(Get-CimInstance Win32_UserProfile | Where-Object { $_.SID -eq $sid })
            if (@($profiles | Where-Object { $_.Loaded }).Count -ne 0) { throw "the Windows containment profile is still loaded" }
            $profiles | Remove-CimInstance
            if (@(Get-CimInstance Win32_UserProfile | Where-Object { $_.SID -eq $sid }).Count -ne 0) { throw "the Windows containment profile remains" }
          }
          if ($sid -and $quotaRight) {
            & "$env:GITHUB_WORKSPACE/cmux-tui/scripts/windows-account-right.ps1" `
              -Operation Remove -Sid $sid -Right $quotaRight
          }
          if ($user -and (Get-LocalUser -Name $user -ErrorAction SilentlyContinue)) { Remove-LocalUser -Name $user }
          foreach ($rule in $rules) {
            if (Get-NetFirewallRule -Name $rule -ErrorAction SilentlyContinue) { throw "containment firewall rule remains: $rule" }
          }
          if ($user -and (Get-LocalUser -Name $user -ErrorAction SilentlyContinue)) { throw "containment account remains" }

  bindings-e2e:
    needs: validate-inputs
    if: inputs.mode == 'full'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ inputs.commit }}

      - name: Require exact checkout
        env:
          EXACT_COMMIT: ${{ inputs.commit }}
        run: test "$(git rev-parse HEAD)" = "$EXACT_COMMIT"

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22.14.0"
          cache: npm
          cache-dependency-path: cmux-tui/bindings/typescript/package-lock.json

      - name: Install TypeScript binding dependencies
        working-directory: cmux-tui/bindings/typescript
        run: npm ci --no-audit --no-fund

      - name: Init ghostty submodule
        run: git submodule update --init --depth 1 ghostty

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev pkg-config

      - name: Install zig
        run: ./scripts/install-zig-ci.sh

      - name: Set up pinned Rust
        uses: ./.github/actions/setup-cmux-tui-rust

      - name: Java version
        run: |
          echo "JAVA_HOME_17_X64=$JAVA_HOME_17_X64"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
          export PATH="$JAVA_HOME_17_X64/bin:$PATH"
          java -version
          javac -version

      - name: Build cmux-tui server
        working-directory: cmux-tui
        run: cargo build -p cmux-tui

      - name: Resolve Zig SDK version
        id: zig-sdk-version
        shell: bash
        run: |
          version="$(
            sed -nE 's/^[[:space:]]*\.minimum_zig_version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' \
              cmux-tui/bindings/zig/build.zig.zon | head -1
          )"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid Zig SDK version: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install Zig for SDK conformance
        env:
          ZIG_REQUIRED: ${{ steps.zig-sdk-version.outputs.version }}
          ZIG_FORCE_LOCAL_INSTALL: "1"
        run: ./scripts/install-zig-ci.sh

      - name: Install TypeScript adapter build tools
        working-directory: cmux-tui/bindings/typescript
        run: npm ci --no-audit --no-fund

      - name: Python conformance fixtures
        run: |
          test "$("$CMUX_ZIG" version)" = "${{ steps.zig-sdk-version.outputs.version }}"
          python3 cmux-tui/bindings/conformance/runner.py

      - name: Binding e2e
        run: |
          test "$("$CMUX_ZIG" version)" = "${{ steps.zig-sdk-version.outputs.version }}"
          bash cmux-tui/bindings/conformance/e2e.sh --require python,typescript,rust,go,java

  build-artifacts:
    name: release-path dogfood artifacts
    needs: validate-inputs
    permissions:
      contents: read
    uses: ./.github/workflows/cmux-tui-build-package.yml
    with:
      version: 0.0.0-nightly.19700101.0
      pypi_version: 0.0.0.dev197001010
      package_npm: ${{ inputs.mode == 'full' }}
      package_pypi: ${{ inputs.mode == 'full' }}
      include_windows: ${{ inputs.mode == 'full' }}
      target_set: ${{ inputs.mode == 'full' && 'all' || 'macos-arm64' }}
      build_cloudflare_relay: false
      verify_linux_arm64: ${{ inputs.mode == 'full' }}
      macos_runner: blacksmith-6vcpu-macos-15
      linux_runner: blacksmith-4vcpu-ubuntu-2404
      windows_runner: windows-latest
      checkout_ref: ${{ inputs.commit }}

  hosted-verification:
    name: ${{ inputs.mode == 'full' && 'hosted verification' || 'focused hosted verification' }}
    if: always()
    needs:
      - validate-inputs
      - web-frontend
      - valgrind-leak-check
      - test
      - startup-containment-windows
      - bindings-e2e
      - build-artifacts
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    env:
      MODE: ${{ inputs.mode }}
      VALIDATE_RESULT: ${{ needs.validate-inputs.result }}
      WEB_RESULT: ${{ needs.web-frontend.result }}
      VALGRIND_RESULT: ${{ needs.valgrind-leak-check.result }}
      TEST_RESULT: ${{ needs.test.result }}
      WINDOWS_CONTAINMENT_RESULT: ${{ needs.startup-containment-windows.result }}
      BINDINGS_RESULT: ${{ needs.bindings-e2e.result }}
      ARTIFACT_RESULT: ${{ needs.build-artifacts.result }}
    steps:
      - name: Require selected verification jobs
        shell: bash
        run: |
          require_success() {
            local name="$1"
            local result="$2"
            if [[ "$result" != "success" ]]; then
              echo "::error::$name finished with result '$result'" >&2
              exit 1
            fi
          }

          require_success "input validation" "$VALIDATE_RESULT"
          require_success "Rust tests" "$TEST_RESULT"
          require_success "Windows startup containment" "$WINDOWS_CONTAINMENT_RESULT"
          require_success "dogfood artifact build" "$ARTIFACT_RESULT"
