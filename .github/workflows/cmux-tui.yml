name: cmux-tui

on:
  # Temporarily manual-only beginning 2026-07-13 to pause automatic CI.
  workflow_dispatch:

concurrency:
  group: cmux-tui-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: "1.95.0"

jobs:
  web-frontend:
    runs-on: ${{ vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22.14.0"
          cache: npm
          cache-dependency-path: |
            cmux-tui/bindings/typescript/package-lock.json
            cmux-tui/frontends/web/package-lock.json

      - name: Build TypeScript SDK
        working-directory: cmux-tui/bindings/typescript
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Build and test web frontend
        working-directory: cmux-tui/frontends/web
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npm test

  valgrind-leak-check:
    runs-on: ${{ vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Verify Rust workflow toolchain
        run: python3 tests/test_tui_workflow_toolchain.py

      - name: Init ghostty submodule
        run: git submodule update --init --depth 1 ghostty

      - name: Install valgrind
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind

      - name: Install zig
        run: ./scripts/install-zig-ci.sh

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
          rustc --version

      - name: Build test binaries
        working-directory: cmux-tui
        env:
          # Force libghostty-vt's zig build onto a baseline CPU target so its
          # SIMD codegen stays within what valgrind's instruction emulation
          # supports (see crates/ghostty-vt-sys/build.rs).
          CMUX_GHOSTTY_VT_ZIG_CPU: baseline
        run: |
          mkdir -p target
          cargo test --workspace --locked --no-run --message-format=json > target/cargo-test-binaries.jsonl
          python3 <<'PY'
          import json
          import sys

          seen = set()
          with open("target/cargo-test-binaries.jsonl", "r", encoding="utf-8") as messages:
              with open("target/valgrind-test-binaries.txt", "w", encoding="utf-8") as output:
                  for line in messages:
                      try:
                          message = json.loads(line)
                      except json.JSONDecodeError:
                          continue
                      if not message.get("profile", {}).get("test"):
                          continue
                      executable = message.get("executable")
                      if not executable or executable in seen:
                          continue
                      seen.add(executable)
                      print(executable, file=output)

          if not seen:
              raise SystemExit("cargo did not report any test binaries")
          print(f"Collected {len(seen)} test binaries", file=sys.stderr)
          PY

      - name: Run test binaries under valgrind
        working-directory: cmux-tui
        env:
          # Valgrind's ~30x slowdown breaks the 50ms ws-latency budget on an
          # otherwise-correct build; the guarded regression (events serialized
          # behind a 100ms read poll) inflates far past this bound anyway.
          CMUX_TEST_WS_LATENCY_BUDGET_MS: "2000"
          # Process-exit and PTY-reader tests also use bounded polling. Keep
          # their normal deadlines strict while allowing for instrumentation.
          CMUX_TEST_TIMEOUT_SCALE: "8"
        run: |
          pidfd_probe=
          while IFS= read -r bin; do
            case "${bin##*/}" in
              cmux_tui_core-*)
                pidfd_probe="$bin"
                break
                ;;
            esac
          done < target/valgrind-test-binaries.txt
          test -n "$pidfd_probe"
          probe_test=process_session::tests::successful_preflight_survives_a_transient_initializer_failure
          "$pidfd_probe" --exact "$probe_test" >/dev/null
          valgrind_pidfd_supported=true
          if ! valgrind \
            --tool=none \
            --quiet \
            --trace-children=yes \
            --error-exitcode=1 \
            -- "$pidfd_probe" --exact "$probe_test" >/dev/null 2>&1; then
            valgrind_pidfd_supported=false
            echo "Valgrind cannot emulate pidfd_send_signal; native Linux CI covers process-owning tests"
          fi

          declare -A seen_skip_scopes=()
          while IFS= read -r bin; do
            [ -n "$bin" ] || continue
            test_args=()
            if [ "$valgrind_pidfd_supported" = false ]; then
              test_list="$("$bin" --list 2>/dev/null || true)"
              test_scope=
              case "$test_list" in
                *"process_session::tests::"*) test_scope=cmux_tui_core ;;
                *"app::tests::"*) test_scope=cmux_tui ;;
                *"attach_stream_orders_resize_between_output_frames: test"*) test_scope=pty ;;
                *"websocket_streams_subscribe_and_attach_and_survives_unclean_disconnect: test"*)
                  test_scope=websocket_transport
                  ;;
              esac
              if [ -n "$test_scope" ]; then
                seen_skip_scopes["$test_scope"]=1
                while read -r skip_scope test_name; do
                  [ -n "$skip_scope" ] || continue
                  [[ "$skip_scope" == \#* ]] && continue
                  [ "$skip_scope" = "$test_scope" ] || continue
                  if ! grep -Fqx -- "$test_name: test" <<<"$test_list"; then
                    echo "Unknown $test_scope Valgrind skip: $test_name" >&2
                    exit 1
                  fi
                  test_args+=(--skip "$test_name")
                done < dist/valgrind-pidfd-skips.txt
                echo "Applying ${#test_args[@]} named pidfd skip arguments for $bin"
              fi
            fi
            echo "Running valgrind for $bin"
            if ! valgrind \
              --error-exitcode=1 \
              --leak-check=full \
              --show-leak-kinds=definite \
              --errors-for-leak-kinds=definite \
              --track-origins=yes \
              -- "$bin" "${test_args[@]}"; then
              echo "Valgrind failed for $bin" >&2
              exit 1
            fi
          done < target/valgrind-test-binaries.txt
          if [ "$valgrind_pidfd_supported" = false ]; then
            while read -r skip_scope; do
              if [ -z "${seen_skip_scopes[$skip_scope]:-}" ]; then
                echo "No test binary matched Valgrind skip scope: $skip_scope" >&2
                exit 1
              fi
            done < <(awk '!/^#/ && NF { print $1 }' dist/valgrind-pidfd-skips.txt | sort -u)
          fi

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os == 'macos' && (vars.MACOS_RUNNER_15 || 'blacksmith-6vcpu-macos-15') || 'ubuntu-latest' }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [macos, linux]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Init ghostty submodule
        run: git submodule update --init --depth 1 ghostty

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev pkg-config

      - name: Install zig
        run: ./scripts/install-zig-ci.sh

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy,rustfmt
          rustup default "$RUST_TOOLCHAIN"
          rustc --version

      - name: cargo fmt
        working-directory: cmux-tui
        run: cargo fmt --check

      - name: cargo clippy
        working-directory: cmux-tui
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: cargo test
        working-directory: cmux-tui
        shell: bash
        run: |
          args=()
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            args+=(-- --test-threads=1)
          fi
          cargo test --workspace --locked "${args[@]}"

      - name: crossterm parser tests
        working-directory: cmux-tui
        run: cargo test --manifest-path vendor/crossterm/Cargo.toml --lib

      - name: TUI smoke test (scripted pty)
        working-directory: cmux-tui
        run: |
          cargo build -p cmux-tui
          python3 scripts/smoke-tui.py

      - name: Detach/reattach smoke test
        working-directory: cmux-tui
        run: python3 scripts/smoke-attach.py

  bindings-e2e:
    runs-on: ${{ vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Init ghostty submodule
        run: git submodule update --init --depth 1 ghostty

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev pkg-config

      - name: Install zig
        run: ./scripts/install-zig-ci.sh

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
          rustc --version

      - name: Java version
        run: |
          echo "JAVA_HOME_17_X64=$JAVA_HOME_17_X64"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
          export PATH="$JAVA_HOME_17_X64/bin:$PATH"
          java -version
          javac -version

      - name: Build cmux-tui server
        working-directory: cmux-tui
        run: cargo build -p cmux-tui

      - name: Python conformance fixtures
        run: python3 cmux-tui/bindings/conformance/runner.py

      - name: Binding e2e
        run: bash cmux-tui/bindings/conformance/e2e.sh --require python,typescript,rust,go,java

  windows-experimental:
    name: windows experimental (x86_64-gnu)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Init ghostty submodule
        run: git submodule update --init --depth 1 ghostty

      - name: Resolve Ghostty Zig version
        id: ghostty-zig-version
        shell: bash
        run: |
          version="$(bash ./scripts/ghostty-zig-version.sh)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install zig
        uses: mlugg/setup-zig@8d6198c65fb0feaa111df26e6b467fea8345e46f # v2.0.5
        with:
          version: ${{ steps.ghostty-zig-version.outputs.version }}

      - name: Install Rust toolchain
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
          rustc --version

      - name: Install Rust GNU target
        shell: bash
        run: |
          rustup target add --toolchain "$RUST_TOOLCHAIN" x86_64-pc-windows-gnu
          printf '%s\n' 'C:\msys64\mingw64\bin' >> "$GITHUB_PATH"

      - name: Build libghostty-vt for Windows GNU
        shell: bash
        working-directory: ghostty
        run: |
          zig build -Demit-lib-vt=true -Demit-xcframework=false -Doptimize=ReleaseFast -Dtarget=x86_64-windows-gnu --prefix "$RUNNER_TEMP/ghostty-vt-win-gnu"
          zig ar t "$RUNNER_TEMP/ghostty-vt-win-gnu/lib/ghostty-vt-static.lib" | head

      - name: cargo build cmux-tui for Windows GNU
        working-directory: cmux-tui
        run: cargo build -p cmux-tui --target x86_64-pc-windows-gnu --locked
