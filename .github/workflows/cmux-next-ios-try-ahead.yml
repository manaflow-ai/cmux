name: cmux Dev try build (ahead)

# iPhone DEV, built ahead (cmuxterm-hq docs/design/ios-dev-channels.md, "Built ahead"): every head of a
# same-repository pull request into feat-cmux-next that touches the iPhone app asks the build fleet for its cmux Dev
# device app, the same step `cmux-next-ios/scripts/try.sh` asks for (scripts/ci/cmux-next-ios-sim.sh try, sent as
# `shots try=dev`, artifact artifacts/ios-sim/evidence.zip, step key cnx-ios-try-try-<sha12>). The controller
# answers a later submit under that key with this step (ci_step.go existingStep), so `try.sh N`, or the Try a pull
# request picker in cmux Dev (Settings > Developer), only downloads, signs and installs it.
#
# Lowest priority (--background): it queues after every foreground step and a foreground step may take its host,
# never ahead of a nightly. A newer head cancels this run (concurrency), and a cancelled run cancels its fleet step
# (ci-client.py: SIGINT cancels the step), so only the newest head builds. Advisory: never a required check.
# Two checks: "cmux Dev try build (fleet)" asks the fleet; "cmux Dev try build (ahead)" is the verdict the picker
# reads (try.sh list): success only when the fleet built this head, failure when its device app did not build.
# The verdict is the fleet step's own state (cmux-ci status): done is built, failed with exit 1 is a device app that
# does not build. Anything else (no client, a refused submit, the queue, a host that could not set up: exit 3) leaves
# the fleet job green with a warning and the verdict skipped, so the picker shows "none" and try.sh builds it on tap.
# (2026-11-26: on 73891d81 the step failed at setup on ultra2 with exit 3 and the one check said built ahead; on
# a0a4b2d1 a refused submit, client exit 1, was read as a device app that did not build.)

on:
  pull_request:
    branches: [feat-cmux-next]
    # Only events that bring a new head. A second run at the same head (ready_for_review, reopened) cancelled the
    # first one's fleet step through the concurrency group, and the controller then refuses the key, which names the
    # cancelled step ("409: step_key already names a different step"; a0a4b2d1, 2026-11-26).
    types: [opened, synchronize]
    paths:
      - "cmux-next-ios/**"
      - "Packages/iOS/**"
      - "Packages/Shared/**"
      - "scripts/ci/cmux-next-ios-sim.sh"
      - ".github/workflows/cmux-next-ios-try-ahead.yml"
      - "!**/*.md"

permissions: {}

concurrency:
  group: cmux-next-ios-try-ahead-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-ahead:
    name: cmux Dev try build (fleet)
    # The fleet takes same-repository pull requests only; with the gateway unset nothing runs.
    if: ${{ github.repository_owner == 'manaflow-ai' && github.event.pull_request.head.repo.full_name == github.repository && vars.CI_EVAL_STEP_GATEWAY != '' }}
    runs-on: ${{ vars.CI_EVAL_STEP_GATEWAY }}
    # The step's run is about 3.3 min (cached FFI) or 6.7 min (cold); its wait at the lowest class can pass this bound
    # (2026-11-23: over 5 h behind 116 simulator jobs). A job that times out leaves the step queued under its key, so
    # it still builds, and a later try.sh attaches to it.
    timeout-minutes: 300
    permissions: {}
    outputs:
      outcome: ${{ steps.fleet.outputs.outcome }}
    env:
      # Detached (the default): the job submits the step, hands its verdict to the controller as the check run
      # VERDICT_CHECK on the head (cmux-ci run --report-check --detach, report_check.go: success, failure, or neutral
      # for no verdict) and ends in about a minute, so no gateway runner waits out the simulator queue. On 2026-11-27
      # 20-23Z this job held a Mac mini gateway runner for a median 36.5 min (56 jobs, 2.25k runner-min in 4 h,
      # timing feed) waiting on a step whose run is 3.3-6.7 min; nightly-pr-build.yml made the same cut (#62619).
      # Leo: "de facto, im asking for 99% fewer minutes of ci time, period." CI_IOS_TRY_AHEAD_DETACH=0 waits here
      # as before, and so does a client without --detach the controller's client cannot replace.
      DETACH: ${{ vars.CI_IOS_TRY_AHEAD_DETACH || '1' }}
      # try.sh list reads this name as well as the verdict job's (TRY_VERDICT_CHECK there).
      VERDICT_CHECK: cmux Dev try build (ahead, fleet verdict)
      CONTROLLER: ${{ vars.CMUX_FLEET_CONTROLLER }}
    steps:
      - name: Ask the fleet for this head's cmux Dev device app
        id: fleet
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.action == 'synchronize' && github.event.before || '' }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail
          client="${CMUX_CI_CLIENT:-$HOME/.local/bin/cmux-ci}"
          if ! [[ -x "$client" ]]; then
            echo "::warning title=cmux Dev ahead::$client is not installed on runner $RUNNER_NAME; not built ahead (try.sh builds it on request)"
            exit 0
          fi
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::bad head $HEAD_SHA"; exit 1; }
          # A gateway Mac's own cmux-ci can predate --detach (nightly-pr-build.yml, 11-27 job 140732035533); then use
          # the controller's client, sha256-checked against its manifest as .github/actions/fleet-client does.
          usage="$("$client" run --help 2>/dev/null || true)"
          if [[ "$DETACH" != 0 && "$usage" != *--detach* && -n "$CONTROLLER" ]]; then
            fresh="$RUNNER_TEMP/fleet-client"
            mkdir -p "$fresh"
            if curl -fsS -m 30 "$CONTROLLER/v1/client/manifest" -o "$fresh/manifest.json" &&
              /usr/bin/python3 -I - "$fresh" "$CONTROLLER" <<'PY'
          import hashlib, json, sys, urllib.request
          from pathlib import Path
          root, controller = Path(sys.argv[1]), sys.argv[2]
          for name, digest in json.loads((root / "manifest.json").read_text())["files"].items():
              if "/" in name or name.startswith("."):
                  raise SystemExit(f"bad client file name {name!r}")
              data = urllib.request.urlopen(f"{controller}/v1/client/files/{name}", timeout=30).read()
              if hashlib.sha256(data).hexdigest() != digest:
                  raise SystemExit(f"{name}: sha256 mismatch")
              (root / name).write_bytes(data)
          PY
            then
              printf '#!/bin/sh\nexec /usr/bin/python3 -I %q "$@"\n' "$fresh/ci-client.py" > "$fresh/cmux-ci"
              chmod +x "$fresh/cmux-ci"
              fresh_usage="$("$fresh/cmux-ci" run --help 2>/dev/null || true)"
              if [[ "$fresh_usage" == *--detach* ]]; then
                echo "::notice title=cmux Dev ahead::runner $RUNNER_NAME's cmux-ci lacks --detach; using the controller's client"
                client="$fresh/cmux-ci"
                usage="$fresh_usage"
              fi
            else
              echo "::warning title=cmux Dev ahead::could not fetch the controller's client; waiting on the local one"
            fi
          fi
          detach=()
          if [[ "$DETACH" != 0 && "$usage" == *--detach* ]]; then
            detach=(--report-check "$VERDICT_CHECK" --repo "$GITHUB_REPOSITORY" --detach)
            # A detached job ends at once, so the concurrency group no longer cancels the older head's step: cancel
            # it here, by its key (best effort; a step already building or done is left alone by the controller).
            if [[ "$BEFORE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              "$client" cancel --request-key "cnx-ios-try-try-${BEFORE_SHA:0:12}" \
                --reason "cmux Dev ahead: PR #$PR has a newer head ${HEAD_SHA:0:12}" >/dev/null 2>&1 || true
            fi
          fi
          # The same arguments and key as try.sh's try_fleet, so its submit attaches to this step.
          log="$RUNNER_TEMP/try-ahead.log"
          status=0
          "$client" run --class simulator --script scripts/ci/cmux-next-ios-sim.sh --ref "$HEAD_SHA" \
            --artifact artifacts/ios-sim/evidence.zip --no-supersede --key "cnx-ios-try-try-${HEAD_SHA:0:12}" \
            --arg shots --arg try=dev --background --timeout 3600 ${detach[@]+"${detach[@]}"} 2>&1 | tee "$log" || status=$?
          if [[ "$status" == 0 ]] && grep -q ') detached; check run' "$log"; then
            echo "::notice title=cmux Dev ahead::the fleet posts the verdict as check run \"$VERDICT_CHECK\" on ${HEAD_SHA:0:12}"
            {
              echo "### cmux Dev for PR #$PR at ${HEAD_SHA:0:12}"
              echo
              echo "Submitted to the fleet; the check run \"$VERDICT_CHECK\" carries the verdict. Then: \`cmux-next-ios/scripts/try.sh $PR\`."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # The runner's shell is bash -e: with pipefail a log that names no step (controller unreachable, 17:25Z on
          # a121379b) failed the grep and ended the job red before any verdict.
          step="$(grep -o -E 'step [0-9a-f]{24}' "$log" | head -1 | cut -d' ' -f2)" || step=""
          # The verdict is the fleet step's own state, never the client's exit code alone: exit 1 is also the
          # client's answer to a refused submit (HTTP 409 on a0a4b2d1), which built nothing and failed nothing.
          state="" code=""
          if [[ -n "$step" ]]; then
            read -r state code < <("$client" status "$step" 2>/dev/null | /usr/bin/python3 -I -c \
              'import json,sys; d=json.load(sys.stdin); print(d.get("state") or "-", d.get("exit_code") if d.get("exit_code") is not None else "-")' \
              2>/dev/null) || true
          fi
          echo "fleet step ${step:-none}: state ${state:-unread}, exit ${code:-unread}; client exit $status"
          {
            echo "### cmux Dev for PR #$PR at ${HEAD_SHA:0:12}"
            echo
            if [[ "$state" == done ]]; then
              echo "Built ahead (fleet step \`${step:-?}\`). On a Mac with the phone attached: \`cmux-next-ios/scripts/try.sh $PR\`, or Settings > Developer > Try a pull request in cmux Dev."
            else
              echo "No build ahead (step state ${state:-unread}, client exit $status, step \`${step:-none}\`); try.sh builds it on request."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$state" == done ]]; then echo "outcome=built" >> "$GITHUB_OUTPUT"; exit 0; fi
          if grep -q 'is not the reviewed version' "$log"; then
            echo "::warning title=cmux Dev ahead::this head changes scripts/ci/cmux-next-ios-sim.sh, which the fleet runs only once reviewed on feat-cmux-next; not built ahead"
            exit 0
          fi
          # The step ran and its script exited 1: the device app does not build at this head.
          if [[ "$state" == failed && "$code" == 1 ]]; then
            echo "outcome=failed" >> "$GITHUB_OUTPUT"
            echo "::error title=cmux Dev ahead::the cmux Dev device app did not build at ${HEAD_SHA:0:12} (fleet step $step; cmux-ci status $step)"
            exit 1
          fi
          echo "::warning title=cmux Dev ahead::no verdict from the fleet (step ${step:-none}, state ${state:-unread}, exit ${code:-unread}, client exit $status); try.sh builds it on request"
          exit 0

  verdict:
    name: cmux Dev try build (ahead)
    needs: build-ahead
    if: ${{ !cancelled() && (needs.build-ahead.outputs.outcome == 'built' || needs.build-ahead.outputs.outcome == 'failed') }}
    # Not the gateway: its job-started hook admits only listed thin cmux-ci jobs (build-ahead here) and refused
    # this one at 7df749d8 (19:52Z), red after the device app built. The shared Linux label, as the other one-line jobs.
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || 'cmux-linux' }}
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Built ahead, or the device app failed to build
        env:
          OUTCOME: ${{ needs.build-ahead.outputs.outcome }}
        run: |
          echo "fleet outcome: $OUTCOME"
          [[ "$OUTCOME" == built ]]
