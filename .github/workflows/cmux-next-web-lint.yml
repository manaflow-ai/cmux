name: cmux-next web lint

# `web lint (fast)` on every feat-cmux-next push. It ran in cmux-next-web.yml until that workflow's web checks were
# coalesced to at most one run every 15 minutes (scripts/ci/web_coalesce.py): this check is cheap (about $7 a day)
# and its point is a red within minutes of the push that skipped the hook, so it keeps one run per push here. In its
# own workflow, a coalesced cmux-next web run that a newer push replaced runs no job at all and ends cancelled,
# which is how readers of base verdicts tell it apart (base_red_excuse.coalesced).
on:
  push:
    branches: [feat-cmux-next]
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: cmux-next-web-lint-${{ github.sha }}
  cancel-in-progress: false

jobs:
  # The pre-push hook's check (scripts/web_lint_prepush.py) as a fast job of its
  # own: a skipped hook (--no-verify, CMUX_WEB_LINT_SKIP_REASON, a clone without
  # scripts/install-git-hooks.sh, or a push that changed the check's own code)
  # shows a red here within minutes, not after the long web build and test jobs.
  # Same script as the hook, so the two cannot drift.
  web-lint:
    name: web lint (fast)
    # Blacksmith 4 vCPU, never GitHub-hosted (Leo, 2026-10-27: "just put it on blacksmith").
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.LINUX_RUNNER || fromJSON(vars.RUNNER_POOLS).linux_4 }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"

      - name: Cache Bun package cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.bun/install/cache
          key: bun-web-lint-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('webviews/bun.lock', 'web/bun.lock', 'cmux-tui/frontends/web/bun.lock') }}

      # `vp check` runs on Node and needs ^22.18 or ^24.11; bun still installs.
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.22.1"

      - name: Hook tests
        run: python3 tests/test_web_lint_prepush.py

      # Lints what the push brought (event.before..sha). An unknown or unfetchable
      # base (a new branch, a force push, a dispatch) lints every package.
      - name: Web lint on the pushed range
        env:
          PUSH_BASE: ${{ github.event_name == 'push' && github.event.before || '' }}
        run: |
          set -euo pipefail
          if [ -n "$PUSH_BASE" ] && [ "$PUSH_BASE" != "0000000000000000000000000000000000000000" ] \
              && git fetch --no-tags --depth=1 origin "$PUSH_BASE"; then
            python3 scripts/web_lint_prepush.py --base "$PUSH_BASE" --head "$GITHUB_SHA" --timings
          else
            echo "::notice title=web lint::push base unknown; linting every package"
            python3 scripts/web_lint_prepush.py --all --base "$GITHUB_SHA" --head "$GITHUB_SHA" --timings
          fi
