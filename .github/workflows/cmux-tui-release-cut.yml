name: cmux-tui release cut

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version component to bump when version is not set"
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
      version:
        description: "Explicit X.Y.Z version override"
        required: false
        type: string

permissions: {}

concurrency:
  group: tui-release-cut-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag:
    name: create release tag
    runs-on: ${{ vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    permissions:
      contents: write
      # actions: write lets this job dispatch the downstream build/publish
      # workflows: a tag pushed with the default GITHUB_TOKEN does NOT fire
      # other workflows' push triggers (GitHub suppresses token-created events),
      # so the release cut must dispatch them explicitly.
      actions: write
    steps:
      - name: Require main branch dispatch
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Refusing to cut a TUI release from $GITHUB_REF; dispatch this workflow on main." >&2
            exit 1
          fi

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Compute next TUI version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
          EXPLICIT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          git fetch --force --tags
          latest_tag="$(
            git tag --merged HEAD --list 'cmux-tui-v*' --sort=-v:refname |
              grep -E '^cmux-tui-v[0-9]+\.[0-9]+\.[0-9]+$' |
              head -n 1 || true
          )"
          if [[ -z "$latest_tag" ]]; then
            latest_version="0.0.0"
          else
            latest_version="${latest_tag#cmux-tui-v}"
          fi

          version_gt() {
            local lhs="$1"
            local rhs="$2"
            IFS=. read -r lhs_major lhs_minor lhs_patch <<<"$lhs"
            IFS=. read -r rhs_major rhs_minor rhs_patch <<<"$rhs"
            if (( lhs_major != rhs_major )); then
              (( lhs_major > rhs_major ))
              return
            fi
            if (( lhs_minor != rhs_minor )); then
              (( lhs_minor > rhs_minor ))
              return
            fi
            (( lhs_patch > rhs_patch ))
          }

          if [[ -n "$EXPLICIT_VERSION" ]]; then
            [[ "$EXPLICIT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
              echo "version must match X.Y.Z" >&2
              exit 1
            }
            next_version="$EXPLICIT_VERSION"
          else
            IFS=. read -r major minor patch <<<"$latest_version"
            case "$BUMP" in
              patch)
                patch=$((patch + 1))
                ;;
              minor)
                minor=$((minor + 1))
                patch=0
                ;;
              major)
                major=$((major + 1))
                minor=0
                patch=0
                ;;
              *)
                echo "unsupported bump: $BUMP" >&2
                exit 1
                ;;
            esac
            next_version="$major.$minor.$patch"
          fi

          tag="cmux-tui-v$next_version"
          tag_exists=false
          if existing_sha="$(git rev-parse -q --verify "refs/tags/$tag^{commit}" 2>/dev/null)"; then
            if [[ "$existing_sha" != "$GITHUB_SHA" ]]; then
              echo "tag already exists at $existing_sha, not release commit $GITHUB_SHA: $tag" >&2
              exit 1
            fi
            if [[ -z "$EXPLICIT_VERSION" ]]; then
              echo "tag $tag already exists at this commit; rerun with version=$next_version to recover the downstream dispatch" >&2
              exit 1
            fi
            echo "tag $tag already exists at this commit; reusing it without moving the tag"
            tag_exists=true
          elif ! version_gt "$next_version" "$latest_version"; then
            echo "next version $next_version must be greater than latest $latest_version" >&2
            exit 1
          fi
          {
            echo "version=$next_version"
            echo "tag=$tag"
            echo "tag_exists=$tag_exists"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### TUI release cut"
            echo
            echo "- Latest: $latest_version"
            if [[ "$tag_exists" == "true" ]]; then
              echo "- Reused existing tag: $tag"
            else
              echo "- New tag: $tag"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create annotated tag
        if: steps.version.outputs.tag_exists != 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "cmux TUI $VERSION"

      - name: Push tag
        if: steps.version.outputs.tag_exists != 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: git push origin "refs/tags/$TAG"

      - name: Dispatch release workflows
        # The tag push above was made with the default GITHUB_TOKEN, which
        # never triggers other workflows' tag-push events. Dispatch the
        # build/package workflow explicitly against the new tag. That workflow
        # builds and verifies every package once, then dispatches the top-level
        # registry workflows with its artifact run ID. The registry OIDC
        # identities therefore stay on their existing workflow files without
        # rebuilding the same binaries for each registry.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          gh workflow run cmux-tui-release.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$TAG" \
            -f version="$VERSION" \
            -f publish_npm=true \
            -f publish_pypi=true \
            -f confirm_tui_cmux=true
          {
            echo "- Release workflow dispatched/queued for $TAG at $GITHUB_SHA"
            echo "- GitHub accepted the dispatch request; downstream run visibility is eventually consistent"
            echo "- npm and PyPI will reuse that run's verified artifacts"
            echo "- Recovery is safe: rerun this workflow with version=$VERSION; the existing tag is reused, never moved"
          } >> "$GITHUB_STEP_SUMMARY"
