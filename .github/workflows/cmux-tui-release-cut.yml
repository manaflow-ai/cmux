name: cmux-tui release cut

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version component to bump when version is not set"
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
      version:
        description: "Explicit X.Y.Z version override"
        required: false
        type: string

permissions: {}

concurrency:
  group: tui-release-cut-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag:
    name: create release tag
    runs-on: ${{ vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 120
    permissions:
      contents: write
      # actions: write lets this job dispatch the downstream build/publish
      # workflows: a tag pushed with the default GITHUB_TOKEN does NOT fire
      # other workflows' push triggers (GitHub suppresses token-created events),
      # so the release cut must dispatch them explicitly.
      actions: write
    steps:
      - name: Require main branch dispatch
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Refusing to cut a TUI release from $GITHUB_REF; dispatch this workflow on main." >&2
            exit 1
          fi

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Require event SHA is current protected main
        run: bash .github/scripts/require-current-main.sh

      - name: Compute next TUI version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
          EXPLICIT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          git fetch --force --tags
          latest_tag="$(
            git tag --merged HEAD --list 'cmux-tui-v*' --sort=-v:refname |
              grep -E '^cmux-tui-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' |
              head -n 1 || true
          )"
          if [[ -z "$latest_tag" ]]; then
            latest_version="0.0.0"
          else
            latest_version="${latest_tag#cmux-tui-v}"
          fi

          version_gt() {
            local lhs="$1"
            local rhs="$2"
            IFS=. read -r lhs_major lhs_minor lhs_patch <<<"$lhs"
            IFS=. read -r rhs_major rhs_minor rhs_patch <<<"$rhs"
            if (( lhs_major != rhs_major )); then
              (( lhs_major > rhs_major ))
              return
            fi
            if (( lhs_minor != rhs_minor )); then
              (( lhs_minor > rhs_minor ))
              return
            fi
            (( lhs_patch > rhs_patch ))
          }

          if [[ -n "$EXPLICIT_VERSION" ]]; then
            [[ "$EXPLICIT_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
              echo "version must match X.Y.Z" >&2
              exit 1
            }
            next_version="$EXPLICIT_VERSION"
          else
            IFS=. read -r major minor patch <<<"$latest_version"
            case "$BUMP" in
              patch)
                patch=$((patch + 1))
                ;;
              minor)
                minor=$((minor + 1))
                patch=0
                ;;
              major)
                major=$((major + 1))
                minor=0
                patch=0
                ;;
              *)
                echo "unsupported bump: $BUMP" >&2
                exit 1
                ;;
            esac
            next_version="$major.$minor.$patch"
          fi

          if ! version_gt "$next_version" "$latest_version"; then
            echo "next version $next_version must be greater than latest $latest_version" >&2
            exit 1
          fi

          tag="cmux-tui-v$next_version"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "tag already exists: $tag" >&2
            exit 1
          fi
          {
            echo "version=$next_version"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### TUI release cut"
            echo
            echo "- Latest: $latest_version"
            echo "- New tag: $tag"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Revalidate protected main before tagging
        run: bash .github/scripts/require-current-main.sh

      - name: Snapshot release workflow runs before tagging
        id: release-dispatch-baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          workflow_runs_endpoint="repos/$GITHUB_REPOSITORY/actions/workflows/cmux-tui-release.yml/runs?event=workflow_dispatch&per_page=100"
          if ! before_run_id="$(
            gh api "$workflow_runs_endpoint" --jq '[.workflow_runs[]?.id | tonumber] | max // 0'
          )" || [[ ! "$before_run_id" =~ ^[0-9]+$ ]]; then
            echo "could not snapshot release workflow runs before tagging" >&2
            exit 1
          fi
          echo "before_run_id=$before_run_id" >> "$GITHUB_OUTPUT"

      - name: Create annotated tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "cmux TUI $VERSION"

      - name: Push tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          bash .github/scripts/require-current-main.sh
          git push origin "refs/tags/$TAG"

      - name: Dispatch release workflows
        # The tag push above was made with the default GITHUB_TOKEN, which
        # never triggers other workflows' tag-push events. Dispatch the
        # build/package workflow explicitly against the new tag. That workflow
        # builds and verifies every package once, then dispatches the top-level
        # registry workflows with its artifact run ID. The registry OIDC
        # identities therefore stay on their existing workflow files without
        # rebuilding the same binaries for each registry.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          BEFORE_RUN_ID: ${{ steps.release-dispatch-baseline.outputs.before_run_id }}
        run: |
          set -euo pipefail
          dispatch_started_at="$(date +%s)"
          if ! gh workflow run cmux-tui-release.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$TAG" \
            -f version="$VERSION" \
            -f publish_npm=true \
            -f publish_pypi=true \
            -f confirm_tui_cmux=true >/dev/null; then
            echo "release workflow dispatch failed" >&2
            exit 1
          fi
          if ! release_run_id="$(
            WAIT_TIMEOUT_SECONDS=5400 bash .github/scripts/resolve-workflow-run-id.sh \
              cmux-tui-release.yml "$TAG" "$GITHUB_SHA" \
              "$dispatch_started_at" "$BEFORE_RUN_ID"
          )"; then
            echo "release workflow dispatch succeeded but its run ID could not be resolved" >&2
            exit 1
          fi
          # BEGIN release-workflow-wait-contract
          release_result="$(
            WAIT_TIMEOUT_SECONDS=5400 bash .github/scripts/wait-for-workflow-run.sh \
              cmux-tui-release.yml "$TAG" "$GITHUB_SHA" \
              "$release_run_id"
          )" || {
            echo "release workflow did not complete successfully" >&2
            exit 1
          }
          IFS=$'\t' read -r release_run_id release_conclusion <<<"$release_result"
          {
            echo "- Build/package run: $release_run_id ($release_conclusion)"
            echo "- npm and PyPI will reuse that run's verified artifacts"
          } >> "$GITHUB_STEP_SUMMARY"
          # END release-workflow-wait-contract
