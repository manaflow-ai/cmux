name: CI web

on:
  workflow_call:
    # Base-side callers (post-merge batch, feat-cmux-next pushes) pass the R2 write secrets so base-comparison
    # logs go to R2: the GitHub cache is over its 10 GB cap and evicts them before pull requests read them.
    # Pull request callers pass none; they only read, which needs no credentials.
    secrets:
      CI_CACHE_R2_ACCESS_KEY_ID:
        required: false
      CI_CACHE_R2_SECRET_ACCESS_KEY:
        required: false
      CI_CACHE_R2_ACCOUNT_ID:
        required: false
    inputs:
      # ci.yml passes all three routes. The post-merge batch tier (cmux-next-post-merge.yml, suite `web`) passes only
      # sha and only, so these default to what cmux-next-web.yml passed on base pushes: every web check, no macOS.
      web:
        required: false
        type: string
        default: "true"
      macos:
        required: false
        type: string
        default: "false"
      agent_session_web:
        required: false
        type: string
        default: "true"
      # A push's event.before (cmux-next-web.yml): subareas route from the whole push, not
      # only its last commit. Empty on pull requests, which route from the merge commit.
      push_base:
        required: false
        type: string
        default: ""
      # The post-merge batch tier: the commit to test (empty: the caller's, as today) and the one job id a bisect
      # probe runs alone (empty: every job). A batch call runs every subarea and the full react-apps-check matrix,
      # and records the base's webview history as a feat-cmux-next push did.
      sha:
        required: false
        type: string
        default: ""
      only:
        required: false
        type: string
        default: ""
    outputs:
      # `true` when a type check here failed and fixit-compile found no machine fix (fixit_handoff.py signal): the
      # post-merge batch dispatches fixit-handoff.yml for its revert.
      fixit_nofix:
        value: ${{ (jobs.web-typecheck.outputs.fixit_nofix == 'true' || jobs.webviews-typecheck.outputs.fixit_nofix == 'true') && 'true' || '' }}
      fixit_check:
        value: ${{ jobs.webviews-typecheck.outputs.fixit_nofix == 'true' && 'webviews' || 'web' }}

permissions:
  contents: read

env:
  # Match the producer toolchain even when verifying an older merge-parent tree.
  CMUX_WEB_BUN_VERSION: "1.4.4"
  CMUX_WEB_NODE_VERSION: "24.22.1"
  # Style guards (lint, format, size, drift) warn everywhere but main and release tags, which stay strict (Leo
  # 2026-10-19, #22396). Keyed on the strict refs, not on feat-cmux-next, so a stacked pull request (base: another
  # lane branch) warns like its parent instead of failing on findings feat-cmux-next already has (#54185).
  # Steps read it as CMUX_NEXT_STYLE_GUARDS; tests/test_style_guards_level.py evaluates it.
  CMUX_NEXT_STYLE_GUARDS_LEVEL: ${{ (github.base_ref == 'main' || github.event.merge_group.base_ref == 'refs/heads/main' || (!github.base_ref && !github.event.merge_group && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')))) && 'fail' || 'warn' }}
  # 0 restores the webview test selection before 2026-11-22 (scripts/ci/webviews_affected.py NARROW): a deleted
  # source and a baseline a test reads run every shard again, and the two reviewed runtime loads are always-run again.
  CI_WEBVIEWS_NARROW_SELECTION: ${{ vars.CI_WEBVIEWS_NARROW_SELECTION || '1' }}
  # 0 runs every react-apps-check shard again for a pull request whose only every-shard input is this file or a
  # selection script; 1 runs shard 1 and two shards sampled from the head commit (scripts/ci/webviews_pr_shards.py).
  CI_WEBVIEWS_CI_EDIT_SAMPLE: ${{ vars.CI_WEBVIEWS_CI_EDIT_SAMPLE || '1' }}
  # 0 turns the push classes off (scripts/ci/webviews_pr_shards.py FULL, classify): the pick runs as it did before them.
  # 1: a pull request push is fast (docs or comments only: shard 1's checks, no test file), sampled (shard 1, the
  # touched tests, and two head-sampled shards where it would have run every shard) or full (every shard).
  CI_WEBVIEWS_PUSH_CLASSES: ${{ vars.CI_WEBVIEWS_PUSH_CLASSES || '1' }}
  # 0 lets apt's needrestart restart the runner's services after `playwright install --with-deps` again; 1 lists them
  # instead (scripts/ci/apt-no-service-restarts.sh): restarting cmux-git-mirror.service held 6 of 17 react-apps-check (1)
  # pull request jobs 900 s (2026-11-25).
  CI_APT_NO_SERVICE_RESTARTS: ${{ vars.CI_APT_NO_SERVICE_RESTARTS || '1' }}
  # Temporary REST budget attribution: one gh-call line per GitHub API call (scripts/ci/api_call_log/env.sh, fetched at a fixed commit when the checkout has no copy).
  BASH_ENV: '$({ w="${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh"; t="${RUNNER_TEMP:-/nonexistent}/api-call-log-src"; if [ -f "$w" ]; then echo "$w"; elif [ -n "${RUNNER_TEMP:-}" ]; then if [ ! -f "$t/env.sh" ] && [ ! -e "$t.tried" ] && { [ "${RUNNER_OS:-}" = Linux ] || [ "${RUNNER_OS:-}" = macOS ]; } && [ "$(date -u +%Y%m%d%H)" -lt 2026112300 ]; then : > "$t.tried"; mkdir -p "$t.part" && for x in env.sh gh sitecustomize.py isolated.py; do curl -fsSL --max-time 5 -o "$t.part/$x" "https://raw.githubusercontent.com/manaflow-ai/cmux/27647ffd3ae838c63be28ca3e5883dcd68c34518/scripts/ci/api_call_log/$x" || break; done; [ -s "$t.part/isolated.py" ] && mv "$t.part" "$t"; fi; if [ -f "$t/env.sh" ]; then echo "$t/env.sh"; else echo unset BASH_ENV > "$t.off.sh" && echo "$t.off.sh"; fi; fi; } 2>/dev/null)'

jobs:
  web-subarea-scope:
    if: ${{ inputs.web == 'true' || inputs.macos == 'true' }}
    # The webview suite's router (about 30 s of work): the Linux pool's live member on every attempt,
    # never GitHub-hosted Ubuntu (it left light jobs queued for hours, cmux#45735), never LINUX_RUNNER alone. On 2026-11-01 LINUX_RUNNER sat on a stalled
    # blacksmith-32vcpu-ubuntu-2404 and this job (124762739841) waited 50 minutes unassigned; on
    # 2026-11-04 the pool's blacksmith-4vcpu-ubuntu-2404 held it (126357110799) 10 minutes before the
    # pool reconciler marked that size dead. Either way every webview shard and the verdict waited.
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || 'cmux-linux' }}
    # 11: the shard pick and the picked shards' file list (webviews_pr_shards.py, each bounded at 150 s) run here too.
    timeout-minutes: 11
    # actions: read: a pull request's handoff below reads the base's webview test history (an artifact of its newest push).
    permissions:
      contents: read
      actions: read
    outputs:
      db: ${{ steps.scope.outputs.db }}
      diff_sidecar: ${{ steps.scope.outputs.diff_sidecar }}
      instant: ${{ steps.scope.outputs.instant }}
      production_build: ${{ steps.scope.outputs.production_build }}
      react_apps: ${{ steps.reuse.outputs.react_apps }}
      agent_pane: ${{ steps.reuse.outputs.agent_pane }}
      react_key: ${{ steps.reuse.outputs.react_key }}
      agent_key: ${{ steps.reuse.outputs.agent_key }}
      react_shards: ${{ steps.react-shards.outputs.matrix }}
      react_class: ${{ steps.react-shards.outputs.class }}
      react_fleet: ${{ steps.react-shards.outputs.fleet }}
      base_bundle_ref: ${{ steps.base-bundle-plan.outputs.ref }}
      base_bundle_same: ${{ steps.base-bundle-plan.outputs.same }}
      typecheck: ${{ steps.scope.outputs.typecheck }}
      unit_tests: ${{ steps.scope.outputs.unit_tests }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.sha || '' }}
          fetch-depth: 2
          persist-credentials: false

      # The push base is not in a depth-2 clone; fetch it alone (an unknown one runs everything). `all` runs every
      # subarea with nothing to fetch (web_subareas.EVERY_SUBAREA).
      - name: Fetch the push base
        if: ${{ inputs.push_base != '' && inputs.push_base != 'all' }}
        env:
          PUSH_BASE: ${{ inputs.push_base }}
        run: git fetch --no-recurse-submodules --no-tags --depth=1 origin "$PUSH_BASE" || echo "::warning title=web routing::push base $PUSH_BASE is not fetchable; every web subarea runs"

      # A post-merge batch call (inputs.sha set) runs every subarea, as a push base of `all` does.
      - name: Classify web subareas
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          WEB_SUBAREAS_BASE: ${{ inputs.sha != '' && 'all' || inputs.push_base }}
        run: python3 scripts/ci/web_subareas.py route

      # A pull request whose React inputs (this head's and its merge parent's, web_subareas.py green_key) match a head
      # whose react-apps-check, or agent pane check, already passed has nothing new to prove: the area is
      # routed off, exactly as for a pull request touching no React input. The passing run saves the marker (react-apps-check,
      # agent-pane-real-acpmux). Never on a push, a post-merge batch or a full-ci pull request. ci500k, Leo: "de facto,
      # im asking for 99% fewer minutes of ci time, period."
      - name: Look up a green marker for the React inputs
        id: react-green
        if: ${{ github.event_name == 'pull_request' && steps.scope.outputs.react_key != '' && !(contains(github.event.pull_request.labels.*.name, 'full-ci') && (github.event.pull_request.base.ref != 'feat-cmux-next' || (github.event.action == 'labeled' && github.event.label.name == 'full-ci') || (vars.CI_FULL_CI_ONE_SHOT || '1') == '0')) }}
        continue-on-error: true
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/react-green-marker
          key: webviews-react-green-${{ steps.scope.outputs.react_key }}
          lookup-only: true

      - name: Look up a green marker for the agent pane inputs
        id: agent-green
        if: ${{ github.event_name == 'pull_request' && steps.scope.outputs.agent_key != '' && !(contains(github.event.pull_request.labels.*.name, 'full-ci') && (github.event.pull_request.base.ref != 'feat-cmux-next' || (github.event.action == 'labeled' && github.event.label.name == 'full-ci') || (vars.CI_FULL_CI_ONE_SHOT || '1') == '0')) }}
        continue-on-error: true
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/agent-green-marker
          key: webviews-agent-green-${{ steps.scope.outputs.agent_key }}
          lookup-only: true

      - name: Route off an area whose inputs already passed
        id: reuse
        env:
          REACT_APPS: ${{ steps.scope.outputs.react_apps }}
          AGENT_PANE: ${{ steps.scope.outputs.agent_pane }}
          REACT_HIT: ${{ steps.react-green.outputs.cache-hit }}
          AGENT_HIT: ${{ steps.agent-green.outputs.cache-hit }}
          REACT_KEY: ${{ steps.scope.outputs.react_key }}
          AGENT_KEY: ${{ steps.scope.outputs.agent_key }}
        run: |
          [ "$REACT_HIT" = true ] && { echo "react-apps-check: the inputs already passed (key $REACT_KEY); skipped"; REACT_APPS=false; }
          [ "$AGENT_HIT" = true ] && { echo "agent pane: the inputs already passed (key $AGENT_KEY); skipped"; AGENT_PANE=false; }
          {
            echo "react_apps=$REACT_APPS"
            echo "agent_pane=$AGENT_PANE"
            echo "react_key=$REACT_KEY"
            echo "agent_key=$AGENT_KEY"
          } >> "$GITHUB_OUTPUT"

      # The webview test shards split their files by recorded duration
      # (scripts/ci/webviews_test_shards.py). One copy of the manifest for the
      # whole run: a shard that read the cache itself could get a newer
      # manifest than its siblings, split differently, and skip or repeat files.
      - name: Restore the webview test duration manifest
        if: ${{ steps.reuse.outputs.react_apps == 'true' }}
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/webviews-durations/manifest.json
          key: webviews-test-durations-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: webviews-test-durations-

      # The base's webview test history from the Actions cache (webviews-test-history saves it there beside its
      # artifact): no REST request. The artifact list below answered 403 on 25 of 33 sampled pull request runs
      # (2026-11-21 07:21-08:55Z, the repository's shared token quota), and each then retried every red file
      # alone: 17 of a shard's 51 min of tests. Unique keys a push, so the prefix restores the newest.
      - name: Restore the base's webview test history
        id: base-history-cache
        if: ${{ steps.reuse.outputs.react_apps == 'true' && github.event_name == 'pull_request' }}
        continue-on-error: true
        uses: ./.github/actions/cache-restore
        env:
          CI_CACHE_R2_PUBLIC_URL: https://ci-cache-next.cmux.com
        with:
          # R2, not the GitHub cache: that store is over its 10 GB cap and evicted this small entry before
          # pull requests read it, so their base comparison missed and every base red was charged to them.
          backend: r2
          path: .webviews-test-history-cache
          key: webviews-test-history-${{ github.base_ref }}-${{ github.run_id }}
          restore-keys: webviews-test-history-${{ github.base_ref }}-

      # A pull request's shards also get the names red on the base's newest recorded push (base-reds.json): a head
      # file whose every first-run red is one of them skips its alone retry (run-webviews-tests.sh,
      # CMUX_WEB_TEST_BASE_REDS) and react-apps-base-check judges it as before. Read once here for the whole run (the
      # cached history above, else the artifact's list and download, two requests), and best effort: without the file
      # every red file is retried.
      - name: Hand the duration manifest to the shards
        if: ${{ steps.reuse.outputs.react_apps == 'true' }}
        env:
          GITHUB_TOKEN: ${{ github.event_name == 'pull_request' && github.token || '' }}
          BASE_REF: ${{ github.base_ref }}
          HELD_RED_HOURS: ${{ vars.CMUX_WEB_TEST_HELD_RED_HOURS || '24' }}
        run: |
          manifest="$RUNNER_TEMP/webviews-durations/manifest.json"
          mkdir -p "$(dirname "$manifest")"
          [ -s "$manifest" ] || printf '{}\n' > "$manifest"
          echo "duration manifest: $(grep -c '": ' "$manifest" || true) files"
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            history="$RUNNER_TEMP/webviews-base-history.json"
            cached=.webviews-test-history-cache/history.json
            { if [ -s "$cached" ]; then cp "$cached" "$history" && echo "webview test history: the Actions cache's copy"
              else timeout 90 python3 scripts/ci/webviews_test_history.py fetch "$history" --repo "$GITHUB_REPOSITORY" --branch "$BASE_REF" --need-read; fi &&
              python3 scripts/ci/webviews_test_history.py known-reds "$history" --before "$(git log -1 --format=%ct HEAD^1)" \
                --out "$RUNNER_TEMP/webviews-durations/base-reds.json"; } ||
              { rm -f "$RUNNER_TEMP/webviews-durations/base-reds.json"; echo "the base's webview reds are unread: every red file is retried"; }
            # Files red on every base push for HELD_RED_HOURS or more are left to the batch runs (held-red-files): the
            # shards skip them, and a file the change edits still runs. Undo: the repository variable
            # CMUX_WEB_TEST_HELD_RED_HOURS=0.
            if [ -s "$history" ] && [ "${HELD_RED_HOURS:-0}" != 0 ]; then
              git diff --name-only HEAD^1 HEAD -- webviews/ 2>/dev/null | sed 's#^webviews/##' > "$RUNNER_TEMP/webviews-durations/changed" || :
              python3 scripts/ci/webviews_test_history.py held-red-files "$history" --before "$(git log -1 --format=%ct HEAD^1)" \
                --hours "$HELD_RED_HOURS" --changed "$RUNNER_TEMP/webviews-durations/changed" \
                --out "$RUNNER_TEMP/webviews-durations/held-reds" ||
                { rm -f "$RUNNER_TEMP/webviews-durations/held-reds"; echo "the held base reds are unread: every file runs"; }
            fi
          fi

      # The react-apps-check shards this run starts (webviews_pr_shards.py). Leo, 2026-11-21: "id rather we simply cut
      # shit now and revisit later." Over 11-13..19 shards 2 to 12 were 20.5% of pull request runner-minutes and never
      # caught a red no other check caught (cmuxterm-hq docs/ci/bottleneck-and-skip-candidates-2026-11-21.md). A pull
      # request runs shard 1 (the shard-independent checks) and each shard holding a test its change touches; a
      # build or runner input, the full-ci label, a push and a failed pick run all REACT_APPS_SHARDS. An edit to this
      # file or a selection script alone runs shard 1 and two sampled shards (the step summary names them and how to
      # run all). The pick reads the duration manifest above with the shards' own widths and head start, so it splits
      # as they will.
      # 8, not 12 (Leo, 2026-11-22: "if it's really so big then you guys need to be hurrying up and thinking more
      # innovatively"): every shard pays about 3.5 min of checkout, install, bundle build and engines plus a cold Vite
      # warm-up before its first test, so a full matrix at 12 cost about 9% more runner-minutes than at 8
      # (12 x 820 s against 8 x 1133 s) for about 5 min less wall time. A pull request's pick is shard 1 (with its
      # touched tests) either way, so the count moves only full-matrix runs (push, batch, full-ci, build input).
      # Push classes (Leo, 2026-11-22: "there must surely be some changes which can get the fast track
      # route. like a nexus card."): the summary names the push's class (fast, sampled, full), the rule that fired and
      # how to get a full run; `class` hands it to the shards (a fast push's shard 1 runs its checks and no test file).
      # On a fast or sampled push shard 1 runs its checks and only the touched tests in its share (--direct-out's
      # entry "1"), not its share of the closure: that share was about 37 of its 48 minutes (11-22).
      - name: Pick the react-apps-check shards
        id: react-shards
        if: ${{ steps.reuse.outputs.react_apps == 'true' }}
        env:
          # 12 again on 2026-11-27: run 45778691646's shard 1 (435 files, 65 failing first tries, on an 8 of 16 vCPU
          # runner: 4 files at a time, 2 dev server files) hit the 90 min job limit three times on a gallery-only pull
          # request while still progressing. 12 shards cut each shard's closure by a third (690 s of tests a shard at
          # 12 against about 1000 s at 8, runs 43338660731 to 43342364793); the split is timing-based, so the count is
          # the only knob. scripts/ci/react-apps-check-fleet.sh --count and tests/test_web_validation.py move with it.
          REACT_APPS_SHARDS: "12"
          FULL_CI: ${{ (contains(github.event.pull_request.labels.*.name, 'full-ci') && (github.event.pull_request.base.ref != 'feat-cmux-next' || (github.event.action == 'labeled' && github.event.label.name == 'full-ci') || (vars.CI_FULL_CI_ONE_SHOT || '1') == '0')) }}
          # Into feat-cmux-next a FULL path runs the sampled pick; its post-merge batch runs every shard
          # (webviews_pr_shards.py full_to_batch). CI_WEBVIEWS_FULL_TO_BATCH=0 runs every shard for it again.
          CI_WEBVIEWS_PR_BASE: ${{ github.base_ref }}
          CI_WEBVIEWS_FULL_TO_BATCH: ${{ vars.CI_WEBVIEWS_FULL_TO_BATCH || '1' }}
          CMUX_WEB_TEST_DURATIONS: ${{ runner.temp }}/webviews-durations/manifest.json
          CMUX_WEB_TEST_JOBS: "8"
          CMUX_WEB_TEST_DEV_JOBS: "4"
          CMUX_WEB_TEST_SHARD_HEAD_START: "1:120"
          # Where react-apps-check runs (scripts/ci/react_apps_fleet.py): a feat-cmux-next pull request whose pick
          # runs only touched tests runs it on the fleet (ci/steps.toml's react-apps-check, pr-pipeline.yml).
          CI_PR_BASE_REF: ${{ github.base_ref }}
          CI_FULL_CI: ${{ (contains(github.event.pull_request.labels.*.name, 'full-ci') && (github.event.pull_request.base.ref != 'feat-cmux-next' || (github.event.action == 'labeled' && github.event.label.name == 'full-ci') || (vars.CI_FULL_CI_ONE_SHOT || '1') == '0')) }}
          CI_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CI_REACT_APPS_FLEET: ${{ vars.CI_REACT_APPS_FLEET || '1' }}
          CI_REACT_APPS_FLEET_AUDIT: ${{ vars.CI_REACT_APPS_FLEET_AUDIT || '16' }}
        run: |
          picked=""
          class_file="$RUNNER_TEMP/webviews-durations/pr-shard-class"
          rm -f "$class_file"
          # A full-ci (land-tier) head into feat-cmux-next picks too: its post-merge batch runs every shard and
          # reverts a red. 30 days to 11-25: react-apps-check had 9 real catches in 148 runs; the batch keeps the
          # whole matrix after merge, so the land tier's 8-shard run bought no catch the pick and the batch missed.
          # CI_WEBVIEWS_FULL_TO_BATCH=0 runs every shard for a full-ci head again.
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && { [ "$FULL_CI" != true ] || { [ "$CI_WEBVIEWS_PR_BASE" = feat-cmux-next ] && [ "$CI_WEBVIEWS_FULL_TO_BATCH" != 0 ]; }; }; then
            picked="$(timeout 150 python3 scripts/ci/webviews_pr_shards.py --base HEAD^1 --head HEAD --count "$REACT_APPS_SHARDS" \
              --direct-out "$RUNNER_TEMP/webviews-durations/pr-shard-direct.json" --summary "$GITHUB_STEP_SUMMARY" \
              --class-out "$class_file")" || { picked=""; rm -f "$RUNNER_TEMP/webviews-durations/pr-shard-direct.json" "$class_file"; }
          fi
          if [ -z "$picked" ]; then
            case "$GITHUB_EVENT_NAME:$FULL_CI" in
              pull_request:true) why="the full-ci label" ;;
              pull_request:*) why="the pick failed or timed out" ;;
              *) why="a $GITHUB_EVENT_NAME run on the base (a push or the base batch)" ;;
            esac
            summary=/dev/null
            [ "$CI_WEBVIEWS_PUSH_CLASSES" = 0 ] || summary="$GITHUB_STEP_SUMMARY"
            picked="$(python3 scripts/ci/webviews_pr_shards.py --all --count "$REACT_APPS_SHARDS" --class-out "$class_file" \
              --full-why "$why" --summary "$summary")"
          fi
          echo "react-apps-check shards: $picked"
          echo "matrix=$picked" >> "$GITHUB_OUTPUT"
          echo "class=$(cat "$class_file" 2>/dev/null)" >> "$GITHUB_OUTPUT"
          fleet="$(python3 scripts/ci/react_apps_fleet.py decide --class "$(cat "$class_file" 2>/dev/null)" --matrix "$picked" \
            --direct "$RUNNER_TEMP/webviews-durations/pr-shard-direct.json" --routed)" || fleet=actions
          echo "fleet=$([ "$fleet" = fleet ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          # The files those shards run, for react-apps-base-early (RFD 0023 item 3): only when the pick ran fewer
          # than every shard; any failure leaves no list, and the early job keeps its whole affected list.
          rm -f "$RUNNER_TEMP/webviews-durations/pr-shard-files"
          shards="$(python3 -c 'import json,sys; m=json.loads(sys.argv[1]); print(",".join(str(e["shard"]) for e in m) if len(m) < int(sys.argv[2]) else "")' "$picked" "$REACT_APPS_SHARDS")" || shards=""
          if [ -n "$shards" ]; then
            timeout 150 python3 scripts/ci/webviews_pr_shards.py --base HEAD^1 --head HEAD --count "$REACT_APPS_SHARDS" --files-of "$shards" \
              --direct-in "$RUNNER_TEMP/webviews-durations/pr-shard-direct.json" > "$RUNNER_TEMP/webviews-durations/pr-shard-files.tmp" &&
              mv "$RUNNER_TEMP/webviews-durations/pr-shard-files.tmp" "$RUNNER_TEMP/webviews-durations/pr-shard-files" ||
              rm -f "$RUNNER_TEMP/webviews-durations/pr-shard-files.tmp"
          fi

      # Do not compile the base unless the early replay actually has files. Head/base remain distinct trees.
      - name: Plan the early base bundle
        id: base-bundle-plan
        if: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'full-ci') && steps.reuse.outputs.react_apps == 'true' }}
        env:
          REACT_APPS_CLASS: ${{ steps.react-shards.outputs.class }}
        run: |
          plan="$RUNNER_TEMP/base-bundle-plan"
          mkdir -p "$plan"
          cp scripts/ci/webviews_test_history.py "$plan/"
          only=()
          if [ "$REACT_APPS_CLASS" = sampled ] || [ "$REACT_APPS_CLASS" = fast ]; then
            (cd webviews && python3 ../scripts/ci/webviews_affected.py --base HEAD^1 --head HEAD) > "$plan/affected" || : > "$plan/affected"
            [ ! -s "$RUNNER_TEMP/webviews-durations/pr-shard-files" ] || cp "$RUNNER_TEMP/webviews-durations/pr-shard-files" "$plan/affected"
            [ ! -s "$plan/affected" ] || only=(--only "$plan/affected")
          fi
          head_key="$(python3 scripts/cmux-next/web-bundle-key.py . --source)"
          head="$(git rev-parse HEAD)"
          base="$(git rev-parse HEAD^1)"
          trap 'git checkout -q --detach "$head"' EXIT
          git checkout -q --detach "$base"
          python3 "$plan/webviews_test_history.py" early-files "$RUNNER_TEMP/webviews-durations/base-reds.json" \
            --shard 1 --shard-count 1 --durations "$RUNNER_TEMP/webviews-durations/manifest.json" \
            --root webviews "${only[@]}" > "$plan/files" || : > "$plan/files"
          if [ -s "$plan/files" ]; then
            echo "ref=$base" >> "$GITHUB_OUTPUT"
            base_key="$(python3 scripts/cmux-next/web-bundle-key.py . --source)"
            if [ "$head_key" = "$base_key" ]; then echo "same=true" >> "$GITHUB_OUTPUT"; fi
          fi

      - name: Upload the duration manifest
        if: ${{ steps.reuse.outputs.react_apps == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: webviews-test-durations
          # A re-run of the whole run uploads it again; the run's attempts share artifact names.
          overwrite: true
          path: |
            ${{ runner.temp }}/webviews-durations/manifest.json
            ${{ runner.temp }}/webviews-durations/base-reds.json
            ${{ runner.temp }}/webviews-durations/held-reds
            ${{ runner.temp }}/webviews-durations/pr-shard-files
            ${{ runner.temp }}/webviews-durations/pr-shard-direct.json
          if-no-files-found: error
          # A same-run handoff: the cache keeps the manifest between runs.
          retention-days: 1

  web-typecheck:
    needs: web-subarea-scope
    # A feat-cmux-next pull request runs this job's commands as the ci/steps.toml step `web-typecheck`
    # (pr-pipeline.yml); a push, dispatch, the post-merge batch and a pull request into any other base still run them
    # here. Web status counts the skip as fine only on such a pull request.
    if: ${{ inputs.web == 'true' && needs.web-subarea-scope.outputs.typecheck == 'true' && (inputs.only == '' || inputs.only == 'web-typecheck') && (github.event_name != 'pull_request' || github.base_ref != 'feat-cmux-next') }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || 'cmux-linux' }}
    # Matches the 10-minute siblings in this workflow.
    timeout-minutes: 10
    outputs:
      fixit_nofix: ${{ steps.fixit-nofix.outputs.nofix }}
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.sha || '' }}

      - name: Restore pinned Bun 1.4.4 from the CI cache bucket
        shell: bash
        continue-on-error: true
        run: bash "$GITHUB_WORKSPACE/scripts/ci/toolchain-r2.sh" restore bun 1.4.4 || true

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
          no-cache: ${{ !startsWith(github.workspace, '/home/runner/work/') || !(github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && github.event_name != 'merge_group' && contains(fromJSON('["refs/heads/main","refs/heads/feat-cmux-next","refs/heads/nightly-next"]'), github.ref)) }}

      # Why: docs/ci/cmux-next-workflow-notes/2026-11-26-bun-cache-warm.md (detector: tests/test_ci_bun_cache_warm.py).
      - name: Is this runner's own Bun package cache warm
        id: bun-warm
        timeout-minutes: 1
        shell: bash
        run: |
          d="${BUN_INSTALL_CACHE_DIR:-$HOME/.bun/install/cache}"
          if [[ "${RESTORE_ON_WARM:-}" != 1 && -n "$(find "$d" -mindepth 1 -maxdepth 1 -print -quit 2>/dev/null)" ]]; then
            echo "warm=true" >> "$GITHUB_OUTPUT"
            echo "$d is already filled from this runner's earlier jobs; the cache archive is not unpacked over it"
          fi
        env:
          RESTORE_ON_WARM: ${{ vars.CI_BUN_CACHE_RESTORE_WARM }}

