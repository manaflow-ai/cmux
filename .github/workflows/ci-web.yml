        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.bun/install/cache
          key: bun-web-shared-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('web/bun.lock', 'webviews/bun.lock', 'cmux-tui/frontends/web/bun.lock', 'scripts/react-doctor/bun.lock', 'agent-chat/bun.lock', 'backend/bun.lock') }}
          restore-keys: bun-web-shared-v1-${{ runner.os }}-${{ runner.arch }}-

      # `vp check` runs on Node and needs ^22.18 or ^24.11; bun still installs.
      - name: Restore pinned Node 24.22.1 from the CI cache bucket
        shell: bash
        continue-on-error: true
        run: bash "$GITHUB_WORKSPACE/scripts/ci/toolchain-r2.sh" restore node 24.22.1 || true

      - name: Setup Node
        timeout-minutes: 5
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.22.1"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check webviews
        id: typecheck
        env:
          CMUX_NEXT_STYLE_GUARDS: ${{ env.CMUX_NEXT_STYLE_GUARDS_LEVEL }}
          BASE_REF: ${{ github.event_name == 'pull_request' && 'HEAD^1' || '' }}
          # fixit-compile (ci-oops 0a) runs inside the type check here, since the shards skip it (--skip typecheck)
          FIXIT_COMPILE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -o pipefail
          check() {
            if [ "$CMUX_NEXT_STYLE_GUARDS" = warn ]; then
              python3 ../scripts/ci/fast_gate_webviews_checks.py --no-install --repo .. --base "$BASE_REF" --only typecheck
            else
              bun run typecheck
            fi
          }
          log="$RUNNER_TEMP/webviews-typecheck.log"
          set +e
          check 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          set -e
          # The native TypeScript preview compiler can abort on a healthy runner: retry that crash once (web-typecheck).
          if [ "$status" -ne 0 ] && grep -Fq 'Aborted (core dumped)' "$log"; then
            echo "::warning::native tsgo aborted during the webviews type check; retrying once"
            check
            exit $?
          fi
          exit "$status"

      # A type error fixit-compile could not fix wrote its record (scripts/ci/oops/fixit_handoff.py signal).
      - name: Hand a type error with no machine fix to fixit-handoff
        id: fixit-nofix
        if: ${{ failure() && steps.typecheck.outcome == 'failure' }}
        run: python3 -I ../scripts/ci/oops/fixit_handoff.py signal >> "$GITHUB_OUTPUT"

      # A type check whose every error had one safe language-service fix, and passed with them: the patch, for the
      # cmuxterm-hq fixit-compile reconciler to push onto a lane/* branch as a fixup commit (ci-oops 0a).
      - name: Upload the fixit-compile patch
        if: ${{ failure() }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fixit-compile-${{ github.job }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fixit-compile
          if-no-files-found: ignore
          retention-days: 3

