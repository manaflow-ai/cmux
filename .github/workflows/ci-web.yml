name: CI web

on:
  workflow_call:
    inputs:
      web:
        required: true
        type: string
      macos:
        required: true
        type: string
      agent_session_web:
        required: true
        type: string
      # A push's event.before (cmux-next-web.yml): subareas route from the whole push, not
      # only its last commit. Empty on pull requests, which route from the merge commit.
      push_base:
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  web-subarea-scope:
    if: ${{ inputs.web == 'true' || inputs.macos == 'true' }}
    # The Linux pool's live member, never LINUX_RUNNER alone: on 2026-11-01
    # LINUX_RUNNER sat on a stalled blacksmith-32vcpu-ubuntu-2404 and this job (124762739841) waited
    # 50 minutes unassigned, holding every webview shard behind it.
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-4vcpu-ubuntu-2404' || fromJSON(vars.RUNNER_POOLS).linux }}
    timeout-minutes: 5
    outputs:
      db: ${{ steps.scope.outputs.db }}
      diff_sidecar: ${{ steps.scope.outputs.diff_sidecar }}
      instant: ${{ steps.scope.outputs.instant }}
      production_build: ${{ steps.scope.outputs.production_build }}
      react_apps: ${{ steps.scope.outputs.react_apps }}
      typecheck: ${{ steps.scope.outputs.typecheck }}
      unit_tests: ${{ steps.scope.outputs.unit_tests }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2
          persist-credentials: false

      # The push base is not in a depth-2 clone; fetch it alone (an unknown one runs everything).
      - name: Fetch the push base
        if: ${{ inputs.push_base != '' }}
        env:
          PUSH_BASE: ${{ inputs.push_base }}
        run: git fetch --no-tags --depth=1 origin "$PUSH_BASE" || echo "::warning title=web routing::push base $PUSH_BASE is not fetchable; every web subarea runs"

      - name: Classify web subareas
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          WEB_SUBAREAS_BASE: ${{ inputs.push_base }}
        run: python3 scripts/ci/web_subareas.py route

      # The webview test shards split their files by recorded duration
      # (scripts/ci/webviews_test_shards.py). One copy of the manifest for the
      # whole run: a shard that read the cache itself could get a newer
      # manifest than its siblings, split differently, and skip or repeat files.
      - name: Restore the webview test duration manifest
        if: ${{ steps.scope.outputs.react_apps == 'true' }}
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/webviews-durations/manifest.json
          key: webviews-test-durations-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: webviews-test-durations-

      - name: Hand the duration manifest to the shards
        if: ${{ steps.scope.outputs.react_apps == 'true' }}
        run: |
          manifest="$RUNNER_TEMP/webviews-durations/manifest.json"
          mkdir -p "$(dirname "$manifest")"
          [ -s "$manifest" ] || printf '{}\n' > "$manifest"
          echo "duration manifest: $(grep -c '": ' "$manifest" || true) files"

      - name: Upload the duration manifest
        if: ${{ steps.scope.outputs.react_apps == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: webviews-test-durations
          # A re-run of the whole run uploads it again; the run's attempts share artifact names.
          overwrite: true
          path: ${{ runner.temp }}/webviews-durations/manifest.json
          if-no-files-found: error
          # A same-run handoff: the cache keeps the manifest between runs.
          retention-days: 1

  web-typecheck:
    needs: web-subarea-scope
    if: ${{ inputs.web == 'true' && needs.web-subarea-scope.outputs.typecheck == 'true' }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-16vcpu-ubuntu-2404' || !startsWith(vars.LINUX_RUNNER, 'blacksmith-') && vars.LINUX_RUNNER || vars.CI_CLOUD_OVERFLOW_SAVED && 'blacksmith-32vcpu-ubuntu-2404' || 'blacksmith-16vcpu-ubuntu-2404' }}
    # Matches the 10-minute siblings in this workflow.
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"

      - name: Cache Bun package cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('web/bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate managed relay catalog
        run: bun tools/generate-managed-iroh-relay-catalog.ts --check

      - name: Typecheck
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/web-typecheck.log"
          set +e
          bun run typecheck 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          set -e

          # The native TypeScript preview compiler can abort on a healthy
          # runner. Retry that transient compiler crash once, while keeping
          # real type errors as immediate failures.
          if [ "$status" -ne 0 ] \
            && grep -Fq 'Aborted (core dumped)' "$log"; then
            echo "::warning::native tsgo aborted during web typecheck; retrying once"
            bun run typecheck
            exit $?
          fi

          exit "$status"

  web-production-build:
    needs: web-subarea-scope
    if: ${{ inputs.web == 'true' && needs.web-subarea-scope.outputs.production_build == 'true' }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-32vcpu-ubuntu-2404' || !startsWith(vars.LINUX_RUNNER, 'blacksmith-') && vars.LINUX_RUNNER || vars.CI_CLOUD_OVERFLOW_SAVED && 'blacksmith-16vcpu-ubuntu-2404' || 'blacksmith-32vcpu-ubuntu-2404' }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"

      - name: Cache Bun package cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('web/bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Vercel production build
        env:
          RESEND_API_KEY: re_ci_build
          CMUX_FEEDBACK_FROM_EMAIL: ci@example.test
          STACK_SECRET_SERVER_KEY: ci-build-only
          NEXT_PUBLIC_STACK_PROJECT_ID: 00000000-0000-4000-8000-000000000000
          NEXT_PUBLIC_STACK_PUBLISHABLE_CLIENT_KEY: ci-build-only
          DATABASE_URL: postgres://cmux:cmux@127.0.0.1:1/cmux
          DIRECT_DATABASE_URL: postgres://cmux:cmux@127.0.0.1:1/cmux
          CMUX_ANALYTICS_TEST_MODE: "1"
        run: bun run vercel-build

  web-tests:
    needs: web-subarea-scope
    if: ${{ inputs.web == 'true' && needs.web-subarea-scope.outputs.unit_tests == 'true' }}
    name: Web tests (${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/4", "2/4", "3/4", "4/4"]
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-16vcpu-ubuntu-2404' || !startsWith(vars.LINUX_RUNNER, 'blacksmith-') && vars.LINUX_RUNNER || vars.CI_CLOUD_OVERFLOW_SAVED && 'blacksmith-32vcpu-ubuntu-2404' || 'blacksmith-16vcpu-ubuntu-2404' }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"

      - name: Cache Bun package cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('web/bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run web test shard
        id: shard
        # The JUnit report feeds scripts/ci/web_test_failure_census.py. bun
        # still prints its usual output; it refuses to write the report into a
        # missing directory, so the directory comes first.
        run: |
          report_dir="$RUNNER_TEMP/web-test-junit"
          mkdir -p "$report_dir"
          shard="${{ matrix.shard }}"
          echo "index=${shard%%/*}" >> "$GITHUB_OUTPUT"
          ./scripts/run-tests.sh --shard "${{ matrix.shard }}" --reporter=junit --reporter-outfile="$report_dir/junit.xml"

      # Only failed shards upload, so one repository-wide artifact listing per
      # name finds every failure in a window. The attempt keeps a re-run from
      # colliding with the report of the attempt it re-ran.
      - name: Upload failed shard JUnit report
        if: ${{ failure() && steps.shard.outputs.index != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-test-junit-shard${{ steps.shard.outputs.index }}-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/web-test-junit/junit.xml
          if-no-files-found: ignore
          retention-days: 14

  web-instant-navigation:
    needs: web-subarea-scope
    if: ${{ inputs.web == 'true' && needs.web-subarea-scope.outputs.instant == 'true' }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-16vcpu-ubuntu-2404' || !startsWith(vars.LINUX_RUNNER, 'blacksmith-') && vars.LINUX_RUNNER || vars.CI_CLOUD_OVERFLOW_SAVED && 'blacksmith-32vcpu-ubuntu-2404' || 'blacksmith-16vcpu-ubuntu-2404' }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"

      - name: Cache Bun package cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('web/bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('web/bun.lock') }}

      - name: Cache Playwright's apt packages
        uses: ./.github/actions/playwright-apt-cache
        with:
          engines: chromium

      - name: Install browser for instant navigation tests
        run: bunx playwright install --with-deps chromium

      - name: Instant navigation tests
        env:
          # web-typecheck is an independent required sibling in the same
          # reusable workflow, so this browser lane does not launch tsgo again.
          CMUX_INSTANT_SKIP_TYPECHECK: "1"
        run: bun run test:instant

  # Checks for in-app React webviews (currently the diff viewer; more cmux React
  # surfaces will live alongside it).

  react-apps-check-shard:
    needs: web-subarea-scope
    if: ${{ inputs.web == 'true' && needs.web-subarea-scope.outputs.react_apps == 'true' }}
    # `bun test` grows memory across the suite and was SIGKILLed (exit 137) on the
    # 4 vCPU runner (run 37666132324). 16 vCPU has the memory and runs 16 files
    # and 4 dev-server files at once (run-webviews-tests.sh). These shards were the
    # largest Blacksmith spend (about 99k 32 vCPU minutes a day, 2026-10-29/30);
    # the 16 vCPU shards of the same days took 14% longer at p50 (1107 s against
    # 972 s, pull requests) for half the per-minute price, the longest 2139 s, under
    # the 40 min timeout. The overflow failover still goes to 32 vCPU. Fork pull
    # requests run the same suite on the hosted runner.
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || (github.event_name == 'push' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) && vars.CI_LINUX_GATE_OWNED_RUNNER || vars.CI_CLOUD_OVERFLOW_SAVED && 'blacksmith-32vcpu-ubuntu-2404' || 'blacksmith-16vcpu-ubuntu-2404' }}
    # The 10-minute siblings in this workflow, plus the browser engines and the
    # browser-lane suites they run. The full suite grew to 22 min in one process.
    # Deterministic file shards keep per-file isolation. Each shard warms one
    # Vite cache per dev-server config, cold, so many small shards each paid
    # that warm-up and ran their dev-server files two at a time: 12 shards on
    # 8 vCPU took 14.3 min (run 39347314726), barely under 2 shards' 15.5.
    # Fewer, wider shards share each warm cache across more files.
    # On 16 vCPU a shard runs its dev-server files 4 at a time, and they are
    # most of its wall time: 4 shards took 18-26 min of "Test webviews" each
    # (run 41236343549), the long pole from ask to merge for a webview fix.
    # 8 shards halve each shard's dev-server files for about 2 min more setup
    # and Vite warm-up per added shard (Leo, 2026-10-31: a straightforward fix
    # lands within the hour).
    timeout-minutes: 40
    name: react-apps-check (${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1
            shard_count: 8
          - shard: 2
            shard_count: 8
          - shard: 3
            shard_count: 8
          - shard: 4
            shard_count: 8
          - shard: 5
            shard_count: 8
          - shard: 6
            shard_count: 8
          - shard: 7
            shard_count: 8
          - shard: 8
            shard_count: 8
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # A pull request's merge commit with its parents: ui-rules and gallery
          # coverage fail the PR only for its own findings (test/support/prScope.ts).
          fetch-depth: ${{ github.event_name == 'pull_request' && '2' || '1' }}
          persist-credentials: false

      # The run's one manifest, from web-subarea-scope. No fallback: a shard
      # that split without it would disagree with its siblings.
      - name: Download the duration manifest
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: webviews-test-durations
          path: ${{ runner.temp }}/webviews-durations

      - name: List the pull request's files
        if: github.event_name == 'pull_request'
        run: |
          git diff --name-only --no-renames HEAD^1 HEAD > "$RUNNER_TEMP/pr-changed-files"
          echo "CMUX_PR_CHANGED_FILES=$RUNNER_TEMP/pr-changed-files" >> "$GITHUB_ENV"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"

      # The source build installs webviews dependencies before the test suite;
      # cache Bun's package blobs on this lane so a new source key
      # does not redownload the lockfile from scratch.
      - name: Cache Bun package cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.bun/install/cache
          key: bun-webviews-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('webviews/bun.lock') }}

      - name: Cache Playwright browsers
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-webviews-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('webviews/bun.lock') }}

      # `vp check` runs on Node and needs ^22.18 or ^24.11; bun still installs.
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.22.1"

      # The web bundles are build output (cx-vn5): this builds them into the
      # gitignored resource paths that the budget, React Compiler and webviews
      # tests below read. Typecheck runs once in the dedicated step below.
      # Every step from here to the tests records its outcome and keeps going;
      # the last step fails the job on any of them. One red never hides another:
      # #23763 (2026-10-21) merged its own TS2339 because a base red in the bundle
      # build skipped the type check and the tests after it.
      - name: Verify webviews source checks
        id: source-build
        continue-on-error: true
        run: ./scripts/build-webviews-app.sh --check --skip-typecheck

      - name: Build the web bundles
        id: bundles
        continue-on-error: true
        run: ./scripts/cmux-next/build-web-bundles.sh --force

      # ci-guards runs this on main; feat-cmux-next PRs skip ci-guards.
      # The checks from here to the engines do not depend on the shard, so
      # they run once, on shard 1: one red check, not one per shard.
      - name: Generated bundle merge driver
        id: merge-driver
        if: matrix.shard == 1
        continue-on-error: true
        run: python3 tests/test_install_git_hooks.py

      # Runs after the webviews install, so the real-vp case runs too.
      - name: Post-edit formatting hook
        id: post-edit-format
        if: matrix.shard == 1
        continue-on-error: true
        run: python3 tests/test_format_post_edit.py

      - name: Check diff viewer eager JS budget
        id: eager-js-budget
        if: matrix.shard == 1
        continue-on-error: true
        run: node ./scripts/check-webviews-diff-budget.mjs

      - name: Verify React Compiler for webviews
        id: react-compiler
        if: matrix.shard == 1
        continue-on-error: true
        run: ./scripts/check-webviews-react-compiler.mjs

      # For feat-cmux-next (CMUX_NEXT_STYLE_GUARDS=warn, Leo 2026-10-19) the lint, format,
      # layer, type-scale, glyph, system-blue, text-focus, dialog-key and switch-fetch checks each
      # run and only warn. The type check, the browser test-lane check, the protocol codegen
      # check and the string catalog key check fail, through fast_gate_webviews_checks.py: each
      # runs on its own, and on a pull request only errors the base (the merge parent) lacks
      # fail, per error (file, code, message); the base's errors are warnings. A push charges
      # every red. Elsewhere every piece of `bun run check` (its `check:pieces` list) runs and gates, none stopping the next.
      - name: Check webviews (Oxlint, Oxfmt, type check)
        id: webviews-check
        if: matrix.shard == 1
        continue-on-error: true
        working-directory: webviews
        env:
          CMUX_NEXT_STYLE_GUARDS: ${{ (github.base_ref == 'feat-cmux-next' || github.ref == 'refs/heads/feat-cmux-next') && 'warn' || 'fail' }}
          BASE_REF: ${{ github.event_name == 'pull_request' && 'HEAD^1' || '' }}
        run: |
          status=0
          if [ "$CMUX_NEXT_STYLE_GUARDS" != warn ]; then
            pieces="$(bun -e 'for (const p of (require("./package.json").scripts["check:pieces"] ?? require("./package.json").scripts.check).split("&&")) console.log(p.trim())')"
            while IFS= read -r piece; do
              PATH="$PWD/node_modules/.bin:$PATH" sh -c "$piece" || { echo "::error title=webviews check::$piece"; status=1; }
            done <<< "$pieces"
            exit "$status"
          fi
          python3 ../scripts/ci/fast_gate_webviews_checks.py --no-install --repo .. --base "$BASE_REF" || status=1
          for check in check:design-tokens check:layers check:type-scale check:motion-scale check:surface-roles check:layout-grid check:status-glyphs check:system-blue check:text-focus check:toast-targets check:dialog-keys check:switch-fetches check:session-info-names check:attachment-caps; do
            bun run "$check" || echo "::warning title=webviews $check (warn-only)::see the step log"
          done
          # Format and lint apart: `vp check` stops at its first red, so a format red hid every lint finding.
          ./node_modules/.bin/vp fmt --check || echo "::warning title=webviews format (warn-only)::vp fmt --check found unformatted files; see the step log"
          ./node_modules/.bin/vp lint || echo "::warning title=webviews lint (warn-only)::vp lint found issues; see the step log"
          exit "$status"

      # The browser-lane suites (test/support/requireBrowserLane.ts) fail in CI
      # without these engines; before, they skipped themselves and passed.
      - name: Cache Playwright's apt packages
        id: playwright-apt
        continue-on-error: true
        uses: ./.github/actions/playwright-apt-cache
        with:
          engines: chromium-webkit

      - name: Install headless engines
        id: engines
        continue-on-error: true
        working-directory: webviews
        run: ./node_modules/.bin/playwright install --with-deps --only-shell chromium webkit

      - name: Check PR-scoped webview rules
        id: pr-scoped-rules
        if: matrix.shard == 1
        continue-on-error: true
        run: python3 scripts/tests/test_pr_scoped_webviews_checks.py

      # One bun process per test file with a per-file timeout: a single
      # `bun test` stalled in a different file each run (scripts/ci/run-webviews-tests.sh).
      # ui-rules, gallery coverage, hairline rims, tooltip rules, theme colors and
      # system blue report through test/support/prScope.ts, which only warns
      # under CMUX_NEXT_STYLE_GUARDS=warn (feat-cmux-next).
      # A pull request fails only on tests red on it and not on its base (the merge
      # parent): the red files run again there, and the base's reds are warnings
      # (scripts/ci/webviews-tests-new-reds.sh). A push keeps every red.
      - name: Test webviews
        id: webview-tests
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        if: ${{ !cancelled() }}
        working-directory: webviews
        env:
          CMUX_NEXT_STYLE_GUARDS: ${{ (github.base_ref == 'feat-cmux-next' || github.ref == 'refs/heads/feat-cmux-next') && 'warn' || 'fail' }}
          CMUX_WEB_TEST_SHARD: ${{ matrix.shard }}
          CMUX_WEB_TEST_SHARD_COUNT: ${{ matrix.shard_count }}
          CMUX_WEB_TEST_RESULTS: ${{ runner.temp }}/webviews-head-results/webviews-head-results.json
          CMUX_WEB_TEST_RAW_LOG_DIR: ${{ runner.temp }}/webviews-head-results/raw-logs
          CMUX_WEB_TEST_SKIP_BASE: ${{ github.event_name == 'pull_request' && '1' || '0' }}
          CMUX_WEB_TEST_DURATIONS: ${{ runner.temp }}/webviews-durations/manifest.json
          CMUX_WEB_TEST_DURATIONS_OUT: ${{ runner.temp }}/webviews-durations-out/shard${{ matrix.shard }}.json
          BASE_REF: ${{ github.event_name == 'pull_request' && 'HEAD^1' || '' }}
          # Every failed or timed-out file gets its alone retry before it counts
          # as red; CMUX_WEB_TEST_RETRY_DEADLINE, not a budget, keeps the step in
          # its job. A fixed budget left contention reds unretried, and the base
          # replay (one at a time) then charged them to the change: a 240 s
          # timeout budget kept 7 of #27007's shard 1 timeouts, and a 300 s
          # failed-file budget cut accent-glass-invariants' retry (it needs more
          # than 297 s alone) and skipped transcript-thought and
          # streaming-text-frames (#27425's shard 4). The retries end 32 min into
          # this step (it starts about 2 min into the job), which leaves the
          # uploads room inside the 40 min timeout-minutes. A file that fails
          # alone too stays red.
          CMUX_WEB_TEST_RETRY_BUDGET: "1920"
          CMUX_WEB_TEST_RETRY_DEADLINE: "1920"
        run: |
          # Replay uses this exact runner and result parser, with the base's tests and bun.
          # Different deadline policies can otherwise turn an old named failure into a new timeout.
          mkdir -p "$RUNNER_TEMP/webviews-head-results/runner"
          # The comparison and the flake history are the head's too: the base's copies may predate --flaky.
          cp ../scripts/ci/run-webviews-tests.sh ../scripts/ci/webviews_test_results.py ../scripts/ci/webviews_test_shards.py \
            ../scripts/ci/guards_new_reds.py ../scripts/ci/webviews_test_history.py \
            "$RUNNER_TEMP/webviews-head-results/runner/"
          ../scripts/ci/webviews-tests-new-reds.sh "$BASE_REF"

      - name: Upload head webview results
        if: ${{ always() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # Artifact names are stable across failed-job reruns: the rerun keeps
          # the original head results while retrying only the base comparison.
          name: react-apps-head-results-shard${{ matrix.shard }}
          overwrite: true
          path: ${{ runner.temp }}/webviews-head-results/
          if-no-files-found: error
          retention-days: 14

      # A push's verdicts feed the base's flake history (the webviews-test-history job), which a
      # pull request's base replay reads so a test that flips by itself on the base only warns.
      # Optional upkeep, like the durations below: it never fails the shard.
      - name: Upload this push's webview results
        id: history-upload
        if: ${{ !cancelled() && github.event_name == 'push' }}
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: webviews-test-history-shard${{ matrix.shard }}
          overwrite: true
          path: ${{ runner.temp }}/webviews-head-results/webviews-head-results.json
          if-no-files-found: ignore
          retention-days: 1

      # Every event: push runs on feat-cmux-next keep the manifest fresh for everyone.
      # Optional upkeep: an artifact-service failure or stall never fails the
      # shard; the gate step below reports it as a warning.
      - name: Upload this shard's durations
        id: durations-upload
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: webviews-test-durations-shard${{ matrix.shard }}
          overwrite: true
          path: ${{ runner.temp }}/webviews-durations-out/
          if-no-files-found: ignore
          retention-days: 1

      - name: Fail on the gate checks
        if: ${{ !cancelled() }}
        env:
          SOURCE_BUILD: ${{ steps.source-build.outcome }}
          BUNDLES: ${{ steps.bundles.outcome }}
          PLAYWRIGHT_APT: ${{ steps.playwright-apt.outcome }}
          ENGINES: ${{ steps.engines.outcome }}
          MERGE_DRIVER: ${{ steps.merge-driver.outcome }}
          POST_EDIT_FORMAT: ${{ steps.post-edit-format.outcome }}
          EAGER_JS_BUDGET: ${{ steps.eager-js-budget.outcome }}
          REACT_COMPILER: ${{ steps.react-compiler.outcome }}
          WEBVIEWS_CHECK: ${{ steps.webviews-check.outcome }}
          PR_SCOPED_RULES: ${{ steps.pr-scoped-rules.outcome }}
          # Warn-only: the next run's shard split, never this run's verdict.
          DURATIONS_UPLOAD: ${{ steps.durations-upload.outcome }}
          HISTORY_UPLOAD: ${{ steps.history-upload.outcome }}
          # The eager JS budget (a size cap) and the React Compiler coverage are
          # structural: for feat-cmux-next they warn (Leo 2026-10-19).
          CMUX_NEXT_STYLE_GUARDS: ${{ (github.base_ref == 'feat-cmux-next' || github.ref == 'refs/heads/feat-cmux-next') && 'warn' || 'fail' }}
          STYLE_GATES: EAGER_JS_BUDGET REACT_COMPILER
        run: |
          failed=0
          if [ "$DURATIONS_UPLOAD" = failure ]; then
            echo "::warning::This shard's test durations did not upload; the next run's shard split misses them."
          fi
          if [ "$HISTORY_UPLOAD" = failure ]; then
            echo "::warning::This push's webview results did not upload; the base's flake history misses this run."
          fi
          for gate in \
            "SOURCE_BUILD|Verify webviews source checks" \
            "BUNDLES|Build the web bundles" \
            "PLAYWRIGHT_APT|Cache Playwright's apt packages" \
            "ENGINES|Install headless engines" \
            "MERGE_DRIVER|Generated bundle merge driver" \
            "POST_EDIT_FORMAT|Post-edit formatting hook" \
            "EAGER_JS_BUDGET|Check diff viewer eager JS budget" \
            "REACT_COMPILER|Verify React Compiler for webviews" \
            "WEBVIEWS_CHECK|Check webviews (Oxlint, Oxfmt, type check)" \
            "PR_SCOPED_RULES|Check PR-scoped webview rules"; do
            var="${gate%%|*}"
            if [ "${!var}" = "failure" ]; then
              if [ "$CMUX_NEXT_STYLE_GUARDS" = warn ] && [[ " $STYLE_GATES " == *" $var "* ]]; then
                echo "::warning::Style gate reported findings (warn-only); see the step '${gate#*|}'."
                continue
              fi
              echo "::error::Gate failed; see the step '${gate#*|}'."
              failed=1
            fi
          done
          exit "$failed"

  # A pull request's base comparison is deliberately separate from the head
  # shards. Replaying the base's failed files requires its own install and bundle
  # build; doing that after the head suite in one 40-minute job made shard 3 hit
  # the timeout before it could publish a verdict.
  react-apps-base-check:
    needs: [web-subarea-scope, react-apps-check-shard]
    if: ${{ github.event_name == 'pull_request' && inputs.web == 'true' && needs.web-subarea-scope.outputs.react_apps == 'true' }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || (github.event_name == 'push' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) && vars.CI_LINUX_GATE_OWNED_RUNNER || vars.CI_CLOUD_OVERFLOW_SAVED && 'blacksmith-32vcpu-ubuntu-2404' || 'blacksmith-16vcpu-ubuntu-2404' }}
    timeout-minutes: 40
    name: react-apps-base-check (${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1
          - shard: 2
          - shard: 3
          - shard: 4
          - shard: 5
          - shard: 6
          - shard: 7
          - shard: 8
    steps:
      # The base is the merge commit's first parent, the commit the head shards
      # were merged onto (their prScope diff is HEAD^1 too). pull_request.base.sha
      # lags it once the base moves: #27045's replay ran on a base 12 commits
      # older, where agent-pane-no-capsules still passed, so a red the merge
      # parent already had (#27019's capsule bars) was charged to the change.
      - name: Checkout the merge commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Use the merge parent as the base
        run: git checkout -q --detach HEAD^1

      - name: Download head webview results
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: react-apps-head-results-shard${{ matrix.shard }}
          path: ${{ runner.temp }}/head-results

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.4"

      # The base replays its reds with the bun its own webviews/package.json declares,
      # so a PR that moves the pin (or a base whose bun check is exact) compares like
      # with like; private-bun.sh is the base's copy and reads the base's devEngines.
      - name: Use the base's bun
        run: scripts/cmux-next/private-bun.sh

      - name: Cache Bun package cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: ~/.bun/install/cache
          key: bun-webviews-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('webviews/bun.lock') }}

      - name: Cache Playwright browsers
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: ~/.cache/ms-playwright
          key: playwright-webviews-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('webviews/bun.lock') }}

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24.22.1"

      - name: Install webview dependencies
        working-directory: webviews
        run: bun install --frozen-lockfile

      - name: Build base web bundles
        run: ./scripts/cmux-next/build-web-bundles.sh --force

      - name: Install headless engines
        working-directory: webviews
        run: ./node_modules/.bin/playwright install --with-deps --only-shell chromium webkit

      # The base's recent push verdicts (webviews-test-history), newest first. A test whose
      # verdict flipped by itself there passed this replay by chance as often as not, so it
      # only warns: agent-pane-suggested-tasks was charged to 9 of 40 sampled red pull
      # request runs (2026-10-30). Read-only and optional: no history means no flakes.
      - name: Restore the base's webview test history
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/webviews-test-history/history.json
          key: webviews-test-history-${{ github.base_ref }}-none
          restore-keys: webviews-test-history-${{ github.base_ref }}-

      - name: Run base reds and compare
        working-directory: webviews
        env:
          HEAD_RESULTS: ${{ runner.temp }}/head-results/webviews-head-results.json
          BASE_RESULTS: ${{ runner.temp }}/base-results.json
          CMUX_NEXT_STYLE_GUARDS: warn
          CMUX_WEB_TEST_JOBS: "1"
          CMUX_WEB_TEST_RETRIES: "0"
        run: |
          files="$RUNNER_TEMP/base-files"
          python3 ../scripts/ci/webviews_test_results.py --failed-files "$HEAD_RESULTS" |
            while IFS= read -r file; do
              if [ -n "$file" ] && git cat-file -e "HEAD:webviews/$file" 2>/dev/null; then
                printf '%s\n' "$file"
              fi
            done > "$files"
          if [ ! -s "$files" ]; then
            echo "no head reds to replay on the base"
            # A head-red file that is absent from the base is a new failure.
            # An empty base map makes guards_new_reds.py report it instead of
            # incorrectly treating the head map as a base verdict.
            printf '{}\n' > "$BASE_RESULTS"
          else
            CMUX_WEB_TEST_FILES="$(cat "$files")" \
              CMUX_WEB_TEST_RESULTS="$BASE_RESULTS" \
              env -u CMUX_WEB_TEST_SHARD -u CMUX_WEB_TEST_SHARD_COUNT -u CMUX_PR_CHANGED_FILES \
              bash "$RUNNER_TEMP/head-results/runner/run-webviews-tests.sh" || true
          fi
          runner="$RUNNER_TEMP/head-results/runner"
          flaky="$RUNNER_TEMP/flaky-on-base"
          python3 "$runner/webviews_test_history.py" flaky "$RUNNER_TEMP/webviews-test-history/history.json" \
            --names "$HEAD_RESULTS" > "$flaky" || : > "$flaky"
          if [ -s "$flaky" ]; then echo "flipped by themselves on recent base pushes:"; sed 's/^/  /' "$flaky"; fi
          python3 "$runner/guards_new_reds.py" --label "Webview test" --flaky "$flaky" "$HEAD_RESULTS" "$BASE_RESULTS"

  # The runner capability map (.github/runners.json), for jobs that pick a
  # size from it. Resolves in parallel with web-subarea-scope.
  runners:
    if: ${{ inputs.web == 'true' }}
    uses: ./.github/workflows/resolve-runners.yml

  # React Doctor is independent of the per-file browser tests. Keep it on its
  # own required lane so the long-running shard 1 does not serialize this
  # diagnostic after the test suite.
  react-doctor:
    needs: [web-subarea-scope, runners]
    if: ${{ inputs.web == 'true' && needs.web-subarea-scope.outputs.react_apps == 'true' }}
    # React Doctor took 7.4-9.9 min on 4 vCPU and hit the 10 min timeout on
    # 2026-10-20 (runs 39505208959, 39506071754), which failed
    # react-apps-check. It takes the 16 vCPU size from the capability map.
    runs-on: ${{ fromJSON(needs.runners.outputs.map).linux_16 }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: webviews
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"

      - name: Cache Bun package cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.bun/install/cache
          key: bun-webviews-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('webviews/bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: React Doctor
        run: bun run react-doctor:ci

  # Keep one stable required check name for branch protection while the test work
  # itself runs in independent file shards above.
  react-apps-check:
    needs: [web-subarea-scope, react-apps-check-shard, react-apps-base-check, react-doctor]
    if: ${{ always() && inputs.web == 'true' && needs.web-subarea-scope.outputs.react_apps == 'true' }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-4vcpu-ubuntu-2404' || (github.event_name == 'push' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) && vars.CI_LINUX_GATE_OWNED_RUNNER || fromJSON(vars.RUNNER_POOLS).linux }}
    timeout-minutes: 5
    steps:
      - name: Check webview test shards
        env:
          WEB_INPUTS: ${{ toJSON(inputs) }}
          WEB_NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          inputs = json.loads(os.environ["WEB_INPUTS"])
          needs = json.loads(os.environ["WEB_NEEDS"])
          required = inputs["web"] == "true" and needs["web-subarea-scope"]["outputs"].get("react_apps") == "true"
          required_jobs = ["react-apps-check-shard", "react-doctor"]
          if os.environ.get("GITHUB_EVENT_NAME") == "pull_request":
              required_jobs.append("react-apps-base-check")
          allowed = {"success"} if required else {"success", "skipped"}
          bad = {
              name: needs[name]["result"]
              for name in required_jobs
              if needs[name]["result"] not in allowed
          }
          if bad:
              for name, result in bad.items():
                  print(f"{name}: {result}", file=sys.stderr)
              sys.exit(1)
          for name in required_jobs:
              print(f"{name}: required={str(required).lower()} result={needs[name]['result']}")
          PY

  # The next run's shard split: this run's per-file seconds, averaged with the
  # manifest it split by. Its own job, outside the required react-apps-check:
  # a stalled download or cache save must not time out the gate. A missing
  # manifest only means the next run splits by path hash. A pull request's
  # entry stays in its own ref's scope; fork pull requests save none.
  webviews-test-durations:
    needs: [web-subarea-scope, react-apps-check-shard]
    if: ${{ always() && inputs.web == 'true' && needs.web-subarea-scope.outputs.react_apps == 'true' && needs.react-apps-check-shard.result != 'skipped' }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-4vcpu-ubuntu-2404' || fromJSON(vars.RUNNER_POOLS).linux }}
    timeout-minutes: 5
    steps:
      - name: Checkout the shard helper
        id: durations-checkout
        continue-on-error: true
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: scripts/ci/webviews_test_shards.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Download the run's durations
        id: durations-download
        if: ${{ steps.durations-checkout.outcome == 'success' }}
        continue-on-error: true
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: webviews-test-durations*
          path: ${{ runner.temp }}/durations

      - name: Merge the duration manifest
        id: durations-merge
        if: ${{ steps.durations-download.outcome == 'success' }}
        continue-on-error: true
        run: |
          shards=("$RUNNER_TEMP"/durations/webviews-test-durations-shard*/shard*.json)
          [ -e "${shards[0]}" ] || { echo "no shard recorded durations"; exit 1; }
          python3 scripts/ci/webviews_test_shards.py merge "$RUNNER_TEMP/webviews-durations/manifest.json" \
            "$RUNNER_TEMP/durations/webviews-test-durations/manifest.json" "${shards[@]}"

      - name: Save the duration manifest
        if: ${{ steps.durations-merge.outcome == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        continue-on-error: true
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/webviews-durations/manifest.json
          key: webviews-test-durations-${{ github.run_id }}-${{ github.run_attempt }}

  # The base's flake history: each feat-cmux-next push's webview verdicts (the shards'
  # results), appended to the newest saved history and saved again under this run's key.
  # react-apps-base-check reads it (webviews_test_history.py flaky). Pushes only: a pull
  # request saves nothing, so its restore falls through to its base branch's history.
  # Optional upkeep outside the required gate, like webviews-test-durations; two pushes
  # finishing together may drop one of their runs, which costs one data point.
  webviews-test-history:
    needs: [web-subarea-scope, react-apps-check-shard]
    if: ${{ always() && github.event_name == 'push' && inputs.web == 'true' && needs.web-subarea-scope.outputs.react_apps == 'true' && needs.react-apps-check-shard.result != 'skipped' }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-4vcpu-ubuntu-2404' || fromJSON(vars.RUNNER_POOLS).linux }}
    timeout-minutes: 5
    steps:
      - name: Checkout the history helper
        id: history-checkout
        continue-on-error: true
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: |
            scripts/ci/webviews_test_history.py
            scripts/ci/web_subareas.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Download this push's results
        id: history-download
        if: ${{ steps.history-checkout.outcome == 'success' }}
        continue-on-error: true
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: webviews-test-history-shard*
          path: ${{ runner.temp }}/history-results

      - name: Restore the history
        if: ${{ steps.history-download.outcome == 'success' }}
        continue-on-error: true
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/webviews-test-history/history.json
          key: webviews-test-history-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: webviews-test-history-${{ github.ref_name }}-

      - name: Add this push to the history
        id: history-record
        if: ${{ steps.history-download.outcome == 'success' }}
        continue-on-error: true
        run: |
          shards=("$RUNNER_TEMP"/history-results/webviews-test-history-shard*/webviews-head-results.json)
          [ -e "${shards[0]}" ] || { echo "no shard recorded results"; exit 1; }
          history="$RUNNER_TEMP/webviews-test-history/history.json"
          python3 scripts/ci/webviews_test_history.py record "$history" "$history.new" \
            --sha "$GITHUB_SHA" --attempt "$GITHUB_RUN_ATTEMPT" --time "$(git log -1 --format=%ct)" \
            --inputs "$(python3 scripts/ci/webviews_test_history.py inputs)" "${shards[@]}"
          mv "$history.new" "$history"

      - name: Save the history
        if: ${{ steps.history-record.outcome == 'success' }}
        continue-on-error: true
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/webviews-test-history/history.json
          key: webviews-test-history-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}

  diff-sidecar-check:
    # Generated protocol checks and the sidecar tests only run for their owned inputs.
    needs: web-subarea-scope
    if: ${{ (inputs.macos == 'true' || inputs.web == 'true') && needs.web-subarea-scope.outputs.diff_sidecar == 'true' }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-32vcpu-ubuntu-2404' || !startsWith(vars.LINUX_RUNNER, 'blacksmith-') && vars.LINUX_RUNNER || vars.CI_CLOUD_OVERFLOW_SAVED && 'blacksmith-16vcpu-ubuntu-2404' || 'blacksmith-32vcpu-ubuntu-2404' }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust
        run: ./scripts/install-rust-ci.sh

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"

      - name: Cache Bun package cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.bun/install/cache
          key: bun-webviews-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('webviews/bun.lock') }}

      - name: Install webview dependencies
        working-directory: webviews
        run: bun install --frozen-lockfile

      # Format and clippy are gates: a miss is recorded and fails the job in the
      # last step, so it no longer hides the cargo tests and checks below.
      - name: Lint Rust sidecar (fmt, clippy)
        id: sidecar-lint
        continue-on-error: true
        run: |
          ./scripts/run-diff-sidecar-cargo.sh fmt --manifest-path Native/DiffSidecar/Cargo.toml --all --check
          ./scripts/run-diff-sidecar-cargo.sh clippy --manifest-path Native/DiffSidecar/Cargo.toml --all-targets --locked --no-default-features -- -D warnings
          ./scripts/run-diff-sidecar-cargo.sh clippy --manifest-path Native/DiffSidecar/Cargo.toml --all-targets --all-features --locked -- -D warnings

      - name: Test Rust sidecar
        run: |
          ./scripts/run-diff-sidecar-cargo.sh test --manifest-path Native/DiffSidecar/Cargo.toml --all-targets --locked --no-default-features
          ./scripts/run-diff-sidecar-cargo.sh test --manifest-path Native/DiffSidecar/Cargo.toml --all-targets --all-features --locked

      - name: Verify generated protocol types
        run: ./scripts/generate-diff-sidecar-types.sh --check

      # The diff-viewer performance budgets (scripts/benchmark-diff-viewer.sh) run in the perf cron
      # (cmux-next-perf-budgets.yml), not here: no perf check on the push or pull request path (Lawrence
      # 2026-10-23).

      # fmt and clippy are style for feat-cmux-next (Leo 2026-10-19): a warning there. The
      # sidecar tests above still compile and fail on their own.
      - name: Fail on the Rust sidecar lint
        if: ${{ !cancelled() && steps.sidecar-lint.outcome == 'failure' }}
        env:
          CMUX_NEXT_STYLE_GUARDS: ${{ (github.base_ref == 'feat-cmux-next' || github.ref == 'refs/heads/feat-cmux-next') && 'warn' || 'fail' }}
        run: |
          if [ "$CMUX_NEXT_STYLE_GUARDS" = warn ]; then
            echo "::warning::Rust sidecar fmt or clippy found issues (warn-only); see the step 'Lint Rust sidecar (fmt, clippy)'."
            exit 0
          fi
          echo "::error::Rust sidecar fmt or clippy failed; see the step 'Lint Rust sidecar (fmt, clippy)'."
          exit 1

  web-db-migrations:
    needs: web-subarea-scope
    if: ${{ inputs.web == 'true' && needs.web-subarea-scope.outputs.db == 'true' }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-4vcpu-ubuntu-2404' || fromJSON(vars.RUNNER_POOLS).linux }}
    # Matches web-production-build and diff-sidecar-check, the other 15s here.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_DB: cmux_test
          POSTGRES_PASSWORD: cmux
          POSTGRES_USER: cmux
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cmux -d cmux_test"
          --health-interval 1s
          --health-timeout 5s
          --health-retries 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"

      - name: Cache Bun package cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('web/bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply migrations
        env:
          DATABASE_URL: postgres://cmux:cmux@localhost:5432/cmux_test
          DIRECT_DATABASE_URL: postgres://cmux:cmux@localhost:5432/cmux_test
        run: bun scripts/db-migrate.mjs

      - name: Re-apply migrations
        env:
          DATABASE_URL: postgres://cmux:cmux@localhost:5432/cmux_test
          DIRECT_DATABASE_URL: postgres://cmux:cmux@localhost:5432/cmux_test
        run: bun scripts/db-migrate.mjs

      - name: Database behavior tests
        env:
          CMUX_DB_TEST: "1"
          DATABASE_URL: postgres://cmux:cmux@localhost:5432/cmux_test
          DIRECT_DATABASE_URL: postgres://cmux:cmux@localhost:5432/cmux_test
        run: bun run test:db:behavior

  web-status:
    name: Web status
    needs:
      - web-subarea-scope
      - web-typecheck
      - web-production-build
      - web-tests
      - web-instant-navigation
      - react-apps-check
      - diff-sidecar-check
      - web-db-migrations
    # Keep the web verdict after a failed dependency, but skip it after run
    # cancellation so a superseded push does not start another runner.
    if: ${{ !cancelled() }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-4vcpu-ubuntu-2404' || fromJSON(vars.RUNNER_POOLS).linux }}
    timeout-minutes: 5
    steps:
      - name: Check routed web jobs
        env:
          WEB_INPUTS: ${{ toJSON(inputs) }}
          WEB_NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          inputs = json.loads(os.environ["WEB_INPUTS"])
          needs = json.loads(os.environ["WEB_NEEDS"])
          for route in ("web", "macos", "agent_session_web"):
              if inputs.get(route) not in {"true", "false"}:
                  print(f"invalid route {route}={inputs.get(route)!r}", file=sys.stderr)
                  sys.exit(1)

          scope = needs["web-subarea-scope"]
          scope_required = inputs["web"] == "true" or inputs["macos"] == "true"
          if scope_required:
              if scope["result"] != "success":
                  print(f"web-subarea-scope: {scope['result']}", file=sys.stderr)
                  sys.exit(1)
              subareas = scope.get("outputs", {})
              for name in ("db", "diff_sidecar", "instant", "production_build", "react_apps", "typecheck", "unit_tests"):
                  if subareas.get(name) not in {"true", "false"}:
                      print(f"invalid web subarea {name}={subareas.get(name)!r}", file=sys.stderr)
                      sys.exit(1)
          else:
              subareas = {
                  "db": "false",
                  "diff_sidecar": "false",
                  "instant": "false",
                  "production_build": "false",
                  "react_apps": "false",
                  "typecheck": "false",
                  "unit_tests": "false",
              }

          required = {
              "web-subarea-scope": scope_required,
              "web-typecheck": inputs["web"] == "true" and subareas["typecheck"] == "true",
              "web-production-build": inputs["web"] == "true" and subareas["production_build"] == "true",
              "web-tests": inputs["web"] == "true" and subareas["unit_tests"] == "true",
              "web-instant-navigation": inputs["web"] == "true" and subareas["instant"] == "true",
              "react-apps-check": inputs["web"] == "true" and subareas["react_apps"] == "true",
              "diff-sidecar-check": scope_required and subareas["diff_sidecar"] == "true",
              "web-db-migrations": inputs["web"] == "true" and subareas["db"] == "true",
          }
          bad = {}
          for job, is_required in sorted(required.items()):
              result = needs[job]["result"]
              if is_required:
                  if result != "success":
                      bad[job] = result
              elif result not in {"success", "skipped"}:
                  bad[job] = result
          if bad:
              for job, result in bad.items():
                  print(f"{job}: {result}", file=sys.stderr)
              sys.exit(1)
          for job, is_required in sorted(required.items()):
              print(f"{job}: required={str(is_required).lower()} result={needs[job]['result']}")
          PY
