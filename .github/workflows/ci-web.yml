name: CI web

on:
  workflow_call:
    inputs:
      web:
        required: true
        type: string
      macos:
        required: true
        type: string
      agent_session_web:
        required: true
        type: string

permissions:
  contents: read

jobs:
  web-subarea-scope:
    if: ${{ inputs.web == 'true' }}
    runs-on: ${{ vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 5
    outputs:
      db: ${{ steps.scope.outputs.db }}
      instant: ${{ steps.scope.outputs.instant }}
      react_apps: ${{ steps.scope.outputs.react_apps }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Classify web subareas
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import subprocess

          def emit(db: bool, instant: bool, react_apps: bool) -> None:
              values = {
                  "db": db,
                  "instant": instant,
                  "react_apps": react_apps,
              }
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                  for key, value in values.items():
                      output.write(f"{key}={str(value).lower()}\n")
              print("web subareas: " + " ".join(f"{key}={str(value).lower()}" for key, value in values.items()))

          if os.environ.get("EVENT_NAME") == "workflow_dispatch":
              emit(True, True, True)
              raise SystemExit(0)

          base = subprocess.run(
              ["git", "rev-parse", "-q", "--verify", "HEAD^1"],
              text=True,
              capture_output=True,
          )
          if base.returncode != 0:
              print("comparison parent unavailable; running every web subarea")
              emit(True, True, True)
              raise SystemExit(0)

          diff = subprocess.run(
              ["git", "diff", "--no-renames", "--name-only", "-z", base.stdout.strip(), "HEAD", "--"],
              capture_output=True,
          )
          if diff.returncode != 0:
              print("web subarea diff unavailable; running every web subarea")
              emit(True, True, True)
              raise SystemExit(0)

          paths = [os.fsdecode(path) for path in diff.stdout.split(b"\0") if path]
          if not paths:
              print("empty web diff; running every web subarea")
              emit(True, True, True)
              raise SystemExit(0)

          all_subareas = {".github/workflows/ci-web.yml"}
          db_exact = {
              "web/bun.lock",
              "web/drizzle.config.ts",
              "web/package.json",
              "web/scripts/db-local.sh",
              "web/scripts/run-db-behavior-tests.sh",
          }
          db_prefixes = (
              "web/app/api/",
              "web/app/v1/",
              "web/db/",
              "web/openapi/",
              "web/orpc/",
              "web/services/",
              "web/tests/",
              "web/types/",
          )
          instant_exact = {
              "web/bun.lock",
              "web/next.config.ts",
              "web/package.json",
              "web/playwright.instant.config.ts",
              "web/proxy.ts",
          }
          instant_prefixes = (
              "web/app/",
              "web/data/",
              "web/e2e/instant/",
              "web/i18n/",
              "web/messages/",
          )
          react_exact = {
              "scripts/build-webviews-app.sh",
              "scripts/check-webviews-react-compiler.mjs",
          }
          react_prefixes = (
              "Resources/markdown-viewer/",
              "webviews/",
          )

          db = False
          instant = False
          react_apps = False
          for path in paths:
              if path in all_subareas:
                  db = instant = react_apps = True
                  continue
              if path in db_exact or path.startswith(db_prefixes):
                  db = True
              if (
                  path in instant_exact
                  or path.startswith(instant_prefixes)
                  or path == "web/services/coderouter/vmGuestEnv.ts"
              ):
                  instant = True
              if path in react_exact or path.startswith(react_prefixes):
                  react_apps = True

          emit(db, instant, react_apps)
          PY

  web-typecheck:
    if: ${{ inputs.web == 'true' }}
    runs-on: ${{ vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate managed relay catalog
        run: bun tools/generate-managed-iroh-relay-catalog.ts --check

      - name: Typecheck
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/web-typecheck.log"
          set +e
          bun run typecheck 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          set -e

          # The native TypeScript preview compiler can abort on a healthy
          # runner. Retry that transient compiler crash once, while keeping
          # real type errors as immediate failures.
          if [ "$status" -ne 0 ] \
            && grep -Fq 'Aborted (core dumped)' "$log"; then
            echo "::warning::native tsgo aborted during web typecheck; retrying once"
            bun run typecheck
            exit $?
          fi

          exit "$status"

  web-production-build:
    if: ${{ inputs.web == 'true' }}
    runs-on: ${{ vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Vercel production build
        env:
          RESEND_API_KEY: re_ci_build
          CMUX_FEEDBACK_FROM_EMAIL: ci@example.test
          STACK_SECRET_SERVER_KEY: ci-build-only
          NEXT_PUBLIC_STACK_PROJECT_ID: 00000000-0000-4000-8000-000000000000
          NEXT_PUBLIC_STACK_PUBLISHABLE_CLIENT_KEY: ci-build-only
          DATABASE_URL: postgres://cmux:cmux@127.0.0.1:1/cmux
          DIRECT_DATABASE_URL: postgres://cmux:cmux@127.0.0.1:1/cmux
          CMUX_ANALYTICS_TEST_MODE: "1"
        run: bun run vercel-build

  web-tests:
    if: ${{ inputs.web == 'true' }}
    name: Web tests (${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/4", "2/4", "3/4", "4/4"]
    runs-on: ${{ vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run web test shard
        run: ./scripts/run-tests.sh --shard "${{ matrix.shard }}"

  web-instant-navigation:
    needs: web-subarea-scope
    if: ${{ inputs.web == 'true' && needs.web-subarea-scope.outputs.instant == 'true' }}
    runs-on: ${{ vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('web/bun.lock') }}

      - name: Install browser for instant navigation tests
        run: bunx playwright install --with-deps chromium

      - name: Instant navigation tests
        env:
          # web-typecheck is an independent required sibling in the same
          # reusable workflow, so this browser lane does not launch tsgo again.
          CMUX_INSTANT_SKIP_TYPECHECK: "1"
        run: bun run test:instant

  # Checks for in-app React webviews (currently the diff viewer; more cmux React
  # surfaces will live alongside it).

  react-apps-check:
    needs: web-subarea-scope
    if: ${{ inputs.web == 'true' && needs.web-subarea-scope.outputs.react_apps == 'true' }}
    runs-on: ${{ vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Verify generated webviews assets
        run: ./scripts/build-webviews-app.sh --check

      - name: Verify React Compiler for webviews
        run: ./scripts/check-webviews-react-compiler.mjs

      - name: Typecheck webviews
        working-directory: webviews
        run: bun run typecheck

      - name: Test webviews
        working-directory: webviews
        run: bun run test

      - name: Oxlint webviews
        working-directory: webviews
        run: bun run lint:ci

      - name: React Doctor
        working-directory: webviews
        run: bun run react-doctor:ci

  diff-sidecar-check:
    # Generated protocol and streaming benchmarks also cover webview-only diffs.
    if: ${{ inputs.macos == 'true' || inputs.web == 'true' }}
    runs-on: ${{ vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust
        run: ./scripts/install-rust-ci.sh

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install webview dependencies
        working-directory: webviews
        run: bun install --frozen-lockfile

      - name: Check Rust sidecar
        run: |
          ./scripts/run-diff-sidecar-cargo.sh fmt --manifest-path Native/DiffSidecar/Cargo.toml --all --check
          ./scripts/run-diff-sidecar-cargo.sh clippy --manifest-path Native/DiffSidecar/Cargo.toml --all-targets --locked --no-default-features -- -D warnings
          ./scripts/run-diff-sidecar-cargo.sh clippy --manifest-path Native/DiffSidecar/Cargo.toml --all-targets --all-features --locked -- -D warnings
          ./scripts/run-diff-sidecar-cargo.sh test --manifest-path Native/DiffSidecar/Cargo.toml --all-targets --locked --no-default-features
          ./scripts/run-diff-sidecar-cargo.sh test --manifest-path Native/DiffSidecar/Cargo.toml --all-targets --all-features --locked

      - name: Verify generated protocol types
        run: ./scripts/generate-diff-sidecar-types.sh --check

      - name: Enforce diff-viewer performance budgets
        env:
          CMUX_DIFF_WEB_BENCH_ITERATIONS: "10"
        run: ./scripts/benchmark-diff-viewer.sh

  web-db-migrations:
    needs: web-subarea-scope
    if: ${{ inputs.web == 'true' && needs.web-subarea-scope.outputs.db == 'true' }}
    runs-on: ${{ vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    defaults:
      run:
        working-directory: web
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cmux_test
          POSTGRES_PASSWORD: cmux
          POSTGRES_USER: cmux
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cmux -d cmux_test"
          --health-interval 1s
          --health-timeout 5s
          --health-retries 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply migrations
        env:
          DATABASE_URL: postgres://cmux:cmux@localhost:5432/cmux_test
          DIRECT_DATABASE_URL: postgres://cmux:cmux@localhost:5432/cmux_test
        run: bunx drizzle-kit migrate --config drizzle.config.ts

      - name: Re-apply migrations
        env:
          DATABASE_URL: postgres://cmux:cmux@localhost:5432/cmux_test
          DIRECT_DATABASE_URL: postgres://cmux:cmux@localhost:5432/cmux_test
        run: bunx drizzle-kit migrate --config drizzle.config.ts

      - name: Database behavior tests
        env:
          CMUX_DB_TEST: "1"
          DATABASE_URL: postgres://cmux:cmux@localhost:5432/cmux_test
          DIRECT_DATABASE_URL: postgres://cmux:cmux@localhost:5432/cmux_test
        run: bun run test:db:behavior

  agent-session-web-resources:
    if: ${{ inputs.agent_session_web == 'true' }}
    runs-on: ${{ vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Build and test Agent Session web resources
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run agent-session-web:build
          bun run agent-session-web:test
          git diff --exit-code -- Resources/agent-session-react Resources/agent-session-solid

  web-status:
    name: Web status
    needs:
      - web-subarea-scope
      - web-typecheck
      - web-production-build
      - web-tests
      - web-instant-navigation
      - react-apps-check
      - diff-sidecar-check
      - web-db-migrations
      - agent-session-web-resources
    if: ${{ always() }}
    runs-on: ${{ vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 5
    steps:
      - name: Check routed web jobs
        env:
          WEB_INPUTS: ${{ toJSON(inputs) }}
          WEB_NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          inputs = json.loads(os.environ["WEB_INPUTS"])
          needs = json.loads(os.environ["WEB_NEEDS"])
          for route in ("web", "macos", "agent_session_web"):
              if inputs.get(route) not in {"true", "false"}:
                  print(f"invalid route {route}={inputs.get(route)!r}", file=sys.stderr)
                  sys.exit(1)

          scope = needs["web-subarea-scope"]
          if inputs["web"] == "true":
              if scope["result"] != "success":
                  print(f"web-subarea-scope: {scope['result']}", file=sys.stderr)
                  sys.exit(1)
              subareas = scope.get("outputs", {})
              for name in ("db", "instant", "react_apps"):
                  if subareas.get(name) not in {"true", "false"}:
                      print(f"invalid web subarea {name}={subareas.get(name)!r}", file=sys.stderr)
                      sys.exit(1)
          else:
              subareas = {"db": "false", "instant": "false", "react_apps": "false"}

          required = {
              "web-subarea-scope": inputs["web"] == "true",
              "web-typecheck": inputs["web"] == "true",
              "web-production-build": inputs["web"] == "true",
              "web-tests": inputs["web"] == "true",
              "web-instant-navigation": inputs["web"] == "true" and subareas["instant"] == "true",
              "react-apps-check": inputs["web"] == "true" and subareas["react_apps"] == "true",
              "diff-sidecar-check": inputs["macos"] == "true" or inputs["web"] == "true",
              "web-db-migrations": inputs["web"] == "true" and subareas["db"] == "true",
              "agent-session-web-resources": inputs["agent_session_web"] == "true",
          }
          bad = {}
          for job, is_required in sorted(required.items()):
              result = needs[job]["result"]
              if is_required:
                  if result != "success":
                      bad[job] = result
              elif result not in {"success", "skipped"}:
                  bad[job] = result
          if bad:
              for job, result in bad.items():
                  print(f"{job}: {result}", file=sys.stderr)
              sys.exit(1)
          for job, is_required in sorted(required.items()):
              print(f"{job}: required={str(is_required).lower()} result={needs[job]['result']}")
          PY
