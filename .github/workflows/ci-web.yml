        shell: bash
        run: |
          d="${BUN_INSTALL_CACHE_DIR:-$HOME/.bun/install/cache}"
          if [[ "${RESTORE_ON_WARM:-}" != 1 && -n "$(find "$d" -mindepth 1 -maxdepth 1 -print -quit 2>/dev/null)" ]]; then
            echo "warm=true" >> "$GITHUB_OUTPUT"
            echo "$d is already filled from this runner's earlier jobs; the cache archive is not unpacked over it"
          fi
        env:
          RESTORE_ON_WARM: ${{ vars.CI_BUN_CACHE_RESTORE_WARM }}

      - name: Cache Bun package cache
        timeout-minutes: 3
        continue-on-error: true
        if: ${{ github.ref == 'refs/heads/feat-cmux-next' }}
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.bun/install/cache
          key: bun-web-shared-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('web/bun.lock', 'webviews/bun.lock', 'cmux-tui/frontends/web/bun.lock', 'scripts/react-doctor/bun.lock', 'agent-chat/bun.lock', 'backend/bun.lock') }}
          restore-keys: bun-web-shared-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache Bun package cache (restore only off feat-cmux-next)
        timeout-minutes: 3
        continue-on-error: true
        if: ${{ (github.ref != 'refs/heads/feat-cmux-next') && steps.bun-warm.outputs.warm != 'true' }}
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.bun/install/cache
          key: bun-web-shared-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('web/bun.lock', 'webviews/bun.lock', 'cmux-tui/frontends/web/bun.lock', 'scripts/react-doctor/bun.lock', 'agent-chat/bun.lock', 'backend/bun.lock') }}
          restore-keys: bun-web-shared-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run web test shard
        id: shard
        # The JUnit report feeds scripts/ci/web_test_failure_census.py. bun
        # still prints its usual output; it refuses to write the report into a
        # missing directory, so the directory comes first.
        run: |
          report_dir="$RUNNER_TEMP/web-test-junit"
          mkdir -p "$report_dir"
          shard="${{ matrix.shard }}"
          echo "index=${shard%%/*}" >> "$GITHUB_OUTPUT"
          ./scripts/run-tests.sh --shard "${{ matrix.shard }}" --reporter=junit --reporter-outfile="$report_dir/junit.xml"

      # Only failed shards upload, so one repository-wide artifact listing per
      # name finds every failure in a window. The attempt keeps a re-run from
      # colliding with the report of the attempt it re-ran.
      - name: Upload failed shard JUnit report
        if: ${{ failure() && steps.shard.outputs.index != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-test-junit-shard${{ steps.shard.outputs.index }}-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/web-test-junit/junit.xml
          if-no-files-found: ignore
          retention-days: 7

  # The agent pane against the real acpmux daemon (webviews/test/support/realAcpmux.ts): a new chat
  # settles with no layout shift, and the model, effort and access picks hold through a first send,
  # a reload, a daemon restart and a harness switch. Leo, 2026-11-17: "we need to test out more of
  # these permission related combinations in ci and whatnot so things are as people would expect".
  # The webview shards build no Rust, so these files skip there; this job builds acpmux and sets
  # CMUX_REAL_ACPMUX=1, which fails a file that cannot run instead of skipping it.
  agent-pane-real-acpmux:
    needs: web-subarea-scope
    # A feat-cmux-next pull request runs this job's commands as the ci/steps.toml step `agent-pane-real-acpmux` (pr-pipeline.yml's
    # web-browser job); a push, dispatch, the post-merge batch and a pull request into any other base still run them
    # here. Web status counts the skip as fine only on such a pull request.
    if: ${{ inputs.web == 'true' && needs.web-subarea-scope.outputs.agent_pane == 'true' && (inputs.only == '' || inputs.only == 'agent-pane-real-acpmux') && (github.event_name != 'pull_request' || github.base_ref != 'feat-cmux-next') }}
    name: Agent pane on real acpmux
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || 'cmux-linux' }}
    timeout-minutes: 30
    env:
      # A slow link to the cache store must lose to a cold install, not eat the job's 30 minutes. On the controller
      # timing feed (2026-11-23 00:10-06:10Z, 369 jobs, 95 runner-h) the 1.1 GB Bun package cache restored at about
      # 1-2 MB/s on fsr-* and the pool's hs/hx/hd runners: 600-955 s at the median, then "Failed to restore: Server
      # failed to authenticate" at 10 minutes, where a cold `bun install` took 3-24 s. 70 of the 78 jobs with such a
      # restore were cut at the 30-minute timeout (35 runner-h of the 95). actions/cache (and rust-cache, which uses
      # it) gives up on a 128 MB segment that takes longer than this and restores nothing, so a restore under about
      # 2 MB/s costs a minute; the fast pools restore the same entry in 26-43 s and are untouched.
      SEGMENT_DOWNLOAD_TIMEOUT_MINS: "1"
    steps:
      # Why: docs/ci/cmux-next-workflow-notes.md#note-stall-step-bounds (a stalled runner fails in minutes)
      - name: Checkout
        timeout-minutes: 6
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.sha || '' }}
          persist-credentials: false

      - name: Restore pinned Bun 1.4.4 from the CI cache bucket
        shell: bash
        continue-on-error: true
        run: bash "$GITHUB_WORKSPACE/scripts/ci/toolchain-r2.sh" restore bun 1.4.4 || true

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
          no-cache: ${{ !startsWith(github.workspace, '/home/runner/work/') || !(github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && github.event_name != 'merge_group' && contains(fromJSON('["refs/heads/main","refs/heads/feat-cmux-next","refs/heads/nightly-next"]'), github.ref)) }}

      - name: Use the VM runner guest Bun cache
        id: fsr-bun-cache
        timeout-minutes: 2
        if: ${{ startsWith(runner.name, 'fsr-') }}
        run: bash scripts/ci/fsr-bun-cache.sh check bun-webviews webviews/bun.lock

      # Why: docs/ci/cmux-next-workflow-notes/2026-11-26-bun-cache-warm.md (detector: tests/test_ci_bun_cache_warm.py).
      - name: Is this runner's own Bun package cache warm
        id: bun-warm
        timeout-minutes: 1
        shell: bash
        run: |
          d="${BUN_INSTALL_CACHE_DIR:-$HOME/.bun/install/cache}"
          if [[ "${RESTORE_ON_WARM:-}" != 1 && -n "$(find "$d" -mindepth 1 -maxdepth 1 -print -quit 2>/dev/null)" ]]; then
            echo "warm=true" >> "$GITHUB_OUTPUT"
            echo "$d is already filled from this runner's earlier jobs; the cache archive is not unpacked over it"
          fi
        env:
          RESTORE_ON_WARM: ${{ vars.CI_BUN_CACHE_RESTORE_WARM }}

      - name: Cache Bun package cache
        timeout-minutes: 3
        continue-on-error: true
        if: ${{ github.ref == 'refs/heads/feat-cmux-next' && steps.fsr-bun-cache.outputs.hit != 'true' }}
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.bun/install/cache
          key: bun-web-shared-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('web/bun.lock', 'webviews/bun.lock', 'cmux-tui/frontends/web/bun.lock', 'scripts/react-doctor/bun.lock', 'agent-chat/bun.lock', 'backend/bun.lock') }}
          restore-keys: bun-web-shared-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache Bun package cache (restore only off feat-cmux-next)
        timeout-minutes: 3
        continue-on-error: true
        if: ${{ (github.ref != 'refs/heads/feat-cmux-next' && steps.fsr-bun-cache.outputs.hit != 'true') && steps.bun-warm.outputs.warm != 'true' }}
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.bun/install/cache
          key: bun-web-shared-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('web/bun.lock', 'webviews/bun.lock', 'cmux-tui/frontends/web/bun.lock', 'scripts/react-doctor/bun.lock', 'agent-chat/bun.lock', 'backend/bun.lock') }}
          restore-keys: bun-web-shared-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Install webviews dependencies
        working-directory: webviews
        run: bun install --frozen-lockfile

      - name: Set up pinned Rust
        timeout-minutes: 8
        uses: ./.github/actions/setup-cmux-tui-rust

      - name: Cache cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Why: docs/ci/cmux-next-workflow-notes.md#note-210 (pool runners keep different leftover toolchains)
          add-rust-environment-hash-key: false
          cache-bin: false
          shared-key: agent-pane-real-acpmux-${{ hashFiles('cmux-tui/rust-toolchain.toml', 'cmux-tui/Cargo.lock', '.cargo/config.toml') }}
          # A feat-cmux-next push saves; a pull request restores only. `|| github.base_ref == 'feat-cmux-next'` saved a
          # copy per pull request that only that pull request reads: 114 entries, 53 GB written in 6 h (2026-11-24, RFD 0148 row 19).
          save-if: ${{ github.ref == 'refs/heads/feat-cmux-next' }}
          workspaces: cmux-tui -> target

      - name: Build acpmux
        working-directory: cmux-tui
        env:
          # The pane checks drive the daemon; nobody reads its full debuginfo here. Line tables keep a panic's
          # backtrace readable and skip most of the debug codegen and link of the workspace crates (opt-level 1 in
          # profile.dev), the bulk of this step's ~5 minutes on every run (dependencies already build without it).
          CARGO_PROFILE_DEV_DEBUG: line-tables-only
        run: |
          cargo build --locked -p acpmux --bin acpmux
          # CARGO_TARGET_DIR (a fleet runner's shared target) moves the binary out of cmux-tui/target.
          target_dir="$(cargo metadata --format-version 1 --no-deps | python3 -c 'import json,sys; print(json.load(sys.stdin)["target_directory"])')"
          echo "ACPMUX_BIN=$target_dir/debug/acpmux" >> "$GITHUB_ENV"

      - name: Cache Playwright's apt packages
        continue-on-error: true
        uses: ./.github/actions/playwright-apt-cache
        with:
          engines: chromium-webkit

      - name: Install headless engines
        working-directory: webviews
        run: bash "$(git rev-parse --show-toplevel)/scripts/ci/apt-no-service-restarts.sh" && ./node_modules/.bin/playwright install --with-deps webkit && bash "$(git rev-parse --show-toplevel)/scripts/ci/ensure-system-chrome.sh"

      - name: Run the real-daemon pane checks
        working-directory: webviews
        env:
          CMUX_REAL_ACPMUX: "1"
          CMUX_BROWSER_TESTS: "1"
          FAST_CHECKS_OUT: ${{ runner.temp }}/agent-pane-real-acpmux
          # Both files share one cache of the React Compiler's output (reactCompiler.mjs), as
          # scripts/ci/run-webviews-tests.sh gives every other web file: without it each file's Vite
          # compiles the pane again (cold warm-up 37-60 s on a 16-core VM, past warmDevServer's 100 s
          # on a busy runner), and with it the second file warms in about 10 s.
          CMUX_VITE_TRANSFORM_CACHE: ${{ runner.temp }}/vite-transforms
        run: |
          status=0
          for file in test/agent-pane-new-chat-settles.test.ts test/agent-pane-picks-hold.test.ts; do
            echo "::group::$file"
            bun test "$file" || status=1
            echo "::endgroup::"
          done
          exit "$status"

      - name: Mark these agent pane inputs green
        if: ${{ success() && github.event_name == 'pull_request' && needs.web-subarea-scope.outputs.agent_key != '' }}
        continue-on-error: true
        run: mkdir -p "$RUNNER_TEMP/agent-green-marker" && date -u > "$RUNNER_TEMP/agent-green-marker/passed"

      - name: Save the agent pane green marker
        if: ${{ success() && github.event_name == 'pull_request' && needs.web-subarea-scope.outputs.agent_key != '' }}
        continue-on-error: true
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/agent-green-marker
          key: webviews-agent-green-${{ needs.web-subarea-scope.outputs.agent_key }}

      - name: Upload the measurements
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-pane-real-acpmux-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/agent-pane-real-acpmux
          if-no-files-found: ignore
          retention-days: 3

  web-instant-navigation:
    needs: web-subarea-scope
    # A feat-cmux-next pull request runs this job's commands as the ci/steps.toml step `web-instant-navigation` (pr-pipeline.yml's
    # web-browser job); a push, dispatch, the post-merge batch and a pull request into any other base still run them
    # here. Web status counts the skip as fine only on such a pull request.
    if: ${{ inputs.web == 'true' && needs.web-subarea-scope.outputs.instant == 'true' && (inputs.only == '' || inputs.only == 'web-instant-navigation') && (github.event_name != 'pull_request' || github.base_ref != 'feat-cmux-next') }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || 'cmux-linux' }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.sha || '' }}
          persist-credentials: false

      - name: Restore pinned Bun 1.4.4 from the CI cache bucket
        shell: bash
        continue-on-error: true
        run: bash "$GITHUB_WORKSPACE/scripts/ci/toolchain-r2.sh" restore bun 1.4.4 || true

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
          no-cache: ${{ !startsWith(github.workspace, '/home/runner/work/') || !(github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && github.event_name != 'merge_group' && contains(fromJSON('["refs/heads/main","refs/heads/feat-cmux-next","refs/heads/nightly-next"]'), github.ref)) }}

      # Why: docs/ci/cmux-next-workflow-notes/2026-11-26-bun-cache-warm.md (detector: tests/test_ci_bun_cache_warm.py).
      - name: Is this runner's own Bun package cache warm
        id: bun-warm
        timeout-minutes: 1
        shell: bash
        run: |
          d="${BUN_INSTALL_CACHE_DIR:-$HOME/.bun/install/cache}"
          if [[ "${RESTORE_ON_WARM:-}" != 1 && -n "$(find "$d" -mindepth 1 -maxdepth 1 -print -quit 2>/dev/null)" ]]; then
            echo "warm=true" >> "$GITHUB_OUTPUT"
            echo "$d is already filled from this runner's earlier jobs; the cache archive is not unpacked over it"
          fi
        env:
          RESTORE_ON_WARM: ${{ vars.CI_BUN_CACHE_RESTORE_WARM }}

      - name: Cache Bun package cache
        timeout-minutes: 3
        continue-on-error: true
        if: ${{ github.ref == 'refs/heads/feat-cmux-next' }}
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.bun/install/cache
          key: bun-web-shared-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('web/bun.lock', 'webviews/bun.lock', 'cmux-tui/frontends/web/bun.lock', 'scripts/react-doctor/bun.lock', 'agent-chat/bun.lock', 'backend/bun.lock') }}
          restore-keys: bun-web-shared-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache Bun package cache (restore only off feat-cmux-next)
        timeout-minutes: 3
        continue-on-error: true
        if: ${{ (github.ref != 'refs/heads/feat-cmux-next') && steps.bun-warm.outputs.warm != 'true' }}
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.bun/install/cache
          key: bun-web-shared-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('web/bun.lock', 'webviews/bun.lock', 'cmux-tui/frontends/web/bun.lock', 'scripts/react-doctor/bun.lock', 'agent-chat/bun.lock', 'backend/bun.lock') }}
          restore-keys: bun-web-shared-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache Playwright browsers
        if: ${{ github.ref == 'refs/heads/feat-cmux-next' }}
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('web/bun.lock') }}

      - name: Cache Playwright browsers (restore only off feat-cmux-next)
        if: ${{ github.ref != 'refs/heads/feat-cmux-next' }}
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('web/bun.lock') }}

      - name: Cache Playwright's apt packages
        uses: ./.github/actions/playwright-apt-cache
        with:
          engines: chromium

      - name: Install browser for instant navigation tests
        run: bash "$(git rev-parse --show-toplevel)/scripts/ci/ensure-system-chrome.sh"

      - name: Instant navigation tests
        env:
          # web-typecheck is an independent required sibling in the same
          # reusable workflow, so this browser lane does not launch tsgo again.
          CMUX_INSTANT_SKIP_TYPECHECK: "1"
        run: bun run test:instant

  # Checks for in-app React webviews (currently the diff viewer; more cmux React
  # surfaces will live alongside it).

  # One immutable build per source tree and run attempt, shared by every React shard.
  react-apps-head-bundles:
    needs: web-subarea-scope
    if: ${{ github.event_name == 'pull_request' && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci') || (github.event.pull_request.draft == true && (vars.CI_DRAFT_CHEAP_TIER || '1') == '0') || (github.event.pull_request.draft != true && ((contains(github.event.pull_request.labels.*.name, 'ready-to-land') && vars.CI_LAND_FULL_PER_PR == '1') || github.event.pull_request.base.ref != 'feat-cmux-next' || github.event.pull_request.head.repo.full_name != github.repository || (vars.CI_LAND_TIER || '1') == '0'))) && inputs.web == 'true' && needs.web-subarea-scope.outputs.react_apps == 'true' && needs.web-subarea-scope.outputs.react_fleet != 'true' && (inputs.only == '' || inputs.only == 'react-apps-check-shard') }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/cmux-next-compile-preflight.yml
    with:
      force_web: true
      source_ref: ${{ inputs.sha || github.sha }}
      artifact_prefix: ci-web-head-bundles

  react-apps-check-shard:
    needs: [web-subarea-scope, react-apps-head-bundles]
    # A feat-cmux-next pull request whose pick runs only touched tests (react_fleet, scripts/ci/react_apps_fleet.py)
    # runs this check as the ci/steps.toml step `react-apps-check` (pr-pipeline.yml's web-browser job) instead.
    # Land tier (#54886): a feat-cmux-next pull request head not handed to land skips it; the `ready-to-land`
    # label re-runs it at the same head. Leo, 2026-11-23: "de facto, im asking for 99% fewer minutes of ci time, period."
    # react-apps-base-check and webviews-test-durations skip with it; react-apps-check and Web status still report.
    if: ${{ !cancelled() && needs.web-subarea-scope.result == 'success' && (github.event_name != 'pull_request' || needs.react-apps-head-bundles.result == 'success') && (github.event_name != 'pull_request' || (contains(github.event.pull_request.labels.*.name, 'full-ci') && (github.event.pull_request.base.ref != 'feat-cmux-next' || (github.event.action == 'labeled' && github.event.label.name == 'full-ci') || (vars.CI_FULL_CI_ONE_SHOT || '1') == '0')) || (github.event.pull_request.draft == true && (vars.CI_DRAFT_CHEAP_TIER || '1') == '0') || (github.event.pull_request.draft != true && ((contains(github.event.pull_request.labels.*.name, 'ready-to-land') && vars.CI_LAND_FULL_PER_PR == '1') || github.event.pull_request.base.ref != 'feat-cmux-next' || github.event.pull_request.head.repo.full_name != github.repository || (vars.CI_LAND_TIER || '1') == '0'))) && inputs.web == 'true' && needs.web-subarea-scope.outputs.react_apps == 'true' && needs.web-subarea-scope.outputs.react_fleet != 'true' && (inputs.only == '' || inputs.only == 'react-apps-check-shard') }}
    # `bun test` grows memory across the suite and was SIGKILLed (exit 137) on the
    # 4 vCPU runner (run 37666132324). 16 vCPU has the memory and runs 16 files
    # and 4 dev-server files at once (run-webviews-tests.sh). These shards were the
    # largest Blacksmith spend (about 99k 32 vCPU minutes a day, 2026-10-29/30);
    # the 16 vCPU shards of the same days took 14% longer at p50 (1107 s against
    # 972 s, pull requests) for half the per-minute price, the longest 2139 s, under
    # the 40 min timeout. Fork pull requests run the same suite on the hosted runner.
    # A same-repository run reads the 4 vCPU pool (RUNNER_POOLS.linux_4), not linux_16: on 2026-11-18 the
    # pool writer marked 8, 16 and 32 vCPU dead and linux_16 held 2 vCPU, where these shards and
    # react-apps-base-early queued over an hour (run 44304196887 attempt 2) while 4 vCPU started them.
    # The widths and minutes below fit whatever size the pool holds.
    # A post-merge batch or probe (cmux-next-post-merge.yml, a workflow_dispatch with a mode) reads the owned gate
    # runner as a push does. It read linux_4 before: on 2026-11-22 its 12 shards ran 2 files at once on
    # the 4 vCPU pool for 39-71 min of tests each, about 722 runner-minutes a batch run (runs 44990794651 and
    # 44991513044), where a pull request's shards on the owned runner take 13-15 min.
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || vars.CI_REACT_SHARD_RUNNER || 'cmux-linux' }}
    # The 10-minute siblings in this workflow, plus the browser engines and the
    # browser-lane suites they run. The full suite grew to 22 min in one process.
    # Deterministic file shards keep per-file isolation. Each shard warms one
    # Vite cache per dev-server config, cold, so many small shards each paid
    # that warm-up and ran their dev-server files two at a time: 12 shards on
    # 8 vCPU took 14.3 min (run 39347314726), barely under 2 shards' 15.5.
    # Fewer, wider shards share each warm cache across more files.
    # On 16 vCPU a shard runs its dev-server files 4 at a time, and they are
    # most of its wall time: 4 shards took 18-26 min of "Test webviews" each
    # (run 41236343549), the long pole from ask to merge for a webview fix.
    # 8 shards halve each shard's dev-server files for about 2 min more setup
    # and Vite warm-up per added shard (Leo, 2026-10-31: a straightforward fix
    # lands within the hour).
    # 12 shards: at 8 the split balanced every shard to about 1000 s of tests
    # (runs 43338660731 to 43342364793: Test webviews 849-1072 s on a shard with
    # no retries, about 130 s of setup), so the verdict could not come 20 min
    # after a push. The same split over run 43342256133's manifest gives 690 s a
    # shard at 12, for about 9% more runner minutes (12 x 820 s against 8 x 1133 s).
    # Back to 8 on 2026-11-22 (REACT_APPS_SHARDS): those 9% outweigh the 5 min, now that a pull request runs
    # shard 1 (with its touched tests) and only full-matrix runs feel the count.
    # The widths in Test webviews are declared for 16 vCPU (CMUX_WEB_TEST_SIZED_FOR_VCPU); a runner
    # with fewer cores runs its files at that share of them, so a shard on 4 vCPU runs 2 at a time,
    # about 4x the 690 s of tests plus a slower setup, and on 2 vCPU 1 at a time, about 8x. 40 min is
    # the 16 vCPU arm's (a fork pull request); the 4 vCPU arms get 90, and 150 while the linux_4 pool
    # holds 2 vCPU. At 40, every shard of run 44249075431 (attempt 2) and shards 1, 4, 6 and 8 of run
    # 44258208231 hit the limit on small runners, still testing. A fork's run reads no variables, so
    # its arms come first. The anchor hands these minutes to Test webviews, whose retry deadline is
    # measured from them.
    # A dispatch (the post-merge batch tick, the full suite of the base) gets 45: the ticks of 11-22 to 11-24 ran 8
    # shards to the 90 minute limit, 100% red (about 5,760 shard minutes a day), because a red base never turns
    # green by waiting; the retry deadline follows these minutes, so a red file stays red and the tick ends sooner.
    # actions: read: a pull request's shard downloads the files that passed at its previous head (an artifact).
    permissions:
      contents: read
      actions: read
      id-token: write
    timeout-minutes: &webview-shard-minutes ${{ github.repository_owner != 'manaflow-ai' && 90 || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 90 || contains(fromJSON(vars.RUNNER_POOLS).linux_4, '-2vcpu-') && 150 || github.event_name == 'workflow_dispatch' && 45 || 90 }}
    name: react-apps-check (${{ matrix.shard }})
    strategy:
      fail-fast: false
      # REACT_APPS_SHARDS (web-subarea-scope's Pick the react-apps-check shards): every shard on a push, a pull
      # request's picked ones (shard 1 always).
      matrix:
        include: ${{ fromJSON(needs.web-subarea-scope.outputs.react_shards) }}
    steps:
      # timeout-minutes count from the job's start, not from Test webviews': its retry
      # deadline is measured from this stamp (#46488 F1: about 8 min of setup runs first).
      - name: Record the job start
        run: echo "CMUX_WEB_TEST_JOB_STARTED=$(date +%s)" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.sha || '' }}
          # A pull request's merge commit with its parents: ui-rules and gallery
          # coverage fail the PR only for its own findings (test/support/prScope.ts).
          fetch-depth: ${{ github.event_name == 'pull_request' && '2' || '1' }}
          persist-credentials: false

      # The run's one manifest, from web-subarea-scope. No fallback: a shard
      # that split without it would disagree with its siblings.
      - name: Download the duration manifest
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: webviews-test-durations
          path: ${{ runner.temp }}/webviews-durations

      - name: List the pull request's files
        if: github.event_name == 'pull_request'
        run: |
          git diff --name-only --no-renames HEAD^1 HEAD > "$RUNNER_TEMP/pr-changed-files"
          echo "CMUX_PR_CHANGED_FILES=$RUNNER_TEMP/pr-changed-files" >> "$GITHUB_ENV"

      # Whether Test webviews runs no test file here: the rule it applies (a fast push, or shard 1's --direct-out entry
      # an empty list) read up front, so this job skips the Playwright browsers, their apt packages and the engines,
      # which only the test files use (about 30 s of shard 1's job 137332637156). Over 11-22 20Z to 11-23 02Z the
      # median shard 1 job ran no test file. Any doubt (no file, no entry, an unreadable map) installs them as before.
      - name: Does this shard run a test file
        id: shard-tests
        if: ${{ matrix.shard == 1 && github.event_name == 'pull_request' && !(contains(github.event.pull_request.labels.*.name, 'full-ci') && (github.event.pull_request.base.ref != 'feat-cmux-next' || (github.event.action == 'labeled' && github.event.label.name == 'full-ci') || (vars.CI_FULL_CI_ONE_SHOT || '1') == '0')) }}
        env:
          REACT_APPS_CLASS: ${{ needs.web-subarea-scope.outputs.react_class }}
        run: |
          none=false
          if [ "$REACT_APPS_CLASS" = fast ] ||
            python3 -c 'import json,sys; sys.exit(0 if json.load(open(sys.argv[1])).get("1", "-") == [] else 1)' \
              "$RUNNER_TEMP/webviews-durations/pr-shard-direct.json" 2> /dev/null; then
            none=true
          fi
          echo "shard ${{ matrix.shard }} runs no test file: $none"
          echo "none=$none" >> "$GITHUB_OUTPUT"

      # A Freestyle react-class runner (CI_REACT_SHARD_RUNNER) boots from a snapshot that already
      # holds Bun's package cache, the Playwright browsers and their apt packages, and names them
      # in the runner's environment. The runner's environment is not the workflow `env` context,
      # so a shell step reads it. Anywhere else this prints warm=false and the caches restore.
      - name: Read the runner's warm react caches
        id: warm-react
        run: |
          if [ -n "${CMUX_WARM_REACT:-}" ] && [ -d "${BUN_INSTALL_CACHE_DIR:-/nonexistent}" ] && [ -d "${PLAYWRIGHT_BROWSERS_PATH:-/nonexistent}" ]; then
            echo "warm react caches $CMUX_WARM_REACT: $BUN_INSTALL_CACHE_DIR $PLAYWRIGHT_BROWSERS_PATH"
            echo "warm=true" >> "$GITHUB_OUTPUT"
          else
            echo "warm=false" >> "$GITHUB_OUTPUT"
          fi

      # Same-input receipt (scripts/ci/react_shard_receipt.py): this shard already went green on exactly these inputs
      # (the merge commit's and its parent's input files (the ones whose change runs this check), this run's shard handoff, the shard and the run's
      # configuration), so it restores that run's head results and skips every step that would compute them again.
      # Same-repository pull requests only; any error fails open and the shard runs in full. A push always runs.
      - name: Key this shard's same-input receipt
        id: receipt-key
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && (vars.CI_REACT_SHARD_RECEIPT || '1') != '0' }}
        continue-on-error: true
        env:
          RECEIPT_SHARD: ${{ matrix.shard }}
          RECEIPT_CONFIG: ${{ format('{0}|full-ci={1}|base={2}|{3}-{4}', toJSON(matrix), (contains(github.event.pull_request.labels.*.name, 'full-ci') && (github.event.pull_request.base.ref != 'feat-cmux-next' || (github.event.action == 'labeled' && github.event.label.name == 'full-ci') || (vars.CI_FULL_CI_ONE_SHOT || '1') == '0')), github.base_ref, runner.os, runner.arch) }}
          # The key hashes the files whose change runs this check (web_subareas.is_react_input), not every file, so a
          # push that touches none of them hits the receipt of the same inputs; 0 keys the whole trees as before.
          RECEIPT_INPUT_SCOPE: ${{ vars.CI_REACT_RECEIPT_INPUT_SCOPE || '1' }}
        run: |
          whole=()
          [ "$RECEIPT_INPUT_SCOPE" = 0 ] && whole=(--whole-tree)
          python3 scripts/ci/react_shard_receipt.py key --shard "$RECEIPT_SHARD" --handoff "$RUNNER_TEMP/webviews-durations" --config "$RECEIPT_CONFIG" "${whole[@]}" >> "$GITHUB_OUTPUT"

      - name: Look up this shard's same-input receipt
        id: receipt-restore
        if: ${{ steps.receipt-key.outputs.key != '' }}
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .same-tree/react-shard-receipt
          key: ${{ steps.receipt-key.outputs.key }}

      - name: Use the receipt's results
        id: receipt
        if: ${{ steps.receipt-restore.outputs.cache-hit == 'true' }}
        continue-on-error: true
        env:
          RECEIPT_KEY: ${{ steps.receipt-key.outputs.key }}
        run: python3 scripts/ci/react_shard_receipt.py check --key "$RECEIPT_KEY" --receipt "$GITHUB_WORKSPACE/.same-tree/react-shard-receipt" --results "$RUNNER_TEMP/webviews-head-results" >> "$GITHUB_OUTPUT"

      - name: Restore pinned Bun 1.4.4 from the CI cache bucket
        if: ${{ steps.receipt.outputs.hit != 'true' }}
        shell: bash
        continue-on-error: true
        run: bash "$GITHUB_WORKSPACE/scripts/ci/toolchain-r2.sh" restore bun 1.4.4 || true

      - name: Setup Bun
        if: ${{ steps.receipt.outputs.hit != 'true' }}
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
          no-cache: ${{ !startsWith(github.workspace, '/home/runner/work/') || !(github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && github.event_name != 'merge_group' && contains(fromJSON('["refs/heads/main","refs/heads/feat-cmux-next","refs/heads/nightly-next"]'), github.ref)) }}

      - name: Use the VM runner guest Bun cache
        id: fsr-bun-cache
        timeout-minutes: 2
        if: ${{ startsWith(runner.name, 'fsr-') }}
        run: bash scripts/ci/fsr-bun-cache.sh check bun-webviews webviews/bun.lock

      # Why: docs/ci/cmux-next-workflow-notes/2026-11-26-bun-cache-warm.md (detector: tests/test_ci_bun_cache_warm.py).
      - name: Is this runner's own Bun package cache warm
        id: bun-warm
        timeout-minutes: 1
        shell: bash
        run: |
          d="${BUN_INSTALL_CACHE_DIR:-$HOME/.bun/install/cache}"
          if [[ "${RESTORE_ON_WARM:-}" != 1 && -n "$(find "$d" -mindepth 1 -maxdepth 1 -print -quit 2>/dev/null)" ]]; then
            echo "warm=true" >> "$GITHUB_OUTPUT"
            echo "$d is already filled from this runner's earlier jobs; the cache archive is not unpacked over it"
          fi
        env:
          RESTORE_ON_WARM: ${{ vars.CI_BUN_CACHE_RESTORE_WARM }}

      # The source build installs webviews dependencies before the test suite;
      # cache Bun's package blobs on this lane so a new source key
      # does not redownload the lockfile from scratch.
      - name: Cache Bun package cache
        timeout-minutes: 3
        continue-on-error: true
        if: ${{ ((steps.receipt.outputs.hit != 'true') && steps.warm-react.outputs.warm != 'true' && github.ref == 'refs/heads/feat-cmux-next') && steps.fsr-bun-cache.outputs.hit != 'true' }}
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.bun/install/cache
          key: bun-web-shared-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('web/bun.lock', 'webviews/bun.lock', 'cmux-tui/frontends/web/bun.lock', 'scripts/react-doctor/bun.lock', 'agent-chat/bun.lock', 'backend/bun.lock') }}
          restore-keys: bun-web-shared-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache Bun package cache (restore only off feat-cmux-next)
        timeout-minutes: 3
        continue-on-error: true
        if: ${{ (((steps.receipt.outputs.hit != 'true') && steps.warm-react.outputs.warm != 'true' && github.ref != 'refs/heads/feat-cmux-next') && steps.fsr-bun-cache.outputs.hit != 'true') && steps.bun-warm.outputs.warm != 'true' }}
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.bun/install/cache
          key: bun-web-shared-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('web/bun.lock', 'webviews/bun.lock', 'cmux-tui/frontends/web/bun.lock', 'scripts/react-doctor/bun.lock', 'agent-chat/bun.lock', 'backend/bun.lock') }}
          restore-keys: bun-web-shared-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache Playwright browsers
        if: ${{ (steps.receipt.outputs.hit != 'true') && steps.warm-react.outputs.warm != 'true' && github.ref == 'refs/heads/feat-cmux-next' }}
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-webviews-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('webviews/bun.lock') }}

      - name: Cache Playwright browsers (restore only off feat-cmux-next)
        if: ${{ (steps.receipt.outputs.hit != 'true') && github.ref != 'refs/heads/feat-cmux-next' && steps.shard-tests.outputs.none != 'true' && steps.warm-react.outputs.warm != 'true' }}
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-webviews-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('webviews/bun.lock') }}

      # `vp check` runs on Node and needs ^22.18 or ^24.11; bun still installs.
      - name: Restore pinned Node 24.22.1 from the CI cache bucket
        if: ${{ steps.receipt.outputs.hit != 'true' }}
        shell: bash
        continue-on-error: true
        run: bash "$GITHUB_WORKSPACE/scripts/ci/toolchain-r2.sh" restore node 24.22.1 || true

      - name: Setup Node
        timeout-minutes: 5
        if: ${{ steps.receipt.outputs.hit != 'true' }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.22.1"

      # The web bundles are build output (cx-vn5): this builds them into the
      # gitignored resource paths that the budget, React Compiler and webviews
      # tests below read. Typecheck runs once in the dedicated step below.
      # Every step from here to the tests records its outcome and keeps going;
      # the last step fails the job on any of them. One red never hides another:
      # #23763 (2026-10-21) merged its own TS2339 because a base red in the bundle
      # build skipped the type check and the tests after it.
      - name: Verify webviews source checks
        id: source-build
        if: ${{ steps.receipt.outputs.hit != 'true' }}
        continue-on-error: true
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            exec ./scripts/build-webviews-app.sh --check --skip-typecheck
          fi
          ./scripts/check-webviews-bun-version.sh
          (cd webviews && bun run verify:tanstack-router)

      # All shards install the producer's immutable same-run output, verified against this checkout's source key.
      - name: Source key of the web bundles
        id: web-bundle-key
        if: ${{ steps.receipt.outputs.hit != 'true' }}
        continue-on-error: true
        run: echo "key=$(python3 scripts/cmux-next/web-bundle-key.py . --source)" >> "$GITHUB_OUTPUT"

      # Keep historical post-merge/probe checkouts on their existing cache/build path: they may predate the helper.
      - name: Look up non-PR bundles built for this source key
        id: non-pr-web-bundle-cache
        if: ${{ github.event_name != 'pull_request' && steps.web-bundle-key.outputs.key != '' }}
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: web-bundles-out
          key: cmux-next-web-bundles-v1-${{ steps.web-bundle-key.outputs.key }}
          enableCrossOsArchive: true

      - name: Download the head bundles from R2
        id: web-bundle-cache
        continue-on-error: true
        if: ${{ steps.receipt.outputs.hit != 'true' && needs.react-apps-head-bundles.outputs.web_bundle_transport == 'r2' }}
        timeout-minutes: 3
        uses: ./.github/actions/r2-artifact/download
        with:
          name: ${{ needs.react-apps-head-bundles.outputs.web_bundle_artifact }}
          path: ${{ runner.temp }}/ci-web-head-bundles

      - name: Download the head bundles without OIDC
        continue-on-error: true
        if: ${{ steps.receipt.outputs.hit != 'true' && needs.react-apps-head-bundles.outputs.web_bundle_transport == 'github' }}
        timeout-minutes: 3
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ${{ needs.react-apps-head-bundles.outputs.web_bundle_artifact }}
          path: ${{ runner.temp }}/ci-web-head-bundles

      - name: Build the web bundles
        id: bundles
        if: ${{ steps.receipt.outputs.hit != 'true' }}
        continue-on-error: true
        env:
          RESTORED: ${{ steps.non-pr-web-bundle-cache.outputs.cache-hit == 'true' && 'web-bundles-out' || '' }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            if [ -n "$RESTORED" ] && [ -d "$RESTORED" ]; then
              if (cd webviews && bun scripts/pages/gen-strings.mjs) && ./scripts/cmux-next/build-web-bundles.sh --from "$RESTORED"; then
                rm -rf "$RESTORED"
                exit 0
              fi
              rm -rf "$RESTORED"
            fi
            exec ./scripts/cmux-next/build-web-bundles.sh --force
          fi
          key="$(python3 scripts/cmux-next/web-bundle-key.py . --source)"
          python3 -I scripts/ci/compile_preflight.py web-artifact verify "$RUNNER_TEMP/ci-web-head-bundles" "$key"
          (cd webviews && bun scripts/pages/gen-strings.mjs)
          ./scripts/cmux-next/build-web-bundles.sh --from "$RUNNER_TEMP/ci-web-head-bundles"

      # The two git-hook suites below test scripts/install-git-hooks.sh, scripts/git-hooks/ and the post-edit
      # formatter, not the webviews tree, yet they ran on every web pull request head: 1.8 min of shard 1's
      # 11 (2026-11-24, ci-min-per-pr-30 cut G). On a pull request each runs when scripts/ci/focused_tests.py, the
      # source-path-to-test map the car guards use, selects it for the change (every file the installer copies
      # names it), or the change moves webviews' vp (package.json, bun.lock: the real-vp cases). A push, a batch
      # and a dispatch run both, so a miss here still reds feat-cmux-next's next push. Any error runs both.
      - name: Pick shard 1's git-hook suites
        id: hook-suites
        if: ${{ matrix.shard == 1 && steps.receipt.outputs.hit != 'true' }}
        continue-on-error: true
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" != pull_request ]; then
            printf 'merge_driver=true\npost_edit=true\n' >> "$GITHUB_OUTPUT"; exit 0
          fi
          printf 'merge_driver=true\npost_edit=true\n' > "$RUNNER_TEMP/hook-suites"
          if plan="$(timeout 120 python3 -I scripts/ci/focused_tests.py --base HEAD^1 --head HEAD)" &&
            picked="$(printf '%s' "$plan" | python3 -I -c 'import json,sys; p={t["path"] for t in json.load(sys.stdin)["python"]}; print(" ".join(n for n,t in (("merge_driver","tests/test_install_git_hooks.py"),("post_edit","tests/test_format_post_edit.py")) if t in p))')" &&
            changed="$(git diff --name-only --no-renames HEAD^1 HEAD)"; then
            if printf '%s\n' "$changed" | grep -qxE 'webviews/(package\.json|bun\.lock)'; then picked="merge_driver post_edit"; fi
            for suite in merge_driver post_edit; do
              case " $picked " in *" $suite "*) echo "$suite=true" ;; *) echo "$suite=false" ;; esac
            done > "$RUNNER_TEMP/hook-suites"
          fi
          tee -a "$GITHUB_OUTPUT" < "$RUNNER_TEMP/hook-suites"

      # Shard 1's independent checks overlap the steps they do not read (scripts/ci/shard1_background.sh): the merge
      # driver test (80 s in job 137332637156) needs only git and Python, so it starts here and runs beside the source
      # checks and the bundle build; its own step below waits for it and keeps its id and outcome. Leo, 2026-11-22:
      # "if it's relaly so big then you guys need to be hurrying up and thining more innovatively".
      - name: Start the merge driver test
        id: merge-driver-start
        if: ${{ matrix.shard == 1 && steps.receipt.outputs.hit != 'true' && steps.hook-suites.outputs.merge_driver != 'false' }}
        continue-on-error: true
        run: |
          # The same skip as its wait step below: a pull request that changes none of its inputs never starts it.
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && [ -f "$CMUX_PR_CHANGED_FILES" ] &&
            ! grep -qE '^(scripts/|tests/|\.gitattributes|\.claude/|\.codex/|\.github/workflows/ci-web\.yml|webviews/[^/]+$)' "$CMUX_PR_CHANGED_FILES"; then
            echo "no input of this check changed: skipped on this pull request"
            exit 0
          fi
          scripts/ci/shard1_background.sh start merge-driver -- python3 tests/test_install_git_hooks.py

      # ci-guards runs this on main; feat-cmux-next PRs skip ci-guards.
      # The checks from here to the engines do not depend on the shard, so
      # they run once, on shard 1: one red check, not one per shard.
      # The PR-scoped rules (133 s in job 137332637156) need the install and the bundles, not the checks or the
      # engines after them: they start here and run beside those; Check PR-scoped webview rules waits for them.
      - name: Start the PR-scoped webview rules
        id: pr-scoped-start
        if: ${{ matrix.shard == 1 && steps.receipt.outputs.hit != 'true' }}
        continue-on-error: true
        env:
          CI_PR_SCOPED_BASE_BESIDE: ${{ vars.CI_PR_SCOPED_BASE_BESIDE || '1' }}
          PR_SCOPED_RULES: &pr-scoped-rules |
            check=scripts/tests/test_pr_scoped_webviews_checks.py
            if [ "$GITHUB_EVENT_NAME" != pull_request ]; then exec python3 "$check"; fi
            # The fixture commits the real webviews tree as its base, so a pull request's own webview code is only
            # ever a base warning there: the test checks the scoping (prScope.ts) and the fixture, and only a change
            # to those inputs can turn it red. It was 4,333 runner min in 24 h of pull request jobs (764 runs, median
            # 335 s, 11-26); 23 of 167 merged react-apps pull requests touched the test's own files. A push still runs
            # it in full, and no changed-files list runs it too. Inputs: the test and its helpers, webviews/test, scripts
            # and dev-server, gallery files (the fixture loads every entry), webviews' manifests and this workflow.
            if [ -f "${CMUX_PR_CHANGED_FILES:-}" ] && ! grep -qE '^(scripts/tests/test_pr_scoped_webviews_checks\.py|tests/git_fixture_env\.py|scripts/ci/(unittest_results|guards_new_reds|shard1_background)\.(py|sh)|webviews/(test|scripts|dev-server)/.*|webviews/src/gallery/.*|webviews/src/.*\.gallery\.[^/]*|webviews/(package\.json|bun\.lock|tsconfig\.json)|\.github/workflows/ci-web\.yml)$' "$CMUX_PR_CHANGED_FILES"; then
              echo "::notice title=PR-scoped webview rules::No input of $check changed in this pull request; a push runs it."
              exit 0
            fi
            base="$RUNNER_TEMP/pr-scoped-base"
            base_run() {
              git worktree add -q --detach "$base" HEAD^1 &&
                ln -s "$PWD/webviews/node_modules" "$base/webviews/node_modules" &&
                if [ -f "$base/$check" ]; then
                  python3 scripts/ci/unittest_results.py "$base/$check" "$RUNNER_TEMP/pr-scoped-base.json" >"$RUNNER_TEMP/pr-scoped-base.log" 2>&1 || true
                fi
            }
            pid=
            # Its own process group (set -m), so a green head stops the whole base run, the fixture's children too.
            if [ "$CI_PR_SCOPED_BASE_BESIDE" != 0 ]; then set -m; base_run & pid=$!; set +m; fi
            if python3 scripts/ci/unittest_results.py "$check" "$RUNNER_TEMP/pr-scoped-head.json"; then
              [ -z "$pid" ] || { kill -TERM -- "-$pid" 2>/dev/null; wait "$pid" 2>/dev/null; } || true
              exit 0
            fi
            if [ -n "$pid" ]; then wait "$pid" || true; else base_run || true; fi
            [ ! -f "$RUNNER_TEMP/pr-scoped-base.log" ] || { echo "::group::base run"; cat "$RUNNER_TEMP/pr-scoped-base.log"; echo "::endgroup::"; }
            python3 scripts/ci/guards_new_reds.py --label "PR-scoped webview rule" \
              "$RUNNER_TEMP/pr-scoped-head.json" "$RUNNER_TEMP/pr-scoped-base.json"
        run: scripts/ci/shard1_background.sh start pr-scoped -- bash -ec "$PR_SCOPED_RULES"

      # Started in the background with the job's setup (Start the merge driver test); this waits for its status.
      - name: Generated bundle merge driver
        id: merge-driver
        if: ${{ matrix.shard == 1 && steps.receipt.outputs.hit != 'true' && steps.hook-suites.outputs.merge_driver != 'false' }}
        continue-on-error: true
        timeout-minutes: 15
        run: |
          # These two test the repo's hooks, merge drivers and formatter, not a webview: a pull request that changes
          # none of their inputs (scripts/, tests/, hook settings, .gitattributes, webviews' top-level config and this
          # file) cannot change their result. A push and the post-merge batch run them every time.
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && [ -f "$CMUX_PR_CHANGED_FILES" ] &&
            ! grep -qE '^(scripts/|tests/|\.gitattributes|\.claude/|\.codex/|\.github/workflows/ci-web\.yml|webviews/[^/]+$)' "$CMUX_PR_CHANGED_FILES"; then
            echo "no input of this check changed: skipped on this pull request"
            exit 0
          fi
          scripts/ci/shard1_background.sh wait merge-driver -- python3 tests/test_install_git_hooks.py

      # Runs after the webviews install, so the real-vp case runs too.
      - name: Post-edit formatting hook
        id: post-edit-format
        if: ${{ matrix.shard == 1 && steps.receipt.outputs.hit != 'true' && steps.hook-suites.outputs.post_edit != 'false' }}
        continue-on-error: true
        run: |
          # These two test the repo's hooks, merge drivers and formatter, not a webview: a pull request that changes
          # none of their inputs (scripts/, tests/, hook settings, .gitattributes, webviews' top-level config and this
          # file) cannot change their result. A push and the post-merge batch run them every time.
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && [ -f "$CMUX_PR_CHANGED_FILES" ] &&
            ! grep -qE '^(scripts/|tests/|\.gitattributes|\.claude/|\.codex/|\.github/workflows/ci-web\.yml|webviews/[^/]+$)' "$CMUX_PR_CHANGED_FILES"; then
            echo "no input of this check changed: skipped on this pull request"
            exit 0
          fi
          python3 tests/test_format_post_edit.py

      - name: Check diff viewer eager JS budget
        id: eager-js-budget
        if: ${{ matrix.shard == 1 && steps.receipt.outputs.hit != 'true' }}
        continue-on-error: true
        run: node ./scripts/check-webviews-diff-budget.mjs

      - name: Verify React Compiler for webviews
        id: react-compiler
        if: ${{ matrix.shard == 1 && steps.receipt.outputs.hit != 'true' }}
        continue-on-error: true
        run: ./scripts/check-webviews-react-compiler.mjs

      # For feat-cmux-next (CMUX_NEXT_STYLE_GUARDS=warn, Leo 2026-10-19) the lint, format,
      # menu-gutter, layer, type-scale, glyph, system-blue, text-focus, dialog-key and switch-fetch checks each
      # run and only warn. The type check, the browser test-lane check, the protocol codegen
      # check and the string catalog key check fail, through fast_gate_webviews_checks.py: each
      # runs on its own, and on a pull request only errors the base (the merge parent) lacks
      # fail, per error (file, code, message); the base's errors are warnings. A push charges
      # every red. Elsewhere every piece of `bun run check` (its `check:pieces` list) runs and gates, none stopping the next.
      # The type check is not here: it runs in its own job, webviews-typecheck, so a type error is a red check of
      # its own while these shards still build (Vite and bun transpile, they never type-check) and test the tree
      # (Leo, 2026-11-19: "the CI doesn't necessarily have to fail and like give up ... just as if it were like a
      # follow-up").
      - name: Check webviews (Oxlint, Oxfmt, source rules)
        id: webviews-check
        if: ${{ matrix.shard == 1 && steps.receipt.outputs.hit != 'true' }}
        continue-on-error: true
        working-directory: webviews
        env:
          CMUX_NEXT_STYLE_GUARDS: ${{ env.CMUX_NEXT_STYLE_GUARDS_LEVEL }}
          BASE_REF: ${{ github.event_name == 'pull_request' && 'HEAD^1' || '' }}
          FIXIT_COMPILE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          status=0
          if [ "$CMUX_NEXT_STYLE_GUARDS" != warn ]; then
            typecheck="$(bun -e 'console.log(require("./package.json").scripts.typecheck ?? "")')"
            pieces="$(bun -e 'for (const p of (require("./package.json").scripts["check:pieces"] ?? require("./package.json").scripts.check).split("&&")) console.log(p.trim())')"
            while IFS= read -r piece; do
              # webviews-typecheck runs this one.
              [ -n "$typecheck" ] && [ "$piece" = "$typecheck" ] && continue
              PATH="$PWD/node_modules/.bin:$PATH" sh -c "$piece" || { echo "::error title=webviews check::$piece"; status=1; }
            done <<< "$pieces"
            exit "$status"
          fi
          # The compiler bail check (84 s, warn-only here) reads no other check's output: it runs beside the rest. Like
          # the other warn-only checks below, it runs on a feat-cmux-next push and in the post-merge batch, never on a
          # pull request.
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            bails_log="$RUNNER_TEMP/compiler-bails.log"
            bun run check:compiler-bails > "$bails_log" 2>&1 &
            bails=$!
          fi
          python3 ../scripts/ci/fast_gate_webviews_checks.py --no-install --repo .. --base "$BASE_REF" --skip typecheck || status=1
          # The warn-only checks below never fail a pull request into feat-cmux-next: they cost about 2.5 of shard 1's 19
          # minutes (1,660 shard 1 jobs a day) to print warnings. A feat-cmux-next push and the post-merge batch still
          # run them. Leo, 2026-11-24: "de facto, im asking for 99% fewer minutes of ci time, period."
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            echo "warn-only webviews checks run on the base's pushes, not on a pull request"
            exit "$status"
          fi
          for check in check:duplicate-bindings check:design-tokens check:menu-gutters check:transcript-icons check:key-hints check:icon-scale check:layers check:type-scale check:motion-scale check:theme-slots check:look-addons check:surface-roles check:layout-grid check:design-scale check:instrument-tokens check:status-glyphs check:system-blue check:text-focus check:toast-targets check:dialog-keys check:switch-fetches check:session-info-names check:attachment-caps check:pane-selectors check:one-material check:component-manifest; do
            bun run "$check" || echo "::warning title=webviews $check (warn-only)::see the step log"
          done
          # Format and lint apart: `vp check` stops at its first red, so a format red hid every lint finding.
          ./node_modules/.bin/vp fmt --check || echo "::warning title=webviews format (warn-only)::vp fmt --check found unformatted files; see the step log"
          ./node_modules/.bin/vp lint || echo "::warning title=webviews lint (warn-only)::vp lint found issues; see the step log"
          wait "$bails" || echo "::warning title=webviews check:compiler-bails (warn-only)::see the step log"
          echo "::group::check:compiler-bails"; cat "$bails_log"; echo "::endgroup::"
          exit "$status"

      # The fixit-compile patch (ci-oops 0a) comes from the type check, which runs in webviews-typecheck now; that job
      # uploads it.

      # The browser-lane suites (test/support/requireBrowserLane.ts) fail in CI
      # without these engines; before, they skipped themselves and passed.
      - name: Cache Playwright's apt packages
        id: playwright-apt
        if: ${{ steps.receipt.outputs.hit != 'true' && steps.shard-tests.outputs.none != 'true' && steps.warm-react.outputs.warm != 'true' }}
        continue-on-error: true
        uses: ./.github/actions/playwright-apt-cache
        with:
          engines: chromium-webkit

      - name: Install headless engines
        id: engines
        if: ${{ steps.receipt.outputs.hit != 'true' && steps.shard-tests.outputs.none != 'true' }}
        continue-on-error: true
        working-directory: webviews
        run: bash "$(git rev-parse --show-toplevel)/scripts/ci/apt-no-service-restarts.sh" && ./node_modules/.bin/playwright install --with-deps webkit && "$(git rev-parse --show-toplevel)/scripts/ci/ensure-system-chrome.sh" && "$(git rev-parse --show-toplevel)/scripts/ci/pin-browser-test-font.sh"

      # The fixture copies the real webviews tree, so a finding already on the base fails it too: #48230's experiment
      # id agent-pane.high-contrast-look made it red on feat-cmux-next, and every web-view pull request's shard 1 went
      # red with it and skipped its tests (#49118). On a pull request, a red one is run again on the merge parent's
      # copy (a worktree of HEAD^1), and only a test red here and not there fails (guards_new_reds.py), as the tests do.
      # Leo, 2026-11-21: "these sorts of things probably shouldn't happen". A push keeps every red.
      # Started after the bundle build (Start the PR-scoped webview rules); this waits for its status and runs it here
      # when it never started.
      # The base run starts beside the head's, not after a red one: head then base, one after the other, was 320-416 s
      # of shard 1's 16 min in 17 pull request jobs on 2026-11-25 (about 170 s each). A green head stops the base run
      # and charges nothing. CI_PR_SCOPED_BASE_BESIDE=0 runs the base only after a red head again.
      - name: Check PR-scoped webview rules
        id: pr-scoped-rules
        if: ${{ matrix.shard == 1 && steps.receipt.outputs.hit != 'true' }}
        continue-on-error: true
        timeout-minutes: 20
        env:
          CI_PR_SCOPED_BASE_BESIDE: ${{ vars.CI_PR_SCOPED_BASE_BESIDE || '1' }}
          PR_SCOPED_RULES: *pr-scoped-rules
        run: scripts/ci/shard1_background.sh wait pr-scoped -- bash -ec "$PR_SCOPED_RULES"

      # The React Compiler's output (CMUX_VITE_TRANSFORM_CACHE, webviews/reactCompiler.mjs) from earlier runs. A
      # shard's 4 concurrent dev-server files each compiled the agent pane on an empty cache: about 90 s each before
      # their first test on 16 cores, against 12 s with the cache filled; a cache 27 commits older, written in another
      # checkout path, took 6.9 s (33 of 2,087 modules compiled again). Entries are keyed by each module's exact code,
      # so an old one is never wrong, only unused. Best effort: a miss is the cold start every shard had before.
      # cmuxterm-hq docs/findings/2026-11-24-shard-transform-cache.md.
      - name: Key the React Compiler transform cache
        id: transform-cache
        if: ${{ !cancelled() && steps.receipt.outputs.hit != 'true' }}
        continue-on-error: true
        env:
          LOCK: ${{ hashFiles('webviews/bun.lock') }}
        run: |
          # A 6-hour bucket: a feat-cmux-next push saves at most one new copy a bucket (about 12.5 MB; Save the React
          # Compiler transform cache, below), and every run restores the newest one for its lockfile.
          prefix="vite-transforms-v1-$RUNNER_OS-$RUNNER_ARCH-$LOCK-"
          echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
          echo "key=$prefix$(( $(date +%s) / 21600 ))" >> "$GITHUB_OUTPUT"
          echo "dir=$RUNNER_TEMP/vite-transforms" >> "$GITHUB_OUTPUT"

      - name: Restore the React Compiler transform cache
        id: transform-cache-restore
        if: ${{ !cancelled() && steps.transform-cache.outputs.key != '' }}
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ steps.transform-cache.outputs.dir }}
          key: ${{ steps.transform-cache.outputs.key }}
          restore-keys: ${{ steps.transform-cache.outputs.prefix }}

      # A newer head cancels this run (ci.yml's concurrency) while its shards are still testing: over 11-22 03-05Z
      # react-apps-check shards lost about 19,000 runner minutes a day that way, cancelled at a median 46 of their
      # 65 min. Each shard keeps the files that passed at its head, as they pass (Upload the files that passed, below),
      # and the same shard at the pull request's next head downloads the newest list (two requests) and skips the
      # files the change between the two heads cannot reach (Test webviews). Best effort: no list runs every file.
      - name: Download the files that passed at the previous head
        id: passed-before
        # A full-ci head whose pick ran (react_class sampled or fast) runs the pick's files as any pull request does
        # (Test webviews), so it reuses the same way: over 11-26 04Z to 11-27 05Z a full-ci branch's second and later
        # heads ran 9,818 react-apps-check minutes with nothing reused.
        if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && (!(contains(github.event.pull_request.labels.*.name, 'full-ci') && (github.event.pull_request.base.ref != 'feat-cmux-next' || (github.event.action == 'labeled' && github.event.label.name == 'full-ci') || (vars.CI_FULL_CI_ONE_SHOT || '1') == '0')) || needs.web-subarea-scope.outputs.react_class == 'sampled' || needs.web-subarea-scope.outputs.react_class == 'fast') }}
        continue-on-error: true
        timeout-minutes: 2
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
          SHARD: ${{ matrix.shard }}
        run: python3 scripts/ci/webviews_test_history.py passed-before "$RUNNER_TEMP/webviews-passed-before" --repo "$GITHUB_REPOSITORY" --branch "$HEAD_REF" --shard "$SHARD" --run-id "$GITHUB_RUN_ID"

      # One bun process per test file with a per-file timeout: a single
      # `bun test` stalled in a different file each run (scripts/ci/run-webviews-tests.sh).
      # ui-rules, gallery coverage, hairline rims, tooltip rules, theme colors and
      # system blue report through test/support/prScope.ts, which only warns
      # under CMUX_NEXT_STYLE_GUARDS=warn (feat-cmux-next).
      # A pull request fails only on tests red on it and not on its base (the merge
      # parent): the red files run again there, and the base's reds are warnings
      # (scripts/ci/webviews-tests-new-reds.sh). A push keeps every red.
      # A shard whose engines did not install skips its tests: the browser-lane files fail
      # without them, so the shard was red either way, only 15-25 min later, after the whole suite
      # ran (run 43337871244). The gate step below names the engine step as the red.
      # A pull request's shard whose gate check already failed skips its tests too: the gate step fails the shard
      # whatever the tests say, and react-apps-base-check (needs this job) is skipped with it, so the tests decide
      # nothing. In 11-21 12:07-14:07Z, 50 of 52 pull request shard 1 jobs were red on 'Check PR-scoped webview rules'
      # alone, then ran 40 min of tests (44 min a job). A push keeps every test: its verdicts are the base's history.
      # The style gates (EAGER_JS_BUDGET, REACT_COMPILER) only warn on feat-cmux-next, so they are not read here.
      - name: Test webviews
        id: webview-tests
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        if: >-
          ${{ !cancelled() && steps.receipt.outputs.hit != 'true' && steps.engines.outcome != 'failure' && !(github.event_name == 'pull_request' && (
          steps.source-build.outcome == 'failure' || steps.bundles.outcome == 'failure' ||
          steps.merge-driver.outcome == 'failure' || steps.post-edit-format.outcome == 'failure' ||
          steps.webviews-check.outcome == 'failure' || steps.pr-scoped-rules.outcome == 'failure')) }}
        working-directory: webviews
        env:
          CMUX_NEXT_STYLE_GUARDS: ${{ env.CMUX_NEXT_STYLE_GUARDS_LEVEL }}
          CMUX_WEB_TEST_SHARD: ${{ matrix.shard }}
          CMUX_WEB_TEST_SHARD_COUNT: ${{ matrix.shard_count }}
          # Shard 1 runs the shard-independent checks above first (107-132 s in runs 43338660731
          # to 43342364793); the split gives it that much less test work (webviews_test_shards.py).
          CMUX_WEB_TEST_SHARD_HEAD_START: "1:120"
          # Restored above (Restore the React Compiler transform cache); empty, the runner uses a fresh folder of its own.
          CMUX_VITE_TRANSFORM_CACHE: ${{ steps.transform-cache.outputs.dir }}
          CMUX_WEB_TEST_RESULTS: ${{ runner.temp }}/webviews-head-results/webviews-head-results.json
          CMUX_WEB_TEST_RAW_LOG_DIR: ${{ runner.temp }}/webviews-head-results/raw-logs
          CMUX_WEB_TEST_SKIP_BASE: ${{ github.event_name == 'pull_request' && '1' || '0' }}
          CMUX_WEB_TEST_DURATIONS: ${{ runner.temp }}/webviews-durations/manifest.json
          # From web-subarea-scope's handoff (pull requests only): a file red on the base's push gets no alone retry.
          CMUX_WEB_TEST_BASE_REDS: ${{ github.event_name == 'pull_request' && format('{0}/webviews-durations/base-reds.json', runner.temp) || '' }}
          # Pull requests only: files red on every base push for a day or more are the batch runs' (held-red-files).
          CMUX_WEB_TEST_HELD_REDS: ${{ github.event_name == 'pull_request' && format('{0}/webviews-durations/held-reds', runner.temp) || '' }}
          # Pull requests only: once the last 5 alone retries in a row all failed again, the rest of the red files keep their
          # first run for react-apps-base-check, which replays them on the base and re-runs alone on the head any it
          # would charge (run-webviews-tests.sh). Shard 1 of run 44987019885 spent 23 min retrying 38 files alone and
          # none passed. A push keeps every retry: its verdicts are the base's history. Undo: the repository variable
          # CMUX_WEB_TEST_RETRY_BREAKER=0.
          CMUX_WEB_TEST_RETRY_BREAKER: ${{ github.event_name == 'pull_request' && (vars.CMUX_WEB_TEST_RETRY_BREAKER || '5') || '0' }}
          # Pull requests only, the cost bound on the same retries: a red file whose first run took over 120 s gets no
          # alone retry, and every alone retry starts within 300 s of the first (run-webviews-tests.sh). Job
          # 137151085368 retried 15 files alone for 26 min; the slow ones (accent-glass-invariants 462-481 s,
          # agent-pane-reveal-in-place 362 s) failed again, and the base check judged all 11 reds anyway. A push keeps
          # every retry. Undo: the repository variables set to 0.
          CMUX_WEB_TEST_RETRY_SLOW_SECONDS: ${{ github.event_name == 'pull_request' && (vars.CMUX_WEB_TEST_RETRY_SLOW_SECONDS || '120') || '0' }}
          CMUX_WEB_TEST_ALONE_RETRY_BUDGET: ${{ github.event_name == 'pull_request' && (vars.CMUX_WEB_TEST_ALONE_RETRY_BUDGET || '300') || '' }}
          CMUX_WEB_TEST_DURATIONS_OUT: ${{ runner.temp }}/webviews-durations-out/shard${{ matrix.shard }}.json
          BASE_REF: ${{ github.event_name == 'pull_request' && 'HEAD^1' || '' }}
          FULL_CI: ${{ (contains(github.event.pull_request.labels.*.name, 'full-ci') && (github.event.pull_request.base.ref != 'feat-cmux-next' || (github.event.action == 'labeled' && github.event.label.name == 'full-ci') || (vars.CI_FULL_CI_ONE_SHOT || '1') == '0')) }}
          PASSED_BEFORE: ${{ runner.temp }}/webviews-passed-before
          REACT_APPS_CLASS: ${{ needs.web-subarea-scope.outputs.react_class }}
          # Every failed or timed-out file gets its alone retry before it counts
          # as red; CMUX_WEB_TEST_RETRY_DEADLINE, not a budget, keeps the step in
          # its job. A fixed budget left contention reds unretried, and the base
          # replay (one at a time) then charged them to the change: a 240 s
          # timeout budget kept 7 of #27007's shard 1 timeouts, and a 300 s
          # failed-file budget cut accent-glass-invariants' retry (it needs more
          # than 297 s alone) and skipped transcript-thought and
          # streaming-text-frames (#27425's shard 4). The retries end 8 min before
          # the job's timeout-minutes, counted from the job's start (Record the job
          # start), not this step's: the setup before this step would otherwise run
          # a fully retried job into its timeout before the uploads. The run
          # below sets both from these minutes. A file that fails alone too stays red.
          CMUX_WEB_TEST_JOB_MINUTES: *webview-shard-minutes
          # Keep jsdom and browser workers below the 16-vCPU saturation point. The Session Info
          # test set grew enough that twelve plain workers starved each other and timed out.
          CMUX_WEB_TEST_JOBS: "8"
          # The vCPU these widths are for: the job's declared size (linux_16). A runner with fewer
          # runs its files at that share of them, and the split still reads these widths, so every
          # shard picks the same files whatever size it got (run-webviews-tests.sh). 8 files at once
          # on 2 vCPU ran every shard of run 44249075431 into its timeout.
          CMUX_WEB_TEST_SIZED_FOR_VCPU: "16"
          # The dev-server files run after the plain and browser pools, so the cap above never
          # needed to narrow them: they ran 4 at a time on 16 vCPU before it, and its jobs / 4
          # took them to 2, which doubled the phase that is most of a shard's wall time. The
          # shard split reads these widths (run-webviews-tests.sh), so it balances on them.
          CMUX_WEB_TEST_DEV_JOBS: "4"
          # A pull request's red files run again 3 at a time before any alone retry (run-webviews-tests.sh); a file red
          # again on the same tests gets no alone retry, react-apps-base-check judges it. In 14 shard logs after #49329
          # the one-at-a-time retries were 31% of the test step and 108 of 113 failed the same tests again. A push keeps
          # every retry alone: its verdicts are the base's history. Undo: the repository variable
          # CMUX_WEB_TEST_RETRY_POOL=0.
          CMUX_WEB_TEST_RETRY_POOL: ${{ github.event_name == 'pull_request' && (vars.CMUX_WEB_TEST_RETRY_POOL || '3') || '0' }}
          # A pull request's whole retry phase ends 10 min after its first pass (run-webviews-tests.sh). The deadline below
          # alone let retries fill the 90 min shard: full-suite pull request runs on a red base spent 36-40 min retrying
          # 26+ base reds (3 passed alone, so the breaker never tripped) and clustered at ~4,800 s (jobs 138640454439,
          # 138534278453, 138786846480, 138936477461). Unretried reds go to react-apps-base-check, which re-runs alone on
          # the head any red it would charge to the change. A push keeps the job deadline: its verdicts are the base's
          # history. Undo: the repository variable CMUX_WEB_TEST_RETRY_WALL=999999.
          CMUX_WEB_TEST_RETRY_WALL: ${{ github.event_name == 'pull_request' && (vars.CMUX_WEB_TEST_RETRY_WALL || '600') || '' }}
          # The runs whose verdicts become the base's history: the condition of the upload below and of the
          # webviews-test-history job. Keyed on push alone, a batch tick or post-merge batch run wrote no inputs
          # key, its history job failed "no single inputs key", and the history (with the base reds a pull
          # request skips alone retries for) froze at the last push.
          CMUX_WEB_TEST_RECORD_HISTORY: ${{ (github.event_name == 'push' || github.event.inputs.tick == 'true' || inputs.sha != '' && inputs.sha == github.sha && inputs.only == '') && '1' || '0' }}
        run: |
          # Replay uses this exact runner and result parser, with the base's tests and bun.
          # Different deadline policies can otherwise turn an old named failure into a new timeout.
          # Unset (a local run of this script under set -u), the runner keeps its own retry defaults.
          # The runner counts its deadline from its own start, so it gets what is left of the job's minutes less
          # the uploads' 480 s. With no job-start stamp (this script run on its own), assume 15 min of setup.
          if [ -n "${CMUX_WEB_TEST_JOB_MINUTES:-}" ]; then
            now=$(date +%s)
            job_started="${CMUX_WEB_TEST_JOB_STARTED:-}"
            [[ "$job_started" =~ ^[0-9]+$ ]] || job_started=$(( now - 900 ))
            left=$(( job_started + CMUX_WEB_TEST_JOB_MINUTES * 60 - 480 - now ))
            export CMUX_WEB_TEST_RETRY_DEADLINE=$(( left > 0 ? left : 0 ))
            export CMUX_WEB_TEST_RETRY_BUDGET="$CMUX_WEB_TEST_RETRY_DEADLINE"
            # A push or dispatch (the post-merge batch at 45 min) also stops its first pass there: no file starts, and
            # none runs, past the same point, so the step ends with what it finished and the uploads (Upload this
            # push's webview results, the history job) still run. Without it, 5 of 8 post-merge shards a tick were
            # still in their first pass at 45 min and GitHub cancelled them with no result at all (11-26 13:15Z to
            # 11-27 01:47Z: 44 shards, 1,998 job-min, 0 passes), while shards 2, 3 and 7 ended at 37 min with a
            # verdict. A pull request's shard keeps its first pass whole (90 min; react-apps-base-check reads it).
            if [ "${GITHUB_EVENT_NAME:-}" != pull_request ]; then
              export CMUX_WEB_TEST_STOP_AT=$(( job_started + CMUX_WEB_TEST_JOB_MINUTES * 60 - 480 ))
            fi
          fi
          mkdir -p "$RUNNER_TEMP/webviews-head-results/runner"
          # A recorded run (a push, a batch tick, a post-merge batch run) records its webview inputs key with its
          # verdicts (the history job's checkout is sparse, and the key reads files the router routes on). Best
          # effort: no key, and the history job records nothing.
          if [ "${CMUX_WEB_TEST_RECORD_HISTORY:-0}" = 1 ]; then
            python3 ../scripts/ci/webviews_test_history.py inputs > "$RUNNER_TEMP/webviews-head-results/webviews-inputs-key" ||
              rm -f "$RUNNER_TEMP/webviews-head-results/webviews-inputs-key"
          fi
          # The comparison and the flake history are the head's too: the base's copies may predate --flaky.
          cp ../scripts/ci/run-webviews-tests.sh ../scripts/ci/timeout.sh ../scripts/ci/webviews_test_results.py ../scripts/ci/webviews_test_shards.py \
            ../scripts/ci/webviews_retry_pool.py \
            ../scripts/ci/guards_new_reds.py ../scripts/ci/webviews_test_history.py ../scripts/ci/test_reds.py \
            "$RUNNER_TEMP/webviews-head-results/runner/"
          # A pull request runs the test files its change can reach (scripts/ci/webviews_affected.py:
          # the import graph, every test that reads files from disk, and every file for a build input
          # or an unmapped path); empty output runs every file. A feat-cmux-next push and full-ci run all, except a
          # full-ci head whose pick ran (REACT_APPS_CLASS sampled or fast: into feat-cmux-next, #57352): it runs the
          # pick's files as any pull request does. It ran shard 1's whole share instead, 406 files and 12.9 min for
          # a release-notes highlight (cmux#53546 35726b7d, run 45771042383); the post-merge batch runs every file.
          if [ -n "$BASE_REF" ] && { [ "$FULL_CI" != true ] || [ "$REACT_APPS_CLASS" = sampled ] || [ "$REACT_APPS_CLASS" = fast ]; }; then
            CMUX_WEB_TEST_FILES="$(python3 ../scripts/ci/webviews_affected.py --base "$BASE_REF" --head HEAD)" || CMUX_WEB_TEST_FILES=""
            # Shard 1 runs only the touched tests (webviews_pr_shards.py --direct-out), as one unsplit list, not its
            # share of the closure above: the touched tests in its own share and every touched test outside it that no
            # sampled shard runs (maybe none). No entry
            # (an every-shard pick, a failed pick, no file) keeps the closure share; "-" below marks no entry.
            own="$(python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); print("\n".join(d[sys.argv[2]]) if sys.argv[2] in d else "-")' \
              "$RUNNER_TEMP/webviews-durations/pr-shard-direct.json" "$CMUX_WEB_TEST_SHARD" 2>/dev/null)" || own="-"
            if [ "$own" != - ] && [ -n "$own" ]; then
              CMUX_WEB_TEST_FILES="$own"
              export CMUX_WEB_TEST_SHARD=1 CMUX_WEB_TEST_SHARD_COUNT=1 CMUX_WEB_TEST_SHARD_HEAD_START=""
              echo "shard ${{ matrix.shard }} runs its $(printf '%s\n' "$own" | wc -l) touched tests"
            fi
            export CMUX_WEB_TEST_FILES
            # A fast push (docs or comments only, webviews_pr_shards.py classify), or a pick that left shard 1 no
            # touched test, runs no test file there: shard 1's checks above were its run. An empty head map is a run
            # with no red, which react-apps-base-check passes.
            if [ "${{ matrix.shard }}" = 1 ] && { [ "$REACT_APPS_CLASS" = fast ] || [ -z "$own" ]; }; then
              printf '{}\n' > "$CMUX_WEB_TEST_RESULTS"
              if [ "$REACT_APPS_CLASS" = fast ]; then
                echo "fast push: no test file runs (the step summary of web-subarea-scope names the rule)"
              else
                echo "shard 1 holds no touched test: its checks above were its run (webviews_pr_shards.py --direct-out)"
              fi
              exit 0
            fi
          fi
          # A pull request's passes, as they come, for its next head (Upload the files that passed): the merge commit
          # they passed at, then the files. The files that passed at the previous head and that the change since
          # (webviews_affected.py from that merge commit to this one) cannot reach are not run again; a list without
          # its commit, a commit that does not fetch, or a change that reaches every file reuses nothing.
          if [ -n "$BASE_REF" ]; then
            passed="$RUNNER_TEMP/webviews-passed"
            mkdir -p "$passed"
            git rev-parse HEAD > "$passed/commit"
            export CMUX_WEB_TEST_PASSED_OUT="$passed/files"
            : > "$CMUX_WEB_TEST_PASSED_OUT"
            before="$(cat "$PASSED_BEFORE/commit" 2> /dev/null || true)"
            if { [ "$FULL_CI" != true ] || [ "$REACT_APPS_CLASS" = sampled ] || [ "$REACT_APPS_CLASS" = fast ]; } && [ -s "$PASSED_BEFORE/files" ] && [[ "$before" =~ ^[0-9a-f]{40}$ ]] &&
              { git cat-file -e "$before^{commit}" 2> /dev/null || timeout 60 git fetch --no-recurse-submodules --no-tags --depth=1 origin "$before"; }; then
              reach="$(python3 ../scripts/ci/webviews_affected.py --base "$before" --head HEAD)" || reach=""
              if [ -n "$reach" ]; then
                grep -vxF -f <(printf '%s\n' "$reach") "$PASSED_BEFORE/files" > "$RUNNER_TEMP/webviews-reused" || true
                export CMUX_WEB_TEST_REUSED="$RUNNER_TEMP/webviews-reused"
                echo "passed at ${before:0:12}: $(grep -c . "$PASSED_BEFORE/files"); the change since reaches $(grep -c . <<< "$reach") test files"
              fi
            fi
          fi
          ../scripts/ci/webviews-tests-new-reds.sh "$BASE_REF"

      - name: Upload head webview results
        if: ${{ always() && github.event_name == 'pull_request' && (steps.webview-tests.outcome != 'skipped' || steps.receipt.outputs.hit == 'true') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # Artifact names are stable across failed-job reruns: the rerun keeps
          # the original head results while retrying only the base comparison.
          name: react-apps-head-results-shard${{ matrix.shard }}
          overwrite: true
          path: ${{ runner.temp }}/webviews-head-results/
          if-no-files-found: error
          retention-days: 7

      # Also when a newer head cancels the run: what passed before the cancel is what that head's shard reuses
      # (webviews_test_history.py passed-before).
      - name: Upload the files that passed
        id: passed-upload
        if: ${{ always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && steps.webview-tests.outcome != 'skipped' }}
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: react-apps-passed-shard${{ matrix.shard }}
          overwrite: true
          path: |
            ${{ runner.temp }}/webviews-passed/commit
            ${{ runner.temp }}/webviews-passed/files
          if-no-files-found: ignore
          retention-days: 1

      # A push's verdicts feed the base's flake history (the webviews-test-history job), which a
      # pull request's base replay reads so a test that flips by itself on the base only warns.
      # A post-merge batch run on the base tip uploads them as a push did; a bisect probe does not.
      # Optional upkeep, like the durations below: it never fails the shard.
      - name: Upload this push's webview results
        id: history-upload
        if: ${{ !cancelled() && (github.event_name == 'push' || github.event.inputs.tick == 'true' || inputs.sha != '' && inputs.sha == github.sha && inputs.only == '') }}
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: webviews-test-history-shard${{ matrix.shard }}
          overwrite: true
          path: |
            ${{ runner.temp }}/webviews-head-results/webviews-head-results.json
            ${{ runner.temp }}/webviews-head-results/webviews-inputs-key
          if-no-files-found: ignore
          retention-days: 1

      # Every event: push runs on feat-cmux-next keep the manifest fresh for everyone.
      # Optional upkeep: an artifact-service failure or stall never fails the
      # shard; the gate step below reports it as a warning.
      - name: Upload this shard's durations
        id: durations-upload
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: webviews-test-durations-shard${{ matrix.shard }}
          overwrite: true
          path: ${{ runner.temp }}/webviews-durations-out/
          if-no-files-found: ignore
          retention-days: 1

      - name: Fail on the gate checks
        if: ${{ !cancelled() }}
        env:
          SOURCE_BUILD: ${{ steps.source-build.outcome }}
          BUNDLES: ${{ steps.bundles.outcome }}
          WEB_BUNDLE_KEY: ${{ steps.web-bundle-key.outcome }}
          WEB_BUNDLE_CACHE: ${{ steps.web-bundle-cache.outcome }}
          PLAYWRIGHT_APT: ${{ steps.playwright-apt.outcome }}
          ENGINES: ${{ steps.engines.outcome }}
          MERGE_DRIVER: ${{ steps.merge-driver.outcome }}
          POST_EDIT_FORMAT: ${{ steps.post-edit-format.outcome }}
          EAGER_JS_BUDGET: ${{ steps.eager-js-budget.outcome }}
          REACT_COMPILER: ${{ steps.react-compiler.outcome }}
          WEBVIEWS_CHECK: ${{ steps.webviews-check.outcome }}
          PR_SCOPED_RULES: ${{ steps.pr-scoped-rules.outcome }}
          # Warn-only: the next run's shard split, never this run's verdict.
          DURATIONS_UPLOAD: ${{ steps.durations-upload.outcome }}
          HISTORY_UPLOAD: ${{ steps.history-upload.outcome }}
          # Warn-only: what the pull request's next head reuses, never this run's verdict.
          PASSED_BEFORE: ${{ steps.passed-before.outcome }}
          PASSED_UPLOAD: ${{ steps.passed-upload.outcome }}
          # A pull request's test step keeps going on a red (react-apps-base-check judges it), but one stopped before it
          # wrote its results (a runner's SIGTERM, exit 143) left the shard green: a failed-job rerun never retried it,
          # and the base check failed on every attempt with "has no webviews-head-results.json" (cmux#49337, run
          # 44955291325, 2026-11-21). That shard is red here, so the rerun takes it again.
          WEBVIEW_TESTS: ${{ steps.webview-tests.outcome }}
          HEAD_RESULTS: ${{ runner.temp }}/webviews-head-results/webviews-head-results.json
          # Warn-only: the pick fails open (an error runs both git-hook suites), never this run's verdict.
          HOOK_SUITES: ${{ steps.hook-suites.outcome }}
          # The eager JS budget (a size cap) and the React Compiler coverage are
          # structural: for feat-cmux-next they warn (Leo 2026-10-19).
          CMUX_NEXT_STYLE_GUARDS: ${{ env.CMUX_NEXT_STYLE_GUARDS_LEVEL }}
          STYLE_GATES: EAGER_JS_BUDGET REACT_COMPILER
        run: |
          failed=0
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && [ "$WEBVIEW_TESTS" = failure ] && [ ! -s "$HEAD_RESULTS" ]; then
            echo "::error::Test webviews stopped before it wrote its results; this shard has no verdict to judge."
            failed=1
          fi
          if [ "$DURATIONS_UPLOAD" = failure ]; then
            echo "::warning::This shard's test durations did not upload; the next run's shard split misses them."
          fi
          if [ "$HISTORY_UPLOAD" = failure ]; then
            echo "::warning::This push's webview results did not upload; the base's flake history misses this run."
          fi
          if [ "$WEB_BUNDLE_KEY" = failure ] || [ "$WEB_BUNDLE_CACHE" = failure ]; then
            echo "::warning::The web bundles' cached build was not looked up; Build the web bundles built them."
          fi
          if [ "$PASSED_BEFORE" = failure ] || [ "$PASSED_UPLOAD" = failure ]; then
            echo "::warning::The files that passed at the previous head were not read, or this head's were not kept: every file runs."
          fi
          if [ "$HOOK_SUITES" = failure ]; then
            echo "::warning::Picking shard 1's git-hook suites failed; both suites ran."
          fi
          for gate in \
            "SOURCE_BUILD|Verify webviews source checks" \
            "BUNDLES|Build the web bundles" \
            "PLAYWRIGHT_APT|Cache Playwright's apt packages" \
            "ENGINES|Install headless engines" \
            "MERGE_DRIVER|Generated bundle merge driver" \
            "POST_EDIT_FORMAT|Post-edit formatting hook" \
            "EAGER_JS_BUDGET|Check diff viewer eager JS budget" \
            "REACT_COMPILER|Verify React Compiler for webviews" \
            "WEBVIEWS_CHECK|Check webviews (Oxlint, Oxfmt, source rules)" \
            "PR_SCOPED_RULES|Check PR-scoped webview rules"; do
            var="${gate%%|*}"
            if [ "${!var}" = "failure" ]; then
              if [ "$CMUX_NEXT_STYLE_GUARDS" = warn ] && [[ " $STYLE_GATES " == *" $var "* ]]; then
                echo "::warning::Style gate reported findings (warn-only); see the step '${gate#*|}'."
                continue
              fi
              echo "::error::Gate failed; see the step '${gate#*|}'."
              failed=1
            fi
          done
          exit "$failed"

      # A green shard (every gate above passed, and Test webviews passed with every test green) records its head
      # results under its same-input key, for a later run of exactly these inputs (a re-run, a re-trigger with the
      # same merge tree). Optional upkeep: neither step ever fails the shard.
      - name: Write this shard's same-input receipt
        id: receipt-write
        if: ${{ success() && steps.receipt-key.outputs.key != '' && steps.receipt.outputs.hit != 'true' && steps.webview-tests.outcome == 'success' }}
        continue-on-error: true
        env:
          RECEIPT_KEY: ${{ steps.receipt-key.outputs.key }}
          RECEIPT_RUN: ${{ format('{0}/{1}/actions/runs/{2}/attempts/{3}', github.server_url, github.repository, github.run_id, github.run_attempt) }}
        run: python3 scripts/ci/react_shard_receipt.py write --key "$RECEIPT_KEY" --results "$RUNNER_TEMP/webviews-head-results" --out "$GITHUB_WORKSPACE/.same-tree/react-shard-receipt" --run "$RECEIPT_RUN"

      - name: Save this shard's same-input receipt
        if: ${{ steps.receipt-write.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .same-tree/react-shard-receipt
          key: ${{ steps.receipt-key.outputs.key }}

      # A feat-cmux-next push keeps its shard's React Compiler output for later runs (Restore the React Compiler
      # transform cache): the first shard to finish in a 6-hour bucket saves it, the others find the key taken. Entries
      # no run has read in 2 days are dropped first (a hit touches its entry, webviews/reactCompiler.mjs), so the
      # cache holds what the tree compiles now, not every past version of it.
      - name: Prune the React Compiler transform cache
        id: transform-cache-prune
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/feat-cmux-next' && steps.transform-cache.outputs.key != '' && steps.transform-cache-restore.outputs.cache-hit != 'true' && steps.webview-tests.outcome != 'skipped' }}
        continue-on-error: true
        timeout-minutes: 2
        env:
          DIR: ${{ steps.transform-cache.outputs.dir }}
        run: |
          [ -d "$DIR" ] || { echo "no transform cache to save"; exit 1; }
          find "$DIR" -type f -name '*.json' -mmin +2880 -delete
          find "$DIR" -type f ! -name '*.json' -delete
          find "$DIR" -mindepth 1 -type d -empty -delete
          echo "saving $(find "$DIR" -type f | wc -l) entries, $(du -sh "$DIR" | cut -f1)"

      - name: Save the React Compiler transform cache
        if: ${{ steps.transform-cache-prune.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ steps.transform-cache.outputs.dir }}
          key: ${{ steps.transform-cache.outputs.key }}

  # The base's recorded red files, replayed on the merge parent while the head shards run. react-apps-base-check
  # replays each head red file once, alone, on the merge parent, but only after every head shard ends, and the
  # history's verdicts (known) answer only when a push with the merge parent's exact webview inputs already ran,
  # which most feat-cmux-next pushes are not: in run 43384458711 the head shards ended at 17.9 min, and the replay
  # of files the base's push already had red (up to 10 a shard, one a 600 s timeout) took the verdict to 30.8.
  # This job runs those files (web-subarea-scope's base-reds.json, the change's affected files only) with the head's
  # runner, so the base check takes their verdicts from here and replays only the head reds it does not cover. Best
  # effort: a shard that fails, times out or uploads nothing leaves the base check replaying as before
  # (continue-on-error keeps its result from skipping the check).
  # 2 shards, each running its files at the head shards' widths (8 at a time, dev-server files 4 at a time, no
  # retry): run 43409592440's 12 shards ran 54 such files one at a time, 2534 s of tests (the 600 s
  # agent-pane-send-motion-contract timeout alone on shard 1, ended at 15.0 min; the rest 7.5-8.8 min), and 12
  # setups for 21 more jobs than the step table's budget allows. The split puts the 600 s file first on shard 1
  # and about as many seconds again on shard 2; 4 dev-server lanes take the rest beside it.
  # Off pull requests unless the full-ci label asks for it. Leo, 2026-11-21: "id rather we simply cut shit now and
  # revisit later." Over 11-13..19 these 2 shards were 1.10% of pull request runner-minutes and caught no red (0 of
  # 2,950 heads; cmuxterm-hq docs/ci/bottleneck-and-skip-candidates-2026-11-21.md): they only make a verdict sooner,
  # and react-apps-base-check replays the same base reds itself when no early result is there. Not in its needs, so
  # a skipped early job never skips the base check; a full-ci run's early results count when they are uploaded first.
  react-apps-base-bundles:
    needs: web-subarea-scope
    if: ${{ needs.web-subarea-scope.outputs.base_bundle_ref != '' && needs.web-subarea-scope.outputs.base_bundle_same != 'true' }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/cmux-next-compile-preflight.yml
    with:
      force_web: true
      source_ref: ${{ needs.web-subarea-scope.outputs.base_bundle_ref }}
      artifact_prefix: ci-web-base-bundles

  react-apps-base-early:
    needs: [web-subarea-scope, react-apps-base-bundles, react-apps-head-bundles]
    permissions:
      contents: read
      actions: read
      id-token: write
    if: ${{ !cancelled() && (needs.react-apps-base-bundles.result == 'success' || (needs.web-subarea-scope.outputs.base_bundle_same == 'true' && needs.react-apps-head-bundles.result == 'success')) && github.event_name == 'pull_request' && (contains(github.event.pull_request.labels.*.name, 'full-ci') && (github.event.pull_request.base.ref != 'feat-cmux-next' || (github.event.action == 'labeled' && github.event.label.name == 'full-ci') || (vars.CI_FULL_CI_ONE_SHOT || '1') == '0')) && inputs.web == 'true' && needs.web-subarea-scope.outputs.react_apps == 'true' }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || vars.CI_REACT_SHARD_RUNNER || 'cmux-linux' }}
    continue-on-error: true
    # A stuck early shard must not hold the base check past what its own replay costs. Over 11-20..21 (24 h feed,
    # 1,507 runs of these two shards) 615 successes had a median of 85 s and a p97 of 200 s; 811 runs ended
    # "cancelled", 349 of them at the old 25 minutes. 8 minutes
    # holds 98% of successes; a hang now costs 8 minutes, not 25 (a killed shard only loses the early verdict, the
    # base check replays the reds itself).
    timeout-minutes: 8
    name: react-apps-base-early (${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1
            shard_count: 2
          - shard: 2
            shard_count: 2
    steps:
      # Run the base reds stops starting files a minute before the 8 minutes end, counted from here.
      - name: Record the job start
        run: echo "CMUX_WEB_TEST_JOB_STARTED=$(date +%s)" >> "$GITHUB_ENV"

      - name: Checkout the merge commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Download the base reds
        continue-on-error: true
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: webviews-test-durations
          path: ${{ runner.temp }}/webviews-durations

      - name: Download the base bundles from R2
        if: ${{ (needs.web-subarea-scope.outputs.base_bundle_same == 'true' && needs.react-apps-head-bundles.outputs.web_bundle_transport || needs.react-apps-base-bundles.outputs.web_bundle_transport) == 'r2' }}
        timeout-minutes: 3
        uses: ./.github/actions/r2-artifact/download
        with:
          name: ${{ needs.web-subarea-scope.outputs.base_bundle_same == 'true' && needs.react-apps-head-bundles.outputs.web_bundle_artifact || needs.react-apps-base-bundles.outputs.web_bundle_artifact }}
          path: ${{ runner.temp }}/ci-web-base-bundles

      - name: Download the base bundles without OIDC
        if: ${{ (needs.web-subarea-scope.outputs.base_bundle_same == 'true' && needs.react-apps-head-bundles.outputs.web_bundle_transport || needs.react-apps-base-bundles.outputs.web_bundle_transport) == 'github' }}
        timeout-minutes: 3
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ${{ needs.web-subarea-scope.outputs.base_bundle_same == 'true' && needs.react-apps-head-bundles.outputs.web_bundle_artifact || needs.react-apps-base-bundles.outputs.web_bundle_artifact }}
          path: ${{ runner.temp }}/ci-web-base-bundles

      # The head's runner and font pin, as the base check's replay uses them; then the merge parent, as it does.
      - name: Pick this shard's base reds
        id: pick
        env:
          SHARD: ${{ matrix.shard }}
          SHARD_COUNT: ${{ matrix.shard_count }}
          FULL_CI: ${{ (contains(github.event.pull_request.labels.*.name, 'full-ci') && (github.event.pull_request.base.ref != 'feat-cmux-next' || (github.event.action == 'labeled' && github.event.label.name == 'full-ci') || (vars.CI_FULL_CI_ONE_SHOT || '1') == '0')) }}
          REACT_APPS_CLASS: ${{ needs.web-subarea-scope.outputs.react_class }}
        run: |
          runner="$RUNNER_TEMP/base-early/runner"
          mkdir -p "$runner"
          cp scripts/ci/run-webviews-tests.sh scripts/ci/timeout.sh scripts/ci/webviews_test_results.py scripts/ci/webviews_test_shards.py \
            scripts/ci/guards_new_reds.py scripts/ci/webviews_test_history.py scripts/ci/test_reds.py "$runner/"
          cp scripts/ci/pin-browser-test-font.sh scripts/ci/apt-no-service-restarts.sh scripts/ci/compile_preflight.py "$RUNNER_TEMP/"
          # The head shards run only the change's affected files (empty: every file), so only those can be red there.
          only=()
          # A full-ci head whose pick ran runs the pick's files (Test webviews), so the same narrowing holds here.
          if [ "$FULL_CI" != true ] || [ "$REACT_APPS_CLASS" = sampled ] || [ "$REACT_APPS_CLASS" = fast ]; then
            (cd webviews && python3 ../scripts/ci/webviews_affected.py --base HEAD^1 --head HEAD) > "$RUNNER_TEMP/base-early/affected" ||
              : > "$RUNNER_TEMP/base-early/affected"
            # A pull request whose pick ran fewer than every head shard: only those shards' files can be red there
            # (web-subarea-scope's pr-shard-files, RFD 0023 item 3).
            [ -s "$RUNNER_TEMP/webviews-durations/pr-shard-files" ] &&
              cp "$RUNNER_TEMP/webviews-durations/pr-shard-files" "$RUNNER_TEMP/base-early/affected"
            [ -s "$RUNNER_TEMP/base-early/affected" ] && only=(--only "$RUNNER_TEMP/base-early/affected")
          fi
          git checkout -q --detach HEAD^1
          python3 "$runner/webviews_test_history.py" early-files "$RUNNER_TEMP/webviews-durations/base-reds.json" \
            --shard "$SHARD" --shard-count "$SHARD_COUNT" --durations "$RUNNER_TEMP/webviews-durations/manifest.json" \
            --root webviews "${only[@]}" > "$RUNNER_TEMP/base-early/files" || : > "$RUNNER_TEMP/base-early/files"
          count="$(grep -c . "$RUNNER_TEMP/base-early/files" || true)"
          echo "base red files for this shard: $count"; sed 's/^/  /' "$RUNNER_TEMP/base-early/files"
          echo "files=$count" >> "${GITHUB_OUTPUT:-/dev/null}"

      - name: Restore pinned Bun 1.4.4 from the CI cache bucket
        if: ${{ steps.pick.outputs.files != '0' }}
        shell: bash
        continue-on-error: true
        run: bash "$GITHUB_WORKSPACE/scripts/ci/toolchain-r2.sh" restore bun 1.4.4 || true

      - name: Setup Bun
        if: ${{ steps.pick.outputs.files != '0' }}
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.4"
          no-cache: ${{ !startsWith(github.workspace, '/home/runner/work/') || !(github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && github.event_name != 'merge_group' && contains(fromJSON('["refs/heads/main","refs/heads/feat-cmux-next","refs/heads/nightly-next"]'), github.ref)) }}

      - name: Use the base's bun
        if: ${{ steps.pick.outputs.files != '0' }}
        run: scripts/cmux-next/private-bun.sh

      # Why: docs/ci/cmux-next-workflow-notes/2026-11-26-bun-cache-warm.md (detector: tests/test_ci_bun_cache_warm.py).
      - name: Is this runner's own Bun package cache warm
        id: bun-warm
        timeout-minutes: 1
        shell: bash
        run: |
          d="${BUN_INSTALL_CACHE_DIR:-$HOME/.bun/install/cache}"
          if [[ "${RESTORE_ON_WARM:-}" != 1 && -n "$(find "$d" -mindepth 1 -maxdepth 1 -print -quit 2>/dev/null)" ]]; then
            echo "warm=true" >> "$GITHUB_OUTPUT"
            echo "$d is already filled from this runner's earlier jobs; the cache archive is not unpacked over it"
          fi
        env:
          RESTORE_ON_WARM: ${{ vars.CI_BUN_CACHE_RESTORE_WARM }}

      - name: Cache Bun package cache
        timeout-minutes: 3
        continue-on-error: true
        if: ${{ (steps.pick.outputs.files != '0') && github.ref == 'refs/heads/feat-cmux-next' }}
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: ~/.bun/install/cache
          key: bun-web-shared-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('web/bun.lock', 'webviews/bun.lock', 'cmux-tui/frontends/web/bun.lock', 'scripts/react-doctor/bun.lock', 'agent-chat/bun.lock', 'backend/bun.lock') }}
          restore-keys: bun-web-shared-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache Bun package cache (restore only off feat-cmux-next)
        timeout-minutes: 3
        continue-on-error: true
        if: ${{ ((steps.pick.outputs.files != '0') && github.ref != 'refs/heads/feat-cmux-next') && steps.bun-warm.outputs.warm != 'true' }}
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: ~/.bun/install/cache
          key: bun-web-shared-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('web/bun.lock', 'webviews/bun.lock', 'cmux-tui/frontends/web/bun.lock', 'scripts/react-doctor/bun.lock', 'agent-chat/bun.lock', 'backend/bun.lock') }}
          restore-keys: bun-web-shared-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache Playwright browsers
        if: ${{ (steps.pick.outputs.files != '0') && github.ref == 'refs/heads/feat-cmux-next' }}
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: ~/.cache/ms-playwright
          key: playwright-webviews-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('webviews/bun.lock') }}

      - name: Cache Playwright browsers (restore only off feat-cmux-next)
        if: ${{ (steps.pick.outputs.files != '0') && github.ref != 'refs/heads/feat-cmux-next' }}
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: ~/.cache/ms-playwright
          key: playwright-webviews-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('webviews/bun.lock') }}

      - name: Restore pinned Node 24.22.1 from the CI cache bucket
        if: ${{ steps.pick.outputs.files != '0' }}
        shell: bash
        continue-on-error: true
        run: bash "$GITHUB_WORKSPACE/scripts/ci/toolchain-r2.sh" restore node 24.22.1 || true

      - name: Setup Node
        timeout-minutes: 5
        if: ${{ steps.pick.outputs.files != '0' }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24.22.1"

      - name: Install webview dependencies
        if: ${{ steps.pick.outputs.files != '0' }}
        working-directory: webviews
        run: bun install --frozen-lockfile

      - name: Build base web bundles
        if: ${{ steps.pick.outputs.files != '0' }}
        run: |
          key="$(python3 scripts/cmux-next/web-bundle-key.py . --source)"
          python3 -I "$RUNNER_TEMP/compile_preflight.py" web-artifact verify "$RUNNER_TEMP/ci-web-base-bundles" "$key"
          (cd webviews && bun scripts/pages/gen-strings.mjs)
          ./scripts/cmux-next/build-web-bundles.sh --from "$RUNNER_TEMP/ci-web-base-bundles"

      - name: Install headless engines
        if: ${{ steps.pick.outputs.files != '0' }}
        working-directory: webviews
        run: bash "$RUNNER_TEMP/apt-no-service-restarts.sh" && ./node_modules/.bin/playwright install --with-deps webkit && "$(git rev-parse --show-toplevel)/scripts/ci/ensure-system-chrome.sh" && "$RUNNER_TEMP/pin-browser-test-font.sh"

      # The base check's replay with the head's runner and no retry, at the head shards' widths (the base check
      # replays one at a time; one at a time here, shard 1's 600 s file plus the others ran past the head shards).
      - name: Run the base reds
        if: ${{ steps.pick.outputs.files != '0' }}
        working-directory: webviews
        env:
          CMUX_NEXT_STYLE_GUARDS: warn
          CMUX_WEB_TEST_JOBS: "8"
          CMUX_WEB_TEST_DEV_JOBS: "4"
          CMUX_WEB_TEST_SIZED_FOR_VCPU: "16"
          CMUX_WEB_TEST_RETRIES: "0"
          SHARD: ${{ matrix.shard }}
        run: |
          early="$RUNNER_TEMP/base-early"
          # These files are red on the base, and the slow ones fail at their 450-900 s limits one at a time while each
          # Vite config warms: 41 of 73 runs (11-21 09:30-16:50Z) were cancelled at the job limit still testing, with no
          # verdict. No file starts, and none runs, past 60 s before the job's 8 minutes end (the upload's margin); a
          # file it did not finish has no result, and react-apps-base-check replays it.
          started="${CMUX_WEB_TEST_JOB_STARTED:-}"
          [[ "$started" =~ ^[0-9]+$ ]] || started=$(( $(date +%s) - 180 ))
          export CMUX_WEB_TEST_STOP_AT=$(( started + 8 * 60 - 60 ))
          CMUX_WEB_TEST_FILES="$(cat "$early/files")" \
            CMUX_WEB_TEST_RESULTS="$early/results.json" \
            env -u CMUX_WEB_TEST_SHARD -u CMUX_WEB_TEST_SHARD_COUNT -u CMUX_PR_CHANGED_FILES \
            bash "$early/runner/run-webviews-tests.sh" || true
          mkdir -p "$early/out"
          python3 - "$(git rev-parse HEAD)" "$early/files" "$early/results.json" "$early/out/early-$SHARD.json" <<'PY'
          import json, sys
          sha, files, found, out = sys.argv[1:]
          results = json.load(open(found))
          json.dump({"sha": sha, "files": [f for f in open(files).read().splitlines() if f], "results": results},
                    open(out, "w"), sort_keys=True)
          PY

      - name: Upload the early base results
        if: ${{ steps.pick.outputs.files != '0' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: react-apps-base-early-shard${{ matrix.shard }}
          overwrite: true
          path: ${{ runner.temp }}/base-early/out/
          if-no-files-found: ignore
          # A same-run handoff to react-apps-base-check (a failed-job re-run of it reads it again the same day).
          retention-days: 1

  # A pull request's base comparison is deliberately separate from the head
  # shards. Replaying the base's failed files requires its own install and bundle
  # build; doing that after the head suite in one 40-minute job made shard 3 hit
  # the timeout before it could publish a verdict. The early base shards above
  # run the recorded base reds in parallel with the head suite; this one job
  # replays only the head reds that remain after those results are joined.
  react-apps-base-check:
    needs: [web-subarea-scope, react-apps-check-shard, react-apps-head-bundles, react-apps-base-bundles]
    if: ${{ !cancelled() && needs.react-apps-check-shard.result == 'success' && github.event_name == 'pull_request' && inputs.web == 'true' && needs.web-subarea-scope.outputs.react_apps == 'true' }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || vars.CI_REACT_SHARD_RUNNER || 'cmux-linux' }}
    # 55: the base replay and the head re-run of up to 25 files each (13 files took about 6 minutes alone). The base's
    # replays after the first share what is left of it (the compare step's JOB_TIMEOUT_MINUTES and REPLAY_RESERVE).
    timeout-minutes: 55
    # actions: read: the base's webview test history is an artifact of its newest push.
    permissions:
      contents: read
      actions: read
      id-token: write
    # One job joins every head shard after the parallel head and early-base work.
    name: react-apps-base-check
    steps:
      # The base is the merge commit's first parent, the commit the head shards
      # were merged onto (their prScope diff is HEAD^1 too). pull_request.base.sha
      # lags it once the base moves: #27045's replay ran on a base 12 commits
      # older, where agent-pane-no-capsules still passed, so a red the merge
      # parent already had (#27019's capsule bars) was charged to the change.
      - name: Checkout the merge commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 2
          persist-credentials: false

      # Each head shard's artifact in a folder of its own name (no merge-multiple: every shard has the same file names).
      - name: Download head webview results
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          pattern: react-apps-head-results-shard*
          path: ${{ runner.temp }}/head-shards

      # A shard that published no results fails the check here, as its missing download failed its own base check.
      - name: Join the head shards' results
        env:
          # react-apps-check-shard's matrix: the shards this pull request ran (tests/test_webviews_test_history.py).
          HEAD_SHARDS: ${{ needs.web-subarea-scope.outputs.react_shards }}
        run: python3 scripts/ci/webviews_test_history.py heads "$RUNNER_TEMP/head-shards" --matrix "$HEAD_SHARDS" --out "$RUNNER_TEMP/head-results"

      # Every early shard's verdicts (react-apps-base-early): any shard's head reds may be any early shard's files.
      - name: Download the early base results
        continue-on-error: true
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          pattern: react-apps-base-early-shard*
          merge-multiple: true
          path: ${{ runner.temp }}/base-early

      - name: Download the head bundles from R2
        if: ${{ needs.react-apps-head-bundles.outputs.web_bundle_transport == 'r2' }}
        timeout-minutes: 3
        uses: ./.github/actions/r2-artifact/download
        with:
          name: ${{ needs.react-apps-head-bundles.outputs.web_bundle_artifact }}
          path: ${{ runner.temp }}/ci-web-head-bundles

      - name: Download the head bundles without OIDC
        if: ${{ needs.react-apps-head-bundles.outputs.web_bundle_transport == 'github' }}
        timeout-minutes: 3
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ${{ needs.react-apps-head-bundles.outputs.web_bundle_artifact }}
          path: ${{ runner.temp }}/ci-web-head-bundles

      - name: Download the base bundles from R2
        if: ${{ (needs.web-subarea-scope.outputs.base_bundle_same == 'true' && needs.react-apps-head-bundles.outputs.web_bundle_transport || needs.react-apps-base-bundles.outputs.web_bundle_transport) == 'r2' }}
        timeout-minutes: 3
        uses: ./.github/actions/r2-artifact/download
        with:
          name: ${{ needs.web-subarea-scope.outputs.base_bundle_same == 'true' && needs.react-apps-head-bundles.outputs.web_bundle_artifact || needs.react-apps-base-bundles.outputs.web_bundle_artifact }}
          path: ${{ runner.temp }}/ci-web-base-bundles

      - name: Download the base bundles without OIDC
        if: ${{ (needs.web-subarea-scope.outputs.base_bundle_same == 'true' && needs.react-apps-head-bundles.outputs.web_bundle_transport || needs.react-apps-base-bundles.outputs.web_bundle_transport) == 'github' }}
        timeout-minutes: 3
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ${{ needs.web-subarea-scope.outputs.base_bundle_same == 'true' && needs.react-apps-head-bundles.outputs.web_bundle_artifact || needs.react-apps-base-bundles.outputs.web_bundle_artifact }}
          path: ${{ runner.temp }}/ci-web-base-bundles

      # A head shard with no red has nothing to replay: the compare below then needs only python, so the
      # bun install, the base bundle build and the browsers are skipped (3 to 11 min a shard, paid by every
      # green head before the verdict). Reds, or results it cannot read, keep the whole replay.
      - name: Use the merge parent as the base
        id: head
        run: |
          # The job's clock, for the compare step's replay budget (the checkout before it is in REPLAY_RESERVE).
          date +%s > "$RUNNER_TEMP/job-started"
          # The head's font pin, kept for the base's engines: a base from before it has no such script, and the
          # comparison has to draw the same face as the head did (pin-browser-test-font.sh needs no checkout).
          cp scripts/ci/pin-browser-test-font.sh scripts/ci/apt-no-service-restarts.sh scripts/ci/compile_preflight.py "$RUNNER_TEMP/"
          git checkout -q --detach HEAD^1
          if failed="$(python3 scripts/ci/webviews_test_results.py --failed-files "$RUNNER_TEMP/head-results/webviews-head-results.json")"; then
            reds="$(printf '%s' "$failed" | grep -c . || true)"
          else
            reds=unknown
          fi
          echo "head shard reds: $reds"
          echo "reds=$reds" >> "${GITHUB_OUTPUT:-/dev/null}"

      # The base's recent push verdicts (the webviews-test-history artifact its newest push
      # uploaded). A test whose verdict flipped by itself there passed this replay by chance
      # as often as not, so it only warns: agent-pane-suggested-tasks was charged to 9 of 40
      # sampled red pull request runs (2026-10-30). Read-only and optional: no history means no
      # flakes. Two requests (the list and the download), unless the head's results show no reds.
      # A push with the merge parent's webview inputs already ran its tree: the reds it answers
      # for (known) need no replay, and when it answers all of them the bun install, the base
      # bundle build and the browsers below are skipped too (replay=0). Any failure here leaves
      # replay unset, and every red file replays as before.
      # The cached copy first (webviews-test-history saves it beside its artifact; web-subarea-scope reads the same):
      # the artifact list answered 403 (rate limit remaining 0) on cmux#49338's base check (run 44958089696,
      # 2026-11-21), and every red file then replayed.
      - name: Take the base's webview test history from the cache
        id: history-cache
        if: ${{ steps.head.outputs.reds != '0' }}
        continue-on-error: true
        uses: ./.github/actions/cache-restore
        env:
          CI_CACHE_R2_PUBLIC_URL: https://ci-cache-next.cmux.com
        with:
          # R2, as web-subarea-scope reads it: the GitHub cache is over its 10 GB cap and evicts this entry.
          backend: r2
          path: .webviews-test-history-cache
          key: webviews-test-history-${{ github.base_ref }}-${{ github.run_id }}
          restore-keys: webviews-test-history-${{ github.base_ref }}-
      - name: Restore the base's webview test history
        id: history
        if: ${{ steps.head.outputs.reds != '0' }}
        continue-on-error: true
        timeout-minutes: 2
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_RESULTS: ${{ runner.temp }}/head-results/webviews-head-results.json
        run: |
          runner="$RUNNER_TEMP/head-results/runner"
          history="$RUNNER_TEMP/webviews-test-history/history.json"
          # Head results it cannot read are unknown, not "no reds": fetch the history then too.
          if reds="$(python3 "$runner/webviews_test_results.py" --failed-files "$HEAD_RESULTS")" && [ -z "$reds" ]; then
            echo "no head reds: the base's history is not needed"
            exit 0
          fi
          cached=.webviews-test-history-cache/history.json
          if [ -s "$cached" ]; then
            mkdir -p "$(dirname "$history")" && cp "$cached" "$history" && echo "webview test history: the Actions cache's copy"
          else
            python3 "$runner/webviews_test_history.py" fetch "$history" --repo "$GITHUB_REPOSITORY" --branch "$BASE_REF"
          fi
          if [ -z "$reds" ]; then
            echo "head results unreadable: every red file replays"
            exit 0
          fi
          key="$(python3 scripts/ci/webviews_test_history.py inputs)"
          # Other pull requests' base checks at this merge parent's inputs (and these tools) share their replays: known
          # reads them as pushes at the key. Only same-repository runs; an unread one only leaves its files to replay.
          # The tools key reads the head's ci-web.yml (the checkout is the merge parent now), so a pull request that
          # changes how its replay runs shares under a name of its own.
          name="$(git show "$GITHUB_SHA:.github/workflows/ci-web.yml" > "$RUNNER_TEMP/head-ci-web.yml" &&
            python3 "$runner/webviews_test_history.py" shared-name --inputs "$key" --runner "$runner" --workflow "$RUNNER_TEMP/head-ci-web.yml")" &&
            echo "shared=$name" >> "${GITHUB_OUTPUT:-/dev/null}" &&
            python3 "$runner/webviews_test_history.py" fetch-shared "$history" "$history.shared" --repo "$GITHUB_REPOSITORY" \
              --name "$name" --inputs "$key" --run-id "$GITHUB_RUN_ID" || cp "$history" "$history.shared"
          python3 "$runner/webviews_test_history.py" known "$history.shared" --inputs "$key" --names "$HEAD_RESULTS" \
            --out "$RUNNER_TEMP/base-known.json" > "$RUNNER_TEMP/base-replay-files"
          # The files react-apps-base-early already ran on this merge parent take its verdicts (early-known leaves both
          # files as they were on any failure, so they replay).
          python3 "$runner/webviews_test_history.py" early-known "$RUNNER_TEMP/base-early" --sha "$(git rev-parse HEAD)" \
            --replay "$RUNNER_TEMP/base-replay-files" --known "$RUNNER_TEMP/base-known.json" ||
            echo "the early base results are unread: their files replay"
          # A file whose head reds are all flaky on the base only warns, whatever its replay says (guards_new_reds.py
          # --flaky), so it is not replayed; the compare step below adds to this list, never drops from it.
          flaky="$RUNNER_TEMP/flaky-on-base"
          python3 "$runner/webviews_test_history.py" flaky "$history" --names "$HEAD_RESULTS" > "$flaky" || : > "$flaky"
          python3 "$runner/test_reds.py" tap-flaky --workflow 'cmux-next post-merge batch' --job react-apps-check \
            --log-dir "$RUNNER_TEMP/head-results/raw-logs" >> "$flaky" || :
          python3 "$runner/webviews_test_history.py" flaky-only "$flaky" --replay "$RUNNER_TEMP/base-replay-files" \
            --names "$HEAD_RESULTS" || echo "the flaky list is unread: its files replay"
          count="$(grep -c . "$RUNNER_TEMP/base-replay-files" || true)"
          echo "the base's push history and early run answer for $(python3 -c 'import json,sys; print(len(json.load(open(sys.argv[1]))))' "$RUNNER_TEMP/base-known.json") red tests at inputs $key; $count files still replay"
          echo "replay=$count" >> "${GITHUB_OUTPUT:-/dev/null}"

      - name: Restore pinned Bun 1.4.4 from the CI cache bucket
        if: ${{ steps.head.outputs.reds != '0' }}
        shell: bash
        continue-on-error: true
        run: bash "$GITHUB_WORKSPACE/scripts/ci/toolchain-r2.sh" restore bun 1.4.4 || true

      - name: Setup Bun
        if: ${{ steps.head.outputs.reds != '0' }}
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.4"
          no-cache: ${{ !startsWith(github.workspace, '/home/runner/work/') || !(github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && github.event_name != 'merge_group' && contains(fromJSON('["refs/heads/main","refs/heads/feat-cmux-next","refs/heads/nightly-next"]'), github.ref)) }}

      # The base replays its reds with the bun its own webviews/package.json declares,
      # so a PR that moves the pin (or a base whose bun check is exact) compares like
      # with like; private-bun.sh is the base's copy and reads the base's devEngines.
      - name: Use the base's bun
        if: ${{ steps.head.outputs.reds != '0' && steps.history.outputs.replay != '0' }}
        run: scripts/cmux-next/private-bun.sh

      # Why: docs/ci/cmux-next-workflow-notes/2026-11-26-bun-cache-warm.md (detector: tests/test_ci_bun_cache_warm.py).
      - name: Is this runner's own Bun package cache warm
        id: bun-warm
        timeout-minutes: 1
        shell: bash
        run: |
          d="${BUN_INSTALL_CACHE_DIR:-$HOME/.bun/install/cache}"
          if [[ "${RESTORE_ON_WARM:-}" != 1 && -n "$(find "$d" -mindepth 1 -maxdepth 1 -print -quit 2>/dev/null)" ]]; then
            echo "warm=true" >> "$GITHUB_OUTPUT"
            echo "$d is already filled from this runner's earlier jobs; the cache archive is not unpacked over it"
          fi
        env:
          RESTORE_ON_WARM: ${{ vars.CI_BUN_CACHE_RESTORE_WARM }}

      - name: Cache Bun package cache
        timeout-minutes: 3
        continue-on-error: true
        if: ${{ (steps.head.outputs.reds != '0') && github.ref == 'refs/heads/feat-cmux-next' }}
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: ~/.bun/install/cache
          key: bun-web-shared-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('web/bun.lock', 'webviews/bun.lock', 'cmux-tui/frontends/web/bun.lock', 'scripts/react-doctor/bun.lock', 'agent-chat/bun.lock', 'backend/bun.lock') }}
          restore-keys: bun-web-shared-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache Bun package cache (restore only off feat-cmux-next)
        timeout-minutes: 3
        continue-on-error: true
        if: ${{ ((steps.head.outputs.reds != '0') && github.ref != 'refs/heads/feat-cmux-next') && steps.bun-warm.outputs.warm != 'true' }}
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: ~/.bun/install/cache
          key: bun-web-shared-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('web/bun.lock', 'webviews/bun.lock', 'cmux-tui/frontends/web/bun.lock', 'scripts/react-doctor/bun.lock', 'agent-chat/bun.lock', 'backend/bun.lock') }}
          restore-keys: bun-web-shared-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache Playwright browsers
        if: ${{ (steps.head.outputs.reds != '0') && github.ref == 'refs/heads/feat-cmux-next' }}
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: ~/.cache/ms-playwright
          key: playwright-webviews-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('webviews/bun.lock') }}

      - name: Cache Playwright browsers (restore only off feat-cmux-next)
        if: ${{ (steps.head.outputs.reds != '0') && github.ref != 'refs/heads/feat-cmux-next' }}
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: ~/.cache/ms-playwright
          key: playwright-webviews-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('webviews/bun.lock') }}

      - name: Restore pinned Node 24.22.1 from the CI cache bucket
        if: ${{ steps.head.outputs.reds != '0' }}
        shell: bash
        continue-on-error: true
        run: bash "$GITHUB_WORKSPACE/scripts/ci/toolchain-r2.sh" restore node 24.22.1 || true

      - name: Setup Node
        if: ${{ steps.head.outputs.reds != '0' }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24.22.1"

      - name: Install webview dependencies
        if: ${{ steps.head.outputs.reds != '0' && steps.history.outputs.replay != '0' }}
        working-directory: webviews
        run: bun install --frozen-lockfile

      - name: Build base web bundles
        if: ${{ steps.head.outputs.reds != '0' && steps.history.outputs.replay != '0' }}
        env:
          BASE_ARTIFACT: ${{ needs.web-subarea-scope.outputs.base_bundle_same == 'true' && needs.react-apps-head-bundles.outputs.web_bundle_key || needs.react-apps-base-bundles.outputs.web_bundle_key }}
          HEAD_ARTIFACT: ${{ needs.react-apps-head-bundles.outputs.web_bundle_key }}
        run: |
          key="$(python3 scripts/cmux-next/web-bundle-key.py . --source)"
          restored=""
          if [ "$key" = "$HEAD_ARTIFACT" ]; then
            restored="$RUNNER_TEMP/ci-web-head-bundles"
          elif [ -n "$BASE_ARTIFACT" ]; then
            restored="$RUNNER_TEMP/ci-web-base-bundles"
          fi
          if [ -n "$restored" ]; then
            python3 -I "$RUNNER_TEMP/compile_preflight.py" web-artifact verify "$restored" "$key"
            (cd webviews && bun scripts/pages/gen-strings.mjs)
            ./scripts/cmux-next/build-web-bundles.sh --from "$restored"
          else
            # No early replay ran: this single late consumer is the only base build.
            ./scripts/cmux-next/build-web-bundles.sh --force
          fi

      - name: Install headless engines
        if: ${{ steps.head.outputs.reds != '0' && steps.history.outputs.replay != '0' }}
        working-directory: webviews
        run: bash "$RUNNER_TEMP/apt-no-service-restarts.sh" && ./node_modules/.bin/playwright install --with-deps webkit && "$(git rev-parse --show-toplevel)/scripts/ci/ensure-system-chrome.sh" && "$RUNNER_TEMP/pin-browser-test-font.sh"

      # Its compare exits red on the change's reds and lists their files for the head re-run below;
      # the job's verdict is the last step's. A red the base passed is replayed there again, at most
      # two more times (base_again) and only its files, until the base fails it: one passing replay of a
      # test that flaps called it the change's (cmux#41254, run 43006460063: attempt 2's replay
      # passed the webkit stream-row overlap test, attempt 3's failed it).
      - name: Run base reds and compare
        id: base
        continue-on-error: true
        working-directory: webviews
        env:
          HEAD_RESULTS: ${{ runner.temp }}/head-results/webviews-head-results.json
          BASE_RESULTS: ${{ runner.temp }}/base-results.json
          KNOWN_REPLAY: ${{ steps.history.outputs.replay }}
          # The base replays after the first share one budget: this job's timeout-minutes (keep the two equal) less
          # the time gone and REPLAY_RESERVE seconds for the head re-run (its setup, up to 11 min, and one file at
          # the runner's 900 s ceiling) and the verdict. #41414 review: three replays of a 900 s file plus the
          # head re-run came to 60 minutes inside a 55-minute job, cut with no verdict.
          JOB_TIMEOUT_MINUTES: "55"
          REPLAY_RESERVE: "1700"
          CMUX_NEXT_STYLE_GUARDS: warn
          CMUX_WEB_TEST_JOBS: "1"
          CMUX_WEB_TEST_RETRIES: "0"
        run: |
          files="$RUNNER_TEMP/base-files"
          if [ -n "${KNOWN_REPLAY:-}" ]; then
            cat "$RUNNER_TEMP/base-replay-files"
          else
            python3 ../scripts/ci/webviews_test_results.py --failed-files "$HEAD_RESULTS"
          fi |
            while IFS= read -r file; do
              if [ -n "$file" ] && git cat-file -e "HEAD:webviews/$file" 2>/dev/null; then
                printf '%s\n' "$file"
              fi
            done > "$files"
          if [ ! -s "$files" ]; then
            echo "no head reds to replay on the base"
            # A head-red file that is absent from the base is a new failure.
            # An empty base map makes guards_new_reds.py report it instead of
            # incorrectly treating the head map as a base verdict.
            printf '{}\n' > "$BASE_RESULTS"
          else
            # The first replay ends where the replays after it must (the job's timeout less REPLAY_RESERVE, counted
            # from the job clock): it runs one file at a time, and a head with many reds ran it into the 55 minutes
            # with no verdict (job 137225088381: 200 head reds, 152 files replayed, cancelled at file 120). A file it
            # did not reach has no base result: mark-unreached makes those files' reds "base result unavailable"
            # (deferred to the merge gate, the step fails), never the change's and never excused.
            # It never stops before its files: they are the head's reds, so it gets one whole file's time from
            # now even when the setup ate the reserve's budget (cmux#53976, job 138896898305: the setup ran to
            # 01:24, the fixed stop was 01:25, and its one file was NOT RUN, a base red failing the change).
            first_started="$(cat "$RUNNER_TEMP/job-started" 2>/dev/null || echo 0)"
            stop_at="$(python3 "$RUNNER_TEMP/head-results/runner/webviews_test_results.py" --first-replay-stop-at \
              "$first_started" "${JOB_TIMEOUT_MINUTES:-55}" "${REPLAY_RESERVE:-0}" || true)"
            CMUX_WEB_TEST_FILES="$(cat "$files")" \
              CMUX_WEB_TEST_RESULTS="$BASE_RESULTS" \
              CMUX_WEB_TEST_STOP_AT="$stop_at" \
              env -u CMUX_WEB_TEST_SHARD -u CMUX_WEB_TEST_SHARD_COUNT -u CMUX_PR_CHANGED_FILES \
              bash "$RUNNER_TEMP/head-results/runner/run-webviews-tests.sh" || true
            # Shared before the unreached marks: only files this replay ran are evidence for the next pull request.
            cp "$BASE_RESULTS" "$RUNNER_TEMP/base-replayed.json" || :
            python3 "$RUNNER_TEMP/head-results/runner/webviews_test_results.py" --mark-unreached "$files" "$BASE_RESULTS" ||
              echo "the first replay's unreached files were not marked"
          fi
          if [ -n "${KNOWN_REPLAY:-}" ]; then
            # The history's verdicts join the replay's (their files are disjoint).
            python3 - "$RUNNER_TEMP/base-known.json" "$BASE_RESULTS" <<'PY'
          import json, sys
          known = json.load(open(sys.argv[1]))
          try:
              base = json.load(open(sys.argv[2]))
          except (OSError, ValueError):
              base = {}
          json.dump({**known, **base}, open(sys.argv[2], "w"), sort_keys=True)
          PY
          fi
          runner="$RUNNER_TEMP/head-results/runner"
          flaky="$RUNNER_TEMP/flaky-on-base"
          # Adds to the history step's list: a file it left unreplayed keeps the names that excused it.
          python3 "$runner/webviews_test_history.py" flaky "$RUNNER_TEMP/webviews-test-history/history.json" \
            --names "$HEAD_RESULTS" >> "$flaky" || :
          # TAP adds only active quarantines whose exact diagnostic matches a whole final head attempt.
          # Raw artifacts retain green and red output; unavailable history contributes no waiver.
          python3 "$runner/test_reds.py" tap-flaky --workflow 'cmux-next post-merge batch' --job react-apps-check \
            --log-dir "$RUNNER_TEMP/head-results/raw-logs" >> "$flaky"
          sort -u "$flaky" -o "$flaky"
          if [ -s "$flaky" ]; then echo "flipped by themselves on recent base pushes:"; sed 's/^/  /' "$flaky"; fi
          # Replay the files of the reds the base passed again, until it fails them, at most base_again times. None when
          # the history answered every red (replay=0): this base has no install, bundles or browsers then. A replay
          # starts only when its files' limits (one job, no retries) fit the budget left; one that does not fit is not
          # run, and its reds stay the change's, not replayed (never excused). No clock reads as no time left.
          again=() base_again=2
          : "${JOB_TIMEOUT_MINUTES:=0}" "${REPLAY_RESERVE:=0}"  # unset: no budget, no further replay
          started="$(cat "$RUNNER_TEMP/job-started" 2>/dev/null || echo 0)"
          [[ "$started" =~ ^[0-9]+$ ]] || started=0
          if [ "${KNOWN_REPLAY:-}" != "0" ]; then
            for n in $(seq 1 "$base_again"); do
              python3 "$runner/guards_new_reds.py" --new-files --flaky "$flaky" "${again[@]}" "$HEAD_RESULTS" "$BASE_RESULTS" \
                > "$RUNNER_TEMP/base-again-files" || : > "$RUNNER_TEMP/base-again-files"
              # A file the base does not have (a new test file red on the head) cannot replay there: its reds stay the
              # change's. Unfiltered, the limit read below failed on it under -e -o pipefail and ended the step before
              # the verdict (#41414 review); the first replay's own filter above keeps it out of that run the same way.
              while IFS= read -r file; do
                if [ -n "$file" ] && git cat-file -e "HEAD:webviews/$file" 2>/dev/null; then
                  printf '%s\n' "$file"
                elif [ -n "$file" ]; then
                  echo "not on the base, the change's own, not replayed: $file" >&2
                fi
              done < "$RUNNER_TEMP/base-again-files" > "$RUNNER_TEMP/base-again-present"
              mv "$RUNNER_TEMP/base-again-present" "$RUNNER_TEMP/base-again-files"
              [ -s "$RUNNER_TEMP/base-again-files" ] || break
              left=$(( JOB_TIMEOUT_MINUTES * 60 - REPLAY_RESERVE - ($(date +%s) - started) )) need=0
              while IFS= read -r file; do
                limit="${CMUX_WEB_TEST_FILE_TIMEOUT:-120}"
                declared="$(head -n 20 "$file" 2>/dev/null | sed -n 's|^// cmux-web-test-timeout: \([1-9][0-9]*\)$|\1|p' | head -n 1 || :)"
                if [ -n "$declared" ] && [ "$declared" -gt "$limit" ]; then limit="$declared"; fi
                if [ "$limit" -gt 900 ]; then limit=900; fi
                need=$(( need + limit ))
              done < "$RUNNER_TEMP/base-again-files"
              if [ "$need" -gt "$left" ]; then
                echo "the replay budget (${left}s left) cannot fit another base replay (${need}s); the change's own, not replayed:"
                sed 's/^/  /' "$RUNNER_TEMP/base-again-files"
                break
              fi
              echo "replaying on the base again ($n of $base_again):"; sed 's/^/  /' "$RUNNER_TEMP/base-again-files"
              CMUX_WEB_TEST_FILES="$(cat "$RUNNER_TEMP/base-again-files")" \
                CMUX_WEB_TEST_RESULTS="$RUNNER_TEMP/base-again-$n.json" \
                env -u CMUX_WEB_TEST_SHARD -u CMUX_WEB_TEST_SHARD_COUNT -u CMUX_PR_CHANGED_FILES \
                bash "$runner/run-webviews-tests.sh" || true
              again+=(--base-again "$RUNNER_TEMP/base-again-$n.json")
            done
          fi
          status=0
          python3 "$runner/guards_new_reds.py" --label "Webview test" --flaky "$flaky" "${again[@]}" "$HEAD_RESULTS" "$BASE_RESULTS" || status=$?
          python3 "$runner/guards_new_reds.py" --new-files --flaky "$flaky" "${again[@]}" "$HEAD_RESULTS" "$BASE_RESULTS" \
            > "$RUNNER_TEMP/head-rerun-files" || : > "$RUNNER_TEMP/head-rerun-files"
          # At most 25 from any one head shard, the cap each head shard's own base check held.
          echo "rerun=$([ "$status" -ne 0 ] && python3 "$runner/webviews_test_history.py" rerun-fits "$RUNNER_TEMP/head-rerun-files" \
            --shards "$RUNNER_TEMP/head-results/shards.json" --cap 25 && echo true || echo false)" >> "${GITHUB_OUTPUT:-/dev/null}"
          exit "$status"

      # This replay, as a one-run history at the merge parent's inputs key, for the next pull request at that key and
      # these tools (the history step's fetch-shared). Its own replays only (the first and each base_again, red when
      # any was): the verdicts it took from the history or the early run are not new evidence. Same-repository pull
      # requests only; best effort, it never changes this check's verdict.
      - name: Share this base replay
        id: share
        if: ${{ !cancelled() && steps.base.outcome != 'skipped' && steps.history.outputs.shared != '' && github.event.pull_request.head.repo.full_name == github.repository }}
        continue-on-error: true
        timeout-minutes: 2
        run: |
          found=("$RUNNER_TEMP/base-replayed.json")
          [ -s "${found[0]}" ] || { echo "no replay ran here: nothing to share"; exit 0; }
          for again in "$RUNNER_TEMP"/base-again-*.json; do [ -e "$again" ] && found+=("$again"); done
          key="$(python3 scripts/ci/webviews_test_history.py inputs)"
          mkdir -p "$RUNNER_TEMP/base-share"
          python3 "$RUNNER_TEMP/head-results/runner/webviews_test_history.py" record /dev/null "$RUNNER_TEMP/base-share/history.json" \
            --sha "$(git rev-parse HEAD)" --time "$(date +%s)" --inputs "$key" --attempt "$GITHUB_RUN_ATTEMPT" "${found[@]}"
          echo "upload=true" >> "$GITHUB_OUTPUT"

      - name: Upload this base replay
        if: ${{ steps.share.outputs.upload == 'true' }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.history.outputs.shared }}
          path: ${{ runner.temp }}/base-share/history.json
          retention-days: 1
          if-no-files-found: ignore

      # A red the base replay passed is re-run once, alone, on the head before it is charged to the
      # change: the head shard retries a red file alone only while its retry budget lasts, so a late
      # red on a long shard was never retried. #27710 (run 41525196343) went red on three
      # gallery-frame timeouts its shards had no budget left to retry; the base push after it merged
      # passed all three. At most 25 files: a shard that ran out of budget keeps many files red at once,
      # every one a timeout or an unretried first failure, so 10 skipped the very case this re-run is for.
      # #35163 (run 41890002293) was charged with 13 such files at three heads (16 and 13 at the earlier
      # two); the base replay passed every one. A change with more than 25 is not flaking.
      - name: Check out the head again
        if: ${{ steps.base.outputs.rerun == 'true' }}
        run: git checkout -q --detach "$GITHUB_SHA"

      - name: Use the head's bun
        if: ${{ steps.base.outputs.rerun == 'true' }}
        run: scripts/cmux-next/private-bun.sh

      - name: Install head webview dependencies
        if: ${{ steps.base.outputs.rerun == 'true' }}
        working-directory: webviews
        run: bun install --frozen-lockfile

      - name: Build head web bundles
        if: ${{ steps.base.outputs.rerun == 'true' }}
        run: |
          key="$(python3 scripts/cmux-next/web-bundle-key.py . --source)"
          python3 -I scripts/ci/compile_preflight.py web-artifact verify "$RUNNER_TEMP/ci-web-head-bundles" "$key"
          (cd webviews && bun scripts/pages/gen-strings.mjs)
          ./scripts/cmux-next/build-web-bundles.sh --from "$RUNNER_TEMP/ci-web-head-bundles"

      - name: Install head headless engines
        if: ${{ steps.base.outputs.rerun == 'true' }}
        working-directory: webviews
        run: bash "$(git rev-parse --show-toplevel)/scripts/ci/apt-no-service-restarts.sh" && ./node_modules/.bin/playwright install --with-deps webkit && "$(git rev-parse --show-toplevel)/scripts/ci/ensure-system-chrome.sh" && "$(git rev-parse --show-toplevel)/scripts/ci/pin-browser-test-font.sh"

      - name: Re-run the change's reds alone on the head
        id: rerun
        if: ${{ steps.base.outputs.rerun == 'true' }}
        working-directory: webviews
        env:
          HEAD_RESULTS: ${{ runner.temp }}/head-results/webviews-head-results.json
          BASE_RESULTS: ${{ runner.temp }}/base-results.json
          HEAD_RERUN: ${{ runner.temp }}/head-rerun-results.json
          # This job's timeout-minutes (keep them equal), for the re-run's stop.
          JOB_TIMEOUT_MINUTES: "55"
          CMUX_NEXT_STYLE_GUARDS: warn
          CMUX_WEB_TEST_JOBS: "1"
          CMUX_WEB_TEST_RETRIES: "0"
        run: |
          runner="$RUNNER_TEMP/head-results/runner"
          echo "re-running alone on the head:"; sed 's/^/  /' "$RUNNER_TEMP/head-rerun-files"
          # No file runs past two minutes before the job's timeout (the verdict's margin): a file the re-run did not
          # reach is missing from it, so its reds stay the change's, and the job still says so instead of being cut.
          started="$(cat "$RUNNER_TEMP/job-started" 2>/dev/null || echo 0)"
          [[ "$started" =~ ^[0-9]+$ ]] || started=0
          stop_at=""
          if [ "$started" -gt 0 ]; then stop_at=$(( started + JOB_TIMEOUT_MINUTES * 60 - 120 )); fi
          CMUX_WEB_TEST_FILES="$(cat "$RUNNER_TEMP/head-rerun-files")" \
            CMUX_WEB_TEST_STOP_AT="$stop_at" \
            CMUX_WEB_TEST_RESULTS="$HEAD_RERUN" \
            env -u CMUX_WEB_TEST_SHARD -u CMUX_WEB_TEST_SHARD_COUNT -u CMUX_PR_CHANGED_FILES \
            bash "$runner/run-webviews-tests.sh" || true
          again=()
          for found in "$RUNNER_TEMP"/base-again-*.json; do
            [ -e "$found" ] && again+=(--base-again "$found")
          done
          python3 "$runner/guards_new_reds.py" --label "Webview test" --flaky "$RUNNER_TEMP/flaky-on-base" "${again[@]}" \
            --head-rerun "$HEAD_RERUN" "$HEAD_RESULTS" "$BASE_RESULTS"

      - name: Fail on the change's own reds
        if: ${{ !cancelled() && steps.base.outcome == 'failure' && steps.rerun.outcome != 'success' }}
        run: |
          echo "::error title=Webview test verdict::red on this change (see Run base reds and compare${{ steps.rerun.outcome == 'failure' && ' and the head re-run' || '' }})"
          exit 1

  # web / react-doctor (a feat-cmux-next push-only `--fail-on none` report) and the runner
  # capability map only it read are removed (CI catch-value audit, 2026-11-26: 0 catches,
  # 5,771 job-min in 8 days). React Doctor (changed React projects), cmux-next-react-doctor.yml,
  # is the scan of record.

  # Keep one stable required check name for branch protection while the test work
  # itself runs in independent file shards above.
  # A post-merge batch probe (inputs.only set) runs no aggregate: the probed shards answer for themselves.
  react-apps-check:
    needs: [web-subarea-scope, react-apps-check-shard, react-apps-base-check]
    if: ${{ always() && inputs.web == 'true' && needs.web-subarea-scope.outputs.react_apps == 'true' && inputs.only == '' }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || 'cmux-linux' }}
    timeout-minutes: 5
    steps:
      - name: Check webview test shards
        env:
          WEB_INPUTS: ${{ toJSON(inputs) }}
          WEB_NEEDS: ${{ toJSON(needs) }}
          # 'true' unless this is a feat-cmux-next pull request head not handed to land (the shards' land tier).
          WEB_LAND_TIER: ${{ (github.event_name != 'pull_request' || (contains(github.event.pull_request.labels.*.name, 'full-ci') && (github.event.pull_request.base.ref != 'feat-cmux-next' || (github.event.action == 'labeled' && github.event.label.name == 'full-ci') || (vars.CI_FULL_CI_ONE_SHOT || '1') == '0')) || (github.event.pull_request.draft == true && (vars.CI_DRAFT_CHEAP_TIER || '1') == '0') || (github.event.pull_request.draft != true && ((contains(github.event.pull_request.labels.*.name, 'ready-to-land') && vars.CI_LAND_FULL_PER_PR == '1') || github.event.pull_request.base.ref != 'feat-cmux-next' || github.event.pull_request.head.repo.full_name != github.repository || (vars.CI_LAND_TIER || '1') == '0'))) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          def exit_with_verdict(results, what, may_skip=()):
              """scripts/ci/needs_verdict.py PYTHON_RULE, copied verbatim (tests/test_needs_verdict.py)."""
              def word(r):
                  return (r or "").replace(":", " ").split(" ", 1)[0]
              bad = {n: r for n, r in results.items() if word(r) != "success" and not (r == "skipped" and n in may_skip)}
              if not bad:
                  return
              failed = {n: r for n, r in bad.items() if word(r) in ("failure", "invalid")}
              for n, r in bad.items():
                  print(f"{n}: {r or 'none'}", file=sys.stderr)
              if failed:
                  print(f"::error::summary red: {what}: " + "; ".join(f"{n}: {r}" for n, r in failed.items()))
                  sys.exit(1)
              named = ", ".join(f"{n} {r or 'none'}" for n, r in bad.items())
              print(f"::error::no verdict: {what}: {named}; nothing it summarizes was judged: re-run the run")
              sys.exit(3)


          inputs = json.loads(os.environ["WEB_INPUTS"])
          needs = json.loads(os.environ["WEB_NEEDS"])
          required = inputs["web"] == "true" and needs["web-subarea-scope"]["outputs"].get("react_apps") == "true"
          # A cheap head (land tier, #54886) skips the shards and the base replay; they run once it is handed to land.
          # Only an explicit "false" skips: an unset flag keeps the shards required (fail closed).
          required = required and os.environ.get("WEB_LAND_TIER") != "false"
          required_jobs = ["react-apps-check-shard"]
          # A pull request's base replay.
          if os.environ.get("GITHUB_EVENT_NAME") == "pull_request":
              required_jobs.append("react-apps-base-check")
          # On the fleet (react_fleet): pr-pipeline.yml's web-browser step react-apps-check judges this head.
          fleet = needs["web-subarea-scope"]["outputs"].get("react_fleet") == "true"
          if fleet:
              print("react-apps-check runs on the fleet: ci/steps.toml's react-apps-check (pr-pipeline.yml web-browser)")
          exit_with_verdict({name: needs[name]["result"] for name in required_jobs}, "react-apps-check",
                            required_jobs if fleet or not required else ())
          for name in required_jobs:
              print(f"{name}: required={str(required).lower()} result={needs[name]['result']}")
          PY

      - name: Save the green marker for these React inputs
        if: ${{ success() && github.event_name == 'pull_request' && needs.web-subarea-scope.outputs.react_key != '' && needs.web-subarea-scope.outputs.react_apps == 'true' }}
        continue-on-error: true
        run: mkdir -p "$RUNNER_TEMP/react-green-marker" && date -u > "$RUNNER_TEMP/react-green-marker/passed"
      - name: Save the green marker (cache)
        if: ${{ success() && github.event_name == 'pull_request' && needs.web-subarea-scope.outputs.react_key != '' && needs.web-subarea-scope.outputs.react_apps == 'true' }}
        continue-on-error: true
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/react-green-marker
          key: webviews-react-green-${{ needs.web-subarea-scope.outputs.react_key }}

  # The next run's shard split: this run's per-file seconds, averaged with the
  # manifest it split by. Its own job, outside the required react-apps-check:
  # a stalled download or cache save must not time out the gate. A missing
  # manifest only means the next run splits by path hash. A pull request's
  # entry stays in its own ref's scope; fork pull requests save none. A declared light
  # job on the same route as web-subarea-scope (the Linux pool on every attempt), so the
  # manifest is saved to the cache store the router restores it from.
  webviews-test-durations:
    needs: [web-subarea-scope, react-apps-check-shard]
    if: ${{ !cancelled() && inputs.web == 'true' && needs.web-subarea-scope.outputs.react_apps == 'true' && needs.react-apps-check-shard.result != 'skipped' }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || 'cmux-linux' }}
    timeout-minutes: 5
    steps:
      - name: Checkout the shard helper
        id: durations-checkout
        continue-on-error: true
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.sha || '' }}
          sparse-checkout: |
            scripts/ci/webviews_test_shards.py
            .gitmodules
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Download the run's durations
        id: durations-download
        if: ${{ steps.durations-checkout.outcome == 'success' }}
        continue-on-error: true
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: webviews-test-durations*
          path: ${{ runner.temp }}/durations

      - name: Merge the duration manifest
        id: durations-merge
        if: ${{ steps.durations-download.outcome == 'success' }}
        continue-on-error: true
        run: |
          shards=("$RUNNER_TEMP"/durations/webviews-test-durations-shard*/shard*.json)
          [ -e "${shards[0]}" ] || { echo "no shard recorded durations"; exit 1; }
          python3 scripts/ci/webviews_test_shards.py merge "$RUNNER_TEMP/webviews-durations/manifest.json" \
            "$RUNNER_TEMP/durations/webviews-test-durations/manifest.json" "${shards[@]}"

      - name: Save the duration manifest
        if: ${{ steps.durations-merge.outcome == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        continue-on-error: true
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/webviews-durations/manifest.json
          key: webviews-test-durations-${{ github.run_id }}-${{ github.run_attempt }}

  # The base's flake history: each feat-cmux-next push's webview verdicts (the shards'
  # results), appended to the newest uploaded history and uploaded again as this run's
  # webviews-test-history artifact. react-apps-base-check reads it (webviews_test_history.py
  # fetch, then flaky). Pushes only: a pull request uploads nothing. An artifact, not a cache:
  # the cache this job saved was never restored by the next push (2026-11-08: every push's
  # history held one run). actions: read lets the token list and download it.
  # Optional upkeep outside the required gate, like webviews-test-durations; two pushes
  # finishing together may drop one of their runs, which costs one data point.
  # A post-merge batch run on the base tip (inputs.sha is the run's own commit, every job) records as a push did;
  # a bisect probe (an older commit, or one job) never does.
  webviews-test-history:
    needs: [web-subarea-scope, react-apps-check-shard]
    if: ${{ !cancelled() && (github.event_name == 'push' || github.event.inputs.tick == 'true' || inputs.sha != '' && inputs.sha == github.sha && inputs.only == '') && inputs.web == 'true' && needs.web-subarea-scope.outputs.react_apps == 'true' && needs.react-apps-check-shard.result != 'skipped' }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || 'cmux-linux' }}
    timeout-minutes: 5
    # Its last step saves the history to R2 (cmux-ci-cache-next). Only next-cache-writer holds the write
    # credentials, and its deployment branches are feat-cmux-next only (tests/test_ci_pull_request_caches_are_read_only.py).
    environment: ${{ github.ref == 'refs/heads/feat-cmux-next' && 'next-cache-writer' || '' }}
    env:
      CI_CACHE_R2_BUCKET: cmux-ci-cache-next
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout the history helper
        id: history-checkout
        continue-on-error: true
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.sha || '' }}
          sparse-checkout: |
            scripts/ci/webviews_test_history.py
            scripts/ci/web_subareas.py
            .github/actions/cache-restore
            .github/actions/cache-save
            .gitmodules
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Download this push's results
        id: history-download
        if: ${{ steps.history-checkout.outcome == 'success' }}
        continue-on-error: true
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: webviews-test-history-shard*
          path: ${{ runner.temp }}/history-results

      # The cached copy (Save the history to the cache, below): the history when the artifact list answers no.
      - name: Restore the cached history
        id: history-cache
        if: ${{ steps.history-download.outcome == 'success' }}
        continue-on-error: true
        uses: ./.github/actions/cache-restore
        env:
          CI_CACHE_R2_PUBLIC_URL: https://ci-cache-next.cmux.com
        with:
          backend: r2
          path: .webviews-test-history-cache
          key: webviews-test-history-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: webviews-test-history-${{ github.ref_name }}-

      # The artifact first; when its list or download answers no (a 403 from the repository's spent token quota), wait
      # up to 25 min for its reset, then use the cached copy. When neither reads, a fresh history of this push alone goes
      # to the cache only (fresh=true): saving it as the artifact would replace the whole accumulated history with one
      # run. Failing here instead deadlocked: with the quota spent and no cache entry, no push saved a history, so every
      # pull request's scope read no base reds and its shards retried every base red alone (36-40 min of a 90 min shard).
      - name: Restore the history
        id: history-restore
        if: ${{ steps.history-download.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 27
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          history="$RUNNER_TEMP/webviews-test-history/history.json"
          cached=.webviews-test-history-cache/history.json
          if python3 scripts/ci/webviews_test_history.py fetch "$history" --repo "$GITHUB_REPOSITORY" --branch "$BRANCH" --need-read --wait-rate-limit 1500; then
            :
          # A cache seeded during an outage stays cache-only across pushes until the artifact reads again.
          elif [ -s "$cached" ] && fresh="$(jq -er 'select(.runs | type == "array") | (.cache_only == true | tostring)' "$cached")"; then
            cp "$cached" "$history"
            echo "fresh=$fresh" >> "$GITHUB_OUTPUT"
            echo "webview test history: the Actions cache's copy"
          else
            mkdir -p "$(dirname "$history")" && echo '{"runs":[]}' > "$history"
            echo "webview test history: neither the artifact nor the cache read; a fresh history, cache only"
            echo "fresh=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Add this push to the history
        id: history-record
        if: ${{ steps.history-restore.outcome == 'success' }}
        continue-on-error: true
        run: |
          shards=("$RUNNER_TEMP"/history-results/webviews-test-history-shard*/webviews-head-results.json)
          [ -e "${shards[0]}" ] || { echo "no shard recorded results"; exit 1; }
          history="$RUNNER_TEMP/webviews-test-history/history.json"
          # The shards' full checkouts computed the key (this checkout is sparse); they must agree.
          keys="$(cat "$RUNNER_TEMP"/history-results/webviews-test-history-shard*/webviews-inputs-key 2>/dev/null | sort -u)"
          [ -n "$keys" ] && [ "$(printf '%s\n' "$keys" | wc -l)" -eq 1 ] || { echo "no single inputs key: '$keys'"; exit 1; }
          python3 scripts/ci/webviews_test_history.py record "$history" "$history.new" \
            --sha "$GITHUB_SHA" --attempt "$GITHUB_RUN_ATTEMPT" --time "$(git log -1 --format=%ct)" \
            --inputs "$keys" "${shards[@]}"
          mv "$history.new" "$history"

      - name: Save the history
        if: ${{ steps.history-record.outcome == 'success' && steps.history-restore.outputs.fresh != 'true' }}
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: webviews-test-history
          overwrite: true
          path: ${{ runner.temp }}/webviews-test-history/history.json
          if-no-files-found: ignore
          retention-days: 3

      # The same history in the Actions cache, which a pull request's web-subarea-scope restores with no REST
      # request. Keyed by the history's own hash, not the run (tests/test_ci_no_run_scoped_cache_keys.py): one fixed
      # key was never replaced (2026-11-08), each push's history differs (it records that push), and the restore-keys
      # prefix takes the newest save. Base branches only: pull requests read only their base's prefix. Use the same
      # staging directory in each step: the R2 action archives a directory and restores its contents there, including
      # history.json.
      - name: Stage the history for the cache
        id: history-stage
        if: ${{ steps.history-record.outcome == 'success' }}
        continue-on-error: true
        env:
          CACHE_ONLY: ${{ steps.history-restore.outputs.fresh }}
        run: |
          history="$RUNNER_TEMP/webviews-test-history/history.json"
          cached=.webviews-test-history-cache/history.json
          mkdir -p "$(dirname "$cached")"
          if [ "$CACHE_ONLY" = true ]; then
            jq -c '.cache_only = true' "$history" > "$cached"
          else
            cp "$history" "$cached"
          fi

      - name: Save the history to the cache
        if: ${{ steps.history-stage.outcome == 'success' && (github.ref == 'refs/heads/feat-cmux-next' || github.ref == 'refs/heads/main') }}
        continue-on-error: true
        timeout-minutes: 2
        uses: ./.github/actions/cache-save
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CI_CACHE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CI_CACHE_R2_SECRET_ACCESS_KEY }}
          CI_CACHE_R2_ENDPOINT: ${{ format('https://{0}.r2.cloudflarestorage.com', secrets.CI_CACHE_R2_ACCOUNT_ID) }}
          CI_CACHE_R2_BUCKET: cmux-ci-cache-next
          CI_CACHE_R2_PUBLIC_URL: https://ci-cache-next.cmux.com
        with:
          backend: r2
          path: .webviews-test-history-cache
          key: webviews-test-history-${{ github.ref_name }}-${{ hashFiles('.webviews-test-history-cache/history.json') }}
          # Pull requests judge base reds by this entry: a save that wrote nothing fails, not warns.
          required: true

      # A base red is excused on every pull request, so nothing made it anyone's: react-apps-check was red on every
      # completed push run from 2026-11-11 16:59 UTC to 2026-11-13 and model-picker-scaling on 62 recorded pushes in
      # a row before anyone read the failures (cmuxterm-hq#10383). This names each file red on the last 10 pushes it
      # ran on, with the commits it went red between (one ::error a range, a table in the job summary), and turns
      # this push-only job red. Pull requests never run this job, so it holds none of them. After the save: the
      # history is kept whatever this says.
      - name: Name webview reds stuck on the base
        if: ${{ steps.history-record.outcome == 'success' }}
        run: |
          python3 scripts/ci/webviews_test_history.py stuck "$RUNNER_TEMP/webviews-test-history/history.json" \
            --repo "$GITHUB_REPOSITORY" --summary "$GITHUB_STEP_SUMMARY" --fail

  diff-sidecar-check:
    # Generated protocol checks and the sidecar tests only run for their owned inputs.
    needs: web-subarea-scope
    # A feat-cmux-next pull request runs this job's commands as the ci/steps.toml step `diff-sidecar-check`
    # (pr-pipeline.yml); the docs-only fallback keeps this job for its direct reusable-workflow call.
    if: ${{ (inputs.macos == 'true' || inputs.web == 'true') && needs.web-subarea-scope.outputs.diff_sidecar == 'true' && (inputs.only == '' || inputs.only == 'diff-sidecar-check') && (github.event_name != 'pull_request' || github.base_ref != 'feat-cmux-next' || github.workflow == 'docs-only fallback') }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || 'cmux-linux' }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.sha || '' }}
          persist-credentials: false

      - name: Install Rust
        run: ./scripts/install-rust-ci.sh

      - name: Restore pinned Bun 1.4.4 from the CI cache bucket
        shell: bash
        continue-on-error: true
        run: bash "$GITHUB_WORKSPACE/scripts/ci/toolchain-r2.sh" restore bun 1.4.4 || true

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
          no-cache: ${{ !startsWith(github.workspace, '/home/runner/work/') || !(github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && github.event_name != 'merge_group' && contains(fromJSON('["refs/heads/main","refs/heads/feat-cmux-next","refs/heads/nightly-next"]'), github.ref)) }}

      # Why: docs/ci/cmux-next-workflow-notes/2026-11-26-bun-cache-warm.md (detector: tests/test_ci_bun_cache_warm.py).
      - name: Is this runner's own Bun package cache warm
        id: bun-warm
        timeout-minutes: 1
        shell: bash
        run: |
          d="${BUN_INSTALL_CACHE_DIR:-$HOME/.bun/install/cache}"
          if [[ "${RESTORE_ON_WARM:-}" != 1 && -n "$(find "$d" -mindepth 1 -maxdepth 1 -print -quit 2>/dev/null)" ]]; then
            echo "warm=true" >> "$GITHUB_OUTPUT"
            echo "$d is already filled from this runner's earlier jobs; the cache archive is not unpacked over it"
          fi
        env:
          RESTORE_ON_WARM: ${{ vars.CI_BUN_CACHE_RESTORE_WARM }}

      - name: Cache Bun package cache
        timeout-minutes: 3
        continue-on-error: true
        if: ${{ github.ref == 'refs/heads/feat-cmux-next' }}
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.bun/install/cache
          key: bun-web-shared-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('web/bun.lock', 'webviews/bun.lock', 'cmux-tui/frontends/web/bun.lock', 'scripts/react-doctor/bun.lock', 'agent-chat/bun.lock', 'backend/bun.lock') }}
          restore-keys: bun-web-shared-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache Bun package cache (restore only off feat-cmux-next)
        timeout-minutes: 3
        continue-on-error: true
        if: ${{ (github.ref != 'refs/heads/feat-cmux-next') && steps.bun-warm.outputs.warm != 'true' }}
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.bun/install/cache
          key: bun-web-shared-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('web/bun.lock', 'webviews/bun.lock', 'cmux-tui/frontends/web/bun.lock', 'scripts/react-doctor/bun.lock', 'agent-chat/bun.lock', 'backend/bun.lock') }}
          restore-keys: bun-web-shared-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Install webview dependencies
        working-directory: webviews
        run: bun install --frozen-lockfile

      # Format and clippy are gates: a miss is recorded and fails the job in the
      # last step, so it no longer hides the cargo tests and checks below.
      - name: Lint Rust sidecar (fmt, clippy)
        id: sidecar-lint
        continue-on-error: true
        run: |
          ./scripts/run-diff-sidecar-cargo.sh fmt --manifest-path Native/DiffSidecar/Cargo.toml --all --check
          ./scripts/run-diff-sidecar-cargo.sh clippy --manifest-path Native/DiffSidecar/Cargo.toml --all-targets --locked --no-default-features -- -D warnings
          ./scripts/run-diff-sidecar-cargo.sh clippy --manifest-path Native/DiffSidecar/Cargo.toml --all-targets --all-features --locked -- -D warnings

      - name: Test Rust sidecar
        run: |
          ./scripts/run-diff-sidecar-cargo.sh test --manifest-path Native/DiffSidecar/Cargo.toml --all-targets --locked --no-default-features
          ./scripts/run-diff-sidecar-cargo.sh test --manifest-path Native/DiffSidecar/Cargo.toml --all-targets --all-features --locked

      - name: Verify generated protocol types
        run: ./scripts/generate-diff-sidecar-types.sh --check

      # The diff-viewer performance budgets (scripts/benchmark-diff-viewer.sh) run in the perf cron
      # (cmux-next-perf-budgets.yml), not here: no perf check on the push or pull request path (Lawrence
      # 2026-10-23).

      # fmt and clippy are style for feat-cmux-next (Leo 2026-10-19): a warning there. The
      # sidecar tests above still compile and fail on their own.
      - name: Fail on the Rust sidecar lint
        if: ${{ !cancelled() && steps.sidecar-lint.outcome == 'failure' }}
        env:
          CMUX_NEXT_STYLE_GUARDS: ${{ env.CMUX_NEXT_STYLE_GUARDS_LEVEL }}
        run: |
          if [ "$CMUX_NEXT_STYLE_GUARDS" = warn ]; then
            echo "::warning::Rust sidecar fmt or clippy found issues (warn-only); see the step 'Lint Rust sidecar (fmt, clippy)'."
            exit 0
          fi
          echo "::error::Rust sidecar fmt or clippy failed; see the step 'Lint Rust sidecar (fmt, clippy)'."
          exit 1

  web-db-migrations:
    needs: web-subarea-scope
    if: ${{ inputs.web == 'true' && needs.web-subarea-scope.outputs.db == 'true' && (inputs.only == '' || inputs.only == 'web-db-migrations') }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || 'cmux-linux' }}
    # Matches web-production-build and diff-sidecar-check, the other 15s here.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_DB: cmux_test
          POSTGRES_PASSWORD: cmux
          POSTGRES_USER: cmux
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cmux -d cmux_test"
          --health-interval 1s
          --health-timeout 5s
          --health-retries 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.sha || '' }}

      - name: Restore pinned Bun 1.4.4 from the CI cache bucket
        shell: bash
        continue-on-error: true
        run: bash "$GITHUB_WORKSPACE/scripts/ci/toolchain-r2.sh" restore bun 1.4.4 || true

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
          no-cache: ${{ !startsWith(github.workspace, '/home/runner/work/') || !(github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && github.event_name != 'merge_group' && contains(fromJSON('["refs/heads/main","refs/heads/feat-cmux-next","refs/heads/nightly-next"]'), github.ref)) }}

      # Why: docs/ci/cmux-next-workflow-notes/2026-11-26-bun-cache-warm.md (detector: tests/test_ci_bun_cache_warm.py).
      - name: Is this runner's own Bun package cache warm
        id: bun-warm
        timeout-minutes: 1
        shell: bash
        run: |
          d="${BUN_INSTALL_CACHE_DIR:-$HOME/.bun/install/cache}"
          if [[ "${RESTORE_ON_WARM:-}" != 1 && -n "$(find "$d" -mindepth 1 -maxdepth 1 -print -quit 2>/dev/null)" ]]; then
            echo "warm=true" >> "$GITHUB_OUTPUT"
            echo "$d is already filled from this runner's earlier jobs; the cache archive is not unpacked over it"
          fi
        env:
          RESTORE_ON_WARM: ${{ vars.CI_BUN_CACHE_RESTORE_WARM }}

      - name: Cache Bun package cache
        timeout-minutes: 3
        continue-on-error: true
        if: ${{ github.ref == 'refs/heads/feat-cmux-next' }}
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.bun/install/cache
          key: bun-web-shared-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('web/bun.lock', 'webviews/bun.lock', 'cmux-tui/frontends/web/bun.lock', 'scripts/react-doctor/bun.lock', 'agent-chat/bun.lock', 'backend/bun.lock') }}
          restore-keys: bun-web-shared-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache Bun package cache (restore only off feat-cmux-next)
        timeout-minutes: 3
        continue-on-error: true
        if: ${{ (github.ref != 'refs/heads/feat-cmux-next') && steps.bun-warm.outputs.warm != 'true' }}
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.bun/install/cache
          key: bun-web-shared-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('web/bun.lock', 'webviews/bun.lock', 'cmux-tui/frontends/web/bun.lock', 'scripts/react-doctor/bun.lock', 'agent-chat/bun.lock', 'backend/bun.lock') }}
          restore-keys: bun-web-shared-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply migrations
        env:
          DATABASE_URL: postgres://cmux:cmux@localhost:5432/cmux_test
          DIRECT_DATABASE_URL: postgres://cmux:cmux@localhost:5432/cmux_test
        run: bun scripts/db-migrate.mjs

      - name: Re-apply migrations
        env:
          DATABASE_URL: postgres://cmux:cmux@localhost:5432/cmux_test
          DIRECT_DATABASE_URL: postgres://cmux:cmux@localhost:5432/cmux_test
        run: bun scripts/db-migrate.mjs

      - name: Database behavior tests
        env:
          CMUX_DB_TEST: "1"
          DATABASE_URL: postgres://cmux:cmux@localhost:5432/cmux_test
          DIRECT_DATABASE_URL: postgres://cmux:cmux@localhost:5432/cmux_test
        run: bun run test:db:behavior

  web-status:
    name: Web status
    needs:
      - web-subarea-scope
      - web-typecheck
      - webviews-typecheck
      - web-production-build
      - web-tests
      - web-instant-navigation
      - react-apps-check
      - agent-pane-real-acpmux
      - diff-sidecar-check
      - web-db-migrations
    # Keep the web verdict after a failed dependency, but skip it after run
    # cancellation so a superseded push does not start another runner.
    if: ${{ !cancelled() && inputs.only == '' }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || 'cmux-linux' }}
    timeout-minutes: 5
    steps:
      - name: Check routed web jobs
        env:
          WEB_INPUTS: ${{ toJSON(inputs) }}
          WEB_NEEDS: ${{ toJSON(needs) }}
          WEB_EVENT: ${{ github.event_name }}
          WEB_BASE_REF: ${{ github.base_ref }}
          WEB_WORKFLOW: ${{ github.workflow }}
          # 'true' unless this is a feat-cmux-next pull request head not handed to land (webviews-typecheck's land tier).
          WEB_LAND_TIER: ${{ (github.event_name != 'pull_request' || (contains(github.event.pull_request.labels.*.name, 'full-ci') && (github.event.pull_request.base.ref != 'feat-cmux-next' || (github.event.action == 'labeled' && github.event.label.name == 'full-ci') || (vars.CI_FULL_CI_ONE_SHOT || '1') == '0')) || (github.event.pull_request.draft == true && (vars.CI_DRAFT_CHEAP_TIER || '1') == '0') || (github.event.pull_request.draft != true && ((contains(github.event.pull_request.labels.*.name, 'ready-to-land') && vars.CI_LAND_FULL_PER_PR == '1') || github.event.pull_request.base.ref != 'feat-cmux-next' || github.event.pull_request.head.repo.full_name != github.repository || (vars.CI_LAND_TIER || '1') == '0'))) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          def exit_with_verdict(results, what, may_skip=()):
              """scripts/ci/needs_verdict.py PYTHON_RULE, copied verbatim (tests/test_needs_verdict.py)."""
              def word(r):
                  return (r or "").replace(":", " ").split(" ", 1)[0]
              bad = {n: r for n, r in results.items() if word(r) != "success" and not (r == "skipped" and n in may_skip)}
              if not bad:
                  return
              failed = {n: r for n, r in bad.items() if word(r) in ("failure", "invalid")}
              for n, r in bad.items():
                  print(f"{n}: {r or 'none'}", file=sys.stderr)
              if failed:
                  print(f"::error::summary red: {what}: " + "; ".join(f"{n}: {r}" for n, r in failed.items()))
                  sys.exit(1)
              named = ", ".join(f"{n} {r or 'none'}" for n, r in bad.items())
              print(f"::error::no verdict: {what}: {named}; nothing it summarizes was judged: re-run the run")
              sys.exit(3)


          inputs = json.loads(os.environ["WEB_INPUTS"])
          needs = json.loads(os.environ["WEB_NEEDS"])
          # One call with every result (scripts/ci/needs_verdict.py): a broken route or subarea is a red, a job that judged
          # nothing is no verdict, and a failure anywhere wins.
          results = {}
          for route in ("web", "macos", "agent_session_web"):
              if inputs.get(route) not in {"true", "false"}:
                  results[route] = f"invalid route {route}={inputs.get(route)!r}"

          scope = needs["web-subarea-scope"]
          scope_required = inputs["web"] == "true" or inputs["macos"] == "true"
          subarea_names = ("db", "diff_sidecar", "instant", "production_build", "react_apps", "agent_pane", "typecheck", "unit_tests")
          if scope_required and scope.get("outputs"):
              subareas = scope["outputs"]
              for name in subarea_names:
                  if subareas.get(name) not in {"true", "false"}:
                      results[f"subarea {name}"] = f"invalid web subarea {name}={subareas.get(name)!r}"
          elif scope_required:
              # A scope that wrote no outputs names no job as required: each may skip, and its failure is still a red.
              # Succeeding without them is a red of its own; any other result says why in the call below.
              subareas = {name: "unknown" for name in subarea_names}
              results["subareas"] = {"success": "invalid: web-subarea-scope succeeded with no outputs"}.get(
                  scope["result"], "success")
          else:
              subareas = {
                  "db": "false",
                  "diff_sidecar": "false",
                  "instant": "false",
                  "production_build": "false",
                  "react_apps": "false",
                  "agent_pane": "false",
                  "typecheck": "false",
                  "unit_tests": "false",
              }

          # .get: a scope with partial outputs leaves some names out (each is an invalid entry above), and the call below
          # still has to name every failed child.
          required = {
              "web-subarea-scope": scope_required,
              "web-typecheck": inputs["web"] == "true" and subareas.get("typecheck") == "true",
              "web-production-build": inputs["web"] == "true" and subareas.get("production_build") == "true",
              "web-tests": inputs["web"] == "true" and subareas.get("unit_tests") == "true",
              "web-instant-navigation": inputs["web"] == "true" and subareas.get("instant") == "true",
              "react-apps-check": inputs["web"] == "true" and subareas.get("react_apps") == "true",
              "webviews-typecheck": inputs["web"] == "true" and subareas.get("react_apps") == "true",
              "agent-pane-real-acpmux": inputs["web"] == "true" and subareas.get("agent_pane") == "true",
              "diff-sidecar-check": scope_required and subareas.get("diff_sidecar") == "true",
              "web-db-migrations": inputs["web"] == "true" and subareas.get("db") == "true",
          }
          results.update({job: needs[job]["result"] for job in sorted(required)})
          may_skip = {job for job, is_required in required.items() if not is_required}
          # A feat-cmux-next pull request runs these as ci/steps.toml steps (pr-pipeline.yml): the jobs skip.
          if os.environ.get("WEB_EVENT") == "pull_request" and os.environ.get("WEB_BASE_REF") == "feat-cmux-next":
              may_skip.update({"web-typecheck", "web-tests", "web-production-build", "web-instant-navigation", "agent-pane-real-acpmux"})
              # The docs-only fallback still runs diff-sidecar-check as its own job.
              if os.environ.get("WEB_WORKFLOW") != "docs-only fallback":
                  may_skip.add("diff-sidecar-check")
          # A cheap head (land tier, #54886) skips webviews-typecheck; the `ready-to-land` label runs it at the same head.
          if os.environ.get("WEB_LAND_TIER") == "false":
              may_skip.add("webviews-typecheck")
          exit_with_verdict(results, "Web status", may_skip)
          for job, is_required in sorted(required.items()):
              print(f"{job}: required={str(is_required).lower()} result={needs[job]['result']}")
          PY
