name: CI web

on:
  workflow_call:
    inputs:
      web:
        required: true
        type: string
      macos:
        required: true
        type: string
      agent_session_web:
        required: true
        type: string

permissions:
  contents: read

jobs:
  web-typecheck:
    if: ${{ inputs.web == 'true' }}
    runs-on: ${{ vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate managed relay catalog
        run: bun tools/generate-managed-iroh-relay-catalog.ts --check

      - name: Typecheck
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/web-typecheck.log"
          set +e
          bun run typecheck 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          set -e

          # The native TypeScript preview compiler can abort on a healthy
          # runner. Retry that transient compiler crash once, while keeping
          # real type errors as immediate failures.
          if [ "$status" -ne 0 ] \
            && grep -Fq 'Aborted (core dumped)' "$log"; then
            echo "::warning::native tsgo aborted during web typecheck; retrying once"
            bun run typecheck
            exit $?
          fi

          exit "$status"

      - name: Web tests
        run: bun run test

      - name: Install browser for instant navigation tests
        run: bunx playwright install --with-deps chromium

      - name: Instant navigation tests
        env:
          # The preceding Typecheck step owns the repository-wide tsgo gate;
          # avoid launching a second tsgo process inside Playwright's server
          # command on constrained Linux runners.
          CMUX_INSTANT_SKIP_TYPECHECK: "1"
        run: bun run test:instant

  # Checks for in-app React webviews (currently the diff viewer; more cmux React
  # surfaces will live alongside it).

  react-apps-check:
    if: ${{ inputs.web == 'true' }}
    runs-on: ${{ vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Verify generated webviews assets
        run: ./scripts/build-webviews-app.sh --check

      - name: Verify React Compiler for webviews
        run: ./scripts/check-webviews-react-compiler.mjs

      - name: Typecheck webviews
        working-directory: webviews
        run: bun run typecheck

      - name: Test webviews
        working-directory: webviews
        run: bun run test

      - name: Oxlint webviews
        working-directory: webviews
        run: bun run lint:ci

      - name: React Doctor
        working-directory: webviews
        run: bun run react-doctor:ci

  diff-sidecar-check:
    # Generated protocol and streaming benchmarks also cover webview-only diffs.
    if: ${{ inputs.macos == 'true' || inputs.web == 'true' }}
    runs-on: ${{ vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust
        run: ./scripts/install-rust-ci.sh

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install webview dependencies
        working-directory: webviews
        run: bun install --frozen-lockfile

      - name: Check Rust sidecar
        run: |
          ./scripts/run-diff-sidecar-cargo.sh fmt --manifest-path Native/DiffSidecar/Cargo.toml --all --check
          ./scripts/run-diff-sidecar-cargo.sh clippy --manifest-path Native/DiffSidecar/Cargo.toml --all-targets --locked --no-default-features -- -D warnings
          ./scripts/run-diff-sidecar-cargo.sh clippy --manifest-path Native/DiffSidecar/Cargo.toml --all-targets --all-features --locked -- -D warnings
          ./scripts/run-diff-sidecar-cargo.sh test --manifest-path Native/DiffSidecar/Cargo.toml --all-targets --locked --no-default-features
          ./scripts/run-diff-sidecar-cargo.sh test --manifest-path Native/DiffSidecar/Cargo.toml --all-targets --all-features --locked

      - name: Verify generated protocol types
        run: ./scripts/generate-diff-sidecar-types.sh --check

      - name: Enforce diff-viewer performance budgets
        env:
          CMUX_DIFF_WEB_BENCH_ITERATIONS: "10"
        run: ./scripts/benchmark-diff-viewer.sh

  web-db-migrations:
    if: ${{ inputs.web == 'true' }}
    runs-on: ${{ vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    defaults:
      run:
        working-directory: web
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cmux_test
          POSTGRES_PASSWORD: cmux
          POSTGRES_USER: cmux
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cmux -d cmux_test"
          --health-interval 1s
          --health-timeout 5s
          --health-retries 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply migrations
        env:
          DATABASE_URL: postgres://cmux:cmux@localhost:5432/cmux_test
          DIRECT_DATABASE_URL: postgres://cmux:cmux@localhost:5432/cmux_test
        run: bunx drizzle-kit migrate --config drizzle.config.ts

      - name: Re-apply migrations
        env:
          DATABASE_URL: postgres://cmux:cmux@localhost:5432/cmux_test
          DIRECT_DATABASE_URL: postgres://cmux:cmux@localhost:5432/cmux_test
        run: bunx drizzle-kit migrate --config drizzle.config.ts

      - name: Database behavior tests
        env:
          CMUX_DB_TEST: "1"
          DATABASE_URL: postgres://cmux:cmux@localhost:5432/cmux_test
          DIRECT_DATABASE_URL: postgres://cmux:cmux@localhost:5432/cmux_test
        run: bun run test:db:behavior

  agent-session-web-resources:
    if: ${{ inputs.agent_session_web == 'true' }}
    runs-on: ${{ vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Build and test Agent Session web resources
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run agent-session-web:build
          bun run agent-session-web:test
          git diff --exit-code -- Resources/agent-session-react Resources/agent-session-solid

  web-status:
    name: Web status
    needs:
      - web-typecheck
      - react-apps-check
      - diff-sidecar-check
      - web-db-migrations
      - agent-session-web-resources
    if: ${{ always() }}
    runs-on: ${{ vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 5
    steps:
      - name: Check routed web jobs
        env:
          WEB_INPUTS: ${{ toJSON(inputs) }}
          WEB_NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          inputs = json.loads(os.environ["WEB_INPUTS"])
          needs = json.loads(os.environ["WEB_NEEDS"])
          for route in ("web", "macos", "agent_session_web"):
              if inputs.get(route) not in {"true", "false"}:
                  print(f"invalid route {route}={inputs.get(route)!r}", file=sys.stderr)
                  sys.exit(1)

          required = {
              "web-typecheck": inputs["web"] == "true",
              "react-apps-check": inputs["web"] == "true",
              "diff-sidecar-check": inputs["macos"] == "true" or inputs["web"] == "true",
              "web-db-migrations": inputs["web"] == "true",
              "agent-session-web-resources": inputs["agent_session_web"] == "true",
          }
          bad = {}
          for job, is_required in sorted(required.items()):
              result = needs[job]["result"]
              if is_required:
                  if result != "success":
                      bad[job] = result
              elif result not in {"success", "skipped"}:
                  bad[job] = result
          if bad:
              for job, result in bad.items():
                  print(f"{job}: {result}", file=sys.stderr)
              sys.exit(1)
          for job, is_required in sorted(required.items()):
              print(f"{job}: required={str(is_required).lower()} result={needs[job]['result']}")
          PY
