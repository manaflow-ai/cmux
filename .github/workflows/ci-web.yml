            bun run typecheck
            exit $?
          fi

          exit "$status"

      # A type error fixit-compile could not fix wrote its record (scripts/ci/oops/fixit_handoff.py signal).
      - name: Hand a type error with no machine fix to fixit-handoff
        id: fixit-nofix
        if: ${{ failure() && steps.typecheck.outcome == 'failure' }}
        run: python3 -I ../scripts/ci/oops/fixit_handoff.py signal >> "$GITHUB_OUTPUT"

      # A type check whose every error had one safe language-service fix, and passed with them: the patch, for the
      # cmuxterm-hq fixit-compile reconciler to push onto a lane/* branch as a fixup commit (ci-oops 0a).
      - name: Upload the fixit-compile patch
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fixit-compile-${{ github.job }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fixit-compile
          if-no-files-found: ignore
          retention-days: 3

      - name: Publish ci_oops ledger
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-oops-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci_oops.jsonl

  # The webviews type check, apart from the react-apps-check shards that build and test the same tree. Vite and
  # bun only transpile, so the bundles, the gallery and the tests run on a tree with a type error, and this job
  # reports the error as its own red check (Web status still requires it). Until 2026-11-19 it was a step of
  # react-apps-check (1), whose verdict a type error turned red next to the tests' (Leo, 2026-11-19: "the CI
  # doesn't necessarily have to fail and like give up. It can just be like, okay, you got to fix this afterwards").
  # On a feat-cmux-next pull request only errors the merge parent lacks fail (fast_gate_webviews_checks.py).
  webviews-typecheck:
    needs: web-subarea-scope
    # Land tier (#54886): a feat-cmux-next pull request head not handed to land skips it; the `ready-to-land`
    # label re-runs it at the same head. Leo, 2026-11-23: "de facto, im asking for 99% fewer minutes of ci time, period."
    if: ${{ (github.event_name != 'pull_request' || (contains(github.event.pull_request.labels.*.name, 'full-ci') && (github.event.pull_request.base.ref != 'feat-cmux-next' || (github.event.action == 'labeled' && github.event.label.name == 'full-ci') || (vars.CI_FULL_CI_ONE_SHOT || '1') == '0')) || (github.event.pull_request.draft == true && (vars.CI_DRAFT_CHEAP_TIER || '1') == '0') || (github.event.pull_request.draft != true && ((contains(github.event.pull_request.labels.*.name, 'ready-to-land') && vars.CI_LAND_FULL_PER_PR == '1') || github.event.pull_request.base.ref != 'feat-cmux-next' || github.event.pull_request.head.repo.full_name != github.repository || (vars.CI_LAND_TIER || '1') == '0'))) && inputs.web == 'true' && needs.web-subarea-scope.outputs.react_apps == 'true' }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-16vcpu-ubuntu-2404' || 'cmux-linux' }}
    # The merge's type check, and on a red the base's (a worktree of the merge parent).
    timeout-minutes: 15
    outputs:
      fixit_nofix: ${{ steps.fixit-nofix.outputs.nofix }}
    defaults:
      run:
        working-directory: webviews
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # The merge commit with its parents: a red is compared with the merge parent's.
          fetch-depth: ${{ github.event_name == 'pull_request' && '2' || '1' }}
          persist-credentials: false

      - name: Restore pinned Bun 1.4.4 from the CI cache bucket
        shell: bash
        continue-on-error: true
        run: bash "$GITHUB_WORKSPACE/scripts/ci/toolchain-r2.sh" restore bun 1.4.4 || true

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          no-cache: ${{ !startsWith(github.workspace, '/home/runner/work/') || !(github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && github.event_name != 'merge_group' && contains(fromJSON('["refs/heads/main","refs/heads/feat-cmux-next","refs/heads/nightly-next"]'), github.ref)) }}
          bun-version: "1.4.4"

      - name: Use the VM runner guest Bun cache
        id: fsr-bun-cache
        timeout-minutes: 2
        if: ${{ startsWith(runner.name, 'fsr-') }}
        run: bash scripts/ci/fsr-bun-cache.sh check bun-webviews webviews/bun.lock

      # Why: docs/ci/cmux-next-workflow-notes/2026-11-26-bun-cache-warm.md (detector: tests/test_ci_bun_cache_warm.py).
      - name: Is this runner's own Bun package cache warm
        id: bun-warm
        timeout-minutes: 1
        shell: bash
        run: |
          d="${BUN_INSTALL_CACHE_DIR:-$HOME/.bun/install/cache}"
          if [[ "${RESTORE_ON_WARM:-}" != 1 && -n "$(find "$d" -mindepth 1 -maxdepth 1 -print -quit 2>/dev/null)" ]]; then
            echo "warm=true" >> "$GITHUB_OUTPUT"
            echo "$d is already filled from this runner's earlier jobs; the cache archive is not unpacked over it"
          fi
        env:
          RESTORE_ON_WARM: ${{ vars.CI_BUN_CACHE_RESTORE_WARM }}

