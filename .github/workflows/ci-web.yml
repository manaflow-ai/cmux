        timeout-minutes: 3
        continue-on-error: true
        if: ${{ github.ref == 'refs/heads/feat-cmux-next' }}
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.bun/install/cache
          key: bun-web-shared-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('web/bun.lock', 'webviews/bun.lock', 'cmux-tui/frontends/web/bun.lock', 'scripts/react-doctor/bun.lock', 'agent-chat/bun.lock', 'backend/bun.lock') }}
          restore-keys: bun-web-shared-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache Bun package cache (restore only off feat-cmux-next)
        timeout-minutes: 3
        continue-on-error: true
        if: ${{ (github.ref != 'refs/heads/feat-cmux-next') && steps.bun-warm.outputs.warm != 'true' }}
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.bun/install/cache
          key: bun-web-shared-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('web/bun.lock', 'webviews/bun.lock', 'cmux-tui/frontends/web/bun.lock', 'scripts/react-doctor/bun.lock', 'agent-chat/bun.lock', 'backend/bun.lock') }}
          restore-keys: bun-web-shared-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate managed relay catalog
        run: bun tools/generate-managed-iroh-relay-catalog.ts --check

      # Next's route types (.next/types, which tsconfig.json includes) exist only after a build or typegen. The
      # production build below skips type errors (CMUX_CI_TYPECHECK_SEPARATE), so this job generates them: a route
      # type error (a page's props, a typed link) stays this check's red.
      # typegen loads next.config.ts, which imports app/env.ts; route types need no secrets, so its check is off here.
      - name: Generate Next route types
        env:
          SKIP_ENV_VALIDATION: "1"
        run: bun x next typegen

      - name: Typecheck
        id: typecheck
        env:
          FIXIT_COMPILE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/web-typecheck.log"
          set +e
          # fixit-compile (ci-oops 0a): on type errors that each have one safe fix, it writes the fixup patch.
          # The wrapper retries one classified infrastructure failure in this job and appends its verdict to the
          # published ci_oops ledger. A real type error keeps the original exit status.
          python3 -I ../scripts/ci/oops/retry.py --job web-typecheck -- \
            python3 -I ../scripts/ci/oops/fixit_compile.py run --kind tsc -- bun run typecheck 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          set -e

          # The native TypeScript preview compiler can abort on a healthy
          # runner. Retry that transient compiler crash once, while keeping
          # real type errors as immediate failures.
          if [ "$status" -ne 0 ] \
            && grep -Fq 'Aborted (core dumped)' "$log"; then
