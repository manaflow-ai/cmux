name: classic nightly pr build

# The classic NIGHTLY's Release compile and its cmux-tui client build, run on a
# pull request into main, so a change that breaks only those fails at its pull
# request instead of in a NIGHTLY that does not publish. Advisory: every job
# name ends in "(advisory)" and no check here is required.
# CI_CLASSIC_NIGHTLY_PR_BUILD=0 turns it off.
on:
  pull_request:
    branches: [main]
    paths:
      - "Sources/**"
      - "CLI/**"
      - "TunnelExtension/**"
      - "Packages/**"
      - "Native/**"
      - "Resources/**"
      - "Assets.xcassets/**"
      - "AppIcon.icon/**"
      - "vendor/**"
      - "ghostty"
      - ".gitmodules"
      - ".xcode-version"
      - "cmux.xcodeproj/**"
      - "cmux-Bridging-Header.h"
      - "ghostty.h"
      - "*.entitlements"
      - "cmux-tui/**"
      - ".cargo/**"
      - "scripts/download-prebuilt-ghosttykit.sh"
      - "scripts/ghosttykit-checksums.txt"
      - "scripts/select-ci-xcode.sh"
      - "scripts/install-rust-ci.sh"
      - "scripts/ghostty-zig-version.sh"
      - "scripts/ci/xcode-pins.txt"
      - "scripts/ci/init-submodule.sh"
      - "scripts/ci/detect_ci_change_areas.py"
      - ".github/actions/setup-cmux-tui-rust/**"
      - ".github/actions/runner-cargo-home/**"
      - ".github/actions/ghostty-zig-packages/**"
      - ".github/actions/cache-restore/**"
      - ".github/actions/cache-save/**"
      - "scripts/ci/fetch-ghostty-zig-packages.sh"
      - "scripts/ci/cache_restore_receipt.py"
      - "scripts/ci/r2-cache.sh"
      - "scripts/ci/run-xcodebuild-with-diagnostics.sh"
      - "scripts/ci/classic-nightly-release-compile.sh"
      - "scripts/ci/classic_nightly_pr_build.py"
      - ".github/workflows/classic-pr-build.yml"

permissions: {}

concurrency:
  group: classic-nightly-pr-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  route:
    name: classic nightly pr build route (advisory)
    if: ${{ github.repository_owner == 'manaflow-ai' && (vars.CI_CLASSIC_NIGHTLY_PR_BUILD || '1') != '0' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || vars.CI_OVERFLOW_LINUX || 'cmux-linux' }}
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      swift: ${{ steps.route.outputs.swift }}
      helpers: ${{ steps.route.outputs.helpers }}
      keys: ${{ steps.keys.outputs.keys }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 2
          filter: blob:none
          submodules: false
      # The checkout is the merge commit: its first parent is the base.
      - name: Route the change
        id: route
        run: python3 scripts/ci/classic_nightly_pr_build.py route --base 'HEAD^1' --head HEAD | tee -a "$GITHUB_OUTPUT"
      # The fleet job builds the head, so the keys are the head's.
      - name: Key the inputs at the head
        id: keys
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git -c protocol.version=2 fetch --no-tags --depth=1 --filter=blob:none origin "$HEAD_SHA"
          python3 scripts/ci/classic_nightly_pr_build.py keys --rev "$HEAD_SHA" | tee -a "$GITHUB_OUTPUT"

  # The gateway runner's job-started hook admits only thin cmux-ci clients,
  # by workflow and job id: an id ending in -fleet is that contract (glaeda
  # GATEWAY_FLEET_SUFFIX). Under the id `swift` every run was refused there.
  app-compile-fleet:
    name: classic nightly app compile ${{ matrix.arch }} fleet job (advisory)
    needs: [route]
    if: ${{ needs.route.outputs.swift == 'true' }}
    # Use the gateway when configured, then the overflow pool, then the owned
    # Linux pool. The job remains a thin cmux-ci client on every route.
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || vars.CI_EVAL_STEP_GATEWAY || vars.CI_OVERFLOW_LINUX || 'cmux-linux' }}
    timeout-minutes: 140  # the client waits up to 3600 s queued plus 3600 s running
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        # The archs nightly.yml's "Build nightly app (Release)" step ships (arm64 only
        # since 11-26; Intel ships from the stable release).
        arch: [arm64]
    env:
      KEY: ${{ fromJSON(needs.route.outputs.keys)[matrix.arch] }}
    steps:
      - name: Look up a pass with the same inputs
        id: cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/classic-nightly-pr-build-pass
          key: ${{ env.KEY }}
          lookup-only: true
      - name: Compile the app the NIGHTLY's way (fleet job)
        if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        id: compile
        env:
          SHA: ${{ github.event.pull_request.head.sha }}
          ARCH: ${{ matrix.arch }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail
          client="${CMUX_CI_CLIENT:-$HOME/.local/bin/cmux-ci}"
          if ! [[ -x "$client" ]]; then
            echo "::warning title=classic nightly app compile::cmux-ci is not installed on runner $RUNNER_NAME; the NIGHTLY's compile did not run"
            exit 0
          fi
          status=0
          "$client" run --class light --script scripts/ci/classic-nightly-release-compile.sh --ref "$SHA" \
            --repo "$GITHUB_REPOSITORY" --arg=--archs --arg="$ARCH" --key "$KEY" \
            --reason "classic nightly pr build #$PR $ARCH" --timeout 3600 --queue-timeout 3600 || status=$?
          case "$status" in
            0) echo "passed=true" >> "$GITHUB_OUTPUT" ;;
            69|75|124) echo "::warning title=classic nightly app compile::the fleet job gave no verdict (exit $status: 69 controller unavailable, 75 or 124 did not finish); not judged" ;;
            *) echo "::error title=classic nightly app compile::fleet verification failed for $ARCH (cmux-ci exit $status); see the client output for the admission, setup or build error"
               exit "$status" ;;
          esac
      - name: Record the pass
        if: ${{ steps.compile.outputs.passed == 'true' }}
        run: mkdir -p "$RUNNER_TEMP/classic-nightly-pr-build-pass" && echo "$KEY" > "$RUNNER_TEMP/classic-nightly-pr-build-pass/key"
      - name: Save the pass
        if: ${{ steps.compile.outputs.passed == 'true' }}
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/classic-nightly-pr-build-pass
          key: ${{ env.KEY }}

  helpers:
    name: classic nightly cmux-tui client (advisory)
    needs: [route]
    if: ${{ needs.route.outputs.helpers == 'true' }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || vars.CI_OVERFLOW_LINUX || 'cmux-linux' }}
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      KEY: ${{ fromJSON(needs.route.outputs.keys).helpers }}
    steps:
      - name: Look up a pass with the same inputs
        id: cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/classic-nightly-pr-build-pass
          key: ${{ env.KEY }}
          lookup-only: true
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
          submodules: false
      - name: Init ghostty submodule
        if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        run: bash scripts/ci/init-submodule.sh ghostty
      - name: Install Linux build dependencies
        if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev pkg-config
      - name: Resolve Ghostty Zig version
        if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        id: zig
        run: echo "version=$(bash ./scripts/ghostty-zig-version.sh)" >> "$GITHUB_OUTPUT"
      - name: Install zig
        if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        uses: mlugg/setup-zig@8d6198c65fb0feaa111df26e6b467fea8345e46f # v2.0.5
        with:
          use-cache: false
          version: ${{ steps.zig.outputs.version }}
      - name: Fetch the Ghostty Zig packages (cached, deadlined, retried)
        if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        uses: ./.github/actions/ghostty-zig-packages
        with:
          source: ghostty
      - name: Set up pinned Rust
        if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        uses: ./.github/actions/setup-cmux-tui-rust
      # The NIGHTLY runs `cargo build -p cmux-tui --bin cmux-tui --release --locked`
      # for aarch64-apple-darwin; a check of the same package, binary and profile
      # catches the compile errors without linking a Mac binary.
      - name: Check the client the NIGHTLY bundles
        if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        working-directory: cmux-tui
        run: |
          unset CMUX_GHOSTTY_SRC
          CMUX_TUI_BUILD_COMMIT="$(git -C .. rev-parse HEAD)"
          CMUX_TUI_GHOSTTY_COMMIT="$(git -C ../ghostty rev-parse HEAD)"
          export CMUX_TUI_BUILD_COMMIT CMUX_TUI_GHOSTTY_COMMIT
          cargo check -p cmux-tui --bin cmux-tui --release --locked
      - name: Record the pass
        if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        run: mkdir -p "$RUNNER_TEMP/classic-nightly-pr-build-pass" && echo "$KEY" > "$RUNNER_TEMP/classic-nightly-pr-build-pass/key"
      - name: Save the pass
        if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/classic-nightly-pr-build-pass
          key: ${{ env.KEY }}
