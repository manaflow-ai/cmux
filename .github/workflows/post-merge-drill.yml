name: post-merge drill

# The post-merge batch tier's drill suite (.github/post-merge-batch.json): red exactly when the
# commit carries .github/post-merge-drill-red. Its paths are that file alone, so on feat-cmux-next,
# where the file never exists, no batch run calls it. A drill branch (lane/post-merge-drill-*)
# plants the file at one commit of a run of commits to prove the bisect names that commit and the
# revert pull request opens.
on:
  workflow_call:
    inputs:
      sha:
        description: Commit to test (empty is the caller's commit).
        type: string
        default: ""
      only:
        description: Run only this job id (a bisect probe); empty runs every job.
        type: string
        default: ""

permissions: {}

env:
  # Temporary REST budget attribution: one gh-call line per GitHub API call (scripts/ci/api_call_log/env.sh, fetched at a fixed commit when the checkout has no copy).
  BASH_ENV: '$({ w="${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh"; t="${RUNNER_TEMP:-/nonexistent}/api-call-log-src"; if [ -f "$w" ]; then echo "$w"; elif [ -n "${RUNNER_TEMP:-}" ]; then if [ ! -f "$t/env.sh" ] && [ ! -e "$t.tried" ] && { [ "${RUNNER_OS:-}" = Linux ] || [ "${RUNNER_OS:-}" = macOS ]; } && [ "$(date -u +%Y%m%d%H)" -lt 2026112300 ]; then : > "$t.tried"; mkdir -p "$t.part" && for x in env.sh gh sitecustomize.py isolated.py; do curl -fsSL --max-time 5 -o "$t.part/$x" "https://raw.githubusercontent.com/manaflow-ai/cmux/27647ffd3ae838c63be28ca3e5883dcd68c34518/scripts/ci/api_call_log/$x" || break; done; [ -s "$t.part/isolated.py" ] && mv "$t.part" "$t"; fi; if [ -f "$t/env.sh" ]; then echo "$t/env.sh"; else echo unset BASH_ENV > "$t.off.sh" && echo "$t.off.sh"; fi; fi; } 2>/dev/null)'

jobs:
  drill:
    if: inputs.only == '' || inputs.only == 'drill'
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.CI_OVERFLOW_LINUX || 'cmux-linux' }}
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          ref: ${{ inputs.sha || github.sha }}
          sparse-checkout: .github
      - name: Red when the drill file is planted
        run: |
          if [ -e .github/post-merge-drill-red ]; then
            echo "::error::.github/post-merge-drill-red is planted at $(git rev-parse HEAD)"
            exit 1
          fi
          echo "no drill red at $(git rev-parse HEAD)"
