name: CI hosted light rescue

# Recovery cannot wait for the overflow probes it is meant to recover from.
# The existing owned-pool sweeper provides the minute cadence. This schedule
# wakes that single concurrency owner instead of racing its cancel/rerun pass.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report recovery without dispatching the minute sweeper"
        required: true
        default: true
        type: boolean

permissions: {}

concurrency:
  group: ci-hosted-light-rescue
  cancel-in-progress: false

env:
  # Temporary REST budget attribution: one gh-call line per GitHub API call (scripts/ci/api_call_log/env.sh, fetched at a fixed commit when the checkout has no copy).
  BASH_ENV: '$({ w="${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh"; t="${RUNNER_TEMP:-/nonexistent}/api-call-log-src"; if [ -f "$w" ]; then echo "$w"; elif [ -n "${RUNNER_TEMP:-}" ]; then if [ ! -f "$t/env.sh" ] && [ ! -e "$t.tried" ] && { [ "${RUNNER_OS:-}" = Linux ] || [ "${RUNNER_OS:-}" = macOS ]; } && [ "$(date -u +%Y%m%d%H)" -lt 2026112300 ]; then : > "$t.tried"; mkdir -p "$t.part" && for x in env.sh gh sitecustomize.py isolated.py; do curl -fsSL --max-time 5 -o "$t.part/$x" "https://raw.githubusercontent.com/manaflow-ai/cmux/27647ffd3ae838c63be28ca3e5883dcd68c34518/scripts/ci/api_call_log/$x" || break; done; [ -s "$t.part/isolated.py" ] && mv "$t.part" "$t"; fi; if [ -f "$t/env.sh" ]; then echo "$t/env.sh"; else echo unset BASH_ENV > "$t.off.sh" && echo "$t.off.sh"; fi; fi; } 2>/dev/null)'

jobs:
  rescue:
    if: github.repository == 'manaflow-ai/cmux' && vars.CI_HOSTED_LIGHT_RESCUE_DISABLED != '1'
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.CI_QUEUE_RESERVED == '1' && 'cmux-gcp-queue-jit-x64' || vars.CI_REPAIR_SKIP_FLEET != '1' && 'cmux-gcp-repair-jit-x64' || contains(fromJSON('["blacksmith-2vcpu-ubuntu-2404","blacksmith-4vcpu-ubuntu-2404","blacksmith-8vcpu-ubuntu-2404","cmux-gcp-secret-jit-x64"]'), vars.CI_TRUSTED_RUNNER) && vars.CI_TRUSTED_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }} # ephemeral-required: Actions write stays on a fresh one-job VM; the owned fleet first (off the pool it drains), never a persistent owned machine
    timeout-minutes: 8
    permissions:
      actions: write
      contents: read
    steps:
      - name: Check out trusted rescue code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Always read the reviewed rescue implementation from the trusted default branch.
          # An explicit ref prevents a workflow-dispatch branch from supplying Actions-write code.
          ref: refs/heads/main
          persist-credentials: false

      # The repository GITHUB_TOKEN pool's remaining calls, as one notice NOW (cmuxterm-hq now_repo_token.py)
      # reads from the newest run: every 5 minutes, and GET /rate_limit does not count against the pool.
      - name: Report the GITHUB_TOKEN budget
        continue-on-error: true
        timeout-minutes: 1
        env:
          BUDGET_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/github_token_budget.py --notice

      # The repository GITHUB_TOKEN hour is shared by every workflow; under its floor this recurring pass sends
      # nothing on it and the next tick looks again (scripts/ci/job_token_floor.py; GET /rate_limit is free).
      - name: Read the GITHUB_TOKEN floor
        id: job-floor
        continue-on-error: true
        timeout-minutes: 1
        env:
          JOB_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/job_token_floor.py ci-hosted-light-rescue/rescue

      # Only the existing owned-pool-sweeper concurrency group mutates runs.
      # A dispatch waits behind a live sweep, then provides its next handover;
      # when no sweep is running it starts recovery without the overflow probe.
      - name: Wake the single minute sweeper
        if: steps.job-floor.outputs.held != 'true'
        timeout-minutes: 4
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
        run: >-
          python3 scripts/ci/hosted_light_rescue.py
          --wake-sweeper
