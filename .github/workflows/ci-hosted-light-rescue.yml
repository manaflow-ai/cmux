name: CI hosted light rescue

# Recovery cannot wait for the overflow probes it is meant to recover from.
# The existing owned-pool sweeper provides the minute cadence; this schedule
# is independent recovery, not a claim that a five-minute cron bounds queue age.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report eligible jobs without cancelling or rerunning them"
        required: true
        default: true
        type: boolean

permissions: {}

concurrency:
  group: ci-hosted-light-rescue
  cancel-in-progress: false

jobs:
  rescue:
    if: github.repository == 'manaflow-ai/cmux' && vars.CI_HOSTED_LIGHT_RESCUE_DISABLED != '1'
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || contains(fromJSON('["ubuntu-24.04","blacksmith-2vcpu-ubuntu-2404","blacksmith-4vcpu-ubuntu-2404","blacksmith-8vcpu-ubuntu-2404"]'), vars.CI_TRUSTED_RUNNER) && vars.CI_TRUSTED_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }} # ephemeral-required: Actions write stays on a fresh runner; never an owned label
    timeout-minutes: 8
    permissions:
      actions: write
      contents: read
    steps:
      - name: Check out trusted rescue code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Check current workflow routes
        timeout-minutes: 2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: feat-cmux-next
          path: .rescue-workflows
          sparse-checkout: .github
          persist-credentials: false

      # The existing helper only moves attempt-1 current-head PR runs whose
      # unfinished jobs are all unassigned hosted jobs stalled for 180 seconds.
      # Its run, rescue and settle bounds remain unchanged.
      - name: Fail stalled hosted light jobs over to their re-run route
        timeout-minutes: 4
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
        run: >-
          python3 scripts/ci/hosted_light_rescue.py
          --runners .rescue-workflows/.github/runners.json
          --workflows .rescue-workflows/.github/workflows
