name: CI hosted light rescue

# Recovery cannot wait for the overflow probes it is meant to recover from.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report eligible jobs without cancelling or rerunning them"
        required: true
        default: true
        type: boolean

permissions: {}

concurrency:
  group: ci-hosted-light-rescue
  cancel-in-progress: false

jobs:
  rescue:
    if: github.repository == 'manaflow-ai/cmux' && vars.CI_HOSTED_LIGHT_RESCUE_DISABLED != '1'
    runs-on: ${{ vars.CI_LIGHT_LANE_RUNNER || vars.CI_SIDE_LANE_RUNNER || vars.LINUX_RUNNER || fromJSON(vars.RUNNER_POOLS).linux_2 }}
    timeout-minutes: 8
    permissions:
      actions: write
      contents: read
    steps:
      - name: Check out the reviewed hosted light rescue
        id: hosted-light-tooling
        timeout-minutes: 2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: 1ecf8a89abe506ae2ec97feb245d6ba642adfac6 # cmux#32023 + #32120 on feat-cmux-next
          path: .hosted-light-tooling
          sparse-checkout: |
            scripts/ci/hosted_light_rescue.py
            .github/runners.json
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Check current workflow routes
        timeout-minutes: 2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: feat-cmux-next
          path: .rescue-workflows
          sparse-checkout: .github/workflows
          persist-credentials: false

      # The existing helper only moves attempt-1 current-head PR runs whose
      # unfinished jobs are all unassigned hosted jobs stalled for 180 seconds.
      # Its run, rescue and settle bounds remain unchanged.
      - name: Fail stalled hosted light jobs over to their re-run route
        timeout-minutes: 4
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
        run: >-
          python3 .hosted-light-tooling/scripts/ci/hosted_light_rescue.py
          --runners .hosted-light-tooling/.github/runners.json
          --workflows .rescue-workflows/.github/workflows
