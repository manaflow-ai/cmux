name: PR capture check

# A pull request that changes native app UI shows a real capture of it in its description:
# what `cmux-ci capture` prints (a fleet build driven on a capture mini, light and dark, checked
# for private text), the media-tour label, or a `No capture: <why>` line. Lanes kept merging UI
# changes with no capture or with mock stills. scripts/ci/pr_capture_check.py decides; it runs
# from the base branch, never the pull request's code. Editing the description re-runs it.
on:
  pull_request:
    branches: [feat-cmux-next]
    types: [opened, synchronize, reopened, edited, labeled, unlabeled, ready_for_review]

permissions: {}

concurrency:
  group: pr-capture-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  capture:
    name: pr-capture-check
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-2vcpu-ubuntu-2404' || vars.LINUX_RUNNER || 'blacksmith-2vcpu-ubuntu-2404' }}
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout the check from the base branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          persist-credentials: false
          sparse-checkout: |
            scripts/ci/pr_capture_check.py
            scripts/cmux-next/media/path_map.py
          sparse-checkout-cone-mode: false

      - name: Check the description for a real capture
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BODY: ${{ github.event.pull_request.body }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          set -euo pipefail
          if [ ! -f scripts/ci/pr_capture_check.py ]; then
            # The pull request that adds the check: its base has no check to run yet.
            echo "::notice::The base branch has no scripts/ci/pr_capture_check.py yet; nothing to check."
            exit 0
          fi
          printf '%s' "$BODY" > "$RUNNER_TEMP/body.md"
          gh api --paginate "repos/$REPOSITORY/pulls/$PR/files?per_page=100" --jq '.[].filename' > "$RUNNER_TEMP/paths.txt"
          python3 scripts/ci/pr_capture_check.py --body-file "$RUNNER_TEMP/body.md" --paths-file "$RUNNER_TEMP/paths.txt" \
            --labels "$LABELS" --head-sha "$HEAD_SHA" --pr "$PR"
