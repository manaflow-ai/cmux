name: Gateway end-to-end (development)

# Proof branch only, never merged: this copy replaces gateway-e2e's job with one own-host journey on
# development (cloud-journey.ts --machine-provider own-host, cmux#58267), so a dispatch with
# --ref lane/microvm-ownhost-journey-proof runs one AutoCloud chat on a cmux-vmd Firecracker microVM.

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ownhost-journey-proof
  cancel-in-progress: false

jobs:
  own-host:
    environment:
      name: cmux-next-vm-image-dev
      deployment: false
    runs-on: cmux-linux
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: false

      - name: Restore pinned Bun 1.4.4 from the CI cache bucket
        shell: bash
        continue-on-error: true
        run: bash "$GITHUB_WORKSPACE/scripts/ci/toolchain-r2.sh" restore bun 1.4.4 || true

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
          no-cache: true

      - name: One chat on an own-host microVM (development)
        env:
          CMUX_DOGFOOD_STACK_EMAIL: ${{ secrets.CMUX_DOGFOOD_STACK_EMAIL }}
          CMUX_DOGFOOD_STACK_PASSWORD: ${{ secrets.CMUX_DOGFOOD_STACK_PASSWORD }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/ownhost-journey"
          mkdir -p "$out"
          status=0
          bun scripts/cmux-next/cloud-journey.ts --backend dev --machine-provider own-host --seed none --team team_968c8afd7c1f2b21e6b8 \
            --skip sync --out "$out" || status=$?
          cat "$out/summary.md" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "(no summary written)" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Upload the journey output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ownhost-journey-${{ github.run_id }}
          path: ${{ runner.temp }}/ownhost-journey
          retention-days: 7
