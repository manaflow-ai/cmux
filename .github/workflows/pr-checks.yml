name: PR checks

# The feat-cmux-next pull request checks, folded into one workflow so a push
# starts one run instead of seven: the review link, the PR size check and the
# split-plan advisory (from gallery-link.yml, pr-size-advisory.yml and
# cmux-next-split-guard.yml), and the four description lints in one job, `body`
# (from pr-capture-check.yml, pr-design-spec-check.yml, pr-perf-section-check.yml
# and pr-cloud-backend-check.yml, which each started a Linux runner for a few
# seconds of Python: about 270,000 runs and 69,000 runner-minutes in 14 days).
# None of them fails a pull request on what it finds. PR size warns on one over
# 800 lines with no `Size:` line and runs on every push, a base-only one included.
#
# Label events: the capture check reads the media-tour labels and the perf check
# the perf labels, so those label events start a run of `body` alone; any other
# label skips every job (tests/test_ci_label_events_skip_full_ci.py). Bots set and
# clear risk, hold and landing labels on hundreds of open pull requests.
#
# Base-only updates: a push that only merged feat-cmux-next into the branch
# skips the link and split-plan, whose answers stay the previous head's. On 2026-10-26,
# 19:30-19:55Z, 33 such updates started 523 runs, 214 of them advisory, and every
# run spends from the one GITHUB_TOKEN budget.
on:
  pull_request:
    branches: [feat-cmux-next]
    types: [opened, synchronize, reopened, edited, labeled, unlabeled, ready_for_review]

# The base-only job reads the previous head's run by this title, which names the pull
# request (two pull requests can share a head commit): an `edited` run
# (the PR size check alone), a held one (CI_QUOTA_HOLD) or a draft's does not
# answer for that head's other checks.
run-name: "#${{ github.event.pull_request.number }} ${{ github.event.action }}${{ vars.CI_QUOTA_HOLD == '1' && ' (held)' || '' }}${{ github.event.pull_request.draft && ' (draft)' || '' }}: ${{ github.event.pull_request.title }}"

permissions: {}

# A push supersedes the previous push's run, which then reads as cancelled, so
# a base-only push after it runs every check rather than keep answers that never
# finished. A description edit (the PR size check alone) has its own group and
# never cancels a push's run. A label event never joins either: one the checks
# do not read takes a group of its own (every job skips), and a media-tour or perf
# label shares one with the same label's other events.
concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}-${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'feat-cmux-next' && (github.event.action == 'labeled' || github.event.action == 'unlabeled') && !contains(fromJSON('["media-tour","media-tour-mac","perf","performance"]'), github.event.label.name) && format('-label-{0}', github.run_id) || (github.event.action == 'labeled' || github.event.action == 'unlabeled') && format('label-{0}', github.event.label.name) || github.event.action == 'edited' && 'edited' || 'push' }}
  cancel-in-progress: true

env:
  # Temporary REST budget attribution: one gh-call line per GitHub API call (scripts/ci/api_call_log/env.sh).
  BASH_ENV: ${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh

jobs:
  # A small, secretless bootstrap reads the fresh runner-state publication and
  # assigns the advisory jobs to an idle owned mini when one is available.  The
  # source branch is trusted and the placement script fails open, so a stale or
  # missing publication keeps the existing hosted/Blacksmith route.
  portable-placement:
    name: portable light placement
    if: ${{ vars.CI_PORTABLE_LIGHT_JOBS_OFF != '1' && github.event.action != 'labeled' && github.event.action != 'unlabeled' }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-2vcpu-ubuntu-2404' || github.run_attempt == 1 && 'ubuntu-24.04' || fromJSON(vars.RUNNER_POOLS).linux_2 }}
    timeout-minutes: 4
    permissions:
      contents: read
      actions: read
    outputs:
      linux_runner: ${{ steps.place.outputs.linux_runner }}
      linux_jobs: ${{ steps.place.outputs.linux_jobs }}
      mini_runner: ${{ steps.place.outputs.mini_runner }}
      mini_jobs: ${{ steps.place.outputs.mini_jobs }}
      placed_attempt: ${{ github.run_attempt }}
    steps:
      - name: Check out the trusted placement script
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          sparse-checkout: scripts/ci
          persist-credentials: false
      - name: Place the portable advisory jobs
        id: place
        continue-on-error: true
        env:
          CI_RUNNER_STATE: ${{ vars.CI_RUNNER_STATE }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          JOBS: size ui-review split
          # Only the owned-pool rescue bot's third attempt may re-place these
          # light jobs. Other workflows and manual retries stay fail-closed.
          PORTABLE_ATTEMPT3_RESCUE: '1'
          FLEET_LINUX: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || vars.LINUX_RUNNER }}
          REQUIRE_LIVE_CAPACITY: '1'
          SIDE_LABEL: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || vars.CI_LIGHT_LANE_RUNNER || vars.CI_SIDE_LANE_RUNNER }}
          SNAPSHOT_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/portable_job_placement.py

  # Whether this push only merged the base, so the previous head's answers still
  # hold. Any doubt (another event, a force push, a failed fetch or read, a
  # conflict resolved by hand, a previous run that did not finish) answers false
  # and every check runs.
  base-only:
    name: base-only update
    if: github.event.action == 'synchronize'
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-2vcpu-ubuntu-2404' || fromJSON(vars.RUNNER_POOLS).linux }}
    timeout-minutes: 6
    # contents: read only. The repository is public, so the one run read below needs
    # no Actions scope; a refused read answers false.
    permissions:
      contents: read
    outputs:
      base_only: ${{ steps.decide.outputs.base_only }}
    steps:
      - name: Compare the new head with the previous one
        id: decide
        continue-on-error: true
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ACTION: ${{ github.event.action }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR: ${{ github.event.pull_request.number }}
          REMOTE: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          set -uo pipefail
          decide() {
            echo "base_only=$1" >> "$GITHUB_OUTPUT"
            echo "$2" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          }
          [ "$ACTION" = synchronize ] || decide false "A $ACTION event, not a push: every check runs."
          case "$BEFORE" in ""|0000000000000000000000000000000000000000) decide false "No previous head: every check runs.";; esac
          repo="$RUNNER_TEMP/base-only"
          git init -q "$repo"
          git -C "$repo" remote add origin "$REMOTE"
          # Commits and trees only, back far enough to find where the previous head
          # last met the base; the merge and the diffs below fetch only the blobs they read.
          timeout 150 git -C "$repo" fetch -q --no-tags --filter=blob:none --shallow-since="4 days ago" origin \
            "+refs/pull/$PR/head:refs/remotes/pr/head" "+refs/heads/$BASE_REF:refs/remotes/origin/base" \
            || decide false "Could not fetch the head and $BASE_REF: every check runs."
          [ "$(git -C "$repo" rev-parse refs/remotes/pr/head)" = "$AFTER" ] || decide false "The branch moved past $AFTER: every check runs."
          # The new head's parents: the previous head, then a commit on the base.
          read -r first second extra <<<"$(git -C "$repo" rev-list --parents -n 1 "$AFTER" | cut -d' ' -f2-)"
          if [ "${first:-}" != "$BEFORE" ] || [ -z "${second:-}" ] || [ -n "${extra:-}" ]; then
            decide false "The head is not a merge onto the previous head: every check runs."
          fi
          git -C "$repo" merge-base --is-ancestor "$second" refs/remotes/origin/base \
            || decide false "The merged commit is not on $BASE_REF: every check runs."
          bases="$(git -C "$repo" merge-base --all "$BEFORE" "$second" 2>/dev/null || true)"
          if [ -z "$bases" ] || [ "$(wc -l <<<"$bases")" -ne 1 ]; then
            decide false "No single point where the previous head met $BASE_REF: every check runs."
          fi
          # That merge base is the real one only if the fetched history is whole above it:
          # a commit whose parents the shallow fetch cut, reachable from either side but
          # not from the merge base, could hide a newer common ancestor.
          # The whole list is written out first, so a failed rev-list answers false.
          git -C "$repo" rev-list "$BEFORE" "$second" --not "$bases" > "$RUNNER_TEMP/base-only.above" \
            || decide false "Could not list the history above where the previous head met $BASE_REF: every check runs."
          if [ -f "$repo/.git/shallow" ] && grep -qFxf "$repo/.git/shallow" "$RUNNER_TEMP/base-only.above"; then
            decide false "The fetched history is cut above where the previous head met $BASE_REF: every check runs."
          fi
          # The new head is exactly the clean merge of the base into the previous head:
          # nothing resolved or edited by hand.
          merged="$(timeout 120 git -C "$repo" merge-tree --write-tree --no-messages "$BEFORE" "$second")" \
            || decide false "Merging $BASE_REF into the previous head does not merge cleanly: every check runs."
          [ "$merged" = "$(git -C "$repo" rev-parse "$AFTER^{tree}")" ] \
            || decide false "The head is not the clean merge of $BASE_REF into the previous head: every check runs."
          # And the pull request's own change is the same: no context, line numbers or blob
          # ids, so a base that moved under unchanged hunks keeps it equal.
          change() {
            timeout 120 git -C "$repo" -c diff.renames=false diff -U0 --binary --no-color --no-ext-diff "$1" "$2" \
              > "$RUNNER_TEMP/base-only.diff" || return 1
            grep -vE '^(index |@@)' "$RUNNER_TEMP/base-only.diff" | sha256sum | cut -d' ' -f1
          }
          old="$(change "$bases" "$BEFORE")" || decide false "Could not diff the previous head: every check runs."
          new="$(change "$second" "$AFTER")" || decide false "Could not diff the new head: every check runs."
          [ "$old" = "$new" ] || decide false "The merge changed the pull request's own diff: every check runs."
          # The previous head's answers exist: this pull request's newest push run at that
          # head (not a description edit, a held run or a draft's; another pull request at
          # the same commit does not count) finished green. One read, only for a base-only head.
          case "$PR" in ""|*[!0-9]*) decide false "No pull request number: every check runs.";; esac
          # gh's --jq takes no --arg: the number (digits only, checked above) goes in by substitution.
          filter='[.workflow_runs[] | select(.display_title | startswith("#@PR@ "))
                  | select(.display_title | test("^#[0-9]+ (opened|synchronize|reopened|ready_for_review):"))]
                  | sort_by(.run_number) | last | if . == null then "none" else "\(.status)/\(.conclusion)" end'
          previous="$(gh api "repos/$REPOSITORY/actions/workflows/pr-checks.yml/runs?head_sha=$BEFORE&event=pull_request&per_page=30" \
            --jq "${filter//@PR@/$PR}")" \
            || decide false "Could not read the previous head's run: every check runs."
          [ "$previous" = "completed/success" ] \
            || decide false "The previous head's run did not finish green ($previous): every check runs."
          echo "::notice title=Base-only update::$AFTER only merged $BASE_REF; the advisory checks keep the previous head's answers."
          decide true "$AFTER is the clean merge of $BASE_REF ($second) into $BEFORE, whose checks finished: the advisory checks are skipped."

  # Keep PRs navigable without publishing internal gallery payloads. The detailed
  # visual evidence stays in the private HQ feed and Actions artifacts; the PR gets
  # one stable link to those surfaces, as the `review` line of its status comment
  # (scripts/ci/pr_status.py). It runs on every push (no paths filter) except a
  # base-only one, so the line names the PR's newest head with its own change. The
  # script comes from the base branch, never the pull request's code.
  link:
    # A draft gets its line when it is marked ready. CI_QUOTA_HOLD=1 pauses the
    # line while the GITHUB_TOKEN budget is reserved for the nightly
    # (tests/test_ci_quota_hold_gate.py); the next push writes it.
    needs: base-only
    if: ${{ !cancelled() && needs.base-only.outputs.base_only != 'true' && contains(fromJSON('["opened","synchronize","reopened","ready_for_review"]'), github.event.action) && vars.CI_QUOTA_HOLD != '1' && !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || contains(fromJSON('["ubuntu-24.04","blacksmith-2vcpu-ubuntu-2404","blacksmith-4vcpu-ubuntu-2404"]'), vars.CI_TRUSTED_RUNNER) && vars.CI_TRUSTED_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }} # ephemeral-required: trusted pull-request-write token; CI_TRUSTED_RUNNER picks Blacksmith (default) or GitHub-hosted
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout the status script from the base branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          persist-credentials: false
          sparse-checkout: scripts/ci/pr_status.py
          sparse-checkout-cone-mode: false

      # Advisory: the line is a convenience, so a GitHub API error writing it warns and never turns
      # the check red (in its last 31 hours this check was red 47 times and never on a PR's code).
      - name: Update the PR's review line
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SERVER: ${{ github.server_url }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          FEED_URL: https://cmux-lawrences-mac-mini.tail137216.ts.net:18443/feed/
        run: |
          set -euo pipefail
          # The exact head, where its visual evidence is, its checks, and how to
          # get an app of it. No link to this run: it only writes the line, and
          # the HQ feed would read an Actions run link here as the PR's build.
          repo_url="$SERVER/$REPOSITORY"
          ref_query=$(jq -rn --arg q "branch:$HEAD_REF" '$q|@uri')
          # The branch keeps reload-build's cache warm; a name that is not
          # shell-safe to paste falls back to the exact SHA.
          build_ref=$HEAD_SHA
          if [[ "$HEAD_REF" =~ ^[A-Za-z0-9._/-]+$ ]]; then build_ref=$HEAD_REF; fi
          cat > "$RUNNER_TEMP/review.md" <<EOF
          Review [\`${HEAD_SHA:0:7}\`]($repo_url/commit/$HEAD_SHA): [HQ feed card](${FEED_URL}?pr=${PR}&view=all) · [gallery before/after runs]($repo_url/actions/workflows/gallery-advisory.yml?query=$ref_query) · [checks]($repo_url/pull/$PR/checks?sha=$HEAD_SHA)
          <details><summary>App of this head (app.zip, kept 1 day)</summary>

          \`gh workflow run reload-build.yml -R $REPOSITORY --ref feat-cmux-next -f tag=pr$PR -f ref=$build_ref -f platform=macos -f backend_mode=local\`
          </details>
          EOF
          python3 scripts/ci/pr_status.py set --repo "$REPOSITORY" --pr "$PR" --section review \
            --body-file "$RUNNER_TEMP/review.md" --legacy "<!-- cmux-gallery-link -->"

  # Warns on a feat-cmux-next pull request that changes more than about 800 lines
  # (added + deleted), not counting the generated, lockfile, localization and
  # fixture paths in scripts/ci/pr_size_exclusions.json, unless its body has a
  # line starting `Size:` with the reason (the check then prints the reason). The
  # warning carries a hint on how to split and asks a pull request over about 800
  # lines to say in its body why it isn't split. It never fails: Leo, 2026-10-28,
  # "as long as you're mindful about it, I feel like it's reasonable, but you
  # don't need to make it, like, a hard gate". It is not a ruleset required check.
  #
  # Cheap by design: one paginated GraphQL query (files and the current body) with
  # the read-only GITHUB_TOKEN, REST only as its fallback, and the script from the base
  # commit (sparse, no pull request code). Editing the body to add a `Size:` line
  # runs it again. Drafts skip until marked ready, and CI_QUOTA_HOLD=1 pauses it
  # while the token budget is reserved for the nightly
  # (tests/test_ci_quota_hold_gate.py). An API error or a script crash warns and
  # passes, and so does a measured size over the limit.
  size:
    name: PR size
    # Every edit runs it, a title-only one too: edits share one cancelling group, so a
    # title edit can cancel a body edit's run, and its own run must answer. It runs on a
    # base-only update too: it costs one API call, and a previous head's green run
    # from before it could fail (or that a later Size: edit changed) must not
    # answer for it.
    if: ${{ always() && !cancelled() && contains(fromJSON('["opened","synchronize","reopened","edited","ready_for_review"]'), github.event.action) && vars.CI_QUOTA_HOLD != '1' && !github.event.pull_request.draft }}
    # A declared light job (.github/runners.json hosted_light_jobs): one GraphQL read, 4 s of work.
    # Hosted Ubuntu on attempt 1, the reconciled Linux pool on a re-run (no secret).
    needs: portable-placement
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-4vcpu-ubuntu-2404' || needs.portable-placement.outputs.placed_attempt == format('{0}', github.run_attempt) && contains(needs.portable-placement.outputs.linux_jobs, ' size ') && needs.portable-placement.outputs.linux_runner || needs.portable-placement.outputs.placed_attempt == format('{0}', github.run_attempt) && contains(needs.portable-placement.outputs.mini_jobs, ' size ') && needs.portable-placement.outputs.mini_runner || github.run_attempt == 1 && 'ubuntu-24.04' || fromJSON(vars.RUNNER_POOLS).linux }}
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      # A failed checkout measures nothing: the next step finds no script and passes.
      - name: Check out the size script from the base
        id: checkout
        continue-on-error: true
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            scripts/ci/pr_size.py
            scripts/ci/pr_size_exclusions.json
          sparse-checkout-cone-mode: false

      - name: Count changed lines
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          CHECKOUT: ${{ steps.checkout.outcome }}
        run: |
          set -euo pipefail
          if [ "$CHECKOUT" != success ]; then
            echo "::warning title=PR size::could not check out the size script; size not measured"
            exit 0
          fi
          if [ ! -f scripts/ci/pr_size.py ]; then
            echo "::notice title=PR size::the base predates the size check; skipped"
            exit 0
          fi
          # The files and the body as it is now (not the event's copy: a re-run of an older run must
          # not answer with a `Size:` line the body no longer has) in one GraphQL query a 100 files.
          # GraphQL has its own hourly pool; the REST reads below, the GITHUB_TOKEN pool every
          # workflow shares (it ran out at 00:50Z on 2026-10-31), are only the fallback.
          # --paginate advances only a cursor named $endCursor. Each page repeats the body line.
          # shellcheck disable=SC2016 # GraphQL's $variables, not the shell's
          query='query($owner:String!,$name:String!,$number:Int!,$endCursor:String){repository(owner:$owner,name:$name){pullRequest(number:$number){body changedFiles files(first:100,after:$endCursor){pageInfo{hasNextPage endCursor} nodes{path additions deletions}}}}}'
          rows='.data.repository.pullRequest | ({pull_request: {body, changed_files: .changedFiles}} | @json), (.files.nodes[] | {filename: .path, additions, deletions} | @json)'
          event="$GITHUB_EVENT_PATH"
          if gh api graphql --paginate -f query="$query" -f owner="${REPOSITORY%%/*}" -f name="${REPOSITORY#*/}" \
            -F number="$PR" --jq "$rows" > "$RUNNER_TEMP/graphql.jsonl" 2>/dev/null \
            && grep -m1 '^{"pull_request":' "$RUNNER_TEMP/graphql.jsonl" > "$RUNNER_TEMP/live-event.json"; then
            grep -v '^{"pull_request":' "$RUNNER_TEMP/graphql.jsonl" > "$RUNNER_TEMP/files.jsonl" || true
            event="$RUNNER_TEMP/live-event.json"
          else
            echo "::notice title=PR size::GraphQL read failed; reading the files over REST"
            # An API error (rate limit, outage) warns and passes, as an oversized pull request does.
            if ! gh api --paginate "repos/$REPOSITORY/pulls/$PR/files?per_page=100" \
              --jq '.[] | {filename, additions, deletions} | @json' > "$RUNNER_TEMP/files.jsonl"; then
              echo "::warning title=PR size::could not read the pull request's files; size not measured"
              exit 0
            fi
            # A failed read of the current body keeps the event's.
            if gh api "repos/$REPOSITORY/pulls/$PR" --jq '{pull_request: {body, changed_files}}' \
              > "$RUNNER_TEMP/live-event.json" 2>/dev/null && [ -s "$RUNNER_TEMP/live-event.json" ]; then
              event="$RUNNER_TEMP/live-event.json"
            else
              echo "::notice title=PR size::could not read the current body; using the event's"
            fi
          fi
          status=0
          python3 scripts/ci/pr_size.py --files "$RUNNER_TEMP/files.jsonl" --event "$event" || status=$?
          case "$status" in
            0) ;;
            3) ;;  # over the limit with no `Size:` line: the script printed the warning; never a gate
            *) echo "::warning title=PR size::the size script failed (exit $status); size not measured" ;;
          esac

  # Webview UI changes carry the review loop from the aiforui course. This is
  # intentionally advisory: a missing section warns, but never blocks a PR.
  # The checker comes from the base branch so a PR cannot weaken its own policy.
  ui-review:
    name: UI review advisory
    needs: [base-only, portable-placement]
    if: ${{ always() && !cancelled() && needs.base-only.outputs.base_only != 'true' && contains(fromJSON('["opened","synchronize","reopened","edited","ready_for_review"]'), github.event.action) && vars.CI_QUOTA_HOLD != '1' && !github.event.pull_request.draft }}
    # A declared light job (.github/runners.json hosted_light_jobs): one file list read, 4 s of work.
    # Hosted Ubuntu on attempt 1, the reconciled Linux pool on a re-run (no secret).
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-4vcpu-ubuntu-2404' || needs.portable-placement.outputs.placed_attempt == format('{0}', github.run_attempt) && contains(needs.portable-placement.outputs.linux_jobs, ' ui-review ') && needs.portable-placement.outputs.linux_runner || needs.portable-placement.outputs.placed_attempt == format('{0}', github.run_attempt) && contains(needs.portable-placement.outputs.mini_jobs, ' ui-review ') && needs.portable-placement.outputs.mini_runner || github.run_attempt == 1 && 'ubuntu-24.04' || fromJSON(vars.RUNNER_POOLS).linux }}
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out the advisory from the base
        id: checkout
        continue-on-error: true
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          sparse-checkout: scripts/ci/ui_review_advisory.py
          sparse-checkout-cone-mode: false

      # The changed paths from the event's merge commit without blobs, as the body job reads
      # them: no API call. The paginated REST file list (one call a page, from the repository's shared
      # GITHUB_TOKEN budget) is only the fallback when git cannot answer.
      - name: Read changed files and body
        id: read
        if: steps.checkout.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          MERGE_SHA: ${{ github.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BODY: ${{ github.event.pull_request.body }}
          FILES_JSON: ${{ runner.temp }}/ui-review-files.json
          BODY_FILE: ${{ runner.temp }}/ui-review-body.md
        run: |
          set -euo pipefail
          paths="$RUNNER_TEMP/ui-review-paths.txt"
          if git fetch --no-tags --quiet --depth=2 --filter=blob:none origin "$MERGE_SHA" \
            && [ "$(git rev-parse "$MERGE_SHA^2")" = "$HEAD_SHA" ] \
            && git diff --name-only -z --no-renames "$MERGE_SHA^1" "$MERGE_SHA" | tr '\0' '\n' > "$paths"; then
            echo "changed files: $(wc -l < "$paths" | tr -d ' ') from the merge commit (git)"
          else
            echo "::notice title=UI review::git could not list the changed files; reading them over the API"
            gh api --paginate "repos/$REPOSITORY/pulls/$PR/files?per_page=100" --jq '.[].filename' > "$paths"
          fi
          python3 -c 'import json, sys; json.dump([{"filename": l} for l in open(sys.argv[1]).read().splitlines() if l], open(sys.argv[2], "w"))' \
            "$paths" "$FILES_JSON"
          printf '%s' "$BODY" > "$BODY_FILE"

      - name: Warn when the UI review is missing
        if: steps.read.outcome == 'success'
        env:
          FILES_JSON: ${{ runner.temp }}/ui-review-files.json
          BODY_FILE: ${{ runner.temp }}/ui-review-body.md
        run: |
          if [ ! -f scripts/ci/ui_review_advisory.py ]; then
            echo "::warning title=UI review::the advisory script is not present on the base; review the UI section manually"
            exit 0
          fi
          python3 scripts/ci/ui_review_advisory.py --body-file "$BODY_FILE" --files-json "$FILES_JSON" \
            || echo "::warning title=UI review::the advisory script could not run; review the UI section manually"

      - name: Warn when changed files could not be read
        if: steps.read.outcome != 'success'
        run: echo "::warning title=UI review::could not check out the advisory or read changed files; review the UI section manually"

  # Every push-group event runs it (ready_for_review too, which the old workflow did not):
  # that event can cancel a push run, and its own run must answer for all three checks.
  # A label event is in no push group, so it skips.
  split:
    name: split-plan advisory
    needs: [base-only, portable-placement]
    if: ${{ always() && !cancelled() && needs.base-only.outputs.base_only != 'true' && github.event.action != 'edited' && github.event.action != 'labeled' && github.event.action != 'unlabeled' }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-4vcpu-ubuntu-2404' || needs.portable-placement.outputs.placed_attempt == format('{0}', github.run_attempt) && contains(needs.portable-placement.outputs.linux_jobs, ' split ') && needs.portable-placement.outputs.linux_runner || needs.portable-placement.outputs.placed_attempt == format('{0}', github.run_attempt) && contains(needs.portable-placement.outputs.mini_jobs, ' split ') && needs.portable-placement.outputs.mini_runner || fromJSON(vars.RUNNER_POOLS).linux }}
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Fetch split refs without blobs
        run: git fetch --no-tags --filter=blob:none --unshallow origin
      # The classifier comes from the base: a head branched before the guard has no copy, and a
      # pull request should not grade itself with its own edits to the guard.
      - name: Report split metrics
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git show "$BASE_SHA:scripts/cmux-next/check-pr-split.py" > "$RUNNER_TEMP/check-pr-split.py"
          python3 "$RUNNER_TEMP/check-pr-split.py" --base "$BASE_SHA" --head "$HEAD_SHA" --mode advisory

  # The four description lints, one runner for all of them. Each step is the step its own workflow
  # had (pr-capture-check.yml, pr-design-spec-check.yml, pr-perf-section-check.yml,
  # pr-cloud-backend-check.yml), with the label events it read and the warn-only setting it had.
  # The scripts and maps run from the base branch, never the pull request's code. Editing the
  # description re-runs it. It runs on drafts and on a base-only update, as they did.
  #
  # Only the capture step can turn it red (2 on bad input), so the job keeps that check's name first:
  # cmuxterm-hq's next_autoland and base_red_watch read a job named pr-capture-check as the PR's own
  # red, never a base red. The other three only warn: their steps continue on error.
  #
  # Capture: a pull request that changes native app UI shows a real capture of it in its description
  # (what `cmux-ci capture` prints, the media-tour label, or a `No capture: <why>` line); a capture or
  # media-tour label also requires body proof that the after image was viewed and judged. It only
  # warns and never fails (Leo, 2026-10-31: "WE DONT NEED F***ING SCREENSHOTS JUST LET ME TRY THE
  # STUFF OUT").
  #
  # Design spec: a pull request that changes a UI surface's files cites the surface's design spec
  # (.github/design-surfaces.json; 2026-10-28: #26071 replaced the model picker's harness tabs and
  # nobody noticed). The map is the base branch's joined with the PR's (data only, from the merge
  # commit), so a PR that moves a surface's files and maps the new paths is judged on both.
  #
  # Perf section: a performance pull request (the perf label, or a perf word in its title or
  # description; docs-only changes are exempt) records a `## Performance` table of before/after
  # deltas, or a `No perf numbers: <why>` line. Advisory since the checks audit (Leo, 2026-11-01:
  # "keep only what catches real breakage"; cmuxterm-hq#5745).
  #
  # Cloud backend: new cloud backend code goes to the private manaflow-ai/cmux-platform; a PR that
  # adds or changes a path in .github/cloud-backend-paths.json gets a warning unless its description
  # has a `cmux-platform:` line (Leo, 2026-10-31: "WHY DO WE HAVE SO MANY PRS IN CMUX INSTEAD OF
  # CMUX-PLATFORM!?").
  body:
    name: pr-capture-check, design spec, perf section, cloud backend
    if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'feat-cmux-next' && (github.event.action == 'labeled' || github.event.action == 'unlabeled') && !contains(fromJSON('["media-tour","media-tour-mac","perf","performance"]'), github.event.label.name)) }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-2vcpu-ubuntu-2404' || fromJSON(vars.RUNNER_POOLS).linux }}
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout the checks from the base branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          persist-credentials: false
          sparse-checkout: |
            scripts/ci/pr_capture_check.py
            scripts/cmux-next/media/path_map.py
            scripts/ci/pr_design_spec_check.py
            .github/design-surfaces.json
            scripts/ci/pr_perf_section_check.py
            scripts/ci/pr_cloud_backend_check.py
            .github/cloud-backend-paths.json
          sparse-checkout-cone-mode: false

      # The paths this pull request changes, from git rather than the files API (a call per 100
      # files on each event: every push, label and description edit). The event's merge commit and
      # its first parent, the base, without blobs: two trees, read as data, never run. Only the
      # merge of this head counts; a stale or one-parent commit lists nothing. Any failure leaves
      # `listed` unset: the capture and perf checks then read the files API, and the design spec and
      # cloud backend checks are skipped.
      #   capture-paths.txt  the files API's `.filename` set: a rename under its new name (-M); it
      #                      leaves out only a change the base already carries
      #   paths.txt          a rename as both its old and new path, so a code file moved under docs/
      #                      is not docs-only (perf, design spec)
      #   tree.txt, design-surfaces.json   the merged tree's file list and its surface map (design spec)
      #   status.txt         each path with its status, added, modified or deleted (cloud backend)
      - name: List the changed paths
        id: paths
        continue-on-error: true
        timeout-minutes: 2
        env:
          MERGE_SHA: ${{ github.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --quiet --depth=2 --filter=blob:none origin "$MERGE_SHA"
          [ "$(git rev-parse "$MERGE_SHA^2")" = "$HEAD_SHA" ]
          git diff --name-only -z -M "$MERGE_SHA^1" "$MERGE_SHA" | tr '\0' '\n' > "$RUNNER_TEMP/capture-paths.txt"
          git diff --name-only -z --no-renames "$MERGE_SHA^1" "$MERGE_SHA" | tr '\0' '\n' > "$RUNNER_TEMP/paths.txt"
          git ls-tree -r --name-only "$MERGE_SHA" > "$RUNNER_TEMP/tree.txt"
          git show "$MERGE_SHA:.github/design-surfaces.json" > "$RUNNER_TEMP/design-surfaces.json" || true
          git diff --name-status --no-renames "$MERGE_SHA^1" "$MERGE_SHA" > "$RUNNER_TEMP/status.txt"
          echo "listed=true" >> "$GITHUB_OUTPUT"

      # Not continue-on-error: a crash or bad input here is this job's red, as it was pr-capture-check's.
      # Each later step still runs (!cancelled()).
      - name: Check the description for a real capture
        if: ${{ !cancelled() && !((github.event.action == 'labeled' || github.event.action == 'unlabeled') && !contains(fromJSON('["media-tour","media-tour-mac"]'), github.event.label.name)) }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BODY: ${{ github.event.pull_request.body }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          LISTED: ${{ steps.paths.outputs.listed }}
        run: |
          set -euo pipefail
          if [ ! -f scripts/ci/pr_capture_check.py ]; then
            # The pull request that adds the check: its base has no check to run yet.
            echo "::notice::The base branch has no scripts/ci/pr_capture_check.py yet; nothing to check."
            exit 0
          fi
          printf '%s' "$BODY" > "$RUNNER_TEMP/capture-body.md"
          if [ "$LISTED" != true ]; then
            gh api --paginate "repos/$REPOSITORY/pulls/$PR/files?per_page=100" --jq '.[].filename' > "$RUNNER_TEMP/capture-paths.txt"
          fi
          python3 scripts/ci/pr_capture_check.py --body-file "$RUNNER_TEMP/capture-body.md" --paths-file "$RUNNER_TEMP/capture-paths.txt" \
            --labels "$LABELS" --head-sha "$HEAD_SHA" --pr "$PR"

      - name: Check the description cites each changed surface's spec
        if: ${{ !cancelled() && steps.paths.outputs.listed == 'true' && github.event.action != 'labeled' && github.event.action != 'unlabeled' }}
        continue-on-error: true
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          if [ ! -f scripts/ci/pr_design_spec_check.py ] || [ ! -f .github/design-surfaces.json ]; then
            # The pull request that adds the check: its base has no check or map yet.
            echo "::notice::The base branch has no design spec check or surface map yet; nothing to check."
            exit 0
          fi
          printf '%s' "$BODY" > "$RUNNER_TEMP/design-body.md"
          python3 scripts/ci/pr_design_spec_check.py --body-file "$RUNNER_TEMP/design-body.md" \
            --paths-file "$RUNNER_TEMP/paths.txt" --tree-file "$RUNNER_TEMP/tree.txt" \
            --map .github/design-surfaces.json --pr-map "$RUNNER_TEMP/design-surfaces.json" \
            || echo "::warning title=Design spec::the design spec check could not run (exit $?); see this job's log"

      # Advisory: a missing table is an ::error annotation on the run and never a red check, since it
      # judges the description, not the code.
      - name: Check the description for a Performance table
        if: ${{ !cancelled() && !((github.event.action == 'labeled' || github.event.action == 'unlabeled') && !contains(fromJSON('["perf","performance"]'), github.event.label.name)) }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          LISTED: ${{ steps.paths.outputs.listed }}
          ADDITIONS: ${{ github.event.pull_request.additions }}
          DELETIONS: ${{ github.event.pull_request.deletions }}
        run: |
          set -euo pipefail
          if [ ! -f scripts/ci/pr_perf_section_check.py ]; then
            # The pull request that adds the check: its base has no check to run yet.
            echo "::notice::The base branch has no scripts/ci/pr_perf_section_check.py yet; nothing to check."
            exit 0
          fi
          printf '%s' "$BODY" > "$RUNNER_TEMP/perf-body.md"
          if [ "$LISTED" != true ]; then
            gh api --paginate "repos/$REPOSITORY/pulls/$PR/files?per_page=100" --jq '.[] | .filename, (.previous_filename // empty)' > "$RUNNER_TEMP/paths.txt"
          fi
          size=()
          # The base copy runs; one from before the light path has no size flags.
          if grep -q -- "--additions" scripts/ci/pr_perf_section_check.py; then
            size=(--additions "$ADDITIONS" --deletions "$DELETIONS")
          fi
          python3 scripts/ci/pr_perf_section_check.py --body-file "$RUNNER_TEMP/perf-body.md" \
            --paths-file "$RUNNER_TEMP/paths.txt" --title "$TITLE" --labels "$LABELS" "${size[@]}"

      - name: Check where the cloud backend change belongs
        if: ${{ !cancelled() && steps.paths.outputs.listed == 'true' && github.event.action != 'labeled' && github.event.action != 'unlabeled' }}
        continue-on-error: true
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          if [ ! -f scripts/ci/pr_cloud_backend_check.py ] || [ ! -f .github/cloud-backend-paths.json ]; then
            # The pull request that adds the check: its base has no check or map yet.
            echo "::notice::The base branch has no cloud backend check or path map yet; nothing to check."
            exit 0
          fi
          printf '%s' "$BODY" > "$RUNNER_TEMP/cloud-body.md"
          python3 scripts/ci/pr_cloud_backend_check.py --body-file "$RUNNER_TEMP/cloud-body.md" \
            --status-file "$RUNNER_TEMP/status.txt" --map .github/cloud-backend-paths.json \
            || echo "::warning title=Cloud backend belongs in cmux-platform::the check could not run (exit $?); see this job's log"
