name: PR checks

# The feat-cmux-next pull request checks that run from the pull request's own
# event (`pull_request`), folded into one workflow so a push starts one run
# instead of four: pr-capture-check, the review link, the size advisory and the
# split-plan advisory. Their jobs, names, permissions and steps are what their
# own workflows had (pr-capture-check.yml, gallery-link.yml,
# pr-size-advisory.yml, cmux-next-split-guard.yml).
#
# Base-only updates: a push that only merged feat-cmux-next into the branch
# (the new head's parents are the old head and a commit on feat-cmux-next, and
# the pull request's own diff is the same before and after) skips the review
# link, the size advisory and the split-plan advisory: their answers are the old
# head's. pr-capture-check always runs, since a merger reads a missing verdict
# as a pass. On 2026-10-26, 19:30-19:55Z, 33 such updates started 523 runs, 214
# of them advisory, and every run spends from the one GITHUB_TOKEN budget.
on:
  pull_request:
    branches: [feat-cmux-next]
    types: [opened, synchronize, reopened, edited, labeled, unlabeled, ready_for_review]

permissions: {}

# A push supersedes the previous push's run. A description or label event gets
# its own group so it never cancels a push's run; pr-capture-check, which runs on
# every event, keeps its own job group, so the newest event's verdict is the one
# that finishes. The size advisory has no job group: a skipped job must never
# cancel a running one, and a description edit within a push's run is rare.
concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}-${{ contains(fromJSON('["edited","labeled","unlabeled"]'), github.event.action) && 'metadata' || 'push' }}
  cancel-in-progress: true

jobs:
  # Whether this push only merged the base. Commits and trees by git, no API
  # call and no token; any doubt (another event, a force push, a failed fetch, a
  # conflict resolved in the merge) answers false and every check runs.
  base-only:
    name: base-only update
    if: github.event.action == 'synchronize'
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-2vcpu-ubuntu-2404' || vars.LINUX_RUNNER || 'blacksmith-2vcpu-ubuntu-2404' }}
    timeout-minutes: 6
    permissions:
      contents: read
    outputs:
      base_only: ${{ steps.decide.outputs.base_only }}
    steps:
      - name: Compare the new head with the previous one
        id: decide
        continue-on-error: true
        timeout-minutes: 5
        env:
          ACTION: ${{ github.event.action }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR: ${{ github.event.pull_request.number }}
          REMOTE: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          set -uo pipefail
          decide() {
            echo "base_only=$1" >> "$GITHUB_OUTPUT"
            echo "$2" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          }
          [ "$ACTION" = synchronize ] || decide false "A $ACTION event, not a push: every check runs."
          case "$BEFORE" in ""|0000000000000000000000000000000000000000) decide false "No previous head: every check runs.";; esac
          repo="$RUNNER_TEMP/base-only"
          git init -q "$repo"
          git -C "$repo" remote add origin "$REMOTE"
          # Commits and trees only, back far enough to find where the previous head
          # last met the base; the two diffs below fetch only the blobs they read.
          timeout 150 git -C "$repo" fetch -q --no-tags --filter=blob:none --shallow-since="4 days ago" origin \
            "+refs/pull/$PR/head:refs/remotes/pr/head" "+refs/heads/$BASE_REF:refs/remotes/origin/base" \
            || decide false "Could not fetch the head and $BASE_REF: every check runs."
          [ "$(git -C "$repo" rev-parse refs/remotes/pr/head)" = "$AFTER" ] || decide false "The branch moved past $AFTER: every check runs."
          read -r first second extra <<<"$(git -C "$repo" rev-list --parents -n 1 "$AFTER" | cut -d' ' -f2-)"
          if [ "${first:-}" != "$BEFORE" ] || [ -z "${second:-}" ] || [ -n "${extra:-}" ]; then
            decide false "The head is not a merge onto the previous head: every check runs."
          fi
          git -C "$repo" merge-base --is-ancestor "$second" refs/remotes/origin/base \
            || decide false "The merged commit is not on $BASE_REF: every check runs."
          bases="$(git -C "$repo" merge-base --all "$BEFORE" "$second" 2>/dev/null || true)"
          if [ -z "$bases" ] || [ "$(wc -l <<<"$bases")" -ne 1 ]; then
            decide false "No single point where the previous head met $BASE_REF: every check runs."
          fi
          # The pull request's own change, before and after, without context, line
          # numbers or blob ids, so a base that moved under unchanged hunks keeps it equal.
          change() {
            timeout 120 git -C "$repo" -c diff.renames=false diff -U0 --binary --no-color --no-ext-diff "$1" "$2" \
              > "$RUNNER_TEMP/base-only.diff" || return 1
            grep -vE '^(index |@@)' "$RUNNER_TEMP/base-only.diff" | sha256sum | cut -d' ' -f1
          }
          old="$(change "$bases" "$BEFORE")" || decide false "Could not diff the previous head: every check runs."
          new="$(change "$second" "$AFTER")" || decide false "Could not diff the new head: every check runs."
          [ "$old" = "$new" ] || decide false "The merge changed the pull request's own diff: every check runs."
          echo "::notice title=Base-only update::$AFTER only merged $BASE_REF; the advisory checks keep the previous head's answers."
          decide true "$AFTER only merged $BASE_REF ($second) into $BEFORE, and the pull request's diff is unchanged: the advisory checks are skipped."

  # A pull request that changes native app UI shows a real capture of it in its description:
  # what `cmux-ci capture` prints (a fleet build driven on a capture mini, light and dark, checked
  # for private text), the media-tour label, or a `No capture: <why>` line. Lanes kept merging UI
  # changes with no capture or with mock stills. scripts/ci/pr_capture_check.py decides; it runs
  # from the base branch, never the pull request's code. Editing the description re-runs it.
  # Every event and every draft runs it, base-only updates included.
  capture:
    name: pr-capture-check
    concurrency:
      group: pr-capture-check-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-2vcpu-ubuntu-2404' || vars.LINUX_RUNNER || 'blacksmith-2vcpu-ubuntu-2404' }}
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout the check from the base branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          persist-credentials: false
          sparse-checkout: |
            scripts/ci/pr_capture_check.py
            scripts/cmux-next/media/path_map.py
          sparse-checkout-cone-mode: false

      # The paths this pull request changes, from git rather than the files API
      # (a call per 100 files on each of the check's events: every push, label
      # and description edit). The event's merge commit and its first parent,
      # the base, without blobs: two trees, read as data, never run. The files
      # API's `.filename` lists the paths the pull request adds, changes or
      # removes, a rename under its new name; so does this diff, with rename
      # detection on. It leaves out only a change the base already carries,
      # which merging changes nothing for. Any failure leaves `listed` unset,
      # and the next step reads the files API.
      - name: List the changed paths
        id: paths
        continue-on-error: true
        timeout-minutes: 2
        env:
          MERGE_SHA: ${{ github.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --quiet --depth=2 --filter=blob:none origin "$MERGE_SHA"
          # Only the merge of this head counts; a stale or one-parent commit reads the files API.
          [ "$(git rev-parse "$MERGE_SHA^2")" = "$HEAD_SHA" ]
          git diff --name-only -z -M "$MERGE_SHA^1" "$MERGE_SHA" | tr '\0' '\n' > "$RUNNER_TEMP/paths.txt"
          echo "listed=true" >> "$GITHUB_OUTPUT"

      - name: Check the description for a real capture
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BODY: ${{ github.event.pull_request.body }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          LISTED: ${{ steps.paths.outputs.listed }}
        run: |
          set -euo pipefail
          if [ ! -f scripts/ci/pr_capture_check.py ]; then
            # The pull request that adds the check: its base has no check to run yet.
            echo "::notice::The base branch has no scripts/ci/pr_capture_check.py yet; nothing to check."
            exit 0
          fi
          printf '%s' "$BODY" > "$RUNNER_TEMP/body.md"
          if [ "$LISTED" != true ]; then
            gh api --paginate "repos/$REPOSITORY/pulls/$PR/files?per_page=100" --jq '.[].filename' > "$RUNNER_TEMP/paths.txt"
          fi
          python3 scripts/ci/pr_capture_check.py --body-file "$RUNNER_TEMP/body.md" --paths-file "$RUNNER_TEMP/paths.txt" \
            --labels "$LABELS" --head-sha "$HEAD_SHA" --pr "$PR"

  # Keep PRs navigable without publishing internal gallery payloads. The detailed
  # visual evidence stays in the private HQ feed and Actions artifacts; the PR gets
  # one stable link to those surfaces, as the `review` line of its status comment
  # (scripts/ci/pr_status.py). It runs on every push (no paths filter) except a
  # base-only one, so the line names the PR's newest head with its own change. The
  # script comes from the base branch, never the pull request's code.
  link:
    # A draft gets its line when it is marked ready. CI_QUOTA_HOLD=1 pauses the
    # line while the GITHUB_TOKEN budget is reserved for the nightly
    # (tests/test_ci_quota_hold_gate.py); the next push writes it.
    needs: base-only
    if: ${{ !cancelled() && needs.base-only.outputs.base_only != 'true' && contains(fromJSON('["opened","synchronize","reopened","ready_for_review"]'), github.event.action) && vars.CI_QUOTA_HOLD != '1' && !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || contains(fromJSON('["ubuntu-24.04","blacksmith-2vcpu-ubuntu-2404","blacksmith-4vcpu-ubuntu-2404"]'), vars.CI_TRUSTED_RUNNER) && vars.CI_TRUSTED_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }} # ephemeral-required: trusted pull-request-write token; CI_TRUSTED_RUNNER picks Blacksmith (default) or GitHub-hosted
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout the status script from the base branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          persist-credentials: false
          sparse-checkout: scripts/ci/pr_status.py
          sparse-checkout-cone-mode: false

      - name: Update the PR's review line
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SERVER: ${{ github.server_url }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          FEED_URL: https://cmux-lawrences-mac-mini.tail137216.ts.net:18443/feed/
        run: |
          set -euo pipefail
          # The exact head, where its visual evidence is, its checks, and how to
          # get an app of it. No link to this run: it only writes the line, and
          # the HQ feed would read an Actions run link here as the PR's build.
          repo_url="$SERVER/$REPOSITORY"
          ref_query=$(jq -rn --arg q "branch:$HEAD_REF" '$q|@uri')
          # The branch keeps reload-build's cache warm; a name that is not
          # shell-safe to paste falls back to the exact SHA.
          build_ref=$HEAD_SHA
          if [[ "$HEAD_REF" =~ ^[A-Za-z0-9._/-]+$ ]]; then build_ref=$HEAD_REF; fi
          cat > "$RUNNER_TEMP/review.md" <<EOF
          Review [\`${HEAD_SHA:0:7}\`]($repo_url/commit/$HEAD_SHA): [HQ feed card](${FEED_URL}?pr=${PR}&view=all) · [gallery before/after runs]($repo_url/actions/workflows/gallery-advisory.yml?query=$ref_query) · [checks]($repo_url/pull/$PR/checks?sha=$HEAD_SHA)
          <details><summary>App of this head (app.zip, kept 1 day)</summary>

          \`gh workflow run reload-build.yml -R $REPOSITORY --ref feat-cmux-next -f tag=pr$PR -f ref=$build_ref -f platform=macos -f backend_mode=local\`
          </details>
          EOF
          python3 scripts/ci/pr_status.py set --repo "$REPOSITORY" --pr "$PR" --section review \
            --body-file "$RUNNER_TEMP/review.md" --legacy "<!-- cmux-gallery-link -->"

  # Warns when a feat-cmux-next pull request changes more than about 800 lines
  # (added + deleted), not counting the generated, lockfile, localization and
  # fixture paths in scripts/ci/pr_size_exclusions.json. The warning carries a
  # hint on how to split; a body line starting `Size:` with a reason overrides it
  # and the check prints the reason. It never fails for a size and is not a
  # required check: do not add it to branch protection or a ruleset.
  #
  # Cheap by design: one paginated pulls/N/files call with the read-only
  # GITHUB_TOKEN, the body from the event payload, and the script from the base
  # commit (sparse, no pull request code). Drafts skip until marked ready, and
  # CI_QUOTA_HOLD=1 pauses it while the token budget is reserved for the nightly
  # (tests/test_ci_quota_hold_gate.py).
  size:
    name: PR size (advisory)
    # A body edit only matters when it can add or drop a `Size:` line.
    needs: base-only
    if: ${{ !cancelled() && needs.base-only.outputs.base_only != 'true' && contains(fromJSON('["opened","synchronize","reopened","edited","ready_for_review"]'), github.event.action) && vars.CI_QUOTA_HOLD != '1' && !github.event.pull_request.draft && (github.event.action != 'edited' || github.event.changes.body != null) }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-4vcpu-ubuntu-2404' || vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out the size script from the base
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            scripts/ci/pr_size.py
            scripts/ci/pr_size_exclusions.json
          sparse-checkout-cone-mode: false

      - name: Count changed lines
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ ! -f scripts/ci/pr_size.py ]; then
            echo "::notice title=PR size::the base predates the size check; skipped"
            exit 0
          fi
          # Advisory: an API error (rate limit, outage) warns and passes, never fails.
          if ! gh api --paginate "repos/$REPOSITORY/pulls/$PR/files?per_page=100" \
            --jq '.[] | {filename, additions, deletions} | @json' > "$RUNNER_TEMP/files.jsonl"; then
            echo "::warning title=PR size::could not read the pull request's files; size not measured"
            exit 0
          fi
          python3 scripts/ci/pr_size.py --files "$RUNNER_TEMP/files.jsonl" --event "$GITHUB_EVENT_PATH" || {
            echo "::warning title=PR size::the size script failed; size not measured"
            exit 0
          }

  split:
    name: split-plan advisory
    needs: base-only
    if: ${{ !cancelled() && needs.base-only.outputs.base_only != 'true' && contains(fromJSON('["opened","synchronize","reopened"]'), github.event.action) }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-4vcpu-ubuntu-2404' || vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Fetch split refs without blobs
        run: git fetch --no-tags --filter=blob:none --unshallow origin
      # The classifier comes from the base: a head branched before the guard has no copy, and a
      # pull request should not grade itself with its own edits to the guard.
      - name: Report split metrics
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git show "$BASE_SHA:scripts/cmux-next/check-pr-split.py" > "$RUNNER_TEMP/check-pr-split.py"
          python3 "$RUNNER_TEMP/check-pr-split.py" --base "$BASE_SHA" --head "$HEAD_SHA" --mode advisory
