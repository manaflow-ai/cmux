name: CI PR closed

# cmux-next-pr-closed-cancel.yml's twin for ci.yml (display name CI): a merged or
# closed pull request's CI run ends when the pull request closes. The run joins
# that pull request's own CI concurrency group (ci.yml: `CI-refs/pull/<number>/merge`,
# the group of every opened, synchronize and reopened run) with cancel-in-progress,
# so GitHub cancels the run still in it; its one job never runs, so the close
# takes no runner.
#
# ci-queue-janitor.yml's stale pull request sweep only reads runs that hold a
# macOS pool, so a merged pull request's Linux jobs ran on: run 44326505154
# (#46403, merged 16:20Z on 2026-11-18) started its 12 react-apps-check shards
# and 2 base replays at 16:44Z, 24 minutes after the merge, and held 15 2-vCPU
# Blacksmith jobs past 17:05Z while the org vCPU cap starved every pool.
#
# Untouched: the dev-build run (its group ends in -dev-build), label-only runs
# into feat-cmux-next (their group ends in -label-<run id>), merge groups and
# dispatches (other refs). A pull request labelled no-janitor keeps its run, as
# the janitor's does. tests/test_ci_pr_runs_cancel_superseded.py checks that the
# group below is the one ci.yml gives this pull request's runs.
on:
  pull_request:
    types: [closed]

permissions: {}

concurrency:
  group: ${{ contains(github.event.pull_request.labels.*.name, 'no-janitor') && format('ci-pr-closed-kept-{0}', github.event.pull_request.number) || format('CI-refs/pull/{0}/merge', github.event.pull_request.number) }}
  cancel-in-progress: true

env:
  # Temporary REST budget attribution: one gh-call line per GitHub API call (scripts/ci/api_call_log/env.sh, fetched at a fixed commit when the checkout has no copy).
  BASH_ENV: '$({ w="${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh"; t="${RUNNER_TEMP:-/nonexistent}/api-call-log-src"; if [ -f "$w" ]; then echo "$w"; elif [ -n "${RUNNER_TEMP:-}" ]; then if [ ! -f "$t/env.sh" ] && [ ! -e "$t.tried" ] && { [ "${RUNNER_OS:-}" = Linux ] || [ "${RUNNER_OS:-}" = macOS ]; } && [ "$(date -u +%Y%m%d%H)" -lt 2026112300 ]; then : > "$t.tried"; mkdir -p "$t.part" && for x in env.sh gh sitecustomize.py isolated.py; do curl -fsSL --max-time 5 -o "$t.part/$x" "https://raw.githubusercontent.com/manaflow-ai/cmux/27647ffd3ae838c63be28ca3e5883dcd68c34518/scripts/ci/api_call_log/$x" || break; done; [ -s "$t.part/isolated.py" ] && mv "$t.part" "$t"; fi; if [ -f "$t/env.sh" ]; then echo "$t/env.sh"; else echo unset BASH_ENV > "$t.off.sh" && echo "$t.off.sh"; fi; fi; } 2>/dev/null)'

jobs:
  cancelled:
    # The run's concurrency group does the work when the run is created; this
    # job is here because a workflow needs one. Every run of this workflow is a
    # closed event, so it is always skipped and never takes a runner.
    if: github.event.action != 'closed'
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || 'blacksmith-4vcpu-ubuntu-2404' }} # frozen-label: credentialed job, frozen to today's label
    timeout-minutes: 1
    steps:
      - run: "true"
