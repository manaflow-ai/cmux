name: Namespace autofix

# Lives on main: GitHub takes a pull_request_target workflow from the default
# branch whatever the pull request's base, so the feat-cmux-next copy never ran.
# The lint, its helpers and its baselines are still the feat-cmux-next base's:
# the job checks out the pull request's base commit and restores every helper
# from it, never from main. Only feat-cmux-next pull requests run it, as before
# (main never had this workflow). This copy is the one that runs, so change it
# here.
on:
  pull_request_target:
    branches: [feat-cmux-next]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "Packages/**/*.swift"
      - "ios/cmux/**/*.swift"
      - "scripts/lint-ios-package-conventions.sh"
      - "scripts/lint_swift_namespaces.py"
      - "scripts/swift_source_mask.py"
      - "scripts/lint-namespace-types-baseline.txt"
      - "scripts/lint-namespace-types-ratchet.txt"
      - "scripts/lint-ios-package-conventions-baseline.txt"
      - ".github/workflows/namespace-autofix.yml"

permissions:
  contents: read

concurrency:
  group: namespace-autofix-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # Temporary REST budget attribution: one gh-call line per GitHub API call (scripts/ci/api_call_log/env.sh, fetched at a fixed commit when the checkout has no copy).
  BASH_ENV: '$({ w="${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh"; t="${RUNNER_TEMP:-/nonexistent}/api-call-log-src"; if [ -f "$w" ]; then echo "$w"; elif [ -n "${RUNNER_TEMP:-}" ]; then if [ ! -f "$t/env.sh" ] && [ ! -e "$t.tried" ] && { [ "${RUNNER_OS:-}" = Linux ] || [ "${RUNNER_OS:-}" = macOS ]; } && [ "$(date -u +%Y%m%d%H)" -lt 2026112300 ]; then : > "$t.tried"; mkdir -p "$t.part" && for x in env.sh gh sitecustomize.py isolated.py; do curl -fsSL --max-time 5 -o "$t.part/$x" "https://raw.githubusercontent.com/manaflow-ai/cmux/27647ffd3ae838c63be28ca3e5883dcd68c34518/scripts/ci/api_call_log/$x" || break; done; [ -s "$t.part/isolated.py" ] && mv "$t.part" "$t"; fi; if [ -f "$t/env.sh" ]; then echo "$t/env.sh"; else echo unset BASH_ENV > "$t.off.sh" && echo "$t.off.sh"; fi; fi; } 2>/dev/null)'

jobs:
  autofix:
    name: namespace autofix
    environment: ci-routing-agent
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && !github.event.pull_request.draft
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || 'cmux-gcp-secret-jit-x64' }}
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read
    steps:
      # This workflow is pull_request_target on purpose. Only this base-revision
      # copy of the helper is executed; the PR tree is treated as data.
      - name: Checkout trusted base helpers
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          # One commit each: the job reads base files, diffs two trees and commits on the PR head, none of
          # which needs history. fetch-depth: 0 fetched every branch and tag of the repo and ran past
          # timeout-minutes in this step (2026-11-16).
          fetch-depth: 1
          persist-credentials: false

      # The App's installation may not grant contents: write (it refused with
      # a 422 on #23518). Without a token the job warns and skips; the
      # conventions lint still reports violations, as warnings only while
      # CMUX_NEXT_STYLE_GUARDS is warn.
      - name: Mint scoped write token
        id: app-token
        if: vars.GLAEDA_ROUTE_APP_ID != ''
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.GLAEDA_ROUTE_APP_ID }}
          private-key: ${{ secrets.GLAEDA_ROUTE_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Fix safe namespace violations
        id: fix
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          # Reads go through the job's own token: the App installation's quota is
          # shared with every other App caller and ran dry mid-job (cmux#57591,
          # "API rate limit exceeded"). Only the push needs the App token.
          READ_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          # A listing the job token's spent budget refused is sent again once, after the reset, when that is at most
          # this far off: the wait, the lint (about 3 min on a large PR) and the push fit inside timeout-minutes.
          RATE_LIMIT_WAIT_S: '300'
        run: |
          set -euo pipefail
          if [ -z "$APP_TOKEN" ]; then
            echo "::warning::Namespace autofix skipped: no write token (the App is not configured, or its installation does not grant contents: write)."
            exit 0
          fi

          # Every git network call goes through git_retry: a transient server answer
          # ("fatal: protocol error: bad pack header", jobs 140171550533, 140171553343
          # and 140171797930 at 21:13Z on 2026-11-26) failed the first fetch of three
          # jobs at once. Four tries, 5, 15 and 30 s apart (under a minute in all).
          # None of these spend REST quota: git over HTTPS is not rate limited
          # like the API.
          git_retry() {
            local attempt=1 delay
            for delay in 5 15 30; do
              "$@" && return 0
              echo "::warning::git attempt $attempt failed ($*); retrying in ${delay}s."
              sleep "$delay"
              attempt=$((attempt + 1))
            done
            "$@"
          }

          git_retry git fetch --no-tags --depth=1 origin "+refs/pull/${{ github.event.pull_request.number }}/head:refs/remotes/pr/head"
          fetched_head="$(git rev-parse refs/remotes/pr/head)"
          [ "$fetched_head" = "$HEAD_SHA" ] || {
            echo "::error::Fetched PR head $fetched_head does not match event head $HEAD_SHA"
            exit 1
          }
          # Never run hooks from a reused checkout: the PR tree is untrusted.
          git -c core.hooksPath=/dev/null checkout --detach "$HEAD_SHA"

          workspace="$(pwd -P)"
          assert_safe_path() {
            local path="$1" component="$1" real
            while [ "$component" != "." ] && [ "$component" != "/" ]; do
              if [ -L "$component" ]; then
                echo "::error::Refusing symlinked PR path: $path"
                exit 1
              fi
              component="$(dirname "$component")"
            done
            real="$(realpath -e -- "$path" 2>/dev/null || true)"
            case "$real" in
              "$workspace"/*) ;;
              *) echo "::error::Refusing path outside the checkout: $path"; exit 1 ;;
            esac
          }

          # Replace all of scripts/ with the trusted base's before inspecting PR
          # source, not only the files below: Python imports from the running
          # script's own directory first, so a PR file such as
          # scripts/argparse.py would run inside the lint with the token. No
          # PR-controlled script is executed here.
          rm -rf -- scripts
          git archive "$BASE_SHA" scripts | tar -x
          for path in \
            scripts/lint-ios-package-conventions.sh \
            scripts/lint_swift_namespaces.py \
            scripts/swift_source_mask.py \
            scripts/lint-namespace-types-baseline.txt \
            scripts/lint-namespace-types-ratchet.txt \
            scripts/lint-ios-package-conventions-baseline.txt; do
            assert_safe_path "$(dirname "$path")"
            [ ! -L "$path" ] || { echo "::error::Refusing symlinked helper path: $path"; exit 1; }
            git show "$BASE_SHA:$path" > "$path"
          done

          # The PR's own files (GitHub's merge-base diff), never `git diff BASE_SHA
          # HEAD_SHA`: that two-dot diff against base's tip also lists every file
          # base changed since the branch point, and the fix then rewrote and
          # pushed the PR's stale copies of them (#55382). The API's list is the
          # first source. github.token's quota is the repo's, shared with every
          # job here, and it ran dry too ("API rate limit exceeded for
          # installation", cmux#58259 at 18:17Z and 18:30Z on 2026-11-26), so a
          # failed listing falls back to git: deepen both depth-1 histories until
          # they meet and diff from their merge base, the same three-dot diff.
          # A listing the budget refused (403/429, core remaining 0) is first sent
          # again once, after the reset, when that is at most RATE_LIMIT_WAIT_S
          # away: the git fallback found no merge base within 8500 commits on
          # runs 45924331840 (01:45:47Z) and 45965901335 (08:28:43Z) on
          # 2026-11-27, red until a rerun after the reset
          # (tests/test_ci_namespace_autofix_rate_limit_wait.py).
          listed="$RUNNER_TEMP/namespace-listed.txt"
          list_err="$RUNNER_TEMP/namespace-listed.err"
          list_files() {
            GH_TOKEN="$READ_TOKEN" gh api --paginate \
              "repos/$GITHUB_REPOSITORY/pulls/${{ github.event.pull_request.number }}/files?per_page=100" \
              --jq '.[] | select(.status != "removed") | .filename' > "$listed" 2> "$list_err"
          }
          # The core budget's reset epoch when the last listing was a quota refusal, else nothing
          # (rate_limit reads spend no budget).
          refused_until() {
            grep -qiE 'rate limit|HTTP 429' "$list_err" || return 0
            GH_TOKEN="$READ_TOKEN" gh api rate_limit \
              --jq 'select(.resources.core.remaining == 0) | .resources.core.reset' 2>/dev/null || true
          }
          listed_ok=""
          reset=""
          if list_files; then
            listed_ok=1
          else
            cat "$list_err" >&2
            reset="$(refused_until)"
            if [ -n "$reset" ]; then
              wait=$(( reset - $(date +%s) + 5 ))
              [ "$wait" -ge 1 ] || wait=1
              if [ "$wait" -le "$RATE_LIMIT_WAIT_S" ]; then
                echo "::notice::The budget refused the PR's file listing; listing again in ${wait}s, after the reset at $(date -u -d "@$reset" +%H:%M:%SZ)."
                sleep "$wait"
                if list_files; then
                  listed_ok=1
                else
                  cat "$list_err" >&2
                  reset="$(refused_until)"
                fi
              else
                echo "::warning::The budget refused the PR's file listing; its reset ($(date -u -d "@$reset" +%H:%M:%SZ)) is past the ${RATE_LIMIT_WAIT_S}s wait."
              fi
            fi
          fi
          if [ -z "$listed_ok" ]; then
            echo "::warning::Listing the PR's files through the API failed (see above); using git's merge-base diff instead."
            merge_base=""
            fetch_failed=""
            for deepen in 100 400 1600 6400; do
              merge_base="$(git merge-base "$BASE_SHA" "$HEAD_SHA" 2>/dev/null || true)"
              [ -z "$merge_base" ] || break
              # One fetch per side: given both at once, git deepened only one of them.
              # The head goes through refs/pull/N/head, as above: a fork PR's raw
              # head SHA may not be fetchable from origin.
              if ! git_retry git fetch --no-tags --quiet --deepen="$deepen" origin "$BASE_SHA"; then
                fetch_failed="deepening base $BASE_SHA by $deepen"; break
              fi
              if ! git_retry git fetch --no-tags --quiet --deepen="$deepen" origin "+refs/pull/${{ github.event.pull_request.number }}/head:refs/remotes/pr/head"; then
                fetch_failed="deepening the PR head by $deepen"; break
              fi
            done
            [ -n "$merge_base" ] || merge_base="$(git merge-base "$BASE_SHA" "$HEAD_SHA" 2>/dev/null || true)"
            if [ -z "$merge_base" ]; then
              # Refuse, never skip: a skipped autofix would read as clean.
              if [ -n "$fetch_failed" ]; then
                echo "::error::Both sources of the PR's files failed: the API listing (above) and git, whose fetch failed while $fetch_failed (above). Rerun the job."
              else
                rerun="once the API quota resets"
                [ -z "$reset" ] || rerun="after $(date -u -d "@$reset" +%H:%M:%SZ), when the API quota resets"
                echo "::error::Both sources of the PR's files failed: the API listing (above) and git, which found no merge base of $BASE_SHA and $HEAD_SHA within 8500 commits. Rerun $rerun."
              fi
              exit 1
            fi
            echo "Merge base: $merge_base"
            # quotePath off: git otherwise prints non-ASCII paths quoted and
            # escaped ("Packages/\303\251.swift"), which the API never does and
            # the Packages/ filter below would silently drop.
            git -c core.quotePath=false diff --no-renames --name-only --diff-filter=d "$merge_base" "$HEAD_SHA" > "$listed"
          fi
          awk '/^(Packages|ios\/cmux)\/.*\.swift$/ { print }' "$listed" \
            | sort -u > "$RUNNER_TEMP/namespace-files.txt"
          if [ ! -s "$RUNNER_TEMP/namespace-files.txt" ]; then
            echo "No changed package Swift files; namespace autofix is clean."
            exit 0
          fi
          while IFS= read -r path; do
            assert_safe_path "$path"
            [ -f "$path" ] || { echo "::error::Changed Swift path is not a regular file: $path"; exit 1; }
          done < "$RUNNER_TEMP/namespace-files.txt"

          set +e
          bash scripts/lint-ios-package-conventions.sh --namespace-fix \
            --files-from "$RUNNER_TEMP/namespace-files.txt" \
            > "$RUNNER_TEMP/namespace-lint.log" 2>&1
          lint_status=$?
          set -e

          git add --pathspec-from-file="$RUNNER_TEMP/namespace-files.txt"
          if git diff --cached --quiet; then
            if [ "$lint_status" -ne 0 ]; then
              echo "::error::Namespace lint still has violations that the safe fixer cannot rewrite."
              grep -E '^(ERROR|WARN|FAIL|error:)' "$RUNNER_TEMP/namespace-lint.log" || cat "$RUNNER_TEMP/namespace-lint.log"
              echo "Run ./scripts/lint-ios-package-conventions.sh --namespace-fix locally and repair the remaining declarations." >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            echo "Namespace autofix found no edits."
            exit 0
          fi

          git config user.name "cmux namespace autofix"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -c core.hooksPath=/dev/null commit -m "lint: apply namespace autofix"
          auth="$(printf 'x-access-token:%s' "$APP_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          GIT_CONFIG_COUNT=1 \
          GIT_CONFIG_KEY_0="http.https://github.com/.extraheader" \
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" \
            git_retry git -c core.hooksPath=/dev/null push --quiet "https://github.com/$GITHUB_REPOSITORY.git" "HEAD:refs/heads/$HEAD_REF"
          echo "Applied safe namespace fixes and pushed lint: apply namespace autofix." >> "$GITHUB_STEP_SUMMARY"

          if [ "$lint_status" -ne 0 ]; then
            echo "::error::Namespace autofix pushed safe edits, but non-rewritable violations remain."
            grep -E '^(ERROR|WARN|FAIL|error:)' "$RUNNER_TEMP/namespace-lint.log" || true
            exit 1
          fi
