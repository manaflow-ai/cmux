name: Namespace autofix

# Lives on main: GitHub takes a pull_request_target workflow from the default
# branch whatever the pull request's base, so the feat-cmux-next copy never ran.
# The lint, its helpers and its baselines are still the feat-cmux-next base's:
# the job checks out the pull request's base commit and restores every helper
# from it, never from main. Only feat-cmux-next pull requests run it, as before
# (main never had this workflow). This copy is the one that runs, so change it
# here.
on:
  pull_request_target:
    branches: [feat-cmux-next]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "Packages/**/*.swift"
      - "ios/cmux/**/*.swift"
      - "scripts/lint-ios-package-conventions.sh"
      - "scripts/lint_swift_namespaces.py"
      - "scripts/swift_source_mask.py"
      - "scripts/lint-namespace-types-baseline.txt"
      - "scripts/lint-namespace-types-ratchet.txt"
      - "scripts/lint-ios-package-conventions-baseline.txt"
      - ".github/workflows/namespace-autofix.yml"

permissions:
  contents: read

concurrency:
  group: namespace-autofix-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # Temporary REST budget attribution: one gh-call line per GitHub API call (scripts/ci/api_call_log/env.sh, fetched at a fixed commit when the checkout has no copy).
  BASH_ENV: '$({ w="${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh"; t="${RUNNER_TEMP:-/nonexistent}/api-call-log-src"; if [ -f "$w" ]; then echo "$w"; elif [ -n "${RUNNER_TEMP:-}" ]; then if [ ! -f "$t/env.sh" ] && [ ! -e "$t.tried" ] && { [ "${RUNNER_OS:-}" = Linux ] || [ "${RUNNER_OS:-}" = macOS ]; } && [ "$(date -u +%Y%m%d%H)" -lt 2026112300 ]; then : > "$t.tried"; mkdir -p "$t.part" && for x in env.sh gh sitecustomize.py isolated.py; do curl -fsSL --max-time 5 -o "$t.part/$x" "https://raw.githubusercontent.com/manaflow-ai/cmux/27647ffd3ae838c63be28ca3e5883dcd68c34518/scripts/ci/api_call_log/$x" || break; done; [ -s "$t.part/isolated.py" ] && mv "$t.part" "$t"; fi; if [ -f "$t/env.sh" ]; then echo "$t/env.sh"; else echo unset BASH_ENV > "$t.off.sh" && echo "$t.off.sh"; fi; fi; } 2>/dev/null)'

jobs:
  autofix:
    name: namespace autofix
    environment: ci-routing-agent
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && !github.event.pull_request.draft
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || contains(fromJSON('["blacksmith-2vcpu-ubuntu-2404","blacksmith-4vcpu-ubuntu-2404","blacksmith-8vcpu-ubuntu-2404","cmux-gcp-secret-jit-x64"]'), vars.CI_TRUSTED_RUNNER) && vars.CI_TRUSTED_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # This workflow is pull_request_target on purpose. Only this base-revision
      # copy of the helper is executed; the PR tree is treated as data.
      - name: Checkout trusted base helpers
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          # One commit each: the job reads base files, diffs two trees and commits on the PR head, none of
          # which needs history. fetch-depth: 0 fetched every branch and tag of the repo and ran past
          # timeout-minutes in this step (2026-11-16).
          fetch-depth: 1
          persist-credentials: false

      # The App's installation may not grant contents: write (it refused with
      # a 422 on #23518). Without a token the job warns and skips; the
      # conventions lint still reports violations, as warnings only while
      # CMUX_NEXT_STYLE_GUARDS is warn.
      - name: Mint scoped write token
        id: app-token
        if: vars.GLAEDA_ROUTE_APP_ID != ''
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.GLAEDA_ROUTE_APP_ID }}
          private-key: ${{ secrets.GLAEDA_ROUTE_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Fix safe namespace violations
        id: fix
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if [ -z "$APP_TOKEN" ]; then
            echo "::warning::Namespace autofix skipped: no write token (the App is not configured, or its installation does not grant contents: write)."
            exit 0
          fi

          git fetch --no-tags --depth=1 origin "+refs/pull/${{ github.event.pull_request.number }}/head:refs/remotes/pr/head"
          fetched_head="$(git rev-parse refs/remotes/pr/head)"
          [ "$fetched_head" = "$HEAD_SHA" ] || {
            echo "::error::Fetched PR head $fetched_head does not match event head $HEAD_SHA"
            exit 1
          }
          # Never run hooks from a reused checkout: the PR tree is untrusted.
          git -c core.hooksPath=/dev/null checkout --detach "$HEAD_SHA"

          workspace="$(pwd -P)"
          assert_safe_path() {
            local path="$1" component="$1" real
            while [ "$component" != "." ] && [ "$component" != "/" ]; do
              if [ -L "$component" ]; then
                echo "::error::Refusing symlinked PR path: $path"
                exit 1
              fi
              component="$(dirname "$component")"
            done
            real="$(realpath -e -- "$path" 2>/dev/null || true)"
            case "$real" in
              "$workspace"/*) ;;
              *) echo "::error::Refusing path outside the checkout: $path"; exit 1 ;;
            esac
          }

          # Replace all of scripts/ with the trusted base's before inspecting PR
          # source, not only the files below: Python imports from the running
          # script's own directory first, so a PR file such as
          # scripts/argparse.py would run inside the lint with the token. No
          # PR-controlled script is executed here.
          rm -rf -- scripts
          git archive "$BASE_SHA" scripts | tar -x
          for path in \
            scripts/lint-ios-package-conventions.sh \
            scripts/lint_swift_namespaces.py \
            scripts/swift_source_mask.py \
            scripts/lint-namespace-types-baseline.txt \
            scripts/lint-namespace-types-ratchet.txt \
            scripts/lint-ios-package-conventions-baseline.txt; do
            assert_safe_path "$(dirname "$path")"
            [ ! -L "$path" ] || { echo "::error::Refusing symlinked helper path: $path"; exit 1; }
            git show "$BASE_SHA:$path" > "$path"
          done

          git diff --name-only --diff-filter=ACMR "$BASE_SHA" "$HEAD_SHA" \
            | awk '/^(Packages|ios\/cmux)\/.*\.swift$/ { print }' \
            | sort -u > "$RUNNER_TEMP/namespace-files.txt"
          if [ ! -s "$RUNNER_TEMP/namespace-files.txt" ]; then
            echo "No changed package Swift files; namespace autofix is clean."
            exit 0
          fi
          while IFS= read -r path; do
            assert_safe_path "$path"
            [ -f "$path" ] || { echo "::error::Changed Swift path is not a regular file: $path"; exit 1; }
          done < "$RUNNER_TEMP/namespace-files.txt"

          set +e
          bash scripts/lint-ios-package-conventions.sh --namespace-fix \
            --files-from "$RUNNER_TEMP/namespace-files.txt" \
            > "$RUNNER_TEMP/namespace-lint.log" 2>&1
          lint_status=$?
          set -e

          git add --pathspec-from-file="$RUNNER_TEMP/namespace-files.txt"
          if git diff --cached --quiet; then
            if [ "$lint_status" -ne 0 ]; then
              echo "::error::Namespace lint still has violations that the safe fixer cannot rewrite."
              grep -E '^(ERROR|WARN|FAIL|error:)' "$RUNNER_TEMP/namespace-lint.log" || cat "$RUNNER_TEMP/namespace-lint.log"
              echo "Run ./scripts/lint-ios-package-conventions.sh --namespace-fix locally and repair the remaining declarations." >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            echo "Namespace autofix found no edits."
            exit 0
          fi

          git config user.name "cmux namespace autofix"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -c core.hooksPath=/dev/null commit -m "lint: apply namespace autofix"
          auth="$(printf 'x-access-token:%s' "$APP_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          GIT_CONFIG_COUNT=1 \
          GIT_CONFIG_KEY_0="http.https://github.com/.extraheader" \
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" \
            git -c core.hooksPath=/dev/null push --quiet "https://github.com/$GITHUB_REPOSITORY.git" "HEAD:refs/heads/$HEAD_REF"
          echo "Applied safe namespace fixes and pushed lint: apply namespace autofix." >> "$GITHUB_STEP_SUMMARY"

          if [ "$lint_status" -ne 0 ]; then
            echo "::error::Namespace autofix pushed safe edits, but non-rewritable violations remain."
            grep -E '^(ERROR|WARN|FAIL|error:)' "$RUNNER_TEMP/namespace-lint.log" || true
            exit 1
          fi
