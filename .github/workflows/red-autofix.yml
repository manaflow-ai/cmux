name: red-autofix

# One autofix path for every red on main, feat-cmux-next and the nightly (nightly-next).
# Leo, 2026-11-25, after the NEXT nightly was red for 5 h on three breaks nothing fixed:
# "what about autofix? and faster autofixes".
#
# When a watched workflow's run fails on one of those branches (workflow_run fires only from main's copy of
# this file, for runs on any branch):
#
#   triage         what broke, which merge (scripts/ci/red_autofix.py triage). An infrastructure red (no
#                  repository file named, a known transient) gets its failed jobs rerun once.
#   fix            a Claude run that may only read and edit files makes the smallest mechanical fix-forward on
#                  the target's tip (nightly-next's target is feat-cmux-next); opened as autofix/red-<key>.
#   revert         beside it, when the culprit is confirmed: its revert on the tip, opened as revert/pr-N (the
#                  name post-merge batch and fixit-handoff use). A core teammate's revert opens held.
#   verify-*       the red's own check on each candidate (bun scripts the log ran, cargo check of the crates the
#                  errors name, actionlint), in a job with no secrets; a red with no local check (Swift) waits
#                  for the pull request's own checks.
#   land-*         the first one verified green merges (squash, pinned to the verified head); the other closes.
#
# vars.RED_AUTOFIX: 0 turns it off; `pr` opens the pull requests and never merges. On by default.
# ci-compile-attribution.yml keeps main's Swift compile (Seed DerivedData, Main compile probe).

on:
  workflow_run:
    workflows:
      # Every name is a workflow file on main (SOURCE_WORKFLOW_PATHS below); runs on any of the three branches.
      - CI fast guards
      - CI main full suite
      - Web validation
      - cmux-tui artifacts
      - cmux-tui SDKs
      - cmux-tui spec inventory
      - Localization catalog structure
      - cmux skill contracts
      - Cloud CLI
      - coderouter CLI
      - SSH remote daemon
      - IROH v2
      - Nightly macOS build
      - cmux-next
      - cmux-next-ios kit tests
      - iOS simulator tests
    types: [completed]
    branches: [main, feat-cmux-next, nightly-next]
  workflow_dispatch:
    inputs:
      run_id:
        description: The failed run to fix (another fixer's hand-off, or a demo on an old red).
        required: true
        type: string

permissions:
  contents: read

env:
  # The files behind the trigger's display names (tests/test_ci_workflow_run_sources.py).
  SOURCE_WORKFLOW_PATHS: .github/workflows/ci-fast-guards.yml .github/workflows/ci-main-full-suite.yml .github/workflows/web-validation.yml .github/workflows/cmux-tui-artifacts.yml .github/workflows/cmux-tui-sdks.yml .github/workflows/cmux-tui-spec.yml .github/workflows/localization-catalog.yml .github/workflows/cmux-skill-contract.yml .github/workflows/cmux-cloud-cli.yml .github/workflows/coderouter-ci.yml .github/workflows/remote-daemon.yml .github/workflows/iroh-v2.yml .github/workflows/nightly.yml .github/workflows/cmux-next.yml .github/workflows/cmux-next-ios-kit.yml .github/workflows/test-ios.yml

# One triage per red workflow and branch at a time; a newer red of the same pair replaces a pending one, which
# loses nothing because triage reads that branch's newest red afresh.
concurrency:
  group: red-autofix-${{ github.event.workflow_run.path || 'dispatch' }}-${{ github.event.workflow_run.head_branch || inputs.run_id }}
  cancel-in-progress: false

jobs:
  triage:
    name: Triage the red
    if: ${{ (vars.RED_AUTOFIX || 'on') != '0' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'timed_out') }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || contains(fromJSON('["blacksmith-4vcpu-ubuntu-2404","blacksmith-8vcpu-ubuntu-2404","blacksmith-16vcpu-ubuntu-2404","blacksmith-32vcpu-ubuntu-2404"]'), vars.LINUX_RUNNER) && vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
      pull-requests: read
    outputs:
      action: ${{ steps.triage.outputs.action }}
      target: ${{ steps.triage.outputs.target }}
      key: ${{ steps.triage.outputs.key }}
      lang: ${{ steps.triage.outputs.lang }}
      revert: ${{ steps.triage.outputs.revert }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - name: Fetch the base branches
        run: git fetch --quiet --filter=blob:none https://github.com/${{ github.repository }}.git +refs/heads/feat-cmux-next:refs/remotes/origin/feat-cmux-next +refs/heads/nightly-next:refs/remotes/origin/nightly-next +refs/heads/main:refs/remotes/origin/main
      - name: Triage
        id: triage
        env:
          GH_TOKEN: ${{ github.token }}
          RED_AUTOFIX: ${{ vars.RED_AUTOFIX }}
          RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
        run: |
          git remote set-url origin "https://github.com/$GITHUB_REPOSITORY.git"
          python3 scripts/ci/red_autofix.py triage --run "$RUN_ID" --out "$RUNNER_TEMP/report.json"
      - name: Rerun an infrastructure red once
        if: ${{ steps.triage.outputs.action == 'rerun' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
        run: gh run rerun "$RUN_ID" --failed --repo "$GITHUB_REPOSITORY" || echo "::warning::rerun refused"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: red-report
          path: ${{ runner.temp }}/report.json
          retention-days: 14

  revert:
    name: Open the revert
    needs: triage
    if: ${{ needs.triage.outputs.action == 'fix' && needs.triage.outputs.revert == 'true' }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || contains(fromJSON('["blacksmith-4vcpu-ubuntu-2404","blacksmith-8vcpu-ubuntu-2404","blacksmith-16vcpu-ubuntu-2404","blacksmith-32vcpu-ubuntu-2404"]'), vars.LINUX_RUNNER) && vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      number: ${{ steps.open.outputs.number }}
      sha: ${{ steps.open.outputs.sha }}
      action: ${{ steps.open.outputs.action }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.triage.outputs.target }}
          fetch-depth: 200
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: red-report
          path: ${{ runner.temp }}/red
      - name: Mint the pull request token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.GLAEDA_ROUTE_APP_ID }}
          private-key: ${{ secrets.GLAEDA_ROUTE_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
          permission-workflows: write
      - name: Revert the culprit on the tip
        id: open
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          sha="$(python3 -I -c 'import json,sys; print(json.load(open(sys.argv[1]))["culprit"]["sha"])' "$RUNNER_TEMP/red/report.json")"
          git fetch --quiet --depth=2 origin "$sha" || true
          auth="$(printf 'x-access-token:%s' "$APP_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.https://github.com/.extraheader" GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
          python3 -I scripts/ci/red_autofix.py open --report "$RUNNER_TEMP/red/report.json" --kind revert \
            --push-url "https://github.com/$GITHUB_REPOSITORY.git"

  fix:
    name: Fix forward
    needs: triage
    if: ${{ needs.triage.outputs.action == 'fix' }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.CI_REPAIR_SKIP_FLEET != '1' && 'cmux-gcp-repair-jit-x64' || contains(fromJSON('["blacksmith-2vcpu-ubuntu-2404","blacksmith-4vcpu-ubuntu-2404","blacksmith-8vcpu-ubuntu-2404","cmux-gcp-secret-jit-x64"]'), vars.CI_TRUSTED_RUNNER) && vars.CI_TRUSTED_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }} # ephemeral-required: holds the Claude token and the PR App key; CI_TRUSTED_RUNNER picks the Blacksmith size
    timeout-minutes: 25
    permissions:
      contents: read
    outputs:
      number: ${{ steps.open.outputs.number }}
      sha: ${{ steps.open.outputs.sha }}
      action: ${{ steps.open.outputs.action }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.triage.outputs.target }}
          fetch-depth: 200
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: red-report
          path: ${{ runner.temp }}/red
      # Read and Edit only, in a copy of the tracked files with no .git (ci-compile-attribution.yml says why);
      # only its edits to tracked files come back.
      - name: Ask the fixer for a mechanical fix
        id: fixer
        continue-on-error: true
        timeout-minutes: 15
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -euo pipefail
          culprit="$(python3 -I -c 'import json,sys; print((json.load(open(sys.argv[1])).get("culprit") or {}).get("sha",""))' "$RUNNER_TEMP/red/report.json")"
          [ -z "$culprit" ] || git fetch --quiet --depth=2 "https://github.com/$GITHUB_REPOSITORY.git" "$culprit" || true
          npm install --global --no-fund --no-audit @anthropic-ai/claude-code@2.1.284 >/dev/null
          python3 -I scripts/ci/red_autofix.py prompt --report "$RUNNER_TEMP/red/report.json" --out "$RUNNER_TEMP/prompt.txt"
          schema='{"type":"object","properties":{"mechanical":{"type":"boolean"},"summary":{"type":"string"}},"required":["mechanical","summary"]}'
          tree="$RUNNER_TEMP/fixer-tree"
          mkdir -p "$tree"
          git ls-files -z > "$RUNNER_TEMP/tracked.z"
          tar --null -T "$RUNNER_TEMP/tracked.z" -cf - | tar -xf - -C "$tree"
          touch "$RUNNER_TEMP/fixer-start"
          (cd "$tree" && claude -p "$(cat "$RUNNER_TEMP/prompt.txt")" \
            --allowedTools "Read,Edit,Glob,Grep" \
            --disallowedTools "Bash,WebFetch,WebSearch,Edit(.git/**),Write(.git/**)" \
            --max-turns 40 --output-format json --json-schema "$schema") > "$RUNNER_TEMP/fixer.json"
          (cd "$tree" && find . -type f -newer "$RUNNER_TEMP/fixer-start" -print0) | while IFS= read -r -d '' path; do
            path="${path#./}"
            grep -qxzF -- "$path" "$RUNNER_TEMP/tracked.z" || continue
            [ -f "$path" ] && [ ! -L "$path" ] || continue
            cp -- "$tree/$path" "$path"
          done
          python3 -I - "$RUNNER_TEMP/fixer.json" <<'PY' >> "$GITHUB_OUTPUT"
          import json, sys
          data = json.load(open(sys.argv[1]))
          out = data.get("structured_output") or {}
          if not out:
              try:
                  out = json.loads(data.get("result") or "{}")
              except ValueError:
                  out = {}
          print(f"mechanical={'true' if out.get('mechanical') is True else 'false'}")
          print("summary=" + " ".join(str(out.get("summary") or "").split())[:400])
          PY
      - name: Mint the pull request token
        id: app-token
        if: ${{ steps.fixer.outputs.mechanical == 'true' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.GLAEDA_ROUTE_APP_ID }}
          private-key: ${{ secrets.GLAEDA_ROUTE_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
          permission-workflows: write
      # Untracked files go first (a module the fixer added must not be imported); git runs with no hook,
      # fsmonitor or global config.
      - name: Open the fix-forward
        id: open
        if: ${{ steps.app-token.outputs.token != '' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          SUMMARY: ${{ steps.fixer.outputs.summary }}
        run: |
          set -euo pipefail
          git clean -ffdxq
          auth="$(printf 'x-access-token:%s' "$APP_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          export GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1
          export GIT_CONFIG_COUNT=3 GIT_CONFIG_KEY_0="http.https://github.com/.extraheader" GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" \
            GIT_CONFIG_KEY_1=core.hooksPath GIT_CONFIG_VALUE_1=/dev/null GIT_CONFIG_KEY_2=core.fsmonitor GIT_CONFIG_VALUE_2=false
          python3 -I scripts/ci/red_autofix.py open --report "$RUNNER_TEMP/red/report.json" --kind fix \
            --push-url "https://github.com/$GITHUB_REPOSITORY.git" --summary "${SUMMARY:-}"

  # The candidates' own code runs here (bun install, build scripts): no secret, a read-only token.
  verify-fix:
    name: Verify the fix-forward
    needs: [triage, fix]
    if: ${{ needs.fix.outputs.action == 'opened' }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.CI_OVERFLOW_LINUX || 'cmux-linux' }}
    timeout-minutes: 50
    permissions:
      contents: read
      checks: read
    outputs:
      green: ${{ steps.verify.outputs.green }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          sparse-checkout: scripts/ci/red_autofix.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      # The candidate and its parent (the target's tip): a check already red on the tip is not this red's.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.fix.outputs.sha }}
          path: cand
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: red-report
          path: ${{ runner.temp }}/red
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        if: ${{ needs.triage.outputs.lang == 'ts' }}
        with:
          bun-version: 1.4.4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        if: ${{ needs.triage.outputs.lang == 'rust' }}
        with:
          toolchain: stable
      - name: Install actionlint
        if: ${{ needs.triage.outputs.lang == 'workflow' }}
        run: bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7 "$RUNNER_TEMP/bin" && echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Run the red's own check
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.fix.outputs.sha }}
        run: python3 -I scripts/ci/red_autofix.py verify --report "$RUNNER_TEMP/red/report.json" --repo-dir cand --kind fix --sha "$SHA"

  verify-revert:
    name: Verify the revert
    needs: [triage, revert]
    if: ${{ needs.revert.outputs.action == 'opened' }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.CI_OVERFLOW_LINUX || 'cmux-linux' }}
    timeout-minutes: 50
    permissions:
      contents: read
      checks: read
    outputs:
      green: ${{ steps.verify.outputs.green }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          sparse-checkout: scripts/ci/red_autofix.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      # The candidate and its parent (the target's tip): a check already red on the tip is not this red's.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.revert.outputs.sha }}
          path: cand
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: red-report
          path: ${{ runner.temp }}/red
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        if: ${{ needs.triage.outputs.lang == 'ts' }}
        with:
          bun-version: 1.4.4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        if: ${{ needs.triage.outputs.lang == 'rust' }}
        with:
          toolchain: stable
      - name: Install actionlint
        if: ${{ needs.triage.outputs.lang == 'workflow' }}
        run: bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7 "$RUNNER_TEMP/bin" && echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Run the red's own check
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.revert.outputs.sha }}
        run: python3 -I scripts/ci/red_autofix.py verify --report "$RUNNER_TEMP/red/report.json" --repo-dir cand --kind revert --sha "$SHA"

  land-fix:
    name: Land the fix-forward
    needs: [triage, fix, verify-fix]
    if: ${{ needs.verify-fix.outputs.green == 'true' }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || contains(fromJSON('["blacksmith-4vcpu-ubuntu-2404","blacksmith-8vcpu-ubuntu-2404","blacksmith-16vcpu-ubuntu-2404","blacksmith-32vcpu-ubuntu-2404"]'), vars.LINUX_RUNNER) && vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 10
    concurrency:
      group: red-autofix-land-${{ needs.triage.outputs.key }}
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          sparse-checkout: scripts/ci/red_autofix.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: red-report
          path: ${{ runner.temp }}/red
      - name: Mint the merge token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.GLAEDA_ROUTE_APP_ID }}
          private-key: ${{ secrets.GLAEDA_ROUTE_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
          permission-workflows: write
      - name: Merge if first
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RED_AUTOFIX: ${{ vars.RED_AUTOFIX }}
        run: python3 -I scripts/ci/red_autofix.py land --report "$RUNNER_TEMP/red/report.json" --kind fix --pr "${{ needs.fix.outputs.number }}" --sha "${{ needs.fix.outputs.sha }}"

  land-revert:
    name: Land the revert
    needs: [triage, revert, verify-revert]
    if: ${{ needs.verify-revert.outputs.green == 'true' }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || contains(fromJSON('["blacksmith-4vcpu-ubuntu-2404","blacksmith-8vcpu-ubuntu-2404","blacksmith-16vcpu-ubuntu-2404","blacksmith-32vcpu-ubuntu-2404"]'), vars.LINUX_RUNNER) && vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 10
    concurrency:
      group: red-autofix-land-${{ needs.triage.outputs.key }}
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          sparse-checkout: scripts/ci/red_autofix.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: red-report
          path: ${{ runner.temp }}/red
      - name: Mint the merge token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.GLAEDA_ROUTE_APP_ID }}
          private-key: ${{ secrets.GLAEDA_ROUTE_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
          permission-workflows: write
      - name: Merge if first
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RED_AUTOFIX: ${{ vars.RED_AUTOFIX }}
        run: python3 -I scripts/ci/red_autofix.py land --report "$RUNNER_TEMP/red/report.json" --kind revert --pr "${{ needs.revert.outputs.number }}" --sha "${{ needs.revert.outputs.sha }}"

  tell-culprit:
    name: Tell the culprit's pull request
    needs: [triage, fix, revert]
    if: ${{ always() && !cancelled() && needs.triage.outputs.action == 'fix' && needs.triage.outputs.revert == 'true' }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || contains(fromJSON('["blacksmith-4vcpu-ubuntu-2404","blacksmith-8vcpu-ubuntu-2404","blacksmith-16vcpu-ubuntu-2404","blacksmith-32vcpu-ubuntu-2404"]'), vars.LINUX_RUNNER) && vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          sparse-checkout: scripts/ci/red_autofix.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: red-report
          path: ${{ runner.temp }}/red
      - name: Comment
        env:
          GH_TOKEN: ${{ github.token }}
          FIX: ${{ needs.fix.outputs.number && format('#{0}', needs.fix.outputs.number) || '' }}
          REVERT: ${{ needs.revert.outputs.number && format('#{0}', needs.revert.outputs.number) || '' }}
        run: python3 -I scripts/ci/red_autofix.py comment --report "$RUNNER_TEMP/red/report.json" --fix "$FIX" --revert "$REVERT"
