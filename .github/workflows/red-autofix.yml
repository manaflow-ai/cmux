name: red-autofix

# One autofix path for every red on main, feat-cmux-next and the nightly (nightly-next).
# Leo, 2026-11-25, after the NEXT nightly was red for 5 h on three breaks nothing fixed:
# "what about autofix? and faster autofixes".
#
# When a watched workflow's run fails on one of those branches (workflow_run fires only from main's copy of
# this file, for runs on any branch):
#
#   triage         what broke, which merge (scripts/ci/red_autofix.py triage), read at the attempt that fired.
#                  An infrastructure red (no repository file named, a known transient) gets its failed jobs rerun.
#   fix            a Claude run that may only read and edit files makes the smallest mechanical fix-forward in a
#                  plain copy of the target's tip (nightly-next's target is feat-cmux-next). Its job holds no
#                  pull request credential; only its tracked-file diff leaves it, as a patch artifact.
#   open-fix       on a fresh runner, the trusted helper (this workflow's own commit, github.workflow_sha) applies
#                  that patch to a fresh checkout of the same tip and opens autofix/red-<key>. No fixer-written
#                  file, git config or hook runs here.
#   revert         beside it, when the culprit is confirmed: its revert on the tip, opened as revert/pr-N (the
#                  name post-merge batch and fixit-handoff use). A core teammate's revert opens held.
#   verify-*       the red's own check on the tip and on each candidate, as a separate uid under env -i (the
#                  helper's Sandbox): the red must reproduce on the tip and its failures must clear. Only the
#                  helper writes the verdict; no isolation, no green. A red with no local check (Swift) waits for
#                  the red's own checks on the pull request.
#   land-*         the first one verified green merges (squash, pinned to the verified head and the verified
#                  base); the other closes. Each writes an elapsed receipt (detected, triaged, pushed, verified,
#                  landed) to its step summary and the red-receipt-* artifact.
#
# vars.RED_AUTOFIX: 0 turns it off; `pr` opens the pull requests and never merges. On by default.
# ci-compile-attribution.yml keeps main's Swift compile (Seed DerivedData, Main compile probe).

on:
  workflow_run:
    workflows:
      # Every name is a workflow file on main (SOURCE_WORKFLOW_PATHS below); runs on any of the three branches.
      - CI fast guards
      - CI main full suite
      - Web validation
      - cmux-tui artifacts
      - cmux-tui SDKs
      - cmux-tui spec inventory
      - Localization catalog structure
      - cmux skill contracts
      - Cloud CLI
      - coderouter CLI
      - SSH remote daemon
      - IROH v2
      - Nightly macOS build
      - cmux-next
      - cmux-next-ios kit tests
      - iOS simulator tests
    types: [completed]
    branches: [main, feat-cmux-next, nightly-next]
  workflow_dispatch:
    inputs:
      run_id:
        description: The failed run to fix (another fixer's hand-off, or a demo on an old red).
        required: true
        type: string

permissions:
  contents: read

env:
  # The files behind the trigger's display names (tests/test_ci_workflow_run_sources.py).
  SOURCE_WORKFLOW_PATHS: .github/workflows/ci-fast-guards.yml .github/workflows/ci-main-full-suite.yml .github/workflows/web-validation.yml .github/workflows/cmux-tui-artifacts.yml .github/workflows/cmux-tui-sdks.yml .github/workflows/cmux-tui-spec.yml .github/workflows/localization-catalog.yml .github/workflows/cmux-skill-contract.yml .github/workflows/cmux-cloud-cli.yml .github/workflows/coderouter-ci.yml .github/workflows/remote-daemon.yml .github/workflows/iroh-v2.yml .github/workflows/nightly.yml .github/workflows/cmux-next.yml .github/workflows/cmux-next-ios-kit.yml .github/workflows/test-ios.yml

# One group per red run and attempt, so a red never replaces another pending red. Two reds of one incident meet
# in open-<key> (one candidate at a time) and in the land group; triage's stale_or_stop and open's head+base
# lookup keep them to one pull request.
concurrency:
  group: red-autofix-run-${{ github.event.workflow_run.id || inputs.run_id }}-${{ github.event.workflow_run.run_attempt || github.run_attempt }}
  cancel-in-progress: false

jobs:
  triage:
    name: Triage the red
    if: ${{ (vars.RED_AUTOFIX || 'on') != '0' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'timed_out') }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || contains(fromJSON('["blacksmith-4vcpu-ubuntu-2404","blacksmith-8vcpu-ubuntu-2404","blacksmith-16vcpu-ubuntu-2404","blacksmith-32vcpu-ubuntu-2404"]'), vars.LINUX_RUNNER) && vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
      pull-requests: read
    outputs:
      action: ${{ steps.triage.outputs.action }}
      target: ${{ steps.triage.outputs.target }}
      key: ${{ steps.triage.outputs.key }}
      lang: ${{ steps.triage.outputs.lang }}
      revert: ${{ steps.triage.outputs.revert }}
      regen: ${{ steps.triage.outputs.regen }}
      run: ${{ steps.triage.outputs.run }}
      red: ${{ steps.triage.outputs.red }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - name: Fetch the base branches
        run: git fetch --quiet --filter=blob:none https://github.com/${{ github.repository }}.git +refs/heads/feat-cmux-next:refs/remotes/origin/feat-cmux-next +refs/heads/nightly-next:refs/remotes/origin/nightly-next +refs/heads/main:refs/remotes/origin/main
      - name: Triage
        id: triage
        env:
          GH_TOKEN: ${{ github.token }}
          RED_AUTOFIX: ${{ vars.RED_AUTOFIX }}
          RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          git remote set-url origin "https://github.com/$GITHUB_REPOSITORY.git"
          python3 scripts/ci/red_autofix.py triage --run "$RUN_ID" --attempt "$RUN_ATTEMPT" --out "$RUNNER_TEMP/report.json"
      - name: Rerun an infrastructure red once
        if: ${{ steps.triage.outputs.action == 'rerun' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
        run: gh run rerun "$RUN_ID" --failed --repo "$GITHUB_REPOSITORY" || echo "::warning::rerun refused"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: red-report
          path: ${{ runner.temp }}/report.json
          retention-days: 14

  revert:
    name: Open the revert
    needs: triage
    if: ${{ needs.triage.outputs.action == 'fix' && needs.triage.outputs.revert == 'true' }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || contains(fromJSON('["blacksmith-4vcpu-ubuntu-2404","blacksmith-8vcpu-ubuntu-2404","blacksmith-16vcpu-ubuntu-2404","blacksmith-32vcpu-ubuntu-2404"]'), vars.LINUX_RUNNER) && vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 10
    concurrency:
      group: red-autofix-open-${{ needs.triage.outputs.key }}-revert
      cancel-in-progress: false
    permissions:
      contents: read
    outputs:
      number: ${{ steps.open.outputs.number }}
      sha: ${{ steps.open.outputs.sha }}
      action: ${{ steps.open.outputs.action }}
      pushed_at: ${{ steps.open.outputs.pushed_at }}
    steps:
      # The helper at this workflow's own commit, never the target's or a candidate's copy.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted
          sparse-checkout: scripts/ci/red_autofix.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.triage.outputs.target }}
          path: fresh
          fetch-depth: 200
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: red-report
          path: ${{ runner.temp }}/red
      - name: Mint the pull request token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.GLAEDA_ROUTE_APP_ID }}
          private-key: ${{ secrets.GLAEDA_ROUTE_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
          permission-workflows: write
      - name: Revert the culprit on the tip
        id: open
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          sha="$(python3 -I -c 'import json,sys; print(json.load(open(sys.argv[1]))["culprit"]["sha"])' "$RUNNER_TEMP/red/report.json")"
          git -C fresh fetch --quiet --depth=2 "https://github.com/$GITHUB_REPOSITORY.git" "$sha" || true
          auth="$(printf 'x-access-token:%s' "$APP_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          export GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1
          export GIT_CONFIG_COUNT=3 GIT_CONFIG_KEY_0="http.https://github.com/.extraheader" GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" \
            GIT_CONFIG_KEY_1=core.hooksPath GIT_CONFIG_VALUE_1=/dev/null GIT_CONFIG_KEY_2=core.fsmonitor GIT_CONFIG_VALUE_2=false
          python3 -I trusted/scripts/ci/red_autofix.py open --report "$RUNNER_TEMP/red/report.json" --repo-dir fresh --kind revert \
            --push-url "https://github.com/$GITHUB_REPOSITORY.git"

  # No pull request credential here: the fixer's edits leave this job only as a tracked-file patch.
  fix:
    name: Fix forward
    needs: triage
    if: ${{ needs.triage.outputs.action == 'fix' }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.CI_REPAIR_SKIP_FLEET != '1' && 'cmux-gcp-repair-jit-x64' || contains(fromJSON('["blacksmith-2vcpu-ubuntu-2404","blacksmith-4vcpu-ubuntu-2404","blacksmith-8vcpu-ubuntu-2404","cmux-gcp-secret-jit-x64"]'), vars.CI_TRUSTED_RUNNER) && vars.CI_TRUSTED_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }} # ephemeral-required: holds the Claude token; CI_TRUSTED_RUNNER picks the Blacksmith size
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    outputs:
      tip: ${{ steps.patch.outputs.tip }}
      ready: ${{ steps.patch.outputs.ready }}
      summary: ${{ steps.fixer.outputs.summary || steps.regen.outputs.summary }}
    steps:
      # The helper at this workflow's own commit, never the target's or a candidate's copy.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted
          sparse-checkout: scripts/ci/red_autofix.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.triage.outputs.target }}
          path: target
          fetch-depth: 200
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: red-report
          path: ${{ runner.temp }}/red
      # Deterministic first: a red that uploads its own fix (the regenerated files) needs no model call.
      - name: Download the red's regenerated files
        if: ${{ needs.triage.outputs.regen != '' }}
        continue-on-error: true
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ${{ needs.triage.outputs.regen }}
          run-id: ${{ needs.triage.outputs.run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/regen
      - name: Copy the regenerated files onto the tip
        id: regen
        if: ${{ needs.triage.outputs.regen != '' }}
        run: |
          git -C target fetch --quiet --depth=1 "https://github.com/$GITHUB_REPOSITORY.git" "${{ needs.triage.outputs.red }}" || true
          python3 -I trusted/scripts/ci/red_autofix.py regen --report "$RUNNER_TEMP/red/report.json" --repo-dir target --files "$RUNNER_TEMP/regen" \
            --patch-out "$RUNNER_TEMP/fix.patch"
      # Read and Edit only, in a plain copy of the tracked files with no .git (ci-compile-attribution.yml says why).
      - name: Ask the fixer for a mechanical fix
        id: fixer
        if: ${{ steps.regen.outputs.applied != 'true' }}
        continue-on-error: true
        timeout-minutes: 15
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -euo pipefail
          culprit="$(python3 -I -c 'import json,sys; print((json.load(open(sys.argv[1])).get("culprit") or {}).get("sha",""))' "$RUNNER_TEMP/red/report.json")"
          [ -z "$culprit" ] || git -C target fetch --quiet --depth=2 "https://github.com/$GITHUB_REPOSITORY.git" "$culprit" || true
          npm install --global --no-fund --no-audit @anthropic-ai/claude-code@2.1.284 >/dev/null
          python3 -I trusted/scripts/ci/red_autofix.py prompt --report "$RUNNER_TEMP/red/report.json" --repo-dir target --out "$RUNNER_TEMP/prompt.txt"
          schema='{"type":"object","properties":{"mechanical":{"type":"boolean"},"summary":{"type":"string"}},"required":["mechanical","summary"]}'
          tree="$RUNNER_TEMP/fixer-tree"
          mkdir -p "$tree"
          git -C target ls-files -z > "$RUNNER_TEMP/tracked.z"
          (cd target && tar --null -T "$RUNNER_TEMP/tracked.z" -cf -) | tar -xf - -C "$tree"
          (cd "$tree" && claude -p "$(cat "$RUNNER_TEMP/prompt.txt")" \
            --allowedTools "Read,Edit,Glob,Grep" \
            --disallowedTools "Bash,WebFetch,WebSearch" \
            --max-turns 40 --output-format json --json-schema "$schema") > "$RUNNER_TEMP/fixer.json" \
            2> "$RUNNER_TEMP/fixer.err" || echo "red-autofix: the fixer exited $?: $(tail -c 600 "$RUNNER_TEMP/fixer.err")" | tee -a "$GITHUB_STEP_SUMMARY"
          [ -s "$RUNNER_TEMP/fixer.json" ] || echo '{}' > "$RUNNER_TEMP/fixer.json"
          python3 -I trusted/scripts/ci/red_autofix.py diff --repo-dir target --tree "$tree" --out "$RUNNER_TEMP/fix.patch" > /dev/null
          python3 -I - "$RUNNER_TEMP/fixer.json" <<'PY' >> "$GITHUB_OUTPUT"
          import json, sys
          data = json.load(open(sys.argv[1]))
          if data.get("is_error") or data.get("subtype", "success") != "success":
              print(f"red-autofix: the fixer ended {data.get('subtype')}: {str(data.get('result'))[:300]}", file=sys.stderr)
          out = data.get("structured_output") or {}
          if not out:
              try:
                  out = json.loads(data.get("result") or "{}")
              except ValueError:
                  out = {}
          print(f"mechanical={'true' if out.get('mechanical') is True else 'false'}")
          print("summary=" + " ".join(str(out.get("summary") or "").split())[:400])
          PY
      - name: Hand the patch over
        id: patch
        env:
          MECHANICAL: ${{ steps.fixer.outputs.mechanical }}
          REGEN: ${{ steps.regen.outputs.applied }}
        run: |
          echo "tip=$(git -C target rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [ -s "$RUNNER_TEMP/fix.patch" ] && { [ "$REGEN" = true ] || [ "$MECHANICAL" = true ]; }; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "red-autofix: no mechanical fix to open." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ steps.patch.outputs.ready == 'true' }}
        with:
          name: red-fix-patch
          path: ${{ runner.temp }}/fix.patch
          retention-days: 14

  # A fresh runner where no fixer-written file, config or hook exists: the patch goes onto a fresh checkout of the
  # same tip and the trusted helper opens it.
  open-fix:
    name: Open the fix-forward
    needs: [triage, fix]
    if: ${{ needs.fix.outputs.ready == 'true' }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || contains(fromJSON('["blacksmith-4vcpu-ubuntu-2404","blacksmith-8vcpu-ubuntu-2404","blacksmith-16vcpu-ubuntu-2404","blacksmith-32vcpu-ubuntu-2404"]'), vars.LINUX_RUNNER) && vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 10
    concurrency:
      group: red-autofix-open-${{ needs.triage.outputs.key }}-fix
      cancel-in-progress: false
    permissions:
      contents: read
    outputs:
      number: ${{ steps.open.outputs.number }}
      sha: ${{ steps.open.outputs.sha }}
      action: ${{ steps.open.outputs.action }}
      pushed_at: ${{ steps.open.outputs.pushed_at }}
    steps:
      # The helper at this workflow's own commit, never the target's or a candidate's copy.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted
          sparse-checkout: scripts/ci/red_autofix.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.fix.outputs.tip }}
          path: fresh
          fetch-depth: 200
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: red-report
          path: ${{ runner.temp }}/red
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: red-fix-patch
          path: ${{ runner.temp }}/patch
      - name: Apply the patch
        run: |
          GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 git -c core.hooksPath=/dev/null -c core.fsmonitor=false \
            -C fresh apply --index --binary "$RUNNER_TEMP/patch/fix.patch"
      - name: Mint the pull request token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.GLAEDA_ROUTE_APP_ID }}
          private-key: ${{ secrets.GLAEDA_ROUTE_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
          permission-workflows: write
      - name: Open the fix-forward
        id: open
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          SUMMARY: ${{ needs.fix.outputs.summary }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$APP_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          export GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1
          export GIT_CONFIG_COUNT=3 GIT_CONFIG_KEY_0="http.https://github.com/.extraheader" GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" \
            GIT_CONFIG_KEY_1=core.hooksPath GIT_CONFIG_VALUE_1=/dev/null GIT_CONFIG_KEY_2=core.fsmonitor GIT_CONFIG_VALUE_2=false
          python3 -I trusted/scripts/ci/red_autofix.py open --report "$RUNNER_TEMP/red/report.json" --repo-dir fresh --kind fix \
            --push-url "https://github.com/$GITHUB_REPOSITORY.git" --summary "${SUMMARY:-}"

  verify-fix:
    name: Verify the fix-forward
    needs: [triage, open-fix]
    if: ${{ needs.open-fix.outputs.action == 'opened' }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.CI_OVERFLOW_LINUX || 'cmux-linux' }}
    timeout-minutes: 50
    permissions:
      contents: read
      checks: read
    outputs:
      green: ${{ steps.verify.outputs.green }}
      base: ${{ steps.verify.outputs.base }}
      verified_at: ${{ steps.verify.outputs.verified_at }}
    steps:
      # The helper at this workflow's own commit, never the target's or a candidate's copy.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted
          sparse-checkout: scripts/ci/red_autofix.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      # The candidate and its parent (the target's tip). The helper exports both trees out of this checkout and
      # runs them as its sandbox uid; nothing in them runs as the runner user.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.open-fix.outputs.sha }}
          path: cand
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: red-report
          path: ${{ runner.temp }}/red
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        if: ${{ needs.triage.outputs.lang == 'ts' }}
        with:
          bun-version: 1.4.4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        if: ${{ needs.triage.outputs.lang == 'rust' }}
        with:
          toolchain: stable
      - name: Install actionlint
        if: ${{ needs.triage.outputs.lang == 'workflow' }}
        run: bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7 "$RUNNER_TEMP/bin" && echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Run the red's own check
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.open-fix.outputs.sha }}
          PUSHED_AT: ${{ needs.open-fix.outputs.pushed_at }}
        run: python3 -I trusted/scripts/ci/red_autofix.py verify --report "$RUNNER_TEMP/red/report.json" --repo-dir cand --kind fix --sha "$SHA" --pushed-at "$PUSHED_AT"

  verify-revert:
    name: Verify the revert
    needs: [triage, revert]
    if: ${{ needs.revert.outputs.action == 'opened' }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.CI_OVERFLOW_LINUX || 'cmux-linux' }}
    timeout-minutes: 50
    permissions:
      contents: read
      checks: read
    outputs:
      green: ${{ steps.verify.outputs.green }}
      base: ${{ steps.verify.outputs.base }}
      verified_at: ${{ steps.verify.outputs.verified_at }}
    steps:
      # The helper at this workflow's own commit, never the target's or a candidate's copy.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted
          sparse-checkout: scripts/ci/red_autofix.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      # The candidate and its parent (the target's tip). The helper exports both trees out of this checkout and
      # runs them as its sandbox uid; nothing in them runs as the runner user.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.revert.outputs.sha }}
          path: cand
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: red-report
          path: ${{ runner.temp }}/red
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        if: ${{ needs.triage.outputs.lang == 'ts' }}
        with:
          bun-version: 1.4.4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        if: ${{ needs.triage.outputs.lang == 'rust' }}
        with:
          toolchain: stable
      - name: Install actionlint
        if: ${{ needs.triage.outputs.lang == 'workflow' }}
        run: bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7 "$RUNNER_TEMP/bin" && echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Run the red's own check
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.revert.outputs.sha }}
          PUSHED_AT: ${{ needs.revert.outputs.pushed_at }}
        run: python3 -I trusted/scripts/ci/red_autofix.py verify --report "$RUNNER_TEMP/red/report.json" --repo-dir cand --kind revert --sha "$SHA" --pushed-at "$PUSHED_AT"

  land-fix:
    name: Land the fix-forward
    needs: [triage, open-fix, verify-fix]
    if: ${{ needs.verify-fix.outputs.green == 'true' }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || contains(fromJSON('["blacksmith-4vcpu-ubuntu-2404","blacksmith-8vcpu-ubuntu-2404","blacksmith-16vcpu-ubuntu-2404","blacksmith-32vcpu-ubuntu-2404"]'), vars.LINUX_RUNNER) && vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 10
    concurrency:
      group: red-autofix-land-${{ needs.triage.outputs.key }}
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      # The helper at this workflow's own commit, never the target's or a candidate's copy.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted
          sparse-checkout: scripts/ci/red_autofix.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: red-report
          path: ${{ runner.temp }}/red
      - name: Mint the merge token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.GLAEDA_ROUTE_APP_ID }}
          private-key: ${{ secrets.GLAEDA_ROUTE_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
          permission-workflows: write
      # Pinned to the verified head and the verified base; no merge or arm while the sibling is armed or merged.
      - name: Merge if first
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RED_AUTOFIX: ${{ vars.RED_AUTOFIX }}
          PR: ${{ needs.open-fix.outputs.number }}
          SHA: ${{ needs.open-fix.outputs.sha }}
          BASE: ${{ needs.verify-fix.outputs.base }}
          PUSHED_AT: ${{ needs.open-fix.outputs.pushed_at }}
          VERIFIED_AT: ${{ needs.verify-fix.outputs.verified_at }}
        run: |
          python3 -I trusted/scripts/ci/red_autofix.py land --report "$RUNNER_TEMP/red/report.json" --kind fix --pr "$PR" --sha "$SHA" \
            --base "$BASE" --pushed-at "$PUSHED_AT" --verified-at "$VERIFIED_AT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          name: red-receipt-fix
          path: ${{ runner.temp }}/red/report.json
          retention-days: 30

  land-revert:
    name: Land the revert
    needs: [triage, revert, verify-revert]
    if: ${{ needs.verify-revert.outputs.green == 'true' }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || contains(fromJSON('["blacksmith-4vcpu-ubuntu-2404","blacksmith-8vcpu-ubuntu-2404","blacksmith-16vcpu-ubuntu-2404","blacksmith-32vcpu-ubuntu-2404"]'), vars.LINUX_RUNNER) && vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 10
    concurrency:
      group: red-autofix-land-${{ needs.triage.outputs.key }}
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      # The helper at this workflow's own commit, never the target's or a candidate's copy.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted
          sparse-checkout: scripts/ci/red_autofix.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: red-report
          path: ${{ runner.temp }}/red
      - name: Mint the merge token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.GLAEDA_ROUTE_APP_ID }}
          private-key: ${{ secrets.GLAEDA_ROUTE_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
          permission-workflows: write
      # Pinned to the verified head and the verified base; no merge or arm while the sibling is armed or merged.
      - name: Merge if first
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RED_AUTOFIX: ${{ vars.RED_AUTOFIX }}
          PR: ${{ needs.revert.outputs.number }}
          SHA: ${{ needs.revert.outputs.sha }}
          BASE: ${{ needs.verify-revert.outputs.base }}
          PUSHED_AT: ${{ needs.revert.outputs.pushed_at }}
          VERIFIED_AT: ${{ needs.verify-revert.outputs.verified_at }}
        run: |
          python3 -I trusted/scripts/ci/red_autofix.py land --report "$RUNNER_TEMP/red/report.json" --kind revert --pr "$PR" --sha "$SHA" \
            --base "$BASE" --pushed-at "$PUSHED_AT" --verified-at "$VERIFIED_AT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          name: red-receipt-revert
          path: ${{ runner.temp }}/red/report.json
          retention-days: 30

  tell-culprit:
    name: Tell the culprit's pull request
    needs: [triage, open-fix, revert]
    if: ${{ always() && !cancelled() && needs.triage.outputs.action == 'fix' && needs.triage.outputs.revert == 'true' }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || contains(fromJSON('["blacksmith-4vcpu-ubuntu-2404","blacksmith-8vcpu-ubuntu-2404","blacksmith-16vcpu-ubuntu-2404","blacksmith-32vcpu-ubuntu-2404"]'), vars.LINUX_RUNNER) && vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      # The helper at this workflow's own commit, never the target's or a candidate's copy.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted
          sparse-checkout: scripts/ci/red_autofix.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: red-report
          path: ${{ runner.temp }}/red
      - name: Comment
        env:
          GH_TOKEN: ${{ github.token }}
          FIX: ${{ needs.open-fix.outputs.number && format('#{0}', needs.open-fix.outputs.number) || '' }}
          REVERT: ${{ needs.revert.outputs.number && format('#{0}', needs.revert.outputs.number) || '' }}
        run: python3 -I trusted/scripts/ci/red_autofix.py comment --report "$RUNNER_TEMP/red/report.json" --fix "$FIX" --revert "$REVERT"
