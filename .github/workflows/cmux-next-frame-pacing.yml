name: cmux-next frame pacing

# Fling bench of the cmux-next agent pane at 120 Hz, started by the perf cron on idle fleet time. The minis' own
# displays are 60 Hz, so the bench adds a 120 Hz virtual display
# (scripts/ci/frame-pacing/vdisplay.m, the private CGVirtualDisplay API) and
# measures the pane at both render rates: capped (CMUX_NEXT_AGENT_PANE_FULL_RATE=0,
# WebKit's near-60 fps preference) and full (=1). The numbers, and any past the
# thresholds in scripts/ci/frame-pacing/summarize.py, go to the run summary.
#
# It gates nothing: no required check reads it, and a slow night only adds a
# warning annotation. It runs on an owned mini or not at all: `gate` asks the
# E2E pool picker whether an owned Mac is free now (as iroh-release-gate's
# `runner` does) and skips the run otherwise, and the build and the bench take
# the runner selected by that gate. All suites retain the exclusive GUI token:
# even fling-only runs create a virtual display in the shared console session.
# A configured session lane is not selected without the pool's availability check.
#
# The same bench job then runs the golden interactions (scripts/ci/frame-pacing/golden.sh
# and golden.py, cx-codh2): New Tab cold and warm, sidebar collapse and expand, transcript
# follow while a reply streams, a live window resize, and the Reduce Motion path, each with
# its animated property sampled once per display frame. A scenario whose animation did not
# run (too few intermediate frames, or one frame carrying most of the travel) fails the
# judge step, which is continue-on-error: it warns and gates nothing. `suites: golden`
# runs them alone, with their own build tag and a concurrency group per ref, so it never
# displaces the nightly run; cmux-next-motion-golden.yml dispatches that for pull requests
# into feat-cmux-next that touch the measured paths.

on:
  # No schedule (Lawrence 2026-10-23: nothing perf-related slows a nightly or a dev build): the perf cron
  # (cmux-next-perf-budgets.yml) starts this at most once in 24 h, only when no nightly or dev build waits
  # for a Mac; cmux-next-motion-golden.yml starts golden-only runs for labeled pull requests.
  workflow_dispatch:
    inputs:
      ref:
        description: Branch of this repository to build and measure
        required: false
        default: feat-cmux-next
        type: string
      flings:
        description: Measured flings per render rate
        required: false
        default: "3"
        type: string
      suites:
        description: "What to run: fling, golden (the golden interactions), both, instant (Cmd-N/T/D/Shift-D key to frame, idle and loaded), or perf (cold and warm launch, browser tab memory at 1/10/20 tabs)"
        required: false
        default: fling,golden
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  # One bench at a time: every run uses the same tag, socket and console session. A
  # golden-only run (a pull request's) has a tag and a group per ref, where a newer push
  # supersedes the older run and other branches' runs never cancel its build.
  group: ${{ (inputs.suites == 'golden' || inputs.suites == 'instant' || inputs.suites == 'perf') && format('cmux-next-frame-pacing-{0}-{1}', inputs.suites, inputs.ref) || 'cmux-next-frame-pacing' }}
  cancel-in-progress: ${{ inputs.suites == 'golden' || inputs.suites == 'instant' || inputs.suites == 'perf' }}

env:
  SUITES: ${{ inputs.suites || 'fling,golden' }}

jobs:
  resolve-ref:
    if: github.repository == 'manaflow-ai/cmux'
    uses: ./.github/workflows/resolve-dispatch-ref.yml
    with:
      ref: ${{ inputs.ref || 'feat-cmux-next' }}

  gate:
    environment: ci-routing-agent
    needs: resolve-ref
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
      tag: ${{ steps.tag.outputs.tag }}
      runner: ${{ steps.decide.outputs.runner }}
    steps:
      # The tagged app's baked tag (its debug socket is /tmp/cmux-debug-<tag>.sock). A
      # golden-only run's is per ref: reload-build.yml cancels an older build of the same tag.
      - name: Name the build tag
        id: tag
        env:
          SUITES_INPUT: ${{ inputs.suites }}
          REF_INPUT: ${{ inputs.ref }}
        run: |
          tag=frame-pacing
          if [ "$SUITES_INPUT" = golden ] || [ "$SUITES_INPUT" = instant ] || [ "$SUITES_INPUT" = perf ]; then
            slug="$(printf '%s' "$REF_INPUT" | tr '[:upper:]' '[:lower:]' | sed -E -e 's/[^a-z0-9]+/-/g' | cut -c1-32 | sed -E -e 's/^-+//' -e 's/-+$//')"
            # The checksum keeps two refs that share a 32-character prefix on their own tags.
            sum="$(printf '%s' "$REF_INPUT" | cksum | cut -d' ' -f1)"
            tag="$SUITES_INPUT-${slug:-feat}-${sum}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # Only this repository's own branch heads may run on an owned Mac
      # (resolve-dispatch-ref.yml's trusted_ref), as for the side lanes.
      - name: Checkout pool helper
        if: github.run_attempt == 1 && vars.CI_PR_POOL_OWNED == '1' && vars.CI_SIDE_LANE_RUNNER != '' && needs.resolve-ref.outputs.trusted_ref == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: |
            scripts/ci/e2e_runner_pool.py
            scripts/ci/pr_runner_pool.py
            scripts/ci/simple_pool_picker.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Mint the owned-pool routing token
        id: route-token
        # As in iroh-release-gate.yml: idle owned runners read live. Any
        # failure leaves the token empty and the janitor snapshot decides.
        if: github.run_attempt == 1 && vars.CI_PR_POOL_OWNED == '1' && vars.CI_SIDE_LANE_RUNNER != '' && needs.resolve-ref.outputs.trusted_ref == 'true' && vars.GLAEDA_ROUTE_APP_ID != ''
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.GLAEDA_ROUTE_APP_ID }}
          private-key: ${{ secrets.GLAEDA_ROUTE_APP_KEY }}
          permission-administration: read
          permission-organization-self-hosted-runners: read

      - name: Mint the routing token without the org permission
        id: route-token-repo
        if: steps.route-token.outcome == 'failure'
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.GLAEDA_ROUTE_APP_ID }}
          private-key: ${{ secrets.GLAEDA_ROUTE_APP_KEY }}
          permission-administration: read

      - name: Run only while an owned Mac is free
        id: decide
        env:
          # Even fling creates a virtual display and needs a drawing console.
          CMUX_CI_GUI_REQUIRED: 'true'
          GH_TOKEN: ${{ github.token }}
          ROUTE_TOKEN: ${{ steps.route-token.outputs.token || steps.route-token-repo.outputs.token }}
          GH_REPO: ${{ github.repository }}
          POOL_ORDER: ${{ vars.CI_PR_POOL_ORDER }}
          POOL_MAX_QUEUED: ${{ vars.CI_PR_POOL_MAX_QUEUED }}
          POOL_OWNED: ${{ vars.CI_PR_POOL_OWNED }}
          OWNED_SLOTS: ${{ vars.CI_OWNED_POOL_SLOTS }}
          PR_XCODE_APP: ${{ vars.CMUX_CI_XCODE_APP_PR }}
          SIDE_LANE: ${{ vars.CI_SIDE_LANE_RUNNER }}
          TRUSTED_REF: ${{ needs.resolve-ref.outputs.trusted_ref }}
        run: |
          set -uo pipefail
          label=""
          if [ "$GITHUB_RUN_ATTEMPT" = 1 ] && [ "$POOL_OWNED" = 1 ] && [ -n "$SIDE_LANE" ] && [ "$TRUSTED_REF" = true ]; then
            label="$(python3 scripts/ci/e2e_runner_pool.py \
              --requested auto \
              --order "$POOL_ORDER" \
              --max-queued "$POOL_MAX_QUEUED" \
              --owned "$POOL_OWNED" \
              --owned-slots "$OWNED_SLOTS" \
              --pr-xcode-app "$PR_XCODE_APP")" || label=""
          fi
          case "$label" in
            glaeda-*)
              echo "run=true" >> "$GITHUB_OUTPUT"
              echo "runner=$label" >> "$GITHUB_OUTPUT"
              echo "An owned Mac is free ($label); the build and bench take the picked runner." ;;
            *)
              echo "run=false" >> "$GITHUB_OUTPUT"
              reason="no owned Mac free now (picker said '${label:-nothing}')"
              [ "$GITHUB_RUN_ATTEMPT" = 1 ] || reason="a re-run never takes an owned Mac"
              [ "$TRUSTED_REF" = true ] || reason="the ref is not a branch head of this repository"
              [ "$POOL_OWNED" = 1 ] && [ -n "$SIDE_LANE" ] || reason="owned pools are off (CI_PR_POOL_OWNED, CI_SIDE_LANE_RUNNER)"
              echo "::notice title=Agent pane frame pacing::Skipped: $reason."
              printf '## Agent pane frame pacing\n\nSkipped: %s. This bench runs only on an owned mini.\n' "$reason" >> "$GITHUB_STEP_SUMMARY" ;;
          esac

  # A retry past attempt 2 never takes an owned Mac (docs/ci-runners.md), and
  # this bench runs nowhere else, so attempt 3 skips the build and the bench.
  # The Blacksmith label below is only the fleet-wide literal fallback the
  # runner guards require; the `if` keeps it from ever being used.
  build:
    needs: [resolve-ref, gate]
    if: needs.gate.outputs.run == 'true' && github.run_attempt <= 2
    uses: ./.github/workflows/reload-build.yml
    with:
      tag: ${{ needs.gate.outputs.tag }}
      ref: ${{ needs.resolve-ref.outputs.sha }}
      platform: macos
      runner: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || needs.gate.outputs.runner || 'blacksmith-6vcpu-macos-26' }}
      backend_mode: local

  bench:
    needs: [resolve-ref, gate, build]
    if: needs.gate.outputs.run == 'true' && github.run_attempt <= 2
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || needs.gate.outputs.runner || 'blacksmith-6vcpu-macos-26' }}
    # The GUI-token wait and bench step both fit in this job timeout.
    timeout-minutes: 45
    env:
      CMUX_TAG: ${{ needs.gate.outputs.tag }}
      # Keep the receipt bound to the exact app source and workflow revision
      # that produced it; the summary remains warning-only for now.
      CMUX_PERF_SOURCE_SHA: ${{ needs.resolve-ref.outputs.sha }}
      CMUX_PERF_WORKFLOW_SHA: ${{ github.workflow_sha }}
    steps:
      # All suites share the GUI lock: fling still creates a virtual display in the
      # console session, so it must not overlap pixel-producing suites.
      - name: Admit only an isolated GUI session
        id: gui
        run: |
          set -uo pipefail
          helper=/Users/Shared/cmux-build-fleet/bin/glaeda-canonical-root
          status=0
          [ -x "$helper" ] && { "$helper" take-gui --wait 900 || status=$?; }
          case "$status" in
            0|2)
              echo "taken=true" >> "$GITHUB_OUTPUT"
              echo "reason=GUI token acquired for isolated frame-pacing session" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "taken=false" >> "$GITHUB_OUTPUT"
              reason="the console stayed busy (take-gui exited $status)"
              echo "reason=$reason" >> "$GITHUB_OUTPUT"
              echo "::notice title=Agent pane frame pacing::Skipped: $reason."
              printf '## Agent pane frame pacing\n\nSkipped: %s.\n' "$reason" >> "$GITHUB_STEP_SUMMARY" ;;
          esac

      - name: Checkout the bench
        if: steps.gui.outputs.taken == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.workflow_sha }}
          sparse-checkout: |
            .xcode-version
            scripts/select-ci-xcode.sh
            scripts/ci/xcode-pins.txt
            scripts/ci/frame-pacing
            scripts/cmux-next/instant-new-surfaces-bench.py
            scripts/cmux-next/cmd-n-paint-e2e.py
            scripts/cmux-next/bench-startup.py
            scripts/cmux-next/bench_memory.py
            scripts/lib/stop-cmux-tui-owners.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Download the tagged app
        if: steps.gui.outputs.taken == 'true'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: reload-${{ env.CMUX_TAG }}-macos
          path: ${{ runner.temp }}/frame-pacing/artifact

      - name: Select Xcode
        if: steps.gui.outputs.taken == 'true'
        run: ./scripts/select-ci-xcode.sh

      - name: Unpack the app and build the virtual display holder
        if: steps.gui.outputs.taken == 'true'
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/frame-pacing"
          rm -rf "$work/app" "$work/out" "$work/VDisplay.app"
          mkdir -p "$work/app" "$work/out" "$work/VDisplay.app/Contents/MacOS"
          ditto -x -k "$work/artifact/app.zip" "$work/app"
          xcrun clang -fobjc-arc -O2 -Wno-deprecated-declarations -framework AppKit -framework CoreVideo \
            scripts/ci/frame-pacing/vdisplay.m -o "$work/VDisplay.app/Contents/MacOS/VDisplay"
          cp scripts/ci/frame-pacing/VDisplay-Info.plist "$work/VDisplay.app/Contents/Info.plist"
          codesign -s - --force "$work/VDisplay.app"
          # The console user runs the bench and writes out/.
          chmod -R a+rwX "$work"

      - name: Fling bench at 120 Hz
        if: steps.gui.outputs.taken == 'true' && contains(env.SUITES, 'fling')
        continue-on-error: true
        timeout-minutes: 15
        env:
          FLINGS: ${{ inputs.flings || '3' }}
        run: scripts/ci/frame-pacing/console-session.sh scripts/ci/frame-pacing/bench.sh "$RUNNER_TEMP/frame-pacing" "$FLINGS"

      - name: Golden interactions at 120 Hz
        if: steps.gui.outputs.taken == 'true' && contains(env.SUITES, 'golden')
        continue-on-error: true
        timeout-minutes: 10
        run: scripts/ci/frame-pacing/console-session.sh scripts/ci/frame-pacing/golden.sh "$RUNNER_TEMP/frame-pacing"

      # Cmd-N, Cmd-T, Cmd-D, Cmd-Shift-D through the real key path: key to visible frame and to
      # the daemon's confirm, idle and with every core busy (instant-new-surfaces). The guard: each
      # command shows in the first display frame after its key (p95) and its key handler stays
      # under 20 ms of main thread. Warning only, like the rest of this lane.
      - name: Instant create bench
        if: steps.gui.outputs.taken == 'true' && contains(env.SUITES, 'instant')
        continue-on-error: true
        timeout-minutes: 15
        run: |
          app="$(ls -d "$RUNNER_TEMP"/frame-pacing/app/*.app | head -1)"
          scripts/ci/frame-pacing/console-session.sh /usr/bin/python3 scripts/cmux-next/instant-new-surfaces-bench.py \
            --tag "$CMUX_TAG" --app "$app" --runs 10 --budget-frames 1 --budget-key-ms 20 --out "$RUNNER_TEMP/frame-pacing/out" \
            --json "$RUNNER_TEMP/frame-pacing/out/instant-new-surfaces.json"

      # Cmd-N from a workspace split into three panes (Leo 2026-10-20: "the layout shifts"): the new
      # workspace's New Tab page shows in one step, in its final layout, never a frame of the page
      # laid out at the split pane's size first. A guard: it fails the job. The frame strips land in
      # the artifact (cmd-n-split/cmd-n-*/strip.png).
      - name: Cmd-N from a split workspace paints in one step
        if: steps.gui.outputs.taken == 'true' && contains(env.SUITES, 'instant')
        timeout-minutes: 10
        run: |
          app="$(ls -d "$RUNNER_TEMP"/frame-pacing/app/*.app | head -1)"
          scripts/ci/frame-pacing/console-session.sh /usr/bin/python3 scripts/cmux-next/cmd-n-paint-e2e.py \
            --app "$app" --tag "$CMUX_TAG" --split 3 --keys n --runs 3 --duration-ms 900 \
            --out "$RUNNER_TEMP/frame-pacing/out/cmd-n-split"

      # Ctrl-` (New Terminal Tab) at 10 and 100 workspaces, idle and loaded (ctrl-backtick-instant):
      # the new tab shows in the first display frame after the key (p95) with under 20 ms of main
      # thread, whatever the daemon's reply takes. A guard, not a warning: it fails the job.
      - name: Ctrl-` bench (10 and 100 workspaces)
        if: steps.gui.outputs.taken == 'true' && contains(env.SUITES, 'instant')
        timeout-minutes: 20
        run: |
          app="$(ls -d "$RUNNER_TEMP"/frame-pacing/app/*.app | head -1)"
          scripts/ci/frame-pacing/console-session.sh /usr/bin/python3 scripts/cmux-next/instant-new-surfaces-bench.py \
            --tag "$CMUX_TAG" --app "$app" --runs 10 --commands new_terminal --workspaces 10,100 \
            --budget-frames 1 --budget-key-ms 20 --out "$RUNNER_TEMP/frame-pacing/out" \
            --json "$RUNNER_TEMP/frame-pacing/out/ctrl-backtick.json"

      # Launch, new tab and memory against Ardia/Helium/Dia (perf-launch-memory): cold and warm
      # launches to the first window frame (empty and realistic profiles), Cmd-T to the New Tab
      # page's frame, and the footprint of the app and every process it owns (Chromium helpers,
      # WebKit, cmux-tui) at 1, 10 and 20 Chromium tabs on distinct local sites. Report only.
      - name: Launch, new tab and memory bench
        if: steps.gui.outputs.taken == 'true' && contains(env.SUITES, 'perf')
        continue-on-error: true
        timeout-minutes: 30
        run: |
          app="$(ls -d "$RUNNER_TEMP"/frame-pacing/app/*.app | head -1)"
          out="$RUNNER_TEMP/frame-pacing/out"
          scripts/ci/frame-pacing/console-session.sh /usr/bin/python3 scripts/cmux-next/bench-startup.py --app "$app" \
            --profile empty --mode cold --mode warm --runs 5 --timeout 20 --json "$out/launch-empty.json" || true
          scripts/ci/frame-pacing/console-session.sh /usr/bin/python3 scripts/cmux-next/bench-startup.py --app "$app" \
            --profile realistic --mode warm --runs 5 --timeout 20 --json "$out/launch-realistic.json" || true
          scripts/ci/frame-pacing/console-session.sh /usr/bin/python3 scripts/cmux-next/instant-new-surfaces-bench.py \
            --tag "$CMUX_TAG" --app "$app" --runs 10 --phases idle --out "$out" --json "$out/new-tab.json" || true
          scripts/ci/frame-pacing/console-session.sh /usr/bin/python3 scripts/cmux-next/bench_memory.py --app "$app" \
            --tabs 1,10,20 --urls local --settle 30 --measure 10 --out "$out/memory-tabs-local.json" || true
          # The same tabs with candidate Chromium switches (DEBUG builds read CMUX_NEXT_CEF_EXTRA_SWITCHES):
          # no background networking or component updates, no spare renderer; then same-site tabs
          # sharing one renderer.
          scripts/ci/frame-pacing/console-session.sh /usr/bin/python3 scripts/cmux-next/bench_memory.py --app "$app" \
            --tabs 1,10,20 --urls local --settle 30 --measure 10 --out "$out/memory-tabs-local-lean.json" \
            --cef-switches "disable-background-networking:disable-component-update:disable-features=SpareRendererForSitePerProcess,OptimizationHints,MediaRouter" || true
          scripts/ci/frame-pacing/console-session.sh /usr/bin/python3 scripts/cmux-next/bench_memory.py --app "$app" \
            --tabs 1,10,20 --urls real --settle 30 --measure 10 --out "$out/memory-tabs-real.json" || true
      # Warning only: exits 1 (an annotation and a red step) when an animation did not run.
      - name: Judge the golden interactions
        if: always() && steps.gui.outputs.taken == 'true' && contains(env.SUITES, 'golden')
        continue-on-error: true
        run: python3 scripts/ci/frame-pacing/golden.py judge "$RUNNER_TEMP/frame-pacing/out/golden" >> "$GITHUB_STEP_SUMMARY"

      # bench.sh and golden.sh tear both down on exit; this covers a step killed by its timeout.
      - name: Remove the virtual display and the app
        if: always() && steps.gui.outputs.taken == 'true'
        continue-on-error: true
        run: scripts/ci/frame-pacing/console-session.sh /usr/bin/pkill -f "$RUNNER_TEMP/frame-pacing" || true

      - name: Summary
        if: always() && steps.gui.outputs.taken == 'true' && contains(env.SUITES, 'fling')
        run: |
          python3 scripts/ci/frame-pacing/summarize.py \
            "$RUNNER_TEMP/frame-pacing/out" \
            --receipt "$RUNNER_TEMP/frame-pacing/out/summary.json" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Receipt for a skipped bench
        if: always() && steps.gui.outputs.taken != 'true'
        env:
          SKIP_REASON: ${{ steps.gui.outputs.reason || 'the GUI token was not acquired' }}
        run: |
          mkdir -p "$RUNNER_TEMP/frame-pacing/out"
          python3 scripts/ci/frame-pacing/summarize.py \
            "$RUNNER_TEMP/frame-pacing/out" \
            --receipt "$RUNNER_TEMP/frame-pacing/out/summary.json" \
            --skip-reason "$SKIP_REASON"

      - name: Upload the bench results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frame-pacing-${{ github.run_id }}
          path: ${{ runner.temp }}/frame-pacing/out
          retention-days: 14

  # A gate skip prevents the bench job from starting, so keep a receipt for
  # that outcome too. This makes skipped nights distinguishable from missing
  # artifacts without turning the warning-only lane into a required check.
  skipped-receipt:
    needs: [resolve-ref, gate, bench]
    if: always() && needs.gate.outputs.run != 'true'
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-4vcpu-ubuntu-2404' || fromJSON(vars.RUNNER_POOLS).linux }}
    timeout-minutes: 5
    env:
      CMUX_PERF_SOURCE_SHA: ${{ needs.resolve-ref.outputs.sha || github.sha }}
      CMUX_PERF_WORKFLOW_SHA: ${{ github.workflow_sha }}
      SKIP_REASON: frame-pacing gate did not authorize a bench (gate=${{ needs.gate.result }}, run=${{ needs.gate.outputs.run || 'unset' }})
    steps:
      - name: Write gate-skip receipt
        run: |
          mkdir -p "$RUNNER_TEMP/frame-pacing/out"
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          path = Path(os.environ["RUNNER_TEMP"]) / "frame-pacing" / "out" / "summary.json"
          path.write_text(json.dumps({
              "schema": "cmux.next.frame-pacing.v1",
              "recorded_at": datetime.now(timezone.utc).isoformat(),
              "source_sha": os.environ.get("CMUX_PERF_SOURCE_SHA"),
              "workflow_sha": os.environ.get("CMUX_PERF_WORKFLOW_SHA"),
              "status": "skipped",
              "reason": os.environ["SKIP_REASON"],
              "thresholds_enforced": False,
              "modes": {},
          }, indent=2, sort_keys=True) + "\n")
          PY

      - name: Upload gate-skip receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frame-pacing-${{ github.run_id }}
          path: ${{ runner.temp }}/frame-pacing/out
          retention-days: 14
