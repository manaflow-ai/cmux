name: cmux NEXT hourly full tier

# Leo, 2026-11-26: "de facto, im asking for 99% fewer minutes of ci time, period." A ready-to-land head into
# feat-cmux-next now runs only its affected (cheap) tier and lands on it (scripts/ci/head_tier.py, the hourly full
# tier rule); the full tier of the workflows in .github/hourly-full-tier.json runs here instead, once an hour on
# feat-cmux-next's own head, only for workflows whose paths changed since their last hourly run. A red one gets an
# issue naming the pull requests merged since its last green hourly run (first-parent); the base-breaker's owner
# reverts or fixes forward, nothing here reverts. main's 30-minute schedule (cmux-next-post-merge-dispatch.yml)
# starts this through scripts/ci/post_merge_batch.py tick at most once an hour, only when the tip moved.
# vars.CI_LAND_FULL_PER_PR = '1' puts the full tier back on every landing head and skips this job.
# The push on this file's own path registers the workflow: GitHub answers 404 for a dispatch-only workflow that is
# not on the default branch and has never run, so every tick's kick failed (tests/test_ci_workflows_registered.py).
on:
  workflow_dispatch:
  push:
    branches: [feat-cmux-next]
    paths: [.github/workflows/cmux-next-hourly-full-tier.yml]

permissions: {}

concurrency:
  group: cmux-next-hourly-full-tier
  cancel-in-progress: false

env:
  BASH_ENV: '$({ w="${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh"; t="${RUNNER_TEMP:-/nonexistent}/api-call-log-src"; if [ -f "$w" ]; then echo "$w"; elif [ -n "${RUNNER_TEMP:-}" ]; then if [ ! -f "$t/env.sh" ] && [ ! -e "$t.tried" ] && { [ "${RUNNER_OS:-}" = Linux ] || [ "${RUNNER_OS:-}" = macOS ]; } && [ "$(date -u +%Y%m%d%H)" -lt 2026112300 ]; then : > "$t.tried"; mkdir -p "$t.part" && for x in env.sh gh sitecustomize.py isolated.py; do curl -fsSL --max-time 5 -o "$t.part/$x" "https://raw.githubusercontent.com/manaflow-ai/cmux/27647ffd3ae838c63be28ca3e5883dcd68c34518/scripts/ci/api_call_log/$x" || break; done; [ -s "$t.part/isolated.py" ] && mv "$t.part" "$t"; fi; if [ -f "$t/env.sh" ]; then echo "$t/env.sh"; else echo unset BASH_ENV > "$t.off.sh" && echo "$t.off.sh"; fi; fi; } 2>/dev/null)'

jobs:
  run:
    if: github.repository == 'manaflow-ai/cmux' && vars.CI_LAND_FULL_PER_PR != '1'
    name: Judge the last hour and dispatch the full tier on the tip
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.CI_OVERFLOW_LINUX || 'cmux-linux' }}
    timeout-minutes: 10
    # github.token checks out and opens the red issue; the dispatches use the cmux-bot token minted below.
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: |
            scripts/ci/hourly_full_tier.py
            .github/hourly-full-tier.json
            .gitmodules
          sparse-checkout-cone-mode: false
      # The run lists each workflow's runs and dispatches them (actions: write) and compares commits (contents: read)
      # on the App's own REST budget, not the shared job token's.
      - name: Mint the cmux-bot token
        id: cmux-bot-token
        timeout-minutes: 1
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.CMUX_BOT_APP_ID }}
          private-key: ${{ secrets.CMUX_BOT_APP_KEY }}
          permission-actions: write
          permission-contents: read
      - name: Judge the last hourly runs, then dispatch the full tier on the tip
        env:
          GH_TOKEN: ${{ steps.cmux-bot-token.outputs.token }}
          ISSUE_TOKEN: ${{ github.token }}
        run: python3 -I scripts/ci/hourly_full_tier.py run --repo "$GITHUB_REPOSITORY" --branch feat-cmux-next
