name: Cloud staging test account sweep

# Deletes the staging agent test account's machines that have sat paused or idle for more than a day
# (scripts/cmux-next/cloud-test-sweep.ts). Every Cloud check signing in as this account shares its teams' 300-machine
# cap, and paused machines count; on 2026-11-25 the cap was full (cloud.quota.vm_limit, cloud-harness-matrix run
# 45529118600, cmux-platform#2196) because only journey-named machines were ever swept. On a shared team only machines
# the test account created go. Production is out of scope.
#
# Leo, 2026-11-25: "is there any other way for us to test/examine what austin was working on for his updated cloud
# stuff? he said there was slowness and probably a lot of bugs... what can we do now?"
#
# Secrets: CMUX_DOGFOOD_STACK_EMAIL/_PASSWORD in cmux-next-vm-image-dev, which admits feat-cmux-next only, so this runs
# on feat-cmux-next only: every push there that changes a Cloud check script or .github/cloud-staging-test-sweep/request
# (a sweep several times a day as those land), or a manual dispatch once this file is on the default branch.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List what would be deleted, delete nothing"
        type: boolean
        default: false
  push:
    branches: [feat-cmux-next]
    paths:
      - .github/cloud-staging-test-sweep/request
      - .github/workflows/cloud-staging-test-sweep.yml
      - scripts/cmux-next/cloud-*.ts

permissions:
  contents: read

concurrency:
  group: cloud-staging-test-sweep
  cancel-in-progress: false

env:
  # Temporary REST budget attribution: one gh-call line per GitHub API call (scripts/ci/api_call_log/env.sh, fetched at a fixed commit when the checkout has no copy).
  BASH_ENV: '$({ w="${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh"; t="${RUNNER_TEMP:-/nonexistent}/api-call-log-src"; if [ -f "$w" ]; then echo "$w"; elif [ -n "${RUNNER_TEMP:-}" ]; then if [ ! -f "$t/env.sh" ] && [ ! -e "$t.tried" ] && { [ "${RUNNER_OS:-}" = Linux ] || [ "${RUNNER_OS:-}" = macOS ]; } && [ "$(date -u +%Y%m%d%H)" -lt 2026112300 ]; then : > "$t.tried"; mkdir -p "$t.part" && for x in env.sh gh sitecustomize.py isolated.py; do curl -fsSL --max-time 5 -o "$t.part/$x" "https://raw.githubusercontent.com/manaflow-ai/cmux/27647ffd3ae838c63be28ca3e5883dcd68c34518/scripts/ci/api_call_log/$x" || break; done; [ -s "$t.part/isolated.py" ] && mv "$t.part" "$t"; fi; if [ -f "$t/env.sh" ]; then echo "$t/env.sh"; else echo unset BASH_ENV > "$t.off.sh" && echo "$t.off.sh"; fi; fi; } 2>/dev/null)'

jobs:
  sweep:
    if: github.repository == 'manaflow-ai/cmux' && github.ref == 'refs/heads/feat-cmux-next'
    environment:
      name: cmux-next-vm-image-dev
      deployment: false
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || 'cmux-linux' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/cmux-next/
            /tests/fixtures/model-stub/
            /Packages/macOS/CmuxNext/Sources/CmuxNextCloudCredentials/
            scripts/ci/toolchain-r2.sh
            scripts/ci/toolchain-archives.sha256
            scripts/ci/r2-cache.sh
            scripts/ci/lan_cache_fetch.py
            .gitmodules
      - name: Restore pinned Bun 1.4.4 from the CI cache bucket
        shell: bash
        continue-on-error: true
        run: bash "$GITHUB_WORKSPACE/scripts/ci/toolchain-r2.sh" restore bun 1.4.4 || true

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
          no-cache: ${{ !startsWith(github.workspace, '/home/runner/work/') || !(github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && github.event_name != 'merge_group' && contains(fromJSON('["refs/heads/main","refs/heads/feat-cmux-next","refs/heads/nightly-next"]'), github.ref)) }}
      - name: Delete the test account's machines paused or idle past a day
        env:
          CMUX_DOGFOOD_STACK_EMAIL: ${{ secrets.CMUX_DOGFOOD_STACK_EMAIL }}
          CMUX_DOGFOOD_STACK_PASSWORD: ${{ secrets.CMUX_DOGFOOD_STACK_PASSWORD }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: bun scripts/cmux-next/cloud-test-sweep.ts --backend staging --min-age-hours 24 $DRY_RUN --out "$RUNNER_TEMP/test-sweep"
      - name: Summary
        if: always()
        run: cat "$RUNNER_TEMP/test-sweep/summary.md" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "no summary written" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: cloud-staging-test-sweep-${{ github.run_id }}
          path: ${{ runner.temp }}/test-sweep/
          if-no-files-found: warn
          retention-days: 14
