name: macOS cross-compile parity

# MACOS-CROSS-COMPILE-ON-LINUX drift guard. While scripts/ci/cmux-tui-darwin-builder
# says linux, the cmux-tui artifacts publish Linux-built macOS binaries and no
# per-commit job compares them with a Mac build. This workflow does, whenever
# the cross recipe, the Rust toolchain, Cargo.lock or ghostty-next changes, and
# daily (GitHub runs schedules from the default branch only, so the daily run
# starts once this file is on main): it builds the macOS
# targets on macOS runners (the reference), builds them again on Linux without
# an Apple SDK, runs the Mach-O parity (scripts/ci/macho_parity.py, the
# libghostty-vt check and the framework stub coverage), and runs every x86_64
# binary of both builds under Rosetta 2 on an Apple silicon Mac
# (scripts/ci/macos-cross-runtime-check.sh).
# A difference fails the run. It publishes nothing and holds no credentials.

on:
  workflow_dispatch:

concurrency:
  group: macos-cross-parity-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

env:
  # Temporary REST budget attribution: one gh-call line per GitHub API call (scripts/ci/api_call_log/env.sh, fetched at a fixed commit when the checkout has no copy).
  BASH_ENV: '$({ w="${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh"; t="${RUNNER_TEMP:-/nonexistent}/api-call-log-src"; if [ -f "$w" ]; then echo "$w"; elif [ -n "${RUNNER_TEMP:-}" ]; then if [ ! -f "$t/env.sh" ] && [ ! -e "$t.tried" ] && { [ "${RUNNER_OS:-}" = Linux ] || [ "${RUNNER_OS:-}" = macOS ]; } && [ "$(date -u +%Y%m%d%H)" -lt 2026112300 ]; then : > "$t.tried"; mkdir -p "$t.part" && for x in env.sh gh sitecustomize.py isolated.py; do curl -fsSL --max-time 5 -o "$t.part/$x" "https://raw.githubusercontent.com/manaflow-ai/cmux/27647ffd3ae838c63be28ca3e5883dcd68c34518/scripts/ci/api_call_log/$x" || break; done; [ -s "$t.part/isolated.py" ] && mv "$t.part" "$t"; fi; if [ -f "$t/env.sh" ]; then echo "$t/env.sh"; else echo unset BASH_ENV > "$t.off.sh" && echo "$t.off.sh"; fi; fi; } 2>/dev/null)'

jobs:
  # The Mac reference: the build job of cmux-tui artifacts with the Mac builder.
  mac-build:
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/cmux-tui-build-package.yml
    with:
      version: 0.0.0-r2.sha-${{ github.sha }}
      package_npm: false
      package_pypi: false
      include_windows: false
      target_set: macos
      darwin_builder: mac

  linux-build:
    name: build on Linux and compare (no Apple SDK)
    needs: [mac-build]
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.LINUX_RUNNER_DARWIN_CROSS || !startsWith(vars.LINUX_RUNNER, 'blacksmith-') && vars.LINUX_RUNNER || vars.CI_CLOUD_OVERFLOW_SAVED && fromJSON(vars.RUNNER_POOLS).linux_16 || fromJSON(vars.RUNNER_POOLS).linux_8 }}
    # Cold, this job builds both macOS targets one after the other: on cmux-gcp-lane-build-x64 (LINUX_RUNNER_DARWIN_CROSS)
    # run 44985475776 took 1934 s for aarch64-apple-darwin alone and was cancelled at 60 min mid x86_64. 90 fits two cold targets.
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      GHOSTTY_ZIG_SOURCE: ghostty-next
      CMUX_SERVER_RELEASE_KEYS: ${{ vars.CMUX_SERVER_RELEASE_KEYS }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Unit-test the parity verdict and the stub tools
        run: |
          python3 tests/test_ci_macho_parity.py
          python3 tests/test_ci_macos_stubs.py

      - name: Init ghostty submodule
        run: git submodule update --init --depth 1 ghostty-next

      - name: Install LLVM 19 (clang, ld64.lld, llvm tools)
        run: bash scripts/ci/apt-ensure.sh clang-19 lld-19 llvm-19

      - name: Resolve Ghostty Zig version
        id: ghostty-zig-version
        run: |
          set -euo pipefail
          version="$(bash ./scripts/ghostty-zig-version.sh)"
          [[ -n "$version" ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install zig
        uses: mlugg/setup-zig@8d6198c65fb0feaa111df26e6b467fea8345e46f # v2.0.5
        with:
          version: ${{ steps.ghostty-zig-version.outputs.version }}
          # Its own cache saves a new entry per run; zig-global-cache keys it stably.
          use-cache: false
      - name: Restore the Zig global cache (feat-cmux-next pushes save it)
        uses: ./.github/actions/zig-global-cache

      - name: Fetch the ghostty-next Zig packages (cached, deadlined, retried)
        uses: ./.github/actions/ghostty-zig-packages

      - name: Set up pinned Rust
        uses: ./.github/actions/setup-cmux-tui-rust

      - name: Install macOS Rust targets
        working-directory: cmux-tui
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Download the Mac-built references
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: "*-apple-darwin"
          path: ${{ runner.temp }}/macos-cross/ref
          merge-multiple: true

      # cmux-tailnet's build.rs builds libtailscale with this Go (cmux-tui-build-package.yml pins the same).
      - name: Install Go for the embedded tailnet archive
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: cmux-tui/crates/cmux-tailnet/go-version
          cache: false

      - name: Build on Linux (no Apple SDK)
        run: |
          set -euo pipefail
          sdk="$(./scripts/ci/macos-cross.sh ref-sdk "$RUNNER_TEMP/macos-cross/ref/cmux-tui-app-host-aarch64-apple-darwin")"
          ./scripts/ci/macos-cross.sh toolchain "$sdk"
          ghostty="$(git -C ghostty-next rev-parse HEAD)"
          # all: the package build's own pass (cmux-tui-build-package.yml), every cargo invocation of a target at once in
          # its own target dir (cargo-groups.sh). hosts then bins ran them one at a time: with codegen-units 1 the slowest
          # crate's last unit holds one core while the rest wait (run 44985475776: bins 1934 s for aarch64 alone).
          ./scripts/ci/macos-cross.sh all "$GITHUB_SHA" "$ghostty" "0.0.0-r2.sha-$GITHUB_SHA"
          ./scripts/ci/macos-cross.sh vt

      - name: Compare with the Mac builds
        run: |
          set -uo pipefail
          status=0
          report="$RUNNER_TEMP/macos-cross-parity.txt"
          ./scripts/ci/macos-cross.sh parity-hosts > "$report" 2>&1 || status=1
          ./scripts/ci/macos-cross.sh parity-vt >> "$report" 2>&1 || status=1
          ./scripts/ci/macos-cross.sh stubs-check >> "$report" 2>&1 || status=1
          ./scripts/ci/macos-cross.sh parity-bins >> "$report" 2>&1 || status=1
          cat "$report"
          { echo "### macOS cross-compile parity: ${GITHUB_SHA}"; echo '```'; cat "$report"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Upload the parity reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-cross-parity
          retention-days: 3
          path: ${{ runner.temp }}/macos-cross/reports/
          if-no-files-found: warn

      - name: Upload the Linux-built macOS binaries
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-cross-binaries
          path: ${{ runner.temp }}/macos-cross/linux/
          if-no-files-found: warn
          retention-days: 7

  runtime-x86_64:
    name: run-time check (x86_64 under Rosetta)
    needs: [linux-build]
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || (vars.CI_BLACKSMITH_MACOS != 'on' && (vars.CI_SIDE_LANE_LABELS != '' && fromJSON(vars.CI_SIDE_LANE_LABELS) || vars.CI_SIDE_LANE_RUNNER) || vars.CI_BLACKSMITH_MACOS == 'on' && vars.MACOS_RUNNER_26 || fromJSON(vars.RUNNER_POOLS).macos_26) }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # otool and codesign in the run-time check come from the selected Xcode.
      - name: Select Xcode
        run: ./scripts/select-ci-xcode.sh

      # x86_64 runs under Rosetta 2 on an Apple silicon Mac: no provider offers an Intel
      # macOS image but GitHub-hosted, which is not in the routing order (Leo, 2026-10-27:
      # "THE GITHUB HOSTED MACS / ARE THE SLOWEST THINGS"). The check compares each
      # Linux-built binary with the Mac-built one of the same commit, both translated the
      # same way, so a load-command, dylib, signature or version difference still shows.
      - name: Make sure Rosetta runs x86_64
        run: |
          set -euo pipefail
          if ! /usr/bin/arch -x86_64 /usr/bin/true 2>/dev/null; then
            sudo -n /usr/sbin/softwareupdate --install-rosetta --agree-to-license
          fi
          /usr/bin/arch -x86_64 /usr/bin/uname -m | grep -qx x86_64

      - name: Download the Linux-built macOS binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: macos-cross-binaries
          path: ${{ runner.temp }}/linux

      - name: Download the Mac-built references
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: "*-x86_64-apple-darwin"
          path: ${{ runner.temp }}/mac
          merge-multiple: true

      - name: Run the Linux-built binaries beside the Mac-built ones
        run: |
          set -o pipefail
          status=0
          /usr/bin/arch -x86_64 /bin/bash ./scripts/ci/macos-cross-runtime-check.sh "$RUNNER_TEMP/linux" "$RUNNER_TEMP/mac" | tee "$RUNNER_TEMP/runtime.txt" || status=$?
          { echo "### macOS cross-compile run-time check (x86_64 under Rosetta): ${GITHUB_SHA}"; echo '```'; cat "$RUNNER_TEMP/runtime.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
