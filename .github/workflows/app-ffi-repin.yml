# Re-pins the app FFI to the newest published release when the pin changes on
# feat-cmux-next, with no FFI build. app-ffi-release.yml re-pins after each
# publish; scripts/cmux-next/publish-app-ffi-repin.sh keeps an open re-pin PR's
# head while its checks run instead of moving it on every publish (each move
# cancelled the checks, and on 2026-11-09 nothing landed for 6 hours). The
# releases published while a head was held are pinned here: the held PR's
# merge changes app-ffi-pin.json (and the checksum line of Package.swift's
# loader block), and this run opens the next re-pin PR at once, without waiting
# for another FFI push. A Package.swift change by any other PR runs it too; with
# nothing newer published, or a head still held, it changes nothing.
name: app FFI re-pin

on:
  push:
    branches: [feat-cmux-next]
    paths:
      - "Packages/macOS/CmuxNext/Package.swift"
      - "Packages/macOS/CmuxNext/app-ffi-pin.json"
  # No schedule: a scheduled run starts from the default branch (main), where
  # neither this job's ref check nor the ffi-release environment admits it.
  # The landers merge with an App token or a person's token, whose pushes start
  # this workflow; a merge whose push starts nothing is re-pinned by the next
  # FFI publish (app-ffi-release.yml), as before this workflow existed.
  workflow_dispatch:

permissions: {}

env:
  # Temporary REST budget attribution: one gh-call line per GitHub API call (scripts/ci/api_call_log/env.sh, fetched at a fixed commit when the checkout has no copy).
  BASH_ENV: '$({ w="${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh"; t="${RUNNER_TEMP:-/nonexistent}/api-call-log-src"; if [ -f "$w" ]; then echo "$w"; elif [ -n "${RUNNER_TEMP:-}" ]; then if [ ! -f "$t/env.sh" ] && [ ! -e "$t.tried" ] && { [ "${RUNNER_OS:-}" = Linux ] || [ "${RUNNER_OS:-}" = macOS ]; } && [ "$(date -u +%Y%m%d%H)" -lt 2026112300 ]; then : > "$t.tried"; mkdir -p "$t.part" && for x in env.sh gh sitecustomize.py isolated.py; do curl -fsSL --max-time 5 -o "$t.part/$x" "https://raw.githubusercontent.com/manaflow-ai/cmux/27647ffd3ae838c63be28ca3e5883dcd68c34518/scripts/ci/api_call_log/$x" || break; done; [ -s "$t.part/isolated.py" ] && mv "$t.part" "$t"; fi; if [ -f "$t/env.sh" ]; then echo "$t/env.sh"; else echo unset BASH_ENV > "$t.off.sh" && echo "$t.off.sh"; fi; fi; } 2>/dev/null)'

jobs:
  repin:
    name: open the re-pin pull request
    if: github.ref == 'refs/heads/feat-cmux-next'
    environment: ffi-release
    # The release's LINUX ROUTE (app-ffi-release.yml): the nightly lane's reserved label first, attempts 1 and 2.
    # On vars.LINUX_RUNNER this job waited behind all PR CI on a saturated Blacksmith pool (run 44645693256, 40 min
    # pending, 2026-11-20) while the published release cmux-app-ffi-789a832a sat unpinned.
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.CI_RELEASE_PIN_SLOT != 'off' && github.run_attempt <= 2 && 'cmux-gcp-nightly-x64' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || 'cmux-linux' }}
    # 20, not 10 (2026-11-20): checkout alone took about 1.5 min and one healthy re-pin about 8 (run 44655157417),
    # so runs 44660432819, 44661713537, 44662970467 and 44664319551 hit the 10 min bound and re-dispatched. 30, not
    # 20: publish-app-ffi-repin.sh may also wait up to 10 min (REPIN_RATE_LIMIT_WAIT_S) for GitHub's rate limit, and
    # a timeout in that wait would hide its "Re-pin rate-limited" reason.
    timeout-minutes: 30
    # actions: write only for the failure step's dispatch of app-ffi-repin.yml; the re-pin script reads runs and
    # jobs with this token (READ_TOKEN) and writes nothing with it.
    permissions:
      actions: write
      contents: read
      checks: read
      statuses: read
    # One group with app-ffi-release.yml's repin job: re-pins run one at a time
    # on the same pull request.
    concurrency:
      # -v2 (2026-11-20): GitHub kept the old key held after runs 44636531297 and 44645693256 were cancelled; every
      # later re-pin sat PENDING with no holder (run 44651765158). A new key keeps the same one-at-a-time rule.
      group: app-ffi-repin-v2
      cancel-in-progress: false
    steps:
      # The same two tokens as app-ffi-release.yml's repin job (see there).
      - name: Mint the release App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.CMUX_FFI_RELEASE_APP_ID }}
          private-key: ${{ secrets.CMUX_FFI_RELEASE_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-workflows: write

      - name: Mint the release App token for the pull request
        id: pr-token
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.CMUX_FFI_RELEASE_APP_ID }}
          private-key: ${{ secrets.CMUX_FFI_RELEASE_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-pull-requests: write

      # The base autofix's push identity (manaflow-cmux-pr-autofix, the bypass
      # actor of feat-cmux-next's required check): publish-app-ffi-repin.sh
      # pins on the base with it (scripts/cmux-next/pin-app-ffi-on-base.sh).
      # Without it the pin goes through the pull request, as before.
      - name: Mint the base pin token
        id: base-token
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.CMUX_PR_AUTOFIX_APP_ID }}
          private-key: ${{ secrets.CMUX_PR_AUTOFIX_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      # A reused work checkout an earlier job left shallow makes the treeless full-history
      # checkout below run `git fetch --filter=tree:0 --unshallow` into it, and git 2.55/2.56
      # aborts in pack-objects ("BUG: ... should_include_obj should only be called on
      # existing objects") on all three tries: app FFI release run 43863985334, 2026-11-16.
      # Dropping the shallow .git lets the checkout fetch fresh (treeless, about a minute).
      - name: Drop a reused shallow checkout
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          if [[ -f "$GITHUB_WORKSPACE/.git/shallow" ]]; then
            echo "reused shallow checkout: removing its .git so the checkout fetches fresh"
            rm -rf "$GITHUB_WORKSPACE/.git"
          fi

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: refs/heads/feat-cmux-next
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true
          fetch-depth: 0
          filter: tree:0

      - name: Pin the newest published release and open or update the pull request
        env:
          GH_TOKEN: ${{ steps.pr-token.outputs.token }}
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          READ_TOKEN: ${{ github.token }}
          BASE_TOKEN: ${{ steps.base-token.outputs.token }}
          BASE_PIN_ENABLED: ${{ vars.CMUX_NEXT_BASE_AUTOFIX == '1' }}
          # A stalled git transfer (a lazy tree fetch of this treeless clone, or `git fetch origin $previous`) aborts
          # after 60 s with no byte instead of hanging the job to its timeout; the script treats a failed read as before.
          GIT_HTTP_LOW_SPEED_LIMIT: "1"
          GIT_HTTP_LOW_SPEED_TIME: "60"
        shell: bash
        run: bash scripts/cmux-next/publish-app-ffi-repin.sh

      # A failed or timed-out re-pin starts this workflow again, which re-pins the newest published release:
      # an app-ffi-release.yml run's re-pin may have held for this one (publish-app-ffi-repin.sh). A dispatched
      # run does not start another, so a re-pin that keeps failing runs once more, not in a loop. A run cancelled
      # by hand also starts one re-pin: harmless, a re-pin of the newest published release.
      - name: Start the re-pin workflow when this re-pin failed
        if: (failure() || cancelled()) && github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        # The run's installation token shares a rate limit with every other job: run 45792260236's
        # dispatch got "HTTP 403: API rate limit exceeded for installation" (2026-11-26 09:33Z) and the
        # pin stayed behind until the next push. Retry on a bounded backoff (about 9 min) instead.
        run: |
          for wait in 0 60 120 180 180; do
            sleep "$wait"
            if gh workflow run app-ffi-repin.yml --ref feat-cmux-next; then exit 0; fi
            echo "re-pin dispatch failed; retrying after backoff"
          done
          exit 1
