name: IndexNow notification tests

on:
  pull_request:
    paths:
      - .github/workflows/indexnow.yml
      - .github/workflows/indexnow-tests.yml
      - scripts/ci/notify-indexnow.py
      - tests/test_indexnow_notification.py
      - web/app/lib/indexnow.ts
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notification-tests:
    runs-on: ${{ vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - run: python3 tests/test_indexnow_notification.py
