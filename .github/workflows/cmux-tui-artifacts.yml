name: cmux-tui artifacts

# Publishes raw cmux-tui (the Rust TUI multiplexer), cmux-relay, and
# chatmux-relay (the machine agent) binaries to the cmux-binaries R2 bucket
# (public under https://files.cmux.com/<prefix>/...) so cloud VM snapshot
# builders and install scripts can curl a binary directly, without npm or
# PyPI. Binary building is shared with the npm/uvx distribution lane
# (cmux-tui-build-package.yml); this workflow only adds the R2 raw-binary
# publish.
#
# Layout in R2:
#   cmux-tui/<commit-sha>/cmux-tui-<rust-target>   immutable, commit-addressed
#   cmux-tui/<commit-sha>/cmux-tui-app-host-<rust-target>  app host; install as
#                                                  cmux-app-host next to cmux-tui
#   cmux-tui/<commit-sha>/cmux-tui-cloud-server-<rust-target>  Cloud app server;
#                                                  install as cmux-cloud beside it
#   cmux-tui/<commit-sha>/cmux-tui-browser-host-<rust-target>  browser host (macOS);
#                                                  install as cmux-browser-host beside cmux-tui
#   cmux-tui/<commit-sha>/manifest.json
#   cmux-tui/tree/<tree-key>/cmux-tui-aarch64-apple-darwin  immutable, source-addressed
#   cmux-tui/tree/<tree-key>/cmux-tui-aarch64-apple-darwin.sha256
#   cmux-tui/tree/<tree-key>/source.json           the commit and run that built it
#   cmux-tui/latest/cmux-tui-<rust-target>         rolling, every main push
#   cmux-tui/latest/manifest.json
#   cmux-relay/<commit-sha>/cmux-relay-<rust-target> immutable, commit-addressed
#   cmux-relay/<commit-sha>/manifest.json
#   cmux-relay/latest/cmux-relay-<rust-target>       rolling, manual publishes only
#   cmux-relay/latest/manifest.json
#   chatmux-relay/<commit-sha>/chatmux-relay-<rust-target> immutable, commit-addressed
#   chatmux-relay/<commit-sha>/manifest.json
# The chatmux-relay manifest also records immutable URLs and SHA-256 values for
# the matching cmux-tui runtime binaries. Consumers must install both; a
# relay-only install is not a supported PTY configuration.
#   chatmux-relay/latest/chatmux-relay-<rust-target>       rolling, manual publishes only
#   chatmux-relay/latest/manifest.json

on:
  # Every main push that can change the binaries republishes the immutable
  # commit-addressed artifacts and the rolling latest/ manifest: cmux Cloud
  # machines install the daemon from latest/manifest.json and the macOS app
  # bundles the matching client from it (scripts/install-cmux-tui-client.sh),
  # so latest must track main. Manual dispatch stays for re-publishing.
  #
  # cmux-next dogfood, tagged and nightly builds bundle the daemon built from
  # their own cmux-tui source (scripts/cmux-next/pin-cmux-tui.sh --help): the
  # tree key is the git tree hash of the cmux-tui tree and the ghostty
  # gitlink. Pushes to the cmux-next branches, and to cmux-tui-pin-* helper
  # branches that publish an unmerged branch's tree, publish
  # cmux-tui/tree/<key>/ after the build and the cmux_next_ daemon tests pass.
  push:
    branches: [main, feat-cmux-next, "cmux-tui-pin-*"]
    # The branch itself is trusted. Run on every base-branch advance so a
    # Swift-only change can repair a missing cmux-tui tree publication before
    # downstream app jobs try to fetch it.
  # Same-repository PRs need a tree-addressed binary for cmux-next's merge
  # checks. This is pull_request_target so the workflow definition and publish
  # steps come from the trusted base branch; the build job receives no R2
  # credentials and only hands the publisher an opaque binary artifact.
  # Keep this filter identical to cmux-tui-tree-inputs.txt. The merge ref can
  # still differ from the PR head, so tree-preflight remains the cheap check
  # that skips macOS work when the complete key is already published.
  pull_request_target:
    branches: [feat-cmux-next]
    paths:
      - "cmux-tui/**"
      - "ghostty"
      - "ghostty-next"
      - "scripts/cmux-next/build-layout-reducer-ffi.sh"
  workflow_dispatch:
    inputs:
      macos_runner:
        # A branch dogfood publish only needs its commit-addressed objects; let
        # it build the macOS targets on an idle self-hosted label instead of
        # waiting behind the shared hosted queue.
        description: "Optional macOS runner label override for this publish"
        required: false
        default: ""
        type: string

concurrency:
  # Main remains serialized because each main run also updates latest/. Keep
  # push runs keyed by commit: GitHub evaluates workflow concurrency before the
  # tree-preflight job can compute the immutable tree key, so a branch-wide
  # cancel can drop the only publisher for an older base tree. Preflight skips
  # only a superseded push whose newer head has the same key (or a key that is
  # already complete); distinct keys remain publishable for PR merge trees.
  group: cmux-tui-artifacts-${{ github.ref == 'refs/heads/main' && 'main' || github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || format('sha-{0}', github.sha) }}
  cancel-in-progress: false

permissions: {}

env:
  # libghostty-vt always builds from the ghostty-next gitlink: an empty
  # value overrides any runner-level CMUX_GHOSTTY_SRC (build.rs treats it
  # as unset).
  CMUX_GHOSTTY_SRC: ""

jobs:
  # Keep the common path cheap: a tree-addressed publication is complete when
  # all runtime binaries and checksum markers exist, so there is no reason to spend a macOS build
  # or daemon-test slot on another commit with the same inputs. The source
  # checkout is used only for git plumbing and never executes PR code.
  tree-preflight:
    name: cmux-tui tree preflight
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 3
    permissions:
      actions: read
      contents: read
    outputs:
      key: ${{ steps.inspect.outputs.key }}
      legacy_key: ${{ steps.inspect.outputs.legacy_key }}
      tree_ready: ${{ steps.inspect.outputs.tree_ready }}
      run_macos: ${{ steps.inspect.outputs.run_macos }}
      superseded: ${{ steps.inspect.outputs.superseded }}
      owner_run_id: ${{ steps.inspect.outputs.owner_run_id }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          fetch-depth: 1

      - name: Check the branch head and tree publication
        id: inspect
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          SOURCE_COMMIT: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          RUN_ID: ${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          superseded=false
          run_macos=true
          same_tree_head=false

          remote_sha=""
          authorization=""
          # A queued push can be obsolete before its first runner starts. Fail
          # open on a transient ref lookup failure so a real head still gets
          # its compile and nightly promotion. The remote SHA is compared
          # after the local key is known; a newer commit is not enough to drop
          # this run because its tree may still be required by a PR merge ref.
          if [[ "$EVENT_NAME" == push && "$REF" == refs/heads/feat-cmux-next ]]; then
            authorization="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
            remote_sha="$(timeout 15 git -c "http.extraHeader=Authorization: Basic $authorization" \
              ls-remote "${SERVER_URL}/${REPOSITORY}.git" "$REF" 2>/dev/null | awk 'NR==1{print $1}')" || remote_sha=""
            if [[ -z "$remote_sha" ]]; then
              echo "::warning::could not resolve the current feat-cmux-next head; keeping macOS work enabled"
            fi
          fi

          if [[ "$HEAD_REPOSITORY" != "$REPOSITORY" ]]; then
            run_macos=false
            echo "Fork pull request: no trusted cmux-tui build is run."
          fi

          key="$(python3 scripts/ci/cmux_tui_tree_key.py --version v2 "$SOURCE_COMMIT")"
          [[ "$key" =~ ^[0-9a-f]{40}$ ]]
          echo "key=$key" >> "$GITHUB_OUTPUT"
          # CMUX-TUI-TREE-KEY-V2: the v1 key of the same commit (with the classic
          # ghostty gitlink). Trees published before v2 exist only under it.
          legacy_key="$(python3 scripts/ci/cmux_tui_tree_key.py --version v1 "$SOURCE_COMMIT")"
          [[ "$legacy_key" =~ ^[0-9a-f]{40}$ ]]
          echo "legacy_key=$legacy_key" >> "$GITHUB_OUTPUT"

          if [[ -n "$remote_sha" && "$remote_sha" != "$SHA" ]]; then
            current_key=""
            if git -c "http.extraHeader=Authorization: Basic $authorization" \
                fetch --no-tags --depth=1 "${SERVER_URL}/${REPOSITORY}.git" "$remote_sha" >/dev/null 2>&1 \
              && git diff --quiet "$SOURCE_COMMIT" "$remote_sha" -- \
                scripts/ci/cmux_tui_tree_key.py scripts/cmux-next/cmux-tui-tree-inputs.txt \
              && current_key="$(python3 scripts/ci/cmux_tui_tree_key.py --version v2 "$remote_sha" 2>/dev/null)" \
              && [[ "$current_key" =~ ^[0-9a-f]{40}$ ]]; then
              if [[ "$current_key" == "$key" ]]; then
                same_tree_head=true
                echo "A newer feat-cmux-next head $remote_sha has the same tree key $key; checking publication completeness before superseding $SHA."
              else
                echo "Current feat-cmux-next head $remote_sha has tree key $current_key; retaining publication for superseded tree $key."
              fi
            else
              echo "::warning::could not verify the current feat-cmux-next tree key definition; keeping macOS work enabled"
            fi
          fi

          # A tree is complete when every arm64 runtime binary, its checksum and
          # the completion manifest exist under its key.
          tree_complete() {
            local key="$1" base="https://files.cmux.com/cmux-tui/tree/$1" complete=true
            # A daemon marker alone can belong to a legacy or interrupted
            # publication. All arm64 runtime binaries and checksums must exist.
            for asset in cmux-tui-aarch64-apple-darwin cmux-tui-app-host-aarch64-apple-darwin cmux-tui-cloud-server-aarch64-apple-darwin; do
              if ! digest="$(curl --fail --silent --show-error --connect-timeout 5 --max-time 15 \
                  "$base/$asset.sha256?preflight=$RUN_ID" 2>/dev/null)" \
                || [[ ! "$digest" =~ ^[0-9a-f]{64}[[:space:]] ]] \
                || ! curl --head --fail --silent --show-error --connect-timeout 5 --max-time 15 \
                  -o /dev/null "$base/$asset?preflight=$RUN_ID"; then
                complete=false
                echo "Tree $key is missing $asset or its checksum; publication repair is required (see cmuxterm-hq REPAIR.md)."
              fi
            done
            completion="$RUNNER_TEMP/cmux-tui-completion.json"
            if ! curl --fail --silent --show-error --connect-timeout 5 --max-time 15 \
                "$base/completion.json?preflight=$RUN_ID" -o "$completion" \
                || ! python3 - "$key" "$completion" <<'PY'
          import json, re, sys
          key, path = sys.argv[1:]
          data = json.load(open(path, encoding="utf-8"))
          names = (
              "cmux-tui-aarch64-apple-darwin",
              "cmux-tui-app-host-aarch64-apple-darwin",
              "cmux-tui-cloud-server-aarch64-apple-darwin",
          )
          if data.get("key") != key or not isinstance(data.get("binaries"), dict):
              raise SystemExit("completion manifest key or binaries object is invalid")
          for name in names:
              digest = data["binaries"].get(name)
              if not isinstance(digest, str) or not re.fullmatch(r"[0-9a-f]{64}", digest):
                  raise SystemExit(f"completion manifest is missing {name}")
          PY
            then
              complete=false
              echo "Tree $key is missing a complete completion manifest; publication repair is required (see cmuxterm-hq REPAIR.md)."
            fi
            [[ "$complete" == true ]]
          }
          tree_ready=false
          if tree_complete "$key"; then
            tree_ready=true
          elif [[ "$legacy_key" != "$key" ]] && tree_complete "$legacy_key"; then
            tree_ready=true
            echo "Tree $key is published under its v1 key $legacy_key; fetch reads it there (CMUX-TUI-TREE-KEY-V2)."
          fi
          if [[ "$tree_ready" == true ]]; then
            echo "Published tree $key and all daemon companions are ready; macOS build can be skipped."
          fi

          # A newer commit with the same inputs may supersede this run only
          # after the immutable tree is complete. If the newer publisher was
          # cancelled or skipped before publishing, this run must remain the
          # repair publisher for the missing key.
          if [[ "$same_tree_head" == true && "$tree_ready" == true ]]; then
            superseded=true
            run_macos=false
            echo "Superseded feat-cmux-next push $SHA; current branch head has the same complete tree key $key."
          elif [[ "$same_tree_head" == true ]]; then
            echo "Same tree key $key is incomplete; retaining publication for superseded push $SHA."
          fi

          # Elect one deterministic owner before any expensive macOS work.
          # GitHub replaces an older pending job in a job-level concurrency
          # group, so serializing builders by tree key can strand a key. Later
          # runs wait for this owner and take over only if it ends without a
          # complete publication.
          owner_run_id="$RUN_ID"
          if [[ "$tree_ready" != true && "$EVENT_NAME" == push &&
                "$REF" == refs/heads/feat-cmux-next ]]; then
            runs_json="$(curl --fail --silent --show-error --connect-timeout 5 --max-time 15 \
              -u "x-access-token:$GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              "$SERVER_URL/repos/$REPOSITORY/actions/workflows/cmux-tui-artifacts.yml/runs?branch=feat-cmux-next&event=push&status=in_progress&per_page=100" \
              2>/dev/null || true)"
            if [[ -n "$runs_json" ]]; then
              while IFS=$'\t' read -r candidate_id candidate_sha; do
                [[ -n "$candidate_id" && -n "$candidate_sha" ]] || continue
                [[ "$candidate_id" == "$RUN_ID" ]] && continue
                if git -c "http.extraHeader=Authorization: Basic $authorization" \
                    fetch --no-tags --depth=1 "$SERVER_URL/$REPOSITORY.git" "$candidate_sha" >/dev/null 2>&1 \
                  && candidate_key="$(python3 scripts/ci/cmux_tui_tree_key.py --version v2 "$candidate_sha" 2>/dev/null)" \
                  && [[ "$candidate_key" == "$key" ]] \
                  && [[ "$candidate_id" =~ ^[0-9]+$ ]] \
                  && (( candidate_id < owner_run_id )); then
                  owner_run_id="$candidate_id"
                fi
              done < <(python3 -c 'import json,sys; [print("{}\t{}".format(run.get("id", ""), run.get("head_sha", ""))) for run in json.loads(sys.stdin.read()).get("workflow_runs", []) if run.get("status") == "in_progress"]' <<<"$runs_json")
            fi
          fi
          if [[ "$owner_run_id" == "$RUN_ID" ]]; then
            owner_run_id=""
          else
            echo "Tree $key is owned by active publisher run $owner_run_id; this run will wait before building."
          fi
          echo "owner_run_id=$owner_run_id" >> "$GITHUB_OUTPUT"
          echo "tree_ready=$tree_ready" >> "$GITHUB_OUTPUT"

          # Main still needs commit-addressed artifacts and latest/ updates.
          # Other trusted refs only spend macOS time for a new tree.
          if [[ "$tree_ready" == true && "$REF" != refs/heads/main &&
                "$EVENT_NAME" != workflow_dispatch &&
                "$REF" != refs/heads/cmux-tui-pin-* ]]; then
            run_macos=false
          fi
          echo "run_macos=$run_macos" >> "$GITHUB_OUTPUT"
          echo "superseded=$superseded" >> "$GITHUB_OUTPUT"

  tree-owner-wait:
    name: wait for same-key tree publisher
    if: needs.tree-preflight.result == 'success'
    needs: tree-preflight
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 35
    outputs:
      takeover: ${{ steps.wait.outputs.takeover }}
    permissions:
      actions: read
      contents: read
    steps:
      - name: Wait for the owning tree publisher
        id: wait
        env:
          KEY: ${{ needs.tree-preflight.outputs.key }}
          OWNER_RUN_ID: ${{ needs.tree-preflight.outputs.owner_run_id }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          takeover=true
          tree_ready() {
            local base="https://files.cmux.com/cmux-tui/tree/$KEY"
            for asset in cmux-tui-aarch64-apple-darwin cmux-tui-app-host-aarch64-apple-darwin cmux-tui-cloud-server-aarch64-apple-darwin; do
              curl --fail --silent --show-error --connect-timeout 5 --max-time 15 \
                "$base/$asset.sha256?owner-wait=$GITHUB_RUN_ID" >/dev/null || return 1
              curl --head --fail --silent --show-error --connect-timeout 5 --max-time 15 \
                -o /dev/null "$base/$asset?owner-wait=$GITHUB_RUN_ID" || return 1
            done
            completion="$RUNNER_TEMP/cmux-tui-owner-completion.json"
            curl --fail --silent --show-error --connect-timeout 5 --max-time 15 \
              "$base/completion.json?owner-wait=$GITHUB_RUN_ID" -o "$completion" || return 1
            python3 - "$KEY" "$completion" <<'PY'
          import json, re, sys
          key, path = sys.argv[1:]
          data = json.load(open(path, encoding="utf-8"))
          if data.get("key") != key or not isinstance(data.get("binaries"), dict):
              raise SystemExit("completion manifest key or binaries object is invalid")
          for name in (
              "cmux-tui-aarch64-apple-darwin",
              "cmux-tui-app-host-aarch64-apple-darwin",
              "cmux-tui-cloud-server-aarch64-apple-darwin",
          ):
              if not re.fullmatch(r"[0-9a-f]{64}", data["binaries"].get(name, "")):
                  raise SystemExit(f"completion manifest is missing {name}")
          PY
          }
          if [[ -n "$OWNER_RUN_ID" ]]; then
            deadline=$(( $(date +%s) + 1800 ))
            while (( $(date +%s) < deadline )); do
              if tree_ready; then
                echo "Tree $KEY was published by run $OWNER_RUN_ID; skipping duplicate build."
                takeover=false
                break
              fi
              owner_state="$(curl --fail --silent --show-error --connect-timeout 5 --max-time 15 \
                -u "x-access-token:$GH_TOKEN" \
                -H 'Accept: application/vnd.github+json' \
                "$SERVER_URL/repos/$REPOSITORY/actions/runs/$OWNER_RUN_ID" \
                | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("status", "unknown"), d.get("conclusion", ""))' \
                2>/dev/null || echo unknown)"
              if [[ "$owner_state" == completed* || "$owner_state" == cancelled* || "$owner_state" == failure* ]]; then
                echo "Owner run $OWNER_RUN_ID ended before publishing tree $KEY; taking over."
                break
              fi
              echo "Waiting for owner run $OWNER_RUN_ID to publish tree $KEY."
              sleep 30
            done
            if [[ "$takeover" == true && $(date +%s) -ge "$deadline" ]]; then
              echo "::warning::owner wait expired for tree $KEY; taking over publication"
            fi
          else
            echo "This run owns tree $KEY; building and publishing it."
          fi
          echo "takeover=$takeover" >> "$GITHUB_OUTPUT"

  build:
    if: >-
      ${{ needs.tree-preflight.outputs.run_macos == 'true' &&
          needs.tree-owner-wait.outputs.takeover == 'true' &&
          (github.event_name != 'pull_request_target' || github.event.pull_request.head.repo.full_name == github.repository) }}
    needs: [tree-preflight, tree-owner-wait]
    # Once preflight has computed the immutable key, keep each workflow run in
    # its own group. The owner-wait job prevents duplicate same-key builds;
    # per-run groups ensure GitHub cannot replace a pending owner.
    concurrency:
      group: cmux-tui-build-${{ needs.tree-preflight.outputs.key }}-${{ github.sha }}
      cancel-in-progress: false
    permissions:
      contents: read
      # The reusable package workflow declares an optional attestation job.
      # Grant its permission ceiling even though this R2 lane disables npm
      # package attestations.
      id-token: write
      attestations: write
    uses: ./.github/workflows/cmux-tui-build-package.yml
    with:
      # Raw R2 artifacts are not npm releases and must never claim that an
      # older published package can reproduce their source contents.
      version: 0.0.0-r2.sha-${{ github.sha }}
      package_npm: false
      package_pypi: false
      # This lane publishes the raw cmux-tui, cmux-relay, and chatmux-relay
      # binaries. The Cloudflare Worker is a separate deployment artifact and
      # its npm audit must not block these commit-addressed files.
      # The Rust machine relay has no Windows PTY backend yet. Keep Windows on
      # the Node rollback lane until a tested backend exists; do not publish a
      # misleading Rust machine package or manifest entry.
      include_windows: false
      # Post-merge publication is off the PR critical path, so its two macOS
      # Rust legs run on the background lane (free GitHub-hosted capacity)
      # unless a dispatch names a runner. See docs/ci-runners.md.
      macos_runner: ${{ inputs.macos_runner || vars.MACOS_RUNNER_BACKGROUND || 'macos-15' }}
      checkout_ref: ${{ github.event.pull_request.merge_commit_sha || '' }}

  # The daemon tests the cmux-next app relies on (Rust tests named
  # cmux_next_), on the exact commit. publish-tree waits for them.
  cmux-next-daemon-tests:
    if: >-
      ${{ needs.tree-preflight.outputs.run_macos == 'true' &&
          needs.tree-owner-wait.outputs.takeover == 'true' &&
          (github.event_name != 'pull_request_target' || github.event.pull_request.head.repo.full_name == github.repository) }}
    needs: [tree-preflight, tree-owner-wait]
    concurrency:
      group: cmux-tui-daemon-${{ needs.tree-preflight.outputs.key }}-${{ github.sha }}
      # Keep every publisher alive, including a queued run. The complete-key
      # preflight skips duplicate work after the first complete run.
      cancel-in-progress: false
    name: cmux_next_ daemon tests (macOS)
    runs-on: ${{ inputs.macos_runner || vars.MACOS_RUNNER_BACKGROUND || 'macos-15' }}
    timeout-minutes: 60
    env:
      # Cargo's default registry retry is too small for a transient index DNS
      # outage. Keep the registry and git checkouts in the runner cache, then
      # make each bounded test attempt tolerant of a short crates.io outage.
      CARGO_NET_RETRY: "10"
      CARGO_HTTP_TIMEOUT: "120"
      CARGO_HTTP_MULTIPLEXING: "false"
    permissions:
      contents: read
    outputs:
      key: ${{ steps.key.outputs.key }}
      legacy_key: ${{ steps.key.outputs.legacy_key }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}

      - name: Tree key
        id: key
        env:
          EXPECTED_COMMIT: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_COMMIT" ]]
          key="$(scripts/cmux-next/pin-cmux-tui.sh key)"
          [[ "$key" =~ ^[0-9a-f]{40}$ ]]
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "cmux-tui tree key: $key"
          # CMUX-TUI-TREE-KEY-V2: the tree is also published under its v1 key
          # until the v1 write stops (B2), so older checkouts still find it.
          legacy_key="$(scripts/cmux-next/pin-cmux-tui.sh key --version v1)"
          [[ "$legacy_key" =~ ^[0-9a-f]{40}$ ]]
          echo "legacy_key=$legacy_key" >> "$GITHUB_OUTPUT"
          echo "cmux-tui v1 tree key: $legacy_key"

      - name: Use short temporary directory for macOS socket tests
        run: echo "TMPDIR=/tmp" >> "$GITHUB_ENV"

      - name: Init ghostty submodule
        run: git submodule update --init --depth 1 ghostty-next

      - name: Install zig
        env:
          GHOSTTY_ZIG_SOURCE: ghostty-next
        run: ./scripts/install-zig-ci.sh

      - name: Set up pinned Rust
        uses: ./.github/actions/setup-cmux-tui-rust

      - name: Cache cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: cmux-tui -> target
          shared-key: cmux-tui-macos
          cache-all-crates: true

      - name: cargo test cmux_next_
        working-directory: cmux-tui
        shell: bash
        run: |
          set -euo pipefail
          status=1
          for attempt in 1 2 3; do
            rm -f "$RUNNER_TEMP/cmux-next-tests.txt"
            if cargo test --workspace --locked cmux_next_ -- --list > "$RUNNER_TEMP/cmux-next-tests.txt" \
              && grep -qE ': test$' "$RUNNER_TEMP/cmux-next-tests.txt" \
              && cargo test --workspace --locked cmux_next_; then
              status=0
              break
            fi
            status=$?
            if [[ "$attempt" -lt 3 ]]; then
              echo "cmux_next_ daemon tests failed on attempt $attempt/3; retrying Cargo registry and build fetches" >&2
              sleep $((attempt * 10))
            fi
          done
          if [[ "$status" -ne 0 ]]; then
            echo "::error::cmux_next_ daemon tests failed after 3 attempts" >&2
            exit "$status"
          fi

  # Failed runs are retried by cmux-tui-artifacts-retry.yml after they
  # complete (a run cannot rerun itself while it is in progress), never for an
  # immutable R2 conflict.

  publish-ref-notice:
    # A branch outside main / feat-cmux-next / cmux-tui-pin-* cannot use the
    # artifacts environment, so its publish jobs are skipped, not failed.
    name: publish skipped (branch not allowed)
    if: github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && !(github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat-cmux-next' || startsWith(github.ref, 'refs/heads/cmux-tui-pin-'))
    needs: build
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 2
    steps:
      - name: Explain how to publish this commit
        env:
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          short="${SHA:0:12}"
          echo "::notice title=publish skipped::${REF_NAME} is build-only. Use a cmux-tui-pin-* branch to publish: git push origin ${SHA}:refs/heads/cmux-tui-pin-${short}"

  publish:
    # R2 upload credentials only. A commit-addressed cmux-tui build is not a
    # production release: cmux-next pins daemon builds from helper branches.
    # The artifacts environment's deployment branch policy allows main,
    # feat-cmux-next and cmux-tui-pin-*; signing, Sparkle, Homebrew and Apple
    # secrets stay in the release environment.
    environment: artifacts
    name: publish to R2
    # PR runs of this workflow only validate the build. Only the refs the
    # artifacts environment admits publish; a dispatch from any other branch
    # is a green build-only run (publish-ref-notice says how to publish).
    if: github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat-cmux-next' || startsWith(github.ref, 'refs/heads/cmux-tui-pin-'))
    needs: build
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Download cmux-tui binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: cmux-tui-*
          path: assets/cmux-tui
          merge-multiple: true

      - name: Download cmux-relay binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: cmux-relay-*
          path: assets/cmux-relay
          merge-multiple: true

      - name: Download chatmux-relay binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: chatmux-relay-*
          path: assets/chatmux-relay
          merge-multiple: true

      - name: Build manifest and checksums
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || {
            echo "checkout HEAD does not match the requested source commit" >&2
            exit 1
          }
          build_manifest() {
            local directory="$1"
            local binary_prefix="$2"
            local checksums="$3"
            local dependency_manifest="${4:-}"
            local commit_time
            if [[ -n "$dependency_manifest" ]]; then
              # The manifest builder changes directory before Python opens the
              # dependency. Canonicalize now so the machine manifest does not
              # accidentally look below assets/chatmux-relay/assets/.
              dependency_manifest="$(cd "$(dirname "$dependency_manifest")" && pwd)/$(basename "$dependency_manifest")"
            fi
            commit_time="$(git show -s --format=%cI "$GITHUB_SHA")"
            release_url=""
            if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
              release_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}"
            fi
            (
              cd "$directory"
              chmod 0755 "${binary_prefix}"*
              sha256sum "${binary_prefix}"* > "$checksums"
              python3 - "$GITHUB_SHA" "$binary_prefix" "$commit_time" "$dependency_manifest" \
                "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$release_url" <<'PY'
          import hashlib, json, os, sys
          from datetime import datetime
          files = sorted(
              f for f in os.listdir(".")
              if f.startswith(sys.argv[2]) and not f.endswith(".txt")
          )
          def runtime_for(filename):
              """Describe the runtime of this exact published binary.

              Linux compatibility-name copies still contain the musl-linked
              binary, so infer libc from the build artifact set rather than
              the target name alone.
              """
              target = filename.removeprefix(sys.argv[2]).removeprefix("hook-").removeprefix("acpmux-").removeprefix("app-host-").removeprefix("cloud-server-").removeprefix("browser-host-").removesuffix(".exe")
              if "apple-darwin" in target:
                  return {"os": "macos", "architecture": "arm64" if target.startswith("aarch64") else "x86_64", "libc": "none"}
              if "windows" in target:
                  return {"os": "windows", "architecture": "x86_64", "libc": "none"}
              return {
                  "os": "linux",
                  "architecture": "arm64" if target.startswith("aarch64") else "x86_64",
                  "libc": "musl",
              }

          server_url, repository, run_id, release_url = sys.argv[5:9]
          if not server_url or not repository or not run_id:
              raise SystemExit("GitHub provenance context is incomplete")
          source_repository = f"{server_url.rstrip('/')}/{repository}"
          manifest = {
              "commit": sys.argv[1],
              # Keep immutable SHA uploads byte-identical across a safe rerun.
              "builtAt": datetime.fromisoformat(sys.argv[3]).isoformat(),
              "sourceRepository": source_repository,
              "sourceCommit": sys.argv[1],
              "attestationUrl": f"{source_repository}/actions/runs/{run_id}",
              # A manual SHA publication is not a GitHub Release. Stable tag
              # runs fill this URL; null is explicit and prevents consumers
              # from mistaking a branch artifact for a release.
              "releaseUrl": release_url or None,
              # Keep distribution metadata next to the digest map. Consumers
              # can reject an artifact whose runtime contract they cannot
              # satisfy without guessing from the filename.
              "license": "GPL-3.0-or-later",
              # Runtime constraints are per binary. Some GNU target-named
              # files are compatibility-name copies of musl-linked binaries.
              # `libc` is explicit for every runtime. `none` marks platforms
              # where a C library does not constrain compatibility.
              "runtimeByBinary": {f: runtime_for(f) for f in files},
              "binaries": {
                  f: hashlib.sha256(open(f, "rb").read()).hexdigest() for f in files
              },
          }
          dependency_manifest_path = sys.argv[4]
          if dependency_manifest_path:
              with open(dependency_manifest_path) as dependency_file:
                  dependency = json.load(dependency_file)
              required_dependency_files = [
                  "cmux-tui-aarch64-apple-darwin",
                  "cmux-tui-x86_64-apple-darwin",
                  "cmux-tui-x86_64-unknown-linux-musl",
                  "cmux-tui-aarch64-unknown-linux-musl",
              ]
              dependency_binaries = dependency.get("binaries", {})
              missing = [
                  name for name in required_dependency_files
                  if not isinstance(dependency_binaries, dict)
                  or name not in dependency_binaries
              ]
              if missing:
                  raise SystemExit(
                      "cmux-tui dependency manifest is missing: " + ", ".join(missing)
                  )
              dependency_commit = dependency.get("commit")
              if dependency_commit != sys.argv[1]:
                  raise SystemExit(
                      f"cmux-tui dependency commit {dependency_commit!r} "
                      f"does not match {sys.argv[1]!r}"
                  )
              dependency_base = f"https://files.cmux.com/cmux-tui/{sys.argv[1]}"
              manifest["dependencies"] = {
                  "cmux-tui": {
                      "commit": dependency_commit,
                      "manifest": f"{dependency_base}/manifest.json",
                      "binaries": {
                          name: {
                              "url": f"{dependency_base}/{name}",
                              "sha256": dependency_binaries[name],
                          }
                          for name in required_dependency_files
                      },
                  }
              }
          with open("manifest.json", "w") as out:
              json.dump(manifest, out, indent=2)
          print(json.dumps(manifest, indent=2))
          PY
            )
          }

          build_machine_manifest() {
            local directory="$1"
            local dependency_directory="$2"
            directory="$(cd "$directory" && pwd)"
            dependency_directory="$(cd "$dependency_directory" && pwd)"
            local version="0.0.0-r2.sha-${GITHUB_SHA}"
            local release_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/chatmux-relay-r2-${GITHUB_SHA}"
            local workflow_run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            python3 - "$directory" "$dependency_directory" "$GITHUB_SHA" "$version" \
              "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$release_url" "$workflow_run_url" <<'PY'
          import hashlib
          import json
          import pathlib
          import sys
          from typing import Any

          directory = pathlib.Path(sys.argv[1])
          dependency_directory = pathlib.Path(sys.argv[2])
          source_commit = sys.argv[3]
          version = sys.argv[4]
          server_url = sys.argv[5].rstrip("/")
          repository = sys.argv[6]
          run_id = sys.argv[7]
          release_url = sys.argv[8]
          workflow_run_url = sys.argv[9]
          if not source_commit or not run_id:
              raise SystemExit("source commit and workflow run are required")
          source_repository = f"{server_url}/{repository}"
          if not source_repository.startswith("https://github.com/"):
              raise SystemExit("machine manifest requires a GitHub source repository")
          targets = (
              "aarch64-apple-darwin",
              "x86_64-apple-darwin",
              "x86_64-unknown-linux-musl",
              "aarch64-unknown-linux-musl",
          )

          def record(path: pathlib.Path, name: str, prefix: str) -> dict[str, Any]:
              if path.name != name or not path.is_file():
                  raise SystemExit(f"missing machine artifact: {path}")
              return {
                  "name": name,
                  "url": f"https://files.cmux.com/{prefix}/{source_commit}/{name}",
                  "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                  "size": path.stat().st_size,
              }

          artifacts: dict[str, dict[str, dict[str, Any]]] = {}
          for target in targets:
              relay_name = f"chatmux-relay-{target}"
              tui_name = f"cmux-tui-{target}"
              artifacts[target] = {
                  "chatmux-relay": record(directory / relay_name, relay_name, "chatmux-relay"),
                  "cmux-tui": record(dependency_directory / tui_name, tui_name, "chatmux-relay"),
              }

          manifest = {
              "schemaVersion": 1,
              "sourceRepository": source_repository,
              "sourceCommit": source_commit,
              "version": version,
              "workflowRunUrl": workflow_run_url,
              "releaseUrl": release_url,
              "artifacts": artifacts,
          }
          (directory / "manifest.json").write_text(json.dumps(manifest, indent=2) + "\n")
          print(json.dumps(manifest, indent=2))
          PY
          }

          machine_targets=(
            aarch64-apple-darwin
            x86_64-apple-darwin
            x86_64-unknown-linux-musl
            aarch64-unknown-linux-musl
          )
          for target in "${machine_targets[@]}"; do
            cp "assets/cmux-tui/cmux-tui-${target}" "assets/chatmux-relay/cmux-tui-${target}"
          done
          build_manifest assets/cmux-tui cmux-tui- cmux-tui-checksums.txt
          build_manifest assets/cmux-relay cmux-relay- cmux-relay-checksums.txt
          build_machine_manifest assets/chatmux-relay assets/cmux-tui

      - name: Verify Unix manifests before upload
        run: |
          set -euo pipefail
          python3 cmux-tui/scripts/verify_published_manifest.py \
            --manifest-file assets/cmux-tui/manifest.json \
            --expected-commit "$GITHUB_SHA" \
            --require-provenance \
            --require-artifact cmux-tui-aarch64-apple-darwin \
            --require-artifact cmux-tui-x86_64-apple-darwin \
            --require-artifact cmux-tui-x86_64-unknown-linux-musl \
            --require-artifact cmux-tui-aarch64-unknown-linux-musl \
            --require-artifact cmux-tui-acpmux-aarch64-apple-darwin \
            --require-artifact cmux-tui-acpmux-x86_64-apple-darwin \
            --require-artifact cmux-tui-app-host-aarch64-apple-darwin \
            --require-artifact cmux-tui-app-host-x86_64-apple-darwin \
            --require-artifact cmux-tui-app-host-x86_64-unknown-linux-musl \
            --require-artifact cmux-tui-app-host-aarch64-unknown-linux-musl \
            --require-artifact cmux-tui-cloud-server-aarch64-apple-darwin \
            --require-artifact cmux-tui-cloud-server-x86_64-apple-darwin \
            --require-artifact cmux-tui-browser-host-aarch64-apple-darwin \
            --require-artifact cmux-tui-browser-host-x86_64-apple-darwin \
            --forbid-artifact cmux-tui-x86_64-pc-windows-gnu.exe \
            --forbid-artifact cmux-tui-hook-x86_64-pc-windows-gnu.exe \
            --artifact-directory assets/cmux-tui
          python3 cmux-tui/scripts/verify_published_manifest.py \
            --manifest-file assets/cmux-relay/manifest.json \
            --expected-commit "$GITHUB_SHA" \
            --require-provenance \
            --require-artifact cmux-relay-aarch64-apple-darwin \
            --require-artifact cmux-relay-x86_64-apple-darwin \
            --require-artifact cmux-relay-x86_64-unknown-linux-musl \
            --require-artifact cmux-relay-aarch64-unknown-linux-musl \
            --forbid-artifact cmux-relay-x86_64-pc-windows-gnu.exe \
            --artifact-directory assets/cmux-relay
          python3 cmux-tui/scripts/verify_published_manifest.py \
            --manifest-file assets/chatmux-relay/manifest.json \
            --expected-commit "$GITHUB_SHA" \
            --machine-manifest \
            --artifact-directory assets/chatmux-relay

      - name: Attest raw binary subjects
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: |
            assets/cmux-tui/cmux-tui-*
            assets/cmux-tui/manifest.json
            assets/cmux-relay/cmux-relay-*
            assets/cmux-relay/manifest.json
            assets/chatmux-relay/chatmux-relay-*
            assets/chatmux-relay/cmux-tui-*
            assets/chatmux-relay/manifest.json
          # These are file subjects, not OCI images. No artifact-metadata
          # storage records are created for this R2 publication.
          push-to-registry: false

      - name: Upload to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: "https://${{ secrets.CF_R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
        run: |
          set -euo pipefail
          publish_prefix() {
            local directory="$1"
            local prefix="$2"
            local cache="$3"
            local write_once="$4"
            for file in "$directory"/*; do
              upload_args=()
              if [[ "$write_once" == "true" ]]; then
                upload_args+=(--write-once)
              fi
              python3 scripts/ci/upload-r2-object.py "${upload_args[@]}" \
                --file "$file" \
                --endpoint-url "$R2_ENDPOINT" \
                --bucket cmux-binaries \
                --key "$prefix/$(basename "$file")" \
                --cache-control "$cache"
            done
          }
          publish_prefix assets/cmux-tui "cmux-tui/$GITHUB_SHA" "public, max-age=31536000, immutable" true
          publish_prefix assets/cmux-relay "cmux-relay/$GITHUB_SHA" "public, max-age=31536000, immutable" true
          publish_prefix assets/chatmux-relay "chatmux-relay/$GITHUB_SHA" "public, max-age=31536000, immutable" true
          echo "Published: https://files.cmux.com/cmux-tui/$GITHUB_SHA/manifest.json"
          echo "Published: https://files.cmux.com/cmux-relay/$GITHUB_SHA/manifest.json"
          echo "Published: https://files.cmux.com/chatmux-relay/$GITHUB_SHA/manifest.json"

          # Transitional double-publish under the pre-rename prefix and binary
          # names: out-of-repo consumers (cmux-cloud bootstrap/install-mux.sh
          # and snapshot builders) still curl files.cmux.com/mux/<ref>/cmux-mux-*.
          # Remove once cmux-cloud switches to the cmux-tui prefix
          # (https://github.com/manaflow-ai/cmux-cloud/pull/2).
          legacy_assets="assets-legacy"
          mkdir -p "$legacy_assets"
          for file in assets/cmux-tui/cmux-tui-*; do
            if [[ "$(basename "$file")" == cmux-tui-hook-* || "$(basename "$file")" == cmux-tui-acpmux-* || "$(basename "$file")" == cmux-tui-app-host-* || "$(basename "$file")" == cmux-tui-cloud-server-* || "$(basename "$file")" == cmux-tui-browser-host-* ]]; then
              continue
            fi
            cp "$file" "$legacy_assets/$(basename "$file" | sed 's/^cmux-tui-/cmux-mux-/')"
          done
          commit_time="$(git show -s --format=%cI "$GITHUB_SHA")"
          python3 - "$GITHUB_SHA" "$legacy_assets" "$commit_time" <<'PY'
          import hashlib
          import json
          import pathlib
          import sys
          from datetime import datetime

          root = pathlib.Path(sys.argv[2])
          files = sorted(path for path in root.glob("cmux-mux-*") if path.is_file())
          def runtime_for(filename):
              target = filename.removeprefix("cmux-mux-").removeprefix("hook-").removesuffix(".exe")
              if "apple-darwin" in target:
                  return {"os": "macos", "architecture": "arm64" if target.startswith("aarch64") else "x86_64", "libc": "none"}
              if "windows" in target:
                  return {"os": "windows", "architecture": "x86_64", "libc": "none"}
              return {
                  "os": "linux",
                  "architecture": "arm64" if target.startswith("aarch64") else "x86_64",
                  "libc": "musl",
              }

          manifest = {
              "commit": sys.argv[1],
              "builtAt": datetime.fromisoformat(sys.argv[3]).isoformat(),
              "license": "GPL-3.0-or-later",
              "runtimeByBinary": {path.name: runtime_for(path.name) for path in files},
              "binaries": {
                  path.name: hashlib.sha256(path.read_bytes()).hexdigest() for path in files
              },
          }
          (root / "manifest.json").write_text(json.dumps(manifest, indent=2) + "\n")
          PY
          publish_legacy_prefix() {
            local prefix="$1"
            local cache="$2"
            for file in "$legacy_assets"/*; do
              python3 scripts/ci/upload-r2-object.py --write-once \
                --file "$file" \
                --endpoint-url "$R2_ENDPOINT" \
                --bucket cmux-binaries \
                --key "$prefix/$(basename "$file")" \
                --cache-control "$cache"
            done
          }
          publish_legacy_prefix "mux/$GITHUB_SHA" "public, max-age=31536000, immutable"

      - name: Verify immutable Unix manifests before latest publish
        run: |
          set -euo pipefail
          python3 cmux-tui/scripts/verify_published_manifest.py \
            --manifest-url "https://files.cmux.com/cmux-tui/$GITHUB_SHA/manifest.json" \
            --expected-commit "$GITHUB_SHA" \
            --require-provenance \
            --require-artifact cmux-tui-aarch64-apple-darwin \
            --require-artifact cmux-tui-x86_64-apple-darwin \
            --require-artifact cmux-tui-x86_64-unknown-linux-musl \
            --require-artifact cmux-tui-aarch64-unknown-linux-musl \
            --require-artifact cmux-tui-app-host-aarch64-apple-darwin \
            --require-artifact cmux-tui-app-host-x86_64-apple-darwin \
            --require-artifact cmux-tui-app-host-x86_64-unknown-linux-musl \
            --require-artifact cmux-tui-app-host-aarch64-unknown-linux-musl \
            --require-artifact cmux-tui-cloud-server-aarch64-apple-darwin \
            --require-artifact cmux-tui-cloud-server-x86_64-apple-darwin \
            --require-artifact cmux-tui-browser-host-aarch64-apple-darwin \
            --require-artifact cmux-tui-browser-host-x86_64-apple-darwin \
            --forbid-artifact cmux-tui-x86_64-pc-windows-gnu.exe \
            --forbid-artifact cmux-tui-hook-x86_64-pc-windows-gnu.exe \
            --artifact-base-url "https://files.cmux.com/cmux-tui/$GITHUB_SHA"
          python3 cmux-tui/scripts/verify_published_manifest.py \
            --manifest-url "https://files.cmux.com/cmux-relay/$GITHUB_SHA/manifest.json" \
            --expected-commit "$GITHUB_SHA" \
            --require-provenance \
            --require-artifact cmux-relay-aarch64-apple-darwin \
            --require-artifact cmux-relay-x86_64-apple-darwin \
            --require-artifact cmux-relay-x86_64-unknown-linux-musl \
            --require-artifact cmux-relay-aarch64-unknown-linux-musl \
            --forbid-artifact cmux-relay-x86_64-pc-windows-gnu.exe \
            --artifact-base-url "https://files.cmux.com/cmux-relay/$GITHUB_SHA"
          python3 cmux-tui/scripts/verify_published_manifest.py \
            --manifest-url "https://files.cmux.com/chatmux-relay/$GITHUB_SHA/manifest.json" \
            --expected-commit "$GITHUB_SHA" \
            --machine-manifest \
            --artifact-base-url "https://files.cmux.com/chatmux-relay/$GITHUB_SHA"

      - name: Publish rolling latest artifacts
        if: github.ref == 'refs/heads/main'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: "https://${{ secrets.CF_R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
        run: |
          set -euo pipefail
          publish_prefix() {
            local directory="$1"
            local prefix="$2"
            local cache="$3"
            local write_once="${4:-false}"
            upload_file() {
              local file="$1"
              local -a upload_args=()
              if [[ "$write_once" == "true" ]]; then
                upload_args+=(--write-once)
              fi
              python3 scripts/ci/upload-r2-object.py "${upload_args[@]}" \
                --file "$file" \
                --endpoint-url "$R2_ENDPOINT" \
                --bucket cmux-binaries \
                --key "$prefix/$(basename "$file")" \
                --cache-control "$cache"
            }
            for file in "$directory"/*; do
              [[ "$(basename "$file")" == manifest.json ]] && continue
              upload_file "$file"
            done
            upload_file "$directory/manifest.json"
          }
          publish_prefix assets/cmux-tui "cmux-tui/latest" "no-cache, no-store, must-revalidate" false
          publish_prefix assets/cmux-relay "cmux-relay/latest" "no-cache, no-store, must-revalidate" false
          publish_prefix assets/chatmux-relay "chatmux-relay/latest" "no-cache, no-store, must-revalidate" false

          publish_legacy_prefix() {
            local prefix="$1"
            local cache="$2"
            for file in assets-legacy/*; do
              python3 scripts/ci/upload-r2-object.py \
                --file "$file" \
                --endpoint-url "$R2_ENDPOINT" \
                --bucket cmux-binaries \
                --key "$prefix/$(basename "$file")" \
                --cache-control "$cache"
            done
          }
          publish_legacy_prefix "mux/latest" "no-cache, no-store, must-revalidate"

      - name: Verify published Unix manifests
        run: |
          set -euo pipefail
          python3 cmux-tui/scripts/verify_published_manifest.py \
            --manifest-url "https://files.cmux.com/cmux-tui/$GITHUB_SHA/manifest.json" \
            --expected-commit "$GITHUB_SHA" \
            --require-provenance \
            --require-artifact cmux-tui-aarch64-apple-darwin \
            --require-artifact cmux-tui-x86_64-apple-darwin \
            --require-artifact cmux-tui-x86_64-unknown-linux-musl \
            --require-artifact cmux-tui-aarch64-unknown-linux-musl \
            --require-artifact cmux-tui-app-host-aarch64-apple-darwin \
            --require-artifact cmux-tui-app-host-x86_64-apple-darwin \
            --require-artifact cmux-tui-app-host-x86_64-unknown-linux-musl \
            --require-artifact cmux-tui-app-host-aarch64-unknown-linux-musl \
            --require-artifact cmux-tui-cloud-server-aarch64-apple-darwin \
            --require-artifact cmux-tui-cloud-server-x86_64-apple-darwin \
            --require-artifact cmux-tui-browser-host-aarch64-apple-darwin \
            --require-artifact cmux-tui-browser-host-x86_64-apple-darwin \
            --forbid-artifact cmux-tui-x86_64-pc-windows-gnu.exe \
            --forbid-artifact cmux-tui-hook-x86_64-pc-windows-gnu.exe \
            --artifact-base-url "https://files.cmux.com/cmux-tui/$GITHUB_SHA"
          python3 cmux-tui/scripts/verify_published_manifest.py \
            --manifest-url "https://files.cmux.com/cmux-relay/$GITHUB_SHA/manifest.json" \
            --expected-commit "$GITHUB_SHA" \
            --require-provenance \
            --require-artifact cmux-relay-aarch64-apple-darwin \
            --require-artifact cmux-relay-x86_64-apple-darwin \
            --require-artifact cmux-relay-x86_64-unknown-linux-musl \
            --require-artifact cmux-relay-aarch64-unknown-linux-musl \
            --forbid-artifact cmux-relay-x86_64-pc-windows-gnu.exe \
            --artifact-base-url "https://files.cmux.com/cmux-relay/$GITHUB_SHA"
          python3 cmux-tui/scripts/verify_published_manifest.py \
            --manifest-url "https://files.cmux.com/chatmux-relay/$GITHUB_SHA/manifest.json" \
            --expected-commit "$GITHUB_SHA" \
            --machine-manifest \
            --artifact-base-url "https://files.cmux.com/chatmux-relay/$GITHUB_SHA"
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            python3 cmux-tui/scripts/verify_published_manifest.py \
              --manifest-url "https://files.cmux.com/cmux-tui/latest/manifest.json?verify=$GITHUB_SHA" \
              --expected-commit "$GITHUB_SHA" \
              --require-provenance \
              --require-artifact cmux-tui-aarch64-apple-darwin \
              --require-artifact cmux-tui-x86_64-apple-darwin \
              --require-artifact cmux-tui-x86_64-unknown-linux-musl \
              --require-artifact cmux-tui-aarch64-unknown-linux-musl \
              --require-artifact cmux-tui-app-host-aarch64-apple-darwin \
              --require-artifact cmux-tui-app-host-x86_64-apple-darwin \
              --require-artifact cmux-tui-app-host-x86_64-unknown-linux-musl \
              --require-artifact cmux-tui-app-host-aarch64-unknown-linux-musl \
              --require-artifact cmux-tui-cloud-server-aarch64-apple-darwin \
              --require-artifact cmux-tui-cloud-server-x86_64-apple-darwin \
              --require-artifact cmux-tui-browser-host-aarch64-apple-darwin \
              --require-artifact cmux-tui-browser-host-x86_64-apple-darwin \
              --forbid-artifact cmux-tui-x86_64-pc-windows-gnu.exe \
              --forbid-artifact cmux-tui-hook-x86_64-pc-windows-gnu.exe \
              --artifact-base-url "https://files.cmux.com/cmux-tui/latest"
            python3 cmux-tui/scripts/verify_published_manifest.py \
              --manifest-url "https://files.cmux.com/cmux-relay/latest/manifest.json?verify=$GITHUB_SHA" \
              --expected-commit "$GITHUB_SHA" \
              --require-provenance \
              --require-artifact cmux-relay-aarch64-apple-darwin \
              --require-artifact cmux-relay-x86_64-apple-darwin \
              --require-artifact cmux-relay-x86_64-unknown-linux-musl \
              --require-artifact cmux-relay-aarch64-unknown-linux-musl \
              --forbid-artifact cmux-relay-x86_64-pc-windows-gnu.exe \
              --artifact-base-url "https://files.cmux.com/cmux-relay/latest"
            python3 cmux-tui/scripts/verify_published_manifest.py \
              --manifest-url "https://files.cmux.com/chatmux-relay/latest/manifest.json?verify=$GITHUB_SHA" \
              --expected-commit "$GITHUB_SHA" \
              --machine-manifest \
              --artifact-base-url "https://files.cmux.com/chatmux-relay/latest"
          fi

  # The source-addressed copy cmux-next dev, tagged and nightly builds fetch
  # (scripts/cmux-next/pin-cmux-tui.sh fetch). Published only after the build,
  # the commit-addressed publication and the cmux_next_ daemon tests of this
  # commit pass. A key is published once: the first passing commit with a tree
  # wins, and a later commit with the same tree keeps that binary.
  publish-tree:
    environment: artifacts
    name: publish tree-addressed cmux-tui
    if: github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat-cmux-next' || startsWith(github.ref, 'refs/heads/cmux-tui-pin-'))
    needs: [build, publish, cmux-next-daemon-tests]
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 15
    # Ownership is elected before expensive work. Keep publication per run
    # because GitHub replaces older pending jobs in a key-only group; the
    # write-once uploader makes a rare election race safe.
    concurrency:
      group: cmux-tui-tree-${{ needs.cmux-next-daemon-tests.outputs.key }}-${{ github.sha }}
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Download the macOS arm64 cmux-tui
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cmux-tui-aarch64-apple-darwin
          path: assets/tree

      - name: Publish the complete tree with the trusted helper
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: "https://${{ secrets.CF_R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
          KEY_V2: ${{ needs.cmux-next-daemon-tests.outputs.key }}
          LEGACY_KEY: ${{ needs.cmux-next-daemon-tests.outputs.legacy_key }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          # This run's downloaded build, kept apart: a call that completes an
          # existing publication overwrites assets/tree with that commit's
          # binaries, and the next call must start from this run's again.
          rm -rf assets/run
          cp -R assets/tree assets/run
          # Publishes the tree under KEY, which must be this checkout's key
          # of that version (CMUX-TUI-TREE-KEY-V2: v2, then v1 until B2).
          publish_tree() {
          local KEY="$1" version="$2" base source_args source_commit
          [[ "$(scripts/cmux-next/pin-cmux-tui.sh key --version "$version")" == "$KEY" ]] || {
            echo "tree key $KEY does not match this checkout's $version key; see cmuxterm-hq REPAIR.md#cmux-tui-tree-publication" >&2
            exit 1; }
          rm -rf tree assets/tree
          cp -R assets/run assets/tree
          base="https://files.cmux.com/cmux-tui/tree/$KEY"
          fetch() { curl -fsSL --proto '=https' --connect-timeout 20 --max-time 120 "$1?verify=$GITHUB_RUN_ID" -o "$2"; }
          fetch "https://files.cmux.com/cmux-tui/$GITHUB_SHA/manifest.json" manifest.json
          mkdir -p tree
          if fetch "$base/source.json" tree/source.json 2>/dev/null; then
            source_args=(--source-file tree/source.json)
            source_commit="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["commit"])' tree/source.json)"
            [[ "$source_commit" =~ ^[0-9a-f]{40}$ ]] || { echo "malformed tree source commit; see cmuxterm-hq REPAIR.md#cmux-tui-tree-publication" >&2; exit 1; }
            fetch "https://files.cmux.com/cmux-tui/$source_commit/manifest.json" manifest.json
            for asset in cmux-tui-aarch64-apple-darwin cmux-tui-app-host-aarch64-apple-darwin cmux-tui-cloud-server-aarch64-apple-darwin; do
              fetch "https://files.cmux.com/cmux-tui/$source_commit/$asset" "assets/tree/$asset"
            done
          else
            source_commit="$GITHUB_SHA"
            python3 - "$KEY" "$GITHUB_SHA" manifest.json > tree/source.json <<'PY'
          import json, os, subprocess, sys
          key, commit, manifest_path = sys.argv[1:]
          manifest = json.load(open(manifest_path))
          names = ("cmux-tui-aarch64-apple-darwin", "cmux-tui-app-host-aarch64-apple-darwin", "cmux-tui-cloud-server-aarch64-apple-darwin")
          def rev(spec):
              return subprocess.check_output(["git", "rev-parse", spec], text=True).strip()
          print(json.dumps({
              "key": key,
              "cmuxTuiTree": rev("HEAD:cmux-tui"),
              "ghosttyCommit": rev("HEAD:ghostty"),
              "ghosttyNextCommit": rev("HEAD:ghostty-next"),
              "commit": commit,
              "run": os.environ["GITHUB_RUN_ID"],
              "runUrl": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              "binaries": {name: manifest["binaries"][name] for name in names},
          }, indent=2))
          PY
            source_args=(--source-file tree/source.json --publish-source)
          fi
          python3 scripts/ci/publish-cmux-tui-tree.py \
            --key "$KEY" \
            --source-commit "$source_commit" \
            --assets-dir assets/tree \
            --manifest-file manifest.json \
            "${source_args[@]}" \
            --uploader scripts/ci/upload-r2-object.py \
            --endpoint-url "$R2_ENDPOINT" \
            --bucket cmux-binaries
          }
          publish_tree "$KEY_V2" v2
          if [[ -n "$LEGACY_KEY" && "$LEGACY_KEY" != "$KEY_V2" ]]; then
            publish_tree "$LEGACY_KEY" v1
          fi

      - name: Verify the tree publication
        env:
          KEY: ${{ needs.cmux-next-daemon-tests.outputs.key }}
          LEGACY_KEY: ${{ needs.cmux-next-daemon-tests.outputs.legacy_key }}
        run: |
          set -euo pipefail
          verify_tree() {
          local base="https://files.cmux.com/cmux-tui/tree/$1" name=cmux-tui-aarch64-apple-darwin published_sha
          curl -fsSL --proto '=https' -o published "$base/$name?verify=$GITHUB_RUN_ID"
          published_sha="$(curl -fsSL --proto '=https' "$base/$name.sha256?verify=$GITHUB_RUN_ID" | awk 'NR==1{print $1}')"
          [[ "$(sha256sum published | awk '{print $1}')" == "$published_sha" ]]
          curl -fsSL --proto '=https' "$base/source.json?verify=$GITHUB_RUN_ID"
          echo "Verified: $base/$name"
          }
          verify_tree "$KEY"
          # CMUX-TUI-TREE-KEY-V2: the v1 publication too, until B2.
          if [[ -n "$LEGACY_KEY" && "$LEGACY_KEY" != "$KEY" ]]; then
            verify_tree "$LEGACY_KEY"
          fi

  # A same-repository pull request is built by the trusted pull_request_target
  # workflow above. The build job has no R2 credentials; this job receives only
  # its opaque arm64 binary and uses the base checkout's uploader. The merge
  # tree is inspected with git plumbing, never by executing PR-controlled
  # scripts, before the write-once tree key is published.
  publish-pr-tree:
    environment: artifacts
    name: publish pull request tree-addressed cmux-tui
    if: github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name == github.repository
    needs: [build, cmux-next-daemon-tests]
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-4vcpu-ubuntu-2404' || vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 15
    concurrency:
      group: cmux-tui-tree-${{ needs.cmux-next-daemon-tests.outputs.key }}
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Download the PR cmux-tui binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cmux-tui-aarch64-apple-darwin
          path: assets/tree

      - name: Publish the PR tree with the trusted helper
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: "https://${{ secrets.CF_R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
          KEY: ${{ needs.cmux-next-daemon-tests.outputs.key }}
          SOURCE_COMMIT: ${{ github.event.pull_request.merge_commit_sha }}
          BASE_COMMIT: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE_COMMIT"
          git fetch --no-tags origin "$SOURCE_COMMIT"
          [[ "$(git cat-file -t "$SOURCE_COMMIT")" == commit ]]
          computed_key="$(python3 scripts/ci/cmux_tui_tree_key.py "$SOURCE_COMMIT")"
          [[ "$computed_key" == "$KEY" ]] || {
            echo "PR tree key $KEY does not match trusted merge-tree calculation $computed_key; see cmuxterm-hq REPAIR.md#cmux-tui-tree-publication" >&2
            exit 1
          }
          tui_tree="$(git rev-parse "$SOURCE_COMMIT:cmux-tui")"
          ghostty_commit="$(git rev-parse "$SOURCE_COMMIT:ghostty")"
          ghostty_next_commit="$(git rev-parse --verify "$SOURCE_COMMIT:ghostty-next" 2>/dev/null || true)"
          mkdir -p assets/tree tree
          uploader="$RUNNER_TEMP/upload-r2-object.py"
          helper="$RUNNER_TEMP/publish-cmux-tui-tree.py"
          git show "$BASE_COMMIT:scripts/ci/upload-r2-object.py" > "$uploader"
          git show "$BASE_COMMIT:scripts/ci/publish-cmux-tui-tree.py" > "$helper"
          chmod 0755 "$uploader" "$helper"
          base="https://files.cmux.com/cmux-tui/tree/$KEY"
          fetch() { curl -fsSL --proto '=https' --connect-timeout 20 --max-time 120 "$1?verify=$GITHUB_RUN_ID" -o "$2"; }
          source_commit="$SOURCE_COMMIT"
          if fetch "$base/source.json" tree/existing-source.json 2>/dev/null; then
            source_args=(--source-file tree/existing-source.json)
            source_commit="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["commit"])' tree/existing-source.json)"
            [[ "$source_commit" =~ ^[0-9a-f]{40}$ ]] || { echo "malformed tree source commit; see cmuxterm-hq REPAIR.md#cmux-tui-tree-publication" >&2; exit 1; }
            fetch "https://files.cmux.com/cmux-tui/$source_commit/manifest.json" manifest.json
            for asset in cmux-tui-aarch64-apple-darwin cmux-tui-app-host-aarch64-apple-darwin cmux-tui-cloud-server-aarch64-apple-darwin; do
              fetch "https://files.cmux.com/cmux-tui/$source_commit/$asset" "assets/tree/$asset"
            done
          else
            source_args=(--source-file tree/source.json --publish-source)
          fi
          python3 - "$source_commit" "$KEY" > manifest.json.tmp <<'PY'
          import hashlib, json, pathlib, sys
          commit, key = sys.argv[1:]
          names = ("cmux-tui-aarch64-apple-darwin", "cmux-tui-app-host-aarch64-apple-darwin", "cmux-tui-cloud-server-aarch64-apple-darwin")
          binaries = {}
          for name in names:
              path = pathlib.Path("assets/tree") / name
              if not path.is_file():
                  raise SystemExit(f"missing opaque build companion {name}; see cmuxterm-hq REPAIR.md#cmux-tui-tree-publication")
              binaries[name] = hashlib.sha256(path.read_bytes()).hexdigest()
          print(json.dumps({"commit": commit, "key": key, "binaries": binaries}, indent=2))
          PY
          mv manifest.json.tmp manifest.json
          if [[ "${source_args[*]}" == *"--publish-source"* ]]; then
            python3 - "$KEY" "$SOURCE_COMMIT" "$tui_tree" "$ghostty_commit" "$ghostty_next_commit" manifest.json > tree/source.json <<'PY'
          import json, os, sys
          key, commit, tui_tree, ghostty_commit, ghostty_next_commit, manifest_path = sys.argv[1:]
          manifest = json.load(open(manifest_path))
          print(json.dumps({
              "key": key,
              "cmuxTuiTree": tui_tree,
              "ghosttyCommit": ghostty_commit,
              "ghosttyNextCommit": ghostty_next_commit,
              "commit": commit,
              "run": os.environ["GITHUB_RUN_ID"],
              "runUrl": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              "binaries": manifest["binaries"],
          }, indent=2))
          PY
          fi
          python3 "$helper" \
            --key "$KEY" \
            --source-commit "$source_commit" \
            --assets-dir assets/tree \
            --manifest-file manifest.json \
            "${source_args[@]}" \
            --uploader "$uploader" \
            --endpoint-url "$R2_ENDPOINT" \
            --bucket cmux-binaries
