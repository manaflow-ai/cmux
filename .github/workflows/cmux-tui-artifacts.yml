name: cmux-tui artifacts

# Publishes raw cmux-tui (the Rust TUI multiplexer) and cmux-relay binaries to the
# cmux-binaries R2 bucket (public under https://files.cmux.com/cmux-tui/... and
# https://files.cmux.com/cmux-relay/...) so cloud VM snapshot builders and install
# scripts can curl a binary directly, without npm or PyPI. Binary building is
# shared with the npm/uvx distribution lane (cmux-tui-build-package.yml); this
# workflow only adds the R2 raw-binary publish.
#
# Layout in R2:
#   cmux-tui/<commit-sha>/cmux-tui-<rust-target>   immutable, commit-addressed
#   cmux-tui/<commit-sha>/manifest.json
#   cmux-tui/latest/cmux-tui-<rust-target>         rolling, manual publishes only
#   cmux-tui/latest/manifest.json
#   cmux-relay/<commit-sha>/cmux-relay-<rust-target> immutable, commit-addressed
#   cmux-relay/<commit-sha>/manifest.json
#   cmux-relay/latest/cmux-relay-<rust-target>       rolling, manual publishes only
#   cmux-relay/latest/manifest.json

on:
  # Temporarily manual-only beginning 2026-07-13 to pause automatic CI/CD.
  workflow_dispatch: {}

concurrency:
  group: cmux-tui-artifacts-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  build:
    permissions:
      contents: read
    uses: ./.github/workflows/cmux-tui-build-package.yml
    with:
      # Raw R2 artifacts are not npm releases and must never claim that an
      # older published package can reproduce their source contents.
      version: 0.0.0-r2.${{ github.sha }}
      package_npm: false
      package_pypi: false
      include_windows: true

  publish:
    name: publish to R2
    # PR runs of this workflow only validate the build; publishing is
    # main-push or manual dispatch.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ${{ vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 15
    env:
      EXPECTED_WINDOWS_ARTIFACT: cmux-tui-x86_64-pc-windows-gnu.exe
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Download cmux-tui binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: cmux-tui-*
          path: assets/cmux-tui
          merge-multiple: true

      - name: Download cmux-relay binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: cmux-relay-*
          path: assets/cmux-relay
          merge-multiple: true

      - name: Build manifest and checksums
        run: |
          build_manifest() {
            local directory="$1"
            local binary_prefix="$2"
            local checksums="$3"
            (
              cd "$directory"
              chmod 0755 "${binary_prefix}"*
              sha256sum "${binary_prefix}"* > "$checksums"
              python3 - "$GITHUB_SHA" "$binary_prefix" <<'PY'
          import hashlib, json, os, sys
          from datetime import datetime, timezone
          files = sorted(
              f for f in os.listdir(".")
              if f.startswith(sys.argv[2]) and not f.endswith(".txt")
          )
          manifest = {
              "commit": sys.argv[1],
              "builtAt": datetime.now(timezone.utc).isoformat(),
              "binaries": {
                  f: hashlib.sha256(open(f, "rb").read()).hexdigest() for f in files
              },
          }
          with open("manifest.json", "w") as out:
              json.dump(manifest, out, indent=2)
          print(json.dumps(manifest, indent=2))
          PY
            )
          }
          build_manifest assets/cmux-tui cmux-tui- cmux-tui-checksums.txt
          build_manifest assets/cmux-relay cmux-relay- cmux-relay-checksums.txt

      - name: Verify cmux-tui manifest before upload
        run: |
          set -euo pipefail
          python3 cmux-tui/scripts/verify_published_manifest.py \
            --manifest-file assets/cmux-tui/manifest.json \
            --expected-commit "$GITHUB_SHA" \
            --require-artifact "$EXPECTED_WINDOWS_ARTIFACT"

      - name: Upload to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: "https://${{ secrets.CF_R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
        run: |
          set -euo pipefail
          scripts/ci/publish-r2-prefix.sh \
            assets/cmux-tui "cmux-tui/$GITHUB_SHA" "public, max-age=31536000, immutable"
          scripts/ci/publish-r2-prefix.sh \
            assets/cmux-relay "cmux-relay/$GITHUB_SHA" "public, max-age=31536000, immutable"
          echo "Published: https://files.cmux.com/cmux-tui/$GITHUB_SHA/manifest.json"
          echo "Published: https://files.cmux.com/cmux-relay/$GITHUB_SHA/manifest.json"

          # Transitional double-publish under the pre-rename prefix and binary
          # names: out-of-repo consumers (cmux-cloud bootstrap/install-mux.sh
          # and snapshot builders) still curl files.cmux.com/mux/<ref>/cmux-mux-*.
          # Remove once cmux-cloud switches to the cmux-tui prefix
          # (https://github.com/manaflow-ai/cmux-cloud/pull/2).
          legacy_assets="assets-legacy"
          mkdir -p "$legacy_assets"
          for file in assets/cmux-tui/cmux-tui-*; do
            if [[ "$(basename "$file")" == cmux-tui-hook-* ]]; then
              continue
            fi
            cp "$file" "$legacy_assets/$(basename "$file" | sed 's/^cmux-tui-/cmux-mux-/')"
          done
          python3 - "$GITHUB_SHA" "$legacy_assets" <<'PY'
          import hashlib
          import json
          import pathlib
          import sys
          from datetime import datetime, timezone

          root = pathlib.Path(sys.argv[2])
          files = sorted(path for path in root.glob("cmux-mux-*") if path.is_file())
          manifest = {
              "commit": sys.argv[1],
              "builtAt": datetime.now(timezone.utc).isoformat(),
              "binaries": {
                  path.name: hashlib.sha256(path.read_bytes()).hexdigest() for path in files
              },
          }
          (root / "manifest.json").write_text(json.dumps(manifest, indent=2) + "\n")
          PY
          scripts/ci/publish-r2-prefix.sh \
            "$legacy_assets" "mux/$GITHUB_SHA" "public, max-age=31536000, immutable"

      - name: Verify immutable cmux-tui manifest before latest publish
        run: |
          set -euo pipefail
          python3 cmux-tui/scripts/verify_published_manifest.py \
            --manifest-url "https://files.cmux.com/cmux-tui/$GITHUB_SHA/manifest.json" \
            --expected-commit "$GITHUB_SHA" \
            --require-artifact "$EXPECTED_WINDOWS_ARTIFACT"

      - name: Publish rolling latest artifacts
        if: github.ref == 'refs/heads/main'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: "https://${{ secrets.CF_R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
        run: |
          set -euo pipefail
          scripts/ci/publish-r2-prefix.sh \
            assets/cmux-tui "cmux-tui/latest" "no-cache, no-store, must-revalidate"
          scripts/ci/publish-r2-prefix.sh \
            assets/cmux-relay "cmux-relay/latest" "no-cache, no-store, must-revalidate"
          scripts/ci/publish-r2-prefix.sh \
            assets-legacy "mux/latest" "no-cache, no-store, must-revalidate"

      - name: Verify published cmux-tui manifests
        run: |
          set -euo pipefail
          python3 cmux-tui/scripts/verify_published_manifest.py \
            --manifest-url "https://files.cmux.com/cmux-tui/$GITHUB_SHA/manifest.json" \
            --expected-commit "$GITHUB_SHA" \
            --require-artifact "$EXPECTED_WINDOWS_ARTIFACT"
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            python3 cmux-tui/scripts/verify_published_manifest.py \
              --manifest-url "https://files.cmux.com/cmux-tui/latest/manifest.json?verify=$GITHUB_SHA" \
              --expected-commit "$GITHUB_SHA" \
              --require-artifact "$EXPECTED_WINDOWS_ARTIFACT"
          fi
