name: Cloud devbox image rebake

# Rebakes the cmux Cloud devbox image (web/services/vms/images/devbox/) when its
# sources change, and on demand. One run:
#   1. plan: is any Freestyle default in the manifest baked from other sources
#      than this commit's (devboxSourceDriftProblems, the check promote enforces)?
#      The version is <UTC yyyymmddHHMM>-<commit 10>-<desktop source digest 12>.
#   2. promote-devbox-image.ts: bake, verify (boots a machine and checks the whole
#      devbox contract), derive every ladder size, write the manifest rows. Every
#      snapshot is slugged cmux-devbox-ci-<version>[-<size>].
#   3. settle web/services/vms/images/awaiting-rebake.json, re-check the manifest.
#   4. smoke: boot the new md desktop default, require its /etc/cmux/image-stamp
#      to be the expected line and a cmux-tui client round trip to the daemon.
#   5. publish: push devbox-rebake/<digest 12> and open a PR into the branch the
#      run baked. The manifest rows record the version; merging the PR is the
#      promotion (README "Promote"), through the normal review.
#   6. prune: keep the newest N rebake versions and every manifest default; delete
#      older cmux-devbox-ci-* snapshots. Nothing else on the account is touched.
# A digest that already has a devbox-rebake/<digest> branch is not baked again
# (force: true overrides), so pushes that do not move the sources cost nothing.
on:
  push:
    branches: [feat-cmux-next]
    paths:
      - web/services/vms/images/devbox/**
      - web/services/vms/images/shell/**
      - web/scripts/build-devbox-freestyle.ts
      - web/scripts/devbox-image-common.ts
      - web/scripts/devbox-rebake.ts
      - .github/workflows/cloud-devbox-image-rebake.yml
  workflow_dispatch:
    inputs:
      force:
        description: Bake even when the manifest already matches this commit's sources, or the digest already has a rebake branch
        required: false
        default: false
        type: boolean
      keep:
        description: Rebake versions to keep on the Freestyle account (older cmux-devbox-ci-* snapshots are deleted)
        required: false
        default: "5"
        type: string

permissions:
  contents: read

# A started bake is never cancelled: it holds live provider machines and its
# own cleanup runs at the end. A newer push waits for it.
concurrency:
  group: cloud-devbox-image-rebake
  cancel-in-progress: false

jobs:
  rebake:
    if: github.repository == 'manaflow-ai/cmux' && github.ref_type == 'branch'
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 180
    environment: cloud-vm-image-checks
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Plan
        id: plan
        env:
          FORCE: ${{ inputs.force == true }}
        run: |
          set -euo pipefail
          args=()
          if [ "$FORCE" = "true" ]; then args+=(--force); fi
          bun scripts/devbox-rebake.ts plan "${args[@]}" | tee -a "$GITHUB_OUTPUT"
          digest="$(grep '^digest=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2)"
          branch="devbox-rebake/${digest:0:12}"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          if [ "$FORCE" != "true" ] && git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            echo "$branch already exists: this digest was baked and published; nothing to do"
            echo "go=false" >> "$GITHUB_OUTPUT"
          elif grep -qx 'needed=true' "$GITHUB_OUTPUT"; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "the manifest's defaults were baked from this commit's sources; nothing to do"
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Confirm provider credential
        if: steps.plan.outputs.go == 'true'
        env:
          HAS_KEY: ${{ secrets.FREESTYLE_API_KEY != '' }}
        run: |
          if [ "$HAS_KEY" != "true" ]; then
            echo "::error::cloud-vm-image-checks has no FREESTYLE_API_KEY"
            exit 1
          fi

      - name: Bake, verify, derive sizes, and write the manifest
        if: steps.plan.outputs.go == 'true'
        env:
          CMUX_BAKE_ALLOW_BRANCH: "1"
          FREESTYLE_API_KEY: ${{ secrets.FREESTYLE_API_KEY }}
          SLUG: ${{ steps.plan.outputs.slug }}
          OUT: ${{ runner.temp }}/devbox-promotion.json
        run: |
          set -euo pipefail
          bun run devbox:promote -- freestyle --slug "$SLUG" --pointer-slug none --out "$OUT"

      - name: Settle the awaiting-rebake list and re-check the manifest
        if: steps.plan.outputs.go == 'true'
        run: |
          set -euo pipefail
          bun scripts/devbox-rebake.ts settle
          bun run devbox:manifest:check
          bun test tests/vm-image-manifest.test.ts tests/vm-devbox-rebake.test.ts

      - name: Smoke test the new image
        if: steps.plan.outputs.go == 'true'
        env:
          FREESTYLE_API_KEY: ${{ secrets.FREESTYLE_API_KEY }}
          OUT: ${{ runner.temp }}/devbox-promotion.json
          STAMP: ${{ steps.plan.outputs.stamp }}
        run: |
          set -euo pipefail
          image="$(jq -r '[.entries[] | select(.kind == "desktop" and .size.name == "md") | .imageId][0] // empty' "$OUT")"
          if [ -z "$image" ]; then
            echo "::error::the promotion wrote no md desktop row"
            exit 1
          fi
          bun scripts/check-devbox-image-reachable.ts --image "$image" --expect-stamp "$STAMP"

      # The App opens the PR so its CI runs; the job's own token stays read-only.
      - name: Mint the publish token
        id: app-token
        if: steps.plan.outputs.go == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.GLAEDA_ROUTE_APP_ID }}
          private-key: ${{ secrets.GLAEDA_ROUTE_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Publish the manifest pull request
        id: publish
        if: steps.plan.outputs.go == 'true'
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          BASE: ${{ github.ref_name }}
          BRANCH: ${{ steps.plan.outputs.branch }}
          VERSION: ${{ steps.plan.outputs.version }}
          COMMIT: ${{ steps.plan.outputs.commit }}
          OUT: ${{ runner.temp }}/devbox-promotion.json
        run: |
          set -euo pipefail
          git add services/vms/images/manifest.json services/vms/images/awaiting-rebake.json
          title="Cloud: promote devbox image $VERSION"
          git -c user.name="cmux devbox rebake" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "$title" -m "Baked from $COMMIT by $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID."
          auth="$(printf 'x-access-token:%s' "$APP_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          GIT_CONFIG_COUNT=1 \
          GIT_CONFIG_KEY_0="http.https://github.com/.extraheader" \
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" \
            git push --force --quiet "https://github.com/$GITHUB_REPOSITORY.git" "HEAD:refs/heads/$BRANCH"
          rows="$(jq -r '.entries[] | "| \(.kind) | \(.size.name // "-") | `\(.version)` | `\(.imageId)` |"' "$OUT")"
          body="$(printf '%s\n' \
            "Rebaked devbox image \`$VERSION\` from $COMMIT (run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)." \
            "" \
            "The run verified the bake (verify-devbox-image.ts), derived and re-booted every size, and smoke-tested the md desktop default (image-stamp plus a cmux-tui round trip). Merging this is the promotion; rollback is a revert." \
            "" \
            "| kind | size | version | snapshot |" \
            "|---|---|---|---|" \
            "$rows")"
          url="$(GH_TOKEN="$APP_TOKEN" gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&head=${GITHUB_REPOSITORY_OWNER}:${BRANCH}" --jq '.[0].html_url // empty')"
          if [ -z "$url" ]; then
            url="$(GH_TOKEN="$APP_TOKEN" gh api -X POST "repos/$GITHUB_REPOSITORY/pulls" \
              -f head="$BRANCH" -f base="$BASE" -f title="$title" -f body="$body" --jq .html_url)"
          else
            GH_TOKEN="$APP_TOKEN" gh api -X PATCH "repos/$GITHUB_REPOSITORY/pulls/${url##*/}" -f title="$title" -f body="$body" >/dev/null
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          {
            echo "### Devbox image $VERSION"
            echo
            echo "Manifest PR: $url"
            echo
            echo "| kind | size | version | snapshot |"
            echo "|---|---|---|---|"
            echo "$rows"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Prune old rebake snapshots
        if: steps.plan.outputs.go == 'true'
        env:
          FREESTYLE_API_KEY: ${{ secrets.FREESTYLE_API_KEY }}
          KEEP: ${{ inputs.keep || '5' }}
        run: bun scripts/devbox-rebake.ts prune --keep "$KEEP"

      - name: Upload the promotion receipt
        if: always() && steps.plan.outputs.go == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: devbox-rebake-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 3
          path: ${{ runner.temp }}/devbox-promotion.json
