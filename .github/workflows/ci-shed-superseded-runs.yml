name: CI shed superseded runs

# Leo, 2026-11-19: "why are there even 20,000? What are the 20,000 [jobs] doing?" and "Just [...] unstick
# the [...] queue by any [...] means." At 20:12Z 28,318 jobs were queued, 12,848 of them for commits a newer
# push on the same branch had already replaced. The other janitors run on Blacksmith labels, so they queue
# behind the backlog they would cancel. This one runs on an owned runner (CI_CONTROL_RUNNER, else the
# reserved cmux-gcp-nightly-x64 label), never Blacksmith or GitHub-hosted, and reads the whole queue:
# scripts/ci/shed_superseded_runs.py has the policy: attempt-1 runs whose commit is no longer its branch tip, or
# whose branch is gone, that are queued or have nothing running (only jobs that never started are stopped). Lane
# branches: push, pull_request and workflow_run runs. main and feat-cmux-next: push runs only, never a nightly,
# DEV, promote, release or publishing workflow, and never the tip's own run (Leo, 2026-11-19: "if we can cut ci by
# 50% and we need an extra fix forward on 5%, that's ok"). A schedule runs only from the default branch, so this
# file must be on main for the sweep to run every 10 minutes.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report what would be cancelled without cancelling anything"
        required: true
        default: false
        type: boolean

permissions: {}

# A newer sweep replaces this one (see cancel-in-progress below); the job ends inside one schedule tick.
concurrency:
  group: ci-shed-superseded-runs
  # A newer sweep replaces an older one, queued or running: sweeps are idempotent (each reads the queue afresh, and
  # a cancel of a run already cancelled is a no-op error row), and a held group starves the drain. On 2026-11-20
  # sweep 44749834573 sat queued for its runner label from 14:03Z while every later sweep waited behind it.
  cancel-in-progress: true

jobs:
  shed:
    name: Shed queued runs on superseded heads
    if: github.repository == 'manaflow-ai/cmux'
    permissions:
      actions: write
      contents: read
    runs-on: ${{ vars.CI_CONTROL_RUNNER || 'cmux-gcp-nightly-x64' }}
    timeout-minutes: 9 # under the */10 tick, so the next sweep rarely cancels a running one
    steps:
      - name: Check out the shed script
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          sparse-checkout: scripts/ci
          sparse-checkout-cone-mode: true

      - name: Cancel queued runs nobody will read
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
          SHED_MAX_CANCELS: ${{ vars.CI_SHED_MAX_CANCELS || '400' }} # fits the 9 min job: 6 sweeps an hour shed up to 2,400 runs
          SHED_CANCEL_SPACING_SECONDS: ${{ vars.CI_SHED_CANCEL_SPACING_SECONDS || '0.2' }}
          SHED_MAX_JOB_READS: ${{ vars.CI_SHED_MAX_JOB_READS || '300' }}
        run: python3 scripts/ci/shed_superseded_runs.py
