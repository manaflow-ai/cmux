# A whole macOS test target, compiled cold on the repository's pool.
#
# For one test, or a few, use `./scripts/run-e2e.sh <selector> --ref <sha>`
# instead. It runs the same app-host tests through test-e2e.yml, reuses a run
# already in flight at that commit, refuses a selector that already failed
# there, and batches several selectors against one compile. This workflow does
# none of that. A dispatch that names unit selectors and skips UI tests is
# therefore handed to that wrapper by the `focused` job, which links the
# test-e2e run and fails so that nobody reads this run as the test's result.
name: Run macOS test suite
run-name: >-
  macOS tests @ ${{ inputs.ref || github.ref_name }} ·
  unit=${{ inputs.skip_unit_tests && 'off' || inputs.unit_test_suites || 'all' }} ·
  UI=${{ inputs.skip_ui_tests && 'off' || inputs.test_filter || 'all' }}

on:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ""
      skip_unit_tests:
        type: boolean
        default: false
      skip_ui_tests:
        type: boolean
        default: true
      unit_test_suites:
        type: string
        default: ""
      test_filter:
        type: string
        default: ""
      test_timeout:
        type: string
        default: "120"
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, full SHA, or short SHA to test
        required: false
        default: ""
      skip_unit_tests:
        description: Skip unit tests (run only UI tests)
        required: false
        default: false
        type: boolean
      skip_ui_tests:
        description: Skip UI tests (run only unit tests)
        required: false
        default: false
        type: boolean
      unit_test_suites:
        description: "Comma-separated unit suites; empty runs the full unit target. With UI tests skipped, these run through ./scripts/run-e2e.sh instead of a cold build here"
        required: false
        default: ""
      test_filter:
        description: "Run specific UI test class (e.g. UpdatePillUITests) or empty for all"
        required: false
        default: ""
      test_timeout:
        description: "Per-test timeout in seconds (default: 120)"
        required: false
        default: "120"

jobs:
  resolve-ref:
    uses: ./.github/workflows/resolve-dispatch-ref.yml
    with:
      ref: ${{ inputs.ref }}

  focused:
    # Selectors with UI tests off are a focused run. Compiled here, each one
    # paid a cold build of the whole app, about 20 minutes, for one test.
    # The wrapper dispatches to manaflow-ai/cmux, so a fork keeps its own
    # `tests` job.
    if: ${{ github.repository == 'manaflow-ai/cmux' && github.event_name == 'workflow_dispatch' && inputs.unit_test_suites != '' && inputs.skip_ui_tests && !inputs.skip_unit_tests }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Run the selectors through run-e2e.sh
        env:
          GH_TOKEN: ${{ github.token }}
          # The job token cannot list repository variables, and without the
          # runner the wrapper cannot see an identical run already in flight.
          CMUX_MACOS_RUNNER_TESTS: ${{ vars.MACOS_RUNNER_TESTS }}
          CMUX_CI_E2E_LARGE_POOL_OVERFLOW: ${{ vars.CI_E2E_LARGE_POOL_OVERFLOW }}
          CMUX_CI_PR_POOL_ORDER: ${{ vars.CI_PR_POOL_ORDER }}
          CMUX_CI_PR_POOL_MAX_QUEUED: ${{ vars.CI_PR_POOL_MAX_QUEUED }}
          UNIT_TEST_SUITES: ${{ inputs.unit_test_suites }}
          TEST_REF: ${{ inputs.ref || github.sha }}
          TEST_TIMEOUT: ${{ inputs.test_timeout }}
        run: |
          set -euo pipefail
          selectors=()
          IFS=',' read -r -a suites <<< "$UNIT_TEST_SUITES"
          for suite in "${suites[@]}"; do
            suite="${suite// /}"
            # The suite path ran a repeated entry twice; the wrapper refuses one.
            [ -n "$suite" ] && [[ " ${selectors[*]} " != *" cmuxTests/$suite "* ]] && selectors+=("cmuxTests/$suite")
          done
          ./scripts/run-e2e.sh "${selectors[@]}" --ref "$TEST_REF" --timeout "$TEST_TIMEOUT" | tee dispatch.log
          url="$(grep -oE 'https://github.com/[^ ]+/actions/runs/[0-9]+' dispatch.log | tail -1)"
          echo "Forwarded to $url" >> "$GITHUB_STEP_SUMMARY"
          # Exit red: this run did not test anything, and a green one would
          # read as a pass.
          echo "::error title=Forwarded, not tested::The result is in $url"
          exit 1

  tests:
    needs: resolve-ref
    if: ${{ !(github.repository == 'manaflow-ai/cmux' && github.event_name == 'workflow_dispatch' && inputs.unit_test_suites != '' && inputs.skip_ui_tests && !inputs.skip_unit_tests) }}
    # Keep this lane on the repository's normal macOS runner and do not
    # expose a provider override.
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || vars.MACOS_RUNNER_TESTS || 'blacksmith-6vcpu-macos-15' }}
    timeout-minutes: ${{ inputs.unit_test_suites != '' && 35 || 20 }}
    steps:
      - name: Verify GitHub-hosted route
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          REQUESTED_RUNNER: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || vars.MACOS_RUNNER_TESTS || 'blacksmith-6vcpu-macos-15' }}
          RUNNER_CONTEXT_NAME: ${{ runner.name }}
        run: |
          # The self-hosted fleet also carries a macos-26 label, so a macos-*
          # request must prove it landed on GitHub-hosted capacity before any
          # checkout.
          case "$REQUESTED_RUNNER" in
            macos-*)
              if [ "$RUNNER_ENVIRONMENT" != "github-hosted" ]; then
                echo "::error::$REQUESTED_RUNNER resolved outside GitHub-hosted capacity: $RUNNER_CONTEXT_NAME"
                exit 1
              fi
              ;;
          esac
      - name: Clear stale git locks (self-hosted reused workspace)
        shell: bash
        run: |
          # Self-hosted macOS runners reuse the workspace. A job cancelled or
          # killed mid-checkout can leave a stale .git/modules/*/index.lock that
          # fails every later submodule checkout (e.g. ghostty). Clear them first.
          ws="${GITHUB_WORKSPACE:-$PWD}"
          rm -f "$ws/.git/index.lock" 2>/dev/null || true
          if [ -d "$ws/.git/modules" ]; then
            find "$ws/.git/modules" -type f -name "*.lock" -delete 2>/dev/null || true
          fi

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.resolve-ref.outputs.sha }}
          submodules: recursive

      - name: Select Xcode
        run: |
          set -euo pipefail
          ./scripts/select-ci-xcode.sh

      - name: Setup Node for hook integration tests
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"

      - name: Forward tool PATH into XCTest hosts
        run: echo "TEST_RUNNER_PATH=$PATH" >> "$GITHUB_ENV"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Download pre-built GhosttyKit.xcframework
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ./scripts/download-prebuilt-ghosttykit.sh

      - name: Install zig
        run: |
          ./scripts/install-zig-ci.sh

      - name: Install Rust
        run: |
          ./scripts/install-rust-ci.sh

      - name: Create virtual display
        run: |
          set -euo pipefail
          echo "=== Display before ==="
          system_profiler SPDisplaysDataType 2>/dev/null || echo "(none)"
          echo ""
          clang -framework Foundation -framework CoreGraphics \
            -o /tmp/create-virtual-display scripts/create-virtual-display.m
          /tmp/create-virtual-display &
          VDISPLAY_PID=$!
          echo "VDISPLAY_PID=$VDISPLAY_PID" >> "$GITHUB_ENV"
          sleep 3
          echo "=== Display after ==="
          system_profiler SPDisplaysDataType 2>/dev/null || echo "(none)"

      - name: Clean DerivedData
        run: |
          rm -rf ~/Library/Developer/Xcode/DerivedData/cmux-*

      - name: Prepare clean package cache directory
        run: |
          rm -rf "$GITHUB_WORKSPACE/.ci-source-packages"
          mkdir -p "$GITHUB_WORKSPACE/.ci-source-packages"

      - name: Restore Swift packages
        continue-on-error: true
        uses: ./.github/actions/cache-restore
        with:
          backend: ${{ vars.CI_CACHE_BACKEND || 'r2' }}
          path: .ci-source-packages
          # Consume the Swift package seed nightly.yml saves, without
          # publishing caches from a manually selected revision. Test products
          # remain fresh.
          key: spm-${{ hashFiles('cmux.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'scripts/ci/swiftpm-cache-layout') }}
          restore-keys: spm-

      - name: Sanitize Swift package cache
        run: python3 scripts/ci/sanitize-xcode-source-packages-cache.py .ci-source-packages

      - name: Resolve Swift packages
        run: |
          set -euo pipefail
          SOURCE_PACKAGES_DIR="$PWD/.ci-source-packages"
          mkdir -p "$SOURCE_PACKAGES_DIR"

          for attempt in 1 2 3; do
            if xcodebuild -project cmux.xcodeproj -scheme cmux-unit -configuration Debug \
              -clonedSourcePackagesDirPath "$SOURCE_PACKAGES_DIR" \
              -resolvePackageDependencies; then
              if [ -d "$SOURCE_PACKAGES_DIR/artifacts/sparkle/Sparkle/Sparkle.xcframework" ] \
                && [ -d "$SOURCE_PACKAGES_DIR/artifacts/sentry-cocoa/Sentry/Sentry.xcframework" ]; then
                exit 0
              fi
              echo "Resolve succeeded without required binary artifacts; retrying cleanly" >&2
            fi
            rm -rf "$SOURCE_PACKAGES_DIR"
            mkdir -p "$SOURCE_PACKAGES_DIR"
            if [ "$attempt" -eq 3 ]; then
              echo "Failed to resolve Swift packages after 3 attempts" >&2
              exit 1
            fi
            echo "Package resolution failed on attempt $attempt, retrying..."
            sleep $((attempt * 5))
          done

      - name: Run unit tests
        if: ${{ !inputs.skip_unit_tests }}
        env:
          UNIT_TEST_SUITES: ${{ inputs.unit_test_suites }}
          TEST_RESULTS_ROOT: ${{ runner.temp }}/cmux-unit-results-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          SOURCE_PACKAGES_DIR="$PWD/.ci-source-packages"
          mkdir -p "$TEST_RESULTS_ROOT"
          run_unit_suite() {
            local output_path="$1"
            shift
            local result_dir
            result_dir="$(mktemp -d "$TEST_RESULTS_ROOT/suite.XXXXXX")"
            scripts/ci/xcodebuild_noninteractive.py \
              xcodebuild -project cmux.xcodeproj -scheme cmux-unit -configuration Debug \
              -clonedSourcePackagesDirPath "$SOURCE_PACKAGES_DIR" \
              -disableAutomaticPackageResolution \
              -destination "platform=macOS" -resultBundlePath "$result_dir/result.xcresult" "$@" test >"$output_path" 2>&1
          }
          report_unit_suite() {
            local output_path="$1"
            local suite="$2"
            local suite_status="$3"
            # Reporting is deliberately non-gating; the caller still owns the
            # xcodebuild status and the positive-summary execution guard.
            if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
              python3 scripts/ci/classify-app-host-test-output.py \
                "$output_path" --suite "$suite" --exit-code "$suite_status" --diagnose \
                | tee -a "$GITHUB_STEP_SUMMARY" || true
            else
              python3 scripts/ci/classify-app-host-test-output.py \
                "$output_path" --suite "$suite" --exit-code "$suite_status" --diagnose || true
            fi
          }
          run_unit_tests() {
            if [ -z "$UNIT_TEST_SUITES" ]; then
              local output_path="$TEST_RESULTS_ROOT/full-suite.log"
              local suite_status=0
              set +e
              run_unit_suite "$output_path"
              suite_status=$?
              set -e
              cat "$output_path"
              report_unit_suite "$output_path" "full" "$suite_status"
              if ! grep -Eq 'Test run with [1-9][0-9]* tests?([[:space:]]|$)|Executed [1-9][0-9]* tests?([[:space:],]|$)' "$output_path"; then
                echo "::error title=Pre-test suite failure::No tests executed; the app-host/build did not reach assertions" >&2
                return 1
              fi
              return "$suite_status"
            fi
            IFS=',' read -r -a suites <<< "$UNIT_TEST_SUITES"
            local failed=0
            for suite in "${suites[@]}"; do
              # A suite, or one test in it: `Suite/testName` for XCTest,
              # `Suite/testName()` for Swift Testing. Without the parens a
              # Swift Testing selector matches nothing, and the positive-summary
              # check below fails the run rather than reporting a pass.
              if [[ ! "$suite" =~ ^[A-Za-z0-9_]+(/[A-Za-z0-9_]+(\(\))?)?$ ]]; then
                echo "Invalid unit suite identifier" >&2
                return 1
              fi
              local suite_status=0
              local log_name="${suite//\//.}"
              log_name="${log_name%()}"
              local output_path="$TEST_RESULTS_ROOT/$log_name.log"
              set +e
              run_unit_suite "$output_path" "-only-testing:cmuxTests/$suite"
              suite_status=$?
              set -e
              cat "$output_path"
              report_unit_suite "$output_path" "$suite" "$suite_status"
              # Require a positive framework summary before continuing. A
              # compile, setup, app-host, or filter failure must never look
              # like a passing semantic suite.
              if ! grep -Eq 'Test run with [1-9][0-9]* tests?([[:space:]]|$)|Executed [1-9][0-9]* tests?([[:space:],]|$)' "$output_path"; then
                echo "::error title=Pre-test suite failure::No tests executed for $suite; the app-host/build did not reach assertions" >&2
                return 1
              fi
              # Collect every assertion failure in one hosted build. A suite
              # that never ran (build/launch failure) still stops above.
              if [ "$suite_status" -ne 0 ]; then failed=1; fi
            done
            return "$failed"
          }

          TEST_OUTPUT="$TEST_RESULTS_ROOT/all-suites.log"
          set +e
          run_unit_tests 2>&1 | tee "$TEST_OUTPUT"
          EXIT_CODE=${PIPESTATUS[0]}
          set -e

          # SwiftPM binary artifact resolution can occasionally fail with
          # "Could not resolve package dependencies". Retry once after clearing
          # SwiftPM/DerivedData caches to recover from transient corruption.
          if [ "$EXIT_CODE" -ne 0 ] && grep -q "Could not resolve package dependencies" "$TEST_OUTPUT"; then
            echo "SwiftPM package resolution failed, clearing caches and retrying once"
            rm -rf ~/Library/Caches/org.swift.swiftpm
            rm -rf ~/Library/Developer/Xcode/DerivedData/cmux-*
            : > "$TEST_OUTPUT"
            set +e
            run_unit_tests 2>&1 | tee "$TEST_OUTPUT"
            EXIT_CODE=${PIPESTATUS[0]}
            set -e
          fi

          if [ -n "$UNIT_TEST_SUITES" ] && [ "$EXIT_CODE" -ne 0 ]; then
            exit "$EXIT_CODE"
          fi
          if [ "$EXIT_CODE" -ne 0 ]; then
            DIAGNOSIS=$(python3 scripts/ci/classify-app-host-test-output.py \
              "$TEST_OUTPUT" --exit-code "$EXIT_CODE" --diagnose)
            echo "$DIAGNOSIS"
            # The expected-failure exception applies only to a run that both
            # executed tests and recorded an actual XCTest failure. A clean
            # summary cannot override a nonzero app-host/build exit.
            if echo "$DIAGNOSIS" | grep -q "category=test assertion failure" \
              && grep -Eq 'Executed [1-9][0-9]* tests?,[[:space:]]+with[[:space:]]+[1-9][0-9]* failures?[[:space:]]+\(0 unexpected\)' "$TEST_OUTPUT"; then
              echo "All failures are expected, treating as pass"
            else
              echo "Unexpected test failures detected"
              exit "$EXIT_CODE"
            fi
          fi

      - name: Run UI tests
        if: ${{ !inputs.skip_ui_tests }}
        env:
          TEST_FILTER: ${{ inputs.test_filter }}
          TEST_TIMEOUT: ${{ inputs.test_timeout || '120' }}
        run: |
          set -euo pipefail
          SOURCE_PACKAGES_DIR="$PWD/.ci-source-packages"

          # Build the -only-testing argument
          if [ -n "$TEST_FILTER" ]; then
            ONLY_TESTING="-only-testing:cmuxUITests/$TEST_FILTER"
          else
            ONLY_TESTING="-only-testing:cmuxUITests"
          fi

          UI_TEST_LOG="$RUNNER_TEMP/cmux-ui-tests.log"
          set +e
          xcodebuild -project cmux.xcodeproj -scheme cmux -configuration Debug \
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES_DIR" \
            -disableAutomaticPackageResolution \
            -destination "platform=macOS" \
            -maximum-test-execution-time-allowance "$TEST_TIMEOUT" \
            "$ONLY_TESTING" test 2>&1 | tee "$UI_TEST_LOG"
          UI_TEST_STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$UI_TEST_STATUS" -ne 0 ]; then
            exit "$UI_TEST_STATUS"
          fi
          # A filter that matches nothing exits 0 after executing zero tests.
          if [ -n "$TEST_FILTER" ] && ! scripts/ci/require_selected_test_execution.sh \
            "$UI_TEST_LOG" "cmuxUITests/$TEST_FILTER" >/dev/null; then
            echo "::error::test_filter cmuxUITests/$TEST_FILTER executed zero tests; check the class and method names"
            exit 1
          fi

      - name: Upload unit test results
        if: ${{ always() && !inputs.skip_unit_tests }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-unit-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cmux-unit-results-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 7
