name: cmux NEXT Stable rollback

# The undo button for a bad cmux NEXT Stable build. It takes the bad build, and every newer one, off
# the stable feed (nightly-next/stable/appcast-arm64.xml), so the feed serves the previous stable
# build again (the feed keeps 3; emptying it takes allow_empty). Each pulled build is recorded in
# nightly-next/stable/pulled.json, and stable-next.yml never picks it again. Sparkle never
# offers a lower build: a Mac already on the bad build keeps it until a newer stable build ships, or
# rolls back to the build it kept (updates.rollback).
#
#   gh workflow run stable-next-rollback.yml -R manaflow-ai/cmux --ref nightly-next \
#     -f reason="what is broken"     # pulls the newest stable build
#     -f bad_build=4099184203401     # or: pull this build and everything newer
#     -f to_build=4097664234401      # or: serve this build again
#     -f dry_run=true                # print the plan, write nothing
#
# release-next holds the feed's R2 token and deploys only to nightly-next. A dispatch registers only
# from the default branch, so this file is on main too; a run there does nothing.
on:
  workflow_dispatch:
    inputs:
      reason:
        description: Why the build is pulled (goes into the run summary).
        required: true
        type: string
      bad_build:
        description: Pull this build and every newer one (digits). Empty pulls the newest build.
        required: false
        default: ''
        type: string
      to_build:
        description: Instead of bad_build, serve this build (digits) and pull everything above it.
        required: false
        default: ''
        type: string
      dry_run:
        description: Print the plan and write nothing.
        required: false
        default: false
        type: boolean
      allow_empty:
        description: Allow pulling the only stable build (the feed then offers nothing).
        required: false
        default: false
        type: boolean

permissions: {}

# No concurrency group: an undo never waits behind a stable run's gates, and nothing can replace a
# pending one. A rollback and a publish never both win: each writes the feed by compare-and-swap.

jobs:
  rollback:
    if: github.repository == 'manaflow-ai/cmux' && github.ref == 'refs/heads/nightly-next'
    environment: release-next
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.CI_CLOUD_OVERFLOW_SAVED && 'blacksmith-16vcpu-ubuntu-2404' || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      NIGHTLY_NEXT_R2_BUCKET: cmux-nightly-next
      NIGHTLY_NEXT_R2_PREFIX: nightly-next/stable/
      NIGHTLY_NEXT_FEED_BASE: https://files-next.cmux.com/nightly-next/stable
      STABLE_APPCAST: appcast-arm64.xml
      AWS_ACCESS_KEY_ID: ${{ secrets.NIGHTLY_NEXT_R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.NIGHTLY_NEXT_R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      R2_ENDPOINT: "https://${{ secrets.NIGHTLY_NEXT_R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Pull the build from the stable feed
        env:
          REASON: ${{ inputs.reason }}
          BAD_BUILD: ${{ inputs.bad_build }}
          TO_BUILD: ${{ inputs.to_build }}
          DRY_RUN: ${{ inputs.dry_run }}
          ALLOW_EMPTY: ${{ inputs.allow_empty }}
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          python3 -I - "$NIGHTLY_NEXT_R2_PREFIX$STABLE_APPCAST" "$work/live.xml" "$work/live.sha256" <<'PY'
          import hashlib, importlib.util, sys
          from pathlib import Path
          spec = importlib.util.spec_from_file_location("r2", "scripts/ci/publish-nightly-next-r2.py")
          r2 = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(r2)
          live = r2.read_live(sys.argv[1])
          if live is None:
              raise SystemExit("there is no stable feed to roll back")
          Path(sys.argv[2]).write_bytes(live)
          Path(sys.argv[3]).write_text(hashlib.sha256(live).hexdigest())
          PY
          if [ -n "$TO_BUILD" ]; then
            target=(--to-build "$TO_BUILD")
          else
            if [ -z "$BAD_BUILD" ]; then
              BAD_BUILD="$(grep -o -E '<sparkle:version>[0-9]+' "$work/live.xml" | sed 's/.*>//' | sort -n | tail -1)"
            fi
            target=(--bad-build "$BAD_BUILD")
          fi
          [ "$ALLOW_EMPTY" != true ] || target+=(--allow-empty)
          plan="$(python3 -I scripts/ci/stable_next.py rollback --live "$work/live.xml" --out "$work/$STABLE_APPCAST" "${target[@]}")"
          { echo "### cmux NEXT Stable rollback${DRY_RUN:+ (dry run: $DRY_RUN)}"; echo; echo "- reason: $REASON"; echo "- $plan"; } >> "$GITHUB_STEP_SUMMARY"
          echo "$plan"
          if [ "$DRY_RUN" = true ]; then exit 0; fi
          # Record first: a pulled build that is still the newest nightly must never be re-published,
          # even when the feed write below loses a race and is run again.
          pulled="$(python3 -c 'import json,sys; print(",".join(map(str, json.loads(sys.argv[1])["pulled"])))' "$plan")"
          python3 -I - "${NIGHTLY_NEXT_R2_PREFIX}pulled.json" "$work/pulled-live.json" "$work/pulled.sha256" <<'PY'
          import hashlib, importlib.util, sys
          from pathlib import Path
          spec = importlib.util.spec_from_file_location("r2", "scripts/ci/publish-nightly-next-r2.py")
          r2 = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(r2)
          live = r2.read_live(sys.argv[1])
          Path(sys.argv[2]).write_bytes(live or b"")
          Path(sys.argv[3]).write_text("absent" if live is None else hashlib.sha256(live).hexdigest())
          PY
          python3 -I scripts/ci/stable_next.py record-pulled --pulled "$work/pulled-live.json" --builds "$pulled" \
            --reason "$REASON (run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)" --out "$work/pulled.json"
          python3 -I scripts/ci/stable_next.py write-feed --feed "$work/pulled.json" --expect-sha256 "$(cat "$work/pulled.sha256")"
          if grep -q '<enclosure' "$work/$STABLE_APPCAST"; then
            python3 -I scripts/ci/nightly-next-guard.py appcast "$work/$STABLE_APPCAST"
          fi
          python3 -I scripts/ci/stable_next.py write-feed --feed "$work/$STABLE_APPCAST" --expect-sha256 "$(cat "$work/live.sha256")"
