name: Pinned base FFI audit
on:
  push:
    branches: [validate/next-newtab-base-cx3]
permissions:
  contents: read
jobs:
  ffi-base:
    runs-on: ${{ vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: e187d12752310e9be850b401f8f27617503a521d
          persist-credentials: false
      - name: Check the app FFI pin on pinned feat-cmux-next base
        run: scripts/cmux-next/check-app-ffi-pin.sh --verify-release
