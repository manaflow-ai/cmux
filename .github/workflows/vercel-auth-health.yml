name: Vercel auth health

on:
  workflow_dispatch:
    inputs:
      deploy_ref:
        description: Exact commit to deploy as a Vercel preview
        required: false
        type: string
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 15
    steps:
      - name: Check out preview source
        if: inputs.deploy_ref != ''
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.deploy_ref }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - name: Verify Vercel token
        run: bunx vercel@56.3.1 whoami
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Deploy exact source as preview
        if: inputs.deploy_ref != ''
        shell: bash
        run: |
          set -euo pipefail
          bunx vercel@56.3.1 link --yes \
            --project cmux --scope manaflow --cwd .
          preview_url="$(
            bunx vercel@56.3.1 deploy --yes --scope manaflow --cwd .
          )"
          case "$preview_url" in
            https://*) ;;
            *)
              echo "Vercel did not return a preview URL" >&2
              exit 1
              ;;
          esac
          printf 'Preview URL: %s\n' "$preview_url"
          check_status() {
            local path="$1"
            local expected="$2"
            local actual
            actual="$(
              bunx vercel@56.3.1 curl "$path" \
                --deployment "$preview_url" --scope manaflow --cwd . \
                -sS -o /dev/null -w '%{http_code}'
            )"
            printf 'Preview status: %s -> %s\n' "$path" "$actual"
            test "$actual" = "$expected"
          }
          check_status / 200
          check_status /windows 404
          check_status /linux 404
          printf '### Vercel preview\n\n[%s](%s)\n' \
            "$preview_url" "$preview_url" >> "$GITHUB_STEP_SUMMARY"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
