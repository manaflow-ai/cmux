name: Staging INTERNAL_TOKEN

# The classic -> NEXT migration staging proof (classic-migration-staging.yml, cmuxterm-hq#8793) calls
# cmux-platform-staging's internal migration route with that Worker's INTERNAL_TOKEN. The value was put by hand, a
# Worker secret cannot be read back, and no copy exists anywhere CI can read. So this mints a fresh value and, in one
# job, puts it everywhere staging holds it:
#   1. sealed to this repository's cloud-vm-staging environment as PLATFORM_STAGING_INTERNAL_TOKEN (ciphertext only,
#      artifact sealed-secrets, 1 day; scripts/ci/sealed_secrets.py, docs/ci-sealed-secrets.md). Sealing runs first,
#      so a failure there puts nothing.
#   2. cmux-platform-staging (the Worker that checks it).
#   3. cmux-api-staging, its only other staging caller (the PLATFORM binding: Slack bridge and machine join mint),
#      only when that Worker already has INTERNAL_TOKEN. A Worker without one is left without one: nothing turns on.
# A failed put leaves the earlier ones rotated; a rerun mints again and puts all of them. Any hand-kept copy goes stale.
# Then store the bundle as an account with write access to this repository's environment secrets:
#   gh run download RUN_ID -R manaflow-ai/cmux -n sealed-secrets -D "$(mktemp -d)"
#   python3 scripts/ci/sealed_secrets.py put DIR/sealed-secrets.json
# The value lives only in a shell variable and stdin: never printed, written to disk in the clear or passed as an
# argument. Staging only: no production Worker, key or environment is read or written. Runs on the push that adds or
# changes this file (which also registers it for dispatch) and on dispatch from feat-cmux-next.
on:
  push:
    branches: [feat-cmux-next]
    paths: [.github/workflows/internal-token-staging.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: internal-token-staging
  cancel-in-progress: false

jobs:
  rotate:
    if: github.ref == 'refs/heads/feat-cmux-next'
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.LINUX_RUNNER || fromJSON(vars.RUNNER_POOLS).linux_4 }}
    # The environment whose CLOUDFLARE_API_TOKEN deploys cmux-api-staging and already puts cmux-platform-staging's
    # JWT_PRIVATE_JWK (backend.yml deploy-staging).
    environment: cmux-next-staging
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: scripts/ci
          sparse-checkout-cone-mode: true

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"

      - name: libsodium
        run: |
          set -euo pipefail
          if ! ldconfig -p | grep -q 'libsodium\.so\.23'; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends libsodium23
          fi

      - name: Mint INTERNAL_TOKEN, seal it, put it on cmux-platform-staging and cmux-api-staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 0c1675e0def6de1ab3a50a4e17dc5656
          # manaflow-ai/cmux environment cloud-vm-staging's public key (not a secret), read from
          # repos/manaflow-ai/cmux/environments/cloud-vm-staging/secrets/public-key on 2026-11-10. `put` checks it
          # against the live key and writes nothing when GitHub has rotated it: update the pin and rerun.
          SEAL_KEY_ID: "3380204578043523366"
          SEAL_KEY: "7DHjeKhOU7ip/7dtB2qduaiN6K+nFY5n/KvTEwtDpQQ="
          BUNDLE: ${{ runner.temp }}/sealed-secrets.json
        run: |
          set +x
          set -euo pipefail
          SCRIPTS="$GITHUB_WORKSPACE/scripts/ci"
          cd "$RUNNER_TEMP"
          WR="npx -y wrangler@4.156.0"
          # 0 = the Worker has INTERNAL_TOKEN, 1 = it does not; an unreadable list stops the job.
          has() {
            local out rc=0
            out="$($WR secret list --name "$1" --format json)" || { echo "::error::wrangler secret list failed for $1; nothing more put"; exit 1; }
            printf '%s' "$out" | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{const l=JSON.parse(d);if(!Array.isArray(l))process.exit(9);process.exit(l.some(s=>s.name==="INTERNAL_TOKEN")?0:3)})' || rc=$?
            case "$rc" in 0) return 0 ;; 3) return 1 ;; *) echo "::error::could not read $1's secret list; nothing more put"; exit 1 ;; esac
          }
          api=no
          if has cmux-api-staging; then api=yes; fi
          echo "cmux-api-staging has INTERNAL_TOKEN before the run: $api"
          TOKEN="$(node -e 'process.stdout.write(require("crypto").randomBytes(32).toString("base64url"))')"
          if [ "${#TOKEN}" -lt 40 ]; then echo "::error::mint failed; nothing put"; exit 1; fi
          echo "::add-mask::$TOKEN"
          printf '%s' "$TOKEN" | python3 -c '
          import os, sys
          sys.path.insert(0, sys.argv[1])
          import sealed_secrets as s
          value = sys.stdin.read()
          bundle = s.seal_bundle("manaflow-ai/cmux", "cloud-vm-staging", os.environ["SEAL_KEY_ID"], os.environ["SEAL_KEY"],
                                 {"PLATFORM_STAGING_INTERNAL_TOKEN": value})
          s.write_bundle(os.environ["BUNDLE"], bundle)
          ' "$SCRIPTS"
          printf '%s' "$TOKEN" | $WR secret put INTERNAL_TOKEN --name cmux-platform-staging
          if [ "$api" = yes ]; then printf '%s' "$TOKEN" | $WR secret put INTERNAL_TOKEN --name cmux-api-staging; fi
          unset TOKEN
          workers="cmux-platform-staging"
          if [ "$api" = yes ]; then workers="$workers cmux-api-staging"; fi
          for w in $workers; do
            if has "$w"; then echo "$w INTERNAL_TOKEN: present"; else echo "::error::$w INTERNAL_TOKEN: ABSENT after put"; exit 1; fi
          done
          {
            echo "Rotated INTERNAL_TOKEN on: $workers (names only)."
            echo "Store PLATFORM_STAGING_INTERNAL_TOKEN in cloud-vm-staging: download artifact sealed-secrets, then"
            echo "\`python3 scripts/ci/sealed_secrets.py put DIR/sealed-secrets.json\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the sealed bundle (ciphertext only)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sealed-secrets
          path: ${{ runner.temp }}/sealed-secrets.json
          retention-days: 1
          if-no-files-found: error
