name: cmux-next iPhone What's New clips

# The What's New clips of iPhone highlights (release-notes/next/clips/ID.json with "app": "iphone";
# scripts/cmux-next/media/whats-new-clips.py). The media workflow's nightly tour (cmux-next-media.yml)
# records the Mac ones on a media Mac, which has no iOS simulator runtime, and plans only those
# (`plan --app mac`). On the same nightly-next push this workflow plans the iPhone ones, records each on a
# fleet simulator step (scripts/ci/cmux-next-ios-sim.sh clips: the app at the tip and, for an
# improvement, at the commit before its highlight, on one simulator; the controller's simulator class
# keeps one simulator per Mac), and publishes them to whats-new/ID/clip-auto-ROLE.webp the way the media
# workflow does (publish-auto, privacy-checked frame by frame). Best effort: a clip that fails is left out
# and the next nightly plans it again.
#
# Its own workflow, with no pull_request trigger, so it adds no job a pull request can start. The record
# job is a thin cmux-ci client on the build-fleet gateway runner (vars.CI_EVAL_STEP_GATEWAY), as the eval
# workflows are; with the variable unset nothing runs.

on:
  push:
    branches: [nightly-next]

permissions: {}

concurrency:
  # One run at a time per workflow on nightly-next tips, not one per commit (ci-min-per-pr-30; Leo, 2026-11-21:
  # "de facto, im asking for 99% fewer minutes of ci time, period."). nightly-next moves about 20 times a day,
  # and a per-commit group let every push start its own gateway job at once: they queued behind one another
  # at the fleet's one simulator per Mac while each held a gateway runner, and on 11-26 eleven clips and
  # energy runs sat to their timeout (240 and 150 min) and were cancelled: 1,172 of the 2,071 runner-min the
  # three simulator benches spent in the timing feed's 24 h to 19Z. One group keeps the run in flight and only the newest pushed tip pending (GitHub drops the older
  # pending one, a tip the newer one supersedes), and a pending run holds no runner. cmux-next-media.yml's
  # nightly tour does the same (cmux-next-media-nightly-tip).
  group: cmux-next-iphone-clips-nightly-tip
  cancel-in-progress: false

env:
  # Temporary REST budget attribution: one gh-call line per GitHub API call (scripts/ci/api_call_log/env.sh, fetched at a fixed commit when the checkout has no copy).
  BASH_ENV: '$({ w="${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh"; t="${RUNNER_TEMP:-/nonexistent}/api-call-log-src"; if [ -f "$w" ]; then echo "$w"; elif [ -n "${RUNNER_TEMP:-}" ]; then if [ ! -f "$t/env.sh" ] && [ ! -e "$t.tried" ] && { [ "${RUNNER_OS:-}" = Linux ] || [ "${RUNNER_OS:-}" = macOS ]; } && [ "$(date -u +%Y%m%d%H)" -lt 2026112300 ]; then : > "$t.tried"; mkdir -p "$t.part" && for x in env.sh gh sitecustomize.py isolated.py; do curl -fsSL --max-time 5 -o "$t.part/$x" "https://raw.githubusercontent.com/manaflow-ai/cmux/27647ffd3ae838c63be28ca3e5883dcd68c34518/scripts/ci/api_call_log/$x" || break; done; [ -s "$t.part/isolated.py" ] && mv "$t.part" "$t"; fi; if [ -f "$t/env.sh" ]; then echo "$t/env.sh"; else echo unset BASH_ENV > "$t.off.sh" && echo "$t.off.sh"; fi; fi; } 2>/dev/null)'

jobs:
  plan:
    name: Plan the iPhone clips
    if: ${{ github.repository_owner == 'manaflow-ai' && vars.CI_EVAL_STEP_GATEWAY != '' }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || 'cmux-linux' }}
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/cmux-next/media/whats-new-clips.py
            scripts/cmux-next/media/tour.py
            release-notes/next/highlights
            release-notes/next/clips
            .gitmodules
          sparse-checkout-cone-mode: false

      # As the media workflow's route job plans its clips (the same window, limit and published check).
      - name: Plan
        id: plan
        env:
          BASE: ${{ github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          echo "count=0" >> "$GITHUB_OUTPUT"
          [[ "$BASE" =~ ^[0-9a-f]{40}$ ]] && [[ "$BASE" != 0000000000000000000000000000000000000000 ]] \
            || { echo "no previous tip ($BASE); no clips"; exit 0; }
          head_time="$(git show -s --format=%ct "$HEAD")"
          git fetch --no-recurse-submodules --no-tags --quiet --filter=blob:none --shallow-since="@$((head_time - 8 * 86400))" origin "$HEAD"
          git cat-file -e "$BASE^{commit}" 2>/dev/null || git fetch --no-recurse-submodules --no-tags --quiet --filter=blob:none --depth=1 origin "$BASE"
          python3 scripts/cmux-next/media/whats-new-clips.py plan --app iphone --base "$BASE" --head "$HEAD" \
            --out "$RUNNER_TEMP/clips-plan.json" --tours "$RUNNER_TEMP/clip-tours" | tee /dev/stderr
          echo "plan=$(python3 -c 'import json, sys; print(json.dumps(json.load(open(sys.argv[1])), separators=(",", ":")))' "$RUNNER_TEMP/clips-plan.json")" >> "$GITHUB_OUTPUT"
          echo "count=$(python3 scripts/cmux-next/media/whats-new-clips.py count --plan "$RUNNER_TEMP/clips-plan.json" --app iphone)" >> "$GITHUB_OUTPUT"

  record:
    name: Record on a fleet simulator
    needs: plan
    if: ${{ needs.plan.outputs.count != '' && needs.plan.outputs.count != '0' && vars.CI_EVAL_STEP_GATEWAY != '' }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || 'mac-gateway' }} # frozen-label: CI_EVAL_STEP_GATEWAY (#54437)
    timeout-minutes: 240
    permissions:
      contents: read
    outputs:
      clips: ${{ steps.record.outputs.count }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: |
            scripts/cmux-next/media/whats-new-clips.py
            .gitmodules
          sparse-checkout-cone-mode: false

      - name: Record
        id: record
        env:
          CI_SIM_BENCH_QUEUE_S: ${{ vars.CI_SIM_BENCH_QUEUE_S }}
          CLIPS_PLAN: ${{ needs.plan.outputs.plan }}
          HEAD: ${{ github.sha }}
        # Every failure is handled where it happens: one clip's failed step must not drop the others.
        # Bounded to fit the job's 240 min: every clip's simulator step starts at once (the job waits the
        # slowest clip, not their sum), and each waits at most QUEUE_S to leave the fleet queue and runs
        # at most RUN_S (cmux-ci leaves up to 5400 s of compile out of --timeout): 60 + 90 + 60 = 210 min.
        # Before, the clips ran one after another, each with an unbounded queue wait (cmux-ci's default
        # --queue-timeout 0) and --timeout 7200: 45875681883 spent 3 h 10 min on its first clip (90 min in
        # the queue, a 706 MB source download over 35 min), and eleven runs on 11-26 sat to the timeout.
        run: |
          set +e
          set -uo pipefail
          client="${CMUX_CI_CLIENT:-$HOME/.local/bin/cmux-ci}"
          if ! [[ -x "$client" ]]; then
            echo "::warning title=What's New clip::$client is not installed on runner $RUNNER_NAME; no iPhone clips"
            echo "count=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          out="${RUNNER_TEMP:?}/media/whats-new-clips"
          mkdir -p "$out"
          count=0
          # A simulator-class wait past 15 min has never paid off (job 140683535687: 71 min, zero clips). Repo variable
          # CI_SIM_BENCH_QUEUE_S=3600 restores the old hour.
          QUEUE_S="${CI_SIM_BENCH_QUEUE_S:-900}" RUN_S=3600
          # A shipped nightly's clips rank above plain agent steps (--priority pr), due when the queue wait ends.
          # As plain agent steps they lost every turn: 45978228941's two clips sat their whole 3600 s while the
          # simulator class's p90 queue wait was 393 min (20 agent steps queued, 15 of 17 workers busy), so the
          # run published nothing and ios-feed-hides-closed-tabs and ios-new-task-cloud-machine shipped bare.
          rank=()
          if "$client" run --help 2>/dev/null | grep -q -- '--priority {'; then
            rank=(--priority pr --deadline "${QUEUE_S}s")
          fi
          # --priority pr is only the agent tag rank (-9, one above plain agent steps): 46020149254's three clips
          # still sat their 3600 s behind 45 queued simulator steps. These steps ship with the nightly, so their
          # key names it: the controller ranks a nightly's step in the delivery class (-6, nightlyOrPromoteJob),
          # ahead of every agent and person step.
          printf '%s\n' "$CLIPS_PLAN" > "$RUNNER_TEMP/clips-plan.json"
          record_one() {
            local id="$1" roles="$2" before="$3" log="$RUNNER_TEMP/iphone-$id.log" rc step
            local args=(--arg clips --arg "id=$id" --arg "roles=$roles")
            [ "$before" = - ] || args+=(--arg "base=$before")
            "$client" run --class simulator --script scripts/ci/cmux-next-ios-sim.sh --ref "$HEAD" \
              --key "nightly-next-whats-new-clip-${GITHUB_RUN_ID:?}-${GITHUB_RUN_ATTEMPT:-1}-$id" \
              --deadline "${QUEUE_S}s" \
              --queue-timeout "$QUEUE_S" --timeout "$RUN_S" ${rank[@]+"${rank[@]}"} \
              --artifact artifacts/ios-sim/whats-new-clips.zip "${args[@]}" > "$log" 2>&1
            rc=$?
            echo "$id: cmux-ci run exited $rc" >> "$log"
            # 75: the step never left the queue; it would keep its place and run for nobody, so take it back.
            if [ "$rc" = 75 ]; then
              step="$(grep -o -E 'step [0-9a-f]{24}' "$log" | head -1 | cut -d' ' -f2)"
              [ -z "$step" ] || "$client" cancel --reason "What's New clip $id: not out of the queue in ${QUEUE_S}s" "$step" >> "$log" 2>&1
            fi
          }
          ids=()
          while read -r id roles before; do
            [[ "$id" =~ ^[a-z0-9][a-z0-9-]{0,79}$ ]] || continue
            ids+=("$id")
            record_one "$id" "$roles" "$before" &
          done < <(python3 scripts/cmux-next/media/whats-new-clips.py iphone-runs --plan "$RUNNER_TEMP/clips-plan.json")
          wait
          for id in "${ids[@]}"; do
            log="$RUNNER_TEMP/iphone-$id.log"
            echo "::group::iPhone clip $id"; cat "$log"; echo "::endgroup::"
            step="$(grep -o -E 'step [0-9a-f]{24}' "$log" | head -1 | cut -d' ' -f2)"
            zip="$RUNNER_TEMP/iphone-$id.zip"
            # A step with one failed role still uploads the other's clip (--failed).
            if [ -z "$step" ] || ! { "$client" artifact "$step" "$zip" || "$client" artifact --failed "$step" "$zip"; }; then
              echo "::warning title=What's New clip::$id: the simulator step ${step:-(none)} returned no clips ($(tail -1 "$log"))"
              continue
            fi
            unzip -oq "$zip" -d "$RUNNER_TEMP/iphone-$id" && [ -d "$RUNNER_TEMP/iphone-$id/whats-new-clips" ] \
              && cp -R "$RUNNER_TEMP/iphone-$id/whats-new-clips/." "$out/" && count=$((count + 1)) \
              || echo "::warning title=What's New clip::$id: no clips folder in the step's artifact"
          done
          cp "$RUNNER_TEMP/clips-plan.json" "$out/plan.json"
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Keep the clips for the publish job
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-next-iphone-clips
          path: ${{ runner.temp }}/media/whats-new-clips
          if-no-files-found: ignore
          retention-days: 3

  # As cmux-next-media.yml's whats-new-clips job: rendered on Linux, published through the privacy-checked
  # action in the pr-media environment (which admits nightly-next).
  publish:
    name: Publish the iPhone clips
    needs: record
    if: ${{ !cancelled() && needs.record.outputs.clips != '' && needs.record.outputs.clips != '0' }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || 'cmux-linux' }}
    timeout-minutes: 20
    environment: pr-media
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            .github/actions/pr-media-publish
            scripts/pr-media.py
            scripts/ci/pr_media_privacy.py
            scripts/ci/pr_media_gate.py
            scripts/ci/pr_media_ocr_tesseract.py
            scripts/ci/pr_media_ocr.swift
            scripts/cmux-next/media/whats-new-clips.py
            scripts/cmux-next/media/tour.py
            release-notes/next/clips
            .gitmodules
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: cmux-next-iphone-clips
          path: ${{ runner.temp }}/media/whats-new-clips

      - name: Install the clip encoder
        timeout-minutes: 4
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          if ! command -v img2webp >/dev/null || ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends webp ffmpeg >/dev/null
          fi

      - name: Publish the clips
        uses: ./.github/actions/pr-media-publish
        with:
          private-terms: ${{ secrets.PR_MEDIA_PRIVATE_TERMS }}
          agent-authors: ${{ vars.PR_MEDIA_AGENT_AUTHORS }}
          github-token: ${{ github.token }}
          command: |
            clips="$RUNNER_TEMP/media/whats-new-clips"
            python3 scripts/cmux-next/media/whats-new-clips.py publish-auto \
              --plan "$clips/plan.json" --results "$clips" | tee -a "$GITHUB_STEP_SUMMARY"
