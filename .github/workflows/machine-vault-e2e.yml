name: Development E2E dispatcher

# "Make this Mac a cmux machine", with the vault, end to end against the DEVELOPMENT platform
# (https://cmux-platform-development.debussy.workers.dev) only, as a disposable macOS user made for
# the run: put a nonce in the dogfood account's vault with `cmux machine vault set`, run the one command
# `cmux machine add --vault --yes USER@localhost` (the join token rides ssh's stdin, the served join.sh
# installs acpmux, Claude Code and Codex and pulls the vault into the user's login keychain), check
# `acpmux machine vault status` as that user, then sign Claude Code in with the team's subscription and
# have a session started through acpmux print the nonce from its env and reply. The model is the shared
# model stub (tests/fixtures/model-stub) on the runner's loopback by default, with a made-up login the
# stub checks arrived; `model: real` signs Claude Code in with the team's subscription instead, and is
# the slow-schedule canary's run (real-login-canaries.yml on main dispatches it).
# The evidence (no secret; the nonce and the reply text are fine) is the run summary and the only
# artifact.
#
# Secrets: the dev stack pair (CMUX_DOGFOOD_STACK_EMAIL and _PASSWORD) and, with `model: real` only,
# the team's Claude subscription login (CLAUDE_CODE_OAUTH_TOKEN) reach the one run step, through env only.
# scripts/cmux-next/machine-vault-e2e.ts masks each value the moment it exists, gives the CLI the cmux
# token in one 0600 file under the runner's private temp (removed in its `finally`), passes vault
# values on stdin, and revokes the machine, removes the vault entries it set and revokes its install in
# `finally` and on a cancel. The Claude login goes on one ssh session's stdin into the disposable
# user's acpmux daemon env (never argv, never a file, never the vault, which refuses subscription
# logins); cleanup kills the user's processes that held it and confirms none is left, and the secret
# scan of the home and the output counts its hits (0 or the run fails). The disposable user, its home,
# its ssh key and its keychain are removed in an always() step. Manual dispatch on feat-cmux-next only.
on:
  workflow_dispatch:
    inputs:
      suite:
        description: Which development E2E suite to run
        required: false
        default: machine-vault
        type: choice
        options:
          - billing
          - machine-join
          - machine-vault
      join_channel:
        description: The acpmux channel join.sh installs from (files.cmux.com/cmux-tui/channels/NAME.json); it must carry the vault (cmux#33020)
        required: false
        default: feat-cmux-next
        type: string
      model:
        description: stub (the shared model stub, no login) or real (the team's Claude subscription; the canary)
        required: false
        default: stub
        type: choice
        options: [stub, real]

      calls:
        description: Model calls per PHASE=more round (each round syncs once)
        required: false
        default: "8"
        type: string
      name:
        description: Machine name for the join (default ci-join-<run id>)
        required: false
        default: ""
        type: string
      acpmux_ref:
        description: The commit acpmux is built from; only the run's commit (the feat-cmux-next tip) is accepted
        required: false
        default: ""
        type: string
      bench:
        description: "deps: while joined, time cold and warm Cargo and bun installs through acpmux machine deps warm; deps-slow: the same over a link with 150 ms more latency"
        required: false
        default: none
        type: choice
        options:
          - none
          - deps
          - deps-slow
      share:
        description: While joined, share the machine and require a viewer frame plus guest refusal
        required: false
        default: false
        type: boolean
      share_install:
        description: With share, install cmux-rd from the run build or channel
        required: false
        default: build
        type: choice
        options:
          - build
          - channel

permissions:
  contents: read

# One run at a time: every run uses the same account's vault and the same MACHINE_VAULT_E2E name. A
# second dispatch queues; a started run is never cancelled (it would leave its machine and entries).
concurrency:
  group: machine-vault-e2e
  cancel-in-progress: false

env:
  # Temporary REST budget attribution: one gh-call line per GitHub API call (scripts/ci/api_call_log/env.sh, fetched at a fixed commit when the checkout has no copy).
  BASH_ENV: '$({ w="${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh"; t="${RUNNER_TEMP:-/nonexistent}/api-call-log-src"; if [ -f "$w" ]; then echo "$w"; elif [ -n "${RUNNER_TEMP:-}" ]; then if [ ! -f "$t/env.sh" ] && [ ! -e "$t.tried" ] && { [ "${RUNNER_OS:-}" = Linux ] || [ "${RUNNER_OS:-}" = macOS ]; } && [ "$(date -u +%Y%m%d%H)" -lt 2026112300 ]; then : > "$t.tried"; mkdir -p "$t.part" && for x in env.sh gh sitecustomize.py isolated.py; do curl -fsSL --max-time 5 -o "$t.part/$x" "https://raw.githubusercontent.com/manaflow-ai/cmux/27647ffd3ae838c63be28ca3e5883dcd68c34518/scripts/ci/api_call_log/$x" || break; done; [ -s "$t.part/isolated.py" ] && mv "$t.part" "$t"; fi; if [ -f "$t/env.sh" ]; then echo "$t/env.sh"; else echo unset BASH_ENV > "$t.off.sh" && echo "$t.off.sh"; fi; fi; } 2>/dev/null)'

jobs:
  e2e:
    if: github.ref == 'refs/heads/feat-cmux-next' && inputs.suite == 'machine-vault'
    # The same environment as machine-join-e2e.yml: limited to feat-cmux-next by GitHub's branch
    # policy (tests/test_machine_vault_e2e_workflow.py pins the job's three secret references).
    environment:
      name: cmux-next-vm-image-dev
      deployment: false
    # An ephemeral Blacksmith macOS VM, made for this one job and destroyed after it: the job adds an
    # OS user, opens ssh to it and holds the stack secrets, so never a persistent owned Mac (the minis'
    # pools) and never a runner variable that could name one. The AWS Macs have no GitHub runners
    # except the trusted promote runner, which this job must not take. A literal label, since the macos_26 pool
    # can name an owned mini, where its sudo calls fail (tests/test_ci_owned_mac_jobs_no_sudo.py).
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || 'blacksmith-6vcpu-macos-26' }} # ephemeral-required: adds a macOS user as root
    timeout-minutes: 60
    env:
      HUB_ORIGIN: https://cmux-platform-development.debussy.workers.dev
    steps:
      - name: Refuse any ref but feat-cmux-next
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != refs/heads/feat-cmux-next ]; then
            echo "::error::machine-vault-e2e runs on feat-cmux-next only (got $REF)"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          # The published CLI step looks back along feat-cmux-next for the newest published tree.
          fetch-depth: 30

      # The channel join.sh installs acpmux from must be at or after the vault's merge (cmux#33020,
      # 4cfaaa8d), or the join would succeed and pull nothing. The run checks the installed binary's
      # capability too; this refuses early, before any secret is in reach.
      - name: Refuse a channel without the vault
        id: channel
        env:
          CHANNEL_INPUT: ${{ inputs.join_channel }}
          GH_TOKEN: ${{ github.token }}
          VAULT_MERGE: 4cfaaa8d3891d43b3e237c70b0dbf701feb92de2
        run: |
          set -euo pipefail
          channel="${CHANNEL_INPUT:-feat-cmux-next}"
          if ! printf '%s' "$channel" | grep -Eq '^[a-z0-9][a-z0-9-]{0,62}$'; then
            echo "::error::join_channel must be lowercase letters, digits and -"
            exit 1
          fi
          commit="$(curl --proto '=https' --tlsv1.2 -fsSL "https://files.cmux.com/cmux-tui/channels/$channel.json" | jq -r '.commit // empty' | tr -cd '0-9a-f')"
          if [ "${#commit}" -ne 40 ]; then
            echo "::error::the $channel channel names no commit"
            exit 1
          fi
          status="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/compare/$VAULT_MERGE...$commit" | jq -r '.status // empty' | tr -cd 'a-z')"
          if [ "$status" != ahead ] && [ "$status" != identical ]; then
            echo "::error::the $channel channel is at $commit, which does not contain the vault (cmux#33020, $VAULT_MERGE): compare says '$status'. Run again once the channel has moved past it."
            exit 1
          fi
          echo "channel $channel is at $commit, which contains the vault"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Restore pinned Bun 1.4.4 from the CI cache bucket
        shell: bash
        continue-on-error: true
        run: bash "$GITHUB_WORKSPACE/scripts/ci/toolchain-r2.sh" restore bun 1.4.4 || true

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
          no-cache: ${{ !startsWith(github.workspace, '/home/runner/work/') }}

      # The harness's own tests, before any secret is in reach.
      - name: Test the harness
        run: bun test scripts/cmux-next/machine-vault-e2e.test.ts

      # The cmux CLI as people get it: the build files.cmux.com published for the run's commit, or for the
      # newest first-parent ancestor that has one (a tree publishes a few minutes after its merge), checked
      # against its manifest's sha256 and required to contain `cmux machine add --vault` (cmux#33031).
      # Nothing compiles here: no toolchain, no submodules, no cache in a job that holds secrets.
      - name: Download the published cmux CLI
        id: cli
        env:
          GH_TOKEN: ${{ github.token }}
          MACHINE_ADD_MERGE: 657906ec79ebd3704cdf6be709e3a206be438754
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            arm64) target=aarch64-apple-darwin ;;
            x86_64) target=x86_64-apple-darwin ;;
            *) echo "::error::unsupported machine $(uname -m)"; exit 1 ;;
          esac
          dir="$RUNNER_TEMP/cmux-cli"
          mkdir -p "$dir"
          chmod 0700 "$dir"
          found=""
          for commit in $(git rev-list --first-parent -n 30 HEAD); do
            if curl --proto '=https' --tlsv1.2 -fsSL "https://files.cmux.com/cmux-tui/$commit/manifest.json" -o "$dir/manifest.json" 2>/dev/null \
              && [ "$(jq -r '.commit // empty' "$dir/manifest.json")" = "$commit" ]; then
              found="$commit"
              break
            fi
          done
          if [ -z "$found" ]; then
            echo "::error::no cmux-tui tree is published for the last 30 commits of feat-cmux-next"
            exit 1
          fi
          status="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/compare/$MACHINE_ADD_MERGE...$found" | jq -r '.status // empty' | tr -cd 'a-z')"
          if [ "$status" != ahead ] && [ "$status" != identical ]; then
            echo "::error::the published CLI at $found does not contain cmux machine add --vault ($MACHINE_ADD_MERGE): compare says '$status'"
            exit 1
          fi
          want="$(jq -r --arg k "cmux-tui-$target" '.binaries[$k] // empty' "$dir/manifest.json" | tr -cd '0-9a-f')"
          if [ "${#want}" -ne 64 ]; then
            echo "::error::the manifest for $found has no cmux-tui-$target"
            exit 1
          fi
          curl --proto '=https' --tlsv1.2 -fsSL "https://files.cmux.com/cmux-tui/$found/cmux-tui-$target" -o "$dir/cmux"
          got="$(shasum -a 256 "$dir/cmux" | awk '{print $1}')"
          if [ "$got" != "$want" ]; then
            echo "::error::checksum mismatch for cmux-tui-$target at $found ($got, the manifest says $want)"
            exit 1
          fi
          chmod 0700 "$dir/cmux"
          echo "path=$dir/cmux" >> "$GITHUB_OUTPUT"
          echo "the cmux CLI published for $found (sha256 $got)"

      # The user, its home, a login keychain made the way a GUI login makes one (random password, set
      # as default, unlocked, no auto-lock), and an ephemeral ssh key, all before any secret is in reach.
      # The outputs come first so the removal step runs even if a later line fails.
      - name: Create the disposable user
        id: user
        env:
          CHANNEL: ${{ steps.channel.outputs.channel }}
          CLI: ${{ steps.cli.outputs.path }}
        run: |
          set -euo pipefail
          user="cmuxvault${GITHUB_RUN_ID}${GITHUB_RUN_ATTEMPT}"
          user="${user:0:31}"
          home="/Users/$user"
          work="$(mktemp -d "$RUNNER_TEMP/machine-vault-e2e.XXXXXX")"
          chmod 0700 "$work"
          {
            echo "user=$user"
            echo "home=$home"
            echo "work=$work"
          } >> "$GITHUB_OUTPUT"
          if id "$user" >/dev/null 2>&1 || [ -e "$home" ]; then
            echo "::error::$user or $home already exists"
            exit 1
          fi
          # Throwaway values for a user that is deleted at the end of this job.
          password="$(openssl rand -hex 24)"
          keychain_password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          echo "::add-mask::$keychain_password"
          sudo -n sysadminctl -addUser "$user" -fullName "cmux vault e2e $GITHUB_RUN_ID" -shell /bin/zsh \
            -home "$home" -password "$password" >/dev/null 2>&1
          unset password
          sudo -n createhomedir -c -u "$user" >/dev/null
          uid="$(id -u "$user")"
          echo "uid=$uid" >> "$GITHUB_OUTPUT"
          # Remote Login may admit only a group (System Settings > Sharing > Remote Login > only these users).
          if dscl . -read /Groups/com.apple.access_ssh >/dev/null 2>&1; then
            sudo -n dseditgroup -o edit -a "$user" -t user com.apple.access_ssh
          fi
          as_user() { sudo -n -u "$user" -- /usr/bin/env -i HOME="$home" USER="$user" LOGNAME="$user" PATH=/usr/bin:/bin:/usr/sbin:/sbin "$@"; }
          kc="$home/Library/Keychains/login.keychain-db"
          as_user /bin/mkdir -p "$home/Library/Keychains"
          as_user /usr/bin/security create-keychain -p "$keychain_password" "$kc"
          as_user /usr/bin/security list-keychains -d user -s "$kc"
          as_user /usr/bin/security default-keychain -d user -s "$kc"
          as_user /usr/bin/security set-keychain-settings "$kc"
          as_user /usr/bin/security unlock-keychain -p "$keychain_password" "$kc"
          # Every shell of the user (the join's ssh session, the harness's commands) unlocks it first, as a
          # GUI login would, and gets the run's join knobs. The file is the user's own, 0600, and goes
          # with the home. CMUX_JOIN_INTERACTIVE=0: no sign-in prompt on a run with no terminal.
          printf '%s\n' "$keychain_password" | as_user /usr/bin/tee "$home/.cmux-e2e-keychain" >/dev/null
          unset keychain_password
          as_user /bin/chmod 0600 "$home/.cmux-e2e-keychain"
          {
            printf '%s\n' "/usr/bin/security unlock-keychain -p \"\$(/bin/cat \"\$HOME/.cmux-e2e-keychain\")\" \"\$HOME/Library/Keychains/login.keychain-db\" >/dev/null 2>&1"
            printf 'export CMUX_JOIN_CHANNEL=%s CMUX_JOIN_INTERACTIVE=0\n' "$CHANNEL"
          } | as_user /usr/bin/tee "$home/.zshenv" >/dev/null
          # The ssh key: the private half in the runner's private work directory, the public half the
          # user's only authorized key. A wrapper first on the CLI's PATH makes `ssh` use it, a known_hosts
          # of its own and no prompt.
          ssh-keygen -q -t ed25519 -N '' -C "machine-vault-e2e-$GITHUB_RUN_ID" -f "$work/id_ed25519"
          as_user /bin/mkdir -m 0700 -p "$home/.ssh"
          as_user /usr/bin/tee "$home/.ssh/authorized_keys" <"$work/id_ed25519.pub" >/dev/null
          as_user /bin/chmod 0600 "$home/.ssh/authorized_keys"
          mkdir -m 0700 "$work/bin"
          cat >"$work/bin/ssh" <<EOF
          #!/bin/sh
          exec /usr/bin/ssh -F /dev/null -i "$work/id_ed25519" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$work/known_hosts" "\$@"
          EOF
          chmod 0700 "$work/bin/ssh"
          install -m 0700 "$CLI" "$work/bin/cmux"
          # Remote Login: on where it is off (an ephemeral VM), then proved with the user's own key.
          if ! nc -z -w 3 127.0.0.1 22 >/dev/null 2>&1; then
            sudo -n launchctl enable system/com.openssh.sshd || true
            sudo -n launchctl bootstrap system /System/Library/LaunchDaemons/ssh.plist 2>/dev/null || true
          fi
          if ! "$work/bin/ssh" -o ConnectTimeout=15 -- "$user@localhost" true; then
            echo "::error::ssh to $user@localhost with its key failed: Remote Login is off or refuses this user"
            exit 1
          fi
          echo "made $user (uid $uid) with a login keychain and an ssh key"

      # The model stub: loopback only, this checkout's script; the run step reads its log.
      - name: Start the model stub
        id: stub
        if: inputs.model != 'real'
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/model-stub"
          mkdir -m 0700 "$dir"
          nohup python3 tests/fixtures/model-stub/model_stub.py --script tests/fixtures/model-stub/machine-vault-e2e.json \
            --log "$dir/log.jsonl" --ready-file "$dir/ready.json" >"$dir/out.txt" 2>&1 &
          # A fresh macOS VM's first python3 start can take well over 10 s (run 41830168353 timed out at 10 s
          # with the stub still starting); give it two minutes, and show its output if it never listens.
          for _ in $(seq 600); do [ -s "$dir/ready.json" ] && break; sleep 0.2; done
          if [ ! -s "$dir/ready.json" ]; then
            echo "::error::the model stub did not listen within 120 s ($(command -v python3 || echo no python3))"
            cat "$dir/out.txt" || true
            exit 1
          fi
          port="$(jq -r '.port' "$dir/ready.json")"
          echo "url=http://127.0.0.1:$port" >> "$GITHUB_OUTPUT"
          echo "log=$dir/log.jsonl" >> "$GITHUB_OUTPUT"
          echo "model stub on 127.0.0.1:$port"

      # The only step that sees the secrets, through env. No `set -x`: the script prints its own lines.
      - name: Vault, join, agent and cleanup
        timeout-minutes: 40
        env:
          CMUX_UITEST_STACK_EMAIL: ${{ secrets.CMUX_DOGFOOD_STACK_EMAIL }}
          CMUX_UITEST_STACK_PASSWORD: ${{ secrets.CMUX_DOGFOOD_STACK_PASSWORD }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ inputs.model == 'real' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          MODEL_STUB_URL: ${{ steps.stub.outputs.url }}
          MODEL_STUB_LOG: ${{ steps.stub.outputs.log }}
          VAULT_USER: ${{ steps.user.outputs.user }}
          VAULT_HOME: ${{ steps.user.outputs.home }}
          VAULT_WORK: ${{ steps.user.outputs.work }}
        # exec: bun is the step's process, so a cancel's SIGINT reaches it and it cleans up at once.
        run: |
          exec bun scripts/cmux-next/machine-vault-e2e.ts --origin "$HUB_ORIGIN" --cmux "$VAULT_WORK/bin/cmux" \
            --user "$VAULT_USER" --home "$VAULT_HOME" --ssh "$VAULT_WORK/bin/ssh" --name "ci-vault-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --work "$VAULT_WORK" --evidence "$RUNNER_TEMP/machine-vault-e2e-evidence/evidence.json" --run "$GITHUB_RUN_ID" --sha "$GITHUB_SHA"

      # Fails on a token or credential prefix, a JWT, an Anthropic key or Claude login shape (sk-ant-,
      # which covers sk-ant-oat01-...) or an auth header in the evidence (nothing is then uploaded or
      # summarized), on missing evidence, and on a run that did not pass.
      - name: Check the evidence
        id: evidence
        if: always() && steps.user.outcome == 'success'
        run: |
          set -euo pipefail
          file="$RUNNER_TEMP/machine-vault-e2e-evidence/evidence.json"
          if [ ! -s "$file" ]; then
            echo "::error::no evidence was written; if a machine joined, revoke it in the platform's machine list and remove MACHINE_VAULT_E2E from the vault"
            exit 1
          fi
          if grep -Eqi 'cmj_|cmm_|sk-ant-|eyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\.|bearer|authorization' "$file"; then
            echo "::error::the evidence holds a secret-shaped value; it is not uploaded"
            exit 1
          fi
          echo "clean=true" >> "$GITHUB_OUTPUT"
          {
            echo '## Machine vault E2E (development)'
            echo
            echo '```json'
            cat "$file"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$(jq -r '.result' "$file")" != pass ]; then
            echo "::error::$(jq -r '.reason' "$file" | tr -cd 'A-Za-z0-9 ._:;,()/-' | cut -c1-500)"
            exit 1
          fi

      - name: Upload the evidence
        if: always() && steps.evidence.outputs.clean == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: machine-vault-e2e-evidence
          path: ${{ runner.temp }}/machine-vault-e2e-evidence/evidence.json
          if-no-files-found: error
          retention-days: 3

      # The user's processes (its acpmux daemon, its agents), the user, its home (keychain, ssh key,
      # vault items) and the runner's private work directory (the ssh key's private half, the CLI).
      # `kill -1` run as the disposable user signals exactly the processes that user owns.
      - name: Remove the disposable user
        if: always() && steps.user.outputs.user != ''
        env:
          VAULT_USER: ${{ steps.user.outputs.user }}
          VAULT_UID: ${{ steps.user.outputs.uid }}
          VAULT_HOME: ${{ steps.user.outputs.home }}
          VAULT_WORK: ${{ steps.user.outputs.work }}
        run: |
          set -uo pipefail
          if id "$VAULT_USER" >/dev/null 2>&1; then
            sudo -n -u "$VAULT_USER" -- /bin/kill -KILL -1 2>/dev/null || true
            sleep 1
            # The user's login keychain (its vault items) first, then the user and its home.
            sudo -n -u "$VAULT_USER" -- /usr/bin/env -i HOME="$VAULT_HOME" /usr/bin/security delete-keychain \
              "$VAULT_HOME/Library/Keychains/login.keychain-db" 2>/dev/null || true
            if [ -n "$VAULT_UID" ]; then sudo -n launchctl bootout "user/$VAULT_UID" 2>/dev/null || true; fi
            sudo -n dseditgroup -o edit -d "$VAULT_USER" -t user com.apple.access_ssh 2>/dev/null || true
            sudo -n sysadminctl -deleteUser "$VAULT_USER" >/dev/null 2>&1 || true
          fi
          case "$VAULT_HOME" in
            /Users/cmuxvault*) sudo -n rm -rf -- "$VAULT_HOME" ;;
          esac
          case "$VAULT_WORK" in
            "$RUNNER_TEMP"/machine-vault-e2e.*) rm -rf -- "$VAULT_WORK" ;;
          esac
          if [ -n "$VAULT_UID" ]; then sudo -n rm -rf -- "/tmp/acpmux-$VAULT_UID"; fi
          if id "$VAULT_USER" >/dev/null 2>&1 || [ -e "$VAULT_HOME" ]; then
            echo "::error::the disposable user $VAULT_USER or its home is still present"
            exit 1
          fi

  billing:
    if: github.ref == 'refs/heads/feat-cmux-next' && inputs.suite == 'billing'
    concurrency:
      group: billing-e2e
      cancel-in-progress: false
    environment: cmux-next-vm-image-dev
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || vars.CI_OVERFLOW_LINUX || 'cmux-linux' }}
    timeout-minutes: 60
    env:
      E2E_STRIPE_TEST_KEY: ${{ secrets.E2E_STRIPE_TEST_KEY }}
      E2E_BILLING_LEVELS_KEY: ${{ secrets.DEV_BILLING_LEVELS_KEY }}
      E2E_STACK_EMAIL: ${{ secrets.CMUX_DOGFOOD_STACK_EMAIL }}
      E2E_STACK_PASSWORD: ${{ secrets.CMUX_DOGFOOD_STACK_PASSWORD }}
      E2E_STATE: /tmp/billing-e2e-state.json
      E2E_BIG_CALLS: ${{ inputs.calls }}
    # pipefail: a phase piped to tee fails its step when bun fails (#40356 F3).
    defaults:
      run:
        shell: bash -eo pipefail {0}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          sparse-checkout: backend/scripts
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
          no-cache: ${{ !startsWith(github.workspace, '/home/runner/work/') }}
      - name: Secrets present
        run: |
          for name in E2E_STRIPE_TEST_KEY E2E_BILLING_LEVELS_KEY E2E_STACK_EMAIL E2E_STACK_PASSWORD; do
            [ -n "${!name}" ] || { echo "::error::the cmux-next-vm-image-dev environment has no ${name}"; exit 1; }
          done
      - name: NEXT plan checkout (link, 303, test-mode session read back, expired)
        run: bun backend/scripts/stripe-plan-e2e.ts | tee -a "$RUNNER_TEMP/e2e.log"
      - name: Buy (PHASE=a)
        run: PHASE=a bun backend/scripts/stripe-usage-e2e.ts | tee -a "$RUNNER_TEMP/e2e.log"
      - name: Use past the included amount (PHASE=more until both levels pass it)
        run: |
          for _ in 1 2 3 4 5 6; do
            PHASE='more' bun backend/scripts/stripe-usage-e2e.ts | tee -a "$RUNNER_TEMP/e2e.log"
            # The e2e set includes 1 USD per team and 2 x 0.5 per seat: both levels must pass 1 USD.
            if bun -e 'const s = JSON.parse(require("fs").readFileSync(process.env.E2E_STATE, "utf8")); process.exit(s.team.level.micros > 1e6 && s.seat.level.micros > 1e6 ? 0 : 1)'; then exit 0; fi
          done
          echo "::error::the levels did not pass the included amounts in 6 rounds"; exit 1
      - name: Hit the cap (PHASE=cap)
        run: PHASE=cap bun backend/scripts/stripe-usage-e2e.ts | tee -a "$RUNNER_TEMP/e2e.log"
      - name: Renew (PHASE=b)
        run: PHASE=b bun backend/scripts/stripe-usage-e2e.ts | tee -a "$RUNNER_TEMP/e2e.log"
      - name: Read the invoices back (PHASE=c)
        run: |
          PHASE=c bun backend/scripts/stripe-usage-e2e.ts | tee -a "$RUNNER_TEMP/e2e.log"
          grep '"check"' "$RUNNER_TEMP/e2e.log" | tail -1 > "$RUNNER_TEMP/check.json"
          bun -e 'const c = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).check; for (const [side, v] of Object.entries(c)) if (!v.pass || v.marked_up === false) { console.error(`::error::${side}: ${JSON.stringify(v)}`); process.exit(1) }' "$RUNNER_TEMP/check.json"
      - name: Cap read back
        run: |
          # The cap phase's lines: the refusal, the level at the cap, the plan's spend_cap and the refused machine start.
          grep -E '"(cap_refusal|level_at_cap|plan_spend_cap|machine_create_at_cap)"' "$RUNNER_TEMP/e2e.log" | tee "$RUNNER_TEMP/cap.jsonl"
          grep -q '"cap_refusal":"402' "$RUNNER_TEMP/cap.jsonl" || { echo "::error::no model call was refused at the cap"; exit 1; }
          grep -q '"code":"cloud.spend_cap.reached"' "$RUNNER_TEMP/cap.jsonl" || { echo "::error::the machine start was not refused at the cap"; exit 1; }
      - name: Cleanup (PHASE=cleanup)
        if: always()
        run: |
          [ -f "$E2E_STATE" ] || exit 0
          PHASE=cleanup bun backend/scripts/stripe-usage-e2e.ts | tee -a "$RUNNER_TEMP/e2e.log"
      - name: Summary
        if: always()
        run: |
          { echo '```json'; cat "$RUNNER_TEMP/e2e.log" 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  machine_join:
    if: github.ref == 'refs/heads/feat-cmux-next' && inputs.suite == 'machine-join'
    concurrency:
      group: machine-join-e2e
      cancel-in-progress: false
    # A secret-reading dispatch job runs in an environment (tests/test_supplychain_security.py). This
    # existing one is limited to feat-cmux-next by GitHub's branch policy; its own secret is never read here
    # (tests/test_machine_join_e2e_workflow.py pins the job's four secret references).
    environment:
      name: cmux-next-vm-image-dev
      deployment: false
    # Blacksmith only (16 vCPU; 32 while the overflow switch's record exists): a VM that runs
    # this one job and is destroyed. Never LINUX_RUNNER, which may name a persistent host, since
    # this job adds an OS user and holds the stack secrets.
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || 'cmux-fleet-linux-x64' }} # frozen-label: holds account secrets; frozen to the linux_8 label it read (tests/test_machine_join_e2e_workflow.py)
    timeout-minutes: 90
    env:
      HUB_ORIGIN: https://cmux-platform-development.debussy.workers.dev
      # share: the development device hub (workers/device-hub/wrangler.toml [env.dev]).
      DEVICE_HUB: https://cmux-device-hub-dev.debussy.workers.dev
    steps:
      - name: Refuse any ref but feat-cmux-next
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != refs/heads/feat-cmux-next ]; then
            echo "::error::machine-join-e2e runs on feat-cmux-next only (got $REF)"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Resolve inputs
        id: inputs
        env:
          NAME_INPUT: ${{ inputs.name }}
          ACPMUX_REF_INPUT: ${{ inputs.acpmux_ref }}
          SHARE: ${{ inputs.share }}
          SHARE_INSTALL: ${{ inputs.share_install }}
        run: |
          set -euo pipefail
          if [ "$SHARE_INSTALL" = channel ] && [ "$SHARE" != true ]; then
            echo "::error::share_install: channel goes with share: true"
            exit 1
          fi
          name="${NAME_INPUT:-ci-join-$GITHUB_RUN_ID}"
          if ! printf '%s' "$name" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._-]{0,62}$'; then
            echo "::error::name must be 1-63 letters, digits, dot, underscore or dash"
            exit 1
          fi
          # acpmux is built from the run's own commit only: the build runs as the runner user, which
          # later holds the stack secrets, so no other (older) code may build here.
          if [ -n "$ACPMUX_REF_INPUT" ] && [ "$ACPMUX_REF_INPUT" != "$GITHUB_SHA" ]; then
            echo "::error::acpmux_ref must be the run's commit ($GITHUB_SHA); dispatch on feat-cmux-next builds its tip"
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Install Linux build dependencies
        run: |
          # Skip apt when the runner image already has these (tests/test_ci_apt_skips_baked_packages.py).
          if dpkg -s clang libclang-dev pkg-config >/dev/null 2>&1; then
            echo "clang libclang-dev pkg-config: already installed"
          else
            sudo apt-get update
            sudo apt-get install -y clang libclang-dev pkg-config
          fi

      - name: Set up pinned Rust
        uses: ./.github/actions/setup-cmux-tui-rust

      - name: Restore pinned Bun 1.4.4 from the CI cache bucket
        shell: bash
        continue-on-error: true
        run: bash "$GITHUB_WORKSPACE/scripts/ci/toolchain-r2.sh" restore bun 1.4.4 || true

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
          no-cache: ${{ !startsWith(github.workspace, '/home/runner/work/') }}

      # The harness's own redaction and failure-path tests, before any secret is in reach.
      - name: Test the harness
        run: bun test scripts/cmux-next/machine-join-e2e.test.ts

      - name: Build acpmux
        working-directory: cmux-tui
        run: cargo build --locked -p acpmux --bin acpmux

      # share: Xvfb (the host's virtual display and the viewer's own) and cmux-rd from the run's commit,
      # with the release features (cmux-rd-release.yml): Cisco's OpenH264, downloaded at run time, and the
      # device hub link. cmux-rd-host is its own Cargo workspace. dbus-user-session gives the joined
      # user's lingering user manager its session bus (/run/user/UID/bus), which the share's user
      # units need; the runner image has none (run 44004680060: no bus after 30 s).
      - name: Install the share's display server
        if: inputs.share
        run: |
          # Skip apt when the runner image already has these (tests/test_ci_apt_skips_baked_packages.py).
          if dpkg -s xvfb dbus-user-session >/dev/null 2>&1; then echo "xvfb dbus-user-session: already installed"; else sudo apt-get install -y xvfb dbus-user-session; fi

      - name: Build cmux-rd
        id: cmuxrd
        if: inputs.share
        run: |
          set -euo pipefail
          manifest=cmux-tui/crates/cmux-rd-host/Cargo.toml
          cargo build --locked --manifest-path "$manifest" --no-default-features --features openh264,link --bin cmux-rd
          target_dir="$(cargo metadata --format-version 1 --no-deps --manifest-path "$manifest" | jq -r .target_directory)"
          echo "bin=$target_dir/debug/cmux-rd" >> "$GITHUB_OUTPUT"

      # The user and base path go to the outputs before useradd, so cleanup runs even if a later line fails.
      - name: Create the disposable user
        id: user
        run: |
          set -euo pipefail
          # Under /srv, not /tmp: a fleet runner's unit has a /tmp of its own (PrivateTmp), which the
          # joined user's user manager (started by PID 1) does not see. With the home there the manager
          # found no unit file in it (run 44970728746: "Unit file cmux-screen-host.service does not exist").
          sudo install -d -o root -g root -m 0755 /srv
          base="$(sudo mktemp -d /srv/machine-join-e2e.XXXXXX)"
          user="cmuxjoin-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          {
            echo "user=$user"
            echo "base=$base"
            echo "home=$base/home"
          } >> "$GITHUB_OUTPUT"
          # acpmux refuses a state directory with an ancestor owned by anyone but root or its own user
          # (config.rs validate_private_state_ancestors), and the disposable user must not be able to
          # replace the binary: the base is root's, 0755, before the user exists.
          sudo chown root:root "$base"
          sudo chmod 0755 "$base"
          # An empty home, not a copy of /etc/skel (hundreds of MB on some runner images): it holds only what
          # acpmux writes, which the harness scans in full.
          sudo useradd --no-create-home --home-dir "$base/home" --shell /usr/sbin/nologin --user-group "$user"
          uid="$(id -u "$user")"
          echo "uid=$uid" >> "$GITHUB_OUTPUT"
          sudo install -d -o "$user" -g "$user" -m 0700 "$base/home"
          sudo install -d -o root -g root -m 0755 "$base/bin"
          sudo install -o root -g root -m 0755 cmux-tui/target/debug/acpmux "$base/bin/acpmux"
          # Every ancestor of the home and of the binary: owned by root or the user, no group or other
          # write unless sticky (as /tmp is), and no extended ACL (ls marks one with a trailing +): the
          # rule acpmux applies to its state ancestors, and what keeps the binary out of the user's reach.
          for start in "$base/home" "$base/bin/acpmux"; do
            path="$start"
            while :; do
              perms="$(sudo ls -ld -- "$path" | cut -d' ' -f1)"
              if [ "${perms:10:1}" = + ]; then
                echo "::error::$path ($perms) has an extended ACL"
                exit 1
              fi
              read -r owner mode < <(sudo stat -c '%u %a' -- "$path")
              if [ "$owner" != 0 ] && [ "$owner" != "$uid" ]; then
                echo "::error::$path is owned by uid $owner, not root or the disposable user"
                exit 1
              fi
              if [ $((8#$mode & 8#022)) -ne 0 ] && [ $((8#$mode & 8#1000)) -eq 0 ]; then
                echo "::error::$path ($mode) is writable by group or others and not sticky"
                exit 1
              fi
              [ "$path" = / ] && break
              path="$(dirname -- "$path")"
            done
          done

      # Real acpmux as the disposable user, with no secret in reach: a join takes its lock, and so makes
      # and checks its state directory and every ancestor, before it reads stdin. Malformed stdin then
      # ends it with exit 2 (join.malformed) before any request; exit 5 (join.store) is the directory refusal.
      - name: Smoke-test acpmux as the disposable user
        env:
          JOIN_USER: ${{ steps.user.outputs.user }}
          JOIN_BASE: ${{ steps.user.outputs.base }}
          JOIN_HOME: ${{ steps.user.outputs.home }}
        run: |
          set -uo pipefail
          out="$RUNNER_TEMP/machine-join-smoke.txt"
          # The runner, not the disposable user, writes the output file (it lives in the runner's temp).
          # The step shell is `bash -e`: the expected non-zero exit is captured, not fatal.
          code=0
          # shellcheck disable=SC2024
          printf 'not-a-join-token\n' | sudo -n -u "$JOIN_USER" -- /usr/bin/env -i -C "$JOIN_HOME" \
            HOME="$JOIN_HOME" USER="$JOIN_USER" LOGNAME="$JOIN_USER" \
            PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin LANG=C.UTF-8 \
            "$JOIN_BASE/bin/acpmux" host join --hub "$HUB_ORIGIN" --name ci-join-smoke --json >"$out" 2>&1 || code=$?
          # acpmux's output, made plain: no line can start a workflow command (::stop-commands:: would turn
          # the later steps' masks into text).
          sed -e 's/::/: :/g' -e 's/##\[/## [/g' -- "$out"
          if [ "$code" -eq 5 ]; then
            echo "::error::acpmux refused its state directory as the disposable user (exit 5, join.store)"
            exit 1
          fi
          if [ "$code" -ne 2 ]; then
            echo "::error::the malformed-input join exited $code, not 2"
            exit 1
          fi
          read -r owner mode < <(sudo stat -c '%U %a' -- "$JOIN_HOME/.acpmux")
          if [ "$owner" != "$JOIN_USER" ] || [ "$mode" != 700 ]; then
            echo "::error::the state directory is $owner $mode, not $JOIN_USER 700"
            exit 1
          fi

      # With share: the run's cmux-rd root-owned beside acpmux (the viewer's) and, with share_install: build, linked
      # where the host's user unit runs it (~/.local/bin/cmux-rd, where the joined machine's daemon looks for it).
      # With share_install: channel, nothing there: the join script root-owned beside acpmux, and the channel's
      # sha256 for this machine's cmux-rd, which the join must install; the joined user's user manager running (lingering,
      # started explicitly so a failure names its reason, as that user's ssh login would start it: the daemon's setup installs and starts the host unit through it, and
      # the host starts the virtual display through it); and a second disposable user for the viewer, with
      # its own empty home. Nothing of the share itself runs here. No secret here.
      - name: Prepare the share
        id: share
        if: inputs.share
        env:
          JOIN_USER: ${{ steps.user.outputs.user }}
          JOIN_UID: ${{ steps.user.outputs.uid }}
          JOIN_BASE: ${{ steps.user.outputs.base }}
          JOIN_HOME: ${{ steps.user.outputs.home }}
          CMUX_RD_BIN: ${{ steps.cmuxrd.outputs.bin }}
          SHARE_INSTALL: ${{ inputs.share_install }}
        run: |
          set -euo pipefail
          viewer="cmuxview-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          # Recorded before useradd, so its removal runs even if a later line fails.
          {
            echo "viewer=$viewer"
            echo "viewer_home=$JOIN_BASE/viewer"
          } >> "$GITHUB_OUTPUT"
          sudo install -o root -g root -m 0755 "$CMUX_RD_BIN" "$JOIN_BASE/bin/cmux-rd"
          if [ "$SHARE_INSTALL" = channel ]; then
            # The install path: nothing at ~/.local/bin/cmux-rd; the join line's cmux-rd step (root-owned, from the
            # run's commit) installs it from the channel, which must carry cmux-rd for this machine.
            sudo install -o root -g root -m 0644 cmux-tui/scripts/machine-join.sh "$JOIN_BASE/bin/machine-join.sh"
            case "$(uname -m)" in
              x86_64 | amd64) rd_target=x86_64-unknown-linux-gnu ;;
              aarch64 | arm64) rd_target=aarch64-unknown-linux-gnu ;;
              *) echo "::error::no cmux-rd build for $(uname -m)"; exit 1 ;;
            esac
            rd_sha="$(curl --proto '=https' --tlsv1.2 -fsSL https://files.cmux.com/cmux-tui/channels/feat-cmux-next.json |
              jq -r --arg n "cmux-tui-rd-$rd_target" '.binaries[$n] // empty' | tr -cd '0-9a-f')"
            if [ "${#rd_sha}" -ne 64 ]; then
              echo "::error::the feat-cmux-next channel carries no cmux-rd-$rd_target yet; share_install: channel needs a channel that does"
              exit 1
            fi
            echo "rd_sha256=$rd_sha" >> "$GITHUB_OUTPUT"
          else
            sudo -n -u "$JOIN_USER" -- /usr/bin/env -i HOME="$JOIN_HOME" PATH=/usr/bin:/bin \
              /bin/sh -c 'mkdir -p "$HOME/.local/bin" && ln -s "$1" "$HOME/.local/bin/cmux-rd"' sh "$JOIN_BASE/bin/cmux-rd"
          fi
          sudo useradd --no-create-home --home-dir "$JOIN_BASE/viewer" --shell /usr/sbin/nologin --user-group "$viewer"
          sudo install -d -o "$viewer" -g "$viewer" -m 0700 "$JOIN_BASE/viewer"
          # The viewer's decoder (Cisco's OpenH264, a one-time download) before the share, so the first-frame
          # bound measures the share. The host's encoder is left to the share itself, as on a real machine.
          sudo -n -u "$viewer" -- /usr/bin/env -i HOME="$JOIN_BASE/viewer" PATH=/usr/bin:/bin \
            "$JOIN_BASE/bin/cmux-rd" openh264-install
          # The X socket directory both displays use (the host's from :99, the viewer's :42).
          sudo install -d -o root -g root -m 1777 /tmp/.X11-unix
          # The host's display is started by its user manager, which sees PID 1's /tmp, not this job's
          # own (PrivateTmp on a fleet runner): the same directory there. One /tmp on a hosted runner.
          sudo nsenter -t 1 -m -- install -d -o root -g root -m 1777 /tmp/.X11-unix
          # What runs the user manager here: PID 1 and logind (one line each, in every run's log).
          echo "pid 1: $(ps -o comm= -p 1); system: $(systemctl is-system-running 2>&1 || true); logind: $(systemctl is-active systemd-logind.service 2>&1 || true)"
          systemctl is-active --quiet systemd-logind.service || sudo systemctl start systemd-logind.service
          sudo loginctl enable-linger "$JOIN_USER"
          # Lingering asks logind to start it; starting it here too says why when it cannot.
          manager="user@$JOIN_UID.service"
          # Its exit status is not the verdict: on a runner it can exit 1 with the manager up. The manager is
          # judged by `is-active` and its socket, both read as root (/run/user/UID is the joined user's, 0700).
          start_rc=0
          sudo timeout 60 systemctl start "$manager" || start_rc=$?
          # The manager's own socket, which `systemctl --user` connects to (the session bus is a separate
          # package, dbus-user-session, which a machine need not have).
          private="/run/user/$JOIN_UID/systemd/private"
          for _ in $(seq 1 60); do
            sudo test -S "$private" && break
            sleep 0.5
          done
          if ! sudo systemctl is-active --quiet "$manager" || ! sudo test -S "$private"; then
            echo "::group::why the joined user's user manager is not running"
            sudo timeout 20 systemctl status --no-pager --lines 20 systemd-logind.service "user-runtime-dir@$JOIN_UID.service" "$manager" || true
            sudo timeout 20 journalctl -b --no-pager --lines 60 -u systemd-logind.service -u "user-runtime-dir@$JOIN_UID.service" -u "$manager" || true
            sudo ls -la "/run/user/$JOIN_UID" "/run/user/$JOIN_UID/systemd" || true
            echo "::endgroup::"
            echo "::error::the joined user's user manager did not start (systemctl start $manager: exit $start_rc, $(sudo systemctl is-active "$manager" 2>&1 || true); $private after 30 s: $(sudo test -S "$private" && echo yes || echo no))"
            exit 1
          fi
          bus="/run/user/$JOIN_UID/bus"
          echo "user manager: running; session bus: $(sudo test -S "$bus" && echo "$bus" || echo none)"
          sudo -n -u "$JOIN_USER" -- /usr/bin/env -i HOME="$JOIN_HOME" PATH=/usr/bin:/bin \
            XDG_RUNTIME_DIR="/run/user/$JOIN_UID" \
            systemctl --user is-system-running || true

      # With bench=deps: cmux-tui's sources and the webviews manifest copied for the disposable user, the
      # toolchain root-owned beside acpmux, and scripts/cmux-next/deps-bench.sh (root-owned) to run while
      # joined. Every cache the bench fills lives under the base, outside the scanned home. No secret here.
      - name: Prepare the dependency bench
        if: startsWith(inputs.bench, 'deps')
        env:
          JOIN_USER: ${{ steps.user.outputs.user }}
          JOIN_BASE: ${{ steps.user.outputs.base }}
          BENCH: ${{ inputs.bench }}
        run: |
          set -euo pipefail
          sysroot="$(cd cmux-tui && rustc --print sysroot)"
          sudo cp -a -- "$sysroot" "$JOIN_BASE/toolchain"
          sudo chown -R root:root "$JOIN_BASE/toolchain"
          sudo chmod -R go-w "$JOIN_BASE/toolchain"
          sudo install -o root -g root -m 0755 "$(command -v bun)" "$JOIN_BASE/bin/bun"
          sudo install -o root -g root -m 0755 scripts/cmux-next/deps-bench.sh "$JOIN_BASE/bin/deps-bench.sh"
          sudo install -d -o "$JOIN_USER" -g "$JOIN_USER" -m 0700 "$JOIN_BASE/bench" "$JOIN_BASE/bench/webviews"
          # cmux-tui's workspace and the one path dependency outside it (crates/cmux-tui -> workers/cmux-vm/cli).
          git archive HEAD cmux-tui workers/cmux-vm/cli | sudo -n -u "$JOIN_USER" -- tar -x -C "$JOIN_BASE/bench"
          # The manifest without its scripts (the postinstall reads the app's catalogs, not part of the bench).
          jq 'del(.scripts)' webviews/package.json | sudo -n -u "$JOIN_USER" -- tee "$JOIN_BASE/bench/webviews/package.json" >/dev/null
          sudo -n -u "$JOIN_USER" -- cp -- webviews/bun.lock "$JOIN_BASE/bench/webviews/bun.lock"
          # deps-slow: every packet out of this VM waits 150 ms more (a far-away registry and cache).
          # The VM is destroyed after the job, so the delay is never undone. A kernel without netem
          # gets the same delay from a local proxy that the bench routes every tool's HTTPS through.
          if [ "$BENCH" = deps-slow ]; then
            dev="$(ip -o route get 1.1.1.1 | sed -n 's/.* dev \([^ ]*\).*/\1/p')"
            sudo modprobe sch_netem 2>/dev/null || true
            if sudo tc qdisc replace dev "$dev" root netem delay 150ms; then
              tc qdisc show dev "$dev"
              echo netem | sudo -n -u "$JOIN_USER" -- tee "$JOIN_BASE/bench/link" >/dev/null
            else
              sudo install -o root -g root -m 0755 scripts/cmux-next/delay-proxy.py "$JOIN_BASE/bin/delay-proxy.py"
              echo 150 | sudo -n -u "$JOIN_USER" -- tee "$JOIN_BASE/bench/link-proxy-ms" >/dev/null
              echo proxy | sudo -n -u "$JOIN_USER" -- tee "$JOIN_BASE/bench/link" >/dev/null
            fi
          fi

      # The only step that sees the stack secrets, through env. No `set -x`: the script prints its own lines.
      - name: Mint, join, verify and revoke
        timeout-minutes: 60
        env:
          CMUX_UITEST_STACK_EMAIL: ${{ secrets.CMUX_DOGFOOD_STACK_EMAIL }}
          CMUX_UITEST_STACK_PASSWORD: ${{ secrets.CMUX_DOGFOOD_STACK_PASSWORD }}
          # The share's guest account (cloud-capture-provision.yml's journey-guest): it must be refused.
          CMUX_UITEST_GUEST_STACK_EMAIL: ${{ secrets.CMUX_DOGFOOD_GUEST_STACK_EMAIL }}
          CMUX_UITEST_GUEST_STACK_PASSWORD: ${{ secrets.CMUX_DOGFOOD_GUEST_STACK_PASSWORD }}
          JOIN_NAME: ${{ steps.inputs.outputs.name }}
          JOIN_USER: ${{ steps.user.outputs.user }}
          JOIN_BASE: ${{ steps.user.outputs.base }}
          JOIN_HOME: ${{ steps.user.outputs.home }}
          BENCH: ${{ inputs.bench }}
          SHARE: ${{ inputs.share }}
          VIEWER_USER: ${{ steps.share.outputs.viewer }}
          VIEWER_HOME: ${{ steps.share.outputs.viewer_home }}
          SHARE_INSTALL: ${{ inputs.share_install }}
          RD_SHA256: ${{ steps.share.outputs.rd_sha256 }}
        # exec: bun is the step's process, so a cancel's SIGINT reaches it and it revokes at once.
        run: |
          bench=()
          case "$BENCH" in deps | deps-slow) bench=(--bench "$JOIN_BASE/bin/deps-bench.sh") ;; esac
          share=()
          if [ "$SHARE" = true ]; then
            share=(--share-cmux-rd "$JOIN_BASE/bin/cmux-rd" --viewer-user "$VIEWER_USER" --viewer-home "$VIEWER_HOME" --device-hub "$DEVICE_HUB")
            if [ "$SHARE_INSTALL" = channel ]; then
              share+=(--share-install-script "$JOIN_BASE/bin/machine-join.sh" --share-rd-sha256 "$RD_SHA256")
            fi
          fi
          exec bun scripts/cmux-next/machine-join-e2e.ts --origin "$HUB_ORIGIN" --acpmux "$JOIN_BASE/bin/acpmux" \
            --user "$JOIN_USER" --home "$JOIN_HOME" --name "$JOIN_NAME" \
            --evidence "$RUNNER_TEMP/machine-join-e2e/evidence.json" --run "$GITHUB_RUN_ID" --sha "$GITHUB_SHA" "${bench[@]}" "${share[@]}"

      # Fails on a token or credential prefix, a JWT or an auth header in the evidence (nothing is then
      # uploaded or summarized), on missing evidence, and on a joined machine not shown revoked.
      - name: Check the evidence
        id: evidence
        if: always() && steps.user.outcome == 'success'
        run: |
          set -euo pipefail
          file="$RUNNER_TEMP/machine-join-e2e/evidence.json"
          if [ ! -s "$file" ]; then
            echo "::error::no evidence was written; if a machine joined, revoke it in the platform's machine list"
            exit 1
          fi
          if grep -Eqi 'cmj_|cmm_|eyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\.|bearer|authorization' "$file"; then
            echo "::error::the evidence holds a secret-shaped value; it is not uploaded"
            exit 1
          fi
          echo "clean=true" >> "$GITHUB_OUTPUT"
          {
            echo '## Machine join E2E (development)'
            echo
            echo '```json'
            cat "$file"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # Printed values are plain characters only, so no line of the evidence can start a workflow command.
          machine="$(jq -r '.machineId // empty' "$file" | tr -cd 'A-Za-z0-9._:-' | cut -c1-128)"
          if [ -n "$machine" ] && [ "$(jq -r '.revoke.revokedListed' "$file")" != true ]; then
            echo "::error::machine $machine is not shown revoked; revoke it in the platform's machine list"
            exit 1
          fi
          if [ "$(jq -r '.result' "$file")" != pass ]; then
            echo "::error::$(jq -r '.reason' "$file" | tr -cd 'A-Za-z0-9 ._:;,()/-' | cut -c1-500)"
            exit 1
          fi

      - name: Upload the evidence
        if: always() && steps.evidence.outputs.clean == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: machine-join-e2e-evidence
          path: ${{ runner.temp }}/machine-join-e2e/evidence.json
          if-no-files-found: error
          retention-days: 3

      # share: the viewer's processes, the viewer user and its home (inside the base, so before the base goes).
      - name: Remove the viewer user
        if: always() && steps.share.outputs.viewer != ''
        env:
          VIEWER_USER: ${{ steps.share.outputs.viewer }}
        run: |
          set -uo pipefail
          sudo -n -u "$VIEWER_USER" -- /bin/kill -KILL -1 2>/dev/null || true
          sleep 1
          sudo userdel --remove "$VIEWER_USER" 2>/dev/null || true
          if id "$VIEWER_USER" >/dev/null 2>&1; then
            echo "::error::the viewer user $VIEWER_USER is still present"
            exit 1
          fi

      # The user's processes, the user and its home, and its socket directory. `kill -1` run as the
      # disposable user signals exactly the processes that user owns (all started by this job), nothing else.
      - name: Remove the disposable user
        if: always() && steps.user.outputs.user != ''
        env:
          JOIN_USER: ${{ steps.user.outputs.user }}
          JOIN_UID: ${{ steps.user.outputs.uid }}
          JOIN_BASE: ${{ steps.user.outputs.base }}
        run: |
          set -uo pipefail
          # share: its user manager (lingering) goes first, so nothing starts the user's processes again.
          sudo loginctl disable-linger "$JOIN_USER" 2>/dev/null || true
          sudo loginctl terminate-user "$JOIN_USER" 2>/dev/null || true
          sudo -n -u "$JOIN_USER" -- /bin/kill -KILL -1 2>/dev/null || true
          sleep 1
          sudo userdel --remove "$JOIN_USER" 2>/dev/null || true
          sudo rm -rf -- "$JOIN_BASE"
          if [ -n "$JOIN_UID" ]; then sudo rm -rf -- "/tmp/acpmux-$JOIN_UID"; fi
          if id "$JOIN_USER" >/dev/null 2>&1; then
            echo "::error::the disposable user $JOIN_USER is still present"
            exit 1
          fi
