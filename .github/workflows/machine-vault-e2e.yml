name: Machine vault E2E (development)

# The implementation lives on feat-cmux-next. GitHub dispatches only a
# workflow the default branch registers, so this inert copy lets lanes run:
#
#   gh workflow run machine-vault-e2e.yml -R manaflow-ai/cmux --ref feat-cmux-next
#
# A dispatch runs the file at --ref, so feat-cmux-next's inputs and jobs win;
# these inputs only mirror them for the Actions form.
on:
  workflow_dispatch:
    inputs:
      join_channel:
        description: The acpmux channel join.sh installs from (files.cmux.com/cmux-tui/channels/NAME.json)
        required: false
        default: feat-cmux-next
        type: string
      model:
        description: stub (the shared model stub, no login) or real (the team's Claude subscription; the weekly canary, real-login-canaries.yml)
        required: false
        default: stub
        type: choice
        options: [stub, real]

permissions: {}

jobs:
  registration:
    runs-on: ${{ vars.CI_BLACKSMITH_OFF == '1' && contains(toJSON(github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404'), '"blacksmith-') && (github.event.pull_request && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || 'cmux-fleet-linux-x64') || (github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404') }}
    steps:
      - run: echo "Machine vault E2E is implemented on feat-cmux-next; dispatch it with --ref feat-cmux-next"
