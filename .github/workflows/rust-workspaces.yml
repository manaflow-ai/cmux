name: rust workspaces

# Pull-request clippy --all-targets and cargo test for every Cargo workspace beside
# cmux-tui's own (which cmux-tui-spec.yml lints). .github/rust-workspaces.toml lists
# them all; .github/scripts/rust-workspaces.py checks that list against the tree,
# plans the workspaces a change reaches (its files, or a package it uses by path) and
# runs each one. The plan is the path filter; the only workflow filter is the
# docs-only block, which puts back every file an include_str! compiles in
# (tests/test_ci_docs_only_prs.py).

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  # docs-only-fallback.yml calls this in a pull request's own context when the `paths:` above could
  # have skipped it wrongly (over 300 changed files, or a full-ci/dev-build label): scripts/ci/docs_only_paths.py.
    # Generated by scripts/ci/pr_trigger_paths.py from .github/scripts/rust-workspaces.py (run workspaces' reach); run its `write` after editing that.
    paths:
      - "**/.cargo/**"
      - "**/Cargo.lock"
      - "**/Cargo.toml"
      - "**/rust-toolchain"
      - "**/rust-toolchain.toml"
      - ".github/actions/runner-cargo-home/action.yml"
      - ".github/actions/runner-cargo-home/runner-cargo-home.sh"
      - ".github/actions/setup-cmux-tui-rust/**"
      - ".github/rust-workspaces.toml"
      - ".github/scripts/rust-workspaces.py"
      - ".github/scripts/test_rust_workspaces.py"
      - ".github/workflows/cmux-rd-release.yml"
      - ".github/workflows/rust-workspaces.yml"
