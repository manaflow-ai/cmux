name: rust workspaces

# Pull-request clippy --all-targets and cargo test for every Cargo workspace beside
# cmux-tui's own (which cmux-tui-spec.yml lints). .github/rust-workspaces.toml lists
# them all; .github/scripts/rust-workspaces.py checks that list against the tree,
# plans the workspaces a change reaches (its files, or a package it uses by path) and
# runs each one. The plan is the path filter, so this workflow has none.

on:
  pull_request:
  push:
    branches:
      - main
      # Saves each workspace's cargo cache, so pull requests into it start warm.
      - feat-cmux-next
  workflow_dispatch:

concurrency:
  # Every feat-cmux-next push gets its own run: the next one only diffs against its own parent.
  group: rust-workspaces-${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Temporary REST budget attribution: one gh-call line per GitHub API call (scripts/ci/api_call_log/env.sh).
  BASH_ENV: ${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh

jobs:
  # A local test receipt (scripts/ci/ci_receipt.py). Leo: "if you test a change locally and it works or whatever,
  # like we can just count that as a pass, as a skip in CI." Only for a same-repository pull request whose body names
  # one (`CI-Receipt: rust-workspaces <Fast checks run URL>`), so every other run spends no runner and no API call
  # here. The receipt is a Fast checks run of the canonical `python3 scripts/ci/ci_receipt.py produce rust-workspaces`
  # on this head (`cmux-ci test`), which GitHub attests: no key. It must have merged onto this run's very base (no
  # freshness rule reads this check). The verifier comes from the base commit, never the pull request. A valid
  # receipt skips plan and every workspace before they take a runner and the summary passes;
  # CI_RECEIPT_AUDIT_PERCENT (default 10) of them still run in full, and a red there names the receipt.
  receipt:
    name: local test receipt
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.body, 'CI-Receipt:') }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.CI_CLOUD_OVERFLOW_SAVED && (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-8vcpu-ubuntu-2404' || fromJSON(vars.RUNNER_POOLS).linux_8) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-2vcpu-ubuntu-2404' || fromJSON(vars.RUNNER_POOLS).linux_2) }}
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      valid: ${{ steps.verify.outputs.valid }}
      audit: ${{ steps.verify.outputs.audit }}
      run_url: ${{ steps.verify.outputs.run_url }}
      producer: ${{ steps.verify.outputs.producer }}
    steps:
      # The merge commit and its parents only: no blobs, one small file in the work tree.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 2
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/rust-workspaces.toml

      - name: Check out the trusted receipt verifier
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .receipt-verifier
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/ci/ci_receipt.py

      - name: Verify the local test receipt
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BODY: ${{ github.event.pull_request.body }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          AUDIT_PERCENT: ${{ vars.CI_RECEIPT_AUDIT_PERCENT }}
        run: |
          set -euo pipefail
          verifier=.receipt-verifier/scripts/ci/ci_receipt.py
          if [[ ! -f "$verifier" ]]; then
            echo "valid=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=CI receipt::the base has no receipt verifier yet; every workspace runs"
            exit 0
          fi
          [[ "$(git rev-parse HEAD^2)" == "$HEAD_SHA" ]] || { echo "valid=false" >> "$GITHUB_OUTPUT"; echo "::notice title=CI receipt::the merge ref is not on the head"; exit 0; }
          python3 "$verifier" verify rust-workspaces --repo "$GITHUB_REPOSITORY" --head "$HEAD_SHA" \
            --base "$(git rev-parse HEAD^1)" --head-tree "$(git rev-parse 'HEAD^2^{tree}')" \
            --merge-tree "$(git rev-parse 'HEAD^{tree}')" --audit-percent "$AUDIT_PERCENT" --output "$GITHUB_OUTPUT"

  plan:
    name: plan (changed Cargo workspaces)
    needs: receipt
    # Skipped before it takes a runner when a valid local test receipt covers the change, unless audited.
    if: ${{ !cancelled() && (needs.receipt.result != 'success' || needs.receipt.outputs.valid != 'true' || needs.receipt.outputs.audit == 'true') }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.CI_CLOUD_OVERFLOW_SAVED && (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-8vcpu-ubuntu-2404' || fromJSON(vars.RUNNER_POOLS).linux_8) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-2vcpu-ubuntu-2404' || fromJSON(vars.RUNNER_POOLS).linux_2) }}
    # Room for the lock check's serial network pass and retries on a cold, busy runner (cmux#41586).
    timeout-minutes: 20
    outputs:
      jobs: ${{ steps.plan.outputs.jobs }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Test the workspace check
        run: python3 .github/scripts/test_rust_workspaces.py

      - name: Every Cargo workspace is listed
        run: python3 .github/scripts/rust-workspaces.py check

      # Pull requests compare with the base their merge commit was made on (its first
      # parent), pushes with the commit before them; with none (a new branch or a
      # dispatch) every workspace is planned.
      - name: Fetch the comparison base
        id: base
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event_name == 'push' && github.event.before || '' }}
        run: |
          if [[ "$EVENT_NAME" == pull_request ]]; then
            BASE_SHA=$(git cat-file -p HEAD | awk '/^parent /{print $2; exit}')
          fi
          if [[ -n "$BASE_SHA" && ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            BASE_SHA=""
          fi
          if [[ -n "$BASE_SHA" && "$BASE_SHA" != 0000000000000000000000000000000000000000 ]]; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA" || echo "::warning::could not fetch $BASE_SHA; planning every workspace"
          fi
          echo "sha=$BASE_SHA" >> "$GITHUB_OUTPUT"

      # Seconds, no build: each tracked Cargo.lock resolves from the registry index (cargo update --workspace
      # --locked). A manifest change in one workspace can leave another workspace's lock stale through a path
      # dependency; eb4f3eb1d94 (a direct push) did that to cmux-app-ffi, and every pull request went red on
      # its --locked build. On a feat-cmux-next push the base autofix rewrites the stale locks
      # (cmux-next-base-autofix.yml, base-autofix.sh --locks); the pre-push gate runs the same check.
      # --strict: CI is the backstop, so a workspace cargo could not judge (a registry error) is red here, never a
      # silent pass; the pre-push gate stays lenient. A timeout is the runner's, not the change's: it is retried
      # with a longer limit, and fails only in a workspace the change touches (--base); elsewhere it warns
      # (cmux#41586: 0 stale, 5 timed out on a cold 2-vCPU runner, red on a change with no Rust in it).
      # --deadline: the whole check ends inside this job's timeout-minutes, with room for the setup and the plan
      # after it, so a slow resolve is reported as unchecked instead of the job being cut (cmux#41742 review F2).
      - name: Set up pinned Rust (lock check)
        uses: ./.github/actions/setup-cmux-tui-rust

      - name: Every Cargo.lock matches its manifests
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          status=0
          python3 scripts/cmux-next/cargo-locks.py check --strict --base "$BASE_SHA" --deadline 840 || status=$?
          if [[ $status == 1 ]]; then
            echo "::error::a Cargo.lock no longer matches its manifests; run scripts/cmux-next/cargo-locks.py fix and commit the locks"
          elif [[ $status != 0 ]]; then
            echo "::error::a workspace this change touches could not be checked (the unchecked: lines above say why)"
          fi
          exit "$status"

      - name: Plan the workspaces this change reaches
        id: plan
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          jobs=$(python3 .github/scripts/rust-workspaces.py plan --base "$BASE_SHA")
          echo "jobs=$jobs" >> "$GITHUB_OUTPUT"
          python3 -c 'import json, sys; jobs = json.loads(sys.argv[1]); print("\n".join(j["root"] for j in jobs) or "no Cargo workspace reached")' "$jobs"

  workspace:
    name: ${{ matrix.root }}
    needs: plan
    if: ${{ needs.plan.outputs.jobs != '[]' }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-4vcpu-ubuntu-2404' || !startsWith(vars.LINUX_RUNNER, 'blacksmith-') && vars.LINUX_RUNNER || vars.CI_CLOUD_OVERFLOW_SAVED && fromJSON(vars.RUNNER_POOLS).linux_16 || fromJSON(vars.RUNNER_POOLS).linux_8 }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.jobs) }}
    # ghostty-vt-sys builds libghostty-vt from the ghostty-next gitlink with zig, as in
    # cmux-tui.yml (an empty CMUX_GHOSTTY_SRC overrides a runner-level one).
    env:
      GHOSTTY_ZIG_SOURCE: ghostty-next
      CMUX_GHOSTTY_SRC: ""
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Linux build dependencies
        env:
          EXTRA_APT: ${{ matrix.apt }}
        run: |
          sudo apt-get update
          # shellcheck disable=SC2086 # a space-separated package list
          sudo apt-get install -y clang libclang-dev pkg-config $EXTRA_APT

      - name: Init the ghostty-next submodule (libghostty-vt for ghostty-vt-sys)
        if: ${{ matrix.ghostty }}
        run: bash scripts/ci/init-submodule.sh ghostty-next

      - name: Install zig
        if: ${{ matrix.ghostty }}
        run: ./scripts/install-zig-ci.sh

      - name: Set up pinned Rust
        uses: ./.github/actions/setup-cmux-tui-rust

      # A workspace with its own rust-toolchain.toml builds with that pin. The setup
      # action puts cmux-tui's toolchain first on PATH, so this and the run step go
      # through rustup's cargo, which reads the pin from the working directory.
      - name: Install the workspace's own toolchain pin
        working-directory: ${{ matrix.root }}
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup toolchain install
          rustup component add clippy
          cargo --version

      # Only a feat-cmux-next push saves the build cache; a pull request reads the base branch's.
      - name: Cache cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          workspaces: ${{ matrix.root }} -> target
          key: ${{ matrix.root }}
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/feat-cmux-next' }}

      - name: cargo clippy --all-targets and cargo test
        env:
          ROOT: ${{ matrix.root }}
        run: PATH="$HOME/.cargo/bin:$PATH" python3 .github/scripts/rust-workspaces.py run "$ROOT"

  # One stable check name for the whole matrix (a skipped matrix is green). A plan or matrix that judged nothing
  # (cancelled, abandoned) is no verdict, never a pass and never this change's red (scripts/ci/needs_verdict.py).
  summary:
    name: rust workspaces
    needs: [receipt, plan, workspace]
    if: ${{ always() }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.CI_CLOUD_OVERFLOW_SAVED && (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-8vcpu-ubuntu-2404' || fromJSON(vars.RUNNER_POOLS).linux_8) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-2vcpu-ubuntu-2404' || fromJSON(vars.RUNNER_POOLS).linux_2) }}
    timeout-minutes: 5
    steps:
      - name: Every planned workspace passed
        env:
          PLAN: ${{ needs.plan.result }}
          WORKSPACES: ${{ needs.workspace.result }}
          RECEIPT_VALID: ${{ needs.receipt.result == 'success' && needs.receipt.outputs.valid || 'false' }}
          RECEIPT_AUDIT: ${{ needs.receipt.outputs.audit }}
          RECEIPT_RUN: ${{ needs.receipt.outputs.run_url }}
          RECEIPT_PRODUCER: ${{ needs.receipt.outputs.producer }}
        run: |
          if [[ "$RECEIPT_VALID" == true && "$RECEIPT_AUDIT" != true ]]; then
            echo "rust workspaces: local test receipt $RECEIPT_RUN (by $RECEIPT_PRODUCER) covers this merge"
            exit 0
          fi
          if [[ "$RECEIPT_AUDIT" == true && ( "$PLAN" == failure || "$WORKSPACES" == failure ) ]]; then
            echo "::error title=CI receipt audit::rust workspaces failed on a merge whose local test receipt $RECEIPT_RUN (by $RECEIPT_PRODUCER) passed them"
          fi
          needs_verdict() {  # scripts/ci/needs_verdict.py SHELL_RULE, copied verbatim (tests/test_needs_verdict.py)
            local what=$1 failed="" unjudged="" pair name result; shift
            for pair in "$@"; do
              name=${pair%%=*}; result=${pair#*=}
              if [[ "$name" == *"?" ]]; then name=${name%"?"}; [[ "$result" == skipped ]] && result=success; fi
              case "${result%%[ :]*}" in
                success) ;;
                failure|invalid) failed+=" $name: $result;" ;;
                *) unjudged+=" $name ${result:-none}," ;;
              esac
            done
            if [[ -n "$failed" ]]; then echo "::error::summary red: $what:${failed%;}"; return 1; fi
            if [[ -n "$unjudged" ]]; then
              echo "::error::no verdict: $what:${unjudged%,}; nothing it summarizes was judged: re-run the run"; return 3
            fi
            echo "$what: every job passed"
          }
          echo "plan: $PLAN, workspaces: $WORKSPACES"
          needs_verdict "rust workspaces" "plan=$PLAN" "workspace?=$WORKSPACES"
