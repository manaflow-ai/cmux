  workflow_call:
    inputs:
      sha:
        description: Commit to test (empty is the caller's commit).
        type: string
        default: ""
      only:
        description: Run only this job id (a bisect probe); empty runs every job.
        type: string
        default: ""
  # feat-cmux-next runs this in the post-merge batch (cmux-next-post-merge.yml, suite rust-workspaces), not per push.
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  # Every feat-cmux-next push gets its own run: the next one only diffs against its own parent.
  group: rust-workspaces-${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'feat-cmux-next' && (github.event.action == 'labeled' && !contains(fromJSON('["full-ci","ready-to-land"]'), github.event.label.name) || github.event.action == 'unlabeled') && format('-label-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Warnings never fail a pull request's compile (Leo, 2026-11-19); pushes, dispatches, nightly and release
  # keep them errors. scripts/ci/warnings_policy.py.
  CI_WARNINGS: ${{ github.event_name == 'pull_request' && 'soft' || 'deny' }}
  # Temporary REST budget attribution: one gh-call line per GitHub API call (scripts/ci/api_call_log/env.sh, fetched at a fixed commit when the checkout has no copy).
  BASH_ENV: '$({ w="${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh"; t="${RUNNER_TEMP:-/nonexistent}/api-call-log-src"; if [ -f "$w" ]; then echo "$w"; elif [ -n "${RUNNER_TEMP:-}" ]; then if [ ! -f "$t/env.sh" ] && [ ! -e "$t.tried" ] && { [ "${RUNNER_OS:-}" = Linux ] || [ "${RUNNER_OS:-}" = macOS ]; } && [ "$(date -u +%Y%m%d%H)" -lt 2026112300 ]; then : > "$t.tried"; mkdir -p "$t.part" && for x in env.sh gh sitecustomize.py isolated.py; do curl -fsSL --max-time 5 -o "$t.part/$x" "https://raw.githubusercontent.com/manaflow-ai/cmux/27647ffd3ae838c63be28ca3e5883dcd68c34518/scripts/ci/api_call_log/$x" || break; done; [ -s "$t.part/isolated.py" ] && mv "$t.part" "$t"; fi; if [ -f "$t/env.sh" ]; then echo "$t/env.sh"; else echo unset BASH_ENV > "$t.off.sh" && echo "$t.off.sh"; fi; fi; } 2>/dev/null)'

jobs:
  # Full-ci base merge carry (scripts/ci/head_tier.py, full_carry): a full-ci or ready-to-land label on a head that
  # is only a base merge onto a head whose full run passed carries that run, so plan and every workspace skip and the
  # summary passes. Its tier is "none" only then; any lookup error, an overlap with the change's own files, a merge with its
  # own edits, or no full run at the parent leaves it empty and everything runs. vars.CI_FULL_CI_BASE_MERGE_CARRY ==
  # '0' turns it off.
  full-carry:
    name: full-ci base merge carry
    if: ${{ (github.event_name == 'pull_request' && github.event.action == 'labeled' && contains(fromJSON('["full-ci","ready-to-land"]'), github.event.label.name) && github.event.pull_request.base.ref == 'feat-cmux-next' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.draft != true) && !(github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'feat-cmux-next' && (github.event.action == 'labeled' && !contains(fromJSON('["full-ci","ready-to-land"]'), github.event.label.name) || github.event.action == 'unlabeled')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    continue-on-error: true
    permissions:
      actions: read
      contents: read
      statuses: read
    outputs:
      tier: ${{ steps.carry.outputs.tier }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha }}
          sparse-checkout: scripts/ci
      - name: Full-ci base merge carry
        id: carry
        continue-on-error: true
        timeout-minutes: 2
        env:
          CI_FULL_CI_BASE_MERGE_CARRY: ${{ vars.CI_FULL_CI_BASE_MERGE_CARRY || '1' }}
          GH_TOKEN: ${{ github.token }}
        run: if [ -f scripts/ci/head_tier.py ]; then python3 -I scripts/ci/head_tier.py; fi

  # A local test receipt (scripts/ci/ci_receipt.py): a change tested locally counts as a CI pass, and the job is
  # skipped. Only for a same-repository pull request whose body names
  # one (`CI-Receipt: rust-workspaces <Fast checks run URL>`), so every other run spends no runner and no API call
  # here. The receipt is a Fast checks run of the canonical `python3 scripts/ci/ci_receipt.py produce rust-workspaces`
  # on this head (`cmux-ci test`), which GitHub attests: no key. It must have merged onto this run's base, or an
  # older one whose commits since change no Rust input (ci_receipt.py rust_input). The verifier comes from the base commit, never the pull request. A valid
  # receipt skips plan and every workspace before they take a runner and the summary passes;
  # CI_RECEIPT_AUDIT_PERCENT (default 10) of them still run in full, and a red there names the receipt.
  receipt:
    name: local test receipt
    if: ${{ (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci') || (github.event.pull_request.draft == true && (vars.CI_DRAFT_CHEAP_TIER || '1') == '0') || (github.event.pull_request.draft != true && ((contains(github.event.pull_request.labels.*.name, 'ready-to-land') && vars.CI_LAND_FULL_PER_PR == '1') || github.event.pull_request.base.ref != 'feat-cmux-next' || github.event.pull_request.head.repo.full_name != github.repository || (vars.CI_LAND_TIER || '1') == '0'))) && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.body, 'CI-Receipt:'))) && !(github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'feat-cmux-next' && (github.event.action == 'labeled' && !contains(fromJSON('["full-ci","ready-to-land"]'), github.event.label.name) || github.event.action == 'unlabeled')) }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || 'cmux-linux' }}
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      valid: ${{ steps.verify.outputs.valid }}
      audit: ${{ steps.verify.outputs.audit }}
      run_url: ${{ steps.verify.outputs.run_url }}
      producer: ${{ steps.verify.outputs.producer }}
    steps:
      # A persistent pool VM keeps the last job's checkout as a git cache. One left sparse (patterns, skip-worktree
      # bits) or with a ref to a missing object makes actions/checkout leave files out or fail (runs 44739498261 and
      # 44733869883, 2026-11-20); remove it so checkout clones fresh. Its manual test: test_ci_reused_sparse_checkout.py.
      - name: Remove a reused workspace left sparse or broken (self-hosted Linux)
        working-directory: ${{ github.workspace }}
        if: runner.os == 'Linux'
        shell: bash
        run: |
          [ "${RUNNER_ENVIRONMENT:-}" = self-hosted ] && [ -e "$GITHUB_WORKSPACE/.git" ] || exit 0
          cd "$GITHUB_WORKSPACE"
          why=""
          if [ "$(git config --get core.sparseCheckout 2>/dev/null)" = true ] || [ -e .git/info/sparse-checkout ]; then
            why="sparse"
          elif git ls-files -v 2>/dev/null | grep -q '^S'; then
            why="skip-worktree entries"
          elif ! git rev-parse --verify -q 'HEAD^{commit}' >/dev/null; then
            why="HEAD does not resolve"
          elif git for-each-ref --format='%(objectname)' 2>/dev/null | git cat-file --batch-check 2>/dev/null | grep -q ' missing$'; then
            why="a ref names a missing object"
          else
            exit 0
          fi
          echo "reused workspace on ${RUNNER_NAME:-this runner}: $why; removing it so checkout starts clean"
          find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +

      # The merge commit and its parents only: no blobs, one small file in the work tree.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ inputs.sha || '' }}
          fetch-depth: 2
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/rust-workspaces.toml
            /.gitmodules

      - name: Check out the trusted receipt verifier
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .receipt-verifier
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/ci/ci_receipt.py
            /scripts/ci/deadline_http.py
            /scripts/ci/cmux_next_fast_gates.py
            /.github/rust-workspaces.toml
            /.gitmodules

      - name: Verify the local test receipt
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BODY: ${{ github.event.pull_request.body }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          AUDIT_PERCENT: ${{ vars.CI_RECEIPT_AUDIT_PERCENT }}
        run: |
          set -euo pipefail
          verifier=.receipt-verifier/scripts/ci/ci_receipt.py
          if [[ ! -f "$verifier" ]]; then
            echo "valid=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=CI receipt::the base has no receipt verifier yet; every workspace runs"
            exit 0
          fi
          [[ "$(git rev-parse HEAD^2)" == "$HEAD_SHA" ]] || { echo "valid=false" >> "$GITHUB_OUTPUT"; echo "::notice title=CI receipt::the merge ref is not on the head"; exit 0; }
          python3 "$verifier" verify rust-workspaces --repo "$GITHUB_REPOSITORY" --head "$HEAD_SHA" \
            --base "$(git rev-parse HEAD^1)" --head-tree "$(git rev-parse 'HEAD^2^{tree}')" \
            --merge-tree "$(git rev-parse 'HEAD^{tree}')" --audit-percent "$AUDIT_PERCENT" --output "$GITHUB_OUTPUT" \
            --workspaces .receipt-verifier/.github/rust-workspaces.toml

  # A pull request into feat-cmux-next skips plan, workspace and summary (Tier A below), except for the workspaces
  # whose own packages read a file it changes from outside their tree (an include_str! target): #53827 changed
  # DaemonLanePolicy.swift, which cmux-mobile-host's mirrors_the_swift_allowlist reads, landed with that test red,
  # and base stayed red until #53860. Seconds, no cargo: rust-workspaces.py plan --reads-only.
  reads:
    name: workspaces reading a changed file
    if: ${{ (github.event_name == 'pull_request' && github.event.pull_request.draft != true && startsWith(github.event.pull_request.base.ref, 'feat-cmux-next') && !contains(github.event.pull_request.labels.*.name, 'full-ci')) && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci') || (github.event.pull_request.draft == true && (vars.CI_DRAFT_CHEAP_TIER || '1') == '0') || (github.event.pull_request.draft != true && ((contains(github.event.pull_request.labels.*.name, 'ready-to-land') && vars.CI_LAND_FULL_PER_PR == '1') || github.event.pull_request.base.ref != 'feat-cmux-next' || github.event.pull_request.head.repo.full_name != github.repository || (vars.CI_LAND_TIER || '1') == '0'))) && !(github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'feat-cmux-next' && (github.event.action == 'labeled' && !contains(fromJSON('["full-ci","ready-to-land"]'), github.event.label.name) || github.event.action == 'unlabeled')) }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || 'cmux-linux' }}
    timeout-minutes: 5
    outputs:
      hit: ${{ steps.reads.outputs.hit }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Plan the workspaces that read a changed file
        id: reads
        run: |
          base=$(git cat-file -p HEAD | awk '/^parent /{print $2; exit}')
          jobs=$(python3 .github/scripts/rust-workspaces.py plan --base "$base" --reads-only)
          python3 -c 'import json, sys; jobs = json.loads(sys.argv[1]); print("\n".join(j["root"] for j in jobs) or "no Cargo workspace reads a changed file")' "$jobs"
          if [[ "$jobs" != "[]" ]]; then echo "hit=true" >> "$GITHUB_OUTPUT"; fi

  plan:
    name: plan (changed Cargo workspaces)
    needs: [receipt, reads, full-carry]
    # Skipped before it takes a runner when a valid local test receipt covers the change, unless audited.
    # Tier A of the merged pull request replay (scripts/ci/affected-jobs.json pull_request_skip): a pull request
    # into feat-cmux-next skips it unless labeled full-ci or a workspace reads a file it changes (reads above);
    # the feat-cmux-next post-merge batch runs it. The head handed to land (non-draft, ready-to-land) runs it even
    # when CI_LAND_FULL_PER_PR is off: next_autoland requires `rust workspaces / <root>` on a head that changes a
    # run workspace's Rust, so skipping it there held every Rust pull request. plan is affected-only, so a landing
    # head that changes no Cargo workspace still pays nothing past plan.
    if: ${{ (needs.full-carry.outputs.tier != 'none' && (((github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci') || (github.event.pull_request.draft == true && (vars.CI_DRAFT_CHEAP_TIER || '1') == '0') || (github.event.pull_request.draft != true && ((contains(github.event.pull_request.labels.*.name, 'ready-to-land') && vars.CI_LAND_FULL_PER_PR == '1') || github.event.pull_request.base.ref != 'feat-cmux-next' || github.event.pull_request.head.repo.full_name != github.repository || (vars.CI_LAND_TIER || '1') == '0'))) || (github.event_name == 'pull_request' && github.event.pull_request.draft != true && contains(github.event.pull_request.labels.*.name, 'ready-to-land'))) && (((!cancelled() && (needs.receipt.result != 'success' || needs.receipt.outputs.valid != 'true' || needs.receipt.outputs.audit == 'true')) && ((github.event_name != 'pull_request' || !startsWith(github.event.pull_request.base.ref, 'feat-cmux-next') || contains(github.event.pull_request.labels.*.name, 'full-ci')) || needs.reads.outputs.hit == 'true' || (github.event_name == 'pull_request' && github.event.pull_request.draft != true && contains(github.event.pull_request.labels.*.name, 'ready-to-land'))))))) && !(github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'feat-cmux-next' && (github.event.action == 'labeled' && !contains(fromJSON('["full-ci","ready-to-land"]'), github.event.label.name) || github.event.action == 'unlabeled')) }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || 'cmux-linux' }}
    # Room for the lock check's serial network pass and retries on a cold, busy runner (cmux#41586).
    timeout-minutes: 20
    # head_tier.py reads the previous head's Actions runs (the green-head and red-head base merge rules). No
    # statuses: read, which the callers (cmux-next-post-merge.yml, docs-only-fallback.yml) do not grant; a rule
    # that needs cmux/land-tier reads nothing and keeps the usual tier.
    permissions:
      actions: read
      contents: read
    outputs:
      jobs: ${{ steps.plan.outputs.jobs }}
    steps:
      # A persistent pool VM keeps the last job's checkout as a git cache. One left sparse (patterns, skip-worktree
      # bits) or with a ref to a missing object makes actions/checkout leave files out or fail (runs 44739498261 and
      # 44733869883, 2026-11-20); remove it so checkout clones fresh. Its manual test: test_ci_reused_sparse_checkout.py.
      - name: Remove a reused workspace left sparse or broken (self-hosted Linux)
        working-directory: ${{ github.workspace }}
        if: runner.os == 'Linux'
        shell: bash
        run: |
          [ "${RUNNER_ENVIRONMENT:-}" = self-hosted ] && [ -e "$GITHUB_WORKSPACE/.git" ] || exit 0
          cd "$GITHUB_WORKSPACE"
          why=""
          if [ "$(git config --get core.sparseCheckout 2>/dev/null)" = true ] || [ -e .git/info/sparse-checkout ]; then
            why="sparse"
          elif git ls-files -v 2>/dev/null | grep -q '^S'; then
            why="skip-worktree entries"
          elif ! git rev-parse --verify -q 'HEAD^{commit}' >/dev/null; then
            why="HEAD does not resolve"
          elif git for-each-ref --format='%(objectname)' 2>/dev/null | git cat-file --batch-check 2>/dev/null | grep -q ' missing$'; then
            why="a ref names a missing object"
          else
            exit 0
          fi
          echo "reused workspace on ${RUNNER_NAME:-this runner}: $why; removing it so checkout starts clean"
          find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +

      - name: Checkout
        if: ${{ github.event_name != 'pull_request' || !startsWith(runner.name, 'cmux-runner-pool-') }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ inputs.sha || '' }}

      # A cmux-runner-pool VM checks out from its local git mirror (/var/lib/cmux-git) instead, as
      # cmux-next-fast-gates.yml does: actions/checkout's blob:none fetch borrowing the mirror copies ~3 GB of
      # promisor objects (50-140 s of each light job's 1.5-3 min in 2026-11-25 step timings). Unfiltered, the
      # fetch sends only what the mirror lacks: the same commit (depth 2) (the whole tree). Other runners keep the action.
      - name: "Pool mirror: Checkout"
        if: ${{ github.event_name == 'pull_request' && startsWith(runner.name, 'cmux-runner-pool-') }}
        env:
          SHA: ${{ github.sha }}
          TOKEN: ${{ github.token }}
          SPARSE: ''
        run: |
          set -euo pipefail
          mirror=/var/lib/cmux-git/cmux.git/objects
          [[ -d "$mirror" ]] || { echo "::error::no git mirror at $mirror on this pool VM"; exit 1; }
          cd "$GITHUB_WORKSPACE"
          find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          git init -q .
          echo "$mirror" > .git/objects/info/alternates
          git config gc.auto 0
          git remote add origin "https://github.com/$GITHUB_REPOSITORY"
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          # --depth routes the fetch through the pool's git shim (the mirror path); only this command sees the token.
          GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" \
            git fetch --no-tags --no-recurse-submodules --depth=2 origin "+$SHA:refs/remotes/origin/checkout"
          if [[ -n "${SPARSE//[[:space:]]/}" ]]; then
            git config core.sparseCheckout true
            printf '%s\n' "$SPARSE" > .git/info/sparse-checkout
          fi
          git checkout -q --detach "$SHA"
          echo "checked out $(git rev-parse HEAD) from the pool mirror"

      # head_tier.py, the router's own tier decision (pr-router.yml, ci.yml, cmux-tui-spec.yml), with the same
      # switches. A head it gives `none` (an idle or green-head base merge, a same patch, or a base merge onto a
      # red head where this workflow's own run was green) plans no workspace: its previous head proved the change.
      # On 11-26 21Z, base merges were about 68% of this workflow's pull request minutes, most on ready-to-land
      # heads (optchat-chief, cmux-app-ffi). A landing head stays pending there and land-judge's label pulse runs
      # this on the exact head it merges (a `labeled` event, which the rule never reads), so next_autoland's
      # `rust workspaces / <root>` compile still runs on that head. `cheap` keeps planning: the land carry rule's
      # head carries cmux/land-tier success and gets no pulse. Only this workflow's own run reads it
      # (github.workflow_ref: a caller's run would judge the caller's workflow). A failure leaves tier empty.
      - name: CI tier of this head
        id: tier
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'feat-cmux-next' && inputs.sha == '' && contains(github.workflow_ref, '/.github/workflows/rust-workspaces.yml@') }}
        continue-on-error: true
        env:
          CI_DRAFT_CHEAP_TIER: ${{ vars.CI_DRAFT_CHEAP_TIER || '1' }}
          CI_LAND_FULL_PER_PR: ${{ vars.CI_LAND_FULL_PER_PR || '0' }}
          CI_IDLE_BASE_MERGE_SKIP: ${{ vars.CI_IDLE_BASE_MERGE_SKIP || '1' }}
          CI_LAND_TIER: ${{ vars.CI_LAND_TIER || '1' }}
          CI_GREEN_BASE_MERGE_SKIP: ${{ vars.CI_GREEN_BASE_MERGE_SKIP || '1' }}
          CI_LAND_CARRY: ${{ vars.CI_LAND_CARRY || '1' }}
          CI_LABELLED_BASE_MERGE_SKIP: ${{ vars.CI_LABELLED_BASE_MERGE_SKIP || '1' }}
          CI_RED_BASE_MERGE_RERUN: ${{ vars.CI_RED_BASE_MERGE_RERUN || '1' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f scripts/ci/head_tier.py ]; then exit 0; fi
          tier=$(python3 -I scripts/ci/head_tier.py tier)
          echo "tier=$tier"
          echo "tier=$tier" >> "$GITHUB_OUTPUT"

      - name: Test the workspace check
        run: python3 .github/scripts/test_rust_workspaces.py

      - name: Every Cargo workspace is listed
        run: python3 .github/scripts/rust-workspaces.py check

      # Pull requests compare with the base their merge commit was made on (its first
      # parent), pushes with the commit before them; with none (a new branch, a
      # dispatch, or the post-merge batch, which calls this as a dispatch) every workspace is planned.
      - name: Fetch the comparison base
        id: base
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event_name == 'push' && github.event.before || '' }}
        run: |
          if [[ "$EVENT_NAME" == pull_request ]]; then
            BASE_SHA=$(git cat-file -p HEAD | awk '/^parent /{print $2; exit}')
          fi
          if [[ -n "$BASE_SHA" && ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            BASE_SHA=""
          fi
          if [[ -n "$BASE_SHA" && "$BASE_SHA" != 0000000000000000000000000000000000000000 ]]; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA" || echo "::warning::could not fetch $BASE_SHA; planning every workspace"
          fi
          echo "sha=$BASE_SHA" >> "$GITHUB_OUTPUT"

      # Seconds, no build: each tracked Cargo.lock resolves from the registry index (cargo update --workspace
      # --locked). A manifest change in one workspace can leave another workspace's lock stale through a path
      # dependency; eb4f3eb1d94 (a direct push) did that to cmux-app-ffi, and every pull request went red on
      # its --locked build. On a feat-cmux-next push the base autofix rewrites the stale locks
      # (cmux-next-base-autofix.yml, base-autofix.sh --locks); the pre-push gate runs the same check.
      # --strict: CI is the backstop, so a workspace cargo could not judge (a registry error) is red here, never a
      # silent pass; the pre-push gate stays lenient. A timeout is the runner's, not the change's: it is retried
      # with a longer limit, and fails only in a workspace the change touches (--base); elsewhere it warns
      # (cmux#41586: 0 stale, 5 timed out on a cold 2-vCPU runner, red on a change with no Rust in it).
      # --deadline: the whole check ends inside this job's timeout-minutes, with room for the setup and the plan
      # after it, so a slow resolve is reported as unchecked instead of the job being cut (cmux#41742 review F2).
      - name: Set up pinned Rust (lock check)
        if: ${{ steps.tier.outputs.tier != 'none' }}
        uses: ./.github/actions/setup-cmux-tui-rust

      - name: Every Cargo.lock matches its manifests
        if: ${{ steps.tier.outputs.tier != 'none' }}
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          status=0
          python3 scripts/cmux-next/cargo-locks.py check --strict --base "$BASE_SHA" --deadline 840 || status=$?
          if [[ $status == 1 ]]; then
            echo "::error::a Cargo.lock no longer matches its manifests; run scripts/cmux-next/cargo-locks.py fix and commit the locks"
          elif [[ $status != 0 ]]; then
            echo "::error::a workspace this change touches could not be checked (the unchecked: lines above say why)"
          fi
          exit "$status"

      # A pull request plans a workspace only for a change to its own paths (--own-only; the full-ci label plans
      # the whole reach); a push plans every workspace the change reaches through path dependencies too, so a red
      # a dependency causes shows on feat-cmux-next (CI 10x, 2026-11-21).
      - name: Plan the workspaces this change reaches
        id: plan
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
          TIER: ${{ steps.tier.outputs.tier }}
          # Into feat-cmux-next it runs only for a file a workspace reads (reads above): plan those alone.
          OWN_ONLY: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'full-ci') && (startsWith(github.event.pull_request.base.ref, 'feat-cmux-next') && '--reads-only' || '--own-only') || '' }}
        run: |
          if [[ "$TIER" == none ]]; then
            echo "jobs=[]" >> "$GITHUB_OUTPUT"
            echo "head_tier.py: none (its previous head proved this change); no workspace planned"
            exit 0
          fi
          # shellcheck disable=SC2086 # empty or one flag
          jobs=$(python3 .github/scripts/rust-workspaces.py plan --base "$BASE_SHA" $OWN_ONLY)
          echo "jobs=$jobs" >> "$GITHUB_OUTPUT"
          python3 -c 'import json, sys; jobs = json.loads(sys.argv[1]); print("\n".join(j["root"] for j in jobs) or "no Cargo workspace reached")' "$jobs"

  workspace:
    name: ${{ matrix.root }}
    needs: plan
    # !cancelled(): plan runs past a skipped receipt (every push and every PR without one), and GitHub's
    # implicit success() skipped this job there, so no planned workspace ran and summary read the skip
    # as a pass.
    # Tier A of the merged pull request replay (scripts/ci/affected-jobs.json pull_request_skip): a pull request
    # into feat-cmux-next skips it unless labeled full-ci or a workspace reads a file it changes (reads above);
    # the feat-cmux-next post-merge batch runs it. The head handed to land (non-draft, ready-to-land) runs it even
    # when CI_LAND_FULL_PER_PR is off: next_autoland requires `rust workspaces / <root>` on a head that changes a
    # run workspace's Rust, so skipping it there held every Rust pull request. plan is affected-only, so a landing
    # head that changes no Cargo workspace still pays nothing past plan.
    if: ${{ ((github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci') || (github.event.pull_request.draft == true && (vars.CI_DRAFT_CHEAP_TIER || '1') == '0') || (github.event.pull_request.draft != true && ((contains(github.event.pull_request.labels.*.name, 'ready-to-land') && vars.CI_LAND_FULL_PER_PR == '1') || github.event.pull_request.base.ref != 'feat-cmux-next' || github.event.pull_request.head.repo.full_name != github.repository || (vars.CI_LAND_TIER || '1') == '0'))) || (github.event_name == 'pull_request' && github.event.pull_request.draft != true && contains(github.event.pull_request.labels.*.name, 'ready-to-land'))) && (((inputs.only == '' || inputs.only == 'workspace') && (!cancelled() && needs.plan.result == 'success' && needs.plan.outputs.jobs != '[]') && ((github.event_name != 'pull_request' || !startsWith(github.event.pull_request.base.ref, 'feat-cmux-next') || contains(github.event.pull_request.labels.*.name, 'full-ci')) || needs.reads.outputs.hit == 'true' || (github.event_name == 'pull_request' && github.event.pull_request.draft != true && contains(github.event.pull_request.labels.*.name, 'ready-to-land'))))) && !(github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'feat-cmux-next' && (github.event.action == 'labeled' && !contains(fromJSON('["full-ci","ready-to-land"]'), github.event.label.name) || github.event.action == 'unlabeled')) }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || 'cmux-linux' }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.jobs) }}
    # ghostty-vt-sys builds libghostty-vt from the ghostty-next gitlink with zig, as in
    # cmux-tui.yml (an empty CMUX_GHOSTTY_SRC overrides a runner-level one).
    env:
      GHOSTTY_ZIG_SOURCE: ghostty-next
      CMUX_GHOSTTY_SRC: ""
    steps:
      # A persistent pool VM keeps the last job's checkout as a git cache. One left sparse (patterns, skip-worktree
      # bits) or with a ref to a missing object makes actions/checkout leave files out or fail (runs 44739498261 and
      # 44733869883, 2026-11-20); remove it so checkout clones fresh. Its manual test: test_ci_reused_sparse_checkout.py.
      - name: Remove a reused workspace left sparse or broken (self-hosted Linux)
        working-directory: ${{ github.workspace }}
        if: runner.os == 'Linux'
        shell: bash
        run: |
          [ "${RUNNER_ENVIRONMENT:-}" = self-hosted ] && [ -e "$GITHUB_WORKSPACE/.git" ] || exit 0
          cd "$GITHUB_WORKSPACE"
          why=""
          if [ "$(git config --get core.sparseCheckout 2>/dev/null)" = true ] || [ -e .git/info/sparse-checkout ]; then
            why="sparse"
          elif git ls-files -v 2>/dev/null | grep -q '^S'; then
            why="skip-worktree entries"
          elif ! git rev-parse --verify -q 'HEAD^{commit}' >/dev/null; then
            why="HEAD does not resolve"
          elif git for-each-ref --format='%(objectname)' 2>/dev/null | git cat-file --batch-check 2>/dev/null | grep -q ' missing$'; then
            why="a ref names a missing object"
          else
            exit 0
          fi
          echo "reused workspace on ${RUNNER_NAME:-this runner}: $why; removing it so checkout starts clean"
          find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ inputs.sha || '' }}

      - name: Install Linux build dependencies
        env:
          EXTRA_APT: ${{ matrix.apt }}
        run: |
          # shellcheck disable=SC2086 # a space-separated package list
          # Skip apt when the runner image already has these (tests/test_ci_apt_skips_baked_packages.py).
          if dpkg -s clang libclang-dev pkg-config $EXTRA_APT >/dev/null 2>&1; then
            echo "clang libclang-dev pkg-config $EXTRA_APT: already installed"
          else
            sudo apt-get update
            # shellcheck disable=SC2086 # a space-separated package list
            sudo apt-get install -y clang libclang-dev pkg-config $EXTRA_APT
          fi

      - name: Init the ghostty-next submodule (libghostty-vt for ghostty-vt-sys)
        if: ${{ matrix.ghostty }}
        run: bash scripts/ci/init-submodule.sh ghostty-next

      - name: Install zig
        if: ${{ matrix.ghostty }}
        run: ./scripts/install-zig-ci.sh

      - name: Set up pinned Rust
        uses: ./.github/actions/setup-cmux-tui-rust

      # A workspace with its own rust-toolchain.toml builds with that pin. The setup
      # action puts cmux-tui's toolchain first on PATH, so this and the run step go
      # through rustup's cargo, which reads the pin from the working directory.
      - name: Install the workspace's own toolchain pin
        working-directory: ${{ matrix.root }}
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup toolchain install
          rustup component add clippy
          cargo --version

      # Only a feat-cmux-next batch run (a dispatch) or a push saves the build cache; a pull request reads the base branch's.
      - name: Cache cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Why: docs/ci/cmux-next-workflow-notes.md#note-210 (pool runners keep different leftover toolchains)
          add-rust-environment-hash-key: false
          cache-bin: false
          workspaces: ${{ matrix.root }} -> target
          key: ${{ matrix.root }}-${{ hashFiles('cmux-tui/rust-toolchain.toml', format('{0}/Cargo.lock', matrix.root), format('{0}/rust-toolchain.toml', matrix.root), '.cargo/config.toml') }}
          save-if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/feat-cmux-next' }}

      - name: cargo clippy --all-targets and cargo test
        env:
          ROOT: ${{ matrix.root }}
        run: PATH="$HOME/.cargo/bin:$PATH" python3 .github/scripts/rust-workspaces.py run "$ROOT"

  # One stable check name for the whole matrix (a skipped matrix is green). A plan or matrix that judged nothing
  # (cancelled, abandoned) is no verdict, never a pass and never this change's red (scripts/ci/needs_verdict.py).
  summary:
    name: rust workspaces
    needs: [receipt, reads, plan, workspace, full-carry]
    # Tier A of the merged pull request replay (scripts/ci/affected-jobs.json pull_request_skip): a pull request
    # into feat-cmux-next skips it unless labeled full-ci; the feat-cmux-next post-merge batch runs it. The head
    # handed to land runs it, as plan and workspace above do.
    if: ${{ ((github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci') || (github.event.pull_request.draft == true && (vars.CI_DRAFT_CHEAP_TIER || '1') == '0') || (github.event.pull_request.draft != true && ((contains(github.event.pull_request.labels.*.name, 'ready-to-land') && vars.CI_LAND_FULL_PER_PR == '1') || github.event.pull_request.base.ref != 'feat-cmux-next' || github.event.pull_request.head.repo.full_name != github.repository || (vars.CI_LAND_TIER || '1') == '0'))) || (github.event_name == 'pull_request' && github.event.pull_request.draft != true && contains(github.event.pull_request.labels.*.name, 'ready-to-land'))) && (((!cancelled()) && ((github.event_name != 'pull_request' || !startsWith(github.event.pull_request.base.ref, 'feat-cmux-next') || contains(github.event.pull_request.labels.*.name, 'full-ci')) || needs.reads.outputs.hit == 'true' || (github.event_name == 'pull_request' && github.event.pull_request.draft != true && contains(github.event.pull_request.labels.*.name, 'ready-to-land'))))) && !(github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'feat-cmux-next' && (github.event.action == 'labeled' && !contains(fromJSON('["full-ci","ready-to-land"]'), github.event.label.name) || github.event.action == 'unlabeled')) }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || 'cmux-linux' }}
    timeout-minutes: 5
    steps:
      - name: Every planned workspace passed
        env:
          PLAN: ${{ needs.plan.result }}
          WORKSPACES: ${{ needs.workspace.result }}
          RECEIPT_VALID: ${{ needs.receipt.result == 'success' && needs.receipt.outputs.valid || 'false' }}
          RECEIPT_AUDIT: ${{ needs.receipt.outputs.audit }}
          RECEIPT_RUN: ${{ needs.receipt.outputs.run_url }}
          RECEIPT_PRODUCER: ${{ needs.receipt.outputs.producer }}
          FULL_CARRY: ${{ needs.full-carry.outputs.tier }}
        run: |
          # A full-ci base merge carry (the full-carry job) skipped plan on a head whose parent's full run passed.
          if [[ "$FULL_CARRY" == none ]]; then
            line="rust workspaces: full-ci base merge carry, the parent head's full run passed (scripts/ci/head_tier.py full_carry); plan and every workspace skipped"
            echo "$line"
            echo "::notice title=Full-ci carry::$line"
            [[ -z "${GITHUB_STEP_SUMMARY:-}" ]] || echo "$line" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # A receipt skip says so in the log, a notice and the step summary, so neither a reader nor land-judge
          # takes it for a plain skip (work nobody judged). its manual test test_ci_receipt.py runs this step.
          if [[ "$RECEIPT_VALID" == true && "$RECEIPT_AUDIT" != true ]]; then
            line="rust workspaces: verified reuse of receipt $RECEIPT_RUN (by $RECEIPT_PRODUCER); plan and every workspace skipped on it"
            echo "$line"
            echo "::notice title=CI receipt::$line"
            [[ -z "${GITHUB_STEP_SUMMARY:-}" ]] || echo "$line" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ "$RECEIPT_AUDIT" == true && ( "$PLAN" == failure || "$WORKSPACES" == failure ) ]]; then
            echo "::error title=CI receipt audit::rust workspaces failed on a merge whose local test receipt $RECEIPT_RUN (by $RECEIPT_PRODUCER) passed them"
          fi
          needs_verdict() {  # scripts/ci/needs_verdict.py SHELL_RULE, copied verbatim (tests/test_needs_verdict.py)
            local what=$1 failed="" unjudged="" pair name result; shift
            for pair in "$@"; do
              name=${pair%%=*}; result=${pair#*=}
              if [[ "$name" == *"?" ]]; then name=${name%"?"}; [[ "$result" == skipped ]] && result=success; fi
              case "${result%%[ :]*}" in
                success) ;;
                failure|invalid) failed+=" $name: $result;" ;;
                *) unjudged+=" $name ${result:-none}," ;;
              esac
            done
            if [[ -n "$failed" ]]; then echo "::error::summary red: $what:${failed%;}"; return 1; fi
            if [[ -n "$unjudged" ]]; then
              echo "::error::no verdict: $what:${unjudged%,}; nothing it summarizes was judged: re-run the run"; return 3
            fi
            echo "$what: every job passed"
          }
          echo "plan: $PLAN, workspaces: $WORKSPACES"
          needs_verdict "rust workspaces" "plan=$PLAN" "workspace?=$WORKSPACES"
