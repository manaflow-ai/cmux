name: shotdiff
# Self-check of the one screenshot gate step (.github/actions/shotdiff, cmux-tui/crates/cmux-shotdiff) on real
# Chrome renders (cmux-tui/crates/cmux-shotdiff/tests/fixtures/chrome): an identical re-render, a SwiftShader
# render and a clock change under its ignore mask must pass; a 6 px button nudge and a shortened label (0.31% and
# 0.53% of pixels, both under the 1% ratio) must fail, with diff images.
# Then the crate's tests, release profile so they reuse the action's build.
on:
  pull_request:
    paths:
      - cmux-tui/crates/cmux-shotdiff/**
      - .github/actions/shotdiff/**
      - .github/workflows/shotdiff.yml
  push:
    branches: [main, feat-cmux-next]
    paths:
      - cmux-tui/crates/cmux-shotdiff/**
      - .github/actions/shotdiff/**
      - .github/workflows/shotdiff.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shotdiff-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shotdiff:
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || 'cmux-linux' }}
    timeout-minutes: 25
    env:
      FIXTURES: cmux-tui/crates/cmux-shotdiff/tests/fixtures/chrome
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Same renders pass
        id: same
        uses: ./.github/actions/shotdiff
        with:
          store: ${{ env.FIXTURES }}/store
          heads: ${{ env.FIXTURES }}/same
          out: ${{ runner.temp }}/shotdiff-same
          title: "shotdiff self-check: same renders"
      - name: Changed renders fail
        id: changed
        continue-on-error: true
        uses: ./.github/actions/shotdiff
        with:
          store: ${{ env.FIXTURES }}/store
          heads: ${{ env.FIXTURES }}/changed
          out: ${{ runner.temp }}/shotdiff-changed
          title: "shotdiff self-check: changed renders"
          setup-rust: "false"
      - name: Judge the self-check
        env:
          SAME: ${{ steps.same.outputs.pass }}
          CHANGED: ${{ steps.changed.outputs.pass }}
          REPORT: ${{ steps.changed.outputs.report }}
        run: |
          set -euo pipefail
          test "$SAME" = true
          test "$CHANGED" = false
          got=$(jq -c '[.entries[] | {(.name): .status}] | add' "$REPORT")
          want='{"web/clock":"pass","web/settings":"fail","web/settings-swiftshader":"fail"}'
          [[ "$got" == "$want" ]] || { echo "::error::changed renders: got $got, want $want"; exit 1; }
          ls "$RUNNER_TEMP/shotdiff-changed/diff/web/settings.png" "$RUNNER_TEMP/shotdiff-changed/diff/web/settings-swiftshader.png"
      - name: Crate tests
        working-directory: cmux-tui
        run: timeout 900 cargo test --locked --release -p cmux-shotdiff
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() && !cancelled() }}
        with:
          name: shotdiff-self-check
          path: ${{ runner.temp }}/shotdiff-*
