name: Platform billing test-mode secrets

# One-off (rerunnable). Cloud usage billing in Stripe TEST MODE on cmux-platform (cmux-platform docs/billing.md,
# "Usage billing in test mode"). Leo, 2026-11-24: "0-100 get shit into my nightly working at least at the most basic
# level for billing asap, then the gradual plans upgrading and moving in as we go."
# It puts two Worker secrets on cmux-platform-staging and cmux-platform-production:
# - CLOUD_BILLING_STRIPE_KEY: piped from the environment's Stripe test key (default E2E_STRIPE_TEST_KEY, the
#   development Stripe sandbox's test-mode key machine-vault-e2e.yml suite=billing uses). A key that does not start sk_test_ or rk_test_
#   stops the job before anything is put: live mode is outward money and never goes through here. Put only when the
#   Worker lacks it, unless replace_key is true.
# - CLOUD_USAGE_REPORTING_TEAMS: the `teams` input (comma-separated Cloud team ids, or *). Always put, so a rerun
#   changes the reported teams with no code deploy.
# Every value goes through stdin only: none is printed, echoed or written to disk. Same pattern as
# platform-prod-secrets.yml. The push trigger (this file only) registers it and runs a check that puts nothing: the
# environment holds the Cloudflare token and a test-mode key, and which of the two names each Worker has. A dispatch
# from feat-cmux-next puts. A dispatch with summaries_since puts nothing and prints each team's Stripe test-mode meter event
# summaries (customer by metadata cmux_team_id, per cmux_next_cloud_* meter): the billing proof's Stripe side.
on:
  push:
    branches: [feat-cmux-next]
    paths: [.github/workflows/platform-billing-test-secrets.yml]
  workflow_dispatch:
    inputs:
      teams:
        description: "CLOUD_USAGE_REPORTING_TEAMS: comma-separated Cloud team ids (team_<20 hex>) or *. Default: Leo's team"
        required: true
        default: team_a104498f37e7f4a3327d
      workers:
        description: "Workers to put on (space-separated)"
        required: true
        default: cmux-platform-staging cmux-platform-production
      environment:
        description: "The GitHub environment holding the Stripe test key and CLOUDFLARE_API_TOKEN"
        required: true
        default: billing-e2e
      key_secret:
        description: "That environment's secret holding the Stripe test key (only E2E_STRIPE_TEST_KEY is read; another name puts nothing)"
        required: true
        default: E2E_STRIPE_TEST_KEY
      replace_key:
        description: "Replace CLOUD_BILLING_STRIPE_KEY when the Worker already has one"
        type: boolean
        default: false
      summaries_since:
        description: "Read only, put nothing: print each listed team's Stripe test-mode meter event summaries from this UTC time (ISO, e.g. 2026-11-24T00:00:00Z) to now"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: platform-billing-test-secrets
  cancel-in-progress: false

jobs:
  put:
    if: github.ref == 'refs/heads/feat-cmux-next'
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || 'cmux-linux' }}
    environment: ${{ inputs.environment || 'billing-e2e' }}
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
      - name: Put CLOUD_BILLING_STRIPE_KEY (test mode only) and CLOUD_USAGE_REPORTING_TEAMS
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 0c1675e0def6de1ab3a50a4e17dc5656
          # A named secret, never secrets[expr]: an indexed read counts as reading every secret in the job,
          # the R2 cache-writer credentials included (tests/test_ci_pull_request_caches_are_read_only.py).
          STRIPE_TEST_KEY: ${{ (inputs.key_secret == '' || inputs.key_secret == 'E2E_STRIPE_TEST_KEY' || github.event_name == 'push') && secrets.E2E_STRIPE_TEST_KEY || '' }}
          TEAMS: ${{ inputs.teams }}
          WORKERS: ${{ inputs.workers || 'cmux-platform-staging cmux-platform-production' }}
          REPLACE_KEY: ${{ inputs.replace_key }}
          PUT: ${{ github.event_name == 'workflow_dispatch' }}
          SUMMARIES_SINCE: ${{ inputs.summaries_since }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          WR="npx -y wrangler@4.156.0"
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "::error::this environment holds no CLOUDFLARE_API_TOKEN; nothing put"; exit 1; fi
          if [ -z "$STRIPE_TEST_KEY" ]; then echo "::error::this environment holds no Stripe test key under the key_secret name; nothing put"; exit 1; fi
          # Test mode only: the prefix is checked without printing the key.
          case "$STRIPE_TEST_KEY" in
            sk_test_*|rk_test_*) ;;
            *) echo "::error::the key is not a Stripe test-mode key (sk_test_/rk_test_); nothing put"; exit 1 ;;
          esac
          if [ -n "${SUMMARIES_SINCE:-}" ]; then
            # Read only: the proof's Stripe side (the numbers a team's meter sent, per meter). Prints ids and sums only.
            node - <<'JS'
          const key = process.env.STRIPE_TEST_KEY
          const get = async (path) => {
            const r = await fetch(`https://api.stripe.com${path}`, { headers: { authorization: `Bearer ${key}` } })
            const j = await r.json()
            if (!r.ok) throw new Error(`${path.split("?")[0]}: ${r.status} ${j.error?.message ?? ""}`)
            if (j.livemode === true) throw new Error("a live-mode answer; stopping")
            return j
          }
          const since = Math.floor(Date.parse(process.env.SUMMARIES_SINCE) / 60000) * 60
          if (!Number.isFinite(since)) throw new Error("summaries_since is not an ISO time")
          const until = Math.ceil(Date.now() / 60000) * 60
          const meters = (await get("/v1/billing/meters?limit=100&status=active")).data
            .filter((m) => m.event_name.startsWith("cmux_next_cloud_"))
          for (const team of process.env.TEAMS.split(",").map((t) => t.trim()).filter((t) => /^team_[0-9a-f]{20}$/.test(t))) {
            const q = encodeURIComponent(`metadata['cmux_team_id']:'${team}'`)
            const customers = (await get(`/v1/customers/search?query=${q}`)).data
            if (customers.length === 0) { console.log(`${team}: no Stripe customer (no checkout yet)`); continue }
            for (const c of customers)
              for (const m of meters) {
                const s = (await get(`/v1/billing/meters/${m.id}/event_summaries?customer=${c.id}&start_time=${since}&end_time=${until}&limit=100`)).data
                const sum = s.reduce((a, x) => a + Number(x.aggregated_value), 0)
                console.log(`${team} ${c.id} ${m.id} ${m.event_name} ${new Date(since * 1000).toISOString()}..${new Date(until * 1000).toISOString()} aggregated_value=${sum}`)
              }
          }
          JS
            exit 0
          fi
          if [ "$PUT" != "true" ]; then
            # The push run: the checks above passed; list each Worker's names and put nothing.
            for W in $WORKERS; do
              for n in CLOUD_BILLING_STRIPE_KEY CLOUD_USAGE_REPORTING_TEAMS; do
                if $WR secret list --name "$W" --format json | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>process.exit(JSON.parse(d).some(s=>s.name===process.argv[1])?0:3))' "$n"; then
                  echo "::notice::$W has $n"; else echo "::notice::$W lacks $n"; fi
              done
            done
            echo "::notice::check only (push): nothing put"
            exit 0
          fi
          if [ -z "$TEAMS" ]; then echo "::error::no teams input; nothing put"; exit 1; fi
          for t in ${TEAMS//,/ }; do
            case "$t" in
              '*') ;;
              team_[0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]) ;;
              *) echo "::error::teams names '$t', not a Cloud team id (team_<20 hex>) or *; nothing put"; exit 1 ;;
            esac
          done
          has() {
            local out rc=0
            out="$($WR secret list --name "$1" --format json)" || { echo "::error::wrangler secret list failed on $1; stopping"; exit 1; }
            printf '%s' "$out" | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{const l=JSON.parse(d);if(!Array.isArray(l))process.exit(9);process.exit(l.some(s=>s.name===process.argv[1])?0:3)})' "$2" || rc=$?
            case "$rc" in 0) return 0 ;; 3) return 1 ;; *) echo "::error::could not read $1's secret list; stopping"; exit 1 ;; esac
          }
          for W in $WORKERS; do
            case "$W" in cmux-platform-staging|cmux-platform-production) ;; *) echo "::error::$W is not a cmux-platform Worker; stopping"; exit 1 ;; esac
            if [ "$REPLACE_KEY" != "true" ] && has "$W" CLOUD_BILLING_STRIPE_KEY; then
              echo "::notice::$W already has CLOUD_BILLING_STRIPE_KEY; left as is"
            else
              printf '%s' "$STRIPE_TEST_KEY" | $WR secret put CLOUD_BILLING_STRIPE_KEY --name "$W"
            fi
            printf '%s' "$TEAMS" | $WR secret put CLOUD_USAGE_REPORTING_TEAMS --name "$W"
            echo "::notice::$W: CLOUD_USAGE_REPORTING_TEAMS=$TEAMS"
            $WR secret list --name "$W" --format json | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{for (const s of JSON.parse(d)) console.log(s.name)})'
          done
