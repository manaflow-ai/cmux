name: cmux-next base autofix

# After each feat-cmux-next push, repairs the base's mechanical reds in one
# commit on top of it, so no pull request has to carry them
# (scripts/cmux-next/base-autofix.sh): the CI target graph, regenerated from
# `swift package dump-package` in a pinned Swift 6.2 Linux container (the Mac
# generated-files job's tools), every React page's generated/strings.json
# (webviews/scripts/pages/gen-strings.mjs), the SDK wire layers
# (cmux-tui/bindings/codegen/generate.py), the docs shortcuts copy of the
# action catalog export (web/scripts/export-docs-shortcuts.ts) and the cmux-next
# docs reference pages (web/scripts/export-next-docs.ts), the app-host
# generated files (cmux-tui/crates/cmux-app-host/tools/gen-cmux-global.ts), the namespace
# daemon capability export (scripts/cmux-next/check-daemon-capabilities-fresh.py), the
# ratchet's stale rows (scripts/lint-namespace-types-ratchet.txt), the cloud
# wire clients from the committed cloud catalog (backend/packages/protocol),
# webviews formatting (vp fmt in the read-only webviews-fmt job), cargo clippy --fix
# (machine-applicable lints, on the crates the changed cmux-tui Rust can affect:
# scripts/cmux-next/autofix-clippy.sh --affected), cargo fmt
# in cmux-tui and the OptChat crates, and every tracked Cargo.lock that no longer
# matches its workspace's manifests (scripts/cmux-next/cargo-locks.py fix: a
# manifest change in one workspace can leave another's lock stale, as
# eb4f3eb1d94's direct push did to cmux-app-ffi). Each
# runs only when its inputs changed since the last successful run that made its
# own Mac exports (actions: read lists it; scripts/cmux-next/base-autofix-since.sh); a repair whose inputs a newer push moved is made again on that
# tip (scripts/cmux-next/base-autofix-land.sh, a bounded number of times), and a
# repair that still cannot land fails the run. A frozen path
# (scripts/cmux-next/base-autofix-frozen.txt, including every workflow file)
# is reported and never written; missing cmux-tui tree inputs are reported
# (their fix edits cmux-tui-artifacts.yml); the app FFI pin stays with
# app-ffi-release.yml's app-ffi-repin pull request. The action exports
# (plans/cmux-next/action-surfaces.json, action-catalog.json, actions.md, links.json) need a Mac
# swift test: the action-exports job regenerates them on a Mac at the newest
# tip (scripts/cmux-next/base-autofix-action-exports.sh) and autofix copies them in
# before it rewrites the docs shortcuts from them. The settings exports
# (schemas/settings/settings-schema.json, docs/mdm) need one too: the
# same job regenerates them (scripts/cmux-next/regenerate-settings-exports.sh)
# when CmuxNextSettings or an export changed, again on the newest tip while a
# push moves their inputs (scripts/cmux-next/base-autofix-settings-exports.sh,
# at most three times), and autofix copies them in before it rewrites the
# defaults snapshot from them; the push lands them only where nothing moved
# their inputs after the commit they were made at.
# A separate job pins scripts/ghosttykit-checksums.txt when the ghostty
# gitlink moves, from our own published GhosttyKit release (waiting for
# build-ghosttykit.yml when there is none yet).
#
# Its own push trigger: feat-cmux-next push CI is the Swift app build only
# (cx-g34i), so cmux-next's push run no longer regenerates anything, and its
# push paths never included cmux-tui.
#
# Push identity: the manaflow-cmux-pr-autofix App (secrets CMUX_PR_AUTOFIX_APP_ID and
# CMUX_PR_AUTOFIX_APP_KEY, contents: write and no workflows permission, the App that already pushes
# PR autofix commits), minted per pushing job. A GITHUB_TOKEN push starts no workflow, so 60c696be
# (2026-10-26) had no cmux-next.yml push run and the nightly-next promotion passed over it; an App
# push starts every push workflow like any other commit. cmux-bot is contents: read, so it can't push.
# The commit author stays github-actions[bot]. When the App token can't be minted, the job pushes
# with its GITHUB_TOKEN as before (contents: write; actions: read only to find the last successful
# run), and then starts the cmux-tui artifacts run of the bot head itself (a dispatch, which that
# token may start; scripts/cmux-next/publish-bot-head-tree.sh, which does nothing when the head
# already has a run). No ruleset or branch protection applies to feat-cmux-next (2026-10-09).
# Neither token can push workflow files (they are frozen paths anyway).
#
# No loop: every job skips a push whose head commit is this workflow's own repair (author
# github-actions[bot], message "chore(next): base autofix at " or "chore(next): pin GhosttyKit for
# ghostty "), and base-autofix-since.sh passes over such a run, whose jobs were all skipped. The
# repair is a fixed point anyway: made again on its own commit it changes nothing.
#
# Dry run until the repo variable CMUX_NEXT_BASE_AUTOFIX is 1: it repairs and
# commits locally, and the summary shows what it would push.
#
# Once per window (ci-217x, Leo 2026-11-21: "de facto, im asking for 99% fewer minutes of ci time,
# period"): on 11-21 17-19Z this workflow ran 39 times in two hours, 680 runner-minutes, 16.6 per merged
# PR, each run repairing what the last few pushes changed. Now the `window` job lets at most one push run
# repair per vars.NEXT_BASE_AUTOFIX_WINDOW_MINUTES (default 120, the post-merge batch tier's window; '0'
# repairs on every push as before): a push within the window of an older run that repaired, or that is
# still in flight, is held, and its window job cancels the run (scripts/cmux-next/base-autofix-window.sh).
# Nothing is lost: base-autofix-since.sh passes over the cancelled run, so the next run that repairs diffs
# from the last successful one and covers every held push. A dispatch, a re-run and a GitHub read that
# fails run as before.
on:
  push:
    branches: [feat-cmux-next]
    paths:
      - cmux-tui/**
      - Native/OptChat/**
      - Packages/**
      - plans/cmux-next/daemon-capabilities.json
      - webviews/src/**
      - webviews/scripts/pages/**
      - webviews/test/**
      - plans/cmux-next/action-surfaces.json
      - plans/cmux-next/action-catalog.json
      - plans/cmux-next/actions.md
      - plans/cmux-next/links.json
      - scripts/cmux-next/regenerate-action-exports.sh
      - scripts/cmux-next/regenerate-settings-exports.sh
      - scripts/cmux-next/settings-exports.txt
      - scripts/cmux-next/check-settings-exports.sh
      - docs/mdm/**
      - scripts/ci/defaults_guard.py
      - web/scripts/export-docs-shortcuts.ts
      - web/scripts/export-next-docs.ts
      # The app-host generated files (base-autofix.sh --app-host).
      - cmux-tui/spec/resource-operations-v2.json
      - first-party-apps/**
      - ios/cmux/**
      - scripts/lint-ios-package-conventions.sh
      - scripts/lint_swift_namespaces.py
      - scripts/lint-namespace-types-ratchet.txt
      - scripts/lint-namespace-types-baseline.txt
      - scripts/lint-ios-package-conventions-baseline.txt
      - backend/catalog/cloud-operations.json
      - backend/packages/protocol/scripts/export-client.ts
      - backend/packages/protocol/scripts/export-rust-client.ts
      - backend/packages/protocol/src/automation-caps.ts
      - schemas/settings/**
      - scripts/cmux-next/base-autofix.sh
      - scripts/cmux-next/base-autofix-push.sh
      - scripts/cmux-next/base-autofix-compile-gate.sh
      - scripts/cmux-next/base-autofix-land.sh
      - scripts/cmux-next/base-autofix-repair.sh
      - scripts/cmux-next/base-autofix-settings-exports.sh
      - scripts/cmux-next/base-autofix-action-exports.sh
      - scripts/cmux-next/base_autofix_pushed_exports.py
      - scripts/cmux-next/base-autofix-exports-pack.sh
      - scripts/cmux-next/base-autofix-mac-busy.sh
      - scripts/cmux-next/base-autofix-since.sh
      - scripts/cmux-next/base-autofix-window.sh
      - scripts/cmux-next/base-autofix-changed.sh
      - scripts/cmux-next/base-autofix-ffi-pin.sh
      - scripts/cmux-next/base-autofix-settings-landed.sh
      - scripts/cmux-next/publish-bot-head-tree.sh
      - scripts/cmux-next/autofix-areas.sh
      - scripts/cmux-next/check-daemon-capabilities-fresh.py
      - scripts/cmux-next/tests/daemon-capabilities-fresh.test.sh
      - scripts/cmux-next/pr-autofix-apply.sh
      - scripts/cmux-next/base-autofix-frozen.txt
      - scripts/cmux-next/ci-target-graph.py
      - scripts/ci/check_cmux_tui_tree_inputs.py
      - scripts/cmux-next/cmux-tui-tree-inputs.txt
      - .github/workflows/cmux-next-base-autofix.yml
      # The GhosttyKit checksum pin (ghosttykit-checksum below).
      - ghostty
      - scripts/ghosttykit-checksums.txt
      - scripts/cmux-next/ghosttykit-checksum.sh
      - scripts/download-prebuilt-ghosttykit.sh
      # Every Cargo workspace's lock (base-autofix.sh --locks).
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - scripts/cmux-next/cargo-locks.py
      # The iPhone app's uniffi Swift bindings (base-autofix.sh --ios-ffi).
      - cmux-next-ios/rust/crates/**
      - cmux-next-ios/rust/rust-toolchain.toml
      - cmux-next-ios/CmuxMobileKit/Sources/CmuxMobileLinkFFI/**
      - scripts/ios-ffi-bindings.sh

permissions: {}

env:
  # Temporary REST budget attribution: one gh-call line per GitHub API call (scripts/ci/api_call_log/env.sh, fetched at a fixed commit when the checkout has no copy).
  BASH_ENV: '$({ w="${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh"; t="${RUNNER_TEMP:-/nonexistent}/api-call-log-src"; if [ -f "$w" ]; then echo "$w"; elif [ -n "${RUNNER_TEMP:-}" ]; then if [ ! -f "$t/env.sh" ] && [ ! -e "$t.tried" ] && { [ "${RUNNER_OS:-}" = Linux ] || [ "${RUNNER_OS:-}" = macOS ]; } && [ "$(date -u +%Y%m%d%H)" -lt 2026112300 ]; then : > "$t.tried"; mkdir -p "$t.part" && for x in env.sh gh sitecustomize.py isolated.py; do curl -fsSL --max-time 5 -o "$t.part/$x" "https://raw.githubusercontent.com/manaflow-ai/cmux/27647ffd3ae838c63be28ca3e5883dcd68c34518/scripts/ci/api_call_log/$x" || break; done; [ -s "$t.part/isolated.py" ] && mv "$t.part" "$t"; fi; if [ -f "$t/env.sh" ]; then echo "$t/env.sh"; else echo unset BASH_ENV > "$t.off.sh" && echo "$t.off.sh"; fi; fi; } 2>/dev/null)'

jobs:
  # At most one run repairs per window (Once per window, above). A held run is cancelled here, and every
  # other job needs this one's run output, so a cancel that fails still skips them.
  window:
    name: batch window
    if: >-
      ${{ github.repository == 'manaflow-ai/cmux' && !(github.event_name == 'push' && github.event.head_commit.author.name == 'github-actions[bot]' && (startsWith(github.event.head_commit.message, 'chore(next): base autofix at ') || startsWith(github.event.head_commit.message, 'chore(next): pin GhosttyKit for ghostty '))) }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || 'cmux-linux' }}
    timeout-minutes: 3
    permissions:
      actions: write # list this workflow's runs; cancel this run when it is held
      contents: read
    outputs:
      run: ${{ steps.window.outputs.run }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          sparse-checkout: |
            /scripts/cmux-next/base-autofix-window.sh
            /.gitmodules
          sparse-checkout-cone-mode: false

      - name: Repair now, or hold for the window
        id: window
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT_BASE_AUTOFIX_WINDOW_MINUTES: ${{ vars.NEXT_BASE_AUTOFIX_WINDOW_MINUTES }}
        run: bash scripts/cmux-next/base-autofix-window.sh "$GITHUB_RUN_ID" "$GITHUB_REF_NAME" | tee -a "$GITHUB_OUTPUT" "$GITHUB_STEP_SUMMARY"

      - name: Cancel the held run
        if: steps.window.outputs.run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY" || echo "::warning::cancel failed; the repair jobs skip on this job's run=false"

  # Whether the Mac action-exports job runs: the paths changed since the last
  # successful run, as autofix's Changed areas step computes them.
  action-areas:
    name: action export areas
    needs: window
    if: >-
      ${{ needs.window.outputs.run == 'true' && github.repository == 'manaflow-ai/cmux' && !(github.event_name == 'push' && github.event.head_commit.author.name == 'github-actions[bot]' && (startsWith(github.event.head_commit.message, 'chore(next): base autofix at ') || startsWith(github.event.head_commit.message, 'chore(next): pin GhosttyKit for ghostty '))) }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || 'cmux-linux' }}
    # 15, not 5: on a slow cmux-linux runner the checkout alone used the whole 5 (runs 45335340351, 45339629317 cancelled in checkout), so the exports stopped regenerating.
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    outputs:
      actions: ${{ steps.areas.outputs.actions }}
      settings: ${{ steps.areas.outputs.settings }}
      # Another run's Mac job is queued or running: this run leaves its exports to it.
      mac_busy: ${{ steps.busy.outputs.mac_busy }}
      mac_busy_run: ${{ steps.busy.outputs.mac_busy_run }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Changed areas
        id: areas
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          since="$(scripts/cmux-next/base-autofix-since.sh feat-cmux-next)"
          # base-autofix-changed.sh: since..HEAD without grafting since into this depth-1 checkout.
          if [[ -z "$since" ]] || ! changed="$(scripts/cmux-next/base-autofix-changed.sh "$since")"; then
            scripts/cmux-next/autofix-areas.sh --all | grep -E '^(actions|settings)=' | tee -a "$GITHUB_OUTPUT"
          else
            scripts/cmux-next/autofix-areas.sh <<<"$changed" | grep -E '^(actions|settings)=' | tee -a "$GITHUB_OUTPUT"
          fi

      - name: Mac exports already queued or running
        id: busy
        if: steps.areas.outputs.actions == 'true' || steps.areas.outputs.settings == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/cmux-next/base-autofix-mac-busy.sh "$GITHUB_RUN_ID" | tee -a "$GITHUB_OUTPUT"

  # The exports from the cmux-next generated-files job (or daemon-test, when it checks the generated
  # files) that already built the package on a Mac for this commit or a newer one, and packs them
  # (scripts/cmux-next/base-autofix-exports-pack.sh), so the Mac job below does not build it again
  # (cmuxterm-hq#5424). A pack is named after its commit's tree
  # (scripts/cmux-next/base_autofix_pushed_exports.py) and taken only from this repository's own
  # feat-cmux-next push runs and base tier dispatches (cmux-next-base-tier-kick.yml), file digests
  # checked. Like the Mac job, which regenerated on the newest tip, it takes the newest pack from this
  # commit up to the tip and names that commit as made_at. It waits while such a run can still make one
  # (with the base tier on, until that run is dispatched: within 15 minutes of a landing), at most 45
  # minutes, and gives up at once when none will. A miss of any kind leaves the exports to the Mac job,
  # as before. vars.CMUX_NEXT_BASE_EXPORTS_REUSE=0 turns it off.
  # Only the run that carries the exports waits: while another run's pushed-exports or Mac job is
  # queued or running (mac_busy, base-autofix-mac-busy.sh) this is skipped, the run defers its exports
  # (mac-exports-deferred) and its autofix repairs the rest at once. Every run's autofix needs this
  # job, so with every run waiting here (2026-11-01) a formatting repair waited up to 45 minutes too.
  pushed-exports:
    name: exports from the push's generated files
    # The read App's key (GLAEDA_ROUTE_APP_KEY) is this environment's, as in
    # cmux-next-generated-catch-up.yml; on feat-cmux-next only.
    environment: ${{ github.ref == 'refs/heads/feat-cmux-next' && 'ci-routing-agent' || '' }}
    needs: action-areas
    if: (needs.action-areas.outputs.actions == 'true' || needs.action-areas.outputs.settings == 'true') && needs.action-areas.outputs.mac_busy != 'true'
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || 'cmux-linux' }}
    timeout-minutes: 65
    permissions:
      contents: read
    # Every step is continue-on-error and the lookup's own limit is under the job's, so this job
    # always succeeds and the Mac job (which needs it) runs on any miss. A hit counts only once its
    # changed exports are uploaded: a failed upload is a miss too.
    outputs:
      deferred: ${{ steps.carrier.outputs.mac_busy }}
      deferred_run: ${{ steps.carrier.outputs.mac_busy_run }}
      hit: ${{ steps.lookup.outputs.hit == 'true' && (steps.lookup.outputs.exports != 'true' || steps.upload.outcome == 'success') && 'true' || 'false' }}
      exports: ${{ steps.lookup.outputs.exports }}
      made_at: ${{ steps.lookup.outputs.made_at }}
      # On a miss: the owned gui label while one of its runners is idle now, else empty
      # (the Mac job then takes Blacksmith macOS).
      mac_runner: ${{ steps.mac-runner.outputs.runs_on }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        id: checkout
        continue-on-error: true
        timeout-minutes: 3
        with:
          persist-credentials: false

      # The wait reads through the manaflow-glaeda-route App's own budget, never the GITHUB_TOKEN
      # budget every workflow shares (tests/test_ci_no_github_token_polling.py). No key or a failed
      # mint leaves no token: the lookup misses and the Mac job regenerates, as before.
      - name: Mint the read token
        id: read-token
        if: vars.GLAEDA_ROUTE_APP_ID != '' && github.ref == 'refs/heads/feat-cmux-next'
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.GLAEDA_ROUTE_APP_ID }}
          private-key: ${{ secrets.GLAEDA_ROUTE_APP_KEY }}
          permission-actions: read

      # The first admission read uses github.token and fails open. Recheck with the token this
      # job already minted before starting another 45-minute lookup. Only an older carrier counts,
      # so simultaneous candidates cannot all defer to one another. Unknown still takes the fallback.
      - name: Recheck the export carrier with the read token
        id: carrier
        if: steps.checkout.outcome == 'success' && steps.read-token.outputs.token != ''
        continue-on-error: true
        timeout-minutes: 1
        env:
          GH_TOKEN: ${{ steps.read-token.outputs.token }}
          COALESCE: ${{ vars.CMUX_NEXT_BASE_EXPORTS_COALESCE }}
        run: |
          if [[ "$COALESCE" == '0' ]]; then
            echo 'mac_busy=false' >> "$GITHUB_OUTPUT"
          else
            bash scripts/cmux-next/base-autofix-mac-busy.sh "$GITHUB_RUN_ID" "$GITHUB_REF_NAME" --older-only >> "$GITHUB_OUTPUT"
          fi

      - name: Take this push's packed exports
        id: lookup
        if: steps.checkout.outcome == 'success' && steps.carrier.outputs.mac_busy != 'true'
        continue-on-error: true
        timeout-minutes: 50
        env:
          GH_TOKEN: ${{ steps.read-token.outputs.token }}
          SKIP_REASON: ${{ format('{0}', vars.CMUX_NEXT_BASE_EXPORTS_REUSE) == '0' && 'vars.CMUX_NEXT_BASE_EXPORTS_REUSE is 0' || '' }}
          # Whether pushes leave the generated files to the base tier run (cmux-next-base-tier-kick.yml):
          # then the pack comes from that run, up to 15 minutes after the landing plus its own run.
          BASE_TIER: ${{ format('{0}', vars.CMUX_NEXT_BASE_TIER_COALESCE) == '0' && 'off' || 'auto' }}
        run: |
          set -euo pipefail
          python3 -I scripts/cmux-next/base_autofix_pushed_exports.py lookup \
            --out "$RUNNER_TEMP/action-exports" --wait 2700 --base-tier "$BASE_TIER" --skip "$SKIP_REASON" | tee -a "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: upload
        if: steps.lookup.outputs.hit == 'true' && steps.lookup.outputs.exports == 'true'
        continue-on-error: true
        timeout-minutes: 5
        with:
          name: action-exports
          path: ${{ runner.temp }}/action-exports
          if-no-files-found: error
          retention-days: 1

      # On a miss the Mac job regenerates, and it takes the owned gui label only while one of
      # its runners is idle now (read live, as the nightly visual gate's route does), else
      # Blacksmith macOS. Read last, right before the Mac job is placed: the lookup can take 45
      # minutes. Any failure leaves mac_runner empty, so the Mac job never queues on the minis
      # unseen. The runners read through the route App's own budget.
      - name: Mint the owned-pool routing token
        id: route-token
        if: steps.checkout.outcome == 'success' && steps.lookup.outputs.hit != 'true' && steps.carrier.outputs.mac_busy != 'true' && vars.CI_PR_POOL_OWNED == '1' && vars.GLAEDA_ROUTE_APP_ID != ''
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.GLAEDA_ROUTE_APP_ID }}
          private-key: ${{ secrets.GLAEDA_ROUTE_APP_KEY }}
          permission-administration: read
          permission-organization-self-hosted-runners: read

      - name: Pick an idle owned gui runner for the Mac exports
        id: mac-runner
        if: steps.checkout.outcome == 'success' && steps.lookup.outputs.hit != 'true' && steps.carrier.outputs.mac_busy != 'true' && vars.CI_PR_POOL_OWNED == '1'
        continue-on-error: true
        timeout-minutes: 2
        env:
          POOL_OWNED: ${{ vars.CI_PR_POOL_OWNED }}
          PR_XCODE_APP: ${{ vars.CMUX_CI_XCODE_APP_PR }}
          ROUTE_TOKEN: ${{ steps.route-token.outputs.token }}
        run: python3 scripts/ci/cmux_next_media_runner.py --same-repo true --idle-now --gui-only

  # This run left its exports to another run's queued or running pushed-exports or Mac job, and looked
  # for no pack itself (pushed-exports is skipped or deferred after its App-token recheck). It ends
  # green, and base-autofix-since.sh passes over it, so the next run still covers its changes.
  mac-exports-deferred:
    name: Mac exports deferred
    needs: [action-areas, pushed-exports]
    if: >-
      ${{ !cancelled() && !(github.event_name == 'push' && github.event.head_commit.author.name == 'github-actions[bot]' && (startsWith(github.event.head_commit.message, 'chore(next): base autofix at ') || startsWith(github.event.head_commit.message, 'chore(next): pin GhosttyKit for ghostty '))) &&
          (needs.action-areas.outputs.mac_busy == 'true' || needs.pushed-exports.outputs.deferred == 'true') }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || 'cmux-linux' }}
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Name the run that carries the exports
        env:
          BUSY_RUN: ${{ needs.action-areas.outputs.mac_busy_run || needs.pushed-exports.outputs.deferred_run }}
          SERVER: ${{ github.server_url }}/${{ github.repository }}
        run: |
          echo "Mac exports left to run $SERVER/actions/runs/$BUSY_RUN, whose pushed-exports or Mac job was already queued or running; the next run's changes include this run's." | tee -a "$GITHUB_STEP_SUMMARY"

  # The action exports on a Linux runner of our own pool (Leo, 2026-11-25: "if it works on linux and is at least as
  # fast if not faster, then we ought to just go ahead"): base-autofix-action-exports.sh at the newest tip, as the
  # Mac job ran it, with scripts/cmux-next/regenerate-action-exports-linux.sh as its regeneration (CmuxNext's action
  # model files built against cmux-action-catalog at the app's CCmuxAppFFI pin: about 15 s of build, where the Mac's
  # whole-package `swift test` build took about 14 min). It ends green and `verified` says whether it made them;
  # when it did not, action-exports below regenerates them on a Mac and says so.
  action-exports-linux:
    name: action exports (Linux)
    needs: [action-areas, pushed-exports]
    if: needs.action-areas.outputs.actions == 'true' && needs.action-areas.outputs.mac_busy != 'true' && needs.pushed-exports.outputs.deferred != 'true' && needs.pushed-exports.outputs.hit != 'true' && (vars.CMUX_ACTION_EXPORTS_LINUX || 'on') != '0'
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || 'cmux-linux' }}
    timeout-minutes: 30
    container: public.ecr.aws/docker/library/swift:6.2-noble@sha256:d6f8f6112e9a63da0a4a151d6b93acd16699d35c0b82531ac1a245f5af210197
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
    outputs:
      exports: ${{ steps.actions.outcome == 'success' && steps.actions.outputs.exports == 'true' && steps.upload.outcome == 'success' && 'true' || 'false' }}
      verified: ${{ steps.actions.outcome == 'success' && (steps.actions.outputs.exports != 'true' || steps.upload.outcome == 'success') && 'true' || 'false' }}
      # The exporter ran and could not make them: only then does the Mac make them. A checkout or setup that failed
      # before it leaves this job red and the exports unverified (push holds them back, as when the Mac fails).
      fallback: ${{ steps.actions.outcome == 'failure' && 'true' || 'false' }}
      # The commit the action exports were made at (the newest tip when their inputs moved).
      actions_made_at: ${{ steps.actions.outputs.made_at }}
    # NEXT's cache writer (feat-cmux-next only), for judge-action-exports.sh --publish, as the Mac job had it.
    environment: ${{ github.ref == 'refs/heads/feat-cmux-next' && 'next-cache-writer' || '' }}
    env:
      CI_CACHE_R2_BUCKET: cmux-ci-cache-next
    steps:
      # git before the checkout, or it downloads a tarball the script cannot move to the newest tip.
      - name: Install git, python3 and curl
        timeout-minutes: 5
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends git python3 curl ca-certificates

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          submodules: false

      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Set up pinned cmux-tui Rust
        id: rust
        continue-on-error: true
        timeout-minutes: 8
        uses: ./.github/actions/setup-cmux-tui-rust

      # The regeneration can start acpmux daemons: they get a home of the job's own
      # (tests/test_ci_acpmux_job_home.py).
      - name: Give this job its own acpmux home
        run: |
          home="$RUNNER_TEMP/acpmux-home"
          rm -rf "$home" && mkdir -m 700 "$home"
          echo "ACPMUX_HOME=$RUNNER_TEMP/acpmux-home" >> "$GITHUB_ENV"
          # An inherited socket would still name another home's daemon; empty is unset.
          echo "ACPMUX_SOCKET=" >> "$GITHUB_ENV"

      - name: Regenerate the action exports
        id: actions
        if: steps.rust.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 20
        run: |
          set -euo pipefail
          # The regeneration is read from the checkout the script moves to (the newest tip's copy).
          CMUX_ACTIONS_REGENERATE="$GITHUB_WORKSPACE/scripts/cmux-next/regenerate-action-exports-linux.sh" \
            scripts/cmux-next/base-autofix-action-exports.sh "$RUNNER_TEMP/action-exports" origin feat-cmux-next \
            | tee "$RUNNER_TEMP/action-exports.txt"
          echo "made_at=$(sed -n 's/^made at: //p' "$RUNNER_TEMP/action-exports.txt")" >> "$GITHUB_OUTPUT"
          if grep -q '^regenerated: ' "$RUNNER_TEMP/action-exports.txt"; then
            echo "exports=true" >> "$GITHUB_OUTPUT"
          fi

      # Also after a failure or a cancel: end the daemon of this job's home and
      # its agents (shutdown never starts one), then delete the home.
      - name: Stop this job's acpmux daemons and remove its home
        if: ${{ always() }}
        continue-on-error: true
        timeout-minutes: 3
        run: |
          home="$RUNNER_TEMP/acpmux-home"
          [[ -d "$home" ]] || exit 0
          acpmux="$(PATH="$PATH:$HOME/.local/bin:$HOME/.cargo/bin:/opt/homebrew/bin:/usr/local/bin" command -v acpmux || true)"
          [[ -z "$acpmux" ]] || env -u ACPMUX_SOCKET ACPMUX_HOME="$home" "$acpmux" daemon shutdown --end-agents || true
          rm -rf "$home"

      - name: Keep the fresh action exports for pull requests on that commit
        if: steps.actions.outcome == 'success' && steps.actions.outputs.made_at != ''
        continue-on-error: true
        timeout-minutes: 5
        env:
          MADE_AT: ${{ steps.actions.outputs.made_at }}
          AWS_ACCESS_KEY_ID: ${{ secrets.CI_CACHE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CI_CACHE_R2_SECRET_ACCESS_KEY }}
          CI_CACHE_R2_ENDPOINT: ${{ format('https://{0}.r2.cloudflarestorage.com', secrets.CI_CACHE_R2_ACCOUNT_ID) }}
        run: scripts/cmux-next/judge-action-exports.sh --publish "$MADE_AT" "$RUNNER_TEMP/action-exports" "$GITHUB_SHA"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: upload
        if: steps.actions.outcome == 'success' && steps.actions.outputs.exports == 'true'
        continue-on-error: true
        timeout-minutes: 5
        with:
          name: action-exports-linux
          path: ${{ runner.temp }}/action-exports
          if-no-files-found: error
          retention-days: 1

  # The settings exports on a Linux runner of our own pool (Leo, 2026-11-25: "if it works on linux and is at least
  # as fast if not faster, then we ought to just go ahead"): base-autofix-settings-exports.sh at the newest tip, as
  # the Mac job ran it, with scripts/cmux-next/regenerate-settings-exports-linux.sh as its regeneration (python3
  # reads the settings sources and the string catalog and writes the bytes the Mac's export tests write, in under a
  # second where the Mac's package build took minutes). It ends green and `verified` says whether it made them; when
  # it could not decide (a catalog key missing, a source that changed shape), action-exports below regenerates them
  # on a Mac and says so.
  settings-exports-linux:
    name: settings exports (Linux)
    needs: [action-areas, pushed-exports]
    if: needs.action-areas.outputs.settings == 'true' && needs.action-areas.outputs.mac_busy != 'true' && needs.pushed-exports.outputs.deferred != 'true' && needs.pushed-exports.outputs.hit != 'true' && (vars.CMUX_SETTINGS_EXPORTS_LINUX || 'on') != '0'
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || 'cmux-linux' }}
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      exports: ${{ steps.settings.outcome == 'success' && steps.settings.outputs.exports == 'true' && steps.upload.outcome == 'success' && 'true' || 'false' }}
      verified: ${{ steps.settings.outcome == 'success' && (steps.settings.outputs.exports != 'true' || steps.upload.outcome == 'success') && 'true' || 'false' }}
      # The exporter ran and could not make them: only then does the Mac make them. A checkout or setup that failed
      # before it leaves this job red and the exports unverified (push holds them back, as when the Mac fails).
      fallback: ${{ steps.settings.outcome == 'failure' && 'true' || 'false' }}
      # The commit the settings exports were made at (the newest tip when their inputs moved).
      settings_made_at: ${{ steps.settings.outputs.made_at }}
    steps:
      # Why: docs/ci/cmux-next-workflow-notes.md#note-267
      - name: Give this job its own acpmux home
        run: |
          home="$RUNNER_TEMP/acpmux-home"
          rm -rf "$home" && mkdir -m 700 "$home"
          echo "ACPMUX_HOME=$RUNNER_TEMP/acpmux-home" >> "$GITHUB_ENV"
          # An inherited socket would still name another home's daemon; empty is unset.
          echo "ACPMUX_SOCKET=" >> "$GITHUB_ENV"

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          submodules: false

      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Regenerate the settings exports
        id: settings
        continue-on-error: true
        timeout-minutes: 15
        run: |
          set -euo pipefail
          started=$SECONDS
          # The regeneration is read from the checkout the script moves to (the newest tip's copy).
          CMUX_SETTINGS_REGENERATE="$GITHUB_WORKSPACE/scripts/cmux-next/regenerate-settings-exports-linux.sh" \
            scripts/cmux-next/base-autofix-settings-exports.sh "$RUNNER_TEMP/action-exports" origin feat-cmux-next \
            | tee "$RUNNER_TEMP/settings-exports.txt"
          echo "settings exports (Linux): $((SECONDS - started))s" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "made_at=$(sed -n 's/^made at: //p' "$RUNNER_TEMP/settings-exports.txt")" >> "$GITHUB_OUTPUT"
          if grep -q '^regenerated: ' "$RUNNER_TEMP/settings-exports.txt"; then
            echo "exports=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: upload
        if: steps.settings.outcome == 'success' && steps.settings.outputs.exports == 'true'
        continue-on-error: true
        timeout-minutes: 5
        with:
          name: settings-exports-linux
          path: ${{ runner.temp }}/action-exports
          if-no-files-found: error
          retention-days: 1

  # Regenerates the action exports and the settings exports on a Mac with a
  # read-only token and hands them to autofix as the action-exports artifact
  # (files at their repository paths).
  # Only when the push's packed exports (pushed-exports) could not be taken.

      - name: Stop this job's acpmux daemons and remove its home
        if: ${{ always() }}
        continue-on-error: true
        timeout-minutes: 3
        run: |
          home="$RUNNER_TEMP/acpmux-home"
          [[ -d "$home" ]] || exit 0
          acpmux="$(PATH="$PATH:$HOME/.local/bin:$HOME/.cargo/bin:/opt/homebrew/bin:/usr/local/bin" command -v acpmux || true)"
          [[ -z "$acpmux" ]] || env -u ACPMUX_SOCKET ACPMUX_HOME="$home" "$acpmux" daemon shutdown --end-agents || true
          rm -rf "$home"

  action-exports:
    name: action exports (Mac)
    needs: [action-areas, pushed-exports, action-exports-linux, settings-exports-linux]
    # The action exports only as action-exports-linux's fallback and the settings exports only as
    # settings-exports-linux's (each logs why).
    if: ${{ !cancelled() && ((needs.action-areas.outputs.actions == 'true' && (needs.action-exports-linux.result == 'skipped' || needs.action-exports-linux.outputs.fallback == 'true')) || (needs.action-areas.outputs.settings == 'true' && (needs.settings-exports-linux.result == 'skipped' || needs.settings-exports-linux.outputs.fallback == 'true'))) && needs.action-areas.outputs.mac_busy != 'true' && needs.pushed-exports.outputs.deferred != 'true' && needs.pushed-exports.outputs.hit != 'true' }}
    # No concurrency group: a queued job keeps its place. Cancelling a running one meant that with
    # merges minutes apart no Mac export ever finished (2026-10-19), and replacing a pending one did
    # the same once the Mac runners were saturated: each job waited minutes for a runner and the next
    # push replaced it before it started (2026-10-21, 11:15-11:36Z, no export after 02:14Z). Instead a
    # run skips this job while another run's is queued or running (base-autofix-mac-busy.sh) and ends
    # green with mac-exports-deferred; the next run's "since" passes over it (base-autofix-since.sh).
    # The exports need a logged-in session: an owned gui runner, or Blacksmith macOS (where
    # cmux-next.yml's generated files make the same exports). They take the owned gui label only
    # when pushed-exports saw a gui runner idle as it handed over (mac_runner,
    # cmux_next_media_runner.py --idle-now --gui-only), never the session label (cmux#24295).
    # With none idle, or the runners unread, they take Blacksmith macOS at once: a job queued on the
    # gui label waits for the owned-pool rescue, which cancels a superseded push run without a
    # re-run, so with the office minis dark on 2026-11-10 every export was cancelled in its queue
    # and feat-cmux-next's settings export stayed stale from 14:21Z.
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || vars.CI_PR_POOL_OWNED == '1' && (github.run_attempt == 1 || !contains(fromJSON('["github-actions[bot]","cmux-bot[bot]"]'), github.triggering_actor)) && needs.pushed-exports.outputs.mac_runner || vars.CI_PR_POOL_OWNED == '1' && (vars.CI_BLACKSMITH_MACOS != 'on' && (vars.CI_SIDE_LANE_LABELS != '' && fromJSON(vars.CI_SIDE_LANE_LABELS) || vars.CI_SIDE_LANE_RUNNER) || fromJSON(vars.RUNNER_POOLS).macos_26) || (vars.CI_BLACKSMITH_MACOS != 'on' && (vars.CI_SIDE_LANE_LABELS != '' && fromJSON(vars.CI_SIDE_LANE_LABELS) || vars.CI_SIDE_LANE_RUNNER) || vars.MACOS_RUNNER_26 || fromJSON(vars.RUNNER_POOLS).macos_26) }}
    # One action regeneration and up to three settings regenerations on a moving tip
    # (base-autofix-action-exports.sh, base-autofix-settings-exports.sh).
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      exports: ${{ steps.actions.outputs.exports == 'true' || steps.settings.outputs.exports == 'true' }}
      # The commit the settings exports were made at (the newest tip when their inputs moved).
      settings_made_at: ${{ steps.settings.outputs.made_at }}
      # The commit the action exports were made at (the newest tip when their inputs moved).
      actions_made_at: ${{ steps.actions.outputs.made_at }}
      # The exports on this tree are current: regenerated, or already fresh.
      # Only a step that ran and passed: this job now skips an area whose Linux job failed before its exporter
      # (that area stays unverified), and push reads an area that did not change, or that Linux verified, from
      # action-areas and the Linux job, never from here.
      verified: ${{ steps.actions.outcome == 'success' }}
      settings_verified: ${{ steps.settings.outcome == 'success' }}
    # NEXT's cache writer (feat-cmux-next only): the fresh action exports go to cmux-ci-cache-next for
    # the pull requests on the commit they were made at (judge-action-exports.sh --publish).
    environment: ${{ github.ref == 'refs/heads/feat-cmux-next' && 'next-cache-writer' || '' }}
    env:
      CI_CACHE_R2_BUCKET: cmux-ci-cache-next
      CMUX_CI_XCODE_APP: ${{ vars.CMUX_CI_XCODE_APP_MACOS_26 }}
      CMUX_CI_REQUIRED_MACOS_SDK_MAJOR: "26"
    steps:
      # This job's tests can start acpmux daemons: they get a home of the job's
      # own, never the runner's ~/.acpmux, the mini's own daemon
      # (tests/test_ci_acpmux_job_home.py).
      - name: Give this job its own acpmux home
        run: |
          home="$RUNNER_TEMP/acpmux-home"
          rm -rf "$home" && mkdir -m 700 "$home"
          echo "ACPMUX_HOME=$RUNNER_TEMP/acpmux-home" >> "$GITHUB_ENV"
          # An inherited socket would still name another home's daemon; empty is unset.
          echo "ACPMUX_SOCKET=" >> "$GITHUB_ENV"

      - name: Clear stale git locks (self-hosted reused workspace)
        shell: bash
        run: rm -f "${GITHUB_WORKSPACE:-$PWD}/.git/index.lock" 2>/dev/null || true

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          submodules: false

      - name: Drop stale submodule checkouts (self-hosted reused workspace)
        run: scripts/ci/reset-stale-submodules.sh

      - name: Select Xcode
        run: ./scripts/select-ci-xcode.sh

      - name: Set up pinned cmux-tui Rust (sidebar layout reducer)
        uses: ./.github/actions/setup-cmux-tui-rust

      # The package's resources include the web bundles (cmux-next.yml's
      # generated-files job builds them the same way).
      - name: Restore pinned Bun 1.4.4 from the CI cache bucket
        shell: bash
        continue-on-error: true
        run: bash "$GITHUB_WORKSPACE/scripts/ci/toolchain-r2.sh" restore bun 1.4.4 || true

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
          no-cache: ${{ !startsWith(github.workspace, '/home/runner/work/') || !(github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && github.event_name != 'merge_group' && contains(fromJSON('["refs/heads/main","refs/heads/feat-cmux-next","refs/heads/nightly-next"]'), github.ref)) }}

      - name: Give this job its own bun
        run: scripts/cmux-next/private-bun.sh

      - name: Restore pinned Node 24.22.1 from the CI cache bucket
        shell: bash
        continue-on-error: true
        run: bash "$GITHUB_WORKSPACE/scripts/ci/toolchain-r2.sh" restore node 24.22.1 || true

      - name: Setup Node
        timeout-minutes: 5
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.22.1"

      - name: Source key of the web bundles
        id: web-bundle-key
        run: echo "key=$(python3 scripts/cmux-next/web-bundle-key.py . --source)" >> "$GITHUB_OUTPUT"

      - name: Restore the web bundles built for this source key
        timeout-minutes: 5
        continue-on-error: true
        id: web-bundle-cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: web-bundles-out
          key: cmux-next-web-bundles-v1-${{ steps.web-bundle-key.outputs.key }}

      - name: Install the restored web bundles
        if: steps.web-bundle-cache.outputs.cache-hit == 'true'
        run: scripts/cmux-next/build-web-bundles.sh --from web-bundles-out

      # These bundles only host the export tests and are never shipped or cached, so a missing
      # translation is a warning here: a stale settings schema must not stop the job that
      # regenerates it (the deadlock after #22577).
      - name: Build the web bundles
        env:
          CMUX_STRINGS_BEST_EFFORT: "1"
        run: scripts/cmux-next/build-web-bundles.sh

      # Made at the newest tip: the job queues for up to half an hour and the actions area moves every
      # few minutes, so exports made at the run's commit were held on every push (2026-10-21). It
      # starts on the tip when the area moved meanwhile, regenerates once, and leaves the checkout at
      # the run's commit; base-autofix-push.sh lands the exports as progress when the area moved again.
      - name: Say why the Mac makes the action exports
        if: needs.action-areas.outputs.actions == 'true' && (needs.action-exports-linux.result == 'skipped' || needs.action-exports-linux.outputs.fallback == 'true')
        env:
          LINUX_RESULT: ${{ needs.action-exports-linux.result }}
        run: echo "::warning title=mac fallback::action exports (Linux) did not make the action exports (job ${LINUX_RESULT:-not run}); regenerating them on this Mac."

      - name: Regenerate the action exports
        id: actions
        if: needs.action-areas.outputs.actions == 'true' && (needs.action-exports-linux.result == 'skipped' || needs.action-exports-linux.outputs.fallback == 'true')
        continue-on-error: true
        timeout-minutes: 40
        env:
          CMUX_STRINGS_BEST_EFFORT: "1"
          CMUX_BASE_AUTOFIX_ACTIONS_PREPARE: scripts/cmux-next/build-web-bundles.sh
        run: |
          set -euo pipefail
          scripts/cmux-next/base-autofix-action-exports.sh "$RUNNER_TEMP/action-exports" origin feat-cmux-next \
            | tee "$RUNNER_TEMP/action-exports.txt"
          echo "made_at=$(sed -n 's/^made at: //p' "$RUNNER_TEMP/action-exports.txt")" >> "$GITHUB_OUTPUT"
          if grep -q '^regenerated: ' "$RUNNER_TEMP/action-exports.txt"; then
            echo "exports=true" >> "$GITHUB_OUTPUT"
          fi

      # A pull request on the commit they were made at (or any commit with the same generator inputs)
      # reads them from R2 instead of building that commit to judge its stale exports
      # (scripts/cmux-next/judge-action-exports.sh): that base build was 16 to 32 min of daemon-test
      # in 28 of 68 pull request runs (2026-11-16..17). They hold the exports that differ from the
      # run's commit; the rest are its own. Only this feat-cmux-next push job writes; pull requests read.
      - name: Keep the fresh action exports for pull requests on that commit
        if: steps.actions.outcome == 'success' && steps.actions.outputs.made_at != ''
        continue-on-error: true
        timeout-minutes: 5
        env:
          MADE_AT: ${{ steps.actions.outputs.made_at }}
          AWS_ACCESS_KEY_ID: ${{ secrets.CI_CACHE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CI_CACHE_R2_SECRET_ACCESS_KEY }}
          CI_CACHE_R2_ENDPOINT: ${{ format('https://{0}.r2.cloudflarestorage.com', secrets.CI_CACHE_R2_ACCOUNT_ID) }}
        run: scripts/cmux-next/judge-action-exports.sh --publish "$MADE_AT" "$RUNNER_TEMP/action-exports" "$GITHUB_SHA"

      # The settings exports, into the same artifact. A push that
      # moves their inputs meanwhile would hold them at the push (base-autofix-push.sh), and one
      # nearly always does in a half-hour run, so they are made again on the newest tip (this
      # checks the tip out; the action exports above are already copied out) up to three
      # times; then they wait and this fails. Runs last: later steps read no checkout files.
      - name: Say why the Mac makes the settings exports
        if: needs.action-areas.outputs.settings == 'true' && (needs.settings-exports-linux.result == 'skipped' || needs.settings-exports-linux.outputs.fallback == 'true')
        env:
          LINUX_RESULT: ${{ needs.settings-exports-linux.result }}
        run: echo "::warning title=mac fallback::settings exports (Linux) did not make the settings exports (job ${LINUX_RESULT:-not run}); regenerating them on this Mac."

      - name: Regenerate the settings exports
        id: settings
        if: needs.action-areas.outputs.settings == 'true' && (needs.settings-exports-linux.result == 'skipped' || needs.settings-exports-linux.outputs.fallback == 'true')
        continue-on-error: true
        # Below the job's 90 so a slow run fails only this step, and the upload of the action
        # exports (and of any settings export it finished) still runs.
        timeout-minutes: 40
        env:
          CMUX_STRINGS_BEST_EFFORT: "1"
          CMUX_BASE_AUTOFIX_SETTINGS_PREPARE: scripts/cmux-next/build-web-bundles.sh
        run: |
          set -euo pipefail
          scripts/cmux-next/base-autofix-settings-exports.sh "$RUNNER_TEMP/action-exports" origin feat-cmux-next \
            | tee "$RUNNER_TEMP/settings-exports.txt"
          echo "made_at=$(sed -n 's/^made at: //p' "$RUNNER_TEMP/settings-exports.txt")" >> "$GITHUB_OUTPUT"
          if grep -q '^regenerated: ' "$RUNNER_TEMP/settings-exports.txt"; then
            echo "exports=true" >> "$GITHUB_OUTPUT"
          fi

      # Also after a failure or a cancel: end the daemon of this job's home and
      # its agents (shutdown never starts one), then delete the home.
      - name: Stop this job's acpmux daemons and remove its home
        if: ${{ always() }}
        continue-on-error: true
        timeout-minutes: 3
        run: |
          home="$RUNNER_TEMP/acpmux-home"
          [[ -d "$home" ]] || exit 0
          acpmux="$(PATH="$PATH:$HOME/.local/bin:$HOME/.cargo/bin:/opt/homebrew/bin:/usr/local/bin" command -v acpmux || true)"
          [[ -z "$acpmux" ]] || env -u ACPMUX_SOCKET ACPMUX_HOME="$home" "$acpmux" daemon shutdown --end-agents || true
          rm -rf "$home"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.actions.outputs.exports == 'true' || steps.settings.outputs.exports == 'true'
        with:
          name: action-exports
          path: ${{ runner.temp }}/action-exports
          if-no-files-found: error
          retention-days: 1

      # A failed regeneration must not end in a successful run: the next run
      # diffs from the last successful one, and would drop this change.
      - name: Fail when a regeneration failed
        if: steps.actions.outcome == 'failure' || steps.settings.outcome == 'failure'
        run: |
          echo "::error::regenerating the exports failed (actions: ${{ steps.actions.outcome }}, settings: ${{ steps.settings.outcome }}); the repairs that follow them wait"
          exit 1

  # `vp fmt` needs webviews' installed packages, so it runs here with a
  # read-only token (installed without lifecycle scripts) and hands its diff to
  # the autofix job as a patch, which applies only webviews paths.
  webviews-fmt:
    name: webviews vp fmt
    needs: window
    if: >-
      ${{ needs.window.outputs.run == 'true' && github.repository == 'manaflow-ai/cmux' && !(github.event_name == 'push' && github.event.head_commit.author.name == 'github-actions[bot]' && (startsWith(github.event.head_commit.message, 'chore(next): base autofix at ') || startsWith(github.event.head_commit.message, 'chore(next): pin GhosttyKit for ghostty '))) }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || 'cmux-linux' }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Restore pinned Bun 1.4.4 from the CI cache bucket
        shell: bash
        continue-on-error: true
        run: bash "$GITHUB_WORKSPACE/scripts/ci/toolchain-r2.sh" restore bun 1.4.4 || true

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
          no-cache: ${{ !startsWith(github.workspace, '/home/runner/work/') || !(github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && github.event_name != 'merge_group' && contains(fromJSON('["refs/heads/main","refs/heads/feat-cmux-next","refs/heads/nightly-next"]'), github.ref)) }}

      # `vp` runs on Node and needs ^22.18 or ^24.11.
      - name: Restore pinned Node 24.22.1 from the CI cache bucket
        shell: bash
        continue-on-error: true
        run: bash "$GITHUB_WORKSPACE/scripts/ci/toolchain-r2.sh" restore node 24.22.1 || true

      - name: Setup Node
        timeout-minutes: 5
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.22.1"

      - name: vp fmt
        working-directory: webviews
        run: |
          set -euo pipefail
          bun install --frozen-lockfile --ignore-scripts
          node_modules/.bin/vp fmt
          # The Chief memory inspector page is bundled from webviews sources and
          # committed; a stale one fails every webviews bundle build (#22839).
          # Best effort: a failed rebuild must not cost the formatting repairs.
          page=:/Native/OptChat/optchat-chief/inspector/index.html
          ../scripts/cmux-next/build-optchat-inspector-web.sh || {
            echo "::warning title=inspector page::rebuilding the Chief memory inspector page failed; left as committed"
            git checkout --quiet -- "$page"
          }
          git diff --binary -- . "$page" > "$RUNNER_TEMP/webviews-fmt.patch"
          git diff --stat -- . "$page" | tail -1

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: webviews-fmt-patch
          path: ${{ runner.temp }}/webviews-fmt.patch
          if-no-files-found: error
          retention-days: 1

  # The CI target graph on its own Linux job, so it never waits for the Mac exports job: the
  # graph is made from the package manifest alone (base-autofix-repair.sh dumps it in the Swift 6.2
  # container). 2026-10-21: a push added a test target without the graph and every PR's Tier
  # routing was red for 90 minutes while autofix, which made it, waited for the Mac job. Autofix
  # still makes the graph too; whichever lands second finds it current.
  target-graph:
    name: CI target graph
    needs: window
    if: >-
      ${{ needs.window.outputs.run == 'true' && github.repository == 'manaflow-ai/cmux' && !(github.event_name == 'push' && github.event.head_commit.author.name == 'github-actions[bot]' && (startsWith(github.event.head_commit.message, 'chore(next): base autofix at ') || startsWith(github.event.head_commit.message, 'chore(next): pin GhosttyKit for ghostty '))) }}
    # A running one finishes and lands on the newest tip; a newer push replaces only a pending one,
    # and that one makes the graph from the newer tip.
    concurrency:
      group: cmux-next-base-autofix-target-graph-${{ github.ref_name }}
      cancel-in-progress: false
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.CI_REPAIR_SKIP_FLEET != '1' && 'cmux-gcp-repair-jit-x64' || fromJSON(vars.RUNNER_POOLS).linux_4 }} # ephemeral-required: holds a contents write token for feat-cmux-next; ephemeral Blacksmith VM
    timeout-minutes: 15
    permissions:
      actions: write # dispatch cmux-tui-artifacts.yml for the bot head (publish-bot-head-tree.sh)
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # The shared publisher checks Rust catalog parity on every final candidate.
      - name: Set up pinned cmux-tui Rust
        uses: ./.github/actions/setup-cmux-tui-rust

      # The graph only, as base-autofix-land.sh makes a repair again on a moved tip: nothing from
      # or built from the Mac exports, no formatting.
      - name: Make the graph
        env:
          GRAPH: "true"
          CMUX_BASE_AUTOFIX_AGAIN: "1"
        run: |
          set -euo pipefail
          scripts/cmux-next/base-autofix-repair.sh "$GITHUB_WORKSPACE" | tee "$RUNNER_TEMP/graph.txt"

      - name: Commit the graph
        id: commit
        env:
          HEAD_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "The CI target graph is current at ${HEAD_SHA:0:12}." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git add -A
          git commit --quiet -m "chore(next): base autofix at ${HEAD_SHA:0:12}" \
            -m "$(grep '^fixed: ' "$RUNNER_TEMP/graph.txt" | sed 's/^fixed: /- /')" \
            -m "scripts/cmux-next/base-autofix.sh: $RUN_URL"
          git show --stat --oneline HEAD | sed -n '1,20p' >> "$GITHUB_STEP_SUMMARY"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # The push token: an App push starts the push workflows (Push identity, above).
      - name: Mint the push token
        id: push-token
        if: steps.commit.outputs.changed == 'true' && vars.CMUX_NEXT_BASE_AUTOFIX == '1'
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.CMUX_PR_AUTOFIX_APP_ID }}
          private-key: ${{ secrets.CMUX_PR_AUTOFIX_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Push the graph
        if: steps.commit.outputs.changed == 'true'
        env:
          GRAPH: "true"
          CMUX_BASE_AUTOFIX_AGAIN: "1"
          TOKEN: ${{ steps.push-token.outputs.token || github.token }}
          ENABLED: ${{ vars.CMUX_NEXT_BASE_AUTOFIX == '1' }}
          HEAD_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CMUX_BASE_AUTOFIX_REPAIR: scripts/cmux-next/base-autofix-repair.sh
        run: |
          set -euo pipefail
          if [[ "$ENABLED" != true ]]; then
            echo "Dry run (CMUX_NEXT_BASE_AUTOFIX is not 1): would push $(git rev-parse --short HEAD) to feat-cmux-next." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "::add-mask::$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          scripts/cmux-next/base-autofix-land.sh "https://github.com/$GITHUB_REPOSITORY.git" feat-cmux-next "$HEAD_SHA" 2>&1 \
            | tee -a "$GITHUB_STEP_SUMMARY"

      # A GITHUB_TOKEN push (no App token) started no workflow: start the bot head's cmux-tui
      # artifacts run (scripts/cmux-next/publish-bot-head-tree.sh: nothing when the head has a run;
      # it never fails this job).
      - name: Start the cmux-tui publish of the bot head
        if: ${{ !cancelled() && steps.commit.outputs.changed == 'true' && vars.CMUX_NEXT_BASE_AUTOFIX == '1' && steps.push-token.outputs.token == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/cmux-next/publish-bot-head-tree.sh feat-cmux-next 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

  autofix:
    name: autofix feat-cmux-next
    # The other repairs still run when the webviews formatting or the Mac
    # action exports job fails or is skipped.
    needs: [window, action-areas, webviews-fmt, action-exports-linux, settings-exports-linux, action-exports, pushed-exports]
    if: >-
      ${{ !cancelled() && needs.window.outputs.run == 'true' && github.repository == 'manaflow-ai/cmux' && !(github.event_name == 'push' && github.event.head_commit.author.name == 'github-actions[bot]' && (startsWith(github.event.head_commit.message, 'chore(next): base autofix at ') || startsWith(github.event.head_commit.message, 'chore(next): pin GhosttyKit for ghostty '))) }}
    # A running repair finishes and lands on whatever feat-cmux-next is by then
    # (scripts/cmux-next/base-autofix-land.sh); a newer push replaces only a pending run.
    # The next run diffs from the last successful one. The run that carries Mac exports gets a
    # group of its own, so it is never that pending run: runs whose own Mac job was replaced
    # still repair the rest, a minute and a half every minute or two, and the next push replaced
    # the finished exports' autofix while it queued behind one of them (2026-10-21). Its push
    # races theirs safely (base-autofix-push.sh reads the tip and retries).
    concurrency:
      group: cmux-next-base-autofix-${{ github.ref_name }}${{ ((needs.pushed-exports.outputs.hit == 'true' && needs.pushed-exports.outputs.exports || needs.action-exports.outputs.exports) == 'true' || needs.action-exports-linux.outputs.exports == 'true' || needs.settings-exports-linux.outputs.exports == 'true') && format('-exports-{0}', github.run_id) || '' }}
      cancel-in-progress: false
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.CI_REPAIR_SKIP_FLEET != '1' && 'cmux-gcp-repair-jit-x64' || fromJSON(vars.RUNNER_POOLS).linux_4 }} # ephemeral-required: holds a contents write token for feat-cmux-next; ephemeral Blacksmith VM
    # 20 minutes of repair and push, plus the compile gate's wait (base-autofix-compile-gate.sh, 40 min) when a repair changes Swift.
    timeout-minutes: 65
    permissions:
      actions: write # read the last successful run; dispatch cmux-tui-artifacts.yml for the bot head and fleet-compile-check.yml (the compile gate)
      contents: write
      pull-requests: write # the Swift rewrites' pull request when the App's pull-request token can't be minted
      statuses: read # the compile gate reads fleet/compile-check on its candidate
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # The marker base-autofix-since.sh reads: this run made its own Mac exports, or had none to make (the
      # deferred job's condition, negated). The next runs diff from the newest successful run that has it, with
      # two listings instead of reading every run's jobs (31 GITHUB_TOKEN calls a lookup on 2026-11-22). A failed
      # upload leaves no marker, which only widens the next run's range.
      - name: Write the own-exports marker
        if: needs.action-areas.outputs.mac_busy != 'true' && needs.pushed-exports.outputs.deferred != 'true'
        run: printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/base-autofix-own-exports.txt"
      - name: Upload the own-exports marker
        if: needs.action-areas.outputs.mac_busy != 'true' && needs.pushed-exports.outputs.deferred != 'true'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: base-autofix-own-exports
          path: ${{ runner.temp }}/base-autofix-own-exports.txt
          retention-days: 14
          if-no-files-found: error

      # What changed since the last successful run decides the repairs: a run
      # cancelled by a newer push, one whose repair could not land, or one that
      # left its Mac exports to another run (base-autofix-since.sh passes over
      # it) leaves its changes to the next run instead of losing them. No earlier success,
      # or a change to the bot itself, runs them all.
      - name: Changed areas
        id: areas
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          since="$(scripts/cmux-next/base-autofix-since.sh feat-cmux-next)"
          # scripts/cmux-next/autofix-areas.sh maps the changed paths to repairs.
          # base-autofix-changed.sh reads since..HEAD without grafting since into this depth-1 checkout:
          # a graft cut the tip's history off before HEAD, and every Mac export was held (run 39617667536).
          # The changed paths also pick the crates cargo clippy --fix repairs (CLIPPY_CHANGED); with no
          # diff, every tracked cmux-tui Rust file stands for them.
          if [[ -z "$since" ]] || ! changed="$(scripts/cmux-next/base-autofix-changed.sh "$since")"; then
            echo "No successful run to diff from; running every repair."
            scripts/cmux-next/autofix-areas.sh --all | tee -a "$GITHUB_OUTPUT"
            git ls-files -- 'cmux-tui/*.rs' > "$RUNNER_TEMP/changed.txt"
          else
            echo "Changes since the last successful run at ${since:0:12}."
            scripts/cmux-next/autofix-areas.sh <<<"$changed" | tee -a "$GITHUB_OUTPUT"
            printf '%s\n' "$changed" > "$RUNNER_TEMP/changed.txt"
          fi

      - name: Restore pinned Node 24.22.1 from the CI cache bucket
        if: steps.areas.outputs.strings == 'true'
        shell: bash
        continue-on-error: true
        run: bash "$GITHUB_WORKSPACE/scripts/ci/toolchain-r2.sh" restore node 24.22.1 || true

      - name: Setup Node
        timeout-minutes: 5
        if: steps.areas.outputs.strings == 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.22.1"

      - name: Restore pinned Bun 1.4.4 from the CI cache bucket
        if: steps.areas.outputs.shortcuts == 'true' || steps.areas.outputs.apphost == 'true' || (needs.pushed-exports.outputs.hit == 'true' && needs.pushed-exports.outputs.exports || needs.action-exports.outputs.exports) == 'true' || steps.areas.outputs.cloud == 'true'
        shell: bash
        continue-on-error: true
        run: bash "$GITHUB_WORKSPACE/scripts/ci/toolchain-r2.sh" restore bun 1.4.4 || true

      - name: Setup Bun
        if: steps.areas.outputs.shortcuts == 'true' || steps.areas.outputs.apphost == 'true' || (needs.pushed-exports.outputs.hit == 'true' && needs.pushed-exports.outputs.exports || needs.action-exports.outputs.exports) == 'true' || needs.action-exports-linux.outputs.exports == 'true' || steps.areas.outputs.cloud == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
          no-cache: ${{ !startsWith(github.workspace, '/home/runner/work/') || !(github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && github.event_name != 'merge_group' && contains(fromJSON('["refs/heads/main","refs/heads/feat-cmux-next","refs/heads/nightly-next"]'), github.ref)) }}

      # Required for the strict parity check before every automatic push, regardless of repair area.
      - name: Set up pinned cmux-tui Rust
        uses: ./.github/actions/setup-cmux-tui-rust

      # cargo clippy --fix builds what the clippy gate builds (cmux-tui-spec.yml): clang for bindgen,
      # and zig with the ghostty-next submodule for ghostty-vt-sys. Without them the build fails and
      # clippy leaves every lint for a person.
      - name: Install Linux build dependencies for clippy
        if: steps.areas.outputs.clippy == 'true'
        run: |
          # Skip apt when the runner image already has these (tests/test_ci_apt_skips_baked_packages.py).
          if dpkg -s clang libclang-dev pkg-config >/dev/null 2>&1; then
            echo "clang libclang-dev pkg-config: already installed"
          else
            sudo apt-get update
            sudo apt-get install -y clang libclang-dev pkg-config
          fi

      - name: Init the ghostty-next submodule for clippy
        if: steps.areas.outputs.clippy == 'true'
        run: bash scripts/ci/init-submodule.sh ghostty-next

      - name: Install zig for clippy
        if: steps.areas.outputs.clippy == 'true'
        env:
          # The clippy gate's build env (cmux-tui-spec.yml): zig's version from ghostty-next (the
          # default, ghostty, is not checked out here), the ghostty-next gitlink as the source, and a
          # baseline CPU so the gate's build cache matches.
          GHOSTTY_ZIG_SOURCE: ghostty-next
          CMUX_GHOSTTY_SRC: ""
          CMUX_GHOSTTY_VT_ZIG_CPU: baseline
        run: ./scripts/install-zig-ci.sh

      # The clippy gate's warm target (cmux-tui-spec.yml clippy, "Mount the warm clippy target"): the last
      # feat-cmux-next clippy's whole target dir and cargo registry on a Blacksmith sticky disk, mounted as
      # a clone this job never writes back. The rust-cache entry below found nothing on 2026-11-21, so a
      # run that had no green run to diff from (every repair, all 145 crates) spent 16 of its 18 minutes
      # of Repair building clippy cold on 4 vCPU (run 44930924492). A source whose content equals the
      # snapshot's gets its recorded mtime back, so a changed file is always checked again. A failed
      # mount or an empty disk falls back to the rust-cache restore, as before.
      - name: Mount the warm clippy target (read-only)
        id: warm-read
        if: steps.areas.outputs.clippy == 'true' && startsWith(runner.name, 'blacksmith')
        continue-on-error: true
        uses: useblacksmith/stickydisk@3f6be1451e3cad893b778bc93495c80452a5da26 # v1.7.2
        with:
          key: cmux-tui-clippy-warm-v1-next
          path: /home/runner/cmux-tui-clippy-warm
          commit: "false"

      - name: Link the warm clippy target
        id: warm
        if: steps.warm-read.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          disk=/home/runner/cmux-tui-clippy-warm
          if [[ ! -f "$disk/target/.machine-channel-warm-source" ]]; then
            echo "warm target: miss (no feat-cmux-next snapshot on the disk yet); rust-cache restore instead"
            exit 0
          fi
          start=$(date +%s)
          bash scripts/ci/machine-channel-warm-target.sh restore "$disk" x86_64-unknown-linux-gnu
          if [[ "$(readlink cmux-tui/target 2>/dev/null || true)" == "$disk/target" ]]; then
            echo "linked=true" >> "$GITHUB_OUTPUT"
          fi
          echo "warm target: restore took $(( $(date +%s) - start )) s"

      # cargo clippy --fix (CLIPPY) builds the crates the changed Rust can affect: it reads the build cache
      # feat-cmux-next's own clippy gate saves (cmux-tui-spec.yml) and never writes it. Skipped when the
      # warm target above is linked.
      - name: Cache cargo build
        if: steps.areas.outputs.clippy == 'true' && steps.warm.outputs.linked != 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Why: docs/ci/cmux-next-workflow-notes.md#note-210 (pool runners keep different leftover toolchains)
          add-rust-environment-hash-key: false
          cache-bin: false
          workspaces: cmux-tui -> target
          shared-key: cmux-tui-pr-clippy-${{ hashFiles('cmux-tui/rust-toolchain.toml', 'cmux-tui/Cargo.lock', '.cargo/config.toml') }}
          save-if: false

      - name: Download the webviews formatting patch
        if: needs.webviews-fmt.result == 'success'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: webviews-fmt-patch
          path: ${{ runner.temp }}/webviews-fmt

      # From the Mac job, or from pushed-exports when it took the push's pack (one of them uploads it).
      - name: Download the regenerated action exports
        if: (needs.pushed-exports.outputs.hit == 'true' && needs.pushed-exports.outputs.exports || needs.action-exports.outputs.exports) == 'true'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: action-exports
          path: ${{ runner.temp }}/action-exports

      # The Linux job's action exports, into the same folder (the Mac's artifact then holds only settings exports).
      - name: Download the action exports made on Linux
        if: needs.action-exports-linux.outputs.exports == 'true'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: action-exports-linux
          path: ${{ runner.temp }}/action-exports

      # The Linux job's settings exports, into the same folder (the Mac's artifact then holds none).
      - name: Download the settings exports made on Linux
        if: needs.settings-exports-linux.outputs.exports == 'true'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: settings-exports-linux
          path: ${{ runner.temp }}/action-exports

      # scripts/cmux-next/base-autofix-repair.sh turns the areas into base-autofix.sh's repairs (including
      # the source-derived daemon capability export; it dumps
      # the package manifest for the CI target graph in the Swift 6.2 container); the push step runs
      # it again on a moved tip.
      - name: Repair
        env:
          GRAPH: ${{ steps.areas.outputs.graph }}
          STRINGS: ${{ steps.areas.outputs.strings }}
          SDK: ${{ steps.areas.outputs.sdk }}
          CAPABILITIES: ${{ steps.areas.outputs.capabilities }}
          SHORTCUTS: ${{ steps.areas.outputs.shortcuts }}
          APPHOST: ${{ steps.areas.outputs.apphost }}
          ACTIONS: ${{ steps.areas.outputs.actions }}
          SETTINGS: ${{ steps.areas.outputs.settings }}
          EXPORTS_VERIFIED: ${{ needs.pushed-exports.outputs.hit == 'true' || needs.action-exports-linux.outputs.verified == 'true' || needs.action-exports.outputs.verified }}
          SETTINGS_VERIFIED: ${{ needs.pushed-exports.outputs.hit == 'true' || needs.settings-exports-linux.outputs.verified == 'true' || needs.action-exports.outputs.settings_verified }}
          RATCHETS: ${{ steps.areas.outputs.ratchets }}
          CLOUD: ${{ steps.areas.outputs.cloud }}
          LOCKS: ${{ steps.areas.outputs.locks }}
          IOSFFI: ${{ steps.areas.outputs.iosffi }}
          FMT: ${{ steps.areas.outputs.fmt }}
          CLIPPY: ${{ steps.areas.outputs.clippy }}
          CLIPPY_CHANGED: ${{ runner.temp }}/changed.txt
          # The clippy gate's build env (cmux-tui-spec.yml), for cargo clippy --fix.
          GHOSTTY_ZIG_SOURCE: ghostty-next
          CMUX_GHOSTTY_SRC: ""
          CMUX_GHOSTTY_VT_ZIG_CPU: baseline
          EXPORTS_DIR: ${{ runner.temp }}/action-exports
          WEBVIEWS_PATCH: ${{ runner.temp }}/webviews-fmt/webviews-fmt.patch
        run: |
          set -euo pipefail
          scripts/cmux-next/base-autofix-repair.sh "$GITHUB_WORKSPACE" | tee "$RUNNER_TEMP/autofix.txt"
          { echo "### Base autofix at ${GITHUB_SHA:0:12}"; echo; sed 's/^/- /' "$RUNNER_TEMP/autofix.txt"; } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit the repairs
        id: commit
        env:
          HEAD_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # --ignore-submodules: ghostty-next, initialized for cargo clippy --fix, may hold build output
          # (zig-pkg/, .zig-cache/); a repair never writes a submodule.
          if [[ -z "$(git status --porcelain --ignore-submodules=all)" ]]; then
            echo "Nothing to repair at ${HEAD_SHA:0:12}." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git add -A
          git commit --quiet -m "chore(next): base autofix at ${HEAD_SHA:0:12}" \
            -m "$(grep '^fixed: ' "$RUNNER_TEMP/autofix.txt" | sed 's/^fixed: /- /')" \
            -m "scripts/cmux-next/base-autofix.sh: $RUN_URL"
          git show --stat --oneline HEAD | sed -n '1,40p' >> "$GITHUB_STEP_SUMMARY"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # The daemon embeds schemas/settings/settings-schema.json and panics at startup on a
      # schema it cannot parse: 8091a040 pushed a "sound_rules" kind cmux-config did not know,
      # and no cmux-tui tree could publish. A regenerated schema is pushed only after
      # cmux-config parses it and its accepts/refuses samples pass.
      - name: The daemon parses the regenerated settings schema
        if: steps.commit.outputs.changed == 'true' && steps.areas.outputs.settings == 'true'
        run: |
          set -euo pipefail
          if git diff --quiet HEAD~1 HEAD -- schemas/settings/settings-schema.json; then
            echo "schemas/settings/settings-schema.json unchanged"; exit 0
          fi
          # cargo's whole output is kept so a stale Cargo.lock is named as such (cargo-locks.py explain).
          log="$RUNNER_TEMP/cmux-config-tests.log"
          if ! (cd cmux-tui && cargo test --locked -p cmux-config 2>&1 | tee "$log" | tail -60); then
            if python3 scripts/cmux-next/cargo-locks.py explain "$log"; then exit 1; fi
            # A test that fails with the base's own schema too is a base red, not this schema's:
            # theme contrast and shader-name reds held every base autofix from 15:20Z on 2026-11-25.
            # The schema is blamed only for failures it adds; a build that runs no test stays a refusal.
            failed() { sed -n 's/^test \(.*\) \.\.\. FAILED$/\1/p' "$1" | sort -u; }
            schema=schemas/settings/settings-schema.json
            cp "$schema" "$RUNNER_TEMP/settings-schema.regenerated.json"
            git show "HEAD~1:$schema" > "$schema"
            (cd cmux-tui && cargo test --locked -p cmux-config > "$RUNNER_TEMP/cmux-config-tests.base.log" 2>&1) || true
            cp "$RUNNER_TEMP/settings-schema.regenerated.json" "$schema"
            new_failures=$(comm -23 <(failed "$log") <(failed "$RUNNER_TEMP/cmux-config-tests.base.log"))
            if [[ -z "$(failed "$log")" || -n "$new_failures" ]]; then
              [[ -n "$new_failures" ]] && printf 'fails only with the regenerated schema: %s\n' $new_failures
              echo "::error::the regenerated schemas/settings/settings-schema.json fails cmux-config's tests (the daemon would not start); not pushing. Teach cmux-tui/crates/cmux-config/src/schema the change first."
              exit 1
            fi
            echo "::warning title=Base autofix::cmux-config tests also fail with the base's own schema (a base red, not this schema's): $(failed "$log" | paste -sd ' ')"
          fi

      # The push token: an App push starts the push workflows (Push identity, above).
      - name: Mint the push token
        id: push-token
        if: steps.commit.outputs.changed == 'true' && vars.CMUX_NEXT_BASE_AUTOFIX == '1'
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.CMUX_PR_AUTOFIX_APP_ID }}
          private-key: ${{ secrets.CMUX_PR_AUTOFIX_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          # contents: write only. The App's installation has no pull-requests permission, and asking for
          # one fails the whole mint: from 6a2706df247 (2026-11-17) every run fell back to GITHUB_TOKEN,
          # whose push feat-cmux-next's required checks refuse (GH013 "2 of 2 required status checks are
          # expected"), so base autofix failed on every run (20:34-21:28Z on 2026-11-20 and before).
          permission-contents: write

      # base-autofix-land.sh opens the pull request for Swift rewrites it cannot compile (as
      # package-deps-heal does). Its own mint, so a missing pull-requests grant on the App costs only
      # that pull request (opened with GITHUB_TOKEN instead), never the push.
      - name: Mint the pull-request token
        id: pr-token
        if: steps.commit.outputs.changed == 'true' && vars.CMUX_NEXT_BASE_AUTOFIX == '1'
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.CMUX_PR_AUTOFIX_APP_ID }}
          private-key: ${{ secrets.CMUX_PR_AUTOFIX_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Push the repairs
        if: steps.commit.outputs.changed == 'true'
        env:
          # The areas again, for the repair on a moved tip (base-autofix-repair.sh).
          GRAPH: ${{ steps.areas.outputs.graph }}
          STRINGS: ${{ steps.areas.outputs.strings }}
          SDK: ${{ steps.areas.outputs.sdk }}
          CAPABILITIES: ${{ steps.areas.outputs.capabilities }}
          SHORTCUTS: ${{ steps.areas.outputs.shortcuts }}
          APPHOST: ${{ steps.areas.outputs.apphost }}
          ACTIONS: ${{ steps.areas.outputs.actions }}
          SETTINGS: ${{ steps.areas.outputs.settings }}
          RATCHETS: ${{ steps.areas.outputs.ratchets }}
          CLOUD: ${{ steps.areas.outputs.cloud }}
          LOCKS: ${{ steps.areas.outputs.locks }}
          IOSFFI: ${{ steps.areas.outputs.iosffi }}
          FMT: ${{ steps.areas.outputs.fmt }}
          CLIPPY: ${{ steps.areas.outputs.clippy }}
          CLIPPY_CHANGED: ${{ runner.temp }}/changed.txt
          # The clippy gate's build env (cmux-tui-spec.yml), for cargo clippy --fix.
          GHOSTTY_ZIG_SOURCE: ghostty-next
          CMUX_GHOSTTY_SRC: ""
          CMUX_GHOSTTY_VT_ZIG_CPU: baseline
          # The checkout keeps no credentials; base-autofix-land.sh hands the token to the push only,
          # never to the repair it runs again on a moved tip.
          TOKEN: ${{ steps.push-token.outputs.token || github.token }}
          # The Swift rewrites' pull request only (gh pr list/create in base-autofix-land.sh).
          PR_TOKEN: ${{ steps.pr-token.outputs.token || github.token }}
          # The compile gate (base-autofix-compile-gate.sh): a repair that changes Swift is pushed only after
          # fleet-compile-check.yml passes its candidate. Like TOKEN, only the push sees it.
          COMPILE_GATE_TOKEN: ${{ github.token }}
          ENABLED: ${{ vars.CMUX_NEXT_BASE_AUTOFIX == '1' }}
          HEAD_SHA: ${{ github.sha }}
          # A taken pack's exports are this commit's own (pushed-exports made_at is the run's commit).
          SETTINGS_MADE_AT: ${{ needs.pushed-exports.outputs.hit == 'true' && needs.pushed-exports.outputs.made_at || needs.settings-exports-linux.outputs.settings_made_at || needs.action-exports.outputs.settings_made_at }}
          ACTIONS_MADE_AT: ${{ needs.pushed-exports.outputs.hit == 'true' && needs.pushed-exports.outputs.made_at || needs.action-exports-linux.outputs.actions_made_at || needs.action-exports.outputs.actions_made_at }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CMUX_BASE_AUTOFIX_REPAIR: scripts/cmux-next/base-autofix-repair.sh
        run: |
          set -euo pipefail
          if [[ "$ENABLED" != true ]]; then
            echo "Dry run (CMUX_NEXT_BASE_AUTOFIX is not 1): would push $(git rev-parse --short HEAD) to feat-cmux-next." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "::add-mask::$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          remote="https://github.com/$GITHUB_REPOSITORY.git"
          # Lands the repair on the newest tip file by file (base-autofix-push.sh): a file whose input areas
          # the tip changed, or that a newer commit wrote, waits (with its export and what is built from it).
          # A held file this job makes itself (the CI target graph, say) is made again on the new tip and
          # pushed, at most three rounds; a held Mac export waits for the next run, and the run fails, which
          # keeps it in the next run's "since". The settings and action exports are judged from the commit
          # the Mac job made them at.
          scripts/cmux-next/base-autofix-land.sh "$remote" feat-cmux-next "$HEAD_SHA" "$SETTINGS_MADE_AT" "$ACTIONS_MADE_AT" 2>&1 \
            | tee -a "$GITHUB_STEP_SUMMARY"

      # A GITHUB_TOKEN push (no App token) started no workflow: start the bot head's cmux-tui
      # artifacts run (scripts/cmux-next/publish-bot-head-tree.sh: nothing when the head has a run;
      # it never fails this job).
      - name: Start the cmux-tui publish of the bot head
        if: ${{ !cancelled() && steps.commit.outputs.changed == 'true' && vars.CMUX_NEXT_BASE_AUTOFIX == '1' && steps.push-token.outputs.token == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/cmux-next/publish-bot-head-tree.sh feat-cmux-next 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

      # A green run moves the next run's "since" past its changes: when its own Mac job made the exports
      # and the settings area is on, it fails when the settings exports are still stale for the sources
      # it had, so the next run makes them again. A run that left its Mac exports to another run
      # (mac-exports-deferred) skips this and stays green; base-autofix-since.sh passes over it anyway.
      - name: Settings exports current after landing
        if: success() && (needs.action-exports.result == 'success' || needs.pushed-exports.outputs.hit == 'true') && steps.areas.outputs.settings == 'true' && vars.CMUX_NEXT_BASE_AUTOFIX == '1'
        env:
          HEAD_SHA: ${{ github.sha }}
          SETTINGS_MADE_AT: ${{ needs.pushed-exports.outputs.hit == 'true' && needs.pushed-exports.outputs.made_at || needs.settings-exports-linux.outputs.settings_made_at || needs.action-exports.outputs.settings_made_at }}
          EXPORTS_DIR: ${{ runner.temp }}/action-exports
        run: |
          set -euo pipefail
          scripts/cmux-next/base-autofix-settings-landed.sh "https://github.com/$GITHUB_REPOSITORY.git" feat-cmux-next "$HEAD_SHA" "$SETTINGS_MADE_AT" "$EXPORTS_DIR" 2>&1 \
            | tee -a "$GITHUB_STEP_SUMMARY"

  # When the ghostty gitlink moves, pins its GhosttyKit checksum
  # (scripts/ghosttykit-checksums.txt) from our own published release only
  # (scripts/cmux-next/ghosttykit-checksum.sh), never from a local build. With no
  # release yet for that commit it dispatches build-ghosttykit.yml on
  # feat-cmux-next and waits for the publish. Its own concurrency group never
  # cancels a wait in progress; a queued run is replaced by the newest push.
  ghosttykit-checksum:
    name: pin the GhosttyKit checksum
    needs: window
    if: >-
      ${{ needs.window.outputs.run == 'true' && github.repository == 'manaflow-ai/cmux' && !(github.event_name == 'push' && github.event.head_commit.author.name == 'github-actions[bot]' && (startsWith(github.event.head_commit.message, 'chore(next): base autofix at ') || startsWith(github.event.head_commit.message, 'chore(next): pin GhosttyKit for ghostty '))) }}
    concurrency:
      group: cmux-next-ghosttykit-checksum
      cancel-in-progress: false
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.CI_REPAIR_SKIP_FLEET != '1' && 'cmux-gcp-repair-jit-x64' || fromJSON(vars.RUNNER_POOLS).linux_4 }} # ephemeral-required: holds a contents write token for feat-cmux-next; ephemeral Blacksmith VM
    timeout-minutes: 100
    permissions:
      actions: write # dispatch build-ghosttykit.yml and read its runs
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Wait for the GhosttyKit release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Look the release up without writing; the push step pins it.
          check() { scripts/cmux-next/ghosttykit-checksum.sh "$GITHUB_WORKSPACE" > "$RUNNER_TEMP/pin.txt"; }
          rc=0; check || rc=$?
          git checkout --quiet -- scripts/ghosttykit-checksums.txt
          cat "$RUNNER_TEMP/pin.txt"
          case "$rc" in
            0) grep -q '^ok:' "$RUNNER_TEMP/pin.txt" && { echo "pin=false" >> "$GITHUB_OUTPUT"; exit 0; }
               echo "pin=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
            3) ;;
            *) exit "$rc" ;;
          esac
          active="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow build-ghosttykit.yml --branch feat-cmux-next \
            --json status --jq '[.[] | select(.status != "completed")] | length')"
          if [[ "$active" == 0 ]]; then
            gh workflow run build-ghosttykit.yml --repo "$GITHUB_REPOSITORY" --ref feat-cmux-next
            echo "Dispatched build-ghosttykit.yml on feat-cmux-next." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "A build-ghosttykit.yml run on feat-cmux-next is already active; waiting for it." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          for _ in $(seq 1 45); do
            sleep 120
            rc=0; check || rc=$?
            git checkout --quiet -- scripts/ghosttykit-checksums.txt
            case "$rc" in
              0) cat "$RUNNER_TEMP/pin.txt"; echo "pin=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
              3) ;;
              *) cat "$RUNNER_TEMP/pin.txt"; exit "$rc" ;;
            esac
          done
          echo "::error::no GhosttyKit release for this ghostty commit after 90 minutes; see build-ghosttykit.yml"
          exit 1

      # The push token: an App push starts the push workflows (Push identity, above).
      - name: Mint the push token
        id: push-token
        if: steps.release.outputs.pin == 'true' && vars.CMUX_NEXT_BASE_AUTOFIX == '1'
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.CMUX_PR_AUTOFIX_APP_ID }}
          private-key: ${{ secrets.CMUX_PR_AUTOFIX_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Pin and push the checksum
        if: steps.release.outputs.pin == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TOKEN: ${{ steps.push-token.outputs.token || github.token }}
          ENABLED: ${{ vars.CMUX_NEXT_BASE_AUTOFIX == '1' }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          auth="$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          remote="https://github.com/$GITHUB_REPOSITORY.git"
          with_auth=(env GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.https://github.com/.extraheader" GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth")
          # The line only appends, so a moved feat-cmux-next is re-read and the
          # pin re-applied on top of it.
          for attempt in 1 2 3 4 5; do
            git fetch --quiet --depth=1 origin feat-cmux-next
            git reset --quiet --hard FETCH_HEAD
            rc=0; out="$(scripts/cmux-next/ghosttykit-checksum.sh "$GITHUB_WORKSPACE")" || rc=$?
            if [[ "$rc" == 3 ]]; then
              echo "feat-cmux-next now points ghostty elsewhere, with no release yet; that push's run pins it." | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            (( rc == 0 )) || { echo "$out"; exit "$rc"; }
            echo "$out"
            if [[ "$out" == ok:* ]]; then
              echo "Already pinned on feat-cmux-next $(git rev-parse --short HEAD)." | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            git commit --quiet -am "chore(next): pin GhosttyKit for ghostty $(git ls-tree HEAD ghostty | awk '{print substr($3, 1, 12)}')" \
              -m "${out#fixed: }" -m "scripts/cmux-next/ghosttykit-checksum.sh: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            git show --stat --oneline HEAD | sed -n '1,10p' >> "$GITHUB_STEP_SUMMARY"
            if [[ "$ENABLED" != true ]]; then
              echo "Dry run (CMUX_NEXT_BASE_AUTOFIX is not 1): would push $(git rev-parse --short HEAD) to feat-cmux-next." | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if "${with_auth[@]}" git push --quiet "$remote" HEAD:refs/heads/feat-cmux-next; then
              echo "Pushed $(git rev-parse --short HEAD) to feat-cmux-next." | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "feat-cmux-next moved (attempt $attempt); re-applying on the new tip."
          done
          # No red: each of those pushes started a run, and the newest pins it.
          echo "::warning title=GhosttyKit pin::feat-cmux-next kept moving; the next run pins it."
          exit 0

      # A GITHUB_TOKEN push (no App token) started no workflow: start the bot head's cmux-tui
      # artifacts run (scripts/cmux-next/publish-bot-head-tree.sh: nothing when the head has a run;
      # it never fails this job).
      - name: Start the cmux-tui publish of the bot head
        if: ${{ !cancelled() && steps.release.outputs.pin == 'true' && vars.CMUX_NEXT_BASE_AUTOFIX == '1' && steps.push-token.outputs.token == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/cmux-next/publish-bot-head-tree.sh feat-cmux-next 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
