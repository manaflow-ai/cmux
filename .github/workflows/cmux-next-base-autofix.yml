name: cmux-next base autofix

# After each feat-cmux-next push, repairs the base's mechanical reds in one
# commit on top of it, so no pull request has to carry them
# (scripts/cmux-next/base-autofix.sh): the CI target graph, regenerated from
# `swift package dump-package` in a pinned Swift 6.2 Linux container (the Mac
# generated-files job's tools), every React page's generated/strings.json
# (webviews/scripts/pages/gen-strings.mjs), the SDK wire layers
# (cmux-tui/bindings/codegen/generate.py), the docs shortcuts copy of the
# action catalog export (web/scripts/export-docs-shortcuts.ts), the app-host
# generated files (cmux-tui/crates/cmux-app-host/tools/gen-cmux-global.ts), the namespace
# ratchet's stale rows (scripts/lint-namespace-types-ratchet.txt), the cloud
# wire clients from the committed cloud catalog (backend/packages/protocol),
# webviews formatting (vp fmt in the read-only webviews-fmt job), and cargo fmt
# in cmux-tui and the OptChat crates. Each
# runs only when its inputs changed since the last successful run (actions:
# read lists it); a repair that cannot land fails the run. A frozen path
# (scripts/cmux-next/base-autofix-frozen.txt, including every workflow file)
# is reported and never written; missing cmux-tui tree inputs are reported
# (their fix edits cmux-tui-artifacts.yml); the app FFI pin stays with
# app-ffi-release.yml's app-ffi-repin pull request. The action exports
# (plans/cmux-next/action-surfaces.json, actions.md, links.json) need a Mac
# swift test: the action-exports job regenerates them on a Mac
# (scripts/cmux-next/regenerate-action-exports.sh) and autofix copies them in
# before it rewrites the docs shortcuts from them. The settings exports
# (schemas/settings/settings-schema.json, docs/mdm, and the source stamp
# schemas/settings-export/settings-schema.sources.sha256) need one too: the
# same job regenerates them (scripts/cmux-next/regenerate-settings-exports.sh)
# when CmuxNextSettings or an export changed, and autofix copies them in before
# it rewrites the defaults snapshot from them.
# A separate job pins scripts/ghosttykit-checksums.txt when the ghostty
# gitlink moves, from our own published GhosttyKit release (waiting for
# build-ghosttykit.yml when there is none yet).
#
# Its own push trigger: feat-cmux-next push CI is the Swift app build only
# (cx-g34i), so cmux-next's push run no longer regenerates anything, and its
# push paths never included cmux-tui.
#
# Push identity: github-actions[bot] through this job's GITHUB_TOKEN
# (contents: write; actions: read only to find the last successful run). No ruleset or branch protection applies to
# feat-cmux-next (2026-10-09). GITHUB_TOKEN cannot push workflow files, and its
# pushes start no workflow: the repair commit is verified by the next pull
# request's checks, and the bot cannot loop.
#
# Dry run until the repo variable CMUX_NEXT_BASE_AUTOFIX is 1: it repairs and
# commits locally, and the summary shows what it would push.
on:
  push:
    branches: [feat-cmux-next]
    paths:
      - cmux-tui/**
      - Native/OptChat/**
      - Packages/**
      - webviews/src/**
      - webviews/scripts/pages/**
      - webviews/test/**
      - plans/cmux-next/action-surfaces.json
      - plans/cmux-next/actions.md
      - plans/cmux-next/links.json
      - scripts/cmux-next/regenerate-action-exports.sh
      - scripts/cmux-next/regenerate-settings-exports.sh
      - schemas/settings-export/**
      - docs/mdm/**
      - scripts/ci/defaults_guard.py
      - web/scripts/export-docs-shortcuts.ts
      # The app-host generated files (base-autofix.sh --app-host).
      - cmux-tui/spec/resource-operations-v2.json
      - first-party-apps/**
      - ios/cmux/**
      - scripts/lint-ios-package-conventions.sh
      - scripts/lint_swift_namespaces.py
      - scripts/lint-namespace-types-ratchet.txt
      - backend/catalog/cloud-operations.json
      - backend/packages/protocol/scripts/export-client.ts
      - backend/packages/protocol/scripts/export-rust-client.ts
      - backend/packages/protocol/src/automation-caps.ts
      - schemas/settings/**
      - scripts/cmux-next/base-autofix.sh
      - scripts/cmux-next/autofix-areas.sh
      - scripts/cmux-next/pr-autofix-apply.sh
      - scripts/cmux-next/base-autofix-frozen.txt
      - scripts/cmux-next/ci-target-graph.py
      - scripts/ci/check_cmux_tui_tree_inputs.py
      - scripts/cmux-next/cmux-tui-tree-inputs.txt
      - .github/workflows/cmux-next-base-autofix.yml
      # The GhosttyKit checksum pin (ghosttykit-checksum below).
      - ghostty
      - scripts/ghosttykit-checksums.txt
      - scripts/cmux-next/ghosttykit-checksum.sh
      - scripts/download-prebuilt-ghosttykit.sh

permissions: {}

jobs:
  # Whether the Mac action-exports job runs: the paths changed since the last
  # successful run, as autofix's Changed areas step computes them.
  action-areas:
    name: action export areas
    if: github.repository == 'manaflow-ai/cmux'
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || 'blacksmith-2vcpu-ubuntu-2404' }}
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      actions: ${{ steps.areas.outputs.actions }}
      settings: ${{ steps.areas.outputs.settings }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Changed areas
        id: areas
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          since="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/cmux-next-base-autofix.yml/runs?branch=feat-cmux-next&event=push&status=success&per_page=1" --jq '.workflow_runs[0].head_sha // ""' 2>/dev/null || true)"
          if [[ -z "$since" ]] || ! git fetch --quiet --depth=1 origin "$since"; then
            scripts/cmux-next/autofix-areas.sh --all | grep -E '^(actions|settings)=' | tee -a "$GITHUB_OUTPUT"
          else
            git diff --name-only "$since" HEAD | scripts/cmux-next/autofix-areas.sh | grep -E '^(actions|settings)=' | tee -a "$GITHUB_OUTPUT"
          fi

  # Regenerates the action exports and the settings exports on a Mac with a
  # read-only token and hands them to autofix as the action-exports artifact
  # (files at their repository paths).
  action-exports:
    name: action exports (Mac)
    needs: action-areas
    if: needs.action-areas.outputs.actions == 'true' || needs.action-areas.outputs.settings == 'true'
    # A running regeneration finishes; a newer push replaces only a pending one. Cancelling a running
    # one meant that with merges minutes apart no Mac export ever finished, and the settings exports
    # stayed stale on feat-cmux-next (2026-10-19: 8 runs in a row cancelled, defaults-snapshot red on
    # every PR).
    concurrency:
      group: cmux-next-base-autofix-action-exports
      cancel-in-progress: false
    # The exports need a logged-in session, not the console gui token, so once the
    # fleet carries glaeda#1530's session label (vars.CI_SESSION_LABEL is 1) this
    # takes it and runs beside a console GUI job; until then the gui label.
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || vars.CI_PR_POOL_OWNED == '1' && (vars.CI_SESSION_LABEL == '1' && 'glaeda-session-std-xcode-26.6' || 'glaeda-gui-std-xcode-26.6') || vars.MACOS_RUNNER_26 || 'blacksmith-6vcpu-macos-26' }}
    timeout-minutes: 40
    permissions:
      contents: read
    outputs:
      exports: ${{ steps.actions.outputs.exports == 'true' || steps.settings.outputs.exports == 'true' }}
      # The exports on this tree are current: regenerated, or already fresh.
      # Skipped (that area did not change) counts as current.
      verified: ${{ steps.actions.outcome != 'failure' }}
      settings_verified: ${{ steps.settings.outcome != 'failure' }}
    env:
      CMUX_CI_XCODE_APP: ${{ vars.CMUX_CI_XCODE_APP_MACOS_26 }}
      CMUX_CI_REQUIRED_MACOS_SDK_MAJOR: "26"
    steps:
      - name: Clear stale git locks (self-hosted reused workspace)
        shell: bash
        run: rm -f "${GITHUB_WORKSPACE:-$PWD}/.git/index.lock" 2>/dev/null || true

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: false

      - name: Drop stale submodule checkouts (self-hosted reused workspace)
        run: scripts/ci/reset-stale-submodules.sh

      - name: Select Xcode
        run: ./scripts/select-ci-xcode.sh

      - name: Set up pinned cmux-tui Rust (sidebar layout reducer)
        uses: ./.github/actions/setup-cmux-tui-rust

      # The package's resources include the web bundles (cmux-next.yml's
      # generated-files job builds them the same way).
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"

      - name: Give this job its own bun
        run: scripts/cmux-next/private-bun.sh

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.11.1"

      - name: Source key of the web bundles
        id: web-bundle-key
        run: echo "key=$(python3 scripts/cmux-next/web-bundle-key.py . --source)" >> "$GITHUB_OUTPUT"

      - name: Restore the web bundles built for this source key
        id: web-bundle-cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: web-bundles-out
          key: cmux-next-web-bundles-v1-${{ steps.web-bundle-key.outputs.key }}

      - name: Install the restored web bundles
        if: steps.web-bundle-cache.outputs.cache-hit == 'true'
        run: scripts/cmux-next/build-web-bundles.sh --from web-bundles-out

      - name: Build the web bundles
        run: scripts/cmux-next/build-web-bundles.sh

      - name: Regenerate the action exports
        id: actions
        if: needs.action-areas.outputs.actions == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          scripts/cmux-next/regenerate-action-exports.sh "$RUNNER_TEMP/action-exports" | tee "$RUNNER_TEMP/action-exports.txt"
          if grep -q '^regenerated: ' "$RUNNER_TEMP/action-exports.txt"; then
            echo "exports=true" >> "$GITHUB_OUTPUT"
          fi

      # The settings exports and their source stamp, into the same artifact.
      - name: Regenerate the settings exports
        id: settings
        if: needs.action-areas.outputs.settings == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          scripts/cmux-next/regenerate-settings-exports.sh "$RUNNER_TEMP/action-exports" | tee "$RUNNER_TEMP/settings-exports.txt"
          if grep -q '^regenerated: ' "$RUNNER_TEMP/settings-exports.txt"; then
            echo "exports=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.actions.outputs.exports == 'true' || steps.settings.outputs.exports == 'true'
        with:
          name: action-exports
          path: ${{ runner.temp }}/action-exports
          if-no-files-found: error
          retention-days: 1

      # A failed regeneration must not end in a successful run: the next run
      # diffs from the last successful one, and would drop this change.
      - name: Fail when a regeneration failed
        if: steps.actions.outcome == 'failure' || steps.settings.outcome == 'failure'
        run: |
          echo "::error::regenerating the exports failed (actions: ${{ steps.actions.outcome }}, settings: ${{ steps.settings.outcome }}); the repairs that follow them wait"
          exit 1

  # `vp fmt` needs webviews' installed packages, so it runs here with a
  # read-only token (installed without lifecycle scripts) and hands its diff to
  # the autofix job as a patch, which applies only webviews paths.
  webviews-fmt:
    name: webviews vp fmt
    if: github.repository == 'manaflow-ai/cmux'
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || 'blacksmith-2vcpu-ubuntu-2404' }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"

      # `vp` runs on Node and needs ^22.18 or ^24.11.
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.11.1"

      - name: vp fmt
        working-directory: webviews
        run: |
          set -euo pipefail
          bun install --frozen-lockfile --ignore-scripts
          node_modules/.bin/vp fmt
          git diff --binary -- . > "$RUNNER_TEMP/webviews-fmt.patch"
          git diff --stat -- . | tail -1

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: webviews-fmt-patch
          path: ${{ runner.temp }}/webviews-fmt.patch
          if-no-files-found: error
          retention-days: 1

  autofix:
    name: autofix feat-cmux-next
    # The other repairs still run when the webviews formatting or the Mac
    # action exports job fails or is skipped.
    needs: [webviews-fmt, action-exports]
    if: ${{ !cancelled() && github.repository == 'manaflow-ai/cmux' }}
    # A running repair finishes and lands on whatever feat-cmux-next is by then (the push step re-applies
    # it); a newer push replaces only a pending run. The next run diffs from the last successful one.
    concurrency:
      group: cmux-next-base-autofix
      cancel-in-progress: false
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || 'blacksmith-4vcpu-ubuntu-2404' }} # ephemeral-required: holds a contents write token for feat-cmux-next; ephemeral Blacksmith VM
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # What changed since the last successful run decides the repairs: a run
      # cancelled by a newer push, or one whose repair could not land, leaves
      # its changes to the next run instead of losing them. No earlier success,
      # or a change to the bot itself, runs them all.
      - name: Changed areas
        id: areas
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          since="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/cmux-next-base-autofix.yml/runs?branch=feat-cmux-next&event=push&status=success&per_page=1" --jq '.workflow_runs[0].head_sha // ""' 2>/dev/null || true)"
          # scripts/cmux-next/autofix-areas.sh maps the changed paths to repairs.
          if [[ -z "$since" ]] || ! git fetch --quiet --depth=1 origin "$since"; then
            echo "No successful run to diff from; running every repair."
            scripts/cmux-next/autofix-areas.sh --all | tee -a "$GITHUB_OUTPUT"
          else
            echo "Changes since the last successful run at ${since:0:12}."
            git diff --name-only "$since" HEAD | scripts/cmux-next/autofix-areas.sh | tee -a "$GITHUB_OUTPUT"
          fi

      # dump-package needs the Swift 6.2 tools (ci-target-graph.py). The whole
      # checkout is mounted at its own path, read-only: the manifest's local
      # package dependencies resolve outside the package directory.
      - name: Dump the CmuxNext package manifest
        if: steps.areas.outputs.graph == 'true'
        run: |
          set -euo pipefail
          docker run --rm -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE:ro" -w "$GITHUB_WORKSPACE/Packages/macOS/CmuxNext" \
            docker.io/library/swift@sha256:eccc7a97f9b9881d9659e2e788081fd7675f86d39793b51200bfb178398b3784 \
            swift package dump-package > "$RUNNER_TEMP/package-dump.json"

      - name: Setup Node
        if: steps.areas.outputs.strings == 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.11.1"

      - name: Setup Bun
        if: steps.areas.outputs.shortcuts == 'true' || steps.areas.outputs.apphost == 'true' || needs.action-exports.outputs.exports == 'true' || steps.areas.outputs.cloud == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"

      - name: Set up pinned cmux-tui Rust
        if: steps.areas.outputs.fmt == 'true'
        uses: ./.github/actions/setup-cmux-tui-rust

      - name: Download the webviews formatting patch
        if: needs.webviews-fmt.result == 'success'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: webviews-fmt-patch
          path: ${{ runner.temp }}/webviews-fmt

      - name: Download the regenerated action exports
        if: needs.action-exports.outputs.exports == 'true'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: action-exports
          path: ${{ runner.temp }}/action-exports

      - name: Repair
        env:
          GRAPH: ${{ steps.areas.outputs.graph }}
          STRINGS: ${{ steps.areas.outputs.strings }}
          SDK: ${{ steps.areas.outputs.sdk }}
          SHORTCUTS: ${{ steps.areas.outputs.shortcuts }}
          APPHOST: ${{ steps.areas.outputs.apphost }}
          ACTIONS: ${{ steps.areas.outputs.actions }}
          SETTINGS: ${{ steps.areas.outputs.settings }}
          EXPORTS_VERIFIED: ${{ needs.action-exports.outputs.verified }}
          SETTINGS_VERIFIED: ${{ needs.action-exports.outputs.settings_verified }}
          RATCHETS: ${{ steps.areas.outputs.ratchets }}
          CLOUD: ${{ steps.areas.outputs.cloud }}
          FMT: ${{ steps.areas.outputs.fmt }}
        run: |
          set -euo pipefail
          args=()
          # Regenerated action and settings exports: the docs shortcuts, app-host
          # files and defaults snapshot follow them.
          if [[ -d "$RUNNER_TEMP/action-exports" ]]; then
            args+=(--generated "$RUNNER_TEMP/action-exports")
            SHORTCUTS=true APPHOST=true
          fi
          [[ "$GRAPH" == true ]] && args+=(--package-dump "$RUNNER_TEMP/package-dump.json")
          [[ "$STRINGS" == true ]] && args+=(--strings)
          [[ "$SDK" == true ]] && args+=(--sdk)
          [[ "$SHORTCUTS" == true ]] && args+=(--docs-shortcuts)
          [[ "$APPHOST" == true ]] && args+=(--app-host)
          # Dependency order: the shortcuts and app-host files follow the action
          # exports, so they wait while the exports' inputs changed unverified.
          [[ "$ACTIONS" == true && "$EXPORTS_VERIFIED" != true ]] && args+=(--unverified-exports)
          # The defaults snapshot follows the settings exports the same way.
          [[ "$SETTINGS" == true && "$SETTINGS_VERIFIED" != true ]] && args+=(--unverified-settings-exports)
          [[ "$RATCHETS" == true ]] && args+=(--ratchets)
          [[ "$CLOUD" == true ]] && args+=(--cloud-clients)
          patch="$RUNNER_TEMP/webviews-fmt/webviews-fmt.patch"
          [[ -s "$patch" ]] && args+=(--webviews-fmt-patch "$patch")
          [[ "$FMT" == true ]] || args+=(--no-fmt)
          scripts/cmux-next/base-autofix.sh ${args[@]+"${args[@]}"} "$GITHUB_WORKSPACE" | tee "$RUNNER_TEMP/autofix.txt"
          { echo "### Base autofix at ${GITHUB_SHA:0:12}"; echo; sed 's/^/- /' "$RUNNER_TEMP/autofix.txt"; } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit the repairs
        id: commit
        env:
          HEAD_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "Nothing to repair at ${HEAD_SHA:0:12}." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit --quiet -m "chore(next): base autofix at ${HEAD_SHA:0:12}" \
            -m "$(grep '^fixed: ' "$RUNNER_TEMP/autofix.txt" | sed 's/^fixed: /- /')" \
            -m "scripts/cmux-next/base-autofix.sh: $RUN_URL"
          git show --stat --oneline HEAD | sed -n '1,40p' >> "$GITHUB_STEP_SUMMARY"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Push the repairs
        if: steps.commit.outputs.changed == 'true'
        env:
          # The checkout keeps no credentials; the token is used only here.
          TOKEN: ${{ github.token }}
          ENABLED: ${{ vars.CMUX_NEXT_BASE_AUTOFIX == '1' }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$ENABLED" != true ]]; then
            echo "Dry run (CMUX_NEXT_BASE_AUTOFIX is not 1): would push $(git rev-parse --short HEAD) to feat-cmux-next." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          auth="$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          remote="https://github.com/$GITHUB_REPOSITORY.git"
          with_auth=(env GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.https://github.com/.extraheader" GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth")
          # The repair is one commit on HEAD_SHA. When feat-cmux-next has moved, it is re-applied on the
          # new tip only if nothing in between touched any area this repair covers: then its inputs are
          # unchanged and the regenerated files are exactly right at the tip. Otherwise (a revert of a new
          # setting, say) the copy from HEAD_SHA could be wrong there, so the run stops and the newer
          # push's run regenerates it; that also keeps a late re-run from landing old output. A conflict
          # fails the run too, which keeps it out of the next run's "since".
          # Each push is a plain push: it fails rather than overwrite a commit pushed meanwhile.
          repair="$(git rev-parse HEAD)"
          # The areas whose inputs changed (autofix-areas.sh reads input paths).
          areas() { scripts/cmux-next/autofix-areas.sh | sed -n 's/=true$//p' | sort; }
          # The areas that build each file the repair wrote (base-autofix.sh's outputs). A file built from
          # several areas names them all; one this list doesn't know is "unknown", which never re-applies.
          output_areas() {
            local path
            while IFS= read -r path; do
              case "$path" in
                Packages/macOS/CmuxNext/ci-target-graph.json) echo graph ;;
                */generated/strings.json) echo strings; echo webviews ;;
                cmux-tui/bindings/*) echo sdk ;;
                plans/cmux-next/action-surfaces.json|plans/cmux-next/actions.md|plans/cmux-next/links.json)
                  echo actions; echo shortcuts; echo apphost ;;
                schemas/settings/settings-schema.json|schemas/settings-export/*|docs/mdm/*) echo settings ;;
                schemas/defaults/cmux-next.json) echo settings; echo actions ;;
                web/data/cmux-shortcuts.generated.json) echo shortcuts; echo actions ;;
                cmux-tui/crates/cmux-app-host/generated/*) echo apphost; echo actions ;;
                scripts/lint-namespace-types-ratchet.txt) echo ratchets ;;
                clients/ts/cloud/*|cmux-tui/crates/cmux-cloud-wire/src/generated/*) echo cloud ;;
                webviews/*) echo webviews ;;
                cmux-tui/*|Native/OptChat/*) echo fmt ;;
                *) echo "unknown:$path" ;;
              esac
            done | sort -u
          }
          repaired="$(git diff --name-only "$HEAD_SHA" "$repair" | output_areas)"
          base="$HEAD_SHA"
          for attempt in 1 2 3 4 5; do
            if "${with_auth[@]}" git push --quiet "$remote" HEAD:refs/heads/feat-cmux-next; then
              echo "Pushed $(git rev-parse --short HEAD) to feat-cmux-next (attempt $attempt)." | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            "${with_auth[@]}" git fetch --quiet --depth=1 "$remote" refs/heads/feat-cmux-next
            tip="$(git rev-parse FETCH_HEAD)"
            if [[ "$tip" == "$base" ]]; then
              echo "::error::the push was rejected but feat-cmux-next did not move; see the push output above." | tee -a "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            unknown="$(grep '^unknown:' <<<"$repaired" | sed 's/^unknown://' | tr '\n' ' ' || true)"
            if [[ -n "${unknown// }" ]]; then
              echo "::error::feat-cmux-next moved to ${tip:0:12}, and no area is known to build ${unknown% }; the newer run repairs it." | tee -a "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            overlap="$(comm -12 <(git diff --name-only "$HEAD_SHA" "$tip" | areas) <(echo "$repaired") | tr '\n' ' ')"
            if [[ -n "${overlap// }" ]]; then
              echo "::error::feat-cmux-next ${tip:0:12} changed this repair's inputs since ${HEAD_SHA:0:12} (${overlap% }); the newer run repairs it." | tee -a "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            echo "feat-cmux-next moved to ${tip:0:12} (attempt $attempt) without touching this repair's areas; re-applying it."
            git reset --quiet --hard "$tip"
            base="$tip"
            if ! git cherry-pick --allow-empty --keep-redundant-commits "$repair" >/dev/null; then
              git cherry-pick --abort || true
              echo "::error::the repair conflicts with feat-cmux-next ${tip:0:12}; the next run repairs it." | tee -a "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            if git diff --quiet HEAD~1 HEAD; then
              echo "feat-cmux-next already has these repairs." | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          done
          echo "::error::feat-cmux-next kept moving; the next run repairs it." | tee -a "$GITHUB_STEP_SUMMARY"
          exit 1

  # When the ghostty gitlink moves, pins its GhosttyKit checksum
  # (scripts/ghosttykit-checksums.txt) from our own published release only
  # (scripts/cmux-next/ghosttykit-checksum.sh), never from a local build. With no
  # release yet for that commit it dispatches build-ghosttykit.yml on
  # feat-cmux-next and waits for the publish. Its own concurrency group never
  # cancels a wait in progress; a queued run is replaced by the newest push.
  ghosttykit-checksum:
    name: pin the GhosttyKit checksum
    if: github.repository == 'manaflow-ai/cmux'
    concurrency:
      group: cmux-next-ghosttykit-checksum
      cancel-in-progress: false
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || 'blacksmith-2vcpu-ubuntu-2404' }} # ephemeral-required: holds a contents write token for feat-cmux-next; ephemeral Blacksmith VM
    timeout-minutes: 100
    permissions:
      actions: write # dispatch build-ghosttykit.yml and read its runs
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Wait for the GhosttyKit release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Look the release up without writing; the push step pins it.
          check() { scripts/cmux-next/ghosttykit-checksum.sh "$GITHUB_WORKSPACE" > "$RUNNER_TEMP/pin.txt"; }
          rc=0; check || rc=$?
          git checkout --quiet -- scripts/ghosttykit-checksums.txt
          cat "$RUNNER_TEMP/pin.txt"
          case "$rc" in
            0) grep -q '^ok:' "$RUNNER_TEMP/pin.txt" && { echo "pin=false" >> "$GITHUB_OUTPUT"; exit 0; }
               echo "pin=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
            3) ;;
            *) exit "$rc" ;;
          esac
          active="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow build-ghosttykit.yml --branch feat-cmux-next \
            --json status --jq '[.[] | select(.status != "completed")] | length')"
          if [[ "$active" == 0 ]]; then
            gh workflow run build-ghosttykit.yml --repo "$GITHUB_REPOSITORY" --ref feat-cmux-next
            echo "Dispatched build-ghosttykit.yml on feat-cmux-next." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "A build-ghosttykit.yml run on feat-cmux-next is already active; waiting for it." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          for _ in $(seq 1 45); do
            sleep 120
            rc=0; check || rc=$?
            git checkout --quiet -- scripts/ghosttykit-checksums.txt
            case "$rc" in
              0) cat "$RUNNER_TEMP/pin.txt"; echo "pin=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
              3) ;;
              *) cat "$RUNNER_TEMP/pin.txt"; exit "$rc" ;;
            esac
          done
          echo "::error::no GhosttyKit release for this ghostty commit after 90 minutes; see build-ghosttykit.yml"
          exit 1

      - name: Pin and push the checksum
        if: steps.release.outputs.pin == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TOKEN: ${{ github.token }}
          ENABLED: ${{ vars.CMUX_NEXT_BASE_AUTOFIX == '1' }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          auth="$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          remote="https://github.com/$GITHUB_REPOSITORY.git"
          with_auth=(env GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.https://github.com/.extraheader" GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth")
          # The line only appends, so a moved feat-cmux-next is re-read and the
          # pin re-applied on top of it.
          for attempt in 1 2 3 4 5; do
            git fetch --quiet --depth=1 origin feat-cmux-next
            git reset --quiet --hard FETCH_HEAD
            rc=0; out="$(scripts/cmux-next/ghosttykit-checksum.sh "$GITHUB_WORKSPACE")" || rc=$?
            if [[ "$rc" == 3 ]]; then
              echo "feat-cmux-next now points ghostty elsewhere, with no release yet; that push's run pins it." | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            (( rc == 0 )) || { echo "$out"; exit "$rc"; }
            echo "$out"
            if [[ "$out" == ok:* ]]; then
              echo "Already pinned on feat-cmux-next $(git rev-parse --short HEAD)." | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            git commit --quiet -am "chore(next): pin GhosttyKit for ghostty $(git ls-tree HEAD ghostty | awk '{print substr($3, 1, 12)}')" \
              -m "${out#fixed: }" -m "scripts/cmux-next/ghosttykit-checksum.sh: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            git show --stat --oneline HEAD | sed -n '1,10p' >> "$GITHUB_STEP_SUMMARY"
            if [[ "$ENABLED" != true ]]; then
              echo "Dry run (CMUX_NEXT_BASE_AUTOFIX is not 1): would push $(git rev-parse --short HEAD) to feat-cmux-next." | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if "${with_auth[@]}" git push --quiet "$remote" HEAD:refs/heads/feat-cmux-next; then
              echo "Pushed $(git rev-parse --short HEAD) to feat-cmux-next." | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "feat-cmux-next moved (attempt $attempt); re-applying on the new tip."
          done
          echo "::error::feat-cmux-next kept moving; the next run pins it."
          exit 1
