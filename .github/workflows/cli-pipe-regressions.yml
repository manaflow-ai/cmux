name: CLI pipe regressions

on:
  workflow_call:
    inputs:
      # The pool (and, when it differs from the pull-request lane's, the
      # Xcode) ci.yml's `changes` job chose for this pull request run with
      # scripts/ci/pr_runner_pool.py. Empty, which is every other event and
      # every caller that predates it, keeps the MACOS_RUNNER_PR route.
      pr_runner:
        required: false
        default: ""
        type: string
      # Set only when pr_runner is persistent (an owned Mac pool): the
      # Blacksmith pool on the same Xcode that a re-run of failed jobs takes,
      # because such a re-run reuses attempt 1's pick (pr_runner_pool.py).
      pr_retry_runner:
        required: false
        default: ""
        type: string
      pr_xcode_app:
        required: false
        default: ""
        type: string
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cli-pipes-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cli-pipe-regressions:
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && (startsWith(inputs.pr_runner, 'blacksmith-') && inputs.pr_runner || 'blacksmith-6vcpu-macos-15') || github.event_name == 'pull_request' && (github.run_attempt > 1 && inputs.pr_retry_runner || inputs.pr_runner || vars.MACOS_RUNNER_PR || 'blacksmith-6vcpu-macos-15') || vars.CI_PAID_MACOS_OVERFLOW == '1' && vars.MACOS_RUNNER_15 || 'blacksmith-6vcpu-macos-15') }}
    timeout-minutes: 30
    env:
      CMUX_CI_XCODE_APP: ${{ github.event_name == 'pull_request' && (inputs.pr_xcode_app || github.event.pull_request.head.repo.full_name == github.repository && vars.CMUX_CI_XCODE_APP_PR || vars.CMUX_CI_XCODE_APP_MACOS_15) || vars.CMUX_CI_XCODE_APP_MACOS_15 }}
      # Caller workflow env does not reach a reusable workflow; the R2 cache
      # restore needs this set here.
      CI_CACHE_R2_PUBLIC_URL: ${{ vars.CI_CACHE_R2_PUBLIC_URL || 'https://ci-cache.cmux.com' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Initialize local Swift package dependency
        run: git submodule update --init --depth 1 vendor/bonsplit

      - name: Select Xcode
        run: ./scripts/select-ci-xcode.sh

      - name: Initialize Ghostty and download its binary framework
        run: |
          set -euo pipefail
          git submodule update --init --depth 1 ghostty
          ./scripts/download-prebuilt-ghosttykit.sh

      - name: Install Rust toolchain
        run: ./scripts/install-rust-ci.sh

      # A cold resolve clones every package in the project and took about 90
      # seconds of each run. Nightly seeds this key; a miss only means a cold
      # resolve. The seed carries SwiftPM's binary-artifact zips under
      # .package-cache/: the sanitizer drops workspace-state.json, so without
      # them every resolve downloads about 600 MB of Sentry, Iroh and Sparkle
      # from GitHub again.
      - name: Restore Swift packages
        uses: ./.github/actions/cache-restore
        with:
          backend: ${{ vars.CI_CACHE_BACKEND || 'r2' }}
          path: .spm-cache
          key: spm-${{ hashFiles('cmux.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'scripts/ci/swiftpm-cache-layout') }}
          restore-keys: spm-

      - name: Sanitize Swift package cache
        run: python3 scripts/ci/sanitize-xcode-source-packages-cache.py .spm-cache

      # Manifest evaluation is most of a warm resolve. seed-derived-data.yml
      # saves it from main at this workspace path; see
      # scripts/ci/swiftpm-manifest-cache.sh.
      - name: Compute SwiftPM manifest cache key
        id: swiftpm-manifest-key
        run: scripts/ci/swiftpm-manifest-cache.sh key >> "$GITHUB_OUTPUT"

      - name: Restore SwiftPM manifest cache
        continue-on-error: true
        uses: ./.github/actions/cache-restore
        with:
          backend: ${{ vars.CI_CACHE_BACKEND || 'r2' }}
          path: ${{ runner.temp }}/swiftpm-manifests
          key: ${{ steps.swiftpm-manifest-key.outputs.key }}
          restore-keys: ${{ steps.swiftpm-manifest-key.outputs.prefix }}

      - name: Install SwiftPM manifest cache
        continue-on-error: true
        run: scripts/ci/swiftpm-manifest-cache.sh install "$RUNNER_TEMP/swiftpm-manifests"

      - name: Resolve Swift package dependencies
        run: |
          set -euo pipefail
          SOURCE_PACKAGES_DIR="$PWD/.spm-cache"
          mkdir -p "$SOURCE_PACKAGES_DIR"
          resolve() {
            scripts/ci/swiftpm-manifest-cache.sh run \
              xcodebuild -project cmux.xcodeproj -scheme cmux-cli \
              -configuration Debug -derivedDataPath "$RUNNER_TEMP/cmux-cli-resolve" \
              -clonedSourcePackagesDirPath "$SOURCE_PACKAGES_DIR" \
              -packageCachePath "$SOURCE_PACKAGES_DIR/.package-cache" \
              -resolvePackageDependencies
          }
          if ! resolve; then
            echo "Resolve failed with the restored package cache; retrying cold." >&2
            rm -rf "$SOURCE_PACKAGES_DIR"
            mkdir -p "$SOURCE_PACKAGES_DIR"
            resolve
          fi

      - name: Test semantic config validator and Glaeda execution contract
        run: |
          swift test --package-path Packages/macOS/CmuxFoundation --filter CmuxConfigSemanticValidatorTests
          swift test --package-path Packages/macOS/CmuxFoundation --filter CmuxGlaedaExecutionContractTests

      - name: Build the standalone CLI
        run: |
          set -euo pipefail
          CMUX_CLI_TEST_TAG="$(printf '%s' "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" | tr -cs 'A-Za-z0-9._-' '-')"
          CMUX_CLI_DERIVED="$RUNNER_TEMP/cmux-$CMUX_CLI_TEST_TAG"
          echo "CMUX_CLI_DERIVED=$CMUX_CLI_DERIVED" >> "$GITHUB_ENV"
          git rev-parse HEAD > "$RUNNER_TEMP/cli-revision.txt"
          xcodebuild -project cmux.xcodeproj -scheme cmux-cli \
            -configuration Debug -destination 'platform=macOS' \
            -derivedDataPath "$CMUX_CLI_DERIVED" \
            -clonedSourcePackagesDirPath "$PWD/.spm-cache" \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee "$RUNNER_TEMP/cli-build.log"

      - name: Exercise closed consumers and socket disconnects
        run: |
          set -euo pipefail
          CMUX_CLI_PRODUCTS="$CMUX_CLI_DERIVED/Build/Products/Debug"
          export CMUX_CLI_BIN="$CMUX_CLI_PRODUCTS/cmux"
          export DYLD_FRAMEWORK_PATH="$CMUX_CLI_PRODUCTS/Frameworks:$CMUX_CLI_PRODUCTS"
          python3 tests/test_cli_broken_pipe_writes.py 2>&1 | tee "$RUNNER_TEMP/cli-pipes.log"
          python3 tests/test_cli_config_doctor.py 2>&1 | tee "$RUNNER_TEMP/cli-config-validation.log"
          python3 tests/test_cli_glaeda_execution.py 2>&1 | tee "$RUNNER_TEMP/glaeda-execution.log"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: cli-pipe-regressions
          path: |
            ${{ runner.temp }}/cli-revision.txt
            ${{ runner.temp }}/cli-build.log
            ${{ runner.temp }}/cli-pipes.log
            ${{ runner.temp }}/cli-config-validation.log
            ${{ runner.temp }}/glaeda-execution.log
          retention-days: 7
