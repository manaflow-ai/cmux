name: Agent PR review gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created, edited, deleted]

permissions:
  contents: read
  pull-requests: read

jobs:
  agent-pr-review-complete:
    name: agent-pr-review-complete
    runs-on: ubuntu-latest
    steps:
      # This is a read-only pull_request workflow with no secrets. Check out the
      # merge ref so the versioned checker travels with the workflow and can be
      # tested in the same change. The checker only reads GitHub API data.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Evaluate current-head review obligations
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 .github/scripts/agent-pr-review-gate.py
