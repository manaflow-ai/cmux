      - name: Upload pending notarization recovery artifact
        id: upload-pending-notarization-recovery-artifact
        continue-on-error: true
        if: always() && steps.prepare-notarization-recovery.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-${{ needs.decide.outputs.channel }}-notarization-recovery-${{ matrix.variant }}-${{ needs.resolve-nightly-cmux-tui-client.outputs.build_short_sha }}
          overwrite: true
          path: |
            ${{ env.NIGHTLY_DMG_RELEASE }}
            ${{ env.NIGHTLY_DMG_RELEASE }}.notarization.state
            ${{ env.NIGHTLY_DMG_RELEASE }}.notarization.log
            *.first.dmg
            cmux-nightly-notarization-recovery-app.tar.gz
            cmux-nightly-notarization-recovery.json
            remote-daemon-assets/cmuxd-remote-*
            recovery-source-archive/
          if-no-files-found: error
          retention-days: 7

      - name: Upload pending notarization recovery artifact (retry)
        if: "!cancelled() && steps.upload-pending-notarization-recovery-artifact.outcome == 'failure' && (always() && steps.prepare-notarization-recovery.outcome == 'success')"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-${{ needs.decide.outputs.channel }}-notarization-recovery-${{ matrix.variant }}-${{ needs.resolve-nightly-cmux-tui-client.outputs.build_short_sha }}
          path: |
            ${{ env.NIGHTLY_DMG_RELEASE }}
            ${{ env.NIGHTLY_DMG_RELEASE }}.notarization.state
            ${{ env.NIGHTLY_DMG_RELEASE }}.notarization.log
            *.first.dmg
            cmux-nightly-notarization-recovery-app.tar.gz
            cmux-nightly-notarization-recovery.json
            remote-daemon-assets/cmuxd-remote-*
            recovery-source-archive/
          if-no-files-found: error
          retention-days: 7
          overwrite: true


      - &x70
        name: Gate distribution with syspolicy_check
        if: needs.decide.outputs.fast_build != 'true' && needs.decide.outputs.notary_paused != 'true' && steps.notarize-nightly.outputs.submission_pending != 'true' && !env.LEFT_SLOT
        run: syspolicy_check distribution "$CHANNEL_APP_PATH"


      - &x71
        name: Generate Sparkle appcasts (nightly)
        if: needs.decide.outputs.fast_build != 'true' && needs.decide.outputs.notary_paused != 'true' && steps.notarize-nightly.outputs.submission_pending != 'true' && needs.decide.outputs.notary_test != 'true' && !env.LEFT_SLOT
        env:
          NIGHTLY_SPARKLE_KEY: ${{ vars.NIGHTLY_SPARKLE_KEY }}
          CHANNEL: ${{ needs.decide.outputs.channel }}
          TRACK: ${{ needs.decide.outputs.track }}
