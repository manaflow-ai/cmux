name: Nightly macOS build
# Why: docs/ci/nightly-workflow-notes.md#note-34
run-name: >-
  ${{ inputs.promote_nightly_next_sha && format('Promote nightly-next to {0}', inputs.promote_nightly_next_sha)
      || github.event_name == 'schedule' && format('Nightly macOS build · {0}', github.event.schedule)
      || inputs.nightly_next_unsigned_run && format('Resume nightly-next run {0} attempt {1}', inputs.nightly_next_unsigned_run, inputs.nightly_next_unsigned_attempt)
      || inputs.nightly_next_loop_retry && format('Retry nightly-next ({0} of 2)', inputs.nightly_next_loop_retry)
      || inputs.nightly_next_republish_run && format('Republish nightly-next run {0} attempt {1}', inputs.nightly_next_republish_run, inputs.nightly_next_republish_attempt)
      || inputs.nightly_next_post_publish && 'Finish a published nightly-next build (release, deltas, notes, PR comments)'
      || '' }}

# Publish channels, resolved once in `decide`: `main` publishes cmux NIGHTLY, `rc/**` cmux RC,
# `nightly-next` the cmux-next track (own release, Sparkle key and feed, signed as cmux
# NIGHTLY; hq#7156), each feed advancing only in its channel. Only main's
# promote-nightly-next moves `nightly-next` (release-next environment).
on:
  # Publish changed main revisions, at most once per NIGHTLY_PUSH_MIN_INTERVAL_HOURS
  # of published-commit age (see `decide`), while keeping the scheduled cache warm.
  # Publish every push to a release-candidate branch as the RC channel.
  push:
    branches:
      - main
      - "rc/**"
      - nightly-next
  schedule:
    - cron: "17 */6 * * *"
    - cron: "47 8 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild an already published main commit. Manual runs always bypass the push throttle.
        required: false
        default: false
        type: boolean
      fast:
        description: Build one arm64 dogfood DMG without Intel or Sparkle delta work
        required: false
        default: false
        type: boolean
      build_only:
        description: Measure the unsigned universal build only. Never builds the helper, signs, notarizes, uploads dSYMs, or publishes.
        required: false
        default: false
        type: boolean
      seed_only:
        description: Warm the Debug and Release caches only. Never builds or publishes an app artifact.
        required: false
        default: false
        type: boolean
      cold_cache:
        description: Skip the Xcode compilation cache restore so the measurement run is a cache miss. Only honoured with build_only.
        required: false
        default: false
        type: boolean
      cache_backend:
        description: Cache store for this run. `default` follows the CI_CACHE_BACKEND repository variable.
        required: false
        default: default
        type: choice
        options:
          - default
          - github
          - warp
          - r2
      notary_test_without_password_import:
        description: nightly-next only. One diagnostic notary submission (cx-f58x) of a build with the browser password-import readers compiled out (CMUX_NO_PASSWORD_IMPORT). Notarizes even with NIGHTLY_NEXT_NOTARY_PAUSED=1 and publishes nothing.
        required: false
        default: false
        type: boolean
      notary_test_without_browser_data_import:
        description: nightly-next only. Like notary_test_without_password_import, and also compiles out every read of another browser's files or Keychain items (CMUX_NO_BROWSER_DATA_IMPORT) and ships an empty browser-sources.json. One app notary submission, nothing published.
        required: false
        default: false
        type: boolean
      notary_test_import_part:
        description: nightly-next only. cx-f58x notary bisect. One diagnostic notary submission of a build with exactly this one browser-import part compiled out (cookies = CMUX_NO_COOKIE_IMPORT, safe-storage = CMUX_NO_SAFE_STORAGE_READ, history = CMUX_NO_HISTORY_IMPORT, registry = empty browser-sources.json), or full = nothing compiled out (the import exactly as it would ship, to see whether Apple's status 7000 hold is still there). Every other import part stays in. Nothing is published.
        required: false
        default: none
        type: choice
        options:
          - none
          - cookies
          - safe-storage
          - history
          - registry
          - full
      notary_probe_nightly_identity:
        description: nightly-next only. The production probe's run (one app notary submission, nothing published, text receipts only), signed as cmux NIGHTLY (com.cmuxterm.app.nightly, cmux.nightly.entitlements, NIGHTLY profile). The dogfood of shipping nightly-next as cmux NIGHTLY (a979).
        required: false
        default: false
        type: boolean
      notary_probe_production_identity:
        description: nightly-next only. One app notary submission of this build as the production identity (com.cmuxterm.app, cmux.release.entitlements, release profile) with the browser-data import compiled out. There is no Sparkle key or feed, no DMG or app artifact, and no recovery artifact. Only text receipts are uploaded and nothing is published.
        required: false
        default: false
        type: boolean
      nightly_next_continue_only:
        description: nightly-next only. Build nothing and submit nothing to Apple. Continue the newest earlier nightly-next build whose notarization Apple has since Accepted, and publish it through the normal guarded publication.
        required: false
        default: false
        type: boolean
      nightly_next_unsigned_run:
        description: nightly-next only. Resume signing and publication from this completed push run's unsigned app, without compiling again.
        required: false
        default: ''
        type: string
      nightly_next_unsigned_attempt:
        description: Exact source run attempt that produced the saved unsigned app (required with nightly_next_unsigned_run).
        required: false
        default: ''
        type: string
      nightly_next_loop_retry:
        description: nightly-next only, sent by a failed run's retry-nightly-next. How many times in a row the loop has retried (1 or 2). The run takes the push group's one pending place, so it builds the newest head (or resumes the failed run's unsigned app when the head is still its commit).
        required: false
        default: ''
        type: string
      nightly_next_republish_run:
        description: nightly-next only. Build, sign and notarize nothing. Publish this completed nightly-next push run's verified DMG again with this run's workflow and publication tooling, through the normal guarded publication.
        required: false
        default: ''
        type: string
      nightly_next_republish_attempt:
        description: Exact attempt of nightly_next_republish_run whose verify jobs passed (required with it).
        required: false
        default: ''
        type: string
      nightly_next_post_publish:
        description: nightly-next only, sent by a loop run's dispatch-published-in (a push or nightly_next_loop_retry) once its feed and GitHub release were published. JSON {source_run, source_attempt, tail} naming that run; the build's record is read only from that run's own artifact, after the API confirms it is a nightly.yml run on nightly-next (scripts/ci/nightly_published_build.py). This run builds and signs no app; it runs the deltas, release notes, reel and PR comments, so none of them holds the push group.
        required: false
        default: ''
        type: string
      promote_nightly_next_sha:
        description: Main only. Move branch nightly-next to this green feat-cmux-next commit (40 hex) and build nothing in this run; the push run on nightly-next publishes it. Prefix it with "dry-run:" to only decide and print why, moving nothing.
        required: false
        default: ''
        type: string
      promote_nightly_next_debounce:
        description: Skip the promotion when a nightly-next build started within NIGHTLY_NEXT_MIN_INTERVAL_HOURS (set by the automatic request).
        required: false
        default: false
        type: boolean
      probe_target_sha:
        description: Full SHA that directly changes a workflow file for the scratch-tag probe.
        required: false
        default: ''
        type: string
      probe_mode:
        description: Scratch-tag permission probe. `off` runs the normal workflow; any other value runs only the probe (no build or publish) with that credential path; run github-token first, then app-token.
        required: false
        default: 'off'
        type: choice
        options:
          - 'off'
          - both
          - github-token
          - app-token

concurrency:
  # Why: docs/ci/nightly-workflow-notes.md#note-19
  group: nightly-build-${{ github.ref_name == 'main' && 'nightly-shared' || github.ref_name }}-${{ github.ref == 'refs/heads/nightly-next' && ((github.event_name == 'push' || github.event_name == 'workflow_dispatch' && inputs.nightly_next_loop_retry != '') && (vars.NIGHTLY_NEXT_ONE_JOB != 'on' || vars.NIGHTLY_NEXT_SUBMISSIONS_PAUSED == '1' || vars.NIGHTLY_NEXT_NOTARY_PAUSED == '1') && 'push' || format('run-{0}', github.run_id)) || github.event_name == 'workflow_dispatch' && inputs.promote_nightly_next_sha != '' && format('nightly-next-promote-{0}', github.run_id) || github.event_name == 'schedule' && github.event.schedule == '17 */6 * * *' && 'cache-seed-scheduled' || inputs.seed_only && 'cache-seed-manual' || github.event_name == 'workflow_dispatch' && github.event.inputs.build_only == 'true' && format('nightly-measure-{0}', github.run_id) || github.event_name == 'workflow_dispatch' && inputs.nightly_next_continue_only && format('continue-{0}', github.run_id) || github.event_name == 'workflow_dispatch' && (inputs.notary_test_without_password_import || inputs.notary_test_without_browser_data_import || inputs.notary_probe_production_identity || (inputs.notary_test_import_part || 'none') != 'none') && format('notary-test-{0}', github.run_id) || (github.event_name == 'workflow_dispatch' && github.event.inputs.fast == 'true' && 'fast' || 'full') }}
  cancel-in-progress: false

permissions: {}

env:
  # Temporary REST budget attribution: one gh-call line per GitHub API call (scripts/ci/api_call_log/env.sh, fetched at a fixed commit when the checkout has no copy).
  BASH_ENV: '$({ w="${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh"; t="${RUNNER_TEMP:-/nonexistent}/api-call-log-src"; if [ -f "$w" ]; then echo "$w"; elif [ -n "${RUNNER_TEMP:-}" ]; then if [ ! -f "$t/env.sh" ] && [ ! -e "$t.tried" ] && { [ "${RUNNER_OS:-}" = Linux ] || [ "${RUNNER_OS:-}" = macOS ]; } && [ "$(date -u +%Y%m%d%H)" -lt 2026112300 ]; then : > "$t.tried"; mkdir -p "$t.part" && for x in env.sh gh sitecustomize.py isolated.py; do curl -fsSL --max-time 5 -o "$t.part/$x" "https://raw.githubusercontent.com/manaflow-ai/cmux/27647ffd3ae838c63be28ca3e5883dcd68c34518/scripts/ci/api_call_log/$x" || break; done; [ -s "$t.part/isolated.py" ] && mv "$t.part" "$t"; fi; if [ -f "$t/env.sh" ]; then echo "$t/env.sh"; else echo unset BASH_ENV > "$t.off.sh" && echo "$t.off.sh"; fi; fi; } 2>/dev/null)'
  # Main's promote guard reads this exact line (promote-nightly-next.mjs G5); see resolve-tree-pending.sh.
  NIGHTLY_NEXT_TREE_AT_INSTALL: v1
  CREATE_DMG_VERSION: 8.0.0
  CI_CACHE_R2_PUBLIC_URL: ${{ vars.CI_CACHE_R2_PUBLIC_URL || 'https://ci-cache.cmux.com' }}
  # The cmux-next track (branch `nightly-next`). The feed base must never be
  # main's nightly or RC feed; scripts/ci/nightly-next-guard.py refuses it.
  # The track's one feed: each build is signed once, as cmux NIGHTLY
  # (com.cmuxterm.app.nightly), the app the team runs (hq#7156; Leo,
  # 2026-11-05: "THERE SHOULDN'T BE 2"). It keeps "/nightly-next/" in its
  # path: UpdateFeedResolver classifies the track by it. Release notes sit
  # beside it.
  NIGHTLY_NEXT_FEED_BASE: https://files-next.cmux.com/nightly-next
  # The retired cmux NEXT-identity feed (com.cmuxterm.app.nightly.cmux-next).
  # It gets no builds, only the handover item that sends a stray install to
  # cmux NIGHTLY (publish-nightly). The canary verdicts and pulled.json stay
  # in its folder, where the app reads them (UpdaterService.channelFolder).
  NIGHTLY_NEXT_RETIRED_FEED_BASE: https://files-next.cmux.com/nightly-next/next
  NIGHTLY_NEXT_VERDICTS_BASE: https://files-next.cmux.com/nightly-next/next
  # cmux-next's own version line (CFBundleShortVersionString
  # <V>-nightly.<build>) comes from cmux-tui/Cargo.toml [workspace.package]
  # (`scripts/ci/nightly_version.py next-base`), the version the bundled CLIs
  # print too; main's nightly and RC keep the project version.
  NIGHTLY_NEXT_R2_BUCKET: cmux-nightly-next
  NIGHTLY_NEXT_R2_PREFIX: nightly-next/
  NIGHTLY_NEXT_RETIRED_R2_PREFIX: nightly-next/next/
  # SUPublicEDKey of the cmux-next track. The build refuses a
  # SPARKLE_NEXT_PRIVATE_KEY that does not derive this public key.
  NIGHTLY_NEXT_SPARKLE_PUBLIC_KEY: IOPItMLjtc4NsROTNZ6a/jsUW+C4fcicl6SNjVVvzRM=
  # Why: docs/ci/nightly-workflow-notes.md#note-35
  NIGHTLY_NEXT_BROWSER_DATA_IMPORT: full

jobs:
  # Why: docs/ci/nightly-workflow-notes.md#note-29
  runner-preflight:
    permissions:
      issues: write # a failure opens or updates the nightly's failure incident (notify() in the script)
    if: github.event_name != 'workflow_dispatch' || ((inputs.probe_mode || 'off') == 'off' && inputs.promote_nightly_next_sha == '' && inputs.nightly_next_post_publish == '')
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.CI_NIGHTLY_MINI != '' && vars.CI_NIGHTLY_MINI || vars.CI_NIGHTLY_ONLY_RUNNER || 'glaeda-nightly-only-m4pro' }}
    timeout-minutes: ${{ vars.CI_NIGHTLY_MINI != '' && 123 || 3 }}
    steps:
      - name: Check out the preflight
        if: github.repository == 'manaflow-ai/cmux'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 1
          sparse-checkout: |
            /scripts/ci/nightly_runner_preflight.py
            /scripts/ci/deadline_http.py
            /.gitmodules
          sparse-checkout-cone-mode: false
      - name: Every routing label has an online runner
        if: github.repository == 'manaflow-ai/cmux'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CI_RUNNER_STATE: ${{ vars.CI_RUNNER_STATE }}
          CI_NIGHTLY_MINI: ${{ vars.CI_NIGHTLY_MINI }}
          CI_NIGHTLY_MINI_BUILDER: ${{ vars.CI_NIGHTLY_MINI_BUILDER }}
          CI_NIGHTLY_ONLY_RUNNER: ${{ vars.CI_NIGHTLY_ONLY_RUNNER }}
          NIGHTLY_SCHEDULE: ${{ github.event.schedule }}
        run: python3 scripts/ci/nightly_runner_preflight.py

  decide:
    needs: runner-preflight
    environment:
      name: ci-routing-agent
      deployment: false
    permissions:
      actions: read
      checks: read # Read authenticated controller receipts; no App or secret expansion.
      contents: read
    if: github.event_name != 'workflow_dispatch' || ((inputs.probe_mode || 'off') == 'off' && inputs.promote_nightly_next_sha == '' && inputs.nightly_next_post_publish == '')
    # Routing bootstrap: nothing places it first, so it takes the nightly-only pool (glaeda's light class).
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.CI_NIGHTLY_MINI != '' && vars.CI_NIGHTLY_MINI || vars.CI_NIGHTLY_ONLY_RUNNER || 'glaeda-nightly-only-m4pro' }}
    timeout-minutes: 50
    outputs:
      should_build: ${{ steps.decide.outputs.should_build }}
      head_sha: ${{ steps.decide.outputs.head_sha }}
      short_sha: ${{ steps.decide.outputs.short_sha }}
      published_sha: ${{ steps.decide.outputs.published_sha }}
      should_publish: ${{ steps.decide.outputs.should_publish }}
      one_job: ${{ steps.decide.outputs.one_job }}
      notary_paused: ${{ steps.decide.outputs.notary_paused }}
      import_paused: ${{ steps.decide.outputs.import_paused }}
      notary_test: ${{ steps.decide.outputs.notary_test }}
      notary_test_browser_data: ${{ steps.decide.outputs.notary_test_browser_data }}
      no_publish: ${{ steps.decide.outputs.no_publish }}
      continue_only: ${{ steps.decide.outputs.continue_only }}
      republish_run: ${{ steps.decide.outputs.republish_run }}
      republish_attempt: ${{ steps.decide.outputs.republish_attempt }}
      import_variant: ${{ steps.decide.outputs.import_variant }}
      swift_import_flags: ${{ steps.decide.outputs.swift_import_flags }}
      empty_browser_sources: ${{ steps.decide.outputs.empty_browser_sources }}
      password_readers_out: ${{ steps.decide.outputs.password_readers_out }}
      notary_probe: ${{ steps.decide.outputs.notary_probe }}
      sign_channel: ${{ steps.decide.outputs.sign_channel }}
      profile_channel: ${{ steps.decide.outputs.profile_channel }}
      variants: ${{ steps.decide.outputs.variants }}
      compile_archs: ${{ steps.decide.outputs.compile_archs }}
      feeds: ${{ steps.decide.outputs.feeds }}
      legacy_variant: ${{ steps.decide.outputs.legacy_variant }}
      fast_build: ${{ steps.decide.outputs.fast_build }}
      build_only: ${{ steps.decide.outputs.build_only }}
      force: ${{ steps.decide.outputs.force }}
      cold_cache: ${{ steps.decide.outputs.cold_cache }}
      channel: ${{ steps.decide.outputs.channel }}
      channel_upper: ${{ steps.decide.outputs.channel_upper }}
      track: ${{ steps.decide.outputs.track }}
      environment: ${{ steps.decide.outputs.environment }}
      bundle_id: ${{ steps.decide.outputs.bundle_id }}
      app_name: ${{ steps.decide.outputs.app_name }}
      url_scheme: ${{ steps.decide.outputs.url_scheme }}
      dmg_prefix: ${{ steps.decide.outputs.dmg_prefix }}
      release_tag: ${{ steps.decide.outputs.release_tag }}
      release_name: ${{ steps.decide.outputs.release_name }}
      feed_base: ${{ steps.decide.outputs.feed_base }}
      entitlements: ${{ steps.decide.outputs.entitlements }}
      icon_name: ${{ steps.decide.outputs.icon_name }}
      app_input_digest: ${{ steps.app-input-digest.outputs.app_input_digest }}
      would_reuse: ${{ steps.app-input-digest.outputs.would_reuse }}
    steps:
      - name: Check out the revision under consideration
        if: github.ref != 'refs/heads/nightly-next'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 1

      # NEXT's decision reads release metadata, not the app tree. Main's build-input
      # classifier still needs the full checkout above, including tracked referrers.
      - name: Check out the NEXT decision helper
        if: github.ref == 'refs/heads/nightly-next'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 1
          sparse-checkout: |
            /scripts/ci/nightly-publication-marker.py
            /scripts/ci/app_input_digest.py
            /scripts/ci/nightly-steps/decide-shadow-app-input-digest.sh
            /scripts/ci/timeout.sh
            /.gitmodules
          sparse-checkout-cone-mode: false

      # A second budget for decide's reads: GITHUB_TOKEN draws on the repository's Actions installation, which
      # every cmux workflow shares and which ran dry at 01:22Z on 2026-11-21 (run 44849687076). The glaeda-route
      # App is a separate installation with its own hourly budget. Optional: decide waits for the reset without it.
      - name: Mint a spare read token for decide
        id: decide-spare-token
        if: github.repository == 'manaflow-ai/cmux' && vars.GLAEDA_ROUTE_APP_ID != ''
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.GLAEDA_ROUTE_APP_ID }}
          private-key: ${{ secrets.GLAEDA_ROUTE_APP_KEY }}
          permission-contents: read
          permission-actions: read

      - name: Decide whether a nightly build is needed
        id: decide
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SPARE_READ_TOKEN: ${{ steps.decide-spare-token.outputs.token }}
          FORCE_BUILD: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.force == 'true' && 'true' || 'false' }}
          FAST_BUILD: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.fast == 'true' && 'true' || 'false' }}
          BUILD_ONLY: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.build_only == 'true' && 'true' || 'false' }}
          SEED_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.seed_only && 'true' || 'false' }}
          COLD_CACHE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.cold_cache == 'true' && 'true' || 'false' }}
          PUSH_MIN_INTERVAL_HOURS: ${{ vars.NIGHTLY_PUSH_MIN_INTERVAL_HOURS || '2' }}
          NIGHTLY_NEXT_NOTARY_PAUSED: ${{ vars.NIGHTLY_NEXT_NOTARY_PAUSED || '' }}
          NIGHTLY_NEXT_WRITER: ${{ vars.NIGHTLY_NEXT_WRITER || 'mac' }}
          NIGHTLY_NEXT_SUBMISSIONS_PAUSED: ${{ vars.NIGHTLY_NEXT_SUBMISSIONS_PAUSED || '' }}
          NOTARY_TEST_PASSWORDS: ${{ github.event_name == 'workflow_dispatch' && inputs.notary_test_without_password_import && 'true' || 'false' }}
          NOTARY_TEST_BROWSER_DATA: ${{ github.event_name == 'workflow_dispatch' && inputs.notary_test_without_browser_data_import && 'true' || 'false' }}
          NOTARY_IMPORT_PART: ${{ github.event_name == 'workflow_dispatch' && inputs.notary_test_import_part || 'none' }}
          NOTARY_PROBE: ${{ github.event_name == 'workflow_dispatch' && (inputs.notary_probe_production_identity || inputs.notary_probe_nightly_identity) && 'true' || 'false' }}
          NOTARY_PROBE_IDENTITY: ${{ github.event_name == 'workflow_dispatch' && inputs.notary_probe_nightly_identity && (inputs.notary_probe_production_identity && 'both' || 'nightly') || 'production' }}
          UNSIGNED_RUN: ${{ inputs.nightly_next_unsigned_run }}
          UNSIGNED_ATTEMPT: ${{ inputs.nightly_next_unsigned_attempt }}
          LOOP_RETRY: ${{ inputs.nightly_next_loop_retry }}
          NIGHTLY_NEXT_ONE_JOB: ${{ vars.NIGHTLY_NEXT_ONE_JOB || '' }}
          CONTINUE_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.nightly_next_continue_only && 'true' || 'false' }}
          REPUBLISH_RUN: ${{ inputs.nightly_next_republish_run }}
          REPUBLISH_ATTEMPT: ${{ inputs.nightly_next_republish_attempt }}
        with:
          script: |
            // GitHub API rate limits (the installation's shared hourly budget, or a secondary limit) must not
            // fail the nightly: run 41153241702's decide died on "API rate limit exceeded for installation".
            // A rate-limited read first goes again on the spare token (another installation's budget), when the
            // job minted one. Otherwise every request waits for the limit's reset (Retry-After, else
            // x-ratelimit-reset) and tries again; any other error is unchanged. The core budget resets hourly, so
            // one 65-minute window covers the whole decision: every reset and Retry-After wait of every request
            // comes out of it (run 44849687076 gave up at a 20-minute cap at 01:42Z; the reset was 01:51Z).
            const spareReader = process.env.SPARE_READ_TOKEN ? getOctokit(process.env.SPARE_READ_TOKEN) : null;
            const deadline = Date.now() + 65 * 60 * 1000;
            if (github.hook && typeof github.hook.wrap === 'function') github.hook.wrap('request', async (request, options) => {
              for (let attempt = 1; ; attempt += 1) {
                try {
                  return await request(options);
                } catch (error) {
                  const status = error && error.status;
                  const headers = (error && error.response && error.response.headers) || {};
                  const message = String((error && error.message) || '');
                  const limited = (status === 403 || status === 429) &&
                    (headers['x-ratelimit-remaining'] === '0' || headers['retry-after'] !== undefined || /rate limit/i.test(message));
                  if (!limited) throw error;
                  if (spareReader && String(options.method || 'GET').toUpperCase() === 'GET') {
                    try {
                      const { headers: { authorization, ...spareHeaders } = {}, request: _hooks, ...route } = options;
                      const response = await spareReader.request({ ...route, headers: spareHeaders });
                      core.notice(`GitHub API rate limited (${status}) on GET ${options.url}; read it with the spare token`);
                      return response;
                    } catch (spareError) {
                      core.warning(`the spare token could not read ${options.url} either (${spareError && spareError.status}); waiting for the reset`);
                    }
                  }
                  if (Date.now() >= deadline) throw error;
                  const retryAfter = Number(headers['retry-after']);
                  const reset = Number(headers['x-ratelimit-reset']);
                  let waitMs = Number.isFinite(retryAfter) && retryAfter > 0 ? retryAfter * 1000
                    : Number.isFinite(reset) && reset > 0 ? reset * 1000 - Date.now() + 2000
                    : Math.min(60000 * attempt, 300000);
                  waitMs = Math.max(5000, Math.min(waitMs, 3660000, deadline - Date.now()));
                  core.warning(`GitHub API rate limited (${status}) on ${options.method} ${options.url}; retrying in ${Math.round(waitMs / 1000)} s (attempt ${attempt})`);
