      # through the checks API and refuses a tarball with another sha256.
      - &record-prepared-app-digest
        name: Record prepared app digest
        if: env.PREPARE_FALLBACK != 'true' || steps.reuse.outputs.exists != 'true'
        env:
          PREPARED_APP_ARTIFACT: cmux-${{ needs.decide.outputs.channel }}-prepared-app-${{ matrix.variant }}-${{ needs.resolve-nightly-cmux-tui-client.outputs.build_short_sha }}
          NIGHTLY_SHOULD_PUBLISH: ${{ needs.decide.outputs.should_publish }}
        run: |
          set -euo pipefail
          digest="$(shasum -a 256 prepared-app-handoff/cmux-prepared-app.tar.gz | awk '{print $1}')"
          [[ "$digest" =~ ^[0-9a-f]{64}$ ]] || { echo "no sha256 for the prepared app" >&2; exit 1; }
          echo "::notice title=nightly-prepared-app::variant=${NIGHTLY_VARIANT} artifact=${PREPARED_APP_ARTIFACT} sha256=${digest} publish=${NIGHTLY_SHOULD_PUBLISH} fast=${NIGHTLY_FAST_BUILD}"

      - &finish-the-browser-data-import
        name: Finish the browser-data import proof
        if: ${{ (env.PREPARE_FALLBACK != 'true' || steps.reuse.outputs.exists != 'true') && (needs.decide.outputs.notary_test_browser_data == 'true') }}
        run: |
          set -euo pipefail
          state="$RUNNER_TEMP/browser-data-proof"
          [ -p "$state/status.fifo" ] || { echo "the browser-data import proof was never started" >&2; exit 1; }
          status=""
          read -r status <"$state/status.fifo" || true
          cat "$state/proof.log"
          rm -rf "$state"
          case "$status" in
            0) ;;
            "") echo "the browser-data import proof ended without a status" >&2; exit 1 ;;
            *) echo "the browser-data import proof failed (status $status)" >&2; exit 1 ;;
          esac

      - &upload-prepared-app-for-signin
        name: Upload prepared app for signing
        if: env.PREPARE_FALLBACK != 'true' || steps.reuse.outputs.exists != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-${{ needs.decide.outputs.channel }}-prepared-app-${{ matrix.variant }}-${{ needs.resolve-nightly-cmux-tui-client.outputs.build_short_sha }}
          path: prepared-app-handoff/cmux-prepared-app.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 3


  # The fallback preparation, and the preparation result every later job reads
  # (needs.prepare-nightly-variant): success after a primary success (a no-op leg) or after
  # its own preparation. Until 2026-10-31 a separate prepare-nightly-variant job only echoed
