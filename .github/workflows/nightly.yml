name: Nightly macOS build

# One workflow, two publish channels. A push to `main` publishes cmux NIGHTLY
# (bundle id com.cmuxterm.app.nightly, GitHub release `nightly`, feed
# files.cmux.com/nightly). A push to an `rc/**` branch publishes cmux RC
# (com.cmuxterm.app.rc, release `rc`, feed files.cmux.com/rc). The two channels
# install side by side with each other and with stable, and each Sparkle feed
# only ever advances within its own channel. Everything channel-specific is
# resolved once in `decide`; every later job reads it from there.
#
# A push to `nightly-next` publishes the cmux-next track: the same app identity
# as cmux NIGHTLY (bundle id com.cmuxterm.app.nightly), but its own release
# `nightly-next`, DMG names, Sparkle key and feed (NIGHTLY_NEXT_FEED_BASE), so
# its installs never read main's NIGHTLY feed and main's never read its feed.
# Only main's nightly.yml job promote-nightly-next (release environment, release
# App) moves `nightly-next`, to a feat-cmux-next head whose Release compile is
# green; cmux-next.yml requests it after a green push run. Its signing and upload secrets live in the
# `release-next` environment, which only `nightly-next` may use.
on:
  # Publish changed main revisions, at most once per NIGHTLY_PUSH_MIN_INTERVAL_HOURS
  # of published-commit age (see `decide`), while keeping the scheduled cache warm.
  # Publish every push to a release-candidate branch as the RC channel.
  push:
    branches:
      - main
      - "rc/**"
      - nightly-next
  schedule:
    - cron: "17 */6 * * *"
    - cron: "47 8 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild an already published main commit. Manual runs always bypass the push throttle.
        required: false
        default: false
        type: boolean
      fast:
        description: Build one arm64 dogfood DMG without Intel or Sparkle delta work
        required: false
        default: false
        type: boolean
      build_only:
        description: Measure the unsigned universal build only. Never builds the helper, signs, notarizes, uploads dSYMs, or publishes.
        required: false
        default: false
        type: boolean
      seed_only:
        description: Warm the Debug and Release caches only. Never builds or publishes an app artifact.
        required: false
        default: false
        type: boolean
      cold_cache:
        description: Skip the Xcode compilation cache restore so the measurement run is a cache miss. Only honoured with build_only.
        required: false
        default: false
        type: boolean
      cache_backend:
        description: Cache store for this run. `default` follows the CI_CACHE_BACKEND repository variable.
        required: false
        default: default
        type: choice
        options:
          - default
          - github
          - warp
          - r2
      tag_permission_probe:
        description: Run the scratch-tag permission probe without building or publishing a channel.
        required: false
        default: false
        type: boolean
      probe_target_sha:
        description: Full SHA that directly changes a workflow file for the scratch-tag probe.
        required: false
        default: ''
        type: string
      probe_mode:
        description: Credential path for the scratch-tag probe; run github-token first, then app-token.
        required: false
        default: both
        type: choice
        options:
          - both
          - github-token
          - app-token

concurrency:
  # A six-hour cache warmup must not wait behind a publishing nightly build or
  # hold one behind a saturated runner pool. Only that schedule gets a separate
  # group, and a newer tick may replace the older warmup. The daily 08:47 UTC
  # publishing schedule, pushes, manual full runs, fast dogfood runs, and
  # build-only measurements retain their existing serialization rules.
  # Keep scheduled and manually requested cache seeds in different groups. A
  # scheduled tick may replace an older scheduled tick, but must never cancel
  # an explicit manual refresh that happens to be running at the same time.
  group: nightly-build-${{ github.ref_name }}-${{ github.event_name == 'schedule' && github.event.schedule == '17 */6 * * *' && 'cache-seed-scheduled' || inputs.seed_only && 'cache-seed-manual' || github.event_name == 'workflow_dispatch' && github.event.inputs.build_only == 'true' && format('nightly-measure-{0}', github.run_id) || (github.event_name == 'workflow_dispatch' && github.event.inputs.fast == 'true' && 'fast' || 'full') }}
  cancel-in-progress: ${{ github.event_name == 'schedule' && github.event.schedule == '17 */6 * * *' }}

permissions:
  contents: write
  attestations: write
  id-token: write

env:
  CREATE_DMG_VERSION: 8.0.0
  CI_CACHE_R2_PUBLIC_URL: ${{ vars.CI_CACHE_R2_PUBLIC_URL || 'https://ci-cache.cmux.com' }}
  # The cmux-next track (branch `nightly-next`). The feed base must never be
  # main's nightly or RC feed; scripts/ci/nightly-next-guard.py refuses it.
  NIGHTLY_NEXT_FEED_BASE: https://files-next.cmux.com/nightly-next
  # cmux-next's own version line (CFBundleShortVersionString
  # <this>-nightly.<build>); main's nightly and RC keep the project version.
  # scripts/ci/nightly_version.py owns the rule.
  NIGHTLY_NEXT_MARKETING_VERSION: "1.0.0"
  NIGHTLY_NEXT_R2_BUCKET: cmux-nightly-next
  NIGHTLY_NEXT_R2_PREFIX: nightly-next/
  # SUPublicEDKey of the cmux-next track. The build refuses a
  # SPARKLE_NEXT_PRIVATE_KEY that does not derive this public key.
  NIGHTLY_NEXT_SPARKLE_PUBLIC_KEY: IOPItMLjtc4NsROTNZ6a/jsUW+C4fcicl6SNjVVvzRM=

jobs:
  decide:
    if: github.event_name != 'workflow_dispatch' || inputs.tag_permission_probe != true
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    outputs:
      should_build: ${{ steps.decide.outputs.should_build }}
      head_sha: ${{ steps.decide.outputs.head_sha }}
      short_sha: ${{ steps.decide.outputs.short_sha }}
      published_sha: ${{ steps.decide.outputs.published_sha }}
      should_publish: ${{ steps.decide.outputs.should_publish }}
      variants: ${{ steps.decide.outputs.variants }}
      legacy_variant: ${{ steps.decide.outputs.legacy_variant }}
      fast_build: ${{ steps.decide.outputs.fast_build }}
      build_only: ${{ steps.decide.outputs.build_only }}
      cold_cache: ${{ steps.decide.outputs.cold_cache }}
      # Channel identity. `channel` is `nightly` or `rc`; the rest are the
      # derived strings so no later job re-derives them from the ref.
      channel: ${{ steps.decide.outputs.channel }}
      channel_upper: ${{ steps.decide.outputs.channel_upper }}
      # `track` is `nightly`, `rc` or `nightly-next`. The nightly-next track
      # keeps channel `nightly` (same bundle id, profile and entitlements) and
      # differs only in publication: release, DMG names, Sparkle key, feed.
      track: ${{ steps.decide.outputs.track }}
      environment: ${{ steps.decide.outputs.environment }}
      bundle_id: ${{ steps.decide.outputs.bundle_id }}
      app_name: ${{ steps.decide.outputs.app_name }}
      url_scheme: ${{ steps.decide.outputs.url_scheme }}
      dmg_prefix: ${{ steps.decide.outputs.dmg_prefix }}
      release_tag: ${{ steps.decide.outputs.release_tag }}
      release_name: ${{ steps.decide.outputs.release_name }}
      feed_base: ${{ steps.decide.outputs.feed_base }}
      entitlements: ${{ steps.decide.outputs.entitlements }}
      icon_name: ${{ steps.decide.outputs.icon_name }}
    steps:
      # The build-input check below classifies changed paths with the same
      # router CI uses, which reads the Xcode project and the package graph.
      # Only the paths are needed, so one revision of history is enough.
      - name: Check out the revision under consideration
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Decide whether a nightly build is needed
        id: decide
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          FORCE_BUILD: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.force == 'true' && 'true' || 'false' }}
          FAST_BUILD: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.fast == 'true' && 'true' || 'false' }}
          BUILD_ONLY: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.build_only == 'true' && 'true' || 'false' }}
          SEED_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.seed_only && 'true' || 'false' }}
          COLD_CACHE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.cold_cache == 'true' && 'true' || 'false' }}
          # Minimum age, in hours, of the commit NIGHTLY last published before
          # a push to main builds again. `0` restores publish-every-push.
          PUSH_MIN_INTERVAL_HOURS: ${{ vars.NIGHTLY_PUSH_MIN_INTERVAL_HOURS || '2' }}
        with:
          script: |
            const forceBuild = process.env.FORCE_BUILD === 'true';
            const seedOnly = process.env.SEED_ONLY === 'true';
            // A build-only run measures the unsigned universal app build (cold
            // or warm cache) and stops there: no helper, signing, notarization,
            // dSYM upload, or publication, so it is safe to dispatch from a
            // branch. It always builds the production workload, so the fast
            // arm64 path is ignored, and it never depends on the nightly tag.
            const buildOnly = process.env.BUILD_ONLY === 'true';
            const coldCache = buildOnly && process.env.COLD_CACHE === 'true';
            const fastBuild = !buildOnly && process.env.FAST_BUILD === 'true';
            // Nightly ships one universal DMG for downloads plus one thin DMG per
            // architecture for updates. Browsers cannot tell Apple silicon from
            // Intel, so `cmux-nightly-macos.dmg` and the legacy `appcast.xml`
            // feed stay universal; the app's feed resolver moves every install
            // onto its architecture's feed at the first update check.
            // A manually dispatched fast build is a branch-dogfood artifact only.
            // It deliberately produces one Apple silicon DMG and never publishes
            // to the shared NIGHTLY release or feed.
            const variants = fastBuild ? ['arm64'] : ['arm64', 'x86_64', 'universal'];
            core.setOutput('variants', JSON.stringify(variants));
            core.setOutput('legacy_variant', 'universal');
            core.setOutput('fast_build', fastBuild ? 'true' : 'false');
            core.setOutput('build_only', buildOnly ? 'true' : 'false');
            core.setOutput('cold_cache', coldCache ? 'true' : 'false');
            const { owner, repo } = context.repo;
            const requestedRef = context.ref.startsWith('refs/heads/')
              ? context.ref.replace('refs/heads/', '')
              : 'main';
            const isMainRef = requestedRef === 'main';
            // `rc/<version>` branches publish the RC channel. Any other
            // non-main ref is a branch dogfood run that publishes nothing.
            const isRcRef = requestedRef.startsWith('rc/');
            // `nightly-next` publishes the cmux-next track (see the header).
            const isNextRef = requestedRef === 'nightly-next';
            const isTrackRef = isMainRef || isNextRef;
            const channel = isRcRef ? 'rc' : 'nightly';
            const track = isRcRef ? 'rc' : isNextRef ? 'nightly-next' : 'nightly';
            const channelIdentity = {
              nightly: {
                bundleId: 'com.cmuxterm.app.nightly',
                appName: 'cmux NIGHTLY',
                urlScheme: 'cmux-nightly',
                dmgPrefix: 'cmux-nightly-macos',
                releaseTag: 'nightly',
                releaseName: 'Nightly',
                feedBase: 'https://files.cmux.com/nightly',
                entitlements: 'cmux.nightly.entitlements',
                iconName: 'AppIcon-Nightly',
              },
              rc: {
                bundleId: 'com.cmuxterm.app.rc',
                appName: 'cmux RC',
                urlScheme: 'cmux-rc',
                dmgPrefix: 'cmux-rc-macos',
                releaseTag: 'rc',
                releaseName: 'Release Candidate',
                feedBase: 'https://files.cmux.com/rc',
                entitlements: 'cmux.rc.entitlements',
                iconName: 'AppIcon-RC',
              },
              'nightly-next': {
                bundleId: 'com.cmuxterm.app.nightly',
                appName: 'cmux NIGHTLY',
                urlScheme: 'cmux-nightly',
                dmgPrefix: 'cmux-nightly-next-macos',
                releaseTag: 'nightly-next',
                releaseName: 'Nightly (cmux-next)',
                feedBase: process.env.NIGHTLY_NEXT_FEED_BASE,
                entitlements: 'cmux.nightly.entitlements',
                iconName: 'AppIcon-Nightly',
              },
            }[track];
            core.setOutput('channel', channel);
            core.setOutput('track', track);
            core.setOutput('environment', isNextRef ? 'release-next' : 'release');
            core.setOutput('channel_upper', channel.toUpperCase());
            core.setOutput('bundle_id', channelIdentity.bundleId);
            core.setOutput('app_name', channelIdentity.appName);
            core.setOutput('url_scheme', channelIdentity.urlScheme);
            core.setOutput('dmg_prefix', channelIdentity.dmgPrefix);
            core.setOutput('release_tag', channelIdentity.releaseTag);
            core.setOutput('release_name', channelIdentity.releaseName);
            core.setOutput('feed_base', channelIdentity.feedBase);
            core.setOutput('entitlements', channelIdentity.entitlements);
            core.setOutput('icon_name', channelIdentity.iconName);

            // Pin every run to the revision that triggered it. In particular,
            // queued main pushes must each build their own merge commit instead
            // of all resolving to whichever commit is newest when `decide` runs.
            const headSha = context.sha;

            // The channel's release tag is the fast completion marker. The
            // release body is the publication record: it also tells us that a
            // previous run finished uploading this exact commit even when the
            // tag move was refused after the assets and feeds were live.
            let nightlySha = null;
            if (isTrackRef) {
              try {
                const ref = await github.rest.git.getRef({
                  owner,
                  repo,
                  ref: `tags/${channelIdentity.releaseTag}`,
                });
                if (ref.data.object.type === 'commit') {
                  nightlySha = ref.data.object.sha;
                } else if (ref.data.object.type === 'tag') {
                  const tagObject = await github.rest.git.getTag({
                    owner,
                    repo,
                    tag_sha: ref.data.object.sha,
                  });
                  nightlySha = tagObject.data.object.sha;
                }
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }

            let publishedSha = null;
            const canReadReleaseMarker =
              typeof github.rest.repos?.getReleaseByTag === 'function' &&
              typeof exec !== 'undefined' &&
              typeof exec.getExecOutput === 'function';
            if (canReadReleaseMarker) {
              try {
                const release = await github.rest.repos.getReleaseByTag({
                  owner,
                  repo,
                  tag: channelIdentity.releaseTag,
                });
                const marker = await exec.getExecOutput(
                  'python3',
                  ['scripts/ci/nightly-publication-marker.py'],
                  { input: Buffer.from(release.data.body || '') },
                );
                publishedSha = marker.stdout.trim() || null;
              } catch (error) {
                if (error.status === 404) {
                  // The first publication creates the release.
                } else {
                  core.warning(`Could not read the published ${channelIdentity.releaseTag} release marker; building: ${error.message}`);
                }
              }
            }

            const alreadyPublished = !buildOnly && !forceBuild && (isTrackRef || isRcRef) && publishedSha === headSha;
            let shouldBuild = !seedOnly && !alreadyPublished && (buildOnly || !isTrackRef || forceBuild || nightlySha !== headSha);
            // The six-hour schedule only warms caches downstream, and keeps
            // its eligibility outputs as they are so that routing still works.
            // It is named here because the build-input check below leaves it
            // alone, and it explains the final app workload further down.
            const scheduledCacheOnly = context.eventName === 'schedule' &&
              context.payload?.schedule === '17 */6 * * *';

            // A different commit is not a different app. Web, documentation
            // and CI-only merges land between the changes that can alter app
            // bytes, and each one otherwise costs a full publishing build, so
            // compare the paths changed since the published commit rather than
            // the commit itself. Only a proven-neutral change skips: a partial
            // comparison, an unknown path, or an API failure builds, force and
            // manual dispatch never consult this, and the daily catch-up
            // schedule still publishes main HEAD as a backstop.
            let unchangedBuildInputs = false;
            let buildInputReason = null;
            if (
              shouldBuild &&
              isMainRef &&
              nightlySha &&
              !forceBuild &&
              !buildOnly &&
              // A person asking for this revision by hand gets it, and the
              // 08:47 UTC catch-up still publishes main HEAD every day. That
              // keeps one daily build as a backstop, so a path this check
              // wrongly classifies costs at most a day of staleness.
              context.eventName !== 'workflow_dispatch' &&
              context.eventName !== 'schedule'
            ) {
              try {
                const { data } = await github.rest.repos.compareCommitsWithBasehead({
                  owner,
                  repo,
                  basehead: `${nightlySha}...${headSha}`,
                });
                // Cumulative since the last published commit, not since the
                // previous push. A three-dot comparison only spans that whole
                // gap when the published commit is the merge base. GitHub
                // caps the file list at 300 entries and paginates commits, so
                // require a list that is under the cap and a commit count that
                // matches the total: a partial answer must not read as proof.
                const files = data.files;
                if (
                  data.status === 'ahead' &&
                  data.merge_base_commit?.sha === nightlySha &&
                  data.total_commits === data.commits?.length &&
                  Array.isArray(files) &&
                  files.length > 0 &&
                  files.length < 300
                ) {
                  const paths = files.flatMap((file) =>
                    [file.filename, file.previous_filename].filter(Boolean));
                  const classified = await exec.getExecOutput(
                    'python3',
                    ['scripts/ci/nightly_build_inputs.py', '--files-from', '-'],
                    { input: Buffer.from(`${paths.join('\n')}\n`) },
                  );
                  const decision = JSON.parse(classified.stdout.trim());
                  unchangedBuildInputs = decision.build_inputs_changed === false;
                  buildInputReason = decision.reason;
                }
              } catch (error) {
                core.warning(`Could not prove the Nightly build inputs unchanged; building: ${error.message}`);
              }
            }
            if (unchangedBuildInputs) shouldBuild = false;

            // Push throttle. Main merges arrive faster than one nightly takes
            // to build, sign, and publish (about 45 minutes), so publishing
            // every push keeps the macOS pipeline busy around the clock and
            // most builds are replaced within the hour. A push to main skips
            // while the published commit is younger than the interval. Only
            // `push` events on main are throttled: RC branches, manual
            // dispatches, and both schedules decide exactly as before, and the
            // 08:47 UTC schedule still publishes whatever main HEAD is then.
            // Any lookup failure builds.
            const minIntervalHours = Number(process.env.PUSH_MIN_INTERVAL_HOURS);
            let publishedCommitAgeHours = null;
            let pushThrottled = false;
            if (
              shouldBuild &&
              context.eventName === 'push' &&
              isMainRef &&
              nightlySha &&
              Number.isFinite(minIntervalHours) &&
              minIntervalHours > 0
            ) {
              try {
                const published = await github.rest.git.getCommit({
                  owner,
                  repo,
                  commit_sha: nightlySha,
                });
                const committedAt = Date.parse(published.data.committer.date);
                if (Number.isFinite(committedAt)) {
                  publishedCommitAgeHours = (Date.now() - committedAt) / 3_600_000;
                  pushThrottled = publishedCommitAgeHours < minIntervalHours;
                }
              } catch (error) {
                core.warning(`Could not read the published ${channelIdentity.releaseTag} commit; building: ${error.message}`);
              }
            }
            let decisionReason;
            if (seedOnly) {
              decisionReason = 'Manual cache-only run: refresh compilation caches without building or publishing an app.';
            } else if (scheduledCacheOnly) {
              decisionReason = 'Scheduled cache warmup: refresh compilation caches only. The daily 08:47 UTC schedule is the app catch-up run.';
            } else if (unchangedBuildInputs) {
              decisionReason =
                `Skipping this build: nothing that reaches the app changed since ${nightlySha.slice(0, 7)} ` +
                `(${buildInputReason}). Use force=true in Run workflow to build this commit anyway.`;
            } else if (alreadyPublished) {
              decisionReason =
                `Skipping this build: ${channelIdentity.releaseTag} release metadata already records the exact ` +
                `published commit ${headSha}; a stale tag will be repaired by the next eligible publication. ` +
                'Use force=true in Run workflow to rebuild the same commit.';
            } else if (!shouldBuild) {
              decisionReason = 'This main commit is already published. Use force=true in Run workflow to rebuild the same commit; manual runs already bypass the push throttle.';
            } else if (pushThrottled) {
              decisionReason =
                `Skipping this push: ${channelIdentity.releaseTag} published ${nightlySha.slice(0, 7)}, ` +
                `committed ${publishedCommitAgeHours.toFixed(2)}h ago (minimum ${minIntervalHours}h). ` +
                'A later eligible push or the 08:47 UTC catch-up can publish an updated main revision. Run workflow bypasses this throttle; force is only needed to rebuild an already published commit.';
            } else if (buildOnly) {
              decisionReason = 'Manual build-only measurement: build the unsigned app without publishing.';
            } else if (fastBuild) {
              decisionReason = 'Manual fast dogfood build: build an arm64 artifact without publishing the Nightly feed.';
            } else if (context.eventName === 'workflow_dispatch') {
              decisionReason = 'Manual dispatch bypasses the push throttle; build the selected revision.';
            } else {
              decisionReason = 'The selected revision needs an app build and is not push-throttled.';
            }
            core.notice(decisionReason);

            const shouldPublish = !seedOnly && (isTrackRef || isRcRef) && !buildOnly && !fastBuild;
            const appBuildSelected = shouldBuild && !pushThrottled && !scheduledCacheOnly;
            core.setOutput('should_build', shouldBuild && !pushThrottled ? 'true' : 'false');
            core.setOutput('head_sha', headSha);
            core.setOutput('short_sha', headSha.slice(0, 7));
            core.setOutput('published_sha', publishedSha || '');
            core.setOutput('should_publish', shouldPublish ? 'true' : 'false');
            core.summary
              .addHeading(`${channelIdentity.releaseName} build decision`)
              .addTable([
                [{data: 'requested ref', header: true}, requestedRef],
                [{data: 'channel', header: true}, channel],
                [{data: 'track', header: true}, track],
                [{data: 'build HEAD', header: true}, headSha],
                [{data: 'nightly tag', header: true}, nightlySha ?? '(missing)'],
                [{data: 'release body published commit', header: true}, publishedSha ?? '(missing)'],
                [{data: 'reason', header: true}, decisionReason],
                [{data: 'force build', header: true}, String(forceBuild)],
                [{data: 'push minimum commit age (hours)', header: true}, Number.isFinite(minIntervalHours) && minIntervalHours > 0 ? String(minIntervalHours) : '(disabled)'],
                [{data: 'published commit age (hours)', header: true}, publishedCommitAgeHours === null ? '(not checked)' : publishedCommitAgeHours.toFixed(2)],
                [{data: 'push throttled', header: true}, String(pushThrottled)],
                [{data: 'app build inputs changed', header: true}, buildInputReason === null ? '(not checked)' : String(!unchangedBuildInputs)],
                [{data: 'app build selected', header: true}, String(appBuildSelected)],
                [{data: 'publish app this run', header: true}, String(appBuildSelected && shouldPublish)],
                [{data: 'fast dogfood build', header: true}, String(fastBuild)],
                [{data: 'build-only measurement', header: true}, String(buildOnly)],
                [{data: 'cold compilation cache', header: true}, String(coldCache)],
                [{data: 'variants', header: true}, variants.join(', ')],
              ])
              .write();

  probe-nightly-tag-permission:
    if: github.event_name == 'workflow_dispatch' && inputs.tag_permission_probe == true
    uses: ./.github/workflows/nightly-tag-permission-probe.yml
    with:
      target_sha: ${{ inputs.probe_target_sha || github.sha }}
      mode: ${{ inputs.probe_mode || 'both' }}
    secrets: inherit

  refresh-compilation-cache:
    needs: decide
    # The schedule skips this Blacksmith warmer while owned pools serve pull
    # requests (CI_PR_POOL_OWNED is 1). build-nightly-app saves the same key on
    # every published main push, so the remaining Blacksmith readers (main's
    # full-suite dispatch, nightly's Blacksmith fallback) restore at worst an
    # older entry by prefix. A seed_only dispatch still warms it on demand.
    if: github.event_name == 'schedule' && github.event.schedule == '17 */6 * * *' && vars.CI_PR_POOL_OWNED != '1' || github.event_name == 'workflow_dispatch' && inputs.seed_only
    # Match the PR Release-build runner and Xcode so its compilation cache is reusable.
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || vars.MACOS_RUNNER_26 || 'blacksmith-6vcpu-macos-26' }}
    environment: ${{ github.ref == 'refs/heads/main' && 'ci-cache-writer' || '' }}
    # This job rebuilds the cache after the store drops it, so it runs cold
    # by design; scheduled run 35134963192 was cancelled at 45 minutes.
    timeout-minutes: 90
    env:
      CMUX_CI_XCODE_APP: ${{ vars.CMUX_CI_XCODE_APP_MACOS_26 }}
      CMUX_CI_REQUIRED_MACOS_SDK_MAJOR: "26"
    steps:
      - name: Clear stale git locks (self-hosted reused workspace)
        shell: bash
        run: |
          ws="${GITHUB_WORKSPACE:-$PWD}"
          rm -f "$ws/.git/index.lock" 2>/dev/null || true
          if [ -d "$ws/.git/modules" ]; then
            find "$ws/.git/modules" -type f -name "*.lock" -delete 2>/dev/null || true
          fi

      - name: Checkout cache ref
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ needs.decide.outputs.head_sha }}
          fetch-depth: 0
          submodules: recursive

      - name: Select Xcode
        run: ./scripts/select-ci-xcode.sh

      - name: Compute Xcode compilation cache key
        id: compilation-cache-key
        run: |
          set -euo pipefail
          echo "toolchain=$(xcodebuild -version | shasum -a 256 | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Restore Xcode compilation cache
        id: compilation-cache-restore
        uses: ./.github/actions/cache-restore
        with:
          backend: ${{ inputs.cache_backend != 'default' && inputs.cache_backend || vars.CI_CACHE_BACKEND || 'r2' }}
          path: build-universal/CompilationCache.noindex
          key: xcode-compilation-release-${{ runner.os }}-${{ runner.arch }}-${{ steps.compilation-cache-key.outputs.toolchain }}-${{ needs.decide.outputs.head_sha }}
          restore-keys: |
            xcode-compilation-release-${{ runner.os }}-${{ runner.arch }}-${{ steps.compilation-cache-key.outputs.toolchain }}-

      - name: Install compilation dependencies
        if: steps.compilation-cache-restore.outputs.cache-hit != 'true'
        run: |
          ./scripts/install-rust-ci.sh
          ./scripts/install-zig-ci.sh
          ./scripts/download-prebuilt-ghosttykit.sh

      - name: Build in-tree acpmux for the compilation cache
        if: steps.compilation-cache-restore.outputs.cache-hit != 'true'
        env:
          CMUX_NEXT_ACPMUX_ARCHS: arm64,x86_64
        run: |
          set -euo pipefail
          acpmux_bin="$RUNNER_TEMP/cmux-next-acpmux/acpmux"
          scripts/cmux-next/build-acpmux.sh --output "$acpmux_bin"
          echo "CMUX_NEXT_ACPMUX_BIN=$acpmux_bin" >> "$GITHUB_ENV"

      - name: Cache Swift packages
        id: swift-packages-restore
        if: steps.compilation-cache-restore.outputs.cache-hit != 'true'
        uses: ./.github/actions/cache-restore
        with:
          backend: ${{ inputs.cache_backend != 'default' && inputs.cache_backend || vars.CI_CACHE_BACKEND || 'r2' }}
          path: .spm-cache
          key: spm-${{ hashFiles('cmux.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'scripts/ci/swiftpm-cache-layout') }}
          restore-keys: spm-

      - name: Sanitize Swift package cache
        if: steps.compilation-cache-restore.outputs.cache-hit != 'true'
        run: python3 scripts/ci/sanitize-xcode-source-packages-cache.py .spm-cache

      - name: Refresh universal nightly compilation cache
        if: steps.compilation-cache-restore.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          # The warmer only fills the Swift compilation cache; the Chromium
          # engine is a prebuilt artifact the shipped build embeds itself.
          CMUX_NEXT_SKIP_CEF=1 CMUX_SKIP_ZIG_BUILD=1 xcodebuild -scheme cmux -configuration Release -derivedDataPath build-universal \
            -destination 'generic/platform=macOS' \
            -clonedSourcePackagesDirPath .spm-cache \
            -packageCachePath "$PWD/.spm-cache/.package-cache" \
            -showBuildTimingSummary \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            COMPILATION_CACHE_ENABLE_CACHING=YES \
            COMPILATION_CACHE_LIMIT_SIZE=3221225472 \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO ASSETCATALOG_COMPILER_APPICON_NAME=AppIcon-Nightly build

      - name: Bound Xcode compilation cache size
        id: compilation-cache-bound
        if: steps.compilation-cache-restore.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          cache_path="build-universal/CompilationCache.noindex"
          max_cache_kib=$((5 * 1024 * 1024))
          if [ -d "$cache_path" ]; then
            # Xcode's CAS chains v1.N generations: the newest is the primary,
            # the one before it is the upstream it faults objects in from, and
            # anything older is dead until the CAS's next garbage collection.
            # The CAS rotates a new primary whenever the current one ends a
            # build above half of COMPILATION_CACHE_LIMIT_SIZE (1.5 GiB here,
            # below one build's 3.3 GB working set), so every warm build leaves
            # a dead generation behind, the directory measures two full builds
            # (6.6 GB on main), and this bound used to drop every warm cache.
            # Prune the dead generations first, exactly as the CAS would.
            python3 scripts/ci/prune-xcode-compilation-cache.py "$cache_path" \
              || echo "::warning::Xcode compilation cache pruning failed; measuring it unpruned"
            cache_kib=$(du -sk "$cache_path" | awk '{print $1}')
          else
            cache_kib=0
          fi
          echo "Xcode compilation cache size: ${cache_kib} KiB (limit: ${max_cache_kib} KiB)"
          save=false
          if [ "$cache_kib" -gt "$max_cache_kib" ]; then
            # Nothing is saved, so the next build restores the same older entry
            # and lands here again: the cache freezes at its last saved entry
            # until the bound (and COMPILATION_CACHE_LIMIT_SIZE) is raised.
            echo "::warning::Xcode compilation cache exceeds 5 GiB; skipping cache save"
            rm -rf "$cache_path"
          elif [ "$cache_kib" -gt 0 ]; then
            save=true
          else
            echo "Xcode compilation cache is empty; skipping cache save"
          fi
          echo "save=${save}" >> "$GITHUB_OUTPUT"

      - name: Save Xcode compilation cache
        if: steps.compilation-cache-restore.outputs.cache-hit != 'true' && steps.compilation-cache-bound.outputs.save == 'true'
        uses: ./.github/actions/cache-save
        env:
          # Only an R2 save sees the bucket credentials.
          AWS_ACCESS_KEY_ID: ${{ (inputs.cache_backend != 'default' && inputs.cache_backend || vars.CI_CACHE_BACKEND) == 'r2' && secrets.CI_CACHE_R2_ACCESS_KEY_ID || '' }}
          AWS_SECRET_ACCESS_KEY: ${{ (inputs.cache_backend != 'default' && inputs.cache_backend || vars.CI_CACHE_BACKEND) == 'r2' && secrets.CI_CACHE_R2_SECRET_ACCESS_KEY || '' }}
          CI_CACHE_R2_ENDPOINT: ${{ (inputs.cache_backend != 'default' && inputs.cache_backend || vars.CI_CACHE_BACKEND) == 'r2' && format('https://{0}.r2.cloudflarestorage.com', secrets.CI_CACHE_R2_ACCOUNT_ID) || '' }}
          CI_CACHE_R2_BUCKET: ${{ vars.CI_CACHE_R2_BUCKET }}
        with:
          backend: ${{ inputs.cache_backend != 'default' && inputs.cache_backend || vars.CI_CACHE_BACKEND || 'r2' }}
          path: build-universal/CompilationCache.noindex
          key: xcode-compilation-release-${{ runner.os }}-${{ runner.arch }}-${{ steps.compilation-cache-key.outputs.toolchain }}-${{ needs.decide.outputs.head_sha }}

      - name: Save Swift packages
        if: steps.compilation-cache-restore.outputs.cache-hit != 'true' && steps.swift-packages-restore.outputs.cache-hit != 'true'
        uses: ./.github/actions/cache-save
        env:
          # Only an R2 save sees the bucket credentials.
          AWS_ACCESS_KEY_ID: ${{ (inputs.cache_backend != 'default' && inputs.cache_backend || vars.CI_CACHE_BACKEND) == 'r2' && secrets.CI_CACHE_R2_ACCESS_KEY_ID || '' }}
          AWS_SECRET_ACCESS_KEY: ${{ (inputs.cache_backend != 'default' && inputs.cache_backend || vars.CI_CACHE_BACKEND) == 'r2' && secrets.CI_CACHE_R2_SECRET_ACCESS_KEY || '' }}
          CI_CACHE_R2_ENDPOINT: ${{ (inputs.cache_backend != 'default' && inputs.cache_backend || vars.CI_CACHE_BACKEND) == 'r2' && format('https://{0}.r2.cloudflarestorage.com', secrets.CI_CACHE_R2_ACCOUNT_ID) || '' }}
          CI_CACHE_R2_BUCKET: ${{ vars.CI_CACHE_R2_BUCKET }}
        with:
          backend: ${{ inputs.cache_backend != 'default' && inputs.cache_backend || vars.CI_CACHE_BACKEND || 'r2' }}
          path: .spm-cache
          key: spm-${{ hashFiles('cmux.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'scripts/ci/swiftpm-cache-layout') }}

  refresh-test-compilation-cache:
    needs: decide
    # The schedule skips this Blacksmith seeder while owned pools serve pull
    # requests (CI_PR_POOL_OWNED is 1): admission then runs on owned minis that
    # keep their own DerivedData, and seed-derived-data.yml still seeds the
    # Blacksmith admission pools on main pushes that change app-host build
    # inputs. Those incremental chains then get no six-hourly cold reset; a
    # seed_only dispatch still writes one on demand.
    # Writes the cold DerivedData seed that ci-macos.yml compile admission
    # adopts, and the Debug compilation cache. Admission no longer restores
    # that cache (the app target missed on every file; see
    # tests/test_ci_test_compilation_cache_seed.sh), so it has no reader on
    # main today. Scheduled, not per push: a build per merge would take macOS
    # slots from the pull request queue.
    if: github.event_name == 'schedule' && github.event.schedule == '17 */6 * * *' && vars.CI_PR_POOL_OWNED != '1' || github.event_name == 'workflow_dispatch' && inputs.seed_only
    # Match the admission job's runner and Xcode. The cache key carries the
    # toolchain and the build paths, so a mismatch is a miss, not a wrong hit.
    # Pull requests are what restore this seed, so track the runner the
    # admission job picks for `pull_request`, not the merge-queue one. On the
    # 6 vCPU macOS 26 pool, use its 12 vCPU sibling: same image and Xcode,
    # no pull-request queue (see seed-derived-data.yml). The macOS 15 pool,
    # which pr_runner_pool.py overflows pull requests to, gets its own cold
    # seed on its own Xcode too, so its per-push seed chain never carries
    # stale intermediates for long either (while this schedule runs; see the
    # CI_PR_POOL_OWNED gate above). Its keys carry that Xcode in the
    # fingerprint, so the two never write each other's entries.
    strategy:
      fail-fast: false
      matrix:
        pool:
          - ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || vars.MACOS_RUNNER_PR == 'blacksmith-6vcpu-macos-26' && 'blacksmith-12vcpu-macos-26' || vars.MACOS_RUNNER_PR || 'blacksmith-6vcpu-macos-15' }}
          - ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || 'blacksmith-6vcpu-macos-15' }}
    runs-on: ${{ matrix.pool }}
    environment: ${{ github.ref == 'refs/heads/main' && 'ci-cache-writer' || '' }}
    timeout-minutes: 75
    env:
      # As seed-derived-data.yml: the macOS 15 pool's own Xcode, else the lane's.
      CMUX_CI_XCODE_APP: ${{ endsWith(matrix.pool, 'vcpu-macos-15') && vars.CMUX_CI_XCODE_APP_MACOS_15 || vars.CMUX_CI_XCODE_APP_PR || vars.CMUX_CI_XCODE_APP_MACOS_15 }}
      CMUX_CI_REQUIRED_MACOS_SDK_MAJOR: "26"
      CMUX_SKIP_ZIG_BUILD: "1"
    steps:
      - name: Clear stale git locks (self-hosted reused workspace)
        shell: bash
        run: |
          ws="${GITHUB_WORKSPACE:-$PWD}"
          rm -f "$ws/.git/index.lock" 2>/dev/null || true
          if [ -d "$ws/.git/modules" ]; then
            find "$ws/.git/modules" -type f -name "*.lock" -delete 2>/dev/null || true
          fi

      - name: Checkout cache ref
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ needs.decide.outputs.head_sha }}
          submodules: recursive

      - name: Prepare admission build paths
        run: |
          set -euo pipefail
          # The same paths as ci.yml `macos-compile-admission`: they are part of
          # every cache entry this job writes.
          # Fixed paths survive across jobs on persistent runners. Clear them
          # before any trusted product/cache restoration.
          root="${CMUX_CI_CANONICAL_ROOT:-/private/tmp/cmux-ci}"
          scripts/ci/clear-dirs.sh "$root/derived-data-compile-admission" "$root/compile-admission-cas"
          echo "CMUX_COMPILE_ADMISSION_DERIVED_DATA=${CMUX_CI_CANONICAL_ROOT:-/private/tmp/cmux-ci}/derived-data-compile-admission" >> "$GITHUB_ENV"
          echo "CMUX_COMPILE_ADMISSION_CAS=${CMUX_CI_CANONICAL_ROOT:-/private/tmp/cmux-ci}/compile-admission-cas" >> "$GITHUB_ENV"

      - name: Select Xcode
        run: ./scripts/select-ci-xcode.sh

      - name: Compute test compilation cache key
        id: compilation-cache-key
        run: |
          set -euo pipefail
          echo "fingerprint=$(scripts/ci/compile-app-host-test-product.sh canonical-fingerprint "$CMUX_COMPILE_ADMISSION_DERIVED_DATA")" >> "$GITHUB_OUTPUT"

      - name: Restore test compilation cache
        id: compilation-cache-restore
        # Exact key only, so the seed is always one clean build. Restoring the
        # last seed by prefix stacked another build's objects onto the CAS every
        # run: the primary generation and the upstream it faults from grew 3.5 ->
        # 5.0 GiB over eight runs, crossed the bound below, and then no run could
        # save again. A cold build covers all of main, and measured smaller and
        # faster than a stacked one. Only a re-run of the same revision hits here.
        uses: ./.github/actions/cache-restore
        with:
          backend: ${{ inputs.cache_backend != 'default' && inputs.cache_backend || vars.CI_CACHE_BACKEND || 'r2' }}
          path: ${{ env.CMUX_COMPILE_ADMISSION_CAS }}
          key: xcode-compilation-test-${{ runner.os }}-${{ runner.arch }}-${{ steps.compilation-cache-key.outputs.fingerprint }}-${{ needs.decide.outputs.head_sha }}

      - name: Install compilation dependencies
        if: steps.compilation-cache-restore.outputs.cache-hit != 'true'
        run: |
          ./scripts/install-rust-ci.sh
          ./scripts/download-prebuilt-ghosttykit.sh

      - name: Cache Swift packages
        id: swift-packages-restore
        if: steps.compilation-cache-restore.outputs.cache-hit != 'true'
        uses: ./.github/actions/cache-restore
        with:
          backend: ${{ inputs.cache_backend != 'default' && inputs.cache_backend || vars.CI_CACHE_BACKEND || 'r2' }}
          path: .ci-source-packages
          key: spm-${{ hashFiles('cmux.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'scripts/ci/swiftpm-cache-layout') }}
          restore-keys: spm-

      - name: Sanitize Swift package cache
        if: steps.compilation-cache-restore.outputs.cache-hit != 'true'
        run: python3 scripts/ci/sanitize-xcode-source-packages-cache.py .ci-source-packages

      - name: Resolve Swift packages
        if: steps.compilation-cache-restore.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          scripts/ci/compile-app-host-test-product.sh canonical-resolve \
            "$CMUX_COMPILE_ADMISSION_DERIVED_DATA" "$PWD/.ci-source-packages"

      # ci-macos.yml compile admission adopts this build's DerivedData for pull
      # requests. The recorded content and times are how it tells which inputs
      # a later revision changed. See scripts/ci/seed_derived_data.py.
      - name: Record DerivedData seed inputs
        id: derived-data-record
        if: steps.compilation-cache-restore.outputs.cache-hit != 'true'
        continue-on-error: true
        run: python3 scripts/ci/seed_derived_data.py record "$CMUX_CI_CANONICAL_SRC" "$CMUX_COMPILE_ADMISSION_DERIVED_DATA"

      - name: Refresh test compilation cache
        if: steps.compilation-cache-restore.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          scripts/ci/compile-app-host-test-product.sh canonical-build \
            "$CMUX_COMPILE_ADMISSION_DERIVED_DATA" \
            "$PWD/.ci-source-packages" \
            "$CMUX_COMPILE_ADMISSION_CAS"

      - name: Bound test compilation cache size
        id: compilation-cache-bound
        if: steps.compilation-cache-restore.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          cache_path="$CMUX_COMPILE_ADMISSION_CAS"
          max_cache_kib=$((5 * 1024 * 1024))
          if [ -d "$cache_path" ]; then
            # See `refresh-compilation-cache`: a warm build leaves a dead CAS
            # generation behind, and pruning it keeps the seed to one build.
            python3 scripts/ci/prune-xcode-compilation-cache.py "$cache_path" \
              || echo "::warning::Xcode compilation cache pruning failed; measuring it unpruned"
            cache_kib=$(du -sk "$cache_path" | awk '{print $1}')
          else
            cache_kib=0
          fi
          echo "Test compilation cache size: ${cache_kib} KiB (limit: ${max_cache_kib} KiB)"
          save=false
          if [ "$cache_kib" -gt "$max_cache_kib" ]; then
            echo "::warning::Test compilation cache exceeds 5 GiB; skipping cache save"
          elif [ "$cache_kib" -gt 0 ]; then
            save=true
          else
            echo "Test compilation cache is empty; skipping cache save"
          fi
          echo "save=${save}" >> "$GITHUB_OUTPUT"

      - name: Save test compilation cache
        if: steps.compilation-cache-restore.outputs.cache-hit != 'true' && steps.compilation-cache-bound.outputs.save == 'true'
        uses: ./.github/actions/cache-save
        env:
          # Only an R2 save sees the bucket credentials.
          AWS_ACCESS_KEY_ID: ${{ (inputs.cache_backend != 'default' && inputs.cache_backend || vars.CI_CACHE_BACKEND) == 'r2' && secrets.CI_CACHE_R2_ACCESS_KEY_ID || '' }}
          AWS_SECRET_ACCESS_KEY: ${{ (inputs.cache_backend != 'default' && inputs.cache_backend || vars.CI_CACHE_BACKEND) == 'r2' && secrets.CI_CACHE_R2_SECRET_ACCESS_KEY || '' }}
          CI_CACHE_R2_ENDPOINT: ${{ (inputs.cache_backend != 'default' && inputs.cache_backend || vars.CI_CACHE_BACKEND) == 'r2' && format('https://{0}.r2.cloudflarestorage.com', secrets.CI_CACHE_R2_ACCOUNT_ID) || '' }}
          CI_CACHE_R2_BUCKET: ${{ vars.CI_CACHE_R2_BUCKET }}
        with:
          backend: ${{ inputs.cache_backend != 'default' && inputs.cache_backend || vars.CI_CACHE_BACKEND || 'r2' }}
          path: ${{ env.CMUX_COMPILE_ADMISSION_CAS }}
          key: xcode-compilation-test-${{ runner.os }}-${{ runner.arch }}-${{ steps.compilation-cache-key.outputs.fingerprint }}-${{ needs.decide.outputs.head_sha }}

      # canonical-resolve copies the workspace to the canonical root and
      # resolves there, so the workspace copy is still exactly what was
      # restored. Save what the resolve wrote, or a fallback restore of an
      # older layout is saved again under the current key.
      - name: Collect resolved Swift packages
        if: steps.compilation-cache-restore.outputs.cache-hit != 'true' && steps.swift-packages-restore.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          resolved="${CMUX_CI_CANONICAL_ROOT:-/private/tmp/cmux-ci}/src/.ci-source-packages"
          test -d "$resolved/.package-cache"
          rsync -a --delete "$resolved/" .ci-source-packages/

      - name: Save Swift packages
        if: steps.compilation-cache-restore.outputs.cache-hit != 'true' && steps.swift-packages-restore.outputs.cache-hit != 'true'
        uses: ./.github/actions/cache-save
        env:
          # Only an R2 save sees the bucket credentials.
          AWS_ACCESS_KEY_ID: ${{ (inputs.cache_backend != 'default' && inputs.cache_backend || vars.CI_CACHE_BACKEND) == 'r2' && secrets.CI_CACHE_R2_ACCESS_KEY_ID || '' }}
          AWS_SECRET_ACCESS_KEY: ${{ (inputs.cache_backend != 'default' && inputs.cache_backend || vars.CI_CACHE_BACKEND) == 'r2' && secrets.CI_CACHE_R2_SECRET_ACCESS_KEY || '' }}
          CI_CACHE_R2_ENDPOINT: ${{ (inputs.cache_backend != 'default' && inputs.cache_backend || vars.CI_CACHE_BACKEND) == 'r2' && format('https://{0}.r2.cloudflarestorage.com', secrets.CI_CACHE_R2_ACCOUNT_ID) || '' }}
          CI_CACHE_R2_BUCKET: ${{ vars.CI_CACHE_R2_BUCKET }}
        with:
          backend: ${{ inputs.cache_backend != 'default' && inputs.cache_backend || vars.CI_CACHE_BACKEND || 'r2' }}
          path: .ci-source-packages
          key: spm-${{ hashFiles('cmux.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'scripts/ci/swiftpm-cache-layout') }}

      # R2 only: a multi-gigabyte entry in the GitHub store evicts the seeds
      # above (#13160). A failure here never fails the seed.
      - name: Bound DerivedData seed size
        id: derived-data-bound
        if: steps.compilation-cache-restore.outputs.cache-hit != 'true' && steps.derived-data-record.outcome == 'success' && (inputs.cache_backend != 'default' && inputs.cache_backend || vars.CI_CACHE_BACKEND || 'r2') == 'r2'
        continue-on-error: true
        run: python3 scripts/ci/seed_derived_data.py prune "$CMUX_COMPILE_ADMISSION_DERIVED_DATA"

      # Seeds serve only the Swift job width they were built at; see
      # scripts/ci/seed_derived_data.py.
      - name: Scope DerivedData seed key
        id: derived-data-seed-key
        if: steps.derived-data-bound.outputs.save == 'true'
        continue-on-error: true
        env:
          FINGERPRINT: ${{ steps.compilation-cache-key.outputs.fingerprint }}
        run: echo "scoped=$(python3 scripts/ci/seed_derived_data.py scope "admission-derived-data-v1-${RUNNER_OS}-${RUNNER_ARCH}-${FINGERPRINT}-")" >> "$GITHUB_OUTPUT"

      - name: Save DerivedData seed
        if: steps.derived-data-bound.outputs.save == 'true' && steps.derived-data-seed-key.outputs.scoped != ''
        continue-on-error: true
        uses: ./.github/actions/cache-save
        env:
          # Only an R2 save sees the bucket credentials.
          AWS_ACCESS_KEY_ID: ${{ (inputs.cache_backend != 'default' && inputs.cache_backend || vars.CI_CACHE_BACKEND) == 'r2' && secrets.CI_CACHE_R2_ACCESS_KEY_ID || '' }}
          AWS_SECRET_ACCESS_KEY: ${{ (inputs.cache_backend != 'default' && inputs.cache_backend || vars.CI_CACHE_BACKEND) == 'r2' && secrets.CI_CACHE_R2_SECRET_ACCESS_KEY || '' }}
          CI_CACHE_R2_ENDPOINT: ${{ (inputs.cache_backend != 'default' && inputs.cache_backend || vars.CI_CACHE_BACKEND) == 'r2' && format('https://{0}.r2.cloudflarestorage.com', secrets.CI_CACHE_R2_ACCOUNT_ID) || '' }}
          CI_CACHE_R2_BUCKET: ${{ vars.CI_CACHE_R2_BUCKET }}
        with:
          backend: r2
          path: ${{ env.CMUX_COMPILE_ADMISSION_DERIVED_DATA }}
          key: ${{ steps.derived-data-seed-key.outputs.scoped }}${{ needs.decide.outputs.head_sha }}

  build-nightly-ghostty-cli-helper:
    needs: decide
    if: needs.decide.outputs.should_build == 'true' && (github.event_name != 'schedule' || github.event.schedule == '47 8 * * *') && needs.decide.outputs.build_only != 'true'
    # Zig 0.15.2 cannot link the real helper on macOS 26. Match the stable
    # release workflow by building and verifying it on macOS 15 instead.
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'macos-15' || (needs.decide.outputs.fast_build == 'true' && 'blacksmith-6vcpu-macos-15' || vars.CI_PAID_MACOS_OVERFLOW == '1' && vars.MACOS_RUNNER_15 || 'blacksmith-6vcpu-macos-15') }}
    timeout-minutes: 20
    env:
      NIGHTLY_FAST_BUILD: ${{ needs.decide.outputs.fast_build }}
    steps:
      - name: Clear stale git locks (self-hosted reused workspace)
        shell: bash
        run: |
          ws="${GITHUB_WORKSPACE:-$PWD}"
          rm -f "$ws/.git/index.lock" 2>/dev/null || true
          if [ -d "$ws/.git/modules" ]; then
            find "$ws/.git/modules" -type f -name "*.lock" -delete 2>/dev/null || true
          fi

      - name: Checkout helper ref
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ needs.decide.outputs.head_sha }}
          submodules: recursive

      - name: Install Zig
        run: ./scripts/install-zig-ci.sh

      - name: Cache Zig packages
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/zig
          key: zig-packages-${{ hashFiles('ghostty/build.zig.zon', 'ghostty/build.zig.zon.json') }}
          restore-keys: zig-packages-

      - name: Build Ghostty CLI helper
        run: |
          set -euo pipefail
          mkdir -p nightly-helper
          if [[ "$NIGHTLY_FAST_BUILD" == "true" ]]; then
            ./scripts/build-ghostty-cli-helper.sh --target aarch64-macos --output nightly-helper/ghostty
            lipo nightly-helper/ghostty -verify_arch arm64
          else
            ./scripts/build-ghostty-cli-helper.sh --universal --output nightly-helper/ghostty
            lipo nightly-helper/ghostty -verify_arch arm64 x86_64
          fi

      - name: Upload Ghostty CLI helper
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-nightly-ghostty-cli-helper
          path: nightly-helper/ghostty
          if-no-files-found: error
          retention-days: 1

      # cmux-next release source archive: Ghostty at its submodule revision and
      # every Zig package of the build, so the MPL-2.0 source offer for Ghostty's
      # Zig packages names an archive this release publishes (and the public
      # cmux-next-src-<commit> tag) instead of upstream URLs. Built and verified
      # on every nightly-next build (twice, byte-identical); the publish job
      # attaches it only while vars.CMUX_NEXT_PUBLISH_SOURCE_ARCHIVE is 1.
      # Blocking: a Ghostty Zig package with no license text (or any other
      # collect, verify or reproducibility failure) fails this job, so the sign
      # job never runs and no nightly-next ships without the license tree.
      # tests/test_nightly_next_source_archive.py holds this.
      - name: Build the cmux-next source archive
        id: source_archive
        if: needs.decide.outputs.track == 'nightly-next' && needs.decide.outputs.fast_build != 'true'
        run: |
          set -euo pipefail
          if ! ZIG_GLOBAL_CACHE_DIR="$HOME/.cache/zig" \
            ./scripts/cmux-next/build-ghostty-source-archive.sh "$RUNNER_TEMP/source-archive"; then
            echo "::error title=cmux-next source archive failed::If the log names a Ghostty package without a license file, review its upstream license and pin the text in cmux-tui/build-support/notices/ghostty/pinned-licenses/MANIFEST.json (update PINNED_MANIFEST_SHA256 in collect-ghostty-licenses.py). nightly-next does not ship without the Ghostty license tree."
            exit 1
          fi

      # bin/cmux links libghostty-vt from the submodule ghostty-vt-sys's
      # build.rs selects, at this commit's gitlink (no product override). Every
      # Zig package it declares must be in a shipped license tree; a gap stops
      # nightly-next. tests/test_nightly_next_source_archive.py holds this.
      - name: libghostty-vt Zig packages are covered by the notices
        if: needs.decide.outputs.track == 'nightly-next' && needs.decide.outputs.fast_build != 'true'
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/source-archive"
          source="$(python3 scripts/cmux-next/notices/check_ghostty_vt_notices.py --print-source | sed -n 's/^libghostty-vt source: //p' | awk '{print $1}')"
          manifests=(--license-manifest "$out/ghostty-licenses/SOURCE-MANIFEST.json")
          [[ "$source" == ghostty ]] || manifests+=(--license-manifest "$out/$source-licenses/SOURCE-MANIFEST.json")
          python3 scripts/cmux-next/notices/check_ghostty_vt_notices.py "${manifests[@]}"

      - name: Upload the cmux-next source archive
        if: needs.decide.outputs.track == 'nightly-next' && needs.decide.outputs.fast_build != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-next-source-archive
          path: ${{ runner.temp }}/source-archive
          if-no-files-found: error
          retention-days: 3

  build-nightly-app:
    needs: decide
    outputs:
      daemon_build: ${{ steps.remote_daemon.outputs.build }}
      daemon_version: ${{ steps.remote_daemon.outputs.version }}
    if: needs.decide.outputs.should_build == 'true' && (github.event_name != 'schedule' || github.event.schedule == '47 8 * * *')
    # Owned minis first. Attempt 1 of a push or schedule run on main takes one
    # trusted owned mini while CI_PR_POOL_OWNED is 1 and both variables below
    # are set: runs-on asks for the trusted pool label (vars.CI_SEED_TRUSTED_POOL,
    # glaeda-trusted-<class>-xcode-<version>) and that runner's own label
    # (vars.CI_NIGHTLY_TRUSTED_RUNNER, glaeda-runner-<runner name>), so only a
    # runner carrying both can take it. Today that is cmux15-glaeda: the
    # trusted mini with no pull request runners and no dev-build worker. The
    # other trusted mini (cmuxs-mac-mini-6) builds team dev builds as the same
    # user, so it keeps seeding but never builds the shipped app. Its
    # job-started hook admits only main's own push and schedule jobs. Not the
    # pull request pool: this job holds the ci-cache-writer R2 keys and the
    # Sentry token, and its app is what build-sign-notarize-nightly signs and
    # ships. runner_label_policy.py holds both variables to those shapes.
    # ci-owned-pool-rescue.yml watches the run (owned_pool_rescue.py,
    # NIGHTLY_WORKFLOW_PATH): when the mini does not take the job within its
    # budget, or refuses it at job start, the failed jobs are re-run, and
    # every later attempt takes Blacksmith below. Either variable empty is
    # Blacksmith. Signing stays on Blacksmith (build-sign-notarize-nightly).
    # Blacksmith runs share the cache warmer's and stable release lane's image
    # and toolchain, which is what the compilation cache is keyed on — OS, arch
    # and toolchain, never instance size, which is deliberately larger here.
    # An owned mini keys its own lineage (see the cache key step). Fast
    # branch dogfood always uses the dedicated Blacksmith image. A
    # repository-wide runner override may point at a slower shared builder,
    # which defeats the purpose of the one-architecture path.
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || needs.decide.outputs.fast_build != 'true' && github.run_attempt == 1 && (github.event_name == 'push' || github.event_name == 'schedule') && github.ref == 'refs/heads/main' && vars.CI_PR_POOL_OWNED == '1' && vars.CI_SEED_TRUSTED_POOL != '' && vars.CI_NIGHTLY_TRUSTED_RUNNER != '' && fromJSON(format('["{0}", "{1}"]', vars.CI_SEED_TRUSTED_POOL, vars.CI_NIGHTLY_TRUSTED_RUNNER)) || (needs.decide.outputs.fast_build == 'true' && 'blacksmith-12vcpu-macos-26' || vars.CI_PAID_MACOS_OVERFLOW == '1' && vars.MACOS_RUNNER_26_LARGE || 'blacksmith-12vcpu-macos-26') }}
    environment: ${{ github.ref == 'refs/heads/main' && 'ci-cache-writer' || '' }}
    # The Blacksmith cache is scoped per branch and also drops main's own
    # entry (runs 35179030871 and 35182663752 restored nothing and were
    # cancelled at 45 minutes mid-compile), so the budget must fit a cold
    # build, not only a warm one.
    timeout-minutes: 90
    env:
      CMUX_CI_XCODE_APP: ${{ vars.CMUX_CI_XCODE_APP_MACOS_26 }}
      CMUX_CI_REQUIRED_MACOS_SDK_MAJOR: "26"
      NIGHTLY_FAST_BUILD: ${{ needs.decide.outputs.fast_build }}
      CHANNEL_ICON_NAME: ${{ needs.decide.outputs.icon_name }}
    steps:
      - name: Clear stale git locks (self-hosted reused workspace)
        shell: bash
        run: |
          ws="${GITHUB_WORKSPACE:-$PWD}"
          rm -f "$ws/.git/index.lock" 2>/dev/null || true
          if [ -d "$ws/.git/modules" ]; then
            find "$ws/.git/modules" -type f -name "*.lock" -delete 2>/dev/null || true
          fi

      - name: Checkout build ref
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ needs.decide.outputs.head_sha }}
          submodules: recursive

      - name: Select Xcode
        run: ./scripts/select-ci-xcode.sh

      # A persistent owned mini keeps the workspace between jobs. Checkout's
      # clean already drops untracked output; clear the build tree by name as
      # well, so a stale product or dSYM from an earlier job can never ship.
      - name: Clear build outputs a persistent runner kept
        run: scripts/ci/clear-dirs.sh build-universal remote-daemon-assets

      - name: Compute Xcode compilation cache key
        id: compilation-cache-key
        run: |
          set -euo pipefail
          # The key is OS, arch and toolchain. An owned mini (runner
          # <member>-glaeda[-K]) runs the same Xcode build as Blacksmith but
          # compiles in another workspace path, so its cache entries would
          # mostly miss there and push Blacksmith's own entry out of the
          # prefix restore. Fold its workspace path into the toolchain hash:
          # each lineage restores only its own, and Blacksmith's key is
          # unchanged.
          identity="$(xcodebuild -version)"
          case "${RUNNER_NAME:-}" in
            *-glaeda | *-glaeda-[0-9]*) identity="$identity"$'\n'"owned-workspace:$GITHUB_WORKSPACE" ;;
          esac
          echo "toolchain=$(printf '%s\n' "$identity" | shasum -a 256 | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Restore Xcode compilation cache
        id: compilation-cache-restore
        # A cold measurement run skips the restore; every gate below treats the
        # missing output like a cache miss, so the cold build still saves.
        if: needs.decide.outputs.cold_cache != 'true'
        uses: ./.github/actions/cache-restore
        with:
          backend: ${{ inputs.cache_backend != 'default' && inputs.cache_backend || vars.CI_CACHE_BACKEND || 'r2' }}
          path: build-universal/CompilationCache.noindex
          key: xcode-compilation-release-${{ runner.os }}-${{ runner.arch }}-${{ steps.compilation-cache-key.outputs.toolchain }}-${{ needs.decide.outputs.head_sha }}
          restore-keys: |
            xcode-compilation-release-${{ runner.os }}-${{ runner.arch }}-${{ steps.compilation-cache-key.outputs.toolchain }}-

      - name: Install compilation dependencies
        run: |
          ./scripts/install-rust-ci.sh
          ./scripts/download-prebuilt-ghosttykit.sh

      - name: Build in-tree acpmux for the compilation cache
        env:
          CMUX_NEXT_ACPMUX_ARCHS: arm64,x86_64
        run: |
          set -euo pipefail
          acpmux_bin="$RUNNER_TEMP/cmux-next-acpmux/acpmux"
          scripts/cmux-next/build-acpmux.sh --output "$acpmux_bin"
          echo "CMUX_NEXT_ACPMUX_BIN=$acpmux_bin" >> "$GITHUB_ENV"

      # A fast branch dogfood build only needs the arm64 client that is bundled
      # in this macOS app. Building it here avoids waiting for the full
      # cross-platform R2 artifact matrix. Main and release keep the immutable
      # manifest path below, so their machine and distribution artifacts stay
      # complete.
      - name: Install Zig for fast cmux-tui client
        if: env.NIGHTLY_FAST_BUILD == 'true'
        run: ./scripts/install-zig-ci.sh

      - name: Build fast arm64 cmux-tui client
        if: env.NIGHTLY_FAST_BUILD == 'true'
        working-directory: cmux-tui
        env:
          CMUX_TUI_DISTRIBUTION_VERSION: 0.0.0-nightly-${{ needs.decide.outputs.short_sha }}
        run: |
          set -euo pipefail
          unset CMUX_GHOSTTY_SRC
          CMUX_TUI_BUILD_COMMIT="$(git -C .. rev-parse HEAD)"
          CMUX_TUI_GHOSTTY_COMMIT="$(git -C ../ghostty-next rev-parse HEAD)"
          export CMUX_TUI_BUILD_COMMIT CMUX_TUI_GHOSTTY_COMMIT
          cargo build -p cmux-tui --bin cmux-tui --release --locked --target aarch64-apple-darwin
          cargo build -p acpmux --bin acpmux --release --locked --target aarch64-apple-darwin
          binary="target/aarch64-apple-darwin/release/cmux-tui"
          test -x "$binary"
          probe="$($binary remote-probe --json)"
          PROBE="$probe" EXPECTED_COMMIT="$CMUX_TUI_BUILD_COMMIT" python3 - <<'PY'
          import json
          import os

          probe = json.loads(os.environ["PROBE"])
          expected = os.environ["EXPECTED_COMMIT"]
          if probe.get("build_identity") != expected:
              raise SystemExit(
                  f"cmux-tui build identity {probe.get('build_identity')!r} != {expected!r}"
              )
          if "wireguard-hub" not in probe.get("capabilities", []):
              raise SystemExit("fast cmux-tui client lacks wireguard-hub capability")
          PY

      - name: Cache Swift packages
        id: swift-packages-restore
        uses: ./.github/actions/cache-restore
        with:
          backend: ${{ inputs.cache_backend != 'default' && inputs.cache_backend || vars.CI_CACHE_BACKEND || 'r2' }}
          path: .spm-cache
          key: spm-${{ hashFiles('cmux.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'scripts/ci/swiftpm-cache-layout') }}
          restore-keys: spm-

      - name: Sanitize Swift package cache
        run: python3 scripts/ci/sanitize-xcode-source-packages-cache.py .spm-cache

      - name: Set up Go for the SSH daemon assets
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          cache: false

      # The Embed CEF phase embeds the pinned Chromium engine
      # (scripts/cmux-next/cef-manifest.json) from the ensure-cef cache. This
      # step fills the cache from the private R2 bucket with the read-only key
      # (the GitHub release with CMUX_CEF_READ_TOKEN is the fallback); only
      # this step gets the key, so the build step runs without it. With no
      # readable source the app builds without the engine and reports the
      # browser unavailable; "Report the embedded Chromium engine" flags that.
      - name: Fetch the Chromium engine
        env:
          CMUX_CEF_R2_ACCOUNT_ID: ${{ secrets.CMUX_CEF_R2_ACCOUNT_ID }}
          CMUX_CEF_R2_ACCESS_KEY_ID: ${{ secrets.CMUX_CEF_R2_ACCESS_KEY_ID }}
          CMUX_CEF_R2_SECRET_ACCESS_KEY: ${{ secrets.CMUX_CEF_R2_SECRET_ACCESS_KEY }}
          CMUX_CEF_R2_ENV_FILE: /dev/null
          GH_TOKEN: ${{ secrets.CMUX_CEF_READ_TOKEN }}
        # The x86_64 engine (a manifest "x86_64" object) lets a universal
        # build embed both slices (embed-cef.sh); without it this prints
        # nothing and the universal app keeps the arm64 engine.
        run: |
          scripts/cmux-next/ensure-cef.sh --optional
          scripts/cmux-next/ensure-cef.sh --optional --arch x86_64

      # cmux-next ships THIRD_PARTY_LICENSES.md for exactly what this nightly
      # bundles: the daemon, app host and Cloud server come from this tree
      # (pin-cmux-tui.sh tree mode), so the notices do too, with exact closures
      # from `cargo tree` (this runner has cargo). The Release build copies the
      # regenerated file; the sign job verifies the bundle against
      # scripts/cmux-next/notices/bundle-map.json.
      - name: Generate third-party notices (cmux-next)
        if: needs.decide.outputs.track == 'nightly-next'
        env:
          CMUX_NOTICES_ALLOW_CARGO: "1"
          CMUX_NOTICES_CACHE: ${{ runner.temp }}/cmux-notices
        run: |
          ./scripts/cmux-next/generate-third-party-notices.sh --tui-source tree \
            --cargo-trees "$RUNNER_TEMP/cmux-notices-cargo-trees" --write-cargo-trees

      - name: Build nightly app (Release)
        run: |
          set -euo pipefail
          if [[ "$NIGHTLY_FAST_BUILD" == "true" ]]; then
            archs="arm64"
            only_active="YES"
          else
            archs="arm64 x86_64"
            only_active="NO"
          fi
          # Let xcodebuild fan out across the host. The two whole-module Swift
          # compiles of the cmux target (about 10 and 16 minutes) miss the
          # compilation cache on every push because every push changes the
          # module, and `-jobs 1` made them run back to back: the warm build
          # step went from 21 minutes to 31-40 (#12704). The diagnostics
          # wrapper does not need a serial build; PR 12704 recorded 95% free
          # memory on the 50 GiB host during the failure it was written for.
          #
          # The app target's Rust helper phases run after the Swift compile but
          # do not read its output. Build them now at low priority so those
          # phases find the local-source helpers fresh instead of building them after
          # the compile. A failed or late prebuild only leaves that work to the
          # phases, so its status never fails this step.
          python3 scripts/ci/run-with-helper-prebuild.py \
            --derived-data build-universal --configuration Release --archs "$archs" \
            --log "$RUNNER_TEMP/helper-prebuild.log" -- \
          ./scripts/ci/run-xcodebuild-with-diagnostics.sh -- \
            env CMUX_SKIP_ZIG_BUILD=1 xcodebuild -scheme cmux -configuration Release -derivedDataPath build-universal \
            -destination 'generic/platform=macOS' \
            -clonedSourcePackagesDirPath .spm-cache \
            -packageCachePath "$PWD/.spm-cache/.package-cache" \
            -showBuildTimingSummary \
            ARCHS="$archs" \
            ONLY_ACTIVE_ARCH="$only_active" \
            COMPILATION_CACHE_ENABLE_CACHING=YES \
            COMPILATION_CACHE_LIMIT_SIZE=3221225472 \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO ASSETCATALOG_COMPILER_APPICON_NAME="$CHANNEL_ICON_NAME" build

      - name: Bound Xcode compilation cache size
        id: compilation-cache-bound
        run: |
          set -euo pipefail
          cache_path="build-universal/CompilationCache.noindex"
          max_cache_kib=$((5 * 1024 * 1024))
          if [ -d "$cache_path" ]; then
            # Xcode's CAS chains v1.N generations: the newest is the primary,
            # the one before it is the upstream it faults objects in from, and
            # anything older is dead until the CAS's next garbage collection.
            # The CAS rotates a new primary whenever the current one ends a
            # build above half of COMPILATION_CACHE_LIMIT_SIZE (1.5 GiB here,
            # below one build's 3.3 GB working set), so every warm build leaves
            # a dead generation behind, the directory measures two full builds
            # (6.6 GB on main), and this bound used to drop every warm cache.
            # Prune the dead generations first, exactly as the CAS would.
            python3 scripts/ci/prune-xcode-compilation-cache.py "$cache_path" \
              || echo "::warning::Xcode compilation cache pruning failed; measuring it unpruned"
            cache_kib=$(du -sk "$cache_path" | awk '{print $1}')
          else
            cache_kib=0
          fi
          echo "Xcode compilation cache size: ${cache_kib} KiB (limit: ${max_cache_kib} KiB)"
          save=false
          if [ "$cache_kib" -gt "$max_cache_kib" ]; then
            # Nothing is saved, so the next build restores the same older entry
            # and lands here again: the cache freezes at its last saved entry
            # until the bound (and COMPILATION_CACHE_LIMIT_SIZE) is raised.
            echo "::warning::Xcode compilation cache exceeds 5 GiB; skipping cache save"
            rm -rf "$cache_path"
          elif [ "$cache_kib" -gt 0 ]; then
            save=true
          else
            echo "Xcode compilation cache is empty; skipping cache save"
          fi
          echo "save=${save}" >> "$GITHUB_OUTPUT"

      - name: Save Xcode compilation cache
        if: steps.compilation-cache-restore.outputs.cache-hit != 'true' && steps.compilation-cache-bound.outputs.save == 'true'
        uses: ./.github/actions/cache-save
        env:
          # Only an R2 save sees the bucket credentials.
          AWS_ACCESS_KEY_ID: ${{ (inputs.cache_backend != 'default' && inputs.cache_backend || vars.CI_CACHE_BACKEND) == 'r2' && secrets.CI_CACHE_R2_ACCESS_KEY_ID || '' }}
          AWS_SECRET_ACCESS_KEY: ${{ (inputs.cache_backend != 'default' && inputs.cache_backend || vars.CI_CACHE_BACKEND) == 'r2' && secrets.CI_CACHE_R2_SECRET_ACCESS_KEY || '' }}
          CI_CACHE_R2_ENDPOINT: ${{ (inputs.cache_backend != 'default' && inputs.cache_backend || vars.CI_CACHE_BACKEND) == 'r2' && format('https://{0}.r2.cloudflarestorage.com', secrets.CI_CACHE_R2_ACCOUNT_ID) || '' }}
          CI_CACHE_R2_BUCKET: ${{ vars.CI_CACHE_R2_BUCKET }}
        with:
          backend: ${{ inputs.cache_backend != 'default' && inputs.cache_backend || vars.CI_CACHE_BACKEND || 'r2' }}
          path: build-universal/CompilationCache.noindex
          key: xcode-compilation-release-${{ runner.os }}-${{ runner.arch }}-${{ steps.compilation-cache-key.outputs.toolchain }}-${{ needs.decide.outputs.head_sha }}

      - name: Save Swift packages
        if: steps.swift-packages-restore.outputs.cache-hit != 'true'
        uses: ./.github/actions/cache-save
        env:
          # Only an R2 save sees the bucket credentials.
          AWS_ACCESS_KEY_ID: ${{ (inputs.cache_backend != 'default' && inputs.cache_backend || vars.CI_CACHE_BACKEND) == 'r2' && secrets.CI_CACHE_R2_ACCESS_KEY_ID || '' }}
          AWS_SECRET_ACCESS_KEY: ${{ (inputs.cache_backend != 'default' && inputs.cache_backend || vars.CI_CACHE_BACKEND) == 'r2' && secrets.CI_CACHE_R2_SECRET_ACCESS_KEY || '' }}
          CI_CACHE_R2_ENDPOINT: ${{ (inputs.cache_backend != 'default' && inputs.cache_backend || vars.CI_CACHE_BACKEND) == 'r2' && format('https://{0}.r2.cloudflarestorage.com', secrets.CI_CACHE_R2_ACCOUNT_ID) || '' }}
          CI_CACHE_R2_BUCKET: ${{ vars.CI_CACHE_R2_BUCKET }}
        with:
          backend: ${{ inputs.cache_backend != 'default' && inputs.cache_backend || vars.CI_CACHE_BACKEND || 'r2' }}
          path: .spm-cache
          key: spm-${{ hashFiles('cmux.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'scripts/ci/swiftpm-cache-layout') }}

      # The fast arm64 build bundles the client it just compiled. Full builds
      # take the published client in build-sign-notarize-nightly instead: the
      # commit is resolved by resolve-nightly-cmux-tui-client while this job
      # compiles, so the history deepen (1.5 to 11 minutes) is off this path.
      - name: Bundle the fast cmux-tui client
        if: env.NIGHTLY_FAST_BUILD == 'true'
        run: |
          set -euo pipefail
          app="build-universal/Build/Products/Release/cmux.app"
          local_client="$GITHUB_WORKSPACE/cmux-tui/target/aarch64-apple-darwin/release/cmux-tui"
          test -x "$local_client"
          CMUX_TUI_CLIENT_LOCAL="$local_client" \
            ./scripts/install-cmux-tui-client.sh "$app" \
            --require-capability wireguard-hub \
            --require-acpmux
          ./scripts/cmux-next/check-daemon-capabilities.sh --binary "$app/Contents/Resources/bin/cmux-tui"

      - name: Build immutable SSH daemon assets once for every app variant
        if: needs.decide.outputs.build_only != 'true'
        id: remote_daemon
        run: |
          set -euo pipefail
          app="build-universal/Build/Products/Release/cmux.app"
          base_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")"
          build="${GITHUB_RUN_ID}$(printf '%02d' "${GITHUB_RUN_ATTEMPT:-1}")"
          track="${{ needs.decide.outputs.track }}"
          version="$(python3 scripts/ci/nightly_version.py marketing --track "$track" \
            --project-version "$base_version" --build "$build" --next-base "$NIGHTLY_NEXT_MARKETING_VERSION")"
          if [[ "$track" == "nightly-next" && "${{ needs.decide.outputs.should_publish }}" == "true" ]]; then
            # cmux-next and main's NIGHTLY install as the same app, so a published
            # cmux-next build must be above every build on both feeds: no feed
            # ever offers a downgrade after a switch between the two.
            feeds=()
            for appcast in appcast.xml appcast-arm64.xml appcast-x86_64.xml; do
              feeds+=(--feed "${NIGHTLY_NEXT_FEED_BASE}/${appcast}" --feed "https://files.cmux.com/nightly/${appcast}")
            done
            python3 scripts/ci/nightly_version.py check-build --build "$build" "${feeds[@]}"
          fi
          ./scripts/build_remote_daemon_release_assets.sh \
            --version "$version" --release-tag "${{ needs.decide.outputs.release_tag }}" \
            --repo "$GITHUB_REPOSITORY" --asset-suffix "$build" --output-dir remote-daemon-assets
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Attest immutable SSH daemon assets
        if: needs.decide.outputs.build_only != 'true'
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: remote-daemon-assets/cmuxd-remote-*

      - name: Upload SSH daemon assets
        if: needs.decide.outputs.build_only != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-nightly-remote-daemon
          path: remote-daemon-assets/cmuxd-remote-*
          if-no-files-found: error
          retention-days: 3

      - name: Strip unsigned nightly app before transfer
        run: |
          set -euo pipefail
          products="build-universal/Build/Products/Release"
          ./scripts/strip-release-bundle.sh "$products/cmux.app"

      - name: Report the embedded Chromium engine
        run: |
          set -euo pipefail
          app="build-universal/Build/Products/Release/cmux.app"
          framework="$app/Contents/Frameworks/Chromium Embedded Framework.framework"
          if [[ -d "$framework" ]]; then
            echo "Chromium engine embedded: $(lipo -archs "$framework/Versions/A/Chromium Embedded Framework")"
            # Chromium's license notices must ship with the engine (not CEF's sample page).
            ./scripts/cmux-next/check-cef-credits.sh "$app"
          else
            echo "::warning title=No Chromium engine::The CEF artifact was not readable (secrets CMUX_CEF_R2_*); this build ships the browser as unavailable."
          fi

      - name: Archive unsigned nightly app
        run: |
          set -euo pipefail
          products="build-universal/Build/Products/Release"
          if [ ! -d "$products/cmux.app" ]; then
            echo "Built app not found at $products/cmux.app" >&2
            exit 1
          fi
          tar -C "$products" -czf "$RUNNER_TEMP/cmux-nightly-unsigned.tar.gz" cmux.app

      - name: Upload unsigned nightly app
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-nightly-unsigned-app
          path: ${{ runner.temp }}/cmux-nightly-unsigned.tar.gz
          if-no-files-found: error
          retention-days: 1

      - name: Upload dSYMs to Sentry
        if: needs.decide.outputs.build_only != 'true'
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: manaflow
          SENTRY_PROJECT: cmuxterm-macos
        run: |
          if [ -z "${SENTRY_AUTH_TOKEN:-}" ]; then
            echo "SENTRY_AUTH_TOKEN not set, skipping dSYM upload"
            exit 0
          fi
          SENTRY_CLI="$(./scripts/ensure-sentry-cli.sh)"
          "$SENTRY_CLI" debug-files upload --include-sources \
            build-universal/Build/Products/Release/

  # Runs beside build-nightly-app. Deepening the shallow clone to find the
  # newest published cmux-tui commit took 1.5 to 11 minutes after the Xcode
  # compile (runs 36044415287, 36051668491); here it overlaps the compile.
  resolve-nightly-cmux-tui-client:
    needs: decide
    if: needs.decide.outputs.should_build == 'true' && (github.event_name != 'schedule' || github.event.schedule == '47 8 * * *') && needs.decide.outputs.build_only != 'true'
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    permissions:
      contents: read
    # Waits up to 45 minutes for the artifacts workflow to publish this tree.
    timeout-minutes: 55
    outputs:
      commit: ${{ steps.resolve.outputs.commit }}
      key: ${{ steps.resolve.outputs.key }}
    steps:
      - name: Checkout build ref
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ needs.decide.outputs.head_sha }}
          submodules: false

      # The fast arm64 build bundles its own compiled client instead.
      # The nightly ships the daemon built from its own cmux-tui tree, as every
      # tagged build does (scripts/cmux-next/pin-cmux-tui.sh --help): the commit
      # that published this tree, whose attested manifest the sign job installs.
      - name: Resolve cmux-tui client commit
        id: resolve
        if: needs.decide.outputs.fast_build != 'true'
        env:
          CMUX_TUI_TREE_WAIT_SECONDS: "2700"
        run: |
          set -euo pipefail
          cmux_tui_key="$(scripts/cmux-next/pin-cmux-tui.sh key)"
          cmux_tui_commit="$(scripts/cmux-next/pin-cmux-tui.sh resolve-commit)"
          [[ "$cmux_tui_commit" =~ ^[0-9a-f]{40}$ ]]
          echo "cmux-tui tree $cmux_tui_key: commit $cmux_tui_commit"
          echo "commit=$cmux_tui_commit" >> "$GITHUB_OUTPUT"
          echo "key=$cmux_tui_key" >> "$GITHUB_OUTPUT"

  build-sign-notarize-nightly:
    # Production secrets: GitHub releases them only to protected refs (the
    # environment's deployment branch policy: main, tags v*). The nightly-next
    # track uses `release-next`, whose policy allows only branch nightly-next.
    environment: ${{ needs.decide.outputs.environment }}
    needs: [decide, build-nightly-ghostty-cli-helper, build-nightly-app, resolve-nightly-cmux-tui-client]
    if: needs.decide.outputs.should_build == 'true' && (github.event_name != 'schedule' || github.event.schedule == '47 8 * * *') && needs.decide.outputs.build_only != 'true'
    # Sign and notarize on the same macOS 26 lane proven by stable releases.
    # actions:read lets the parallel artifact download resolve the blob URL.
    permissions:
      contents: read
      actions: read
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || (needs.decide.outputs.fast_build == 'true' && 'blacksmith-6vcpu-macos-26' || vars.MACOS_RUNNER_26 || 'blacksmith-6vcpu-macos-26') }}
    # Start the standalone helper submission early so
    # Apple's first wait overlaps useful work; finish it before the final DMG.
    # Delta generation against two previous builds adds about 15 minutes.
    timeout-minutes: 80
    # One universal Xcode build feeds every variant: the thin variants are cut
    # from it with lipo, so each user downloads only their architecture.
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.decide.outputs.variants) }}
    env:
      CMUX_CI_XCODE_APP: ${{ vars.CMUX_CI_XCODE_APP_MACOS_26 }}
      CMUX_CI_REQUIRED_MACOS_SDK_MAJOR: "26"
      NIGHTLY_VARIANT: ${{ matrix.variant }}
      NIGHTLY_FAST_BUILD: ${{ needs.decide.outputs.fast_build }}
      NIGHTLY_BUILD: ${{ needs.build-nightly-app.outputs.daemon_build }}
      NIGHTLY_MARKETING_VERSION: ${{ needs.build-nightly-app.outputs.daemon_version }}
      BUNDLE_REMOTE_DAEMON_ASSETS: ${{ needs.decide.outputs.fast_build == 'true' || needs.decide.outputs.should_publish != 'true' }}
      CHANNEL: ${{ needs.decide.outputs.channel }}
      TRACK: ${{ needs.decide.outputs.track }}
      CHANNEL_BUNDLE_ID: ${{ needs.decide.outputs.bundle_id }}
      CHANNEL_APP_NAME: ${{ needs.decide.outputs.app_name }}
      CHANNEL_URL_SCHEME: ${{ needs.decide.outputs.url_scheme }}
      CHANNEL_DMG_PREFIX: ${{ needs.decide.outputs.dmg_prefix }}
      CHANNEL_RELEASE_TAG: ${{ needs.decide.outputs.release_tag }}
      CHANNEL_FEED_BASE: ${{ needs.decide.outputs.feed_base }}
      CHANNEL_ENTITLEMENTS: ${{ needs.decide.outputs.entitlements }}
      # Signed app path for every step after "Prepare channel identity".
      CHANNEL_APP_PATH: build-universal/Build/Products/Release/${{ needs.decide.outputs.app_name }}.app
    steps:
      - name: Clear stale git locks (self-hosted reused workspace)
        shell: bash
        run: |
          # Self-hosted macOS runners reuse the workspace. A job cancelled or
          # killed mid-checkout can leave a stale .git/modules/*/index.lock that
          # fails every later submodule checkout (e.g. ghostty). Clear them first.
          ws="${GITHUB_WORKSPACE:-$PWD}"
          rm -f "$ws/.git/index.lock" 2>/dev/null || true
          if [ -d "$ws/.git/modules" ]; then
            find "$ws/.git/modules" -type f -name "*.lock" -delete 2>/dev/null || true
          fi

      - name: Checkout build ref
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ needs.decide.outputs.head_sha }}
          # Signing reads only this repository's scripts, tests, license and
          # entitlements. The ghostty, bonsplit and homebrew submodules cost
          # ~15s of fetch on every variant and are never read here.
          submodules: false

      - name: Select Xcode
        run: ./scripts/select-ci-xcode.sh

      # download-artifact reads the blob over one connection, about 1.8 MB/s
      # on these runners (140s for this 242 MB archive). Parallel ranges of the
      # same blob, checked against the artifact's SHA-256, take about 10s.
      - name: Download unsigned nightly app (parallel)
        id: unsigned-app-parallel
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/download-run-artifact.py --name cmux-nightly-unsigned-app --out nightly-inputs/app

      - name: Download unsigned nightly app
        if: steps.unsigned-app-parallel.outcome != 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cmux-nightly-unsigned-app
          path: nightly-inputs/app

      - name: Download SSH daemon assets
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: cmux-nightly-remote-daemon
          path: remote-daemon-assets

      - name: Download universal Ghostty CLI helper
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cmux-nightly-ghostty-cli-helper
          path: nightly-inputs/ghostty

      # Blocking, like the step that builds it: a nightly-next app always
      # ships the Ghostty license tree.
      - name: Download the Ghostty dependency licenses (cmux-next)
        id: ghostty_licenses
        if: needs.decide.outputs.track == 'nightly-next' && needs.decide.outputs.fast_build != 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cmux-next-source-archive
          path: nightly-inputs/source-archive

      - name: Restore unsigned nightly products
        run: |
          set -euo pipefail
          products="build-universal/Build/Products/Release"
          mkdir -p "$products"
          tar -C "$products" -xzf nightly-inputs/app/cmux-nightly-unsigned.tar.gz

      # Provide node/npm explicitly. The build/sign/notarize job can land on a
      # self-hosted macOS runner (the iOS-CI minis match the same label) that has
      # no npm on PATH, so `npm install --global create-dmg` failed with
      # "npm: command not found" and turned nightly red. setup-node makes the job
      # self-sufficient on any runner instead of assuming a preinstalled npm.
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Install build deps
        run: |
          CMUX_NODE_BIN="$(command -v node)"
          export npm_config_prefix="$RUNNER_TEMP/npm-global"
          mkdir -p "$npm_config_prefix"
          npm install --global "create-dmg@${CREATE_DMG_VERSION}"
          wrapper_dir="$RUNNER_TEMP/create-dmg-wrapper"
          mkdir -p "$wrapper_dir"
          cat > "$wrapper_dir/create-dmg" <<EOF
          #!/usr/bin/env bash
          exec "$CMUX_NODE_BIN" "$npm_config_prefix/lib/node_modules/create-dmg/cli.js" "\$@"
          EOF
          chmod +x "$wrapper_dir/create-dmg"
          echo "$wrapper_dir" >> "$GITHUB_PATH"

      - name: Derive Sparkle public key from private key
        env:
          # scripts/ci/nightly-sparkle-key.sh picks the key per channel and
          # NIGHTLY_SPARKLE_KEY; unset keeps the shared key.
          NIGHTLY_SPARKLE_KEY: ${{ vars.NIGHTLY_SPARKLE_KEY }}
          CHANNEL: ${{ needs.decide.outputs.channel }}
          TRACK: ${{ needs.decide.outputs.track }}
          # The nightly-next track gets only its own key; the others never see it.
          SHARED_SPARKLE_PRIVATE_KEY: ${{ needs.decide.outputs.track != 'nightly-next' && secrets.SPARKLE_PRIVATE_KEY || '' }}
          NIGHTLY_SPARKLE_PRIVATE_KEY: ${{ needs.decide.outputs.track != 'nightly-next' && secrets.NIGHTLY_SPARKLE_PRIVATE_KEY || '' }}
          NEXT_SPARKLE_PRIVATE_KEY: ${{ needs.decide.outputs.track == 'nightly-next' && secrets.SPARKLE_NEXT_PRIVATE_KEY || '' }}
        run: |
          set -euo pipefail
          SPARKLE_PRIVATE_KEY="$(./scripts/ci/nightly-sparkle-key.sh)"
          DERIVED_PUBLIC_KEY=$(swift scripts/derive_sparkle_public_key.swift "$SPARKLE_PRIVATE_KEY")
          echo "Derived Sparkle public key: $DERIVED_PUBLIC_KEY"
          if [ "$TRACK" = "nightly-next" ] && [ "$DERIVED_PUBLIC_KEY" != "$NIGHTLY_NEXT_SPARKLE_PUBLIC_KEY" ]; then
            echo "SPARKLE_NEXT_PRIVATE_KEY does not derive the pinned NIGHTLY_NEXT_SPARKLE_PUBLIC_KEY" >&2
            exit 1
          fi
          echo "SPARKLE_PUBLIC_KEY=$DERIVED_PUBLIC_KEY" >> "$GITHUB_ENV"

      - name: Inject universal Ghostty CLI helper
        run: |
          set -euo pipefail
          APP_DIR="build-universal/Build/Products/Release/cmux.app"
          if [ ! -d "$APP_DIR" ]; then
            echo "Built app not found at $APP_DIR" >&2
            exit 1
          fi
          DEST="$APP_DIR/Contents/Resources/bin/ghostty"
          mkdir -p "$(dirname "$DEST")"
          install -m 755 nightly-inputs/ghostty/ghostty "$DEST"
          echo "Injected Ghostty CLI helper architectures: $(lipo -archs "$DEST")"

      # The Ghostty dependency license tree (collect-ghostty-licenses.py, checked
      # by verify-ghostty-license-bundle.py) ships in the app, with the MPL-2.0
      # source offer that names this release's cmux-next source archive and tag.
      - name: Inject the Ghostty dependency licenses (cmux-next)
        if: needs.decide.outputs.track == 'nightly-next' && needs.decide.outputs.fast_build != 'true'
        run: |
          set -euo pipefail
          APP_DIR="build-universal/Build/Products/Release/cmux.app"
          tree="nightly-inputs/source-archive/ghostty-licenses"
          python3 cmux-tui/build-support/notices/ghostty/verify-ghostty-license-bundle.py \
            --root "$tree" --revision "$(git rev-parse HEAD:ghostty)"
          rm -rf "$APP_DIR/Contents/Resources/ghostty-licenses"
          cp -R "$tree" "$APP_DIR/Contents/Resources/ghostty-licenses"
          # bin/cmux's libghostty-vt: the submodule ghostty-vt-sys's build.rs
          # selects, at this commit's gitlink (the resolved cmux-tui client
          # commit has the same cmux-tui tree and gitlinks: pin-cmux-tui.sh key).
          # Today: Contents/Resources/ghostty-next-licenses.
          vt="$(python3 scripts/cmux-next/notices/check_ghostty_vt_notices.py --print-source | sed -n 's/^libghostty-vt source: //p')"
          vt_name="${vt%% *}" vt_revision="${vt##* }"
          if [[ "$vt_name" != ghostty ]]; then
            next_tree="nightly-inputs/source-archive/$vt_name-licenses"
            python3 cmux-tui/build-support/notices/ghostty/verify-ghostty-license-bundle.py \
              --root "$next_tree" --revision "$vt_revision"
            rm -rf "$APP_DIR/Contents/Resources/$vt_name-licenses"
            cp -R "$next_tree" "$APP_DIR/Contents/Resources/$vt_name-licenses"
          fi

      # Every variant installs the one commit resolve-nightly-cmux-tui-client
      # chose, from its attested immutable manifest, before thinning.
      - name: Bundle the cmux-tui client
        if: needs.decide.outputs.fast_build != 'true'
        env:
          # install-cmux-tui-client.sh verifies the manifest's build-provenance
          # attestation with gh before trusting it.
          GH_TOKEN: ${{ github.token }}
          CMUX_TUI_CLIENT_COMMIT: ${{ needs.resolve-nightly-cmux-tui-client.outputs.commit }}
          CMUX_TUI_CLIENT_KEY: ${{ needs.resolve-nightly-cmux-tui-client.outputs.key }}
          # Per-job cache, so legs sharing a host never race on one download.
          CMUX_TUI_CLIENT_CACHE: ${{ runner.temp }}/cmux-tui-client
        run: |
          set -euo pipefail
          app="build-universal/Build/Products/Release/cmux.app"
          cmux_tui_commit="$CMUX_TUI_CLIENT_COMMIT"
          [[ "$cmux_tui_commit" =~ ^[0-9a-f]{40}$ ]] || { echo "resolve-nightly-cmux-tui-client produced no commit" >&2; exit 1; }
          ./scripts/install-cmux-tui-client.sh \
            "$app" \
            --manifest-url "https://files.cmux.com/cmux-tui/${cmux_tui_commit}/manifest.json" \
            --expected-commit "$cmux_tui_commit" \
            --require-capability wireguard-hub \
            --require-acpmux
          # Same local-symbol strip scripts/strip-release-bundle.sh applied when
          # the client was bundled before the unsigned app was archived.
          # bin/cmux-tui and bin/acpmux are symlinks to bin/cmux.
          strip -S -x "$app/Contents/Resources/bin/cmux"
          ./scripts/cmux-next/write-cmux-tui-version.sh "$app" "$cmux_tui_commit" "$CMUX_TUI_CLIENT_KEY"
          ./scripts/cmux-next/check-daemon-capabilities.sh --binary "$app/Contents/Resources/bin/cmux-tui"

      - name: Run bundled Ghostty theme picker helper regression
        run: |
          set -euo pipefail
          CMUX_APP_PATH="build-universal/Build/Products/Release/cmux.app" \
            ./tests/test_bundled_ghostty_theme_picker_helper.sh

      - name: Thin bundle to the variant architecture
        # The fast build is already compiled arm64, but the downloaded cmux-tui
        # client can still be universal. Thin every non-universal artifact before
        # signing so the architecture gate remains meaningful. The Chromium
        # engine artifact is arm64 only: an x86_64 variant drops it first and
        # reports the browser unavailable.
        if: matrix.variant != 'universal'
        run: |
          set -euo pipefail
          ./scripts/cmux-next/drop-cef-without-arch.sh build-universal/Build/Products/Release/cmux.app "$NIGHTLY_VARIANT"
          ./scripts/thin-app-bundle.sh build-universal/Build/Products/Release/cmux.app "$NIGHTLY_VARIANT"

      - name: Verify nightly binary architectures
        run: |
          set -euo pipefail
          APP="build-universal/Build/Products/Release/cmux.app"
          for binary in \
            "$APP/Contents/MacOS/cmux" \
            "$APP/Contents/Resources/bin/cmux" \
            "$APP/Contents/Resources/bin/ghostty" \
            "$APP/Contents/Resources/bin/cmux-diff-sidecar"
          do
            archs="$(lipo -archs "$binary")"
            echo "$binary: $archs"
            if [ "$NIGHTLY_VARIANT" = "universal" ]; then
              [[ "$archs" == *arm64* && "$archs" == *x86_64* ]]
            else
              [ "$archs" = "$NIGHTLY_VARIANT" ]
            fi
          done
          # bin/cmux is the cmux-tui binary; cmux-tui and acpmux are symlinks to it.
          for alias in cmux-tui acpmux; do
            [ "$(readlink "$APP/Contents/Resources/bin/$alias")" = cmux ] || {
              echo "bin/$alias is not a symlink to cmux" >&2; exit 1; }
          done
          if [ "$NIGHTLY_VARIANT" != "universal" ]; then
            # No fat Mach-O may survive thinning anywhere in the bundle.
            fat="$(find "$APP" -type f -exec sh -c 'file -b "$1" | grep -q "Mach-O universal" && echo "$1"' _ {} \;)"
            if [ -n "$fat" ]; then
              echo "Fat Mach-O files remain after thinning:" >&2
              echo "$fat" >&2
              exit 1
            fi
          fi
          if [ "$NIGHTLY_VARIANT" = "universal" ]; then
            ./scripts/verify-diff-sidecar-artifact.sh "$APP/Contents/Resources/bin/cmux-diff-sidecar" --archs "arm64 x86_64"
          else
            ./scripts/verify-diff-sidecar-artifact.sh "$APP/Contents/Resources/bin/cmux-diff-sidecar" --archs "$NIGHTLY_VARIANT"
          fi

      - name: Inject nightly identities and metadata
        run: |
          set -euo pipefail
          SHORT_SHA="${{ needs.decide.outputs.short_sha }}"
          APP_DIR="build-universal/Build/Products/Release"

          # The producer owns the version for both the daemon and every app variant.
          : "${NIGHTLY_BUILD:?missing daemon build}" "${NIGHTLY_MARKETING_VERSION:?missing daemon version}"

          NIGHTLY_DMG_IMMUTABLE="${CHANNEL_DMG_PREFIX}-${NIGHTLY_VARIANT}-${NIGHTLY_BUILD}.dmg"
          NIGHTLY_DMG_RELEASE="${CHANNEL_DMG_PREFIX}-${NIGHTLY_VARIANT}.dmg"
          # Thin variants get their own feed. The universal variant keeps the legacy
          # feed name; the app's feed resolver rewrites it to the per-architecture
          # feed at runtime, which is how older installs migrate.
          if [ "$NIGHTLY_VARIANT" = "universal" ]; then
            NIGHTLY_APPCAST="appcast.xml"
          else
            NIGHTLY_APPCAST="appcast-${NIGHTLY_VARIANT}.xml"
          fi
          {
            echo "NIGHTLY_BUILD=${NIGHTLY_BUILD}"
            echo "NIGHTLY_MARKETING_VERSION=${NIGHTLY_MARKETING_VERSION}"
            echo "NIGHTLY_DMG_IMMUTABLE=${NIGHTLY_DMG_IMMUTABLE}"
            echo "NIGHTLY_DMG_RELEASE=${NIGHTLY_DMG_RELEASE}"
            echo "NIGHTLY_APPCAST=${NIGHTLY_APPCAST}"
          } >> "$GITHUB_ENV"

          prepare_variant() {
            local app_dir="$1"
            local bundle_id="$2"
            local feed_url="$3"
            local app_plist="$app_dir/cmux.app/Contents/Info.plist"

            /usr/libexec/PlistBuddy -c "Set :CFBundleName ${CHANNEL_APP_NAME}" "$app_plist"
            /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName ${CHANNEL_APP_NAME}" "$app_plist"
            /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier ${bundle_id}" "$app_plist"
            local url_type_name
            url_type_name="$(/usr/libexec/PlistBuddy -c "Print :CFBundleURLTypes:1:CFBundleURLName" "$app_plist")"
            if [[ "$url_type_name" != *.auth ]]; then
              echo "Expected CFBundleURLTypes[1] to be the auth URL type, found: $url_type_name" >&2
              exit 1
            fi
            /usr/libexec/PlistBuddy -c "Set :CFBundleURLTypes:1:CFBundleURLSchemes:0 ${CHANNEL_URL_SCHEME}" "$app_plist"
            /usr/libexec/PlistBuddy -c "Delete :SUPublicEDKey" "$app_plist" >/dev/null 2>&1 || true
            /usr/libexec/PlistBuddy -c "Delete :SUFeedURL" "$app_plist" >/dev/null 2>&1 || true
            /usr/libexec/PlistBuddy -c "Add :SUPublicEDKey string ${SPARKLE_PUBLIC_KEY}" "$app_plist"
            /usr/libexec/PlistBuddy -c "Add :SUFeedURL string ${feed_url}" "$app_plist"
            /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${NIGHTLY_MARKETING_VERSION}" "$app_plist"
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${NIGHTLY_BUILD}" "$app_plist"
            /usr/libexec/PlistBuddy -c "Delete :CMUXCommit" "$app_plist" >/dev/null 2>&1 || true
            /usr/libexec/PlistBuddy -c "Add :CMUXCommit string ${SHORT_SHA}" "$app_plist"
            mv "$app_dir/cmux.app" "$app_dir/${CHANNEL_APP_NAME}.app"
          }

          prepare_variant \
            "$APP_DIR" \
            "$CHANNEL_BUNDLE_ID" \
            "${CHANNEL_FEED_BASE}/${NIGHTLY_APPCAST}"
          if [ "$TRACK" = "nightly-next" ]; then
            python3 scripts/ci/nightly-next-guard.py feed-url \
              "$(/usr/libexec/PlistBuddy -c 'Print :SUFeedURL' "$APP_DIR/${CHANNEL_APP_NAME}.app/Contents/Info.plist")"
          fi

          echo "Channel: ${CHANNEL}"
          echo "App name: ${CHANNEL_APP_NAME}"
          echo "Variant: ${NIGHTLY_VARIANT}"
          echo "Feed: ${CHANNEL_FEED_BASE}/${NIGHTLY_APPCAST}"
          echo "Bundle ID: ${CHANNEL_BUNDLE_ID}"
          echo "Marketing version: ${NIGHTLY_MARKETING_VERSION}"
          echo "Build number: ${NIGHTLY_BUILD}"
          echo "Immutable DMG: ${NIGHTLY_DMG_IMMUTABLE}"
          echo "Commit SHA: ${SHORT_SHA}"

      - name: Embed verified SSH daemon manifest
        run: |
          bundle_args=()
          if [[ "$BUNDLE_REMOTE_DAEMON_ASSETS" == "true" ]]; then
            # Unpublished dogfood builds must work without GitHub release URLs.
            bundle_args+=(--bundle-assets)
          fi
          # cmux-next bundles the Rust CLI (#16174), which has no classic
          # `remote-daemon-status` command, so nightly-next checks the manifest
          # and daemon bytes but skips the bundled-CLI query.
          if [[ "$CHANNEL_RELEASE_TAG" == "nightly-next" ]]; then
            echo "nightly-next: skipping --verify-cli (Rust CLI has no remote-daemon-status)"
          else
            bundle_args+=(--verify-cli)
          fi
          python3 scripts/verify_remote_daemon_release.py \
            --manifest "remote-daemon-assets/cmuxd-remote-manifest-${NIGHTLY_BUILD}.json" \
            --assets-dir remote-daemon-assets \
            --app "$CHANNEL_APP_PATH" --embed "${bundle_args[@]}"

      - name: Import signing cert
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$APPLE_CERTIFICATE_BASE64" ]; then
            echo "Missing APPLE_CERTIFICATE_BASE64 secret" >&2
            exit 1
          fi
          if [ -z "$APPLE_CERTIFICATE_PASSWORD" ]; then
            echo "Missing APPLE_CERTIFICATE_PASSWORD secret" >&2
            exit 1
          fi
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > /tmp/cert.p12
          security delete-keychain build.keychain >/dev/null 2>&1 || true
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import /tmp/cert.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          ./scripts/import-apple-developer-id-intermediates.sh build.keychain
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security list-keychains -d user -s build.keychain

      # Each channel has its own Developer ID profile:
      # APPLE_NIGHTLY_PROVISIONING_PROFILE_BASE64 / APPLE_RC_PROVISIONING_PROFILE_BASE64.
      - name: Embed channel provisioning profile
        env:
          APP_PROVISIONING_PROFILE_BASE64: ${{ secrets[format('APPLE_{0}_PROVISIONING_PROFILE_BASE64', needs.decide.outputs.channel_upper)] }}
          PROFILE_SECRET_NAME: APPLE_${{ needs.decide.outputs.channel_upper }}_PROVISIONING_PROFILE_BASE64
        run: |
          if [ -z "$APP_PROVISIONING_PROFILE_BASE64" ]; then
            echo "Missing $PROFILE_SECRET_NAME secret" >&2
            exit 1
          fi

          APP_PATH="$CHANNEL_APP_PATH"
          PROFILE_PATH="$APP_PATH/Contents/embedded.provisionprofile"
          TMP_PROFILE="$(mktemp /tmp/cmux-channel-profile.XXXXXX)"
          TMP_PLIST="$(mktemp /tmp/cmux-channel-profile.XXXXXX.plist)"
          trap 'rm -f "$TMP_PROFILE" "$TMP_PLIST"' EXIT

          echo "$APP_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$TMP_PROFILE"
          security cms -D -i "$TMP_PROFILE" > "$TMP_PLIST"

          APP_ID="$(/usr/libexec/PlistBuddy -c "Print :Entitlements:com.apple.application-identifier" "$TMP_PLIST")"
          if [ "$APP_ID" != "7WLXT3NR37.${CHANNEL_BUNDLE_ID}" ]; then
            echo "$CHANNEL provisioning profile targets unexpected app ID: $APP_ID" >&2
            exit 1
          fi

          # The WebAuthn browser entitlement is an Apple-approved capability
          # request. Nightly has it; the RC App ID's request has been pending
          # since 2026-07-10, so cmux.rc.entitlements does not ask for it and
          # RC ships without passkey sign-in in the embedded browser until Apple
          # approves. The check follows the channel's entitlements file so the
          # profile can never silently lag behind what the app requests.
          if /usr/libexec/PlistBuddy -c "Print :com.apple.developer.web-browser.public-key-credential" "$CHANNEL_ENTITLEMENTS" >/dev/null 2>&1; then
            WEBAUTHN_ENTITLEMENT="$(/usr/libexec/PlistBuddy -c "Print :Entitlements:com.apple.developer.web-browser.public-key-credential" "$TMP_PLIST" 2>/dev/null || true)"
            if [ "$WEBAUTHN_ENTITLEMENT" != "true" ]; then
              echo "$CHANNEL provisioning profile is missing WebAuthn browser entitlement" >&2
              exit 1
            fi
          else
            echo "$CHANNEL entitlements do not request the WebAuthn browser entitlement; skipping the profile check"
          fi

          PROVISIONS_ALL_DEVICES="$(/usr/libexec/PlistBuddy -c "Print :ProvisionsAllDevices" "$TMP_PLIST")"
          if [ "$PROVISIONS_ALL_DEVICES" != "true" ]; then
            echo "$CHANNEL provisioning profile is not a Developer ID all-devices profile" >&2
            exit 1
          fi

          cp "$TMP_PROFILE" "$PROFILE_PATH"

      - name: Codesign apps
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          if [ -z "$APPLE_SIGNING_IDENTITY" ]; then
            echo "Missing APPLE_SIGNING_IDENTITY secret" >&2
            exit 1
          fi
          ./scripts/sign-cmux-bundle.sh \
            "$CHANNEL_APP_PATH" \
            "$CHANNEL_ENTITLEMENTS" \
            "$APPLE_SIGNING_IDENTITY"

      - name: Verify bundled Mach-O load commands
        run: ./scripts/verify-bundle-load-commands.sh "$CHANNEL_APP_PATH"

      # Every Mach-O must map to its notices (bundle-map.json): fail here,
      # before the notarization wait. notarize-nightly-dmg.sh checks the app
      # and the mounted DMG again.
      - name: Verify third-party notices cover every bundled binary
        run: ./scripts/verify-app-bundle-licenses.sh "$CHANNEL_APP_PATH"

      - name: Verify signed app SSH daemon contract
        run: |
          bundle_args=()
          if [[ "$BUNDLE_REMOTE_DAEMON_ASSETS" == "true" ]]; then
            bundle_args+=(--require-bundled-assets)
          fi
          # cmux-next bundles the Rust CLI (#16174), which has no classic
          # `remote-daemon-status` command, so nightly-next checks the manifest
          # and daemon bytes but skips the bundled-CLI query.
          if [[ "$CHANNEL_RELEASE_TAG" == "nightly-next" ]]; then
            echo "nightly-next: skipping --verify-cli (Rust CLI has no remote-daemon-status)"
          else
            bundle_args+=(--verify-cli)
          fi
          python3 scripts/verify_remote_daemon_release.py \
            --manifest "remote-daemon-assets/cmuxd-remote-manifest-${NIGHTLY_BUILD}.json" \
            --assets-dir remote-daemon-assets \
            --app "$CHANNEL_APP_PATH" "${bundle_args[@]}"

      - name: Smoke launch signed app before notarization
        run: |
          set -euo pipefail
          # Catch macOS policy failures before the Apple ticket wait and DMG
          # work. Direct execution is isolated from the runner's Dock state.
          CMUX_SMOKE_DIRECT_EXEC=1 CMUX_SMOKE_DEBUG_LOGS=1 \
            ./scripts/smoke-launch-macos-app.sh \
            "$CHANNEL_APP_PATH"

      - name: Smoke bundled CLI against the signed app
        run: |
          set -euo pipefail
          # Launch-only smoke proves the process lives; this drives the shipped
          # app through the CLI inside the same bundle (version, help, acp,
          # the cmux-tui and acpmux symlinks, app ping and identify).
          # A thin x86_64 variant skips when the runner has no Rosetta.
          ./scripts/smoke-signed-app-cli.sh \
            "$CHANNEL_APP_PATH"

      - name: Notarize app ticket through final DMG
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          CMUX_CHANNEL: ${{ needs.decide.outputs.channel }}
        run: |
          ./scripts/ci/notarize-nightly-dmg.sh \
            "$CHANNEL_APP_PATH" \
            "$NIGHTLY_DMG_RELEASE" \
            "$NIGHTLY_DMG_IMMUTABLE"

      - name: Gate distribution with syspolicy_check
        run: syspolicy_check distribution "$CHANNEL_APP_PATH"

      - name: Fetch previous nightly builds for delta updates
        if: needs.decide.outputs.fast_build != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/ci/fetch-previous-nightly-dmgs.py \
            --repo manaflow-ai/cmux \
            --release-tag "$CHANNEL_RELEASE_TAG" \
            --name-prefix "${CHANNEL_DMG_PREFIX}-" \
            --variant "$NIGHTLY_VARIANT" \
            --exclude-build "$NIGHTLY_BUILD" \
            --count 2 \
            --out previous-nightlies

      - name: Generate Sparkle appcasts (nightly)
        if: needs.decide.outputs.fast_build != 'true'
        env:
          NIGHTLY_SPARKLE_KEY: ${{ vars.NIGHTLY_SPARKLE_KEY }}
          CHANNEL: ${{ needs.decide.outputs.channel }}
          TRACK: ${{ needs.decide.outputs.track }}
          # The nightly-next track gets only its own key; the others never see it.
          SHARED_SPARKLE_PRIVATE_KEY: ${{ needs.decide.outputs.track != 'nightly-next' && secrets.SPARKLE_PRIVATE_KEY || '' }}
          NIGHTLY_SPARKLE_PRIVATE_KEY: ${{ needs.decide.outputs.track != 'nightly-next' && secrets.NIGHTLY_SPARKLE_PRIVATE_KEY || '' }}
          NEXT_SPARKLE_PRIVATE_KEY: ${{ needs.decide.outputs.track == 'nightly-next' && secrets.SPARKLE_NEXT_PRIVATE_KEY || '' }}
          # cmux-next items carry sparkle:channel cmux-next, which only the
          # cmux-next build allows; every other build ignores them.
          SPARKLE_CHANNEL: ${{ needs.decide.outputs.track == 'nightly-next' && 'cmux-next' || '' }}
          # Deltas from the two previous builds of this track, named
          # cmux-nightly-macos-<variant>-<new>-<old>.delta so tracks never collide.
          SPARKLE_PREVIOUS_ARCHIVES_DIR: previous-nightlies
          SPARKLE_MAXIMUM_DELTAS: "2"
        run: |
          set -euo pipefail
          SPARKLE_PRIVATE_KEY="$(./scripts/ci/nightly-sparkle-key.sh)"
          export SPARKLE_PRIVATE_KEY
          # After a key change, deltas from builds that embed the other key can
          # never install; skip building them. SPARKLE_PUBLIC_KEY is derived above.
          ./scripts/ci/drop-previous-nightlies-with-other-sparkle-key.sh previous-nightlies "$SPARKLE_PUBLIC_KEY"
          # The new item carries the bundle's macOS floor (26.0 for cmux-next),
          # so older macOS keeps the previous (legacy) items still in the feed.
          SPARKLE_MINIMUM_SYSTEM_VERSION="$(python3 scripts/ci/appcast_minimum_system_version.py floor "$CHANNEL_APP_PATH")"
          export SPARKLE_MINIMUM_SYSTEM_VERSION
          SPARKLE_DELTA_NAME_PREFIX="${CHANNEL_DMG_PREFIX}-${NIGHTLY_VARIANT}-" \
            ./scripts/sparkle_generate_appcast.sh "$NIGHTLY_DMG_IMMUTABLE" "$CHANNEL_RELEASE_TAG" "$NIGHTLY_APPCAST"
          ls -l "$NIGHTLY_DMG_IMMUTABLE" "$NIGHTLY_DMG_RELEASE" "$NIGHTLY_APPCAST" ./*.delta 2>/dev/null || true
          grep -c 'sparkle:deltas' "$NIGHTLY_APPCAST" || echo "no deltas in $NIGHTLY_APPCAST (no previous build of this track)"

      - name: Upload nightly variant artifacts
        if: needs.decide.outputs.fast_build != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-nightly-variant-${{ matrix.variant }}
          path: |
            ${{ needs.decide.outputs.dmg_prefix }}-*.dmg
            ${{ needs.decide.outputs.dmg_prefix }}-*.delta
            appcast*.xml
          if-no-files-found: error
          retention-days: 3

      - name: Upload fast arm64 dogfood artifact
        if: needs.decide.outputs.fast_build == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-nightly-fast-${{ needs.decide.outputs.short_sha }}
          path: |
            ${{ needs.decide.outputs.dmg_prefix }}-arm64.dmg
            ${{ needs.decide.outputs.dmg_prefix }}-arm64-*.dmg
            remote-daemon-assets/cmuxd-remote-*
          if-no-files-found: error
          retention-days: 3

      - name: Cleanup keychain
        if: always()
        run: |
          security delete-keychain build.keychain >/dev/null 2>&1 || true
          rm -f /tmp/cert.p12

  publish-nightly:
    # Production secrets: GitHub releases them only to protected refs (the
    # environment's deployment branch policy: main, tags v*). The nightly-next
    # track uses `release-next`, whose policy allows only branch nightly-next.
    environment: ${{ needs.decide.outputs.environment }}
    # rc/** branches share one release. Serialize its mutable aliases and feeds
    # by channel, even when workflow-level groups have different branch names.
    concurrency:
      group: release-publish-${{ needs.decide.outputs.release_tag }}
      cancel-in-progress: false
    needs: [decide, build-nightly-app, build-sign-notarize-nightly]
    outputs:
      tag_status: ${{ steps.tag-outcome.outputs.tag_status }}
    if: needs.decide.outputs.should_build == 'true' && needs.decide.outputs.fast_build != 'true' && needs.decide.outputs.build_only != 'true' && (github.event_name != 'schedule' || github.event.schedule == '47 8 * * *')
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 30
    env:
      NIGHTLY_LEGACY_VARIANT: ${{ needs.decide.outputs.legacy_variant }}
      NIGHTLY_BUILD: ${{ needs.build-nightly-app.outputs.daemon_build }}
      CHANNEL: ${{ needs.decide.outputs.channel }}
      TRACK: ${{ needs.decide.outputs.track }}
      CHANNEL_DMG_PREFIX: ${{ needs.decide.outputs.dmg_prefix }}
      CHANNEL_RELEASE_TAG: ${{ needs.decide.outputs.release_tag }}
      CHANNEL_FEED_BASE: ${{ needs.decide.outputs.feed_base }}
    steps:
      - name: Checkout publish ref
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ needs.decide.outputs.head_sha }}

      - name: Download nightly variant artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: cmux-nightly-variant-*
          path: nightly-out
          merge-multiple: true

      - name: Download SSH daemon assets for publication
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: cmux-nightly-remote-daemon
          path: nightly-out

      - name: Verify SSH daemon assets survived artifact transfer
        run: |
          python3 scripts/verify_remote_daemon_release.py \
            --manifest "nightly-out/cmuxd-remote-manifest-${NIGHTLY_BUILD}.json" \
            --assets-dir nightly-out

      - name: Assemble legacy nightly names
        run: |
          set -euo pipefail
          cd nightly-out
          ls -l
          for variant in arm64 x86_64; do
            [ -f "${CHANNEL_DMG_PREFIX}-${variant}.dmg" ] || { echo "missing ${CHANNEL_DMG_PREFIX}-${variant}.dmg" >&2; exit 1; }
            [ -f "appcast-${variant}.xml" ] || { echo "missing appcast-${variant}.xml" >&2; exit 1; }
          done
          # `cmux-nightly-macos.dmg` and `appcast.xml` are the download and feed
          # every pre-existing link and install uses. They stay universal: the
          # universal variant generates appcast.xml itself, and installs move to
          # their architecture's feed on the next update check.
          [ "$NIGHTLY_LEGACY_VARIANT" = "universal" ] || { echo "unexpected legacy variant: $NIGHTLY_LEGACY_VARIANT" >&2; exit 1; }
          [ -f "${CHANNEL_DMG_PREFIX}-universal.dmg" ] || { echo "universal variant DMG missing" >&2; exit 1; }
          [ -f appcast.xml ] || { echo "universal variant appcast.xml missing" >&2; exit 1; }
          cp "${CHANNEL_DMG_PREFIX}-universal.dmg" "${CHANNEL_DMG_PREFIX}.dmg"
          # Compatibility feed for nightlies older than the unified appcast.
          cp appcast.xml appcast-universal.xml
          ls -l

      - name: Upload branch nightly artifacts
        if: needs.decide.outputs.should_publish != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-nightly-${{ needs.decide.outputs.short_sha }}
          path: |
            nightly-out/${{ needs.decide.outputs.dmg_prefix }}*.dmg
            nightly-out/${{ needs.decide.outputs.dmg_prefix }}*.delta
            nightly-out/appcast*.xml
            nightly-out/cmuxd-remote-*
          if-no-files-found: error

      # Before anything is published: every cmux-next appcast names only
      # nightly-next downloads and the cmux-next Sparkle channel.
      - name: Guard nightly-next publication
        if: needs.decide.outputs.should_publish == 'true' && needs.decide.outputs.track == 'nightly-next'
        run: |
          set -euo pipefail
          for appcast in appcast-arm64.xml appcast-x86_64.xml appcast-universal.xml appcast.xml; do
            python3 scripts/ci/nightly-next-guard.py appcast "nightly-out/$appcast"
          done

      - name: Prune old nightly release assets
        if: needs.decide.outputs.should_publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 ./scripts/prune_nightly_release_assets.py \
            --repo manaflow-ai/cmux \
            --release-tag "$CHANNEL_RELEASE_TAG" \
            --name-prefix "${CHANNEL_DMG_PREFIX}-" \
            --keep-builds 100 \
            --max-assets 950 \
            --best-effort \
            --execute

      - name: Publish nightly release assets
        if: needs.decide.outputs.should_publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/ci/publish-release-assets.py \
            --repo "$GITHUB_REPOSITORY" --tag "$CHANNEL_RELEASE_TAG" \
            --immutable "nightly-out/${CHANNEL_DMG_PREFIX}-arm64-${NIGHTLY_BUILD}.dmg" \
            --immutable "nightly-out/${CHANNEL_DMG_PREFIX}-x86_64-${NIGHTLY_BUILD}.dmg" \
            --immutable "nightly-out/${CHANNEL_DMG_PREFIX}-universal-${NIGHTLY_BUILD}.dmg" \
            --optional-immutable "nightly-out/${CHANNEL_DMG_PREFIX}-*-${NIGHTLY_BUILD}-*.delta" \
            --immutable "nightly-out/cmuxd-remote-linux-arm64-${NIGHTLY_BUILD}" \
            --immutable "nightly-out/cmuxd-remote-linux-amd64-${NIGHTLY_BUILD}" \
            --immutable "nightly-out/cmuxd-remote-darwin-arm64-${NIGHTLY_BUILD}" \
            --immutable "nightly-out/cmuxd-remote-darwin-amd64-${NIGHTLY_BUILD}" \
            --immutable "nightly-out/cmuxd-remote-checksums-${NIGHTLY_BUILD}.txt" \
            --immutable "nightly-out/cmuxd-remote-manifest-${NIGHTLY_BUILD}.json" \
            --alias "nightly-out/${CHANNEL_DMG_PREFIX}-arm64.dmg" \
            --alias "nightly-out/${CHANNEL_DMG_PREFIX}-x86_64.dmg" \
            --alias "nightly-out/${CHANNEL_DMG_PREFIX}-universal.dmg" \
            --alias "nightly-out/${CHANNEL_DMG_PREFIX}.dmg" \
            --replace-feeds \
            --feed nightly-out/appcast-arm64.xml \
            --feed nightly-out/appcast-x86_64.xml \
            --feed nightly-out/appcast-universal.xml \
            --feed nightly-out/appcast.xml

      - name: Download the cmux-next source archive
        if: needs.decide.outputs.should_publish == 'true' && needs.decide.outputs.track == 'nightly-next' && vars.CMUX_NEXT_PUBLISH_SOURCE_ARCHIVE == '1'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: cmux-next-source-archive
          path: source-archive

      # Gated by vars.CMUX_NEXT_PUBLISH_SOURCE_ARCHIVE (the coordinator sets it).
      # Tags the build commit cmux-next-src-<11 characters> and attaches
      # cmux-next-source-<build>.tar.gz to the nightly-next release. The prune
      # step removes it only together with the app assets of <build>, whose
      # source offer names it (prune_nightly_release_assets.py), never by age.
      - name: Publish the cmux-next source archive
        if: needs.decide.outputs.should_publish == 'true' && needs.decide.outputs.track == 'nightly-next' && vars.CMUX_NEXT_PUBLISH_SOURCE_ARCHIVE == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ needs.decide.outputs.head_sha }}
        run: |
          set -euo pipefail
          short="${HEAD_SHA:0:11}"
          src=(source-archive/cmux-next-source-*.tar.gz)
          [[ ${#src[@]} -eq 1 && -f "${src[0]}" ]] || { echo "expected one source archive, found: ${src[*]}" >&2; exit 1; }
          vt="$(python3 scripts/cmux-next/notices/check_ghostty_vt_notices.py --rev "$HEAD_SHA" --print-source | sed -n 's/^libghostty-vt source: //p')"
          next=()
          if [[ "${vt%% *}" != ghostty ]]; then
            next=(--next-name "${vt%% *}" --next-revision "${vt##* }"
              --next-license-manifest "source-archive/${vt%% *}-licenses/SOURCE-MANIFEST.json")
          fi
          python3 scripts/cmux-next/notices/ghostty_source_archive.py verify --archive "${src[0]}" \
            --license-manifest source-archive/ghostty-licenses/SOURCE-MANIFEST.json \
            --revision "$(git rev-parse "$HEAD_SHA:ghostty")" ${next[@]+"${next[@]}"}
          mkdir -p source-out
          cp "${src[0]}" "source-out/cmux-next-source-${NIGHTLY_BUILD}.tar.gz"
          if existing="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/cmux-next-src-$short" --jq .object.sha 2>/dev/null)"; then
            [[ "$existing" == "$HEAD_SHA" ]] || { echo "tag cmux-next-src-$short points at $existing, not $HEAD_SHA" >&2; exit 1; }
          else
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/cmux-next-src-$short" -f "sha=$HEAD_SHA" >/dev/null
          fi
          python3 scripts/ci/publish-release-assets.py \
            --repo "$GITHUB_REPOSITORY" --tag "$CHANNEL_RELEASE_TAG" \
            --immutable "source-out/cmux-next-source-${NIGHTLY_BUILD}.tar.gz"

      - name: Mint release tag app token
        id: release-tag-token
        if: needs.decide.outputs.should_publish == 'true'
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          # The release App (Contents + Workflows write only); its id and key
          # live only in the release and release-next environments.
          app-id: ${{ secrets.CMUX_RELEASE_APP_ID }}
          private-key: ${{ secrets.CMUX_RELEASE_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-workflows: write

      # nightly-next commits change .github/workflows relative to main, and
      # GitHub refuses the Actions token any release create/update that targets
      # such a commit. nightly-next therefore publishes its release metadata
      # with the release App token; other channels keep the Actions token.
      - name: Publish verified nightly release metadata
        if: needs.decide.outputs.should_publish == 'true'
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          token: ${{ needs.decide.outputs.track == 'nightly-next' && steps.release-tag-token.outputs.token || github.token }}
          tag_name: ${{ needs.decide.outputs.release_tag }}
          target_commitish: ${{ needs.decide.outputs.head_sha }}
          name: ${{ needs.decide.outputs.release_name }}
          prerelease: true
          make_latest: false
          draft: false
          body: |
            Automated ${{ needs.decide.outputs.channel }} build for `${{ needs.decide.outputs.short_sha }}` from `${{ github.ref_name }}`.
            Published commit: `${{ needs.decide.outputs.head_sha }}`.
            **${{ needs.decide.outputs.app_name }}** ships one app per architecture (bundle ID `${{ needs.decide.outputs.bundle_id }}`):
            - [Apple silicon: ${{ needs.decide.outputs.dmg_prefix }}-arm64.dmg](https://github.com/manaflow-ai/cmux/releases/download/${{ needs.decide.outputs.release_tag }}/${{ needs.decide.outputs.dmg_prefix }}-arm64.dmg), feed `appcast-arm64.xml`
            - [Intel: ${{ needs.decide.outputs.dmg_prefix }}-x86_64.dmg](https://github.com/manaflow-ai/cmux/releases/download/${{ needs.decide.outputs.release_tag }}/${{ needs.decide.outputs.dmg_prefix }}-x86_64.dmg), feed `appcast-x86_64.xml`
            - [Universal (any Mac): ${{ needs.decide.outputs.dmg_prefix }}.dmg](https://github.com/manaflow-ai/cmux/releases/download/${{ needs.decide.outputs.release_tag }}/${{ needs.decide.outputs.dmg_prefix }}.dmg), feed `appcast.xml`; the app switches to its architecture's feed on the first update check

      - name: Upload nightly appcasts to R2
        if: needs.decide.outputs.should_publish == 'true' && needs.decide.outputs.track != 'nightly-next'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: "https://${{ secrets.CF_R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
        run: |
          set -euo pipefail
          # Upload after the GitHub Release publish so no appcast references a
          # DMG that doesn't exist yet. R2 PutObject is atomic, so each appcast is
          # either the old version or the new one, never missing. Thin feeds go
          # first: the app rewrites the legacy feed URL to a thin feed, so those
          # must already be current when the legacy feed changes.
          for appcast in appcast-arm64.xml appcast-x86_64.xml appcast-universal.xml appcast.xml; do
            python3 scripts/ci/upload-r2-object.py \
              --file "nightly-out/$appcast" \
              --endpoint-url "$R2_ENDPOINT" \
              --bucket cmux-binaries \
              --key "${CHANNEL_RELEASE_TAG}/$appcast" \
              --content-type "application/xml" \
              --cache-control "no-cache, no-store, must-revalidate"
            echo "R2 appcast upload complete: ${CHANNEL_FEED_BASE}/$appcast"
          done

      # The nightly-next track writes only its own bucket prefix with its own
      # scoped token (release-next secrets), after the guard has checked every
      # appcast enclosure and object key. It never receives CF_R2_* .
      - name: Upload nightly-next appcasts to R2
        if: needs.decide.outputs.should_publish == 'true' && needs.decide.outputs.track == 'nightly-next'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.NIGHTLY_NEXT_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.NIGHTLY_NEXT_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: "https://${{ secrets.NIGHTLY_NEXT_R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
        run: |
          set -euo pipefail
          for appcast in appcast-arm64.xml appcast-x86_64.xml appcast-universal.xml appcast.xml; do
            key="${NIGHTLY_NEXT_R2_PREFIX}${appcast}"
            python3 scripts/ci/nightly-next-guard.py appcast "nightly-out/$appcast"
            python3 scripts/ci/nightly-next-guard.py r2-key "$NIGHTLY_NEXT_R2_BUCKET" "$key"
            python3 scripts/ci/upload-r2-object.py \
              --file "nightly-out/$appcast" \
              --endpoint-url "$R2_ENDPOINT" \
              --bucket "$NIGHTLY_NEXT_R2_BUCKET" \
              --key "$key" \
              --content-type "application/xml" \
              --cache-control "no-cache, no-store, must-revalidate"
            echo "R2 appcast upload complete: ${CHANNEL_FEED_BASE}/$appcast"
          done

      # The marker is written only after immutable assets, aliases, release
      # metadata, and every appcast have succeeded. A rerun can therefore use
      # it as an idempotency record without mistaking a partial publication for
      # a complete one.
      - name: Record verified nightly publication
        if: needs.decide.outputs.should_publish == 'true'
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          token: ${{ needs.decide.outputs.track == 'nightly-next' && steps.release-tag-token.outputs.token || github.token }}
          tag_name: ${{ needs.decide.outputs.release_tag }}
          target_commitish: ${{ needs.decide.outputs.head_sha }}
          name: ${{ needs.decide.outputs.release_name }}
          prerelease: true
          make_latest: false
          draft: false
          body: |
            <!-- cmux-published-sha: ${{ needs.decide.outputs.head_sha }} -->
            Automated ${{ needs.decide.outputs.channel }} build for `${{ needs.decide.outputs.short_sha }}` from `${{ github.ref_name }}`.
            Published commit: `${{ needs.decide.outputs.head_sha }}`.
            **${{ needs.decide.outputs.app_name }}** ships one app per architecture (bundle ID `${{ needs.decide.outputs.bundle_id }}`):
            - [Apple silicon: ${{ needs.decide.outputs.dmg_prefix }}-arm64.dmg](https://github.com/manaflow-ai/cmux/releases/download/${{ needs.decide.outputs.release_tag }}/${{ needs.decide.outputs.dmg_prefix }}-arm64.dmg), feed `appcast-arm64.xml`
            - [Intel: ${{ needs.decide.outputs.dmg_prefix }}-x86_64.dmg](https://github.com/manaflow-ai/cmux/releases/download/${{ needs.decide.outputs.release_tag }}/${{ needs.decide.outputs.dmg_prefix }}-x86_64.dmg), feed `appcast-x86_64.xml`
            - [Universal (any Mac): ${{ needs.decide.outputs.dmg_prefix }}.dmg](https://github.com/manaflow-ai/cmux/releases/download/${{ needs.decide.outputs.release_tag }}/${{ needs.decide.outputs.dmg_prefix }}.dmg), feed `appcast.xml`; the app switches to its architecture's feed on the first update check

      # The channel's release tag is the fast completion marker used by the
      # decide job. Move it to the fixed candidate selected at dispatch only
      # after every publication step succeeds. A newer commit becomes the next
      # run's candidate. The tag is deliberately the only operation using the
      # elevated app token on classic channels (nightly-next also needs it for
      # release metadata, see above); assets and feeds use the Actions token and
      # remain the publication record if this marker is stale.
      - name: Move channel release tag to built commit
        id: move-channel-release-tag
        if: needs.decide.outputs.should_publish == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.release-tag-token.outputs.token }}
          GITHUB_TOKEN: ''
        run: |
          set -euo pipefail
          # Every rc/** branch shares the rc tag and those branches diverge,
          # so only the nightly tag requires a fast-forward. nightly-next may
          # move from a baseline build (see promote-nightly-next on main). The helper retries
          # only transient API/network failures and reads the ref back before
          # declaring the marker updated. Permission failures are terminal.
          python3 scripts/ci/update-release-tag.py \
            --repo "$GITHUB_REPOSITORY" \
            --tag "$CHANNEL_RELEASE_TAG" \
            --sha "${{ needs.decide.outputs.head_sha }}" \
            ${{ needs.decide.outputs.release_tag != 'nightly' && '--allow-non-descendant' || '' }}

      - name: Record nightly publication marker outcome
        id: tag-outcome
        if: always() && needs.decide.outputs.should_publish == 'true'
        env:
          TAG_MOVE_OUTCOME: ${{ steps.move-channel-release-tag.outcome }}
          CHANNEL_RELEASE_TAG: ${{ needs.decide.outputs.release_tag }}
          HEAD_SHA: ${{ needs.decide.outputs.head_sha }}
        run: |
          set -euo pipefail
          if [ "$TAG_MOVE_OUTCOME" = "success" ]; then
            echo "tag_status=updated" >> "$GITHUB_OUTPUT"
            {
              echo "### Channel release tag updated"
              echo ""
              echo "\`$CHANNEL_RELEASE_TAG\` now points to \`$HEAD_SHA\`."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "tag_status=stale" >> "$GITHUB_OUTPUT"
            echo "::warning::Published assets, release metadata, and appcasts are live; the $CHANNEL_RELEASE_TAG tag marker is stale because its final update failed."
            {
              echo "### Published, tag marker stale"
              echo ""
              echo "Assets, release metadata, and appcasts for \`$HEAD_SHA\` are published, but \`$CHANNEL_RELEASE_TAG\` was not advanced. The next eligible publication will retry the marker without republishing this commit."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  # Keep one open issue per failed publication boundary. A stale channel tag
  # leaves the assets, release metadata, and feeds available, so the incident
  # must say that explicitly instead of claiming installs stopped updating.
  # R114 changelog (cmux-next track only): signed release notes for the
  # in-app changelog. The content-signing environment (main, feat-cmux-next,
  # nightly-next) holds only the Ed25519 content key; this job never sees the
  # Sparkle key or R2 credentials. publish-release-notes uploads the result
  # with release-next's scoped R2 token after the appcasts are live.
  sign-release-notes:
    needs: [decide, build-nightly-app]
    if: needs.decide.outputs.should_publish == 'true' && needs.decide.outputs.track == 'nightly-next'
    environment: content-signing
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      NIGHTLY_BUILD: ${{ needs.build-nightly-app.outputs.daemon_build }}
      HEAD_SHA: ${{ needs.decide.outputs.head_sha }}
      CONTENT_PUBLIC_KEY: AnrDI4vqN4lFGX2IpzeWPZsa/Hk7yQMkVIKppFwAst4=
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.decide.outputs.head_sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Build and sign the release notes
        env:
          CONTENT_SIGNING_ED25519_PEM: ${{ secrets.CONTENT_SIGNING_ED25519_PEM }}
        run: |
          set -euo pipefail
          # The previous published commit: the nightly-next tag still points at
          # it (publish-nightly moves it after this run publishes).
          since="$(git rev-parse -q --verify 'refs/tags/nightly-next^{commit}' || true)"
          python3 scripts/cmux-next/release-notes.py build --build "$NIGHTLY_BUILD" \
            --short "1.0.0-nightly.$NIGHTLY_BUILD" --date "$(date -u +%Y-%m-%d)" \
            --head "$HEAD_SHA" --since "$since" --out notes
          # Extend the published index only when its signature verifies.
          previous=""
          if curl -fsSL -A "cmux-release-notes/1" -o notes/previous-index.json https://files-next.cmux.com/nightly-next/notes/index.json \
             && curl -fsSL -A "cmux-release-notes/1" -o notes/previous-index.json.sig https://files-next.cmux.com/nightly-next/notes/index.json.sig \
             && python3 scripts/cmux-next/release-notes.py verify --public-key "$CONTENT_PUBLIC_KEY" notes/previous-index.json; then
            previous=notes/previous-index.json
          fi
          python3 scripts/cmux-next/release-notes.py index --notes "notes/$NIGHTLY_BUILD.json" \
            ${previous:+--previous "$previous"} --out notes/index.json
          rm -f notes/previous-index.json notes/previous-index.json.sig
          # Announcement cards (R114): the reviewed release-notes/next/announcements.json, when present.
          signed=("notes/$NIGHTLY_BUILD.json" notes/index.json)
          if [ -f release-notes/next/announcements.json ]; then
            python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); assert d.get("version")==1 and isinstance(d.get("items"),list)' release-notes/next/announcements.json
            cp release-notes/next/announcements.json notes/announcements.json
            signed+=(notes/announcements.json)
          fi
          key="$(mktemp)"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$CONTENT_SIGNING_ED25519_PEM" > "$key"
          python3 scripts/cmux-next/release-notes.py sign --key "$key" "${signed[@]}"
          for f in "${signed[@]}"; do
            python3 scripts/cmux-next/release-notes.py verify --public-key "$CONTENT_PUBLIC_KEY" "$f"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-notes
          path: notes/
          retention-days: 7

  publish-release-notes:
    needs: [decide, publish-nightly, sign-release-notes]
    if: needs.decide.outputs.track == 'nightly-next' && needs.publish-nightly.result == 'success' && needs.sign-release-notes.result == 'success'
    environment: ${{ needs.decide.outputs.environment }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.decide.outputs.head_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-notes
          path: notes
      - name: Upload the signed release notes to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.NIGHTLY_NEXT_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.NIGHTLY_NEXT_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: "https://${{ secrets.NIGHTLY_NEXT_R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
        run: |
          set -euo pipefail
          for file in notes/*; do
            name="$(basename "$file")"
            key="${NIGHTLY_NEXT_R2_PREFIX}notes/$name"
            python3 scripts/ci/nightly-next-guard.py r2-key "$NIGHTLY_NEXT_R2_BUCKET" "$key"
            case "$name" in index.json|index.json.sig|announcements.json|announcements.json.sig) cache="no-cache, no-store, must-revalidate" ;; *) cache="public, max-age=31536000, immutable" ;; esac
            case "$name" in *.json) type="application/json" ;; *) type="text/plain" ;; esac
            python3 scripts/ci/upload-r2-object.py --file "$file" --endpoint-url "$R2_ENDPOINT" \
              --bucket "$NIGHTLY_NEXT_R2_BUCKET" --key "$key" --content-type "$type" --cache-control "$cache"
          done

  report-nightly-failure:
    needs: [decide, build-nightly-ghostty-cli-helper, build-nightly-app, resolve-nightly-cmux-tui-client, build-sign-notarize-nightly, publish-nightly]
    if: always() && needs.decide.outputs.should_publish == 'true' && (contains(needs.*.result, 'failure') || needs.publish-nightly.outputs.tag_status == 'stale')
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or update the nightly failure issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          HEAD_SHA: ${{ needs.decide.outputs.head_sha }}
          RESULTS: ${{ toJSON(needs) }}
          CHANNEL_RELEASE_TAG: ${{ needs.decide.outputs.release_tag }}
          CHANNEL_APP_NAME: ${{ needs.decide.outputs.app_name }}
          REF_NAME: ${{ github.ref_name }}
          TAG_STATUS: ${{ needs.publish-nightly.outputs.tag_status }}
        with:
          script: |
            const { owner, repo } = context.repo;
            // One label per release track (nightly, rc, nightly-next), so a
            // cmux-next result never opens or closes main's NIGHTLY incident.
            const appName = process.env.CHANNEL_APP_NAME;
            const refName = process.env.REF_NAME;
            const label = `${process.env.CHANNEL_RELEASE_TAG}-failure`;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const results = JSON.parse(process.env.RESULTS);
            const failed = Object.entries(results).filter(([, v]) => v.result === 'failure').map(([k]) => k);
            const tagStale = process.env.TAG_STATUS === 'stale';
            const publicationLine = tagStale
              ? `${appName} published, tag marker stale for ${process.env.HEAD_SHA} (${refName}). Assets, release metadata, and appcasts are available; only the channel completion marker failed to advance.`
              : `${appName} run ${runUrl} failed on ${process.env.HEAD_SHA} (${refName}) in: ${failed.join(', ')}.`;
            const failedLine = failed.length > 0 ? `Failed jobs: ${failed.join(', ')}.` : 'The tag marker update failed after publication completed.';
            const body = `${publicationLine}\n\n${failedLine}\n\nThe next successful publication will update this incident. Run: ${runUrl}`;
            try {
              await github.rest.issues.getLabel({ owner, repo, name: label });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.issues.createLabel({ owner, repo, name: label, color: 'b60205', description: `${appName} publish failing` });
            }
            const open = await github.rest.issues.listForRepo({ owner, repo, labels: label, state: 'open', per_page: 1 });
            if (open.data.length > 0) {
              await github.rest.issues.createComment({ owner, repo, issue_number: open.data[0].number, body });
            } else {
              await github.rest.issues.create({ owner, repo, title: `${appName} build is failing on ${refName}`, labels: [label], body });
            }

  close-nightly-failure-issue:
    needs: [decide, publish-nightly]
    if: needs.decide.outputs.should_publish == 'true' && needs.publish-nightly.result == 'success' && needs.publish-nightly.outputs.tag_status == 'updated'
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    permissions:
      contents: read
      issues: write
    steps:
      - name: Close the nightly failure issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          HEAD_SHA: ${{ needs.decide.outputs.head_sha }}
          CHANNEL_RELEASE_TAG: ${{ needs.decide.outputs.release_tag }}
          CHANNEL_APP_NAME: ${{ needs.decide.outputs.app_name }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const open = await github.rest.issues.listForRepo({ owner, repo, labels: `${process.env.CHANNEL_RELEASE_TAG}-failure`, state: 'open', per_page: 10 });
            for (const issue of open.data) {
              await github.rest.issues.createComment({ owner, repo, issue_number: issue.number, body: `${process.env.CHANNEL_APP_NAME} publish succeeded again on ${process.env.HEAD_SHA}: ${runUrl}` });
              await github.rest.issues.update({ owner, repo, issue_number: issue.number, state: 'closed' });
            }
