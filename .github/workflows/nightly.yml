    # A timed-out pick-nightly-build-runner must not skip this job (see build-nightly-app's `if`).
    if: "!cancelled() && needs.decide.result == 'success' && needs.resolve-nightly-cmux-tui-client.result == 'success' && needs.decide.outputs.should_build == 'true' && (github.event_name != 'schedule' || github.event.schedule == '47 8 * * *') && needs.resolve-nightly-cmux-tui-client.outputs.already_published != 'true' && needs.resolve-nightly-cmux-tui-client.outputs.superseded != 'true' && needs.decide.outputs.continue_only != 'true' && needs.decide.outputs.one_job != 'true' && needs.decide.outputs.build_only != 'true'"
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.CI_NIGHTLY_MINI != '' && vars.CI_NIGHTLY_MINI || github.ref == 'refs/heads/nightly-next' && needs.pick-nightly-build-runner.outputs.attempt == github.run_attempt && needs.pick-nightly-build-runner.outputs.helper != needs.pick-nightly-build-runner.outputs.dedicated && needs.pick-nightly-build-runner.outputs.helper || github.repository == 'manaflow-ai/cmux' && needs.decide.outputs.track == 'nightly-next' && github.run_attempt == 1 && vars.CI_NIGHTLY_ONLY_RUNNER == 'glaeda-nightly-only-m4pro' && vars.CI_NIGHTLY_ONLY_RUNNER || vars.CI_NIGHTLY_ONLY_RUNNER || 'glaeda-nightly-only-m4pro' }}
    permissions:
      contents: read
    timeout-minutes: ${{ vars.CI_NIGHTLY_MINI != '' && 140 || 20 }}
    steps:
      - name: Keep the resumed daemon assets
        if: inputs.nightly_next_unsigned_run != ''
        run: echo "The original run's daemon assets were retained by the unsigned resume."

      - name: Checkout build ref
        if: inputs.nightly_next_unsigned_run == ''
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ needs.resolve-nightly-cmux-tui-client.outputs.build_sha }}
          submodules: false

      - &x51
        name: Set up Go for the SSH daemon assets
        if: inputs.nightly_next_unsigned_run == '' && !env.LEFT_SLOT
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # The exact Go of the shipped cmuxd-remote (its go.mod `toolchain` line);
          # build_remote_daemon_release_assets.sh refuses any other.
          go-version-file: daemon/remote/go.mod
          cache: false

      - &x52
        name: Build immutable SSH daemon assets once for every app variant
        if: inputs.nightly_next_unsigned_run == '' && !env.LEFT_SLOT
        env:
          BUILD: ${{ needs.resolve-nightly-cmux-tui-client.outputs.daemon_build }}
          TRACK: ${{ needs.decide.outputs.track }}
          RELEASE_TAG: ${{ needs.decide.outputs.release_tag }}
        run: bash scripts/ci/nightly-steps/remote-daemon-build-assets.sh

      - &x53
        name: Upload SSH daemon assets
        id: upload-ssh-daemon-assets
        continue-on-error: true
        if: inputs.nightly_next_unsigned_run == '' && !env.LEFT_SLOT
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-nightly-remote-daemon
          path: remote-daemon-assets/cmuxd-remote-*
          if-no-files-found: error
          retention-days: 7
          # A picker re-run (owned-pool rescue) re-runs this job after it succeeded beside a stuck app build.
          overwrite: true

      - &x54
        name: Upload SSH daemon assets (retry)
        if: "!cancelled() && steps.upload-ssh-daemon-assets.outcome == 'failure' && (inputs.nightly_next_unsigned_run == '' && !env.LEFT_SLOT)"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-nightly-remote-daemon
          path: remote-daemon-assets/cmuxd-remote-*
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  attest-nightly-remote-daemon:
    # Provenance is advisory, as it was inside the app job. No publishing job
    # needs this job: a quota wait must not delay the feed.
    needs: [decide, build-nightly-app, build-nightly-remote-daemon, nightly-next-one]
    # A timed-out pick-nightly-build-runner must not skip this job (see build-nightly-app's `if`).
    if: "!cancelled() && needs.decide.result == 'success' && (needs.build-nightly-app.result == 'success' && needs.build-nightly-remote-daemon.result == 'success' || needs.nightly-next-one.result == 'success' && needs.nightly-next-one.outputs.left != 'true') && inputs.nightly_next_unsigned_run == ''"
    # The owned nightly-only Mac pool first (the all-nightly reservation, as route-visual-gate-nightly),
    # then the nightly-only pool variable or label, never Blacksmith (nightlies never use Blacksmith). Its OIDC token only
    # writes provenance for these assets; the pool already builds the nightly app those assets ship in.
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.CI_NIGHTLY_MINI != '' && vars.CI_NIGHTLY_MINI || github.repository == 'manaflow-ai/cmux' && github.ref == 'refs/heads/nightly-next' && github.run_attempt == 1 && vars.CI_NIGHTLY_ONLY_RUNNER == 'glaeda-nightly-only-m4pro' && vars.CI_NIGHTLY_ONLY_RUNNER || vars.CI_NIGHTLY_ONLY_RUNNER || 'glaeda-nightly-only-m4pro' }}
    permissions:
      contents: read
      attestations: write
      id-token: write
    timeout-minutes: ${{ vars.CI_NIGHTLY_MINI != '' && 195 || 75 }}
    steps:
      - name: Checkout attestation controls
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          sparse-checkout: scripts/ci

      - name: Download SSH daemon assets
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: cmux-nightly-remote-daemon
          path: remote-daemon-assets

      # Provenance is for `gh attestation verify`; no nightly step reads it. Persisting it spends the shared
      # installation API budget (spent Oct 25-26: six runs threw a finished build away), so wait (bounded)
      # for 200 calls, try, wait once more, retry, and on a second refusal ship with a warning.
      - name: Wait for API budget before the daemon attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: if [ -f scripts/ci/gh_budget_wait.sh ]; then bash scripts/ci/gh_budget_wait.sh --reserve 200; fi

      - name: Attest immutable SSH daemon assets
        id: attest_daemon
        continue-on-error: true
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: remote-daemon-assets/cmuxd-remote-*

      - name: Wait for the API budget before retrying the daemon attestation
        if: steps.attest_daemon.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        # One bounded wait, only under 200 calls left; with the pre-step's, at most an hour.
        run: if [ -f scripts/ci/gh_budget_wait.sh ]; then bash scripts/ci/gh_budget_wait.sh --reserve 200; fi

      - name: Retry the daemon attestation
        id: attest_daemon_retry
        if: steps.attest_daemon.outcome == 'failure'
        continue-on-error: true
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: remote-daemon-assets/cmuxd-remote-*

      - name: Report a missing daemon attestation
        if: steps.attest_daemon.outcome == 'failure' && steps.attest_daemon_retry.outcome == 'failure'
        run: bash -e scripts/ci/nightly-steps/attest-report-missing.sh

  # Runs beside build-nightly-app. Deepening the shallow clone to find the
  # newest published cmux-tui commit took 1.5 to 11 minutes after the Xcode
  # compile (runs 36044415287, 36051668491); here it overlaps the compile.
  resolve-nightly-cmux-tui-client:
    needs: decide
    if: needs.decide.outputs.should_build == 'true' && (github.event_name != 'schedule' || github.event.schedule == '47 8 * * *')
    # retry-nightly-next dispatches a new run at attempt 1. Use the rerun pool for those dispatches too.
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.run_attempt == 1 && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' && inputs.nightly_next_loop_retry == '') && 'cmux-gcp-nightly-x64' || 'cmux-linux' }}
    permissions:
      contents: read
      actions: read
    timeout-minutes: ${{ vars.CI_NIGHTLY_MINI != '' && 195 || 75 }}
    outputs:
      commit: ${{ steps.resume_source.outputs.build_sha || steps.resolve.outputs.commit }}
      key: ${{ steps.resume_tree.outputs.key || steps.pending.outputs.key || steps.resolve.outputs.key }}
      source_commit: ${{ steps.resume_source.outputs.build_sha || steps.pending.outputs.source_commit || steps.resolve.outputs.source_commit }}
      tree_pending: ${{ steps.pending.outputs.tree_pending == 'true' && 'true' || 'false' }}
      tree_candidates: ${{ steps.pending.outputs.candidates }}
      # "<commit> <key>" of the newest published tree, bundled when the tip's is still unpublished (RFD 0021).
      tree_fallback: ${{ steps.pending.outputs.fallback }}
      # "<commit> <commits> <hours>": the older commit whose tree the tip's app bundles (older-tree-for-tip.sh).
      tree_from: ${{ steps.resolve.outputs.tree_from }}
      build_sha: ${{ steps.build.outputs.build_sha }}
      build_short_sha: ${{ steps.build.outputs.build_short_sha }}
      tip_sha: ${{ needs.decide.outputs.head_sha }}
      behind: ${{ steps.build.outputs.behind }}
      behind_hours: ${{ steps.build.outputs.behind_hours }}
      chief_key: ${{ steps.chief-key.outputs.key }}
      already_published: ${{ steps.build.outputs.already_published }}
      superseded: ${{ steps.superseded.outputs.superseded }}
      # The build number (<run id><attempt>) for both side-by-side jobs, the app and the daemon.
      daemon_build: ${{ steps.daemon-build.outputs.build }}
    steps:
      - name: Fix this run's build number
        id: daemon-build
        run: echo "build=${GITHUB_RUN_ID}$(printf '%02d' "${GITHUB_RUN_ATTEMPT:-1}")" >> "$GITHUB_OUTPUT"

      - name: Checkout build ref
        id: checkout
        # A reused checkout whose store makes git's pack-objects BUG() out (signal 6) fails every retry in place;
        # the next two steps drop that store and check out fresh. Leo, 2026-11-25: "are we able to decouple".
        continue-on-error: true
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ needs.decide.outputs.head_sha }}
          submodules: false
          # The resolver searches the last CMUX_TUI_TREE_SEARCH_COMMITS commits.
          fetch-depth: 64
      - name: Drop the reused git store after a failed checkout
        if: steps.checkout.outcome == 'failure'
        run: echo "::warning title=Nightly checkout::the reused checkout failed; checking out into a fresh git store" && rm -rf "$GITHUB_WORKSPACE/.git"
      - name: Checkout build ref into a fresh store
        if: steps.checkout.outcome == 'failure'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ needs.decide.outputs.head_sha }}
          submodules: false
          fetch-depth: 64

      - &ensure-gh
        name: Install gh if this runner lacks it
        run: bash scripts/ci/nightly-steps/ensure-gh.sh

      - &wait-through-github-api-rate-l
        name: Wait through GitHub API rate limits in this job's gh calls
        run: if [ -f scripts/ci/gh_budget_wait.sh ]; then bash scripts/ci/gh_budget_wait.sh --install; fi

      - name: Validate the saved unsigned nightly source
        if: inputs.nightly_next_unsigned_run != ''
        id: resume_source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.nightly_next_unsigned_run }}
          SOURCE_ATTEMPT: ${{ inputs.nightly_next_unsigned_attempt }}
        run: python3 scripts/ci/resume-unsigned-nightly.py plan --run-id "$SOURCE_RUN" --attempt "$SOURCE_ATTEMPT"

      - name: Resolve the original cmux-tui tree
        if: inputs.nightly_next_unsigned_run != ''
        id: resume_tree
        env:
          SOURCE_SHA: ${{ steps.resume_source.outputs.build_sha }}
        run: bash scripts/ci/nightly-steps/resolve-original-tree.sh

      - name: Build the tip while its tree publishes
        id: pending
        if: inputs.nightly_next_unsigned_run == '' && needs.decide.outputs.track == 'nightly-next' && needs.decide.outputs.fast_build != 'true' && needs.decide.outputs.build_only != 'true'
        env:
          TIP_SHA: ${{ needs.decide.outputs.head_sha }}
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/nightly-steps/resolve-tree-pending.sh

      - name: Resolve cmux-tui client commit
        id: resolve
        if: inputs.nightly_next_unsigned_run == '' && needs.decide.outputs.fast_build != 'true' && needs.decide.outputs.build_only != 'true' && steps.pending.outputs.tree_pending != 'true'
        env:
          CMUX_TUI_TREE_SEARCH_COMMITS: "50"
          CMUX_TUI_TREE_MAX_AGE_HOURS: "24"
          CMUX_TUI_TREE_SAME_PATHS: .github/workflows/nightly.yml Native/OptChat/optchat-chief/Cargo.lock scripts/ci/nightly-steps
          TRACK: ${{ needs.decide.outputs.track }}
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/nightly-steps/resolve-cmux-tui-client-commit.sh

      - name: Choose the build commit
        id: build
        env:
          TIP_SHA: ${{ needs.decide.outputs.head_sha }}
          SOURCE_COMMIT: ${{ steps.resume_source.outputs.build_sha || steps.resolve.outputs.source_commit }}
          BEHIND: ${{ steps.resolve.outputs.behind }}
          BEHIND_HOURS: ${{ steps.resolve.outputs.behind_hours }}
          TREE_FROM: ${{ steps.resolve.outputs.tree_from }}
          PUBLISHED_SHA: ${{ needs.decide.outputs.published_sha }}
          SHOULD_PUBLISH: ${{ needs.decide.outputs.should_publish }}
          FORCE_BUILD: ${{ needs.decide.outputs.force }}
        run: bash scripts/ci/nightly-steps/resolve-choose-build-commit.sh
      # The selected build source can differ from this workflow's control SHA.
      - name: Record pending tree dependency
        id: tree-source
        continue-on-error: true
        env:
          TREE_PENDING: ${{ steps.pending.outputs.tree_pending }}
          TREE_KEY: ${{ steps.pending.outputs.key }}
          BUILD_SHA: ${{ steps.build.outputs.build_sha }}
        run: python3 scripts/ci/nightly_tree_source.py dependency
      - name: Upload pending tree dependency
        if: steps.tree-source.outputs.name != ''
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.tree-source.outputs.name }}
          path: ${{ steps.tree-source.outputs.path }}
          if-no-files-found: error
          overwrite: true
          retention-days: 3
      - name: Compute portable OptChat Chief input key
        id: chief-key
        if: needs.decide.outputs.track == 'nightly-next' && inputs.nightly_next_unsigned_run == ''
        continue-on-error: true
        env:
          BUILD_SHA: ${{ steps.build.outputs.build_sha }}
          ARCHS: ${{ needs.decide.outputs.compile_archs }}
        run: bash scripts/ci/nightly-steps/chief-input-key.sh
      # Why: docs/ci/nightly-workflow-notes.md#note-16
      - name: Leave the build slot to a newer nightly-next push
        id: superseded
        if: github.ref == 'refs/heads/nightly-next' && (github.event_name == 'push' || inputs.nightly_next_loop_retry != '')
        env:
          GH_TOKEN: ${{ github.token }}
          TIP_SHA: ${{ needs.decide.outputs.head_sha }}
          REPOSITORY: ${{ github.repository }}
          LOOP_RETRY: ${{ inputs.nightly_next_loop_retry }}
          SUPERSEDE_SKIP: ${{ vars.NIGHTLY_NEXT_SUPERSEDE_SKIP }}
        run: bash scripts/ci/nightly-steps/resolve-leave-build-slot.sh

  # Why: docs/ci/nightly-workflow-notes.md#note-39
  check-nightly-webviews:
    name: nightly webview checks
    needs: [decide, resolve-nightly-cmux-tui-client]
    if: needs.decide.outputs.track == 'nightly-next' && needs.resolve-nightly-cmux-tui-client.outputs.build_sha != '' && needs.decide.outputs.one_job != 'true'
    # route-visual-gate-nightly's route: the all-nightly reservation, then the Linux pool, then Blacksmith.
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.CI_NIGHTLY_MINI != '' && vars.CI_NIGHTLY_MINI || github.repository == 'manaflow-ai/cmux' && github.ref == 'refs/heads/nightly-next' && github.run_attempt == 1 && vars.CI_NIGHTLY_ONLY_RUNNER == 'glaeda-nightly-only-m4pro' && vars.CI_NIGHTLY_ONLY_RUNNER || vars.CI_NIGHTLY_ONLY_RUNNER || 'glaeda-nightly-only-m4pro' }}
    timeout-minutes: ${{ vars.CI_NIGHTLY_MINI != '' && 140 || 20 }}
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.checks.outcome == 'success' && needs.resolve-nightly-cmux-tui-client.outputs.build_sha || '' }}
      lint_report: ${{ steps.lint.outputs.lint_report }}
      # fixit-compile found no machine fix for the type check: the fixit-handoff job dispatches its revert.
      fixit_nofix: ${{ steps.fixit-nofix.outputs.nofix }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ needs.resolve-nightly-cmux-tui-client.outputs.build_sha }}
          submodules: false
      - name: Restore pinned Bun 1.4.4 from the CI cache bucket
        shell: bash
        continue-on-error: true
        run: bash "$GITHUB_WORKSPACE/scripts/ci/toolchain-r2.sh" restore bun 1.4.4 || true

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          no-cache: ${{ !startsWith(github.workspace, '/home/runner/work/') || !(github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && github.event_name != 'merge_group' && contains(fromJSON('["refs/heads/main","refs/heads/feat-cmux-next","refs/heads/nightly-next"]'), github.ref)) }}
          bun-version: "1.4.4"
      - name: Restore pinned Node 24.22.1 from the CI cache bucket
        shell: bash
        continue-on-error: true
        run: bash "$GITHUB_WORKSPACE/scripts/ci/toolchain-r2.sh" restore node 24.22.1 || true

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.22.1"
      # Lint-class reds report and are fixed forward (Leo 2026-11-20); typecheck blocks.
      - name: Webview checks on the build commit
        id: checks
        run: python3 scripts/ci/fast_gate_webviews_checks.py --repo . --advisory-out "$RUNNER_TEMP/webview-lint.json"
      - &lint-report
        name: Report the lint-class webview checks
        id: lint
        if: ${{ !cancelled() && !env.LEFT_SLOT }}
        continue-on-error: true
        run: python3 scripts/ci/nightly_fix_forward_issue.py outputs --report "$RUNNER_TEMP/webview-lint.json"
      # A type error fixit-compile could not fix wrote its record (scripts/ci/oops/fixit_handoff.py signal).
      - name: Hand a type error with no machine fix to fixit-handoff
        id: fixit-nofix
        if: ${{ failure() && steps.checks.outcome == 'failure' }}
        run: python3 -I scripts/ci/oops/fixit_handoff.py signal >> "$GITHUB_OUTPUT"

  # Why: docs/ci/nightly-workflow-notes.md#note-52
  check-nightly-app-store-shelf:
    name: nightly App Store shelf
    needs: [decide, resolve-nightly-cmux-tui-client]
    if: needs.decide.outputs.track == 'nightly-next' && needs.resolve-nightly-cmux-tui-client.outputs.build_sha != ''
    # resolve-nightly-cmux-tui-client's Linux route: no secret, never a Mac.
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || 'cmux-linux' }}
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      GHOSTTY_ZIG_SOURCE: ghostty-next
      CMUX_GHOSTTY_SRC: ""
    outputs:
      sha: ${{ steps.shelf.outcome == 'success' && needs.resolve-nightly-cmux-tui-client.outputs.build_sha || '' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ needs.resolve-nightly-cmux-tui-client.outputs.build_sha }}
          submodules: false
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev pkg-config
      - name: Init the ghostty-next submodule (libghostty-vt for cmux-tui-core)
        run: bash scripts/ci/init-submodule.sh ghostty-next
      - name: Install zig
        run: ./scripts/install-zig-ci.sh
      - name: Set up pinned cmux-tui Rust
        uses: ./.github/actions/setup-cmux-tui-rust
      - name: Every Discover listing installs and shows something, on the build commit
        id: shelf
        run: bash scripts/ci/app-store-shelf-check.sh

  # Why: docs/ci/nightly-workflow-notes.md#note-51
  early-nightly-webviews:
    name: nightly webview checks before the signer
    needs: decide
    if: needs.decide.outputs.track == 'nightly-next' && needs.decide.outputs.one_job == 'true' && needs.decide.outputs.should_build == 'true' && needs.decide.outputs.head_sha != ''
    # check-nightly-webviews' route: no secret, never the signing Mac.
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.CI_NIGHTLY_MINI != '' && vars.CI_NIGHTLY_MINI || github.repository == 'manaflow-ai/cmux' && github.ref == 'refs/heads/nightly-next' && github.run_attempt == 1 && vars.CI_NIGHTLY_ONLY_RUNNER == 'glaeda-nightly-only-m4pro' && vars.CI_NIGHTLY_ONLY_RUNNER || vars.CI_NIGHTLY_ONLY_RUNNER || 'glaeda-nightly-only-m4pro' }}
    timeout-minutes: ${{ vars.CI_NIGHTLY_MINI != '' && 140 || 15 }}
    permissions:
      contents: read
    outputs:
      # The commit whose webview checks failed, only while vars.NIGHTLY_COMPONENT_GATES is 'block': then
      # nightly-next-one and retry-nightly-next skip it. Default: a red check is a stale-part report, not a hold.
      red_sha: ${{ vars.NIGHTLY_COMPONENT_GATES == 'block' && steps.checks.outcome == 'failure' && needs.decide.outputs.head_sha || '' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ needs.decide.outputs.head_sha }}
          submodules: false
      - name: Restore pinned Bun 1.4.4 from the CI cache bucket
        shell: bash
        continue-on-error: true
        run: bash "$GITHUB_WORKSPACE/scripts/ci/toolchain-r2.sh" restore bun 1.4.4 || true

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          no-cache: ${{ !startsWith(github.workspace, '/home/runner/work/') || !(github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && github.event_name != 'merge_group' && contains(fromJSON('["refs/heads/main","refs/heads/feat-cmux-next","refs/heads/nightly-next"]'), github.ref)) }}
          bun-version: "1.4.4"
      - name: Restore pinned Node 24.22.1 from the CI cache bucket
        shell: bash
        continue-on-error: true
        run: bash "$GITHUB_WORKSPACE/scripts/ci/toolchain-r2.sh" restore node 24.22.1 || true

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.22.1"
      - name: Webview checks on the tip commit
        id: checks
        # Leo, 2026-11-25: "are we able to decouple". A red here is a report; the nightly still publishes.
        continue-on-error: ${{ vars.NIGHTLY_COMPONENT_GATES != 'block' }}
        run: python3 scripts/ci/fast_gate_webviews_checks.py --repo . --advisory-out "$RUNNER_TEMP/webview-lint.json"
      - name: Note the red webview checks as a stale part
        if: ${{ !cancelled() && steps.checks.outcome == 'failure' && vars.NIGHTLY_COMPONENT_GATES != 'block' }}
        run: bash scripts/ci/nightly-steps/stale-part.sh webview-checks "the webview checks failed on ${{ needs.decide.outputs.head_sha }}; the nightly publishes anyway"

  prepare-nightly-variant-primary:
    # No environment and no secrets. It runs no code from the bundle; the
    # theme picker regression and the sidecar handshake run on the signed app
    # in verify-signed-nightly. build-sign-notarize-nightly signs exactly the
    # app it uploads and runs no bundle code itself (#21024).
    needs: [decide, build-nightly-ghostty-cli-helper, build-nightly-app, build-nightly-remote-daemon, resolve-nightly-cmux-tui-client]
    # A timed-out pick-nightly-build-runner must not skip this job (see build-nightly-app's `if`).
    if: "!cancelled() && needs.decide.result == 'success' && needs.build-nightly-ghostty-cli-helper.result == 'success' && needs.build-nightly-app.result == 'success' && needs.build-nightly-remote-daemon.result == 'success' && needs.resolve-nightly-cmux-tui-client.result == 'success' && needs.decide.outputs.should_build == 'true' && (github.event_name != 'schedule' || github.event.schedule == '47 8 * * *') && needs.decide.outputs.build_only != 'true' && needs.resolve-nightly-cmux-tui-client.outputs.already_published != 'true' && needs.resolve-nightly-cmux-tui-client.outputs.superseded != 'true' && needs.decide.outputs.continue_only != 'true'"
    # actions:read lets the parallel artifact download resolve the blob URL.
    permissions:
      contents: read
      actions: read
    # Only moves and reads files; Mach-O checks run in verify-signed-nightly. It uses about one core.
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.run_attempt == 1 && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' && inputs.nightly_next_loop_retry == '') && 'cmux-gcp-nightly-x64' || 'cmux-linux' }}
    timeout-minutes: ${{ vars.CI_NIGHTLY_MINI != '' && 220 || 100 }}
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.decide.outputs.variants) }}
    env:
      NIGHTLY_VARIANT: ${{ matrix.variant }}
      NIGHTLY_FAST_BUILD: ${{ needs.decide.outputs.fast_build }}
      TRACK: ${{ needs.decide.outputs.track }}
      CHANNEL_RELEASE_TAG: ${{ needs.decide.outputs.release_tag }}
      PREPARE_FALLBACK: ${{ github.job == 'prepare-nightly-variant' && 'true' || 'false' }}
    steps:
      - name: Reuse a successful primary preparation
        id: reuse
        if: env.PREPARE_FALLBACK == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT: cmux-${{ needs.decide.outputs.channel }}-prepared-app-${{ matrix.variant }}-${{ needs.resolve-nightly-cmux-tui-client.outputs.build_short_sha }}
        run: |
          set -euo pipefail
          # This read runs before the checkout (no budget wait yet); a refused one prepares here.
          if ! count="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=$ARTIFACT&per_page=20" --jq '[.artifacts[] | select(.expired == false)] | length')"; then
            echo "::warning::could not list this run's prepared artifacts; preparing the variant here"
            count=0
          fi
          if [ "$count" -gt 0 ]; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi

      - &clear-stale-git-locks-self-hos-3
        name: Clear stale git locks (self-hosted reused workspace)
        if: env.PREPARE_FALLBACK != 'true' || steps.reuse.outputs.exists != 'true'
        shell: bash
        run: |
          # Self-hosted macOS runners reuse the workspace. A job cancelled or
          # killed mid-checkout can leave a stale .git/modules/*/index.lock that
          # fails every later submodule checkout (e.g. ghostty). Clear them first.
          ws="${GITHUB_WORKSPACE:-$PWD}"
          rm -f "$ws/.git/index.lock" 2>/dev/null || true
          if [ -d "$ws/.git/modules" ]; then
            find "$ws/.git/modules" -type f -name "*.lock" -delete 2>/dev/null || true
          fi


      - &checkout-build-ref-2
        name: Checkout build ref
        if: env.PREPARE_FALLBACK != 'true' || steps.reuse.outputs.exists != 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ needs.resolve-nightly-cmux-tui-client.outputs.build_sha }}
          # Main and RC signing do not need submodules. nightly-next's notice
          # check reads ghostty-next/build.zig.zon, so initialize that optional
          # submodule in the next step only for the cmux-next track.
          submodules: false


      - *wait-through-github-api-rate-l

      - &init-cmux-next-notices-submodu
        name: Initialize cmux-next notices submodule
        if: ${{ ((env.PREPARE_FALLBACK != 'true' || steps.reuse.outputs.exists != 'true') && (github.ref_name == 'nightly-next')) && !env.LEFT_SLOT }}
        shell: bash
        run: bash scripts/ci/init-submodule.sh ghostty-next


      - &put-llvm-lipo-on-path-as-lipo
        name: Put llvm-lipo on PATH as lipo
        if: runner.os == 'Linux' && (env.PREPARE_FALLBACK != 'true' || steps.reuse.outputs.exists != 'true')
        run: bash scripts/ci/nightly-steps/put-llvm-lipo-on-path.sh


      # A build tree older than this workflow lacks the step scripts it added (an unsigned
      # resume of an older run): check out only those, from the workflow commit.
      - &older-tree-step-scripts
        name: Add the workflow commit's new step scripts to an older build tree
        if: ((env.PREPARE_FALLBACK != 'true' || steps.reuse.outputs.exists != 'true') && hashFiles('scripts/ci/nightly-steps/prepare-thin-bundle.sh') == '') && !env.LEFT_SLOT
        run: |
          for try in 1 2 3; do git -c http.lowSpeedLimit=1000 -c http.lowSpeedTime=120 fetch -q --no-tags --depth=1 origin "$GITHUB_SHA" && break; [ "$try" != 3 ] || exit 1; sleep $((try * 10)); done
          git diff --name-only --diff-filter=A HEAD FETCH_HEAD -- scripts/ci/nightly-steps | while read -r f; do git checkout FETCH_HEAD -- "$f"; done

      - &download-signing-inputs-paralle
        name: Download signing inputs (parallel)
        if: env.PREPARE_FALLBACK != 'true' || steps.reuse.outputs.exists != 'true'
        id: signing-inputs-parallel
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash -e scripts/ci/nightly-steps/prepare-download-signing-inputs.sh


      - &download-unsigned-nightly-app
        name: Download unsigned nightly app
        if: ${{ (env.PREPARE_FALLBACK != 'true' || steps.reuse.outputs.exists != 'true') && (steps.signing-inputs-parallel.outputs.app_ok != 'true') }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cmux-nightly-unsigned-app
          path: nightly-inputs/app


      - &download-ssh-daemon-assets
        name: Download SSH daemon assets
        if: ${{ (env.PREPARE_FALLBACK != 'true' || steps.reuse.outputs.exists != 'true') && (steps.signing-inputs-parallel.outputs.daemon_ok != 'true') }}
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: cmux-nightly-remote-daemon
          path: remote-daemon-assets


      - &download-universal-ghostty-cli
        name: Download universal Ghostty CLI helper
        if: ${{ (env.PREPARE_FALLBACK != 'true' || steps.reuse.outputs.exists != 'true') && (steps.signing-inputs-parallel.outputs.helper_ok != 'true') }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cmux-nightly-ghostty-cli-helper
          path: nightly-inputs/ghostty


      # Blocking, like the step that builds it: a nightly-next app always
      # ships the Ghostty license tree. This is a small artifact containing
      # only the trees, rather than the complete source offer archive.
      - &download-nightly-ghostty-license-trees
        name: Download the Ghostty dependency license trees (cmux-next)
        if: ${{ (env.PREPARE_FALLBACK != 'true' || steps.reuse.outputs.exists != 'true') && (needs.decide.outputs.track == 'nightly-next' && needs.decide.outputs.fast_build != 'true') }}
        id: ghostty_licenses
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cmux-next-license-trees
          path: nightly-inputs/license-trees


      - &restore-unsigned-nightly-produ
        name: Restore unsigned nightly products
        if: env.PREPARE_FALLBACK != 'true' || steps.reuse.outputs.exists != 'true'
        run: bash scripts/ci/nightly-steps/prepare-restore-unsigned-products.sh

      # Why: docs/ci/nightly-workflow-notes.md#note-40
      - &prove-the-browser-data-import
        name: Prove the browser-data import is compiled out (cx-f58x notary test)
        if: ${{ (env.PREPARE_FALLBACK != 'true' || steps.reuse.outputs.exists != 'true') && (needs.decide.outputs.notary_test_browser_data == 'true') && (needs.build-nightly-app.outputs.browser_data_proven != 'true') }}
        run: bash scripts/ci/nightly-steps/browser-data-proof-start.sh


      - &inject-universal-ghostty-cli-he
        name: Inject universal Ghostty CLI helper
        if: (env.PREPARE_FALLBACK != 'true' || steps.reuse.outputs.exists != 'true') && !env.LEFT_SLOT
        run: bash scripts/ci/nightly-steps/prepare-inject-ghostty-cli-helper.sh


      - &inject-nightly-ghostty-licenses
        name: Inject the Ghostty dependency licenses (cmux-next)
        if: ${{ ((env.PREPARE_FALLBACK != 'true' || steps.reuse.outputs.exists != 'true') && (needs.decide.outputs.track == 'nightly-next' && needs.decide.outputs.fast_build != 'true')) && !env.LEFT_SLOT }}
        run: bash scripts/ci/nightly-steps/prepare-inject-ghostty-licenses.sh


      - &require-the-cmux-tui-client-bu
        name: Require the cmux-tui client build-nightly-app bundled
        if: ${{ (env.PREPARE_FALLBACK != 'true' || steps.reuse.outputs.exists != 'true') && (needs.decide.outputs.fast_build != 'true') }}
        env:
          CMUX_TUI_CLIENT_COMMIT: ${{ needs.build-nightly-app.outputs.cmux_tui_commit || needs.resolve-nightly-cmux-tui-client.outputs.commit }}
        run: bash scripts/ci/nightly-steps/prepare-require-cmux-tui-client.sh


      - &thin-bundle-to-the-variant-arch
        name: Thin bundle to the variant architecture
        # The fast build is already compiled arm64, but the downloaded cmux-tui
        # client can still be universal. Thin every non-universal artifact before
        # signing so the architecture gate remains meaningful. The Chromium
        # engine artifact is arm64 only: an x86_64 variant drops it first and
        # reports the browser unavailable.
        if: ${{ (env.PREPARE_FALLBACK != 'true' || steps.reuse.outputs.exists != 'true') && (matrix.variant != 'universal') }}
        run: bash scripts/ci/nightly-steps/prepare-thin-bundle.sh


      - &verify-shipped-libintl-has-its
        name: Verify shipped libintl has its source
        if: (env.PREPARE_FALLBACK != 'true' || steps.reuse.outputs.exists != 'true') && !env.LEFT_SLOT
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/nightly-steps/prepare-verify-libintl-source.sh


      - &verify-nightly-binary-archs
        name: Verify nightly binary architectures
        if: (env.PREPARE_FALLBACK != 'true' || steps.reuse.outputs.exists != 'true') && !env.LEFT_SLOT
        run: bash scripts/ci/nightly-steps/prepare-verify-binary-architectures.sh

      - &package-prepared-app-for-signi
        name: Package prepared app for signing
        if: env.PREPARE_FALLBACK != 'true' || steps.reuse.outputs.exists != 'true'
        run: bash scripts/ci/nightly-steps/prepare-package-app.sh

      - &record-prepared-app-digest
        name: Record prepared app digest
        if: env.PREPARE_FALLBACK != 'true' || steps.reuse.outputs.exists != 'true'
        env:
          PREPARED_APP_ARTIFACT: cmux-${{ needs.decide.outputs.channel }}-prepared-app-${{ matrix.variant }}-${{ needs.resolve-nightly-cmux-tui-client.outputs.build_short_sha }}
          NIGHTLY_SHOULD_PUBLISH: ${{ needs.decide.outputs.should_publish }}
        run: bash scripts/ci/nightly-steps/prepare-record-app-digest.sh

      - &finish-the-browser-data-import
        name: Finish the browser-data import proof
        if: ${{ (env.PREPARE_FALLBACK != 'true' || steps.reuse.outputs.exists != 'true') && (needs.decide.outputs.notary_test_browser_data == 'true') && (needs.build-nightly-app.outputs.browser_data_proven != 'true') }}
        run: bash scripts/ci/nightly-steps/browser-data-proof-finish.sh

      # Signing waits on this job's end. On a dedicated nightly Mac the default 5 blocks
      # at a time took 65-156 s (median 85 s, runs 41455121554-41488515134), against
      # 3 s on Blacksmith Linux; 32 at a time, as the unsigned-app upload since #32343.
      - &upload-prepared-app-for-signin
        id: upload-prepared-app-for-signing
        continue-on-error: true
        name: Upload prepared app for signing
        if: env.PREPARE_FALLBACK != 'true' || steps.reuse.outputs.exists != 'true'
        env: *artifact-upload-concurrency
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-${{ needs.decide.outputs.channel }}-prepared-app-${{ matrix.variant }}-${{ needs.resolve-nightly-cmux-tui-client.outputs.build_short_sha }}
          path: prepared-app-handoff/cmux-prepared-app.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 3

      - &upload-prepared-app-for-signin-retry
        if: "!cancelled() && steps.upload-prepared-app-for-signing.outcome == 'failure' && (env.PREPARE_FALLBACK != 'true' || steps.reuse.outputs.exists != 'true')"
        name: Upload prepared app for signing (retry)
        env: *artifact-upload-concurrency
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-${{ needs.decide.outputs.channel }}-prepared-app-${{ matrix.variant }}-${{ needs.resolve-nightly-cmux-tui-client.outputs.build_short_sha }}
          path: prepared-app-handoff/cmux-prepared-app.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 3
          overwrite: true


  # The fallback preparation, and the preparation result every later job reads
  # (needs.prepare-nightly-variant): success after a primary success (a no-op leg) or after
  # its own preparation. Until 2026-10-31 a separate prepare-nightly-variant job only echoed
  # that result, one more queued hop on the signing path (4.8 min queued for a 0 s job in
  # run 41187578702 attempt 2).
  prepare-nightly-variant:
    needs: [decide, build-nightly-ghostty-cli-helper, build-nightly-app, build-nightly-remote-daemon, resolve-nightly-cmux-tui-client, prepare-nightly-variant-primary]
    # Never skipped: a skipped fallback skips signing and publishing (runs 40154003204,
    # 40155340212). After a primary success it finds that result and does nothing.
    if: always() && (needs.prepare-nightly-variant-primary.result == 'failure' || needs.prepare-nightly-variant-primary.result == 'success') && needs.decide.outputs.should_build == 'true' && (github.event_name != 'schedule' || github.event.schedule == '47 8 * * *') && needs.decide.outputs.build_only != 'true' && needs.resolve-nightly-cmux-tui-client.outputs.already_published != 'true' && needs.resolve-nightly-cmux-tui-client.outputs.superseded != 'true' && needs.decide.outputs.continue_only != 'true'
    permissions:
      contents: read
      actions: read
    # After a primary success it only reads that result.
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.run_attempt == 1 && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' && inputs.nightly_next_loop_retry == '') && 'cmux-gcp-nightly-x64' || 'cmux-linux' }}
    timeout-minutes: ${{ vars.CI_NIGHTLY_MINI != '' && 220 || 100 }}
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.decide.outputs.variants) }}
    env:
      NIGHTLY_VARIANT: ${{ matrix.variant }}
      NIGHTLY_FAST_BUILD: ${{ needs.decide.outputs.fast_build }}
      TRACK: ${{ needs.decide.outputs.track }}
      CHANNEL_RELEASE_TAG: ${{ needs.decide.outputs.release_tag }}
      PREPARE_FALLBACK: 'true'
    steps:
      - name: Reuse a successful primary preparation
        id: reuse
        if: env.PREPARE_FALLBACK == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PRIMARY_RESULT: ${{ needs.prepare-nightly-variant-primary.result }}
          ARTIFACT: cmux-${{ needs.decide.outputs.channel }}-prepared-app-${{ matrix.variant }}-${{ needs.resolve-nightly-cmux-tui-client.outputs.build_short_sha }}
          NIGHTLY_SHOULD_PUBLISH: ${{ needs.decide.outputs.should_publish }}
        run: |
          set -euo pipefail
          # Every primary leg uploaded its prepared app; no API call, so a spent
          # installation rate limit cannot fail this no-op leg.
          if [ "$PRIMARY_RESULT" = success ]; then echo "exists=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          # This read runs before the checkout (no budget wait yet); a refused one prepares here.
          if ! count="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=$ARTIFACT&per_page=20" --jq '[.artifacts[] | select(.expired == false)] | length')"; then
            echo "::warning::could not list this run's prepared artifacts; preparing the variant here"
            count=0
          fi
          if [ "$count" -gt 0 ]; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi

      - *clear-stale-git-locks-self-hos-3


      - *checkout-build-ref-2


      - *wait-through-github-api-rate-l

      - *init-cmux-next-notices-submodu


      # llvm-lipo as lipo: put-llvm-lipo-on-path.sh says why.
      - *put-llvm-lipo-on-path-as-lipo


      - *older-tree-step-scripts
      # download-artifact reads each blob over one connection. Fetch all three
      # signing inputs over ranged HTTP concurrently, while retaining the
      # action downloads as per-artifact fallbacks if a ranged request fails.
      - *download-signing-inputs-paralle


      - *download-unsigned-nightly-app


      - *download-ssh-daemon-assets


      - *download-universal-ghostty-cli


      # Blocking, like the step that builds it: a nightly-next app always
      # ships the Ghostty license tree. This is a small artifact containing
      # only the trees, rather than the complete source offer archive.
      - *download-nightly-ghostty-license-trees

      - *restore-unsigned-nightly-produ

      # The cx-f58x browser-data scan, when build-nightly-app did not prove this app.
      - *prove-the-browser-data-import


      - *inject-universal-ghostty-cli-he


      # The Ghostty dependency license tree (collect-ghostty-licenses.py, checked
      # by verify-ghostty-license-bundle.py) ships in the app, with the MPL-2.0
      # source offer that names this release's cmux-next source archive and tag.
      - *inject-nightly-ghostty-licenses

      - *require-the-cmux-tui-client-bu


      - *thin-bundle-to-the-variant-arch


      # GNU libintl is LGPL-2.1-or-later. GhosttyKit and the ghostty CLI helper
      # are built with -Di18n=false, so no shipped Mach-O may define a libintl
      # symbol unless the channel release carries gettext-0.24.tar.gz and
      # COPYING.LIB (the prune step keeps those names, they carry no build number).
      - *verify-shipped-libintl-has-its


      # The same gate as prepare-nightly-variant-primary (one copy keeps nightly.yml under its size limit).
      - *verify-nightly-binary-archs

      - *package-prepared-app-for-signi

      # nightly-sign.yml (run from main) reads this annotation of this job
      # through the checks API and refuses a tarball with another sha256.
      - *record-prepared-app-digest

      - *finish-the-browser-data-import

      - *upload-prepared-app-for-signin

      - *upload-prepared-app-for-signin-retry


  # The owned Macs the verify jobs (`owned`) and the signing and publication jobs (`sign_owned`,
  # `sign_owned_pool`) take, read right before they queue. Nightlies run only on our own minis
  # (Lawrence, 2026-10-30): every pick is a glaeda label, and an empty pick falls to the nightly pools.
  pick-nightly-sign-runner:
    needs: [decide, prepare-nightly-variant]
    if: ${{ !cancelled() && needs.prepare-nightly-variant.result == 'success' }}
    # A failed pick reads as success to the signing jobs, which then take the nightly pools.
    continue-on-error: true
    # The picker has no signing key: the nightly-only pool (tests/test_nightly_owned_minis_only.py).
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.CI_NIGHTLY_MINI != '' && vars.CI_NIGHTLY_MINI || vars.CI_NIGHTLY_ONLY_RUNNER || 'glaeda-nightly-only-m4pro' }}
    # The owned pick mints the routing token (GLAEDA_ROUTE_APP_KEY), so the key is read in the
    # routing environment, as pick-nightly-build-runner does (tests/test_supplychain_security.py).
    environment:
      name: ci-routing-agent
      deployment: false
    # Room for every step budget in turn (the read token mint 1, the owned pick's token mints 1 + 1, the verify picker 2,
    # the signing picker 2 and the overtaken check 1) plus checkout, so the job is never cut off before its outputs.
    timeout-minutes: ${{ vars.CI_NIGHTLY_MINI != '' && 137 || 17 }}
    permissions:
      # The queue janitor's pool snapshot (an artifact).
      actions: read
      contents: read
    outputs:
      # Why: docs/ci/nightly-workflow-notes.md#note-11
      owned: ${{ github.repository == 'manaflow-ai/cmux' && github.ref_name == 'nightly-next' && github.run_attempt == 1 && vars.CI_NIGHTLY_ONLY_RUNNER == 'glaeda-nightly-only-m4pro' && vars.CI_NIGHTLY_ONLY_RUNNER || (github.event_name == 'push' && github.run_attempt == 1 || steps.upload-marker.outcome == 'success') && steps.owned.outputs.owned || '' }}
      # A drained (or draining) owned Mac for the release signing jobs, as the JSON runs-on
      # array scripts/ci/signing_runner.py prints, or empty, under the same marker and `attempt` rules as `owned`.
      sign_owned: ${{ (github.event_name == 'push' && github.run_attempt == 1 || steps.upload-marker.outcome == 'success') && steps.sign-owned.outputs.owned || '' }}
      # The shared pool label from sign_owned. Publication controls use this pool route so they never pin one runner.
      sign_owned_pool: ${{ (github.event_name == 'push' && github.run_attempt == 1 || steps.upload-marker.outcome == 'success') && steps.sign-owned.outputs.owned_pool || '' }}
      attempt: ${{ github.run_attempt }}
      # A newer run's build is already on the feed: build-sign-notarize-nightly skips.
      overtaken: ${{ steps.overtaken.outputs.overtaken }}
    steps:
      - name: Checkout publication tooling at the workflow commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: .publish-tooling
          sparse-checkout: scripts/ci

      # As pick-nightly-build-runner (run 41051244674's 403s were here).
      - name: Mint the glaeda read token
        id: snapshot-read-token
        if: github.repository == 'manaflow-ai/cmux' && vars.CI_PR_POOL_OWNED == '1' && vars.GLAEDA_ROUTE_APP_ID != '' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref_name == 'nightly-next'
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.GLAEDA_ROUTE_APP_ID }}
          private-key: ${{ secrets.GLAEDA_ROUTE_APP_KEY }}
          permission-actions: read

      # As cmux-next-dev-daily.yml: idle owned runners read live with the routing App's own
      # budget. Any failure leaves the token empty, and the pick below then finds no owned Mac.
      - name: Mint the owned-pool routing token
        id: route-token
        if: github.repository == 'manaflow-ai/cmux' && vars.CI_PR_POOL_OWNED == '1' && vars.GLAEDA_ROUTE_APP_ID != '' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref_name == 'nightly-next'
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.GLAEDA_ROUTE_APP_ID }}
          private-key: ${{ secrets.GLAEDA_ROUTE_APP_KEY }}
          permission-administration: read
          permission-organization-self-hosted-runners: read

      - *legacy-route-shared-1
      - name: Pick an owned Mac for the verify jobs
        id: owned
        if: github.repository == 'manaflow-ai/cmux' && vars.CI_PR_POOL_OWNED == '1' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref_name == 'nightly-next'
        continue-on-error: true
        timeout-minutes: 2
        env:
          CI_RUNNER_STATE: ${{ vars.CI_RUNNER_STATE }}
          ROUTE_TOKEN: ${{ steps.route-token.outputs.token || steps.route-token-repo.outputs.token }}
          SNAPSHOT_TOKEN: ${{ steps.snapshot-read-token.outputs.token || github.token }}
          # In order; only labels ci-owned-pool-rescue.yml watches are offered.
          OWNED_LABELS: ${{ format('{0} {1}', vars.CI_NIGHTLY_NEXT_BUILD_RUNNER, vars.CI_SIDE_LANE_RUNNER) }}
          # Attempt 1 of a nightly-next push takes the all-nightly reservation with no runner read (nightly_build_runner.py).
          NIGHTLY_ONLY_LABEL: ${{ vars.CI_NIGHTLY_ONLY_RUNNER }}
          CANDIDATE: ${{ vars.MACOS_RUNNER_26 }}
          # As the build pick: unread runners (run 41335987427's 403 rate limit on the routing App) queue the
          # verify jobs on the watched owned pool, not blind on Blacksmith macOS.
          UNREAD_OWNED_FALLBACK: ${{ vars.CI_PR_POOL_OWNED == '1' && (vars.CI_OWNED_POOL_RESCUE || '1') != '0' && '1' || '' }}
        run: python3 .publish-tooling/scripts/ci/nightly_build_runner.py verify

      # Why: docs/ci/nightly-workflow-notes.md#note-41
      - name: Pick a drained owned Mac for the signing jobs
        id: sign-owned
        if: github.repository == 'manaflow-ai/cmux' && vars.CI_SIGN_OWNED == '1' && vars.CI_PR_POOL_OWNED == '1' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref_name == 'nightly-next'
        continue-on-error: true
        timeout-minutes: 2
        env:
          CI_RUNNER_STATE: ${{ vars.CI_RUNNER_STATE }}
          ENABLED: ${{ vars.CI_SIGN_OWNED }}
          PICK_ON_RERUN: "1"
          # Drain the mini that frees up soonest even past the 2 min horizon, never Blacksmith first
          # (signing_runner.py DRAIN_ANYWAY; Leo, 2026-10-30).
          DRAIN_ANYWAY: "1"
          ROUTE_TOKEN: ${{ steps.route-token.outputs.token || steps.route-token-repo.outputs.token }}
          # actions: read, to count the signing jobs already holding an owned Mac (at most one at once).
          SNAPSHOT_TOKEN: ${{ steps.snapshot-read-token.outputs.token || github.token }}
          OWNED_LABELS: glaeda-trusted-next-signing
        run: python3 .publish-tooling/scripts/ci/signing_runner.py owned

      - name: Write the owned-pool watch marker
        id: marker
        if: (steps.owned.outputs.owned != '' || steps.sign-owned.outputs.owned != '') && (github.event_name != 'push' || github.run_attempt != 1)
        continue-on-error: true
        timeout-minutes: 1
        env:
          OWNED: ${{ steps.owned.outputs.owned || steps.sign-owned.outputs.owned }}
        run: bash -e .publish-tooling/scripts/ci/nightly-steps/pick-sign-runner-watch-marker.sh

      - *upload-the-owned-pool-watch-ma

      - name: Leave notarization to a newer published build
        id: overtaken
        if: github.event_name == 'push' && github.ref == 'refs/heads/nightly-next'
        continue-on-error: true
        timeout-minutes: 1
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: bash .publish-tooling/scripts/ci/nightly-steps/sign-pick-overtaken.sh

  build-sign-notarize-nightly:
    # Production secrets: GitHub releases them only to protected refs (the
    # environment's deployment branch policy: main, tags v*). The nightly-next
    # track uses `release-next`, whose policy allows only branch nightly-next.
    environment: ${{ needs.decide.outputs.environment }}
    # The only nightly signer: the Linux release-signer pool is retired (nightlies run on our own minis).
    needs: [decide, build-nightly-app, resolve-nightly-cmux-tui-client, prepare-nightly-variant, pick-nightly-sign-runner]
    if: "!cancelled() && needs.decide.result == 'success' && needs.build-nightly-app.result == 'success' && needs.resolve-nightly-cmux-tui-client.result == 'success' && needs.prepare-nightly-variant.result == 'success' && needs.pick-nightly-sign-runner.result == 'success' && needs.decide.outputs.should_build == 'true' && (github.event_name != 'schedule' || github.event.schedule == '47 8 * * *') && needs.decide.outputs.build_only != 'true' && needs.resolve-nightly-cmux-tui-client.outputs.already_published != 'true' && needs.resolve-nightly-cmux-tui-client.outputs.superseded != 'true' && needs.decide.outputs.continue_only != 'true' && needs.pick-nightly-sign-runner.outputs.overtaken != 'true'"
    outputs:
      # nightly-next is arm64 only, so its one matrix leg sets this; publish
      # waits for a later run when Apple had not accepted the build in time.
      notary_pending: ${{ steps.notarize-nightly.outputs.submission_pending }}
      # The 6 h stapled-app fallback (notarize-nightly-dmg.sh) shipped the first DMG.
      stapled_app_fallback_id: ${{ steps.notarize-nightly.outputs.stapled_app_fallback == 'true' && steps.notarize-nightly.outputs.stapled_app_pending_id || '' }}
    # Sign and notarize on the same macOS 26 lane proven by stable releases.
    # actions:read lets the parallel artifact download resolve the blob URL.
    permissions:
      contents: read
      actions: read
    # Why: docs/ci/nightly-workflow-notes.md#note-42
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || vars.CI_NIGHTLY_MINI != '' && 'glaeda-trusted-next-signing' || needs.pick-nightly-sign-runner.outputs.attempt == github.run_attempt && needs.pick-nightly-sign-runner.outputs.sign_owned && fromJSON(needs.pick-nightly-sign-runner.outputs.sign_owned) || 'glaeda-trusted-next-signing' }}
    # Why: docs/ci/nightly-workflow-notes.md#note-4
    timeout-minutes: ${{ needs.decide.outputs.notary_test == 'true' && 235 || 160 }}
    # One universal Xcode build feeds every variant: the thin variants are cut
    # from it with lipo, so each user downloads only their architecture.
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.decide.outputs.variants) }}
    env:
      CMUX_CI_XCODE_APP: ${{ vars.CMUX_CI_XCODE_APP_MACOS_26 }}
      CMUX_CI_REQUIRED_MACOS_SDK_MAJOR: "26"
      NIGHTLY_VARIANT: ${{ matrix.variant }}
      NIGHTLY_FAST_BUILD: ${{ needs.decide.outputs.fast_build }}
      NIGHTLY_BUILD: ${{ needs.build-nightly-app.outputs.daemon_build }}
      NIGHTLY_MARKETING_VERSION: ${{ needs.build-nightly-app.outputs.daemon_version }}
      BUNDLE_REMOTE_DAEMON_ASSETS: ${{ needs.decide.outputs.fast_build == 'true' || needs.decide.outputs.should_publish != 'true' }}
      CHANNEL: ${{ needs.decide.outputs.channel }}
      TRACK: ${{ needs.decide.outputs.track }}
      CHANNEL_BUNDLE_ID: ${{ needs.decide.outputs.bundle_id }}
      CHANNEL_APP_NAME: ${{ needs.decide.outputs.app_name }}
      CHANNEL_URL_SCHEME: ${{ needs.decide.outputs.url_scheme }}
      CHANNEL_DMG_PREFIX: ${{ needs.decide.outputs.dmg_prefix }}
      CHANNEL_RELEASE_TAG: ${{ needs.decide.outputs.release_tag }}
      CHANNEL_FEED_BASE: ${{ needs.decide.outputs.feed_base }}
      CHANNEL_ENTITLEMENTS: ${{ needs.decide.outputs.entitlements }}
      # Signed app path for every step after "Prepare channel identity".
      CHANNEL_APP_PATH: build-universal/Build/Products/Release/${{ needs.decide.outputs.app_name }}.app
    steps:
      # First, before any checkout or secret: on an owned Mac this job holds the whole mini (glaeda's
      # exclusive class) or fails here (tests/test_ci_signing_owned_mac.py CLAIM_GATE).
      - *hold-the-whole-mac

      - name: Clear stale git locks (self-hosted reused workspace)
        shell: bash
        run: |
          # Self-hosted macOS runners reuse the workspace. A job cancelled or
          # killed mid-checkout can leave a stale .git/modules/*/index.lock that
          # fails every later submodule checkout (e.g. ghostty). Clear them first.
          ws="${GITHUB_WORKSPACE:-$PWD}"
          rm -f "$ws/.git/index.lock" 2>/dev/null || true
          if [ -d "$ws/.git/modules" ]; then
            find "$ws/.git/modules" -type f -name "*.lock" -delete 2>/dev/null || true
          fi


      - name: Checkout build ref
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ needs.resolve-nightly-cmux-tui-client.outputs.build_sha }}
          filter: blob:none
          sparse-checkout: |
            /*
            !/cmux-next-ios/verify/
          sparse-checkout-cone-mode: false # patterns: .github/checkout-lean.json
          # Main and RC signing do not need submodules. nightly-next's notice
          # check reads ghostty-next/build.zig.zon, so initialize that optional
          # submodule in the next step only for the cmux-next track.
          submodules: false

      # This run's own signing controls: the claim below and, for an unsigned resume, the keychain controls.
      # Only scripts/ and the workflow are read from it, so it is sparse: a fresh full clone into this path took
      # about 3 min of the one signer on every sign (run 41948676510, 04:42:55-04:46:05Z).
      - name: Checkout trusted signing controls
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: .nightly-signing-control
          submodules: false
          filter: blob:none
          sparse-checkout: |
            scripts
            .github/workflows

      # Before any secret: the same check again, and a signing keychain a killed job left is removed.
      - name: Claim the whole Mac for signing
        run: bash .nightly-signing-control/scripts/ci/signing-runner-claim.sh

      - name: Install the current signing keychain controls
        if: inputs.nightly_next_unsigned_run != ''
        run: |
          set -euo pipefail
          # Source-bound notices and entitlements stay at the original commit.
          # Only the reviewed signing control and its two dependencies advance.
          for control in scripts/ci/signing-keychain.sh scripts/ci/lib/signing-runtime-guard.sh scripts/import-apple-developer-id-intermediates.sh; do
            cp ".nightly-signing-control/$control" "$control"
          done
          echo "Unsigned resume signing controls: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

      - &legacy-route-shared-5
        name: Initialize cmux-next notices submodule
        if: github.ref_name == 'nightly-next'
        shell: bash
        run: bash scripts/ci/init-submodule.sh ghostty-next


      # macOS /bin/bash 3.2 exits 0 on a parse error in a script with an EXIT
      # trap (runs 39014131817, 39014922771). Parse every script this job can
      # run before any signing or notarization. An unsigned resume builds an
      # older tree: the checker and the workflow come from the signing control
      # (this run's commit), the scripts from the build tree.
      - &x55
        name: Parse signing and notarize scripts with /bin/bash 3.2
        if: ${{ !env.LEFT_SLOT }}
        shell: bash
        run: |
          set -euo pipefail
          checker=scripts/ci/check-bash32-parse.sh
          workflow="$PWD/.github/workflows/nightly.yml"
          if [ -d .nightly-signing-control ]; then
            checker=.nightly-signing-control/$checker
            workflow="$PWD/.nightly-signing-control/.github/workflows/nightly.yml"
          fi
          CMUX_PARSE_ROOT="$PWD" "$checker" "$workflow"

      - *select-xcode
      - *select-xcode-sdk
      # Why: docs/ci/nightly-workflow-notes.md#note-8
      - name: Download prepared app (parallel)
        id: prepared-app-parallel
        continue-on-error: true
        timeout-minutes: 10
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PREPARED_APP_ARTIFACT: cmux-${{ needs.decide.outputs.channel }}-prepared-app-${{ matrix.variant }}-${{ needs.resolve-nightly-cmux-tui-client.outputs.build_short_sha }}
        run: |
          s=.nightly-signing-control/scripts/ci/download-run-artifact.py; [ -f "$s" ] || s=scripts/ci/download-run-artifact.py
          python3 "$s" --name "$PREPARED_APP_ARTIFACT" --out prepared-app --connections 32

      - name: Download prepared app
        if: steps.prepared-app-parallel.outcome != 'success'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: cmux-${{ needs.decide.outputs.channel }}-prepared-app-${{ matrix.variant }}-${{ needs.resolve-nightly-cmux-tui-client.outputs.build_short_sha }}
          path: prepared-app

      - &download-ssh-daemon-assets-2
        name: Download SSH daemon assets
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: cmux-nightly-remote-daemon
          path: remote-daemon-assets

      - name: Restore prepared app
        run: s=scripts/ci/nightly-steps/sign-restore-prepared-app.sh; [ -f "$s" ] || s=".nightly-signing-control/$s"; bash "$s"


      - name: Refuse a resumed build superseded by a published feed
        if: inputs.nightly_next_unsigned_run != ''
        run: s=scripts/ci/nightly-steps/sign-refuse-superseded-resume.sh; [ -f "$s" ] || s=".nightly-signing-control/$s"; bash "$s"

      # Why: docs/ci/nightly-workflow-notes.md#note-7
      - name: Restore pinned Node 22.23.4 from the CI cache bucket
        if: ${{ !env.LEFT_SLOT }}
        shell: bash
        continue-on-error: true
        run: bash "$GITHUB_WORKSPACE/scripts/ci/toolchain-r2.sh" restore node 22.23.4 || true

      - &set-up-node
        name: Set up Node
        if: ${{ !env.LEFT_SLOT }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22.23.4"


      - &x56
        name: Install build deps
        if: ${{ !env.LEFT_SLOT }}
        run: s=scripts/ci/nightly-steps/install-create-dmg.sh; [ -f "$s" ] || s=".nightly-signing-control/$s"; [ -f "$s" ] || s=".publish-tooling/${s#*/}"; bash -e "$s"


      - &x57
        name: Derive Sparkle public key from private key
        # The production probe carries no Sparkle key, so it can never update.
        if: needs.decide.outputs.notary_probe != 'true' && !env.LEFT_SLOT
        env:
          # scripts/ci/nightly-sparkle-key.sh picks the key per channel and
          # NIGHTLY_SPARKLE_KEY; unset keeps the shared key.
          NIGHTLY_SPARKLE_KEY: ${{ vars.NIGHTLY_SPARKLE_KEY }}
          CHANNEL: ${{ needs.decide.outputs.channel }}
          TRACK: ${{ needs.decide.outputs.track }}
          # The nightly-next track gets only its own key; the others never see it.
          SHARED_SPARKLE_PRIVATE_KEY: ${{ needs.decide.outputs.track != 'nightly-next' && secrets.SPARKLE_PRIVATE_KEY || '' }}
          NIGHTLY_SPARKLE_PRIVATE_KEY: ${{ needs.decide.outputs.track != 'nightly-next' && secrets.NIGHTLY_SPARKLE_PRIVATE_KEY || '' }}
          NEXT_SPARKLE_PRIVATE_KEY: ${{ needs.decide.outputs.track == 'nightly-next' && secrets.SPARKLE_NEXT_PRIVATE_KEY || '' }}
        run: s=scripts/ci/nightly-steps/derive-sparkle-public-key.sh; [ -f "$s" ] || s=".nightly-signing-control/$s"; [ -f "$s" ] || s=".publish-tooling/${s#*/}"; bash "$s"


      - &x58
        name: Inject nightly identities and metadata
        if: ${{ !env.LEFT_SLOT }}
        env:
          NOTARY_PROBE: ${{ needs.decide.outputs.notary_probe }}
          BUILD_SHORT_SHA: ${{ needs.resolve-nightly-cmux-tui-client.outputs.build_short_sha }}
        run: s=scripts/ci/nightly-steps/inject-nightly-identities.sh; [ -f "$s" ] || s=".nightly-signing-control/$s"; [ -f "$s" ] || s=".publish-tooling/${s#*/}"; bash "$s"


      - &x59
        name: Embed verified SSH daemon manifest
        if: ${{ !env.LEFT_SLOT }}
        run: s=scripts/ci/nightly-steps/sign-embed-ssh-daemon-manifest.sh; [ -f "$s" ] || s=".nightly-signing-control/$s"; bash -e "$s"


      # Read-only: can this ASC key register nightly-next's own App ID
      # (com.cmuxterm.app.next) and fetch its Developer ID profile? It reports
      # and never writes or fails the build.
      - &x60
        name: Probe the cmux NEXT App ID and profile (read-only)
        if: needs.decide.outputs.track == 'nightly-next' && !env.LEFT_SLOT
        continue-on-error: true
        timeout-minutes: 2
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          python3 scripts/ci/asc_developer_id_app.py check \
            --bundle-id com.cmuxterm.app.next --name "cmux NEXT" --profile-name "cmux NEXT Developer ID" \
            | tee -a "$GITHUB_STEP_SUMMARY"


      # The signing keychain exists only while this job signs. It is deleted
      # before any step runs code from the bundle, and created again for the
      # DMG signature. scripts/ci/signing-keychain.sh owns its lifetime.
      - &x61
        name: Import signing cert
        if: ${{ !env.LEFT_SLOT }}
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: ./scripts/ci/signing-keychain.sh create


      # Each channel has its own Developer ID profile:
      # APPLE_NIGHTLY_PROVISIONING_PROFILE_BASE64 / APPLE_RC_PROVISIONING_PROFILE_BASE64.
      - &x62
        name: Embed channel provisioning profile
        if: needs.decide.outputs.profile_channel != '' && !env.LEFT_SLOT
        env:
          APP_PROVISIONING_PROFILE_BASE64: ${{ (needs.decide.outputs.profile_channel == 'NIGHTLY' && secrets.APPLE_NIGHTLY_PROVISIONING_PROFILE_BASE64 || needs.decide.outputs.profile_channel == 'RC' && secrets.APPLE_RC_PROVISIONING_PROFILE_BASE64 || needs.decide.outputs.profile_channel == 'RELEASE' && secrets.APPLE_RELEASE_PROVISIONING_PROFILE_BASE64 || '') }}
          PROFILE_SECRET_NAME: APPLE_${{ needs.decide.outputs.profile_channel }}_PROVISIONING_PROFILE_BASE64
        run: bash -e scripts/ci/nightly-steps/embed-provisioning-profile.sh


      - &x64
        name: Codesign apps
        if: ${{ !env.LEFT_SLOT }}
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # Chromium on demand (plans/cmux-next/bundle-size-DESIGN.md 6.6): off
          # until the repository variable CMUX_NEXT_CEF_ON_DEMAND is 1.
          CMUX_NEXT_CEF_ON_DEMAND: ${{ needs.decide.outputs.track == 'nightly-next' && vars.CMUX_NEXT_CEF_ON_DEMAND == '1' && '1' || '' }}
          CMUX_NEXT_CEF_RUNTIME_OUT: ${{ runner.temp }}/cef-runtime
          CMUX_NEXT_CEF_RUNTIME_BASE_URL: https://files-next.cmux.com
          # Languages download on first use (CMUX-570): the non-English strings leave the app
          # for language packs, which publish-nightly uploads before the appcast. On for
          # nightly-next; the repository variable CMUX_NEXT_LANGUAGE_PACKS=0 turns it off.
          CMUX_NEXT_LANGUAGE_PACKS: ${{ needs.decide.outputs.track == 'nightly-next' && vars.CMUX_NEXT_LANGUAGE_PACKS != '0' && '1' || '' }}
          CMUX_NEXT_LANGUAGE_PACKS_OUT: ${{ runner.temp }}/language-packs
          CMUX_NEXT_LANGUAGE_PACKS_BASE_URL: https://files-next.cmux.com/language-packs
          # Tools few people use download on first use too (bin/cmux-mobile-host, the iPhone
          # host): its pack goes in the language packs' tools/ and is published with them. On
          # with language packs; the repository variable CMUX_NEXT_TOOL_PACKS=0 turns it off.
          CMUX_NEXT_TOOL_PACKS: ${{ needs.decide.outputs.track == 'nightly-next' && vars.CMUX_NEXT_LANGUAGE_PACKS != '0' && vars.CMUX_NEXT_TOOL_PACKS != '0' && '1' || '' }}
          CMUX_NEXT_TOOL_PACKS_BASE_URL: https://files-next.cmux.com/tool-packs
          # sign-cef.sh reuses it when it is the same code and signer, so deltas leave Chromium out.
          CMUX_CEF_REUSE_FRAMEWORK: ${{ runner.temp }}/cef-reuse/Chromium Embedded Framework.framework
        run: |
          if [ -z "$APPLE_SIGNING_IDENTITY" ]; then
            echo "Missing APPLE_SIGNING_IDENTITY secret" >&2
            exit 1
          fi
          s=scripts/ci/nightly-steps/sign-fetch-published-chromium.sh
          if [ -f "$s" ]; then bash "$s" join "$RUNNER_TEMP/cef-reuse"; fi
          CMUX_SIGN_MODE=all ./scripts/sign-cmux-bundle.sh \
            "$CHANNEL_APP_PATH" \
            "$CHANNEL_ENTITLEMENTS" \
            "$APPLE_SIGNING_IDENTITY"


      # The runtime pack the app's pin names; publish-nightly uploads it
      # before the appcast.
      - name: Upload the Chromium runtime pack
        id: upload-the-chromium-runtime-pack
        continue-on-error: true
        if: needs.decide.outputs.track == 'nightly-next' && vars.CMUX_NEXT_CEF_ON_DEMAND == '1'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cef-runtime-pack
          overwrite: true
          path: ${{ runner.temp }}/cef-runtime
          if-no-files-found: error
          retention-days: 7

      - name: Upload the Chromium runtime pack (retry)
        if: "!cancelled() && steps.upload-the-chromium-runtime-pack.outcome == 'failure' && (needs.decide.outputs.track == 'nightly-next' && vars.CMUX_NEXT_CEF_ON_DEMAND == '1')"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cef-runtime-pack
          path: ${{ runner.temp }}/cef-runtime
          if-no-files-found: error
          retention-days: 7
          overwrite: true

      # The language packs the app's pin names (language-packs.py); publish-nightly uploads
      # them before the appcast.
      - name: Upload the language packs
        id: upload-the-language-packs
        continue-on-error: true
        if: needs.decide.outputs.track == 'nightly-next' && vars.CMUX_NEXT_LANGUAGE_PACKS != '0' && !env.LEFT_SLOT
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: language-packs
          overwrite: true
          path: |
            ${{ runner.temp }}/language-packs/
            !${{ runner.temp }}/language-packs/stage
          if-no-files-found: error
          retention-days: 7

      - name: Upload the language packs (retry)
        if: "!cancelled() && steps.upload-the-language-packs.outcome == 'failure' && (needs.decide.outputs.track == 'nightly-next' && vars.CMUX_NEXT_LANGUAGE_PACKS != '0' && !env.LEFT_SLOT)"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: language-packs
          path: |
            ${{ runner.temp }}/language-packs/
            !${{ runner.temp }}/language-packs/stage
          if-no-files-found: error
          retention-days: 7
          overwrite: true

      - &x66
        name: Delete signing keychain before runtime checks
        if: always()
        run: ./scripts/ci/signing-keychain.sh delete


      - name: Start the signed-app checks (they run during notarization)
        env:
          CHECK_MINOS: ${{ env.TRACK == 'nightly-next' }}
          PACKAGE_HANDOFF: ${{ needs.decide.outputs.notary_test != 'true' && needs.decide.outputs.import_paused != 'true' }}
          PACKAGE_UNNOTARIZED_ZIP: ${{ needs.decide.outputs.fast_build != 'true' && needs.decide.outputs.notary_test != 'true' && needs.decide.outputs.import_paused != 'true' }}
          VARIANT: ${{ matrix.variant }}
        run: s=scripts/ci/nightly-steps/sign-start-signed-app-checks.sh; [ -f "$s" ] || s=".nightly-signing-control/$s"; bash "$s"


      - name: Stop before notarization (NIGHTLY_NEXT_NOTARY_PAUSED)
        if: needs.decide.outputs.notary_paused == 'true'
        run: |
          echo "::notice title=nightly-next notarization paused::NIGHTLY_NEXT_NOTARY_PAUSED=1: the signed app was built, no notary submission was made and nothing is published."
          echo "### nightly-next notarization paused (NIGHTLY_NEXT_NOTARY_PAUSED=1): no notary submission, nothing published" >> "$GITHUB_STEP_SUMMARY"


      # The DMG needs the identity again. It runs no bundle code; notarize-nightly-dmg.sh deletes the keychain right after
      # the DMG signature, before static artifact verification.
      - &x67
        name: Import signing cert for the DMG signature
        if: ${{ !env.LEFT_SLOT }}
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: ./scripts/ci/signing-keychain.sh create


      - name: Notarize app ticket through final DMG
        id: notarize-nightly
        if: needs.decide.outputs.fast_build != 'true' && needs.decide.outputs.notary_paused != 'true'
        # Why: docs/ci/nightly-workflow-notes.md#note-1
        timeout-minutes: ${{ needs.decide.outputs.notary_test == 'true' && 205 || 130 }}
        env:
          CMUX_NOTARY_WAIT_TIMEOUT: ${{ needs.decide.outputs.notary_test == 'true' && '160m' || needs.decide.outputs.track == 'nightly-next' && needs.decide.outputs.should_publish == 'true' && needs.decide.outputs.no_publish != 'true' && '20m' || '40m' }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # The DMG around the stapled app is signed after Apple's wait.
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # A notary test publishes nothing and keeps its one DMG submission.
          CMUX_STAPLE_APP_IN_DMG: ${{ needs.decide.outputs.notary_test == 'true' && 'false' || 'true' }}
          # Only a build that may publish hands a pending submission to a
          # later run; a notary test waits here and is never continued.
          CMUX_NOTARY_PENDING_ON_TIMEOUT: ${{ needs.decide.outputs.track == 'nightly-next' && needs.decide.outputs.should_publish == 'true' && needs.decide.outputs.no_publish != 'true' && 'true' || 'false' }}
          CMUX_CHANNEL: ${{ needs.decide.outputs.sign_channel }}
          # Runtime checks for the stapled app and final DMG run in
          # verify-signed-nightly, a job without secrets.
          CMUX_DEFER_LAUNCH_SMOKES: "true"
        run: |
          ./scripts/ci/notarize-nightly-dmg.sh \
            "$CHANNEL_APP_PATH" \
            "$NIGHTLY_DMG_RELEASE" \
            "$NIGHTLY_DMG_IMMUTABLE"


      - &x68
        name: Finish the signed-app checks
        id: signed-app-checks
        if: always() && !env.LEFT_SLOT
