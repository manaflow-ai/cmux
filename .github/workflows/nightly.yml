            # Only files with a Mach-O or fat magic reach `file` (one process
            # each); the per-file scan of the whole bundle took 90 s.
            fat="$(find "$APP" -type f -print0 | python3 scripts/list-macho-candidates.py \
              | xargs -0 sh -c 'for f do if file -b "$f" | grep -q "Mach-O universal"; then echo "$f"; fi; done' sh)"
            if [ -n "$fat" ]; then
              echo "Fat Mach-O files remain after thinning:" >&2
              echo "$fat" >&2
              exit 1
            fi
          fi
          # The diff sidecar's static Mach-O checks and its
          # handshake run on the signed app in verify-signed-nightly.

      - &package-prepared-app-for-signi
        name: Package prepared app for signing
        if: env.PREPARE_FALLBACK != 'true' || steps.reuse.outputs.exists != 'true'
        run: |
          set -euo pipefail
          mkdir -p prepared-app-handoff
