      # the gate refused, and the job showed green with nothing published, so a 3.5 h stall read as healthy
      # (2026-11-25). A stand-down (writer linux or none, a known-bad commit), a superseded build and a left slot
      # publish nothing on purpose and stay green.
      - name: Fail when this build's publication was refused
        if: "always() && !cancelled() && !env.LEFT_SLOT && needs.decide.outputs.should_publish == 'true' && steps.recheck.outputs.already_published != 'true' && (steps.gate.outputs.refusal_reason != '' || steps.upload_next_appcasts.outputs.publication_refused == 'true')"
        env:
          REASON: ${{ steps.gate.outputs.refusal_reason || 'the R2 feed write refused this build' }}
          BUILD_SHA: ${{ steps.source.outputs.build_sha }}
        run: |
          echo "::error title=Nothing published::build $NIGHTLY_BUILD ($BUILD_SHA) was not published: $REASON"
          exit 1
      # The workspace stays (the next build fetches into it); this job's tokens and temp files do not.
      - name: Wipe this job's credentials and temp files
        if: always()
        run: bash "$PUBLISH_TOOLING/ci/nightly-steps/one-job.sh" wipe

  # nightly-next-one's end asks main's tick at once. Why: docs/ci/nightly-workflow-notes.md#note-19
  wake-nightly-next-tick:
    needs: [decide, resolve-nightly-cmux-tui-client, nightly-next-one, early-nightly-webviews]
    if: "always() && github.ref == 'refs/heads/nightly-next' && needs.decide.outputs.one_job == 'true' && (needs.nightly-next-one.result != 'skipped' || needs.early-nightly-webviews.outputs.red_sha != '')"
    # The nightly's Linux label, not the mini: the job holds App keys (below), and they stay off the nightly mini.
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.run_attempt == 1 && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' && inputs.nightly_next_loop_retry == '') && 'cmux-gcp-nightly-x64' || 'cmux-linux' }}
    # Room for gh_budget_wait.sh's wait through a rate limit, and for glaeda's capacity wait on the mini.
    timeout-minutes: ${{ vars.CI_NIGHTLY_MINI != '' && 190 || 70 }}
    continue-on-error: true
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/ci
            scripts/cmux-next/lib
      # Run 45562645699 (2026-11-25): github.token's hour was spent, so this dispatch and dispatch-published-in's
      # slept in gh_budget_wait.sh until its reset (18.4 and 12.9 min, both out at 07:54Z) though the feed was
      # live at 44.9 min. Each App installation has its own hour: a refused dispatch moves to cmux-bot, then the CI
      # pools, at once (GH_TOKEN_SPARE, GH_TOKEN_SPARES), and waits for a reset only when every one refuses.
      - &mint-dispatch-pools
        name: Mint the CI pool's tokens
        continue-on-error: true
        timeout-minutes: 1
        env:
          CI_POOL_APPS: ${{ vars.CMUX_CI_POOL_APPS }}
          CI_POOL_KEYS: ${{ secrets.CMUX_CI_POOL_KEYS }}
          CI_POOL_PERMISSIONS: '{"actions":"write"}'
        run: python3 scripts/ci/ci_pool_tokens.py
      - &mint-dispatch-spare
        name: Mint the dispatch's spare token
        id: cmux-bot-token
        if: vars.CMUX_BOT_APP_ID != ''
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.CMUX_BOT_APP_ID }}
          private-key: ${{ secrets.CMUX_BOT_APP_KEY }}
          permission-actions: write
      - *wait-through-github-api-rate-l
      - name: Ask main's nightly-next tick
        env: &dispatch-pools
          GH_TOKEN: ${{ github.token }}
          GH_TOKEN_SPARE: ${{ steps.cmux-bot-token.outputs.token }}
          GH_TOKEN_SPARES: ${{ env.CI_POOL_GH_TOKEN }} ${{ env.CI_POOL_GH_TOKEN_SPARES }}
        run: gh workflow run nightly-next-tick.yml --repo "$GITHUB_REPOSITORY" --ref main
      # nightly-next-one left without waiting for the promotion on the signing Mac; the wait is the retry's, off it.
      - name: Retry the commit that left the slot unless nightly-next moved
        if: "!cancelled() && needs.nightly-next-one.outputs.left_pending == 'true'"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_TOKEN_SPARE: ${{ steps.cmux-bot-token.outputs.token }}
          GH_TOKEN_SPARES: ${{ env.CI_POOL_GH_TOKEN }} ${{ env.CI_POOL_GH_TOKEN_SPARES }}
          TIP_SHA: ${{ needs.resolve-nightly-cmux-tui-client.outputs.tip_sha }}
          REPOSITORY: ${{ github.repository }}
          RETRY: ${{ inputs.nightly_next_loop_retry }}
        run: bash scripts/ci/nightly-steps/slot-left-retry.sh
      # The detector (hq#13299): the build this run published must reach the feed with its deltas, each
      # served at its length; a newer build already live passes with a notice. Red here names a feed
      # where every Mac downloads the full 243 MB DMG.
      - name: Check the published feed offers deltas
        if: needs.nightly-next-one.outputs.feed_written == 'true'
        env:
          BUILD: ${{ needs.nightly-next-one.outputs.build }}
        run: set -o pipefail; python3 scripts/ci/nightly_next_delta_check.py check --feed-url "$NIGHTLY_NEXT_FEED_BASE/appcast-arm64.xml" --build "$BUILD" | tee -a "$GITHUB_STEP_SUMMARY"

  # Leo's live code variant (docs/cmux-next/live-code.md), after this run wrote the feed; continue-on-error, so the
  # nightly never waits on it or fails for it. NIGHTLY_NEXT_LIVE_CODE_VARIANT=off stops it. The build holds no secret.
  build-live-code-variant:
    needs: [decide, nightly-next-one]
    if: "!cancelled() && github.ref == 'refs/heads/nightly-next' && needs.nightly-next-one.outputs.feed_written == 'true' && vars.NIGHTLY_NEXT_LIVE_CODE_VARIANT != 'off'"
    continue-on-error: true
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || vars.CI_NIGHTLY_MINI != '' && vars.CI_NIGHTLY_MINI || vars.CI_NIGHTLY_ONLY_RUNNER || 'glaeda-nightly-only-m4pro' }}
    timeout-minutes: ${{ vars.CI_NIGHTLY_MINI != '' && 240 || 120 }}
    permissions:
      contents: read
    # continue-on-error makes this job's result success even when it failed: sign gates on built, not the result.
    outputs:
      built: ${{ steps.live-code-built.outputs.built }}
    env:
      CMUX_CI_XCODE_APP: ${{ vars.CMUX_CI_XCODE_APP_MACOS_26 }}
      CMUX_CI_REQUIRED_MACOS_SDK_MAJOR: "26"
    steps:
      - *checkout-default
      - *select-xcode
      - *select-xcode-sdk
      - name: Build the commit's live code overlay
        env:
          COMMIT: ${{ needs.nightly-next-one.outputs.build_sha }}
          SWIFT_FLAGS: ${{ needs.decide.outputs.swift_import_flags }}
          CMUX_SWAP_BINARY_ROOT: ${{ runner.temp }}/swap-binary-live-code
        run: bash scripts/ci/nightly-steps/live-code-variant.sh build "$COMMIT" "$RUNNER_TEMP/live-code" "$SWIFT_FLAGS"
      - name: Upload the live code overlay
        id: upload-live-code
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: &live-code-upload
          name: live-code-${{ needs.nightly-next-one.outputs.build }}
          path: ${{ runner.temp }}/live-code/*.tar.gz
          if-no-files-found: error
          retention-days: 1
          overwrite: true
      - name: Upload the live code overlay (retry)
        if: "!cancelled() && steps.upload-live-code.outcome == 'failure'"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: *live-code-upload
      - name: Mark the live code overlay built
        id: live-code-built
        env:
          COMMIT: ${{ needs.nightly-next-one.outputs.build_sha }}
        run: bash scripts/ci/nightly-steps/live-code-variant.sh built "$COMMIT" "$RUNNER_TEMP/live-code"

  # Signs the overlay into the published nightly's app (no bundle code runs while a secret is in reach) on the signer.
  sign-live-code-variant:
    needs: [decide, nightly-next-one, build-live-code-variant]
    if: "!cancelled() && needs.build-live-code-variant.outputs.built == 'true'"
    continue-on-error: true
    environment: ${{ needs.decide.outputs.environment }}
    # The signer label, a literal, as nightly-next-one takes it. Why: docs/ci/nightly-workflow-notes.md#note-33
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || 'glaeda-trusted-next-signing' }}
    timeout-minutes: ${{ vars.CI_NIGHTLY_MINI != '' && 270 || 160 }}
    permissions:
      contents: read
    env:
      CMUX_CI_XCODE_APP: ${{ vars.CMUX_CI_XCODE_APP_MACOS_26 }}
      CMUX_CI_REQUIRED_MACOS_SDK_MAJOR: "26"
      BUILD: ${{ needs.nightly-next-one.outputs.build }}
      COMMIT: ${{ needs.nightly-next-one.outputs.build_sha }}
    steps:
      - *hold-the-whole-mac
      - *checkout-default
      - name: Claim the whole Mac for signing
        run: ./scripts/ci/signing-runner-claim.sh
      - *legacy-route-shared-5
      - *select-xcode
      - *select-xcode-sdk
      - *set-up-node
      - name: Install create-dmg
        run: bash scripts/ci/nightly-steps/install-create-dmg.sh
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: live-code-${{ needs.nightly-next-one.outputs.build }}
          path: live-code
      - name: Graft the overlay into the published nightly's app
        run: bash scripts/ci/nightly-steps/live-code-variant.sh prepare "${{ needs.decide.outputs.dmg_prefix }}" "$BUILD" live-code
      - name: Import the Developer ID certificate
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: ./scripts/ci/signing-keychain.sh create
      - name: Sign the variant as the nightly is signed
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash scripts/ci/nightly-steps/live-code-variant.sh sign "$VARIANT_APP" "$VARIANT_ENTITLEMENTS"
      - name: Notarize the variant and its DMG
        timeout-minutes: 75
        env:
          CMUX_NOTARY_WAIT_TIMEOUT: 60m
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          CMUX_STAPLE_APP_IN_DMG: "true"
          CMUX_NOTARY_PENDING_ON_TIMEOUT: "false"
          CMUX_CHANNEL: next
          CMUX_DEFER_LAUNCH_SMOKES: "true"
        run: ./scripts/ci/notarize-nightly-dmg.sh "$VARIANT_APP" "$LIVE_CODE_DMG_RELEASE" "$LIVE_CODE_DMG_IMMUTABLE"
      - name: Delete the signing keychain
        if: always()
        run: ./scripts/ci/signing-keychain.sh delete
      - name: Publish the variant and its module outputs
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.NIGHTLY_NEXT_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.NIGHTLY_NEXT_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: "https://${{ secrets.NIGHTLY_NEXT_R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
        run: bash scripts/ci/nightly-steps/live-code-variant.sh publish "$BUILD" "$COMMIT" "$LIVE_CODE_DMG_IMMUTABLE" "live-code/live-code-modules-$COMMIT.tar.gz" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" | tee -a "$GITHUB_STEP_SUMMARY"

  # Why: docs/ci/nightly-workflow-notes.md#note-22
  published-build:
    needs: [decide, build-nightly-app, resolve-nightly-cmux-tui-client, publish-nightly, nightly-next-one]
    if: "always() && (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/nightly-next' && inputs.nightly_next_post_publish != '' || needs.decide.outputs.should_publish == 'true' && (needs.publish-nightly.result == 'success' || needs.nightly-next-one.result == 'success' && needs.nightly-next-one.outputs.left != 'true'))"
    # Secret-free (python3 and the run's own token), so on Leo's ask (ask-c0123d25e8, "why so long that they didnt
    # publish either tho") it takes the nightly's reserved Linux label: on the nightly-only minis it queued 8-17 min
    # behind 25-min tail pollers before the GitHub release could start (runs 45572455172, 45575194160).
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.run_attempt == 1 && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' && inputs.nightly_next_loop_retry == '') && 'cmux-gcp-nightly-x64' || 'cmux-linux' }}
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      source_run: ${{ steps.record.outputs.source_run }}
      source_attempt: ${{ steps.record.outputs.source_attempt }}
      source_sha: ${{ steps.record.outputs.source_sha }}
      publish_result: ${{ steps.record.outputs.publish_result }}
      push_clean: ${{ steps.record.outputs.push_clean }}
      track: ${{ steps.record.outputs.track }}
      release_name: ${{ steps.record.outputs.release_name }}
      release_tag: ${{ steps.record.outputs.release_tag }}
      channel: ${{ steps.record.outputs.channel }}
      dmg_prefix: ${{ steps.record.outputs.dmg_prefix }}
      feeds: ${{ steps.record.outputs.feeds }}
      fast_build: ${{ steps.record.outputs.fast_build }}
      should_publish: ${{ steps.record.outputs.should_publish }}
      variants: ${{ steps.record.outputs.variants }}
      feed_base: ${{ steps.record.outputs.feed_base }}
      no_publish: ${{ steps.record.outputs.no_publish }}
      published_sha: ${{ steps.record.outputs.published_sha }}
      head_sha: ${{ steps.record.outputs.head_sha }}
      app_name: ${{ steps.record.outputs.app_name }}
      notary_test: ${{ steps.record.outputs.notary_test }}
      publish_already_published: ${{ steps.record.outputs.publish_already_published }}
      publish_behind: ${{ steps.record.outputs.publish_behind }}
      publish_behind_hours: ${{ steps.record.outputs.publish_behind_hours }}
      publish_build: ${{ steps.record.outputs.publish_build }}
      publish_build_sha: ${{ steps.record.outputs.publish_build_sha }}
      publish_downloads: ${{ steps.record.outputs.publish_downloads }}
      publish_refused: ${{ steps.record.outputs.publish_refused }}
      publish_source: ${{ steps.record.outputs.publish_source }}
      publish_source_archive: ${{ steps.record.outputs.publish_source_archive }}
      publish_tag_status: ${{ steps.record.outputs.publish_tag_status }}
      publish_tested_pattern: ${{ steps.record.outputs.publish_tested_pattern }}
      publish_tip_sha: ${{ steps.record.outputs.publish_tip_sha }}
      publish_variant_pattern: ${{ steps.record.outputs.publish_variant_pattern }}
      daemon_build: ${{ steps.record.outputs.daemon_build }}
      daemon_version: ${{ steps.record.outputs.daemon_version }}
      resolve_build_sha: ${{ steps.record.outputs.resolve_build_sha }}
      cross_run: ${{ steps.record.outputs.cross_run }}
      comment: ${{ steps.record.outputs.comment }}
      run_tail: ${{ steps.record.outputs.cross_run == 'true' || steps.record.outputs.track != 'nightly-next' || github.event_name != 'push' && inputs.nightly_next_loop_retry == '' }}
    env:
      SOURCE: ${{ inputs.nightly_next_post_publish }}
      NEEDS: ${{ toJSON(needs) }}
      RUN_ID: ${{ github.run_id }}
      RUN_ATTEMPT: ${{ github.run_attempt }}
      SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          sparse-checkout: scripts/ci
      # Anyone who may dispatch this workflow writes the input, and the tail checks out the record's build
      # commit with the Sparkle key. So the input only names the run: the API says what that run is, and the
      # record comes from its own artifact, which only its jobs can write.
      - name: Name the run that published
        id: source
        run: python3 scripts/ci/nightly_published_build.py source
      - name: Check the run that published
        if: steps.source.outputs.run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ steps.source.outputs.run }}
          ATTEMPT: ${{ steps.source.outputs.attempt }}
          SOURCE_RUN_FILE: ${{ runner.temp }}/source-run.json
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN/attempts/$ATTEMPT" > "$SOURCE_RUN_FILE"
          python3 scripts/ci/nightly_published_build.py check-source
      - name: Download its record
        if: steps.source.outputs.run != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          run-id: ${{ steps.source.outputs.run }}
          github-token: ${{ github.token }}
          name: nightly-published-build-${{ steps.source.outputs.attempt }}
          path: ${{ runner.temp }}/published-build
      - name: Read the published build
        id: record
        env:
          RECORD_FILE: ${{ runner.temp }}/published-build/published-build.json
        run: python3 scripts/ci/nightly_published_build.py outputs

  # Why: docs/ci/nightly-workflow-notes.md#note-49
  dispatch-published-in:
    # The build jobs too: the record says whether any of them failed (push_clean).
    needs: [decide, build-nightly-ghostty-cli-helper, build-nightly-app, build-sign-notarize-nightly, resolve-nightly-cmux-tui-client, publish-nightly, published-build, publish-nightly-next-github, nightly-next-one]
    if: "!cancelled() && (needs.publish-nightly.result == 'success' || needs.nightly-next-one.result == 'success') && needs.published-build.result == 'success' && needs.published-build.outputs.run_tail != 'true'"
    # The nightly's Linux label, not the mini: the job holds App keys (wake-nightly-next-tick's), kept off the mini.
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.run_attempt == 1 && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' && inputs.nightly_next_loop_retry == '') && 'cmux-gcp-nightly-x64' || 'cmux-linux' }}
    # Room for gh_budget_wait.sh's wait through a rate limit, and for glaeda's capacity wait on the mini.
    timeout-minutes: ${{ vars.CI_NIGHTLY_MINI != '' && 190 || 70 }}
    permissions:
      contents: read
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      NEEDS: ${{ toJSON(needs) }}
      RUN_ID: ${{ github.run_id }}
      RUN_ATTEMPT: ${{ github.run_attempt }}
      SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          sparse-checkout: scripts/ci
      - *mint-dispatch-pools
      - *mint-dispatch-spare
      - *wait-through-github-api-rate-l
      - name: Record the published build
        env:
          RECORD_FILE: ${{ runner.temp }}/published-build/published-build.json
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$RECORD_FILE")"
          python3 scripts/ci/nightly_published_build.py pack > "$RUNNER_TEMP/dispatch-input.json"
      # The tail run reads the record only from here (published-build), never from its input.
      - name: Upload the record
        id: upload-record
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-published-build-${{ github.run_attempt }}
          path: ${{ runner.temp }}/published-build/published-build.json
          if-no-files-found: error
          retention-days: 3
      - name: Upload the record (retry)
        if: "!cancelled() && steps.upload-record.outcome == 'failure'"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-published-build-${{ github.run_attempt }}
          path: ${{ runner.temp }}/published-build/published-build.json
          if-no-files-found: error
          retention-days: 3
          overwrite: true
      - name: Ask for this build's post-publication run
        # No loop (tests/test_ci_no_github_token_polling.py). A 4xx fails this job (report-nightly-failure lists it).
        # A 5xx may or may not have made the run (45693929930: HTTP 500, no tail, no notes, no comments): look once
        # for a tail started since, and ask once more only if none did, so an accepted dispatch never gets two.
        env: *dispatch-pools
        run: |
          set -uo pipefail
          started="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ask() { gh workflow run nightly.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" \
            -f nightly_next_post_publish="$(cat "$RUNNER_TEMP/dispatch-input.json")" 2>"$RUNNER_TEMP/dispatch.err"; }
          ask && exit 0
          cat "$RUNNER_TEMP/dispatch.err" >&2
          grep -q 'HTTP 5[0-9][0-9]' "$RUNNER_TEMP/dispatch.err" || exit 1
          sleep 30
          n="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow nightly.yml --event workflow_dispatch --branch "$GITHUB_REF_NAME" \
            --created ">=$started" --json displayTitle \
            --jq '[.[] | select(.displayTitle | startswith("Finish a published nightly-next build"))] | length')" || n=0
          [ "${n:-0}" -gt 0 ] 2>/dev/null && { echo "A tail run started despite the error."; exit 0; }
          ask || { cat "$RUNNER_TEMP/dispatch.err" >&2; exit 1; }

  # Where the tail runs (run_tail): a dispatched tail run, or main's, RC's or a manual run's own. The comments
  # wait for the whole-Mac publish jobs, so they never hold the mini while those wait.
  published-in:
    needs: [published-build, publish-nightly-next-github, generate-nightly-deltas, republish-nightly-deltas]
    if: "!cancelled() && github.ref == 'refs/heads/nightly-next' && needs.published-build.outputs.comment == 'true' && needs.published-build.outputs.run_tail == 'true'"
    # A paced job of up to five hours of GitHub API calls: it needs no Mac. On the nightly mini it held a Mac for
    # hours (Leo, 2026-11-25: "freeing up the Mac's from doing things that don't need Mac's asap"). Its token writes
    # pull requests, so never the shared persistent cmux-linux pool: the owned one-job JIT VM on every attempt, like
    # the other tail jobs (test_nightly_owned_minis_only.HOSTED_TAIL_JOBS). Tail only (run_tail), so a VM start never
    # holds the push group. Never Blacksmith.
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || 'cmux-gcp-nightly-jit-x64' }}
    # Each write is paced at 7.5 s under GitHub's hourly content limit.
    # A shared edit plus a legacy deletion for all 1,000 allowed PRs takes
    # 250 min; leave room for reads. This runs after publication.
    timeout-minutes: 420
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
    env:
      NIGHTLY_BUILD: ${{ needs.published-build.outputs.publish_build }}
      FEED_BASE: ${{ needs.published-build.outputs.feed_base }}
      HEAD_SHA: ${{ needs.published-build.outputs.resolve_build_sha }}
      PUBLISHED_SHA: ${{ needs.published-build.outputs.published_sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.published-build.outputs.resolve_build_sha }}
          persist-credentials: false
          sparse-checkout: scripts
      - *ensure-gh
      - *wait-through-github-api-rate-l

      - name: Fetch the published span
        # With the job token, for this step only: anonymous fetches got 403 four times (tail 45725593921).
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::$auth"
          GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" \
            ./scripts/cmux-next/fetch-release-notes-span.sh origin "$HEAD_SHA" nightly-next "$PUBLISHED_SHA"
      - *older-tree-step-scripts-plain
      - name: Comment the build on its PRs
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/nightly-steps/published-in-comment-prs.sh

  # Why: docs/ci/nightly-workflow-notes.md#note-12
  sign-release-notes:
    needs: [published-build, pick-nightly-sign-runner]
    if: "!cancelled() && needs.published-build.outputs.should_publish == 'true' && needs.published-build.outputs.track == 'nightly-next' && needs.published-build.outputs.no_publish != 'true' && needs.published-build.outputs.publish_result == 'success' && needs.published-build.outputs.publish_already_published != 'true' && needs.published-build.outputs.publish_refused != 'true' && needs.published-build.outputs.publish_source != 'recovered' && needs.published-build.outputs.run_tail == 'true'"
    environment: content-signing
    # Why: docs/ci/nightly-workflow-notes.md#note-50
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || 'cmux-gcp-nightly-jit-x64' }}
    timeout-minutes: 70
    permissions:
      contents: read
      # Read only: --pr-media reads the body of each highlight's pull request.
      pull-requests: read
    env:
      NIGHTLY_BUILD: ${{ needs.published-build.outputs.daemon_build }}
      NIGHTLY_VERSION: ${{ needs.published-build.outputs.daemon_version }}
      HEAD_SHA: ${{ needs.published-build.outputs.resolve_build_sha }}
      # The commit published before this run (decide reads it from the release
      # body before publish-nightly moves the nightly-next tag to HEAD_SHA).
      PUBLISHED_SHA: ${{ needs.published-build.outputs.published_sha }}
      CONTENT_PUBLIC_KEY: AnrDI4vqN4lFGX2IpzeWPZsa/Hk7yQMkVIKppFwAst4=
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.published-build.outputs.resolve_build_sha }}
          persist-credentials: false
      # Only the published span: a full fetch of every branch and tag did not
      # finish inside this job's timeout (run 37526646874).
      # The span starts at the newest build whose signed notes were published (its "head"), not at
      # the last published app: a build whose notes failed to publish then loses no highlight to
      # the next one (2026-10-12: 3821558930001 had no notes and its highlights were never shown).
      - *wait-through-github-api-rate-l

      - *older-tree-step-scripts-plain
      - name: Start the span at the newest published notes
        id: span
        run: bash scripts/ci/nightly-steps/release-notes-start-span.sh
      - name: Fetch the commits since the newest published notes
        env:
          SPAN_SINCE: ${{ steps.span.outputs.since }}
        run: ./scripts/cmux-next/fetch-release-notes-span.sh origin "$HEAD_SHA" nightly-next ${SPAN_SINCE:+"$SPAN_SINCE"}
      - name: Build and sign the release notes
        env:
          CONTENT_SIGNING_ED25519_PEM: ${{ secrets.CONTENT_SIGNING_ED25519_PEM }}
          SPAN_SINCE: ${{ steps.span.outputs.since }}
          # --pr-media: each highlight's picture from its pull request's body (read only).
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/nightly-steps/release-notes-sign.sh
      - name: Upload the signed release notes
        id: upload-the-signed-release-notes
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-notes
          path: notes/
          retention-days: 7

      - name: Upload the signed release notes (retry)
        if: "!cancelled() && steps.upload-the-signed-release-notes.outcome == 'failure'"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-notes
          path: notes/
          retention-days: 7
          overwrite: true

  publish-release-notes:
    # Still publish-nightly's lock: the notes writes (notes/index.json and the
    # rest) have no compare-and-swap, so only that lock keeps an older build's
    # checked notes from landing after a newer publish. It is publish-nightly's
    # R2 lease, not a concurrency group: a group cancelled the older pending job
    # (run 41436891188). nightly-next only (if:), so no group at all.
    needs: [published-build, sign-release-notes, pick-nightly-sign-runner]
    if: "!cancelled() && needs.published-build.outputs.track == 'nightly-next' && needs.published-build.outputs.publish_result == 'success' && needs.published-build.outputs.publish_already_published != 'true' && needs.published-build.outputs.publish_refused != 'true' && needs.sign-release-notes.result == 'success'"
    environment: ${{ github.ref == 'refs/heads/nightly-next' && 'release-next' || 'release' }}
    # A one-job JIT VM on purpose, in the tail only (after sign-release-notes): up to 130 min of lease and rate-limit
    # waits would hold the whole signing Mac (test_nightly_owned_minis_only.HOSTED_TAIL_JOBS).
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || 'cmux-gcp-nightly-jit-x64' }}
    # 70 for the work (an hour of it for API rate-limit waits) plus the lease's 60-minute wait.
    timeout-minutes: 130
    permissions:
      contents: read
    steps:
      # scripts/ci only: a full checkout stalled on the JIT VM (tails 45689720464, 45679817194).
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.published-build.outputs.resolve_build_sha }}
          persist-credentials: false
          sparse-checkout: scripts/ci
      # The wrapper comes from the workflow commit: the build checkout may predate it.
      # The publication-tooling shape test_nightly_cmux_tui_resolve.py exempts: scripts only.
      - *checkout-the-gh-token-wrapper

      - *gh-app-token-read

      - *gh-app-install-tooling

      - *wait-through-github-api-rate-l

      - &download-artifact-step
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-notes
          path: notes
      # publish-nightly's lease (its key, TTL and wait), before the publication head is read.
      - name: Take the nightly-next publish lease
        id: lease
        env: *next-publish-lease
        run: bash .publish-tooling/scripts/ci/nightly-steps/publish-lease.sh lock
      - name: Recheck the NEXT publication head
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.published-build.outputs.release_tag }}
          EXPECTED_SHA: ${{ needs.published-build.outputs.resolve_build_sha }}
          EXPECTED_BUILD: ${{ needs.published-build.outputs.publish_build }}
          FEED_BASE: ${{ needs.published-build.outputs.feed_base }}
        run: bash .publish-tooling/scripts/ci/nightly-steps/release-notes-recheck-publication-head.sh
      - name: Upload the signed release notes to R2
        if: steps.current.outputs.current == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.NIGHTLY_NEXT_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.NIGHTLY_NEXT_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: "https://${{ secrets.NIGHTLY_NEXT_R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
        run: bash .publish-tooling/scripts/ci/nightly-steps/release-notes-upload-to-r2.sh
      - *release-the-nightly-next-publi

  # The nightly reel (scripts/cmux-next/media/reel.py): each pull request in this
  # build's signed notes with its tour's "after" clip and a title card, joined
  # into one video, and a page listing them, on the pr-media branch at
  # nightly-next/<build>/. Evidence only: no job needs this one, and it never
  # reports the nightly as failed.
  publish-nightly-reel:
    needs: [published-build, publish-release-notes, pick-nightly-sign-runner]
    if: "!cancelled() && github.repository_owner == 'manaflow-ai' && needs.published-build.outputs.track == 'nightly-next' && needs.publish-release-notes.result == 'success'"
    continue-on-error: true
    # A one-job JIT VM on purpose, in the tail only (after publish-release-notes): an ffmpeg render of up to 90 min
    # would hold the whole signing Mac (test_nightly_owned_minis_only.HOSTED_TAIL_JOBS).
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || 'cmux-gcp-nightly-jit-x64' }}
    timeout-minutes: 90
    # The private-terms secret lives only in this environment, which admits only
    # the protected branches (main, feat-cmux-next, nightly-next).
    environment: pr-media
    # contents: write reaches the pr-media branch only through
    # .github/actions/pr-media-publish: its privacy check (pr_media_privacy.py,
    # with tesseract OCR for the reel's frames) refuses any private name in this
    # bot's folder before the first upload.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.published-build.outputs.resolve_build_sha }}
          persist-credentials: false
          sparse-checkout: |
            scripts
            .github/actions/pr-media-publish
      - *wait-through-github-api-rate-l

      - *download-artifact-step
      - *older-tree-step-scripts-plain
      - name: Install ffmpeg
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
        run: bash -e scripts/ci/nightly-steps/reel-install-ffmpeg.sh
      - name: Build and publish the reel
        uses: ./.github/actions/pr-media-publish
        env:
          NIGHTLY_BUILD: ${{ needs.published-build.outputs.daemon_build }}
        with:
          private-terms: ${{ secrets.PR_MEDIA_PRIVATE_TERMS }}
          agent-authors: ${{ vars.PR_MEDIA_AGENT_AUTHORS }}
          github-token: ${{ github.token }}
          command: |
            set -euo pipefail
            # The notes this run signed and published, checked against the content key.
            python3 scripts/cmux-next/media/reel.py --build "$NIGHTLY_BUILD" --notes "notes/$NIGHTLY_BUILD.json" \
              --out "$RUNNER_TEMP/reel" --publish | tee "$RUNNER_TEMP/reel.log"
            # The page the reel lists its clips on: raw.githubusercontent.com shows
            # index.html as text, so the summary carries the list itself.
            python3 - "$RUNNER_TEMP/reel/reel.json" "$RUNNER_TEMP/reel.log" >> "$GITHUB_STEP_SUMMARY" <<'PY'
            import json, sys
            report = json.load(open(sys.argv[1]))
            urls = [line.strip() for line in open(sys.argv[2]) if line.startswith("https://")]
            reel = next((url for url in urls if url.endswith("/reel.mp4")), None)
            print(f"### cmux NEXT nightly reel, build {report['build']}\n")
            print(f"[Reel (mp4)]({reel})\n" if reel else "No pull request in this build has a tour clip.\n")
            print("| PR | Title | Clip |\n| --- | --- | --- |")
            for pr in report["prs"]:
                title = str(pr.get("title", "")).replace("|", "\\|").replace("\n", " ")
                clip = pr.get("clip", "")
                cell = f"[{pr.get('tour') or 'clip'}]({clip})" if clip.startswith("https://") else "no clip"
                print(f"| #{pr['pr']} | {title} | {cell} |")
            PY

  # Why: docs/ci/nightly-workflow-notes.md#note-24
  retry-nightly-next:
    needs: [decide, build-nightly-ghostty-cli-helper, build-nightly-app, publish-nightly, resolve-nightly-cmux-tui-client, nightly-next-one, early-nightly-webviews]
    if: "always() && !cancelled() && github.ref == 'refs/heads/nightly-next' && (github.event_name == 'push' || inputs.nightly_next_loop_retry != '') && needs.resolve-nightly-cmux-tui-client.outputs.superseded != 'true' && needs.decide.outputs.track == 'nightly-next' && needs.decide.outputs.should_build == 'true' && needs.decide.outputs.should_publish == 'true' && needs.decide.outputs.no_publish != 'true' && needs.publish-nightly.result != 'success' && needs.nightly-next-one.result != 'success' && needs.nightly-next-one.outputs.webview_red != 'true' && needs.nightly-next-one.outputs.compile_red != 'true' && (needs.early-nightly-webviews.outputs.red_sha == '' || needs.early-nightly-webviews.outputs.red_sha != needs.resolve-nightly-cmux-tui-client.outputs.build_sha)"
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.CI_NIGHTLY_MINI != '' && vars.CI_NIGHTLY_MINI || vars.CI_NIGHTLY_ONLY_RUNNER || 'glaeda-nightly-only-m4pro' }}
    # Room for gh_budget_wait.sh's wait through a rate limit, and for glaeda's capacity wait on the mini.
    timeout-minutes: ${{ vars.CI_NIGHTLY_MINI != '' && 190 || 70 }}
    permissions:
      contents: read
      actions: write
      # Retry exhaustion comments on the nightly-next-feed-stale issue (nightly_next_retry_exhausted.py).
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ github.sha }}
      RUN_ID: ${{ github.run_id }}
      RUN_ATTEMPT: ${{ github.run_attempt }}
      RETRY: ${{ inputs.nightly_next_loop_retry }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          sparse-checkout: scripts/ci
      - *wait-through-github-api-rate-l
      - name: Ask the push group for the newest head
        run: bash scripts/ci/nightly-steps/retry-ask-push-group.sh

  # The nightly's webview type check red with no machine fix (fixit-compile): fixit-handoff.yml, dispatched on
  # feat-cmux-next, names the culprit and pushes its revert when clear, else opens the revert's pull request. Leo,
  # 2026-11-22: "if the fix is clear i think you guys should be able to unilaterally push commits directly." A job of
  # its own that only dispatches; check-nightly-webviews stays read-only.
  fixit-handoff:
    needs: [resolve-nightly-cmux-tui-client, check-nightly-webviews, nightly-next-one]
    if: ${{ !cancelled() && vars.FIXIT_HANDOFF != '0' && (needs.check-nightly-webviews.outputs.fixit_nofix == 'true' || needs.nightly-next-one.outputs.fixit_nofix == 'true') }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.CI_NIGHTLY_ONLY_RUNNER || 'glaeda-nightly-only-m4pro' }}
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      # Off the publish path: a rate-limited dispatch fails now instead of waiting, and never reds the nightly
      # (tests/test_gh_budget_wait.py DISPATCH_NEVER_WAITS).
      - name: Dispatch fixit-handoff on feat-cmux-next
        continue-on-error: true
        env:
          GH_BUDGET_WAIT_MAX_SECONDS: "0"
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.resolve-nightly-cmux-tui-client.outputs.build_sha }}
          ORIGIN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: gh workflow run fixit-handoff.yml --repo "$GITHUB_REPOSITORY" --ref feat-cmux-next -f sha="$SHA" -f check=webviews -f origin="$ORIGIN"

  # A cancelled job (a timeout reports as cancelled) counts as a failure. On
  # nightly-next the signed release notes are part of the publication: a
  # published build whose notes jobs did not both succeed is reported too
  # (run 37526646874 published with its notes job cancelled and no alarm).
  report-nightly-failure:
    needs: [decide, build-nightly-ghostty-cli-helper, build-nightly-app, build-nightly-remote-daemon, resolve-nightly-cmux-tui-client, prepare-nightly-variant, build-sign-notarize-nightly, verify-signed-nightly, verify-final-dmg-nightly, verify-recovered-nightly-next, republish-nightly-next, publish-nightly, dispatch-published-in, published-build, generate-nightly-deltas, republish-nightly-deltas, sign-release-notes, publish-release-notes, nightly-next-one, early-nightly-webviews]
    # Twice on nightly-next: the loop run reports its build, feed and dispatch, the dispatched run (cross_run) the
    # rest. A dispatched run whose published-build fails has no record, so it reports under nightly-next's names.
    if: always() && (needs.decide.outputs.should_publish == 'true' || needs.published-build.outputs.cross_run == 'true' || inputs.nightly_next_post_publish != '' && needs.published-build.result == 'failure') && needs.decide.outputs.notary_test != 'true' && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || needs.publish-nightly.outputs.feed_check == 'failure' || needs.publish-nightly.outputs.tag_status == 'stale' || needs.publish-nightly.outputs.refusal_reason != '' || needs.nightly-next-one.outputs.feed_check == 'failure' || needs.nightly-next-one.outputs.tag_status == 'stale' || needs.nightly-next-one.outputs.refusal_reason != '' || (needs.published-build.result == 'success' && needs.published-build.outputs.run_tail == 'true' && needs.published-build.outputs.track == 'nightly-next' && needs.published-build.outputs.publish_result == 'success' && needs.published-build.outputs.publish_already_published != 'true' && needs.published-build.outputs.publish_refused != 'true' && needs.published-build.outputs.publish_source != 'recovered' && (needs.sign-release-notes.result != 'success' || needs.publish-release-notes.result != 'success')))
    # The declared nightly-only mini is enabled after live admission is verified.
    # Keep the existing fallback; never reuse the stale builder-only placement.
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.CI_NIGHTLY_MINI != '' && vars.CI_NIGHTLY_MINI || github.repository == 'manaflow-ai/cmux' && needs.decide.outputs.track == 'nightly-next' && github.run_attempt == 1 && vars.CI_NIGHTLY_ONLY_RUNNER == 'glaeda-nightly-only-m4pro' && vars.CI_NIGHTLY_ONLY_RUNNER || vars.CI_NIGHTLY_ONLY_RUNNER || 'glaeda-nightly-only-m4pro' }}
    timeout-minutes: 55
    permissions:
      contents: read
      issues: write
      # The replaced-build check lists this run's jobs.
      actions: read
    steps:
      - name: Open or update the nightly failure issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          # In the dispatched run, decide and the build jobs skipped: the record names the build.
          HEAD_SHA: ${{ needs.resolve-nightly-cmux-tui-client.outputs.build_sha || needs.published-build.outputs.resolve_build_sha || needs.decide.outputs.head_sha || needs.published-build.outputs.head_sha }}
          # The pushed nightly-next head (HEAD_SHA can be an older resolved build commit).
          TIP_SHA: ${{ needs.decide.outputs.head_sha || needs.published-build.outputs.head_sha }}
          RESULTS: ${{ toJSON(needs) }}
          CHANNEL_RELEASE_TAG: ${{ needs.decide.outputs.release_tag || needs.published-build.outputs.release_tag || inputs.nightly_next_post_publish != '' && 'nightly-next' || '' }}
          CHANNEL_APP_NAME: ${{ needs.decide.outputs.app_name || needs.published-build.outputs.app_name || inputs.nightly_next_post_publish != '' && 'cmux NIGHTLY' || '' }}
          REF_NAME: ${{ github.ref_name }}
          TAG_STATUS: ${{ needs.publish-nightly.outputs.tag_status || needs.nightly-next-one.outputs.tag_status }}
          PUBLISH_SOURCE: ${{ needs.publish-nightly.outputs.source || needs.nightly-next-one.outputs.source || needs.published-build.outputs.publish_source }}
          REFUSAL_REASON: ${{ needs.publish-nightly.outputs.refusal_reason || needs.nightly-next-one.outputs.refusal_reason }}
          TRACK: ${{ needs.decide.outputs.track || needs.published-build.outputs.track || inputs.nightly_next_post_publish != '' && 'nightly-next' || '' }}
        with:
          script: |
            const { owner, repo } = context.repo;
            // One label per release track (nightly, rc, nightly-next), so a
            // cmux-next result never opens or closes main's NIGHTLY incident.
            const appName = process.env.CHANNEL_APP_NAME;
            const refName = process.env.REF_NAME;
            const label = `${process.env.CHANNEL_RELEASE_TAG}-failure`;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const results = JSON.parse(process.env.RESULTS);
            // A nightly-next build that a newer push replaced while it waited for
            // the shared build slot ends cancelled without ever getting a runner;
            // the newer run builds and reports. Only that case is dropped: a build
            // that started and was cancelled (timeout, by hand) still reports, and
            // so does every other failed job of this run.
            let replaced = false;
            if (refName === 'nightly-next' && results['build-nightly-app']?.result === 'cancelled') {
              try {
                // Latest attempt of each job (the endpoint's default filter).
                const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun,
                  { owner, repo, run_id: context.runId, per_page: 100 });
                const build = jobs.find((job) => job.name === 'build-nightly-app');
                const neverStarted = Boolean(build) && !build.runner_name && !(build.steps || []).length;
                // A build cancelled while queued for a runner never started either;
                // only a newer push (the ref moved past this tip) replaces it.
                const { data: ref } = await github.rest.git.getRef({ owner, repo, ref: 'heads/nightly-next' });
                replaced = neverStarted && ref.object.sha !== process.env.TIP_SHA;
              } catch (error) {
                core.warning(`Could not read this run's jobs (${error.message}); reporting the cancelled build.`);
              }
            }
            const failed = Object.entries(results)
              .filter(([k, v]) => (v.result === 'failure' || v.result === 'cancelled') && !(replaced && k === 'build-nightly-app'))
              .map(([k, v]) => `${k} (${v.result})`);
            if (replaced && failed.length === 0 && !process.env.REFUSAL_REASON && process.env.TAG_STATUS !== 'stale') {
              core.info('build-nightly-app was replaced in its slot by a newer nightly-next push before it started; nothing else failed.');
              return;
            }
            // A refused publication succeeds as a job but published nothing.
            if (process.env.REFUSAL_REASON) failed.push(`publish-nightly (refused: ${process.env.REFUSAL_REASON})`);
            // nightly-next: notes jobs that were skipped after a publication
            // (a recovered one skips them on purpose), in the run that ran the tail (run_tail).
            if (process.env.TRACK === 'nightly-next' && results['published-build']?.result === 'success'
                && results['published-build']?.outputs?.run_tail === 'true'
                && results['published-build']?.outputs?.publish_result === 'success' && process.env.PUBLISH_SOURCE !== 'recovered') {
              for (const job of ['sign-release-notes', 'publish-release-notes']) {
                const result = results[job]?.result;
                if (result === 'skipped') failed.push(`${job} (skipped)`);
              }
            }
            const tagStale = process.env.TAG_STATUS === 'stale';
            const publicationLine = tagStale
              ? `${appName} published, tag marker stale for ${process.env.HEAD_SHA} (${refName}). Assets, release metadata, and appcasts are available; only the channel completion marker failed to advance.`
              : `${appName} run ${runUrl} failed on ${process.env.HEAD_SHA} (${refName}) in: ${failed.join(', ')}.`;
            const failedLine = failed.length > 0 ? `Failed jobs: ${failed.join(', ')}.` : 'The tag marker update failed after publication completed.';
            const body = `${publicationLine}\n\n${failedLine}\n\nThe next successful publication will update this incident. Run: ${runUrl}`;
            try {
              await github.rest.issues.getLabel({ owner, repo, name: label });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.issues.createLabel({ owner, repo, name: label, color: 'b60205', description: `${appName} publish failing` });
            }
            const open = await github.rest.issues.listForRepo({ owner, repo, labels: label, state: 'open', per_page: 1 });
            if (open.data.length > 0) {
              await github.rest.issues.createComment({ owner, repo, issue_number: open.data[0].number, body });
            } else {
              await github.rest.issues.create({ owner, repo, title: `${appName} build is failing on ${refName}`, labels: [label], body });
            }

  # The nightly-next feed alarm (one `nightly-next-feed-stale` issue past
  # NIGHTLY_NEXT_MAX_FEED_LAG_HOURS) runs from main every 30 minutes, so it also
  # sees promotion stalls: nightly-next-feed-watch.yml (cx-npz7g).

  close-nightly-failure-issue:
    needs: [decide, build-nightly-ghostty-cli-helper, build-nightly-app, build-sign-notarize-nightly, publish-nightly, resolve-nightly-cmux-tui-client, published-build, generate-nightly-deltas, republish-nightly-deltas, sign-release-notes, publish-release-notes]
    # always(): a skipped notes job must not skip this job silently; the
    # conditions below decide. nightly-next closes only with its notes published,
    # unless it published a recovered build, which has none (cx-urd.69). A
    # recovered build can follow this run's own failed build, which reports.
    # It closes in the run that ran the notes and deltas (run_tail): on nightly-next, the dispatched one. There
    # it cannot see the run that published, so push_clean says none of that run's jobs failed.
    if: always() && needs.published-build.result == 'success' && needs.published-build.outputs.run_tail == 'true' && needs.published-build.outputs.should_publish == 'true' && needs.published-build.outputs.push_clean == 'true' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && needs.published-build.outputs.publish_result == 'success' && needs.published-build.outputs.publish_refused != 'true' && needs.published-build.outputs.publish_tag_status == 'updated' && (needs.generate-nightly-deltas.result == 'success' || needs.generate-nightly-deltas.result == 'skipped') && (needs.republish-nightly-deltas.result == 'success' || needs.republish-nightly-deltas.result == 'skipped') && (needs.published-build.outputs.track != 'nightly-next' || needs.published-build.outputs.publish_source == 'recovered' || (needs.sign-release-notes.result == 'success' && needs.publish-release-notes.result == 'success'))
    # The declared nightly-only mini is enabled after live admission is verified.
    # Keep the existing fallback; never reuse the stale builder-only placement.
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.CI_NIGHTLY_MINI != '' && vars.CI_NIGHTLY_MINI || github.repository == 'manaflow-ai/cmux' && needs.decide.outputs.track == 'nightly-next' && github.run_attempt == 1 && vars.CI_NIGHTLY_ONLY_RUNNER == 'glaeda-nightly-only-m4pro' && vars.CI_NIGHTLY_ONLY_RUNNER || vars.CI_NIGHTLY_ONLY_RUNNER || 'glaeda-nightly-only-m4pro' }}
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - name: Close the nightly failure issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          HEAD_SHA: ${{ needs.published-build.outputs.resolve_build_sha || needs.published-build.outputs.head_sha }}
          CHANNEL_RELEASE_TAG: ${{ needs.published-build.outputs.release_tag }}
          CHANNEL_APP_NAME: ${{ needs.published-build.outputs.app_name }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const open = await github.rest.issues.listForRepo({ owner, repo, labels: `${process.env.CHANNEL_RELEASE_TAG}-failure`, state: 'open', per_page: 10 });
            for (const issue of open.data) {
              await github.rest.issues.createComment({ owner, repo, issue_number: issue.number, body: `${process.env.CHANNEL_APP_NAME} publish succeeded again on ${process.env.HEAD_SHA}: ${runUrl}` });
              await github.rest.issues.update({ owner, repo, issue_number: issue.number, state: 'closed' });
            }
