            status=0
            scripts/ci/check-browser-data-import-absent.sh "$state/snapshot/cmux.app" || status=$?
            echo "$status" >"$state/status.fifo"
          ) >"$state/proof.log" 2>&1 </dev/null &
          echo "browser-data import proof started on a clone of the bundle (PID $!)"


      - &inject-universal-ghostty-cli-he
        name: Inject universal Ghostty CLI helper
        if: env.PREPARE_FALLBACK != 'true' || steps.reuse.outputs.exists != 'true'
        run: |
          set -euo pipefail
          APP_DIR="build-universal/Build/Products/Release/cmux.app"
          if [ ! -d "$APP_DIR" ]; then
            echo "Built app not found at $APP_DIR" >&2
            exit 1
          fi
