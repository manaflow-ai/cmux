      # commit resolve-nightly-cmux-tui-client chose); an unsigned app saved
      # before that move has none, and is refused here.
      - &require-the-cmux-tui-client-bu
        name: Require the cmux-tui client build-nightly-app bundled
        if: ${{ (env.PREPARE_FALLBACK != 'true' || steps.reuse.outputs.exists != 'true') && (needs.decide.outputs.fast_build != 'true') }}
