      - *wipe-owned-credentials

  # Why: docs/ci/nightly-workflow-notes.md#note-21
  publish-nightly-next-github:
    needs: [published-build]
    if: "always() && !cancelled() && needs.published-build.outputs.track == 'nightly-next' && needs.published-build.outputs.publish_result == 'success' && needs.published-build.outputs.publish_already_published != 'true' && needs.published-build.outputs.publish_refused != 'true' && needs.published-build.outputs.publish_tag_status == 'updated' && needs.published-build.outputs.cross_run != 'true'"
    # Nothing on the feed's path needs this job, so a failure shows red and holds nothing.
    environment: ${{ github.ref == 'refs/heads/nightly-next' && 'release-next' || 'release' }}
    permissions:
      contents: write
      actions: read # The published build's artifacts, from the run that published.
    # An upload holds the release App key but signs nothing: a fresh hosted VM per job, so no other job shares it and
    # the signer stays free for the next sign (one-mini mode too: on the mini it would need the whole-Mac claim).
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || 'cmux-gcp-nightly-jit-x64' }}
    # The two former jobs' limits added up: the uploads and the names each may wait out an hour of rate limits.
    timeout-minutes: 240
    outputs:
      release_id: ${{ steps.publish_assets.outputs.release_id }}
      asset_names: ${{ steps.publish_assets.outputs.asset_names }}
      newest: ${{ steps.order.outputs.newest }}
    env:
      NIGHTLY_FEEDS: ${{ needs.published-build.outputs.feeds }}
      CHANNEL: ${{ needs.published-build.outputs.channel }}
      CHANNEL_DMG_PREFIX: ${{ needs.published-build.outputs.dmg_prefix }}
      CHANNEL_RELEASE_TAG: ${{ needs.published-build.outputs.release_tag }}
      NIGHTLY_BUILD: ${{ needs.published-build.outputs.publish_build }}
      PUBLISH_TOOLING: *pub-tooling
    steps:
      # Only the source archive reads the build's tree; every other step runs .publish-tooling. The full
      # checkout took 2 min of the whole Mac on run 42018687632, whose archive step was off.
      - name: Checkout publish ref
        if: needs.published-build.outputs.publish_source_archive == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ needs.published-build.outputs.publish_build_sha }}

      - *checkout-publication-tooling-a

      - *gh-app-token-write

      - *gh-app-install-tooling

      - name: Wait through GitHub API rate limits in this job's gh calls
        run: bash .publish-tooling/scripts/ci/gh_budget_wait.sh --install

      - name: Download nightly variant artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          # From the run that published (the dispatched run's published-build names it).
          run-id: ${{ needs.published-build.outputs.source_run || github.run_id }}
          github-token: ${{ needs.published-build.outputs.cross_run == 'true' && github.token || '' }}
          pattern: ${{ needs.published-build.outputs.publish_variant_pattern }}
          path: nightly-out
          merge-multiple: true

      - name: Download verified DMG digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          # From the run that published (the dispatched run's published-build names it).
          run-id: ${{ needs.published-build.outputs.source_run || github.run_id }}
          github-token: ${{ needs.published-build.outputs.cross_run == 'true' && github.token || '' }}
          pattern: ${{ needs.published-build.outputs.publish_tested_pattern }}
          path: tested
          merge-multiple: true

      - name: Download SSH daemon assets for publication
        if: needs.published-build.outputs.publish_source == 'own'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          # From the run that published (the dispatched run's published-build names it).
          run-id: ${{ needs.published-build.outputs.source_run || github.run_id }}
          github-token: ${{ needs.published-build.outputs.cross_run == 'true' && github.token || '' }}
          name: cmux-nightly-remote-daemon
          path: nightly-out

      - name: Download the published feed
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          # From the run that published (the dispatched run's published-build names it).
          run-id: ${{ needs.published-build.outputs.source_run || github.run_id }}
          github-token: ${{ needs.published-build.outputs.cross_run == 'true' && github.token || '' }}
          name: nightly-next-github-${{ needs.published-build.outputs.source_run || github.run_id }}-${{ needs.published-build.outputs.source_attempt || github.run_attempt }}
          path: next-github

      - name: Require the DMG to match a tested digest
        run: bash .publish-tooling/scripts/ci/nightly-steps/github-publish-require-tested-digest.sh

      - name: Prune old nightly release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_APP_TOKEN: ${{ steps.gh-app-token.outputs.token }} # App first, GH_TOKEN as fallback
        run: bash .publish-tooling/scripts/ci/nightly-steps/github-publish-prune-old-assets.sh

      - name: Publish nightly-next release assets
        id: publish_assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_APP_TOKEN: ${{ steps.gh-app-token.outputs.token }} # App first, GH_TOKEN as fallback
          CMUX_RELEASE_RATE_LIMIT_SECONDS: "3600"
        run: bash .publish-tooling/scripts/ci/nightly-steps/github-publish-release-assets.sh

      - name: Download the cmux-next source archive
        if: needs.published-build.outputs.publish_source_archive == 'true' && needs.published-build.outputs.publish_source == 'own'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          # From the run that published (the dispatched run's published-build names it).
          run-id: ${{ needs.published-build.outputs.source_run || github.run_id }}
          github-token: ${{ needs.published-build.outputs.cross_run == 'true' && github.token || '' }}
          name: cmux-next-source-archive
          path: source-archive

      # Why: docs/ci/nightly-workflow-notes.md#note-46
      - name: Take the recovered build's source archive
        if: needs.published-build.outputs.publish_source_archive == 'true' && needs.published-build.outputs.publish_source == 'recovered'
        run: mv nightly-out/source-archive source-archive

      - name: Publish the cmux-next source archive
        if: needs.published-build.outputs.publish_source_archive == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_APP_TOKEN: ${{ steps.gh-app-token.outputs.token }} # App first, GH_TOKEN as fallback
          CMUX_RELEASE_RATE_LIMIT_SECONDS: "1800"
          HEAD_SHA: ${{ needs.published-build.outputs.publish_build_sha }}
        run: bash .publish-tooling/scripts/ci/nightly-steps/github-source-archive.sh

      - name: Check this build is still the feed's newest
        id: order
        run: bash .publish-tooling/scripts/ci/nightly-steps/github-publish-still-newest.sh

      # The mutable state, only for the live feed's newest build. A failed write here leaves the immutable
      # assets above published and the job green (continue-on-error); the next build's run writes them.
      # One names writer at a time across runs, push or dispatch (the names job's group did this): its own
      # R2 lease (publish-lease.sh), which never cancels a waiter. Each write runs still-newest inside it.
      - name: Take the release names lease
        id: names_lease
        if: steps.order.outputs.newest == 'true'
        continue-on-error: true
        env: &github-names-lease
          AWS_ACCESS_KEY_ID: ${{ secrets.NIGHTLY_NEXT_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.NIGHTLY_NEXT_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: "https://${{ secrets.NIGHTLY_NEXT_R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
          LEASE_KEY: nightly-next/locks/github-names.json
          LEASE_OWNER: ${{ github.run_id }}-${{ github.run_attempt }}
          LEASE_TTL: 900
          LEASE_RENEW: 60
          # The names writes may wait out an hour of rate limits, as the job's timeout allows.
          LEASE_MAX_HOLD: 10800
          LEASE_WAIT: 3600
        run: bash .publish-tooling/scripts/ci/nightly-steps/publish-lease.sh lock

      - name: Take the published feed
        if: steps.names_lease.outcome == 'success'
        continue-on-error: true
        run: bash .publish-tooling/scripts/ci/nightly-steps/github-names-take-feed.sh

      - name: Install the feed order check
        if: steps.names_lease.outcome == 'success'
        continue-on-error: true
        run: bash .publish-tooling/scripts/ci/nightly-steps/github-names-install-still-newest.sh

      - name: Publish the rolling DMG name and the feed copy
        id: publish_names
        if: steps.names_lease.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_APP_TOKEN: ${{ steps.gh-app-token.outputs.token }} # App first, GH_TOKEN as fallback
          CMUX_RELEASE_RATE_LIMIT_SECONDS: "3600"
        run: bash .publish-tooling/scripts/ci/nightly-steps/github-names-publish-rolling-name.sh

      - name: Mint release tag app token
        id: release-tag-token
        if: steps.publish_names.outputs.newest == 'true'
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.CMUX_RELEASE_APP_ID }}
          private-key: ${{ secrets.CMUX_RELEASE_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-workflows: write

      - name: Record the published build in the release body
        if: steps.publish_names.outputs.newest == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.release-tag-token.outputs.token }}
          RELEASE_ID: ${{ steps.publish_assets.outputs.release_id }}
          UPLOADED_ASSETS: ${{ steps.publish_assets.outputs.asset_names }}
          RELEASE_NAME: ${{ needs.published-build.outputs.release_name }}
          BUILD_SHA: ${{ needs.published-build.outputs.publish_build_sha }}
          REF_NAME: ${{ github.ref_name }}
          TIP_SHA: ${{ needs.published-build.outputs.publish_tip_sha }}
          BEHIND: ${{ needs.published-build.outputs.publish_behind }}
          BEHIND_HOURS: ${{ needs.published-build.outputs.publish_behind_hours }}
          DOWNLOADS: ${{ needs.published-build.outputs.publish_downloads }}
        run: bash .publish-tooling/scripts/ci/nightly-steps/github-names-record-release-body.sh

      - name: Move the nightly-next tag to the published build
        if: steps.publish_names.outputs.newest == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.release-tag-token.outputs.token }}
          GITHUB_TOKEN: ''
          BUILD_SHA: ${{ needs.published-build.outputs.publish_build_sha }}
        run: bash .publish-tooling/scripts/ci/nightly-steps/github-names-move-tag.sh

      - name: Release the release names lease
        if: always() && steps.names_lease.outcome != 'skipped'
        continue-on-error: true
        env: *github-names-lease
        run: bash .publish-tooling/scripts/ci/nightly-steps/publish-lease.sh unlock

  # Why: docs/ci/nightly-workflow-notes.md#note-25
  keep-published-dsyms:
    needs: [published-build, pick-nightly-sign-runner]
    if: "always() && !cancelled() && needs.published-build.outputs.track == 'nightly-next' && needs.published-build.outputs.publish_result == 'success' && needs.published-build.outputs.publish_refused != 'true' && (needs.published-build.outputs.publish_tag_status == 'updated' || needs.published-build.outputs.publish_tag_status == 'stale' || needs.published-build.outputs.publish_already_published == 'true') && needs.published-build.outputs.publish_build_sha != '' && needs.published-build.outputs.cross_run != 'true'"
    environment: ${{ github.ref == 'refs/heads/nightly-next' && 'release-next' || 'release' }}
    continue-on-error: true
    permissions:
      contents: read
      actions: read
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.CI_NIGHTLY_MINI_PUBLISHER == 'ubuntu-24.04' && 'cmux-gcp-nightly-jit-x64' || vars.CI_NIGHTLY_MINI != '' && 'glaeda-trusted-next-signing' || needs.pick-nightly-sign-runner.outputs.attempt == github.run_attempt && needs.pick-nightly-sign-runner.outputs.sign_owned_pool || 'glaeda-trusted-next-signing' }}
    # One-mini mode adds glaeda's capacity wait (tests/test_nightly_mini_gate_timeouts.py).
    timeout-minutes: ${{ vars.CI_NIGHTLY_MINI != '' && 195 || 75 }}
    env:
      BUILD: ${{ needs.published-build.outputs.publish_build }}
      BUILD_SHA: ${{ needs.published-build.outputs.publish_build_sha }}
    steps:
      # First, before any checkout or secret: the whole mini (glaeda's exclusive class), as the signing jobs.
      - *hold-the-whole-mac
      - *clean-owned-workdir
      - *checkout-publication-tooling-a

      # Before any release App secret: the claim again, and a keychain a killed job left is removed.
      - *claim-publication-mac

      - *gh-app-token-read

      - *gh-app-install-tooling

      - *wait-through-github-api-rate-l-2

      - name: Find the attempt that compiled the published build
        id: producer
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .publish-tooling/scripts/ci/nightly-steps/dsyms-find-attempt.sh

      # Why: docs/ci/nightly-workflow-notes.md#note-8
      - name: Download the published build's dSYMs from the run that compiled it (parallel)
        id: dsyms-parallel
        continue-on-error: true
        timeout-minutes: 10
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DSYMS_ARTIFACT: ${{ steps.producer.outputs.artifact }}
          DSYMS_RUN: ${{ steps.producer.outputs.run }}
        run: python3 .publish-tooling/scripts/ci/download-run-artifact.py --artifact-id "$DSYMS_ARTIFACT" --run-id "$DSYMS_RUN" --out "$RUNNER_TEMP/published-dsyms/dSYMs" --connections 32

      - name: Download the published build's dSYMs from the run that compiled it
        if: steps.dsyms-parallel.outcome != 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ steps.producer.outputs.artifact }}
          run-id: ${{ steps.producer.outputs.run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/published-dsyms/dSYMs

      - name: Keep the published build's dSYMs on R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.NIGHTLY_NEXT_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.NIGHTLY_NEXT_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: "https://${{ secrets.NIGHTLY_NEXT_R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
        run: bash .publish-tooling/scripts/ci/nightly-steps/dsyms-keep-on-r2.sh

      - *wipe-owned-credentials

  # Why: docs/ci/nightly-workflow-notes.md#note-28
  sentry-dsyms-nightly:
    needs: [published-build]
    if: "!cancelled() && needs.published-build.outputs.track == 'nightly-next' && needs.published-build.outputs.publish_result == 'success' && needs.published-build.outputs.publish_refused != 'true' && needs.published-build.outputs.publish_build_sha != '' && needs.published-build.outputs.run_tail == 'true'"
    continue-on-error: true
    # The environment build-nightly-app gives its own in-job Sentry upload.
    environment: ${{ github.ref == 'refs/heads/main' && 'ci-cache-writer' || '' }}
    permissions:
      contents: read
      actions: read
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || 'cmux-gcp-nightly-jit-x64' }}
    timeout-minutes: 45
    env:
      BUILD: ${{ needs.published-build.outputs.publish_build }}
      BUILD_SHA: ${{ needs.published-build.outputs.publish_build_sha }}
    steps:
      - *checkout-publication-tooling-a

      - name: Find the attempt that compiled the published build
        id: producer
        env:
          GH_TOKEN: ${{ github.token }}
          DSYMS_NAMES: nightly-next-dsyms nightly-next-cmux-tui-dsyms
        run: bash .publish-tooling/scripts/ci/nightly-steps/dsyms-find-attempt.sh

      - name: Download the build's dSYMs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ steps.producer.outputs.artifacts }}
          run-id: ${{ steps.producer.outputs.run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/dsyms

      - name: Upload the build's dSYMs to Sentry
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: manaflow
          SENTRY_PROJECT: cmuxterm-macos
        run: bash .publish-tooling/scripts/upload-sentry-dsyms.sh "$RUNNER_TEMP/dsyms"

  # The deltas' slow part, BinaryDelta (494 s of generate-nightly-deltas' 15-min whole-Mac hold on run
  # 42149108998), needs no key. This job builds the delta files with no secret, on a light nightly-only
  # runner of the nightly mini, so the keyed job below only reuses and signs them. Optional like the deltas:
  # a failure leaves every delta to the keyed job, which builds what it lacks as before.
  build-nightly-deltas:
    needs: [published-build]
    if: always() && needs.published-build.outputs.should_publish == 'true' && needs.published-build.outputs.fast_build != 'true' && needs.published-build.outputs.publish_result == 'success' && needs.published-build.outputs.publish_source != 'recovered' && needs.published-build.outputs.publish_refused != 'true' && vars.NIGHTLY_DELTAS != 'off' && needs.published-build.outputs.run_tail == 'true'
    permissions:
      contents: read
      actions: read
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || vars.CI_NIGHTLY_MINI != '' && vars.CI_NIGHTLY_MINI || vars.CI_NIGHTLY_ONLY_RUNNER || 'glaeda-nightly-only-m4pro' }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.published-build.outputs.variants) }}
    timeout-minutes: 80
    outputs:
      skip: ${{ steps.deltas-yield.outputs.skip }}
    env:
      NIGHTLY_VARIANT: ${{ matrix.variant }}
      NIGHTLY_BUILD: ${{ needs.published-build.outputs.daemon_build }}
      CHANNEL_DMG_PREFIX: ${{ needs.published-build.outputs.dmg_prefix }}
      CHANNEL_RELEASE_TAG: ${{ needs.published-build.outputs.release_tag }}
      NIGHTLY_DELTAS_PREBUILD_ONLY: 1
      # nightly-next shipped its 3 nearest deltas with the build (hq#13299): only the ~1 and ~3 day bases here.
      NIGHTLY_DELTAS_NEAREST_SHIPPED: ${{ needs.published-build.outputs.track == 'nightly-next' && 'true' || '' }}
      # BinaryDelta peaks near 6 GB a delta; two at a time leave the mini's light work its memory.
      SPARKLE_DELTA_JOBS: 2
    steps:
      # Publication tooling at the workflow commit: it has the keyless mode even when the build commit predates
      # it, and it ships no source (only scripts/, into .publish-tooling).
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          filter: blob:none
          ref: ${{ github.sha }}
          path: .publish-tooling
          sparse-checkout: scripts
      # BinaryDelta runs with the Xcode the keyed job selects; the script reads .xcode-version and the pins from
      # its own checkout (cone mode keeps the root files).
      - name: Select Xcode
        run: ./.publish-tooling/scripts/select-ci-xcode.sh
      - *select-xcode-sdk
      # Why: docs/ci/nightly-workflow-notes.md#note-8
      - name: Download published variant (parallel)
        id: variant-parallel
        continue-on-error: true
        timeout-minutes: 10
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ needs.published-build.outputs.source_run || github.run_id }}
        run: python3 .publish-tooling/scripts/ci/download-run-artifact.py --name "cmux-nightly-variant-$NIGHTLY_VARIANT" --run-id "$SOURCE_RUN" --out "$RUNNER_TEMP/nightly-delta/input" --connections 32

      - name: Download published variant
        if: steps.variant-parallel.outcome != 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          run-id: ${{ needs.published-build.outputs.source_run || github.run_id }}
          github-token: ${{ needs.published-build.outputs.cross_run == 'true' && github.token || '' }}
          name: cmux-nightly-variant-${{ matrix.variant }}
          # Under the runner's temp directory: the checkout above cleans only .publish-tooling, and this
          # mini keeps its workspace between jobs.
          path: ${{ runner.temp }}/nightly-delta/input
      - name: Build the deltas without the key
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          feed="appcast.xml"
          if [ "$NIGHTLY_VARIANT" != "universal" ]; then
            feed="appcast-${NIGHTLY_VARIANT}.xml"
          fi
          ./.publish-tooling/scripts/ci/generate-nightly-deltas.sh \
            "$RUNNER_TEMP/nightly-delta/input/${CHANNEL_DMG_PREFIX}-${NIGHTLY_VARIANT}-${NIGHTLY_BUILD}.dmg" \
            "$RUNNER_TEMP/nightly-delta/input/$feed" nightly-delta/prebuilt
          rm -f nightly-delta/prebuilt/*.xml
          ls -l nightly-delta/prebuilt
      - name: Upload the prebuilt deltas
        id: upload-the-prebuilt-deltas
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-nightly-prebuilt-deltas-${{ matrix.variant }}
          path: nightly-delta/prebuilt/*.delta
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload the prebuilt deltas (retry)
        if: "!cancelled() && steps.upload-the-prebuilt-deltas.outcome == 'failure'"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-nightly-prebuilt-deltas-${{ matrix.variant }}
          path: nightly-delta/prebuilt/*.delta
          if-no-files-found: ignore
          retention-days: 1
          overwrite: true
      # Before the keyed job asks for the signer Mac; scripts/ci/nightly_deltas_yield.py. Two signers (ultra1, cmux15)
      # do not wait for the loop (a build may still wait; see the script); one-mini mode or NIGHTLY_NEXT_SIGNERS=1 waits.
      - name: Yield the signer Mac to the nightly-next build loop
        id: deltas-yield
        if: needs.published-build.outputs.track == 'nightly-next'
        continue-on-error: true
        timeout-minutes: 42
        env:
          NIGHTLY_NEXT_SIGNERS: ${{ vars.NIGHTLY_NEXT_SIGNERS || vars.CI_NIGHTLY_MINI != '' && '1' || '2' }}
        run: python3 .publish-tooling/scripts/ci/nightly_deltas_yield.py --repo "$GITHUB_REPOSITORY" --build "$NIGHTLY_BUILD" --feed "$NIGHTLY_NEXT_FEED_BASE/appcast-arm64.xml" --signers "$NIGHTLY_NEXT_SIGNERS"

  generate-nightly-deltas:
    # Delta work is deliberately downstream of the first publication. A slow
    # BinaryDelta process therefore cannot extend the user's wait for a full
    # DMG and signed appcast. The nightly-next track signs in release-next
    # with its own key, as build-sign-notarize-nightly does.
    environment: ${{ github.ref == 'refs/heads/nightly-next' && 'release-next' || 'release' }}
    needs: [published-build, build-nightly-deltas, pick-nightly-sign-runner]
    if: always() && needs.published-build.outputs.should_publish == 'true' && needs.published-build.outputs.fast_build != 'true' && needs.published-build.outputs.publish_result == 'success' && needs.published-build.outputs.publish_source != 'recovered' && needs.published-build.outputs.publish_refused != 'true' && vars.NIGHTLY_DELTAS != 'off' && needs.published-build.outputs.run_tail == 'true' && needs.build-nightly-deltas.outputs.skip != 'true'
    permissions:
      contents: read
      actions: read
    # Never Blacksmith (Lawrence, 2026-10-30). A Sparkle key: placed and held whole as the legacy sign. Optional:
    # a failed or refused delta never fails the run or holds the feed. NIGHTLY_DELTAS=off skips them.
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || vars.CI_NIGHTLY_MINI != '' && 'glaeda-trusted-next-signing' || needs.pick-nightly-sign-runner.outputs.attempt == github.run_attempt && needs.pick-nightly-sign-runner.outputs.sign_owned && fromJSON(needs.pick-nightly-sign-runner.outputs.sign_owned) || 'glaeda-trusted-next-signing' }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.published-build.outputs.variants) }}
    timeout-minutes: ${{ vars.CI_NIGHTLY_MINI != '' && 225 || 105 }}
    env:
      NIGHTLY_VARIANT: ${{ matrix.variant }}
      NIGHTLY_BUILD: ${{ needs.published-build.outputs.daemon_build }}
      CHANNEL: ${{ needs.published-build.outputs.channel }}
      CHANNEL_DMG_PREFIX: ${{ needs.published-build.outputs.dmg_prefix }}
      CHANNEL_RELEASE_TAG: ${{ needs.published-build.outputs.release_tag }}
      NIGHTLY_SPARKLE_KEY: ${{ vars.NIGHTLY_SPARKLE_KEY }}
      TRACK: ${{ needs.published-build.outputs.track }}
      NIGHTLY_DELTAS_NEAREST_SHIPPED: ${{ needs.published-build.outputs.track == 'nightly-next' && 'true' || '' }}
      # Every item starts on the new build's ring; republish-nightly-deltas
      # moves the ones whose canary passed back to Nightly.
      SPARKLE_CHANNEL: ${{ needs.published-build.outputs.track == 'nightly-next' && (vars.NIGHTLY_NEXT_DEV_RING == 'on' && 'cmux-next-dev' || 'cmux-next') || '' }}
    steps:
      - *hold-the-whole-mac

      # The kept clone remembers the last checkout's sparse mode. After the signer's pattern checkout
      # (core.sparseCheckout=true, no cone setting) git reads the cone request below as the one pattern
      # `scripts`, so the root .xcode-version stays out and Select Xcode fails here (runs 42819750253,
      # 42829570644: no deltas). The warm checkout's manual sparse test runs this step.
      - &forget-kept-sparse-mode
        name: Forget the kept clone's sparse-checkout mode
        if: runner.environment == 'self-hosted'
        shell: bash
        run: |
          ws="${GITHUB_WORKSPACE:-$PWD}"
          [ -d "$ws/.git" ] || exit 0
          for key in core.sparseCheckout core.sparseCheckoutCone index.sparse extensions.worktreeConfig; do
            git -C "$ws" config --local --unset-all "$key" 2>/dev/null || true
          done
          rm -f "$ws/.git/config.worktree" "$ws/.git/info/sparse-checkout"

      # Only scripts/ (and, by cone mode, the root .xcode-version) is read from it, so it is sparse: a full
      # clone took 96 s of the whole-Mac hold (run 42033609306, 14:11:49-14:13:25Z).
      - &legacy-route-shared-3
        name: Checkout build ref
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ needs.published-build.outputs.resolve_build_sha }}
          filter: blob:none
          sparse-checkout: |
            scripts

      # The wrapper comes from the workflow commit: the build checkout may predate it.
      # The publication-tooling shape test_nightly_cmux_tui_resolve.py exempts: scripts only.
      - &checkout-the-gh-token-wrapper
        name: Checkout the gh token wrapper at the workflow commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.sha }}
          path: .publish-tooling
          sparse-checkout: |
            scripts/ci/gh_app_token.sh
            scripts/ci/nightly-steps/release-notes-recheck-publication-head.sh
            scripts/ci/nightly-steps/release-notes-upload-to-r2.sh
            scripts/ci/nightly-steps/publish-lease.sh
            scripts/ci/nightly-next-guard.py
            scripts/ci/r2_cas.py
            scripts/ci/upload-r2-object.py
            scripts/ci/signing-runner-claim.sh
            scripts/ci/download-run-artifact.py
            scripts/ci/deadline_http.py
            .gitmodules
          sparse-checkout-cone-mode: false

      # The build ref may predate the hook list.
      - *claim-publication-mac

      - *gh-app-token-read

      - *gh-app-install-tooling

      - *wait-through-github-api-rate-l

      - *select-xcode
      - *select-xcode-sdk
      # Why: docs/ci/nightly-workflow-notes.md#note-8
      - name: Download published variant (parallel)
        id: variant-parallel
        continue-on-error: true
        timeout-minutes: 10
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ needs.published-build.outputs.source_run || github.run_id }}
        run: python3 .publish-tooling/scripts/ci/download-run-artifact.py --name "cmux-nightly-variant-$NIGHTLY_VARIANT" --run-id "$SOURCE_RUN" --out nightly-delta/input --connections 32

      - name: Download published variant
        if: steps.variant-parallel.outcome != 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          # From the run that published (the dispatched run's published-build names it).
          run-id: ${{ needs.published-build.outputs.source_run || github.run_id }}
          github-token: ${{ needs.published-build.outputs.cross_run == 'true' && github.token || '' }}
          name: cmux-nightly-variant-${{ matrix.variant }}
          path: nightly-delta/input

      # build-nightly-deltas' files; a missing one is built below, as before.
      - name: Download the prebuilt deltas
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cmux-nightly-prebuilt-deltas-${{ matrix.variant }}
          path: nightly-delta/prebuilt

      - name: Generate deltas and revised appcast
        env:
          GH_TOKEN: ${{ github.token }}
          SPARKLE_PREBUILT_DELTAS_DIR: nightly-delta/prebuilt
          # The nightly-next track gets only its own key; the others never see it.
          SHARED_SPARKLE_PRIVATE_KEY: ${{ needs.published-build.outputs.track != 'nightly-next' && secrets.SPARKLE_PRIVATE_KEY || '' }}
          NIGHTLY_SPARKLE_PRIVATE_KEY: ${{ needs.published-build.outputs.track != 'nightly-next' && secrets.NIGHTLY_SPARKLE_PRIVATE_KEY || '' }}
          NEXT_SPARKLE_PRIVATE_KEY: ${{ needs.published-build.outputs.track == 'nightly-next' && secrets.SPARKLE_NEXT_PRIVATE_KEY || '' }}
        run: |
          set -euo pipefail
          feed="appcast.xml"
          if [ "$NIGHTLY_VARIANT" != "universal" ]; then
            feed="appcast-${NIGHTLY_VARIANT}.xml"
          fi
          ./scripts/ci/generate-nightly-deltas.sh \
            "nightly-delta/input/${CHANNEL_DMG_PREFIX}-${NIGHTLY_VARIANT}-${NIGHTLY_BUILD}.dmg" \
            "nightly-delta/input/$feed" nightly-delta/output
          ls -l nightly-delta/output

      - name: Upload delta result
        id: upload-delta-result
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-nightly-deltas-${{ matrix.variant }}
          path: nightly-delta/output/*
          if-no-files-found: error
          retention-days: 3

      - name: Upload delta result (retry)
        if: "!cancelled() && steps.upload-delta-result.outcome == 'failure'"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-nightly-deltas-${{ matrix.variant }}
          path: nightly-delta/output/*
          if-no-files-found: error
          retention-days: 3
          overwrite: true

  republish-nightly-deltas:
    # Why: docs/ci/nightly-workflow-notes.md#note-5
    needs: [published-build, generate-nightly-deltas, pick-nightly-sign-runner]
    if: always() && needs.published-build.outputs.should_publish == 'true' && needs.published-build.outputs.fast_build != 'true' && needs.published-build.outputs.publish_result == 'success' && needs.published-build.outputs.publish_already_published != 'true' && vars.NIGHTLY_DELTAS != 'off' && needs.published-build.outputs.publish_refused != 'true' && needs.published-build.outputs.run_tail == 'true' && needs.generate-nightly-deltas.result != 'skipped'
    # Optional, as generate-nightly-deltas: the full DMG is already on the feed, so a missing or failed delta
    # never fails the run.
    continue-on-error: true
    environment: ${{ github.ref == 'refs/heads/nightly-next' && 'release-next' || 'release' }}
    concurrency:
      group: release-${{ needs.published-build.outputs.track == 'nightly-next' && 'deltas' || 'publish' }}-${{ needs.published-build.outputs.release_tag }}
      cancel-in-progress: false
    # Why: docs/ci/nightly-workflow-notes.md#note-47
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.ref != 'refs/heads/nightly-next' && 'cmux-gcp-nightly-jit-x64' || vars.CI_NIGHTLY_MINI_PUBLISHER == 'ubuntu-24.04' && 'cmux-gcp-nightly-jit-x64' || vars.CI_NIGHTLY_MINI != '' && 'glaeda-trusted-next-signing' || needs.pick-nightly-sign-runner.outputs.attempt == github.run_attempt && needs.pick-nightly-sign-runner.outputs.sign_owned_pool || 'glaeda-trusted-next-signing' }}
    # It holds the publish group, so a hang must not hold it for the default 6 h. nightly-next
    # makes no gh call here (deltas and feed go to R2) and took at most 1.3 minutes in 56 runs;
    # other tracks keep the default, as their release uploads may wait out the rate limit.
    # One-mini mode adds glaeda's capacity wait (tests/test_nightly_mini_gate_timeouts.py).
    timeout-minutes: ${{ vars.CI_NIGHTLY_MINI != '' && needs.published-build.outputs.track == 'nightly-next' && 135 || needs.published-build.outputs.track == 'nightly-next' && 15 || 360 }}
    permissions:
      contents: write
      actions: read
    env:
      CHANNEL_RELEASE_TAG: ${{ needs.published-build.outputs.release_tag }}
      CHANNEL_FEED_BASE: ${{ needs.published-build.outputs.feed_base }}
      NIGHTLY_BUILD: ${{ needs.published-build.outputs.daemon_build }}
      CHANNEL_DMG_PREFIX: ${{ needs.published-build.outputs.dmg_prefix }}
    steps:
      # First, before any checkout or secret: the whole mini (glaeda's exclusive class), as the signing jobs.
      - *hold-the-whole-mac
      - *clean-owned-workdir
      - *forget-kept-sparse-mode
      - *legacy-route-shared-3
      - name: Checkout publication tooling at the workflow commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: .publish-tooling
          sparse-checkout: |
            scripts/ci/nightly_next_ring.py
            scripts/ci/nightly-next-guard.py
            scripts/ci/publish-release-assets.py
            scripts/ci/gh_budget_wait.sh
            scripts/ci/publish-nightly-next-r2.py
            scripts/ci/nightly_next_delta_check.py
            scripts/ci/deadline_http.py
            scripts/ci/upload-r2-object.py
            scripts/ci/gh_app_token.sh
            scripts/ci/nightly_next_dev_ring.sh
            scripts/ci/nightly-steps/publish-next-feed-keep-nightly.sh
            scripts/ci/nightly-steps/republish-deltas-and-appcasts.sh
            scripts/ci/nightly-steps/republish-deltas-upload-appcasts.sh
            scripts/ci/nightly-steps/republish-deltas-upload-next-appcasts.sh
            scripts/ci/signing-runner-claim.sh
            .gitmodules
          sparse-checkout-cone-mode: false

      # Before any release App secret: the claim again, and a keychain a killed job left is removed.
      - *claim-publication-mac

      - *gh-app-token-write

      - *gh-app-install-tooling

      - name: Wait through GitHub API rate limits in this job's gh calls
        # scripts/ci/gh_budget_wait.sh puts a gh first on PATH that waits for the shared budget's
        # reset (at most an hour per job, each wait logged) when a call is refused for the rate
        # limit, instead of failing the publish path. timeout-minutes leaves room for that hour.
        run: bash .publish-tooling/scripts/ci/gh_budget_wait.sh --install

      # The release App with every permission it has (Variables: read); the job's other App token
      # is contents-only. A failed mint leaves it empty, and the ring reads off.
      - name: Mint the release App token that reads the Dev ring switch
        id: ring-token
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.CMUX_RELEASE_APP_ID }}
          private-key: ${{ secrets.CMUX_RELEASE_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Read the Dev ring switch live
        id: ring
        env:
          RING_TOKEN: ${{ steps.ring-token.outputs.token }}
        run: bash .publish-tooling/scripts/ci/nightly_next_dev_ring.sh --github-output "$GITHUB_OUTPUT"

      - name: Download delta results
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: cmux-nightly-deltas-*
          path: nightly-deltas
          merge-multiple: true

      - name: Republish deltas and revised appcasts
        id: republish
        env:
          GH_TOKEN: ${{ github.token }}
          CMUX_RELEASE_RATE_LIMIT_SECONDS: "1800"
          GH_APP_TOKEN: ${{ steps.gh-app-token.outputs.token }} # the uploader: App first, GH_TOKEN as fallback
          TRACK: ${{ needs.published-build.outputs.track }}
          DEV_RING: ${{ steps.ring.outputs.mode || 'off' }}
          RESOLVE_BUILD_SHA: ${{ needs.published-build.outputs.resolve_build_sha }}
        run: bash .publish-tooling/scripts/ci/nightly-steps/republish-deltas-and-appcasts.sh

      - name: Upload revised appcasts to R2
        if: steps.republish.outputs.publish == 'true' && needs.published-build.outputs.track != 'nightly-next'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: "https://${{ secrets.CF_R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
        run: bash .publish-tooling/scripts/ci/nightly-steps/republish-deltas-upload-appcasts.sh

      - name: Upload revised nightly-next appcasts to R2
        if: steps.republish.outputs.publish == 'true' && needs.published-build.outputs.track == 'nightly-next'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.NIGHTLY_NEXT_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.NIGHTLY_NEXT_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: "https://${{ secrets.NIGHTLY_NEXT_R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
        run: bash .publish-tooling/scripts/ci/nightly-steps/republish-deltas-upload-next-appcasts.sh

      - *wipe-owned-credentials

  # The signer Mac for this run's nightly-next-one, one build per Mac. Why: docs/ci/nightly-workflow-notes.md#note-33
  pick-nightly-next-signer:
    needs: [decide, resolve-nightly-cmux-tui-client]
    if: "!cancelled() && github.repository == 'manaflow-ai/cmux' && vars.NIGHTLY_NEXT_SLOTS == '2' && vars.CI_NIGHTLY_MINI == '' && github.ref == 'refs/heads/nightly-next' && (github.event_name == 'push' || inputs.nightly_next_loop_retry != '') && needs.decide.result == 'success' && needs.decide.outputs.one_job == 'true' && needs.resolve-nightly-cmux-tui-client.result == 'success' && needs.resolve-nightly-cmux-tui-client.outputs.already_published != 'true' && needs.resolve-nightly-cmux-tui-client.outputs.superseded != 'true'"
    # Any failure leaves the outputs empty: nightly-next-one then takes the signer label alone and cmux15's group.
    continue-on-error: true
    # No secret and no signing key: decide's runner.
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.CI_NIGHTLY_MINI != '' && vars.CI_NIGHTLY_MINI || vars.CI_NIGHTLY_ONLY_RUNNER || 'glaeda-nightly-only-m4pro' }}
    timeout-minutes: 3
    permissions:
      actions: read
      contents: read
    outputs:
      # cmux15 or ultra1 (nightly-next-one's group, nightly-next-one-push-<host>).
      host: ${{ steps.pick.outputs.host }}
      # The JSON runs-on array; it always starts with the literal glaeda-trusted-next-signing.
      pin: ${{ steps.pick.outputs.pin }}
      attempt: ${{ github.run_attempt }}
    steps:
      - name: Checkout pick tooling at the workflow commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: .publish-tooling
          sparse-checkout: scripts/ci

      # The glaeda-route App's read-only token, as decide mints it on the same runner: its own hourly budget. With
      # github.token alone the shared budget ran dry and the pick fell back to cmux15 (run 45575194160: HTTP 403), so
      # a second build waited 10.5 min behind the first. Optional: the pick falls back to github.token without it.
      - name: Mint a spare read token for the pick
        id: pick-spare-token
        if: vars.GLAEDA_ROUTE_APP_ID != '' && github.ref == 'refs/heads/nightly-next'
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.GLAEDA_ROUTE_APP_ID }}
          private-key: ${{ secrets.GLAEDA_ROUTE_APP_KEY }}
          permission-contents: read
          permission-actions: read

      - name: Pick an idle signer Mac, else the one whose build ends soonest
        id: pick
        continue-on-error: true
        timeout-minutes: 2
        env:
          CI_RUNNER_STATE: ${{ vars.CI_RUNNER_STATE }}
          SPARE_READ_TOKEN: ${{ steps.pick-spare-token.outputs.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .publish-tooling/scripts/ci/nightly_next_signer_pick.py

  # RFD 0134 cut 2: the nightly-next app as a .pkg whose postinstall pre-warms a first install. Optional, never
  # fails the run (next-pkg.sh exits 0); NIGHTLY_NEXT_PKG=off skips it. A certificate with no Installer identity
  # builds nothing and says so.
  nightly-next-pkg:
    environment: release-next
    needs: [published-build, pick-nightly-sign-runner]
    if: "!cancelled() && needs.published-build.outputs.track == 'nightly-next' && needs.published-build.outputs.should_publish == 'true' && needs.published-build.outputs.fast_build != 'true' && needs.published-build.outputs.publish_result == 'success' && needs.published-build.outputs.publish_source != 'recovered' && needs.published-build.outputs.publish_refused != 'true' && vars.NIGHTLY_NEXT_PKG != 'off' && needs.published-build.outputs.run_tail == 'true'"
    permissions:
      contents: read
      actions: read
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || vars.CI_NIGHTLY_MINI != '' && 'glaeda-trusted-next-signing' || needs.pick-nightly-sign-runner.outputs.attempt == github.run_attempt && needs.pick-nightly-sign-runner.outputs.sign_owned && fromJSON(needs.pick-nightly-sign-runner.outputs.sign_owned) || 'glaeda-trusted-next-signing' }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.published-build.outputs.variants) }}
    timeout-minutes: 60
    env:
      NIGHTLY_VARIANT: ${{ matrix.variant }}
      NIGHTLY_BUILD: ${{ needs.published-build.outputs.daemon_build }}
      CHANNEL_DMG_PREFIX: ${{ needs.published-build.outputs.dmg_prefix }}
    steps:
      - *hold-the-whole-mac
      - *forget-kept-sparse-mode
      - *legacy-route-shared-3
      - *checkout-the-gh-token-wrapper
      - *claim-publication-mac
      - *gh-app-token-read
      - *gh-app-install-tooling
      - *wait-through-github-api-rate-l
      - *select-xcode
      - *select-xcode-sdk
      - name: Download published variant
        continue-on-error: true
        timeout-minutes: 10
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ needs.published-build.outputs.source_run || github.run_id }}
        run: python3 .publish-tooling/scripts/ci/download-run-artifact.py --name "cmux-nightly-variant-$NIGHTLY_VARIANT" --run-id "$SOURCE_RUN" --out nightly-pkg/input --connections 32
      # From the build ref: build-pkg.sh and the postinstall match the app they package.
      - name: Build, sign, notarize and upload the pre-warming .pkg
        timeout-minutes: 50
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          AWS_ACCESS_KEY_ID: ${{ secrets.NIGHTLY_NEXT_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.NIGHTLY_NEXT_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: https://${{ secrets.NIGHTLY_NEXT_R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          s=scripts/ci/nightly-steps/next-pkg.sh
          [ -f "$s" ] || { echo "next-pkg: the build ref predates $s; no package"; exit 0; }
          bash "$s" "nightly-pkg/input/${CHANNEL_DMG_PREFIX}-${NIGHTLY_VARIANT}-${NIGHTLY_BUILD}.dmg" nightly-pkg/output

      - name: Cleanup keychain
        if: always()
        run: ./scripts/ci/signing-keychain.sh delete --keychain build.keychain \
          || security delete-keychain build.keychain >/dev/null 2>&1 || true

  # nightly-next on one Mac, end to end. Why: docs/ci/nightly-workflow-notes.md#note-18
  nightly-next-one:
    needs: [decide, resolve-nightly-cmux-tui-client, pick-nightly-next-signer, early-nightly-webviews]
    if: "!cancelled() && needs.decide.result == 'success' && needs.decide.outputs.one_job == 'true' && needs.resolve-nightly-cmux-tui-client.result == 'success' && needs.resolve-nightly-cmux-tui-client.outputs.already_published != 'true' && needs.resolve-nightly-cmux-tui-client.outputs.superseded != 'true' && (needs.early-nightly-webviews.outputs.red_sha == '' || needs.early-nightly-webviews.outputs.red_sha != needs.resolve-nightly-cmux-tui-client.outputs.build_sha)"
    environment: ${{ needs.decide.outputs.environment }}
    # The push slot, one per signer Mac, never cancelled. Why: docs/ci/nightly-workflow-notes.md#note-19, #note-33
    concurrency:
      group: ${{ github.ref == 'refs/heads/nightly-next' && (github.event_name == 'push' || inputs.nightly_next_loop_retry != '') && (vars.NIGHTLY_NEXT_SLOTS == '2' && vars.CI_NIGHTLY_MINI == '' && format('nightly-next-one-push-{0}', needs.pick-nightly-next-signer.outputs.attempt == github.run_attempt && needs.pick-nightly-next-signer.outputs.host || 'cmux15') || 'nightly-next-one-push') || format('nightly-next-one-{0}', github.run_id) }}
      cancel-in-progress: false
    # The signer label, a literal (one-mini mode too): no variable picks where signing secrets go. The pick only
    # narrows it to one signer runner; its pin always starts with the label. Why: docs/ci/nightly-workflow-notes.md#note-33
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || vars.CI_NIGHTLY_MINI != '' && 'glaeda-trusted-next-signing' || needs.pick-nightly-next-signer.outputs.attempt == github.run_attempt && needs.pick-nightly-next-signer.outputs.pin && fromJSON(needs.pick-nightly-next-signer.outputs.pin) || 'glaeda-trusted-next-signing' }}
    # Build, sign, notarize (40m wait), then the publish lease's 60m wait.
    timeout-minutes: 300
    permissions:
      contents: write
      # The tick ask at notarization. Why: docs/ci/nightly-workflow-notes.md#note-26
      actions: write
      pull-requests: read
      attestations: write
      id-token: write
    outputs:
      daemon_build: ${{ steps.remote_daemon.outputs.build }}
      daemon_version: ${{ steps.remote_daemon.outputs.version }}
      tag_status: ${{ steps.tag-outcome.outputs.tag_status }}
      source: ${{ steps.source.outputs.source }}
      build: ${{ steps.source.outputs.build }}
      build_sha: ${{ steps.source.outputs.build_sha }}
      lint_report: ${{ steps.lint.outputs.lint_report }}
      fixit_nofix: ${{ steps.fixit-nofix.outputs.nofix }}
      webview_red: ${{ vars.NIGHTLY_COMPONENT_GATES == 'block' && steps.webview-checks.outcome == 'failure' }}
      # A red compile on this tree: the retry rebuilds the same tree (45556730650: 1 h of the slot); the next push restarts the loop.
      compile_red: ${{ steps.chief-build.outcome == 'failure' || steps.mobile-host-build.outcome == 'failure' || steps.app-release-build.outcome == 'failure' || steps.chief-bundle.outcome == 'failure' }}
      already_published: ${{ steps.recheck.outputs.already_published == 'true' || steps.gate.outputs.refused == 'true' }}
      refused: ${{ steps.gate.outputs.refused == 'true' || steps.recheck.outputs.superseded == 'true' || steps.upload_next_appcasts.outputs.publication_refused == 'true' }}
      refusal_reason: ${{ steps.gate.outputs.refusal_reason }}
      variant_pattern: ${{ steps.source.outputs.variant_pattern }}
      tested_pattern: ${{ steps.source.outputs.tested_pattern }}
      source_archive: ${{ steps.source.outputs.source_archive }}
      tip_sha: ${{ steps.source.outputs.tip_sha }}
      behind: ${{ steps.source.outputs.behind }}
      behind_hours: ${{ steps.source.outputs.behind_hours }}
      downloads: ${{ steps.notes.outputs.downloads }}
      published_sha: ${{ steps.notes.outputs.published_sha }}
      feed_written: ${{ steps.upload_next_appcasts.outputs.feed_written }}
      feed_check: ${{ steps.feedcheck.outcome }}
      left: ${{ steps.one-leave.outputs.superseded }}
      # Left before nightly-next moved: wake-nightly-next-tick retries this commit unless it moves.
      left_pending: ${{ steps.one-leave.outputs.pending }}
    env:
      CMUX_CI_XCODE_APP: ${{ vars.CMUX_CI_XCODE_APP_MACOS_26 }}
      CMUX_CI_REQUIRED_MACOS_SDK_MAJOR: "26"
      # Warm in one tree per Mac under $HOME, by flag (nightly_build_state.py); no shared compiler store or host root.
      CMUX_NIGHTLY_KEEP_STATE: "1"
      # A cold 54 MB Zig transfer on the signer can take over 8 minutes (run 45512239356).
      ZIG_DOWNLOAD_BUDGET_SECONDS: "1800"
      ZIG_DOWNLOAD_ATTEMPTS: "8"
      CMUX_CI_FLEET_CACHE_OFF: "1"
      NIGHTLY_FAST_BUILD: ${{ needs.decide.outputs.fast_build }}
      NIGHTLY_COMPILE_ARCHS: ${{ needs.decide.outputs.compile_archs }}
      CHANNEL_ICON_NAME: ${{ needs.decide.outputs.icon_name }}
      NIGHTLY_VARIANT: arm64
      BUNDLE_REMOTE_DAEMON_ASSETS: ${{ needs.decide.outputs.fast_build == 'true' || needs.decide.outputs.should_publish != 'true' }}
      CHANNEL: ${{ needs.decide.outputs.channel }}
      SIGN_CHANNEL: ${{ needs.decide.outputs.sign_channel }}
      TRACK: ${{ needs.decide.outputs.track }}
      CHANNEL_BUNDLE_ID: ${{ needs.decide.outputs.bundle_id }}
      CHANNEL_APP_NAME: ${{ needs.decide.outputs.app_name }}
      CHANNEL_URL_SCHEME: ${{ needs.decide.outputs.url_scheme }}
      CHANNEL_DMG_PREFIX: ${{ needs.decide.outputs.dmg_prefix }}
      CHANNEL_RELEASE_TAG: ${{ needs.decide.outputs.release_tag }}
      CHANNEL_FEED_BASE: ${{ needs.decide.outputs.feed_base }}
      CHANNEL_ENTITLEMENTS: ${{ needs.decide.outputs.entitlements }}
      NIGHTLY_LEGACY_VARIANT: ${{ needs.decide.outputs.legacy_variant }}
      NIGHTLY_FEEDS: ${{ needs.decide.outputs.feeds }}
      NIGHTLY_TRACK: ${{ needs.decide.outputs.track }}
      PUBLISH_TOOLING: *pub-tooling
      # Unset (default): the webview checks and the iPhone host fall back and publish with a stale-part note.
      NIGHTLY_COMPONENT_GATES: ${{ vars.NIGHTLY_COMPONENT_GATES }}
    steps:
      - *hold-the-whole-mac
      - *clear-stale-git-locks-self-hos-2
      - *x8
      - *x9
      - *checkout-publication-tooling-a
      - *claim-publication-mac
      # Before the leave step's gh calls (tests/test_publish_app_token_workflow.py).
      - *x12
      # Latest wins at the slot too, with no wait on this Mac: it asks main's tick and leaves; bounded gh calls,
      # never a rate-limit wait. Why: docs/ci/nightly-workflow-notes.md#note-16
      - name: Leave the push slot to a newer nightly-next push
        id: one-leave
        if: github.ref == 'refs/heads/nightly-next' && (github.event_name == 'push' || inputs.nightly_next_loop_retry != '')
        env:
          GH_TOKEN: ${{ github.token }}
          TIP_SHA: ${{ needs.resolve-nightly-cmux-tui-client.outputs.tip_sha }}
          REPOSITORY: ${{ github.repository }}
          LOOP_RETRY: ${{ inputs.nightly_next_loop_retry }}
          SUPERSEDE_SKIP: ${{ vars.NIGHTLY_NEXT_SUPERSEDE_SKIP }}
          IN_SLOT: 1
          GH_BUDGET_WAIT_MAX_SECONDS: "0"
        run: bash "$PUBLISH_TOOLING/ci/nightly-steps/resolve-leave-build-slot.sh"
      - name: Point the signing steps at the build products
        if: ${{ !env.LEFT_SLOT }}
        env:
          VARIANTS: ${{ needs.decide.outputs.variants }}
          APP_NAME: ${{ needs.decide.outputs.app_name }}
        run: bash "$PUBLISH_TOOLING/ci/nightly-steps/one-job.sh" paths
      - *x55
      - *x10
      - *select-xcode-sdk-unless-resumed
      - *x11
      - *x13
      - *x1
      - *x2
      # Why: docs/ci/nightly-workflow-notes.md#note-15
      - name: Read whether the kept Zig package cache is complete
        id: zig-kept
        if: inputs.nightly_next_unsigned_run == '' && !env.LEFT_SLOT
        env: {KEY: *zig-key}
        run: bash scripts/ci/nightly-steps/zig-cache-kept.sh check
      - name: Cache Zig packages
        if: inputs.nightly_next_unsigned_run == '' && steps.zig-kept.outputs.kept != 'true' && !env.LEFT_SLOT
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with: *zig-cache
      - name: Key the Ghostty CLI helper cache
        id: helper-cache-key
        if: steps.reuse.outputs.hit != 'true' && !env.LEFT_SLOT
        run: bash scripts/ci/nightly-steps/helper-cache-key.sh
      - name: Cache the Ghostty CLI helper
        id: helper-cache
        if: steps.reuse.outputs.hit != 'true' && !env.LEFT_SLOT
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/Library/Caches/cmux/ghostty-cli-helper
          key: ${{ steps.helper-cache-key.outputs.key }}
      - name: Build Ghostty CLI helper
        if: steps.reuse.outputs.hit != 'true' && !env.LEFT_SLOT
        env:
          HELPER_CACHE_HIT: ${{ steps.helper-cache.outputs.cache-hit }}
        run: bash scripts/ci/nightly-steps/helper-build.sh && strip -S -x nightly-helper/ghostty
