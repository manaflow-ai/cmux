          SHARED_SPARKLE_PRIVATE_KEY: ${{ needs.decide.outputs.track != 'nightly-next' && secrets.SPARKLE_PRIVATE_KEY || '' }}
          NIGHTLY_SPARKLE_PRIVATE_KEY: ${{ needs.decide.outputs.track != 'nightly-next' && secrets.NIGHTLY_SPARKLE_PRIVATE_KEY || '' }}
          NEXT_SPARKLE_PRIVATE_KEY: ${{ needs.decide.outputs.track == 'nightly-next' && secrets.SPARKLE_NEXT_PRIVATE_KEY || '' }}
          # cmux-next items carry a release-ring sparkle:channel, which only
          # cmux-next builds allow; every other build ignores them. With
          # NIGHTLY_NEXT_DEV_RING=on a new build starts on Dev (cmux-next-dev)
          # and moves to Nightly (cmux-next) on a canary pass
          # (scripts/ci/nightly_next_ring.py, nightly-next-verdict.yml).
          SPARKLE_CHANNEL: ${{ needs.decide.outputs.track == 'nightly-next' && (vars.NIGHTLY_NEXT_DEV_RING == 'on' && 'cmux-next-dev' || 'cmux-next') || '' }}
          # nightly-next-one writes the item full-only and builds the deltas after the feed. Why: docs/ci/nightly-workflow-notes.md#note-31
          NIGHTLY_NEXT_DELTAS_AFTER_FEED: ${{ needs.decide.outputs.one_job == 'true' && needs.decide.outputs.track == 'nightly-next' && 'true' || '' }}
        run: |
          set -euo pipefail
          SPARKLE_PRIVATE_KEY="$(./scripts/ci/nightly-sparkle-key.sh)"
          export SPARKLE_PRIVATE_KEY
          # The new item carries the bundle's macOS floor (14.0 for cmux-next since 2026-10-13),
          # so older macOS keeps the previous (legacy) items still in the feed.
          SPARKLE_MINIMUM_SYSTEM_VERSION="$(python3 scripts/ci/appcast_minimum_system_version.py floor "$CHANNEL_APP_PATH")"
          export SPARKLE_MINIMUM_SYSTEM_VERSION
          # nightly-next ships the deltas from its nearest earlier builds with the build itself (hq#13299).
          # A build tree from before it has no script: that build publishes full-only, as before.
          if [ "$TRACK" = nightly-next ] && [ -f scripts/ci/nightly-steps/appcast-with-nearest-deltas.sh ]; then
            bash scripts/ci/nightly-steps/appcast-with-nearest-deltas.sh
            exit 0
          fi
          SPARKLE_DELTA_NAME_PREFIX="${CHANNEL_DMG_PREFIX}-${NIGHTLY_VARIANT}-" \
            ./scripts/sparkle_generate_appcast.sh "$NIGHTLY_DMG_IMMUTABLE" "$CHANNEL_RELEASE_TAG" "$NIGHTLY_APPCAST"
          ls -l "$NIGHTLY_DMG_IMMUTABLE" "$NIGHTLY_DMG_RELEASE" "$NIGHTLY_APPCAST"
          if grep -q 'sparkle:deltas' "$NIGHTLY_APPCAST"; then
            echo "ERROR: first publication appcasts must contain full archives only" >&2
            exit 1
          fi


      - name: Upload nightly variant artifacts
        id: upload-nightly-variant-artifacts
        continue-on-error: true
        if: needs.decide.outputs.fast_build != 'true' && needs.decide.outputs.notary_paused != 'true' && steps.notarize-nightly.outputs.submission_pending != 'true' && needs.decide.outputs.notary_test != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-nightly-variant-${{ matrix.variant }}
          path: |
            ${{ needs.decide.outputs.dmg_prefix }}-*.dmg
            ${{ needs.decide.outputs.dmg_prefix }}-*.delta
            appcast*.xml
          if-no-files-found: error
          retention-days: 3
          overwrite: true

      - name: Upload nightly variant artifacts (retry)
        if: "!cancelled() && steps.upload-nightly-variant-artifacts.outcome == 'failure' && (needs.decide.outputs.fast_build != 'true' && needs.decide.outputs.notary_paused != 'true' && steps.notarize-nightly.outputs.submission_pending != 'true' && needs.decide.outputs.notary_test != 'true')"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-nightly-variant-${{ matrix.variant }}
          path: |
            ${{ needs.decide.outputs.dmg_prefix }}-*.dmg
            ${{ needs.decide.outputs.dmg_prefix }}-*.delta
            appcast*.xml
          if-no-files-found: error
          retention-days: 3
          overwrite: true


      - name: Upload fast arm64 dogfood artifact
        id: upload-fast-arm64-dogfood-artifact
        continue-on-error: true
        if: needs.decide.outputs.fast_build == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-nightly-fast-${{ needs.resolve-nightly-cmux-tui-client.outputs.build_short_sha }}
          overwrite: true
          path: |
            ${{ needs.decide.outputs.dmg_prefix }}-arm64.dmg
            ${{ needs.decide.outputs.dmg_prefix }}-arm64-*.dmg
            remote-daemon-assets/cmuxd-remote-*
          if-no-files-found: error
          retention-days: 3

      - name: Upload fast arm64 dogfood artifact (retry)
        if: "!cancelled() && steps.upload-fast-arm64-dogfood-artifact.outcome == 'failure' && (needs.decide.outputs.fast_build == 'true')"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-nightly-fast-${{ needs.resolve-nightly-cmux-tui-client.outputs.build_short_sha }}
          path: |
            ${{ needs.decide.outputs.dmg_prefix }}-arm64.dmg
            ${{ needs.decide.outputs.dmg_prefix }}-arm64-*.dmg
            remote-daemon-assets/cmuxd-remote-*
          if-no-files-found: error
          retention-days: 3
          overwrite: true


      # cx-f58x: text receipts only (notary-test-receipt.sh).
      - name: Write notary test receipt
        id: notary-receipt
        if: always() && needs.decide.outputs.notary_test == 'true' && steps.notarize-nightly.outcome != 'skipped'
        env:
          IMPORT_VARIANT: ${{ needs.decide.outputs.import_variant }}
          SWIFT_IMPORT_FLAGS: ${{ needs.decide.outputs.swift_import_flags }}
          EMPTY_BROWSER_SOURCES: ${{ needs.decide.outputs.empty_browser_sources }}
          NOTARY_PROBE: ${{ needs.decide.outputs.notary_probe }}
          NOTARIZE_OUTCOME: ${{ steps.notarize-nightly.outcome }}
          BUILD_SHA: ${{ needs.resolve-nightly-cmux-tui-client.outputs.build_sha }}
        # An unsigned resume of an older tree may predate the script: the workflow commit's copy.
        run: s=scripts/ci/nightly-steps/notary-test-receipt.sh; [ -f "$s" ] || s=".nightly-signing-control/$s"; bash "$s"


      - name: Upload notary test receipt
        id: upload-notary-test-receipt
        continue-on-error: true
        if: always() && steps.notary-receipt.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-notary-test-receipt-${{ needs.decide.outputs.import_variant }}-${{ needs.resolve-nightly-cmux-tui-client.outputs.build_short_sha }}
          overwrite: true
          path: notary-receipt/
          if-no-files-found: error
          retention-days: 7

      - name: Upload notary test receipt (retry)
        if: "!cancelled() && steps.upload-notary-test-receipt.outcome == 'failure' && (always() && steps.notary-receipt.outcome == 'success')"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-notary-test-receipt-${{ needs.decide.outputs.import_variant }}-${{ needs.resolve-nightly-cmux-tui-client.outputs.build_short_sha }}
          path: notary-receipt/
          if-no-files-found: error
          retention-days: 7
          overwrite: true


      - &x72
        name: Cleanup keychain
        if: always()
        run: |
          ./scripts/ci/signing-keychain.sh delete --keychain build.keychain \
            || security delete-keychain build.keychain >/dev/null 2>&1 || true
          rm -f /tmp/cert.p12

  verify-signed-nightly:
    name: Verify signed nightly app (${{ matrix.variant }})
    # No environment and no secrets: this job verifies the signed app's static
    # artifacts and sidecar (#21024). Runtime behavior is covered by the
    # path-routed daemon/app integration lane. publish-nightly publishes this
    # run's build only when both verification jobs passed.
    needs: [decide, build-nightly-app, resolve-nightly-cmux-tui-client, build-sign-notarize-nightly, pick-nightly-sign-runner]
    # The macOS signer's app.
    if: "!cancelled() && needs.build-sign-notarize-nightly.result == 'success' && needs.decide.outputs.notary_test != 'true' && needs.decide.outputs.import_paused != 'true'"
    # actions:read lets a sign stage's parallel download of the signed app resolve the blob URL.
    permissions:
      contents: read
      actions: read
    # A failed-jobs rerun retains an older picker. Rejoin the fleet pool, never
    # that old runner choice, once; later attempts use the Blacksmith overflow.
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || vars.CI_NIGHTLY_MINI != '' && vars.CI_NIGHTLY_MINI || needs.pick-nightly-sign-runner.outputs.attempt == github.run_attempt && needs.pick-nightly-sign-runner.outputs.owned || vars.CI_NIGHTLY_NEXT_BUILD_RUNNER || 'glaeda-nightly-std-xcode-26.6' }}
    timeout-minutes: ${{ vars.CI_NIGHTLY_MINI != '' && 160 || 40 }}
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.decide.outputs.variants) }}
    env:
      # Set only when the 6 h stapled-app fallback shipped the first DMG.
      STAPLED_APP_FALLBACK_ID: ${{ needs.build-sign-notarize-nightly.outputs.stapled_app_fallback_id }}
      # An owned Mac has the PR lane's Xcode pin (as DEV's verify); Blacksmith the macOS 26 one.
      CMUX_CI_XCODE_APP: ${{ needs.pick-nightly-sign-runner.outputs.attempt == github.run_attempt && needs.pick-nightly-sign-runner.outputs.owned != '' && vars.CMUX_CI_XCODE_APP_PR || vars.CMUX_CI_XCODE_APP_MACOS_26 }}
      CMUX_CI_REQUIRED_MACOS_SDK_MAJOR: "26"
      NIGHTLY_VARIANT: ${{ matrix.variant }}
      NIGHTLY_BUILD: ${{ needs.build-nightly-app.outputs.daemon_build }}
      BUNDLE_REMOTE_DAEMON_ASSETS: ${{ needs.decide.outputs.fast_build == 'true' || needs.decide.outputs.should_publish != 'true' }}
      CHANNEL: ${{ needs.decide.outputs.channel }}
      SIGN_CHANNEL: ${{ needs.decide.outputs.sign_channel }}
      TRACK: ${{ needs.decide.outputs.track }}
      CHANNEL_DMG_PREFIX: ${{ needs.decide.outputs.dmg_prefix }}
      CHANNEL_RELEASE_TAG: ${{ needs.decide.outputs.release_tag }}
      CHANNEL_APP_PATH: signed/${{ needs.decide.outputs.app_name }}.app
      CHANNEL_ENTITLEMENTS: ${{ needs.decide.outputs.entitlements }}
    steps:
      - *checkout-build-ref

      # nightly-next's license check reads ghostty-next/build.zig.zon.
      - *legacy-route-shared-5
      - *select-xcode
      - *select-xcode-sdk

      - name: Download signed app
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: cmux-${{ needs.decide.outputs.channel }}-signed-app-${{ matrix.variant }}-${{ needs.resolve-nightly-cmux-tui-client.outputs.build_short_sha }}
          path: signed-app-handoff

      - *download-ssh-daemon-assets-2

      - &x73
        name: Restore signed app
        if: ${{ !env.LEFT_SLOT }}
        run: |
          set -euo pipefail
          (cd signed-app-handoff && shasum -a 256 -c cmux-signed-app.tar.gz.sha256)
          mkdir -p signed
          tar -C signed -xzf signed-app-handoff/cmux-signed-app.tar.gz
          test -d "$CHANNEL_APP_PATH"
          /usr/bin/codesign --verify --deep --strict --verbose=2 "$CHANNEL_APP_PATH"

      # cmux-next: the app's CFBundleShortVersionString and every bundled
      # CLI's `--version` say the cmux-next version (cmux-tui/Cargo.toml
      # [workspace.package]); a 0.1.0 `cmux` inside a 1.0.0 app fails here.
      - &x74
        name: Verify version surfaces
        if: env.TRACK == 'nightly-next' && !env.LEFT_SLOT
        run: ./scripts/cmux-next/check-version-surfaces.sh "$CHANNEL_APP_PATH"

      # The same restore for a job with no prepare reuse step: only the tree's age decides.
      - &older-tree-step-scripts-plain
        name: Add the workflow commit's new step scripts to an older build tree
        if: hashFiles('scripts/ci/nightly-steps/prepare-thin-bundle.sh') == ''
        run: |
          for try in 1 2 3; do git -c http.lowSpeedLimit=1000 -c http.lowSpeedTime=120 fetch -q --no-tags --depth=1 origin "$GITHUB_SHA" && break; [ "$try" != 3 ] || exit 1; sleep $((try * 10)); done
          git diff --name-only --diff-filter=A HEAD FETCH_HEAD -- scripts/ci/nightly-steps | while read -r f; do git checkout FETCH_HEAD -- "$f"; done
      - &x75
        name: Verify bundled CLI commands run from the bundle alone
        if: env.TRACK == 'nightly-next' && hashFiles('scripts/cmux-next/check-bundled-cli-commands.sh') != '' && !env.LEFT_SLOT
        run: bash scripts/ci/nightly-steps/verify-signed-bundled-cli-commands.sh



      - &x76
        name: Verify signed diff sidecar protocol contract
        if: ${{ !env.LEFT_SLOT }}
        run: bash scripts/ci/nightly-steps/verify-signed-diff-sidecar-contract.sh

      # The post-sign checks of sign-cmux-bundle.sh (entitlements, helpers,
      # browser host) on this signed app whichever signer made it.
      # A build commit older than these checks has none to run.
      - &x77
        name: Verify signed app entitlements
        if: hashFiles('scripts/ci/nightly-steps/verify-signed-app-checks.sh') != '' && !env.LEFT_SLOT
        run: bash scripts/ci/nightly-steps/verify-signed-app-checks.sh


      - &x78
        name: Run bundled Ghostty theme picker helper regression
        if: ${{ !env.LEFT_SLOT }}
        run: CMUX_APP_PATH="$CHANNEL_APP_PATH" ./tests/test_bundled_ghostty_theme_picker_helper.sh


      - &x79
        name: Verify signed app SSH daemon contract
        if: ${{ !env.LEFT_SLOT }}
        run: bash -e scripts/ci/nightly-steps/verify-signed-ssh-daemon-contract.sh




  verify-final-dmg-nightly:
    name: Verify final nightly DMG (${{ matrix.variant }})
    # The final-DMG half of verify-signed-nightly, on its own runner so the two
    # halves run at the same time (each statically verifies an artifact with the same bundle
    # id, so they cannot share one runner). No environment and no secrets:
    # this job statically verifies the final DMG (#21024). publish-nightly
    # publishes this run's build only when both jobs passed, and only the DMG
    # bytes this job verified.
    needs: [decide, build-nightly-app, resolve-nightly-cmux-tui-client, build-sign-notarize-nightly, pick-nightly-sign-runner]
    if: "!cancelled() && needs.build-sign-notarize-nightly.result == 'success' && needs.decide.outputs.notary_test != 'true' && needs.decide.outputs.import_paused != 'true'"
    permissions:
      contents: read
    outputs:
      # 'true' only when this job's own launch smoke passed.
      smoked_in_job: ${{ steps.own-smoke.outcome == 'success' }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || vars.CI_NIGHTLY_MINI != '' && vars.CI_NIGHTLY_MINI || needs.pick-nightly-sign-runner.outputs.attempt == github.run_attempt && needs.pick-nightly-sign-runner.outputs.owned || vars.CI_NIGHTLY_NEXT_BUILD_RUNNER || 'glaeda-nightly-std-xcode-26.6' }}
    timeout-minutes: ${{ vars.CI_NIGHTLY_MINI != '' && 150 || 30 }}
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.decide.outputs.variants) }}
    env:
      # Set only when the 6 h stapled-app fallback shipped the first DMG.
      STAPLED_APP_FALLBACK_ID: ${{ needs.build-sign-notarize-nightly.outputs.stapled_app_fallback_id }}
      # An owned Mac has the PR lane's Xcode pin (as DEV's verify); Blacksmith the macOS 26 one.
      CMUX_CI_XCODE_APP: ${{ needs.pick-nightly-sign-runner.outputs.attempt == github.run_attempt && needs.pick-nightly-sign-runner.outputs.owned != '' && vars.CMUX_CI_XCODE_APP_PR || vars.CMUX_CI_XCODE_APP_MACOS_26 }}
      CMUX_CI_REQUIRED_MACOS_SDK_MAJOR: "26"
      NIGHTLY_VARIANT: ${{ matrix.variant }}
      SIGN_CHANNEL: ${{ needs.decide.outputs.sign_channel }}
      TRACK: ${{ needs.decide.outputs.track }}
      CHANNEL_DMG_PREFIX: ${{ needs.decide.outputs.dmg_prefix }}
    steps:
      - *checkout-build-ref

      # Publication tooling from this workflow's own commit (see publish-nightly).
      - &checkout-publication-tooling-a
        name: Checkout publication tooling at the workflow commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: .publish-tooling
          sparse-checkout: scripts

      # The static DMG verifier runs the license check, which reads
      # ghostty-next/build.zig.zon.
      - *legacy-route-shared-5
      - *select-xcode
      - *select-xcode-sdk
      # A parallel-range read: one download-artifact stream took a p50 of 89 s
      # and up to 446 s here (run 41481821056, 7.4 of the job's 9 minutes). download-artifact takes over
      # when it fails.
      - name: Download final DMG (parallel ranges)
        id: fetch-final-dmg
        if: needs.decide.outputs.fast_build != 'true' && needs.decide.outputs.notary_paused != 'true' && needs.build-sign-notarize-nightly.outputs.notary_pending != 'true'
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ARTIFACT: cmux-nightly-variant-${{ matrix.variant }}
          FETCH_DEST: final-dmg
        with:
          script: |
            const run = require('child_process').spawnSync('python3', ['-I', '.publish-tooling/scripts/ci/fetch_run_artifact.py', '--name', process.env.ARTIFACT, '--dest', process.env.FETCH_DEST], {stdio: 'inherit'})
            if (run.status !== 0) core.setFailed(`fetch_run_artifact.py exited ${run.status ?? run.signal}`)
      - name: Download final DMG
        if: needs.decide.outputs.fast_build != 'true' && needs.decide.outputs.notary_paused != 'true' && needs.build-sign-notarize-nightly.outputs.notary_pending != 'true' && steps.fetch-final-dmg.outcome != 'success'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: cmux-nightly-variant-${{ matrix.variant }}
          path: final-dmg

      - name: Verify final DMG artifact
        if: needs.decide.outputs.fast_build != 'true' && needs.decide.outputs.notary_paused != 'true' && needs.build-sign-notarize-nightly.outputs.notary_pending != 'true'
        env:
          NIGHTLY_BUILD: ${{ needs.build-nightly-app.outputs.daemon_build }}
        run: bash .publish-tooling/scripts/ci/nightly-steps/verify-final-dmg.sh

      # Leo, 2026-10-29: "Just don't have that be the downloading thing." The app launched from a fresh
      # home must stay up with Home rendered: a crash fails this job, so publish-nightly puts none of
      # this build on the feed (scripts/ci/nightly-steps/launch-smoke-gate.sh; cannot-run never holds it).
      - name: Launch smoke from a fresh home
        id: own-smoke
        if: needs.decide.outputs.fast_build != 'true' && needs.decide.outputs.notary_paused != 'true' && needs.build-sign-notarize-nightly.outputs.notary_pending != 'true' && env.TRACK == 'nightly-next' && matrix.variant == 'arm64'
        timeout-minutes: 12
        run: bash .publish-tooling/scripts/ci/nightly-steps/launch-smoke-gate.sh "final-dmg/${CHANNEL_DMG_PREFIX}-arm64.dmg"

      - name: Bundle size budget
        if: needs.decide.outputs.fast_build != 'true' && needs.decide.outputs.notary_paused != 'true' && needs.build-sign-notarize-nightly.outputs.notary_pending != 'true' && env.TRACK == 'nightly-next' && matrix.variant == 'arm64'
        continue-on-error: true
        timeout-minutes: 5
        env:
          BUDGET_VARIANT: ${{ vars.CMUX_NEXT_CEF_ON_DEMAND == '1' && 'arm64-cef-on-demand' || 'arm64' }}
        run: bash .publish-tooling/scripts/ci/nightly-steps/verify-final-dmg-bundle-size-budget.sh

      - name: Upload tested DMG digests
        id: upload-tested-dmg-digests
        continue-on-error: true
        if: needs.decide.outputs.fast_build != 'true' && needs.decide.outputs.notary_paused != 'true' && needs.build-sign-notarize-nightly.outputs.notary_pending != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-nightly-tested-${{ matrix.variant }}
          overwrite: true
          path: tested/tested-${{ matrix.variant }}.sha256
          if-no-files-found: error
          retention-days: 3

      - name: Upload tested DMG digests (retry)
        if: "!cancelled() && steps.upload-tested-dmg-digests.outcome == 'failure' && (needs.decide.outputs.fast_build != 'true' && needs.decide.outputs.notary_paused != 'true' && needs.build-sign-notarize-nightly.outputs.notary_pending != 'true')"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-nightly-tested-${{ matrix.variant }}
          path: tested/tested-${{ matrix.variant }}.sha256
          if-no-files-found: error
          retention-days: 3
          overwrite: true

  find-nightly-next-recovery:
    needs: [decide]
    if: needs.decide.outputs.track == 'nightly-next' && needs.decide.outputs.should_publish == 'true' && needs.decide.outputs.no_publish != 'true' && needs.decide.outputs.should_build == 'true' && needs.decide.outputs.fast_build != 'true' && needs.decide.outputs.build_only != 'true' && (github.event_name != 'schedule' || github.event.schedule == '47 8 * * *') && needs.decide.outputs.republish_run == '' && needs.decide.outputs.one_job != 'true'
    # It reads the routing App key, so it stays on the nightly-only pool, whose minis run only nightly.yml.
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.CI_NIGHTLY_MINI != '' && vars.CI_NIGHTLY_MINI || vars.CI_NIGHTLY_ONLY_RUNNER || 'glaeda-nightly-only-m4pro' }}
    timeout-minutes: ${{ vars.CI_NIGHTLY_MINI != '' && 190 || 70 }}
    # The owned pick mints the routing token (GLAEDA_ROUTE_APP_KEY), so the key is read in the
    # routing environment, as pick-nightly-sign-runner does.
    environment:
      name: ci-routing-agent
      deployment: false
    permissions:
      actions: read
      contents: read
      issues: read
    outputs:
      # A drained owned Mac for recover-nightly-next-notarization (glaeda's exclusive class) and
      # verify-recovered-nightly-next, as the JSON runs-on array scripts/ci/signing_runner.py prints, or
      # empty. They read it only while `attempt` is the run's own attempt.
      sign_owned: ${{ steps.sign-owned.outputs.owned }}
      attempt: ${{ github.run_attempt }}
      found: ${{ steps.find.outputs.found }}
      candidates: ${{ steps.find.outputs.candidates }}
    steps:
      - &checkout-default
        name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - *ensure-gh

      - *wait-through-github-api-rate-l

      - name: Mint the owned-pool routing token
        id: route-token
        if: github.repository == 'manaflow-ai/cmux' && vars.CI_PR_POOL_OWNED == '1' && vars.GLAEDA_ROUTE_APP_ID != '' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref_name == 'nightly-next'
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.GLAEDA_ROUTE_APP_ID }}
          private-key: ${{ secrets.GLAEDA_ROUTE_APP_KEY }}
          permission-administration: read
          permission-organization-self-hosted-runners: read

      - *legacy-route-shared-1
      # As pick-nightly-sign-runner's sign-owned: a drained owned Mac, never Blacksmith. Any failure leaves it
      # empty and the recovery jobs take the signer's label.
      - name: Pick a drained owned Mac for the recovery jobs
        id: sign-owned
        if: github.repository == 'manaflow-ai/cmux' && vars.CI_SIGN_OWNED == '1' && vars.CI_PR_POOL_OWNED == '1' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref_name == 'nightly-next'
        continue-on-error: true
        timeout-minutes: 2
        env:
          CI_RUNNER_STATE: ${{ vars.CI_RUNNER_STATE }}
          ENABLED: ${{ vars.CI_SIGN_OWNED }}
          PICK_ON_RERUN: "1"
          DRAIN_ANYWAY: "1"
          ROUTE_TOKEN: ${{ steps.route-token.outputs.token || steps.route-token-repo.outputs.token }}
          SNAPSHOT_TOKEN: ${{ github.token }}
          OWNED_LABELS: glaeda-trusted-next-signing
        run: python3 scripts/ci/signing_runner.py owned

      - name: List newer pending nightly-next notarizations
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL_RELEASE_TAG: ${{ needs.decide.outputs.release_tag }}
          REQUIRED: ${{ vars.NIGHTLY_LEGACY_REQUIRED_COMMITS }}
        run: bash scripts/ci/nightly-steps/recover-list-newer-pending.sh

  recover-nightly-next-notarization:
    environment: ${{ needs.decide.outputs.environment }}
    needs: [decide, find-nightly-next-recovery]
    if: needs.decide.outputs.track == 'nightly-next' && needs.decide.outputs.should_publish == 'true' && needs.decide.outputs.no_publish != 'true' && needs.decide.outputs.should_build == 'true' && needs.decide.outputs.fast_build != 'true' && needs.decide.outputs.build_only != 'true' && (github.event_name != 'schedule' || github.event.schedule == '47 8 * * *') && needs.find-nightly-next-recovery.outputs.found == 'true'
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || vars.CI_NIGHTLY_MINI != '' && 'glaeda-trusted-next-signing' || needs.find-nightly-next-recovery.outputs.attempt == github.run_attempt && needs.find-nightly-next-recovery.outputs.sign_owned && fromJSON(needs.find-nightly-next-recovery.outputs.sign_owned) || 'glaeda-trusted-next-signing' }}
    # An accepted continuation builds, signs and notarizes the DMG around the
    # stapled app (notarize-nightly-dmg.sh, CMUX_STAPLE_APP_IN_DMG): a 20m wait
    # and packaging per candidate; a failed one moves on to the next of 3.
    timeout-minutes: ${{ vars.CI_NIGHTLY_MINI != '' && 270 || 150 }}
    permissions:
      actions: read
      contents: read
    outputs:
      accepted: ${{ steps.continue.outputs.accepted }}
      stapled_app_fallback_id: ${{ steps.continue.outputs.stapled_app_fallback_id }}
      run_id: ${{ steps.continue.outputs.run_id }}
      build: ${{ steps.continue.outputs.build }}
      build_sha: ${{ steps.continue.outputs.build_sha }}
      tip_sha: ${{ steps.continue.outputs.tip_sha }}
      behind: ${{ steps.continue.outputs.behind }}
      behind_hours: ${{ steps.continue.outputs.behind_hours }}
    env:
      CMUX_CI_XCODE_APP: ${{ vars.CMUX_CI_XCODE_APP_MACOS_26 }}
      CMUX_CI_REQUIRED_MACOS_SDK_MAJOR: "26"
      CHANNEL: ${{ needs.decide.outputs.channel }}
      SIGN_CHANNEL: ${{ needs.decide.outputs.sign_channel }}
      TRACK: ${{ needs.decide.outputs.track }}
      CHANNEL_DMG_PREFIX: ${{ needs.decide.outputs.dmg_prefix }}
      CHANNEL_RELEASE_TAG: ${{ needs.decide.outputs.release_tag }}
    steps:
      # First, before any checkout or secret: on an owned Mac this job holds the whole mini (glaeda's
      # exclusive class) or fails here (tests/test_ci_signing_owned_mac.py CLAIM_GATE).
      - *hold-the-whole-mac

      - *checkout-default

      # Before any secret: the same check again, and a signing keychain a killed job left is removed.
      - name: Claim the whole Mac for signing
        run: ./scripts/ci/signing-runner-claim.sh

      # notarize-nightly-dmg.sh runs the bundle notice check after Apple
      # accepts, and that check reads ghostty-next/build.zig.zon. Without the
      # submodule, run 38669958906 skipped five accepted builds.
      # Release App first, github.token as the fallback (scripts/ci/gh_app_token.sh): the App is
      # its own actor, so a limit that every workflow's github.token shares does not refuse it.
      # Later jobs reuse three of these steps by YAML alias (*gh-app-token-read, -write, -install-tooling):
      # GitHub refuses a workflow file over 512,000 bytes before any job starts.
      - &gh-app-token-read
        name: Mint the release App token for this job's gh calls
        id: gh-app-token
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.CMUX_RELEASE_APP_ID }}
          private-key: ${{ secrets.CMUX_RELEASE_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: read

      - name: Send this job's gh calls as the release App, github.token as the fallback
        env:
          GH_APP_TOKEN: ${{ steps.gh-app-token.outputs.token }}
          GH_FALLBACK_TOKEN: ${{ github.token }}
        run: if [ -f scripts/ci/gh_app_token.sh ]; then bash scripts/ci/gh_app_token.sh --install; fi

      - *wait-through-github-api-rate-l

      - *legacy-route-shared-5
      - name: Parse signing and notarize scripts with /bin/bash 3.2
        run: ./scripts/ci/check-bash32-parse.sh .github/workflows/nightly.yml

      - *select-xcode
      - *select-xcode-sdk
      - *set-up-node

      - name: Install create-dmg
        run: bash scripts/ci/nightly-steps/install-create-dmg.sh

      - name: Continue the newest accepted pending notarization
        id: continue
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATES: ${{ needs.find-nightly-next-recovery.outputs.candidates }}
          REQUIRED: ${{ vars.NIGHTLY_LEGACY_REQUIRED_COMMITS }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          CMUX_STAPLED_DMG_WAIT_TIMEOUT: 20m
          CMUX_NOTARY_PENDING_ON_TIMEOUT: "true"
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          CMUX_DEFER_LAUNCH_SMOKES: "true"
        run: bash scripts/ci/nightly-steps/recover-continue-pending-notarization.sh

      - name: Delete the stapled-app DMG signing keychain
        if: always()
        run: ./scripts/ci/signing-keychain.sh delete --keychain build.keychain

      - name: Generate the recovered Sparkle appcast
        if: steps.continue.outputs.accepted == 'true'
        env:
          NEXT_SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_NEXT_PRIVATE_KEY }}
          SPARKLE_CHANNEL: ${{ vars.NIGHTLY_NEXT_DEV_RING == 'on' && 'cmux-next-dev' || 'cmux-next' }}
        run: bash scripts/ci/nightly-steps/recover-generate-appcast.sh

      - name: Upload the recovered variant
        id: upload-the-recovered-variant
        continue-on-error: true
        if: steps.continue.outputs.accepted == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-nightly-recovered-variant-arm64
          path: recovered/
          if-no-files-found: error
          retention-days: 3

      - name: Upload the recovered variant (retry)
        if: "!cancelled() && steps.upload-the-recovered-variant.outcome == 'failure' && (steps.continue.outputs.accepted == 'true')"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-nightly-recovered-variant-arm64
          path: recovered/
          if-no-files-found: error
          retention-days: 3
          overwrite: true

  # Why: docs/ci/nightly-workflow-notes.md#note-43
  verify-recovered-nightly-next:
    needs: [decide, recover-nightly-next-notarization, find-nightly-next-recovery, pick-nightly-build-runner]
    if: "!cancelled() && needs.recover-nightly-next-notarization.outputs.accepted == 'true'"
    permissions:
      contents: read
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || vars.CI_NIGHTLY_MINI != '' && vars.CI_NIGHTLY_MINI || needs.pick-nightly-build-runner.outputs.attempt == github.run_attempt && needs.pick-nightly-build-runner.outputs.owned || vars.CI_NIGHTLY_NEXT_BUILD_RUNNER || 'glaeda-nightly-std-xcode-26.6' }}
    timeout-minutes: ${{ vars.CI_NIGHTLY_MINI != '' && 160 || 40 }}
    env:
      # Set only when the 6 h stapled-app fallback shipped the first DMG.
      STAPLED_APP_FALLBACK_ID: ${{ needs.recover-nightly-next-notarization.outputs.stapled_app_fallback_id }}
      CMUX_CI_XCODE_APP: ${{ vars.CMUX_CI_XCODE_APP_MACOS_26 }}
      CMUX_CI_REQUIRED_MACOS_SDK_MAJOR: "26"
      SIGN_CHANNEL: ${{ needs.decide.outputs.sign_channel }}
      CHANNEL_DMG_PREFIX: ${{ needs.decide.outputs.dmg_prefix }}
    steps:
      # The same checkout the continuation used: its bundle notice check ran
      # from this workflow commit too.
      - *checkout-default

      - *legacy-route-shared-5
      - *select-xcode
      - *select-xcode-sdk

      - name: Download the recovered variant
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: cmux-nightly-recovered-variant-arm64
          path: recovered

      - name: Verify recovered DMG artifact
        run: bash scripts/ci/nightly-steps/recover-verify-dmg.sh

      # As verify-final-dmg-nightly: a recovered build that crashes at launch is never published.
      - name: Launch smoke from a fresh home
        timeout-minutes: 12
        run: bash scripts/ci/nightly-steps/launch-smoke-gate.sh "recovered/${CHANNEL_DMG_PREFIX}-arm64.dmg"

      - name: Upload tested DMG digests
        id: upload-tested-dmg-digests
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-nightly-recovered-tested-arm64
          path: tested/tested-recovered-arm64.sha256
          if-no-files-found: error
          retention-days: 3

      - name: Upload tested DMG digests (retry)
        if: "!cancelled() && steps.upload-tested-dmg-digests.outcome == 'failure'"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-nightly-recovered-tested-arm64
          path: tested/tested-recovered-arm64.sha256
          if-no-files-found: error
          retention-days: 3
          overwrite: true

  # Why: docs/ci/nightly-workflow-notes.md#note-44
  republish-nightly-next:
    needs: [decide]
    if: needs.decide.outputs.republish_run != '' && needs.decide.outputs.track == 'nightly-next' && needs.decide.outputs.should_publish == 'true' && needs.decide.outputs.no_publish != 'true'
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.CI_NIGHTLY_MINI != '' && vars.CI_NIGHTLY_MINI || vars.CI_NIGHTLY_ONLY_RUNNER || 'glaeda-nightly-only-m4pro' }}
    timeout-minutes: ${{ vars.CI_NIGHTLY_MINI != '' && 160 || 40 }}
    permissions:
      actions: read
      contents: read
    outputs:
      run_id: ${{ steps.fetch.outputs.run_id }}
      build: ${{ steps.fetch.outputs.build }}
      build_sha: ${{ steps.fetch.outputs.build_sha }}
      tip_sha: ${{ steps.fetch.outputs.tip_sha }}
      behind: ${{ steps.fetch.outputs.behind }}
      behind_hours: ${{ steps.fetch.outputs.behind_hours }}
      cef: ${{ steps.fetch.outputs.cef }}
      language_packs: ${{ steps.fetch.outputs.language_packs }}
      source_archive: ${{ steps.fetch.outputs.source_archive }}
    steps:
      - *checkout-default

      - name: Fetch the source run's verified build
        id: fetch
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ needs.decide.outputs.republish_run }}
          SOURCE_ATTEMPT: ${{ needs.decide.outputs.republish_attempt }}
          CHANNEL_DMG_PREFIX: ${{ needs.decide.outputs.dmg_prefix }}
        run: python3 -I scripts/ci/republish-verified-nightly.py --run-id "$SOURCE_RUN" --attempt "$SOURCE_ATTEMPT" --out "$RUNNER_TEMP/republished"

      - name: Upload the republished variant
        id: upload-the-republished-variant
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-nightly-republished-variant-arm64
          path: ${{ runner.temp }}/republished/variant/
          if-no-files-found: error
          retention-days: 3

      - name: Upload the republished variant (retry)
        if: "!cancelled() && steps.upload-the-republished-variant.outcome == 'failure'"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-nightly-republished-variant-arm64
          path: ${{ runner.temp }}/republished/variant/
          if-no-files-found: error
          retention-days: 3
          overwrite: true

      - name: Upload the republished build's tested DMG digests
        id: upload-the-republished-build-s-tested-dmg-digest
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-nightly-republished-tested-arm64
          path: ${{ runner.temp }}/republished/tested/
          if-no-files-found: error
          retention-days: 3

      - name: Upload the republished build's tested DMG digests (retry)
        if: "!cancelled() && steps.upload-the-republished-build-s-tested-dmg-digest.outcome == 'failure'"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-nightly-republished-tested-arm64
          path: ${{ runner.temp }}/republished/tested/
          if-no-files-found: error
          retention-days: 3
          overwrite: true

      # publish-nightly reads the pack by this run's name when the source build has one (its cef
      # output), whatever CMUX_NEXT_CEF_ON_DEMAND says now: the app's pin names that pack.
      - name: Upload the republished build's Chromium runtime pack
        id: upload-the-republished-build-s-chromium-runtime
        continue-on-error: true
        if: steps.fetch.outputs.cef == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cef-runtime-pack
          path: ${{ runner.temp }}/republished/cef-runtime/
          if-no-files-found: error
          retention-days: 3

      - name: Upload the republished build's Chromium runtime pack (retry)
        if: "!cancelled() && steps.upload-the-republished-build-s-chromium-runtime.outcome == 'failure' && (steps.fetch.outputs.cef == 'true')"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cef-runtime-pack
          path: ${{ runner.temp }}/republished/cef-runtime/
          if-no-files-found: error
          retention-days: 3
          overwrite: true

      # The same for the source build's language packs (its language_packs output), whatever
      # CMUX_NEXT_LANGUAGE_PACKS says now: the app's pin names them.
      - name: Upload the republished build's language packs
        id: upload-the-republished-build-s-language-packs
        continue-on-error: true
        if: steps.fetch.outputs.language_packs == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: language-packs
          path: ${{ runner.temp }}/republished/language-packs/
          if-no-files-found: error
          retention-days: 3

      - name: Upload the republished build's language packs (retry)
        if: "!cancelled() && steps.upload-the-republished-build-s-language-packs.outcome == 'failure' && (steps.fetch.outputs.language_packs == 'true')"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: language-packs
          path: ${{ runner.temp }}/republished/language-packs/
          if-no-files-found: error
          retention-days: 3
          overwrite: true

  # The visual gate (docs/ci/nightly-next-visual-gate.md): light and dark stills of a DEV build of
  # this run's commit on an idle owned Mac, checked beside the signed build. Skipped (`unavailable`)
  # with no idle runner; only `enforce` with a failing verdict holds this run's build.
  route-visual-gate-nightly:
    needs: [decide, resolve-nightly-cmux-tui-client]
    if: github.repository == 'manaflow-ai/cmux' && needs.decide.outputs.track == 'nightly-next' && needs.decide.outputs.should_build == 'true' && needs.decide.outputs.fast_build != 'true' && needs.decide.outputs.build_only != 'true' && needs.decide.outputs.continue_only != 'true' && needs.decide.outputs.no_publish != 'true' && needs.resolve-nightly-cmux-tui-client.outputs.already_published != 'true' && needs.resolve-nightly-cmux-tui-client.outputs.superseded != 'true' && vars.NIGHTLY_NEXT_VISUAL_GATE != '' && vars.NIGHTLY_NEXT_VISUAL_GATE != 'off' && vars.CI_NIGHTLY_MINI == '' && needs.decide.outputs.one_job != 'true'
    # Credentials stay on the validated ephemeral set until exclusive owned-Mac admission exists.
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.CI_NIGHTLY_MINI != '' && vars.CI_NIGHTLY_MINI || github.repository == 'manaflow-ai/cmux' && github.ref == 'refs/heads/nightly-next' && github.run_attempt == 1 && vars.CI_NIGHTLY_ONLY_RUNNER == 'glaeda-nightly-only-m4pro' && vars.CI_NIGHTLY_ONLY_RUNNER || vars.CI_NIGHTLY_ONLY_RUNNER || 'glaeda-nightly-only-m4pro' }}
    timeout-minutes: ${{ vars.CI_NIGHTLY_MINI != '' && 125 || 5 }}
    # GLAEDA_ROUTE_APP_KEY lives in the routing environment, like every other route job's.
    environment:
      name: ci-routing-agent
      deployment: false
    permissions:
      contents: read
      issues: read # the report week of the auto flip
    outputs:
      runs_on: ${{ steps.pick.outputs.runs_on }}
      reason: ${{ steps.pick.outputs.reason }}
      # `unavailable` when no session runner was idle: the gate is skipped.
      verdict: ${{ steps.pick.outputs.verdict }}
      mode: ${{ steps.mode.outputs.mode }}
      why: ${{ steps.mode.outputs.why }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          sparse-checkout: |
            scripts/ci/nightly_next_canary_mode.py
            scripts/ci/cmux_next_media_runner.py
            scripts/ci/pr_runner_pool.py
            scripts/ci/github_spend.py
            scripts/ci/deadline_http.py
            scripts/ci/nightly-steps/visual-gate-resolve-mode.sh
            scripts/ci/nightly-steps/visual-gate-pick-runner.sh
            scripts/ci/warm_distance.py
            .gitmodules
          sparse-checkout-cone-mode: false

      - name: Resolve the visual gate mode
        id: mode
        env:
          GH_TOKEN: ${{ github.token }}
          NIGHTLY_NEXT_VISUAL_GATE: ${{ vars.NIGHTLY_NEXT_VISUAL_GATE }}
          NIGHTLY_NEXT_VISUAL_GATE_ENFORCE_AFTER: ${{ vars.NIGHTLY_NEXT_VISUAL_GATE_ENFORCE_AFTER }}
        run: bash scripts/ci/nightly-steps/visual-gate-resolve-mode.sh

      # Idle runners are read live, as side_lane_placement.py does. Any
      # failure leaves the token empty, and the gate is skipped.
      - name: Mint the owned-pool routing token
        id: route-token
        if: steps.mode.outputs.mode != 'off' && steps.mode.outputs.mode != 'invalid' && vars.GLAEDA_ROUTE_APP_ID != ''
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.GLAEDA_ROUTE_APP_ID }}
          private-key: ${{ secrets.GLAEDA_ROUTE_APP_KEY }}
          permission-administration: read
          permission-organization-self-hosted-runners: read

      - name: Pick an idle owned session runner
        id: pick
        if: steps.mode.outputs.mode != 'off' && steps.mode.outputs.mode != 'invalid'
        env:
          POOL_OWNED: ${{ vars.CI_PR_POOL_OWNED }}
          PR_XCODE_APP: ${{ vars.CMUX_CI_XCODE_APP_PR }}
          ROUTE_TOKEN: ${{ steps.route-token.outputs.token }}
          BUILD_SHA: ${{ needs.resolve-nightly-cmux-tui-client.outputs.build_sha }}
        run: bash scripts/ci/nightly-steps/visual-gate-pick-runner.sh

  visual-gate-nightly:
    needs: [decide, resolve-nightly-cmux-tui-client, route-visual-gate-nightly]
    if: needs.route-visual-gate-nightly.outputs.runs_on != '' && needs.route-visual-gate-nightly.outputs.mode != 'off' && needs.route-visual-gate-nightly.outputs.mode != 'invalid' && needs.route-visual-gate-nightly.outputs.mode != ''
    runs-on: ${{ needs.route-visual-gate-nightly.outputs.runs_on }}
    # A warm tour slot builds the DEV app in ~6-10 min; a cold one took 35 min.
    timeout-minutes: 75
    permissions:
      contents: read
      actions: read # the previous nightly's visual-gate artifact (desktop_visual_diff.py)
      pull-requests: read # the Visual-change lines of the pull requests since it
    outputs:
      verdict: ${{ steps.verdict.outputs.verdict }}
      blocks: ${{ steps.verdict.outputs.blocks }}
    env:
      CMUX_CI_XCODE_APP: ${{ vars.CMUX_CI_XCODE_APP_PR }}
      CMUX_SKIP_ZIG_BUILD: "1"
      CMUX_GHOSTTYKIT_PREPROVISIONED: "1"
      CMUX_MEDIA_TOUR_SLOTS: ${{ vars.CMUX_MEDIA_TOUR_SLOTS || '2' }}
      BUILD_SHA: ${{ needs.resolve-nightly-cmux-tui-client.outputs.build_sha }}
      GATE_MODE: ${{ needs.route-visual-gate-nightly.outputs.mode }}
      GATE_WHY: ${{ needs.route-visual-gate-nightly.outputs.why }}
    steps:
      - name: Clear stale git locks (self-hosted reused workspace)
        run: rm -f "${GITHUB_WORKSPACE:-$PWD}/.git/index.lock" 2>/dev/null || true

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ needs.resolve-nightly-cmux-tui-client.outputs.build_sha }}
          submodules: recursive

      - *select-xcode
      - *select-xcode-sdk

      - name: Check the states
        run: python3 scripts/cmux-next/visual-gate/capture_states.py --check scripts/cmux-next/visual-gate/states

      - name: Restore pinned Bun 1.4.4 from the CI cache bucket
        shell: bash
        continue-on-error: true
        run: bash "$GITHUB_WORKSPACE/scripts/ci/toolchain-r2.sh" restore bun 1.4.4 || true

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          no-cache: ${{ !startsWith(github.workspace, '/home/runner/work/') || !(github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && github.event_name != 'merge_group' && contains(fromJSON('["refs/heads/main","refs/heads/feat-cmux-next","refs/heads/nightly-next"]'), github.ref)) }}
          bun-version: "1.4.4"

      - *legacy-route-shared-6
      - name: Restore pinned Node 24.11.1 from the CI cache bucket
        shell: bash
        continue-on-error: true
        run: bash "$GITHUB_WORKSPACE/scripts/ci/toolchain-r2.sh" restore node 24.11.1 || true

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.11.1"

      # The media tour's slots (scripts/ci/media_tag_lock.py): the gate builds
      # into a warm slot's head DerivedData and holds the slot's lock until
      # this job's Runner.Worker exits, so it never builds beside a tour.
      - name: Claim a tour slot on this Mac
        run: python3 scripts/ci/media_tag_lock.py claim --slots "$CMUX_MEDIA_TOUR_SLOTS" --github-env "$GITHUB_ENV"

      - name: Bound the tour DerivedData on this Mac
        continue-on-error: true
        run: bash scripts/ci/nightly-steps/visual-gate-bound-derived-data.sh

      - name: Download pre-built GhosttyKit.xcframework
        env:
          GHOSTTYKIT_ARCHIVE_CACHE_DIR: /Users/Shared/cmux-build-fleet/ci/ghosttykit-archives
          GHOSTTYKIT_R2_ACCESS_KEY_ID: ${{ secrets.CI_CACHE_R2_ACCESS_KEY_ID }}
          GHOSTTYKIT_R2_SECRET_ACCESS_KEY: ${{ secrets.CI_CACHE_R2_SECRET_ACCESS_KEY }}
          GHOSTTYKIT_R2_ENDPOINT: ${{ secrets.CI_CACHE_R2_ACCOUNT_ID && format('https://{0}.r2.cloudflarestorage.com', secrets.CI_CACHE_R2_ACCOUNT_ID) || '' }}
          GHOSTTYKIT_R2_BUCKET: ${{ vars.CI_CACHE_R2_BUCKET }}
        run: GHOSTTY_SHA="$(git rev-parse "HEAD:ghostty")" ./scripts/download-prebuilt-ghosttykit.sh

      - name: Build the DEV app
        id: build
        env:
          CMUX_TUI_TREE_KEY: ${{ needs.resolve-nightly-cmux-tui-client.outputs.key }}
        run: bash scripts/ci/nightly-steps/visual-gate-build-dev-app.sh

      - name: Capture the states
        id: capture
        continue-on-error: true
        env:
          APP: ${{ steps.build.outputs.app }}
        run: bash scripts/ci/nightly-steps/visual-gate-capture-states.sh

      - name: Read the text boxes
        continue-on-error: true
        run: bash scripts/ci/nightly-steps/visual-gate-read-text-boxes.sh

      - name: Run the visual gate
        id: verdict
        if: always()
        env:
          VISUAL_GATE_REQUIRE_2X: ${{ vars.NIGHTLY_NEXT_VISUAL_GATE_REQUIRE_2X }}
          CAPTURE_OUTCOME: ${{ steps.capture.outcome }}
        run: bash scripts/ci/nightly-steps/visual-gate-verdict.sh

      # Warn only: states whose pixels changed since the previous nightly with no Visual-change line.
      - name: Diff the states against the previous nightly
        if: always()
        continue-on-error: true
        timeout-minutes: 9
        env:
          GH_TOKEN: ${{ github.token }}
        run: perl -e 'alarm shift; exec @ARGV' 480 python3 -I scripts/ci/desktop_visual_diff.py --head-root "$RUNNER_TEMP/visual-gate" --head-sha "$BUILD_SHA" --fetch-baseline --work "$RUNNER_TEMP/desktop-visual-baseline" --out "$GITHUB_STEP_SUMMARY"

      - name: Keep the stills and the report
        id: upload-keep-the-stills-and-the-report
        continue-on-error: true
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-next-visual-gate-${{ needs.resolve-nightly-cmux-tui-client.outputs.build_short_sha }}
          path: ${{ runner.temp }}/visual-gate
          if-no-files-found: ignore
          retention-days: 3

      - name: Keep the stills and the report (retry)
        if: "!cancelled() && steps.upload-keep-the-stills-and-the-report.outcome == 'failure' && (always())"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-next-visual-gate-${{ needs.resolve-nightly-cmux-tui-client.outputs.build_short_sha }}
          path: ${{ runner.temp }}/visual-gate
          if-no-files-found: ignore
          retention-days: 3
          overwrite: true

      # visual-gate-nightly-verdict reads this step's conclusion: it runs only when the gate holds the build.
      - name: Hold publication
        if: always() && steps.verdict.outputs.blocks == 'true'
        run: echo "the visual gate holds $BUILD_SHA (enforce mode, failing verdict)"

      - name: Enforce the verdict
        if: steps.verdict.outputs.blocks == 'true'
        run: bash scripts/ci/nightly-steps/visual-gate-enforce-verdict.sh

  # This Linux job records the visual verdict independently of publication. Visual coverage is
  # advisory so a queued or slow display runner can never hold the nightly feed.
  visual-gate-nightly-verdict:
    needs: [decide, resolve-nightly-cmux-tui-client, route-visual-gate-nightly, verify-final-dmg-nightly]
    # A skipped signing path must not skip this job (implicit success()).
    if: "!cancelled() && needs.verify-final-dmg-nightly.result == 'success' && needs.route-visual-gate-nightly.outputs.runs_on != '' && needs.route-visual-gate-nightly.outputs.mode != 'off' && needs.route-visual-gate-nightly.outputs.mode != 'invalid' && needs.route-visual-gate-nightly.outputs.mode != ''"
    # The declared nightly-only mini is enabled after live admission is verified.
    # Keep the existing fallback; never reuse the stale builder-only placement.
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.CI_NIGHTLY_MINI != '' && vars.CI_NIGHTLY_MINI || github.repository == 'manaflow-ai/cmux' && needs.decide.outputs.track == 'nightly-next' && github.run_attempt == 1 && vars.CI_NIGHTLY_ONLY_RUNNER == 'glaeda-nightly-only-m4pro' && vars.CI_NIGHTLY_ONLY_RUNNER || vars.CI_NIGHTLY_ONLY_RUNNER || 'glaeda-nightly-only-m4pro' }}
    # A re-run's 15 + 75 min, plus slack; attempt 1 waits at most 10.
    timeout-minutes: ${{ vars.CI_NIGHTLY_MINI != '' && 220 || 100 }}
    permissions:
      contents: read # the sparse checkout of the script
      actions: read # this run's jobs
    outputs:
      verdict: ${{ steps.await.outputs.verdict }}
      blocks: ${{ steps.await.outputs.blocks }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          sparse-checkout: |
            scripts/ci/nightly_next_canary_mode.py
            scripts/ci/nightly-steps/visual-gate-await.sh
            scripts/ci/nightly-steps/visual-gate-fail-when-held.sh
            .gitmodules
          sparse-checkout-cone-mode: false

      - name: Wait for the visual gate, at most 10 min past the signed build
        id: await
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_MODE: ${{ needs.route-visual-gate-nightly.outputs.mode }}
        run: bash scripts/ci/nightly-steps/visual-gate-await.sh

      - name: Record failed advisory verdict
        if: steps.await.outputs.blocks == 'true'
        run: bash scripts/ci/nightly-steps/visual-gate-fail-when-held.sh

  # One comment per judged build in the `nightly-next visual gate` issue, read by recovery and the auto flip.
  report-visual-gate-nightly:
    needs: [decide, resolve-nightly-cmux-tui-client, route-visual-gate-nightly, visual-gate-nightly, visual-gate-nightly-verdict]
    if: always() && (needs.visual-gate-nightly.outputs.verdict == 'fail' || needs.visual-gate-nightly.outputs.verdict == 'pass')
    # The declared nightly-only mini is enabled after live admission is verified.
    # Keep the existing fallback; never reuse the stale builder-only placement.
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.CI_NIGHTLY_MINI != '' && vars.CI_NIGHTLY_MINI || github.repository == 'manaflow-ai/cmux' && needs.decide.outputs.track == 'nightly-next' && github.run_attempt == 1 && vars.CI_NIGHTLY_ONLY_RUNNER == 'glaeda-nightly-only-m4pro' && vars.CI_NIGHTLY_ONLY_RUNNER || vars.CI_NIGHTLY_ONLY_RUNNER || 'glaeda-nightly-only-m4pro' }}
    timeout-minutes: ${{ vars.CI_NIGHTLY_MINI != '' && 125 || 5 }}
    permissions:
      issues: write # the nightly-next visual gate issue
    steps:
      - name: Record the verdict in the visual gate issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SHA: ${{ needs.resolve-nightly-cmux-tui-client.outputs.build_sha }}
          MODE: ${{ needs.route-visual-gate-nightly.outputs.mode }}
          VERDICT: ${{ needs.visual-gate-nightly.outputs.verdict }}
        with:
          script: |
            const title = 'nightly-next visual gate';
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            let body = `cmux NEXT visual gate passed ${process.env.SHA}: ${run}`;
            if (process.env.VERDICT === 'fail') {
              const action = `The gate is in \`${process.env.MODE}\` mode, but visual coverage is advisory and does not block publication.`;
              body = `cmux NEXT visual gate failed ${process.env.SHA}: ${run}\n\n${action} Publication still requires the signed, verified build checks. The stills and findings are in the run's \`nightly-next-visual-gate-*\` artifact and job summary.`;
            }
            const open = await github.paginate(github.rest.issues.listForRepo, { ...context.repo, state: 'open', per_page: 100, creator: 'github-actions[bot]' });
            let issue = open.find(i => i.title === title && !i.pull_request);
            if (!issue) {
              ({ data: issue } = await github.rest.issues.create({ ...context.repo, title, body:
                'The nightly-next visual gate\'s record (docs/ci/nightly-next-visual-gate.md): one comment per judged build, '
                + '`cmux NEXT visual gate passed|failed <build sha>: <run>`. The recovery path and the auto flip read it, '
                + 'so keep the first line of each comment as it is.' }));
            }
            await github.rest.issues.createComment({ ...context.repo, issue_number: issue.number, body });

  # Lint-class webview reds, kept in one open issue (scripts/ci/nightly_fix_forward_issue.py); never a hold.
  report-nightly-fix-forward:
    needs: [decide, resolve-nightly-cmux-tui-client, check-nightly-webviews, nightly-next-one]
    if: "!cancelled() && (needs.check-nightly-webviews.outputs.lint_report != '' || needs.nightly-next-one.outputs.lint_report != '')"
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.CI_NIGHTLY_MINI != '' && vars.CI_NIGHTLY_MINI || github.repository == 'manaflow-ai/cmux' && needs.decide.outputs.track == 'nightly-next' && github.run_attempt == 1 && vars.CI_NIGHTLY_ONLY_RUNNER == 'glaeda-nightly-only-m4pro' && vars.CI_NIGHTLY_ONLY_RUNNER || vars.CI_NIGHTLY_ONLY_RUNNER || 'glaeda-nightly-only-m4pro' }}
    timeout-minutes: ${{ vars.CI_NIGHTLY_MINI != '' && 125 || 5 }}
    permissions:
      contents: read
      issues: write # the fix-forward issue
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          sparse-checkout: scripts/ci
      - name: File the lint-class reds in the fix-forward issue
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          LINT_REPORT: ${{ needs.nightly-next-one.outputs.lint_report || needs.check-nightly-webviews.outputs.lint_report }}
          BUILD_SHA: ${{ needs.nightly-next-one.outputs.build_sha || needs.resolve-nightly-cmux-tui-client.outputs.build_sha }}
        run: python3 scripts/ci/nightly_fix_forward_issue.py file --repo "$GITHUB_REPOSITORY"

  await-nightly-tree-marker:
    needs: [decide, resolve-nightly-cmux-tui-client, build-nightly-app]
    # A timed-out pick-nightly-build-runner must not skip this job (see build-nightly-app's `if`).
    if: "!cancelled() && needs.decide.result == 'success' && needs.resolve-nightly-cmux-tui-client.result == 'success' && needs.build-nightly-app.result == 'success' && (needs.resolve-nightly-cmux-tui-client.outputs.tree_pending == 'true' || inputs.nightly_next_unsigned_run != '') && needs.build-nightly-app.result == 'success'"
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || 'cmux-linux' }}
    permissions:
      contents: read
    timeout-minutes: ${{ vars.CI_NIGHTLY_MINI != '' && 180 || 60 }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: .publish-tooling
          sparse-checkout: scripts

      - name: Wait for the build commit's tree-commit marker
        env:
          BUILD_SHA: ${{ needs.resolve-nightly-cmux-tui-client.outputs.build_sha }}
          KEY: ${{ needs.resolve-nightly-cmux-tui-client.outputs.key }}
          INSTALLED: ${{ needs.build-nightly-app.outputs.cmux_tui_commit || needs.resolve-nightly-cmux-tui-client.outputs.commit }}
          INSTALLED_KEY: ${{ needs.build-nightly-app.outputs.cmux_tui_key }}
        run: bash .publish-tooling/scripts/ci/nightly-steps/await-tree-marker.sh

  publish-nightly:
    # Production secrets: GitHub releases them only to protected refs (the
    # environment's deployment branch policy: main, tags v*). The nightly-next
    # track uses `release-next`, whose policy allows only branch nightly-next.
    environment: ${{ needs.decide.outputs.environment }}
    permissions:
      contents: write
      pull-requests: read
      attestations: write
      id-token: write
      actions: read
    # rc/** branches share one release. Serialize its mutable aliases and feeds
    # by channel, even when workflow-level groups have different branch names.
    # nightly-next takes a group of its own run and the R2 lease below instead:
    # a shared group cancelled run 41436891188's pending publish for a newer one.
    concurrency:
      group: release-publish-${{ needs.decide.outputs.release_tag }}${{ needs.decide.outputs.track == 'nightly-next' && format('-run-{0}', github.run_id) || '' }}
      cancel-in-progress: false
    needs: [decide, build-nightly-app, build-sign-notarize-nightly, verify-signed-nightly, verify-final-dmg-nightly, resolve-nightly-cmux-tui-client, recover-nightly-next-notarization, verify-recovered-nightly-next, republish-nightly-next, await-nightly-tree-marker, pick-nightly-sign-runner, check-nightly-webviews, check-nightly-app-store-shelf]
    outputs:
      tag_status: ${{ steps.tag-outcome.outputs.tag_status }}
      source: ${{ steps.source.outputs.source }}
      # The published build.
      build: ${{ steps.source.outputs.build }}
      # Its commit, for keep-published-dsyms.
      build_sha: ${{ steps.source.outputs.build_sha }}
      # Another run already published the recovered build, or the final gate
      # refused (see refused): this run published nothing.
      already_published: ${{ steps.recheck.outputs.already_published == 'true' || steps.gate.outputs.refused == 'true' }}
      # The final gate refused: a recovered build failed its lineage check, or
      # this pipeline is not the nightly-next writer (NIGHTLY_NEXT_WRITER read
      # live is not mac, or is unreadable).
      # A superseded build (recheck or feed CAS) publishes nothing and is no failure: every job that would
      # republish it reads refused, and report-nightly-failure reads refusal_reason, which it leaves empty.
      refused: ${{ steps.gate.outputs.refused == 'true' || steps.recheck.outputs.superseded == 'true' || steps.upload_next_appcasts.outputs.publication_refused == 'true' }}
      refusal_reason: ${{ steps.gate.outputs.refusal_reason }}
      # For publish-nightly-next-github: what to publish and the release body's parts.
      # feed_written is false when a newer build was already on the feed.
      variant_pattern: ${{ steps.source.outputs.variant_pattern }}
      tested_pattern: ${{ steps.source.outputs.tested_pattern }}
      source_archive: ${{ steps.source.outputs.source_archive }}
      tip_sha: ${{ steps.source.outputs.tip_sha }}
      behind: ${{ steps.source.outputs.behind }}
      behind_hours: ${{ steps.source.outputs.behind_hours }}
      downloads: ${{ steps.notes.outputs.downloads }}
      feed_written: ${{ steps.upload_next_appcasts.outputs.feed_written }}
      feed_check: ${{ steps.feedcheck.outcome }}
    # Visual coverage is advisory: route, capture, and verdict jobs still report findings, but
    # neither a display queue nor an enforce-mode verdict can hold publication.
    if: "always() && !cancelled() && needs.decide.result == 'success' && needs.decide.outputs.should_build == 'true' && needs.decide.outputs.fast_build != 'true' && needs.decide.outputs.build_only != 'true' && (github.event_name != 'schedule' || github.event.schedule == '47 8 * * *') && needs.resolve-nightly-cmux-tui-client.outputs.already_published != 'true' && needs.decide.outputs.no_publish != 'true' && ((needs.build-sign-notarize-nightly.result == 'success' && needs.build-sign-notarize-nightly.outputs.notary_pending != 'true' && needs.verify-signed-nightly.result == 'success' && needs.verify-final-dmg-nightly.result == 'success') || (needs.recover-nightly-next-notarization.outputs.accepted == 'true' && needs.verify-recovered-nightly-next.result == 'success') || needs.republish-nightly-next.result == 'success')"
    # The release App key remains scoped to this protected environment. Publication uploads and writes feeds
    # at about one core (publish-nightly 64 s on 32 vCPU at 1.39 cores, .github/runners.json): with no owned
    # pool it takes the signing picker's Linux label, as keep-published-dsyms does, else the Linux 4 vCPU pool.
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.CI_NIGHTLY_MINI_PUBLISHER == 'ubuntu-24.04' && 'cmux-gcp-nightly-jit-x64' || vars.CI_NIGHTLY_MINI != '' && 'glaeda-trusted-next-signing' || needs.pick-nightly-sign-runner.outputs.attempt == github.run_attempt && needs.pick-nightly-sign-runner.outputs.sign_owned_pool || 'glaeda-trusted-next-signing' }}
    # 120 for the work (an hour of it for API rate-limit waits) plus the lease's 60-minute wait.
    timeout-minutes: ${{ vars.CI_NIGHTLY_MINI != '' && 300 || 180 }}
    env:
      NIGHTLY_LEGACY_VARIANT: ${{ needs.decide.outputs.legacy_variant }}
      # The appcasts this track publishes (decide): one on nightly-next, four on main.
      NIGHTLY_FEEDS: ${{ needs.decide.outputs.feeds }}
      NIGHTLY_TRACK: ${{ needs.decide.outputs.track }}
      CHANNEL: ${{ needs.decide.outputs.channel }}
      TRACK: ${{ needs.decide.outputs.track }}
      CHANNEL_DMG_PREFIX: ${{ needs.decide.outputs.dmg_prefix }}
      CHANNEL_RELEASE_TAG: ${{ needs.decide.outputs.release_tag }}
      CHANNEL_FEED_BASE: ${{ needs.decide.outputs.feed_base }}
      # Publication tooling from this workflow's own commit (see the step below).
      PUBLISH_TOOLING: &pub-tooling ${{ github.workspace }}/.publish-tooling/scripts
    steps:
      # First, before any checkout or secret: the whole mini (glaeda's exclusive class), as the signing jobs.
      - *hold-the-whole-mac
      - *clean-owned-workdir

      - name: Select the build to publish
        id: source
        env:
          OWN_RESULT: ${{ needs.build-sign-notarize-nightly.result }}
          OWN_PENDING: ${{ needs.build-sign-notarize-nightly.outputs.notary_pending }}
          # verify-signed-nightly verified the macOS signer's app and verify-final-dmg-nightly the final DMG
          # (and its fresh-home launch smoke, which fails that job).
          OWN_VERIFIED: ${{ needs.verify-signed-nightly.result }}
          OWN_DMG_VERIFIED: ${{ needs.verify-final-dmg-nightly.result }}
          # NIGHTLY_NEXT_TREE_AT_INSTALL: a build made before its tree published, or resumed, needs await-nightly-tree-marker.
          OWN_TREE: ${{ (needs.resolve-nightly-cmux-tui-client.outputs.tree_pending != 'true' && inputs.nightly_next_unsigned_run == '' || needs.await-nightly-tree-marker.result == 'success') && 'ok' || 'unmarked' }}
          RECOVERED_VERIFIED: ${{ needs.verify-recovered-nightly-next.result }}
          OWN_BUILD: ${{ needs.build-nightly-app.outputs.daemon_build }}
          OWN_BUILD_SHA: ${{ needs.resolve-nightly-cmux-tui-client.outputs.build_sha }}
          OWN_TIP_SHA: ${{ needs.resolve-nightly-cmux-tui-client.outputs.tip_sha }}
          OWN_BEHIND: ${{ needs.resolve-nightly-cmux-tui-client.outputs.behind }}
          OWN_BEHIND_HOURS: ${{ needs.resolve-nightly-cmux-tui-client.outputs.behind_hours }}
          RECOVERED: ${{ needs.recover-nightly-next-notarization.outputs.accepted }}
          RECOVERED_RUN_ID: ${{ needs.recover-nightly-next-notarization.outputs.run_id }}
          RECOVERED_BUILD: ${{ needs.recover-nightly-next-notarization.outputs.build }}
          RECOVERED_BUILD_SHA: ${{ needs.recover-nightly-next-notarization.outputs.build_sha }}
          RECOVERED_TIP_SHA: ${{ needs.recover-nightly-next-notarization.outputs.tip_sha }}
          RECOVERED_BEHIND: ${{ needs.recover-nightly-next-notarization.outputs.behind }}
          RECOVERED_BEHIND_HOURS: ${{ needs.recover-nightly-next-notarization.outputs.behind_hours }}
          REPUBLISHED: ${{ needs.republish-nightly-next.result }}
          REPUBLISHED_RUN_ID: ${{ needs.republish-nightly-next.outputs.run_id }}
          REPUBLISHED_BUILD: ${{ needs.republish-nightly-next.outputs.build }}
          REPUBLISHED_BUILD_SHA: ${{ needs.republish-nightly-next.outputs.build_sha }}
          REPUBLISHED_TIP_SHA: ${{ needs.republish-nightly-next.outputs.tip_sha }}
          REPUBLISHED_BEHIND: ${{ needs.republish-nightly-next.outputs.behind }}
          REPUBLISHED_BEHIND_HOURS: ${{ needs.republish-nightly-next.outputs.behind_hours }}
          # Chromium on demand and the source offer: the switches as they are now, except that a
          # republished build publishes the pack its source signed with (the app's pin names it), and
          # no source archive when its source made none.
          CEF_ON_DEMAND: ${{ vars.CMUX_NEXT_CEF_ON_DEMAND }}
          LANGUAGE_PACKS: ${{ vars.CMUX_NEXT_LANGUAGE_PACKS }}
          PUBLISH_SOURCE_ARCHIVE: ${{ vars.CMUX_NEXT_PUBLISH_SOURCE_ARCHIVE }}
          REPUBLISHED_CEF: ${{ needs.republish-nightly-next.outputs.cef }}
          REPUBLISHED_LANGUAGE_PACKS: ${{ needs.republish-nightly-next.outputs.language_packs }}
          REPUBLISHED_SOURCE_ARCHIVE: ${{ needs.republish-nightly-next.outputs.source_archive }}
        run: |
          set -euo pipefail
          run_id=
          cef=false source_archive=false
          # Language packs (CMUX-570) are on unless CMUX_NEXT_LANGUAGE_PACKS is 0; a recovered build's
          # packs stay in its own run (language_packs_run), a republished one's come from its receipt.
          language_packs=true language_packs_run=
          [ "${LANGUAGE_PACKS:-}" = 0 ] && language_packs=false
          [ "${CEF_ON_DEMAND:-}" = 1 ] && cef=true
          [ "${PUBLISH_SOURCE_ARCHIVE:-}" = 1 ] && source_archive=true
          if [ "$OWN_RESULT" = success ] && [ "$OWN_PENDING" != true ] && [ "$OWN_VERIFIED" = success ] && [ "$OWN_DMG_VERIFIED" = success ] && [ "$OWN_TREE" = ok ]; then
            source=own build="$OWN_BUILD" build_sha="$OWN_BUILD_SHA" tip_sha="$OWN_TIP_SHA"
            behind="$OWN_BEHIND" behind_hours="$OWN_BEHIND_HOURS" pattern="cmux-nightly-variant-*"
            tested_pattern="cmux-nightly-tested-*"
          elif [ "$RECOVERED" = true ] && [ "$RECOVERED_VERIFIED" = success ]; then
            source=recovered build="$RECOVERED_BUILD" build_sha="$RECOVERED_BUILD_SHA" tip_sha="$RECOVERED_TIP_SHA"
            behind="$RECOVERED_BEHIND" behind_hours="$RECOVERED_BEHIND_HOURS" pattern="cmux-nightly-recovered-variant-*"
            tested_pattern="cmux-nightly-recovered-tested-*" run_id="$RECOVERED_RUN_ID"
            language_packs_run="$RECOVERED_RUN_ID"
            echo "::notice title=Publishing an earlier nightly-next build::this run's build was not accepted in time; publishing build $build from run $RECOVERED_RUN_ID"
          elif [ "${REPUBLISHED:-}" = success ]; then
            # Published as a recovered build: the lineage and webview gate read its run.
            source=recovered build="$REPUBLISHED_BUILD" build_sha="$REPUBLISHED_BUILD_SHA" tip_sha="$REPUBLISHED_TIP_SHA"
            behind="$REPUBLISHED_BEHIND" behind_hours="$REPUBLISHED_BEHIND_HOURS" pattern="cmux-nightly-republished-variant-*"
            tested_pattern="cmux-nightly-republished-tested-*" run_id="$REPUBLISHED_RUN_ID"
            [ "${REPUBLISHED_CEF:-}" = true ] && cef=true || cef=false
            [ "${REPUBLISHED_LANGUAGE_PACKS:-}" = true ] && language_packs=true || language_packs=false
            [ "${REPUBLISHED_SOURCE_ARCHIVE:-}" = true ] || source_archive=false
            echo "::notice title=Republishing a verified nightly-next build::build $build from run $REPUBLISHED_RUN_ID, with this run's publication tooling"
          else
            echo "nothing accepted to publish" >&2
            exit 1
          fi
          [[ "$build" =~ ^[0-9]+$ && "$build_sha" =~ ^[0-9a-f]{40}$ ]] || { echo "invalid build $build at $build_sha" >&2; exit 1; }
          {
            echo "source=$source"
            echo "build=$build"
            echo "build_sha=$build_sha"
            echo "build_short_sha=${build_sha:0:7}"
            echo "tip_sha=$tip_sha"
            echo "behind=$behind"
            echo "behind_hours=$behind_hours"
            echo "variant_pattern=$pattern"
            echo "tested_pattern=$tested_pattern"
            echo "run_id=$run_id"
            echo "cef=$cef"
            echo "language_packs=$language_packs"
            echo "language_packs_run=$language_packs_run"
            echo "source_archive=$source_archive"
          } >> "$GITHUB_OUTPUT"
          echo "NIGHTLY_BUILD=$build" >> "$GITHUB_ENV"

      - name: Checkout publish ref
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ steps.source.outputs.build_sha }}
          filter: blob:none
          sparse-checkout: |
            /*
            !/cmux-next-ios/verify/
          sparse-checkout-cone-mode: false # patterns: .github/checkout-lean.json

      # Why: docs/ci/nightly-workflow-notes.md#note-45
      - *checkout-publication-tooling-a

      # Before any release App secret: the claim again, and a keychain a killed job left is removed.
      - &claim-publication-mac
        name: Claim the whole Mac for signing
        run: bash .publish-tooling/scripts/ci/signing-runner-claim.sh

      # Release App first, github.token as the fallback (scripts/ci/gh_app_token.sh): the App is
      # its own actor, so a limit that every workflow's github.token shares does not refuse it.
      - &gh-app-token-write
        name: Mint the release App token for this job's gh calls
        if: ${{ !env.LEFT_SLOT }}
        id: gh-app-token
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.CMUX_RELEASE_APP_ID }}
          private-key: ${{ secrets.CMUX_RELEASE_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - &gh-app-install-tooling
        name: Send this job's gh calls as the release App, github.token as the fallback
        if: ${{ !env.LEFT_SLOT }}
        env:
          GH_APP_TOKEN: ${{ steps.gh-app-token.outputs.token }}
          GH_FALLBACK_TOKEN: ${{ github.token }}
        run: if [ -f .publish-tooling/scripts/ci/gh_app_token.sh ]; then bash .publish-tooling/scripts/ci/gh_app_token.sh --install; fi

      - &wait-through-github-api-rate-l-2
        name: Wait through GitHub API rate limits in this job's gh calls
        # scripts/ci/gh_budget_wait.sh puts a gh first on PATH that waits for the shared budget's
        # reset (at most an hour per job, each wait logged) when a call is refused for the rate
        # limit, instead of failing the publish path. timeout-minutes leaves room for that hour.
        run: if [ -f .publish-tooling/scripts/ci/gh_budget_wait.sh ]; then bash .publish-tooling/scripts/ci/gh_budget_wait.sh --install; fi

      # Why: docs/ci/nightly-workflow-notes.md#note-8
      - name: Download nightly variant artifacts (parallel)
        id: variants-parallel
        continue-on-error: true
        timeout-minutes: 10
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VARIANT_PATTERN: ${{ steps.source.outputs.variant_pattern }}
        run: python3 .publish-tooling/scripts/ci/download-run-artifact.py --pattern "$VARIANT_PATTERN" --out nightly-out --connections 32

      - name: Download nightly variant artifacts
        if: steps.variants-parallel.outcome != 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: ${{ steps.source.outputs.variant_pattern }}
          path: nightly-out
          merge-multiple: true

      # Publish only the bytes that a job without secrets verified:
      # verify-final-dmg-nightly for this run's build, verify-recovered-nightly-next
      # for a continued one.
      - name: Download verified DMG digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: ${{ steps.source.outputs.tested_pattern }}
          path: tested
          merge-multiple: true

      - &x80
        name: Require every DMG to match a tested digest
        if: ${{ !env.LEFT_SLOT }}
        run: bash .publish-tooling/scripts/ci/nightly-steps/publish-require-tested-digest.sh

      - name: Download SSH daemon assets for publication
        if: steps.source.outputs.source == 'own'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: cmux-nightly-remote-daemon
          path: nightly-out

      # One nightly-next feed writer at a time across runs (publish-lease.sh), from the first
      # feed read to the read-back. TTL 15 minutes, renewed every minute by a heartbeat that
      # dies with the job, so a dead holder blocks the feed one TTL, inside its 30-minute
      # freshness bound; publish-release-notes passes the same TTL, since a waiter judges
      # expiry by its own. Max hold: this job's 180-minute timeout. The wait (60 minutes) is
      # added to the timeout.
      - &x81
        name: Take the nightly-next publish lease
        id: lease
        if: needs.decide.outputs.track == 'nightly-next' && !env.LEFT_SLOT
        env: &next-publish-lease
          AWS_ACCESS_KEY_ID: ${{ secrets.NIGHTLY_NEXT_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.NIGHTLY_NEXT_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: "https://${{ secrets.NIGHTLY_NEXT_R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
          # Shared with publish-release-notes: notes ordering relies on the same lock.
          LEASE_KEY: nightly-next/locks/publish-nightly-next.json
          LEASE_OWNER: ${{ github.run_id }}-${{ github.run_attempt }}
          LEASE_TTL: 900
          LEASE_RENEW: 60
          LEASE_MAX_HOLD: 10800
          LEASE_WAIT: 3600
        run: bash .publish-tooling/scripts/ci/nightly-steps/publish-lease.sh lock

      - &x82
        name: Recheck the recovered build against both feeds
        id: recheck
        if: (needs.decide.outputs.track == 'nightly-next' || steps.source.outputs.source == 'recovered') && !env.LEFT_SLOT
        run: bash .publish-tooling/scripts/ci/nightly-steps/publish-recheck-recovered.sh

      - &x83
        name: Verify SSH daemon assets survived artifact transfer
        if: steps.recheck.outputs.already_published != 'true' && !env.LEFT_SLOT
        run: |
          python3 scripts/verify_remote_daemon_release.py \
            --manifest "nightly-out/cmuxd-remote-manifest-${NIGHTLY_BUILD}.json" \
            --assets-dir nightly-out

      - &x84
        name: Assemble legacy nightly names
        if: steps.recheck.outputs.already_published != 'true' && !env.LEFT_SLOT
        run: bash .publish-tooling/scripts/ci/nightly-steps/publish-assemble-legacy-names.sh

      - &x85
        name: Prepare nightly release notes and appcast summaries
        id: notes
        if: needs.decide.outputs.should_publish == 'true' && steps.recheck.outputs.already_published != 'true' && !env.LEFT_SLOT
        timeout-minutes: 70
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES_HEAD: ${{ steps.source.outputs.build_sha }}
          PUBLISHED_SHA: ${{ needs.decide.outputs.published_sha }}
          NOTES_BRANCH: ${{ needs.decide.outputs.track == 'nightly-next' && 'feat-cmux-next' || github.ref_name }}
          # nightly-next ships as cmux NIGHTLY (hq#7156).
          NOTES_APP_NAME: ${{ needs.decide.outputs.track == 'nightly-next' && 'cmux NIGHTLY' || needs.decide.outputs.app_name }}
          NOTES_BUNDLE_ID: ${{ needs.decide.outputs.track == 'nightly-next' && 'com.cmuxterm.app.nightly' || needs.decide.outputs.bundle_id }}
        run: bash .publish-tooling/scripts/ci/nightly-steps/publish-prepare-release-notes.sh

      - name: Upload branch nightly artifacts
        id: upload-branch-nightly-artifacts
        continue-on-error: true
        if: needs.decide.outputs.should_publish != 'true' && steps.recheck.outputs.already_published != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-nightly-${{ steps.source.outputs.build_short_sha }}
          retention-days: 7
          overwrite: true
          path: |
            nightly-out/${{ needs.decide.outputs.dmg_prefix }}*.dmg
            nightly-out/${{ needs.decide.outputs.dmg_prefix }}*.delta
            nightly-out/appcast*.xml
            nightly-out/cmuxd-remote-*
          if-no-files-found: error

      - name: Upload branch nightly artifacts (retry)
        if: "!cancelled() && steps.upload-branch-nightly-artifacts.outcome == 'failure' && (needs.decide.outputs.should_publish != 'true' && steps.recheck.outputs.already_published != 'true')"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-nightly-${{ steps.source.outputs.build_short_sha }}
          retention-days: 7
          path: |
            nightly-out/${{ needs.decide.outputs.dmg_prefix }}*.dmg
            nightly-out/${{ needs.decide.outputs.dmg_prefix }}*.delta
            nightly-out/appcast*.xml
            nightly-out/cmuxd-remote-*
          if-no-files-found: error
          overwrite: true

      - &x86
        name: Guard nightly-next publication
        if: needs.decide.outputs.should_publish == 'true' && needs.decide.outputs.track == 'nightly-next' && steps.recheck.outputs.already_published != 'true' && !env.LEFT_SLOT
        run: bash .publish-tooling/scripts/ci/nightly-steps/publish-guard-nightly-next.sh

      # cx-f76kf: decide reads NIGHTLY_NEXT_WRITER only when the run starts, and
      # the HQ Linux pipeline publishes nightly-next while it is linux, so the
      # gate reads it again live. vars.* is fixed at run start and GITHUB_TOKEN
      # cannot read variables: the release App reads it (Variables: read).
      # A failed mint leaves the token empty, and the gate refuses.
      - &x87
        name: Mint release App token
        id: writer-token
        if: needs.decide.outputs.should_publish == 'true' && needs.decide.outputs.track == 'nightly-next' && steps.recheck.outputs.already_published != 'true' && !env.LEFT_SLOT
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.CMUX_RELEASE_APP_ID }}
          private-key: ${{ secrets.CMUX_RELEASE_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      # Why: docs/ci/nightly-workflow-notes.md#note-14
      - &x88
        name: Read the Dev ring switch live
        id: ring
        if: needs.decide.outputs.should_publish == 'true' && needs.decide.outputs.track == 'nightly-next' && steps.recheck.outputs.already_published != 'true' && !env.LEFT_SLOT
        env:
          RING_TOKEN: ${{ steps.writer-token.outputs.token }}
        run: bash .publish-tooling/scripts/ci/nightly_next_dev_ring.sh --github-output "$GITHUB_OUTPUT"

      - name: Final publication gate
        id: gate
        if: needs.decide.outputs.should_publish == 'true' && steps.recheck.outputs.already_published != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          WRITER_TOKEN: ${{ steps.writer-token.outputs.token }}
          REQUIRED: ${{ vars.NIGHTLY_LEGACY_REQUIRED_COMMITS }}
          SOURCE: ${{ steps.source.outputs.source }}
          BUILD_SHA: ${{ steps.source.outputs.build_sha }}
          WEBVIEW_CHECK: ${{ needs.check-nightly-webviews.result }}
          NIGHTLY_COMPONENT_GATES: ${{ vars.NIGHTLY_COMPONENT_GATES }}
          WEBVIEW_CHECK_SHA: ${{ needs.check-nightly-webviews.outputs.sha }}
          SHELF_CHECK: ${{ needs.check-nightly-app-store-shelf.result }}
          SHELF_CHECK_SHA: ${{ needs.check-nightly-app-store-shelf.outputs.sha }}
