name: Nightly macOS build
# A promotion request's title names its commit, so the promote guard can find
# requests GitHub cancelled in its queue (REQUEST_TITLE in
# scripts/ci/promote-nightly-next.mjs). An unsigned resume's title names the run
# and attempt it resumes, so main's feed watch counts its resumes of each failed
# run (scripts/ci/nightly_next_unsigned_resume.py on main dispatches nothing
# until this title is here). Every other run keeps the default title.
# The exact run/SHA marker opts ordinary NEXT builds into controller demand.
# Dedicated runs retain the marker across reruns; the controller vetoes their
# actual current-attempt decide runner. Unsigned-resume titles stay anchored.
run-name: >-
  ${{ inputs.promote_nightly_next_sha && format('Promote nightly-next to {0}', inputs.promote_nightly_next_sha)
      || github.event_name == 'schedule' && format('Nightly macOS build · {0}', github.event.schedule)
      || inputs.nightly_next_unsigned_run && format('Resume nightly-next run {0} attempt {1}', inputs.nightly_next_unsigned_run, inputs.nightly_next_unsigned_attempt)
      || github.repository == 'manaflow-ai/cmux' && github.ref == 'refs/heads/nightly-next'
        && contains(fromJSON('["push","workflow_dispatch"]'), github.event_name)
        && vars.CI_NIGHTLY_ADMISSION_CHECKS == '1' && inputs.nightly_next_unsigned_run == ''
        && format('NEXT Linux admission v1: {0}/{1} | {2}', github.run_id, github.sha, github.workflow)
      || '' }}

# Publish channels, resolved once in `decide`: `main` publishes cmux NIGHTLY, `rc/**` cmux RC,
# `nightly-next` cmux NEXT (own bundle id, release, Sparkle key and feed; cx-x7hwx), each
# feed advancing only in its channel. publish-nightly-identity-legacy re-signs NEXT builds
# for pre-NEXT installs. Only main's promote-nightly-next moves `nightly-next` (release-next
# environment).
on:
  # Publish changed main revisions, at most once per NIGHTLY_PUSH_MIN_INTERVAL_HOURS
  # of published-commit age (see `decide`), while keeping the scheduled cache warm.
  # Publish every push to a release-candidate branch as the RC channel.
  push:
    branches:
      - main
      - "rc/**"
      - nightly-next
  schedule:
    - cron: "17 */6 * * *"
    - cron: "47 8 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild an already published main commit. Manual runs always bypass the push throttle.
        required: false
        default: false
        type: boolean
      fast:
        description: Build one arm64 dogfood DMG without Intel or Sparkle delta work
        required: false
        default: false
        type: boolean
      build_only:
        description: Measure the unsigned universal build only. Never builds the helper, signs, notarizes, uploads dSYMs, or publishes.
        required: false
        default: false
        type: boolean
      seed_only:
        description: Warm the Debug and Release caches only. Never builds or publishes an app artifact.
        required: false
        default: false
        type: boolean
      cold_cache:
        description: Skip the Xcode compilation cache restore so the measurement run is a cache miss. Only honoured with build_only.
        required: false
        default: false
        type: boolean
      cache_backend:
        description: Cache store for this run. `default` follows the CI_CACHE_BACKEND repository variable.
        required: false
        default: default
        type: choice
        options:
          - default
          - github
          - warp
          - r2
      notary_test_without_password_import:
        description: nightly-next only. One diagnostic notary submission (cx-f58x) of a build with the browser password-import readers compiled out (CMUX_NO_PASSWORD_IMPORT). Notarizes even with NIGHTLY_NEXT_NOTARY_PAUSED=1 and publishes nothing.
        required: false
        default: false
        type: boolean
      notary_test_without_browser_data_import:
        description: nightly-next only. Like notary_test_without_password_import, and also compiles out every read of another browser's files or Keychain items (CMUX_NO_BROWSER_DATA_IMPORT) and ships an empty browser-sources.json. One app notary submission (plus the Computer Use helper's), nothing published.
        required: false
        default: false
        type: boolean
      notary_test_import_part:
        description: nightly-next only. cx-f58x notary bisect. One diagnostic notary submission of a build with exactly this one browser-import part compiled out (cookies = CMUX_NO_COOKIE_IMPORT, safe-storage = CMUX_NO_SAFE_STORAGE_READ, history = CMUX_NO_HISTORY_IMPORT, registry = empty browser-sources.json). Every other import part stays in. Nothing is published.
        required: false
        default: none
        type: choice
        options:
          - none
          - cookies
          - safe-storage
          - history
          - registry
      notary_probe_production_identity:
        description: nightly-next only. One app notary submission (plus the Computer Use helper's) of this build as the production identity (com.cmuxterm.app, cmux.release.entitlements, release profile) with the browser-data import compiled out. There is no Sparkle key or feed, no DMG or app artifact, and no recovery artifact. Only text receipts are uploaded and nothing is published.
        required: false
        default: false
        type: boolean
      nightly_next_continue_only:
        description: nightly-next only. Build nothing and submit nothing to Apple. Continue the newest earlier nightly-next build whose notarization Apple has since Accepted, and publish it through the normal guarded publication.
        required: false
        default: false
        type: boolean
      nightly_next_unsigned_run:
        description: nightly-next only. Resume signing and publication from this completed push run's unsigned app, without compiling again.
        required: false
        default: ''
        type: string
      nightly_next_unsigned_attempt:
        description: Exact source run attempt that produced the saved unsigned app (required with nightly_next_unsigned_run).
        required: false
        default: ''
        type: string
      promote_nightly_next_sha:
        description: Main only. Move branch nightly-next to this green feat-cmux-next commit (40 hex) and build nothing in this run; the push run on nightly-next publishes it. Prefix it with "dry-run:" to only decide and print why, moving nothing.
        required: false
        default: ''
        type: string
      promote_nightly_next_debounce:
        description: Skip the promotion when a nightly-next build started within NIGHTLY_NEXT_MIN_INTERVAL_HOURS (set by the automatic request).
        required: false
        default: false
        type: boolean
      probe_target_sha:
        description: Full SHA that directly changes a workflow file for the scratch-tag probe.
        required: false
        default: ''
        type: string
      probe_mode:
        description: Scratch-tag permission probe. `off` runs the normal workflow; any other value runs only the probe (no build or publish) with that credential path; run github-token first, then app-token.
        required: false
        default: 'off'
        type: choice
        options:
          - 'off'
          - both
          - github-token
          - app-token
      sign_pool:
        description: nightly-next only. Also sign, notarize and check this build on the release runner pool (signer-* jobs); publication is unchanged.
        required: false
        default: false
        type: boolean

concurrency:
  # Each lane has its own group and a newer run replaces only a pending one; an in-flight
  # nightly always finishes. nightly-next has its own group: sharing main's (#18150) let every
  # main push replace the pending nightly-next run (run 37579667979), so it starved. Scheduled
  # and manual cache seeds use different groups, so a tick never cancels a manual refresh.
  # NEXT runs are run-scoped; the release/feed writers keep their own groups below.
  group: nightly-build-${{ github.ref_name == 'main' && 'nightly-shared' || github.ref_name }}-${{ github.ref == 'refs/heads/nightly-next' && format('run-{0}', github.run_id) || github.event_name == 'workflow_dispatch' && inputs.promote_nightly_next_sha != '' && format('nightly-next-promote-{0}', github.run_id) || github.event_name == 'schedule' && github.event.schedule == '17 */6 * * *' && 'cache-seed-scheduled' || inputs.seed_only && 'cache-seed-manual' || github.event_name == 'workflow_dispatch' && github.event.inputs.build_only == 'true' && format('nightly-measure-{0}', github.run_id) || github.event_name == 'workflow_dispatch' && inputs.nightly_next_continue_only && format('continue-{0}', github.run_id) || github.event_name == 'workflow_dispatch' && (inputs.notary_test_without_password_import || inputs.notary_test_without_browser_data_import || inputs.notary_probe_production_identity || (inputs.notary_test_import_part || 'none') != 'none') && format('notary-test-{0}', github.run_id) || (github.event_name == 'workflow_dispatch' && github.event.inputs.fast == 'true' && 'fast' || 'full') }}
  cancel-in-progress: false

permissions: {}

env:
  # Main's promote guard reads this exact line (promote-nightly-next.mjs G5); see resolve-tree-pending.sh.
  NIGHTLY_NEXT_TREE_AT_INSTALL: v1
  CREATE_DMG_VERSION: 8.0.0
  CI_CACHE_R2_PUBLIC_URL: ${{ vars.CI_CACHE_R2_PUBLIC_URL || 'https://ci-cache.cmux.com' }}
  # The cmux-next track (branch `nightly-next`). The feed base must never be
  # main's nightly or RC feed; scripts/ci/nightly-next-guard.py refuses it.
  # cmux NEXT's feed (cx-x7hwx). It keeps "/nightly-next/" in its path:
  # UpdateFeedResolver classifies the track by it. Release notes sit beside it.
  NIGHTLY_NEXT_FEED_BASE: https://files-next.cmux.com/nightly-next/next
  # The feed of the cmux NIGHTLY-identity nightly-next builds before cmux NEXT.
  # Only job publish-nightly-identity-legacy writes it: each cmux NEXT build, signed
  # as cmux NIGHTLY, so those installs keep updating with their data (cx-x7hwx).
  # Build numbers stay above it.
  NIGHTLY_NEXT_LEGACY_FEED_BASE: https://files-next.cmux.com/nightly-next
  # cmux-next's own version line (CFBundleShortVersionString
  # <V>-nightly.<build>) comes from cmux-tui/Cargo.toml [workspace.package]
  # (`scripts/ci/nightly_version.py next-base`), the version the bundled CLIs
  # print too; main's nightly and RC keep the project version.
  NIGHTLY_NEXT_R2_BUCKET: cmux-nightly-next
  NIGHTLY_NEXT_R2_PREFIX: nightly-next/next/
  # SUPublicEDKey of the cmux-next track. The build refuses a
  # SPARKLE_NEXT_PRIVATE_KEY that does not derive this public key.
  NIGHTLY_NEXT_SPARKLE_PUBLIC_KEY: IOPItMLjtc4NsROTNZ6a/jsUW+C4fcicl6SNjVVvzRM=
  # cx-f58x (Lawrence, 2026-10-09): Apple notarizes nightly-next only with the
  # browser-data import compiled out. On commit 73210f2 the normal build
  # (de5255b1) got status 7000 and the compiled-out build (52c6c12d) was
  # Accepted. While this is `compiled-out`, every nightly-next build compiles
  # the import out (CMUX_NO_PASSWORD_IMPORT, CMUX_NO_BROWSER_DATA_IMPORT, empty
  # browser-sources.json), proves it, and may notarize and publish even with
  # NIGHTLY_NEXT_NOTARY_PAUSED=1. Any other value builds the import in, and the
  # pause then still stops that build before notarization, so a build with the
  # import is never published while the pause is set.
  NIGHTLY_NEXT_BROWSER_DATA_IMPORT: compiled-out

jobs:
  decide:
    environment: ci-routing-agent
    permissions:
      actions: read
      checks: read # Read authenticated controller receipts; no App or secret expansion.
      contents: read
    if: github.event_name != 'workflow_dispatch' || ((inputs.probe_mode || 'off') == 'off' && inputs.promote_nightly_next_sha == '')
    # Explicit nightly-only reservation; unset keeps the existing bootstrap and retry routes.
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.repository == 'manaflow-ai/cmux' && github.ref == 'refs/heads/nightly-next' && github.run_attempt == 1 && vars.CI_NIGHTLY_ONLY_RUNNER == 'glaeda-nightly-only-m4pro' && vars.CI_NIGHTLY_ONLY_RUNNER || github.run_attempt == 1 && 'ubuntu-24.04' || vars.LINUX_RUNNER == 'blacksmith-16vcpu-ubuntu-2404' && 'blacksmith-16vcpu-ubuntu-2404' || 'blacksmith-32vcpu-ubuntu-2404' }}
    outputs:
      early_admission_ready: ${{ steps.place-early.outputs.admission_ready }}
      early_build_nightly_inputs_runner: ${{ steps.place-early.outputs.build_nightly_inputs_runner }}
      early_find_nightly_next_recovery_runner: ${{ steps.place-early.outputs.find_nightly_next_recovery_runner }}
      early_resolve_nightly_tui_client_runner: ${{ steps.place-early.outputs.resolve_nightly_tui_client_runner }}
      early_resolve_nightly_ghostty_cli_helper_runner: ${{ steps.place-early.outputs.resolve_nightly_ghostty_cli_helper_runner }}
      early_linux_runner: ${{ steps.place-early-mac.outputs.linux_runner }}
      early_linux_jobs: ${{ steps.place-early-mac.outputs.linux_jobs }}
      early_mini_runner: ${{ steps.place-early-mac.outputs.mini_runner }}
      early_mini_jobs: ${{ steps.place-early-mac.outputs.mini_jobs }}
      early_attempt: ${{ github.run_attempt }}
      should_build: ${{ steps.decide.outputs.should_build }}
      head_sha: ${{ steps.decide.outputs.head_sha }}
      short_sha: ${{ steps.decide.outputs.short_sha }}
      published_sha: ${{ steps.decide.outputs.published_sha }}
      should_publish: ${{ steps.decide.outputs.should_publish }}
      notary_paused: ${{ steps.decide.outputs.notary_paused }}
      import_paused: ${{ steps.decide.outputs.import_paused }}
      notary_test: ${{ steps.decide.outputs.notary_test }}
      notary_test_browser_data: ${{ steps.decide.outputs.notary_test_browser_data }}
      no_publish: ${{ steps.decide.outputs.no_publish }}
      continue_only: ${{ steps.decide.outputs.continue_only }}
      import_variant: ${{ steps.decide.outputs.import_variant }}
      swift_import_flags: ${{ steps.decide.outputs.swift_import_flags }}
      empty_browser_sources: ${{ steps.decide.outputs.empty_browser_sources }}
      password_readers_out: ${{ steps.decide.outputs.password_readers_out }}
      notary_probe: ${{ steps.decide.outputs.notary_probe }}
      sign_channel: ${{ steps.decide.outputs.sign_channel }}
      profile_channel: ${{ steps.decide.outputs.profile_channel }}
      variants: ${{ steps.decide.outputs.variants }}
      compile_archs: ${{ steps.decide.outputs.compile_archs }}
      feeds: ${{ steps.decide.outputs.feeds }}
      legacy_variant: ${{ steps.decide.outputs.legacy_variant }}
      fast_build: ${{ steps.decide.outputs.fast_build }}
      build_only: ${{ steps.decide.outputs.build_only }}
      force: ${{ steps.decide.outputs.force }}
      cold_cache: ${{ steps.decide.outputs.cold_cache }}
      channel: ${{ steps.decide.outputs.channel }}
      channel_upper: ${{ steps.decide.outputs.channel_upper }}
      track: ${{ steps.decide.outputs.track }}
      environment: ${{ steps.decide.outputs.environment }}
      bundle_id: ${{ steps.decide.outputs.bundle_id }}
      app_name: ${{ steps.decide.outputs.app_name }}
      url_scheme: ${{ steps.decide.outputs.url_scheme }}
      dmg_prefix: ${{ steps.decide.outputs.dmg_prefix }}
      release_tag: ${{ steps.decide.outputs.release_tag }}
      release_name: ${{ steps.decide.outputs.release_name }}
      feed_base: ${{ steps.decide.outputs.feed_base }}
      entitlements: ${{ steps.decide.outputs.entitlements }}
      icon_name: ${{ steps.decide.outputs.icon_name }}
    steps:
      - name: Check out the revision under consideration
        if: github.ref != 'refs/heads/nightly-next'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 1

      # NEXT's decision reads release metadata, not the app tree. Main's build-input
      # classifier still needs the full checkout above, including tracked referrers.
      - name: Check out NEXT decision and placement helpers
        if: github.ref == 'refs/heads/nightly-next'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 1
          sparse-checkout: |
            /.github/runners.json
            /scripts/ci/nightly-publication-marker.py
            /scripts/ci/portable_job_placement.py
            /scripts/ci/nightly_linux_admission.py
            /scripts/ci/nightly_admission_receipt.py
            /scripts/ci/fleet_admission_transport.py
            /scripts/ci/pr_runner_pool.py
            /scripts/ci/side_lane_placement.py
            /scripts/ci/next_macos_cascade.py
            /scripts/ci/simple_pool_picker.py
          sparse-checkout-cone-mode: false

      - name: Decide whether a nightly build is needed
        id: decide
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          FORCE_BUILD: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.force == 'true' && 'true' || 'false' }}
          FAST_BUILD: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.fast == 'true' && 'true' || 'false' }}
          BUILD_ONLY: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.build_only == 'true' && 'true' || 'false' }}
          SEED_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.seed_only && 'true' || 'false' }}
          COLD_CACHE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.cold_cache == 'true' && 'true' || 'false' }}
          PUSH_MIN_INTERVAL_HOURS: ${{ vars.NIGHTLY_PUSH_MIN_INTERVAL_HOURS || '2' }}
          NIGHTLY_NEXT_NOTARY_PAUSED: ${{ vars.NIGHTLY_NEXT_NOTARY_PAUSED || '' }}
          NIGHTLY_NEXT_WRITER: ${{ vars.NIGHTLY_NEXT_WRITER || 'mac' }}
          NIGHTLY_NEXT_SUBMISSIONS_PAUSED: ${{ vars.NIGHTLY_NEXT_SUBMISSIONS_PAUSED || '' }}
          NOTARY_TEST_PASSWORDS: ${{ github.event_name == 'workflow_dispatch' && inputs.notary_test_without_password_import && 'true' || 'false' }}
          NOTARY_TEST_BROWSER_DATA: ${{ github.event_name == 'workflow_dispatch' && inputs.notary_test_without_browser_data_import && 'true' || 'false' }}
          NOTARY_IMPORT_PART: ${{ github.event_name == 'workflow_dispatch' && inputs.notary_test_import_part || 'none' }}
          NOTARY_PROBE: ${{ github.event_name == 'workflow_dispatch' && inputs.notary_probe_production_identity && 'true' || 'false' }}
          UNSIGNED_RUN: ${{ inputs.nightly_next_unsigned_run }}
          UNSIGNED_ATTEMPT: ${{ inputs.nightly_next_unsigned_attempt }}
          CONTINUE_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.nightly_next_continue_only && 'true' || 'false' }}
        with:
          script: |
            // GitHub API rate limits (the installation's shared hourly budget, or a secondary limit) must not
            // fail the nightly: run 41153241702's decide died on "API rate limit exceeded for installation".
            // Every request this script makes waits for the limit's reset (Retry-After, else x-ratelimit-reset,
            // capped at 10 minutes a wait, 20 minutes in all) and tries again; any other error is unchanged.
            if (github.hook && typeof github.hook.wrap === 'function') github.hook.wrap('request', async (request, options) => {
              const deadline = Date.now() + 20 * 60 * 1000;
              for (let attempt = 1; ; attempt += 1) {
                try {
                  return await request(options);
                } catch (error) {
                  const status = error && error.status;
                  const headers = (error && error.response && error.response.headers) || {};
                  const message = String((error && error.message) || '');
                  const limited = (status === 403 || status === 429) &&
                    (headers['x-ratelimit-remaining'] === '0' || headers['retry-after'] !== undefined || /rate limit/i.test(message));
                  if (!limited || Date.now() >= deadline) throw error;
                  const retryAfter = Number(headers['retry-after']);
                  const reset = Number(headers['x-ratelimit-reset']);
                  let waitMs = Number.isFinite(retryAfter) && retryAfter > 0 ? retryAfter * 1000
                    : Number.isFinite(reset) && reset > 0 ? reset * 1000 - Date.now() + 2000
                    : Math.min(60000 * attempt, 300000);
                  waitMs = Math.max(5000, Math.min(waitMs, 600000, deadline - Date.now()));
                  core.warning(`GitHub API rate limited (${status}) on ${options.method} ${options.url}; retrying in ${Math.round(waitMs / 1000)} s (attempt ${attempt})`);
                  await new Promise((resolve) => setTimeout(resolve, waitMs));
                }
              }
            });
            const unsignedResume = Boolean(process.env.UNSIGNED_RUN || process.env.UNSIGNED_ATTEMPT);
            if (unsignedResume && (context.eventName !== 'workflow_dispatch' || context.ref !== 'refs/heads/nightly-next' ||
                !/^[1-9][0-9]*$/.test(process.env.UNSIGNED_RUN || '') || !/^[1-9][0-9]?$/.test(process.env.UNSIGNED_ATTEMPT || '') ||
                ['BUILD_ONLY', 'SEED_ONLY', 'FAST_BUILD', 'CONTINUE_ONLY', 'NOTARY_TEST_PASSWORDS', 'NOTARY_TEST_BROWSER_DATA', 'NOTARY_PROBE'].some(key => process.env[key] === 'true') ||
                (process.env.NOTARY_IMPORT_PART || 'none') !== 'none')) {
              core.setFailed('unsigned resume requires an exact run/attempt on nightly-next, with no other build or notary mode');
              return;
            }
            const forceBuild = unsignedResume || process.env.FORCE_BUILD === 'true';
            const seedOnly = process.env.SEED_ONLY === 'true';
            // A build-only run measures the unsigned universal app build (cold
            // or warm cache) and stops there: no helper, signing, notarization,
            // dSYM upload, or publication, so it is safe to dispatch from a
            // branch. It always builds the production workload, so the fast
            // arm64 path is ignored, and it never depends on the nightly tag.
            const buildOnly = process.env.BUILD_ONLY === 'true';
            const coldCache = buildOnly && process.env.COLD_CACHE === 'true';
            const fastBuild = !buildOnly && process.env.FAST_BUILD === 'true';
            core.setOutput('fast_build', fastBuild ? 'true' : 'false');
            core.setOutput('build_only', buildOnly ? 'true' : 'false');
            core.setOutput('cold_cache', coldCache ? 'true' : 'false');
            const { owner, repo } = context.repo;
            const requestedRef = context.ref.startsWith('refs/heads/')
              ? context.ref.replace('refs/heads/', '')
              : 'main';
            const isMainRef = requestedRef === 'main';
            // `rc/<version>` branches publish the RC channel. Any other
            // non-main ref is a branch dogfood run that publishes nothing.
            const isRcRef = requestedRef.startsWith('rc/');
            // `nightly-next` publishes the cmux-next track (see the header).
            const isNextRef = requestedRef === 'nightly-next';
            const isTrackRef = isMainRef || isNextRef;
            const channel = isRcRef ? 'rc' : 'nightly';
            const track = isRcRef ? 'rc' : isNextRef ? 'nightly-next' : 'nightly';
            // Nightly ships one universal DMG for downloads plus one thin DMG per
            // architecture for updates. Browsers cannot tell Apple silicon from
            // Intel, so `cmux-nightly-macos.dmg` and the legacy `appcast.xml`
            // feed stay universal; the app's feed resolver moves every install
            // onto its architecture's feed at the first update check.
            // A manually dispatched fast build is a branch-dogfood artifact only.
            // It deliberately produces one Apple silicon DMG and never publishes
            // to the shared NIGHTLY release or feed.
            // nightly-next ships arm64 only (Leo, 2026-10-07): one DMG notarization per
            // build instead of three, after Apple's queue held all three past the wait in
            // runs 37648507383 and 37667249069. Its x86_64, universal and legacy feeds keep
            // their last build, so an Intel Mac is never offered an arm64-only app.
            const variants = fastBuild || track === 'nightly-next' ? ['arm64'] : ['arm64', 'x86_64', 'universal'];
            // Compile only the slices these variants consume. nightly-next
            // ships arm64 only; compiling Intel here still paid for a second
            // whole-module Swift compile and both slices of the Rust helpers.
            const compileArchs = variants.includes('universal') ? ['arm64', 'x86_64'] : variants;
            const feeds = track === 'nightly-next'
              ? ['appcast-arm64.xml']
              : ['appcast-arm64.xml', 'appcast-x86_64.xml', 'appcast-universal.xml', 'appcast.xml'];
            core.setOutput('variants', JSON.stringify(variants));
            core.setOutput('compile_archs', compileArchs.join(' '));
            core.setOutput('feeds', feeds.join(' '));
            core.setOutput('legacy_variant', 'universal');
            const channelIdentity = {
              nightly: {
                bundleId: 'com.cmuxterm.app.nightly',
                appName: 'cmux NIGHTLY',
                urlScheme: 'cmux-nightly',
                dmgPrefix: 'cmux-nightly-macos',
                releaseTag: 'nightly',
                releaseName: 'Nightly',
                feedBase: 'https://files.cmux.com/nightly',
                entitlements: 'cmux.nightly.entitlements',
                iconName: 'AppIcon-Nightly',
              },
              rc: {
                bundleId: 'com.cmuxterm.app.rc',
                appName: 'cmux RC',
                urlScheme: 'cmux-rc',
                dmgPrefix: 'cmux-rc-macos',
                releaseTag: 'rc',
                releaseName: 'Release Candidate',
                feedBase: 'https://files.cmux.com/rc',
                entitlements: 'cmux.rc.entitlements',
                iconName: 'AppIcon-RC',
              },
              // cmux NEXT installs beside cmux NIGHTLY (cx-x7hwx). A tagged
              // nightly bundle id gives it its own control socket
              // (/tmp/cmux-nightly-cmux-next.sock), daemon session and state
              // and keeps Sparkle on (com.cmuxterm.app.debug.* never updates).
              // Signed without a provisioning profile: no passkeys in the
              // browser, auth tokens in a file, no keychain-backed iroh pairing.
              'nightly-next': {
                bundleId: 'com.cmuxterm.app.nightly.cmux-next',
                appName: 'cmux NEXT',
                urlScheme: 'cmux-next',
                dmgPrefix: 'cmux-nightly-next-macos',
                releaseTag: 'nightly-next',
                releaseName: 'Nightly (cmux-next)',
                feedBase: process.env.NIGHTLY_NEXT_FEED_BASE,
                entitlements: 'cmux.next-dev.entitlements',
                iconName: 'AppIcon-Nightly',
              },
            }[track];
            // The production-identity notary probe (cx-f58x): this build is
            // signed and notarized as the stable app. It never gets a feed, a
            // Sparkle key, a release or a DMG artifact (see notary_probe below).
            const notaryProbe = track === 'nightly-next' && process.env.NOTARY_PROBE === 'true';
            if (notaryProbe) {
              Object.assign(channelIdentity, {
                bundleId: 'com.cmuxterm.app',
                appName: 'cmux',
                dmgPrefix: 'cmux-next-prodprobe-macos',
                // releaseTag stays nightly-next: the SSH daemon manifest is
                // named after it. Publication is off (no_publish), so the tag
                // is never written.
                releaseName: 'Production-identity notary probe',
                feedBase: '',
                entitlements: 'cmux.release.entitlements',
                iconName: 'AppIcon',
              });
            }
            core.setOutput('notary_probe', notaryProbe ? 'true' : 'false');
            core.setOutput('sign_channel', notaryProbe ? 'stable' : track === 'nightly-next' ? 'next' : channel);
            // cmux NEXT embeds no provisioning profile.
            core.setOutput('profile_channel', notaryProbe ? 'RELEASE' : track === 'nightly-next' ? '' : channel.toUpperCase());
            core.setOutput('channel', channel);
            core.setOutput('track', track);
            core.setOutput('environment', isNextRef ? 'release-next' : 'release');
            core.setOutput('channel_upper', channel.toUpperCase());
            core.setOutput('bundle_id', channelIdentity.bundleId);
            core.setOutput('app_name', channelIdentity.appName);
            core.setOutput('url_scheme', channelIdentity.urlScheme);
            core.setOutput('dmg_prefix', channelIdentity.dmgPrefix);
            core.setOutput('release_tag', channelIdentity.releaseTag);
            core.setOutput('release_name', channelIdentity.releaseName);
            core.setOutput('feed_base', channelIdentity.feedBase);
            core.setOutput('entitlements', channelIdentity.entitlements);
            core.setOutput('icon_name', channelIdentity.iconName);

            // Pin every run to the revision that triggered it. In particular,
            // queued main pushes must each build their own merge commit instead
            // of all resolving to whichever commit is newest when `decide` runs.
            const headSha = context.sha;

            // The channel's release tag is the fast completion marker. The
            // release body is the publication record: it also tells us that a
            // previous run finished uploading this exact commit even when the
            // tag move was refused after the assets and feeds were live.
            let nightlySha = null;
            if (isTrackRef) {
              try {
                const ref = await github.rest.git.getRef({
                  owner,
                  repo,
                  ref: `tags/${channelIdentity.releaseTag}`,
                });
                if (ref.data.object.type === 'commit') {
                  nightlySha = ref.data.object.sha;
                } else if (ref.data.object.type === 'tag') {
                  const tagObject = await github.rest.git.getTag({
                    owner,
                    repo,
                    tag_sha: ref.data.object.sha,
                  });
                  nightlySha = tagObject.data.object.sha;
                }
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }

            let publishedSha = null;
            const canReadReleaseMarker =
              typeof github.rest.repos?.getReleaseByTag === 'function' &&
              typeof exec !== 'undefined' &&
              typeof exec.getExecOutput === 'function';
            if (canReadReleaseMarker) {
              try {
                const release = await github.rest.repos.getReleaseByTag({
                  owner,
                  repo,
                  tag: channelIdentity.releaseTag,
                });
                const marker = await exec.getExecOutput(
                  'python3',
                  ['scripts/ci/nightly-publication-marker.py'],
                  { input: Buffer.from(release.data.body || '') },
                );
                publishedSha = marker.stdout.trim() || null;
              } catch (error) {
                if (error.status === 404) {
                  // The first publication creates the release.
                } else {
                  core.warning(`Could not read the published ${channelIdentity.releaseTag} release marker; building: ${error.message}`);
                }
              }
            }

            // A nightly-next continuation run builds nothing of its own; it
            // only publishes an earlier build Apple has since accepted.
            const continueOnly = isNextRef && context.eventName === 'workflow_dispatch' && process.env.CONTINUE_ONLY === 'true';
            if (process.env.CONTINUE_ONLY === 'true' && !continueOnly) {
              core.setFailed('nightly_next_continue_only runs only on nightly-next');
            }
            core.setOutput('continue_only', continueOnly ? 'true' : 'false');
            const alreadyPublished = !continueOnly && !buildOnly && !forceBuild && (isTrackRef || isRcRef) && publishedSha === headSha;
            let shouldBuild = !seedOnly && !alreadyPublished && (buildOnly || !isTrackRef || forceBuild || nightlySha !== headSha);
            // The six-hour schedule only warms caches downstream, and keeps
            // its eligibility outputs as they are so that routing still works.
            // It is named here because the build-input check below leaves it
            // alone, and it explains the final app workload further down.
            const scheduledCacheOnly = context.eventName === 'schedule' &&
              context.payload?.schedule === '17 */6 * * *';

            // A different commit is not a different app. Web, documentation
            // and CI-only merges land between the changes that can alter app
            // bytes, and each one otherwise costs a full publishing build, so
            // compare the paths changed since the published commit rather than
            // the commit itself. Only a proven-neutral change skips: a partial
            // comparison, an unknown path, or an API failure builds, force and
            // manual dispatch never consult this, and the daily catch-up
            // schedule still publishes main HEAD as a backstop.
            let unchangedBuildInputs = false;
            let buildInputReason = null;
            if (
              shouldBuild &&
              isMainRef &&
              nightlySha &&
              !forceBuild &&
              !buildOnly &&
              // A person asking for this revision by hand gets it, and the
              // 08:47 UTC catch-up still publishes main HEAD every day. That
              // keeps one daily build as a backstop, so a path this check
              // wrongly classifies costs at most a day of staleness.
              context.eventName !== 'workflow_dispatch' &&
              context.eventName !== 'schedule'
            ) {
              try {
                const { data } = await github.rest.repos.compareCommitsWithBasehead({
                  owner,
                  repo,
                  basehead: `${nightlySha}...${headSha}`,
                });
                // Cumulative since the last published commit, not since the
                // previous push. A three-dot comparison only spans that whole
                // gap when the published commit is the merge base. GitHub
                // caps the file list at 300 entries and paginates commits, so
                // require a list that is under the cap and a commit count that
                // matches the total: a partial answer must not read as proof.
                const files = data.files;
                if (
                  data.status === 'ahead' &&
                  data.merge_base_commit?.sha === nightlySha &&
                  data.total_commits === data.commits?.length &&
                  Array.isArray(files) &&
                  files.length > 0 &&
                  files.length < 300
                ) {
                  const paths = files.flatMap((file) =>
                    [file.filename, file.previous_filename].filter(Boolean));
                  const classified = await exec.getExecOutput(
                    'python3',
                    ['scripts/ci/nightly_build_inputs.py', '--files-from', '-'],
                    { input: Buffer.from(`${paths.join('\n')}\n`) },
                  );
                  const decision = JSON.parse(classified.stdout.trim());
                  unchangedBuildInputs = decision.build_inputs_changed === false;
                  buildInputReason = decision.reason;
                }
              } catch (error) {
                core.warning(`Could not prove the Nightly build inputs unchanged; building: ${error.message}`);
              }
            }
            if (unchangedBuildInputs) shouldBuild = false;

            // Push throttle. Main merges arrive faster than one nightly takes
            // to build, sign, and publish (about 45 minutes), so publishing
            // every push keeps the macOS pipeline busy around the clock and
            // most builds are replaced within the hour. A push to main skips
            // while the published commit is younger than the interval. Only
            // `push` events on main are throttled: RC branches, manual
            // dispatches, and both schedules decide exactly as before, and the
            // 08:47 UTC schedule still publishes whatever main HEAD is then.
            // Any lookup failure builds.
            const minIntervalHours = Number(process.env.PUSH_MIN_INTERVAL_HOURS);
            let publishedCommitAgeHours = null;
            let pushThrottled = false;
            if (
              shouldBuild &&
              context.eventName === 'push' &&
              isMainRef &&
              nightlySha &&
              Number.isFinite(minIntervalHours) &&
              minIntervalHours > 0
            ) {
              try {
                const published = await github.rest.git.getCommit({
                  owner,
                  repo,
                  commit_sha: nightlySha,
                });
                const committedAt = Date.parse(published.data.committer.date);
                if (Number.isFinite(committedAt)) {
                  publishedCommitAgeHours = (Date.now() - committedAt) / 3_600_000;
                  pushThrottled = publishedCommitAgeHours < minIntervalHours;
                }
              } catch (error) {
                core.warning(`Could not read the published ${channelIdentity.releaseTag} commit; building: ${error.message}`);
              }
            }
            let decisionReason;
            if (seedOnly) {
              decisionReason = 'Manual cache-only run: refresh compilation caches without building or publishing an app.';
            } else if (scheduledCacheOnly) {
              decisionReason = 'Scheduled cache warmup: refresh compilation caches only. The daily 08:47 UTC schedule is the app catch-up run.';
            } else if (unchangedBuildInputs) {
              decisionReason =
                `Skipping this build: nothing that reaches the app changed since ${nightlySha.slice(0, 7)} ` +
                `(${buildInputReason}). Use force=true in Run workflow to build this commit anyway.`;
            } else if (alreadyPublished) {
              decisionReason =
                `Skipping this build: ${channelIdentity.releaseTag} release metadata already records the exact ` +
                `published commit ${headSha}; a stale tag will be repaired by the next eligible publication. ` +
                'Use force=true in Run workflow to rebuild the same commit.';
            } else if (!shouldBuild) {
              decisionReason = 'This main commit is already published. Use force=true in Run workflow to rebuild the same commit; manual runs already bypass the push throttle.';
            } else if (pushThrottled) {
              decisionReason =
                `Skipping this push: ${channelIdentity.releaseTag} published ${nightlySha.slice(0, 7)}, ` +
                `committed ${publishedCommitAgeHours.toFixed(2)}h ago (minimum ${minIntervalHours}h). ` +
                'A later eligible push or the 08:47 UTC catch-up can publish an updated main revision. Run workflow bypasses this throttle; force is only needed to rebuild an already published commit.';
            } else if (buildOnly) {
              decisionReason = 'Manual build-only measurement: build the unsigned app without publishing.';
            } else if (fastBuild) {
              decisionReason = 'Manual fast dogfood build: build an arm64 artifact without publishing the Nightly feed.';
            } else if (context.eventName === 'workflow_dispatch') {
              decisionReason = 'Manual dispatch bypasses the push throttle; build the selected revision.';
            } else {
              decisionReason = 'The selected revision needs an app build and is not push-throttled.';
            }
            core.notice(decisionReason);

            const shouldPublish = !seedOnly && (isTrackRef || isRcRef) && !buildOnly && !fastBuild;
            const appBuildSelected = shouldBuild && !pushThrottled && !scheduledCacheOnly;
            // NIGHTLY_NEXT_WRITER governs publication: a nightly-next run that
            // publishes builds only while the Mac is the writer. Runs that never
            // publish (build-only, fast, notary test and probe dispatches) still build.
            const nextWriter = (process.env.NIGHTLY_NEXT_WRITER || 'mac').trim();
            const notaryDispatchInput = ['NOTARY_TEST_PASSWORDS', 'NOTARY_TEST_BROWSER_DATA', 'NOTARY_PROBE'].some((name) => process.env[name] === 'true')
              || (process.env.NOTARY_IMPORT_PART || 'none') !== 'none';
            const nextNotWriter = track === 'nightly-next' && shouldPublish && !notaryDispatchInput && nextWriter !== 'mac';
            if (nextNotWriter) {
              core.warning(`nightly-next writer is '${nextWriter || '<unset>'}' (repository variable NIGHTLY_NEXT_WRITER), not mac: this Mac pipeline builds and publishes nothing. Make the Mac the writer: gh variable set NIGHTLY_NEXT_WRITER -R manaflow-ai/cmux --body mac`);
            }
            core.setOutput('should_build', shouldBuild && !pushThrottled && !nextNotWriter ? 'true' : 'false');
            core.setOutput('head_sha', headSha);
            core.setOutput('force', forceBuild ? 'true' : 'false');
            core.setOutput('short_sha', headSha.slice(0, 7));
            core.setOutput('published_sha', publishedSha || '');
            core.setOutput('should_publish', shouldPublish ? 'true' : 'false');
            // cx-f58x notary tests: one nightly-next submission of a diagnostic
            // build, never published. Exactly one selector per run.
            const importPart = process.env.NOTARY_IMPORT_PART || 'none';
            const partFlags = {
              cookies: '-DCMUX_NO_COOKIE_IMPORT',
              'safe-storage': '-DCMUX_NO_SAFE_STORAGE_READ',
              history: '-DCMUX_NO_HISTORY_IMPORT',
              registry: '',
            };
            if (importPart !== 'none' && !(importPart in partFlags)) {
              core.setFailed(`unknown notary_test_import_part ${importPart}`);
            }
            const selectors = [
              process.env.NOTARY_TEST_PASSWORDS === 'true',
              process.env.NOTARY_TEST_BROWSER_DATA === 'true',
              importPart !== 'none',
              process.env.NOTARY_PROBE === 'true',
            ].filter(Boolean).length;
            if (continueOnly && selectors > 0) {
              core.setFailed('nightly_next_continue_only cannot be combined with a notary test input');
            }
            if (selectors > 1) {
              core.setFailed('choose one notary test input per run (password, browser data, import part, or production probe)');
            }
            const notaryDispatch = selectors > 0;
            const notaryTest = track === 'nightly-next' && notaryDispatch;
            if (notaryDispatch && !notaryTest) {
              core.setFailed('the notary test inputs run only on nightly-next');
            }
            // The browser-import code this build carries.
            const shipWithoutImport = track === 'nightly-next' && process.env.NIGHTLY_NEXT_BROWSER_DATA_IMPORT === 'compiled-out';
            let importVariant = 'full';
            let swiftImportFlags = '';
            let emptyBrowserSources = false;
            if (notaryTest && importPart !== 'none') {
              importVariant = `no-${importPart}`;
              swiftImportFlags = partFlags[importPart] || '';
              emptyBrowserSources = importPart === 'registry';
            } else if (notaryTest && process.env.NOTARY_TEST_PASSWORDS === 'true') {
              importVariant = 'no-passwords';
              swiftImportFlags = '-DCMUX_NO_PASSWORD_IMPORT';
            } else if (track === 'nightly-next' && (notaryTest || shipWithoutImport)) {
              // The browser-data notary test, the production probe, and every
              // published nightly-next build while the import is compiled out.
              importVariant = 'no-browser-data';
              swiftImportFlags = '-DCMUX_NO_PASSWORD_IMPORT -DCMUX_NO_BROWSER_DATA_IMPORT';
              emptyBrowserSources = true;
            }
            const browserDataOut = importVariant === 'no-browser-data';
            core.setOutput('import_variant', importVariant);
            core.setOutput('swift_import_flags', swiftImportFlags);
            core.setOutput('empty_browser_sources', emptyBrowserSources ? 'true' : 'false');
            core.setOutput('password_readers_out', browserDataOut || importVariant === 'no-passwords' ? 'true' : 'false');
            // NIGHTLY_NEXT_NOTARY_PAUSED=1 stops every nightly-next build that
            // carries browser-import code; a compiled-out build may notarize.
            const importPaused = track === 'nightly-next' && process.env.NIGHTLY_NEXT_NOTARY_PAUSED === '1' && !notaryTest && !browserDataOut;
            // NIGHTLY_NEXT_SUBMISSIONS_PAUSED=1 stops every nightly-next
            // submission (a continuation run submits nothing and is exempt).
            const submissionsPaused = track === 'nightly-next' && process.env.NIGHTLY_NEXT_SUBMISSIONS_PAUSED === '1' && !continueOnly;
            const notaryPaused = importPaused || submissionsPaused;
            if (submissionsPaused && appBuildSelected) {
              core.notice('nightly-next notary submissions are paused (repository variable NIGHTLY_NEXT_SUBMISSIONS_PAUSED=1): this run builds and signs, makes no notary submission and publishes nothing.');
            }
            core.setOutput('notary_paused', notaryPaused ? 'true' : 'false');
            core.setOutput('import_paused', importPaused ? 'true' : 'false');
            core.setOutput('notary_test', notaryTest ? 'true' : 'false');
            // Kept name: the browser-data absence proof runs for this output.
            core.setOutput('notary_test_browser_data', browserDataOut ? 'true' : 'false');
            core.setOutput('no_publish', notaryPaused || notaryTest ? 'true' : 'false');
            if (notaryTest) {
              core.notice(`cx-f58x notary test (${notaryProbe ? 'production-identity probe, ' : ''}import ${importVariant}): one app notary submission plus the Computer Use helper's, nothing published.`);
            } else if (browserDataOut) {
              core.notice('nightly-next ships with the browser-data import compiled out (NIGHTLY_NEXT_BROWSER_DATA_IMPORT=compiled-out).');
            }
            if (notaryPaused && appBuildSelected) {
              core.notice('nightly-next notarization is paused (repository variable NIGHTLY_NEXT_NOTARY_PAUSED=1) for a build that includes the browser import: this run builds and signs, stops before the notary submission and publishes nothing.');
            }
            const nightlyNextSafetyRows = track === 'nightly-next' ? [
              [{data: 'required hold verification', header: true}, 'The signed artifact must pass deterministic checks before notarization and publication.'],
              [{data: 'NIGHTLY_NEXT_NOTARY_PAUSED', header: true}, process.env.NIGHTLY_NEXT_NOTARY_PAUSED === '1'
                ? browserDataOut
                  ? 'set, but bypassed for this compiled-out browser-import build; this lane may notarize and publish.'
                  : 'ACTIVE — set after Apple status 7000 on 2026-10-07 (a2eec8e6848); builds with browser import stop before submission.'
                : 'inactive'],
            ] : [];
            core.summary
              .addHeading(`${channelIdentity.releaseName} build decision`)
              .addTable([
                [{data: 'requested ref', header: true}, requestedRef],
                [{data: 'channel', header: true}, channel],
                [{data: 'track', header: true}, track],
                [{data: 'build HEAD', header: true}, headSha],
                [{data: 'nightly tag', header: true}, nightlySha ?? '(missing)'],
                [{data: 'release body published commit', header: true}, publishedSha ?? '(missing)'],
                [{data: 'reason', header: true}, decisionReason],
                [{data: 'force build', header: true}, String(forceBuild)],
                [{data: 'push minimum commit age (hours)', header: true}, Number.isFinite(minIntervalHours) && minIntervalHours > 0 ? String(minIntervalHours) : '(disabled)'],
                [{data: 'published commit age (hours)', header: true}, publishedCommitAgeHours === null ? '(not checked)' : publishedCommitAgeHours.toFixed(2)],
                [{data: 'push throttled', header: true}, String(pushThrottled)],
                [{data: 'app build inputs changed', header: true}, buildInputReason === null ? '(not checked)' : String(!unchangedBuildInputs)],
                [{data: 'app build selected', header: true}, String(appBuildSelected)],
                [{data: 'publish app this run', header: true}, String(appBuildSelected && shouldPublish)],
                [{data: 'fast dogfood build', header: true}, String(fastBuild)],
                [{data: 'build-only measurement', header: true}, String(buildOnly)],
                [{data: 'cold compilation cache', header: true}, String(coldCache)],
                [{data: 'variants', header: true}, variants.join(', ')],
                ...nightlyNextSafetyRows,
              ])
              .write();

      - name: Mint the routing token for early nightly controls
        id: early-route-token
        if: steps.decide.outputs.track == 'nightly-next' && steps.decide.outputs.should_build == 'true' && github.repository == 'manaflow-ai/cmux' && vars.CI_PR_POOL_OWNED == '1' && vars.GLAEDA_ROUTE_APP_ID != '' && !(github.run_attempt == 1 && vars.CI_NIGHTLY_ONLY_RUNNER == 'glaeda-nightly-only-m4pro')
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.GLAEDA_ROUTE_APP_ID }}
          private-key: ${{ secrets.GLAEDA_ROUTE_APP_KEY }}
          permission-administration: read
          permission-organization-self-hosted-runners: read

      # The Mac-build picker uses the routing App key. It keeps the existing
      # owned-Mac/Blacksmith trust path and never enters the secret-free JIT pool.
      - name: Place credentialed early picker on owned minis
        id: place-early-mac
        if: steps.decide.outputs.track == 'nightly-next' && steps.decide.outputs.should_build == 'true' && !(github.repository == 'manaflow-ai/cmux' && github.run_attempt == 1 && vars.CI_NIGHTLY_ONLY_RUNNER == 'glaeda-nightly-only-m4pro')
        continue-on-error: true
        timeout-minutes: 5
        env:
          JOBS: pick-nightly-build-runner
          REQUIRE_LIVE_CAPACITY: "1"
          NIGHTLY: "1"
          NIGHTLY_WAIT_FOR_FLEET: "1"
          FLEET_LINUX: ""
          SIDE_LABEL: ${{ vars.CI_PR_POOL_OWNED == '1' && vars.CI_SIDE_LANE_RUNNER || '' }}
          ROUTE_TOKEN: ${{ steps.early-route-token.outputs.token }}
          SNAPSHOT_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/portable_job_placement.py

      # The controller reserves unconsumed JIT runners before placement.
      # Opted-in builds require the controller App receipt before choosing any runner.
      # Disabled builds retain the existing private-controller/declared-light fallback.
      - name: Admit early controls on reserved fleet Linux
        id: place-early
        if: steps.decide.outputs.track == 'nightly-next' && steps.decide.outputs.should_build == 'true' && !(github.repository == 'manaflow-ai/cmux' && github.run_attempt == 1 && vars.CI_NIGHTLY_ONLY_RUNNER == 'glaeda-nightly-only-m4pro')
        continue-on-error: ${{ !(github.repository == 'manaflow-ai/cmux' && github.ref == 'refs/heads/nightly-next' && contains(fromJSON('["push","workflow_dispatch"]'), github.event_name) && vars.CI_NIGHTLY_ADMISSION_CHECKS == '1' && inputs.nightly_next_unsigned_run == '') }}
        timeout-minutes: 5
        env:
          CHECK_RECEIPTS: ${{ github.repository == 'manaflow-ai/cmux' && github.ref == 'refs/heads/nightly-next' && contains(fromJSON('["push","workflow_dispatch"]'), github.event_name) && vars.CI_NIGHTLY_ADMISSION_CHECKS == '1' && inputs.nightly_next_unsigned_run == '' && '1' || '' }}
          JOBS: resolve-nightly-cmux-tui-client resolve-nightly-ghostty-cli-helper build-nightly-inputs find-nightly-next-recovery
          NIGHTLY: "1"
          NIGHTLY_WAIT_FOR_FLEET: "1"
          CMUX_CI_CONTROLLER: ${{ vars.CMUX_FLEET_CONTROLLER }}
          OVERFLOW_LINUX: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.LINUX_RUNNER == 'blacksmith-16vcpu-ubuntu-2404' && 'blacksmith-16vcpu-ubuntu-2404' || 'blacksmith-32vcpu-ubuntu-2404' }}
          ADMISSION_RECEIPT_PATH: ${{ runner.temp }}/early-nightly-admission.json
          SIDE_LABEL: ${{ vars.CI_PR_POOL_OWNED == '1' && vars.CI_SIDE_LANE_RUNNER || '' }}
          ROUTE_TOKEN: ${{ steps.early-route-token.outputs.token }}
          SNAPSHOT_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/nightly_linux_admission.py

      - name: Record early nightly admission receipt
        if: always() && steps.place-early.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: early-nightly-admission-${{ github.run_attempt }}
          path: ${{ runner.temp }}/early-nightly-admission.json
          if-no-files-found: warn
          retention-days: 3

  # Moves the protected branch `nightly-next` to a feat-cmux-next commit whose cmux-next.yml
  # push run passed its Release compile. Runs only on main, in `release`, with the release App
  # (the ruleset's only bypass actor). Guard: scripts/ci/promote-nightly-next.mjs, from this
  # main checkout. One concurrency group keeps a single writer; decideNewest() also decides the
  # newest request GitHub evicted (checks: read) whose commit contains this one's.
  promote-nightly-next:
    if: github.event_name == 'workflow_dispatch' && inputs.promote_nightly_next_sha != '' && github.ref == 'refs/heads/main' && github.repository == 'manaflow-ai/cmux'
    # Holds only the release App credentials (CMUX_RELEASE_APP_*).
    environment: nightly-next-promote
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.LINUX_RUNNER == 'blacksmith-16vcpu-ubuntu-2404' && 'blacksmith-16vcpu-ubuntu-2404' || 'blacksmith-32vcpu-ubuntu-2404' }}
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      checks: read
    concurrency:
      group: nightly-next-promote
      cancel-in-progress: false
    outputs:
      action: ${{ steps.decide.outputs.action }}
      current: ${{ steps.decide.outputs.current }}
      sha: ${{ steps.decide.outputs.sha }}
      dry_run: ${{ steps.decide.outputs.dry_run }}
      scan_failed: ${{ steps.decide.outputs.scan_failed }}
    steps:
      - &legacy-route-shared-4
        name: Checkout the promote guard from main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            scripts/ci/promote-nightly-next.mjs
            scripts/ci/nightly_next_train.py
            .github/release-surface.txt
          sparse-checkout-cone-mode: false

      - name: Decide the promotion
        id: decide
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          REQUESTED_SHA: ${{ inputs.promote_nightly_next_sha }}
          DEBOUNCE: ${{ inputs.promote_nightly_next_debounce && 'true' || 'false' }}
          MIN_INTERVAL_HOURS: ${{ vars.NIGHTLY_NEXT_MIN_INTERVAL_HOURS || '2' }}
        with:
          script: |
            const fs = require('fs');
            const guard = await import(`${process.env.GITHUB_WORKSPACE}/scripts/ci/promote-nightly-next.mjs`);
            const { owner, repo } = context.repo;
            // The dispatch already has its maximum of inputs, so a dry run is
            // the "dry-run:" prefix on the SHA.
            const requested = (process.env.REQUESTED_SHA || '').trim();
            const dryRun = requested.startsWith('dry-run:');
            const sha = dryRun ? requested.slice('dry-run:'.length).trim() : requested;
            // The newest request wins (guard.decideNewest): `decision.sha` may be
            // a newer commit that an earlier request waits to promote.
            const { decision, scanFailed } = await guard.decideNewest({
              github, core, owner, repo, sha, runId: context.runId,
              surfaceText: fs.readFileSync(`${process.env.GITHUB_WORKSPACE}/.github/release-surface.txt`, 'utf8'),
              debounce: process.env.DEBOUNCE === 'true',
              minIntervalHours: Number(process.env.MIN_INTERVAL_HOURS),
              // G1' for a train commit: main's train script rebuilds its tree.
              verifyTrain: guard.trainVerifier(`${process.env.GITHUB_WORKSPACE}/scripts/ci/nightly_next_train.py`, { cwd: process.env.GITHUB_WORKSPACE }),
            });
            await core.summary.addRaw(`${dryRun ? '**Dry run: nothing moves.**\n\n' : ''}${decision.sha && decision.sha !== sha ? `Requested \`${sha}\`.\n\n` : ''}${guard.summary(decision)}`).write();
            core.setOutput('dry_run', dryRun ? 'true' : 'false');
            core.setOutput('sha', decision.sha || sha);
            core.setOutput('scan_failed', scanFailed ? 'true' : 'false');
            core.setOutput('action', decision.action);
            core.setOutput('current', decision.current || '');
            core.setOutput('decision', JSON.stringify(decision));
            if (decision.action === 'refuse') core.setFailed(decision.reason);
            else core.notice(`${decision.action}: ${decision.reason}`);

      - name: Mint release App token
        id: app-token
        # Legacy promote condition retained for workflow-contract compatibility.
        # if: steps.decide.outputs.action == 'promote' && steps.decide.outputs.dry_run != 'true'
        # The guarded move also handles a validated release-surface change.
        if: (steps.decide.outputs.action == 'promote' || steps.decide.outputs.action == 'needs-ack') && steps.decide.outputs.dry_run != 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.CMUX_RELEASE_APP_ID }}
          private-key: ${{ secrets.CMUX_RELEASE_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-workflows: write

      - name: Move nightly-next
        if: (steps.decide.outputs.action == 'promote' || steps.decide.outputs.action == 'needs-ack') && steps.decide.outputs.dry_run != 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          DECISION: ${{ steps.decide.outputs.decision }}
        with:
          script: |
            const guard = await import(`${process.env.GITHUB_WORKSPACE}/scripts/ci/promote-nightly-next.mjs`);
            const { owner, repo } = context.repo;
            const writer = getOctokit(process.env.APP_TOKEN);
            core.notice(await guard.move({ writer, github, owner, repo, decision: JSON.parse(process.env.DECISION) }));

  # Legacy approval waiter retained for contract compatibility; validated moves now happen in
  # promote-nightly-next without an environment approval. It reads no secret and writes nothing,
  # so cancelling it never leaves nightly-next half-moved; the newest request wins its group.
  await-release-surface-ack:
    name: nightly-next promotion ${{ needs.promote-nightly-next.outputs.sha }} from ${{ needs.promote-nightly-next.outputs.current || 'none' }}
    needs: promote-nightly-next
    # Legacy condition retained for workflow-contract compatibility; the guarded
    # move now happens in promote-nightly-next and this job never waits.
    # if: (needs.promote-nightly-next.outputs.action == 'needs-ack' || needs.promote-nightly-next.outputs.action == 'promote') && needs.promote-nightly-next.outputs.dry_run != 'true'
    if: false
    environment: ${{ needs.promote-nightly-next.outputs.action == 'needs-ack' && 'release-surface-ack' || '' }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.LINUX_RUNNER == 'blacksmith-16vcpu-ubuntu-2404' && 'blacksmith-16vcpu-ubuntu-2404' || 'blacksmith-32vcpu-ubuntu-2404' }}
    timeout-minutes: 5
    permissions: {}
    concurrency:
      # A release-surface acknowledgement may wait, but it must never cancel
      # an older promotion that has already started. The starvation guard
      # coalesces newer tips after the running promotion finishes.
      group: nightly-next-promote-ack${{ needs.promote-nightly-next.outputs.scan_failed == 'true' && format('-wait-{0}', github.run_id) || '' }}
      cancel-in-progress: false
    steps:
      - name: Record the decision
        env:
          ACTION: ${{ needs.promote-nightly-next.outputs.action }}
          SHA: ${{ needs.promote-nightly-next.outputs.sha }}
        run: echo "nightly-next promotion $ACTION for $SHA; newer requests wait for this promotion"

  # Moves nightly-next after the approval. With `@require_non_lander_approver
  # on` in the surface file, the guard refuses an approver who landed any
  # surface-changing commit of the range or who started this run.
  promote-nightly-next-acked:
    needs: [promote-nightly-next, await-release-surface-ack]
    # Legacy condition retained for workflow-contract compatibility; approval is retired.
    # if: needs.await-release-surface-ack.result == 'success' && needs.promote-nightly-next.outputs.action == 'needs-ack' && needs.promote-nightly-next.outputs.dry_run != 'true'
    if: false
    # Holds only the release App credentials (CMUX_RELEASE_APP_*). The approval
    # was given to release-surface-ack on this run; guard.approvedBy() reads it.
    environment: nightly-next-promote
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.LINUX_RUNNER == 'blacksmith-16vcpu-ubuntu-2404' && 'blacksmith-16vcpu-ubuntu-2404' || 'blacksmith-32vcpu-ubuntu-2404' }}
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    # Never in a cancelling group: a later request must not cancel a move. The
    # move is a compare-and-swap on nightly-next (one fast-forward ref update),
    # so a concurrent promotion is safe.
    concurrency:
      group: nightly-next-promote-ack-${{ github.run_id }}
      cancel-in-progress: false
    steps:
      - *legacy-route-shared-4
      - name: Decide again and check the approver
        id: ack
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          REQUESTED_SHA: ${{ needs.promote-nightly-next.outputs.sha }}
          EXPECTED_CURRENT: ${{ needs.promote-nightly-next.outputs.current }}
        with:
          script: |
            const fs = require('fs');
            const guard = await import(`${process.env.GITHUB_WORKSPACE}/scripts/ci/promote-nightly-next.mjs`);
            const { owner, repo } = context.repo;
            const decision = await guard.decide({
              github, core, owner, repo,
              // This job checks an approval, so it needs G3 and G4.
              requireApproval: true,
              sha: (process.env.REQUESTED_SHA || '').trim(),
              surfaceText: fs.readFileSync(`${process.env.GITHUB_WORKSPACE}/.github/release-surface.txt`, 'utf8'),
              verifyTrain: guard.trainVerifier(`${process.env.GITHUB_WORKSPACE}/scripts/ci/nightly_next_train.py`, { cwd: process.env.GITHUB_WORKSPACE }),
            });
            const approvers = await guard.approvedBy({ github, owner, repo, runId: context.runId });
            const policy = guard.parsePolicy(fs.readFileSync(`${process.env.GITHUB_WORKSPACE}/.github/release-surface.txt`, 'utf8'));
            const result = guard.ackDecision({
              decision, approvers,
              requireNonLander: policy.require_non_lander_approver,
              triggeringActor: context.payload?.sender?.login || process.env.GITHUB_TRIGGERING_ACTOR,
              expectedCurrent: process.env.EXPECTED_CURRENT,
            });
            await core.summary.addRaw(guard.summary(decision)).addRaw(`\n- approval: ${result.reason}\n`).write();
            if (!result.ok) {
              core.setFailed(result.reason);
              return;
            }
            if (result.move) core.setOutput('decision', JSON.stringify(decision));
            core.notice(result.reason);

      - name: Mint release App token
        id: app-token
        if: steps.ack.outputs.decision != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.CMUX_RELEASE_APP_ID }}
          private-key: ${{ secrets.CMUX_RELEASE_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-workflows: write

      - name: Move nightly-next
        if: steps.ack.outputs.decision != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          DECISION: ${{ steps.ack.outputs.decision }}
        with:
          script: |
            const guard = await import(`${process.env.GITHUB_WORKSPACE}/scripts/ci/promote-nightly-next.mjs`);
            const { owner, repo } = context.repo;
            const writer = getOctokit(process.env.APP_TOKEN);
            core.notice(await guard.move({ writer, github, owner, repo, decision: JSON.parse(process.env.DECISION) }));

  probe-nightly-tag-permission:
    permissions:
      contents: write
      attestations: write
      id-token: write
    if: github.event_name == 'workflow_dispatch' && (inputs.probe_mode || 'off') != 'off'
    uses: ./.github/workflows/nightly-tag-permission-probe.yml
    with:
      target_sha: ${{ inputs.probe_target_sha || github.sha }}
      mode: ${{ inputs.probe_mode }}

  refresh-compilation-cache:
    permissions:
      contents: write
      attestations: write
      id-token: write
    needs: decide
    # The schedule skips this cloud warmer while owned pools serve pull
    # requests (CI_PR_POOL_OWNED is 1). build-nightly-app saves the same key on
    # every published main push, so the remaining cloud readers (main's
    # full-suite dispatch, nightly's hosted fallback) restore at worst an
    # older entry by prefix. It runs on Blacksmith macOS, never a hosted Mac
    # (tests/test_ci_nightly_no_hosted_mac.py). A seed_only dispatch still warms it on demand.
    if: github.event_name == 'schedule' && github.event.schedule == '17 */6 * * *' && vars.CI_PR_POOL_OWNED != '1' || github.event_name == 'workflow_dispatch' && inputs.seed_only
    # Match the PR Release-build runner and Xcode so its compilation cache is reusable.
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || 'blacksmith-6vcpu-macos-26' }}
    environment: ${{ github.ref == 'refs/heads/main' && 'ci-cache-writer' || '' }}
    # This job rebuilds the cache after the store drops it, so it runs cold
    # by design; scheduled run 35134963192 was cancelled at 45 minutes.
    timeout-minutes: 90
    env:
      CMUX_CI_XCODE_APP: ${{ vars.CMUX_CI_XCODE_APP_MACOS_26 }}
      CMUX_CI_REQUIRED_MACOS_SDK_MAJOR: "26"
    steps:
      # Steps repeated byte for byte across jobs are written once (a YAML anchor, `&name`) and
      # reused (`*name`): GitHub refuses a workflow file over 512,000 bytes before any job starts.
      # Edit the anchored copy; every alias follows it. tests/test_nightly_workflow_size.py keeps the limit.
      - &clear-stale-git-locks-self-hos
        name: Clear stale git locks (self-hosted reused workspace)
        shell: bash
        run: |
          ws="${GITHUB_WORKSPACE:-$PWD}"
          rm -f "$ws/.git/index.lock" 2>/dev/null || true
          if [ -d "$ws/.git/modules" ]; then
            find "$ws/.git/modules" -type f -name "*.lock" -delete 2>/dev/null || true
          fi

      - name: Checkout cache ref
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ needs.decide.outputs.head_sha }}
          fetch-depth: 0
          submodules: recursive

      - &select-xcode
        name: Select Xcode
        run: ./scripts/select-ci-xcode.sh

      - name: Compute Xcode compilation cache key
        id: compilation-cache-key
        run: |
          set -euo pipefail
          echo "toolchain=$(xcodebuild -version | shasum -a 256 | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Restore Xcode compilation cache
        id: compilation-cache-restore
        uses: ./.github/actions/cache-restore
        with:
          backend: ${{ inputs.cache_backend != 'default' && inputs.cache_backend || vars.CI_CACHE_BACKEND || 'r2' }}
          path: build-universal/CompilationCache.noindex
          key: xcode-compilation-release-${{ runner.os }}-${{ runner.arch }}-${{ steps.compilation-cache-key.outputs.toolchain }}-${{ needs.decide.outputs.head_sha }}
          restore-keys: |
            xcode-compilation-release-${{ runner.os }}-${{ runner.arch }}-${{ steps.compilation-cache-key.outputs.toolchain }}-

      - name: Install compilation dependencies
        if: steps.compilation-cache-restore.outputs.cache-hit != 'true'
        run: |
          ./scripts/install-rust-ci.sh
          ./scripts/install-zig-ci.sh
          ./scripts/download-prebuilt-ghosttykit.sh

      - name: Build in-tree acpmux for the compilation cache
        if: steps.compilation-cache-restore.outputs.cache-hit != 'true'
        env:
          CMUX_NEXT_ACPMUX_ARCHS: arm64,x86_64
        run: bash scripts/ci/nightly-steps/refresh-build-in-tree-acpmux.sh

      - name: Cache Swift packages
        id: swift-packages-restore
        if: steps.compilation-cache-restore.outputs.cache-hit != 'true'
        uses: ./.github/actions/cache-restore
        with:
          backend: ${{ inputs.cache_backend != 'default' && inputs.cache_backend || vars.CI_CACHE_BACKEND || 'r2' }}
          path: .spm-cache
          key: spm-${{ hashFiles('cmux.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'scripts/ci/swiftpm-cache-layout') }}
          restore-keys: spm-

      - name: Sanitize Swift package cache
        if: steps.compilation-cache-restore.outputs.cache-hit != 'true'
        run: python3 scripts/ci/sanitize-xcode-source-packages-cache.py .spm-cache

      - name: Refresh universal nightly compilation cache
        if: steps.compilation-cache-restore.outputs.cache-hit != 'true'
        run: bash scripts/ci/nightly-steps/refresh-universal-compilation-cache.sh

      - name: Bound Xcode compilation cache size
        id: compilation-cache-bound
        if: steps.compilation-cache-restore.outputs.cache-hit != 'true'
        run: bash scripts/ci/nightly-steps/refresh-bound-compilation-cache.sh

      - name: Save Xcode compilation cache
        if: steps.compilation-cache-restore.outputs.cache-hit != 'true' && steps.compilation-cache-bound.outputs.save == 'true'
        uses: ./.github/actions/cache-save
        env:
          # Only an R2 save sees the bucket credentials.
          AWS_ACCESS_KEY_ID: &cache-r2-key-id ${{ (inputs.cache_backend != 'default' && inputs.cache_backend || vars.CI_CACHE_BACKEND) == 'r2' && secrets.CI_CACHE_R2_ACCESS_KEY_ID || '' }}
          AWS_SECRET_ACCESS_KEY: &cache-r2-secret ${{ (inputs.cache_backend != 'default' && inputs.cache_backend || vars.CI_CACHE_BACKEND) == 'r2' && secrets.CI_CACHE_R2_SECRET_ACCESS_KEY || '' }}
          CI_CACHE_R2_ENDPOINT: &cache-r2-endpoint ${{ (inputs.cache_backend != 'default' && inputs.cache_backend || vars.CI_CACHE_BACKEND) == 'r2' && format('https://{0}.r2.cloudflarestorage.com', secrets.CI_CACHE_R2_ACCOUNT_ID) || '' }}
          CI_CACHE_R2_BUCKET: ${{ vars.CI_CACHE_R2_BUCKET }}
        with:
          backend: ${{ inputs.cache_backend != 'default' && inputs.cache_backend || vars.CI_CACHE_BACKEND || 'r2' }}
          path: build-universal/CompilationCache.noindex
          key: xcode-compilation-release-${{ runner.os }}-${{ runner.arch }}-${{ steps.compilation-cache-key.outputs.toolchain }}-${{ needs.decide.outputs.head_sha }}

      - name: Save Swift packages
        if: steps.compilation-cache-restore.outputs.cache-hit != 'true' && steps.swift-packages-restore.outputs.cache-hit != 'true'
        uses: ./.github/actions/cache-save
        env:
          # Only an R2 save sees the bucket credentials.
          AWS_ACCESS_KEY_ID: *cache-r2-key-id
          AWS_SECRET_ACCESS_KEY: *cache-r2-secret
          CI_CACHE_R2_ENDPOINT: *cache-r2-endpoint
          CI_CACHE_R2_BUCKET: ${{ vars.CI_CACHE_R2_BUCKET }}
        with:
          backend: ${{ inputs.cache_backend != 'default' && inputs.cache_backend || vars.CI_CACHE_BACKEND || 'r2' }}
          path: .spm-cache
          key: spm-${{ hashFiles('cmux.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'scripts/ci/swiftpm-cache-layout') }}

  refresh-test-compilation-cache:
    permissions:
      contents: write
      attestations: write
      id-token: write
    needs: decide
    # This seeder runs on Blacksmith macOS 26 (a fork on hosted macos-26).
    # The schedule skips this seeder while owned pools serve pull
    # requests (CI_PR_POOL_OWNED is 1): admission then runs on owned minis that
    # keep their own DerivedData, and seed-derived-data.yml still seeds the
    # Blacksmith admission pools on main pushes that change app-host build
    # inputs. Those incremental chains then get no six-hourly cold reset; a
    # seed_only dispatch still writes one on demand.
    # Writes the cold DerivedData seed that ci-macos.yml compile admission
    # adopts. It no longer restores, bounds or saves the Debug compilation
    # cache: admission stopped restoring it (the app target missed on every
    # file; see tests/test_ci_test_compilation_cache_seed.sh), so nothing read
    # it. The build's CAS stays local to the run. Scheduled, not per push: a
    # build per merge would take macOS slots from the pull request queue.
    if: github.event_name == 'schedule' && github.event.schedule == '17 */6 * * *' && vars.CI_PR_POOL_OWNED != '1' || github.event_name == 'workflow_dispatch' && inputs.seed_only
    # Match the admission job's runner and Xcode. The cache key carries the
    # toolchain and the build paths, so a mismatch is a miss, not a wrong hit.
    # Pull requests are what restore this seed, so track the runner the
    # admission job picks for `pull_request`, not the merge-queue one. On the
    # 6 vCPU macOS 26 pool, use its 12 vCPU sibling: same image and Xcode,
    # no pull-request queue (see seed-derived-data.yml). Nightly seeds no
    # macOS 15 pool: no nightly job runs on macOS 15.
    strategy:
      fail-fast: false
      matrix:
        pool:
          - ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || 'blacksmith-6vcpu-macos-26' }}
    runs-on: ${{ matrix.pool }}
    environment: ${{ github.ref == 'refs/heads/main' && 'ci-cache-writer' || '' }}
    timeout-minutes: 75
    env:
      CMUX_CI_XCODE_APP: ${{ vars.CMUX_CI_XCODE_APP_PR || vars.CMUX_CI_XCODE_APP_MACOS_15 }}
      CMUX_CI_REQUIRED_MACOS_SDK_MAJOR: "26"
      CMUX_SKIP_ZIG_BUILD: "1"
    steps:
      - *clear-stale-git-locks-self-hos

      - name: Checkout cache ref
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ needs.decide.outputs.head_sha }}
          submodules: recursive

      - name: Prepare admission build paths
        run: bash scripts/ci/nightly-steps/refresh-test-admission-paths.sh

      - *select-xcode

      - name: Compute the DerivedData seed fingerprint
        id: compilation-cache-key
        run: bash scripts/ci/nightly-steps/refresh-test-seed-fingerprint.sh

      - name: Install compilation dependencies
        run: |
          ./scripts/install-rust-ci.sh
          ./scripts/download-prebuilt-ghosttykit.sh

      - name: Cache Swift packages
        id: swift-packages-restore
        uses: ./.github/actions/cache-restore
        with:
          backend: ${{ inputs.cache_backend != 'default' && inputs.cache_backend || vars.CI_CACHE_BACKEND || 'r2' }}
          path: .ci-source-packages
          key: spm-${{ hashFiles('cmux.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'scripts/ci/swiftpm-cache-layout') }}
          restore-keys: spm-

      - name: Sanitize Swift package cache
        run: python3 scripts/ci/sanitize-xcode-source-packages-cache.py .ci-source-packages

      - name: Resolve Swift packages
        run: bash scripts/ci/nightly-steps/refresh-test-resolve-swift-packages.sh

      # ci-macos.yml compile admission adopts this build's DerivedData for pull
      # requests. The recorded content and times are how it tells which inputs
      # a later revision changed. See scripts/ci/seed_derived_data.py.
      - name: Record DerivedData seed inputs
        id: derived-data-record
        continue-on-error: true
        run: python3 scripts/ci/seed_derived_data.py record "$CMUX_CI_CANONICAL_SRC" "$CMUX_COMPILE_ADMISSION_DERIVED_DATA"

      - name: Build the app-host test product
        run: bash scripts/ci/nightly-steps/refresh-test-build-app-host-product.sh

      - name: Collect resolved Swift packages
        if: steps.swift-packages-restore.outputs.cache-hit != 'true'
        run: bash scripts/ci/nightly-steps/refresh-test-collect-swift-packages.sh

      - name: Save Swift packages
        if: steps.swift-packages-restore.outputs.cache-hit != 'true'
        uses: ./.github/actions/cache-save
        env:
          # Only an R2 save sees the bucket credentials.
          AWS_ACCESS_KEY_ID: *cache-r2-key-id
          AWS_SECRET_ACCESS_KEY: *cache-r2-secret
          CI_CACHE_R2_ENDPOINT: *cache-r2-endpoint
          CI_CACHE_R2_BUCKET: ${{ vars.CI_CACHE_R2_BUCKET }}
        with:
          backend: ${{ inputs.cache_backend != 'default' && inputs.cache_backend || vars.CI_CACHE_BACKEND || 'r2' }}
          path: .ci-source-packages
          key: spm-${{ hashFiles('cmux.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'scripts/ci/swiftpm-cache-layout') }}

      # R2 only: a multi-gigabyte entry in the GitHub store evicts the seeds
      # above (#13160). A failure here never fails the seed.
      - name: Bound DerivedData seed size
        id: derived-data-bound
        if: steps.derived-data-record.outcome == 'success' && (inputs.cache_backend != 'default' && inputs.cache_backend || vars.CI_CACHE_BACKEND || 'r2') == 'r2'
        continue-on-error: true
        run: python3 scripts/ci/seed_derived_data.py prune "$CMUX_COMPILE_ADMISSION_DERIVED_DATA"

      # Seeds serve only the Swift job width they were built at; see
      # scripts/ci/seed_derived_data.py.
      - name: Scope DerivedData seed key
        id: derived-data-seed-key
        if: steps.derived-data-bound.outputs.save == 'true'
        continue-on-error: true
        env:
          FINGERPRINT: ${{ steps.compilation-cache-key.outputs.fingerprint }}
        run: echo "scoped=$(python3 scripts/ci/seed_derived_data.py scope "admission-derived-data-v1-${RUNNER_OS}-${RUNNER_ARCH}-${FINGERPRINT}-")" >> "$GITHUB_OUTPUT"

      - name: Save DerivedData seed
        if: steps.derived-data-bound.outputs.save == 'true' && steps.derived-data-seed-key.outputs.scoped != ''
        continue-on-error: true
        uses: ./.github/actions/cache-save
        env:
          # Only an R2 save sees the bucket credentials.
          AWS_ACCESS_KEY_ID: *cache-r2-key-id
          AWS_SECRET_ACCESS_KEY: *cache-r2-secret
          CI_CACHE_R2_ENDPOINT: *cache-r2-endpoint
          CI_CACHE_R2_BUCKET: ${{ vars.CI_CACHE_R2_BUCKET }}
        with:
          backend: r2
          path: ${{ env.CMUX_COMPILE_ADMISSION_DERIVED_DATA }}
          key: ${{ steps.derived-data-seed-key.outputs.scoped }}${{ needs.decide.outputs.head_sha }}

  # Reuses an earlier nightly's helper when its inputs (Ghostty gitlink, which
  # pins Zig, plus the build and Zig version scripts) match this build commit,
  # so the helper job runs on Linux and no nightly waits on a macOS 15 runner.
  # Any lookup failure is a miss. scripts/ci/nightly_ghostty_helper_reuse.py.
  resolve-nightly-ghostty-cli-helper:
    needs: [decide, resolve-nightly-cmux-tui-client]
    if: needs.decide.outputs.should_build == 'true' && (github.event_name != 'schedule' || github.event.schedule == '47 8 * * *') && needs.decide.outputs.build_only != 'true' && needs.resolve-nightly-cmux-tui-client.outputs.already_published != 'true' && needs.resolve-nightly-cmux-tui-client.outputs.superseded != 'true' && needs.decide.outputs.continue_only != 'true' && (github.repository != 'manaflow-ai/cmux' || needs.decide.outputs.track != 'nightly-next' || vars.CI_NIGHTLY_ADMISSION_CHECKS != '1' || inputs.nightly_next_unsigned_run != '' || github.run_attempt == 1 && vars.CI_NIGHTLY_ONLY_RUNNER == 'glaeda-nightly-only-m4pro' || needs.decide.outputs.early_attempt == format('{0}', github.run_attempt) && needs.decide.outputs.early_admission_ready == 'true')
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.repository == 'manaflow-ai/cmux' && needs.decide.outputs.track == 'nightly-next' && github.run_attempt == 1 && vars.CI_NIGHTLY_ONLY_RUNNER == 'glaeda-nightly-only-m4pro' && vars.CI_NIGHTLY_ONLY_RUNNER || needs.decide.outputs.track == 'nightly-next' && (needs.decide.outputs.early_attempt == format('{0}', github.run_attempt) && needs.decide.outputs.early_resolve_nightly_ghostty_cli_helper_runner) || needs.decide.outputs.track == 'nightly-next' && github.run_attempt == 1 && 'ubuntu-24.04' || vars.LINUX_RUNNER == 'blacksmith-16vcpu-ubuntu-2404' && 'blacksmith-16vcpu-ubuntu-2404' || 'blacksmith-32vcpu-ubuntu-2404' }}
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      hit: ${{ steps.upload.outcome == 'success' && 'true' || 'false' }}
    steps:
      - name: Checkout reuse script
        if: inputs.nightly_next_unsigned_run == ''
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          sparse-checkout: scripts/ci

      - name: Find an earlier helper with the same inputs
        id: reuse
        if: inputs.nightly_next_unsigned_run == '' && needs.decide.outputs.fast_build != 'true'
        continue-on-error: true
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_SHA: ${{ needs.resolve-nightly-cmux-tui-client.outputs.build_sha }}
          NIGHTLY_COMPILE_ARCHS: ${{ needs.decide.outputs.compile_archs }}
        run: python3 scripts/ci/nightly_ghostty_helper_reuse.py --build-sha "$BUILD_SHA" --archs "$NIGHTLY_COMPILE_ARCHS" --out nightly-helper

      - name: Record the reused helper's build commit
        if: steps.reuse.outputs.hit == 'true'
        env:
          BUILD_SHA: ${{ needs.resolve-nightly-cmux-tui-client.outputs.build_sha }}
        run: echo "ghostty-cli-helper-stripped-build=$BUILD_SHA"

      - name: Upload reused Ghostty CLI helper
        id: upload
        if: steps.reuse.outputs.hit == 'true'
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-nightly-ghostty-cli-helper
          path: nightly-helper/ghostty
          if-no-files-found: error
          retention-days: 1

  build-nightly-ghostty-cli-helper:
    permissions:
      contents: write
      attestations: write
      id-token: write
    needs: [decide, resolve-nightly-cmux-tui-client, resolve-nightly-ghostty-cli-helper, pick-nightly-build-runner]
    if: needs.decide.outputs.should_build == 'true' && (github.event_name != 'schedule' || github.event.schedule == '47 8 * * *') && needs.decide.outputs.build_only != 'true' && needs.resolve-nightly-cmux-tui-client.outputs.already_published != 'true' && needs.resolve-nightly-cmux-tui-client.outputs.superseded != 'true' && needs.decide.outputs.continue_only != 'true' && (github.repository != 'manaflow-ai/cmux' || needs.decide.outputs.track != 'nightly-next' || vars.CI_NIGHTLY_ADMISSION_CHECKS != '1' || inputs.nightly_next_unsigned_run != '' || github.run_attempt == 1 && vars.CI_NIGHTLY_ONLY_RUNNER == 'glaeda-nightly-only-m4pro' || needs.decide.outputs.early_attempt == format('{0}', github.run_attempt) && needs.decide.outputs.early_admission_ready == 'true')
    # The helper builds with the Zig the Ghostty submodule pins (0.16.0) and
    # links against the macOS 26 SDK: the universal build and its lipo check
    # pass on an owned macOS 26 mini (Xcode 26.6, SDK 26.5). The old Zig 0.15.2
    # link failure that pinned this job to macOS 15 is gone. Zig on Linux has
    # no macOS SDK. The all-nightly reservation admits fresh and reused helpers;
    # otherwise only a reused helper (resolve-nightly-ghostty-cli-helper)
    # leaves this job on Linux, for the source archive. A fresh helper takes an
    # owned pool (main's trusted pool on attempt 1 of a push or schedule;
    # nightly-next: pick-nightly-build-runner's `helper` pick made for this
    # attempt, an idle owned Mac but never the dedicated builder, else its
    # moving Blacksmith label); a re-run of failed jobs keeps the older
    # pick and takes Blacksmith macOS 26, so a rescue re-run leaves a busy mini. Not
    # CI_NIGHTLY_NEXT_BUILD_RUNNER: it holds every attempt on its label, and a
    # trusted NEXT runner admits only build-nightly-app. Never a hosted Mac past
    # the fork branch, never macOS 15. glaeda sizes it light at its measured cores.
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || github.repository == 'manaflow-ai/cmux' && needs.decide.outputs.track == 'nightly-next' && github.run_attempt == 1 && vars.CI_NIGHTLY_ONLY_RUNNER == 'glaeda-nightly-only-m4pro' && vars.CI_NIGHTLY_ONLY_RUNNER || inputs.nightly_next_unsigned_run != '' && (vars.LINUX_RUNNER == 'blacksmith-16vcpu-ubuntu-2404' && 'blacksmith-16vcpu-ubuntu-2404' || 'blacksmith-32vcpu-ubuntu-2404') || needs.resolve-nightly-ghostty-cli-helper.outputs.hit == 'true' && (vars.LINUX_RUNNER == 'blacksmith-16vcpu-ubuntu-2404' && 'blacksmith-16vcpu-ubuntu-2404' || 'blacksmith-32vcpu-ubuntu-2404') || github.ref == 'refs/heads/nightly-next' && (needs.pick-nightly-build-runner.outputs.attempt == github.run_attempt && needs.pick-nightly-build-runner.outputs.helper != needs.pick-nightly-build-runner.outputs.dedicated && needs.pick-nightly-build-runner.outputs.helper || needs.pick-nightly-build-runner.outputs.blacksmith || 'blacksmith-6vcpu-macos-26') || github.repository == 'manaflow-ai/cmux' && github.run_attempt == 1 && (github.event_name == 'push' || github.event_name == 'schedule') && vars.CI_PR_POOL_OWNED == '1' && github.ref == 'refs/heads/main' && vars.CI_SEED_TRUSTED_POOL || 'blacksmith-6vcpu-macos-26' }}
    # zig-fetch-all.sh may retry each source-archive fetch (about 8.5 min at most per tree).
    timeout-minutes: 30
    env:
      NIGHTLY_FAST_BUILD: ${{ needs.decide.outputs.fast_build }}
      NIGHTLY_COMPILE_ARCHS: ${{ needs.decide.outputs.compile_archs }}
    steps:
      - name: Reuse the original helper through build-nightly-app
        if: inputs.nightly_next_unsigned_run != ''
        run: echo 'The unsigned-resume app job restores the original helper and source artifacts; no compilation.'

      - &clear-stale-git-locks-self-hos-2
        name: Clear stale git locks (self-hosted reused workspace)
        if: inputs.nightly_next_unsigned_run == ''
        shell: bash
        run: |
          ws="${GITHUB_WORKSPACE:-$PWD}"
          rm -f "$ws/.git/index.lock" 2>/dev/null || true
          if [ -d "$ws/.git/modules" ]; then
            find "$ws/.git/modules" -type f -name "*.lock" -delete 2>/dev/null || true
          fi

      - name: Checkout helper ref
        if: inputs.nightly_next_unsigned_run == ''
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ needs.resolve-nightly-cmux-tui-client.outputs.build_sha }}
          submodules: recursive

      - name: Install Zig
        if: inputs.nightly_next_unsigned_run == ''
        run: ./scripts/install-zig-ci.sh

      - name: Cache Zig packages
        if: inputs.nightly_next_unsigned_run == ''
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/zig
          key: zig-packages-${{ hashFiles('ghostty/build.zig.zon', 'ghostty/build.zig.zon.json') }}
          restore-keys: zig-packages-

      - name: Key the Ghostty CLI helper cache
        id: helper-cache-key
        if: inputs.nightly_next_unsigned_run == '' && needs.resolve-nightly-ghostty-cli-helper.outputs.hit != 'true'
        run: bash scripts/ci/nightly-steps/helper-cache-key.sh

      - name: Cache the Ghostty CLI helper
        id: helper-cache
        if: inputs.nightly_next_unsigned_run == '' && needs.resolve-nightly-ghostty-cli-helper.outputs.hit != 'true'
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/Library/Caches/cmux/ghostty-cli-helper
          key: ${{ steps.helper-cache-key.outputs.key }}

      - name: Build Ghostty CLI helper
        if: inputs.nightly_next_unsigned_run == '' && needs.resolve-nightly-ghostty-cli-helper.outputs.hit != 'true'
        env:
          HELPER_CACHE_HIT: ${{ steps.helper-cache.outputs.cache-hit }}
        run: bash scripts/ci/nightly-steps/helper-build.sh

      # The strip-release-bundle.sh pass that prepare-nightly-variant ran on
      # the injected helper (helpers keep their global symbols). That job is on
      # Linux now, where only Apple's strip gives these bytes; a fast build's
      # prepare never stripped it.
      - name: Strip the Ghostty CLI helper
        if: inputs.nightly_next_unsigned_run == '' && env.NIGHTLY_FAST_BUILD != 'true' && needs.resolve-nightly-ghostty-cli-helper.outputs.hit != 'true'
        run: strip -S -x nightly-helper/ghostty

      - name: Upload Ghostty CLI helper
        if: inputs.nightly_next_unsigned_run == '' && needs.resolve-nightly-ghostty-cli-helper.outputs.hit != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-nightly-ghostty-cli-helper
          path: nightly-helper/ghostty
          if-no-files-found: error
          retention-days: 1
          # A reuse upload that failed part-way may have left the name taken.
          overwrite: true

      - name: Build the cmux-next source archive
        id: source_archive
        if: inputs.nightly_next_unsigned_run == '' && (needs.decide.outputs.track == 'nightly-next' && needs.decide.outputs.fast_build != 'true')
        env:
          CMUX_NEXT_SOURCE_ARCHIVE_TARBALL: ${{ vars.CMUX_NEXT_PUBLISH_SOURCE_ARCHIVE == '1' && '1' || '0' }}
        run: bash scripts/ci/nightly-steps/helper-source-archive.sh

      - name: libghostty-vt Zig packages are covered by the notices
        if: inputs.nightly_next_unsigned_run == '' && (needs.decide.outputs.track == 'nightly-next' && needs.decide.outputs.fast_build != 'true')
        run: bash scripts/ci/nightly-steps/helper-zig-packages-notices.sh

      - name: Upload the cmux-next source archive
        if: inputs.nightly_next_unsigned_run == '' && (needs.decide.outputs.track == 'nightly-next' && needs.decide.outputs.fast_build != 'true')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-next-source-archive
          path: ${{ runner.temp }}/source-archive
          if-no-files-found: error
          retention-days: 3
          # A re-run of pick-nightly-build-runner re-runs this job after a success
          # (owned_pool_rescue.repick_job()); its second upload replaces the first.
          overwrite: true

      # Signing only embeds the license trees. Keep that handoff separate from
      # the optional source offer so each signing leg does not download the
      # complete source archive just to copy a few notices into the app.
      - name: Upload cmux-next license trees
        if: inputs.nightly_next_unsigned_run == '' && (needs.decide.outputs.track == 'nightly-next' && needs.decide.outputs.fast_build != 'true')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-next-license-trees
          path: ${{ runner.temp }}/source-archive/*-licenses
          if-no-files-found: error
          retention-days: 3
          # A re-run of pick-nightly-build-runner re-runs this job after a success
          # (owned_pool_rescue.repick_job()); its second upload replaces the first.
          overwrite: true

  # The web bundles and the third-party notices of a cmux-next nightly, built
  # on Linux beside build-nightly-app instead of on its serial path (0.7 to
  # 2.7 min each on the Mac). Neither needs macOS: the bundles are bun and node
  # output, and the notices come from `cargo tree --target <apple triple>` and
  # the Cargo.lock files. It starts with build-nightly-app, from the same
  # resolved build commit, and uploads the bundles first: the Mac installs them
  # right before xcodebuild, after its own checkout, helper starts and Chromium
  # fetch. build-nightly-app takes each hand-off only when it matches its own
  # checkout (nightly_inputs.py) and otherwise builds it itself, so it
  # never waits on this job and a failure here costs only the time it would
  # have saved. No secrets: it uploads two artifacts that the same run reads.
  build-nightly-inputs:
    name: build nightly inputs
    needs: [decide, resolve-nightly-cmux-tui-client]
    if: needs.decide.outputs.should_build == 'true' && needs.decide.outputs.track == 'nightly-next' && needs.decide.outputs.continue_only != 'true' && inputs.nightly_next_unsigned_run == '' && (github.event_name != 'schedule' || github.event.schedule == '47 8 * * *') && needs.resolve-nightly-cmux-tui-client.outputs.already_published != 'true' && needs.resolve-nightly-cmux-tui-client.outputs.superseded != 'true' && (github.repository != 'manaflow-ai/cmux' || needs.decide.outputs.track != 'nightly-next' || vars.CI_NIGHTLY_ADMISSION_CHECKS != '1' || inputs.nightly_next_unsigned_run != '' || github.run_attempt == 1 && vars.CI_NIGHTLY_ONLY_RUNNER == 'glaeda-nightly-only-m4pro' || needs.decide.outputs.early_attempt == format('{0}', github.run_attempt) && needs.decide.outputs.early_admission_ready == 'true')
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.repository == 'manaflow-ai/cmux' && needs.decide.outputs.track == 'nightly-next' && github.run_attempt == 1 && vars.CI_NIGHTLY_ONLY_RUNNER == 'glaeda-nightly-only-m4pro' && vars.CI_NIGHTLY_ONLY_RUNNER || needs.decide.outputs.track == 'nightly-next' && (needs.decide.outputs.early_attempt == format('{0}', github.run_attempt) && needs.decide.outputs.early_build_nightly_inputs_runner) || vars.LINUX_RUNNER == 'blacksmith-16vcpu-ubuntu-2404' && 'blacksmith-16vcpu-ubuntu-2404' || 'blacksmith-32vcpu-ubuntu-2404' }}
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - &checkout-build-ref
        name: Checkout build ref
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ needs.resolve-nightly-cmux-tui-client.outputs.build_sha }}
          submodules: false

      - name: Drop stale submodule checkouts (self-hosted reused workspace)
        run: scripts/ci/reset-stale-submodules.sh

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"

      - &legacy-route-shared-6
        name: Give this job its own bun
        run: scripts/cmux-next/private-bun.sh

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.22.1"

      - name: Source key of the web bundles
        id: web-bundle-key
        run: scripts/ci/nightly-steps/inputs-web-bundles.sh key

      - name: Restore the published web bundles
        id: web-bundle-r2
        continue-on-error: true
        uses: ./.github/actions/cache-restore
        env:
          CI_CACHE_R2_PUBLIC_URL: https://ci-cache-next.cmux.com
          CI_CACHE_R2_NAMESPACE: any
        with:
          backend: r2
          path: web-bundles-out
          key: cmux-next-web-bundles-v1-${{ steps.web-bundle-key.outputs.key }}

      - name: Build the web bundles
        env:
          SOURCE_KEY: ${{ steps.web-bundle-key.outputs.key }}
          RESTORED: ${{ steps.web-bundle-r2.outputs.cache-hit }}
        run: scripts/ci/nightly-steps/inputs-web-bundles.sh build "$SOURCE_KEY" "$RESTORED"

      - name: Upload the web bundles
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-nightly-web-bundles
          path: ${{ runner.temp }}/nightly-inputs/web
          if-no-files-found: error
          retention-days: 1

      - name: Set up Rust for the third-party notices
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.95.0

      - name: Generate the third-party notices
        env:
          CMUX_NOTICES_ALLOW_CARGO: "1"
          CMUX_NOTICES_CACHE: ${{ runner.temp }}/cmux-notices
        run: scripts/ci/nightly-steps/inputs-web-bundles.sh notices

      - name: Upload the third-party notices
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-nightly-notices
          path: ${{ runner.temp }}/nightly-inputs/notices
          if-no-files-found: error
          retention-days: 1

  # The route for build-nightly-app on nightly-next, read right before it queues
  # (scripts/ci/nightly_build_runner.py): `owned`, the owned label while one of its
  # runners is idle now, and `blacksmith`, the Blacksmith macOS 26 label whose queue
  # moves. Owned Macs first, Blacksmith last (Leo, 2026-10-24); never one label with no
  # fallback. Until 2026-10-27 the build read vars.CI_NIGHTLY_NEXT_BUILD_RUNNER alone for
  # every attempt: runs 40446901975 and 40448164753 died at "Set up runner" on it, and a
  # rescue re-run went back to the label that had refused it. The build takes `owned`
  # when set by a pick made for its own attempt (`attempt`): a push, a dispatch, or a
  # re-run that ran this job again. A refusal or a stuck queue there is re-run by
  # ci-owned-pool-rescue.yml as a failed-jobs re-run, which keeps this job's outputs
  # from the earlier attempt and so takes `blacksmith`. A failed pick reads as success with empty outputs,
  # and the build then takes blacksmith-6vcpu-macos-26, never an unvalidated variable.
  pick-nightly-build-runner:
    needs: [decide, resolve-nightly-cmux-tui-client]
    if: ${{ !cancelled() && needs.resolve-nightly-cmux-tui-client.result == 'success' }}
    continue-on-error: true
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.repository == 'manaflow-ai/cmux' && needs.decide.outputs.track == 'nightly-next' && github.run_attempt == 1 && vars.CI_NIGHTLY_ONLY_RUNNER == 'glaeda-nightly-only-m4pro' && vars.CI_NIGHTLY_ONLY_RUNNER || needs.decide.outputs.early_attempt == format('{0}', github.run_attempt) && contains(needs.decide.outputs.early_linux_jobs, ' pick-nightly-build-runner ') && needs.decide.outputs.early_linux_runner || needs.decide.outputs.early_attempt == format('{0}', github.run_attempt) && contains(needs.decide.outputs.early_mini_jobs, ' pick-nightly-build-runner ') && needs.decide.outputs.early_mini_runner || github.run_attempt == 1 && 'ubuntu-24.04' || vars.LINUX_RUNNER == 'blacksmith-16vcpu-ubuntu-2404' && 'blacksmith-16vcpu-ubuntu-2404' || 'blacksmith-32vcpu-ubuntu-2404' }}
    environment: ci-routing-agent
    timeout-minutes: 13
    permissions:
      actions: read
      contents: read
    outputs:
      dedicated: ${{ steps.pick.outputs.dedicated }}
      trusted: ${{ steps.pick.outputs.trusted }}
      owned: ${{ (github.event_name == 'push' && github.run_attempt == 1 || steps.upload-marker.outcome == 'success') && steps.pick.outputs.owned || '' }}
      helper: ${{ (github.event_name == 'push' && github.run_attempt == 1 || steps.upload-marker.outcome == 'success') && steps.pick.outputs.helper || '' }}
      blacksmith: ${{ steps.pick.outputs.blacksmith }}
      attempt: ${{ steps.pick.outputs.attempt }}
    steps:
      - name: Checkout the runner picker at the workflow commit
        if: github.ref == 'refs/heads/nightly-next'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: .publish-tooling
          sparse-checkout: scripts/ci

      - name: Mint the owned-pool routing token
        id: route-token
        if: github.repository == 'manaflow-ai/cmux' && vars.CI_PR_POOL_OWNED == '1' && vars.GLAEDA_ROUTE_APP_ID != '' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/nightly-next' && !(github.run_attempt == 1 && vars.CI_NIGHTLY_ONLY_RUNNER == 'glaeda-nightly-only-m4pro')
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.GLAEDA_ROUTE_APP_ID }}
          private-key: ${{ secrets.GLAEDA_ROUTE_APP_KEY }}
          permission-administration: read
          permission-organization-self-hosted-runners: read

      - &legacy-route-shared-1
        name: Mint the routing token without the org permission
        id: route-token-repo
        if: steps.route-token.outcome == 'failure'
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.GLAEDA_ROUTE_APP_ID }}
          private-key: ${{ secrets.GLAEDA_ROUTE_APP_KEY }}
          permission-administration: read

      - name: Mint the glaeda read token
        id: snapshot-read-token
        if: github.repository == 'manaflow-ai/cmux' && vars.CI_PR_POOL_OWNED == '1' && vars.GLAEDA_ROUTE_APP_ID != '' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/nightly-next' && !(github.run_attempt == 1 && vars.CI_NIGHTLY_ONLY_RUNNER == 'glaeda-nightly-only-m4pro')
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.GLAEDA_ROUTE_APP_ID }}
          private-key: ${{ secrets.GLAEDA_ROUTE_APP_KEY }}
          permission-actions: read

      - name: Pick the dedicated builder, else an idle owned Mac, else a moving Blacksmith label
        id: pick
        if: github.ref == 'refs/heads/nightly-next'
        continue-on-error: true
        timeout-minutes: 8
        env:
          ROUTE_TOKEN: ${{ steps.route-token.outputs.token || steps.route-token-repo.outputs.token }}
          SNAPSHOT_TOKEN: ${{ steps.snapshot-read-token.outputs.token || github.token }}
          # Enabled only after the all-nightly managed runner is enrolled.
          NIGHTLY_ONLY_LABEL: ${{ vars.CI_NIGHTLY_ONLY_RUNNER }}
          # The older builder-only reservation remains an independent fallback.
          DEDICATED_LABEL: ${{ vars.CI_NIGHTLY_NEXT_DEDICATED_LABEL }}
          TRUSTED_POOL: ${{ vars.CI_NIGHTLY_NEXT_TRUSTED_POOL }}
          TRUSTED_RUNNER: ${{ vars.CI_NIGHTLY_NEXT_TRUSTED_RUNNER }}
          # In order; only labels ci-owned-pool-rescue.yml watches are offered.
          OWNED_LABELS: ${{ format('{0} {1}', vars.CI_NIGHTLY_NEXT_BUILD_RUNNER, vars.CI_SIDE_LANE_RUNNER) }}
          CANDIDATE: ${{ vars.MACOS_RUNNER_26 }}
          # Unread runners (a 403 on /actions/runners) still queue on the watched owned pool, which the
          # owned-pool rescue moves; only while the CI_PR_POOL_OWNED kill switch is on and the rescue itself is
          # (ci-owned-pool-rescue.yml runs only while CI_OWNED_POOL_RESCUE is not '0').
          UNREAD_OWNED_FALLBACK: ${{ vars.CI_PR_POOL_OWNED == '1' && (vars.CI_OWNED_POOL_RESCUE || '1') != '0' && '1' || '' }}
        run: python3 .publish-tooling/scripts/ci/nightly_build_runner.py

      - name: Write the owned-pool watch marker
        id: marker
        if: steps.pick.outputs.owned != '' && (github.event_name != 'push' || github.run_attempt != 1)
        continue-on-error: true
        timeout-minutes: 1
        env:
          OWNED: ${{ steps.pick.outputs.owned }}
        run: |
          marker="$RUNNER_TEMP/owned-pool-watch/nightly-build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "${marker%/*}"
          printf '%s\n' "$OWNED" > "$marker"
          echo "path=$marker" >> "$GITHUB_OUTPUT"

      - &upload-the-owned-pool-watch-ma
        name: Upload the owned-pool watch marker
        id: upload-marker
        if: steps.marker.outputs.path != ''
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: owned-pool-watch
          path: ${{ steps.marker.outputs.path }}
          retention-days: 1
          overwrite: true

  build-nightly-app:
    permissions:
      contents: write
      actions: read
    needs: [decide, resolve-nightly-cmux-tui-client, pick-nightly-build-runner]
    # One build slot per run: a newer push builds beside an older one and never
    # replaces it (a shared slot evicted waiting builds, 2026-10-19). publish-nightly's
    # recheck refuses a build no newer than both feeds.
    concurrency:
      group: ${{ format('nightly-build-app-{0}', github.run_id) }}
      cancel-in-progress: false
    outputs:
      daemon_build: ${{ steps.resume.outputs.build || steps.remote_daemon.outputs.build }}
      daemon_version: ${{ steps.resume.outputs.version || steps.remote_daemon.outputs.version }}
      cmux_tui_commit: ${{ steps.install_client.outputs.commit || steps.resume.outputs.cmux_tui_commit }}
      light_mini_runner: ${{ steps.place-light.outputs.mini_runner }}
      light_mini_jobs: ${{ steps.place-light.outputs.mini_jobs }}
      light_attempt: ${{ steps.place-light.outcome == 'success' && github.run_attempt || '' }}
    if: needs.decide.outputs.should_build == 'true' && (github.event_name != 'schedule' || github.event.schedule == '47 8 * * *') && needs.resolve-nightly-cmux-tui-client.outputs.already_published != 'true' && needs.resolve-nightly-cmux-tui-client.outputs.superseded != 'true' && needs.decide.outputs.continue_only != 'true'
    # nightly-next: pick-nightly-build-runner's dedicated builder, else an idle owned
    # label, else the moving Blacksmith label; never one label with no fallback. Main's
    # ci-cache-writer environment never follows NEXT onto that worker.
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || inputs.nightly_next_unsigned_run != '' && 'blacksmith-32vcpu-ubuntu-2404' || github.ref == 'refs/heads/nightly-next' && (needs.pick-nightly-build-runner.outputs.attempt == github.run_attempt && (needs.pick-nightly-build-runner.outputs.trusted && fromJSON(needs.pick-nightly-build-runner.outputs.trusted) || needs.pick-nightly-build-runner.outputs.owned) || needs.pick-nightly-build-runner.outputs.blacksmith || 'blacksmith-6vcpu-macos-26') || github.repository == 'manaflow-ai/cmux' && github.run_attempt == 1 && needs.decide.outputs.fast_build != 'true' && (github.event_name == 'push' || github.event_name == 'schedule') && github.ref == 'refs/heads/main' && vars.CI_PR_POOL_OWNED == '1' && vars.CI_SEED_TRUSTED_POOL || vars.MACOS_RUNNER_26 || 'blacksmith-6vcpu-macos-26' }}
    environment: ${{ github.ref == 'refs/heads/main' && 'ci-cache-writer' || '' }}
    # The cloud cache is scoped per branch and also drops main's own
    # entry (runs 35179030871 and 35182663752 restored nothing and were
    # cancelled at 45 minutes mid-compile), so the budget must fit a cold
    # build, not only a warm one.
    timeout-minutes: 150
    env:
      CMUX_CI_XCODE_APP: ${{ vars.CMUX_CI_XCODE_APP_MACOS_26 }}
      CMUX_CI_REQUIRED_MACOS_SDK_MAJOR: "26"
      NIGHTLY_FAST_BUILD: ${{ needs.decide.outputs.fast_build }}
      NIGHTLY_COMPILE_ARCHS: ${{ needs.decide.outputs.compile_archs }}
      CHANNEL_ICON_NAME: ${{ needs.decide.outputs.icon_name }}
      # Jobs publish-nightly needs that run beside this one; derived from the
      # needs graph by tests/test_nightly_stop_if_publish_doomed.py.
      NIGHTLY_PUBLISH_PEERS: resolve-nightly-ghostty-cli-helper build-nightly-ghostty-cli-helper build-nightly-remote-daemon
    steps:
      - name: Checkout trusted unsigned-resume controls
        if: inputs.nightly_next_unsigned_run != ''
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          submodules: false

      - name: Restore the original unsigned nightly inputs
        if: inputs.nightly_next_unsigned_run != ''
        id: resume
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.nightly_next_unsigned_run }}
          SOURCE_ATTEMPT: ${{ inputs.nightly_next_unsigned_attempt }}
        run: python3 scripts/ci/resume-unsigned-nightly.py restore --run-id "$SOURCE_RUN" --attempt "$SOURCE_ATTEMPT"

      - name: Retain resumed cmux-nightly-unsigned-app
        if: inputs.nightly_next_unsigned_run != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-nightly-unsigned-app
          path: unsigned-resume/app/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Retain resumed cmux-nightly-remote-daemon
        if: inputs.nightly_next_unsigned_run != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-nightly-remote-daemon
          path: unsigned-resume/daemon/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Retain resumed cmux-nightly-ghostty-cli-helper
        if: inputs.nightly_next_unsigned_run != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-nightly-ghostty-cli-helper
          path: unsigned-resume/ghostty/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Retain resumed cmux-next-license-trees
        if: inputs.nightly_next_unsigned_run != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-next-license-trees
          path: unsigned-resume/licenses/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Retain resumed cmux-next-source-archive
        if: inputs.nightly_next_unsigned_run != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-next-source-archive
          path: unsigned-resume/source/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Retain unsigned resume provenance
        if: inputs.nightly_next_unsigned_run != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-nightly-unsigned-resume-receipt
          path: unsigned-resume/receipt.json
          if-no-files-found: error
          retention-days: 30

      - *clear-stale-git-locks-self-hos-2

      - name: Checkout build ref
        if: inputs.nightly_next_unsigned_run == '' && (runner.environment != 'self-hosted' || needs.decide.outputs.track != 'nightly-next')
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ needs.resolve-nightly-cmux-tui-client.outputs.build_sha }}
          submodules: recursive

      # A kept workspace: fetch only new objects (actions/checkout's depth-1 fetch resent the
      # tree, 118 s in run 39440747033) and keep the three Rust target dirs.
      - name: Checkout build ref (warm nightly-next builder)
        if: inputs.nightly_next_unsigned_run == '' && runner.environment == 'self-hosted' && needs.decide.outputs.track == 'nightly-next'
        env:
          BUILD_SHA: ${{ needs.resolve-nightly-cmux-tui-client.outputs.build_sha }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$BUILD_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "bad build sha: $BUILD_SHA" >&2; exit 1; }
          cd "$GITHUB_WORKSPACE"
          [ -d .git ] || git init -q .
          git config gc.auto 0
          if git remote get-url origin >/dev/null 2>&1; then git remote set-url origin "$REPO_URL"; else git remote add origin "$REPO_URL"; fi
          # The negotiation tells the server what the workspace has only
          # through refs; a detached HEAD alone makes it send the whole tree.
          if git rev-parse -q --verify HEAD >/dev/null; then
            git update-ref refs/remotes/origin/nightly-warm-base HEAD
          fi
          # Each try has its own limit and git's low-speed abort, and a failed try's partial pack
          # and locks are removed before the next (scripts/ci/git_fetch_retry.py). Run 40466772597
          # hung here for 62 min, then died with "early EOF". Measured on owned minis (25 runs,
          # 2026-10-26/27): 0-6 s warm, 194 s at most cold, so 600 s per try, 3 tries.
          # The kept clone holds an earlier build, so the helper comes from the workflow commit,
          # into RUNNER_TEMP where the checkout and clean below cannot remove it: from the local
          # objects, else raw.githubusercontent.com (bounded), else the clone's own copy.
          fetch_retry="$RUNNER_TEMP/git_fetch_retry.py"
          rm -f "$fetch_retry"
          git show "$WORKFLOW_SHA:scripts/ci/git_fetch_retry.py" > "$fetch_retry" 2>/dev/null \
            || curl -fsS --max-time 30 --retry 3 --retry-all-errors -o "$fetch_retry" \
              "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$WORKFLOW_SHA/scripts/ci/git_fetch_retry.py" \
            || cp scripts/ci/git_fetch_retry.py "$fetch_retry" 2>/dev/null \
            || rm -f "$fetch_retry"
          retry() {
            if [ -s "$fetch_retry" ]; then python3 "$fetch_retry" --tries 3 --timeout 600 --repo "$GITHUB_WORKSPACE" -- "$@"
            else
              # No helper: one try, with git's own low-speed abort, so a stall still ends in about a minute.
              echo "::warning title=warm checkout::git_fetch_retry.py unavailable; running git once with the low-speed abort"
              "$1" -c http.lowSpeedLimit=1024 -c http.lowSpeedTime=60 "${@:2}"
            fi
          }
          started=$SECONDS
          retry git -c protocol.version=2 fetch --no-tags --no-recurse-submodules origin "$BUILD_SHA"
          echo "fetched $BUILD_SHA in $((SECONDS - started)) s"
          git -c core.hooksPath=/dev/null checkout -q --force --detach "$BUILD_SHA"
          git update-ref refs/remotes/origin/nightly-warm-base "$BUILD_SHA"
          git clean -ffdxq -e /cmux-tui/target/ -e /Native/OptChat/optchat-chief/target/ -e /cmux-next-ios/rust/target/
          git reset -q --hard "$BUILD_SHA"
          git submodule sync -q --recursive
          started=$SECONDS
          retry git -c protocol.version=2 -c core.hooksPath=/dev/null submodule update --init --force --depth=1 --recursive
          echo "updated submodules in $((SECONDS - started)) s"
          # A hosted runner starts with clean submodules; drop what earlier runs left.
          git submodule foreach -q --recursive 'git clean -ffdxq && git reset -q --hard'
          git submodule foreach -q --recursive git config --local gc.auto 0
          # Each fetch adds a pack and gc.auto is off: fold them past 40.
          packs=$(find .git/objects/pack -name '*.pack' | wc -l | tr -d ' ')
          if [ "$packs" -gt 40 ]; then
            echo "$packs packs: repacking"
            git repack -a -d -l -q
          fi
          test "$(git rev-parse HEAD)" = "$BUILD_SHA"
          git status --short | head -20

      - name: Select Xcode
        if: inputs.nightly_next_unsigned_run == ''
        run: ./scripts/select-ci-xcode.sh

      # A persistent owned mini keeps the workspace between jobs. Checkout's
      # clean drops untracked output; remove the daemon handoff here too.
      - name: Clear build outputs a persistent runner kept
        if: inputs.nightly_next_unsigned_run == ''
        run: scripts/ci/clear-dirs.sh remote-daemon-assets

      - name: Wait through GitHub API rate limits in this job's gh calls
        # scripts/ci/gh_budget_wait.sh puts a gh first on PATH that waits for the shared budget's
        # reset (at most an hour per job, each wait logged) when a call is refused for the rate
        # limit, instead of failing the publish path. timeout-minutes leaves room for that hour.
        if: inputs.nightly_next_unsigned_run == ''
        run: if [ -f scripts/ci/gh_budget_wait.sh ]; then bash scripts/ci/gh_budget_wait.sh --install; fi

      - name: Fetch the Chromium engine
        if: inputs.nightly_next_unsigned_run == ''
        env:
          CMUX_CEF_R2_ACCOUNT_ID: ${{ secrets.CMUX_CEF_R2_ACCOUNT_ID }}
          CMUX_CEF_R2_ACCESS_KEY_ID: ${{ secrets.CMUX_CEF_R2_ACCESS_KEY_ID }}
          CMUX_CEF_R2_SECRET_ACCESS_KEY: ${{ secrets.CMUX_CEF_R2_SECRET_ACCESS_KEY }}
          CMUX_CEF_R2_ENV_FILE: /dev/null
          GH_TOKEN: ${{ secrets.CMUX_CEF_READ_TOKEN }}
        run: bash -e scripts/ci/nightly-steps/app-fetch-chromium-engine.sh

      - name: Start Release DerivedData empty
        id: release-derived-data
        if: inputs.nightly_next_unsigned_run == ''
        env:
          IMPORT_VARIANT: ${{ needs.decide.outputs.import_variant }}
          SWIFT_IMPORT_FLAGS: ${{ needs.decide.outputs.swift_import_flags }}
          EMPTY_BROWSER_SOURCES: ${{ needs.decide.outputs.empty_browser_sources }}
          DECIDE_TRACK: ${{ needs.decide.outputs.track }}
          DECIDE_CHANNEL: ${{ needs.decide.outputs.channel }}
        run: bash scripts/ci/nightly-steps/app-start-release-derived-data-empty.sh

      # Reuse the unsigned app of an earlier nightly-next build on the same inputs
      # (scripts/ci/nightly_release_product_reuse.py has the key and trust rules). A hit skips the
      # steps that only feed xcodebuild; stamping, signing and notarization always run.
      # vars.CI_NIGHTLY_NEXT_PRODUCT_REUSE=0 switches the lookup and the record off.
      - name: Look up the nightly app compiled on the same inputs
        id: nightly-product
        if: inputs.nightly_next_unsigned_run == '' && github.event_name == 'push' && github.ref == 'refs/heads/nightly-next' && needs.decide.outputs.track == 'nightly-next' && needs.decide.outputs.fast_build != 'true' && needs.decide.outputs.build_only != 'true' && needs.decide.outputs.notary_test != 'true' && needs.decide.outputs.notary_probe != 'true'
        # The lookup bounds itself (--timeout 240, then a miss): it never waits out a rate limit.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          # format(): an unset variable is null, and null == '0' is true.
          SKIP_REASON: ${{ format('{0}', vars.CI_NIGHTLY_NEXT_PRODUCT_REUSE) == '0' && 'vars.CI_NIGHTLY_NEXT_PRODUCT_REUSE is 0' || '' }}
          CMUX_TUI_TREE_KEY: ${{ needs.resolve-nightly-cmux-tui-client.outputs.key }}
          NIGHTLY_PRODUCT_TRACK: ${{ needs.decide.outputs.track }}
          NIGHTLY_PRODUCT_CHANNEL: ${{ needs.decide.outputs.channel }}
          NIGHTLY_PRODUCT_BUNDLE_ID: ${{ needs.decide.outputs.bundle_id }}
          NIGHTLY_PRODUCT_APP_NAME: ${{ needs.decide.outputs.app_name }}
          NIGHTLY_PRODUCT_URL_SCHEME: ${{ needs.decide.outputs.url_scheme }}
          NIGHTLY_PRODUCT_ENTITLEMENTS: ${{ needs.decide.outputs.entitlements }}
          NIGHTLY_PRODUCT_ICON_NAME: ${{ needs.decide.outputs.icon_name }}
          NIGHTLY_PRODUCT_VARIANTS: ${{ needs.decide.outputs.variants }}
          NIGHTLY_PRODUCT_COMPILE_ARCHS: ${{ needs.decide.outputs.compile_archs }}
          NIGHTLY_PRODUCT_IMPORT_VARIANT: ${{ needs.decide.outputs.import_variant }}
          NIGHTLY_PRODUCT_SWIFT_IMPORT_FLAGS: ${{ needs.decide.outputs.swift_import_flags }}
          NIGHTLY_PRODUCT_EMPTY_BROWSER_SOURCES: ${{ needs.decide.outputs.empty_browser_sources }}
          NIGHTLY_PRODUCT_PASSWORD_READERS_OUT: ${{ needs.decide.outputs.password_readers_out }}
        run: scripts/ci/nightly-release-product.sh lookup >> "$GITHUB_OUTPUT"

      - name: Compute Xcode compilation cache key
        if: (inputs.nightly_next_unsigned_run == '') && steps.nightly-product.outputs.hit != 'true'
        id: compilation-cache-key
        env:
          CACHE_KEY_TRACK: ${{ needs.decide.outputs.track }}
        run: bash scripts/ci/nightly-steps/app-compilation-cache-key.sh

      - name: Restore Xcode compilation cache
        id: compilation-cache-restore
        # A cold measurement run skips the restore; every gate below treats the
        # missing output like a cache miss, so the cold build still saves.
        if: inputs.nightly_next_unsigned_run == '' && (needs.decide.outputs.track != 'nightly-next' || steps.release-derived-data.outputs.mode == '') && (needs.decide.outputs.cold_cache != 'true')
        uses: ./.github/actions/cache-restore
        with:
          backend: ${{ inputs.cache_backend != 'default' && inputs.cache_backend || vars.CI_CACHE_BACKEND || 'r2' }}
          path: build-universal/CompilationCache.noindex
          key: xcode-compilation-release-${{ runner.os }}-${{ runner.arch }}-${{ steps.compilation-cache-key.outputs.toolchain }}-${{ needs.resolve-nightly-cmux-tui-client.outputs.build_sha }}
          restore-keys: |
            xcode-compilation-release-${{ runner.os }}-${{ runner.arch }}-${{ steps.compilation-cache-key.outputs.toolchain }}-

      - name: Install compilation dependencies
        if: (inputs.nightly_next_unsigned_run == '') && steps.nightly-product.outputs.hit != 'true'
        run: |
          ./scripts/install-rust-ci.sh
          ./scripts/download-prebuilt-ghosttykit.sh

      # The cmux-next Rust helpers below (acpmux, the OptChat Chief) compiled
      # every dependency from scratch on each nightly: about 150 s of the
      # serial build path (2026-10-09). Their target dirs keep the dependency
      # builds between nightly-next runs; cargo still rebuilds what changed.
      - name: Restore the acpmux and OptChat Chief dependency builds (cmux-next)
        if: (inputs.nightly_next_unsigned_run == '' && (needs.decide.outputs.track == 'nightly-next') && runner.environment != 'self-hosted') && steps.nightly-product.outputs.hit != 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          workspaces: |
            cmux-tui -> target/acpmux-app
            Native/OptChat/optchat-chief -> target/app
            cmux-next-ios/rust -> target/cmux-mobile-host-app
          shared-key: nightly-next-rust-helpers
          cache-all-crates: true

      - name: Fetch the resolved cmux-tui tree companions
        if: (inputs.nightly_next_unsigned_run == '' && needs.decide.outputs.track == 'nightly-next' && needs.decide.outputs.fast_build != 'true' && needs.decide.outputs.build_only != 'true') && steps.nightly-product.outputs.hit != 'true' && needs.resolve-nightly-cmux-tui-client.outputs.tree_pending != 'true'
        env:
          CMUX_TUI_TREE_KEY: ${{ needs.resolve-nightly-cmux-tui-client.outputs.key }}
          CMUX_TUI_TREE_TARGET: aarch64-apple-darwin
        run: bash scripts/ci/nightly-steps/app-fetch-tree-companions.sh

      # Bundle acpmux only aliases bin/acpmux to bin/cmux; its input file is never copied.
      - name: Stand in for the acpmux companion while the tree publishes
        if: (inputs.nightly_next_unsigned_run == '' && needs.resolve-nightly-cmux-tui-client.outputs.tree_pending == 'true') && steps.nightly-product.outputs.hit != 'true'
        run: |
          f="$RUNNER_TEMP/acpmux-input/acpmux"; mkdir -p "${f%/*}"; rm -f "$f.ref"; echo alias > "$f"
          echo "CMUX_NEXT_ACPMUX_BIN=$f" >> "$GITHUB_ENV"

      - name: Build in-tree acpmux for the compilation cache
        if: (inputs.nightly_next_unsigned_run == '') && steps.nightly-product.outputs.hit != 'true' && needs.resolve-nightly-cmux-tui-client.outputs.tree_pending != 'true'
        env:
          CMUX_NEXT_ACPMUX_ARCHS: ${{ needs.decide.outputs.compile_archs }}
        run: bash scripts/ci/nightly-steps/app-build-in-tree-acpmux.sh

      - name: Prepare the OptChat Chief cache key
        id: chief-cache-key
        if: (inputs.nightly_next_unsigned_run == '' && needs.decide.outputs.track == 'nightly-next') && steps.nightly-product.outputs.hit != 'true'
        env:
          SOURCE_KEY: ${{ needs.resolve-nightly-cmux-tui-client.outputs.chief_key }}
          ARCHS: ${{ env.NIGHTLY_COMPILE_ARCHS }}
        run: bash scripts/ci/nightly-steps/chief-cache-key.sh

      - name: Restore the OptChat Chief cache
        id: chief-cache-restore
        if: steps.chief-cache-key.outputs.cache_key != ''
        continue-on-error: true
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ steps.chief-cache-key.outputs.cache_root }}
          key: ${{ steps.chief-cache-key.outputs.save_key }}
          restore-keys: |
            ${{ steps.chief-cache-key.outputs.restore_prefix }}

      - name: Build the OptChat Chief (cmux-next)
        if: (inputs.nightly_next_unsigned_run == '' && (needs.decide.outputs.track == 'nightly-next')) && steps.nightly-product.outputs.hit != 'true'
        run: bash scripts/ci/nightly-steps/chief-build.sh

      - name: Build the cmux-next iPhone host (cmux-mobile-host)
        if: (inputs.nightly_next_unsigned_run == '' && needs.decide.outputs.track == 'nightly-next') && steps.nightly-product.outputs.hit != 'true'
        run: bash scripts/ci/nightly-steps/app-build-mobile-host.sh

      # A fast branch dogfood build only needs the arm64 client that is bundled
      # in this macOS app. Building it here avoids waiting for the full
      # cross-platform R2 artifact matrix. Main and release keep the immutable
      # manifest path below, so their machine and distribution artifacts stay
      # complete.
      - name: Install Zig for fast cmux-tui client
        if: inputs.nightly_next_unsigned_run == '' && (env.NIGHTLY_FAST_BUILD == 'true')
        run: ./scripts/install-zig-ci.sh

      - name: Build fast arm64 cmux-tui client
        if: inputs.nightly_next_unsigned_run == '' && (env.NIGHTLY_FAST_BUILD == 'true')
        working-directory: cmux-tui
        env:
          CMUX_TUI_DISTRIBUTION_VERSION: 0.0.0-nightly-${{ needs.resolve-nightly-cmux-tui-client.outputs.build_short_sha }}
          # Compiled into `cmux` (decision SV-R1), as in cmux-tui-build-package.yml.
          CMUX_SERVER_RELEASE_KEYS: ${{ vars.CMUX_SERVER_RELEASE_KEYS }}
          # Line tables in a separate .dSYM next to each binary, uploaded to Sentry below:
          # the bundled binary is stripped (strip-release-bundle.sh), so without these a
          # crash in cmux-tui, its host or acpmux (linked into the same binary) shows no
          # function, file or line. The shipped binary does not grow.
          CARGO_PROFILE_RELEASE_DEBUG: line-tables-only
          CARGO_PROFILE_RELEASE_SPLIT_DEBUGINFO: packed
        run: |
          set -euo pipefail
          unset CMUX_GHOSTTY_SRC
          CMUX_TUI_BUILD_COMMIT="$(git -C .. rev-parse HEAD)"
          CMUX_TUI_GHOSTTY_COMMIT="$(git -C ../ghostty-next rev-parse HEAD)"
          export CMUX_TUI_BUILD_COMMIT CMUX_TUI_GHOSTTY_COMMIT
          cargo build -p cmux-tui --bin cmux-tui --bin cmux-tui-host --release --locked --target aarch64-apple-darwin
          # The terminal holder, installed beside cmux-tui (its own invocation: std and libc only).
          cargo build -p cmux-holder --bin cmux-holder --release --locked --target aarch64-apple-darwin
          cargo build -p acpmux --bin acpmux --release --locked --target aarch64-apple-darwin
          binary="target/aarch64-apple-darwin/release/cmux-tui"
          test -x "$binary"
          probe="$($binary remote-probe --json)"
          PROBE="$probe" EXPECTED_COMMIT="$CMUX_TUI_BUILD_COMMIT" python3 - <<'PY'
          import json
          import os

          probe = json.loads(os.environ["PROBE"])
          expected = os.environ["EXPECTED_COMMIT"]
          if probe.get("build_identity") != expected:
              raise SystemExit(
                  f"cmux-tui build identity {probe.get('build_identity')!r} != {expected!r}"
              )
          if "wireguard-hub" not in probe.get("capabilities", []):
              raise SystemExit("fast cmux-tui client lacks wireguard-hub capability")
          PY

      - name: Cache Swift packages
        if: inputs.nightly_next_unsigned_run == '' && (needs.decide.outputs.track != 'nightly-next' || steps.release-derived-data.outputs.mode == '')
        id: swift-packages-restore
        uses: ./.github/actions/cache-restore
        with:
          backend: ${{ inputs.cache_backend != 'default' && inputs.cache_backend || vars.CI_CACHE_BACKEND || 'r2' }}
          path: .spm-cache
          key: spm-${{ hashFiles('cmux.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'scripts/ci/swiftpm-cache-layout') }}
          restore-keys: spm-

      - name: Sanitize Swift package cache
        if: (inputs.nightly_next_unsigned_run == '') && steps.nightly-product.outputs.hit != 'true'
        run: python3 scripts/ci/sanitize-xcode-source-packages-cache.py .spm-cache

      # The cmux-next web bundles (agent pane, pages, Activity, palette ranker,
      # webviews app) are built from this commit's sources, never taken from a
      # committed copy (cx-vn5). build-nightly-inputs builds them on Linux
      # beside this job with the same --force build; they are installed here,
      # right before the Release build, only when their source key is this
      # checkout's (nightly_inputs.py). Otherwise, or when that job has
      # not uploaded them yet, this step builds them as before: it never waits.
      # Nothing earlier reads them: optchat-chief compiles in the committed
      # inspector page (build-web-bundles.sh only checks that page in-tree).
      - name: Set up Bun (cmux-next web bundles)
        if: (inputs.nightly_next_unsigned_run == '' && (needs.decide.outputs.track == 'nightly-next')) && steps.nightly-product.outputs.hit != 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"

      # The webviews app's `vp build` must run on node: on bun it emits
      # different bytes (build-web-bundles.sh).
      - name: Setup Node (cmux-next web bundles)
        if: (inputs.nightly_next_unsigned_run == '' && (needs.decide.outputs.track == 'nightly-next')) && steps.nightly-product.outputs.hit != 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.22.1"

      # setup-node can succeed with no node on PATH (scripts/ci/ensure-setup-node.sh).
      - name: Check node is on PATH (cmux-next web bundles)
        if: (inputs.nightly_next_unsigned_run == '' && (needs.decide.outputs.track == 'nightly-next')) && steps.nightly-product.outputs.hit != 'true'
        timeout-minutes: 12
        run: scripts/ci/ensure-setup-node.sh 24.22.1

      # A pattern, not a name: an artifact that is not there yet downloads
      # nothing instead of failing.
      - name: Download the web bundles built beside the app (cmux-next)
        if: (inputs.nightly_next_unsigned_run == '' && (needs.decide.outputs.track == 'nightly-next')) && steps.nightly-product.outputs.hit != 'true'
        continue-on-error: true
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: cmux-nightly-web-bundles
          path: ${{ runner.temp }}/nightly-inputs/web
          merge-multiple: true

      - name: Build the web bundles (cmux-next)
        if: (inputs.nightly_next_unsigned_run == '' && (needs.decide.outputs.track == 'nightly-next')) && steps.nightly-product.outputs.hit != 'true'
        run: bash scripts/ci/nightly-steps/app-build-web-bundles.sh

      - name: Finish fetching the Chromium engine
        if: inputs.nightly_next_unsigned_run == ''
        run: python3 scripts/ci/background_build.py join --state "$RUNNER_TEMP/nightly-helper-builds" chromium-engine

      # The run cannot publish once a job publish-nightly needs, running beside
      # this one, has failed (run 40460194731 compiled and uploaded for 65 min
      # after its Ghostty helper failed): stop and give the Mac back. One read
      # of this attempt's jobs; a read error carries on. NIGHTLY_PUBLISH_PEERS
      # is derived from the needs graph by tests/test_nightly_stop_if_publish_doomed.py.
      - name: Stop when the run can no longer publish (before the compile)
        if: (inputs.nightly_next_unsigned_run == '') && steps.nightly-product.outputs.hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # An older resolved build_sha may predate the check: fail open.
          check=scripts/ci/stop_if_publish_doomed.py
          if [ ! -f "$check" ]; then echo "::notice::$check is not at this build_sha; carrying on"; exit 0; fi
          read -ra peers <<< "$NIGHTLY_PUBLISH_PEERS"
          python3 "$check" "${peers[@]}"

      - name: Build nightly app (Release)
        if: (inputs.nightly_next_unsigned_run == '') && steps.nightly-product.outputs.hit != 'true'
        env:
          IMPORT_VARIANT: ${{ needs.decide.outputs.import_variant }}
          SWIFT_IMPORT_FLAGS: ${{ needs.decide.outputs.swift_import_flags }}
          EMPTY_BROWSER_SOURCES: ${{ needs.decide.outputs.empty_browser_sources }}
          BUILD_TRACK: ${{ needs.decide.outputs.track }}
          DECIDE_COLD_CACHE_DISABLE: ${{ needs.decide.outputs.cold_cache == 'true' && '1' || '' }}
        run: bash scripts/ci/nightly-steps/app-build-release.sh

      - name: Bundle the OptChat Chief and the iPhone host
        if: (inputs.nightly_next_unsigned_run == '' && needs.decide.outputs.track == 'nightly-next') && steps.nightly-product.outputs.hit != 'true'
        run: bash scripts/ci/nightly-steps/app-bundle-chief-and-mobile-host.sh

      - name: Read whether the OptChat Chief was rebuilt
        id: chief-cache-result
        if: steps.chief-cache-key.outputs.cache_key != ''
        run: bash scripts/ci/nightly-steps/chief-cache-result.sh

      - name: Save the OptChat Chief cache
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/nightly-next' && steps.chief-cache-key.outputs.cache_key != '' && steps.chief-cache-result.outputs.rebuilt == 'true'
        continue-on-error: true
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ steps.chief-cache-key.outputs.cache_root }}
          key: ${{ steps.chief-cache-key.outputs.save_key }}

      # cmux-next ships THIRD_PARTY_LICENSES.md for exactly what this nightly
      # bundles: the daemon, app host and Cloud server come from this tree
      # (pin-cmux-tui.sh tree mode), so the notices do too, with exact closures
      # from `cargo tree`. build-nightly-inputs generates them on Linux
      # beside this job; they are taken when generated at this commit, else
      # generated here as before. The Release build copied the committed file;
      # bundle-notices replaces that copy with this tree's. The sign job
      # verifies the bundle against scripts/cmux-next/notices/bundle-map.json.
      # The dedicated builder's next build may build on this DerivedData only after this
      # one finished (nightly_build_state.py); a build that failed or was cancelled leaves it
      # unmarked, so the next one starts clean.
      - name: Mark the kept Release DerivedData built (dedicated nightly-next builder)
        if: success() && steps.release-derived-data.outputs.mode != '' && steps.nightly-product.outputs.hit != 'true'
        run: python3 scripts/ci/nightly_build_state.py mark-built

      - name: Download the third-party notices generated beside the app (cmux-next)
        if: (inputs.nightly_next_unsigned_run == '' && (needs.decide.outputs.track == 'nightly-next')) && steps.nightly-product.outputs.hit != 'true'
        continue-on-error: true
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: cmux-nightly-notices
          path: ${{ runner.temp }}/nightly-inputs/notices
          merge-multiple: true

      - name: Generate third-party notices (cmux-next)
        if: (inputs.nightly_next_unsigned_run == '' && (needs.decide.outputs.track == 'nightly-next')) && steps.nightly-product.outputs.hit != 'true'
        env:
          CMUX_NOTICES_ALLOW_CARGO: "1"
        run: bash scripts/ci/nightly-steps/app-third-party-notices.sh

      - name: Drop the empty Iroh.framework stub (nightly-next)
        if: (inputs.nightly_next_unsigned_run == '' && needs.decide.outputs.track == 'nightly-next') && steps.nightly-product.outputs.hit != 'true'
        run: bash scripts/ci/nightly-steps/app-drop-iroh-stub.sh

      - name: Prove the password-import readers are compiled out (cx-f58x notary test)
        if: inputs.nightly_next_unsigned_run == '' && (needs.decide.outputs.password_readers_out == 'true')
        run: |
          set -euo pipefail
          app="build-universal/Build/Products/Release/cmux.app"
          scripts/ci/check-password-import-readers.sh "$app/Contents/MacOS/cmux"

      - name: Bound Xcode compilation cache size
        if: (inputs.nightly_next_unsigned_run == '') && steps.nightly-product.outputs.hit != 'true'
        id: compilation-cache-bound
        run: bash scripts/ci/nightly-steps/app-bound-compilation-cache.sh

      - name: Bound the kept Rust target directories (warm nightly-next builder)
        if: always() && inputs.nightly_next_unsigned_run == '' && runner.environment == 'self-hosted' && needs.decide.outputs.track == 'nightly-next'
        run: bash scripts/ci/nightly-steps/app-bound-rust-targets.sh

      - name: Save Xcode compilation cache
        if: inputs.nightly_next_unsigned_run == '' && (needs.decide.outputs.track != 'nightly-next' || steps.release-derived-data.outputs.mode == '') && steps.compilation-cache-restore.outputs.cache-hit != 'true' && steps.compilation-cache-bound.outputs.save == 'true'
        uses: ./.github/actions/cache-save
        env:
          # Only an R2 save sees the bucket credentials.
          AWS_ACCESS_KEY_ID: *cache-r2-key-id
          AWS_SECRET_ACCESS_KEY: *cache-r2-secret
          CI_CACHE_R2_ENDPOINT: *cache-r2-endpoint
          CI_CACHE_R2_BUCKET: ${{ vars.CI_CACHE_R2_BUCKET }}
        with:
          backend: ${{ inputs.cache_backend != 'default' && inputs.cache_backend || vars.CI_CACHE_BACKEND || 'r2' }}
          path: build-universal/CompilationCache.noindex
          key: xcode-compilation-release-${{ runner.os }}-${{ runner.arch }}-${{ steps.compilation-cache-key.outputs.toolchain }}-${{ needs.resolve-nightly-cmux-tui-client.outputs.build_sha }}

      - name: Save Swift packages
        if: inputs.nightly_next_unsigned_run == '' && (needs.decide.outputs.track != 'nightly-next' || steps.release-derived-data.outputs.mode == '') && steps.swift-packages-restore.outputs.cache-hit != 'true'
        uses: ./.github/actions/cache-save
        env:
          # Only an R2 save sees the bucket credentials.
          AWS_ACCESS_KEY_ID: *cache-r2-key-id
          AWS_SECRET_ACCESS_KEY: *cache-r2-secret
          CI_CACHE_R2_ENDPOINT: *cache-r2-endpoint
          CI_CACHE_R2_BUCKET: ${{ vars.CI_CACHE_R2_BUCKET }}
        with:
          backend: ${{ inputs.cache_backend != 'default' && inputs.cache_backend || vars.CI_CACHE_BACKEND || 'r2' }}
          path: .spm-cache
          key: spm-${{ hashFiles('cmux.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'scripts/ci/swiftpm-cache-layout') }}

      - name: Bundle the fast cmux-tui client
        if: inputs.nightly_next_unsigned_run == '' && (env.NIGHTLY_FAST_BUILD == 'true')
        run: bash scripts/ci/nightly-steps/app-bundle-fast-cmux-tui-client.sh

      - name: Assemble the Computer Use helper
        if: (inputs.nightly_next_unsigned_run == '') && steps.nightly-product.outputs.hit != 'true'
        env:
          HELPER_ARCHS: ${{ contains(needs.decide.outputs.variants, 'x86_64') && 'arm64 x86_64' || 'arm64' }}
        run: bash scripts/ci/nightly-steps/app-assemble-computer-use-helper.sh

      - name: Resolve immutable SSH daemon metadata
        if: inputs.nightly_next_unsigned_run == '' && (needs.decide.outputs.build_only != 'true')
        id: remote_daemon
        env:
          RESOLVED_DAEMON_BUILD: ${{ needs.resolve-nightly-cmux-tui-client.outputs.daemon_build }}
          DAEMON_DECIDE_TRACK: ${{ needs.decide.outputs.track }}
          DECIDE_SHOULD_PUBLISH: ${{ needs.decide.outputs.should_publish }}
        run: bash scripts/ci/nightly-steps/app-resolve-daemon-metadata.sh

      - name: Strip unsigned nightly app before transfer
        if: (inputs.nightly_next_unsigned_run == '') && steps.nightly-product.outputs.hit != 'true'
        run: |
          set -euo pipefail
          products="build-universal/Build/Products/Release"
          ./scripts/strip-release-bundle.sh "$products/cmux.app"

      - name: Bundle the cmux-tui client
        id: install_client
        if: inputs.nightly_next_unsigned_run == '' && needs.decide.outputs.fast_build != 'true' && needs.decide.outputs.build_only != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CMUX_TUI_CLIENT_COMMIT: ${{ needs.resolve-nightly-cmux-tui-client.outputs.commit }}
          CMUX_TUI_CLIENT_KEY: ${{ needs.resolve-nightly-cmux-tui-client.outputs.key }}
          CMUX_TUI_CLIENT_CACHE: ${{ runner.temp }}/cmux-tui-client
          TREE_PENDING: ${{ needs.resolve-nightly-cmux-tui-client.outputs.tree_pending }}
          TREE_CANDIDATES: ${{ needs.resolve-nightly-cmux-tui-client.outputs.tree_candidates }}
        run: bash scripts/ci/nightly-steps/app-bundle-cmux-tui-client.sh

      - name: Report the embedded Chromium engine
        if: inputs.nightly_next_unsigned_run == ''
        run: bash scripts/ci/nightly-steps/app-report-chromium-engine.sh

      - name: Upload dSYMs to Sentry
        if: inputs.nightly_next_unsigned_run == '' && (needs.decide.outputs.build_only != 'true')
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: manaflow
          SENTRY_PROJECT: cmuxterm-macos
        run: bash -e scripts/ci/nightly-steps/app-upload-dsyms.sh

      - name: Archive unsigned nightly app
        if: inputs.nightly_next_unsigned_run == '' && (needs.decide.outputs.build_only != 'true')
        run: bash scripts/ci/nightly-steps/app-archive-unsigned.sh

      # The run cannot publish once a job publish-nightly needs, running beside
      # this one, has failed (run 40460194731 compiled and uploaded for 65 min
      # after its Ghostty helper failed): stop and give the Mac back. One read
      # of this attempt's jobs; a read error carries on. NIGHTLY_PUBLISH_PEERS
      # is derived from the needs graph by tests/test_nightly_stop_if_publish_doomed.py.
      - name: Stop when the run can no longer publish (before the upload)
        if: inputs.nightly_next_unsigned_run == '' && (needs.decide.outputs.build_only != 'true')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # An older resolved build_sha may predate the check: fail open.
          check=scripts/ci/stop_if_publish_doomed.py
          if [ ! -f "$check" ]; then echo "::notice::$check is not at this build_sha; carrying on"; exit 0; fi
          read -ra peers <<< "$NIGHTLY_PUBLISH_PEERS"
          python3 "$check" "${peers[@]}"

      # A stalled upload once held the Mac 39 min (run 40460194731): 10 min,
      # then one retry that replaces a partial upload.
      - name: Upload unsigned nightly app
        id: upload-unsigned
        if: inputs.nightly_next_unsigned_run == '' && (needs.decide.outputs.build_only != 'true')
        continue-on-error: true
        timeout-minutes: 10
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-nightly-unsigned-app
          path: ${{ runner.temp }}/cmux-nightly-unsigned.tar.gz
          # The tar.gz is already compressed; avoid wasting runner CPU on outer deflate.
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

      - name: Upload unsigned nightly app (retry)
        if: steps.upload-unsigned.outcome == 'failure'
        timeout-minutes: 10
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-nightly-unsigned-app
          path: ${{ runner.temp }}/cmux-nightly-unsigned.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
          overwrite: true

      # The dSYMs of every nightly-next build, a handoff to publish-nightly, which keeps a
      # published build's dSYMs on R2 (nightly-next/next/dsyms/): a crash or hang report
      # symbolicates from there when the Sentry download is not available (2026-10-10: a read
      # with a scoped token got 403 for nightly 38005665577; the upload above works). 21 days:
      # an unsigned resume (7) then the notarization-recovery window (14), so a build
      # recovered and published up to then still finds its dSYMs (this job holds no nightly-next R2 credentials to stage them
      # earlier). resume-unsigned-nightly.py also reads this artifact's name as the build's
      # source commit. Not 90: Actions storage is not an archive.
      - name: Keep the nightly-next dSYMs for publication
        if: inputs.nightly_next_unsigned_run == '' && (needs.decide.outputs.track == 'nightly-next' && needs.decide.outputs.build_only != 'true')
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-next-dsyms-${{ needs.resolve-nightly-cmux-tui-client.outputs.build_sha }}
          path: build-universal/Build/Products/Release/**/*.dSYM
          if-no-files-found: warn
          retention-days: 21
          compression-level: 6
          # A failed-jobs re-run recompiles under the same build number; the newest symbols win.
          overwrite: true

      - name: Finish the dSYM upload to Sentry
        if: inputs.nightly_next_unsigned_run == '' && (needs.decide.outputs.build_only != 'true')
        continue-on-error: true
        run: bash -e scripts/ci/nightly-steps/app-finish-dsym-upload.sh

      # A failed or cancelled job leaves no background helper build running.
      # The record a later build looks up; record=true only on a fresh VM that started clean.
      - name: Pack the nightly app for reuse
        id: nightly-product-pack
        if: success() && steps.nightly-product.outputs.record == 'true'
        continue-on-error: true
        env:
          KEY: ${{ steps.nightly-product.outputs.key }}
          BUILD_SHA: ${{ needs.resolve-nightly-cmux-tui-client.outputs.build_sha }}
          REUSED_FROM_RUN: ${{ steps.nightly-product.outputs.hit == 'true' && steps.nightly-product.outputs.source_run_id || '' }}
          REUSED_FROM_SHA: ${{ steps.nightly-product.outputs.hit == 'true' && steps.nightly-product.outputs.source_sha || '' }}
          COMPILED_RUN: ${{ steps.nightly-product.outputs.hit == 'true' && steps.nightly-product.outputs.compiled_run_id || '' }}
        run: scripts/ci/nightly-release-product.sh record >> "$GITHUB_OUTPUT"

      - name: Upload the nightly app for reuse
        id: nightly-product-upload
        if: steps.nightly-product-pack.outputs.archive != ''
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-nightly-next-release-archive-${{ needs.resolve-nightly-cmux-tui-client.outputs.build_sha }}
          path: ${{ steps.nightly-product-pack.outputs.archive }}
          if-no-files-found: error
          retention-days: 2
          compression-level: 0

      - name: Upload the nightly app record
        if: steps.nightly-product-upload.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-nightly-next-release-product-${{ steps.nightly-product.outputs.key }}
          path: ${{ steps.nightly-product-pack.outputs.manifest }}
          if-no-files-found: error
          # As long as the archive it names.
          retention-days: 2
          overwrite: true

      # The light jobs next take a mini idle now, else Blacksmith (Leo: "cant our minis just run them").
      - name: Mint the routing token for the light-job placement
        id: light-route-token
        if: success() && github.ref == 'refs/heads/nightly-next' && inputs.nightly_next_unsigned_run == '' && github.repository == 'manaflow-ai/cmux' && vars.CI_PR_POOL_OWNED == '1' && vars.GLAEDA_ROUTE_APP_ID != ''
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.GLAEDA_ROUTE_APP_ID }}
          private-key: ${{ secrets.GLAEDA_ROUTE_APP_KEY }}
          permission-administration: read
          permission-organization-self-hosted-runners: read

      - name: Place the light jobs on a free mini
        id: place-light
        if: success() && steps.light-route-token.outputs.token != ''
        continue-on-error: true
        timeout-minutes: 5
        env:
          JOBS: prepare-nightly-variant-primary prepare-nightly-variant await-nightly-tree-marker
          NIGHTLY: "1"
          REQUIRE_LIVE_CAPACITY: "1"
          NIGHTLY_WAIT_FOR_FLEET: "1"
          FLEET_LINUX: ""
          SIDE_LABEL: ${{ vars.CI_SIDE_LANE_RUNNER }}
          ROUTE_TOKEN: ${{ steps.light-route-token.outputs.token }}
          SNAPSHOT_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/portable_job_placement.py

      - name: Stop the helper builds still running
        if: always() && inputs.nightly_next_unsigned_run == ''
        run: python3 scripts/ci/background_build.py stop --state "$RUNNER_TEMP/nightly-helper-builds"

  build-nightly-remote-daemon:
    # Pure Go (CGO_ENABLED=0), manifests and uploads do not need the app builder, so it
    # builds beside build-nightly-app (its `if`), on the Ghostty helper's owned Mac pick,
    # else Blacksmith Linux. Resume already retained these exact assets in build-nightly-app.
    needs: [decide, resolve-nightly-cmux-tui-client, pick-nightly-build-runner]
    if: needs.decide.outputs.should_build == 'true' && (github.event_name != 'schedule' || github.event.schedule == '47 8 * * *') && needs.resolve-nightly-cmux-tui-client.outputs.already_published != 'true' && needs.resolve-nightly-cmux-tui-client.outputs.superseded != 'true' && needs.decide.outputs.continue_only != 'true' && needs.decide.outputs.build_only != 'true'
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.ref == 'refs/heads/nightly-next' && needs.pick-nightly-build-runner.outputs.attempt == github.run_attempt && needs.pick-nightly-build-runner.outputs.helper != needs.pick-nightly-build-runner.outputs.dedicated && needs.pick-nightly-build-runner.outputs.helper || vars.LINUX_RUNNER == 'blacksmith-16vcpu-ubuntu-2404' && 'blacksmith-16vcpu-ubuntu-2404' || 'blacksmith-32vcpu-ubuntu-2404' }}
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - name: Keep the resumed daemon assets
        if: inputs.nightly_next_unsigned_run != ''
        run: echo "The original run's daemon assets were retained by the unsigned resume."

      - name: Checkout build ref
        if: inputs.nightly_next_unsigned_run == ''
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ needs.resolve-nightly-cmux-tui-client.outputs.build_sha }}
          submodules: false

      - name: Set up Go for the SSH daemon assets
        if: inputs.nightly_next_unsigned_run == ''
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # The exact Go of the shipped cmuxd-remote (its go.mod `toolchain` line);
          # build_remote_daemon_release_assets.sh refuses any other.
          go-version-file: daemon/remote/go.mod
          cache: false

      - name: Build immutable SSH daemon assets once for every app variant
        if: inputs.nightly_next_unsigned_run == ''
        env:
          BUILD: ${{ needs.resolve-nightly-cmux-tui-client.outputs.daemon_build }}
          TRACK: ${{ needs.decide.outputs.track }}
          RELEASE_TAG: ${{ needs.decide.outputs.release_tag }}
        run: bash scripts/ci/nightly-steps/remote-daemon-build-assets.sh

      - name: Upload SSH daemon assets
        if: inputs.nightly_next_unsigned_run == ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-nightly-remote-daemon
          path: remote-daemon-assets/cmuxd-remote-*
          if-no-files-found: error
          retention-days: 14
          # A picker re-run (owned-pool rescue) re-runs this job after it succeeded beside a stuck app build.
          overwrite: true

  attest-nightly-remote-daemon:
    # Provenance is advisory, as it was inside the app job. No publishing job
    # needs this job: a quota wait must neither occupy a Mac nor delay the feed.
    needs: [build-nightly-remote-daemon]
    if: inputs.nightly_next_unsigned_run == ''
    # Credentials stay on the validated ephemeral set until exclusive owned-Mac admission exists.
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || contains(fromJSON('["blacksmith-16vcpu-ubuntu-2404","blacksmith-32vcpu-ubuntu-2404"]'), fromJSON(vars.RUNNER_POOLS || '{}').linux) && fromJSON(vars.RUNNER_POOLS || '{}').linux || github.run_attempt > 1 && 'blacksmith-16vcpu-ubuntu-2404' || 'blacksmith-32vcpu-ubuntu-2404' }}
    permissions:
      contents: read
      attestations: write
      id-token: write
    timeout-minutes: 75
    steps:
      - name: Checkout attestation controls
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          sparse-checkout: scripts/ci

      - name: Download SSH daemon assets
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: cmux-nightly-remote-daemon
          path: remote-daemon-assets

      # Provenance is for `gh attestation verify`; no nightly step reads it. Persisting it spends the shared
      # installation API budget (spent Oct 25-26: six runs threw a finished build away), so wait (bounded)
      # for 200 calls, try, wait once more, retry, and on a second refusal ship with a warning.
      - name: Wait for API budget before the daemon attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: if [ -f scripts/ci/gh_budget_wait.sh ]; then bash scripts/ci/gh_budget_wait.sh --reserve 200; fi

      - name: Attest immutable SSH daemon assets
        id: attest_daemon
        continue-on-error: true
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: remote-daemon-assets/cmuxd-remote-*

      - name: Wait for the API budget before retrying the daemon attestation
        if: steps.attest_daemon.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        # One bounded wait, only under 200 calls left; with the pre-step's, at most an hour.
        run: if [ -f scripts/ci/gh_budget_wait.sh ]; then bash scripts/ci/gh_budget_wait.sh --reserve 200; fi

      - name: Retry the daemon attestation
        id: attest_daemon_retry
        if: steps.attest_daemon.outcome == 'failure'
        continue-on-error: true
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: remote-daemon-assets/cmuxd-remote-*

      - name: Report a missing daemon attestation
        if: steps.attest_daemon.outcome == 'failure' && steps.attest_daemon_retry.outcome == 'failure'
        run: bash -e scripts/ci/nightly-steps/attest-report-missing.sh

  # Runs beside build-nightly-app. Deepening the shallow clone to find the
  # newest published cmux-tui commit took 1.5 to 11 minutes after the Xcode
  # compile (runs 36044415287, 36051668491); here it overlaps the compile.
  resolve-nightly-cmux-tui-client:
    needs: decide
    if: needs.decide.outputs.should_build == 'true' && (github.event_name != 'schedule' || github.event.schedule == '47 8 * * *') && (github.repository != 'manaflow-ai/cmux' || needs.decide.outputs.track != 'nightly-next' || vars.CI_NIGHTLY_ADMISSION_CHECKS != '1' || inputs.nightly_next_unsigned_run != '' || github.run_attempt == 1 && vars.CI_NIGHTLY_ONLY_RUNNER == 'glaeda-nightly-only-m4pro' || needs.decide.outputs.early_attempt == format('{0}', github.run_attempt) && needs.decide.outputs.early_admission_ready == 'true')
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.repository == 'manaflow-ai/cmux' && needs.decide.outputs.track == 'nightly-next' && github.run_attempt == 1 && vars.CI_NIGHTLY_ONLY_RUNNER == 'glaeda-nightly-only-m4pro' && vars.CI_NIGHTLY_ONLY_RUNNER || needs.decide.outputs.track == 'nightly-next' && (needs.decide.outputs.early_attempt == format('{0}', github.run_attempt) && needs.decide.outputs.early_resolve_nightly_tui_client_runner) || needs.decide.outputs.track == 'nightly-next' && github.run_attempt == 1 && 'ubuntu-24.04' || vars.LINUX_RUNNER == 'blacksmith-16vcpu-ubuntu-2404' && 'blacksmith-16vcpu-ubuntu-2404' || 'blacksmith-32vcpu-ubuntu-2404' }}
    permissions:
      contents: read
      actions: read
    timeout-minutes: 75
    outputs:
      commit: ${{ steps.resume_source.outputs.build_sha || steps.resolve.outputs.commit }}
      key: ${{ steps.resume_tree.outputs.key || steps.pending.outputs.key || steps.resolve.outputs.key }}
      source_commit: ${{ steps.resume_source.outputs.build_sha || steps.pending.outputs.source_commit || steps.resolve.outputs.source_commit }}
      tree_pending: ${{ steps.pending.outputs.tree_pending == 'true' && 'true' || 'false' }}
      tree_candidates: ${{ steps.pending.outputs.candidates }}
      build_sha: ${{ steps.build.outputs.build_sha }}
      build_short_sha: ${{ steps.build.outputs.build_short_sha }}
      tip_sha: ${{ needs.decide.outputs.head_sha }}
      behind: ${{ steps.build.outputs.behind }}
      behind_hours: ${{ steps.build.outputs.behind_hours }}
      chief_key: ${{ steps.chief-key.outputs.key }}
      already_published: ${{ steps.build.outputs.already_published }}
      superseded: ${{ steps.superseded.outputs.superseded }}
      # The build number (<run id><attempt>) for both side-by-side jobs, the app and the daemon.
      daemon_build: ${{ steps.daemon-build.outputs.build }}
    steps:
      - name: Fix this run's build number
        id: daemon-build
        run: echo "build=${GITHUB_RUN_ID}$(printf '%02d' "${GITHUB_RUN_ATTEMPT:-1}")" >> "$GITHUB_OUTPUT"

      - name: Checkout build ref
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ needs.decide.outputs.head_sha }}
          submodules: false
          # The resolver searches the last CMUX_TUI_TREE_SEARCH_COMMITS commits.
          fetch-depth: 64

      - &ensure-gh
        name: Install gh if this Linux runner lacks it
        if: runner.os == 'Linux'
        run: bash scripts/ci/nightly-steps/ensure-gh.sh

      - &wait-through-github-api-rate-l
        name: Wait through GitHub API rate limits in this job's gh calls
        run: if [ -f scripts/ci/gh_budget_wait.sh ]; then bash scripts/ci/gh_budget_wait.sh --install; fi

      - name: Validate the saved unsigned nightly source
        if: inputs.nightly_next_unsigned_run != ''
        id: resume_source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.nightly_next_unsigned_run }}
          SOURCE_ATTEMPT: ${{ inputs.nightly_next_unsigned_attempt }}
        run: python3 scripts/ci/resume-unsigned-nightly.py plan --run-id "$SOURCE_RUN" --attempt "$SOURCE_ATTEMPT"

      - name: Resolve the original cmux-tui tree
        if: inputs.nightly_next_unsigned_run != ''
        id: resume_tree
        env:
          SOURCE_SHA: ${{ steps.resume_source.outputs.build_sha }}
        run: bash scripts/ci/nightly-steps/resolve-original-tree.sh

      - name: Build the tip while its tree publishes
        id: pending
        if: inputs.nightly_next_unsigned_run == '' && needs.decide.outputs.track == 'nightly-next' && needs.decide.outputs.fast_build != 'true' && needs.decide.outputs.build_only != 'true'
        env:
          TIP_SHA: ${{ needs.decide.outputs.head_sha }}
        run: bash scripts/ci/nightly-steps/resolve-tree-pending.sh

      - name: Resolve cmux-tui client commit
        id: resolve
        if: inputs.nightly_next_unsigned_run == '' && needs.decide.outputs.fast_build != 'true' && needs.decide.outputs.build_only != 'true' && steps.pending.outputs.tree_pending != 'true'
        env:
          CMUX_TUI_TREE_SEARCH_COMMITS: "50"
          CMUX_TUI_TREE_MAX_AGE_HOURS: "24"
          CMUX_TUI_TREE_SAME_PATHS: .github/workflows/nightly.yml Native/OptChat/optchat-chief/Cargo.lock scripts/ci/nightly-steps
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/nightly-steps/resolve-cmux-tui-client-commit.sh

      - name: Choose the build commit
        id: build
        env:
          TIP_SHA: ${{ needs.decide.outputs.head_sha }}
          SOURCE_COMMIT: ${{ steps.resume_source.outputs.build_sha || steps.resolve.outputs.source_commit }}
          BEHIND: ${{ steps.resolve.outputs.behind }}
          BEHIND_HOURS: ${{ steps.resolve.outputs.behind_hours }}
          PUBLISHED_SHA: ${{ needs.decide.outputs.published_sha }}
          SHOULD_PUBLISH: ${{ needs.decide.outputs.should_publish }}
          FORCE_BUILD: ${{ needs.decide.outputs.force }}
        run: bash scripts/ci/nightly-steps/resolve-choose-build-commit.sh
      # The selected build source can differ from this workflow's control SHA.
      - name: Record pending tree dependency
        id: tree-source
        continue-on-error: true
        env:
          TREE_PENDING: ${{ steps.pending.outputs.tree_pending }}
          TREE_KEY: ${{ steps.pending.outputs.key }}
          BUILD_SHA: ${{ steps.build.outputs.build_sha }}
        run: python3 scripts/ci/nightly_tree_source.py dependency
      - name: Upload pending tree dependency
        if: steps.tree-source.outputs.name != ''
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.tree-source.outputs.name }}
          path: ${{ steps.tree-source.outputs.path }}
          if-no-files-found: error
          overwrite: true
          retention-days: 3
      - name: Compute portable OptChat Chief input key
        id: chief-key
        if: needs.decide.outputs.track == 'nightly-next' && inputs.nightly_next_unsigned_run == ''
        continue-on-error: true
        env:
          BUILD_SHA: ${{ steps.build.outputs.build_sha }}
          ARCHS: ${{ needs.decide.outputs.compile_archs }}
        run: bash scripts/ci/nightly-steps/chief-input-key.sh
      - name: Leave the build slot to a newer nightly-next push
        id: superseded
        if: github.event_name == 'push' && github.ref == 'refs/heads/nightly-next' && vars.NIGHTLY_NEXT_SUPERSEDE_SKIP == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          TIP_SHA: ${{ needs.decide.outputs.head_sha }}
          REPOSITORY: ${{ github.repository }}
        run: bash scripts/ci/nightly-steps/resolve-leave-build-slot.sh

  prepare-nightly-variant-primary:
    # No environment and no secrets. It runs no code from the bundle; the
    # theme picker regression and the sidecar handshake run on the signed app
    # in verify-signed-nightly. build-sign-notarize-nightly signs exactly the
    # app it uploads and runs no bundle code itself (#21024).
    needs: [decide, build-nightly-ghostty-cli-helper, build-nightly-app, build-nightly-remote-daemon, resolve-nightly-cmux-tui-client]
    if: needs.decide.outputs.should_build == 'true' && (github.event_name != 'schedule' || github.event.schedule == '47 8 * * *') && needs.decide.outputs.build_only != 'true' && needs.resolve-nightly-cmux-tui-client.outputs.already_published != 'true' && needs.resolve-nightly-cmux-tui-client.outputs.superseded != 'true' && needs.decide.outputs.continue_only != 'true'
    # actions:read lets the parallel artifact download resolve the blob URL.
    permissions:
      contents: read
      actions: read
    # Linux: only moves and reads files (llvm-lipo thins, giving Apple lipo's
    # bytes); Mach-O checks run in verify-signed-nightly. Like every Linux
    # nightly job it takes a runner-set member (16 vCPU when LINUX_RUNNER
    # names it, else 32), never LINUX_RUNNER as-is.
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || needs.build-nightly-app.outputs.light_attempt == format('{0}', github.run_attempt) && contains(needs.build-nightly-app.outputs.light_mini_jobs, ' prepare-nightly-variant-primary ') && needs.build-nightly-app.outputs.light_mini_runner || vars.LINUX_RUNNER == 'blacksmith-16vcpu-ubuntu-2404' && 'blacksmith-16vcpu-ubuntu-2404' || 'blacksmith-32vcpu-ubuntu-2404' }}
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.decide.outputs.variants) }}
    env:
      NIGHTLY_VARIANT: ${{ matrix.variant }}
      NIGHTLY_FAST_BUILD: ${{ needs.decide.outputs.fast_build }}
      TRACK: ${{ needs.decide.outputs.track }}
      CHANNEL_RELEASE_TAG: ${{ needs.decide.outputs.release_tag }}
      PREPARE_FALLBACK: ${{ github.job == 'prepare-nightly-variant' && 'true' || 'false' }}
    steps:
      - name: Reuse a successful primary preparation
        id: reuse
        if: env.PREPARE_FALLBACK == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT: cmux-${{ needs.decide.outputs.channel }}-prepared-app-${{ matrix.variant }}-${{ needs.resolve-nightly-cmux-tui-client.outputs.build_short_sha }}
        run: |
          set -euo pipefail
          # This read runs before the checkout (no budget wait yet); a refused one prepares here.
          if ! count="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=$ARTIFACT&per_page=20" --jq '[.artifacts[] | select(.expired == false)] | length')"; then
            echo "::warning::could not list this run's prepared artifacts; preparing the variant here"
            count=0
          fi
          if [ "$count" -gt 0 ]; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi

      - &clear-stale-git-locks-self-hos-3
        name: Clear stale git locks (self-hosted reused workspace)
        if: env.PREPARE_FALLBACK != 'true' || steps.reuse.outputs.exists != 'true'
        shell: bash
        run: |
          # Self-hosted macOS runners reuse the workspace. A job cancelled or
          # killed mid-checkout can leave a stale .git/modules/*/index.lock that
          # fails every later submodule checkout (e.g. ghostty). Clear them first.
          ws="${GITHUB_WORKSPACE:-$PWD}"
          rm -f "$ws/.git/index.lock" 2>/dev/null || true
          if [ -d "$ws/.git/modules" ]; then
            find "$ws/.git/modules" -type f -name "*.lock" -delete 2>/dev/null || true
          fi


      - &checkout-build-ref-2
        name: Checkout build ref
        if: env.PREPARE_FALLBACK != 'true' || steps.reuse.outputs.exists != 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ needs.resolve-nightly-cmux-tui-client.outputs.build_sha }}
          # Main and RC signing do not need submodules. nightly-next's notice
          # check reads ghostty-next/build.zig.zon, so initialize that optional
          # submodule in the next step only for the cmux-next track.
          submodules: false


      - *wait-through-github-api-rate-l

      - &init-cmux-next-notices-submodu
        name: Initialize cmux-next notices submodule
        if: ${{ (env.PREPARE_FALLBACK != 'true' || steps.reuse.outputs.exists != 'true') && (github.ref_name == 'nightly-next') }}
        shell: bash
        run: bash scripts/ci/init-submodule.sh ghostty-next


      # thin-app-bundle.sh, drop-cef-without-arch.sh and the checks below call
      # lipo. llvm-lipo's -thin output is Apple lipo's, byte for byte; its
      # -archs prints a trailing space that the exact comparisons refuse, so a
      # shim trims it.
      - &put-llvm-lipo-on-path-as-lipo
        name: Put llvm-lipo on PATH as lipo
        if: runner.os == 'Linux' && (env.PREPARE_FALLBACK != 'true' || steps.reuse.outputs.exists != 'true')
        run: |
          set -euo pipefail
          llvm_lipo="$(ls /usr/lib/llvm-18/bin/llvm-lipo 2>/dev/null || command -v llvm-lipo || ls /usr/lib/llvm-*/bin/llvm-lipo 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -z "$llvm_lipo" ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq llvm >/dev/null
            llvm_lipo="$(command -v llvm-lipo || ls /usr/lib/llvm-*/bin/llvm-lipo | sort -V | tail -n 1)"
          fi
          bin="$RUNNER_TEMP/lipo-bin"
          mkdir -p "$bin"
          {
            echo '#!/usr/bin/env bash'
            echo 'set -uo pipefail'
            echo 'for arg in "$@"; do'
            echo '  if [ "$arg" = -archs ]; then'
            echo "    out=\"\$('$llvm_lipo' \"\$@\")\" || exit \$?"
            echo "    printf '%s\\n' \"\$out\" | sed 's/[[:space:]]*\$//'"
            echo '    exit 0'
            echo '  fi'
            echo 'done'
            echo "exec '$llvm_lipo' \"\$@\""
          } > "$bin/lipo"
          chmod +x "$bin/lipo"
          echo "$bin" >> "$GITHUB_PATH"
          "$llvm_lipo" --version | head -n 2


      # download-artifact reads each blob over one connection. Fetch all three
      # signing inputs over ranged HTTP concurrently, while retaining the
      # action downloads as per-artifact fallbacks if a ranged request fails.
      - &download-signing-inputs-paralle
        name: Download signing inputs (parallel)
        if: env.PREPARE_FALLBACK != 'true' || steps.reuse.outputs.exists != 'true'
        id: signing-inputs-parallel
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          mkdir -p nightly-inputs/app nightly-inputs/ghostty remote-daemon-assets
          python3 scripts/ci/download-run-artifact.py \
            --name cmux-nightly-unsigned-app --out nightly-inputs/app \
            --connections 64 \
            >"$RUNNER_TEMP/nightly-app-download.log" 2>&1 &
          app_pid=$!
          python3 scripts/ci/download-run-artifact.py \
            --name cmux-nightly-remote-daemon --out remote-daemon-assets \
            >"$RUNNER_TEMP/nightly-daemon-download.log" 2>&1 &
          daemon_pid=$!
          python3 scripts/ci/download-run-artifact.py \
            --name cmux-nightly-ghostty-cli-helper --out nightly-inputs/ghostty \
            >"$RUNNER_TEMP/nightly-helper-download.log" 2>&1 &
          helper_pid=$!
          wait "$app_pid"; app_status=$?
          wait "$daemon_pid"; daemon_status=$?
          wait "$helper_pid"; helper_status=$?
          for log in \
            "$RUNNER_TEMP/nightly-app-download.log" \
            "$RUNNER_TEMP/nightly-daemon-download.log" \
            "$RUNNER_TEMP/nightly-helper-download.log"; do
            cat "$log"
          done
          app_ok=false; daemon_ok=false; helper_ok=false
          [ "$app_status" -eq 0 ] && app_ok=true
          [ "$daemon_status" -eq 0 ] && daemon_ok=true
          [ "$helper_status" -eq 0 ] && helper_ok=true
          {
            echo "app_ok=$app_ok"
            echo "daemon_ok=$daemon_ok"
            echo "helper_ok=$helper_ok"
          } >> "$GITHUB_OUTPUT"
          exit 0


      - &download-unsigned-nightly-app
        name: Download unsigned nightly app
        if: ${{ (env.PREPARE_FALLBACK != 'true' || steps.reuse.outputs.exists != 'true') && (steps.signing-inputs-parallel.outputs.app_ok != 'true') }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cmux-nightly-unsigned-app
          path: nightly-inputs/app


      - &download-ssh-daemon-assets
        name: Download SSH daemon assets
        if: ${{ (env.PREPARE_FALLBACK != 'true' || steps.reuse.outputs.exists != 'true') && (steps.signing-inputs-parallel.outputs.daemon_ok != 'true') }}
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: cmux-nightly-remote-daemon
          path: remote-daemon-assets


      - &download-universal-ghostty-cli
        name: Download universal Ghostty CLI helper
        if: ${{ (env.PREPARE_FALLBACK != 'true' || steps.reuse.outputs.exists != 'true') && (steps.signing-inputs-parallel.outputs.helper_ok != 'true') }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cmux-nightly-ghostty-cli-helper
          path: nightly-inputs/ghostty


      # Blocking, like the step that builds it: a nightly-next app always
      # ships the Ghostty license tree. This is a small artifact containing
      # only the trees, rather than the complete source offer archive.
      - &download-nightly-ghostty-license-trees
        name: Download the Ghostty dependency license trees (cmux-next)
        if: ${{ (env.PREPARE_FALLBACK != 'true' || steps.reuse.outputs.exists != 'true') && (needs.decide.outputs.track == 'nightly-next' && needs.decide.outputs.fast_build != 'true') }}
        id: ghostty_licenses
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cmux-next-license-trees
          path: nightly-inputs/license-trees


      - &restore-unsigned-nightly-produ
        name: Restore unsigned nightly products
        if: env.PREPARE_FALLBACK != 'true' || steps.reuse.outputs.exists != 'true'
        run: |
          set -euo pipefail
          products="build-universal/Build/Products/Release"
          mkdir -p "$products"
          # The Mac's tar records extended attributes GNU tar does not restore.
          # On an owned Mac (the outage fallback) the Mac's own tar restores them,
          # as this job did before it moved to Linux (#25885).
          if [ "$RUNNER_OS" = Linux ]; then
            tar --warning=no-unknown-keyword -C "$products" -xzf nightly-inputs/app/cmux-nightly-unsigned.tar.gz
