      # The cx-f58x browser-data scan runs here, on the per-run hosted lane,
      # before anything is injected or signed. In build-nightly-app it took
      # 54-55 s of the 12-14 minute warm slot that serializes every nightly-next
      # build (runs 39371003711, 39373745957, 39374887542). It scans file
      # contents, so the strip before transfer does not hide anything from it;
      # it now also covers what build-nightly-app adds after the compile (the
      # Computer Use helper, cmux-symbols.bin), which is the bundle that ships.
      # The password-reader proof reads symbols with nm, which the strip
      # removes, so it stays right after the compile in build-nightly-app.
      # The scan reads every file of the bundle (93-121 s in runs 39508830200,
      # 39509829525, 39519824930), so it runs in the background on a copy
      # of the bundle as it is here, while the steps below change the
      # original; "Finish the browser-data import proof" waits for it before
      # the prepared app is uploaded. The FIFO write blocks until that step
