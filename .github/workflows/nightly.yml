              && [ -f "$mirror/glaeda-verified" ] && [ ! -e "$mirror/glaeda-repair-pending" ] && [ ! -e "$mirror/shallow" ] \
              && ! grep -qxF "$mirror/objects" .git/objects/info/alternates 2>/dev/null \
