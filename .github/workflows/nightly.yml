name: Nightly macOS build

# One workflow, two publish channels. A push to `main` publishes cmux NIGHTLY
# (bundle id com.cmuxterm.app.nightly, GitHub release `nightly`, feed
# files.cmux.com/nightly). A push to an `rc/**` branch publishes a release
# candidate with the STABLE identity (com.cmuxterm.app, release `rc`, feed
# files.cmux.com/rc): the same bits a later `vX.Y.Z` tag promotes to the stable
# release without rebuilding. Installs opt into the rc feed through the
# `updates.channel` setting. Everything channel-specific is resolved once in
# `decide`; every later job reads it from there.
on:
  # Publish every changed main revision, while keeping the scheduled cache warm.
  # Publish every push to a release-candidate branch as the RC channel.
  push:
    branches:
      - main
      - "rc/**"
  schedule:
    - cron: "17 */6 * * *"
    - cron: "47 8 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Force a nightly build even if main has no new commits
        required: false
        default: false
        type: boolean
      fast:
        description: Build one arm64 dogfood DMG without Intel or Sparkle delta work
        required: false
        default: false
        type: boolean
      build_only:
        description: Measure the unsigned universal build only. Never builds the helper, signs, notarizes, uploads dSYMs, or publishes.
        required: false
        default: false
        type: boolean
      cold_cache:
        description: Skip the Xcode compilation cache restore so the measurement run is a cache miss. Only honoured with build_only.
        required: false
        default: false
        type: boolean

concurrency:
  # A fast branch dogfood run must not wait behind a queued full matrix run on
  # the same branch. Full runs remain serialized with other full runs. A
  # build-only measurement run publishes nothing, so it gets a group of its own:
  # GitHub cancels the pending run of a group when a newer run queues, and a
  # measurement run must never cancel a pending publish.
  group: nightly-build-${{ github.ref_name }}-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.build_only == 'true' && format('nightly-measure-{0}', github.run_id) || (github.event_name == 'workflow_dispatch' && github.event.inputs.fast == 'true' && 'fast' || 'full') }}
  # Queue concurrent runs instead of canceling them so no build is lost.
  cancel-in-progress: false

permissions:
  contents: write
  attestations: write
  id-token: write

env:
  CREATE_DMG_VERSION: 8.0.0

jobs:
  decide:
    runs-on: ${{ vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    outputs:
      should_build: ${{ steps.decide.outputs.should_build }}
      head_sha: ${{ steps.decide.outputs.head_sha }}
      short_sha: ${{ steps.decide.outputs.short_sha }}
      should_publish: ${{ steps.decide.outputs.should_publish }}
      variants: ${{ steps.decide.outputs.variants }}
      legacy_variant: ${{ steps.decide.outputs.legacy_variant }}
      fast_build: ${{ steps.decide.outputs.fast_build }}
      build_only: ${{ steps.decide.outputs.build_only }}
      cold_cache: ${{ steps.decide.outputs.cold_cache }}
      # Channel identity. `channel` is `nightly` or `rc`; the rest are the
      # derived strings so no later job re-derives them from the ref.
      channel: ${{ steps.decide.outputs.channel }}
      channel_upper: ${{ steps.decide.outputs.channel_upper }}
      bundle_id: ${{ steps.decide.outputs.bundle_id }}
      app_name: ${{ steps.decide.outputs.app_name }}
      url_scheme: ${{ steps.decide.outputs.url_scheme }}
      dmg_prefix: ${{ steps.decide.outputs.dmg_prefix }}
      release_tag: ${{ steps.decide.outputs.release_tag }}
      release_name: ${{ steps.decide.outputs.release_name }}
      feed_base: ${{ steps.decide.outputs.feed_base }}
      entitlements: ${{ steps.decide.outputs.entitlements }}
      icon_name: ${{ steps.decide.outputs.icon_name }}
      profile_secret_prefix: ${{ steps.decide.outputs.profile_secret_prefix }}
      metadata_channel: ${{ steps.decide.outputs.metadata_channel }}
      baked_feed_url: ${{ steps.decide.outputs.baked_feed_url }}
    steps:
      - name: Decide whether a nightly build is needed
        id: decide
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          FORCE_BUILD: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.force == 'true' && 'true' || 'false' }}
          FAST_BUILD: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.fast == 'true' && 'true' || 'false' }}
          BUILD_ONLY: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.build_only == 'true' && 'true' || 'false' }}
          COLD_CACHE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.cold_cache == 'true' && 'true' || 'false' }}
        with:
          script: |
            const forceBuild = process.env.FORCE_BUILD === 'true';
            // A build-only run measures the unsigned universal app build (cold
            // or warm cache) and stops there: no helper, signing, notarization,
            // dSYM upload, or publication, so it is safe to dispatch from a
            // branch. It always builds the production workload, so the fast
            // arm64 path is ignored, and it never depends on the nightly tag.
            const buildOnly = process.env.BUILD_ONLY === 'true';
            const coldCache = buildOnly && process.env.COLD_CACHE === 'true';
            const fastBuild = !buildOnly && process.env.FAST_BUILD === 'true';
            // Nightly ships one universal DMG for downloads plus one thin DMG per
            // architecture for updates. Browsers cannot tell Apple silicon from
            // Intel, so `cmux-nightly-macos.dmg` and the legacy `appcast.xml`
            // feed stay universal; the app's feed resolver moves every install
            // onto its architecture's feed at the first update check.
            // A manually dispatched fast build is a branch-dogfood artifact only.
            // It deliberately produces one Apple silicon DMG and never publishes
            // to the shared NIGHTLY release or feed.
            const variants = fastBuild ? ['arm64'] : ['arm64', 'x86_64', 'universal'];
            core.setOutput('variants', JSON.stringify(variants));
            core.setOutput('legacy_variant', 'universal');
            core.setOutput('fast_build', fastBuild ? 'true' : 'false');
            core.setOutput('build_only', buildOnly ? 'true' : 'false');
            core.setOutput('cold_cache', coldCache ? 'true' : 'false');
            const { owner, repo } = context.repo;
            const requestedRef = context.ref.startsWith('refs/heads/')
              ? context.ref.replace('refs/heads/', '')
              : 'main';
            const isMainRef = requestedRef === 'main';
            // `rc/<version>` branches publish the RC channel. Any other
            // non-main ref is a branch dogfood run that publishes nothing.
            const isRcRef = requestedRef.startsWith('rc/');
            const channel = isRcRef ? 'rc' : 'nightly';
            const channelIdentity = {
              nightly: {
                bundleId: 'com.cmuxterm.app.nightly',
                appName: 'cmux NIGHTLY',
                urlScheme: 'cmux-nightly',
                dmgPrefix: 'cmux-nightly-macos',
                releaseTag: 'nightly',
                releaseName: 'Nightly',
                feedBase: 'https://files.cmux.com/nightly',
                entitlements: 'cmux.nightly.entitlements',
                iconName: 'AppIcon-Nightly',
              },
              // The release candidate IS the next stable build: same bundle
              // id, name, icon, entitlements, profiles, feed URL, and version
              // strings as a stable release. Only the GitHub release and the
              // R2 feed prefix differ, and an install opts into that feed
              // through the `updates.channel` setting. Promotion copies the
              // RC DMG to the stable release unchanged.
              rc: {
                bundleId: 'com.cmuxterm.app',
                appName: 'cmux',
                urlScheme: 'cmux',
                dmgPrefix: 'cmux-rc-macos',
                releaseTag: 'rc',
                releaseName: 'Release Candidate',
                feedBase: 'https://files.cmux.com/rc',
                entitlements: 'cmux.release.entitlements',
                iconName: 'AppIcon',
                profileSecretPrefix: 'RELEASE',
                metadataChannel: 'stable',
                // Sparkle feed baked into the bundle: the stable feed, because
                // these bits become the stable release. RC installs poll the
                // rc feed through the setting, not through Info.plist.
                bakedFeedURL: 'https://github.com/manaflow-ai/cmux/releases/latest/download/appcast.xml',
              },
            }[channel];
            channelIdentity.profileSecretPrefix ??= 'NIGHTLY';
            channelIdentity.metadataChannel ??= channel;
            channelIdentity.bakedFeedURL ??= '';
            core.setOutput('channel', channel);
            core.setOutput('channel_upper', channel.toUpperCase());
            core.setOutput('bundle_id', channelIdentity.bundleId);
            core.setOutput('app_name', channelIdentity.appName);
            core.setOutput('url_scheme', channelIdentity.urlScheme);
            core.setOutput('dmg_prefix', channelIdentity.dmgPrefix);
            core.setOutput('release_tag', channelIdentity.releaseTag);
            core.setOutput('release_name', channelIdentity.releaseName);
            core.setOutput('feed_base', channelIdentity.feedBase);
            core.setOutput('entitlements', channelIdentity.entitlements);
            core.setOutput('icon_name', channelIdentity.iconName);
            core.setOutput('profile_secret_prefix', channelIdentity.profileSecretPrefix);
            core.setOutput('metadata_channel', channelIdentity.metadataChannel);
            core.setOutput('baked_feed_url', channelIdentity.bakedFeedURL);

            // Pin every run to the revision that triggered it. In particular,
            // queued main pushes must each build their own merge commit instead
            // of all resolving to whichever commit is newest when `decide` runs.
            const headSha = context.sha;

            // The channel's release tag is the completion marker: the last
            // commit this channel published. Nightly on main skips a rerun of
            // the same commit; an RC branch always rebuilds its head so every
            // cherry-pick becomes a new candidate, so the marker is only
            // consulted for main.
            let nightlySha = null;
            if (isMainRef) {
              try {
                const ref = await github.rest.git.getRef({
                  owner,
                  repo,
                  ref: `tags/${channelIdentity.releaseTag}`,
                });
                if (ref.data.object.type === 'commit') {
                  nightlySha = ref.data.object.sha;
                } else if (ref.data.object.type === 'tag') {
                  const tagObject = await github.rest.git.getTag({
                    owner,
                    repo,
                    tag_sha: ref.data.object.sha,
                  });
                  nightlySha = tagObject.data.object.sha;
                }
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }

            const shouldBuild = buildOnly || !isMainRef || forceBuild || nightlySha !== headSha;
            const shouldPublish = (isMainRef || isRcRef) && !buildOnly && !fastBuild;
            core.setOutput('should_build', shouldBuild ? 'true' : 'false');
            core.setOutput('head_sha', headSha);
            core.setOutput('short_sha', headSha.slice(0, 7));
            core.setOutput('should_publish', shouldPublish ? 'true' : 'false');
            core.summary
              .addHeading(`${channelIdentity.releaseName} build decision`)
              .addTable([
                [{data: 'requested ref', header: true}, requestedRef],
                [{data: 'channel', header: true}, channel],
                [{data: 'build HEAD', header: true}, headSha],
                [{data: 'nightly tag', header: true}, nightlySha ?? '(missing)'],
                [{data: 'force build', header: true}, String(forceBuild)],
                [{data: 'should build', header: true}, String(shouldBuild)],
                [{data: 'should publish', header: true}, String(shouldPublish)],
                [{data: 'fast dogfood build', header: true}, String(fastBuild)],
                [{data: 'build-only measurement', header: true}, String(buildOnly)],
                [{data: 'cold compilation cache', header: true}, String(coldCache)],
                [{data: 'variants', header: true}, variants.join(', ')],
              ])
              .write();

  refresh-compilation-cache:
    needs: decide
    if: github.event_name == 'schedule' && github.event.schedule == '17 */6 * * *'
    # Match the PR Release-build runner and Xcode so its compilation cache is reusable.
    runs-on: ${{ vars.MACOS_RUNNER_26_RELEASE || 'blacksmith-6vcpu-macos-26' }}
    # This job rebuilds the cache after the store drops it, so it runs cold
    # by design; scheduled run 35134963192 was cancelled at 45 minutes.
    timeout-minutes: 90
    env:
      CMUX_CI_XCODE_APP: ${{ vars.CMUX_CI_XCODE_APP_MACOS_26 }}
      CMUX_CI_REQUIRED_MACOS_SDK_MAJOR: "26"
    steps:
      - name: Clear stale git locks (self-hosted reused workspace)
        shell: bash
        run: |
          ws="${GITHUB_WORKSPACE:-$PWD}"
          rm -f "$ws/.git/index.lock" 2>/dev/null || true
          if [ -d "$ws/.git/modules" ]; then
            find "$ws/.git/modules" -type f -name "*.lock" -delete 2>/dev/null || true
          fi

      - name: Checkout cache ref
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ needs.decide.outputs.head_sha }}
          fetch-depth: 0
          submodules: recursive

      - name: Select Xcode
        run: ./scripts/select-ci-xcode.sh

      - name: Compute Xcode compilation cache key
        id: compilation-cache-key
        run: |
          set -euo pipefail
          echo "toolchain=$(xcodebuild -version | shasum -a 256 | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Restore Xcode compilation cache
        id: compilation-cache-restore
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: build-universal/CompilationCache.noindex
          key: xcode-compilation-release-${{ runner.os }}-${{ runner.arch }}-${{ steps.compilation-cache-key.outputs.toolchain }}-${{ needs.decide.outputs.head_sha }}
          restore-keys: |
            xcode-compilation-release-${{ runner.os }}-${{ runner.arch }}-${{ steps.compilation-cache-key.outputs.toolchain }}-

      - name: Install compilation dependencies
        if: steps.compilation-cache-restore.outputs.cache-hit != 'true'
        run: |
          ./scripts/install-rust-ci.sh
          ./scripts/install-zig-ci.sh
          ./scripts/download-prebuilt-ghosttykit.sh

      - name: Cache Swift packages
        if: steps.compilation-cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .spm-cache
          key: spm-${{ hashFiles('cmux.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-

      - name: Sanitize Swift package cache
        if: steps.compilation-cache-restore.outputs.cache-hit != 'true'
        run: python3 scripts/ci/sanitize-xcode-source-packages-cache.py .spm-cache

      - name: Set up Go for the Cloud tunnel extension
        if: steps.compilation-cache-restore.outputs.cache-hit != 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          cache: false

      - name: Refresh universal nightly compilation cache
        if: steps.compilation-cache-restore.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          CMUX_SKIP_ZIG_BUILD=1 xcodebuild -scheme cmux -configuration Release -derivedDataPath build-universal \
            -destination 'generic/platform=macOS' \
            -clonedSourcePackagesDirPath .spm-cache \
            -showBuildTimingSummary \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            COMPILATION_CACHE_ENABLE_CACHING=YES \
            COMPILATION_CACHE_LIMIT_SIZE=3221225472 \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO ASSETCATALOG_COMPILER_APPICON_NAME=AppIcon-Nightly build

      - name: Bound Xcode compilation cache size
        id: compilation-cache-bound
        if: steps.compilation-cache-restore.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          cache_path="build-universal/CompilationCache.noindex"
          max_cache_kib=$((5 * 1024 * 1024))
          if [ -d "$cache_path" ]; then
            # Xcode's CAS chains v1.N generations: the newest is the primary,
            # the one before it is the upstream it faults objects in from, and
            # anything older is dead until the CAS's next garbage collection.
            # The CAS rotates a new primary whenever the current one ends a
            # build above half of COMPILATION_CACHE_LIMIT_SIZE (1.5 GiB here,
            # below one build's 3.3 GB working set), so every warm build leaves
            # a dead generation behind, the directory measures two full builds
            # (6.6 GB on main), and this bound used to drop every warm cache.
            # Prune the dead generations first, exactly as the CAS would.
            python3 scripts/ci/prune-xcode-compilation-cache.py "$cache_path" \
              || echo "::warning::Xcode compilation cache pruning failed; measuring it unpruned"
            cache_kib=$(du -sk "$cache_path" | awk '{print $1}')
          else
            cache_kib=0
          fi
          echo "Xcode compilation cache size: ${cache_kib} KiB (limit: ${max_cache_kib} KiB)"
          save=false
          if [ "$cache_kib" -gt "$max_cache_kib" ]; then
            # Nothing is saved, so the next build restores the same older entry
            # and lands here again: the cache freezes at its last saved entry
            # until the bound (and COMPILATION_CACHE_LIMIT_SIZE) is raised.
            echo "::warning::Xcode compilation cache exceeds 5 GiB; skipping cache save"
            rm -rf "$cache_path"
          elif [ "$cache_kib" -gt 0 ]; then
            save=true
          else
            echo "Xcode compilation cache is empty; skipping cache save"
          fi
          echo "save=${save}" >> "$GITHUB_OUTPUT"

      - name: Save Xcode compilation cache
        if: steps.compilation-cache-restore.outputs.cache-hit != 'true' && steps.compilation-cache-bound.outputs.save == 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: build-universal/CompilationCache.noindex
          key: xcode-compilation-release-${{ runner.os }}-${{ runner.arch }}-${{ steps.compilation-cache-key.outputs.toolchain }}-${{ needs.decide.outputs.head_sha }}

  build-nightly-ghostty-cli-helper:
    needs: decide
    if: needs.decide.outputs.should_build == 'true' && (github.event_name != 'schedule' || github.event.schedule == '47 8 * * *') && needs.decide.outputs.build_only != 'true'
    # Zig 0.15.2 cannot link the real helper on macOS 26. Match the stable
    # release workflow by building and verifying it on macOS 15 instead.
    runs-on: ${{ needs.decide.outputs.fast_build == 'true' && 'blacksmith-6vcpu-macos-15' || vars.MACOS_RUNNER_15 || 'blacksmith-6vcpu-macos-15' }}
    timeout-minutes: 20
    env:
      NIGHTLY_FAST_BUILD: ${{ needs.decide.outputs.fast_build }}
    steps:
      - name: Clear stale git locks (self-hosted reused workspace)
        shell: bash
        run: |
          ws="${GITHUB_WORKSPACE:-$PWD}"
          rm -f "$ws/.git/index.lock" 2>/dev/null || true
          if [ -d "$ws/.git/modules" ]; then
            find "$ws/.git/modules" -type f -name "*.lock" -delete 2>/dev/null || true
          fi

      - name: Checkout helper ref
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ needs.decide.outputs.head_sha }}
          submodules: recursive

      - name: Install Zig
        run: ./scripts/install-zig-ci.sh

      - name: Cache Zig packages
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/zig
          key: zig-packages-${{ hashFiles('ghostty/build.zig.zon', 'ghostty/build.zig.zon.json') }}
          restore-keys: zig-packages-

      - name: Build Ghostty CLI helper
        run: |
          set -euo pipefail
          mkdir -p nightly-helper
          if [[ "$NIGHTLY_FAST_BUILD" == "true" ]]; then
            ./scripts/build-ghostty-cli-helper.sh --target aarch64-macos --output nightly-helper/ghostty
            lipo nightly-helper/ghostty -verify_arch arm64
          else
            ./scripts/build-ghostty-cli-helper.sh --universal --output nightly-helper/ghostty
            lipo nightly-helper/ghostty -verify_arch arm64 x86_64
          fi

      - name: Upload Ghostty CLI helper
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-nightly-ghostty-cli-helper
          path: nightly-helper/ghostty
          if-no-files-found: error
          retention-days: 1

  build-nightly-app:
    needs: decide
    if: needs.decide.outputs.should_build == 'true' && (github.event_name != 'schedule' || github.event.schedule == '47 8 * * *')
    # Full runs match the cache warmer and stable release lane. Fast branch
    # dogfood always uses the dedicated Blacksmith image. A repository-wide
    # runner override may point at a slower shared builder, which defeats the
    # purpose of the one-architecture path.
    runs-on: ${{ needs.decide.outputs.fast_build == 'true' && 'blacksmith-12vcpu-macos-26' || vars.MACOS_RUNNER_26_NIGHTLY_BUILD || 'blacksmith-6vcpu-macos-26' }}
    # The Blacksmith cache is scoped per branch and also drops main's own
    # entry (runs 35179030871 and 35182663752 restored nothing and were
    # cancelled at 45 minutes mid-compile), so the budget must fit a cold
    # build, not only a warm one.
    timeout-minutes: 90
    env:
      CMUX_CI_XCODE_APP: ${{ vars.CMUX_CI_XCODE_APP_MACOS_26 }}
      CMUX_CI_REQUIRED_MACOS_SDK_MAJOR: "26"
      NIGHTLY_FAST_BUILD: ${{ needs.decide.outputs.fast_build }}
      CHANNEL_ICON_NAME: ${{ needs.decide.outputs.icon_name }}
    steps:
      - name: Clear stale git locks (self-hosted reused workspace)
        shell: bash
        run: |
          ws="${GITHUB_WORKSPACE:-$PWD}"
          rm -f "$ws/.git/index.lock" 2>/dev/null || true
          if [ -d "$ws/.git/modules" ]; then
            find "$ws/.git/modules" -type f -name "*.lock" -delete 2>/dev/null || true
          fi

      - name: Checkout build ref
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ needs.decide.outputs.head_sha }}
          submodules: recursive

      - name: Select Xcode
        run: ./scripts/select-ci-xcode.sh

      - name: Compute Xcode compilation cache key
        id: compilation-cache-key
        run: |
          set -euo pipefail
          echo "toolchain=$(xcodebuild -version | shasum -a 256 | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Restore Xcode compilation cache
        id: compilation-cache-restore
        # A cold measurement run skips the restore; every gate below treats the
        # missing output like a cache miss, so the cold build still saves.
        if: needs.decide.outputs.cold_cache != 'true'
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: build-universal/CompilationCache.noindex
          key: xcode-compilation-release-${{ runner.os }}-${{ runner.arch }}-${{ steps.compilation-cache-key.outputs.toolchain }}-${{ needs.decide.outputs.head_sha }}
          restore-keys: |
            xcode-compilation-release-${{ runner.os }}-${{ runner.arch }}-${{ steps.compilation-cache-key.outputs.toolchain }}-

      - name: Install compilation dependencies
        run: |
          ./scripts/install-rust-ci.sh
          ./scripts/download-prebuilt-ghosttykit.sh

      # A fast branch dogfood build only needs the arm64 client that is bundled
      # in this macOS app. Building it here avoids waiting for the full
      # cross-platform R2 artifact matrix. Main and release keep the immutable
      # manifest path below, so their machine and distribution artifacts stay
      # complete.
      - name: Install Zig for fast cmux-tui client
        if: env.NIGHTLY_FAST_BUILD == 'true'
        run: ./scripts/install-zig-ci.sh

      - name: Build fast arm64 cmux-tui client
        if: env.NIGHTLY_FAST_BUILD == 'true'
        working-directory: cmux-tui
        env:
          CMUX_TUI_DISTRIBUTION_VERSION: 0.0.0-nightly-${{ needs.decide.outputs.short_sha }}
        run: |
          set -euo pipefail
          unset CMUX_GHOSTTY_SRC
          CMUX_TUI_BUILD_COMMIT="$(git -C .. rev-parse HEAD)"
          CMUX_TUI_GHOSTTY_COMMIT="$(git -C ../ghostty rev-parse HEAD)"
          export CMUX_TUI_BUILD_COMMIT CMUX_TUI_GHOSTTY_COMMIT
          cargo build -p cmux-tui --bin cmux-tui --release --locked --target aarch64-apple-darwin
          binary="target/aarch64-apple-darwin/release/cmux-tui"
          test -x "$binary"
          probe="$($binary remote-probe --json)"
          PROBE="$probe" EXPECTED_COMMIT="$CMUX_TUI_BUILD_COMMIT" python3 - <<'PY'
          import json
          import os

          probe = json.loads(os.environ["PROBE"])
          expected = os.environ["EXPECTED_COMMIT"]
          if probe.get("build_identity") != expected:
              raise SystemExit(
                  f"cmux-tui build identity {probe.get('build_identity')!r} != {expected!r}"
              )
          if "wireguard-hub" not in probe.get("capabilities", []):
              raise SystemExit("fast cmux-tui client lacks wireguard-hub capability")
          PY

      - name: Cache Swift packages
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .spm-cache
          key: spm-${{ hashFiles('cmux.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-

      - name: Sanitize Swift package cache
        run: python3 scripts/ci/sanitize-xcode-source-packages-cache.py .spm-cache

      - name: Set up Go for the Cloud tunnel extension
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          cache: false

      - name: Build nightly app (Release)
        run: |
          set -euo pipefail
          if [[ "$NIGHTLY_FAST_BUILD" == "true" ]]; then
            archs="arm64"
            only_active="YES"
          else
            archs="arm64 x86_64"
            only_active="NO"
          fi
          # Let xcodebuild fan out across the host. The two whole-module Swift
          # compiles of the cmux target (about 10 and 16 minutes) miss the
          # compilation cache on every push because every push changes the
          # module, and `-jobs 1` made them run back to back: the warm build
          # step went from 21 minutes to 31-40 (#12704). The diagnostics
          # wrapper does not need a serial build; PR 12704 recorded 95% free
          # memory on the 50 GiB host during the failure it was written for.
          ./scripts/ci/run-xcodebuild-with-diagnostics.sh -- \
            env CMUX_SKIP_ZIG_BUILD=1 xcodebuild -scheme cmux -configuration Release -derivedDataPath build-universal \
            -destination 'generic/platform=macOS' \
            -clonedSourcePackagesDirPath .spm-cache \
            -showBuildTimingSummary \
            ARCHS="$archs" \
            ONLY_ACTIVE_ARCH="$only_active" \
            COMPILATION_CACHE_ENABLE_CACHING=YES \
            COMPILATION_CACHE_LIMIT_SIZE=3221225472 \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO ASSETCATALOG_COMPILER_APPICON_NAME="$CHANNEL_ICON_NAME" build

      - name: Bound Xcode compilation cache size
        id: compilation-cache-bound
        run: |
          set -euo pipefail
          cache_path="build-universal/CompilationCache.noindex"
          max_cache_kib=$((5 * 1024 * 1024))
          if [ -d "$cache_path" ]; then
            # Xcode's CAS chains v1.N generations: the newest is the primary,
            # the one before it is the upstream it faults objects in from, and
            # anything older is dead until the CAS's next garbage collection.
            # The CAS rotates a new primary whenever the current one ends a
            # build above half of COMPILATION_CACHE_LIMIT_SIZE (1.5 GiB here,
            # below one build's 3.3 GB working set), so every warm build leaves
            # a dead generation behind, the directory measures two full builds
            # (6.6 GB on main), and this bound used to drop every warm cache.
            # Prune the dead generations first, exactly as the CAS would.
            python3 scripts/ci/prune-xcode-compilation-cache.py "$cache_path" \
              || echo "::warning::Xcode compilation cache pruning failed; measuring it unpruned"
            cache_kib=$(du -sk "$cache_path" | awk '{print $1}')
          else
            cache_kib=0
          fi
          echo "Xcode compilation cache size: ${cache_kib} KiB (limit: ${max_cache_kib} KiB)"
          save=false
          if [ "$cache_kib" -gt "$max_cache_kib" ]; then
            # Nothing is saved, so the next build restores the same older entry
            # and lands here again: the cache freezes at its last saved entry
            # until the bound (and COMPILATION_CACHE_LIMIT_SIZE) is raised.
            echo "::warning::Xcode compilation cache exceeds 5 GiB; skipping cache save"
            rm -rf "$cache_path"
          elif [ "$cache_kib" -gt 0 ]; then
            save=true
          else
            echo "Xcode compilation cache is empty; skipping cache save"
          fi
          echo "save=${save}" >> "$GITHUB_OUTPUT"

      - name: Save Xcode compilation cache
        if: steps.compilation-cache-restore.outputs.cache-hit != 'true' && steps.compilation-cache-bound.outputs.save == 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: build-universal/CompilationCache.noindex
          key: xcode-compilation-release-${{ runner.os }}-${{ runner.arch }}-${{ steps.compilation-cache-key.outputs.toolchain }}-${{ needs.decide.outputs.head_sha }}

      # Bundle once here, not per sign variant, so every variant carries the same
      # cmux-tui build and the download happens a single time.
      - name: Bundle the cmux-tui client
        run: |
          set -euo pipefail
          app="build-universal/Build/Products/Release/cmux.app"
          if [[ "$NIGHTLY_FAST_BUILD" == "true" ]]; then
            local_client="$GITHUB_WORKSPACE/cmux-tui/target/aarch64-apple-darwin/release/cmux-tui"
            test -x "$local_client"
            CMUX_TUI_CLIENT_LOCAL="$local_client" \
              ./scripts/install-cmux-tui-client.sh "$app" \
              --require-capability wireguard-hub
          else
            # actions/checkout is depth 1 here, so a bare `git log -1 -- cmux-tui` would answer
            # HEAD. The resolver deepens as needed and may bundle the newest *published*
            # client when the latest cmux-tui commit has no artifacts yet (it warns when it does).
            cmux_tui_commit="$(./scripts/ci/resolve-cmux-tui-client-commit.sh --max-fallback 5)"
            test -n "$cmux_tui_commit"
            ./scripts/install-cmux-tui-client.sh \
              "$app" \
              --manifest-url "https://files.cmux.com/cmux-tui/${cmux_tui_commit}/manifest.json" \
              --expected-commit "$cmux_tui_commit" \
              --require-capability wireguard-hub
          fi

      - name: Strip unsigned nightly app before transfer
        run: |
          set -euo pipefail
          products="build-universal/Build/Products/Release"
          ./scripts/strip-release-bundle.sh "$products/cmux.app"

      - name: Verify Cloud tunnel engine before transfer
        run: |
          set -euo pipefail
          app="build-universal/Build/Products/Release/cmux.app"
          sysext="$(find "$app/Contents/Library/SystemExtensions" -mindepth 1 -maxdepth 1 -name '*.systemextension' -print -quit 2>/dev/null || true)"
          if [[ -z "$sysext" ]]; then
            echo "::error::Cloud tunnel system extension is missing"
            exit 1
          fi
          executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$sysext/Contents/Info.plist")"
          binary="$sysext/Contents/MacOS/$executable"
          ./scripts/verify-tunnel-extension-engine.sh "$binary"

      - name: Archive unsigned nightly app
        run: |
          set -euo pipefail
          products="build-universal/Build/Products/Release"
          if [ ! -d "$products/cmux.app" ]; then
            echo "Built app not found at $products/cmux.app" >&2
            exit 1
          fi
          tar -C "$products" -czf "$RUNNER_TEMP/cmux-nightly-unsigned.tar.gz" cmux.app

      - name: Upload unsigned nightly app
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-nightly-unsigned-app
          path: ${{ runner.temp }}/cmux-nightly-unsigned.tar.gz
          if-no-files-found: error
          retention-days: 1

      - name: Upload dSYMs to Sentry
        if: needs.decide.outputs.build_only != 'true'
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: manaflow
          SENTRY_PROJECT: cmuxterm-macos
        run: |
          if [ -z "${SENTRY_AUTH_TOKEN:-}" ]; then
            echo "SENTRY_AUTH_TOKEN not set, skipping dSYM upload"
            exit 0
          fi
          SENTRY_CLI="$(./scripts/ensure-sentry-cli.sh)"
          "$SENTRY_CLI" debug-files upload --include-sources \
            build-universal/Build/Products/Release/

  build-sign-notarize-nightly:
    needs: [decide, build-nightly-ghostty-cli-helper, build-nightly-app]
    if: needs.decide.outputs.should_build == 'true' && (github.event_name != 'schedule' || github.event.schedule == '47 8 * * *') && needs.decide.outputs.build_only != 'true'
    # Sign and notarize on the same macOS 26 lane proven by stable releases.
    runs-on: ${{ needs.decide.outputs.fast_build == 'true' && 'blacksmith-6vcpu-macos-26' || vars.MACOS_RUNNER_26 || 'blacksmith-6vcpu-macos-26' }}
    # Start the standalone helper submission early so
    # Apple's first wait overlaps useful work; finish it before the final DMG.
    # Delta generation against two previous builds adds about 15 minutes.
    timeout-minutes: 80
    # One universal Xcode build feeds every variant: the thin variants are cut
    # from it with lipo, so each user downloads only their architecture.
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.decide.outputs.variants) }}
    env:
      CMUX_CI_XCODE_APP: ${{ vars.CMUX_CI_XCODE_APP_MACOS_26 }}
      CMUX_CI_REQUIRED_MACOS_SDK_MAJOR: "26"
      NIGHTLY_VARIANT: ${{ matrix.variant }}
      NIGHTLY_FAST_BUILD: ${{ needs.decide.outputs.fast_build }}
      CHANNEL: ${{ needs.decide.outputs.channel }}
      CHANNEL_BUNDLE_ID: ${{ needs.decide.outputs.bundle_id }}
      CHANNEL_APP_NAME: ${{ needs.decide.outputs.app_name }}
      CHANNEL_URL_SCHEME: ${{ needs.decide.outputs.url_scheme }}
      CHANNEL_DMG_PREFIX: ${{ needs.decide.outputs.dmg_prefix }}
      CHANNEL_RELEASE_TAG: ${{ needs.decide.outputs.release_tag }}
      CHANNEL_FEED_BASE: ${{ needs.decide.outputs.feed_base }}
      CHANNEL_ENTITLEMENTS: ${{ needs.decide.outputs.entitlements }}
      CHANNEL_METADATA: ${{ needs.decide.outputs.metadata_channel }}
      CHANNEL_BAKED_FEED_URL: ${{ needs.decide.outputs.baked_feed_url }}
      # Signed app path for every step after "Prepare channel identity".
      CHANNEL_APP_PATH: build-universal/Build/Products/Release/${{ needs.decide.outputs.app_name }}.app
    steps:
      - name: Clear stale git locks (self-hosted reused workspace)
        shell: bash
        run: |
          # Self-hosted macOS runners reuse the workspace. A job cancelled or
          # killed mid-checkout can leave a stale .git/modules/*/index.lock that
          # fails every later submodule checkout (e.g. ghostty). Clear them first.
          ws="${GITHUB_WORKSPACE:-$PWD}"
          rm -f "$ws/.git/index.lock" 2>/dev/null || true
          if [ -d "$ws/.git/modules" ]; then
            find "$ws/.git/modules" -type f -name "*.lock" -delete 2>/dev/null || true
          fi

      - name: Checkout build ref
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ needs.decide.outputs.head_sha }}
          submodules: recursive

      - name: Select Xcode
        run: ./scripts/select-ci-xcode.sh

      - name: Download unsigned nightly app
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cmux-nightly-unsigned-app
          path: nightly-inputs/app

      - name: Download universal Ghostty CLI helper
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cmux-nightly-ghostty-cli-helper
          path: nightly-inputs/ghostty

      - name: Restore unsigned nightly products
        run: |
          set -euo pipefail
          products="build-universal/Build/Products/Release"
          mkdir -p "$products"
          tar -C "$products" -xzf nightly-inputs/app/cmux-nightly-unsigned.tar.gz

      # Provide node/npm explicitly. The build/sign/notarize job can land on a
      # self-hosted macOS runner (the iOS-CI minis match the same label) that has
      # no npm on PATH, so `npm install --global create-dmg` failed with
      # "npm: command not found" and turned nightly red. setup-node makes the job
      # self-sufficient on any runner instead of assuming a preinstalled npm.
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install build deps
        run: |
          CMUX_NODE_BIN="$(command -v node)"
          export npm_config_prefix="$RUNNER_TEMP/npm-global"
          mkdir -p "$npm_config_prefix"
          npm install --global "create-dmg@${CREATE_DMG_VERSION}"
          wrapper_dir="$RUNNER_TEMP/create-dmg-wrapper"
          mkdir -p "$wrapper_dir"
          cat > "$wrapper_dir/create-dmg" <<EOF
          #!/usr/bin/env bash
          exec "$CMUX_NODE_BIN" "$npm_config_prefix/lib/node_modules/create-dmg/cli.js" "\$@"
          EOF
          chmod +x "$wrapper_dir/create-dmg"
          echo "$wrapper_dir" >> "$GITHUB_PATH"

      - name: Derive Sparkle public key from private key
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            echo "Missing SPARKLE_PRIVATE_KEY secret" >&2
            exit 1
          fi
          DERIVED_PUBLIC_KEY=$(swift scripts/derive_sparkle_public_key.swift "$SPARKLE_PRIVATE_KEY")
          echo "Derived Sparkle public key: $DERIVED_PUBLIC_KEY"
          echo "SPARKLE_PUBLIC_KEY=$DERIVED_PUBLIC_KEY" >> "$GITHUB_ENV"

      - name: Inject universal Ghostty CLI helper
        run: |
          set -euo pipefail
          APP_DIR="build-universal/Build/Products/Release/cmux.app"
          if [ ! -d "$APP_DIR" ]; then
            echo "Built app not found at $APP_DIR" >&2
            exit 1
          fi
          DEST="$APP_DIR/Contents/Resources/bin/ghostty"
          mkdir -p "$(dirname "$DEST")"
          install -m 755 nightly-inputs/ghostty/ghostty "$DEST"
          echo "Injected Ghostty CLI helper architectures: $(lipo -archs "$DEST")"

      - name: Run bundled Ghostty theme picker helper regression
        run: |
          set -euo pipefail
          CMUX_APP_PATH="build-universal/Build/Products/Release/cmux.app" \
            ./tests/test_bundled_ghostty_theme_picker_helper.sh

      - name: Run CLI version memory guard regression
        run: |
          set -euo pipefail
          CLI_BINARY="build-universal/Build/Products/Release/cmux.app/Contents/Resources/bin/cmux"
          [ -x "$CLI_BINARY" ] || { echo "cmux CLI binary not found at $CLI_BINARY" >&2; exit 1; }
          CMUX_CLI_BIN="$CLI_BINARY" python3 tests/test_cli_version_memory_guard.py

      - name: Thin bundle to the variant architecture
        # The fast build is already compiled arm64, but the downloaded cmux-tui
        # client can still be universal. Thin every non-universal artifact before
        # signing so the architecture gate remains meaningful.
        if: matrix.variant != 'universal'
        run: |
          set -euo pipefail
          ./scripts/thin-app-bundle.sh build-universal/Build/Products/Release/cmux.app "$NIGHTLY_VARIANT"

      - name: Verify nightly binary architectures
        run: |
          set -euo pipefail
          APP="build-universal/Build/Products/Release/cmux.app"
          for binary in \
            "$APP/Contents/MacOS/cmux" \
            "$APP/Contents/Resources/bin/cmux" \
            "$APP/Contents/Resources/bin/ghostty" \
            "$APP/Contents/Resources/bin/cmux-tui" \
            "$APP/Contents/Resources/bin/cmux-cua" \
            "$APP/Contents/Resources/bin/cmux-diff-sidecar" \
            "$APP/Contents/Library/cmux Computer Use.app/Contents/MacOS/cmux-cua"
          do
            archs="$(lipo -archs "$binary")"
            echo "$binary: $archs"
            if [ "$NIGHTLY_VARIANT" = "universal" ]; then
              [[ "$archs" == *arm64* && "$archs" == *x86_64* ]]
            else
              [ "$archs" = "$NIGHTLY_VARIANT" ]
            fi
          done
          if [ "$NIGHTLY_VARIANT" != "universal" ]; then
            # No fat Mach-O may survive thinning anywhere in the bundle.
            fat="$(find "$APP" -type f -exec sh -c 'file -b "$1" | grep -q "Mach-O universal" && echo "$1"' _ {} \;)"
            if [ -n "$fat" ]; then
              echo "Fat Mach-O files remain after thinning:" >&2
              echo "$fat" >&2
              exit 1
            fi
          fi
          if [ "$NIGHTLY_VARIANT" = "universal" ]; then
            ./scripts/verify-diff-sidecar-artifact.sh "$APP/Contents/Resources/bin/cmux-diff-sidecar" --archs "arm64 x86_64"
          else
            ./scripts/verify-diff-sidecar-artifact.sh "$APP/Contents/Resources/bin/cmux-diff-sidecar" --archs "$NIGHTLY_VARIANT"
          fi

      - name: Inject nightly identities and metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHORT_SHA="${{ needs.decide.outputs.short_sha }}"
          APP_DIR="build-universal/Build/Products/Release"

          BASE_MARKETING=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "${APP_DIR}/cmux.app/Contents/Info.plist")
          NIGHTLY_DATE=$(date -u +%Y%m%d)

          # Build number: unique/monotonic per workflow run attempt so same-day
          # nightlies and reruns still compare as newer in Sparkle.
          if [ -n "${GITHUB_RUN_ID:-}" ]; then
            RUN_ATTEMPT="$(printf '%02d' "${GITHUB_RUN_ATTEMPT:-1}")"
            NIGHTLY_BUILD="${GITHUB_RUN_ID}${RUN_ATTEMPT}"
          else
            NIGHTLY_BUILD="${NIGHTLY_DATE}000000"
          fi
          NIGHTLY_MARKETING_VERSION="${BASE_MARKETING}-${CHANNEL}.${NIGHTLY_BUILD}"
          if [ "$CHANNEL" = "rc" ]; then
            # A release candidate carries the project's own version and build
            # number so the promoted stable release is the same file. Every
            # respin must bump CURRENT_PROJECT_VERSION (bump-version.sh does),
            # which keeps the rc feed monotonic; the publish job refuses a
            # build number that already exists on the rc release.
            NIGHTLY_BUILD="$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "${APP_DIR}/cmux.app/Contents/Info.plist")"
            NIGHTLY_MARKETING_VERSION="$BASE_MARKETING"
            if gh release view "$CHANNEL_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null \
              | grep -qx "${CHANNEL_DMG_PREFIX}-${NIGHTLY_VARIANT}-${NIGHTLY_BUILD}.dmg"; then
              echo "::error::${CHANNEL_DMG_PREFIX}-${NIGHTLY_VARIANT}-${NIGHTLY_BUILD}.dmg already exists on the ${CHANNEL_RELEASE_TAG} release; bump CURRENT_PROJECT_VERSION (scripts/bump-version.sh) before respinning the release candidate" >&2
              exit 1
            fi
          fi

          NIGHTLY_DMG_IMMUTABLE="${CHANNEL_DMG_PREFIX}-${NIGHTLY_VARIANT}-${NIGHTLY_BUILD}.dmg"
          NIGHTLY_DMG_RELEASE="${CHANNEL_DMG_PREFIX}-${NIGHTLY_VARIANT}.dmg"
          # Thin variants get their own feed. The universal variant keeps the legacy
          # feed name; the app's feed resolver rewrites it to the per-architecture
          # feed at runtime, which is how older installs migrate.
          if [ "$NIGHTLY_VARIANT" = "universal" ]; then
            NIGHTLY_APPCAST="appcast.xml"
          else
            NIGHTLY_APPCAST="appcast-${NIGHTLY_VARIANT}.xml"
          fi
          {
            echo "NIGHTLY_BUILD=${NIGHTLY_BUILD}"
            echo "NIGHTLY_MARKETING_VERSION=${NIGHTLY_MARKETING_VERSION}"
            echo "NIGHTLY_DMG_IMMUTABLE=${NIGHTLY_DMG_IMMUTABLE}"
            echo "NIGHTLY_DMG_RELEASE=${NIGHTLY_DMG_RELEASE}"
            echo "NIGHTLY_APPCAST=${NIGHTLY_APPCAST}"
          } >> "$GITHUB_ENV"

          prepare_variant() {
            local app_dir="$1"
            local bundle_id="$2"
            local feed_url="$3"
            local app_plist="$app_dir/cmux.app/Contents/Info.plist"

            /usr/libexec/PlistBuddy -c "Set :CFBundleName ${CHANNEL_APP_NAME}" "$app_plist"
            /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName ${CHANNEL_APP_NAME}" "$app_plist"
            /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier ${bundle_id}" "$app_plist"
            local url_type_name
            url_type_name="$(/usr/libexec/PlistBuddy -c "Print :CFBundleURLTypes:1:CFBundleURLName" "$app_plist")"
            if [[ "$url_type_name" != *.auth ]]; then
              echo "Expected CFBundleURLTypes[1] to be the auth URL type, found: $url_type_name" >&2
              exit 1
            fi
            /usr/libexec/PlistBuddy -c "Set :CFBundleURLTypes:1:CFBundleURLSchemes:0 ${CHANNEL_URL_SCHEME}" "$app_plist"
            /usr/libexec/PlistBuddy -c "Delete :SUPublicEDKey" "$app_plist" >/dev/null 2>&1 || true
            /usr/libexec/PlistBuddy -c "Delete :SUFeedURL" "$app_plist" >/dev/null 2>&1 || true
            /usr/libexec/PlistBuddy -c "Add :SUPublicEDKey string ${SPARKLE_PUBLIC_KEY}" "$app_plist"
            /usr/libexec/PlistBuddy -c "Add :SUFeedURL string ${feed_url}" "$app_plist"
            /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${NIGHTLY_MARKETING_VERSION}" "$app_plist"
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${NIGHTLY_BUILD}" "$app_plist"
            /usr/libexec/PlistBuddy -c "Delete :CMUXCommit" "$app_plist" >/dev/null 2>&1 || true
            /usr/libexec/PlistBuddy -c "Add :CMUXCommit string ${SHORT_SHA}" "$app_plist"
            # The bundled Cloud tunnel extension follows the app's identity:
            # <bundle id>.tunnel, team-prefixed mach service, same version.
            local sysext
            sysext="$(find "$app_dir/cmux.app/Contents/Library/SystemExtensions" -mindepth 1 -maxdepth 1 -name '*.systemextension' -print -quit 2>/dev/null || true)"
            if [[ -n "$sysext" ]]; then
              local sysext_plist="$sysext/Contents/Info.plist"
              /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier ${bundle_id}.tunnel" "$sysext_plist"
              /usr/libexec/PlistBuddy -c "Set :NetworkExtension:NEMachServiceName 7WLXT3NR37.${bundle_id}.tunnel" "$sysext_plist"
              /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${NIGHTLY_MARKETING_VERSION}" "$sysext_plist"
              /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${NIGHTLY_BUILD}" "$sysext_plist"
              ./scripts/normalize-system-extension-bundle.sh "$app_dir/cmux.app" "${bundle_id}.tunnel"
            fi
            if [[ "$CHANNEL_APP_NAME" != "cmux" ]]; then
              mv "$app_dir/cmux.app" "$app_dir/${CHANNEL_APP_NAME}.app"
            fi
          }

          prepare_variant \
            "$APP_DIR" \
            "$CHANNEL_BUNDLE_ID" \
            "${CHANNEL_BAKED_FEED_URL:-${CHANNEL_FEED_BASE}/${NIGHTLY_APPCAST}}"

          echo "Channel: ${CHANNEL}"
          echo "App name: ${CHANNEL_APP_NAME}"
          echo "Variant: ${NIGHTLY_VARIANT}"
          echo "Feed: ${CHANNEL_FEED_BASE}/${NIGHTLY_APPCAST}"
          echo "Bundle ID: ${CHANNEL_BUNDLE_ID}"
          echo "Marketing version: ${NIGHTLY_MARKETING_VERSION}"
          echo "Build number: ${NIGHTLY_BUILD}"
          echo "Immutable DMG: ${NIGHTLY_DMG_IMMUTABLE}"
          echo "Commit SHA: ${SHORT_SHA}"

      - name: Import signing cert
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$APPLE_CERTIFICATE_BASE64" ]; then
            echo "Missing APPLE_CERTIFICATE_BASE64 secret" >&2
            exit 1
          fi
          if [ -z "$APPLE_CERTIFICATE_PASSWORD" ]; then
            echo "Missing APPLE_CERTIFICATE_PASSWORD secret" >&2
            exit 1
          fi
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > /tmp/cert.p12
          security delete-keychain build.keychain >/dev/null 2>&1 || true
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import /tmp/cert.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          ./scripts/import-apple-developer-id-intermediates.sh build.keychain
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security list-keychains -d user -s build.keychain

      - name: Start Computer Use helper notarization
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          state="$RUNNER_TEMP/cmux-computer-use-notarization.state"
          rm -f "$state"
          ./scripts/ci/notarize-computer-use-helper.sh \
            --start "$state" \
            "$CHANNEL_APP_PATH" \
            "$CHANNEL_ENTITLEMENTS" \
            "$APPLE_SIGNING_IDENTITY"

      # Each channel has its own Developer ID profiles:
      # APPLE_NIGHTLY_PROVISIONING_PROFILE_BASE64 / APPLE_RC_PROVISIONING_PROFILE_BASE64
      # for the app and the matching *_TUNNEL_* secret for the system extension.
      - name: Embed channel provisioning profile
        env:
          APP_PROVISIONING_PROFILE_BASE64: ${{ secrets[format('APPLE_{0}_PROVISIONING_PROFILE_BASE64', needs.decide.outputs.profile_secret_prefix)] }}
          PROFILE_SECRET_NAME: APPLE_${{ needs.decide.outputs.profile_secret_prefix }}_PROVISIONING_PROFILE_BASE64
        run: |
          if [ -z "$APP_PROVISIONING_PROFILE_BASE64" ]; then
            echo "Missing $PROFILE_SECRET_NAME secret" >&2
            exit 1
          fi

          APP_PATH="$CHANNEL_APP_PATH"
          PROFILE_PATH="$APP_PATH/Contents/embedded.provisionprofile"
          TMP_PROFILE="$(mktemp /tmp/cmux-channel-profile.XXXXXX)"
          TMP_PLIST="$(mktemp /tmp/cmux-channel-profile.XXXXXX.plist)"
          trap 'rm -f "$TMP_PROFILE" "$TMP_PLIST"' EXIT

          echo "$APP_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$TMP_PROFILE"
          security cms -D -i "$TMP_PROFILE" > "$TMP_PLIST"

          APP_ID="$(/usr/libexec/PlistBuddy -c "Print :Entitlements:com.apple.application-identifier" "$TMP_PLIST")"
          if [ "$APP_ID" != "7WLXT3NR37.${CHANNEL_BUNDLE_ID}" ]; then
            echo "$CHANNEL provisioning profile targets unexpected app ID: $APP_ID" >&2
            exit 1
          fi

          # The WebAuthn browser entitlement is an Apple-approved capability
          # request. The check follows the channel's entitlements file so a
          # profile can never silently lag behind what the app requests.
          if /usr/libexec/PlistBuddy -c "Print :com.apple.developer.web-browser.public-key-credential" "$CHANNEL_ENTITLEMENTS" >/dev/null 2>&1; then
            WEBAUTHN_ENTITLEMENT="$(/usr/libexec/PlistBuddy -c "Print :Entitlements:com.apple.developer.web-browser.public-key-credential" "$TMP_PLIST" 2>/dev/null || true)"
            if [ "$WEBAUTHN_ENTITLEMENT" != "true" ]; then
              echo "$CHANNEL provisioning profile is missing WebAuthn browser entitlement" >&2
              exit 1
            fi
          else
            echo "$CHANNEL entitlements do not request the WebAuthn browser entitlement; skipping the profile check"
          fi

          PROVISIONS_ALL_DEVICES="$(/usr/libexec/PlistBuddy -c "Print :ProvisionsAllDevices" "$TMP_PLIST")"
          if [ "$PROVISIONS_ALL_DEVICES" != "true" ]; then
            echo "$CHANNEL provisioning profile is not a Developer ID all-devices profile" >&2
            exit 1
          fi

          cp "$TMP_PROFILE" "$PROFILE_PATH"

      - name: Embed Cloud tunnel extension provisioning profile
        env:
          TUNNEL_PROVISIONING_PROFILE_BASE64: ${{ secrets[format('APPLE_{0}_TUNNEL_PROVISIONING_PROFILE_BASE64', needs.decide.outputs.profile_secret_prefix)] }}
        run: |
          set -euo pipefail
          ./scripts/ci/embed-tunnel-extension-profile.sh \
            "$CHANNEL_APP_PATH" \
            "7WLXT3NR37.${CHANNEL_BUNDLE_ID}.tunnel" \
            "${TUNNEL_PROVISIONING_PROFILE_BASE64:-}"

      - name: Codesign apps
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          if [ -z "$APPLE_SIGNING_IDENTITY" ]; then
            echo "Missing APPLE_SIGNING_IDENTITY secret" >&2
            exit 1
          fi
          CMUX_SIGN_MODE=all-except-computer-use \
            ./scripts/sign-cmux-bundle.sh \
            "$CHANNEL_APP_PATH" \
            "$CHANNEL_ENTITLEMENTS" \
            "$APPLE_SIGNING_IDENTITY"

      - name: Smoke launch signed app before notarization
        run: |
          set -euo pipefail
          # Catch macOS policy failures before the Apple ticket wait and DMG
          # work. Direct execution is isolated from the runner's Dock state.
          CMUX_SMOKE_DIRECT_EXEC=1 CMUX_SMOKE_DEBUG_LOGS=1 \
            ./scripts/smoke-launch-macos-app.sh \
            "$CHANNEL_APP_PATH"

      - name: Notarize app ticket through final DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          CMUX_COMPUTER_USE_NOTARY_SUBMISSION_FILE: ${{ runner.temp }}/cmux-computer-use-notarization.state
          CMUX_CHANNEL: ${{ needs.decide.outputs.metadata_channel }}
          CMUX_APP_ENTITLEMENTS: ${{ needs.decide.outputs.entitlements }}
        run: |
          ./scripts/ci/notarize-nightly-dmg.sh \
            "$CHANNEL_APP_PATH" \
            "$NIGHTLY_DMG_RELEASE" \
            "$NIGHTLY_DMG_IMMUTABLE"

      - name: Fetch previous nightly builds for delta updates
        if: needs.decide.outputs.fast_build != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/ci/fetch-previous-nightly-dmgs.py \
            --repo manaflow-ai/cmux \
            --release-tag "$CHANNEL_RELEASE_TAG" \
            --name-prefix "${CHANNEL_DMG_PREFIX}-" \
            --variant "$NIGHTLY_VARIANT" \
            --exclude-build "$NIGHTLY_BUILD" \
            --count 2 \
            --out previous-nightlies

      - name: Generate Sparkle appcasts (nightly)
        if: needs.decide.outputs.fast_build != 'true'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          # Deltas from the two previous builds of this track, named
          # cmux-nightly-macos-<variant>-<new>-<old>.delta so tracks never collide.
          SPARKLE_PREVIOUS_ARCHIVES_DIR: previous-nightlies
          SPARKLE_MAXIMUM_DELTAS: "2"
        run: |
          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            echo "Missing SPARKLE_PRIVATE_KEY secret" >&2
            exit 1
          fi
          SPARKLE_DELTA_NAME_PREFIX="${CHANNEL_DMG_PREFIX}-${NIGHTLY_VARIANT}-" \
            ./scripts/sparkle_generate_appcast.sh "$NIGHTLY_DMG_IMMUTABLE" "$CHANNEL_RELEASE_TAG" "$NIGHTLY_APPCAST"
          ls -l "$NIGHTLY_DMG_IMMUTABLE" "$NIGHTLY_DMG_RELEASE" "$NIGHTLY_APPCAST" ./*.delta 2>/dev/null || true
          grep -c 'sparkle:deltas' "$NIGHTLY_APPCAST" || echo "no deltas in $NIGHTLY_APPCAST (no previous build of this track)"

      - name: Upload nightly variant artifacts
        if: needs.decide.outputs.fast_build != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-nightly-variant-${{ matrix.variant }}
          path: |
            ${{ needs.decide.outputs.dmg_prefix }}-*.dmg
            ${{ needs.decide.outputs.dmg_prefix }}-*.delta
            appcast*.xml
          if-no-files-found: error
          retention-days: 3

      - name: Upload fast arm64 dogfood artifact
        if: needs.decide.outputs.fast_build == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-nightly-fast-${{ needs.decide.outputs.short_sha }}
          path: |
            ${{ needs.decide.outputs.dmg_prefix }}-arm64.dmg
            ${{ needs.decide.outputs.dmg_prefix }}-arm64-*.dmg
          if-no-files-found: error
          retention-days: 3

      - name: Cleanup keychain
        if: always()
        run: |
          security delete-keychain build.keychain >/dev/null 2>&1 || true
          rm -f /tmp/cert.p12

  publish-nightly:
    needs: [decide, build-sign-notarize-nightly]
    if: needs.decide.outputs.should_build == 'true' && needs.decide.outputs.fast_build != 'true' && needs.decide.outputs.build_only != 'true' && (github.event_name != 'schedule' || github.event.schedule == '47 8 * * *')
    runs-on: ${{ vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 30
    env:
      NIGHTLY_LEGACY_VARIANT: ${{ needs.decide.outputs.legacy_variant }}
      CHANNEL: ${{ needs.decide.outputs.channel }}
      CHANNEL_DMG_PREFIX: ${{ needs.decide.outputs.dmg_prefix }}
      CHANNEL_RELEASE_TAG: ${{ needs.decide.outputs.release_tag }}
      CHANNEL_FEED_BASE: ${{ needs.decide.outputs.feed_base }}
    steps:
      - name: Checkout publish ref
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ needs.decide.outputs.head_sha }}

      - name: Download nightly variant artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: cmux-nightly-variant-*
          path: nightly-out
          merge-multiple: true

      - name: Assemble legacy nightly names
        run: |
          set -euo pipefail
          cd nightly-out
          ls -l
          for variant in arm64 x86_64; do
            [ -f "${CHANNEL_DMG_PREFIX}-${variant}.dmg" ] || { echo "missing ${CHANNEL_DMG_PREFIX}-${variant}.dmg" >&2; exit 1; }
            [ -f "appcast-${variant}.xml" ] || { echo "missing appcast-${variant}.xml" >&2; exit 1; }
          done
          # `cmux-nightly-macos.dmg` and `appcast.xml` are the download and feed
          # every pre-existing link and install uses. They stay universal: the
          # universal variant generates appcast.xml itself, and installs move to
          # their architecture's feed on the next update check.
          [ "$NIGHTLY_LEGACY_VARIANT" = "universal" ] || { echo "unexpected legacy variant: $NIGHTLY_LEGACY_VARIANT" >&2; exit 1; }
          [ -f "${CHANNEL_DMG_PREFIX}-universal.dmg" ] || { echo "universal variant DMG missing" >&2; exit 1; }
          [ -f appcast.xml ] || { echo "universal variant appcast.xml missing" >&2; exit 1; }
          cp "${CHANNEL_DMG_PREFIX}-universal.dmg" "${CHANNEL_DMG_PREFIX}.dmg"
          # Compatibility feed for nightlies older than the unified appcast.
          cp appcast.xml appcast-universal.xml
          ls -l

      - name: Upload branch nightly artifacts
        if: needs.decide.outputs.should_publish != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-nightly-${{ needs.decide.outputs.short_sha }}
          path: |
            nightly-out/${{ needs.decide.outputs.dmg_prefix }}*.dmg
            nightly-out/${{ needs.decide.outputs.dmg_prefix }}*.delta
            nightly-out/appcast*.xml
          if-no-files-found: error

      - name: Prune old nightly release assets
        if: needs.decide.outputs.should_publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 ./scripts/prune_nightly_release_assets.py \
            --repo manaflow-ai/cmux \
            --release-tag "$CHANNEL_RELEASE_TAG" \
            --name-prefix "${CHANNEL_DMG_PREFIX}-" \
            --keep-builds 100 \
            --max-assets 950 \
            --execute

      - name: Publish nightly release assets
        if: needs.decide.outputs.should_publish == 'true'
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          tag_name: ${{ needs.decide.outputs.release_tag }}
          name: ${{ needs.decide.outputs.release_name }}
          prerelease: true
          make_latest: false
          body: |
            Automated ${{ needs.decide.outputs.channel }} build for `${{ needs.decide.outputs.short_sha }}` from `${{ github.ref_name }}`.
            **${{ needs.decide.outputs.app_name }}** ships one app per architecture (bundle ID `${{ needs.decide.outputs.bundle_id }}`):
            - [Apple silicon: ${{ needs.decide.outputs.dmg_prefix }}-arm64.dmg](https://github.com/manaflow-ai/cmux/releases/download/${{ needs.decide.outputs.release_tag }}/${{ needs.decide.outputs.dmg_prefix }}-arm64.dmg), feed `appcast-arm64.xml`
            - [Intel: ${{ needs.decide.outputs.dmg_prefix }}-x86_64.dmg](https://github.com/manaflow-ai/cmux/releases/download/${{ needs.decide.outputs.release_tag }}/${{ needs.decide.outputs.dmg_prefix }}-x86_64.dmg), feed `appcast-x86_64.xml`
            - [Universal (any Mac): ${{ needs.decide.outputs.dmg_prefix }}.dmg](https://github.com/manaflow-ai/cmux/releases/download/${{ needs.decide.outputs.release_tag }}/${{ needs.decide.outputs.dmg_prefix }}.dmg), feed `appcast.xml`; the app switches to its architecture's feed on the first update check
          files: |
            nightly-out/${{ needs.decide.outputs.dmg_prefix }}-*-${{ github.run_id }}*.dmg
            nightly-out/${{ needs.decide.outputs.dmg_prefix }}-*-${{ github.run_id }}*.delta
            nightly-out/${{ needs.decide.outputs.dmg_prefix }}-arm64.dmg
            nightly-out/${{ needs.decide.outputs.dmg_prefix }}-x86_64.dmg
            nightly-out/${{ needs.decide.outputs.dmg_prefix }}-universal.dmg
            nightly-out/${{ needs.decide.outputs.dmg_prefix }}.dmg
            nightly-out/appcast.xml
            nightly-out/appcast-arm64.xml
            nightly-out/appcast-x86_64.xml
            nightly-out/appcast-universal.xml
          overwrite_files: true

      - name: Upload nightly appcasts to R2
        if: needs.decide.outputs.should_publish == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: "https://${{ secrets.CF_R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
        run: |
          set -euo pipefail
          # Upload after the GitHub Release publish so no appcast references a
          # DMG that doesn't exist yet. R2 PutObject is atomic, so each appcast is
          # either the old version or the new one, never missing. Thin feeds go
          # first: the app rewrites the legacy feed URL to a thin feed, so those
          # must already be current when the legacy feed changes.
          for appcast in appcast-arm64.xml appcast-x86_64.xml appcast-universal.xml appcast.xml; do
            python3 scripts/ci/upload-r2-object.py \
              --file "nightly-out/$appcast" \
              --endpoint-url "$R2_ENDPOINT" \
              --bucket cmux-binaries \
              --key "${CHANNEL_RELEASE_TAG}/$appcast" \
              --content-type "application/xml" \
              --cache-control "no-cache, no-store, must-revalidate"
            echo "R2 appcast upload complete: ${CHANNEL_FEED_BASE}/$appcast"
          done

      # The channel's release tag is the completion marker used by the decide
      # job. Move it to the fixed candidate selected at dispatch only after
      # every publication step succeeds. A newer commit becomes the next run's
      # candidate.
      - name: Move channel release tag to built commit
        if: needs.decide.outputs.should_publish == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "$CHANNEL_RELEASE_TAG" "${{ needs.decide.outputs.head_sha }}"
          # Push via a tokenized URL so we neither rely on the persisted
          # checkout credentials (which intermittently fail with "Device not
          # configured" on self-hosted runners) nor overlay a second
          # Authorization header on top of them (which makes GitHub reject the
          # push with `remote: Duplicate header: "Authorization"`).
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "refs/tags/${CHANNEL_RELEASE_TAG}" --force

  # A nightly that fails on main stalls every NIGHTLY install silently. Keep
  # one open issue per breakage so the failure is visible without watching Actions.
  report-nightly-failure:
    needs: [decide, build-nightly-ghostty-cli-helper, build-nightly-app, build-sign-notarize-nightly, publish-nightly]
    if: always() && needs.decide.outputs.should_publish == 'true' && contains(needs.*.result, 'failure')
    runs-on: ${{ vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or update the nightly failure issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          HEAD_SHA: ${{ needs.decide.outputs.head_sha }}
          RESULTS: ${{ toJSON(needs) }}
          CHANNEL: ${{ needs.decide.outputs.channel }}
          CHANNEL_APP_NAME: ${{ needs.decide.outputs.app_name }}
          REF_NAME: ${{ github.ref_name }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const channel = process.env.CHANNEL;
            const appName = process.env.CHANNEL_APP_NAME;
            const refName = process.env.REF_NAME;
            const label = `${channel}-failure`;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const results = JSON.parse(process.env.RESULTS);
            const failed = Object.entries(results).filter(([, v]) => v.result === 'failure').map(([k]) => k);
            const body = `${appName} run ${runUrl} failed on ${process.env.HEAD_SHA} (${refName}) in: ${failed.join(', ')}.\n\n${appName} installs stop receiving updates until a run on ${refName} succeeds. This issue closes itself on the next successful publish.`;
            try {
              await github.rest.issues.getLabel({ owner, repo, name: label });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.issues.createLabel({ owner, repo, name: label, color: 'b60205', description: `${appName} publish failing` });
            }
            const open = await github.rest.issues.listForRepo({ owner, repo, labels: label, state: 'open', per_page: 1 });
            if (open.data.length > 0) {
              await github.rest.issues.createComment({ owner, repo, issue_number: open.data[0].number, body });
            } else {
              await github.rest.issues.create({ owner, repo, title: `${appName} build is failing on ${refName}`, labels: [label], body });
            }

  close-nightly-failure-issue:
    needs: [decide, publish-nightly]
    if: needs.decide.outputs.should_publish == 'true' && needs.publish-nightly.result == 'success'
    runs-on: ${{ vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    permissions:
      contents: read
      issues: write
    steps:
      - name: Close the nightly failure issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          HEAD_SHA: ${{ needs.decide.outputs.head_sha }}
          CHANNEL: ${{ needs.decide.outputs.channel }}
          CHANNEL_APP_NAME: ${{ needs.decide.outputs.app_name }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const open = await github.rest.issues.listForRepo({ owner, repo, labels: `${process.env.CHANNEL}-failure`, state: 'open', per_page: 10 });
            for (const issue of open.data) {
              await github.rest.issues.createComment({ owner, repo, issue_number: issue.number, body: `${process.env.CHANNEL_APP_NAME} publish succeeded again on ${process.env.HEAD_SHA}: ${runUrl}` });
              await github.rest.issues.update({ owner, repo, issue_number: issue.number, state: 'closed' });
            }
