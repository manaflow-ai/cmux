          set -euo pipefail
          ./scripts/cmux-next/drop-cef-without-arch.sh build-universal/Build/Products/Release/cmux.app "$NIGHTLY_VARIANT"
          ./scripts/thin-app-bundle.sh build-universal/Build/Products/Release/cmux.app "$NIGHTLY_VARIANT"


      # GNU libintl is LGPL-2.1-or-later. GhosttyKit and the ghostty CLI helper
      # are built with -Di18n=false, so no shipped Mach-O may define a libintl
      # symbol unless the channel release carries gettext-0.24.tar.gz and
      # COPYING.LIB (the prune step keeps those names, they carry no build number).
      - *verify-shipped-libintl-has-its


      - name: Verify nightly binary architectures
        if: env.PREPARE_FALLBACK != 'true' || steps.reuse.outputs.exists != 'true'
        run: |
          set -euo pipefail
          APP="build-universal/Build/Products/Release/cmux.app"
          for binary in \
            "$APP/Contents/MacOS/cmux" \
            "$APP/Contents/Resources/bin/cmux" \
            "$APP/Contents/Resources/bin/ghostty" \
            "$APP/Contents/Resources/bin/cmux-diff-sidecar" \
            "$APP/Contents/Library/cmux Computer Use.app/Contents/MacOS/cmux-cua"
          do
            archs="$(lipo -archs "$binary")"
            echo "$binary: $archs"
            if [ "$NIGHTLY_VARIANT" = "universal" ]; then
              [[ "$archs" == *arm64* && "$archs" == *x86_64* ]]
            else
              [ "$archs" = "$NIGHTLY_VARIANT" ]
            fi
          done
          # The cmux-next nightly carries the OptChat Chief with the app's slices.
          if [[ "$CHANNEL_RELEASE_TAG" == "nightly-next" ]]; then
            for helper in optchat-chief cmux-mobile-host; do
              binary="$APP/Contents/Resources/bin/$helper"
              [ -x "$binary" ] || { echo "nightly-next is missing bin/$helper" >&2; exit 1; }
              archs="$(lipo -archs "$binary")"
              echo "$binary: $archs"
              if [ "$NIGHTLY_VARIANT" = "universal" ]; then
                [[ "$archs" == *arm64* && "$archs" == *x86_64* ]]
              else
                [ "$archs" = "$NIGHTLY_VARIANT" ]
              fi
            done
          fi
          # bin/cmux is the cmux-tui binary; cmux-tui and acpmux are symlinks to it.
          for alias in cmux-tui acpmux; do
            [ "$(readlink "$APP/Contents/Resources/bin/$alias")" = cmux ] || {
              echo "bin/$alias is not a symlink to cmux" >&2; exit 1; }
          done
          if [ "$NIGHTLY_VARIANT" != "universal" ]; then
            # No fat Mach-O may survive thinning anywhere in the bundle.
            # Only files with a Mach-O or fat magic reach `file` (one process
            # each); the per-file scan of the whole bundle took 90 s.
            fat="$(find "$APP" -type f -print0 | python3 scripts/list-macho-candidates.py \
              | xargs -0 sh -c 'for f do if file -b "$f" | grep -q "Mach-O universal"; then echo "$f"; fi; done' sh)"
            if [ -n "$fat" ]; then
              echo "Fat Mach-O files remain after thinning:" >&2
              echo "$fat" >&2
              exit 1
            fi
          fi
          # The diff sidecar's static Mach-O checks and its
          # handshake run on the signed app in verify-signed-nightly.

      - *package-prepared-app-for-signi

      # nightly-sign.yml (run from main) reads this annotation of this job
      # through the checks API and refuses a tarball with another sha256.
      - *record-prepared-app-digest

      - *finish-the-browser-data-import

      - *upload-prepared-app-for-signin


  prepare-nightly-variant:
    needs: [prepare-nightly-variant-primary, prepare-nightly-variant-fallback]
    if: always() && (needs.prepare-nightly-variant-primary.result == 'success' || needs.prepare-nightly-variant-fallback.result == 'success')
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.CI_CLOUD_OVERFLOW_SAVED && 'blacksmith-6vcpu-macos-26' || vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    steps:
      - name: Accept primary or fallback preparation
        run: echo "nightly preparation completed on the primary or fallback route"

  # The Blacksmith macOS label the signing jobs take, read right before they queue
  # (scripts/ci/nightly_sign_runner.py): never empty, and its step never fails the job.
  # Two GITHUB_TOKEN reads a nightly run (the snapshot artifact's listing and download).
  # It also offers the two verify jobs, which hold no secret and no environment, a free
  # owned Mac (`owned`), as cmux-next-dev-daily.yml's `runner` job offers DEV's verify: the
  # routing order is Linux, then owned Macs, then Blacksmith macOS last (Leo, 2026-10-24),
  # and on 2026-10-26 nightly-next waited over an hour behind PR compiles on Blacksmith's
  # macOS cap. The signing jobs, which hold the keys, stay on Blacksmith.
  pick-nightly-sign-runner:
    needs: [decide, prepare-nightly-variant]
    if: ${{ !cancelled() && needs.prepare-nightly-variant.result == 'success' }}
    # A failed pick reads as success to the signing jobs, whose runs-on then falls back to
    # vars.MACOS_RUNNER_26: a pick never blocks signing. It runs on Blacksmith Linux, as
    # prepare-nightly-variant does (LINUX_RUNNER, which the overflow switch moves).
    continue-on-error: true
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.CI_CLOUD_OVERFLOW_SAVED && 'blacksmith-6vcpu-macos-26' || vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    # The owned pick mints the routing token (GLAEDA_ROUTE_APP_KEY), so the key is read in the
    # routing environment, as pick-nightly-build-runner does (tests/test_supplychain_security.py).
    environment: ci-routing-agent
    # Room for every step budget in turn (the Blacksmith pick 2, then the owned pick's token
    # mints 1 + 1 and picker 2) plus checkout, so the job is never cut off before its outputs;
    # the Blacksmith pick runs first so `runner` is set before the owned steps start.
    timeout-minutes: 10
    permissions:
      # The queue janitor's pool snapshot (an artifact).
      actions: read
      contents: read
    outputs:
      runner: ${{ steps.sign-runner.outputs.runner }}
      # The other Blacksmith macOS 26 size, which the signing jobs take on a re-run
      # (attempt 2 on), so a re-run moves off a label that stalled after this pick.
      alternate: ${{ steps.sign-runner.outputs.alternate }}
      # An owned label (glaeda-...) or empty: the verify jobs then take `runner`. They read it only
      # while `attempt` is the run's own attempt (a re-run of failed jobs that keeps this job takes
      # `alternate`). Outside attempt 1 of a push (the rescue's workflow_run watch) it stands only once
      # the owned-pool-watch marker is uploaded, as pick-nightly-build-runner's does.
      owned: ${{ (github.event_name == 'push' && github.run_attempt == 1 || steps.upload-marker.outcome == 'success') && steps.owned.outputs.owned || '' }}
      attempt: ${{ github.run_attempt }}
    steps:
      - name: Checkout publication tooling at the workflow commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: .publish-tooling
          sparse-checkout: scripts/ci

      # The Blacksmith macOS label whose queue is moving, for the macOS jobs after this one
      # (scripts/ci/nightly_sign_runner.py). Signing stays on Blacksmith; a stale
      # vars.MACOS_RUNNER_26 naming a label with no runners no longer strands them.
      - name: Pick the Blacksmith macOS label with a moving queue
        id: sign-runner
        continue-on-error: true
        timeout-minutes: 2
        env:
          SNAPSHOT_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ vars.MACOS_RUNNER_26 }}
        run: python3 .publish-tooling/scripts/ci/nightly_sign_runner.py

      # As cmux-next-dev-daily.yml: idle owned runners read live with the routing App's own
      # budget. Any failure leaves the token empty, and the pick below then finds no owned Mac.
      - name: Mint the owned-pool routing token
        id: route-token
        if: github.repository == 'manaflow-ai/cmux' && vars.CI_PR_POOL_OWNED == '1' && vars.GLAEDA_ROUTE_APP_ID != '' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref_name == 'nightly-next'
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.GLAEDA_ROUTE_APP_ID }}
          private-key: ${{ secrets.GLAEDA_ROUTE_APP_KEY }}
          permission-administration: read
          permission-organization-self-hosted-runners: read

      - name: Mint the routing token without the org permission
        id: route-token-repo
        if: steps.route-token.outcome == 'failure'
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.GLAEDA_ROUTE_APP_ID }}
          private-key: ${{ secrets.GLAEDA_ROUTE_APP_KEY }}
          permission-administration: read

      # The owned labels the build picker offers (vars.CI_NIGHTLY_NEXT_BUILD_RUNNER, glaeda's
      # nightly slot, then vars.CI_SIDE_LANE_RUNNER), never the dedicated builder, while one of
      # their runners is idle now (nightly_build_runner.py verify). glaeda admits a nightly job on
      # a mini ahead of every PR, DEV and side job. Anything else, a failure included, is empty,
      # and the verify jobs take `runner`.
      # Only nightly-next push and dispatch runs, at any attempt, the scope ci-owned-pool-rescue.yml
      # watches (owned_pool_rescue.py nightly_target, and its sweeper through the marker below): a
      # stuck owned verify there is moved to Blacksmith. RC and main runs keep Blacksmith. Until
      # 2026-10-28 only attempt 1 of a push got it: dispatch run 40594111618's attempt 3 had
      # signer-dmg-image wait 51 min on blacksmith-6vcpu-macos-26 and signer-verify queue there too. Until 2026-10-27 this
      # ran the pull request pool picker, which named a Blacksmith macOS 15 label in run 40515681971
      # while owned side runners sat idle: verify then queued 1.5 h on Blacksmith.
      - name: Pick an owned Mac for the verify jobs
        id: owned
        if: github.repository == 'manaflow-ai/cmux' && vars.CI_PR_POOL_OWNED == '1' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref_name == 'nightly-next'
        continue-on-error: true
        timeout-minutes: 2
        env:
          ROUTE_TOKEN: ${{ steps.route-token.outputs.token || steps.route-token-repo.outputs.token }}
          SNAPSHOT_TOKEN: ${{ github.token }}
          # In order; only labels ci-owned-pool-rescue.yml watches are offered.
          OWNED_LABELS: ${{ format('{0} {1}', vars.CI_NIGHTLY_NEXT_BUILD_RUNNER, vars.CI_SIDE_LANE_RUNNER) }}
          CANDIDATE: ${{ vars.MACOS_RUNNER_26 }}
        run: python3 .publish-tooling/scripts/ci/nightly_build_runner.py verify

      # As pick-nightly-build-runner: a dispatch made with GITHUB_TOKEN, or a re-run, may start no
      # workflow_run event, so an owned pick there leaves the sweeper's owned-pool-watch marker.
      - name: Write the owned-pool watch marker
        id: marker
        if: steps.owned.outputs.owned != '' && (github.event_name != 'push' || github.run_attempt != 1)
        continue-on-error: true
        timeout-minutes: 1
        env:
          OWNED: ${{ steps.owned.outputs.owned }}
        run: |
          marker="$RUNNER_TEMP/owned-pool-watch/nightly-verify-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "${marker%/*}"
          printf '%s\n' "$OWNED" > "$marker"
          echo "path=$marker" >> "$GITHUB_OUTPUT"

      - name: Upload the owned-pool watch marker
        id: upload-marker
        if: steps.marker.outputs.path != ''
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: owned-pool-watch
          path: ${{ steps.marker.outputs.path }}
          retention-days: 1
          overwrite: true

  build-sign-notarize-nightly:
    # Production secrets: GitHub releases them only to protected refs (the
    # environment's deployment branch policy: main, tags v*). The nightly-next
    # track uses `release-next`, whose policy allows only branch nightly-next.
    environment: ${{ needs.decide.outputs.environment }}
    # The fallback for the release-pool signer jobs: runs unless signer-dmg
    # passed, so a failed, skipped or not-opted-in pool run signs here as before.
    needs: [decide, build-nightly-app, resolve-nightly-cmux-tui-client, prepare-nightly-variant, pick-nightly-sign-runner, signer-dmg]
    if: "!cancelled() && needs.decide.result == 'success' && needs.build-nightly-app.result == 'success' && needs.resolve-nightly-cmux-tui-client.result == 'success' && needs.prepare-nightly-variant.result == 'success' && needs.pick-nightly-sign-runner.result == 'success' && needs.signer-dmg.result != 'success' && needs.decide.outputs.should_build == 'true' && (github.event_name != 'schedule' || github.event.schedule == '47 8 * * *') && needs.decide.outputs.build_only != 'true' && needs.resolve-nightly-cmux-tui-client.outputs.already_published != 'true' && needs.resolve-nightly-cmux-tui-client.outputs.superseded != 'true' && needs.decide.outputs.continue_only != 'true'"
    outputs:
      # nightly-next is arm64 only, so its one matrix leg sets this; publish
      # waits for a later run when Apple had not accepted the build in time.
      notary_pending: ${{ steps.notarize-nightly.outputs.submission_pending }}
      # The 6 h stapled-app fallback (notarize-nightly-dmg.sh) shipped the first DMG.
      stapled_app_fallback_id: ${{ steps.notarize-nightly.outputs.stapled_app_fallback == 'true' && steps.notarize-nightly.outputs.stapled_app_pending_id || '' }}
    # Sign and notarize on the same macOS 26 lane proven by stable releases.
    # actions:read lets the parallel artifact download resolve the blob URL.
    permissions:
      contents: read
      actions: read
    # Secret-bearing signing and notarization stay on the trusted Blacksmith
    # macOS pool; credentials remain in this protected environment and never
    # move through an artifact or worker disk.
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || github.run_attempt > 1 && needs.pick-nightly-sign-runner.outputs.alternate || needs.pick-nightly-sign-runner.outputs.runner || vars.MACOS_RUNNER_26 || 'blacksmith-6vcpu-macos-26' }}
    # Start the standalone Computer Use helper submission before Codesign apps
    # so Apple's first wait overlaps useful work; finish it before the final
    # DMG. The job budget covers both waits (see the notarize step).
    # Sparkle delta generation runs after the full publication in a separate
    # best-effort lane, so it cannot delay the first update users can install.
    # A cx-f58x notary test waits up to 160 minutes for Apple (52c6c12d took
    # over 90) because it has no recovery hand-off.
    timeout-minutes: ${{ needs.decide.outputs.notary_test == 'true' && 235 || 160 }}
    # One universal Xcode build feeds every variant: the thin variants are cut
    # from it with lipo, so each user downloads only their architecture.
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.decide.outputs.variants) }}
    env:
      CMUX_CI_XCODE_APP: ${{ vars.CMUX_CI_XCODE_APP_MACOS_26 }}
      CMUX_CI_REQUIRED_MACOS_SDK_MAJOR: "26"
      NIGHTLY_VARIANT: ${{ matrix.variant }}
      NIGHTLY_FAST_BUILD: ${{ needs.decide.outputs.fast_build }}
      NIGHTLY_BUILD: ${{ needs.build-nightly-app.outputs.daemon_build }}
      NIGHTLY_MARKETING_VERSION: ${{ needs.build-nightly-app.outputs.daemon_version }}
      BUNDLE_REMOTE_DAEMON_ASSETS: ${{ needs.decide.outputs.fast_build == 'true' || needs.decide.outputs.should_publish != 'true' }}
      CHANNEL: ${{ needs.decide.outputs.channel }}
      TRACK: ${{ needs.decide.outputs.track }}
      CHANNEL_BUNDLE_ID: ${{ needs.decide.outputs.bundle_id }}
      CHANNEL_APP_NAME: ${{ needs.decide.outputs.app_name }}
      CHANNEL_URL_SCHEME: ${{ needs.decide.outputs.url_scheme }}
      CHANNEL_DMG_PREFIX: ${{ needs.decide.outputs.dmg_prefix }}
      CHANNEL_RELEASE_TAG: ${{ needs.decide.outputs.release_tag }}
      CHANNEL_FEED_BASE: ${{ needs.decide.outputs.feed_base }}
      CHANNEL_ENTITLEMENTS: ${{ needs.decide.outputs.entitlements }}
      # Signed app path for every step after "Prepare channel identity".
      CHANNEL_APP_PATH: build-universal/Build/Products/Release/${{ needs.decide.outputs.app_name }}.app
    steps:
      - name: Clear stale git locks (self-hosted reused workspace)
        shell: bash
        run: |
          # Self-hosted macOS runners reuse the workspace. A job cancelled or
          # killed mid-checkout can leave a stale .git/modules/*/index.lock that
          # fails every later submodule checkout (e.g. ghostty). Clear them first.
          ws="${GITHUB_WORKSPACE:-$PWD}"
          rm -f "$ws/.git/index.lock" 2>/dev/null || true
          if [ -d "$ws/.git/modules" ]; then
            find "$ws/.git/modules" -type f -name "*.lock" -delete 2>/dev/null || true
          fi


      - name: Checkout build ref
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ needs.resolve-nightly-cmux-tui-client.outputs.build_sha }}
          # Main and RC signing do not need submodules. nightly-next's notice
          # check reads ghostty-next/build.zig.zon, so initialize that optional
          # submodule in the next step only for the cmux-next track.
          submodules: false

      - name: Checkout trusted signing controls for unsigned resume
        if: inputs.nightly_next_unsigned_run != ''
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: .nightly-signing-control
          submodules: false

      - name: Install the current signing keychain controls
        if: inputs.nightly_next_unsigned_run != ''
        run: |
          set -euo pipefail
          # Source-bound notices and entitlements stay at the original commit.
          # Only the reviewed signing control and its two dependencies advance.
          for control in scripts/ci/signing-keychain.sh scripts/ci/lib/signing-runtime-guard.sh scripts/import-apple-developer-id-intermediates.sh; do
            cp ".nightly-signing-control/$control" "$control"
          done
          echo "Unsigned resume signing controls: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Initialize cmux-next notices submodule
        if: github.ref_name == 'nightly-next'
        shell: bash
        run: bash scripts/ci/init-submodule.sh ghostty-next


      # macOS /bin/bash 3.2 exits 0 on a parse error in a script with an EXIT
      # trap (runs 39014131817, 39014922771). Parse every script this job can
      # run before any signing or notarization. An unsigned resume builds an
      # older tree: the checker and the workflow come from the signing control
      # (this run's commit), the scripts from the build tree.
      - name: Parse signing and notarize scripts with /bin/bash 3.2
        shell: bash
        run: |
          set -euo pipefail
          checker=scripts/ci/check-bash32-parse.sh
          workflow="$PWD/.github/workflows/nightly.yml"
          if [ -d .nightly-signing-control ]; then
            checker=.nightly-signing-control/$checker
            workflow="$PWD/.nightly-signing-control/.github/workflows/nightly.yml"
          fi
          CMUX_PARSE_ROOT="$PWD" "$checker" "$workflow"

      - name: Select Xcode
        run: ./scripts/select-ci-xcode.sh

      # prepare-nightly-variant ran every check that executes bundle code on
      # this exact app (cmux-tui install, theme picker, sidecar handshake) and
      # thinned it; this job only signs, notarizes and packages it.
      - name: Download prepared app
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: cmux-${{ needs.decide.outputs.channel }}-prepared-app-${{ matrix.variant }}-${{ needs.resolve-nightly-cmux-tui-client.outputs.build_short_sha }}
          path: prepared-app

      - &download-ssh-daemon-assets-2
        name: Download SSH daemon assets
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: cmux-nightly-remote-daemon
          path: remote-daemon-assets

      - name: Restore prepared app
        run: |
          set -euo pipefail
          products="build-universal/Build/Products/Release"
          mkdir -p "$products"
          tar -C "$products" -xzf prepared-app/cmux-prepared-app.tar.gz


      - name: Refuse a resumed build superseded by a published feed
        if: inputs.nightly_next_unsigned_run != ''
        run: |
          set -euo pipefail
          feeds=()
          for appcast in appcast.xml appcast-arm64.xml appcast-x86_64.xml; do
            feeds+=(--feed-if-present "${NIGHTLY_NEXT_FEED_BASE}/${appcast}" --feed "${NIGHTLY_NEXT_LEGACY_FEED_BASE}/${appcast}" --feed "https://files.cmux.com/nightly/${appcast}")
          done
          python3 scripts/ci/nightly_version.py check-build --build "$NIGHTLY_BUILD" "${feeds[@]}"

      # Provide node/npm explicitly. The build/sign/notarize job can land on a
      # self-hosted macOS runner (the iOS-CI minis match the same label) that has
      # no npm on PATH, so `npm install --global create-dmg` failed with
      # "npm: command not found" and turned nightly red. setup-node makes the job
      # self-sufficient on any runner instead of assuming a preinstalled npm.
      - &set-up-node
        name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22.23.4"


      - name: Install build deps
        run: |
          CMUX_NODE_BIN="$(command -v node)"
          export npm_config_prefix="$RUNNER_TEMP/npm-global"
          mkdir -p "$npm_config_prefix"
          npm install --global "create-dmg@${CREATE_DMG_VERSION}"
          wrapper_dir="$RUNNER_TEMP/create-dmg-wrapper"
          mkdir -p "$wrapper_dir"
          cat > "$wrapper_dir/create-dmg" <<EOF
          #!/usr/bin/env bash
          exec "$CMUX_NODE_BIN" "$npm_config_prefix/lib/node_modules/create-dmg/cli.js" "\$@"
          EOF
          chmod +x "$wrapper_dir/create-dmg"
          echo "$wrapper_dir" >> "$GITHUB_PATH"


      - name: Derive Sparkle public key from private key
        # The production probe carries no Sparkle key, so it can never update.
        if: needs.decide.outputs.notary_probe != 'true'
        env:
          # scripts/ci/nightly-sparkle-key.sh picks the key per channel and
          # NIGHTLY_SPARKLE_KEY; unset keeps the shared key.
          NIGHTLY_SPARKLE_KEY: ${{ vars.NIGHTLY_SPARKLE_KEY }}
          CHANNEL: ${{ needs.decide.outputs.channel }}
          TRACK: ${{ needs.decide.outputs.track }}
          # The nightly-next track gets only its own key; the others never see it.
          SHARED_SPARKLE_PRIVATE_KEY: ${{ needs.decide.outputs.track != 'nightly-next' && secrets.SPARKLE_PRIVATE_KEY || '' }}
          NIGHTLY_SPARKLE_PRIVATE_KEY: ${{ needs.decide.outputs.track != 'nightly-next' && secrets.NIGHTLY_SPARKLE_PRIVATE_KEY || '' }}
          NEXT_SPARKLE_PRIVATE_KEY: ${{ needs.decide.outputs.track == 'nightly-next' && secrets.SPARKLE_NEXT_PRIVATE_KEY || '' }}
        run: |
          set -euo pipefail
          SPARKLE_PRIVATE_KEY="$(./scripts/ci/nightly-sparkle-key.sh)"
          DERIVED_PUBLIC_KEY=$(
            printf '%s' "$SPARKLE_PRIVATE_KEY" |
              env -u SPARKLE_PRIVATE_KEY \
                -u SHARED_SPARKLE_PRIVATE_KEY \
                -u NIGHTLY_SPARKLE_PRIVATE_KEY \
                -u NEXT_SPARKLE_PRIVATE_KEY \
                swift scripts/derive_sparkle_public_key.swift --stdin
          )
          echo "Derived Sparkle public key: $DERIVED_PUBLIC_KEY"
          if [ "$TRACK" = "nightly-next" ] && [ "$DERIVED_PUBLIC_KEY" != "$NIGHTLY_NEXT_SPARKLE_PUBLIC_KEY" ]; then
            echo "SPARKLE_NEXT_PRIVATE_KEY does not derive the pinned NIGHTLY_NEXT_SPARKLE_PUBLIC_KEY" >&2
            exit 1
          fi
          echo "SPARKLE_PUBLIC_KEY=$DERIVED_PUBLIC_KEY" >> "$GITHUB_ENV"


      - name: Inject nightly identities and metadata
        env:
          NOTARY_PROBE: ${{ needs.decide.outputs.notary_probe }}
        run: |
          set -euo pipefail
          SHORT_SHA="${{ needs.resolve-nightly-cmux-tui-client.outputs.build_short_sha }}"
          APP_DIR="build-universal/Build/Products/Release"

          # The producer owns the version for both the daemon and every app variant.
          : "${NIGHTLY_BUILD:?missing daemon build}" "${NIGHTLY_MARKETING_VERSION:?missing daemon version}"

          NIGHTLY_DMG_IMMUTABLE="${CHANNEL_DMG_PREFIX}-${NIGHTLY_VARIANT}-${NIGHTLY_BUILD}.dmg"
          NIGHTLY_DMG_RELEASE="${CHANNEL_DMG_PREFIX}-${NIGHTLY_VARIANT}.dmg"
          # Thin variants get their own feed. The universal variant keeps the legacy
          # feed name; the app's feed resolver rewrites it to the per-architecture
          # feed at runtime, which is how older installs migrate.
          if [ "$NIGHTLY_VARIANT" = "universal" ]; then
            NIGHTLY_APPCAST="appcast.xml"
          else
            NIGHTLY_APPCAST="appcast-${NIGHTLY_VARIANT}.xml"
          fi
          {
            echo "NIGHTLY_BUILD=${NIGHTLY_BUILD}"
            echo "NIGHTLY_MARKETING_VERSION=${NIGHTLY_MARKETING_VERSION}"
            echo "NIGHTLY_DMG_IMMUTABLE=${NIGHTLY_DMG_IMMUTABLE}"
            echo "NIGHTLY_DMG_RELEASE=${NIGHTLY_DMG_RELEASE}"
            echo "NIGHTLY_APPCAST=${NIGHTLY_APPCAST}"
          } >> "$GITHUB_ENV"

          prepare_variant() {
            local app_dir="$1"
            local bundle_id="$2"
            local feed_url="$3"
            local app_plist="$app_dir/cmux.app/Contents/Info.plist"

            /usr/libexec/PlistBuddy -c "Set :CFBundleName ${CHANNEL_APP_NAME}" "$app_plist"
            /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName ${CHANNEL_APP_NAME}" "$app_plist"
            /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier ${bundle_id}" "$app_plist"
            local url_type_name
            url_type_name="$(/usr/libexec/PlistBuddy -c "Print :CFBundleURLTypes:1:CFBundleURLName" "$app_plist")"
            if [[ "$url_type_name" != *.auth ]]; then
              echo "Expected CFBundleURLTypes[1] to be the auth URL type, found: $url_type_name" >&2
              exit 1
            fi
            /usr/libexec/PlistBuddy -c "Set :CFBundleURLTypes:1:CFBundleURLSchemes:0 ${CHANNEL_URL_SCHEME}" "$app_plist"
            if [ "$TRACK" = nightly-next ] && [ "$NOTARY_PROBE" != true ]; then
              # A tagged nightly bundle id defaults to the stable `cmux`
              # sign-in callback; cmux NEXT signs in through its own scheme
              # (CloudConfiguration reads LSEnvironment first).
              /usr/libexec/PlistBuddy -c "Add :LSEnvironment dict" "$app_plist" >/dev/null 2>&1 || true
              /usr/libexec/PlistBuddy -c "Delete :LSEnvironment:CMUX_AUTH_CALLBACK_SCHEME" "$app_plist" >/dev/null 2>&1 || true
              /usr/libexec/PlistBuddy -c "Add :LSEnvironment:CMUX_AUTH_CALLBACK_SCHEME string ${CHANNEL_URL_SCHEME}" "$app_plist"
            fi
            /usr/libexec/PlistBuddy -c "Delete :SUPublicEDKey" "$app_plist" >/dev/null 2>&1 || true
            /usr/libexec/PlistBuddy -c "Delete :SUFeedURL" "$app_plist" >/dev/null 2>&1 || true
            if [ "$NOTARY_PROBE" = true ]; then
              # Production-identity probe: no key and no feed. Without
              # SUPublicEDKey the updater never starts and Sparkle accepts no
              # update, so this app can never update itself into any channel.
              if /usr/libexec/PlistBuddy -c "Print :SUPublicEDKey" "$app_plist" >/dev/null 2>&1; then
                echo "probe app still has SUPublicEDKey" >&2; exit 1
              fi
            else
              /usr/libexec/PlistBuddy -c "Add :SUPublicEDKey string ${SPARKLE_PUBLIC_KEY}" "$app_plist"
              /usr/libexec/PlistBuddy -c "Add :SUFeedURL string ${feed_url}" "$app_plist"
            fi
            /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${NIGHTLY_MARKETING_VERSION}" "$app_plist"
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${NIGHTLY_BUILD}" "$app_plist"
            /usr/libexec/PlistBuddy -c "Delete :CMUXCommit" "$app_plist" >/dev/null 2>&1 || true
            /usr/libexec/PlistBuddy -c "Add :CMUXCommit string ${SHORT_SHA}" "$app_plist"
            if [ "$CHANNEL_APP_NAME" != cmux ]; then
              mv "$app_dir/cmux.app" "$app_dir/${CHANNEL_APP_NAME}.app"
            fi
          }

          prepare_variant \
            "$APP_DIR" \
            "$CHANNEL_BUNDLE_ID" \
            "${CHANNEL_FEED_BASE}/${NIGHTLY_APPCAST}"
          if [ "$TRACK" = "nightly-next" ] && [ "$NOTARY_PROBE" != true ]; then
            python3 scripts/ci/nightly-next-guard.py feed-url \
              "$(/usr/libexec/PlistBuddy -c 'Print :SUFeedURL' "$APP_DIR/${CHANNEL_APP_NAME}.app/Contents/Info.plist")"
          fi

          echo "Channel: ${CHANNEL}"
          echo "App name: ${CHANNEL_APP_NAME}"
          echo "Variant: ${NIGHTLY_VARIANT}"
          echo "Feed: ${CHANNEL_FEED_BASE}/${NIGHTLY_APPCAST}"
          echo "Bundle ID: ${CHANNEL_BUNDLE_ID}"
          echo "Marketing version: ${NIGHTLY_MARKETING_VERSION}"
          echo "Build number: ${NIGHTLY_BUILD}"
          echo "Immutable DMG: ${NIGHTLY_DMG_IMMUTABLE}"
          echo "Commit SHA: ${SHORT_SHA}"


      - name: Embed verified SSH daemon manifest
        run: |
          bundle_args=()
          if [[ "$BUNDLE_REMOTE_DAEMON_ASSETS" == "true" ]]; then
            # Unpublished dogfood builds must work without GitHub release URLs.
            bundle_args+=(--bundle-assets)
          fi
          # No --verify-cli here: this job holds signing secrets and runs no
          # bundle code. verify-signed-nightly runs the bundled-CLI query on the
          # signed app.
          python3 scripts/verify_remote_daemon_release.py \
            --manifest "remote-daemon-assets/cmuxd-remote-manifest-${NIGHTLY_BUILD}.json" \
            --assets-dir remote-daemon-assets \
            --app "$CHANNEL_APP_PATH" --embed "${bundle_args[@]}"


      # Read-only: can this ASC key register nightly-next's own App ID
      # (com.cmuxterm.app.next) and fetch its Developer ID profile? It reports
      # and never writes or fails the build.
      - name: Probe the cmux NEXT App ID and profile (read-only)
        if: needs.decide.outputs.track == 'nightly-next'
        continue-on-error: true
        timeout-minutes: 2
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          python3 scripts/ci/asc_developer_id_app.py check \
            --bundle-id com.cmuxterm.app.next --name "cmux NEXT" --profile-name "cmux NEXT Developer ID" \
            | tee -a "$GITHUB_STEP_SUMMARY"


      # The signing keychain exists only while this job signs. It is deleted
      # before any step runs code from the bundle, and created again for the
      # DMG signature. scripts/ci/signing-keychain.sh owns its lifetime.
      - name: Import signing cert
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: ./scripts/ci/signing-keychain.sh create


      # Each channel has its own Developer ID profile:
      # APPLE_NIGHTLY_PROVISIONING_PROFILE_BASE64 / APPLE_RC_PROVISIONING_PROFILE_BASE64.
      - name: Embed channel provisioning profile
        if: needs.decide.outputs.profile_channel != ''
        env:
          APP_PROVISIONING_PROFILE_BASE64: ${{ secrets[format('APPLE_{0}_PROVISIONING_PROFILE_BASE64', needs.decide.outputs.profile_channel)] }}
          PROFILE_SECRET_NAME: APPLE_${{ needs.decide.outputs.profile_channel }}_PROVISIONING_PROFILE_BASE64
        run: |
          if [ -z "$APP_PROVISIONING_PROFILE_BASE64" ]; then
            echo "Missing $PROFILE_SECRET_NAME secret" >&2
            exit 1
          fi

          APP_PATH="$CHANNEL_APP_PATH"
          PROFILE_PATH="$APP_PATH/Contents/embedded.provisionprofile"
          TMP_PROFILE="$(mktemp /tmp/cmux-channel-profile.XXXXXX)"
          TMP_PLIST="$(mktemp /tmp/cmux-channel-profile.XXXXXX.plist)"
          trap 'rm -f "$TMP_PROFILE" "$TMP_PLIST"' EXIT

          echo "$APP_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$TMP_PROFILE"
          security cms -D -i "$TMP_PROFILE" > "$TMP_PLIST"

          APP_ID="$(/usr/libexec/PlistBuddy -c "Print :Entitlements:com.apple.application-identifier" "$TMP_PLIST")"
          if [ "$APP_ID" != "7WLXT3NR37.${CHANNEL_BUNDLE_ID}" ]; then
            echo "$CHANNEL provisioning profile targets unexpected app ID: $APP_ID" >&2
            exit 1
          fi

          # The WebAuthn browser entitlement is an Apple-approved capability
          # request. Nightly has it; the RC App ID's request has been pending
          # since 2026-07-10, so cmux.rc.entitlements does not ask for it and
          # RC ships without passkey sign-in in the embedded browser until Apple
          # approves. The check follows the channel's entitlements file so the
          # profile can never silently lag behind what the app requests.
          if /usr/libexec/PlistBuddy -c "Print :com.apple.developer.web-browser.public-key-credential" "$CHANNEL_ENTITLEMENTS" >/dev/null 2>&1; then
            WEBAUTHN_ENTITLEMENT="$(/usr/libexec/PlistBuddy -c "Print :Entitlements:com.apple.developer.web-browser.public-key-credential" "$TMP_PLIST" 2>/dev/null || true)"
            if [ "$WEBAUTHN_ENTITLEMENT" != "true" ]; then
              echo "$CHANNEL provisioning profile is missing WebAuthn browser entitlement" >&2
              exit 1
            fi
          else
            echo "$CHANNEL entitlements do not request the WebAuthn browser entitlement; skipping the profile check"
          fi

          # Refuse an expired profile (an unparsable date is only reported).
          EXPIRES="$(/usr/libexec/PlistBuddy -c "Print :ExpirationDate" "$TMP_PLIST" 2>/dev/null || true)"
          EXPIRES_EPOCH="$(date -j -f '%a %b %d %T %Z %Y' "$EXPIRES" +%s 2>/dev/null || true)"
          echo "$PROFILE_SECRET_NAME expires: ${EXPIRES:-unknown}"
          if [ -n "$EXPIRES_EPOCH" ] && [ "$EXPIRES_EPOCH" -le "$(date +%s)" ]; then
            echo "$CHANNEL provisioning profile expired: $EXPIRES" >&2
            exit 1
          fi

          PROVISIONS_ALL_DEVICES="$(/usr/libexec/PlistBuddy -c "Print :ProvisionsAllDevices" "$TMP_PLIST")"
          if [ "$PROVISIONS_ALL_DEVICES" != "true" ]; then
            echo "$CHANNEL provisioning profile is not a Developer ID all-devices profile" >&2
            exit 1
          fi

          cp "$TMP_PROFILE" "$PROFILE_PATH"


      # The Computer Use helper has its own notarization ticket (a copy outside
      # the app stays Gatekeeper-valid). Its submission starts here, signed
      # with its final Developer ID signature, so Apple's wait overlaps the
      # smoke steps; the notarize step below finishes it before the DMG.
      - name: Start the Computer Use helper notarization
        if: needs.decide.outputs.fast_build != 'true' && needs.decide.outputs.notary_paused != 'true'
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          ./scripts/ci/notarize-computer-use-helper.sh --start \
            "$RUNNER_TEMP/cmux-computer-use-notarization.state" \
            "$CHANNEL_APP_PATH" \
            "$CHANNEL_ENTITLEMENTS" \
            "$APPLE_SIGNING_IDENTITY"


      - name: Codesign apps
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # Chromium on demand (plans/cmux-next/bundle-size-DESIGN.md 6.6): off
          # until the repository variable CMUX_NEXT_CEF_ON_DEMAND is 1.
          CMUX_NEXT_CEF_ON_DEMAND: ${{ needs.decide.outputs.track == 'nightly-next' && vars.CMUX_NEXT_CEF_ON_DEMAND == '1' && '1' || '' }}
          CMUX_NEXT_CEF_RUNTIME_OUT: ${{ runner.temp }}/cef-runtime
          CMUX_NEXT_CEF_RUNTIME_BASE_URL: https://files-next.cmux.com
        run: |
          if [ -z "$APPLE_SIGNING_IDENTITY" ]; then
            echo "Missing APPLE_SIGNING_IDENTITY secret" >&2
            exit 1
          fi
          # A submitted helper keeps the exact signature Apple is notarizing;
          # otherwise (fast or paused builds) sign it in the inside-out pass.
          sign_mode=all
          if [ -f "$RUNNER_TEMP/cmux-computer-use-notarization.state" ]; then
            sign_mode=all-except-computer-use
          fi
          CMUX_SIGN_MODE="$sign_mode" ./scripts/sign-cmux-bundle.sh \
            "$CHANNEL_APP_PATH" \
            "$CHANNEL_ENTITLEMENTS" \
            "$APPLE_SIGNING_IDENTITY"


      # The runtime pack the app's pin names; publish-nightly uploads it
      # before the appcast.
      - name: Upload the Chromium runtime pack
        if: needs.decide.outputs.track == 'nightly-next' && vars.CMUX_NEXT_CEF_ON_DEMAND == '1'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cef-runtime-pack
          overwrite: true
          path: ${{ runner.temp }}/cef-runtime
          if-no-files-found: error
          retention-days: 7

      # Onboarding grants Accessibility and Screen Recording only to a helper
      # that passes the Developer ID requirement (cx-urd.6).
      - name: Verify the Computer Use helper signature
        run: ./scripts/ci/verify-computer-use-helper.sh signed "$CHANNEL_APP_PATH"


      - name: Delete signing keychain before runtime checks
        if: always()
        run: ./scripts/ci/signing-keychain.sh delete


      # The read-only checks of the signed app and its two packages run on a
      # copy of it while Apple notarizes (signed-app-checks.sh): about 2.5 min
      # that used to stand between Codesign apps and the first submission. The
      # notarize step changes the app in place, so the copy is taken here.
      # This job holds signing secrets, so it runs no code from the bundle.
      # verify-signed-nightly runs every check that executes the app, the CLI,
      # the helpers or the sidecar, in a job without secrets, on this exact
      # signed app and on the final DMG (#21024). Notary tests and builds held
      # by NIGHTLY_NEXT_NOTARY_PAUSED (they carry the browser-data import) never
      # upload a signed app and publish nothing, so they skip that job. The
      # unnotarized zip is the Developer ID-signed app for teammates when
      # Apple's queue is slow; the public repository never gets one from notary
      # tests or paused builds, and a failed zip never blocks notarization.
      - name: Start the signed-app checks (they run during notarization)
        env:
          CHECK_MINOS: ${{ env.TRACK == 'nightly-next' }}
          PACKAGE_HANDOFF: ${{ needs.decide.outputs.notary_test != 'true' && needs.decide.outputs.import_paused != 'true' }}
          PACKAGE_UNNOTARIZED_ZIP: ${{ needs.decide.outputs.fast_build != 'true' && needs.decide.outputs.notary_test != 'true' && needs.decide.outputs.import_paused != 'true' }}
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          # An unsigned resume of an older tree may predate this script; its
          # checks are still the tree's own (the script runs ./scripts/...).
          checks=scripts/ci/signed-app-checks.sh
          [ -f "$checks" ] || checks=.nightly-signing-control/scripts/ci/signed-app-checks.sh
          bash "$checks" start "$CHANNEL_APP_PATH"


      - name: Stop before notarization (NIGHTLY_NEXT_NOTARY_PAUSED)
        if: needs.decide.outputs.notary_paused == 'true'
        run: |
          echo "::notice title=nightly-next notarization paused::NIGHTLY_NEXT_NOTARY_PAUSED=1: the signed app was built, no notary submission was made and nothing is published."
          echo "### nightly-next notarization paused (NIGHTLY_NEXT_NOTARY_PAUSED=1): no notary submission, nothing published" >> "$GITHUB_STEP_SUMMARY"


      # The helper re-seal and the DMG need the identity again. Both run no
      # bundle code; notarize-nightly-dmg.sh deletes the keychain right after
      # the DMG signature, before static artifact verification.
      - name: Import signing cert for the DMG signature
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: ./scripts/ci/signing-keychain.sh create


      - name: Notarize app ticket through final DMG
        id: notarize-nightly
        if: needs.decide.outputs.fast_build != 'true' && needs.decide.outputs.notary_paused != 'true'
        # Main and RC wait at most 40m (usually a few minutes). Published
        # nightly-next waits 20m: an Accepted build is stapled and published by
        # this run, and one still in Apple's queue is handed to a later
        # nightly-next run through the recovery artifact below, which publishes
        # the newest Accepted build. Nightly-next runs one at a time, so a
        # longer wait held every newer build behind one stalled submission
        # (submission 5912557e stayed In Progress for over 90m on 2026-10-14).
        # The helper submitted before Codesign apps finishes first: at most
        # 15m more in Apple's queue plus 20m of Gatekeeper propagation polling
        # (notarize-computer-use-helper.sh), so the step budget covers both
        # waits and the DMG's pending state is always written before a timeout.
        # A helper Apple still holds after 15m is not a failure: the DMG ticket
        # covers it, and that is checked (cx-urd.68), and a slow DMG is handed off.
        # Outside notary tests, the DMG that ships is a second DMG built around
        # the app stapled from the first ticket, with its own submission and
        # the same wait (CMUX_STAPLE_APP_IN_DMG); a slow second DMG is handed
        # off the same way (the next run continues the accepted first one).
        timeout-minutes: ${{ needs.decide.outputs.notary_test == 'true' && 205 || 130 }}
        env:
          CMUX_NOTARY_WAIT_TIMEOUT: ${{ needs.decide.outputs.notary_test == 'true' && '160m' || needs.decide.outputs.track == 'nightly-next' && needs.decide.outputs.should_publish == 'true' && needs.decide.outputs.no_publish != 'true' && '20m' || '40m' }}
          CMUX_COMPUTER_USE_NOTARY_SUBMISSION_FILE: ${{ runner.temp }}/cmux-computer-use-notarization.state
          CMUX_COMPUTER_USE_NOTARY_WAIT_TIMEOUT: 15m
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # The DMG around the stapled app is signed after Apple's wait.
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # A notary test publishes nothing and keeps its one DMG submission.
          CMUX_STAPLE_APP_IN_DMG: ${{ needs.decide.outputs.notary_test == 'true' && 'false' || 'true' }}
          # Only a build that may publish hands a pending submission to a
          # later run; a notary test waits here and is never continued.
          CMUX_NOTARY_PENDING_ON_TIMEOUT: ${{ needs.decide.outputs.track == 'nightly-next' && needs.decide.outputs.should_publish == 'true' && needs.decide.outputs.no_publish != 'true' && 'true' || 'false' }}
          CMUX_CHANNEL: ${{ needs.decide.outputs.sign_channel }}
          # Runtime checks for the stapled app and final DMG run in
          # verify-signed-nightly, a job without secrets.
          CMUX_DEFER_LAUNCH_SMOKES: "true"
        run: |
          ./scripts/ci/notarize-nightly-dmg.sh \
            "$CHANNEL_APP_PATH" \
            "$NIGHTLY_DMG_RELEASE" \
            "$NIGHTLY_DMG_IMMUTABLE"


      # Every Mach-O must load on the declared floor, map to its notices and
      # pass the load-command check; the verify job's handoff comes from the
      # same copy. A failure here fails the job, so nothing is published.
      - name: Finish the signed-app checks
        id: signed-app-checks
        if: always()
        timeout-minutes: 15
        run: |
          set -euo pipefail
          checks=scripts/ci/signed-app-checks.sh
          [ -f "$checks" ] || checks=.nightly-signing-control/scripts/ci/signed-app-checks.sh
          bash "$checks" finish


      - name: Upload signed app for the verify job
        if: "!cancelled() && steps.signed-app-checks.outcome == 'success' && needs.decide.outputs.notary_test != 'true' && needs.decide.outputs.import_paused != 'true'"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-${{ needs.decide.outputs.channel }}-signed-app-${{ matrix.variant }}-${{ needs.resolve-nightly-cmux-tui-client.outputs.build_short_sha }}
          path: signed-app-handoff/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 3
          overwrite: true


      - name: Upload the signed unnotarized app
        if: "!cancelled() && steps.signed-app-checks.outcome == 'success' && needs.decide.outputs.fast_build != 'true' && needs.decide.outputs.notary_test != 'true' && needs.decide.outputs.import_paused != 'true'"
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-nightly-signed-unnotarized-${{ matrix.variant }}
          overwrite: true
          path: ${{ runner.temp }}/signed-unnotarized/*.zip
          if-no-files-found: error
          retention-days: 7


      - name: Package signed fast dogfood DMG
        if: needs.decide.outputs.fast_build == 'true'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          CMUX_CHANNEL: ${{ needs.decide.outputs.channel }}
          CMUX_SKIP_NOTARIZATION: "true"
        run: |
          ./scripts/ci/notarize-nightly-dmg.sh \
            "$CHANNEL_APP_PATH" \
            "$NIGHTLY_DMG_RELEASE" \
            "$NIGHTLY_DMG_IMMUTABLE"


      - name: Delete signing keychain after the DMG signature
        if: always()
        run: ./scripts/ci/signing-keychain.sh delete


      - name: Prepare pending notarization recovery artifact
        id: prepare-notarization-recovery
        if: >-
          always() && needs.decide.outputs.track == 'nightly-next' && needs.decide.outputs.no_publish != 'true' &&
          (steps.notarize-nightly.outputs.submission_pending == 'true' || steps.notarize-nightly.outcome == 'failure') &&
          steps.signed-app-checks.outcome == 'success'
        env:
          # The state file records the signing channel (cmux NEXT signs as `next`).
          SIGN_CHANNEL: ${{ needs.decide.outputs.sign_channel }}
        run: |
          set -euo pipefail
          for required in \
            "$NIGHTLY_DMG_RELEASE" \
            "$NIGHTLY_DMG_RELEASE.notarization.state" \
            "$NIGHTLY_DMG_RELEASE.notarization.log" \
            "$CHANNEL_APP_PATH"; do
            if [ ! -e "$required" ]; then
              echo "Missing notarization recovery input: $required" >&2
              exit 1
            fi
          done
          # A handed-off stapled-app DMG travels with the accepted first DMG
          # (the 6 h fallback of notarize-nightly-dmg.sh).
          if grep -Fxq stapled_app=true "$NIGHTLY_DMG_RELEASE.notarization.state" && [ ! -f "${NIGHTLY_DMG_RELEASE%.dmg}.first.dmg" ]; then
            echo "Missing notarization recovery input: ${NIGHTLY_DMG_RELEASE%.dmg}.first.dmg" >&2
            exit 1
          fi
          recovery_app_archive="cmux-nightly-notarization-recovery-app.tar.gz"
          tar -C "$(dirname "$CHANNEL_APP_PATH")" -czf "$recovery_app_archive" "$(basename "$CHANNEL_APP_PATH")"
          dmg_sha256="$(shasum -a 256 "$NIGHTLY_DMG_RELEASE" | awk '{print $1}')"
          [[ "$dmg_sha256" =~ ^[[:xdigit:]]{64}$ ]] || {
            echo "Could not record a SHA-256 for $NIGHTLY_DMG_RELEASE" >&2
            exit 1
          }
          python3 - \
            "$NIGHTLY_DMG_RELEASE.notarization.state" \
            "$dmg_sha256" \
            "$NIGHTLY_DMG_RELEASE" \
            "$CHANNEL_APP_PATH" \
            "$CHANNEL" \
            "$NIGHTLY_VARIANT" \
            "$CHANNEL_RELEASE_TAG" \
            "$NIGHTLY_BUILD" \
            "${{ needs.resolve-nightly-cmux-tui-client.outputs.build_sha }}" \
            "${{ needs.resolve-nightly-cmux-tui-client.outputs.build_short_sha }}" \
            "${{ needs.resolve-nightly-cmux-tui-client.outputs.tip_sha }}" \
            "${{ needs.resolve-nightly-cmux-tui-client.outputs.behind }}" \
            "${{ needs.resolve-nightly-cmux-tui-client.outputs.behind_hours }}" \
            "$SIGN_CHANNEL" <<'PY'
          import json
          import pathlib
          import sys

          state_path, actual_sha, dmg_path, app_path, channel, variant, release_tag, build, head_sha, short_sha, tip_sha, behind, behind_hours, sign_channel = sys.argv[1:]
          state = {}
          for line in pathlib.Path(state_path).read_text(encoding="utf-8").splitlines():
              if not line:
                  continue
              key, sep, value = line.partition("=")
              if not sep or key in state:
                  raise SystemExit(f"invalid notarization state line: {line!r}")
              state[key] = value
          if state.get("dmg_sha256") != actual_sha:
              raise SystemExit("notarization state SHA-256 does not match the signed DMG")
          # A bounded wait that ran out exits nonzero after a successful upload.
          if state.get("submit_exit", "0") != "0" and state.get("wait_timed_out") != "true":
              raise SystemExit("notarization submit exited nonzero; refusing automatic continuation")
          submission_id = state.get("submission_id", "")
          if not submission_id or not all(character.isalnum() or character in "._-" for character in submission_id):
              raise SystemExit("notarization state has no valid Apple submission id")
          for key in ("immutable_path", "release_tag", "dmg_prefix", "variant", "channel"):
              if not state.get(key):
                  raise SystemExit(f"notarization state is missing {key}")
          # The manifest keeps the release channel for check-manifest.
          if state["channel"] != sign_channel or state["variant"] != variant or state["release_tag"] != release_tag:
              raise SystemExit("notarization state metadata does not match the build")
          if state.get("dmg_path", "").split("/")[-1] != pathlib.Path(dmg_path).name:
              raise SystemExit("notarization state points at a different DMG")
          pathlib.Path("cmux-nightly-notarization-recovery.json").write_text(
              json.dumps({
                  "schema": 1,
                  "source_run_id": "${{ github.run_id }}",
                  "source_run_attempt": "${{ github.run_attempt }}",
                  "should_publish": True,
                  "channel": channel,
                  "track": "nightly-next",
                  "variant": variant,
                  "release_tag": release_tag,
                  "build": build,
                  "head_sha": head_sha,
                  "short_sha": short_sha,
                  # The resolved build commit and its distance from the tip,
                  # which publication records (find-nightly-next-recovery.py).
                  "build_sha": head_sha,
                  "build_short_sha": short_sha,
                  "tip_sha": tip_sha,
                  "behind": behind,
                  "behind_hours": behind_hours,
                  "dmg_path": pathlib.Path(dmg_path).name,
                  "app_path": f"cmux-nightly-notarization-recovery-app/{pathlib.Path(app_path).name}",
                  "app_archive_path": "cmux-nightly-notarization-recovery-app.tar.gz",
                  "state_path": pathlib.Path(state_path).name,
                  "log_path": f"{pathlib.Path(dmg_path).name}.notarization.log",
                  "immutable_path": state["immutable_path"],
                  "dmg_prefix": state["dmg_prefix"],
                  "dmg_sha256": actual_sha,
                  "submission_id": submission_id,
              }, indent=2) + "\n",
              encoding="utf-8",
          )
          PY


      # A later run publishes this build from the recovery artifact alone, so
      # it also carries the SSH daemon assets and, when published, the source
      # archive (their own artifacts expire after 3 days).
      - name: Download the cmux-next source archive for recovery
        if: always() && steps.prepare-notarization-recovery.outcome == 'success' && vars.CMUX_NEXT_PUBLISH_SOURCE_ARCHIVE == '1'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: cmux-next-source-archive
          path: recovery-source-archive


      - name: Upload pending notarization recovery artifact
        if: always() && steps.prepare-notarization-recovery.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-${{ needs.decide.outputs.channel }}-notarization-recovery-${{ matrix.variant }}-${{ needs.resolve-nightly-cmux-tui-client.outputs.build_short_sha }}
          overwrite: true
          path: |
            ${{ env.NIGHTLY_DMG_RELEASE }}
            ${{ env.NIGHTLY_DMG_RELEASE }}.notarization.state
            ${{ env.NIGHTLY_DMG_RELEASE }}.notarization.log
            *.first.dmg
            cmux-nightly-notarization-recovery-app.tar.gz
            cmux-nightly-notarization-recovery.json
            remote-daemon-assets/cmuxd-remote-*
            recovery-source-archive/
          if-no-files-found: error
          retention-days: 14


      - name: Gate distribution with syspolicy_check
        if: needs.decide.outputs.fast_build != 'true' && needs.decide.outputs.notary_paused != 'true' && steps.notarize-nightly.outputs.submission_pending != 'true'
        run: syspolicy_check distribution "$CHANNEL_APP_PATH"


      - name: Generate Sparkle appcasts (nightly)
        if: needs.decide.outputs.fast_build != 'true' && needs.decide.outputs.notary_paused != 'true' && steps.notarize-nightly.outputs.submission_pending != 'true' && needs.decide.outputs.notary_test != 'true'
        env:
          NIGHTLY_SPARKLE_KEY: ${{ vars.NIGHTLY_SPARKLE_KEY }}
          CHANNEL: ${{ needs.decide.outputs.channel }}
          TRACK: ${{ needs.decide.outputs.track }}
          # The nightly-next track gets only its own key; the others never see it.
          SHARED_SPARKLE_PRIVATE_KEY: ${{ needs.decide.outputs.track != 'nightly-next' && secrets.SPARKLE_PRIVATE_KEY || '' }}
          NIGHTLY_SPARKLE_PRIVATE_KEY: ${{ needs.decide.outputs.track != 'nightly-next' && secrets.NIGHTLY_SPARKLE_PRIVATE_KEY || '' }}
          NEXT_SPARKLE_PRIVATE_KEY: ${{ needs.decide.outputs.track == 'nightly-next' && secrets.SPARKLE_NEXT_PRIVATE_KEY || '' }}
          # cmux-next items carry a release-ring sparkle:channel, which only
          # cmux-next builds allow; every other build ignores them. With
          # NIGHTLY_NEXT_DEV_RING=on a new build starts on Dev (cmux-next-dev)
          # and moves to Nightly (cmux-next) on a canary pass
          # (scripts/ci/nightly_next_ring.py, nightly-next-verdict.yml).
          SPARKLE_CHANNEL: ${{ needs.decide.outputs.track == 'nightly-next' && (vars.NIGHTLY_NEXT_DEV_RING == 'on' && 'cmux-next-dev' || 'cmux-next') || '' }}
        run: |
          set -euo pipefail
          SPARKLE_PRIVATE_KEY="$(./scripts/ci/nightly-sparkle-key.sh)"
          export SPARKLE_PRIVATE_KEY
          # The new item carries the bundle's macOS floor (14.0 for cmux-next since 2026-10-13),
          # so older macOS keeps the previous (legacy) items still in the feed.
          SPARKLE_MINIMUM_SYSTEM_VERSION="$(python3 scripts/ci/appcast_minimum_system_version.py floor "$CHANNEL_APP_PATH")"
          export SPARKLE_MINIMUM_SYSTEM_VERSION
          SPARKLE_DELTA_NAME_PREFIX="${CHANNEL_DMG_PREFIX}-${NIGHTLY_VARIANT}-" \
            ./scripts/sparkle_generate_appcast.sh "$NIGHTLY_DMG_IMMUTABLE" "$CHANNEL_RELEASE_TAG" "$NIGHTLY_APPCAST"
          ls -l "$NIGHTLY_DMG_IMMUTABLE" "$NIGHTLY_DMG_RELEASE" "$NIGHTLY_APPCAST"
          if grep -q 'sparkle:deltas' "$NIGHTLY_APPCAST"; then
            echo "ERROR: first publication appcasts must contain full archives only" >&2
            exit 1
          fi


      - name: Upload nightly variant artifacts
        if: needs.decide.outputs.fast_build != 'true' && needs.decide.outputs.notary_paused != 'true' && steps.notarize-nightly.outputs.submission_pending != 'true' && needs.decide.outputs.notary_test != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-nightly-variant-${{ matrix.variant }}
          path: |
            ${{ needs.decide.outputs.dmg_prefix }}-*.dmg
            ${{ needs.decide.outputs.dmg_prefix }}-*.delta
            appcast*.xml
          if-no-files-found: error
          retention-days: 3
          overwrite: true


      - name: Upload fast arm64 dogfood artifact
        if: needs.decide.outputs.fast_build == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-nightly-fast-${{ needs.resolve-nightly-cmux-tui-client.outputs.build_short_sha }}
          overwrite: true
          path: |
            ${{ needs.decide.outputs.dmg_prefix }}-arm64.dmg
            ${{ needs.decide.outputs.dmg_prefix }}-arm64-*.dmg
            remote-daemon-assets/cmuxd-remote-*
          if-no-files-found: error
          retention-days: 3


      # cx-f58x notary tests leave text receipts only: the repository is
      # public, so no app, DMG or recovery artifact of a diagnostic build or
      # of the production-identity probe is ever uploaded.
      - name: Write notary test receipt
        id: notary-receipt
        if: always() && needs.decide.outputs.notary_test == 'true' && steps.notarize-nightly.outcome != 'skipped'
        env:
          IMPORT_VARIANT: ${{ needs.decide.outputs.import_variant }}
          SWIFT_IMPORT_FLAGS: ${{ needs.decide.outputs.swift_import_flags }}
          EMPTY_BROWSER_SOURCES: ${{ needs.decide.outputs.empty_browser_sources }}
          NOTARY_PROBE: ${{ needs.decide.outputs.notary_probe }}
          NOTARIZE_OUTCOME: ${{ steps.notarize-nightly.outcome }}
        run: |
          set -uo pipefail
          out="notary-receipt"
          mkdir -p "$out"
          {
            echo "run: $GITHUB_RUN_ID attempt ${GITHUB_RUN_ATTEMPT:-1}"
            echo "commit: ${{ needs.resolve-nightly-cmux-tui-client.outputs.build_sha }}"
            echo "bundle id: $CHANNEL_BUNDLE_ID"
            echo "production probe: $NOTARY_PROBE"
            echo "import variant: $IMPORT_VARIANT"
            echo "swift flags: ${SWIFT_IMPORT_FLAGS:-none}"
            echo "empty browser-sources.json: $EMPTY_BROWSER_SOURCES"
            echo "notarize step: $NOTARIZE_OUTCOME"
            if [ -f "$NIGHTLY_DMG_RELEASE" ]; then echo "dmg sha256: $(shasum -a 256 "$NIGHTLY_DMG_RELEASE" | cut -d' ' -f1)"; fi
            if [ -f "$NIGHTLY_DMG_RELEASE.notarization.state" ]; then grep -E '^(submission_id|status)=' "$NIGHTLY_DMG_RELEASE.notarization.state" || true; fi
          } > "$out/receipt.txt"
          [ -f "$NIGHTLY_DMG_RELEASE.notarization.log" ] && cp "$NIGHTLY_DMG_RELEASE.notarization.log" "$out/notarization.log"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$CHANNEL_APP_PATH/Contents/Info.plist" > "$out/bundle-id.txt" 2>&1
          if /usr/libexec/PlistBuddy -c "Print :SUPublicEDKey" "$CHANNEL_APP_PATH/Contents/Info.plist" >/dev/null 2>&1; then
            echo "SUPublicEDKey present" > "$out/sparkle.txt"
          else
            echo "SUPublicEDKey absent (Sparkle disabled)" > "$out/sparkle.txt"
          fi
          codesign -dvv "$CHANNEL_APP_PATH" > "$out/codesign.txt" 2>&1
          xcrun stapler validate "$CHANNEL_APP_PATH" > "$out/stapler-app.txt" 2>&1
          [ -f "$NIGHTLY_DMG_RELEASE" ] && xcrun stapler validate "$NIGHTLY_DMG_RELEASE" > "$out/stapler-dmg.txt" 2>&1
          spctl -a -vv -t exec "$CHANNEL_APP_PATH" > "$out/spctl-app.txt" 2>&1
          [ -f "$NIGHTLY_DMG_RELEASE" ] && spctl -a -vv -t open --context context:primary-signature "$NIGHTLY_DMG_RELEASE" > "$out/spctl-dmg.txt" 2>&1
          syspolicy_check distribution "$CHANNEL_APP_PATH" > "$out/syspolicy-check.txt" 2>&1
          cat "$out/receipt.txt" "$out/sparkle.txt" "$out/stapler-app.txt"
          { echo "### cx-f58x notary test receipt"; echo '```'; cat "$out/receipt.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          # Receipts are text only: refuse to upload anything else.
          if find "$out" -type f ! -name '*.txt' ! -name '*.log' | grep -q .; then echo "non-text receipt file" >&2; exit 1; fi
          exit 0


      - name: Upload notary test receipt
        if: always() && steps.notary-receipt.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-notary-test-receipt-${{ needs.decide.outputs.import_variant }}-${{ needs.resolve-nightly-cmux-tui-client.outputs.build_short_sha }}
          overwrite: true
          path: notary-receipt/
          if-no-files-found: error
          retention-days: 14


      - name: Cleanup keychain
        if: always()
        run: |
          ./scripts/ci/signing-keychain.sh delete --keychain build.keychain \
            || security delete-keychain build.keychain >/dev/null 2>&1 || true
          rm -f /tmp/cert.p12

  verify-signed-nightly:
    name: Verify signed nightly app (${{ matrix.variant }})
    # No environment and no secrets: this job verifies the signed app's static
    # artifacts and sidecar (#21024). Runtime behavior is covered by the
    # path-routed daemon/app integration lane. publish-nightly publishes this
    # run's build only when both verification jobs passed.
    needs: [decide, build-nightly-app, resolve-nightly-cmux-tui-client, build-sign-notarize-nightly, pick-nightly-sign-runner, signer-dmg]
    if: "!cancelled() && (needs.build-sign-notarize-nightly.result == 'success' || needs.signer-dmg.result == 'success') && needs.decide.outputs.notary_test != 'true' && needs.decide.outputs.import_paused != 'true'"
    permissions:
      contents: read
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || needs.pick-nightly-sign-runner.outputs.attempt == github.run_attempt && needs.pick-nightly-sign-runner.outputs.owned || github.run_attempt > 1 && needs.pick-nightly-sign-runner.outputs.alternate || needs.pick-nightly-sign-runner.outputs.runner || vars.MACOS_RUNNER_26 || 'blacksmith-6vcpu-macos-26' }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.decide.outputs.variants) }}
    env:
      # Set only when the 6 h stapled-app fallback shipped the first DMG.
      STAPLED_APP_FALLBACK_ID: ${{ needs.build-sign-notarize-nightly.outputs.stapled_app_fallback_id }}
      # A pool-signed app's Computer Use helper carries its own notarization ticket.
      REQUIRE_HELPER_TICKET: ${{ needs.signer-dmg.result == 'success' }}
      # An owned Mac has the PR lane's Xcode pin (as DEV's verify); Blacksmith the macOS 26 one.
      CMUX_CI_XCODE_APP: ${{ needs.pick-nightly-sign-runner.outputs.attempt == github.run_attempt && needs.pick-nightly-sign-runner.outputs.owned != '' && vars.CMUX_CI_XCODE_APP_PR || vars.CMUX_CI_XCODE_APP_MACOS_26 }}
      CMUX_CI_REQUIRED_MACOS_SDK_MAJOR: "26"
      NIGHTLY_VARIANT: ${{ matrix.variant }}
      NIGHTLY_BUILD: ${{ needs.build-nightly-app.outputs.daemon_build }}
      BUNDLE_REMOTE_DAEMON_ASSETS: ${{ needs.decide.outputs.fast_build == 'true' || needs.decide.outputs.should_publish != 'true' }}
      CHANNEL: ${{ needs.decide.outputs.channel }}
      SIGN_CHANNEL: ${{ needs.decide.outputs.sign_channel }}
      TRACK: ${{ needs.decide.outputs.track }}
      CHANNEL_DMG_PREFIX: ${{ needs.decide.outputs.dmg_prefix }}
      CHANNEL_RELEASE_TAG: ${{ needs.decide.outputs.release_tag }}
      CHANNEL_APP_PATH: signed/${{ needs.decide.outputs.app_name }}.app
      CHANNEL_ENTITLEMENTS: ${{ needs.decide.outputs.entitlements }}
    steps:
      - name: Checkout build ref
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ needs.resolve-nightly-cmux-tui-client.outputs.build_sha }}
          submodules: false

      # nightly-next's license check reads ghostty-next/build.zig.zon.
      - name: Initialize cmux-next notices submodule
        if: github.ref_name == 'nightly-next'
        shell: bash
        run: bash scripts/ci/init-submodule.sh ghostty-next

      - name: Select Xcode
        run: ./scripts/select-ci-xcode.sh

      - name: Download signed app
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: cmux-${{ needs.decide.outputs.channel }}-signed-app-${{ matrix.variant }}-${{ needs.resolve-nightly-cmux-tui-client.outputs.build_short_sha }}
          path: signed-app-handoff

      - *download-ssh-daemon-assets-2

      - name: Restore signed app
        run: |
          set -euo pipefail
          (cd signed-app-handoff && shasum -a 256 -c cmux-signed-app.tar.gz.sha256)
          mkdir -p signed
          tar -C signed -xzf signed-app-handoff/cmux-signed-app.tar.gz
          test -d "$CHANNEL_APP_PATH"
          /usr/bin/codesign --verify --deep --strict --verbose=2 "$CHANNEL_APP_PATH"

      # cmux-next: the app's CFBundleShortVersionString and every bundled
      # CLI's `--version` say the cmux-next version (cmux-tui/Cargo.toml
      # [workspace.package]); a 0.1.0 `cmux` inside a 1.0.0 app fails here.
      - name: Verify version surfaces
        if: env.TRACK == 'nightly-next'
        run: ./scripts/cmux-next/check-version-surfaces.sh "$CHANNEL_APP_PATH"



      # sign-cmux-bundle.sh ran the static sidecar checks while the keychain
      # existed. Recheck the signed sidecar's deterministic transport contract
      # after the keychain is gone; this does not launch the app.
      - name: Verify signed diff sidecar protocol contract
        run: |
          set -euo pipefail
          ./scripts/verify-diff-sidecar-artifact.sh \
            "$CHANNEL_APP_PATH/Contents/Resources/bin/cmux-diff-sidecar" \
            --archs "$(lipo -archs "$CHANNEL_APP_PATH/Contents/MacOS/cmux")" \
            --require-signed

      # The post-sign checks of sign-cmux-bundle.sh (entitlements, helpers,
      # browser host) on this signed app whichever signer made it, and the
      # Computer Use helper's own ticket on a copy taken out of the app.
      # A build commit older than these checks has none to run.
      - name: Verify signed app entitlements and the Computer Use helper ticket
        if: hashFiles('scripts/ci/nightly-steps/verify-signed-app-checks.sh') != ''
        run: bash scripts/ci/nightly-steps/verify-signed-app-checks.sh


      - name: Run bundled Ghostty theme picker helper regression
        run: CMUX_APP_PATH="$CHANNEL_APP_PATH" ./tests/test_bundled_ghostty_theme_picker_helper.sh


      - name: Verify signed app SSH daemon contract
        run: |
          bundle_args=()
          if [[ "$BUNDLE_REMOTE_DAEMON_ASSETS" == "true" ]]; then
            bundle_args+=(--require-bundled-assets)
          fi
          # cmux-next bundles the Rust CLI (#16174), which has no classic
          # `remote-daemon-status` command, so nightly-next checks the manifest
          # and daemon bytes but skips the bundled-CLI query.
          if [[ "$CHANNEL_RELEASE_TAG" == "nightly-next" ]]; then
            echo "nightly-next: skipping --verify-cli (Rust CLI has no remote-daemon-status)"
          else
            bundle_args+=(--verify-cli)
          fi
          python3 scripts/verify_remote_daemon_release.py \
            --manifest "remote-daemon-assets/cmuxd-remote-manifest-${NIGHTLY_BUILD}.json" \
            --assets-dir remote-daemon-assets \
            --app "$CHANNEL_APP_PATH" "${bundle_args[@]}"




  verify-final-dmg-nightly:
    name: Verify final nightly DMG (${{ matrix.variant }})
    # The final-DMG half of verify-signed-nightly, on its own runner so the two
    # halves run at the same time (each statically verifies an artifact with the same bundle
    # id, so they cannot share one runner). No environment and no secrets:
    # this job statically verifies the final DMG (#21024). publish-nightly
    # publishes this run's build only when both jobs passed, and only the DMG
    # bytes this job verified.
    needs: [decide, build-nightly-app, resolve-nightly-cmux-tui-client, build-sign-notarize-nightly, pick-nightly-sign-runner, signer-dmg]
    if: "!cancelled() && (needs.build-sign-notarize-nightly.result == 'success' || needs.signer-dmg.result == 'success') && needs.decide.outputs.notary_test != 'true' && needs.decide.outputs.import_paused != 'true'"
    permissions:
      contents: read
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || needs.pick-nightly-sign-runner.outputs.attempt == github.run_attempt && needs.pick-nightly-sign-runner.outputs.owned || github.run_attempt > 1 && needs.pick-nightly-sign-runner.outputs.alternate || needs.pick-nightly-sign-runner.outputs.runner || vars.MACOS_RUNNER_26 || 'blacksmith-6vcpu-macos-26' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.decide.outputs.variants) }}
    env:
      # Set only when the 6 h stapled-app fallback shipped the first DMG.
      STAPLED_APP_FALLBACK_ID: ${{ needs.build-sign-notarize-nightly.outputs.stapled_app_fallback_id }}
      # An owned Mac has the PR lane's Xcode pin (as DEV's verify); Blacksmith the macOS 26 one.
      CMUX_CI_XCODE_APP: ${{ needs.pick-nightly-sign-runner.outputs.attempt == github.run_attempt && needs.pick-nightly-sign-runner.outputs.owned != '' && vars.CMUX_CI_XCODE_APP_PR || vars.CMUX_CI_XCODE_APP_MACOS_26 }}
      CMUX_CI_REQUIRED_MACOS_SDK_MAJOR: "26"
      NIGHTLY_VARIANT: ${{ matrix.variant }}
      SIGN_CHANNEL: ${{ needs.decide.outputs.sign_channel }}
      TRACK: ${{ needs.decide.outputs.track }}
      CHANNEL_DMG_PREFIX: ${{ needs.decide.outputs.dmg_prefix }}
    steps:
      - name: Checkout build ref
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ needs.resolve-nightly-cmux-tui-client.outputs.build_sha }}
          submodules: false

      # The static DMG verifier runs the license check, which reads
      # ghostty-next/build.zig.zon.
      - name: Initialize cmux-next notices submodule
        if: github.ref_name == 'nightly-next'
        shell: bash
        run: bash scripts/ci/init-submodule.sh ghostty-next

      - name: Select Xcode
        run: ./scripts/select-ci-xcode.sh

      # The notarize step stapled the final DMG. Verify that exact DMG and
      # record its digest without launching bundle code. A build still in Apple's
      # queue has no final DMG yet: verify-recovered-nightly-next verifies it
      # when a later run continues it.
      # A pool-signed build reads signer-dmg's one-DMG artifact: the variant artifact holds the
      # same DMG twice (the release and the immutable name), and this Mac reads it over the
      # office uplink (199 s for 481 MB in run 40728513403).
      - name: Download final DMG
        if: needs.decide.outputs.fast_build != 'true' && needs.decide.outputs.notary_paused != 'true' && needs.build-sign-notarize-nightly.outputs.notary_pending != 'true'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ${{ needs.signer-dmg.result == 'success' && format('cmux-nightly-next-signer-final-dmg-{0}', needs.resolve-nightly-cmux-tui-client.outputs.build_short_sha) || format('cmux-nightly-variant-{0}', matrix.variant) }}
          path: final-dmg

      - name: Verify final DMG artifact
        if: needs.decide.outputs.fast_build != 'true' && needs.decide.outputs.notary_paused != 'true' && needs.build-sign-notarize-nightly.outputs.notary_pending != 'true'
        env:
          POOL_SIGNED: ${{ needs.signer-dmg.result == 'success' }}
          NIGHTLY_BUILD: ${{ needs.build-nightly-app.outputs.daemon_build }}
        run: |
          set -euo pipefail
          mkdir -p tested
          : > "tested/tested-${NIGHTLY_VARIANT}.sha256"
          release="final-dmg/${CHANNEL_DMG_PREFIX}-${NIGHTLY_VARIANT}.dmg"
          [ -f "$release" ] || { echo "no final DMG for $NIGHTLY_VARIANT" >&2; exit 1; }
          # The DMG was signed and checked for the signing channel (cmux NEXT signs as next).
          stapled_flag=(--require-stapled-app)
          if [ -n "${STAPLED_APP_FALLBACK_ID:-}" ]; then
            stapled_flag=(--stapled-app-fallback "$STAPLED_APP_FALLBACK_ID")
          fi
          # signer-dmg's one-DMG artifact carries no immutable copy, which signer-dmg.sh makes with
          # cp: make it the same way. publish-nightly publishes that name only with these bytes.
          if [ "$POOL_SIGNED" = true ]; then
            immutable="final-dmg/${CHANNEL_DMG_PREFIX}-${NIGHTLY_VARIANT}-${NIGHTLY_BUILD:?}.dmg"
            [ ! -e "$immutable" ] || { echo "the one-DMG artifact holds $(basename "$immutable")" >&2; exit 1; }
            cp -c "$release" "$immutable" 2>/dev/null || cp "$release" "$immutable"
          fi
          ./scripts/ci/verify-dmg-artifact.sh "$release" "$SIGN_CHANNEL" "${stapled_flag[@]}" 3>"$RUNNER_TEMP/verified.line"
          tested="$(awk '$1 == "verified" {print $2}' "$RUNNER_TEMP/verified.line")"
          [ -n "$tested" ] || { echo "verify-dmg-artifact.sh reported no verified digest" >&2; exit 1; }
          # The immutable DMG is a copy of the release DMG: require the same bytes.
          for dmg in final-dmg/"${CHANNEL_DMG_PREFIX}"-*.dmg; do
            [ -f "$dmg" ] || continue
            actual="$(shasum -a 256 "$dmg" | awk '{print $1}')"
            [ "$actual" = "$tested" ] || { echo "$(basename "$dmg") differs from the DMG that was verified" >&2; exit 1; }
            printf '%s  %s\n' "$actual" "$(basename "$dmg")" >> "tested/tested-${NIGHTLY_VARIANT}.sha256"
          done
          cat "tested/tested-${NIGHTLY_VARIANT}.sha256"

      - name: Apple's checks of a pool-signed DMG and the app in it
        if: needs.signer-dmg.result == 'success'
        env:
          CHANNEL_APP_NAME: ${{ needs.decide.outputs.app_name }}
          NIGHTLY_BUILD: ${{ needs.build-nightly-app.outputs.daemon_build }}
        run: bash scripts/ci/nightly-steps/signer-final-dmg-checks.sh

      # Size of the app in the final DMG, by component, against
      # scripts/cmux-next/bundle-size-budget.json (plans/cmux-next/bundle-size-DESIGN.md).
      # Writes the job summary. It does not block the publish yet: a red step
      # means a cap was crossed; cut the size or raise the cap with a reason.
      - name: Bundle size budget
        if: needs.decide.outputs.fast_build != 'true' && needs.decide.outputs.notary_paused != 'true' && needs.build-sign-notarize-nightly.outputs.notary_pending != 'true' && env.TRACK == 'nightly-next' && matrix.variant == 'arm64'
        continue-on-error: true
        # It does not block the publish; a slow runner must not hold the job
        # (run 39481846284: 13 min, then the job hit its limit).
        timeout-minutes: 5
        env:
          # Chromium on demand ships no engine in the app (bundle-size-DESIGN.md 6).
          BUDGET_VARIANT: ${{ vars.CMUX_NEXT_CEF_ON_DEMAND == '1' && 'arm64-cef-on-demand' || 'arm64' }}
        run: |
          set -euo pipefail
          # The Linux checks job skips this macOS-only test of the release strip.
          /bin/bash tests/test_strip_release_bundle_atom_info.sh
          release="final-dmg/${CHANNEL_DMG_PREFIX}-${NIGHTLY_VARIANT}.dmg"
          mnt="$RUNNER_TEMP/bundle-size-mnt"
          mkdir -p "$mnt"
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$release" >/dev/null
          trap 'hdiutil detach "$mnt" -force >/dev/null 2>&1 || true' EXIT
          app="$(find "$mnt" -maxdepth 1 -name '*.app' -print -quit)"
          {
            echo '### Bundle size'
            echo '```'
            python3 -I scripts/cmux-next/bundle-size.py report "$app" --dmg "$release"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          python3 -I scripts/cmux-next/bundle-size.py check "$app" --dmg "$release" \
            --budget scripts/cmux-next/bundle-size-budget.json --variant "$BUDGET_VARIANT"

      - name: Upload tested DMG digests
        if: needs.decide.outputs.fast_build != 'true' && needs.decide.outputs.notary_paused != 'true' && needs.build-sign-notarize-nightly.outputs.notary_pending != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-nightly-tested-${{ matrix.variant }}
          overwrite: true
          path: tested/tested-${{ matrix.variant }}.sha256
          if-no-files-found: error
          retention-days: 3

  # nightly-next on the release runner pool, off unless the sign_pool input or
  # vars.CI_NIGHTLY_NEXT_SIGN_POOL turns it on: signer-app signs the app
  # (the Computer Use helper notarized and stapled first) and notarizes it,
  # signer-dmg-image runs Apple's checks and packages the DMG on a Mac (the
  # pool's one Mac job), and signer-dmg signs, notarizes and staples the DMG,
  # writes the appcast and hands them on. The verify jobs check them on a Mac
  # before publish; build-sign-notarize-nightly signs whenever signer-dmg did not pass.
  signer-build:
    needs: [decide]
    if: needs.decide.outputs.track == 'nightly-next' && (inputs.sign_pool || vars.CI_NIGHTLY_NEXT_SIGN_POOL == '1') && vars.CMUX_NEXT_CEF_ON_DEMAND != '1' && needs.decide.outputs.should_build == 'true' && (github.event_name != 'schedule' || github.event.schedule == '47 8 * * *') && needs.decide.outputs.build_only != 'true' && needs.decide.outputs.continue_only != 'true' && needs.decide.outputs.fast_build != 'true' && needs.decide.outputs.notary_paused != 'true' && needs.decide.outputs.notary_test != 'true' && needs.decide.outputs.notary_probe != 'true' && needs.decide.outputs.variants == '["arm64"]' && inputs.nightly_next_unsigned_run == ''
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || 'blacksmith-8vcpu-ubuntu-2404' }}
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      sha256: ${{ steps.build.outputs.sha256 }}
      # Named for the attempt that built it: a rerun of failed jobs keeps this job's output.
      artifact: nightly-signer-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: .publish-tooling
          sparse-checkout: scripts/ci/release-signer
      - id: cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/signer
          key: release-signer-rust-1.95.0-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.publish-tooling/scripts/ci/release-signer/build.sh', '.publish-tooling/scripts/ci/release-signer/apple-codesign-0.29.0.patch') }}
      # The runner image's rustup only; never a fetched installer script.
      - name: Set up Rust
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup toolchain install 1.95.0 --profile minimal
          dirname "$(rustup which --toolchain 1.95.0 cargo)" >> "$GITHUB_PATH"
      - name: Build the signer
        id: build
        run: |
          set -euo pipefail
          if [ -x "$RUNNER_TEMP/signer/rcodesign" ]; then echo "sha256=$(sha256sum "$RUNNER_TEMP/signer/rcodesign" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          else bash .publish-tooling/scripts/ci/release-signer/build.sh "$RUNNER_TEMP/signer" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-signer-${{ github.run_attempt }}
          path: ${{ runner.temp }}/signer/rcodesign
          if-no-files-found: error
          retention-days: 1

  signer-app:
    environment: ${{ needs.decide.outputs.environment }}
    needs: [decide, build-nightly-app, resolve-nightly-cmux-tui-client, prepare-nightly-variant, signer-build]
    if: needs.resolve-nightly-cmux-tui-client.outputs.already_published != 'true' && needs.resolve-nightly-cmux-tui-client.outputs.superseded != 'true'
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 75
    permissions:
      contents: read
      actions: read
    outputs:
      sha256: ${{ steps.pack.outputs.sha256 }}
    env:
      TOOLS: .publish-tooling
      SIGNER_WORK: ${{ github.workspace }}/signer-work
      NIGHTLY_VARIANT: arm64
      NIGHTLY_BUILD: ${{ needs.build-nightly-app.outputs.daemon_build }}
      NIGHTLY_MARKETING_VERSION: ${{ needs.build-nightly-app.outputs.daemon_version }}
      NIGHTLY_DMG_RELEASE: ${{ needs.decide.outputs.dmg_prefix }}-arm64.dmg
      NIGHTLY_DMG_IMMUTABLE: ${{ needs.decide.outputs.dmg_prefix }}-arm64-${{ needs.build-nightly-app.outputs.daemon_build }}.dmg
      BUNDLE_REMOTE_DAEMON_ASSETS: ${{ needs.decide.outputs.should_publish != 'true' }}
      CHANNEL: ${{ needs.decide.outputs.channel }}
      TRACK: ${{ needs.decide.outputs.track }}
      CHANNEL_BUNDLE_ID: ${{ needs.decide.outputs.bundle_id }}
      CHANNEL_APP_NAME: ${{ needs.decide.outputs.app_name }}
      CHANNEL_URL_SCHEME: ${{ needs.decide.outputs.url_scheme }}
      CHANNEL_RELEASE_TAG: ${{ needs.decide.outputs.release_tag }}
      CHANNEL_FEED_BASE: ${{ needs.decide.outputs.feed_base }}
      BUILD_SHORT_SHA: ${{ needs.resolve-nightly-cmux-tui-client.outputs.build_short_sha }}
    steps:
      - &signer-checkout-build
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ needs.resolve-nightly-cmux-tui-client.outputs.build_sha }}
          submodules: false
      - &signer-checkout-tools
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: .publish-tooling
          sparse-checkout: scripts
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: cmux-${{ needs.decide.outputs.channel }}-prepared-app-arm64-${{ needs.resolve-nightly-cmux-tui-client.outputs.build_short_sha }}
          path: prepared-app
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: cmux-nightly-remote-daemon
          path: remote-daemon-assets
      - &signer-install
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ${{ needs.signer-build.outputs.artifact }}
          path: ${{ runner.temp }}/signer
      - &signer-install-check
        name: Install the signer
        env:
          SIGNER_SHA256: ${{ needs.signer-build.outputs.sha256 }}
        run: bash .publish-tooling/scripts/ci/release-signer/install.sh "$RUNNER_TEMP/signer/rcodesign" "$SIGNER_SHA256" >> "$GITHUB_ENV"
      - name: Prepare the app
        id: prepare
        env:
          NEXT_SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_NEXT_PRIVATE_KEY }}
        run: bash .publish-tooling/scripts/ci/nightly-steps/signer-app-prepare.sh
      - name: Sign the app, the Computer Use helper notarized first
        env:
          CMUX_SIGN_MODE: helper-first
          CMUX_HELPER_ENTITLEMENTS: cmux-helper.entitlements
          CMUX_HELPER_NOTARY_WAIT_SECONDS: "1200"
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          ENTITLEMENTS: ${{ needs.decide.outputs.entitlements }}
        run: bash .publish-tooling/scripts/ci/release-signer/sign-app.sh "${{ steps.prepare.outputs.app }}" "$ENTITLEMENTS"
      - name: Notarize and staple the app
        id: notarize
        env:
          NOTARY_MAX_WAIT_SECONDS: "1200"
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: bash .publish-tooling/scripts/ci/release-signer/notarize-app.sh "${{ steps.prepare.outputs.app }}" "$RUNNER_TEMP/notary-app.log" >> "$GITHUB_OUTPUT"
      - name: Pack the stapled app
        id: pack
        env:
          APP_SUBMISSION: ${{ steps.notarize.outputs.submission_id }}
        run: bash .publish-tooling/scripts/ci/nightly-steps/signer-app-pack.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-nightly-next-signer-app-${{ needs.resolve-nightly-cmux-tui-client.outputs.build_short_sha }}
          path: signer-out/stapled-app.tar
          # Deflated: the tar is 794 MB stored and 323 MB compressed, and signer-dmg-image reads it
          # on an office Mac whose shared uplink moved 2.0-3.6 MB/s (222-396 s stored).
          compression-level: 6
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  signer-dmg-image:
    needs: [decide, build-nightly-app, resolve-nightly-cmux-tui-client, pick-nightly-sign-runner, signer-app]
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || needs.pick-nightly-sign-runner.outputs.attempt == github.run_attempt && needs.pick-nightly-sign-runner.outputs.owned || github.run_attempt > 1 && needs.pick-nightly-sign-runner.outputs.alternate || needs.pick-nightly-sign-runner.outputs.runner || vars.MACOS_RUNNER_26 || 'blacksmith-6vcpu-macos-26' }}
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      sha256: ${{ steps.dmg.outputs.sha256 }}
      floor: ${{ steps.dmg.outputs.floor }}
    env:
      CMUX_CI_XCODE_APP: ${{ needs.pick-nightly-sign-runner.outputs.attempt == github.run_attempt && needs.pick-nightly-sign-runner.outputs.owned != '' && vars.CMUX_CI_XCODE_APP_PR || vars.CMUX_CI_XCODE_APP_MACOS_26 }}
      CMUX_CI_REQUIRED_MACOS_SDK_MAJOR: "26"
      SIGNER_WORK: ${{ github.workspace }}/signer-work
      CHANNEL_APP_NAME: ${{ needs.decide.outputs.app_name }}
      NIGHTLY_DMG_RELEASE: ${{ needs.decide.outputs.dmg_prefix }}-arm64.dmg
    steps:
      - *signer-checkout-build
      - *signer-checkout-tools
      - name: Initialize cmux-next notices submodule
        if: github.ref_name == 'nightly-next'
        run: bash scripts/ci/init-submodule.sh ghostty-next
      - name: Select Xcode
        run: ./scripts/select-ci-xcode.sh
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22.23.4"
      - &signer-download-app
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: cmux-nightly-next-signer-app-${{ needs.resolve-nightly-cmux-tui-client.outputs.build_short_sha }}
          path: signer-app
      - name: Apple's checks of the stapled app
        env:
          APP_SHA256: ${{ needs.signer-app.outputs.sha256 }}
        run: |
          set -euo pipefail
          echo "$APP_SHA256  signer-app/stapled-app.tar" | shasum -a 256 -c -
          mkdir -p "$SIGNER_WORK" && tar -C "$SIGNER_WORK" -xf signer-app/stapled-app.tar
          bash .publish-tooling/scripts/ci/nightly-steps/signer-apple-checks.sh "$SIGNER_WORK/$CHANNEL_APP_NAME.app"
      # signer-dmg makes verify-signed-nightly's handoff from the same stapled-app.tar on Linux,
      # so this Mac uploads only the unsigned DMG over the office uplink.
      - name: The signed-app checks
        env:
          CHECK_MINOS: "true"
          PACKAGE_HANDOFF: "false"
          PACKAGE_UNNOTARIZED_ZIP: "false"
        run: |
          set -euo pipefail
          bash scripts/ci/signed-app-checks.sh start "$SIGNER_WORK/$CHANNEL_APP_NAME.app"
          bash scripts/ci/signed-app-checks.sh finish
      - name: Build the unsigned DMG
        id: dmg
        run: bash .publish-tooling/scripts/ci/nightly-steps/signer-dmg-image.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-nightly-next-signer-unsigned-dmg-${{ needs.resolve-nightly-cmux-tui-client.outputs.build_short_sha }}
          path: signer-out/${{ env.NIGHTLY_DMG_RELEASE }}
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  signer-dmg:
    environment: ${{ needs.decide.outputs.environment }}
    needs: [decide, build-nightly-app, resolve-nightly-cmux-tui-client, signer-build, signer-app, signer-dmg-image]
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      TOOLS: .publish-tooling
      SIGNER_WORK: ${{ github.workspace }}/signer-work
      NIGHTLY_VARIANT: arm64
      NIGHTLY_BUILD: ${{ needs.build-nightly-app.outputs.daemon_build }}
      NIGHTLY_MARKETING_VERSION: ${{ needs.build-nightly-app.outputs.daemon_version }}
      NIGHTLY_DMG_RELEASE: ${{ needs.decide.outputs.dmg_prefix }}-arm64.dmg
      NIGHTLY_DMG_IMMUTABLE: ${{ needs.decide.outputs.dmg_prefix }}-arm64-${{ needs.build-nightly-app.outputs.daemon_build }}.dmg
      BUNDLE_REMOTE_DAEMON_ASSETS: ${{ needs.decide.outputs.should_publish != 'true' }}
      CHANNEL: ${{ needs.decide.outputs.channel }}
      TRACK: ${{ needs.decide.outputs.track }}
      CHANNEL_BUNDLE_ID: ${{ needs.decide.outputs.bundle_id }}
      CHANNEL_APP_NAME: ${{ needs.decide.outputs.app_name }}
      CHANNEL_URL_SCHEME: ${{ needs.decide.outputs.url_scheme }}
      CHANNEL_RELEASE_TAG: ${{ needs.decide.outputs.release_tag }}
      CHANNEL_FEED_BASE: ${{ needs.decide.outputs.feed_base }}
      BUILD_SHORT_SHA: ${{ needs.resolve-nightly-cmux-tui-client.outputs.build_short_sha }}
    steps:
      - *signer-checkout-tools
      - *signer-install
      - *signer-install-check
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: cmux-nightly-next-signer-unsigned-dmg-${{ needs.resolve-nightly-cmux-tui-client.outputs.build_short_sha }}
          path: signer-out
      - *signer-download-app
      # verify-signed-nightly's handoff, gzipped from the stapled app here while the DMG waits on
      # Apple, rather than on signer-dmg-image's Mac and sent back over the office uplink.
      - name: Start packaging the stapled app for the verify job
        env:
          APP_SHA256: ${{ needs.signer-app.outputs.sha256 }}
        run: bash .publish-tooling/scripts/ci/nightly-steps/signer-handoff.sh start
      - name: Sign, notarize and staple the DMG
        env:
          UNSIGNED_SHA256: ${{ needs.signer-dmg-image.outputs.sha256 }}
          NOTARY_MAX_WAIT_SECONDS: "1200"
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: bash .publish-tooling/scripts/ci/nightly-steps/signer-dmg.sh
      - name: Write the appcast
        env:
          APP_SHA256: ${{ needs.signer-app.outputs.sha256 }}
          FLOOR: ${{ needs.signer-dmg-image.outputs.floor }}
          SPARKLE_CHANNEL: ${{ vars.NIGHTLY_NEXT_DEV_RING == 'on' && 'cmux-next-dev' || 'cmux-next' }}
          NEXT_SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_NEXT_PRIVATE_KEY }}
        run: |
          echo "$APP_SHA256  signer-app/stapled-app.tar" | sha256sum -c -
          bash .publish-tooling/scripts/ci/nightly-steps/signer-appcast.sh
      - name: Finish packaging the stapled app for the verify job
        run: bash .publish-tooling/scripts/ci/nightly-steps/signer-handoff.sh finish
      # Hand it on under the names the macOS signer job uses: the verify jobs
      # check it on a Mac before publish reads it. Never overwrite: once the
      # macOS job has uploaded (a rerun after it covered a failed pool run),
      # its verified output stands and this upload fails.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-nightly-variant-arm64
          path: |
            signer-out/${{ env.NIGHTLY_DMG_RELEASE }}
            signer-out/${{ env.NIGHTLY_DMG_IMMUTABLE }}
            signer-out/appcast-arm64.xml
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-${{ needs.decide.outputs.channel }}-signed-app-arm64-${{ needs.resolve-nightly-cmux-tui-client.outputs.build_short_sha }}
          path: signed-app-handoff/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 3
      # verify-final-dmg-nightly's read: cmux-nightly-variant-arm64 without the DMG's second copy.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-nightly-next-signer-final-dmg-${{ needs.resolve-nightly-cmux-tui-client.outputs.build_short_sha }}
          path: |
            signer-out/${{ env.NIGHTLY_DMG_RELEASE }}
            signer-out/appcast-arm64.xml
          compression-level: 0
          if-no-files-found: error
          retention-days: 1


  # nightly-next continuation. A build whose notarization wait ran out left a
  # recovery artifact (build-sign-notarize-nightly). Each later published
  # nightly-next run lists the newer pending ones, continues the newest that
  # Apple accepted, and publish-nightly publishes it when this run's own build
  # was not accepted. Like every nightly-next build it must be above every
  # build on both feeds; the release-next environment, its guard and its
  # bucket are the only publication path.
  find-nightly-next-recovery:
    needs: [decide]
    if: needs.decide.outputs.track == 'nightly-next' && needs.decide.outputs.should_publish == 'true' && needs.decide.outputs.no_publish != 'true' && needs.decide.outputs.should_build == 'true' && needs.decide.outputs.fast_build != 'true' && needs.decide.outputs.build_only != 'true' && (github.event_name != 'schedule' || github.event.schedule == '47 8 * * *')
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.CI_CLOUD_OVERFLOW_SAVED && 'blacksmith-6vcpu-macos-26' || vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 70
    permissions:
      actions: read
      contents: read
    outputs:
      sign_runner: ${{ steps.sign-runner.outputs.runner }}
      sign_alternate: ${{ steps.sign-runner.outputs.alternate }}
      found: ${{ steps.find.outputs.found }}
      candidates: ${{ steps.find.outputs.candidates }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - *wait-through-github-api-rate-l

      # The Blacksmith macOS label whose queue is moving, for the macOS jobs after this one
      # (scripts/ci/nightly_sign_runner.py). Signing stays on Blacksmith; a stale
      # vars.MACOS_RUNNER_26 naming a label with no runners no longer strands them.
      - &pick-the-blacksmith-macos-labe
        name: Pick the Blacksmith macOS label with a moving queue
        id: sign-runner
        continue-on-error: true
        timeout-minutes: 2
        env:
          SNAPSHOT_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ vars.MACOS_RUNNER_26 }}
        run: python3 scripts/ci/nightly_sign_runner.py

      - name: List newer pending nightly-next notarizations
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL_RELEASE_TAG: ${{ needs.decide.outputs.release_tag }}
          REQUIRED: ${{ vars.NIGHTLY_LEGACY_REQUIRED_COMMITS }}
        run: bash scripts/ci/nightly-steps/recover-list-newer-pending.sh

  recover-nightly-next-notarization:
    environment: ${{ needs.decide.outputs.environment }}
    needs: [decide, find-nightly-next-recovery]
    if: needs.decide.outputs.track == 'nightly-next' && needs.decide.outputs.should_publish == 'true' && needs.decide.outputs.no_publish != 'true' && needs.decide.outputs.should_build == 'true' && needs.decide.outputs.fast_build != 'true' && needs.decide.outputs.build_only != 'true' && (github.event_name != 'schedule' || github.event.schedule == '47 8 * * *') && needs.find-nightly-next-recovery.outputs.found == 'true'
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || github.run_attempt > 1 && needs.find-nightly-next-recovery.outputs.sign_alternate || needs.find-nightly-next-recovery.outputs.sign_runner || vars.MACOS_RUNNER_26 || 'blacksmith-6vcpu-macos-26' }}
    # An accepted continuation builds, signs and notarizes the DMG around the
    # stapled app (notarize-nightly-dmg.sh, CMUX_STAPLE_APP_IN_DMG): a 20m wait
    # and packaging per candidate; a failed one moves on to the next of 3.
    timeout-minutes: 150
    permissions:
      actions: read
      contents: read
    outputs:
      accepted: ${{ steps.continue.outputs.accepted }}
      stapled_app_fallback_id: ${{ steps.continue.outputs.stapled_app_fallback_id }}
      run_id: ${{ steps.continue.outputs.run_id }}
      build: ${{ steps.continue.outputs.build }}
      build_sha: ${{ steps.continue.outputs.build_sha }}
      tip_sha: ${{ steps.continue.outputs.tip_sha }}
      behind: ${{ steps.continue.outputs.behind }}
      behind_hours: ${{ steps.continue.outputs.behind_hours }}
    env:
      CMUX_CI_XCODE_APP: ${{ vars.CMUX_CI_XCODE_APP_MACOS_26 }}
      CMUX_CI_REQUIRED_MACOS_SDK_MAJOR: "26"
      CHANNEL: ${{ needs.decide.outputs.channel }}
      SIGN_CHANNEL: ${{ needs.decide.outputs.sign_channel }}
      TRACK: ${{ needs.decide.outputs.track }}
      CHANNEL_DMG_PREFIX: ${{ needs.decide.outputs.dmg_prefix }}
      CHANNEL_RELEASE_TAG: ${{ needs.decide.outputs.release_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # notarize-nightly-dmg.sh runs the bundle notice check after Apple
      # accepts, and that check reads ghostty-next/build.zig.zon. Without the
      # submodule, run 38669958906 skipped five accepted builds.
      # Release App first, github.token as the fallback (scripts/ci/gh_app_token.sh): the App is
      # its own actor, so a limit that every workflow's github.token shares does not refuse it.
      # Later jobs reuse these four steps by YAML alias (*gh-app-token-read, -write, *gh-app-install,
      # -tooling): GitHub refuses a workflow file over 512,000 bytes before any job starts.
      - &gh-app-token-read
        name: Mint the release App token for this job's gh calls
        id: gh-app-token
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.CMUX_RELEASE_APP_ID }}
          private-key: ${{ secrets.CMUX_RELEASE_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: read

      - &gh-app-install
        name: Send this job's gh calls as the release App, github.token as the fallback
        env:
          GH_APP_TOKEN: ${{ steps.gh-app-token.outputs.token }}
          GH_FALLBACK_TOKEN: ${{ github.token }}
        run: if [ -f scripts/ci/gh_app_token.sh ]; then bash scripts/ci/gh_app_token.sh --install; fi

      - *wait-through-github-api-rate-l

      - name: Initialize cmux-next notices submodule
        if: github.ref_name == 'nightly-next'
        shell: bash
        run: bash scripts/ci/init-submodule.sh ghostty-next

      # macOS /bin/bash 3.2 exits 0 on a parse error in a script with an EXIT
      # trap (runs 39014131817, 39014922771). Parse every script this job can
      # run before any signing or notarization.
      - name: Parse signing and notarize scripts with /bin/bash 3.2
        run: ./scripts/ci/check-bash32-parse.sh .github/workflows/nightly.yml

      - name: Select Xcode
        run: ./scripts/select-ci-xcode.sh

      # The DMG around the stapled app is built with the same create-dmg as
      # build-sign-notarize-nightly.
      - *set-up-node

      - name: Install create-dmg
        run: |
          CMUX_NODE_BIN="$(command -v node)"
          export npm_config_prefix="$RUNNER_TEMP/npm-global"
          mkdir -p "$npm_config_prefix"
          npm install --global "create-dmg@${CREATE_DMG_VERSION}"
          wrapper_dir="$RUNNER_TEMP/create-dmg-wrapper"
          mkdir -p "$wrapper_dir"
          cat > "$wrapper_dir/create-dmg" <<EOF
          #!/usr/bin/env bash
          exec "$CMUX_NODE_BIN" "$npm_config_prefix/lib/node_modules/create-dmg/cli.js" "\$@"
          EOF
          chmod +x "$wrapper_dir/create-dmg"
          echo "$wrapper_dir" >> "$GITHUB_PATH"

      - name: Continue the newest accepted pending notarization
        id: continue
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATES: ${{ needs.find-nightly-next-recovery.outputs.candidates }}
          REQUIRED: ${{ vars.NIGHTLY_LEGACY_REQUIRED_COMMITS }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          # notarize-nightly-dmg.sh signs the DMG around the stapled app and
          # waits 20m for it; one still queued is pending, and a later run
          # continues the same accepted candidate (no older one is published).
          CMUX_STAPLED_DMG_WAIT_TIMEOUT: 20m
          CMUX_NOTARY_PENDING_ON_TIMEOUT: "true"
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # This job holds notarization secrets, so it runs no bundle code:
          # verify-recovered-nightly-next statically verifies the continued DMG (#21024).
          CMUX_DEFER_LAUNCH_SMOKES: "true"
        run: bash scripts/ci/nightly-steps/recover-continue-pending-notarization.sh

      - name: Delete the stapled-app DMG signing keychain
        if: always()
        run: ./scripts/ci/signing-keychain.sh delete --keychain build.keychain

      - name: Generate the recovered Sparkle appcast
        if: steps.continue.outputs.accepted == 'true'
        env:
          NEXT_SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_NEXT_PRIVATE_KEY }}
          # A recovered build is new to the feed: Dev first, as in build-sign-notarize-nightly.
          SPARKLE_CHANNEL: ${{ vars.NIGHTLY_NEXT_DEV_RING == 'on' && 'cmux-next-dev' || 'cmux-next' }}
        run: bash scripts/ci/nightly-steps/recover-generate-appcast.sh

      - name: Upload the recovered variant
        if: steps.continue.outputs.accepted == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-nightly-recovered-variant-arm64
          path: recovered/
          if-no-files-found: error
          retention-days: 3

  # No environment and no secrets: verifies the DMG that
  # recover-nightly-next-notarization continued and stapled with static checks
  # deferred, and records the tested bytes; publish-nightly publishes a
  # recovered build only when this job passed, and only those bytes.
  verify-recovered-nightly-next:
    needs: [decide, recover-nightly-next-notarization, find-nightly-next-recovery]
    if: "!cancelled() && needs.recover-nightly-next-notarization.outputs.accepted == 'true'"
    permissions:
      contents: read
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || github.run_attempt > 1 && needs.find-nightly-next-recovery.outputs.sign_alternate || needs.find-nightly-next-recovery.outputs.sign_runner || vars.MACOS_RUNNER_26 || 'blacksmith-6vcpu-macos-26' }}
    timeout-minutes: 40
    env:
      # Set only when the 6 h stapled-app fallback shipped the first DMG.
      STAPLED_APP_FALLBACK_ID: ${{ needs.recover-nightly-next-notarization.outputs.stapled_app_fallback_id }}
      CMUX_CI_XCODE_APP: ${{ vars.CMUX_CI_XCODE_APP_MACOS_26 }}
      CMUX_CI_REQUIRED_MACOS_SDK_MAJOR: "26"
      SIGN_CHANNEL: ${{ needs.decide.outputs.sign_channel }}
      CHANNEL_DMG_PREFIX: ${{ needs.decide.outputs.dmg_prefix }}
    steps:
      # The same checkout the continuation used: its bundle notice check ran
      # from this workflow commit too.
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Initialize cmux-next notices submodule
        if: github.ref_name == 'nightly-next'
        shell: bash
        run: bash scripts/ci/init-submodule.sh ghostty-next

      - name: Select Xcode
        run: ./scripts/select-ci-xcode.sh

      - name: Download the recovered variant
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: cmux-nightly-recovered-variant-arm64
          path: recovered

      - name: Verify recovered DMG artifact
        run: bash scripts/ci/nightly-steps/recover-verify-dmg.sh

      - name: Upload tested DMG digests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-nightly-recovered-tested-arm64
          path: tested/tested-recovered-arm64.sha256
          if-no-files-found: error
          retention-days: 3

  publish-nightly:
    # Production secrets: GitHub releases them only to protected refs (the
    # environment's deployment branch policy: main, tags v*). The nightly-next
    # track uses `release-next`, whose policy allows only branch nightly-next.
    environment: ${{ needs.decide.outputs.environment }}
    permissions:
      contents: write
      pull-requests: read
      attestations: write
      id-token: write
    # rc/** branches share one release. Serialize its mutable aliases and feeds
    # by channel, even when workflow-level groups have different branch names.
    concurrency:
      group: release-publish-${{ needs.decide.outputs.release_tag }}
      cancel-in-progress: false
    needs: [decide, build-nightly-app, build-sign-notarize-nightly, verify-signed-nightly, verify-final-dmg-nightly, resolve-nightly-cmux-tui-client, recover-nightly-next-notarization, verify-recovered-nightly-next, signer-dmg]
    outputs:
      tag_status: ${{ steps.tag-outcome.outputs.tag_status }}
      source: ${{ steps.source.outputs.source }}
      # The published build, for publish-nightly-identity-legacy (cx-x7hwx).
      build: ${{ steps.source.outputs.build }}
      # Its commit, for keep-published-dsyms.
      build_sha: ${{ steps.source.outputs.build_sha }}
      # Another run already published the recovered build, or the final gate
      # refused (see refused): this run published nothing.
      already_published: ${{ steps.recheck.outputs.already_published == 'true' || steps.gate.outputs.refused == 'true' }}
      # The final gate refused: a recovered build failed its lineage check, or
      # this pipeline is not the nightly-next writer (NIGHTLY_NEXT_WRITER read
      # live is not mac, or is unreadable).
      refused: ${{ steps.gate.outputs.refused }}
      refusal_reason: ${{ steps.gate.outputs.refusal_reason }}
      # For publish-nightly-next-github: what to publish and the release body's parts.
      # feed_written is false when a newer build was already on the feed.
      variant_pattern: ${{ steps.source.outputs.variant_pattern }}
      tested_pattern: ${{ steps.source.outputs.tested_pattern }}
      tip_sha: ${{ steps.source.outputs.tip_sha }}
      behind: ${{ steps.source.outputs.behind }}
      behind_hours: ${{ steps.source.outputs.behind_hours }}
      downloads: ${{ steps.notes.outputs.downloads }}
      feed_written: ${{ steps.upload_next_appcasts.outputs.feed_written }}
      feed_check: ${{ steps.feedcheck.outcome }}
    if: "!cancelled() && needs.decide.result == 'success' && needs.decide.outputs.should_build == 'true' && needs.decide.outputs.fast_build != 'true' && needs.decide.outputs.build_only != 'true' && (github.event_name != 'schedule' || github.event.schedule == '47 8 * * *') && needs.resolve-nightly-cmux-tui-client.outputs.already_published != 'true' && needs.decide.outputs.no_publish != 'true' && (((needs.build-sign-notarize-nightly.result == 'success' || needs.signer-dmg.result == 'success') && needs.build-sign-notarize-nightly.outputs.notary_pending != 'true' && needs.verify-signed-nightly.result == 'success' && needs.verify-final-dmg-nightly.result == 'success') || (needs.recover-nightly-next-notarization.outputs.accepted == 'true' && needs.verify-recovered-nightly-next.result == 'success'))"
    # The release App key remains scoped to this protected environment.
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 120
    env:
      NIGHTLY_LEGACY_VARIANT: ${{ needs.decide.outputs.legacy_variant }}
      # The appcasts this track publishes (decide): one on nightly-next, four on main.
      NIGHTLY_FEEDS: ${{ needs.decide.outputs.feeds }}
      NIGHTLY_TRACK: ${{ needs.decide.outputs.track }}
      CHANNEL: ${{ needs.decide.outputs.channel }}
      TRACK: ${{ needs.decide.outputs.track }}
      CHANNEL_DMG_PREFIX: ${{ needs.decide.outputs.dmg_prefix }}
      CHANNEL_RELEASE_TAG: ${{ needs.decide.outputs.release_tag }}
      CHANNEL_FEED_BASE: ${{ needs.decide.outputs.feed_base }}
      # Publication tooling from this workflow's own commit (see the step below).
      PUBLISH_TOOLING: ${{ github.workspace }}/.publish-tooling/scripts
    steps:
      # This run's build when Apple accepted it, else an earlier nightly-next
      # build that recover-nightly-next-notarization continued; every later
      # step takes the build number and commit from here.
      - name: Select the build to publish
        id: source
        env:
          OWN_RESULT: ${{ (needs.build-sign-notarize-nightly.result == 'success' || needs.signer-dmg.result == 'success') && 'success' || needs.build-sign-notarize-nightly.result }}
          OWN_PENDING: ${{ needs.build-sign-notarize-nightly.outputs.notary_pending }}
          # verify-signed-nightly verified this run's signed artifact and
          # verify-final-dmg-nightly its final DMG.
          OWN_VERIFIED: ${{ needs.verify-signed-nightly.result }}
          OWN_DMG_VERIFIED: ${{ needs.verify-final-dmg-nightly.result }}
          RECOVERED_VERIFIED: ${{ needs.verify-recovered-nightly-next.result }}
          OWN_BUILD: ${{ needs.build-nightly-app.outputs.daemon_build }}
          OWN_BUILD_SHA: ${{ needs.resolve-nightly-cmux-tui-client.outputs.build_sha }}
          OWN_TIP_SHA: ${{ needs.resolve-nightly-cmux-tui-client.outputs.tip_sha }}
          OWN_BEHIND: ${{ needs.resolve-nightly-cmux-tui-client.outputs.behind }}
          OWN_BEHIND_HOURS: ${{ needs.resolve-nightly-cmux-tui-client.outputs.behind_hours }}
          RECOVERED: ${{ needs.recover-nightly-next-notarization.outputs.accepted }}
          RECOVERED_RUN_ID: ${{ needs.recover-nightly-next-notarization.outputs.run_id }}
          RECOVERED_BUILD: ${{ needs.recover-nightly-next-notarization.outputs.build }}
          RECOVERED_BUILD_SHA: ${{ needs.recover-nightly-next-notarization.outputs.build_sha }}
          RECOVERED_TIP_SHA: ${{ needs.recover-nightly-next-notarization.outputs.tip_sha }}
          RECOVERED_BEHIND: ${{ needs.recover-nightly-next-notarization.outputs.behind }}
          RECOVERED_BEHIND_HOURS: ${{ needs.recover-nightly-next-notarization.outputs.behind_hours }}
        run: |
          set -euo pipefail
          if [ "$OWN_RESULT" = success ] && [ "$OWN_PENDING" != true ] && [ "$OWN_VERIFIED" = success ] && [ "$OWN_DMG_VERIFIED" = success ]; then
            source=own build="$OWN_BUILD" build_sha="$OWN_BUILD_SHA" tip_sha="$OWN_TIP_SHA"
            behind="$OWN_BEHIND" behind_hours="$OWN_BEHIND_HOURS" pattern="cmux-nightly-variant-*"
            tested_pattern="cmux-nightly-tested-*"
          elif [ "$RECOVERED" = true ] && [ "$RECOVERED_VERIFIED" = success ]; then
            source=recovered build="$RECOVERED_BUILD" build_sha="$RECOVERED_BUILD_SHA" tip_sha="$RECOVERED_TIP_SHA"
            behind="$RECOVERED_BEHIND" behind_hours="$RECOVERED_BEHIND_HOURS" pattern="cmux-nightly-recovered-variant-*"
            tested_pattern="cmux-nightly-recovered-tested-*"
            echo "::notice title=Publishing an earlier nightly-next build::this run's build was not accepted in time; publishing build $build from run $RECOVERED_RUN_ID"
          else
            echo "nothing accepted to publish" >&2
            exit 1
          fi
          [[ "$build" =~ ^[0-9]+$ && "$build_sha" =~ ^[0-9a-f]{40}$ ]] || { echo "invalid build $build at $build_sha" >&2; exit 1; }
          {
            echo "source=$source"
            echo "build=$build"
            echo "build_sha=$build_sha"
            echo "build_short_sha=${build_sha:0:7}"
            echo "tip_sha=$tip_sha"
            echo "behind=$behind"
            echo "behind_hours=$behind_hours"
            echo "variant_pattern=$pattern"
            echo "tested_pattern=$tested_pattern"
          } >> "$GITHUB_OUTPUT"
          echo "NIGHTLY_BUILD=$build" >> "$GITHUB_ENV"

      - name: Checkout publish ref
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ steps.source.outputs.build_sha }}

      # The steps below pass this workflow's arguments, so the publication
      # tooling must come from the workflow's own commit, not from the
      # published build's checkout. A recovered build can be days older: run
      # 38855116561 recovered 0664bd9847b5, whose nightly_version.py predates
      # --already-published-ok (#20986), and the recheck failed. Scripts that
      # read the build's own source tree still run from the publish ref:
      # verify_remote_daemon_release.py, fetch-release-notes-span.sh,
      # release-notes.py, check_ghostty_vt_notices.py, ghostty_source_archive.py.
      - &checkout-publication-tooling-a
        name: Checkout publication tooling at the workflow commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: .publish-tooling
          sparse-checkout: scripts

      # Release App first, github.token as the fallback (scripts/ci/gh_app_token.sh): the App is
      # its own actor, so a limit that every workflow's github.token shares does not refuse it.
      - &gh-app-token-write
        name: Mint the release App token for this job's gh calls
        id: gh-app-token
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.CMUX_RELEASE_APP_ID }}
          private-key: ${{ secrets.CMUX_RELEASE_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - &gh-app-install-tooling
        name: Send this job's gh calls as the release App, github.token as the fallback
        env:
          GH_APP_TOKEN: ${{ steps.gh-app-token.outputs.token }}
          GH_FALLBACK_TOKEN: ${{ github.token }}
        run: if [ -f .publish-tooling/scripts/ci/gh_app_token.sh ]; then bash .publish-tooling/scripts/ci/gh_app_token.sh --install; fi

      - &wait-through-github-api-rate-l-2
        name: Wait through GitHub API rate limits in this job's gh calls
        # scripts/ci/gh_budget_wait.sh puts a gh first on PATH that waits for the shared budget's
        # reset (at most an hour per job, each wait logged) when a call is refused for the rate
        # limit, instead of failing the publish path. timeout-minutes leaves room for that hour.
        run: if [ -f .publish-tooling/scripts/ci/gh_budget_wait.sh ]; then bash .publish-tooling/scripts/ci/gh_budget_wait.sh --install; fi

      - name: Download nightly variant artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: ${{ steps.source.outputs.variant_pattern }}
          path: nightly-out
          merge-multiple: true

      # Publish only the bytes that a job without secrets verified:
      # verify-final-dmg-nightly for this run's build, verify-recovered-nightly-next
      # for a continued one.
      - name: Download verified DMG digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: ${{ steps.source.outputs.tested_pattern }}
          path: tested
          merge-multiple: true

      - name: Require every DMG to match a tested digest
        run: bash .publish-tooling/scripts/ci/nightly-steps/publish-require-tested-digest.sh

      - name: Download SSH daemon assets for publication
        if: steps.source.outputs.source == 'own'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: cmux-nightly-remote-daemon
          path: nightly-out

      # Inside the publication lock: a run that published meanwhile may have
      # moved a feed above either this run's own nightly-next build or a
      # recovered build. The early check precedes signing and notarization.
      # Two runs can take the same recovered build; the later one finds it
      # already on the feed and publishes nothing (run 38689026338). A build
      # below any feed still fails.
      - name: Recheck the recovered build against both feeds
        id: recheck
        if: needs.decide.outputs.track == 'nightly-next' || steps.source.outputs.source == 'recovered'
        run: bash .publish-tooling/scripts/ci/nightly-steps/publish-recheck-recovered.sh

      - name: Verify SSH daemon assets survived artifact transfer
        if: steps.recheck.outputs.already_published != 'true'
        run: |
          python3 scripts/verify_remote_daemon_release.py \
            --manifest "nightly-out/cmuxd-remote-manifest-${NIGHTLY_BUILD}.json" \
            --assets-dir nightly-out

      - name: Assemble legacy nightly names
        if: steps.recheck.outputs.already_published != 'true'
        run: bash .publish-tooling/scripts/ci/nightly-steps/publish-assemble-legacy-names.sh

      - name: Prepare nightly release notes and appcast summaries
        id: notes
        if: needs.decide.outputs.should_publish == 'true' && steps.recheck.outputs.already_published != 'true'
        # The notes take seconds. Bounded here, a slow notes run fails before
        # any asset upload instead of using up the job's time and being
        # cancelled mid-upload (run 37611677848 left partial assets that way).
        # 60 of these minutes are the most its gh calls may wait for a rate-limit
        # reset (gh_budget_wait.sh); the job's timeout leaves 20 after them.
        timeout-minutes: 70
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES_HEAD: ${{ steps.source.outputs.build_sha }}
          PUBLISHED_SHA: ${{ needs.decide.outputs.published_sha }}
          # nightly-next runs are pushes to nightly-next; their PRs merge into feat-cmux-next.
          NOTES_BRANCH: ${{ needs.decide.outputs.track == 'nightly-next' && 'feat-cmux-next' || github.ref_name }}
          NOTES_APP_NAME: ${{ needs.decide.outputs.app_name }}
          NOTES_BUNDLE_ID: ${{ needs.decide.outputs.bundle_id }}
        run: bash .publish-tooling/scripts/ci/nightly-steps/publish-prepare-release-notes.sh

      - name: Upload branch nightly artifacts
        if: needs.decide.outputs.should_publish != 'true' && steps.recheck.outputs.already_published != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-nightly-${{ steps.source.outputs.build_short_sha }}
          overwrite: true
          path: |
            nightly-out/${{ needs.decide.outputs.dmg_prefix }}*.dmg
            nightly-out/${{ needs.decide.outputs.dmg_prefix }}*.delta
            nightly-out/appcast*.xml
            nightly-out/cmuxd-remote-*
          if-no-files-found: error

      # Before anything is published: every cmux-next appcast names only
      # nightly-next downloads and the cmux-next Sparkle channel.
      - name: Guard nightly-next publication
        if: needs.decide.outputs.should_publish == 'true' && needs.decide.outputs.track == 'nightly-next' && steps.recheck.outputs.already_published != 'true'
        run: bash .publish-tooling/scripts/ci/nightly-steps/publish-guard-nightly-next.sh

      # cx-f76kf: decide reads NIGHTLY_NEXT_WRITER only when the run starts, and
      # the HQ Linux pipeline publishes nightly-next while it is linux, so the
      # gate reads it again live. vars.* is fixed at run start and GITHUB_TOKEN
      # cannot read variables: the release App reads it (Variables: read).
      # A failed mint leaves the token empty, and the gate refuses.
      - name: Mint release App token
        id: writer-token
        if: needs.decide.outputs.should_publish == 'true' && needs.decide.outputs.track == 'nightly-next' && steps.recheck.outputs.already_published != 'true'
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.CMUX_RELEASE_APP_ID }}
          private-key: ${{ secrets.CMUX_RELEASE_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      # Last check before the first write to the release or the feed. On
      # nightly-next, NIGHTLY_NEXT_WRITER read live must be mac or unset: none
      # and linux stand down; anything else, empty or unreadable refuses. A
      # recovered build is checked again against the live feed: it must
      # contain NIGHTLY_LEGACY_REQUIRED_COMMITS and descend
      # from the commit the NEXT feed serves. A refusal publishes nothing and
      # is not a failure.
      # NIGHTLY_NEXT_DEV_RING read live with the same token (vars.* is the run's start-time
      # snapshot, and a re-run keeps it): scripts/ci/nightly_next_dev_ring.sh.
      - name: Read the Dev ring switch live
        id: ring
        if: needs.decide.outputs.should_publish == 'true' && needs.decide.outputs.track == 'nightly-next' && steps.recheck.outputs.already_published != 'true'
        env:
          RING_TOKEN: ${{ steps.writer-token.outputs.token }}
        run: bash .publish-tooling/scripts/ci/nightly_next_dev_ring.sh --github-output "$GITHUB_OUTPUT"

      - name: Final publication gate
        id: gate
        if: needs.decide.outputs.should_publish == 'true' && steps.recheck.outputs.already_published != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          WRITER_TOKEN: ${{ steps.writer-token.outputs.token }}
          REQUIRED: ${{ vars.NIGHTLY_LEGACY_REQUIRED_COMMITS }}
          SOURCE: ${{ steps.source.outputs.source }}
          BUILD_SHA: ${{ steps.source.outputs.build_sha }}
        run: bash .publish-tooling/scripts/ci/nightly-steps/publish-final-gate.sh

      - name: Prune old nightly release assets
        if: needs.decide.outputs.should_publish == 'true' && steps.recheck.outputs.already_published != 'true' && steps.gate.outputs.refused != 'true' && needs.decide.outputs.track != 'nightly-next'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_APP_TOKEN: ${{ steps.gh-app-token.outputs.token }} # App first, GH_TOKEN as fallback
        run: bash .publish-tooling/scripts/ci/nightly-steps/publish-prune-old-assets.sh

      - name: Publish nightly release assets
        id: publish_assets
        if: needs.decide.outputs.should_publish == 'true' && steps.recheck.outputs.already_published != 'true' && steps.gate.outputs.refused != 'true' && needs.decide.outputs.track != 'nightly-next'
        env:
          GH_TOKEN: ${{ github.token }}
          # A refused upload backs off within 30 minutes (publish-release-assets.py), not 10:
          # run 40298250989's built nightly was lost to 10 minutes of refusals (2026-10-26).
          # Every wait in this job (notes, assets, archive, gh) shares one hour
          # (GH_BUDGET_WAIT_MAX_SECONDS), so the job's 120 minutes keep 60 for the work.
          CMUX_RELEASE_RATE_LIMIT_SECONDS: "1800"
          GH_APP_TOKEN: ${{ steps.gh-app-token.outputs.token }} # the uploader: App first, GH_TOKEN as fallback
        run: bash .publish-tooling/scripts/ci/nightly-steps/publish-release-assets.sh

      - name: Mint release tag app token
        id: release-tag-token
        if: needs.decide.outputs.should_publish == 'true' && steps.recheck.outputs.already_published != 'true' && steps.gate.outputs.refused != 'true' && needs.decide.outputs.track != 'nightly-next'
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          # The release App (Contents + Workflows write only); its id and key
          # live only in the release and release-next environments.
          app-id: ${{ secrets.CMUX_RELEASE_APP_ID }}
          private-key: ${{ secrets.CMUX_RELEASE_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-workflows: write

      # nightly-next commits change .github/workflows relative to main, and
      # GitHub refuses the Actions token any release create/update that targets
      # such a commit. nightly-next therefore publishes its release metadata
      # with the release App token; other channels keep the Actions token.
      - name: Publish verified nightly release metadata
        id: publish_metadata
        if: needs.decide.outputs.should_publish == 'true' && steps.recheck.outputs.already_published != 'true' && steps.gate.outputs.refused != 'true' && needs.decide.outputs.track != 'nightly-next'
        env:
          GH_TOKEN: ${{ needs.decide.outputs.track == 'nightly-next' && steps.release-tag-token.outputs.token || github.token }}
          GH_APP_TOKEN: ${{ needs.decide.outputs.track != 'nightly-next' && steps.gh-app-token.outputs.token || '' }} # App first, GH_TOKEN as fallback
          RELEASE_ID: ${{ steps.publish_assets.outputs.release_id }}
          UPLOADED_ASSETS: ${{ steps.publish_assets.outputs.asset_names }}
          RELEASE_TAG: ${{ needs.decide.outputs.release_tag }}
          RELEASE_NAME: ${{ needs.decide.outputs.release_name }}
          BUILD_SHA: ${{ steps.source.outputs.build_sha }}
          BUILD_SHORT_SHA: ${{ steps.source.outputs.build_short_sha }}
          CHANNEL: ${{ needs.decide.outputs.channel }}
          REF_NAME: ${{ github.ref_name }}
          TIP_SHA: ${{ steps.source.outputs.tip_sha }}
          BEHIND: ${{ steps.source.outputs.behind }}
          BEHIND_HOURS: ${{ steps.source.outputs.behind_hours }}
          DOWNLOADS: ${{ steps.notes.outputs.downloads }}
        run: bash .publish-tooling/scripts/ci/nightly-steps/publish-release-metadata.sh

      - name: Upload nightly appcasts to R2
        id: upload_appcasts
        if: needs.decide.outputs.should_publish == 'true' && needs.decide.outputs.track != 'nightly-next' && steps.recheck.outputs.already_published != 'true' && steps.gate.outputs.refused != 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: "https://${{ secrets.CF_R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
        run: bash .publish-tooling/scripts/ci/nightly-steps/publish-upload-appcasts.sh

      # cmux NEXT's critical path (Leo, 2026-10-26: "how are we even spending more than one
      # minute on uploads?"): the DMG goes to the feed's own R2 base and the feed names it
      # there, so the feed never waits on GitHub. The release upload spent 13-18 minutes in
      # secondary rate-limit backoff (runs 40357982361, 40376320918). The GitHub release copy,
      # its aliases, metadata and tag follow in publish-nightly-next-github, which never holds
      # the feed. Same bytes, so the item's EdDSA signature is unchanged.
      - name: Keep the live feed's newest Nightly item beside the new build
        if: needs.decide.outputs.should_publish == 'true' && needs.decide.outputs.track == 'nightly-next' && steps.recheck.outputs.already_published != 'true' && steps.gate.outputs.refused != 'true'
        env:
          DEV_RING: ${{ steps.ring.outputs.mode || 'off' }}
        run: |
          read -r -a feeds <<<"$NIGHTLY_FEEDS"
          bash .publish-tooling/scripts/ci/nightly-steps/publish-next-feed-keep-nightly.sh "${feeds[@]/#/nightly-out/}"

      - name: Tag the new build's items from the live Dev ring switch
        if: needs.decide.outputs.should_publish == 'true' && needs.decide.outputs.track == 'nightly-next' && steps.recheck.outputs.already_published != 'true' && steps.gate.outputs.refused != 'true'
        env:
          DEV_RING: ${{ steps.ring.outputs.mode || 'off' }}
        run: bash .publish-tooling/scripts/ci/nightly-steps/publish-next-feed-retag.sh

      - name: Publish the nightly-next download to R2
        id: next_downloads
        if: needs.decide.outputs.should_publish == 'true' && needs.decide.outputs.track == 'nightly-next' && steps.recheck.outputs.already_published != 'true' && steps.gate.outputs.refused != 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.NIGHTLY_NEXT_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.NIGHTLY_NEXT_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: "https://${{ secrets.NIGHTLY_NEXT_R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
        run: bash .publish-tooling/scripts/ci/nightly-steps/publish-next-download.sh

      # What publish-nightly-next-github publishes to the release: the feed as it went
      # live and the release body's PR list.
      - name: Hand the published feed to the GitHub release job
        if: needs.decide.outputs.should_publish == 'true' && needs.decide.outputs.track == 'nightly-next' && steps.recheck.outputs.already_published != 'true' && steps.gate.outputs.refused != 'true'
        run: bash .publish-tooling/scripts/ci/nightly-steps/publish-next-hand-feed.sh

      - name: Upload the published feed for the GitHub release job
        if: needs.decide.outputs.should_publish == 'true' && needs.decide.outputs.track == 'nightly-next' && steps.recheck.outputs.already_published != 'true' && steps.gate.outputs.refused != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-next-github-${{ github.run_id }}-${{ github.run_attempt }}
          path: next-github/*
          if-no-files-found: error
          retention-days: 1

      # The nightly-next track writes only its own bucket prefix with its own
      # scoped token (release-next secrets), after the guard has checked every
      # appcast enclosure and object key. It never receives CF_R2_* .
      # Chromium on demand: the pack the app's pin names goes up before the
      # appcast that offers the app. A recovered build from another run has no
      # pack artifact here, so this fails and nothing is offered.
      - name: Download the Chromium runtime pack
        if: needs.decide.outputs.should_publish == 'true' && needs.decide.outputs.track == 'nightly-next' && vars.CMUX_NEXT_CEF_ON_DEMAND == '1' && steps.recheck.outputs.already_published != 'true' && steps.gate.outputs.refused != 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cef-runtime-pack
          path: cef-runtime

      - name: Publish the Chromium runtime pack
        if: needs.decide.outputs.should_publish == 'true' && needs.decide.outputs.track == 'nightly-next' && vars.CMUX_NEXT_CEF_ON_DEMAND == '1' && steps.recheck.outputs.already_published != 'true' && steps.gate.outputs.refused != 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.NIGHTLY_NEXT_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.NIGHTLY_NEXT_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: "https://${{ secrets.NIGHTLY_NEXT_R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
        run: bash "$PUBLISH_TOOLING/cmux-next/publish-cef-runtime.sh" cef-runtime

      - name: Read the live nightly-next feed before the write
        if: needs.decide.outputs.should_publish == 'true' && needs.decide.outputs.track == 'nightly-next' && steps.recheck.outputs.already_published != 'true' && steps.gate.outputs.refused != 'true'
        run: bash .publish-tooling/scripts/ci/nightly-steps/publish-next-feed-before.sh

      - name: Upload nightly-next appcasts to R2
        id: upload_next_appcasts
        if: needs.decide.outputs.should_publish == 'true' && needs.decide.outputs.track == 'nightly-next' && steps.recheck.outputs.already_published != 'true' && steps.gate.outputs.refused != 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.NIGHTLY_NEXT_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.NIGHTLY_NEXT_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: "https://${{ secrets.NIGHTLY_NEXT_R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
          RELEASE_POKE_URL: https://presence.cmux.dev/releases/v1/poke?feed=nightly-next
        run: bash .publish-tooling/scripts/ci/nightly-steps/publish-upload-next-appcasts.sh

      # The marker is written only after immutable assets, aliases, release
      # metadata, and every appcast have succeeded. A rerun can therefore use
      # it as an idempotency record without mistaking a partial publication for
      # a complete one.
      - name: Record verified nightly publication
        if: needs.decide.outputs.should_publish == 'true' && steps.recheck.outputs.already_published != 'true' && steps.gate.outputs.refused != 'true' && needs.decide.outputs.track != 'nightly-next'
        env:
          GH_TOKEN: ${{ needs.decide.outputs.track == 'nightly-next' && steps.release-tag-token.outputs.token || github.token }}
          GH_APP_TOKEN: ${{ needs.decide.outputs.track != 'nightly-next' && steps.gh-app-token.outputs.token || '' }} # App first, GH_TOKEN as fallback
          RELEASE_ID: ${{ steps.publish_assets.outputs.release_id }}
          UPLOADED_ASSETS: ${{ steps.publish_assets.outputs.asset_names }}
          RELEASE_TAG: ${{ needs.decide.outputs.release_tag }}
          RELEASE_NAME: ${{ needs.decide.outputs.release_name }}
          BUILD_SHA: ${{ steps.source.outputs.build_sha }}
          BUILD_SHORT_SHA: ${{ steps.source.outputs.build_short_sha }}
          CHANNEL: ${{ needs.decide.outputs.channel }}
          REF_NAME: ${{ github.ref_name }}
          TIP_SHA: ${{ steps.source.outputs.tip_sha }}
          BEHIND: ${{ steps.source.outputs.behind }}
          BEHIND_HOURS: ${{ steps.source.outputs.behind_hours }}
          DOWNLOADS: ${{ steps.notes.outputs.downloads }}
        run: bash .publish-tooling/scripts/ci/nightly-steps/publish-record-verified.sh

      # The channel's release tag is the fast completion marker used by the
      # decide job. Move it to the fixed candidate selected at dispatch only
      # after every publication step succeeds. A newer commit becomes the next
      # run's candidate. The tag is deliberately the only operation using the
      # elevated app token on classic channels (nightly-next also needs it for
      # release metadata, see above); assets and feeds use the Actions token and
      # remain the publication record if this marker is stale.
      - name: Move channel release tag to built commit
        id: move-channel-release-tag
        if: needs.decide.outputs.should_publish == 'true' && steps.recheck.outputs.already_published != 'true' && steps.gate.outputs.refused != 'true' && needs.decide.outputs.track != 'nightly-next'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.release-tag-token.outputs.token }}
          GITHUB_TOKEN: ''
        run: |
          set -euo pipefail
          # Every rc/** branch shares the rc tag and those branches diverge,
          # so only the nightly tag requires a fast-forward. nightly-next may
          # move from a baseline build (see promote-nightly-next on main). The helper retries
          # only transient API/network failures and reads the ref back before
          # declaring the marker updated. Permission failures are terminal.
          python3 "$PUBLISH_TOOLING/ci/update-release-tag.py" \
            --repo "$GITHUB_REPOSITORY" \
            --tag "$CHANNEL_RELEASE_TAG" \
            --sha "${{ steps.source.outputs.build_sha }}" \
            ${{ needs.decide.outputs.release_tag != 'nightly' && '--allow-non-descendant' || '' }}

      - name: Record nightly publication marker outcome
        id: tag-outcome
        if: always() && needs.decide.outputs.should_publish == 'true' && steps.recheck.outputs.already_published != 'true' && steps.gate.outputs.refused != 'true'
        env:
          # nightly-next: the feed on R2 is the publication; publish-nightly-next-github
          # moves the tag afterwards, off the feed's path.
          TAG_MOVE_OUTCOME: ${{ needs.decide.outputs.track == 'nightly-next' && steps.upload_next_appcasts.outcome || steps.move-channel-release-tag.outcome }}
          ASSETS_OUTCOME: ${{ steps.publish_assets.outcome }}
          METADATA_OUTCOME: ${{ steps.publish_metadata.outcome }}
          APPCASTS_OUTCOME: ${{ steps.upload_appcasts.outcome }}
          NEXT_APPCASTS_OUTCOME: ${{ steps.upload_next_appcasts.outcome }}
          CHANNEL_RELEASE_TAG: ${{ needs.decide.outputs.release_tag }}
          HEAD_SHA: ${{ steps.source.outputs.build_sha }}
        run: |
          set -euo pipefail
          if [ "$TAG_MOVE_OUTCOME" = "success" ] && [ "$CHANNEL_RELEASE_TAG" = nightly-next ]; then
            echo "tag_status=updated" >> "$GITHUB_OUTPUT"
            {
              echo "### Feed updated"
              echo ""
              echo "\`$CHANNEL_FEED_BASE\` serves \`$HEAD_SHA\` from R2; publish-nightly-next-github copies it to the release and moves the tag."
            } >> "$GITHUB_STEP_SUMMARY"
          elif [ "$TAG_MOVE_OUTCOME" = "success" ]; then
            echo "tag_status=updated" >> "$GITHUB_OUTPUT"
            {
              echo "### Channel release tag updated"
              echo ""
              echo "\`$CHANNEL_RELEASE_TAG\` now points to \`$HEAD_SHA\`."
            } >> "$GITHUB_STEP_SUMMARY"
          elif [ "$TAG_MOVE_OUTCOME" != "failure" ]; then
            # The tag move runs only after every publication step succeeded, so
            # a skipped or cancelled move means the publication itself stopped
            # (run 40076543798 said "are live" when no asset had uploaded).
            # Name what each part did instead of claiming any of it is live.
            appcasts="$APPCASTS_OUTCOME"
            if [ -z "$appcasts" ] || [ "$appcasts" = "skipped" ]; then
              appcasts="$NEXT_APPCASTS_OUTCOME"
            fi
            case "$appcasts" in
              success) appcast_state="updated" ;;
              skipped|"") appcast_state="not uploaded, still serving the previous build" ;;
              *) appcast_state="$appcasts, may be partly updated" ;;
            esac
            parts="release assets: ${ASSETS_OUTCOME:-not run}; release metadata: ${METADATA_OUTCOME:-not run}; appcasts: $appcast_state; $CHANNEL_RELEASE_TAG tag: not moved"
            if [ "$ASSETS_OUTCOME" != "success" ] && [ "${METADATA_OUTCOME:-skipped}" = "skipped" ] && [ "$appcast_state" = "not uploaded, still serving the previous build" ]; then
              headline="Nothing is live for $HEAD_SHA"
            else
              headline="Publication of $HEAD_SHA did not complete"
            fi
            echo "tag_status=unpublished" >> "$GITHUB_OUTPUT"
            echo "::warning::$headline ($parts). See the first failed step above."
            {
              echo "### Not published"
              echo ""
              echo "$headline ($parts)."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "tag_status=stale" >> "$GITHUB_OUTPUT"
            echo "::warning::Published assets, release metadata, and appcasts are live; the $CHANNEL_RELEASE_TAG tag marker is stale because its final update failed."
            {
              echo "### Published, tag marker stale"
              echo ""
              echo "Assets, release metadata, and appcasts for \`$HEAD_SHA\` are published, but \`$CHANNEL_RELEASE_TAG\` was not advanced. The next eligible publication will retry the marker without republishing this commit."
            } >> "$GITHUB_STEP_SUMMARY"
          fi


      # Never fails the job (later jobs need it); report-nightly-failure reads feed_check.
      - name: Read the live nightly-next feed back
        id: feedcheck
        if: always() && steps.recheck.outputs.already_published != 'true' && steps.upload_next_appcasts.outcome == 'success'
        continue-on-error: true
        env:
          DEV_RING: ${{ steps.ring.outputs.mode || 'off' }}
        run: bash .publish-tooling/scripts/ci/nightly-steps/publish-next-feed-readback.sh

  # cmux NEXT's GitHub release copy, after the feed went live from R2 (publish-nightly), in two
  # jobs nothing waits on. This one uploads the build's immutable assets: no concurrency group,
  # so no run's uploads are ever replaced, and they may wait out GitHub's rate limits as long as
  # they need. publish-nightly-next-github-names then writes the mutable state.
  publish-nightly-next-github:
    needs: [decide, resolve-nightly-cmux-tui-client, publish-nightly]
    if: "!cancelled() && needs.decide.outputs.track == 'nightly-next' && needs.publish-nightly.result == 'success' && needs.publish-nightly.outputs.already_published != 'true' && needs.publish-nightly.outputs.refused != 'true' && needs.publish-nightly.outputs.tag_status == 'updated'"
    # Nothing on the feed's path needs this job, so a failure shows red and holds nothing.
    environment: ${{ needs.decide.outputs.environment }}
    permissions:
      contents: write
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 150
    outputs:
      release_id: ${{ steps.publish_assets.outputs.release_id }}
      asset_names: ${{ steps.publish_assets.outputs.asset_names }}
      newest: ${{ steps.order.outputs.newest }}
    env:
      NIGHTLY_FEEDS: ${{ needs.decide.outputs.feeds }}
      CHANNEL: ${{ needs.decide.outputs.channel }}
      CHANNEL_DMG_PREFIX: ${{ needs.decide.outputs.dmg_prefix }}
      CHANNEL_RELEASE_TAG: ${{ needs.decide.outputs.release_tag }}
      NIGHTLY_BUILD: ${{ needs.publish-nightly.outputs.build }}
      PUBLISH_TOOLING: ${{ github.workspace }}/.publish-tooling/scripts
    steps:
      - name: Checkout publish ref
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ needs.publish-nightly.outputs.build_sha }}

      - *checkout-publication-tooling-a

      - *gh-app-token-write

      - *gh-app-install-tooling

      - &wait-through-github-api-rate-l-3
        name: Wait through GitHub API rate limits in this job's gh calls
        run: bash .publish-tooling/scripts/ci/gh_budget_wait.sh --install

      - &download-nightly-variant-artif
        name: Download nightly variant artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: ${{ needs.publish-nightly.outputs.variant_pattern }}
          path: nightly-out
          merge-multiple: true

      - name: Download verified DMG digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: ${{ needs.publish-nightly.outputs.tested_pattern }}
          path: tested
          merge-multiple: true

      - name: Download SSH daemon assets for publication
        if: needs.publish-nightly.outputs.source == 'own'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: cmux-nightly-remote-daemon
          path: nightly-out

      - &download-the-published-feed
        name: Download the published feed
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: nightly-next-github-${{ github.run_id }}-${{ github.run_attempt }}
          path: next-github

      # The bytes publish-nightly checked and put on R2: the tested digest again, then the
      # feed exactly as it went live.
      - name: Require the DMG to match a tested digest
        run: |
          set -euo pipefail
          dmg="nightly-out/${CHANNEL_DMG_PREFIX}-arm64-${NIGHTLY_BUILD}.dmg"
          actual="$(shasum -a 256 "$dmg" | awk '{print $1}')"
          cat tested/*.sha256 | grep -Fxq "$actual  $(basename "$dmg")" || { echo "$dmg ($actual) is not the tested DMG" >&2; exit 1; }
          for feed in $NIGHTLY_FEEDS; do cp "next-github/$feed" "nightly-out/$feed"; done
          if [ -f next-github/nightly-prs.md ]; then cp next-github/nightly-prs.md "$RUNNER_TEMP/nightly-prs.md"; fi

      - name: Prune old nightly release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_APP_TOKEN: ${{ steps.gh-app-token.outputs.token }} # App first, GH_TOKEN as fallback
        run: |
          set -euo pipefail
          python3 "$PUBLISH_TOOLING/prune_nightly_release_assets.py" \
            --repo manaflow-ai/cmux \
            --release-tag "$CHANNEL_RELEASE_TAG" \
            --name-prefix "${CHANNEL_DMG_PREFIX}-" \
            --keep-builds 100 \
            --max-assets 950 \
            --best-effort \
            --execute

      - name: Publish nightly-next release assets
        id: publish_assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_APP_TOKEN: ${{ steps.gh-app-token.outputs.token }} # App first, GH_TOKEN as fallback
          # Off the feed's path: this job may wait out the limit as long as its timeout allows.
          CMUX_RELEASE_RATE_LIMIT_SECONDS: "3600"
        run: |
          set -euo pipefail
          args=(--immutable "nightly-out/${CHANNEL_DMG_PREFIX}-arm64-${NIGHTLY_BUILD}.dmg")
          for daemon in linux-arm64 linux-amd64 darwin-arm64 darwin-amd64; do
            args+=(--immutable "nightly-out/cmuxd-remote-${daemon}-${NIGHTLY_BUILD}")
          done
          args+=(--immutable "nightly-out/cmuxd-remote-checksums-${NIGHTLY_BUILD}.txt")
          args+=(--immutable "nightly-out/cmuxd-remote-manifest-${NIGHTLY_BUILD}.json")
          args+=(--immutable "nightly-out/cmuxd-remote-THIRD_PARTY_LICENSES-${NIGHTLY_BUILD}.txt")
          python3 "$PUBLISH_TOOLING/ci/publish-release-assets.py" \
            --repo "$GITHUB_REPOSITORY" --tag "$CHANNEL_RELEASE_TAG" \
            --github-output "$GITHUB_OUTPUT" "${args[@]}"

      - name: Download the cmux-next source archive
        if: vars.CMUX_NEXT_PUBLISH_SOURCE_ARCHIVE == '1' && needs.publish-nightly.outputs.source == 'own'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: cmux-next-source-archive
          path: source-archive

      # Gated by vars.CMUX_NEXT_PUBLISH_SOURCE_ARCHIVE (the coordinator sets it).
      # Tags the build commit cmux-next-src-<11 characters> and attaches
      # cmux-next-source-<build>.tar.gz to the nightly-next release. The prune
      # step removes it only together with the app assets of <build>, whose
      # source offer names it (prune_nightly_release_assets.py), never by age.
      # A recovered build carries its source archive in the recovered variant.
      - name: Take the recovered build's source archive
        if: vars.CMUX_NEXT_PUBLISH_SOURCE_ARCHIVE == '1' && needs.publish-nightly.outputs.source == 'recovered'
        run: mv nightly-out/source-archive source-archive

      - name: Publish the cmux-next source archive
        if: vars.CMUX_NEXT_PUBLISH_SOURCE_ARCHIVE == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_APP_TOKEN: ${{ steps.gh-app-token.outputs.token }} # App first, GH_TOKEN as fallback
          CMUX_RELEASE_RATE_LIMIT_SECONDS: "1800"
          HEAD_SHA: ${{ needs.publish-nightly.outputs.build_sha }}
        run: bash .publish-tooling/scripts/ci/nightly-steps/github-source-archive.sh

      # Enter the mutable writer only while this build is still the newest on the live feed,
      # so a run the feed already passed never queues behind (and replaces) a newer writer.
      - name: Check this build is still the feed's newest
        id: order
        run: |
          set -euo pipefail
          live="$(mktemp)"
          curl -fsSL --retry 5 --retry-all-errors -A "cmux-nightly-next-github/1" -H "Cache-Control: no-cache" \
            -o "$live" "${NIGHTLY_NEXT_FEED_BASE}/appcast-arm64.xml?github=${GITHUB_RUN_ID}"
          newest="$(python3 -I -c 'import re,sys; print(max([int(v) for v in re.findall(r"<sparkle:version>\s*(\d+)\s*</sparkle:version>", open(sys.argv[1]).read())] or [0]))' "$live")"
          if (( newest > NIGHTLY_BUILD )); then
            echo "The feed serves build $newest, newer than $NIGHTLY_BUILD: the release's names stay as that run writes them."
            echo "newest=false" >> "$GITHUB_OUTPUT"
          else
            echo "newest=true" >> "$GITHUB_OUTPUT"
          fi

  # The release's mutable state for cmux NEXT: the rolling DMG name, the feed copy, the body
  # with the cmux-published-sha marker, and the nightly-next tag. One writer at a time (the
  # group), and each write only while no newer build is on the live feed, so no run moves them
  # back: a newer run's writer waits behind this one and writes after it. The group can replace
  # only a waiting writer with a newer run's, which writes the newer state; uploads never wait
  # here (publish-nightly-next-github has no group).
  publish-nightly-next-github-names:
    needs: [decide, publish-nightly, publish-nightly-next-github]
    if: "!cancelled() && needs.publish-nightly-next-github.result == 'success' && needs.publish-nightly-next-github.outputs.newest == 'true'"
    environment: ${{ needs.decide.outputs.environment }}
    concurrency:
      group: nightly-next-github-names
      cancel-in-progress: false
    permissions:
      contents: write
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 90
    env:
      NIGHTLY_FEEDS: ${{ needs.decide.outputs.feeds }}
      CHANNEL: ${{ needs.decide.outputs.channel }}
      CHANNEL_DMG_PREFIX: ${{ needs.decide.outputs.dmg_prefix }}
      CHANNEL_RELEASE_TAG: ${{ needs.decide.outputs.release_tag }}
      NIGHTLY_BUILD: ${{ needs.publish-nightly.outputs.build }}
      PUBLISH_TOOLING: ${{ github.workspace }}/.publish-tooling/scripts
    steps:
      - *checkout-publication-tooling-a

      - *gh-app-token-write

      - *gh-app-install-tooling

      - *wait-through-github-api-rate-l-3

      - *download-nightly-variant-artif

      - *download-the-published-feed

      - name: Take the published feed
        run: |
          set -euo pipefail
          for feed in $NIGHTLY_FEEDS; do cp "next-github/$feed" "nightly-out/$feed"; done
          if [ -f next-github/nightly-prs.md ]; then cp next-github/nightly-prs.md "$RUNNER_TEMP/nightly-prs.md"; fi

      # still-newest: exit 0 while no build above this one is on the live feed. Every mutable
      # write below (rolling name, feed copy, body, tag) runs it just before writing, so an
      # older run whose uploads waited out a rate limit never writes over a newer build's.
      - name: Install the feed order check
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/still-newest" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          live="$(mktemp)"
          curl -fsSL --retry 5 --retry-all-errors -A "cmux-nightly-next-github/1" -H "Cache-Control: no-cache" \
            -o "$live" "${NIGHTLY_NEXT_FEED_BASE}/appcast-arm64.xml?github=${GITHUB_RUN_ID}-$RANDOM"
          newest="$(python3 -I -c 'import re,sys; print(max([int(v) for v in re.findall(r"<sparkle:version>\s*(\d+)\s*</sparkle:version>", open(sys.argv[1]).read())] or [0]))' "$live")"
          rm -f "$live"
          if (( newest > NIGHTLY_BUILD )); then
            echo "The feed serves build $newest, newer than $NIGHTLY_BUILD: its release state stays as that run writes it."
            exit 1
          fi
          SH
          chmod +x "$RUNNER_TEMP/still-newest"

      - name: Publish the rolling DMG name and the feed copy
        id: publish_names
        env:
          GH_TOKEN: ${{ github.token }}
          GH_APP_TOKEN: ${{ steps.gh-app-token.outputs.token }} # App first, GH_TOKEN as fallback
          CMUX_RELEASE_RATE_LIMIT_SECONDS: "3600"
        run: |
          set -euo pipefail
          if ! "$RUNNER_TEMP/still-newest"; then echo "newest=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          feeds=()
          for feed in $NIGHTLY_FEEDS; do feeds+=(--feed "nightly-out/$feed"); done
          # The versioned DMG publish-nightly-next-github uploaded: the publisher needs one
          # immutable asset, reuses the remote copy with the same size and digest, and so writes
          # the rolling name only while its versioned file is on the release.
          python3 "$PUBLISH_TOOLING/ci/publish-release-assets.py" \
            --repo "$GITHUB_REPOSITORY" --tag "$CHANNEL_RELEASE_TAG" \
            --immutable "nightly-out/${CHANNEL_DMG_PREFIX}-arm64-${NIGHTLY_BUILD}.dmg" \
            --alias "nightly-out/${CHANNEL_DMG_PREFIX}-arm64.dmg" --replace-feeds "${feeds[@]}"
          echo "newest=true" >> "$GITHUB_OUTPUT"

      - name: Mint release tag app token
        id: release-tag-token
        if: steps.publish_names.outputs.newest == 'true'
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.CMUX_RELEASE_APP_ID }}
          private-key: ${{ secrets.CMUX_RELEASE_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-workflows: write

      # The release body with the cmux-published-sha marker decide reads, as publish-nightly's
      # Record step writes it on the other channels.
      - name: Record the published build in the release body
        if: steps.publish_names.outputs.newest == 'true'
        env:
          GH_TOKEN: ${{ steps.release-tag-token.outputs.token }}
          RELEASE_ID: ${{ needs.publish-nightly-next-github.outputs.release_id }}
          UPLOADED_ASSETS: ${{ needs.publish-nightly-next-github.outputs.asset_names }}
          RELEASE_NAME: ${{ needs.decide.outputs.release_name }}
          BUILD_SHA: ${{ needs.publish-nightly.outputs.build_sha }}
          REF_NAME: ${{ github.ref_name }}
          TIP_SHA: ${{ needs.publish-nightly.outputs.tip_sha }}
          BEHIND: ${{ needs.publish-nightly.outputs.behind }}
          BEHIND_HOURS: ${{ needs.publish-nightly.outputs.behind_hours }}
          DOWNLOADS: ${{ needs.publish-nightly.outputs.downloads }}
        run: bash .publish-tooling/scripts/ci/nightly-steps/github-names-record-release-body.sh

      - name: Move the nightly-next tag to the published build
        if: steps.publish_names.outputs.newest == 'true'
        env:
          GH_TOKEN: ${{ steps.release-tag-token.outputs.token }}
          GITHUB_TOKEN: ''
          BUILD_SHA: ${{ needs.publish-nightly.outputs.build_sha }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/still-newest" || exit 0
          python3 "$PUBLISH_TOOLING/ci/update-release-tag.py" \
            --repo "$GITHUB_REPOSITORY" --tag "$CHANNEL_RELEASE_TAG" \
            --sha "$BUILD_SHA" --allow-non-descendant

  # A published nightly-next build's dSYMs, kept on R2 (build-nightly-app's artifact is a
  # 21-day handoff; Actions storage is not an archive). Its own job, outside the
  # publication chain: nothing needs it, it continues on error, and its timeout is its own,
  # so it never delays, fails or cancels a publication. The dSYMs come from the run that
  # compiled the published binary: its build number is that run's id and attempt, so a
  # rebuild or diagnostic run of the same commit is never taken. A rerun of a build already published repairs a missing
  # object; an
  # existing object (exit 75 from --write-once) counts as kept.
  keep-published-dsyms:
    needs: [decide, publish-nightly]
    if: "always() && !cancelled() && needs.decide.outputs.track == 'nightly-next' && needs.publish-nightly.result == 'success' && needs.publish-nightly.outputs.refused != 'true' && (needs.publish-nightly.outputs.tag_status == 'updated' || needs.publish-nightly.outputs.tag_status == 'stale' || needs.publish-nightly.outputs.already_published == 'true') && needs.publish-nightly.outputs.build_sha != ''"
    environment: ${{ needs.decide.outputs.environment }}
    continue-on-error: true
    permissions:
      contents: read
      actions: read
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 75
    env:
      BUILD: ${{ needs.publish-nightly.outputs.build }}
      BUILD_SHA: ${{ needs.publish-nightly.outputs.build_sha }}
    steps:
      - *checkout-publication-tooling-a

      - *gh-app-token-read

      - *gh-app-install-tooling

      - *wait-through-github-api-rate-l-2

      - name: Find the attempt that compiled the published build
        id: producer
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .publish-tooling/scripts/ci/nightly-steps/dsyms-find-attempt.sh

      - name: Download the published build's dSYMs from the run that compiled it
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ steps.producer.outputs.artifact }}
          run-id: ${{ steps.producer.outputs.run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/published-dsyms/dSYMs

      - name: Keep the published build's dSYMs on R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.NIGHTLY_NEXT_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.NIGHTLY_NEXT_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: "https://${{ secrets.NIGHTLY_NEXT_R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
        run: bash .publish-tooling/scripts/ci/nightly-steps/dsyms-keep-on-r2.sh

  # Post-publication lane (cx-x7hwx): picks the build publish-nightly-identity-legacy
  # copies, if any: the newest build on the cmux NEXT feed when it is newer than
  # the old feed's.
  # Linux, seconds; the macOS job starts only when there is work.
  legacy-identity-target:
    # The prepared NEXT artifact is a candidate before the main notarization.
    # The compatibility identity can therefore submit beside the main identity;
    # a pending continuation still uses the published feed path.
    needs: [decide, build-nightly-app, resolve-nightly-cmux-tui-client, prepare-nightly-variant]
    if: "always() && !cancelled() && needs.decide.result == 'success' && github.repository == 'manaflow-ai/cmux' && github.ref == 'refs/heads/nightly-next' && needs.decide.outputs.track == 'nightly-next' && needs.decide.outputs.environment == 'release-next' && needs.decide.outputs.notary_test != 'true' && needs.decide.outputs.notary_probe != 'true' && needs.decide.outputs.build_only != 'true' && needs.decide.outputs.fast_build != 'true' && vars.NIGHTLY_NEXT_LEGACY_IDENTITY != 'off'"
    # Only for the release App credentials (CMUX_RELEASE_APP_*), which live in this environment;
    # it runs only on nightly-next, the environment's one deployment branch.
    environment: release-next
    # A feed read error must not turn a run that published cmux NEXT red; the
    # macOS job then does not start (it needs this job's success and a build).
    continue-on-error: true
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 65
    permissions:
      contents: read
      # Record a refused build on the failure issue ("not counted").
      issues: write
      # Delete the pending artifacts of a refused build.
      actions: write
    outputs:
      sign_runner: ${{ steps.sign-runner.outputs.runner }}
      sign_alternate: ${{ steps.sign-runner.outputs.alternate }}
      action: ${{ steps.target.outputs.action }}
      build: ${{ steps.target.outputs.build }}
      pending_run: ${{ steps.target.outputs.pending_run }}
      bundle_run: ${{ steps.target.outputs.bundle_run }}
      source_run: ${{ steps.target.outputs.source_run }}
      source_sha: ${{ steps.target.outputs.source_sha }}
      # true only when the target step ran to the end (continue-on-error
      # reports a failed job as success to the jobs that need it).
      decided: ${{ steps.target.outputs.decided }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - *gh-app-token-read

      - *gh-app-install

      - *wait-through-github-api-rate-l

      # The Blacksmith macOS label whose queue is moving, for the macOS jobs after this one
      # (scripts/ci/nightly_sign_runner.py). Signing stays on Blacksmith; a stale
      # vars.MACOS_RUNNER_26 naming a label with no runners no longer strands them.
      - *pick-the-blacksmith-macos-labe

      - name: Compare the cmux NEXT feed with the old feed
        id: target
        env:
          LEGACY_APPCAST: appcast-arm64.xml
          DMG_PREFIX: cmux-nightly-next-macos-arm64-
          GH_TOKEN: ${{ github.token }}
          # Full commit SHAs every copied build must contain (space-separated);
          # unset means no requirement, and then the kill switch
          # NIGHTLY_NEXT_LEGACY_IDENTITY is the only protection.
          REQUIRED: ${{ vars.NIGHTLY_LEGACY_REQUIRED_COMMITS }}
          DEV_RING: ${{ vars.NIGHTLY_NEXT_DEV_RING == 'on' && 'on' || 'off' }}
          CURRENT_BUILD: ${{ needs.build-nightly-app.outputs.daemon_build }}
          CURRENT_BUILD_SHA: ${{ needs.resolve-nightly-cmux-tui-client.outputs.build_sha }}
          CURRENT_BUILD_READY: ${{ needs.prepare-nightly-variant.result == 'success' && 'true' || 'false' }}
          CURRENT_RUN: ${{ github.run_id }}
        run: bash scripts/ci/nightly-steps/legacy-identity-compare-feeds.sh

  # cx-x7hwx: installs of the nightly-next track from before cmux NEXT
  # (b9ac67887fa7, 2026-10-12) are cmux NIGHTLY (com.cmuxterm.app.nightly) and
  # read NIGHTLY_NEXT_LEGACY_FEED_BASE/appcast-arm64.xml. Sparkle installs only
  # an update with their bundle id or file name, and their terminals, agent
  # sessions, keychain sign-in, browser data, preferences and Chief state live
  # under that id. So each published cmux NEXT build is also published to them,
  # as the same build signed as cmux NIGHTLY
  # (scripts/ci/nightly-next-legacy-identity.sh), on the old feed, with its
  # signed release notes. Same Sparkle key; no new secret.
  # Which build: the newest build on the cmux NEXT feed when it is newer than
  # the old feed's (legacy-identity-target), whichever run published it: this
  # run's publish-nightly, a later run's recovery (#20518 hands a build still
  # in Apple's queue to recover-nightly-next-notarization) or a
  # nightly_next_continue_only run. A run that publishes nothing still catches
  # the old feed up to an earlier publication.
  # This lane starts from the signed NEXT artifact and runs beside publication.
  # A pending continuation still consumes the published recovery artifact. No
  # publication job needs it, and
  # continue-on-error keeps the run's result to cmux NEXT. A failure opens or
  # updates the "cmux NIGHTLY-identity publication failed" issue; the old feed
  # then keeps its previous build. Cost: the next nightly-next run waits for this
  # job's notarization in the workflow concurrency group (hq-a3 accepted, 2026-10-14).
  # Off switch: repository variable NIGHTLY_NEXT_LEGACY_IDENTITY=off.
  sign-nightly-identity-legacy:
    needs: [decide, build-nightly-app, legacy-identity-target]
    if: "!cancelled() && github.repository == 'manaflow-ai/cmux' && github.ref == 'refs/heads/nightly-next' && needs.decide.outputs.track == 'nightly-next' && needs.decide.outputs.environment == 'release-next' && (needs.decide.outputs.notary_paused != 'true' || needs.legacy-identity-target.outputs.action == 'continue') && needs.legacy-identity-target.result == 'success' && needs.legacy-identity-target.outputs.build != '' && vars.NIGHTLY_NEXT_LEGACY_IDENTITY != 'off'"
    continue-on-error: true
    environment: release-next
    # One signing slot per run: a newer run signs alongside an older one and
    # never replaces its waiting signer (a shared group evicted pending
    # signers, which the nightly rule forbids). Two runs can then submit the
    # same build to Apple; the "Skip a build the old feed already has" step
    # here and the publish job's order check keep the old feed right, and the
    # extra submission only costs Apple time (cx-vws1x).
    concurrency:
      group: nightly-next-legacy-identity-${{ github.run_id }}
      cancel-in-progress: false
    # Signs and notarizes only. It holds signing and notarization secrets, so
    # it runs no bundle code: verify-nightly-identity-legacy statically verifies
    # the stapled DMG on a fresh secret-free runner, and
    # publish-nightly-identity-legacy publishes only the DMG whose sha256 that
    # job verified (cx-vws1x).
    permissions:
      contents: read
      # Read the pending-submission artifacts of earlier runs, and retire
      # metadata whose bundle is gone (nightly-next-legacy-orphan-meta.sh).
      actions: write
    outputs:
      # The old feed already has this build (or a newer one): nothing ran.
      skip: ${{ steps.order.outputs.skip }}
      pending: ${{ steps.notarize.outputs.submission_pending }}
      notarize: ${{ steps.attempt.outputs.notarize }}
      apple: ${{ steps.attempt.outputs.apple }}
      requirement_refused: ${{ steps.attempt.outputs.requirement_refused }}
      # true only when every step of this job passed.
      signed_ok: ${{ steps.attempt.outputs.signed_ok }}
      build_sha: ${{ steps.build-src.outputs.build_sha }}
      dmg_sha256: ${{ steps.handoff.outputs.dmg_sha256 }}
      minimum_system_version: ${{ steps.handoff.outputs.minimum_system_version }}
      stapled_app_fallback_id: ${{ steps.notarize.outputs.stapled_app_fallback == 'true' && steps.notarize.outputs.stapled_app_pending_id || '' }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || github.run_attempt > 1 && needs.legacy-identity-target.outputs.sign_alternate || needs.legacy-identity-target.outputs.sign_runner || vars.MACOS_RUNNER_26 || 'blacksmith-6vcpu-macos-26' }}
    # Apple's wait is 20 min, as for cmux NEXT (#20518). A submission still in
    # Apple's queue is kept (artifacts cmux-nightly-identity-pending-meta and
    # -bundle) and a later run continues that exact submission
    # (legacy-identity-target: action continue, up to 48 h while no newer
    # cmux NEXT build exists; artifacts kept 3 days); it is never resubmitted and
    # never counted as a failure. The DMG around the stapled app adds one more
    # submission with the same 20 min wait (CMUX_STAPLE_APP_IN_DMG).
    timeout-minutes: 160
    env:
      CMUX_CI_XCODE_APP: ${{ vars.CMUX_CI_XCODE_APP_MACOS_26 }}
      CMUX_CI_REQUIRED_MACOS_SDK_MAJOR: "26"
      NIGHTLY_BUILD: ${{ needs.legacy-identity-target.outputs.build }}
      # new: sign and submit this build; continue: ask Apple about the pending
      # submission of run PENDING_RUN (the same signed DMG, no new upload).
      LEGACY_ACTION: ${{ needs.legacy-identity-target.outputs.action }}
      PENDING_RUN: ${{ needs.legacy-identity-target.outputs.pending_run }}
      # The run that holds the continued submission's bundle (the metadata of
      # an accepted submission is re-stored by a later run).
      BUNDLE_RUN: ${{ needs.legacy-identity-target.outputs.bundle_run }}
      # A new candidate can come directly from this run's signed artifact while
      # publish-nightly writes the NEXT feed. Continuations keep BUNDLE_RUN.
      SOURCE_RUN: ${{ needs.legacy-identity-target.outputs.source_run }}
      # Checked again on the app's own commit before anything is submitted to
      # Apple (legacy-identity-target checks the build first).
      REQUIRED: ${{ vars.NIGHTLY_LEGACY_REQUIRED_COMMITS }}
      CHANNEL_RELEASE_TAG: nightly-next
      CHANNEL_DMG_PREFIX: cmux-nightly-next-macos
      # Release asset names of the cmux NIGHTLY-identity copies. They start with
      # the track prefix (nightly-next-guard.py appcast) but match none of the
      # track's prune patterns (prune_nightly_release_assets.py); this job
      # prunes them itself.
      LEGACY_DMG_PREFIX: cmux-nightly-next-macos-nightlyid-arm64-
      LEGACY_APPCAST: appcast-arm64.xml
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # Checked again here: another run may have moved the old feed meanwhile.
      - *gh-app-token-read

      - *gh-app-install

      - *wait-through-github-api-rate-l

      - name: Skip a build the old feed already has
        id: order
        run: bash scripts/ci/nightly-steps/legacy-identity-sign-skip-published.sh

      # The DMG notarization below runs the bundle notice check, which reads
      # ghostty-next/build.zig.zon. Without it, run 38669958906 retired an
      # accepted submission.
      - name: Initialize cmux-next notices submodule
        if: steps.order.outputs.skip != 'true'
        shell: bash
        run: bash scripts/ci/init-submodule.sh ghostty-next

      # macOS /bin/bash 3.2 exits 0 on a parse error in a script with an EXIT
      # trap (runs 39014131817, 39014922771). Parse every script this job can
      # run before any signing or notarization.
      - name: Parse signing and notarize scripts with /bin/bash 3.2
        if: steps.order.outputs.skip != 'true'
        run: ./scripts/ci/check-bash32-parse.sh .github/workflows/nightly.yml

      - name: Select Xcode
        if: steps.order.outputs.skip != 'true'
        run: ./scripts/select-ci-xcode.sh

      - name: Set up Node
        if: steps.order.outputs.skip != 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22.23.4"

      # The same create-dmg as nightly.yml's build-sign-notarize-nightly.
      - name: Install create-dmg
        if: steps.order.outputs.skip != 'true'
        run: |
          CMUX_NODE_BIN="$(command -v node)"
          export npm_config_prefix="$RUNNER_TEMP/npm-global"
          mkdir -p "$npm_config_prefix"
          npm install --global "create-dmg@${CREATE_DMG_VERSION}"
          wrapper_dir="$RUNNER_TEMP/create-dmg-wrapper"
          mkdir -p "$wrapper_dir"
          cat > "$wrapper_dir/create-dmg" <<EOF
          #!/usr/bin/env bash
          exec "$CMUX_NODE_BIN" "$npm_config_prefix/lib/node_modules/create-dmg/cli.js" "\$@"
          EOF
          chmod +x "$wrapper_dir/create-dmg"
          echo "$wrapper_dir" >> "$GITHUB_PATH"

      - name: Download the published cmux NEXT DMG
        if: steps.order.outputs.skip != 'true' && env.LEGACY_ACTION == 'new'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/nightly-steps/legacy-identity-sign-download-next-dmg.sh

      - name: Download verified SSH daemon manifest
        if: steps.order.outputs.skip != 'true' && env.LEGACY_ACTION == 'new' && env.SOURCE_RUN != ''
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: cmux-nightly-remote-daemon
          path: remote-daemon-assets

      - name: Import signing cert
        if: steps.order.outputs.skip != 'true'
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: ./scripts/ci/signing-keychain.sh create

      # A current run has a prepared app before the main identity enters
      # Apple's queue. Sign and package that exact app as a temporary NEXT DMG
      # so the compatibility identity can submit in parallel. The published
      # DMG path below remains the continuation path for older runs.
      - name: Prepare current NEXT DMG for the parallel identity
        if: steps.order.outputs.skip != 'true' && env.LEGACY_ACTION == 'new' && env.SOURCE_RUN != ''
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          NEXT_BUNDLE_ID: ${{ needs.decide.outputs.bundle_id }}
          NEXT_APP_NAME: ${{ needs.decide.outputs.app_name }}
          NEXT_URL_SCHEME: ${{ needs.decide.outputs.url_scheme }}
          NEXT_FEED_BASE: ${{ needs.decide.outputs.feed_base }}
          NEXT_MARKETING_VERSION: ${{ needs.build-nightly-app.outputs.daemon_version }}
          NEXT_COMMIT_SHORT: ${{ needs.legacy-identity-target.outputs.source_sha }}
        run: bash scripts/ci/nightly-steps/legacy-identity-prepare-dmg.sh

      - name: Sign the build as cmux NIGHTLY
        if: steps.order.outputs.skip != 'true' && env.LEGACY_ACTION == 'new'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_NIGHTLY_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_NIGHTLY_PROVISIONING_PROFILE_BASE64 }}
        run: bash scripts/ci/nightly-steps/legacy-identity-sign-build.sh

      - name: Download the pending cmux NIGHTLY-identity submission
        if: steps.order.outputs.skip != 'true' && env.LEGACY_ACTION == 'continue'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/nightly-steps/legacy-identity-sign-download-pending.sh

      # The bundle notice check compares the app with ITS OWN source tree (the
      # LICENSE, the toolchain pins, the ghostty/ghostty-next gitlinks and
      # license trees). The copied cmux NEXT build can be older than this run's
      # commit, so the check runs from a checkout of the build's commit
      # (CMUXCommit), with the notices submodule initialized there.
      - name: Check out the build's own source for the bundle checks
        id: build-src
        if: steps.order.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/nightly-steps/legacy-identity-sign-build-source.sh

      # Same packaging, notarization, stapling, spctl and metadata checks as
      # every NIGHTLY DMG; runtime checks stay out of this secret-bearing job. The Computer Use helper keeps
      # its own stapled ticket (keep-stapled-computer-use-helper.sh).
      - name: Notarize the cmux NIGHTLY DMG
        id: notarize
        if: steps.order.outputs.skip != 'true'
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # The DMG around the stapled app is signed after Apple's wait.
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # This job holds signing and notarization secrets, so it runs no
          # bundle code (#21024 guard rule 6). The follow-up job verifies this
          # exact DMG's static artifact properties.
          CMUX_DEFER_LAUNCH_SMOKES: "true"
        run: bash scripts/ci/nightly-steps/legacy-identity-sign-notarize.sh

      # A new submission still in Apple's queue: keep the exact signed DMG,
      # app and submission for a later run (legacy-identity-target continues
      # it while it is under 6 hours old). Not a failure.
      - name: Keep the pending cmux NIGHTLY-identity submission
        if: steps.notarize.outputs.submission_pending == 'true' && env.LEGACY_ACTION == 'new'
        run: bash scripts/ci/nightly-steps/legacy-identity-sign-keep-pending.sh

      # The bundle first: a meta artifact always has its bundle.
      - name: Upload the pending submission bundle
        if: steps.notarize.outputs.submission_pending == 'true' && env.LEGACY_ACTION == 'new'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-nightly-identity-pending-bundle
          path: pending/
          if-no-files-found: error
          retention-days: 3

      - name: Upload the pending submission metadata
        if: steps.notarize.outputs.submission_pending == 'true' && env.LEGACY_ACTION == 'new'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-nightly-identity-pending-meta
          path: pending-meta/pending.json
          if-no-files-found: error
          retention-days: 3


      # The stapled DMG goes to the secret-free verify job; publish takes it
      # only with the sha256 that job tested.
      - name: Hand the stapled cmux NIGHTLY DMG to the verify job
        id: handoff
        if: steps.order.outputs.skip != 'true' && steps.notarize.outputs.submission_pending != 'true'
        run: bash scripts/ci/nightly-steps/legacy-identity-sign-hand-to-verify.sh

      - name: Upload the stapled cmux NIGHTLY DMG
        if: steps.handoff.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-nightly-identity-signed
          path: legacy-signed/
          compression-level: 0
          if-no-files-found: error
          retention-days: 3

      # What publish-nightly-identity-legacy needs to resolve the attempt:
      # Apple's answer (a notary log or a stapled ticket), a requirement
      # refusal, and whether every step here passed.
      - name: Record the attempt
        id: attempt
        if: always() && steps.order.outputs.skip == 'false'
        env:
          NOTARIZE: ${{ steps.notarize.outcome }}
          JOB_STATUS: ${{ job.status }}
        run: bash scripts/ci/nightly-steps/legacy-identity-sign-record-attempt.sh

      # The continued submission's metadata, for marking it accepted.
      - name: Upload the continued submission's metadata
        if: always() && steps.order.outputs.skip == 'false' && env.LEGACY_ACTION == 'continue' && hashFiles('attempt-meta/pending.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-nightly-identity-attempt-meta
          path: attempt-meta/pending.json
          if-no-files-found: error
          retention-days: 3

      - name: Cleanup keychain
        if: always()
        run: |
          ./scripts/ci/signing-keychain.sh delete --keychain build.keychain \
            || security delete-keychain build.keychain >/dev/null 2>&1 || true


  # cx-vws1x: static verification of the exact stapled cmux NIGHTLY DMG, on a
  # fresh secret-free pooled runner (no environment or secret). Its verified sha256 is the only DMG publish-nightly-identity-legacy
  # publishes.
  verify-nightly-identity-legacy:
    needs: [legacy-identity-target, sign-nightly-identity-legacy, pick-nightly-sign-runner]
    if: "!cancelled() && needs.sign-nightly-identity-legacy.outputs.signed_ok == 'true' && needs.sign-nightly-identity-legacy.outputs.dmg_sha256 != ''"
    continue-on-error: true
    permissions:
      contents: read
    # No environment and no secrets, like verify-signed-nightly: a free owned Mac first, then the
    # Blacksmith label legacy-identity-target picked. Routing order Linux, owned Macs, Blacksmith
    # last (Leo, 2026-10-24); on 2026-10-28 this job queued over 20 min on blacksmith-6vcpu-macos-26
    # behind pull request jobs while blacksmith-12vcpu-macos-26 started nothing. A re-run (attempt 2
    # on, the owned-pool rescue's) takes the Blacksmith alternate as before.
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || needs.pick-nightly-sign-runner.outputs.attempt == github.run_attempt && needs.pick-nightly-sign-runner.outputs.owned || github.run_attempt > 1 && needs.legacy-identity-target.outputs.sign_alternate || needs.legacy-identity-target.outputs.sign_runner || vars.MACOS_RUNNER_26 || 'blacksmith-6vcpu-macos-26' }}
    timeout-minutes: 30
    outputs:
      tested_sha256: ${{ steps.verify.outputs.tested_sha256 }}
    env:
      # An owned Mac has the PR lane's Xcode pin (as verify-signed-nightly); Blacksmith the macOS 26 one.
      CMUX_CI_XCODE_APP: ${{ needs.pick-nightly-sign-runner.outputs.attempt == github.run_attempt && needs.pick-nightly-sign-runner.outputs.owned != '' && vars.CMUX_CI_XCODE_APP_PR || vars.CMUX_CI_XCODE_APP_MACOS_26 }}
      CMUX_CI_REQUIRED_MACOS_SDK_MAJOR: "26"
      NIGHTLY_BUILD: ${{ needs.legacy-identity-target.outputs.build }}
      SIGNED_SHA256: ${{ needs.sign-nightly-identity-legacy.outputs.dmg_sha256 }}
      BUILD_SHA: ${{ needs.sign-nightly-identity-legacy.outputs.build_sha }}
      LEGACY_DMG_PREFIX: cmux-nightly-next-macos-nightlyid-arm64-
      STAPLED_APP_FALLBACK_ID: ${{ needs.sign-nightly-identity-legacy.outputs.stapled_app_fallback_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Select Xcode
        run: ./scripts/select-ci-xcode.sh

      - name: Download the stapled cmux NIGHTLY DMG
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: cmux-nightly-identity-signed
          path: legacy-signed

      # The license check compares the app with its own source tree, as in the
      # signing job: the copied build can be older than this run's commit.
      - name: Check out the build's own source for the bundle checks
        run: bash scripts/ci/nightly-steps/legacy-identity-verify-build-source.sh

      - name: Verify stapled cmux NIGHTLY DMG artifact
        id: verify
        run: bash scripts/ci/nightly-steps/legacy-identity-verify-dmg.sh

      # publish-nightly-identity-legacy runs on Linux, which cannot mount the
      # DMG: it writes the appcast item (scripts/ci/tip_appcast_linux.py) from
      # the Info.plist of the app in the DMG this job tested. Read-only data.
      - name: Hand the tested app's Info.plist to publish
        run: |
          set -euo pipefail
          dmg="legacy-signed/${LEGACY_DMG_PREFIX}${NIGHTLY_BUILD}.dmg"
          [ "$(shasum -a 256 "$dmg" | awk '{print $1}')" = "${{ steps.verify.outputs.tested_sha256 }}" ] || { echo "the DMG changed after its verification" >&2; exit 1; }
          mnt="$(mktemp -d "$RUNNER_TEMP/legacy-plist.XXXXXX")"
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mnt" >/dev/null
          mkdir -p tested-plist
          cp "$mnt/cmux NIGHTLY.app/Contents/Info.plist" tested-plist/Info.plist
          hdiutil detach "$mnt" >/dev/null || hdiutil detach -force "$mnt" >/dev/null
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" tested-plist/Info.plist | grep -Fxq "$NIGHTLY_BUILD"

      - name: Upload the tested app's Info.plist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-nightly-identity-tested-plist
          path: tested-plist/Info.plist
          if-no-files-found: error
          retention-days: 3

  publish-nightly-identity-legacy:
    needs: [decide, publish-nightly, legacy-identity-target, sign-nightly-identity-legacy, verify-nightly-identity-legacy]
    # A signing job that a newer run's concurrency slot cancelled tried
    # nothing: no resolve, no failure count.
    # The target job may select this run's prepared candidate before the main
    # publication settles. A recovered publication can instead advance NEXT
    # with an older build, so require the exact target build to be the build
    # publish-nightly selected before writing the compatibility feed. A
    # nightly_next_continue_only run intentionally skips publish-nightly; its
    # target came from the live NEXT feed and may continue the accepted Apple
    # submission without another NEXT write.
    if: "!cancelled() && github.repository == 'manaflow-ai/cmux' && github.ref == 'refs/heads/nightly-next' && needs.decide.outputs.track == 'nightly-next' && needs.decide.outputs.environment == 'release-next' && (needs.decide.outputs.notary_paused != 'true' || needs.legacy-identity-target.outputs.action == 'continue') && ((needs.publish-nightly.result == 'success' && needs.publish-nightly.outputs.refused != 'true' && needs.publish-nightly.outputs.build == needs.legacy-identity-target.outputs.build) || (needs.publish-nightly.result == 'skipped' && needs.legacy-identity-target.outputs.action == 'continue')) && needs.legacy-identity-target.result == 'success' && needs.legacy-identity-target.outputs.build != '' && vars.NIGHTLY_NEXT_LEGACY_IDENTITY != 'off' && needs.sign-nightly-identity-legacy.result != 'cancelled'"
    continue-on-error: true
    environment: release-next
    # One old-feed writer at a time across runs. A feed writer, not a build:
    # GitHub replacing a pending writer drops only an older run's publish in
    # favour of a newer run's (runs reach this job in tip order, and its order
    # check refuses a build the feed already has or passed), so no newer build
    # waits behind it. tests/test_nightly_delivery_concurrency.py lists the
    # writer groups allowed to be shared.
    concurrency:
      group: nightly-next-legacy-identity-publish
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      # Read and retire the pending-submission artifacts of earlier runs.
      actions: write
    outputs:
      # The old feed already has this build (or a newer one).
      already: ${{ steps.order.outputs.skip }}
      # The old feed now serves this build.
      published: ${{ steps.publish.outcome == 'success' && 'true' || 'false' }}
    # Publishes only a DMG whose sha256 verify-nightly-identity-legacy tested,
    # then resolves the attempt (retire, keep or mark the submission; count a
    # failure) for the whole sign, verify and publish chain. Runs no bundle code
    # and needs no Apple tool: Linux, on Blacksmith (trusted with release
    # secrets), never vars.LINUX_RUNNER, which may name an owned host.
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 90
    env:
      NIGHTLY_BUILD: ${{ needs.legacy-identity-target.outputs.build }}
      # new: sign and submit this build; continue: ask Apple about the pending
      # submission of run PENDING_RUN (the same signed DMG, no new upload).
      LEGACY_ACTION: ${{ needs.legacy-identity-target.outputs.action }}
      PENDING_RUN: ${{ needs.legacy-identity-target.outputs.pending_run }}
      # The run that holds the continued submission's bundle (the metadata of
      # an accepted submission is re-stored by a later run).
      BUNDLE_RUN: ${{ needs.legacy-identity-target.outputs.bundle_run }}
      # Checked again on the app's own commit before anything is submitted to
      # Apple (legacy-identity-target checks the build first).
      REQUIRED: ${{ vars.NIGHTLY_LEGACY_REQUIRED_COMMITS }}
      CHANNEL_RELEASE_TAG: nightly-next
      CHANNEL_DMG_PREFIX: cmux-nightly-next-macos
      # Release asset names of the cmux NIGHTLY-identity copies. They start with
      # the track prefix (nightly-next-guard.py appcast) but match none of the
      # track's prune patterns (prune_nightly_release_assets.py); this job
      # prunes them itself.
      LEGACY_DMG_PREFIX: cmux-nightly-next-macos-nightlyid-arm64-
      LEGACY_APPCAST: appcast-arm64.xml
      SIGN_RESULT: ${{ needs.sign-nightly-identity-legacy.result }}
      SIGN_SKIP: ${{ needs.sign-nightly-identity-legacy.outputs.skip }}
      SIGN_OK: ${{ needs.sign-nightly-identity-legacy.outputs.signed_ok }}
      SIGN_PENDING: ${{ needs.sign-nightly-identity-legacy.outputs.pending }}
      SIGNED_SHA256: ${{ needs.sign-nightly-identity-legacy.outputs.dmg_sha256 }}
      TESTED_SHA256: ${{ needs.verify-nightly-identity-legacy.outputs.tested_sha256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # The release App with every permission it has (Variables: read); the job's other App token
      # is contents-only. A failed mint leaves it empty, and the ring reads off.
      - &ring-token
        name: Mint the release App token that reads the Dev ring switch
        id: ring-token
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.CMUX_RELEASE_APP_ID }}
          private-key: ${{ secrets.CMUX_RELEASE_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Read the Dev ring switch live
        id: ring
        env:
          RING_TOKEN: ${{ steps.ring-token.outputs.token }}
        run: bash scripts/ci/nightly_next_dev_ring.sh --github-output "$GITHUB_OUTPUT"

      # Checked again here: another run may have moved the old feed while this
      # build was signed and verified. A continued submission skipped here is
      # not retired: its artifacts expire (3 days), and the target and signing
      # jobs skip a build the old feed already has.
      - *gh-app-token-write

      - *gh-app-install

      - *wait-through-github-api-rate-l

      - name: Skip a build the old feed already has
        id: order
        if: env.SIGN_SKIP == 'false'
        run: bash scripts/ci/nightly-steps/legacy-identity-publish-skip-published.sh

      - name: Download the stapled cmux NIGHTLY DMG
        if: steps.order.outputs.skip == 'false' && env.TESTED_SHA256 != ''
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: cmux-nightly-identity-signed
          path: legacy-out

      # The Info.plist of the app in the tested DMG (verify-nightly-identity-legacy).
      - name: Download the tested app's Info.plist
        if: steps.order.outputs.skip == 'false' && env.TESTED_SHA256 != ''
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: cmux-nightly-identity-tested-plist
          path: tested-plist

      # Only the bytes the verify job statically verified are published.
      - name: Refuse a DMG that is not the tested one
        if: steps.order.outputs.skip == 'false' && env.TESTED_SHA256 != ''
        run: |
          ./scripts/ci/nightly-next-legacy-tested-digest.sh \
            "legacy-out/${LEGACY_DMG_PREFIX}${NIGHTLY_BUILD}.dmg" "$TESTED_SHA256" "$SIGNED_SHA256"

      - name: Generate the old feed's appcast
        id: appcast
        if: steps.order.outputs.skip == 'false' && env.TESTED_SHA256 != ''
        env:
          TRACK: nightly-next
          NEXT_SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_NEXT_PRIVATE_KEY }}
          # Rewritten from the verdicts below (nightly_next_ring.py legacy).
          SPARKLE_CHANNEL: cmux-next
          DEV_RING: ${{ steps.ring.outputs.mode || 'off' }}
          SPARKLE_MINIMUM_SYSTEM_VERSION: ${{ needs.sign-nightly-identity-legacy.outputs.minimum_system_version }}
        run: bash scripts/ci/nightly-steps/legacy-identity-appcast.sh

      - name: Publish the cmux NIGHTLY DMG, release notes and the old feed
        id: publish
        if: steps.order.outputs.skip == 'false' && env.TESTED_SHA256 != ''
        env:
          GH_TOKEN: ${{ github.token }}
          AWS_ACCESS_KEY_ID: ${{ secrets.NIGHTLY_NEXT_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.NIGHTLY_NEXT_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: "https://${{ secrets.NIGHTLY_NEXT_R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
          RELEASE_POKE_URL: https://presence.cmux.dev/releases/v1/poke?feed=nightly-next-legacy
        run: bash scripts/ci/nightly-steps/legacy-identity-publish.sh

      # Retire the continued submission once it is published, or when Apple's
      # final answer means it can never publish (Invalid, Rejected, or Accepted
      # with a later check failing); keep it when only the publication failed.
      # Count a failure only for a final answer or a failed new attempt; a
      # submission still in Apple's queue never counts
      # (scripts/ci/nightly-next-legacy-resolve.py). A valid stapled ticket is
      # Apple's answer too: notarize-nightly-dmg.sh staples an Accepted
      # continuation and writes no notary log.
      - name: Download the continued submission's metadata
        if: always() && env.SIGN_SKIP == 'false' && steps.order.outputs.skip != 'true' && env.LEGACY_ACTION == 'continue'
        continue-on-error: true
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: cmux-nightly-identity-attempt-meta
          path: pending

      - name: Resolve the attempt
        id: resolve
        if: always() && env.SIGN_SKIP == 'false' && steps.order.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PENDING: ${{ needs.sign-nightly-identity-legacy.outputs.pending == 'true' }}
          NOTARIZE: ${{ needs.sign-nightly-identity-legacy.outputs.notarize || 'failure' }}
          PUBLISHED: ${{ steps.publish.outcome == 'success' }}
          # Apple's answer as the signing job saw it (a notary log or a stapled ticket).
          APPLE: ${{ needs.sign-nightly-identity-legacy.outputs.apple || 'unknown' }}
          REQUIREMENT_REFUSED: ${{ needs.sign-nightly-identity-legacy.outputs.requirement_refused || 'false' }}
        run: bash scripts/ci/nightly-steps/legacy-identity-resolve.sh

      - name: Store the accepted submission's metadata
        if: always() && steps.resolve.outputs.mark_accepted == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-nightly-identity-pending-meta
          path: accepted-meta/pending.json
          if-no-files-found: error
          retention-days: 3

      # Search, not a one-page listing: the issue may be past the first 100 open
      # issues and pull requests (scripts/ci/nightly-next-legacy-failure-issue.sh).
      # The attempt failed when signing failed, or when a build Apple is done
      # with was not published (the static verify, the digest check, the appcast
      # or the upload failed). A submission still in Apple's queue never fails.
      - name: Decide whether the attempt failed
        id: failed
        if: always() && env.SIGN_SKIP != 'true' && steps.order.outputs.skip != 'true'
        env:
          PUBLISHED: ${{ steps.publish.outcome == 'success' }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          job_ok=false
          if [ "$JOB_STATUS" = success ]; then job_ok=true; fi
          decision="$(python3 scripts/ci/nightly-next-legacy-attempt.py --sign-result "$SIGN_RESULT" --sign-skip "$SIGN_SKIP" \
            --signed-ok "$SIGN_OK" --pending "$SIGN_PENDING" --published "$PUBLISHED" --job-ok "$job_ok")"
          echo "$decision" >> "$GITHUB_OUTPUT"
          echo "attempt: sign $SIGN_RESULT skip=$SIGN_SKIP ok=$SIGN_OK pending=$SIGN_PENDING; tested=${TESTED_SHA256:-none}; published=$PUBLISHED -> $decision"

      - name: Find the failure issue
        id: failure-issue
        if: always() && steps.failed.outputs.failed == 'true' && steps.resolve.outputs.real != 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          number="$(./scripts/ci/nightly-next-legacy-failure-issue.sh "$GITHUB_REPOSITORY")"
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Report a failed publication
        if: always() && steps.failed.outputs.failed == 'true' && steps.resolve.outputs.real != 'false'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          BUILD: ${{ needs.legacy-identity-target.outputs.build }}
          ISSUE_NUMBER: ${{ steps.failure-issue.outputs.number }}
          ISSUE_SEARCH: ${{ steps.failure-issue.outcome }}
        with:
          script: |
            const title = 'cmux NIGHTLY-identity publication failed (nightly.yml publish-nightly-identity-legacy)';
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            // "Build N failed:" is what legacy-identity-target counts (two
            // failures of one build stop its retries); a submission still in
            // Apple's queue never reaches this step.
            const body = `Build ${process.env.BUILD} failed: it was not published to the cmux NIGHTLY-identity installs (cx-x7hwx). cmux NEXT is not affected; the old feed keeps its previous build.\n\nRun: ${run}\n\nStop it with repository variable NIGHTLY_NEXT_LEGACY_IDENTITY=off.`;
            const number = Number(process.env.ISSUE_NUMBER || 0);
            if (number > 0) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: number, body });
            } else if (process.env.ISSUE_SEARCH !== 'success') {
              // Without a working search a new issue could duplicate the open one.
              core.warning(`could not search for the failure issue; not opening another one. ${body}`);
            } else {
              await github.rest.issues.create({ ...context.repo, title, body });
            }
            core.error(`cmux NIGHTLY-identity publication of build ${process.env.BUILD} failed; see ${run}`);

      # Keep the job red for a failed attempt (continue-on-error keeps the run's
      # result to cmux NEXT).
      - name: Fail a failed attempt
        if: always() && steps.failed.outputs.failed == 'true'
        run: |
          echo "the cmux NIGHTLY-identity attempt for build $NIGHTLY_BUILD failed" >&2
          exit 1

      # Last: the attempt accounting above reads steps.publish, not this.
      - name: Read the old feed back
        if: always() && steps.publish.outcome == 'success'
        env:
          DEV_RING: ${{ steps.ring.outputs.mode || 'off' }}
        run: bash scripts/ci/nightly-steps/legacy-identity-readback.sh

  # Leo, 2026-10-26: "I still just don't have the nightly ... we can't just break
  # the update situation." The legacy jobs are continue-on-error, so a run that
  # published cmux NEXT stayed quiet while every legacy job skipped (run
  # 40239403743). When cmux NEXT publishes, the old feed publishes too, or there
  # was nothing to publish (current, refused, or still in Apple's queue), or
  # this job turns the run red. No job needs it.
  nightly-identity-legacy-published:
    needs: [decide, publish-nightly, legacy-identity-target, sign-nightly-identity-legacy, verify-nightly-identity-legacy, publish-nightly-identity-legacy]
    if: "always() && !cancelled() && github.repository == 'manaflow-ai/cmux' && github.ref == 'refs/heads/nightly-next' && needs.decide.outputs.track == 'nightly-next' && needs.decide.outputs.environment == 'release-next' && needs.decide.outputs.notary_test != 'true' && needs.decide.outputs.notary_probe != 'true' && needs.decide.outputs.build_only != 'true' && needs.decide.outputs.fast_build != 'true' && needs.publish-nightly.result == 'success' && needs.publish-nightly.outputs.refused != 'true' && vars.NIGHTLY_NEXT_LEGACY_IDENTITY != 'off'"
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 5
    permissions: {}
    env:
      # Outputs only: continue-on-error reports a failed legacy job as success.
      DECIDED: ${{ needs.legacy-identity-target.outputs.decided }}
      ACTION: ${{ needs.legacy-identity-target.outputs.action }}
      BUILD: ${{ needs.legacy-identity-target.outputs.build }}
      NEXT_BUILD: ${{ needs.publish-nightly.outputs.build }}
      SIGN_SKIP: ${{ needs.sign-nightly-identity-legacy.outputs.skip }}
      SIGN_PENDING: ${{ needs.sign-nightly-identity-legacy.outputs.pending }}
      SIGN_OK: ${{ needs.sign-nightly-identity-legacy.outputs.signed_ok }}
      TESTED: ${{ needs.verify-nightly-identity-legacy.outputs.tested_sha256 }}
      ALREADY: ${{ needs.publish-nightly-identity-legacy.outputs.already }}
      PUBLISHED: ${{ needs.publish-nightly-identity-legacy.outputs.published }}
    steps:
      - name: The old feed published, or had nothing to publish
        run: |
          set -euo pipefail
          echo "decided=${DECIDED:-} action=${ACTION:-} build=${BUILD:-} next=${NEXT_BUILD:-} sign skip=${SIGN_SKIP:-} pending=${SIGN_PENDING:-} ok=${SIGN_OK:-} tested=${TESTED:-} already=${ALREADY:-} published=${PUBLISHED:-}"
          if [ "${DECIDED:-}" != true ]; then
            echo "::error title=cmux NIGHTLY feed not published::legacy-identity-target did not finish; the old feed keeps its previous build"; exit 1
          fi
          if [ -z "${BUILD:-}" ] || [ "${ACTION:-none}" = none ]; then
            echo "the old feed is current, or its candidate was refused (recorded on the failure issue)"; exit 0
          fi
          if [ "${SIGN_SKIP:-}" = true ] || [ "${ALREADY:-}" = true ]; then
            echo "build $BUILD is already on the old feed"; exit 0
          fi
          # Pending counts only when the whole sign job passed (its pending
          # bundle and metadata stored, so a later run can continue it).
          if [ "${SIGN_PENDING:-}" = true ] && [ "${SIGN_OK:-}" = true ]; then
            echo "build $BUILD is still in Apple's queue; a later run continues it"; exit 0
          fi
          if [ "${PUBLISHED:-}" = true ]; then
            echo "build $BUILD published to the old feed"; exit 0
          fi
          if [ "${ACTION:-}" = continue ] && [ "$BUILD" != "${NEXT_BUILD:-}" ] && [ "${SIGN_OK:-}" = true ] && [ -n "${TESTED:-}" ]; then
            # Signed and verified, but the publisher runs only for this run's
            # build; a later run publishes the continued older one (the feed
            # watch alarms on the lag). A failed sign or verify is red below.
            echo "::notice::continued build $BUILD is not this run's ($NEXT_BUILD); a later run publishes it"; exit 0
          fi
          echo "::error title=cmux NIGHTLY feed not published::build $BUILD (action ${ACTION:-}) was neither published nor pending"; exit 1

  generate-nightly-deltas:
    # Delta work is deliberately downstream of the first publication. A slow
    # BinaryDelta process therefore cannot extend the user's wait for a full
    # DMG and signed appcast. The nightly-next track signs in release-next
    # with its own key, as build-sign-notarize-nightly does.
    environment: ${{ needs.decide.outputs.environment }}
    needs: [decide, build-nightly-app, resolve-nightly-cmux-tui-client, publish-nightly, pick-nightly-sign-runner]
    if: always() && needs.decide.outputs.should_publish == 'true' && needs.decide.outputs.fast_build != 'true' && needs.publish-nightly.result == 'success' && needs.publish-nightly.outputs.source != 'recovered' && needs.publish-nightly.outputs.refused != 'true'
    permissions:
      contents: read
      actions: read
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || github.run_attempt > 1 && needs.pick-nightly-sign-runner.outputs.alternate || needs.pick-nightly-sign-runner.outputs.runner || vars.MACOS_RUNNER_26 || 'blacksmith-6vcpu-macos-26' }}
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.decide.outputs.variants) }}
    timeout-minutes: 105
    env:
      NIGHTLY_VARIANT: ${{ matrix.variant }}
      NIGHTLY_BUILD: ${{ needs.build-nightly-app.outputs.daemon_build }}
      CHANNEL: ${{ needs.decide.outputs.channel }}
      CHANNEL_DMG_PREFIX: ${{ needs.decide.outputs.dmg_prefix }}
      CHANNEL_RELEASE_TAG: ${{ needs.decide.outputs.release_tag }}
      NIGHTLY_SPARKLE_KEY: ${{ vars.NIGHTLY_SPARKLE_KEY }}
      TRACK: ${{ needs.decide.outputs.track }}
      # The nightly-next track gets only its own key; the others never see it.
      SHARED_SPARKLE_PRIVATE_KEY: ${{ needs.decide.outputs.track != 'nightly-next' && secrets.SPARKLE_PRIVATE_KEY || '' }}
      NIGHTLY_SPARKLE_PRIVATE_KEY: ${{ needs.decide.outputs.track != 'nightly-next' && secrets.NIGHTLY_SPARKLE_PRIVATE_KEY || '' }}
      NEXT_SPARKLE_PRIVATE_KEY: ${{ needs.decide.outputs.track == 'nightly-next' && secrets.SPARKLE_NEXT_PRIVATE_KEY || '' }}
      # Every item starts on the new build's ring; republish-nightly-deltas
      # moves the ones whose canary passed back to Nightly.
      SPARKLE_CHANNEL: ${{ needs.decide.outputs.track == 'nightly-next' && (vars.NIGHTLY_NEXT_DEV_RING == 'on' && 'cmux-next-dev' || 'cmux-next') || '' }}
    steps:
      - name: Checkout build ref
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ needs.resolve-nightly-cmux-tui-client.outputs.build_sha }}

      # The wrapper comes from the workflow commit: the build checkout may predate it.
      # The publication-tooling shape test_nightly_cmux_tui_resolve.py exempts: scripts only.
      - name: Checkout the gh token wrapper at the workflow commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.sha }}
          path: .publish-tooling
          sparse-checkout: scripts/ci/gh_app_token.sh
          sparse-checkout-cone-mode: false

      - *gh-app-token-read

      - *gh-app-install-tooling

      - *wait-through-github-api-rate-l

      - name: Select Xcode
        run: ./scripts/select-ci-xcode.sh

      - name: Download published variant
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cmux-nightly-variant-${{ matrix.variant }}
          path: nightly-delta/input

      - name: Generate deltas and revised appcast
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          feed="appcast.xml"
          if [ "$NIGHTLY_VARIANT" != "universal" ]; then
            feed="appcast-${NIGHTLY_VARIANT}.xml"
          fi
          ./scripts/ci/generate-nightly-deltas.sh \
            "nightly-delta/input/${CHANNEL_DMG_PREFIX}-${NIGHTLY_VARIANT}-${NIGHTLY_BUILD}.dmg" \
            "nightly-delta/input/$feed" nightly-delta/output
          ls -l nightly-delta/output

      - name: Upload delta result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-nightly-deltas-${{ matrix.variant }}
          path: nightly-delta/output/*
          if-no-files-found: error
          retention-days: 3

  republish-nightly-deltas:
    # This job is separate from publish-nightly so the feed can advance first.
    # On nightly-next its delta uploads are serialized in their own group, never
    # publish-nightly's: GitHub replaces a group's pending job with a newly
    # queued one, so a shared group let one run's deltas cancel another run's
    # waiting publish. Its only feed write is a compare-and-swap on the bytes
    # read (write-feed --same-build: only while the live feed serves this
    # build), so a newer publish in between makes it a no-op. The classic and
    # RC tracks replace release feeds with no compare-and-swap, so they keep
    # publish-nightly's lock.
    needs: [decide, build-nightly-app, resolve-nightly-cmux-tui-client, publish-nightly, generate-nightly-deltas]
    if: always() && needs.decide.outputs.should_publish == 'true' && needs.decide.outputs.fast_build != 'true' && needs.publish-nightly.result == 'success' && needs.publish-nightly.outputs.already_published != 'true'
    environment: ${{ needs.decide.outputs.environment }}
    concurrency:
      group: release-${{ needs.decide.outputs.track == 'nightly-next' && 'deltas' || 'publish' }}-${{ needs.decide.outputs.release_tag }}
      cancel-in-progress: false
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    # It holds the publish group, so a hang must not hold it for the default 6 h. nightly-next
    # makes no gh call here (deltas and feed go to R2) and took at most 1.3 minutes in 56 runs;
    # other tracks keep the default, as their release uploads may wait out the rate limit.
    timeout-minutes: ${{ needs.decide.outputs.track == 'nightly-next' && 15 || 360 }}
    permissions:
      contents: write
      actions: read
    env:
      CHANNEL_RELEASE_TAG: ${{ needs.decide.outputs.release_tag }}
      CHANNEL_FEED_BASE: ${{ needs.decide.outputs.feed_base }}
      NIGHTLY_BUILD: ${{ needs.build-nightly-app.outputs.daemon_build }}
      CHANNEL_DMG_PREFIX: ${{ needs.decide.outputs.dmg_prefix }}
    steps:
      - name: Checkout build ref
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ needs.resolve-nightly-cmux-tui-client.outputs.build_sha }}

      # The ring script, the guard, the publisher and the gh rate-limit wait come from the
      # workflow commit on every track: the build ref can predate them (publish-nightly does
      # the same), and an older publisher has no secondary-limit backoff or serial uploads.
      - name: Checkout publication tooling at the workflow commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: .publish-tooling
          sparse-checkout: |
            scripts/ci/nightly_next_ring.py
            scripts/ci/nightly-next-guard.py
            scripts/ci/publish-release-assets.py
            scripts/ci/gh_budget_wait.sh
            scripts/ci/publish-nightly-next-r2.py
            scripts/ci/upload-r2-object.py
            scripts/ci/gh_app_token.sh
            scripts/ci/nightly_next_dev_ring.sh
            scripts/ci/nightly-steps/publish-next-feed-keep-nightly.sh
          sparse-checkout-cone-mode: false

      - *gh-app-token-write

      - *gh-app-install-tooling

      - name: Wait through GitHub API rate limits in this job's gh calls
        # scripts/ci/gh_budget_wait.sh puts a gh first on PATH that waits for the shared budget's
        # reset (at most an hour per job, each wait logged) when a call is refused for the rate
        # limit, instead of failing the publish path. timeout-minutes leaves room for that hour.
        run: bash .publish-tooling/scripts/ci/gh_budget_wait.sh --install

      - *ring-token

      - name: Read the Dev ring switch live
        id: ring
        env:
          RING_TOKEN: ${{ steps.ring-token.outputs.token }}
        run: bash .publish-tooling/scripts/ci/nightly_next_dev_ring.sh --github-output "$GITHUB_OUTPUT"

      - name: Download delta results
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: cmux-nightly-deltas-*
          path: nightly-deltas
          merge-multiple: true

      - name: Republish deltas and revised appcasts
        id: republish
        env:
          GH_TOKEN: ${{ github.token }}
          CMUX_RELEASE_RATE_LIMIT_SECONDS: "1800"
          GH_APP_TOKEN: ${{ steps.gh-app-token.outputs.token }} # the uploader: App first, GH_TOKEN as fallback
          TRACK: ${{ needs.decide.outputs.track }}
          DEV_RING: ${{ steps.ring.outputs.mode || 'off' }}
        run: |
          set -euo pipefail
          # The tag itself: `commits/<name>` resolves the nightly-next branch,
          # which the promote job moves ahead during a build, and a skipped
          # republish leaves the feed without its previous item (cx-urd.67).
          # nightly-next: publish-nightly-next-github moves the tag later, off the feed's
          # path; the live feed check below is the order check there.
          if [ "${TRACK:-}" != nightly-next ]; then
            tag_object="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$CHANNEL_RELEASE_TAG" --jq '.object.type + " " + .object.sha')"
            read -r tag_type current_sha <<< "$tag_object"
            if [ "$tag_type" = tag ]; then
              current_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$current_sha" --jq .object.sha)"
            fi
            # The publication moved the tag to the resolved build commit.
            if [ "$current_sha" != "${{ needs.resolve-nightly-cmux-tui-client.outputs.build_sha }}" ]; then
              echo "Skipping stale delta result: $CHANNEL_RELEASE_TAG is at $current_sha"
              echo "publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          if [ -n "${CHANNEL_FEED_BASE:-}" ]; then
            live_feed="$(mktemp)"
            curl -fsSL --retry 3 -A "cmux-delta-publisher/1" -o "$live_feed" "$CHANNEL_FEED_BASE/appcast-arm64.xml"
            live_build="$(python3 -c 'import sys,xml.etree.ElementTree as E; r=E.parse(sys.argv[1]).getroot(); print(next(c.text or "" for i in r.iter() if i.tag.rsplit("}", 1)[-1] == "item" for c in i if c.tag.rsplit("}", 1)[-1] == "version"))' "$live_feed")"
            # Above: a newer build published. Below: nightly-next-rollback.yml
            # pulled this one, and the revised appcast would put it back.
            if [[ "$live_build" =~ ^[0-9]+$ && "$NIGHTLY_BUILD" =~ ^[0-9]+$ ]] && (( live_build != NIGHTLY_BUILD )); then
              echo "Skipping stale delta result: NEXT feed serves build $live_build, not $NIGHTLY_BUILD"
              echo "publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          deltas=()
          for delta in nightly-deltas/*.delta; do
            [ -f "$delta" ] || continue
            deltas+=(--immutable "$delta")
          done
          if [ "${#deltas[@]}" -eq 0 ]; then
            echo "No Sparkle deltas were generated; full appcasts remain current"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The revised feed lists earlier builds again, all on the new build's
          # ring: each goes back to Nightly when its canary verdict is a pass. It
          # keeps the live feed's newest Nightly item as publish-nightly does.
          if [ "$TRACK" = nightly-next ]; then
            bash .publish-tooling/scripts/ci/nightly-steps/publish-next-feed-keep-nightly.sh nightly-deltas/appcast*.xml
            for feed in nightly-deltas/appcast*.xml; do
              [ -f "$feed" ] || continue
              python3 .publish-tooling/scripts/ci/nightly_next_ring.py retag --feed "$feed" --out "$feed" \
                --mode "$DEV_RING" --verdicts-base "$NIGHTLY_NEXT_FEED_BASE"
            done
          fi
          feeds=()
          for feed in nightly-deltas/appcast*.xml; do
            [ -f "$feed" ] || continue
            feeds+=(--feed "$feed")
          done
          [ "${#feeds[@]}" -gt 0 ]
          if [ "${TRACK:-}" = nightly-next ]; then
            # The deltas and the revised feed go to R2 in the next step, not to the release.
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The workflow commit's publisher: its rate-limit backoff, serial uploads, shared wait.
          publisher=.publish-tooling/scripts/ci/publish-release-assets.py
          python3 "$publisher" \
            --repo "$GITHUB_REPOSITORY" --tag "$CHANNEL_RELEASE_TAG" \
            "${deltas[@]}" --replace-feeds "${feeds[@]}"
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Upload revised appcasts to R2
        if: steps.republish.outputs.publish == 'true' && needs.decide.outputs.track != 'nightly-next'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: "https://${{ secrets.CF_R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
        run: |
          set -euo pipefail
          for feed in nightly-deltas/appcast*.xml; do
            [ -f "$feed" ] || continue
            name="$(basename "$feed")"
            python3 scripts/ci/upload-r2-object.py \
              --file "$feed" \
              --endpoint-url "$R2_ENDPOINT" \
              --bucket cmux-binaries \
              --key "${CHANNEL_RELEASE_TAG}/$name" \
              --content-type "application/xml" \
              --cache-control "no-cache, no-store, must-revalidate"
          done

      # As in publish-nightly: the nightly-next track writes only its own
      # bucket prefix with its scoped token, after the guard checks each feed.
      - name: Upload revised nightly-next appcasts to R2
        if: steps.republish.outputs.publish == 'true' && needs.decide.outputs.track == 'nightly-next'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.NIGHTLY_NEXT_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.NIGHTLY_NEXT_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: "https://${{ secrets.NIGHTLY_NEXT_R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
        run: |
          set -euo pipefail
          r2=.publish-tooling/scripts/ci/publish-nightly-next-r2.py
          # The deltas beside the DMG on R2, all at once; then every enclosure R2 serves at
          # its length points there (an older build from before R2 keeps its release URL).
          files=()
          for delta in nightly-deltas/*.delta; do files+=(--file "$delta"); done
          python3 "$r2" upload "${files[@]}"
          for feed in nightly-deltas/appcast*.xml; do
            [ -f "$feed" ] || continue
            python3 "$r2" rewrite --feed "$feed" --if-public
            python3 .publish-tooling/scripts/ci/nightly-next-guard.py appcast "$feed"
            # Only while the live feed still serves this build (If-Match on the bytes read).
            python3 "$r2" write-feed --feed "$feed" --same-build
          done

  # Each PR in this nightly-next build gets a "Shipped in" line, in one comment
  # that release.yml also writes for stable releases
  # (scripts/ci/published_in_comments.py). The span is the one the release
  # body's "PRs in this build" list uses (the previous published commit to
  # this build's), first-parent, so main's PRs arriving through a sync merge
  # are not claimed. No secrets; a comment failure never fails the nightly.
  published-in:
    needs: [decide, build-nightly-app, resolve-nightly-cmux-tui-client, publish-nightly]
    if: "!cancelled() && needs.decide.outputs.should_publish == 'true' && needs.decide.outputs.track == 'nightly-next' && needs.decide.outputs.no_publish != 'true' && needs.decide.outputs.published_sha != '' && needs.publish-nightly.result == 'success' && needs.publish-nightly.outputs.already_published != 'true' && needs.publish-nightly.outputs.refused != 'true' && needs.publish-nightly.outputs.source != 'recovered'"
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }} # ephemeral-required: pull-requests:write token; CI_TRUSTED_RUNNER picks Blacksmith (default) or GitHub-hosted
    # Writes are paced at 7.5 s under GitHub's hourly content limit.
    timeout-minutes: 120
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
    env:
      NIGHTLY_BUILD: ${{ needs.build-nightly-app.outputs.daemon_build }}
      NIGHTLY_VERSION: ${{ needs.build-nightly-app.outputs.daemon_version }}
      HEAD_SHA: ${{ needs.resolve-nightly-cmux-tui-client.outputs.build_sha }}
      PUBLISHED_SHA: ${{ needs.decide.outputs.published_sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.resolve-nightly-cmux-tui-client.outputs.build_sha }}
          persist-credentials: false
          sparse-checkout: scripts
      - *wait-through-github-api-rate-l

      - name: Fetch the published span
        run: ./scripts/cmux-next/fetch-release-notes-span.sh origin "$HEAD_SHA" nightly-next "$PUBLISHED_SHA"
      - name: Comment the build on its PRs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$PUBLISHED_SHA" = "$HEAD_SHA" ]; then echo "Empty span."; exit 0; fi
          python3 scripts/ci/published_in_comments.py --repo "$GITHUB_REPOSITORY" \
            --since "$PUBLISHED_SHA" --head "$HEAD_SHA" \
            --name "cmux NEXT nightly $NIGHTLY_VERSION" \
            --url "https://github.com/$GITHUB_REPOSITORY/releases/tag/nightly-next"

  # Keep one open issue per failed publication boundary. A stale channel tag
  # leaves the assets, release metadata, and feeds available, so the incident
  # must say that explicitly instead of claiming installs stopped updating.
  # R114 changelog (cmux-next track only): signed release notes for the
  # in-app changelog. The content-signing environment (main, feat-cmux-next,
  # nightly-next) holds only the Ed25519 content key; this job never sees the
  # Sparkle key or R2 credentials. publish-release-notes uploads the result
  # with release-next's scoped R2 token after the appcasts are live.
  # !cancelled(): an ordinary publication skips recover-nightly-next-notarization,
  # and GitHub skips a job with no status check below any skipped job (cx-urd.28).
  sign-release-notes:
    needs: [decide, build-nightly-app, resolve-nightly-cmux-tui-client, publish-nightly]
    if: "!cancelled() && needs.decide.outputs.should_publish == 'true' && needs.decide.outputs.track == 'nightly-next' && needs.decide.outputs.no_publish != 'true' && needs.publish-nightly.result == 'success' && needs.publish-nightly.outputs.already_published != 'true' && needs.publish-nightly.outputs.refused != 'true' && needs.publish-nightly.outputs.source != 'recovered'"
    environment: content-signing
    # The content-signing key remains scoped to this protected environment.
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 70
    permissions:
      contents: read
      # Read only: --pr-media reads the body of each highlight's pull request.
      pull-requests: read
    env:
      NIGHTLY_BUILD: ${{ needs.build-nightly-app.outputs.daemon_build }}
      NIGHTLY_VERSION: ${{ needs.build-nightly-app.outputs.daemon_version }}
      HEAD_SHA: ${{ needs.resolve-nightly-cmux-tui-client.outputs.build_sha }}
      # The commit published before this run (decide reads it from the release
      # body before publish-nightly moves the nightly-next tag to HEAD_SHA).
      PUBLISHED_SHA: ${{ needs.decide.outputs.published_sha }}
      CONTENT_PUBLIC_KEY: AnrDI4vqN4lFGX2IpzeWPZsa/Hk7yQMkVIKppFwAst4=
    steps:
      - &checkout-step
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.resolve-nightly-cmux-tui-client.outputs.build_sha }}
          persist-credentials: false
      # Only the published span: a full fetch of every branch and tag did not
      # finish inside this job's timeout (run 37526646874).
      # The span starts at the newest build whose signed notes were published (its "head"), not at
      # the last published app: a build whose notes failed to publish then loses no highlight to
      # the next one (2026-10-12: 3821558930001 had no notes and its highlights were never shown).
      - *wait-through-github-api-rate-l

      - name: Start the span at the newest published notes
        id: span
        run: |
          set -euo pipefail
          since=""
          index="$(mktemp)"
          if curl -fsSL -A "cmux-release-notes/1" -o "$index" "$NIGHTLY_NEXT_FEED_BASE/notes/index.json" \
             && curl -fsSL -A "cmux-release-notes/1" -o "$index.sig" "$NIGHTLY_NEXT_FEED_BASE/notes/index.json.sig" \
             && python3 scripts/cmux-next/release-notes.py verify --public-key "$CONTENT_PUBLIC_KEY" "$index"; then
            since="$(python3 scripts/cmux-next/release-notes.py since --index "$index" --not "$HEAD_SHA")"
          fi
          rm -f "$index" "$index.sig"
          echo "since=${since:-${PUBLISHED_SHA:-}}" >> "$GITHUB_OUTPUT"
      - name: Fetch the commits since the newest published notes
        env:
          SPAN_SINCE: ${{ steps.span.outputs.since }}
        run: ./scripts/cmux-next/fetch-release-notes-span.sh origin "$HEAD_SHA" nightly-next ${SPAN_SINCE:+"$SPAN_SINCE"}
      - name: Build and sign the release notes
        env:
          CONTENT_SIGNING_ED25519_PEM: ${{ secrets.CONTENT_SIGNING_ED25519_PEM }}
          SPAN_SINCE: ${{ steps.span.outputs.since }}
          # --pr-media: each highlight's picture from its pull request's body (read only).
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The previous published commit. publish-nightly has already moved the
          # nightly-next tag to HEAD_SHA when this job runs, so the tag gave an
          # empty span and every build shipped "changes": [] (cx-lntk); the tag
          # is only the fallback when decide recorded no published commit.
          since="${SPAN_SINCE:-${PUBLISHED_SHA:-}}"
          if [ -z "$since" ]; then
            since="$(git rev-parse -q --verify 'refs/tags/nightly-next^{commit}' || true)"
          fi
          if [ "$since" = "$HEAD_SHA" ]; then since=""; fi
          python3 scripts/cmux-next/release-notes.py build --build "$NIGHTLY_BUILD" \
            --short "$NIGHTLY_VERSION" --date "$(date -u +%Y-%m-%d)" \
            --head "$HEAD_SHA" --since "$since" --out notes --pr-media
          # Extend the published index only when its signature verifies.
          previous=""
          # The first cmux NEXT build carries the history over from the old feed.
          for base in "${NIGHTLY_NEXT_FEED_BASE}" "${NIGHTLY_NEXT_LEGACY_FEED_BASE}"; do
            if curl -fsSL -A "cmux-release-notes/1" -o notes/previous-index.json "$base/notes/index.json" \
               && curl -fsSL -A "cmux-release-notes/1" -o notes/previous-index.json.sig "$base/notes/index.json.sig" \
               && python3 scripts/cmux-next/release-notes.py verify --public-key "$CONTENT_PUBLIC_KEY" notes/previous-index.json; then
              previous=notes/previous-index.json
              break
            fi
          done
          python3 scripts/cmux-next/release-notes.py index --notes "notes/$NIGHTLY_BUILD.json" \
            ${previous:+--previous "$previous"} --out notes/index.json
          rm -f notes/previous-index.json notes/previous-index.json.sig
          # Announcement cards (R114): the reviewed release-notes/next/announcements.json, when present.
          signed=("notes/$NIGHTLY_BUILD.json" notes/index.json)
          # Older published notes without summary lines or structured items get them (cx-urd.61.6):
          # fetched from either feed, verified, filled from their commit subjects, re-signed below and
          # uploaded with this build's notes. Builds already carrying both are left alone.
          # The files are written apart and join notes/ only when the whole backfill succeeded, so a
          # crash can never upload rewritten notes without their new signatures.
          backfill_dir="$(mktemp -d)"
          if listed="$(python3 scripts/cmux-next/release-notes.py backfill --index notes/index.json \
               --base "$NIGHTLY_NEXT_FEED_BASE" --base "$NIGHTLY_NEXT_LEGACY_FEED_BASE" \
               --public-key "$CONTENT_PUBLIC_KEY" --out "$backfill_dir" --existing notes)"; then
            while IFS= read -r file; do
              [ -n "$file" ] || continue
              mv "$file" "notes/$(basename "$file")"
              signed+=("notes/$(basename "$file")")
            done <<< "$listed"
          else
            echo "::warning::release notes backfill failed; this build's notes publish without it"
          fi
          rm -rf "$backfill_dir"
          if [ -f release-notes/next/announcements.json ]; then
            python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); assert d.get("version")==1 and isinstance(d.get("items"),list)' release-notes/next/announcements.json
            cp release-notes/next/announcements.json notes/announcements.json
            signed+=(notes/announcements.json)
          fi
          # Invite-wave flags for cmux-tui testers (tui-tester-rollout #10): the reviewed
          # release-notes/next/flags.json, signed with the same content-signing key.
          if [ -f release-notes/next/flags.json ]; then
            python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); assert d.get("version")==1 and isinstance(d.get("default",{}),dict) and isinstance(d.get("cohorts",{}),dict)' release-notes/next/flags.json
            cp release-notes/next/flags.json notes/flags.json
            signed+=(notes/flags.json)
          fi
          key="$(mktemp)"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$CONTENT_SIGNING_ED25519_PEM" > "$key"
          python3 scripts/cmux-next/release-notes.py sign --key "$key" "${signed[@]}"
          for f in "${signed[@]}"; do
            python3 scripts/cmux-next/release-notes.py verify --public-key "$CONTENT_PUBLIC_KEY" "$f"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-notes
          path: notes/
          retention-days: 7

  publish-release-notes:
    # Still publish-nightly's group: the notes writes (notes/index.json and the
    # rest) have no compare-and-swap, so only this lock keeps an older build's
    # checked notes from landing after a newer publish. Leaving it needs that
    # compare-and-swap first (a late older notes job would otherwise replace a
    # newer one's pending notes and its writes would win).
    needs: [decide, publish-nightly, sign-release-notes, resolve-nightly-cmux-tui-client]
    concurrency:
      group: release-publish-${{ needs.decide.outputs.release_tag }}
      cancel-in-progress: false
    if: "!cancelled() && needs.decide.outputs.track == 'nightly-next' && needs.publish-nightly.result == 'success' && needs.publish-nightly.outputs.already_published != 'true' && needs.publish-nightly.outputs.refused != 'true' && needs.sign-release-notes.result == 'success'"
    environment: ${{ needs.decide.outputs.environment }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 70
    permissions:
      contents: read
    steps:
      - *checkout-step
      # The wrapper comes from the workflow commit: the build checkout may predate it.
      # The publication-tooling shape test_nightly_cmux_tui_resolve.py exempts: scripts only.
      - name: Checkout the gh token wrapper at the workflow commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.sha }}
          path: .publish-tooling
          sparse-checkout: scripts/ci/gh_app_token.sh
          sparse-checkout-cone-mode: false

      - *gh-app-token-read

      - *gh-app-install-tooling

      - *wait-through-github-api-rate-l

      - &download-artifact-step
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-notes
          path: notes
      - name: Recheck the NEXT publication head
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.decide.outputs.release_tag }}
          EXPECTED_SHA: ${{ needs.resolve-nightly-cmux-tui-client.outputs.build_sha }}
          EXPECTED_BUILD: ${{ needs.publish-nightly.outputs.build }}
          FEED_BASE: ${{ needs.decide.outputs.feed_base }}
        run: |
          set -euo pipefail
          # The live NEXT feed is the order check: publish-nightly-next-github moves the
          # nightly-next tag after the feed, off its path, so the tag can still name the
          # previous build here. A newer build on the feed, or this one pulled by
          # nightly-next-rollback.yml, skips the notes.
          feed="$(mktemp)"
          curl -fsSL --retry 3 -A "cmux-release-notes/1" -o "$feed" "$FEED_BASE/appcast-arm64.xml"
          live_build="$(python3 - "$feed" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          for item in root.iter():
              if item.tag.rsplit("}", 1)[-1] == "item":
                  for child in item:
                      if child.tag.rsplit("}", 1)[-1] == "version":
                          print(child.text or "")
                          raise SystemExit
          raise SystemExit("missing appcast version")
          PY
          )"
          if [[ "$live_build" =~ ^[0-9]+$ && "$EXPECTED_BUILD" =~ ^[0-9]+$ ]] && (( live_build != EXPECTED_BUILD )); then
            echo "::notice::Skipping release notes for build $EXPECTED_BUILD ($EXPECTED_SHA); NEXT feed serves $live_build"
            echo 'current=false' >> "$GITHUB_OUTPUT"
          else
            echo 'current=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Upload the signed release notes to R2
        if: steps.current.outputs.current == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.NIGHTLY_NEXT_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.NIGHTLY_NEXT_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: "https://${{ secrets.NIGHTLY_NEXT_R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
        run: |
          set -euo pipefail
          for file in notes/*; do
            name="$(basename "$file")"
            key="${NIGHTLY_NEXT_R2_PREFIX}notes/$name"
            python3 scripts/ci/nightly-next-guard.py r2-key "$NIGHTLY_NEXT_R2_BUCKET" "$key"
            case "$name" in index.json|index.json.sig|announcements.json|announcements.json.sig|flags.json|flags.json.sig) cache="no-cache, no-store, must-revalidate" ;; *) cache="public, max-age=3600" ;; esac
            case "$name" in *.json) type="application/json" ;; *) type="text/plain" ;; esac
            python3 scripts/ci/upload-r2-object.py --file "$file" --endpoint-url "$R2_ENDPOINT" \
              --bucket "$NIGHTLY_NEXT_R2_BUCKET" --key "$key" --content-type "$type" --cache-control "$cache"
          done

  # The nightly reel (scripts/cmux-next/media/reel.py): each pull request in this
  # build's signed notes with its tour's "after" clip and a title card, joined
  # into one video, and a page listing them, on the pr-media branch at
  # nightly-next/<build>/. Evidence only: no job needs this one, and it never
  # reports the nightly as failed.
  publish-nightly-reel:
    needs: [decide, build-nightly-app, resolve-nightly-cmux-tui-client, publish-release-notes]
    if: "!cancelled() && github.repository_owner == 'manaflow-ai' && needs.decide.outputs.track == 'nightly-next' && needs.publish-release-notes.result == 'success'"
    continue-on-error: true
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 90
    # The private-terms secret lives only in this environment, which admits only
    # the protected branches (main, feat-cmux-next, nightly-next).
    environment: pr-media
    # contents: write reaches the pr-media branch only through
    # .github/actions/pr-media-publish: its privacy check (pr_media_privacy.py,
    # with tesseract OCR for the reel's frames) refuses any private name in this
    # bot's folder before the first upload.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.resolve-nightly-cmux-tui-client.outputs.build_sha }}
          persist-credentials: false
          sparse-checkout: |
            scripts
            .github/actions/pr-media-publish
      - *wait-through-github-api-rate-l

      - *download-artifact-step
      - name: Install ffmpeg
        timeout-minutes: 6
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v fc-match >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends ffmpeg fontconfig fonts-dejavu-core >/dev/null
          fi
      - name: Build and publish the reel
        uses: ./.github/actions/pr-media-publish
        env:
          NIGHTLY_BUILD: ${{ needs.build-nightly-app.outputs.daemon_build }}
        with:
          private-terms: ${{ secrets.PR_MEDIA_PRIVATE_TERMS }}
          agent-authors: ${{ vars.PR_MEDIA_AGENT_AUTHORS }}
          github-token: ${{ github.token }}
          command: |
            set -euo pipefail
            # The notes this run signed and published, checked against the content key.
            python3 scripts/cmux-next/media/reel.py --build "$NIGHTLY_BUILD" --notes "notes/$NIGHTLY_BUILD.json" \
              --out "$RUNNER_TEMP/reel" --publish | tee "$RUNNER_TEMP/reel.log"
            # The page the reel lists its clips on: raw.githubusercontent.com shows
            # index.html as text, so the summary carries the list itself.
            python3 - "$RUNNER_TEMP/reel/reel.json" "$RUNNER_TEMP/reel.log" >> "$GITHUB_STEP_SUMMARY" <<'PY'
            import json, sys
            report = json.load(open(sys.argv[1]))
            urls = [line.strip() for line in open(sys.argv[2]) if line.startswith("https://")]
            reel = next((url for url in urls if url.endswith("/reel.mp4")), None)
            print(f"### cmux NEXT nightly reel, build {report['build']}\n")
            print(f"[Reel (mp4)]({reel})\n" if reel else "No pull request in this build has a tour clip.\n")
            print("| PR | Title | Clip |\n| --- | --- | --- |")
            for pr in report["prs"]:
                title = str(pr.get("title", "")).replace("|", "\\|").replace("\n", " ")
                clip = pr.get("clip", "")
                cell = f"[{pr.get('tour') or 'clip'}]({clip})" if clip.startswith("https://") else "no clip"
                print(f"| #{pr['pr']} | {title} | {cell} |")
            PY

  # A cancelled job (a timeout reports as cancelled) counts as a failure. On
  # nightly-next the signed release notes are part of the publication: a
  # published build whose notes jobs did not both succeed is reported too
  # (run 37526646874 published with its notes job cancelled and no alarm).
  report-nightly-failure:
    needs: [decide, build-nightly-ghostty-cli-helper, build-nightly-app, resolve-nightly-cmux-tui-client, prepare-nightly-variant, build-sign-notarize-nightly, verify-signed-nightly, verify-final-dmg-nightly, verify-recovered-nightly-next, publish-nightly, generate-nightly-deltas, republish-nightly-deltas, sign-release-notes, publish-release-notes]
    if: always() && needs.decide.outputs.should_publish == 'true' && needs.decide.outputs.notary_test != 'true' && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || needs.publish-nightly.outputs.feed_check == 'failure' || needs.publish-nightly.outputs.tag_status == 'stale' || needs.publish-nightly.outputs.refusal_reason != '' || (needs.decide.outputs.track == 'nightly-next' && needs.publish-nightly.result == 'success' && needs.publish-nightly.outputs.already_published != 'true' && needs.publish-nightly.outputs.refused != 'true' && needs.publish-nightly.outputs.source != 'recovered' && (needs.sign-release-notes.result != 'success' || needs.publish-release-notes.result != 'success')))
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    permissions:
      contents: read
      issues: write
      # The replaced-build check lists this run's jobs.
      actions: read
    steps:
      - name: Open or update the nightly failure issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          HEAD_SHA: ${{ needs.resolve-nightly-cmux-tui-client.outputs.build_sha || needs.decide.outputs.head_sha }}
          # The pushed nightly-next head (HEAD_SHA can be an older resolved build commit).
          TIP_SHA: ${{ needs.decide.outputs.head_sha }}
          RESULTS: ${{ toJSON(needs) }}
          CHANNEL_RELEASE_TAG: ${{ needs.decide.outputs.release_tag }}
          CHANNEL_APP_NAME: ${{ needs.decide.outputs.app_name }}
          REF_NAME: ${{ github.ref_name }}
          TAG_STATUS: ${{ needs.publish-nightly.outputs.tag_status }}
          PUBLISH_SOURCE: ${{ needs.publish-nightly.outputs.source }}
          REFUSAL_REASON: ${{ needs.publish-nightly.outputs.refusal_reason }}
          TRACK: ${{ needs.decide.outputs.track }}
        with:
          script: |
            const { owner, repo } = context.repo;
            // One label per release track (nightly, rc, nightly-next), so a
            // cmux-next result never opens or closes main's NIGHTLY incident.
            const appName = process.env.CHANNEL_APP_NAME;
            const refName = process.env.REF_NAME;
            const label = `${process.env.CHANNEL_RELEASE_TAG}-failure`;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const results = JSON.parse(process.env.RESULTS);
            // A nightly-next build that a newer push replaced while it waited for
            // the shared build slot ends cancelled without ever getting a runner;
            // the newer run builds and reports. Only that case is dropped: a build
            // that started and was cancelled (timeout, by hand) still reports, and
            // so does every other failed job of this run.
            let replaced = false;
            if (refName === 'nightly-next' && results['build-nightly-app']?.result === 'cancelled') {
              try {
                // Latest attempt of each job (the endpoint's default filter).
                const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun,
                  { owner, repo, run_id: context.runId, per_page: 100 });
                const build = jobs.find((job) => job.name === 'build-nightly-app');
                const neverStarted = Boolean(build) && !build.runner_name && !(build.steps || []).length;
                // A build cancelled while queued for a runner never started either;
                // only a newer push (the ref moved past this tip) replaces it.
                const { data: ref } = await github.rest.git.getRef({ owner, repo, ref: 'heads/nightly-next' });
                replaced = neverStarted && ref.object.sha !== process.env.TIP_SHA;
              } catch (error) {
                core.warning(`Could not read this run's jobs (${error.message}); reporting the cancelled build.`);
              }
            }
            const failed = Object.entries(results)
              .filter(([k, v]) => (v.result === 'failure' || v.result === 'cancelled') && !(replaced && k === 'build-nightly-app'))
              .map(([k, v]) => `${k} (${v.result})`);
            if (replaced && failed.length === 0 && !process.env.REFUSAL_REASON && process.env.TAG_STATUS !== 'stale') {
              core.info('build-nightly-app was replaced in its slot by a newer nightly-next push before it started; nothing else failed.');
              return;
            }
            // A refused publication succeeds as a job but published nothing.
            if (process.env.REFUSAL_REASON) failed.push(`publish-nightly (refused: ${process.env.REFUSAL_REASON})`);
            // nightly-next: notes jobs that were skipped after a publication
            // (a recovered one skips them on purpose).
            if (process.env.TRACK === 'nightly-next' && results['publish-nightly']?.result === 'success' && process.env.PUBLISH_SOURCE !== 'recovered') {
              for (const job of ['sign-release-notes', 'publish-release-notes']) {
                const result = results[job]?.result;
                if (result === 'skipped') failed.push(`${job} (skipped)`);
              }
            }
            const tagStale = process.env.TAG_STATUS === 'stale';
            const publicationLine = tagStale
              ? `${appName} published, tag marker stale for ${process.env.HEAD_SHA} (${refName}). Assets, release metadata, and appcasts are available; only the channel completion marker failed to advance.`
              : `${appName} run ${runUrl} failed on ${process.env.HEAD_SHA} (${refName}) in: ${failed.join(', ')}.`;
            const failedLine = failed.length > 0 ? `Failed jobs: ${failed.join(', ')}.` : 'The tag marker update failed after publication completed.';
            const body = `${publicationLine}\n\n${failedLine}\n\nThe next successful publication will update this incident. Run: ${runUrl}`;
            try {
              await github.rest.issues.getLabel({ owner, repo, name: label });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.issues.createLabel({ owner, repo, name: label, color: 'b60205', description: `${appName} publish failing` });
            }
            const open = await github.rest.issues.listForRepo({ owner, repo, labels: label, state: 'open', per_page: 1 });
            if (open.data.length > 0) {
              await github.rest.issues.createComment({ owner, repo, issue_number: open.data[0].number, body });
            } else {
              await github.rest.issues.create({ owner, repo, title: `${appName} build is failing on ${refName}`, labels: [label], body });
            }

  # The nightly-next feed alarm (one `nightly-next-feed-stale` issue past
  # NIGHTLY_NEXT_MAX_FEED_LAG_HOURS) runs from main every 30 minutes, so it also
  # sees promotion stalls: nightly-next-feed-watch.yml (cx-npz7g).

  close-nightly-failure-issue:
    needs: [decide, build-nightly-ghostty-cli-helper, build-nightly-app, build-sign-notarize-nightly, publish-nightly, resolve-nightly-cmux-tui-client, generate-nightly-deltas, republish-nightly-deltas, sign-release-notes, publish-release-notes]
    # always(): a skipped notes job must not skip this job silently; the
    # conditions below decide. nightly-next closes only with its notes published,
    # unless it published a recovered build, which has none (cx-urd.69). A
    # recovered build can follow this run's own failed build, which reports.
    if: always() && needs.decide.outputs.should_publish == 'true' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && needs.publish-nightly.result == 'success' && needs.publish-nightly.outputs.refused != 'true' && needs.publish-nightly.outputs.tag_status == 'updated' && (needs.generate-nightly-deltas.result == 'success' || needs.generate-nightly-deltas.result == 'skipped') && (needs.republish-nightly-deltas.result == 'success' || needs.republish-nightly-deltas.result == 'skipped') && (needs.decide.outputs.track != 'nightly-next' || needs.publish-nightly.outputs.source == 'recovered' || (needs.sign-release-notes.result == 'success' && needs.publish-release-notes.result == 'success'))
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    permissions:
      contents: read
      issues: write
    steps:
      - name: Close the nightly failure issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          HEAD_SHA: ${{ needs.resolve-nightly-cmux-tui-client.outputs.build_sha || needs.decide.outputs.head_sha }}
          CHANNEL_RELEASE_TAG: ${{ needs.decide.outputs.release_tag }}
          CHANNEL_APP_NAME: ${{ needs.decide.outputs.app_name }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const open = await github.rest.issues.listForRepo({ owner, repo, labels: `${process.env.CHANNEL_RELEASE_TAG}-failure`, state: 'open', per_page: 10 });
            for (const issue of open.data) {
              await github.rest.issues.createComment({ owner, repo, issue_number: issue.number, body: `${process.env.CHANNEL_APP_NAME} publish succeeded again on ${process.env.HEAD_SHA}: ${runUrl}` });
              await github.rest.issues.update({ owner, repo, issue_number: issue.number, state: 'closed' });
            }
