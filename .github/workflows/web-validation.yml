name: Web validation

on:
  # The changes job owns routing; no separate fallback may report success. A
  # docs-only pull request starts no run: web-validation is no longer a required
  # check (tests/test_ci_docs_only_prs.py), and a mixed one still runs it.
  #
  # A pull request run only publishes the web-validation status (ci-status owns the validation, see
  # below), so a feat-cmux-next pull request starts this only through pr-router.yml (one router per
  # push, RFD 0023), for a change to this workflow itself (scripts/ci/pr_router.json `affects`). Every
  # other feat-cmux-next head no longer takes a runner to echo; the router's skipped caller reports one
  # skipped `Web validation` check. Into main it starts on its own as before.
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    # docs-only paths: BEGIN (scripts/ci/docs_only_paths.py --sync writes this block; edit DOCS_ONLY_PATHS there)
    paths:
      - "**"
      - "!**/*.md"
      - "!docs/**/*.png"
      - "!docs/**/*.jpg"
      - "!docs/**/*.gif"
      - "!docs/**/*.webp"
      - "!plans/**/*.png"
      - "!plans/**/*.jpg"
      - "!plans/**/*.gif"
      - "!plans/**/*.webp"
      - "**/AGENTS.md"
      - "**/CLAUDE.md"
      - "**/SKILL.md"
      - ".github/**"
      - "**/skills/**"
      - "**/references/**"
      - "**/templates/**"
      - "**/Resources/**"
      - "**/fixtures/**"
      - "**/testdata/**"
      - "**/test/**"
      - "**/tests/**"
      - "CHANGELOG.md"
      - "THIRD_PARTY_LICENSES.md"
      - "release-notes/**"
      - "docs/agent-hooks.md"
      - "docs/chief-setup-prompts.md"
      - "docs/configuration.md"
      - "docs/ci/node-product-cache-maintenance.md"
      - "plans/cmux-next/actions.md"
      - "docs/mdm/managed-preferences.md"
      - "cmux-tui/crates/cmux-app-host/generated/REFERENCE.md"
      - "docs/ci/health-report.md"
      - "docs/privacy.md"
      - "docs/network-requirements.md"
      - "**/notices/**"
      - "vendor/stack-auth-swift-sdk-prerelease/README.cmux.md"
      - "cmux-tui/README.md"
      - "docs/remote-agents-and-cloud.md"
      - "docs/cmux-next/customize-recipes.md"
      - "cmux-tui/crates/acpmux/README.md"
      - "cmux-tui/crates/acpmux/docs/**"
      - "cmux-tui/crates/cmux-browser-host/js/guide.md"
      - "cmux-tui/crates/cmux-extension-sdk/README.md"
      - "cmux-tui/vendor/terminput-crossterm/README.md"
      - "mux/packages/brain/conformance/README.md"
      - "Native/OptChat/chief-kernel/src/turn_checks.md"
    # docs-only paths: END
  # docs-only-fallback.yml calls this in a pull request's own context (into main) when the docs-only `paths:` above could
  # have skipped it wrongly (over 300 changed files, or a full-ci/dev-build label): scripts/ci/docs_only_paths.py.
  # pr-router.yml calls it for a feat-cmux-next pull request (above).
  workflow_call:
  # Neither web-validation nor ci-status is a required check (repository rules,
  # 2026-11-19: main requires the CLA checks and backend migrations). CI owns the production build,
  # tests, and database checks on PRs/merge groups, where its Linux preflight gates
  # the Mac workers. This workflow runs the full standalone suite on main/manual.
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-validation-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Temporary REST budget attribution: one gh-call line per GitHub API call (scripts/ci/api_call_log/env.sh, fetched at a fixed commit when the checkout has no copy).
  BASH_ENV: '$({ w="${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh"; t="${RUNNER_TEMP:-/nonexistent}/api-call-log-src"; if [ -f "$w" ]; then echo "$w"; elif [ -n "${RUNNER_TEMP:-}" ]; then if [ ! -f "$t/env.sh" ] && [ ! -e "$t.tried" ] && { [ "${RUNNER_OS:-}" = Linux ] || [ "${RUNNER_OS:-}" = macOS ]; } && [ "$(date -u +%Y%m%d%H)" -lt 2026112300 ]; then : > "$t.tried"; mkdir -p "$t.part" && for x in env.sh gh sitecustomize.py isolated.py; do curl -fsSL --max-time 5 -o "$t.part/$x" "https://raw.githubusercontent.com/manaflow-ai/cmux/27647ffd3ae838c63be28ca3e5883dcd68c34518/scripts/ci/api_call_log/$x" || break; done; [ -s "$t.part/isolated.py" ] && mv "$t.part" "$t"; fi; if [ -f "$t/env.sh" ]; then echo "$t/env.sh"; else echo unset BASH_ENV > "$t.off.sh" && echo "$t.off.sh"; fi; fi; } 2>/dev/null)'

jobs:
  changes:
    if: ${{ github.event_name != 'pull_request' && github.event_name != 'merge_group' }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && (vars.CI_FORK_LINUX_RUNNER || 'ubuntu-24.04') || 'cmux-linux' }}
    timeout-minutes: 5
    outputs:
      required: ${{ steps.route.outputs.required }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Test routing and result enforcement
        run: python3 tests/test_web_validation.py
      - name: Validate the per-file webviews test runner
        run: python3 tests/test_webviews_tests_per_file.py
      - name: Validate the webviews new-reds comparison
        run: python3 tests/test_webviews_tests_new_reds.py
      - name: Select web validation
        id: route
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: python3 scripts/ci/web_validation.py route

  build:
    name: web-build
    needs: changes
    if: needs.changes.outputs.required == 'true' && github.event_name != 'pull_request' && github.event_name != 'merge_group'
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && (vars.CI_FORK_LINUX_RUNNER || 'ubuntu-24.04') || 'cmux-linux' }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Restore pinned Bun 1.4.4 from the CI cache bucket
        shell: bash
        continue-on-error: true
        run: bash "$GITHUB_WORKSPACE/scripts/ci/toolchain-r2.sh" restore bun 1.4.4 || true

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
          no-cache: ${{ !startsWith(github.workspace, '/home/runner/work/') || !(github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && github.event_name != 'merge_group' && contains(fromJSON('["refs/heads/main","refs/heads/feat-cmux-next","refs/heads/nightly-next"]'), github.ref)) }}
      - run: bun install --frozen-lockfile
      - name: Vercel production build
        env:
          # Valid fixtures, no production credentials or validation bypasses.
          RESEND_API_KEY: re_ci_build
          CMUX_FEEDBACK_FROM_EMAIL: ci@example.test
          STACK_SECRET_SERVER_KEY: ci-build-only
          NEXT_PUBLIC_STACK_PROJECT_ID: 00000000-0000-4000-8000-000000000000
          NEXT_PUBLIC_STACK_PUBLISHABLE_CLIENT_KEY: ci-build-only
          DATABASE_URL: postgres://cmux:cmux@127.0.0.1:1/cmux
          DIRECT_DATABASE_URL: postgres://cmux:cmux@127.0.0.1:1/cmux
          CMUX_ANALYTICS_TEST_MODE: '1'
        run: bun run vercel-build

  tests:
    name: web-tests
    needs: changes
    if: needs.changes.outputs.required == 'true' && github.event_name != 'pull_request' && github.event_name != 'merge_group'
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && (vars.CI_FORK_LINUX_RUNNER || 'ubuntu-24.04') || 'cmux-linux' }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Restore pinned Bun 1.4.4 from the CI cache bucket
        shell: bash
        continue-on-error: true
        run: bash "$GITHUB_WORKSPACE/scripts/ci/toolchain-r2.sh" restore bun 1.4.4 || true

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
          no-cache: ${{ !startsWith(github.workspace, '/home/runner/work/') || !(github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && github.event_name != 'merge_group' && contains(fromJSON('["refs/heads/main","refs/heads/feat-cmux-next","refs/heads/nightly-next"]'), github.ref)) }}
      - run: bun install --frozen-lockfile
      # The type check reports its red and keeps going, so the tests and builds after it still run on a
      # tree with a type error; the last step fails the job on it (Leo, 2026-11-19: "the CI doesn't
      # necessarily have to fail and like give up").
      - name: Typecheck
        id: typecheck
        continue-on-error: true
        run: bun run typecheck
      - run: bun run test
      - name: Cache Playwright's apt packages
        uses: ./.github/actions/playwright-apt-cache
        with:
          engines: chromium
      - run: bash "$(git rev-parse --show-toplevel)/scripts/ci/ensure-system-chrome.sh"
      - run: bun run test:instant
        env:
          CMUX_INSTANT_SKIP_TYPECHECK: "1"
      - name: Fail on the type check
        if: ${{ !cancelled() && steps.typecheck.outcome == 'failure' }}
        run: |
          echo "::error title=type check::the type check failed; see its step. The steps after it ran anyway."
          exit 1

  database:
    name: web-database-tests
    needs: changes
    if: needs.changes.outputs.required == 'true' && github.event_name != 'pull_request' && github.event_name != 'merge_group'
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && (vars.CI_FORK_LINUX_RUNNER || 'ubuntu-24.04') || 'cmux-linux' }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_DB: cmux_test
          POSTGRES_PASSWORD: cmux
          POSTGRES_USER: cmux
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U cmux -d cmux_test"
          --health-interval 1s --health-timeout 5s --health-retries 30
    env:
      CMUX_DB_TEST: '1'
      DATABASE_URL: postgres://cmux:cmux@localhost:5432/cmux_test
      DIRECT_DATABASE_URL: postgres://cmux:cmux@localhost:5432/cmux_test
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Restore pinned Bun 1.4.4 from the CI cache bucket
        shell: bash
        continue-on-error: true
        run: bash "$GITHUB_WORKSPACE/scripts/ci/toolchain-r2.sh" restore bun 1.4.4 || true

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
          no-cache: ${{ !startsWith(github.workspace, '/home/runner/work/') || !(github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && github.event_name != 'merge_group' && contains(fromJSON('["refs/heads/main","refs/heads/feat-cmux-next","refs/heads/nightly-next"]'), github.ref)) }}
      - run: bun install --frozen-lockfile
      - name: Apply migrations, including an idempotent second pass
        run: |
          bun scripts/db-migrate.mjs
          bun scripts/db-migrate.mjs
      - run: bun run test:db:behavior

  web-validation:
    name: web-validation
    needs: [changes, build, tests, database]
    if: always()
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && (vars.CI_FORK_LINUX_RUNNER || 'ubuntu-24.04') || 'cmux-linux' }}
    timeout-minutes: 5
    steps:
      - name: Accept CI-owned pull-request validation
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        run: |
          echo "PR and merge-group web validation is owned by the required ci-status check."
          echo "This workflow only publishes the separate required web-validation status."

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
        with:
          persist-credentials: false

      - name: Enforce selected results
        if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
        env:
          WEB_VALIDATION_NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/ci/web_validation.py check
