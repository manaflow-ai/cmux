name: cmux-browser-host release

# Linux release of cmux-browser-host for the cmux-next VM image
# (plans/cmux-next/browser-host.md 6d). A push to feat-cmux-next that touches
# the crate or this release path builds and packages both targets; a
# cmux-browser-host-vX.Y.Z tag also publishes them: a GitHub release with the
# two archives, SHA256SUMS and the channel-manifest package entries, each
# covered by a build-provenance attestation. The entries are unsigned: the
# channel manifest is signed where the channel is assembled. Each archive holds
# the binary, LICENSE (GPL-3.0-or-later) and THIRD_PARTY_LICENSES.md, the
# committed Linux notices that the version job checks; the release notes link
# the source commit.
on:
  push:
    branches: [feat-cmux-next]
    paths:
      - "cmux-tui/crates/cmux-browser-host/**"
      - "cmux-tui/Cargo.lock"
      - "cmux-tui/rust-toolchain.toml"
      - ".github/workflows/cmux-browser-host-release.yml"
      - "scripts/cmux-next/browser-host-release.py"
      - "tests/test_browser_host_release_package.py"
      - "cmux-tui/build-support/notices/**"
      - "cmux-tui/dist/notices/**"
      - "cmux-tui/dist/npm/cmux/LICENSE"
      - "LICENSE"
    tags:
      - "cmux-browser-host-v*"

permissions: {}

concurrency:
  group: cmux-browser-host-release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  # Temporary REST budget attribution: one gh-call line per GitHub API call (scripts/ci/api_call_log/env.sh, fetched at a fixed commit when the checkout has no copy).
  BASH_ENV: '$({ w="${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh"; t="${RUNNER_TEMP:-/nonexistent}/api-call-log-src"; if [ -f "$w" ]; then echo "$w"; elif [ -n "${RUNNER_TEMP:-}" ]; then if [ ! -f "$t/env.sh" ] && [ ! -e "$t.tried" ] && { [ "${RUNNER_OS:-}" = Linux ] || [ "${RUNNER_OS:-}" = macOS ]; } && [ "$(date -u +%Y%m%d%H)" -lt 2026112300 ]; then : > "$t.tried"; mkdir -p "$t.part" && for x in env.sh gh sitecustomize.py isolated.py; do curl -fsSL --max-time 5 -o "$t.part/$x" "https://raw.githubusercontent.com/manaflow-ai/cmux/27647ffd3ae838c63be28ca3e5883dcd68c34518/scripts/ci/api_call_log/$x" || break; done; [ -s "$t.part/isolated.py" ] && mv "$t.part" "$t"; fi; if [ -f "$t/env.sh" ]; then echo "$t/env.sh"; else echo unset BASH_ENV > "$t.off.sh" && echo "$t.off.sh"; fi; fi; } 2>/dev/null)'
  # The VM image's glibc is the floor (6d); zig links against this version.
  GLIBC_FLOOR: "2.31"

jobs:
  version:
    name: version
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || vars.CI_OVERFLOW_LINUX || 'cmux-linux' }}
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      # A tag's ancestry check needs feat-cmux-next's history: that branch alone, not checkout's fetch-depth 0
      # of every branch and tag, which stalled and failed this job three runs in a row (job 137965629300).
      - name: Fetch feat-cmux-next's history without blobs
        if: github.ref_type == 'tag'
        run: scripts/ci/fetch_branch_history.sh feat-cmux-next
      - name: Version (a tag must match the crate and sit on feat-cmux-next)
        id: version
        shell: bash
        run: |
          set -euo pipefail
          cargo_toml=cmux-tui/crates/cmux-browser-host/Cargo.toml
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="$(python3 scripts/cmux-next/browser-host-release.py version "$GITHUB_REF_NAME" "$cargo_toml")"
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/feat-cmux-next; then
              echo "tag $GITHUB_REF_NAME ($GITHUB_SHA) is not on feat-cmux-next" >&2
              exit 1
            fi
          else
            version="$(python3 scripts/cmux-next/browser-host-release.py crate-version "$cargo_toml")"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Release script tests
        run: |
          python3 tests/test_browser_host_release_package.py
          python3 cmux-tui/build-support/notices/browser-host/test_linux_release_notices.py

      - name: Restore the crate source cache
        if: ${{ (github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && github.event_name != 'merge_group' && contains(fromJSON('["refs/heads/main","refs/heads/feat-cmux-next","refs/heads/nightly-next"]'), github.ref)) }}
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/cmux-notices
          key: cmux-browser-host-notices-v1-${{ hashFiles('cmux-tui/Cargo.lock') }}
          restore-keys: cmux-browser-host-notices-v1-

      - name: Restore the crate source cache (restore only off base branches)
        if: ${{ !(github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && github.event_name != 'merge_group' && contains(fromJSON('["refs/heads/main","refs/heads/feat-cmux-next","refs/heads/nightly-next"]'), github.ref)) }}
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/cmux-notices
          key: cmux-browser-host-notices-v1-${{ hashFiles('cmux-tui/Cargo.lock') }}
          restore-keys: cmux-browser-host-notices-v1-

      # The archives ship this file as THIRD_PARTY_LICENSES.md: a stale one fails
      # the release before anything is built.
      - name: Linux notices are current
        run: python3 cmux-tui/build-support/notices/browser-host/linux_release_notices.py --check

  build:
    name: build ${{ matrix.target }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runs_on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || vars.CI_OVERFLOW_LINUX || 'cmux-linux' }}
          - target: aarch64-unknown-linux-gnu
            runs_on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04-arm' || vars.LINUX_ARM64_RUNNER || fromJSON(vars.RUNNER_POOLS).linux_arm64 }}
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # The workspace builds libghostty-vt from ghostty-next (ghostty-vt-sys);
      # the crate does not link it. ghostty-next also sets the Zig version.
      - name: Init ghostty-next submodule
        run: git submodule update --init --depth 1 ghostty-next

      - name: Resolve Zig version
        id: zig
        shell: bash
        env:
          GHOSTTY_ZIG_SOURCE: ghostty-next
        run: echo "version=$(bash ./scripts/ghostty-zig-version.sh)" >> "$GITHUB_OUTPUT"

      - name: Install zig
        uses: mlugg/setup-zig@8d6198c65fb0feaa111df26e6b467fea8345e46f # v2.0.5
        with:
          version: ${{ steps.zig.outputs.version }}
          # Its own cache saves a new entry per run; zig-global-cache keys it stably.
          use-cache: false
      - name: Restore the Zig global cache (feat-cmux-next pushes save it)
        uses: ./.github/actions/zig-global-cache

      - name: Set up pinned Rust
        uses: ./.github/actions/setup-cmux-tui-rust

      - name: Install Rust target and cargo-zigbuild
        shell: bash
        run: |
          rustup target add ${{ matrix.target }}
          cargo install --locked cargo-zigbuild@0.20.0

      # 6d build command, through zig so the binary links against the glibc floor;
      # zig is also the C compiler QuickJS-ng (rquickjs) needs.
      - name: Build
        working-directory: cmux-tui
        shell: bash
        env:
          CMUX_BUILD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          cargo zigbuild --release --locked -p cmux-browser-host --bin cmux-browser-host \
            --target "${{ matrix.target }}.${GLIBC_FLOOR}"
          bin="target/${{ matrix.target }}/release/cmux-browser-host"
          test -x "$bin"
          # No glibc symbol newer than the floor.
          newest="$(objdump -T "$bin" | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -V | tail -n 1)"
          echo "newest glibc symbol: $newest (floor $GLIBC_FLOOR)"
          [[ "$(printf '%s\n%s\n' "$newest" "$GLIBC_FLOOR" | sort -V | tail -n 1)" == "$GLIBC_FLOOR" ]]

      - name: Package
        shell: bash
        run: |
          python3 scripts/cmux-next/browser-host-release.py package \
            "cmux-tui/target/${{ matrix.target }}/release/cmux-browser-host" \
            "${{ needs.version.outputs.version }}" "${{ matrix.target }}" dist

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cmux-browser-host-${{ matrix.target }}
          retention-days: 1
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: publish
    if: github.ref_type == 'tag'
    needs: [version, build]
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.LINUX_RUNNER || fromJSON(vars.RUNNER_POOLS).linux_4 }}
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: cmux-browser-host-*
          path: dist
          merge-multiple: true
      - name: Entries and checksums
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          python3 scripts/cmux-next/browser-host-release.py entries "$base" "$VERSION" dist/*.tar.gz > dist/manifest-entries.json
          (cd dist && sha256sum ./*.tar.gz manifest-entries.json > SHA256SUMS)
          cat dist/manifest-entries.json
      - name: Attest
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: |
            dist/*.tar.gz
            dist/manifest-entries.json
      - name: Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          python3 scripts/cmux-next/browser-host-release.py notes "$VERSION" "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$GLIBC_FLOOR" > "$RUNNER_TEMP/notes.md"
          # A re-run after a partial upload replaces the assets of the release it made.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber \
              dist/*.tar.gz dist/manifest-entries.json dist/SHA256SUMS
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease \
            --title "cmux-browser-host $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            dist/*.tar.gz dist/manifest-entries.json dist/SHA256SUMS
