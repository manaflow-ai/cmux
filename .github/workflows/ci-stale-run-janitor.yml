name: CI stale run janitor

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      cleanup:
        description: "Actually cancel or delete eligible runs"
        required: true
        default: false
        type: boolean
      min_age_minutes:
        description: "Minimum run age before cleanup"
        required: true
        default: "1440"
        type: string
      max_actions:
        description: "Maximum runs to process"
        required: true
        default: "25"
        type: string
      superseded:
        description: "Instead, cancel queued pull_request runs whose PR is open at a newer head"
        required: false
        default: false
        type: boolean
      max_superseded:
        description: "Maximum superseded-head runs to cancel (1-500)"
        required: false
        default: "200"
        type: string

permissions: {}

# Scheduled and manually dispatched janitors share the same Actions control
# plane.  Serialize them so a second inventory cannot race the first run's
# final cancellation/deletion request.
concurrency:
  group: ci-stale-run-janitor
  cancel-in-progress: false

jobs:
  janitor:
    permissions:
      actions: write
      contents: read
      pull-requests: read
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || contains(fromJSON('["ubuntu-24.04","blacksmith-2vcpu-ubuntu-2404","blacksmith-4vcpu-ubuntu-2404","blacksmith-8vcpu-ubuntu-2404"]'), vars.CI_TRUSTED_RUNNER) && vars.CI_TRUSTED_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }} # ephemeral-required: trusted Actions control-plane token; CI_TRUSTED_RUNNER picks Blacksmith (default) or GitHub-hosted
    timeout-minutes: 15
    steps:
      - name: Check out trusted workflow code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Report or clean stale runs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CLEANUP: ${{ inputs.cleanup || 'false' }}
          MIN_AGE_MINUTES: ${{ inputs.min_age_minutes || '1440' }}
          MAX_ACTIONS: ${{ inputs.max_actions || '25' }}
          SUPERSEDED: ${{ inputs.superseded || 'false' }}
          MAX_SUPERSEDED: ${{ inputs.max_superseded || '200' }}
        run: python3 scripts/ci/cleanup-stale-runs.py
