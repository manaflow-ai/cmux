name: Rivals head-to-head (nightly)

# Leo, 2026-11-08 (ask-ecadef4111): "three more “wow” ideas / you might as well just go for broke. say 20. we can just
# keep finding more and more work to do". wow-20 idea 4, "Head-to-head bench vs desktop apps": a page that updates
# daily with cmux NEXT against the Claude and ChatGPT desktop apps on one fleet Mac.
#
# Runs scripts/measure/rivals.sh (signed out) as one exclusive measurement on the bench Mac, then scripts/perf-bench/rivals_page.py merges its results.json into the history and renders the page. Both go
# to the cmux-ci-cache-next bucket: rivals/v1/index.md (the page), rivals/v1/index.json (one entry per day, 90 days),
# rivals/v1/days/<date>.json (the day's full run) and rivals/v1/_stamp.json. Public:
# https://ci-cache-next.cmux.com/rivals/v1/index.md
#
# Nightly without a schedule (as bench-baselines-nightly.yml): a scheduled workflow runs main's copy, and this
# measures feat-cmux-next. Each push to feat-cmux-next reads the stamp; a run that finds it younger than RECORD_HOURS
# stops after one HTTP read. workflow_dispatch records now. A run that measures nothing is red and the stamp stays old.
#
# The exclusive bench queue waits hours (p90 about 700 min on 2026-11-28), longer than any job should hold the
# gateway runner. So the job submits detached (`cmux-ci run --detach --report-check`), writes the step id to
# rivals/v1/_pending.json and ends. Each later push re-attaches to that step for 2 min (cmux-ci wait) instead of
# queueing another, and the run that finds it done records it and clears the pending file. Detached, not a 30-min
# wait: the controller's orphan sweep (hq build-fleet/cmd/controller/orphan_drop.go) cancels a queued step whose
# submitting Actions run has ended, unless a report check is attached. Run 46174737070 re-attached to step
# ef62c6daf99f8f21894f0985 and found it dropped that way ("nothing waits for it").
#
# The job id ends in -fleet: the runner hook admits a fleet-client job by that suffix.
#
# Apps: every column of RFD 0131's Measured table (hq docs/rfd/0131-launch-like-the-browsers.md), plus ChatGPT, so
# each day's rivals/v1/days/<date>.json fills that table. Leo, 2026-11-25: "Ok well we can't be letting important
# rfds like that take breaks unless I put in fleet wide pauses, esp when this is stuff that materially improves the
# app". Rex has no public download: rivals.py measures the bench Mac's own /Applications/Rex.app when it is there.
on:
  push:
    branches: [feat-cmux-next]
  workflow_dispatch:
    inputs:
      apps:
        description: "Comma-separated rivals.py apps"
        required: false
        default: "cmux,rex,zed,claude,chatgpt,codex,t3code,slack,chrome,edge,helium,safari"
      soak:
        description: "Idle soak seconds per app"
        required: false
        default: "300"

permissions: {}

concurrency:
  group: rivals-nightly
  cancel-in-progress: false

env:
  CI_CACHE_R2_BUCKET: cmux-ci-cache-next
  CI_CACHE_R2_PUBLIC_URL: https://ci-cache-next.cmux.com
  RECORD_HOURS: "22"

jobs:
  record-rivals-fleet:
    if: ${{ github.repository == 'manaflow-ai/cmux' && github.ref == 'refs/heads/feat-cmux-next' }}
    name: Record the rivals head-to-head (fleet Mac)
    # The fleet controller is tailnet-only; a job that fetches the fleet client runs on the gateway runner
    # (tests/test_ci_gateway_jobs_on_linux.py).
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || 'mac-gateway' }} # frozen-label: CI_EVAL_STEP_GATEWAY (cmux#54437)
    # A detached submit or a 2-min re-attach ends in minutes. The bound is for a controller that takes no check run
    # (the client then waits here): its run limit (150 min: 12 apps, each about 10 min: the bundle copy, the quiet
    # wait, five launches with 20 s after each, a 5 minute soak), the queue wait and the upload.
    timeout-minutes: 200
    environment: ${{ github.ref == 'refs/heads/feat-cmux-next' && 'next-cache-writer' || '' }}
    permissions:
      contents: read
    steps:
      - name: Is a record due
        id: due
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -uo pipefail
          # A pending step (submitted by an earlier run, not yet recorded) is always worth a look: re-attach to it.
          pending="$(curl -fsS --max-time 10 "$CI_CACHE_R2_PUBLIC_URL/rivals/v1/_pending.json?t=$(date +%s)" 2>/dev/null)" || pending=""
          step="$(python3 -I -c '
          import json, sys
          try: print(json.loads(sys.argv[1]).get("step") or "")
          except Exception: print("")
          ' "$pending")"
          if [ -n "$step" ]; then echo "pending=$step" | tee -a "$GITHUB_OUTPUT"; echo "due=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$EVENT" = workflow_dispatch ]; then echo "due=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          stamp="$(curl -fsS --max-time 10 "$CI_CACHE_R2_PUBLIC_URL/rivals/v1/_stamp.json?t=$(date +%s)" 2>/dev/null)" || stamp=""
          due="$(python3 -I -c '
          import json, sys, time, calendar
          try:
              at = json.loads(sys.argv[1])["recorded_at"]
              age = (time.time() - calendar.timegm(time.strptime(at, "%Y-%m-%dT%H:%M:%SZ"))) / 3600
          except Exception:
              print("true"); sys.exit()
          print("true" if age >= float(sys.argv[2]) else "false")
          ' "$stamp" "$RECORD_HOURS")"
          echo "due=$due" | tee -a "$GITHUB_OUTPUT"

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        if: steps.due.outputs.due == 'true'
        timeout-minutes: 5
        with:
          persist-credentials: false
          submodules: false
          fetch-depth: 1
          sparse-checkout: |
            .github/actions/fleet-client
            scripts/perf-bench
            scripts/bench
          sparse-checkout-cone-mode: false

      - uses: ./.github/actions/fleet-client
        if: steps.due.outputs.due == 'true'
        with:
          controller: ${{ vars.CMUX_FLEET_CONTROLLER }}

      - name: Run rivals.sh on the bench Mac
        id: run
        if: steps.due.outputs.due == 'true'
        env:
          APPS: ${{ inputs.apps || 'cmux,rex,zed,claude,chatgpt,codex,t3code,slack,chrome,edge,helium,safari' }}
          SOAK: ${{ inputs.soak || '300' }}
          PENDING: ${{ steps.due.outputs.pending }}
          AWS_ACCESS_KEY_ID: ${{ secrets.CI_CACHE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CI_CACHE_R2_SECRET_ACCESS_KEY }}
          CI_CACHE_R2_ENDPOINT: ${{ format('https://{0}.r2.cloudflarestorage.com', secrets.CI_CACHE_R2_ACCOUNT_ID) }}
        run: |
          set -uo pipefail
          client="${CMUX_CI_CLIENT:-$HOME/.local/bin/cmux-ci}"
          if ! [[ -x "$client" ]]; then
            echo "::error::$client is not installed on runner $RUNNER_NAME: no rivals run recorded"
            exit 1
          fi
          out="$RUNNER_TEMP/rivals"
          mkdir -p "$out"
          put_pending() { # <json>: rivals/v1/_pending.json
            local code
            printf '%s\n' "$1" > "$out/pending.json"
            code="$(printf 'user = "%s:%s"\n' "$AWS_ACCESS_KEY_ID" "$AWS_SECRET_ACCESS_KEY" \
              | curl --config - --silent --show-error --retry 3 --retry-delay 2 --max-time 60 \
                  --aws-sigv4 "aws:amz:auto:s3" -H "x-amz-content-sha256: UNSIGNED-PAYLOAD" \
                  -H "Content-Type: application/json" -H "Cache-Control: no-store" \
                  -X PUT --upload-file "$out/pending.json" -o /dev/null -w '%{http_code}' \
                  "$CI_CACHE_R2_ENDPOINT/$CI_CACHE_R2_BUCKET/rivals/v1/_pending.json")"
            [ "$code" = 200 ] || { echo "::error::PUT rivals/v1/_pending.json answered HTTP $code"; return 1; }
          }
          status=0
          if [[ -n "$PENDING" ]]; then
            step="$PENDING"
            echo "re-attaching to pending step $step (submitted by an earlier run)"
            "$client" wait "$step" --timeout 120 2>&1 | tee "$out/step.log" || status=$?
          else
            # --report-check keeps the queued step past this run's end (orphan_drop.go skips it); its verdict
            # lands as a check run on this commit.
            "$client" run --class exclusive --measurement --label bench \
              --script scripts/measure/rivals.sh --ref "$GITHUB_SHA" \
              --artifact artifacts/rivals/results.json \
              --arg="apps=$APPS" --arg="soak=$SOAK" \
              --report-check "Rivals head-to-head (bench step)" --detach \
              --timeout 9000 2>&1 | tee "$out/step.log" || status=$?
            step="$(grep -o -E '\b[0-9a-f]{24}\b' "$out/step.log" | head -1 || true)"
            # A detached submit exits 0 at once; a controller without check runs waited here instead, so 0 means
            # queued only when no results came back.
            if [[ $status == 0 ]] && grep -q 'detached; check run' "$out/step.log"; then status=75; fi
          fi
          # Detached (75 above), exit 75 (a queue wait), 2 (wait's timeout) or 3 (controller unreachable): the step
          # keeps its place; the next push re-attaches.
          if [[ -n "$step" ]] && { [[ $status == 75 ]] || [[ $status == 2 ]] || [[ $status == 3 ]]; }; then
            put_pending "{\"step\": \"$step\", \"sha\": \"$GITHUB_SHA\", \"at\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" || exit 1
            echo "queued=true" >> "$GITHUB_OUTPUT"
            echo "fleet step $step is still queued or running (client exit $status); the next push to feat-cmux-next re-attaches to it" \
              | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ -n "$step" ]]; then
            "$client" artifact "$step" "$out/results.json" || "$client" artifact --failed "$step" "$out/results.json" || true
          fi
          echo "fleet step ${step:-(none)} client exit $status"
          # The step ended. Without results it is never re-attached again: clear the pending file so the next due push
          # submits a fresh one (with results, the upload clears it after recording).
          if [[ -n "$PENDING" ]] && ! [[ -s "$out/results.json" ]]; then put_pending '{}' || true; fi
          # A run that measured some rows is still the day's numbers; nothing measured is red in the next step.

      - name: Render the page
        if: steps.due.outputs.due == 'true' && steps.run.outputs.queued != 'true'
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/rivals"
          if ! [[ -s "$out/results.json" ]]; then
            echo "::error::the rivals step returned no results.json; nothing recorded, the stamp stays old"
            exit 1
          fi
          curl -fsS --max-time 20 "$CI_CACHE_R2_PUBLIC_URL/rivals/v1/index.json?t=$(date +%s)" -o "$out/history.json" \
            || rm -f "$out/history.json"
          python3 -I scripts/perf-bench/rivals_page.py page --today "$out/results.json" --history "$out/history.json" \
            --out "$out/page" --sha "$GITHUB_SHA" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload to R2
        if: steps.due.outputs.due == 'true' && steps.run.outputs.queued != 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CI_CACHE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CI_CACHE_R2_SECRET_ACCESS_KEY }}
          CI_CACHE_R2_ENDPOINT: ${{ format('https://{0}.r2.cloudflarestorage.com', secrets.CI_CACHE_R2_ACCOUNT_ID) }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/rivals"
          day="$(python3 -I -c 'import json,sys; print(json.load(open(sys.argv[1]))["date"])' "$out/results.json")"
          put() { # <file> <object key> <content type>
            local code
            code="$(printf 'user = "%s:%s"\n' "$AWS_ACCESS_KEY_ID" "$AWS_SECRET_ACCESS_KEY" \
              | curl --config - --silent --show-error --retry 3 --retry-delay 2 --max-time 60 \
                  --aws-sigv4 "aws:amz:auto:s3" -H "x-amz-content-sha256: UNSIGNED-PAYLOAD" \
                  -H "Content-Type: $3" -H "Cache-Control: max-age=600" \
                  -X PUT --upload-file "$1" -o /dev/null -w '%{http_code}' \
                  "$CI_CACHE_R2_ENDPOINT/$CI_CACHE_R2_BUCKET/$2")"
            [ "$code" = 200 ] || { echo "::error::PUT $2 answered HTTP $code"; return 1; }
            echo "put $2"
          }
          put "$out/results.json" "rivals/v1/days/$day.json" application/json
          put "$out/page/index.json" rivals/v1/index.json application/json
          put "$out/page/index.md" rivals/v1/index.md "text/markdown; charset=utf-8"
          printf '{"recorded_at": "%s", "sha": "%s", "date": "%s"}\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$GITHUB_SHA" "$day" \
            > "$out/stamp.json"
          put "$out/stamp.json" rivals/v1/_stamp.json application/json
          printf '{}\n' > "$out/pending.json"  # the pending step is recorded: the next due push submits a new one
          put "$out/pending.json" rivals/v1/_pending.json application/json
          echo "page: $CI_CACHE_R2_PUBLIC_URL/rivals/v1/index.md" | tee -a "$GITHUB_STEP_SUMMARY"
