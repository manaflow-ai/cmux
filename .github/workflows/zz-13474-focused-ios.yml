name: 13474 focused iOS dispatch

on:
  push:
    branches:
      - fix/13474-viewport-rearm-storm

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch focused iPhone simulator suites
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REF: fix/13474-viewport-rearm-storm
        run: |
          set -euo pipefail
          for filter in             cmuxFeatureTests/TerminalViewportSpacingTests             cmuxFeatureTests/TerminalViewportReportSchedulerTests             CmuxMobileShellUITests/TerminalSurfaceMountOwnershipTests
          do
            echo "Dispatching $filter"
            gh workflow run test-ios.yml               --repo manaflow-ai/cmux               --ref "$TARGET_REF"               -f ref="$TARGET_REF"               -f test_filter="$filter"               -f device_family=iphone               -f runner=auto               -f seed_cache=false
          done
