name: cmux-next degenerate lab

# The degenerate lab (scripts/cmux-next/degenerate-lab/lab.py): Leo's god chats, restarts,
# streaming, connectivity storms and load, small against god in one harness, idle against loaded,
# and recovery once the load is lifted. Leo, 2026-11-12: "are you guys able to simulate my god-chats?
# ... like truly degenerated cases/states and seeing where we can identify more perf to tackle".
#
# Once a UTC day, on the first push to nightly-next after midnight (as the quality report runs), it
# runs the `nightly` preset (0.1x and 1x; idle, CPU at load 100 and memory pressure; perf of the
# daemon and a Chrome trace of the pane where the runner allows) and keeps:
#   - `degenerate-lab-god-small`: god-small.json, the rows the nightly quality report reads with
#     --god-small (cmuxterm-hq docs/handbook/perf-regresses-on-degenerate-sessions.md: a row fails
#     over 1.2x), and summary.md;
#   - `degenerate-lab-results`: every available part's JSON, logs, perf report and traces. Each part
#     also uploads its own artifact as soon as it finishes. Artifacts are kept for three days.
# The quality report (cmux-next-quality-report.yml) fetches the newest god-small.json and posts it in
# the cmuxterm-hq issue "cmux NEXT nightly quality report". Nothing here gates a build.
on:
  push:
    branches:
      - nightly-next
  workflow_dispatch:
    inputs:
      preset:
        description: "smoke, nightly or full (0.1x, 1x and 3x)"
        default: "nightly"

permissions: {}

concurrency:
  group: cmux-next-degenerate-lab
  cancel-in-progress: false

env:
  # Temporary REST budget attribution: one gh-call line per GitHub API call (scripts/ci/api_call_log/env.sh, fetched at a fixed commit when the checkout has no copy).
  BASH_ENV: '$({ w="${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh"; t="${RUNNER_TEMP:-/nonexistent}/api-call-log-src"; if [ -f "$w" ]; then echo "$w"; elif [ -n "${RUNNER_TEMP:-}" ]; then if [ ! -f "$t/env.sh" ] && [ ! -e "$t.tried" ] && { [ "${RUNNER_OS:-}" = Linux ] || [ "${RUNNER_OS:-}" = macOS ]; } && [ "$(date -u +%Y%m%d%H)" -lt 2026112300 ]; then : > "$t.tried"; mkdir -p "$t.part" && for x in env.sh gh sitecustomize.py isolated.py; do curl -fsSL --max-time 5 -o "$t.part/$x" "https://raw.githubusercontent.com/manaflow-ai/cmux/27647ffd3ae838c63be28ca3e5883dcd68c34518/scripts/ci/api_call_log/$x" || break; done; [ -s "$t.part/isolated.py" ] && mv "$t.part" "$t"; fi; if [ -f "$t/env.sh" ]; then echo "$t/env.sh"; else echo unset BASH_ENV > "$t.off.sh" && echo "$t.off.sh"; fi; fi; } 2>/dev/null)'

jobs:
  lab:
    name: Claim the nightly run
    if: github.repository == 'manaflow-ai/cmux'
    runs-on: &linux ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && (vars.CI_FORK_LINUX_RUNNER || 'ubuntu-24.04') || 'cmux-linux' }}
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      run: ${{ github.event_name == 'workflow_dispatch' || steps.claimed.outputs.cache-hit == 'true' }}
    steps:
      - name: Name tonight's marker
        id: day
        run: echo "key=cmux-next-degenerate-lab-$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Look for tonight's run
        id: done
        if: github.event_name == 'push'
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          # The cache version includes the path. This relative path is the same on every runner.
          path: degenerate-lab-marker
          key: ${{ steps.day.outputs.key }}
          lookup-only: true

      - name: Claim tonight before starting the lab
        id: mark
        if: github.event_name == 'push' && steps.done.outputs.cache-hit != 'true'
        run: mkdir -p degenerate-lab-marker && date -u > degenerate-lab-marker/at

      - name: Save tonight's marker
        if: steps.mark.outcome == 'success'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: degenerate-lab-marker
          key: ${{ steps.day.outputs.key }}

      # A cache save can warn and exit successfully. Start load only once the marker is visible.
      - name: Verify tonight's claim
        id: claimed
        if: steps.mark.outcome == 'success'
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: degenerate-lab-marker
          key: ${{ steps.day.outputs.key }}
          lookup-only: true
          fail-on-cache-miss: true

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        if: github.event_name == 'workflow_dispatch' || steps.claimed.outputs.cache-hit == 'true'
        with: &checkout
          persist-credentials: false
          submodules: false

      - name: Test the lab
        if: github.event_name == 'workflow_dispatch' || steps.claimed.outputs.cache-hit == 'true'
        run: python3 -I scripts/cmux-next/degenerate-lab/test_lab.py

  part:
    needs: lab
    if: needs.lab.outputs.run == 'true'
    strategy:
      fail-fast: false
      # Packed runners may share a VM. Keep one part's CPU load out of another's idle measurement.
      max-parallel: 1
      matrix:
        part: [fixtures, daemon, chat, webview]
    runs-on: *linux
    timeout-minutes: 240
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with: *checkout

      - name: Set up pinned Rust
        if: matrix.part == 'daemon' || matrix.part == 'chat'
        timeout-minutes: 30
        uses: ./.github/actions/setup-cmux-tui-rust

      - name: Setup Bun
        if: matrix.part == 'webview'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
          no-cache: ${{ !startsWith(github.workspace, '/home/runner/work/') }}

      - name: Install webviews dependencies and system Chrome
        if: matrix.part == 'webview'
        working-directory: webviews
        run: |
          bun install --frozen-lockfile
          "$(git rev-parse --show-toplevel)/scripts/ci/ensure-system-chrome.sh"

      - name: Allow perf
        if: matrix.part == 'daemon'
        continue-on-error: true
        run: |
          sudo -n sysctl -w kernel.perf_event_paranoid=1 || true
          command -v perf || sudo -n apt-get install -y -qq linux-tools-common "linux-tools-$(uname -r)" || true

      - name: Install CPU load generator
        if: matrix.part != 'fixtures'
        run: command -v stress-ng || sudo -n apt-get install -y -qq stress-ng || true

      - name: Run the part
        env:
          PRESET: ${{ inputs.preset || 'nightly' }}
          PART: ${{ matrix.part }}
        run: |
          python3 -I scripts/cmux-next/degenerate-lab/lab.py "$PART" --preset "$PRESET" --profile \
            --out "$RUNNER_TEMP/degenerate-lab" --fixtures "$RUNNER_TEMP/degenerate-lab-fixtures" --target-dir "$RUNNER_TEMP/target"

      - name: Keep the part's results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: degenerate-lab-part-${{ matrix.part }}
          path: |
            ${{ runner.temp }}/degenerate-lab
            !${{ runner.temp }}/degenerate-lab/tmp
            !${{ runner.temp }}/degenerate-lab/**/perf.data
          retention-days: 3
          if-no-files-found: warn

  report:
    needs: [lab, part]
    if: ${{ !cancelled() && needs.lab.outputs.run == 'true' && needs.part.result != 'skipped' }}
    runs-on: *linux
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with: *checkout

      - name: Collect completed parts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: degenerate-lab-part-*
          path: ${{ runner.temp }}/degenerate-lab

      - name: Summarize the available measurements
        run: |
          python3 -I - <<'PY'
          import json, os, runpy
          from pathlib import Path

          lab = runpy.run_path("scripts/cmux-next/degenerate-lab/lab.py")
          out = Path(os.environ["RUNNER_TEMP"]) / "degenerate-lab"
          results = []
          for part in ("fixtures", "daemon", "chat", "webview"):
              data = out / f"degenerate-lab-part-{part}"
              if (data / "results.json").exists():
                  results.extend(json.loads((data / "results.json").read_text()))
              else:
                  # A failed part may still have finished some phases.
                  results.extend(json.loads(path.read_text()) for path in sorted(data.glob("*/result.json")))
          if not results:
              raise SystemExit("No measurements or fixture results were uploaded")
          rows = lab["god_small_rows"](results)
          summary = lab["summary_md"](results, rows)
          (out / "results.json").write_text(json.dumps(results, indent=1))
          (out / "god-small.json").write_text(json.dumps({"rows": rows}, indent=1))
          (out / "summary.md").write_text(summary)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as step_summary:
              step_summary.write(summary)
          PY

      - name: Keep the god-small rows
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: degenerate-lab-god-small
          path: |
            ${{ runner.temp }}/degenerate-lab/god-small.json
            ${{ runner.temp }}/degenerate-lab/summary.md
          retention-days: 3
          if-no-files-found: error

      - name: Keep the results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: degenerate-lab-results
          path: ${{ runner.temp }}/degenerate-lab
          retention-days: 3
          if-no-files-found: error
