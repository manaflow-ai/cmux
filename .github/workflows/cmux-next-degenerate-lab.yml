name: cmux-next degenerate lab

# The degenerate lab (scripts/cmux-next/degenerate-lab/lab.py): Leo's god chats, restarts,
# streaming, connectivity storms and load, small against god in one harness, idle against loaded,
# and recovery once the load is lifted. Leo, 2026-11-12: "are you guys able to simulate my god-chats?
# ... like truly degenerated cases/states and seeing where we can identify more perf to tackle".
#
# Once a UTC day, on the first push to nightly-next after midnight (as the quality report runs), it
# runs the `nightly` preset (0.1x and 1x; idle, CPU at load 100 and memory pressure; perf of the
# daemon and a Chrome trace of the pane where the runner allows). `plan` splits it into one job per
# part, scale and load (`lab.py plan`): run serially it was about four hours, and every nightly's
# single job was shut down before it ended, so none kept its rows. `report` merges every job's
# results (`lab.py merge`) and keeps:
#   - `degenerate-lab-god-small`: god-small.json, the rows the nightly quality report reads with
#     --god-small (cmuxterm-hq docs/handbook/perf-regresses-on-degenerate-sessions.md: a row fails
#     over 1.2x), and summary.md;
#   - `degenerate-lab-run-<job>`: each job's JSON, logs, perf report and traces (kept 3 days, the cap for Actions artifacts).
# A failed run's panic and last log lines are printed as `LAB-FAIL` lines in its job's log and again in `report`'s.
# The quality report (cmux-next-quality-report.yml) fetches the newest nightly-next run's god-small.json and posts it
# in the cmuxterm-hq issue "cmux NEXT nightly quality report". A pull request that changes the lab runs
# the `smoke` preset. Nothing here gates a build.
on:
  push:
    branches:
      - nightly-next
  pull_request:
    paths:
      - scripts/cmux-next/degenerate-lab/**
      - .github/workflows/cmux-next-degenerate-lab.yml
      - webviews/bench/degenerate-chat-frames.bench.ts
  workflow_dispatch:
    inputs:
      preset:
        description: "smoke, nightly or full (0.1x, 1x and 3x)"
        default: "nightly"

permissions: {}

concurrency:
  group: cmux-next-degenerate-lab-${{ github.event_name == 'pull_request' && github.ref || 'nightly' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Temporary REST budget attribution: one gh-call line per GitHub API call (scripts/ci/api_call_log/env.sh, fetched at a fixed commit when the checkout has no copy).
  BASH_ENV: '$({ w="${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh"; t="${RUNNER_TEMP:-/nonexistent}/api-call-log-src"; if [ -f "$w" ]; then echo "$w"; elif [ -n "${RUNNER_TEMP:-}" ]; then if [ ! -f "$t/env.sh" ] && [ ! -e "$t.tried" ] && { [ "${RUNNER_OS:-}" = Linux ] || [ "${RUNNER_OS:-}" = macOS ]; } && [ "$(date -u +%Y%m%d%H)" -lt 2026112300 ]; then : > "$t.tried"; mkdir -p "$t.part" && for x in env.sh gh sitecustomize.py isolated.py; do curl -fsSL --max-time 5 -o "$t.part/$x" "https://raw.githubusercontent.com/manaflow-ai/cmux/27647ffd3ae838c63be28ca3e5883dcd68c34518/scripts/ci/api_call_log/$x" || break; done; [ -s "$t.part/isolated.py" ] && mv "$t.part" "$t"; fi; if [ -f "$t/env.sh" ]; then echo "$t/env.sh"; else echo unset BASH_ENV > "$t.off.sh" && echo "$t.off.sh"; fi; fi; } 2>/dev/null)'
  PRESET: ${{ github.event_name == 'pull_request' && 'smoke' || inputs.preset || 'nightly' }}

jobs:
  # A workflow sweep that reaches this only through workflow files skips its heavy jobs (self-edit-sweep.yml,
  # scripts/ci/self_edit_sweep.py); a pull request under 10 changed files or with full-ci never starts the gate.
  self-edit:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.changed_files >= 10 && !contains(github.event.pull_request.labels.*.name, 'full-ci') }}
    uses: ./.github/workflows/self-edit-sweep.yml
    with:
      workflow: .github/workflows/cmux-next-degenerate-lab.yml
    permissions:
      contents: read

  plan:
    needs: self-edit
    if: ${{ !cancelled() && needs.self-edit.outputs.run != 'false' && (github.repository == 'manaflow-ai/cmux') }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || 'cmux-linux' }}
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      run: ${{ steps.plan.outputs.run }}
      key: ${{ steps.day.outputs.key }}
    steps:
      - name: Name tonight's marker
        id: day
        run: echo "key=cmux-next-degenerate-lab-$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Look for tonight's run
        id: done
        if: github.event_name == 'push'
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/degenerate-lab-marker
          key: ${{ steps.day.outputs.key }}
          lookup-only: true

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        if: steps.done.outputs.cache-hit != 'true'
        with:
          persist-credentials: false
          submodules: false
          sparse-checkout: scripts/cmux-next/degenerate-lab

      - name: Plan the jobs
        id: plan
        if: steps.done.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          matrix="$(python3 -I scripts/cmux-next/degenerate-lab/lab.py plan --preset "$PRESET")"
          echo "$matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "run=true" >> "$GITHUB_OUTPUT"

  run:
    needs: plan
    if: needs.plan.outputs.run == 'true'
    name: ${{ matrix.name }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || 'cmux-linux' }}
    timeout-minutes: 150
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: false

      - name: Restore pinned Bun 1.4.4 from the CI cache bucket
        if: matrix.part == 'webview'
        shell: bash
        continue-on-error: true
        run: bash "$GITHUB_WORKSPACE/scripts/ci/toolchain-r2.sh" restore bun 1.4.4 || true

      - name: Setup Bun
        if: matrix.part == 'webview'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
          no-cache: ${{ !startsWith(github.workspace, '/home/runner/work/') || !(github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && github.event_name != 'merge_group' && contains(fromJSON('["refs/heads/main","refs/heads/feat-cmux-next","refs/heads/nightly-next"]'), github.ref)) }}

      - name: Install webviews dependencies
        if: matrix.part == 'webview'
        working-directory: webviews
        run: bun install --frozen-lockfile

      - name: Install system Chrome
        if: matrix.part == 'webview'
        working-directory: webviews
        run: |
          "$(git rev-parse --show-toplevel)/scripts/ci/ensure-system-chrome.sh"

      - name: Test the lab
        if: matrix.part == 'fixtures'
        run: python3 -I scripts/cmux-next/degenerate-lab/test_lab.py

      # perf needs kernel.perf_event_paranoid at most 1; a runner that refuses records the reason and runs on.
      - name: Allow perf
        if: matrix.part != 'fixtures'
        continue-on-error: true
        run: |
          sudo -n sysctl -w kernel.perf_event_paranoid=1 || true
          command -v perf || sudo -n apt-get install -y -qq linux-tools-common "linux-tools-$(uname -r)" || true
          command -v stress-ng || sudo -n apt-get install -y -qq stress-ng || true

      - name: Run ${{ matrix.name }}
        env:
          PART: ${{ matrix.part }}
          SCALE: ${{ matrix.scale }}
          LOAD: ${{ matrix.load }}
        run: |
          set -uo pipefail
          out="$RUNNER_TEMP/degenerate-lab"
          status=0
          python3 -I scripts/cmux-next/degenerate-lab/lab.py "$PART" --preset "$PRESET" --scale "$SCALE" --load "$LOAD" \
            --profile --out "$out" --fixtures "$RUNNER_TEMP/degenerate-lab-fixtures" --target-dir "$RUNNER_TEMP/target" || status=$?
          cat "$out/summary.md" >> "$GITHUB_STEP_SUMMARY" || true
          # Fixtures are regenerated from their seed; the results are what is kept.
          rm -rf "$RUNNER_TEMP/degenerate-lab-fixtures"
          find "$out" -name perf.data -delete
          exit $status

      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: degenerate-lab-run-${{ matrix.name }}
          path: ${{ runner.temp }}/degenerate-lab
          retention-days: 3
          if-no-files-found: warn

  report:
    needs: [plan, run]
    if: ${{ !cancelled() && needs.plan.outputs.run == 'true' }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || 'cmux-linux' }}
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: false
          sparse-checkout: scripts/cmux-next/degenerate-lab

      - name: Fetch every job's results
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: degenerate-lab-run-*
          path: ${{ runner.temp }}/degenerate-lab-jobs

      - name: Merge them
        id: merge
        run: |
          set -uo pipefail
          status=0
          python3 -I scripts/cmux-next/degenerate-lab/lab.py merge --out "$RUNNER_TEMP/degenerate-lab" \
            "$RUNNER_TEMP/degenerate-lab-jobs" || status=$?
          cat "$RUNNER_TEMP/degenerate-lab/summary.md" >> "$GITHUB_STEP_SUMMARY" || true
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Keep the god-small rows
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: degenerate-lab-god-small
          path: |
            ${{ runner.temp }}/degenerate-lab/god-small.json
            ${{ runner.temp }}/degenerate-lab/summary.md
          retention-days: 3
          if-no-files-found: warn

      # Marked once every job finished, a panic included: a red run is a finding for the report, and
      # re-running the whole matrix on each later push that day would not change it.
      - name: Mark tonight's run done
        id: mark
        if: github.event_name == 'push' && needs.run.result != 'cancelled'
        run: mkdir -p "$RUNNER_TEMP/degenerate-lab-marker" && date -u > "$RUNNER_TEMP/degenerate-lab-marker/at"

      - name: Save tonight's marker
        if: steps.mark.outcome == 'success'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/degenerate-lab-marker
          key: ${{ needs.plan.outputs.key }}

      - name: Fail on a failed run
        if: steps.merge.outputs.status != '0'
        run: |
          echo "a lab run failed; its LAB-FAIL lines are in 'Merge them' above and in its own job" >&2
          exit 1
