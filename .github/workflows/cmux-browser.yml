name: cmux-browser

on:
  workflow_call:
  push:
    branches: [main]
    paths:
      - "cmux-browser/**"
      - ".github/workflows/cmux-browser.yml"

permissions:
  contents: read

concurrency:
  # Reusable calls inherit the caller's `github.workflow` value. Keep this
  # explicit so a CI call cannot collide with and cancel its own caller.
  group: cmux-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-tests:
    # Browser pull requests are untrusted code and must not run on a
    # configurable self-hosted runner with private network access.
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || vars.CI_PR_CONTROL_SKIP_FLEET != '1' && 'cmux-gcp-pr-control-jit-x64' || contains(fromJSON('["ubuntu-24.04","blacksmith-2vcpu-ubuntu-2404","blacksmith-4vcpu-ubuntu-2404","blacksmith-8vcpu-ubuntu-2404"]'), vars.CI_TRUSTED_RUNNER) && vars.CI_TRUSTED_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }} # ephemeral-required: browser PRs run untrusted code; a fork PR takes GitHub-hosted (the pool registers every Blacksmith label), CI_TRUSTED_RUNNER picks the rest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Run Browser policy and host tests
        run: ./cmux-browser/scripts/run-host-tests.sh
