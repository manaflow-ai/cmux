name: cmux-browser

on:
  workflow_call:
  push:
    branches: [main]
    paths:
      - "cmux-browser/**"
      - ".github/workflows/cmux-browser.yml"

permissions:
  contents: read

concurrency:
  # Reusable calls inherit the caller's `github.workflow` value. Keep this
  # explicit so a CI call cannot collide with and cancel its own caller.
  group: cmux-browser-${{ github.ref }}
  cancel-in-progress: true

env:
  # Temporary REST budget attribution: one gh-call line per GitHub API call (scripts/ci/api_call_log/env.sh).
  BASH_ENV: ${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh

jobs:
  host-tests:
    # Browser pull requests are untrusted code and must not run on a
    # configurable self-hosted runner with private network access.
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || 'cmux-linux' }} # ephemeral-required: browser PRs run untrusted code
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Run Browser policy and host tests
        run: ./cmux-browser/scripts/run-host-tests.sh
