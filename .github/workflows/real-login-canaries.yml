name: Real-login canaries

# Agent and Cloud tests run on the shared model stub (tests/fixtures/model-stub on feat-cmux-next) and
# throwaway test accounts, so none of them needs a real model login. A real login runs only here: one
# canary per harness, once a week, so a change on the model side (a login format, a streaming change)
# still shows up without every test holding a long-lived login.
#
# This workflow holds no secret. It dispatches each harness's own workflow on its branch with its real-login
# input; that workflow's environment and branch policy decide which secret the run gets. GITHUB_TOKEN
# budget: one workflow-dispatch call per harness per week.
#
# A harness adds one line to the matrix below: its workflow, its ref and the inputs of its real-login mode.
on:
  schedule:
    # Mondays 15:17 UTC (off the hour, outside the nightly cut).
    - cron: "17 15 * * 1"
  workflow_dispatch:
    inputs:
      only:
        description: Dispatch only this harness's workflow file (empty for every one)
        required: false
        default: ""
        type: string

permissions: {}

concurrency:
  group: real-login-canaries
  cancel-in-progress: false

env:
  # Temporary REST budget attribution: one gh-call line per GitHub API call (scripts/ci/api_call_log/env.sh, fetched at a fixed commit when the checkout has no copy).
  BASH_ENV: '$({ w="${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh"; t="${RUNNER_TEMP:-/nonexistent}/api-call-log-src"; if [ -f "$w" ]; then echo "$w"; elif [ -n "${RUNNER_TEMP:-}" ]; then if [ ! -f "$t/env.sh" ] && [ ! -e "$t.tried" ] && { [ "${RUNNER_OS:-}" = Linux ] || [ "${RUNNER_OS:-}" = macOS ]; } && [ "$(date -u +%Y%m%d%H)" -lt 2026112300 ]; then : > "$t.tried"; mkdir -p "$t.part" && for x in env.sh gh sitecustomize.py isolated.py; do curl -fsSL --max-time 5 -o "$t.part/$x" "https://raw.githubusercontent.com/manaflow-ai/cmux/27647ffd3ae838c63be28ca3e5883dcd68c34518/scripts/ci/api_call_log/$x" || break; done; [ -s "$t.part/isolated.py" ] && mv "$t.part" "$t"; fi; if [ -f "$t/env.sh" ]; then echo "$t/env.sh"; else echo unset BASH_ENV > "$t.off.sh" && echo "$t.off.sh"; fi; fi; } 2>/dev/null)'

jobs:
  dispatch:
    # main only: a dispatch from any other branch would run that branch's copy with actions: write.
    if: github.repository == 'manaflow-ai/cmux' && github.ref == 'refs/heads/main'
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.CI_OVERFLOW_LINUX || 'cmux-linux' }}
    timeout-minutes: 20
    permissions:
      contents: read # check out the GitHub API wait
      actions: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - workflow: machine-vault-e2e.yml
            ref: refs/heads/feat-cmux-next
            inputs: '{"model":"real"}'
    env:
      # A scheduled job's GitHub API waits stop here and fail loud (scripts/ci/gh_budget_wait.sh).
      GH_BUDGET_WAIT_MAX_SECONDS: "900"
    steps:
      # This commit's GitHub API wait (scripts/ci/gh_budget_wait.sh): every later gh call, and
      # each github-script step that installs gh_budget_wait.cjs, waits through a rate limit or a
      # GitHub 5xx under the job's GH_BUDGET_WAIT_MAX_SECONDS, then fails loud.
      - name: Checkout the GitHub API wait
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: .gh-budget-tooling
          sparse-checkout: |
            scripts/ci/gh_budget_wait.sh
            scripts/ci/gh_budget_wait.cjs
          sparse-checkout-cone-mode: false
      - name: Wait through GitHub API rate limits and 5xx in this job
        working-directory: ${{ github.workspace }}
        run: bash .gh-budget-tooling/scripts/ci/gh_budget_wait.sh --install

      - name: Dispatch ${{ matrix.workflow }} with its real login
        if: inputs.only == '' || inputs.only == matrix.workflow
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW: ${{ matrix.workflow }}
          REF: ${{ matrix.ref }}
          INPUTS: ${{ matrix.inputs }}
        run: |
          set -euo pipefail
          jq -n --arg ref "$REF" --argjson inputs "$INPUTS" '{ref: $ref, inputs: $inputs}' |
            gh api -X POST "repos/$GITHUB_REPOSITORY/actions/workflows/$WORKFLOW/dispatches" --input -
          echo "dispatched $WORKFLOW on $REF with $INPUTS" | tee -a "$GITHUB_STEP_SUMMARY"
