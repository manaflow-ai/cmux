name: cmux-next-ios kit tests

# CmuxMobileKit (cmux-next-ios/CmuxMobileKit), the cmux-next iPhone app's
# packages. Before this workflow no job ran its tests: the package's binary
# target, Frameworks/CmuxMobileLinkFFI.xcframework, is gitignored and built
# from cmux-next-ios/rust (cmux-mobile-link-ffi), so a plain checkout cannot
# even load the package.
#
# One macOS job:
# - builds the xcframework (iOS and iOS simulator slices) with
#   cmux-next-ios/rust/scripts/build-xcframework.sh, which also typechecks the
#   generated bindings and links them for the simulator, and checks that the
#   checked-in CmuxMobileLinkFFI.swift matches what it generated;
# - runs `swift test` on macOS (the package's tests are Swift Testing suites;
#   on macOS the FFI and libghostty targets drop out by platform condition);
# - runs the tests on an iOS simulator (`xcodebuild test`): the live link
#   coordinator, its banner and the FFI transport are iOS only, and #23829 left an
#   ambiguous type that only the iOS build saw.
# The Linux picker offers an idle owned simulator Mac first, with Blacksmith
# as fallback. The persistent-pool rescue watches stalled owned jobs.
# Notes (*.md) and cmux-next-ios/verify/ evidence are not the kit: a change to
# only those builds and tests nothing new (cmux#43251, SECURITY.md and
# verify/parity-mac.md, took a simulator Mac and went red on kit tests it never
# touched). A package's Resources/ stays in: SwiftPM bundles what is there.
# The last matching pattern wins, so the negations come after the includes they
# narrow and before the ones they re-include. Same rule as ios-review-gate.yml
# (#43476).
# A feat-cmux-next pull request runs these tests as the `ios-kit` step of ci/steps.toml (pr-pipeline.yml's ios
# job, CI v2 step 11); this workflow keeps the push to feat-cmux-next (with the advisory Instant list bench) and the
# dispatch main's nightly cron sends.
on:
  push:
    branches: [feat-cmux-next]
    paths:
      - "cmux-next-ios/**"
      # The local packages CmuxMobileKit depends on, transitively (scripts/ci/ios_app_package_paths.py --check keeps this list exact).
      - "Packages/Shared/CMUXAuthCore/**"
      - "Packages/Shared/CMUXMobileCore/**"
      - "Packages/Shared/CmuxAgentBrands/**"
      - "Packages/Shared/CmuxAgentQuestion/**"
      - "Packages/Shared/CmuxAuthRuntime/**"
      - "Packages/Shared/CmuxChiefList/**"
      - "Packages/Shared/CmuxChiefVoiceCore/**"
      - "Packages/Shared/CmuxConnectivityTelemetry/**"
      - "Packages/Shared/CmuxDeviceHub/**"
      - "Packages/Shared/CmuxEgress/**"
      - "Packages/Shared/CmuxGhosttyKit/**"
      - "Packages/Shared/CmuxHomeCore/**"
      - "Packages/Shared/CmuxScreenKit/**"
      - "Packages/Shared/CmuxSpinner/**"
      - "Packages/Shared/CmuxTheme/**"
      - "Packages/Shared/CmuxVNC/**"
      - "Packages/Shared/CmuxVNCWebRTC/**"
      - "Packages/iOS/CmuxConversation/**"
      - "Packages/iOS/CmuxMobileBilling/**"
      - "Packages/iOS/CmuxMobileSupport/**"
      - "Packages/iOS/CmuxTabsKit/**"
      - "vendor/stack-auth-swift-sdk-prerelease/**"
      # The toolchains it uses.
      - ".github/actions/setup-cmux-tui-rust/**"
      - ".github/actions/runner-cargo-home/**"
      - "cmux-tui/rust-toolchain.toml"
      - "scripts/select-ci-xcode.sh"
      - "scripts/ci/xcode-pins.txt"
      - ".xcode-version"
      - ".github/workflows/cmux-next-ios-kit.yml"
      - "scripts/ci/ios_app_package_paths.py"
      - "scripts/ci/ios_link_ffi_key.py"
      # The pool phone's runner for the kit's simulator tests (the sim-linux steps run it at this commit).
      - "scripts/ci/ios-sim-linux-test.sh"
      - "scripts/ci/ios_sim_logic_xctestrun.py"
      - "!**/*.md"
      - "!cmux-next-ios/verify/**"
      # Except the fixtures the kit's own tests read (AgentCLIHybridProofSupport, AgentCLIHybridFrameTests):
      # #51565 regenerated them with no kit run, and feat-cmux-next went red on AgentCLIHybridProofTests.
      - "cmux-next-ios/verify/agent-cli-hybrid/**"
      # Agent tools beside the app (review.sh, try.sh, the hand-off host) and the mobile Worker (its own deploy
      # workflows) build nothing in the iPhone app: no kit run and no iPhone try build-ahead for them
      # (scripts/cmux-next/build_select.py reads this filter). The scripts the kit or the app build reads stay in.
      - "!cmux-next-ios/scripts/**"
      - "!cmux-next-ios/backend/**"
      - "cmux-next-ios/scripts/instant_perf_table.py"
      - "cmux-next-ios/scripts/generate-launch-mark.swift"
      - "cmux-next-ios/scripts/check-notification-extension.sh"
      - "cmux-next-ios/scripts/check-production-binary.sh"
      - "cmux-next-ios/CmuxMobileKit/**/Resources/**"
      - "Packages/Shared/**/Resources/**"
      - "Packages/iOS/**/Resources/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A new push to a pull request cancels its previous run; feat-cmux-next pushes never cancel.
  # A dispatch (main's nightly cron) gets a group of its own: with cancel-in-progress false,
  # GitHub still cancels a run that is pending in a group when a newer one joins it, so the
  # nightly, queued behind a running push run, was dropped by the next push (43572826977,
  # 2026-11-14, by push run 43574629185), and the bench went stale.
  group: cmux-next-ios-kit-${{ github.ref }}${{ github.event_name == 'workflow_dispatch' && format('-dispatch-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Temporary REST budget attribution: one gh-call line per GitHub API call (scripts/ci/api_call_log/env.sh, fetched at a fixed commit when the checkout has no copy).
  BASH_ENV: '$({ w="${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh"; t="${RUNNER_TEMP:-/nonexistent}/api-call-log-src"; if [ -f "$w" ]; then echo "$w"; elif [ -n "${RUNNER_TEMP:-}" ]; then if [ ! -f "$t/env.sh" ] && [ ! -e "$t.tried" ] && { [ "${RUNNER_OS:-}" = Linux ] || [ "${RUNNER_OS:-}" = macOS ]; } && [ "$(date -u +%Y%m%d%H)" -lt 2026112300 ]; then : > "$t.tried"; mkdir -p "$t.part" && for x in env.sh gh sitecustomize.py isolated.py; do curl -fsSL --max-time 5 -o "$t.part/$x" "https://raw.githubusercontent.com/manaflow-ai/cmux/27647ffd3ae838c63be28ca3e5883dcd68c34518/scripts/ci/api_call_log/$x" || break; done; [ -s "$t.part/isolated.py" ] && mv "$t.part" "$t"; fi; if [ -f "$t/env.sh" ]; then echo "$t/env.sh"; else echo unset BASH_ENV > "$t.off.sh" && echo "$t.off.sh"; fi; fi; } 2>/dev/null)'

jobs:
  # Pick an idle owned Mac with an iOS simulator, then fall back to Blacksmith
  # on retries. Keeping this picker ahead of the test job lets the rescue
  # sweeper re-admit a job that stalls on a dead owned label.
  runner:
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft != true || contains(github.event.pull_request.labels.*.name, 'full-ci') || (vars.CI_DRAFT_CHEAP_TIER || '1') == '0') }}
    environment: ${{ !contains(fromJSON('["pull_request","merge_group"]'), github.event_name) && 'ci-routing-agent' || '' }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-4vcpu-ubuntu-2404' || contains(fromJSON('["blacksmith-4vcpu-ubuntu-2404","blacksmith-8vcpu-ubuntu-2404","blacksmith-16vcpu-ubuntu-2404"]'), vars.LINUX_RUNNER) && vars.LINUX_RUNNER || vars.CI_CLOUD_OVERFLOW_SAVED && fromJSON(vars.RUNNER_POOLS).linux_16 || fromJSON(vars.RUNNER_POOLS).linux_8 }}
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      runs_on: ${{ steps.pool.outputs.runs_on }}
      retry_runs_on: ${{ steps.pool.outputs.retry_runs_on }}
      label: ${{ steps.pool.outputs.label }}
      persistent: ${{ steps.pool.outputs.persistent }}
      # Same-tree reuse (scripts/ci/same_tree_reuse.py): kit-tests already passed on this merge tree.
      same_tree: ${{ steps.same-tree.outputs.same_tree }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: |
            scripts/ci/ios_runner_pool.py
            scripts/ci/e2e_runner_pool.py
            scripts/ci/pr_runner_pool.py
            scripts/ci/github_spend.py
            scripts/ci/deadline_http.py
            scripts/ci/simple_pool_picker.py
            scripts/ci/warm_distance.py
            scripts/ci/same_tree_reuse.py
            .gitmodules
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Mint the owned-pool routing token
        id: route-token
        if: (github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && vars.CI_PR_POOL_OWNED == '1' && vars.CI_IOS_OWNED == '1' && vars.GLAEDA_ROUTE_APP_ID != ''
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.GLAEDA_ROUTE_APP_ID }}
          private-key: ${{ secrets.GLAEDA_ROUTE_APP_KEY }}
          permission-administration: read
          # Queue, job and capacity-snapshot reads use this App's quota.
          permission-actions: read
          permission-organization-self-hosted-runners: read
      - name: Mint the repository routing token
        id: route-token-repo
        if: steps.route-token.outcome == 'failure'
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.GLAEDA_ROUTE_APP_ID }}
          private-key: ${{ secrets.GLAEDA_ROUTE_APP_KEY }}
          permission-administration: read
          permission-actions: read
      - name: Pick the macOS pool
        id: pool
        env:
          # The overflow switch the granted default reads (ios_runner_pool.py granted_default()).
          CI_OVERFLOW_MAC: ${{ vars.CI_OVERFLOW_MAC }}
          CI_RUNNER_STATE: ${{ vars.CI_RUNNER_STATE }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ROUTE_TOKEN: ${{ steps.route-token.outputs.token || steps.route-token-repo.outputs.token }}
          FORK_PULL_REQUEST: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          RUNNER_VARIABLE: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-6vcpu-macos-26' || vars.MACOS_RUNNER_TESTS || vars.MACOS_RUNNER_IOS }}
          IOS_OWNED: ${{ vars.CI_IOS_OWNED }}
          POOL_OWNED: ${{ vars.CI_PR_POOL_OWNED }}
          OWNED_SLOTS: ${{ vars.CI_OWNED_POOL_SLOTS }}
          PR_XCODE_APP: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && vars.CMUX_CI_XCODE_APP_PR || '' }}
          POOL_ORDER: ${{ vars.CI_PR_POOL_ORDER }}
          POOL_MAX_QUEUED: ${{ vars.CI_PR_POOL_MAX_QUEUED }}
        run: |
          set -euo pipefail
          python3 scripts/ci/ios_runner_pool.py \
            --lane kit --fork "$FORK_PULL_REQUEST" --requested auto \
            --variable "$RUNNER_VARIABLE" --ios-owned "$IOS_OWNED" --owned "$POOL_OWNED" \
            --owned-slots "$OWNED_SLOTS" --pr-xcode-app "$PR_XCODE_APP" --order "$POOL_ORDER" \
            --max-queued "$POOL_MAX_QUEUED" --queue-rounds 0 \
            --device-family iphone | tee -a "$GITHUB_OUTPUT"
      - name: Create the owned-pool marker
        id: marker
        if: steps.pool.outputs.persistent == 'true' && github.run_attempt == 1
        continue-on-error: true
        run: |
          set -euo pipefail
          marker="$RUNNER_TEMP/macos-pool-persistent.json"
          echo '{}' > "$marker"
          echo "path=$marker" >> "$GITHUB_OUTPUT"
      - name: Upload the persistent pool marker
        if: steps.marker.outputs.path != ''
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-pool-persistent-${{ github.run_id }}-${{ github.run_attempt }}-1-${{ steps.pool.outputs.label }}
          path: ${{ steps.marker.outputs.path }}
          retention-days: 1
      - name: Upload the simulator capacity marker
        if: steps.marker.outputs.path != ''
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-pool-persistent-${{ github.run_id }}-${{ github.run_attempt }}-1-glaeda-ios-sim
          path: ${{ steps.marker.outputs.path }}
          retention-days: 1
      - name: Upload the owned-pool watch marker
        if: steps.marker.outputs.path != ''
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: owned-pool-watch
          path: ${{ steps.marker.outputs.path }}
          retention-days: 1

      # Same-tree reuse: a pass of kit-tests on this exact merge tree and workflow file (a re-push of the same
      # tree, a reopen, a re-run) is not run again; the Mac is never taken. The key is the merge commit's tree,
      # the job and this file's blob; the receipt is an Actions cache entry kit-tests wrote on its pass, which
      # only this pull request's runs and its base can write. 10% of hits still run in full
      # (CI_SAME_TREE_AUDIT_PERCENT), and a red there names the receipt. CI_SAME_TREE_REUSE=0 turns it off.
      - name: Same-tree keys
        id: same-tree-keys
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && (vars.CI_SAME_TREE_REUSE || '1') != '0' }}
        continue-on-error: true
        run: python3 scripts/ci/same_tree_reuse.py keys --workflow .github/workflows/cmux-next-ios-kit.yml --jobs kit-tests >> "$GITHUB_OUTPUT"
      - name: Look up a same-tree pass of kit-tests
        id: same-tree-kit-tests
        if: ${{ steps.same-tree-keys.outputs.kit-tests != '' }}
        continue-on-error: true
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          # One relative path for the save and the restore: the cache version hashes it, and runner.temp differs
          # between the Linux runner and the Mac.
          path: .same-tree/kit-tests
          enableCrossOsArchive: true
          key: ${{ steps.same-tree-keys.outputs.kit-tests }}
      - name: Same-tree decision
        id: same-tree
        if: ${{ steps.same-tree-keys.outputs.keys != '' }}
        continue-on-error: true
        env:
          KEYS: ${{ steps.same-tree-keys.outputs.keys }}
          HITS: kit-tests=${{ steps.same-tree-kit-tests.outputs.cache-hit }}
          AUDIT_PERCENT: ${{ vars.CI_SAME_TREE_AUDIT_PERCENT }}
        run: |
          python3 scripts/ci/same_tree_reuse.py decide --keys "$KEYS" --hits "$HITS" \
            --receipts .same-tree --audit-percent "$AUDIT_PERCENT" >> "$GITHUB_OUTPUT"

  # Run the source-only lint on Linux when the Mac kit needs a fresh verdict.
  # Keep its exit status on the public kit check and let the advisory benches run after a failure.
  connection-notices:
    needs: runner
    if: ${{ !fromJSON(needs.runner.outputs.same_tree || '{}')['kit-tests'].reuse }}
    timeout-minutes: 10
    outputs:
      lint_result: ${{ steps.scan.outcome }}
    permissions:
      contents: read
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-4vcpu-ubuntu-2404' || contains(fromJSON('["blacksmith-4vcpu-ubuntu-2404","blacksmith-8vcpu-ubuntu-2404","blacksmith-16vcpu-ubuntu-2404"]'), vars.LINUX_RUNNER) && vars.LINUX_RUNNER || vars.CI_CLOUD_OVERFLOW_SAVED && fromJSON(vars.RUNNER_POOLS).linux_16 || fromJSON(vars.RUNNER_POOLS).linux_8 }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Connection notices
        id: scan
        # The kit check below publishes the lint failure after its advisory benches run.
        continue-on-error: true
        run: python3 -I scripts/cmux-next/check-connection-notices.py --root "$GITHUB_WORKSPACE"

  # The FFI xcframework kit-tests links, built on the build fleet while kit-tests waits for a Mac (the build was
  # 3.3-5.0 min of every Mac kit run on 2026-11-24, and its Mac cache key, which names the Xcode, missed across
  # pools). The gateway runner only hands the build to the controller (cmux-ci ios-build) and passes the result on
  # as an Actions cache entry keyed on the inputs alone, and as this run's artifact. Never a verdict: no client,
  # no answer or a red here is a warning, and kit-tests then builds it on the Mac as before. CI_IOS_FFI_FLEET=0
  # turns it off.
  link-ffi-fleet:
    name: CmuxMobileLinkFFI.xcframework (build fleet)
    needs: runner
    if: ${{ !cancelled() && needs.runner.result == 'success' && github.repository_owner == 'manaflow-ai' && (vars.CI_IOS_FFI_FLEET || '1') != '0' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && !fromJSON(needs.runner.outputs.same_tree || '{}')['kit-tests'].reuse }}
    # A Linux runner: the controller's public route builds on the fleet and this job only waits for the answer, so no
    # Mac sits idle for the build (scripts/ci/fleet_ios_build.py). The hosted fallback never schedules: the job's if:
    # skips outside manaflow-ai.
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || 'cmux-linux' }}
    timeout-minutes: 40  # the reader waits up to 600 s queued plus 1500 s running
    permissions:
      contents: read
      id-token: write  # the route reads the repository and the commit from this job's OIDC token
    steps:
      # The key reads git objects only (scripts/ci/ios_link_ffi_key.py), so a blobless sparse checkout is enough.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          filter: blob:none
          sparse-checkout: scripts/ci
          persist-credentials: false

      - name: CmuxMobileLinkFFI.xcframework key
        id: key
        continue-on-error: true
        run: |
          set -euo pipefail
          inputs="$(python3 scripts/ci/ios_link_ffi_key.py)"
          echo "key=cmux-next-ios-link-ffi-xcf-fleet-v1-${inputs}" >> "$GITHUB_OUTPUT"

      - name: Restore CmuxMobileLinkFFI.xcframework
        id: restore
        if: steps.key.outputs.key != ''
        continue-on-error: true
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          # The same relative path and archive flag as kit-tests' restore: the cache version hashes both.
          path: cmux-next-ios/CmuxMobileKit/Frameworks/CmuxMobileLinkFFI.xcframework
          enableCrossOsArchive: true
          key: ${{ steps.key.outputs.key }}
          lookup-only: true

      # Exit 0 is the xcframework (its bindings matched the checked-in ones), 1 a failed build, anything else no
      # answer. Only 0 hands anything on.
      - name: Build CmuxMobileLinkFFI.xcframework on the build fleet
        id: build
        if: steps.restore.outputs.cache-hit != 'true'
        run: |
          set -uo pipefail
          out="$RUNNER_TEMP/link-ffi"
          status=0
          python3 scripts/ci/fleet_ios_build.py --what ffi --out "$out" --timeout 1500 --queue-timeout 600 || status=$?
          if [[ "$status" != 0 || ! -f "$out/CmuxMobileLinkFFI.xcframework/Info.plist" ]]; then
            echo "::warning title=build fleet::no xcframework from the build fleet (exit $status); kit-tests builds it"
            exit 0
          fi
          dest=cmux-next-ios/CmuxMobileKit/Frameworks
          mkdir -p "$dest"
          rm -rf "$dest/CmuxMobileLinkFFI.xcframework"
          cp -R "$out/CmuxMobileLinkFFI.xcframework" "$dest/"
          echo "built=true" >> "$GITHUB_OUTPUT"

      - name: Save CmuxMobileLinkFFI.xcframework
        if: steps.build.outputs.built == 'true' && steps.key.outputs.key != ''
        continue-on-error: true
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: cmux-next-ios/CmuxMobileKit/Frameworks/CmuxMobileLinkFFI.xcframework
          enableCrossOsArchive: true
          key: ${{ steps.key.outputs.key }}

      - name: Hand CmuxMobileLinkFFI.xcframework to kit-tests
        if: steps.build.outputs.built == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-next-ios-link-ffi-xcframework
          path: cmux-next-ios/CmuxMobileKit/Frameworks/CmuxMobileLinkFFI.xcframework
          retention-days: 1
          if-no-files-found: error

  kit-tests:
    needs: [runner, connection-notices]
    name: CmuxMobileKit tests (macOS swift test, iOS simulator)
    # Runs on every pull request this workflow's paths match (cmux-next-ios/**, the packages CmuxMobileKit links), with
    # no full-ci label: as a Tier B skip, iOS PRs merged untested and were fixed forward over days (Leo, 2026-11-22:
    # "if 80% of code doesn't have a way of having a proper pr in the hour, then our fucking codebase is not good enough").
    # Also skipped before it takes a Mac when it already passed on this tree (the runner job's same-tree decision).
    if: ${{ !cancelled() && needs.runner.result == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.draft != true || contains(github.event.pull_request.labels.*.name, 'full-ci') || (vars.CI_DRAFT_CHEAP_TIER || '1') == '0') && !fromJSON(needs.runner.outputs.same_tree || '{}')['kit-tests'].reuse }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-6vcpu-macos-26' || fromJSON(github.run_attempt > 1 && needs.runner.outputs.retry_runs_on || needs.runner.outputs.runs_on) }}
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read  # the fleet-built xcframework: this run's jobs and artifacts
    env:
      CMUX_CI_XCODE_APP: ${{ github.run_attempt == 1 && startsWith(needs.runner.outputs.label, 'glaeda-') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.CMUX_CI_XCODE_APP_PR || '' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Connection notices
        env:
          LINT_RESULT: ${{ needs.connection-notices.outputs.lint_result }}
        run: test "$LINT_RESULT" = success

      # These four steps are what the Instant list bench below builds with, so they run after a red
      # step too, as the bench does: a red Connection notices skipped them, and the bench then printed
      # no INSTANTPERF line for over a day on base (run 45149422676; three findings in files the bench
      # never reads). The job stays red from the step that failed
      # (tests/test_ios_kit_bench_runs_after_red_step.py).
      - name: Select Xcode
        if: ${{ !cancelled() }}
        run: ./scripts/select-ci-xcode.sh

      # cmux-next-ios/rust pins the same toolchain as cmux-tui (1.95.0).
      - name: Set up pinned Rust
        if: ${{ !cancelled() }}
        uses: ./.github/actions/setup-cmux-tui-rust

      - name: Cache cargo
        if: ${{ !cancelled() }}
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && github.event_name != 'merge_group' && contains(fromJSON('["refs/heads/main","refs/heads/feat-cmux-next","refs/heads/nightly-next"]'), github.ref) }}
          # Why: docs/ci/cmux-next-workflow-notes.md#note-210 (pool runners keep different leftover toolchains)
          add-rust-environment-hash-key: false
          cache-bin: false
          workspaces: cmux-next-ios/rust
          key: cmux-next-ios-kit-${{ hashFiles('cmux-tui/rust-toolchain.toml', 'cmux-next-ios/rust/Cargo.lock', '.cargo/config.toml') }}

      # The xcframework is reused when nothing it is built from changed: the key is the git tree ids of every package
      # the FFI library compiles (its path dependencies into cmux-tui included), the lock, the toolchain, the build
      # script and the checked-in bindings (scripts/ci/ios_link_ffi_key.py), plus the selected Xcode. Only a build
      # whose bindings matched the checked-in ones saves it, so a hit has passed that check on the same inputs. The
      # build took 3.3-4.4 min of every kit run (2026-11-24); the key changed 5 times over 150 feat-cmux-next commits.
      # A key that cannot be read (no Python 3.11 tomllib, a missing manifest) builds, as before.
      - name: CmuxMobileLinkFFI.xcframework key
        id: xcf-key
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          set -euo pipefail
          inputs="$(python3 scripts/ci/ios_link_ffi_key.py)"
          xcode="$(xcodebuild -version | tr -cs 'A-Za-z0-9.' '-')"
          echo "key=cmux-next-ios-link-ffi-xcf-${RUNNER_OS}-${RUNNER_ARCH}-${xcode}-${inputs}" >> "$GITHUB_OUTPUT"
          echo "fleet_key=cmux-next-ios-link-ffi-xcf-fleet-v1-${inputs}" >> "$GITHUB_OUTPUT"

      - name: Restore CmuxMobileLinkFFI.xcframework
        id: xcf-restore
        if: ${{ !cancelled() && steps.xcf-key.outputs.key != '' }}
        continue-on-error: true
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: cmux-next-ios/CmuxMobileKit/Frameworks/CmuxMobileLinkFFI.xcframework
          key: ${{ steps.xcf-key.outputs.key }}

      # The build fleet's copy (link-ffi-fleet above): its cache entry when the inputs were built before, else this
      # run's artifact, waited for while that job runs (not while it is queued), at most 4 min (the Mac build takes 3.3-5.0). A copy that
      # never comes is built here.
      - name: Restore the fleet-built CmuxMobileLinkFFI.xcframework
        id: xcf-fleet-restore
        if: ${{ !cancelled() && steps.xcf-key.outputs.fleet_key != '' && steps.xcf-restore.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: cmux-next-ios/CmuxMobileKit/Frameworks/CmuxMobileLinkFFI.xcframework
          enableCrossOsArchive: true
          key: ${{ steps.xcf-key.outputs.fleet_key }}

      - name: Wait for the fleet-built CmuxMobileLinkFFI.xcframework
        id: xcf-fleet
        if: ${{ !cancelled() && steps.xcf-restore.outputs.cache-hit != 'true' && steps.xcf-fleet-restore.outputs.cache-hit != 'true' && github.repository_owner == 'manaflow-ai' && (vars.CI_IOS_FFI_FLEET || '1') != '0' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        continue-on-error: true
        timeout-minutes: 6
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: repos/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ATTEMPT: ${{ github.run_attempt }}
          JOB: CmuxMobileLinkFFI.xcframework (build fleet)
          ARTIFACT: cmux-next-ios-link-ffi-xcframework
        run: |
          set -uo pipefail
          dest=cmux-next-ios/CmuxMobileKit/Frameworks/CmuxMobileLinkFFI.xcframework
          deadline=$((SECONDS + 240))
          while :; do
            id="$(gh api "$RUN/artifacts?name=$ARTIFACT" --jq '[.artifacts[] | select(.expired | not)][0].id // empty' 2>/dev/null || true)"
            if [[ -n "$id" ]]; then
              rm -rf "$dest" "$RUNNER_TEMP/link-ffi.zip"
              mkdir -p "$dest"
              if gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "$RUNNER_TEMP/link-ffi.zip" \
                && unzip -q "$RUNNER_TEMP/link-ffi.zip" -d "$dest" && [[ -f "$dest/Info.plist" ]]; then
                echo "fleet-built xcframework after $SECONDS s"
                echo "hit=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              rm -rf "$dest"
              echo "::warning::the fleet-built xcframework did not download; building it here"
              exit 0
            fi
            state="$(gh api "$RUN/attempts/$ATTEMPT/jobs?per_page=100" --jq "[.jobs[] | select(.name == \"$JOB\")][0].status // \"absent\"" 2>/dev/null || echo unknown)"
            # Only a running build is worth waiting for: one still queued for a gateway would not finish in time.
            if [[ "$state" != in_progress ]]; then
              echo "no fleet-built xcframework ($JOB: $state); building it here"
              exit 0
            fi
            if (( SECONDS >= deadline )); then
              echo "no fleet-built xcframework within 240 s ($JOB: $state); building it here"
              exit 0
            fi
            sleep 15
          done

      - name: Build CmuxMobileLinkFFI.xcframework
        if: ${{ !cancelled() && steps.xcf-restore.outputs.cache-hit != 'true' && steps.xcf-fleet-restore.outputs.cache-hit != 'true' && steps.xcf-fleet.outputs.hit != 'true' }}
        env:
          JOBS: "8"
        run: bash cmux-next-ios/rust/scripts/build-xcframework.sh

      - name: Checked-in bindings match the generated ones
        run: |
          set -euo pipefail
          # The xcframework and target/ are gitignored; the script rewrites the bindings
          # and restores Cargo.lock, so any tracked change is drift.
          if ! git diff --exit-code -- cmux-next-ios/; then
            echo "::error::build-xcframework.sh changed tracked files (CmuxMobileLinkFFI.swift or Cargo.lock). The base autofix regenerates the bindings (scripts/ios-ffi-bindings.sh, base-autofix.sh --ios-ffi); a pull request's autofix re-run does too"
            exit 1
          fi

      - name: Save CmuxMobileLinkFFI.xcframework
        if: ${{ success() && steps.xcf-key.outputs.key != '' && steps.xcf-restore.outputs.cache-hit != 'true' && steps.xcf-fleet-restore.outputs.cache-hit != 'true' && steps.xcf-fleet.outputs.hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: cmux-next-ios/CmuxMobileKit/Frameworks/CmuxMobileLinkFFI.xcframework
          key: ${{ steps.xcf-key.outputs.key }}

      # The iOS simulator tests on the fleet pool (vars.CMUX_IOS_SIM_LINUX): this Mac builds them for testing and
      # packs the products, and a pool phone runs them (scripts/ci/ios-sim-linux-test.sh) while the macOS swift test
      # runs here. "shadow": the pool run is advisory and the simulator step below still runs, so both are timed on
      # one head. "on": the pool's verdict is the check, and the simulator step below runs only when the pool gave
      # none (logged "Mac fallback"). Unset: "shadow". "off" (or anything else): as before. This repository only.
      # An owned Mac submits the pool run itself (below); a Blacksmith Mac is no tailnet peer of the controller, so
      # it only builds and uploads, and the kit-sim-pool job (an owned Linux runner) submits and reports. Every base
      # kit run of 2026-11-25 07:53-09:10 got a Blacksmith Mac (the owned simulator Macs were full), and the pool ran
      # on none of them.
      - name: Build the iOS simulator tests for the pool
        id: sim-pack
        if: ${{ !cancelled() && contains(fromJSON('["shadow","on"]'), vars.CMUX_IOS_SIM_LINUX || 'shadow') && github.repository == 'manaflow-ai/cmux' && !(github.event_name == 'pull_request' && startsWith(runner.name, 'blacksmith')) && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        continue-on-error: true
        timeout-minutes: 20
        working-directory: cmux-next-ios/CmuxMobileKit
        run: |
          set -euo pipefail
          start=$(date +%s)
          derived="${CMUX_DERIVED_DATA_SLOT:-$RUNNER_TEMP/dd-ios-sim}"
          xcodebuild build-for-testing -scheme CmuxMobileKit-Package -destination 'generic/platform=iOS Simulator' \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO -enableCodeCoverage NO -derivedDataPath "$derived" CODE_SIGNING_ALLOWED=NO -quiet
          out="$RUNNER_TEMP/kit-sim-products"
          mkdir -p "$out"
          tar -C "$derived/Build" -czf "$out/ios-sim-build.tar.gz" Products
          plat="$(xcode-select -p)/Platforms/iPhoneSimulator.platform/Developer"
          tar -C "$plat" -czf "$out/ios-sim-xctest-platform.tar.gz" Library/Frameworks Library/PrivateFrameworks Library/Xcode/Agents usr/lib
          du -sh "$out"/*
          echo "build-for-testing and pack: $(( $(date +%s) - start )) s"

      - name: Upload the iOS simulator test build
        id: sim-upload
        if: ${{ !cancelled() && steps.sim-pack.outcome == 'success' }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kit-sim-products-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kit-sim-products
          retention-days: 1
          compression-level: 0

      # Submits from this owned Mac (a tailnet peer of the controller) and waits in the background, so the macOS
      # swift test below runs meanwhile; "Fleet pool result" collects it.
      - name: Start the fleet pool run
        id: sim-linux-start
        if: ${{ !cancelled() && steps.sim-upload.outcome == 'success' && !startsWith(runner.name, 'blacksmith') }}
        continue-on-error: true
        timeout-minutes: 2
        env:
          CONTROLLER: ${{ vars.CMUX_FLEET_CONTROLLER }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PRODUCTS: ${{ github.run_id }}/kit-sim-products-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          [[ -n "$CONTROLLER" ]] || { echo "no CMUX_FLEET_CONTROLLER variable"; exit 1; }
          client="$RUNNER_TEMP/fleet-client"
          mkdir -p "$client" "$RUNNER_TEMP/sim-linux"
          curl -fsS -m 30 "$CONTROLLER/v1/client/manifest" -o "$client/manifest.json"
          python3 - "$client" "$CONTROLLER" <<'PY'
          import hashlib, json, sys, urllib.request
          from pathlib import Path
          root, controller = Path(sys.argv[1]), sys.argv[2]
          for name, digest in json.loads((root / "manifest.json").read_text())["files"].items():
              if "/" in name or name.startswith("."):
                  raise SystemExit(f"bad client file name {name!r}")
              data = urllib.request.urlopen(f"{controller}/v1/client/files/{name}", timeout=30).read()
              if hashlib.sha256(data).hexdigest() != digest:
                  raise SystemExit(f"{name}: sha256 mismatch")
              (root / name).write_bytes(data)
          PY
          # The simulator step's skips (below), as test targets the pool run leaves out.
          date +%s > "$RUNNER_TEMP/sim-linux/started"
          CMUX_CI_CONTROLLER="$CONTROLLER" nohup bash -c '
            python3 "$0/ci-client.py" run --class simulator --os linux --script scripts/ci/ios-sim-linux-test.sh \
              --ref "$HEAD_SHA" --repo manaflow-ai/cmux --env "CMUX_IOS_PRODUCTS=$PRODUCTS" \
              --arg suite=kit --arg skip=CmuxMobileInstantPerfTests --arg skip=CmuxMobileDesignCoreTests --arg skip=CmuxMobileRealtimeTests \
              --arg skip=CmuxMobileTransportTests --arg timeout=1800 \
              --artifact artifacts/ios-sim-linux/result.tgz --timeout 2400 --queue-timeout 900
            echo $? > "$1/exit"; date +%s > "$1/finished"
          ' "$client" "$RUNNER_TEMP/sim-linux" > "$RUNNER_TEMP/sim-linux/step.log" 2>&1 &
          echo "submitted in the background (pid $!)"

      # The instant-list bench runs on its own below (no other suite on the cores). So do the suites
      # that bound wall-clock time or the process footprint: among 2580 parallel tests in one process
      # they measured their neighbours (reattach 1839 ms < 1000, 5194 ms < 5000, footprint 79 MB < 40 MB
      # on base runs 45081481908 and 45081946888), each run a different one.
      # Every test step runs after a red step (`!cancelled()`), so a red Connection notices lint, which reads
      # webviews/ as well, never skips the kit tests: from 2026-11-25 a web-only finding (GitHubConnectCard.tsx)
      # skipped every base run's tests, so the kit's own reds went unseen. The job stays red from the step that
      # failed (tests/test_ios_kit_bench_runs_after_red_step.py).
      - name: swift test (macOS)
        if: ${{ !cancelled() }}
      # CmuxMobileAuthTests, CmuxMobileDesignCoreTests, CmuxMobileModelTests, CmuxMobileNotificationsTests, CmuxMobileRealtimeTests and
      # CmuxMobileTransportTests run on Linux (swift-linux-packages.yml, group ios-kit); the simulator run below skips Realtime and Transport
      # too, and keeps Model for the one test Linux disables and Notifications for its UserNotifications tests.
        run: swift test --package-path cmux-next-ios/CmuxMobileKit --skip CmuxMobileInstantPerfTests --skip TerminalSelfRecoveryTests --skip MockTerminalStreamMemoryTests --skip CmuxMobileAuthTests --skip CmuxMobileDesignCoreTests --skip CmuxMobileModelTests --skip CmuxMobileNotificationsTests --skip CmuxMobileRealtimeTests --skip CmuxMobileTransportTests

      - name: swift test (macOS, measured suites alone)
        if: ${{ !cancelled() }}
        run: swift test --package-path cmux-next-ios/CmuxMobileKit --no-parallel --filter TerminalSelfRecoveryTests --filter MockTerminalStreamMemoryTests


      # LiveCoordinator, the banner and the FFI-backed transport are iOS only, so
      # their tests run only here. A simulator destination builds the arm64 slice
      # the xcframework has.
      - name: xcodebuild test (iOS simulator)
        id: ios-sim
        # A pull request that fell back to a Blacksmith Mac runs the macOS swift test only (about 1 min); the
        # simulator half ran 6 to 17 min there and was red on 8 tests of the base on 1,100+ runs (2026-11-24).
        # It still runs on an owned Mac, and on every feat-cmux-next push and dispatch, so the check moves, not goes.
        if: ${{ !cancelled() && !(github.event_name == 'pull_request' && startsWith(runner.name, 'blacksmith')) && (vars.CMUX_IOS_SIM_LINUX || 'shadow') != 'on' }}
        # About 3x its usual 10 min: a hung simulator ends the step, not the job's
        # 60 min with a macOS runner held (run 43604565423, 2026-11-14).
        timeout-minutes: 30
        working-directory: cmux-next-ios/CmuxMobileKit
        run: bash ../../scripts/ci/ios-kit-sim-mac-test.sh

      # verdict: pass, fail (the pool ran the tests and some failed) or none (no verdict: submit, queue, phone or
      # products trouble), with the reason. Never red itself: "Fleet pool verdict" and the simulator step act on it.
      - name: Fleet pool result
        id: sim-linux
        if: ${{ !cancelled() && contains(fromJSON('["shadow","on"]'), vars.CMUX_IOS_SIM_LINUX || 'shadow') && !startsWith(runner.name, 'blacksmith') }}
        timeout-minutes: 45
        env:
          STARTED: ${{ steps.sim-linux-start.outcome }}
          PACKED: ${{ steps.sim-pack.outcome }}
          UPLOADED: ${{ steps.sim-upload.outcome }}
        run: |
          set -uo pipefail
          dir="$RUNNER_TEMP/sim-linux"
          verdict=none
          if [[ "$PACKED" != success ]]; then
            reason="the simulator test build for the pool did not finish ($PACKED)"
          elif [[ "$UPLOADED" != success ]]; then
            reason="the simulator test build did not upload ($UPLOADED)"
          elif [[ "$STARTED" != success ]]; then
            reason="the pool run was not submitted ($STARTED)"
          else
            # The client bounds itself (queue 900 s, run 2400 s); this only outlasts it.
            for _ in $(seq 1 2700); do [[ -f "$dir/exit" ]] && break; sleep 1; done
            status="$(cat "$dir/exit" 2>/dev/null || echo unfinished)"
            step="$(grep -o -E 'step [0-9a-f]{24}' "$dir/step.log" | head -1 | cut -d' ' -f2)"
            if [[ -n "$step" ]]; then
              python3 "$RUNNER_TEMP/fleet-client/ci-client.py" artifact "$step" "$dir/result.tgz" \
                || python3 "$RUNNER_TEMP/fleet-client/ci-client.py" artifact --failed "$step" "$dir/result.tgz" || true
            fi
            [[ -s "$dir/result.tgz" ]] && mkdir -p "$dir/result" && tar -xzf "$dir/result.tgz" -C "$dir/result" 2>/dev/null
            if [[ -f "$dir/result/summary.txt" ]]; then
              cat "$dir/result/summary.txt"
              grep -E -A400 '<failure|<error' "$dir/result/junit.xml" 2>/dev/null | head -80 || true
            else
              tail -n 40 "$dir/step.log"
            fi
            cases="$(grep -c '<testcase' "$dir/result/junit.xml" 2>/dev/null || echo 0)"
            if [[ "$status" == 0 && "$cases" -gt 0 ]]; then
              verdict=pass; reason="step ${step:-?} passed $cases tests"
            elif [[ "$status" == 1 && "$cases" -gt 0 ]]; then
              verdict=fail; reason="step ${step:-?} ran $cases tests and some failed"
            else
              reason="step ${step:-none} gave no verdict (exit $status, $cases test cases)"
            fi
            if [[ -f "$dir/finished" ]]; then
              echo "seconds=$(( $(cat "$dir/finished") - $(cat "$dir/started") ))" >> "$GITHUB_OUTPUT"
            fi
          fi
          echo "fleet pool: $verdict: $reason"
          echo "### iOS simulator tests on the fleet pool: $verdict" >> "$GITHUB_STEP_SUMMARY"
          echo "$reason" >> "$GITHUB_STEP_SUMMARY"
          { echo "verdict=$verdict"; echo "reason=$reason"; } >> "$GITHUB_OUTPUT"

      - name: Upload the fleet pool result
        if: ${{ !cancelled() && steps.sim-linux.outcome == 'success' && hashFiles(format('{0}/sim-linux/result.tgz', runner.temp)) != '' }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kit-sim-linux-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sim-linux/result.tgz
          retention-days: 3

      - name: Fleet pool verdict
        if: ${{ !cancelled() && (vars.CMUX_IOS_SIM_LINUX || 'shadow') == 'on' && steps.sim-linux.outputs.verdict == 'fail' }}
        env:
          REASON: ${{ steps.sim-linux.outputs.reason }}
        run: |
          echo "::error title=iOS simulator tests::$REASON (fleet pool; the failures are in the Fleet pool result step)"
          exit 1

      # With the pool as the check ("on"), this Mac runs the simulator tests only when the pool gave no verdict.
      - name: xcodebuild test (iOS simulator, Mac fallback)
        id: ios-sim-fallback
        if: ${{ !cancelled() && (vars.CMUX_IOS_SIM_LINUX || 'shadow') == 'on' && steps.sim-linux.outputs.verdict == 'none' && !(github.event_name == 'pull_request' && startsWith(runner.name, 'blacksmith')) }}
        timeout-minutes: 30
        working-directory: cmux-next-ios/CmuxMobileKit
        env:
          REASON: ${{ steps.sim-linux.outputs.reason }}
        run: |
          echo "::notice title=Mac fallback::iOS simulator tests on this Mac: $REASON"
          bash ../../scripts/ci/ios-kit-sim-mac-test.sh

      # The bench runs after both test runs, so a bench red never skips the iOS tests.
      # Small vs god fixtures, budgets and the 1.2x rule: cmux-next-ios/design/instant-perf.md.
      # Advisory: both bench steps report and never fail the job (Leo, 2026-11-21: "for connection and ci, we
      # can simply move. and go"). On shared 6 vCPU and owned Macs the bench went red in 19 of 24 kit runs and 6
      # of the last 10 base pushes on code the pull request never touched: home_list_first_screen at 1.36-1.49x
      # since 9d18df05e5c (MessagePreview parses each preview by Character; the first screen went 1.5 -> 6 ms on
      # the same runner class), plus chat_reconnect_catch_up and terminal_chat_swap_to_terminal swinging 2-5x on
      # some runners. The numbers stay in the report below, the job summary and the instant-perf-* artifact,
      # and the report step names each bench step that missed as a warning.
      # On a pull request, a red step before the bench is already the verdict: the bench there is advisory, so it is
      # skipped rather than holding the red PR check longer (2026-11-24: all 7 readable kit jobs of Aziz's newest iOS
      # heads were red before the bench, at Connection notices or swift test, and then ran it for 3.3-10.3 min more;
      # goal ios-ci-under-5min in cmuxterm-hq). Base pushes and dispatches still bench after a red step, so base's numbers
      # never go missing (tests/test_ios_kit_bench_runs_after_red_step.py).
      - name: Instant list bench (macOS swift test)
        id: bench-macos
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || success()) }}
        continue-on-error: true
        env:
          CMUX_INSTANT_PERF_OUT: ${{ runner.temp }}/instant-perf/macos.jsonl
        run: swift test --package-path cmux-next-ios/CmuxMobileKit --filter CmuxMobileInstantPerfTests

      # The same bench on the simulator, alone, on the build above when there is one (TEST_RUNNER_ passes the
      # variable through to the test process).
      - name: Instant list bench (iOS simulator)
        id: bench-ios
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || success()) && !(github.event_name == 'pull_request' && startsWith(runner.name, 'blacksmith')) }}
        # Advisory, as the macOS bench above.
        continue-on-error: true
        # The same bound as the test step above: a hung simulator ends the step.
        timeout-minutes: 30
        working-directory: cmux-next-ios/CmuxMobileKit
        env:
          TEST_RUNNER_CMUX_INSTANT_PERF_OUT: ${{ runner.temp }}/instant-perf/ios-simulator.jsonl
          UDID: ${{ steps.ios-sim.outputs.udid || steps.ios-sim-fallback.outputs.udid }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/instant-perf"
          # A red macOS test step skips the simulator test step above, and with it the
          # simulator choice: the bench then picks its own, so its numbers never go missing.
          if [[ -z "$UDID" ]]; then
            UDID="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          found = sorted(
              (runtime, device["udid"])
              for runtime, items in devices.items()
              if ".SimRuntime.iOS-26" in runtime
              for device in items
              if device["name"].startswith("iPhone")
          )
          print(found[-1][1] if found else "")
          ')"
          fi
          if [[ -z "$UDID" ]]; then
            echo "::error::no available iOS 26 iPhone simulator on this runner" >&2
            exit 1
          fi
          xcodebuild test -scheme CmuxMobileKit-Package -destination "id=$UDID,arch=arm64" \
            -enableCodeCoverage NO -derivedDataPath "${CMUX_DERIVED_DATA_SLOT:-$RUNNER_TEMP/dd-ios-sim}" CODE_SIGNING_ALLOWED=NO -quiet \
            -only-testing:CmuxMobileInstantPerfTests \
            -resultBundlePath "$RUNNER_TEMP/instant-perf-ios.xcresult" && status=0 || status=$?
          out="$RUNNER_TEMP/instant-perf/ios-simulator.jsonl"
          if [[ ! -s "$out" ]]; then
            # The simulator could not write the host file: take the lines from the console log.
            xcrun xcresulttool get log --path "$RUNNER_TEMP/instant-perf-ios.xcresult" --type console 2>/dev/null |
              sed -n 's/.*INSTANTPERF \({.*}\)$/\1/p' > "$out" || true
          fi
          xcrun xcresulttool get test-results tests --path "$RUNNER_TEMP/instant-perf-ios.xcresult" --compact 2>/dev/null |
            python3 -c '
          import json, sys
          def walk(node, path):
              if node.get("nodeType") == "Test Case":
                  print(node.get("result"), " / ".join(path))
              for child in node.get("children", []):
                  if child.get("nodeType") == "Failure Message":
                      print("   ", child.get("name"))
                  else:
                      walk(child, path + [child.get("name", "")])
          for root in json.load(sys.stdin).get("testNodes", []):
              walk(root, [root.get("name", "")])
          ' || echo "::warning::could not read the bench result bundle"
          exit "$status"

      - name: Instant list bench report
        if: ${{ !cancelled() }}
        env:
          BENCH_MACOS: ${{ steps.bench-macos.outcome }}
          BENCH_IOS: ${{ steps.bench-ios.outcome }}
        run: |
          set -euo pipefail
          python3 cmux-next-ios/scripts/instant_perf_table.py "$RUNNER_TEMP/instant-perf" | tee -a "$GITHUB_STEP_SUMMARY"
          # The bench steps are advisory (continue-on-error): a miss is a warning here, not a red job.
          for pair in "macOS:$BENCH_MACOS" "iOS simulator:$BENCH_IOS"; do
            if [[ "${pair#*:}" == failure ]]; then
              echo "::warning title=Instant list bench (advisory)::${pair%%:*} bench missed a budget or ratio; see the table in the job summary"
            fi
          done

      # One `INSTANTPERF {json}` line per metric and platform in the job log, for readers of the log.
      - name: Instant perf lines
        if: ${{ !cancelled() }}
        run: |
          for file in "$RUNNER_TEMP"/instant-perf/*.jsonl; do
            [[ -f "$file" ]] || continue
            sed -e 's/^INSTANTPERF //' -e 's/^/INSTANTPERF /' "$file"
          done

      - name: Upload the instant list bench report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: instant-perf-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/instant-perf/*.jsonl
          if-no-files-found: warn
          retention-days: 3

      # A sampled audit of a same-tree hit ran in full and went red: the receipt it contradicts is named.
      - name: Same-tree audit
        if: ${{ failure() && fromJSON(needs.runner.outputs.same_tree || '{}')['kit-tests'].audit }}
        env:
          RECEIPT: ${{ fromJSON(needs.runner.outputs.same_tree || '{}')['kit-tests'].receipt }}
          KEY: ${{ fromJSON(needs.runner.outputs.same_tree || '{}')['kit-tests'].key }}
        run: echo "::error title=same-tree audit::kit-tests failed on the tree of $KEY, whose receipt $RECEIPT passed it"
      - name: Write the same-tree receipt
        if: ${{ success() && fromJSON(needs.runner.outputs.same_tree || '{}')['kit-tests'].record }}
        env:
          KEY: ${{ fromJSON(needs.runner.outputs.same_tree || '{}')['kit-tests'].key }}
        run: python3 scripts/ci/same_tree_reuse.py receipt --job kit-tests --key "$KEY" --out .same-tree/kit-tests
      - name: Record the same-tree receipt
        if: ${{ success() && fromJSON(needs.runner.outputs.same_tree || '{}')['kit-tests'].record }}
        continue-on-error: true
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .same-tree/kit-tests
          enableCrossOsArchive: true
          key: ${{ fromJSON(needs.runner.outputs.same_tree || '{}')['kit-tests'].key }}

  # The simulator tests on the fleet pool for a kit run whose Mac is a Blacksmith one (see "Build the iOS simulator
  # tests for the pool"): waits for that Mac's upload, submits from this owned Linux runner (a tailnet peer of the
  # controller), and reports the pool's verdict and seconds next to the Mac simulator step's. Advisory in "shadow".
  kit-sim-pool:
    needs: runner
    name: CmuxMobileKit iOS simulator tests (fleet pool)
    if: ${{ !cancelled() && needs.runner.result == 'success' && github.repository == 'manaflow-ai/cmux' && github.event_name != 'pull_request' && contains(fromJSON('["shadow","on"]'), vars.CMUX_IOS_SIM_LINUX || 'shadow') && contains(github.run_attempt > 1 && needs.runner.outputs.retry_runs_on || needs.runner.outputs.runs_on, 'blacksmith') }}
    runs-on: cmux-linux
    timeout-minutes: 90
    permissions:
      actions: read
    steps:
      - name: Wait for the Mac's simulator test build
        id: wait
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.run_id }}
          ATTEMPT: ${{ github.run_attempt }}
          REPO: ${{ github.repository }}
        run: |
          set +e -uo pipefail
          # One jobs read a minute: the upload step's outcome, or the kit job's end without one.
          # curl and python3, not gh: this job has no checkout, and the first base run (45594390658)
          # died on its first gh read with no output. A failed read is logged and retried, never fatal.
          for _ in $(seq 1 50); do
            state="$(curl -fsS --max-time 30 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/actions/runs/$RUN/attempts/$ATTEMPT/jobs?per_page=50" |
              python3 -c '
          import json, sys
          for job in json.load(sys.stdin).get("jobs", []):
              if job["name"].startswith("CmuxMobileKit tests"):
                  step = next((s for s in job.get("steps") or [] if s["name"] == "Upload the iOS simulator test build"), None)
                  print("%s/%s" % (step["status"], step["conclusion"]) if step else "none/none", job["status"])
                  break
          else:
              print("absent")')"
            [ -n "$state" ] || state="read-failed"
            echo "$(date -u +%H:%M:%S) $state"
            case "$state" in
              completed/success*) echo "uploaded=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
              completed/*|*" completed") echo "uploaded=false" >> "$GITHUB_OUTPUT"; echo "the kit job made no simulator test build ($state)"; exit 0 ;;
            esac
            sleep 60
          done
          echo "uploaded=false" >> "$GITHUB_OUTPUT"; echo "no simulator test build within 50 min"

      - name: Fleet pool run
        id: pool
        if: ${{ steps.wait.outputs.uploaded == 'true' }}
        timeout-minutes: 50
        env:
          CONTROLLER: ${{ vars.CMUX_FLEET_CONTROLLER }}
          HEAD_SHA: ${{ github.sha }}
          PRODUCTS: ${{ github.run_id }}/kit-sim-products-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -uo pipefail
          [[ -n "$CONTROLLER" ]] || { echo "no CMUX_FLEET_CONTROLLER variable"; exit 1; }
          client="$RUNNER_TEMP/fleet-client"; dir="$RUNNER_TEMP/sim-linux"
          mkdir -p "$client" "$dir"
          curl -fsS -m 30 "$CONTROLLER/v1/client/manifest" -o "$client/manifest.json"
          python3 - "$client" "$CONTROLLER" <<'EOF'
          import hashlib, json, sys, urllib.request
          from pathlib import Path
          root, controller = Path(sys.argv[1]), sys.argv[2]
          for name, digest in json.loads((root / "manifest.json").read_text())["files"].items():
              if "/" in name or name.startswith("."):
                  raise SystemExit(f"bad client file name {name!r}")
              data = urllib.request.urlopen(f"{controller}/v1/client/files/{name}", timeout=30).read()
              if hashlib.sha256(data).hexdigest() != digest:
                  raise SystemExit(f"{name}: sha256 mismatch")
              (root / name).write_bytes(data)
          EOF
          # The same skips as the Mac simulator step (scripts/ci/ios-kit-sim-mac-test.sh) and the in-job submit.
          start=$(date +%s)
          CMUX_CI_CONTROLLER="$CONTROLLER" python3 "$client/ci-client.py" run --class simulator --os linux --script scripts/ci/ios-sim-linux-test.sh \
            --ref "$HEAD_SHA" --repo manaflow-ai/cmux --env "CMUX_IOS_PRODUCTS=$PRODUCTS" \
            --arg suite=kit --arg skip=CmuxMobileInstantPerfTests --arg skip=CmuxMobileDesignCoreTests --arg skip=CmuxMobileRealtimeTests \
            --arg skip=CmuxMobileTransportTests --arg timeout=1800 \
            --artifact artifacts/ios-sim-linux/result.tgz --timeout 2400 --queue-timeout 900 > "$dir/step.log" 2>&1
          status=$?
          seconds=$(( $(date +%s) - start ))
          step="$(grep -o -E 'step [0-9a-f]{24}' "$dir/step.log" | head -1 | cut -d' ' -f2)"
          if [[ -n "$step" ]]; then
            CMUX_CI_CONTROLLER="$CONTROLLER" python3 "$client/ci-client.py" artifact "$step" "$dir/result.tgz" \
              || CMUX_CI_CONTROLLER="$CONTROLLER" python3 "$client/ci-client.py" artifact --failed "$step" "$dir/result.tgz" || true
          fi
          [[ -s "$dir/result.tgz" ]] && mkdir -p "$dir/result" && tar -xzf "$dir/result.tgz" -C "$dir/result" 2>/dev/null
          if [[ -f "$dir/result/summary.txt" ]]; then
            cat "$dir/result/summary.txt"
            grep -E -A400 '<failure|<error' "$dir/result/junit.xml" 2>/dev/null | head -80 || true
          else
            tail -n 40 "$dir/step.log"
          fi
          cases="$(grep -c '<testcase' "$dir/result/junit.xml" 2>/dev/null || echo 0)"
          if [[ "$status" == 0 && "$cases" -gt 0 ]]; then verdict=pass; reason="step ${step:-?} passed $cases tests"
          elif [[ "$status" == 1 && "$cases" -gt 0 ]]; then verdict=fail; reason="step ${step:-?} ran $cases tests and some failed"
          else verdict=none; reason="step ${step:-none} gave no verdict (exit $status, $cases test cases)"; fi
          echo "fleet pool: $verdict in $seconds s: $reason"
          { echo "### iOS simulator tests on the fleet pool: $verdict"; echo "$reason; submit to result $seconds s (the Mac simulator step of this run is in the kit job)"; } >> "$GITHUB_STEP_SUMMARY"
          { echo "verdict=$verdict"; echo "seconds=$seconds"; } >> "$GITHUB_OUTPUT"

      - name: Upload the fleet pool result
        if: ${{ !cancelled() && hashFiles(format('{0}/sim-linux/result.tgz', runner.temp)) != '' }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kit-sim-linux-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sim-linux/result.tgz
          retention-days: 3

      - name: Fleet pool verdict
        if: ${{ (vars.CMUX_IOS_SIM_LINUX || 'shadow') == 'on' && steps.pool.outputs.verdict == 'fail' }}
        run: |
          echo "::error title=iOS simulator tests::the fleet pool ran the simulator tests and some failed (Fleet pool run step)"
          exit 1

  # A red base push names the landings behind it (scripts/ci/ios_kit_base_red.py): only tests that did not fail
  # at the previous finished base run, told once per landing that changed the kit's inputs in between. Before
  # this, feat-cmux-next's kit went 0 green in 60 push runs (2026-11-25) and nobody heard: later kit PRs
  # went red on tests they never touched and merged past them as the base's.
  base-red-notice:
    needs: kit-tests
    if: ${{ !cancelled() && github.event_name == 'push' && github.repository == 'manaflow-ai/cmux' && needs.kit-tests.result == 'failure' }}
    runs-on: cmux-linux
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 400
          persist-credentials: false
      - name: Tell the landings behind a new kit red
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: python3 scripts/ci/ios_kit_base_red.py --repo "$REPO" --run "$RUN_ID"
