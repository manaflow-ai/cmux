name: cmux-next-ios kit tests

# CmuxMobileKit (cmux-next-ios/CmuxMobileKit), the cmux-next iPhone app's
# packages. Before this workflow no job ran its tests: the package's binary
# target, Frameworks/CmuxMobileLinkFFI.xcframework, is gitignored and built
# from cmux-next-ios/rust (cmux-mobile-link-ffi), so a plain checkout cannot
# even load the package.
#
# One macOS job:
# - builds the xcframework (iOS and iOS simulator slices) with
#   cmux-next-ios/rust/scripts/build-xcframework.sh, which also typechecks the
#   generated bindings and links them for the simulator, and checks that the
#   checked-in CmuxMobileLinkFFI.swift matches what it generated;
# - runs `swift test` on macOS (the package's tests are Swift Testing suites;
#   on macOS the FFI and libghostty targets drop out by platform condition);
# - runs the tests on an iOS simulator (`xcodebuild test`): the live link
#   coordinator, its banner and the FFI transport are iOS only, and #23829 left an
#   ambiguous type that only the iOS build saw.
# The Linux picker offers an idle owned simulator Mac first, with Blacksmith
# as fallback. The persistent-pool rescue watches stalled owned jobs.
# Notes (*.md) and cmux-next-ios/verify/ evidence are not the kit: a change to
# only those builds and tests nothing new (cmux#43251, SECURITY.md and
# verify/parity-mac.md, took a simulator Mac and went red on kit tests it never
# touched). A package's Resources/ stays in: SwiftPM bundles what is there.
# The last matching pattern wins, so the negations come after the includes they
# narrow and before the ones they re-include. Same rule as ios-review-gate.yml
# (#43476).
on:
  pull_request:
    branches: [feat-cmux-next]
    paths:
      - "cmux-next-ios/**"
      # The local packages CmuxMobileKit depends on, transitively (scripts/ci/ios_app_package_paths.py --check keeps this list exact).
      - "Packages/Shared/CMUXAuthCore/**"
      - "Packages/Shared/CMUXMobileCore/**"
      - "Packages/Shared/CmuxAgentBrands/**"
      - "Packages/Shared/CmuxAgentQuestion/**"
      - "Packages/Shared/CmuxAuthRuntime/**"
      - "Packages/Shared/CmuxChiefList/**"
      - "Packages/Shared/CmuxChiefVoiceCore/**"
      - "Packages/Shared/CmuxConnectivityTelemetry/**"
      - "Packages/Shared/CmuxDeviceHub/**"
      - "Packages/Shared/CmuxGhosttyKit/**"
      - "Packages/Shared/CmuxHomeCore/**"
      - "Packages/Shared/CmuxScreenKit/**"
      - "Packages/Shared/CmuxSpinner/**"
      - "Packages/Shared/CmuxTheme/**"
      - "Packages/Shared/CmuxVNC/**"
      - "Packages/Shared/CmuxVNCWebRTC/**"
      - "Packages/iOS/CmuxConversation/**"
      - "Packages/iOS/CmuxMobileBilling/**"
      - "Packages/iOS/CmuxMobileSupport/**"
      - "Packages/iOS/CmuxTabsKit/**"
      - "vendor/stack-auth-swift-sdk-prerelease/**"
      # The toolchains it uses.
      - ".github/actions/setup-cmux-tui-rust/**"
      - ".github/actions/runner-cargo-home/**"
      - "cmux-tui/rust-toolchain.toml"
      - "scripts/select-ci-xcode.sh"
      - "scripts/ci/xcode-pins.txt"
      - ".xcode-version"
      - ".github/workflows/cmux-next-ios-kit.yml"
      - "scripts/ci/ios_app_package_paths.py"
      - "scripts/ci/ios_link_ffi_key.py"
      - "!**/*.md"
      - "!cmux-next-ios/verify/**"
      # Except the fixtures the kit's own tests read (AgentCLIHybridProofSupport, AgentCLIHybridFrameTests):
      # #51565 regenerated them with no kit run, and feat-cmux-next went red on AgentCLIHybridProofTests.
      - "cmux-next-ios/verify/agent-cli-hybrid/**"
      # Agent tools beside the app (review.sh, try.sh, the hand-off host) and the mobile Worker (its own deploy
      # workflows) build nothing in the iPhone app: no kit run and no iPhone try build-ahead for them
      # (scripts/cmux-next/build_select.py reads this filter). The scripts the kit or the app build reads stay in.
      - "!cmux-next-ios/scripts/**"
      - "!cmux-next-ios/backend/**"
      - "cmux-next-ios/scripts/instant_perf_table.py"
      - "cmux-next-ios/scripts/generate-launch-mark.swift"
      - "cmux-next-ios/scripts/check-notification-extension.sh"
      - "cmux-next-ios/scripts/check-production-binary.sh"
      - "cmux-next-ios/CmuxMobileKit/**/Resources/**"
      - "Packages/Shared/**/Resources/**"
      - "Packages/iOS/**/Resources/**"
  push:
    branches: [feat-cmux-next]
    paths:
      - "cmux-next-ios/**"
      # The local packages CmuxMobileKit depends on, transitively (scripts/ci/ios_app_package_paths.py --check keeps this list exact).
      - "Packages/Shared/CMUXAuthCore/**"
      - "Packages/Shared/CMUXMobileCore/**"
      - "Packages/Shared/CmuxAgentBrands/**"
      - "Packages/Shared/CmuxAgentQuestion/**"
      - "Packages/Shared/CmuxAuthRuntime/**"
      - "Packages/Shared/CmuxChiefList/**"
      - "Packages/Shared/CmuxChiefVoiceCore/**"
      - "Packages/Shared/CmuxConnectivityTelemetry/**"
      - "Packages/Shared/CmuxDeviceHub/**"
      - "Packages/Shared/CmuxGhosttyKit/**"
      - "Packages/Shared/CmuxHomeCore/**"
      - "Packages/Shared/CmuxScreenKit/**"
      - "Packages/Shared/CmuxSpinner/**"
      - "Packages/Shared/CmuxTheme/**"
      - "Packages/Shared/CmuxVNC/**"
      - "Packages/Shared/CmuxVNCWebRTC/**"
      - "Packages/iOS/CmuxConversation/**"
      - "Packages/iOS/CmuxMobileBilling/**"
      - "Packages/iOS/CmuxMobileSupport/**"
      - "Packages/iOS/CmuxTabsKit/**"
      - "vendor/stack-auth-swift-sdk-prerelease/**"
      # The toolchains it uses.
      - ".github/actions/setup-cmux-tui-rust/**"
      - ".github/actions/runner-cargo-home/**"
      - "cmux-tui/rust-toolchain.toml"
      - "scripts/select-ci-xcode.sh"
      - "scripts/ci/xcode-pins.txt"
      - ".xcode-version"
      - ".github/workflows/cmux-next-ios-kit.yml"
      - "scripts/ci/ios_app_package_paths.py"
      - "scripts/ci/ios_link_ffi_key.py"
      - "!**/*.md"
      - "!cmux-next-ios/verify/**"
      # Except the fixtures the kit's own tests read (AgentCLIHybridProofSupport, AgentCLIHybridFrameTests):
      # #51565 regenerated them with no kit run, and feat-cmux-next went red on AgentCLIHybridProofTests.
      - "cmux-next-ios/verify/agent-cli-hybrid/**"
      # Agent tools beside the app (review.sh, try.sh, the hand-off host) and the mobile Worker (its own deploy
      # workflows) build nothing in the iPhone app: no kit run and no iPhone try build-ahead for them
      # (scripts/cmux-next/build_select.py reads this filter). The scripts the kit or the app build reads stay in.
      - "!cmux-next-ios/scripts/**"
      - "!cmux-next-ios/backend/**"
      - "cmux-next-ios/scripts/instant_perf_table.py"
      - "cmux-next-ios/scripts/generate-launch-mark.swift"
      - "cmux-next-ios/scripts/check-notification-extension.sh"
      - "cmux-next-ios/scripts/check-production-binary.sh"
      - "cmux-next-ios/CmuxMobileKit/**/Resources/**"
      - "Packages/Shared/**/Resources/**"
      - "Packages/iOS/**/Resources/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A new push to a pull request cancels its previous run; feat-cmux-next pushes never cancel.
  # A dispatch (main's nightly cron) gets a group of its own: with cancel-in-progress false,
  # GitHub still cancels a run that is pending in a group when a newer one joins it, so the
  # nightly, queued behind a running push run, was dropped by the next push (43572826977,
  # 2026-11-14, by push run 43574629185), and the bench went stale.
  group: cmux-next-ios-kit-${{ github.ref }}${{ github.event_name == 'workflow_dispatch' && format('-dispatch-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Temporary REST budget attribution: one gh-call line per GitHub API call (scripts/ci/api_call_log/env.sh, fetched at a fixed commit when the checkout has no copy).
  BASH_ENV: '$({ w="${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh"; t="${RUNNER_TEMP:-/nonexistent}/api-call-log-src"; if [ -f "$w" ]; then echo "$w"; elif [ -n "${RUNNER_TEMP:-}" ]; then if [ ! -f "$t/env.sh" ] && [ ! -e "$t.tried" ] && { [ "${RUNNER_OS:-}" = Linux ] || [ "${RUNNER_OS:-}" = macOS ]; } && [ "$(date -u +%Y%m%d%H)" -lt 2026112300 ]; then : > "$t.tried"; mkdir -p "$t.part" && for x in env.sh gh sitecustomize.py isolated.py; do curl -fsSL --max-time 5 -o "$t.part/$x" "https://raw.githubusercontent.com/manaflow-ai/cmux/27647ffd3ae838c63be28ca3e5883dcd68c34518/scripts/ci/api_call_log/$x" || break; done; [ -s "$t.part/isolated.py" ] && mv "$t.part" "$t"; fi; if [ -f "$t/env.sh" ]; then echo "$t/env.sh"; else echo unset BASH_ENV > "$t.off.sh" && echo "$t.off.sh"; fi; fi; } 2>/dev/null)'

jobs:
  # Pick an idle owned Mac with an iOS simulator, then fall back to Blacksmith
  # on retries. Keeping this picker ahead of the test job lets the rescue
  # sweeper re-admit a job that stalls on a dead owned label.
  runner:
    environment: ${{ !contains(fromJSON('["pull_request","merge_group"]'), github.event_name) && 'ci-routing-agent' || '' }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-4vcpu-ubuntu-2404' || contains(fromJSON('["blacksmith-4vcpu-ubuntu-2404","blacksmith-8vcpu-ubuntu-2404","blacksmith-16vcpu-ubuntu-2404"]'), vars.LINUX_RUNNER) && vars.LINUX_RUNNER || vars.CI_CLOUD_OVERFLOW_SAVED && fromJSON(vars.RUNNER_POOLS).linux_16 || fromJSON(vars.RUNNER_POOLS).linux_8 }}
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      runs_on: ${{ steps.pool.outputs.runs_on }}
      retry_runs_on: ${{ steps.pool.outputs.retry_runs_on }}
      label: ${{ steps.pool.outputs.label }}
      persistent: ${{ steps.pool.outputs.persistent }}
      # Same-tree reuse (scripts/ci/same_tree_reuse.py): kit-tests already passed on this merge tree.
      same_tree: ${{ steps.same-tree.outputs.same_tree }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: |
            scripts/ci/ios_runner_pool.py
            scripts/ci/e2e_runner_pool.py
            scripts/ci/pr_runner_pool.py
            scripts/ci/github_spend.py
            scripts/ci/deadline_http.py
            scripts/ci/simple_pool_picker.py
            scripts/ci/warm_distance.py
            scripts/ci/same_tree_reuse.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Mint the owned-pool routing token
        id: route-token
        if: (github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && vars.CI_PR_POOL_OWNED == '1' && vars.CI_IOS_OWNED == '1' && vars.GLAEDA_ROUTE_APP_ID != ''
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.GLAEDA_ROUTE_APP_ID }}
          private-key: ${{ secrets.GLAEDA_ROUTE_APP_KEY }}
          permission-administration: read
          # Queue, job and capacity-snapshot reads use this App's quota.
          permission-actions: read
          permission-organization-self-hosted-runners: read
      - name: Mint the repository routing token
        id: route-token-repo
        if: steps.route-token.outcome == 'failure'
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.GLAEDA_ROUTE_APP_ID }}
          private-key: ${{ secrets.GLAEDA_ROUTE_APP_KEY }}
          permission-administration: read
          permission-actions: read
      - name: Pick the macOS pool
        id: pool
        env:
          # The overflow switch the granted default reads (ios_runner_pool.py granted_default()).
          CI_OVERFLOW_MAC: ${{ vars.CI_OVERFLOW_MAC }}
          CI_RUNNER_STATE: ${{ vars.CI_RUNNER_STATE }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ROUTE_TOKEN: ${{ steps.route-token.outputs.token || steps.route-token-repo.outputs.token }}
          FORK_PULL_REQUEST: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          RUNNER_VARIABLE: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-6vcpu-macos-26' || vars.MACOS_RUNNER_TESTS || vars.MACOS_RUNNER_IOS }}
          IOS_OWNED: ${{ vars.CI_IOS_OWNED }}
          POOL_OWNED: ${{ vars.CI_PR_POOL_OWNED }}
          OWNED_SLOTS: ${{ vars.CI_OWNED_POOL_SLOTS }}
          PR_XCODE_APP: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && vars.CMUX_CI_XCODE_APP_PR || '' }}
          POOL_ORDER: ${{ vars.CI_PR_POOL_ORDER }}
          POOL_MAX_QUEUED: ${{ vars.CI_PR_POOL_MAX_QUEUED }}
        run: |
          set -euo pipefail
          python3 scripts/ci/ios_runner_pool.py \
            --lane kit --fork "$FORK_PULL_REQUEST" --requested auto \
            --variable "$RUNNER_VARIABLE" --ios-owned "$IOS_OWNED" --owned "$POOL_OWNED" \
            --owned-slots "$OWNED_SLOTS" --pr-xcode-app "$PR_XCODE_APP" --order "$POOL_ORDER" \
            --max-queued "$POOL_MAX_QUEUED" --queue-rounds 0 \
            --device-family iphone | tee -a "$GITHUB_OUTPUT"
      - name: Create the owned-pool marker
        id: marker
        if: steps.pool.outputs.persistent == 'true' && github.run_attempt == 1
        continue-on-error: true
        run: |
          set -euo pipefail
          marker="$RUNNER_TEMP/macos-pool-persistent.json"
          echo '{}' > "$marker"
          echo "path=$marker" >> "$GITHUB_OUTPUT"
      - name: Upload the persistent pool marker
        if: steps.marker.outputs.path != ''
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-pool-persistent-${{ github.run_id }}-${{ github.run_attempt }}-1-${{ steps.pool.outputs.label }}
          path: ${{ steps.marker.outputs.path }}
          retention-days: 1
      - name: Upload the simulator capacity marker
        if: steps.marker.outputs.path != ''
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-pool-persistent-${{ github.run_id }}-${{ github.run_attempt }}-1-glaeda-ios-sim
          path: ${{ steps.marker.outputs.path }}
          retention-days: 1
      - name: Upload the owned-pool watch marker
        if: steps.marker.outputs.path != ''
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: owned-pool-watch
          path: ${{ steps.marker.outputs.path }}
          retention-days: 1

      # Same-tree reuse: a pass of kit-tests on this exact merge tree and workflow file (a re-push of the same
      # tree, a reopen, a re-run) is not run again; the Mac is never taken. The key is the merge commit's tree,
      # the job and this file's blob; the receipt is an Actions cache entry kit-tests wrote on its pass, which
      # only this pull request's runs and its base can write. 10% of hits still run in full
      # (CI_SAME_TREE_AUDIT_PERCENT), and a red there names the receipt. CI_SAME_TREE_REUSE=0 turns it off.
      - name: Same-tree keys
        id: same-tree-keys
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && (vars.CI_SAME_TREE_REUSE || '1') != '0' }}
        continue-on-error: true
        run: python3 scripts/ci/same_tree_reuse.py keys --workflow .github/workflows/cmux-next-ios-kit.yml --jobs kit-tests >> "$GITHUB_OUTPUT"
      - name: Look up a same-tree pass of kit-tests
        id: same-tree-kit-tests
        if: ${{ steps.same-tree-keys.outputs.kit-tests != '' }}
        continue-on-error: true
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          # One relative path for the save and the restore: the cache version hashes it, and runner.temp differs
          # between the Linux runner and the Mac.
          path: .same-tree/kit-tests
          enableCrossOsArchive: true
          key: ${{ steps.same-tree-keys.outputs.kit-tests }}
      - name: Same-tree decision
        id: same-tree
        if: ${{ steps.same-tree-keys.outputs.keys != '' }}
        continue-on-error: true
        env:
          KEYS: ${{ steps.same-tree-keys.outputs.keys }}
          HITS: kit-tests=${{ steps.same-tree-kit-tests.outputs.cache-hit }}
          AUDIT_PERCENT: ${{ vars.CI_SAME_TREE_AUDIT_PERCENT }}
        run: |
          python3 scripts/ci/same_tree_reuse.py decide --keys "$KEYS" --hits "$HITS" \
            --receipts .same-tree --audit-percent "$AUDIT_PERCENT" >> "$GITHUB_OUTPUT"

  kit-tests:
    needs: [runner]
    name: CmuxMobileKit tests (macOS swift test, iOS simulator)
    # Runs on every pull request this workflow's paths match (cmux-next-ios/**, the packages CmuxMobileKit links), with
    # no full-ci label: as a Tier B skip, iOS PRs merged untested and were fixed forward over days (Leo, 2026-11-22:
    # "if 80% of code doesn't have a way of having a proper pr in the hour, then our fucking codebase is not good enough").
    # Also skipped before it takes a Mac when it already passed on this tree (the runner job's same-tree decision).
    if: ${{ !fromJSON(needs.runner.outputs.same_tree || '{}')['kit-tests'].reuse }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-6vcpu-macos-26' || fromJSON(github.run_attempt > 1 && needs.runner.outputs.retry_runs_on || needs.runner.outputs.runs_on) }}
    timeout-minutes: 60
    env:
      CMUX_CI_XCODE_APP: ${{ github.run_attempt == 1 && startsWith(needs.runner.outputs.label, 'glaeda-') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.CMUX_CI_XCODE_APP_PR || '' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # A phone connection state waits QuietStatusGate's 10 s or carries an action (cmux-next.yml's checks job runs
      # the same check with its shrink-only --base ratchet; that workflow does not run on a phone-only change).
      # Why: docs/ci/cmux-next-workflow-notes.md#note-366
      - name: Connection notices
        run: python3 -I scripts/cmux-next/check-connection-notices.py --root "$GITHUB_WORKSPACE"

      # These four steps are what the Instant list bench below builds with, so they run after a red
      # step too, as the bench does: a red Connection notices skipped them, and the bench then printed
      # no INSTANTPERF line for over a day on base (run 45149422676; three findings in files the bench
      # never reads). The job stays red from the step that failed
      # (tests/test_ios_kit_bench_runs_after_red_step.py).
      - name: Select Xcode
        if: ${{ !cancelled() }}
        run: ./scripts/select-ci-xcode.sh

      # cmux-next-ios/rust pins the same toolchain as cmux-tui (1.95.0).
      - name: Set up pinned Rust
        if: ${{ !cancelled() }}
        uses: ./.github/actions/setup-cmux-tui-rust

      - name: Cache cargo
        if: ${{ !cancelled() }}
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && github.event_name != 'merge_group' && contains(fromJSON('["refs/heads/main","refs/heads/feat-cmux-next","refs/heads/nightly-next"]'), github.ref) }}
          # Why: docs/ci/cmux-next-workflow-notes.md#note-210 (pool runners keep different leftover toolchains)
          add-rust-environment-hash-key: false
          cache-bin: false
          workspaces: cmux-next-ios/rust
          key: cmux-next-ios-kit

      # The xcframework is reused when nothing it is built from changed: the key is the git tree ids of every package
      # the FFI library compiles (its path dependencies into cmux-tui included), the lock, the toolchain, the build
      # script and the checked-in bindings (scripts/ci/ios_link_ffi_key.py), plus the selected Xcode. Only a build
      # whose bindings matched the checked-in ones saves it, so a hit has passed that check on the same inputs. The
      # build took 3.3-4.4 min of every kit run (2026-11-24); the key changed 5 times over 150 feat-cmux-next commits.
      # A key that cannot be read (no Python 3.11 tomllib, a missing manifest) builds, as before.
      - name: CmuxMobileLinkFFI.xcframework key
        id: xcf-key
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          set -euo pipefail
          inputs="$(python3 scripts/ci/ios_link_ffi_key.py)"
          xcode="$(xcodebuild -version | tr -cs 'A-Za-z0-9.' '-')"
          echo "key=cmux-next-ios-link-ffi-xcf-${RUNNER_OS}-${RUNNER_ARCH}-${xcode}-${inputs}" >> "$GITHUB_OUTPUT"

      - name: Restore CmuxMobileLinkFFI.xcframework
        id: xcf-restore
        if: ${{ !cancelled() && steps.xcf-key.outputs.key != '' }}
        continue-on-error: true
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: cmux-next-ios/CmuxMobileKit/Frameworks/CmuxMobileLinkFFI.xcframework
          key: ${{ steps.xcf-key.outputs.key }}

      - name: Build CmuxMobileLinkFFI.xcframework
        if: ${{ !cancelled() && steps.xcf-restore.outputs.cache-hit != 'true' }}
        env:
          JOBS: "8"
        run: bash cmux-next-ios/rust/scripts/build-xcframework.sh

      - name: Checked-in bindings match the generated ones
        run: |
          set -euo pipefail
          # The xcframework and target/ are gitignored; the script rewrites the bindings
          # and restores Cargo.lock, so any tracked change is drift.
          if ! git diff --exit-code -- cmux-next-ios/; then
            echo "::error::build-xcframework.sh changed tracked files (CmuxMobileLinkFFI.swift or Cargo.lock); run it and commit the result"
            exit 1
          fi

      - name: Save CmuxMobileLinkFFI.xcframework
        if: ${{ success() && steps.xcf-key.outputs.key != '' && steps.xcf-restore.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: cmux-next-ios/CmuxMobileKit/Frameworks/CmuxMobileLinkFFI.xcframework
          key: ${{ steps.xcf-key.outputs.key }}

      # The instant-list bench runs on its own below (no other suite on the cores). So do the suites
      # that bound wall-clock time or the process footprint: among 2580 parallel tests in one process
      # they measured their neighbours (reattach 1839 ms < 1000, 5194 ms < 5000, footprint 79 MB < 40 MB
      # on base runs 45081481908 and 45081946888), each run a different one.
      - name: swift test (macOS)
      # CmuxMobileModelTests, CmuxMobileRealtimeTests and CmuxMobileTransportTests run on Linux (swift-linux-packages.yml, group
      # ios-kit); the simulator run below skips Realtime and Transport too, and keeps Model for the one test Linux disables.
        run: swift test --package-path cmux-next-ios/CmuxMobileKit --skip CmuxMobileInstantPerfTests --skip TerminalSelfRecoveryTests --skip MockTerminalStreamMemoryTests --skip CmuxMobileModelTests --skip CmuxMobileRealtimeTests --skip CmuxMobileTransportTests

      - name: swift test (macOS, measured suites alone)
        run: swift test --package-path cmux-next-ios/CmuxMobileKit --no-parallel --filter TerminalSelfRecoveryTests --filter MockTerminalStreamMemoryTests


      # LiveCoordinator, the banner and the FFI-backed transport are iOS only, so
      # their tests run only here. A simulator destination builds the arm64 slice
      # the xcframework has.
      - name: xcodebuild test (iOS simulator)
        id: ios-sim
        # A pull request that fell back to a Blacksmith Mac runs the macOS swift test only (about 1 min); the
        # simulator half ran 6 to 17 min there and was red on 8 tests of the base on 1,100+ runs (2026-11-24).
        # It still runs on an owned Mac, and on every feat-cmux-next push and dispatch, so the check moves, not goes.
        if: ${{ !(github.event_name == 'pull_request' && startsWith(runner.name, 'blacksmith')) }}
        # About 3x its usual 10 min: a hung simulator ends the step, not the job's
        # 60 min with a macOS runner held (run 43604565423, 2026-11-14).
        timeout-minutes: 30
        working-directory: cmux-next-ios/CmuxMobileKit
        run: |
          set -euo pipefail
          udid="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          found = sorted(
              (runtime, device["udid"])
              for runtime, items in devices.items()
              if ".SimRuntime.iOS-26" in runtime
              for device in items
              if device["name"].startswith("iPhone")
          )
          print(found[-1][1] if found else "")
          ')"
          if [[ -z "$udid" ]]; then
            echo "::error::no available iOS 26 iPhone simulator on this runner" >&2
            exit 1
          fi
          echo "simulator $udid"
          # Coverage off: its profiler crashes Swift 6.3.3 on an isolated deinit
          # (TerminalDevProbe, SILProfiler in emitIsolatingDestructor); the app builds
          # without coverage. arm64 only: the xcframework has no x86_64 simulator slice.
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcodebuild test -scheme CmuxMobileKit-Package -destination "id=$udid,arch=arm64" \
            -enableCodeCoverage NO -derivedDataPath "${CMUX_DERIVED_DATA_SLOT:-$RUNNER_TEMP/dd-ios-sim}" CODE_SIGNING_ALLOWED=NO -quiet \
            -skip-testing:CmuxMobileInstantPerfTests \
            -skip-testing:CmuxMobileRealtimeTests \
            -skip-testing:CmuxMobileTransportTests \
            -resultBundlePath "$RUNNER_TEMP/ios-sim.xcresult" && status=0 || status=$?
          # -quiet drops Swift Testing's output: report from the result bundle (counts,
          # suites that did not pass, #23829's banner suite, and every failure).
          xcrun xcresulttool get test-results tests --path "$RUNNER_TEMP/ios-sim.xcresult" --compact 2>/dev/null |
            python3 -c '
          import json, sys
          counts = {}
          def walk(node, path):
              kind, result = node.get("nodeType"), node.get("result")
              if kind == "Test Case":
                  counts[result] = counts.get(result, 0) + 1
                  if result == "Failed":
                      print("FAILED:", " / ".join(path))
              if kind == "Test Suite" and (result != "Passed" or node.get("name") == "WaitingBannerTests"):
                  print("suite", node.get("name"), result, len(node.get("children", [])), "tests")
              for child in node.get("children", []):
                  if child.get("nodeType") == "Failure Message":
                      print("   ", child.get("name"))
                  else:
                      walk(child, path + [child.get("name", "")])
          for root in json.load(sys.stdin).get("testNodes", []):
              walk(root, [root.get("name", "")])
          print("iOS simulator test cases:", ", ".join(f"{k} {v}" for k, v in sorted(counts.items())))
          ' || echo "::warning::could not read the result bundle"
          exit "$status"

      # The bench runs after both test runs, so a bench red never skips the iOS tests.
      # Small vs god fixtures, budgets and the 1.2x rule: cmux-next-ios/design/instant-perf.md.
      # Advisory: both bench steps report and never fail the job (Leo, 2026-11-21: "for connection and ci, we
      # can simply move. and go"). On shared 6 vCPU and owned Macs the bench went red in 19 of 24 kit runs and 6
      # of the last 10 base pushes on code the pull request never touched: home_list_first_screen at 1.36-1.49x
      # since 9d18df05e5c (MessagePreview parses each preview by Character; the first screen went 1.5 -> 6 ms on
      # the same runner class), plus chat_reconnect_catch_up and terminal_chat_swap_to_terminal swinging 2-5x on
      # some runners. The numbers stay in the report below, the job summary and the instant-perf-* artifact,
      # and the report step names each bench step that missed as a warning.
      # On a pull request, a red step before the bench is already the verdict: the bench there is advisory, so it is
      # skipped rather than holding the red PR check longer (2026-11-24: all 7 readable kit jobs of Aziz's newest iOS
      # heads were red before the bench, at Connection notices or swift test, and then ran it for 3.3-10.3 min more;
      # goal ios-ci-under-5min in cmuxterm-hq). Base pushes and dispatches still bench after a red step, so base's numbers
      # never go missing (tests/test_ios_kit_bench_runs_after_red_step.py).
      - name: Instant list bench (macOS swift test)
        id: bench-macos
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || success()) }}
        continue-on-error: true
        env:
          CMUX_INSTANT_PERF_OUT: ${{ runner.temp }}/instant-perf/macos.jsonl
        run: swift test --package-path cmux-next-ios/CmuxMobileKit --filter CmuxMobileInstantPerfTests

      # The same bench on the simulator, alone, on the build above when there is one (TEST_RUNNER_ passes the
      # variable through to the test process).
      - name: Instant list bench (iOS simulator)
        id: bench-ios
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || success()) && !(github.event_name == 'pull_request' && startsWith(runner.name, 'blacksmith')) }}
        # Advisory, as the macOS bench above.
        continue-on-error: true
        # The same bound as the test step above: a hung simulator ends the step.
        timeout-minutes: 30
        working-directory: cmux-next-ios/CmuxMobileKit
        env:
          TEST_RUNNER_CMUX_INSTANT_PERF_OUT: ${{ runner.temp }}/instant-perf/ios-simulator.jsonl
          UDID: ${{ steps.ios-sim.outputs.udid }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/instant-perf"
          # A red macOS test step skips the simulator test step above, and with it the
          # simulator choice: the bench then picks its own, so its numbers never go missing.
          if [[ -z "$UDID" ]]; then
            UDID="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          found = sorted(
              (runtime, device["udid"])
              for runtime, items in devices.items()
              if ".SimRuntime.iOS-26" in runtime
              for device in items
              if device["name"].startswith("iPhone")
          )
          print(found[-1][1] if found else "")
          ')"
          fi
          if [[ -z "$UDID" ]]; then
            echo "::error::no available iOS 26 iPhone simulator on this runner" >&2
            exit 1
          fi
          xcodebuild test -scheme CmuxMobileKit-Package -destination "id=$UDID,arch=arm64" \
            -enableCodeCoverage NO -derivedDataPath "${CMUX_DERIVED_DATA_SLOT:-$RUNNER_TEMP/dd-ios-sim}" CODE_SIGNING_ALLOWED=NO -quiet \
            -only-testing:CmuxMobileInstantPerfTests \
            -resultBundlePath "$RUNNER_TEMP/instant-perf-ios.xcresult" && status=0 || status=$?
          out="$RUNNER_TEMP/instant-perf/ios-simulator.jsonl"
          if [[ ! -s "$out" ]]; then
            # The simulator could not write the host file: take the lines from the console log.
            xcrun xcresulttool get log --path "$RUNNER_TEMP/instant-perf-ios.xcresult" --type console 2>/dev/null |
              sed -n 's/.*INSTANTPERF \({.*}\)$/\1/p' > "$out" || true
          fi
          xcrun xcresulttool get test-results tests --path "$RUNNER_TEMP/instant-perf-ios.xcresult" --compact 2>/dev/null |
            python3 -c '
          import json, sys
          def walk(node, path):
              if node.get("nodeType") == "Test Case":
                  print(node.get("result"), " / ".join(path))
              for child in node.get("children", []):
                  if child.get("nodeType") == "Failure Message":
                      print("   ", child.get("name"))
                  else:
                      walk(child, path + [child.get("name", "")])
          for root in json.load(sys.stdin).get("testNodes", []):
              walk(root, [root.get("name", "")])
          ' || echo "::warning::could not read the bench result bundle"
          exit "$status"

      - name: Instant list bench report
        if: ${{ !cancelled() }}
        env:
          BENCH_MACOS: ${{ steps.bench-macos.outcome }}
          BENCH_IOS: ${{ steps.bench-ios.outcome }}
        run: |
          set -euo pipefail
          python3 cmux-next-ios/scripts/instant_perf_table.py "$RUNNER_TEMP/instant-perf" | tee -a "$GITHUB_STEP_SUMMARY"
          # The bench steps are advisory (continue-on-error): a miss is a warning here, not a red job.
          for pair in "macOS:$BENCH_MACOS" "iOS simulator:$BENCH_IOS"; do
            if [[ "${pair#*:}" == failure ]]; then
              echo "::warning title=Instant list bench (advisory)::${pair%%:*} bench missed a budget or ratio; see the table in the job summary"
            fi
          done

      # One `INSTANTPERF {json}` line per metric and platform in the job log, for readers of the log.
      - name: Instant perf lines
        if: ${{ !cancelled() }}
        run: |
          for file in "$RUNNER_TEMP"/instant-perf/*.jsonl; do
            [[ -f "$file" ]] || continue
            sed -e 's/^INSTANTPERF //' -e 's/^/INSTANTPERF /' "$file"
          done

      - name: Upload the instant list bench report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: instant-perf-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/instant-perf/*.jsonl
          if-no-files-found: warn
          retention-days: 3

      # A sampled audit of a same-tree hit ran in full and went red: the receipt it contradicts is named.
      - name: Same-tree audit
        if: ${{ failure() && fromJSON(needs.runner.outputs.same_tree || '{}')['kit-tests'].audit }}
        env:
          RECEIPT: ${{ fromJSON(needs.runner.outputs.same_tree || '{}')['kit-tests'].receipt }}
          KEY: ${{ fromJSON(needs.runner.outputs.same_tree || '{}')['kit-tests'].key }}
        run: echo "::error title=same-tree audit::kit-tests failed on the tree of $KEY, whose receipt $RECEIPT passed it"
      - name: Write the same-tree receipt
        if: ${{ success() && fromJSON(needs.runner.outputs.same_tree || '{}')['kit-tests'].record }}
        env:
          KEY: ${{ fromJSON(needs.runner.outputs.same_tree || '{}')['kit-tests'].key }}
        run: python3 scripts/ci/same_tree_reuse.py receipt --job kit-tests --key "$KEY" --out .same-tree/kit-tests
      - name: Record the same-tree receipt
        if: ${{ success() && fromJSON(needs.runner.outputs.same_tree || '{}')['kit-tests'].record }}
        continue-on-error: true
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .same-tree/kit-tests
          enableCrossOsArchive: true
          key: ${{ fromJSON(needs.runner.outputs.same_tree || '{}')['kit-tests'].key }}
