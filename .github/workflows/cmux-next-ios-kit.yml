name: cmux-next-ios kit tests

# CmuxMobileKit's tests, the instant-list bench included (#40285), run from
# feat-cmux-next's cmux-next-ios-kit.yml, on push and pull request with path
# filters. So a quiet week leaves the bench with no fresh numbers. GitHub runs a
# schedule, and registers a dispatch, only from the default branch, so this
# file is on main too. Here the nightly cron (07:47 UTC) runs job start, which
# dispatches the workflow on feat-cmux-next. That dispatch runs
# feat-cmux-next's own file (event workflow_dispatch, branch feat-cmux-next),
# never this one, so this file holds no test jobs to drift from it. A dispatch
# on main does nothing.
on:
  schedule:
    - cron: "47 7 * * *"
  workflow_dispatch:

permissions: {}

# At most one queued run: a newer schedule run replaces a pending one.
concurrency:
  group: cmux-next-ios-kit
  cancel-in-progress: false

jobs:
  # No secrets: it only dispatches this workflow on feat-cmux-next.
  start:
    if: github.repository == 'manaflow-ai/cmux' && github.event_name == 'schedule'
    permissions:
      actions: write # dispatch cmux-next-ios-kit.yml
      contents: read
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || 'cmux-linux' }}
    timeout-minutes: 20
    env:
      # A scheduled job's GitHub API waits stop here and fail loud (scripts/ci/gh_budget_wait.sh).
      GH_BUDGET_WAIT_MAX_SECONDS: "900"
      GH_TOKEN: ${{ github.token }}
    steps:
      # This commit's GitHub API wait (scripts/ci/gh_budget_wait.sh): every later gh call, and
      # each github-script step that installs gh_budget_wait.cjs, waits through a rate limit or a
      # GitHub 5xx under the job's GH_BUDGET_WAIT_MAX_SECONDS, then fails loud.
      - name: Checkout the GitHub API wait
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: .gh-budget-tooling
          sparse-checkout: |
            scripts/ci/gh_budget_wait.sh
            scripts/ci/gh_budget_wait.cjs
          sparse-checkout-cone-mode: false
      - name: Wait through GitHub API rate limits and 5xx in this job
        working-directory: ${{ github.workspace }}
        run: bash .gh-budget-tooling/scripts/ci/gh_budget_wait.sh --install

      - name: Dispatch the kit tests and bench on feat-cmux-next
        run: gh workflow run cmux-next-ios-kit.yml -R "$GITHUB_REPOSITORY" --ref feat-cmux-next
