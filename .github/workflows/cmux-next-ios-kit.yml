name: cmux-next-ios kit tests

# CmuxMobileKit (cmux-next-ios/CmuxMobileKit), the cmux-next iPhone app's
# packages. Before this workflow no job ran its tests: the package's binary
# target, Frameworks/CmuxMobileLinkFFI.xcframework, is gitignored and built
# from cmux-next-ios/rust (cmux-mobile-link-ffi), so a plain checkout cannot
# even load the package.
#
# One macOS job:
# - builds the xcframework (iOS and iOS simulator slices) with
#   cmux-next-ios/rust/scripts/build-xcframework.sh, which also typechecks the
#   generated bindings and links them for the simulator, and checks that the
#   checked-in CmuxMobileLinkFFI.swift matches what it generated;
# - runs `swift test` on macOS (the package's tests are Swift Testing suites;
#   on macOS the FFI and libghostty targets drop out by platform condition);
# - runs the tests on an iOS simulator (`xcodebuild test`): the live link
#   coordinator, its banner and the FFI transport are iOS only, and #23829 left an
#   ambiguous type that only the iOS build saw.
# The Linux picker offers an idle owned simulator Mac first, with Blacksmith
# as fallback. The persistent-pool rescue watches stalled owned jobs.
on:
  pull_request:
    branches: [feat-cmux-next]
    paths:
      - "cmux-next-ios/**"
      # The local packages CmuxMobileKit depends on (Package.swift).
      - "Packages/Shared/CmuxGhosttyKit/**"
      - "Packages/Shared/CmuxAgentQuestion/**"
      - "Packages/Shared/CmuxAuthRuntime/**"
      - "Packages/Shared/CMUXAuthCore/**"
      - "Packages/Shared/CMUXMobileCore/**"
      - "Packages/Shared/CmuxAgentBrands/**"
      - "Packages/Shared/CmuxChiefVoiceCore/**"
      - "Packages/iOS/CmuxTabsKit/**"
      - "Packages/iOS/CmuxConversation/**"
      - "Packages/iOS/CmuxMobileSupport/**"
      - "vendor/stack-auth-swift-sdk-prerelease/**"
      # The toolchains it uses.
      - ".github/actions/setup-cmux-tui-rust/**"
      - "cmux-tui/rust-toolchain.toml"
      - "scripts/select-ci-xcode.sh"
      - "scripts/ci/xcode-pins.txt"
      - ".xcode-version"
      - ".github/workflows/cmux-next-ios-kit.yml"
  push:
    branches: [feat-cmux-next]
    paths:
      - "cmux-next-ios/**"
      # The local packages CmuxMobileKit depends on (Package.swift).
      - "Packages/Shared/CmuxGhosttyKit/**"
      - "Packages/Shared/CmuxAgentQuestion/**"
      - "Packages/Shared/CmuxAuthRuntime/**"
      - "Packages/Shared/CMUXAuthCore/**"
      - "Packages/Shared/CMUXMobileCore/**"
      - "Packages/Shared/CmuxAgentBrands/**"
      - "Packages/Shared/CmuxChiefVoiceCore/**"
      - "Packages/iOS/CmuxTabsKit/**"
      - "Packages/iOS/CmuxConversation/**"
      - "Packages/iOS/CmuxMobileSupport/**"
      - "vendor/stack-auth-swift-sdk-prerelease/**"
      # The toolchains it uses.
      - ".github/actions/setup-cmux-tui-rust/**"
      - "cmux-tui/rust-toolchain.toml"
      - "scripts/select-ci-xcode.sh"
      - "scripts/ci/xcode-pins.txt"
      - ".xcode-version"
      - ".github/workflows/cmux-next-ios-kit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmux-next-ios-kit-${{ github.ref }}
  # A new push to a pull request cancels its previous run; feat-cmux-next pushes never cancel.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Pick an idle owned Mac with an iOS simulator, then fall back to Blacksmith
  # on retries. Keeping this picker ahead of the test job lets the rescue
  # sweeper re-admit a job that stalls on a dead owned label.
  runner:
    environment: ${{ !contains(fromJSON('["pull_request","merge_group"]'), github.event_name) && 'ci-routing-agent' || '' }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-4vcpu-ubuntu-2404' || contains(fromJSON('["blacksmith-4vcpu-ubuntu-2404","blacksmith-8vcpu-ubuntu-2404","blacksmith-16vcpu-ubuntu-2404"]'), vars.LINUX_RUNNER) && vars.LINUX_RUNNER || vars.CI_CLOUD_OVERFLOW_SAVED && 'blacksmith-16vcpu-ubuntu-2404' || 'blacksmith-8vcpu-ubuntu-2404' }}
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      runs_on: ${{ steps.pool.outputs.runs_on }}
      retry_runs_on: ${{ steps.pool.outputs.retry_runs_on }}
      label: ${{ steps.pool.outputs.label }}
      persistent: ${{ steps.pool.outputs.persistent }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: |
            scripts/ci/ios_runner_pool.py
            scripts/ci/e2e_runner_pool.py
            scripts/ci/pr_runner_pool.py
            scripts/ci/github_spend.py
            scripts/ci/simple_pool_picker.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Mint the owned-pool routing token
        id: route-token
        if: (github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && vars.CI_PR_POOL_OWNED == '1' && vars.CI_IOS_OWNED == '1' && vars.GLAEDA_ROUTE_APP_ID != ''
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.GLAEDA_ROUTE_APP_ID }}
          private-key: ${{ secrets.GLAEDA_ROUTE_APP_KEY }}
          permission-administration: read
          # Queue, job and capacity-snapshot reads use this App's quota.
          permission-actions: read
          permission-organization-self-hosted-runners: read
      - name: Mint the repository routing token
        id: route-token-repo
        if: steps.route-token.outcome == 'failure'
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.GLAEDA_ROUTE_APP_ID }}
          private-key: ${{ secrets.GLAEDA_ROUTE_APP_KEY }}
          permission-administration: read
          permission-actions: read
      - name: Pick the macOS pool
        id: pool
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ROUTE_TOKEN: ${{ steps.route-token.outputs.token || steps.route-token-repo.outputs.token }}
          FORK_PULL_REQUEST: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          RUNNER_VARIABLE: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-6vcpu-macos-26' || vars.MACOS_RUNNER_TESTS || vars.MACOS_RUNNER_IOS }}
          IOS_OWNED: ${{ vars.CI_IOS_OWNED }}
          POOL_OWNED: ${{ vars.CI_PR_POOL_OWNED }}
          OWNED_SLOTS: ${{ vars.CI_OWNED_POOL_SLOTS }}
          PR_XCODE_APP: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && vars.CMUX_CI_XCODE_APP_PR || '' }}
          POOL_ORDER: ${{ vars.CI_PR_POOL_ORDER }}
          POOL_MAX_QUEUED: ${{ vars.CI_PR_POOL_MAX_QUEUED }}
        run: |
          set -euo pipefail
          python3 scripts/ci/ios_runner_pool.py \
            --lane kit --fork "$FORK_PULL_REQUEST" --requested auto \
            --variable "$RUNNER_VARIABLE" --ios-owned "$IOS_OWNED" --owned "$POOL_OWNED" \
            --owned-slots "$OWNED_SLOTS" --pr-xcode-app "$PR_XCODE_APP" --order "$POOL_ORDER" \
            --max-queued "$POOL_MAX_QUEUED" --queue-rounds 0 \
            --device-family iphone | tee -a "$GITHUB_OUTPUT"
      - name: Create the owned-pool marker
        id: marker
        if: steps.pool.outputs.persistent == 'true' && github.run_attempt == 1
        continue-on-error: true
        run: |
          set -euo pipefail
          marker="$RUNNER_TEMP/macos-pool-persistent.json"
          echo '{}' > "$marker"
          echo "path=$marker" >> "$GITHUB_OUTPUT"
      - name: Upload the persistent pool marker
        if: steps.marker.outputs.path != ''
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-pool-persistent-${{ github.run_id }}-${{ github.run_attempt }}-1-${{ steps.pool.outputs.label }}
          path: ${{ steps.marker.outputs.path }}
          retention-days: 1
      - name: Upload the simulator capacity marker
        if: steps.marker.outputs.path != ''
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-pool-persistent-${{ github.run_id }}-${{ github.run_attempt }}-1-glaeda-ios-sim
          path: ${{ steps.marker.outputs.path }}
          retention-days: 1
      - name: Upload the owned-pool watch marker
        if: steps.marker.outputs.path != ''
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: owned-pool-watch
          path: ${{ steps.marker.outputs.path }}
          retention-days: 1

  kit-tests:
    needs: [runner]
    name: CmuxMobileKit tests (macOS swift test, iOS simulator)
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-6vcpu-macos-26' || fromJSON(github.run_attempt > 1 && needs.runner.outputs.retry_runs_on || needs.runner.outputs.runs_on) }}
    timeout-minutes: 60
    env:
      CMUX_CI_XCODE_APP: ${{ github.run_attempt == 1 && startsWith(needs.runner.outputs.label, 'glaeda-') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.CMUX_CI_XCODE_APP_PR || '' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Select Xcode
        run: ./scripts/select-ci-xcode.sh

      # cmux-next-ios/rust pins the same toolchain as cmux-tui (1.95.0).
      - name: Set up pinned Rust
        uses: ./.github/actions/setup-cmux-tui-rust

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          workspaces: cmux-next-ios/rust
          key: cmux-next-ios-kit

      - name: Build CmuxMobileLinkFFI.xcframework
        env:
          JOBS: "8"
        run: bash cmux-next-ios/rust/scripts/build-xcframework.sh

      - name: Checked-in bindings match the generated ones
        run: |
          set -euo pipefail
          # The xcframework and target/ are gitignored; the script rewrites the bindings
          # and restores Cargo.lock, so any tracked change is drift.
          if ! git diff --exit-code -- cmux-next-ios/; then
            echo "::error::build-xcframework.sh changed tracked files (CmuxMobileLinkFFI.swift or Cargo.lock); run it and commit the result"
            exit 1
          fi

      - name: swift test (macOS)
        run: swift test --package-path cmux-next-ios/CmuxMobileKit

      # LiveCoordinator, the banner and the FFI-backed transport are iOS only, so
      # their tests run only here. A simulator destination builds the arm64 slice
      # the xcframework has.
      - name: xcodebuild test (iOS simulator)
        working-directory: cmux-next-ios/CmuxMobileKit
        run: |
          set -euo pipefail
          udid="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          found = sorted(
              (runtime, device["udid"])
              for runtime, items in devices.items()
              if ".SimRuntime.iOS-26" in runtime
              for device in items
              if device["name"].startswith("iPhone")
          )
          print(found[-1][1] if found else "")
          ')"
          if [[ -z "$udid" ]]; then
            echo "::error::no available iOS 26 iPhone simulator on this runner" >&2
            exit 1
          fi
          echo "simulator $udid"
          # Coverage off: its profiler crashes Swift 6.3.3 on an isolated deinit
          # (TerminalDevProbe, SILProfiler in emitIsolatingDestructor); the app builds
          # without coverage. arm64 only: the xcframework has no x86_64 simulator slice.
          xcodebuild test -scheme CmuxMobileKit-Package -destination "id=$udid,arch=arm64" \
            -enableCodeCoverage NO -derivedDataPath "$RUNNER_TEMP/dd-ios-sim" CODE_SIGNING_ALLOWED=NO -quiet \
            -resultBundlePath "$RUNNER_TEMP/ios-sim.xcresult" && status=0 || status=$?
          # -quiet drops Swift Testing's output: report from the result bundle (counts,
          # suites that did not pass, #23829's banner suite, and every failure).
          xcrun xcresulttool get test-results tests --path "$RUNNER_TEMP/ios-sim.xcresult" --compact 2>/dev/null |
            python3 -c '
          import json, sys
          counts = {}
          def walk(node, path):
              kind, result = node.get("nodeType"), node.get("result")
              if kind == "Test Case":
                  counts[result] = counts.get(result, 0) + 1
                  if result == "Failed":
                      print("FAILED:", " / ".join(path))
              if kind == "Test Suite" and (result != "Passed" or node.get("name") == "WaitingBannerTests"):
                  print("suite", node.get("name"), result, len(node.get("children", [])), "tests")
              for child in node.get("children", []):
                  if child.get("nodeType") == "Failure Message":
                      print("   ", child.get("name"))
                  else:
                      walk(child, path + [child.get("name", "")])
          for root in json.load(sys.stdin).get("testNodes", []):
              walk(root, [root.get("name", "")])
          print("iOS simulator test cases:", ", ".join(f"{k} {v}" for k, v in sorted(counts.items())))
          ' || echo "::warning::could not read the result bundle"
          exit "$status"
