name: temporary reusable skip probe callee
on:
  workflow_call:
    outputs:
      implicit:
        value: ${{ jobs.implicit-root.result }}
      explicit:
        value: ${{ jobs.explicit-root.result }}
      implicit_child:
        value: ${{ jobs.implicit-child.result }}
      explicit_child:
        value: ${{ jobs.explicit-child.result }}
permissions: {}
jobs:
  implicit-root:
    if: ${{ vars.CI_IOS_FAST_VERDICT != '0' }}
    runs-on: cmux-linux
    timeout-minutes: 2
    steps:
      - run: echo 'implicit root ran'
  explicit-root:
    if: ${{ !cancelled() && vars.CI_IOS_FAST_VERDICT != '0' }}
    runs-on: cmux-linux
    timeout-minutes: 2
    steps:
      - run: echo 'explicit root ran'
  implicit-child:
    needs: explicit-root
    if: ${{ needs.explicit-root.result == 'success' }}
    runs-on: cmux-linux
    timeout-minutes: 2
    steps:
      - run: echo 'implicit child ran'
  explicit-child:
    needs: explicit-root
    if: ${{ !cancelled() && needs.explicit-root.result == 'success' }}
    runs-on: cmux-linux
    timeout-minutes: 2
    steps:
      - run: echo 'explicit child ran'
