name: Cloud machine count probe (staging)

# One manual check that a paid personal account on staging can hold more than five machines
# (cmux-platform#1134: paid counts are unlimited where CLOUD_SPEND_CAP and CLOUD_USAGE_LEDGER are on;
# CLOUD_CREATE_PER_HOUR, default 20, is the create guard). scripts/cmux-next/cloud-machine-count-probe.ts
# signs in as the staging agent test account (its `pro` operator plan, cloud-capture-provision.yml), in its
# personal scope, creates `count` machines one after another, records each create's answer, and deletes every
# machine it made by id, pass or fail. Production is out of scope (its ledger is off by design).
#
# Secrets: CMUX_DOGFOOD_STACK_EMAIL/_PASSWORD in cmux-next-vm-image-dev, which admits feat-cmux-next only.
# Runs on feat-cmux-next only: a push there that changes .github/cloud-machine-count-probe/request (land a PR that
# edits it; 6 machines), or a manual dispatch once this file is on the default branch.

on:
  workflow_dispatch:
    inputs:
      count:
        description: "Machines to create (1-10). Passes when one is accepted while the account already holds five or more."
        required: true
        type: number
        default: 6
  push:
    branches: [feat-cmux-next]
    paths:
      - .github/cloud-machine-count-probe/request

permissions:
  contents: read

concurrency:
  group: cloud-machine-count-probe
  cancel-in-progress: false

jobs:
  probe:
    if: github.repository == 'manaflow-ai/cmux' && github.ref == 'refs/heads/feat-cmux-next'
    environment:
      name: cmux-next-vm-image-dev
      deployment: false
    runs-on: ${{ vars.CI_CLOUD_OVERFLOW_SAVED && fromJSON(vars.RUNNER_POOLS).linux_8 || fromJSON(vars.RUNNER_POOLS).linux_4 }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/cmux-next/
            /tests/fixtures/model-stub/
            /Packages/macOS/CmuxNext/Sources/CmuxNextCloudCredentials/
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
      - name: Create machines on staging, then delete them
        env:
          CMUX_DOGFOOD_STACK_EMAIL: ${{ secrets.CMUX_DOGFOOD_STACK_EMAIL }}
          CMUX_DOGFOOD_STACK_PASSWORD: ${{ secrets.CMUX_DOGFOOD_STACK_PASSWORD }}
          COUNT: ${{ inputs.count || 6 }}
        run: bun scripts/cmux-next/cloud-machine-count-probe.ts --backend staging --count "$COUNT" --out "$RUNNER_TEMP/count-probe"
      - name: Summary
        if: always()
        run: cat "$RUNNER_TEMP/count-probe/summary.md" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "no summary written" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: cloud-machine-count-probe-${{ github.run_id }}
          path: ${{ runner.temp }}/count-probe/
          if-no-files-found: warn
          retention-days: 3
