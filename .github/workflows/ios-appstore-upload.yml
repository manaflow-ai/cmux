name: iOS TestFlight (cmux.app)

on:
  # Upload the official bundle for internal testing. App Review remains manual.
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      build_number:
        description: CFBundleVersion to stamp (defaults to UTC yyyyMMddHHmmss)
        required: false
        default: ""

concurrency:
  # Serialize with the production App Review workflow.
  group: ios-app-store-production
  queue: max
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  decide:
    name: Check for new main revision
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    outputs:
      upload: ${{ steps.decide.outputs.upload }}
      retry_build_number: ${{ steps.decide.outputs.retry_build_number }}
    steps:
      - name: Skip an unchanged scheduled revision
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = schedule ]; then
            LAST_SHA="$(gh api "repos/$REPOSITORY/actions/workflows/ios-appstore-upload.yml/runs?branch=main&status=success&per_page=1" --jq '.workflow_runs[0].head_sha // ""')"
            if [ "$LAST_SHA" = "$HEAD_SHA" ]; then
              echo 'upload=false' >> "$GITHUB_OUTPUT"
              echo 'Latest main already reached official internal TestFlight.' >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi
          if [ "$EVENT_NAME" = schedule ]; then
            RUN_IDS="$(gh api "repos/$REPOSITORY/actions/workflows/ios-appstore-upload.yml/runs?branch=main&status=completed&head_sha=$HEAD_SHA&per_page=20" --jq '.workflow_runs[].id')"
            for RUN_ID in $RUN_IDS; do
              MARKER_ID="$(gh api "repos/$REPOSITORY/actions/runs/$RUN_ID/artifacts" --jq '.artifacts[] | select(.name == "cmux-app-testflight-upload" and .expired == false) | .id')"
              [ -n "$MARKER_ID" ] || continue
              MARKER_DIR="$(mktemp -d)"
              gh run download "$RUN_ID" --repo "$REPOSITORY" --name cmux-app-testflight-upload --dir "$MARKER_DIR"
              BUILD_NUMBER="$(python3 - "$MARKER_DIR/upload.json" "$HEAD_SHA" <<'PYCODE'
          import json, re, sys
          with open(sys.argv[1]) as f:
              marker = json.load(f)
          assert marker['sha'] == sys.argv[2] and marker['app_id'] == '6783338052'
          assert re.fullmatch(r'[0-9]+', marker['build_number'])
          print(marker['build_number'])
          PYCODE
              )"
              rm -rf "$MARKER_DIR"
              echo 'upload=false' >> "$GITHUB_OUTPUT"
              echo "retry_build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
              echo "Retrying internal assignment for uploaded build $BUILD_NUMBER." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            done
          fi
          echo 'upload=true' >> "$GITHUB_OUTPUT"

  upload:
    name: Upload to App Store Connect (com.cmux.app)
    # Only ever publish from main: the ASC secrets ship reviewed main, and a
    # dispatch against a feature branch must not upload arbitrary code.
    needs: decide
    if: needs.decide.outputs.upload == 'true' && github.ref == 'refs/heads/main'
    runs-on: ${{ vars.MACOS_RUNNER_IOS || 'blacksmith-6vcpu-macos-26' }}
    timeout-minutes: 90
    outputs:
      build_number: ${{ steps.upload.outputs.final_build_number }}
    env:
      ASC_APP_ID: "6783338052"
      ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
      ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      - name: Select Xcode
        env:
          CMUX_CI_MAX_MACOS_SDK_MAJOR: "26"
        run: ./scripts/select-ci-xcode.sh

      - name: Install asc CLI
        run: brew list asc >/dev/null 2>&1 || brew install asc

      - name: Install zig
        run: ./scripts/install-zig-ci.sh

      - name: Provision GhosttyKit
        run: ./scripts/ensure-ghosttykit.sh

      - name: Materialize App Store Connect API key
        env:
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${ASC_API_KEY_ID:-}" ] || [ -z "${ASC_API_ISSUER_ID:-}" ] || [ -z "${ASC_API_KEY_P8_BASE64:-}" ]; then
            echo "Missing one of ASC_API_KEY_ID / ASC_API_ISSUER_ID / ASC_API_KEY_P8_BASE64 secrets" >&2
            exit 1
          fi
          KEY_DIR="$HOME/.appstoreconnect/private_keys"
          KEY_PATH="$KEY_DIR/AuthKey_${ASC_API_KEY_ID}.p8"
          mkdir -p "$KEY_DIR"
          printf '%s' "$ASC_API_KEY_P8_BASE64" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "ASC_API_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Import iOS distribution signing cert
        env:
          IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${IOS_DISTRIBUTION_CERTIFICATE_BASE64:-}" ]; then
            echo "Missing IOS_DISTRIBUTION_CERTIFICATE_BASE64 secret" >&2
            exit 1
          fi
          if [ -z "${IOS_DISTRIBUTION_CERTIFICATE_PASSWORD:-}" ]; then
            echo "Missing IOS_DISTRIBUTION_CERTIFICATE_PASSWORD secret" >&2
            exit 1
          fi

          KEYCHAIN_PASSWORD="$(uuidgen)"
          KEYCHAIN_NAME="ios-appstore.keychain"
          CERT_PATH="$RUNNER_TEMP/ios-distribution.p12"
          printf '%s' "$IOS_DISTRIBUTION_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
          security delete-keychain "$KEYCHAIN_NAME" >/dev/null 2>&1 || true
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_NAME"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"
          security import "$CERT_PATH" -k "$KEYCHAIN_NAME" -P "$IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"
          security list-keychains -d user -s "$KEYCHAIN_NAME"
          security find-identity -v -p codesigning "$KEYCHAIN_NAME"
          IOS_DISTRIBUTION_IDENTITY="$(
            security find-identity -v -p codesigning "$KEYCHAIN_NAME" |
              sed -n 's/.*"\(.* Distribution: .* (7WLXT3NR37)\)".*/\1/p' |
              head -n 1
          )"
          if [ -z "$IOS_DISTRIBUTION_IDENTITY" ]; then
            echo "No Apple Distribution identity for team 7WLXT3NR37 was found in the imported certificate" >&2
            exit 1
          fi
          echo "IOS_DISTRIBUTION_IDENTITY=$IOS_DISTRIBUTION_IDENTITY" >> "$GITHUB_ENV"
          echo "Using iOS distribution identity: $IOS_DISTRIBUTION_IDENTITY"

      - name: Install App Store provisioning profile
        env:
          IOS_PROD_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROD_PROVISIONING_PROFILE_BASE64 }}
          IOS_APPSTORE_KEYCHAIN_NAME: ios-appstore.keychain
        run: ./.github/scripts/install-app-store-provisioning-profile.sh

      - name: Archive, export, and upload to App Store Connect
        id: upload
        env:
          INPUT_BUILD_NUMBER: ${{ github.event.inputs.build_number }}
          CMUX_IOS_UPLOAD_DIR: ${{ runner.temp }}/cmux-ios-upload
          CMUX_BUILD_NUMBER_OUT_FILE: ${{ runner.temp }}/cmux-final-build-number.txt
        run: |
          set -euo pipefail
          # Version comes from CMUX_IOS_APPSTORE_MARKETING_VERSION in main.
          ARGS=(--lane appstore --signing manual --skip-notes)
          if [ -n "${INPUT_BUILD_NUMBER:-}" ]; then
            ARGS+=(--build-number "$INPUT_BUILD_NUMBER")
          fi
          ./ios/scripts/upload-testflight.sh "${ARGS[@]}" 2>&1 | tee "$RUNNER_TEMP/cmux-app-upload.log"
          if [ -f "$CMUX_BUILD_NUMBER_OUT_FILE" ]; then
            FINAL_BN="$(cat "$CMUX_BUILD_NUMBER_OUT_FILE")"
          else
            FINAL_BN="${INPUT_BUILD_NUMBER:-unknown}"
          fi
          echo "final_build_number=$FINAL_BN" >> "$GITHUB_OUTPUT"
          echo "Shipped CFBundleVersion: $FINAL_BN"

      - name: Record completed upload before group assignment
        env:
          BUILD_NUMBER: ${{ steps.upload.outputs.final_build_number }}
        run: |
          mkdir -p "$RUNNER_TEMP/cmux-app-upload-marker"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          marker = {'sha': os.environ['GITHUB_SHA'], 'app_id': '6783338052', 'build_number': os.environ['BUILD_NUMBER']}
          Path(os.environ['RUNNER_TEMP'], 'cmux-app-upload-marker', 'upload.json').write_text(json.dumps(marker))
          PY

      - name: Retain completed upload for assignment retries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cmux-app-testflight-upload
          retention-days: 90
          if-no-files-found: error
          path: ${{ runner.temp }}/cmux-app-upload-marker/upload.json

      - name: Save upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cmux-app-testflight-${{ github.sha }}
          retention-days: 14
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/cmux-final-build-number.txt
            ${{ runner.temp }}/cmux-app-upload.log
            ${{ runner.temp }}/cmux-ios-upload/*.log
            ${{ runner.temp }}/cmux-ios-upload/*.xcarchive/dSYMs

      - name: Summary
        if: always()
        env:
          BUILD_NUMBER: ${{ steps.upload.outputs.final_build_number || 'unknown' }}
        run: |
          {
            echo '### cmux.app internal TestFlight'
            echo '- App: 6783338052 (com.cmux.app)'
            echo "- Revision: $GITHUB_SHA"
            echo "- Build: $BUILD_NUMBER"
            echo '- Group: cmux release internal'
            echo '- App Review submission is a separate verified release action.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup signing material
        if: always()
        run: |
          rm -f "${ASC_API_KEY_PATH:-}"
          security delete-keychain ios-appstore.keychain >/dev/null 2>&1 || true

  assign-internal:
    name: Make build available to official internal testers
    needs: [decide, upload]
    if: >-
      always() && needs.decide.result == 'success' &&
      (needs.upload.result == 'success' || needs.upload.result == 'skipped') &&
      (needs.upload.outputs.build_number != '' || needs.decide.outputs.retry_build_number != '')
    runs-on: ${{ vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 40
    env:
      ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
      ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
      ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
      BUILD_NUMBER: ${{ needs.upload.outputs.build_number || needs.decide.outputs.retry_build_number }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Wait for processing and assign the official internal group
        run: |
          python3 ios/scripts/asc_assign_internal_testflight_group.py \
            --bundle-id com.cmux.app \
            --build-number "$BUILD_NUMBER" \
            --group-id ac3d6e62-36ce-4669-88e1-7ee489aac612
