name: iOS TestFlight (cmux.app)

on:
  # Upload the official bundle for internal testing. App Review remains manual.
  # Hourly polls batch main: they upload once IOS_APPSTORE_MIN_COMMITS
  # (default 10) commits are pending or the oldest is
  # IOS_APPSTORE_MAX_AGE_MINUTES (default 360) old.
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      build_number:
        description: CFBundleVersion to stamp (defaults to UTC yyyyMMddHHmmss)
        required: false
        default: ""

concurrency:
  # Serialize with the production App Review workflow. GitHub keeps one run
  # active and one pending run for a concurrency group; a newer scheduled run
  # replaces an older pending run, so the decide job must make retries safe.
  group: ios-app-store-production
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  decide:
    name: Check for new main revision
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    outputs:
      # The batch step, when it runs, has the last word on scheduled polls.
      upload: ${{ steps.batch.outputs.upload || steps.decide.outputs.upload }}
      retry_build_number: ${{ steps.decide.outputs.retry_build_number }}
    steps:
      - name: Skip an unchanged scheduled revision
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = schedule ]; then
            LAST_SHA="$(gh api "repos/$REPOSITORY/actions/workflows/ios-appstore-upload.yml/runs?branch=main&status=success&per_page=1" --jq '.workflow_runs[0].head_sha // ""')"
            # Successful runs can be skipped polls: use durable upload evidence
            # as the diff base, never advance it merely because a poll succeeded.
            LAST_UPLOAD_SHA="$(gh api "repos/$REPOSITORY/actions/artifacts?name=cmux-app-testflight-upload&per_page=100" --jq '[.artifacts[] | select(.expired == false and .workflow_run.head_branch == "main")] | max_by(.created_at) | .workflow_run.head_sha // ""' 2>/dev/null || true)"
            echo "last_upload_sha=$LAST_UPLOAD_SHA" >> "$GITHUB_OUTPUT"
            if [ "$LAST_SHA" = "$HEAD_SHA" ] && [ "$LAST_UPLOAD_SHA" = "$HEAD_SHA" ]; then
              echo 'upload=false' >> "$GITHUB_OUTPUT"
              echo 'Latest main already reached official internal TestFlight.' >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi
          if [ "$EVENT_NAME" = schedule ]; then
            RUN_IDS="$(gh api "repos/$REPOSITORY/actions/workflows/ios-appstore-upload.yml/runs?branch=main&status=completed&head_sha=$HEAD_SHA&per_page=20" --jq '.workflow_runs[].id')"
            for RUN_ID in $RUN_IDS; do
              MARKER_ID="$(gh api "repos/$REPOSITORY/actions/runs/$RUN_ID/artifacts" --jq '.artifacts[] | select(.name == "cmux-app-testflight-upload" and .expired == false) | .id')"
              [ -n "$MARKER_ID" ] || continue
              MARKER_DIR="$(mktemp -d)"
              gh run download "$RUN_ID" --repo "$REPOSITORY" --name cmux-app-testflight-upload --dir "$MARKER_DIR"
              BUILD_NUMBER="$(python3 - "$MARKER_DIR/upload.json" "$HEAD_SHA" <<'PYCODE'
          import json, re, sys
          with open(sys.argv[1]) as f:
              marker = json.load(f)
          assert marker['sha'] == sys.argv[2] and marker['app_id'] == '6783338052'
          assert re.fullmatch(r'[0-9]+', marker['build_number'])
          print(marker['build_number'])
          PYCODE
              )"
              rm -rf "$MARKER_DIR"
              echo 'upload=false' >> "$GITHUB_OUTPUT"
              echo "retry_build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
              echo "Retrying internal assignment for uploaded build $BUILD_NUMBER." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            done
          fi
          # Preserve same-head assignment retries above before considering a
          # skip. Missing/expired evidence and comparison failures build safely.
          if [ "$EVENT_NAME" = schedule ] && [ -n "${LAST_UPLOAD_SHA:-}" ]; then
            COMPARE_FILE="$(mktemp)"
            if gh api "repos/$REPOSITORY/compare/$LAST_UPLOAD_SHA...$HEAD_SHA" > "$COMPARE_FILE"; then
              if python3 - "$COMPARE_FILE" <<'PYCODE'
          import json, sys

          # All unrecognized paths remain build inputs. In particular iOS uses
          # Packages/macOS/CmuxPhonePush, shared protocols and scripts outside
          # ios/, so copying the INTERNAL lane's allowlist would miss inputs.
          def unrelated(path):
              if not isinstance(path, str) or not path:
                  return False
              if path.startswith(("web/", "docs/", "tests/", "cmuxTests/")):
                  return True
              if path.startswith(".github/workflows/"):
                  return path not in {
                      ".github/workflows/ios-appstore-upload.yml",
                      ".github/workflows/ios-testflight.yml",
                  }
              return False

          try:
              with open(sys.argv[1]) as handle:
                  comparison = json.load(handle)
              files = comparison["files"]
              # The compare API caps changed paths at 300. A full page cannot
              # prove that the omitted paths are unrelated to the iOS archive.
              safe = (comparison.get("status") in {"ahead", "identical"}
                      and isinstance(files, list) and len(files) < 300
                      and all(isinstance(item, dict)
                              and unrelated(item.get("filename"))
                              and ("previous_filename" not in item
                                   or unrelated(item["previous_filename"]))
                              for item in files))
          except (OSError, ValueError, KeyError, TypeError):
              safe = False
          sys.exit(0 if safe else 1)
          PYCODE
              then
                rm -f "$COMPARE_FILE"
                echo 'upload=false' >> "$GITHUB_OUTPUT"
                echo 'No iOS build inputs changed since the last completed upload.' >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
            fi
            rm -f "$COMPARE_FILE"
          fi
          echo 'upload=true' >> "$GITHUB_OUTPUT"

      # Batch scheduled polls: on a busy day nearly every hourly poll finds new
      # main commits, and each upload is a cold Release archive on the macOS
      # pool PR CI shares. Runs only when the rules above already chose to
      # upload against a known prior upload; manual dispatch is never batched.
      # Count only inputs accepted by the conservative public path filter.
      - name: Check out the upload batching policy
        # Batching only delays uploads; a failure here must fall back to the
        # decide job's answer instead of stopping scheduled uploads.
        continue-on-error: true
        if: >-
          steps.decide.outputs.upload == 'true' &&
          github.event_name == 'schedule' &&
          steps.decide.outputs.last_upload_sha != ''
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          # Commits and trees only: the batch counts first-parent commits,
          # which never needs file contents.
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            ios/scripts/fetch-testflight-notes-history.sh
            scripts/ci/ios_upload_batch_decision.py
          sparse-checkout-cone-mode: false

      - name: Batch official uploads by commit count and age
        # See the INTERNAL lane: bound the history deepen the same way the upload
        # job already bounds this script.
        timeout-minutes: 5
        # Batching only delays uploads; a failure here must fall back to the
        # decide job's answer instead of stopping scheduled uploads.
        continue-on-error: true
        id: batch
        if: >-
          steps.decide.outputs.upload == 'true' &&
          github.event_name == 'schedule' &&
          steps.decide.outputs.last_upload_sha != ''
        env:
          EVENT_NAME: ${{ github.event_name }}
          LAST_UPLOAD_SHA: ${{ steps.decide.outputs.last_upload_sha }}
          MIN_COMMITS: ${{ vars.IOS_APPSTORE_MIN_COMMITS }}
          MAX_AGE_MINUTES: ${{ vars.IOS_APPSTORE_MAX_AGE_MINUTES }}
        run: |
          set -euo pipefail
          ./ios/scripts/fetch-testflight-notes-history.sh "$LAST_UPLOAD_SHA"
          python3 scripts/ci/ios_upload_batch_decision.py \
            --event "$EVENT_NAME" \
            --base "$LAST_UPLOAD_SHA" \
            --min-commits "$MIN_COMMITS" \
            --max-age-minutes "$MAX_AGE_MINUTES" \
            --public-path-filter \
            --default-min-commits 10 \
            --default-max-age-minutes 360 \
            --output-name upload \
            --github-output "$GITHUB_OUTPUT" \
            --summary "$GITHUB_STEP_SUMMARY"

  upload:
    name: Upload to App Store Connect (com.cmux.app)
    # Only ever publish from main: the ASC secrets ship reviewed main, and a
    # dispatch against a feature branch must not upload arbitrary code.
    needs: decide
    if: needs.decide.outputs.upload == 'true' && github.ref == 'refs/heads/main'
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || vars.MACOS_RUNNER_IOS || 'blacksmith-6vcpu-macos-26' }}
    timeout-minutes: 90
    outputs:
      build_number: ${{ steps.upload.outputs.final_build_number }}
    env:
      ASC_APP_ID: "6783338052"
      ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
      ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          # Shallow and without submodules: this lane reads no git history
          # (notes come from ios/CHANGELOG.md, the build number is a UTC
          # timestamp) and the archive needs only the prebuilt
          # GhosttyKit.xcframework, keyed by the ghostty gitlink in this commit.
          # A full recursive clone took ~12 min of macOS runner time per run.
          fetch-depth: 1

      - name: Select Xcode
        env:
          CMUX_CI_MAX_MACOS_SDK_MAJOR: "26"
        run: ./scripts/select-ci-xcode.sh

      - name: Install asc CLI
        run: brew list asc >/dev/null 2>&1 || brew install asc

      # The verified prebuilt is the happy path (same pattern as
      # reload-build.yml). Zig and the ghostty source are fetched only when it
      # fails, immediately before the ensure-ghosttykit.sh from-source build
      # that needs them. The iOS app links GhosttyKit via a local-path
      # binaryTarget, so it must exist before package resolve.
      - name: Download prebuilt GhosttyKit
        id: ghosttykit_prebuilt
        run: |
          set -euo pipefail
          # The ghostty gitlink recorded in this commit is the submodule SHA
          # the from-source build would key on, without checking ghostty out.
          ghostty_sha="$(git rev-parse HEAD:ghostty)"
          # Same bounded budget the from-source provisioner used for this
          # download (3 retries, 300 s per attempt), so a missing release
          # falls back fast.
          if GHOSTTY_SHA="$ghostty_sha" \
            GHOSTTYKIT_DOWNLOAD_RETRIES=3 \
            GHOSTTYKIT_DOWNLOAD_RETRY_DELAY=5 \
            GHOSTTYKIT_DOWNLOAD_MAX_TIME=300 \
            ./scripts/download-prebuilt-ghosttykit.sh; then
            available=true
          else
            available=false
            echo "::warning::Prebuilt GhosttyKit for ghostty ${ghostty_sha} unavailable; building from source"
          fi
          echo "available=$available" >> "$GITHUB_OUTPUT"

      - name: Fetch ghostty and install zig for GhosttyKit fallback
        if: ${{ steps.ghosttykit_prebuilt.outputs.available != 'true' }}
        run: |
          set -euo pipefail
          # ghostty has no nested submodules; its pinned commit is fetchable
          # at depth 1.
          git submodule update --init --depth 1 ghostty
          ./scripts/install-zig-ci.sh

      - name: Build fallback GhosttyKit
        if: ${{ steps.ghosttykit_prebuilt.outputs.available != 'true' }}
        env:
          # The download step already proved the prebuilt path failed.
          CMUX_GHOSTTYKIT_NO_PREBUILT: "1"
        run: ./scripts/ensure-ghosttykit.sh

      - name: Verify provisioned GhosttyKit
        run: test -d GhosttyKit.xcframework

      - name: Materialize App Store Connect API key
        env:
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${ASC_API_KEY_ID:-}" ] || [ -z "${ASC_API_ISSUER_ID:-}" ] || [ -z "${ASC_API_KEY_P8_BASE64:-}" ]; then
            echo "Missing one of ASC_API_KEY_ID / ASC_API_ISSUER_ID / ASC_API_KEY_P8_BASE64 secrets" >&2
            exit 1
          fi
          KEY_DIR="$HOME/.appstoreconnect/private_keys"
          KEY_PATH="$KEY_DIR/AuthKey_${ASC_API_KEY_ID}.p8"
          mkdir -p "$KEY_DIR"
          printf '%s' "$ASC_API_KEY_P8_BASE64" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "ASC_API_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Import iOS distribution signing cert
        env:
          IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${IOS_DISTRIBUTION_CERTIFICATE_BASE64:-}" ]; then
            echo "Missing IOS_DISTRIBUTION_CERTIFICATE_BASE64 secret" >&2
            exit 1
          fi
          if [ -z "${IOS_DISTRIBUTION_CERTIFICATE_PASSWORD:-}" ]; then
            echo "Missing IOS_DISTRIBUTION_CERTIFICATE_PASSWORD secret" >&2
            exit 1
          fi

          KEYCHAIN_PASSWORD="$(uuidgen)"
          KEYCHAIN_NAME="ios-appstore.keychain"
          CERT_PATH="$RUNNER_TEMP/ios-distribution.p12"
          printf '%s' "$IOS_DISTRIBUTION_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
          security delete-keychain "$KEYCHAIN_NAME" >/dev/null 2>&1 || true
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_NAME"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"
          security import "$CERT_PATH" -k "$KEYCHAIN_NAME" -P "$IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"
          security list-keychains -d user -s "$KEYCHAIN_NAME"
          security find-identity -v -p codesigning "$KEYCHAIN_NAME"
          IOS_DISTRIBUTION_IDENTITY="$(
            security find-identity -v -p codesigning "$KEYCHAIN_NAME" |
              sed -n 's/.*"\(.* Distribution: .* (7WLXT3NR37)\)".*/\1/p' |
              head -n 1
          )"
          if [ -z "$IOS_DISTRIBUTION_IDENTITY" ]; then
            echo "No Apple Distribution identity for team 7WLXT3NR37 was found in the imported certificate" >&2
            exit 1
          fi
          echo "IOS_DISTRIBUTION_IDENTITY=$IOS_DISTRIBUTION_IDENTITY" >> "$GITHUB_ENV"
          echo "Using iOS distribution identity: $IOS_DISTRIBUTION_IDENTITY"

      - name: Install App Store provisioning profile
        env:
          IOS_PROD_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROD_PROVISIONING_PROFILE_BASE64 }}
          IOS_APPSTORE_EXTENSION_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_APPSTORE_EXTENSION_PROVISIONING_PROFILE_BASE64 }}
          IOS_APPSTORE_KEYCHAIN_NAME: ios-appstore.keychain
        run: ./.github/scripts/install-app-store-provisioning-profile.sh

      - name: Archive, export, and upload to App Store Connect
        id: upload
        env:
          INPUT_BUILD_NUMBER: ${{ github.event.inputs.build_number }}
          CMUX_IOS_UPLOAD_DIR: ${{ runner.temp }}/cmux-ios-upload
          CMUX_BUILD_NUMBER_OUT_FILE: ${{ runner.temp }}/cmux-final-build-number.txt
        run: |
          set -euo pipefail
          # Version comes from CMUX_IOS_APPSTORE_MARKETING_VERSION in main.
          ARGS=(--lane appstore --signing manual)
          if [ -n "${INPUT_BUILD_NUMBER:-}" ]; then
            ARGS+=(--build-number "$INPUT_BUILD_NUMBER")
          fi
          ./ios/scripts/upload-testflight.sh "${ARGS[@]}" 2>&1 | tee "$RUNNER_TEMP/cmux-app-upload.log"
          if [ -f "$CMUX_BUILD_NUMBER_OUT_FILE" ]; then
            FINAL_BN="$(cat "$CMUX_BUILD_NUMBER_OUT_FILE")"
          else
            FINAL_BN="${INPUT_BUILD_NUMBER:-unknown}"
          fi
          echo "final_build_number=$FINAL_BN" >> "$GITHUB_OUTPUT"
          echo "Shipped CFBundleVersion: $FINAL_BN"

      - name: Record completed upload before group assignment
        id: record_upload
        # The next scheduled poll skips this revision only if this marker
        # exists. The upload step can fail after Apple accepted the IPA (the
        # notes step did, hourly, in #13690), so a failed step still records
        # the upload when asc's receipt says "uploaded": true. The build number
        # file alone is not evidence: the script writes it before archiving.
        if: ${{ always() && steps.upload.outcome != 'skipped' }}
        env:
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
          BUILD_NUMBER: ${{ steps.upload.outputs.final_build_number }}
          BUILD_NUMBER_FILE: ${{ runner.temp }}/cmux-final-build-number.txt
          UPLOAD_RECEIPT: ${{ runner.temp }}/cmux-ios-upload/upload.log
        run: |
          mkdir -p "$RUNNER_TEMP/cmux-app-upload-marker"
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path

          def accepted(path):
              try:
                  text = Path(path).read_text(encoding='utf-8', errors='replace')
              except OSError:
                  return False
              # asc prints one JSON object; tolerate it pretty-printed or
              # surrounded by other lines.
              decoder = json.JSONDecoder()
              for start in (m.start() for m in re.finditer(r'\{', text)):
                  try:
                      value, _ = decoder.raw_decode(text, start)
                  except ValueError:
                      continue
                  if isinstance(value, dict) and value.get('uploaded') is True:
                      return True
              return False

          build_number = os.environ.get('BUILD_NUMBER', '').strip()
          if os.environ['UPLOAD_OUTCOME'] != 'success':
              if not accepted(os.environ['UPLOAD_RECEIPT']):
                  print('No App Store Connect upload receipt; not recording an upload.')
                  raise SystemExit(0)
              try:
                  build_number = Path(os.environ['BUILD_NUMBER_FILE']).read_text().strip()
              except OSError:
                  build_number = ''
          if not re.fullmatch(r'[0-9]+', build_number):
              print(f'No numeric build number ({build_number!r}); not recording an upload.')
              raise SystemExit(0)
          marker = {'sha': os.environ['GITHUB_SHA'], 'app_id': '6783338052', 'build_number': build_number}
          Path(os.environ['RUNNER_TEMP'], 'cmux-app-upload-marker', 'upload.json').write_text(json.dumps(marker))
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('recorded=true\n')
          print(f'Recorded upload of build {build_number} for {os.environ["GITHUB_SHA"]}.')
          PY

      - name: Retain completed upload for assignment retries
        if: ${{ always() && steps.record_upload.outputs.recorded == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cmux-app-testflight-upload
          retention-days: 90
          if-no-files-found: error
          path: ${{ runner.temp }}/cmux-app-upload-marker/upload.json

      - name: Save upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cmux-app-testflight-${{ github.sha }}
          retention-days: 14
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/cmux-final-build-number.txt
            ${{ runner.temp }}/cmux-app-upload.log
            ${{ runner.temp }}/cmux-ios-upload/*.log
            ${{ runner.temp }}/cmux-ios-upload/export/*.ipa
            ${{ runner.temp }}/cmux-ios-upload/export/*.xcarchive/dSYMs
            ${{ runner.temp }}/cmux-ios-upload/*.xcarchive/dSYMs

      - name: Summary
        if: always()
        env:
          BUILD_NUMBER: ${{ steps.upload.outputs.final_build_number || 'unknown' }}
        run: |
          {
            echo '### cmux.app internal TestFlight'
            echo '- App: 6783338052 (com.cmux.app)'
            echo "- Revision: $GITHUB_SHA"
            echo "- Build: $BUILD_NUMBER"
            echo '- Group: cmux release internal'
            echo '- App Review submission is a separate verified release action.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup signing material
        if: always()
        run: |
          rm -f "${ASC_API_KEY_PATH:-}"
          security delete-keychain ios-appstore.keychain >/dev/null 2>&1 || true

  assign-internal:
    name: Make build available to official internal testers
    needs: [decide, upload]
    if: >-
      always() && needs.decide.result == 'success' &&
      (needs.upload.result == 'success' || needs.upload.result == 'skipped') &&
      (needs.upload.outputs.build_number != '' || needs.decide.outputs.retry_build_number != '')
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 40
    env:
      ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
      ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
      ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
      BUILD_NUMBER: ${{ needs.upload.outputs.build_number || needs.decide.outputs.retry_build_number }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Wait for processing and assign the official internal group
        run: |
          python3 ios/scripts/asc_assign_internal_testflight_group.py \
            --bundle-id com.cmux.app \
            --build-number "$BUILD_NUMBER" \
            --group-id ac3d6e62-36ce-4669-88e1-7ee489aac612
