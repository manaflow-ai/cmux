name: cmux-next tooling-tests batch

# Every step of cmux-next-guards.yml's tooling-tests job at one feat-cmux-next commit, in the post-merge batch
# (cmux-next-post-merge.yml, suite tooling-tests).
#
# Leo, 2026-11-21: "de facto, im asking for 99% fewer minutes of ci time, period." tooling-tests was 47,832 runner-min
# in 24 h on pull requests (2026-11-24), nearly all of it steps the diff only reaches through a directory read or a
# whole-tree list. A pull request now runs the steps its changed files reach by name (tooling_steps.py route
# --pr-scope); every step still runs here, once a batch window, at the merged tip, where the batch's judge bisects a
# new red to its commit. `vars.CI_TOOLING_TESTS_PR_SCOPE` set to `0` runs the whole selection on the pull request
# again. The steps below are the job's own, copied whole; tests/test_ci_tooling_tests_batch.py keeps the two in step
# (change both). A dispatch runs this by hand.

on:
  workflow_call:
    inputs:
      sha:
        description: "The commit to test (the post-merge batch's tip or a bisect probe's commit). Empty: the event's own."
        type: string
        default: ""
      only:
        description: "The one job id to run (a bisect probe): tooling-tests. Empty: every job."
        type: string
        default: ""
  workflow_dispatch:

permissions: {}

concurrency:
  group: cmux-next-tooling-tests-batch${{ inputs.sha && format('-{0}-{1}', inputs.sha, inputs.only) || format('-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  tooling-tests:
    name: tooling-tests
    if: ${{ (inputs.only == '' || inputs.only == 'tooling-tests') && github.repository == 'manaflow-ai/cmux' }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || 'cmux-linux' }}
    permissions:
      contents: read
    timeout-minutes: 25
    steps:
      # A persistent pool VM keeps the last job's checkout as a git cache. One left sparse (patterns, skip-worktree
      # bits) or with a ref to a missing object makes actions/checkout leave files out or fail (runs 44739498261 and
      # 44733869883, 2026-11-20); remove it so checkout clones fresh. Its manual test: test_ci_reused_sparse_checkout.py.
      - name: Remove a reused workspace left sparse or broken (self-hosted Linux)
        id: setup-reused-workspace
        working-directory: ${{ github.workspace }}
        if: runner.os == 'Linux'
        shell: bash
        run: |
          [ "${RUNNER_ENVIRONMENT:-}" = self-hosted ] && [ -e "$GITHUB_WORKSPACE/.git" ] || exit 0
          cd "$GITHUB_WORKSPACE"
          why=""
          if [ "$(git config --get core.sparseCheckout 2>/dev/null)" = true ] || [ -e .git/info/sparse-checkout ]; then
            why="sparse"
          elif git ls-files -v 2>/dev/null | grep -q '^S'; then
            why="skip-worktree entries"
          elif ! git rev-parse --verify -q 'HEAD^{commit}' >/dev/null; then
            why="HEAD does not resolve"
          elif git for-each-ref --format='%(objectname)' 2>/dev/null | git cat-file --batch-check 2>/dev/null | grep -q ' missing$'; then
            why="a ref names a missing object"
          else
            exit 0
          fi
          echo "reused workspace on ${RUNNER_NAME:-this runner}: $why; removing it so checkout starts clean"
          find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.sha || '' }}
          persist-credentials: false
          # HEAD^1: a pull request's base for the registry check.
          fetch-depth: 2

      # A self-hosted Linux host reuses its workspace: drop the submodule checkouts a previous job
      # left there (a no-op on Blacksmith, which starts with none).
      - name: Drop stale submodule checkouts (self-hosted reused workspace)
        id: setup-submodules
        run: scripts/ci/reset-stale-submodules.sh

      # Four of these tests and the registry check read workflows with PyYAML. Fleet Linux and Blacksmith images
      # carry it, but a mini's python3 does not (ModuleNotFoundError: yaml on cmux14, 2026-11-03), so the job
      # puts its own copy first on PATH wherever it lands. pytest-xdist runs the two slowest files (the
      # webviews runner's and the web lint hook's tests, about 80 s each, nearly all of it waiting on
      # subprocesses and their timeouts at about 0.2 cores) four tests at a time; every test still runs,
      # each in its own temporary directory. A persistent host (the cmux-linux pool, a mini) keeps the venv
      # below ~/.cache, named for the pins and the interpreter, so a later job reuses it instead of a pip
      # install (4 to 10 s on every job, 2026-11-24); one that no longer imports is built again.
      - name: Prepare tooling-test Python (PyYAML, pytest-xdist)
        id: setup-python
        run: |
          set -euo pipefail
          pins=(PyYAML==6.0.3 pytest==8.3.5 pytest-xdist==3.6.1)
          key="$( { python3 -c 'import sys; print(sys.version, sys.executable)'; printf '%s\n' "${pins[@]}"; } | sha256sum | cut -c1-16)"
          cache="${XDG_CACHE_HOME:-$HOME/.cache}/cmux-ci"
          mkdir -p "$cache" 2>/dev/null && [ -w "$cache" ] || cache="$RUNNER_TEMP"
          venv="$cache/tooling-tests-venv-$key"
          build() {
            rm -rf "$1"
            python3 -m venv "$1"
            "$1/bin/python" -m pip install --disable-pip-version-check --no-input "${pins[@]}"
            touch "$1/.complete"
          }
          if [ -e "$venv/.complete" ] && "$venv/bin/python" -c 'import yaml, pytest, xdist' 2>/dev/null; then
            echo "reusing $venv"
          else
            # A venv's scripts name its own path, so it is built where it stays, by one job at a time (a lock over
            # 15 minutes old is a dead job's); a job that finds another building it builds its own in RUNNER_TEMP.
            find "$cache" -maxdepth 1 -name "tooling-tests-venv-$key.lock" -mmin +15 -exec rmdir {} + 2>/dev/null || true
            if mkdir "$venv.lock" 2>/dev/null; then
              trap 'rmdir "$venv.lock" 2>/dev/null || true' EXIT
              build "$venv"
            else
              venv="$RUNNER_TEMP/tooling-tests-venv"
              build "$venv"
            fi
          fi
          echo "$venv/bin" >> "$GITHUB_PATH"

      # Leo, 2026-11-19: "only meaningful tests ... not just there for ticky tack". Each selectable step below runs only
      # when this pull request's diff reaches a test it runs (scripts/ci/tooling_steps.py). A step of this job, not a
      # router job's: Linux CI is one persistent pool (hq decisions/junctions.md 2026-11-20), so no placement job is
      # left to carry it. Fails open: a failure here leaves tooling_all empty, and every step runs (on a pull request
      # into feat-cmux-next, as well as the table's copies).
      - name: Select the steps this diff reaches (tooling_steps.py)
        id: setup-tooling-route
        if: ${{ github.event_name == 'pull_request' }}
        continue-on-error: true
        timeout-minutes: 3
        env:
          CI_TOOLING_TESTS_PR_SCOPE: ${{ vars.CI_TOOLING_TESTS_PR_SCOPE || '1' }}
          GH_TOKEN: ${{ github.token }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_REF: ${{ github.head_ref }}
          CI_TOOLING_REUSE: ${{ vars.CI_TOOLING_REUSE }}
          CI_TOOLING_REUSE_AUDIT_PERCENT: ${{ vars.CI_TOOLING_REUSE_AUDIT_PERCENT }}
        run: |
          set -uo pipefail
          git diff --no-renames --name-only HEAD^1 HEAD > "$RUNNER_TEMP/changed.txt"
          added=(--added-deleted "$RUNNER_TEMP/added-deleted.txt")
          git diff --no-renames --name-only --diff-filter=AD HEAD^1 HEAD > "$RUNNER_TEMP/added-deleted.txt" || added=()
          # Leo, 2026-11-21: "de facto, im asking for 99% fewer minutes of ci time, period." --pr-scope leaves a step
          # selected only by a wide reach (a listed glob, a directory read, a whole-tree list) to the post-merge
          # batch's full run (cmux-next-tooling-tests-batch.yml, 47,832 runner-min a day on pull requests before).
          # CI_TOOLING_TESTS_PR_SCOPE=0 runs the whole selection on the pull request again.
          scope=(--pr-scope)
          [ "${CI_TOOLING_TESTS_PR_SCOPE:-1}" = 0 ] && scope=()
          if ! python3 scripts/ci/tooling_steps.py route --workflow .github/workflows/cmux-next-guards.yml \
              --job tooling-tests --changed-files "$RUNNER_TEMP/changed.txt" "${added[@]}" --event pull_request "${scope[@]}" \
              --github-output "$RUNNER_TEMP/tooling.out" --summary "$GITHUB_STEP_SUMMARY"; then
            echo "::warning title=tooling-tests selection::tooling_steps.py failed; tooling-tests runs every step."
            printf 'tooling_all=true\ntooling_steps=\n' > "$RUNNER_TEMP/tooling.out"
          elif [ "$HEAD_REPO" = "$GITHUB_REPOSITORY" ]; then
            # Drop the selected steps an earlier run of this pull request passed on a tree that differs from this
            # one only in files they cannot read (tooling_reuse.py; it leaves tooling.out alone on any error).
            timeout 100 python3 scripts/ci/tooling_reuse.py reuse --workflow .github/workflows/cmux-next-guards.yml \
                --job tooling-tests --route-output "$RUNNER_TEMP/tooling.out" --repository "$GITHUB_REPOSITORY" \
                --branch "$HEAD_REF" --run-id "$GITHUB_RUN_ID" --summary "$GITHUB_STEP_SUMMARY" \
              || echo "::warning title=tooling-tests reuse::tooling_reuse.py failed; every selected step runs."
          fi
          # A pull request into feat-cmux-next runs every other tt- step as ci/steps.toml's tooling-tests-1..5
          # (pr-pipeline.yml's linux job); here it keeps only the ones that job cannot run.
          if [ "${GITHUB_BASE_REF:-}" = feat-cmux-next ] && [ "$GITHUB_WORKFLOW" != "docs-only fallback" ]; then
            routed="$(sed -n 's/^tooling_steps=//p' "$RUNNER_TEMP/tooling.out")"
            all=true
            grep -qx 'tooling_all=false' "$RUNNER_TEMP/tooling.out" && all=false
            keep=" "
            for id in tt-remote-p10k tt-webviews-tests-per-file tt-web-lint-prepush tt-tailnet; do
              if [ "$all" = true ] || [[ "$routed" == *" $id "* ]]; then keep="$keep$id "; fi
            done
            printf 'tooling_all=false\ntooling_steps=%s\n' "$keep" > "$RUNNER_TEMP/tooling.out"
          fi
          cat "$RUNNER_TEMP/tooling.out" >> "$GITHUB_OUTPUT"

      # Bun for the web lint pre-push hook's step (tt-web-lint-prepush), set up before the steps run side by side.
      - name: Restore pinned Bun 1.4.4 from the CI cache bucket
        id: setup-restore-bun
        shell: bash
        continue-on-error: true
        run: bash "$GITHUB_WORKSPACE/scripts/ci/toolchain-r2.sh" restore bun 1.4.4 || true
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
          no-cache: ${{ !startsWith(github.workspace, '/home/runner/work/') || !(github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && github.event_name != 'merge_group' && contains(fromJSON('["refs/heads/main","refs/heads/feat-cmux-next","refs/heads/nightly-next"]'), github.ref)) }}
      - name: Set up Rust for the tailnet build-script fixture
        if: ${{ !cancelled() }}
        uses: ./.github/actions/setup-cmux-tui-rust

      # The selected steps below run side by side, at most one per core, from one process (tooling_steps.py run),
      # not one GitHub step after another: cmux#55649's head (job 139156353605) spent 7.3 min on about 70 steps
      # whose longest took 89 s. Every step keeps its own env, shell and timeout, its output is one group with its
      # time, and the job fails naming each one that failed. This step writes ran=true first, so each step's own
      # `if:` below skips it; when the runner cannot read the job it says so and they run one by one as before.
      # vars.CI_TOOLING_SIDE_BY_SIDE=0 turns it off. An expression in a step's env is the same key here.
      - name: Run the selected steps side by side (tooling_steps.py run)
        id: setup-tooling-run
        if: ${{ format('{0}', vars.CI_TOOLING_SIDE_BY_SIDE) != '0' }}
        env:
          EVENT_NAME: ${{ github.event_name }}
          FULL_CI: ${{ (contains(github.event.pull_request.labels.*.name, 'full-ci') && (github.event.pull_request.base.ref != 'feat-cmux-next' || (github.event.action == 'labeled' && github.event.label.name == 'full-ci') || (vars.CI_FULL_CI_ONE_SHOT || '1') == '0')) }}
          # The batch tests a merged tip: every finding warns.
          WARN_ONLY: --warn-only
        run: |
          python3 scripts/ci/tooling_steps.py run --workflow .github/workflows/cmux-next-tooling-tests-batch.yml \
            --job tooling-tests --selection "$RUNNER_TEMP/tooling.out" \
            --github-output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"

      - name: nightly-next's App ID and profile through the ASC API
        id: tt-asc-developer-id-app
        if: ${{ success() && steps.setup-tooling-run.outputs.ran != 'true' && (steps.setup-tooling-route.outputs.tooling_all != 'false' || contains(steps.setup-tooling-route.outputs.tooling_steps, ' tt-asc-developer-id-app ')) }}
        run: python3 tests/test_asc_developer_id_app.py

      # Time-bomb row: suites whose fixtures carry calendar dates, with the clock set to 2101. A test
      # that reads the real clock instead of passing its own goes red here, not the day a date passes.
      - name: Fixture-date suites with the clock at 2101 (CMUX_NOW_EPOCH)
        id: tt-fixture-dates-2101
        if: ${{ success() && steps.setup-tooling-run.outputs.ran != 'true' && (steps.setup-tooling-route.outputs.tooling_all != 'false' || contains(steps.setup-tooling-route.outputs.tooling_steps, ' tt-fixture-dates-2101 ')) }}
        env:
          CMUX_NOW_EPOCH: "4133980800"
        run: |
          python3 tests/test_asc_developer_id_app.py
          python3 -m unittest tests/test_lint_feature_flags_scope.py tests/test_lint_feature_flags_review_date.py

      - name: A malformed CMUX_NOW_EPOCH stops each script with one line
        id: tt-cmux-now-epoch
        if: ${{ success() && steps.setup-tooling-run.outputs.ran != 'true' && (steps.setup-tooling-route.outputs.tooling_all != 'false' || contains(steps.setup-tooling-route.outputs.tooling_steps, ' tt-cmux-now-epoch ')) }}
        run: python3 -I tests/test_cmux_now_epoch.py

      - name: The tooling-tests batch workflow has the job's steps, and --pr-scope defers only wide reasons
        id: tt-tooling-tests-batch
        if: ${{ success() && steps.setup-tooling-run.outputs.ran != 'true' && (steps.setup-tooling-route.outputs.tooling_all != 'false' || contains(steps.setup-tooling-route.outputs.tooling_steps, ' tt-tooling-tests-batch ')) }}
        run: python3 tests/test_ci_tooling_tests_batch.py

      # ios-placeholder-bounds (Leo, 2026-11-24): every placeholder the iOS app draws sits under
      # `.placeholderBound` and is listed with its bound in cmux-next-ios/design/placeholders.json.
      # The simulator half is cmux-next-ios/UITests/PlaceholderBoundUITests.swift.
      - name: Every iOS placeholder has a listed bound (ios-placeholder-bounds)
        id: tt-ios-placeholder-bounds
        if: ${{ success() && steps.setup-tooling-run.outputs.ran != 'true' && (steps.setup-tooling-route.outputs.tooling_all != 'false' || contains(steps.setup-tooling-route.outputs.tooling_steps, ' tt-ios-placeholder-bounds ')) }}
        run: python3 -I tests/test_ios_placeholder_bounds.py

      - name: A rebuilt cmux-tui commit reuses its earlier publication
        id: tt-cmux-tui-republish
        if: ${{ success() && steps.setup-tooling-run.outputs.ran != 'true' && (steps.setup-tooling-route.outputs.tooling_all != 'false' || contains(steps.setup-tooling-route.outputs.tooling_steps, ' tt-cmux-tui-republish ')) }}
        run: python3 tests/test_cmux_tui_republish_same_commit.py

      - name: verify-cmux-tui-hosted.sh leaves its hosted run alone when the wait ends
        id: tt-verify-cmux-tui-hosted
        if: ${{ success() && steps.setup-tooling-run.outputs.ran != 'true' && (steps.setup-tooling-route.outputs.tooling_all != 'false' || contains(steps.setup-tooling-route.outputs.tooling_steps, ' tt-verify-cmux-tui-hosted ')) }}
        run: python3 tests/test_verify_cmux_tui_hosted.py

      - name: The crash ratchet is judged against the base
        id: tt-crash-ratchet
        if: ${{ success() && steps.setup-tooling-run.outputs.ran != 'true' && (steps.setup-tooling-route.outputs.tooling_all != 'false' || contains(steps.setup-tooling-route.outputs.tooling_steps, ' tt-crash-ratchet ')) }}
        run: python3 tests/test_crash_ratchet_compare.py

      - name: The spawn-owner ratchet's rules (cmuxterm-hq#9096)
        id: tt-spawn-owner-ratchet
        if: ${{ success() && steps.setup-tooling-run.outputs.ran != 'true' && (steps.setup-tooling-route.outputs.tooling_all != 'false' || contains(steps.setup-tooling-route.outputs.tooling_steps, ' tt-spawn-owner-ratchet ')) }}
        run: python3 tests/test_spawn_owner_ratchet.py

      - name: The red-checks line of the PR status comment
        id: tt-pr-red-checks-comment
        if: ${{ success() && steps.setup-tooling-run.outputs.ran != 'true' && (steps.setup-tooling-route.outputs.tooling_all != 'false' || contains(steps.setup-tooling-route.outputs.tooling_steps, ' tt-pr-red-checks-comment ')) }}
        run: python3 tests/test_pr_red_checks_comment.py

      - name: The backdrop art catalog and brightness range
        id: tt-backdrop-art
        if: ${{ success() && steps.setup-tooling-run.outputs.ran != 'true' && (steps.setup-tooling-route.outputs.tooling_all != 'false' || contains(steps.setup-tooling-route.outputs.tooling_steps, ' tt-backdrop-art ')) }}
        run: python3 tests/test_backdrop_art_generator.py

      - name: Remote Powerlevel10k prompt reset compatibility
        id: tt-remote-p10k
        if: ${{ success() && steps.setup-tooling-run.outputs.ran != 'true' && (steps.setup-tooling-route.outputs.tooling_all != 'false' || contains(steps.setup-tooling-route.outputs.tooling_steps, ' tt-remote-p10k ')) }}
        run: |
          if ! command -v zsh >/dev/null 2>&1; then
            bash scripts/ci/apt-ensure.sh zsh
          fi
          python3 tests/test_issue_4148_remote_p10k_keyboard_reset.py

      - name: The fast gates workflow and its merge and gate script
        id: tt-fast-gates
        if: ${{ success() && steps.setup-tooling-run.outputs.ran != 'true' && (steps.setup-tooling-route.outputs.tooling_all != 'false' || contains(steps.setup-tooling-route.outputs.tooling_steps, ' tt-fast-gates ')) }}
        run: |
          python3 tests/test_cmux_next_fast_gates.py
          python3 tests/test_ci_entry_logs.py

      - name: A scheduled dispatch runs the whole Swift suite on the feat-cmux-next tip
        id: tt-tip-swift-suite
        if: ${{ success() && steps.setup-tooling-run.outputs.ran != 'true' && (steps.setup-tooling-route.outputs.tooling_all != 'false' || contains(steps.setup-tooling-route.outputs.tooling_steps, ' tt-tip-swift-suite ')) }}
        run: python3 tests/test_cmux_next_tip_swift_suite.py

      - name: A quit scheduled on the run loop never exits a test process
        id: tt-deferred-terminate
        if: ${{ success() && steps.setup-tooling-run.outputs.ran != 'true' && (steps.setup-tooling-route.outputs.tooling_all != 'false' || contains(steps.setup-tooling-route.outputs.tooling_steps, ' tt-deferred-terminate ')) }}
        run: python3 tests/test_cmux_next_deferred_terminate.py

      - name: Every check path a merger reads matches a tracked file
        id: tt-check-paths
        if: ${{ success() && steps.setup-tooling-run.outputs.ran != 'true' && (steps.setup-tooling-route.outputs.tooling_all != 'false' || contains(steps.setup-tooling-route.outputs.tooling_steps, ' tt-check-paths ')) }}
        run: python3 tests/test_check_paths.py

      - name: A toast's button never opens Settings as a stand-in
        id: tt-toast-targets
        if: ${{ success() && steps.setup-tooling-run.outputs.ran != 'true' && (steps.setup-tooling-route.outputs.tooling_all != 'false' || contains(steps.setup-tooling-route.outputs.tooling_steps, ' tt-toast-targets ')) }}
        run: python3 tests/test_check_toast_targets.py

      - name: The crash-class rules fast gate fails only on findings the pull request adds
        id: tt-crash-class-fast-gate
        if: ${{ success() && steps.setup-tooling-run.outputs.ran != 'true' && (steps.setup-tooling-route.outputs.tooling_all != 'false' || contains(steps.setup-tooling-route.outputs.tooling_steps, ' tt-crash-class-fast-gate ')) }}
        run: python3 tests/test_crash_class_fast_gate.py

      - name: The localization debt ratchet
        id: tt-localization-catalog
        if: ${{ success() && steps.setup-tooling-run.outputs.ran != 'true' && (steps.setup-tooling-route.outputs.tooling_all != 'false' || contains(steps.setup-tooling-route.outputs.tooling_steps, ' tt-localization-catalog ')) }}
        run: python3 tests/test_localization_catalog.py

      - name: A stacked cmux NEXT pull request skips ci.yml's legacy lanes
        id: tt-next-line
        if: ${{ success() && steps.setup-tooling-run.outputs.ran != 'true' && (steps.setup-tooling-route.outputs.tooling_all != 'false' || contains(steps.setup-tooling-route.outputs.tooling_steps, ' tt-next-line ')) }}
        run: python3 tests/test_next_line.py

      # web-validation.yml ran this only on main pushes, so a2d6b35 broke the runner's test on
      # feat-cmux-next unseen (#23430). A fake bun stands in; no web test runs.
      - name: The per-file webviews test runner (scripts/ci/run-webviews-tests.sh)
        id: tt-webviews-tests-per-file
        if: ${{ success() && steps.setup-tooling-run.outputs.ran != 'true' && (steps.setup-tooling-route.outputs.tooling_all != 'false' || contains(steps.setup-tooling-route.outputs.tooling_steps, ' tt-webviews-tests-per-file ')) }}
        run: python3 -m pytest -p no:cacheprovider -n 4 -v tests/test_webviews_tests_per_file.py

      # The TAP health classifier and its base-red integration stay on the same
      # tooling-tests PR lane as the producer's published snapshot contract.
      - name: The TAP test-health classifier and base-red evidence
        id: tt-tap-test-health
        if: ${{ success() && steps.setup-tooling-run.outputs.ran != 'true' && (steps.setup-tooling-route.outputs.tooling_all != 'false' || contains(steps.setup-tooling-route.outputs.tooling_steps, ' tt-tap-test-health ')) }}
        run: python3 tests/test_tap_test_health.py

      # A test no feat-cmux-next pull request runs lands red unseen: a2d6b35 broke
      # tests/test_webviews_tests_per_file.py, which only main pushes and the nightly ran (#23430).
      - name: Every Python test runs on a pull request lane, or is a reviewed exemption
        id: tt-pr-lane-coverage
        if: ${{ success() && steps.setup-tooling-run.outputs.ran != 'true' && (steps.setup-tooling-route.outputs.tooling_all != 'false' || contains(steps.setup-tooling-route.outputs.tooling_steps, ' tt-pr-lane-coverage ')) }}
        run: python3 tests/test_pr_lane_coverage.py

      # The registry check with the pull request lanes: a test no feat-cmux-next pull request
      # runs needs a job that runs it (routed by the paths it tests) or an entry in
      # tests/pr-lane-exemptions.json with the reason. ci-guards.yml's copy of this check is in
      # the preflight group, which feat-cmux-next pull requests do not run. HEAD^1 is the base.
      # A finding the base already has warns, and on a push every finding warns: only the pull
      # request that adds an unregistered test fails (Leo, 2026-11-05).
      - name: The Python test registry, and the tests no pull request runs
        id: tt-test-registry
        if: ${{ success() && steps.setup-tooling-run.outputs.ran != 'true' && (steps.setup-tooling-route.outputs.tooling_all != 'false' || contains(steps.setup-tooling-route.outputs.tooling_steps, ' tt-test-registry ')) }}
        env:
          # The batch tests a merged tip: every finding warns.
          WARN_ONLY: --warn-only
        run: python3 scripts/ci/validate_test_execution_registry.py --pr-lanes feat-cmux-next --base-sha "$(git rev-parse HEAD^1)" $WARN_ONLY

      # A Swift test target no pull request check runs (hq#11644): cmux#43937 added seven tests that
      # the fast tier built and listed, and no check ran. The tree check fails on a package test
      # target with no runner and no scripts/ci/swift-test-targets.json entry. On a pull request the
      # diff check (HEAD^1 is the base) warns on a new CmuxNext test target that no fast-tier.json
      # entry covers: `cmux-next swift test` first runs it after merge (the tip suite dispatch).
      - name: Every Swift test target runs in a pull request check (swift_test_coverage.py)
        id: tt-swift-test-coverage
        if: ${{ !cancelled() && steps.setup-tooling-run.outputs.ran != 'true' && (steps.setup-tooling-route.outputs.tooling_all != 'false' || contains(steps.setup-tooling-route.outputs.tooling_steps, ' tt-swift-test-coverage ')) }}
        env:
          EVENT_NAME: ${{ github.event_name }}
          FULL_CI: ${{ (contains(github.event.pull_request.labels.*.name, 'full-ci') && (github.event.pull_request.base.ref != 'feat-cmux-next' || (github.event.action == 'labeled' && github.event.label.name == 'full-ci') || (vars.CI_FULL_CI_ONE_SHOT || '1') == '0')) }}
        run: |
          set -euo pipefail
          args=()
          if [[ "$EVENT_NAME" == pull_request ]]; then args+=(--base "$(git rev-parse HEAD^1)"); fi
          if [[ "$FULL_CI" == true ]]; then args+=(--full-ci); fi
          python3 -I scripts/ci/swift_test_coverage.py ${args[@]+"${args[@]}"}

      - name: The Swift test target coverage check's own tests (swift_test_coverage.py)
        id: tt-swift-test-coverage-tests
        if: ${{ !cancelled() && steps.setup-tooling-run.outputs.ran != 'true' && (steps.setup-tooling-route.outputs.tooling_all != 'false' || contains(steps.setup-tooling-route.outputs.tooling_steps, ' tt-swift-test-coverage-tests ')) }}
        run: python3 -I tests/test_swift_test_coverage.py

      - name: The Swift Cloud networking count's own tests (swift-cloud-http.py)
        id: tt-swift-cloud-http-tests
        if: ${{ !cancelled() && steps.setup-tooling-run.outputs.ran != 'true' && (steps.setup-tooling-route.outputs.tooling_all != 'false' || contains(steps.setup-tooling-route.outputs.tooling_steps, ' tt-swift-cloud-http-tests ')) }}
        run: python3 -I tests/test_swift_cloud_http.py


      # The web lint pre-push hook (scripts/web-lint.sh, scripts/web_lint_prepush.py) on throwaway
      # repositories with stand-in packages; cmux-next-web.yml ran it only on pushes. A stand-in
      # package with no node_modules gets a `bun install`.
      - name: The web lint pre-push hook
        id: tt-web-lint-prepush
        if: ${{ success() && steps.setup-tooling-run.outputs.ran != 'true' && (steps.setup-tooling-route.outputs.tooling_all != 'false' || contains(steps.setup-tooling-route.outputs.tooling_steps, ' tt-web-lint-prepush ')) }}
        run: python3 -m pytest -p no:cacheprovider -n 4 -v tests/test_web_lint_prepush.py

      # Tests of feat-cmux-next tooling that no feat pull request ran: some had no registry entry,
      # others ran only from a push, schedule, release or main-only job, so a feat pull request
      # that broke their code landed green (tests/test_pr_lane_coverage.py). Each is stdlib Python
      # with fakes for the binaries and network it calls. They run even after an earlier red so
      # one red does not hide another.
      - name: The app-linked crate license gate (check_app_crate_licenses.py)
        id: tt-app-crate-licenses
        if: ${{ !cancelled() && steps.setup-tooling-run.outputs.ran != 'true' && (steps.setup-tooling-route.outputs.tooling_all != 'false' || contains(steps.setup-tooling-route.outputs.tooling_steps, ' tt-app-crate-licenses ')) }}
        run: python3 tests/test_app_crate_licenses.py

      - name: The selector check's fleet step wrapper refuses other arguments (check-objc-selectors.sh)
        id: tt-objc-selectors-step
        if: ${{ !cancelled() && steps.setup-tooling-run.outputs.ran != 'true' && (steps.setup-tooling-route.outputs.tooling_all != 'false' || contains(steps.setup-tooling-route.outputs.tooling_steps, ' tt-objc-selectors-step ')) }}
        run: python3 tests/test_check_objc_selectors_step.py

      - name: The package lane's prebuild-one compiles or fails (package-test-lane.sh)
        id: tt-package-lane-prebuild
        if: ${{ !cancelled() && steps.setup-tooling-run.outputs.ran != 'true' && (steps.setup-tooling-route.outputs.tooling_all != 'false' || contains(steps.setup-tooling-route.outputs.tooling_steps, ' tt-package-lane-prebuild ')) }}
        run: python3 tests/test_ci_package_lane_prebuild.py

      - name: The iOS simulator step runs the declared runtime, never just the newest (ios_sim_runtime.py)
        id: tt-ios-sim-runtime
        if: ${{ !cancelled() && steps.setup-tooling-run.outputs.ran != 'true' && (steps.setup-tooling-route.outputs.tooling_all != 'false' || contains(steps.setup-tooling-route.outputs.tooling_steps, ' tt-ios-sim-runtime ')) }}
        run: python3 -I tests/test_ios_sim_runtime.py

      - name: Every simulator the iOS simulator step makes goes through sim_create (the fleet worker's slim helper, else simctl create)
        id: tt-ios-sim-create
        if: ${{ !cancelled() && steps.setup-tooling-run.outputs.ran != 'true' && (steps.setup-tooling-route.outputs.tooling_all != 'false' || contains(steps.setup-tooling-route.outputs.tooling_steps, ' tt-ios-sim-create ')) }}
        run: python3 -I tests/test_ios_sim_create.py

      - name: Fast gates run side by side; only the two bun gates share a lane (cmux_next_fast_gates.py)
        id: tt-fast-gates-lanes
        if: ${{ !cancelled() && steps.setup-tooling-run.outputs.ran != 'true' && (steps.setup-tooling-route.outputs.tooling_all != 'false' || contains(steps.setup-tooling-route.outputs.tooling_steps, ' tt-fast-gates-lanes ')) }}
        run: python3 -I tests/test_fast_gates_lanes.py

      - name: The iOS simulator step reuses a verified FFI build, and a broken cache only warns (ios_ffi_cache.py)
        id: tt-ios-ffi-cache
        if: ${{ !cancelled() && steps.setup-tooling-run.outputs.ran != 'true' && (steps.setup-tooling-route.outputs.tooling_all != 'false' || contains(steps.setup-tooling-route.outputs.tooling_steps, ' tt-ios-ffi-cache ')) }}
        run: python3 -I tests/test_ios_ffi_cache.py

      - name: The iOS Chief benchmark repeats one simulator and requires retained measurements
        id: tt-ios-chief-benchmark
        if: ${{ !cancelled() && steps.setup-tooling-run.outputs.ran != 'true' && (steps.setup-tooling-route.outputs.tooling_all != 'false' || contains(steps.setup-tooling-route.outputs.tooling_steps, ' tt-ios-chief-benchmark ')) }}
        run: python3 -I tests/test_ios_chief_benchmark_route.py

      # cmux-next-ios replaces the classic app under the production App Store record. Its listing
      # (cmux-next-ios/AppStoreReview/metadata) names only screens the release app shows, in every
      # locale, and its review notes sync script fills or refuses every value (asc_review_package.py).
      - name: The cmux-next-ios App Store listing names only screens the app has, in every locale
        id: tt-ios-appstore-listing
        if: ${{ !cancelled() && steps.setup-tooling-run.outputs.ran != 'true' && (steps.setup-tooling-route.outputs.tooling_all != 'false' || contains(steps.setup-tooling-route.outputs.tooling_steps, ' tt-ios-appstore-listing ')) }}
        run: python3 -I tests/test_ios_appstore_listing_text.py

      - name: The cmux-next-ios App Review notes and Support URL sync (asc_review_package.py)
        id: tt-asc-review-package
        if: ${{ !cancelled() && steps.setup-tooling-run.outputs.ran != 'true' && (steps.setup-tooling-route.outputs.tooling_all != 'false' || contains(steps.setup-tooling-route.outputs.tooling_steps, ' tt-asc-review-package ')) }}
        run: python3 -I tests/test_asc_review_package.py

      # The display suite list is derived from the suites' own display skip traits wherever it
      # is read, never committed; this derives it from every package's tests and checks the parser.
      - name: The display suite list derives from the suites' display skip traits (display_suites.py)
        id: tt-display-suites
        if: ${{ !cancelled() && steps.setup-tooling-run.outputs.ran != 'true' && (steps.setup-tooling-route.outputs.tooling_all != 'false' || contains(steps.setup-tooling-route.outputs.tooling_steps, ' tt-display-suites ')) }}
        run: |
          python3 scripts/ci/display_suites.py
          python3 tests/test_ci_display_suites.py

      - name: The exact-run SwiftPM test product transport (swiftpm_test_product.py)
        id: tt-swiftpm-test-product
        if: ${{ !cancelled() && steps.setup-tooling-run.outputs.ran != 'true' && (steps.setup-tooling-route.outputs.tooling_all != 'false' || contains(steps.setup-tooling-route.outputs.tooling_steps, ' tt-swiftpm-test-product ')) }}
        run: python3 tests/test_swiftpm_test_product.py

      - name: The String Catalog compile of the CmuxNext test bundles
        id: tt-compile-string-catalogs
        if: ${{ !cancelled() && steps.setup-tooling-run.outputs.ran != 'true' && (steps.setup-tooling-route.outputs.tooling_all != 'false' || contains(steps.setup-tooling-route.outputs.tooling_steps, ' tt-compile-string-catalogs ')) }}
        run: python3 tests/test_compile_string_catalogs.py

      - name: The deferred DEV publication notifier (cmux_next_tree_notify.py)
        id: tt-dev-daily-notify
        if: ${{ !cancelled() && steps.setup-tooling-run.outputs.ran != 'true' && (steps.setup-tooling-route.outputs.tooling_all != 'false' || contains(steps.setup-tooling-route.outputs.tooling_steps, ' tt-dev-daily-notify ')) }}
        run: python3 tests/test_cmux_next_dev_daily_notify_cli.py

      - name: The cmux-tui tree publication (publish-cmux-tui-tree.py)
        id: tt-publish-cmux-tui-tree
        if: ${{ !cancelled() && steps.setup-tooling-run.outputs.ran != 'true' && (steps.setup-tooling-route.outputs.tooling_all != 'false' || contains(steps.setup-tooling-route.outputs.tooling_steps, ' tt-publish-cmux-tui-tree ')) }}
        run: python3 tests/test_publish_cmux_tui_tree.py

      - name: The tour media publisher's extra windows (media/publish.py)
        id: tt-media-publish-windows
        if: ${{ !cancelled() && steps.setup-tooling-run.outputs.ran != 'true' && (steps.setup-tooling-route.outputs.tooling_all != 'false' || contains(steps.setup-tooling-route.outputs.tooling_steps, ' tt-media-publish-windows ')) }}
        run: python3 tests/test_cmux_next_media_publish_windows.py

      - name: The Mach-O filter of the app thinning (list-macho-candidates.py)
        id: tt-macho-candidates
        if: ${{ !cancelled() && steps.setup-tooling-run.outputs.ran != 'true' && (steps.setup-tooling-route.outputs.tooling_all != 'false' || contains(steps.setup-tooling-route.outputs.tooling_steps, ' tt-macho-candidates ')) }}
        run: python3 tests/test_list_macho_candidates.py

      - name: The cross build's macOS link stubs and Mach-O parity verdict
        id: tt-macos-stubs-parity
        if: ${{ !cancelled() && steps.setup-tooling-run.outputs.ran != 'true' && (steps.setup-tooling-route.outputs.tooling_all != 'false' || contains(steps.setup-tooling-route.outputs.tooling_steps, ' tt-macos-stubs-parity ')) }}
        run: |
          python3 tests/test_ci_macos_stubs.py
          python3 tests/test_ci_macho_parity.py


      - name: The tailnet target selection and job-local Go installer
        id: tt-tailnet
        if: ${{ !cancelled() && steps.setup-tooling-run.outputs.ran != 'true' && (steps.setup-tooling-route.outputs.tooling_all != 'false' || contains(steps.setup-tooling-route.outputs.tooling_steps, ' tt-tailnet ')) }}
        run: |
          python3 tests/test_tailnet_build_delivery.py
          python3 tests/test_tailnet_go.py
          bash scripts/cmux-next/tests/rust-daemon-miss-builds.test.sh

      - name: The cmux-browser-host release package
        id: tt-browser-host-release
        if: ${{ !cancelled() && steps.setup-tooling-run.outputs.ran != 'true' && (steps.setup-tooling-route.outputs.tooling_all != 'false' || contains(steps.setup-tooling-route.outputs.tooling_steps, ' tt-browser-host-release ')) }}
        run: python3 tests/test_browser_host_release_package.py

      # A remote that does not answer is retried and named as the network, never read as a missing
      # ref, and no script swallows a remote read's failure (nightly run 43113697713).
      - name: Remote reads tell no answer from no ref
        id: tt-origin-net
        if: ${{ !cancelled() && steps.setup-tooling-run.outputs.ran != 'true' && (steps.setup-tooling-route.outputs.tooling_all != 'false' || contains(steps.setup-tooling-route.outputs.tooling_steps, ' tt-origin-net ')) }}
        run: bash scripts/cmux-next/tests/origin-net.test.sh

      # Every scripts/measure test, each named PASS, FAIL or SKIP with its reason: only 4 of 45 had their own step
      # and the rest went unrun (2026-11-18). A new measure test runs here with no step of its own.
      - name: Every scripts/measure test passes (run-all.sh)
        id: tt-measure-tests
        if: ${{ !cancelled() && steps.setup-tooling-run.outputs.ran != 'true' && (steps.setup-tooling-route.outputs.tooling_all != 'false' || contains(steps.setup-tooling-route.outputs.tooling_steps, ' tt-measure-tests ')) }}
        run: bash scripts/measure/tests/run-all.sh

      # scripts/checkup (ask-f70cfb2563): the session timing and configuration checkups read the daemon's and the
      # settings owner's answers right, and never call an unreadable answer clean.
      - name: session-timing checkup reads acpmux history as the Timing tab does
        id: tt-checkup-session-timing
        if: ${{ !cancelled() && steps.setup-tooling-run.outputs.ran != 'true' && (steps.setup-tooling-route.outputs.tooling_all != 'false' || contains(steps.setup-tooling-route.outputs.tooling_steps, ' tt-checkup-session-timing ')) }}
        run: python3 -I scripts/checkup/tests/session-timing.test.py

      - name: configuration checkup sorts settings validate into clean, problems and unreadable
        id: tt-checkup-configuration
        if: ${{ !cancelled() && steps.setup-tooling-run.outputs.ran != 'true' && (steps.setup-tooling-route.outputs.tooling_all != 'false' || contains(steps.setup-tooling-route.outputs.tooling_steps, ' tt-checkup-configuration ')) }}
        run: python3 -I scripts/checkup/tests/configuration.test.py


      # A Mac whose sudoers grants purge but not launchctl ran every launch-ready step into "a password is required".
      - name: console-session.sh hops into Aqua only when it must and sudo grants launchctl
        id: tt-console-session-hop
        if: ${{ !cancelled() && steps.setup-tooling-run.outputs.ran != 'true' && (steps.setup-tooling-route.outputs.tooling_all != 'false' || contains(steps.setup-tooling-route.outputs.tooling_steps, ' tt-console-session-hop ')) }}
        run: bash scripts/ci/tests/console-session-hop.test.sh

      # The tour's base app waited 45 min for a cmux-tui tree nothing publishes and recorded no clip.
      - name: media_build_app.sh builds cmux-tui on the Mac for an unpublished tree
        id: tt-media-build-app-local-tui
        if: ${{ !cancelled() && steps.setup-tooling-run.outputs.ran != 'true' && (steps.setup-tooling-route.outputs.tooling_all != 'false' || contains(steps.setup-tooling-route.outputs.tooling_steps, ' tt-media-build-app-local-tui ')) }}
        run: bash scripts/ci/tests/media-build-app-local-tui.test.sh

      # The installation's API rate limit failed a nightly tour at its merge base, before any build.
      - name: media_merge_base.sh falls back to git past the shallow boundary
        id: tt-media-merge-base
        if: ${{ !cancelled() && steps.setup-tooling-run.outputs.ran != 'true' && (steps.setup-tooling-route.outputs.tooling_all != 'false' || contains(steps.setup-tooling-route.outputs.tooling_steps, ' tt-media-merge-base ')) }}
        run: bash scripts/ci/tests/media-merge-base.test.sh

      # One dropped ghostty-next clone lost every What's New before at 8f9660c2 (run 45837430593).
      - name: media_tree_submodules.sh takes a tour tree's submodules from the head's clones, three tries
        id: tt-media-tree-submodules
        if: ${{ !cancelled() && steps.setup-tooling-run.outputs.ran != 'true' && (steps.setup-tooling-route.outputs.tooling_all != 'false' || contains(steps.setup-tooling-route.outputs.tooling_steps, ' tt-media-tree-submodules ')) }}
        run: bash scripts/ci/tests/media-tree-submodules.test.sh

      # launch-ready.sh judges each restore case against its expectation (the launch reopens exactly where the person
      # was, Home included) and flags an A/B whose arms first showed different surfaces as not like for like.
      - name: launch-ready judges each restore case and flags a surface diff
        id: tt-launch-ready-cases
        if: ${{ !cancelled() && steps.setup-tooling-run.outputs.ran != 'true' && (steps.setup-tooling-route.outputs.tooling_all != 'false' || contains(steps.setup-tooling-route.outputs.tooling_steps, ' tt-launch-ready-cases ')) }}
        run: |
          python3 scripts/measure/tests/launch-ready-summary.test.py
          bash scripts/measure/tests/launch-ready-cases.test.sh

      # RFD 0134 Table 4 row 1: the installer package's postinstall pre-warms the installed copy as the console user,
      # bounded, and never fails the install; build-pkg.sh never relocates or version-skips the app.
      - name: cmux NEXT installer package and its pre-warm postinstall
        id: tt-next-pkg
        if: ${{ !cancelled() && steps.setup-tooling-run.outputs.ran != 'true' && (steps.setup-tooling-route.outputs.tooling_all != 'false' || contains(steps.setup-tooling-route.outputs.tooling_steps, ' tt-next-pkg ')) }}
        run: bash scripts/cmux-next/tests/next-pkg.test.sh

      - name: install-zig-ci.sh installs only a reviewed Zig
        id: tt-install-zig
        if: ${{ !cancelled() && steps.setup-tooling-run.outputs.ran != 'true' && (steps.setup-tooling-route.outputs.tooling_all != 'false' || contains(steps.setup-tooling-route.outputs.tooling_steps, ' tt-install-zig ')) }}
        run: python3 tests/test_install_zig_ci_reviewed_version.py

      - name: The Xcode project normalizer of the commit hook and merge driver (normalize-pbxproj.py)
        id: tt-normalize-pbxproj
        if: ${{ !cancelled() && steps.setup-tooling-run.outputs.ran != 'true' && (steps.setup-tooling-route.outputs.tooling_all != 'false' || contains(steps.setup-tooling-route.outputs.tooling_steps, ' tt-normalize-pbxproj ')) }}
        run: python3 tests/test_normalize_pbxproj.py

      - name: The web verdict of feat-cmux-next pushes and web routing (web_validation.py)
        id: tt-web-validation
        if: ${{ !cancelled() && steps.setup-tooling-run.outputs.ran != 'true' && (steps.setup-tooling-route.outputs.tooling_all != 'false' || contains(steps.setup-tooling-route.outputs.tooling_steps, ' tt-web-validation ')) }}
        run: python3 tests/test_web_validation.py

      # cmux-next-tip-test-compile.yml runs the script only on feat-cmux-next pushes, so a pull
      # request that broke it landed green; a fake cmux-ci client and GitHub API stand in.
      - name: The per-push tip test compile (tip-test-compile.sh)
        id: tt-tip-test-compile
        if: ${{ !cancelled() && steps.setup-tooling-run.outputs.ran != 'true' && (steps.setup-tooling-route.outputs.tooling_all != 'false' || contains(steps.setup-tooling-route.outputs.tooling_steps, ' tt-tip-test-compile ')) }}
        run: python3 tests/test_ci_tip_test_compile.py

      # What a later head of this pull request reuses (scripts/ci/tooling_reuse.py): the merge tree and the steps that
      # ran and passed here, failed run or not. Reused and skipped steps' outcome is skipped, so a pass never chains.
      - name: Record the steps that passed for later heads (tooling_reuse.py)
        id: setup-tooling-record
        if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        continue-on-error: true
        timeout-minutes: 1
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
        run: |
          python3 scripts/ci/tooling_reuse.py record --workflow .github/workflows/cmux-next-guards.yml \
            --job tooling-tests --steps-json-env STEPS_JSON --out "$RUNNER_TEMP/tooling-reuse/tooling-passed.json"

      - name: Upload the passed steps for later heads
        if: ${{ !cancelled() && steps.setup-tooling-record.outcome == 'success' }}
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tooling-tests-passed-${{ github.run_attempt }}
          path: ${{ runner.temp }}/tooling-reuse/tooling-passed.json
          retention-days: 7
          if-no-files-found: ignore
