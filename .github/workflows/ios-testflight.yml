name: Prepare released BETA 1.0.5 for migration testing
on:
  workflow_dispatch:
    inputs:
      runner:
        type: choice
        default: blacksmith-12vcpu-macos-26
        options:
          - blacksmith-12vcpu-macos-26
          - blacksmith-6vcpu-macos-26
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 211b8bb35f01c8175c304b8071b4fa8f5d9178fa
          persist-credentials: false
          submodules: recursive
      - name: Select Xcode
        run: |
          echo 'DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer' >> "$GITHUB_ENV"
          /Applications/Xcode.app/Contents/Developer/usr/bin/xcodebuild -version
      - name: Install Zig
        run: ./scripts/install-zig-ci.sh
      - name: Provision pinned GhosttyKit
        run: ./scripts/ensure-ghosttykit.sh
      - name: Archive exact released source without signing
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 211b8bb35f01c8175c304b8071b4fa8f5d9178fa
          xcodebuild archive -workspace ios/cmux.xcworkspace -scheme cmux-ios \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/cmux-beta105.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/cmux-beta105-dd" \
            DEVELOPMENT_TEAM=7WLXT3NR37 PRODUCT_BUNDLE_IDENTIFIER=dev.cmux.app.beta \
            MARKETING_VERSION=1.0.5 CURRENT_PROJECT_VERSION=20260914204800 \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' \
            > "$RUNNER_TEMP/cmux-beta105-archive.log" 2>&1
          ditto -c -k --keepParent "$RUNNER_TEMP/cmux-beta105.xcarchive" "$RUNNER_TEMP/cmux-beta105.xcarchive.zip"
          shasum -a 256 "$RUNNER_TEMP/cmux-beta105.xcarchive.zip" > "$RUNNER_TEMP/cmux-beta105.sha256"
      - name: Save prepared archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cmux-beta105-migration-baseline
          path: |
            ${{ runner.temp }}/cmux-beta105.xcarchive.zip
            ${{ runner.temp }}/cmux-beta105.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Save archive log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cmux-beta105-archive-log
          path: ${{ runner.temp }}/cmux-beta105-archive.log
          if-no-files-found: ignore
          retention-days: 14
