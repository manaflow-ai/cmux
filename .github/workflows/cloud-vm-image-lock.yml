name: Cloud VM image lock

# Validates images/cmux-vm/inputs.lock.json and the sshd policy checker on every
# change to the cmux-next image definition (plans/cmux-next/vm-image.md 4.11),
# and runs cloud-vm-image-bake.yml's step scripts with a stubbed bun, and pins
# cloud-vm-image-promote.yml's permissions, key handling and delete refusal.
# No Freestyle access and no bake: bakes spend Freestyle resources, so
# cloud-vm-image-bake.yml stays workflow_dispatch only (coordinator decision,
# 2026-10-04). Not a merge gate. The lock test imports smoke.ts, which reaches
# web/scripts/cmux-vm-image/guest.ts, which imports the freestyle package, so
# the job installs web's locked dependencies first.

on:
  pull_request:
    paths:
      - images/cmux-vm/**
      - web/scripts/cmux-vm-image/**
      - web/tests/vm-image-cmux-vm-lock.test.ts
      - web/tests/vm-image-cmux-vm-sshd.test.ts
      - web/tests/vm-image-cmux-vm-bake-workflow.test.ts
      - web/tests/vm-image-cmux-vm-dev-tree.test.ts
      - web/tests/vm-image-cmux-vm-dns.test.ts
      - web/tests/vm-image-cmux-vm-machine-health.test.ts
      - web/tests/vm-image-cmux-vm-promote-workflow.test.ts
      - web/services/vms/hygiene/cmux-machine-hygiene
      - .github/workflows/cloud-vm-image-lock.yml
      - .github/workflows/cloud-vm-image-bake.yml
      - .github/workflows/cloud-vm-image-promote.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloud-vm-image-lock-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lock:
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-4vcpu-ubuntu-2404' || vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 5
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      - run: bun test tests/vm-image-cmux-vm-lock.test.ts tests/vm-image-cmux-vm-sshd.test.ts tests/vm-image-cmux-vm-bake-workflow.test.ts tests/vm-image-cmux-vm-dev-tree.test.ts tests/vm-image-cmux-vm-dns.test.ts tests/vm-image-cmux-vm-machine-health.test.ts tests/vm-image-cmux-vm-promote-workflow.test.ts
