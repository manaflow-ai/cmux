name: web bundle matrix

# Every way the cmux-next web bundles can break, on every feat-cmux-next push (scripts/ci/web-bundle-matrix.sh).
#
# Why: 2026-11-26 and -27 two pull requests each imported `layoutGeometry` into VirtualTranscript.tsx. Each was
# green alone; nothing built the merged tree's web bundles until the nightly did, and it died at "Build the web
# bundles (cmux-next)" for hours while seven lanes opened a fix each. Leo: "you guys can think of every possible
# way bundles can break and just run all that shit in parallel or some shit on a couple cores".
#
# Three places run the same script:
#   pull requests   fast_gate_webviews_checks.py's check:bundle-matrix, on the pull request merged with the
#                   current base (ci-web react-apps-check, cmux-next-fast-gates, the nightly's early webview checks)
#   this workflow   every push to feat-cmux-next: the merged tree after each landing. Red: it posts the commit
#                   status `cmux-next/web-bundle-matrix` (failure), names the pull requests behind the first
#                   FILE:LINE (scripts/ci/web_bundle_culprit.py: git blame of the line, and of the other line
#                   the message names), and opens one revert pull request of the later landing, branch
#                   revert/pr-N (the one cmux-next.yml's release-compile-revert uses, so the two never open two)
#   the nightly     scripts/cmux-next/request-nightly-next.sh refuses a commit whose status here is `failure`,
#                   so the train promotes the newest green commit, not a red one
#
# A push whose run was replaced by a newer one gets no status: unknown is never red.
on:
  push:
    branches: [feat-cmux-next]
  workflow_dispatch:
    inputs:
      sha:
        description: feat-cmux-next commit (40 hex) to check; empty is the dispatched head
        required: false
        default: ''
        type: string

permissions: {}

concurrency:
  group: web-bundle-matrix-${{ github.ref }}
  cancel-in-progress: false

env:
  # Temporary REST budget attribution: one gh-call line per GitHub API call (scripts/ci/api_call_log/env.sh, fetched at a fixed commit when the checkout has no copy).
  BASH_ENV: '$({ w="${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh"; t="${RUNNER_TEMP:-/nonexistent}/api-call-log-src"; if [ -f "$w" ]; then echo "$w"; elif [ -n "${RUNNER_TEMP:-}" ]; then if [ ! -f "$t/env.sh" ] && [ ! -e "$t.tried" ] && { [ "${RUNNER_OS:-}" = Linux ] || [ "${RUNNER_OS:-}" = macOS ]; } && [ "$(date -u +%Y%m%d%H)" -lt 2026112300 ]; then : > "$t.tried"; mkdir -p "$t.part" && for x in env.sh gh sitecustomize.py isolated.py; do curl -fsSL --max-time 5 -o "$t.part/$x" "https://raw.githubusercontent.com/manaflow-ai/cmux/27647ffd3ae838c63be28ca3e5883dcd68c34518/scripts/ci/api_call_log/$x" || break; done; [ -s "$t.part/isolated.py" ] && mv "$t.part" "$t"; fi; if [ -f "$t/env.sh" ]; then echo "$t/env.sh"; else echo unset BASH_ENV > "$t.off.sh" && echo "$t.off.sh"; fi; fi; } 2>/dev/null)'

jobs:
  matrix:
    if: github.repository == 'manaflow-ai/cmux'
    name: web bundle matrix
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || 'cmux-linux' }}
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
      result: ${{ steps.run.outputs.result }}
      job: ${{ steps.run.outputs.job }}
      file: ${{ steps.run.outputs.file }}
      line: ${{ steps.run.outputs.line }}
      message: ${{ steps.run.outputs.message }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        timeout-minutes: 6
        with:
          ref: ${{ inputs.sha != '' && inputs.sha || github.sha }}
          persist-credentials: false
          # The culprit step blames the failing line.
          fetch-depth: 300

      - name: The commit this run checks
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Drop stale submodule checkouts (self-hosted reused workspace)
        run: scripts/ci/reset-stale-submodules.sh

      - name: Restore pinned Bun 1.4.4 from the CI cache bucket
        shell: bash
        continue-on-error: true
        env: { TOOLCHAIN_R2_ALL: "1" }
        run: bash "$GITHUB_WORKSPACE/scripts/ci/toolchain-r2.sh" restore bun 1.4.4 || true

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
          no-cache: true

      - name: Give this job its own bun
        run: scripts/cmux-next/private-bun.sh

      - name: Restore pinned Node 24.22.1 from the CI cache bucket
        shell: bash
        continue-on-error: true
        run: bash "$GITHUB_WORKSPACE/scripts/ci/toolchain-r2.sh" restore node 24.22.1 || true

      - name: Setup Node
        timeout-minutes: 5
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.22.1"

      # Three jobs at a time, the first red stops the rest and names FILE:LINE.
      - name: Run the web bundle matrix
        id: run
        timeout-minutes: 12
        env:
          CMUX_WEB_MATRIX_JOBS: "3"
          MATRIX_OUT: ${{ runner.temp }}/web-bundle-matrix
        run: |
          set -uo pipefail
          rc=0
          scripts/ci/web-bundle-matrix.sh --out "$MATRIX_OUT" || rc=$?
          if [ "$rc" = 0 ]; then
            echo "result=success" >> "$GITHUB_OUTPUT"
          elif [ -s "$MATRIX_OUT/failure.tsv" ]; then
            echo "result=failure" >> "$GITHUB_OUTPUT"
            # web-bundle-matrix.sh writes job TAB file TAB line TAB message. cut, not `IFS=$'\t' read`: read
            # folds a run of tabs into one, so an empty FILE would shift LINE and the message into it.
            f="$MATRIX_OUT/failure.tsv"
            job="$(head -n 1 "$f" | cut -f1)"; file="$(head -n 1 "$f" | cut -f2)"
            line="$(head -n 1 "$f" | cut -f3)"; message="$(head -n 1 "$f" | cut -f4-)"
            {
              echo "job=$job"; echo "file=$file"; echo "line=$line"
              echo "message=${message//$'\n'/ }"
            } >> "$GITHUB_OUTPUT"
          else
            # No failure record: the script itself could not run (a missing tool, a bad flag). Never a red commit.
            echo "result=error" >> "$GITHUB_OUTPUT"
          fi
          exit "$rc"

      - name: Keep the matrix logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-bundle-matrix-${{ github.run_id }}
          path: ${{ runner.temp }}/web-bundle-matrix/logs
          if-no-files-found: ignore
          retention-days: 3  # retention-class: report

  report:
    needs: matrix
    if: ${{ !cancelled() && needs.matrix.result != 'skipped' }}
    name: web bundle matrix status and fix
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || 'cmux-linux' }} # ephemeral-required: holds a statuses, contents and pull-requests write App token
    environment:
      name: ci-routing-agent
      deployment: false
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        timeout-minutes: 6
        with:
          ref: refs/heads/feat-cmux-next
          persist-credentials: false
          fetch-depth: 300

      - name: Mint the status token
        id: status-token
        if: ${{ vars.CMUX_BOT_APP_ID != '' }}
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.CMUX_BOT_APP_ID }}
          private-key: ${{ secrets.CMUX_BOT_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-statuses: write

      # success and failure only: an `error` result (the script could not run) leaves the commit with no status,
      # which the nightly reads as unknown, never as red.
      - name: Post cmux-next/web-bundle-matrix on the commit
        if: ${{ steps.status-token.outputs.token != '' && (needs.matrix.outputs.result == 'success' || needs.matrix.outputs.result == 'failure') }}
        env:
          GH_TOKEN: ${{ steps.status-token.outputs.token }}
          SHA: ${{ needs.matrix.outputs.sha }}
          RESULT: ${{ needs.matrix.outputs.result }}
          JOB: ${{ needs.matrix.outputs.job }}
          FILE: ${{ needs.matrix.outputs.file }}
          LINE: ${{ needs.matrix.outputs.line }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash -e scripts/ci/web-bundle-matrix-status.sh

      - name: Name the pull requests behind the red
        id: culprit
        if: ${{ needs.matrix.outputs.result == 'failure' }}
        env:
          SHA: ${{ needs.matrix.outputs.sha }}
          JOB: ${{ needs.matrix.outputs.job }}
          FILE: ${{ needs.matrix.outputs.file }}
          LINE: ${{ needs.matrix.outputs.line }}
          MESSAGE: ${{ needs.matrix.outputs.message }}
        run: |
          printf '%s|%s|%s|%s\n' "$JOB" "$FILE" "$LINE" "$MESSAGE" > "$RUNNER_TEMP/failure.tsv"
          python3 -I scripts/ci/web_bundle_culprit.py --failure "$RUNNER_TEMP/failure.tsv" --sha "$SHA" --repo-dir . \
            --github-output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"

      - name: Mint the revert PR token
        id: app-token
        if: ${{ steps.culprit.outputs.pr != '' && vars.GLAEDA_ROUTE_APP_ID != '' }}
        timeout-minutes: 1
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.GLAEDA_ROUTE_APP_ID }}
          private-key: ${{ secrets.GLAEDA_ROUTE_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Open or find the one revert pull request
        if: ${{ steps.app-token.outputs.token != '' }}
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          PR: ${{ steps.culprit.outputs.pr }}
          MERGE_SHA: ${{ steps.culprit.outputs.merge_sha }}
          PAIR: ${{ steps.culprit.outputs.pair }}
          SHA: ${{ needs.matrix.outputs.sha }}
          JOB: ${{ needs.matrix.outputs.job }}
          FILE: ${{ needs.matrix.outputs.file }}
          LINE: ${{ needs.matrix.outputs.line }}
          MESSAGE: ${{ needs.matrix.outputs.message }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash -e scripts/ci/web-bundle-matrix-fix-pr.sh
