# Builds the app's ONE Rust library, CCmuxAppFFI.xcframework
# (cmux-tui/crates/cmux-app-ffi: the remote desktop core, the sidebar layout
# reducer and the cmux-motion C ABIs over one Rust runtime, macOS arm64; see
# scripts/cmux-next/build-app-ffi.sh), a dynamic library the app carries at
# Contents/Frameworks/libcmux_app_ffi.dylib, and publishes it as a prerelease in this
# repository, tagged cmux-app-ffi-<full commit sha>.
# Packages/macOS/CmuxNext/app-ffi-pin.json pins one release by URL and SwiftPM
# checksum (Package.swift reads it at manifest time), so every build (app,
# tests, release, nightly) links the same FFI.
#
# ARM64 ONLY (Leo, 2026-11-25: "i thought we were already skipping intel"): every push and every
# ordinary dispatch builds, publishes and pins the arm64 slice alone. feat-cmux-next ships no Intel
# app: nightly-next compiles arm64 only (nightly.yml decide), cmux NEXT Stable re-signs a nightly-next
# build, and the pull request Release check is arm64 (ci-macos.yml release-archs). The x86_64 slice
# doubled the Rust build of every FFI push for nothing. A stable release that ships Intel dispatches
# this workflow with universal=true: that run builds arm64 + x86_64 and uploads the universal
# xcframework as this run's artifact (30 days), and publishes no release and re-pins nothing (the
# commit's cmux-app-ffi tag is immutable and holds the arm64 archive).
#
# Publishing runs only for a push to feat-cmux-next or a manual dispatch from
# that ref. A release is never overwritten: an existing tag must carry the
# same archive checksum, or the run fails. Releases are prereleases with
# make_latest=false, and the run fails if the repository's latest release
# ever points at an FFI tag. scripts/cmux-next/check-app-ffi-pin.sh fails CI
# when the FFI sources change without a new pin.
#
# TOKEN: GITHUB_TOKEN may not create a cmux-app-ffi-* tag (run 37272232472,
# HTTP 403): ruleset 24624526 admits only admins and the FFI release App
# (manaflow-cmux-ffi-release, used for nothing else). The publish job runs in
# the `ffi-release` environment (deployment policy: feat-cmux-next only),
# which holds the App's CMUX_FFI_RELEASE_APP_ID and CMUX_FFI_RELEASE_APP_KEY. It mints a token for this
# repository only, with contents:write, plus workflows:write only when the
# tagged tree's .github/workflows differs from the default branch tip, their
# merge-base or the last FFI tag (see the workflow-delta step), and only the
# release create uses it.
# Ruleset 24624527 keeps the tags immutable for everyone, the App included.
#
# FAIL-LOUD: the publish job never reports success without the release. When
# it cannot create it (no App token, an HTTP 403, or a create that publishes
# nothing, as in run 37556534995), it fails with "Publish by hand" and the
# exact commands (HAND_PUBLISH). Publishing by hand, with its checks, is the
# only other path: docs/ci/app-ffi-release.md is the runbook.
#
# The push paths are the FFI inputs that scripts/cmux-next/check-app-ffi-pin.sh
# derives from the Cargo path dependencies of cmux-app-ffi (--list-inputs),
# less each crate's tests/, benches/ and examples/ (--list-excluded: Cargo never
# builds them into the library), except one a library file names (re-added
# after the exclusions); scripts/cmux-next/tests/app-ffi-release-paths.test.sh
# keeps them in step.
name: app FFI release

