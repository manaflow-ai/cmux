# Builds the app's ONE Rust static library, CCmuxAppFFI.xcframework
# (cmux-tui/crates/cmux-app-ffi: the remote desktop core and the sidebar layout
# reducer C ABIs over one Rust runtime, universal macOS arm64 + x86_64; see
# scripts/cmux-next/build-app-ffi.sh), and publishes it as a prerelease in this
# repository, tagged cmux-app-ffi-<full commit sha>.
# Packages/macOS/CmuxNext/Package.swift pins one release by URL and SwiftPM
# checksum, so every build (app, tests, release, nightly) links the same FFI.
#
# Publishing runs only for a push to feat-cmux-next or a manual dispatch from
# that ref. A release is never overwritten: an existing tag must carry the
# same archive checksum, or the run fails. Releases are prereleases with
# make_latest=false, and the run fails if the repository's latest release
# ever points at an FFI tag. scripts/cmux-next/check-app-ffi-pin.sh fails CI
# when the FFI sources change without a new pin.
#
# UNPROVEN (2026-10-05): GITHUB_TOKEN got HTTP 403 creating the first tag
# (run 37272232472). The publish job therefore skips when workflow files
# changed since the last FFI tag, and a person publishes from the artifact.
# Whether the token can create the tag after a source-only change has not
# been seen yet; the first real FFI source change proves or disproves it.
name: app FFI release

on:
  push:
    branches: [feat-cmux-next]
    paths:
      - "cmux-tui/crates/cmux-app-ffi/**"
      - "cmux-tui/crates/cmux-layout-reducer/**"
      - "cmux-tui/crates/cmux-layout-reducer-ffi/**"
      - "cmux-tui/crates/cmux-rd-core/**"
      - "cmux-tui/crates/cmux-rd-proto/**"
      - "cmux-tui/crates/cmux-rd-ffi/**"
      - "cmux-tui/rust-toolchain.toml"
      - "scripts/cmux-next/build-app-ffi.sh"
      - ".github/workflows/app-ffi-release.yml"
  workflow_dispatch:

concurrency:
  group: app-ffi-release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  build:
    name: build xcframework
    if: github.ref == 'refs/heads/feat-cmux-next'
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || vars.MACOS_RUNNER_26 || 'blacksmith-6vcpu-macos-26' }}
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.assemble.outputs.tag }}
      checksum: ${{ steps.assemble.outputs.checksum }}
      workflow_changed: ${{ steps.workflow-delta.outputs.changed }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0

      # GITHUB_TOKEN may not create a tag whose commit range carries
      # workflow-file changes (run 37272232472: HTTP 403 with contents:write).
      # Measure the range from the last published FFI tag; the publish job
      # skips with a notice when it touches .github/workflows.
      - name: Workflow files changed since the last FFI release
        id: workflow-delta
        shell: bash
        run: |
          set -euo pipefail
          git fetch --quiet --tags origin 'refs/tags/cmux-app-ffi-*:refs/tags/cmux-app-ffi-*' || true
          last="$(git tag --list 'cmux-app-ffi-*' --merged HEAD --sort=-creatordate | head -n 1)"
          if [[ -z "$last" ]]; then
            echo "no earlier FFI tag on this history; treating workflow files as changed"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$last" HEAD -- .github/workflows; then
            echo "no workflow-file change since $last"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "workflow files changed since $last:"
            git diff --stat "$last" HEAD -- .github/workflows
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Select Xcode
        run: ./scripts/select-ci-xcode.sh

      - name: Set up pinned Rust
        uses: ./.github/actions/setup-cmux-tui-rust

      - name: Install Apple targets
        working-directory: cmux-tui
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Test the reducer
        working-directory: cmux-tui
        run: cargo test -p cmux-layout-reducer --locked

      - name: Test the remote desktop FFI
        working-directory: cmux-tui/crates/cmux-rd-ffi
        run: cargo test --locked

      # From cmux-tui so rustup resolves the pinned toolchain (rust-toolchain.toml).
      - name: Build universal xcframework
        working-directory: cmux-tui
        env:
          CMUX_APP_FFI_ARCHS: arm64,x86_64
          CMUX_APP_FFI_OUT: ${{ runner.temp }}/app-ffi
        run: ../scripts/cmux-next/build-app-ffi.sh

      - name: Assemble, check and checksum
        id: assemble
        shell: bash
        env:
          OUT: ${{ runner.temp }}/app-ffi
        run: |
          set -euo pipefail
          xcf="$OUT/CCmuxAppFFI.xcframework"
          lib="$(find "$xcf" -name 'libcmux_app_ffi.a' | head -n 1)"
          test -f "$lib"
          archs="$(lipo -archs "$lib")"
          echo "architectures: $archs"
          for arch in arm64 x86_64; do
            [[ " $archs " == *" $arch "* ]] || { echo "::error::$lib has no $arch slice" >&2; exit 1; }
          done
          # Prove each slice links with Apple's toolchain and exports every C
          # entry point: a C program takes the address of each header function
          # and links against the archive (Apple's nm cannot read objects that
          # carry a newer rustc's embedded bitcode, so symbol listing is not
          # the check; the link is what the app needs). The arm64 program runs.
          headers="$xcf/macos-arm64_x86_64/Headers"
          smoke="$RUNNER_TEMP/smoke"
          mkdir -p "$smoke"
          {
            printf '%s\n' '#include <CCmuxRdFFI/cmux_rd_ffi.h>' '#include <CCmuxLayoutReducerFFI/cmux_layout_reducer_ffi.h>' '#include <stdio.h>' 'int main(void) {'
            for symbol in $(cat cmux-tui/crates/cmux-rd-ffi/include/cmux_rd_ffi.h cmux-tui/crates/cmux-layout-reducer-ffi/include/cmux_layout_reducer_ffi.h | grep -oE '\bcmux_[a-z0-9_]+\(' | tr -d '(' | sort -u); do
              printf '  printf("%%p %s\\n", (void *)&%s);\n' "$symbol" "$symbol"
            done
            printf '%s\n' '  printf("abi %u\n", cmux_layout_reducer_ffi_abi_version());' '  return 0;' '}'
          } > "$smoke/smoke.c"
          for arch in arm64 x86_64; do
            xcrun clang -target "$arch-apple-macos26.0" -I "$headers" "$smoke/smoke.c" "$lib" -o "$smoke/smoke-$arch"
          done
          "$smoke/smoke-arm64"
          dist="$RUNNER_TEMP/dist"
          rm -rf "$dist"; mkdir -p "$dist"
          # Stable zip bytes for a rerun of the same build.
          find "$xcf" -exec touch -t 198001010000 {} +
          (cd "$OUT" && ditto -c -k --keepParent CCmuxAppFFI.xcframework "$dist/CCmuxAppFFI.xcframework.zip")
          archive="$dist/CCmuxAppFFI.xcframework.zip"
          checksum="$(shasum -a 256 "$archive" | awk '{print $1}')"
          swiftpm_checksum="$(swift package compute-checksum "$archive")"
          [[ "$swiftpm_checksum" == "$checksum" ]] || { echo "::error::SwiftPM checksum $swiftpm_checksum != SHA-256 $checksum" >&2; exit 1; }
          printf '%s\n' "$checksum" > "$archive.sha256"
          printf '%s  %s\n' "$checksum" CCmuxAppFFI.xcframework.zip > "$dist/SHA256SUMS"
          printf '%s\n' "$GITHUB_SHA" > "$dist/SOURCE_SHA"
          echo "tag=cmux-app-ffi-$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "checksum=$checksum" >> "$GITHUB_OUTPUT"
          echo "checksum: $checksum"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: CCmuxAppFFI.xcframework
          path: ${{ runner.temp }}/dist/*
          if-no-files-found: error

  publish:
    name: publish release
    needs: build
    if: github.ref == 'refs/heads/feat-cmux-next' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: CCmuxAppFFI.xcframework
          path: assets

      - name: A person publishes this one
        if: needs.build.outputs.workflow_changed == 'true'
        env:
          TAG: ${{ needs.build.outputs.tag }}
          CHECKSUM: ${{ needs.build.outputs.checksum }}
        shell: bash
        run: |
          echo "::notice title=Publish by hand::Workflow files changed since the last FFI release, and GITHUB_TOKEN cannot create tag $TAG over them. A maintainer creates the prerelease (not latest) from this run's CCmuxAppFFI.xcframework artifact: tag $TAG at $GITHUB_SHA, checksum $CHECKSUM."

      - name: Create the release (never overwrite)
        if: needs.build.outputs.workflow_changed != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
          CHECKSUM: ${{ needs.build.outputs.checksum }}
        shell: bash
        run: |
          set -euo pipefail
          (cd assets && sha256sum --check --strict SHA256SUMS)
          [[ "$(tr -d '[:space:]' < assets/SOURCE_SHA)" == "$GITHUB_SHA" ]]
          notes="The cmux app FFI (remote desktop core + sidebar layout reducer) as CCmuxAppFFI.xcframework (one static library, universal macOS arm64/x86_64). Source $GITHUB_SHA. SwiftPM binaryTarget checksum (SHA-256 of the zip): $CHECKSUM"
          if gh release view "$TAG" >/dev/null 2>&1; then
            existing="$(mktemp -d)"
            gh release download "$TAG" --pattern "CCmuxAppFFI.xcframework.zip" --dir "$existing"
            published="$(sha256sum "$existing/CCmuxAppFFI.xcframework.zip" | awk '{print $1}')"
            if [[ "$published" != "$CHECKSUM" ]]; then
              echo "::error::release $TAG exists with checksum $published, not $CHECKSUM; it is never overwritten" >&2
              exit 1
            fi
            echo "release $TAG already has the matching archive"
          else
            gh release create "$TAG" \
              assets/CCmuxAppFFI.xcframework.zip \
              assets/CCmuxAppFFI.xcframework.zip.sha256 \
              assets/SHA256SUMS assets/SOURCE_SHA \
              --target "$GITHUB_SHA" --title "$TAG" --notes "$notes" --prerelease --latest=false
          fi
          echo "release: https://github.com/$GH_REPO/releases/tag/$TAG"

      - name: The latest release is not an FFI tag
        if: needs.build.outputs.workflow_changed != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          latest="$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name 2>/dev/null || true)"
          echo "latest release: ${latest:-none}"
          if [[ "$latest" == cmux-app-ffi-* || "$latest" == layout-reducer-ffi-* ]]; then
            echo "::error::the repository's latest release now points at $latest" >&2
            exit 1
          fi

      - name: Anonymous download matches the checksum
        if: needs.build.outputs.workflow_changed != 'true'
        env:
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
          CHECKSUM: ${{ needs.build.outputs.checksum }}
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/$GH_REPO/releases/download/$TAG/CCmuxAppFFI.xcframework.zip"
          for _ in 1 2 3 4 5 6; do
            if curl -fsSL --retry 3 -o downloaded.zip "$url"; then break; fi
            sleep 10
          done
          got="$(sha256sum downloaded.zip | awk '{print $1}')"
          [[ "$got" == "$CHECKSUM" ]] || { echo "::error::anonymous download of $url has checksum $got, not $CHECKSUM" >&2; exit 1; }
          echo "anonymous download ok: $url"
