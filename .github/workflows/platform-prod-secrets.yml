name: Platform production secrets

# One-off. cmux-platform-production is taking over NEXT Cloud's CloudDO routes from cmux-api production
# (the CloudDO move into cmux-platform) with a fresh namespace. It needs two secrets:
# - CLOUD_LINK_SIGNING_KEYS: minted fresh here (scripts/cmux-next/release/mint-link-keyset.mjs, one Ed25519 kid
#   "production-<UTC date>" that signs at once) and piped straight into wrangler. Production never issued a link
#   token, and link tokens are verified only by Cloud VMs against the keyset the platform itself serves, so
#   nothing needs cmux-api production's copy.
# - CLOUD_FREESTYLE_API_KEY: piped from the cmux-next-production environment's FREESTYLE_API_KEY.
# It needs no JWT_PRIVATE_JWK: the platform verifies cmux-api's install tokens against cmux-api's public JWKS.
# Every value goes through stdin only: none is printed, echoed or written to disk. It puts a name only when the
# Worker lacks it and never overwrites one. Same pattern as platform-dev-secrets.yml (#30461).
# Dispatch-only: dispatch it from feat-cmux-next.
# Its list-then-put check cannot be atomic (#32470 review; Cloudflare has no create-if-absent for a Worker
# secret): it re-reads the list right before each put, and it must not be dispatched while anyone else is
# putting these secrets on cmux-platform-production.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-prod-secrets
  cancel-in-progress: false

jobs:
  put:
    if: github.ref == 'refs/heads/feat-cmux-next'
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.LINUX_RUNNER || fromJSON(vars.RUNNER_POOLS).linux_4 }}
    environment: cmux-next-production
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          sparse-checkout: scripts/cmux-next/release/mint-link-keyset.mjs
          sparse-checkout-cone-mode: false
      - name: Put missing CLOUD_LINK_SIGNING_KEYS (fresh) and CLOUD_FREESTYLE_API_KEY on cmux-platform-production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 0c1675e0def6de1ab3a50a4e17dc5656
          CLOUD_FREESTYLE_API_KEY: ${{ secrets.FREESTYLE_API_KEY }}
          MINT: ${{ github.workspace }}/scripts/cmux-next/release/mint-link-keyset.mjs
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          W=cmux-platform-production
          WR="npx -y wrangler@4.156.0"
          # Cloudflare has no create-if-absent for Worker secrets (a put always upserts), so each put re-reads the
          # list right before it, after any mint, leaving only the seconds of one put for another writer to race.
          # set -e does not apply inside an `if` condition, so has() checks itself: a failed or unreadable list stops
          # the job (exit 1) instead of reading as "absent". 0 = the Worker has the name, 1 = it does not.
          has() {
            local out rc=0
            out="$($WR secret list --name "$W" --format json)" || { echo "::error::wrangler secret list failed; nothing more put"; exit 1; }
            printf '%s' "$out" | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{const l=JSON.parse(d);if(!Array.isArray(l))process.exit(9);process.exit(l.some(s=>s.name===process.argv[1])?0:3)})' "$1" || rc=$?
            case "$rc" in 0) return 0 ;; 3) return 1 ;; *) echo "::error::could not read the secret list; nothing more put"; exit 1 ;; esac
          }
          if has CLOUD_LINK_SIGNING_KEYS; then
            echo "::notice::$W already has CLOUD_LINK_SIGNING_KEYS; left as is"
          else
            # The value lives only in this shell variable and the pipe; a failed or empty mint stops the job
            # before anything is put.
            KEYSET="$(node "$MINT" production)"
            if [ -z "$KEYSET" ]; then echo "::error::mint-link-keyset printed nothing; nothing put"; exit 1; fi
            if has CLOUD_LINK_SIGNING_KEYS; then
              echo "::notice::$W gained CLOUD_LINK_SIGNING_KEYS meanwhile; left as is"
            else
              printf '%s' "$KEYSET" | $WR secret put CLOUD_LINK_SIGNING_KEYS --name "$W"
            fi
            unset KEYSET
          fi
          if [ -z "$CLOUD_FREESTYLE_API_KEY" ]; then
            echo "::warning::cmux-next-production holds no copy for CLOUD_FREESTYLE_API_KEY; skipped"
          elif has CLOUD_FREESTYLE_API_KEY; then
            echo "::notice::$W already has CLOUD_FREESTYLE_API_KEY; left as is"
          else
            printf '%s' "$CLOUD_FREESTYLE_API_KEY" | $WR secret put CLOUD_FREESTYLE_API_KEY --name "$W"
          fi
          $WR secret list --name "$W" --format json | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{for (const s of JSON.parse(d)) console.log(s.name)})'
