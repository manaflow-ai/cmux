name: Cloud move kill drills (staging, real machines)

# Kills one side of a chat move mid-step on real Cloud machines and reports what the person lost
# (scripts/cmux-next/cloud-chaos-move.ts, run as `cloud-journey.ts --chaos-move`). Leo (2026-11-23): "i was also
# curious about the ultra destructive case and the sync stuff regarding local and cloud vms. is that already solved?"
#
# The runner plays the person's Mac (a headless cmux-tui daemon and its acpmux, Claude Code on the model stub);
# machine A is the journey's own and machine B a second one for Cloud->Cloud; the journey deletes both. One job per
# kill measures every direction x step once (24 runs); `random` records 20 seeded random runs. The tables are the
# job summaries and the move-* artifacts. Nothing gates on these drills: a loss is a finding, so the jobs fail
# only when the drill itself breaks, never on a red cell (continue-on-error).
#
# Secrets: the staging agent test account (cmux-next-vm-image-dev), as cloud-journey-pr.yml reads it. Same-repo
# pull requests only.

on:
  workflow_dispatch:
    inputs:
      seed:
        description: The drills' seed
        required: false
        default: ""
        type: string
  pull_request:
    branches: [feat-cmux-next]
    paths:
      - scripts/cmux-next/cloud-chaos-move.ts
      - .github/workflows/cloud-move-kill.yml

permissions:
  contents: read

concurrency:
  group: cloud-move-kill-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/feat-cmux-next' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || contains(fromJSON('["blacksmith-8vcpu-ubuntu-2404","blacksmith-16vcpu-ubuntu-2404","blacksmith-4vcpu-ubuntu-2404"]'), vars.LINUX_RUNNER) && vars.LINUX_RUNNER || vars.CI_CLOUD_OVERFLOW_SAVED && fromJSON(vars.RUNNER_POOLS).linux_16 || fromJSON(vars.RUNNER_POOLS).linux_8 }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: false
      - name: Initialize Ghostty protocol submodules
        run: git submodule update --init --depth 1 ghostty ghostty-next
      - name: Install Linux cmux-tui build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev pkg-config
      - name: Set up cmux-tui Rust
        uses: ./.github/actions/setup-cmux-tui-rust
      - name: Resolve Ghostty Zig version
        id: ghostty-zig-version
        env:
          GHOSTTY_ZIG_SOURCE: ghostty-next
        run: |
          set -euo pipefail
          version="$(bash ./scripts/ghostty-zig-version.sh)"
          [[ -n "$version" ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Set up Zig for Ghostty
        uses: mlugg/setup-zig@8d6198c65fb0feaa111df26e6b467fea8345e46f # v2.0.5
        with:
          version: ${{ steps.ghostty-zig-version.outputs.version }}
          use-cache: false
      - name: Restore the Zig global cache (feat-cmux-next pushes save it)
        uses: ./.github/actions/zig-global-cache
      - name: Build this pull request's Linux cmux-tui
        working-directory: cmux-tui
        env:
          CARGO_NET_RETRY: "10"
          CARGO_HTTP_TIMEOUT: "120"
          GHOSTTY_ZIG_SOURCE: ghostty-next
          CMUX_GHOSTTY_SRC: ""
        run: |
          set -euo pipefail
          cargo build -p cmux-tui --bin cmux-tui --locked
          mkdir -p "$RUNNER_TEMP/bin"
          cp "${CARGO_TARGET_DIR:-target}/debug/cmux-tui" "$RUNNER_TEMP/bin/cmux-tui"
          sha256sum "$RUNNER_TEMP/bin/cmux-tui"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: move-kill-cmux-tui-${{ github.run_id }}
          path: ${{ runner.temp }}/bin/cmux-tui
          retention-days: 1
          if-no-files-found: error

  drill:
    needs: build
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || contains(fromJSON('["blacksmith-8vcpu-ubuntu-2404","blacksmith-16vcpu-ubuntu-2404","blacksmith-4vcpu-ubuntu-2404"]'), vars.LINUX_RUNNER) && vars.LINUX_RUNNER || fromJSON(vars.RUNNER_POOLS).linux_8 }}
    environment:
      name: cmux-next-vm-image-dev
      deployment: false
    timeout-minutes: 240
    continue-on-error: true
    strategy:
      fail-fast: false
      # Two machines a job: within staging's create budget.
      max-parallel: 4
      matrix:
        kill: [kill-src, kill-dst, off-src, off-dst, cut, pause-src, pause-dst, random]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/cmux-next
            tests/fixtures/model-stub
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: move-kill-cmux-tui-${{ github.run_id }}
          path: ${{ runner.temp }}/bin
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
          no-cache: ${{ !startsWith(github.workspace, '/home/runner/work/') }}
      - name: Claude Code for the runner's own side (the person's Mac)
        run: |
          set -euo pipefail
          npm install --global --no-fund --no-audit @anthropic-ai/claude-code@2.1.284 >/dev/null
          command -v claude
          chmod 0755 "$RUNNER_TEMP/bin/cmux-tui"
      - name: Move drills (${{ matrix.kill }})
        env:
          CMUX_DOGFOOD_STACK_EMAIL: ${{ secrets.CMUX_DOGFOOD_STACK_EMAIL }}
          CMUX_DOGFOOD_STACK_PASSWORD: ${{ secrets.CMUX_DOGFOOD_STACK_PASSWORD }}
          KILL: ${{ matrix.kill }}
          SEED: ${{ inputs.seed || format('gh{0}', github.run_id) }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/move/$KILL"
          mkdir -p "$out"
          if [ "$KILL" = random ]; then pick=(--runs 20); else pick=(--kill "$KILL"); fi
          rc=0
          bun scripts/cmux-next/cloud-journey.ts --backend staging --out "$out" --cmux "$RUNNER_TEMP/bin/cmux-tui" \
            --model stub --chaos-move --seed "$SEED-$KILL" --claude-bin "$(command -v claude)" "${pick[@]}" || rc=$?
          { echo "### Move drills: $KILL (seed $SEED-$KILL)"; echo; cat "$out/move.md" 2>/dev/null || echo "(no table written)"; echo; } >> "$GITHUB_STEP_SUMMARY"
          test -s "$out/move.json" || { echo "::error::the drill wrote no results (journey exit $rc)"; exit 1; }
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: move-${{ matrix.kill }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/move/**/move.*
            ${{ runner.temp }}/move/**/journey.json
            ${{ runner.temp }}/move/**/summary.md
          if-no-files-found: warn
          retention-days: 14
