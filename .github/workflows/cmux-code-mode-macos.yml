name: cmux code mode macOS sandbox

on:
  pull_request:
    branches: [feat-cmux-next]
    paths:
      - scripts/cmux-next/cmux-code-mode-runner
      - scripts/cmux-next/cmux-code-mode-macos-profile
      - scripts/cmux-next/test-code-mode-macos-sandbox.sh
      - .github/workflows/cmux-code-mode-macos.yml
  push:
    branches: [feat-cmux-next]
    paths:
      - scripts/cmux-next/cmux-code-mode-runner
      - scripts/cmux-next/cmux-code-mode-macos-profile
      - scripts/cmux-next/test-code-mode-macos-sandbox.sh
      - .github/workflows/cmux-code-mode-macos.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-sandbox:
    name: macOS 26 Seatbelt smoke
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || vars.MACOS_RUNNER_26 || 'blacksmith-6vcpu-macos-26' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - name: Check macOS version and Seatbelt
        run: |
          set -euo pipefail
          sw_vers -productVersion
          test "$(uname -s)" = Darwin
          test -x /usr/bin/sandbox-exec
      - name: Run Seatbelt allow/deny smoke
        run: scripts/cmux-next/test-code-mode-macos-sandbox.sh
