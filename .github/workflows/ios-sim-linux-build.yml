name: iOS simulator build for the Linux simulator runner
run-name: >-
  iOS simulator build (Linux runner) · ${{ inputs.ref || github.head_ref || github.ref_name }}

# Builds the NEXT iPhone app and its UI test runner for the simulator
# (build-for-testing, arm64) on a Mac and uploads them, so a Linux simulator
# runner can install and drive them: `ios-sim-build` (Build/Products with the
# .xctestrun) and `ios-sim-xctest-platform` (the simulator platform's XCTest
# frameworks and agents the runner needs to run XCTest bundles).
# Runs on lane branches that work on that runner and by hand; it is the
# producer a Linux job consumes until the Linux iOS build replaces it.
on:
  push:
    branches: ["lane/ios-sim-linux**"]
  workflow_dispatch:
    inputs:
      ref:
        description: App source to build (branch, tag or SHA); empty is this ref
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ios-sim-linux-build-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  route:
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && (vars.CI_FORK_LINUX_RUNNER || 'ubuntu-24.04') || 'cmux-linux' }}
    timeout-minutes: 5
    outputs:
      runs_on: ${{ steps.pool.outputs.runs_on }}
      retry_runs_on: ${{ steps.pool.outputs.retry_runs_on }}
    steps:
      - name: Checkout pool helper
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: |
            scripts/ci/ios_runner_pool.py
            scripts/ci/e2e_runner_pool.py
            scripts/ci/pr_runner_pool.py
            scripts/ci/github_spend.py
            scripts/ci/deadline_http.py
            scripts/ci/simple_pool_picker.py
            scripts/ci/warm_distance.py
            .gitmodules
          sparse-checkout-cone-mode: false
          persist-credentials: false
      # The macOS pool the walk runs on (scripts/ci/ios_runner_pool.py, the
      # one-simulator lane ios-screenshots.yml uses): an owned Mac with an
      # iOS simulator when CI_IOS_OWNED allows, else MACOS_RUNNER_IOS; a
      # re-run takes retry_runs_on.
      - name: Pick the macOS pool
        id: pool
        env:
          CI_RUNNER_STATE: ${{ vars.CI_RUNNER_STATE }}
          RUNNER_VARIABLE: ${{ vars.MACOS_RUNNER_IOS }}
          IOS_OWNED: ${{ vars.CI_IOS_OWNED }}
          POOL_OWNED: ${{ vars.CI_PR_POOL_OWNED }}
          OWNED_SLOTS: ${{ vars.CI_OWNED_POOL_SLOTS }}
          PR_XCODE_APP: ${{ vars.CMUX_CI_XCODE_APP_PR }}
          # The 12vcpu pool the screenshots lane resolves to sat queued an hour
          # (run 45371366406); the 6vcpu macOS 26 pool is the one PR jobs run on.
          REQUESTED_RUNNER: ${{ vars.CMUX_IOS_SIM_LINUX_BUILD_RUNNER }}
        run: |
          set -euo pipefail
          route="$(python3 scripts/ci/ios_runner_pool.py \
            --lane screenshots \
            --requested "${REQUESTED_RUNNER:-blacksmith-6vcpu-macos-26}" \
            --variable "$RUNNER_VARIABLE" \
            --ios-owned "$IOS_OWNED" \
            --owned "$POOL_OWNED" \
            --owned-slots "$OWNED_SLOTS" \
            --pr-xcode-app "$PR_XCODE_APP")"
          echo "$route" >> "$GITHUB_OUTPUT"
          echo "$route"

  build:
    needs: route
    name: Build the iPhone app and UI tests for the simulator
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || fromJSON(github.run_attempt > 1 && needs.route.outputs.retry_runs_on || needs.route.outputs.runs_on) }}
    timeout-minutes: 45
    steps:
      - name: Result paths
        run: |
          echo "DERIVED=${CMUX_DERIVED_DATA_SLOT:-$RUNNER_TEMP/dd}" >> "$GITHUB_ENV"
          echo "OUT=$RUNNER_TEMP/out" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/dd" "$RUNNER_TEMP/out"
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Select Xcode
        run: ./scripts/select-ci-xcode.sh
      # CmuxMobileLinkFFI.xcframework is built only when what it is built from changes
      # (.github/scripts/ios_link_ffi_key.py): each job built it from scratch,
      # about 3 minutes of a Mac (run 43652999096). A pull request only
      # reads the cache; other events save what they built.
      - name: The framework's inputs
        id: ffi-key
        run: |
          set -euo pipefail
          # A ref from before the key script, or a key that fails, builds as before.
          if [ -f .github/scripts/ios_link_ffi_key.py ]; then
            python3 -I .github/scripts/ios_link_ffi_key.py --repo . --explain \
              --extra "xcode=$(xcodebuild -version | tr '\n' ' ')" --extra "runner=$RUNNER_OS-$RUNNER_ARCH" >> "$GITHUB_OUTPUT" \
              || echo "::warning::no cache key for CmuxMobileLinkFFI.xcframework; building it"
          fi
      - name: Restore the framework built from the same inputs
        id: ffi
        if: steps.ffi-key.outputs.key != ''
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            cmux-next-ios/CmuxMobileKit/Frameworks/CmuxMobileLinkFFI.xcframework
            cmux-next-ios/CmuxMobileKit/Sources/CmuxMobileLinkFFI/CmuxMobileLinkFFI.swift
          key: ios-link-ffi-xcframework-${{ steps.ffi-key.outputs.key }}
      - name: Set up pinned Rust
        if: steps.ffi.outputs.cache-hit != 'true'
        uses: ./.github/actions/setup-cmux-tui-rust
      - name: Cache cargo
        if: steps.ffi.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Why: docs/ci/cmux-next-workflow-notes.md#note-210 (pool runners keep different leftover toolchains)
          add-rust-environment-hash-key: false
          cache-bin: false
          workspaces: cmux-next-ios/rust
          key: ios-sim-linux-build-${{ hashFiles('cmux-tui/rust-toolchain.toml', 'cmux-next-ios/rust/Cargo.lock', '.cargo/config.toml') }}
          # A lane branch's entry is read only by that branch again: save from feat-cmux-next, restore everywhere.
          save-if: ${{ github.ref == 'refs/heads/feat-cmux-next' }}
      - name: Build CmuxMobileLinkFFI.xcframework
        if: steps.ffi.outputs.cache-hit != 'true'
        env:
          JOBS: "6"
        run: bash cmux-next-ios/rust/scripts/build-xcframework.sh
      - name: Save the framework for later runs
        if: steps.ffi-key.outputs.key != '' && steps.ffi.outputs.cache-hit != 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/feat-cmux-next'
        # Another job saving the same key first is not a failure.
        continue-on-error: true
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            cmux-next-ios/CmuxMobileKit/Frameworks/CmuxMobileLinkFFI.xcframework
            cmux-next-ios/CmuxMobileKit/Sources/CmuxMobileLinkFFI/CmuxMobileLinkFFI.swift
          key: ios-link-ffi-xcframework-${{ steps.ffi-key.outputs.key }}
      - name: Install xcodegen
        run: |
          set -euo pipefail
          command -v xcodegen >/dev/null || brew install xcodegen
      - name: Build the app and the UI tests for testing
        working-directory: cmux-next-ios
        run: |
          set -euo pipefail
          xcodegen generate -q
          xcodebuild -project CmuxMobileApp.xcodeproj -scheme CmuxMobileApp -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$DERIVED" -enableCodeCoverage NO \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            CMUX_MOBILE_APPLE_SIGN_IN=YES \
            build-for-testing 2>&1 | tee "$OUT/build.log" | { grep -E 'error:|BUILD' || true; }
          test "${PIPESTATUS[0]}" -eq 0
      - name: Pack the products and the simulator XCTest platform
        run: |
          set -euo pipefail
          tar -C "$DERIVED/Build" -czf "$OUT/ios-sim-build.tar.gz" Products
          plat="$(xcode-select -p)/Platforms/iPhoneSimulator.platform/Developer"
          tar -C "$plat" -czf "$OUT/ios-sim-xctest-platform.tar.gz" \
            $(cd "$plat" && ls -d Library/Frameworks Library/PrivateFrameworks Library/Xcode/Agents usr/lib 2>/dev/null)
          xcodebuild -version > "$OUT/xcode-version.txt"
          ls -la "$OUT"
      - name: Upload ios-sim-build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-sim-build
          path: |
            ${{ env.OUT }}/ios-sim-build.tar.gz
            ${{ env.OUT }}/xcode-version.txt
            ${{ env.OUT }}/build.log
          if-no-files-found: error
          retention-days: 7
      - name: Upload ios-sim-xctest-platform
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-sim-xctest-platform
          path: ${{ env.OUT }}/ios-sim-xctest-platform.tar.gz
          if-no-files-found: error
          retention-days: 7
      # Both tarballs in one artifact, the form the fleet scheduler's simsdk step takes
      # (CMUX_IOS_PRODUCTS=<run id>/ios-sim-products; scripts/ci/ios-sim-linux-test.sh).
      - name: Upload ios-sim-products
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-sim-products
          path: |
            ${{ env.OUT }}/ios-sim-build.tar.gz
            ${{ env.OUT }}/ios-sim-xctest-platform.tar.gz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
