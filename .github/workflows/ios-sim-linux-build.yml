name: iOS simulator build for the Linux simulator runner
run-name: >-
  iOS simulator build (Linux runner) · ${{ inputs.ref || github.head_ref || github.ref_name }}

# Builds the NEXT iPhone app, its extensions and its UI test runner for the
# simulator (build-for-testing, arm64) on the build fleet and uploads them, so a
# Linux simulator runner can install and drive them: `ios-sim-build`
# (Products/ with the .xctestrun), `ios-sim-xctest-platform` (the simulator
# platform's XCTest frameworks and agents the runner needs), both together as
# `ios-sim-products` (CMUX_IOS_PRODUCTS=<run id>/ios-sim-products;
# scripts/ci/ios-sim-linux-test.sh), and `ios-sim-app` (the bare .app).
# The gateway runner only hands the build to the controller (cmux-ci ios-build
# --what sim-products) and uploads what comes back; no Mac is involved. A red
# build, or no answer from the fleet, fails the job.
# Runs on lane branches that work on that runner and by hand.
on:
  push:
    branches: ["lane/ios-sim-linux**"]
  workflow_dispatch:
    inputs:
      ref:
        description: App source to build (a full commit SHA, or a branch or tag); empty is this ref
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ios-sim-linux-build-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  build-fleet:
    name: Build the iPhone app and UI tests for the simulator
    if: github.repository_owner == 'manaflow-ai' && vars.CI_EVAL_STEP_GATEWAY != ''
    # The literal fallback never schedules: the job's if: skips outside manaflow-ai and when the variable is unset.
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || 'glaeda-gateway-xcode-26.6' }} # frozen-label: CI_EVAL_STEP_GATEWAY (cmux#54437)
    timeout-minutes: 45  # the client waits up to 600 s queued plus 1800 s running
    steps:
      - name: Resolve the commit
        id: ref
        env:
          REF: ${{ inputs.ref || github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$REF" =~ ^[0-9a-f]{40}$ ]]; then sha="$REF"
          else sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$REF" --jq .sha)"; fi
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::cannot resolve $REF to a commit"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "building $sha"

      # Exit 0 is all three files (every product compiled, linked and assembled), 1 a failed build of this commit,
      # anything else no answer from the fleet.
      - name: Build on the build fleet
        env:
          SHA: ${{ steps.ref.outputs.sha }}
        run: |
          set -uo pipefail
          client="${CMUX_CI_CLIENT:-$HOME/.local/bin/cmux-ci}"
          if ! [[ -x "$client" ]]; then
            echo "::error title=build fleet::cmux-ci is not installed on runner $RUNNER_NAME"
            exit 1
          fi
          out="$RUNNER_TEMP/out"
          status=0
          "$client" ios-build --what sim-products --ref "$SHA" --out "$out" --timeout 1800 --queue-timeout 600 || status=$?
          if [[ "$status" == 1 ]]; then echo "::error title=iOS simulator build::the app or its UI tests did not build at $SHA"; exit 1; fi
          if [[ "$status" != 0 ]]; then echo "::error title=build fleet::no answer from the build fleet (exit $status); re-run the job"; exit 1; fi
          ls -la "$out"
          echo "OUT=$out" >> "$GITHUB_ENV"

      - name: Upload ios-sim-build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-sim-build
          path: ${{ env.OUT }}/ios-sim-build.tar.gz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Upload ios-sim-xctest-platform
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-sim-xctest-platform
          path: ${{ env.OUT }}/ios-sim-xctest-platform.tar.gz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      # Both tarballs in one artifact, the form the fleet scheduler's simsdk step takes
      # (CMUX_IOS_PRODUCTS=<run id>/ios-sim-products; scripts/ci/ios-sim-linux-test.sh).
      - name: Upload ios-sim-products
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-sim-products
          path: |
            ${{ env.OUT }}/ios-sim-build.tar.gz
            ${{ env.OUT }}/ios-sim-xctest-platform.tar.gz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      # The bare CmuxMobileApp.app, for `agent-sim install`.
      - name: Upload ios-sim-app
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-sim-app
          path: ${{ env.OUT }}/ios-sim-app.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
