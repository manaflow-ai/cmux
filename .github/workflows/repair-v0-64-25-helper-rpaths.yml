name: Repair v0.64.25 cmux-cua rpaths

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type v0.64.25 to replace the GitHub release asset and stable R2 appcast; any other value is a dry run
        required: false
        default: ""
        type: string

permissions: {}

concurrency:
  group: stable-appcast-publication
  cancel-in-progress: false

jobs:
  # No environment and no secrets: the one check that runs bundle code (the
  # diff sidecar handshake) runs on the shipped app here. Re-signing changes
  # only the sidecar's signature; sign-cmux-bundle.sh repeats the static
  # checks on the re-signed copy in the repair job.
  verify-shipped:
    permissions:
      contents: read
    outputs:
      dmg_sha256: ${{ steps.verify.outputs.dmg_sha256 }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || 'blacksmith-6vcpu-macos-26' }}
    timeout-minutes: 20
    env:
      TARGET_TAG: v0.64.25
    steps:
      - name: Checkout repair tooling
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: false

      - name: Select Xcode
        run: ./scripts/select-ci-xcode.sh

      - name: Verify shipped diff sidecar runtime contract
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/shipped"
          mkdir -p "$root/mount"
          gh release download "$TARGET_TAG" --repo "$GITHUB_REPOSITORY" --pattern cmux-macos.dmg --dir "$root" --clobber
          hdiutil attach "$root/cmux-macos.dmg" -nobrowse -readonly -mountpoint "$root/mount" >/dev/null
          trap 'hdiutil detach "$root/mount" >/dev/null 2>&1 || hdiutil detach -force "$root/mount" >/dev/null 2>&1 || true' EXIT
          app="$(find "$root/mount" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$app"
          ./scripts/verify-diff-sidecar-artifact.sh \
            "$app/Contents/Resources/bin/cmux-diff-sidecar" \
            --archs "$(lipo -archs "$app/Contents/MacOS/cmux")" \
            --require-signed
          echo "dmg_sha256=$(shasum -a 256 "$root/cmux-macos.dmg" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

  # Leo, 2026-10-28: the release signing jobs may run on our own Macs ("we can just read the code").
  # Picks repair's runner (scripts/ci/signing_runner.py): a drained owned Mac on attempt 1 while
  # vars.CI_SIGN_OWNED is 1, held whole for the job (its claim step), else the Blacksmith macOS label
  # whose queue moves, and the other size for a re-run. The routing App key stays in this Linux job's
  # routing environment and is minted only on the refs the release environment allows (main, rc/**, v* tags), so
  # no other branch's picker code ever holds it; actions: read is the queue janitor's pool snapshot. A failed pick reads as
  # success, and repair then falls back to Blacksmith 6 vCPU.
  pick-sign-runner:
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.CI_CLOUD_OVERFLOW_SAVED && 'blacksmith-8vcpu-ubuntu-2404' || 'blacksmith-4vcpu-ubuntu-2404' }}
    environment: ci-routing-agent
    continue-on-error: true
    # Checkout, then the token mints 1 + 1 and the pick 3.
    timeout-minutes: 8
    permissions:
      actions: read
      contents: read
    outputs:
      owned: ${{ steps.pick.outputs.owned }}
      runner: ${{ steps.pick.outputs.runner }}
      alternate: ${{ steps.pick.outputs.alternate }}
    steps:
      - name: Checkout the picker
        if: github.repository_owner == 'manaflow-ai'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          sparse-checkout: scripts/ci

      - name: Mint the owned-pool routing token
        id: route-token
        if: github.repository == 'manaflow-ai/cmux' && vars.CI_SIGN_OWNED == '1' && vars.CI_PR_POOL_OWNED == '1' && vars.GLAEDA_ROUTE_APP_ID != '' && github.run_attempt == 1 && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/rc/') || startsWith(github.ref, 'refs/tags/v'))
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.GLAEDA_ROUTE_APP_ID }}
          private-key: ${{ secrets.GLAEDA_ROUTE_APP_KEY }}
          permission-administration: read
          permission-organization-self-hosted-runners: read

      - name: Mint the routing token without the org permission
        id: route-token-repo
        if: steps.route-token.outcome == 'failure'
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.GLAEDA_ROUTE_APP_ID }}
          private-key: ${{ secrets.GLAEDA_ROUTE_APP_KEY }}
          permission-administration: read

      - name: Pick the signing runner
        id: pick
        if: github.repository_owner == 'manaflow-ai'
        continue-on-error: true
        timeout-minutes: 3
        env:
          ENABLED: ${{ vars.CI_SIGN_OWNED }}
          ROUTE_TOKEN: ${{ steps.route-token.outputs.token || steps.route-token-repo.outputs.token }}
          OWNED_LABELS: ${{ vars.CI_SIDE_LANE_RUNNER }}
          SNAPSHOT_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ vars.MACOS_RUNNER_26 }}
        run: python3 scripts/ci/signing_runner.py

  repair:
    needs: [verify-shipped, pick-sign-runner]
    permissions: &repair-permissions
      contents: write
    # Production secrets: GitHub releases them only to protected refs (the
    # environment's deployment branch policy: main, tags v*).
    environment: release
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || github.run_attempt == 1 && needs.pick-sign-runner.outputs.owned && fromJSON(needs.pick-sign-runner.outputs.owned) || github.run_attempt > 1 && needs.pick-sign-runner.outputs.alternate || needs.pick-sign-runner.outputs.runner || 'blacksmith-6vcpu-macos-26' }}
    timeout-minutes: 90
    env: &repair-env
      TARGET_TAG: v0.64.25
      REPAIR_ROOT: ${{ github.workspace }}/.cmux-v0.64.25-repair
      APP_PATH: ${{ github.workspace }}/.cmux-v0.64.25-repair/cmux.app
      DMG_PATH: ${{ github.workspace }}/cmux-macos.dmg
      APPCAST_PATH: ${{ github.workspace }}/appcast.xml
    outputs: &repair-outputs
      # owned when the claim gate passed on an owned Mac; the Blacksmith twin signs when it did not.
      claim: ${{ steps.claim-gate.outputs.claim }}
    steps: &repair-steps
      # First, before the checkout's token or any secret: on an owned Mac this job holds the whole
      # mini (glaeda's exclusive class) or fails here (tests/test_ci_signing_owned_mac.py CLAIM_GATE).
      - name: Hold the whole Mac before any credential
        id: claim-gate
        shell: bash
        run: |
          owned=""
          case "${RUNNER_NAME:-}" in *-glaeda|*-glaeda-*) owned=1 ;; esac
          if [ -d /Users/Shared/cmux-build-fleet ]; then owned=1; fi
          if [ -n "$owned" ]; then
            if [ "${GLAEDA_JOB_CLAIM:-}" != exclusive ]; then
              echo "::error title=Signing runner::This owned Mac did not give the job the whole mini; this run's Blacksmith job signs instead."
              exit 1
            fi
            hooks=$(curl -fsS --proto '=https' --retry 3 --max-time 20 \
              "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/scripts/ci/glaeda-signing-hooks.txt") || hooks=""
            hook="${GLAEDA_HOOK_SHA256:-}"
            listed=""
            if [[ "$hook" =~ ^[0-9a-f]{64}$ ]]; then
              while read -r sha _; do if [ "$sha" = "$hook" ]; then listed=1; fi; done <<< "$hooks"
            fi
            if [ -z "$listed" ]; then
              echo "::error title=Signing runner::glaeda hook ${hook:-unnamed} is not one scripts/ci/glaeda-signing-hooks.txt lists; this run's Blacksmith job signs instead."
              exit 1
            fi
            echo "claim=owned" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repair tooling
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: false

      # Before any secret: the same check again, and a signing keychain a killed job left is removed.
      - name: Claim the whole Mac for signing
        run: ./scripts/ci/signing-runner-claim.sh

      - name: Select Xcode
        run: ./scripts/select-ci-xcode.sh

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22.23.4"

      - name: Install create-dmg
        run: |
          set -euo pipefail
          CMUX_NODE_BIN="$(command -v node)"
          npm_config_prefix="$RUNNER_TEMP/npm-global"
          export npm_config_prefix
          mkdir -p "$npm_config_prefix"
          npm install --global "create-dmg@8.0.0"
          wrapper_dir="$RUNNER_TEMP/create-dmg-wrapper"
          mkdir -p "$wrapper_dir"
          cat > "$wrapper_dir/create-dmg" <<EOF
          #!/usr/bin/env bash
          exec "$CMUX_NODE_BIN" "$npm_config_prefix/lib/node_modules/create-dmg/cli.js" "\$@"
          EOF
          chmod +x "$wrapper_dir/create-dmg"
          echo "$wrapper_dir" >> "$GITHUB_PATH"

      - name: Download v0.64.25 DMG
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_DMG_SHA256: ${{ needs.verify-shipped.outputs.dmg_sha256 }}
        run: |
          set -euo pipefail
          mkdir -p "$REPAIR_ROOT/input"
          gh release download "$TARGET_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern cmux-macos.dmg \
            --dir "$REPAIR_ROOT/input" \
            --clobber
          test -s "$REPAIR_ROOT/input/cmux-macos.dmg"
          # Repair exactly the bytes verify-shipped checked.
          actual="$(shasum -a 256 "$REPAIR_ROOT/input/cmux-macos.dmg" | awk '{print $1}')"
          [ "$actual" = "$VERIFIED_DMG_SHA256" ] || { echo "the downloaded DMG differs from the one verify-shipped checked" >&2; exit 1; }

      - name: Extract and validate shipped app
        run: |
          set -euo pipefail
          mount_dir="$REPAIR_ROOT/mount"
          mkdir -p "$mount_dir" "$REPAIR_ROOT"
          cleanup_mount() {
            hdiutil detach "$mount_dir" >/dev/null 2>&1 || hdiutil detach -force "$mount_dir" >/dev/null 2>&1 || true
          }
          trap cleanup_mount EXIT
          hdiutil attach "$REPAIR_ROOT/input/cmux-macos.dmg" -nobrowse -readonly -mountpoint "$mount_dir" >/dev/null
          source_app="$(find "$mount_dir" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$source_app"
          ditto "$source_app" "$APP_PATH"
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Contents/Info.plist")"
          test "$version" = "0.64.25"
          for helper in \
            "$APP_PATH/Contents/Resources/bin/cmux-cua" \
            "$APP_PATH/Contents/Library/cmux Computer Use.app/Contents/MacOS/cmux-cua"; do
            test -x "$helper"
            echo "$helper: $(lipo -archs "$helper")"
          done

      # No step runs code from the bundle while this keychain exists. The DMG
      # step deletes it after the last signature.
      - name: Import release signing certificate
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: ./scripts/ci/signing-keychain.sh create

      - name: Strip helper toolchain rpaths
        run: |
          set -euo pipefail
          ./scripts/strip-cmux-cua-rpaths.sh \
            "$APP_PATH/Contents/Resources/bin/cmux-cua" \
            "$APP_PATH/Contents/Library/cmux Computer Use.app/Contents/MacOS/cmux-cua"

      - name: Start helper notarization
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          ./scripts/ci/notarize-computer-use-helper.sh \
            --start "$REPAIR_ROOT/computer-use-notarization.state" \
            "$APP_PATH" \
            cmux.release.entitlements \
            "$APPLE_SIGNING_IDENTITY"

      - name: Re-sign repaired app
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          test -n "$APPLE_SIGNING_IDENTITY"
          CMUX_SIGN_MODE=all-except-computer-use \
            ./scripts/sign-cmux-bundle.sh \
            "$APP_PATH" \
            cmux.release.entitlements \
            "$APPLE_SIGNING_IDENTITY"

      - name: Verify repaired Mach-O load commands
        run: ./scripts/verify-bundle-load-commands.sh "$APP_PATH"

      - name: Finish helper notarization
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          ./scripts/ci/notarize-computer-use-helper.sh \
            --finish "$REPAIR_ROOT/computer-use-notarization.state" \
            "$APP_PATH" \
            cmux.release.entitlements \
            "$APPLE_SIGNING_IDENTITY"

      - name: Notarize and staple repaired app
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          notary_tmp="$(mktemp -d "$RUNNER_TEMP/cmux-notary.XXXXXX")"
          trap 'rm -rf "$notary_tmp"' EXIT
          source ./scripts/ci/lib/notary-auth.sh
          notary_auth_init "$notary_tmp"
          zip_path="$REPAIR_ROOT/cmux-notary.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$zip_path"
          submit_json="$(xcrun notarytool submit "$zip_path" \
            "${NOTARY_AUTH_ARGS[@]}" \
            --wait --output-format json)"
          status="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])' <<<"$submit_json")"
          if [ "$status" != Accepted ]; then
            echo "Repaired app notarization failed: $status" >&2
            exit 1
          fi
          xcrun stapler staple "$APP_PATH"
          xcrun stapler validate "$APP_PATH"
          spctl -a -vv --type execute "$APP_PATH"
          rm -f "$zip_path"

      - name: Create and notarize repaired DMG
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          notary_tmp="$(mktemp -d "$RUNNER_TEMP/cmux-notary.XXXXXX")"
          trap 'rm -rf "$notary_tmp"' EXIT
          source ./scripts/ci/lib/notary-auth.sh
          notary_auth_init "$notary_tmp"
          dmg_dir="$REPAIR_ROOT/dmg-output"
          mkdir -p "$dmg_dir"
          create-dmg --no-code-sign "$APP_PATH" "$dmg_dir"
          created_dmg="$(find "$dmg_dir" -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$created_dmg"
          mv "$created_dmg" "$DMG_PATH"
          # The Apple waits above can pass the keychain's short idle lock.
          ./scripts/ci/signing-keychain.sh unlock
          codesign --force --timestamp --keychain build.keychain \
            --sign "$APPLE_SIGNING_IDENTITY" "$DMG_PATH"
          codesign --verify --verbose=2 "$DMG_PATH"
          # That was the last signature.
          ./scripts/ci/signing-keychain.sh delete
          submit_json="$(xcrun notarytool submit "$DMG_PATH" \
            "${NOTARY_AUTH_ARGS[@]}" \
            --wait --output-format json)"
          status="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])' <<<"$submit_json")"
          if [ "$status" != Accepted ]; then
            echo "Repaired DMG notarization failed: $status" >&2
            exit 1
          fi
          xcrun stapler staple "$DMG_PATH"
          xcrun stapler validate "$DMG_PATH"

      - name: Delete signing keychain after the last signature
        if: always()
        run: ./scripts/ci/signing-keychain.sh delete

      - name: Gate repaired app with syspolicy_check
        run: syspolicy_check distribution "$APP_PATH"

      - name: Regenerate signed Sparkle appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$SPARKLE_PRIVATE_KEY"
          ./scripts/sparkle_generate_appcast.sh "$DMG_PATH" "$TARGET_TAG" "$APPCAST_PATH"
          test -s "$APPCAST_PATH"
          grep -q 'sparkle:edSignature' "$APPCAST_PATH"
          grep -q 'cmux-macos.dmg' "$APPCAST_PATH"

      - name: Upload dry-run artifacts
        if: inputs.confirmation != 'v0.64.25'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-v0.64.25-rpath-repair-dry-run
          path: |
            cmux-macos.dmg
            appcast.xml
          if-no-files-found: error
          retention-days: 7

      - name: Replace v0.64.25 GitHub release assets
        if: inputs.confirmation == 'v0.64.25'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "$TARGET_TAG" "$DMG_PATH" "$APPCAST_PATH" \
            --repo "$GITHUB_REPOSITORY" --clobber

      - name: Replace stable R2 appcast when v0.64.25 is current
        if: inputs.confirmation == 'v0.64.25'
        env:
          GH_TOKEN: ${{ github.token }}
          AWS_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: "https://${{ secrets.CF_R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
        run: |
          set -euo pipefail
          latest="$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases --json tagName -q '.[].tagName' | sort -V | tail -1)"
          if [ "$latest" != "$TARGET_TAG" ]; then
            echo "Skipping stable R2 replacement: $TARGET_TAG is not the latest release ($latest)"
            exit 0
          fi
          python3 scripts/ci/upload-r2-object.py \
            --file "$APPCAST_PATH" \
            --endpoint-url "$R2_ENDPOINT" \
            --bucket cmux-binaries \
            --key stable/appcast.xml \
            --content-type application/xml \
            --cache-control 'no-cache, no-store, must-revalidate'

      - name: Cleanup signing keychain
        if: always()
        run: |
          ./scripts/ci/signing-keychain.sh delete --keychain build.keychain \
            || security delete-keychain build.keychain >/dev/null 2>&1 || true
          rm -f /tmp/cert.p12

  repair-blacksmith:
    needs: [verify-shipped, pick-sign-runner, repair]
    # The same run signs on Blacksmith when the owned Mac took repair but its claim gate never passed
    # (glaeda refused the job, or a hook scripts/ci/glaeda-signing-hooks.txt does not list admitted it).
    if: "!cancelled() && github.run_attempt == 1 && needs.pick-sign-runner.outputs.owned != '' && needs.repair.result != 'skipped' && needs.repair.result != 'cancelled' && needs.repair.outputs.claim != 'owned'"
    permissions: *repair-permissions
    environment: release
    # Blacksmith only: this run's sign when the owned Mac refused the job (its claim gate).
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || github.run_attempt > 1 && needs.pick-sign-runner.outputs.alternate || needs.pick-sign-runner.outputs.runner || 'blacksmith-6vcpu-macos-26' }}
    timeout-minutes: 90
    env: *repair-env
    outputs: *repair-outputs
    steps: *repair-steps
