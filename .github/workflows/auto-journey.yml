name: Auto mode journey (staging, Mac -> Cloud -> Mac)

# One real Auto mode journey (plans/cmux-next/auto-mode/DESIGN.md, "Move now") against staging: an ephemeral
# macOS VM builds cmux-tui from feat-cmux-next (or the `ref` commit on it), runs its acpmux daemon as the
# laptop with `cloud.autoCloud` on in this run's own settings file, and scripts/cmux-next/auto-journey.ts
# moves one chat Mac -> Cloud -> Mac through staging's /v1/auto-sessions routes, as the app's banner does.
# The steps are the FakeAutoCloud journey's (cmux-tui/crates/acpmux/tests/auto_journey) on real pieces:
#
#   Mac chat with Auto on, held as device:<id> -> move {to: cloud} -> holder vm:<machine>, the machine's folder
#   has the Mac's commit and uncommitted work, a message is answered on the machine -> move {to: local} ->
#   holder device:<id>, the Mac's folder has the machine's change, its transcript has every prompt once, the
#   next prompt runs on the Mac.
#
# Auto is on only for the agent test account (CMUX_DOGFOOD_STACK_EMAIL and _PASSWORD in cmux-next-vm-image-dev,
# the pair cloud-rd-link-readback.yml reads) on this throwaway runner; nobody else's setting changes. The run's
# machine and its `cli` install are removed by the journey and again in an always() step. Nothing gates on it.
#
# Lane VMs dispatch it through the lane broker's `auto_journey` action (cmuxterm-hq lane-gh-broker); the broker
# checks only the input's shape, this job holds the rest: feat-cmux-next only, a `ref` that is on it, staging only.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: A commit on feat-cmux-next to build the Mac daemon from (7-40 hex), or empty for its tip
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: auto-journey-${{ github.run_id }}
  cancel-in-progress: false

env:
  BASH_ENV: '$({ w="${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh"; t="${RUNNER_TEMP:-/nonexistent}/api-call-log-src"; if [ -f "$w" ]; then echo "$w"; elif [ -n "${RUNNER_TEMP:-}" ]; then if [ ! -f "$t/env.sh" ] && [ ! -e "$t.tried" ] && { [ "${RUNNER_OS:-}" = Linux ] || [ "${RUNNER_OS:-}" = macOS ]; } && [ "$(date -u +%Y%m%d%H)" -lt 2026112300 ]; then : > "$t.tried"; mkdir -p "$t.part" && for x in env.sh gh sitecustomize.py isolated.py; do curl -fsSL --max-time 5 -o "$t.part/$x" "https://raw.githubusercontent.com/manaflow-ai/cmux/27647ffd3ae838c63be28ca3e5883dcd68c34518/scripts/ci/api_call_log/$x" || break; done; [ -s "$t.part/isolated.py" ] && mv "$t.part" "$t"; fi; if [ -f "$t/env.sh" ]; then echo "$t/env.sh"; else echo unset BASH_ENV > "$t.off.sh" && echo "$t.off.sh"; fi; fi; } 2>/dev/null)'

jobs:
  journey:
    if: github.ref == 'refs/heads/feat-cmux-next'
    # Holds the stack pair: an ephemeral macOS VM from the declared pool, as cloud-rd-link-readback.yml.
    environment:
      name: cmux-next-vm-image-dev
      deployment: false
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || fromJSON(vars.RUNNER_POOLS).macos_26 }}
    timeout-minutes: 90
    steps:
      - name: Refuse any ref but feat-cmux-next, and a malformed commit
        env:
          REF: ${{ github.ref }}
          AT: ${{ inputs.ref }}
        run: |
          if [ "$REF" != refs/heads/feat-cmux-next ]; then
            echo "::error::auto-journey runs on feat-cmux-next only (got $REF)"
            exit 1
          fi
          if [ -n "$AT" ] && ! printf '%s' "$AT" | grep -Eqx '[0-9a-f]{7,40}|feat-cmux-next'; then
            echo "::error::ref must be a 7-40 character lowercase commit on feat-cmux-next, feat-cmux-next, or empty"
            exit 1
          fi

      - name: Checkout cmux
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: false
          fetch-depth: 0

      # The driver runs from the branch tip; the Mac daemon is built from `ref`, which must be on feat-cmux-next.
      - name: Pick the commit to build
        id: at
        env:
          AT: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          src="$PWD"
          if [ -n "$AT" ] && [ "$AT" != feat-cmux-next ]; then
            sha="$(git rev-parse --verify --quiet "$AT^{commit}")" || sha=""
            if [ -z "$sha" ]; then echo "::error::no commit $AT in this repository"; exit 1; fi
            if ! git merge-base --is-ancestor "$sha" HEAD; then
              echo "::error::$sha is not on feat-cmux-next; auto-journey builds only commits on it"
              exit 1
            fi
            src="$RUNNER_TEMP/auto-journey-src"
            git worktree add --detach "$src" "$sha"
          fi
          (cd "$src" && git submodule update --init --depth 1 ghostty ghostty-next)
          echo "src=$src" >> "$GITHUB_OUTPUT"
          echo "sha=$(git -C "$src" rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Select Xcode
        run: ./scripts/select-ci-xcode.sh

      - name: Set up cmux-tui Rust
        uses: ./.github/actions/setup-cmux-tui-rust

      # The Zig ghostty-next's build.zig.zon names: the libghostty-vt source cmux-tui builds from.
      - name: Install Zig
        env:
          GHOSTTY_ZIG_SOURCE: ghostty-next
        working-directory: ${{ steps.at.outputs.src }}
        run: ./scripts/install-zig-ci.sh

      - name: Build the commit's macOS cmux-tui
        id: build-cmux-tui
        working-directory: ${{ steps.at.outputs.src }}/cmux-tui
        env:
          CARGO_NET_RETRY: "10"
          CARGO_HTTP_TIMEOUT: "120"
          GHOSTTY_ZIG_SOURCE: ghostty-next
          CMUX_GHOSTTY_SRC: ""
        run: |
          set -euo pipefail
          cargo build -p cmux-tui --bin cmux-tui --locked
          binary="${CARGO_TARGET_DIR:-$PWD/target}/debug/cmux-tui"
          case "$binary" in /*) ;; *) binary="$PWD/$binary" ;; esac
          test -x "$binary"
          file "$binary" | grep -q 'Mach-O'
          echo "path=$binary" >> "$GITHUB_OUTPUT"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
          no-cache: ${{ !startsWith(github.workspace, '/home/runner/work/') }}

      - name: Auto journey (staging)
        timeout-minutes: 40
        env:
          CMUX_DOGFOOD_STACK_EMAIL: ${{ secrets.CMUX_DOGFOOD_STACK_EMAIL }}
          CMUX_DOGFOOD_STACK_PASSWORD: ${{ secrets.CMUX_DOGFOOD_STACK_PASSWORD }}
          CMUX_PATH: ${{ steps.build-cmux-tui.outputs.path }}
        run: |
          set -euo pipefail
          if [ -z "${CMUX_DOGFOOD_STACK_EMAIL:-}" ] || [ -z "${CMUX_DOGFOOD_STACK_PASSWORD:-}" ]; then
            echo "::error::the staging agent Stack pair is missing from cmux-next-vm-image-dev"
            exit 1
          fi
          OUT="$RUNNER_TEMP/auto-journey"
          mkdir -p "$OUT"
          bun scripts/cmux-next/auto-journey.ts --backend staging --out "$OUT" --cmux "$CMUX_PATH"

      - name: Summarize the journey
        if: always()
        env:
          SHA: ${{ steps.at.outputs.sha }}
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/auto-journey"
          {
            echo '## Auto mode journey (staging, Mac -> Cloud -> Mac)'
            echo
            echo "- Mac daemon built from \`${SHA:-?}\`"
            echo
            if [ -s "$OUT/summary.md" ]; then
              if grep -Eiq '(cmvm|cmk|crt|crk|cmm|cmj)_[A-Za-z0-9_-]{8,}|sk-(ant-)?[A-Za-z0-9_-]{10,}|eyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}|bearer[[:space:]]+[A-Za-z0-9._~+/=-]+|((api[_-]?key|access[_-]?token|refresh[_-]?token|authorization|password|secret|credential)"?[[:space:]]*[:=])' "$OUT/summary.md"; then
                echo 'The summary holds a secret-shaped value; it is not shown.'
              else
                cat "$OUT/summary.md"
              fi
            else
              echo 'No summary was written (the run stopped before the journey).'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the run's machine and install
        if: always()
        env:
          CMUX_DOGFOOD_STACK_EMAIL: ${{ secrets.CMUX_DOGFOOD_STACK_EMAIL }}
          CMUX_DOGFOOD_STACK_PASSWORD: ${{ secrets.CMUX_DOGFOOD_STACK_PASSWORD }}
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/auto-journey"
          if [ ! -s "$OUT/owned.json" ]; then echo "no owned.json: the run made nothing"; exit 0; fi
          if ! command -v bun >/dev/null 2>&1; then echo "::warning::no bun: the journey's own cleanup is the only one"; exit 0; fi
          bun scripts/cmux-next/auto-journey.ts --backend staging --cleanup "$OUT"
