# CI for the clients generated from the cmux VM OpenAPI document
# (workers/cmux-vm/openapi.json): the Rust `cmux-vm` CLI and its
# `cmux-vm-client` crate (workers/cmux-vm/cli), and the TypeScript SDK
# `@cmux/vm` (workers/cmux-vm/sdk).
#
# Each job regenerates its client from the document and fails when the
# checked-in output differs, so a contract change always lands together with
# the regenerated clients.

name: cmux VM clients

on:
  # These jobs only check generated clients; they never deploy the Worker.
  workflow_dispatch:
  pull_request:
    paths:
      - workers/cmux-vm/openapi.json
      - workers/cmux-vm/cli/**
      # The agent-key mint's rules the CLI shares with the cmux app.
      - cmux-tui/crates/cmux-cloud-config/**
      - workers/cmux-vm/sdk/**
      # The cli tests run every command in this agent guide (tests/agent_doc.rs).
      - skills/cmux-cloud-vm/references/headless.md
      - cmux-tui/rust-toolchain.toml
      - .github/actions/setup-cmux-tui-rust/**
      - .github/actions/runner-cargo-home/**
      - .github/workflows/cmux-vm-clients.yml
  push:
    # feat-cmux-next too: cmux VM lands there first, and without this run an
    # openapi.json change left the generated clients stale unnoticed (cx-b4h.4).
    branches: [main, feat-cmux-next, "codex/vm-api-*"]
    paths:
      - workers/cmux-vm/openapi.json
      - workers/cmux-vm/cli/**
      # The agent-key mint's rules the CLI shares with the cmux app.
      - cmux-tui/crates/cmux-cloud-config/**
      - workers/cmux-vm/sdk/**
      # The cli tests run every command in this agent guide (tests/agent_doc.rs).
      - skills/cmux-cloud-vm/references/headless.md
      - cmux-tui/rust-toolchain.toml
      - .github/actions/setup-cmux-tui-rust/**
      - .github/actions/runner-cargo-home/**
      - .github/workflows/cmux-vm-clients.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Warnings never fail a pull request's compile (Leo, 2026-11-19); pushes, dispatches, nightly and release
  # keep them errors. scripts/ci/warnings_policy.py.
  CI_WARNINGS: ${{ github.event_name == 'pull_request' && 'soft' || 'deny' }}
  # Temporary REST budget attribution: one gh-call line per GitHub API call (scripts/ci/api_call_log/env.sh, fetched at a fixed commit when the checkout has no copy).
  BASH_ENV: '$({ w="${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh"; t="${RUNNER_TEMP:-/nonexistent}/api-call-log-src"; if [ -f "$w" ]; then echo "$w"; elif [ -n "${RUNNER_TEMP:-}" ]; then if [ ! -f "$t/env.sh" ] && [ ! -e "$t.tried" ] && { [ "${RUNNER_OS:-}" = Linux ] || [ "${RUNNER_OS:-}" = macOS ]; } && [ "$(date -u +%Y%m%d%H)" -lt 2026112300 ]; then : > "$t.tried"; mkdir -p "$t.part" && for x in env.sh gh sitecustomize.py isolated.py; do curl -fsSL --max-time 5 -o "$t.part/$x" "https://raw.githubusercontent.com/manaflow-ai/cmux/27647ffd3ae838c63be28ca3e5883dcd68c34518/scripts/ci/api_call_log/$x" || break; done; [ -s "$t.part/isolated.py" ] && mv "$t.part" "$t"; fi; if [ -f "$t/env.sh" ]; then echo "$t/env.sh"; else echo unset BASH_ENV > "$t.off.sh" && echo "$t.off.sh"; fi; fi; } 2>/dev/null)'

jobs:
  rust:
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && (vars.CI_FORK_LINUX_RUNNER || 'ubuntu-24.04') || 'cmux-linux' }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: workers/cmux-vm/cli
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # workers/cmux-vm/cli/rust-toolchain.toml is a regular-file copy of
      # cmux-tui/rust-toolchain.toml (the fleet build fingerprint rejects a
      # symlinked dependency file); this step fails when the two drift.
      - name: The cli toolchain pin matches cmux-tui
        working-directory: .
        run: diff <(grep -v '^#' workers/cmux-vm/cli/rust-toolchain.toml) cmux-tui/rust-toolchain.toml

      - name: Set up pinned Rust
        uses: ./.github/actions/setup-cmux-tui-rust

      - name: Cache cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && github.event_name != 'merge_group' && contains(fromJSON('["refs/heads/main","refs/heads/feat-cmux-next","refs/heads/nightly-next"]'), github.ref) }}
          # Why: docs/ci/cmux-next-workflow-notes.md#note-210 (pool runners keep different leftover toolchains)
          add-rust-environment-hash-key: false
          cache-bin: false
          workspaces: workers/cmux-vm/cli -> target

      # Formatting is a style guard: on feat-cmux-next it warns (Leo 2026-10-19).
      - name: cargo fmt
        if: ${{ !cancelled() }}
        env:
          CMUX_NEXT_STYLE_GUARDS: ${{ (github.base_ref == 'feat-cmux-next' || github.ref == 'refs/heads/feat-cmux-next') && 'warn' || 'fail' }}
        run: |
          if ! cargo fmt --all --check; then
            echo "::warning title=cmux-vm cli rustfmt::not rustfmt-clean; run cargo fmt --all in workers/cmux-vm/cli"
            [[ "$CMUX_NEXT_STYLE_GUARDS" == warn ]] || exit 1
          fi

      - name: cargo clippy
        if: ${{ !cancelled() }}
        run: python3 "$GITHUB_WORKSPACE/scripts/ci/warnings_policy.py" run -- cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: cargo test
        if: ${{ !cancelled() }}
        run: cargo test --locked --workspace

      - name: Generated client matches openapi.json
        id: regenerate
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          ./scripts/regenerate.sh
          if [[ -n "$(git status --porcelain -- .)" ]]; then
            git --no-pager diff --stat -- .
            echo "::error::the generated client (crates/cmux-vm-client/src/generated*.rs) is stale: run workers/cmux-vm/cli/scripts/regenerate.sh and commit the result"
            exit 1
          fi

      - name: Upload regenerated client
        if: ${{ failure() && steps.regenerate.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-vm-client-generated
          path: workers/cmux-vm/cli/crates/cmux-vm-client/src/generated*.rs
          retention-days: 7

      - name: No upstream provider name in the clients
        if: ${{ !cancelled() }}
        working-directory: workers/cmux-vm
        run: |
          if grep -rIil freestyle cli sdk --exclude-dir=target --exclude-dir=node_modules; then
            echo "::error::the cmux VM clients must not name the upstream provider"
            exit 1
          fi

  sdk:
    # A feat-cmux-next pull request runs this job's commands as the ci/steps.toml step `cmux-vm-sdk`
    # (pr-pipeline.yml); a push and a pull request into any other base still run them here.
    if: ${{ github.event_name != 'pull_request' || github.base_ref != 'feat-cmux-next' }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && (vars.CI_FORK_LINUX_RUNNER || 'ubuntu-24.04') || 'cmux-linux' }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: workers/cmux-vm/sdk
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
          no-cache: ${{ !startsWith(github.workspace, '/home/runner/work/') }}

      - id: install
        run: bun install --frozen-lockfile

      - name: Generated schema matches openapi.json
        id: regenerate
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          set -euo pipefail
          bun run generate
          if [[ -n "$(git status --porcelain -- .)" ]]; then
            git --no-pager diff --stat -- .
            echo "::error::src/schema.d.ts is stale: run \`bun run generate\` in workers/cmux-vm/sdk and commit the result"
            exit 1
          fi

      - name: Upload regenerated TypeScript schema
        if: ${{ failure() && steps.regenerate.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-vm-sdk-generated
          path: workers/cmux-vm/sdk/src/schema.d.ts
          retention-days: 7

      - name: Typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run typecheck
