name: macOS matrix fuzz (cmux-next)

# Nightly UI fuzz of the feat-cmux-next head on every supported macOS major
# (14 Sonoma, 15 Sequoia, 26 Tahoe) in disposable Tart VMs on the build fleet.
# The job builds the head on the fleet, then submits one class `vm` step per
# major: scripts/cmux-next/os-smoke/run.sh launches the build, runs the launch
# probe and then scripts/fuzz/macos-matrix/fuzz.py (feature tour, seeded
# random actions, palette commands, shortcuts, clicks and drags) in the same
# VM. Between the two, scripts/cmux-next/os-smoke/stress-probe.py is the lag guard: a 20x
# Cmd-T burst whose main-thread stalls exceed its budget marks the major STRESS-FAIL and fails
# this job (plans/cmux-next/sequoia-lag.md). A crash or a dead app marks the major FUZZ-FAIL and fails this job. The app reports its own crashes
# and main-thread stalls of 250 ms or more to Sentry, tagged with the OS
# version, so Sentry splits these runs by OS. The PASS/FAIL table, each major's
# fuzz counts (steps/crashes/hangs/deaths) and the probe log are in the step
# logs (`cmux-ci log ID`). Reproduce one: scripts/fuzz/macos-matrix/vm.sh.

on:
  schedule:
    - cron: "23 10 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or commit to fuzz"
        default: feat-cmux-next
      majors:
        description: "Comma-separated majors (14,15,26)"
        default: "14,15,26"

concurrency:
  group: macos-matrix-fuzz
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  fuzz:
    if: github.repository_owner == 'manaflow-ai'
    # An owned mini (CI_PR_POOL_OWNED): its tailnet tag lets it submit to the
    # build fleet. The job only submits and waits; the build and the VMs run on
    # fleet workers.
    runs-on: ${{ vars.CI_PR_POOL_OWNED == '1' && vars.CI_SIDE_LANE_RUNNER || vars.MACOS_RUNNER_26 || 'blacksmith-6vcpu-macos-26' }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref || 'feat-cmux-next' }}
          persist-credentials: false
          sparse-checkout: scripts/cmux-next/os-smoke

      - name: Fetch the fleet client from the controller
        env:
          CONTROLLER: ${{ vars.CMUX_FLEET_CONTROLLER }}
        run: |
          set -euo pipefail
          [[ -n "$CONTROLLER" ]] || { echo "::error::set the CMUX_FLEET_CONTROLLER repository variable"; exit 1; }
          client="$RUNNER_TEMP/fleet-client"
          mkdir -p "$client"
          curl -fsS -m 30 "$CONTROLLER/v1/client/manifest" -o "$client/manifest.json"
          python3 - "$client" "$CONTROLLER" <<'PY'
          import hashlib, json, sys, urllib.request
          from pathlib import Path
          root, controller = Path(sys.argv[1]), sys.argv[2]
          for name, digest in json.loads((root / "manifest.json").read_text())["files"].items():
              if "/" in name or name.startswith("."):
                  raise SystemExit(f"bad client file name {name!r}")
              data = urllib.request.urlopen(f"{controller}/v1/client/files/{name}", timeout=30).read()
              if hashlib.sha256(data).hexdigest() != digest:
                  raise SystemExit(f"{name}: sha256 mismatch")
              (root / name).write_bytes(data)
          PY

      - name: Build the head on the fleet
        id: build
        env:
          CMUX_CI_CONTROLLER: ${{ vars.CMUX_FLEET_CONTROLLER }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          client="$RUNNER_TEMP/fleet-client/ci-client.py"
          python3 "$client" build cmux --ref "$sha" --tag "fuzz-${sha:0:10}" \
            --workspace "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$sha" \
            --agent macos-matrix-fuzz --receipt "$RUNNER_TEMP/submit.json"
          job="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["id"])' "$RUNNER_TEMP/submit.json")"
          echo "job=$job" >> "$GITHUB_OUTPUT"
          # One long wait: a wait timeout leaves the job running, and resubmitting would build twice.
          python3 "$client" wait "$job" --interval 20 --timeout 9000

      - name: Fuzz each major in a Tart VM
        env:
          CMUX_CI_CONTROLLER: ${{ vars.CMUX_FLEET_CONTROLLER }}
          SHA: ${{ steps.build.outputs.sha }}
          JOB: ${{ steps.build.outputs.job }}
          MAJORS: ${{ inputs.majors || '14,15,26' }}
        run: |
          set -uo pipefail
          client="$RUNNER_TEMP/fleet-client/ci-client.py"
          status=0
          {
            echo "### macOS matrix fuzz, $SHA (fleet build $JOB)"
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          IFS=, read -r -a majors <<<"$MAJORS"
          for major in "${majors[@]}"; do
            label=$(python3 -c 'import json,sys
          print("tart-" + next(i for i in json.load(open(sys.argv[1]))["images"] if i["major"] == sys.argv[2])["digest"][7:39])' \
              scripts/cmux-next/os-smoke/images.json "$major")
            log="$RUNNER_TEMP/fuzz-$major.log"
            python3 "$client" run --class vm --script scripts/cmux-next/os-smoke/run.sh --ref "$SHA" \
              --arg=--build-job --arg="$JOB" --arg=--majors --arg="$major" --label "$label" \
              --key "matrix-fuzz-${SHA:0:12}-$major-${GITHUB_RUN_ATTEMPT}" | tee "$log" || status=1
            grep -E "^(major|$major ) " "$log" >> "$GITHUB_STEP_SUMMARY" || true
            # The smoke's PASS is the launch gate; a fuzz crash, death or lost guest shows as FUZZ-FAIL.
            if grep -q "FUZZ-FAIL" "$log"; then status=1; fi
            # The lag guard (plans/cmux-next/sequoia-lag.md): the 20x Cmd-T burst's main-thread
            # stalls over budget, or the app dead during the stress, show as STRESS-FAIL.
            grep -E "^STRESS (budget|burst) " "$log" >> "$GITHUB_STEP_SUMMARY" || true
            if grep -q "STRESS-FAIL" "$log"; then status=1; fi
          done
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
