name: cmux-next fast gates

# Four push-time checks, in fail mode, on a pull request merged with its base
# (scripts/ci/cmux_next_fast_gates.py). On 2026-10-21 four base reds landed
# through checks that only warn on a pull request or only run on push: webviews
# lint/format and switch-fetches (ci-web's react-apps-check warns on a pull
# request; `web lint (fast)` in cmux-next-web-lint.yml fails only on push), a
# self-merge past its own red defaults-snapshot, and direct pushes that tripped
# the crash ratchet. feat-cmux-next has no required checks.
#
# The job posts `cmux-next/fast-gates` on the PR head with the description
# `base <sha>`, the merge's first parent. A merger (next-autoland, gh-merge-green,
# the hq merge hook) takes it as fresh when it is success, its base is an ancestor
# of the current tip, and the commits since touch none of the PR's files and no
# check path (scripts/ci/check-paths.txt); otherwise it dispatches this workflow
# with pr=N on feat-cmux-next, which merges the PR head into the current tip and
# runs the gates again, plus the webviews checks (a check that landed after the
# PR's CI runs before it merges). A pull request that changes webviews/ runs the
# webviews checks here too (the type check among them): land-judge lands a clean
# base merge on this status without waiting for ci-web's webview suite, where
# they also run (cmux#49052, cmuxterm-hq#19108). No paths filter: every pull request gets a
# status; a draft gets it when it is marked ready (a draft cannot merge, and a
# merger that finds no status dispatches the gates). About two minutes on Linux.
# A pull request that touches no gate input (resolve's route step) gets its
# success status with no gates run.
#
# A dispatch also reruns the Rust panic ratchet (panic-ratchet) when the tip
# lowered a rust-panic-baseline.json row of a crate the PR changes since its
# merge base: cmux-tui-spec.yml's clippy job judged the PR against the old row,
# so on 2026-10-30 #28182 and #28369 landed hits over rows lowered after their
# checks ran. It lints those packages on the tip and on the merge and fails only
# on counts over the tip's row that the tip does not already reach.
#
# Pull request code never runs next to a write token: `resolve` names the head
# and base and routes the change without running any code the pull request
# changed (its route runs the router only when its blobs are the base's; a dispatch refuses a fork head
# or another base before anything is fetched; its receipt steps, which hold
# statuses: write, run the base commit's verifier copied out of git), `fast-gates`
# and `panic-ratchet` run the PR's code with contents: read only, and `post` writes
# the status from resolve's outputs and those jobs' results, never from anything
# they wrote.
on:
  # A feat-cmux-next pull request runs this from pr-router.yml (scripts/ci/pr_router.json, the same types): a head
  # the router starts nothing for (an idle or green-head base merge, head_tier's "none") starts none of these jobs,
  # and the checks read `cmux-next fast gates / <job>`. The status `cmux-next/fast-gates` is unchanged; a merger
  # that finds none dispatches this workflow as before.
  workflow_call:
    secrets:
      CMUX_BOT_APP_KEY:
        description: App key for posting the fast-gates status
        required: false
      CI_POOL_TOKEN_1:
        description: Optional CI pool token for posting the fast-gates status
        required: false
      CI_POOL_TOKEN_2:
        description: Optional CI pool token for posting the fast-gates status
        required: false
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number into feat-cmux-next, merged with the current tip and gated
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: fast-gates-${{ github.event.pull_request.number || inputs.pr }}${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'feat-cmux-next' && (github.event.action == 'labeled' && !contains(fromJSON('["full-ci","ready-to-land"]'), github.event.label.name) || github.event.action == 'unlabeled') && format('-label-{0}', github.run_id) || '' }}
  cancel-in-progress: true

env:
  # Temporary REST budget attribution: one gh-call line per GitHub API call (scripts/ci/api_call_log/env.sh, fetched at a fixed commit when the checkout has no copy).
  BASH_ENV: '$({ w="${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh"; t="${RUNNER_TEMP:-/nonexistent}/api-call-log-src"; if [ -f "$w" ]; then echo "$w"; elif [ -n "${RUNNER_TEMP:-}" ]; then if [ ! -f "$t/env.sh" ] && [ ! -e "$t.tried" ] && { [ "${RUNNER_OS:-}" = Linux ] || [ "${RUNNER_OS:-}" = macOS ]; } && [ "$(date -u +%Y%m%d%H)" -lt 2026112300 ]; then : > "$t.tried"; mkdir -p "$t.part" && for x in env.sh gh sitecustomize.py isolated.py; do curl -fsSL --max-time 5 -o "$t.part/$x" "https://raw.githubusercontent.com/manaflow-ai/cmux/27647ffd3ae838c63be28ca3e5883dcd68c34518/scripts/ci/api_call_log/$x" || break; done; [ -s "$t.part/isolated.py" ] && mv "$t.part" "$t"; fi; if [ -f "$t/env.sh" ]; then echo "$t/env.sh"; else echo unset BASH_ENV > "$t.off.sh" && echo "$t.off.sh"; fi; fi; } 2>/dev/null)'

jobs:
  resolve:
    name: resolve head and base
    # A draft is gated when it is marked ready; a dispatch always runs.
    if: ${{ (always() && !cancelled() && (github.event_name != 'pull_request' || !github.event.pull_request.draft)) && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci') || (github.event.pull_request.draft == true && (vars.CI_DRAFT_CHEAP_TIER || '1') == '0') || (github.event.pull_request.draft != true && ((contains(github.event.pull_request.labels.*.name, 'ready-to-land') && vars.CI_LAND_FULL_PER_PR == '1') || github.event.pull_request.base.ref != 'feat-cmux-next' || github.event.pull_request.head.repo.full_name != github.repository || (vars.CI_LAND_TIER || '1') == '0'))) && !(github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'feat-cmux-next' && (github.event.action == 'labeled' && !contains(fromJSON('["full-ci","ready-to-land"]'), github.event.label.name) || github.event.action == 'unlabeled')) }}
    # Fork pull requests use the same ephemeral Blacksmith lane as other
    # Linux work; this job has read-only contents permission and no secrets.
    # An explicit rerun replaces the queued run in this PR-only concurrency group.
    # A light job: the persistent cmux-linux pool on every attempt, never GitHub-hosted Ubuntu (it left light
    # jobs queued for hours, cmux#45735).
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || vars.CI_OVERFLOW_LINUX || 'cmux-linux' }}
    # Five minutes for resolve and the route, three more for the receipt steps (their own bound below).
    timeout-minutes: 8
    permissions:
      contents: read
      pull-requests: read
      # The receipt steps: the verifier reads the receipt's Fast checks run, and a valid one posts the status.
      actions: read
      statuses: write
      # The lane receipt lookup (ci_receipt.py --lane): the controller answers only this workflow's OIDC token, for the
      # audience cmux-ci-lane-receipt (cmuxterm-hq build-fleet/cmd/controller/lane_receipt.go).
      id-token: write
    outputs:
      head_sha: ${{ steps.resolve.outputs.head_sha }}
      base: ${{ steps.resolve.outputs.base }}
      post: ${{ steps.resolve.outputs.post }}
      head_tree: ${{ steps.resolve.outputs.head_tree }}
      merge_tree: ${{ steps.resolve.outputs.merge_tree }}
      fast_gates: ${{ steps.route.outputs.fast_gates }}
      # A receipt step that failed (its status post included) or ran past its bound counts as no receipt: the gates
      # run, and post writes the status.
      receipt_valid: ${{ steps.receipt-verify.outcome == 'success' && steps.receipt-post.outcome != 'failure' && steps.receipt-verify.outputs.valid || '' }}
      receipt_audit: ${{ steps.receipt-verify.outputs.audit }}
      receipt_run_url: ${{ steps.receipt-verify.outputs.run_url }}
      receipt_producer: ${{ steps.receipt-verify.outputs.producer }}
    steps:
      # A pull request's merge commit and both parents; only git reads it here.
      - name: Checkout the merge ref
        if: ${{ github.event_name == 'pull_request' && !startsWith(runner.name, 'cmux-runner-pool-') }}
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 2
          # Only the commits matter here (git rev-parse HEAD^1 and HEAD^2, and the route's diff of their trees): no
          # blobs but the router's two files in the work tree. The full tree took 44 s of this job's 48 s p50
          # (2026-11-07..11 timing records), on the fast gate's critical path ahead of the gates themselves.
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: &resolve-sparse |
            /.gitmodules
            /.github/runners.json
            /scripts/ci/fast_check_route.py
            /scripts/ci/detect_linux_guard_changes.py
            /scripts/ci/workflow_guard_groups.py
            /scripts/ci/workload_entrypoints.py
            /scripts/ci/fast-check-inputs.json

      - name: "Pool mirror: checkout the merge ref"
        if: ${{ github.event_name == 'pull_request' && startsWith(runner.name, 'cmux-runner-pool-') }}
        env:
          SHA: ${{ github.sha }}
          TOKEN: ${{ github.token }}
          SPARSE: *resolve-sparse
        # A cmux-runner-pool VM checks out from its local git mirror (/var/lib/cmux-git), not actions/checkout: that
        # action adds --filter=blob:none to any sparse checkout, and a partial fetch borrowing the mirror makes git copy
        # ~3 GB of promisor objects (60-75 s a checkout on 2026-11-25, while the pool ran a git shim that keeps the
        # filter). Unfiltered, the fetch sends only what the mirror lacks. A fresh .git each time: an earlier job's
        # partial checkout would keep its filter on every fetch. Every other runner has no mirror and uses the action.
        run: &pool-checkout |
          set -euo pipefail
          mirror=/var/lib/cmux-git/cmux.git/objects
          [[ -d "$mirror" ]] || { echo "::error::no git mirror at $mirror on this pool VM"; exit 1; }
          cd "$GITHUB_WORKSPACE"
          find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          git init -q .
          echo "$mirror" > .git/objects/info/alternates
          git config gc.auto 0
          git remote add origin "https://github.com/$GITHUB_REPOSITORY"
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          # --depth routes the fetch through the pool's git shim (the mirror path); only this command sees the token.
          # GitHub sends only keepalives while it builds a pack: abort a transfer under 1 B/s for 60 s (never
          # 1000 B/s), bound each try and try 3 times (handbook network-transfer-stalls-the-whole-job). The mirror holds
          # the objects, so this repository is complete without a failed try and a retry into it is safe.
          for try in 1 2 3; do
            if GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" \
              timeout 240 git -c http.lowSpeedLimit=1 -c http.lowSpeedTime=60 fetch --no-tags --no-recurse-submodules --depth=2 origin "+$SHA:refs/remotes/origin/checkout"; then break; fi
            [[ $try -lt 3 ]] || { echo "::error::merge ref fetch failed on all 3 tries (240 s each) on runner ${RUNNER_NAME:-unknown}"; exit 1; }
            echo "::warning::merge ref fetch failed on try $try of 3, trying again"; sleep $((try == 1 ? 5 : 15))
          done
          git config core.sparseCheckout true
          printf '%s\n' "$SPARSE" > .git/info/sparse-checkout
          git checkout -q --detach "$SHA"
          echo "checked out $(git rev-parse HEAD) from the pool mirror"

      # Runs no checked-out code: git rev-parse on the merge ref, or the GitHub API
      # on dispatch, which refuses a fork head, a closed pull request
      # or another base before the gates job fetches anything.
      - name: Resolve the head and the base
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR: ${{ inputs.pr }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          # A dispatch on the branch carries its tip at dispatch time: the base, with no REST read.
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_SHA: ${{ github.sha }}
          BRANCH: feat-cmux-next
          LANE: ${{ vars.CI_LANE_RECEIPTS }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            if [[ ! "$PR" =~ ^[0-9]{1,7}$ ]]; then
              echo "::error::pr must be a pull request number (digits only)"
              exit 1
            fi
            errors="$(mktemp)"
            gh_read() {
              local response status
              if response="$(gh api "$@" 2>"$errors")"; then
                printf '%s' "$response"
              else
                status=$?
                cat "$errors" >&2
                return "$status"
              fi
            }
            # One REST read of the pull request. When the repository's GITHUB_TOKEN REST budget is spent
            # ("API rate limit exceeded for installation"), one GraphQL read, which has its own budget,
            # answers the same fields plus the branch tip. Not a retry: no loop and no sleep, and any other
            # failure (a 5xx, a permission refusal, a GraphQL error) still fails closed. Without it a
            # dispatched run died here with no status, and next-autoland waited 45 minutes before asking
            # again (2026-10-31: 13 of 34 dispatches between 22:16Z and 22:19Z, #29724's among them).
            base=""
            if pr_fields="$(gh_read "repos/$GITHUB_REPOSITORY/pulls/$PR" \
              --jq '[.state, (.head.repo.full_name // ""), .base.ref, .head.sha, .head.ref] | @tsv')"; then
              :
            else
              status=$?
              grep -qiE 'rate limit exceeded' "$errors" || exit "$status"
              echo "::warning title=GitHub API budget::the REST budget is spent; reading #$PR and $BRANCH over GraphQL"
              # shellcheck disable=SC2016 # the GraphQL query's own $variables, not the shell's
              fields="$(gh_read graphql -F owner="${GITHUB_REPOSITORY%%/*}" -F name="${GITHUB_REPOSITORY#*/}" \
                -F number="$PR" -F branch="refs/heads/$BRANCH" -f query='
                  query($owner: String!, $name: String!, $number: Int!, $branch: String!) {
                    repository(owner: $owner, name: $name) {
                      pullRequest(number: $number) {
                        state headRefOid baseRefName headRefName headRepository { nameWithOwner }
                      }
                      ref(qualifiedName: $branch) { target { oid } }
                    }
                  }' \
                --jq '.data.repository | [(.pullRequest.state // "" | ascii_downcase),
                  (.pullRequest.headRepository.nameWithOwner // ""), (.pullRequest.baseRefName // ""),
                  (.pullRequest.headRefOid // ""), (.pullRequest.headRefName // ""), (.ref.target.oid // "")] | @tsv')" || exit $?
              IFS=$'\t' read -r state head_repo base_ref head head_ref base extra <<<"$fields"
              # The PR's merged/closed states read as merged/closed; only open goes on, as with REST.
              pr_fields="$(printf '%s\t%s\t%s\t%s\t%s' "$state" "$head_repo" "$base_ref" "$head" "$head_ref")"
              [[ -n "$base" && -z "$extra" ]] || { echo "::error::#$PR returned incomplete branch metadata from GitHub"; exit 1; }
            fi
            IFS=$'\t' read -r state head_repo base_ref head head_ref extra <<<"$pr_fields"
            if [[ -n "$extra" || -z "$state" || -z "$head_repo" || -z "$base_ref" || -z "$head" || -z "$head_ref" ]]; then
              echo "::error::#$PR returned incomplete pull request metadata from GitHub"
              exit 1
            fi
            if [[ "$head_repo" != "$GITHUB_REPOSITORY" ]]; then
              echo "::error::#$PR comes from $head_repo; dispatch gates only pull requests from $GITHUB_REPOSITORY"
              exit 1
            fi
            if [[ "$base_ref" != "$BRANCH" || "$state" != open ]]; then
              echo "::error::#$PR is $state into $base_ref; dispatch gates only open pull requests into $BRANCH"
              exit 1
            fi
            if [[ -z "$base" && "${DISPATCH_REF:-}" == "refs/heads/$BRANCH" && "${DISPATCH_SHA:-}" =~ ^[0-9a-f]{40}$ ]]; then
              # The tip the merger dispatched against; reading the branch again spent the shared REST quota.
              base=$DISPATCH_SHA
            fi
            if [[ -z "$base" ]]; then
              base="$(gh_read "repos/$GITHUB_REPOSITORY/branches/$BRANCH" --jq .commit.sha)" || exit $?
            fi
            post=true
            # A lane's head: the land-time dispatch is where a lane receipt pays (78 of 100 fast-gates runs on
            # 2026-11-26 were dispatches; on feat-cmux-next the pull request event skips the gates). Its tree is the
            # receipt's key; a dispatch has no merge ref, so the merge tree stays empty and only a receipt on an
            # older base counts (ci_receipt.py base_covers). A failed read leaves no tree, and the gates run.
            # The tree comes from git, not the REST API: the installation's REST budget was spent on every
            # dispatch from 07:08Z to 07:45Z on 2026-11-27, and a REST read of the commit missed all 12 lane heads.
            # One commit object, no trees or blobs (--filter=tree:0 --depth=1), in a throwaway repository.
            head_commit_tree() {
              local dir auth tree
              dir="$(mktemp -d)"
              git init -q --bare "$dir"
              auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
              if GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" \
                git -C "$dir" fetch -q --no-tags --no-recurse-submodules --depth=1 --filter=tree:0 \
                  "https://github.com/$GITHUB_REPOSITORY" "$1" >&2; then
                tree="$(git -C "$dir" rev-parse "$1^{tree}")"
              fi
              rm -rf "$dir"
              printf '%s' "${tree:-}"
            }
            if [[ "$head_ref" == lane/* && "${LANE:-1}" != 0 ]]; then
              if head_tree="$(head_commit_tree "$head")" && [[ "$head_tree" =~ ^[0-9a-f]{40}$ ]]; then
                { echo "head_tree=$head_tree"; echo "merge_tree="; echo "lane_dispatch=true"; } >> "$GITHUB_OUTPUT"
              else
                echo "::notice title=CI receipt::could not read #$PR's head tree; the gates run"
              fi
            fi
          else
            [[ "$(git rev-parse HEAD^2)" == "$PR_HEAD" ]] || { echo "::error::the merge ref is not on the pull request head $PR_HEAD; push again or dispatch"; exit 1; }
            head=$PR_HEAD
            base=$(git rev-parse HEAD^1)
            # The receipt steps below (a local test receipt) compare these trees.
            { echo "head_tree=$(git rev-parse 'HEAD^2^{tree}')"; echo "merge_tree=$(git rev-parse 'HEAD^{tree}')"; } >> "$GITHUB_OUTPUT"
            # A fork pull request's token cannot write statuses.
            post=false
            if [[ "$PR_REPO" == "$GITHUB_REPOSITORY" ]]; then post=true; fi
          fi
          [[ "$head" =~ ^[0-9a-f]{40}$ && "$base" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::could not resolve the head and base"; exit 1; }
          { echo "head_sha=$head"; echo "base=$base"; echo "post=$post"; } >> "$GITHUB_OUTPUT"
          echo "head $head, base $base"

      # A lane dispatch's verifier comes out of git at the base (Verify the local test receipt): only its files.
      - name: Checkout the base for the receipt verifier (lane dispatch)
        if: ${{ github.event_name == 'workflow_dispatch' && steps.resolve.outputs.lane_dispatch == 'true' && !startsWith(runner.name, 'cmux-runner-pool-') }}
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          ref: ${{ steps.resolve.outputs.base }}
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: &verifier-sparse |
            /scripts/ci/ci_receipt.py
            /scripts/ci/deadline_http.py
            /scripts/ci/cmux_next_fast_gates.py
            /scripts/ci/gh_http.py

      - name: "Pool mirror: checkout the base for the receipt verifier (lane dispatch)"
        if: ${{ github.event_name == 'workflow_dispatch' && steps.resolve.outputs.lane_dispatch == 'true' && startsWith(runner.name, 'cmux-runner-pool-') }}
        continue-on-error: true
        timeout-minutes: 2
        env:
          SHA: ${{ steps.resolve.outputs.base }}
          TOKEN: ${{ github.token }}
          SPARSE: *verifier-sparse
        run: *pool-checkout

      # Whether this pull request touches an input of any gate (scripts/ci/fast-check-inputs.json). One that touches
      # none skips the gates job before it takes a 16 vCPU runner, and post writes success at its base: every gate
      # judges only what the change adds in its inputs, so it would have passed. A dispatch (a merger's fresh gate)
      # skips this step and runs every gate; the push-time jobs each gate copies (push_cover in the map) run on the
      # feat-cmux-next push, so a miss is a fix-forward on base.
      #
      # A step here, not a job of its own: the fast-check-route job was a second runner and a second fetch of the
      # merge ref for every pull request event, about 3,600 a day at a 64 s median (2026-11-24 12-16Z timing records),
      # to write one line. Only the base's code runs: the router and its map run when their blobs are the base's
      # (a change to either routes every gate anyway, the router's SELF rule, so this step then writes nothing and
      # the gates run), and python3 -I keeps every other checked-out file off sys.path. A failure leaves the output
      # empty, and the gates run.
      - name: Route the pull request (scripts/ci/fast_check_route.py)
        id: route
        if: ${{ github.event_name == 'pull_request' }}
        continue-on-error: true
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          set -euo pipefail
          for file in scripts/ci/fast_check_route.py scripts/ci/fast-check-inputs.json; do
            if [[ "$(git rev-parse "HEAD:$file")" != "$(git rev-parse "HEAD^1:$file")" ]]; then
              echo "::notice title=fast check route::the change touches $file, so every gate runs"
              exit 0
            fi
          done
          python3 -I scripts/ci/fast_check_route.py route --workflow .github/workflows/cmux-next-fast-gates.yml --labels "$LABELS"

      # A local test receipt (scripts/ci/ci_receipt.py): a change tested locally counts as a CI pass, and the gates are
      # skipped. The receipt is a Fast checks run of the canonical `python3 scripts/ci/ci_receipt.py produce fast-gates`
      # on this head (`cmux-ci test`), which GitHub attests: no key. A valid receipt posts cmux-next/fast-gates success
      # here at once, naming the receipt's base, and the fast-gates job is skipped before it takes a runner;
      # CI_RECEIPT_AUDIT_PERCENT (default 10) of them still run in full, and a red there posts failure naming the
      # receipt and its producer. A rejected receipt runs everything.
      #
      # Only for a same-repository pull request whose body names one (`CI-Receipt: fast-gates <Fast checks run URL>`),
      # or on a `lane/` branch, where the verifier finds the passing Fast checks run of one of this pull request's
      # commits itself (ci_receipt.py discover; the lanes are who run cmux-ci, and a human's PR spends no API call on a
      # search); vars.CI_RECEIPT_DISCOVER=0 returns to the body line alone. Only where the gates would run (the route).
      #
      # Steps here, not a job of their own: the receipt job was a second runner and a second checkout for about 1,100
      # lane pull request events a day (45% of ~2,500 runs, 2026-11-23..24), each billed a whole minute for a 15 s p50,
      # to run one script. The verifier is the base commit's (resolve's base, the merge's first parent), copied out of
      # git into a directory of its own, never the pull request's: python3 -I puts no checked-out file on sys.path, and
      # the verifier adds only its own directory.
      - name: Verify the local test receipt
        id: receipt-verify
        if: ${{ ((github.event_name == 'pull_request' && steps.route.outputs.fast_gates != 'false' && github.event.pull_request.head.repo.full_name == github.repository && (contains(github.event.pull_request.body, 'CI-Receipt:') || (startsWith(github.event.pull_request.head.ref, 'lane/') && (vars.CI_RECEIPT_DISCOVER || '1') != '0'))) || (github.event_name == 'workflow_dispatch' && steps.resolve.outputs.lane_dispatch == 'true')) && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci') || (github.event.pull_request.draft == true && (vars.CI_DRAFT_CHEAP_TIER || '1') == '0') || (github.event.pull_request.draft != true && ((contains(github.event.pull_request.labels.*.name, 'ready-to-land') && vars.CI_LAND_FULL_PER_PR == '1') || github.event.pull_request.base.ref != 'feat-cmux-next' || github.event.pull_request.head.repo.full_name != github.repository || (vars.CI_LAND_TIER || '1') == '0'))) && !(github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'feat-cmux-next' && (github.event.action == 'labeled' && !contains(fromJSON('["full-ci","ready-to-land"]'), github.event.label.name) || github.event.action == 'unlabeled')) }}
        continue-on-error: true
        timeout-minutes: 5  # OIDC 20 s + lookup 60 s + head-tree and base git reads 60 s each
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DISCOVER: ${{ vars.CI_RECEIPT_DISCOVER }}
          HEAD_SHA: ${{ steps.resolve.outputs.head_sha }}
          BASE: ${{ steps.resolve.outputs.base }}
          HEAD_TREE: ${{ steps.resolve.outputs.head_tree }}
          MERGE_TREE: ${{ steps.resolve.outputs.merge_tree }}
          AUDIT_PERCENT: ${{ vars.CI_RECEIPT_AUDIT_PERCENT }}
          LANE: ${{ vars.CI_LANE_RECEIPTS }}
          RUN_URL_SELF: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          [[ "$BASE" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::no base to take the verifier from"; exit 1; }
          if ! git cat-file -e "$BASE:scripts/ci/ci_receipt.py" 2>/dev/null; then
            echo "valid=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=CI receipt::the base has no receipt verifier yet; the gates run"
            exit 0
          fi
          verifier="$RUNNER_TEMP/receipt-verifier/scripts/ci"
          mkdir -p "$verifier"
          for file in ci_receipt.py deadline_http.py cmux_next_fast_gates.py; do
            git show "$BASE:scripts/ci/$file" > "$verifier/$file"
          done
          # gh_http.py (the verifier's retried GitHub read) is copied when the base has it; a base from before it
          # has a verifier that does not import it.
          if git cat-file -e "$BASE:scripts/ci/gh_http.py" 2>/dev/null; then
            git show "$BASE:scripts/ci/gh_http.py" > "$verifier/gh_http.py"
          fi
          DISCOVER_ARGS=()
          # The base's verifier decides: one from before discover existed has no --pr.
          # A dispatch has no pull request event: only the lane lookup (no run search).
          if [[ -n "$PR_NUMBER" && "${DISCOVER:-1}" != 0 ]] && grep -q -- '"--pr"' "$verifier/ci_receipt.py"; then DISCOVER_ARGS=(--pr "$PR_NUMBER"); fi
          # A lane's own pass recorded with the controller (on unless vars.CI_LANE_RECEIPTS=0), when the base's
          # verifier knows it.
          if [[ "${LANE:-1}" != 0 ]] && grep -q -- '"--lane"' "$verifier/ci_receipt.py"; then DISCOVER_ARGS+=(--lane); fi
          python3 -I "$verifier/ci_receipt.py" verify fast-gates --repo "$GITHUB_REPOSITORY" --head "$HEAD_SHA" \
            --base "$BASE" --head-tree "$HEAD_TREE" --merge-tree "$MERGE_TREE" --audit-percent "$AUDIT_PERCENT" \
            ${DISCOVER_ARGS[@]+"${DISCOVER_ARGS[@]}"} --output "$GITHUB_OUTPUT"

      - name: Post the cmux-next/fast-gates status from the receipt
        id: receipt-post
        if: ${{ steps.receipt-verify.outcome == 'success' && steps.receipt-verify.outputs.valid == 'true' && steps.resolve.outputs.post == 'true' }}
        continue-on-error: true
        timeout-minutes: 1
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.resolve.outputs.head_sha }}
          RECEIPT_BASE: ${{ steps.receipt-verify.outputs.base }}
          RUN_URL: ${{ steps.receipt-verify.outputs.run_url }}
          PRODUCER: ${{ steps.receipt-verify.outputs.producer }}
        run: |
          set -euo pipefail
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ && "$RECEIPT_BASE" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::no head or receipt base"; exit 1; }
          description="base $RECEIPT_BASE; local receipt run ${RUN_URL##*/} by $PRODUCER"
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" -f state=success \
            -f context=cmux-next/fast-gates -f target_url="$RUN_URL" -f description="${description:0:140}" >/dev/null
          echo "cmux-next/fast-gates: success on $HEAD_SHA from $RUN_URL (base $RECEIPT_BASE)"

  fast-gates:
    name: fast gates
    needs: [resolve]
    # Skipped before it takes a runner when the change touches no gate input (resolve's route), or when a valid
    # local test receipt covers it and resolve's receipt steps posted its status (a receipt step that failed, the
    # status post included, runs everything), unless audited.
    if: ${{ (!cancelled() && needs.resolve.result == 'success' && needs.resolve.outputs.fast_gates != 'false' && (needs.resolve.outputs.receipt_valid != 'true' || needs.resolve.outputs.receipt_audit == 'true')) && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci') || (github.event.pull_request.draft == true && (vars.CI_DRAFT_CHEAP_TIER || '1') == '0') || (github.event.pull_request.draft != true && ((contains(github.event.pull_request.labels.*.name, 'ready-to-land') && vars.CI_LAND_FULL_PER_PR == '1') || github.event.pull_request.base.ref != 'feat-cmux-next' || github.event.pull_request.head.repo.full_name != github.repository || (vars.CI_LAND_TIER || '1') == '0'))) && !(github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'feat-cmux-next' && (github.event.action == 'labeled' && !contains(fromJSON('["full-ci","ready-to-land"]'), github.event.label.name) || github.event.action == 'unlabeled')) }}
    outputs:
      ratchet: ${{ steps.prepare.outputs.ratchet }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || vars.CI_OVERFLOW_LINUX || 'cmux-linux' }}
    # Dispatches took 2.5 to 7.1 min on 11-08 and 11-09; cmux#38640's web lint alone took 302 s and its webviews
    # checks ran past 10 min twice, each a stopped run with no verdict. The gates get --budget-seconds 1260 (21 min)
    # below, more than the 15 minutes the whole job had before, so a slow runner never turns a passing run red; the
    # 4 minutes left cover checkout, setup and the cache save.
    timeout-minutes: 25
    # The pull request's code runs here: no write permission of any kind.
    permissions:
      contents: read
    steps:
      # Only what the gates read: scripts/ci/fast-check-inputs.json's inputs for this job (the router skips the gates for
      # a change outside them, and tests/test_cmux_next_fast_gates.py holds this list to that file), the top-level
      # files, and scripts/ whole. Blobs come on demand (filter: blob:none) and only for these paths: the full tree
      # was 930 MB, 6,708 runner minutes a day in this step.
      #
      # Every step before the gates has its own bound (2026-11-23: 255 of these jobs sat to the 25-minute limit, about
      # 6.3k runner minutes, each in one setup step with none: a checkout fetch or a base deepen that stopped moving,
      # the GitHub cache or a node download at Freestyle's ~0.9 MB/s). A step past its bound fails the job then and
      # names itself, instead of the job idling to its limit with no verdict.
      - name: Checkout
        if: ${{ !startsWith(runner.name, 'cmux-runner-pool-') }}
        timeout-minutes: 6
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          # A pull request's merge commit and both parents. A dispatch fetches
          # the PR head and the tip itself and deepens until they meet.
          fetch-depth: 2
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: &gates-sparse |
            /*
            !/*/
            /scripts/
            /.github/
            /Packages/
            /cmux-tui/
            /webviews/
            # webviews/vite.config.ts loads the markdown host plugin, which resolves this folder: without it the
            # webviews type check fails on ENOENT before it checks a file (14 files, 6.7 MB).
            /Resources/markdown-viewer/
            /web/
            /config/vite-plus/
            /cmux-next-ios/
            /schemas/
            /release-notes/next/
            /first-party-apps/
            /Native/OptChat/
            /plans/cmux-next/
            /cmux.xcodeproj/project.pbxproj
            /tests/workflow_jobs.py
            # The egress gate (scripts/ci/egress_new_sites.py) imports these three; without them every pull request's
            # fast gates went red on ModuleNotFoundError (cmux#57582, run 45880398424).
            /tests/test_egress_gate.py
            /tests/test_outbound_hosts.py
            /tests/test_classic_cloud_routes.py
            /docs/mdm/
            /docs/ci/cmux-next-workflow-notes.md
            /docs/ci/nightly-workflow-notes.md
            /backend/apps/api/
            *.xcstrings

      - name: "Pool mirror: checkout"
        if: ${{ startsWith(runner.name, 'cmux-runner-pool-') }}
        timeout-minutes: 6
        env:
          SHA: ${{ github.sha }}
          TOKEN: ${{ github.token }}
          SPARSE: *gates-sparse
        run: *pool-checkout

      - name: Merge with the base
        id: prepare
        timeout-minutes: 8
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR: ${{ inputs.pr }}
          HEAD_SHA: ${{ needs.resolve.outputs.head_sha }}
          BASE: ${{ needs.resolve.outputs.base }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            python3 scripts/ci/cmux_next_fast_gates.py prepare --event workflow_dispatch --pr "$PR" --head "$HEAD_SHA" --base "$BASE" --output "$GITHUB_OUTPUT"
          else
            python3 scripts/ci/cmux_next_fast_gates.py prepare --event pull_request --head "$HEAD_SHA" --base "$BASE" --output "$GITHUB_OUTPUT"
          fi

      # Web lint installs node_modules only in the web folders the diff touches
      # (scripts/web_lint_prepush.py), and the webviews checks gate (a dispatch,
      # or a webviews/, catalog or spec change) installs webviews'; without either
      # none of this runs.
      - name: Restore pinned Bun 1.4.4 from the CI cache bucket
        if: ${{ steps.prepare.outputs.web == 'true' || steps.prepare.outputs.checks == 'true' }}
        shell: bash
        continue-on-error: true
        timeout-minutes: 2
        run: bash "$GITHUB_WORKSPACE/scripts/ci/toolchain-r2.sh" restore bun 1.4.4 || true

      - name: Setup Bun
        if: ${{ steps.prepare.outputs.web == 'true' || steps.prepare.outputs.checks == 'true' }}
        timeout-minutes: 4
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
          no-cache: ${{ !startsWith(github.workspace, '/home/runner/work/') || !(github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && github.event_name != 'merge_group' && contains(fromJSON('["refs/heads/main","refs/heads/feat-cmux-next","refs/heads/nightly-next"]'), github.ref)) }}

      # Why: docs/ci/cmux-next-workflow-notes/2026-11-26-bun-cache-warm.md
      - name: Is this runner's own Bun package cache warm
        id: bun-warm
        timeout-minutes: 1
        if: ${{ steps.prepare.outputs.web == 'true' || steps.prepare.outputs.checks == 'true' }}
        shell: bash
        run: |
          d="${BUN_INSTALL_CACHE_DIR:-$HOME/.bun/install/cache}"
          if [[ "${RESTORE_ON_WARM:-}" != 1 && -n "$(find "$d" -mindepth 1 -maxdepth 1 -print -quit 2>/dev/null)" ]]; then
            echo "warm=true" >> "$GITHUB_OUTPUT"
            echo "$d is already filled from this runner's earlier jobs; the cache archive is not unpacked over it"
          fi
        env:
          RESTORE_ON_WARM: ${{ vars.CI_BUN_CACHE_RESTORE_WARM }}

      - name: Use the VM runner guest Bun cache
        id: fsr-bun-cache
        timeout-minutes: 2
        if: ${{ startsWith(runner.name, 'fsr-') && (steps.prepare.outputs.web == 'true' || steps.prepare.outputs.checks == 'true') }}
        run: bash scripts/ci/fsr-bun-cache.sh check bun-web-lint webviews/bun.lock web/bun.lock cmux-tui/frontends/web/bun.lock

      # Restore only, on pull requests and dispatches alike: cmux-next-web-lint.yml's web-lint job saves this key on
      # each feat-cmux-next push. A pull request's own save was a copy of about 1.2 GB in that pull request's scope,
      # which nothing else reads and which evicts the base's caches from the 10 GB store (2026-11-22: 10.56 GB, 6.66 GB
      # of it pull request refs). A dispatch runs on feat-cmux-next's ref after pull request code (bun install
      # scripts) ran, so it never saved.
      #
      # R2 is read first: Freestyle VMs pull from GitHub at about 0.9 MB/s (cmuxterm-hq#17571), so this 710 MB restore
      # took 10 minutes there (job 137463137173, 2026-11-23: 1,145 s in all, the gates 2.5 min of it), while their
      # other egress runs at about 20 MB/s; on pool hosts hx*/hd* the same restore took 192 to 639 s, or hung until the
      # 25-minute limit (job 137476653902). 52 of the 70 fast gates jobs over 15 minutes from 03:30Z to 05:26Z that
      # day ran on Freestyle. R2 reads need no credentials (and the minis read them through their LAN cache); the
      # web-lint job saves the key there. An R2 miss falls through to the GitHub store, as before.
      - name: Restore the Bun package cache from R2
        id: bun-r2
        if: ${{ (steps.prepare.outputs.web == 'true' || steps.prepare.outputs.checks == 'true') && steps.bun-warm.outputs.warm != 'true' && steps.fsr-bun-cache.outputs.hit != 'true' }}
        timeout-minutes: 4
        continue-on-error: true
        uses: ./.github/actions/cache-restore
        env:
          CI_CACHE_R2_PUBLIC_URL: https://ci-cache-next.cmux.com
        with:
          backend: r2
          path: ~/.bun/install/cache
          key: bun-web-shared-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('web/bun.lock', 'webviews/bun.lock', 'cmux-tui/frontends/web/bun.lock', 'scripts/react-doctor/bun.lock', 'agent-chat/bun.lock', 'backend/bun.lock') }}
          restore-keys: bun-web-shared-v1-${{ runner.os }}-${{ runner.arch }}-

      # The GitHub fallback is bounded at 2 minutes; past it the gates install cold. On 2026-11-23 04:15-06:15Z a pool
      # VM restored this 710 MB cache in 22 s (median of 104; p90 30-39 s). A Freestyle VM (fsr-*) pulled it at about
      # 1 MB/s, and at 600 s the download link expired ("Server failed to authenticate the request"), so the restore
      # failed and the gates installed cold anyway: 605 s median over 84 jobs. An R2 miss on Freestyle still lands here.
      - name: Restore the Bun package cache
        id: bun-cache
        if: ${{ (steps.prepare.outputs.web == 'true' || steps.prepare.outputs.checks == 'true') && steps.bun-r2.outputs.cache-matched-key == '' && steps.bun-warm.outputs.warm != 'true' && steps.fsr-bun-cache.outputs.hit != 'true' }}
        timeout-minutes: 2
        continue-on-error: true
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.bun/install/cache
          key: bun-web-shared-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('web/bun.lock', 'webviews/bun.lock', 'cmux-tui/frontends/web/bun.lock', 'scripts/react-doctor/bun.lock', 'agent-chat/bun.lock', 'backend/bun.lock') }}
          restore-keys: bun-web-shared-v1-${{ runner.os }}-${{ runner.arch }}-

      # A restore stopped at its bound can leave a half-extracted cache. Bun would trust it, so the install
      # starts from an empty one instead.
      - name: Drop a partly restored Bun package cache
        if: ${{ steps.bun-cache.outcome == 'failure' || steps.bun-cache.outcome == 'cancelled' || steps.bun-r2.outcome == 'failure' || steps.bun-r2.outcome == 'cancelled' }}
        timeout-minutes: 1
        run: rm -rf ~/.bun/install/cache

      # `vp check` runs on Node and needs ^22.18 or ^24.11; bun still installs.
      - name: Restore pinned Node 24.22.1 from the CI cache bucket
        if: ${{ steps.prepare.outputs.web == 'true' || steps.prepare.outputs.checks == 'true' }}
        shell: bash
        continue-on-error: true
        timeout-minutes: 2
        run: bash "$GITHUB_WORKSPACE/scripts/ci/toolchain-r2.sh" restore node 24.22.1 || true

      # Node comes from the runner's tool cache, else nodejs.org (scripts/ci/ensure-setup-node.sh: sha256 checked, curl
      # bounded), not actions/setup-node: on a Freestyle VM its download from GitHub's node-versions releases took
      # 175 to 428 s, or ran into the job limit (job 137555099878, 2026-11-23), while nodejs.org is not GitHub egress.
      - name: Setup Node
        if: ${{ steps.prepare.outputs.web == 'true' || steps.prepare.outputs.checks == 'true' }}
        timeout-minutes: 3
        run: scripts/ci/ensure-setup-node.sh 24.22.1

      # prepush-gate.py downloads its pinned tools (sha256 checked) when they are missing. Restore only, from R2
      # (cmux-next-web-lint.yml's web-lint job saves this key on each feat-cmux-next push); never the GitHub store:
      # on 2026-11-22 it held 14 pull request copies (65 MB each), and this 62 MB restore took 1.5 minutes there on
      # Freestyle. A miss is the gate's own download.
      - name: Restore the pinned lint tools from R2
        id: lint-tools-r2
        timeout-minutes: 2
        continue-on-error: true
        uses: ./.github/actions/cache-restore
        env:
          CI_CACHE_R2_PUBLIC_URL: https://ci-cache-next.cmux.com
        with:
          backend: r2
          path: ~/.cache/cmux-lint-tools
          key: cmux-lint-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/cmux-next/lint-tools.lock') }}

      # This is one timing-budget step; the runner prints a named critical-path gate and writes every gate's
      # duration to the summary, so a future budget alert identifies the check that grew instead of only this step.
      - name: Fast gates on the merge (parallel independent gates)
        id: gates
        env:
          BASE: ${{ needs.resolve.outputs.base }}
          # The lint tools' release-assets API fallback (prepush-gate.py fetch) authenticates with it; unauthenticated,
          # the shared runner IPs' 60 calls an hour answer 403. The job's token is read-only (contents: read).
          GH_TOKEN: ${{ github.token }}
          WEB: ${{ steps.prepare.outputs.web }}
          CHECKS: ${{ steps.prepare.outputs.checks }}
          # Bun waits on a registry connection that stops answering with no limit of its own (2026-11-09: the web
          # lint's install sat silent on the hosted runners until this job's limit cancelled it). A connection idle
          # this long is dropped and the request retried, as scripts/ci/bun-install.sh does for the other web jobs.
          BUN_CONFIG_HTTP_IDLE_TIMEOUT: "30"
          BUN_CONFIG_HTTP_RETRY_COUNT: "5"
          # The webviews type check runs inside fixit-compile (fast_gate_webviews_checks.py): its patch names the PR
          # head, not the merge commit or the dispatch's branch tip, so the hq fixit-compile reconciler pushes it there.
          FIXIT_COMPILE_HEAD_SHA: ${{ needs.resolve.outputs.head_sha }}
        # --budget-seconds: a gate still running 21 min in is stopped and named as stalled, so the job ends with that
        # reason inside its 25-minute limit instead of being cancelled with none.
        run: python3 scripts/ci/cmux_next_fast_gates.py run --base "$BASE" --web "$WEB" --checks "$CHECKS" --budget-seconds 1260 --summary "$GITHUB_STEP_SUMMARY"

      # A type check whose every error had one safe language-service fix, and passed with them: the patch, for the
      # cmuxterm-hq fixit-compile reconciler to push onto a lane/* branch as a fixup commit (ci-oops 0a), as
      # ci-web.yml uploads its own. Without it the patch fast_gate_webviews_checks.py wrote was thrown away.
      - name: Upload the fixit-compile patch
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fixit-compile-${{ github.job }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fixit-compile
          if-no-files-found: ignore
          retention-days: 3

  # Only on a dispatch whose prepare found a lowered panic-ratchet row the PR
  # changes (cmux_next_fast_gates.py ratchet_needed). The clippy setup is
  # cmux-tui-spec.yml's clippy job's, and its cargo cache is read, never saved.
  panic-ratchet:
    name: panic ratchet (lowered baseline)
    needs: [resolve, fast-gates]
    if: ${{ (!cancelled() && needs.fast-gates.outputs.ratchet == 'true') && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci') || (github.event.pull_request.draft == true && (vars.CI_DRAFT_CHEAP_TIER || '1') == '0') || (github.event.pull_request.draft != true && ((contains(github.event.pull_request.labels.*.name, 'ready-to-land') && vars.CI_LAND_FULL_PER_PR == '1') || github.event.pull_request.base.ref != 'feat-cmux-next' || github.event.pull_request.head.repo.full_name != github.repository || (vars.CI_LAND_TIER || '1') == '0'))) && !(github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'feat-cmux-next' && (github.event.action == 'labeled' && !contains(fromJSON('["full-ci","ready-to-land"]'), github.event.label.name) || github.event.action == 'unlabeled')) }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || vars.CI_OVERFLOW_LINUX || 'cmux-linux' }}
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      GHOSTTY_ZIG_SOURCE: ghostty-next
      CMUX_GHOSTTY_SRC: ""
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Merge with the base
        env:
          PR: ${{ inputs.pr }}
          HEAD_SHA: ${{ needs.resolve.outputs.head_sha }}
          BASE: ${{ needs.resolve.outputs.base }}
        run: python3 scripts/ci/cmux_next_fast_gates.py prepare --event workflow_dispatch --pr "$PR" --head "$HEAD_SHA" --base "$BASE"

      - name: Install Linux build dependencies
        run: |
          # Skip apt when the runner image already has these (tests/test_ci_apt_skips_baked_packages.py).
          if dpkg -s clang libclang-dev pkg-config >/dev/null 2>&1; then
            echo "clang libclang-dev pkg-config: already installed"
          else
            sudo apt-get update
            sudo apt-get install -y clang libclang-dev pkg-config
          fi

      - name: Init the ghostty-next submodule (libghostty-vt for ghostty-vt-sys)
        run: bash scripts/ci/init-submodule.sh ghostty-next

      - name: Install zig
        run: ./scripts/install-zig-ci.sh

      - name: Set up pinned Rust
        uses: ./.github/actions/setup-cmux-tui-rust

      - name: Restore the cargo build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Why: docs/ci/cmux-next-workflow-notes.md#note-210 (pool runners keep different leftover toolchains)
          add-rust-environment-hash-key: false
          cache-bin: false
          workspaces: cmux-tui -> target
          shared-key: cmux-tui-pr-clippy-${{ hashFiles('cmux-tui/rust-toolchain.toml', 'cmux-tui/Cargo.lock', '.cargo/config.toml') }}
          save-if: false

      - name: Rust panic ratchet on the merge, against the tip
        env:
          BASE: ${{ needs.resolve.outputs.base }}
        run: python3 .github/scripts/cmux-tui-clippy-changed.py --repo "$GITHUB_WORKSPACE" --base "$BASE" --panic-ratchet "$RUNNER_TEMP/panic-clippy.jsonl" --compare-base

  # Writes the status from resolve's outputs and the gates jobs' results only; it
  # checks nothing out and reads nothing the gates jobs wrote. A skipped
  # panic-ratchet (nothing to rejudge) does not fail it.
  post:
    name: post cmux-next/fast-gates
    needs: [resolve, fast-gates, panic-ratchet]
    # A valid receipt posted the status itself; an audited one is judged here again by the gates.
    if: ${{ (always() && !cancelled() && needs.resolve.result == 'success' && needs.resolve.outputs.post == 'true' && (needs.resolve.outputs.receipt_valid != 'true' || needs.resolve.outputs.receipt_audit == 'true')) && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci') || (github.event.pull_request.draft == true && (vars.CI_DRAFT_CHEAP_TIER || '1') == '0') || (github.event.pull_request.draft != true && ((contains(github.event.pull_request.labels.*.name, 'ready-to-land') && vars.CI_LAND_FULL_PER_PR == '1') || github.event.pull_request.base.ref != 'feat-cmux-next' || github.event.pull_request.head.repo.full_name != github.repository || (vars.CI_LAND_TIER || '1') == '0'))) && !(github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'feat-cmux-next' && (github.event.action == 'labeled' && !contains(fromJSON('["full-ci","ready-to-land"]'), github.event.label.name) || github.event.action == 'unlabeled')) }}
    # A light job that holds a write token (statuses), so the ephemeral-only linux_4 pool on every attempt, never
    # GitHub-hosted Ubuntu (it left light jobs queued for hours, cmux#45735).
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || vars.CI_OVERFLOW_LINUX || 'cmux-linux' }}
    # 15 (the light jobs' limit): the post may wait up to POST_WAIT_SECONDS (14 min) for a spent budget's reset, only
    # when every token is spent.
    timeout-minutes: 15
    permissions:
      statuses: write
    outputs:
      state: ${{ steps.status.outputs.state }}
    steps:
      # The cmux-bot App's own REST budget, as pr-router.yml's cmux/land-tier and cmux-next.yml's same-tree statuses
      # post with. The job's GITHUB_TOKEN draws on the repository's budget, which every workflow drains: on
      # 2026-11-25 run 45554419892 judged cmux#46179 green, its post was refused for that budget and ended green,
      # and the land waited 5.3 h on "cmux-next/fast-gates: not posted yet" until a human merged past it.
      - name: Mint the status token
        id: status-token
        if: ${{ vars.CMUX_BOT_APP_ID != '' }}
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.CMUX_BOT_APP_ID }}
          private-key: ${{ secrets.CMUX_BOT_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-statuses: write
      - name: Post the cmux-next/fast-gates status
        id: status
        env:
          GH_TOKEN: ${{ github.token }}
          APP_TOKEN: ${{ steps.status-token.outputs.token }}
          # The CI pool's quota-goblin tokens (scripts/ci/ci_pool_tokens.py), each its own installation hour. A pool
          # token that cannot post (expired, or no statuses grant) is passed over, never a red.
          POOL_TOKENS: ${{ secrets.CI_POOL_TOKEN_1 }} ${{ secrets.CI_POOL_TOKEN_2 }}
          # 2026-11-26 12:39Z and 12:43Z (jobs 139914769975, 139917024944): both tokens spent, the reset 457 s away
          # and past the 8-minute bound once the first gap was spent, so the job failed and a rerun posted green; a
          # false red. The pool tokens make a spent budget rarer, and 14 min covers such a reset.
          POST_WAIT_SECONDS: '840'
          CONTEXT: cmux-next/fast-gates
          HEAD_SHA: ${{ needs.resolve.outputs.head_sha }}
          BASE: ${{ needs.resolve.outputs.base }}
          GATES: ${{ needs.fast-gates.result }}
          RATCHET: ${{ needs.panic-ratchet.result }}
          # The route (resolve) skipped the gates: the pull request touches none of their inputs.
          ROUTED_OUT: ${{ needs.resolve.outputs.fast_gates == 'false' }}
          RECEIPT_AUDIT: ${{ needs.resolve.outputs.receipt_audit }}
          RECEIPT_RUN: ${{ needs.resolve.outputs.receipt_run_url }}
          RECEIPT_PRODUCER: ${{ needs.resolve.outputs.receipt_producer }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ && "$BASE" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::no head or base sha to report"; exit 1; }
          if [[ "$ROUTED_OUT" == true && "$GATES" == skipped ]]; then
            # A verdict at this base, as a passing run would give: each gate judges only what the change adds in its
            # inputs, and the change touches none (resolve's route step summary names them). Same description, so a
            # merger judges its freshness as it does any success.
            GATES=success
            RATCHET=skipped
            echo "- gates skipped: the change touches none of their inputs (scripts/ci/fast-check-inputs.json)" >> "$GITHUB_STEP_SUMMARY"
          fi
          state=failure
          if [[ "$GATES" == success && ( "$RATCHET" == success || "$RATCHET" == skipped ) ]]; then state=success; fi
          description="base $BASE"
          # Only success and failure are verdicts. A gates job that ended any other way (cancelled or timed
          # out, skipped, abandoned because its placed runner never reported, empty, or a result this step
          # does not know) judged nothing, and so did a ratchet that ended any way but success, skipped
          # (nothing to rejudge) or failure. That posts pending with "stopped", never failure: on 2026-11-09
          # two of cmux#38640's dispatches timed out and posted failure at a fresh base, and cmux#39743's
          # abandoned gates posted failure, and every merger read each as the pull request's own red. A
          # merger sees no verdict and dispatches again. A gates failure stays a failure whatever the
          # ratchet did.
          stopped=false
          [[ "$GATES" == success || "$GATES" == failure ]] || stopped=true
          if [[ "$GATES" == success && "$RATCHET" != success && "$RATCHET" != skipped && "$RATCHET" != failure ]]; then
            stopped=true
          fi
          if [[ "$stopped" == true ]]; then
            state=pending
            description="base $BASE; stopped (gates ${GATES:-none}, ratchet ${RATCHET:-none}), no verdict"
          fi
          # A receipt audit (scripts/ci/ci_receipt.py): the gates disagree with a receipt that already posted success.
          if [[ "${RECEIPT_AUDIT:-}" == true && "$state" == failure ]]; then
            echo "::error title=CI receipt audit::the gates failed on a head whose local test receipt $RECEIPT_RUN (by $RECEIPT_PRODUCER) passed them"
            description="base $BASE; receipt audit: gates red, receipt run ${RECEIPT_RUN##*/} by $RECEIPT_PRODUCER"
            description=${description:0:140}
          fi
          # A rate-limit refusal is status-posting infrastructure, not a gate verdict, but a missing status is no
          # verdict either: nothing dispatched a fresh gate for it (cmux#46179 waited 5.3 h on one). So the post
          # goes out on the cmux-bot App's token, then the CI pool's tokens, then GITHUB_TOKEN, each its own budget;
          # when all refuse for the rate limit it waits for the soonest reset (a refused request spends nothing, and
          # reading rate_limit is free), within POST_WAIT_SECONDS. Past that the job fails, named, so a re-run of the
          # failed job posts it instead of a green run that posted nothing. Other API failures stay red at once,
          # except on a pool token, which is passed over.
          throttled='rate limit exceeded|secondary rate limit|too many requests|HTTP 429'
          deadline=$((SECONDS + ${POST_WAIT_SECONDS:-480}))
          tries=0
          while :; do
            tries=$((tries + 1))
            soonest=""
            read -r -a pool <<<"${POOL_TOKENS:-}"
            for token in "${APP_TOKEN:-}" "${pool[@]}" "$GH_TOKEN"; do
              [[ -n "$token" ]] || continue
              if response="$(GH_TOKEN="$token" gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
                -f state="$state" -f context="$CONTEXT" -f target_url="$TARGET_URL" -f description="$description" 2>&1)"; then
                echo "$CONTEXT: $state on $HEAD_SHA (base $BASE), try $tries"
                echo "state=$state" >> "${GITHUB_OUTPUT:-/dev/null}"
                exit 0
              fi
              if ! grep -qiE "$throttled" <<<"$response"; then
                is_pool=false
                for t in "${pool[@]}"; do [[ "$t" == "$token" ]] && is_pool=true; done
                if [[ "$is_pool" == true ]]; then
                  echo "::warning title=GitHub API budget::a CI pool token could not post $CONTEXT ($(head -c 160 <<<"$response" | tr '\n' ' ')); passing it over"
                  continue
                fi
                printf '%s\n' "$response" >&2
                exit 1
              fi
              # A spent primary budget names its reset; a secondary limit (budget left) waits the minimum gap.
              reset="$(GH_TOKEN="$token" gh api rate_limit --jq 'if .resources.core.remaining == 0 then .resources.core.reset else 0 end' 2>/dev/null || true)"
              [[ "$reset" =~ ^[0-9]+$ ]] || reset=0
              wait=$(( reset > 0 ? reset - $(date +%s) + 2 : 0 ))
              [[ -z "$soonest" ]] || (( wait >= soonest )) || soonest=$wait
              [[ -n "$soonest" ]] || soonest=$wait
            done
            gap=${POST_MIN_GAP_SECONDS:-30}
            (( soonest >= gap )) || soonest=$gap
            if (( SECONDS + soonest > deadline )); then
              echo "::error title=GitHub API budget::$CONTEXT ($state) was not posted on $HEAD_SHA: every token was refused for the rate limit after $tries tries and the next reset is ${soonest}s away; re-run this failed job to post it"
              echo "- $CONTEXT ($state) was not posted: the GitHub API budget was spent on every token; re-run the failed post job (a missing status is not a pass)." >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            echo "::warning title=GitHub API budget::$CONTEXT ($state) refused for the rate limit on every token (try $tries); posting again in ${soonest}s"
            sleep "$soonest"
          done

  # Head fail-fast: this head failed red of its own, so its other heavy runs are cancelled (scripts/ci/head_fail_fast.py).
  fast-gates-fail-fast:
    name: head fail-fast after fast gates
    needs: fast-gates
    if: ${{ (failure() && needs.fast-gates.result == 'failure' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && !contains(github.event.pull_request.labels.*.name, 'full-ci') && format('{0}', vars.CI_HEAD_FAIL_FAST) != '0') && !(github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'feat-cmux-next' && (github.event.action == 'labeled' && !contains(fromJSON('["full-ci","ready-to-land"]'), github.event.label.name) || github.event.action == 'unlabeled')) }}
    uses: ./.github/workflows/head-fail-fast.yml
    with:
      workflow: cmux-next-fast-gates.yml
    permissions:
      actions: write
      contents: read

  # A lane receipt that was re-run in full (an audit, or a producer in shadow): tell the controller whether the gates
  # agreed, so a lane whose green re-ran red stops counting until it agrees again (cmuxterm-hq
  # build-fleet/cmd/controller/lane_receipt.go). Best effort: a failed report changes no verdict. No checkout, no
  # repository code: an OIDC token and one POST.
  lane-receipt-audit:
    name: report the lane receipt audit
    needs: [resolve, post]
    if: ${{ always() && !cancelled() && needs.resolve.outputs.receipt_audit == 'true' && startsWith(needs.resolve.outputs.receipt_producer, 'lane:') && (needs.post.outputs.state == 'success' || needs.post.outputs.state == 'failure') }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || vars.CI_OVERFLOW_LINUX || 'cmux-linux' }}
    timeout-minutes: 3
    continue-on-error: true
    permissions:
      id-token: write
    steps:
      - name: Report the audit
        env:
          PRODUCER: ${{ needs.resolve.outputs.receipt_producer }}
          HEAD_TREE: ${{ needs.resolve.outputs.head_tree }}
          STATE: ${{ needs.post.outputs.state }}
        run: |
          set -euo pipefail
          token="$(curl -fsS --max-time 20 -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=cmux-ci-lane-receipt" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          passed=false; [[ "$STATE" == success ]] && passed=true
          body="$(python3 -c 'import json,os,sys; print(json.dumps({"op": "audit", "check": "fast-gates", "head_tree": os.environ["HEAD_TREE"], "producer": os.environ["PRODUCER"], "passed": sys.argv[1] == "true"}))' "$passed")"
          curl -fsS --max-time 20 -X POST -H "Authorization: Bearer $token" -H 'Content-Type: application/json' \
            --data "$body" https://gh-events.cmux.com/github/lane-receipt
          echo
          echo "lane receipt audit: $PRODUCER passed=$passed on head tree $HEAD_TREE"
