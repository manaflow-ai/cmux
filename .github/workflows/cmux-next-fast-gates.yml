name: cmux-next fast gates

# Four push-time checks, in fail mode, on a pull request merged with its base
# (scripts/ci/cmux_next_fast_gates.py). On 2026-10-21 four base reds landed
# through checks that only warn on a pull request or only run on push: webviews
# lint/format and switch-fetches (ci-web's react-apps-check warns on a pull
# request; `web lint (fast)` in cmux-next-web-lint.yml fails only on push), a
# self-merge past its own red defaults-snapshot, and direct pushes that tripped
# the crash ratchet. feat-cmux-next has no required checks.
#
# The job posts `cmux-next/fast-gates` on the PR head with the description
# `base <sha>`, the merge's first parent. A merger (next-autoland, gh-merge-green,
# the hq merge hook) takes it as fresh when it is success, its base is an ancestor
# of the current tip, and the commits since touch none of the PR's files and no
# check path (scripts/ci/check-paths.txt); otherwise it dispatches this workflow
# with pr=N on feat-cmux-next, which merges the PR head into the current tip and
# runs the gates again, plus the webviews checks (a check that landed after the
# PR's CI runs before it merges). No paths filter: every pull request gets a
# status; a draft gets it when it is marked ready (a draft cannot merge, and a
# merger that finds no status dispatches the gates). About two minutes on Linux.
#
# A dispatch also reruns the Rust panic ratchet (panic-ratchet) when the tip
# lowered a rust-panic-baseline.json row of a crate the PR changes since its
# merge base: cmux-tui-spec.yml's clippy job judged the PR against the old row,
# so on 2026-10-30 #28182 and #28369 landed hits over rows lowered after their
# checks ran. It lints those packages on the tip and on the merge and fails only
# on counts over the tip's row that the tip does not already reach.
#
# Pull request code never runs next to a write token: `resolve` names the head
# and base without running any checked-out code (a dispatch refuses a fork head
# or another base before anything is fetched), `fast-gates` and `panic-ratchet`
# run the PR's code with contents: read only, and `post` writes the status from
# resolve's outputs and those jobs' results, never from anything they wrote.
on:
  pull_request:
    branches: [feat-cmux-next]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number into feat-cmux-next, merged with the current tip and gated
        required: true
        type: string
      runner:
        description: Fleet or bounded Blacksmith Linux label for a rerun after a stalled fleet start
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: fast-gates-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

env:
  # Temporary REST budget attribution: one gh-call line per GitHub API call (scripts/ci/api_call_log/env.sh).
  BASH_ENV: ${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh

jobs:
  # Secretless placement bootstrap: it reads the fresh runner-state publication and
  # fails open to the existing hosted/Blacksmith route when state is stale.
  portable-placement:
    name: portable light placement
    if: ${{ vars.CI_PORTABLE_LIGHT_JOBS_OFF != '1' && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-2vcpu-ubuntu-2404' || github.run_attempt == 1 && 'ubuntu-24.04' || fromJSON(vars.RUNNER_POOLS).linux_2 }}
    timeout-minutes: 4
    permissions:
      contents: read
      actions: read
    outputs:
      linux_runner: ${{ steps.place.outputs.linux_runner }}
      linux_jobs: ${{ steps.place.outputs.linux_jobs }}
      mini_runner: ${{ steps.place.outputs.mini_runner }}
      mini_jobs: ${{ steps.place.outputs.mini_jobs }}
      placed_attempt: ${{ github.run_attempt }}
    steps:
      - name: Check out the trusted placement script
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          sparse-checkout: scripts/ci
          persist-credentials: false
      - name: Place the portable light jobs
        id: place
        continue-on-error: true
        env:
          CI_RUNNER_STATE: ${{ vars.CI_RUNNER_STATE }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          JOBS: resolve post
          # Never a mini: an owned Mac's ephemeral runner spends 20-60 s setting up and tearing down
          # ("Set up runner", "Complete runner") around these jobs' ~5 s of work. resolve placed on a mini
          # ran 41 s at p50 and 67 s at p90 against 5 s and 7 s on hosted Ubuntu (2026-11-11 timing
          # records, 27 and 224 jobs), on the fast gate's critical path. Fleet Linux, when free, still takes them.
          LINUX_ONLY: resolve post
          # Only the owned-pool rescue bot's third attempt may re-place these
          # light jobs. Other workflows and manual retries stay fail-closed.
          PORTABLE_ATTEMPT3_RESCUE: '1'
          FLEET_LINUX: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || vars.LINUX_RUNNER }}
          REQUIRE_LIVE_CAPACITY: '1'
          SIDE_LABEL: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || vars.CI_LIGHT_LANE_RUNNER || vars.CI_SIDE_LANE_RUNNER }}
          SNAPSHOT_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/portable_job_placement.py

  resolve:
    name: resolve head and base
    needs: portable-placement
    # A draft is gated when it is marked ready; a dispatch always runs.
    if: ${{ always() && !cancelled() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    # Fork pull requests use the same ephemeral Blacksmith lane as other
    # Linux work; this job has read-only contents permission and no secrets.
    # The reconciled pool admits fleet first, records a three-minute no-start
    # before overflow, and emits move receipts for queued-only rescue. Never
    # default directly to a fleet label that may have no registered workers.
    # An explicit rerun replaces the queued run in this PR-only concurrency group.
    # A declared light job (.github/runners.json hosted_light_jobs): hosted Ubuntu on attempt 1, the
    # reconciled Linux pool on a re-run (it holds no secret). On 2026-11-02 this queued on RUNNER_POOLS.linux's
    # saturated blacksmith-4vcpu-ubuntu-2404 (hundreds of jobs deep) for a few seconds of work.
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-4vcpu-ubuntu-2404' || needs.portable-placement.outputs.placed_attempt == format('{0}', github.run_attempt) && contains(needs.portable-placement.outputs.linux_jobs, ' resolve ') && needs.portable-placement.outputs.linux_runner || needs.portable-placement.outputs.placed_attempt == format('{0}', github.run_attempt) && contains(needs.portable-placement.outputs.mini_jobs, ' resolve ') && needs.portable-placement.outputs.mini_runner || github.run_attempt == 1 && 'ubuntu-24.04' || fromJSON(vars.RUNNER_POOLS).linux }}
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      head_sha: ${{ steps.resolve.outputs.head_sha }}
      base: ${{ steps.resolve.outputs.base }}
      post: ${{ steps.resolve.outputs.post }}
    steps:
      # A pull request's merge commit and both parents; only git reads it here.
      - name: Checkout the merge ref
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 2
          # Only the commits matter here (git rev-parse HEAD^1 and HEAD^2): no blobs and one small file in the
          # work tree. The full tree took 44 s of this job's 48 s p50 (2026-11-07..11 timing records), on the
          # fast gate's critical path ahead of the gates themselves.
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/runners.json

      # Runs no checked-out code: git rev-parse on the merge ref, or the GitHub API
      # on dispatch, which refuses a fork head, a closed pull request
      # or another base before the gates job fetches anything.
      - name: Resolve the head and the base
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR: ${{ inputs.pr }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          # A dispatch on the branch carries its tip at dispatch time: the base, with no REST read.
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_SHA: ${{ github.sha }}
          BRANCH: feat-cmux-next
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            if [[ ! "$PR" =~ ^[0-9]{1,7}$ ]]; then
              echo "::error::pr must be a pull request number (digits only)"
              exit 1
            fi
            errors="$(mktemp)"
            gh_read() {
              local response status
              if response="$(gh api "$@" 2>"$errors")"; then
                printf '%s' "$response"
              else
                status=$?
                cat "$errors" >&2
                return "$status"
              fi
            }
            # One REST read of the pull request. When the repository's GITHUB_TOKEN REST budget is spent
            # ("API rate limit exceeded for installation"), one GraphQL read, which has its own budget,
            # answers the same fields plus the branch tip. Not a retry: no loop and no sleep, and any other
            # failure (a 5xx, a permission refusal, a GraphQL error) still fails closed. Without it a
            # dispatched run died here with no status, and next-autoland waited 45 minutes before asking
            # again (2026-10-31: 13 of 34 dispatches between 22:16Z and 22:19Z, #29724's among them).
            base=""
            if pr_fields="$(gh_read "repos/$GITHUB_REPOSITORY/pulls/$PR" \
              --jq '[.state, (.head.repo.full_name // ""), .base.ref, .head.sha] | @tsv')"; then
              :
            else
              status=$?
              grep -qiE 'rate limit exceeded' "$errors" || exit "$status"
              echo "::warning title=GitHub API budget::the REST budget is spent; reading #$PR and $BRANCH over GraphQL"
              # shellcheck disable=SC2016 # the GraphQL query's own $variables, not the shell's
              fields="$(gh_read graphql -F owner="${GITHUB_REPOSITORY%%/*}" -F name="${GITHUB_REPOSITORY#*/}" \
                -F number="$PR" -F branch="refs/heads/$BRANCH" -f query='
                  query($owner: String!, $name: String!, $number: Int!, $branch: String!) {
                    repository(owner: $owner, name: $name) {
                      pullRequest(number: $number) {
                        state headRefOid baseRefName headRepository { nameWithOwner }
                      }
                      ref(qualifiedName: $branch) { target { oid } }
                    }
                  }' \
                --jq '.data.repository | [(.pullRequest.state // "" | ascii_downcase),
                  (.pullRequest.headRepository.nameWithOwner // ""), (.pullRequest.baseRefName // ""),
                  (.pullRequest.headRefOid // ""), (.ref.target.oid // "")] | @tsv')" || exit $?
              IFS=$'\t' read -r state head_repo base_ref head base extra <<<"$fields"
              # The PR's merged/closed states read as merged/closed; only open goes on, as with REST.
              pr_fields="$(printf '%s\t%s\t%s\t%s' "$state" "$head_repo" "$base_ref" "$head")"
              [[ -n "$base" && -z "$extra" ]] || { echo "::error::#$PR returned incomplete branch metadata from GitHub"; exit 1; }
            fi
            IFS=$'\t' read -r state head_repo base_ref head extra <<<"$pr_fields"
            if [[ -n "$extra" || -z "$state" || -z "$head_repo" || -z "$base_ref" || -z "$head" ]]; then
              echo "::error::#$PR returned incomplete pull request metadata from GitHub"
              exit 1
            fi
            if [[ "$head_repo" != "$GITHUB_REPOSITORY" ]]; then
              echo "::error::#$PR comes from $head_repo; dispatch gates only pull requests from $GITHUB_REPOSITORY"
              exit 1
            fi
            if [[ "$base_ref" != "$BRANCH" || "$state" != open ]]; then
              echo "::error::#$PR is $state into $base_ref; dispatch gates only open pull requests into $BRANCH"
              exit 1
            fi
            if [[ -z "$base" && "${DISPATCH_REF:-}" == "refs/heads/$BRANCH" && "${DISPATCH_SHA:-}" =~ ^[0-9a-f]{40}$ ]]; then
              # The tip the merger dispatched against; reading the branch again spent the shared REST quota.
              base=$DISPATCH_SHA
            fi
            if [[ -z "$base" ]]; then
              base="$(gh_read "repos/$GITHUB_REPOSITORY/branches/$BRANCH" --jq .commit.sha)" || exit $?
            fi
            post=true
          else
            [[ "$(git rev-parse HEAD^2)" == "$PR_HEAD" ]] || { echo "::error::the merge ref is not on the pull request head $PR_HEAD; push again or dispatch"; exit 1; }
            head=$PR_HEAD
            base=$(git rev-parse HEAD^1)
            # A fork pull request's token cannot write statuses.
            post=false
            if [[ "$PR_REPO" == "$GITHUB_REPOSITORY" ]]; then post=true; fi
          fi
          [[ "$head" =~ ^[0-9a-f]{40}$ && "$base" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::could not resolve the head and base"; exit 1; }
          { echo "head_sha=$head"; echo "base=$base"; echo "post=$post"; } >> "$GITHUB_OUTPUT"
          echo "head $head, base $base"

  fast-gates:
    name: fast gates
    needs: resolve
    outputs:
      ratchet: ${{ steps.prepare.outputs.ratchet }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-16vcpu-ubuntu-2404' || contains(fromJSON('["cmux-fleet-linux-x64","blacksmith-16vcpu-ubuntu-2404","blacksmith-32vcpu-ubuntu-2404"]'), inputs.runner) && inputs.runner || fromJSON(vars.RUNNER_POOLS).linux }}
    # Dispatches took 2.5 to 7.1 min on 11-08 and 11-09; cmux#38640's web lint alone took 302 s and its webviews
    # checks ran past 10 min twice, each a stopped run with no verdict. The gates get --budget-seconds 1260 (21 min)
    # below, more than the 15 minutes the whole job had before, so a slow runner never turns a passing run red; the
    # 4 minutes left cover checkout, setup and the cache save.
    timeout-minutes: 25
    # The pull request's code runs here: no write permission of any kind.
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          # A pull request's merge commit and both parents. A dispatch fetches
          # the PR head and the tip itself and deepens until they meet.
          fetch-depth: 2

      - name: Merge with the base
        id: prepare
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR: ${{ inputs.pr }}
          HEAD_SHA: ${{ needs.resolve.outputs.head_sha }}
          BASE: ${{ needs.resolve.outputs.base }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            python3 scripts/ci/cmux_next_fast_gates.py prepare --event workflow_dispatch --pr "$PR" --head "$HEAD_SHA" --base "$BASE" --output "$GITHUB_OUTPUT"
          else
            python3 scripts/ci/cmux_next_fast_gates.py prepare --event pull_request --head "$HEAD_SHA" --base "$BASE" --output "$GITHUB_OUTPUT"
          fi

      # Web lint installs node_modules only in the web folders the diff touches
      # (scripts/web_lint_prepush.py), and the webviews checks gate (a dispatch
      # only) installs webviews'; without either none of this runs.
      - name: Setup Bun
        if: ${{ steps.prepare.outputs.web == 'true' || steps.prepare.outputs.checks == 'true' }}
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"

      # A dispatch runs on feat-cmux-next's ref, so a cache it saved would sit in
      # the base branch's scope after pull request code (bun install scripts)
      # ran: a dispatch only restores.
      - name: Cache Bun package cache
        if: ${{ github.event_name == 'pull_request' && (steps.prepare.outputs.web == 'true' || steps.prepare.outputs.checks == 'true') }}
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.bun/install/cache
          key: bun-web-lint-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('webviews/bun.lock', 'web/bun.lock', 'cmux-tui/frontends/web/bun.lock') }}

      - name: Restore the Bun package cache (dispatch)
        if: ${{ github.event_name == 'workflow_dispatch' && (steps.prepare.outputs.web == 'true' || steps.prepare.outputs.checks == 'true') }}
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.bun/install/cache
          key: bun-web-lint-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('webviews/bun.lock', 'web/bun.lock', 'cmux-tui/frontends/web/bun.lock') }}

      # `vp check` runs on Node and needs ^22.18 or ^24.11; bun still installs.
      - name: Setup Node
        if: ${{ steps.prepare.outputs.web == 'true' || steps.prepare.outputs.checks == 'true' }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.22.1"

      # prepush-gate.py downloads its pinned tools (sha256 checked) once per lock.
      # A dispatch only restores them, as with the Bun cache above.
      - name: Cache the pinned lint tools
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/cmux-lint-tools
          key: cmux-lint-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/cmux-next/lint-tools.lock') }}

      - name: Restore the pinned lint tools (dispatch)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/cmux-lint-tools
          key: cmux-lint-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/cmux-next/lint-tools.lock') }}

      - name: Fast gates on the merge
        id: gates
        env:
          BASE: ${{ needs.resolve.outputs.base }}
          # The lint tools' release-assets API fallback (prepush-gate.py fetch) authenticates with it; unauthenticated,
          # the shared runner IPs' 60 calls an hour answer 403. The job's token is read-only (contents: read).
          GH_TOKEN: ${{ github.token }}
          WEB: ${{ steps.prepare.outputs.web }}
          CHECKS: ${{ steps.prepare.outputs.checks }}
          # Bun waits on a registry connection that stops answering with no limit of its own (2026-11-09: the web
          # lint's install sat silent on the hosted runners until this job's limit cancelled it). A connection idle
          # this long is dropped and the request retried, as scripts/ci/bun-install.sh does for the other web jobs.
          BUN_CONFIG_HTTP_IDLE_TIMEOUT: "30"
          BUN_CONFIG_HTTP_RETRY_COUNT: "5"
        # --budget-seconds: a gate still running 21 min in is stopped and named as stalled, so the job ends with that
        # reason inside its 25-minute limit instead of being cancelled with none.
        run: python3 scripts/ci/cmux_next_fast_gates.py run --base "$BASE" --web "$WEB" --checks "$CHECKS" --budget-seconds 1260 --summary "$GITHUB_STEP_SUMMARY"

  # Only on a dispatch whose prepare found a lowered panic-ratchet row the PR
  # changes (cmux_next_fast_gates.py ratchet_needed). The clippy setup is
  # cmux-tui-spec.yml's clippy job's, and its cargo cache is read, never saved.
  panic-ratchet:
    name: panic ratchet (lowered baseline)
    needs: [resolve, fast-gates]
    if: ${{ !cancelled() && needs.fast-gates.outputs.ratchet == 'true' }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-16vcpu-ubuntu-2404' || contains(fromJSON('["cmux-fleet-linux-x64","blacksmith-16vcpu-ubuntu-2404","blacksmith-32vcpu-ubuntu-2404"]'), inputs.runner) && inputs.runner || fromJSON(vars.RUNNER_POOLS).linux }}
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      GHOSTTY_ZIG_SOURCE: ghostty-next
      CMUX_GHOSTTY_SRC: ""
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Merge with the base
        env:
          PR: ${{ inputs.pr }}
          HEAD_SHA: ${{ needs.resolve.outputs.head_sha }}
          BASE: ${{ needs.resolve.outputs.base }}
        run: python3 scripts/ci/cmux_next_fast_gates.py prepare --event workflow_dispatch --pr "$PR" --head "$HEAD_SHA" --base "$BASE"

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev pkg-config

      - name: Init the ghostty-next submodule (libghostty-vt for ghostty-vt-sys)
        run: bash scripts/ci/init-submodule.sh ghostty-next

      - name: Install zig
        run: ./scripts/install-zig-ci.sh

      - name: Set up pinned Rust
        uses: ./.github/actions/setup-cmux-tui-rust

      - name: Restore the cargo build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          workspaces: cmux-tui -> target
          shared-key: cmux-tui-pr-clippy
          save-if: false

      - name: Rust panic ratchet on the merge, against the tip
        env:
          BASE: ${{ needs.resolve.outputs.base }}
        run: python3 .github/scripts/cmux-tui-clippy-changed.py --repo "$GITHUB_WORKSPACE" --base "$BASE" --panic-ratchet "$RUNNER_TEMP/panic-clippy.jsonl" --compare-base

  # Writes the status from resolve's outputs and the gates jobs' results only; it
  # checks nothing out and reads nothing the gates jobs wrote. A skipped
  # panic-ratchet (nothing to rejudge) does not fail it.
  post:
    name: post cmux-next/fast-gates
    needs: [resolve, fast-gates, panic-ratchet, portable-placement]
    if: ${{ always() && !cancelled() && needs.resolve.result == 'success' && needs.resolve.outputs.post == 'true' }}
    # A declared light job (.github/runners.json hosted_light_jobs): hosted Ubuntu on attempt 1, the
    # reconciled Linux pool on a re-run (it holds no secret). On 2026-11-02 this queued on RUNNER_POOLS.linux's
    # saturated blacksmith-4vcpu-ubuntu-2404 (hundreds of jobs deep) for a few seconds of work.
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-4vcpu-ubuntu-2404' || needs.portable-placement.outputs.placed_attempt == format('{0}', github.run_attempt) && contains(needs.portable-placement.outputs.linux_jobs, ' post ') && needs.portable-placement.outputs.linux_runner || needs.portable-placement.outputs.placed_attempt == format('{0}', github.run_attempt) && contains(needs.portable-placement.outputs.mini_jobs, ' post ') && needs.portable-placement.outputs.mini_runner || github.run_attempt == 1 && 'ubuntu-24.04' || fromJSON(vars.RUNNER_POOLS).linux }}
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      - name: Post the cmux-next/fast-gates status
        env:
          GH_TOKEN: ${{ github.token }}
          CONTEXT: cmux-next/fast-gates
          HEAD_SHA: ${{ needs.resolve.outputs.head_sha }}
          BASE: ${{ needs.resolve.outputs.base }}
          GATES: ${{ needs.fast-gates.result }}
          RATCHET: ${{ needs.panic-ratchet.result }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ && "$BASE" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::no head or base sha to report"; exit 1; }
          state=failure
          if [[ "$GATES" == success && ( "$RATCHET" == success || "$RATCHET" == skipped ) ]]; then state=success; fi
          description="base $BASE"
          # Only success and failure are verdicts. A gates job that ended any other way (cancelled or timed
          # out, skipped, abandoned because its placed runner never reported, empty, or a result this step
          # does not know) judged nothing, and so did a ratchet that ended any way but success, skipped
          # (nothing to rejudge) or failure. That posts pending with "stopped", never failure: on 2026-11-09
          # two of cmux#38640's dispatches timed out and posted failure at a fresh base, and cmux#39743's
          # abandoned gates posted failure, and every merger read each as the pull request's own red. A
          # merger sees no verdict and dispatches again. A gates failure stays a failure whatever the
          # ratchet did.
          stopped=false
          [[ "$GATES" == success || "$GATES" == failure ]] || stopped=true
          if [[ "$GATES" == success && "$RATCHET" != success && "$RATCHET" != skipped && "$RATCHET" != failure ]]; then
            stopped=true
          fi
          if [[ "$stopped" == true ]]; then
            state=pending
            description="base $BASE; stopped (gates ${GATES:-none}, ratchet ${RATCHET:-none}), no verdict"
          fi
          # A rate-limit refusal is status-posting infrastructure, not a gate verdict. Keep the
          # run green with a named warning; a missing status is never treated as a pass by the
          # merger, which dispatches a fresh gate when it needs one. Other API failures stay red.
          response=""
          if ! response="$(gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
            -f state="$state" -f context="$CONTEXT" -f target_url="$TARGET_URL" -f description="$description" 2>&1)"; then
            if grep -qiE 'rate limit exceeded|secondary rate limit|too many requests|HTTP 429' <<<"$response"; then
              echo "::warning title=GitHub API budget::cmux-next/fast-gates status could not be posted because the installation API budget is exhausted; the run remains advisory."
              echo "- cmux-next/fast-gates status could not be posted because the GitHub installation API budget is exhausted; a missing status is not a pass." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            printf '%s\n' "$response" >&2
            exit 1
          fi
          echo "$CONTEXT: $state on $HEAD_SHA (base $BASE)"
