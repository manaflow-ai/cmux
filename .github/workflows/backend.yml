          CLOUDFLARE_ACCOUNT_ID: 0c1675e0def6de1ab3a50a4e17dc5656
          BEFORE: ${{ github.event.before }}
        run: >-
          bun ../../../scripts/cmux-next/release/worker-release.ts verify --worker cmux-api --url https://cloud-api.cmux.dev
          --routes release-smoke.json --previous-file "$RUNNER_TEMP/cmux-api-previous-version"
          --changed-since "$BEFORE" --source-dir . --wrangler ./node_modules/.bin/wrangler
      - name: Deploy dashboard (console.cmux.dev)
        working-directory: backend/apps/dashboard
        env:
          VERCEL_PROJECT_ID: ${{ env.DASHBOARD_PROJECT_PRODUCTION }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: NITRO_PRESET=vercel bun run build && bunx vercel@58.8.0 deploy --prebuilt --prod --scope manaflow --token "$VERCEL_TOKEN"
      - name: Smoke
        run: curl -fsS https://cloud-api.cmux.dev/v1/health && curl -fsS -o /dev/null https://console.cmux.dev/

  # The Cloud journey as production's smoke (production Stack project's agent test account), test team and product team.
  # After a promote it is also the automatic rollback (no extra job: the PR job budget in ci/steps.toml only goes
  # down). The rollback signal is the model-stub journey, never the real model: on 2026-11-14 the promote of
  # 06acc4475450 (run 43635987546) had a green product and a real-model journey red on the test account's Claude
  # quota ("You've hit your weekly limit"); rolling back on that would undo a good deploy. A stub journey red after
  # cloud-journey-ci.sh's own second run, when the newest hourly stub journey on production before the promote
  # (cloud-journey-prod.yml) was green, is the promote's red: production goes back to the version that served
  # before it (prod-promote.ts rollback, as target=rollback), only while it still serves the promoted commit (the
  # 6 h spacing keeps another promote out). Later automatic promotes hold that commit and take the next newer
  # staging-proven one. Across a Durable Object lifecycle change the rollback refuses and the job fails: fix
  # forward, or target=chief-off for the Chief brain.
  journey-production:
    needs: [promote-gates, deploy-production, promote-production]
    if: ${{ (always() && (needs.deploy-production.result == 'success' || needs.promote-production.result == 'success')) && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci') || (github.event.pull_request.draft == true && (vars.CI_DRAFT_CHEAP_TIER || '1') == '0') || (github.event.pull_request.draft != true && ((contains(github.event.pull_request.labels.*.name, 'ready-to-land') && vars.CI_LAND_FULL_PER_PR == '1') || github.event.pull_request.base.ref != 'feat-cmux-next' || github.event.pull_request.head.repo.full_name != github.repository || (vars.CI_LAND_TIER || '1') == '0'))) && !(github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'feat-cmux-next' && (github.event.action == 'labeled' && !contains(fromJSON('["full-ci","ready-to-land"]'), github.event.label.name) || github.event.action == 'unlabeled')) }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-4vcpu-ubuntu-2404' || contains(fromJSON('["blacksmith-8vcpu-ubuntu-2404","blacksmith-16vcpu-ubuntu-2404","blacksmith-4vcpu-ubuntu-2404"]'), vars.LINUX_RUNNER) && vars.LINUX_RUNNER || vars.CI_CLOUD_OVERFLOW_SAVED && fromJSON(vars.RUNNER_POOLS).linux_16 || fromJSON(vars.RUNNER_POOLS).linux_8 }}
    # cmux-next-cloud-journey holds the production agent test account as CMUX_DOGFOOD_STACK_*, shadowing the
    # repository's pair (the dev Stack account, which production rejects with EMAIL_PASSWORD_MISMATCH).
    # CLAUDE_CODE_OAUTH_TOKEN (the login machine-vault-e2e.yml gives its daemons) is the journey's "pass Claude
    # login": the Mac's login copy, so a chat reply comes back.
    environment:
      name: cmux-next-cloud-journey
      deployment: false
    timeout-minutes: 50
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          # The rollback reads production's source tags as commits (prod-promote.ts): feat-cmux-next's history,
          # fetched below by scripts/ci (in this list for that).
          # backend's bun install needs its workspaces outside backend/ (clients/ts, workers/cmux-vm/sdk):
          # without them the rollback stopped at "listed in bun.lock but not on disk" (run 44764045780).
          # scripts/cmux-next/release/test/backend-sparse-checkout.test.ts keeps this list complete.
          sparse-checkout: |
            scripts/cmux-next
            scripts/ci
            Packages/macOS/CmuxNext/Sources/CmuxNextCloudCredentials
            tests/fixtures/model-stub
            backend
            clients/ts
            workers/cmux-vm/sdk
      # feat-cmux-next's history alone, not fetch-depth 0's every branch and tag (why: promote-gates).
      - name: Fetch feat-cmux-next's history without blobs
        working-directory: ${{ github.workspace }}
        run: scripts/ci/fetch_branch_history.sh feat-cmux-next
      - name: Fetch the run's own branch history too (a deploy from main)
        if: github.ref_name != 'feat-cmux-next'
        working-directory: ${{ github.workspace }}
        run: scripts/ci/fetch_branch_history.sh "$GITHUB_REF_NAME"
      - name: Restore pinned Bun 1.4.4 from the CI cache bucket
        shell: bash
        continue-on-error: true
        run: bash "$GITHUB_WORKSPACE/scripts/ci/toolchain-r2.sh" restore bun 1.4.4 || true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
          no-cache: ${{ !startsWith(github.workspace, '/home/runner/work/') || !(github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && github.event_name != 'merge_group' && contains(fromJSON('["refs/heads/main","refs/heads/feat-cmux-next","refs/heads/nightly-next"]'), github.ref)) }}
      - name: Cloud journey after the promote (model stub)
        id: stub
        if: needs.promote-production.result == 'success'
        continue-on-error: true
        env:
          CMUX_DOGFOOD_STACK_EMAIL: ${{ secrets.CMUX_DOGFOOD_STACK_EMAIL }}
          CMUX_DOGFOOD_STACK_PASSWORD: ${{ secrets.CMUX_DOGFOOD_STACK_PASSWORD }}
          PRODUCT_TEAM: ${{ vars.CMUX_JOURNEY_PRODUCT_TEAM }}
          JOURNEY_MODEL: stub
          TARGET: prod
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          bash scripts/cmux-next/cloud-journey-ci.sh
          rc=$?
          set -e
          [ "$rc" != 0 ] || exit 0
          # No test account in this environment is a config red, not the promote's.
          if [ -z "$CMUX_DOGFOOD_STACK_EMAIL" ] || [ -z "$CMUX_DOGFOOD_STACK_PASSWORD" ]; then exit "$rc"; fi
          # The baseline: the newest hourly stub journey on production that finished before this run (so before the deploy) started.
          RUN_STARTED="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .run_started_at || true)"
          [ -n "$RUN_STARTED" ] || { echo "::warning title=Cloud journey::cannot read this run's start; not rolling back"; exit "$rc"; }
          before="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/cloud-journey-prod.yml/runs?event=schedule&status=completed&per_page=10" \
            --jq "[.workflow_runs[] | select(.updated_at < \"$RUN_STARTED\")][0].id" || true)"
          stub="$( [ -n "$before" ] && gh api "repos/$GITHUB_REPOSITORY/actions/runs/$before/jobs" --jq '[.jobs[] | select(.name == "journey (stub)")][0].conclusion' || true)"
          echo "baseline: hourly stub journey run ${before:-none}: ${stub:-unknown}"
          if [ "$stub" = success ]; then echo "regressed=1" >> "$GITHUB_OUTPUT"; else echo "::warning title=Cloud journey::production's stub journey was not green before the promote (${stub:-unknown}); not rolling back"; fi
          exit "$rc"
      - name: Roll back the promote that turned the journey red
        if: always() && steps.stub.outputs.regressed == '1'
        env:
