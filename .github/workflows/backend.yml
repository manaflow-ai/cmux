# CI for the cmux-next cloud backend (backend/): typecheck, ownership invariant
# tests, catalog drift check, API Worker tests in workerd, and a per-PR preview
# Worker (`cmux-api-preview-<pr>`, development bindings, isolated DO state).
# Staging and development deploys stay manual (backend/scripts/deploy-worker.sh)
# until the coordinator decides on deploy-on-merge. Production is never deployed here.
#
# Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID (shared with other Workers),
# CMUX_NEXT_API_PREVIEW_JWT_PRIVATE_JWK (preview token signing key).

name: backend

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - backend/**
      - .github/workflows/backend.yml
  push:
    branches: [feat-cmux-next, main]
    paths:
      - backend/**
      - .github/workflows/backend.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event.action != 'closed'
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"

      # vitest-pool-workers and node:sqlite need a current Node.
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Catalog drift
        run: bun run catalog:check

      - name: Ownership invariants (OwnershipConvergence model + mutants)
        working-directory: backend/packages/ownership
        env:
          OWNERSHIP_SEEDS: "1500"
        run: bun run test

      - name: API Worker tests (workerd)
        working-directory: backend/apps/api
        run: bun run test

      - name: Wrangler dry-run build
        working-directory: backend/apps/api
        run: ./node_modules/.bin/wrangler deploy --env staging --dry-run --outdir dist

  preview:
    needs: test
    if: github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    concurrency:
      group: backend-preview-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Deploy preview Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          JWT_PRIVATE_JWK: ${{ secrets.CMUX_NEXT_API_PREVIEW_JWT_PRIVATE_JWK }}
        run: bash scripts/deploy-worker.sh "preview-${{ github.event.pull_request.number }}"

      - name: Smoke preview
        run: |
          url="https://cmux-api-preview-${{ github.event.pull_request.number }}.debussy.workers.dev"
          for i in 1 2 3 4 5 6; do
            if curl -fsS "$url/v1/health"; then echo; echo "preview: $url" >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
            sleep $((i * 5))
          done
          echo "::error::preview Worker did not answer at $url"; exit 1

  preview-cleanup:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    steps:
      - name: Delete preview Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: 0c1675e0def6de1ab3a50a4e17dc5656
        run: |
          name="cmux-api-preview-${{ github.event.pull_request.number }}"
          code=$(curl -s -o /dev/null -w '%{http_code}' -X DELETE \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT/workers/scripts/$name?force=true")
          echo "delete $name -> $code"
          [ "$code" = 200 ] || [ "$code" = 404 ]
