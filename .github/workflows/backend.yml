          CLOUDFLARE_ACCOUNT_ID: 0c1675e0def6de1ab3a50a4e17dc5656
          CANDIDATE: ${{ needs.promote-gates.outputs.candidate }}
        run: |
          [[ "$CANDIDATE" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::candidate is not a 40-hex SHA"; exit 1; }
          (cd backend && bun install --frozen-lockfile >/dev/null)
          (cd scripts/cmux-next/release && bun install --frozen-lockfile >/dev/null)
          sha="$(bun scripts/cmux-next/release/prod-promote.ts serving)"
          if [ "$sha" != "$CANDIDATE" ]; then
            echo "::warning title=cmux-api not rolled back::production serves ${sha:0:12}, not the promoted ${CANDIDATE:0:12}; nothing to undo"
            exit 1
          fi
          bun scripts/cmux-next/release/prod-promote.ts rollback --execute --wrangler backend/apps/api/node_modules/.bin/wrangler
          curl -fsS https://cloud-api.cmux.dev/v1/health
          echo "::error title=cmux-api rolled back automatically::${CANDIDATE:0:12} turned production's stub journey red (green before it); automatic promotes hold it and take the next newer staging-proven commit after the 6 h spacing."
          exit 1
      # The real-model journey proves the deploy (its verdict annotation); it never rolls back.
      - name: Cloud journey (prod)
        if: always()
        env:
          CMUX_DOGFOOD_STACK_EMAIL: ${{ secrets.CMUX_DOGFOOD_STACK_EMAIL }}
          CMUX_DOGFOOD_STACK_PASSWORD: ${{ secrets.CMUX_DOGFOOD_STACK_PASSWORD }}
          # The journey's own Claude login first: the repository's is shared by claude.yml, cloud-chat-proof and
          # every journey, and its weekly limit turned run 44764045780's after-promote reply red.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CMUX_JOURNEY_CLAUDE_CODE_OAUTH_TOKEN || secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          PRODUCT_TEAM: ${{ vars.CMUX_JOURNEY_PRODUCT_TEAM }}
          TARGET: prod
        run: bash scripts/cmux-next/cloud-journey-ci.sh

  preview-cleanup:
