name: cmux-next media

# Screenshots and a short video of each cmux-next nightly's UI changes, and of
# a pull request on demand, posted in the `tour` part of the PR's status
# comment (scripts/cmux-next/media/publish.py).
# The tour builds the merge base and head as separate tagged dev apps on an
# owned Mac's gui runner, launches each, drives them through the bundled cmux CLI
# (scripts/cmux-next/media/tour.py), and captures every affected step. Path
# mapping selects New Tab, agent-pane, or core interactions from the changed
# files. Tours are data in scripts/cmux-next/media/tours.
#
# Not a required check. It never runs on Blacksmith, whose macOS sessions sit
# at a locked screen and cannot capture: with no owned gui runner the tour
# does not run and the comment says why (scripts/ci/cmux_next_media_runner.py).
# Same-repository heads only: owned Macs run trusted code. Only the publish job
# holds the pr-media write token and the private-terms list, and it runs only
# on feat-cmux-next, in the pr-media environment (which admits only the
# protected branches): a pull
# request run's hand-off job starts a run here on feat-cmux-next with
# publish_run=<its run id>. So a pull request run, which takes this file from
# the pull request, never sees the secret: its ref cannot enter the environment.
# It gets no pr-media write token either, though anyone who can push a branch
# here could edit its jobs to ask for one; forks never reach them. The publisher
# never checks out or runs pull request code, reads the tour artifact as data
# (publish.py validates names and paths before upload), and writes only through
# .github/actions/pr-media-publish: its privacy check refuses a private name
# before the write (tesseract reads the images here; main's
# pr-media-privacy.yml rescans with Vision after the push).

# WHEN IT RUNS: the tour holds an owned Mac's gui runner (one per mini) for up
# to two hours. Run on every push of every UI pull request, it had 32 queued
# and 8 running jobs on 2026-10-14 and saturated those runners; on every push
# of a labeled pull request, and on unlabeled Swift UI a tour covered, it was
# still second in queued minutes. From 2026-10-21 (Leo: only on a merge or on
# demand, never on every pull request push) every feat-cmux-next merge toured:
# 144 tours and 3,408 Mac-minutes a day on 2026-10-26. Since 2026-10-27 (Leo:
# "GO LOOK FOR WASTE AND REDUNDANCY AND SEE WHAT WE CAN SKIP") it runs:
#   - on the nightly tip: a push to nightly-next (request-nightly-next moves it
#     to the feat-cmux-next tip it builds) that touches the UI paths tours the
#     previous nightly tip against the new one, every merge in between at
#     once. That spans many pull requests, so it comments on none; the media
#     is the run's artifact. Each tip gets its own run and is never cancelled:
#     tours run side by side in a Mac's slots (#22046). A tip that changes
#     nothing a Mac tours takes no Mac and finishes in the route job.
#   - once per `media-tour` label: the `labeled` event that adds it tours the
#     pull request's head at that moment (scripts/ci/media_auto_tour.py; never
#     with the `no-media-tour` label). A later push does not tour again, and
#     no pull request tours without the label. To tour a newer head, remove
#     and re-add the label, or run `cmux-ci capture` (stills for the
#     description, which pr-capture-check accepts).
#   - on a workflow_dispatch with base_sha: the batch queue's group tours, or
#     by hand on a branch; it posts no comment, the tour is the run's artifact.
# The route job decides; when no tour is wanted it takes no Mac and the PR
# gets no comment.
# Either way a change with nothing for a Mac to tour takes no Mac: no UI
# paths, or only webview code, whose look the gallery advisory run checks in
# Linux Chromium on the pull request (a webview-only merge gets no capture of
# its own). Native-bridge, glass and theme webview files still tour. Add the
# `media-tour-mac` label, then add (or re-add) `media-tour`, to tour a webview
# change on a Mac; `media-tour-mac` alone starts no tour.
# Classic main has no cmux-next UI, and a nightly schedule would run only
# from main's copy of this file, so neither has a tour.
on:
  # No path filter: GitHub matches a push's paths against its first 300 changed
  # files only, and a nightly tip spans many merges, so a UI change past that
  # window would start no run. The route job lists the paths on Linux and takes
  # no Mac when nothing UI changed (past the compare API's 300, the Mac maps them).
  push:
    branches: [nightly-next]
  pull_request:
    branches: [feat-cmux-next]
    # Only adding a label starts a run: no push of a pull request tours.
    types: [labeled]
    paths:
      - 'Packages/macOS/CmuxNext/Sources/**'
      - 'Packages/macOS/CmuxNext/Resources/**'
      - 'Packages/macOS/CmuxNext/Tests/**'
      - 'webviews/**'
      - 'agent-chat/**'
      - 'scripts/cmux-next/media/tours/**'
  # The batch queue tours a group's combined branch (docs/ci/cmux-next-batch.md#groups):
  # base_sha is the stack's base, so the path map takes the union of the members' tours.
  workflow_dispatch:
    inputs:
      base_sha:
        description: Commit the tour compares against (the batch stack's base); empty tours nothing
        required: false
        default: ''
      # Set only by a pull request run's hand-off job: publish that run's tour
      # from feat-cmux-next, inside the pr-media environment (see `publish`).
      publish_run:
        description: A pull request run of this workflow whose tour to publish; empty publishes nothing
        required: false
        default: ''

permissions: {}

# Adding `media-tour` shares the pull request's group, so re-adding it
# replaces the older tour. Adding `no-media-tour` joins it too, so it cancels a
# running tour. A label event for another label
# gets a group of its own, so it cancels nothing.
# Each nightly tip's run gets a group of its own. One shared merge group made every
# merge wait behind the running tour, and a newer merge then replaced the
# waiting run: 95 of 100 cancelled runs on 2026-10-20 were such zero-job
# replacements, and each replaced merge lost its tour and its PR comment.
concurrency:
  group: ${{ github.event_name == 'push' && format('cmux-next-media-merge-{0}', github.sha) || github.event_name == 'pull_request' && github.event.action == 'labeled' && (github.event.label.name == 'media-tour' || github.event.label.name == 'no-media-tour') && format('cmux-next-media-{0}', github.event.pull_request.number) || format('cmux-next-media-idle-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  route:
    name: Pick the tour runner
    if: ${{ github.repository_owner == 'manaflow-ai' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' && inputs.base_sha != '' || github.event.pull_request.head.repo.full_name == github.repository && github.event.action == 'labeled' && (github.event.label.name == 'media-tour' || github.event.label.name == 'no-media-tour')) }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-4vcpu-ubuntu-2404' || vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      runs_on: ${{ steps.pick.outputs.runs_on }}
      reason: ${{ steps.pick.outputs.reason }}
      wanted: ${{ steps.decide.outputs.wanted }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/ci/cmux_next_media_runner.py
            scripts/ci/pr_runner_pool.py
            scripts/ci/github_spend.py
            scripts/ci/media_auto_tour.py
            scripts/cmux-next/media/path_map.py
          sparse-checkout-cone-mode: false

      - name: Decide whether this pull request gets a tour
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          ACTION: ${{ github.event.action }}
          LABEL: ${{ github.event.label.name }}
          DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != pull_request ]; then
            echo "wanted=true" >> "$GITHUB_OUTPUT"
            echo "a nightly-next tip or a batch dispatch tours"
            exit 0
          fi
          # The changed paths from git, not the files API (a call per 100
          # files on every push): the event's merge commit against its first
          # parent, the base, fetched without blobs. With rename detection
          # this is the files API's `.filename` set, less a change the base
          # already carries. The files API is the fallback; it lists at most
          # 3000, and past that the label decides.
          if git fetch --no-tags --quiet --depth=2 --filter=blob:none origin "$GITHUB_SHA" \
            && git diff --name-only -z -M "$GITHUB_SHA^1" "$GITHUB_SHA" | tr '\0' '\n' > "$RUNNER_TEMP/changed.txt"; then
            echo "listed=true" >> "$GITHUB_OUTPUT"
          elif ! gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files?per_page=100" --jq '.[].filename' \
            > "$RUNNER_TEMP/changed.txt"; then
            echo "::warning::could not list the pull request's files; only the media-tour label tours"
            : > "$RUNNER_TEMP/changed.txt"
          fi
          python3 scripts/ci/media_auto_tour.py --changed "$RUNNER_TEMP/changed.txt"

      # The changed paths, read here on Linux so a change the Mac tour would
      # not capture (no UI, or only webview code, which the gallery advisory
      # run captures in Linux Chromium) never queues for a Mac. The file is
      # written only when the listing is complete; without it the picker
      # picks a Mac as before and the tour maps the paths itself.
      - name: List the changed paths
        if: ${{ steps.decide.outputs.wanted == 'true' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          # The same diff the tour maps: the pull request's base and head at
          # the event, or the push's before and after.
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          LISTED: ${{ steps.decide.outputs.listed }}
        run: |
          set -euo pipefail
          # A pull request whose merge commit the step above diffed: the same
          # diff with every rename as both paths, and no 300-file cap.
          if [ "$LISTED" = true ] && git diff --no-renames --name-only -z "$GITHUB_SHA^1" "$GITHUB_SHA" \
            | tr '\0' '\n' | sort -u > "$RUNNER_TEMP/changed-paths.txt"; then
            echo "$(wc -l < "$RUNNER_TEMP/changed-paths.txt") changed path(s)"
            exit 0
          fi
          rm -f "$RUNNER_TEMP/changed-paths.txt"
          listing="$RUNNER_TEMP/changed-files.json"
          gh api "repos/$GITHUB_REPOSITORY/compare/$BASE...$HEAD" --jq '[.files[] | {filename, previous_filename}]' > "$listing"
          python3 - "$listing" "$RUNNER_TEMP/changed-paths.txt" <<'PY'
          import json, pathlib, sys
          rows = json.loads(pathlib.Path(sys.argv[1]).read_text())
          # The compare API lists at most 300 files; past that the Mac maps the paths itself.
          if len(rows) >= 300:
              print(f"{len(rows)} changed files listed, the compare API's cap; the Mac maps the paths itself")
              sys.exit(0)
          paths = sorted({p for row in rows for p in (row.get("filename"), row.get("previous_filename")) if p})
          pathlib.Path(sys.argv[2]).write_text("\n".join(paths) + "\n")
          print(f"{len(paths)} changed path(s)")
          PY

      - name: Pick an owned gui runner
        id: pick
        if: ${{ steps.decide.outputs.wanted == 'true' }}
        env:
          POOL_OWNED: ${{ vars.CI_PR_POOL_OWNED }}
          OWNED_SLOTS: ${{ vars.CI_OWNED_POOL_SLOTS }}
          PR_XCODE_APP: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository) && vars.CMUX_CI_XCODE_APP_PR || '' }}
          # A batch dispatch (docs/ci/cmux-next-batch.md#groups) tours a branch of this repository.
          SAME_REPO: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository }}
          FORCE_MAC: ${{ contains(github.event.pull_request.labels.*.name, 'media-tour-mac') }}
        run: |
          force=()
          if [ "$FORCE_MAC" = true ]; then force=(--force-mac); fi
          python3 scripts/ci/cmux_next_media_runner.py --same-repo "$SAME_REPO" \
            --paths-file "$RUNNER_TEMP/changed-paths.txt" "${force[@]}"

  tour:
    name: Tour the app
    needs: route
    if: ${{ needs.route.outputs.runs_on != '' }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || needs.route.outputs.runs_on }}
    # Cold, a tour builds base and head from scratch: the base alone took
    # 35 min to reach its web bundles (job 115856352658). A tour builds in the
    # slot it claims on the Mac, so it reuses that slot's warm DerivedData
    # whichever pull request toured there last (scripts/ci/media_tag_lock.py).
    timeout-minutes: 120
    # actions: read finds and downloads another run's base app artifact.
    permissions:
      actions: read
      contents: read
    # is_ui tells the publish job a UI tour ran, so a capture that died before
    # writing capture-receipt.json is reported, not shown as "no media".
    outputs:
      is_ui: ${{ steps.scope.outputs.is_ui }}
      tree_note: ${{ steps.tree.outputs.note }}
    env:
      CMUX_CI_XCODE_APP: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository) && vars.CMUX_CI_XCODE_APP_PR || '' }}
      # GhosttyKit comes prebuilt; the ghostty CLI helper zig build is skipped.
      CMUX_SKIP_ZIG_BUILD: "1"
      CMUX_GHOSTTYKIT_PREPROVISIONED: "1"
      # Warm tour slots per Mac. The claim step sets TOUR_TAG to the slot's
      # tag; base and head build as ${TOUR_TAG}-base and -head, so the two
      # apps never share state or sockets. A tour past K takes an overflow
      # slot (cold, pruned once idle) rather than wait.
      CMUX_MEDIA_TOUR_SLOTS: ${{ vars.CMUX_MEDIA_TOUR_SLOTS || '2' }}
      # A nightly tour compares the previous nightly-next tip with the new one.
      BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.base_sha || github.event.before || github.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Clear stale git locks (self-hosted reused workspace)
        run: rm -f "${GITHUB_WORKSPACE:-$PWD}/.git/index.lock" 2>/dev/null || true

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive
          # Not 0: fetch-depth 0 fetches every branch's whole history into this
          # runner's reused checkout, 22k remote branches and 7.8 GiB of packs
          # on every mini (2026-10-27), against 0.6 GiB for its siblings. The
          # merge-base step below asks GitHub for the base and fetches only it.
          fetch-depth: 2

      - name: Select Xcode
        run: ./scripts/select-ci-xcode.sh

      - name: Check the tours
        run: python3 scripts/cmux-next/media/tour.py --check scripts/cmux-next/media/tours

      # BASE_SHA is the base branch tip when the event fired, which can be
      # ahead of where the pull request branched. The before app and the path
      # map use the merge base, so neither carries base changes the pull
      # request never touched. A dispatch run has BASE_SHA == HEAD_SHA.
      - name: Find the merge base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # GitHub computes it on the full history. A shallow checkout cannot:
          # where a boundary hides the real base, git merge-base can return an
          # older common ancestor without failing.
          merge_base="$(gh api "repos/$GITHUB_REPOSITORY/compare/$BASE_SHA...$HEAD_SHA" --jq .merge_base_commit.sha)"
          [[ "$merge_base" =~ ^[0-9a-f]{40}$ ]] || { echo "error: no merge base from GitHub: $merge_base" >&2; exit 1; }
          # The base app builds from it, and pin-cmux-tui.sh
          # resolve-newest-published searches its newest 50 commits.
          git fetch --no-tags --quiet --depth=60 origin "$merge_base"
          echo "MERGE_BASE=$merge_base" >> "$GITHUB_ENV"
          echo "merge base of $BASE_SHA and $HEAD_SHA: $merge_base"

      - name: Map changed UI paths to tours
        id: scope
        run: |
          set -euo pipefail
          git diff --name-only "$MERGE_BASE" "$HEAD_SHA" > "$RUNNER_TEMP/changed-paths.txt"
          python3 scripts/cmux-next/media/path_map.py --json \
            --paths-file "$RUNNER_TEMP/changed-paths.txt" > "$RUNNER_TEMP/tour-scope.json"
          python3 - "$RUNNER_TEMP/tour-scope.json" "$GITHUB_OUTPUT" <<'PY'
          import json, pathlib, sys
          data = json.loads(pathlib.Path(sys.argv[1]).read_text())
          with pathlib.Path(sys.argv[2]).open("a") as out:
              out.write(f"is_ui={'true' if data['is_ui'] else 'false'}\n")
              out.write("tours=" + ",".join(data["tours"]) + "\n")
          print(json.dumps(data, indent=2))
          PY

      - name: Check screen capture
        run: |
          set -euo pipefail
          echo "runner user: $(id -un), console user: $(stat -f %Su /dev/console)"
          system_profiler SPDisplaysDataType 2>/dev/null | sed -n '/Displays:/,$p' | head -20 || true
          if [ -f scripts/ci/preflight-e2e-screen-capture.py ]; then
            python3 scripts/ci/preflight-e2e-screen-capture.py
          fi

      # The same grant main's E2E recorder makes on these Macs
      # (.github/actions/e2e-run-tests on main): screencapture from a job
      # otherwise fails with "could not create image". Best effort; tour.py
      # probes which capture route works and reports it.
      - name: Grant screen capture to screencapture
        continue-on-error: true
        run: |
          tcc="/Library/Application Support/com.apple.TCC/TCC.db"
          sudo -n sqlite3 "$tcc" "INSERT OR REPLACE INTO access (service, client, client_type, auth_value, auth_reason, auth_version, csreq, policy_id, indirect_object_identifier_type, indirect_object_identifier, indirect_object_code_identity, flags, last_modified) VALUES ('kTCCServiceScreenCapture', '/usr/sbin/screencapture', 1, 2, 4, 1, NULL, NULL, 0, 'UNUSED', NULL, 0, $(date +%s));" \
            || echo "::warning::could not grant screen capture in the system TCC database"

      # reload.sh builds the web bundles from source (cx-vn5) with the bun
      # webviews/package.json pins; the owned Macs' shared ~/.bun holds another
      # one, so the build stopped at "the cmux-next web bundles need bun".
      - name: Setup Bun
        if: steps.scope.outputs.is_ui == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"

      # The minis share ~/.bun with workflows that install another bun; this
      # job runs on its own copy of the pinned one (private-bun.sh).
      - name: Give this job its own bun
        if: steps.scope.outputs.is_ui == 'true'
        run: scripts/cmux-next/private-bun.sh

      # The webviews app's `vp build` must run on node (build-web-bundles.sh).
      - name: Setup Node
        if: steps.scope.outputs.is_ui == 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.22.1"

      # Tours run side by side on a Mac's session runners, each capturing only
      # its own app's window. Each claims a slot of its own: its tag's
      # DerivedData, sockets and daemon session take one tour at a time, and
      # the slot's lock is held until the job's Runner.Worker exits.
      # A pull request branched before slots checks out a head whose lock
      # script cannot claim, and whose prune knows no slots; this step comes
      # from the merge ref, so it takes both from that commit and hands the
      # prune step their dir (MEDIA_CI_SCRIPTS).
      - name: Claim a tour slot on this Mac
        if: steps.scope.outputs.is_ui == 'true'
        run: |
          set -euo pipefail
          ci=scripts/ci
          if ! grep -q -- '--slots' "$ci/media_tag_lock.py" 2>/dev/null \
            || ! grep -q -- '--slots' "$ci/prune_media_derived_data.py" 2>/dev/null; then
            git fetch --no-tags origin "$GITHUB_SHA"
            ci="$RUNNER_TEMP/media-ci"
            mkdir -p "$ci"
            for script in media_tag_lock.py prune_media_derived_data.py; do
              git show "$GITHUB_SHA:scripts/ci/$script" > "$ci/$script"
            done
          fi
          echo "MEDIA_CI_SCRIPTS=$ci" >> "$GITHUB_ENV"
          python3 "$ci/media_tag_lock.py" claim --slots "$CMUX_MEDIA_TOUR_SLOTS" --github-env "$GITHUB_ENV"

      # Each side's DerivedData is about 9.5 GiB: a mini holding 8 per-PR dirs
      # failed reload.sh's 40 GiB floor (run 38614931315). Keep the K warm
      # slots' pairs and remove the rest (old per-PR dirs, idle overflow
      # slots); a dir that is open, was built within the tour timeout, or
      # whose slot a tour holds is never removed.
      - name: Bound the tour DerivedData on this Mac
        if: steps.scope.outputs.is_ui == 'true'
        continue-on-error: true
        run: |
          python3 "${MEDIA_CI_SCRIPTS:-scripts/ci}/prune_media_derived_data.py" \
            --keep-tag "${TOUR_TAG}-base" --keep-tag "${TOUR_TAG}-head" \
            --slots "${CMUX_MEDIA_TOUR_SLOTS:-2}" --keep-others 0

      # A pull request branched before these scripts checks out a head
      # without them; this step takes them from the merge ref instead.
      # MEDIA_APP_RECIPE hashes how this tour builds an app (this workflow, the
      # build scripts and their env), so a pull request
      # that changes that never shares its app with other tours.
      - name: Take the tour build scripts
        if: steps.scope.outputs.is_ui == 'true'
        run: |
          set -euo pipefail
          ci="$GITHUB_WORKSPACE/scripts/ci"
          if [ ! -f "$ci/media_app_cache.py" ] || [ ! -f "$ci/media_build_app.sh" ]; then
            git fetch --no-tags origin "$GITHUB_SHA"
            ci="$RUNNER_TEMP/media-tour-ci"
            mkdir -p "$ci"
            for script in media_app_cache.py media_build_app.sh media_module_cache_stamp.py; do
              git show "$GITHUB_SHA:scripts/ci/$script" > "$ci/$script"
            done
            chmod +x "$ci/media_build_app.sh"
          fi
          # The workflow itself comes from GITHUB_SHA (the merge ref of a pull request).
          git cat-file -e "$GITHUB_SHA^{commit}" 2>/dev/null || git fetch --no-tags origin "$GITHUB_SHA"
          recipe="$({ cat "$ci/media_build_app.sh" "$ci/media_module_cache_stamp.py"
            git show "$GITHUB_SHA:.github/workflows/cmux-next-media.yml"
            env | grep -E '^(CMUX_SKIP_ZIG_BUILD|CMUX_GHOSTTYKIT_PREPROVISIONED|CMUX_CI_XCODE_APP)=' | sort
          } | shasum -a 256 | cut -c1-12)"
          { echo "MEDIA_TOUR_CI=$ci"; echo "MEDIA_APP_RECIPE=$recipe"; } >> "$GITHUB_ENV"

      # A tour of the same pull request with the same merge base built this
      # app under this tag already (and with per-Mac tour slots, any tour in
      # the same slot number on any Mac). It is in that run's artifacts
      # (media_app_cache.py); fetching it skips the base's worktree, GhosttyKit
      # and ~6 min build. Any miss, refusal or failure builds as before.
      - name: Reuse the base app another tour built
        id: base_cache
        if: steps.scope.outputs.is_ui == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 "$MEDIA_TOUR_CI/media_app_cache.py" fetch --repo "$GITHUB_REPOSITORY" \
            --tag "${TOUR_TAG}-base" --sha "$MERGE_BASE" --recipe "$MEDIA_APP_RECIPE" \
            --dest "$HOME/Library/Developer/Xcode/DerivedData/cmux-${TOUR_TAG}-base/Build/Products/Debug" \
            --github-output "$GITHUB_OUTPUT" || echo "no reusable base app; building it"

      # The archive cache is the one glaeda CI jobs on these Macs already share
      # (ci-macos.yml): the two downloads took 2-7 min a tour without it.
      - name: Download pre-built GhosttyKit.xcframework for both revisions
        if: steps.scope.outputs.is_ui == 'true'
        env:
          GHOSTTYKIT_ARCHIVE_CACHE_DIR: /Users/Shared/cmux-build-fleet/ci/ghosttykit-archives
          BASE_APP: ${{ steps.base_cache.outputs.app }}
        run: |
          set -euo pipefail
          GHOSTTY_SHA="$(git rev-parse "$HEAD_SHA:ghostty")" ./scripts/download-prebuilt-ghosttykit.sh
          [ -z "$BASE_APP" ] || exit 0
          # The runner wipes RUNNER_TEMP between jobs but keeps the checkout's
          # .git, so the last run's base worktree stays registered and a plain
          # add fails ("missing but already registered worktree"). A job killed
          # mid-add leaves the entry locked, which prune skips: -f -f takes it.
          git worktree prune
          git worktree add -f -f --detach "$RUNNER_TEMP/cmux-next-base" "$MERGE_BASE"
          git -C "$RUNNER_TEMP/cmux-next-base" submodule update --init --recursive
          (cd "$RUNNER_TEMP/cmux-next-base" && \
            GHOSTTY_SHA="$(git rev-parse HEAD:ghostty)" ./scripts/download-prebuilt-ghosttykit.sh)

      # A merge that changes cmux-tui publishes its tree only after every
      # cmux-tui-artifacts target builds: 45 min for 6c4456b782d9 (run
      # 39311342536), and each tour based on it waited ~37 min in reload.sh.
      # When the pull request changes no cmux-tui tree input (head and base
      # share a tree) and that tree is not published yet, both apps build
      # with the newest published tree in the base's history
      # (resolve-newest-published never waits), so before and after still run
      # one daemon. The search skips commits whose daemon-capabilities.json
      # differs from the base's: the bundle checks the daemon serves every
      # capability listed there. A head that changes cmux-tui waits for its
      # own tree, so the base keeps its own too. The tour comment names a
      # stand-in. Best effort: any failure waits as before.
      - name: Use a published cmux-tui tree for an unpublished base
        id: tree
        if: steps.scope.outputs.is_ui == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          base="${RUNNER_TEMP:?}/cmux-next-base"
          [ -d "$base" ] || { echo "the base app was reused; no base tree needed"; exit 0; }
          pin=scripts/cmux-next/pin-cmux-tui.sh
          # --rev: plain key prints CMUX_TUI_TREE_KEY when the job has one.
          base_key="$(cd "$base" && "./$pin" key --rev HEAD)"
          head_key="$("./$pin" key --rev HEAD)"
          if [ "$head_key" != "$base_key" ]; then
            echo "the head changes cmux-tui ($head_key, base $base_key): both apps use their own trees"
            exit 0
          fi
          resolved="$(cd "$base" && GITHUB_STEP_SUMMARY='' CMUX_TUI_TREE_DISPATCH='' \
            CMUX_TUI_TREE_SAME_PATHS=plans/cmux-next/daemon-capabilities.json \
            "./$pin" resolve-newest-published)" || {
            echo "no published cmux-tui tree near the base; the builds wait for $base_key"; exit 0; }
          key="$(sed -n 's/^key=//p' <<<"$resolved")"
          from="$(sed -n 's/^source_commit=//p' <<<"$resolved")"
          [[ "$key" =~ ^[0-9a-f]{40}$ ]] || { echo "unexpected resolve output: $resolved"; exit 0; }
          if [ "$key" = "$base_key" ]; then
            echo "the base's own cmux-tui tree $base_key is published"
            exit 0
          fi
          { echo "BASE_TUI_TREE_KEY=$key"; echo "HEAD_TUI_TREE_KEY=$key"; } >> "$GITHUB_ENV"
          note="Both apps run cmux-tui from ${from:0:12} (tree ${key:0:12}): the merge base's own tree ${base_key:0:12} was not published yet."
          echo "$note"
          echo "note=$note" >> "$GITHUB_OUTPUT"

      # The checkout is cleaned and the base worktree recreated every run, so
      # optchat-chief built cold (~100 s) for each app; its Cargo target dir
      # stays on the Mac instead. One per runner: Cargo's lock ends before
      # build-optchat-chief.sh copies the binary out, so two tours sharing a
      # dir could ship each other's build.
      - name: Build the base app
        id: build_base
        if: steps.scope.outputs.is_ui == 'true'
        env:
          BASE_APP: ${{ steps.base_cache.outputs.app }}
        run: |
          set -euo pipefail
          if [ -n "$BASE_APP" ]; then
            echo "base_app=$BASE_APP" >> "$GITHUB_OUTPUT"
            echo "Reusing $BASE_APP"
            exit 0
          fi
          export CMUX_NEXT_OPTCHAT_CHIEF_TARGET_DIR="$HOME/Library/Caches/cmux-ci-media/optchat-chief-target/${RUNNER_NAME:?}"
          [ -z "${BASE_TUI_TREE_KEY:-}" ] || export CMUX_TUI_TREE_KEY="$BASE_TUI_TREE_KEY"
          ci="$MEDIA_TOUR_CI"
          "$ci/media_build_app.sh" "$RUNNER_TEMP/cmux-next-base" "${TOUR_TAG}-base" "$RUNNER_TEMP/reload-base.out" base_app
          # Pack it for later tours (the next step uploads it). Best effort.
          # An app built on a stand-in cmux-tui tree is not this commit's app.
          [ -z "${BASE_TUI_TREE_KEY:-}" ] || exit 0
          app="$(sed -n 's/^base_app=//p' "$GITHUB_OUTPUT" | tail -n 1)"
          if python3 "$ci/media_app_cache.py" pack --app "$app" --tag "${TOUR_TAG}-base" --sha "$MERGE_BASE" \
              --recipe "$MEDIA_APP_RECIPE" --out "$RUNNER_TEMP/media-app/app.tar"; then
            echo "artifact=$(python3 "$ci/media_app_cache.py" name --tag "${TOUR_TAG}-base" --sha "$MERGE_BASE" \
              --recipe "$MEDIA_APP_RECIPE")" >> "$GITHUB_OUTPUT"
          fi

      # Uploaded before the head builds, so a tour cancelled by a newer push
      # still leaves its base for the next one.
      - name: Share the base app with later tours
        if: steps.build_base.outputs.artifact != ''
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.build_base.outputs.artifact }}
          path: ${{ runner.temp }}/media-app/app.tar
          if-no-files-found: ignore
          compression-level: 1
          retention-days: 1

      - name: Build the head app
        id: build_head
        if: steps.scope.outputs.is_ui == 'true'
        run: |
          set -euo pipefail
          export CMUX_NEXT_OPTCHAT_CHIEF_TARGET_DIR="$HOME/Library/Caches/cmux-ci-media/optchat-chief-target/${RUNNER_NAME:?}"
          [ -z "${HEAD_TUI_TREE_KEY:-}" ] || export CMUX_TUI_TREE_KEY="$HEAD_TUI_TREE_KEY"
          ci="$MEDIA_TOUR_CI"
          "$ci/media_build_app.sh" "$GITHUB_WORKSPACE" "${TOUR_TAG}-head" "$RUNNER_TEMP/reload-head.out" head_app

      - name: Capture before and after interactions
        id: capture
        if: steps.scope.outputs.is_ui == 'true'
        continue-on-error: true
        # --fresh-state: the ci-media tag's saved workspaces would otherwise
        # carry one tour's windows into the next run on the same Mac.
        # exec: the runner signals the step's shell on cancel, and bash would
        # not pass it on, so tour.py could not stop the app and its daemon.
        run: |
          set -euo pipefail
          media_dir="${RUNNER_TEMP:?}/media"
          rm -rf "$media_dir"
          python3 scripts/cmux-next/media/capture_paths.py \
            --paths-file "$RUNNER_TEMP/changed-paths.txt" \
            --base-app "${{ steps.build_base.outputs.base_app }}" \
            --head-app "${{ steps.build_head.outputs.head_app }}" \
            --out "$media_dir" \
            --receipt "$media_dir/capture-receipt.json"

      - name: Record no-UI scope
        if: steps.scope.outputs.is_ui != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/media"
          cp "$RUNNER_TEMP/tour-scope.json" "$RUNNER_TEMP/media/capture-receipt.json"

      # Whatever happened above. A cancel can land while the app starts, after
      # tour.py's own cleanup ran: run 39199091515's chief host and acpmux
      # daemon outlived the job by days and held 10 GiB of DerivedData open on
      # cmux10s, which the prune keeps while it is open. This ends both apps'
      # daemons and every process run from either bundle. A head branched
      # before --stop takes tour.py from the run's commit.
      - name: Stop this tour's apps and daemons
        if: ${{ always() && env.TOUR_TAG != '' }}
        continue-on-error: true
        run: |
          set -uo pipefail
          tour=scripts/cmux-next/media/tour.py
          if ! grep -q -- '--stop' "$tour" 2>/dev/null; then
            git cat-file -e "$GITHUB_SHA^{commit}" 2>/dev/null || git fetch --no-tags origin "$GITHUB_SHA"
            tour="$RUNNER_TEMP/media-stop/tour.py"
            mkdir -p "${tour%/*}"
            git show "$GITHUB_SHA:scripts/cmux-next/media/tour.py" > "$tour"
          fi
          shopt -s nullglob
          args=()
          for app in "$HOME/Library/Developer/Xcode/DerivedData/cmux-${TOUR_TAG}"-{base,head}/Build/Products/*/*.app; do
            args+=(--stop "$app")
          done
          [ "${#args[@]}" -gt 0 ] || { echo "no app built under ${TOUR_TAG}; nothing to stop"; exit 0; }
          python3 "$tour" "${args[@]}"

      - name: Keep the media for the publish job
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-next-media
          path: ${{ runner.temp }}/media
          if-no-files-found: ignore
          retention-days: 3

      - name: Unregister the base worktree
        if: ${{ always() }}
        run: |
          git worktree remove -f -f "$RUNNER_TEMP/cmux-next-base" 2>/dev/null || true
          git worktree prune || true

  # A pull request run never holds the private-terms list or the pr-media write
  # token: its tour reaches the branch through a run of this workflow on
  # feat-cmux-next, which the pr-media environment admits (it holds the
  # PR_MEDIA_PRIVATE_TERMS secret and admits only main, feat-cmux-next and
  # nightly-next; a pull request run's ref, refs/pull/N/merge, is refused).
  hand-off:
    name: Hand the tour to the publisher
    needs: [route, tour]
    if: ${{ github.event_name == 'pull_request' && !cancelled() && needs.route.result == 'success' && needs.route.outputs.wanted == 'true' }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-4vcpu-ubuntu-2404' || vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 5
    # actions: write starts the publisher; nothing here can write pr-media.
    permissions:
      actions: write
    steps:
      # Data only: the publisher reads these with the tour artifact and takes the
      # pull request and its head from this run's own record, never from here.
      - name: Keep what the comment needs
        env:
          ROUTE_REASON: ${{ needs.route.outputs.reason }}
          TOUR_RESULT: ${{ needs.tour.result }}
          TOUR_IS_UI: ${{ needs.tour.outputs.is_ui }}
          TREE_NOTE: ${{ needs.tour.outputs.tree_note }}
        run: |
          python3 - "$RUNNER_TEMP/context/context.json" <<'PY'
          import json, os, pathlib, sys
          path = pathlib.Path(sys.argv[1])
          path.parent.mkdir(parents=True, exist_ok=True)
          keys = ("ROUTE_REASON", "TOUR_RESULT", "TOUR_IS_UI", "TREE_NOTE")
          path.write_text(json.dumps({key.lower(): os.environ.get(key, "") for key in keys}))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-next-media-context
          path: ${{ runner.temp }}/context/context.json
          retention-days: 3
      - name: Start the publisher on feat-cmux-next
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run cmux-next-media.yml --repo "$GITHUB_REPOSITORY" --ref feat-cmux-next \
            -f publish_run="$GITHUB_RUN_ID"
          echo "::notice::The tour is published by a cmux-next-media run on feat-cmux-next (publish_run=$GITHUB_RUN_ID)."

  publish:
    name: Post the tour media
    needs: [route, tour]
    # A pull request's tour publishes from the run its hand-off job starts. A
    # nightly tour spans many pull requests and a batch dispatch has none, so
    # neither posts: the tour's artifact is the result.
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.publish_run != '' }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-4vcpu-ubuntu-2404' || vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    # OCR of every still and of one frame per second of each video comes first.
    timeout-minutes: 30
    # The private-terms secret lives only in this environment, which admits only
    # the protected branches (main, feat-cmux-next, nightly-next).
    environment: pr-media
    # contents: write reaches the pr-media branch; main and the feature
    # branches are protected by their rulesets. actions: read downloads a
    # pull request run's tour.
    permissions:
      contents: write
      pull-requests: write
      actions: read
    steps:
      # The publisher is this protected branch's own revision; it runs no pull
      # request code and reads the tour artifact as data.
      - name: Checkout the publisher
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          # Every write goes through .github/actions/pr-media-publish and its
          # privacy check (pr_media_privacy.py, with tesseract OCR on Linux).
          sparse-checkout: |
            .github/actions/pr-media-publish
            scripts/pr-media.py
            scripts/ci/pr_status.py
            scripts/ci/pr_media_privacy.py
            scripts/ci/pr_media_gate.py
            scripts/ci/pr_media_ocr_tesseract.py
            scripts/ci/pr_media_ocr.swift
            scripts/cmux-next/media/publish.py
          sparse-checkout-cone-mode: false

      # The pull request to comment on: the one the handed-off run was for, read
      # from that run's record (publish.py posts only while that pull request's
      # head is the one given).
      - name: Find the pull request
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_RUN: ${{ inputs.publish_run }}
        run: |
          set -euo pipefail
          PR=""
          PR_HEAD=""
          case "$PUBLISH_RUN" in ''|*[!0-9]*) echo "::error::publish_run must be a run id"; exit 1 ;; esac
          # Only this workflow's run for a pull request from this repository.
          found="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PUBLISH_RUN" --jq \
            'select(.path == ".github/workflows/cmux-next-media.yml" and .event == "pull_request" and .head_repository.full_name == .repository.full_name) | "\([.pull_requests[] | select(.base.ref == "feat-cmux-next")][0].number // "")\t\(.head_sha)"')"
          if [ -z "$found" ]; then
            echo "::error::run $PUBLISH_RUN is not a cmux-next-media pull request run of this repository"
            exit 1
          fi
          PR="$(printf '%s' "$found" | cut -f1)"
          PR_HEAD="$(printf '%s' "$found" | cut -f2)"
          case "$PR" in
            ''|null|*[!0-9]*) echo "::notice::no pull request for this tour; the media stays in the run artifact"; PR="" ;;
          esac
          echo "pr=$PR" >> "$GITHUB_OUTPUT"
          echo "sha=$PR_HEAD" >> "$GITHUB_OUTPUT"

      - name: Download the pull request run's tour media
        if: ${{ inputs.publish_run != '' }}
        continue-on-error: true
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: cmux-next-media
          path: ${{ runner.temp }}/media
          run-id: ${{ inputs.publish_run }}
          github-token: ${{ github.token }}

      - name: Download the pull request run's context
        id: context_file
        if: ${{ inputs.publish_run != '' }}
        continue-on-error: true
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: cmux-next-media-context
          path: ${{ runner.temp }}/context
          run-id: ${{ inputs.publish_run }}
          github-token: ${{ github.token }}

      - name: Read the pull request run's context
        id: context
        if: ${{ inputs.publish_run != '' }}
        run: |
          python3 - "$RUNNER_TEMP/context/context.json" >> "$GITHUB_OUTPUT" <<'PY'
          import json, pathlib, sys
          path = pathlib.Path(sys.argv[1])
          data = json.loads(path.read_text()) if path.is_file() else {
              "tour_result": "skipped", "route_reason": "the pull request run's context could not be read"}
          for key in ("route_reason", "tour_result", "tour_is_ui", "tree_note"):
              # One line each: a newline in the data must not start another output.
              print(f"{key}={' '.join(str(data.get(key, '')).split())}")
          PY

      # Without ffmpeg the comment still carries the screenshots, only no
      # video, so a slow or stuck apt never holds the comment back.
      - name: Install ffmpeg
        timeout-minutes: 4
        continue-on-error: true
        env:
          DEBIAN_FRONTEND: noninteractive
        run: command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg >/dev/null)

      - name: Upload the media and update the comment
        if: ${{ steps.target.outputs.pr != '' }}
        uses: ./.github/actions/pr-media-publish
        env:
          PR: ${{ steps.target.outputs.pr }}
          HEAD_SHA: ${{ steps.target.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ inputs.publish_run || github.run_id }}
          ROUTE_REASON: ${{ steps.context.outputs.route_reason || needs.route.outputs.reason }}
          TOUR_RESULT: ${{ steps.context.outputs.tour_result || needs.tour.result }}
          TOUR_IS_UI: ${{ steps.context.outputs.tour_is_ui || needs.tour.outputs.is_ui }}
          TREE_NOTE: ${{ steps.context.outputs.tree_note || needs.tour.outputs.tree_note }}
        with:
          private-terms: ${{ secrets.PR_MEDIA_PRIVATE_TERMS }}
          agent-authors: ${{ vars.PR_MEDIA_AGENT_AUTHORS }}
          github-token: ${{ github.token }}
          command: |
            set -euo pipefail
            note=""
            receipt="$RUNNER_TEMP/media/capture-receipt.json"
            if [ -f "$receipt" ]; then
              capture_note="$(python3 - "$receipt" <<'PY'
            import json, pathlib, sys
            data = json.loads(pathlib.Path(sys.argv[1]).read_text())
            status = data.get("status", "unknown")
            tours = ", ".join(data.get("tours", [])) or "none"
            # Name only the tours (and side) that failed, not every tour that ran.
            failed = set()
            for path in pathlib.Path(sys.argv[1]).parent.glob("*/manifest.json"):
                try:
                    manifest = json.loads(path.read_text())
                    steps = [step for step in manifest.get("steps") or [] if isinstance(step, dict)]
                except (OSError, ValueError, AttributeError):
                    failed.add(path.parent.name)
                    continue
                if manifest.get("error") or manifest.get("frames_error") or not steps \
                        or any(step.get("status") == "failed" for step in steps):
                    failed.add(path.parent.name)
            if status == "recorder-failed":
                print(f"The path-selected recorder failed for {', '.join(sorted(failed)) or tours}; see the run artifact and failed manifests.")
            elif status == "no-ui-paths" and data.get("gallery"):
                print("Only webview code changed; the gallery advisory run checks it in Linux Chromium.")
            elif status == "no-ui-paths":
                print("No UI paths changed; no interaction tour was needed.")
            PY
              )"
              note="$capture_note"
            elif [ "$TOUR_IS_UI" = true ] && [ "$TOUR_RESULT" = success ]; then
              # Capture is continue-on-error, so the tour job stays green when it
              # exits before writing a receipt.
              note="The capture step failed before writing a receipt; see the run log."
            fi
            case "$TOUR_RESULT" in
              skipped) note="The tour did not run: $ROUTE_REASON. ${note}" ;;
              failure)
                if compgen -G "$RUNNER_TEMP/media/*/manifest.json" >/dev/null; then
                  note="${note:+$note }The tour failed; the failed steps are below."
                else
                  note="${note:+$note }The tour job failed before the tour ran (build or setup); the run log has the output."
                fi ;;
            esac
            note="${note:+$note }$TREE_NOTE"
            python3 scripts/cmux-next/media/publish.py --repo "$GITHUB_REPOSITORY" \
              --media "$RUNNER_TEMP/media" --pr "$PR" --sha "$HEAD_SHA" --run-url "$RUN_URL" --note "$note"
