name: cmux-next media

# Screenshots and a short video of each cmux-next UI pull request, posted in
# one sticky comment (scripts/cmux-next/media/publish.py). The tour builds the
# merge base and head as separate tagged dev apps on an owned Mac's gui runner,
# launches each, drives them through the bundled cmux CLI
# (scripts/cmux-next/media/tour.py), and captures every affected step. Path
# mapping selects New Tab, agent-pane, or core interactions from the changed
# files. Tours are data in scripts/cmux-next/media/tours.
#
# Not a required check. It never runs on Blacksmith, whose macOS sessions sit
# at a locked screen and cannot capture: with no owned gui runner the tour
# does not run and the comment says why (scripts/ci/cmux_next_media_runner.py).
# Same-repository heads only: owned Macs run trusted code, and the publish job
# holds the pr-media write token. That job never checks out or runs the pull
# request's code: its scripts come from the base revision, and it reads the
# tour artifact as data (publish.py validates names and paths before upload).
# A pull_request run still takes this file from the pull request, so the
# boundary that holds is same-repository write access: anyone who can push a
# branch here could edit these jobs, and forks never reach them.

on:
  pull_request:
    branches: [feat-cmux-next]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'Packages/macOS/CmuxNext/Sources/**'
      - 'Packages/macOS/CmuxNext/Resources/**'
      - 'Packages/macOS/CmuxNext/Tests/**'
      - 'webviews/**'
      - 'agent-chat/**'
  workflow_dispatch:

permissions: {}

concurrency:
  group: cmux-next-media-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  route:
    name: Pick the tour runner
    if: ${{ github.repository_owner == 'manaflow-ai' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-4vcpu-ubuntu-2404' || vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      runs_on: ${{ steps.pick.outputs.runs_on }}
      reason: ${{ steps.pick.outputs.reason }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/ci/cmux_next_media_runner.py
            scripts/ci/pr_runner_pool.py
          sparse-checkout-cone-mode: false

      - name: Pick an owned gui runner
        id: pick
        env:
          POOL_OWNED: ${{ vars.CI_PR_POOL_OWNED }}
          OWNED_SLOTS: ${{ vars.CI_OWNED_POOL_SLOTS }}
          PR_XCODE_APP: ${{ github.event.pull_request.head.repo.full_name == github.repository && vars.CMUX_CI_XCODE_APP_PR || '' }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: python3 scripts/ci/cmux_next_media_runner.py --same-repo "$SAME_REPO"

  tour:
    name: Tour the app
    needs: route
    if: ${{ needs.route.outputs.runs_on != '' }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || needs.route.outputs.runs_on }}
    # Cold, one PR's first tour builds base and head from scratch: the base
    # alone took 35 min to reach its web bundles (job 115856352658). Later
    # tours of the PR reuse its per-tag DerivedData.
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      CMUX_CI_XCODE_APP: ${{ github.event.pull_request.head.repo.full_name == github.repository && vars.CMUX_CI_XCODE_APP_PR || '' }}
      # GhosttyKit comes prebuilt; the ghostty CLI helper zig build is skipped.
      CMUX_SKIP_ZIG_BUILD: "1"
      CMUX_GHOSTTYKIT_PREPROVISIONED: "1"
      # One tag per PR keeps its DerivedData warm across updates; base and head
      # use separate tags so the two apps never share state or sockets.
      TOUR_TAG: ci-media-pr-${{ github.event.pull_request.number || 'manual' }}
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Clear stale git locks (self-hosted reused workspace)
        run: rm -f "${GITHUB_WORKSPACE:-$PWD}/.git/index.lock" 2>/dev/null || true

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive
          fetch-depth: 0

      - name: Select Xcode
        run: ./scripts/select-ci-xcode.sh

      - name: Check the tours
        run: python3 scripts/cmux-next/media/tour.py --check scripts/cmux-next/media/tours

      # BASE_SHA is the base branch tip when the event fired, which can be
      # ahead of where the pull request branched. The before app and the path
      # map use the merge base, so neither carries base changes the pull
      # request never touched. A dispatch run has BASE_SHA == HEAD_SHA.
      - name: Find the merge base
        run: |
          set -euo pipefail
          merge_base="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
          echo "MERGE_BASE=$merge_base" >> "$GITHUB_ENV"
          echo "merge base of $BASE_SHA and $HEAD_SHA: $merge_base"

      - name: Map changed UI paths to tours
        id: scope
        run: |
          set -euo pipefail
          git diff --name-only "$MERGE_BASE" "$HEAD_SHA" > "$RUNNER_TEMP/changed-paths.txt"
          python3 scripts/cmux-next/media/path_map.py --json \
            --paths-file "$RUNNER_TEMP/changed-paths.txt" > "$RUNNER_TEMP/tour-scope.json"
          python3 - "$RUNNER_TEMP/tour-scope.json" "$GITHUB_OUTPUT" <<'PY'
          import json, pathlib, sys
          data = json.loads(pathlib.Path(sys.argv[1]).read_text())
          with pathlib.Path(sys.argv[2]).open("a") as out:
              out.write(f"is_ui={'true' if data['is_ui'] else 'false'}\n")
              out.write("tours=" + ",".join(data["tours"]) + "\n")
          print(json.dumps(data, indent=2))
          PY

      - name: Check screen capture
        run: |
          set -euo pipefail
          echo "runner user: $(id -un), console user: $(stat -f %Su /dev/console)"
          system_profiler SPDisplaysDataType 2>/dev/null | sed -n '/Displays:/,$p' | head -20 || true
          if [ -f scripts/ci/preflight-e2e-screen-capture.py ]; then
            python3 scripts/ci/preflight-e2e-screen-capture.py
          fi

      # The same grant main's E2E recorder makes on these Macs
      # (.github/actions/e2e-run-tests on main): screencapture from a job
      # otherwise fails with "could not create image". Best effort; tour.py
      # probes which capture route works and reports it.
      - name: Grant screen capture to screencapture
        continue-on-error: true
        run: |
          tcc="/Library/Application Support/com.apple.TCC/TCC.db"
          sudo -n sqlite3 "$tcc" "INSERT OR REPLACE INTO access (service, client, client_type, auth_value, auth_reason, auth_version, csreq, policy_id, indirect_object_identifier_type, indirect_object_identifier, indirect_object_code_identity, flags, last_modified) VALUES ('kTCCServiceScreenCapture', '/usr/sbin/screencapture', 1, 2, 4, 1, NULL, NULL, 0, 'UNUSED', NULL, 0, $(date +%s));" \
            || echo "::warning::could not grant screen capture in the system TCC database"

      # reload.sh builds the web bundles from source (cx-vn5) with the bun
      # webviews/package.json pins; the owned Macs' shared ~/.bun holds another
      # one, so the build stopped at "the cmux-next web bundles need bun".
      - name: Setup Bun
        if: steps.scope.outputs.is_ui == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"

      # The minis share ~/.bun with workflows that install another bun; this
      # job runs on its own copy of the pinned one (private-bun.sh).
      - name: Give this job its own bun
        if: steps.scope.outputs.is_ui == 'true'
        run: scripts/cmux-next/private-bun.sh

      # The webviews app's `vp build` must run on node (build-web-bundles.sh).
      - name: Setup Node
        if: steps.scope.outputs.is_ui == 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.11.1"

      - name: Download pre-built GhosttyKit.xcframework for both revisions
        if: steps.scope.outputs.is_ui == 'true'
        run: |
          set -euo pipefail
          GHOSTTY_SHA="$(git rev-parse "$HEAD_SHA:ghostty")" ./scripts/download-prebuilt-ghosttykit.sh
          # The runner wipes RUNNER_TEMP between jobs but keeps the checkout's
          # .git, so the last run's base worktree stays registered and a plain
          # add fails ("missing but already registered worktree"). A job killed
          # mid-add leaves the entry locked, which prune skips: -f -f takes it.
          git worktree prune
          git worktree add -f -f --detach "$RUNNER_TEMP/cmux-next-base" "$MERGE_BASE"
          git -C "$RUNNER_TEMP/cmux-next-base" submodule update --init --recursive
          (cd "$RUNNER_TEMP/cmux-next-base" && \
            GHOSTTY_SHA="$(git rev-parse HEAD:ghostty)" ./scripts/download-prebuilt-ghosttykit.sh)

      - name: Build base and head tagged apps
        id: build
        if: steps.scope.outputs.is_ui == 'true'
        run: |
          set -euo pipefail
          build_one() {
            local dir="$1" tag="$2" log="$3" output="$4" app
            (cd "$dir" && ./scripts/reload.sh --tag "$tag" --no-global-cli-links) 2>&1 | tee "$log"
            app="$(awk '/^App path:/ { getline; sub(/^ +/, ""); print; exit }' "$log")"
            if [ -z "$app" ] || [ ! -d "$app" ]; then
              app="$(find "$HOME/Library/Developer/Xcode/DerivedData/cmux-$tag/Build/Products/Debug" -maxdepth 1 -name '*.app' -print -quit)"
            fi
            [ -d "$app" ] || { echo "::error::reload.sh built no $tag app"; return 1; }
            echo "$output=$app" >> "$GITHUB_OUTPUT"
            echo "Built $tag: $app"
          }
          build_one "$RUNNER_TEMP/cmux-next-base" "${TOUR_TAG}-base" "$RUNNER_TEMP/reload-base.out" base_app
          build_one "$GITHUB_WORKSPACE" "${TOUR_TAG}-head" "$RUNNER_TEMP/reload-head.out" head_app

      - name: Capture before and after interactions
        id: capture
        if: steps.scope.outputs.is_ui == 'true'
        continue-on-error: true
        # --fresh-state: the ci-media tag's saved workspaces would otherwise
        # carry one tour's windows into the next run on the same Mac.
        # exec: the runner signals the step's shell on cancel, and bash would
        # not pass it on, so tour.py could not stop the app and its daemon.
        run: |
          set -euo pipefail
          media_dir="${RUNNER_TEMP:?}/media"
          rm -rf "$media_dir"
          python3 scripts/cmux-next/media/capture_paths.py \
            --paths-file "$RUNNER_TEMP/changed-paths.txt" \
            --base-app "${{ steps.build.outputs.base_app }}" \
            --head-app "${{ steps.build.outputs.head_app }}" \
            --out "$media_dir" \
            --receipt "$media_dir/capture-receipt.json"

      - name: Record no-UI scope
        if: steps.scope.outputs.is_ui != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/media"
          cp "$RUNNER_TEMP/tour-scope.json" "$RUNNER_TEMP/media/capture-receipt.json"

      - name: Keep the media for the publish job
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-next-media
          path: ${{ runner.temp }}/media
          if-no-files-found: ignore
          retention-days: 3

      - name: Unregister the base worktree
        if: ${{ always() }}
        run: |
          git worktree remove -f -f "$RUNNER_TEMP/cmux-next-base" 2>/dev/null || true
          git worktree prune || true

  publish:
    name: Post the tour media
    needs: [route, tour]
    if: ${{ !cancelled() && needs.route.result == 'success' }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-4vcpu-ubuntu-2404' || vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 15
    # contents: write reaches the pr-media branch; main and the feature
    # branches are protected by their rulesets.
    permissions:
      contents: write
      pull-requests: write
    steps:
      # The publisher comes from the base revision, never the head: this job
      # holds a write token and runs no pull request code.
      - name: Checkout the publisher from the base revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          sparse-checkout: |
            scripts/pr-media.py
            scripts/cmux-next/media/publish.py
          sparse-checkout-cone-mode: false

      - name: Download the tour media
        if: ${{ needs.tour.result != 'skipped' }}
        continue-on-error: true
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: cmux-next-media
          path: ${{ runner.temp }}/media

      - name: Check for a publisher in the base revision
        id: publisher
        run: |
          if [ -f scripts/cmux-next/media/publish.py ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::The base revision has no cmux-next media publisher yet; the media stays in the run artifact."
          fi

      # Without ffmpeg the comment still carries the screenshots, only no
      # video, so a slow or stuck apt never holds the comment back.
      - name: Install ffmpeg
        if: ${{ steps.publisher.outputs.present == 'true' }}
        timeout-minutes: 4
        continue-on-error: true
        env:
          DEBIAN_FRONTEND: noninteractive
        run: command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg >/dev/null)

      - name: Upload the media and update the comment
        if: ${{ steps.publisher.outputs.present == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ROUTE_REASON: ${{ needs.route.outputs.reason }}
          TOUR_RESULT: ${{ needs.tour.result }}
        run: |
          set -euo pipefail
          note=""
          receipt="$RUNNER_TEMP/media/capture-receipt.json"
          if [ -f "$receipt" ]; then
            capture_note="$(python3 - "$receipt" <<'PY'
          import json, pathlib, sys
          data = json.loads(pathlib.Path(sys.argv[1]).read_text())
          status = data.get("status", "unknown")
          tours = ", ".join(data.get("tours", [])) or "none"
          if status == "recorder-failed":
              print(f"The path-selected recorder failed for {tours}; see the run artifact and failed manifests.")
          elif status == "no-ui-paths":
              print("No UI paths changed; no interaction tour was needed.")
          PY
            )"
            note="$capture_note"
          fi
          case "$TOUR_RESULT" in
            skipped) note="The tour did not run: $ROUTE_REASON. ${note}" ;;
            failure)
              if compgen -G "$RUNNER_TEMP/media/*/manifest.json" >/dev/null; then
                note="${note:+$note }The tour failed; the failed steps are below."
              else
                note="${note:+$note }The tour job failed before the tour ran (build or setup); the run log has the output."
              fi ;;
          esac
          python3 scripts/cmux-next/media/publish.py --repo "$GITHUB_REPOSITORY" \
            --media "$RUNNER_TEMP/media" --pr "$PR" --sha "$HEAD_SHA" --run-url "$RUN_URL" --note "$note"
