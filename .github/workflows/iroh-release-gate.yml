name: Iroh release gate

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, full SHA, or short SHA to verify
        required: false
        default: ""
      mode:
        description: Iroh transport mode
        required: true
        default: all
        type: choice
        options:
          - all
          - automatic
          - relay-only
          - relay-expiry
          - direct-only
          - private-path
      environment:
        description: Backend environment to verify
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production
      v2_base_url:
        description: canonical v2 Worker origin used by the app and gate
        required: false
        default: https://cmux-v2-staging.debussy.workers.dev
        type: string
      soak_profile:
        description: workload duration for automatic and relay-only verification
        required: false
        default: stress
        type: choice
        options:
          - basic
          - stress

permissions:
  contents: read

jobs:
  resolve-ref:
    uses: ./.github/workflows/resolve-dispatch-ref.yml
    with:
      ref: ${{ inputs.ref }}

  tailscale-version-skew:
    needs: resolve-ref
    name: Tailscale version-skew compatibility
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || (vars.CI_PAID_MACOS_OVERFLOW == '1' && vars.MACOS_RUNNER_15 || 'blacksmith-6vcpu-macos-15') }}
    timeout-minutes: 75
    env:
      CMUX_CI_XCODE_APP: ${{ vars.CMUX_CI_XCODE_APP_MACOS_15 }}
      CMUX_CI_REQUIRED_MACOS_SDK_MAJOR: "26"
      CMUX_SKIP_ZIG_BUILD: "1"
      SWIFT_BACKTRACE: "interactive=no,timeout=0s,symbolicate=off,color=no"
      CMUX_XCODEBUILD_NONINTERACTIVE_POST_TEST_TIMEOUT_SECONDS: "45"
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.resolve-ref.outputs.sha }}
          persist-credentials: false
          submodules: recursive

      - name: Select Xcode
        run: ./scripts/select-ci-xcode.sh

      - name: Download pre-built GhosttyKit
        run: ./scripts/download-prebuilt-ghosttykit.sh

      - name: Install Rust
        run: ./scripts/install-rust-ci.sh

      - name: Run deterministic version-skew gate
        run: ./scripts/ci/run-iroh-tailscale-compatibility-gate.sh

  simulator-e2e:
    needs: resolve-ref
    env:
      # The app gates compile optimized Swift for both endpoints. Xcode 26's
      # AArch64 GlobalISel path is not reliable for that exact build shape, so
      # use the same supported workaround as tagged cloud reloads and streamed
      # validation instead of allowing a compiler failure to masquerade as a
      # transport verdict.
      CMUX_SWIFT_FRONTEND_WORKAROUND: "1"
      # Keep Xcode's normal module emission for optimized app verification.
      # reload's standalone-driver shortcut fails while merging opaque SwiftUI
      # return types on Xcode 26.3 before either endpoint can launch.
      CMUX_RELOAD_APP_EMIT_MODULE: "1"
    strategy:
      fail-fast: false
      # The app-backed modes share one temporary account per environment.
      # Serial execution prevents one mode's zero-touch registration from
      # replacing another mode's active Mac route during its RPC probe.
      max-parallel: 1
      matrix:
        mode: ${{ fromJSON(inputs.mode == 'all' && '["automatic","relay-only","relay-expiry","direct-only","private-path"]' || format('["{0}"]', inputs.mode)) }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || (vars.CI_PAID_MACOS_OVERFLOW == '1' && vars.MACOS_RUNNER_15 || 'blacksmith-6vcpu-macos-15') }}
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.resolve-ref.outputs.sha }}
          persist-credentials: false
          submodules: recursive

      - name: Select Xcode
        run: ./scripts/select-ci-xcode.sh

      - name: Ensure iOS Simulator runtime
        if: ${{ matrix.mode != 'private-path' }}
        run: |
          xcrun simctl list runtimes available | grep -Eq '\biOS\b' || xcodebuild -downloadPlatform iOS

      - name: Install app build dependencies
        if: ${{ matrix.mode == 'automatic' || matrix.mode == 'relay-only' || matrix.mode == 'relay-expiry' }}
        run: |
          ./scripts/install-zig-ci.sh
          ./scripts/download-prebuilt-ghosttykit.sh || ./scripts/ensure-ghosttykit.sh

      - name: Install Bun
        if: ${{ matrix.mode == 'automatic' || matrix.mode == 'relay-only' || matrix.mode == 'relay-expiry' }}
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"

      - name: Install web runtime dependencies
        if: ${{ matrix.mode == 'automatic' || matrix.mode == 'relay-only' || matrix.mode == 'relay-expiry' }}
        working-directory: web
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Materialize isolated staging account
        if: ${{ inputs.environment == 'staging' && (matrix.mode == 'automatic' || matrix.mode == 'relay-only' || matrix.mode == 'relay-expiry') }}
        env:
          CMUX_DOGFOOD_STACK_EMAIL: ${{ secrets.CMUX_DOGFOOD_STACK_EMAIL }}
          CMUX_DOGFOOD_STACK_PASSWORD: ${{ secrets.CMUX_DOGFOOD_STACK_PASSWORD }}
        run: |
          set -euo pipefail
          [[ -n "${CMUX_DOGFOOD_STACK_EMAIL:-}" ]] || { echo "::error::missing staging email"; exit 1; }
          [[ -n "${CMUX_DOGFOOD_STACK_PASSWORD:-}" ]] || { echo "::error::missing staging password"; exit 1; }
          # The Mac app's DebugDogfoodCredentialResolver and
          # scripts/lib/dev-secrets.sh read this fixed path under $HOME, so it
          # cannot move to $RUNNER_TEMP. "Remove staging account" below deletes
          # it however the job ends.
          mkdir -p "$HOME/.secrets"
          (
            umask 077
            # The release gate explicitly selects the isolated agent profile.
            # Keep this account under the agent keys so the resolver cannot
            # silently choose a different personal profile.
            printf 'CMUX_UITEST_STACK_EMAIL=%s\n' "$CMUX_DOGFOOD_STACK_EMAIL"
            printf 'CMUX_UITEST_STACK_PASSWORD=%s\n' "$CMUX_DOGFOOD_STACK_PASSWORD"
          ) > "$HOME/.secrets/cmuxterm-dev.env"
          chmod 600 "$HOME/.secrets/cmuxterm-dev.env"

      - name: Materialize production Stack environment
        if: ${{ inputs.environment == 'production' && (matrix.mode == 'automatic' || matrix.mode == 'relay-only' || matrix.mode == 'relay-expiry') }}
        env:
          STACK_PROJECT_ID: ${{ secrets.STACK_PROJECT_ID }}
          STACK_PUBLISHABLE_CLIENT_KEY: ${{ secrets.STACK_PUBLISHABLE_CLIENT_KEY }}
          STACK_SECRET_SERVER_KEY: ${{ secrets.STACK_SECRET_SERVER_KEY }}
        run: |
          set -euo pipefail
          [[ -n "${STACK_PROJECT_ID:-}" ]] || { echo "::error::missing production Stack project id"; exit 1; }
          [[ -n "${STACK_PUBLISHABLE_CLIENT_KEY:-}" ]] || { echo "::error::missing production Stack publishable key"; exit 1; }
          [[ -n "${STACK_SECRET_SERVER_KEY:-}" ]] || { echo "::error::missing production Stack server key"; exit 1; }
          umask 077
          production_dir="$RUNNER_TEMP/cmux-production-stack"
          mkdir -p "$production_dir"
          chmod 700 "$production_dir"
          production_env="$production_dir/stack.env"
          cat > "$production_env" <<EOF
          NEXT_PUBLIC_STACK_PROJECT_ID=$STACK_PROJECT_ID
          NEXT_PUBLIC_STACK_PUBLISHABLE_CLIENT_KEY=$STACK_PUBLISHABLE_CLIENT_KEY
          STACK_SECRET_SERVER_KEY=$STACK_SECRET_SERVER_KEY
          EOF
          chmod 600 "$production_env"

      - name: Run Iroh gate
        env:
          # The hosted runner does not have cmuxterm-hq's tagged-backend
          # helper. The explicit Worker origin remains the app's API and v2
          # broker; local mode only prevents reload.sh from looking for that
          # helper while constructing the tagged artifacts.
          CMUX_DEV_BACKEND_MODE: local
        run: |
          set -euo pipefail
          case "${{ matrix.mode }}" in
            automatic) TAG="irgaut-${GITHUB_RUN_ID}" ;;
            relay-only) TAG="irgrel-${GITHUB_RUN_ID}" ;;
            relay-expiry) TAG="irgexp-${GITHUB_RUN_ID}" ;;
            direct-only) TAG="irgdir-${GITHUB_RUN_ID}" ;;
            private-path) TAG="irgprv-${GITHUB_RUN_ID}" ;;
          esac
          GATE_ARGS=(
            --mode "${{ matrix.mode }}"
            --tag "$TAG"
            --report-output "$RUNNER_TEMP/iroh-release-gate-${{ matrix.mode }}.json"
          )
          if [[ "${{ inputs.environment }}" == production ]]; then
            case "${{ matrix.mode }}" in
              automatic|relay-only|relay-expiry) ;;
              *) echo "::error::production verification supports automatic, relay-only, and relay-expiry modes"; exit 2 ;;
            esac
            GATE_ARGS+=(
              --production
              --stack-env-file "$RUNNER_TEMP/cmux-production-stack/stack.env"
            )
          else
            GATE_ARGS+=(--v2-base-url "${{ inputs.v2_base_url }}")
          fi
          if [[ "${{ matrix.mode }}" == automatic || "${{ matrix.mode }}" == relay-only ]]; then
            GATE_ARGS+=(--soak-profile "${{ inputs.soak_profile }}")
          fi
          ./scripts/run-iroh-release-gate.sh "${GATE_ARGS[@]}"

      - name: Upload redacted verdict
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: iroh-release-gate-${{ matrix.mode }}
          path: |
            ${{ runner.temp }}/iroh-release-gate-${{ matrix.mode }}.json
            ${{ runner.temp }}/iroh-release-gate-${{ matrix.mode }}-mac.cmuxdiag
            ${{ runner.temp }}/iroh-release-gate-${{ matrix.mode }}-ios-failure.log
            ${{ runner.temp }}/iroh-release-gate-${{ matrix.mode }}-ios-failure.png
            ${{ runner.temp }}/iroh-release-gate-${{ matrix.mode }}-mac-failure.cmuxdiag
          if-no-files-found: warn
          retention-days: 7

      - name: Remove staging account
        # The runner user's home outlives the job on a reused machine; never
        # leave the staging credentials behind.
        if: ${{ always() && inputs.environment == 'staging' }}
        run: |
          rm -f "$HOME/.secrets/cmuxterm-dev.env"
          rmdir "$HOME/.secrets" 2>/dev/null || true

      - name: Remove production Stack environment
        if: ${{ always() && inputs.environment == 'production' }}
        run: |
          rm -f "$RUNNER_TEMP/cmux-production-stack/stack.env"
          rmdir "$RUNNER_TEMP/cmux-production-stack" 2>/dev/null || true
