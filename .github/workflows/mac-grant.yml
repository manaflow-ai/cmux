name: Mac grant

# The runs-on a same-repository Mac pull request job asks the CI controller
# for (CI v2 step 9, cmuxterm-hq#16502), for the workflows that have no pool
# picker of their own. ci.yml and ci-macos.yml take the same value from
# simple_pool_picker.py's `grant` output. Callers consume it as:
#
#   jobs:
#     mac-grant:
#       uses: ./.github/workflows/mac-grant.yml
#     tests:
#       needs: mac-grant
#       runs-on: ${{ <fork clause> || github.event_name == 'pull_request' && needs.mac-grant.outputs.labels != '' && fromJSON(needs.mac-grant.outputs.labels) || <pool route> }}
#
# `labels` is a JSON array (`["cmux-<run_id>-<run_attempt>-mac","xcode-26.6"]`)
# or "" when scripts/ci/mac-grants.json is off, the run is not a pull request,
# or the pull request comes from another repository. "" leaves every route as
# it was. The job always runs (no job-level `if`) so a dependent job is never
# skipped for it; with nothing to grant it only prints "none".

on:
  workflow_call:
    outputs:
      labels:
        description: JSON array of the granted Mac labels, or "" for no grant.
        value: ${{ jobs.grant.outputs.labels }}

permissions:
  contents: read

jobs:
  grant:
    name: Mac grant
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || 'cmux-linux' }}
    timeout-minutes: 5
    outputs:
      labels: ${{ steps.grant.outputs.labels }}
    steps:
      - name: Checkout
        if: ${{ github.repository_owner == 'manaflow-ai' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: false
          sparse-checkout: |
            scripts/ci/mac_grants.py
            scripts/ci/mac-grants.json
          sparse-checkout-cone-mode: false

      - name: Read the Mac grant switch
        id: grant
        if: ${{ github.repository_owner == 'manaflow-ai' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        # A failure here means no grant: the jobs keep their pool route.
        continue-on-error: true
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          CI_LIGHT_LANE_RUNNER: ${{ vars.CI_LIGHT_LANE_RUNNER }}
          CI_SIDE_LANE_LABELS: ${{ vars.CI_SIDE_LANE_LABELS }}
          CI_SIDE_LANE_RUNNER: ${{ vars.CI_SIDE_LANE_RUNNER }}
          CMUX_CI_XCODE_APP_PR: ${{ github.event.pull_request.head.repo.full_name == github.repository && vars.CMUX_CI_XCODE_APP_PR || '' }}
        run: python3 scripts/ci/mac_grants.py
