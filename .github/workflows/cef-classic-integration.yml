name: CEF Classic integration

# This workflow exists only on cef-classic/integration. That branch merges every
# cef-classic/* area branch and is never merged itself. Its pull request CI
# (#21044) is cancelled by each newer push, so on this fast-moving branch it
# never finished a compile. This workflow does not cancel a run in progress:
# GitHub keeps one run going and holds the newest push pending, so every run
# finishes and the newest commit is always checked.
#
# Each run first dispatches one small app-host unit suite at the pushed commit.
# That compiles the app and its unit tests with the pull request Xcode pin on
# an owned Mac's warm DerivedData, so a compile break fails here in minutes.
# The browser UI tests then run once per engine. The Chromium run embeds the
# CEF engine and fails when a browser opens in a different engine.
#
# A candidate branch, cef-classic/cand-<agent>, is an agent's merge into
# integration that has not been verified yet (the lead's integration procedure).
# It runs the compile job only. A green compile is the CI evidence that lets
# the candidate fast-forward integration. A newer push to the same candidate
# replaces the older run.

on:
  push:
    branches:
      - cef-classic/integration
      - cef-classic/cand-*
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cef-classic-integration-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/cef-classic/integration' }}

jobs:
  compile:
    name: App compile (app-host unit suite)
    if: ${{ github.repository == 'manaflow-ai/cmux' }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 120
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Compile the app and run one browser unit suite
        env:
          GH_TOKEN: ${{ github.token }}
        # The verdict is the dispatched run's compile step, not the whole run:
        # a runner that cannot run the suite afterwards (a missing tool, an
        # infra fault) must not turn a good compile red. A compile the run
        # adopted from an identical earlier product counts as compiled.
        run: |
          set -uo pipefail
          started=$(date +%s)
          status=0
          python3 scripts/ci/dispatch-focused-test.py \
            cmuxTests/BrowserAddressBarTrackingPolicyTests \
            --ref "$GITHUB_SHA" \
            --workflow-ref cef-classic/integration \
            --full-build \
            --force \
            --wait 2>&1 | tee "$RUNNER_TEMP/dispatch.log" || status=$?
          minutes=$(( ($(date +%s) - started) / 60 ))
          run_id="$(sed -n 's|^Run: https://github.com/[^/]*/[^/]*/actions/runs/\([0-9]*\).*|\1|p' "$RUNNER_TEMP/dispatch.log" | tail -n 1)"
          if [ -z "$run_id" ]; then
            echo "::error::the compile run was not dispatched (status $status)"
            exit 1
          fi
          compile="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?filter=latest&per_page=100" \
            --jq '[.jobs[] | select(.name == "build") | .steps] | first // [] | (map(.name) | index("Build the app-host and UI test product")) as $at
              | if $at == null then "missing"
                elif (.[:$at] | any(.conclusion == "failure")) then "failed-before-compile"
                else .[$at].conclusion // "missing" end')"
          echo "Compile gate: compile step $compile, run status $status, $minutes min (https://github.com/$GITHUB_REPOSITORY/actions/runs/$run_id)" | tee -a "$GITHUB_STEP_SUMMARY"
          case "$compile" in
            success|skipped)
              if [ "$status" -ne 0 ]; then
                echo "::warning::the app compiled, but the unit suite run failed after it (see the run above)"
              fi
              exit 0
              ;;
            *) echo "::error::the app did not compile ($compile)"; exit 1 ;;
          esac

  browser-e2e:
    name: Browser UI tests (${{ matrix.engine }})
    needs: compile
    if: ${{ github.repository == 'manaflow-ai/cmux' && github.ref == 'refs/heads/cef-classic/integration' }}
    strategy:
      fail-fast: false
      matrix:
        engine: [webkit, chromium]
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    # The Chromium run compiles cold (up to 90 minutes) and then runs the tests;
    # the job itself mostly waits.
    timeout-minutes: 240
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Dispatch and wait for the browser UI tests
        env:
          GH_TOKEN: ${{ github.token }}
          ENGINE: ${{ matrix.engine }}
        run: |
          python3 scripts/ci/dispatch-focused-test.py \
            cmuxUITests/BrowserReturnSubmissionUITests \
            cmuxUITests/BrowserFixtureInteractionUITests \
            --ref "$GITHUB_SHA" \
            --workflow-ref cef-classic/integration \
            --browser-engine "$ENGINE" \
            --job-timeout 90 \
            --no-video \
            --wait
