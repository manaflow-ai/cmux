name: Machine join E2E (development)

# The implementation lives on feat-cmux-next. GitHub dispatches only a
# workflow the default branch registers, so this inert copy lets lanes run:
#
#   gh workflow run machine-join-e2e.yml -R manaflow-ai/cmux --ref feat-cmux-next
#
# A dispatch runs the file at --ref, so feat-cmux-next's inputs and jobs win;
# these inputs only mirror them for the Actions form.
#
# schedule: every 6 h the `share` job dispatches feat-cmux-next's copy with
# share=true. The HQ probe screen-share-zero-touch reads the newest run's
# evidence artifact (share.view.lumaVariance, share.hubApproval) for its
# mac-linux row and calls it stale past 72 h; with only manual dispatch the
# row went stale whenever nobody ran it. GitHub runs schedules only from the
# default branch, so the schedule lives here.
on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
    inputs:
      name:
        description: Machine name for the join (default ci-join-<run id>)
        required: false
        default: ""
        type: string
      acpmux_ref:
        description: The commit acpmux is built from; only the run's commit (the feat-cmux-next tip) is accepted
        required: false
        default: ""
        type: string
      bench:
        description: "deps: while joined, time cold and warm Cargo and bun installs through `acpmux machine deps warm` (the platform's dependency cache); deps-slow: the same over a link with 150 ms more latency"
        required: false
        default: none
        type: choice
        options:
          - none
          - deps
          - deps-slow
      share:
        description: "while joined, share the machine with no step on it: its daemon sets up cmux-rd's screen host, a viewer of the same account must decode a frame within 60 s, and another account must be refused"
        required: false
        default: false
        type: boolean
      share_install:
        description: "with share: where the joined machine's cmux-rd comes from. build: the run's commit, linked into place before the join (tests the commit). channel: nothing is placed; the join line's own cmux-rd step installs it from the feat-cmux-next channel, which must carry cmux-rd"
        required: false
        default: build
        type: choice
        options:
          - build
          - channel

permissions: {}

env:
  # Temporary REST budget attribution: one gh-call line per GitHub API call (scripts/ci/api_call_log/env.sh, fetched at a fixed commit when the checkout has no copy).
  BASH_ENV: '$({ w="${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh"; t="${RUNNER_TEMP:-/nonexistent}/api-call-log-src"; if [ -f "$w" ]; then echo "$w"; elif [ -n "${RUNNER_TEMP:-}" ]; then if [ ! -f "$t/env.sh" ] && [ ! -e "$t.tried" ] && { [ "${RUNNER_OS:-}" = Linux ] || [ "${RUNNER_OS:-}" = macOS ]; } && [ "$(date -u +%Y%m%d%H)" -lt 2026112300 ]; then : > "$t.tried"; mkdir -p "$t.part" && for x in env.sh gh sitecustomize.py isolated.py; do curl -fsSL --max-time 5 -o "$t.part/$x" "https://raw.githubusercontent.com/manaflow-ai/cmux/27647ffd3ae838c63be28ca3e5883dcd68c34518/scripts/ci/api_call_log/$x" || break; done; [ -s "$t.part/isolated.py" ] && mv "$t.part" "$t"; fi; if [ -f "$t/env.sh" ]; then echo "$t/env.sh"; else echo unset BASH_ENV > "$t.off.sh" && echo "$t.off.sh"; fi; fi; } 2>/dev/null)'

jobs:
  registration:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.CI_OVERFLOW_LINUX || 'cmux-linux' }}
    steps:
      - run: echo "Machine join E2E is implemented on feat-cmux-next; dispatch it with --ref feat-cmux-next"

  share:
    name: dispatch the zero-touch share on feat-cmux-next
    if: github.repository == 'manaflow-ai/cmux' && github.event_name == 'schedule'
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.CI_OVERFLOW_LINUX || 'cmux-linux' }}
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
    steps:
      - name: Checkout the GitHub API wait
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: .gh-budget-tooling
          sparse-checkout: |
            scripts/ci/gh_budget_wait.sh
            scripts/ci/gh_budget_wait.cjs
          sparse-checkout-cone-mode: false
      - name: Wait through GitHub API rate limits and 5xx in this job
        working-directory: ${{ github.workspace }}
        run: bash .gh-budget-tooling/scripts/ci/gh_budget_wait.sh --install
      - name: Dispatch machine-join-e2e.yml share=true on feat-cmux-next
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run machine-join-e2e.yml -R "$GITHUB_REPOSITORY" --ref feat-cmux-next -f share=true
          echo "Dispatched machine-join-e2e.yml share=true on feat-cmux-next; its run writes the machine-join-e2e-evidence artifact screen-share-zero-touch reads." >> "$GITHUB_STEP_SUMMARY"
