name: Machine join E2E (development)

# One bounded end-to-end run of the one-line machine join against the DEVELOPMENT
# platform (https://cmux-platform-development.debussy.workers.dev) only, on an
# ephemeral Blacksmith VM: mint a join token, pipe it to `acpmux host join` on
# stdin as a disposable OS user, run that user's daemon until it heartbeats,
# check status, the platform's list, consent and the credential file, revoke,
# and scan for secrets. The evidence (redacted JSON) is the run summary and the
# only artifact.
#
# Secrets: the repo-level dev stack account (CMUX_DOGFOOD_STACK_EMAIL and
# _PASSWORD, the same pair ios-e2e.yml maps to CMUX_UITEST_STACK_*) reaches the
# one mint step, through env only. scripts/cmux-next/machine-join-e2e.ts holds
# the stack session, the cmux access token, the join token and the machine
# credential in memory, masks each the moment it exists, and passes children a
# fixed environment; the join token reaches acpmux only on stdin. The machine and
# the run's cmux install are revoked in that step's `finally` and on a cancel;
# the evidence check below fails the job when a joined machine is not shown
# revoked. Manual dispatch on feat-cmux-next only.
on:
  workflow_dispatch:
    inputs:
      name:
        description: Machine name for the join (default ci-join-<run id>)
        required: false
        default: ""
        type: string
      acpmux_ref:
        description: Full SHA of a feat-cmux-next commit to build acpmux from (default the run's commit)
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  e2e:
    if: github.ref == 'refs/heads/feat-cmux-next'
    # A secret-reading dispatch job runs in an environment (tests/test_supplychain_security.py). This
    # existing one is limited to feat-cmux-next by GitHub's branch policy; its own secret is never read here
    # (tests/test_machine_join_e2e_workflow.py pins the job's two secret references).
    environment: cmux-next-vm-image-dev
    # Blacksmith only (16 vCPU; 32 while the overflow switch's record exists): a VM that runs
    # this one job and is destroyed. Never LINUX_RUNNER, which may name a persistent host, since
    # this job adds an OS user and holds the stack secrets.
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.CI_CLOUD_OVERFLOW_SAVED && 'blacksmith-32vcpu-ubuntu-2404' || 'blacksmith-16vcpu-ubuntu-2404' }}
    timeout-minutes: 45
    env:
      HUB_ORIGIN: https://cmux-platform-development.debussy.workers.dev
    steps:
      - name: Refuse any ref but feat-cmux-next
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != refs/heads/feat-cmux-next ]; then
            echo "::error::machine-join-e2e runs on feat-cmux-next only (got $REF)"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Resolve inputs
        id: inputs
        env:
          NAME_INPUT: ${{ inputs.name }}
          ACPMUX_REF_INPUT: ${{ inputs.acpmux_ref }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          name="${NAME_INPUT:-ci-join-$GITHUB_RUN_ID}"
          if ! printf '%s' "$name" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._-]{0,62}$'; then
            echo "::error::name must be 1-63 letters, digits, dot, underscore or dash"
            exit 1
          fi
          ref="${ACPMUX_REF_INPUT:-$GITHUB_SHA}"
          if ! printf '%s' "$ref" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::acpmux_ref must be a full 40-character commit SHA"
            exit 1
          fi
          # Only reviewed code builds in a job that later holds secrets: the commit must be on feat-cmux-next.
          state="$(gh api "repos/$REPO/compare/$ref...feat-cmux-next" --jq .status)"
          if [ "$state" != ahead ] && [ "$state" != identical ]; then
            echo "::error::acpmux_ref $ref is not a commit of feat-cmux-next ($state)"
            exit 1
          fi
          src=.
          [ "$ref" = "$GITHUB_SHA" ] || src=acpmux-src
          {
            echo "name=$name"
            echo "acpmux_ref=$ref"
            echo "acpmux_src=$src"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout acpmux source
        if: steps.inputs.outputs.acpmux_src != '.'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ steps.inputs.outputs.acpmux_ref }}
          path: acpmux-src

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev pkg-config

      - name: Set up pinned Rust
        uses: ./.github/actions/setup-cmux-tui-rust

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"

      # The harness's own redaction and failure-path tests, before any secret is in reach.
      - name: Test the harness
        run: bun test scripts/cmux-next/machine-join-e2e.test.ts

      - name: Build acpmux
        working-directory: ${{ steps.inputs.outputs.acpmux_src }}/cmux-tui
        run: cargo build --locked -p acpmux --bin acpmux

      - name: Create the disposable user
        id: user
        env:
          ACPMUX_SRC: ${{ steps.inputs.outputs.acpmux_src }}
        run: |
          set -euo pipefail
          base="$(mktemp -d /tmp/machine-join-e2e.XXXXXX)"
          chmod 755 "$base"
          user="cmuxjoin-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          sudo useradd --create-home --home-dir "$base/home" --shell /usr/sbin/nologin --user-group "$user"
          sudo install -d -o root -g root -m 0755 "$base/bin"
          sudo install -o root -g root -m 0755 "$ACPMUX_SRC/cmux-tui/target/debug/acpmux" "$base/bin/acpmux"
          {
            echo "user=$user"
            echo "uid=$(id -u "$user")"
            echo "base=$base"
            echo "home=$base/home"
          } >> "$GITHUB_OUTPUT"

      # The only step that sees the stack secrets, through env. No `set -x`: the script prints its own lines.
      - name: Mint, join, verify and revoke
        timeout-minutes: 15
        env:
          CMUX_UITEST_STACK_EMAIL: ${{ secrets.CMUX_DOGFOOD_STACK_EMAIL }}
          CMUX_UITEST_STACK_PASSWORD: ${{ secrets.CMUX_DOGFOOD_STACK_PASSWORD }}
          JOIN_NAME: ${{ steps.inputs.outputs.name }}
          JOIN_USER: ${{ steps.user.outputs.user }}
          JOIN_BASE: ${{ steps.user.outputs.base }}
          JOIN_HOME: ${{ steps.user.outputs.home }}
        # exec: bun is the step's process, so a cancel's SIGINT reaches it and it revokes at once.
        run: |
          exec bun scripts/cmux-next/machine-join-e2e.ts --origin "$HUB_ORIGIN" --acpmux "$JOIN_BASE/bin/acpmux" \
            --user "$JOIN_USER" --home "$JOIN_HOME" --name "$JOIN_NAME" \
            --evidence "$RUNNER_TEMP/machine-join-e2e/evidence.json" --run "$GITHUB_RUN_ID" --sha "$GITHUB_SHA"

      # Fails on a token or credential prefix, a JWT or an auth header in the evidence (nothing is then
      # uploaded or summarized), on missing evidence, and on a joined machine not shown revoked.
      - name: Check the evidence
        id: evidence
        if: always() && steps.user.outcome == 'success'
        run: |
          set -euo pipefail
          file="$RUNNER_TEMP/machine-join-e2e/evidence.json"
          if [ ! -s "$file" ]; then
            echo "::error::no evidence was written; if a machine joined, revoke it in the platform's machine list"
            exit 1
          fi
          if grep -Eqi 'cmj_|cmm_|eyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\.|bearer|authorization' "$file"; then
            echo "::error::the evidence holds a secret-shaped value; it is not uploaded"
            exit 1
          fi
          echo "clean=true" >> "$GITHUB_OUTPUT"
          {
            echo '## Machine join E2E (development)'
            echo
            echo '```json'
            cat "$file"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          machine="$(jq -r '.machineId // empty' "$file")"
          if [ -n "$machine" ] && [ "$(jq -r '.revoke.revokedListed' "$file")" != true ]; then
            echo "::error::machine $machine is not shown revoked; revoke it in the platform's machine list"
            exit 1
          fi
          if [ "$(jq -r '.result' "$file")" != pass ]; then
            echo "::error::$(jq -r '.reason' "$file")"
            exit 1
          fi

      - name: Upload the evidence
        if: always() && steps.evidence.outputs.clean == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: machine-join-e2e-evidence
          path: ${{ runner.temp }}/machine-join-e2e/evidence.json
          if-no-files-found: error
          retention-days: 3

      # The user's processes, the user and its home, and its socket directory. `kill -1` run as the
      # disposable user signals exactly the processes that user owns (all started by this job), nothing else.
      - name: Remove the disposable user
        if: always() && steps.user.outputs.user != ''
        env:
          JOIN_USER: ${{ steps.user.outputs.user }}
          JOIN_UID: ${{ steps.user.outputs.uid }}
          JOIN_BASE: ${{ steps.user.outputs.base }}
        run: |
          set -uo pipefail
          sudo -n -u "$JOIN_USER" -- /bin/kill -KILL -1 2>/dev/null || true
          sleep 1
          sudo userdel --remove "$JOIN_USER" 2>/dev/null || true
          sudo rm -rf -- "$JOIN_BASE" "/tmp/acpmux-$JOIN_UID"
          if id "$JOIN_USER" >/dev/null 2>&1; then
            echo "::error::the disposable user $JOIN_USER is still present"
            exit 1
          fi
