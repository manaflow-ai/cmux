name: ios10 cmux INTERNAL App Store Connect probe (rc, one-off)
# One-off: reads (and, when ios10-asc/plan.json is present, applies listed ops to)
# App Store Connect app 6791408425 "cmux INTERNAL" for the iOS 1.0 release.
# Leo 2026-11-22: "esp cuz i NEED this s***t on THE F***ING APP STORE".
# Never submits for review. Orphan rc branch: no other workflow runs here.
on:
  push:
    branches: [rc/ios10-asc-internal-probe]

permissions:
  contents: read

concurrency:
  group: ios10-asc-internal-probe
  cancel-in-progress: false

jobs:
  probe:
    if: github.repository == 'manaflow-ai/cmux'
    runs-on: ${{ vars.LINUX_RUNNER || fromJSON(vars.RUNNER_POOLS).linux_2 }}
    timeout-minutes: 15
    environment: release
    env:
      ASC_APP_ID: "6791408425"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Checkout feat-cmux-next review package (trusted)
        if: hashFiles('ios10-asc/notes-mode') != ''
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: feat-cmux-next
          path: next
          persist-credentials: false
          sparse-checkout: |
            cmux-next-ios/scripts
            cmux-next-ios/AppStoreReview
            cmux-next-ios/project.yml
      - name: Probe
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          key_dir="$RUNNER_TEMP/asc"; mkdir -p "$key_dir"; chmod 700 "$key_dir"
          trap 'rm -rf "$key_dir"' EXIT
          printf '%s' "$ASC_API_KEY_P8_BASE64" | base64 --decode > "$key_dir/AuthKey.p8"
          chmod 600 "$key_dir/AuthKey.p8"
          export ASC_KEY_ID="$ASC_API_KEY_ID" ASC_ISSUER_ID="$ASC_API_ISSUER_ID" ASC_PRIVATE_KEY_PATH="$key_dir/AuthKey.p8"
          mode=read
          [ -f ios10-asc/plan.json ] && mode=plan
          python3 -I ios10-asc/probe.py "$mode"
          if [ -f ios10-asc/notes-mode ]; then
            nm="$(tr -d '[:space:]' < ios10-asc/notes-mode)"
            ver="$(tr -d '[:space:]' < ios10-asc/notes-version)"
            args=(--app "$ASC_APP_ID" sync-notes --version "$ver")
            [ "$nm" = write ] || args+=(--dry-run)
            python3 -I next/cmux-next-ios/scripts/asc_review_package.py "${args[@]}"
          fi
