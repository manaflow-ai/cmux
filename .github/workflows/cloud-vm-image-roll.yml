name: Cloud VM image roll

# A merged cmux-tui or image fix reaches production's Cloud VM boot image with no hand PR:
#
#   1. plan     cmux-tui-artifacts.yml dispatches this run for every feat-cmux-next build it published and
#               verified (input commit); a feat-cmux-next push that changes the image inputs starts it too.
#               images/cmux-vm/auto-roll.ts plan rolls only a build of the branch that changes the binaries
#               the lock pins, and never an older one; it lists the fix commits the roll carries.
#   2. bake     cloud-vm-image-bake.yml (called, roll: true) pins that build into the lock and bakes the
#               image with the agent tools. The gate is the bake's own exact-image checks
#               on the candidate snapshot: the 5-clone smoke and the agent tools probe, whose harness gate (harness-gate.ts) must pass
#               `acp ensure` for every harness the Cloud chat picker offers. Any red there and
#               nothing is kept or promoted; production stays on its image.
#   3. promote  images/cmux-vm/image-roll-push.sh lands one bot commit on feat-cmux-next: the pinned lock
#               and the image first in production's VM_BOOT_IMAGES (last in staging's). It pushes with the
#               manaflow-cmux-pr-autofix App, so cmux-vm.yml deploys it to production and runs
#               smoke-production, whose product create boots exactly that first image.
#   4. settle   cmux-vm.yml's image-roll-settle job: a red production smoke or deploy on the roll commit lands
#               a rollback commit (the image leaves both lists; the entry before it boots again).
#
# Records: each roll's rolls/<run id>.json on the branch cloud-image-rolls (images/cmux-vm/image-roll-record.sh),
# plus the trailers Image-Roll-Run and Image-Roll-Image on the roll and rollback commits. A red gate, a failed
# promotion and a rollback also comment on the one open issue labelled cloud-image-roll.
#
# images/cmux-vm/auto-roll.json is the switch: "off" (only a dispatch runs), "dry-run" (bake and gate, then
# make the commit and upload its diff without pushing) or "live". The dispatch input dry_run overrides it.
#
# Concurrency: one roll runs at a time, and one waits. A newer request replaces the waiting one (GitHub's
# pending-run replacement), so a burst of merges bakes the newest build next. A running roll is never
# cancelled: the bake deletes what it made in its own always() step. Every job has a timeout.
on:
  workflow_dispatch:
    inputs:
      commit:
        description: The feat-cmux-next commit whose published cmux-tui build to roll; empty rebakes the tip's image inputs with the pinned cmux-tui
        required: false
        default: ""
        type: string
      dry_run:
        description: auto = images/cmux-vm/auto-roll.json; true = bake and gate, push nothing; false = live
        required: false
        default: auto
        type: choice
        options: [auto, "true", "false"]
      large_image:
        description: Also bake and smoke the large image (4 vCPU / 16 GiB / 64 GiB) and list it on staging's entry, so a development create at that size boots at its final size with no resize. Production's entry never lists it. A large image that fails is a warning; the roll goes on without it
        required: false
        default: false
        type: boolean
      platform_readiness:
        description: mint the cmux-platform push token and read its main Wrangler config without pushing
        required: false
        default: false
        type: boolean
  push:
    branches: [feat-cmux-next]
    paths:
      - images/cmux-vm/**
      - web/scripts/cmux-vm-image/**
      - "!images/cmux-vm/channels/**"

permissions: {}

# The roll's own commits change the lock and so start a push run here; that run does nothing and takes a group
# of its own, so it never replaces a waiting roll.
concurrency:
  group: "${{ github.event_name == 'push' && (startsWith(github.event.head_commit.message, 'cmux-vm: image roll ') || startsWith(github.event.head_commit.message, 'cmux-vm: image rollback ')) && format('cloud-vm-image-roll-own-{0}', github.run_id) || 'cloud-vm-image-roll' }}"
  cancel-in-progress: false

env:
  # Temporary REST budget attribution: one gh-call line per GitHub API call (scripts/ci/api_call_log/env.sh, fetched at a fixed commit when the checkout has no copy).
  BASH_ENV: '$({ w="${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh"; t="${RUNNER_TEMP:-/nonexistent}/api-call-log-src"; if [ -f "$w" ]; then echo "$w"; elif [ -n "${RUNNER_TEMP:-}" ]; then if [ ! -f "$t/env.sh" ] && [ ! -e "$t.tried" ] && { [ "${RUNNER_OS:-}" = Linux ] || [ "${RUNNER_OS:-}" = macOS ]; } && [ "$(date -u +%Y%m%d%H)" -lt 2026112300 ]; then : > "$t.tried"; mkdir -p "$t.part" && for x in env.sh gh sitecustomize.py isolated.py; do curl -fsSL --max-time 5 -o "$t.part/$x" "https://raw.githubusercontent.com/manaflow-ai/cmux/27647ffd3ae838c63be28ca3e5883dcd68c34518/scripts/ci/api_call_log/$x" || break; done; [ -s "$t.part/isolated.py" ] && mv "$t.part" "$t"; fi; if [ -f "$t/env.sh" ]; then echo "$t/env.sh"; else echo unset BASH_ENV > "$t.off.sh" && echo "$t.off.sh"; fi; fi; } 2>/dev/null)'

jobs:
  platform-readiness:
    if: github.event_name == 'workflow_dispatch' && inputs.platform_readiness
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.CI_DEPLOY_SKIP_FLEET != '1' && 'cmux-gcp-deploy-jit-x64' || vars.CI_CLOUD_OVERFLOW_SAVED && fromJSON(vars.RUNNER_POOLS).linux_8 || fromJSON(vars.RUNNER_POOLS).linux_4 }}
    timeout-minutes: 10
    environment: cmux-vm-production
    permissions:
      contents: read
    steps:
      - name: Mint the cmux-platform readiness token
        id: platform-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.CMUX_PR_AUTOFIX_APP_ID }}
          private-key: ${{ secrets.CMUX_PR_AUTOFIX_APP_KEY }}
          owner: manaflow-ai
          repositories: cmux-platform
          permission-contents: write
      # A persistent pool VM keeps the last job's checkout as a git cache. One left sparse (patterns, skip-worktree
      # bits) or with a ref to a missing object makes actions/checkout leave files out or fail (runs 44739498261 and
      # 44733869883, 2026-11-20); remove it so checkout clones fresh. Its manual test: test_ci_reused_sparse_checkout.py.
      - name: Remove a reused workspace left sparse or broken (self-hosted Linux)
        working-directory: ${{ github.workspace }}
        if: runner.os == 'Linux'
        shell: bash
        run: |
          [ "${RUNNER_ENVIRONMENT:-}" = self-hosted ] && [ -e "$GITHUB_WORKSPACE/.git" ] || exit 0
          cd "$GITHUB_WORKSPACE"
          why=""
          if [ "$(git config --get core.sparseCheckout 2>/dev/null)" = true ] || [ -e .git/info/sparse-checkout ]; then
            why="sparse"
          elif git ls-files -v 2>/dev/null | grep -q '^S'; then
            why="skip-worktree entries"
          elif ! git rev-parse --verify -q 'HEAD^{commit}' >/dev/null; then
            why="HEAD does not resolve"
          elif git for-each-ref --format='%(objectname)' 2>/dev/null | git cat-file --batch-check 2>/dev/null | grep -q ' missing$'; then
            why="a ref names a missing object"
          else
            exit 0
          fi
          echo "reused workspace on ${RUNNER_NAME:-this runner}: $why; removing it so checkout starts clean"
          find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: manaflow-ai/cmux-platform
          ref: refs/heads/main
          path: cmux-platform
          token: ${{ steps.platform-token.outputs.token }}
          persist-credentials: false
          sparse-checkout: workers/cmux-vm/wrangler.jsonc
      - name: Read cmux-platform main's Wrangler config
        run: test -s cmux-platform/workers/cmux-vm/wrangler.jsonc

  plan:
    # The control jobs (platform-readiness, plan, promote, report) take the 4-vCPU pool, never vars.LINUX_RUNNER:
    # with LINUX_RUNNER on a 16-vCPU Blacksmith size, roll 44282278310 queued 41 min for plan and 20+ min for promote,
    # each a minute of work, while Blacksmith's vCPU cap had room for a small job. Only the bake needs the big runner.
    # Never on the roll's own commits (they change the lock), and only on feat-cmux-next.
    # Every roll job (platform-readiness, plan, promote, report, and the bake it calls with roll: true) leads with
    # cmux-gcp-deploy-jit-x64: production's deploy path, reserved for this workflow and served only by gha-runners'
    # one-job JIT VMs (one VM per job, deleted after it, one kept warm; cmuxterm-hq gha-runners README "The deploy
    # label"), so it never queues behind the build backlog. Roll 44506003283's plan waited 13 h for a runner on the
    # shared labels (2026-11-19), and production's image lagged feat-cmux-next by 38 h. vars.CI_DEPLOY_SKIP_FLEET=1
    # sends every job back to the labels below.
    # Before it, attempt 1 took the owned GCP build lane (cmux-gcp-lane-build-x64, the label the nightly tree's short jobs
    # use): plan holds no secret, no environment and a read-only token, and Blacksmith's vCPU cap with saturated
    # hosted runners left roll 44351236121's plan queued 6 h 51 min. A re-run takes the pools. platform-readiness
    # and promote (the production App key), the bake (Freestyle key) and report (a contents: write token) stay
    # off the shared lane VMs.
    if: >-
      github.repository == 'manaflow-ai/cmux' && github.ref == 'refs/heads/feat-cmux-next' &&
      !(github.event_name == 'push' && (startsWith(github.event.head_commit.message, 'cmux-vm: image roll ') ||
      startsWith(github.event.head_commit.message, 'cmux-vm: image rollback ')))
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.CI_DEPLOY_SKIP_FLEET != '1' && 'cmux-gcp-deploy-jit-x64' || github.run_attempt == 1 && 'cmux-gcp-lane-build-x64' || vars.CI_CLOUD_OVERFLOW_SAVED && fromJSON(vars.RUNNER_POOLS).linux_8 || fromJSON(vars.RUNNER_POOLS).linux_4 }}
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      roll: ${{ steps.plan.outputs.roll }}
      pin: ${{ steps.plan.outputs.pin }}
      dry_run: ${{ steps.plan.outputs.dry_run }}
      plan: ${{ steps.plan.outputs.plan }}
    steps:
      # A persistent pool VM keeps the last job's checkout as a git cache. One left sparse (patterns, skip-worktree
      # bits) or with a ref to a missing object makes actions/checkout leave files out or fail (runs 44739498261 and
      # 44733869883, 2026-11-20); remove it so checkout clones fresh. Its manual test: test_ci_reused_sparse_checkout.py.
      - name: Remove a reused workspace left sparse or broken (self-hosted Linux)
        working-directory: ${{ github.workspace }}
        if: runner.os == 'Linux'
        shell: bash
        run: |
          [ "${RUNNER_ENVIRONMENT:-}" = self-hosted ] && [ -e "$GITHUB_WORKSPACE/.git" ] || exit 0
          cd "$GITHUB_WORKSPACE"
          why=""
          if [ "$(git config --get core.sparseCheckout 2>/dev/null)" = true ] || [ -e .git/info/sparse-checkout ]; then
            why="sparse"
          elif git ls-files -v 2>/dev/null | grep -q '^S'; then
            why="skip-worktree entries"
          elif ! git rev-parse --verify -q 'HEAD^{commit}' >/dev/null; then
            why="HEAD does not resolve"
          elif git for-each-ref --format='%(objectname)' 2>/dev/null | git cat-file --batch-check 2>/dev/null | grep -q ' missing$'; then
            why="a ref names a missing object"
          else
            exit 0
          fi
          echo "reused workspace on ${RUNNER_NAME:-this runner}: $why; removing it so checkout starts clean"
          find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: refs/heads/feat-cmux-next
          # Full history without blobs: "never older than the pin" and the fix commits since it need the pin's
          # real ancestry, which a shallow window cuts (auto-roll.ts plan refuses a shallow checkout).
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: false # patterns: .github/checkout-lean.json
          sparse-checkout: |
            /*
            !/cmux-next-ios/verify/
      # The owned GCP build lanes reuse the workspace: after an earlier job's sparse checkout a checkout there left tracked files missing (run 44398113924), so write HEAD's files again.
      - name: Repair a reused self-hosted checkout
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if [ "${RUNNER_ENVIRONMENT:-}" = self-hosted ]; then
            git reset -q --hard HEAD
          fi
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
          no-cache: ${{ !startsWith(github.workspace, '/home/runner/work/') }}
      - name: Plan the roll
        id: plan
        env:
          EVENT: ${{ github.event_name == 'push' && 'push' || 'dispatch' }}
          COMMIT: ${{ github.event_name == 'push' && github.sha || inputs.commit }}
          BEFORE: ${{ github.event.before }}
          DRY_RUN: ${{ inputs.dry_run || 'auto' }}
        run: |
          set -euo pipefail
          # A pin off the branch (a hand pin of a lane build) is fetched with its history; a pin that cannot be
          # fetched fails the plan, never skips the guard. A build commit off the branch is "not on the tip" anyway.
          pinned="$(jq -r '.programs[] | select(.name == "cmux-tui") | .version' images/cmux-vm/inputs.lock.json)"
          if ! git cat-file -e "$pinned^{commit}" 2> /dev/null; then git fetch -q --filter=blob:none origin "$pinned"; fi
          if [ -n "$COMMIT" ] && ! git cat-file -e "$COMMIT^{commit}" 2> /dev/null; then git fetch -q --filter=blob:none origin "$COMMIT" || true; fi
          bun images/cmux-vm/auto-roll.ts plan --event "$EVENT" --commit "$COMMIT" --before "${BEFORE:-}" --dry-run "$DRY_RUN" --tip HEAD > "$RUNNER_TEMP/plan.json"
          cat "$RUNNER_TEMP/plan.json"
          {
            echo "roll=$(jq -r .roll "$RUNNER_TEMP/plan.json")"
            echo "pin=$(jq -r .pin "$RUNNER_TEMP/plan.json")"
            echo "dry_run=$(jq -r .dryRun "$RUNNER_TEMP/plan.json")"
            echo "plan=$(jq -c . "$RUNNER_TEMP/plan.json")"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Cloud VM image roll: plan"
            echo
            echo "$(jq -r '"Roll: \(.roll) (\(.reason)). Dry run: \(.dryRun)."' "$RUNNER_TEMP/plan.json")"
            echo
            jq -r '.fixes[] | "- `\(.sha[0:12])` \(.mergedAt) \(.subject)"' "$RUNNER_TEMP/plan.json"
          } >> "$GITHUB_STEP_SUMMARY"

  bake:
    needs: plan
    if: needs.plan.outputs.roll == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/cloud-vm-image-bake.yml
    with:
      mode: bake
      clones: "5"
      keep_snapshot: true
      probes: true
      agent_tools: true
      layered: true
      roll: true
      # Only a dispatch that asks: a build or push roll has no inputs, so it bakes the image alone, as before.
      large_image: ${{ inputs.large_image == true }}
      cmux_tui_commit: ${{ needs.plan.outputs.pin }}
    # The bake's Freestyle key and UI test login are repository secrets: a called workflow gets them only when
    # passed, so exactly these three pass (never `secrets: inherit`). The bake job runs in cmux-next-vm-image-dev.
    secrets:
      FREESTYLE_API_KEY: ${{ secrets.FREESTYLE_API_KEY }}
      CMUX_UITEST_STACK_EMAIL: ${{ secrets.CMUX_UITEST_STACK_EMAIL }}
      CMUX_UITEST_STACK_PASSWORD: ${{ secrets.CMUX_UITEST_STACK_PASSWORD }}

  promote:
    needs: [plan, bake]
    if: needs.plan.outputs.roll == 'true' && needs.bake.result == 'success' && needs.bake.outputs.candidate != ''
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.CI_DEPLOY_SKIP_FLEET != '1' && 'cmux-gcp-deploy-jit-x64' || vars.CI_CLOUD_OVERFLOW_SAVED && fromJSON(vars.RUNNER_POOLS).linux_8 || fromJSON(vars.RUNNER_POOLS).linux_4 }}
    timeout-minutes: 15
    # A production change: the environment that deploys production (feat-cmux-next only) bounds the push App key.
    environment: cmux-vm-production
    permissions:
      contents: read
    outputs:
      result: ${{ steps.push.outputs.result }}
      sha: ${{ steps.push.outputs.sha }}
      image: ${{ steps.message.outputs.image }}
    steps:
      # A persistent pool VM keeps the last job's checkout as a git cache. One left sparse (patterns, skip-worktree
      # bits) or with a ref to a missing object makes actions/checkout leave files out or fail (runs 44739498261 and
      # 44733869883, 2026-11-20); remove it so checkout clones fresh. Its manual test: test_ci_reused_sparse_checkout.py.
      - name: Remove a reused workspace left sparse or broken (self-hosted Linux)
        working-directory: ${{ github.workspace }}
        if: runner.os == 'Linux'
        shell: bash
        run: |
          [ "${RUNNER_ENVIRONMENT:-}" = self-hosted ] && [ -e "$GITHUB_WORKSPACE/.git" ] || exit 0
          cd "$GITHUB_WORKSPACE"
          why=""
          if [ "$(git config --get core.sparseCheckout 2>/dev/null)" = true ] || [ -e .git/info/sparse-checkout ]; then
            why="sparse"
          elif git ls-files -v 2>/dev/null | grep -q '^S'; then
            why="skip-worktree entries"
          elif ! git rev-parse --verify -q 'HEAD^{commit}' >/dev/null; then
            why="HEAD does not resolve"
          elif git for-each-ref --format='%(objectname)' 2>/dev/null | git cat-file --batch-check 2>/dev/null | grep -q ' missing$'; then
            why="a ref names a missing object"
          else
            exit 0
          fi
          echo "reused workspace on ${RUNNER_NAME:-this runner}: $why; removing it so checkout starts clean"
          find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: refs/heads/feat-cmux-next
      # Full history without blobs: image-roll-push.sh asks auto-roll.ts behind whether the roll's pin is older
      # than the tip's, which a shallow window cannot answer (it refuses one). Only feat-cmux-next's: checkout's
      # fetch-depth 0 took every branch and tag, then fetched the tip's blobs lazily in one request, which GitHub
      # timed out (HTTP 408, run 44956612935, a good bake dropped). The tip comes with its blobs above.
      - name: Fetch feat-cmux-next's history without blobs
        run: |
          set -euo pipefail
          # A reused pool workspace can hold full history already, and --unshallow refuses a complete repository.
          unshallow=()
          if [ "$(git rev-parse --is-shallow-repository)" = true ]; then unshallow=(--unshallow); fi
          for try in 1 2 3; do
            git -c protocol.version=2 fetch --no-tags --no-recurse-submodules --filter=blob:none "${unshallow[@]}" origin \
              +refs/heads/feat-cmux-next:refs/remotes/origin/feat-cmux-next && exit 0
            echo "history fetch try $try failed; retrying"; sleep $((try * 15))
          done
          exit 1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
          no-cache: ${{ !startsWith(github.workspace, '/home/runner/work/') }}
      - name: Write the roll commit's message
        id: message
        env:
          PLAN: ${{ needs.plan.outputs.plan }}
          CANDIDATE: ${{ needs.bake.outputs.candidate }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          printf '%s' "$CANDIDATE" > "$RUNNER_TEMP/candidate.json"
          printf '%s' "$PLAN" > "$RUNNER_TEMP/plan.json"
          tui="$(jq -r .cmuxTui "$RUNNER_TEMP/plan.json")"
          # The attempt too: a re-run bakes a new snapshot, a new image with its own id (auto-roll.ts rolledImage).
          image="cloud-native-auto-${tui:0:8}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          {
            echo "cmux-vm: image roll ${image} (cmux-tui ${tui:0:8}) first in production"
            echo
            echo "$(jq -r .reason "$RUNNER_TEMP/plan.json")."
            echo "Gate passed on snapshot $(jq -r .snapshot_id "$RUNNER_TEMP/candidate.json"): $(jq -r '.smoke.detail // "the clone smoke"' "$RUNNER_TEMP/candidate.json"), and the agent tools probe with acp ensure for every picker harness (${RUN_URL})."
            echo
            jq -r '.fixes[] | "- \(.sha[0:12]) \(.subject)"' "$RUNNER_TEMP/plan.json"
            echo
            echo "Image-Roll-Run: ${GITHUB_RUN_ID}"
            echo "Image-Roll-Image: ${image}"
            echo "Image-Roll-Cmux-Tui: ${tui}"
          } > "$RUNNER_TEMP/message.txt"
          cat "$RUNNER_TEMP/message.txt"
      - name: Mint the push token
        id: push-token
        if: needs.plan.outputs.dry_run != 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.CMUX_PR_AUTOFIX_APP_ID }}
          private-key: ${{ secrets.CMUX_PR_AUTOFIX_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
      - name: Mint the cmux-platform push token
        id: platform-token
        if: vars.CMUX_VM_DEPLOY_ENABLED != '1'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.CMUX_PR_AUTOFIX_APP_ID }}
          private-key: ${{ secrets.CMUX_PR_AUTOFIX_APP_KEY }}
          owner: manaflow-ai
          repositories: cmux-platform
          permission-contents: write
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        if: vars.CMUX_VM_DEPLOY_ENABLED != '1'
        with:
          repository: manaflow-ai/cmux-platform
          ref: refs/heads/main
          path: cmux-platform
          token: ${{ steps.platform-token.outputs.token }}
          persist-credentials: false
          sparse-checkout: workers/cmux-vm/wrangler.jsonc
      # cmux-platform's CLOUD_VM_API_IMAGE pins (its root wrangler.jsonc): approve never trims one from a list. Production,
      # 2026-11-20: the pin was an auto-rolled id a roll trimmed, and a create that booted it answered image_withdrawn.
      # cmux-bot is installed on every repository (pr-autofix's installation does not have cmux-platform: roll
      # 44852142963's mint answered 404, 2026-11-20). Read-only, cmux-platform alone.
      - name: Mint the cmux-platform read token (its image pins)
        id: pins-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.CMUX_BOT_APP_ID }}
          private-key: ${{ secrets.CMUX_BOT_APP_KEY }}
          owner: manaflow-ai
          repositories: cmux-platform
          permission-contents: read
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: manaflow-ai/cmux-platform
          ref: refs/heads/main
          path: cmux-platform-pins
          token: ${{ steps.pins-token.outputs.token }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            wrangler.jsonc
      - name: Land the roll commit
        id: push
        env:
          TOKEN: ${{ steps.push-token.outputs.token }}
          PLATFORM_TOKEN: ${{ steps.platform-token.outputs.token }}
          PLATFORM_CHECKOUT: ${{ vars.CMUX_VM_DEPLOY_ENABLED != '1' && format('{0}/cmux-platform', github.workspace) || '' }}
          PIN: ${{ needs.plan.outputs.pin }}
          REVISION: ${{ needs.bake.outputs.revision }}
          DRY_RUN: ${{ needs.plan.outputs.dry_run == 'true' && '--dry-run' || '' }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086
          platform_args=()
          if [ -n "$PLATFORM_CHECKOUT" ]; then platform_args+=(--platform-checkout "$PLATFORM_CHECKOUT"); fi
          images/cmux-vm/image-roll-push.sh roll --candidate "$RUNNER_TEMP/candidate.json" --revision "$REVISION" \
            --run "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --pin "$PIN" --message-file "$RUNNER_TEMP/message.txt" $DRY_RUN "${platform_args[@]}" \
            --platform-wrangler "$GITHUB_WORKSPACE/cmux-platform-pins/wrangler.jsonc" | tee "$RUNNER_TEMP/push.out"
          tail -1 "$RUNNER_TEMP/push.out" | sed 's/^/Promotion: /' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the roll commit's diff
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cloud-vm-image-roll-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/image-roll.diff
            ${{ runner.temp }}/platform-image-roll.diff
            ${{ runner.temp }}/message.txt
            ${{ runner.temp }}/approve.json
          if-no-files-found: ignore
          retention-days: 3

  # The record and, on a red gate or promotion, the loud part: an ::error, the summary and a comment on the
  # one open cloud-image-roll issue. The GITHUB_TOKEN writes both; its push to the record branch starts nothing.
  report:
    needs: [plan, bake, promote]
    if: ${{ !cancelled() && needs.plan.outputs.roll == 'true' }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.CI_DEPLOY_SKIP_FLEET != '1' && 'cmux-gcp-deploy-jit-x64' || fromJSON(vars.RUNNER_POOLS).linux_4 }}
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
    steps:
      # A persistent pool VM keeps the last job's checkout as a git cache. One left sparse (patterns, skip-worktree
      # bits) or with a ref to a missing object makes actions/checkout leave files out or fail (runs 44739498261 and
      # 44733869883, 2026-11-20); remove it so checkout clones fresh. Its manual test: test_ci_reused_sparse_checkout.py.
      - name: Remove a reused workspace left sparse or broken (self-hosted Linux)
        working-directory: ${{ github.workspace }}
        if: runner.os == 'Linux'
        shell: bash
        run: |
          [ "${RUNNER_ENVIRONMENT:-}" = self-hosted ] && [ -e "$GITHUB_WORKSPACE/.git" ] || exit 0
          cd "$GITHUB_WORKSPACE"
          why=""
          if [ "$(git config --get core.sparseCheckout 2>/dev/null)" = true ] || [ -e .git/info/sparse-checkout ]; then
            why="sparse"
          elif git ls-files -v 2>/dev/null | grep -q '^S'; then
            why="skip-worktree entries"
          elif ! git rev-parse --verify -q 'HEAD^{commit}' >/dev/null; then
            why="HEAD does not resolve"
          elif git for-each-ref --format='%(objectname)' 2>/dev/null | git cat-file --batch-check 2>/dev/null | grep -q ' missing$'; then
            why="a ref names a missing object"
          else
            exit 0
          fi
          echo "reused workspace on ${RUNNER_NAME:-this runner}: $why; removing it so checkout starts clean"
          find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          sparse-checkout: images/cmux-vm
      - name: Record the roll
        env:
          TOKEN: ${{ github.token }}
          PLAN: ${{ needs.plan.outputs.plan }}
          CANDIDATE: ${{ needs.bake.outputs.candidate }}
          BAKE: ${{ needs.bake.result }}
          PROMOTE: ${{ needs.promote.result }}
          RESULT: ${{ needs.promote.outputs.result }}
          SHA: ${{ needs.promote.outputs.sha }}
          IMAGE: ${{ needs.promote.outputs.image }}
          REVISION: ${{ needs.bake.outputs.revision }}
          LIVE_FAILING: ${{ needs.bake.outputs.live_failing }}
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gate=failed
          if [ "$BAKE" = success ] && [ -n "$CANDIDATE" ]; then gate=passed; fi
          outcome="$gate"
          if [ "$gate" = passed ]; then outcome="${RESULT:-promote-failed}"; fi
          jq -n --argjson plan "$PLAN" --arg candidate "${CANDIDATE:-}" --arg gate "$gate" --arg bake "$BAKE" --arg promote "$PROMOTE" \
            --arg result "${RESULT:-}" --arg sha "${SHA:-}" --arg image "${IMAGE:-}" --arg revision "${REVISION:-}" --arg now "$now" --arg run "$RUN_URL" \
            '{schema: 1, run: $run, recorded_at: $now, reason: $plan.reason, dry_run: $plan.dryRun, cmux_tui: $plan.cmuxTui,
              fixes: $plan.fixes, fixes_truncated: $plan.fixesTruncated,
              gate: ({result: $gate, bake_job: $bake, done_at: $now} + (if $candidate != "" then {snapshot_id: ($candidate | fromjson | .snapshot_id), detail: ($candidate | fromjson | .smoke.detail)} else {} end)),
              promotion: {result: (if $gate == "passed" then (if $result == "" then "failed" else $result end) else "not-run" end), job: $promote,
                commit: $sha, image: $image, revision: $revision, at: (if $result == "pushed" then $now else null end)},
              rolled_back: false}' \
            | bash images/cmux-vm/image-roll-record.sh "$GITHUB_RUN_ID" || echo "::warning title=Image roll record::the record was not written"
          echo "Outcome: ${outcome}. Record: \`cloud-image-rolls:rolls/${GITHUB_RUN_ID}.json\`." >> "$GITHUB_STEP_SUMMARY"
          # Checks that fail on the candidate and already failed on the live image warned and did not block: whatever
          # the outcome, they go on the one open cloud-image-live-failing issue (opened when there is none).
          if [ -n "${LIVE_FAILING//[[:space:]]/}" ]; then
            live_body="$(printf 'Cloud VM image roll %s (outcome: %s): these checks fail on the candidate and already failed on the live image, so they warned and did not block. %s\n\n%s\n' "$GITHUB_RUN_ID" "$outcome" "$RUN_URL" "$LIVE_FAILING")"
            live_issue="$(gh issue list --repo "$GITHUB_REPOSITORY" --label cloud-image-live-failing --state open --limit 1 --json number --jq '.[0].number // empty' || true)"
            if [ -n "$live_issue" ]; then
              gh issue comment "$live_issue" --repo "$GITHUB_REPOSITORY" --body "$live_body" || echo "::warning title=Cloud VM image roll::the live-failing comment was not posted"
            else
              gh label create cloud-image-live-failing --repo "$GITHUB_REPOSITORY" --color FBCA04 --description "A Cloud VM image check that already fails on the live image" --force > /dev/null || true
              gh issue create --repo "$GITHUB_REPOSITORY" --label cloud-image-live-failing --title "Cloud VM image checks already failing on the live image" --body "$live_body" \
                || echo "::warning title=Cloud VM image roll::the live-failing issue was not filed"
            fi
          fi
          case "$outcome" in
            pushed|dry-run|nothing) exit 0 ;;
          esac
          what="the gate (bake, 5-clone smoke, agent tools probe or its picker harness ensure) failed; production stays on its image"
          [ "$gate" = passed ] && what="the gate passed but the promotion commit did not land; production stays on its image"
          echo "::error title=Cloud VM image roll::${what}"
          body="Cloud VM image roll ${GITHUB_RUN_ID}: ${what}. $(jq -r .reason <<< "$PLAN"). ${RUN_URL}"
          issue="$(gh issue list --repo "$GITHUB_REPOSITORY" --label cloud-image-roll --state open --limit 1 --json number --jq '.[0].number // empty' || true)"
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh label create cloud-image-roll --repo "$GITHUB_REPOSITORY" --color B60205 --description "Cloud VM image roll gate, promotion or rollback" --force > /dev/null || true
            gh issue create --repo "$GITHUB_REPOSITORY" --label cloud-image-roll --title "Cloud VM image roll is red" --body "$body" \
              || gh issue create --repo "$GITHUB_REPOSITORY" --title "Cloud VM image roll is red" --body "$body"
          fi
          exit 1
