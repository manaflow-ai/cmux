name: Issue status helper

on:
  pull_request:
    paths:
      - scripts/issue-status.sh
      - tests/test_issue_status.py
      - CLAUDE.md
      - .github/pull_request_template.md
      - .github/workflows/claude.yml
      - .github/workflows/issue-status-tests.yml
  push:
    branches: [main]
    paths:
      - scripts/issue-status.sh
      - tests/test_issue_status.py
      - CLAUDE.md
      - .github/pull_request_template.md
      - .github/workflows/claude.yml
      - .github/workflows/issue-status-tests.yml

permissions:
  contents: read

concurrency:
  group: issue-status-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ${{ vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Validate shell syntax
        run: bash -n scripts/issue-status.sh
      - name: Run issue status contract tests
        run: python3 tests/test_issue_status.py
