name: Resolve manual workflow ref

on:
  workflow_call:
    inputs:
      ref:
        description: Branch, tag, full SHA, or short SHA to resolve
        required: false
        type: string
        default: ""
    outputs:
      sha:
        description: Resolved 40-character commit SHA
        value: ${{ jobs.resolve.outputs.sha }}
      trusted_ref:
        description: >-
          true when the code is this run's own revision (no ref requested) or the
          head of a branch of this repository; false for any other commit, such as
          a fork pull request's head or merge ref, which must not run on an owned
          Mac (docs/ci-runners.md, "Side lanes on owned minis")
        value: ${{ jobs.resolve.outputs.trusted_ref }}

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-4vcpu-ubuntu-2404' || vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 2
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      trusted_ref: ${{ steps.trust.outputs.trusted_ref }}
    steps:
      # Both lookups below share this client. It names the HTTP status, the
      # API message, the rate-limit headers and the request id when GitHub
      # refuses a request, and it retries a bounded number of times on rate
      # limits (403 or 429 that say so), server errors, network errors and,
      # for a full commit SHA, a 404 or 422.
      #
      # The job's token draws on the repository's Actions installation rate
      # limit, which other workflows share. On 2026-10-26 that limit refused
      # the commits lookup with 403 "API rate limit exceeded for
      # installation" (runs 40390735963, 40390967082, 40250717721); a retry
      # two seconds later succeeded (run 40392089700).
      - name: Write GitHub API client
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/github_api_get.py" <<'PY'
          """GET one GitHub REST API path and print the JSON body to stdout.

          usage: github_api_get.py PATH [final|retry]
          The second argument says whether a 404 or 422 is final (the default)
          or worth retrying.
          Exits 1 with a one-line diagnosis on stderr when every attempt fails.
          """
          import json
          import os
          import sys
          import time
          import urllib.error
          import urllib.request

          ATTEMPTS = 4
          REQUEST_TIMEOUT_SECONDS = 10
          MAX_DELAY_SECONDS = 20


          def describe_http_error(error):
              try:
                  body = error.read().decode("utf-8", "replace")
              except Exception:
                  body = ""
              message = body
              try:
                  message = json.loads(body).get("message", body)
              except Exception:
                  pass
              message = " ".join(str(message).split())[:300]
              headers = error.headers or {}
              details = [f"HTTP {error.code} {error.reason}"]
              if message:
                  details.append(message)
              for name in (
                  "x-ratelimit-resource",
                  "x-ratelimit-limit",
                  "x-ratelimit-used",
                  "x-ratelimit-remaining",
                  "x-ratelimit-reset",
                  "retry-after",
                  "x-github-request-id",
              ):
                  if headers.get(name):
                      details.append(f"{name}={headers.get(name)}")
              return ": ".join(details[:2]) + "".join(f" {d}" for d in details[2:]), body


          def retry_delay(error, body, attempt, retry_not_found):
              base = float(os.environ.get("GITHUB_API_RETRY_BASE_SECONDS", "2"))
              backoff = min(base * (2 ** attempt), MAX_DELAY_SECONDS)
              if not isinstance(error, urllib.error.HTTPError):
                  return backoff
              headers = error.headers or {}
              rate_limited = error.code == 429 or (
                  error.code == 403
                  and (
                      headers.get("x-ratelimit-remaining") == "0"
                      or "rate limit" in body.lower()
                  )
              )
              if rate_limited:
                  try:
                      return min(max(float(headers.get("retry-after", "")), backoff), MAX_DELAY_SECONDS)
                  except ValueError:
                      return backoff
              if error.code >= 500:
                  return backoff
              if retry_not_found and error.code in (404, 422):
                  return backoff
              return None


          def main():
              path = sys.argv[1]
              retry_not_found = sys.argv[2:3] == ["retry"]
              api = os.environ.get("GITHUB_API_URL", "https://api.github.com").rstrip("/")
              request = urllib.request.Request(
                  f"{api}/{path.lstrip('/')}",
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              for attempt in range(ATTEMPTS):
                  try:
                      with urllib.request.urlopen(request, timeout=REQUEST_TIMEOUT_SECONDS) as response:
                          payload = json.load(response)
                  except urllib.error.HTTPError as error:
                      diagnosis, body = describe_http_error(error)
                      delay = retry_delay(error, body, attempt, retry_not_found)
                  except Exception as error:
                      diagnosis = f"{type(error).__name__}: {error}"
                      delay = retry_delay(error, "", attempt, retry_not_found)
                  else:
                      json.dump(payload, sys.stdout)
                      return 0
                  print(f"GET {path} attempt {attempt + 1}/{ATTEMPTS}: {diagnosis}", file=sys.stderr)
                  if delay is None or attempt + 1 == ATTEMPTS:
                      print(diagnosis, file=sys.stderr)
                      return 1
                  time.sleep(delay)
              return 1


          sys.exit(main())
          PY

      - name: Resolve requested revision
        id: resolve
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REQUESTED_REF: ${{ inputs.ref }}
          DEFAULT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          target_sha="$DEFAULT_SHA"
          if [ -n "$REQUESTED_REF" ]; then
            not_found=final
            if [[ "$REQUESTED_REF" =~ ^[0-9a-f]{40}$ ]]; then
              not_found=retry
            fi
            encoded_ref="$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$REQUESTED_REF")"
            if ! commit_json="$(python3 "$RUNNER_TEMP/github_api_get.py" "repos/$GITHUB_REPOSITORY/commits/$encoded_ref" "$not_found" 2>"$RUNNER_TEMP/resolve.err")"; then
              cat "$RUNNER_TEMP/resolve.err" >&2
              echo "::error::unable to resolve requested revision $REQUESTED_REF ($(tail -n 1 "$RUNNER_TEMP/resolve.err"))" >&2
              exit 1
            fi
            cat "$RUNNER_TEMP/resolve.err" >&2
            target_sha="$(python3 -c 'import json, sys; print(json.load(sys.stdin)["sha"])' <<<"$commit_json")"
          fi
          if [[ ! "$target_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Resolved revision is not a full commit SHA" >&2
            exit 1
          fi
          echo "sha=$target_sha" >> "$GITHUB_OUTPUT"
          echo "Resolved workflow revision: $target_sha"

      # A requested SHA may come from the fork network (the commits API
      # resolves any of them). Only a branch head of this repository counts as
      # its own code; any failure answers false, which keeps the job off the
      # owned Macs.
      - name: Check the revision is a branch head of this repository
        id: trust
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REQUESTED_REF: ${{ inputs.ref }}
          SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          trusted=true
          if [ -n "$REQUESTED_REF" ]; then
            branches_json="$(python3 "$RUNNER_TEMP/github_api_get.py" "repos/$GITHUB_REPOSITORY/commits/$SHA/branches-where-head" || true)"
            trusted="$(python3 -c '
          import json, sys
          try:
              branches = json.loads(sys.stdin.read())
          except Exception:
              branches = []
          print("true" if isinstance(branches, list) and branches else "false")
          ' <<<"$branches_json")"
          fi
          echo "trusted_ref=$trusted" >> "$GITHUB_OUTPUT"
          echo "Branch head of this repository: $trusted"
