name: Resolve manual workflow ref

on:
  workflow_call:
    inputs:
      ref:
        description: Branch, tag, full SHA, or short SHA to resolve
        required: false
        type: string
        default: ""
    outputs:
      sha:
        description: Resolved 40-character commit SHA
        value: ${{ jobs.resolve.outputs.sha }}
      trusted_ref:
        description: >-
          true when the code is this run's own revision (no ref requested) or the
          head of a branch of this repository; false for any other commit, such as
          a fork pull request's head or merge ref, which must not run on an owned
          Mac (docs/ci-runners.md, "Side lanes on owned minis")
        value: ${{ jobs.resolve.outputs.trusted_ref }}

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-4vcpu-ubuntu-2404' || vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 2
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      trusted_ref: ${{ steps.trust.outputs.trusted_ref }}
    steps:
      - name: Resolve requested revision
        id: resolve
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REQUESTED_REF: ${{ inputs.ref }}
          DEFAULT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          target_sha="$DEFAULT_SHA"
          if [ -n "$REQUESTED_REF" ]; then
            target_sha="$(python3 - "$GITHUB_REPOSITORY" "$REQUESTED_REF" <<'PY'
          import json
          import os
          import sys
          import urllib.parse
          import urllib.request

          repository, requested_ref = sys.argv[1:3]
          encoded_ref = urllib.parse.quote(requested_ref, safe="")
          request = urllib.request.Request(
              f"https://api.github.com/repos/{repository}/commits/{encoded_ref}",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  payload = json.load(response)
          except Exception as error:
              raise SystemExit(
                  f"unable to resolve requested revision ({type(error).__name__})"
              ) from None
          print(payload["sha"])
          PY
          )"
          fi
          if [[ ! "$target_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Resolved revision is not a full commit SHA" >&2
            exit 1
          fi
          echo "sha=$target_sha" >> "$GITHUB_OUTPUT"
          echo "Resolved workflow revision: $target_sha"

      # A requested SHA may come from the fork network (the commits API
      # resolves any of them). Only a branch head of this repository counts as
      # its own code; any failure answers false, which keeps the job off the
      # owned Macs.
      - name: Check the revision is a branch head of this repository
        id: trust
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REQUESTED_REF: ${{ inputs.ref }}
          SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          trusted=true
          if [ -n "$REQUESTED_REF" ]; then
            trusted="$(python3 - "$GITHUB_REPOSITORY" "$SHA" <<'PY'
          import json
          import os
          import sys
          import urllib.request

          repository, sha = sys.argv[1:3]
          request = urllib.request.Request(
              f"https://api.github.com/repos/{repository}/commits/{sha}/branches-where-head",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  branches = json.load(response)
          except Exception:
              branches = []
          print("true" if isinstance(branches, list) and branches else "false")
          PY
          )"
          fi
          echo "trusted_ref=$trusted" >> "$GITHUB_OUTPUT"
          echo "Branch head of this repository: $trusted"
