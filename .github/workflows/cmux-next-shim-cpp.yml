name: cmux-next CEF shim C++ tests

# The CEF shim's download and popup bookkeeping (CEFShim/src/download_state.h)
# needs no CEF: scripts/cmux-next/test-shim-downloads-cpp.sh compiles its cases
# with one clang++ call and runs them. The shim itself is built only by the
# app build, so this is the one check that runs these cases on every change.
# Push filters have no branch list, so a side branch shows its result before
# it lands on feat-cmux-next.

on:
  pull_request:
    paths:
      - Packages/macOS/CmuxNext/CEFShim/**
      - scripts/cmux-next/test-shim-downloads-cpp.sh
      - .github/workflows/cmux-next-shim-cpp.yml
  push:
    paths:
      - Packages/macOS/CmuxNext/CEFShim/**
      - scripts/cmux-next/test-shim-downloads-cpp.sh
      - .github/workflows/cmux-next-shim-cpp.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmux-next-shim-cpp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shim-downloads-cpp:
    name: CEF shim download state (C++)
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-6vcpu-macos-26' || vars.CI_PR_POOL_OWNED == '1' && contains(fromJSON('["pull_request","push","workflow_dispatch"]'), github.event_name) && (github.run_attempt == 1 && (vars.CI_LIGHT_LANE_RUNNER || vars.CI_SIDE_LANE_RUNNER)) || vars.CI_PAID_MACOS_OVERFLOW == '1' && vars.MACOS_RUNNER_26 || 'blacksmith-6vcpu-macos-26') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Select pinned Xcode
        run: ./scripts/select-ci-xcode.sh
      - name: Download tokens, URL schemes and pending popups
        run: ./scripts/cmux-next/test-shim-downloads-cpp.sh
