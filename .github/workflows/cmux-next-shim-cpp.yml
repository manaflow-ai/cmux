name: cmux-next CEF shim C++ tests

# The CEF shim's download and popup bookkeeping (CEFShim/src/download_state.h)
# and the password reveal relay (CEFShim/src/password_reveal_relay.h, which must
# zero its copy of a revealed password) and the local file handoff
# (CEFShim/src/local_file_handoff.h) and the local file scope
# (CEFShim/src/local_file_scope.h) need no CEF:
# scripts/cmux-next/test-shim-downloads-cpp.sh,
# scripts/cmux-next/test-password-reveal-relay-cpp.sh and
# scripts/cmux-next/test-local-file-handoff-cpp.sh compile their cases with
# one clang++ call each and run them (scripts/cmux-next/lib/cxx.sh picks the
# compiler: Ubuntu's clang++ here, the selected Xcode's on a Mac). So do the
# agent URL rule, the per-profile proxy values, the DevTools message id
# scanner, the cmux-page:// path rules, the Chromium host wire and the file
# chooser bookkeeping.
# Every scripts/cmux-next/test-*-cpp.sh runs here. The shim itself is built only
# by the app build, so this is the one check that runs these cases on every
# change. Each step runs even when an earlier one failed, so one red case does
# not hide the others.
# Pushes run only on feat-cmux-next and main (plus pull requests); a side
# branch runs it with `gh workflow run cmux-next-shim-cpp.yml --ref <branch>`.

on:
  pull_request:
    paths:
      - Packages/macOS/CmuxNext/CEFShim/**
      - scripts/cmux-next/test-shim-downloads-cpp.sh
      - scripts/cmux-next/test-password-reveal-relay-cpp.sh
      - scripts/cmux-next/test-shim-switches-cpp.sh
      - scripts/cmux-next/test-auth-callback-policy-cpp.sh
      - scripts/cmux-next/test-local-file-handoff-cpp.sh
      - schemas/local-file-handoff/vectors.json
      - scripts/cmux-next/test-local-file-scope-cpp.sh
      - schemas/local-file-scope/vectors.json
      - scripts/cmux-next/test-agent-url-policy-cpp.sh
      - schemas/agent-url-policy/vectors.json
      - scripts/cmux-next/test-context-proxy-cpp.sh
      - scripts/cmux-next/test-shim-devtools-id-cpp.sh
      - scripts/cmux-next/test-cmux-page-path-cpp.sh
      - scripts/cmux-next/test-chromium-host-wire-cpp.sh
      - scripts/cmux-next/test-shim-file-dialog-cpp.sh
      - scripts/cmux-next/lib/cxx.sh
      - tests/test_cmux_next_shim_cpp_linux.py
      - .github/workflows/cmux-next-shim-cpp.yml
  push:
    branches:
      - feat-cmux-next
      - main
    paths:
      - Packages/macOS/CmuxNext/CEFShim/**
      - scripts/cmux-next/test-shim-downloads-cpp.sh
      - scripts/cmux-next/test-password-reveal-relay-cpp.sh
      - scripts/cmux-next/test-shim-switches-cpp.sh
      - scripts/cmux-next/test-auth-callback-policy-cpp.sh
      - scripts/cmux-next/test-local-file-handoff-cpp.sh
      - schemas/local-file-handoff/vectors.json
      - scripts/cmux-next/test-local-file-scope-cpp.sh
      - schemas/local-file-scope/vectors.json
      - scripts/cmux-next/test-agent-url-policy-cpp.sh
      - schemas/agent-url-policy/vectors.json
      - scripts/cmux-next/test-context-proxy-cpp.sh
      - scripts/cmux-next/test-shim-devtools-id-cpp.sh
      - scripts/cmux-next/test-cmux-page-path-cpp.sh
      - scripts/cmux-next/test-chromium-host-wire-cpp.sh
      - scripts/cmux-next/test-shim-file-dialog-cpp.sh
      - scripts/cmux-next/lib/cxx.sh
      - tests/test_cmux_next_shim_cpp_linux.py
      - .github/workflows/cmux-next-shim-cpp.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmux-next-shim-cpp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shim-downloads-cpp:
    name: CEF shim download state (C++)
    # Header-only C++ with no CEF and no Apple SDK: Linux, off the Mac pools.
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-4vcpu-ubuntu-2404' || !startsWith(vars.LINUX_RUNNER, 'blacksmith-') && vars.LINUX_RUNNER || vars.CI_CLOUD_OVERFLOW_SAVED && 'blacksmith-8vcpu-ubuntu-2404' || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Download tokens, URL schemes and pending popups
        run: ./scripts/cmux-next/test-shim-downloads-cpp.sh
      - name: Password reveal relay zeroes its copy
        if: ${{ !cancelled() }}
        run: ./scripts/cmux-next/test-password-reveal-relay-cpp.sh
      - name: Feature-list switches merge with CEF's own lists
        if: ${{ !cancelled() }}
        run: ./scripts/cmux-next/test-shim-switches-cpp.sh
      - name: Sign-in session callbacks end only their own session
        if: ${{ !cancelled() }}
        run: ./scripts/cmux-next/test-auth-callback-policy-cpp.sh
      - name: Local file handoff (shared vectors)
        if: ${{ !cancelled() }}
        run: ./scripts/cmux-next/test-local-file-handoff-cpp.sh
      - name: Local file pages load files from their own folder only (shared vectors)
        if: ${{ !cancelled() }}
        run: ./scripts/cmux-next/test-local-file-scope-cpp.sh
      - name: Agent URL refusal (shared vectors)
        if: ${{ !cancelled() }}
        run: ./scripts/cmux-next/test-agent-url-policy-cpp.sh
      - name: Remote machine profiles send all traffic to the app's proxy
        if: ${{ !cancelled() }}
        run: ./scripts/cmux-next/test-context-proxy-cpp.sh
      - name: DevTools message id scanner
        if: ${{ !cancelled() }}
        run: ./scripts/cmux-next/test-shim-devtools-id-cpp.sh
      - name: cmux-page:// paths, MIME types and ids
        if: ${{ !cancelled() }}
        run: ./scripts/cmux-next/test-cmux-page-path-cpp.sh
      - name: Chromium host wire matches the golden frame
        if: ${{ !cancelled() }}
        run: ./scripts/cmux-next/test-chromium-host-wire-cpp.sh
      - name: File chooser requests are answered once and cancelled with their browser
        if: ${{ !cancelled() }}
        run: ./scripts/cmux-next/test-shim-file-dialog-cpp.sh
