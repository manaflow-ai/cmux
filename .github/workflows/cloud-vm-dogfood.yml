name: Cloud VM dogfood journey

# One timed trip through NEXT Cloud's cmux VM API (vm.cmux.dev, vm-staging.cmux.dev;
# workers/cmux-vm/openapi.json): create, list, exec, agent CLIs present, a named
# terminal over WebSocket, pause and resume with memory kept, the same terminal
# reattached, delete. The public cmux-tui install is timed alongside. The job
# summary carries every step's time; the artifact carries the JSON. The VM is
# made with the cmux-vm environment's smoke key and deleted by its exact id.
on:
  workflow_dispatch:
    inputs:
      target:
        description: Backend to dogfood
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production
      skip_sleep:
        description: Skip the pause and resume leg
        required: false
        default: false
        type: boolean
      lifecycle:
        description: Also run the agent-VM lifecycle leg (fork, snapshot, stop/start, auto-delete, self-delete, key revoke; API and CLI)
        required: false
        default: false
        type: boolean
      paused_reads:
        description: Also time paused reads (listing, open, whole-tree search) through the files routes, n=30/30/5, no resume (RFD 0144 piece 2)
        required: false
        default: false
        type: boolean
      egress_allowlist:
        description: Also run the egress allowlist red team (an allowlisted VM reaches api.anthropic.com, cannot POST to an outside host or raw IP)
        required: false
        default: false
        type: boolean
      confirm_production:
        description: Required when target is production (creates one paid VM for a few minutes)
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: cloud-vm-dogfood-${{ inputs.target }}
  cancel-in-progress: false

env:
  # Temporary REST budget attribution: one gh-call line per GitHub API call (scripts/ci/api_call_log/env.sh, fetched at a fixed commit when the checkout has no copy).
  BASH_ENV: '$({ w="${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh"; t="${RUNNER_TEMP:-/nonexistent}/api-call-log-src"; if [ -f "$w" ]; then echo "$w"; elif [ -n "${RUNNER_TEMP:-}" ]; then if [ ! -f "$t/env.sh" ] && [ ! -e "$t.tried" ] && { [ "${RUNNER_OS:-}" = Linux ] || [ "${RUNNER_OS:-}" = macOS ]; } && [ "$(date -u +%Y%m%d%H)" -lt 2026112300 ]; then : > "$t.tried"; mkdir -p "$t.part" && for x in env.sh gh sitecustomize.py isolated.py; do curl -fsSL --max-time 5 -o "$t.part/$x" "https://raw.githubusercontent.com/manaflow-ai/cmux/27647ffd3ae838c63be28ca3e5883dcd68c34518/scripts/ci/api_call_log/$x" || break; done; [ -s "$t.part/isolated.py" ] && mv "$t.part" "$t"; fi; if [ -f "$t/env.sh" ]; then echo "$t/env.sh"; else echo unset BASH_ENV > "$t.off.sh" && echo "$t.off.sh"; fi; fi; } 2>/dev/null)'

jobs:
  # Exercise the rolling public install path in a disposable job that receives
  # no repository secret. Its binary crosses into the journey only after a
  # separate no-secret job verifies its published digest and provenance.
  public-installer-smoke:
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || 'cmux-linux' }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Install cmux-tui the way users do
        run: |
          set -euo pipefail
          export CMUX_INSTALL="$RUNNER_TEMP/public-cmux"
          started=$(date +%s%3N)
          curl --proto '=https' --tlsv1.2 -fsSL https://cmux.com/tui/install.sh | sh
          "$CMUX_INSTALL/bin/cmux" --version
          CMUX_TUI_INSTALL_MS=$(( $(date +%s%3N) - started ))
          artifact="$RUNNER_TEMP/public-cmux-artifact"
          mkdir -p "$artifact"
          test -f "$CMUX_INSTALL/bin/cmux" && test ! -L "$CMUX_INSTALL/bin/cmux"
          install -m 755 "$CMUX_INSTALL/bin/cmux" "$artifact/cmux"
          printf '%s\n' "$CMUX_TUI_INSTALL_MS" > "$artifact/install-ms"

      - name: Upload the public-installed binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cloud-vm-dogfood-public-cmux
          path: ${{ runner.temp }}/public-cmux-artifact
          if-no-files-found: error
          retention-days: 1

  # Authenticate the exact bytes produced by the public installer. This job
  # still receives no repository secret and never executes the downloaded
  # artifact before its digest and source provenance pass.
  installer:
    needs: public-installer-smoke
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || 'cmux-linux' }}
    timeout-minutes: 20
    permissions:
      attestations: read
      contents: read
    steps:
      - name: Download the public-installed binary
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: cloud-vm-dogfood-public-cmux
          path: ${{ runner.temp }}/public-cmux

      # Only the protected feat-cmux-next tip's scripts/ci, for the attestation helper (#48350 put it there and
      # main never got it; run 45620842266 failed on a pool runner's apt gh 2.45 without it). A full-history
      # fetch outran the job's 10 minutes on pool runners (runs 45596156615, 45596705573): ancestry against
      # main is asked of GitHub below.
      - name: Checkout the trusted CI helpers
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: refs/heads/feat-cmux-next
          fetch-depth: 1
          sparse-checkout: scripts/ci
          persist-credentials: false

      # github.token is one actor for every workflow in the repo, and its "API rate limit exceeded for
      # installation" 403 failed this step twice on 2026-11-26 (runs 45789408337, 45791953357), skipping the
      # journey. The cmux-bot App is its own actor (scripts/ci/gh_app_token.sh, as nightly.yml does with the
      # release App), with github.token as the fallback and a bounded back-off. Not the release App: its
      # CMUX_RELEASE_APP_* secrets live only in the release and nightly environments, so in this job (no
      # environment) the mint got an empty app-id and the step hit the same 403 (run 45814163539). cmux-bot's
      # app id is a repository variable and its key a repository secret (pr-router.yml mints it the same way).
      # The attestation gh goes on PATH first, so the wrapper wraps it rather than the pool VM's apt gh 2.45.
      - name: Put a gh with the attestation command on PATH
        run: source scripts/ci/ensure-gh-attestation.sh

      - name: Mint the cmux-bot App token for this job's gh calls
        id: gh-app-token
        if: ${{ vars.CMUX_BOT_APP_ID != '' }}
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.CMUX_BOT_APP_ID }}
          private-key: ${{ secrets.CMUX_BOT_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: read

      - name: Send this job's gh calls as the cmux-bot App, github.token as the fallback
        env:
          GH_APP_TOKEN: ${{ steps.gh-app-token.outputs.token }}
          GH_FALLBACK_TOKEN: ${{ github.token }}
        run: bash scripts/ci/gh_app_token.sh --install

      - name: Verify the public-installed cmux-tui binary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          public="$RUNNER_TEMP/public-cmux/cmux"
          test -f "$public" && test ! -L "$public"
          attestation="$RUNNER_TEMP/cmux-tui-attestation.json"
          # A pool VM's apt gh (2.45) has no `gh attestation`; the helper installs a pinned gh that has it.
          # It also defines gh_waiting_out_rate_limit: the repository's shared token budget ran out at
          # this step on staging and production at once (runs 45682713296 and 45683201692).
          source scripts/ci/ensure-gh-attestation.sh
          gh_waiting_out_rate_limit attestation verify "$public" \
            --repo manaflow-ai/cmux \
            --signer-workflow manaflow-ai/cmux/.github/workflows/cmux-tui-artifacts.yml \
            --source-ref refs/heads/main \
            --format json > "$attestation"
          commit="$(jq -er '[.[].verificationResult.signature.certificate.sourceRepositoryDigest] | unique | if length == 1 then .[0] else error("attestations disagree on source digest") end' "$attestation")"
          workflow="$(jq -er '[.[].verificationResult.statement.predicate.buildDefinition.externalParameters.workflow.path] | unique | if length == 1 then .[0] else error("attestations disagree on workflow path") end' "$attestation")"
          ref="$(jq -er '[.[].verificationResult.signature.certificate.sourceRepositoryRef] | unique | if length == 1 then .[0] else error("attestations disagree on source ref") end' "$attestation")"
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          [ "$workflow" = .github/workflows/cmux-tui-artifacts.yml ]
          [ "$ref" = refs/heads/main ]
          # The attested commit is main itself or behind it (an ancestor of main's tip).
          relation="$(gh_waiting_out_rate_limit api "repos/$GITHUB_REPOSITORY/compare/$commit...main" --jq .status)"
          [[ "$relation" = ahead || "$relation" = identical ]]
          digest="$(sha256sum "$public" | awk '{print $1}')"
          [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
          install_ms="$(cat "$RUNNER_TEMP/public-cmux/install-ms")"
          [[ "$install_ms" =~ ^[0-9]+$ ]]
          out="$RUNNER_TEMP/trusted-cmux"
          mkdir -p "$out"
          install -m 755 "$public" "$out/cmux"
          printf '%s\n' "$commit" > "$out/source-commit"
          printf '%s\n' "$digest" > "$out/sha256"
          printf '%s\n' "$install_ms" > "$out/install-ms"

      - name: Upload the attested cmux-tui binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cloud-vm-dogfood-cmux
          path: ${{ runner.temp }}/trusted-cmux
          if-no-files-found: error
          retention-days: 1

  journey:
    needs: installer
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || 'cmux-linux' }}
    timeout-minutes: ${{ inputs.lifecycle && 80 || 45 }}
    # The cmux VM API's own environments (cmux-vm.yml smokes with the same keys). Paused reads on staging run as the
    # agent test account's Stack session instead (cmux-next-cloud-journey holds it, as vm-hassle.yml uses it): the files
    # routes need vm:files, which the staging smoke key was not issued (run 45856090047 skipped the leg for it).
    environment: ${{ inputs.paused_reads && inputs.target == 'staging' && 'cmux-next-cloud-journey' || format('cmux-vm-{0}', inputs.target) }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: refs/heads/feat-cmux-next
          persist-credentials: false

      - name: Download the attested cmux-tui binary
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: cloud-vm-dogfood-cmux
          path: ${{ runner.temp }}/trusted-cmux

      - name: Verify the journey binary
        run: |
          set -euo pipefail
          binary="$RUNNER_TEMP/trusted-cmux/cmux"
          digest="$(cat "$RUNNER_TEMP/trusted-cmux/sha256")"
          install_ms="$(cat "$RUNNER_TEMP/trusted-cmux/install-ms")"
          [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
          [[ "$install_ms" =~ ^[0-9]+$ ]]
          echo "$digest  $binary" | sha256sum --check --strict
          chmod 755 "$binary"
          echo "CMUX_TUI_VERSION=$("$binary" --version | head -1)" >> "$GITHUB_ENV"
          echo "CMUX_TUI_INSTALL_MS=$install_ms" >> "$GITHUB_ENV"

      - name: Restore pinned Bun 1.4.4 from the CI cache bucket
        shell: bash
        continue-on-error: true
        run: bash "$GITHUB_WORKSPACE/scripts/ci/toolchain-r2.sh" restore bun 1.4.4 || true

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
          no-cache: ${{ !startsWith(github.workspace, '/home/runner/work/') }}

      - name: Guard
        env:
          TARGET: ${{ inputs.target }}
          CONFIRM_PRODUCTION: ${{ inputs.confirm_production }}
          STAGING_URL: ${{ vars.CMUX_VM_STAGING_URL }}
          PRODUCTION_URL: ${{ vars.CMUX_VM_PRODUCTION_URL }}
          HAS_TENANT_KEY: ${{ secrets.CMUX_VM_SMOKE_API_KEY != '' }}
          HAS_SERVICE_KEY: ${{ secrets.CMUX_VM_SMOKE_SERVICE_KEY != '' && vars.CMUX_VM_SMOKE_SERVICE_TEAM != '' }}
          SESSION_AUTH: ${{ inputs.paused_reads && inputs.target == 'staging' }}
          HAS_SESSION: ${{ secrets.CMUX_STAGING_STACK_EMAIL != '' && secrets.CMUX_STAGING_STACK_PASSWORD != '' }}
        run: |
          set -euo pipefail
          if [ "$TARGET" = "production" ] && [ "$CONFIRM_PRODUCTION" != "true" ]; then
            echo "::error::A production dogfood run requires confirm_production=true"
            exit 1
          fi
          if [ "$SESSION_AUTH" = true ]; then
            if [ "$HAS_SESSION" != true ]; then
              echo "::error::cmux-next-cloud-journey needs CMUX_STAGING_STACK_EMAIL and CMUX_STAGING_STACK_PASSWORD for paused reads on staging"
              exit 1
            fi
          elif [ "$HAS_TENANT_KEY" != true ] && [ "$HAS_SERVICE_KEY" != true ]; then
            echo "::error::cmux-vm-$TARGET needs CMUX_VM_SMOKE_API_KEY, or CMUX_VM_SMOKE_SERVICE_KEY with CMUX_VM_SMOKE_SERVICE_TEAM"
            exit 1
          fi
          if [ "$TARGET" = "production" ]; then url="${PRODUCTION_URL:-https://vm.cmux.dev}"; else url="${STAGING_URL:-https://vm-staging.cmux.dev}"; fi
          echo "CMUX_VM_DOGFOOD_URL=$url" >> "$GITHUB_ENV"

      # Runners have no IPv6 route; pin the API host IPv4 first (scripts/cmux-next/release/pin-host.ts).
      - name: Pin the API host's address
        continue-on-error: true
        run: |
          host="${CMUX_VM_DOGFOOD_URL#https://}"; host="${host%%/*}"
          line="$(bun scripts/cmux-next/release/pin-host.ts --host "$host" --wait-seconds 120)"
          echo "$line" | sudo tee -a /etc/hosts

      - name: Journey
        env:
          SKIP_SLEEP: ${{ inputs.skip_sleep }}
          LIFECYCLE: ${{ inputs.lifecycle }}
          EGRESS_ALLOWLIST: ${{ inputs.egress_allowlist }}
          PAUSED_READS: ${{ inputs.paused_reads }}
          CMUX_VM_SMOKE_API_KEY: ${{ secrets.CMUX_VM_SMOKE_API_KEY }}
          CMUX_VM_SMOKE_SERVICE_KEY: ${{ secrets.CMUX_VM_SMOKE_SERVICE_KEY }}
          CMUX_VM_SMOKE_SERVICE_TEAM: ${{ vars.CMUX_VM_SMOKE_SERVICE_TEAM }}
          SESSION_AUTH: ${{ inputs.paused_reads && inputs.target == 'staging' }}
          CMUX_DOGFOOD_STACK_EMAIL: ${{ inputs.paused_reads && inputs.target == 'staging' && secrets.CMUX_STAGING_STACK_EMAIL || '' }}
          CMUX_DOGFOOD_STACK_PASSWORD: ${{ inputs.paused_reads && inputs.target == 'staging' && secrets.CMUX_STAGING_STACK_PASSWORD || '' }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dogfood"
          args=(--result-file "$RUNNER_TEMP/dogfood/result.json")
          if [ "$SESSION_AUTH" = "true" ]; then args+=(--auth session); fi
          if [ "$SKIP_SLEEP" = "true" ]; then args+=(--skip-sleep); fi
          if [ "$EGRESS_ALLOWLIST" = "true" ]; then args+=(--egress-allowlist); fi
          if [ "$PAUSED_READS" = "true" ]; then args+=(--paused-reads); fi
          if [ "$LIFECYCLE" = "true" ]; then
            args+=(--lifecycle --cmux "$RUNNER_TEMP/trusted-cmux/cmux")
            # The public cmux is built from main and has no `cmux vm` yet: the CLI legs run the headless VM CLI
            # (the library `cmux vm` links) built from this checkout; a failed build fails the job. Without cargo the
            # journey skips them with a note.
            if command -v cargo >/dev/null; then
              (cd workers/cmux-vm/cli && cargo build --release --locked -p cmux-vm)
              args+=(--cmux-vm "$PWD/workers/cmux-vm/cli/target/release/cmux-vm")
            fi
          fi
          bun scripts/cmux-next/cloud-vm-dogfood-journey.ts "${args[@]}"

      - name: Summary
        if: ${{ always() }}
        env:
          TARGET: ${{ inputs.target }}
        run: |
          result="$RUNNER_TEMP/dogfood/result.json"
          [ -s "$result" ] || { echo "No result was written." >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          {
            echo "### Cloud dogfood journey ($TARGET, cmux VM API)"
            echo
            jq -r '"ok: \(.ok)" + (if .ok then "" else ", failed at `\(.stage)`: \(.error)" end)' "$result"
            echo
            echo "cmux-tui: ${CMUX_TUI_VERSION:-}"
            echo
            echo "| Step | ms |"
            echo "| --- | ---: |"
            echo "| installCmuxTui | ${CMUX_TUI_INSTALL_MS:-} |"
            jq -r '.timings | to_entries[] | "| \(.key | sub("Ms$"; "")) | \(.value) |"' "$result"
            echo
            jq -r 'if .statusAfterPauseSeries then "Pause status series: " + ([.statusAfterPauseSeries[] | "\(.atMs)ms=\(.status)"] | join(", ")) else empty end' "$result"
            jq -r 'if has("memoryKept") then "Memory kept across pause: \(.memoryKept)" else empty end' "$result"
            jq -r 'if .pausedReads.listing then "Paused reads (ms, no resume; stayed paused: \(.pausedReads.stayedPaused), 429s: \(.pausedReads.rateLimited)): " + ([("listing", "open", "search") as $k | .pausedReads[$k] | "\($k) n=\(.n) p50=\(.p50) p95=\(.p95)"] | join("; ")) else empty end' "$result"
            jq -r '(.lifecycleApi, .lifecycleCli, .lifecycleCleanup) // empty | to_entries[] | "- \(.key): \(.value)"' "$result"
            jq -r '.notes[]? | "- \(.)"' "$result"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload result
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cloud-vm-dogfood-${{ inputs.target }}
          path: ${{ runner.temp }}/dogfood
          if-no-files-found: warn
          retention-days: 3
