name: Swift logic ratchet

# Goal swift-share-falls: a pull request into feat-cmux-next may not raise swift_logic_lines + mirror_lines
# (scripts/cmux-next/swift-logic-lines.py) without saying why. Leo, 2026-11-07: "swift to anything but swift".
# The status comment's swift-logic line reported every pull request's growth from 2026-11-13 and the count still
# rose from 493,843 to about 512,000 by 2026-11-25: the 400 merges before 2026-11-25T23Z added 3,334 lines in 43
# pull requests and took out 329 in 6, none of them asked why. Growth now fails here until the description has
# a line `Swift-growth: <reason>`, as `size:` does for the bundle budget. Editing the description re-runs it.
#
# What the head can change: nothing this job runs. It checks out the merge commit and its first parent (the
# base), writes out the base's scripts/cmux-next with `git archive` and runs that checker, which reads both
# trees only through git. A count that cannot be made passes with a notice (swift-logic-delta.py --gate).
on:
  # Started only by pr-router.yml (scripts/ci/pr_router.json `affects`: a Swift file or the checker).
  workflow_call:

permissions: {}

# The description only matters through its `Swift-growth:` line: an edit with none before or after it measures
# nothing and takes its own group, so it never cancels a push's run (pattern pr-edit-fans-out-ci).
concurrency:
  group: swift-logic-ratchet-${{ github.event.pull_request.number }}${{ github.event.action == 'edited' && !(github.event.changes.body && (contains(github.event.pull_request.body, 'Swift-growth:') || contains(github.event.changes.body.from, 'Swift-growth:'))) && format('-edit-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  ratchet:
    name: Swift logic + mirror does not grow
    if: ${{ !(github.event.action == 'edited' && !(github.event.changes.body && (contains(github.event.pull_request.body, 'Swift-growth:') || contains(github.event.changes.body.from, 'Swift-growth:')))) }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || vars.CI_OVERFLOW_LINUX || 'cmux-linux' }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # The merge commit and its first parent, whole blobs (the count reads every Swift file of both trees);
      # a same-repo runner reads the git mirror, as pr-router.yml's checkout does. Only the checker is checked out.
      - name: Checkout the merge commit and the base tip
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 2
          sparse-checkout: |
            scripts/cmux-next
            .gitmodules
          sparse-checkout-cone-mode: false

      - name: Judge the growth with the base's checker
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          set -uo pipefail
          if ! git rev-parse -q --verify 'HEAD^2' >/dev/null; then
            echo "::notice title=Swift logic ratchet::no merge commit to compare; nothing judged"
            exit 0
          fi
          checker="$RUNNER_TEMP/base-checker"
          mkdir -p "$checker"
          if ! git archive HEAD^1 scripts/cmux-next | tar -x -C "$checker" \
              || ! grep -q -- '--gate' "$checker/scripts/cmux-next/swift-logic-delta.py"; then
            # The pull request that adds the ratchet: its base has no checker with --gate yet.
            echo "::notice title=Swift logic ratchet::the base's swift-logic-delta.py has no --gate yet; nothing judged"
            exit 0
          fi
          printf '%s' "$BODY" > "$RUNNER_TEMP/body.md"
          status=0
          timeout 600 python3 -I "$checker/scripts/cmux-next/swift-logic-delta.py" --repo "$GITHUB_WORKSPACE" \
            --base HEAD^1 --head HEAD --gate --body-file "$RUNNER_TEMP/body.md" > "$RUNNER_TEMP/ratchet.md" || status=$?
          cat "$RUNNER_TEMP/ratchet.md"
          grep -v '^::' "$RUNNER_TEMP/ratchet.md" >> "$GITHUB_STEP_SUMMARY" || true
          if [ "$status" -ne 0 ] && [ "$status" -ne 1 ]; then
            echo "::notice title=Swift logic ratchet::the checker exited $status (timeout or crash); not judged"
            exit 0
          fi
          exit "$status"
