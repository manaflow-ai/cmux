name: "CLA Assistant"
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened,closed,synchronize]

# Signature updates share one file and must not race.
concurrency:
  group: cla-signatures
  cancel-in-progress: false

# Keep the token scoped to the GitHub API operations used by this action.
permissions:
  # The action inspects prior runs; its optional rerun request is best-effort.
  actions: read
  contents: write
  issues: write
  # GitHub's pull_request_target token denied issue comments for fork PRs with
  # this set to read, despite the endpoint documentation allowing issues:write.
  # Keep write until that live behavior changes.
  pull-requests: write
  statuses: write

jobs:
  CLAAssistant:
    name: "CLA Assistant"
    runs-on: ${{ vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    steps:
      - name: "Authorize repository-owned reload snapshots"
        id: cla-provenance
        # The transport identity below is accepted only after GitHub confirms
        # that the PR is owned by the repository and the authenticated owner
        # triggered this run. A commit display name alone is forgeable.
        if: >-
          (
            github.event_name == 'pull_request_target' &&
            github.event.action != 'closed'
          ) ||
          (
            github.event_name == 'issue_comment' &&
            github.event.issue.pull_request &&
            (
              github.event.comment.body == 'recheck' ||
              github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
            )
          )
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          EVENT_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          allowlist='lawrencecchen,github-actions[bot],chatmux-connections[bot]'
          if [[ "$EVENT_ACTOR" == "austinywang" && -n "$PR_NUMBER" ]]; then
            pr_json="$(gh api "repos/${GH_REPOSITORY}/pulls/${PR_NUMBER}")"
            head_repo="$(jq -r '.head.repo.full_name // empty' <<<"$pr_json")"
            pr_author="$(jq -r '.user.login // empty' <<<"$pr_json")"
            author_association="$(jq -r '.author_association // empty' <<<"$pr_json")"
            if [[ "$head_repo" == "$GH_REPOSITORY" \
              && "$pr_author" == "austinywang" \
              && "$author_association" =~ ^(OWNER|MEMBER|COLLABORATOR)$ ]]; then
              # This exact name is emitted by the repository-owned HQ transport
              # while it snapshots a tree. It is never enabled for fork PRs or
              # runs triggered by an untrusted actor.
              allowlist+=',cmux reload-cloud'
            fi
          fi
          echo "allowlist=$allowlist" >> "$GITHUB_OUTPUT"

      - name: "CLA Assistant"
        # The action handles signing and status updates. Merged pull requests
        # use the explicit lock step below because the archived action sends
        # an invalid lock request.
        if: >-
          (
            github.event_name == 'pull_request_target' &&
            github.event.action != 'closed'
          ) ||
          (
            github.event_name == 'issue_comment' &&
            github.event.issue.pull_request &&
            (
              github.event.comment.body == 'recheck' ||
              github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
            )
          )
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: 'signatures/version1/cla.json'
          path-to-document: 'https://github.com/manaflow-ai/cmux/blob/main/CLA.md'
          # The archived action calls the lock endpoint without the required
          # lock_reason. Disable that broken path and use the explicit step
          # below, which supplies a valid reason and fails on API errors.
          lock-pullrequest-aftermerge: 'false'
          # signatures live on the unprotected cla-signatures branch so required checks on main don't block the bot's signature commits
          branch: 'cla-signatures'
          # The provenance step supplies the transport name only after the
          # repository/owner/actor checks above; otherwise this is the explicit
          # bot-only allowlist.
          allowlist: ${{ steps.cla-provenance.outputs.allowlist || 'lawrencecchen,github-actions[bot],chatmux-connections[bot]' }}

      - name: "Lock merged pull request"
        if: >-
          github.event_name == 'pull_request_target' &&
          github.event.action == 'closed' &&
          github.event.pull_request.merged == true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          issue_endpoint="repos/${GH_REPO}/issues/${PR_NUMBER}"
          lock_endpoint="${issue_endpoint}/lock"
          if [[ "$(gh api "${issue_endpoint}" --jq '.locked')" == "true" ]]; then
            echo "Pull request ${PR_NUMBER} is already locked"
            exit 0
          fi
          gh api --method PUT \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "${lock_endpoint}" \
            --field lock_reason=resolved
          [[ "$(gh api "${issue_endpoint}" --jq '.locked')" == "true" ]]
