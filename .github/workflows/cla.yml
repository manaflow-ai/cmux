name: "CLA Assistant"

on:
  issue_comment:
    types: [created]
  pull_request_target:
    branches: [main]
    types: [opened,reopened,synchronize,ready_for_review]

permissions: {}

env:
  CLA_GENERATION: "v2.2-action-212a0f2dd659b24b48a30ba35966e06dc41736af"

jobs:
  status:
    name: "CLA Assistant"
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.action != 'edited' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: cla-status-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: "Require GitHub-hosted runner"
        if: runner.environment != 'github-hosted'
        run: |
          set -euo pipefail
          echo "::error::CLA policy requires a GitHub-hosted runner"
          exit 1
      - name: "Read CLA signature ledger"
        if: runner.environment == 'github-hosted'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR_ID: ${{ github.event.pull_request.user.id }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          [[ "$PR_AUTHOR_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          ledger="$(mktemp)"
          commits_file="$(mktemp)"
          trap 'rm -f "$ledger" "$commits_file"' EXIT
          encoded="$(gh api --method GET --raw-field ref=cla-signatures "repos/$GH_REPO/contents/signatures/version2/cla.json" --jq .content)"
          [[ -n "$encoded" ]]
          printf '%s' "$encoded" | tr -d '[:space:]' | base64 --decode >"$ledger"
          pr_commit_count="$(gh api --method GET "repos/$GH_REPO/pulls/$PR_NUMBER" --jq .commits)"
          [[ "$pr_commit_count" =~ ^[0-9]+$ ]] && (( pr_commit_count <= 250 ))
          gh api --paginate --slurp "repos/$GH_REPO/pulls/$PR_NUMBER/commits?per_page=100" >"$commits_file"
          jq -e '[.[].[]?] | length <= 250' "$commits_file" >/dev/null
          jq -e --argjson author "$PR_AUTHOR_ID" --slurpfile commit_pages "$commits_file" '
            ($commit_pages[0]) as $commits |
            . as $ledger |
            ($ledger.signedContributors | type == "array") and
            ([ $author ] + [ $commits[].[]? | .author.id ] | all(.[]; type == "number")) and
            (([ $author ] + [ $commits[].[]? | .author.id ] | unique) as $ids |
              all($ids[]; . as $id |
                ($id == 54008264 or $id == 38676809 or $id == 67667005 or
                 any($ledger.signedContributors[]?; .id == $id))))
          ' "$ledger" >/dev/null

  writer:
    name: "CLA Assistant"
    if: >-
      (
        github.event_name == 'pull_request_target' &&
        github.event.action != 'edited' &&
        github.event.pull_request.head.repo.full_name != github.repository
      ) || (
        github.event_name == 'issue_comment' &&
        github.event.action == 'created' &&
        github.event.issue.state == 'open' &&
        github.event.issue.pull_request &&
        github.event.comment.user.type == 'User' &&
        (
          contains(github.event.comment.body, 'recheck') ||
          contains(github.event.comment.body, 'I have read the CLA Document v2.2 and I hereby sign the CLA')
        )
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: cla-signature-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
      statuses: read
    steps:
      - name: "Require GitHub-hosted runner"
        if: runner.environment != 'github-hosted'
        run: |
          set -euo pipefail
          echo "::error::CLA policy requires a GitHub-hosted runner"
          exit 1
      - name: "CLA Assistant"
        id: cla
        if: runner.environment == 'github-hosted'
        uses: manaflow-ai/cla-github-action@212a0f2dd659b24b48a30ba35966e06dc41736af
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: "signatures/version2/cla.json"
          path-to-document: "https://github.com/${{ github.repository }}/blob/${{ github.workflow_sha }}/CLA.md"
          branch: "cla-signatures"
          required-base-ref: "main"
          custom-pr-sign-comment: "I have read the CLA Document v2.2 and I hereby sign the CLA"
          lock-pullrequest-aftermerge: "false"
          allowlist-ids: "54008264,38676809,67667005"
          trusted-merge-status-context: "cmux/catch-up-merge"
          trusted-merge-status-creator-ids: "41898282"
      - name: "Refresh the pull request check after a new signature"
        if: runner.environment == 'github-hosted' && github.event_name == 'issue_comment' && steps.cla.outputs.signature_recorded == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          head="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)"
          run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow cla.yml --event pull_request_target --commit "$head" --status failure --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          if [[ -n "$run_id" ]]; then gh run rerun "$run_id" --failed --repo "$GITHUB_REPOSITORY"; fi
