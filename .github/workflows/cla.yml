name: "CLA Assistant v2"
on:
  issue_comment:
    types: [created]
  pull_request_target:
    branches: [main]
    types: [opened,closed,reopened,synchronize]

# Jobs declare only the permissions they need.
permissions: {}

jobs:
  CLAAssistant:
    name: "CLA Assistant v2"
    runs-on: ${{ vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 15
    # Filter before concurrency admission. Otherwise arbitrary issue comments
    # can consume the signature queue without running the action.
    if: >-
      (
        github.event_name == 'pull_request_target' &&
        (
          github.event.action == 'opened' ||
          github.event.action == 'reopened' ||
          github.event.action == 'synchronize'
        )
      ) ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.state == 'open' &&
        github.event.issue.pull_request &&
        (
          github.event.comment.body == 'recheck' ||
          github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
        )
      )
    # Signature updates share one file. Queue up to 100 runs instead of
    # silently replacing all but one pending contributor event.
    concurrency:
      group: cla-signatures
      queue: max
      cancel-in-progress: false
    permissions:
      # The archived action still performs a read-only workflow lookup before
      # it records a completed signature. Remove this once the in-org fork is
      # deployed, because the isolated rerun job owns the write permission.
      actions: read
      contents: write
      issues: write
      # GitHub's pull_request_target token denied issue comments for fork PRs
      # with this set to read, despite the endpoint documentation allowing
      # issues:write. Keep write until that live behavior changes.
      pull-requests: write
    steps:
      # Immutable generation marker. Including the workflow SHA means a run
      # from an older revision cannot execute after the policy changes below.
      - name: "CLA generation v2 ${{ github.workflow_sha }}"
        run: echo "CLA generation v2 ${{ github.workflow_sha }}"

      - name: "Validate CLA comment declaration"
        if: github.event_name == 'issue_comment'
        env:
          EVENT_COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          # GitHub Actions string equality is case-insensitive, and the
          # archived action also accepts broad regular-expression matches.
          # Check the complete body in a shell before the action can record a
          # signature. `recheck` is the only other accepted trigger.
          if [[ "${EVENT_COMMENT_BODY}" != "recheck" &&
                "${EVENT_COMMENT_BODY}" != "I have read the CLA Document and I hereby sign the CLA" ]]; then
            echo "::error::The comment is not an exact CLA declaration or recheck command"
            exit 1
          fi

      - name: "Validate CLA pull request"
        id: cla-preflight
        # The archived action reads only its first 100 commits. Fail closed
        # instead of allowing an unsigned committer beyond that limit through.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
          EVENT_BASE_REPO: ${{ github.event.pull_request.base.repo.full_name }}
        run: |
          set -euo pipefail
          if ! [[ "${PR_NUMBER}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Invalid pull request number"
            exit 1
          fi
          if ! pr_json="$(gh api "repos/${GH_REPO}/pulls/${PR_NUMBER}" 2>/dev/null)"; then
            echo "::error::Could not query the pull request"
            exit 1
          fi
          if ! jq -e --arg repo "${GH_REPO}" --argjson number "${PR_NUMBER}" '
            .number == $number and
            .state == "open" and
            .base.ref == "main" and
            .base.repo.full_name == $repo and
            (.head.sha | type == "string") and
            (.head.sha | test("^[0-9a-f]{40}$")) and
            (.commits | type == "number")
          ' <<<"${pr_json}" >/dev/null; then
            echo "::error::The pull request is not an open pull request targeting main"
            exit 1
          fi
          live_head_sha="$(jq -r '.head.sha' <<<"${pr_json}")"
          if [[ "${EVENT_NAME}" == "pull_request_target" ]] && {
            [[ "${EVENT_HEAD_SHA}" != "${live_head_sha}" ]] ||
            [[ "${EVENT_BASE_REF}" != "main" ]] ||
            [[ "${EVENT_BASE_REPO}" != "${GH_REPO}" ]]
          }; then
            echo "::error::The pull request changed while the CLA workflow was starting"
            exit 1
          fi
          commit_count="$(jq -r '.commits' <<<"${pr_json}")"
          if ! [[ "${commit_count}" =~ ^[0-9]+$ ]]; then
            echo "::error::Could not determine the pull request commit count"
            exit 1
          fi
          if (( commit_count > 100 )); then
            echo "::error title=Pull request commit limit::This pull request has ${commit_count} commits. Split it into 100 or fewer commits before requesting a CLA check."
            exit 1
          fi

      - name: "Validate historical CLA declarations"
        # The archived action rescans old comments on every event and accepts
        # trimmed, lower-case, and wrapped declarations. Reject those bodies
        # before it can turn a non-exact historical comment into a signature.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          CLA_SIGN_PHRASE: 'I have read the CLA Document and I hereby sign the CLA'
        run: |
          set -euo pipefail
          if ! comments_json="$(gh api --paginate --slurp \
            "repos/${GH_REPO}/issues/${PR_NUMBER}/comments?per_page=100" 2>/dev/null)"; then
            echo "::error::Could not query pull request comments for CLA validation"
            exit 1
          fi
          if ! jq -e 'type == "array" and all(.[]; type == "array")' <<<"${comments_json}" >/dev/null; then
            echo "::error::Could not validate pull request comment data"
            exit 1
          fi
          comment_count="$(jq '[.[] | .[]?] | length' <<<"${comments_json}")"
          if ! [[ "${comment_count}" =~ ^[0-9]+$ ]]; then
            echo "::error::Could not count pull request comments for CLA validation"
            exit 1
          fi
          if (( comment_count > 1000 )); then
            echo "::error title=Pull request comment limit::This pull request has more than 1000 comments. Remove old comments before requesting a CLA check."
            exit 1
          fi
          unsafe_comments="$(jq -r --arg phrase "${CLA_SIGN_PHRASE}" '
            [ .[] | .[]?
              | (.body // "") as $body
              | ($body | ascii_downcase | gsub("^\\s+|\\s+$"; "")) as $normalized
              | ($phrase | ascii_downcase) as $expected
              | ($normalized == $expected or
                 ($normalized | test("^.*i\\s*have\\s*read\\s*the\\s*cla\\s*document\\s*and\\s*i\\s*hereby\\s*sign\\s*the\\s*cla.*$"))) as $signature_candidate
              | (($body | test("CLA Assistant Lite bot"; "i"))) as $marker_candidate
              | ((.user.login // "") | ascii_downcase) as $login
              | (.user.type // "") as $type
              | (.user.id // 0) as $user_id
              | ($user_id | type == "number" and . == 41898282) as $canonical_bot_id
              | ($login == "github-actions[bot]" and
                 $type == "Bot" and
                 $canonical_bot_id and
                 $marker_candidate) as $canonical_bot_comment
              | select(
                  ($signature_candidate and
                  ($canonical_bot_comment | not) and
                   ($body != $phrase or $type != "User" or
                    ($login | endswith("[bot]")))) or
                  ($marker_candidate and
                   ($canonical_bot_comment | not))
                )
              | {id: (.id // 0), author: (.user.login // "unknown")}
            ]
            | .[]? | @json
          ' <<<"${comments_json}")" || {
            echo "::error::Could not validate historical CLA declarations"
            exit 1
          }
          if [[ -n "${unsafe_comments}" ]]; then
            echo "::error::A historical pull request comment matches an archived CLA signature or bot-marker pattern without a trusted exact identity. Delete it or post the exact declaration, then request the check again."
            printf '%s\n' "${unsafe_comments}" >&2
            exit 1
          fi

      - name: "CLA Assistant v2"
        # The action handles signing and status updates. Merged pull requests
        # use the explicit lock step below because the archived action sends
        # an invalid lock request.
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: 'signatures/version1/cla.json'
          path-to-document: 'https://github.com/manaflow-ai/cmux/blob/${{ github.workflow_sha }}/CLA.md'
          # The archived action calls the lock endpoint without the required
          # lock_reason. Disable that broken path and use the explicit step
          # below, which supplies a valid reason and fails on API errors.
          lock-pullrequest-aftermerge: 'false'
          # signatures live on the unprotected cla-signatures branch so required checks on main don't block the bot's signature commits
          branch: 'cla-signatures'
          # Pin the policy branch explicitly. The maintained action preserves
          # upstream compatibility when this input is omitted.
          required-base-ref: 'main'
          # Require the exact phrase below. Do not use the action's raw-name
          # allowlist: an unlinked commit identity can spoof it. Automated PRs
          # follow this same fail-closed path until an authenticated signer is
          # available.
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'

  RerunFailedCLA:
    name: "Rerun failed CLA check"
    needs: CLAAssistant
    # Keep the workflow-rerun token out of the signature-writing job. The
    # archived action still attempts its own best-effort rerun, but it has no
    # actions permission and cannot rerun anything. This job runs only after
    # the exact, accepted issue-comment path above succeeds.
    if: >-
      needs.CLAAssistant.result == 'success' &&
      github.event_name == 'issue_comment' &&
      github.event.issue.state == 'open' &&
      github.event.issue.pull_request &&
      (
        github.event.comment.body == 'recheck' ||
        github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
      )
    runs-on: ${{ vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 15
    # A contributor can submit more than one valid comment while the signing
    # job is running. Serialize reruns per PR so two comments cannot race the
    # same workflow run. The script rechecks the run state before POSTing.
    concurrency:
      group: cla-rerun-${{ github.event.issue.number }}
      queue: max
      cancel-in-progress: false
    permissions:
      # This job has no checkout and executes only the fixed script below.
      # actions:write is required by the rerun endpoint; pull-requests:read is
      # required to validate the live PR and its relationship to the run.
      actions: write
      issues: read
      pull-requests: read
    steps:
      - name: "Rerun exact failed pull_request_target run"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PR_NUMBER: ${{ github.event.issue.number }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_CREATED_AT: ${{ github.event.comment.created_at }}
          COMMENT_AUTHOR_LOGIN: ${{ github.event.comment.user.login }}
          COMMENT_AUTHOR_TYPE: ${{ github.event.comment.user.type }}
          COMMENT_AUTHOR_ASSOCIATION: ${{ github.event.comment.author_association }}
          WORKFLOW_PATH: '.github/workflows/cla.yml'
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          TARGET_EVENT: 'pull_request_target'
          TARGET_BASE_REF: 'main'
        run: |
          set -euo pipefail

          fail() {
            echo "::error::$1"
            exit 1
          }

          # The job-level expression is the first gate. Repeat it here so a
          # future edit to that expression cannot turn this token into a
          # general-purpose workflow rerunner.
          [[ "${EVENT_NAME}" == "issue_comment" ]] || fail "Unexpected event for CLA rerun"
          [[ "${ISSUE_NUMBER}" =~ ^[1-9][0-9]*$ ]] || fail "Invalid issue number"
          [[ "${PR_NUMBER}" == "${ISSUE_NUMBER}" ]] || fail "Issue and pull request numbers differ"
          [[ "${COMMENT_BODY}" == "recheck" || "${COMMENT_BODY}" == "I have read the CLA Document and I hereby sign the CLA" ]] || fail "Comment is not an accepted CLA trigger"
          [[ "${COMMENT_CREATED_AT}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]] || fail "Invalid comment timestamp"
          [[ -n "${COMMENT_AUTHOR_LOGIN}" ]] || fail "Comment author is missing"
          [[ "${COMMENT_AUTHOR_TYPE}" == "User" ]] || fail "Comment author is not a human user"
          case "${COMMENT_AUTHOR_LOGIN,,}" in
            *"[bot]") fail "Bot comments cannot trigger a CLA rerun" ;;
          esac
          case "${COMMENT_AUTHOR_ASSOCIATION}" in
            OWNER|MEMBER|COLLABORATOR|CONTRIBUTOR|FIRST_TIME_CONTRIBUTOR|FIRST_TIMER|NONE) ;;
            *) fail "Comment author association is invalid" ;;
          esac
          [[ "${WORKFLOW_SHA}" =~ ^[0-9a-f]{40}$ ]] || fail "Invalid workflow generation SHA"

          issue_json="$(gh api "repos/${GH_REPO}/issues/${PR_NUMBER}" 2>/dev/null)" || fail "Could not query the issue"
          issue_state="$(jq -r '.state // empty' <<<"${issue_json}")"
          issue_pr_url="$(jq -r '.pull_request.url // empty' <<<"${issue_json}")"
          [[ "${issue_state}" == "open" ]] || fail "The issue is not an open pull request"
          [[ "${issue_pr_url}" == "https://api.github.com/repos/${GH_REPO}/pulls/${PR_NUMBER}" ]] || fail "The issue is not the exact repository pull request"

          pr_json="$(gh api "repos/${GH_REPO}/pulls/${PR_NUMBER}" 2>/dev/null)" || fail "Could not query the pull request"
          jq -e --arg repo "${GH_REPO}" --argjson number "${PR_NUMBER}" --arg base "${TARGET_BASE_REF}" '
            .number == $number and
            .state == "open" and
            .base.ref == $base and
            (.base.repo.id | type == "number") and
            .base.repo.full_name == $repo and
            (.head.sha | type == "string") and
            (.head.sha | test("^[0-9a-f]{40}$")) and
            (.head.repo.id | type == "number") and
            (.head.repo.full_name | type == "string") and
            (.user.login | type == "string")
          ' <<<"${pr_json}" >/dev/null || fail "The live pull request is not valid"
          head_sha="$(jq -r '.head.sha' <<<"${pr_json}")"
          head_ref="$(jq -r '.head.ref // empty' <<<"${pr_json}")"
          head_repo="$(jq -r '.head.repo.full_name // empty' <<<"${pr_json}")"
          head_repo_id="$(jq -r '.head.repo.id // empty' <<<"${pr_json}")"
          repo_id="$(jq -r '.base.repo.id // empty' <<<"${pr_json}")"
          pr_author_login="$(jq -r '.user.login // empty' <<<"${pr_json}")"
          [[ "${head_ref}" != "" && "${head_repo}" != "" ]] || fail "The pull request head repository is missing"
          [[ "${head_repo_id}" =~ ^[1-9][0-9]*$ ]] || fail "The pull request head repository ID is missing"
          [[ "${repo_id}" =~ ^[1-9][0-9]*$ ]] || fail "The pull request base repository ID is missing"
          [[ "${pr_author_login}" != "" ]] || fail "The pull request author is missing"
          # A contributor may recheck their own pull request. A different
          # commenter must be a trusted repository participant, which limits
          # unauthenticated users to the harmless no-op path.
          if [[ "${COMMENT_BODY}" == "recheck" && "${COMMENT_AUTHOR_LOGIN}" != "${pr_author_login}" ]]; then
            case "${COMMENT_AUTHOR_ASSOCIATION}" in
              OWNER|MEMBER|COLLABORATOR) ;;
              *) fail "Only the pull request author or a trusted repository participant may request a CLA rerun" ;;
            esac
          fi

          # The workflow-run list can omit pull_requests for
          # pull_request_target runs. Resolve the commit through GitHub's PR
          # association endpoint when GitHub has the commit in the base repo.
          # Fork-only commits can legitimately return an empty list, so the
          # exact live PR plus the run head_repository binding below is the
          # association proof in that case.
          commit_prs_json="$(gh api \
            --header 'Accept: application/vnd.github+json' \
            "repos/${GH_REPO}/commits/${head_sha}/pulls" 2>/dev/null)" || fail "Could not query pull request associations"
          jq -e 'type == "array"' <<<"${commit_prs_json}" >/dev/null || fail "Could not validate pull request associations"
          association_count="$(jq -r 'length' <<<"${commit_prs_json}")"
          [[ "${association_count}" =~ ^[0-9]+$ ]] || fail "Could not count pull request associations"
          if (( association_count > 0 )); then
            jq -e \
              --arg repo "${GH_REPO}" \
              --arg pr "${PR_NUMBER}" \
              --arg sha "${head_sha}" \
              --arg base "${TARGET_BASE_REF}" \
              --arg head_ref "${head_ref}" \
              --argjson head_repo_id "${head_repo_id}" '
                any(.[]?;
                  (.number | tostring) == $pr and
                  .base.ref == $base and
                  .base.repo.full_name == $repo and
                  .head.ref == $head_ref and
                  .head.sha == $sha and
                  (.head.repo.id | type == "number") and
                  .head.repo.id == $head_repo_id
                )
              ' <<<"${commit_prs_json}" >/dev/null || fail "The current head is not associated with this pull request"
          elif [[ "${head_repo}" == "${GH_REPO}" ]]; then
            fail "The base-repository head has no pull request association"
          fi

          # A fork-only commit can be absent from the commit association API.
          # Resolve it through the live open-PR list instead. The head filter
          # is owner:ref, so the result must contain exactly one PR with the
          # exact number, SHA, head repository, and base repository. This
          # rejects duplicate or cross-PR matches before a run is selected,
          # and the helper is called again immediately before the POST.
          validate_live_open_head_association() {
            local head_owner head_name open_prs_json matching_open_prs_json open_association_count
            [[ "${head_repo}" == */* && "${head_repo}" != */*/* ]] || fail "The pull request head repository name is invalid"
            head_owner="${head_repo%%/*}"
            head_name="${head_repo#*/}"
            [[ -n "${head_owner}" && -n "${head_name}" ]] || fail "The pull request head repository name is invalid"
            open_prs_json="$(gh api \
              --method GET \
              --paginate \
              --slurp \
              --header 'Accept: application/vnd.github+json' \
              --raw-field state=open \
              --raw-field base="${TARGET_BASE_REF}" \
              --raw-field head="${head_owner}:${head_ref}" \
              --raw-field per_page=100 \
              "repos/${GH_REPO}/pulls" 2>/dev/null)" || fail "Could not query live open pull requests for this head"
            jq -e 'type == "array" and all(.[]; type == "array")' <<<"${open_prs_json}" >/dev/null || fail "Could not validate live open pull requests"
            if ! matching_open_prs_json="$(jq -c \
                --arg repo "${GH_REPO}" \
                --arg sha "${head_sha}" \
                --arg base "${TARGET_BASE_REF}" \
                --arg head_ref "${head_ref}" \
                --arg head_repo "${head_repo}" \
                --argjson head_repo_id "${head_repo_id}" \
                --argjson repo_id "${repo_id}" '
                  [ .[] | .[]?
                    | select(
                        (.number | type == "number") and
                        .state == "open" and
                        .base.ref == $base and
                        .base.repo.full_name == $repo and
                        (.base.repo.id | type == "number") and
                        .base.repo.id == $repo_id and
                        .head.ref == $head_ref and
                        .head.sha == $sha and
                        .head.repo.full_name == $head_repo and
                        (.head.repo.id | type == "number") and
                        .head.repo.id == $head_repo_id
                      )
                  ]
                  | sort_by(.number)
                ' <<<"${open_prs_json}")"; then
              fail "Could not validate live open pull request data"
            fi
            open_association_count="$(jq -r 'length' <<<"${matching_open_prs_json}")"
            [[ "${open_association_count}" =~ ^[0-9]+$ ]] || fail "Could not count live open pull request associations"
            [[ "${open_association_count}" == "1" ]] || fail "Expected exactly one open pull request for this head"
            jq -e --argjson number "${PR_NUMBER}" '.[0].number == $number' <<<"${matching_open_prs_json}" >/dev/null || fail "The live head is associated with a different pull request"
          }
          validate_live_open_head_association

          workflow_json="$(gh api --paginate --slurp "repos/${GH_REPO}/actions/workflows?per_page=100" 2>/dev/null)" || fail "Could not query repository workflows"
          workflow_id="$(jq -r --arg path "${WORKFLOW_PATH}" '[.[] | .workflows[]? | select(.path == $path and .state == "active") | .id] | if length == 1 then .[0] else empty end' <<<"${workflow_json}")"
          [[ "${workflow_id}" =~ ^[1-9][0-9]*$ ]] || fail "The expected CLA workflow is not active"

          # Search all pages, then choose the newest completed failure created
          # no later than this comment. Edited, reopened, and synchronize
          # events can leave several eligible failures for one exact head, so
          # sort by creation time and run ID and select the newest one. Every
          # candidate is tied to the exact workflow path, event, current PR
          # head, and PR association. pull_request_target run.head_sha is the
          # source PR head SHA, as confirmed by the GitHub Actions API.
          runs_json="$(gh api --paginate --slurp "repos/${GH_REPO}/actions/workflows/${workflow_id}/runs?event=${TARGET_EVENT}&head_sha=${head_sha}&per_page=100" 2>/dev/null)" || fail "Could not query CLA workflow runs"
          if ! candidate_list_json="$(jq -c \
              --arg path "${WORKFLOW_PATH}" \
              --arg event "${TARGET_EVENT}" \
              --arg sha "${head_sha}" \
              --arg workflow_sha "${WORKFLOW_SHA}" \
              --arg pr "${PR_NUMBER}" \
              --arg repo "${GH_REPO}" \
              --arg head_repo "${head_repo}" \
              --argjson head_repo_id "${head_repo_id}" \
              --argjson repo_id "${repo_id}" \
              --arg base "${TARGET_BASE_REF}" \
              --arg head_ref "${head_ref}" \
              --arg before "${COMMENT_CREATED_AT}" '
                [ .[] | .workflow_runs[]?
                  | select(
                      (.path == $path or
                       ((.path | startswith($path + "@")) and
                        ((.path | length) > (($path | length) + 1)))) and
                      .event == $event and
                      .head_sha == $sha and
                      .head_branch == $head_ref and
                      (.id | type == "number") and
                      .id > 0 and
                      (
                        (.head_repository.full_name == $head_repo and
                         .head_repository.id == $head_repo_id) or
                        (.head_repository == null and $head_repo == $repo)
                      ) and
                      .status == "completed" and
                      .conclusion == "failure" and
                      (.created_at | type == "string") and
                      .created_at <= $before and
                      (
                        ((.pull_requests // []) | length) == 0 or
                        any((.pull_requests // [])[];
                          (.number | tostring) == $pr and
                          .base.ref == $base and
                          .base.repo.id == $repo_id and
                          .head.sha == $sha and
                          (.head.repo.id | type == "number") and
                          .head.repo.id == $head_repo_id and
                          ((.head.repo.full_name // "") == "" or
                           .head.repo.full_name == $head_repo)
                        )
                      )
                    )
                ]
                | sort_by([.created_at, .id])
              ' <<<"${runs_json}")"; then
            fail "Could not validate CLA workflow run data"
          fi
          candidate_count="$(jq -r 'length' <<<"${candidate_list_json}")"
          [[ "${candidate_count}" =~ ^[0-9]+$ ]] || fail "Could not count matching CLA workflow runs"
          if [[ "${candidate_count}" == "0" ]]; then
            # A run from before this workflow generation cannot be safely
            # rerun: GitHub reruns the old workflow revision, which could
            # execute the archived action or an obsolete policy. Distinguish
            # that migration case from a normal no-op after a successful CLA
            # check so contributors receive an actionable recovery path.
            stale_run_count="$(jq -r \
              --arg path "${WORKFLOW_PATH}" \
              --arg event "${TARGET_EVENT}" \
              --arg sha "${head_sha}" \
              --arg head_ref "${head_ref}" \
              --arg head_repo "${head_repo}" \
              --argjson head_repo_id "${head_repo_id}" \
              --arg before "${COMMENT_CREATED_AT}" \
              '[ .[] | .workflow_runs[]?
                | select(
                    (.path == $path or
                     ((.path | startswith($path + "@")) and
                      ((.path | length) > (($path | length) + 1)))) and
                    .event == $event and
                    .head_sha == $sha and
                    .head_branch == $head_ref and
                    (.head_repository.full_name == $head_repo and
                     .head_repository.id == $head_repo_id) and
                    .status == "completed" and
                    .conclusion == "failure" and
                    (.created_at | type == "string") and
                    .created_at <= $before
                  )
              ] | length' <<<"${runs_json}")"
            [[ "${stale_run_count}" =~ ^[0-9]+$ ]] || fail "Could not count stale CLA workflow runs"
            if (( stale_run_count > 0 )); then
              fail "The failed CLA check was created by an older workflow generation. Push a new commit or close and reopen this pull request to create a current-generation CLA check, then post the exact signing declaration again."
            fi
            # A valid signature can arrive after the check already passed.
            # Preserve the action's historical no-op behavior in that case.
            echo "No failed CLA run exists for this pull request head"
            exit 0
          fi
          # candidate_list_json is sorted oldest-first above. The selected run
          # is fully fetched and validated below before any state-changing API
          # call, so multiple historical failures do not create ambiguity.
          candidate_json="$(jq -c '.[-1]' <<<"${candidate_list_json}")"
          run_id="$(jq -r '.id // empty' <<<"${candidate_json}")"
          [[ "${run_id}" =~ ^[1-9][0-9]*$ ]] || fail "The selected CLA run ID is invalid"

          # Re-read the individual run. The list response is only a discovery
          # result, not authorization to rerun it.
          run_json="$(gh api "repos/${GH_REPO}/actions/runs/${run_id}" 2>/dev/null)" || fail "Could not query the selected CLA run"
          jq -e \
            --arg run_id "${run_id}" \
            --arg path "${WORKFLOW_PATH}" \
            --arg event "${TARGET_EVENT}" \
            --arg sha "${head_sha}" \
            --arg pr "${PR_NUMBER}" \
            --arg repo "${GH_REPO}" \
            --arg head_repo "${head_repo}" \
            --argjson head_repo_id "${head_repo_id}" \
            --argjson repo_id "${repo_id}" \
            --arg head_ref "${head_ref}" \
            --arg workflow_id "${workflow_id}" \
            --arg base "${TARGET_BASE_REF}" \
            --arg before "${COMMENT_CREATED_AT}" '
              .id == ($run_id | tonumber) and
              .workflow_id == ($workflow_id | tonumber) and
              (.path == $path or
               ((.path | startswith($path + "@")) and
                ((.path | length) > (($path | length) + 1)))) and
              .event == $event and
              .status == "completed" and
              .conclusion == "failure" and
              .head_sha == $sha and
              .head_branch == $head_ref and
              (
                (.head_repository.full_name == $head_repo and
                 .head_repository.id == $head_repo_id) or
                (.head_repository == null and $head_repo == $repo)
              ) and
              (.created_at | type == "string") and
              .created_at <= $before and
              (
                ((.pull_requests // []) | length) == 0 or
                any((.pull_requests // [])[];
                  (.number | tostring) == $pr and
                  .base.ref == $base and
                  .base.repo.id == $repo_id and
                  .head.sha == $sha and
                  (.head.repo.id | type == "number") and
                  .head.repo.id == $head_repo_id and
                  ((.head.repo.full_name // "") == "" or
                   .head.repo.full_name == $head_repo)
                )
              )
            ' <<<"${run_json}" >/dev/null || fail "The selected run no longer matches the exact failed CLA check"

          # Close the main TOCTOU window. A push, close, or another rerun can
          # happen while the API calls above run. Never rerun a stale head.
          latest_pr_json="$(gh api "repos/${GH_REPO}/pulls/${PR_NUMBER}" 2>/dev/null)" || fail "Could not recheck the pull request"
          jq -e --arg repo "${GH_REPO}" --argjson number "${PR_NUMBER}" --arg sha "${head_sha}" --arg base "${TARGET_BASE_REF}" --arg head_repo "${head_repo}" --argjson head_repo_id "${head_repo_id}" '
            .number == $number and
            .state == "open" and
            .base.ref == $base and
            .base.repo.full_name == $repo and
            .head.sha == $sha and
            .head.repo.full_name == $head_repo and
            .head.repo.id == $head_repo_id
          ' <<<"${latest_pr_json}" >/dev/null || fail "The pull request changed while selecting the CLA run"

          # Ensure another queued invocation did not already rerun this run.
          final_run_json="$(gh api "repos/${GH_REPO}/actions/runs/${run_id}" 2>/dev/null)" || fail "Could not recheck the selected CLA run"
          jq -e \
            --arg path "${WORKFLOW_PATH}" \
            --arg event "${TARGET_EVENT}" \
            --arg sha "${head_sha}" \
            --arg pr "${PR_NUMBER}" \
            --arg repo "${GH_REPO}" \
            --arg head_repo "${head_repo}" \
            --argjson head_repo_id "${head_repo_id}" \
            --argjson repo_id "${repo_id}" \
            --arg head_ref "${head_ref}" \
            --arg workflow_id "${workflow_id}" \
            --arg run_id "${run_id}" \
            --arg base "${TARGET_BASE_REF}" \
            --arg before "${COMMENT_CREATED_AT}" '
              .id == ($run_id | tonumber) and
              .workflow_id == ($workflow_id | tonumber) and
              (.path == $path or
               ((.path | startswith($path + "@")) and
                ((.path | length) > (($path | length) + 1)))) and
              .event == $event and
              .status == "completed" and
              .conclusion == "failure" and
              .head_sha == $sha and
              .head_branch == $head_ref and
              (
                (.head_repository.full_name == $head_repo and
                 .head_repository.id == $head_repo_id) or
                (.head_repository == null and $head_repo == $repo)
              ) and
              (.created_at | type == "string") and
              .created_at <= $before and
              (
                ((.pull_requests // []) | length) == 0 or
                any((.pull_requests // [])[];
                  (.number | tostring) == $pr and
                  .base.ref == $base and
                  .base.repo.id == $repo_id and
                  .head.sha == $sha and
                  (.head.repo.id | type == "number") and
                  .head.repo.id == $head_repo_id and
                  ((.head.repo.full_name // "") == "" or
                   .head.repo.full_name == $head_repo)
                )
              )
          ' <<<"${final_run_json}" >/dev/null || fail "The exact failed CLA run is no longer eligible"

          # Rerun only the failed CLA job, rather than every job in the run.
          # The job endpoint still requires actions:write, but it cannot
          # accidentally restart an unrelated job added to this workflow.
          jobs_json="$(gh api --paginate --slurp "repos/${GH_REPO}/actions/runs/${run_id}/jobs?per_page=100" 2>/dev/null)" || fail "Could not query jobs for the selected CLA run"
          if ! cla_job_json="$(jq -c \
              --arg run_id "${run_id}" \
              --arg sha "${head_sha}" \
              --arg workflow_sha "${WORKFLOW_SHA}" \
              --arg head_ref "${head_ref}" \
              --arg head_repo "${head_repo}" \
              --argjson head_repo_id "${head_repo_id}" \
              '[.[] | .jobs[]?
                | select(
                    (.run_id | tostring) == $run_id and
                    .name == "CLA Assistant v2" and
                    .workflow_name == "CLA Assistant v2" and
                    .status == "completed" and
                    .conclusion == "failure" and
                    .head_sha == $sha and
                    .head_branch == $head_ref and
                    (
                      .head_repository == null or
                      (.head_repository.full_name == $head_repo and
                       .head_repository.id == $head_repo_id)
                    ) and
                    any(.steps[]?;
                      .name == ("CLA generation v2 " + $workflow_sha) and
                      .status == "completed" and
                      .conclusion == "success"
                    )
                  )
              ]
              | if length == 1 then .[0] else empty end
            ' <<<"${jobs_json}")"; then
            fail "Could not validate CLA job data"
          fi
          if [[ -z "${cla_job_json}" ]]; then
            # The run matched the current PR and failed, but no job carried
            # this workflow generation marker. It is an old or malformed
            # generation and must not be replayed with the privileged token.
            fail "The selected failed CLA check was created by an older workflow generation. Push a new commit or close and reopen this pull request to create a current-generation CLA check, then post the exact signing declaration again."
          fi
          job_id="$(jq -r '.id // empty' <<<"${cla_job_json}")"
          [[ "${job_id}" =~ ^[1-9][0-9]*$ ]] || fail "The selected CLA job ID is invalid"

          # Re-read the individual job. The jobs list is discovery only, just
          # like the workflow-run list above.
          job_json="$(gh api "repos/${GH_REPO}/actions/jobs/${job_id}" 2>/dev/null)" || fail "Could not query the selected CLA job"
          jq -e \
            --arg job_id "${job_id}" \
            --arg run_id "${run_id}" \
            --arg sha "${head_sha}" \
            --arg workflow_sha "${WORKFLOW_SHA}" \
            --arg head_ref "${head_ref}" \
            --arg head_repo "${head_repo}" \
            --argjson head_repo_id "${head_repo_id}" '
              .id == ($job_id | tonumber) and
              .run_id == ($run_id | tonumber) and
              .name == "CLA Assistant v2" and
              .workflow_name == "CLA Assistant v2" and
              .status == "completed" and
              .conclusion == "failure" and
              .head_sha == $sha and
              .head_branch == $head_ref and
              (
                .head_repository == null or
                (.head_repository.full_name == $head_repo and
                 .head_repository.id == $head_repo_id)
              ) and
              any(.steps[]?;
                .name == ("CLA generation v2 " + $workflow_sha) and
                .status == "completed" and
                .conclusion == "success"
              )
            ' <<<"${job_json}" >/dev/null || fail "The selected CLA job no longer matches the failed job in this run"

          # Recheck both resources immediately before the state-changing call.
          # This prevents a push or a concurrent rerun from making the job
          # stale while the preceding API requests were in flight.
          latest_pr_json="$(gh api "repos/${GH_REPO}/pulls/${PR_NUMBER}" 2>/dev/null)" || fail "Could not recheck the pull request before rerun"
          jq -e --arg repo "${GH_REPO}" --argjson number "${PR_NUMBER}" --arg sha "${head_sha}" --arg base "${TARGET_BASE_REF}" --arg head_repo "${head_repo}" --argjson head_repo_id "${head_repo_id}" '
            .number == $number and
            .state == "open" and
            .base.ref == $base and
            .base.repo.full_name == $repo and
            .head.sha == $sha and
            .head.repo.full_name == $head_repo and
            .head.repo.id == $head_repo_id
          ' <<<"${latest_pr_json}" >/dev/null || fail "The pull request changed while selecting the CLA job"
          final_job_json="$(gh api "repos/${GH_REPO}/actions/jobs/${job_id}" 2>/dev/null)" || fail "Could not recheck the selected CLA job"
          jq -e \
            --arg job_id "${job_id}" \
            --arg run_id "${run_id}" \
            --arg sha "${head_sha}" \
            --arg workflow_sha "${WORKFLOW_SHA}" \
            --arg head_ref "${head_ref}" \
            --arg head_repo "${head_repo}" \
            --argjson head_repo_id "${head_repo_id}" '
              .id == ($job_id | tonumber) and
              .run_id == ($run_id | tonumber) and
              .name == "CLA Assistant v2" and
              .workflow_name == "CLA Assistant v2" and
              .status == "completed" and
              .conclusion == "failure" and
              .head_sha == $sha and
              .head_branch == $head_ref and
              (
                .head_repository == null or
                (.head_repository.full_name == $head_repo and
                 .head_repository.id == $head_repo_id)
              ) and
              any(.steps[]?;
                .name == ("CLA generation v2 " + $workflow_sha) and
                .status == "completed" and
                .conclusion == "success"
              )
            ' <<<"${final_job_json}" >/dev/null || fail "The exact failed CLA job is no longer eligible"

          # Repeat the positive live-PR association check after all discovery
          # calls. A second open PR for the same fork ref and SHA must stop the
          # rerun even if it appeared while the earlier checks were running.
          validate_live_open_head_association

          if ! gh api \
            --method POST \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${GH_REPO}/actions/jobs/${job_id}/rerun" >/dev/null 2>&1; then
            fail "Could not rerun the exact failed CLA job"
          fi
          echo "Requested rerun for CLA job ${job_id} in workflow run ${run_id} at head ${head_sha}"

  LockMergedPullRequest:
    name: "Lock merged pull request"
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true
    runs-on: ${{ vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 10
    # Use the same queue as signature writes. The archived action has no
    # final live-open check, so a signing run admitted before merge must finish
    # before this lock is applied. The action-fork migration can split this
    # group after its live-write guard is deployed.
    concurrency:
      group: cla-signatures
      queue: max
      cancel-in-progress: false
    permissions:
      issues: write
      pull-requests: read
    steps:
      - name: "Lock merged pull request"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
          EVENT_BASE_REPO: ${{ github.event.pull_request.base.repo.full_name }}
          EVENT_BASE_REPO_ID: ${{ github.event.pull_request.base.repo.id }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          EVENT_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          EVENT_HEAD_REPO_ID: ${{ github.event.pull_request.head.repo.id }}
          EVENT_OPENER_ID: ${{ github.event.pull_request.user.id }}
          EVENT_OPENER_LOGIN: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail

          fail() {
            echo "::error::$1"
            exit 1
          }

          [[ "${PR_NUMBER}" =~ ^[1-9][0-9]*$ ]] || fail "Invalid pull request number"
          [[ "${EVENT_BASE_REF}" == "main" ]] || fail "The merge event targets an unexpected base branch"
          [[ "${EVENT_BASE_REPO}" == "${GH_REPO}" ]] || fail "The merge event targets an unexpected base repository"
          [[ "${EVENT_BASE_REPO_ID}" =~ ^[1-9][0-9]*$ ]] || fail "The merge event has no valid base repository ID"
          [[ "${EVENT_HEAD_SHA}" =~ ^[0-9a-f]{40}$ ]] || fail "The merge event has no valid head SHA"
          [[ -n "${EVENT_HEAD_REF}" && "${EVENT_HEAD_REF}" != *$'\n'* && "${EVENT_HEAD_REF}" != *$'\r'* ]] || fail "The merge event has no valid head ref"
          [[ "${EVENT_HEAD_REPO}" == */* && "${EVENT_HEAD_REPO}" != */*/* ]] || fail "The merge event has no valid head repository"
          [[ "${EVENT_HEAD_REPO_ID}" =~ ^[1-9][0-9]*$ ]] || fail "The merge event has no valid head repository ID"
          [[ "${EVENT_OPENER_ID}" =~ ^[1-9][0-9]*$ && -n "${EVENT_OPENER_LOGIN}" ]] || fail "The merge event has no valid pull request opener"

          validate_live_merged_pr() {
            local live_pr_json="$1"
            jq -e \
              --arg repo "${GH_REPO}" \
              --argjson number "${PR_NUMBER}" \
              --arg base_ref "${EVENT_BASE_REF}" \
              --arg base_repo "${EVENT_BASE_REPO}" \
              --argjson base_repo_id "${EVENT_BASE_REPO_ID}" \
              --arg head_sha "${EVENT_HEAD_SHA}" \
              --arg head_ref "${EVENT_HEAD_REF}" \
              --arg head_repo "${EVENT_HEAD_REPO}" \
              --argjson head_repo_id "${EVENT_HEAD_REPO_ID}" \
              --argjson opener_id "${EVENT_OPENER_ID}" \
              --arg opener_login "${EVENT_OPENER_LOGIN}" '
                .number == $number and
                .state == "closed" and
                .merged == true and
                .base.ref == $base_ref and
                .base.repo.full_name == $base_repo and
                .base.repo.full_name == $repo and
                .base.repo.id == $base_repo_id and
                (.head.sha | type == "string") and
                .head.sha == $head_sha and
                (.head.ref | type == "string") and
                .head.ref == $head_ref and
                (.head.repo.full_name | type == "string") and
                .head.repo.full_name == $head_repo and
                .head.repo.id == $head_repo_id and
                .user.id == $opener_id and
                .user.login == $opener_login
              ' <<<"${live_pr_json}" >/dev/null || return 1
          }

          live_pr_json="$(gh api "repos/${GH_REPO}/pulls/${PR_NUMBER}" 2>/dev/null)" || fail "Could not query the merged pull request"
          validate_live_merged_pr "${live_pr_json}" || fail "The live pull request no longer matches the merged event"

          issue_endpoint="repos/${GH_REPO}/issues/${PR_NUMBER}"
          lock_endpoint="${issue_endpoint}/lock"
          if ! locked="$(gh api "${issue_endpoint}" --jq '.locked' 2>/dev/null)"; then
            echo "::error::Could not query the pull request lock state"
            exit 1
          fi
          if [[ "${locked}" == "true" ]]; then
            echo "Pull request ${PR_NUMBER} is already locked"
            exit 0
          fi

          # Re-fetch immediately before the state-changing call. A queued lock
          # job must not lock a pull request that was reopened or retargeted
          # after the closed event was delivered.
          live_pr_json="$(gh api "repos/${GH_REPO}/pulls/${PR_NUMBER}" 2>/dev/null)" || fail "Could not recheck the merged pull request before locking"
          validate_live_merged_pr "${live_pr_json}" || fail "The pull request changed before locking"

          if ! gh api --method PUT \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "${lock_endpoint}" \
            --field lock_reason=resolved >/dev/null 2>&1; then
            echo "::error::Could not lock the merged pull request"
            exit 1
          fi
          if ! locked="$(gh api "${issue_endpoint}" --jq '.locked' 2>/dev/null)"; then
            echo "::error::Could not verify the pull request lock state"
            exit 1
          fi
          if [[ "${locked}" != "true" ]]; then
            echo "::error::The merged pull request is not locked"
            exit 1
          fi
          echo "Pull request ${PR_NUMBER} is locked"
