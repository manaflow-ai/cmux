name: "CLA Assistant"
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened,closed,reopened,synchronize]

# Jobs declare only the permissions they need.
permissions: {}

jobs:
  CLAAssistant:
    name: "CLA Assistant"
    runs-on: ubuntu-latest
    # Filter before concurrency admission. Otherwise arbitrary issue comments
    # can consume the signature queue without running the action.
    if: >-
      (
        github.event_name == 'pull_request_target' &&
        github.event.action != 'closed'
      ) ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.state == 'open' &&
        github.event.issue.pull_request &&
        (
          github.event.comment.body == 'recheck' ||
          github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
        )
      )
    # Signature updates share one file. Queue up to 100 runs instead of
    # silently replacing all but one pending contributor event.
    concurrency:
      group: cla-signatures
      queue: max
      cancel-in-progress: false
    permissions:
      # The action inspects prior runs; its optional rerun request is best-effort.
      actions: read
      contents: write
      issues: write
      # GitHub's pull_request_target token denied issue comments for fork PRs
      # with this set to read, despite the endpoint documentation allowing
      # issues:write. Keep write until that live behavior changes.
      pull-requests: write
    steps:
      - name: "Check CLA commit limit"
        id: cla-preflight
        # The archived action reads only its first 100 commits. Fail closed
        # instead of allowing an unsigned committer beyond that limit through.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          set -euo pipefail
          if ! pr_data="$(gh api "repos/${GH_REPO}/pulls/${PR_NUMBER}" --jq '{commits: .commits, opener: .user.login, opener_type: .user.type}' 2>/dev/null)"; then
            echo "::error::Could not query the pull request commit count"
            exit 1
          fi
          commit_count="$(jq -r '.commits' <<<"${pr_data}")"
          if ! [[ "${commit_count}" =~ ^[0-9]+$ ]]; then
            echo "::error::Could not determine the pull request commit count"
            exit 1
          fi
          if (( commit_count > 100 )); then
            echo "::error title=CLA Assistant commit limit::This pull request has ${commit_count} commits. Split it into 100 or fewer commits before requesting a CLA check."
            exit 1
          fi

          # The integration owns its automated PRs. Skip the archived action
          # for that authenticated App identity instead of trusting raw commit
          # names through its spoofable allowlist.
          bot_exempt='false'
          if [[ "$(jq -r '.opener' <<<"${pr_data}")" == 'chatmux-connections[bot]' ]] &&
             [[ "$(jq -r '.opener_type' <<<"${pr_data}")" == 'Bot' ]]; then
            bot_exempt='true'
          fi
          printf 'bot_exempt=%s\n' "${bot_exempt}" >> "${GITHUB_OUTPUT}"

      - name: "Accept trusted automation contribution"
        if: steps.cla-preflight.outputs.bot_exempt == 'true'
        run: echo "CLA check exempted for the authenticated Manaflow automation PR"

      - name: "CLA Assistant"
        # The action handles signing and status updates. Merged pull requests
        # use the explicit lock step below because the archived action sends
        # an invalid lock request.
        if: steps.cla-preflight.outputs.bot_exempt != 'true'
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: 'signatures/version1/cla.json'
          path-to-document: 'https://github.com/manaflow-ai/cmux/blob/${{ github.workflow_sha }}/CLA.md'
          # The archived action calls the lock endpoint without the required
          # lock_reason. Disable that broken path and use the explicit step
          # below, which supplies a valid reason and fails on API errors.
          lock-pullrequest-aftermerge: 'false'
          # signatures live on the unprotected cla-signatures branch so required checks on main don't block the bot's signature commits
          branch: 'cla-signatures'
          # Require the exact phrase below. No raw-name allowlist is used.
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'

  LockMergedPullRequest:
    name: "Lock merged pull request"
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    # Use a per-PR group so user comments cannot fill or replace the one-shot
    # merge-lock run. The open-PR guard above prevents new signing runs after
    # closure.
    concurrency:
      group: cla-lock-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      issues: write
    steps:
      - name: "Lock merged pull request"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          issue_endpoint="repos/${GH_REPO}/issues/${PR_NUMBER}"
          lock_endpoint="${issue_endpoint}/lock"
          if ! locked="$(gh api "${issue_endpoint}" --jq '.locked' 2>/dev/null)"; then
            echo "::error::Could not query the pull request lock state"
            exit 1
          fi
          if [[ "${locked}" == "true" ]]; then
            echo "Pull request ${PR_NUMBER} is already locked"
            exit 0
          fi
          if ! gh api --method PUT \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "${lock_endpoint}" \
            --field lock_reason=resolved >/dev/null 2>&1; then
            echo "::error::Could not lock the merged pull request"
            exit 1
          fi
          if ! locked="$(gh api "${issue_endpoint}" --jq '.locked' 2>/dev/null)"; then
            echo "::error::Could not verify the pull request lock state"
            exit 1
          fi
          if [[ "${locked}" != "true" ]]; then
            echo "::error::The merged pull request is not locked"
            exit 1
          fi
