name: 13474 relay verification

on:
  push:
    branches:
      - fix/13474-viewport-presentation-lease

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch forced-relay gate
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REF: fix/13474-viewport-presentation-lease
        run: |
          set -euo pipefail
          gh workflow run iroh-release-gate.yml \
            --repo manaflow-ai/cmux \
            --ref "$TARGET_REF" \
            -f ref="$TARGET_REF" \
            -f mode=relay-only
