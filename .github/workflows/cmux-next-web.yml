name: cmux-next web

# ci.yml runs on pull requests only, so feat-cmux-next itself never ran ci-web's
# checks: a base web red went unseen (react-apps-check, 2026-10-07), and
# gh-merge-green's base-aware excusal had no base verdict to compare a PR's web
# red with. Every push runs them here as the `web` job, under the same
# `web / ...` names as on a pull request. ci-web routes its subareas from
# everything the push brought (event.before..sha); react-apps-check is always
# included for this base branch so a web red cannot hide, while the other
# subareas remain path-routed. Linux only.
#
# Lawrence took the push trigger off on 2026-10-10 (cx-g34i: push CI is the Swift
# build only). Without it, direct pushes brought web reds nobody saw until a pull
# request tripped over them, and a pull request's new web red passed as a base red
# (#20633). Leo, 2026-10-19: the base stays green by construction. The routing keeps
# unrelated Swift-only work cheap while retaining the base React signal.
#
# 2026-11-21: the base's web verdict moved to the post-merge batch tier (cmux-next-post-merge.yml, suite `web`, which
# calls ci-web.yml with the same `web / ...` job names); this file no longer runs on feat-cmux-next pushes. Leo,
# 2026-11-21: "id rather we simply cut shit now and revisit later." It stays for its dispatch: next_batch.py's web
# lane dispatches it on a stack head (WEB_WORKFLOW), where coalesce runs at once (`wait --off`) and web bisect, a
# push-only job, never starts. The batch tier's own bisect replaces web bisect and the 120-minute coalescing below.
# post_merge_batch.py tick no longer dispatches its coalescing tick (the `tick` input stays for a hand dispatch).
on:
  workflow_dispatch:
    inputs:
      tick:
        description: the scheduled coalescing tick (post_merge_batch.py tick); runs the checks only when the window has passed and the tip is not covered
        type: boolean
        default: false
permissions:
  contents: read

#
# Coalesced (2026-11-03, cmuxterm-hq build-fleet data for 2026-11-02: 919 push runs, about $4.1k of Blacksmith a
# day, nearly all for a commit a newer push already held): the web checks run at most once every 120 minutes, on
# the first push (or tick) after the window, routed from the commit the last run tested, so each run checks
# everything since. The `coalesce` job decides in seconds (scripts/ci/web_coalesce.py wait) and never sleeps: a push
# inside the window yields at once (its checks are skipped), and post_merge_batch.py tick, every 30 minutes from
# main's cmux-next-post-merge-dispatch.yml, dispatches this workflow with tick=true on the tip so a quiet tail is
# still checked. Until 2026-11-21 the job slept out the window on a runner (about 700 runner-minutes a day). When a
# coalesced run's webview tests go red, `web bisect` re-runs only the new red files on the commits it covered and
# names the first red commit and its pull request (test_reds.py bisect_report). Pull requests are unchanged.
# `web lint (fast)` keeps one run per push in cmux-next-web-lint.yml. vars.NEXT_WEB_COALESCE = '0' runs every push
# at once. The window was 15 minutes until 2026-11-04 (about 96 runs a day) and 30 until 2026-11-21 (46 runs, about
# 20,000 runner-minutes a day, every shard red; CI time map, cmuxterm-hq#16094); 120 is about 12 runs a day.

# One run per pushed commit: a later push must not cancel the verdict that
# base-aware excusal reads.
concurrency:
  group: cmux-next-web-${{ github.sha }}
  cancel-in-progress: false

env:
  # Temporary REST budget attribution: one gh-call line per GitHub API call (scripts/ci/api_call_log/env.sh, fetched at a fixed commit when the checkout has no copy).
  BASH_ENV: '$({ w="${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh"; t="${RUNNER_TEMP:-/nonexistent}/api-call-log-src"; if [ -f "$w" ]; then echo "$w"; elif [ -n "${RUNNER_TEMP:-}" ]; then if [ ! -f "$t/env.sh" ] && [ ! -e "$t.tried" ] && { [ "${RUNNER_OS:-}" = Linux ] || [ "${RUNNER_OS:-}" = macOS ]; } && [ "$(date -u +%Y%m%d%H)" -lt 2026112300 ]; then : > "$t.tried"; mkdir -p "$t.part" && for x in env.sh gh sitecustomize.py isolated.py; do curl -fsSL --max-time 5 -o "$t.part/$x" "https://raw.githubusercontent.com/manaflow-ai/cmux/27647ffd3ae838c63be28ca3e5883dcd68c34518/scripts/ci/api_call_log/$x" || break; done; [ -s "$t.part/isolated.py" ] && mv "$t.part" "$t"; fi; if [ -f "$t/env.sh" ]; then echo "$t/env.sh"; else echo unset BASH_ENV > "$t.off.sh" && echo "$t.off.sh"; fi; fi; } 2>/dev/null)'

jobs:
  coalesce:
    name: coalesce
    # A few seconds of work, no sleep: the reconciled Linux pool's small member, as the base tier kick does.
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || 'cmux-linux' }}
    timeout-minutes: 5
    # One coalesce job decides at a time, so each reads the marker the one before it saved; a newer push's replaces a
    # pending one (never a started one). A push and the tick share the group. Any other dispatch (next_batch's web
    # lane), a re-run and the off switch get a group of their own and run at once: a re-run never waits behind or is
    # replaced by a new push's coalesce job (#34158).
    concurrency:
      group: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch' && inputs.tick) && github.ref == 'refs/heads/feat-cmux-next' && format('{0}', vars.NEXT_WEB_COALESCE) != '0' && github.run_attempt == '1' && 'cmux-next-web-coalesce' || format('cmux-next-web-coalesce-{0}-{1}', github.run_id, github.run_attempt) }}
      cancel-in-progress: false
    outputs:
      base: ${{ steps.wait.outputs.base }}
      run: ${{ steps.wait.outputs.run }}
    env:
      COALESCE: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch' && inputs.tick) && github.ref == 'refs/heads/feat-cmux-next' && format('{0}', vars.NEXT_WEB_COALESCE) != '0' && '1' || '0' }}
      TICK: ${{ github.event_name == 'workflow_dispatch' && inputs.tick && '1' || '0' }}
    steps:
      - name: Checkout the coalesce helper
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            scripts/ci/web_coalesce.py
            scripts/ci/web_subareas.py
            scripts/ci/webviews_test_history.py
            .gitmodules
          sparse-checkout-cone-mode: false

      # The last push that ran the web checks: the newest entry by its prefix. Missing (the first run, an eviction)
      # means no wait, and every web check runs (an empty push base): the range this push covers is unknown.
      - name: Restore the last covered push
        if: ${{ env.COALESCE == '1' }}
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/web-coalesce/last.json
          key: cmux-next-web-coalesce-${{ github.ref_name }}-none
          restore-keys: cmux-next-web-coalesce-${{ github.ref_name }}-

      - name: Run once per 120-minute window
        id: wait
        env:
          PUSH_BEFORE: ${{ github.event_name == 'push' && github.event.before || '' }}
        run: |
          mode=(); [ "$COALESCE" = 1 ] || mode=(--off); [ "$TICK" = 1 ] && mode+=(--tick)
          python3 -I scripts/ci/web_coalesce.py wait "${mode[@]}" --last "$RUNNER_TEMP/web-coalesce/last.json" \
            --sha "$GITHUB_SHA" --before "$PUSH_BEFORE" --attempt "$GITHUB_RUN_ATTEMPT" --hold-minutes 120 --out "$RUNNER_TEMP/web-coalesce/last.json"

      # A re-run records nothing new (its marker is the one it read), and in its own group a late save could roll the
      # newest marker back: only a first attempt saves.
      - name: Record this push as the last covered one
        if: ${{ env.COALESCE == '1' && steps.wait.outputs.run == 'true' && github.run_attempt == '1' }}
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/web-coalesce/last.json
          key: cmux-next-web-coalesce-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}

  web:
    needs: coalesce
    # A yielded coalesce job (a newer push's run checks these commits) runs no checks.
    if: ${{ needs.coalesce.outputs.run != 'false' }}
    # actions: read: the webview base replay reads the base's flake history artifact (ci-web.yml).
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: ./.github/workflows/ci-web.yml
    with:
      web: ${{ 'true' }}
      macos: ${{ 'false' }}
      agent_session_web: ${{ 'true' }}
      push_base: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch' && inputs.tick) && needs.coalesce.outputs.base || '' }}
    # R2 write secrets: a push saves the base's webview test history there for pull requests.
    secrets:
      CI_CACHE_R2_ACCESS_KEY_ID: ${{ github.ref == 'refs/heads/feat-cmux-next' && secrets.CI_CACHE_R2_ACCESS_KEY_ID || '' }}
      CI_CACHE_R2_SECRET_ACCESS_KEY: ${{ github.ref == 'refs/heads/feat-cmux-next' && secrets.CI_CACHE_R2_SECRET_ACCESS_KEY || '' }}
      CI_CACHE_R2_ACCOUNT_ID: ${{ github.ref == 'refs/heads/feat-cmux-next' && secrets.CI_CACHE_R2_ACCOUNT_ID || '' }}

  # A coalesced run covers every commit since the last one. When its webview tests go red, the first red commit of
  # each new red file is found by re-running only those files, only on the commits the run covered whose webview
  # inputs changed (scripts/ci/web_coalesce.py bisect, a binary search of at most 6 probes). It reports and never
  # fails: its lines are what base-red-watch names the first red commit and its pull request from, and the report's
  # `culprits` (each pinned commit, its pull request and the files it broke) is what an auto-revert reads from the
  # web-bisect artifact.
  web-bisect:
    name: web bisect
    needs: [coalesce, web]
    if: ${{ !cancelled() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' && inputs.tick) && needs.coalesce.result == 'success' && needs.web.result == 'failure' && needs.coalesce.outputs.base != '' && needs.coalesce.outputs.base != 'all' }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || 'cmux-linux' }}
    timeout-minutes: 75
    # actions: read: the base's webview test history is an artifact of its newest push.
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout with history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: false # patterns: .github/checkout-lean.json
          sparse-checkout: |
            /*
            !/cmux-next-ios/verify/
          # The bisector reads the reconciler's read-only last-known-green ref below.
          # Credentials stay disabled; the read step scopes its token to one fetch.
          persist-credentials: false

      - name: Read last-known-green
        id: lkg
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          auth=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')
          git -c "http.extraheader=AUTHORIZATION: basic $auth" fetch --no-tags origin refs/heads/last-known-green:refs/remotes/origin/last-known-green >/dev/null 2>&1
          unset auth GITHUB_TOKEN
          sha=$(git rev-parse refs/remotes/origin/last-known-green 2>/dev/null || true)
          case "$sha" in
            [0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]*) echo "sha=$sha" >> "$GITHUB_OUTPUT" ;;
            *) echo "sha=" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Download this run's webview results
        id: results
        continue-on-error: true
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: webviews-test-history-shard*
          path: ${{ runner.temp }}/web-bisect-results

      # The base's push verdicts: whether a red was already red at the run before, or flips by itself.
      # The webviews-test-history artifact its newest push uploaded (ci-web.yml); two requests.
      - name: Restore the base's webview test history
        continue-on-error: true
        timeout-minutes: 2
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          python3 scripts/ci/webviews_test_history.py fetch "$RUNNER_TEMP/webviews-test-history/history.json" \
            --repo "$GITHUB_REPOSITORY" --branch "$BRANCH"

      - name: Restore pinned Bun 1.4.4 from the CI cache bucket
        shell: bash
        continue-on-error: true
        run: bash "$GITHUB_WORKSPACE/scripts/ci/toolchain-r2.sh" restore bun 1.4.4 || true

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
          no-cache: ${{ !startsWith(github.workspace, '/home/runner/work/') }}

      - name: Use the VM runner guest Bun cache
        id: fsr-bun-cache
        timeout-minutes: 2
        if: ${{ startsWith(runner.name, 'fsr-') }}
        run: bash scripts/ci/fsr-bun-cache.sh check bun-webviews webviews/bun.lock

      # Why: docs/ci/cmux-next-workflow-notes/2026-11-26-bun-cache-warm.md (detector: tests/test_ci_bun_cache_warm.py).
      - name: Is this runner's own Bun package cache warm
        id: bun-warm
        timeout-minutes: 1
        shell: bash
        run: |
          d="${BUN_INSTALL_CACHE_DIR:-$HOME/.bun/install/cache}"
          if [[ "${RESTORE_ON_WARM:-}" != 1 && -n "$(find "$d" -mindepth 1 -maxdepth 1 -print -quit 2>/dev/null)" ]]; then
            echo "warm=true" >> "$GITHUB_OUTPUT"
            echo "$d is already filled from this runner's earlier jobs; the cache archive is not unpacked over it"
          fi
        env:
          RESTORE_ON_WARM: ${{ vars.CI_BUN_CACHE_RESTORE_WARM }}

      # Saved only on feat-cmux-next, whose scope every ref reads; a hand dispatch on another ref (tick=true) only
      # restores, so it adds no copy that only that ref reads again (handbook run-scoped-cache-key-evicts-the-store).
      - name: Cache Bun package cache
        timeout-minutes: 3
        continue-on-error: true
        if: ${{ github.ref == 'refs/heads/feat-cmux-next' && steps.fsr-bun-cache.outputs.hit != 'true' }}
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.bun/install/cache
          key: bun-web-shared-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('web/bun.lock', 'webviews/bun.lock', 'cmux-tui/frontends/web/bun.lock', 'scripts/react-doctor/bun.lock', 'agent-chat/bun.lock', 'backend/bun.lock') }}
          restore-keys: bun-web-shared-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache Bun package cache (restore only off feat-cmux-next)
        timeout-minutes: 5
        continue-on-error: true
        if: ${{ (github.ref != 'refs/heads/feat-cmux-next' && steps.fsr-bun-cache.outputs.hit != 'true') && steps.bun-warm.outputs.warm != 'true' }}
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.bun/install/cache
          key: bun-web-shared-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('web/bun.lock', 'webviews/bun.lock', 'cmux-tui/frontends/web/bun.lock', 'scripts/react-doctor/bun.lock', 'agent-chat/bun.lock', 'backend/bun.lock') }}
          restore-keys: bun-web-shared-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache Playwright browsers
        if: ${{ github.ref == 'refs/heads/feat-cmux-next' }}
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-webviews-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('webviews/bun.lock') }}

      - name: Cache Playwright browsers (restore only off feat-cmux-next)
        if: ${{ github.ref != 'refs/heads/feat-cmux-next' }}
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-webviews-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('webviews/bun.lock') }}

      - name: Restore pinned Node 24.22.1 from the CI cache bucket
        shell: bash
        continue-on-error: true
        run: bash "$GITHUB_WORKSPACE/scripts/ci/toolchain-r2.sh" restore node 24.22.1 || true

      - name: Setup Node
        timeout-minutes: 5
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.22.1"

      - name: Bisect the new webview reds
        continue-on-error: true
        env:
          BASE: ${{ needs.coalesce.outputs.base }}
          WEB_BISECT_RUNNER: ${{ runner.temp }}/web-bisect-runner/ci
        run: |
          # The head's runner, bisect and probe for every probe, whatever commit is checked out. The copy keeps the
          # scripts/ layout one level up, so web_subareas.py finds ../cmux-next/web-bundle-key.py as in the repo.
          mkdir -p "$WEB_BISECT_RUNNER" "$WEB_BISECT_RUNNER/../cmux-next"
          cp scripts/ci/run-webviews-tests.sh scripts/ci/timeout.sh scripts/ci/webviews_test_results.py scripts/ci/webviews_test_shards.py \
            scripts/ci/webviews_test_history.py scripts/ci/web_subareas.py scripts/ci/web_coalesce.py \
            scripts/ci/web-bisect-probe.sh scripts/ci/ensure-system-chrome.sh \
            scripts/ci/pin-browser-test-font.sh "$WEB_BISECT_RUNNER/"
          cp scripts/cmux-next/web-bundle-key.py "$WEB_BISECT_RUNNER/../cmux-next/"
          shopt -s nullglob
          results=("$RUNNER_TEMP"/web-bisect-results/webviews-test-history-shard*/webviews-head-results.json)
          python3 -I "$WEB_BISECT_RUNNER/web_coalesce.py" bisect --base "$BASE" --head "$GITHUB_SHA" \
            --last-known-green "${{ steps.lkg.outputs.sha }}" \
            --results "${results[@]}" --history "$RUNNER_TEMP/webviews-test-history/history.json" \
            --probe "$WEB_BISECT_RUNNER/web-bisect-probe.sh" --report "$RUNNER_TEMP/web-bisect/report.json" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          git checkout -q --force --detach "$GITHUB_SHA"

      - name: Upload the bisect report
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-bisect
          path: ${{ runner.temp }}/web-bisect/report.json
          if-no-files-found: ignore
          retention-days: 3
