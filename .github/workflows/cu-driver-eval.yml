name: cu driver eval

# Registration only. The real cu driver eval lives on feat-cmux-next (its cu-driver-eval.yml, HQ#7146
# G3a). GitHub resolves a workflow by file name only when the file exists on the default branch, so
# without this file cu-driver-eval-dispatch.yml's run list and dispatch 404 every day. A dispatch with
# ref feat-cmux-next runs feat-cmux-next's own cu-driver-eval.yml, never this one. This copy has no
# schedule, pull_request or push trigger, so it never runs on main by itself, and a dispatch on main
# does nothing. The inputs mirror feat-cmux-next's so a dispatch's inputs validate wherever GitHub
# checks them.
on:
  workflow_dispatch:
    inputs:
      drivers:
        description: "Cua Driver builds (cmux-cua is the shipped pin; others from scripts/measure/cu-driver-eval/pins.json)"
        default: "cmux-cua,cua-driver-0.38.0"
      reps:
        description: "trials per arm, target, gesture and condition"
        default: "3"
      worker:
        description: "fleet worker (empty: vars.CU_DRIVER_EVAL_WORKER, else any idle macOS 26 measure worker)"
        default: ""

permissions: {}

jobs:
  registration:
    if: github.ref != 'refs/heads/main'
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 1
    steps:
      - name: Nothing to do outside feat-cmux-next
        run: echo "the cu driver eval runs from feat-cmux-next's cu-driver-eval.yml"
