  # Dispatch runs every tier on any ref of this repository
  # (gh workflow run cmux-next.yml --ref <branch>): feat-cmux-next, the
  # next-batch/* integration branches that scripts/ci/next_batch.py validates,
  # or a pull request's own branch. Only someone with write access can
  # dispatch, so it is as trusted as a push.
  #
  # Same-tree mode (same_tree_sha set): scripts/ci/cmux_next_tree_notify.py
  # dispatches it from the cmux-tui artifacts workflow once a tree that a run
  # probed as unpublished is published (or failed). It runs only the tree jobs
  # (daemon tests, scheme compile) on same_tree_sha, or only reports the
  # failure, and posts their results as commit statuses on
  # same_tree_status_sha (the push, or the pull request head).
  workflow_dispatch:
    inputs:
      same_tree_sha:
        description: "Same-tree mode: the commit to test (a push, or a pull request's merge commit)"
        required: false
        default: ""
      same_tree_status_sha:
        description: "Same-tree mode: the commit that gets the result statuses"
        required: false
        default: ""
      same_tree_tiers:
        description: "Same-tree mode: daemon, scheme or daemon,scheme"
        required: false
        default: ""
      same_tree_state:
        description: "Same-tree mode: ready (run the jobs) or failed (report why)"
        required: false
        default: ""
      same_tree_reason:
        description: "Same-tree mode: why the tree is unavailable (failed)"
        required: false
        default: ""
      same_tree_origin:
        description: "Same-tree mode: push or pull_request"
        required: false
        default: ""
      same_tree_origin_run:
        description: "Same-tree mode: the cmux-next run that probed the tree"
        required: false
        default: ""
      dev_daily:
        description: "Build the Release cmux NEXT DEV artifact for the scheduled dev channel"
        required: false
        default: false
        type: boolean
      dev_daily_sha:
        description: "Expected feat-cmux-next SHA for the scheduled dev channel"
        required: false
        default: ""
      tip_swift_suite:
        description: "Run only the CmuxNext Swift suite (every target) on the feat-cmux-next tip"
        required: false
        default: false
        type: boolean
      # The safety net under CI_NEXT_JOB_REUSE: a dispatch with no_reuse runs every job
      # in full, reusing no recorded pass (it still records its own). A nightly one on
      # feat-cmux-next re-checks what the day's reused results stood on.
      no_reuse:
        description: "Run every job in full: reuse no pass recorded on the same inputs (CI_NEXT_JOB_REUSE)"
        required: false
        default: false
        type: boolean

run-name: >-
  ${{ inputs.dev_daily == true && format('cmux NEXT DEV daily · {0}', inputs.dev_daily_sha || github.sha) || inputs.tip_swift_suite == true && format('cmux-next tip Swift suite · {0}', github.sha) || inputs.no_reuse == true && format('cmux-next uncached · {0}', github.sha) || format('cmux-next · {0}', github.sha) }}

permissions:
  contents: read

env:
  # HQ's public cache edge serves read-only restores from every runner; writes
  # use the controller-owned R2 credentials in the seed steps below.
  CI_CACHE_R2_PUBLIC_URL: ${{ vars.CI_CACHE_R2_PUBLIC_URL || 'https://ci-cache.cmux.com' }}
  # Structural, style, size and drift guards (god files, size caps, package
  # conventions, motion tokens, type scale, scrollbars, icons, copy lints,
  # generated-doc drift) still run and print their findings, but only warn
  # (Leo, 2026-10-19: they failed pull requests for reasons unrelated to the
  # change). Correctness and safety checks still fail. Set to `fail` to make
  # the style guards block again.
  CMUX_NEXT_STYLE_GUARDS: warn
  # The label attempt 1's macOS jobs take when macos-placement finds an idle
  # owned runner for them: a glaeda-* label means a mini. Each macOS job's
  # runs-on, and its own CMUX_NEXT_RUNNER, restate it with the placement.
  CMUX_NEXT_SIDE_ROUTE: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-6vcpu-macos-26' || vars.CI_PR_POOL_OWNED == '1' && contains(fromJSON('["pull_request","push","workflow_dispatch"]'), github.event_name) && github.run_attempt == 1 && vars.CI_SIDE_LANE_RUNNER || vars.MACOS_RUNNER_26 || 'blacksmith-6vcpu-macos-26') }}

concurrency:
  # Pushes and dispatches get a group of their own, as in the other side
  # lanes: when the owned-pool rescue re-runs an older push run, it must not
  # join a group where it would replace (cancel) the newest pending run.
  # The Mac jobs of a push (swift test, Release compile, generated files,
  # daemon tests, scheme compile) keep independent job groups: a started job
  # runs to the end and stale work is filtered before it takes a runner. Fast
  # checks still run on every push. Push runs upload no
  # owned-pool-watch marker, because the rescue cancels a push run with a newer
  # push run behind it, running jobs included; at 1 push a minute no tip
  # swift test completed (2026-10-07 00:20Z to 01:05Z).
  # A plain dispatch on a working branch (not feat-cmux-next, not next-batch/*,
  # not same-tree mode or the DEV daily) is grouped by its ref and a newer one
  # cancels it, like a pull request's push: a superseded dispatch does not hold
  # a mini in the queue.
  group: ${{ github.event_name == 'workflow_dispatch' && inputs.same_tree_sha == '' && inputs.dev_daily != true && github.ref != 'refs/heads/feat-cmux-next' && !startsWith(github.ref, 'refs/heads/next-batch/') && format('cmux-next-dispatch-{0}', github.ref) || format('cmux-next-{0}', github.event.pull_request.number || github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' && inputs.same_tree_sha == '' && inputs.dev_daily != true && github.ref != 'refs/heads/feat-cmux-next' && !startsWith(github.ref, 'refs/heads/next-batch/') }}

# The macOS jobs run as a side lane, like relay-tls.yml and reload-build.yml:
# Trusted runs (a same-repository pull request, a push or a dispatch) stay on
# vars.CI_SIDE_LANE_RUNNER, the minis' glaeda-side-* label, while owned pools
# are on (CI_PR_POOL_OWNED is 1). Fork pull requests keep their fallback.
# Manual reruns stay minis-first. The rescue re-admits a queued run after the
# five-minute queue alarm: placement first uses a free owned GUI/session Mac,
# then the workflow's Blacksmith macOS route. macos-placement records idle
# side runners with the main picker's idle_placement() and publishes free role
# labels for the bot retry, so a job does not keep a shared concurrency slot
# on a busy Blacksmith label indefinitely. When a job takes the side label, macos-placement uploads the
# owned-pool-watch marker:
# ci-owned-pool-rescue.yml's sweeper on main adopts the run
# (owned_pool_rescue.SIDE_WORKFLOW_PATHS) and re-runs a job a mini leaves
# queued or refuses. Bot attempt 2 and later drop the stale placement output
# and re-admits it through the same fast-checks/owned-Mac/Blacksmith order; a
# person's re-run stays on the side label.
jobs:
  # feat-cmux-next push CI is the Swift app build only (Lawrence, 2026-10-10): its
  # pushes run the Release compile, the app scheme compile and the nightly-next
  # request. checks, web bundles, swift test, daemon tests and generated files run
  # on workflow_dispatch (gh workflow run cmux-next.yml --ref <ref>). A same-repository pull
  # request into feat-cmux-next runs the Mac tiers its paths reach (#22303), but the Release
  # compile and the app scheme compile only with full-ci (2026-10-21). The fast-check
  # path keeps the Mac tiers from occupying a scarce owned lane;
  # macos-placement sends compatible work to free capacity when no owned runner is idle.
  # A push can sit in the owned-pool queue after newer commits have landed.
  # Resolve the branch head before any Mac job requests a runner.
  # The lookup fails open so the current head still gets its compile and
  # nightly-next promotion. Keep the run-id concurrency group below: rescue
  # reruns of an older push must not cancel the newest pending run.
  push-head-preflight:
    if: ${{ inputs.same_tree_sha == '' }}
    name: cmux-next push head preflight
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 2
    permissions:
      actions: write
      contents: read
    outputs:
      current: ${{ steps.head.outputs.current }}
    steps:
      - name: Check whether this push is still the branch head
        id: head
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current=true
          if [[ "$EVENT_NAME" == push && "$REF" == refs/heads/feat-cmux-next ]]; then
            authorization="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
            remote_sha="$(timeout 15 git -c "http.extraHeader=Authorization: Basic $authorization" \
              ls-remote "${SERVER_URL}/${REPOSITORY}.git" "$REF" 2>/dev/null | awk 'NR==1{print $1}')" || remote_sha=""
            if [[ -n "$remote_sha" && "$remote_sha" != "$SHA" ]]; then
              current=false
              echo "Superseded feat-cmux-next push $SHA; current branch head is $remote_sha."
            elif [[ -z "$remote_sha" ]]; then
              echo "::warning::could not resolve the current feat-cmux-next head; keeping macOS work enabled"
            else
              echo "Current feat-cmux-next head is $SHA."
            fi
          fi
          echo "current=$current" >> "$GITHUB_OUTPUT"

  # Picks the tiers a pull request runs (scripts/ci/cmux_next_route.py; the
  # header above lists them). The diff is the merge commit against its first
  # parent, so commits that landed on the base after the branch point are not
  # counted as the pull request's own. Labels are read live, so labeling a
  # PR full-ci and re-running the workflow runs every tier, not only the
  # routed ones.
  # Pushes and dispatches run every tier.
  #
  # The daemon and scheme tiers also need this commit's same-tree cmux-tui.
  # It is probed once here, never awaited (pin-cmux-tui.sh probe): published,
  # the tree jobs run in this run; still being built, this run leaves a
  # cmux-next-tree-wait-<key> marker and skips them, and the cmux-tui
  # artifacts run that publishes the key dispatches this workflow's same-tree
  # mode for it (scripts/ci/cmux_next_tree_notify.py). A superseded push skips
  # them; a tree that nothing will publish fails same-tree-cmux-tui at once.
  path_route:
    if: ${{ inputs.same_tree_sha == '' }}
    name: cmux-next path routing
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 5
    permissions:
      # This job executes the checked-out revision's routing and probe scripts,
      # including on same-repository pull requests. It may inspect Actions and
      # source, but only trusted default-branch controls may mutate either.
      actions: read
      contents: read
      pull-requests: read
    outputs:
      native: ${{ steps.route.outputs.native }}
      swift_canary: ${{ steps.route.outputs.swift_canary }}
      cmuxnext_swift: ${{ steps.route.outputs.cmuxnext_swift }}
      swift_canary_targets: ${{ steps.route.outputs.swift_canary_targets }}
      macos: ${{ steps.route.outputs.macos }}
      scheme: ${{ steps.route.outputs.scheme }}
      generated: ${{ steps.route.outputs.generated }}
      swift: ${{ steps.route.outputs.swift }}
      daemon: ${{ steps.route.outputs.daemon }}
      full: ${{ steps.route.outputs.full }}
      vendored_pin: ${{ steps.route.outputs.vendored_pin }}
      swift_filter: ${{ steps.route.outputs.swift_filter }}
      swift_targets: ${{ steps.route.outputs.swift_targets }}
      # ready, deferred, superseded or failed; empty when no tree tier runs.
      tree_state: ${{ steps.marker-upload.outcome == 'failure' && 'failed' || steps.tree-final.outputs.tree_state || steps.tree.outputs.tree_state }}
      tree_key: ${{ steps.tree.outputs.tree_key }}
      # A pull request that changes no cmux-tui path and whose own tree is not
      # ready: the published tree its tree jobs fetch (CMUX_TUI_TREE_KEY).
      tree_fetch_key: ${{ steps.tree-final.outputs.tree_fetch_key || steps.tree.outputs.tree_fetch_key }}
      tree_reason: ${{ steps.marker-upload.outcome == 'failure' && 'the tree wait marker was not uploaded, so no publish would start the tree jobs; re-run this run' || steps.tree-final.outputs.tree_reason || steps.tree.outputs.tree_reason }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          # The merge commit and its first parent (the base).
          fetch-depth: 2
      - name: Classify pull request paths
        id: route
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DEV_DAILY: ${{ inputs.dev_daily || false }}
          DEV_DAILY_SHA: ${{ inputs.dev_daily_sha }}
          TIP_SWIFT_SUITE: ${{ inputs.tip_swift_suite || false }}
          SAME_TREE_SHA: ${{ inputs.same_tree_sha }}
          GH_TOKEN: ${{ github.token }}
          # The labels at the push. A re-run keeps that event, so it reads them
          # live: adding full-ci or dev-build and re-running routes on them.
          EVENT_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          set -euo pipefail
          changed="$RUNNER_TEMP/changed-files.txt"
          labels=""
          if [[ "$EVENT_NAME" == pull_request ]]; then
            git diff --no-renames --name-only HEAD^1 HEAD > "$changed"
            if [[ "$GITHUB_RUN_ATTEMPT" == 1 ]]; then
              labels="$EVENT_LABELS"
            else
              labels="$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels" --jq '[.[].name] | join(",")' 2>/dev/null)" || {
                echo "::warning::could not read the pull request labels; routing on its paths only"
                labels=""
              }
            fi
          else
            : > "$changed"
          fi
          echo "changed files: $(wc -l < "$changed"); labels: ${labels:-none}"
          if [[ "$EVENT_NAME" == workflow_dispatch && "$DEV_DAILY" == true ]]; then
            # The dispatcher (main's cmux-next-dev-daily-dispatch.yml) asks for
            # the feat-cmux-next tip it saw. A merge that lands before this run
            # starts moves github.sha: fail without building, and the next tick
            # asks for the new tip. No snapshot ref: creating a ref at a
            # feat-cmux-next commit needs the workflows permission (HTTP 403).
            [[ "$GITHUB_REF" == refs/heads/feat-cmux-next ]] || {
              echo "error: dev_daily runs on refs/heads/feat-cmux-next, got $GITHUB_REF" >&2
              exit 1
            }
            if [[ -n "$SAME_TREE_SHA" ]]; then
              [[ "$DEV_DAILY_SHA" == "$SAME_TREE_SHA" ]] || {
                echo "error: deferred dev_daily asked for $DEV_DAILY_SHA but same-tree mode is $SAME_TREE_SHA" >&2
                exit 1
              }
            else
              [[ "$DEV_DAILY_SHA" == "$GITHUB_SHA" ]] || {
                echo "error: dev_daily asked for $DEV_DAILY_SHA but feat-cmux-next moved to $GITHUB_SHA; the next dispatcher tick takes the new tip" >&2
                exit 1
              }
            fi
            {
              echo 'native=false'
              echo 'swift_canary=false'
              echo 'cmuxnext_swift=false'
              echo 'swift_canary_targets='
              echo 'macos=true'
              echo 'scheme=true'
              echo 'generated=false'
              echo 'swift=false'
              echo 'daemon=false'
              echo 'full=false'
              echo 'swift_filter='
              echo 'swift_targets='
            } >> "$GITHUB_OUTPUT"
            {
              echo '### cmux-next tiers'
              echo
              echo '| tier | runs |'
              echo '| --- | --- |'
              echo '| generated | false |'
              echo '| native | false |'
              echo '| swift_canary | false |'
              echo '| scheme | true |'
              echo '| swift | false |'
              echo '| daemon | false |'
              echo '| full | false |'
              echo
              echo '- scheduled dev-daily dispatch: the exact feat-cmux-next SHA builds the Release cmux NEXT DEV artifact in the scheme job.'
            } >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$EVENT_NAME" == workflow_dispatch && "$TIP_SWIFT_SUITE" == true ]]; then
            # main's cmux-next-tip-swift-suite-dispatch.yml, every few hours: a
            # feat-cmux-next push skips swift-test (push CI is the app build
            # only), so a Swift suite red on the base stayed invisible for a day
            # (2026-10-21). This run gives swift-test a verdict on the tip, the
            # base run scripts/ci/base_red_excuse.py compares a PR's reds with.
            # Only the Swift suite: no scheme, daemon, native or generated tier.
            # It tests the tip it starts on, whatever the dispatcher saw.
            [[ "$GITHUB_REF" == refs/heads/feat-cmux-next ]] || {
              echo "error: tip_swift_suite runs on refs/heads/feat-cmux-next, got $GITHUB_REF" >&2
              exit 1
            }
            {
              echo 'native=false'
              echo 'swift_canary=false'
              echo 'cmuxnext_swift=false'
              echo 'swift_canary_targets='
              echo 'macos=true'
              echo 'scheme=false'
              echo 'generated=false'
              echo 'swift=true'
              echo 'daemon=false'
              echo 'full=false'
              echo 'swift_filter='
              echo 'swift_targets=all'
            } >> "$GITHUB_OUTPUT"
            {
              echo '### cmux-next tiers'
              echo
              echo '| tier | runs |'
              echo '| --- | --- |'
              echo '| swift | true (every target) |'
              echo
              echo '- scheduled tip Swift suite: every CmuxNext Swift target on the feat-cmux-next tip.'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            python3 scripts/ci/cmux_next_route.py --event "$EVENT_NAME" --changed-files "$changed" \
              --labels "$labels" --github-output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"
          fi
          # Whether this pull request changes the cmux-tui it would test against:
          # any v2 tree-key input (cmux-tui-tree-inputs.txt), such as cmux-tui/,
          # ghostty-next or cmux-cloud's crate. One that does not is never
          # failed for an unpublished merge tree (the probe steps below,
          # CMUX_TUI_TREE_BASE_FALLBACK).
          if [[ "$EVENT_NAME" == pull_request ]] && ! python3 - "$changed" <<'PY'
          import sys
          inputs = []
          for raw in open("scripts/cmux-next/cmux-tui-tree-inputs.txt", encoding="utf-8"):
              raw = raw.strip()
              if raw and not raw.startswith("#"):
                  kind, path = raw.split(maxsplit=1)
                  if (kind, path) != ("gitlink", "ghostty"):  # v1 key only
                      inputs.append((kind, path))
          changed = [line.strip() for line in open(sys.argv[1], encoding="utf-8") if line.strip()]
          hit = any(c == p or (k == "tree" and c.startswith(p + "/")) for c in changed for k, p in inputs)
          sys.exit(0 if hit else 1)
          PY
          then
            echo "own_tui=false" >> "$GITHUB_OUTPUT"
          else
            echo "own_tui=true" >> "$GITHUB_OUTPUT"
          fi

      # One look (and one short re-check of a missing run list), no wait.
      - name: Probe the same-tree cmux-tui
        id: tree
        if: (steps.route.outputs.daemon == 'true' || steps.route.outputs.scheme == 'true')
        env:
          # Push runs use the artifacts run already started by that protected
          # branch. Pull requests may fall back to the base tree; a missing own
          # tree fails closed because this checked-out revision cannot dispatch.
          # A scheduled DEV run likewise owns its exact SHA without mutation
          # authority; only trusted controls may start a publisher. Its probe
          # looks once (read-only) for its push's artifacts run or a same-tree
          # run and defers to it; dev-daily-tree-wait then waits.
          CMUX_TUI_TREE_PUBLISHER_SHA: ${{ github.event_name != 'pull_request' && inputs.dev_daily != true && github.sha || '' }}
          CMUX_TUI_TREE_DISPATCH: ""
          CMUX_TUI_TREE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # DEV is a cutting-edge app channel: if this head's daemon tree is
          # still publishing, build the exact app head against the newest
          # published compatible tree instead of waiting on nightly's tree.
          CMUX_TUI_TREE_BASE_FALLBACK: ${{ (inputs.dev_daily == true || steps.route.outputs.own_tui == 'false') && '1' || '' }}
          # A same-repository PR with its own merge tree waits (read-only, the
          # script's 90s default) for the artifacts run main's
          # cmux-next-pr-merge-tree.yml starts on cmux-tui-pin-<sha12>. That
          # workflow skips forks, so a fork PR looks once.
          CMUX_TUI_TREE_PUBLISHER_WAIT_SECONDS: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && '0' || '' }}
          GH_TOKEN: ${{ github.token }}
        run: scripts/cmux-next/pin-cmux-tui.sh probe

      # What the publish needs to start this run's tree jobs later. Written for
      # failed too: a later publication of the key (a takeover run, a
      # cmux-tui-pin-* push) still starts them.
      - name: Write the tree wait marker
        id: marker
        # A DEV daily run waits for its own tree (job dev-daily-tree-wait): a
        # same-tree run would start only while the tip is still its SHA.
        if: inputs.dev_daily != true && (steps.tree.outputs.tree_state == 'deferred' || steps.tree.outputs.tree_state == 'failed')
        env:
          KEY: ${{ steps.tree.outputs.tree_key }}
          DAEMON: ${{ steps.route.outputs.daemon }}
          SCHEME: ${{ steps.route.outputs.scheme }}
          EVENT_NAME: ${{ github.event_name }}
          SHA: ${{ github.sha }}
          STATUS_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BRANCH: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          DEV_DAILY: ${{ inputs.dev_daily || false }}
          DEV_DAILY_SHA: ${{ inputs.dev_daily_sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/cmux-next-tree-wait"
          mkdir -p "$dir"
          python3 - "$dir/marker.json" <<'PY'
          import json, os, sys
          env = os.environ
          tiers = [tier for tier, on in (("daemon", env["DAEMON"]), ("scheme", env["SCHEME"])) if on == "true"]
          marker = {"version": 1, "key": env["KEY"], "sha": env["SHA"], "status_sha": env["STATUS_SHA"],
                    "tiers": tiers, "run_id": int(env["GITHUB_RUN_ID"])}
          if env["DEV_DAILY"] == "true":
              marker.update(dev_daily=True, dev_daily_sha=env["DEV_DAILY_SHA"])
          if env["EVENT_NAME"] == "pull_request":
              marker.update(origin="pull_request", pr=int(env["PR_NUMBER"]), head_ref=env["HEAD_REF"],
                            head_repo=env["HEAD_REPO"], base_ref=env["BASE_REF"])
          else:
              # A dispatch on a working branch (#22303) is not a push: its same-tree run still
              # runs daemon-test, which a push's skips. The DEV daily stays a feat-cmux-next push.
              if env["EVENT_NAME"] == "workflow_dispatch" and env["DEV_DAILY"] != "true":
                  marker.update(origin="dispatch", branch=env["BRANCH"],
                                ref_kind="tags" if env["REF_TYPE"] == "tag" else "heads")
              else:
                  marker.update(origin="push", branch=env["BRANCH"])
          with open(sys.argv[1], "w", encoding="utf-8") as stream:
              json.dump(marker, stream)
          print(json.dumps(marker))
          PY
          echo "path=$dir/marker.json" >> "$GITHUB_OUTPUT"

      - name: Upload the tree wait marker
        id: marker-upload
        if: steps.marker.outputs.path != ''
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-next-tree-wait-${{ steps.tree.outputs.tree_key }}
          path: ${{ steps.marker.outputs.path }}
          retention-days: 2
          overwrite: true

      # Looked at again after the marker is up: a publish that lands later
      # sees the marker, and one that landed before this look is seen here.
      - name: Probe the same-tree cmux-tui after the marker
        id: tree-final
        if: steps.marker-upload.outcome == 'success'
        env:
          # A scheduled DEV run owns its exact SHA. A cold tree with no active
          # publisher fails closed; this checked-out revision never starts one.
          CMUX_TUI_TREE_PUBLISHER_SHA: ${{ github.event_name != 'pull_request' && inputs.dev_daily != true && github.sha || '' }}
          CMUX_TUI_TREE_DISPATCH: ""
          CMUX_TUI_TREE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CMUX_TUI_TREE_BASE_FALLBACK: ${{ steps.route.outputs.own_tui == 'false' && '1' || '' }}
          CMUX_TUI_TREE_RECHECK_SECONDS: "0"
          # The first probe already waited for main's merge-tree publisher.
          CMUX_TUI_TREE_PUBLISHER_WAIT_SECONDS: "0"
          GH_TOKEN: ${{ github.token }}
        run: scripts/cmux-next/pin-cmux-tui.sh probe

      - name: Summarize the same-tree cmux-tui
        if: steps.tree.outputs.tree_state != ''
        env:
          STATE: ${{ steps.marker-upload.outcome == 'failure' && 'failed' || steps.tree-final.outputs.tree_state || steps.tree.outputs.tree_state }}
          KEY: ${{ steps.tree.outputs.tree_key }}
          REASON: ${{ steps.tree-final.outputs.tree_reason || steps.tree.outputs.tree_reason }}
        run: |
          {
            echo "### same-tree cmux-tui $KEY: $STATE"
            echo
            echo "$REASON"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$STATE" == deferred ]]; then
            echo "::notice title=same-tree cmux-tui deferred::$REASON"
          fi

  # A cmux NEXT DEV daily run builds exactly the SHA main's dispatcher asked
  # for. When its cmux-tui tree is cold, path routing defers without acquiring
  # mutation authority; a trusted publisher may still satisfy the wait. This
  # waits on Linux for the tree,
  # then cmux-scheme-compile builds the DEV app in this run
  # (scripts/cmux-next/wait-dev-daily-tree.sh, tested by
  # scripts/cmux-next/tests/wait-dev-daily-tree.test.sh).
  dev-daily-tree-wait:
    needs: path_route
    if: ${{ !cancelled() && inputs.dev_daily == true && inputs.same_tree_sha == '' && needs.path_route.outputs.tree_state == 'deferred' }}
    name: cmux NEXT DEV daily tree wait
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 60
    permissions:
      # The selected revision may inspect a publisher, never start one.
      actions: read
      contents: read
    outputs:
      tree_state: ${{ steps.wait.outputs.tree_state }}
      tree_fetch_key: ${{ steps.wait.outputs.tree_fetch_key }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Wait for this commit's cmux-tui tree
        id: wait
        env:
          CMUX_TUI_TREE_PUBLISHER_SHA: ""
          CMUX_TUI_TREE_DISPATCH: ""
          GH_TOKEN: ${{ github.token }}
        run: scripts/cmux-next/wait-dev-daily-tree.sh

  macos-placement:
    environment: ${{ github.event_name != 'pull_request' && 'ci-routing-agent' || '' }}
    needs: [path_route, push-head-preflight]
    # Attempt 1's macOS jobs stay on the owned side label while the fleet
    # drains. A bot retry runs placement again so it can use a newly free
    # owned GUI/session runner before falling back to Blacksmith.
    # Every step fails open: a skipped or failed placement leaves
    # fallback_jobs empty, so the jobs keep the side label and the marker is
    # still uploaded. It runs only where attempt 1's Mac jobs may
    # take the side label (CMUX_NEXT_SIDE_ROUTE's owned branch): a fork, another
    # owner, owned pools off or a re-run starts no Linux runner for it, and the
    # Mac jobs (needs plus !cancelled()) take their route without it. A re-run
    # needs no marker of its own: its Mac jobs take the fallback, and the
    # rescue's watch of a side lane ends at attempt 2.
    # Same-tree mode runs it too: its owned-pool-watch marker lets the rescue
    # re-run a tree job that a mini refuses (no head to move on a dispatch).
    # A pull request the router sends to no Mac tier starts no Mac job (the
    # fast tier follows the route too), so it places nothing.
    if: ${{ !cancelled() && ((inputs.same_tree_sha == '' && needs.push-head-preflight.outputs.current == 'true' && needs.path_route.outputs.macos == 'true') || (inputs.same_tree_sha != '' && inputs.same_tree_state == 'ready')) && github.repository_owner == 'manaflow-ai' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.CI_PR_POOL_OWNED == '1' && (github.run_attempt == 1 || (github.run_attempt == 2 && github.triggering_actor == 'github-actions[bot]')) }}
    name: cmux-next macOS placement
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 4
    permissions:
      # The queue janitor's pool snapshot, Blacksmith's queued jobs (next_macos_cascade.py).
      actions: read
      contents: read
    outputs:
      # The jobs no idle mini took that Blacksmith has a free slot for now, 12
      # vCPU first and then 6, and the Blacksmith label the bot's overflow
      # attempt takes (scripts/ci/next_macos_cascade.py).
      blacksmith_12_jobs: ${{ steps.place.outputs.blacksmith_12_jobs }}
      blacksmith_6_jobs: ${{ steps.place.outputs.blacksmith_6_jobs }}
      # The overflow GitHub-hosted macos-26 takes while Blacksmith is full or stalled
      # (its queue is not moving), and that label; only jobs the hosted image can run.
      hosted_jobs: ${{ steps.place.outputs.hosted_jobs }}
      hosted_runner: ${{ steps.place.outputs.hosted_runner }}
      # The overflow label only while it has a free slot, else empty (the owned
      # label below). Read from free_retry_runner, which a placement script
      # predating the free-slot rule never writes.
      retry_runner: ${{ steps.place.outputs.free_retry_runner }}
      # vars.CI_FAST_LANE_RUNNER while one of its runners is idle, else empty
      # (side_lane_placement.fast_route()): the fast tier never queues on it.
      fast_runner: ${{ steps.place.outputs.fast_runner }}
      # vars.CI_COMPILE_CHECK_GATEWAY, or a wider class of it, while it has an idle runner for
      # each gateway job, else empty (side_lane_placement.gateway_route()); gateway_attempt is
      # the run attempt that judged it. A gateway job runs only on a reading from its own
      # attempt; with none (a re-run, a skipped or older placement) it skips and its Mac
      # fallback runs, never a queue nobody saw free.
      gateway_runner: ${{ steps.place.outputs.gateway_runner }}
      gateway_attempt: ${{ steps.place.outputs.gateway_attempt }}
      fallback_jobs: ${{ steps.place.outputs.fallback_jobs }}
      runner: ${{ steps.place.outputs.runner }}
      # GUI suites have a separate label. The generic side label is also
      # carried by headless AWS workers for compile-only capacity.
      gui_runner: ${{ steps.place.outputs.gui_runner }}
      # daemon-test and generated-files need a logged-in session, not the
      # console gui token: the session label (glaeda#1530) while an online
      # runner carries it, else gui_runner. Empty from a trusted base whose
      # placement predates it, so those jobs then read gui_runner.
      session_runner: ${{ steps.place.outputs.session_runner }}
      free_gui_runner: ${{ steps.place.outputs.free_gui_runner }}
      free_session_runner: ${{ steps.place.outputs.free_session_runner }}
      nightly_runner_ready: ${{ steps.place.outputs.nightly_runner_ready }}
    steps:
      # The placement code from the base branch, as ci-macos.yml's admission-placement uses it.
      - name: Check out the trusted placement
        if: startsWith(env.CMUX_NEXT_SIDE_ROUTE, 'glaeda-')
        continue-on-error: true
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          sparse-checkout: scripts/ci
          persist-credentials: false

      - name: Mint the owned-pool routing token
        id: route-token
        if: startsWith(env.CMUX_NEXT_SIDE_ROUTE, 'glaeda-') && vars.GLAEDA_ROUTE_APP_ID != ''
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.GLAEDA_ROUTE_APP_ID }}
          private-key: ${{ secrets.GLAEDA_ROUTE_APP_KEY }}
          permission-administration: read
          permission-organization-self-hosted-runners: read

      # Reads go through the manaflow-glaeda-route App's own budget, not the GITHUB_TOKEN
      # budget every workflow shares (it ran out on 2026-10-25 and the nightly publish
      # failed). No key (a fork) or a failed mint leaves it empty: GITHUB_TOKEN reads.
      - name: Mint the glaeda read token
        id: snapshot-read-token
        if: startsWith(env.CMUX_NEXT_SIDE_ROUTE, 'glaeda-') && vars.GLAEDA_ROUTE_APP_ID != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.GLAEDA_ROUTE_APP_ID }}
          private-key: ${{ secrets.GLAEDA_ROUTE_APP_KEY }}
          permission-actions: read
          permission-pull-requests: read

      # In priority order: the scheme compile keeps its DerivedData on a mini
      # (cold on Blacksmith), and only a mini compiles the CEF shim. A Release
      # compile no idle mini takes (on a feat-cmux-next push: no idle promotion
      # mini) takes a free Blacksmith slot (next_macos_cascade.py).
      - name: Place the macOS jobs
        id: place
        if: startsWith(env.CMUX_NEXT_SIDE_ROUTE, 'glaeda-')
        continue-on-error: true
        timeout-minutes: 2
        env:
          ROUTE_TOKEN: ${{ steps.route-token.outputs.token }}
          SNAPSHOT_TOKEN: ${{ steps.snapshot-read-token.outputs.token || github.token }}
          # The cascade's jobs that run on this route at all (next_macos_cascade.py):
          # not a job that path routing or the pull request's labels skip (a job
          # missing here only stays on the minis' queue). The fast tier is always
          # here; the placement drops it only while an idle runner carries
          # FAST_LABEL, which it then takes (fast_runner).
          CASCADE_RUNS: >-
            ${{ format(' {0} {1} {2} {3} ',
            ((github.event_name == 'pull_request' && github.base_ref == 'feat-cmux-next') || (github.event_name == 'push' && github.ref == 'refs/heads/feat-cmux-next')) && 'fast-tier' || '',
            needs.path_route.outputs.swift_canary == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository || contains(github.event.pull_request.labels.*.name, 'full-ci')) && 'swift-canary' || '',
            (inputs.same_tree_sha != '' && inputs.same_tree_state == 'ready' && contains(inputs.same_tree_tiers, 'scheme') || needs.path_route.outputs.scheme == 'true' && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci') || (github.event.pull_request.author_association == 'MEMBER' || github.event.pull_request.author_association == 'OWNER') && contains(github.event.pull_request.labels.*.name, 'dev-build'))) && 'cmux-scheme-compile' || '',
            needs.path_route.outputs.native == 'true' && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')) && 'release-compile' || '') }}
          # Attempt 1 of a feat-cmux-next push prefers the dedicated cmux NEXT
          # nightly runner; a busy or unavailable runner uses Blacksmith overflow.
          PROMOTE_LABEL: ${{ github.event_name == 'push' && github.ref == 'refs/heads/feat-cmux-next' && github.run_attempt == 1 && vars.CI_NEXT_PROMOTE_POOL || '' }}
          NIGHTLY_POOL: ${{ github.event_name == 'push' && github.ref == 'refs/heads/feat-cmux-next' && github.run_attempt == 1 && vars.CI_NIGHTLY_NEXT_TRUSTED_POOL || '' }}
          NIGHTLY_RUNNER: ${{ github.event_name == 'push' && github.ref == 'refs/heads/feat-cmux-next' && github.run_attempt == 1 && vars.CI_NIGHTLY_NEXT_TRUSTED_RUNNER || '' }}
          SIDE_LABEL: ${{ env.CMUX_NEXT_SIDE_ROUTE }}
          # The fast tier's reserved label, taken only while one of its runners is idle.
          FAST_LABEL: ${{ vars.CI_FAST_LANE_RUNNER }}
          # The build-fleet compiles' gateway, taken (or a wider class of it) only while a runner is
          # idle (gateway_runner). With none idle, app-compile-fleet and swift-canary-fleet do not run,
          # and the PR's Mac Release compile, which runs when app-compile-fleet gives no verdict, joins
          # the cascade (GATEWAY_CASCADE) like swift-canary already does.
          GATEWAY_LABEL: ${{ vars.CI_COMPILE_CHECK_GATEWAY }}
          # The gateway jobs this run starts (their own `if`s), each needing an idle runner.
          GATEWAY_JOBS: >-
            ${{ format('{0} {1} {2}',
            github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && !contains(github.event.pull_request.labels.*.name, 'full-ci') && needs.path_route.outputs.native == 'true' && 'app-compile-fleet' || '',
            needs.path_route.outputs.swift_canary == 'true' && 'swift-canary-fleet' || '',
            github.event_name == 'push' && github.ref == 'refs/heads/feat-cmux-next' && needs.path_route.outputs.native == 'true' && 'release-compile-fast' || '') }}
          GATEWAY_CASCADE: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && !contains(github.event.pull_request.labels.*.name, 'full-ci') && needs.path_route.outputs.native == 'true' && 'release-compile' || '' }}
          JOBS: fast-tier swift-canary cmux-scheme-compile release-compile swift-test daemon-test generated-files
          # A feat-cmux-next push's Release compile gates the nightly-next request, so the cascade
          # places it ahead of the run's other jobs (next_macos_cascade.FIRST_JOBS).
          FIRST_JOBS: ${{ github.event_name == 'push' && github.ref == 'refs/heads/feat-cmux-next' && github.run_attempt == 1 && 'release-compile' || '' }}
        run: |
          python3 scripts/ci/side_lane_placement.py
          # The trusted checkout may still be on a base branch that predates
          # the route output. Keep the same owned-pool fallback for that
          # transition and for an API read that fails closed.
          route="$(awk -F= '$1 == "runner" { value=substr($0, index($0, "=") + 1) } END { print value }' "$GITHUB_OUTPUT")"
          if [ -z "$route" ] && [[ "$SIDE_LABEL" == glaeda-side-* ]]; then
            printf 'runner=glaeda-%s\n' "${SIDE_LABEL#glaeda-side-}" >> "$GITHUB_OUTPUT"
          fi
          # An empty gui_runner is meaningful: no online runner carries the
          # GUI label, so preserve the picker/placement fallback instead of
          # synthesizing a label that may not exist in the fleet.

      # Fail-safe: without the marker the run is only not watched. Skipped
      # when every macOS job took its fallback, and on a push: the push Mac
      # jobs' branch groups bound that queue, and the rescue would cancel a
      # running push run once a newer push exists.
      - name: Mark a run on the minis
        id: marker
        if: startsWith(env.CMUX_NEXT_SIDE_ROUTE, 'glaeda-') && steps.place.outputs.watch != 'false' && github.event_name != 'push' && github.run_attempt == 1
        continue-on-error: true
        run: |
          set -euo pipefail
          marker="$RUNNER_TEMP/macos-pool-persistent.json"
          echo '{}' > "$marker"
          echo "path=$marker" >> "$GITHUB_OUTPUT"

      # With no free overflow slot a bot re-run takes the same side label
      # (retry_runner is empty), so the rescue's cancel and re-run would only
      # send the run to the back of that queue: run 39615562861 went round
      # twice on 2026-10-21. The refusals marker has the sweeper re-run what a
      # mini refuses and leave a long queue alone.
      - name: Upload the owned-pool watch marker
        if: ${{ steps.marker.outputs.path != '' }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.place.outputs.free_retry_runner == '' && 'owned-pool-watch-refusals' || 'owned-pool-watch' }}
          path: ${{ steps.marker.outputs.path }}
          retention-days: 1

  checks:
    # feat-cmux-next pushes run it again (Leo, 2026-10-19; cx-g34i had dropped it): a direct push's
    # red shows on that push, and a pull request's red has a base run to be compared with.
    if: ${{ inputs.dev_daily != true && inputs.same_tree_sha == '' }}
    name: cmux-next checks (god files, concurrency, crash safety, l10n)
    # Blacksmith runners are free here; 16 vCPU runs the script tests 32 at once
    # (scripts/ci/run-checks-concurrently.sh) and the god-file scans faster.
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || 'blacksmith-16vcpu-ubuntu-2404' }}
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      checks: read
    # Pull requests into feat-cmux-next run the cheap static checks, and so does
    # every feat-cmux-next push: gh-merge-green excuses a PR's red lint only when
    # the base's latest push run prints every finding too, so a base red no longer
    # refuses every PR (2026-10-19). The size
    # cap and crash ratchet are cadence checks: they run on pushes and on the
    # full-ci batched integration PR, not on every contributor PR. God files and types are warn-only
    # (Lawrence 2026-10-10): over the hard ceiling (GODFILES_WARN_SLACK: allowance
    # + 20% of the budget, so a new type past 1200 lines) the step writes a
    # warning and passes. Other style ratchets warn under a hard ceiling and fail
    # over it: l10n style errors and custom scrollbars (by count).
    # A warning is ratchet debt: an annotation on the PR run (the issue-writing
    # ratchet-debt job was removed 2026-10-13: push runs skipped this job then,
    # and it never filed an issue). Concurrency, notification
    # centers and crash safety have no warning tier. Each ceiling is set on its
    # own step only: the script tests below expect every hit to fail.
    # Since 2026-10-19 (Leo) every structural, style, size and drift step named
    # in the aggregate's STYLE_CHECKS only warns while CMUX_NEXT_STYLE_GUARDS
    # (workflow env) is `warn`; the correctness and safety steps still fail.
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          # The merge commit and its first parent: the god-file checks compare a
          # pull request against its base.
          fetch-depth: 2

      # Every check runs even when an earlier one fails; the last step fails the
      # job once, naming each red check. Checkout stays fatal: with no tree,
      # the checks have nothing to read.
      - name: God files and types (Swift)
        id: godfiles-swift
        continue-on-error: true
        env:
          EVENT_NAME: ${{ github.event_name }}
          GODFILES_WARN_SLACK: 20
        # A pull request fails only on what it grew (its merge commit's first
        # parent is the base), so a god file already on the base never blocks
        # it. A push checks every file.
        run: |
          base=()
          [[ "$EVENT_NAME" == pull_request ]] && base=(--base HEAD^1)
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/ratchet-debt"
          # Exit 1 is a god file (warn-only); any other code is a broken check and fails.
          rc=0
          scripts/cmux-next/check-no-godfiles.sh --only swift ${base[@]+"${base[@]}"} "$GITHUB_WORKSPACE/Packages/macOS/CmuxNext" | tee "$RUNNER_TEMP/ratchet-debt/godfiles-swift.log" || rc=$?
          if (( rc == 1 )); then
            echo "::warning title=god files (swift)::over the hard ceiling; warn-only (Lawrence 2026-10-10), see this step's log"
          elif (( rc != 0 )); then
            exit "$rc"
          fi

      - name: God files (cmux-tui Rust)
        id: godfiles-rust
        continue-on-error: true
        env:
          EVENT_NAME: ${{ github.event_name }}
          GODFILES_WARN_SLACK: 20
        # A pull request fails only on what it grew (its merge commit's first
        # parent is the base), so a god file already on the base never blocks
        # it. A push checks every file.
        run: |
          base=()
          [[ "$EVENT_NAME" == pull_request ]] && base=(--base HEAD^1)
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/ratchet-debt"
          # Exit 1 is a god file (warn-only); any other code is a broken check and fails.
          rc=0
          scripts/cmux-next/check-no-godfiles.sh --only rust ${base[@]+"${base[@]}"} "$GITHUB_WORKSPACE/Packages/macOS/CmuxNext" | tee "$RUNNER_TEMP/ratchet-debt/godfiles-rust.log" || rc=$?
          if (( rc == 1 )); then
            echo "::warning title=god files (rust)::over the hard ceiling; warn-only (Lawrence 2026-10-10), see this step's log"
          elif (( rc != 0 )); then
            exit "$rc"
          fi

      # Every CmuxNextApp edit re-emits the whole module; the target may only
      # shrink, new features go in their own target (code-quality.md SW14).
      - name: CmuxNextApp size cap
        id: app-size
        continue-on-error: true
        env:
          EVENT_NAME: ${{ github.event_name }}
          FULL_CI: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci') }}
          BEFORE: ${{ github.event.before }}
        # A pull request or push that does not grow the App's source passes even
        # over the cap: a pull request compares with its merge commit's first
        # parent, a push with the commit before it (fetched: checkout is depth 2).
        # A push with no before commit (a new branch) keeps the plain cap.
        run: |
          if [[ "$FULL_CI" != true ]]; then
            echo "Size cap is a batch cadence check; ordinary PRs receive the fast tier only."
            exit 0
          fi
          base=()
          [[ "$EVENT_NAME" == pull_request ]] && base=(--base HEAD^1)
          if [[ "$EVENT_NAME" == push && -n "$BEFORE" && "$BEFORE" != 0000000000000000000000000000000000000000 ]]; then
            git cat-file -e "$BEFORE^{commit}" 2>/dev/null \
              || git fetch --no-tags --quiet --depth=1 origin "$BEFORE" || true
            base=(--base "$BEFORE")
          fi
          scripts/cmux-next/check-app-size.sh ${base[@]+"${base[@]}"} "$GITHUB_WORKSPACE"

      - name: No Swift CLI (the cmux CLI is Rust, plans/cmux-next/cli.md)
        id: no-swift-cli
        continue-on-error: true
        run: scripts/cmux-next/check-no-swift-cli.sh "$GITHUB_WORKSPACE"

      - name: No Swift closed history (the daemon owns it, plans/cmux-next/reopen-closed.md 9)
        id: no-swift-closed-history
        continue-on-error: true
        run: scripts/cmux-next/check-no-swift-closed-history.sh "$GITHUB_WORKSPACE"

      - name: One omnibar (popups, New Tab and tabs share AddressBarView)
        id: single-omnibar
        continue-on-error: true
        run: python3 -I scripts/cmux-next/check-single-omnibar.py "$GITHUB_WORKSPACE"

      # Blocking (not a warn-only style check): the allowlist only shrinks, so a
      # pull request compares with its merge commit's first parent and a push
      # with the commit before it (plans/cmux-next/no-swiftui-DESIGN.md).
      - name: No new SwiftUI (macOS UI is AppKit)
        id: no-swiftui
        continue-on-error: true
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          base=()
          [[ "$EVENT_NAME" == pull_request ]] && base=(--base HEAD^1)
          if [[ "$EVENT_NAME" == push && -n "$BEFORE" && "$BEFORE" != 0000000000000000000000000000000000000000 ]]; then
            git cat-file -e "$BEFORE^{commit}" 2>/dev/null \
              || git fetch --no-tags --quiet --depth=1 origin "$BEFORE" || true
            git cat-file -e "$BEFORE^{commit}" 2>/dev/null && base=(--base "$BEFORE")
          fi
          python3 -I scripts/cmux-next/check-no-swiftui.py ${base[@]+"${base[@]}"} "$GITHUB_WORKSPACE"

      - name: No process scanning (holders register themselves, plans/cmux-next/pty-holder.md 4)
        id: no-process-scan
        continue-on-error: true
        run: python3 -I scripts/cmux-next/check-no-process-scan.py "$GITHUB_WORKSPACE"

      - name: No literal state roots (per-build isolation S7, cx-is1kf.8)
        id: state-roots
        continue-on-error: true
        run: bash scripts/cmux-next/check-state-roots.sh "$GITHUB_WORKSPACE"

      - name: Dialog buttons show their keys (u2647)
        id: dialog-key-hints
        continue-on-error: true
        run: python3 -I scripts/cmux-next/check-dialog-key-hints.py "$GITHUB_WORKSPACE"

      - name: Main-thread concurrency
        id: concurrency
        continue-on-error: true
        run: scripts/cmux-next/check-concurrency.sh "$GITHUB_WORKSPACE/Packages/macOS/CmuxNext"

      # Every web view goes through the engine decision (browser.defaultEngine,
      # browser.siteEngines): PageWebView for cmux pages, BrowserTab for tabs.
      - name: One web view factory
        id: webview-factory
        continue-on-error: true
        run: python3 -I scripts/cmux-next/check-webview-factory.py "$GITHUB_WORKSPACE/Packages/macOS/CmuxNext"

      - name: Crash safety
        id: crash-safety
        continue-on-error: true
        env:
          FULL_CI: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci') }}
        run: |
          if [[ "$FULL_CI" != true ]]; then
            echo "Crash ratchet is a batch cadence check; ordinary PRs receive the fast tier only."
            exit 0
          fi
          scripts/cmux-next/check-crash-safety.sh "$GITHUB_WORKSPACE/Packages/macOS/CmuxNext"

      # A test that posts to a process-global notification center reaches every
      # observer in the test process on the posting thread (#18771's signal 5).
      - name: Tests inject their notification center
        id: test-notification-centers
        continue-on-error: true
        run: scripts/cmux-next/check-test-notification-centers.sh "$GITHUB_WORKSPACE/Packages/macOS/CmuxNext"

      - name: String tables (21 languages)
        id: l10n
        continue-on-error: true
        env:
          L10N_STYLE_WARN_MAX: 100
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/ratchet-debt"
          scripts/cmux-next/check-l10n.sh "$GITHUB_WORKSPACE" | tee "$RUNNER_TEMP/ratchet-debt/l10n.log"

      - name: Module resource bundles
        id: module-resources
        continue-on-error: true
        run: scripts/cmux-next/check-module-resources.sh "$GITHUB_WORKSPACE/Packages/macOS/CmuxNext"

      # SCROLLBARS-THIN: no forced scroller style, hidden indicators or
      # custom web scrollbars outside the one shared style (SystemScrollers.swift,
      # webviews/src/scrollers.ts): thin, shown only while scrolling.
      - name: Scrollbars thin, one style
        id: scrollbars
        continue-on-error: true
        env:
          SCROLLBARS_WARN_MAX: 10
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/ratchet-debt"
          scripts/cmux-next/check-scrollbars.sh "$GITHUB_WORKSPACE" | tee "$RUNNER_TEMP/ratchet-debt/scrollbars.log"

      # Animation timing comes from the Motion tokens (plans/cmux-next/motion.md),
      # so ui.animationSpeed and Reduce Motion reach every animation.
      - name: Motion tokens
        id: motion
        continue-on-error: true
        run: scripts/cmux-next/check-motion.sh "$GITHUB_WORKSPACE/Packages/macOS/CmuxNext"

      # Glass, never solid (Leo 2026-10-21: "STOP DOING SOLID. WE HAVE GLASS, SO JUST USE GLASS."):
      # popovers, tooltips, hover cards, menus and sidebar cards paint no solid fill unless
      # check-overlay-glass.py lists why (ccde782cb51 turned them solid unnoticed).
      - name: Overlays are glass, never solid
        id: overlay-glass
        continue-on-error: true
        run: python3 -I scripts/cmux-next/check-overlay-glass.py "$GITHUB_WORKSPACE"

      # The one type scale (schemas/type-scale/type-scale.json): its CSS and Swift copies, and no new raw
      # font sizes or off-scale weights in the app's Swift (fails the checks; the webviews ratchet runs in react-apps-check).
      - name: Type scale
        id: type-scale
        continue-on-error: true
        run: |
          python3 -I scripts/cmux-next/gen-type-scale.py --check
          python3 -I scripts/cmux-next/check-swift-type-scale.py

      # The one motion duration scale (schemas/motion-scale/motion-scale.json): its Swift, CSS and
      # TypeScript copies (Leo 2026-10-20: one token file both sides read).
      - name: Motion scale
        id: motion-scale
        continue-on-error: true
        run: python3 -I scripts/cmux-next/gen-motion-scale.py --check

      # LAUNCH-NO-TCC-PROMPTS: the Swift and TypeScript copies of the one
      # protected-folder list (cmux-tui/crates/acpmux/data/protected-folders.json).
      - name: Protected-folder copies
        id: protected-folders
        continue-on-error: true
        run: python3 -I scripts/cmux-next/gen-protected-folders.py --check

      # The hand-edited settings sources in schemas/settings (retired keys so
      # far, cx-d5b5d) and their generated Swift copies; the daemon embeds the JSON.
      - name: Settings source copies
        id: settings-sources
        continue-on-error: true
        run: python3 -I scripts/cmux-next/gen-settings-sources.py --check

      # The phone daemon lane's per-command field allowlist, generated from the daemon's request
      # schema and the lane's command allowlist (DaemonLanePolicy+Fields.generated.swift).
      - name: Phone lane field allowlist
        id: phone-lane-fields
        continue-on-error: true
        run: python3 -I scripts/cmux-next/gen-phone-lane-fields.py --check

      # The backdrop art list (ids, titles, image and thumbnail URLs, Shuffle Daily) exported
      # from the CmuxNextDesign Swift to plans/cmux-next/backdrop-art.json for the GPUI app.
      - name: Backdrop art export
        id: backdrop-art
        continue-on-error: true
        run: python3 -I scripts/cmux-next/export-backdrop-art.py --check

      - name: Stale scheme PCM cleanup
        id: stale-pcm-cleanup
        continue-on-error: true
        run: bash tests/test_cmux_next_stale_pcm_cleanup.sh

      # Behavior tests of the build scripts: pin-cmux-tui.sh fetch on a stale
      # --ref mirror and on a reused runner workspace, embed-cef.sh reaching
      # ensure-cef.sh under set -u, and ensure-cef.sh's controller artifact
      # store source. The run-check test covers the same-tree wait failing
      # fast when the artifacts run for its commit was cancelled or superseded.
      - name: Script tests (pin-cmux-tui, embed-cef, ensure-cef store)
        id: script-tests
        continue-on-error: true
        run: |
          # Independent scripts, run a few at a time: one after another they took 203 s
          # (scripts/ci/run-checks-concurrently.sh). The two pin-cmux-tui waits run on a
          # virtual clock (tests/lib/fake-clock.sh), so a busy pool cannot fail them; they
          # are the longest, so they start first.
          scripts/ci/run-checks-concurrently.sh <<'CHECKS'
            bash scripts/cmux-next/tests/pin-cmux-tui-run-check.test.sh
            bash scripts/cmux-next/tests/pin-cmux-tui-probe.test.sh
            bash scripts/cmux-next/tests/fake-clock.test.sh
            bash scripts/cmux-next/tests/preview.test.sh
            python3 tests/test_intent_familiar_warning.py
            python3 tests/test_ci_launch_budget_gate.py
            python3 tests/test_strings_output_encoding.py
            bash tests/test_strip_release_bundle.sh
            # The pre-push gate refuses a push that adds a violation and names the commit in CI.
            python3 tests/test_cmux_next_prepush_gate.py
            # The perf gate skips its per-frame timings on a window that draws no frames (--frames auto).
            python3 tests/test_cmux_next_perf_gate_unlit.py
            # A base merge pushed while the PR's CI runs gets a warning (scripts/ci/base_merge_warning.py).
            python3 tests/test_base_merge_warning.py
            # A changed input, workflow file or toolchain never reuses a pass (CI_NEXT_JOB_REUSE).
            python3 tests/test_job_input_fingerprint.py
            # Only a pass from this repository's own runs is reused, never a fork's (scripts/ci/job_reuse.py).
            python3 tests/test_job_reuse.py
            # The DEV Release app's key changes with every path that can reach it (dev-release-product).
            python3 tests/test_dev_release_product_key.py
            # A reused DEV Release app is trusted and intact, or the job compiles; DEV lane only.
            python3 tests/test_dev_release_product_reuse.py
            # A hand merge of a Swift PR waits for its Release compile (scripts/ci/merge_compile_guard.py).
            python3 tests/test_merge_compile_guard.py
            # The advisory test-compile check: its plan, the lane phase and red only for a compile failure.
            python3 tests/test_ci_compile_test_plan.py
            # The merge guards run from the feat-cmux-next tip, never a pull request's checkout.
            python3 tests/test_guard_hooks_from_base.py
            # ci-guards.yml's `ci` group runs for feat-cmux-next too (cmux-next-guards.yml).
            python3 tests/test_feat_ci_guard_group.py
            python3 tests/test_guards_new_reds.py
            python3 tests/test_app_symbol_map.py
            bash scripts/cmux-next/tests/pin-cmux-tui.test.sh
            bash scripts/cmux-next/tests/bundle-acpmux-alias.test.sh
            bash scripts/cmux-next/tests/pin-cmux-tui-acpmux-only.test.sh
            bash scripts/cmux-next/tests/bundle-cmux-tui-screen-detection.test.sh
            bash scripts/cmux-next/tests/write-daemon-capabilities.test.sh
            bash scripts/cmux-next/tests/pin-cmux-tui-linux-fetch.test.sh
            bash scripts/cmux-next/tests/pin-cmux-tui-host-target.test.sh
            bash scripts/cmux-next/tests/pin-cmux-tui-windows-fetch.test.sh
            python3 tests/test_cmux_next_tree_notify.py
            python3 tests/test_idea_ledger.py
            # The INTERNAL iOS builder's trigger decisions and What to Test notes.
            python3 tests/test_ios_internal_builder.py
            python3 tests/test_ios_internal_notes.py
            bash scripts/cmux-next/tests/pin-cmux-tui-resolve-newest.test.sh
            bash scripts/cmux-next/tests/pin-cmux-tui-fallback-key.test.sh
            bash scripts/cmux-next/tests/pin-cmux-tui-dispatch.test.sh
            bash scripts/cmux-next/tests/cmux-tui-tree-claim.test.sh
            bash scripts/cmux-next/tests/request-nightly-next.test.sh
            bash scripts/cmux-next/tests/cef-runtime-pack.test.sh
            bash scripts/cmux-next/tests/continue-nightly-next.test.sh
            bash scripts/cmux-next/tests/wait-dev-daily-tree.test.sh
            bash scripts/cmux-next/tests/reset-stale-submodules.test.sh
            bash scripts/cmux-next/tests/tree-key-v2.test.sh
            bash scripts/cmux-next/tests/tree-key-embeds.test.sh
            bash scripts/cmux-next/tests/tree-publish-v2.test.sh
            bash scripts/cmux-next/tests/embed-cef.test.sh
            bash scripts/cmux-next/tests/ublock-pin.test.sh
            bash scripts/cmux-next/tests/base-autofix-push.test.sh
            bash scripts/cmux-next/tests/base-autofix-land.test.sh
            bash scripts/cmux-next/tests/base-autofix-action-exports.test.sh
            bash scripts/cmux-next/tests/base-autofix-changed.test.sh
            bash scripts/cmux-next/tests/base-autofix-settings-landed.test.sh
            bash scripts/cmux-next/tests/publish-bot-head-tree.test.sh
            bash scripts/cmux-next/tests/check-app-ffi-pin.test.sh
            bash scripts/cmux-next/tests/app-ffi-release-paths.test.sh
            bash scripts/cmux-next/tests/stamp-app-ffi-mtimes.test.sh
            bash scripts/cmux-next/tests/cargo-test-selected.test.sh
            bash scripts/cmux-next/tests/daemon-capabilities-fresh.test.sh
            bash scripts/cmux-next/tests/app-capability-references.test.sh
            bash scripts/cmux-next/tests/tagged-launch-acpmux-env.test.sh
            bash scripts/cmux-next/tests/crash-ratchet-tracked.test.sh
            bash scripts/cmux-next/tests/crash-ratchet-v2.test.sh
            bash scripts/cmux-next/tests/check-fleet-only.test.sh
            node --test scripts/lib/reload-shim.test.mjs
            # Version skew: the capability-text lint.
            bash scripts/cmux-next/tests/capability-text.test.sh
            bash scripts/cmux-next/tests/release-compile-derived-data.test.sh
            bash scripts/cmux-next/tests/scheme-compile-derived-data.test.sh
            bash scripts/cmux-next/tests/scheme-compile-browser-import.test.sh
            bash scripts/cmux-next/tests/dev-account-guard.test.sh
            bash scripts/cmux-next/tests/private-bun.test.sh
            bash scripts/cmux-next/tests/check-webviews-bun-version.test.sh
            bash scripts/cmux-next/tests/check-motion.test.sh
            bash scripts/cmux-next/tests/fast-tier.test.sh
            bash scripts/cmux-next/tests/check-scrollbars.test.sh
            bash scripts/cmux-next/tests/check-overlay-glass.test.sh
            bash scripts/cmux-next/tests/check-no-process-scan.test.sh
          bash scripts/cmux-next/tests/check-single-omnibar.test.sh
            bash scripts/cmux-next/tests/check-no-swiftui.test.sh
            bash scripts/cmux-next/tests/check-state-roots.test.sh
            bash scripts/cmux-next/tests/check-dialog-key-hints.test.sh
            bash scripts/cmux-next/tests/check-switch-fetches.test.sh
            bash scripts/cmux-next/tests/check-xcstrings-keys.test.sh
            bash scripts/cmux-next/tests/check-test-notification-centers.test.sh
            python3 scripts/cmux-next/tests/count-swift-code-lines.test.py
            bash scripts/cmux-next/tests/check-app-size.test.sh
            python3 -I scripts/cmux-next/tests/test_bundle_size.py
            bash tests/test_strip_release_bundle_atom_info.sh
            bash scripts/cmux-next/tests/version-surfaces.test.sh
            bash scripts/cmux-next/tests/ratchet-tiers.test.sh
            bash scripts/cmux-next/tests/base-autofix.test.sh
            bash scripts/cmux-next/tests/pr-autofix.test.sh
            bash tests/test_ci_generator_input_freshness.sh
            bash scripts/cmux-next/tests/generated-ownership.test.sh
            bash scripts/ci/tests/cmux-tui-rust-check.test.sh
            bash scripts/ci/tests/cmux-tui-base-red.test.sh
            bash scripts/ci/tests/package-test-lane-suite-args.test.sh
            bash scripts/ci/tests/package-test-lane-sdkroot.test.sh
            bash scripts/ci/tests/first-turn-cost-count-fallback.test.sh
            bash scripts/ci/tests/run-webviews-tests-retry.test.sh
            bash scripts/cmux-next/tests/cef-credits.test.sh
            bash scripts/cmux-next/tests/swift-test-summary.test.sh
            bash scripts/cmux-next/tests/cef-license.test.sh
            bash scripts/cmux-next/tests/ensure-cef-store.test.sh
            bash scripts/cmux-next/tests/cef-build-flags.test.sh
            bash scripts/cmux-next/tests/rust-daemon-miss-builds.test.sh
            bash scripts/cmux-next/tests/build-cmux-tui-client.test.sh
            bash scripts/cmux-next/tests/cef-manifest-r2.test.sh
            # The herdr-derived agent plugin's vendored manifests match their pin.
            python3 -I scripts/cmux-next/herdr-sync.py check
            python3 -I scripts/cmux-next/tests/test_herdr_sync.py
            # The restore journey names a DEV build's socket and acpmux home by the app's rule.
            python3 -I scripts/cmux-next/tests/test_build_names.py
            # The fleet sidebar benches emit receipts; this portable test keeps their validator deterministic.
            python3 -I scripts/cmux-next/tests/test_sidebar_perf_validate.py
            bash scripts/cef/tests/test-embedder-step.test.sh
          CHECKS

      # The app's Ghostty shell integration comes from ghostty-next (the
      # Ghostty of GhosttyNextKit and libghostty-vt): the bundle phase output
      # must equal its source tree.
      - name: Ghostty resources bundle
        id: ghostty-resources-bundle
        continue-on-error: true
        run: |
          git submodule update --init --depth 1 --filter=blob:none ghostty-next
          bash scripts/cmux-next/tests/bundle-ghostty-resources.test.sh
          # Ghostty's themes survive the Resources phase in either order (Xcode, fleet Linux builder).
          bash scripts/cmux-next/tests/bundle-resources-layout.test.sh

      # The bundled terminfo (Ghostty's entries with cmux's overlay on top)
      # carries ghostty-next's capabilities and cmux's 256-color 8-15 patch.
      # Its own step, so the summary names it when it is red.
      - name: Bundled terminfo
        id: bundled-terminfo
        continue-on-error: true
        run: bash scripts/cmux-next/tests/bundled-terminfo.test.sh

      # The repo-wide package conventions (namespace types, free functions,
      # singletons, ...). test-ios.yml runs it only for pull requests, merge
      # groups and dispatches; this step covers direct feat-cmux-next pushes.
      - name: Package conventions lint
        id: package-conventions
        continue-on-error: true
        run: ./scripts/lint-ios-package-conventions.sh

      # The browser chrome draws Chromium's own icons (design/icons/chromium): the
      # generated batch is current and no browser control uses an SF Symbol or a
      # non-Chromium pack icon.
      - name: Browser chrome icons
        id: browser-chrome-icons
        continue-on-error: true
        run: |
          python3 scripts/icons/chromium_icons.py --check
          python3 scripts/icons/build_pack.py --check
          python3 scripts/cmux-next/lint-browser-chrome-icons.py

      # What App Store Connect rejects only after an upload (ITMS-90626 device
      # names in App Intents text, 90683 purpose strings, ...), on the
      # cmux-next-ios sources. The INTERNAL builder runs it again on the built app.
      - name: App Store review rules (cmux-next-ios intents, Info.plist)
        id: app-store-rules
        continue-on-error: true
        run: |
          python3 tests/test_app_store_rules.py
          python3 tests/test_cmux_next_ios_test_notes_retry.py
          python3 -I scripts/cmux-next/check-app-store-rules.py --source .

      # The perf gate's source guard without an app (I5: a theme change captures no window and
      # forces no commit): a source scan of seconds, so it stays here while the perf gate itself runs
      # only in the perf cron (cmux-next-perf-budgets.yml); two hits once landed by direct push
      # (36c5b4217488, 715f623c97e1).
      - name: Perf source guard (no window capture or CATransaction.flush)
        id: perf-source-guard
        continue-on-error: true
        run: |
          python3 tests/test_cmux_next_perf_source_guard.py
          python3 -I scripts/cmux-next/check-perf-source-guard.py

      # Gallery fixtures are public sample data the gallery and PR captures render: they name
      # machines "studio-mac" or "build-box", never a fleet host (the capture privacy check
      # refuses a still that shows one, and WorkspaceHoverCardGallery's "air-blue" did).
      - name: No fleet host names in gallery fixtures
        id: fixture-host-names
        continue-on-error: true
        run: |
          python3 tests/test_cmux_next_fixture_host_names.py
          python3 -I scripts/cmux-next/check-fixture-host-names.py

      - name: Checks job structure
        id: checks-structure
        continue-on-error: true
        run: |
          python3 tests/test_cmux_next_checks_workflow.py
          python3 tests/test_cmux_next_generated_fold.py
          python3 tests/test_cmux_next_pr_autofix_push_gate.py
          python3 tests/test_run_checks_concurrently.py
          python3 tests/test_cmux_next_release_build_retention.py
          python3 tests/test_cmux_next_dev_release_host_root.py
          python3 tests/test_cmux_next_dev_release_import_out.py
          python3 tests/test_cmux_next_dev_daily_tree_wait.py

      # The tier routing on the committed target graph: a UI change selects its
      # own test targets, a daemon change the live-daemon suites, an unknown
      # path every tier.
      - name: Tier routing
        id: tier-routing
        continue-on-error: true
        run: |
          python3 tests/test_cmux_next_route.py
          python3 tests/test_ci_target_graph.py
          python3 tests/test_ci_swiftpm_build_metrics.py
          python3 tests/test_cmux_next_route_replay.py

      # The CmuxNextAppTests dependencies are one sorted entry per line, so two
      # pull requests adding different modules merge cleanly; the long lines they
      # all appended to conflicted on nearly every open pull request.
      - name: Package dependency lists sorted
        id: package-dependency-lists
        continue-on-error: true
        run: |
          python3 scripts/cmux-next/check-package-dependency-lists.py
          python3 scripts/cmux-next/tests/test_check_package_dependency_lists.py

      # The web bundle source key covers every file outside webviews/ that a bundle
      # imports, and the publish and routing path lists name each one (cx-wtsf3).
      - name: Web bundle key inputs
        id: web-bundle-key-inputs
        continue-on-error: true
        run: bash tests/test_web_bundle_key_inputs.sh

      # build-web-bundles.sh --from installs and stamps bundles built elsewhere. It and the key
      # inputs test ran last in the web-bundles job until 2026-10-20: a red there failed the job
      # that swift test, daemon tests and generated files wait on, so those tiers were skipped
      # (and a skipped tier reads as passing) on every pull request while it stayed red.
      - name: Prebuilt web bundles install and stamp
        id: web-bundles-from
        continue-on-error: true
        run: bash tests/test_build_web_bundles_from.sh

      # The signed web update pointer (plans/cmux-next/web-ota.md): verifies only under a listed
      # key, refuses a changed payload, and never moves back.
      - name: Web update pointer
        id: web-ota-pointer
        continue-on-error: true
        run: bash tests/test_web_ota_pointer.sh

      # The companion workflows' structure: generated-files catch-up and the
      # next-batch landing queue.
      - name: Companion workflows
        id: companion-workflows
        continue-on-error: true
        run: |
          python3 tests/test_cmux_next_generated_catch_up.py
          python3 tests/test_next_batch.py
          python3 tests/test_next_batch_groups.py
          python3 tests/test_cmux_next_base_autofix_finishes.py
          python3 tests/test_cmux_next_pr_autofix_settings.py
          python3 tests/test_cmux_next_pr_changed_paths.py
          python3 tests/test_pr_capture_check_paths.py
          python3 tests/test_car_guards.py

      # The cmux NEXT DEV update script (an unchanged build is left alone; an
      # update keeps sessions and reopens the app) and the classic session import.
      - name: DEV update and classic import scripts
        id: dev-update-classic-import
        continue-on-error: true
        run: |
          python3 tests/test_cmux_next_update_dev_daily.py
          python3 tests/test_cmux_next_classic_to_next.py

      # A pull request that changes the router replays the last 30 merged PRs' changed files
      # through the base router (the merge commit's HEAD^1) and its own: a tier the new router
      # adds, or drops without naming a fast tier, fails (scripts/ci/cmux_next_route_replay.py).
      - name: Routing replay (router changes)
        id: routing-replay
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" != pull_request ]]; then
            echo "Pushes run every tier; the replay checks pull request routing only."
            exit 0
          fi
          if git diff --quiet HEAD^1 HEAD -- scripts/ci/cmux_next_route.py scripts/ci/select_package_tests.py; then
            echo "The router did not change."
            exit 0
          fi
          python3 scripts/ci/cmux_next_route_replay.py --base HEAD^1 --limit 30 | tee -a "$GITHUB_STEP_SUMMARY"

      # Package.swift links the app FFI from one pinned release; the pin must
      # match the FFI sources (every crate cmux-app-ffi reaches through Cargo
      # path dependencies) and the release must be built from them. Here on
      # Linux it runs on every push and pull request: in swift test a newer
      # push replaced the waiting job, so tip runs rarely reached it.
      - name: Check the app FFI pin
        id: app-ffi-pin
        continue-on-error: true
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          base=()
          [[ "$EVENT_NAME" == pull_request ]] && base=(--base HEAD^1)
          scripts/cmux-next/check-app-ffi-pin.sh --verify-release "${base[@]}"

      # plans/cmux-next/daemon-capabilities.json against the lists in
      # DaemonEndpoint.swift, without a build: check-daemon-capabilities.sh
      # reads the JSON only inside an app build, so a Swift-only change to the
      # lists (67b13e24e84d) broke every tagged build first.
      - name: Daemon capabilities export is fresh
        id: daemon-capabilities-fresh
        continue-on-error: true
        run: python3 scripts/cmux-next/check-daemon-capabilities-fresh.py

      # Every capability the app references and the daemon source defines is
      # in DaemonCapability.required/.optional, without a build: the app build
      # runs this check first, so #21322 (four unlisted capabilities) broke
      # every tagged build before any PR check saw it.
      - name: App capability references are listed
        id: app-capability-references
        continue-on-error: true
        run: python3 -I scripts/cmux-next/check-app-capability-references.py --repo .

      # A capability error is a version skew: it names the matching CLI or one
      # exact command, never "update the app" (plans/cmux-next/version-skew.md).
      - name: Capability texts never say update the app
        id: capability-text
        continue-on-error: true
        run: bash scripts/cmux-next/tests/capability-text.test.sh
      # The pre-push gate again (scripts/cmux-next/prepush-gate.py, same pinned tools): on a push,
      # each pushed commit against its parent, so a commit pushed with --no-verify that adds a
      # violation is named; on a pull request, what the PR adds over its base (HEAD^1).
      - name: Pushed commits add no violations
        id: pushed-commits
        continue-on-error: true
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          # Sidebar look owner sweep (plans/cmux-next/sidebar-owner.md): every commit since the check landed,
          # not only this push's, so a commit from an old hook copy or a cancelled run is still named.
          sidebar_from=a1af264c7a7235c5863ade4f3448e2669265d6d0
          sweep=0
          git fetch --no-tags --quiet --deepen=2000 origin "$GITHUB_SHA" || true
          if git merge-base --is-ancestor "$sidebar_from" HEAD 2>/dev/null; then
            python3 -I scripts/cmux-next/prepush-gate.py --only sidebar --commits "$sidebar_from..HEAD" \
              | tee -a "$GITHUB_STEP_SUMMARY" || sweep=$?
          fi
          if [[ "$EVENT_NAME" != push ]]; then
            python3 -I scripts/cmux-next/prepush-gate.py --base HEAD^1 --head HEAD
            exit "$sweep"
          fi
          range="HEAD^1..HEAD"
          if [[ -n "$BEFORE" && "$BEFORE" != 0000000000000000000000000000000000000000 ]]; then
            git fetch --no-tags --quiet --depth=200 origin "$GITHUB_SHA" "$BEFORE" || true
            if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then range="$BEFORE..HEAD"; fi
          fi
          python3 -I scripts/cmux-next/prepush-gate.py --commits "$range" | tee -a "$GITHUB_STEP_SUMMARY"
          exit "$sweep"

      # `outcome`, not `conclusion`: continue-on-error makes every conclusion success.
      # STYLE_CHECKS are the structural, style, size and drift guards: while
      # CMUX_NEXT_STYLE_GUARDS is `warn` (workflow env) a red one is a warning
      # annotation and does not fail the job. A style check that never ran
      # (an empty outcome) still fails: that is a broken workflow, not a finding.
      - name: Fail on any red check
        if: always()
        env:
          STYLE_CHECKS: |
            God files and types (Swift)
            God files (cmux-tui Rust)
            CmuxNextApp size cap
            No Swift CLI (the cmux CLI is Rust, plans/cmux-next/cli.md)
            No Swift closed history (the daemon owns it, plans/cmux-next/reopen-closed.md 9)
            No process scanning (holders register themselves, plans/cmux-next/pty-holder.md 4)
            Scrollbars thin, one style
            Motion tokens
            Overlays are glass, never solid
            Type scale
            Protected-folder copies
            Settings source copies
            Backdrop art export
            Package conventions lint
            Browser chrome icons
            Dialog buttons show their keys (u2647)
            One omnibar (popups, New Tab and tabs share AddressBarView)
            Pushed commits add no violations
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_API_URL: ${{ github.api_url }}
          OUTCOMES: |
            ${{ steps.godfiles-swift.outcome }}|God files and types (Swift)
            ${{ steps.godfiles-rust.outcome }}|God files (cmux-tui Rust)
            ${{ steps.app-size.outcome }}|CmuxNextApp size cap
            ${{ steps.no-swift-cli.outcome }}|No Swift CLI (the cmux CLI is Rust, plans/cmux-next/cli.md)
            ${{ steps.no-swift-closed-history.outcome }}|No Swift closed history (the daemon owns it, plans/cmux-next/reopen-closed.md 9)
            ${{ steps.single-omnibar.outcome }}|One omnibar (popups, New Tab and tabs share AddressBarView)
            ${{ steps.no-swiftui.outcome }}|No new SwiftUI (macOS UI is AppKit)
            ${{ steps.no-process-scan.outcome }}|No process scanning (holders register themselves, plans/cmux-next/pty-holder.md 4)
            ${{ steps.state-roots.outcome }}|No literal state roots (per-build isolation S7, cx-is1kf.8)
            ${{ steps.dialog-key-hints.outcome }}|Dialog buttons show their keys (u2647)
            ${{ steps.concurrency.outcome }}|Main-thread concurrency
            ${{ steps.webview-factory.outcome }}|One web view factory
            ${{ steps.crash-safety.outcome }}|Crash safety
            ${{ steps.test-notification-centers.outcome }}|Tests inject their notification center
            ${{ steps.l10n.outcome }}|String tables (21 languages)
            ${{ steps.module-resources.outcome }}|Module resource bundles
            ${{ steps.scrollbars.outcome }}|Scrollbars thin, one style
            ${{ steps.motion.outcome }}|Motion tokens
            ${{ steps.overlay-glass.outcome }}|Overlays are glass, never solid
            ${{ steps.type-scale.outcome }}|Type scale
            ${{ steps.motion-scale.outcome }}|Motion scale
            ${{ steps.protected-folders.outcome }}|Protected-folder copies
            ${{ steps.settings-sources.outcome }}|Settings source copies
            ${{ steps.phone-lane-fields.outcome }}|Phone lane field allowlist
            ${{ steps.backdrop-art.outcome }}|Backdrop art export
            ${{ steps.stale-pcm-cleanup.outcome }}|Stale scheme PCM cleanup
            ${{ steps.script-tests.outcome }}|Script tests (pin-cmux-tui, embed-cef, ensure-cef store)
            ${{ steps.ghostty-resources-bundle.outcome }}|Ghostty resources bundle
            ${{ steps.bundled-terminfo.outcome }}|Bundled terminfo
            ${{ steps.package-conventions.outcome }}|Package conventions lint
            ${{ steps.browser-chrome-icons.outcome }}|Browser chrome icons
            ${{ steps.capability-text.outcome }}|Capability texts never say update the app
            ${{ steps.app-store-rules.outcome }}|App Store review rules (cmux-next-ios intents, Info.plist)
            ${{ steps.perf-source-guard.outcome }}|Perf source guard (no window capture or CATransaction.flush)
            ${{ steps.fixture-host-names.outcome }}|No fleet host names in gallery fixtures
            ${{ steps.checks-structure.outcome }}|Checks job structure
            ${{ steps.tier-routing.outcome }}|Tier routing
            ${{ steps.package-dependency-lists.outcome }}|Package dependency lists sorted
            ${{ steps.web-bundle-key-inputs.outcome }}|Web bundle key inputs
            ${{ steps.web-bundles-from.outcome }}|Prebuilt web bundles install and stamp
            ${{ steps.web-ota-pointer.outcome }}|Web update pointer
            ${{ steps.companion-workflows.outcome }}|Companion workflows
            ${{ steps.dev-update-classic-import.outcome }}|DEV update and classic import scripts
            ${{ steps.routing-replay.outcome }}|Routing replay (router changes)
            ${{ steps.app-ffi-pin.outcome }}|Check the app FFI pin
            ${{ steps.daemon-capabilities-fresh.outcome }}|Daemon capabilities export is fresh
            ${{ steps.app-capability-references.outcome }}|App capability references are listed
            ${{ steps.pushed-commits.outcome }}|Pushed commits add no violations
        run: |
          failed=()
          warned=()
          # `outcome|name`: an empty outcome (a check that never ran) still names its step.
          while IFS='|' read -r outcome name; do
            [[ -n "$outcome$name" ]] || continue
            [[ "$outcome" == success ]] && continue
            if [[ "$outcome" == failure && "${CMUX_NEXT_STYLE_GUARDS:-}" == warn ]] \
              && grep -qxF -- "$name" <<<"${STYLE_CHECKS:-}"; then
              warned+=("$name")
              continue
            fi
            failed+=("$name (${outcome:-not run})")
          done <<<"$OUTCOMES"
          # A push compares the checks-job reds with the immediately previous tip.
          # A failure already present there is inherited base red: warn and keep the
          # job green. A missing/failed comparison leaves every red blocking.
          if [[ "$EVENT_NAME" == push && "$BEFORE" =~ ^[0-9a-f]{40}$ && ! "$BEFORE" =~ ^0+$ && ${#failed[@]} -gt 0 ]]; then
            current="$RUNNER_TEMP/cmux-next-red-checks.txt"
            printf '%s\n' "${failed[@]}" | sed -E 's/ \((failure|timed_out|cancelled|not run)\)$//' >"$current"
            base_out="$RUNNER_TEMP/cmux-next-base-red.out"
            if python3 scripts/ci/base_red_checks.py --repo "$GITHUB_REPOSITORY" --before "$BEFORE" --current "$current" >"$base_out"; then
              inherited=()
              new_failed=()
              while read -r kind name; do
                [[ -n "$kind$name" ]] || continue
                if [[ "$kind" == BASE_RED ]]; then
                  inherited+=("$name (base red on $BEFORE; warning-only)")
                else
                  new_failed+=("$name (failure)")
                fi
              done <"$base_out"
              warned+=("${inherited[@]+${inherited[@]}}")
              failed=("${new_failed[@]+${new_failed[@]}}")
            else
              echo "::warning title=cmux-next base-red::could not read the previous tip; current reds remain blocking"
            fi
          fi
          for name in "${warned[@]+"${warned[@]}"}"; do
            echo "::warning title=cmux-next style guard (warn-only)::$name found issues; see that step's log"
          done
          if (( ${#warned[@]} > 0 )); then
            {
              echo "### ${#warned[@]} style guard(s) reported findings (warn-only)"
              echo
              printf -- '- %s\n' "${warned[@]}"
              echo
            } | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          if (( ${#failed[@]} == 0 )); then
            echo "All blocking cmux-next checks passed." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # One annotation per red check: the red-checks line compares them with the base's run, so a
          # new red check is told from a base one (scripts/ci/pr_red_checks_comment.py).
          for name in "${failed[@]}"; do echo "::error title=cmux-next check::red check: ${name% (*}"; done
          {
            echo "### ${#failed[@]} cmux-next check(s) failed"
            echo
            printf -- '- %s\n' "${failed[@]}"
            echo
            echo "Each check's own step log has the details."
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit 1

  # Reports a same-tree cmux-tui that nothing will publish, in red, at once.
  # It waits for nothing: path routing probed the tree (tree_state=failed), or
  # an artifacts run that ended without publishing it dispatched same-tree mode
  # with same_tree_state=failed. A later publication of the key still starts
  # the tree jobs (the marker stays) and posts their statuses.
  # Builds the cmux-next web bundles once per source key (web-bundle-key.py --source: every
  # input file and the pinned bun) on Linux and caches them under that key. The Mac jobs
  # restore them by the same key instead of running bun and Vite+ themselves; a push to
  # feat-cmux-next fills the cache every pull request can read. A pull request builds them
  # only for a routed tier that restores them (swift test, daemon tests, generated files).
  web-bundles:
    needs: path_route
    if: ${{ inputs.dev_daily != true && inputs.same_tree_sha == '' && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository || contains(github.event.pull_request.labels.*.name, 'full-ci')) && (needs.path_route.outputs.swift == 'true' || needs.path_route.outputs.daemon == 'true' || needs.path_route.outputs.generated == 'true')) }}
    name: cmux-next web bundles (source-keyed cache)
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-32vcpu-ubuntu-2404' || !startsWith(vars.LINUX_RUNNER, 'blacksmith-') && vars.LINUX_RUNNER || 'blacksmith-32vcpu-ubuntu-2404' }}
    timeout-minutes: 15
    # Only a feat-cmux-next run enters next-cache-writer (deployment branch
    # feat-cmux-next only), and only its push publishes the bundles to NEXT's
    # R2 bucket; a pull request holds no credential and saves only to its
    # GitHub cache.
    environment: ${{ github.ref == 'refs/heads/feat-cmux-next' && 'next-cache-writer' || '' }}
    env:
      CI_CACHE_R2_BUCKET: cmux-ci-cache-next
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # runs-on can resolve to vars.LINUX_RUNNER, which may name a self-hosted
      # host that reuses its workspace; drop the submodule checkouts a previous
      # job left there (a no-op on Blacksmith, which starts with none).
      - name: Drop stale submodule checkouts (self-hosted reused workspace)
        run: scripts/ci/reset-stale-submodules.sh

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"

      # The minis share ~/.bun with workflows that install another bun; this
      # job runs on its own copy of the pinned one (private-bun.sh).
      - name: Give this job its own bun
        run: scripts/cmux-next/private-bun.sh

      # The webviews app's `vp build` must run on node (build-web-bundles.sh).
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.22.1"

      - name: Source key of the web bundles
        id: web-bundle-key
        run: echo "key=$(python3 scripts/cmux-next/web-bundle-key.py . --source)" >> "$GITHUB_OUTPUT"

      - name: Look up the cached web bundles
        id: web-bundle-cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: web-bundles-out
          key: cmux-next-web-bundles-v1-${{ steps.web-bundle-key.outputs.key }}
          enableCrossOsArchive: true

      - name: Build the web bundles for this source key
        if: steps.web-bundle-cache.outputs.cache-hit != 'true'
        run: scripts/cmux-next/build-web-bundles.sh --out-root "$GITHUB_WORKSPACE/web-bundles-out"

      - name: Cache the web bundles under this source key
        if: steps.web-bundle-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: web-bundles-out
          key: cmux-next-web-bundles-v1-${{ steps.web-bundle-key.outputs.key }}
          enableCrossOsArchive: true

      # The Mac jobs read the bundles from R2's CDN first: the minis download
      # them from there much faster than from the GitHub cache, and every
      # pull request whose web sources match feat-cmux-next's hits. The `any`
      # namespace is shared by every OS (the bundles are platform-independent).
      # A key that is already stored is not uploaded again.
      - name: Publish the web bundles to R2 (feat-cmux-next push)
        if: ${{ github.repository == 'manaflow-ai/cmux' && github.event_name == 'push' && github.ref == 'refs/heads/feat-cmux-next' }}
        continue-on-error: true
        uses: ./.github/actions/cache-save
        env:
          CI_CACHE_R2_PUBLIC_URL: https://ci-cache-next.cmux.com
          CI_CACHE_R2_NAMESPACE: any
          AWS_ACCESS_KEY_ID: ${{ secrets.CI_CACHE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CI_CACHE_R2_SECRET_ACCESS_KEY }}
          CI_CACHE_R2_ENDPOINT: ${{ format('https://{0}.r2.cloudflarestorage.com', secrets.CI_CACHE_R2_ACCOUNT_ID) }}
        with:
          backend: r2
          path: web-bundles-out
          key: cmux-next-web-bundles-v1-${{ steps.web-bundle-key.outputs.key }}


  same-tree-cmux-tui:
    needs: [path_route, push-head-preflight]
    # A superseded push reports nothing: its newer head is tested.
    if: ${{ !cancelled() && ((needs.path_route.outputs.tree_state == 'failed' && needs.push-head-preflight.outputs.current == 'true') || (inputs.same_tree_sha != '' && inputs.same_tree_state == 'failed')) }}
    name: same-tree cmux-tui
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || 'blacksmith-2vcpu-ubuntu-2404' }}
    permissions:
      statuses: write
    timeout-minutes: 3
    steps:
      - name: Report the unavailable same-tree cmux-tui
        env:
          REASON: ${{ inputs.same_tree_reason || needs.path_route.outputs.tree_reason }}
          KEY: ${{ needs.path_route.outputs.tree_key }}
          STATUS_SHA: ${{ inputs.same_tree_status_sha }}
          TIERS: ${{ inputs.same_tree_tiers }}
          DEV_DAILY: ${{ inputs.dev_daily == true && 'true' || 'false' }}
          GH_TOKEN: ${{ github.token }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          echo "::error title=same-tree cmux-tui unavailable::${KEY:+tree $KEY: }${REASON:-no reason given}"
          if [[ "$STATUS_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            for tier in ${TIERS//,/ }; do
              case "$tier" in
                daemon) context="cmux-next daemon tests (same-tree)" ;;
                scheme)
                  if [[ "$DEV_DAILY" == true ]]; then
                    context="cmux NEXT DEV Release compile (same-tree)"
                  else
                    context="cmux app scheme compile (Debug) (same-tree)"
                  fi ;;
                *) continue ;;
              esac
              scripts_status="$(python3 -c 'import json,sys; print(json.dumps({"state": "failure", "context": sys.argv[1], "target_url": sys.argv[2], "description": "same-tree cmux-tui unavailable"}))' "$context" "$TARGET_URL")"
              curl -fsS -o /dev/null -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
                "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$STATUS_SHA" -d "$scripts_status" \
                || echo "::warning::could not post the $context status"
            done
          fi
          exit 1

  # The build fleet's compile verdict for the Swift canary. Opt-in: with the
  # CI_COMPILE_CHECK_GATEWAY variable set (a tailnet gateway runner label), a
  # same-repository run hands `cmux-ci compile-check --app` the commit; the
  # fleet compiles and links the app executable, which covers every
  # production target the app links (the canary's targets are production
  # targets only), and answers. The two production targets the app does not
  # link go straight to the Mac canary. A pass lets the
  # canary below report it from a small Linux runner instead of taking a Mac.
  # A red, an unavailable fleet or a timeout runs the Mac canary as before,
  # which prints the errors: this job never fails a run itself.
  swift-canary-fleet:
    needs: [path_route, push-head-preflight, macos-placement]
    # With macos-placement's gateway judgement in this attempt (gateway_attempt) it runs only on an
    # idle gateway runner (gateway_runner); with none idle the Mac canary takes the cascade instead.
    if: ${{ !cancelled() && github.repository_owner == 'manaflow-ai' && vars.CI_COMPILE_CHECK_GATEWAY != '' && needs.path_route.outputs.swift_canary == 'true' && needs.push-head-preflight.outputs.current == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && needs.macos-placement.outputs.gateway_attempt == format('{0}', github.run_attempt) && needs.macos-placement.outputs.gateway_runner != '' }}
    name: cmux-next Swift canary (build fleet)
    concurrency:
      group: ${{ github.event_name == 'pull_request' && format('cmux-next-pr-{0}-swift-canary-fleet', github.event.pull_request.number) || github.event_name == 'push' && format('cmux-next-push-{0}-swift-canary-fleet', github.ref) || format('cmux-next-run-{0}-swift-canary-fleet', github.run_id) }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: ${{ needs.macos-placement.outputs.gateway_runner }}
    permissions: {}
    timeout-minutes: 30
    outputs:
      verdict: ${{ steps.check.outputs.verdict }}
    steps:
      # The gateway checks nothing out: the fleet fetches the commit the Mac
      # canary would build (github.sha: a pull request's merge commit, so a
      # head that breaks against the current base is still caught). A commit
      # the fleet cannot fetch is "no verdict", and the Mac canary runs.
      - name: Compile-check CmuxNext on the build fleet
        id: check
        env:
          REF: ${{ github.sha }}
          SWIFT_CANARY_TARGETS: ${{ needs.path_route.outputs.swift_canary_targets }}
        run: |
          set -uo pipefail
          # Production targets of Packages/macOS/CmuxNext that the app
          # executable does not link (ci-target-graph.json: not reachable from
          # CmuxNextApp). The app check cannot vouch for them.
          for target in $SWIFT_CANARY_TARGETS; do
            case "$target" in
              CmuxNextAppPermissions|CmuxNextServerHelperDaemon|CmuxNextUiLayerPreview)
                echo "::notice title=Build fleet compile check::$target is not linked into the app; the Mac canary runs."
                echo "verdict=unavailable" >> "$GITHUB_OUTPUT"
                exit 0 ;;
            esac
          done
          # A gateway without the client has no verdict (cmux17, run 39573725240).
          client="${CMUX_CI_CLIENT:-$HOME/.local/bin/cmux-ci}"
          if ! [[ -x "$client" ]]; then
            echo "::notice title=Build fleet compile check::$client is not installed on runner $RUNNER_NAME; the Mac canary runs."
            echo "verdict=unavailable" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          status=0
          "$client" compile-check --ref "$REF" --app \
            --timeout 1200 --queue-timeout 300 2>"$RUNNER_TEMP/compile-check.stderr" || status=$?
          case "$status" in
            0) verdict=pass ;;
            1) verdict=fail; echo "::notice title=Build fleet compile check::CmuxNext did not compile on the build fleet; the Mac canary runs and shows the errors." ;;
            *) verdict=unavailable; echo "::notice title=Build fleet compile check::No build-fleet verdict (exit $status); the Mac canary runs." ;;
          esac
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"

  # A same-repository pull request's app compile, on the build fleet instead
  # of the Mac Release queue (2026-10-21: 76 of ~350 queued Mac jobs were
  # Release compiles). It compiles and links the app at the PR's head, the
  # commit merge_compile_guard.py and the landing hooks ask about, in about a
  # minute. A fleet compile error fails this job: the PR's own red. No verdict
  # (no client, the fleet down, a timeout) is a notice, and release-compile
  # runs on a Mac instead. A full-ci PR, a fork, and every push and dispatch
  # keep the Mac Release compile; the base push compiles Release after the
  # merge, and push-attribution names the PR on a red.
  app-compile-fleet:
    needs: [path_route, push-head-preflight, macos-placement]
    # It takes the gateway, or a wider class of it, only while macos-placement saw a runner idle
    # (gateway_runner). With none idle it does not run: release-compile then runs, and
    # macos-placement already put it in the cascade (GATEWAY_CASCADE), so it takes a free Blacksmith
    # slot rather than the queue PR #24155's compile sat in three times on 2026-10-26.
    if: ${{ !cancelled() && github.event_name == 'pull_request' && github.repository_owner == 'manaflow-ai' && vars.CI_COMPILE_CHECK_GATEWAY != '' && needs.path_route.outputs.native == 'true' && needs.push-head-preflight.outputs.current == 'true' && github.event.pull_request.head.repo.full_name == github.repository && !contains(github.event.pull_request.labels.*.name, 'full-ci') && needs.macos-placement.outputs.gateway_attempt == format('{0}', github.run_attempt) && needs.macos-placement.outputs.gateway_runner != '' }}
    name: cmux-next app compile (build fleet)
    concurrency:
      group: cmux-next-pr-${{ github.event.pull_request.number }}-app-compile-fleet
      cancel-in-progress: true
    runs-on: ${{ needs.macos-placement.outputs.gateway_runner }}
    permissions: {}
    timeout-minutes: 30
    outputs:
      verdict: ${{ steps.check.outputs.verdict }}
    steps:
      # The gateway checks nothing out: the fleet fetches the commit itself.
      - name: Compile-check the app at the pull request's head on the build fleet
        id: check
        env:
          REF: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail
          client="${CMUX_CI_CLIENT:-$HOME/.local/bin/cmux-ci}"
          if ! [[ -x "$client" ]]; then
            echo "::notice title=Build fleet compile::$client is not installed on runner $RUNNER_NAME; the Mac Release compile runs."
            echo "verdict=unavailable" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          status=0
          "$client" compile-check --ref "$REF" --app --timeout 1200 --queue-timeout 300 || status=$?
          case "$status" in
            0) verdict=pass; summary="The build fleet compiled and linked the cmux-next app at \`$REF\` (Debug, swift.org toolchain). The Release compile runs on the base push after the merge." ;;
            1) verdict=fail; summary="The cmux-next app did not compile on the build fleet at \`$REF\`; the errors are in this job's log above." ;;
            *) verdict=unavailable; summary="No build-fleet verdict (exit $status); the Mac Release compile runs instead." ;;
          esac
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
          echo "### Build fleet app compile: $verdict"$'\n\n'"$summary" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$verdict" == fail ]]; then
            echo "::error title=Build fleet compile::$summary"
            exit 1
          fi
          [[ "$verdict" == pass ]] || echo "::notice title=Build fleet compile::$summary"

  # Small package-only Swift edits get a mini-first type-check/build canary.
  # This uses the same placement and linked SwiftPM scratch as the other Mac
  # jobs, so a warm mini can answer in roughly 1-2 minutes. It deliberately
  # excludes the app host, package manifest, resources and toolchain inputs.
  # When swift-canary-fleet passed, the job keeps its name and conclusion but
  # runs on a 2 vCPU Linux runner and only reports that verdict.
  swift-canary:
    needs: [path_route, macos-placement, push-head-preflight, swift-canary-fleet]
    # Same-repository PRs and dispatches run it; a fork PR only with full-ci.
    # Base pushes remain the Release backstop.
    if: ${{ !cancelled() && needs.path_route.outputs.swift_canary == 'true' && needs.push-head-preflight.outputs.current == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository || contains(github.event.pull_request.labels.*.name, 'full-ci')) }}
    name: cmux-next Swift canary
    concurrency:
      group: ${{ github.event_name == 'pull_request' && format('cmux-next-pr-{0}-swift-canary', github.event.pull_request.number) || github.event_name == 'push' && format('cmux-next-push-{0}-swift-canary', github.ref) || format('cmux-next-run-{0}-swift-canary', github.run_id) }}
      # A newer PR push or manual rerun supersedes an older canary. This keeps
      # the queue focused on the current head instead of replaying stale
      # typechecks.
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || needs.swift-canary-fleet.outputs.verdict == 'pass' && 'blacksmith-2vcpu-ubuntu-2404' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-6vcpu-macos-26' || (github.run_attempt == 1 || github.run_attempt == 2 && github.triggering_actor == 'github-actions[bot]') && contains(needs.macos-placement.outputs.blacksmith_12_jobs, ' swift-canary ') && 'blacksmith-12vcpu-macos-26' || (github.run_attempt == 1 || github.run_attempt == 2 && github.triggering_actor == 'github-actions[bot]') && contains(needs.macos-placement.outputs.blacksmith_6_jobs, ' swift-canary ') && 'blacksmith-6vcpu-macos-26' || (github.run_attempt == 1 || github.run_attempt == 2 && github.triggering_actor == 'github-actions[bot]') && contains(needs.macos-placement.outputs.hosted_jobs, ' swift-canary ') && needs.macos-placement.outputs.hosted_runner || (github.run_attempt == 1 || github.triggering_actor != 'github-actions[bot]') && needs.macos-placement.outputs.runner || github.repository_owner != 'manaflow-ai' && 'macos-26' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-6vcpu-macos-26' || vars.CI_PR_POOL_OWNED == '1' && contains(fromJSON('["pull_request","push","workflow_dispatch"]'), github.event_name) && (github.run_attempt == 1 || github.triggering_actor != 'github-actions[bot]') && vars.CI_SIDE_LANE_RUNNER || needs.macos-placement.outputs.retry_runner || vars.CI_PR_POOL_OWNED == '1' && contains(fromJSON('["pull_request","push","workflow_dispatch"]'), github.event_name) && (github.run_attempt <= 3 || github.triggering_actor != 'github-actions[bot]') && vars.CI_SIDE_LANE_RUNNER || vars.MACOS_RUNNER_26 || 'blacksmith-6vcpu-macos-26') }}
    permissions:
      contents: read
    # A cold build on hosted macos-26 (about 3 vCPU, no R2 seed for its workspace path) gets more time.
    timeout-minutes: ${{ needs.swift-canary-fleet.outputs.verdict == 'pass' && 5 || contains(needs.macos-placement.outputs.hosted_jobs, ' swift-canary ') && 45 || 20 }}
    env:
      CMUX_NEXT_RUNNER: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || needs.swift-canary-fleet.outputs.verdict == 'pass' && 'blacksmith-2vcpu-ubuntu-2404' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-6vcpu-macos-26' || (github.run_attempt == 1 || github.run_attempt == 2 && github.triggering_actor == 'github-actions[bot]') && contains(needs.macos-placement.outputs.blacksmith_12_jobs, ' swift-canary ') && 'blacksmith-12vcpu-macos-26' || (github.run_attempt == 1 || github.run_attempt == 2 && github.triggering_actor == 'github-actions[bot]') && contains(needs.macos-placement.outputs.blacksmith_6_jobs, ' swift-canary ') && 'blacksmith-6vcpu-macos-26' || (github.run_attempt == 1 || github.run_attempt == 2 && github.triggering_actor == 'github-actions[bot]') && contains(needs.macos-placement.outputs.hosted_jobs, ' swift-canary ') && needs.macos-placement.outputs.hosted_runner || (github.run_attempt == 1 || github.triggering_actor != 'github-actions[bot]') && needs.macos-placement.outputs.runner || github.repository_owner != 'manaflow-ai' && 'macos-26' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-6vcpu-macos-26' || vars.CI_PR_POOL_OWNED == '1' && contains(fromJSON('["pull_request","push","workflow_dispatch"]'), github.event_name) && (github.run_attempt == 1 || github.triggering_actor != 'github-actions[bot]') && vars.CI_SIDE_LANE_RUNNER || needs.macos-placement.outputs.retry_runner || vars.CI_PR_POOL_OWNED == '1' && contains(fromJSON('["pull_request","push","workflow_dispatch"]'), github.event_name) && (github.run_attempt <= 3 || github.triggering_actor != 'github-actions[bot]') && vars.CI_SIDE_LANE_RUNNER || vars.MACOS_RUNNER_26 || 'blacksmith-6vcpu-macos-26') }}
      SWIFT_CANARY_TARGETS: ${{ needs.path_route.outputs.swift_canary_targets }}
    steps:
      - name: Report the build fleet compile verdict
        if: ${{ needs.swift-canary-fleet.outputs.verdict == 'pass' }}
        run: |
          echo "The build fleet compiled and linked the cmux-next app at this commit; the Mac canary was not needed."
          {
            echo "### Swift canary"
            echo
            echo "The build fleet compiled and linked the cmux-next app at this commit (swift-canary-fleet), so this canary did not take a Mac."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Clear stale git locks (self-hosted reused workspace)
        shell: bash
        run: |
          ws="${GITHUB_WORKSPACE:-$PWD}"
          rm -f "$ws/.git/index.lock" 2>/dev/null || true

      - name: Checkout
        id: checkout
        continue-on-error: true
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: false
          fetch-depth: 2

      # As in swift test: a partial clone left in this reused workspace fetches
      # a missing blob mid-step, unretried. Retry once from a fresh repository.
      - name: Discard the workspace repository after a failed checkout
        if: steps.checkout.outcome == 'failure'
        run: rm -rf "$GITHUB_WORKSPACE/.git"

      - name: Retry checkout after transient network failure
        if: steps.checkout.outcome == 'failure'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: false
          fetch-depth: 2

      - name: Drop stale submodule checkouts (self-hosted reused workspace)
        run: scripts/ci/reset-stale-submodules.sh

      - name: Select Xcode
        if: ${{ needs.swift-canary-fleet.outputs.verdict != 'pass' }}
        run: ./scripts/select-ci-xcode.sh

      # Checkout removes .build. Link the owned Mac's kept build after Xcode
      # selection so its fingerprint uses the compiler that runs this job.
      - name: Keep Swift package builds on this owned Mac
        if: ${{ needs.swift-canary-fleet.outputs.verdict != 'pass' && (contains(runner.name, '-glaeda')) }}
        continue-on-error: true
        run: python3 scripts/ci/owned_spm_scratch.py link "$GITHUB_WORKSPACE"

      - name: Type-check changed CmuxNext targets
        if: ${{ needs.swift-canary-fleet.outputs.verdict != 'pass' }}
        working-directory: Packages/macOS/CmuxNext
        env:
          SWIFT_CANARY_TARGETS: ${{ needs.path_route.outputs.swift_canary_targets }}
        run: |
          set -euo pipefail
          read -r -a targets <<< "$SWIFT_CANARY_TARGETS"
          ((${#targets[@]} > 0))
          started=$(date +%s)
          for target in "${targets[@]}"; do
            echo "Canary target: $target"
            swift build --configuration debug --target "$target"
          done
          elapsed=$(( $(date +%s) - started ))
          {
            echo "### Swift canary"
            echo
            echo "Targets: ${targets[*]}"
            echo "Elapsed: ${elapsed}s"
            echo "This is the fast PR gate for package-only CmuxNext Swift edits. The Release compile also runs on every PR that changes a CmuxNext Swift file, for Release-only optimizer failures a Debug build cannot see."
          } >> "$GITHUB_STEP_SUMMARY"

  # The PR fast tier (hq#1915, cx-29ch2): every registered deterministic suite
  # (scripts/cmux-next/fast-tier.json) on every feat-cmux-next PR and push,
  # whatever paths changed, without the gui token. Target: under 5 minutes
  # with the build. A fail-then-pass entry is FLAKY and fails the job: it is
  # never retried silently (fast-tier.py's flake policy). The registry is split
  # by kind: this Mac job builds and runs the Swift (and script) entries, and
  # fast-tier-cargo runs the cargo entries on Linux beside it, so the Mac no
  # longer builds cmux-tui (297-422 s) after CmuxNext.
  # A pull request the router sends to no Mac tier (only web or CI files, which
  # no fast-tier entry builds or reads) starts no Mac fast tier: its result is
  # the base's. The cargo half still runs, and a route with no answer (a failed
  # path_route) runs it as before.
  fast-tier:
    needs: [macos-placement, path_route, push-head-preflight]
    if: ${{ !cancelled() && inputs.same_tree_sha == '' && inputs.dev_daily != true && needs.push-head-preflight.outputs.current == 'true' && ((github.event_name == 'pull_request' && github.base_ref == 'feat-cmux-next' && needs.path_route.outputs.macos != 'false') || (github.event_name == 'push' && github.ref == 'refs/heads/feat-cmux-next')) }}
    name: cmux-next fast tier
    # The cache saves name the R2 write credentials, which live in the ci-cache-writer
    # environment (main only; tests/test_ci_pull_request_caches_are_read_only.py). This job
    # never runs on main, so it still enters no environment: the line changes nothing at run time.
    environment: ${{ github.ref == 'refs/heads/main' && 'ci-cache-writer' || '' }}
    concurrency:
      group: ${{ github.event_name == 'push' && format('cmux-next-push-{0}-fast-tier', github.ref) || format('cmux-next-run-{0}-fast-tier', github.run_id) }}
      cancel-in-progress: false
    # vars.CI_FAST_LANE_RUNNER is the fast tier's own reserved runner label
    # (glaeda-fast-<class>-xcode-26.6). The tier takes it only through the
    # placement's fast_runner, set while one of its runners is idle, and only on
    # attempt 1: a re-run reuses attempt 1's placement, whose idle reading is stale.
    # Otherwise the tier takes the cascade (Blacksmith, hosted) and then the side
    # route, so it never waits on that one small pool. The fork clause stays first, so a fork
    # pull request never reaches it.
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-6vcpu-macos-26' || needs.macos-placement.outputs.fast_runner != '' && github.run_attempt == 1 && needs.macos-placement.outputs.fast_runner || (github.run_attempt == 1 || github.run_attempt == 2 && github.triggering_actor == 'github-actions[bot]') && contains(needs.macos-placement.outputs.blacksmith_12_jobs, ' fast-tier ') && 'blacksmith-12vcpu-macos-26' || (github.run_attempt == 1 || github.run_attempt == 2 && github.triggering_actor == 'github-actions[bot]') && contains(needs.macos-placement.outputs.blacksmith_6_jobs, ' fast-tier ') && 'blacksmith-6vcpu-macos-26' || (github.run_attempt == 1 || github.run_attempt == 2 && github.triggering_actor == 'github-actions[bot]') && contains(needs.macos-placement.outputs.hosted_jobs, ' fast-tier ') && needs.macos-placement.outputs.hosted_runner || (github.run_attempt == 1 || github.triggering_actor != 'github-actions[bot]') && needs.macos-placement.outputs.runner || github.repository_owner != 'manaflow-ai' && 'macos-26' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-6vcpu-macos-26' || vars.CI_PR_POOL_OWNED == '1' && contains(fromJSON('["pull_request","push","workflow_dispatch"]'), github.event_name) && (github.run_attempt == 1 || github.triggering_actor != 'github-actions[bot]') && vars.CI_SIDE_LANE_RUNNER || needs.macos-placement.outputs.retry_runner || vars.CI_PR_POOL_OWNED == '1' && contains(fromJSON('["pull_request","push","workflow_dispatch"]'), github.event_name) && (github.run_attempt <= 3 || github.triggering_actor != 'github-actions[bot]') && vars.CI_SIDE_LANE_RUNNER || vars.MACOS_RUNNER_26 || 'blacksmith-6vcpu-macos-26') }}
    permissions:
      # The reuse lookup lists artifacts.
      actions: read
      contents: read
    # A cold package build can exceed the 5-minute target; the job still runs
    # the entries so a cold mini reports, and the summary shows the time.
    # A cold build on hosted macos-26 (about 3 vCPU, no R2 seed for its workspace path) gets more time.
    timeout-minutes: ${{ contains(needs.macos-placement.outputs.hosted_jobs, ' fast-tier ') && 45 || 20 }}
    steps:
      - name: Clear stale git locks (self-hosted reused workspace)
        shell: bash
        run: |
          ws="${GITHUB_WORKSPACE:-$PWD}"
          rm -f "$ws/.git/index.lock" 2>/dev/null || true

      - name: Checkout
        id: checkout
        continue-on-error: true
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: false
          # A reused mini keeps ignored SwiftPM/Cargo/Zig outputs warm. The
          # default clean=true walks and deletes those trees before checkout;
          # clean untracked source explicitly below while preserving caches.
          clean: false
          fetch-depth: 2

      # As in swift test: a partial clone left in this reused workspace fetches
      # a missing blob mid-step, unretried. Retry once from a fresh repository.
      - name: Discard the workspace repository after a failed checkout
        if: steps.checkout.outcome == 'failure'
        run: rm -rf "$GITHUB_WORKSPACE/.git"

      - name: Retry checkout after transient network failure
        if: steps.checkout.outcome == 'failure'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: false
          clean: false
          fetch-depth: 2

      # The Swift entries need no submodule (cmux-tui and its ghostty-next build
      # moved to fast-tier-cargo), so drop whatever a previous job left.
      - name: Drop stale submodule checkouts (self-hosted reused workspace)
        run: scripts/ci/reset-stale-submodules.sh

      - name: Remove stale untracked source (keep ignored build caches)
        run: git clean -ffd

      - name: Select Xcode
        run: ./scripts/select-ci-xcode.sh

      # With vars.CI_NEXT_JOB_REUSE, a pass on the same inputs stands for this run: the
      # steps below skip and the summary names the run that passed. The key
      # (scripts/ci/job_input_fingerprint.py) is the commit's full tree hash, this
      # workflow file's blob hash and the toolchain below; a missing toolchain value
      # gives no key. Not on a fork pull request, which could record a pass of its
      # own under any key.
      - name: Fingerprint this job's inputs
        id: reuse-key
        if: ${{ vars.CI_NEXT_JOB_REUSE == '1' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        continue-on-error: true
        run: |
          python3 -I scripts/ci/job_input_fingerprint.py fast-tier \
            --extra "xcode=$(xcodebuild -version | tr '\n' ' ')" \
            --extra "macos=$(sw_vers -productVersion)" \
            --extra "macos_build=$(sw_vers -buildVersion)" \
            --extra "arch=$(uname -m)" \
            --extra "pool=${{ contains(runner.name, '-glaeda') && 'owned' || startsWith(runner.name, 'blacksmith-') && 'blacksmith' || runner.environment == 'github-hosted' && 'hosted' || runner.name }}" \
            --extra "image=${ImageOS:-}${ImageVersion:+-$ImageVersion}" >> "$GITHUB_OUTPUT"

      - name: Look for a pass on the same inputs
        id: reuse
        if: ${{ steps.reuse-key.outputs.key != '' && inputs.no_reuse != true }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          KEY: ${{ steps.reuse-key.outputs.key }}
        run: python3 -I scripts/ci/job_reuse.py lookup --key "$KEY" >> "$GITHUB_OUTPUT"

      - name: Reuse that pass
        if: ${{ steps.reuse.outputs.hit == 'true' }}
        env:
          KEY: ${{ steps.reuse-key.outputs.key }}
          RUN_URL: ${{ steps.reuse.outputs.run_url }}
          SHA: ${{ steps.reuse.outputs.sha }}
        run: |
          echo "::notice title=cmux-next fast tier reused::$RUN_URL passed on the same inputs (${SHA:0:12})"
          echo "Reused $RUN_URL: it passed on \`${SHA:0:12}\` with the same inputs (\`$KEY\`)." >> "$GITHUB_STEP_SUMMARY"

      # Checkout removes .build. Link the owned Mac's kept build after Xcode
      # selection so its fingerprint uses the compiler that runs this job.
      - name: Keep Swift package builds on this owned Mac
        if: ${{ (contains(runner.name, '-glaeda')) && steps.reuse.outputs.hit != 'true' }}
        continue-on-error: true
        run: python3 scripts/ci/owned_spm_scratch.py link "$GITHUB_WORKSPACE"

      # Owned minis keep their builds on their own SSD (above). Blacksmith overflow
      # restores the newest seed cmux-next-fast-tier-seed.yml saved from a
      # feat-cmux-next push to cmux-ci-cache-next, through its public URL: no
      # credential, and a pull request never writes. The swift directory comes by
      # prefix; the home directory by that seed's exact commit, so both come from
      # one seed and match the input-time manifest in the swift directory.
      - name: Compute fast-tier cache keys
        id: fast-cache-key
        if: ${{ (!contains(runner.name, '-glaeda')) && steps.reuse.outputs.hit != 'true' }}
        run: scripts/cmux-next/fast-tier-cache-key.sh >> "$GITHUB_OUTPUT"

      - name: Restore the CmuxNext build
        id: fast-cache-restore
        if: ${{ (!contains(runner.name, '-glaeda')) && steps.reuse.outputs.hit != 'true' }}
        continue-on-error: true
        uses: ./.github/actions/cache-restore
        env:
          CI_CACHE_R2_PUBLIC_URL: https://ci-cache-next.cmux.com
        with:
          backend: r2
          path: Packages/macOS/CmuxNext/.build
          key: ${{ steps.fast-cache-key.outputs.swift-key }}
          restore-keys: ${{ steps.fast-cache-key.outputs.swift-prefix }}

      - name: Name the restored seed
        id: fast-cache-seed
        if: ${{ (steps.fast-cache-restore.outputs.cache-matched-key != '') && steps.reuse.outputs.hit != 'true' }}
        env:
          MATCHED: ${{ steps.fast-cache-restore.outputs.cache-matched-key }}
          PREFIX: ${{ steps.fast-cache-key.outputs.swift-prefix }}
        run: echo "commit=${MATCHED#"$PREFIX"}" >> "$GITHUB_OUTPUT"

      - name: Restore the CmuxHomeRender build of that seed
        if: ${{ (steps.fast-cache-seed.outputs.commit != '') && steps.reuse.outputs.hit != 'true' }}
        continue-on-error: true
        uses: ./.github/actions/cache-restore
        env:
          CI_CACHE_R2_PUBLIC_URL: https://ci-cache-next.cmux.com
        with:
          backend: r2
          path: Packages/Shared/CmuxHomeRender/.build
          key: ${{ steps.fast-cache-key.outputs.home-prefix }}${{ steps.fast-cache-seed.outputs.commit }}

      # A fresh checkout stamps every source with the checkout time, which SwiftPM
      # reads as "changed". Give each file whose content matches the
      # seed's the time the seed built it from, so only what changed rebuilds.
      - name: Replay the seed's input times
        if: ${{ (steps.fast-cache-seed.outputs.commit != '') && steps.reuse.outputs.hit != 'true' }}
        continue-on-error: true
        run: python3 -I scripts/ci/e2e_warm_derived_data.py replay "$GITHUB_WORKSPACE" Packages/macOS/CmuxNext/.build/cmux-fast-tier-input-mtimes.json

      - name: Run the fast tier
        if: ${{ steps.reuse.outputs.hit != 'true' }}
        env:
          CMUX_FAST_SWIFT_CACHE_KEY: ${{ steps.fast-cache-key.outputs.swift-key }}
          CMUX_FAST_SWIFT_CACHE_HIT: ${{ steps.fast-cache-restore.outputs.cache-hit }}
          CMUX_FAST_CACHE_MATCHED_KEY: ${{ steps.fast-cache-restore.outputs.cache-matched-key }}
        run: python3 -I scripts/cmux-next/fast-tier.py --kind swift --kind script --receipt "$RUNNER_TEMP/cmux-next-fast-tier.json"

      - name: Upload fast-tier timing receipt
        if: ${{ (always()) && steps.reuse.outputs.hit != 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-next-fast-tier-receipt-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cmux-next-fast-tier.json
          if-no-files-found: warn
          retention-days: 14

      # A pass records itself for the next run on the same inputs: an artifact named after
      # the key, which every pull request and the base can list (scripts/ci/job_reuse.py
      # takes only passes of this repository's own runs). Never from a fork pull request.
      # An uncached (no_reuse) run records too.
      - name: Record this pass for the same inputs
        if: ${{ success() && steps.reuse-key.outputs.key != '' && steps.reuse.outputs.hit != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        run: |
          mkdir -p "$RUNNER_TEMP/ci-job-pass"
          printf '%s\n' "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA" > "$RUNNER_TEMP/ci-job-pass/pass.txt"

      - name: Save the pass
        if: ${{ success() && steps.reuse-key.outputs.key != '' && steps.reuse.outputs.hit != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.reuse-key.outputs.key }}
          path: ${{ runner.temp }}/ci-job-pass
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  # The fast tier's cargo entries (fast-tier.py --kind cargo): cmux-tui-core and the
  # layout reducer, built and run on a Linux runner beside the Mac job, so the
  # Mac builds only Swift. Same gating, flake policy and quarantine list as
  # fast-tier; its own check name, receipt and concurrency group.
  fast-tier-cargo:
    needs: [push-head-preflight]
    if: ${{ !cancelled() && inputs.same_tree_sha == '' && inputs.dev_daily != true && needs.push-head-preflight.outputs.current == 'true' && ((github.event_name == 'pull_request' && github.base_ref == 'feat-cmux-next') || (github.event_name == 'push' && github.ref == 'refs/heads/feat-cmux-next')) }}
    name: cmux-next fast tier (cargo)
    concurrency:
      group: ${{ github.event_name == 'push' && format('cmux-next-push-{0}-fast-tier-cargo', github.ref) || format('cmux-next-run-{0}-fast-tier-cargo', github.run_id) }}
      cancel-in-progress: false
    # As cmux-tui.yml's Linux test job: a fork keeps the public or 4-vCPU lane.
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-4vcpu-ubuntu-2404' || 'blacksmith-32vcpu-ubuntu-2404' }}
    permissions:
      # The reuse lookup lists artifacts.
      actions: read
      contents: read
    timeout-minutes: 20
    # cmux-tui-core's ghostty-vt-sys builds libghostty-vt from the ghostty-next gitlink with zig,
    # as in cmux-tui.yml (an empty CMUX_GHOSTTY_SRC overrides a runner-level one).
    env:
      GHOSTTY_ZIG_SOURCE: ghostty-next
      CMUX_GHOSTTY_SRC: ""
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: false

      # clang (bindgen's libclang), Zig and Rust come before the reuse key, which
      # names their versions.
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev pkg-config

      - name: Init the ghostty-next submodule (libghostty-vt for cmux-tui-core)
        run: bash scripts/ci/init-submodule.sh ghostty-next

      - name: Install zig
        run: ./scripts/install-zig-ci.sh

      - name: Set up pinned cmux-tui Rust
        uses: ./.github/actions/setup-cmux-tui-rust

      # With vars.CI_NEXT_JOB_REUSE, a pass on the same inputs stands for this run: the
      # steps below skip and the summary names the run that passed. The key
      # (scripts/ci/job_input_fingerprint.py) is the commit's full tree hash, this
      # workflow file's blob hash and the toolchain below; a missing toolchain value
      # gives no key. Not on a fork pull request, which could record a pass of its
      # own under any key.
      - name: Fingerprint this job's inputs
        id: reuse-key
        if: ${{ vars.CI_NEXT_JOB_REUSE == '1' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        continue-on-error: true
        run: |
          python3 -I scripts/ci/job_input_fingerprint.py fast-tier-cargo \
            --extra "runner=${{ runner.os }}-${{ runner.arch }}" \
            --extra "rustc=$(rustc -Vv | tr '\n' ' ')" \
            --extra "cargo=$(cargo -V)" \
            --extra "zig=$("${CMUX_ZIG:-zig}" version)" \
            --extra "clang=$(clang --version | head -1)" \
            --extra "image=${ImageOS:-}${ImageVersion:+-$ImageVersion}" >> "$GITHUB_OUTPUT"

      - name: Look for a pass on the same inputs
        id: reuse
        if: ${{ steps.reuse-key.outputs.key != '' && inputs.no_reuse != true }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          KEY: ${{ steps.reuse-key.outputs.key }}
        run: python3 -I scripts/ci/job_reuse.py lookup --key "$KEY" >> "$GITHUB_OUTPUT"

      - name: Reuse that pass
        if: ${{ steps.reuse.outputs.hit == 'true' }}
        env:
          KEY: ${{ steps.reuse-key.outputs.key }}
          RUN_URL: ${{ steps.reuse.outputs.run_url }}
          SHA: ${{ steps.reuse.outputs.sha }}
        run: |
          echo "::notice title=cmux-next fast tier (cargo) reused::$RUN_URL passed on the same inputs (${SHA:0:12})"
          echo "Reused $RUN_URL: it passed on \`${SHA:0:12}\` with the same inputs (\`$KEY\`)." >> "$GITHUB_STEP_SUMMARY"

      # As cmux-tui.yml: cargo's registry and dependency builds under cmux-tui/target.
      # Only a feat-cmux-next push saves this build cache; a pull request reads the base
      # branch's. (The pass record at the end of the job is a separate artifact.)
      - name: Cache cargo build
        if: ${{ steps.reuse.outputs.hit != 'true' }}
        id: cargo-cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: cmux-tui -> target
          shared-key: cmux-next-fast-tier-cargo
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/feat-cmux-next' }}

      - name: Run the fast tier (cargo entries)
        if: ${{ steps.reuse.outputs.hit != 'true' }}
        env:
          CMUX_FAST_CARGO_CACHE_HIT: ${{ steps.cargo-cache.outputs.cache-hit }}
        run: python3 -I scripts/cmux-next/fast-tier.py --kind cargo --receipt "$RUNNER_TEMP/cmux-next-fast-tier-cargo.json"

      - name: Upload fast-tier timing receipt
        if: ${{ (always()) && steps.reuse.outputs.hit != 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-next-fast-tier-cargo-receipt-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cmux-next-fast-tier-cargo.json
          if-no-files-found: warn
          retention-days: 3

      # A pass records itself for the next run on the same inputs: an artifact named after
      # the key, which every pull request and the base can list (scripts/ci/job_reuse.py
      # takes only passes of this repository's own runs). Never from a fork pull request.
      # An uncached (no_reuse) run records too.
      - name: Record this pass for the same inputs
        if: ${{ success() && steps.reuse-key.outputs.key != '' && steps.reuse.outputs.hit != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        run: |
          mkdir -p "$RUNNER_TEMP/ci-job-pass"
          printf '%s\n' "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA" > "$RUNNER_TEMP/ci-job-pass/pass.txt"

      - name: Save the pass
        if: ${{ success() && steps.reuse-key.outputs.key != '' && steps.reuse.outputs.hit != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.reuse-key.outputs.key }}
          path: ${{ runner.temp }}/ci-job-pass
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  # The CmuxNext test targets the change reaches: path_route's swift_filter
  # (an empty filter runs every target, as on a full-ci PR, a push or a dispatch). No
  # cmux-tui wait: the live-daemon suites skip unless the same-tree binary is
  # already published, and daemon-test runs them against it.
  swift-test:
    needs: [path_route, macos-placement, push-head-preflight, web-bundles]
    # A same-repository PR runs the targets its change reaches; a fork PR
    # only with full-ci. A feat-cmux-next push skips this job (push CI is the
    # app build only, see the jobs comment), so the PR or a dispatch is where
    # a change's Swift suites run.
    if: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/feat-cmux-next') && (!cancelled() && (needs.web-bundles.result == 'success' || needs.web-bundles.result == 'skipped') && needs.path_route.outputs.swift == 'true' && needs.push-head-preflight.outputs.current == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository || contains(github.event.pull_request.labels.*.name, 'full-ci'))) }}
    name: cmux-next swift test
    continue-on-error: false
    # A push's Mac job waits for the same job of the running push run and is
    # never cancelled once it runs; a newer push replaces only the waiting one
    # (see the workflow concurrency comment).
    concurrency:
      group: ${{ github.event_name == 'pull_request' && format('cmux-next-pr-{0}-swift-test', github.event.pull_request.number) || github.event_name == 'push' && format('cmux-next-push-{0}-swift-test', github.ref) || format('cmux-next-run-{0}-swift-test', github.run_id) }}
      # Report-only PR attempts are superseded by a newer push or rerun.
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-6vcpu-macos-26' || (github.run_attempt == 1 || github.triggering_actor != 'github-actions[bot]') && needs.macos-placement.outputs.gui_runner || github.repository_owner != 'manaflow-ai' && 'macos-26' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-6vcpu-macos-26' || (needs.macos-placement.outputs.runner != '' && 'blacksmith-6vcpu-macos-26') || vars.CI_PR_POOL_OWNED == '1' && contains(fromJSON('["pull_request","push","workflow_dispatch"]'), github.event_name) && (github.run_attempt <= 3 || github.triggering_actor != 'github-actions[bot]') && 'glaeda-gui-std-xcode-26.6' || vars.MACOS_RUNNER_26 || 'blacksmith-6vcpu-macos-26') }}
    permissions:
      # The reuse lookup lists artifacts.
      actions: read
      contents: read
    # A cold build of the package graph (CmuxNext plus its Shared and iOS test
    # dependencies) and the selected suites.
    timeout-minutes: 60
    env:
      # This job's label (its runs-on): a glaeda-* label means a mini.
      CMUX_NEXT_RUNNER: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-6vcpu-macos-26' || (github.run_attempt == 1 || github.triggering_actor != 'github-actions[bot]') && needs.macos-placement.outputs.gui_runner || github.repository_owner != 'manaflow-ai' && 'macos-26' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-6vcpu-macos-26' || (needs.macos-placement.outputs.runner != '' && 'blacksmith-6vcpu-macos-26') || vars.CI_PR_POOL_OWNED == '1' && contains(fromJSON('["pull_request","push","workflow_dispatch"]'), github.event_name) && (github.run_attempt <= 3 || github.triggering_actor != 'github-actions[bot]') && 'glaeda-gui-std-xcode-26.6' || vars.MACOS_RUNNER_26 || 'blacksmith-6vcpu-macos-26') }}
      CMUX_CI_XCODE_APP: ${{ vars.CMUX_CI_XCODE_APP_MACOS_26 }}
      # The package deploys to macOS 26, so the test runner needs a macOS 26
      # host and SDK.
      CMUX_CI_REQUIRED_MACOS_SDK_MAJOR: "26"
      SWIFT_FILTER: ${{ needs.path_route.outputs.swift_filter }}
      SWIFT_TARGETS: ${{ needs.path_route.outputs.swift_targets }}
    steps:
      - name: Clear stale git locks (self-hosted reused workspace)
        shell: bash
        run: |
          ws="${GITHUB_WORKSPACE:-$PWD}"
          rm -f "$ws/.git/index.lock" 2>/dev/null || true

      - name: Checkout
        id: checkout
        continue-on-error: true
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          # The package graph reads no submodule; GhosttyNextKit comes from
          # SwiftPM (Packages/Shared/CmuxGhosttyKit).
          submodules: false
          fetch-depth: 2

      # A blob-filtered checkout by another job leaves a partial clone in this
      # reused workspace, and a missing blob is fetched from GitHub mid-step,
      # unretried. Retry once from a fresh repository; a second failure fails.
      - name: Discard the workspace repository after a failed checkout
        if: steps.checkout.outcome == 'failure'
        run: rm -rf "$GITHUB_WORKSPACE/.git"

      - name: Retry checkout after transient network failure
        if: steps.checkout.outcome == 'failure'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          # The package graph reads no submodule; GhosttyNextKit comes from
          # SwiftPM (Packages/Shared/CmuxGhosttyKit).
          submodules: false
          fetch-depth: 2

      # A mini reuses its workspace: drop the submodule checkouts a previous
      # job left (scripts/ci/reset-stale-submodules.sh), as on a fresh checkout.
      - name: Drop stale submodule checkouts (self-hosted reused workspace)
        run: scripts/ci/reset-stale-submodules.sh

      # The GUI-tagged suites (.requiresGUISession, .requiresPasteboard; for
      # example SidebarLiveReorderTests) skip when the host has no display or
      # pasteboard. Every glaeda mini has both: in 153 swift-test jobs
      # (2026-10-04/05) all 11 minis behind the side label ran
      # SidebarLiveReorderTests and no GUI or pasteboard test skipped. On a
      # mini, CMUX_TEST_REQUIRE_GUI=1 turns a lost display into a failure
      # instead of a silent skip. Blacksmith and hosted labels
      # keep the skip: nothing has shown that they have a display session.
      - name: Require the GUI session on a mini
        if: ${{ startsWith(env.CMUX_NEXT_RUNNER, 'glaeda-') }}
        shell: bash
        run: echo "CMUX_TEST_REQUIRE_GUI=1" >> "$GITHUB_ENV"

      - name: Select Xcode
        run: ./scripts/select-ci-xcode.sh

      # With vars.CI_NEXT_JOB_REUSE, a pass on the same inputs stands for this run: the
      # steps below skip and the summary names the run that passed. The key
      # (scripts/ci/job_input_fingerprint.py swift-test) hashes the git object ids of this
      # job's input paths (derived from cmux_next_route.py and ci-target-graph.json), this
      # workflow file, the toolchain and the env flags below; a missing value gives no key.
      # A base move that touches none of the inputs keeps the key. Not on a fork pull
      # request, which could record a pass of its own under any key.
      - name: Fingerprint this job's inputs
        id: reuse-key
        if: ${{ vars.CI_NEXT_JOB_REUSE == '1' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        continue-on-error: true
        run: |
          python3 -I scripts/ci/job_input_fingerprint.py swift-test \
            --extra "xcode=$(xcodebuild -version | tr '\n' ' ')" \
            --extra "macos=$(sw_vers -productVersion)" \
            --extra "macos_build=$(sw_vers -buildVersion)" \
            --extra "arch=$(uname -m)" \
            --extra "pool=${{ contains(runner.name, '-glaeda') && 'owned' || startsWith(runner.name, 'blacksmith-') && 'blacksmith' || runner.environment == 'github-hosted' && 'hosted' || runner.name }}" \
            --extra "image=${ImageOS:-}${ImageVersion:+-$ImageVersion}" \
            --extra "mini=${{ startsWith(env.CMUX_NEXT_RUNNER, 'glaeda-') }}" \
            --extra "xcode_app=$CMUX_CI_XCODE_APP" \
            --extra "swift_targets=$SWIFT_TARGETS" \
            --extra "swift_filter=$SWIFT_FILTER" \
            --extra "web_bundles=$(python3 scripts/cmux-next/web-bundle-key.py . --source)" >> "$GITHUB_OUTPUT"

      - name: Look for a pass on the same inputs
        id: reuse
        if: ${{ steps.reuse-key.outputs.key != '' && inputs.no_reuse != true }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          KEY: ${{ steps.reuse-key.outputs.key }}
        run: python3 -I scripts/ci/job_reuse.py lookup --key "$KEY" >> "$GITHUB_OUTPUT"

      - name: Reuse that pass
        if: ${{ steps.reuse.outputs.hit == 'true' }}
        env:
          KEY: ${{ steps.reuse-key.outputs.key }}
          RUN_URL: ${{ steps.reuse.outputs.run_url }}
          SHA: ${{ steps.reuse.outputs.sha }}
        run: |
          echo "::notice title=cmux-next swift test reused::$RUN_URL passed on the same inputs (${SHA:0:12})"
          echo "Reused $RUN_URL: it passed on \`${SHA:0:12}\` with the same inputs (\`$KEY\`)." >> "$GITHUB_STEP_SUMMARY"

      # Checkout removes .build. Link the owned Mac's kept build after Xcode
      # selection so its fingerprint uses the compiler that runs this job.
      - name: Keep Swift package builds on this owned Mac
        if: ${{ (contains(runner.name, '-glaeda')) && steps.reuse.outputs.hit != 'true' }}
        continue-on-error: true
        run: python3 scripts/ci/owned_spm_scratch.py link "$GITHUB_WORKSPACE"

      - name: Set up pinned cmux-tui Rust (sidebar layout reducer)
        if: ${{ steps.reuse.outputs.hit != 'true' }}
        uses: ./.github/actions/setup-cmux-tui-rust

      - name: Install Rust targets (sidebar layout reducer)
        if: ${{ steps.reuse.outputs.hit != 'true' }}
        working-directory: cmux-tui
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Test sidebar layout reducer
        if: ${{ steps.reuse.outputs.hit != 'true' }}
        working-directory: cmux-tui
        run: cargo test -p cmux-layout-reducer --locked

      # macOS-only script behavior tests (PlistBuddy, plutil, lipo): the "Bundle
      # server helper" phase writes the server helper and agent plists without
      # the app's processed Info.plist, and release signing signs every
      # libexec helper and restamps the plists from the final bundle id; the
      # app personality check reads the bundle's Info.plist.
      - name: Script tests (bundle-server-helper)
        if: ${{ steps.reuse.outputs.hit != 'true' }}
        run: |
          bash scripts/cmux-next/tests/bundle-server-helper.test.sh
          bash scripts/cmux-next/tests/sign-cmux-bundle-helpers.test.sh
          bash tests/test_check_app_personalities.sh

      # The package's resources include the web bundles (agent pane, pages,
      # Activity, palette ranker) and the tests read them: build them from the
      # sources (cx-vn5) with the bun webviews/package.json pins.
      - name: Setup Bun
        if: ${{ steps.reuse.outputs.hit != 'true' }}
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"

      # The minis share ~/.bun with workflows that install another bun; this
      # job runs on its own copy of the pinned one (private-bun.sh).
      - name: Give this job its own bun
        if: ${{ steps.reuse.outputs.hit != 'true' }}
        run: scripts/cmux-next/private-bun.sh

      # The webviews app's `vp build` must run on node: on bun it emits
      # different bytes (build-web-bundles.sh).
      - name: Setup Node
        if: ${{ steps.reuse.outputs.hit != 'true' }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.22.1"

      # The Linux web-bundles job builds the bundles once per source key and caches them; a
      # hit installs them here instead of building, and a miss builds them in the next step.
      - name: Source key of the web bundles
        if: ${{ steps.reuse.outputs.hit != 'true' }}
        id: web-bundle-key
        run: echo "key=$(python3 scripts/cmux-next/web-bundle-key.py . --source)" >> "$GITHUB_OUTPUT"

      # R2 first (feat-cmux-next's bundles, published by the web-bundles job of
      # its pushes; no credential), then this run's GitHub cache entry.
      - name: Restore the web bundles from R2
        if: ${{ steps.reuse.outputs.hit != 'true' }}
        id: web-bundle-r2
        uses: ./.github/actions/cache-restore
        env:
          CI_CACHE_R2_PUBLIC_URL: https://ci-cache-next.cmux.com
          CI_CACHE_R2_NAMESPACE: any
        with:
          backend: r2
          path: web-bundles-out
          key: cmux-next-web-bundles-v1-${{ steps.web-bundle-key.outputs.key }}

      - name: Restore the web bundles built for this source key
        id: web-bundle-cache
        if: ${{ (steps.web-bundle-r2.outputs.cache-hit != 'true') && steps.reuse.outputs.hit != 'true' }}
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: web-bundles-out
          key: cmux-next-web-bundles-v1-${{ steps.web-bundle-key.outputs.key }}
          enableCrossOsArchive: true

      - name: Install the restored web bundles
        if: ${{ (steps.web-bundle-r2.outputs.cache-hit == 'true' || steps.web-bundle-cache.outputs.cache-hit == 'true') && steps.reuse.outputs.hit != 'true' }}
        run: scripts/cmux-next/build-web-bundles.sh --from web-bundles-out

      - name: Build the web bundles
        if: ${{ (steps.web-bundle-r2.outputs.cache-hit != 'true' && steps.web-bundle-cache.outputs.cache-hit != 'true') && steps.reuse.outputs.hit != 'true' }}
        run: scripts/cmux-next/build-web-bundles.sh

      - name: Build package and tests
        id: build-tests
        if: ${{ (env.SWIFT_TARGETS != '') && steps.reuse.outputs.hit != 'true' }}
        working-directory: Packages/macOS/CmuxNext
        env:
          CMUX_METRICS_WEB_CACHE_OUTCOME: ${{ steps.web-bundle-cache.outcome }}
          CMUX_METRICS_WEB_CACHE_HIT: ${{ steps.web-bundle-r2.outputs.cache-hit == 'true' && 'true' || steps.web-bundle-cache.outputs.cache-hit }}
        run: python3 ../../../scripts/ci/swiftpm_build_metrics.py --role swift-test --output-dir "$RUNNER_TEMP/cmux-next-build-metrics" -- swift build --build-tests

      - name: Upload the test build measurement and log
        continue-on-error: true
        if: ${{ (always()) && steps.reuse.outputs.hit != 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-next-build-metrics-swift-test-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cmux-next-build-metrics
          if-no-files-found: ignore
          retention-days: 3

      - name: Compile string catalogs into the resource bundles
        if: ${{ (env.SWIFT_TARGETS != '') && steps.reuse.outputs.hit != 'true' }}
        working-directory: Packages/macOS/CmuxNext
        run: ../../../scripts/cmux-next/compile-string-catalogs.sh

      # Samples and fails a run still going after 15 minutes, so a hang shows
      # its stacks; each test step timeout stops it holding the runner regardless.
      # Control tests use tight request deadlines and run in their own process so
      # they do not compete with the other MainActor-isolated suites.
      - name: Run package tests (selected targets; control deadline and isolated suites run below)
        if: ${{ (env.SWIFT_TARGETS != '') && steps.reuse.outputs.hit != 'true' }}
        timeout-minutes: 20
        working-directory: Packages/macOS/CmuxNext
        env:
          CMUX_NEXT_TEST_HANG_SECONDS: "900"
          # At most 6 Swift Testing tests run at once. A test's time limit
          # counts from its start, and Swift Testing otherwise starts all
          # ~5,900 at once: on a mini shared with Xcode compiles, tests used
          # their 60 s waiting for the main actor (18 to 73 time-limit
          # failures per push run; 0 on an idle worker, where width 6 costs
          # 117 s -> 141 s). Xcode 26.6's Swift Testing reads this variable.
          SWT_EXPERIMENTAL_MAXIMUM_PARALLELIZATION_WIDTH: "6"
        run: |
          set -euo pipefail
          echo "Test targets: $SWIFT_TARGETS"
          filter=()
          [[ -z "$SWIFT_FILTER" ]] || filter=(--filter "$SWIFT_FILTER")
          ../../../scripts/cmux-next/swift-test-with-hang-sampler.sh --skip-build ${filter[@]+"${filter[@]}"} --skip CmuxNextControlTests --skip BranchStateResourcesTests --skip CloudBringBackTests

      # Cloud bring-back round trips launch two daemons and mutate shared
      # AppKit/registry state. Run each case in a fresh process so a prior
      # round trip cannot starve the next case's 60-second action deadline.
      - name: Run CloudBringBack cases in fresh processes
        if: ${{ (!cancelled() && steps.build-tests.outcome == 'success' && (env.SWIFT_TARGETS == 'all' || contains(env.SWIFT_TARGETS, 'CmuxNextAppTests'))) && steps.reuse.outputs.hit != 'true' }}
        timeout-minutes: 40
        working-directory: Packages/macOS/CmuxNext
        env:
          CMUX_NEXT_TEST_HANG_SECONDS: "900"
          SWT_EXPERIMENTAL_MAXIMUM_PARALLELIZATION_WIDTH: "1"
        run: |
          set -euo pipefail
          status=0
          for test in \
            CloudBringBackTests.aCLIBringBackEndsWithTheChatInALocalTabAndTheMachineTabClosed \
            CloudBringBackTests.aRevokeThatFailsIsTriedAgainUntilItIsDone \
            CloudBringBackTests.aFileAskFromAMovedChatShowsACardAndOnlyThePersonsClickAnswersIt \
            CloudBringBackTests.aSecretAskTakesWhatThePersonTypesOnStdinOnlyAndNoFileHoldsIt \
            CloudBringBackTests.aFileDroppedInAMovedChatGoesToItsMachineFromThisMacsPastesFolderOnly \
            CloudBringBackTests.aSyncConflictKeepsTheMachineTabAndShowsTheConflict \
            CloudBringBackTests.anOutdatedMachineIsNamedAndTheChatStaysOnIt \
            CloudBringBackTests.updateMachineUpdatesAnOutdatedMachineThenBringsTheChatBack \
            CloudBringBackTests.aGuardRefusalKeepsTheMachineTabWithAClearMessage \
            CloudBringBackTests.aGuardRefusalOffersAskFirstThenBringsTheChatBack \
            CloudBringBackTests.aCommittedBringBackWhoseTabFailedStillOpensItAfterARelaunch \
            CloudBringBackTests.aSyncPullThatThrowsKeepsTheBringBackRetryable; do
            echo "Running isolated CloudBringBack case: $test"
            if ../../../scripts/cmux-next/swift-test-with-hang-sampler.sh --skip-build --no-parallel --filter "$test"; then
              :
            else
              case_status=$?
              (( status == 0 )) && status=$case_status
              echo "Cloud bring-back case failed: $test (status $case_status)"
            fi
          done
          exit "$status"

      # Each isolated step below runs when its suites' target is selected and
      # the build succeeded, even after a failed test step, so one red step
      # does not hide the others.
      - name: Run control package tests and callback regressions
        if: ${{ (!cancelled() && steps.build-tests.outcome == 'success' && (env.SWIFT_TARGETS == 'all' || contains(env.SWIFT_TARGETS, 'CmuxNextControlTests') || contains(env.SWIFT_TARGETS, 'CmuxNextAppTests'))) && steps.reuse.outputs.hit != 'true' }}
        timeout-minutes: 20
        working-directory: Packages/macOS/CmuxNext
        env:
          CMUX_NEXT_TEST_HANG_SECONDS: "900"
        run: ../../../scripts/cmux-next/swift-test-with-hang-sampler.sh --skip-build --filter 'CmuxNextControlTests' --skip CLISurfaceParityTests

      # The CLI parity tests assert routing, not scheduler throughput. Concurrent
      # app/catalog setup can occupy the main actor longer than their real request
      # deadlines, so they run alone and one test at a time.
      - name: Run CLI parity tests
        if: ${{ (!cancelled() && steps.build-tests.outcome == 'success' && (env.SWIFT_TARGETS == 'all' || contains(env.SWIFT_TARGETS, 'CmuxNextControlTests') || contains(env.SWIFT_TARGETS, 'CmuxNextAppTests'))) && steps.reuse.outputs.hit != 'true' }}
        timeout-minutes: 10
        working-directory: Packages/macOS/CmuxNext
        env:
          CMUX_NEXT_TEST_HANG_SECONDS: "480"
        run: ../../../scripts/cmux-next/swift-test-with-hang-sampler.sh --skip-build --no-parallel --filter CLISurfaceParityTests

      # The state-resource event round trips against the real daemon need their
      # own process: unrelated suites can delay callbacks beyond these tests'
      # existing deadlines. Every test still runs.
      - name: Run state-resource regressions
        if: ${{ (!cancelled() && steps.build-tests.outcome == 'success' && (env.SWIFT_TARGETS == 'all' || contains(env.SWIFT_TARGETS, 'CmuxNextDaemonTests'))) && steps.reuse.outputs.hit != 'true' }}
        timeout-minutes: 10
        working-directory: Packages/macOS/CmuxNext
        env:
          CMUX_NEXT_TEST_HANG_SECONDS: "480"
        run: ../../../scripts/cmux-next/swift-test-with-hang-sampler.sh --skip-build --no-parallel --filter BranchStateResourcesTests

      # A test helper that died on a signal leaves its crash report here
      # (scripts/cmux-next/swift-test-with-hang-sampler.sh): the crashed
      # thread names the test that trapped.
      - name: Upload the test helper's crash reports
        if: ${{ (failure()) && steps.reuse.outputs.hit != 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: swift-test-crash-reports-${{ github.run_attempt }}
          path: ${{ runner.temp }}/swift-test-crash-reports
          if-no-files-found: ignore
          retention-days: 3
      # A pass records itself for the next run on the same inputs: an artifact named after
      # the key, which every pull request and the base can list (scripts/ci/job_reuse.py
      # takes only passes of this repository's own runs). Never from a fork pull request.
      # An uncached (no_reuse) run records too.
      - name: Record this pass for the same inputs
        if: ${{ success() && steps.reuse-key.outputs.key != '' && steps.reuse.outputs.hit != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        run: |
          mkdir -p "$RUNNER_TEMP/ci-job-pass"
          printf '%s\n' "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA" > "$RUNNER_TEMP/ci-job-pass/pass.txt"

      - name: Save the pass
        if: ${{ success() && steps.reuse-key.outputs.key != '' && steps.reuse.outputs.hit != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.reuse-key.outputs.key }}
          path: ${{ runner.temp }}/ci-job-pass
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  # The live-daemon suites (daemon integration and branch tests, the mobile
  # live daemon and first launch) against this commit's own cmux-tui tree,
  # which the gate above waits for on Linux. Only the daemon tier runs it:
  # daemon, Rust core, FFI and control paths on a same-repository PR (a fork
  # PR with full-ci), and every push and dispatch.
  daemon-test:
    needs: [path_route, macos-placement, push-head-preflight, web-bundles]
    # This run's own tier on a published tree (path routing's probe), or
    # same-tree mode after the artifacts workflow published it.
    if: ${{ inputs.same_tree_origin != 'push' && !cancelled() && (needs.web-bundles.result == 'success' || needs.web-bundles.result == 'skipped') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository || contains(github.event.pull_request.labels.*.name, 'full-ci')) && ((inputs.same_tree_sha == '' && needs.path_route.outputs.daemon == 'true' && needs.push-head-preflight.outputs.current == 'true' && needs.path_route.outputs.tree_state == 'ready') || (inputs.same_tree_sha != '' && inputs.same_tree_state == 'ready' && contains(inputs.same_tree_tiers, 'daemon'))) }}
    name: cmux-next daemon tests
    # A push's Mac job waits for the same job of the running push run and is
    # never cancelled once it runs; a newer push replaces only the waiting one
    # (see the workflow concurrency comment).
    concurrency:
      group: ${{ github.event_name == 'push' && format('cmux-next-push-{0}-daemon-test', github.ref) || format('cmux-next-run-{0}-daemon-test', github.run_id) }}
      cancel-in-progress: false
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-6vcpu-macos-26' || (github.run_attempt == 1 || github.triggering_actor != 'github-actions[bot]') && (needs.macos-placement.outputs.session_runner || needs.macos-placement.outputs.gui_runner) || github.repository_owner != 'manaflow-ai' && 'macos-26' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-6vcpu-macos-26' || (needs.macos-placement.outputs.runner != '' && 'blacksmith-6vcpu-macos-26') || vars.CI_PR_POOL_OWNED == '1' && contains(fromJSON('["pull_request","push","workflow_dispatch"]'), github.event_name) && (github.run_attempt <= 3 || github.triggering_actor != 'github-actions[bot]') && (vars.CI_SESSION_LABEL == '1' && 'glaeda-session-std-xcode-26.6' || 'glaeda-gui-std-xcode-26.6') || vars.MACOS_RUNNER_26 || 'blacksmith-6vcpu-macos-26') }}
    # actions: read lets the same-tree cmux-tui fetch read the artifacts runs.
    permissions:
      actions: read
      contents: read
      # statuses: write reports a same-tree mode result on the tested commit.
      statuses: write
    timeout-minutes: 60
    env:
      CMUX_NEXT_RUNNER: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-6vcpu-macos-26' || (github.run_attempt == 1 || github.triggering_actor != 'github-actions[bot]') && (needs.macos-placement.outputs.session_runner || needs.macos-placement.outputs.gui_runner) || github.repository_owner != 'manaflow-ai' && 'macos-26' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-6vcpu-macos-26' || (needs.macos-placement.outputs.runner != '' && 'blacksmith-6vcpu-macos-26') || vars.CI_PR_POOL_OWNED == '1' && contains(fromJSON('["pull_request","push","workflow_dispatch"]'), github.event_name) && (github.run_attempt <= 3 || github.triggering_actor != 'github-actions[bot]') && (vars.CI_SESSION_LABEL == '1' && 'glaeda-session-std-xcode-26.6' || 'glaeda-gui-std-xcode-26.6') || vars.MACOS_RUNNER_26 || 'blacksmith-6vcpu-macos-26') }}
      CMUX_CI_XCODE_APP: ${{ vars.CMUX_CI_XCODE_APP_MACOS_26 }}
      CMUX_CI_REQUIRED_MACOS_SDK_MAJOR: "26"
      # A pull request that changes no cmux-tui path runs on the newest
      # published tree when its own is not ready (path routing's probe).
      CMUX_TUI_TREE_KEY: ${{ inputs.same_tree_sha == '' && needs.path_route.outputs.tree_fetch_key || '' }}
      # A push whose generated files are routed checks them here, on this job's
      # package build, instead of a second Mac building the same package and
      # tests (generated-files skips such a push). Pull requests keep the
      # generated-files job.
      CMUX_NEXT_FOLD_GENERATED: ${{ github.event_name == 'push' && inputs.same_tree_sha == '' && needs.path_route.outputs.generated == 'true' }}
    steps:
      - name: Clear stale git locks (self-hosted reused workspace)
        shell: bash
        run: |
          ws="${GITHUB_WORKSPACE:-$PWD}"
          rm -f "$ws/.git/index.lock" 2>/dev/null || true

      - name: Checkout
        id: checkout
        continue-on-error: true
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Same-tree mode tests the commit the tree was probed for.
          ref: ${{ inputs.same_tree_sha || '' }}
          persist-credentials: false
          # The package graph reads no submodule; GhosttyNextKit comes from
          # SwiftPM (Packages/Shared/CmuxGhosttyKit).
          submodules: false
          fetch-depth: 2

      # A blob-filtered checkout by another job leaves a partial clone in this
      # reused workspace, and a missing blob is fetched from GitHub mid-step,
      # unretried. Retry once from a fresh repository; a second failure fails.
      - name: Discard the workspace repository after a failed checkout
        if: steps.checkout.outcome == 'failure'
        run: rm -rf "$GITHUB_WORKSPACE/.git"

      - name: Retry checkout after transient network failure
        if: steps.checkout.outcome == 'failure'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Same-tree mode tests the commit the tree was probed for.
          ref: ${{ inputs.same_tree_sha || '' }}
          persist-credentials: false
          # The package graph reads no submodule; GhosttyNextKit comes from
          # SwiftPM (Packages/Shared/CmuxGhosttyKit).
          submodules: false
          fetch-depth: 2

      # A mini reuses its workspace: drop the submodule checkouts a previous
      # job left (scripts/ci/reset-stale-submodules.sh), as on a fresh checkout.
      - name: Drop stale submodule checkouts (self-hosted reused workspace)
        run: scripts/ci/reset-stale-submodules.sh

      # The GUI-tagged suites (.requiresGUISession, .requiresPasteboard; for
      # example SidebarLiveReorderTests) skip when the host has no display or
      # pasteboard. Every glaeda mini has both: in 153 swift-test jobs
      # (2026-10-04/05) all 11 minis behind the side label ran
      # SidebarLiveReorderTests and no GUI or pasteboard test skipped. On a
      # mini, CMUX_TEST_REQUIRE_GUI=1 turns a lost display into a failure
      # instead of a silent skip. Blacksmith and hosted labels
      # keep the skip: nothing has shown that they have a display session.
      - name: Require the GUI session on a mini
        if: ${{ startsWith(env.CMUX_NEXT_RUNNER, 'glaeda-') }}
        shell: bash
        run: echo "CMUX_TEST_REQUIRE_GUI=1" >> "$GITHUB_ENV"

      - name: Select Xcode
        run: ./scripts/select-ci-xcode.sh

      # Checkout removes .build. Link the owned Mac's kept build after Xcode
      # selection so its fingerprint uses the compiler that runs this job.
      - name: Keep Swift package builds on this owned Mac
        if: ${{ contains(runner.name, '-glaeda') }}
        continue-on-error: true
        run: python3 scripts/ci/owned_spm_scratch.py link "$GITHUB_WORKSPACE"

      - name: Set up pinned cmux-tui Rust (sidebar layout reducer)
        uses: ./.github/actions/setup-cmux-tui-rust

      # The package's resources include the web bundles (agent pane, pages,
      # Activity, palette ranker) and the tests read them: build them from the
      # sources (cx-vn5) with the bun webviews/package.json pins.
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"

      # The minis share ~/.bun with workflows that install another bun; this
      # job runs on its own copy of the pinned one (private-bun.sh).
      - name: Give this job its own bun
        run: scripts/cmux-next/private-bun.sh

      # The webviews app's `vp build` must run on node: on bun it emits
      # different bytes (build-web-bundles.sh).
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.22.1"

      # The Linux web-bundles job builds the bundles once per source key and caches them; a
      # hit installs them here instead of building, and a miss builds them in the next step.
      - name: Source key of the web bundles
        id: web-bundle-key
        run: echo "key=$(python3 scripts/cmux-next/web-bundle-key.py . --source)" >> "$GITHUB_OUTPUT"

      # R2 first (feat-cmux-next's bundles, published by the web-bundles job of
      # its pushes; no credential), then this run's GitHub cache entry.
      - name: Restore the web bundles from R2
        id: web-bundle-r2
        uses: ./.github/actions/cache-restore
        env:
          CI_CACHE_R2_PUBLIC_URL: https://ci-cache-next.cmux.com
          CI_CACHE_R2_NAMESPACE: any
        with:
          backend: r2
          path: web-bundles-out
          key: cmux-next-web-bundles-v1-${{ steps.web-bundle-key.outputs.key }}

      - name: Restore the web bundles built for this source key
        id: web-bundle-cache
        if: steps.web-bundle-r2.outputs.cache-hit != 'true'
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: web-bundles-out
          key: cmux-next-web-bundles-v1-${{ steps.web-bundle-key.outputs.key }}
          enableCrossOsArchive: true

      - name: Install the restored web bundles
        if: steps.web-bundle-r2.outputs.cache-hit == 'true' || steps.web-bundle-cache.outputs.cache-hit == 'true'
        run: scripts/cmux-next/build-web-bundles.sh --from web-bundles-out

      - name: Build the web bundles
        if: steps.web-bundle-r2.outputs.cache-hit != 'true' && steps.web-bundle-cache.outputs.cache-hit != 'true'
        run: scripts/cmux-next/build-web-bundles.sh

      - name: Build package and tests
        id: build-tests
        working-directory: Packages/macOS/CmuxNext
        env:
          CMUX_METRICS_WEB_CACHE_OUTCOME: ${{ steps.web-bundle-cache.outcome }}
          CMUX_METRICS_WEB_CACHE_HIT: ${{ steps.web-bundle-r2.outputs.cache-hit == 'true' && 'true' || steps.web-bundle-cache.outputs.cache-hit }}
        run: python3 ../../../scripts/ci/swiftpm_build_metrics.py --role daemon-test --output-dir "$RUNNER_TEMP/cmux-next-build-metrics" -- swift build --build-tests

      - name: Upload the test build measurement and log
        continue-on-error: true
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-next-build-metrics-daemon-test-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cmux-next-build-metrics
          if-no-files-found: ignore
          retention-days: 3

      # The generated files checks of a push (CMUX_NEXT_FOLD_GENERATED), on the
      # package and tests built above and before the catalogs are compiled into
      # the resource bundles, as the generated-files job runs them. Their
      # verdict is the last steps of this job, after the daemon suites.
      - name: Check generated action catalog, surfaces and inventory
        id: actions
        if: ${{ env.CMUX_NEXT_FOLD_GENERATED == 'true' }}
        continue-on-error: true
        working-directory: Packages/macOS/CmuxNext
        env:
          CMUX_ACTION_SURFACES_SKIP_BUILD: "1"
        run: ../../../scripts/cmux-next/check-action-surfaces.sh "$PWD"

      - name: Check the settings exports
        id: settings
        if: ${{ env.CMUX_NEXT_FOLD_GENERATED == 'true' }}
        continue-on-error: true
        run: python3 scripts/ci/defaults_guard.py check-stamp --base "$(git rev-parse HEAD^1)"

      - name: Compile string catalogs into the resource bundles
        working-directory: Packages/macOS/CmuxNext
        run: ../../../scripts/cmux-next/compile-string-catalogs.sh

      # Building the package's reducer FFI can recreate the isolated crate's
      # workspace lockfile. Remove generated state immediately before
      # pin-cmux-tui validates the checkout.
      - name: Clean generated layout-reducer FFI lockfile
        run: rm -f cmux-tui/crates/cmux-layout-reducer-ffi/Cargo.lock

      - name: Fetch the same-tree cmux-tui
        timeout-minutes: 50
        env:
          # Published before this job starts (probe or same-tree mode): a download.
          CMUX_TUI_TREE_WAIT_SECONDS: "120"
          CMUX_TUI_TREE_KEY: ${{ inputs.same_tree_sha == '' && needs.path_route.outputs.tree_fetch_key || '' }}
          # Push and dispatch runs fail fast when the artifacts runs for this
          # commit were cancelled or superseded (pin-cmux-tui.sh --help).
          CMUX_TUI_TREE_PUBLISHER_SHA: ${{ inputs.same_tree_sha == '' && github.event_name != 'pull_request' && github.sha || '' }}
          GH_TOKEN: ${{ github.token }}
        run: scripts/cmux-next/pin-cmux-tui.sh fetch

      - name: Check the same-tree cmux-tui serves the app's daemon capabilities
        timeout-minutes: 2
        run: scripts/cmux-next/check-daemon-capabilities.sh

      - name: Run the live-daemon suites
        timeout-minutes: 20
        working-directory: Packages/macOS/CmuxNext
        env:
          CMUX_NEXT_TEST_HANG_SECONDS: "900"
          SWT_EXPERIMENTAL_MAXIMUM_PARALLELIZATION_WIDTH: "6"
        run: ../../../scripts/cmux-next/swift-test-with-hang-sampler.sh --skip-build --filter '^(CmuxNextDaemonTests|CmuxNextMobileTests)\.|FirstLaunchTests|ClassicImportTests|ClassicMigrationTests|ClassicUpgradeSimulationTests' --skip BranchStateResourcesTests

      - name: Run state-resource regressions
        if: ${{ !cancelled() && steps.build-tests.outcome == 'success' }}
        timeout-minutes: 10
        working-directory: Packages/macOS/CmuxNext
        env:
          CMUX_NEXT_TEST_HANG_SECONDS: "480"
        run: ../../../scripts/cmux-next/swift-test-with-hang-sampler.sh --skip-build --no-parallel --filter BranchStateResourcesTests

      # A test helper that died on a signal leaves its crash report here
      # (scripts/cmux-next/swift-test-with-hang-sampler.sh): the crashed
      # thread names the test that trapped.
      # The generated files verdict of a push (the checks above), as generated-files gives it.
      # Only the generated paths are collected into the artifact.
      - name: Regenerate stale files
        id: regenerate
        if: ${{ !cancelled() && (steps.actions.outcome == 'failure' || steps.settings.outcome == 'failure') }}
        run: |
          set -euo pipefail
          if [[ "${{ steps.actions.outcome }}" == failure ]]; then
            scripts/cmux-next/regenerate-action-contracts.sh
          fi
          # The Swift settings export only when the source stamp is stale. It writes the
          # files into the checkout, as the fleet export step does, and fails
          # when the stamp still does not match afterwards.
          if [[ "${{ steps.settings.outcome }}" == failure ]] && ! python3 scripts/ci/defaults_guard.py check-stamp; then
            scripts/cmux-next/regenerate-settings-exports.sh "$RUNNER_TEMP/settings-exports"
          fi
          # The defaults snapshot reads the action and settings exports, so it
          # follows whichever of them was regenerated.
          python3 scripts/ci/defaults_guard.py snapshot
          # The regenerated files themselves, at their repository paths, so
          # they copy onto the PR head. A diff would be against the merge
          # commit, whose context the head may not have.
          out="$RUNNER_TEMP/generated/files"
          mkdir -p "$out"
          generated=('plans/cmux-next/*.json' 'plans/cmux-next/*.md'
            schemas/settings/settings-schema.json 'schemas/settings-export/*' 'docs/mdm/*' schemas/defaults/cmux-next.json)
          git add -N -- "${generated[@]}"
          git diff --name-only -- "${generated[@]}" > "$RUNNER_TEMP/generated/paths.txt"
          git diff --stat
          while IFS= read -r path; do
            mkdir -p "$out/$(dirname "$path")"
            cp "$path" "$out/$path"
          done < "$RUNNER_TEMP/generated/paths.txt"
          cp "$RUNNER_TEMP/generated/paths.txt" "$out/.paths"
          if [[ -s "$RUNNER_TEMP/generated/paths.txt" ]]; then
            echo "patch=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload the regenerated files
        if: ${{ !cancelled() && steps.regenerate.outputs.patch == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-next-generated-patch
          path: ${{ runner.temp }}/generated/files
          include-hidden-files: true
          retention-days: 3

      - name: Fail on stale generated files
        if: ${{ !cancelled() && (steps.actions.outcome == 'failure' || steps.settings.outcome == 'failure') }}
        run: |
          {
            echo "### Generated cmux-next files are stale"
            echo
            [[ "${{ steps.actions.outcome }}" != failure ]] || echo "- action catalog, surfaces or inventory: scripts/cmux-next/regenerate-action-contracts.sh"
            [[ "${{ steps.settings.outcome }}" != failure ]] || echo "- settings exports and source stamp: scripts/cmux-next/regenerate-settings-exports.sh"
            echo
            echo "The cmux-next-generated-patch artifact holds the regenerated files at their repository paths."
          } | tee -a "$GITHUB_STEP_SUMMARY"
          echo "::error::Generated cmux-next files are stale. Regenerate them as the step summary says."
          exit 1

      - name: Upload the test helper's crash reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: daemon-test-crash-reports-${{ github.run_attempt }}
          path: ${{ runner.temp }}/swift-test-crash-reports
          if-no-files-found: ignore
          retention-days: 3

  # Generated files are fresh: the action catalog, surfaces and inventory
  # (ActionSurfaceParityTests and its siblings) and the settings exports with
  # their source stamp; the CI target graph and the defaults snapshot are
  # bot-only (#21946) and not checked. Its
  # own job, so a pull request that skips the package tests still cannot land
  # a stale export (feat-cmux-next went red at a925bd9 that way). When a file
  # is stale, the job regenerates it, uploads the regenerated files as the
  # cmux-next-generated-patch artifact and fails with the commands to run.

      # Same-tree mode: the result goes on the commit the run was for (a push,
      # or the pull request head), whichever ref the dispatch ran on.
      - name: Report the same-tree result on the tested commit
        if: ${{ always() && inputs.same_tree_status_sha != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS_SHA: ${{ inputs.same_tree_status_sha }}
          JOB_STATUS: ${{ job.status }}
          CONTEXT: cmux-next daemon tests (same-tree)
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          [[ "$STATUS_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::warning::not a commit: $STATUS_SHA"; exit 0; }
          case "$JOB_STATUS" in success) state=success ;; cancelled) state=error ;; *) state=failure ;; esac
          body="$(python3 -c 'import json,sys; print(json.dumps({"state": sys.argv[1], "context": sys.argv[2], "target_url": sys.argv[3], "description": "same-tree cmux-tui run: " + sys.argv[4]}))' "$state" "$CONTEXT" "$TARGET_URL" "$JOB_STATUS")"
          curl -fsS -o /dev/null -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$STATUS_SHA" -d "$body" \
            || echo "::warning::could not post the $CONTEXT status"

  generated-files:
    needs: [path_route, macos-placement, push-head-preflight, web-bundles]
    # A push that daemon-test runs on is checked there (CMUX_NEXT_FOLD_GENERATED): the clause after
    # the fork clause is daemon-test's push condition, which the clauses before it already hold.
    if: ${{ !cancelled() && (needs.web-bundles.result == 'success' || needs.web-bundles.result == 'skipped') && needs.path_route.outputs.generated == 'true' && needs.push-head-preflight.outputs.current == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository || contains(github.event.pull_request.labels.*.name, 'full-ci')) && !(github.event_name == 'push' && inputs.same_tree_origin != 'push' && inputs.same_tree_sha == '' && needs.path_route.outputs.daemon == 'true' && needs.path_route.outputs.tree_state == 'ready') }}
    name: cmux-next generated files
    # Bind pushes to their exact source head. A stalled old head therefore
    # cannot occupy the one branch-wide pending slot for every newer head.
    concurrency:
      group: ${{ github.event_name == 'push' && format('cmux-next-push-{0}-generated-files', github.sha) || format('cmux-next-run-{0}-generated-files', github.run_id) }}
      cancel-in-progress: false
    # vars.CI_SESSION_LANE_RUNNER is generated files' own owned label (glaeda-session-light-xcode-26.6,
    # the light minis' session runner: a logged-in session, no console token). It is set only after
    # those runners are registered; while it is unset the route below is unchanged. The fork clause
    # stays first, so a fork pull request never reaches it.
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-6vcpu-macos-26' || needs.macos-placement.outputs.free_session_runner || needs.macos-placement.outputs.free_gui_runner || vars.CI_SESSION_LANE_RUNNER != '' && vars.CI_PR_POOL_OWNED == '1' && (github.run_attempt == 1 || github.triggering_actor != 'github-actions[bot]') && vars.CI_SESSION_LANE_RUNNER || (github.run_attempt == 1 || github.triggering_actor != 'github-actions[bot]') && (needs.macos-placement.outputs.session_runner || needs.macos-placement.outputs.gui_runner) || github.repository_owner != 'manaflow-ai' && 'macos-26' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-6vcpu-macos-26' || (needs.macos-placement.outputs.runner != '' && 'blacksmith-6vcpu-macos-26') || vars.CI_PR_POOL_OWNED == '1' && contains(fromJSON('["pull_request","push","workflow_dispatch"]'), github.event_name) && (github.run_attempt <= 3 || github.triggering_actor != 'github-actions[bot]') && (vars.CI_SESSION_LABEL == '1' && 'glaeda-session-std-xcode-26.6' || 'glaeda-gui-std-xcode-26.6') || vars.MACOS_RUNNER_26 || 'blacksmith-6vcpu-macos-26') }}
    permissions:
      # The reuse lookup lists artifacts.
      actions: read
      contents: read
    timeout-minutes: 30
    outputs:
      patch: ${{ steps.regenerate.outputs.patch }}
    env:
      CMUX_NEXT_RUNNER: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-6vcpu-macos-26' || needs.macos-placement.outputs.free_session_runner || needs.macos-placement.outputs.free_gui_runner || vars.CI_SESSION_LANE_RUNNER != '' && vars.CI_PR_POOL_OWNED == '1' && (github.run_attempt == 1 || github.triggering_actor != 'github-actions[bot]') && vars.CI_SESSION_LANE_RUNNER || (github.run_attempt == 1 || github.triggering_actor != 'github-actions[bot]') && (needs.macos-placement.outputs.session_runner || needs.macos-placement.outputs.gui_runner) || github.repository_owner != 'manaflow-ai' && 'macos-26' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-6vcpu-macos-26' || (needs.macos-placement.outputs.runner != '' && 'blacksmith-6vcpu-macos-26') || vars.CI_PR_POOL_OWNED == '1' && contains(fromJSON('["pull_request","push","workflow_dispatch"]'), github.event_name) && (github.run_attempt <= 3 || github.triggering_actor != 'github-actions[bot]') && (vars.CI_SESSION_LABEL == '1' && 'glaeda-session-std-xcode-26.6' || 'glaeda-gui-std-xcode-26.6') || vars.MACOS_RUNNER_26 || 'blacksmith-6vcpu-macos-26') }}
      CMUX_CI_XCODE_APP: ${{ vars.CMUX_CI_XCODE_APP_MACOS_26 }}
      CMUX_CI_REQUIRED_MACOS_SDK_MAJOR: "26"
    steps:
      - name: Clear stale git locks (self-hosted reused workspace)
        shell: bash
        run: |
          ws="${GITHUB_WORKSPACE:-$PWD}"
          rm -f "$ws/.git/index.lock" 2>/dev/null || true

      - name: Checkout
        id: checkout
        continue-on-error: true
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          # The package graph reads no submodule; GhosttyNextKit comes from
          # SwiftPM (Packages/Shared/CmuxGhosttyKit).
          submodules: false
          fetch-depth: 2

      # A blob-filtered checkout by another job leaves a partial clone in this
      # reused workspace, and a missing blob is fetched from GitHub mid-step,
      # unretried. Retry once from a fresh repository; a second failure fails.
      - name: Discard the workspace repository after a failed checkout
        if: steps.checkout.outcome == 'failure'
        run: rm -rf "$GITHUB_WORKSPACE/.git"

      - name: Retry checkout after transient network failure
        if: steps.checkout.outcome == 'failure'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          # The package graph reads no submodule; GhosttyNextKit comes from
          # SwiftPM (Packages/Shared/CmuxGhosttyKit).
          submodules: false
          fetch-depth: 2

      # A mini reuses its workspace: drop the submodule checkouts a previous
      # job left (scripts/ci/reset-stale-submodules.sh), as on a fresh checkout.
      - name: Drop stale submodule checkouts (self-hosted reused workspace)
        run: scripts/ci/reset-stale-submodules.sh

      # The GUI-tagged suites (.requiresGUISession, .requiresPasteboard; for
      # example SidebarLiveReorderTests) skip when the host has no display or
      # pasteboard. Every glaeda mini has both: in 153 swift-test jobs
      # (2026-10-04/05) all 11 minis behind the side label ran
      # SidebarLiveReorderTests and no GUI or pasteboard test skipped. On a
      # mini, CMUX_TEST_REQUIRE_GUI=1 turns a lost display into a failure
      # instead of a silent skip. Blacksmith and hosted labels
      # keep the skip: nothing has shown that they have a display session.
      - name: Require the GUI session on a mini
        if: ${{ startsWith(env.CMUX_NEXT_RUNNER, 'glaeda-') }}
        shell: bash
        run: echo "CMUX_TEST_REQUIRE_GUI=1" >> "$GITHUB_ENV"

      - name: Select Xcode
        run: ./scripts/select-ci-xcode.sh

      # With vars.CI_NEXT_JOB_REUSE, a pass on the same inputs stands for this run: the
      # steps below skip and the summary names the run that passed. The key
      # (scripts/ci/job_input_fingerprint.py generated-files) hashes the git object ids of this
      # job's input paths (derived from cmux_next_route.py and ci-target-graph.json), this
      # workflow file, the toolchain and the env flags below; a missing value gives no key.
      # A base move that touches none of the inputs keeps the key. Not on a fork pull
      # request, which could record a pass of its own under any key.
      - name: Fingerprint this job's inputs
        id: reuse-key
        if: ${{ vars.CI_NEXT_JOB_REUSE == '1' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        continue-on-error: true
        run: |
          python3 -I scripts/ci/job_input_fingerprint.py generated-files --base-rev HEAD^1 \
            --extra "xcode=$(xcodebuild -version | tr '\n' ' ')" \
            --extra "macos=$(sw_vers -productVersion)" \
            --extra "macos_build=$(sw_vers -buildVersion)" \
            --extra "arch=$(uname -m)" \
            --extra "pool=${{ contains(runner.name, '-glaeda') && 'owned' || startsWith(runner.name, 'blacksmith-') && 'blacksmith' || runner.environment == 'github-hosted' && 'hosted' || runner.name }}" \
            --extra "image=${ImageOS:-}${ImageVersion:+-$ImageVersion}" \
            --extra "mini=${{ startsWith(env.CMUX_NEXT_RUNNER, 'glaeda-') }}" \
            --extra "xcode_app=$CMUX_CI_XCODE_APP" \
            --extra "web_bundles=$(python3 scripts/cmux-next/web-bundle-key.py . --source)" >> "$GITHUB_OUTPUT"

      - name: Look for a pass on the same inputs
        id: reuse
        if: ${{ steps.reuse-key.outputs.key != '' && inputs.no_reuse != true }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          KEY: ${{ steps.reuse-key.outputs.key }}
        run: python3 -I scripts/ci/job_reuse.py lookup --key "$KEY" >> "$GITHUB_OUTPUT"

      - name: Reuse that pass
        if: ${{ steps.reuse.outputs.hit == 'true' }}
        env:
          KEY: ${{ steps.reuse-key.outputs.key }}
          RUN_URL: ${{ steps.reuse.outputs.run_url }}
          SHA: ${{ steps.reuse.outputs.sha }}
        run: |
          echo "::notice title=cmux-next generated files reused::$RUN_URL passed on the same inputs (${SHA:0:12})"
          echo "Reused $RUN_URL: it passed on \`${SHA:0:12}\` with the same inputs (\`$KEY\`)." >> "$GITHUB_STEP_SUMMARY"

      # Checkout removes .build. Link the owned Mac's kept build after Xcode
      # selection so its fingerprint uses the compiler that runs this job.
      - name: Keep Swift package builds on this owned Mac
        if: ${{ (contains(runner.name, '-glaeda')) && steps.reuse.outputs.hit != 'true' }}
        continue-on-error: true
        run: python3 scripts/ci/owned_spm_scratch.py link "$GITHUB_WORKSPACE"

      - name: Set up pinned cmux-tui Rust (sidebar layout reducer)
        if: ${{ steps.reuse.outputs.hit != 'true' }}
        uses: ./.github/actions/setup-cmux-tui-rust

      # The package's resources include the web bundles (agent pane, pages,
      # Activity, palette ranker) and the tests read them: build them from the
      # sources (cx-vn5) with the bun webviews/package.json pins.
      - name: Setup Bun
        if: ${{ steps.reuse.outputs.hit != 'true' }}
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"

      # The minis share ~/.bun with workflows that install another bun; this
      # job runs on its own copy of the pinned one (private-bun.sh).
      - name: Give this job its own bun
        if: ${{ steps.reuse.outputs.hit != 'true' }}
        run: scripts/cmux-next/private-bun.sh

      # The webviews app's `vp build` must run on node: on bun it emits
      # different bytes (build-web-bundles.sh).
      - name: Setup Node
        if: ${{ steps.reuse.outputs.hit != 'true' }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.22.1"

      # The Linux web-bundles job builds the bundles once per source key and caches them; a
      # hit installs them here instead of building, and a miss builds them in the next step.
      - name: Source key of the web bundles
        if: ${{ steps.reuse.outputs.hit != 'true' }}
        id: web-bundle-key
        run: echo "key=$(python3 scripts/cmux-next/web-bundle-key.py . --source)" >> "$GITHUB_OUTPUT"

      # R2 first (feat-cmux-next's bundles, published by the web-bundles job of
      # its pushes; no credential), then this run's GitHub cache entry.
      - name: Restore the web bundles from R2
        if: ${{ steps.reuse.outputs.hit != 'true' }}
        id: web-bundle-r2
        uses: ./.github/actions/cache-restore
        env:
          CI_CACHE_R2_PUBLIC_URL: https://ci-cache-next.cmux.com
          CI_CACHE_R2_NAMESPACE: any
        with:
          backend: r2
          path: web-bundles-out
          key: cmux-next-web-bundles-v1-${{ steps.web-bundle-key.outputs.key }}

      - name: Restore the web bundles built for this source key
        id: web-bundle-cache
        if: ${{ (steps.web-bundle-r2.outputs.cache-hit != 'true') && steps.reuse.outputs.hit != 'true' }}
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: web-bundles-out
          key: cmux-next-web-bundles-v1-${{ steps.web-bundle-key.outputs.key }}
          enableCrossOsArchive: true

      - name: Install the restored web bundles
        if: ${{ (steps.web-bundle-r2.outputs.cache-hit == 'true' || steps.web-bundle-cache.outputs.cache-hit == 'true') && steps.reuse.outputs.hit != 'true' }}
        run: scripts/cmux-next/build-web-bundles.sh --from web-bundles-out

      - name: Build the web bundles
        if: ${{ (steps.web-bundle-r2.outputs.cache-hit != 'true' && steps.web-bundle-cache.outputs.cache-hit != 'true') && steps.reuse.outputs.hit != 'true' }}
        run: scripts/cmux-next/build-web-bundles.sh

      - name: Build package and tests
        if: ${{ steps.reuse.outputs.hit != 'true' }}
        working-directory: Packages/macOS/CmuxNext
        env:
          CMUX_METRICS_WEB_CACHE_OUTCOME: ${{ steps.web-bundle-cache.outcome }}
          CMUX_METRICS_WEB_CACHE_HIT: ${{ steps.web-bundle-r2.outputs.cache-hit == 'true' && 'true' || steps.web-bundle-cache.outputs.cache-hit }}
        run: python3 ../../../scripts/ci/swiftpm_build_metrics.py --role generated-files --output-dir "$RUNNER_TEMP/cmux-next-build-metrics" -- swift build --build-tests

      - name: Upload the test build measurement and log
        continue-on-error: true
        if: ${{ (always()) && steps.reuse.outputs.hit != 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-next-build-metrics-generated-files-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cmux-next-build-metrics
          if-no-files-found: ignore
          retention-days: 3

      - name: Check generated action catalog, surfaces and inventory
        if: ${{ steps.reuse.outputs.hit != 'true' }}
        id: actions
        continue-on-error: true
        working-directory: Packages/macOS/CmuxNext
        env:
          CMUX_ACTION_SURFACES_SKIP_BUILD: "1"
        run: ../../../scripts/cmux-next/check-action-surfaces.sh "$PWD"

      # The CI target graph is bot-only (scripts/cmux-next/generated_outputs.py,
      # #21946): it is stale on every event between a merge that adds a target
      # and the base autofix's commit, so no event checks it here.

      # The settings exports (schemas/settings/settings-schema.json, docs/mdm):
      # check-stamp recomputes the source stamp (schemas/settings-export) from
      # the CmuxNextSettings sources, so a settings edit without a re-export
      # fails here and is regenerated below. --base HEAD^1 (the merge commit's
      # base tip, or a push's parent): a source already stale on the base is a
      # warning, since the base autofix regenerates it after the merge. The
      # defaults snapshot is bot-only (#21946): it is stale on every event
      # between a merge and the base autofix's commit, so no event checks it here.
      - name: Check the settings exports
        id: settings
        if: ${{ steps.reuse.outputs.hit != 'true' }}
        continue-on-error: true
        run: python3 scripts/ci/defaults_guard.py check-stamp --base "$(git rev-parse HEAD^1)"

      # Only the generated paths are collected into the artifact.
      - name: Regenerate stale files
        id: regenerate
        if: ${{ (steps.actions.outcome == 'failure' || steps.settings.outcome == 'failure') && steps.reuse.outputs.hit != 'true' }}
        run: |
          set -euo pipefail
          if [[ "${{ steps.actions.outcome }}" == failure ]]; then
            scripts/cmux-next/regenerate-action-contracts.sh
          fi
          # The Swift settings export only when the source stamp is stale. It writes the
          # files into the checkout, as the fleet export step does, and fails
          # when the stamp still does not match afterwards.
          if [[ "${{ steps.settings.outcome }}" == failure ]] && ! python3 scripts/ci/defaults_guard.py check-stamp; then
            scripts/cmux-next/regenerate-settings-exports.sh "$RUNNER_TEMP/settings-exports"
          fi
          # The defaults snapshot reads the action and settings exports, so it
          # follows whichever of them was regenerated.
          python3 scripts/ci/defaults_guard.py snapshot
          # The regenerated files themselves, at their repository paths, so
          # they copy onto the PR head. A diff would be against the merge
          # commit, whose context the head may not have.
          out="$RUNNER_TEMP/generated/files"
          mkdir -p "$out"
          generated=('plans/cmux-next/*.json' 'plans/cmux-next/*.md'
            schemas/settings/settings-schema.json 'schemas/settings-export/*' 'docs/mdm/*' schemas/defaults/cmux-next.json)
          git add -N -- "${generated[@]}"
          git diff --name-only -- "${generated[@]}" > "$RUNNER_TEMP/generated/paths.txt"
          git diff --stat
          while IFS= read -r path; do
            mkdir -p "$out/$(dirname "$path")"
            cp "$path" "$out/$path"
          done < "$RUNNER_TEMP/generated/paths.txt"
          cp "$RUNNER_TEMP/generated/paths.txt" "$out/.paths"
          if [[ -s "$RUNNER_TEMP/generated/paths.txt" ]]; then
            echo "patch=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload the regenerated files
        if: ${{ (steps.regenerate.outputs.patch == 'true') && steps.reuse.outputs.hit != 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-next-generated-patch
          path: ${{ runner.temp }}/generated/files
          include-hidden-files: true
          retention-days: 3

      - name: Fail on stale generated files
        if: ${{ (steps.actions.outcome == 'failure' || steps.settings.outcome == 'failure') && steps.reuse.outputs.hit != 'true' }}
        run: |
          {
            echo "### Generated cmux-next files are stale"
            echo
            [[ "${{ steps.actions.outcome }}" != failure ]] || echo "- action catalog, surfaces or inventory: scripts/cmux-next/regenerate-action-contracts.sh"
            [[ "${{ steps.settings.outcome }}" != failure ]] || echo "- settings exports and source stamp: scripts/cmux-next/regenerate-settings-exports.sh"
            echo
            echo "The cmux-next-generated-patch artifact holds the regenerated files at their repository paths."
          } | tee -a "$GITHUB_STEP_SUMMARY"
          echo "::error::Generated cmux-next files are stale. Regenerate them as the step summary says."
          exit 1

      # A pass records itself for the next run on the same inputs: an artifact named after
      # the key, which every pull request and the base can list (scripts/ci/job_reuse.py
      # takes only passes of this repository's own runs). Never from a fork pull request.
      # An uncached (no_reuse) run records too.
      - name: Record this pass for the same inputs
        if: ${{ success() && steps.reuse-key.outputs.key != '' && steps.reuse.outputs.hit != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        run: |
          mkdir -p "$RUNNER_TEMP/ci-job-pass"
          printf '%s\n' "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA" > "$RUNNER_TEMP/ci-job-pass/pass.txt"

      - name: Save the pass
        if: ${{ success() && steps.reuse-key.outputs.key != '' && steps.reuse.outputs.hit != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.reuse-key.outputs.key }}
          path: ${{ runner.temp }}/ci-job-pass
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  # The fleet compile check is the first Release gate. It checks the exact
  # source without occupying a Mac runner.
  # Keep the fast-check wrapper's name distinct from the admission gate below:
  # an unavailable wrapper is a successful job but is not a Release compile.
  release-compile-fast:
    needs: [path_route, push-head-preflight, macos-placement]
    # Like the other build-fleet gateway jobs, it runs only on a gateway runner macos-placement saw
    # idle in this attempt (gateway_runner); otherwise it skips and release-compile runs on the
    # push's Mac route at once instead of behind the gateway's queue.
    if: ${{ !cancelled() && needs.path_route.outputs.native == 'true' && needs.push-head-preflight.outputs.current == 'true' && github.repository_owner == 'manaflow-ai' && github.event_name == 'push' && github.ref == 'refs/heads/feat-cmux-next' && needs.macos-placement.outputs.gateway_attempt == format('{0}', github.run_attempt) && needs.macos-placement.outputs.gateway_runner != '' }}
    name: cmux-next Release compile (fleet fast check)
    concurrency:
      group: ${{ format('cmux-next-release-compile-fast-{0}', github.run_id) }}
      cancel-in-progress: false
    runs-on: ${{ needs.macos-placement.outputs.gateway_runner }}
    permissions:
      contents: read
    timeout-minutes: 30
    outputs:
      verdict: ${{ steps.compile.outputs.verdict }}
    steps:
      # A compile failure keeps this step red but not the job, and the admission
      # job turns verdict=fail red under the gate name. Without a verdict (the
      # job refused at runner setup or killed, or this step died before writing
      # one) release-compile takes over instead.
      - name: Run the fast fleet compile check
        id: compile
        continue-on-error: true
        env:
          REF: ${{ github.sha }}
        run: |
          set -uo pipefail
          client="${CMUX_CI_CLIENT:-$HOME/.local/bin/cmux-ci}"
          if [[ ! -x "$client" ]]; then
            echo "::warning title=Fast fleet compile check::cmux-ci is not installed on $RUNNER_NAME; the Mac fallback will run."
            echo "verdict=unavailable" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Release admission must type-check Release-only conditionals. The
          # private fleet client rolls this profile out independently; until a
          # runner has it, use the Mac Release fallback instead of silently
          # admitting on a Debug compile under the Release gate name.
          if ! "$client" compile-check --help 2>/dev/null | grep -q -- '--release'; then
            echo "::warning title=Fast fleet compile check::the fleet client has no Release profile; the Mac fallback will run."
            echo "verdict=unavailable" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          status=0
          "$client" compile-check --ref "$REF" --app --release \
            --timeout 1200 --queue-timeout 300 || status=$?
          case "$status" in
            0) verdict=pass ;;
            69|75|124) verdict=unavailable; echo "::warning title=Fast fleet compile check::the fleet gave no verdict (exit $status); the Mac fallback will run." ;;
            *) verdict=fail; echo "::error title=Fast fleet compile check::the fleet compile check failed at $REF (exit $status)." ;;
          esac
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
          [[ "$verdict" != fail ]]

  # Promotion admission keys off this exact job name. Keep it separate from
  # the fast-check wrapper so unavailable fast checks cannot satisfy the gate.
  # It runs whenever the fast check ran and did not hand off to the Mac
  # fallback, and is green only on a pass: a fleet compile error stays red
  # under the gate name. The fallback takes over on verdict unavailable and
  # whenever the fast check finished without a verdict (refused at runner
  # setup, or its step died first), so exactly one job carries the gate name
  # for a push.
  # It requests promotion itself, once green: a request from the fast check
  # reached main before this job existed (main waits about 30 s for it), and a
  # rerun of only this gate never reruns a downstream request skipped earlier.
  release-compile-fast-admission:
    needs: release-compile-fast
    if: ${{ always() && !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/feat-cmux-next' && needs.release-compile-fast.result != 'skipped' && needs.release-compile-fast.result != 'cancelled' && needs.release-compile-fast.outputs.verdict != 'unavailable' && needs.release-compile-fast.outputs.verdict != '' }}
    name: cmux-next Release compile (Xcode 26)
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      actions: write
      contents: read
    timeout-minutes: 5
    steps:
      - name: Record the Release compile admission
        env:
          REF: ${{ github.sha }}
          VERDICT: ${{ needs.release-compile-fast.outputs.verdict }}
          RESULT: ${{ needs.release-compile-fast.result }}
        run: |
          if [[ "$VERDICT" == pass && "$RESULT" == success ]]; then
            echo "The fleet fast check compiled this commit in Release mode."
            exit 0
          fi
          echo "::error title=Release compile::the fleet fast check did not compile $REF (verdict ${VERDICT:-none}, job $RESULT); see its log."
          exit 1
      - name: Checkout the pushed commit for the promotion request
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Request nightly-next promotion after this gate
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: scripts/cmux-next/request-nightly-next.sh --sha "$SHA" --repo "$GITHUB_REPOSITORY" --release-compile-green

  release-compile:
    environment: ${{ github.event_name != 'pull_request' && 'ci-build-cache-reader' || '' }}
    needs: [path_route, macos-placement, push-head-preflight, app-compile-fleet, release-compile-fast]
    if: ${{ always() && !cancelled() && needs.path_route.outputs.native == 'true' && needs.push-head-preflight.outputs.current == 'true' && (needs.release-compile-fast.result == 'skipped' || needs.release-compile-fast.outputs.verdict == 'unavailable' || (needs.release-compile-fast.result == 'failure' || needs.release-compile-fast.result == 'success') && needs.release-compile-fast.outputs.verdict == '') && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci') || github.event.pull_request.head.repo.full_name != github.repository && needs.path_route.outputs.cmuxnext_swift == 'true' || github.event.pull_request.head.repo.full_name == github.repository && needs.app-compile-fleet.outputs.verdict != 'pass' && needs.app-compile-fleet.outputs.verdict != 'fail') }}
    name: cmux-next Release compile (Xcode 26)
    # The base's compile check: a current feat-cmux-next push compiles once its
    # preflight sees it is still the tip. Superseded pushes skip before queueing,
    # while a compile that has started gets its own run group and cannot be
    # evicted by a newer push. This leaves one running compile and the newest
    # current tip queued without GitHub's one-pending-run eviction.
    # Release runs on every base push, next-batch/* push and dispatch, and on a
    # PR the native tier reaches with full-ci. #22325 ran it on every
    # same-repository PR; on 2026-10-21 (~20:10Z) 76 of the ~350 queued Mac jobs
    # were this compile, so a same-repository PR compiles its head on the build
    # fleet (app-compile-fleet) and runs this only with full-ci or when the
    # fleet gave no verdict; its merge is compiled by the base push
    # (push-attribution names it on a red).
    # A fork PR runs it with full-ci, or when it changes any .swift
    # file under Packages/macOS/CmuxNext/ (Sources or Tests, whatever else it
    # changes; path_route's cmuxnext_swift). A Release-only
    # optimizer crash (cx-ebm.59.5: EarlyPerfInliner on a main-actor generic
    # class's isolated deinit) reached the base through such a PR, because the
    # Debug fast tier and Debug `swift build` cannot see it.
    # When macos-placement skips (a fork PR), `!cancelled()` keeps this job
    # running and runs-on below takes the shared fallback route.
    continue-on-error: false
    # A started push compile has a per-run group and is never cancelled by a
    # newer push. Superseded pushes are skipped by the job condition above.
    concurrency:
      group: ${{ format('cmux-next-release-compile-{0}', github.run_id) }}
      cancel-in-progress: false
    # The fleet compile check is the primary gate. This Mac job is only the
    # compatible fallback when it has no verdict; on a push it takes a free
    # fleet Mac first, then Blacksmith macOS. It has no dedicated reservation.
    # On a push's attempt 1, a Blacksmith slot macos-placement gave it (its
    # cascade places it only when no idle mini takes it, and first: it gates the
    # nightly-next request) comes before the owned side label, which is then a
    # queue: 2026-10-26 08:16-09:30Z, four feat-cmux-next pushes' Release
    # compiles queued 10-40 min on glaeda-side-std-xcode-26.6 while 6 vCPU had
    # free slots.
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-6vcpu-macos-26' || github.event_name == 'push' && github.ref == 'refs/heads/feat-cmux-next' && needs.release-compile-fast.result == 'failure' && needs.release-compile-fast.outputs.verdict == '' && 'blacksmith-6vcpu-macos-26' || github.event_name == 'push' && github.ref == 'refs/heads/feat-cmux-next' && github.run_attempt == 1 && contains(needs.macos-placement.outputs.blacksmith_12_jobs, ' release-compile ') && 'blacksmith-12vcpu-macos-26' || github.event_name == 'push' && github.ref == 'refs/heads/feat-cmux-next' && github.run_attempt == 1 && contains(needs.macos-placement.outputs.blacksmith_6_jobs, ' release-compile ') && 'blacksmith-6vcpu-macos-26' || github.event_name == 'push' && github.ref == 'refs/heads/feat-cmux-next' && needs.macos-placement.outputs.runner != '' && needs.macos-placement.outputs.runner || github.event_name == 'push' && github.ref == 'refs/heads/feat-cmux-next' && 'blacksmith-6vcpu-macos-26' || (github.run_attempt == 1 || github.run_attempt == 2 && github.triggering_actor == 'github-actions[bot]') && contains(needs.macos-placement.outputs.blacksmith_12_jobs, ' release-compile ') && 'blacksmith-12vcpu-macos-26' || (github.run_attempt == 1 || github.run_attempt == 2 && github.triggering_actor == 'github-actions[bot]') && contains(needs.macos-placement.outputs.blacksmith_6_jobs, ' release-compile ') && 'blacksmith-6vcpu-macos-26' || (github.run_attempt == 1 || github.triggering_actor != 'github-actions[bot]') && needs.macos-placement.outputs.runner || github.repository_owner != 'manaflow-ai' && 'macos-26' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-6vcpu-macos-26' || vars.CI_PR_POOL_OWNED == '1' && contains(fromJSON('["pull_request","push","workflow_dispatch"]'), github.event_name) && (github.run_attempt == 1 || github.triggering_actor != 'github-actions[bot]') && vars.CI_SIDE_LANE_RUNNER || needs.macos-placement.outputs.retry_runner || vars.CI_PR_POOL_OWNED == '1' && contains(fromJSON('["pull_request","push","workflow_dispatch"]'), github.event_name) && (github.run_attempt <= 3 || github.triggering_actor != 'github-actions[bot]') && vars.CI_SIDE_LANE_RUNNER || vars.MACOS_RUNNER_26 || 'blacksmith-6vcpu-macos-26') }}
    permissions:
      # The reuse lookup lists artifacts.
      actions: write
      contents: read
    # One-architecture Release (-O, whole-module) xcodebuild of CmuxNextApp
    # with the nightly's Xcode. Debug `swift build` and Xcode 27 accept code
    # that this rejects; without this job such code fails only the nightly.
    timeout-minutes: 60
    env:
      # This job's label (its runs-on): a glaeda-* label means a mini.
      CMUX_NEXT_RUNNER: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-6vcpu-macos-26' || github.event_name == 'push' && github.ref == 'refs/heads/feat-cmux-next' && needs.release-compile-fast.result == 'failure' && needs.release-compile-fast.outputs.verdict == '' && 'blacksmith-6vcpu-macos-26' || github.event_name == 'push' && github.ref == 'refs/heads/feat-cmux-next' && github.run_attempt == 1 && contains(needs.macos-placement.outputs.blacksmith_12_jobs, ' release-compile ') && 'blacksmith-12vcpu-macos-26' || github.event_name == 'push' && github.ref == 'refs/heads/feat-cmux-next' && github.run_attempt == 1 && contains(needs.macos-placement.outputs.blacksmith_6_jobs, ' release-compile ') && 'blacksmith-6vcpu-macos-26' || github.event_name == 'push' && github.ref == 'refs/heads/feat-cmux-next' && needs.macos-placement.outputs.runner != '' && needs.macos-placement.outputs.runner || github.event_name == 'push' && github.ref == 'refs/heads/feat-cmux-next' && 'blacksmith-6vcpu-macos-26' || (github.run_attempt == 1 || github.run_attempt == 2 && github.triggering_actor == 'github-actions[bot]') && contains(needs.macos-placement.outputs.blacksmith_12_jobs, ' release-compile ') && 'blacksmith-12vcpu-macos-26' || (github.run_attempt == 1 || github.run_attempt == 2 && github.triggering_actor == 'github-actions[bot]') && contains(needs.macos-placement.outputs.blacksmith_6_jobs, ' release-compile ') && 'blacksmith-6vcpu-macos-26' || (github.run_attempt == 1 || github.triggering_actor != 'github-actions[bot]') && needs.macos-placement.outputs.runner || github.repository_owner != 'manaflow-ai' && 'macos-26' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-6vcpu-macos-26' || vars.CI_PR_POOL_OWNED == '1' && contains(fromJSON('["pull_request","push","workflow_dispatch"]'), github.event_name) && (github.run_attempt == 1 || github.triggering_actor != 'github-actions[bot]') && vars.CI_SIDE_LANE_RUNNER || needs.macos-placement.outputs.retry_runner || vars.CI_PR_POOL_OWNED == '1' && contains(fromJSON('["pull_request","push","workflow_dispatch"]'), github.event_name) && (github.run_attempt <= 3 || github.triggering_actor != 'github-actions[bot]') && vars.CI_SIDE_LANE_RUNNER || vars.MACOS_RUNNER_26 || 'blacksmith-6vcpu-macos-26') }}
      CMUX_CI_XCODE_APP: ${{ vars.CMUX_CI_XCODE_APP_MACOS_26 }}
      CMUX_CI_REQUIRED_MACOS_SDK_MAJOR: "26"
    steps:
      - name: Clear stale git locks (self-hosted reused workspace)
        shell: bash
        run: |
          ws="${GITHUB_WORKSPACE:-$PWD}"
          rm -f "$ws/.git/index.lock" 2>/dev/null || true

      - name: Checkout
        id: checkout
        continue-on-error: true
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: false
          fetch-depth: 2

      # A blob-filtered checkout by another job leaves a partial clone in this
      # reused workspace, and a missing blob is fetched from GitHub mid-step,
      # unretried. Retry once from a fresh repository; a second failure fails.
      - name: Discard the workspace repository after a failed checkout
        if: steps.checkout.outcome == 'failure'
        run: rm -rf "$GITHUB_WORKSPACE/.git"

      - name: Retry checkout after transient network failure
        if: steps.checkout.outcome == 'failure'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: false
          fetch-depth: 2

      # A mini reuses its workspace: drop the submodule checkouts a previous
      # job left (scripts/ci/reset-stale-submodules.sh), as on a fresh checkout.
      - name: Drop stale submodule checkouts (self-hosted reused workspace)
        run: scripts/ci/reset-stale-submodules.sh

      - name: Select Xcode
        run: ./scripts/select-ci-xcode.sh

      # With vars.CI_NEXT_JOB_REUSE, a pass on the same inputs stands for this run: the
      # steps below skip and the summary names the run that passed. The key
      # (scripts/ci/job_input_fingerprint.py release-compile) hashes the git object ids of this
      # job's input paths (derived from cmux_next_route.py and ci-target-graph.json), this
      # workflow file, the toolchain and the env flags below; a missing value gives no key.
      # A base move that touches none of the inputs keeps the key. Not on a fork pull
      # request, which could record a pass of its own under any key.
      - name: Fingerprint this job's inputs
        id: reuse-key
        if: ${{ vars.CI_NEXT_JOB_REUSE == '1' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        continue-on-error: true
        run: |
          python3 -I scripts/ci/job_input_fingerprint.py release-compile \
            --extra "xcode=$(xcodebuild -version | tr '\n' ' ')" \
            --extra "macos=$(sw_vers -productVersion)" \
            --extra "macos_build=$(sw_vers -buildVersion)" \
            --extra "arch=$(uname -m)" \
            --extra "pool=${{ contains(runner.name, '-glaeda') && 'owned' || startsWith(runner.name, 'blacksmith-') && 'blacksmith' || runner.environment == 'github-hosted' && 'hosted' || runner.name }}" \
            --extra "image=${ImageOS:-}${ImageVersion:+-$ImageVersion}" \
            --extra "mini=${{ startsWith(env.CMUX_NEXT_RUNNER, 'glaeda-') }}" \
            --extra "xcode_app=$CMUX_CI_XCODE_APP" >> "$GITHUB_OUTPUT"

      - name: Look for a pass on the same inputs
        id: reuse
        if: ${{ steps.reuse-key.outputs.key != '' && inputs.no_reuse != true }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          KEY: ${{ steps.reuse-key.outputs.key }}
        run: python3 -I scripts/ci/job_reuse.py lookup --key "$KEY" >> "$GITHUB_OUTPUT"

      - name: Reuse that pass
        if: ${{ steps.reuse.outputs.hit == 'true' }}
        env:
          KEY: ${{ steps.reuse-key.outputs.key }}
          RUN_URL: ${{ steps.reuse.outputs.run_url }}
          SHA: ${{ steps.reuse.outputs.sha }}
        run: |
          echo "::notice title=cmux-next Release compile (Xcode 26) reused::$RUN_URL passed on the same inputs (${SHA:0:12})"
          echo "Reused $RUN_URL: it passed on \`${SHA:0:12}\` with the same inputs (\`$KEY\`)." >> "$GITHUB_STEP_SUMMARY"

      - name: Release compile
        if: ${{ steps.reuse.outputs.hit != 'true' }}
        env:
          CMUX_BUILD_METRICS_DIR: ${{ runner.temp }}/cmux-next-build-metrics/release
          CMUX_BUILD_METRICS_OUTPUT: ${{ runner.temp }}/cmux-next-build-metrics/release/metrics.json
          CMUX_BUILD_METRICS_SUMMARY: ${{ runner.temp }}/cmux-next-build-metrics/release/summary.md
        run: |
          derived_data="$(scripts/cmux-next/release-derived-data-path.sh release-compile Release)"
          scripts/cmux-next/check-release-compile.sh "$derived_data"

      # Early advisory for a newly bundled binary. The signed nightly check
      # remains authoritative, but this names an unmapped file during review.
      - name: Warn on missing Release bundle notices
        if: ${{ always() && steps.reuse.outputs.hit != 'true' }}
        continue-on-error: true
        run: |
          set -uo pipefail
          derived_data="$(scripts/cmux-next/release-derived-data-path.sh release-compile Release)"
          app="$(find "$derived_data/Build/Products/Release" -maxdepth 2 -type d -name '*.app' -print -quit 2>/dev/null || true)"
          if [[ -z "$app" ]]; then
            echo "::warning title=Release bundle notices::no Release .app product was found for the advisory notice scan"
            exit 0
          fi
          if ! scripts/verify-app-bundle-licenses.sh "$app"; then
            echo "::warning title=Release bundle notices::the advisory scan found a missing or unmapped bundled binary; the signed nightly check remains required"
          fi

      - name: Upload Release compile timing
        if: ${{ always() && steps.reuse.outputs.hit != 'true' }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-next-release-compile-timing-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cmux-next-build-metrics/release
          if-no-files-found: ignore
          retention-days: 3

      # On a mini, the CEF glue (CEF's C++ wrapper, the CEFShim dylib and the
      # helper binary) is also compiled against the pinned Chromium engine
      # (scripts/cmux-next/cef-manifest.json), the way the app's Embed CEF
      # phase builds it, so a shim or manifest change the engine does not
      # accept fails here and not in the nightly. ensure-cef.sh fills the
      # mini's kept host cache (scripts/cmux-next/cef-cache-root.sh) from the private R2
      # bucket with the read-only key, which only this step receives and only
      # in same-repository runs, as in ci-macos.yml's admission; later runs
      # read the cache. A runner's own ~/.secrets file is never a source.
      # Blacksmith runs skip both steps: they keep no cache, so each run would
      # pay the download and the wrapper compile. So the check is advisory: a
      # re-run (Blacksmith) or a fork pull request does not repeat it.
      - name: Fetch the Chromium engine
        id: cef
        if: ${{ (startsWith(env.CMUX_NEXT_RUNNER, 'glaeda-')) && steps.reuse.outputs.hit != 'true' }}
        env:
          CMUX_CEF_R2_ACCOUNT_ID: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && secrets.CMUX_CEF_R2_ACCOUNT_ID || '' }}
          CMUX_CEF_R2_ACCESS_KEY_ID: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && secrets.CMUX_CEF_R2_ACCESS_KEY_ID || '' }}
          CMUX_CEF_R2_SECRET_ACCESS_KEY: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && secrets.CMUX_CEF_R2_SECRET_ACCESS_KEY || '' }}
          CMUX_CEF_R2_ENV_FILE: /dev/null
        run: |
          set -euo pipefail
          if cef_dir="$(env -u GH_TOKEN -u GITHUB_TOKEN scripts/cmux-next/ensure-cef.sh --optional)" && [[ -n "$cef_dir" ]]; then
            echo "Chromium engine at $cef_dir"
            echo "dir=$cef_dir" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Chromium engine artifact not readable on this runner; skipping the CEF shim compile"
          fi

      - name: Compile the CEF shim against the pinned engine
        if: ${{ (steps.cef.outputs.dir != '') && steps.reuse.outputs.hit != 'true' }}
        env:
          CEF_DIR: ${{ steps.cef.outputs.dir }}
        run: scripts/cmux-next/build-cef-shim.sh "$CEF_DIR" "$(scripts/cmux-next/cef-cache-root.sh)/shim"

      # The pinned engine's Objective-C selectors for NSApp and its delegate
      # against the reviewed contract (scripts/cmux-next/chromium-objc-contract.json):
      # an engine that can send cmux an unreviewed selector fails here, before
      # it ships ("unrecognized selector", 2026-10-20).
      - name: Chromium Objective-C contract against the pinned engine
        if: ${{ (steps.cef.outputs.dir != '') && steps.reuse.outputs.hit != 'true' }}
        env:
          CEF_DIR: ${{ steps.cef.outputs.dir }}
        run: python3 -I scripts/cmux-next/check-cef-objc-contract.py --framework "$CEF_DIR/Chromium Embedded Framework.framework"
      # A pass records itself for the next run on the same inputs: an artifact named after
      # the key, which every pull request and the base can list (scripts/ci/job_reuse.py
      # takes only passes of this repository's own runs). Never from a fork pull request.
      # An uncached (no_reuse) run records too. On a mini, only a run whose CEF shim compile
      # and Objective-C contract check ran records: a pass that skipped them does not stand
      # for a run that would have checked them.
      # A rerun of only this gate does not rerun a downstream job that was
      # skipped in the original attempt. Request here as well as in the small
      # downstream helper so a newly green rerun always reaches main.
      - name: Request nightly-next promotion after this gate
        if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/feat-cmux-next' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: scripts/cmux-next/request-nightly-next.sh --sha "$SHA" --repo "$GITHUB_REPOSITORY" --release-compile-green

      - name: Record this pass for the same inputs
        if: ${{ success() && steps.reuse-key.outputs.key != '' && steps.reuse.outputs.hit != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (!startsWith(env.CMUX_NEXT_RUNNER, 'glaeda-') || steps.cef.outputs.dir != '') }}
        run: |
          mkdir -p "$RUNNER_TEMP/ci-job-pass"
          printf '%s\n' "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA" > "$RUNNER_TEMP/ci-job-pass/pass.txt"

      - name: Save the pass
        if: ${{ success() && steps.reuse-key.outputs.key != '' && steps.reuse.outputs.hit != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (!startsWith(env.CMUX_NEXT_RUNNER, 'glaeda-') || steps.cef.outputs.dir != '') }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.reuse-key.outputs.key }}
          path: ${{ runner.temp }}/ci-job-pass
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  # Caches the Swift exports of a green feat-cmux-next push under their source
  # key (scripts/cmux-next/swift-exports-key.py), so a job that only reads them
  # (the web bundles read the settings schema) can restore them with
  # swift-exports-cache.sh install instead of a Mac build (cx-vn5). A push runs
  # every tier, so on success the committed exports are the ones the Swift
  # tests checked.
  swift-exports-cache:
    needs: [path_route, checks, generated-files, swift-test, daemon-test]
    # generated-files skips a push whose generated files daemon-test checks (CMUX_NEXT_FOLD_GENERATED).
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/feat-cmux-next' && needs.checks.result == 'success' && (needs.generated-files.result == 'success' || needs.generated-files.result == 'skipped' && needs.path_route.outputs.generated == 'true') && needs.swift-test.result == 'success' && needs.daemon-test.result == 'success' }}
    name: cmux-next Swift exports cache
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || 'blacksmith-2vcpu-ubuntu-2404' }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Source key of the Swift exports
        id: key
        run: echo "key=$(python3 scripts/cmux-next/swift-exports-key.py . --source)" >> "$GITHUB_OUTPUT"

      - name: Look up the cache entry
        id: lookup
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: swift-exports-out
          key: cmux-next-swift-exports-v1-${{ steps.key.outputs.key }}
          lookup-only: true

      - name: Pack the Swift exports
        if: steps.lookup.outputs.cache-hit != 'true'
        run: scripts/cmux-next/swift-exports-cache.sh pack swift-exports-out

      - name: Save the Swift exports under their source key
        if: steps.lookup.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: swift-exports-out
          key: cmux-next-swift-exports-v1-${{ steps.key.outputs.key }}

  # A green Release compile on a feat-cmux-next push asks main's nightly.yml to
  # promote this commit to the protected `nightly-next` branch. The fast-check gate
  # requests immediately; the Mac job below requests only when it had no
  # verdict. Main's promote job refuses a head whose push run has no successful
  # Release compile, so each request waits for its own gate and for nothing else.
  # Every green head is promoted, with no debounce: nightly.yml's concurrency
  # group lets the running nightly-next build finish and replaces only the
  # pending one, so the feed rolls forward to the newest green head without
  # dropping the last one. Only main's job, in the `release` environment,
  # holds the release App key and checks this push run's Release compile; this
  # job only needs actions: write to request it.
  # The request also waits for this commit's cmux-tui tree: the nightly builds
  # the tip with the tip's own nightly.yml and daemon only when that tree is
  # published (a tip with a building tree failed runs 37767816879 and
  # 37769010617). When the tree publishes after this job,
  # cmux-tui-artifacts.yml's request-nightly-next asks instead
  # (scripts/cmux-next/request-nightly-next.sh, tested by
  # scripts/cmux-next/tests/request-nightly-next.test.sh).
  request-nightly-next-fast:
    needs: [release-compile-fast, release-compile-fast-admission]
    if: github.event_name == 'push' && github.ref == 'refs/heads/feat-cmux-next' && needs.release-compile-fast.result == 'success' && needs.release-compile-fast.outputs.verdict == 'pass' && needs.release-compile-fast-admission.result == 'success'
    runs-on: ubuntu-latest # github-hosted-required: nightly path never waits on Blacksmith
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Request nightly-next promotion from the fast-check gate
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: scripts/cmux-next/request-nightly-next.sh --sha "$SHA" --repo "$GITHUB_REPOSITORY" --release-compile-green

  request-nightly-next:
    needs: release-compile
    if: github.event_name == 'push' && github.ref == 'refs/heads/feat-cmux-next' && needs.release-compile.result == 'success'
    runs-on: ubuntu-latest # github-hosted-required: nightly path never waits on Blacksmith
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 1

      # A mini reuses its workspace: drop the submodule checkouts a previous
      # job left (scripts/ci/reset-stale-submodules.sh), as on a fresh checkout.
      - name: Drop stale submodule checkouts (self-hosted reused workspace)
        run: scripts/ci/reset-stale-submodules.sh

      - name: Request nightly-next promotion on main
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: scripts/cmux-next/request-nightly-next.sh --sha "$SHA" --repo "$GITHUB_REPOSITORY" --release-compile-green

      # GitHub runs `schedule` only from main's workflow, so this green compile
      # is the periodic tick that publishes an earlier nightly-next build Apple
      # accepted after its run stopped waiting (cx-f58x). It builds nothing and
      # submits nothing (scripts/cmux-next/continue-nightly-next.sh, tested by
      # scripts/cmux-next/tests/continue-nightly-next.test.sh).
      - name: Request a nightly-next continuation for an accepted pending build
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/cmux-next/continue-nightly-next.sh --repo "$GITHUB_REPOSITORY"

  cmux-scheme-compile:
    needs: [path_route, macos-placement, push-head-preflight, dev-daily-tree-wait]
    # This run's own tier on a published tree (path routing's probe), or
    # same-tree mode after the artifacts workflow published it.
    if: ${{ (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci') || github.event.pull_request.head.repo.full_name == github.repository && (github.event.pull_request.author_association == 'MEMBER' || github.event.pull_request.author_association == 'OWNER') && contains(github.event.pull_request.labels.*.name, 'dev-build')) && (!cancelled() && ((inputs.same_tree_sha == '' && needs.path_route.outputs.scheme == 'true' && needs.push-head-preflight.outputs.current == 'true' && (needs.path_route.outputs.tree_state == 'ready' || needs.dev-daily-tree-wait.outputs.tree_state == 'ready')) || (inputs.same_tree_sha != '' && inputs.same_tree_state == 'ready' && contains(inputs.same_tree_tiers, 'scheme')))) }}
    name: ${{ inputs.dev_daily == true && 'cmux NEXT DEV Release compile' || 'cmux app scheme compile (Debug)' }}
    # A push's Mac fallback waits only when the fleet compile check gives no verdict.
    # It is never cancelled once it runs; a newer push is filtered by the head
    # preflight before it can take a runner.
    concurrency:
      group: ${{ github.event_name == 'push' && format('cmux-next-push-{0}-cmux-scheme-compile', github.ref) || format('cmux-next-run-{0}-cmux-scheme-compile', github.run_id) }}
      cancel-in-progress: false
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-6vcpu-macos-26' || (github.run_attempt == 1 || github.run_attempt == 2 && github.triggering_actor == 'github-actions[bot]') && contains(needs.macos-placement.outputs.blacksmith_12_jobs, ' cmux-scheme-compile ') && 'blacksmith-12vcpu-macos-26' || (github.run_attempt == 1 || github.run_attempt == 2 && github.triggering_actor == 'github-actions[bot]') && contains(needs.macos-placement.outputs.blacksmith_6_jobs, ' cmux-scheme-compile ') && 'blacksmith-6vcpu-macos-26' || (github.run_attempt == 1 || github.triggering_actor != 'github-actions[bot]') && needs.macos-placement.outputs.runner || github.repository_owner != 'manaflow-ai' && 'macos-26' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-6vcpu-macos-26' || vars.CI_PR_POOL_OWNED == '1' && contains(fromJSON('["pull_request","push","workflow_dispatch"]'), github.event_name) && (github.run_attempt == 1 || github.triggering_actor != 'github-actions[bot]') && vars.CI_SIDE_LANE_RUNNER || needs.macos-placement.outputs.retry_runner || vars.CI_PR_POOL_OWNED == '1' && contains(fromJSON('["pull_request","push","workflow_dispatch"]'), github.event_name) && (github.run_attempt <= 3 || github.triggering_actor != 'github-actions[bot]') && vars.CI_SIDE_LANE_RUNNER || vars.MACOS_RUNNER_26 || 'blacksmith-6vcpu-macos-26') }}
    # actions: read lets the same-tree cmux-tui wait read the artifacts runs.
    permissions:
      actions: read
      contents: read
      # statuses: write reports a same-tree mode result on the tested commit.
      statuses: write
    # Debug arm64 xcodebuild of the cmux app scheme: the app host and every
    # local package it links (CmuxControlSocket, CmuxCore, ...), which the
    # CmuxNext jobs above never compile. A main merge once left
    # CmuxControlSocket extending deleted types and only fleet dev builds
    # failed. On a mini the DerivedData is kept per runner, so a run compiles
    # what changed; Blacksmith builds it cold. A change inside the CmuxNext
    # package skips it: the Release compile builds CmuxNextApp and all it links.
    timeout-minutes: 60
    # The crash gate step's outcome, for the crash-ends-app job (that job is the red check, so a
    # crash freeze never fails the app-producing job the dogfood and daily publishers read).
    # No perf step runs here (Lawrence 2026-10-23: nothing perf-related blocks or slows a push or a
    # pull request): the launch-time budget and the perf counter gate run in the perf cron,
    # .github/workflows/cmux-next-perf-budgets.yml, on the bench host.
    outputs:
      crash_gate: ${{ steps.crash-gate.outcome }}
    env:
      # This job's label (its runs-on): a glaeda-* label means a mini.
      CMUX_NEXT_RUNNER: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-6vcpu-macos-26' || (github.run_attempt == 1 || github.run_attempt == 2 && github.triggering_actor == 'github-actions[bot]') && contains(needs.macos-placement.outputs.blacksmith_12_jobs, ' cmux-scheme-compile ') && 'blacksmith-12vcpu-macos-26' || (github.run_attempt == 1 || github.run_attempt == 2 && github.triggering_actor == 'github-actions[bot]') && contains(needs.macos-placement.outputs.blacksmith_6_jobs, ' cmux-scheme-compile ') && 'blacksmith-6vcpu-macos-26' || (github.run_attempt == 1 || github.triggering_actor != 'github-actions[bot]') && needs.macos-placement.outputs.runner || github.repository_owner != 'manaflow-ai' && 'macos-26' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-6vcpu-macos-26' || vars.CI_PR_POOL_OWNED == '1' && contains(fromJSON('["pull_request","push","workflow_dispatch"]'), github.event_name) && (github.run_attempt == 1 || github.triggering_actor != 'github-actions[bot]') && vars.CI_SIDE_LANE_RUNNER || needs.macos-placement.outputs.retry_runner || vars.CI_PR_POOL_OWNED == '1' && contains(fromJSON('["pull_request","push","workflow_dispatch"]'), github.event_name) && (github.run_attempt <= 3 || github.triggering_actor != 'github-actions[bot]') && vars.CI_SIDE_LANE_RUNNER || vars.MACOS_RUNNER_26 || 'blacksmith-6vcpu-macos-26') }}
      CMUX_CI_XCODE_APP: ${{ vars.CMUX_CI_XCODE_APP_MACOS_26 }}
      CMUX_CI_REQUIRED_MACOS_SDK_MAJOR: "26"
      # A pull request that changes no cmux-tui path runs on the newest
      # published tree when its own is not ready (path routing's probe).
      CMUX_TUI_TREE_KEY: ${{ inputs.same_tree_sha == '' && (needs.dev-daily-tree-wait.outputs.tree_fetch_key || needs.path_route.outputs.tree_fetch_key) || '' }}
    steps:
      # A dev_daily run (direct or same-tree) builds only the SHA the
      # dispatcher asked for. A merge that moved feat-cmux-next first must
      # fail here: an empty success would read as that tip being published.
      - name: Require the requested DEV daily commit
        if: inputs.dev_daily == true
        env:
          DEV_DAILY_SHA: ${{ inputs.dev_daily_sha }}
          SAME_TREE_SHA: ${{ inputs.same_tree_sha }}
        run: |
          if [[ -n "$SAME_TREE_SHA" ]]; then
            [[ "$DEV_DAILY_SHA" == "$SAME_TREE_SHA" ]] || {
              echo "error: deferred dev_daily asked for $DEV_DAILY_SHA but same-tree mode is $SAME_TREE_SHA" >&2
              exit 1
            }
          else
            [[ "$DEV_DAILY_SHA" == "$GITHUB_SHA" ]] || {
              echo "error: dev_daily asked for $DEV_DAILY_SHA but this run checked out $GITHUB_SHA; the next dispatcher tick takes the new tip" >&2
              exit 1
            }
          fi
      - name: Clear stale git locks (self-hosted reused workspace)
        shell: bash
        run: |
          ws="${GITHUB_WORKSPACE:-$PWD}"
          rm -f "$ws/.git/index.lock" 2>/dev/null || true

      - name: Checkout
        id: checkout
        continue-on-error: true
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Same-tree mode tests the commit the tree was probed for.
          ref: ${{ inputs.same_tree_sha || '' }}
          persist-credentials: false
          submodules: false

      # A blob-filtered checkout by another job leaves a partial clone in this
      # reused workspace, and a missing blob is fetched from GitHub mid-step,
      # unretried. Retry once from a fresh repository; a second failure fails.
      - name: Discard the workspace repository after a failed checkout
        if: steps.checkout.outcome == 'failure'
        run: rm -rf "$GITHUB_WORKSPACE/.git"

      - name: Retry checkout after transient network failure
        if: steps.checkout.outcome == 'failure'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Same-tree mode tests the commit the tree was probed for.
          ref: ${{ inputs.same_tree_sha || '' }}
          persist-credentials: false
          submodules: false

      # A mini reuses its workspace: drop the submodule checkouts a previous
      # job left (scripts/ci/reset-stale-submodules.sh), as on a fresh checkout.
      - name: Drop stale submodule checkouts (self-hosted reused workspace)
        run: scripts/ci/reset-stale-submodules.sh

      - name: Select Xcode
        run: ./scripts/select-ci-xcode.sh

      # The DEV Release app is reused, not recompiled, when nothing it is built from changed
      # (scripts/ci/dev_release_product_reuse.py): the key is job_input_fingerprint.py
      # dev-release-product (the tree minus docs, tests and other products, this workflow, Xcode,
      # the SDK and the cmux-tui tree), never a branch or commit. A hit downloads the app another
      # feat-cmux-next push or DEV run recorded under it and checks its SHA-256; a dev_daily run then
      # skips the steps below that only feed xcodebuild. A miss, or any error, compiles as before.
      # The key is the tree this job checked out and builds (the pushed or dispatched commit's).
      # Signing and publishing still run at this exact SHA (cmux-next-dev-daily.yml). Only this
      # workflow on feat-cmux-next reuses: never nightly or stable builds (hq#3967).
      - name: Look up the DEV Release app compiled on the same inputs
        id: dev-product
        if: (github.event_name == 'push' && github.ref == 'refs/heads/feat-cmux-next' && needs.push-head-preflight.outputs.current == 'true') || (github.event_name == 'workflow_dispatch' && inputs.dev_daily == true && github.ref == 'refs/heads/feat-cmux-next' && ((inputs.same_tree_sha == '' && inputs.dev_daily_sha == github.sha && needs.push-head-preflight.outputs.current == 'true') || (inputs.same_tree_sha != '' && inputs.dev_daily_sha == inputs.same_tree_sha && inputs.same_tree_state == 'ready')))
        continue-on-error: true
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          # format(): an unset variable is null, and null == '0' is true (both coerce to the number 0).
          SKIP_REASON: ${{ inputs.no_reuse == true && 'no_reuse dispatch' || format('{0}', vars.CI_NEXT_DEV_PRODUCT_REUSE) == '0' && 'vars.CI_NEXT_DEV_PRODUCT_REUSE is 0' || '' }}
          # A repository variable the compile step reads changes the product but not this file: key it.
          SWIFT_COMPILATION_MODE: ${{ vars.CMUX_NEXT_DEV_SWIFT_COMPILATION_MODE || 'singlefile' }}
        run: |
          set -euo pipefail
          key="$(python3 -I scripts/ci/job_input_fingerprint.py dev-release-product \
            --extra "xcode=$(xcodebuild -version | tr '\n' ' ')" \
            --extra "sdk=$(xcrun --sdk macosx --show-sdk-version) $(xcrun --sdk macosx --show-sdk-build-version)" \
            --extra "arch=$(uname -m)" \
            --extra "recipe=$(python3 -I -c 'import sys; sys.path.insert(0, "scripts/ci"); import dev_release_product_reuse as r; print(r.RECIPE)') swift_mode=$SWIFT_COMPILATION_MODE" \
            --extra "tui_tree=${CMUX_TUI_TREE_KEY:-own}" | sed -n 's/^fingerprint=//p')"
          echo "key=$key" >> "$GITHUB_OUTPUT"
          python3 -I scripts/ci/dev_release_product_reuse.py lookup --key "$key" --skip "$SKIP_REASON" \
            --out "$RUNNER_TEMP/cmux-next-dev-product" --timeout 180 >> "$GITHUB_OUTPUT"

      # The Bundle cmux-tui phase bundles this commit's same-tree cmux-tui
      # and runs check-daemon-capabilities.sh on it (Debug builds).
      - name: Fetch the same-tree cmux-tui
        if: ${{ inputs.dev_daily != true || steps.dev-product.outputs.hit != 'true' }}
        timeout-minutes: 50
        env:
          # See the package test job above. The helper compares the merge tree
          # with its first parent and waits for the base artifact when equal.
          # Published before this job starts (probe or same-tree mode): a download.
          CMUX_TUI_TREE_WAIT_SECONDS: "120"
          # Push and dispatch runs fail fast when the artifacts runs for this
          # commit were cancelled or superseded (pin-cmux-tui.sh --help).
          CMUX_TUI_TREE_PUBLISHER_SHA: ${{ inputs.same_tree_sha == '' && github.event_name != 'pull_request' && github.sha || '' }}
          GH_TOKEN: ${{ github.token }}
        run: scripts/cmux-next/pin-cmux-tui.sh fetch

      - name: Install Rust (diff sidecar)
        if: ${{ inputs.dev_daily != true || steps.dev-product.outputs.hit != 'true' }}
        run: ./scripts/install-rust-ci.sh

      # The same-tree fetch above also brought this tree's acpmux (built once
      # with the cmux-tui binaries, cmuxterm-hq#1279). A tree published before
      # the tree build carried acpmux has none, and this compiles it.
      - name: Build in-tree acpmux for the app bundle
        if: ${{ inputs.dev_daily != true || steps.dev-product.outputs.hit != 'true' }}
        env:
          CMUX_NEXT_ACPMUX_ARCHS: arm64
        run: |
          set -euo pipefail
          acpmux_bin="$(scripts/cmux-next/pin-cmux-tui.sh acpmux-path)"
          # A pull request on a fallback tree (CMUX_TUI_TREE_KEY, an older
          # published tree) compiles this checkout's acpmux instead.
          if [[ -x "$acpmux_bin" && ( -z "${CMUX_TUI_TREE_KEY:-}" ||
                "$CMUX_TUI_TREE_KEY" == "$(scripts/cmux-next/pin-cmux-tui.sh key --rev HEAD)" ) ]]; then
            printf 'commit=%s\nsource=same-tree\n' "$(git rev-parse HEAD)" > "$acpmux_bin.ref"
            echo "same-tree acpmux: $acpmux_bin"
          else
            acpmux_bin="$RUNNER_TEMP/cmux-next-acpmux/acpmux"
            scripts/cmux-next/build-acpmux.sh --output "$acpmux_bin"
          fi
          echo "CMUX_NEXT_ACPMUX_BIN=$acpmux_bin" >> "$GITHUB_ENV"

      # The app's web bundles are build output (cx-vn5); the "Verify web
      # bundles" phase refuses an app built without them, and this job's app is
      # the dogfood artifact.
      - name: Setup Bun
        if: ${{ inputs.dev_daily != true || steps.dev-product.outputs.hit != 'true' }}
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"

      # The minis share ~/.bun with workflows that install another bun; this
      # job runs on its own copy of the pinned one (private-bun.sh).
      - name: Give this job its own bun
        if: ${{ inputs.dev_daily != true || steps.dev-product.outputs.hit != 'true' }}
        run: scripts/cmux-next/private-bun.sh

      # The webviews app's `vp build` must run on node: on bun it emits
      # different bytes (build-web-bundles.sh).
      - name: Setup Node
        if: ${{ inputs.dev_daily != true || steps.dev-product.outputs.hit != 'true' }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.22.1"

      - name: Build the web bundles
        if: ${{ inputs.dev_daily != true || steps.dev-product.outputs.hit != 'true' }}
        run: scripts/cmux-next/build-web-bundles.sh

      - name: Compile the cmux scheme
        if: inputs.dev_daily != true
        env:
          CMUX_BUILD_METRICS_DIR: ${{ runner.temp }}/cmux-next-build-metrics/scheme
          CMUX_BUILD_METRICS_OUTPUT: ${{ runner.temp }}/cmux-next-build-metrics/scheme/metrics.json
          CMUX_BUILD_METRICS_SUMMARY: ${{ runner.temp }}/cmux-next-build-metrics/scheme/summary.md
        run: |
          set -euo pipefail
          if [[ "$CMUX_NEXT_RUNNER" == glaeda-* ]]; then
            derived_data="$HOME/Library/Caches/cmux-next-ci/cmux-scheme/${RUNNER_NAME:-runner}"
            # Nothing on the mini reclaims this cache (glaeda-disk keeps it), so cap
            # it: a cold build leaves about 5 GiB; past 12 GiB start over.
            if [[ -d "$derived_data" ]] && (( $(du -sg "$derived_data" | cut -f1) > 12 )); then
              echo "kept DerivedData over 12 GiB; building cold"
              rm -rf -- "$derived_data"
            fi
          else
            derived_data="$RUNNER_TEMP/cmux-scheme-compile"
          fi
          scripts/cmux-next/check-cmux-scheme-compile.sh "$derived_data"
          echo "CMUX_NEXT_DERIVED_DATA=$derived_data" >> "$GITHUB_ENV"
          # The app links C++, iroh-ffi and CCmuxAppFFI; compact unwind holds
          # three personality routines (decision 2026-10-05).
          scripts/cmux-next/check-app-personalities.sh "$(find "$derived_data/Build/Products/Debug" -maxdepth 1 -name 'cmux DEV*.app' -print -quit)"

      - name: Upload Debug scheme timing
        if: ${{ always() && inputs.dev_daily != true }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-next-scheme-compile-timing-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cmux-next-build-metrics/scheme
          if-no-files-found: ignore
          retention-days: 3

      # A current feat-cmux-next push also produces the Release app consumed by
      # cmux-next-dev-daily.yml. Keep this separate from the Debug dogfood
      # product: the daily channel has its own stable identity and must never
      # replace the existing PR artifact.
      - name: Compile the cmux NEXT DEV Release app
        id: compile-cmux-next-dev-release
        if: (github.event_name == 'push' && github.ref == 'refs/heads/feat-cmux-next' && needs.push-head-preflight.outputs.current == 'true') || (github.event_name == 'workflow_dispatch' && inputs.dev_daily == true && github.ref == 'refs/heads/feat-cmux-next' && ((inputs.same_tree_sha == '' && inputs.dev_daily_sha == github.sha && needs.push-head-preflight.outputs.current == 'true') || (inputs.same_tree_sha != '' && inputs.dev_daily_sha == inputs.same_tree_sha && inputs.same_tree_state == 'ready')))
        env:
          CMUX_NEXT_CONFIGURATION: Release
          CMUX_NEXT_PRODUCT_NAME: cmux NEXT DEV
          CMUX_NEXT_BUNDLE_ID: com.cmuxterm.app.debug.next
          CMUX_NEXT_CODE_SIGN_ENTITLEMENTS: cmux.next-dev.entitlements
          CMUX_NEXT_AUTH_CALLBACK_SCHEME: cmux-next-dev
          CMUX_NEXT_TUI_MODE: tree
          # Apple notarizes cmux-next only with the browser-data import compiled
          # out (cx-f58x; nightly.yml NIGHTLY_NEXT_BROWSER_DATA_IMPORT), and the
          # DEV app is the tip app (Leo, 2026-10-24). This step only compiles it
          # out: the tip job in cmux-next-dev-daily.yml proves it before it
          # notarizes, so a proof failure never holds the DEV zip (#25050).
          CMUX_NEXT_BROWSER_DATA_IMPORT: compiled-out
          # The DEV app's warm state is the host's own content-addressed Xcode
          # compilation cache (no kept build products, no remote store:
          # scripts/cmux-next/lib/compilation-cache.sh), built per file with -O
          # (singlefile, Xcode's "Incremental") so a one-file change replays
          # every other file. Repo variables switch each back:
          # CMUX_NEXT_DEV_COMPILATION_CACHE=0, CMUX_NEXT_DEV_SWIFT_COMPILATION_MODE=wholemodule.
          CMUX_NEXT_COMPILATION_CACHE: ${{ vars.CMUX_NEXT_DEV_COMPILATION_CACHE || '1' }}
          CMUX_NEXT_SWIFT_COMPILATION_MODE: ${{ vars.CMUX_NEXT_DEV_SWIFT_COMPILATION_MODE || 'singlefile' }}
          CMUX_BUILD_METRICS_DIR: ${{ runner.temp }}/cmux-next-build-metrics/dev-daily
          CMUX_BUILD_METRICS_OUTPUT: ${{ runner.temp }}/cmux-next-build-metrics/dev-daily/metrics.json
          CMUX_BUILD_METRICS_SUMMARY: ${{ runner.temp }}/cmux-next-build-metrics/dev-daily/summary.md
          DEV_DAILY_SHA: ${{ inputs.dev_daily_sha || github.sha }}
          REUSED_ARCHIVE: ${{ steps.dev-product.outputs.hit == 'true' && steps.dev-product.outputs.archive || '' }}
        run: |
          set -euo pipefail
          if [[ -n "$REUSED_ARCHIVE" && -f "$REUSED_ARCHIVE" ]]; then
            # The lookup checked these bytes against their record; the run that compiled them ran the
            # checks below on them.
            archive="$RUNNER_TEMP/cmux-next-dev-daily-unsigned-${DEV_DAILY_SHA}.app.zip"
            mv -f "$REUSED_ARCHIVE" "$archive"
            echo "archive=$archive" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Only a mini keeps the cache between jobs; a fresh VM would pay to fill it.
          [[ "$CMUX_NEXT_RUNNER" == glaeda-* ]] || export CMUX_NEXT_COMPILATION_CACHE=0
          # With the cache on, a mini builds from one fixed tree and DerivedData per host under a
          # host lock, so the cache's path-holding keys match across its runner instances; a busy
          # lock or a failed setup builds per runner at once (compile-dev-release.sh).
          archive="$RUNNER_TEMP/cmux-next-dev-daily-unsigned-${DEV_DAILY_SHA}.app.zip"
          scripts/cmux-next/compile-dev-release.sh "$archive"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Upload DEV daily compile timing
        if: ${{ always() && steps.compile-cmux-next-dev-release.outcome != 'skipped' }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-next-dev-daily-compile-timing-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cmux-next-build-metrics/dev-daily
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload the cmux NEXT DEV Release app
        if: steps.compile-cmux-next-dev-release.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-next-dev-daily-unsigned-${{ inputs.dev_daily_sha || github.sha }}
          path: ${{ steps.compile-cmux-next-dev-release.outputs.archive }}
          if-no-files-found: error
          retention-days: 2
          compression-level: 0

      # The record a later run on the same inputs looks up (dev_release_product_reuse.py lookup):
      # this run's product artifact, its SHA-256 and where the bytes were compiled (provenance).
      - name: Record the DEV Release app under its input key
        id: dev-product-record
        if: success() && steps.compile-cmux-next-dev-release.outcome == 'success' && steps.dev-product.outputs.key != ''
        continue-on-error: true
        env:
          KEY: ${{ steps.dev-product.outputs.key }}
          ARCHIVE: ${{ steps.compile-cmux-next-dev-release.outputs.archive }}
          SHA: ${{ inputs.dev_daily_sha || github.sha }}
          REUSED_FROM_RUN: ${{ steps.dev-product.outputs.hit == 'true' && steps.dev-product.outputs.source_run_id || '' }}
          REUSED_FROM_SHA: ${{ steps.dev-product.outputs.hit == 'true' && steps.dev-product.outputs.source_sha || '' }}
          COMPILED_RUN: ${{ steps.dev-product.outputs.hit == 'true' && steps.dev-product.outputs.compiled_run_id || '' }}
        run: |
          python3 -I scripts/ci/dev_release_product_reuse.py record --key "$KEY" --sha "$SHA" --archive "$ARCHIVE" \
            --reused-from-run "$REUSED_FROM_RUN" --reused-from-sha "$REUSED_FROM_SHA" --compiled-run "$COMPILED_RUN" \
            --out "$RUNNER_TEMP/cmux-next-dev-product-record/manifest.json" >> "$GITHUB_OUTPUT"

      - name: Upload the DEV Release app record
        if: steps.dev-product-record.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-next-dev-release-product-${{ steps.dev-product.outputs.key }}
          path: ${{ runner.temp }}/cmux-next-dev-product-record/manifest.json
          if-no-files-found: error
          # As long as the product artifact it names.
          retention-days: 2
          overwrite: true

      # A crash ends the app, never freezes it (2026-10-20 NIGHTLY freezes): with
      # Sentry on, an uncaught exception must end the process within 8 s and a
      # crash path that blocks must end within the crash deadline. The step
      # does not fail this job; the crash-ends-app job reports it.
      - name: Crash ends the app
        id: crash-gate
        if: ${{ !cancelled() && inputs.dev_daily != true && env.CMUX_NEXT_DERIVED_DATA != '' }}
        continue-on-error: true
        timeout-minutes: 10
        run: |
          set -euo pipefail
          built="$(find "$CMUX_NEXT_DERIVED_DATA/Build/Products/Debug" -maxdepth 1 -type d -name 'cmux DEV*.app' -print -quit)"
          [[ -d "$built" ]] || { echo "::error::crash gate: no cmux DEV app in $CMUX_NEXT_DERIVED_DATA (not a crash freeze)"; exit 1; }
          tag="ci-crash-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          app="$RUNNER_TEMP/crash-gate/cmux DEV ${tag}.app"
          mkdir -p "$RUNNER_TEMP/crash-gate/out"
          /bin/cp -R "$built" "$app"
          trap 'python3 scripts/cmux-next/tag_teardown.py "$app" || true; rm -rf "$HOME/Library/Application Support/cmux/tags/$tag" "$HOME/Library/Application Support/cmux-next/com.cmuxterm.app.debug.${tag//-/.}" "$HOME/Library/Caches/SentryCrash/cmux DEV $tag" "$HOME/.acpmux/builds/com.cmuxterm.app.debug--$tag" "$HOME/.cmux/mux/tags/$tag" "$app"' EXIT
          python3 scripts/cmux-next/crash-ends-app-gate.py --app "$app" --out "$RUNNER_TEMP/crash-gate/out"

      - name: Upload the crash gate samples
        if: ${{ always() && steps.crash-gate.outcome == 'failure' }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-next-crash-gate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/crash-gate/out
          if-no-files-found: ignore
          retention-days: 3

      # The default-branch publisher consumes the exact app produced by this
      # job.  Keep the upload limited to same-repository member PRs carrying
      # the existing dev-build label; the publisher repeats this trust check
      # before it writes the immutable R2 object or comments on the PR.
      - name: Package the trusted cmux-next dogfood artifact
        id: dogfood-artifact
        # Keep packaging independent of any earlier step's failure. The
        # app-producing compile is the admission boundary; unrelated checks
        # and tests are separate jobs and must not suppress this artifact.
        if: ${{ always() && ((github.event_name == 'push' && github.ref == 'refs/heads/feat-cmux-next') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && (github.event.pull_request.author_association == 'MEMBER' || github.event.pull_request.author_association == 'OWNER') && contains(github.event.pull_request.labels.*.name, 'dev-build'))) }}
        env:
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          app="$(find "$CMUX_NEXT_DERIVED_DATA/Build/Products/Debug" -maxdepth 1 -type d -name 'cmux DEV*.app' -print -quit)"
          test -d "$app"
          if [[ -n "$PR" ]]; then
            artifact_name="dogfood-app-${PR}-${HEAD_SHA}"
          else
            artifact_name="cmux-next-base-app-${HEAD_SHA}"
          fi
          archive="$RUNNER_TEMP/${artifact_name}.app.zip"
          /usr/bin/ditto -c -k --keepParent "$app" "$archive"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Upload the exact cmux-next app for the trusted publisher
        if: ${{ always() && steps.dogfood-artifact.outputs.archive != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.dogfood-artifact.outputs.artifact_name }}
          path: ${{ steps.dogfood-artifact.outputs.archive }}
          if-no-files-found: error
          retention-days: 2
          compression-level: 0

  # The crash gate runs in cmux-scheme-compile on the app that job built. This
  # job is its check: red when a crash froze the app instead of ending it.
  crash-ends-app:
    needs: [cmux-scheme-compile]
    if: ${{ !cancelled() && inputs.dev_daily != true && needs.cmux-scheme-compile.result != 'skipped' }}
    name: cmux-next crash ends the app
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || 'blacksmith-2vcpu-ubuntu-2404' }}
    timeout-minutes: 3
    permissions: {}
    steps:
      - name: Read the crash gate result
        env:
          OUTCOME: ${{ needs.cmux-scheme-compile.outputs.crash_gate }}
          COMPILE: ${{ needs.cmux-scheme-compile.result }}
        run: |
          case "$OUTCOME" in
            success) echo "crash gate: every deliberate crash ended the app in time" ;;
            failure) echo "::error::crash gate: red; the cause (a crash froze the app, or no app to test) is in the cmux-scheme-compile log, step Crash ends the app"; exit 1 ;;
            *)
              if [[ "$COMPILE" == success ]]; then
                echo "::error::crash gate: the scheme compile succeeded but the gate step did not run (outcome '${OUTCOME:-none}')"; exit 1
              fi
              echo "crash gate: not run, the scheme compile ended $COMPILE before it" ;;
          esac

  # The post-merge backstop: every feat-cmux-next push runs its push tiers (a
  # superseded push skips its Mac jobs, so a burst of merges is checked once,
  # at its newest commit). When a check job fails, this comments on each pull
  # request merged since that job last passed on a push, so the owning lane
  # fixes forward (scripts/ci/cmux_next_push_attribution.py). It reads the
  # Actions and pulls APIs; no branch code runs.

      # Same-tree mode: the result goes on the commit the run was for (a push,
      # or the pull request head), whichever ref the dispatch ran on.
      - name: Report the same-tree result on the tested commit
        if: ${{ always() && inputs.same_tree_status_sha != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS_SHA: ${{ inputs.same_tree_status_sha }}
          JOB_STATUS: ${{ job.status }}
          CONTEXT: ${{ inputs.dev_daily == true && 'cmux NEXT DEV Release compile (same-tree)' || 'cmux app scheme compile (Debug) (same-tree)' }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          [[ "$STATUS_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::warning::not a commit: $STATUS_SHA"; exit 0; }
          case "$JOB_STATUS" in success) state=success ;; cancelled) state=error ;; *) state=failure ;; esac
          body="$(python3 -c 'import json,sys; print(json.dumps({"state": sys.argv[1], "context": sys.argv[2], "target_url": sys.argv[3], "description": "same-tree cmux-tui run: " + sys.argv[4]}))' "$state" "$CONTEXT" "$TARGET_URL" "$JOB_STATUS")"
          curl -fsS -o /dev/null -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$STATUS_SHA" -d "$body" \
            || echo "::warning::could not post the $CONTEXT status"

  # GITHUB_TOKEN workflow_dispatch does not emit workflow_run, so hand the
  # exact successful DEV artifact to the publisher here instead of waiting for
  # the cron dispatcher. The dispatcher remains the retry/backstop for a lost
  # or failed handoff.
  # !cancelled(): without a status function the implicit success() also reads
  # every job upstream of cmux-scheme-compile, and a DEV run always skips some
  # (dev-daily-tree-wait when the tree was ready), so this job was skipped on
  # every run and the publisher waited for the next cron tick (source run
  # 40124390153, 2026-10-24). The result check below still requires the compile.
  # A same-tree DEV run is handed over only when it ran on the commit it built:
  # the publisher requires the run's head_sha to be the SHA in its name.
  request-cmux-next-dev-publish:
    needs: cmux-scheme-compile
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.dev_daily == true && needs.cmux-scheme-compile.result == 'success' && (inputs.same_tree_sha == '' || inputs.same_tree_sha == github.sha) && github.ref == 'refs/heads/feat-cmux-next' && github.repository == 'manaflow-ai/cmux' }}
    name: Request cmux NEXT DEV publication
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-4vcpu-ubuntu-2404' || vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Record source queue and handoff receipt
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ inputs.dev_daily_sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cmux-next-dev-handoff"
          gh api "repos/$GH_REPO/actions/runs/$RUN_ID/jobs?filter=latest&per_page=100" > "$RUNNER_TEMP/cmux-next-dev-handoff/jobs.json"
          gh api "repos/$GH_REPO/actions/runs/$RUN_ID" > "$RUNNER_TEMP/cmux-next-dev-handoff/run.json"
          python3 - "$RUNNER_TEMP/cmux-next-dev-handoff/jobs.json" "$RUNNER_TEMP/cmux-next-dev-handoff/run.json" "$RUN_ID" "$SOURCE_SHA" "$GITHUB_STEP_SUMMARY" "$RUNNER_TEMP/cmux-next-dev-handoff/receipt.json" <<'PY'
          import datetime as dt, json, pathlib, sys
          jobs = json.loads(pathlib.Path(sys.argv[1]).read_text())["jobs"]
          run = json.loads(pathlib.Path(sys.argv[2]).read_text())
          run_id, source_sha, summary, receipt_path = sys.argv[3:]
          candidates = [j for j in jobs if j.get("name") == "cmux NEXT DEV Release compile"]
          if len(candidates) != 1 or candidates[0].get("conclusion") != "success":
              raise SystemExit(f"DEV Release compile receipt invalid: {candidates}")
          job = candidates[0]
          parse = lambda value: dt.datetime.fromisoformat(value.replace("Z", "+00:00"))
          run_started, compile_started, completed = map(parse, (run["created_at"], job["started_at"], job["completed_at"]))
          receipt = {
              "schema": "cmux-next-dev-handoff-v1", "source_run_id": int(run_id), "source_sha": source_sha,
              "source_run_started_at": run_started.isoformat(), "compile_started_at": compile_started.isoformat(),
              "compile_completed_at": completed.isoformat(), "handoff_requested_at": dt.datetime.now(dt.timezone.utc).isoformat(),
              "queue_ms": max(0, int((compile_started - run_started).total_seconds() * 1000)),
              "compile_ms": max(0, int((completed - compile_started).total_seconds() * 1000)),
              "runner_name": job.get("runner_name"), "runner_labels": job.get("labels", []),
          }
          out = pathlib.Path(receipt_path)
          out.write_text(json.dumps(receipt, indent=2) + "\n")
          pathlib.Path(summary).write_text("## cmux NEXT DEV handoff\n" + "\n".join(f"- {k}: `{receipt[k]}`" for k in ("source_run_id", "source_sha", "queue_ms", "compile_ms", "runner_name")) + "\n")
          print(json.dumps(receipt, sort_keys=True))
          PY
      - name: Upload queue-delay receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-next-dev-handoff-${{ inputs.dev_daily_sha }}
          path: ${{ runner.temp }}/cmux-next-dev-handoff/receipt.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Dispatch the exact source run to the publisher
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          gh workflow run cmux-next-dev-daily.yml --repo "$GH_REPO" --ref main -f "source_run_id=$SOURCE_RUN_ID"
          echo "Requested cmux NEXT DEV publication for source run $SOURCE_RUN_ID"

  # The checks job's red sub-checks join the PR's red-checks line (pr-red-checks-comment.yml), each
  # compared with the base's run: ci.yml and cmux-next-guards.yml call it after their own checks.
  pr-red-checks:
    needs: [checks]
    if: ${{ always() && !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'feat-cmux-next' }}
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: write
    uses: ./.github/workflows/pr-red-checks-comment.yml
    with:
      own_checks_green: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}

  push-attribution:
    needs: [checks, generated-files, swift-canary, swift-test, daemon-test, release-compile, cmux-scheme-compile]
    # Also a same-tree mode run for a feat-cmux-next push: the tree jobs of a
    # push whose tree was published after its run probed it run there.
    if: ${{ failure() && inputs.dev_daily != true && (github.event_name == 'push' || inputs.same_tree_origin == 'push') && github.ref == 'refs/heads/feat-cmux-next' && github.repository == 'manaflow-ai/cmux' }}
    name: cmux-next push attribution
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || 'blacksmith-2vcpu-ubuntu-2404' }} # ephemeral-required: holds a pull-requests write token; ephemeral Blacksmith VM, reads no variable
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          sparse-checkout: scripts/ci

      - name: Comment on the pull requests in the failing range
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.same_tree_sha || github.sha }}
        run: |
          python3 scripts/ci/cmux_next_push_attribution.py --repo "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" --sha "$SHA" --server-url "$GITHUB_SERVER_URL" \
            --events push,workflow_dispatch --summary "$GITHUB_STEP_SUMMARY"
