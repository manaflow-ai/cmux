          set -euo pipefail
          [[ "$STATUS_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::warning::not a commit: $STATUS_SHA"; exit 0; }
          case "$JOB_STATUS" in success) state=success ;; cancelled) state=error ;; *) state=failure ;; esac
          body="$(python3 -c 'import json,sys; print(json.dumps({"state": sys.argv[1], "context": sys.argv[2], "target_url": sys.argv[3], "description": "same-tree cmux-tui run: " + sys.argv[4]}))' "$state" "$CONTEXT" "$TARGET_URL" "$JOB_STATUS")"
          curl -fsS -o /dev/null -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$STATUS_SHA" -d "$body" \
            || echo "::warning::could not post the $CONTEXT status"

  # Why: docs/ci/cmux-next-workflow-notes.md#note-9 (dev-landing-place)
  dev-landing-place:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/feat-cmux-next' && github.repository == 'manaflow-ai/cmux' && format('{0}', vars.CMUX_NEXT_DEV_LANDING_COMPILE) != '0' }}
    name: cmux NEXT DEV landing placement
    environment:
      name: ci-routing-agent
      deployment: false
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.CI_CLOUD_OVERFLOW_SAVED && (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-16vcpu-ubuntu-2404' || fromJSON(vars.RUNNER_POOLS).linux_16) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-4vcpu-ubuntu-2404' || fromJSON(vars.RUNNER_POOLS).linux_4) }}
    timeout-minutes: 8
    permissions:
      actions: read
      contents: read
    outputs:
      runs_on: ${{ steps.place.outputs.runs_on }}
      runner_label: ${{ steps.place.outputs.runner_label }}
      pool: ${{ steps.place.outputs.pool }}
      host: ${{ steps.place.outputs.host }}
      holder_sha: ${{ steps.place.outputs.holder_sha }}
      gap: ${{ steps.place.outputs.gap }}
      tree_state: ${{ steps.tree.outputs.tree_state }}
      tree_fetch_key: ${{ steps.tree.outputs.tree_fetch_key }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Probe the same-tree cmux-tui
        id: tree
        env:
          CMUX_TUI_TREE_PUBLISHER_SHA: ${{ github.sha }}
          CMUX_TUI_TREE_DISPATCH: ""
          CMUX_TUI_TREE_BASE_FALLBACK: "1"
          CMUX_TUI_TREE_PUBLISHER_WAIT_SECONDS: "0"
          CMUX_TUI_TREE_RECHECK_SECONDS: "0"
          GH_TOKEN: ${{ github.token }}
        run: scripts/cmux-next/pin-cmux-tui.sh probe
      - name: Mint the owned-pool read token
        id: route-token
        if: vars.GLAEDA_ROUTE_APP_ID != ''
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.GLAEDA_ROUTE_APP_ID }}
          private-key: ${{ secrets.GLAEDA_ROUTE_APP_KEY }}
          permission-administration: read
          permission-organization-self-hosted-runners: read
          permission-actions: read
      - name: Place the compile
        id: place
        env:
          CI_RUNNER_STATE: ${{ vars.CI_RUNNER_STATE }}
          ROUTE_TOKEN: ${{ steps.route-token.outputs.token }}
          SHA: ${{ github.sha }}
          SIDE_LABEL: ${{ env.CMUX_NEXT_SIDE_ROUTE }}
          WAIT_SECONDS: "120"
          POLL_SECONDS: "30"
          GAP_REPO: ${{ runner.temp }}/dev-landing-history
          GAP_REMOTE: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -uo pipefail
          # Commits only, for the distance to each host's last compile.
          git init -q --bare "$GAP_REPO"
          timeout 60 git -C "$GAP_REPO" fetch -q --no-tags --filter=tree:0 --depth=300 \
            "$GAP_REMOTE" "$SHA" || echo "::warning::no history for the cache distances"
          python3 -I scripts/ci/dev_landing_place.py >> "$GITHUB_OUTPUT"

  dev-landing-compile:
    needs: dev-landing-place
    if: ${{ !cancelled() && needs.dev-landing-place.result == 'success' && needs.dev-landing-place.outputs.tree_state == 'ready' && needs.dev-landing-place.outputs.runs_on != '' }}
    name: cmux NEXT DEV Release compile (landing)
    concurrency:
      group: ${{ format('cmux-next-dev-landing-{0}', github.run_id) }}
      cancel-in-progress: false
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || needs.dev-landing-place.outputs.runs_on != '' && fromJSON(needs.dev-landing-place.outputs.runs_on) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-6vcpu-macos-26' || fromJSON(vars.RUNNER_POOLS).macos_26) }}
    timeout-minutes: 60
    # Why: docs/ci/cmux-next-workflow-notes.md#note-328
    environment: ${{ vars.CMUX_NEXT_DEV_CAS_URL != '' && 'next-dev-cas' || '' }}
    permissions:
      actions: read
      contents: read
    env:
      # Why: docs/ci/cmux-next-workflow-notes.md#note-329
      BASH_ENV: ""
      # Why: docs/ci/cmux-next-workflow-notes.md#note-330
      CMUX_NEXT_RUNNER: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || needs.dev-landing-place.outputs.runner_label || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-6vcpu-macos-26' || fromJSON(vars.RUNNER_POOLS).macos_26) }}
      CMUX_CI_XCODE_APP: ${{ vars.CMUX_CI_XCODE_APP_MACOS_26 }}
      CMUX_CI_REQUIRED_MACOS_SDK_MAJOR: "26"
      CMUX_TUI_TREE_KEY: ${{ needs.dev-landing-place.outputs.tree_fetch_key }}
    steps:
      - name: Clear stale git locks (self-hosted reused workspace)
        run: rm -f "${GITHUB_WORKSPACE:-$PWD}/.git/index.lock" 2>/dev/null || true
      - name: Checkout
        id: checkout
        continue-on-error: true
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: false
      - name: Discard the workspace repository after a failed checkout
        if: steps.checkout.outcome == 'failure'
        run: rm -rf "$GITHUB_WORKSPACE/.git"
      - name: Retry checkout after transient network failure
        if: steps.checkout.outcome == 'failure'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: false
      - name: Drop stale submodule checkouts (self-hosted reused workspace)
        run: scripts/ci/reset-stale-submodules.sh
      - name: Select Xcode
        run: ./scripts/select-ci-xcode.sh
      # Why: docs/ci/cmux-next-workflow-notes.md#note-331
      - name: Look up the DEV Release app compiled on the same inputs
        id: dev-product
        continue-on-error: true
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          SKIP_REASON: ${{ format('{0}', vars.CI_NEXT_DEV_PRODUCT_REUSE) == '0' && 'vars.CI_NEXT_DEV_PRODUCT_REUSE is 0' || '' }}
          SWIFT_COMPILATION_MODE: ${{ vars.CMUX_NEXT_DEV_SWIFT_COMPILATION_MODE || 'auto' }}
        run: |
          set -euo pipefail
          key="$(python3 -I scripts/ci/job_input_fingerprint.py dev-release-product \
            --extra "xcode=$(xcodebuild -version | tr '\n' ' ')" \
            --extra "sdk=$(xcrun --sdk macosx --show-sdk-version) $(xcrun --sdk macosx --show-sdk-build-version)" \
            --extra "arch=$(uname -m)" \
            --extra "recipe=$(python3 -I -c 'import sys; sys.path.insert(0, "scripts/ci"); import dev_release_product_reuse as r; print(r.RECIPE)') swift_mode=$SWIFT_COMPILATION_MODE" \
            --extra "tui_tree=${CMUX_TUI_TREE_KEY:-own}" | sed -n 's/^fingerprint=//p')"
          echo "key=$key" >> "$GITHUB_OUTPUT"
          python3 -I scripts/ci/dev_release_product_reuse.py lookup --key "$key" --skip "$SKIP_REASON" \
            --out "$RUNNER_TEMP/cmux-next-dev-product" --timeout 180 >> "$GITHUB_OUTPUT"
      - name: Fetch the same-tree cmux-tui
        if: steps.dev-product.outputs.hit != 'true'
        timeout-minutes: 10
        env:
          CMUX_TUI_TREE_WAIT_SECONDS: "120"
          CMUX_TUI_TREE_PUBLISHER_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: scripts/cmux-next/pin-cmux-tui.sh fetch
      - name: Install Rust (diff sidecar)
        if: steps.dev-product.outputs.hit != 'true'
        run: ./scripts/install-rust-ci.sh
      - name: Install Go for the embedded tailnet archive
        if: steps.dev-product.outputs.hit != 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: daemon/remote/go.mod
          cache: false

      - name: Build in-tree acpmux for the app bundle
        if: steps.dev-product.outputs.hit != 'true'
        env:
          CMUX_NEXT_ACPMUX_ARCHS: arm64
        run: |
          set -euo pipefail
          acpmux_bin="$(scripts/cmux-next/pin-cmux-tui.sh acpmux-path)"
          if [[ -x "$acpmux_bin" && ( -z "${CMUX_TUI_TREE_KEY:-}" ||
                "$CMUX_TUI_TREE_KEY" == "$(scripts/cmux-next/pin-cmux-tui.sh key --rev HEAD)" ) ]]; then
            printf 'commit=%s\nsource=same-tree\n' "$(git rev-parse HEAD)" > "$acpmux_bin.ref"
          else
            acpmux_bin="$RUNNER_TEMP/cmux-next-acpmux/acpmux"
            scripts/cmux-next/build-acpmux.sh --output "$acpmux_bin"
          fi
          echo "CMUX_NEXT_ACPMUX_BIN=$acpmux_bin" >> "$GITHUB_ENV"
      - name: Setup Bun
        if: steps.dev-product.outputs.hit != 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
      - name: Give this job its own bun
        if: steps.dev-product.outputs.hit != 'true'
        run: scripts/cmux-next/private-bun.sh
      - name: Setup Node
        if: steps.dev-product.outputs.hit != 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.22.1"
      - name: Build the web bundles
        if: steps.dev-product.outputs.hit != 'true'
        run: scripts/cmux-next/build-web-bundles.sh
      - name: Compile the cmux NEXT DEV Release app
        id: compile
        env:
          CMUX_NEXT_CONFIGURATION: Release
          CMUX_NEXT_PRODUCT_NAME: cmux NEXT DEV
          CMUX_NEXT_BUNDLE_ID: com.cmuxterm.app.debug.next
          CMUX_NEXT_CODE_SIGN_ENTITLEMENTS: cmux.next-dev.entitlements
          CMUX_NEXT_AUTH_CALLBACK_SCHEME: cmux-next-dev
          CMUX_NEXT_TUI_MODE: tree
          CMUX_NEXT_BROWSER_DATA_IMPORT: full
          CMUX_NEXT_COMPILATION_CACHE: ${{ vars.CMUX_NEXT_DEV_COMPILATION_CACHE || '1' }}
          CMUX_NEXT_SWIFT_COMPILATION_MODE: ${{ vars.CMUX_NEXT_DEV_SWIFT_COMPILATION_MODE || 'auto' }}
          CMUX_NEXT_DEV_COMPILE_REPORT: ${{ runner.temp }}/cmux-next-dev-landing/report.txt
          CMUX_BUILD_METRICS_DIR: ${{ runner.temp }}/cmux-next-build-metrics/dev-landing
          CMUX_BUILD_METRICS_OUTPUT: ${{ runner.temp }}/cmux-next-build-metrics/dev-landing/metrics.json
          CMUX_BUILD_METRICS_SUMMARY: ${{ runner.temp }}/cmux-next-build-metrics/dev-landing/summary.md
          REUSED_ARCHIVE: ${{ steps.dev-product.outputs.hit == 'true' && steps.dev-product.outputs.archive || '' }}
          # Why: docs/ci/cmux-next-workflow-notes.md#note-332
          CMUX_NEXT_DEV_CAS_URL: ${{ vars.CMUX_NEXT_DEV_CAS_URL }}
          CMUX_NEXT_DEV_CAS_TOKEN: ${{ vars.CMUX_NEXT_DEV_CAS_URL != '' && secrets.NEXT_DEV_CAS_TOKEN || '' }}
          CMUX_NEXT_DEV_CAS_GH_TOKEN: ${{ vars.CMUX_NEXT_DEV_CAS_URL != '' && github.token || '' }}
          CMUX_NEXT_DEV_CAS_PACK_DIR: ${{ vars.CMUX_NEXT_DEV_CAS_URL != '' && format('{0}/cmux-next-dev-cas-pack', runner.temp) || '' }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/cmux-next-dev-daily-unsigned-${GITHUB_SHA}.app.zip"
          if [[ -n "$REUSED_ARCHIVE" && -f "$REUSED_ARCHIVE" ]]; then
            mv -f "$REUSED_ARCHIVE" "$archive"
          else
            scripts/cmux-next/compile-dev-release.sh "$archive"
          fi
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
      # A host build packed its compile cache: put it in the shared store and record its digest
      # Why: docs/ci/cmux-next-workflow-notes.md#note-333
      - name: Publish the compile cache seed
        id: cas-seed
        if: ${{ steps.compile.outcome == 'success' && vars.CMUX_NEXT_DEV_CAS_URL != '' && steps.dev-product.outputs.hit != 'true' }}
        continue-on-error: true
        timeout-minutes: 8
        env:
          CMUX_NEXT_DEV_CAS_URL: ${{ vars.CMUX_NEXT_DEV_CAS_URL }}
          CMUX_NEXT_DEV_CAS_TOKEN: ${{ secrets.NEXT_DEV_CAS_TOKEN }}
        run: |
          set -uo pipefail
          pack="$RUNNER_TEMP/cmux-next-dev-cas-pack"
          [[ -f "$pack/pack.json" ]] || { echo "no compile cache seed packed (not a host build)"; exit 0; }
          python3 -I scripts/cmux-next/dev_cas_seed.py publish --pack "$pack" --out "$RUNNER_TEMP/cmux-next-dev-cas-record" >> "$GITHUB_OUTPUT"
          rm -rf -- "$pack"
      - name: Record the compile cache seed
        if: steps.cas-seed.outputs.record != ''
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.cas-seed.outputs.record }}
          path: ${{ runner.temp }}/cmux-next-dev-cas-record/manifest.json
          if-no-files-found: error
          retention-days: 3
      - name: Upload DEV landing compile timing
        if: ${{ always() && steps.compile.outcome != 'skipped' }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-next-dev-landing-compile-timing-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cmux-next-build-metrics/dev-landing
          if-no-files-found: ignore
          retention-days: 3
      - name: Upload the cmux NEXT DEV Release app
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-next-dev-daily-unsigned-${{ github.sha }}
          path: ${{ steps.compile.outputs.archive }}
          if-no-files-found: error
          retention-days: 2
          compression-level: 0
      - name: Record the DEV Release app under its input key
        id: dev-product-record
        if: steps.dev-product.outputs.key != ''
        continue-on-error: true
        env:
          KEY: ${{ steps.dev-product.outputs.key }}
          ARCHIVE: ${{ steps.compile.outputs.archive }}
          REUSED_FROM_RUN: ${{ steps.dev-product.outputs.hit == 'true' && steps.dev-product.outputs.source_run_id || '' }}
          REUSED_FROM_SHA: ${{ steps.dev-product.outputs.hit == 'true' && steps.dev-product.outputs.source_sha || '' }}
          COMPILED_RUN: ${{ steps.dev-product.outputs.hit == 'true' && steps.dev-product.outputs.compiled_run_id || '' }}
          # Why: docs/ci/cmux-next-workflow-notes.md#note-334
          SWIFT_MODE: ${{ steps.dev-product.outputs.hit == 'true' && steps.dev-product.outputs.swift_mode || steps.compile.outputs.swift_mode }}
          SWIFT_MODE_REQUESTED: ${{ vars.CMUX_NEXT_DEV_SWIFT_COMPILATION_MODE || 'auto' }}
        run: |
          python3 -I scripts/ci/dev_release_product_reuse.py record --key "$KEY" --sha "$GITHUB_SHA" --archive "$ARCHIVE" \
            --reused-from-run "$REUSED_FROM_RUN" --reused-from-sha "$REUSED_FROM_SHA" --compiled-run "$COMPILED_RUN" \
            --swift-mode "$SWIFT_MODE" --swift-mode-requested "$SWIFT_MODE_REQUESTED" \
            --out "$RUNNER_TEMP/cmux-next-dev-product-record/manifest.json" >> "$GITHUB_OUTPUT"
      - name: Upload the DEV Release app record
        if: steps.dev-product-record.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-next-dev-release-product-${{ steps.dev-product.outputs.key }}
          path: ${{ runner.temp }}/cmux-next-dev-product-record/manifest.json
          if-no-files-found: error
          retention-days: 2
          overwrite: true
      # Why: docs/ci/cmux-next-workflow-notes.md#note-335
      - name: Report the landing compile
        id: report
        if: ${{ always() && steps.compile.outcome == 'success' && steps.dev-product.outputs.hit != 'true' }}
        continue-on-error: true
        env:
          POOL: ${{ needs.dev-landing-place.outputs.pool || 'blacksmith' }}
          PLACED: ${{ needs.dev-landing-place.outputs.host }}
          METRICS: ${{ runner.temp }}/cmux-next-build-metrics/dev-landing/metrics.json
        run: |
          set -uo pipefail
          report="$RUNNER_TEMP/cmux-next-dev-landing/report.txt"
          mode="$(sed -n 's/^mode=//p' "$report" 2>/dev/null)"
          swift_mode="$(sed -n 's/^swift_mode=//p' "$report" 2>/dev/null)"
          origin="$(sed -n 's/^previous_sha=//p' "$report" 2>/dev/null)"
          gap="$(python3 -I scripts/ci/dev_landing_place.py gap "$origin" "$GITHUB_SHA")"
          host="$(printf '%s' "$RUNNER_NAME" | tr '[:upper:]' '[:lower:]')"; host="${host%-glaeda*}"
          [[ "$POOL" == owned ]] || host="blacksmith"
          counts="$(python3 -I -c 'import json, sys; c = json.load(open(sys.argv[1])).get("compiler_cache") or {}; print(c.get("hits"), c.get("misses"), c.get("compile_wall_seconds"))' "$METRICS" 2>/dev/null || echo "? ? ?")"
          read -r hits misses seconds <<<"$counts"
          line="host=$host (placed ${PLACED:-any}) runner=$RUNNER_NAME overflow=$([[ "$POOL" == owned ]] && echo no || echo yes) mode=${mode:-?} swift_mode=${swift_mode:-?} restored=${origin:0:12} gap=${gap:-?} xcodebuild=${seconds}s hits=$hits misses=$misses"
          echo "::notice title=DEV landing compile::$line"
          echo "DEV landing compile: $line" >> "$GITHUB_STEP_SUMMARY"
          scripts/cmux-next/dev-cas-holder.sh "$report" "$RUNNER_TEMP/cmux-next-dev-cas-holder" >> "$GITHUB_OUTPUT"
      - name: Record this host's cache for the next landing's placement
        if: steps.report.outputs.holder != ''
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-next-dev-cas-holder-${{ steps.report.outputs.holder }}
          path: ${{ runner.temp }}/cmux-next-dev-cas-holder/holder.json
          if-no-files-found: error
          retention-days: 3
          overwrite: true

  request-cmux-next-dev-publish:
    needs: cmux-scheme-compile
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.dev_daily == true && needs.cmux-scheme-compile.result == 'success' && (inputs.same_tree_sha == '' || inputs.same_tree_sha == github.sha) && github.ref == 'refs/heads/feat-cmux-next' && github.repository == 'manaflow-ai/cmux' }}
    name: Request cmux NEXT DEV publication
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-4vcpu-ubuntu-2404' || vars.LINUX_RUNNER || fromJSON(vars.RUNNER_POOLS).linux_4 }}
    # Why: docs/ci/cmux-next-workflow-notes.md#note-336
    environment:
      name: ci-routing-agent
      deployment: false
    # Why: docs/ci/cmux-next-workflow-notes.md#note-337
    timeout-minutes: 70
    permissions:
      actions: write
      contents: read
    steps:
      - name: Mint the handoff token
        id: handoff-token
        if: vars.GLAEDA_ROUTE_APP_ID != ''
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.GLAEDA_ROUTE_APP_ID }}
          private-key: ${{ secrets.GLAEDA_ROUTE_APP_KEY }}
          permission-actions: write

      # Why: docs/ci/cmux-next-workflow-notes.md#note-338
      - name: Record source queue and handoff receipt
        id: receipt
        continue-on-error: true
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ steps.handoff-token.outputs.token || github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ inputs.dev_daily_sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cmux-next-dev-handoff"
          gh api "repos/$GH_REPO/actions/runs/$RUN_ID/jobs?filter=latest&per_page=100" > "$RUNNER_TEMP/cmux-next-dev-handoff/jobs.json"
          gh api "repos/$GH_REPO/actions/runs/$RUN_ID" > "$RUNNER_TEMP/cmux-next-dev-handoff/run.json"
          python3 - "$RUNNER_TEMP/cmux-next-dev-handoff/jobs.json" "$RUNNER_TEMP/cmux-next-dev-handoff/run.json" "$RUN_ID" "$SOURCE_SHA" "$GITHUB_STEP_SUMMARY" "$RUNNER_TEMP/cmux-next-dev-handoff/receipt.json" <<'PY'
          import datetime as dt, json, pathlib, sys
          jobs = json.loads(pathlib.Path(sys.argv[1]).read_text())["jobs"]
          run = json.loads(pathlib.Path(sys.argv[2]).read_text())
          run_id, source_sha, summary, receipt_path = sys.argv[3:]
          candidates = [j for j in jobs if j.get("name") == "cmux NEXT DEV Release compile"]
          if len(candidates) != 1 or candidates[0].get("conclusion") != "success":
              raise SystemExit(f"DEV Release compile receipt invalid: {candidates}")
          job = candidates[0]
          parse = lambda value: dt.datetime.fromisoformat(value.replace("Z", "+00:00"))
          run_started, compile_started, completed = map(parse, (run["created_at"], job["started_at"], job["completed_at"]))
          receipt = {
              "schema": "cmux-next-dev-handoff-v1", "source_run_id": int(run_id), "source_sha": source_sha,
              "source_run_started_at": run_started.isoformat(), "compile_started_at": compile_started.isoformat(),
              "compile_completed_at": completed.isoformat(), "handoff_requested_at": dt.datetime.now(dt.timezone.utc).isoformat(),
              "queue_ms": max(0, int((compile_started - run_started).total_seconds() * 1000)),
              "compile_ms": max(0, int((completed - compile_started).total_seconds() * 1000)),
              "runner_name": job.get("runner_name"), "runner_labels": job.get("labels", []),
          }
          out = pathlib.Path(receipt_path)
          out.write_text(json.dumps(receipt, indent=2) + "\n")
          pathlib.Path(summary).write_text("## cmux NEXT DEV handoff\n" + "\n".join(f"- {k}: `{receipt[k]}`" for k in ("source_run_id", "source_sha", "queue_ms", "compile_ms", "runner_name")) + "\n")
          print(json.dumps(receipt, sort_keys=True))
          PY
      - name: Upload queue-delay receipt
        if: steps.receipt.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-next-dev-handoff-${{ inputs.dev_daily_sha }}
          path: ${{ runner.temp }}/cmux-next-dev-handoff/receipt.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Dispatch the exact source run to the publisher
        id: app-dispatch
        if: steps.handoff-token.outputs.token != ''
        continue-on-error: true
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ steps.handoff-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          gh workflow run cmux-next-dev-daily.yml --repo "$GH_REPO" --ref main -f "source_run_id=$SOURCE_RUN_ID"
          echo "Requested cmux NEXT DEV publication for source run $SOURCE_RUN_ID (manaflow-glaeda-route token)"

      # The fallback holds only GITHUB_TOKEN. A refusal for the rate limit waits
      # Why: docs/ci/cmux-next-workflow-notes.md#note-339
      - name: Dispatch with GITHUB_TOKEN, waiting through a rate limit
        if: steps.app-dispatch.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_RUN_ID: ${{ github.run_id }}
        run: |
          set -uo pipefail
          echo "::warning title=DEV handoff::the manaflow-glaeda-route token did not dispatch; using GITHUB_TOKEN"
          waited=0
          for try in 1 2 3; do
            if out="$(gh workflow run cmux-next-dev-daily.yml --repo "$GH_REPO" --ref main -f "source_run_id=$SOURCE_RUN_ID" 2>&1)"; then
              echo "Requested cmux NEXT DEV publication for source run $SOURCE_RUN_ID (GITHUB_TOKEN)"
              exit 0
            fi
            echo "$out" >&2
            grep -qiE 'rate limit exceeded|secondary rate limit|too many requests|HTTP 429' <<<"$out" || exit 1
            [[ "$try" -lt 3 ]] || exit 1
            now="$(date +%s)"
            reset="$(gh api rate_limit --jq '.resources.core.reset' 2>/dev/null || echo 0)"
            [[ "$reset" =~ ^[0-9]+$ ]] || reset=0
            wait=$(( reset > now ? reset - now + 5 : 60 ))
            (( wait > 3600 - waited )) && wait=$(( 3600 - waited ))
            (( wait > 0 )) || exit 1
            echo "::notice title=GitHub API budget::dispatch refused for the rate limit (try $try of 3); waiting ${wait}s for the reset"
            sleep "$wait"
            waited=$(( waited + wait ))
          done
          exit 1

  # The checks job's red sub-checks join the PR's red-checks line (pr-red-checks-comment.yml), each
  # Why: docs/ci/cmux-next-workflow-notes.md#note-340
  pr-red-checks:
    needs: [checks]
    if: ${{ always() && !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'feat-cmux-next' }}
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: write
    uses: ./.github/workflows/pr-red-checks-comment.yml
    with:
      own_checks_green: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}

  push-attribution:
    needs: [checks, generated-files, generated-verdict, swift-canary, swift-test, daemon-test, release-compile, cmux-scheme-compile, crash-ends-app]
    # Why: docs/ci/cmux-next-workflow-notes.md#note-341
    if: ${{ failure() && inputs.dev_daily != true && (github.event_name == 'push' || inputs.same_tree_origin == 'push' || inputs.base_tier == true) && github.ref == 'refs/heads/feat-cmux-next' && github.repository == 'manaflow-ai/cmux' }}
    name: cmux-next push attribution
    environment: ${{ github.event_name != 'pull_request' && 'ci-routing-agent' || '' }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.CI_CLOUD_OVERFLOW_SAVED && (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-8vcpu-ubuntu-2404' || fromJSON(vars.RUNNER_POOLS).linux_8) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-2vcpu-ubuntu-2404' || fromJSON(vars.RUNNER_POOLS).linux_2) }} # ephemeral-required: holds a pull-requests write token; ephemeral Blacksmith VM, reads no variable
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          sparse-checkout: scripts/ci

      # Why: docs/ci/cmux-next-workflow-notes.md#note-342
      - name: Fetch the branch's recent commits
        continue-on-error: true
        timeout-minutes: 2
        env:
          SHA: ${{ inputs.same_tree_sha || github.sha }}
        run: git fetch --quiet --no-tags --filter=tree:0 --depth=400 origin "$SHA"

      # Why: docs/ci/cmux-next-workflow-notes.md#note-343
      - name: Mint the cmux-bot read token
        id: read-token
        if: ${{ github.event_name != 'pull_request' && vars.CMUX_BOT_APP_ID != '' }}
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.CMUX_BOT_APP_ID }}
          private-key: ${{ secrets.CMUX_BOT_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-actions: read
          permission-contents: read
          permission-pull-requests: read

      - name: Comment on the pull requests in the failing range
        env:
          GH_TOKEN: ${{ github.token }}
          GH_READ_TOKEN: ${{ steps.read-token.outputs.token }}
          SHA: ${{ inputs.same_tree_sha || github.sha }}
          NEXT_PUSH_BISECT: ${{ vars.NEXT_PUSH_BISECT }}
        run: |
          python3 scripts/ci/cmux_next_push_attribution.py --repo "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" --sha "$SHA" --server-url "$GITHUB_SERVER_URL" \
            --events push,workflow_dispatch --summary "$GITHUB_STEP_SUMMARY" \
            --last-known-green "$(git ls-remote --heads origin refs/heads/last-known-green | awk '{print $1}')"

  # The base-break rule, automated: a feat-cmux-next push whose Mac Release compile failed in its
  # compile step (pull requests get the fleet compile at -Onone, so -O codegen and the final app link
  # are first compiled here) opens the revert of the one merge since the compile last passed,
  # within minutes. Several merges in the range, or a red older than the scanned runs, open
  # nothing (push attribution comments on each). The revert is pushed and opened by the
  # manaflow-glaeda-route App so its own CI runs; it lands through the normal review path.
  release-compile-revert:
    needs: [release-compile, release-compile-fast-admission]
    if: ${{ always() && (needs.release-compile.result == 'failure' || needs.release-compile-fast-admission.result == 'failure') && github.event_name == 'push' && github.ref == 'refs/heads/feat-cmux-next' && github.repository == 'manaflow-ai/cmux' }}
    name: cmux-next Release compile revert
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.CI_CLOUD_OVERFLOW_SAVED && (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-8vcpu-ubuntu-2404' || fromJSON(vars.RUNNER_POOLS).linux_8) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-2vcpu-ubuntu-2404' || fromJSON(vars.RUNNER_POOLS).linux_2) }} # ephemeral-required: holds a contents and pull-requests write App token; ephemeral Blacksmith VM
    # Why: docs/ci/cmux-next-workflow-notes.md#note-344
    environment:
      name: ci-routing-agent
      deployment: false
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      # Why: docs/ci/cmux-next-workflow-notes.md#note-345
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: feat-cmux-next
          fetch-depth: 200

      - name: Find the one merge to revert
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/ci/cmux_next_compile_revert.py --repo "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID" \
            --sha "$GITHUB_SHA" --github-output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"

      - name: Mint the revert PR token
        id: app-token
        if: ${{ steps.find.outputs.pr != '' && vars.GLAEDA_ROUTE_APP_ID != '' }}
        timeout-minutes: 1
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.GLAEDA_ROUTE_APP_ID }}
          private-key: ${{ secrets.GLAEDA_ROUTE_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Open the revert pull request
        if: ${{ steps.app-token.outputs.token != '' }}
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          PR: ${{ steps.find.outputs.pr }}
          MERGE_SHA: ${{ steps.find.outputs.merge_sha }}
          GOOD: ${{ steps.find.outputs.good }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          [[ "$PR" =~ ^[0-9]+$ && "$MERGE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::bad culprit output"; exit 1; }
          export GH_TOKEN="$APP_TOKEN"
          branch="revert/pr-$PR"
          open="$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=all&head=${GITHUB_REPOSITORY_OWNER}:${branch}" --jq '.[0].html_url // empty')"
          if [[ -n "$open" ]]; then
            echo "A revert of #$PR already exists: $open" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "cmux-next compile revert"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git cat-file -e "$MERGE_SHA^{commit}" 2>/dev/null || ! git merge-base --is-ancestor "$MERGE_SHA" HEAD; then
            echo "::warning title=Release compile revert::$MERGE_SHA is not in the last 200 commits of feat-cmux-next; left to #$PR's owner."
            exit 0
          fi
          mainline=()
          if [[ "$(git rev-list --parents -n1 "$MERGE_SHA" | wc -w)" -gt 2 ]]; then
            mainline=(-m 1)  # a merge commit: undo what it brought onto feat-cmux-next
          fi
          if ! git revert --no-edit ${mainline[@]+"${mainline[@]}"} "$MERGE_SHA"; then
            git revert --abort || true
            echo "::warning title=Release compile revert::reverting #$PR ($MERGE_SHA) conflicts with feat-cmux-next's tip; left to its owner."
            exit 0
          fi
          auth="$(printf 'x-access-token:%s' "$APP_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          GIT_CONFIG_COUNT=1 \
          GIT_CONFIG_KEY_0="http.https://github.com/.extraheader" \
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" \
            git push --quiet "https://github.com/$GITHUB_REPOSITORY.git" "HEAD:refs/heads/$branch"
          title="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq .title)"
          body="$(printf '%s\n\n%s\n\n%s\n' \
            "Reverts #$PR (\`$MERGE_SHA\`): the feat-cmux-next push run $RUN_URL failed its Mac Release compile (\`cmux-next Release compile (Xcode 26)\`) at \`$GITHUB_SHA\`; it last passed at \`$GOOD\`, and #$PR is the one merge since." \
            "Pull requests get the fleet compile at -Onone, so -O codegen and the final app link are first compiled on the base push. The base-break rule restores base first: land this, then reland #$PR with the fix." \
            "Opened by cmux-next.yml release-compile-revert.")"
          url="$(gh api -X POST "repos/$GITHUB_REPOSITORY/pulls" -f head="$branch" -f base=feat-cmux-next \
            -f title="Revert \"$title\" (broke the feat-cmux-next Release compile)" -f body="$body" --jq .html_url)"
          echo "::notice title=Release compile revert::$url reverts #$PR"
          echo "Revert pull request: $url" >> "$GITHUB_STEP_SUMMARY"

  # Why: docs/ci/cmux-next-workflow-notes.md#note-10 (compile-status)
  compile-status:
    needs: [path_route, push-head-preflight]
    if: ${{ !cancelled() && needs.path_route.result == 'success' && needs.path_route.outputs.native == 'true' && github.repository == 'manaflow-ai/cmux' && (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push' && github.ref == 'refs/heads/feat-cmux-next') }}
    name: cmux-next fleet Release compile
    environment: ${{ github.event_name != 'pull_request' && 'ci-routing-agent' || '' }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.CI_CLOUD_OVERFLOW_SAVED && (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-8vcpu-ubuntu-2404' || fromJSON(vars.RUNNER_POOLS).linux_8) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-2vcpu-ubuntu-2404' || fromJSON(vars.RUNNER_POOLS).linux_2) }} # ephemeral-required: holds a statuses write App token; ephemeral Blacksmith VM, checks nothing out
    timeout-minutes: 58
    permissions: {}
    outputs:
      handoff: ${{ steps.wait.outputs.handoff }}
    steps:
      - name: Mint the cmux-bot status token
        id: token
        timeout-minutes: 2
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.CMUX_BOT_APP_ID }}
          private-key: ${{ secrets.CMUX_BOT_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-statuses: write

      - name: Wait for the fleet Release compile and publish cmux-next/compile
        id: wait
        timeout-minutes: 56
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          REPO: ${{ github.repository }}
          API: ${{ github.api_url }}/repos/${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RESULTS: https://gh-events.cmux.com/compile-checks/v1
          # Why: docs/ci/cmux-next-workflow-notes.md#note-81
          PR: ${{ github.event.pull_request.number }}
          # Why: docs/ci/cmux-next-workflow-notes.md#note-82
          FALLBACK: ${{ needs.push-head-preflight.outputs.current == 'true' && (github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'full-ci') || needs.path_route.outputs.mac_release == 'true') }}
        run: |
          set -uo pipefail
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error title=Compile check::bad head sha '$SHA'"; exit 1; }
          [[ -z "${PR:-}" || "$PR" =~ ^[1-9][0-9]*$ ]] || PR=""
          # One deadline for the pending post and the wait (40 min); the terminal post comes after it
          # (at most POST_BUDGET 600 s plus one 40 s try), so the step (56 min) and the App token (60 min) outlast both.
          deadline=$((SECONDS + ${WAIT_SECONDS:-2400}))
          # Why: docs/ci/cmux-next-workflow-notes.md#note-10 (a refused status post)
          post() {  # state, description, target url[, seconds it may wait; POST_BUDGET (600) by default]
            local body code said pause min tries=0 until=$((SECONDS + ${4:-${POST_BUDGET:-600}}))
            local out="$RUNNER_TEMP/status-post.out" hdr="$RUNNER_TEMP/status-post.hdr"
            body="$(jq -nc --arg s "$1" --arg d "${2:0:140}" --arg u "$3" \
              '{state: $s, description: $d, target_url: $u, context: "cmux-next/compile"}')"
            while :; do
              tries=$((tries + 1))
              : > "$out"; : > "$hdr"
              code="$(timeout 40 curl -sS --connect-timeout 10 --max-time 30 -D "$hdr" -o "$out" -w '%{http_code}' \
                -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
                "$API/statuses/$SHA" -d "$body")" || true
              [[ "${code:=000}" =~ ^2[0-9][0-9]$ ]] && return 0
              said="HTTP $code: $(head -c 200 "$out" | tr -s '\r\n\t' '   ' || true)"
              # A GitHub rate limit (a 403 or 429 that says so) waits as asked, at least LIMIT_GAP and twice as long each
              # time: a retry inside a secondary limit extends it. A 5xx or no answer: again in POST_GAP. Anything else
              # (a bad token, a missing permission) is final at once.
              pause=""
              if [[ "$code" =~ ^(403|429)$ ]] && grep -qiE 'rate limit|^retry-after:|^x-ratelimit-remaining: *0' "$out" "$hdr"; then
                said="$said (rate limited)"
                pause="$(grep -iE '^retry-after: *[0-9]+' "$hdr" | head -n1 | tr -dc '0-9' || true)"
                if grep -qiE '^x-ratelimit-remaining: *0\b' "$hdr"; then
                  min="$(grep -iE '^x-ratelimit-reset: *[0-9]+' "$hdr" | head -n1 | tr -dc '0-9' || true)"
                  [[ -z "$min" ]] || pause=$(( min - $(date +%s) + 1 ))
                fi
                min=$(( ${LIMIT_GAP:-60} << (tries - 1) ))
                [[ -n "$pause" ]] && (( pause >= min )) || pause=$min
              elif [[ "$code" =~ ^(000|5[0-9][0-9])$ ]]; then
                pause="${POST_GAP:-10}"
              fi
              if [[ -z "$pause" ]] || (( tries >= 6 || SECONDS + pause > until )); then
                echo "::warning title=Compile check::GitHub refused the $1 status for cmux-next/compile after $tries tries: $said"
                return 1
              fi
              echo "::warning title=Compile check::GitHub refused the $1 status ($said); posting again in $pause s"
              sleep "$pause"
            done
          }
          # A terminal post that GitHub still refuses leaves the job's own ::error line below (no verdict, NO_VERDICT).
          # The pending status only shows the wait: a refused one is a warning, and the verdict below still posts or reds.
          post pending "The Release compile (-Onone) of this head is running" "$RUN_URL" "${PENDING_BUDGET:-30}" \
            || echo "::warning title=Compile check::no pending cmux-next/compile on $SHA; the verdict still posts"
          reply="$RUNNER_TEMP/compile-check.json"
          url="$RESULTS/$SHA?repo=${REPO/\//%2F}${PR:+&pr=$PR}"
          state="" down="" last="" reads=0
          # Why: docs/ci/cmux-next-workflow-notes.md#note-82 (compile-status: the results service down)
          ok_at=$SECONDS  # the last usable answer (200 or 404): one start time, before the first read
          for probe in 1 2; do
            code="$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 10 --max-time 20 "$url&wait=1" 2>/dev/null)" || true
            [[ "${code:=000}" =~ ^(000|52[0-9]|530)$ ]] || { [[ "$code" =~ ^(200|404)$ ]] && ok_at=$SECONDS; break; }
            (( probe == 2 )) && down="HTTP $code" || sleep "${PROBE_GAP:-30}"
          done
          while [[ -z "$down" ]]; do
            # The shared deadline: each read gets only what is left of the wait and of the bound for a usable answer.
            end=$(( deadline < ok_at + ${BAD_BOUND:-300} ? deadline : ok_at + ${BAD_BOUND:-300} ))
            left=$((end - SECONDS))
            (( left > 1 )) || break
            wait=$(( left > 60 ? left - 30 : left / 2 )); wait=$(( wait < 1800 ? wait : 1800 ))
            code="$(timeout "$left" curl -sS -o "$reply" -w '%{http_code}' --connect-timeout 10 \
              --max-time "$left" "$url&wait=$wait")" || true
            case "${code:=000}" in
              200) reads=$((reads + 1)) ok_at=$SECONDS last=""
                state="$(jq -r --arg sha "$SHA" --arg repo "$REPO" '
                  if .sha != $sha or .repo != $repo or .recipe_version != 2 or .configuration != "release-onone"
                  then "mismatch" else (.state // "") end' "$reply" 2>/dev/null || echo unreadable)"
                echo "read $reads: $state"
                case "$state" in pass|fail|unavailable|mismatch|unreadable) break ;; esac ;;
              404) ok_at=$SECONDS last="" ;;  # no result yet
              *) last="HTTP $code"; echo "::warning title=Compile check::the results service answered HTTP $code for $SHA" ;;
            esac
            gap=$(( end - SECONDS < ${READ_GAP:-30} ? end - SECONDS : ${READ_GAP:-30} ))
            (( gap <= 0 )) || sleep "$gap"
          done
          # No usable answer when the wait or the bound ran out (a stalled read, a 530, no connection): the service down.
          [[ -z "$down" && -n "$last" ]] && down="$last for $((SECONDS - ok_at)) s"
          if [[ -n "$down" ]]; then
            # Why: docs/ci/cmux-next-workflow-notes.md#note-83 (compile-status-handoff)
            if [[ "$FALLBACK" == true ]]; then
              echo "handoff=$down" >> "$GITHUB_OUTPUT"
              post pending "The results service is down ($down); the Mac Release compile decides this head" "$RUN_URL" \
                || { echo "::error title=Compile check::could not post the handoff status"; exit 1; }
              echo "::warning title=Compile check::results service down ($down); compile-status-handoff posts the Mac Release compile's verdict"
              exit 0
            fi
            # Why: docs/ci/cmux-next-workflow-notes.md#note-346 (overflow handoff)
            if [[ -n "${PR:-}" ]]; then
              post pending "[overflow] Results service down ($down); the overflow compile of this head posts the verdict" "$RUN_URL" \
                || { echo "::error title=Compile check::could not post the overflow handoff status"; exit 1; }
              echo "::warning title=Compile check::results service down ($down); the overflow compile posts cmux-next/compile for $SHA"
              exit 0
            fi
            # Why: docs/ci/cmux-next-workflow-notes.md#note-84 ([no-verdict])
            post error "[no-verdict] No compile verdict: results service down ($down); no fallback compile runs here, re-run this job" "$RUN_URL" || true
            echo "::error title=Compile check::cmux-next/compile is not a pass for $SHA (results service down, $down)"
            exit 1
          fi
          log_url="$(jq -r '.log_url // empty' "$reply" 2>/dev/null || true)"
          [[ "$log_url" =~ ^https://github\.com/ ]] || log_url="$RUN_URL"
          case "$state" in
            pass) post success "The app compiled and linked in SwiftPM Release (-Onone)" "$log_url" && exit 0 ;;
            fail) post failure "The app did not compile in SwiftPM Release (-Onone); see the log" "$log_url" || true ;;
            unavailable) post failure "[no-verdict] The compile check gave no verdict (unavailable); re-run this job" "$RUN_URL" || true ;;
            mismatch|unreadable) post failure "[no-verdict] The compile result does not match this head; re-run this job" "$RUN_URL" || true ;;
            *) post failure "[no-verdict] No compile result for this head in 40 minutes${state:+ (last: $state)}" "$RUN_URL" || true ;;
          esac
          echo "::error title=Compile check::cmux-next/compile is not a pass for $SHA (${state:-no result})"
          exit 1

  # Posts cmux-next/compile from the Mac Release compile when compile-status handed off to it.
  # Why: docs/ci/cmux-next-workflow-notes.md#note-83
  compile-status-handoff:
    needs: [compile-status, release-compile-fast, release-compile]
    if: ${{ always() && !cancelled() && needs.compile-status.outputs.handoff != '' }}
    name: cmux-next fleet Release compile (handoff)
    environment: ${{ github.event_name != 'pull_request' && 'ci-routing-agent' || '' }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.CI_CLOUD_OVERFLOW_SAVED && (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-8vcpu-ubuntu-2404' || fromJSON(vars.RUNNER_POOLS).linux_8) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-2vcpu-ubuntu-2404' || fromJSON(vars.RUNNER_POOLS).linux_2) }} # ephemeral-required: holds a statuses write App token; ephemeral Blacksmith VM, checks nothing out
    timeout-minutes: 16
    permissions: {}
    steps:
      - name: Mint the cmux-bot status token
        id: token
        timeout-minutes: 2
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.CMUX_BOT_APP_ID }}
          private-key: ${{ secrets.CMUX_BOT_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-statuses: write

      - name: Publish the fallback's verdict as cmux-next/compile
        timeout-minutes: 12
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          API: ${{ github.api_url }}/repos/${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DOWN: ${{ needs.compile-status.outputs.handoff }}
          FAST: ${{ needs.release-compile-fast.result }}/${{ needs.release-compile-fast.outputs.verdict }}
          MAC: ${{ needs.release-compile.result }}
        run: |
          set -uo pipefail
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error title=Compile check::bad head sha '$SHA'"; exit 1; }
          # The fast check's own verdict (a gateway's fleet compile) first, else the Mac Release compile.
          case "$FAST/$MAC" in
            success/pass/*|*/success) state=success d="The Release compile (fallback) compiled this head; the results service was down" ;;
            */fail/*|*/failure) state=failure d="The Release compile (fallback) failed at this head; see its log" ;;
            *) state=error d="[no-verdict] No compile verdict: results service was down ($DOWN) and no fallback compile ran; re-run all jobs" ;;
          esac
          # Why: docs/ci/cmux-next-workflow-notes.md#note-10 (a refused status post)
          post() {  # state, description, target url[, seconds it may wait; POST_BUDGET (600) by default]
            local body code said pause min tries=0 until=$((SECONDS + ${4:-${POST_BUDGET:-600}}))
            local out="$RUNNER_TEMP/status-post.out" hdr="$RUNNER_TEMP/status-post.hdr"
            body="$(jq -nc --arg s "$1" --arg d "${2:0:140}" --arg u "$3" \
              '{state: $s, description: $d, target_url: $u, context: "cmux-next/compile"}')"
            while :; do
              tries=$((tries + 1))
              : > "$out"; : > "$hdr"
              code="$(timeout 40 curl -sS --connect-timeout 10 --max-time 30 -D "$hdr" -o "$out" -w '%{http_code}' \
                -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
                "$API/statuses/$SHA" -d "$body")" || true
              [[ "${code:=000}" =~ ^2[0-9][0-9]$ ]] && return 0
              said="HTTP $code: $(head -c 200 "$out" | tr -s '\r\n\t' '   ' || true)"
              # A GitHub rate limit (a 403 or 429 that says so) waits as asked, at least LIMIT_GAP and twice as long each
              # time: a retry inside a secondary limit extends it. A 5xx or no answer: again in POST_GAP. Anything else
              # (a bad token, a missing permission) is final at once.
              pause=""
              if [[ "$code" =~ ^(403|429)$ ]] && grep -qiE 'rate limit|^retry-after:|^x-ratelimit-remaining: *0' "$out" "$hdr"; then
                said="$said (rate limited)"
                pause="$(grep -iE '^retry-after: *[0-9]+' "$hdr" | head -n1 | tr -dc '0-9' || true)"
                if grep -qiE '^x-ratelimit-remaining: *0\b' "$hdr"; then
                  min="$(grep -iE '^x-ratelimit-reset: *[0-9]+' "$hdr" | head -n1 | tr -dc '0-9' || true)"
                  [[ -z "$min" ]] || pause=$(( min - $(date +%s) + 1 ))
                fi
                min=$(( ${LIMIT_GAP:-60} << (tries - 1) ))
                [[ -n "$pause" ]] && (( pause >= min )) || pause=$min
              elif [[ "$code" =~ ^(000|5[0-9][0-9])$ ]]; then
                pause="${POST_GAP:-10}"
              fi
              if [[ -z "$pause" ]] || (( tries >= 6 || SECONDS + pause > until )); then
                echo "::warning title=Compile check::GitHub refused the $1 status for cmux-next/compile after $tries tries: $said"
                return 1
              fi
              echo "::warning title=Compile check::GitHub refused the $1 status ($said); posting again in $pause s"
              sleep "$pause"
            done
          }
          post "$state" "$d" "$RUN_URL" \
            || { echo "::error title=Compile check::could not post the fallback's verdict"; exit 1; }
          echo "cmux-next/compile: $state ($d)"
          # The needs_verdict rule's words: a fallback's red is a red, nothing ran is no verdict (exit 3).
          [[ "$state" != error ]] || { echo "::error::no verdict: cmux-next/compile for $SHA: the results service was down and no fallback compile ran ($FAST/$MAC); re-run all jobs"; exit 3; }
          [[ "$state" == success ]] || { echo "::error title=Compile check::the Release compile (fallback) of $SHA failed ($FAST/$MAC); see its log"; exit 1; }
