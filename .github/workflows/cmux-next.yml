jobs:
  # Why: 2026-11-24-workflow-1.md
  pure-checks-coalesce:
    # A foreign label event skips it (its dependents test `!= 'false'`, so a skip reads as run).
    if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'feat-cmux-next' && (github.event.action == 'labeled' || github.event.action == 'unlabeled') && !contains(fromJSON('["full-ci","ready-to-land"]'), github.event.label.name)) }}
    # actions: read: base-coalesce lists this workflow's runs to re-run a window whose run failed (#55503 missed this caller).
    permissions:
      actions: read
    uses: ./.github/workflows/base-coalesce.yml
    with:
      key: cmux-next-pure-checks
      hold_minutes: 30
      no_coalesce: ${{ format('{0}', vars.CMUX_NEXT_PURE_CHECKS_COALESCE) == '0' }}

  # Why: 2026-11-24-pure-checks-coalesce-1.md, note-11
  # Why: note-pr-control-pool
  push-head-preflight:
    # Why: note-87
    if: ${{ !cancelled() && (inputs.same_tree_sha == '') && !(github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'feat-cmux-next' && (github.event.action == 'labeled' || github.event.action == 'unlabeled') && !contains(fromJSON('["full-ci","ready-to-land"]'), github.event.label.name)) }}
    name: cmux-next push head preflight
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'push' && github.ref == 'refs/heads/feat-cmux-next' && github.run_attempt == 1 && 'cmux-linux' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.run_attempt == 1 && 'cmux-linux' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && (vars.CI_FORK_LINUX_RUNNER || 'ubuntu-24.04') || 'cmux-linux' }}
    timeout-minutes: 2
    permissions:
      actions: write
      contents: read
    outputs:
      current: ${{ steps.head.outputs.current }}
    steps:
      - name: Check whether this push is still the branch head
        id: head
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current=true
          if [[ "$EVENT_NAME" == push && "$REF" == refs/heads/feat-cmux-next ]]; then
            authorization="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
            remote_sha="$(timeout 15 git -c "http.extraHeader=Authorization: Basic $authorization" \
              ls-remote "${SERVER_URL}/${REPOSITORY}.git" "$REF" 2>/dev/null | awk 'NR==1{print $1}')" || remote_sha=""
            if [[ -n "$remote_sha" && "$remote_sha" != "$SHA" ]]; then
              current=false
              echo "Superseded feat-cmux-next push $SHA; current branch head is $remote_sha."
            elif [[ -z "$remote_sha" ]]; then
              echo "::warning::could not resolve the current feat-cmux-next head; keeping macOS work enabled"
            else
              echo "Current feat-cmux-next head is $SHA."
            fi
          fi
          echo "current=$current" >> "$GITHUB_OUTPUT"

  # Why: note-368
  path_route:
    if: ${{ (always() && !cancelled() && inputs.same_tree_sha == '') && !(github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'feat-cmux-next' && (github.event.action == 'labeled' || github.event.action == 'unlabeled') && !contains(fromJSON('["full-ci","ready-to-land"]'), github.event.label.name)) }}
    name: cmux-next path routing
