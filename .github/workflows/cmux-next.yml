        run: |
          set -euo pipefail
          acpmux_bin="$(scripts/cmux-next/pin-cmux-tui.sh acpmux-path)"
          if [[ -x "$acpmux_bin" && ( -z "${CMUX_TUI_TREE_KEY:-}" ||
                "$CMUX_TUI_TREE_KEY" == "$(scripts/cmux-next/pin-cmux-tui.sh key --rev HEAD)" ) ]]; then
            printf 'commit=%s\nsource=same-tree\n' "$(git rev-parse HEAD)" > "$acpmux_bin.ref"
          else
            acpmux_bin="$RUNNER_TEMP/cmux-next-acpmux/acpmux"
            scripts/cmux-next/build-acpmux.sh --output "$acpmux_bin"
          fi
          echo "CMUX_NEXT_ACPMUX_BIN=$acpmux_bin" >> "$GITHUB_ENV"
      - name: Restore pinned Bun 1.4.4 from the CI cache bucket
        if: steps.dev-product.outputs.hit != 'true'
        shell: bash
        continue-on-error: true
        run: bash "$GITHUB_WORKSPACE/scripts/ci/toolchain-r2.sh" restore bun 1.4.4 || true

      - name: Setup Bun
        if: steps.dev-product.outputs.hit != 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
          no-cache: ${{ !startsWith(github.workspace, '/home/runner/work/') || !(github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && github.event_name != 'merge_group' && contains(fromJSON('["refs/heads/main","refs/heads/feat-cmux-next","refs/heads/nightly-next"]'), github.ref)) }}
      - name: Give this job its own bun
        if: steps.dev-product.outputs.hit != 'true'
        run: scripts/cmux-next/private-bun.sh
      - name: Restore pinned Node 24.22.1 from the CI cache bucket
        if: steps.dev-product.outputs.hit != 'true'
        shell: bash
        continue-on-error: true
        run: bash "$GITHUB_WORKSPACE/scripts/ci/toolchain-r2.sh" restore node 24.22.1 || true

      - name: Setup Node
        timeout-minutes: 5
        if: steps.dev-product.outputs.hit != 'true'
