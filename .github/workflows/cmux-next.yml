        run: scripts/cmux-next/pin-cmux-tui.sh probe
      - name: Mint the owned-pool read token
        id: route-token
        if: vars.GLAEDA_ROUTE_APP_ID != ''
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.GLAEDA_ROUTE_APP_ID }}
          private-key: ${{ secrets.GLAEDA_ROUTE_APP_KEY }}
          permission-administration: read
          permission-organization-self-hosted-runners: read
          permission-actions: read
      - name: Place the compile
        id: place
        env:
          CI_RUNNER_STATE: ${{ vars.CI_RUNNER_STATE }}
          ROUTE_TOKEN: ${{ steps.route-token.outputs.token }}
          SHA: ${{ github.sha }}
          SIDE_LABEL: ${{ env.CMUX_NEXT_SIDE_ROUTE }}
          WAIT_SECONDS: "120"
          POLL_SECONDS: "30"
          GAP_REPO: ${{ runner.temp }}/dev-landing-history
          GAP_REMOTE: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -uo pipefail
          # Why: 2026-11-24-dev-landing-place-1.md
          git init -q --bare "$GAP_REPO"
          timeout 60 git -C "$GAP_REPO" fetch -q --no-tags --filter=tree:0 --depth=300 \
            "$GAP_REMOTE" "$SHA" || echo "::warning::no history for the cache distances"
          python3 -I scripts/ci/dev_landing_place.py >> "$GITHUB_OUTPUT"

  dev-landing-compile:
    needs: dev-landing-place
    if: ${{ !cancelled() && (needs.dev-landing-place.result == 'success' && needs.dev-landing-place.outputs.tree_state == 'ready' && needs.dev-landing-place.outputs.runs_on != '') && !(github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'feat-cmux-next' && (github.event.action == 'labeled' || github.event.action == 'unlabeled') && !contains(fromJSON('["full-ci","ready-to-land"]'), github.event.label.name)) }}
    name: cmux NEXT DEV Release compile (landing)
    concurrency:
      group: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'feat-cmux-next' && (github.event.action == 'labeled' || github.event.action == 'unlabeled') && !contains(fromJSON('["full-ci","ready-to-land"]'), github.event.label.name) && format('-label-{0}', github.run_id) || format('cmux-next-dev-landing-{0}', github.run_id) }}
      cancel-in-progress: false
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || needs.dev-landing-place.outputs.runs_on != '' && fromJSON(needs.dev-landing-place.outputs.runs_on) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-6vcpu-macos-26' || (vars.CI_BLACKSMITH_MACOS != 'on' && vars.CI_SIDE_LANE_RUNNER || fromJSON(vars.RUNNER_POOLS).macos_26)) }}
    timeout-minutes: 60
    # Why: note-328
    environment: ${{ vars.CMUX_NEXT_DEV_CAS_URL != '' && 'next-dev-cas' || '' }}
    permissions:
      actions: read
      contents: read
    env:
      # Why: note-329
      BASH_ENV: ""
      # Why: note-330
      CMUX_NEXT_RUNNER: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || needs.dev-landing-place.outputs.runner_label || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-6vcpu-macos-26' || (vars.CI_BLACKSMITH_MACOS != 'on' && vars.CI_SIDE_LANE_RUNNER || fromJSON(vars.RUNNER_POOLS).macos_26)) }}
      CMUX_CI_XCODE_APP: ${{ vars.CMUX_CI_XCODE_APP_MACOS_26 }}
      CMUX_CI_REQUIRED_MACOS_SDK_MAJOR: "26"
      CMUX_TUI_TREE_KEY: ${{ needs.dev-landing-place.outputs.tree_fetch_key }}
    steps:
      - name: Clear stale git locks (self-hosted reused workspace)
        run: rm -f "${GITHUB_WORKSPACE:-$PWD}/.git/index.lock" 2>/dev/null || true
      - name: Checkout
        id: checkout
        continue-on-error: true
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: false
      - name: Discard the workspace repository after a failed checkout
        if: steps.checkout.outcome == 'failure'
        run: rm -rf "$GITHUB_WORKSPACE/.git"
