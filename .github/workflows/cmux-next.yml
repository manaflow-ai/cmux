name: cmux-next

# The cmux-next implementation lives on feat-cmux-next. Keep this inert
# registration on the default branch so workflow_run consumers can subscribe
# to that workflow name before the branch workflow is merged.
on:
  workflow_dispatch:

permissions: {}

jobs:
  registration:
    runs-on: ${{ vars.CI_BLACKSMITH_OFF == '1' && contains(toJSON(github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404'), '"blacksmith-') && (github.event.pull_request && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || 'cmux-fleet-linux-x64') || (github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404') }}
    steps:
      - run: echo "cmux-next is implemented on feat-cmux-next"
