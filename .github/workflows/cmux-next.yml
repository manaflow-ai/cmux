      # The app's web bundles are build output (cx-vn5); the "Verify web
      # Why: docs/ci/cmux-next-workflow-notes.md#note-75
      - name: Source key of the web bundles
        id: web-bundle-key
        if: ${{ inputs.dev_daily != true || steps.dev-product.outputs.hit != 'true' }}
        continue-on-error: true
        run: |
          rm -rf web-bundles-out
          echo "key=$(python3 scripts/cmux-next/web-bundle-key.py . --source)" >> "$GITHUB_OUTPUT"

      # R2 first (feat-cmux-next's bundles, published by the web-bundles job of
      # Why: docs/ci/cmux-next-workflow-notes.md#note-314
      - name: Restore the web bundles from R2
        id: web-bundle-r2
        if: ${{ steps.web-bundle-key.outputs.key != '' }}
        continue-on-error: true
        uses: ./.github/actions/cache-restore
        env:
          CI_CACHE_R2_PUBLIC_URL: https://ci-cache-next.cmux.com
          CI_CACHE_R2_NAMESPACE: any
        with:
          backend: r2
          path: web-bundles-out
          key: cmux-next-web-bundles-v1-${{ steps.web-bundle-key.outputs.key }}

      - name: Restore the web bundles built for this source key
        id: web-bundle-cache
        if: ${{ steps.web-bundle-r2.outputs.cache-hit != 'true' && steps.web-bundle-key.outputs.key != '' }}
        continue-on-error: true
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: web-bundles-out
          key: cmux-next-web-bundles-v1-${{ steps.web-bundle-key.outputs.key }}
          enableCrossOsArchive: true

      # Why: docs/ci/cmux-next-workflow-notes.md#note-315
      - name: Install the restored web bundles
        id: web-bundles-from
        if: ${{ (steps.web-bundle-r2.outputs.cache-hit == 'true' || steps.web-bundle-cache.outputs.cache-hit == 'true') && steps.web-bundle-key.outputs.key != '' }}
        continue-on-error: true
        run: scripts/cmux-next/build-web-bundles.sh --from web-bundles-out

      - name: Setup Bun
        if: ${{ (inputs.dev_daily != true || steps.dev-product.outputs.hit != 'true') && steps.web-bundles-from.outcome != 'success' }}
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"

