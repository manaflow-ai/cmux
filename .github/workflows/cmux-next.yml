          key: ${{ steps.seed-key.outputs.swift-key }}
          restore-keys: ${{ steps.seed-key.outputs.swift-prefix }}

      - name: Replay the seed's input times
        if: ${{ steps.seed-restore.outputs.cache-matched-key != '' && steps.reuse.outputs.hit != 'true' }}
        continue-on-error: true
        env:
          ROOT: ${{ steps.spm-root.outputs.root || github.workspace }}
          SEED_ROOT: ${{ steps.spm-root.outputs.seed }}
        run: |
          python3 scripts/ci/owned_spm_scratch.py drop-bundles "$ROOT/Packages/macOS/CmuxNext/.build"
          python3 -I scripts/ci/e2e_warm_derived_data.py replay "$ROOT" "$ROOT/Packages/macOS/CmuxNext/.build/cmux-fast-tier-input-mtimes.json"
          if [[ "$SEED_ROOT" == 1 ]]; then python3 scripts/ci/owned_spm_scratch.py seeded; fi

      - name: Set up pinned cmux-tui Rust (sidebar layout reducer)
        if: ${{ steps.reuse.outputs.hit != 'true' }}
        uses: ./.github/actions/setup-cmux-tui-rust

      # Why: note-272
      - name: Restore pinned Bun 1.4.4 from the CI cache bucket
        if: ${{ steps.reuse.outputs.hit != 'true' }}
