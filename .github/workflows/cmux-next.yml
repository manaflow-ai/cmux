          if (( rc == 1 )); then
            echo "::warning title=god files (rust)::over the hard ceiling; warn-only (Lawrence 2026-10-10), see this step's log"
          elif (( rc != 0 )); then
            exit "$rc"
          fi

      # Every CmuxNextApp edit re-emits the whole module; the target may only
      # Why: docs/ci/cmux-next-workflow-notes.md#note-137
      - name: CmuxNextApp size cap
        id: app-size
        continue-on-error: true
        env:
          EVENT_NAME: ${{ github.event_name }}
          FULL_CI: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci') }}
          BEFORE: ${{ github.event.before }}
        # A pull request or push that does not grow the App's source passes even
        # over the cap: a pull request compares with its merge commit's first
        # parent, a push with the commit before it (fetched: checkout is depth 2).
        # A push with no before commit (a new branch) keeps the plain cap.
        run: |
          if [[ "$FULL_CI" != true ]]; then
            echo "Size cap is a batch cadence check; ordinary PRs receive the fast tier only."
            exit 0
          fi
          base=()
          [[ "$EVENT_NAME" == pull_request ]] && base=(--base HEAD^1)
          if [[ "$EVENT_NAME" == push && -n "$BEFORE" && "$BEFORE" != 0000000000000000000000000000000000000000 ]]; then
            git cat-file -e "$BEFORE^{commit}" 2>/dev/null \
              || git fetch --no-tags --quiet --depth=1 origin "$BEFORE" || true
            base=(--base "$BEFORE")
          fi
          scripts/cmux-next/check-app-size.sh ${base[@]+"${base[@]}"} "$GITHUB_WORKSPACE"

      - name: No Swift CLI (the cmux CLI is Rust, plans/cmux-next/cli.md)
