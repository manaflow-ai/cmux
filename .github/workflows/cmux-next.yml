name: cmux-next

# Package tests and merge-gate checks for the cmux-next app package
# (Packages/macOS/CmuxNext). `swift test` runs the package's Swift Testing
# suites in-process; it never builds or launches a cmux DEV app. The checks
# are the AGENT-BRIEF merge gate: god files, main-thread concurrency and the
# string tables (the CmuxNext catalogs and InfoPlist).

on:
  pull_request:
    branches: [feat-cmux-next]
    paths:
      - App/**
      - Packages/macOS/**
      - cmux.xcodeproj/**
      - scripts/cmux-next/bundle-*.sh
      - scripts/cmux-next/embed-cef.sh
      - scripts/build-diff-sidecar.sh
      - Packages/macOS/CmuxNext/**
      - Packages/Shared/**
      - Packages/iOS/**
      - cmux-tui/**
      - CLI/**
      - cmuxCLITests/**
      - cmuxCLITestSupport/**
      - Resources/Localizable.xcstrings
      - web/**
      - scripts/ghosttykit-checksums.txt
      - ghostty
      - Resources/InfoPlist.xcstrings
      - scripts/cmux-next/check-*.sh
      - scripts/cmux-next/compile-string-catalogs.sh
      - scripts/cmux-next/prefix-ghosttykit-archives.sh
      - scripts/cmux-next/swift-test-with-hang-sampler.sh
      - scripts/cmux-next/cef-manifest.json
      - scripts/cmux-next/ensure-cef.sh
      - scripts/cmux-next/build-cef-shim.sh
      - scripts/cmux-next/cmux-tui.pin
      - scripts/cmux-next/pin-cmux-tui.sh
      - scripts/ci/run-xcodebuild-with-diagnostics.sh
      - scripts/download-prebuilt-ghosttykit.sh
      - .github/workflows/cmux-next.yml
      - tests/test_cmux_next_checks_workflow.py
  push:
    branches: [main, feat-cmux-next]
    paths:
      - App/**
      - Packages/macOS/**
      - cmux.xcodeproj/**
      - scripts/cmux-next/bundle-*.sh
      - scripts/cmux-next/embed-cef.sh
      - scripts/build-diff-sidecar.sh
      - Packages/macOS/CmuxNext/**
      - Packages/Shared/**
      - Packages/iOS/**
      - cmux-tui/**
      - CLI/**
      - cmuxCLITests/**
      - cmuxCLITestSupport/**
      - Resources/Localizable.xcstrings
      - web/**
      - scripts/ghosttykit-checksums.txt
      - ghostty
      - scripts/download-prebuilt-ghosttykit.sh
      - Resources/InfoPlist.xcstrings
      - scripts/cmux-next/check-*.sh
      - scripts/cmux-next/compile-string-catalogs.sh
      - scripts/cmux-next/prefix-ghosttykit-archives.sh
      - scripts/cmux-next/swift-test-with-hang-sampler.sh
      - scripts/cmux-next/cef-manifest.json
      - scripts/cmux-next/ensure-cef.sh
      - scripts/cmux-next/build-cef-shim.sh
      - scripts/cmux-next/cmux-tui.pin
      - scripts/cmux-next/pin-cmux-tui.sh
      - scripts/ci/run-xcodebuild-with-diagnostics.sh
      - .github/workflows/cmux-next.yml
      - tests/test_cmux_next_checks_workflow.py
  workflow_dispatch:

permissions:
  contents: read

env:
  # The label attempt 1's macOS jobs take when macos-placement finds an idle
  # owned runner for them: a glaeda-* label means a mini. Each macOS job's
  # runs-on, and its own CMUX_NEXT_RUNNER, restate it with the placement.
  CMUX_NEXT_SIDE_ROUTE: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-6vcpu-macos-26' || vars.CI_PR_POOL_OWNED == '1' && contains(fromJSON('["pull_request","push","workflow_dispatch"]'), github.event_name) && github.run_attempt == 1 && vars.CI_SIDE_LANE_RUNNER || vars.MACOS_RUNNER_26 || 'blacksmith-6vcpu-macos-26') }}

concurrency:
  # Pushes and dispatches get a group of their own, as in the other side
  # lanes: when the owned-pool rescue re-runs an older push run, it must not
  # join a group where it would replace (cancel) the newest pending run.
  group: cmux-next-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The macOS jobs run as a side lane, like relay-tls.yml and reload-build.yml:
# attempt 1 of a trusted run (a same-repository pull request, a push or a
# dispatch) may take vars.CI_SIDE_LANE_RUNNER, the minis' glaeda-side-* label,
# while owned pools are on (CI_PR_POOL_OWNED is 1). A fork pull request, any
# re-run, or an unset variable takes the fallback (MACOS_RUNNER_26, else
# Blacksmith). macos-placement decides attempt 1 per job, minis first: a job
# takes the side label when an owned side runner is idle now
# (scripts/ci/side_lane_placement.py, the main picker's idle_placement()), and
# its fallback otherwise, instead of queueing on a busy fleet until the rescue
# cancels the run (49 of 60 runs on 2026-10-02 needed attempt 2). When a job
# took the side label, macos-placement uploads the owned-pool-watch marker:
# ci-owned-pool-rescue.yml's sweeper on main adopts the run
# (owned_pool_rescue.SIDE_WORKFLOW_PATHS) and re-runs a job a mini leaves
# queued or refuses, and that attempt 2 lands on the fallback.
jobs:
  macos-placement:
    # Attempt 1's macOS jobs take an owned side runner only when one is idle
    # now (scripts/ci/side_lane_placement.py); the rest take their fallback.
    # Every step fails open: a skipped or failed placement leaves
    # fallback_jobs empty, so the jobs keep the side label as before and the
    # marker is still uploaded. It runs only where attempt 1's Mac jobs may
    # take the side label (CMUX_NEXT_SIDE_ROUTE's owned branch): a fork, another
    # owner, owned pools off or a re-run starts no Linux runner for it, and the
    # Mac jobs (needs plus !cancelled()) take their route without it. A re-run
    # needs no marker of its own: its Mac jobs take the fallback, and the
    # rescue's watch of a side lane ends at attempt 2.
    if: ${{ (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/feat-cmux-next') && github.repository_owner == 'manaflow-ai' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.CI_PR_POOL_OWNED == '1' && github.run_attempt == 1 }}
    name: cmux-next macOS placement
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 3
    permissions:
      contents: read
    outputs:
      fallback_jobs: ${{ steps.place.outputs.fallback_jobs }}
    steps:
      # The placement code from the base branch, as ci-macos.yml's admission-placement uses it.
      - name: Check out the trusted placement
        if: startsWith(env.CMUX_NEXT_SIDE_ROUTE, 'glaeda-')
        continue-on-error: true
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          sparse-checkout: scripts/ci
          persist-credentials: false

      - name: Mint the owned-pool routing token
        id: route-token
        if: startsWith(env.CMUX_NEXT_SIDE_ROUTE, 'glaeda-') && vars.GLAEDA_ROUTE_APP_ID != ''
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.GLAEDA_ROUTE_APP_ID }}
          private-key: ${{ secrets.GLAEDA_ROUTE_APP_KEY }}
          permission-administration: read
          permission-organization-self-hosted-runners: read

      # In priority order: the scheme compile keeps its DerivedData on a mini
      # (cold on Blacksmith), and only a mini compiles the CEF shim.
      - name: Place the macOS jobs
        id: place
        if: startsWith(env.CMUX_NEXT_SIDE_ROUTE, 'glaeda-')
        continue-on-error: true
        timeout-minutes: 1
        env:
          ROUTE_TOKEN: ${{ steps.route-token.outputs.token }}
          SIDE_LABEL: ${{ env.CMUX_NEXT_SIDE_ROUTE }}
          JOBS: cmux-scheme-compile release-compile swift-test
        run: python3 scripts/ci/side_lane_placement.py

      # Fail-safe: without the marker the run is only not watched. Skipped
      # only when every macOS job took its fallback.
      - name: Mark a run on the minis
        id: marker
        if: startsWith(env.CMUX_NEXT_SIDE_ROUTE, 'glaeda-') && steps.place.outputs.watch != 'false'
        continue-on-error: true
        run: |
          set -euo pipefail
          marker="$RUNNER_TEMP/macos-pool-persistent.json"
          echo '{}' > "$marker"
          echo "path=$marker" >> "$GITHUB_OUTPUT"

      - name: Upload the owned-pool watch marker
        if: ${{ steps.marker.outputs.path != '' }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: owned-pool-watch
          path: ${{ steps.marker.outputs.path }}
          retention-days: 1

  checks:
    if: ${{ github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/feat-cmux-next' }}
    name: cmux-next checks (god files, concurrency, crash safety, l10n)
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # Every check runs even when an earlier one fails; the last step fails the
      # job once, naming each red check. Checkout stays fatal: with no tree,
      # the checks have nothing to read.
      - name: God files and types (Swift)
        id: godfiles-swift
        continue-on-error: true
        run: scripts/cmux-next/check-no-godfiles.sh --only swift "$GITHUB_WORKSPACE/Packages/macOS/CmuxNext"

      - name: God files (cmux-tui Rust)
        id: godfiles-rust
        continue-on-error: true
        run: scripts/cmux-next/check-no-godfiles.sh --only rust "$GITHUB_WORKSPACE/Packages/macOS/CmuxNext"

      - name: No Swift CLI (the cmux CLI is Rust, plans/cmux-next/cli.md)
        id: no-swift-cli
        continue-on-error: true
        run: scripts/cmux-next/check-no-swift-cli.sh "$GITHUB_WORKSPACE"

      - name: Main-thread concurrency
        id: concurrency
        continue-on-error: true
        run: scripts/cmux-next/check-concurrency.sh "$GITHUB_WORKSPACE/Packages/macOS/CmuxNext"

      - name: Crash safety
        id: crash-safety
        continue-on-error: true
        run: scripts/cmux-next/check-crash-safety.sh "$GITHUB_WORKSPACE/Packages/macOS/CmuxNext"

      - name: String tables (21 languages)
        id: l10n
        continue-on-error: true
        run: scripts/cmux-next/check-l10n.sh "$GITHUB_WORKSPACE"

      - name: Module resource bundles
        id: module-resources
        continue-on-error: true
        run: scripts/cmux-next/check-module-resources.sh "$GITHUB_WORKSPACE/Packages/macOS/CmuxNext"

      - name: Checks job structure
        id: checks-structure
        continue-on-error: true
        run: python3 tests/test_cmux_next_checks_workflow.py

      # `outcome`, not `conclusion`: continue-on-error makes every conclusion success.
      - name: Fail on any red check
        if: always()
        env:
          OUTCOMES: |
            ${{ steps.godfiles-swift.outcome }}|God files and types (Swift)
            ${{ steps.godfiles-rust.outcome }}|God files (cmux-tui Rust)
            ${{ steps.no-swift-cli.outcome }}|No Swift CLI (the cmux CLI is Rust, plans/cmux-next/cli.md)
            ${{ steps.concurrency.outcome }}|Main-thread concurrency
            ${{ steps.crash-safety.outcome }}|Crash safety
            ${{ steps.l10n.outcome }}|String tables (21 languages)
            ${{ steps.module-resources.outcome }}|Module resource bundles
            ${{ steps.checks-structure.outcome }}|Checks job structure
        run: |
          failed=()
          # `outcome|name`: an empty outcome (a check that never ran) still names its step.
          while IFS='|' read -r outcome name; do
            [[ -n "$outcome$name" ]] || continue
            [[ "$outcome" == success ]] || failed+=("$name (${outcome:-not run})")
          done <<<"$OUTCOMES"
          if (( ${#failed[@]} == 0 )); then
            echo "All cmux-next checks passed." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "### ${#failed[@]} cmux-next check(s) failed"
            echo
            printf -- '- %s\n' "${failed[@]}"
            echo
            echo "Each check's own step log has the details."
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit 1

  swift-test:
    needs: macos-placement
    if: ${{ !cancelled() && (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/feat-cmux-next') }}
    name: cmux-next swift test
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-6vcpu-macos-26' || vars.CI_PR_POOL_OWNED == '1' && contains(fromJSON('["pull_request","push","workflow_dispatch"]'), github.event_name) && github.run_attempt == 1 && !contains(needs.macos-placement.outputs.fallback_jobs, ' swift-test ') && vars.CI_SIDE_LANE_RUNNER || vars.MACOS_RUNNER_26 || 'blacksmith-6vcpu-macos-26') }}
    # A cold build of the package graph (CmuxNext plus its Shared and iOS test
    # dependencies) and the whole suite.
    timeout-minutes: 60
    env:
      # This job's label (its runs-on): a glaeda-* label means a mini.
      CMUX_NEXT_RUNNER: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-6vcpu-macos-26' || vars.CI_PR_POOL_OWNED == '1' && contains(fromJSON('["pull_request","push","workflow_dispatch"]'), github.event_name) && github.run_attempt == 1 && !contains(needs.macos-placement.outputs.fallback_jobs, ' swift-test ') && vars.CI_SIDE_LANE_RUNNER || vars.MACOS_RUNNER_26 || 'blacksmith-6vcpu-macos-26') }}
      CMUX_CI_XCODE_APP: ${{ vars.CMUX_CI_XCODE_APP_MACOS_26 }}
      # The package deploys to macOS 26, so the test runner needs a macOS 26
      # host and SDK.
      CMUX_CI_REQUIRED_MACOS_SDK_MAJOR: "26"
    steps:
      - name: Clear stale git locks (self-hosted reused workspace)
        shell: bash
        run: |
          ws="${GITHUB_WORKSPACE:-$PWD}"
          rm -f "$ws/.git/index.lock" 2>/dev/null || true

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          # The package graph reads no submodule; the GhosttyKit download only
          # needs the ghostty commit recorded in this tree.
          submodules: false

      - name: Select Xcode
        run: ./scripts/select-ci-xcode.sh

      - name: Download pre-built GhosttyKit.xcframework
        run: |
          set -euo pipefail
          GHOSTTY_SHA="$(git rev-parse HEAD:ghostty)" ./scripts/download-prebuilt-ghosttykit.sh

      # SwiftPM links a binary target's static archive only when its name
      # starts with `lib`; the prebuilt one is `ghostty-internal.a`, so
      # CmuxNextAppTests (through CmuxNextTerminal) failed to link.
      - name: Give GhosttyKit's archives the lib prefix SwiftPM links
        run: scripts/cmux-next/prefix-ghosttykit-archives.sh GhosttyKit.xcframework

      - name: Build package and tests
        id: build-tests
        working-directory: Packages/macOS/CmuxNext
        run: swift build --build-tests

      - name: Regenerate action surface export
        working-directory: Packages/macOS/CmuxNext
        run: |
          CMUX_UPDATE_ACTION_SURFACES=1 \
            swift test --skip-build --filter ActionSurfaceParityTests

      - name: Upload regenerated action surface files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: action-surface-regen
          path: |
            plans/cmux-next/action-surfaces.json
            plans/cmux-next/actions.md

      - name: Compile string catalogs into the resource bundles
        working-directory: Packages/macOS/CmuxNext
        run: ../../../scripts/cmux-next/compile-string-catalogs.sh

      # Samples and fails a run still going after 15 minutes, so a hang shows
      # its stacks; each test step timeout stops it holding the runner regardless.
      # Control tests use tight request deadlines and run in their own process so
      # they do not compete with the other MainActor-isolated suites.
      # The daemon integration tests use the pinned branch build of cmux-tui
      # (scripts/cmux-next/cmux-tui.pin) when it is in the checkout, and fall
      # back to the release client in ~/Library/Caches/cmux/cmux-tui-client.
      # A mini has that cache (release clients lack the cmux-next daemon
      # flags) and Blacksmith has none (the suite skipped), so the verdict
      # depended on the runner. The pinned binary is public and sha256-checked.
      - name: Fetch the pinned cmux-tui
        timeout-minutes: 5
        run: scripts/cmux-next/pin-cmux-tui.sh fetch

      - name: Run package tests (excluding control deadline, WebKit driver and attach stress tests)
        timeout-minutes: 20
        working-directory: Packages/macOS/CmuxNext
        env:
          CMUX_NEXT_TEST_HANG_SECONDS: "900"
        run: ../../../scripts/cmux-next/swift-test-with-hang-sampler.sh --skip-build --skip CmuxNextControlTests --skip CmuxNextBrowserAutomationTests --skip TerminalAttachDriverStressTests

      - name: Run control package tests
        timeout-minutes: 20
        working-directory: Packages/macOS/CmuxNext
        env:
          CMUX_NEXT_TEST_HANG_SECONDS: "900"
        run: ../../../scripts/cmux-next/swift-test-with-hang-sampler.sh --skip-build --filter CmuxNextControlTests

      # The WebKit driver tests drive real WKWebViews against wall-clock load
      # deadlines through main-actor navigation callbacks. They run after the
      # control tests, in a process of their own: the package's other main-actor tests do not delay
      # those callbacks, and a WebKit failure does not skip the control tests.
      - name: Run WebKit driver package tests
        timeout-minutes: 10
        working-directory: Packages/macOS/CmuxNext
        env:
          CMUX_NEXT_TEST_HANG_SECONDS: "420"
        run: ../../../scripts/cmux-next/swift-test-with-hang-sampler.sh --skip-build --filter CmuxNextBrowserAutomationTests

      # The attach driver stress tests run 80 seeded cases at once, each with
      # its own typist, overflow and main-actor layout tasks. In the shared
      # process they queued behind every other main-actor suite (and slowed
      # them) past the time limits on loaded runners; alone, the run is bounded
      # by its fixed work. Runs whenever the build succeeded, even after a failed
      # test step.
      - name: Run attach driver stress tests
        if: ${{ !cancelled() && steps.build-tests.outcome == 'success' }}
        timeout-minutes: 10
        working-directory: Packages/macOS/CmuxNext
        env:
          CMUX_NEXT_TEST_HANG_SECONDS: "420"
        run: ../../../scripts/cmux-next/swift-test-with-hang-sampler.sh --skip-build --filter TerminalAttachDriverStressTests

  release-compile:
    needs: macos-placement
    if: ${{ !cancelled() && (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/feat-cmux-next') }}
    name: cmux-next Release compile (Xcode 26)
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-6vcpu-macos-26' || vars.CI_PR_POOL_OWNED == '1' && contains(fromJSON('["pull_request","push","workflow_dispatch"]'), github.event_name) && github.run_attempt == 1 && !contains(needs.macos-placement.outputs.fallback_jobs, ' release-compile ') && vars.CI_SIDE_LANE_RUNNER || vars.MACOS_RUNNER_26 || 'blacksmith-6vcpu-macos-26') }}
    # One-architecture Release (-O, whole-module) xcodebuild of CmuxNextApp
    # with the nightly's Xcode. Debug `swift build` and Xcode 27 accept code
    # that this rejects; without this job such code fails only the nightly.
    timeout-minutes: 60
    env:
      # This job's label (its runs-on): a glaeda-* label means a mini.
      CMUX_NEXT_RUNNER: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-6vcpu-macos-26' || vars.CI_PR_POOL_OWNED == '1' && contains(fromJSON('["pull_request","push","workflow_dispatch"]'), github.event_name) && github.run_attempt == 1 && !contains(needs.macos-placement.outputs.fallback_jobs, ' release-compile ') && vars.CI_SIDE_LANE_RUNNER || vars.MACOS_RUNNER_26 || 'blacksmith-6vcpu-macos-26') }}
      CMUX_CI_XCODE_APP: ${{ vars.CMUX_CI_XCODE_APP_MACOS_26 }}
      CMUX_CI_REQUIRED_MACOS_SDK_MAJOR: "26"
    steps:
      - name: Clear stale git locks (self-hosted reused workspace)
        shell: bash
        run: |
          ws="${GITHUB_WORKSPACE:-$PWD}"
          rm -f "$ws/.git/index.lock" 2>/dev/null || true

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: false

      - name: Select Xcode
        run: ./scripts/select-ci-xcode.sh

      - name: Download pre-built GhosttyKit.xcframework
        run: |
          set -euo pipefail
          GHOSTTY_SHA="$(git rev-parse HEAD:ghostty)" ./scripts/download-prebuilt-ghosttykit.sh

      - name: Release compile
        run: scripts/cmux-next/check-release-compile.sh "$RUNNER_TEMP/cmux-next-release-compile"

      # On a mini, the CEF glue (CEF's C++ wrapper, the CEFShim dylib and the
      # helper binary) is also compiled against the pinned Chromium engine
      # (scripts/cmux-next/cef-manifest.json), the way the app's Embed CEF
      # phase builds it, so a shim or manifest change the engine does not
      # accept fails here and not in the nightly. ensure-cef.sh fills the
      # mini's kept host cache (scripts/cmux-next/cef-cache-root.sh) from the private R2
      # bucket with the read-only key, which only this step receives and only
      # in same-repository runs, as in ci-macos.yml's admission; later runs
      # read the cache. A runner's own ~/.secrets file is never a source.
      # Blacksmith runs skip both steps: they keep no cache, so each run would
      # pay the download and the wrapper compile. So the check is advisory: a
      # re-run (Blacksmith) or a fork pull request does not repeat it.
      - name: Fetch the Chromium engine
        id: cef
        if: startsWith(env.CMUX_NEXT_RUNNER, 'glaeda-')
        env:
          CMUX_CEF_R2_ACCOUNT_ID: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && secrets.CMUX_CEF_R2_ACCOUNT_ID || '' }}
          CMUX_CEF_R2_ACCESS_KEY_ID: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && secrets.CMUX_CEF_R2_ACCESS_KEY_ID || '' }}
          CMUX_CEF_R2_SECRET_ACCESS_KEY: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && secrets.CMUX_CEF_R2_SECRET_ACCESS_KEY || '' }}
          CMUX_CEF_R2_ENV_FILE: /dev/null
        run: |
          set -euo pipefail
          if cef_dir="$(env -u GH_TOKEN -u GITHUB_TOKEN scripts/cmux-next/ensure-cef.sh --optional)" && [[ -n "$cef_dir" ]]; then
            echo "Chromium engine at $cef_dir"
            echo "dir=$cef_dir" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Chromium engine artifact not readable on this runner; skipping the CEF shim compile"
          fi

      - name: Compile the CEF shim against the pinned engine
        if: steps.cef.outputs.dir != ''
        env:
          CEF_DIR: ${{ steps.cef.outputs.dir }}
        run: scripts/cmux-next/build-cef-shim.sh "$CEF_DIR" "$(scripts/cmux-next/cef-cache-root.sh)/shim"

  cmux-scheme-compile:
    needs: macos-placement
    if: ${{ !cancelled() && (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/feat-cmux-next') }}
    name: cmux app scheme compile (Debug)
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-6vcpu-macos-26' || vars.CI_PR_POOL_OWNED == '1' && contains(fromJSON('["pull_request","push","workflow_dispatch"]'), github.event_name) && github.run_attempt == 1 && !contains(needs.macos-placement.outputs.fallback_jobs, ' cmux-scheme-compile ') && vars.CI_SIDE_LANE_RUNNER || vars.MACOS_RUNNER_26 || 'blacksmith-6vcpu-macos-26') }}
    # Debug arm64 xcodebuild of the cmux app scheme: the app host and every
    # local package it links (CmuxControlSocket, CmuxCore, ...), which the
    # CmuxNext jobs above never compile. A main merge once left
    # CmuxControlSocket extending deleted types and only fleet dev builds
    # failed. On a mini the DerivedData is kept per runner, so a run compiles
    # what changed; Blacksmith builds it cold.
    timeout-minutes: 60
    env:
      # This job's label (its runs-on): a glaeda-* label means a mini.
      CMUX_NEXT_RUNNER: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-6vcpu-macos-26' || vars.CI_PR_POOL_OWNED == '1' && contains(fromJSON('["pull_request","push","workflow_dispatch"]'), github.event_name) && github.run_attempt == 1 && !contains(needs.macos-placement.outputs.fallback_jobs, ' cmux-scheme-compile ') && vars.CI_SIDE_LANE_RUNNER || vars.MACOS_RUNNER_26 || 'blacksmith-6vcpu-macos-26') }}
      CMUX_CI_XCODE_APP: ${{ vars.CMUX_CI_XCODE_APP_MACOS_26 }}
      CMUX_CI_REQUIRED_MACOS_SDK_MAJOR: "26"
    steps:
      - name: Clear stale git locks (self-hosted reused workspace)
        shell: bash
        run: |
          ws="${GITHUB_WORKSPACE:-$PWD}"
          rm -f "$ws/.git/index.lock" 2>/dev/null || true

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: false

      - name: Select Xcode
        run: ./scripts/select-ci-xcode.sh

      - name: Download pre-built GhosttyKit.xcframework
        run: |
          set -euo pipefail
          GHOSTTY_SHA="$(git rev-parse HEAD:ghostty)" ./scripts/download-prebuilt-ghosttykit.sh

      - name: Fetch the pinned cmux-tui
        timeout-minutes: 5
        run: scripts/cmux-next/pin-cmux-tui.sh fetch

      - name: Install Rust (diff sidecar)
        run: ./scripts/install-rust-ci.sh

      - name: Compile the cmux scheme
        run: |
          set -euo pipefail
          if [[ "$CMUX_NEXT_RUNNER" == glaeda-* ]]; then
            derived_data="$HOME/Library/Caches/cmux-next-ci/cmux-scheme/${RUNNER_NAME:-runner}"
            # Nothing on the mini reclaims this cache (glaeda-disk keeps it), so cap
            # it: a cold build leaves about 5 GiB; past 12 GiB start over.
            if [[ -d "$derived_data" ]] && (( $(du -sg "$derived_data" | cut -f1) > 12 )); then
              echo "kept DerivedData over 12 GiB; building cold"
              rm -rf -- "$derived_data"
            fi
          else
            derived_data="$RUNNER_TEMP/cmux-scheme-compile"
          fi
          scripts/cmux-next/check-cmux-scheme-compile.sh "$derived_data"
