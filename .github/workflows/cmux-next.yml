    steps:
      # Why: docs/ci/cmux-next-workflow-notes.md#note-246
      - name: Give this job its own acpmux home
        run: |
          home="$RUNNER_TEMP/acpmux-home"
          rm -rf "$home" && mkdir -m 700 "$home"
          echo "ACPMUX_HOME=$RUNNER_TEMP/acpmux-home" >> "$GITHUB_ENV"
          # An inherited socket would still name another home's daemon; empty is unset.
          echo "ACPMUX_SOCKET=" >> "$GITHUB_ENV"

      - name: Clear stale git locks (self-hosted reused workspace)
        shell: bash
        run: |
          ws="${GITHUB_WORKSPACE:-$PWD}"
          rm -f "$ws/.git/index.lock" 2>/dev/null || true

      - name: Checkout
        id: checkout
        continue-on-error: true
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Why: docs/ci/cmux-next-workflow-notes.md#note-247
          ref: ${{ inputs.same_tree_sha || '' }}
          persist-credentials: false
          # The package graph reads no submodule; GhosttyNextKit comes from
          # SwiftPM (Packages/Shared/CmuxGhosttyKit).
          submodules: false
          fetch-depth: 2

      # Why: docs/ci/cmux-next-workflow-notes.md#note-248
      - name: Discard the workspace repository after a failed checkout
        if: steps.checkout.outcome == 'failure'
        run: rm -rf "$GITHUB_WORKSPACE/.git"

      - name: Retry checkout after transient network failure
        if: steps.checkout.outcome == 'failure'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Why: docs/ci/cmux-next-workflow-notes.md#note-249
          ref: ${{ inputs.same_tree_sha || '' }}
          persist-credentials: false
          # The package graph reads no submodule; GhosttyNextKit comes from
          # SwiftPM (Packages/Shared/CmuxGhosttyKit).
          submodules: false
          fetch-depth: 2

      # Why: docs/ci/cmux-next-workflow-notes.md#note-250
      - name: Drop stale submodule checkouts (self-hosted reused workspace)
        run: scripts/ci/reset-stale-submodules.sh

      # Why: docs/ci/cmux-next-workflow-notes.md#note-56
      - name: Require the GUI session on a mini
        if: ${{ startsWith(env.CMUX_NEXT_RUNNER, 'glaeda-') && github.event_name != 'pull_request' }}
        shell: bash
        run: echo "CMUX_TEST_REQUIRE_GUI=1" >> "$GITHUB_ENV"

      - name: Select Xcode
        run: ./scripts/select-ci-xcode.sh

      # Why: docs/ci/cmux-next-workflow-notes.md#note-251
      - name: Keep Swift package builds on this owned Mac
        if: ${{ contains(runner.name, '-glaeda') }}
        continue-on-error: true
        run: python3 scripts/ci/owned_spm_scratch.py link "$GITHUB_WORKSPACE"

      # Off the owned Macs, start from the build a feat-cmux-next push seeded for the fast tier
      # (cmux-next-fast-tier-seed.yml): the same `swift build --build-tests` of this package at a
      # recent base, at the same workspace path. With the seed's input times replayed, only what
      # this change touched compiles, so a daemon-only change compiles no Swift and goes straight
      # to the tests. The seed's resource bundles are dropped first (owned_spm_scratch.py
      # drop-bundles, as a kept build's are). Any miss builds as before.
      - name: Compute the fast-tier seed keys
        id: seed-key
        if: ${{ !contains(runner.name, '-glaeda') }}
        continue-on-error: true
        run: scripts/cmux-next/fast-tier-cache-key.sh >> "$GITHUB_OUTPUT"

      - name: Restore the CmuxNext build the base seeded
        id: seed-restore
        if: ${{ steps.seed-key.outputs.swift-prefix != '' }}
        continue-on-error: true
        uses: ./.github/actions/cache-restore
        env:
          CI_CACHE_R2_PUBLIC_URL: https://ci-cache-next.cmux.com
        with:
          backend: r2
          path: Packages/macOS/CmuxNext/.build
          key: ${{ steps.seed-key.outputs.swift-key }}
          restore-keys: ${{ steps.seed-key.outputs.swift-prefix }}

      - name: Replay the seed's input times
        if: ${{ steps.seed-restore.outputs.cache-matched-key != '' }}
        continue-on-error: true
        run: |
          python3 scripts/ci/owned_spm_scratch.py drop-bundles Packages/macOS/CmuxNext/.build
          python3 -I scripts/ci/e2e_warm_derived_data.py replay "$GITHUB_WORKSPACE" Packages/macOS/CmuxNext/.build/cmux-fast-tier-input-mtimes.json

      - name: Set up pinned cmux-tui Rust (sidebar layout reducer)
        uses: ./.github/actions/setup-cmux-tui-rust

      # Why: docs/ci/cmux-next-workflow-notes.md#note-252
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"

      # Why: docs/ci/cmux-next-workflow-notes.md#note-253
      - name: Give this job its own bun
        run: scripts/cmux-next/private-bun.sh

      # Why: docs/ci/cmux-next-workflow-notes.md#note-254
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.22.1"

      # Why: docs/ci/cmux-next-workflow-notes.md#note-255
      - name: Source key of the web bundles
        id: web-bundle-key
        run: echo "key=$(python3 scripts/cmux-next/web-bundle-key.py . --source)" >> "$GITHUB_OUTPUT"

      # Why: docs/ci/cmux-next-workflow-notes.md#note-256
      - name: Restore the web bundles from R2
        id: web-bundle-r2
        uses: ./.github/actions/cache-restore
        env:
          CI_CACHE_R2_PUBLIC_URL: https://ci-cache-next.cmux.com
          CI_CACHE_R2_NAMESPACE: any
        with:
          backend: r2
          path: web-bundles-out
          key: cmux-next-web-bundles-v1-${{ steps.web-bundle-key.outputs.key }}

      - name: Restore the web bundles built for this source key
        id: web-bundle-cache
        if: steps.web-bundle-r2.outputs.cache-hit != 'true'
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: web-bundles-out
          key: cmux-next-web-bundles-v1-${{ steps.web-bundle-key.outputs.key }}
          enableCrossOsArchive: true

      - name: Download the web bundles this run's bundle job built
        id: web-bundle-artifact
        if: ${{ (steps.web-bundle-r2.outputs.cache-hit != 'true' && steps.web-bundle-cache.outputs.cache-hit != 'true') && needs.web-bundles.result == 'success' }}
        continue-on-error: true
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: cmux-next-web-bundles-${{ steps.web-bundle-key.outputs.key }}
          path: web-bundles-out

      - name: Install the restored web bundles
        if: steps.web-bundle-r2.outputs.cache-hit == 'true' || steps.web-bundle-cache.outputs.cache-hit == 'true' || steps.web-bundle-artifact.outcome == 'success'
        run: scripts/cmux-next/build-web-bundles.sh --from web-bundles-out

      - name: Build the web bundles
        if: steps.web-bundle-r2.outputs.cache-hit != 'true' && steps.web-bundle-cache.outputs.cache-hit != 'true' && steps.web-bundle-artifact.outcome != 'success'
        run: scripts/cmux-next/build-web-bundles.sh

      - name: Build package and tests
        id: build-tests
        working-directory: Packages/macOS/CmuxNext
        env:
          CMUX_METRICS_WEB_CACHE_OUTCOME: ${{ steps.web-bundle-cache.outcome }}
          CMUX_METRICS_WEB_CACHE_HIT: ${{ steps.web-bundle-r2.outputs.cache-hit == 'true' && 'true' || steps.web-bundle-cache.outputs.cache-hit }}
        run: python3 ../../../scripts/ci/swiftpm_build_metrics.py --role daemon-test --output-dir "$RUNNER_TEMP/cmux-next-build-metrics" -- swift build --build-tests

      - name: Upload the test build measurement and log
        continue-on-error: true
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-next-build-metrics-daemon-test-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cmux-next-build-metrics
          if-no-files-found: ignore
          retention-days: 3

      # Why: docs/ci/cmux-next-workflow-notes.md#note-257
      - name: Check generated action catalog, surfaces and inventory
        id: actions
        if: ${{ env.CMUX_NEXT_FOLD_GENERATED == 'true' }}
        continue-on-error: true
        working-directory: Packages/macOS/CmuxNext
        env:
          CMUX_ACTION_SURFACES_SKIP_BUILD: "1"
        run: ../../../scripts/cmux-next/judge-action-exports.sh "$PWD"

      - name: Check the settings exports
        id: settings
        if: ${{ env.CMUX_NEXT_FOLD_GENERATED == 'true' }}
        continue-on-error: true
        run: scripts/cmux-next/check-settings-exports.sh

      # Why: docs/ci/cmux-next-workflow-notes.md#note-258
      - name: Pack the exports for the base autofix
        id: base-exports
        if: ${{ env.CMUX_NEXT_FOLD_GENERATED == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/feat-cmux-next' && format('{0}', vars.CMUX_NEXT_BASE_EXPORTS_PACK) != '0' }}
        continue-on-error: true
        timeout-minutes: 10
        env:
          CMUX_STRINGS_BEST_EFFORT: "1"
        run: |
          set -euo pipefail
          # A dispatch packs only as the base tier run (its base_tier input, read from the event so this
          # step needs no input the workflow may not declare).
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]] && [[ "$(python3 -I -c 'import json, os; print(str((json.load(open(os.environ["GITHUB_EVENT_PATH"])).get("inputs") or {}).get("base_tier", "")).lower())')" != true ]]; then
            echo "not a base tier dispatch: no pack"
            exit 0
          fi
          scripts/cmux-next/base-autofix-exports-pack.sh "$RUNNER_TEMP/base-exports" | tee -a "$GITHUB_OUTPUT"

      - name: Upload the exports for the base autofix
        if: ${{ steps.base-exports.outcome == 'success' && steps.base-exports.outputs.name != '' }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.base-exports.outputs.name }}
          path: ${{ runner.temp }}/base-exports
          if-no-files-found: error
          retention-days: 1

      - name: Compile string catalogs into the resource bundles
        working-directory: Packages/macOS/CmuxNext
        run: ../../../scripts/cmux-next/compile-string-catalogs.sh

      # Why: docs/ci/cmux-next-workflow-notes.md#note-57
      - name: Clean generated layout-reducer FFI lockfile
        run: |
          lock=cmux-tui/crates/cmux-layout-reducer-ffi/Cargo.lock
          if git ls-files --error-unmatch "$lock" >/dev/null 2>&1; then
            git checkout -- "$lock"
          else
            rm -f "$lock"
          fi

      - name: Fetch the same-tree cmux-tui
        timeout-minutes: 50
        env:
          # Why: docs/ci/cmux-next-workflow-notes.md#note-259
          CMUX_TUI_TREE_WAIT_SECONDS: "120"
          CMUX_TUI_TREE_KEY: ${{ inputs.same_tree_sha == '' && needs.path_route.outputs.tree_fetch_key || '' }}
          # Why: docs/ci/cmux-next-workflow-notes.md#note-260
          CMUX_TUI_TREE_PUBLISHER_SHA: ${{ inputs.same_tree_sha == '' && github.event_name != 'pull_request' && github.sha || '' }}
          GH_TOKEN: ${{ github.token }}
        run: scripts/cmux-next/pin-cmux-tui.sh fetch

      - name: Check the same-tree cmux-tui serves the app's daemon capabilities
        timeout-minutes: 2
        run: scripts/cmux-next/check-daemon-capabilities.sh

      - name: Run the live-daemon suites
        timeout-minutes: 20
        working-directory: Packages/macOS/CmuxNext
        env:
          CMUX_NEXT_TEST_HANG_SECONDS: "900"
          SWT_EXPERIMENTAL_MAXIMUM_PARALLELIZATION_WIDTH: "6"
        run: ../../../scripts/cmux-next/swift-test-with-hang-sampler.sh --skip-build --filter '^(CmuxNextDaemonTests|CmuxNextMobileTests)\.|FirstLaunchTests|MarkdownPageFindTests|FileSourceSwitchTests|ClassicImportTests|ClassicMigrationTests|ClassicUpgradeSimulationTests' --skip BranchStateResourcesTests

      - name: Run state-resource regressions
        if: ${{ !cancelled() && steps.build-tests.outcome == 'success' }}
        timeout-minutes: 10
        working-directory: Packages/macOS/CmuxNext
        env:
          CMUX_NEXT_TEST_HANG_SECONDS: "480"
        run: ../../../scripts/cmux-next/swift-test-with-hang-sampler.sh --skip-build --no-parallel --filter BranchStateResourcesTests

      # Why: docs/ci/cmux-next-workflow-notes.md#note-58
      - name: Regenerate stale files
        id: regenerate
        if: ${{ !cancelled() && (steps.actions.outcome == 'failure' || steps.settings.outcome == 'failure') }}
        run: |
          set -euo pipefail
          if [[ "${{ steps.actions.outcome }}" == failure ]]; then
            scripts/cmux-next/regenerate-action-contracts.sh
          fi
          # A stale settings export was already written into the checkout by the
          # check above.
          # The defaults snapshot reads the action and settings exports, so it
          # follows whichever of them was regenerated.
          python3 scripts/ci/defaults_guard.py snapshot
          # The regenerated files themselves, at their repository paths, so
          # they copy onto the PR head. A diff would be against the merge
          # commit, whose context the head may not have.
          out="$RUNNER_TEMP/generated/files"
          mkdir -p "$out"
          generated=('plans/cmux-next/*.json' 'plans/cmux-next/*.md'
            schemas/settings/settings-schema.json 'docs/mdm/*' schemas/defaults/cmux-next.json)
          git add -N -- "${generated[@]}"
          git diff --name-only -- "${generated[@]}" > "$RUNNER_TEMP/generated/paths.txt"
          git diff --stat
          while IFS= read -r path; do
            mkdir -p "$out/$(dirname "$path")"
            cp "$path" "$out/$path"
          done < "$RUNNER_TEMP/generated/paths.txt"
          cp "$RUNNER_TEMP/generated/paths.txt" "$out/.paths"
          if [[ -s "$RUNNER_TEMP/generated/paths.txt" ]]; then
            echo "patch=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload the regenerated files
        if: ${{ !cancelled() && steps.regenerate.outputs.patch == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-next-generated-patch
          path: ${{ runner.temp }}/generated/files
          include-hidden-files: true
          retention-days: 3

      # Why: docs/ci/cmux-next-workflow-notes.md#note-261
      - name: Give the generated files verdict
        id: generated-files-verdict
        if: ${{ !cancelled() && env.CMUX_NEXT_FOLD_GENERATED == 'true' }}
        env:
          ACTIONS: ${{ steps.actions.outcome }}
          # Why: docs/ci/cmux-next-workflow-notes.md#note-262
          CATALOG: ${{ steps.actions.outputs.catalog }}
          SETTINGS: ${{ steps.settings.outcome }}
        run: |
          if [[ "$ACTIONS" == failure && "$CATALOG" == failure ]]; then
            verdict=catalog
            {
              echo "### The action catalog checks fail: a catalog failure, not stale files"
              echo
              echo "Fresh exports fail the same checks, so regenerating changes nothing. The step \"Check generated action catalog, surfaces and inventory\" names the failing test."
              [[ "$SETTINGS" != failure ]] || echo "- settings exports are also stale: scripts/cmux-next/regenerate-settings-exports.sh"
            } | tee -a "$GITHUB_STEP_SUMMARY"
          elif [[ "$ACTIONS" == failure || "$SETTINGS" == failure ]]; then
            verdict=stale
            {
              echo "### Generated cmux-next files are stale"
              echo
              [[ "$ACTIONS" != failure ]] || echo "- action catalog, surfaces or inventory: scripts/cmux-next/regenerate-action-contracts.sh"
              [[ "$SETTINGS" != failure ]] || echo "- settings exports: scripts/cmux-next/regenerate-settings-exports.sh"
              echo
              echo "The cmux-next-generated-patch artifact holds the regenerated files at their repository paths."
            } | tee -a "$GITHUB_STEP_SUMMARY"
          elif [[ "$ACTIONS" == success && "$SETTINGS" == success ]]; then
            verdict=fresh
          else
            # The build failed or the checks never ran: no verdict, which generated-verdict fails.
            verdict=
          fi
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"

      # Also after a failure or a cancel: end the daemon of this job's home and
      # Why: docs/ci/cmux-next-workflow-notes.md#note-263
      - name: Stop this job's acpmux daemons and remove its home
        if: ${{ always() }}
        continue-on-error: true
        timeout-minutes: 3
        run: |
          home="$RUNNER_TEMP/acpmux-home"
          [[ -d "$home" ]] || exit 0
          acpmux="$(PATH="$PATH:$HOME/.local/bin:$HOME/.cargo/bin:/opt/homebrew/bin:/usr/local/bin" command -v acpmux || true)"
          [[ -z "$acpmux" ]] || env -u ACPMUX_SOCKET ACPMUX_HOME="$home" "$acpmux" daemon shutdown --end-agents || true
          rm -rf "$home"

      - name: Upload the test helper's crash reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: daemon-test-crash-reports-${{ github.run_attempt }}
          path: ${{ runner.temp }}/swift-test-crash-reports
          if-no-files-found: ignore
          retention-days: 3

