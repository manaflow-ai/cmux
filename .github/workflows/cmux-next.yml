  # Why: note-560 (fast-tier-fleet reads the verdict from Linux)
  fast-tier-fleet:
    needs: [macos-placement, fast-tier-rerun-placement, path_route, push-head-preflight, pure-checks-coalesce]
    # Why: note-556
    if: ${{ !cancelled() && needs.pure-checks-coalesce.outputs.run != 'false' && (github.repository_owner == 'manaflow-ai' && inputs.same_tree_sha == '' && inputs.dev_daily != true && needs.push-head-preflight.outputs.current == 'true' && ((github.event_name == 'push' && github.ref == 'refs/heads/feat-cmux-next')) && (contains(needs.macos-placement.outputs.fleet_jobs, ' fast-tier ') && needs.macos-placement.outputs.gateway_attempt == format('{0}', github.run_attempt) || contains(needs.fast-tier-rerun-placement.outputs.fleet_jobs, ' fast-tier ') && needs.fast-tier-rerun-placement.outputs.gateway_attempt == format('{0}', github.run_attempt))) && !(github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'feat-cmux-next' && (github.event.action == 'labeled' || github.event.action == 'unlabeled') && !contains(fromJSON('["full-ci","ready-to-land"]'), github.event.label.name)) }}
    name: cmux-next fast tier (build fleet)
    concurrency:
      group: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'feat-cmux-next' && (github.event.action == 'labeled' || github.event.action == 'unlabeled') && !contains(fromJSON('["full-ci","ready-to-land"]'), github.event.label.name) && format('-label-{0}', github.run_id) || github.event_name == 'push' && format('cmux-next-push-{0}-fast-tier-fleet', github.ref) || format('cmux-next-run-{0}-fast-tier-fleet', github.run_id) }}
      cancel-in-progress: false
    runs-on: cmux-linux
    permissions:
      contents: read
    # Why: note-191
    timeout-minutes: 50
    outputs:
      verdict: ${{ steps.read.outputs.verdict }}
    steps:
      - name: Check out the fleet fast tier reader
        timeout-minutes: 1
        continue-on-error: true
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          sparse-checkout: scripts/ci
          persist-credentials: false

      # Why: note-560
      - name: Read the build fleet's fast tier verdict
        id: read
        env:
          # Why: note-192
          REF: ${{ github.sha }}
          # Why: note-193
          HOME_RENDER_SUITES: MotionTokenTests,IntentMappingTests
          CMUX_NEXT_SUITES: ModelMatrixTests,PaneZoomMotionTests,CEFProfileStorageLogTests,AgentSubagentPanesFocusTests,HandlerCoverageTests,AcpmuxClientTests
          FFI_REPIN: ${{ needs.path_route.outputs.ffi_repin }}
        run: |
          set -uo pipefail
          reader=scripts/ci/fleet_fast_tier_result.py
          verdict=unavailable
          if [[ -f "$reader" ]] && grep -q 'phase=fast-tier\|PHASE = "fast-tier"' "$reader" && command -v python3 >/dev/null; then
            args=(--sha "$REF" --repo "$GITHUB_REPOSITORY" --wait 2700 --queue-wait 1200 --no-record 300)
            if [[ "$FFI_REPIN" == true ]]; then args+=(--ffi-repin); else args+=(--home-render "$HOME_RENDER_SUITES" --cmux-next "$CMUX_NEXT_SUITES"); fi
            verdict="$(python3 "$reader" "${args[@]}" | tail -n1)" || verdict=unavailable
          else
            echo "fleet fast tier: no reader at $REF"
          fi
          case "$verdict" in pass|fail|queued|unavailable) ;; *) verdict=unavailable ;; esac
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
          echo "### cmux-next fast tier on the build fleet: $verdict" >> "$GITHUB_STEP_SUMMARY"
          case "$verdict" in
            pass) exit 0 ;;
            queued) echo "::warning title=Fast tier on the build fleet: still queued::no verdict yet for $REF, so cmux-next fast tier runs the Swift suites itself"; exit 0 ;;
            fail) echo "::error title=Fast tier on the build fleet::a suite failed at $REF; the step lines above name it"; exit 1 ;;
            *) echo "::warning title=Fast tier on the build fleet: no verdict::the results service gave none for $REF; the Mac fallback reads it, else cmux-next fast tier runs the suites itself"; exit 0 ;;
          esac

  # Why: note-4 (fast-tier-fleet-mac, the old gateway client)
  fast-tier-fleet-mac:
    needs: [fast-tier-fleet, macos-placement, fast-tier-rerun-placement, path_route]
    # Why: note-560
    if: ${{ !cancelled() && needs.fast-tier-fleet.outputs.verdict == 'unavailable' && (contains(needs.macos-placement.outputs.fleet_jobs, ' fast-tier ') && needs.macos-placement.outputs.gateway_attempt == format('{0}', github.run_attempt) && needs.macos-placement.outputs.gateway_runner != '' || contains(needs.fast-tier-rerun-placement.outputs.fleet_jobs, ' fast-tier ') && needs.fast-tier-rerun-placement.outputs.gateway_attempt == format('{0}', github.run_attempt) && needs.fast-tier-rerun-placement.outputs.gateway_runner != '') }}
    name: cmux-next fast tier (build fleet, mac fallback)
    concurrency:
      group: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'feat-cmux-next' && (github.event.action == 'labeled' || github.event.action == 'unlabeled') && !contains(fromJSON('["full-ci","ready-to-land"]'), github.event.label.name) && format('-label-{0}', github.run_id) || github.event_name == 'push' && format('cmux-next-push-{0}-fast-tier-fleet-mac', github.ref) || format('cmux-next-run-{0}-fast-tier-fleet-mac', github.run_id) }}
      cancel-in-progress: false
    # Why: note-190
    runs-on: ${{ needs.fast-tier-rerun-placement.outputs.gateway_attempt == format('{0}', github.run_attempt) && needs.fast-tier-rerun-placement.outputs.gateway_runner || needs.macos-placement.outputs.gateway_runner }}
    permissions: {}
    # Why: note-191
    timeout-minutes: 50
    outputs:
      verdict: ${{ steps.client.outputs.verdict }}
    steps:
      - name: Run the fast tier's Swift suites on the build fleet
        id: client
        env:
          # Why: note-192
          REF: ${{ github.sha }}
          # Why: note-193
          HOME_RENDER_SUITES: MotionTokenTests,IntentMappingTests
          CMUX_NEXT_SUITES: ModelMatrixTests,PaneZoomMotionTests,CEFProfileStorageLogTests,HandlerCoverageTests,AcpmuxClientTests
          FFI_REPIN: ${{ needs.path_route.outputs.ffi_repin }}
        run: |
          set -uo pipefail
          echo "::warning title=mac fallback::the build fleet's results service gave no fast tier verdict for $REF; the gateway Mac submits and judges the steps"
          verdict=pass
          reasons=()
          # Why: note-538
          finish() {
            echo "verdict=$1" >> "$GITHUB_OUTPUT"
            {
              echo "### cmux-next fast tier on the build fleet: $1"
              echo
              printf -- '- %s\n' "${reasons[@]}"
            } >> "$GITHUB_STEP_SUMMARY"
            case "$1" in
              pass) exit 0 ;;
              queued) echo "::warning title=Fast tier on the build fleet: still queued::no verdict yet for $REF, so cmux-next fast tier runs the Swift suites itself: ${reasons[*]}"; exit 0 ;;
              fail) echo "::error title=Fast tier on the build fleet::a suite failed at $REF: ${reasons[*]}"; exit 1 ;;
              *) echo "::error title=Fast tier on the build fleet: no verdict::no verdict for $REF, which is never a pass: ${reasons[*]}"; exit 1 ;;
            esac
          }
          if ! [[ "$REF" =~ ^[0-9a-f]{40}$ ]]; then
            reasons+=("the commit to test is not a full sha ('$REF')")
            finish unavailable
          fi
          client="${CMUX_CI_CLIENT:-$HOME/.local/bin/cmux-ci}"
          if ! [[ -x "$client" ]]; then
            reasons+=("$client is not installed on runner $RUNNER_NAME")
            finish unavailable
            # Why: 2026-11-24-fast-tier-fleet-mac-1.md
            # shellcheck disable=SC2317
            exit 1
          fi
          # Why: note-400
          submit() {
            local status=0
            "$client" run --class light --script scripts/ci/package-test-lane.sh --ref "$REF" \
              --arg=suite --arg="$2" --arg="$3" --no-supersede \
              --env=CMUX_SWIFT_PACKAGE_TEST_TIMEOUT_SECONDS=60 \
              --timeout 1500 --queue-timeout 1200 > "$RUNNER_TEMP/fast-tier-fleet-$1.log" 2>&1 || status=$?
            echo "$status" > "$RUNNER_TEMP/fast-tier-fleet-$1.exit"
          }
          if [[ "$FFI_REPIN" == true ]]; then
            submit 2 Packages/macOS/CmuxNext HandlerCoverageTests
          else
            submit 1 Packages/Shared/CmuxHomeRender "$HOME_RENDER_SUITES" &
            first=$!
            submit 2 Packages/macOS/CmuxNext "$CMUX_NEXT_SUITES" &
            second=$!
            wait "$first"
            wait "$second"
          fi
          # Why: note-479
          ref_re='"ref": *"([^"]*)"(.*)'
          digest_re='"source_digest": *"([^"]*)"'
          state_re='"state": *"([a-z_]*)"'
          code_re='"exit_code": *(-?[0-9]+)'
          # Why: 2026-11-24-fast-tier-fleet-mac-2.md
          step_re='^cmux-ci: step ([0-9a-f]{6,64}) '
          judge() {
            local line id="" status="" json="" rest refs=0 state="" code="" step=unavailable why=""
            echo "::group::$2 on the build fleet"
            while IFS= read -r line || [[ -n "$line" ]]; do
              printf '%s\n' "$line"
              # Why: 2026-11-24-fast-tier-fleet-mac-3.md
              if [[ -z "$id" && "$line" =~ $step_re ]]; then id="${BASH_REMATCH[1]}"; fi
            done < "$RUNNER_TEMP/fast-tier-fleet-$1.log"
            echo "::endgroup::"
            read -r status < "$RUNNER_TEMP/fast-tier-fleet-$1.exit" || status=""
            if [[ -z "$id" ]]; then
              why="the client submitted no step (exit ${status:-unknown})"
            elif ! json="$("$client" status "$id" 2>&1)"; then
              why="the controller's record of step $id could not be read"
            else
              rest="$json"
              while [[ "$rest" =~ $ref_re ]]; do
                refs=$((refs + 1))
                if [[ "${BASH_REMATCH[1]}" != "$REF" ]]; then why="step $id tested ${BASH_REMATCH[1]:-no commit}, not $REF"; break; fi
                rest="${BASH_REMATCH[2]}"
              done
              if [[ -z "$why" && "$refs" -eq 0 ]]; then why="step $id's record names no tested commit"; fi
              if [[ -z "$why" && "$json" =~ $digest_re && -n "${BASH_REMATCH[1]}" && "${BASH_REMATCH[1]}" != "$REF" ]]; then
                why="step $id checked out ${BASH_REMATCH[1]}, not $REF"
              fi
              if [[ "$json" =~ $state_re ]]; then state="${BASH_REMATCH[1]}"; fi
              if [[ "$json" =~ $code_re ]]; then code="${BASH_REMATCH[1]}"; fi
            fi
            if [[ -z "$why" ]]; then
              # Why: note-453
              if [[ "$status" == 0 && "$state" == "done" && "$code" == 0 ]]; then
                step=pass; why="$2: every suite passed at $REF (step $id)"
              elif [[ ( "$state" == "failed" || "$state" == "done" ) && "$code" =~ ^-?[0-9]+$ && "$code" -ne 0 ]]; then
                step=fail; why="$2: a suite failed or did not build at $REF (step $id, exit $code); the errors are in its log above"
              elif [[ "$status" == 75 ]]; then
                # Why: note-539
                step=queued; why="$2: step $id still queued after the client's queue wait (client exit 75, step ${state:-unknown})"
              else
                why="$2: no verdict from step $id (client exit ${status:-unknown}, step ${state:-unknown})"
              fi
            fi
            reasons+=("$why")
            echo "$why"
            case "$step" in
              fail) verdict=fail ;;
              unavailable) [[ "$verdict" == fail ]] || verdict=unavailable ;;
              queued) [[ "$verdict" != pass ]] || verdict=queued ;;
            esac
          }
          if [[ "$FFI_REPIN" != true ]]; then judge 1 Packages/Shared/CmuxHomeRender; fi
          judge 2 Packages/macOS/CmuxNext
          finish "$verdict"

