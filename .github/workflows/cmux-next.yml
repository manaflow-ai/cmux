      # The perf gate's source guard without an app (I5: a theme change captures no window and
      # forces no commit): a source scan of seconds, so it stays here while the perf gate itself runs
      # only in the perf cron (cmux-next-perf-budgets.yml); two hits once landed by direct push
      # (36c5b4217488, 715f623c97e1).
      - name: Perf source guard (no window capture or CATransaction.flush)
        id: perf-source-guard
        continue-on-error: true
        run: |
          python3 tests/test_cmux_next_perf_source_guard.py
          python3 -I scripts/cmux-next/check-perf-source-guard.py

      # Gallery fixtures are public sample data the gallery and PR captures render: they name
      # Why: docs/ci/cmux-next-workflow-notes.md#note-157
      - name: No fleet host names in gallery fixtures
        id: fixture-host-names
        continue-on-error: true
        run: |
          python3 tests/test_cmux_next_fixture_host_names.py
          python3 -I scripts/cmux-next/check-fixture-host-names.py

      # Per-PR kill switches (release-notes/next/kill-switches.json): each switch names its PR,
      # Why: docs/ci/cmux-next-workflow-notes.md#note-158
      - name: Kill switches are declared, tied to a PR and unexpired
        id: kill-switches
        continue-on-error: true
        run: |
          python3 tests/test_cmux_next_kill_switches.py
          python3 -I scripts/cmux-next/check-kill-switches.py

      - name: Checks job structure
        id: checks-structure
        continue-on-error: true
        run: scripts/ci/run-checks-concurrently.sh --wait "$RUNNER_TEMP/background-checks" checks-structure

      # Why: docs/ci/cmux-next-workflow-notes.md#note-159
      - name: Tier routing
        id: tier-routing
        continue-on-error: true
        run: scripts/ci/run-checks-concurrently.sh --wait "$RUNNER_TEMP/background-checks" tier-routing

      # Why: docs/ci/cmux-next-workflow-notes.md#note-160
      - name: Package dependency lists sorted
        id: package-dependency-lists
        continue-on-error: true
        run: scripts/ci/run-checks-concurrently.sh --wait "$RUNNER_TEMP/background-checks" package-dependency-lists

      # Why: docs/ci/cmux-next-workflow-notes.md#note-161
      - name: Web bundle key inputs
        id: web-bundle-key-inputs
        continue-on-error: true
        run: scripts/ci/run-checks-concurrently.sh --wait "$RUNNER_TEMP/background-checks" web-bundle-key-inputs

      # Why: docs/ci/cmux-next-workflow-notes.md#note-30
      - name: Prebuilt web bundles install and stamp
        id: web-bundles-from
        continue-on-error: true
        run: bash tests/test_build_web_bundles_from.sh

      # Why: docs/ci/cmux-next-workflow-notes.md#note-162
      - name: Web update pointer
        id: web-ota-pointer
        continue-on-error: true
        run: |
          python3 tests/test_web_ota_publication_contract.py
          bash tests/test_web_ota_pointer.sh

      # The companion workflows' structure: generated-files catch-up and the
      # next-batch landing queue.
      - name: Companion workflows
        id: companion-workflows
        continue-on-error: true
        run: |
          python3 tests/test_cmux_next_generated_catch_up.py
          python3 tests/test_next_batch.py
          python3 tests/test_next_batch_groups.py
          python3 tests/test_cmux_next_base_autofix_finishes.py
          python3 tests/test_base_autofix_pushed_exports.py
          python3 tests/test_cmux_next_pr_autofix_settings.py
          python3 tests/test_cmux_next_pr_changed_paths.py
          python3 tests/test_pr_capture_check_paths.py
          python3 tests/test_car_guards.py
          python3 tests/test_ci_github_token_budget.py
          # Warn-only, exit 0 always: a ::warning for each step that calls the API with the repository
          # GITHUB_TOKEN (1,000 requests an hour, shared by every workflow) and has no line in
          # .github/github-token-budget.json.
          python3 scripts/ci/github_token_budget_lint.py

      # "Red on the base, so not ours" is judged per failing test, and a crash or a cut-short
      # Why: docs/ci/cmux-next-workflow-notes.md#note-163
      - name: Base-red classifier (per test)
        id: base-red-classifier
        continue-on-error: true
        run: |
          python3 tests/test_test_reds.py
          python3 tests/test_base_red_excuse.py
          python3 tests/test_web_coalesce.py

      # The cmux NEXT DEV update script (an unchanged build is left alone; an
      # Why: docs/ci/cmux-next-workflow-notes.md#note-164
      - name: DEV update and classic import scripts
        id: dev-update-classic-import
        continue-on-error: true
        run: |
          python3 tests/test_cmux_next_update_dev_daily.py
          python3 tests/test_cmux_next_classic_to_next.py

      # A pull request that changes the router replays the last 30 merged PRs' changed files
      # Why: docs/ci/cmux-next-workflow-notes.md#note-165
      - name: Routing replay (router changes)
        id: routing-replay
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" != pull_request ]]; then
            echo "Pushes run every tier; the replay checks pull request routing only."
            exit 0
          fi
          if git diff --quiet HEAD^1 HEAD -- scripts/ci/cmux_next_route.py scripts/ci/select_package_tests.py; then
            echo "The router did not change."
            exit 0
          fi
          python3 scripts/ci/cmux_next_route_replay.py --base HEAD^1 --limit 30 | tee -a "$GITHUB_STEP_SUMMARY"

      # Why: docs/ci/cmux-next-workflow-notes.md#note-3 (checks: Check the app FFI pin)
      - name: Check the app FFI pin
        id: app-ffi-pin
        continue-on-error: true
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASH_ENV: ""
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != pull_request ]]; then
            exec scripts/cmux-next/check-app-ffi-pin.sh --verify-release --stale-grace 7200
          fi
          work="$(/usr/bin/mktemp -d "${RUNNER_TEMP:-/tmp}/app-ffi-pin.XXXXXX")"
          /bin/mkdir "$work/home" "$work/code"
          exec /usr/bin/env -i PATH=/usr/bin:/bin HOME="$work/home" \
            GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_NO_REPLACE_OBJECTS=1 GIT_LFS_SKIP_SMUDGE=1 \
            GIT_CONFIG_COUNT=2 GIT_CONFIG_KEY_0=core.hooksPath GIT_CONFIG_VALUE_0=/dev/null \
            GIT_CONFIG_KEY_1=core.fsmonitor GIT_CONFIG_VALUE_1=false \
            MERGE="$GITHUB_SHA" CODE="$work/code" CHECKOUT="$PWD" /bin/bash -euo pipefail -c '
            cd "$CHECKOUT"
            [[ "$(git rev-parse HEAD)" == "$MERGE" ]] \
              || { echo "error: the checkout HEAD is not the merge commit $MERGE" >&2; exit 1; }
            base="$(git cat-file commit "$MERGE" | awk "\$1 == \"parent\" && !found { print \$2; found = 1 }")"
            base="$(git rev-parse --verify "$base^{commit}")"
            code="$CODE"
            # The blobs as the base commit stores them: no attribute (export-ignore, a filter) applies.
            mkdir -p "$code/scripts/cmux-next" "$code/scripts/ci"
            git cat-file blob "$base:scripts/cmux-next/check-app-ffi-pin.sh" >"$code/scripts/cmux-next/check-app-ffi-pin.sh"
            git cat-file blob "$base:scripts/ci/app_ffi_pin.py" >"$code/scripts/ci/app_ffi_pin.py"
            if ! grep -q -e "--tree)" "$code/scripts/cmux-next/check-app-ffi-pin.sh"; then
              # Only while the base predates --tree (the pull request that adds it).
              echo "note: the base check has no --tree; the checkout copy runs"
              exec scripts/cmux-next/check-app-ffi-pin.sh --verify-release --base "$base"
            fi
            tree="$code/tree"
            git worktree add --quiet --detach "$tree" "$MERGE"
            status=0
            bash "$code/scripts/cmux-next/check-app-ffi-pin.sh" --verify-release --base "$base" --tree "$tree" || status=$?
            git worktree remove --force "$tree" || true
            exit "$status"
          '

      # plans/cmux-next/daemon-capabilities.json against the lists in
      # Why: docs/ci/cmux-next-workflow-notes.md#note-166
      - name: Daemon capabilities export is fresh
        id: daemon-capabilities-fresh
        continue-on-error: true
        run: python3 scripts/cmux-next/check-daemon-capabilities-fresh.py

      # Why: docs/ci/cmux-next-workflow-notes.md#note-167
      - name: App capability references are listed
        id: app-capability-references
        continue-on-error: true
        run: python3 -I scripts/cmux-next/check-app-capability-references.py --repo .

      # Why: docs/ci/cmux-next-workflow-notes.md#note-168
      - name: Capability texts never say update the app
        id: capability-text
        continue-on-error: true
        run: bash scripts/cmux-next/tests/capability-text.test.sh
      # Why: docs/ci/cmux-next-workflow-notes.md#note-169
      - name: Pushed commits add no violations
        id: pushed-commits
        continue-on-error: true
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          # Sidebar look owner sweep (plans/cmux-next/sidebar-owner.md): every commit since the check landed,
          # not only this push's, so a commit from an old hook copy or a cancelled run is still named.
          # From where the check widened to the whole sidebar package (Views/ only before; that range swept clean).
          sidebar_from=342462ca6ee97db1d23f013ad0d58dc942673c82
          sweep=0
          # Commits and trees only (--filter=blob:none): the sweep reads messages and changed paths, and
          # the gate's few blobs come on demand. The full fetch of 2000 commits took 2-7 min of the job's
          # 10 on a push (401 s measured from a fresh depth-2 clone; blobless: 27 s). Same history as before.
          git fetch --no-tags --quiet --filter=blob:none --deepen=2000 origin "$GITHUB_SHA" || true
          # A pull request is judged on its own commits (HEAD^1..HEAD of the merge): a base commit without the
          # owner's record is a warning naming it here, and stays an error on every push sweep of the branch.
          own=()
          # pull_request only: there HEAD is GitHub's merge of the PR into its base; a dispatch runs on a branch tip.
          [[ "$EVENT_NAME" == pull_request ]] && own=(--own-range HEAD^1..HEAD)
          if git merge-base --is-ancestor "$sidebar_from" HEAD 2>/dev/null; then
            python3 -I scripts/cmux-next/prepush-gate.py --only sidebar --commits "$sidebar_from..HEAD" "${own[@]}" \
              | tee -a "$GITHUB_STEP_SUMMARY" || sweep=$?
          fi
          if [[ "$EVENT_NAME" != push ]]; then
            python3 -I scripts/cmux-next/prepush-gate.py --base HEAD^1 --head HEAD
            exit "$sweep"
          fi
          range="HEAD^1..HEAD"
          if [[ -n "$BEFORE" && "$BEFORE" != 0000000000000000000000000000000000000000 ]]; then
            git fetch --no-tags --quiet --filter=blob:none --depth=200 origin "$GITHUB_SHA" "$BEFORE" || true
            if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then range="$BEFORE..HEAD"; fi
          fi
          python3 -I scripts/cmux-next/prepush-gate.py --commits "$range" | tee -a "$GITHUB_STEP_SUMMARY"
          exit "$sweep"

      # `outcome`, not `conclusion`: continue-on-error makes every conclusion success.
      # Why: docs/ci/cmux-next-workflow-notes.md#note-31
      - name: Fail on any red check
        if: always()
        env:
          # Why: docs/ci/cmux-next-workflow-notes.md#note-170
          BASH_ENV: ""
          STYLE_CHECKS: |
            God files and types (Swift)
            God files (cmux-tui Rust)
            CmuxNextApp size cap
            No Swift CLI (the cmux CLI is Rust, plans/cmux-next/cli.md)
            No Swift closed history (the daemon owns it, plans/cmux-next/reopen-closed.md 9)
            No process scanning (holders register themselves, plans/cmux-next/pty-holder.md 4)
            Scrollbars thin, one style
            Motion tokens
            Overlays are glass, never solid
            Type scale
            Menu metrics
            Surface roles
            Protected-folder copies
            Settings source copies
            Backdrop art export
            Package conventions lint
            Browser chrome icons
            Dialog buttons show their keys (u2647)
            One omnibar (popups, New Tab and tabs share AddressBarView)
            Pushed commits add no violations
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_API_URL: ${{ github.api_url }}
          OUTCOMES: |
            ${{ steps.godfiles-swift.outcome }}|God files and types (Swift)
            ${{ steps.godfiles-rust.outcome }}|God files (cmux-tui Rust)
            ${{ steps.app-size.outcome }}|CmuxNextApp size cap
            ${{ steps.no-swift-cli.outcome }}|No Swift CLI (the cmux CLI is Rust, plans/cmux-next/cli.md)
            ${{ steps.no-swift-closed-history.outcome }}|No Swift closed history (the daemon owns it, plans/cmux-next/reopen-closed.md 9)
            ${{ steps.single-omnibar.outcome }}|One omnibar (popups, New Tab and tabs share AddressBarView)
            ${{ steps.react-pages.outcome }}|React pages are listed (native chrome and Home are Swift)
            ${{ steps.no-swiftui.outcome }}|No new SwiftUI (macOS UI is AppKit)
            ${{ steps.no-process-scan.outcome }}|No process scanning (holders register themselves, plans/cmux-next/pty-holder.md 4)
            ${{ steps.default-cursor.outcome }}|Default cursor (no pointing hand in app UI)
            ${{ steps.state-roots.outcome }}|No literal state roots (per-build isolation S7, cx-is1kf.8)
            ${{ steps.dialog-key-hints.outcome }}|Dialog buttons show their keys (u2647)
            ${{ steps.concurrency.outcome }}|Main-thread concurrency
            ${{ steps.webview-factory.outcome }}|One web view factory
            ${{ steps.crash-safety.outcome }}|Crash safety
            ${{ steps.test-notification-centers.outcome }}|Tests inject their notification center
            ${{ steps.l10n.outcome }}|String tables (21 languages)
            ${{ steps.module-resources.outcome }}|Module resource bundles
            ${{ steps.scrollbars.outcome }}|Scrollbars thin, one style
            ${{ steps.motion.outcome }}|Motion tokens
            ${{ steps.overlay-glass.outcome }}|Overlays are glass, never solid
            ${{ steps.type-scale.outcome }}|Type scale
            ${{ steps.layout-grid.outcome }}|Layout grid
            ${{ steps.ui-font.outcome }}|UI font (the system font)
            ${{ steps.motion-scale.outcome }}|Motion scale
            ${{ steps.motion-tokens.outcome }}|Motion and colour tokens
            ${{ steps.menu-metrics.outcome }}|Menu metrics
            ${{ steps.surface-roles.outcome }}|Surface roles
            ${{ steps.protected-folders.outcome }}|Protected-folder copies
            ${{ steps.settings-sources.outcome }}|Settings source copies
            ${{ steps.phone-lane-fields.outcome }}|Phone lane field allowlist
            ${{ steps.backdrop-art.outcome }}|Backdrop art export
            ${{ steps.stale-pcm-cleanup.outcome }}|Stale scheme PCM cleanup
            ${{ steps.script-tests.outcome }}|Script tests (pin-cmux-tui, embed-cef, ensure-cef store)
            ${{ steps.ghostty-resources-bundle.outcome }}|Ghostty resources bundle
            ${{ steps.bundled-terminfo.outcome }}|Bundled terminfo
            ${{ steps.package-conventions.outcome }}|Package conventions lint
            ${{ steps.browser-chrome-icons.outcome }}|Browser chrome icons
            ${{ steps.capability-text.outcome }}|Capability texts never say update the app
            ${{ steps.app-store-rules.outcome }}|App Store review rules (cmux-next-ios intents, Info.plist)
            ${{ steps.perf-source-guard.outcome }}|Perf source guard (no window capture or CATransaction.flush)
            ${{ steps.fixture-host-names.outcome }}|No fleet host names in gallery fixtures
            ${{ steps.kill-switches.outcome }}|Kill switches are declared, tied to a PR and unexpired
            ${{ steps.checks-structure.outcome }}|Checks job structure
            ${{ steps.tier-routing.outcome }}|Tier routing
            ${{ steps.package-dependency-lists.outcome }}|Package dependency lists sorted
            ${{ steps.web-bundle-key-inputs.outcome }}|Web bundle key inputs
            ${{ steps.web-bundles-from.outcome }}|Prebuilt web bundles install and stamp
            ${{ steps.web-ota-pointer.outcome }}|Web update pointer
            ${{ steps.companion-workflows.outcome }}|Companion workflows
            ${{ steps.base-red-classifier.outcome }}|Base-red classifier (per test)
            ${{ steps.dev-update-classic-import.outcome }}|DEV update and classic import scripts
            ${{ steps.routing-replay.outcome }}|Routing replay (router changes)
            ${{ steps.app-ffi-pin.outcome }}|Check the app FFI pin
            ${{ steps.daemon-capabilities-fresh.outcome }}|Daemon capabilities export is fresh
            ${{ steps.app-capability-references.outcome }}|App capability references are listed
            ${{ steps.pushed-commits.outcome }}|Pushed commits add no violations
        run: |
          failed=()
          warned=()
          # `outcome|name`: an empty outcome (a check that never ran) still names its step.
          while IFS='|' read -r outcome name; do
            [[ -n "$outcome$name" ]] || continue
            [[ "$outcome" == success ]] && continue
            if [[ "$outcome" == failure && "${CMUX_NEXT_STYLE_GUARDS:-}" == warn ]] \
              && grep -qxF -- "$name" <<<"${STYLE_CHECKS:-}"; then
              warned+=("$name")
              continue
            fi
            failed+=("$name (${outcome:-not run})")
          done <<<"$OUTCOMES"
          # A push names which reds it added and which the previous tip already had, but every
          # red keeps the job red. Turning inherited reds into warnings (0150fc73e3e) made the
          # tip's checks job green while its checks were red: base_red_checks.py excused every red
          # while the previous tip was still pending, which on a branch with ~100 merges a day is
          # nearly always, so new reds landed unseen; and the PR-side comparisons
          # (pr_red_checks_comment.py, base_red_excuse.py, next-autoland) read the green tip as
          # "green on the base" and charged the base's reds to every open pull request
          # (2026-10-30: 252 of 660 open PRs red on four base reds, no autoland merge in 24 h).
          if [[ "$EVENT_NAME" == push && "$BEFORE" =~ ^[0-9a-f]{40}$ && ! "$BEFORE" =~ ^0+$ && ${#failed[@]} -gt 0 ]]; then
            current="$RUNNER_TEMP/cmux-next-red-checks.txt"
            printf '%s\n' "${failed[@]}" | sed -E 's/ \((failure|timed_out|cancelled|not run)\)$//' >"$current"
            base_out="$RUNNER_TEMP/cmux-next-base-red.out"
            if python3 scripts/ci/base_red_checks.py --repo "$GITHUB_REPOSITORY" --before "$BEFORE" --current "$current" >"$base_out"; then
              while read -r kind name; do
                [[ -n "$kind$name" ]] || continue
                if [[ "$kind" == BASE_RED ]]; then
                  echo "::notice title=cmux-next base red::$name was already red on $BEFORE (or that tip had not finished)"
                else
                  echo "::error title=cmux-next new red::$name is new in this push (green on $BEFORE): fix it first, every open pull request inherits it"
                fi
              done <"$base_out"
            else
              echo "::warning title=cmux-next base-red::could not read the previous tip to tell new reds from inherited ones"
            fi
          fi
          for name in "${warned[@]+"${warned[@]}"}"; do
            echo "::warning title=cmux-next style guard (warn-only)::$name found issues; see that step's log"
          done
          if (( ${#warned[@]} > 0 )); then
            {
              echo "### ${#warned[@]} style guard(s) reported findings (warn-only)"
              echo
              printf -- '- %s\n' "${warned[@]}"
              echo
            } | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          if (( ${#failed[@]} == 0 )); then
            echo "All blocking cmux-next checks passed." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # One annotation per red check: the red-checks line compares them with the base's run, so a
          # new red check is told from a base one (scripts/ci/pr_red_checks_comment.py).
          for name in "${failed[@]}"; do echo "::error title=cmux-next check::red check: ${name% (*}"; done
          {
            echo "### ${#failed[@]} cmux-next check(s) failed"
            echo
            printf -- '- %s\n' "${failed[@]}"
            echo
            echo "Each check's own step log has the details."
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit 1

  # Reports a same-tree cmux-tui that nothing will publish, in red, at once.
  # Why: docs/ci/cmux-next-workflow-notes.md#note-32
  web-bundles:
    needs: path_route
    if: ${{ !cancelled() && needs.path_route.result == 'success' && (inputs.dev_daily == true || inputs.same_tree_sha == '') && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository || contains(github.event.pull_request.labels.*.name, 'full-ci')) && (needs.path_route.outputs.swift == 'true' || needs.path_route.outputs.daemon == 'true' || needs.path_route.outputs.generated == 'true')) }}
    name: cmux-next web bundles (source-keyed cache)
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-4vcpu-ubuntu-2404' || !startsWith(vars.LINUX_RUNNER, 'blacksmith-') && vars.LINUX_RUNNER || vars.CI_CLOUD_OVERFLOW_SAVED && fromJSON(vars.RUNNER_POOLS).linux_8 || fromJSON(vars.RUNNER_POOLS).linux_4 }}
    timeout-minutes: 15
    # Why: docs/ci/cmux-next-workflow-notes.md#note-171
    environment: ${{ github.ref == 'refs/heads/feat-cmux-next' && 'next-cache-writer' || '' }}
    env:
      CI_CACHE_R2_BUCKET: cmux-ci-cache-next
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Why: docs/ci/cmux-next-workflow-notes.md#note-172
          ref: ${{ inputs.same_tree_sha || '' }}
          persist-credentials: false

      # Why: docs/ci/cmux-next-workflow-notes.md#note-173
      - name: Drop stale submodule checkouts (self-hosted reused workspace)
        run: scripts/ci/reset-stale-submodules.sh

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"

      # Why: docs/ci/cmux-next-workflow-notes.md#note-174
      - name: Give this job its own bun
        run: scripts/cmux-next/private-bun.sh

      # Why: docs/ci/cmux-next-workflow-notes.md#note-175
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.22.1"

      - name: Source key of the web bundles
        id: web-bundle-key
        run: echo "key=$(python3 scripts/cmux-next/web-bundle-key.py . --source)" >> "$GITHUB_OUTPUT"

      - name: Look up the cached web bundles
        id: web-bundle-cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: web-bundles-out
          key: cmux-next-web-bundles-v1-${{ steps.web-bundle-key.outputs.key }}
          enableCrossOsArchive: true

      # Why: docs/ci/cmux-next-workflow-notes.md#note-176
      - name: Cache the webviews Bun package cache
        if: steps.web-bundle-cache.outputs.cache-hit != 'true'
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.bun/install/cache
          key: bun-webviews-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('webviews/bun.lock') }}

      - name: Build the web bundles for this source key
        if: steps.web-bundle-cache.outputs.cache-hit != 'true'
        run: scripts/cmux-next/build-web-bundles.sh --out-root "$GITHUB_WORKSPACE/web-bundles-out"

      - name: Cache the web bundles under this source key
        if: steps.web-bundle-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: web-bundles-out
          key: cmux-next-web-bundles-v1-${{ steps.web-bundle-key.outputs.key }}
          enableCrossOsArchive: true

      # The minis cannot read this cache: on Blacksmith it is Blacksmith's own
      # cache, which a self-hosted Mac never sees (2026-10-26: swift test rebuilt
      # the bundles on 14 of 25 sampled jobs, generated files on 12 of 44, 40 s
      # of Mac time each). So a run that does not publish them to R2 (every
      # event but a feat-cmux-next push) also hands them to its own Mac jobs as
      # an artifact named after the source key; a Mac job whose sources give
      # the same key installs it instead of building.
      - name: Hand the web bundles to this run's Mac jobs
        if: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/feat-cmux-next') }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-next-web-bundles-${{ steps.web-bundle-key.outputs.key }}
          path: web-bundles-out
          if-no-files-found: error
          retention-days: 1
          overwrite: true

      # The Mac jobs read the bundles from R2's CDN first: the minis download
      # them from there much faster than from the GitHub cache, and every
      # pull request whose web sources match feat-cmux-next's hits. The `any`
      # namespace is shared by every OS (the bundles are platform-independent).
      # A key that is already stored is not uploaded again. A DEV daily run does not publish:
      # its DEV Release compile reads this run's GitHub cache entry when R2 has no copy.
      - name: Publish the web bundles to R2 (feat-cmux-next push)
        if: ${{ github.repository == 'manaflow-ai/cmux' && github.event_name == 'push' && github.ref == 'refs/heads/feat-cmux-next' }}
        continue-on-error: true
        uses: ./.github/actions/cache-save
        env:
          CI_CACHE_R2_PUBLIC_URL: https://ci-cache-next.cmux.com
          CI_CACHE_R2_NAMESPACE: any
          AWS_ACCESS_KEY_ID: ${{ secrets.CI_CACHE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CI_CACHE_R2_SECRET_ACCESS_KEY }}
          CI_CACHE_R2_ENDPOINT: ${{ format('https://{0}.r2.cloudflarestorage.com', secrets.CI_CACHE_R2_ACCOUNT_ID) }}
        with:
          backend: r2
          path: web-bundles-out
          key: cmux-next-web-bundles-v1-${{ steps.web-bundle-key.outputs.key }}


  same-tree-cmux-tui:
    needs: [path_route, push-head-preflight]
    # Why: docs/ci/cmux-next-workflow-notes.md#note-177
    if: ${{ !cancelled() && github.event_name != 'pull_request' && inputs.same_tree_origin != 'pull_request' && (((needs.path_route.outputs.tree_state == 'failed' || needs.path_route.outputs.tree_state == 'ready') && needs.push-head-preflight.outputs.current == 'true') || (inputs.same_tree_sha != '' && (inputs.same_tree_state == 'failed' || inputs.same_tree_state == 'ready'))) }}
    name: same-tree cmux-tui
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.CI_CLOUD_OVERFLOW_SAVED && (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-8vcpu-ubuntu-2404' || fromJSON(vars.RUNNER_POOLS).linux_8) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-2vcpu-ubuntu-2404' || fromJSON(vars.RUNNER_POOLS).linux_2) }}
    permissions:
      statuses: write
      actions: write
      contents: read
    timeout-minutes: 3
    steps:
      - name: Report the ready same-tree cmux-tui
        if: ${{ (inputs.same_tree_sha != '' && inputs.same_tree_state || needs.path_route.outputs.tree_state) == 'ready' }}
        env:
          KEY: ${{ needs.path_route.outputs.tree_key }}
        run: echo "same-tree cmux-tui ${KEY:+tree $KEY }is ready"
      - name: Check out the takeover script
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          sparse-checkout: scripts/ci
      # Why: docs/ci/cmux-next-workflow-notes.md#note-177 (a re-run reads the tree's publish record)
      - name: Report the unavailable same-tree cmux-tui
        id: unavailable
        if: ${{ (inputs.same_tree_sha != '' && inputs.same_tree_state || needs.path_route.outputs.tree_state) == 'failed' }}
        env:
          REASON: ${{ inputs.same_tree_reason || needs.path_route.outputs.tree_reason }}
          KEY: ${{ needs.path_route.outputs.tree_key }}
          COMMIT: ${{ inputs.same_tree_sha }}
          STATUS_SHA: ${{ inputs.same_tree_status_sha }}
          TIERS: ${{ inputs.same_tree_tiers }}
          ORIGIN: ${{ inputs.same_tree_origin }}
          ORIGIN_RUN: ${{ inputs.same_tree_origin_run }}
          REF_NAME: ${{ github.ref_name }}
          REF_KIND: ${{ github.ref_type == 'tag' && 'tags' || 'heads' }}
          DEV_DAILY_SHA: ${{ inputs.dev_daily == true && inputs.dev_daily_sha || '' }}
          TIP_SUITE: ${{ inputs.tip_daemon_suite == true && 'daemon' || inputs.base_tier == true && 'base' || '' }}
          DEV_DAILY: ${{ inputs.dev_daily == true && 'true' || 'false' }}
          GH_TOKEN: ${{ github.token }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [[ -n "$COMMIT" ]]; then
            # The tree's publish record, read now: a re-run of this run (same inputs) after a later
            # publication dispatches the ready tree jobs instead of repeating the old verdict. Not
            # published: it writes this run's marker (reported), uploaded below for the key's next publish.
            marker="$RUNNER_TEMP/cmux-next-tree-wait/marker.json"
            if python3 scripts/ci/cmux_next_same_tree_failed.py --repo "$GITHUB_REPOSITORY" --ref "$REF_NAME" \
                --ref-kind "$REF_KIND" --reason "$REASON" --key "$KEY" --commit "$COMMIT" --status-sha "$STATUS_SHA" \
                --tiers "$TIERS" --origin "$ORIGIN" --origin-run "$ORIGIN_RUN" --dev-daily-sha "$DEV_DAILY_SHA" \
                ${TIP_SUITE:+--tip-suite "$TIP_SUITE"} --marker "$marker" --output "$GITHUB_OUTPUT"; then
              echo "::notice title=same-tree cmux-tui published::the tree was published after this run was dispatched; its tree jobs were dispatched again (ready)"; exit 0
            fi
            [[ -f "$marker" ]] && echo "marker=$marker" >> "$GITHUB_OUTPUT"
          fi
          if [[ -n "$COMMIT" ]] && python3 scripts/ci/cmux_tui_tree_takeover.py --repo "$GITHUB_REPOSITORY" --commit "$COMMIT" --key "$KEY" --reason "$REASON"; then
            echo "::notice title=same-tree cmux-tui taken over::$REASON"; exit 0
          fi
          echo "::error title=same-tree cmux-tui unavailable::${KEY:+tree $KEY: }${REASON:-no reason given}"
          if [[ "$STATUS_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            for tier in ${TIERS//,/ }; do
              case "$tier" in
                daemon) context="cmux-next daemon tests (same-tree)" ;;
                scheme)
                  if [[ "$DEV_DAILY" == true ]]; then
                    context="cmux NEXT DEV Release compile (same-tree)"
                  else
                    context="cmux app scheme compile (Debug) (same-tree)"
                  fi ;;
                *) continue ;;
              esac
              scripts_status="$(python3 -c 'import json,sys; print(json.dumps({"state": "failure", "context": sys.argv[1], "target_url": sys.argv[2], "description": "same-tree cmux-tui unavailable"}))' "$context" "$TARGET_URL")"
              curl -fsS -o /dev/null -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
                "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$STATUS_SHA" -d "$scripts_status" \
                || echo "::warning::could not post the $context status"
            done
          fi
          exit 1
      # The record of this run's red, keyed by its tree: the key's next publication re-dispatches every tier
      # it reported (cmux_next_tree_notify.py), whatever became of the marker that started this run.
      - name: Upload the reported tree wait marker
        if: ${{ !cancelled() && steps.unavailable.outputs.marker != '' && steps.unavailable.outputs.key != '' }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-next-tree-wait-${{ steps.unavailable.outputs.key }}
          path: ${{ steps.unavailable.outputs.marker }}
          retention-days: 7
          overwrite: true

  # The build fleet's compile verdict for the Swift canary. Opt-in: with the
  # Why: docs/ci/cmux-next-workflow-notes.md#note-33
  swift-canary-fleet:
    needs: [path_route, push-head-preflight, macos-placement]
    # Why: docs/ci/cmux-next-workflow-notes.md#note-178
    if: ${{ !cancelled() && github.repository_owner == 'manaflow-ai' && vars.CI_COMPILE_CHECK_GATEWAY != '' && needs.path_route.outputs.swift_canary == 'true' && needs.push-head-preflight.outputs.current == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && needs.macos-placement.outputs.gateway_attempt == format('{0}', github.run_attempt) && needs.macos-placement.outputs.gateway_runner != '' }}
    name: cmux-next Swift canary (build fleet)
    concurrency:
      group: ${{ github.event_name == 'pull_request' && format('cmux-next-pr-{0}-swift-canary-fleet', github.event.pull_request.number) || github.event_name == 'push' && format('cmux-next-push-{0}-swift-canary-fleet', github.ref) || format('cmux-next-run-{0}-swift-canary-fleet', github.run_id) }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: ${{ needs.macos-placement.outputs.gateway_runner }}
    permissions: {}
    timeout-minutes: 30
    outputs:
      verdict: ${{ steps.check.outputs.verdict }}
    steps:
      # Why: docs/ci/cmux-next-workflow-notes.md#note-34
      - name: Compile-check CmuxNext on the build fleet
        id: check
        env:
          REF: ${{ github.sha }}
          SWIFT_CANARY_TARGETS: ${{ needs.path_route.outputs.swift_canary_targets }}
        run: |
          set -uo pipefail
          # Production targets of Packages/macOS/CmuxNext that the app
          # executable does not link (ci-target-graph.json: not reachable from
          # CmuxNextApp). The app check cannot vouch for them.
          for target in $SWIFT_CANARY_TARGETS; do
            case "$target" in
              CmuxNextServerHelperDaemon|CmuxNextUiLayerPreview)
                echo "::notice title=Build fleet compile check::$target is not linked into the app; the Mac canary runs."
                echo "verdict=unavailable" >> "$GITHUB_OUTPUT"
                exit 0 ;;
            esac
          done
          # A gateway without the client has no verdict (cmux17, run 39573725240).
          client="${CMUX_CI_CLIENT:-$HOME/.local/bin/cmux-ci}"
          if ! [[ -x "$client" ]]; then
            echo "::notice title=Build fleet compile check::$client is not installed on runner $RUNNER_NAME; the Mac canary runs."
            echo "verdict=unavailable" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          status=0
          "$client" compile-check --ref "$REF" --app \
            --timeout 1200 --queue-timeout 300 2>"$RUNNER_TEMP/compile-check.stderr" || status=$?
          case "$status" in
            0) verdict=pass ;;
            1) verdict=fail; echo "::notice title=Build fleet compile check::CmuxNext did not compile on the build fleet; the Mac canary runs and shows the errors." ;;
            *) verdict=unavailable; echo "::notice title=Build fleet compile check::No build-fleet verdict (exit $status); the Mac canary runs." ;;
          esac
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"

  # The PR app compile's gateway runner, judged at once (Leo, 2026-11-08: the Linux checks start at once
  # Why: docs/ci/cmux-next-workflow-notes.md#note-35
  app-compile-placement:
    environment: ${{ github.event_name != 'pull_request' && 'ci-routing-agent' || '' }}
    needs: [path_route, push-head-preflight]
    if: ${{ !cancelled() && github.event_name == 'pull_request' && github.repository_owner == 'manaflow-ai' && vars.CI_COMPILE_CHECK_GATEWAY != '' && needs.path_route.outputs.native == 'true' && needs.push-head-preflight.outputs.current == 'true' && github.event.pull_request.head.repo.full_name == github.repository && !contains(github.event.pull_request.labels.*.name, 'full-ci') && vars.CI_PR_POOL_OWNED == '1' && needs.path_route.outputs.macos == 'true' && github.run_attempt == 1 }}
    name: cmux-next app compile placement
    runs-on: ${{ vars.CI_CLOUD_OVERFLOW_SAVED && fromJSON(vars.RUNNER_POOLS).linux_16 || fromJSON(vars.RUNNER_POOLS).linux_4 }}
    # Why: docs/ci/cmux-next-workflow-notes.md#note-179
    timeout-minutes: 6
    permissions:
      contents: read
    outputs:
      gateway_runner: ${{ steps.place.outputs.gateway_runner }}
      gateway_attempt: ${{ steps.place.outputs.gateway_attempt }}
    steps:
      # Why: docs/ci/cmux-next-workflow-notes.md#note-180
      - name: Check out the trusted placement
        timeout-minutes: 1
        continue-on-error: true
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          sparse-checkout: scripts/ci
          persist-credentials: false

      - name: Mint the owned-pool routing token
        id: route-token
        if: vars.GLAEDA_ROUTE_APP_ID != ''
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.GLAEDA_ROUTE_APP_ID }}
          private-key: ${{ secrets.GLAEDA_ROUTE_APP_KEY }}
          permission-administration: read
          permission-organization-self-hosted-runners: read

      - name: Mint the cmux-bot runner-read token
        id: route-token-fallback
        if: vars.CMUX_BOT_APP_ID != ''
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.CMUX_BOT_APP_ID }}
          private-key: ${{ secrets.CMUX_BOT_APP_KEY }}
          permission-organization-self-hosted-runners: read

      - name: Place the app compile on an idle gateway runner
        id: place
        continue-on-error: true
        timeout-minutes: 2
        env:
          PLACEMENT: app-compile
          CI_RUNNER_STATE: ${{ vars.CI_RUNNER_STATE }}
          ROUTE_TOKEN: ${{ steps.route-token.outputs.token }}
          ROUTE_TOKEN_FALLBACK: ${{ steps.route-token-fallback.outputs.token }}
          GATEWAY_LABEL: ${{ vars.CI_COMPILE_CHECK_GATEWAY }}
          GATEWAY_JOBS: app-compile-fleet
        run: |
          if ! grep -q '^def app_compile_gateway_main' scripts/ci/side_lane_placement.py; then
            echo "app compile placement: the trusted placement predates it; app-compile-fleet skips"
            exit 0
          fi
          python3 scripts/ci/side_lane_placement.py

  # A same-repository pull request's app compile, on the build fleet instead
  # of the Mac Release queue (2026-10-21: 76 of ~350 queued Mac jobs were
  # Release compiles). It compiles and links the app at the PR's head, the
  # commit the landing gate (require-cmux-guards) asks about, in about a
  # minute. A fleet compile error fails this job: the PR's own red. No verdict
  # (no client, the controller unreachable or timed out: any cmux-ci exit but
  # 0 and 1, 69 included) fails this job too, because nothing compiled the
  # head: it went green on exit 69 with no compile at all (PR #26741's head
  # 292b43ef, 2026-10-28, whose change runs no Mac Release compile). The
  # verdict output stays unavailable, so release-compile still runs on a Mac
  # where path_route's mac_release sends it. A full-ci PR, a fork, and every
  # push and dispatch keep the Mac Release compile; the base push compiles
  # Release after the merge, and push-attribution names the PR on a red.
  app-compile-fleet:
    needs: [path_route, push-head-preflight, app-compile-placement]
    # It takes the gateway, or a wider class of it, only while app-compile-placement saw a runner idle
    # (gateway_runner). With none idle it does not run: release-compile then runs, and
    # macos-placement puts it in the cascade (CASCADE_RUNS), so it takes a free Blacksmith
    # slot rather than the queue PR #24155's compile sat in three times on 2026-10-26.
    # It does not wait for the PR quiet period: its runner only hands the head to the build fleet's
    # Linux compile, and the run's group cancels it on a newer push, as does its own group below.
    if: ${{ !cancelled() && github.event_name == 'pull_request' && github.repository_owner == 'manaflow-ai' && vars.CI_COMPILE_CHECK_GATEWAY != '' && needs.path_route.outputs.native == 'true' && needs.push-head-preflight.outputs.current == 'true' && github.event.pull_request.head.repo.full_name == github.repository && !contains(github.event.pull_request.labels.*.name, 'full-ci') && needs.app-compile-placement.outputs.gateway_attempt == format('{0}', github.run_attempt) && needs.app-compile-placement.outputs.gateway_runner != '' }}
    name: cmux-next app compile (build fleet)
    concurrency:
      group: cmux-next-pr-${{ github.event.pull_request.number }}-app-compile-fleet
      cancel-in-progress: true
    runs-on: ${{ needs.app-compile-placement.outputs.gateway_runner }}
    permissions: {}
    timeout-minutes: 30
    outputs:
      verdict: ${{ steps.check.outputs.verdict }}
    steps:
      # Why: docs/ci/cmux-next-workflow-notes.md#note-181
      - name: Compile-check the app at the pull request's head on the build fleet
        id: check
        env:
          REF: ${{ github.event.pull_request.head.sha }}
          MAC_RELEASE: ${{ needs.path_route.outputs.mac_release }}
        run: |
          set -uo pipefail
          # No verdict is never a pass: the job fails and says why, and release-compile (a Mac)
          # takes over only where path_route's mac_release sends it.
          no_verdict() {  # reason
            local fallback="No Mac Release compile runs for this change; re-run this job once the build fleet answers."
            [[ "${MAC_RELEASE:-}" == true ]] && fallback="The Mac Release compile (cmux-next Release compile (Xcode 26)) runs as the fallback; re-run this job once the build fleet answers."
            local summary="No build-fleet verdict for \`$REF\` ($1), so nothing has compiled this head here. $fallback"
            echo "verdict=unavailable" >> "$GITHUB_OUTPUT"
            echo "### Build fleet app compile: no verdict"$'\n\n'"$summary" >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Build fleet compile: no verdict::$summary"
            exit 1
          }
          client="${CMUX_CI_CLIENT:-$HOME/.local/bin/cmux-ci}"
          if ! [[ -x "$client" ]]; then
            no_verdict "$client is not installed on runner $RUNNER_NAME"
            exit 1  # no_verdict exits already; this keeps the guard's shape visible
          fi
          status=0
          "$client" compile-check --ref "$REF" --app --timeout 1200 --queue-timeout 300 || status=$?
          case "$status" in
            0) verdict=pass; summary="The build fleet compiled and linked the cmux-next app at \`$REF\` (Debug, swift.org toolchain). The Release compile runs on the base push after the merge." ;;
            1) verdict=fail; summary="The cmux-next app did not compile on the build fleet at \`$REF\`; the errors are in this job's log above." ;;
            *) no_verdict "controller unreachable or timed out: cmux-ci exit $status" ;;
          esac
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
          echo "### Build fleet app compile: $verdict"$'\n\n'"$summary" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$verdict" == fail ]]; then
            echo "::error title=Build fleet compile::$summary"
            exit 1
          fi

  # Small package-only Swift edits get a mini-first type-check/build canary.
  # Why: docs/ci/cmux-next-workflow-notes.md#note-36
  swift-canary:
    needs: [path_route, macos-placement, push-head-preflight, swift-canary-fleet]
    # Why: docs/ci/cmux-next-workflow-notes.md#note-182
    if: ${{ !cancelled() && needs.path_route.outputs.swift_canary == 'true' && needs.push-head-preflight.outputs.current == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository || contains(github.event.pull_request.labels.*.name, 'full-ci')) }}
    name: cmux-next Swift canary
    concurrency:
      group: ${{ github.event_name == 'pull_request' && format('cmux-next-pr-{0}-swift-canary', github.event.pull_request.number) || github.event_name == 'push' && format('cmux-next-push-{0}-swift-canary', github.ref) || format('cmux-next-run-{0}-swift-canary', github.run_id) }}
      # Why: docs/ci/cmux-next-workflow-notes.md#note-183
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || needs.swift-canary-fleet.outputs.verdict == 'pass' && vars.CI_CLOUD_OVERFLOW_SAVED && (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-8vcpu-ubuntu-2404' || fromJSON(vars.RUNNER_POOLS).linux_8) || needs.swift-canary-fleet.outputs.verdict == 'pass' && (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-2vcpu-ubuntu-2404' || fromJSON(vars.RUNNER_POOLS).linux_2) || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-6vcpu-macos-26' || (github.run_attempt == 1 || github.run_attempt == 2 && contains(fromJSON('["github-actions[bot]","cmux-bot[bot]"]'), github.triggering_actor)) && needs.macos-placement.outputs.placed_attempt == format('{0}', github.run_attempt) && contains(needs.macos-placement.outputs.blacksmith_12_jobs, ' swift-canary ') && fromJSON(vars.RUNNER_POOLS).macos_26_large || (github.run_attempt == 1 || github.run_attempt == 2 && contains(fromJSON('["github-actions[bot]","cmux-bot[bot]"]'), github.triggering_actor)) && needs.macos-placement.outputs.placed_attempt == format('{0}', github.run_attempt) && contains(needs.macos-placement.outputs.blacksmith_6_jobs, ' swift-canary ') && fromJSON(vars.RUNNER_POOLS).macos_26 || (github.run_attempt == 1 || !contains(fromJSON('["github-actions[bot]","cmux-bot[bot]"]'), github.triggering_actor)) && needs.macos-placement.outputs.runner || github.repository_owner != 'manaflow-ai' && 'macos-26' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-6vcpu-macos-26' || vars.CI_PR_POOL_OWNED == '1' && contains(fromJSON('["pull_request","push","workflow_dispatch"]'), github.event_name) && (github.run_attempt == 1 || !contains(fromJSON('["github-actions[bot]","cmux-bot[bot]"]'), github.triggering_actor)) && vars.CI_SIDE_LANE_RUNNER || needs.macos-placement.outputs.placed_attempt == format('{0}', github.run_attempt) && contains(needs.macos-placement.outputs.retry_jobs, ' swift-canary ') && needs.macos-placement.outputs.retry_runner || vars.CI_PR_POOL_OWNED == '1' && contains(fromJSON('["pull_request","push","workflow_dispatch"]'), github.event_name) && (github.run_attempt <= 3 || !contains(fromJSON('["github-actions[bot]","cmux-bot[bot]"]'), github.triggering_actor)) && vars.CI_SIDE_LANE_RUNNER || vars.MACOS_RUNNER_26 || fromJSON(vars.RUNNER_POOLS).macos_26) }}
    permissions:
      contents: read
    timeout-minutes: ${{ needs.swift-canary-fleet.outputs.verdict == 'pass' && 5 || 20 }}
    env:
      CMUX_NEXT_RUNNER: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || needs.swift-canary-fleet.outputs.verdict == 'pass' && vars.CI_CLOUD_OVERFLOW_SAVED && (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-8vcpu-ubuntu-2404' || fromJSON(vars.RUNNER_POOLS).linux_8) || needs.swift-canary-fleet.outputs.verdict == 'pass' && (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-2vcpu-ubuntu-2404' || fromJSON(vars.RUNNER_POOLS).linux_2) || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-6vcpu-macos-26' || (github.run_attempt == 1 || github.run_attempt == 2 && contains(fromJSON('["github-actions[bot]","cmux-bot[bot]"]'), github.triggering_actor)) && needs.macos-placement.outputs.placed_attempt == format('{0}', github.run_attempt) && contains(needs.macos-placement.outputs.blacksmith_12_jobs, ' swift-canary ') && fromJSON(vars.RUNNER_POOLS).macos_26_large || (github.run_attempt == 1 || github.run_attempt == 2 && contains(fromJSON('["github-actions[bot]","cmux-bot[bot]"]'), github.triggering_actor)) && needs.macos-placement.outputs.placed_attempt == format('{0}', github.run_attempt) && contains(needs.macos-placement.outputs.blacksmith_6_jobs, ' swift-canary ') && fromJSON(vars.RUNNER_POOLS).macos_26 || (github.run_attempt == 1 || !contains(fromJSON('["github-actions[bot]","cmux-bot[bot]"]'), github.triggering_actor)) && needs.macos-placement.outputs.runner || github.repository_owner != 'manaflow-ai' && 'macos-26' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-6vcpu-macos-26' || vars.CI_PR_POOL_OWNED == '1' && contains(fromJSON('["pull_request","push","workflow_dispatch"]'), github.event_name) && (github.run_attempt == 1 || !contains(fromJSON('["github-actions[bot]","cmux-bot[bot]"]'), github.triggering_actor)) && vars.CI_SIDE_LANE_RUNNER || needs.macos-placement.outputs.placed_attempt == format('{0}', github.run_attempt) && contains(needs.macos-placement.outputs.retry_jobs, ' swift-canary ') && needs.macos-placement.outputs.retry_runner || vars.CI_PR_POOL_OWNED == '1' && contains(fromJSON('["pull_request","push","workflow_dispatch"]'), github.event_name) && (github.run_attempt <= 3 || !contains(fromJSON('["github-actions[bot]","cmux-bot[bot]"]'), github.triggering_actor)) && vars.CI_SIDE_LANE_RUNNER || vars.MACOS_RUNNER_26 || fromJSON(vars.RUNNER_POOLS).macos_26) }}
      SWIFT_CANARY_TARGETS: ${{ needs.path_route.outputs.swift_canary_targets }}
    steps:
      - name: Report the build fleet compile verdict
        if: ${{ needs.swift-canary-fleet.outputs.verdict == 'pass' }}
        run: |
          echo "The build fleet compiled and linked the cmux-next app at this commit; the Mac canary was not needed."
          {
            echo "### Swift canary"
            echo
            echo "The build fleet compiled and linked the cmux-next app at this commit (swift-canary-fleet), so this canary did not take a Mac."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Clear stale git locks (self-hosted reused workspace)
        shell: bash
        run: |
          ws="${GITHUB_WORKSPACE:-$PWD}"
          rm -f "$ws/.git/index.lock" 2>/dev/null || true

      - name: Checkout
        id: checkout
        continue-on-error: true
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: false
          fetch-depth: 2

      # Why: docs/ci/cmux-next-workflow-notes.md#note-184
      - name: Discard the workspace repository after a failed checkout
        if: steps.checkout.outcome == 'failure'
        run: rm -rf "$GITHUB_WORKSPACE/.git"

      - name: Retry checkout after transient network failure
        if: steps.checkout.outcome == 'failure'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: false
          fetch-depth: 2

      - name: Drop stale submodule checkouts (self-hosted reused workspace)
        run: scripts/ci/reset-stale-submodules.sh

      - name: Select Xcode
        if: ${{ needs.swift-canary-fleet.outputs.verdict != 'pass' }}
        run: ./scripts/select-ci-xcode.sh

      # Why: docs/ci/cmux-next-workflow-notes.md#note-185
      - name: Keep Swift package builds on this owned Mac
        if: ${{ needs.swift-canary-fleet.outputs.verdict != 'pass' && (contains(runner.name, '-glaeda')) }}
        continue-on-error: true
        run: python3 scripts/ci/owned_spm_scratch.py link "$GITHUB_WORKSPACE"

      - name: Type-check changed CmuxNext targets
        if: ${{ needs.swift-canary-fleet.outputs.verdict != 'pass' }}
        working-directory: Packages/macOS/CmuxNext
        env:
          SWIFT_CANARY_TARGETS: ${{ needs.path_route.outputs.swift_canary_targets }}
        run: |
          set -euo pipefail
          read -r -a targets <<< "$SWIFT_CANARY_TARGETS"
          ((${#targets[@]} > 0))
          started=$(date +%s)
          for target in "${targets[@]}"; do
            echo "Canary target: $target"
            swift build --configuration debug --target "$target"
          done
          elapsed=$(( $(date +%s) - started ))
          {
            echo "### Swift canary"
            echo
            echo "Targets: ${targets[*]}"
            echo "Elapsed: ${elapsed}s"
            echo "This is the fast PR gate for package-only CmuxNext Swift edits. The Release compile also runs on every PR that changes a CmuxNext Swift file, for Release-only optimizer failures a Debug build cannot see."
          } >> "$GITHUB_STEP_SUMMARY"

  # A person's re-run of the fast tier, placed again (side_lane_placement.rerun_fleet()). Re-running
  # failed jobs carries attempt 1's macos-placement and its outputs, so the tier took vars.MACOS_RUNNER_26
  # and fast-tier-fleet skipped the stale gateway reading: #38130's attempt 2 ran out its 20 minutes on the
  # same cold Blacksmith build as attempt 1. This job is skipped on attempt 1 and on the rescue's re-run
  # (macos-placement places those), so a person's re-run evaluates it again. It reads the runners now and,
  # while the fast tier runs again in this attempt and a gateway runner is idle for its client, lists the
  # tier for fast-tier-fleet with this attempt's gateway reading; otherwise the tier keeps its route. A
  # later re-run carries this job's reading too, which fast-tier-fleet then skips as an earlier attempt's.
  # With owned pools off (vars.CI_PR_POOL_OWNED), as for macos-placement, it places nothing.
  fast-tier-rerun-placement:
    environment: ${{ github.event_name != 'pull_request' && 'ci-routing-agent' || '' }}
    needs: [macos-placement, path_route, push-head-preflight]
    if: ${{ !cancelled() && github.run_attempt != 1 && !(github.run_attempt == 2 && contains(fromJSON('["github-actions[bot]","cmux-bot[bot]"]'), github.triggering_actor)) && github.repository_owner == 'manaflow-ai' && vars.CI_PR_POOL_OWNED == '1' && vars.CI_COMPILE_CHECK_GATEWAY != '' && inputs.same_tree_sha == '' && inputs.dev_daily != true && needs.push-head-preflight.outputs.current == 'true' && ((github.event_name == 'pull_request' && github.base_ref == 'feat-cmux-next' && github.event.pull_request.head.repo.full_name == github.repository && needs.path_route.outputs.macos != 'false' && needs.path_route.outputs.fast_tier != 'false') || (github.event_name == 'push' && github.ref == 'refs/heads/feat-cmux-next')) }}
    name: cmux-next fast tier re-run placement
    runs-on: ${{ vars.CI_CLOUD_OVERFLOW_SAVED && fromJSON(vars.RUNNER_POOLS).linux_16 || fromJSON(vars.RUNNER_POOLS).linux_4 }}
    # Why: docs/ci/cmux-next-workflow-notes.md#note-186
    timeout-minutes: 6
    permissions:
      # Why: docs/ci/cmux-next-workflow-notes.md#note-187
      actions: read
      contents: read
    outputs:
      fleet_jobs: ${{ steps.place.outputs.fleet_jobs }}
      gateway_runner: ${{ steps.place.outputs.gateway_runner }}
      gateway_attempt: ${{ steps.place.outputs.gateway_attempt }}
    steps:
      # Why: docs/ci/cmux-next-workflow-notes.md#note-188
      - name: Check out the trusted placement
        timeout-minutes: 1
        continue-on-error: true
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          sparse-checkout: scripts/ci
          persist-credentials: false

      - name: Mint the owned-pool routing token
        id: route-token
        if: vars.GLAEDA_ROUTE_APP_ID != ''
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.GLAEDA_ROUTE_APP_ID }}
          private-key: ${{ secrets.GLAEDA_ROUTE_APP_KEY }}
          permission-administration: read
          permission-organization-self-hosted-runners: read

      - name: Mint the cmux-bot runner-read token
        id: route-token-fallback
        if: vars.CMUX_BOT_APP_ID != ''
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.CMUX_BOT_APP_ID }}
          private-key: ${{ secrets.CMUX_BOT_APP_KEY }}
          permission-organization-self-hosted-runners: read

      # Why: docs/ci/cmux-next-workflow-notes.md#note-189
      - name: Place the fast tier's re-run
        id: place
        continue-on-error: true
        timeout-minutes: 2
        env:
          PLACEMENT: rerun-fleet
          CI_RUNNER_STATE: ${{ vars.CI_RUNNER_STATE }}
          GH_TOKEN: ${{ github.token }}
          ROUTE_TOKEN: ${{ steps.route-token.outputs.token }}
          ROUTE_TOKEN_FALLBACK: ${{ steps.route-token-fallback.outputs.token }}
          GATEWAY_LABEL: ${{ vars.CI_COMPILE_CHECK_GATEWAY }}
        run: |
          if ! grep -q '^def rerun_fleet_main' scripts/ci/side_lane_placement.py; then
            echo "fast tier re-run placement: the trusted placement predates it; the tier keeps its route"
            exit 0
          fi
          # The fast tier's status in this attempt: `completed` when its earlier result is carried.
          FAST_TIER_STATUS="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" \
            --jq '[.jobs[] | select(.name == "cmux-next fast tier") | .status] | first // empty')" || FAST_TIER_STATUS=""
          export FAST_TIER_STATUS
          python3 scripts/ci/side_lane_placement.py

  # Why: docs/ci/cmux-next-workflow-notes.md#note-4 (fast-tier-fleet)
  fast-tier-fleet:
    needs: [macos-placement, fast-tier-rerun-placement, path_route, push-head-preflight]
    if: ${{ !cancelled() && github.repository_owner == 'manaflow-ai' && inputs.same_tree_sha == '' && inputs.dev_daily != true && needs.push-head-preflight.outputs.current == 'true' && ((github.event_name == 'pull_request' && github.base_ref == 'feat-cmux-next' && github.event.pull_request.head.repo.full_name == github.repository && needs.path_route.outputs.macos != 'false' && needs.path_route.outputs.fast_tier != 'false') || (github.event_name == 'push' && github.ref == 'refs/heads/feat-cmux-next')) && (contains(needs.macos-placement.outputs.fleet_jobs, ' fast-tier ') && needs.macos-placement.outputs.gateway_attempt == format('{0}', github.run_attempt) && needs.macos-placement.outputs.gateway_runner != '' || contains(needs.fast-tier-rerun-placement.outputs.fleet_jobs, ' fast-tier ') && needs.fast-tier-rerun-placement.outputs.gateway_attempt == format('{0}', github.run_attempt) && needs.fast-tier-rerun-placement.outputs.gateway_runner != '') }}
    name: cmux-next fast tier (build fleet)
    concurrency:
      group: ${{ github.event_name == 'push' && format('cmux-next-push-{0}-fast-tier-fleet', github.ref) || format('cmux-next-run-{0}-fast-tier-fleet', github.run_id) }}
      cancel-in-progress: false
    # Why: docs/ci/cmux-next-workflow-notes.md#note-190
    runs-on: ${{ needs.fast-tier-rerun-placement.outputs.gateway_attempt == format('{0}', github.run_attempt) && needs.fast-tier-rerun-placement.outputs.gateway_runner || needs.macos-placement.outputs.gateway_runner }}
    permissions: {}
    # Why: docs/ci/cmux-next-workflow-notes.md#note-191
    timeout-minutes: 50
    outputs:
      verdict: ${{ steps.client.outputs.verdict }}
    steps:
      - name: Run the fast tier's Swift suites on the build fleet
        id: client
        env:
          # Why: docs/ci/cmux-next-workflow-notes.md#note-192
          REF: ${{ github.sha }}
          # Why: docs/ci/cmux-next-workflow-notes.md#note-193
          HOME_RENDER_SUITES: MotionTokenTests,IntentMappingTests
          CMUX_NEXT_SUITES: ModelMatrixTests,PaneZoomMotionTests,CEFProfileStorageLogTests,AgentSubagentPanesFocusTests
        run: |
          set -uo pipefail
          verdict=pass
          reasons=()
          # finish VERDICT: the job's output, its summary and its exit. Only pass exits 0.
          finish() {
            echo "verdict=$1" >> "$GITHUB_OUTPUT"
            {
              echo "### cmux-next fast tier on the build fleet: $1"
              echo
              printf -- '- %s\n' "${reasons[@]}"
            } >> "$GITHUB_STEP_SUMMARY"
            case "$1" in
              pass) exit 0 ;;
              queued) echo "::warning title=Fast tier on the build fleet: still queued::no verdict yet for $REF, so cmux-next fast tier runs the Swift suites itself: ${reasons[*]}"; exit 0 ;;
              fail) echo "::error title=Fast tier on the build fleet::a suite failed at $REF: ${reasons[*]}"; exit 1 ;;
              *) echo "::error title=Fast tier on the build fleet: no verdict::no verdict for $REF, which is never a pass: ${reasons[*]}"; exit 1 ;;
            esac
          }
          if ! [[ "$REF" =~ ^[0-9a-f]{40}$ ]]; then
            reasons+=("the commit to test is not a full sha ('$REF')")
            finish unavailable
          fi
          client="${CMUX_CI_CLIENT:-$HOME/.local/bin/cmux-ci}"
          if ! [[ -x "$client" ]]; then
            reasons+=("$client is not installed on runner $RUNNER_NAME")
            finish unavailable
            # finish exits already; the literal exit is the client guard's contract (no "$client" call follows).
            # shellcheck disable=SC2317
            exit 1
          fi
          # submit N PACKAGE SUITES: one fleet step that builds PACKAGE once and runs SUITES at REF.
          # CMUX_SWIFT_PACKAGE_TEST_TIMEOUT_SECONDS=60 keeps the Mac fast tier's 60-second limit per entry
          # (package-test-lane.sh's suite default is 900 s); the build before the suites has no such limit.
          # --no-supersede: a newer head never takes this run's step, so the verdict stays this commit's.
          # --queue-timeout 1200: the light class's measured queue p90 (cmux-ci's warning: 746 s on
          # 2026-11-08 12:07Z, 1314 s at 14:28Z), bounded at 20 minutes; past it the tier runs itself.
          submit() {
            local status=0
            "$client" run --class light --script scripts/ci/package-test-lane.sh --ref "$REF" \
              --arg=suite --arg="$2" --arg="$3" --no-supersede \
              --env=CMUX_SWIFT_PACKAGE_TEST_TIMEOUT_SECONDS=60 \
              --timeout 1500 --queue-timeout 1200 > "$RUNNER_TEMP/fast-tier-fleet-$1.log" 2>&1 || status=$?
            echo "$status" > "$RUNNER_TEMP/fast-tier-fleet-$1.exit"
          }
          submit 1 Packages/Shared/CmuxHomeRender "$HOME_RENDER_SUITES" &
          first=$!
          submit 2 Packages/macOS/CmuxNext "$CMUX_NEXT_SUITES" &
          second=$!
          wait "$first"
          wait "$second"
          # judge N PACKAGE: print the step's log, then its verdict from its exit and the
          # controller's record of the step, which must name REF as the commit it tested.
          ref_re='"ref": *"([^"]*)"(.*)'
          digest_re='"source_digest": *"([^"]*)"'
          state_re='"state": *"([a-z_]*)"'
          code_re='"exit_code": *(-?[0-9]+)'
          # A step id as the fleet tools read it (tip-test-compile.sh): 6 to 64 hex.
          step_re='^cmux-ci: step ([0-9a-f]{6,64}) '
          judge() {
            local line id="" status="" json="" rest refs=0 state="" code="" step=unavailable why=""
            echo "::group::$2 on the build fleet"
            while IFS= read -r line || [[ -n "$line" ]]; do
              printf '%s\n' "$line"
              # The client names its step before the step's own log streams.
              if [[ -z "$id" && "$line" =~ $step_re ]]; then id="${BASH_REMATCH[1]}"; fi
            done < "$RUNNER_TEMP/fast-tier-fleet-$1.log"
            echo "::endgroup::"
            read -r status < "$RUNNER_TEMP/fast-tier-fleet-$1.exit" || status=""
            if [[ -z "$id" ]]; then
              why="the client submitted no step (exit ${status:-unknown})"
            elif ! json="$("$client" status "$id" 2>&1)"; then
              why="the controller's record of step $id could not be read"
            else
              rest="$json"
              while [[ "$rest" =~ $ref_re ]]; do
                refs=$((refs + 1))
                if [[ "${BASH_REMATCH[1]}" != "$REF" ]]; then why="step $id tested ${BASH_REMATCH[1]:-no commit}, not $REF"; break; fi
                rest="${BASH_REMATCH[2]}"
              done
              if [[ -z "$why" && "$refs" -eq 0 ]]; then why="step $id's record names no tested commit"; fi
              if [[ -z "$why" && "$json" =~ $digest_re && -n "${BASH_REMATCH[1]}" && "${BASH_REMATCH[1]}" != "$REF" ]]; then
                why="step $id checked out ${BASH_REMATCH[1]}, not $REF"
              fi
              if [[ "$json" =~ $state_re ]]; then state="${BASH_REMATCH[1]}"; fi
              if [[ "$json" =~ $code_re ]]; then code="${BASH_REMATCH[1]}"; fi
            fi
            if [[ -z "$why" ]]; then
              # The controller's record decides: a pass is a step done at REF with exit 0 (and a client
              # that exited 0); a step that ended with a nonzero exit is a fail whatever the client said;
              # anything else (no worker, a queue or run timeout, a newer head, a cancel) is no verdict.
              if [[ "$status" == 0 && "$state" == "done" && "$code" == 0 ]]; then
                step=pass; why="$2: every suite passed at $REF (step $id)"
              elif [[ ( "$state" == "failed" || "$state" == "done" ) && "$code" =~ ^-?[0-9]+$ && "$code" -ne 0 ]]; then
                step=fail; why="$2: a suite failed or did not build at $REF (step $id, exit $code); the errors are in its log above"
              elif [[ "$status" == 75 ]]; then
                # The client stopped waiting for the queue; the step keeps its place and runs later.
                step=queued; why="$2: step $id still queued after the client's queue wait (client exit 75, step ${state:-unknown})"
              else
                why="$2: no verdict from step $id (client exit ${status:-unknown}, step ${state:-unknown})"
              fi
            fi
            reasons+=("$why")
            echo "$why"
            case "$step" in
              fail) verdict=fail ;;
              unavailable) [[ "$verdict" == fail ]] || verdict=unavailable ;;
              queued) [[ "$verdict" != pass ]] || verdict=queued ;;
            esac
          }
          judge 1 Packages/Shared/CmuxHomeRender
          judge 2 Packages/macOS/CmuxNext
          finish "$verdict"

  # The fast tier's queued hand-back, placed again (side_lane_placement.handback()). When fast-tier-fleet hands
  # Why: docs/ci/cmux-next-workflow-notes.md#note-37
  fast-tier-handback-placement:
    environment: ${{ github.event_name != 'pull_request' && 'ci-routing-agent' || '' }}
    needs: [fast-tier-fleet]
    if: ${{ !cancelled() && needs.fast-tier-fleet.outputs.verdict == 'queued' && github.repository_owner == 'manaflow-ai' && vars.CI_PR_POOL_OWNED == '1' }}
    name: cmux-next fast tier hand-back placement
    runs-on: ${{ vars.CI_CLOUD_OVERFLOW_SAVED && fromJSON(vars.RUNNER_POOLS).linux_16 || fromJSON(vars.RUNNER_POOLS).linux_4 }}
    # Why: docs/ci/cmux-next-workflow-notes.md#note-194
    timeout-minutes: 8
    permissions:
      contents: read
    outputs:
      runner: ${{ steps.place.outputs.runner }}
    steps:
      # Why: docs/ci/cmux-next-workflow-notes.md#note-195
      - name: Check out the trusted placement
        timeout-minutes: 1
        continue-on-error: true
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          sparse-checkout: scripts/ci
          persist-credentials: false

      - name: Mint the owned-pool routing token
        id: route-token
        if: vars.GLAEDA_ROUTE_APP_ID != ''
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.GLAEDA_ROUTE_APP_ID }}
          private-key: ${{ secrets.GLAEDA_ROUTE_APP_KEY }}
          permission-administration: read
          permission-organization-self-hosted-runners: read

      - name: Mint the cmux-bot runner-read token
        id: route-token-fallback
        if: vars.CMUX_BOT_APP_ID != ''
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.CMUX_BOT_APP_ID }}
          private-key: ${{ secrets.CMUX_BOT_APP_KEY }}
          permission-organization-self-hosted-runners: read

      # Blacksmith's health (the pool snapshot's declared outages and dead labels), as macos-placement reads it.
      - name: Mint the glaeda read token
        id: snapshot-read-token
        if: vars.GLAEDA_ROUTE_APP_ID != ''
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.GLAEDA_ROUTE_APP_ID }}
          private-key: ${{ secrets.GLAEDA_ROUTE_APP_KEY }}
          permission-actions: read
          permission-pull-requests: read

      - name: Place the fast tier's hand-back
        id: place
        continue-on-error: true
        timeout-minutes: 2
        env:
          PLACEMENT: handback
          CI_RUNNER_STATE: ${{ vars.CI_RUNNER_STATE }}
          CI_FLEET_GATES: ${{ vars.CI_FLEET_GATES }}
          ROUTE_TOKEN: ${{ steps.route-token.outputs.token }}
          ROUTE_TOKEN_FALLBACK: ${{ steps.route-token-fallback.outputs.token }}
          SNAPSHOT_TOKEN: ${{ steps.snapshot-read-token.outputs.token || github.token }}
          # The owned side label itself: CMUX_NEXT_SIDE_ROUTE names Blacksmith on a person's re-run. A fork's
          # pull request never gets it (it never reaches this job either: its fleet client does not run).
          SIDE_LABEL: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-6vcpu-macos-26' || vars.CI_SIDE_LANE_RUNNER }}
          FAST_LABEL: ${{ vars.CI_FAST_LANE_RUNNER }}
        run: |
          if ! grep -q '^def handback_main' scripts/ci/side_lane_placement.py; then
            echo "fast tier hand-back placement: the trusted placement predates it; the tier takes Blacksmith 6 vCPU"
            exit 0
          fi
          python3 scripts/ci/side_lane_placement.py

  # The PR fast tier (hq#1915, cx-29ch2): every registered deterministic suite
  # Why: docs/ci/cmux-next-workflow-notes.md#note-38
  fast-tier:
    needs: [macos-placement, path_route, push-head-preflight, fast-tier-fleet, fast-tier-handback-placement]
    if: ${{ !cancelled() && inputs.same_tree_sha == '' && inputs.dev_daily != true && needs.push-head-preflight.outputs.current == 'true' && ((github.event_name == 'pull_request' && github.base_ref == 'feat-cmux-next' && needs.path_route.outputs.macos != 'false' && needs.path_route.outputs.fast_tier != 'false') || (github.event_name == 'push' && github.ref == 'refs/heads/feat-cmux-next')) }}
    name: cmux-next fast tier
    # Why: docs/ci/cmux-next-workflow-notes.md#note-196
    environment: ${{ github.ref == 'refs/heads/main' && 'ci-cache-writer' || '' }}
    concurrency:
      group: ${{ github.event_name == 'push' && format('cmux-next-push-{0}-fast-tier', github.ref) || format('cmux-next-run-{0}-fast-tier', github.run_id) }}
      cancel-in-progress: false
    # Why: docs/ci/cmux-next-workflow-notes.md#note-5
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-6vcpu-macos-26' || needs.macos-placement.outputs.fast_runner != '' && github.run_attempt == 1 && needs.macos-placement.outputs.fast_runner || contains(fromJSON('["success","failure","cancelled"]'), needs.fast-tier-fleet.result) && needs.fast-tier-fleet.outputs.verdict != 'queued' && !startsWith(vars.LINUX_RUNNER, 'blacksmith-') && vars.LINUX_RUNNER || contains(fromJSON('["success","failure","cancelled"]'), needs.fast-tier-fleet.result) && needs.fast-tier-fleet.outputs.verdict != 'queued' && vars.CI_CLOUD_OVERFLOW_SAVED && fromJSON(vars.RUNNER_POOLS).linux_4 || contains(fromJSON('["success","failure","cancelled"]'), needs.fast-tier-fleet.result) && needs.fast-tier-fleet.outputs.verdict != 'queued' && fromJSON(vars.RUNNER_POOLS).linux_2 || needs.fast-tier-fleet.outputs.verdict == 'queued' && needs.fast-tier-handback-placement.outputs.runner || needs.fast-tier-fleet.outputs.verdict == 'queued' && fromJSON(vars.RUNNER_POOLS).macos_26 || (github.run_attempt == 1 || github.run_attempt == 2 && contains(fromJSON('["github-actions[bot]","cmux-bot[bot]"]'), github.triggering_actor)) && needs.macos-placement.outputs.placed_attempt == format('{0}', github.run_attempt) && contains(needs.macos-placement.outputs.blacksmith_12_jobs, ' fast-tier ') && fromJSON(vars.RUNNER_POOLS).macos_26_large || (github.run_attempt == 1 || github.run_attempt == 2 && contains(fromJSON('["github-actions[bot]","cmux-bot[bot]"]'), github.triggering_actor)) && needs.macos-placement.outputs.placed_attempt == format('{0}', github.run_attempt) && contains(needs.macos-placement.outputs.blacksmith_6_jobs, ' fast-tier ') && fromJSON(vars.RUNNER_POOLS).macos_26 || (github.run_attempt == 1 || github.run_attempt == 2 && contains(fromJSON('["github-actions[bot]","cmux-bot[bot]"]'), github.triggering_actor)) && needs.macos-placement.outputs.placed_attempt == format('{0}', github.run_attempt) && contains(needs.macos-placement.outputs.owned_jobs, ' fast-tier ') && needs.macos-placement.outputs.runner || needs.macos-placement.outputs.placed_attempt == format('{0}', github.run_attempt) && contains(needs.macos-placement.outputs.retry_jobs, ' fast-tier ') && needs.macos-placement.outputs.retry_runner || needs.macos-placement.outputs.placed_attempt == format('{0}', github.run_attempt) && needs.macos-placement.outputs.deferred_runner || ((github.run_attempt == 1 || github.run_attempt == 2 && contains(fromJSON('["github-actions[bot]","cmux-bot[bot]"]'), github.triggering_actor)) && vars.CI_PR_POOL_OWNED == '1' && vars.CI_SIDE_LANE_RUNNER || vars.MACOS_RUNNER_26 || fromJSON(vars.RUNNER_POOLS).macos_26) }}
    permissions:
      # The reuse lookup lists artifacts.
      actions: read
      contents: read
    # Why: docs/ci/cmux-next-workflow-notes.md#note-39
    timeout-minutes: ${{ contains(fromJSON('["success","failure","cancelled"]'), needs.fast-tier-fleet.result) && needs.fast-tier-fleet.outputs.verdict != 'queued' && 5 || needs.fast-tier-fleet.outputs.verdict == 'queued' && 35 || 20 }}
    env:
      # Why: docs/ci/cmux-next-workflow-notes.md#note-197
      CMUX_FAST_TIER_FLEET: ${{ contains(fromJSON('["success","failure","cancelled"]'), needs.fast-tier-fleet.result) && needs.fast-tier-fleet.outputs.verdict != 'queued' && 'report' || '' }}
    steps:
      # Why: docs/ci/cmux-next-workflow-notes.md#note-198
      - name: Report the build fleet's fast tier verdict
        if: env.CMUX_FAST_TIER_FLEET == 'report'
        env:
          VERDICT: ${{ needs.fast-tier-fleet.outputs.verdict }}
          RESULT: ${{ needs.fast-tier-fleet.result }}
        run: |
          superseded_push() {  # scripts/ci/needs_verdict.py SUPERSEDED_RULE, copied verbatim (tests/test_needs_verdict.py)
            local what=$1 head
            [[ "${GITHUB_EVENT_NAME:-}" == push && -n "${GITHUB_SHA:-}" && -n "${GITHUB_REF:-}" ]] || return 1
            head="$(git -c http.lowSpeedLimit=1 -c http.lowSpeedTime=15 ls-remote \
              "${GITHUB_SERVER_URL:-https://github.com}/${GITHUB_REPOSITORY:-}.git" "$GITHUB_REF" 2>/dev/null \
              | awk 'NR==1{print $1}')" || head=""
            [[ -n "$head" && "$head" != "$GITHUB_SHA" ]] || return 1
            echo "::notice title=$what: superseded::not judged at $GITHUB_SHA: a newer push ($head) replaced its waiting job, and that push's run carries the verdict"
          }
          if [[ $VERDICT == pass && $RESULT == success ]]; then
            echo "The build fleet ran the fast tier's Swift suites at this commit and every one passed (cmux-next fast tier (build fleet))."
            printf '### cmux-next fast tier\n\nNo macOS runner was free, so the build fleet ran the Swift suites (cmux-next fast tier (build fleet)): every one passed.\n' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ $VERDICT == fail || $RESULT == failure ]]; then
            echo "::error title=cmux-next fast tier::fleet $RESULT, verdict ${VERDICT:-none}; its log is in cmux-next fast tier (build fleet)"
            exit 1
          fi
          if [[ $RESULT == cancelled ]] && superseded_push "fast tier"; then exit 0; fi
          echo "::error::no verdict: fast tier: fleet $RESULT, verdict ${VERDICT:-none}; re-run"
          exit 3

      # This job's tests can start acpmux daemons: they get a home of the job's
      # Why: docs/ci/cmux-next-workflow-notes.md#note-199
      - name: Give this job its own acpmux home
        if: env.CMUX_FAST_TIER_FLEET != 'report'
        run: |
          home="$RUNNER_TEMP/acpmux-home"
          rm -rf "$home" && mkdir -m 700 "$home"
          echo "ACPMUX_HOME=$RUNNER_TEMP/acpmux-home" >> "$GITHUB_ENV"
          # An inherited socket would still name another home's daemon; empty is unset.
          echo "ACPMUX_SOCKET=" >> "$GITHUB_ENV"

      - name: Clear stale git locks (self-hosted reused workspace)
        if: env.CMUX_FAST_TIER_FLEET != 'report'
        shell: bash
        run: |
          ws="${GITHUB_WORKSPACE:-$PWD}"
          rm -f "$ws/.git/index.lock" 2>/dev/null || true

      - name: Checkout
        if: env.CMUX_FAST_TIER_FLEET != 'report'
        id: checkout
        continue-on-error: true
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: false
          # Why: docs/ci/cmux-next-workflow-notes.md#note-200
          clean: false
          fetch-depth: 2

      # Why: docs/ci/cmux-next-workflow-notes.md#note-201
      - name: Discard the workspace repository after a failed checkout
        if: steps.checkout.outcome == 'failure'
        run: rm -rf "$GITHUB_WORKSPACE/.git"

      - name: Retry checkout after transient network failure
        if: steps.checkout.outcome == 'failure'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: false
          clean: false
          fetch-depth: 2

      # Why: docs/ci/cmux-next-workflow-notes.md#note-202
      - name: Drop stale submodule checkouts (self-hosted reused workspace)
        if: env.CMUX_FAST_TIER_FLEET != 'report'
        run: scripts/ci/reset-stale-submodules.sh

      - name: Remove stale untracked source (keep ignored build caches)
        if: env.CMUX_FAST_TIER_FLEET != 'report'
        run: git clean -ffd

      - name: Select Xcode
        if: env.CMUX_FAST_TIER_FLEET != 'report'
        run: ./scripts/select-ci-xcode.sh

      # Why: docs/ci/cmux-next-workflow-notes.md#note-40
      - name: Fingerprint this job's inputs
        id: reuse-key
        if: ${{ env.CMUX_FAST_TIER_FLEET != 'report' && (vars.CI_NEXT_JOB_REUSE == '1' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) }}
        continue-on-error: true
        run: |
          python3 -I scripts/ci/job_input_fingerprint.py fast-tier \
            --extra "xcode=$(xcodebuild -version | tr '\n' ' ')" \
            --extra "macos=$(sw_vers -productVersion)" \
            --extra "macos_build=$(sw_vers -buildVersion)" \
            --extra "arch=$(uname -m)" \
            --extra "pool=${{ contains(runner.name, '-glaeda') && 'owned' || startsWith(runner.name, 'blacksmith-') && 'blacksmith' || runner.environment == 'github-hosted' && 'hosted' || runner.name }}" \
            --extra "image=${ImageOS:-}${ImageVersion:+-$ImageVersion}" >> "$GITHUB_OUTPUT"

      - name: Look for a pass on the same inputs
        id: reuse
        if: ${{ steps.reuse-key.outputs.key != '' && inputs.no_reuse != true }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          KEY: ${{ steps.reuse-key.outputs.key }}
        run: python3 -I scripts/ci/job_reuse.py lookup --key "$KEY" >> "$GITHUB_OUTPUT"

      - name: Reuse that pass
        if: ${{ steps.reuse.outputs.hit == 'true' }}
        env:
          KEY: ${{ steps.reuse-key.outputs.key }}
          RUN_URL: ${{ steps.reuse.outputs.run_url }}
          SHA: ${{ steps.reuse.outputs.sha }}
        run: |
          echo "::notice title=cmux-next fast tier reused::$RUN_URL passed on the same inputs (${SHA:0:12})"
          echo "Reused $RUN_URL: it passed on \`${SHA:0:12}\` with the same inputs (\`$KEY\`)." >> "$GITHUB_STEP_SUMMARY"

      # Checkout removes .build. On an owned Mac the tier builds in one of the
      # Why: docs/ci/cmux-next-workflow-notes.md#note-41
      - name: Keep Swift package builds on this owned Mac
        id: spm-root
        if: ${{ env.CMUX_FAST_TIER_FLEET != 'report' && ((contains(runner.name, '-glaeda')) && steps.reuse.outputs.hit != 'true') }}
        continue-on-error: true
        run: python3 scripts/ci/owned_spm_scratch.py lease "$GITHUB_WORKSPACE"

      # Owned minis keep their builds on their own SSD (above). Blacksmith overflow
      # restores the newest seed cmux-next-fast-tier-seed.yml saved from a
      # feat-cmux-next push to cmux-ci-cache-next, through its public URL: no
      # credential, and a pull request never writes. The swift directory comes by
      # prefix; the home directory by that seed's exact commit, so both come from
      # one seed and match the input-time manifest in the swift directory.
      - name: Compute fast-tier cache keys
        id: fast-cache-key
        if: ${{ env.CMUX_FAST_TIER_FLEET != 'report' && ((!contains(runner.name, '-glaeda')) && steps.reuse.outputs.hit != 'true') }}
        run: scripts/cmux-next/fast-tier-cache-key.sh >> "$GITHUB_OUTPUT"

      - name: Restore the CmuxNext build
        id: fast-cache-restore
        if: ${{ env.CMUX_FAST_TIER_FLEET != 'report' && ((!contains(runner.name, '-glaeda')) && steps.reuse.outputs.hit != 'true') }}
        continue-on-error: true
        uses: ./.github/actions/cache-restore
        env:
          CI_CACHE_R2_PUBLIC_URL: https://ci-cache-next.cmux.com
        with:
          backend: r2
          path: Packages/macOS/CmuxNext/.build
          key: ${{ steps.fast-cache-key.outputs.swift-key }}
          restore-keys: ${{ steps.fast-cache-key.outputs.swift-prefix }}

      - name: Name the restored seed
        id: fast-cache-seed
        if: ${{ (steps.fast-cache-restore.outputs.cache-matched-key != '') && steps.reuse.outputs.hit != 'true' }}
        env:
          MATCHED: ${{ steps.fast-cache-restore.outputs.cache-matched-key }}
          PREFIX: ${{ steps.fast-cache-key.outputs.swift-prefix }}
        run: echo "commit=${MATCHED#"$PREFIX"}" >> "$GITHUB_OUTPUT"

      - name: Restore the CmuxHomeRender build of that seed
        if: ${{ (steps.fast-cache-seed.outputs.commit != '') && steps.reuse.outputs.hit != 'true' }}
        continue-on-error: true
        uses: ./.github/actions/cache-restore
        env:
          CI_CACHE_R2_PUBLIC_URL: https://ci-cache-next.cmux.com
        with:
          backend: r2
          path: Packages/Shared/CmuxHomeRender/.build
          key: ${{ steps.fast-cache-key.outputs.home-prefix }}${{ steps.fast-cache-seed.outputs.commit }}

      # Why: docs/ci/cmux-next-workflow-notes.md#note-203
      - name: Replay the seed's input times
        if: ${{ (steps.fast-cache-seed.outputs.commit != '') && steps.reuse.outputs.hit != 'true' }}
        continue-on-error: true
        run: python3 -I scripts/ci/e2e_warm_derived_data.py replay "$GITHUB_WORKSPACE" Packages/macOS/CmuxNext/.build/cmux-fast-tier-input-mtimes.json

      - name: Run the fast tier
        id: fast-tier-run
        if: ${{ env.CMUX_FAST_TIER_FLEET != 'report' && (steps.reuse.outputs.hit != 'true') }}
        env:
          CMUX_FAST_SWIFT_CACHE_KEY: ${{ steps.fast-cache-key.outputs.swift-key }}
          CMUX_FAST_SWIFT_CACHE_HIT: ${{ steps.fast-cache-restore.outputs.cache-hit }}
          CMUX_FAST_CACHE_MATCHED_KEY: ${{ steps.fast-cache-restore.outputs.cache-matched-key }}
        run: python3 -I scripts/cmux-next/fast-tier.py --root "${{ steps.spm-root.outputs.root || github.workspace }}" --kind swift --receipt "$RUNNER_TEMP/cmux-next-fast-tier.json"

      # Why: docs/ci/cmux-next-workflow-notes.md#note-204
      - name: Stop this job's acpmux daemons and remove its home
        if: ${{ env.CMUX_FAST_TIER_FLEET != 'report' && (always() && steps.reuse.outputs.hit != 'true') }}
        continue-on-error: true
        timeout-minutes: 3
        run: |
          home="$RUNNER_TEMP/acpmux-home"
          [[ -d "$home" ]] || exit 0
          acpmux="$(PATH="$PATH:$HOME/.local/bin:$HOME/.cargo/bin:/opt/homebrew/bin:/usr/local/bin" command -v acpmux || true)"
          [[ -z "$acpmux" ]] || env -u ACPMUX_SOCKET ACPMUX_HOME="$home" "$acpmux" daemon shutdown --end-agents || true
          rm -rf "$home"

      - name: Upload fast-tier timing receipt
        if: ${{ env.CMUX_FAST_TIER_FLEET != 'report' && ((always()) && steps.reuse.outputs.hit != 'true') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-next-fast-tier-receipt-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cmux-next-fast-tier.json
          if-no-files-found: warn
          retention-days: 14

      # Why: docs/ci/cmux-next-workflow-notes.md#note-42
      - name: Record this pass for the same inputs
        if: ${{ success() && steps.reuse-key.outputs.key != '' && steps.reuse.outputs.hit != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        run: |
          mkdir -p "$RUNNER_TEMP/ci-job-pass"
          printf '%s\n' "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA" > "$RUNNER_TEMP/ci-job-pass/pass.txt"

      - name: Save the pass
        if: ${{ success() && steps.reuse-key.outputs.key != '' && steps.reuse.outputs.hit != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.reuse-key.outputs.key }}
          path: ${{ runner.temp }}/ci-job-pass
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  # Why: docs/ci/cmux-next-workflow-notes.md#note-205
  fast-tier-cargo:
    needs: [push-head-preflight]
    if: ${{ !cancelled() && inputs.same_tree_sha == '' && inputs.dev_daily != true && needs.push-head-preflight.outputs.current == 'true' && ((github.event_name == 'pull_request' && github.base_ref == 'feat-cmux-next') || (github.event_name == 'push' && github.ref == 'refs/heads/feat-cmux-next')) }}
    name: cmux-next fast tier (cargo)
    concurrency:
      group: ${{ github.event_name == 'push' && format('cmux-next-push-{0}-fast-tier-cargo', github.ref) || format('cmux-next-run-{0}-fast-tier-cargo', github.run_id) }}
      cancel-in-progress: false
    # Why: docs/ci/cmux-next-workflow-notes.md#note-206
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-4vcpu-ubuntu-2404' || vars.CI_CLOUD_OVERFLOW_SAVED && fromJSON(vars.RUNNER_POOLS).linux_16 || fromJSON(vars.RUNNER_POOLS).linux_8 }}
    permissions:
      # The reuse lookup lists artifacts.
      actions: read
      contents: read
    timeout-minutes: 20
    # Why: docs/ci/cmux-next-workflow-notes.md#note-207
    env:
      GHOSTTY_ZIG_SOURCE: ghostty-next
      CMUX_GHOSTTY_SRC: ""
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: false

      # Why: docs/ci/cmux-next-workflow-notes.md#note-208
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev pkg-config

      - name: Init the ghostty-next submodule (libghostty-vt for cmux-tui-core)
        run: bash scripts/ci/init-submodule.sh ghostty-next

      - name: Install zig
        run: ./scripts/install-zig-ci.sh

      - name: Set up pinned cmux-tui Rust
        uses: ./.github/actions/setup-cmux-tui-rust

      # Why: docs/ci/cmux-next-workflow-notes.md#note-43
      - name: Fingerprint this job's inputs
        id: reuse-key
        if: ${{ (format('{0}', vars.CI_REBUILD_MIRROR) != '0' || vars.CI_NEXT_JOB_REUSE == '1') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          MIRROR_PLAN: ${{ format('{0}', vars.CI_REBUILD_MIRROR) != '0' && format('{0}/ci-rebuild-plan.json', runner.temp) || '' }}
          REBUILD_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 -I scripts/ci/job_input_fingerprint.py fast-tier-cargo --mirror-plan "$MIRROR_PLAN" \
            --extra "runner=${{ runner.os }}-${{ runner.arch }}" \
            --extra "rustc=$(rustc -Vv | tr '\n' ' ')" \
            --extra "cargo=$(cargo -V)" \
            --extra "zig=$("${CMUX_ZIG:-zig}" version)" \
            --extra "clang=$(clang --version | head -1)" \
            --extra "image=${ImageOS:-}${ImageVersion:+-$ImageVersion}" >> "$GITHUB_OUTPUT"

      - name: Look for a pass on the same inputs
        id: reuse
        if: ${{ format('{0}', vars.CI_REBUILD_MIRROR) == '0' && vars.CI_NEXT_JOB_REUSE == '1' && steps.reuse-key.outputs.key != '' && inputs.no_reuse != true }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          KEY: ${{ steps.reuse-key.outputs.key }}
        run: python3 -I scripts/ci/job_reuse.py lookup --key "$KEY" >> "$GITHUB_OUTPUT"

      - name: Reuse that pass
        if: ${{ steps.reuse.outputs.hit == 'true' }}
        env:
          KEY: ${{ steps.reuse-key.outputs.key }}
          RUN_URL: ${{ steps.reuse.outputs.run_url }}
          SHA: ${{ steps.reuse.outputs.sha }}
        run: |
          echo "::notice title=cmux-next fast tier (cargo) reused::$RUN_URL passed on the same inputs (${SHA:0:12})"
          echo "Reused $RUN_URL: it passed on \`${SHA:0:12}\` with the same inputs (\`$KEY\`)." >> "$GITHUB_STEP_SUMMARY"

      # The mode switch is deliberately insufficient on its own.  Promotion
      # Why: docs/ci/cmux-next-workflow-notes.md#note-44
      - name: Verify planner promotion evidence
        id: planner-evidence
        if: ${{ format('{0}', vars.CI_REBUILD_MIRROR) == 'enforce' && steps.reuse.outputs.hit != 'true' && inputs.no_reuse != true }}
        continue-on-error: true
        env:
          CI_REBUILD_MIRROR_EVIDENCE: ${{ vars.CI_REBUILD_MIRROR_EVIDENCE }}
        run: |
          python3 -I scripts/ci/rebuild_mirror.py verify-evidence \
            --root . --rev "$GITHUB_SHA" --job fast-tier-cargo \
            --evidence-json "$CI_REBUILD_MIRROR_EVIDENCE" >> "$GITHUB_OUTPUT"

      # Enforcement is promoted only after the HQ mirror collector has a complete
      # Why: docs/ci/cmux-next-workflow-notes.md#note-209
      - name: Look for a trusted planner pass
        id: planner-reuse
        if: ${{ format('{0}', vars.CI_REBUILD_MIRROR) == 'enforce' && steps.planner-evidence.outputs.eligible == 'true' && steps.reuse.outputs.hit != 'true' && steps.reuse-key.outputs.candidate_key != '' && inputs.no_reuse != true }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          KEY: ${{ steps.reuse-key.outputs.candidate_key }}
        run: |
          python3 -I scripts/ci/job_reuse.py lookup --key "$KEY" \
            --trusted-branch feat-cmux-next --trusted-event push \
            --trusted-workflow .github/workflows/cmux-next.yml >> "$GITHUB_OUTPUT"

      - name: Reuse the trusted planner pass
        if: ${{ steps.reuse.outputs.hit != 'true' && steps.planner-reuse.outputs.hit == 'true' }}
        env:
          KEY: ${{ steps.reuse-key.outputs.candidate_key }}
          RUN_URL: ${{ steps.planner-reuse.outputs.run_url }}
          SHA: ${{ steps.planner-reuse.outputs.sha }}
        run: |
          echo "::notice title=cmux-next fast tier (cargo) planner reuse::$RUN_URL passed on the trusted feat-cmux-next push (${SHA:0:12})"
          echo "Planner reused $RUN_URL: it passed on \`${SHA:0:12}\` with the measured input closure (\`$KEY\`)." >> "$GITHUB_STEP_SUMMARY"

      # As cmux-tui.yml: cargo's registry and dependency builds under cmux-tui/target.
      # Why: docs/ci/cmux-next-workflow-notes.md#note-210
      - name: Cache cargo build
        if: ${{ steps.reuse.outputs.hit != 'true' && steps.planner-reuse.outputs.hit != 'true' }}
        id: cargo-cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          workspaces: cmux-tui -> target
          shared-key: cmux-next-fast-tier-cargo
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/feat-cmux-next' }}

      # Why: docs/ci/cmux-next-workflow-notes.md#note-211
      - name: Fetch the ghostty-next Zig packages (cached, deadlined, retried)
        if: ${{ steps.reuse.outputs.hit != 'true' && steps.planner-reuse.outputs.hit != 'true' }}
        uses: ./.github/actions/ghostty-zig-packages

      - name: Run the fast tier (cargo and script entries)
        if: ${{ steps.reuse.outputs.hit != 'true' && steps.planner-reuse.outputs.hit != 'true' }}
        env:
          CMUX_FAST_CARGO_CACHE_HIT: ${{ steps.cargo-cache.outputs.cache-hit }}
        run: python3 -I scripts/cmux-next/fast-tier.py --kind cargo --kind script --receipt "$RUNNER_TEMP/cmux-next-fast-tier-cargo.json"

      - name: Upload fast-tier timing receipt
        if: ${{ (always()) && steps.reuse.outputs.hit != 'true' && steps.planner-reuse.outputs.hit != 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-next-fast-tier-cargo-receipt-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cmux-next-fast-tier-cargo.json
          if-no-files-found: warn
          retention-days: 3

      # Why: docs/ci/cmux-next-workflow-notes.md#note-212
      - name: Record rebuild mirror outcome
        id: rebuild-mirror
        if: ${{ always() && steps.reuse.outputs.hit != 'true' && steps.planner-reuse.outputs.hit != 'true' && steps.reuse-key.outputs.mirror == 'true' }}
        continue-on-error: true
        env:
          JOB_OUTCOME: ${{ job.status }}
        run: |
          python3 -I scripts/ci/rebuild_mirror.py finish \
            --plan "$RUNNER_TEMP/ci-rebuild-plan.json" --outcome "$JOB_OUTCOME" \
            --execution-receipt "$RUNNER_TEMP/cmux-next-fast-tier-cargo.json" \
            --output "$RUNNER_TEMP/ci-rebuild-result.json" >> "$GITHUB_OUTPUT"

      - name: Upload rebuild mirror observation
        if: ${{ always() && steps.reuse.outputs.hit != 'true' && steps.planner-reuse.outputs.hit != 'true' && steps.reuse-key.outputs.mirror == 'true' }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-rebuild-mirror-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-rebuild-result.json
          if-no-files-found: warn
          retention-days: 3

      - name: Save observed candidate pass
        if: ${{ success() && steps.reuse.outputs.hit != 'true' && steps.planner-reuse.outputs.hit != 'true' && steps.rebuild-mirror.outputs.key != '' }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.rebuild-mirror.outputs.key }}
          path: ${{ runner.temp }}/ci-rebuild-result.json
          if-no-files-found: error
          retention-days: 3
          overwrite: true

      # Why: docs/ci/cmux-next-workflow-notes.md#note-45
      - name: Record this pass for the same inputs
        if: ${{ success() && steps.reuse-key.outputs.key != '' && steps.reuse.outputs.hit != 'true' && steps.planner-reuse.outputs.hit != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        run: |
          mkdir -p "$RUNNER_TEMP/ci-job-pass"
          printf '%s\n' "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA" > "$RUNNER_TEMP/ci-job-pass/pass.txt"

      - name: Save the pass
        if: ${{ success() && steps.reuse-key.outputs.key != '' && steps.reuse.outputs.hit != 'true' && steps.planner-reuse.outputs.hit != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.reuse-key.outputs.key }}
          path: ${{ runner.temp }}/ci-job-pass
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  # The CmuxNext test targets the change reaches: path_route's swift_filter
  # (an empty filter runs every target, as on a full-ci PR, a push or a dispatch). No
  # cmux-tui wait: the live-daemon suites skip unless the same-tree binary is
  # already published, and daemon-test runs them against it.
  # PR package/generated jobs read only this attempt's cascade allocations.
  # With missing or carried outputs, stay on the owned side pool: a repository's
  # generic MACOS_RUNNER_26 may name paid capacity with no bounded allocation.
  # The bot's attempt 4 leaves the side pool for the small overflow, like every
  # other cmux-next fleet fallback (run_attempt <= 3, #22565).
  # Keep the existing owned-pool switch: when disabled, retain its small overflow.
  swift-test:
    needs: [path_route, macos-placement, push-head-preflight, web-bundles]
    # Why: docs/ci/cmux-next-workflow-notes.md#note-46
    if: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/feat-cmux-next') && (!cancelled() && (needs.web-bundles.result == 'success' || needs.web-bundles.result == 'skipped') && needs.path_route.outputs.swift == 'true' && needs.push-head-preflight.outputs.current == 'true' && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci'))) }}
    name: cmux-next swift test
    continue-on-error: false
    # A push's Mac job waits for the same job of the running push run and is
    # never cancelled once it runs; a newer push replaces only the waiting one
    # (see the workflow concurrency comment).
    concurrency:
      group: ${{ github.event_name == 'pull_request' && format('cmux-next-pr-{0}-swift-test', github.event.pull_request.number) || github.event_name == 'push' && format('cmux-next-push-{0}-swift-test', github.ref) || format('cmux-next-run-{0}-swift-test', github.run_id) }}
      # Why: docs/ci/cmux-next-workflow-notes.md#note-213
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    # Why: docs/ci/cmux-next-workflow-notes.md#note-214
    environment: ${{ github.event_name != 'pull_request' && 'ci-routing-agent' || '' }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-6vcpu-macos-26' || github.event_name == 'pull_request' && ((github.run_attempt == 1 || github.run_attempt == 2 && contains(fromJSON('["github-actions[bot]","cmux-bot[bot]"]'), github.triggering_actor)) && needs.macos-placement.outputs.placed_attempt == format('{0}', github.run_attempt) && contains(needs.macos-placement.outputs.blacksmith_12_jobs, ' swift-test ') && fromJSON(vars.RUNNER_POOLS).macos_26_large || (github.run_attempt == 1 || github.run_attempt == 2 && contains(fromJSON('["github-actions[bot]","cmux-bot[bot]"]'), github.triggering_actor)) && needs.macos-placement.outputs.placed_attempt == format('{0}', github.run_attempt) && contains(needs.macos-placement.outputs.blacksmith_6_jobs, ' swift-test ') && fromJSON(vars.RUNNER_POOLS).macos_26 || (github.run_attempt == 1 || github.run_attempt == 2 && contains(fromJSON('["github-actions[bot]","cmux-bot[bot]"]'), github.triggering_actor)) && needs.macos-placement.outputs.placed_attempt == format('{0}', github.run_attempt) && contains(needs.macos-placement.outputs.owned_jobs, ' swift-test ') && needs.macos-placement.outputs.runner || needs.macos-placement.outputs.placed_attempt == format('{0}', github.run_attempt) && contains(needs.macos-placement.outputs.retry_jobs, ' swift-test ') && needs.macos-placement.outputs.retry_runner || needs.macos-placement.outputs.placed_attempt == format('{0}', github.run_attempt) && needs.macos-placement.outputs.deferred_runner || (vars.CI_PR_POOL_OWNED == '1' && (github.run_attempt <= 3 || !contains(fromJSON('["github-actions[bot]","cmux-bot[bot]"]'), github.triggering_actor)) && (startsWith(vars.CI_SIDE_LANE_RUNNER, 'glaeda-side-') && vars.CI_SIDE_LANE_RUNNER || 'glaeda-side-std-xcode-26.6') || fromJSON(vars.RUNNER_POOLS).macos_26)) || needs.macos-placement.outputs.placed_attempt == format('{0}', github.run_attempt) && needs.macos-placement.outputs.gui_runner || github.repository_owner != 'manaflow-ai' && 'macos-26' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-6vcpu-macos-26' || needs.macos-placement.outputs.placed_attempt == format('{0}', github.run_attempt) && needs.macos-placement.outputs.gui_overflow != '' && needs.macos-placement.outputs.gui_overflow || vars.CI_PR_POOL_OWNED == '1' && contains(fromJSON('["pull_request","push","workflow_dispatch"]'), github.event_name) && github.run_attempt == 1 && 'glaeda-gui-std-xcode-26.6' || fromJSON(vars.RUNNER_POOLS).macos_26 }}
    permissions:
      # The reuse lookup lists artifacts.
      actions: read
      contents: read
    # Why: docs/ci/cmux-next-workflow-notes.md#note-47
    timeout-minutes: 135
    outputs:
      # Why: docs/ci/cmux-next-workflow-notes.md#note-215
      generated_files: ${{ steps.reuse.outputs.hit == 'true' && 'fresh' || steps.generated-files-verdict.outputs.verdict }}
    env:
      # Why: docs/ci/cmux-next-workflow-notes.md#note-216
      CMUX_NEXT_RUNNER: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-6vcpu-macos-26' || github.event_name == 'pull_request' && ((github.run_attempt == 1 || github.run_attempt == 2 && contains(fromJSON('["github-actions[bot]","cmux-bot[bot]"]'), github.triggering_actor)) && needs.macos-placement.outputs.placed_attempt == format('{0}', github.run_attempt) && contains(needs.macos-placement.outputs.blacksmith_12_jobs, ' swift-test ') && fromJSON(vars.RUNNER_POOLS).macos_26_large || (github.run_attempt == 1 || github.run_attempt == 2 && contains(fromJSON('["github-actions[bot]","cmux-bot[bot]"]'), github.triggering_actor)) && needs.macos-placement.outputs.placed_attempt == format('{0}', github.run_attempt) && contains(needs.macos-placement.outputs.blacksmith_6_jobs, ' swift-test ') && fromJSON(vars.RUNNER_POOLS).macos_26 || (github.run_attempt == 1 || github.run_attempt == 2 && contains(fromJSON('["github-actions[bot]","cmux-bot[bot]"]'), github.triggering_actor)) && needs.macos-placement.outputs.placed_attempt == format('{0}', github.run_attempt) && contains(needs.macos-placement.outputs.owned_jobs, ' swift-test ') && needs.macos-placement.outputs.runner || needs.macos-placement.outputs.placed_attempt == format('{0}', github.run_attempt) && contains(needs.macos-placement.outputs.retry_jobs, ' swift-test ') && needs.macos-placement.outputs.retry_runner || needs.macos-placement.outputs.placed_attempt == format('{0}', github.run_attempt) && needs.macos-placement.outputs.deferred_runner || (vars.CI_PR_POOL_OWNED == '1' && (github.run_attempt <= 3 || !contains(fromJSON('["github-actions[bot]","cmux-bot[bot]"]'), github.triggering_actor)) && (startsWith(vars.CI_SIDE_LANE_RUNNER, 'glaeda-side-') && vars.CI_SIDE_LANE_RUNNER || 'glaeda-side-std-xcode-26.6') || fromJSON(vars.RUNNER_POOLS).macos_26)) || needs.macos-placement.outputs.placed_attempt == format('{0}', github.run_attempt) && needs.macos-placement.outputs.gui_runner || github.repository_owner != 'manaflow-ai' && 'macos-26' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-6vcpu-macos-26' || needs.macos-placement.outputs.placed_attempt == format('{0}', github.run_attempt) && needs.macos-placement.outputs.gui_overflow != '' && needs.macos-placement.outputs.gui_overflow || vars.CI_PR_POOL_OWNED == '1' && contains(fromJSON('["pull_request","push","workflow_dispatch"]'), github.event_name) && github.run_attempt == 1 && 'glaeda-gui-std-xcode-26.6' || fromJSON(vars.RUNNER_POOLS).macos_26 }}
      CMUX_CI_XCODE_APP: ${{ vars.CMUX_CI_XCODE_APP_MACOS_26 }}
      # Why: docs/ci/cmux-next-workflow-notes.md#note-217
      CMUX_CI_REQUIRED_MACOS_SDK_MAJOR: "26"
      SWIFT_FILTER: ${{ needs.path_route.outputs.swift_filter }}
      SWIFT_PRIORITY_FILTER: ${{ needs.path_route.outputs.swift_priority_filter }}
      SWIFT_TARGETS: ${{ needs.path_route.outputs.swift_targets }}
      # Why: docs/ci/cmux-next-workflow-notes.md#note-218
      CMUX_NEXT_FOLD_GENERATED: ${{ needs.path_route.outputs.generated_host == 'swift-test' }}
    steps:
      # Why: docs/ci/cmux-next-workflow-notes.md#note-219
      - name: Give this job its own acpmux home
        run: |
          home="$RUNNER_TEMP/acpmux-home"
          rm -rf "$home" && mkdir -m 700 "$home"
          echo "ACPMUX_HOME=$RUNNER_TEMP/acpmux-home" >> "$GITHUB_ENV"
          # An inherited socket would still name another home's daemon; empty is unset.
          echo "ACPMUX_SOCKET=" >> "$GITHUB_ENV"

      - name: Clear stale git locks (self-hosted reused workspace)
        shell: bash
        run: |
          ws="${GITHUB_WORKSPACE:-$PWD}"
          rm -f "$ws/.git/index.lock" 2>/dev/null || true

      - name: Checkout
        id: checkout
        continue-on-error: true
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          # The package graph reads no submodule; GhosttyNextKit comes from
          # SwiftPM (Packages/Shared/CmuxGhosttyKit).
          submodules: false
          fetch-depth: 2

      # Why: docs/ci/cmux-next-workflow-notes.md#note-220
      - name: Discard the workspace repository after a failed checkout
        if: steps.checkout.outcome == 'failure'
        run: rm -rf "$GITHUB_WORKSPACE/.git"

      - name: Retry checkout after transient network failure
        if: steps.checkout.outcome == 'failure'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          # The package graph reads no submodule; GhosttyNextKit comes from
          # SwiftPM (Packages/Shared/CmuxGhosttyKit).
          submodules: false
          fetch-depth: 2

      # Why: docs/ci/cmux-next-workflow-notes.md#note-221
      - name: Drop stale submodule checkouts (self-hosted reused workspace)
        run: scripts/ci/reset-stale-submodules.sh

      # Why: docs/ci/cmux-next-workflow-notes.md#note-48
      - name: Require the GUI session on a mini
        if: ${{ startsWith(env.CMUX_NEXT_RUNNER, 'glaeda-') && github.event_name != 'pull_request' }}
        shell: bash
        run: echo "CMUX_TEST_REQUIRE_GUI=1" >> "$GITHUB_ENV"

      - name: Select Xcode
        run: ./scripts/select-ci-xcode.sh

      # Why: docs/ci/cmux-next-workflow-notes.md#note-49
      - name: Fingerprint this job's inputs
        id: reuse-key
        if: ${{ vars.CI_NEXT_JOB_REUSE == '1' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        continue-on-error: true
        run: |
          python3 -I scripts/ci/job_input_fingerprint.py swift-test \
            --extra "xcode=$(xcodebuild -version | tr '\n' ' ')" \
            --extra "macos=$(sw_vers -productVersion)" \
            --extra "macos_build=$(sw_vers -buildVersion)" \
            --extra "arch=$(uname -m)" \
            --extra "pool=${{ contains(runner.name, '-glaeda') && 'owned' || startsWith(runner.name, 'blacksmith-') && 'blacksmith' || runner.environment == 'github-hosted' && 'hosted' || runner.name }}" \
            --extra "image=${ImageOS:-}${ImageVersion:+-$ImageVersion}" \
            --extra "mini=${{ startsWith(env.CMUX_NEXT_RUNNER, 'glaeda-') }}" \
            --extra "xcode_app=$CMUX_CI_XCODE_APP" \
            --extra "swift_targets=$SWIFT_TARGETS" \
            --extra "swift_filter=$SWIFT_FILTER" \
            --extra "layout_reducer=${{ !(github.event_name == 'pull_request' && github.base_ref == 'feat-cmux-next') }}" \
            --extra "generated_base=$([[ "$CMUX_NEXT_FOLD_GENERATED" != true ]] || git rev-parse HEAD^1)" \
            --extra "web_bundles=$(python3 scripts/cmux-next/web-bundle-key.py . --source)" >> "$GITHUB_OUTPUT"

      # A feat-cmux-next push or dispatch lists the pass artifacts with a cmux-bot token,
      # Why: docs/ci/cmux-next-workflow-notes.md#note-222
      - name: Mint the cmux-bot artifact read token
        id: reuse-token
        if: ${{ steps.reuse-key.outputs.key != '' && inputs.no_reuse != true && github.event_name != 'pull_request' && github.ref == 'refs/heads/feat-cmux-next' && vars.CMUX_BOT_APP_ID != '' }}
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.CMUX_BOT_APP_ID }}
          private-key: ${{ secrets.CMUX_BOT_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-actions: read

      - name: Look for a pass on the same inputs
        id: reuse
        if: ${{ steps.reuse-key.outputs.key != '' && inputs.no_reuse != true }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.reuse-token.outputs.token || github.token }}
          KEY: ${{ steps.reuse-key.outputs.key }}
        run: python3 -I scripts/ci/job_reuse.py lookup --key "$KEY" >> "$GITHUB_OUTPUT"

      - name: Reuse that pass
        if: ${{ steps.reuse.outputs.hit == 'true' }}
        env:
          KEY: ${{ steps.reuse-key.outputs.key }}
          RUN_URL: ${{ steps.reuse.outputs.run_url }}
          SHA: ${{ steps.reuse.outputs.sha }}
        run: |
          echo "::notice title=cmux-next swift test reused::$RUN_URL passed on the same inputs (${SHA:0:12})"
          echo "Reused $RUN_URL: it passed on \`${SHA:0:12}\` with the same inputs (\`$KEY\`)." >> "$GITHUB_STEP_SUMMARY"

      # Checkout removes .build. Link the owned Mac's kept build after Xcode
      # Why: docs/ci/cmux-next-workflow-notes.md#note-223
      - name: Keep Swift package builds on this owned Mac
        if: ${{ (contains(runner.name, '-glaeda')) && steps.reuse.outputs.hit != 'true' }}
        continue-on-error: true
        run: python3 scripts/ci/owned_spm_scratch.py link "$GITHUB_WORKSPACE"

      # Off the owned Macs, start from the build a feat-cmux-next push seeded for the fast tier
      # (cmux-next-fast-tier-seed.yml): the same `swift build --build-tests` of this package at a
      # recent base, at the same workspace path. With the seed's input times replayed, only what
      # this change touched compiles, so a daemon-only change compiles no Swift and goes straight
      # to the tests. The seed's resource bundles are dropped first (owned_spm_scratch.py
      # drop-bundles, as a kept build's are). Any miss builds as before.
      - name: Compute the fast-tier seed keys
        id: seed-key
        if: ${{ !contains(runner.name, '-glaeda') && steps.reuse.outputs.hit != 'true' }}
        continue-on-error: true
        run: scripts/cmux-next/fast-tier-cache-key.sh >> "$GITHUB_OUTPUT"

      - name: Restore the CmuxNext build the base seeded
        id: seed-restore
        if: ${{ steps.seed-key.outputs.swift-prefix != '' && steps.reuse.outputs.hit != 'true' }}
        continue-on-error: true
        uses: ./.github/actions/cache-restore
        env:
          CI_CACHE_R2_PUBLIC_URL: https://ci-cache-next.cmux.com
        with:
          backend: r2
          path: Packages/macOS/CmuxNext/.build
          key: ${{ steps.seed-key.outputs.swift-key }}
          restore-keys: ${{ steps.seed-key.outputs.swift-prefix }}

      - name: Replay the seed's input times
        if: ${{ steps.seed-restore.outputs.cache-matched-key != '' && steps.reuse.outputs.hit != 'true' }}
        continue-on-error: true
        run: |
          python3 scripts/ci/owned_spm_scratch.py drop-bundles Packages/macOS/CmuxNext/.build
          python3 -I scripts/ci/e2e_warm_derived_data.py replay "$GITHUB_WORKSPACE" Packages/macOS/CmuxNext/.build/cmux-fast-tier-input-mtimes.json

      # The sidebar layout reducer's cargo tests run in fast-tier-cargo on Linux
      # Why: docs/ci/cmux-next-workflow-notes.md#note-224
      - name: Set up pinned cmux-tui Rust (sidebar layout reducer)
        if: ${{ !(github.event_name == 'pull_request' && github.base_ref == 'feat-cmux-next') && steps.reuse.outputs.hit != 'true' }}
        uses: ./.github/actions/setup-cmux-tui-rust

      - name: Install Rust targets (sidebar layout reducer)
        if: ${{ !(github.event_name == 'pull_request' && github.base_ref == 'feat-cmux-next') && steps.reuse.outputs.hit != 'true' }}
        working-directory: cmux-tui
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Test sidebar layout reducer
        if: ${{ !(github.event_name == 'pull_request' && github.base_ref == 'feat-cmux-next') && steps.reuse.outputs.hit != 'true' }}
        working-directory: cmux-tui
        run: cargo test -p cmux-layout-reducer --locked

      # Why: docs/ci/cmux-next-workflow-notes.md#note-50
      - name: Script tests (bundle-server-helper)
        if: ${{ steps.reuse.outputs.hit != 'true' }}
        run: |
          bash scripts/cmux-next/tests/bundle-server-helper.test.sh
          bash scripts/cmux-next/tests/sign-cmux-bundle-helpers.test.sh
          bash tests/test_check_app_personalities.sh

      # The package's resources include the web bundles (agent pane, pages,
      # Why: docs/ci/cmux-next-workflow-notes.md#note-225
      - name: Setup Bun
        if: ${{ steps.reuse.outputs.hit != 'true' }}
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"

      # Why: docs/ci/cmux-next-workflow-notes.md#note-226
      - name: Give this job its own bun
        if: ${{ steps.reuse.outputs.hit != 'true' }}
        run: scripts/cmux-next/private-bun.sh

      # Why: docs/ci/cmux-next-workflow-notes.md#note-227
      - name: Setup Node
        if: ${{ steps.reuse.outputs.hit != 'true' }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.22.1"

      # Why: docs/ci/cmux-next-workflow-notes.md#note-228
      - name: Source key of the web bundles
        if: ${{ steps.reuse.outputs.hit != 'true' }}
        id: web-bundle-key
        run: echo "key=$(python3 scripts/cmux-next/web-bundle-key.py . --source)" >> "$GITHUB_OUTPUT"

      # Why: docs/ci/cmux-next-workflow-notes.md#note-229
      - name: Restore the web bundles from R2
        if: ${{ steps.reuse.outputs.hit != 'true' }}
        id: web-bundle-r2
        uses: ./.github/actions/cache-restore
        env:
          CI_CACHE_R2_PUBLIC_URL: https://ci-cache-next.cmux.com
          CI_CACHE_R2_NAMESPACE: any
        with:
          backend: r2
          path: web-bundles-out
          key: cmux-next-web-bundles-v1-${{ steps.web-bundle-key.outputs.key }}

      - name: Restore the web bundles built for this source key
        id: web-bundle-cache
        if: ${{ (steps.web-bundle-r2.outputs.cache-hit != 'true') && steps.reuse.outputs.hit != 'true' }}
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: web-bundles-out
          key: cmux-next-web-bundles-v1-${{ steps.web-bundle-key.outputs.key }}
          enableCrossOsArchive: true

      - name: Download the web bundles this run's bundle job built
        id: web-bundle-artifact
        if: ${{ ((steps.web-bundle-r2.outputs.cache-hit != 'true' && steps.web-bundle-cache.outputs.cache-hit != 'true') && steps.reuse.outputs.hit != 'true') && needs.web-bundles.result == 'success' }}
        continue-on-error: true
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: cmux-next-web-bundles-${{ steps.web-bundle-key.outputs.key }}
          path: web-bundles-out

      - name: Install the restored web bundles
        if: ${{ (steps.web-bundle-r2.outputs.cache-hit == 'true' || steps.web-bundle-cache.outputs.cache-hit == 'true' || steps.web-bundle-artifact.outcome == 'success') && steps.reuse.outputs.hit != 'true' }}
        run: scripts/cmux-next/build-web-bundles.sh --from web-bundles-out

      - name: Build the web bundles
        if: ${{ (steps.web-bundle-r2.outputs.cache-hit != 'true' && steps.web-bundle-cache.outputs.cache-hit != 'true' && steps.web-bundle-artifact.outcome != 'success') && steps.reuse.outputs.hit != 'true' }}
        run: scripts/cmux-next/build-web-bundles.sh

      - name: Build package and tests
        id: build-tests
        if: ${{ (env.SWIFT_TARGETS != '') && steps.reuse.outputs.hit != 'true' }}
        working-directory: Packages/macOS/CmuxNext
        env:
          CMUX_METRICS_WEB_CACHE_OUTCOME: ${{ steps.web-bundle-cache.outcome }}
          CMUX_METRICS_WEB_CACHE_HIT: ${{ steps.web-bundle-r2.outputs.cache-hit == 'true' && 'true' || steps.web-bundle-cache.outputs.cache-hit }}
        run: python3 ../../../scripts/ci/swiftpm_build_metrics.py --role swift-test --output-dir "$RUNNER_TEMP/cmux-next-build-metrics" -- swift build --build-tests

      - name: Upload the test build measurement and log
        continue-on-error: true
        if: ${{ (always()) && steps.reuse.outputs.hit != 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-next-build-metrics-swift-test-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cmux-next-build-metrics
          if-no-files-found: ignore
          retention-days: 3

      # Why: docs/ci/cmux-next-workflow-notes.md#note-230
      - name: Check generated action catalog, surfaces and inventory
        id: actions
        if: ${{ env.CMUX_NEXT_FOLD_GENERATED == 'true' && steps.reuse.outputs.hit != 'true' }}
        continue-on-error: true
        working-directory: Packages/macOS/CmuxNext
        env:
          CMUX_ACTION_SURFACES_SKIP_BUILD: "1"
        run: ../../../scripts/cmux-next/judge-action-exports.sh "$PWD"

      - name: Check the settings exports
        id: settings
        if: ${{ env.CMUX_NEXT_FOLD_GENERATED == 'true' && steps.reuse.outputs.hit != 'true' }}
        continue-on-error: true
        run: scripts/cmux-next/check-settings-exports.sh

      - name: Compile string catalogs into the resource bundles
        if: ${{ (env.SWIFT_TARGETS != '') && steps.reuse.outputs.hit != 'true' }}
        working-directory: Packages/macOS/CmuxNext
        run: ../../../scripts/cmux-next/compile-string-catalogs.sh

      # Why: docs/ci/cmux-next-workflow-notes.md#note-51
      - name: Find the main-thread-heavy suites
        if: ${{ (env.SWIFT_TARGETS != '') && steps.reuse.outputs.hit != 'true' }}
        run: |
          set -euo pipefail
          heavy="$(python3 scripts/cmux-next/main-thread-heavy-suites.py Packages/macOS/CmuxNext/Tests --targets "$SWIFT_TARGETS")"
          echo "CMUX_NEXT_MAIN_THREAD_HEAVY=$heavy" >> "$GITHUB_ENV"
          suites="$(python3 scripts/cmux-next/main-thread-heavy-suites.py Packages/macOS/CmuxNext/Tests --targets "$SWIFT_TARGETS" --list)"
          echo "CMUX_NEXT_MAIN_THREAD_HEAVY_SUITES=${suites//$'\n'/ }" >> "$GITHUB_ENV"
          while read -r suite; do [[ -z "$suite" ]] || echo "main-thread heavy: $suite"; done <<< "$suites"

      # Samples and fails a run still going after 15 minutes, so a hang shows
      # Why: docs/ci/cmux-next-workflow-notes.md#note-231
      - name: Run package tests (changed suites first, then selected targets)
        id: broad-tests
        if: ${{ (env.SWIFT_TARGETS != '') && steps.reuse.outputs.hit != 'true' }}
        timeout-minutes: 40
        working-directory: Packages/macOS/CmuxNext
        env:
          # Whole-run limit per pass. The hang guard is the stall rule (no test
          # finished in CMUX_NEXT_TEST_STUCK_SECONDS, default 300), so a real
          # hang ends in ~5 min; this only caps a slow healthy pass (~860 s).
          # Both passes share one deadline below the step's 40 minutes. On a
          # 6-vCPU overflow Mac the shards run one at a time (width 1): the
          # broad pass took 1,266-1,371 s over four runs and 1,725 s in run
          # 41372093339, where the last shard (CmuxNextAppTests.Cloud, ~90 s
          # alone) started with 33 s left and was cut at its 60 s floor.
          CMUX_NEXT_TEST_HANG_SECONDS: "1500"
          # Why: docs/ci/cmux-next-workflow-notes.md#note-52
          SWT_EXPERIMENTAL_MAXIMUM_PARALLELIZATION_WIDTH: "1"
        run: |
          set -euo pipefail
          echo "Test targets: $SWIFT_TARGETS"
          # One deadline for both passes, 2 min inside the step timeout, so a pass
          # hung before any test starts is still sampled and reported.
          deadline=$(( $(date +%s) + 2280 ))
          # The heavy suites only ever run in their own step: never --skip "" (an
          # empty pattern matches, and so skips, every test).
          heavy_skip=()
          [[ -z "$CMUX_NEXT_MAIN_THREAD_HEAVY" ]] || heavy_skip=(--skip "$CMUX_NEXT_MAIN_THREAD_HEAVY")
          priority_skip=()
          priority_status=0
          if [[ -n "$SWIFT_PRIORITY_FILTER" ]]; then
            echo "Changed Swift suites first: $SWIFT_PRIORITY_FILTER"
            if ../../../scripts/cmux-next/swift-test-with-hang-sampler.sh --skip-build --no-parallel --filter "$SWIFT_PRIORITY_FILTER" \
                ${heavy_skip[@]+"${heavy_skip[@]}"}; then
              :
            else
              priority_status=$?
              echo "Changed Swift suite shard failed with status $priority_status; continuing with the selected target pass" >&2
            fi
            priority_skip=(--skip "$SWIFT_PRIORITY_FILTER")
          fi
          # The selected targets as several test processes at once, split by
          # target and suite prefix (scripts/cmux-next/swift-test-shards.py), as
          # many at a time as the runner's cores and memory hold. One process ran
          # them all before: ~6,300 tests queued on its one main thread and the
          # windows they left open piled up (3 -> 428), so throughput fell from
          # ~2,000 to ~100 tests a minute and the pass hit its limit with 466
          # tests unfinished (#26809, run 40705037968).
          # The same-tree cmux-tui as it is when the broad pass starts, the same
          # for every shard. In the one shared process the base runs, the
          # live-daemon suites read the tree once, early, before any
          # CmuxNextDaemonTests suite could fetch it (RealBinary.sameTree), so
          # they ran only when the tree was already here (after the
          # changed-suites pass fetched it, say) and skipped otherwise. As
          # shards, those that started after a fetch ran them and the rest
          # skipped (run 40932106119: 87 skipped, 315 on the base). Resolved
          # once here, a missing tree is a path that is never a file: no shard
          # fetches it, and every live-daemon suite skips as on the base. The
          # daemon tests job fetches the tree and runs the daemon suites.
          tree_path="$(../../../scripts/cmux-next/pin-cmux-tui.sh path 2>/dev/null)" || tree_path=""
          if [[ -n "$tree_path" && -x "$tree_path" ]]; then
            echo "Broad pass same-tree cmux-tui: $tree_path"
          else
            echo "Broad pass same-tree cmux-tui: not here yet; the live-daemon suites skip"
            tree_path=/dev/null/no-same-tree-here
          fi
          broad_status=0
          if CMUX_NEXT_TUI_TREE_PATH="$tree_path" python3 ../../../scripts/cmux-next/swift-test-shards.py run --targets "$SWIFT_TARGETS" \
              --exclude CmuxNextControlTests --wrapper ../../../scripts/cmux-next/swift-test-with-hang-sampler.sh \
              --deadline "$deadline" --spill "$RUNNER_TEMP/cmux-next-spilled-shards.json" \
              -- ${priority_skip[@]+"${priority_skip[@]}"} --skip BranchStateResourcesTests \
              --skip CloudBringBackTests --skip CommitBoundaryAppKitTests ${heavy_skip[@]+"${heavy_skip[@]}"}; then
            :
          else
            broad_status=$?
          fi
          (( priority_status == 0 && broad_status == 0 ))

      # The shards the broad pass had no time for. Each shard there started with the time left to
      # the pass's deadline, so one slow shard cut the next ones short: in run 41665450504 shard 13
      # took 867 s and shards 14 and 15 were killed at a 60 s limit, 0 of 447 finished tests red,
      # and a cut-short run is never a base red. A shard with under its floor left (450 s, the p90
      # of 28 measured shards; swift-test-shards.py SHARD_FLOOR_SECONDS) is spilled here and runs
      # with a deadline of its own. It runs after a red broad pass too, so its verdict is not lost.
      - name: Run package test shards the broad pass spilled
        if: ${{ (!cancelled() && (steps.broad-tests.outcome == 'success' || steps.broad-tests.outcome == 'failure')) && steps.reuse.outputs.hit != 'true' }}
        timeout-minutes: 30
        working-directory: Packages/macOS/CmuxNext
        env:
          SWT_EXPERIMENTAL_MAXIMUM_PARALLELIZATION_WIDTH: "1"
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + 1680 ))
          python3 ../../../scripts/cmux-next/swift-test-shards.py spilled --from "$RUNNER_TEMP/cmux-next-spilled-shards.json" \
            --wrapper ../../../scripts/cmux-next/swift-test-with-hang-sampler.sh --deadline "$deadline"

      # Cloud bring-back round trips launch two daemons and mutate shared
      # Why: docs/ci/cmux-next-workflow-notes.md#note-232
      - name: Run CloudBringBack cases in fresh processes
        if: ${{ (!cancelled() && steps.build-tests.outcome == 'success' && (env.SWIFT_TARGETS == 'all' || contains(env.SWIFT_TARGETS, 'CmuxNextAppTests'))) && steps.reuse.outputs.hit != 'true' }}
        timeout-minutes: 40
        working-directory: Packages/macOS/CmuxNext
        env:
          CMUX_NEXT_TEST_HANG_SECONDS: "900"
          SWT_EXPERIMENTAL_MAXIMUM_PARALLELIZATION_WIDTH: "1"
        run: |
          set -euo pipefail
          status=0
          for test in \
            CloudBringBackTests.aCLIBringBackEndsWithTheChatInALocalTabAndTheMachineTabClosed \
            CloudBringBackTests.aRevokeThatFailsIsTriedAgainUntilItIsDone \
            CloudBringBackTests.aFileAskFromAMovedChatShowsACardAndOnlyThePersonsClickAnswersIt \
            CloudBringBackTests.aSecretAskTakesWhatThePersonTypesOnStdinOnlyAndNoFileHoldsIt \
            CloudBringBackTests.aFileDroppedInAMovedChatGoesToItsMachineFromThisMacsPastesFolderOnly \
            CloudBringBackTests.aSyncConflictKeepsTheMachineTabAndShowsTheConflict \
            CloudBringBackTests.anOutdatedMachineIsNamedAndTheChatStaysOnIt \
            CloudBringBackTests.updateMachineUpdatesAnOutdatedMachineThenBringsTheChatBack \
            CloudBringBackTests.aGuardRefusalKeepsTheMachineTabWithAClearMessage \
            CloudBringBackTests.aGuardRefusalOffersAskFirstThenBringsTheChatBack \
            CloudBringBackTests.aCommittedBringBackWhoseTabFailedStillOpensItAfterARelaunch \
            CloudBringBackTests.aSyncPullThatThrowsKeepsTheBringBackRetryable; do
            echo "Running isolated CloudBringBack case: $test"
            if ../../../scripts/cmux-next/swift-test-with-hang-sampler.sh --skip-build --no-parallel --filter "$test"; then
              :
            else
              case_status=$?
              (( status == 0 )) && status=$case_status
              echo "Cloud bring-back case failed: $test (status $case_status)"
            fi
          done
          exit "$status"

      # The commit-boundary audit reads every observer on the main run loop, so
      # Why: docs/ci/cmux-next-workflow-notes.md#note-233
      - name: Run the commit-boundary audit in its own process
        if: ${{ (!cancelled() && steps.build-tests.outcome == 'success' && (env.SWIFT_TARGETS == 'all' || contains(env.SWIFT_TARGETS, 'CmuxNextAppTests'))) && steps.reuse.outputs.hit != 'true' }}
        timeout-minutes: 10
        working-directory: Packages/macOS/CmuxNext
        env:
          CMUX_NEXT_TEST_HANG_SECONDS: "300"
        run: ../../../scripts/cmux-next/swift-test-with-hang-sampler.sh --skip-build --no-parallel --filter CommitBoundaryAppKitTests

      # Suites that hold the test process's main thread for minutes when they
      # share it (scripts/cmux-next/main-thread-heavy-suites.py says which),
      # run in their own process, one test at a time. Each Core Animation
      # commit lays out every window the process holds: in the shared pass
      # SidebarHugeGroupTests' oneGroup10k (about 1 s alone) and
      # SidebarLagTests held the main thread for 5 to 11+ minutes, and
      # RemoteVideoPageTests' WebKit downloads held it in a kernel call
      # (SandboxExtension::createHandle -> __mac_syscall) for 300+ s. Every
      # main-actor test beside them stalled or failed on timing, and the stuck
      # watchdog killed the run with hundreds of tests unfinished (#26809's
      # runs 40660100939, 40677563234 and 40683540650). Each suite gets a fresh
      # process: in one shared serial process the windows earlier gallery
      # suites left open made SidebarScrollCostTests' 500-row scroll take 300+
      # s and the stuck watchdog ended the step (run 40693598261). A hang or a
      # red here is this step's red, and every suite still runs. Each suite's
      # watchdog limits come from main-thread-heavy-suites.py --runs: 600 s for
      # the run and 300 s with no test finished, or above the suite's own
      # `.timeLimit` (ClassicUpgradeHugeSimulationTests: 15 min, so 1200 s and
      # 1020 s; it took 412 s alone and one test was open 572 s in a shard).
      - name: Run main-thread-heavy suites in their own process
        if: ${{ (!cancelled() && steps.build-tests.outcome == 'success' && env.CMUX_NEXT_MAIN_THREAD_HEAVY != '') && steps.reuse.outputs.hit != 'true' }}
        timeout-minutes: 60
        working-directory: Packages/macOS/CmuxNext
        run: |
          set -uo pipefail
          status=0
          runs="$(python3 ../../../scripts/cmux-next/main-thread-heavy-suites.py Tests --targets "$SWIFT_TARGETS" --runs)" || exit 1
          while read -r suite hang stuck; do
            [[ -n "$suite" ]] || continue
            echo "::group::$suite (run limit ${hang} s, stuck limit ${stuck} s)"
            if ! CMUX_NEXT_TEST_HANG_SECONDS="$hang" CMUX_NEXT_TEST_STUCK_SECONDS="$stuck" \
                ../../../scripts/cmux-next/swift-test-with-hang-sampler.sh --skip-build --no-parallel --filter "${suite//./\\.}\\b" < /dev/null; then
              status=1
              echo "::error title=main-thread-heavy suite red::$suite"
            fi
            echo "::endgroup::"
          done <<< "$runs"
          exit "$status"

      # Each isolated step below runs when its suites' target is selected and
      # Why: docs/ci/cmux-next-workflow-notes.md#note-53
      - name: Run control package tests and callback regressions
        if: ${{ (!cancelled() && steps.build-tests.outcome == 'success' && (env.SWIFT_TARGETS == 'all' || contains(env.SWIFT_TARGETS, 'CmuxNextControlTests') || contains(env.SWIFT_TARGETS, 'CmuxNextAppTests'))) && steps.reuse.outputs.hit != 'true' }}
        timeout-minutes: 20
        working-directory: Packages/macOS/CmuxNext
        env:
          CMUX_NEXT_TEST_HANG_SECONDS: "900"
          MAIN_THREAD_HOLDERS: 'CmuxNextControlTests\.(MainThreadWatchdogPolicyTests|MainThreadWatchdogTests|MainThreadWatchdogTaskWakeTests|MainTaskBoardSpanTests|ActionBudgetSpanTests|ControlLaneTests|MainFrameBudgetTests|MainActorWorkQueueTests|HangEpisode[A-Za-z]*Tests|ActionBatchTests|ActionRunCreatedTests|TerminalStartDeadlineTests)\b'
        run: |
          set -uo pipefail
          status=0
          ../../../scripts/cmux-next/swift-test-with-hang-sampler.sh --skip-build --filter 'CmuxNextControlTests' \
            --skip CLISurfaceParityTests --skip "$MAIN_THREAD_HOLDERS" || status=$?
          held=0
          ../../../scripts/cmux-next/swift-test-with-hang-sampler.sh --skip-build --no-parallel --filter "$MAIN_THREAD_HOLDERS" || held=$?
          (( status == 0 && held == 0 ))

      # The CLI parity tests assert routing, not scheduler throughput. Concurrent
      # Why: docs/ci/cmux-next-workflow-notes.md#note-234
      - name: Run CLI parity tests
        if: ${{ (!cancelled() && steps.build-tests.outcome == 'success' && (env.SWIFT_TARGETS == 'all' || contains(env.SWIFT_TARGETS, 'CmuxNextControlTests') || contains(env.SWIFT_TARGETS, 'CmuxNextAppTests'))) && steps.reuse.outputs.hit != 'true' }}
        timeout-minutes: 10
        working-directory: Packages/macOS/CmuxNext
        env:
          CMUX_NEXT_TEST_HANG_SECONDS: "480"
        run: ../../../scripts/cmux-next/swift-test-with-hang-sampler.sh --skip-build --no-parallel --filter CLISurfaceParityTests

      # Why: docs/ci/cmux-next-workflow-notes.md#note-235
      - name: Run state-resource regressions
        if: ${{ (!cancelled() && steps.build-tests.outcome == 'success' && (env.SWIFT_TARGETS == 'all' || contains(env.SWIFT_TARGETS, 'CmuxNextDaemonTests'))) && steps.reuse.outputs.hit != 'true' }}
        timeout-minutes: 10
        working-directory: Packages/macOS/CmuxNext
        env:
          CMUX_NEXT_TEST_HANG_SECONDS: "480"
        run: ../../../scripts/cmux-next/swift-test-with-hang-sampler.sh --skip-build --no-parallel --filter BranchStateResourcesTests

      - name: Regenerate stale files
        id: regenerate
        if: ${{ !cancelled() && (steps.actions.outcome == 'failure' || steps.settings.outcome == 'failure') && steps.reuse.outputs.hit != 'true' }}
        run: |
          set -euo pipefail
          if [[ "${{ steps.actions.outcome }}" == failure ]]; then
            scripts/cmux-next/regenerate-action-contracts.sh
          fi
          # A stale settings export was already written into the checkout by the
          # check above.
          # The defaults snapshot reads the action and settings exports, so it
          # follows whichever of them was regenerated.
          python3 scripts/ci/defaults_guard.py snapshot
          # The regenerated files themselves, at their repository paths, so
          # they copy onto the PR head. A diff would be against the merge
          # commit, whose context the head may not have.
          out="$RUNNER_TEMP/generated/files"
          mkdir -p "$out"
          generated=('plans/cmux-next/*.json' 'plans/cmux-next/*.md'
            schemas/settings/settings-schema.json 'docs/mdm/*' schemas/defaults/cmux-next.json)
          git add -N -- "${generated[@]}"
          git diff --name-only -- "${generated[@]}" > "$RUNNER_TEMP/generated/paths.txt"
          git diff --stat
          while IFS= read -r path; do
            mkdir -p "$out/$(dirname "$path")"
            cp "$path" "$out/$path"
          done < "$RUNNER_TEMP/generated/paths.txt"
          cp "$RUNNER_TEMP/generated/paths.txt" "$out/.paths"
          if [[ -s "$RUNNER_TEMP/generated/paths.txt" ]]; then
            echo "patch=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload the regenerated files
        if: ${{ !cancelled() && steps.regenerate.outputs.patch == 'true' && steps.reuse.outputs.hit != 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-next-generated-patch
          path: ${{ runner.temp }}/generated/files
          include-hidden-files: true
          retention-days: 3

      # Why: docs/ci/cmux-next-workflow-notes.md#note-236
      - name: Give the generated files verdict
        id: generated-files-verdict
        if: ${{ !cancelled() && env.CMUX_NEXT_FOLD_GENERATED == 'true' && steps.reuse.outputs.hit != 'true' }}
        env:
          ACTIONS: ${{ steps.actions.outcome }}
          # Why: docs/ci/cmux-next-workflow-notes.md#note-237
          CATALOG: ${{ steps.actions.outputs.catalog }}
          SETTINGS: ${{ steps.settings.outcome }}
        run: |
          if [[ "$ACTIONS" == failure && "$CATALOG" == failure ]]; then
            verdict=catalog
            {
              echo "### The action catalog checks fail: a catalog failure, not stale files"
              echo
              echo "Fresh exports fail the same checks, so regenerating changes nothing. The step \"Check generated action catalog, surfaces and inventory\" names the failing test."
              [[ "$SETTINGS" != failure ]] || echo "- settings exports are also stale: scripts/cmux-next/regenerate-settings-exports.sh"
            } | tee -a "$GITHUB_STEP_SUMMARY"
          elif [[ "$ACTIONS" == failure || "$SETTINGS" == failure ]]; then
            verdict=stale
            {
              echo "### Generated cmux-next files are stale"
              echo
              [[ "$ACTIONS" != failure ]] || echo "- action catalog, surfaces or inventory: scripts/cmux-next/regenerate-action-contracts.sh"
              [[ "$SETTINGS" != failure ]] || echo "- settings exports: scripts/cmux-next/regenerate-settings-exports.sh"
              echo
              echo "The cmux-next-generated-patch artifact holds the regenerated files at their repository paths."
            } | tee -a "$GITHUB_STEP_SUMMARY"
          elif [[ "$ACTIONS" == success && "$SETTINGS" == success ]]; then
            verdict=fresh
          else
            # The build failed or the checks never ran: no verdict, which generated-verdict fails.
            verdict=
          fi
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"

      # Also after a failure or a cancel: end the daemon of this job's home and
      # Why: docs/ci/cmux-next-workflow-notes.md#note-238
      - name: Stop this job's acpmux daemons and remove its home
        if: ${{ always() && steps.reuse.outputs.hit != 'true' }}
        continue-on-error: true
        timeout-minutes: 3
        run: |
          home="$RUNNER_TEMP/acpmux-home"
          [[ -d "$home" ]] || exit 0
          acpmux="$(PATH="$PATH:$HOME/.local/bin:$HOME/.cargo/bin:/opt/homebrew/bin:/usr/local/bin" command -v acpmux || true)"
          [[ -z "$acpmux" ]] || env -u ACPMUX_SOCKET ACPMUX_HOME="$home" "$acpmux" daemon shutdown --end-agents || true
          rm -rf "$home"

      # A test helper that died on a signal leaves its crash report here
      # Why: docs/ci/cmux-next-workflow-notes.md#note-239
      - name: Upload the test helper's crash reports
        if: ${{ (failure()) && steps.reuse.outputs.hit != 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: swift-test-crash-reports-${{ github.run_attempt }}
          path: ${{ runner.temp }}/swift-test-crash-reports
          if-no-files-found: ignore
          retention-days: 3
      # Why: docs/ci/cmux-next-workflow-notes.md#note-54
      - name: Record this pass for the same inputs
        if: ${{ success() && steps.reuse-key.outputs.key != '' && steps.reuse.outputs.hit != 'true' && (env.CMUX_NEXT_FOLD_GENERATED != 'true' || steps.generated-files-verdict.outputs.verdict == 'fresh') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        run: |
          mkdir -p "$RUNNER_TEMP/ci-job-pass"
          printf '%s\n' "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA" > "$RUNNER_TEMP/ci-job-pass/pass.txt"

      - name: Save the pass
        if: ${{ success() && steps.reuse-key.outputs.key != '' && steps.reuse.outputs.hit != 'true' && (env.CMUX_NEXT_FOLD_GENERATED != 'true' || steps.generated-files-verdict.outputs.verdict == 'fresh') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.reuse-key.outputs.key }}
          path: ${{ runner.temp }}/ci-job-pass
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  # Why: docs/ci/cmux-next-workflow-notes.md#note-55
  daemon-test:
    needs: [path_route, macos-placement, push-head-preflight, web-bundles]
    # Why: docs/ci/cmux-next-workflow-notes.md#note-240
    if: ${{ inputs.same_tree_origin != 'push' && !cancelled() && (needs.web-bundles.result == 'success' || needs.web-bundles.result == 'skipped') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository || contains(github.event.pull_request.labels.*.name, 'full-ci')) && ((inputs.same_tree_sha == '' && needs.path_route.outputs.daemon == 'true' && needs.push-head-preflight.outputs.current == 'true' && needs.path_route.outputs.tree_state == 'ready') || (inputs.same_tree_sha != '' && inputs.same_tree_state == 'ready' && contains(inputs.same_tree_tiers, 'daemon'))) }}
    name: cmux-next daemon tests
    # A push's Mac job waits for the same job of the running push run and is
    # never cancelled once it runs; a newer push replaces only the waiting one
    # (see the workflow concurrency comment).
    concurrency:
      group: ${{ github.event_name == 'push' && format('cmux-next-push-{0}-daemon-test', github.ref) || format('cmux-next-run-{0}-daemon-test', github.run_id) }}
      cancel-in-progress: false
