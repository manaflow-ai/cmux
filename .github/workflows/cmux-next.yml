      CMUX_CI_XCODE_APP: ${{ vars.CMUX_CI_XCODE_APP_MACOS_26 }}
      CMUX_CI_REQUIRED_MACOS_SDK_MAJOR: "26"
    steps:
      - name: Clear stale git locks (self-hosted reused workspace)
        shell: bash
        run: |
          ws="${GITHUB_WORKSPACE:-$PWD}"
          rm -f "$ws/.git/index.lock" 2>/dev/null || true

      - name: Checkout
        id: checkout
        continue-on-error: true
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: false
          fetch-depth: 2

      # Why: docs/ci/cmux-next-workflow-notes.md#note-287
      - name: Discard the workspace repository after a failed checkout
        if: steps.checkout.outcome == 'failure'
        run: rm -rf "$GITHUB_WORKSPACE/.git"

      - name: Retry checkout after transient network failure
        if: steps.checkout.outcome == 'failure'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: false
          fetch-depth: 2

      # Why: docs/ci/cmux-next-workflow-notes.md#note-288
      - name: Drop stale submodule checkouts (self-hosted reused workspace)
        run: scripts/ci/reset-stale-submodules.sh

      - name: Select Xcode
        run: ./scripts/select-ci-xcode.sh

      # Why: docs/ci/cmux-next-workflow-notes.md#note-66
      - name: Fingerprint this job's inputs
        id: reuse-key
        if: ${{ vars.CI_NEXT_JOB_REUSE == '1' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        continue-on-error: true
        run: |
          python3 -I scripts/ci/job_input_fingerprint.py release-compile \
            --extra "xcode=$(xcodebuild -version | tr '\n' ' ')" \
            --extra "macos=$(sw_vers -productVersion)" \
            --extra "macos_build=$(sw_vers -buildVersion)" \
            --extra "arch=$(uname -m)" \
            --extra "pool=${{ contains(runner.name, '-glaeda') && 'owned' || startsWith(runner.name, 'blacksmith-') && 'blacksmith' || runner.environment == 'github-hosted' && 'hosted' || runner.name }}" \
            --extra "image=${ImageOS:-}${ImageVersion:+-$ImageVersion}" \
            --extra "mini=${{ startsWith(env.CMUX_NEXT_RUNNER, 'glaeda-') }}" \
            --extra "xcode_app=$CMUX_CI_XCODE_APP" >> "$GITHUB_OUTPUT"

      # A feat-cmux-next push or dispatch lists the pass artifacts with a cmux-bot token,
      # Why: docs/ci/cmux-next-workflow-notes.md#note-289
      - name: Mint the cmux-bot artifact read token
        id: reuse-token
        if: ${{ steps.reuse-key.outputs.key != '' && inputs.no_reuse != true && github.event_name != 'pull_request' && github.ref == 'refs/heads/feat-cmux-next' && vars.CMUX_BOT_APP_ID != '' }}
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.CMUX_BOT_APP_ID }}
          private-key: ${{ secrets.CMUX_BOT_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-actions: read

      - name: Look for a pass on the same inputs
        id: reuse
        if: ${{ steps.reuse-key.outputs.key != '' && inputs.no_reuse != true }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.reuse-token.outputs.token || github.token }}
          KEY: ${{ steps.reuse-key.outputs.key }}
        run: python3 -I scripts/ci/job_reuse.py lookup --key "$KEY" >> "$GITHUB_OUTPUT"

      - name: Reuse that pass
        if: ${{ steps.reuse.outputs.hit == 'true' }}
        env:
          KEY: ${{ steps.reuse-key.outputs.key }}
          RUN_URL: ${{ steps.reuse.outputs.run_url }}
          SHA: ${{ steps.reuse.outputs.sha }}
        run: |
          echo "::notice title=cmux-next Release compile (Xcode 26) reused::$RUN_URL passed on the same inputs (${SHA:0:12})"
          echo "Reused $RUN_URL: it passed on \`${SHA:0:12}\` with the same inputs (\`$KEY\`)." >> "$GITHUB_STEP_SUMMARY"

      # On a mini, the compile reads the fleet's shared compile cache (glaeda fleet-cas, the store
      # Why: docs/ci/cmux-next-workflow-notes.md#note-67
      - name: Release compile
        if: ${{ steps.reuse.outputs.hit != 'true' }}
        env:
          CMUX_BUILD_METRICS_DIR: ${{ runner.temp }}/cmux-next-build-metrics/release
          CMUX_BUILD_METRICS_OUTPUT: ${{ runner.temp }}/cmux-next-build-metrics/release/metrics.json
          CMUX_BUILD_METRICS_SUMMARY: ${{ runner.temp }}/cmux-next-build-metrics/release/summary.md
          CMUX_NEXT_RELEASE_FLEET_CAS: ${{ vars.CMUX_NEXT_RELEASE_FLEET_CAS == 'off' && 'off' || 'read' }}
        run: |
          derived_data="$(scripts/cmux-next/release-derived-data-path.sh release-compile Release)"
          [[ "$CMUX_NEXT_RUNNER" == glaeda-* ]] || export CMUX_NEXT_RELEASE_FLEET_CAS=off
          scripts/cmux-next/release-compile-fleet-cas.sh "$derived_data"

      # Early advisory for a newly bundled binary. The signed nightly check
      # Why: docs/ci/cmux-next-workflow-notes.md#note-290
      - name: Warn on missing Release bundle notices
        if: ${{ always() && steps.reuse.outputs.hit != 'true' }}
        continue-on-error: true
        run: |
          set -uo pipefail
          # The compile's DerivedData: the canonical root's on a fleet-cache build (until another
          # compile takes the root), else this runner's.
          derived_data="${CMUX_NEXT_RELEASE_DERIVED_DATA:-$(scripts/cmux-next/release-derived-data-path.sh release-compile Release)}"
          app="$(find "$derived_data/Build/Products/Release" -maxdepth 2 -type d -name '*.app' -print -quit 2>/dev/null || true)"
          if [[ -z "$app" ]]; then
            echo "::warning title=Release bundle notices::no Release .app product was found for the advisory notice scan"
            exit 0
          fi
          if ! scripts/verify-app-bundle-licenses.sh "$app"; then
            echo "::warning title=Release bundle notices::the advisory scan found a missing or unmapped bundled binary; the signed nightly check remains required"
          fi

      - name: Upload Release compile timing
        if: ${{ always() && steps.reuse.outputs.hit != 'true' }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-next-release-compile-timing-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cmux-next-build-metrics/release
          if-no-files-found: ignore
          retention-days: 3

      # Why: docs/ci/cmux-next-workflow-notes.md#note-68
      - name: Fetch the Chromium engine
        id: cef
        if: ${{ (startsWith(env.CMUX_NEXT_RUNNER, 'glaeda-')) && steps.reuse.outputs.hit != 'true' }}
        env:
          CMUX_CEF_R2_ACCOUNT_ID: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && secrets.CMUX_CEF_R2_ACCOUNT_ID || '' }}
          CMUX_CEF_R2_ACCESS_KEY_ID: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && secrets.CMUX_CEF_R2_ACCESS_KEY_ID || '' }}
          CMUX_CEF_R2_SECRET_ACCESS_KEY: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && secrets.CMUX_CEF_R2_SECRET_ACCESS_KEY || '' }}
          CMUX_CEF_R2_ENV_FILE: /dev/null
        run: |
          set -euo pipefail
          if cef_dir="$(env -u GH_TOKEN -u GITHUB_TOKEN scripts/cmux-next/ensure-cef.sh --optional)" && [[ -n "$cef_dir" ]]; then
            echo "Chromium engine at $cef_dir"
            echo "dir=$cef_dir" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Chromium engine artifact not readable on this runner; skipping the CEF shim compile"
          fi

      - name: Compile the CEF shim against the pinned engine
        if: ${{ (steps.cef.outputs.dir != '') && steps.reuse.outputs.hit != 'true' }}
        env:
          CEF_DIR: ${{ steps.cef.outputs.dir }}
        run: scripts/cmux-next/build-cef-shim.sh "$CEF_DIR" "$(scripts/cmux-next/cef-cache-root.sh)/shim"

      # Why: docs/ci/cmux-next-workflow-notes.md#note-291
      - name: Chromium Objective-C contract against the pinned engine
        if: ${{ (steps.cef.outputs.dir != '') && steps.reuse.outputs.hit != 'true' }}
        env:
          CEF_DIR: ${{ steps.cef.outputs.dir }}
        run: python3 -I scripts/cmux-next/check-cef-objc-contract.py --framework "$CEF_DIR/Chromium Embedded Framework.framework"
      # Why: docs/ci/cmux-next-workflow-notes.md#note-69
      - name: Request nightly-next promotion after this gate
        if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/feat-cmux-next' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: scripts/cmux-next/request-nightly-next.sh --sha "$SHA" --repo "$GITHUB_REPOSITORY" --release-compile-green

      - name: Record this pass for the same inputs
        if: ${{ success() && steps.reuse-key.outputs.key != '' && steps.reuse.outputs.hit != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (!startsWith(env.CMUX_NEXT_RUNNER, 'glaeda-') || steps.cef.outputs.dir != '') }}
        run: |
          mkdir -p "$RUNNER_TEMP/ci-job-pass"
          printf '%s\n' "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA" > "$RUNNER_TEMP/ci-job-pass/pass.txt"

      - name: Save the pass
        if: ${{ success() && steps.reuse-key.outputs.key != '' && steps.reuse.outputs.hit != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (!startsWith(env.CMUX_NEXT_RUNNER, 'glaeda-') || steps.cef.outputs.dir != '') }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.reuse-key.outputs.key }}
          path: ${{ runner.temp }}/ci-job-pass
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  # Why: docs/ci/cmux-next-workflow-notes.md#note-70
  swift-exports-cache:
    needs: [path_route, checks, generated-files, generated-verdict, swift-test, daemon-test]
    # Why: docs/ci/cmux-next-workflow-notes.md#note-292
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/feat-cmux-next' && needs.path_route.result == 'success' && needs.checks.result == 'success' && (needs.generated-files.result == 'success' || needs.generated-files.result == 'skipped' && needs.generated-verdict.result == 'success') && needs.swift-test.result == 'success' && needs.daemon-test.result == 'success' }}
    name: cmux-next Swift exports cache
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.CI_CLOUD_OVERFLOW_SAVED && (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-8vcpu-ubuntu-2404' || fromJSON(vars.RUNNER_POOLS).linux_8) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-2vcpu-ubuntu-2404' || fromJSON(vars.RUNNER_POOLS).linux_2) }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Source key of the Swift exports
        id: key
        run: echo "key=$(python3 scripts/cmux-next/swift-exports-key.py . --source)" >> "$GITHUB_OUTPUT"

      - name: Look up the cache entry
        id: lookup
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: swift-exports-out
          key: cmux-next-swift-exports-v1-${{ steps.key.outputs.key }}
          lookup-only: true

      - name: Pack the Swift exports
        if: steps.lookup.outputs.cache-hit != 'true'
        run: scripts/cmux-next/swift-exports-cache.sh pack swift-exports-out

      - name: Save the Swift exports under their source key
        if: steps.lookup.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: swift-exports-out
          key: cmux-next-swift-exports-v1-${{ steps.key.outputs.key }}

  # Why: docs/ci/cmux-next-workflow-notes.md#note-7
  request-nightly-next:
    needs: release-compile
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/feat-cmux-next' && needs.release-compile.result == 'success' }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-4vcpu-ubuntu-2404' || vars.LINUX_RUNNER || fromJSON(vars.RUNNER_POOLS).linux_4 }}
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 1

      # Why: docs/ci/cmux-next-workflow-notes.md#note-293
      - name: Drop stale submodule checkouts (self-hosted reused workspace)
        run: scripts/ci/reset-stale-submodules.sh

      - name: Request nightly-next promotion on main
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: scripts/cmux-next/request-nightly-next.sh --sha "$SHA" --repo "$GITHUB_REPOSITORY" --release-compile-green

      # Why: docs/ci/cmux-next-workflow-notes.md#note-71
      - name: Request a nightly-next continuation for an accepted pending build
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/cmux-next/continue-nightly-next.sh --repo "$GITHUB_REPOSITORY"

  # Why: docs/ci/cmux-next-workflow-notes.md#note-8
  dev-daily-place:
    needs: [path_route, push-head-preflight, dev-daily-tree-wait]
    if: ${{ !cancelled() && github.repository == 'manaflow-ai/cmux' && github.run_attempt == 1 && vars.CI_PR_POOL_OWNED == '1' && format('{0}', vars.CMUX_NEXT_DEV_COMPILE_AFFINITY) != '0' && (github.event_name == 'workflow_dispatch' && inputs.dev_daily == true && github.ref == 'refs/heads/feat-cmux-next' && ((inputs.same_tree_sha == '' && inputs.dev_daily_sha == github.sha && needs.push-head-preflight.outputs.current == 'true') || (inputs.same_tree_sha != '' && inputs.dev_daily_sha == inputs.same_tree_sha && inputs.same_tree_state == 'ready'))) && ((inputs.same_tree_sha == '' && needs.path_route.outputs.scheme == 'true' && needs.push-head-preflight.outputs.current == 'true' && (needs.path_route.outputs.tree_state == 'ready' || needs.dev-daily-tree-wait.outputs.tree_state == 'ready')) || (inputs.same_tree_sha != '' && inputs.same_tree_state == 'ready' && contains(inputs.same_tree_tiers, 'scheme'))) }}
    name: cmux NEXT DEV compile placement
    environment:
      name: ci-routing-agent
      deployment: false
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.CI_CLOUD_OVERFLOW_SAVED && (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-16vcpu-ubuntu-2404' || fromJSON(vars.RUNNER_POOLS).linux_16) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-4vcpu-ubuntu-2404' || fromJSON(vars.RUNNER_POOLS).linux_4) }}
    timeout-minutes: 4
