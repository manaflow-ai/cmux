acement.outputs.retry_jobs, ' cmux-scheme-compile ') && needs.macos-placement.outputs.retry_runner || vars.CI_PR_POOL_OWNED == '1' && contains(fromJSON('["pull_request","push","workflow_dispatch"]'), github.event_name) && (github.run_attempt <= 3 || !contains(fromJSON('["github-actions[bot]","cmux-bot[bot]"]'), github.triggering_actor)) && vars.CI_SIDE_LANE_RUNNER || vars.MACOS_RUNNER_26 || fromJSON(vars.RUNNER_POOLS).macos_26) }}
    # Why: docs/ci/cmux-next-workflow-notes.md#note-295
    permissions:
      actions: read
      contents: read
      # Why: docs/ci/cmux-next-workflow-notes.md#note-296
      statuses: write
    # Why: docs/ci/cmux-next-workflow-notes.md#note-72
    timeout-minutes: 60
    # The crash gate step's outcome, for the crash-ends-app job (that job is the red check, so a
    # crash freeze never fails the app-producing job the dogfood and daily publishers read).
    # No perf step runs here (Lawrence 2026-10-23: nothing perf-related blocks or slows a push or a
    # pull request): the launch-time budget and the perf counter gate run in the perf cron,
    # .github/workflows/cmux-next-perf-budgets.yml, on the bench host.
    outputs:
      crash_gate: ${{ steps.crash-gate.outcome }}
    env:
      # Why: docs/ci/cmux-next-workflow-notes.md#note-297
      BASH_ENV: ""
      # Why: docs/ci/cmux-next-workflow-notes.md#note-298
      CMUX_NEXT_RUNNER: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-6vcpu-macos-26' || github.run_attempt == 1 && needs.dev-daily-place.outputs.runner_label != '' && needs.dev-daily-place.outputs.runner_label || github.run_attempt == 1 && contains(needs.macos-placement.outputs.fresh_jobs, ' cmux-scheme-compile ') && needs.macos-placement.outputs.fresh_runner != '' && needs.macos-placement.outputs.fresh_runner || (github.run_attempt == 1 || github.run_attempt == 2 && contains(fromJSON('["github-actions[bot]","cmux-bot[bot]"]'), github.triggering_actor)) && needs.macos-placement.outputs.placed_attempt == format('{0}', github.run_attempt) && contains(needs.macos-placement.outputs.blacksmith_12_jobs, ' cmux-scheme-compile ') && fromJSON(vars.RUNNER_POOLS).macos_26_large || (github.run_attempt == 1 || github.run_attempt == 2 && contains(fromJSON('["github-actions[bot]","cmux-bot[bot]"]'), github.triggering_actor)) && needs.macos-placement.outputs.placed_attempt == format('{0}', github.run_attempt) && contains(needs.macos-placement.outputs.blacksmith_6_jobs, ' cmux-scheme-compile ') && fromJSON(vars.RUNNER_POOLS).macos_26 || (github.run_attempt == 1 || !contains(fromJSON('["github-actions[bot]","cmux-bot[bot]"]'), github.triggering_actor)) && needs.macos-placement.outputs.runner || github.repository_owner != 'manaflow-ai' && 'macos-26' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-6vcpu-macos-26' || vars.CI_PR_POOL_OWNED == '1' && contains(fromJSON('["pull_request","push","workflow_dispatch"]'), github.event_name) && (github.run_attempt == 1 || !contains(fromJSON('["github-actions[bot]","cmux-bot[bot]"]'), github.triggering_actor)) && vars.CI_SIDE_LANE_RUNNER || needs.macos-placement.outputs.placed_attempt == format('{0}', github.run_attempt) && contains(needs.macos-placement.outputs.retry_jobs, ' cmux-scheme-compile ') && needs.macos-placement.outputs.retry_runner || vars.CI_PR_POOL_OWNED == '1' && contains(fromJSON('["pull_request","push","workflow_dispatch"]'), github.event_name) && (github.run_attempt <= 3 || !contains(fromJSON('["github-actions[bot]","cmux-bot[bot]"]'), github.triggering_actor)) && vars.CI_SIDE_LANE_RUNNER || vars.MACOS_RUNNER_26 || fromJSON(vars.RUNNER_POOLS).macos_26) }}
      CMUX_CI_XCODE_APP: ${{ vars.CMUX_CI_XCODE_APP_MACOS_26 }}
      CMUX_CI_REQUIRED_MACOS_SDK_MAJOR: "26"
      # Why: docs/ci/cmux-next-workflow-notes.md#note-299
      CMUX_TUI_TREE_KEY: ${{ inputs.same_tree_sha == '' && (needs.dev-daily-tree-wait.outputs.tree_fetch_key || needs.path_route.outputs.tree_fetch_key) || '' }}
    steps:
      # Why: docs/ci/cmux-next-workflow-notes.md#note-300
      - name: Require the requested DEV daily commit
        if: inputs.dev_daily == true
        env:
          DEV_DAILY_SHA: ${{ inputs.dev_daily_sha }}
          SAME_TREE_SHA: ${{ inputs.same_tree_sha }}
        run: |
          if [[ -n "$SAME_TREE_SHA" ]]; then
            [[ "$DEV_DAILY_SHA" == "$SAME_TREE_SHA" ]] || {
              echo "error: deferred dev_daily asked for $DEV_DAILY_SHA but same-tree mode is $SAME_TREE_SHA" >&2
              exit 1
            }
          else
            [[ "$DEV_DAILY_SHA" == "$GITHUB_SHA" ]] || {
              echo "error: dev_daily asked for $DEV_DAILY_SHA but this run checked out $GITHUB_SHA; the next dispatcher tick takes the new tip" >&2
