            --extra "image=${ImageOS:-}${ImageVersion:+-$ImageVersion}" \
            ${FAST_TIER_SCOPE_KEY:+--extra "scope=$FAST_TIER_SCOPE_KEY"} >> "$GITHUB_OUTPUT"

      - name: Look for a pass on the same inputs
        id: reuse
        if: ${{ format('{0}', vars.CI_REBUILD_MIRROR) == '0' && vars.CI_NEXT_JOB_REUSE == '1' && steps.reuse-key.outputs.key != '' && inputs.no_reuse != true }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          KEY: ${{ steps.reuse-key.outputs.key }}
        run: python3 -I scripts/ci/job_reuse.py lookup --key "$KEY" >> "$GITHUB_OUTPUT"

      - name: Reuse that pass
        if: ${{ steps.reuse.outputs.hit == 'true' }}
        env:
          KEY: ${{ steps.reuse-key.outputs.key }}
          RUN_URL: ${{ steps.reuse.outputs.run_url }}
          SHA: ${{ steps.reuse.outputs.sha }}
        run: |
          echo "::notice title=cmux-next fast tier (cargo) reused::$RUN_URL passed on the same inputs (${SHA:0:12})"
          echo "Reused $RUN_URL: it passed on \`${SHA:0:12}\` with the same inputs (\`$KEY\`)." >> "$GITHUB_STEP_SUMMARY"

      # Why: 2026-11-24-fast-tier-cargo-1.md, note-44
      - name: Verify planner promotion evidence
        id: planner-evidence
        if: ${{ format('{0}', vars.CI_REBUILD_MIRROR) == 'enforce' && steps.reuse.outputs.hit != 'true' && inputs.no_reuse != true }}
        continue-on-error: true
        env:
          CI_REBUILD_MIRROR_EVIDENCE: ${{ vars.CI_REBUILD_MIRROR_EVIDENCE }}
        run: |
          python3 -I scripts/ci/rebuild_mirror.py verify-evidence \
            --root . --rev "$GITHUB_SHA" --job fast-tier-cargo \
            --evidence-json "$CI_REBUILD_MIRROR_EVIDENCE" >> "$GITHUB_OUTPUT"

      # Why: 2026-11-24-fast-tier-cargo-2.md, note-209
      - name: Look for a trusted planner pass
        id: planner-reuse
        if: ${{ format('{0}', vars.CI_REBUILD_MIRROR) == 'enforce' && steps.planner-evidence.outputs.eligible == 'true' && steps.reuse.outputs.hit != 'true' && steps.reuse-key.outputs.candidate_key != '' && inputs.no_reuse != true }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          KEY: ${{ steps.reuse-key.outputs.candidate_key }}
        run: |
          python3 -I scripts/ci/job_reuse.py lookup --key "$KEY" \
            --trusted-branch feat-cmux-next --trusted-event push \
            --trusted-workflow .github/workflows/cmux-next.yml >> "$GITHUB_OUTPUT"

      - name: Reuse the trusted planner pass
        if: ${{ steps.reuse.outputs.hit != 'true' && steps.planner-reuse.outputs.hit == 'true' }}
        env:
          KEY: ${{ steps.reuse-key.outputs.candidate_key }}
          RUN_URL: ${{ steps.planner-reuse.outputs.run_url }}
          SHA: ${{ steps.planner-reuse.outputs.sha }}
        run: |
          echo "::notice title=cmux-next fast tier (cargo) planner reuse::$RUN_URL passed on the trusted feat-cmux-next push (${SHA:0:12})"
          echo "Planner reused $RUN_URL: it passed on \`${SHA:0:12}\` with the measured input closure (\`$KEY\`)." >> "$GITHUB_STEP_SUMMARY"

      # Why: 2026-11-24-fast-tier-cargo-3.md
      - name: Test the warm cargo target
        if: ${{ steps.reuse.outputs.hit != 'true' && steps.planner-reuse.outputs.hit != 'true' }}
        run: bash scripts/ci/tests/pool-warm-target.test.sh

      # Why: 2026-11-24-fast-tier-cargo-4.md
      - name: Mount the warm cargo target (feat-cmux-next push, commits)
        id: warm-next
        if: ${{ steps.reuse.outputs.hit != 'true' && steps.planner-reuse.outputs.hit != 'true' && startsWith(runner.name, 'blacksmith') && github.event_name == 'push' && github.ref == 'refs/heads/feat-cmux-next' }}
        continue-on-error: true
        uses: useblacksmith/stickydisk@3f6be1451e3cad893b778bc93495c80452a5da26 # v1.7.2
        with:
          key: cmux-next-fast-tier-cargo-warm-v1
          path: /home/runner/cmux-next-fast-tier-cargo-warm
          commit: on-change

      - name: Mount the warm cargo target (other runs, read-only)
        id: warm-read
        if: ${{ steps.reuse.outputs.hit != 'true' && steps.planner-reuse.outputs.hit != 'true' && startsWith(runner.name, 'blacksmith') && !(github.event_name == 'push' && github.ref == 'refs/heads/feat-cmux-next') }}
        continue-on-error: true
        uses: useblacksmith/stickydisk@3f6be1451e3cad893b778bc93495c80452a5da26 # v1.7.2
        with:
          key: cmux-next-fast-tier-cargo-warm-v1
          path: /home/runner/cmux-next-fast-tier-cargo-warm
          commit: "false"

      # Why: 2026-11-24-fast-tier-cargo-5.md
      - name: Link this runner's warm cargo target
        id: warm
        if: ${{ steps.reuse.outputs.hit != 'true' && steps.planner-reuse.outputs.hit != 'true' }}
        continue-on-error: true
        env:
          DISK_MOUNTED: ${{ steps.warm-next.outcome == 'success' || steps.warm-read.outcome == 'success' }}
          WARM_WRITES: ${{ steps.warm-next.outcome == 'success' }}
        run: |
          set -euo pipefail
          disk=()
          if [[ "$DISK_MOUNTED" == true ]]; then
            d=/home/runner/cmux-next-fast-tier-cargo-warm
            if [[ "$WARM_WRITES" == true ]] || compgen -G "$d/fast-tier-cargo/*/rust-*/.cmux-testbox-source-mtimes.tsv" > /dev/null; then
              disk=("$d")
            else
              echo "pool warm target: miss (no feat-cmux-next tree on the sticky disk yet); rust-cache restore instead"
            fi
          fi
          bash scripts/ci/pool-warm-target.sh restore fast-tier-cargo "${disk[@]}"

      # Why: 2026-11-24-fast-tier-cargo-6.md, note-210
      - name: Cache cargo build
        if: ${{ steps.reuse.outputs.hit != 'true' && steps.planner-reuse.outputs.hit != 'true' && steps.warm.outputs.linked != 'true' }}
        id: cargo-cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          workspaces: cmux-tui -> target
          shared-key: cmux-next-fast-tier-cargo-${{ hashFiles('cmux-tui/rust-toolchain.toml', 'cmux-tui/Cargo.lock', '.cargo/config.toml') }}
          # Why: note-210 (one key across pool hosts and Blacksmith)
          add-rust-environment-hash-key: false
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/feat-cmux-next' }}

      # Why: 2026-11-24-fast-tier-cargo-7.md
      - name: Key the cargo build in R2
        id: r2-cargo-key
        if: ${{ github.repository == 'manaflow-ai/cmux' && !startsWith(runner.name, 'blacksmith-') && steps.reuse.outputs.hit != 'true' && steps.planner-reuse.outputs.hit != 'true' && steps.warm.outputs.linked != 'true' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          inputs="$( { git ls-files -z -- 'cmux-tui/Cargo.lock' 'cmux-tui/**/Cargo.lock' 'cmux-tui/rust-toolchain.toml' \
            | xargs -0 sha256sum; rustc -Vv; cargo -V; } | sha256sum | cut -c1-16)"
          workspace="$(printf '%s' "$GITHUB_WORKSPACE" | sha256sum | cut -c1-8)"
          prefix="cmux-next-fast-tier-cargo-v1-$workspace-"
          {
            echo "target-prefix=$prefix"
            echo "target-key=$prefix$inputs"
            echo "registry-prefix=cmux-next-fast-tier-cargo-registry-v1-"
            echo "registry-key=cmux-next-fast-tier-cargo-registry-v1-$inputs"
            echo "registry=${CARGO_HOME:-$HOME/.cargo}/registry"
          } >> "$GITHUB_OUTPUT"

      - name: Restore the cargo build from R2
        id: r2-cargo-target
        if: ${{ steps.r2-cargo-key.outputs.target-key != '' }}
        timeout-minutes: 4
        continue-on-error: true
        uses: ./.github/actions/cache-restore
        env:
          CI_CACHE_R2_PUBLIC_URL: https://ci-cache-next.cmux.com
        with:
          backend: r2
          path: cmux-tui/target
          key: ${{ steps.r2-cargo-key.outputs.target-key }}
          restore-keys: ${{ steps.r2-cargo-key.outputs.target-prefix }}

      - name: Restore the cargo registry from R2
        id: r2-cargo-registry
        if: ${{ steps.r2-cargo-key.outputs.registry-key != '' }}
        timeout-minutes: 4
        continue-on-error: true
        uses: ./.github/actions/cache-restore
        env:
          CI_CACHE_R2_PUBLIC_URL: https://ci-cache-next.cmux.com
        with:
          backend: r2
          path: ${{ steps.r2-cargo-key.outputs.registry }}
          key: ${{ steps.r2-cargo-key.outputs.registry-key }}
          restore-keys: ${{ steps.r2-cargo-key.outputs.registry-prefix }}

      - name: Run the fast tier (cargo and script entries)
        if: ${{ steps.reuse.outputs.hit != 'true' && steps.planner-reuse.outputs.hit != 'true' }}
        env:
          CMUX_FAST_CARGO_CACHE_HIT: ${{ steps.cargo-cache.outputs.cache-hit }}
          # Why: note-513
          FIXIT_COMPILE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        # Why: note-559
        run: |
          python3 -I scripts/cmux-next/fast-tier.py --kind cargo --kind script \
            ${PATHS_FILE:+--changed-files "$PATHS_FILE"} --receipt "$RUNNER_TEMP/cmux-next-fast-tier-cargo.json"

      # Why: 2026-11-24-fast-tier-cargo-8.md
      - name: Record this runner's warm cargo target
        if: ${{ !cancelled() && steps.reuse.outputs.hit != 'true' && steps.planner-reuse.outputs.hit != 'true' && steps.warm.outputs.linked == 'true' }}
        continue-on-error: true
        run: bash scripts/ci/pool-warm-target.sh record fast-tier-cargo /home/runner/cmux-next-fast-tier-cargo-warm

      # Why: 2026-11-24-fast-tier-cargo-9.md
      - name: Strip the workspace's own output before the R2 save
        id: r2-cargo-strip
        if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/feat-cmux-next' && steps.r2-cargo-key.outputs.target-key != '' && steps.r2-cargo-target.outputs.cache-hit != 'true' }}
        continue-on-error: true
        env:
          REGISTRY: ${{ steps.r2-cargo-key.outputs.registry }}
        run: |
          set -euo pipefail
          mapfile -t crates < <(cargo metadata --no-deps --format-version 1 --manifest-path cmux-tui/Cargo.toml \
            | python3 -I -c 'import json,sys; m=json.load(sys.stdin); print("\n".join(sorted({p["name"] for p in m["packages"]} | {t["name"] for p in m["packages"] for t in p["targets"]})))')
          python3 -I scripts/ci/cargo_target_strip.py cmux-tui/target --workspace-crates "${crates[@]}"
          # Why: 2026-11-24-fast-tier-cargo-10.md
          rm -rf "$REGISTRY/src"
          du -sh cmux-tui/target "$REGISTRY" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Save the cargo build to R2
        if: ${{ success() && steps.r2-cargo-strip.outcome == 'success' }}
        timeout-minutes: 6
        continue-on-error: true
        uses: ./.github/actions/cache-save
        env:
          CI_CACHE_R2_PUBLIC_URL: https://ci-cache-next.cmux.com
          AWS_ACCESS_KEY_ID: ${{ secrets.CI_CACHE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CI_CACHE_R2_SECRET_ACCESS_KEY }}
          CI_CACHE_R2_ENDPOINT: ${{ format('https://{0}.r2.cloudflarestorage.com', secrets.CI_CACHE_R2_ACCOUNT_ID) }}
        with:
          backend: r2
          path: cmux-tui/target
          key: ${{ steps.r2-cargo-key.outputs.target-key }}

      - name: Save the cargo registry to R2
        if: ${{ success() && steps.r2-cargo-strip.outcome == 'success' && steps.r2-cargo-registry.outputs.cache-hit != 'true' }}
        timeout-minutes: 6
        continue-on-error: true
        uses: ./.github/actions/cache-save
        env:
          CI_CACHE_R2_PUBLIC_URL: https://ci-cache-next.cmux.com
          AWS_ACCESS_KEY_ID: ${{ secrets.CI_CACHE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CI_CACHE_R2_SECRET_ACCESS_KEY }}
          CI_CACHE_R2_ENDPOINT: ${{ format('https://{0}.r2.cloudflarestorage.com', secrets.CI_CACHE_R2_ACCOUNT_ID) }}
        with:
          backend: r2
          path: ${{ steps.r2-cargo-key.outputs.registry }}
          key: ${{ steps.r2-cargo-key.outputs.registry-key }}

      - name: Upload fast-tier timing receipt
        if: ${{ (always()) && steps.reuse.outputs.hit != 'true' && steps.planner-reuse.outputs.hit != 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-next-fast-tier-cargo-receipt-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cmux-next-fast-tier-cargo.json
          if-no-files-found: warn
          retention-days: 3

      # Why: note-442
      - name: Upload the fixit-compile patch
        if: ${{ failure() && steps.reuse.outputs.hit != 'true' && steps.planner-reuse.outputs.hit != 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fixit-compile-${{ github.job }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fixit-compile
          if-no-files-found: ignore
          retention-days: 3

      # Why: note-212
      - name: Record rebuild mirror outcome
        id: rebuild-mirror
        if: ${{ always() && steps.reuse.outputs.hit != 'true' && steps.planner-reuse.outputs.hit != 'true' && steps.reuse-key.outputs.mirror == 'true' }}
        continue-on-error: true
        env:
          JOB_OUTCOME: ${{ job.status }}
        run: |
          python3 -I scripts/ci/rebuild_mirror.py finish \
            --plan "$RUNNER_TEMP/ci-rebuild-plan.json" --outcome "$JOB_OUTCOME" \
            --execution-receipt "$RUNNER_TEMP/cmux-next-fast-tier-cargo.json" \
            --output "$RUNNER_TEMP/ci-rebuild-result.json" >> "$GITHUB_OUTPUT"

      - name: Upload rebuild mirror observation
        if: ${{ always() && steps.reuse.outputs.hit != 'true' && steps.planner-reuse.outputs.hit != 'true' && steps.reuse-key.outputs.mirror == 'true' }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-rebuild-mirror-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-rebuild-result.json
          if-no-files-found: warn
          retention-days: 3

      - name: Save observed candidate pass
        if: ${{ success() && steps.reuse.outputs.hit != 'true' && steps.planner-reuse.outputs.hit != 'true' && steps.rebuild-mirror.outputs.key != '' }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.rebuild-mirror.outputs.key }}
          path: ${{ runner.temp }}/ci-rebuild-result.json
          if-no-files-found: error
          retention-days: 3
          overwrite: true

      # Why: note-45
      - name: Record this pass for the same inputs
        if: ${{ success() && steps.reuse-key.outputs.key != '' && steps.reuse.outputs.hit != 'true' && steps.planner-reuse.outputs.hit != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        run: |
          mkdir -p "$RUNNER_TEMP/ci-job-pass"
          printf '%s\n' "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA" > "$RUNNER_TEMP/ci-job-pass/pass.txt"

      - name: Save the pass
        if: ${{ success() && steps.reuse-key.outputs.key != '' && steps.reuse.outputs.hit != 'true' && steps.planner-reuse.outputs.hit != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.reuse-key.outputs.key }}
          path: ${{ runner.temp }}/ci-job-pass
          if-no-files-found: error
          retention-days: 7
          overwrite: true

