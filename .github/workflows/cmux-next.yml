          # A dispatch packs only as the base tier run (its base_tier input, read from the event so this
          # step needs no input the workflow may not declare).
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]] && [[ "$(python3 -I -c 'import json, os; print(str((json.load(open(os.environ["GITHUB_EVENT_PATH"])).get("inputs") or {}).get("base_tier", "")).lower())')" != true ]]; then
            echo "not a base tier dispatch: no pack"
            exit 0
          fi
          scripts/cmux-next/base-autofix-exports-pack.sh "$RUNNER_TEMP/base-exports" | tee -a "$GITHUB_OUTPUT"

      - name: Upload the exports for the base autofix
        if: ${{ steps.reuse.outputs.hit != 'true' && steps.base-exports.outcome == 'success' && steps.base-exports.outputs.name != '' }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.base-exports.outputs.name }}
          path: ${{ runner.temp }}/base-exports
          if-no-files-found: error
          retention-days: 1

      # Why: docs/ci/cmux-next-workflow-notes.md#note-277
      - name: Regenerate stale files
        id: regenerate
        if: ${{ (steps.actions.outcome == 'failure' || steps.settings.outcome == 'failure') && steps.reuse.outputs.hit != 'true' }}
        run: |
          set -euo pipefail
          if [[ "${{ steps.actions.outcome }}" == failure ]]; then
            scripts/cmux-next/regenerate-action-contracts.sh
          fi
          # A stale settings export was already written into the checkout by the
          # check above.
          # The defaults snapshot reads the action and settings exports, so it
          # follows whichever of them was regenerated.
          python3 scripts/ci/defaults_guard.py snapshot
          # The regenerated files themselves, at their repository paths, so
          # they copy onto the PR head. A diff would be against the merge
          # commit, whose context the head may not have.
          out="$RUNNER_TEMP/generated/files"
          mkdir -p "$out"
          generated=('plans/cmux-next/*.json' 'plans/cmux-next/*.md'
            schemas/settings/settings-schema.json 'docs/mdm/*' schemas/defaults/cmux-next.json)
          git add -N -- "${generated[@]}"
          git diff --name-only -- "${generated[@]}" > "$RUNNER_TEMP/generated/paths.txt"
          git diff --stat
          while IFS= read -r path; do
            mkdir -p "$out/$(dirname "$path")"
            cp "$path" "$out/$path"
          done < "$RUNNER_TEMP/generated/paths.txt"
          cp "$RUNNER_TEMP/generated/paths.txt" "$out/.paths"
          if [[ -s "$RUNNER_TEMP/generated/paths.txt" ]]; then
            echo "patch=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload the regenerated files
        if: ${{ (steps.regenerate.outputs.patch == 'true') && steps.reuse.outputs.hit != 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-next-generated-patch
          path: ${{ runner.temp }}/generated/files
          include-hidden-files: true
          retention-days: 3

      - name: Fail on stale generated files
        if: ${{ (steps.actions.outcome == 'failure' || steps.settings.outcome == 'failure') && steps.reuse.outputs.hit != 'true' }}
        env:
          ACTIONS: ${{ steps.actions.outcome }}
          CATALOG: ${{ steps.actions.outputs.catalog }}
          SETTINGS: ${{ steps.settings.outcome }}
        run: |
          if [[ "$ACTIONS" == failure && "$CATALOG" == failure ]]; then
            {
              echo "### The action catalog checks fail: a catalog failure, not stale files"
              echo
              echo "Fresh exports fail the same checks, so regenerating changes nothing. The step \"Check generated action catalog, surfaces and inventory\" names the failing test."
              [[ "$SETTINGS" != failure ]] || echo "- settings exports are also stale: scripts/cmux-next/regenerate-settings-exports.sh"
            } | tee -a "$GITHUB_STEP_SUMMARY"
            echo "::error::The action catalog checks fail with fresh exports too: a catalog failure, not stale files."
            exit 1
          fi
          {
            echo "### Generated cmux-next files are stale"
            echo
            [[ "$ACTIONS" != failure ]] || echo "- action catalog, surfaces or inventory: scripts/cmux-next/regenerate-action-contracts.sh"
            [[ "$SETTINGS" != failure ]] || echo "- settings exports: scripts/cmux-next/regenerate-settings-exports.sh"
            echo
            echo "The cmux-next-generated-patch artifact holds the regenerated files at their repository paths."
          } | tee -a "$GITHUB_STEP_SUMMARY"
          echo "::error::Generated cmux-next files are stale. Regenerate them as the step summary says."
          exit 1

      # Also after a failure or a cancel: end the daemon of this job's home and
      # Why: docs/ci/cmux-next-workflow-notes.md#note-278
      - name: Stop this job's acpmux daemons and remove its home
        if: ${{ always() && steps.reuse.outputs.hit != 'true' }}
        continue-on-error: true
        timeout-minutes: 3
        run: |
          home="$RUNNER_TEMP/acpmux-home"
          [[ -d "$home" ]] || exit 0
          acpmux="$(PATH="$PATH:$HOME/.local/bin:$HOME/.cargo/bin:/opt/homebrew/bin:/usr/local/bin" command -v acpmux || true)"
          [[ -z "$acpmux" ]] || env -u ACPMUX_SOCKET ACPMUX_HOME="$home" "$acpmux" daemon shutdown --end-agents || true
          rm -rf "$home"

      # A pass records itself for the next run on the same inputs: an artifact named after
      # Why: docs/ci/cmux-next-workflow-notes.md#note-279
      - name: Record this pass for the same inputs
        if: ${{ success() && steps.reuse-key.outputs.key != '' && steps.reuse.outputs.hit != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        run: |
          mkdir -p "$RUNNER_TEMP/ci-job-pass"
          printf '%s\n' "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA" > "$RUNNER_TEMP/ci-job-pass/pass.txt"

      - name: Save the pass
        if: ${{ success() && steps.reuse-key.outputs.key != '' && steps.reuse.outputs.hit != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.reuse-key.outputs.key }}
          path: ${{ runner.temp }}/ci-job-pass
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  # Why: docs/ci/cmux-next-workflow-notes.md#note-63
  generated-verdict:
    needs: [path_route, swift-test, daemon-test]
    if: ${{ !cancelled() && (needs.path_route.outputs.generated_host == 'swift-test' && needs.swift-test.result != 'skipped' || needs.path_route.outputs.generated_host == 'daemon-test' && needs.daemon-test.result != 'skipped') }}
    name: cmux-next generated files (shared build)
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.CI_CLOUD_OVERFLOW_SAVED && (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-8vcpu-ubuntu-2404' || fromJSON(vars.RUNNER_POOLS).linux_8) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-2vcpu-ubuntu-2404' || fromJSON(vars.RUNNER_POOLS).linux_2) }}
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Read the generated files verdict of the shared build
        env:
          HOST: ${{ needs.path_route.outputs.generated_host }}
          HOST_RESULT: ${{ needs.path_route.outputs.generated_host == 'swift-test' && needs.swift-test.result || needs.daemon-test.result }}
          VERDICT: ${{ needs.path_route.outputs.generated_host == 'swift-test' && needs.swift-test.outputs.generated_files || needs.daemon-test.outputs.generated_files }}
        run: |
          superseded_push() {  # scripts/ci/needs_verdict.py SUPERSEDED_RULE, copied verbatim (tests/test_needs_verdict.py)
            local what=$1 head
            [[ "${GITHUB_EVENT_NAME:-}" == push && -n "${GITHUB_SHA:-}" && -n "${GITHUB_REF:-}" ]] || return 1
            head="$(git -c http.lowSpeedLimit=1 -c http.lowSpeedTime=15 ls-remote \
              "${GITHUB_SERVER_URL:-https://github.com}/${GITHUB_REPOSITORY:-}.git" "$GITHUB_REF" 2>/dev/null \
              | awk 'NR==1{print $1}')" || head=""
            [[ -n "$head" && "$head" != "$GITHUB_SHA" ]] || return 1
            echo "::notice title=$what: superseded::not judged at $GITHUB_SHA: a newer push ($head) replaced its waiting job, and that push's run carries the verdict"
          }
          case "$VERDICT" in
            fresh)
              echo "Generated cmux-next files are fresh ($HOST checked them on its package build)." | tee -a "$GITHUB_STEP_SUMMARY" ;;
            stale)
              echo "::error::Generated cmux-next files are stale. $HOST's step summary says how to regenerate them; its cmux-next-generated-patch artifact holds the regenerated files."
              exit 1 ;;
            catalog)
              echo "::error::The action catalog checks fail on $HOST with fresh exports too: a catalog failure, not stale files. Regenerating changes nothing; $HOST's step \"Check generated action catalog, surfaces and inventory\" names the failing test."
              exit 1 ;;
            *)
              if [[ $HOST_RESULT == cancelled ]] && superseded_push "generated files"; then exit 0; fi
              echo "::error::$HOST ($HOST_RESULT) gave no generated files verdict: its package build failed or it stopped before the checks. Fix or re-run $HOST."
              exit 1 ;;
          esac

  # The fleet compile check is the first Release gate. It checks the exact
  # Why: docs/ci/cmux-next-workflow-notes.md#note-280
  release-compile-fast:
    needs: [path_route, push-head-preflight, macos-placement]
    # Why: docs/ci/cmux-next-workflow-notes.md#note-64
    if: ${{ !cancelled() && needs.path_route.outputs.native == 'true' && needs.push-head-preflight.outputs.current == 'true' && github.repository_owner == 'manaflow-ai' && github.event_name == 'push' && github.ref == 'refs/heads/feat-cmux-next' }}
    name: cmux-next Release compile (fleet fast check)
    concurrency:
      group: ${{ format('cmux-next-release-compile-fast-{0}', github.run_id) }}
      cancel-in-progress: false
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || needs.macos-placement.outputs.gateway_attempt == format('{0}', github.run_attempt) && needs.macos-placement.outputs.gateway_runner != '' && needs.macos-placement.outputs.gateway_runner || vars.CI_CLOUD_OVERFLOW_SAVED && (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-8vcpu-ubuntu-2404' || fromJSON(vars.RUNNER_POOLS).linux_8) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-2vcpu-ubuntu-2404' || fromJSON(vars.RUNNER_POOLS).linux_2) }}
    permissions:
      contents: read
    timeout-minutes: 30
    outputs:
      verdict: ${{ steps.compile.outputs.verdict }}
    steps:
      # Why: docs/ci/cmux-next-workflow-notes.md#note-281
      - name: Run the fast fleet compile check
        id: compile
        continue-on-error: true
        env:
          REF: ${{ github.sha }}
          REPO: ${{ github.repository }}
          # Why: docs/ci/cmux-next-workflow-notes.md#note-282
          GATEWAY: ${{ needs.macos-placement.outputs.gateway_attempt == format('{0}', github.run_attempt) && needs.macos-placement.outputs.gateway_runner || '' }}
          # Why: docs/ci/cmux-next-workflow-notes.md#note-283
          RESULTS: https://gh-events.cmux.com/compile-checks/v1
        run: |
          set -uo pipefail
          # No idle gateway: read the fleet's compile of this push, fail closed (only this sha, repo,
          # recipe 2, release-onone). Pass and fail are verdicts; else the Mac fallback runs.
          if [[ -z "$GATEWAY" ]]; then
            [[ "$REF" =~ ^[0-9a-f]{40}$ ]] || { echo "verdict=unavailable" >> "$GITHUB_OUTPUT"; exit 0; }
            reply="$RUNNER_TEMP/compile-check.json"
            deadline=$((SECONDS + ${WAIT_SECONDS:-1200}))
            state="" reads=0 last="" ok_at=$SECONDS  # ok_at: the last usable answer (200 or 404), from before the first read
            # The results service is a cache, not a dependency: an origin down on two reads 30 s apart
            # (no connection, or the edge's 52x/530) hands the gate to the Mac fallback now, not after
            # retrying the 530 for the whole deadline (20 min with the controller down, 2026-11-10).
            for probe in 1 2; do
              code="$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 10 --max-time 20 \
                "$RESULTS/$REF?repo=${REPO/\//%2F}&wait=1" 2>/dev/null)" || true
              [[ "${code:=000}" =~ ^(000|52[0-9]|530)$ ]] || { [[ "$code" =~ ^(200|404)$ ]] && ok_at=$SECONDS; break; }
              (( probe == 2 )) && { state="results service down (HTTP $code)"; deadline=$SECONDS; } || sleep "${PROBE_GAP:-30}"
            done
            # Why: docs/ci/cmux-next-workflow-notes.md#note-82 (compile-status: the results service down)
            while [[ "$state" != "results service down"* ]]; do
              # The shared deadline: each read gets only what is left of the wait and of the bound for a usable answer.
              end=$(( deadline < ok_at + ${BAD_BOUND:-300} ? deadline : ok_at + ${BAD_BOUND:-300} ))
              left=$((end - SECONDS))
              (( left > 1 )) || break
              wait=$(( left > 60 ? left - 30 : left / 2 )); wait=$(( wait < 1800 ? wait : 1800 ))
              code="$(timeout "$left" curl -sS -o "$reply" -w '%{http_code}' --connect-timeout 10 \
                --max-time "$left" "$RESULTS/$REF?repo=${REPO/\//%2F}&wait=$wait")" || true
              case "${code:=000}" in
                200) reads=$((reads + 1)) ok_at=$SECONDS last=""
                  state="$(jq -r --arg sha "$REF" --arg repo "$REPO" '
                    if .sha != $sha or .repo != $repo or .recipe_version != 2 or .configuration != "release-onone"
                    then "mismatch" else (.state // "") end' "$reply" 2>/dev/null || echo unreadable)"
                  echo "read $reads: $state"
                  case "$state" in pass|fail|unavailable|mismatch|unreadable) break ;; esac ;;
                404) ok_at=$SECONDS last=""; echo "no fleet result for $REF yet" ;;
                *) last="HTTP $code" ;;
              esac
              gap=$(( end - SECONDS < ${READ_GAP:-30} ? end - SECONDS : ${READ_GAP:-30} ))
              (( gap <= 0 )) || sleep "$gap"
            done
            [[ "$state" == "results service down"* || -z "$last" ]] || state="results service down ($last for $((SECONDS - ok_at)) s)"
            case "$state" in
              pass) verdict=pass; echo "The build fleet compiled and linked the app at $REF in Release (-Onone) on Linux." ;;
              fail) verdict=fail; echo "::error title=Fast fleet compile check::the build fleet's Release compile failed at $REF; see cmux-next/compile's log: $(jq -r '.log_url // empty' "$reply" 2>/dev/null)" ;;
              *) verdict=unavailable; echo "::warning title=Fast fleet compile check::no fleet verdict for $REF (${state:-no result}); the Mac fallback will run." ;;
            esac
            echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
            [[ "$verdict" != fail ]]
            exit
          fi
          client="${CMUX_CI_CLIENT:-$HOME/.local/bin/cmux-ci}"
          if ! [[ -x "$client" ]]; then
            echo "::warning title=Fast fleet compile check::cmux-ci is not installed on $RUNNER_NAME; the Mac fallback will run."
            echo "verdict=unavailable" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Release admission must type-check Release-only conditionals. The
          # private fleet client rolls this profile out independently; until a
          # runner has it, use the Mac Release fallback instead of silently
          # admitting on a Debug compile under the Release gate name.
          if ! "$client" compile-check --help 2>/dev/null | grep -q -- '--release'; then
            echo "::warning title=Fast fleet compile check::the fleet client has no Release profile; the Mac fallback will run."
            echo "verdict=unavailable" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          status=0
          "$client" compile-check --ref "$REF" --app --release \
            --timeout 1200 --queue-timeout 300 || status=$?
          case "$status" in
            0) verdict=pass ;;
            69|75|124) verdict=unavailable; echo "::warning title=Fast fleet compile check::the fleet gave no verdict (exit $status); the Mac fallback will run." ;;
            *) verdict=fail; echo "::error title=Fast fleet compile check::the fleet compile check failed at $REF (exit $status)." ;;
          esac
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
          [[ "$verdict" != fail ]]

  # Promotion admission keys off this exact job name. Keep it separate from
  # Why: docs/ci/cmux-next-workflow-notes.md#note-65
  release-compile-fast-admission:
    needs: release-compile-fast
    if: ${{ always() && !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/feat-cmux-next' && needs.release-compile-fast.result != 'skipped' && needs.release-compile-fast.result != 'cancelled' && needs.release-compile-fast.outputs.verdict != 'unavailable' && needs.release-compile-fast.outputs.verdict != '' }}
    name: cmux-next Release compile (Xcode 26)
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.CI_CLOUD_OVERFLOW_SAVED && (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-8vcpu-ubuntu-2404' || fromJSON(vars.RUNNER_POOLS).linux_8) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-2vcpu-ubuntu-2404' || fromJSON(vars.RUNNER_POOLS).linux_2) }}
    permissions:
      actions: write
      contents: read
    # Why: docs/ci/cmux-next-workflow-notes.md#note-284
    timeout-minutes: 10
    steps:
      - name: Record the Release compile admission
        env:
          REF: ${{ github.sha }}
          VERDICT: ${{ needs.release-compile-fast.outputs.verdict }}
          RESULT: ${{ needs.release-compile-fast.result }}
        run: |
          if [[ "$VERDICT" == pass && "$RESULT" == success ]]; then
            echo "The fleet fast check compiled this commit in Release mode."
            exit 0
          fi
          echo "::error title=Release compile::the fleet fast check did not compile $REF (verdict ${VERDICT:-none}, job $RESULT); see its log."
          exit 1
      - name: Checkout the pushed commit for the promotion request
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Request nightly-next promotion after this gate
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: scripts/cmux-next/request-nightly-next.sh --sha "$SHA" --repo "$GITHUB_REPOSITORY" --release-compile-green

  release-compile:
    environment: ${{ github.event_name != 'pull_request' && 'ci-build-cache-reader' || '' }}
    needs: [path_route, macos-placement, push-head-preflight, app-compile-fleet, release-compile-fast]
    if: ${{ always() && !cancelled() && needs.path_route.outputs.native == 'true' && needs.push-head-preflight.outputs.current == 'true' && (needs.release-compile-fast.result == 'skipped' || needs.release-compile-fast.outputs.verdict == 'unavailable' || (needs.release-compile-fast.result == 'failure' || needs.release-compile-fast.result == 'success') && needs.release-compile-fast.outputs.verdict == '') && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci') || github.event.pull_request.head.repo.full_name != github.repository && needs.path_route.outputs.cmuxnext_swift == 'true' || github.event.pull_request.head.repo.full_name == github.repository && needs.path_route.outputs.mac_release == 'true' && needs.app-compile-fleet.outputs.verdict != 'pass' && needs.app-compile-fleet.outputs.verdict != 'fail') }}
    name: cmux-next Release compile (Xcode 26)
    # Why: docs/ci/cmux-next-workflow-notes.md#note-6
    continue-on-error: false
    # A started push compile has a per-run group and is never cancelled by a
    # newer push. Superseded pushes are skipped by the job condition above.
    concurrency:
      group: ${{ format('cmux-next-release-compile-{0}', github.run_id) }}
      cancel-in-progress: false
    # The fleet compile check is the primary gate. This Mac job is only the
    # compatible fallback when it has no verdict; on a push (attempt 1) it
    # takes an idle freshness slot first (macos-placement's fresh_runner, the
    # glaeda-dev-* label PR jobs never target), then a free fleet Mac, then
    # Blacksmith macOS. A busy or offline slot is skipped at placement, so it
    # never queues on the slot.
    # A same-repository PR takes the Blacksmith label macos-placement gave it
    # only when no idle mini took it (the cascade counts the idle minis first),
    # else the owned side label. Its runner output is the side label whether or
    # not a mini is free, so reading it first left a PR's compile queued on a
    # saturated side label with no path off it (cmux#26723, 2026-10-29).
