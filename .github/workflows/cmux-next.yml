  # Dispatch runs every tier on any ref of this repository
  # (gh workflow run cmux-next.yml --ref <branch>): feat-cmux-next, the
  # next-batch/* integration branches that scripts/ci/next_batch.py validates,
  # or a pull request's own branch. Only someone with write access can
  # dispatch, so it is as trusted as a push.
  #
  # Same-tree mode (same_tree_sha set): scripts/ci/cmux_next_tree_notify.py
  # dispatches it from the cmux-tui artifacts workflow once a tree that a run
  # probed as unpublished is published (or failed). It runs only the tree jobs
  # (daemon tests, scheme compile) on same_tree_sha, or only reports the
  # failure, and posts their results as commit statuses on
  # same_tree_status_sha (the push, or the pull request head).
  workflow_dispatch:
    inputs:
      same_tree_sha:
        description: "Same-tree mode: the commit to test (a push, or a pull request's merge commit)"
        required: false
        default: ""
      same_tree_status_sha:
        description: "Same-tree mode: the commit that gets the result statuses"
        required: false
        default: ""
      same_tree_tiers:
        description: "Same-tree mode: daemon, scheme or daemon,scheme"
        required: false
        default: ""
      same_tree_state:
        description: "Same-tree mode: ready (run the jobs) or failed (report why)"
        required: false
        default: ""
      same_tree_reason:
        description: "Same-tree mode: why the tree is unavailable (failed)"
        required: false
        default: ""
      same_tree_origin:
        description: "Same-tree mode: push or pull_request"
        required: false
        default: ""
      same_tree_origin_run:
        description: "Same-tree mode: the cmux-next run that probed the tree"
        required: false
        default: ""
      dev_daily:
        description: "Build the Release cmux NEXT DEV artifact for the scheduled dev channel"
        required: false
        default: false
        type: boolean
      dev_daily_sha:
        description: "Expected feat-cmux-next SHA for the scheduled dev channel"
        required: false
        default: ""
      tip_swift_suite:
        description: "Run only the CmuxNext Swift suite (every target) on the feat-cmux-next tip"
        required: false
        default: false
        type: boolean
      # main's cmux-next-tip-swift-suite-dispatch.yml (its daemon suite): a feat-cmux-next push never
      # gets daemon-test, so this run is the base verdict scripts/ci/base_red_excuse.py compares a pull
      # request's daemon-test red with. A same-tree run it waits on carries it too (its run name).
      tip_daemon_suite:
        description: "Run only the live-daemon suites (daemon-test) on the feat-cmux-next tip"
        required: false
        default: false
        type: boolean
      # cmux-next-base-tier-kick.yml (scripts/ci/cmux_next_base_tier.py): a feat-cmux-next push leaves
      # its base Mac tier (daemon tests, generated files, the Debug app scheme compile) to this run,
      # started at most once every 15 minutes on the tip (cmuxterm-hq#5424). Named
      # `cmux-next base tier · <sha>`, which the kick, push attribution and base_red_excuse.py read.
      base_tier:
        description: "Run only the base Mac tier (daemon tests, generated files, scheme compile) on the feat-cmux-next tip"
        required: false
        default: false
        type: boolean
      # The safety net under CI_NEXT_JOB_REUSE: a dispatch with no_reuse runs every job
      # in full, reusing no recorded pass (it still records its own). A nightly one on
      # feat-cmux-next re-checks what the day's reused results stood on.
      no_reuse:
        description: "Run every job in full: reuse no pass recorded on the same inputs (CI_NEXT_JOB_REUSE)"
        required: false
        default: false
        type: boolean

run-name: >-
  ${{ inputs.dev_daily == true && format('cmux NEXT DEV daily · {0}', inputs.dev_daily_sha || github.sha) || inputs.tip_swift_suite == true && format('cmux-next tip Swift suite · {0}', github.sha) || inputs.tip_daemon_suite == true && format('cmux-next tip daemon suite · {0}', inputs.same_tree_sha || github.sha) || inputs.base_tier == true && format('cmux-next base tier · {0}', inputs.same_tree_sha || github.sha) || inputs.no_reuse == true && format('cmux-next uncached · {0}', github.sha) || format('cmux-next · {0}', github.sha) }}

permissions:
  contents: read

env:
  # HQ's public cache edge serves read-only restores from every runner; writes
  # use the controller-owned R2 credentials in the seed steps below.
  CI_CACHE_R2_PUBLIC_URL: ${{ vars.CI_CACHE_R2_PUBLIC_URL || 'https://ci-cache.cmux.com' }}
  # Structural, style, size and drift guards (god files, size caps, package
  # conventions, motion tokens, type scale, scrollbars, icons, copy lints,
  # generated-doc drift) still run and print their findings, but only warn
  # (Leo, 2026-10-19: they failed pull requests for reasons unrelated to the
  # change). Correctness and safety checks still fail. Set to `fail` to make
  # the style guards block again.
  CMUX_NEXT_STYLE_GUARDS: warn
  # The label attempt 1's macOS jobs take when macos-placement finds an idle
  # owned runner for them: a glaeda-* label means a mini. Each macOS job's
  # runs-on, and its own CMUX_NEXT_RUNNER, restate it with the placement.
  CMUX_NEXT_SIDE_ROUTE: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-6vcpu-macos-26' || vars.CI_PR_POOL_OWNED == '1' && contains(fromJSON('["pull_request","push","workflow_dispatch"]'), github.event_name) && github.run_attempt == 1 && vars.CI_SIDE_LANE_RUNNER || vars.MACOS_RUNNER_26 || 'blacksmith-6vcpu-macos-26') }}
  # Temporary REST budget attribution: one gh-call line per GitHub API call (scripts/ci/api_call_log/env.sh).
  BASH_ENV: ${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh

concurrency:
  # Pushes and dispatches get a group of their own, as in the other side
  # lanes: when the owned-pool rescue re-runs an older push run, it must not
  # join a group where it would replace (cancel) the newest pending run.
  # The Mac jobs of a push (swift test, Release compile, generated files,
  # daemon tests, scheme compile) keep independent job groups: a started job
  # runs to the end and stale work is filtered before it takes a runner. Fast
  # checks still run on every push. Push runs upload no
  # owned-pool-watch marker, because the rescue cancels a push run with a newer
  # push run behind it, running jobs included; at 1 push a minute no tip
  # swift test completed (2026-10-07 00:20Z to 01:05Z).
  # A plain dispatch on a working branch (not feat-cmux-next, not next-batch/*,
  # not same-tree mode or the DEV daily) is grouped by its ref and a newer one
  # cancels it, like a pull request's push: a superseded dispatch does not hold
  # a mini in the queue.
  group: ${{ github.event_name == 'workflow_dispatch' && inputs.same_tree_sha == '' && inputs.dev_daily != true && github.ref != 'refs/heads/feat-cmux-next' && !startsWith(github.ref, 'refs/heads/next-batch/') && format('cmux-next-dispatch-{0}', github.ref) || format('cmux-next-{0}', github.event.pull_request.number || github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' && inputs.same_tree_sha == '' && inputs.dev_daily != true && github.ref != 'refs/heads/feat-cmux-next' && !startsWith(github.ref, 'refs/heads/next-batch/') }}

# The macOS jobs run as a side lane, like relay-tls.yml and reload-build.yml:
# Trusted runs (a same-repository pull request, a push or a dispatch) stay on
# vars.CI_SIDE_LANE_RUNNER, the minis' glaeda-side-* label, while owned pools
# are on (CI_PR_POOL_OWNED is 1). Fork pull requests keep their fallback.
# Manual reruns stay minis-first. The rescue re-admits a queued run after the
# five-minute queue alarm: placement first uses a free owned GUI/session Mac,
# then the workflow's Blacksmith macOS route. macos-placement records idle
# side runners with the main picker's idle_placement() and publishes free role
# labels for the bot retry, so a job does not keep a shared concurrency slot
# on a busy Blacksmith label indefinitely. When a job takes the side label, macos-placement uploads the
# owned-pool-watch marker:
# ci-owned-pool-rescue.yml's sweeper on main adopts the run
# (owned_pool_rescue.SIDE_WORKFLOW_PATHS) and re-runs a job a mini leaves
# queued or refuses. Bot attempt 2 and later drop the stale placement output
# and re-admits it through the same fast-checks/owned-Mac/Blacksmith order; a
# person's re-run stays on the side label.
jobs:
  # Why: docs/ci/cmux-next-workflow-notes.md#note-1
  pr-quiet-period:
    if: ${{ github.event_name == 'pull_request' && github.run_attempt == 1 && !contains(github.event.pull_request.labels.*.name, 'leo-named-fix') && format('{0}', vars.CI_PR_QUIET_PERIOD_SECONDS) != '0' }}
    name: cmux-next PR quiet period
    # Why: docs/ci/cmux-next-workflow-notes.md#note-85
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-2vcpu-ubuntu-2404' || fromJSON(vars.RUNNER_POOLS).linux_2 }}
    timeout-minutes: 12
    permissions: {}
    steps:
      - name: Wait until the pull request has had no push for the quiet period
        # Why: docs/ci/cmux-next-workflow-notes.md#note-86
        continue-on-error: true
        timeout-minutes: 11
        env:
          PUSHED_AT: ${{ github.event.pull_request.updated_at }}
          QUIET_SECONDS: ${{ vars.CI_PR_QUIET_PERIOD_SECONDS || '300' }}
        run: |
          set -euo pipefail
          # At most 10 minutes, whatever the variable says.
          [[ "$QUIET_SECONDS" =~ ^[0-9]+$ ]] || QUIET_SECONDS=300
          (( QUIET_SECONDS <= 600 )) || QUIET_SECONDS=600
          now="$(date -u +%s)"
          pushed="$(date -u -d "$PUSHED_AT" +%s 2>/dev/null)" || pushed="$now"
          wait=$(( pushed + QUIET_SECONDS - now ))
          (( wait <= QUIET_SECONDS )) || wait=$QUIET_SECONDS
          if (( wait <= 0 )); then
            echo "The last push ($PUSHED_AT) is ${QUIET_SECONDS}s or more ago; no wait."
            exit 0
          fi
          echo "Waiting ${wait}s so a push within ${QUIET_SECONDS}s of $PUSHED_AT replaces this run before its Mac jobs start."
          sleep "$wait"

  # feat-cmux-next push CI is the Swift app build only (Lawrence, 2026-10-10): its
  # Why: docs/ci/cmux-next-workflow-notes.md#note-11
  push-head-preflight:
    # Why: docs/ci/cmux-next-workflow-notes.md#note-87
    if: ${{ !cancelled() && inputs.same_tree_sha == '' }}
    name: cmux-next push head preflight
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.CI_CLOUD_OVERFLOW_SAVED && (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-16vcpu-ubuntu-2404' || fromJSON(vars.RUNNER_POOLS).linux_16) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-4vcpu-ubuntu-2404' || fromJSON(vars.RUNNER_POOLS).linux_4) }}
    timeout-minutes: 2
    permissions:
      actions: write
      contents: read
    outputs:
      current: ${{ steps.head.outputs.current }}
    steps:
      - name: Check whether this push is still the branch head
        id: head
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current=true
          if [[ "$EVENT_NAME" == push && "$REF" == refs/heads/feat-cmux-next ]]; then
            authorization="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
            remote_sha="$(timeout 15 git -c "http.extraHeader=Authorization: Basic $authorization" \
              ls-remote "${SERVER_URL}/${REPOSITORY}.git" "$REF" 2>/dev/null | awk 'NR==1{print $1}')" || remote_sha=""
            if [[ -n "$remote_sha" && "$remote_sha" != "$SHA" ]]; then
              current=false
              echo "Superseded feat-cmux-next push $SHA; current branch head is $remote_sha."
            elif [[ -z "$remote_sha" ]]; then
              echo "::warning::could not resolve the current feat-cmux-next head; keeping macOS work enabled"
            else
              echo "Current feat-cmux-next head is $SHA."
            fi
          fi
          echo "current=$current" >> "$GITHUB_OUTPUT"

  # Picks the tiers a pull request runs (scripts/ci/cmux_next_route.py; the
  # header above lists them). The diff is the merge commit against its first
  # parent, so commits that landed on the base after the branch point are not
  # counted as the pull request's own. Labels are read live, so labeling a
  # PR full-ci and re-running the workflow runs every tier, not only the
  # routed ones.
  # Pushes and dispatches run every tier.
  #
  # The daemon and scheme tiers also need this commit's same-tree cmux-tui.
  # It is probed once here, never awaited (pin-cmux-tui.sh probe): published,
  # the tree jobs run in this run; still being built, this run leaves a
  # cmux-next-tree-wait-<key> marker and skips them, and a trusted publication
  # may dispatch this workflow's same-tree mode for it
  # (scripts/ci/cmux_next_tree_notify.py). A superseded push skips them. PRs
  # never create a synthetic pin ref: a cold PR tree is skipped with a named
  # reason, while trusted branch pushes still report an unavailable tree.
  path_route:
    needs: [portable-placement]
    if: ${{ always() && !cancelled() && inputs.same_tree_sha == '' }}
    name: cmux-next path routing
    # The run's router: a declared light job (.github/runners.json hosted_light_jobs), 30-50 s of work
    # (a depth-2 checkout, the path classifier, a read-only tree probe). A fresh placement observation
    # takes fleet Linux or an idle mini first; a hosted/paid route remains the fail-open fallback.
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-16vcpu-ubuntu-2404' || needs.portable-placement.outputs.placed_attempt == format('{0}', github.run_attempt) && contains(needs.portable-placement.outputs.linux_jobs, ' path_route ') && needs.portable-placement.outputs.linux_runner || needs.portable-placement.outputs.placed_attempt == format('{0}', github.run_attempt) && contains(needs.portable-placement.outputs.mini_jobs, ' path_route ') && needs.portable-placement.outputs.mini_runner || github.run_attempt == 1 && 'ubuntu-24.04' || vars.CI_CLOUD_OVERFLOW_SAVED && fromJSON(vars.RUNNER_POOLS).linux_16 || fromJSON(vars.RUNNER_POOLS).linux_8 }}
    # Why: docs/ci/cmux-next-workflow-notes.md#note-88
    timeout-minutes: 8
    permissions:
      # Why: docs/ci/cmux-next-workflow-notes.md#note-89
      actions: read
      contents: read
      pull-requests: read
    outputs:
      native: ${{ steps.route.outputs.native }}
      swift_canary: ${{ steps.route.outputs.swift_canary }}
      cmuxnext_swift: ${{ steps.route.outputs.cmuxnext_swift }}
      # Why: docs/ci/cmux-next-workflow-notes.md#note-90
      mac_release: ${{ steps.route.outputs.mac_release }}
      swift_canary_targets: ${{ steps.route.outputs.swift_canary_targets }}
      macos: ${{ steps.route.outputs.macos }}
      # Why: docs/ci/cmux-next-workflow-notes.md#note-91
      fast_tier: ${{ steps.route.outputs.fast_tier }}
      scheme: ${{ steps.route.outputs.scheme }}
      generated: ${{ steps.route.outputs.generated }}
      swift: ${{ steps.route.outputs.swift }}
      daemon: ${{ steps.route.outputs.daemon }}
      full: ${{ steps.route.outputs.full }}
      vendored_pin: ${{ steps.route.outputs.vendored_pin }}
      swift_filter: ${{ steps.route.outputs.swift_filter }}
      swift_priority_filter: ${{ steps.route.outputs.swift_priority_filter }}
      swift_targets: ${{ steps.route.outputs.swift_targets }}
      # Why: docs/ci/cmux-next-workflow-notes.md#note-92
      tree_state: ${{ steps.marker-upload.outcome == 'failure' && 'failed' || steps.tree-final.outputs.tree_state || steps.tree.outputs.tree_state }}
      tree_key: ${{ steps.tree.outputs.tree_key }}
      # Why: docs/ci/cmux-next-workflow-notes.md#note-93
      tree_fetch_key: ${{ steps.tree-final.outputs.tree_fetch_key || steps.tree.outputs.tree_fetch_key }}
      tree_reason: ${{ steps.marker-upload.outcome == 'failure' && 'the tree wait marker was not uploaded, so no publish would start the tree jobs; re-run this run' || steps.tree-final.outputs.tree_reason || steps.tree.outputs.tree_reason }}
      # Why: docs/ci/cmux-next-workflow-notes.md#note-12
      generated_host: ${{ steps.route.outputs.generated != 'true' && 'none' || inputs.base_tier == true && 'generated-files' || github.event_name == 'push' && steps.route.outputs.daemon == 'true' && (steps.marker-upload.outcome == 'failure' && 'failed' || steps.tree-final.outputs.tree_state || steps.tree.outputs.tree_state) == 'ready' && 'daemon-test' || !(github.event_name == 'push' && github.ref == 'refs/heads/feat-cmux-next') && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')) && steps.route.outputs.swift == 'true' && steps.route.outputs.swift_targets != '' && 'swift-test' || steps.route.outputs.daemon == 'true' && (steps.marker-upload.outcome == 'failure' && 'failed' || steps.tree-final.outputs.tree_state || steps.tree.outputs.tree_state) == 'ready' && 'daemon-test' || 'generated-files' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          # Why: docs/ci/cmux-next-workflow-notes.md#note-94
          fetch-depth: 2
      - name: Drop stale submodule checkouts (self-hosted reused workspace)
        continue-on-error: true
        run: if [ -x scripts/ci/reset-stale-submodules.sh ]; then scripts/ci/reset-stale-submodules.sh; fi
      - name: Classify pull request paths
        id: route
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DEV_DAILY: ${{ inputs.dev_daily || false }}
          DEV_DAILY_SHA: ${{ inputs.dev_daily_sha }}
          TIP_SWIFT_SUITE: ${{ inputs.tip_swift_suite || false }}
          TIP_DAEMON_SUITE: ${{ inputs.tip_daemon_suite || false }}
          BASE_TIER: ${{ inputs.base_tier || false }}
          # Why: docs/ci/cmux-next-workflow-notes.md#note-95
          BASE_TIER_COALESCE: ${{ github.repository == 'manaflow-ai/cmux' && format('{0}', vars.CMUX_NEXT_BASE_TIER_COALESCE) != '0' && 'true' || 'false' }}
          # Why: docs/ci/cmux-next-workflow-notes.md#note-96
          DEV_LANDING_COMPILE: ${{ format('{0}', vars.CMUX_NEXT_DEV_LANDING_COMPILE) }}
          SAME_TREE_SHA: ${{ inputs.same_tree_sha }}
          GH_TOKEN: ${{ github.token }}
          # Why: docs/ci/cmux-next-workflow-notes.md#note-97
          EVENT_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          set -euo pipefail
          changed="$RUNNER_TEMP/changed-files.txt"
          labels=""
          if [[ "$EVENT_NAME" == pull_request ]]; then
            git diff --no-renames --name-only HEAD^1 HEAD > "$changed"
            if [[ "$GITHUB_RUN_ATTEMPT" == 1 ]]; then
              labels="$EVENT_LABELS"
            else
              labels="$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels" --jq '[.[].name] | join(",")' 2>/dev/null)" || {
                echo "::warning::could not read the pull request labels; routing on its paths only"
                labels=""
              }
            fi
          else
            : > "$changed"
          fi
          echo "changed files: $(wc -l < "$changed"); labels: ${labels:-none}"
          if [[ "$EVENT_NAME" == workflow_dispatch && "$DEV_DAILY" == true ]]; then
            # The dispatcher (main's cmux-next-dev-daily-dispatch.yml) asks for
            # the feat-cmux-next tip it saw. A merge that lands before this run
            # starts moves github.sha: fail without building, and the next tick
            # asks for the new tip. No snapshot ref: creating a ref at a
            # feat-cmux-next commit needs the workflows permission (HTTP 403).
            [[ "$GITHUB_REF" == refs/heads/feat-cmux-next ]] || {
              echo "error: dev_daily runs on refs/heads/feat-cmux-next, got $GITHUB_REF" >&2
              exit 1
            }
            if [[ -n "$SAME_TREE_SHA" ]]; then
              [[ "$DEV_DAILY_SHA" == "$SAME_TREE_SHA" ]] || {
                echo "error: deferred dev_daily asked for $DEV_DAILY_SHA but same-tree mode is $SAME_TREE_SHA" >&2
                exit 1
              }
            else
              [[ "$DEV_DAILY_SHA" == "$GITHUB_SHA" ]] || {
                echo "error: dev_daily asked for $DEV_DAILY_SHA but feat-cmux-next moved to $GITHUB_SHA; the next dispatcher tick takes the new tip" >&2
                exit 1
              }
            fi
            {
              echo 'native=false'
              echo 'swift_canary=false'
              echo 'cmuxnext_swift=false'
              echo 'swift_canary_targets='
              echo 'macos=true'
              echo 'scheme=true'
              echo 'generated=false'
              echo 'swift=false'
              echo 'daemon=false'
              echo 'full=false'
              echo 'swift_filter='
              echo 'swift_priority_filter='
              echo 'swift_targets='
            } >> "$GITHUB_OUTPUT"
            {
              echo '### cmux-next tiers'
              echo
              echo '| tier | runs |'
              echo '| --- | --- |'
              echo '| generated | false |'
              echo '| native | false |'
              echo '| swift_canary | false |'
              echo '| scheme | true |'
              echo '| swift | false |'
              echo '| daemon | false |'
              echo '| full | false |'
              echo
              echo '- scheduled dev-daily dispatch: the exact feat-cmux-next SHA builds the Release cmux NEXT DEV artifact in the scheme job.'
            } >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$EVENT_NAME" == workflow_dispatch && "$TIP_SWIFT_SUITE" == true ]]; then
            # main's cmux-next-tip-swift-suite-dispatch.yml, every few hours: a
            # feat-cmux-next push skips swift-test (push CI is the app build
            # only), so a Swift suite red on the base stayed invisible for a day
            # (2026-10-21). This run gives swift-test a verdict on the tip, the
            # base run scripts/ci/base_red_excuse.py compares a PR's reds with.
            # Only the Swift suite: no scheme, daemon, native or generated tier.
            # It tests the tip it starts on, whatever the dispatcher saw.
            [[ "$GITHUB_REF" == refs/heads/feat-cmux-next ]] || {
              echo "error: tip_swift_suite runs on refs/heads/feat-cmux-next, got $GITHUB_REF" >&2
              exit 1
            }
            {
              echo 'native=false'
              echo 'swift_canary=false'
              echo 'cmuxnext_swift=false'
              echo 'swift_canary_targets='
              echo 'macos=true'
              echo 'scheme=false'
              echo 'generated=false'
              echo 'swift=true'
              echo 'daemon=false'
              echo 'full=false'
              echo 'swift_filter='
              echo 'swift_priority_filter='
              echo 'swift_targets=all'
            } >> "$GITHUB_OUTPUT"
            {
              echo '### cmux-next tiers'
              echo
              echo '| tier | runs |'
              echo '| --- | --- |'
              echo '| swift | true (every target) |'
              echo
              echo '- scheduled tip Swift suite: every CmuxNext Swift target on the feat-cmux-next tip.'
            } >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$EVENT_NAME" == workflow_dispatch && "$BASE_TIER" == true ]]; then
            # cmux-next-base-tier-kick.yml, at most once every 15 minutes: the base Mac tier a
            # feat-cmux-next push leaves to it (below), on the tip. Its tree wait marker carries
            # tip_suite=base, so a same-tree run tests this exact commit even after the tip moves on.
            [[ "$GITHUB_REF" == refs/heads/feat-cmux-next ]] || {
              echo "error: base_tier runs on refs/heads/feat-cmux-next, got $GITHUB_REF" >&2
              exit 1
            }
            {
              echo 'native=false'
              echo 'swift_canary=false'
              echo 'cmuxnext_swift=false'
              echo 'swift_canary_targets='
              echo 'macos=true'
              echo 'scheme=true'
              echo 'generated=true'
              echo 'swift=false'
              echo 'daemon=true'
              echo 'full=false'
              echo 'swift_filter='
              echo 'swift_priority_filter='
              echo 'swift_targets='
            } >> "$GITHUB_OUTPUT"
            {
              echo '### cmux-next tiers'
              echo
              echo '| tier | runs |'
              echo '| --- | --- |'
              echo '| generated | true |'
              echo '| scheme | true |'
              echo '| daemon | true |'
              echo
              echo '- base tier: daemon tests, generated files and the Debug app scheme compile on the feat-cmux-next tip.'
            } >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$EVENT_NAME" == workflow_dispatch && "$TIP_DAEMON_SUITE" == true ]]; then
            # main's tip suite dispatcher (its daemon suite): a feat-cmux-next push never gets
            # daemon-test (its same-tree run has origin push, and in a landing burst the tip moves
            # before the tree publishes), so the base had no daemon-test verdict for
            # scripts/ci/base_red_excuse.py to compare a pull request's daemon-test red with
            # (2026-10-30, #27692). Only the daemon tier. Its tree wait marker carries tip_suite, so
            # the same-tree run tests this exact commit even after the tip moves on.
            [[ "$GITHUB_REF" == refs/heads/feat-cmux-next ]] || {
              echo "error: tip_daemon_suite runs on refs/heads/feat-cmux-next, got $GITHUB_REF" >&2
              exit 1
            }
            {
              echo 'native=false'
              echo 'swift_canary=false'
              echo 'cmuxnext_swift=false'
              echo 'swift_canary_targets='
              echo 'macos=true'
              echo 'scheme=false'
              echo 'generated=false'
              echo 'swift=false'
              echo 'daemon=true'
              echo 'full=false'
              echo 'swift_filter='
              echo 'swift_priority_filter='
              echo 'swift_targets='
            } >> "$GITHUB_OUTPUT"
            {
              echo '### cmux-next tiers'
              echo
              echo '| tier | runs |'
              echo '| --- | --- |'
              echo '| daemon | true |'
              echo
              echo '- scheduled tip daemon suite: the live-daemon suites on the feat-cmux-next tip.'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            # --base-rev: the merge commit's first parent, so a change to this workflow that leaves
            # every Mac job and what it needs as it was (`on:` paths, a Linux-only job) is CI-only.
            # The router runs every tier when it cannot read or compare that base.
            routed="$GITHUB_OUTPUT"
            if [[ "$EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/feat-cmux-next && "$BASE_TIER_COALESCE" == true ]]; then
              routed="$RUNNER_TEMP/route-outputs.txt"
              : > "$routed"
            fi
            python3 scripts/ci/cmux_next_route.py --event "$EVENT_NAME" --changed-files "$changed" \
              --labels "$labels" --base-rev HEAD^1 --github-output "$routed" --summary "$GITHUB_STEP_SUMMARY"
            if [[ "$routed" != "$GITHUB_OUTPUT" ]]; then
              # The base Mac tier (daemon tests, generated files, the Debug app scheme compile) runs
              # at most once every 15 minutes on the tip, in the run cmux-next-base-tier-kick.yml
              # dispatches (cmuxterm-hq#5424). The Release compiles (nightly-next's input), the DEV
              # landing compile and the fast tier still run on this push.
              keep=()
              [[ "$DEV_LANDING_COMPILE" == 0 ]] && keep=(--keep scheme)
              python3 scripts/ci/cmux_next_base_tier.py defer "$routed" "${keep[@]}" >> "$GITHUB_OUTPUT"
              echo '- base tier (daemon tests, generated files, scheme compile): left to the cmux-next base tier run on the tip, at most 15 minutes away (cmux-next-base-tier-kick.yml).' >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          # Whether this pull request changes the cmux-tui it would test against:
          # any v2 tree-key input (cmux-tui-tree-inputs.txt), such as cmux-tui/,
          # ghostty-next or cmux-cloud's crate. One that does not is never
          # failed for an unpublished merge tree (the probe steps below,
          # CMUX_TUI_TREE_BASE_FALLBACK).
          if [[ "$EVENT_NAME" == pull_request ]] && ! python3 - "$changed" <<'PY'
          import sys
          inputs = []
          for raw in open("scripts/cmux-next/cmux-tui-tree-inputs.txt", encoding="utf-8"):
              raw = raw.strip()
              if raw and not raw.startswith("#"):
                  kind, path = raw.split(maxsplit=1)
                  if (kind, path) != ("gitlink", "ghostty"):  # v1 key only
                      inputs.append((kind, path))
          changed = [line.strip() for line in open(sys.argv[1], encoding="utf-8") if line.strip()]
          hit = any(c == p or (k == "tree" and c.startswith(p + "/")) for c in changed for k, p in inputs)
          sys.exit(0 if hit else 1)
          PY
          then
            echo "own_tui=false" >> "$GITHUB_OUTPUT"
          else
            echo "own_tui=true" >> "$GITHUB_OUTPUT"
          fi

      # One look (and one short re-check of a missing run list), no wait.
      # Fails open: the tiers above are already routed, so a probe that errs or
      # passes its 2 minutes leaves tree_state empty (the tree jobs skip) and
      # every other routed job still runs (2026-10-27: per-run fetches of a
      # lane-branch push burst held this step past the job limit, and the
      # cancelled job skipped the Release compiles and swift test).
      - name: Probe the same-tree cmux-tui
        id: tree
        if: (steps.route.outputs.daemon == 'true' || steps.route.outputs.scheme == 'true')
        timeout-minutes: 2
        continue-on-error: true
        env:
          # Why: docs/ci/cmux-next-workflow-notes.md#note-98
          CMUX_TUI_TREE_RUN_FETCH_SECONDS: "45"
          # Why: docs/ci/cmux-next-workflow-notes.md#note-13
          CMUX_TUI_TREE_PUBLISHER_SHA: ${{ github.event_name != 'pull_request' && inputs.dev_daily != true && github.sha || '' }}
          CMUX_TUI_TREE_DISPATCH: ""
          CMUX_TUI_TREE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # Why: docs/ci/cmux-next-workflow-notes.md#note-99
          CMUX_TUI_TREE_BASE_FALLBACK: ${{ (inputs.dev_daily == true || steps.route.outputs.own_tui == 'false') && '1' || '' }}
          # Why: docs/ci/cmux-next-workflow-notes.md#note-100
          CMUX_TUI_TREE_PUBLISHER_WAIT_SECONDS: ${{ github.event_name == 'pull_request' && '0' || '' }}
          GH_TOKEN: ${{ github.token }}
        run: scripts/cmux-next/pin-cmux-tui.sh probe

      # Why: docs/ci/cmux-next-workflow-notes.md#note-101
      - name: Write the tree wait marker
        id: marker
        # Why: docs/ci/cmux-next-workflow-notes.md#note-102
        if: inputs.dev_daily != true && (steps.tree.outputs.tree_state == 'deferred' || (github.event_name != 'pull_request' && steps.tree.outputs.tree_state == 'failed'))
        env:
          KEY: ${{ steps.tree.outputs.tree_key }}
          DAEMON: ${{ steps.route.outputs.daemon }}
          SCHEME: ${{ steps.route.outputs.scheme }}
          EVENT_NAME: ${{ github.event_name }}
          SHA: ${{ github.sha }}
          STATUS_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BRANCH: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          DEV_DAILY: ${{ inputs.dev_daily || false }}
          DEV_DAILY_SHA: ${{ inputs.dev_daily_sha }}
          TIP_DAEMON_SUITE: ${{ inputs.tip_daemon_suite || false }}
          BASE_TIER: ${{ inputs.base_tier || false }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/cmux-next-tree-wait"
          mkdir -p "$dir"
          python3 - "$dir/marker.json" <<'PY'
          import json, os, sys
          env = os.environ
          tiers = [tier for tier, on in (("daemon", env["DAEMON"]), ("scheme", env["SCHEME"])) if on == "true"]
          marker = {"version": 1, "key": env["KEY"], "sha": env["SHA"], "status_sha": env["STATUS_SHA"],
                    "tiers": tiers, "run_id": int(env["GITHUB_RUN_ID"])}
          if env["DEV_DAILY"] == "true":
              marker.update(dev_daily=True, dev_daily_sha=env["DEV_DAILY_SHA"])
          if env["EVENT_NAME"] == "pull_request":
              marker.update(origin="pull_request", pr=int(env["PR_NUMBER"]), head_ref=env["HEAD_REF"],
                            head_repo=env["HEAD_REPO"], base_ref=env["BASE_REF"])
          else:
              # A dispatch on a working branch (#22303) is not a push: its same-tree run still
              # runs daemon-test, which a push's skips. The DEV daily stays a feat-cmux-next push.
              if env["EVENT_NAME"] == "workflow_dispatch" and env["DEV_DAILY"] != "true":
                  marker.update(origin="dispatch", branch=env["BRANCH"],
                                ref_kind="tags" if env["REF_TYPE"] == "tag" else "heads")
                  # The tip daemon suite tests this exact commit, like the DEV daily: its same-tree run
                  # starts after the tip moves on (scripts/ci/cmux_next_tree_notify.py is_current).
                  if env.get("TIP_DAEMON_SUITE") == "true" and env["BRANCH"] == "feat-cmux-next":
                      marker.update(tip_suite="daemon")
                  # The base tier likewise (cmux-next-base-tier-kick.yml): its same-tree run is the base
                  # verdict for this commit and is named after it.
                  elif env.get("BASE_TIER") == "true" and env["BRANCH"] == "feat-cmux-next":
                      marker.update(tip_suite="base")
              else:
                  marker.update(origin="push", branch=env["BRANCH"])
          with open(sys.argv[1], "w", encoding="utf-8") as stream:
              json.dump(marker, stream)
          print(json.dumps(marker))
          PY
          echo "path=$dir/marker.json" >> "$GITHUB_OUTPUT"

      - name: Upload the tree wait marker
        id: marker-upload
        if: steps.marker.outputs.path != ''
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-next-tree-wait-${{ steps.tree.outputs.tree_key }}
          path: ${{ steps.marker.outputs.path }}
          retention-days: 2
          overwrite: true

      # Why: docs/ci/cmux-next-workflow-notes.md#note-103
      - name: Probe the same-tree cmux-tui after the marker
        id: tree-final
        if: steps.marker-upload.outcome == 'success'
        # Why: docs/ci/cmux-next-workflow-notes.md#note-104
        timeout-minutes: 2
        continue-on-error: true
        env:
          CMUX_TUI_TREE_RUN_FETCH_SECONDS: "45"
          # Why: docs/ci/cmux-next-workflow-notes.md#note-105
          CMUX_TUI_TREE_PUBLISHER_SHA: ${{ github.event_name != 'pull_request' && inputs.dev_daily != true && github.sha || '' }}
          CMUX_TUI_TREE_DISPATCH: ""
          CMUX_TUI_TREE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CMUX_TUI_TREE_BASE_FALLBACK: ${{ steps.route.outputs.own_tui == 'false' && '1' || '' }}
          CMUX_TUI_TREE_RECHECK_SECONDS: "0"
          # Why: docs/ci/cmux-next-workflow-notes.md#note-106
          CMUX_TUI_TREE_PUBLISHER_WAIT_SECONDS: "0"
          GH_TOKEN: ${{ github.token }}
        run: scripts/cmux-next/pin-cmux-tui.sh probe

      - name: Report a probe that failed open
        if: steps.tree.outcome == 'failure' || steps.tree-final.outcome == 'failure'
        env:
          FIRST: ${{ steps.tree.outcome }}
          FINAL: ${{ steps.tree-final.outcome }}
        run: |
          reason="the same-tree cmux-tui probe failed or passed its 2-minute limit (first probe: $FIRST, after the marker: ${FINAL:-not run}); the routed compile and test jobs still run, and the tree jobs run only on a tree_state the probe wrote"
          echo "::warning title=same-tree cmux-tui probe failed open::$reason"
          { echo '### same-tree cmux-tui probe failed open'; echo; echo "$reason"; } >> "$GITHUB_STEP_SUMMARY"

      - name: Summarize the same-tree cmux-tui
        if: steps.tree.outputs.tree_state != ''
        env:
          STATE: ${{ steps.marker-upload.outcome == 'failure' && 'failed' || steps.tree-final.outputs.tree_state || steps.tree.outputs.tree_state }}
          KEY: ${{ steps.tree.outputs.tree_key }}
          REASON: ${{ steps.tree-final.outputs.tree_reason || steps.tree.outputs.tree_reason }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == pull_request && "$STATE" == failed ]]; then
            STATE=skipped
            REASON="No cmux-tui-pin ref is created for pull requests; re-run after a trusted feat-cmux-next publication. $REASON"
          fi
          {
            echo "### same-tree cmux-tui $KEY: $STATE"
            echo
            echo "$REASON"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$STATE" == skipped ]]; then
            echo "::notice title=same-tree cmux-tui skipped::$REASON"
          elif [[ "$STATE" == deferred ]]; then
            echo "::notice title=same-tree cmux-tui deferred::$REASON"
          fi

  # A cmux NEXT DEV daily run builds exactly the SHA main's dispatcher asked
  # Why: docs/ci/cmux-next-workflow-notes.md#note-14
  dev-daily-tree-wait:
    needs: path_route
    if: ${{ !cancelled() && inputs.dev_daily == true && inputs.same_tree_sha == '' && needs.path_route.outputs.tree_state == 'deferred' }}
    name: cmux NEXT DEV daily tree wait
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.CI_CLOUD_OVERFLOW_SAVED && (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-16vcpu-ubuntu-2404' || fromJSON(vars.RUNNER_POOLS).linux_16) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-4vcpu-ubuntu-2404' || fromJSON(vars.RUNNER_POOLS).linux_4) }}
    timeout-minutes: 60
    permissions:
      # Why: docs/ci/cmux-next-workflow-notes.md#note-107
      actions: read
      contents: read
    outputs:
      tree_state: ${{ steps.wait.outputs.tree_state }}
      tree_fetch_key: ${{ steps.wait.outputs.tree_fetch_key }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Wait for this commit's cmux-tui tree
        id: wait
        env:
          CMUX_TUI_TREE_PUBLISHER_SHA: ""
          CMUX_TUI_TREE_DISPATCH: ""
          GH_TOKEN: ${{ github.token }}
        run: scripts/cmux-next/wait-dev-daily-tree.sh

  macos-placement:
    environment: ${{ github.event_name != 'pull_request' && 'ci-routing-agent' || '' }}
    # Why: docs/ci/cmux-next-workflow-notes.md#note-15
    needs: [path_route, push-head-preflight, pr-quiet-period, app-compile-placement]
    # Attempt 1's macOS jobs stay on the owned side label while the fleet
    # drains. A bot retry runs placement again so it can use a newly free
    # owned GUI/session runner before falling back to Blacksmith.
    # Every step fails open: a skipped or failed placement leaves
    # fallback_jobs empty, so the jobs keep the side label and the marker is
    # still uploaded. It runs only where attempt 1's Mac jobs may
    # take the side label (CMUX_NEXT_SIDE_ROUTE's owned branch): a fork, another
    # owner, owned pools off or a re-run starts no Linux runner for it, and the
    # Mac jobs (needs plus !cancelled()) take their route without it. A re-run
    # needs no marker of its own: its Mac jobs take the fallback, and the
    # rescue's watch of a side lane ends at attempt 2.
    # Same-tree mode runs it too: its owned-pool-watch marker lets the rescue
    # re-run a tree job that a mini refuses (no head to move on a dispatch).
    # A pull request the router sends to no Mac tier starts no Mac job (the
    # fast tier follows the route too), so it places nothing.
    if: ${{ !cancelled() && ((inputs.same_tree_sha == '' && needs.push-head-preflight.outputs.current == 'true' && needs.path_route.outputs.macos == 'true') || (inputs.same_tree_sha != '' && inputs.same_tree_state == 'ready')) && github.repository_owner == 'manaflow-ai' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.CI_PR_POOL_OWNED == '1' && (github.run_attempt == 1 || (github.run_attempt == 2 && contains(fromJSON('["github-actions[bot]","cmux-bot[bot]"]'), github.triggering_actor))) }}
    name: cmux-next macOS placement
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.CI_CLOUD_OVERFLOW_SAVED && (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-16vcpu-ubuntu-2404' || fromJSON(vars.RUNNER_POOLS).linux_16) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-4vcpu-ubuntu-2404' || fromJSON(vars.RUNNER_POOLS).linux_4) }}
    # Why: docs/ci/cmux-next-workflow-notes.md#note-108
    timeout-minutes: 8
    # Why: docs/ci/cmux-next-workflow-notes.md#note-16
    env:
      CMUX_NEXT_SIDE_ROUTE: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-6vcpu-macos-26' || vars.CI_PR_POOL_OWNED == '1' && contains(fromJSON('["pull_request","push","workflow_dispatch"]'), github.event_name) && (github.run_attempt == 1 || github.run_attempt == 2 && contains(fromJSON('["github-actions[bot]","cmux-bot[bot]"]'), github.triggering_actor)) && vars.CI_SIDE_LANE_RUNNER || vars.MACOS_RUNNER_26 || 'blacksmith-6vcpu-macos-26') }}
    permissions:
      # The queue janitor's pool snapshot, Blacksmith's queued jobs (next_macos_cascade.py).
      actions: read
      contents: read
    outputs:
      # The jobs no idle mini took that Blacksmith has a free slot for now, 12
      # vCPU first and then 6, and the Blacksmith label the bot's overflow
      # attempt takes (scripts/ci/next_macos_cascade.py).
      blacksmith_12_jobs: ${{ steps.place.outputs.blacksmith_12_jobs }}
      blacksmith_6_jobs: ${{ steps.place.outputs.blacksmith_6_jobs }}
      # Why: docs/ci/cmux-next-workflow-notes.md#note-109
      retry_runner: ${{ steps.place.outputs.free_retry_runner }}
      retry_jobs: ${{ steps.place.outputs.retry_jobs }}
      # Why: docs/ci/cmux-next-workflow-notes.md#note-110
      deferred_runner: ${{ steps.place.outputs.deferred_runner }}
      # The Blacksmith labels a feed's compile counts as full (next_macos_cascade.fresh_stalled()): a feat-cmux-next
      # push's Release compile never falls back to one of them.
      fresh_stalled: ${{ steps.place.outputs.fresh_stalled }}
      # Why: docs/ci/cmux-next-workflow-notes.md#note-17
      fleet_jobs: ${{ steps.place.outputs.fleet_jobs }}
      # Why: docs/ci/cmux-next-workflow-notes.md#note-111
      fast_runner: ${{ steps.place.outputs.fast_runner }}
      # Why: docs/ci/cmux-next-workflow-notes.md#note-112
      fresh_runner: ${{ steps.place.outputs.fresh_runner }}
      fresh_jobs: ${{ steps.place.outputs.fresh_jobs }}
      # Why: docs/ci/cmux-next-workflow-notes.md#note-18
      gateway_runner: ${{ steps.place.outputs.gateway_runner }}
      gateway_attempt: ${{ steps.place.outputs.gateway_attempt }}
      fallback_jobs: ${{ steps.place.outputs.fallback_jobs }}
      owned_jobs: ${{ steps.place.outputs.owned_jobs }}
      # Why: docs/ci/cmux-next-workflow-notes.md#note-19
      placed_attempt: ${{ github.run_attempt }}
      runner: ${{ steps.place.outputs.runner }}
      # Why: docs/ci/cmux-next-workflow-notes.md#note-113
      gui_runner: ${{ steps.place.outputs.gui_runner }}
      # Why: docs/ci/cmux-next-workflow-notes.md#note-20
      session_runner: ${{ steps.place.outputs.session_runner }}
      free_gui_runner: ${{ steps.place.outputs.free_gui_runner }}
      # Why: docs/ci/cmux-next-workflow-notes.md#note-114
      gui_overflow: ${{ steps.place.outputs.gui_overflow }}
      # Why: docs/ci/cmux-next-workflow-notes.md#note-115
      session_lane_runner: ${{ steps.place.outputs.session_lane_runner }}
      free_session_runner: ${{ steps.place.outputs.free_session_runner }}
      nightly_runner_ready: ${{ steps.place.outputs.nightly_runner_ready }}
    steps:
      # The placement code from the base branch, as ci-macos.yml's admission-placement uses it.
      - name: Check out the trusted placement
        timeout-minutes: 1
        if: startsWith(env.CMUX_NEXT_SIDE_ROUTE, 'glaeda-')
        continue-on-error: true
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          sparse-checkout: scripts/ci
          persist-credentials: false

      - name: Mint the owned-pool routing token
        id: route-token
        if: startsWith(env.CMUX_NEXT_SIDE_ROUTE, 'glaeda-') && vars.GLAEDA_ROUTE_APP_ID != ''
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.GLAEDA_ROUTE_APP_ID }}
          private-key: ${{ secrets.GLAEDA_ROUTE_APP_KEY }}
          permission-administration: read
          permission-organization-self-hosted-runners: read

      # Why: docs/ci/cmux-next-workflow-notes.md#note-116
      - name: Mint the cmux-bot runner-read token
        id: route-token-fallback
        if: startsWith(env.CMUX_NEXT_SIDE_ROUTE, 'glaeda-') && vars.CMUX_BOT_APP_ID != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.CMUX_BOT_APP_ID }}
          private-key: ${{ secrets.CMUX_BOT_APP_KEY }}
          permission-organization-self-hosted-runners: read

      # Why: docs/ci/cmux-next-workflow-notes.md#note-117
      - name: Mint the glaeda read token
        id: snapshot-read-token
        if: startsWith(env.CMUX_NEXT_SIDE_ROUTE, 'glaeda-') && vars.GLAEDA_ROUTE_APP_ID != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.GLAEDA_ROUTE_APP_ID }}
          private-key: ${{ secrets.GLAEDA_ROUTE_APP_KEY }}
          permission-actions: read
          permission-pull-requests: read

      # Why: docs/ci/cmux-next-workflow-notes.md#note-21
      - name: Place the macOS jobs
        id: place
        if: startsWith(env.CMUX_NEXT_SIDE_ROUTE, 'glaeda-')
        continue-on-error: true
        timeout-minutes: 2
        env:
          CI_RUNNER_STATE: ${{ vars.CI_RUNNER_STATE }}
          ROUTE_TOKEN: ${{ steps.route-token.outputs.token }}
          ROUTE_TOKEN_FALLBACK: ${{ steps.route-token-fallback.outputs.token }}
          SNAPSHOT_TOKEN: ${{ steps.snapshot-read-token.outputs.token || github.token }}
          # Why: docs/ci/cmux-next-workflow-notes.md#note-118
          CI_FLEET_GATES: ${{ vars.CI_FLEET_GATES }}
          # Why: docs/ci/cmux-next-workflow-notes.md#note-22
          CASCADE_RUNS: >-
            ${{ format(' {0} {1} {2} {3} {4} {5} {6} ',
            ((github.event_name == 'pull_request' && github.base_ref == 'feat-cmux-next' && needs.path_route.outputs.fast_tier != 'false') || (github.event_name == 'push' && github.ref == 'refs/heads/feat-cmux-next')) && 'fast-tier' || '',
            needs.path_route.outputs.swift_canary == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository || contains(github.event.pull_request.labels.*.name, 'full-ci')) && 'swift-canary' || '',
            (inputs.same_tree_sha != '' && inputs.same_tree_state == 'ready' && contains(inputs.same_tree_tiers, 'scheme') || needs.path_route.outputs.scheme == 'true' && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci') || (github.event.pull_request.author_association == 'MEMBER' || github.event.pull_request.author_association == 'OWNER') && contains(github.event.pull_request.labels.*.name, 'dev-build'))) && 'cmux-scheme-compile' || '',
            needs.path_route.outputs.native == 'true' && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci') || github.event.pull_request.head.repo.full_name == github.repository && needs.path_route.outputs.mac_release == 'true' && !(needs.app-compile-placement.outputs.gateway_attempt == format('{0}', github.run_attempt) && needs.app-compile-placement.outputs.gateway_runner != '')) && 'release-compile' || '',
            github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.labels.*.name, 'full-ci') && needs.path_route.outputs.swift == 'true' && 'swift-test' || '',
            github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && needs.path_route.outputs.daemon == 'true' && needs.path_route.outputs.tree_state == 'ready' && 'daemon-test' || '',
            github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && needs.path_route.outputs.generated == 'true' && needs.path_route.outputs.generated_host == 'generated-files' && 'generated-files' || '') }}
          CASCADE_JOBS: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && 'swift-test daemon-test generated-files' || '' }}
          # Why: docs/ci/cmux-next-workflow-notes.md#note-119
          PROMOTE_LABEL: ${{ github.event_name == 'push' && github.ref == 'refs/heads/feat-cmux-next' && github.run_attempt == 1 && vars.CI_NEXT_PROMOTE_POOL || '' }}
          NIGHTLY_POOL: ${{ github.event_name == 'push' && github.ref == 'refs/heads/feat-cmux-next' && github.run_attempt == 1 && vars.CI_NIGHTLY_NEXT_TRUSTED_POOL || '' }}
          NIGHTLY_RUNNER: ${{ github.event_name == 'push' && github.ref == 'refs/heads/feat-cmux-next' && github.run_attempt == 1 && vars.CI_NIGHTLY_NEXT_TRUSTED_RUNNER || '' }}
          SIDE_LABEL: ${{ env.CMUX_NEXT_SIDE_ROUTE }}
          # Why: docs/ci/cmux-next-workflow-notes.md#note-120
          FAST_LABEL: ${{ vars.CI_FAST_LANE_RUNNER }}
          # Why: docs/ci/cmux-next-workflow-notes.md#note-121
          SESSION_LANE: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-6vcpu-macos-26' || vars.CI_SESSION_LANE_RUNNER }}
          # Why: docs/ci/cmux-next-workflow-notes.md#note-23
          FRESH_LABEL: ${{ vars.CI_DEV_COMPILE_RUNNER || 'glaeda-dev-std-xcode-26.6' }}
          FRESH_SLOT_JOBS: cmux-scheme-compile release-compile
          # The build-fleet compiles' gateway, taken (or a wider class of it) only while a runner is
          # idle (gateway_runner). With none idle, swift-canary-fleet does not run and swift-canary
          # cascades. The PR's app compile took its gateway before the quiet period ended
          # (app-compile-placement); with none, its Mac Release compile, which runs when
          # app-compile-fleet gives no verdict, is in CASCADE_RUNS above.
          GATEWAY_LABEL: ${{ vars.CI_COMPILE_CHECK_GATEWAY }}
          # Why: docs/ci/cmux-next-workflow-notes.md#note-24
          FLEET_CLIENT_JOBS: fast-tier
          # Why: docs/ci/cmux-next-workflow-notes.md#note-122
          GATEWAY_JOBS: >-
            ${{ format('{0} {1}',
            needs.path_route.outputs.swift_canary == 'true' && 'swift-canary-fleet' || '',
            github.event_name == 'push' && github.ref == 'refs/heads/feat-cmux-next' && needs.path_route.outputs.native == 'true' && 'release-compile-fast' || '') }}
          JOBS: fast-tier swift-canary cmux-scheme-compile release-compile swift-test daemon-test generated-files
          # Why: docs/ci/cmux-next-workflow-notes.md#note-123
          GUI_LAST_RESORT: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || 'blacksmith-6vcpu-macos-26' }}
          # A feat-cmux-next push's Release compile gates the nightly-next request, so the cascade
          # places it ahead of the run's other jobs (next_macos_cascade.FIRST_JOBS).
          FIRST_JOBS: ${{ github.event_name == 'push' && github.ref == 'refs/heads/feat-cmux-next' && github.run_attempt == 1 && 'release-compile' || '' }}
          # The jobs a feed's freshness waits on: when the counts cannot be read (a 403 on the route token, a
          # stale snapshot) they take Blacksmith 6 vCPU, the last resort, instead of an owned queue nobody
          # measured (next_macos_cascade.unread_fresh_jobs()). A DEV daily's Release compile feeds the DEV
          # channel, a feat-cmux-next push's gates nightly-next.
          FRESH_JOBS: ${{ (github.run_attempt == 1 || github.run_attempt == 2 && contains(fromJSON('["github-actions[bot]","cmux-bot[bot]"]'), github.triggering_actor)) && (github.event_name == 'push' && github.ref == 'refs/heads/feat-cmux-next' && 'release-compile' || github.event_name == 'workflow_dispatch' && inputs.dev_daily == true && 'cmux-scheme-compile') || '' }}
        run: |
          # The rescue's re-run (attempt 2) is placed only by a trusted script that knows it
          # (side_lane_placement.rerun_main()): an older one writes owned routes a re-run must not
          # take, so the step writes nothing, the route every re-run had before.
          if [ "$GITHUB_RUN_ATTEMPT" != 1 ] && ! grep -q '^def rerun_main' scripts/ci/side_lane_placement.py; then
            echo "side-lane placement: the trusted placement predates re-run placement; the re-run keeps its route"
            exit 0
          fi
          python3 scripts/ci/side_lane_placement.py
          # The trusted checkout may still be on a base branch that predates
          # the route output. Keep the same owned-pool fallback for that
          # transition and for an API read that fails closed.
          route="$(awk -F= '$1 == "runner" { value=substr($0, index($0, "=") + 1) } END { print value }' "$GITHUB_OUTPUT")"
          # The rescue's re-run writes no owned route (side_lane_placement.rerun_main()).
          if [ -z "$route" ] && [[ "$SIDE_LABEL" == glaeda-side-* ]] && [ "$GITHUB_RUN_ATTEMPT" = 1 ]; then
            printf 'runner=glaeda-%s\n' "${SIDE_LABEL#glaeda-side-}" >> "$GITHUB_OUTPUT"
          fi
          # An empty gui_runner is meaningful: no online runner carries the
          # GUI label, so preserve the picker/placement fallback instead of
          # synthesizing a label that may not exist in the fleet.
          # A placement that names neither a GUI route nor a GUI overflow (a
          # trusted base that predates the sized gui_overflow, or one whose
          # runner read failed closed) vouches for no owned GUI queue: the GUI
          # jobs take Blacksmith 6 vCPU, the last resort, as the synthesized
          # runner above sent them before, never the owned GUI queue unmeasured.
          gui="$(awk -F= '($1 == "gui_runner" || $1 == "gui_overflow") && substr($0, index($0, "=") + 1) != "" { found=1 } END { print found + 0 }' "$GITHUB_OUTPUT")"
          if [ "$gui" = 0 ] && [[ "$SIDE_LABEL" == glaeda-side-* ]] && [ "$GITHUB_RUN_ATTEMPT" = 1 ]; then
            printf 'gui_overflow=%s\n' "$GUI_LAST_RESORT" >> "$GITHUB_OUTPUT"
          fi

      # Fail-safe: without the marker the run is only not watched. Skipped
      # Why: docs/ci/cmux-next-workflow-notes.md#note-124
      - name: Mark a run on the minis
        id: marker
        if: startsWith(env.CMUX_NEXT_SIDE_ROUTE, 'glaeda-') && github.event_name != 'push' && github.run_attempt == 1
        continue-on-error: true
        run: |
          set -euo pipefail
          marker="$RUNNER_TEMP/macos-pool-persistent.json"
          echo '{}' > "$marker"
          echo "path=$marker" >> "$GITHUB_OUTPUT"

      # With no free overflow slot a bot re-run takes the same side label
      # Why: docs/ci/cmux-next-workflow-notes.md#note-125
      - name: Upload the owned-pool watch marker
        timeout-minutes: 1
        if: ${{ steps.marker.outputs.path != '' }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.place.outputs.free_retry_runner == '' && 'owned-pool-watch-refusals' || 'owned-pool-watch' }}
          path: ${{ steps.marker.outputs.path }}
          retention-days: 1

  # Why: docs/ci/cmux-next-workflow-notes.md#note-25
  portable-placement:
    name: portable job placement
    # Why: docs/ci/cmux-next-workflow-notes.md#note-126
    if: ${{ !cancelled() && vars.CI_PORTABLE_LIGHT_JOBS_OFF != '1' && inputs.dev_daily != true && inputs.base_tier != true && inputs.same_tree_sha == '' && github.repository_owner == 'manaflow-ai' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (github.run_attempt == 1 || github.run_attempt == 2 && contains(fromJSON('["github-actions[bot]","cmux-bot[bot]"]'), github.triggering_actor)) }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-2vcpu-ubuntu-2404' || github.run_attempt == 1 && 'ubuntu-24.04' || vars.CI_CLOUD_OVERFLOW_SAVED && fromJSON(vars.RUNNER_POOLS).linux_16 || fromJSON(vars.RUNNER_POOLS).linux_8 }}
    timeout-minutes: 4
    permissions:
      # Why: docs/ci/cmux-next-workflow-notes.md#note-127
      actions: read
      contents: read
    outputs:
      linux_runner: ${{ steps.place.outputs.linux_runner }}
      linux_jobs: ${{ steps.place.outputs.linux_jobs }}
      mini_runner: ${{ steps.place.outputs.mini_runner }}
      mini_jobs: ${{ steps.place.outputs.mini_jobs }}
      # Why: docs/ci/cmux-next-workflow-notes.md#note-128
      placed_attempt: ${{ github.run_attempt }}
    steps:
      - name: Check out the trusted placement
        timeout-minutes: 1
        continue-on-error: true
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          sparse-checkout: scripts/ci
          persist-credentials: false

      # Why: docs/ci/cmux-next-workflow-notes.md#note-129
      - name: Drop stale submodule checkouts (self-hosted reused workspace)
        continue-on-error: true
        run: if [ -x scripts/ci/reset-stale-submodules.sh ]; then scripts/ci/reset-stale-submodules.sh; fi

      # Why: docs/ci/cmux-next-workflow-notes.md#note-130
      - name: Place the portable jobs
        id: place
        continue-on-error: true
        timeout-minutes: 2
        env:
          CI_RUNNER_STATE: ${{ vars.CI_RUNNER_STATE }}
          JOBS: checks path_route
          # Why: docs/ci/cmux-next-workflow-notes.md#note-131
          FLEET_LINUX: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || vars.LINUX_RUNNER }}
          REQUIRE_LIVE_CAPACITY: '1'
          SIDE_LABEL: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || vars.CI_PR_POOL_OWNED == '1' && vars.CI_SIDE_LANE_RUNNER || '' }}
          SNAPSHOT_TOKEN: ${{ github.token }}
        run: |
          # A base branch that predates the script places nothing: every job keeps its Blacksmith route.
          if [ ! -f scripts/ci/portable_job_placement.py ]; then
            echo "portable placement: the trusted base predates scripts/ci/portable_job_placement.py"
            exit 0
          fi
          python3 scripts/ci/portable_job_placement.py

  checks:
    # Why: docs/ci/cmux-next-workflow-notes.md#note-26
    needs: [portable-placement]
    if: ${{ !cancelled() && inputs.dev_daily != true && inputs.base_tier != true && inputs.same_tree_sha == '' }}
    name: cmux-next checks (god files, concurrency, crash safety, l10n)
    # Fleet Linux, then a free mini (portable-placement), then Blacksmith 16 vCPU. The slow checks run
    # concurrently, one per CPU ("Start the slow checks in the background", scripts/ci/run-checks-concurrently.sh). While the overflow
    # switch has failed over it takes 8 vCPU, not 32 (.github/runners.json linux_sizes), hence 15 minutes.
    # The checks are Python and bash; none needs Linux.
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || needs.portable-placement.outputs.placed_attempt == format('{0}', github.run_attempt) && contains(needs.portable-placement.outputs.linux_jobs, ' checks ') && needs.portable-placement.outputs.linux_runner || needs.portable-placement.outputs.placed_attempt == format('{0}', github.run_attempt) && contains(needs.portable-placement.outputs.mini_jobs, ' checks ') && needs.portable-placement.outputs.mini_runner || vars.CI_CLOUD_OVERFLOW_SAVED && (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-8vcpu-ubuntu-2404' || fromJSON(vars.RUNNER_POOLS).linux_8) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-16vcpu-ubuntu-2404' || fromJSON(vars.RUNNER_POOLS).linux_16) }}
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      checks: read
    # Why: docs/ci/cmux-next-workflow-notes.md#note-2
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          # Why: docs/ci/cmux-next-workflow-notes.md#note-132
          fetch-depth: 2

      # Why: docs/ci/cmux-next-workflow-notes.md#note-133
      - name: Drop stale submodule checkouts (self-hosted reused workspace)
        run: scripts/ci/reset-stale-submodules.sh

      # Why: docs/ci/cmux-next-workflow-notes.md#note-27
      - name: Start the slow checks in the background
        run: |
          scripts/ci/run-checks-concurrently.sh --start "$RUNNER_TEMP/background-checks" --jobs "$(getconf _NPROCESSORS_ONLN)" <<'CHECKS'
            [no-process-scan]
            python3 -I scripts/cmux-next/check-no-process-scan.py "$GITHUB_WORKSPACE"
            [state-roots]
            bash scripts/cmux-next/check-state-roots.sh "$GITHUB_WORKSPACE"
            [concurrency]
            scripts/cmux-next/check-concurrency.sh "$GITHUB_WORKSPACE/Packages/macOS/CmuxNext"
            [overlay-glass]
            python3 -I scripts/cmux-next/check-overlay-glass.py "$GITHUB_WORKSPACE"
            [checks-structure]
            python3 tests/test_cmux_next_checks_workflow.py
            [script-tests]
            bash scripts/cmux-next/tests/pin-cmux-tui-run-check.test.sh
            bash scripts/cmux-next/tests/pin-cmux-tui-probe.test.sh
            [package-dependency-lists]
            python3 scripts/cmux-next/check-package-dependency-lists.py
            python3 scripts/cmux-next/tests/test_check_package_dependency_lists.py
            [tier-routing]
            python3 tests/test_cmux_next_route.py
            python3 tests/test_cmux_next_base_tier.py
            python3 tests/test_ci_target_graph.py
            python3 tests/test_ci_swiftpm_build_metrics.py
            python3 tests/test_cmux_next_route_replay.py
            python3 tests/test_ci_cmux_next_compile_revert.py
            python3 tests/test_ci_cmux_next_compile_status.py
            [package-conventions]
            ./scripts/lint-ios-package-conventions.sh
            [checks-structure]
            python3 tests/test_cmux_next_generated_fold.py
            python3 tests/test_cmux_next_pr_autofix_push_gate.py
            python3 tests/test_run_checks_concurrently.py
            python3 tests/test_cmux_next_release_build_retention.py
            python3 tests/test_cmux_next_dev_release_host_root.py
            python3 tests/test_cmux_next_hybrid_ref_capture.py
            python3 tests/test_cmux_next_dev_release_import_out.py
            python3 tests/test_xcode_build_timeline.py
            python3 tests/test_cmux_next_dev_landing_workflow.py
            python3 tests/test_dev_landing_place.py
            python3 tests/test_cmux_next_dev_cas_seed.py
            python3 tests/test_cmux_next_dev_daily_tree_wait.py
            [script-tests]
            bash scripts/cmux-next/tests/pin-cmux-tui-run-fetch.test.sh
            bash scripts/cmux-next/tests/nightly-tree-at-install.test.sh
            bash scripts/cmux-next/tests/fake-clock.test.sh
            bash scripts/cmux-next/tests/preview.test.sh
            python3 tests/test_intent_familiar_warning.py
            python3 tests/test_ci_launch_budget_gate.py
            python3 tests/test_strings_output_encoding.py
            bash tests/test_strip_release_bundle.sh
            # The pre-push gate refuses a push that adds a violation and names the commit in CI.
            python3 tests/test_cmux_next_prepush_gate.py
            # UI font: the system font everywhere, no Inter default (check-ui-font.py).
            python3 tests/test_ui_font.py
            # The perf gate skips its per-frame timings on a window that draws no frames (--frames auto).
            python3 tests/test_cmux_next_perf_gate_unlit.py
            # A base merge pushed while the PR's CI runs gets a warning (scripts/ci/base_merge_warning.py).
            python3 tests/test_base_merge_warning.py
            # A changed input, workflow file or toolchain never reuses a pass (CI_NEXT_JOB_REUSE).
            python3 tests/test_job_input_fingerprint.py
            # Only a pass from this repository's own runs is reused, never a fork's (scripts/ci/job_reuse.py).
            python3 tests/test_job_reuse.py
            python3 tests/test_rebuild_mirror.py
