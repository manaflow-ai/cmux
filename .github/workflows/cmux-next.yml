          fi
          # Why: 2026-11-24-app-compile-fleet-3.md
          word="$(python3 "$reader" --sha "$REF" --repo "$GITHUB_REPOSITORY" --pr "$PR" --phase app-debug \
            --wait 2400 --no-record 300 2>"$RUNNER_TEMP/fleet-result.err")" || word=none
          why=""
