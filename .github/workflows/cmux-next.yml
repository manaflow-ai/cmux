            CMUX_NEXT_CONFIGURATION=Release
            CMUX_NEXT_PRODUCT_NAME=cmux NEXT DEV
            CMUX_NEXT_BUNDLE_ID=com.cmuxterm.app.debug.next
            CMUX_NEXT_CODE_SIGN_ENTITLEMENTS=cmux.next-dev.entitlements
            CMUX_NEXT_AUTH_CALLBACK_SCHEME=cmux-next-dev
            CMUX_NEXT_TUI_MODE=tree
            CMUX_NEXT_BROWSER_DATA_IMPORT=full
            CMUX_NEXT_SWIFT_COMPILATION_MODE=${{ vars.CMUX_NEXT_DEV_SWIFT_COMPILATION_MODE || 'auto' }}
        run: |
          set -euo pipefail
          # This step runs early in the job (before the lookup's waits): the capture step's fallback
          # for the job's start when its own jobs read fails (a rate limit that outlasts this lookup).
          echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"
          if [[ "$CMUX_NEXT_RUNNER" != glaeda-* ]]; then echo "capture=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          key="$(python3 -I scripts/cmux-next/hybrid_ref_capture.py key .)"
          # Readable complete captures of the key (unexpired, under 13 days old: the store keeps the
          # packs 14 days). A rate limit is waited out; a lookup that still fails captures anyway and
          # fails this step, so the run shows it (40428066457 lost its capture to a silent rate limit).
          # compile=true skips the product reuse so there is a build to capture, unless a capture of
          # this key came out incomplete in the last day (then only a build that compiles anyway
          # captures, and a key that never captures whole cannot turn reuse off for every landing).
          if have="$(python3 -I scripts/cmux-next/hybrid_ref_capture.py have --key "$key" --repo "$GITHUB_REPOSITORY" --budget 600)"; then
            complete="$(sed -n 's/^complete=//p' <<< "$have")" incomplete="$(sed -n 's/^recent_incomplete=//p' <<< "$have")"
            capture=false compile=false
            [[ "$complete" == 0 ]] && capture=true
            [[ "$capture" == true && "$incomplete" == 0 ]] && compile=true
            echo "REF key $key: readable complete captures $complete, incomplete today $incomplete, capture $capture, compile $compile"
            printf 'key=%s\ncapture=%s\ncompile=%s\n' "$key" "$capture" "$compile" >> "$GITHUB_OUTPUT"
            exit 0
