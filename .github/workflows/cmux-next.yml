  # Why: note-326
  crash-ends-app:
    needs: [cmux-scheme-compile]
    if: ${{ !cancelled() && (inputs.dev_daily != true && needs.cmux-scheme-compile.result != 'skipped') && !(github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'feat-cmux-next' && (github.event.action == 'labeled' || github.event.action == 'unlabeled') && !contains(fromJSON('["full-ci","ready-to-land"]'), github.event.label.name)) }}
    name: cmux-next crash ends the app
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && (vars.CI_FORK_LINUX_RUNNER || 'ubuntu-24.04') || 'cmux-linux' }}
    timeout-minutes: 3
    permissions: {}
    steps:
      - name: Read the crash gate result
        env:
          OUTCOME: ${{ needs.cmux-scheme-compile.outputs.crash_gate }}
          COMPILE: ${{ needs.cmux-scheme-compile.result }}
        run: |
          superseded_push() {  # scripts/ci/needs_verdict.py SUPERSEDED_RULE, copied verbatim (tests/test_needs_verdict.py)
            local what=$1 head bound=()
            [[ "${GITHUB_EVENT_NAME:-}" == push && -n "${GITHUB_SHA:-}" && -n "${GITHUB_REF:-}" ]] || return 1
            if command -v timeout >/dev/null; then bound=(timeout 20); fi  # a Mac runner may have none
            head="$(${bound[@]+"${bound[@]}"} git -c http.lowSpeedLimit=1 -c http.lowSpeedTime=15 ls-remote \
              "${GITHUB_SERVER_URL:-https://github.com}/${GITHUB_REPOSITORY:-}.git" "$GITHUB_REF" 2>/dev/null \
              | awk 'NR==1{print $1}')" || head=""
            [[ -n "$head" && "$head" != "$GITHUB_SHA" ]] || return 1
            echo "::notice title=$what: superseded::not judged at $GITHUB_SHA: a newer push ($head) replaced its waiting job, and that push's run carries the verdict"
          }
          case "$OUTCOME" in
            success) echo "crash gate: every deliberate crash ended the app in time" ;;
            failure) echo "::error::crash gate: red; the cause (a crash froze the app, or no app to test) is in the cmux-scheme-compile log, step Crash ends the app"; exit 1 ;;
            *)
              if [[ "$COMPILE" == success ]]; then
                echo "::error::crash gate: the scheme compile succeeded but the gate step did not run (outcome '${OUTCOME:-none}')"; exit 1
              fi
              if [[ $COMPILE == cancelled ]] && superseded_push "crash gate"; then exit 0; fi
              [[ $COMPILE == failure ]] || { echo "::error::no verdict: crash gate: compile ${COMPILE:-none}"; exit 3; }
              echo "crash gate: not run, the scheme compile ended $COMPILE before it" ;;
          esac

