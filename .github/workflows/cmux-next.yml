        run: ../../../scripts/cmux-next/judge-action-exports.sh "$PWD"

      # Why: note-446

      # Why: note-62
      - name: Check the settings exports
        id: settings
        if: ${{ steps.reuse.outputs.hit != 'true' }}
        continue-on-error: true
        env:
          CMUX_NEXT_JOB_BUILT: plain
        working-directory: ${{ steps.spm-root.outputs.root || github.workspace }}
        run: scripts/cmux-next/check-settings-exports.sh

      # Why: note-380
      - name: Pack the exports for the base autofix
        id: base-exports
        if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/feat-cmux-next' && steps.reuse.outputs.hit != 'true' && format('{0}', vars.CMUX_NEXT_BASE_EXPORTS_PACK) != '0' }}
        continue-on-error: true
        timeout-minutes: 10
        env:
          CMUX_STRINGS_BEST_EFFORT: "1"
          CMUX_NEXT_JOB_BUILT: plain
        working-directory: ${{ steps.spm-root.outputs.root || github.workspace }}
        run: |
          set -euo pipefail
          # Why: 2026-11-24-daemon-test-1.md
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]] && [[ "$(python3 -I -c 'import json, os; print(str((json.load(open(os.environ["GITHUB_EVENT_PATH"])).get("inputs") or {}).get("base_tier", "")).lower())')" != true ]]; then
            echo "not a base tier dispatch: no pack"
            exit 0
          fi
          scripts/cmux-next/base-autofix-exports-pack.sh "$RUNNER_TEMP/base-exports" | tee -a "$GITHUB_OUTPUT"

      - name: Upload the exports for the base autofix
        if: ${{ steps.reuse.outputs.hit != 'true' && steps.base-exports.outcome == 'success' && steps.base-exports.outputs.name != '' }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.base-exports.outputs.name }}
          path: ${{ runner.temp }}/base-exports
          if-no-files-found: error
          retention-days: 1

      # Why: note-516
      - name: Pack the exports for the PR autofix
        id: pr-exports
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && steps.reuse.outputs.hit != 'true' && format('{0}', vars.CMUX_NEXT_PR_EXPORTS_PACK) != '0' }}
        continue-on-error: true
        timeout-minutes: 10
        env:
          CMUX_STRINGS_BEST_EFFORT: "1"
          CMUX_NEXT_JOB_BUILT: plain
        working-directory: ${{ steps.spm-root.outputs.root || github.workspace }}
        run: |
          set -euo pipefail
          # Why: note-544
          base="$RUNNER_TEMP/pr-autofix-base"
          rm -rf "$base" && mkdir -p "$base"
          git archive HEAD^1 scripts/cmux-next | tar -x -C "$base"
          pack="$base/scripts/cmux-next/base-autofix-exports-pack.sh"
          if ! grep -q -- '--pr' "$pack"; then echo "the base's pack script makes no PR pack yet"; exit 0; fi
          if git log -1 --format=%B HEAD^2 | grep -q '^Autofix-Run: '; then echo "an autofix head: the PR autofix wants no exports"; exit 0; fi
          areas="$(git diff --no-renames --name-only HEAD^1 HEAD | "$base/scripts/cmux-next/autofix-areas.sh")"
          if ! grep -qE '^(actions|settings)=true$' <<<"$areas"; then
            echo "no action or settings inputs changed: the PR autofix wants no exports"
            exit 0
          fi
          "$pack" "$RUNNER_TEMP/pr-exports" --pr | tee -a "$GITHUB_OUTPUT"

      - name: Upload the exports for the PR autofix
        if: ${{ steps.reuse.outputs.hit != 'true' && steps.pr-exports.outcome == 'success' && steps.pr-exports.outputs.name != '' }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.pr-exports.outputs.name }}
          path: ${{ runner.temp }}/pr-exports
          if-no-files-found: error
          retention-days: 1
          overwrite: true

      # Why: note-277
      - name: Regenerate stale files
        id: regenerate
        if: ${{ (steps.actions.outcome == 'failure' || steps.settings.outcome == 'failure') && steps.reuse.outputs.hit != 'true' }}
        working-directory: ${{ steps.spm-root.outputs.root || github.workspace }}
        run: |
          set -euo pipefail
          if [[ "${{ steps.actions.outcome }}" == failure ]]; then
            scripts/cmux-next/regenerate-action-contracts.sh
          fi
          # Why: note-454
          python3 scripts/ci/defaults_guard.py snapshot
          # Why: 2026-11-24-swift-test-13.md
          out="$RUNNER_TEMP/generated/files"
          mkdir -p "$out"
          generated=('plans/cmux-next/*.json' 'plans/cmux-next/*.md'
            schemas/settings/settings-schema.json 'docs/mdm/*' schemas/defaults/cmux-next.json)
          git add -N -- "${generated[@]}"
          git diff --name-only -- "${generated[@]}" > "$RUNNER_TEMP/generated/paths.txt"
          git diff --stat
          while IFS= read -r path; do
            mkdir -p "$out/$(dirname "$path")"
            cp "$path" "$out/$path"
          done < "$RUNNER_TEMP/generated/paths.txt"
          cp "$RUNNER_TEMP/generated/paths.txt" "$out/.paths"
          if [[ -s "$RUNNER_TEMP/generated/paths.txt" ]]; then
            echo "patch=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload the regenerated files
        if: ${{ (steps.regenerate.outputs.patch == 'true') && steps.reuse.outputs.hit != 'true' }}
