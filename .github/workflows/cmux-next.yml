      ffi_repin: ${{ steps.route.outputs.ffi_repin }}
      # Why: note-502
      fast_tier_cargo: ${{ steps.route.outputs.fast_tier_cargo }}
      # Why: 2026-11-24-path_route-1.md
      base_red_jobs: ${{ steps.base-red.outputs.red_jobs || '[]' }}
      scheme: ${{ steps.route.outputs.scheme }}
      generated: ${{ steps.route.outputs.generated }}
