        id: web-bundle-artifact
        if: ${{ ((steps.web-bundle-r2.outputs.cache-hit != 'true' && steps.web-bundle-cache.outputs.cache-hit != 'true') && steps.reuse.outputs.hit != 'true') && needs.web-bundles.result == 'success' }}
        continue-on-error: true
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: cmux-next-web-bundles-${{ steps.web-bundle-key.outputs.key }}
          path: web-bundles-out

      - name: Install the restored web bundles
        if: ${{ (steps.web-bundle-r2.outputs.cache-hit == 'true' || steps.web-bundle-cache.outputs.cache-hit == 'true' || steps.web-bundle-artifact.outcome == 'success') && steps.reuse.outputs.hit != 'true' }}
        run: scripts/cmux-next/build-web-bundles.sh --from web-bundles-out

      - name: Build the web bundles
        if: ${{ (steps.web-bundle-r2.outputs.cache-hit != 'true' && steps.web-bundle-cache.outputs.cache-hit != 'true' && steps.web-bundle-artifact.outcome != 'success') && steps.reuse.outputs.hit != 'true' }}
        run: scripts/cmux-next/build-web-bundles.sh

      - name: Build package and tests
        if: ${{ steps.reuse.outputs.hit != 'true' }}
        working-directory: Packages/macOS/CmuxNext
        env:
          CMUX_METRICS_WEB_CACHE_OUTCOME: ${{ steps.web-bundle-cache.outcome }}
          CMUX_METRICS_WEB_CACHE_HIT: ${{ steps.web-bundle-r2.outputs.cache-hit == 'true' && 'true' || steps.web-bundle-cache.outputs.cache-hit }}
        run: python3 ../../../scripts/ci/swiftpm_build_metrics.py --role generated-files --output-dir "$RUNNER_TEMP/cmux-next-build-metrics" -- swift build --build-tests

      - name: Upload the test build measurement and log
        continue-on-error: true
        if: ${{ (always()) && steps.reuse.outputs.hit != 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-next-build-metrics-generated-files-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cmux-next-build-metrics
          if-no-files-found: ignore
          retention-days: 3

      - name: Check generated action catalog, surfaces and inventory
        if: ${{ steps.reuse.outputs.hit != 'true' }}
        id: actions
        continue-on-error: true
        working-directory: Packages/macOS/CmuxNext
        env:
          CMUX_ACTION_SURFACES_SKIP_BUILD: "1"
        run: ../../../scripts/cmux-next/judge-action-exports.sh "$PWD"

      # The CI target graph is bot-only (scripts/cmux-next/generated_outputs.py,
      # #21946): it is stale on every event between a merge that adds a target
      # and the base autofix's commit, so no event checks it here.

      # Why: docs/ci/cmux-next-workflow-notes.md#note-62
      - name: Check the settings exports
        id: settings
        if: ${{ steps.reuse.outputs.hit != 'true' }}
        continue-on-error: true
        run: scripts/cmux-next/check-settings-exports.sh

      # The base autofix's action and settings exports, made on this build instead of a second Mac
      # build of the same push (cmuxterm-hq#5424): every export regenerated, packed under this commit's
      # tree (scripts/cmux-next/base_autofix_pushed_exports.py), and uploaded for
      # cmux-next-base-autofix.yml's pushed-exports job. Pushes of feat-cmux-next and its base tier
      # dispatches (cmux-next-base-tier-kick.yml, which these checks move to) only, so a pack is only
      # ever this repository's merged code. It puts the checkout's exports back as they were, so
      # the steps below see what the checks left; a failure makes no pack (the autofix's Mac job then
      # regenerates them) and never fails this job. vars.CMUX_NEXT_BASE_EXPORTS_PACK=0 turns it off.
      - name: Pack the exports for the base autofix
        id: base-exports
        if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/feat-cmux-next' && steps.reuse.outputs.hit != 'true' && format('{0}', vars.CMUX_NEXT_BASE_EXPORTS_PACK) != '0' }}
