          echo "ACPMUX_SOCKET=" >> "$GITHUB_ENV"

      - name: Clear stale git locks (self-hosted reused workspace)
        shell: bash
        run: |
          ws="${GITHUB_WORKSPACE:-$PWD}"
          rm -f "$ws/.git/index.lock" 2>/dev/null || true

      - name: Checkout
        id: checkout
        continue-on-error: true
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          # The package graph reads no submodule; GhosttyNextKit comes from
          # SwiftPM (Packages/Shared/CmuxGhosttyKit).
          submodules: false
          fetch-depth: 2

      # Why: docs/ci/cmux-next-workflow-notes.md#note-268
      - name: Discard the workspace repository after a failed checkout
        if: steps.checkout.outcome == 'failure'
        run: rm -rf "$GITHUB_WORKSPACE/.git"

      - name: Retry checkout after transient network failure
        if: steps.checkout.outcome == 'failure'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          # The package graph reads no submodule; GhosttyNextKit comes from
          # SwiftPM (Packages/Shared/CmuxGhosttyKit).
          submodules: false
          fetch-depth: 2

      # Why: docs/ci/cmux-next-workflow-notes.md#note-269
      - name: Drop stale submodule checkouts (self-hosted reused workspace)
        run: scripts/ci/reset-stale-submodules.sh

      # Why: docs/ci/cmux-next-workflow-notes.md#note-60
      - name: Require the GUI session on a mini
        if: ${{ startsWith(env.CMUX_NEXT_RUNNER, 'glaeda-') && github.event_name != 'pull_request' }}
