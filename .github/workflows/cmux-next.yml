              echo "::error::$HOST ($HOST_RESULT) gave no generated files verdict: its package build failed or it stopped before the checks. Fix or re-run $HOST."
              exit 1 ;;
          esac

  # Why: 2026-11-24-generated-verdict-1.md, note-280
  release-compile-fast:
    needs: [path_route, push-head-preflight, macos-placement, compile-status, pure-checks-coalesce]
    # Why: note-64
    if: ${{ !cancelled() && needs.pure-checks-coalesce.outputs.run != 'false' && (needs.path_route.outputs.native == 'true' && needs.push-head-preflight.outputs.current == 'true' && github.repository_owner == 'manaflow-ai' && github.event_name == 'push' && github.ref == 'refs/heads/feat-cmux-next') && !(github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'feat-cmux-next' && (github.event.action == 'labeled' || github.event.action == 'unlabeled') && !contains(fromJSON('["full-ci","ready-to-land"]'), github.event.label.name)) }}
    name: cmux-next Release compile (fleet fast check)
    concurrency:
      group: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'feat-cmux-next' && (github.event.action == 'labeled' || github.event.action == 'unlabeled') && !contains(fromJSON('["full-ci","ready-to-land"]'), github.event.label.name) && format('-label-{0}', github.run_id) || format('cmux-next-release-compile-fast-{0}', github.run_id) }}
      cancel-in-progress: false
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || !(needs.compile-status.result == 'success' && needs.compile-status.outputs.handoff == '') && needs.macos-placement.outputs.gateway_attempt == format('{0}', github.run_attempt) && needs.macos-placement.outputs.gateway_runner != '' && needs.macos-placement.outputs.gateway_runner || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && (vars.CI_FORK_LINUX_RUNNER || 'ubuntu-24.04') || 'cmux-linux' }}
    permissions:
      contents: read
    timeout-minutes: 45  # up to 16 min reading the tip check, then the compile it had before
    outputs:
      verdict: ${{ steps.compile.outputs.verdict }}
    steps:
      # Why: one compile per head. The tip check already compiles this head on the fleet; read its verdict
      # Why: 2026-11-24-swift-canary-fleet-1.md
      - name: Check out the fleet compile reader
        timeout-minutes: 1
        continue-on-error: true
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          sparse-checkout: scripts/ci
          persist-credentials: false

      # Why: note-281
      - name: Run the fast fleet compile check
        id: compile
        continue-on-error: true
        env:
          REF: ${{ github.sha }}
          REPO: ${{ github.repository }}
          # Why: note-282
          GATEWAY: ${{ !(needs.compile-status.result == 'success' && needs.compile-status.outputs.handoff == '') && needs.macos-placement.outputs.gateway_attempt == format('{0}', github.run_attempt) && needs.macos-placement.outputs.gateway_runner || '' }}
          # Why: note-283
          RESULTS: https://gh-events.cmux.com/compile-checks/v1
          # Why: note-64 (none: compile-status already waited 40 min for nothing)
          SEEN: ${{ needs.compile-status.outputs.state }}
          # Why: note-554 (undo: vars.CMUX_NEXT_SUPERSEDED_COMPILE_GATE = '0')
          SUPERSEDED_GATE: ${{ vars.CMUX_NEXT_SUPERSEDED_COMPILE_GATE || '1' }}
        run: |
          set -uo pipefail
          # Why: note-482
          if [[ -z "$GATEWAY" ]]; then
            [[ "$REF" =~ ^[0-9a-f]{40}$ ]] || { echo "verdict=unavailable" >> "$GITHUB_OUTPUT"; exit 0; }
            reply="$RUNNER_TEMP/compile-check.json"
            deadline=$((SECONDS + ${WAIT_SECONDS:-1200}))
            [[ "${SEEN:-}" != none ]] || deadline=$SECONDS  # no second wait: the Mac fallback starts now
            state="" reads=0 last="" ok_at=$SECONDS  # ok_at: the last usable answer (200 or 404), from before the first read
            # Why: note-457
            for probe in 1 2; do
              code="$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 10 --max-time 20 \
                "$RESULTS/$REF?repo=${REPO/\//%2F}&wait=1" 2>/dev/null)" || true
              [[ "${code:=000}" =~ ^(000|52[0-9]|530)$ ]] || { [[ "$code" =~ ^(200|404)$ ]] && ok_at=$SECONDS; break; }
              (( probe == 2 )) && { state="results service down (HTTP $code)"; deadline=$SECONDS; } || sleep "${PROBE_GAP:-30}"
            done
            # Why: note-82 (compile-status: the results service down)
            while [[ "$state" != "results service down"* ]]; do
              # Why: note-517
              end=$(( deadline < ok_at + ${BAD_BOUND:-300} ? deadline : ok_at + ${BAD_BOUND:-300} ))
              left=$((end - SECONDS))
              (( left > 1 )) || break
              wait=$(( left > 60 ? left - 30 : left / 2 )); wait=$(( wait < 1800 ? wait : 1800 ))
              code="$(timeout "$left" curl -sS -o "$reply" -w '%{http_code}' --connect-timeout 10 \
                --max-time "$left" "$RESULTS/$REF?repo=${REPO/\//%2F}&wait=$wait")" || true
              case "${code:=000}" in
                200) reads=$((reads + 1)) ok_at=$SECONDS last=""
                  state="$(jq -r --arg sha "$REF" --arg repo "$REPO" '
                    if .sha != $sha or .repo != $repo or .recipe_version != 2 or .configuration != "release-onone"
                    then "mismatch" else (.state // "") end' "$reply" 2>/dev/null || echo unreadable)"
                  echo "read $reads: $state"
                  case "$state" in pass|fail|unavailable|mismatch|unreadable|superseded) break ;; esac ;;
                404) ok_at=$SECONDS last=""; echo "no fleet result for $REF yet" ;;
                *) last="HTTP $code" ;;
              esac
              gap=$(( end - SECONDS < ${READ_GAP:-30} ? end - SECONDS : ${READ_GAP:-30} ))
              (( gap <= 0 )) || sleep "$gap"
            done
            [[ "$state" == "results service down"* || -z "$last" ]] || state="results service down ($last for $((SECONDS - ok_at)) s)"
            # Why: note-554
            if [[ "$state" == superseded ]]; then
              head=""
              if [[ "${SUPERSEDED_GATE:-1}" != 0 ]]; then
                head="$(timeout 30 git -c http.lowSpeedLimit=1000 -c http.lowSpeedTime=15 ls-remote \
                  "${GITHUB_SERVER_URL:-https://github.com}/$REPO.git" "${GITHUB_REF:-refs/heads/feat-cmux-next}" 2>/dev/null |
                  awk 'NR==1{print $1}')" || head=""
              fi
              if [[ "$head" =~ ^[0-9a-f]{40}$ && "$head" != "$REF" ]]; then
                echo "::notice title=Fast fleet compile check::superseded push $REF: the branch head is $head, whose tip check covers this push; no Mac fallback"
                echo "verdict=superseded" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
            case "$state" in
              pass) verdict=pass; echo "The build fleet compiled and linked the app at $REF in Release (-Onone) on Linux." ;;
              fail) verdict=fail; echo "::error title=Fast fleet compile check::the build fleet's Release compile failed at $REF; see cmux-next/compile's log: $(jq -r '.log_url // empty' "$reply" 2>/dev/null)" ;;
              *) verdict=unavailable; echo "::warning title=mac fallback::no fleet verdict for $REF (${state:-no result}); the Mac fallback will run." ;;
            esac
            echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
            [[ "$verdict" != fail ]]
