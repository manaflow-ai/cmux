name: merge freeze

# Freezes are open `merge-freeze` issues (docs/ci/merge-freeze.md). This shows them where people
# look: a `merge freeze` check on each pull request that touches a frozen path, and an hourly job
# that closes lapsed freezes with a comment so the open ones are the live ones.
#
# The check reflects the freezes when the pull request last changed. gh-merge-green reads the
# same issues again at merge time, so a freeze opened later still stops the merge.
#
# pull_request_target so fork pull requests are checked too. Nothing from the pull request is
# checked out or run: the checker comes from main and reads the file list and the pull request's
# label events through the API.

on:
  pull_request_target:
    branches: [main, feat-cmux-next]
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  # Temporary REST budget attribution until 2026-11-22 00:00 UTC: one gh-call line per GitHub API call
  # (scripts/ci/api_call_log/env.sh). GitHub runs this file from main, and it had no attribution.
  BASH_ENV: '$({ w="${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh"; t="${RUNNER_TEMP:-/nonexistent}/api-call-log-src"; if [ -f "$w" ]; then echo "$w"; elif [ -n "${RUNNER_TEMP:-}" ]; then if [ ! -f "$t/env.sh" ] && [ ! -e "$t.tried" ] && { [ "${RUNNER_OS:-}" = Linux ] || [ "${RUNNER_OS:-}" = macOS ]; } && [ "$(date -u +%Y%m%d%H)" -lt 2026112300 ]; then : > "$t.tried"; mkdir -p "$t.part" && for x in env.sh gh sitecustomize.py isolated.py; do curl -fsSL --max-time 5 -o "$t.part/$x" "https://raw.githubusercontent.com/manaflow-ai/cmux/27647ffd3ae838c63be28ca3e5883dcd68c34518/scripts/ci/api_call_log/$x" || break; done; [ -s "$t.part/isolated.py" ] && mv "$t.part" "$t"; fi; if [ -f "$t/env.sh" ]; then echo "$t/env.sh"; else echo unset BASH_ENV > "$t.off.sh" && echo "$t.off.sh"; fi; fi; } 2>/dev/null)'

jobs:
  check:
    # A draft cannot merge; it is checked when marked ready (ready_for_review
    # above). Mergers read the freezes again at merge time either way.
    # A fix-cause:* label on a closed pull request starts no job (tests/test_ci_fix_cause_labels_start_no_jobs.py).
    if: github.event_name == 'pull_request_target' && !github.event.pull_request.draft && !(github.event.pull_request.state == 'closed' && (github.event.action == 'labeled' || github.event.action == 'unlabeled') && startsWith(github.event.label.name, 'fix-cause:'))
    name: merge freeze
    concurrency:
      group: merge-freeze-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.CI_PR_CONTROL_SKIP_FLEET != '1' && 'cmux-gcp-pr-control-jit-x64' || contains(fromJSON('["blacksmith-2vcpu-ubuntu-2404","blacksmith-4vcpu-ubuntu-2404","blacksmith-8vcpu-ubuntu-2404","cmux-gcp-secret-jit-x64"]'), vars.CI_TRUSTED_RUNNER) && vars.CI_TRUSTED_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }} # ephemeral-required: pull_request_target with a read token; CI_TRUSTED_RUNNER picks the Blacksmith size
    timeout-minutes: 20
    permissions:
      contents: read
      issues: read
      pull-requests: read
    env:
      # A scheduled job's GitHub API waits stop here and fail loud (scripts/ci/gh_budget_wait.sh).
      GH_BUDGET_WAIT_MAX_SECONDS: "900"
    steps:
      # This commit's GitHub API wait (scripts/ci/gh_budget_wait.sh): every later gh call, and
      # each github-script step that installs gh_budget_wait.cjs, waits through a rate limit or a
      # GitHub 5xx under the job's GH_BUDGET_WAIT_MAX_SECONDS, then fails loud.
      - name: Checkout the GitHub API wait
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: .gh-budget-tooling
          sparse-checkout: |
            scripts/ci/gh_budget_wait.sh
            scripts/ci/gh_budget_wait.cjs
          sparse-checkout-cone-mode: false
      - name: Wait through GitHub API rate limits and 5xx in this job
        working-directory: ${{ github.workspace }}
        run: bash .gh-budget-tooling/scripts/ci/gh_budget_wait.sh --install

      - name: Checkout the checker from main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: |
            scripts/ci/merge_freeze.py
            scripts/ci/api_call_log
          sparse-checkout-cone-mode: false
      # The manaflow-glaeda-route App's token, so these reads draw on the App's own budget
      # rather than the GITHUB_TOKEN budget every workflow shares (it ran out on 2026-10-21).
      # A failed mint leaves GITHUB_TOKEN, which the checker also falls back to on a refusal.
      - name: Mint the cmux-bot read token (even runs)
        # Even run ids read on cmux-bot's installation budget, odd ones on
        # manaflow-glaeda-route's, so per-PR reads stop draining the build
        # controller's routing App (5067688 read 0 remaining at 02:17Z and
        # 10:32Z on 2026-11-25 with the controller itself at 234 calls/h).
        id: glaeda-token-bot
        if: (vars.CMUX_BOT_APP_ID != '') && vars.CMUX_BOT_APP_ID != '' && (endsWith(format('{0}', github.run_id), '0') || endsWith(format('{0}', github.run_id), '2') || endsWith(format('{0}', github.run_id), '4') || endsWith(format('{0}', github.run_id), '6') || endsWith(format('{0}', github.run_id), '8'))
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.CMUX_BOT_APP_ID }}
          private-key: ${{ secrets.CMUX_BOT_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: read
          permission-issues: read
          permission-pull-requests: read
          skip-token-revoke: true

      - name: Mint the glaeda-route token
        id: glaeda-token
        if: (vars.GLAEDA_ROUTE_APP_ID != '') && steps.glaeda-token-bot.outputs.token == ''
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.GLAEDA_ROUTE_APP_ID }}
          private-key: ${{ secrets.GLAEDA_ROUTE_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: read
          permission-issues: read
          permission-pull-requests: read
          skip-token-revoke: true
      # The glaeda-route App installation's budget around the reads below (a free
      # rate_limit read): the installation is shared, so the delta between `before`
      # and `after` is this step's reads plus whatever else ran meanwhile.
      - name: Log the glaeda-route App budget before
        if: ${{ (steps.glaeda-token.outputs.token) != '' }}
        continue-on-error: true
        timeout-minutes: 1
        env:
          GH_TOKEN: ${{ steps.glaeda-token.outputs.token }}
          PROBE: ${{ github.workflow }}/check/before
        run: >-
          gh api rate_limit --jq
          '"app-budget \(env.PROBE) used=\(.resources.core.used) reset=\(.resources.core.reset) at=\(now | floor)"'

      - name: Check the pull request against open freezes
        env:
          GH_TOKEN: ${{ (steps.glaeda-token-bot.outputs.token || steps.glaeda-token.outputs.token) || github.token }}
          GH_FALLBACK_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.ref }}
          # The event's count, so the pull request is not read again to check the file list.
          CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
        # Exit 3: GitHub's rate limit refused the read, and again two minutes later. That says
        # nothing about this pull request, so it is a warning, not a red that holds it; the
        # merge paths (gh-merge-green, next-autoland) read the freezes again and refuse until
        # they can.
        run: |
          args=(check --repo "$REPO" --pr "$NUMBER" --base "$BASE" --rate-limit-retry 120)
          if [ -n "$CHANGED_FILES" ]; then
            args+=(--changed-files "$CHANGED_FILES")
          fi
          status=0
          python3 scripts/ci/merge_freeze.py "${args[@]}" || status=$?
          if [ "$status" -eq 3 ]; then
            note="Could not check merge freezes: GitHub's rate limit refused the read twice. gh-merge-green and next-autoland read the freezes again before merging."
            echo "::warning title=merge freeze not checked::$note"
            printf '### merge freeze: not checked\n\n%s\n' "$note" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          exit "$status"

      - name: Log the glaeda-route App budget after
        if: ${{ !cancelled() && (steps.glaeda-token.outputs.token) != '' }}
        continue-on-error: true
        timeout-minutes: 1
        env:
          GH_TOKEN: ${{ steps.glaeda-token.outputs.token }}
          PROBE: ${{ github.workflow }}/check/after
        run: >-
          gh api rate_limit --jq
          '"app-budget \(env.PROBE) used=\(.resources.core.used) reset=\(.resources.core.reset) at=\(now | floor)"'

  expire:
    if: github.event_name != 'pull_request_target'
    name: close lapsed freezes
    # One sweep at a time, at most one waiting: hourly runs never pile up after an outage
    # (tests/test_ci_cron_concurrency.py).
    concurrency:
      group: merge-freeze-expire
      cancel-in-progress: false
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.CI_PR_CONTROL_SKIP_FLEET != '1' && 'cmux-gcp-pr-control-jit-x64' || contains(fromJSON('["blacksmith-2vcpu-ubuntu-2404","blacksmith-4vcpu-ubuntu-2404","blacksmith-8vcpu-ubuntu-2404","cmux-gcp-secret-jit-x64"]'), vars.CI_TRUSTED_RUNNER) && vars.CI_TRUSTED_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }} # ephemeral-required: trusted issue-write token; CI_TRUSTED_RUNNER picks the Blacksmith size
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/ci/merge_freeze.py
            scripts/ci/api_call_log
          sparse-checkout-cone-mode: false
      # The manaflow-glaeda-route App's token, so these reads draw on the App's own budget
      # rather than the GITHUB_TOKEN budget every workflow shares (it ran out on 2026-10-21).
      # A failed mint leaves GITHUB_TOKEN, which the checker also falls back to on a refusal.
      - name: Mint the glaeda-route token
        id: glaeda-token
        if: vars.GLAEDA_ROUTE_APP_ID != ''
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.GLAEDA_ROUTE_APP_ID }}
          private-key: ${{ secrets.GLAEDA_ROUTE_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-issues: write
      - name: Close freezes past their deadline
        env:
          GH_TOKEN: ${{ steps.glaeda-token.outputs.token || github.token }}
          GH_FALLBACK_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python3 scripts/ci/merge_freeze.py expire --repo "$REPO"
          python3 scripts/ci/merge_freeze.py list --repo "$REPO" | tee -a "$GITHUB_STEP_SUMMARY"
