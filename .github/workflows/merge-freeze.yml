name: merge freeze

# Freezes are open `merge-freeze` issues (docs/ci/merge-freeze.md). This shows them where people
# look: a `merge freeze` check on each pull request that touches a frozen path, and an hourly job
# that closes lapsed freezes with a comment so the open ones are the live ones.
#
# The check reflects the freezes when the pull request last changed. gh-merge-green reads the
# same issues again at merge time, so a freeze opened later still stops the merge.
#
# pull_request_target so fork pull requests are checked too. Nothing from the pull request is
# checked out or run: the checker comes from main and reads the file list and the pull request's
# label events through the API.

on:
  pull_request_target:
    branches: [main, feat-cmux-next]
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  # Temporary REST budget attribution: one gh-call line per GitHub API call (scripts/ci/api_call_log/env.sh, fetched at a fixed commit when the checkout has no copy).
  BASH_ENV: '$({ w="${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh"; t="${RUNNER_TEMP:-/nonexistent}/api-call-log-src"; if [ -f "$w" ]; then echo "$w"; elif [ -n "${RUNNER_TEMP:-}" ]; then if [ ! -f "$t/env.sh" ] && [ ! -e "$t.tried" ] && { [ "${RUNNER_OS:-}" = Linux ] || [ "${RUNNER_OS:-}" = macOS ]; } && [ "$(date -u +%Y%m%d%H)" -lt 2026112300 ]; then : > "$t.tried"; mkdir -p "$t.part" && for x in env.sh gh sitecustomize.py isolated.py; do curl -fsSL --max-time 5 -o "$t.part/$x" "https://raw.githubusercontent.com/manaflow-ai/cmux/27647ffd3ae838c63be28ca3e5883dcd68c34518/scripts/ci/api_call_log/$x" || break; done; [ -s "$t.part/isolated.py" ] && mv "$t.part" "$t"; fi; if [ -f "$t/env.sh" ]; then echo "$t/env.sh"; else echo unset BASH_ENV > "$t.off.sh" && echo "$t.off.sh"; fi; fi; } 2>/dev/null)'

jobs:
  check:
    # Into feat-cmux-next, a label event the check does not read (anything but freeze-ok) skips the job
    # and takes a concurrency group of its own, so it never cancels a real check in flight
    # (tests/test_ci_label_events_skip_full_ci.py). Bots set and clear risk, hold and landing labels
    # on hundreds of open pull requests, and each of those events queued a runner for the same answer.
    if: ${{ (github.event_name == 'pull_request_target') && !(github.event_name == 'pull_request_target' && github.event.pull_request.base.ref == 'feat-cmux-next' && (github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name != 'freeze-ok') }}
    name: merge freeze
    concurrency:
      group: merge-freeze-${{ github.event.pull_request.number }}${{ github.event_name == 'pull_request_target' && github.event.pull_request.base.ref == 'feat-cmux-next' && (github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name != 'freeze-ok' && format('-label-{0}', github.run_id) || '' }}${{ startsWith(github.event_name, 'pull_request') && github.event.action == 'ready_for_review' && format('-ready-{0}', github.run_id) || '' }}
      cancel-in-progress: true
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.CI_PR_CONTROL_SKIP_FLEET != '1' && 'cmux-gcp-pr-control-jit-x64' || contains(fromJSON('["blacksmith-2vcpu-ubuntu-2404","blacksmith-4vcpu-ubuntu-2404"]'), vars.CI_TRUSTED_RUNNER) && vars.CI_TRUSTED_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }} # ephemeral-required: pull_request_target with a read token; CI_TRUSTED_RUNNER picks the Blacksmith size
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Checkout the checker from main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: |
            scripts/ci/merge_freeze.py
            .gitmodules
          sparse-checkout-cone-mode: false
      - name: Check the pull request against open freezes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.ref }}
        run: python3 scripts/ci/merge_freeze.py check --repo "$REPO" --pr "$NUMBER" --base "$BASE"

  expire:
    if: github.event_name != 'pull_request_target'
    name: close lapsed freezes
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.CI_PR_CONTROL_SKIP_FLEET != '1' && 'cmux-gcp-pr-control-jit-x64' || contains(fromJSON('["blacksmith-2vcpu-ubuntu-2404","blacksmith-4vcpu-ubuntu-2404"]'), vars.CI_TRUSTED_RUNNER) && vars.CI_TRUSTED_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }} # ephemeral-required: trusted issue-write token; CI_TRUSTED_RUNNER picks the Blacksmith size
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/ci/merge_freeze.py
            .gitmodules
          sparse-checkout-cone-mode: false
      - name: Close freezes past their deadline
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python3 scripts/ci/merge_freeze.py expire --repo "$REPO"
          python3 scripts/ci/merge_freeze.py list --repo "$REPO" | tee -a "$GITHUB_STEP_SUMMARY"
