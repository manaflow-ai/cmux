name: Notify IndexNow

on:
  deployment_status:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    name: Notify IndexNow
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'deployment_status' &&
       github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'Production – cmux')
    runs-on: ${{ vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 6
    steps:
      # Only public inputs are needed. Read the live sitemap, so a newer main
      # commit cannot cause us to submit URLs that have not been deployed yet.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.deployment.sha || github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - name: Submit changed URLs
        run: |
          bun -e '
            import { indexNowKey, indexNowEndpoint, indexNowLookbackHours } from "./web/app/lib/indexnow.ts";
            console.log(JSON.stringify({ key: indexNowKey, endpoint: indexNowEndpoint, lookbackHours: indexNowLookbackHours }));
          ' | python3 scripts/ci/notify-indexnow.py
