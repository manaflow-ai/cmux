name: Feed reply provider verification
run-name: Feed replies for ${{ inputs.tag }} from build ${{ inputs.build_run }}

on:
  workflow_dispatch:
    inputs:
      build_run:
        description: Successful reload-build run containing the tagged Mac app
        required: false
      tag:
        description: Tag used for that Mac app
        required: true
      full_text_only:
        description: Run focused full-text package tests without a Mac artifact
        type: boolean
        default: false
      test_ref:
        description: Optional exact commit for the full-text package tests
        required: false

permissions:
  contents: read
  actions: read

jobs:
  full-text:
    if: ${{ inputs.full_text_only }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || 'blacksmith-6vcpu-macos-26' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ inputs.test_ref || github.sha }}
          submodules: recursive
          persist-credentials: false
      - name: Select Xcode
        run: |
          set -euo pipefail
          ./scripts/select-ci-xcode.sh
      - name: Test retained text and UTF-8 pagination
        run: swift test --package-path Packages/macOS/CMUXAgentLaunch --filter WorkstreamFullTextTests
      - name: Test mobile reading and authorization
        run: |
          swift test --package-path Packages/iOS/CmuxMobileShell --filter MobileAgentFeedTerminalReplyTests
          swift test --package-path Packages/iOS/CmuxMobileRPC --filter MobileCoreRPCNotificationFeedAuthTests
          swift test --package-path Packages/iOS/CmuxMobileShellModel --filter MobileAgentFeedItemTests
  verify:
    if: ${{ !inputs.full_text_only }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || 'blacksmith-6vcpu-macos-26' }}
    timeout-minutes: 30
    env:
      BUILD_TAG: ${{ inputs.tag }}
      BUILD_RUN: ${{ inputs.build_run }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Select Xcode
        run: |
          set -euo pipefail
          ./scripts/select-ci-xcode.sh

      - name: Validate isolated target
        run: |
          [[ "$BUILD_TAG" =~ ^[a-z0-9]{1,6}$ ]]
          [[ "$BUILD_TAG" != "default" ]]
          [[ "$BUILD_RUN" =~ ^[0-9]+$ ]]
          [[ "$(uname -m)" == arm64 ]]
          mkdir -p "$GITHUB_WORKSPACE/reply-evidence" "$RUNNER_TEMP/reply-provider-tools"
          echo "ARTIFACTS=$GITHUB_WORKSPACE/reply-evidence" >> "$GITHUB_ENV"
          echo "PROVIDER_TOOLS=$RUNNER_TEMP/reply-provider-tools" >> "$GITHUB_ENV"
          echo "CMUX_SOCKET_PATH=/tmp/cmux-debug-$BUILD_TAG.sock" >> "$GITHUB_ENV"

      - name: Wait for the requested build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run watch "$BUILD_RUN" --repo "$GITHUB_REPOSITORY" --interval 15 --exit-status

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.build_run }}
          name: reload-${{ inputs.tag }}-macos
          path: downloaded-app

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22.18.0'

      - name: Install pinned provider editors
        run: |
          npm install --prefix "$PROVIDER_TOOLS/provider-editors" --no-audit --no-fund \
            @mariozechner/pi-coding-agent@0.73.1 @google/gemini-cli@0.59.0 opencode-ai@1.18.31
          mkdir -p "$PROVIDER_TOOLS/cursor"
          curl -fsSL --retry 2 \
            https://downloads.cursor.com/lab/2026.09.10-fd3934a/darwin/arm64/agent-cli-package.tar.gz \
            -o "$RUNNER_TEMP/cursor.tar.gz"
          tar -xzf "$RUNNER_TEMP/cursor.tar.gz" --strip-components=1 -C "$PROVIDER_TOOLS/cursor"
          curl -fsSL --retry 2 https://x.ai/cli/grok-1.0.30-macos-aarch64.gz -o "$RUNNER_TEMP/grok.gz"
          gzip -dc "$RUNNER_TEMP/grok.gz" > "$PROVIDER_TOOLS/grok"
          chmod +x "$PROVIDER_TOOLS/grok"

      - name: Check Feed state and provider identity
        run: |
          swift test --package-path Packages/macOS/CmuxNotifications \
            --scratch-path "$RUNNER_TEMP/swift-notifications" \
            --filter NotificationDeliveryCoordinatorTests \
            2>&1 | tee "$ARTIFACTS/notification-delivery.log"
          swift test --package-path Packages/macOS/CMUXAgentLaunch \
            --scratch-path "$RUNNER_TEMP/swift-agent-launch" \
            --filter WorkstreamStoreTests 2>&1 | tee "$ARTIFACTS/feed-ingestion.log"
          swift test --package-path Packages/iOS/CmuxMobileShell \
            --scratch-path "$RUNNER_TEMP/swift-mobile-shell" \
            --filter 'MobileAgentFeedTerminalReplyTests|MobileShellAgentFeedStateTests' \
            2>&1 | tee "$ARTIFACTS/feed-replies.log"
          swift test --package-path Packages/macOS/CmuxControlSocket \
            --scratch-path "$RUNNER_TEMP/swift-control" \
            --filter ControlCommandCoordinatorMobileHostTests \
            2>&1 | tee "$ARTIFACTS/control-dispatch.log"

      - name: Launch the isolated tagged app
        run: |
          ditto -x -k downloaded-app/app.zip "$RUNNER_TEMP/reply-app"
          app="$RUNNER_TEMP/reply-app/cmux DEV $BUILD_TAG.app"
          export REPLY_APP="$app"
          python3 - <<'PY'
          import os, pathlib, plistlib
          app = pathlib.Path(os.environ['REPLY_APP'])
          path = app / 'Contents/Info.plist'
          data = plistlib.loads(path.read_bytes())
          assert data['CFBundleIdentifier'] == 'com.cmuxterm.app.debug.' + os.environ['BUILD_TAG']
          env = data.setdefault('LSEnvironment', {})
          env.update({
              'CMUXTERM_REPO_ROOT': os.environ['GITHUB_WORKSPACE'],
              'CMUX_SOCKET_PATH': os.environ['CMUX_SOCKET_PATH'],
              'CMUX_DEBUG_LOG': os.environ['ARTIFACTS'] + '/mac.log',
              'CMUX_BUNDLED_CLI_PATH': str(app / 'Contents/Resources/bin/cmux'),
              'CMUX_SHELL_INTEGRATION_DIR': str(app / 'Contents/Resources/shell-integration'),
          })
          path.write_bytes(plistlib.dumps(data))
          PY
          codesign --force --sign - --timestamp=none --generate-entitlement-der "$app"
          open -g "$app"
          python3 - <<'PY'
          import os, time
          for _ in range(60):
              if os.path.exists(os.environ['CMUX_SOCKET_PATH']): break
              time.sleep(1)
          else: raise RuntimeError('Tagged app did not open its control socket')
          PY

      - name: Verify literal paste and separate Enter
        run: python3 tests_v2/test_mobile_terminal_paste_submit.py 2>&1 | tee "$ARTIFACTS/terminal-paste.log"

      - name: Verify real provider submission
        run: |
          failed=0
          for provider in pi opencode gemini grok cursor; do
            for variant in single multiline; do
              args=()
              if [[ "$variant" == multiline ]]; then args+=(--multiline); fi
              python3 tests_v2/test_mobile_terminal_paste_providers.py "$provider" \
                --tools-root "$PROVIDER_TOOLS" --artifacts "$ARTIFACTS/providers" "${args[@]}" \
                2>&1 | tee "$ARTIFACTS/$provider-$variant.log" || failed=1
            done
          done
          exit "$failed"

      - name: Stop the test app
        if: always()
        run: |
          app="$RUNNER_TEMP/reply-app/cmux DEV $BUILD_TAG.app/Contents/MacOS/cmux DEV"
          export REPLY_EXECUTABLE="$app"
          python3 - <<'PY'
          import os, signal, subprocess
          for line in subprocess.check_output(['ps', '-axo', 'pid=,comm='], text=True).splitlines():
              fields = line.strip().split(None, 1)
              if len(fields) == 2 and fields[1] == os.environ['REPLY_EXECUTABLE']:
                  os.kill(int(fields[0]), signal.SIGTERM)
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: feed-reply-evidence-${{ inputs.tag }}
          path: reply-evidence
          retention-days: 14
