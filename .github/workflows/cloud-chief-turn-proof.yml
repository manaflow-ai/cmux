name: Cloud Chief turn proof (staging)

# One Chief turn on a cmux Cloud machine of staging, read back (Cloud Chiefs, workstream 12).
# scripts/cmux-next/cloud-chief-turn-proof.ts signs in as the staging agent test account, creates
# `cmux-test-chief-<run>`, copies the optchat-chief built here to it, makes that machine's model route resolve
# (to a refusing 127.0.0.1, the state OPTCHAT_CHIEF_TURN_CREDENTIALS=1 is for: the script's header), runs
# measure/chief_driver.py there (one turn, the machine's own cmux-tui and acpmux) without the opt-in (expected:
# no model reply) and with it (expected: "OK"), and deletes the machine, pass or fail. The summary quotes the replies.
#
# Secrets: CMUX_DOGFOOD_STACK_EMAIL/_PASSWORD in cmux-next-vm-image-dev; the Claude token is the journey's.
# Runs on a same-repo pull request that changes this file, the script, or optchat-chief's credential code, and by
# manual dispatch on feat-cmux-next.

on:
  workflow_dispatch:
  pull_request:
    branches: [feat-cmux-next]
    paths:
      - .github/workflows/cloud-chief-turn-proof.yml
      - scripts/cmux-next/cloud-chief-turn-proof.ts
      - Native/OptChat/optchat-chief/src/turn_credential.rs
      - Native/OptChat/optchat-chief/tests/turn_model_route.rs

permissions:
  contents: read

concurrency:
  group: cloud-chief-turn-proof-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

env:
  # Temporary REST budget attribution: one gh-call line per GitHub API call (scripts/ci/api_call_log/env.sh, fetched at a fixed commit when the checkout has no copy).
  BASH_ENV: '$({ w="${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh"; t="${RUNNER_TEMP:-/nonexistent}/api-call-log-src"; if [ -f "$w" ]; then echo "$w"; elif [ -n "${RUNNER_TEMP:-}" ]; then if [ ! -f "$t/env.sh" ] && [ ! -e "$t.tried" ] && { [ "${RUNNER_OS:-}" = Linux ] || [ "${RUNNER_OS:-}" = macOS ]; } && [ "$(date -u +%Y%m%d%H)" -lt 2026112300 ]; then : > "$t.tried"; mkdir -p "$t.part" && for x in env.sh gh sitecustomize.py isolated.py; do curl -fsSL --max-time 5 -o "$t.part/$x" "https://raw.githubusercontent.com/manaflow-ai/cmux/27647ffd3ae838c63be28ca3e5883dcd68c34518/scripts/ci/api_call_log/$x" || break; done; [ -s "$t.part/isolated.py" ] && mv "$t.part" "$t"; fi; if [ -f "$t/env.sh" ]; then echo "$t/env.sh"; else echo unset BASH_ENV > "$t.off.sh" && echo "$t.off.sh"; fi; fi; } 2>/dev/null)'

jobs:
  proof:
    if: github.repository == 'manaflow-ai/cmux' && (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/feat-cmux-next' || github.event.pull_request.head.repo.full_name == github.repository)
    environment:
      name: cmux-next-vm-image-dev
      deployment: false
    runs-on: ${{ vars.CI_CLOUD_OVERFLOW_SAVED && fromJSON(vars.RUNNER_POOLS).linux_8 || fromJSON(vars.RUNNER_POOLS).linux_4 }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      # Before rust-cache: its cleanup must never reach a home a sibling runner builds from.
      - name: Give this runner instance its own CARGO_HOME
        uses: ./.github/actions/runner-cargo-home
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: Native/OptChat/optchat-chief
          cache-bin: false
      - name: Build optchat-chief and pack it with its driver
        working-directory: Native/OptChat/optchat-chief
        run: |
          cargo build --release --locked --bin optchat-chief
          mkdir -p "$RUNNER_TEMP/bundle/bin"
          cp target/release/optchat-chief "$RUNNER_TEMP/bundle/bin/"
          cp -r measure "$RUNNER_TEMP/bundle/measure"
          tar -C "$RUNNER_TEMP/bundle" -czf "$RUNNER_TEMP/chief.tgz" bin measure
          ls -l "$RUNNER_TEMP/chief.tgz"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
          no-cache: ${{ !startsWith(github.workspace, '/home/runner/work/') || !(github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && github.event_name != 'merge_group' && contains(fromJSON('["refs/heads/main","refs/heads/feat-cmux-next","refs/heads/nightly-next"]'), github.ref)) }}
      - name: One Chief turn on a staging machine, then delete it
        env:
          CMUX_DOGFOOD_STACK_EMAIL: ${{ secrets.CMUX_DOGFOOD_STACK_EMAIL }}
          CMUX_DOGFOOD_STACK_PASSWORD: ${{ secrets.CMUX_DOGFOOD_STACK_PASSWORD }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CMUX_JOURNEY_CLAUDE_CODE_OAUTH_TOKEN || secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: bun scripts/cmux-next/cloud-chief-turn-proof.ts --backend staging --bundle "$RUNNER_TEMP/chief.tgz" --run "${GITHUB_RUN_ID}x${GITHUB_RUN_ATTEMPT}" --out "$RUNNER_TEMP/chief-proof"
      - name: Summary
        if: always()
        run: cat "$RUNNER_TEMP/chief-proof/summary.md" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "no summary written" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: cloud-chief-turn-proof-${{ github.run_id }}
          path: ${{ runner.temp }}/chief-proof/
          if-no-files-found: warn
          retention-days: 3
