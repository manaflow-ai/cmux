name: temporary reusable skip scheduler probe
on:
  pull_request:
    branches: [feat-cmux-next]
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/ios-reusable-skip-probe.yml
      - .github/workflows/ios-reusable-skip-probe-called.yml
permissions: {}
jobs:
  route:
    if: ${{ github.head_ref == 'lane/ios-verdict-skipped-terminal' }}
    runs-on: cmux-linux
    timeout-minutes: 2
    steps:
      - run: echo 'route succeeded'
  optional-gate:
    needs: route
    if: ${{ false }}
    runs-on: cmux-linux
    timeout-minutes: 2
    steps:
      - run: exit 1
  pipeline:
    needs: [route, optional-gate]
    if: ${{ !cancelled() && needs.route.result == 'success' && needs.optional-gate.result != 'failure' }}
    uses: ./.github/workflows/ios-reusable-skip-probe-called.yml
  control:
    needs: route
    if: ${{ !cancelled() && needs.route.result == 'success' }}
    uses: ./.github/workflows/ios-reusable-skip-probe-called.yml
  result:
    needs: [route, optional-gate, pipeline, control]
    if: ${{ !cancelled() && needs.route.result == 'success' }}
    runs-on: cmux-linux
    timeout-minutes: 2
    steps:
      - name: Record scheduler results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          print(json.dumps(results, indent=2, sort_keys=True))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('```json\n' + json.dumps(results, indent=2, sort_keys=True) + '\n```\n')
          assert results['optional-gate']['result'] == 'skipped'
          assert results['control']['outputs']['implicit'] == 'success'
          assert results['control']['outputs']['explicit'] == 'success'
          assert results['pipeline']['outputs']['explicit'] == 'success'
          PY
