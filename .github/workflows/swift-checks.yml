name: Swift protocol and logic checks

# acpmux's wire contract is cmux-tui/crates/acpmux/spec/acpmux-protocol.json, emitted from its
# Rust method registry (cmux-tui-spec.yml acpmux-protocol-ir keeps it current, and the webviews
# generate their client from it). The app's Swift side names acpmux methods and the agent pane's
# allowed param keys by hand; scripts/ci/check-swift-acpmux-protocol.py checks every one against
# the protocol, so a drifted method or param fails here instead of at the daemon. A pull request
# that changes either side runs it as the swift-acpmux-protocol step of ci/steps.toml
# (pr-pipeline.yml): seconds, no build.
on:
  workflow_call:
    inputs:
      check:
        description: Which Swift check to run (acpmux or ratchet).
        type: string
        default: acpmux
      sha:
        description: Commit to test (empty is the caller's commit).
        type: string
        default: ""
      only:
        description: Run only this job id (a bisect probe); empty runs every job.
        type: string
        default: ""
  workflow_dispatch:
concurrency:
  # Keep protocol batches, ratchet runs and bisect probes isolated while cancelling superseded work.
  group: swift-checks-${{ inputs.check || 'acpmux' }}-${{ github.event.pull_request.number || github.ref }}${{ inputs.sha && format('-{0}-{1}', inputs.sha, inputs.only) || github.event.action == 'edited' && !(github.event.changes.body && (contains(github.event.pull_request.body, 'Swift-growth:') || contains(github.event.changes.body.from, 'Swift-growth:'))) && format('-edit-{0}', github.run_id) || '' }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Temporary REST budget attribution: one gh-call line per GitHub API call (scripts/ci/api_call_log/env.sh, fetched at a fixed commit when the checkout has no copy).
  BASH_ENV: '$({ w="${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh"; t="${RUNNER_TEMP:-/nonexistent}/api-call-log-src"; if [ -f "$w" ]; then echo "$w"; elif [ -n "${RUNNER_TEMP:-}" ]; then if [ ! -f "$t/env.sh" ] && [ ! -e "$t.tried" ] && { [ "${RUNNER_OS:-}" = Linux ] || [ "${RUNNER_OS:-}" = macOS ]; } && [ "$(date -u +%Y%m%d%H)" -lt 2026112300 ]; then : > "$t.tried"; mkdir -p "$t.part" && for x in env.sh gh sitecustomize.py isolated.py; do curl -fsSL --max-time 5 -o "$t.part/$x" "https://raw.githubusercontent.com/manaflow-ai/cmux/27647ffd3ae838c63be28ca3e5883dcd68c34518/scripts/ci/api_call_log/$x" || break; done; [ -s "$t.part/isolated.py" ] && mv "$t.part" "$t"; fi; if [ -f "$t/env.sh" ]; then echo "$t/env.sh"; else echo unset BASH_ENV > "$t.off.sh" && echo "$t.off.sh"; fi; fi; } 2>/dev/null)'

jobs:
  check:
    name: Swift acpmux calls are in the protocol
    if: ${{ (inputs.check == '' || inputs.check == 'acpmux') && (inputs.only == '' || inputs.only == 'check') }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || 'cmux-linux' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          ref: ${{ inputs.sha || '' }}
          sparse-checkout: |
            Packages/macOS/CmuxNext/Sources
            cmux-tui/crates/acpmux/spec/acpmux-protocol.json
            cmux-tui/crates/cmux-agent-pane-policy/policy.json
            scripts/cmux-next/gen-agent-pane-policy-swift.py
            scripts/ci
            tests/test_check_swift_acpmux_protocol.py
            .gitmodules
          sparse-checkout-cone-mode: false

      # Red on a planted drifted method, pane method and param key, and on a stale allowlist entry.
      - name: Checker tests
        run: python3 -I tests/test_check_swift_acpmux_protocol.py

      - name: Every Swift acpmux method and param is in the protocol
        if: ${{ !cancelled() }}
        run: python3 -I scripts/ci/check-swift-acpmux-protocol.py
  ratchet:
    name: Swift logic + mirror does not grow
    if: ${{ inputs.check == 'ratchet' && !(github.event.action == 'edited' && !(github.event.changes.body && (contains(github.event.pull_request.body, 'Swift-growth:') || contains(github.event.changes.body.from, 'Swift-growth:')))) }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || 'cmux-linux' }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # The merge commit and its first parent, whole blobs (the count reads every Swift file of both trees);
      # a same-repo runner reads the git mirror, as pr-router.yml's checkout does. Only the checker is checked out.
      - name: Checkout the merge commit and the base tip
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 2
          sparse-checkout: |
            scripts/cmux-next
            .gitmodules
          sparse-checkout-cone-mode: false

      - name: Judge the growth with the base's checker
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          set -uo pipefail
          if ! git rev-parse -q --verify 'HEAD^2' >/dev/null; then
            echo "::notice title=Swift logic ratchet::no merge commit to compare; nothing judged"
            exit 0
          fi
          checker="$RUNNER_TEMP/base-checker"
          mkdir -p "$checker"
          if ! git archive HEAD^1 scripts/cmux-next | tar -x -C "$checker" \
              || ! grep -q -- '--gate' "$checker/scripts/cmux-next/swift-logic-delta.py"; then
            # The pull request that adds the ratchet: its base has no checker with --gate yet.
            echo "::notice title=Swift logic ratchet::the base's swift-logic-delta.py has no --gate yet; nothing judged"
            exit 0
          fi
          printf '%s' "$BODY" > "$RUNNER_TEMP/body.md"
          status=0
          timeout 600 python3 -I "$checker/scripts/cmux-next/swift-logic-delta.py" --repo "$GITHUB_WORKSPACE" \
            --base HEAD^1 --head HEAD --gate --body-file "$RUNNER_TEMP/body.md" > "$RUNNER_TEMP/ratchet.md" || status=$?
          cat "$RUNNER_TEMP/ratchet.md"
          grep -v '^::' "$RUNNER_TEMP/ratchet.md" >> "$GITHUB_STEP_SUMMARY" || true
          if [ "$status" -ne 0 ] && [ "$status" -ne 1 ]; then
            echo "::notice title=Swift logic ratchet::the checker exited $status (timeout or crash); not judged"
            exit 0
          fi
          exit "$status"