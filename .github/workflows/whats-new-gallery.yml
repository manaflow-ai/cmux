name: What's New gallery pictures

# Each What's New highlight that names a webview gallery state (`gallery:` and, for an improvement,
# `before:`; release-notes/next/WRITING.md) gets those states rendered and put on pr-media, where
# the next nightly's signed notes find them (scripts/cmux-next/media/whats-new-gallery.py,
# release-notes.py add_gallery_media). Leo, 2026-10-20: "vids and before/afters for our techincal
# stuff is p important". It publishes only the states a highlight names (#21400 took out the
# automatic publishing of every state a pull request touches), gates nothing and is not a check.
#
# render renders in Chromium with no secret and no write; publish, in the pr-media environment
# (protected branches only), reads the pictures as data and writes only through
# .github/actions/pr-media-publish and its privacy check.
on:
  push:
    branches: [feat-cmux-next]
    paths:
      - "release-notes/next/highlights/**"
  workflow_dispatch:
    inputs:
      all:
        description: Render every state again, also those already on pr-media
        type: boolean
        default: false

permissions:
  contents: read

# One at a time, never cancelled: a later push plans only what is still missing.
concurrency:
  group: whats-new-gallery
  cancel-in-progress: false

jobs:
  render:
    if: ${{ github.repository_owner == 'manaflow-ai' }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.LINUX_RUNNER || fromJSON(vars.RUNNER_POOLS).linux_4 }}
    timeout-minutes: 30
    outputs:
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          # The plan reads each highlight's first commit (its age).
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: false # patterns: .github/checkout-lean.json
          sparse-checkout: |
            /*
            !/cmux-next-ios/verify/
          persist-credentials: false

      - name: Plan the states to render
        id: plan
        env:
          ALL: ${{ inputs.all && '--all' || '' }}
        run: |
          set -euo pipefail
          entries=$(python3 scripts/cmux-next/media/whats-new-gallery.py plan $ALL --out "$RUNNER_TEMP/plan.json")
          echo "count=$(jq length "$RUNNER_TEMP/plan.json")" >> "$GITHUB_OUTPUT"
          echo "entries=${entries// /,}" >> "$GITHUB_OUTPUT"
          jq -r '.[] | "- \(.id) \(.role): \(.state)"' "$RUNNER_TEMP/plan.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Bun
        if: ${{ steps.plan.outputs.count != '0' }}
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"

      - name: Setup Node
        if: ${{ steps.plan.outputs.count != '0' }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.22.1"

      - name: Cache Playwright's apt packages
        if: ${{ steps.plan.outputs.count != '0' }}
        continue-on-error: true
        uses: ./.github/actions/playwright-apt-cache
        with:
          engines: chromium

      - name: Render the gallery states
        if: ${{ steps.plan.outputs.count != '0' }}
        env:
          ENTRIES: ${{ steps.plan.outputs.entries }}
          CMUX_GALLERY_IN_VM: "1"
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/pictures"
          mkdir -p "$out"
          cp "$RUNNER_TEMP/plan.json" "$out/plan.json"
          cd webviews
          bun install --frozen-lockfile
          bun scripts/gallery/manifest.ts --entries "$ENTRIES" --themes pair --widths normal \
            --frame component --out "$RUNNER_TEMP/cases.json"
          python3 ../scripts/cmux-next/media/whats-new-gallery.py manifest --plan "$RUNNER_TEMP/plan.json" \
            --cases "$RUNNER_TEMP/cases.json" --out "$RUNNER_TEMP/manifest.json"
          CMUX_GALLERY_OUT_DIR="$RUNNER_TEMP/gallery" bun run gallery:build
          cd ../scripts/gallery-matrix
          bun install --frozen-lockfile
          "$GITHUB_WORKSPACE/scripts/ci/ensure-system-chrome.sh"
          # A failed play check still writes its picture; publish skips a state with none.
          bun runner.ts --manifest "$RUNNER_TEMP/manifest.json" --gallery-dir "$RUNNER_TEMP/gallery" \
            --output-dir "$out" --engines chromium --shard-count 1 --shard-index 0 \
            || echo "::warning::the render exited $?; publish takes the states that rendered"

      - name: Keep the pictures for publish
        if: ${{ steps.plan.outputs.count != '0' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: whats-new-gallery-${{ github.run_id }}
          path: ${{ runner.temp }}/pictures/
          retention-days: 3

  publish:
    needs: render
    if: ${{ needs.render.outputs.count != '0' && needs.render.result == 'success' }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.LINUX_RUNNER || fromJSON(vars.RUNNER_POOLS).linux_4 }}
    timeout-minutes: 20
    # The private-terms secret lives only in this environment, which admits only
    # the protected branches (main, feat-cmux-next, nightly-next).
    environment: pr-media
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            .github/actions/pr-media-publish
            scripts/pr-media.py
            scripts/ci/pr_media_privacy.py
            scripts/ci/pr_media_gate.py
            scripts/ci/pr_media_ocr_tesseract.py
            scripts/ci/pr_media_ocr.swift
            scripts/cmux-next/release-notes.py
            scripts/cmux-next/media/whats-new-gallery.py
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: whats-new-gallery-${{ github.run_id }}
          path: ${{ runner.temp }}/pictures

      - name: Publish the pictures
        uses: ./.github/actions/pr-media-publish
        with:
          private-terms: ${{ secrets.PR_MEDIA_PRIVATE_TERMS }}
          agent-authors: ${{ vars.PR_MEDIA_AGENT_AUTHORS }}
          github-token: ${{ github.token }}
          command: |
            python3 scripts/cmux-next/media/whats-new-gallery.py publish \
              --plan "$RUNNER_TEMP/pictures/plan.json" --results "$RUNNER_TEMP/pictures" | tee -a "$GITHUB_STEP_SUMMARY"
