name: What's New gallery pictures

# Each New or Improved What's New highlight gets its webview gallery state rendered and put on
# pr-media, where the next nightly's signed notes find them (scripts/cmux-next/media/whats-new-gallery.py,
# release-notes.py add_gallery_media): the state its `gallery:` line names, else one picked from the
# gallery files its commit changed; for an improvement, its `before:` state, else the same state
# rendered at the commit before the highlight's (release-notes/next/WRITING.md). Leo, 2026-10-20: "vids and before/afters for our techincal
# stuff is p important". It publishes only the states a highlight names (#21400 took out the
# automatic publishing of every state a pull request touches), gates nothing and is not a check.
#
# render renders in Chromium with no secret and no write; publish, in the pr-media environment
# (protected branches only), reads the pictures as data and writes only through
# .github/actions/pr-media-publish and its privacy check.
on:
  push:
    branches: [feat-cmux-next]
    paths:
      - "release-notes/next/highlights/**"
      # A planner change plans again what is still missing (it only renders pictures not on pr-media).
      - ".github/workflows/whats-new-gallery.yml"
      - "scripts/cmux-next/media/whats-new-gallery.py"
  workflow_dispatch:
    inputs:
      all:
        description: Render every state again, also those already on pr-media
        type: boolean
        default: false

permissions:
  contents: read

# One at a time, never cancelled: a later push plans only what is still missing.
concurrency:
  group: whats-new-gallery
  cancel-in-progress: false

env:
  # Temporary REST budget attribution: one gh-call line per GitHub API call (scripts/ci/api_call_log/env.sh, fetched at a fixed commit when the checkout has no copy).
  BASH_ENV: '$({ w="${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh"; t="${RUNNER_TEMP:-/nonexistent}/api-call-log-src"; if [ -f "$w" ]; then echo "$w"; elif [ -n "${RUNNER_TEMP:-}" ]; then if [ ! -f "$t/env.sh" ] && [ ! -e "$t.tried" ] && { [ "${RUNNER_OS:-}" = Linux ] || [ "${RUNNER_OS:-}" = macOS ]; } && [ "$(date -u +%Y%m%d%H)" -lt 2026112300 ]; then : > "$t.tried"; mkdir -p "$t.part" && for x in env.sh gh sitecustomize.py isolated.py; do curl -fsSL --max-time 5 -o "$t.part/$x" "https://raw.githubusercontent.com/manaflow-ai/cmux/27647ffd3ae838c63be28ca3e5883dcd68c34518/scripts/ci/api_call_log/$x" || break; done; [ -s "$t.part/isolated.py" ] && mv "$t.part" "$t"; fi; if [ -f "$t/env.sh" ]; then echo "$t/env.sh"; else echo unset BASH_ENV > "$t.off.sh" && echo "$t.off.sh"; fi; fi; } 2>/dev/null)'

jobs:
  render:
    if: ${{ github.repository_owner == 'manaflow-ai' }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || 'cmux-linux' }}
    timeout-minutes: 60
    outputs:
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          # The plan reads each highlight's first commit (its age).
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: false # patterns: .github/checkout-lean.json
          sparse-checkout: |
            /*
            !/cmux-next-ios/verify/
          persist-credentials: false

      - name: Plan the states to render
        id: plan
        env:
          ALL: ${{ inputs.all && '--all' || '' }}
        run: |
          set -euo pipefail
          entries=$(python3 scripts/cmux-next/media/whats-new-gallery.py plan $ALL --out "$RUNNER_TEMP/plan.json")
          echo "count=$(jq length "$RUNNER_TEMP/plan.json")" >> "$GITHUB_OUTPUT"
          echo "entries=${entries// /,}" >> "$GITHUB_OUTPUT"
          jq -r '.[] | "- \(.id) \(.role): \(.state // "picked from \(.sources | join(", "))")\(if .parent then " at \(.parent[:12])" else "" end)"' "$RUNNER_TEMP/plan.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Restore pinned Bun 1.4.4 from the CI cache bucket
        if: ${{ steps.plan.outputs.count != '0' }}
        shell: bash
        continue-on-error: true
        run: bash "$GITHUB_WORKSPACE/scripts/ci/toolchain-r2.sh" restore bun 1.4.4 || true

      - name: Setup Bun
        if: ${{ steps.plan.outputs.count != '0' }}
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
          no-cache: ${{ !startsWith(github.workspace, '/home/runner/work/') || !(github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && github.event_name != 'merge_group' && contains(fromJSON('["refs/heads/main","refs/heads/feat-cmux-next","refs/heads/nightly-next"]'), github.ref)) }}

      - name: Restore pinned Node 24.22.1 from the CI cache bucket
        if: ${{ steps.plan.outputs.count != '0' }}
        shell: bash
        continue-on-error: true
        run: bash "$GITHUB_WORKSPACE/scripts/ci/toolchain-r2.sh" restore node 24.22.1 || true

      - name: Setup Node
        if: ${{ steps.plan.outputs.count != '0' }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.22.1"

      - name: Cache Playwright's apt packages
        if: ${{ steps.plan.outputs.count != '0' }}
        continue-on-error: true
        uses: ./.github/actions/playwright-apt-cache
        with:
          engines: chromium

      - name: Set up pinned Rust for desktop input keys
        if: ${{ steps.plan.outputs.count != '0' }}
        uses: ./.github/actions/setup-cmux-tui-rust

      - name: Build cmux-shotdiff for desktop input keys
        if: ${{ steps.plan.outputs.count != '0' }}
        working-directory: cmux-tui
        run: |
          set -euo pipefail
          timeout 900 cargo build --locked --release -p cmux-shotdiff --bin cmux-shotdiff
          echo "CMUX_SHOTDIFF=$PWD/target/release/cmux-shotdiff" >> "$GITHUB_ENV"

      - name: Render the gallery states
        if: ${{ steps.plan.outputs.count != '0' }}
        env:
          ENTRIES: ${{ steps.plan.outputs.entries }}
          CMUX_GALLERY_IN_VM: "1"
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/pictures"
          mkdir -p "$out"
          cp "$RUNNER_TEMP/plan.json" "$out/plan.json"
          write_input_keys() {
            local rev="$1" dest="$2"
            local chromium webkit
            chromium="$("$CMUX_SHOTDIFF" key --inputs "$GITHUB_WORKSPACE/.github/golden-inputs.json" \
              --family desktop-gallery --variant chromium --rev "$rev" --repo "$GITHUB_WORKSPACE")"
            webkit="$("$CMUX_SHOTDIFF" key --inputs "$GITHUB_WORKSPACE/.github/golden-inputs.json" \
              --family desktop-gallery --variant webkit --rev "$rev" --repo "$GITHUB_WORKSPACE")"
            jq -n --arg rev "$rev" --arg runtime linux-gallery \
              --argjson chromium "$chromium" --argjson webkit "$webkit" \
              '{schema:"cmux.desktop-input-key/v1", family:"desktop-gallery", runtime:$runtime,
                revision:$rev, variants:{chromium:$chromium, webkit:$webkit}}' > "$dest"
          }
          write_input_keys "$GITHUB_SHA" "$out/input-keys.json"
          cd webviews
          bun install --frozen-lockfile
          # No ENTRIES: a state is still to be picked, from every entry's cases.
          bun scripts/gallery/manifest.ts ${ENTRIES:+--entries "$ENTRIES"} --themes pair --widths normal \
            --frame component --out "$RUNNER_TEMP/cases.json"
          # Each variant's note: a "Selected" one is the after a file picked, a "Before:" one its old look.
          # And the source files each entry covers: a highlight whose commit changed no gallery file.
          bun scripts/gallery/notes.ts --out "$RUNNER_TEMP/notes.json" --covers "$RUNNER_TEMP/covers.json"
          # Picks the states no line names and writes them into the plan publish reads.
          python3 ../scripts/cmux-next/media/whats-new-gallery.py manifest --plan "$out/plan.json" \
            --cases "$RUNNER_TEMP/cases.json" --notes "$RUNNER_TEMP/notes.json" \
            --covers "$RUNNER_TEMP/covers.json" --out "$RUNNER_TEMP/manifest.json"
          CMUX_GALLERY_OUT_DIR="$RUNNER_TEMP/gallery" bun run gallery:build
          (cd ../scripts/gallery-matrix && bun install --frozen-lockfile)
          "$GITHUB_WORKSPACE/scripts/ci/ensure-system-chrome.sh"
          render() {
            local key_file="${3:-$out/input-keys.json}"
            # A failed play check still writes its picture; publish skips a state with none.
            (cd "$GITHUB_WORKSPACE/scripts/gallery-matrix" && CMUX_GALLERY_INPUT_KEYS="$key_file" bun runner.ts --manifest "$1" --gallery-dir "$2" \
              --output-dir "$out" --engines chromium --shard-count 1 --shard-index 0) \
              || echo "::warning::the render exited $?; publish takes the states that rendered"
          }
          render "$RUNNER_TEMP/manifest.json" "$RUNNER_TEMP/gallery" "$out/input-keys.json"
          # An improvement's before with no `before:` line: the same state at the commit before the
          # highlight's, from a checkout there. At most 4 commits a run; the next push plans the rest.
          for parent in $(python3 ../scripts/cmux-next/media/whats-new-gallery.py parents --plan "$out/plan.json" --limit 4); do
            at="$RUNNER_TEMP/at-$parent"
            {
              # The same sparse tree as this checkout (.github/checkout-lean.json).
              git -C "$GITHUB_WORKSPACE" worktree add -f -f --no-checkout --detach "$at" "$parent" &&
              git -C "$at" sparse-checkout set --no-cone '/*' '!/cmux-next-ios/verify/' &&
              git -C "$at" reset -q --hard &&
              # A variant the highlight's commit added to a gallery file already there: that file as the commit
              # left it, so the old code draws the new state.
              python3 "$GITHUB_WORKSPACE/scripts/cmux-next/media/whats-new-gallery.py" overlays --plan "$out/plan.json" \
                --parent "$parent" > "$RUNNER_TEMP/overlays-$parent.txt" &&
              (while read -r commit path; do git -C "$at" checkout -q "$commit" -- "$path" || exit 1; done \
                < "$RUNNER_TEMP/overlays-$parent.txt") &&
              (cd "$at/webviews" && bun install --frozen-lockfile &&
                bun scripts/gallery/manifest.ts --themes pair --widths normal --frame component \
                  --out "$RUNNER_TEMP/cases-$parent.json") &&
              python3 "$GITHUB_WORKSPACE/scripts/cmux-next/media/whats-new-gallery.py" manifest --plan "$out/plan.json" \
                --cases "$RUNNER_TEMP/cases-$parent.json" --parent "$parent" --out "$RUNNER_TEMP/manifest-$parent.json" &&
              (cd "$at/webviews" && CMUX_STRINGS_BEST_EFFORT=1 CMUX_GALLERY_OUT_DIR="$RUNNER_TEMP/gallery-$parent" bun run gallery:build) &&
              write_input_keys "$parent" "$out/input-keys-$parent.json" &&
              render "$RUNNER_TEMP/manifest-$parent.json" "$RUNNER_TEMP/gallery-$parent" "$out/input-keys-$parent.json"
            } || echo "::warning title=What's New picture::no gallery at $parent; its befores wait"
          done

      - name: Keep the pictures for publish
        if: ${{ steps.plan.outputs.count != '0' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: whats-new-gallery-${{ github.run_id }}
          path: ${{ runner.temp }}/pictures/
          retention-days: 3

  publish:
    needs: render
    if: ${{ needs.render.outputs.count != '0' && needs.render.result == 'success' }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || 'cmux-linux' }}
    timeout-minutes: 20
    # The private-terms secret lives only in this environment, which admits only
    # the protected branches (main, feat-cmux-next, nightly-next).
    environment: pr-media
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            .github/actions/pr-media-publish
            scripts/pr-media.py
            scripts/ci/pr_media_privacy.py
            scripts/ci/pr_media_gate.py
            scripts/ci/pr_media_ocr_tesseract.py
            scripts/ci/pr_media_ocr.swift
            scripts/cmux-next/release-notes.py
            scripts/cmux-next/media/whats-new-gallery.py
            .gitmodules
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: whats-new-gallery-${{ github.run_id }}
          path: ${{ runner.temp }}/pictures

      - name: Publish the pictures
        uses: ./.github/actions/pr-media-publish
        with:
          private-terms: ${{ secrets.PR_MEDIA_PRIVATE_TERMS }}
          agent-authors: ${{ vars.PR_MEDIA_AGENT_AUTHORS }}
          github-token: ${{ github.token }}
          command: |
            python3 scripts/cmux-next/media/whats-new-gallery.py publish \
              --plan "$RUNNER_TEMP/pictures/plan.json" --results "$RUNNER_TEMP/pictures" | tee -a "$GITHUB_STEP_SUMMARY"
