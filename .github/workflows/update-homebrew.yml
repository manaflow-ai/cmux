name: Update Homebrew Cask

on:
  # workflow_run is safe here because the validator runs without secrets and
  # binds the event to one completed, same-repository release run before the
  # publisher job can read the tap token.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: ["Release macOS app"]
    types: [completed]

permissions: {}

concurrency:
  group: cmux-homebrew-cask
  cancel-in-progress: false

jobs:
  validate-source:
    name: Validate release provenance
    runs-on: ubuntu-24.04 # github-hosted-required: release provenance requires hosted isolation
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      skip: ${{ steps.provenance.outputs.skip }}
      version: ${{ steps.provenance.outputs.version }}
      tag: ${{ steps.provenance.outputs.tag }}
      release_sha: ${{ steps.provenance.outputs.release_sha }}
      source_run_id: ${{ steps.provenance.outputs.source_run_id }}
      asset_id: ${{ steps.provenance.outputs.asset_id }}
      asset_size: ${{ steps.provenance.outputs.asset_size }}
      asset_digest: ${{ steps.provenance.outputs.asset_digest }}
      asset_url: ${{ steps.provenance.outputs.asset_url }}
    steps:
      - name: Checkout validator
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/scripts/validate-homebrew-release.sh

      - name: Verify trusted validator checkout
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$WORKFLOW_SHA" ]]
          [[ -x .github/scripts/validate-homebrew-release.sh ]]

      - name: Validate release workflow, tag, and asset
        id: provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/validate-homebrew-release.sh

  publish-cask:
    name: Publish Homebrew cask
    needs: validate-source
    if: needs.validate-source.result == 'success' && needs.validate-source.outputs.skip != 'true'
    runs-on: ubuntu-24.04 # github-hosted-required: the tap token never runs on a mutable external runner
    timeout-minutes: 25
    # Configure this environment with a main-only deployment branch policy.
    # workflow_run jobs use the default branch ref, so this keeps the tap token
    # behind an independent control-plane policy as well as the validator.
    environment:
      name: homebrew-cask
      url: https://github.com/manaflow-ai/homebrew-cmux
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout validator
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false
          path: cmux-source
          sparse-checkout: |
            .github/scripts/validate-homebrew-release.sh
          sparse-checkout-cone-mode: false

      - name: Verify trusted validator checkout
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git -C cmux-source rev-parse HEAD)" == "$WORKFLOW_SHA" ]]
          [[ -x cmux-source/.github/scripts/validate-homebrew-release.sh ]]

      - name: Revalidate release before download
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SKIP: ${{ needs.validate-source.outputs.skip }}
          EXPECTED_VERSION: ${{ needs.validate-source.outputs.version }}
          EXPECTED_TAG: ${{ needs.validate-source.outputs.tag }}
          EXPECTED_RELEASE_SHA: ${{ needs.validate-source.outputs.release_sha }}
          EXPECTED_SOURCE_RUN_ID: ${{ needs.validate-source.outputs.source_run_id }}
          EXPECTED_ASSET_ID: ${{ needs.validate-source.outputs.asset_id }}
          EXPECTED_ASSET_SIZE: ${{ needs.validate-source.outputs.asset_size }}
          EXPECTED_ASSET_DIGEST: ${{ needs.validate-source.outputs.asset_digest }}
          EXPECTED_ASSET_URL: ${{ needs.validate-source.outputs.asset_url }}
        run: bash cmux-source/.github/scripts/validate-homebrew-release.sh

      - name: Download and verify release DMG
        env:
          RELEASE_URL: ${{ needs.validate-source.outputs.asset_url }}
          EXPECTED_SIZE: ${{ needs.validate-source.outputs.asset_size }}
          EXPECTED_DIGEST: ${{ needs.validate-source.outputs.asset_digest }}
        run: |
          set -euo pipefail
          download_dir="${RUNNER_TEMP}/cmux-homebrew-download"
          mkdir -p "$download_dir"
          final_file="$download_dir/cmux-macos.dmg"
          rm -f "$final_file"

          for attempt in 1 2 3 4 5; do
            candidate="$download_dir/cmux-macos.dmg.${attempt}"
            rm -f "$candidate"
            http_code=""
            if ! http_code="$(curl \
              --fail --silent --show-error --location \
              --proto '=https' --proto-redir '=https' \
              --retry 2 --retry-delay 2 --retry-all-errors \
              --connect-timeout 20 --max-time 300 \
              --output "$candidate" --write-out '%{http_code}' \
              "$RELEASE_URL")"; then
              http_code="${http_code:-000}"
            fi
            file_size="$(stat --format='%s' "$candidate" 2>/dev/null || echo 0)"
            if [[ "$http_code" == "200" && "$file_size" == "$EXPECTED_SIZE" ]]; then
              mv "$candidate" "$final_file"
              break
            fi
            echo "Attempt $attempt/5 failed: HTTP $http_code, size $file_size" >&2
            rm -f "$candidate"
            if [[ "$attempt" == "5" ]]; then
              echo "Release DMG did not match the validated asset metadata" >&2
              exit 1
            fi
          done

          actual_digest="sha256:$(sha256sum "$final_file" | awk '{print $1}')"
          [[ "$actual_digest" == "$EXPECTED_DIGEST" ]] || {
            echo "Release DMG digest changed after provenance validation" >&2
            exit 1
          }
          cp "$final_file" cmux.dmg
          echo "Verified release DMG: $actual_digest ($EXPECTED_SIZE bytes)"

      - name: Revalidate release before tap mutation
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SKIP: ${{ needs.validate-source.outputs.skip }}
          EXPECTED_VERSION: ${{ needs.validate-source.outputs.version }}
          EXPECTED_TAG: ${{ needs.validate-source.outputs.tag }}
          EXPECTED_RELEASE_SHA: ${{ needs.validate-source.outputs.release_sha }}
          EXPECTED_SOURCE_RUN_ID: ${{ needs.validate-source.outputs.source_run_id }}
          EXPECTED_ASSET_ID: ${{ needs.validate-source.outputs.asset_id }}
          EXPECTED_ASSET_SIZE: ${{ needs.validate-source.outputs.asset_size }}
          EXPECTED_ASSET_DIGEST: ${{ needs.validate-source.outputs.asset_digest }}
          EXPECTED_ASSET_URL: ${{ needs.validate-source.outputs.asset_url }}
        run: bash cmux-source/.github/scripts/validate-homebrew-release.sh

      - name: Require tap write token
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_CASK_TAP_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "$TAP_TOKEN" ]] || {
            echo "HOMEBREW_CASK_TAP_TOKEN environment secret is required and must be scoped to manaflow-ai/homebrew-cmux contents:write" >&2
            exit 1
          }

      - name: Checkout homebrew-cmux
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: manaflow-ai/homebrew-cmux
          ref: main
          token: ${{ secrets.HOMEBREW_CASK_TAP_TOKEN }}
          path: homebrew-cmux
          fetch-depth: 1
          persist-credentials: false
          clean: true
          submodules: false

      - name: Update cask formula
        env:
          VERSION: ${{ needs.validate-source.outputs.version }}
          SHA256: ${{ needs.validate-source.outputs.asset_digest }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || exit 1
          [[ "$SHA256" =~ ^sha256:[0-9a-f]{64}$ ]] || exit 1
          SHA256="${SHA256#sha256:}"
          cask="homebrew-cmux/Casks/cmux.rb"
          [[ -f "$cask" && ! -L "$cask" ]] || {
            echo "The tap cask path must be a regular file" >&2
            exit 1
          }
          [[ "$(git -C homebrew-cmux ls-files --stage -- Casks/cmux.rb | awk 'NR == 1 { print $1 }')" == "100644" ]] || {
            echo "The tap cask path must be a normal tracked file" >&2
            exit 1
          }
          [[ -z "$(git -C homebrew-cmux status --porcelain)" ]] || {
            echo "The tap checkout is not clean" >&2
            exit 1
          }

          umask 077
          cat >"$cask" <<EOF
          cask "cmux" do
            version "${VERSION}"
            sha256 "${SHA256}"

            url "https://github.com/manaflow-ai/cmux/releases/download/v#{version}/cmux-macos.dmg"
            name "cmux"
            desc "Lightweight native macOS terminal with vertical tabs for AI coding agents"
            homepage "https://cmux.com"

            livecheck do
              url :url
              strategy :github_latest
            end

            depends_on macos: ">= :sonoma"

            app "cmux.app"
            binary "#{appdir}/cmux.app/Contents/Resources/bin/cmux"

            zap trash: [
              "~/Library/Application Support/cmux",
              "~/Library/Caches/cmux",
              "~/Library/Preferences/ai.manaflow.cmuxterm.plist",
            ]
          end
          EOF
          sed -i 's/^          //' "$cask"
          ruby -c "$cask"
          grep -Fq "version \"${VERSION}\"" "$cask"
          grep -Fq "sha256 \"${SHA256}\"" "$cask"

      - name: Commit and push cask
        env:
          VERSION: ${{ needs.validate-source.outputs.version }}
          TAP_TOKEN: ${{ secrets.HOMEBREW_CASK_TAP_TOKEN }}
        run: |
          set -euo pipefail
          cd homebrew-cmux
          git diff --check
          git add -- Casks/cmux.rb
          if git diff --cached --quiet; then
            echo "Homebrew cask is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Update cmux to ${VERSION}"

          askpass="${RUNNER_TEMP}/cmux-homebrew-git-askpass"
          umask 077
          cat >"$askpass" <<'ASKPASSSCRIPT'
          #!/usr/bin/env sh
          case "${1:-}" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "${CASK_TAP_TOKEN}" ;;
            *) exit 1 ;;
          esac
          ASKPASSSCRIPT
          sed -i 's/^          //' "$askpass"
          chmod 700 "$askpass"
          cleanup() {
            rm -f "$askpass"
            unset TAP_TOKEN CASK_TAP_TOKEN
          }
          trap cleanup EXIT
          export CASK_TAP_TOKEN="$TAP_TOKEN"
          export GIT_ASKPASS="$askpass"
          export GIT_TERMINAL_PROMPT=0
          origin="$(git remote get-url origin)"
          [[ "$origin" == "https://github.com/manaflow-ai/homebrew-cmux" || "$origin" == "https://github.com/manaflow-ai/homebrew-cmux.git" ]] || {
            echo "Unexpected tap remote: $origin" >&2
            exit 1
          }
          git -c credential.helper= push origin HEAD:main
          pushed_sha="$(git rev-parse HEAD)"
          remote_sha="$(git -c credential.helper= ls-remote origin refs/heads/main | awk 'NR == 1 { print $1 }')"
          [[ "$remote_sha" == "$pushed_sha" ]] || {
            echo "Tap push could not be verified" >&2
            exit 1
          }
