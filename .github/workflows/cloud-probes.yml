name: Cloud operational probes
run-name: Cloud probes (${{ inputs.operation || 'request files' }})

# One dispatcher for the staging paid-machine-count and development Surge probes.
# Both scripts delete every machine they created, pass or fail. Production is out of scope.
# A dispatch selects one operation. Pushes preserve the two existing request-file routes;
# changing both requests runs both probes with one checkout and Bun setup.
# Credentials remain in cmux-next-vm-image-dev; feat-cmux-next only.
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Probe to run
        required: true
        type: choice
        options: [machine-count, surge]
      count:
        description: "Machine-count only: machines to create (1-10); passes when a sixth is accepted"
        required: true
        type: number
        default: 6
  push:
    branches: [feat-cmux-next]
    paths:
      - .github/workflows/cloud-probes.yml # Register the renamed dispatcher; no probe without a request.
      - .github/cloud-machine-count-probe/request
      - .github/cloud-surge-proof/request

permissions:
  contents: read

# Serialize the shared test account; never cancel a probe during machine cleanup.
concurrency:
  group: cloud-operational-probes
  cancel-in-progress: false

env:
  # Temporary REST budget attribution: one gh-call line per GitHub API call (scripts/ci/api_call_log/env.sh, fetched at a fixed commit when the checkout has no copy).
  BASH_ENV: '$({ w="${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh"; t="${RUNNER_TEMP:-/nonexistent}/api-call-log-src"; if [ -f "$w" ]; then echo "$w"; elif [ -n "${RUNNER_TEMP:-}" ]; then if [ ! -f "$t/env.sh" ] && [ ! -e "$t.tried" ] && { [ "${RUNNER_OS:-}" = Linux ] || [ "${RUNNER_OS:-}" = macOS ]; } && [ "$(date -u +%Y%m%d%H)" -lt 2026112300 ]; then : > "$t.tried"; mkdir -p "$t.part" && for x in env.sh gh sitecustomize.py isolated.py; do curl -fsSL --max-time 5 -o "$t.part/$x" "https://raw.githubusercontent.com/manaflow-ai/cmux/27647ffd3ae838c63be28ca3e5883dcd68c34518/scripts/ci/api_call_log/$x" || break; done; [ -s "$t.part/isolated.py" ] && mv "$t.part" "$t"; fi; if [ -f "$t/env.sh" ]; then echo "$t/env.sh"; else echo unset BASH_ENV > "$t.off.sh" && echo "$t.off.sh"; fi; fi; } 2>/dev/null)'

jobs:
  probes:
    if: github.repository == 'manaflow-ai/cmux' && github.ref == 'refs/heads/feat-cmux-next'
    environment:
      name: cmux-next-vm-image-dev
      deployment: false
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || 'cmux-linux' }}
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/cmux-next/
            /tests/fixtures/model-stub/
            /Packages/macOS/CmuxNext/Sources/CmuxNextCloudCredentials/
            scripts/ci/toolchain-r2.sh
            scripts/ci/toolchain-archives.sha256
            scripts/ci/r2-cache.sh
            scripts/ci/lan_cache_fetch.py
            .gitmodules
      - name: Select requested probes
        id: route
        timeout-minutes: 3
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          OPERATION: ${{ inputs.operation }}
          BEFORE: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          count=false
          surge=false
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            case "$OPERATION" in
              machine-count) count=true ;;
              surge) surge=true ;;
              *) echo "Unknown probe operation" >&2; exit 1 ;;
            esac
          elif [[ "$EVENT_NAME" == push ]]; then
            if [[ "$BEFORE" == 0000000000000000000000000000000000000000 ]]; then
              echo "Cannot route a branch-creation push; dispatch one explicit probe operation instead." >&2
              exit 1
            else
              [[ "$BEFORE" =~ ^[0-9a-f]{40}$ ]] || exit 1
              # Checkout intentionally leaves no credential behind. Fetch only the
              # pre-push commit, so multi-commit pushes compare the entire push.
              if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
                auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
                git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
                  fetch --no-tags --depth=1 origin "$BEFORE"
              fi
              changed=$(git diff --name-only "$BEFORE" "$GITHUB_SHA" -- \
                .github/cloud-machine-count-probe/request .github/cloud-surge-proof/request)
              while IFS= read -r path; do
                case "$path" in
                  .github/cloud-machine-count-probe/request) count=true ;;
                  .github/cloud-surge-proof/request) surge=true ;;
                esac
              done <<< "$changed"
            fi
          else
            echo "Unsupported probe event" >&2
            exit 1
          fi
          printf 'count=%s\nsurge=%s\n' "$count" "$surge" >> "$GITHUB_OUTPUT"
      - name: Restore pinned Bun 1.4.4 from the CI cache bucket
        if: steps.route.outputs.count == 'true' || steps.route.outputs.surge == 'true'
        shell: bash
        continue-on-error: true
        run: bash "$GITHUB_WORKSPACE/scripts/ci/toolchain-r2.sh" restore bun 1.4.4 || true

      - id: bun
        if: steps.route.outputs.count == 'true' || steps.route.outputs.surge == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
          no-cache: ${{ !startsWith(github.workspace, '/home/runner/work/') || !(github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && github.event_name != 'merge_group' && contains(fromJSON('["refs/heads/main","refs/heads/feat-cmux-next","refs/heads/nightly-next"]'), github.ref)) }}
      - name: Create machines on staging, then delete them
        if: ${{ !cancelled() && steps.bun.outcome == 'success' && steps.route.outputs.count == 'true' }}
        timeout-minutes: 30
        env:
          CMUX_DOGFOOD_STACK_EMAIL: ${{ secrets.CMUX_DOGFOOD_STACK_EMAIL }}
          CMUX_DOGFOOD_STACK_PASSWORD: ${{ secrets.CMUX_DOGFOOD_STACK_PASSWORD }}
          COUNT: ${{ inputs.count || 6 }}
        run: bun scripts/cmux-next/cloud-machine-count-probe.ts --backend staging --count "$COUNT" --out "$RUNNER_TEMP/count-probe"
      - name: Summary
        if: ${{ always() && steps.route.outputs.count == 'true' }}
        run: cat "$RUNNER_TEMP/count-probe/summary.md" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "no summary written" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() && steps.route.outputs.count == 'true' }}
        with:
          name: cloud-machine-count-probe-${{ github.run_id }}
          path: ${{ runner.temp }}/count-probe/
          if-no-files-found: warn
          retention-days: 3
      - name: Surge preview, create, replay, conflict, cleanup on development
        if: ${{ !cancelled() && steps.bun.outcome == 'success' && steps.route.outputs.surge == 'true' }}
        timeout-minutes: 20
        env:
          CMUX_DOGFOOD_STACK_EMAIL: ${{ secrets.CMUX_DOGFOOD_STACK_EMAIL }}
          CMUX_DOGFOOD_STACK_PASSWORD: ${{ secrets.CMUX_DOGFOOD_STACK_PASSWORD }}
        run: bun scripts/cmux-next/cloud-journey.ts --backend dev --surge --out "$RUNNER_TEMP/surge-proof"
      - name: Summary
        if: ${{ always() && steps.route.outputs.surge == 'true' }}
        run: cat "$RUNNER_TEMP/surge-proof/summary.md" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "no summary written" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() && steps.route.outputs.surge == 'true' }}
        with:
          name: cloud-surge-proof-${{ github.run_id }}
          path: ${{ runner.temp }}/surge-proof/
          if-no-files-found: warn
          retention-days: 3
