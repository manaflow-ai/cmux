name: cmux-next iPhone INTERNAL builder trigger

# Decides, on every feat-cmux-next push, whether the head ships to cmux INTERNAL
# and dispatches ios-internal-nightly.yml on rc/cnx-ios-builder with the SHA.
# A dispatch from GITHUB_TOKEN starts a run (GitHub's documented exception), so
# no extra credential is needed. Rules: scripts/ci/ios_internal_builder.py plan
# (iOS change since the last upload, or any change after 12 hours; skip a head
# already uploaded, building or failed; back off 30 min doubling to 6 h while
# builds keep failing). Packages/iOS live in feat-cmux-next itself, so the plan
# never compares them with another branch. The schedule is the periodic fallback
# and runs only once this file is on the default branch.
# Design: plans/cmux-next/ios-testflight-builder-DESIGN.md.
#
# iPhone YOLO (input `yolo`): a person or agent dispatches this with PR numbers, or `label` for every open PR
# labelled ios-yolo. The `yolo` job stacks them on the feat-cmux-next head (scripts/ci/ios_internal_yolo.py),
# pushes the stack to ios-yolo/<stamp> and dispatches the same INTERNAL builder with it: same app, same
# signing, TestFlight installs it, the next nightly replaces it. `decide` skips on such a dispatch.
#   gh workflow run ios-internal-nightly-trigger.yml --ref feat-cmux-next -f yolo="51126 51471"
on:
  push:
    branches: [feat-cmux-next]
  workflow_dispatch:
    inputs:
      yolo:
        description: "iPhone YOLO: PR numbers to stack on feat-cmux-next (or `label` for every open PR labelled ios-yolo); empty runs the nightly decision"
        required: false
        default: ''
        type: string

permissions: {}

# feat-cmux-next moves every minute or two, faster than a decide run, so a
# running decide is never cancelled: one runs, the newest push waits. A person's
# dispatch (the --force past the failure backoff) waits in its own group: in the
# shared one the next push replaced it before it started (run 44328490608,
# 2026-11-18, cancelled after 32 s with no job run).
concurrency:
  group: cmux-mobile-internal-next-trigger${{ github.event_name == 'workflow_dispatch' && '-dispatch' || '' }}
  cancel-in-progress: false

env:
  # Temporary REST budget attribution: one gh-call line per GitHub API call (scripts/ci/api_call_log/env.sh, fetched at a fixed commit when the checkout has no copy).
  BASH_ENV: '$({ w="${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh"; t="${RUNNER_TEMP:-/nonexistent}/api-call-log-src"; if [ -f "$w" ]; then echo "$w"; elif [ -n "${RUNNER_TEMP:-}" ]; then if [ ! -f "$t/env.sh" ] && [ ! -e "$t.tried" ] && { [ "${RUNNER_OS:-}" = Linux ] || [ "${RUNNER_OS:-}" = macOS ]; } && [ "$(date -u +%Y%m%d%H)" -lt 2026112300 ]; then : > "$t.tried"; mkdir -p "$t.part" && for x in env.sh gh sitecustomize.py isolated.py; do curl -fsSL --max-time 5 -o "$t.part/$x" "https://raw.githubusercontent.com/manaflow-ai/cmux/27647ffd3ae838c63be28ca3e5883dcd68c34518/scripts/ci/api_call_log/$x" || break; done; [ -s "$t.part/isolated.py" ] && mv "$t.part" "$t"; fi; if [ -f "$t/env.sh" ]; then echo "$t/env.sh"; else echo unset BASH_ENV > "$t.off.sh" && echo "$t.off.sh"; fi; fi; } 2>/dev/null)'

jobs:
  decide:
    if: github.repository == 'manaflow-ai/cmux' && vars.IOS_INTERNAL_HOLD != '1' && (github.event_name != 'workflow_dispatch' || inputs.yolo == '')
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && (vars.CI_FORK_LINUX_RUNNER || 'ubuntu-24.04') || 'cmux-linux' }}
    timeout-minutes: 15
    permissions:
      # actions: read lists earlier builds; actions: write dispatches one.
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: refs/heads/feat-cmux-next
          # Blobless and sparse: plan reads trees for the diff and two small
          # files; ios_internal_builder.py fetches the last uploaded commit.
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            scripts/ci
            cmux-next-ios/project.yml
            cmux-next-ios/CmuxMobileKit/Package.swift
          sparse-checkout-cone-mode: false

      - name: Decide
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          head="$(git rev-parse HEAD)"
          echo "head=$head" >> "$GITHUB_OUTPUT"
          # A person's dispatch skips the failure backoff (never a running build of the head).
          force=()
          [ "$GITHUB_EVENT_NAME" != workflow_dispatch ] || force=(--force)
          python3 scripts/ci/ios_internal_builder.py plan --head "$head" --repo . "${force[@]}"

      # The signing job runs rc/cnx-ios-builder's own copy of these files (design rule 4), so a change on
      # feat-cmux-next reaches the signer only after an admin fast-forwards that branch. When they drift,
      # the archive passes and the signer can still refuse it: 2026-11-24 #47190 shipped the App Review demo
      # terminal, rc's check-production-binary.sh still forbade it, and every upload failed for 20 h with
      # only a red run on a branch nobody watches. This says so on every push; it never fails the trigger.
      # Trees only (blobless, depth 1), no REST call.
      - name: Signer drift (rc/cnx-ios-builder behind feat-cmux-next)
        run: |
          set -uo pipefail
          if ! git fetch -q --depth=1 --filter=blob:none --no-tags origin refs/heads/rc/cnx-ios-builder; then
            echo "::warning::could not fetch rc/cnx-ios-builder to compare the signer's files"; exit 0
          fi
          signer="$(git rev-parse --short FETCH_HEAD)"
          drift=()
          for f in cmux-next-ios/scripts/check-production-binary.sh cmux-next-ios/scripts/testflight-build.sh .github/workflows/ios-internal-nightly.yml; do
            [ "$(git rev-parse -q --verify "HEAD:$f" || echo none)" = "$(git rev-parse -q --verify "FETCH_HEAD:$f" || echo none)" ] || drift+=("$f")
          done
          [ ${#drift[@]} -gt 0 ] || { echo "signer at $signer has the same files as feat-cmux-next"; exit 0; }
          msg="rc/cnx-ios-builder ($signer) signs with older copies of: ${drift[*]}. An upload can fail at the signer until an admin runs: git push origin $(git rev-parse HEAD):refs/heads/rc/cnx-ios-builder (plans/cmux-next/ios-testflight-builder-DESIGN.md, Operations)"
          echo "::warning::$msg"
          echo "$msg" >> "$GITHUB_STEP_SUMMARY"

      - name: Dispatch the build
        if: steps.plan.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.plan.outputs.head }}
          BASE_SHA: ${{ steps.plan.outputs.base }}
        run: |
          set -euo pipefail
          gh workflow run ios-internal-nightly.yml --repo "$GITHUB_REPOSITORY" --ref rc/cnx-ios-builder \
            -f sha="$HEAD_SHA" -f base="$BASE_SHA"
          echo "dispatched cmux-next-ios INTERNAL $HEAD_SHA (base ${BASE_SHA:-none})" | tee -a "$GITHUB_STEP_SUMMARY"

  # iPhone YOLO: feat-cmux-next plus the named PRs, built by the INTERNAL builder like a nightly.
  yolo:
    if: github.repository == 'manaflow-ai/cmux' && github.event_name == 'workflow_dispatch' && inputs.yolo != ''
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && (vars.CI_FORK_LINUX_RUNNER || 'ubuntu-24.04') || 'cmux-linux' }}
    timeout-minutes: 20
    permissions:
      # contents: write pushes the ios-yolo/ stack branch; actions: write dispatches the builder;
      # pull-requests: write tells a PR it was left out.
      actions: write
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: refs/heads/feat-cmux-next
          # Merging needs the history between feat-cmux-next and each PR; blobless keeps it small.
          fetch-depth: 0
          filter: blob:none

      - name: Stack the PRs and dispatch the build
        env:
          GH_TOKEN: ${{ github.token }}
          YOLO: ${{ inputs.yolo }}
        run: |
          set -euo pipefail
          prs="$YOLO"
          [ "$prs" != label ] || prs=""
          python3 scripts/ci/ios_internal_yolo.py run --prs "$prs"

