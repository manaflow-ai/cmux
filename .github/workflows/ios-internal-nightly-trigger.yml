name: cnx-ios INTERNAL builder trigger

# Decides, on every feat-cmux-next push, whether the head ships to cmux INTERNAL
# and dispatches ios-internal-nightly.yml on rc/cnx-ios-builder with the SHA.
# A dispatch from GITHUB_TOKEN starts a run (GitHub's documented exception), so
# no extra credential is needed. Rules: scripts/ci/ios_internal_builder.py plan
# (iOS change since the last upload, or any change after 12 hours; skip a head
# already uploaded, building or failed). The schedule is the periodic fallback
# and runs only once this file is on the default branch.
# Design: plans/cmux-next/ios-testflight-builder-DESIGN.md.
on:
  push:
    branches: [feat-cmux-next]
  schedule:
    - cron: "41 */2 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: cnx-ios-internal-next-trigger
  cancel-in-progress: true

jobs:
  decide:
    if: github.repository == 'manaflow-ai/cmux' && vars.IOS_INTERNAL_HOLD != '1'
    runs-on: ubuntu-24.04 # github-hosted-required: iOS INTERNAL trigger never waits on Blacksmith
    timeout-minutes: 15
    permissions:
      # actions: read lists earlier builds; actions: write dispatches one.
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: refs/heads/feat-cmux-next
          fetch-depth: 400

      - name: Decide
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          head="$(git rev-parse HEAD)"
          echo "head=$head" >> "$GITHUB_OUTPUT"
          python3 scripts/ci/ios_internal_builder.py plan --head "$head" --repo .

      - name: Dispatch the build
        if: steps.plan.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.plan.outputs.head }}
          BASE_SHA: ${{ steps.plan.outputs.base }}
        run: |
          set -euo pipefail
          gh workflow run ios-internal-nightly.yml --repo "$GITHUB_REPOSITORY" --ref rc/cnx-ios-builder \
            -f sha="$HEAD_SHA" -f base="$BASE_SHA"
          echo "dispatched cnx-ios INTERNAL $HEAD_SHA (base ${BASE_SHA:-none})" | tee -a "$GITHUB_STEP_SUMMARY"
