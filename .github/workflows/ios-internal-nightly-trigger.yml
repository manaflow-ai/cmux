name: cmux-next iPhone INTERNAL builder trigger

# Decides, on every feat-cmux-next push, whether the head ships to cmux INTERNAL
# and dispatches ios-internal-nightly.yml on rc/cnx-ios-builder with the SHA.
# A dispatch from GITHUB_TOKEN starts a run (GitHub's documented exception), so
# no extra credential is needed. Rules: scripts/ci/ios_internal_builder.py plan
# (iOS change since the last upload, or any change after 12 hours; skip a head
# already uploaded, building or failed; skip a head whose shared iOS packages
# drift from upstream, which the archive refuses; back off 30 min doubling to
# 6 h while builds keep failing). The schedule is the periodic fallback
# and runs only once this file is on the default branch.
# Design: plans/cmux-next/ios-testflight-builder-DESIGN.md.
on:
  push:
    branches: [feat-cmux-next]
  schedule:
    - cron: "41 */2 * * *"
  workflow_dispatch:

permissions: {}

# feat-cmux-next moves every minute or two, faster than a decide run, so a
# running decide is never cancelled: one runs, the newest push waits.
concurrency:
  group: cmux-mobile-internal-next-trigger
  cancel-in-progress: false

jobs:
  decide:
    if: github.repository == 'manaflow-ai/cmux' && vars.IOS_INTERNAL_HOLD != '1'
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || !startsWith(vars.LINUX_RUNNER, 'blacksmith-') && vars.LINUX_RUNNER || vars.CI_CLOUD_OVERFLOW_SAVED && 'blacksmith-8vcpu-ubuntu-2404' || 'blacksmith-2vcpu-ubuntu-2404' }}
    timeout-minutes: 15
    permissions:
      # actions: read lists earlier builds; actions: write dispatches one.
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: refs/heads/feat-cmux-next
          # Blobless and sparse: plan reads trees for the diff and two small
          # files; ios_internal_builder.py fetches the last uploaded commit.
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            scripts/ci
            cmux-next-ios/project.yml
            cmux-next-ios/CmuxMobileKit/Package.swift
            cmux-next-ios/scripts/check-tabskit-sync.sh
          sparse-checkout-cone-mode: false

      - name: Decide
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          head="$(git rev-parse HEAD)"
          echo "head=$head" >> "$GITHUB_OUTPUT"
          # A person's dispatch skips the failure backoff (never the drift check or a running build of the head).
          force=()
          [ "$GITHUB_EVENT_NAME" != workflow_dispatch ] || force=(--force)
          python3 scripts/ci/ios_internal_builder.py plan --head "$head" --repo . "${force[@]}"

      - name: Dispatch the build
        if: steps.plan.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.plan.outputs.head }}
          BASE_SHA: ${{ steps.plan.outputs.base }}
        run: |
          set -euo pipefail
          gh workflow run ios-internal-nightly.yml --repo "$GITHUB_REPOSITORY" --ref rc/cnx-ios-builder \
            -f sha="$HEAD_SHA" -f base="$BASE_SHA"
          echo "dispatched cmux-next-ios INTERNAL $HEAD_SHA (base ${BASE_SHA:-none})" | tee -a "$GITHUB_STEP_SUMMARY"
