name: iOS shared packages sync

# cmux-next-ios builds Packages/iOS/CmuxConversation and Packages/iOS/CmuxTabsKit
# only when they are byte-identical to their upstream branches
# (cmux-next-ios/scripts/check-tabskit-sync.sh). On a feat-cmux-next head where
# one drifts, the cmux INTERNAL builder (ios-internal-nightly-trigger.yml) skips
# every build until the bytes match again: #39978 changed two CmuxConversation
# files and INTERNAL stopped from 2026-11-09T23:51Z until the sync #40284.
# This check shows that on the pull request that causes it, with the fix: land
# the same bytes on the upstream branch (a byte-identical sync like #28549),
# before or with this merge. Leo, 2026-11-10: "when we want things to happen in
# iOS, we need them to just happen."
on:
  pull_request:
    branches: [feat-cmux-next]
    paths:
      - Packages/iOS/CmuxConversation/**
      - Packages/iOS/CmuxTabsKit/**
      - cmux-next-ios/scripts/check-tabskit-sync.sh
      - .github/workflows/ios-shared-packages-sync.yml

permissions: {}

concurrency:
  group: ios-shared-packages-sync-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  sync:
    name: ios-shared-packages-sync
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-2vcpu-ubuntu-2404' || contains(fromJSON('["cmux-fleet-linux-x64","blacksmith-4vcpu-ubuntu-2404","blacksmith-16vcpu-ubuntu-2404"]'), fromJSON(vars.RUNNER_POOLS).linux) && fromJSON(vars.RUNNER_POOLS).linux || fromJSON(vars.RUNNER_POOLS).linux_4 }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # The pull request's merge commit, blobless, with only the check script
      # in the work tree: the check compares tree ids from git's object store,
      # and git fetches only the blobs a drift's diffstat needs.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: cmux-next-ios/scripts/check-tabskit-sync.sh
          sparse-checkout-cone-mode: false

      - name: Shared iOS packages match their upstream branches
        run: |
          set -euo pipefail
          # The upstream tips alone, like the checkout: the check compares
          # tree ids, and a plain fetch from a shallow clone would pull each
          # upstream branch's whole history.
          for branch in feat-imsg-parity-gui feat-cmux-next-tabs-kit; do
            git fetch --quiet --depth 1 --filter blob:none origin "+refs/heads/$branch:refs/remotes/origin/$branch"
          done
          if cmux-next-ios/scripts/check-tabskit-sync.sh --ref HEAD --no-fetch | tee "$RUNNER_TEMP/sync.txt"; then
            exit 0
          fi
          {
            echo "### Shared iOS package drift"
            echo
            echo "This merge leaves a shared iOS package different from its upstream branch, so the cmux INTERNAL builder would skip every feat-cmux-next build after it."
            echo "Land the same bytes upstream first (a byte-identical sync pull request into that branch, like #28549), or move the change out of the package."
            echo
            echo '```'
            cat "$RUNNER_TEMP/sync.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::Shared iOS package drift: sync the upstream branch named above before or with this merge (see the job summary)."
          exit 1
