name: cmux NEXT DEV kick

# Every feat-cmux-next merge asks the DEV dispatcher (on main) for the newest
# tip at once, instead of waiting for its cron, which GitHub fired only every
# 15-25 minutes on 2026-10-25 (a merge reached the tip feed 48 minutes later).
# The dispatcher spaces DEV builds five minutes apart, so this starts no build
# per merge; it starts no build at all, only the dispatcher.
on:
  push:
    branches: [feat-cmux-next]

permissions: {}

# A kick has nothing of its own to finish: a newer push's kick replaces a
# pending one, and the running one is a single dispatch call.
concurrency:
  group: cmux-next-dev-kick
  cancel-in-progress: false

jobs:
  kick:
    if: github.repository == 'manaflow-ai/cmux'
    name: Ask the DEV dispatcher for the newest tip
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || !startsWith(vars.LINUX_RUNNER, 'blacksmith-') && vars.LINUX_RUNNER || vars.CI_CLOUD_OVERFLOW_SAVED && 'blacksmith-8vcpu-ubuntu-2404' || 'blacksmith-2vcpu-ubuntu-2404' }}
    timeout-minutes: 3
    permissions:
      actions: write
    steps:
      - name: Dispatch cmux-next-dev-daily-dispatch.yml on main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run cmux-next-dev-daily-dispatch.yml --repo "$GH_REPO" --ref main
