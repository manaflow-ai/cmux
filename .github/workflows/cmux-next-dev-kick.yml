name: cmux NEXT DEV kick

# Every feat-cmux-next merge asks the DEV dispatcher (on main) for the newest
# tip at once, instead of waiting for its cron, which GitHub fired only every
# 15-25 minutes on 2026-10-25 (a merge reached the tip feed 48 minutes later).
# The dispatcher spaces DEV builds five minutes apart, so this starts no build
# per merge; it starts no build at all, only the dispatcher and the nightly-next tick.
on:
  push:
    branches: [feat-cmux-next]

permissions: {}

# A kick has nothing of its own to finish: a newer push's kick replaces a
# pending one, and the running one is a single dispatch call.
concurrency:
  group: cmux-next-dev-kick
  cancel-in-progress: false

env:
  # Temporary REST budget attribution: one gh-call line per GitHub API call (scripts/ci/api_call_log/env.sh, fetched at a fixed commit when the checkout has no copy).
  BASH_ENV: '$({ w="${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh"; t="${RUNNER_TEMP:-/nonexistent}/api-call-log-src"; if [ -f "$w" ]; then echo "$w"; elif [ -n "${RUNNER_TEMP:-}" ]; then if [ ! -f "$t/env.sh" ] && [ ! -e "$t.tried" ] && { [ "${RUNNER_OS:-}" = Linux ] || [ "${RUNNER_OS:-}" = macOS ]; } && [ "$(date -u +%Y%m%d%H)" -lt 2026112300 ]; then : > "$t.tried"; mkdir -p "$t.part" && for x in env.sh gh sitecustomize.py isolated.py; do curl -fsSL --max-time 5 -o "$t.part/$x" "https://raw.githubusercontent.com/manaflow-ai/cmux/27647ffd3ae838c63be28ca3e5883dcd68c34518/scripts/ci/api_call_log/$x" || break; done; [ -s "$t.part/isolated.py" ] && mv "$t.part" "$t"; fi; if [ -f "$t/env.sh" ]; then echo "$t/env.sh"; else echo unset BASH_ENV > "$t.off.sh" && echo "$t.off.sh"; fi; fi; } 2>/dev/null)'

jobs:
  kick:
    if: github.repository == 'manaflow-ai/cmux'
    name: Ask the DEV dispatcher and the nightly-next tick for the newest tip
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-2vcpu-ubuntu-2404' || fromJSON(vars.RUNNER_POOLS).linux_4 }}
    timeout-minutes: 3
    permissions:
      actions: write
    steps:
      - name: Dispatch cmux-next-dev-daily-dispatch.yml on main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run cmux-next-dev-daily-dispatch.yml --repo "$GH_REPO" --ref main
      # The nightly-next tick (nightly-next-tick.yml on main) at landing too. It heard of a landing only from its
      # 5-minute cron, or 15-26 min later when cmux-next or cmux-tui artifacts finished (86dc299b, 2026-11-14: landed
      # 04:29:21Z; they finished 04:44 and 04:55). With no sha the tick applies its rolling rule, which starts nothing
      # beside a running build and promotes only a buildable commit.
      - name: Dispatch nightly-next-tick.yml on main
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run nightly-next-tick.yml --repo "$GH_REPO" --ref main
