name: cmux NEXT DEV kick

# Every feat-cmux-next merge asks the DEV dispatcher (on main) for the newest
# tip at once, instead of waiting for its cron, which GitHub fired only every
# 15-25 minutes on 2026-10-25 (a merge reached the tip feed 48 minutes later).
# The dispatcher spaces DEV builds five minutes apart, so this starts no build
# per merge; it starts no build at all, only the dispatcher and the nightly-next tick.
on:
  push:
    branches: [feat-cmux-next]

permissions: {}

# A kick has nothing of its own to finish: a newer push's kick replaces a
# pending one, and the running one is a single dispatch call.
concurrency:
  group: cmux-next-dev-kick
  cancel-in-progress: false

env:
  # Temporary REST budget attribution: one gh-call line per GitHub API call (scripts/ci/api_call_log/env.sh, fetched at a fixed commit when the checkout has no copy).
  BASH_ENV: '$({ w="${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh"; t="${RUNNER_TEMP:-/nonexistent}/api-call-log-src"; if [ -f "$w" ]; then echo "$w"; elif [ -n "${RUNNER_TEMP:-}" ]; then if [ ! -f "$t/env.sh" ] && [ ! -e "$t.tried" ] && { [ "${RUNNER_OS:-}" = Linux ] || [ "${RUNNER_OS:-}" = macOS ]; } && [ "$(date -u +%Y%m%d%H)" -lt 2026112300 ]; then : > "$t.tried"; mkdir -p "$t.part" && for x in env.sh gh sitecustomize.py isolated.py; do curl -fsSL --max-time 5 -o "$t.part/$x" "https://raw.githubusercontent.com/manaflow-ai/cmux/27647ffd3ae838c63be28ca3e5883dcd68c34518/scripts/ci/api_call_log/$x" || break; done; [ -s "$t.part/isolated.py" ] && mv "$t.part" "$t"; fi; if [ -f "$t/env.sh" ]; then echo "$t/env.sh"; else echo unset BASH_ENV > "$t.off.sh" && echo "$t.off.sh"; fi; fi; } 2>/dev/null)'

jobs:
  kick:
    if: github.repository == 'manaflow-ai/cmux'
    name: Ask the DEV dispatcher and the nightly-next tick for the newest tip
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-2vcpu-ubuntu-2404' || 'blacksmith-4vcpu-ubuntu-2404' }} # frozen-label: holds a write token; tests/test_cmux_next_dev_kick.py keeps it on the ephemeral_only pool
    timeout-minutes: 3
    permissions:
      actions: write
    steps:
      # The kick spends the cmux-bot App's own REST hour first and github.token only when that is refused: on
      # 2026-11-24 every push's kick (runs 45381829805 to 45383131900) went red on "HTTP 403: API rate limit
      # exceeded for installation" with github.token's shared hour spent by other workflows. A failed mint
      # leaves github.token alone. When every token is rate-limited the kick is skipped with a warning, not a
      # red: both workflows it wakes run on their own cron (the dispatcher every 5 minutes, the tick at :07 and
      # :37 and when a cmux-next or cmux-tui artifacts run finishes), so a lost kick only delays the tip feed.
      # Any other failure (a renamed workflow, a refused permission) stays red.
      - name: Mint the cmux-bot token
        id: cmux-bot-token
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.CMUX_BOT_APP_ID }}
          private-key: ${{ secrets.CMUX_BOT_APP_KEY }}
          permission-actions: write

      - name: Dispatch cmux-next-dev-daily-dispatch.yml on main
        env: &kick-env
          BOT_TOKEN: ${{ steps.cmux-bot-token.outputs.token }}
          REPO_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          KICK: |
            kick() {
              local token out
              for token in "$BOT_TOKEN" "$REPO_TOKEN"; do
                [ -n "$token" ] || continue
                if out="$(GH_TOKEN="$token" "$@" 2>&1)"; then
                  [ -z "$out" ] || printf '%s\n' "$out"
                  return 0
                fi
                printf '%s\n' "$out" >&2
                grep -qiE 'rate limit exceeded|secondary rate limit|HTTP 429' <<<"$out" || return 1
              done
              echo "::warning title=DEV kick skipped::every token was rate-limited for: $*; the workflow's own cron picks up the tip"
            }
        run: |
          set -uo pipefail
          eval "$KICK"
          kick gh workflow run cmux-next-dev-daily-dispatch.yml --repo "$GH_REPO" --ref main
      # The nightly-next tick (nightly-next-tick.yml on main) at landing too. It heard of a landing only from its
      # 5-minute cron, or 15-26 min later when cmux-next or cmux-tui artifacts finished (86dc299b, 2026-11-14: landed
      # 04:29:21Z; they finished 04:44 and 04:55). With no sha the tick applies its rolling rule, which starts nothing
      # beside a running build and promotes only a buildable commit.
      - name: Dispatch nightly-next-tick.yml on main
        if: ${{ !cancelled() }}
        env: *kick-env
        run: |
          set -uo pipefail
          eval "$KICK"
          kick gh workflow run nightly-next-tick.yml --repo "$GH_REPO" --ref main
