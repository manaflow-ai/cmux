name: cmux machine channel

# The Cloud machine channel (files.cmux.com/cmux-tui/channels/cloud-machine.json) on every
# feat-cmux-next push that changes its tree (goal cloud-fix-to-machine: a merged cmux-tui fix runs on
# a production Cloud machine within 10 min p50).
#
# Before this the thin build and its point were two jobs of cmux-tui-artifacts.yml
# (MACHINE_CHANNEL_THIN), which builds one feat-cmux-next tree per coalesce window
# (vars.NEXT_TUI_ARTIFACTS_HOLD_MINUTES, 60 min): a coalesced push skips tree-preflight and both jobs
# with it. cmux#54889 (71933dda) waited 75 of its 97 merge-to-channel minutes for that window
# (cmuxterm-hq goals/cloud-fix-to-machine.md, "Where the time goes"). Here nothing waits for it.
#
# Cost: one job-level group per ref and stage on a push (plan, each target's build, the channel writers), with
# cancel-in-progress false: GitHub keeps one running and one pending job in each, and a newer push replaces the
# pending one (only the newest tree matters: the point is forward-only), so at most about 3 thin builds an hour per
# target. The plan job skips the build when the channel already names this commit's tree or a later commit.
# Until 2026-11-26 one workflow-level group held the whole run, so the next build waited for this run's journey
# verdict (about 15 more minutes after the point, at its timeout): runs 45891396585/45895943472 pointed at 20:53Z,
# held the group to 21:09Z, and the next build started 21:11Z. Merge-to-channel was p50 45.7 min, p90 112 over 800
# pushes (10:43-21:13Z, scripts/ci/cmux_machine_channel_latency.py); a stage's group frees when its stage ends.
#
# LINUX_X86_64_FIRST (cmux#55570): each thin musl target is its own build call, so point-x86_64 moves
# the channel for x86_64 machines when that leg is done, and an aarch64 failure never holds it back;
# point-linux adds aarch64 once both legs pass (web-ota-pointer.py newer's completes rule). In run
# 45536155088 (2026-11-25) the x86_64 leg ended at 03:19:28Z and aarch64 failed at 03:27:16Z.
#
# PR_HEAD_FAST_LANE (pursuit "take the build off the critical path"): pr-router.yml also calls this
# workflow on a land's own pull request head only (scripts/ci/pr_router.json land_handoff_only: the labeled
# event that adds ready-to-land or full-ci, or land's update-branch head of a ready-to-land PR; not every
# full-tier push, since both labels stay on across later pushes) whose merge with feat-cmux-next changes the v2 tree key. It builds that
# head's thin pair with no secrets and no R2 write, and points nothing. At merge, the push run's plan
# finds the merged PR's head (commits/SHA/pulls), and when the head has this commit's v2 tree key (the
# same code: a squash of an up-to-date head has the head's tree) and its pr-router run built or is
# building both machine-channel-* artifacts, it skips the cargo build here and the point jobs take those
# artifacts (download-artifact run-id). The bytes still go to cmux-tui/<this sha>/machine/ under this
# commit's payload: the updater takes a binary only from its payload commit's two URLs
# (cmux-host/src/updater/channel.rs allowed_urls), and the channel names a feat-cmux-next commit, so
# "does the machine run merge M" stays an ancestry question. Keys that differ, a fork head, or a head
# build that failed or never ran: the build below runs as before (the slow, canonical path).
#
# Safe beside cmux-tui-artifacts.yml's point-machine-channel (the fat fallback after publish): both
# move the channel forward only (web-ota-pointer.py newer), that one keeps a channel of the same tree
# (--same-tree), and this one's objects are write-once (cmux-machine-linux-bytes.sh early).

on:
  push:
    branches: [feat-cmux-next]
    paths-ignore:
      - "cmux-tui/docs/**"
  # pr-router.yml's caller job (scripts/ci/pr_router.json): a full-tier pull request head, built and never pointed.
  # The router's route job answers the plan (scripts/ci/cmux-machine-channel-pr-plan.sh) and passes it here, so
  # the plan job takes no runner on a pull request; with no answer (build empty) the plan job runs it instead.
  workflow_call:
    inputs:
      build:
        type: string
        default: ""
      x86_64_target_set:
        type: string
        default: ""
      aarch64_target_set:
        type: string
        default: ""
      lto:
        type: string
        default: ""
      artifact_prefix:
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  # A pull request's newer head supersedes its build (pr-router.yml cancels its run too). A push is never held
  # as a whole run: its stages wait in the job-level groups below, so a run's journey never holds the next build.
  group: cmux-machine-channel-${{ github.event_name == 'push' && format('run-{0}', github.run_id) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: does the machine channel need this commit
    # A pull request's router already answered (inputs.build): no runner here.
    if: ${{ github.repository == 'manaflow-ai/cmux' && (inputs.build || '') == '' }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || 'cmux-linux' }}
    # A merge waits here for its head's build still running (PR_HEAD_FAST_LANE, at most 25 min).
    timeout-minutes: 30
    # A push's stage group (see the header); a pull request's run is already one group of its own.
    concurrency:
      group: cmux-machine-channel-plan-${{ github.event_name == 'push' && github.ref || format('run-{0}', github.run_id) }}
      cancel-in-progress: false
    permissions:
      contents: read
      # The merged PR's head (commits/SHA/pulls) and its pr-router run's jobs and artifacts.
      pull-requests: read
      actions: read
    outputs:
      build: ${{ steps.plan.outputs.build }}
      from_run: ${{ steps.plan.outputs.from_run }}
      x86_64_target_set: ${{ steps.plan.outputs.x86_64_target_set }}
      aarch64_target_set: ${{ steps.plan.outputs.aarch64_target_set }}
      lto: ${{ steps.plan.outputs.lto }}
      artifact_prefix: ${{ steps.plan.outputs.artifact_prefix }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 200

      # The owned GCP build lanes reuse the workspace (run 44398113924), as cmux-tui-artifacts.yml.
      - name: Repair a reused self-hosted checkout
        shell: bash
        run: |
          if [ "${RUNNER_ENVIRONMENT:-}" = self-hosted ]; then
            git sparse-checkout disable 2>/dev/null || true
            # No checkout ran (a skipped or failed one): nothing to repair, and no .git to reset.
            if git rev-parse --git-dir >/dev/null 2>&1; then
              git reset -q --hard HEAD
            fi
          fi

      # PR_HEAD_FAST_LANE's lookup polls the API for up to 25 min: on the cmux-bot App's own budget, never
      # the repository's shared GITHUB_TOKEN quota (run 45761272633, 5a2862fb 05:29Z 2026-11-26: "pr-head:
      # lookup failed: HTTP Error 403: Forbidden", so the merge rebuilt; tests/test_ci_no_github_token_polling.py).
      - name: Mint the PR head lookup's App token
        id: app
        if: ${{ github.event_name == 'push' }}
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.CMUX_BOT_APP_ID }}
          private-key: ${{ secrets.CMUX_BOT_APP_KEY }}
          permission-actions: read
          permission-contents: read
          permission-pull-requests: read

      - name: Compare with the channel
        id: plan
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name || '' }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            # PR_HEAD_FAST_LANE, when the router passed no answer: the same script its route job runs.
            scripts/ci/cmux-machine-channel-pr-plan.sh
            exit 0
          fi
          # scripts/cmux-next/cmux-tui-build-profiles.json machine_channel, as tree-preflight reads it.
          python3 -c '
          import json
          p = json.load(open("scripts/cmux-next/cmux-tui-build-profiles.json"))["machine_channel"]
          for k in ("x86_64_target_set", "aarch64_target_set", "lto", "artifact_prefix"):
              print(f"{k}={p[k]}")' >> "$GITHUB_OUTPUT"
          # The channel's commit (an unverified read: it only decides whether to build; a wrong
          # answer at worst leaves the move to point-machine-channel after publish).
          chan="$(curl -fsS --max-time 20 https://files.cmux.com/cmux-tui/channels/cloud-machine.json | python3 -c '
          import base64, json, sys
          print(json.loads(base64.b64decode(json.load(sys.stdin)["payload"]))["commit"])' 2>/dev/null)" || chan=""
          build=true
          if [[ "$chan" =~ ^[0-9a-f]{40}$ && "$chan" != "$GITHUB_SHA" ]]; then
            scripts/ci/timeout.sh 60 git fetch --no-tags --depth=200 origin "$chan" >/dev/null 2>&1 || true
            if git merge-base --is-ancestor "$GITHUB_SHA" "$chan" 2>/dev/null; then
              echo "::notice title=machine channel is ahead::the channel names $chan, a later commit"
              build=false
            else
              tk=scripts/ci/cmux_tui_tree_key.py
              mine="$(scripts/ci/timeout.sh 90 python3 "$tk" --version v2 "$GITHUB_SHA" 2>/dev/null)" || mine=""
              theirs="$(scripts/ci/timeout.sh 90 python3 "$tk" --version v2 "$chan" 2>/dev/null)" || theirs=""
              if [[ "$mine" =~ ^[0-9a-f]{40}$ && "$mine" == "$theirs" ]]; then
                echo "::notice title=machine channel has this tree::$chan has tree key $mine, this commit's"
                build=false
              fi
            fi
          elif [[ "$chan" == "$GITHUB_SHA" ]]; then
            build=false
          fi
          if [[ "$build" == true ]]; then
            # PR_HEAD_FAST_LANE: the merged PR's head build, when it has this commit's tree key.
            from_run="$(GH_TOKEN="$GH_TOKEN" scripts/ci/timeout.sh 1560 python3 -I scripts/ci/cmux_machine_channel_pr_head.py find "$GITHUB_SHA")" || from_run=""
            if [[ "$from_run" =~ ^[0-9]+$ ]]; then
              echo "::notice title=machine channel takes the PR head build::run $from_run built this tree before merge"
              echo "from_run=$from_run" >> "$GITHUB_OUTPUT"
              build=false
            fi
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"

  build-x86_64:
    # Both calls show as "build-machine-channel / build TARGET", as in cmux-tui-artifacts.yml before.
    name: build-machine-channel
    needs: plan
    # A push's stage group (see the header); a pull request's run is already one group of its own.
    concurrency:
      group: cmux-machine-channel-build-x86_64-${{ github.event_name == 'push' && github.ref || format('run-{0}', github.run_id) }}
      cancel-in-progress: false
    # The router's answer on a pull request (plan skipped), else plan's.
    if: ${{ !cancelled() && (inputs.build || needs.plan.outputs.build) == 'true' }}
    permissions:
      contents: read
      # The reusable package workflow's permission ceiling.
      id-token: write
      attestations: write
    uses: ./.github/workflows/cmux-tui-build-package.yml
    # The R2 cargo cache's write credentials (its own thin key), as cmux-tui-artifacts.yml's build-linux.
    secrets:
      CI_CACHE_R2_ACCESS_KEY_ID: ${{ github.ref == 'refs/heads/feat-cmux-next' && secrets.CI_CACHE_R2_ACCESS_KEY_ID || '' }}
      CI_CACHE_R2_SECRET_ACCESS_KEY: ${{ github.ref == 'refs/heads/feat-cmux-next' && secrets.CI_CACHE_R2_SECRET_ACCESS_KEY || '' }}
      CI_CACHE_R2_ACCOUNT_ID: ${{ github.ref == 'refs/heads/feat-cmux-next' && secrets.CI_CACHE_R2_ACCOUNT_ID || '' }}
    with:
      version: 0.0.0-r2.sha-${{ github.event.pull_request.head.sha || github.sha }}
      # A pull request head builds the head itself, never the merge ref (PR_HEAD_FAST_LANE).
      checkout_ref: ${{ github.event.pull_request.head.sha || '' }}
      package_npm: false
      package_pypi: false
      include_windows: false
      target_set: ${{ inputs.x86_64_target_set || needs.plan.outputs.x86_64_target_set }}
      lto: ${{ inputs.lto || needs.plan.outputs.lto }}
      artifact_prefix: ${{ inputs.artifact_prefix || needs.plan.outputs.artifact_prefix }}
      linux_runner: cmux-linux

  build-aarch64:
    # Both calls show as "build-machine-channel / build TARGET", as in cmux-tui-artifacts.yml before.
    name: build-machine-channel
    needs: plan
    # A push's stage group (see the header); a pull request's run is already one group of its own.
    concurrency:
      group: cmux-machine-channel-build-aarch64-${{ github.event_name == 'push' && github.ref || format('run-{0}', github.run_id) }}
      cancel-in-progress: false
    # The router's answer on a pull request (plan skipped), else plan's.
    if: ${{ !cancelled() && (inputs.build || needs.plan.outputs.build) == 'true' }}
    permissions:
      contents: read
      # The reusable package workflow's permission ceiling.
      id-token: write
      attestations: write
    uses: ./.github/workflows/cmux-tui-build-package.yml
    # The R2 cargo cache's write credentials (its own thin key), as cmux-tui-artifacts.yml's build-linux.
    secrets:
      CI_CACHE_R2_ACCESS_KEY_ID: ${{ github.ref == 'refs/heads/feat-cmux-next' && secrets.CI_CACHE_R2_ACCESS_KEY_ID || '' }}
      CI_CACHE_R2_SECRET_ACCESS_KEY: ${{ github.ref == 'refs/heads/feat-cmux-next' && secrets.CI_CACHE_R2_SECRET_ACCESS_KEY || '' }}
      CI_CACHE_R2_ACCOUNT_ID: ${{ github.ref == 'refs/heads/feat-cmux-next' && secrets.CI_CACHE_R2_ACCOUNT_ID || '' }}
    with:
      version: 0.0.0-r2.sha-${{ github.event.pull_request.head.sha || github.sha }}
      # A pull request head builds the head itself, never the merge ref (PR_HEAD_FAST_LANE).
      checkout_ref: ${{ github.event.pull_request.head.sha || '' }}
      package_npm: false
      package_pypi: false
      include_windows: false
      target_set: ${{ inputs.aarch64_target_set || needs.plan.outputs.aarch64_target_set }}
      lto: ${{ inputs.lto || needs.plan.outputs.lto }}
      artifact_prefix: ${{ inputs.artifact_prefix || needs.plan.outputs.artifact_prefix }}
      linux_runner: cmux-linux

  point-x86_64:
    # R2 credentials and the channel signing key.
    environment:
      name: artifacts
      deployment: false
    name: point the Cloud machine channel at this commit's x86_64 Linux build
    needs: [plan, build-x86_64]
    # One channel writer of this workflow at a time on a push (both points share it); a pull request's run is already one group of its own.
    concurrency:
      group: cmux-machine-channel-point-${{ github.event_name == 'push' && github.ref || format('run-{0}', github.run_id) }}
      cancel-in-progress: false
    # This run's build, or the merged PR head's (PR_HEAD_FAST_LANE); a pull request run points nothing.
    if: ${{ !cancelled() && github.event_name == 'push' && (needs.build-x86_64.result == 'success' || needs.plan.outputs.from_run != '') }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || 'cmux-linux' }}
    timeout-minutes: 10
    permissions:
      contents: read
      # Another run's artifacts (the merged PR head's build, PR_HEAD_FAST_LANE).
      actions: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Repair a reused self-hosted checkout
        shell: bash
        run: |
          if [ "${RUNNER_ENVIRONMENT:-}" = self-hosted ]; then
            git sparse-checkout disable 2>/dev/null || true
            # No checkout ran (a skipped or failed one): nothing to repair, and no .git to reset.
            if git rev-parse --git-dir >/dev/null 2>&1; then
              git reset -q --hard HEAD
            fi
          fi

      # Another run's artifacts list through the REST API: on the cmux-bot App's own budget (see plan).
      - name: Mint the PR head download's App token
        id: app
        if: ${{ needs.plan.outputs.from_run != '' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.CMUX_BOT_APP_ID }}
          private-key: ${{ secrets.CMUX_BOT_APP_KEY }}
          permission-actions: read

      - name: Download the machine channel's Linux cmux-tui binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          # The thin copy only (MACHINE_CHANNEL_THIN), never the shipped cmux-tui-* artifacts.
          pattern: machine-channel-cmux-tui-x86_64-unknown-linux-musl
          path: assets/cmux-tui
          merge-multiple: true
          # PR_HEAD_FAST_LANE: the merged PR head's pr-router run when the plan found one; else this run.
          run-id: ${{ needs.plan.outputs.from_run || github.run_id }}
          # A token only for another run's artifacts: with one, download-artifact lists them through the
          # REST API, here on the App's budget above: on the shared GITHUB_TOKEN quota, run 45730730942 (c0374e0b,
          # 01:29Z 2026-11-26) failed both points on "API rate limit exceeded for installation". Empty, it reads
          # this run's own artifacts through the runtime artifact service, as before cmux#56753.
          github-token: ${{ needs.plan.outputs.from_run != '' && steps.app.outputs.token || '' }}

      # The x86_64 machines' half: a set of two claims under its own name (cmux-machine-linux-bytes.sh).
      - name: Upload the Linux binaries and point the channel
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: "https://${{ secrets.CF_R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
          SIGNING_KEY: ${{ secrets.CMUX_WEB_OTA_SIGNING_KEY }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/machine-channel"
          mkdir -p "$dir" && chmod 700 "$dir"
          # Write-once: another run or attempt that uploaded other bytes first keeps them, and this skips.
          rc=0
          scripts/ci/cmux-machine-linux-bytes.sh early assets/cmux-tui || rc=$?
          [[ $rc == 3 ]] && exit 0
          [[ $rc == 0 ]] || exit "$rc"
          python3 scripts/ci/cmux-machine-channel.py payload --binaries-dir assets/cmux-tui --machine-path \
            --commit "$GITHUB_SHA" --committed-at "$(git show -s --format=%ct HEAD)" \
            --download-dir "$dir/binaries" --out "$dir/payload.json" --target x86_64-unknown-linux-musl
          rm -rf "$dir/binaries"
          scripts/ci/cmux-machine-channel-point.sh "$dir/payload.json" "$dir"

  # Adds aarch64 after point-x86_64 (needs it, so the two never race on one commit's channel move).
  point-linux:
    # R2 credentials and the channel signing key.
    environment:
      name: artifacts
      deployment: false
    name: point the Cloud machine channel at this commit's Linux builds
    needs: [plan, build-x86_64, build-aarch64, point-x86_64]
    # One channel writer of this workflow at a time on a push (both points share it); a pull request's run is already one group of its own.
    concurrency:
      group: cmux-machine-channel-point-${{ github.event_name == 'push' && github.ref || format('run-{0}', github.run_id) }}
      cancel-in-progress: false
    if: ${{ !cancelled() && github.event_name == 'push' && ((needs.build-x86_64.result == 'success' && needs.build-aarch64.result == 'success') || needs.plan.outputs.from_run != '') }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || 'cmux-linux' }}
    timeout-minutes: 10
    permissions:
      contents: read
      # Another run's artifacts (the merged PR head's build, PR_HEAD_FAST_LANE).
      actions: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Repair a reused self-hosted checkout
        shell: bash
        run: |
          if [ "${RUNNER_ENVIRONMENT:-}" = self-hosted ]; then
            git sparse-checkout disable 2>/dev/null || true
            # No checkout ran (a skipped or failed one): nothing to repair, and no .git to reset.
            if git rev-parse --git-dir >/dev/null 2>&1; then
              git reset -q --hard HEAD
            fi
          fi

      # Another run's artifacts list through the REST API: on the cmux-bot App's own budget (see plan).
      - name: Mint the PR head download's App token
        id: app
        if: ${{ needs.plan.outputs.from_run != '' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.CMUX_BOT_APP_ID }}
          private-key: ${{ secrets.CMUX_BOT_APP_KEY }}
          permission-actions: read

      - name: Download the machine channel's Linux cmux-tui binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          # The thin copy only (MACHINE_CHANNEL_THIN), never the shipped cmux-tui-* artifacts.
          pattern: machine-channel-cmux-tui-*-unknown-linux-musl
          path: assets/cmux-tui
          merge-multiple: true
          # PR_HEAD_FAST_LANE: the merged PR head's pr-router run when the plan found one; else this run.
          run-id: ${{ needs.plan.outputs.from_run || github.run_id }}
          # A token only for another run's artifacts: with one, download-artifact lists them through the
          # REST API, here on the App's budget above: on the shared GITHUB_TOKEN quota, run 45730730942 (c0374e0b,
          # 01:29Z 2026-11-26) failed both points on "API rate limit exceeded for installation". Empty, it reads
          # this run's own artifacts through the runtime artifact service, as before cmux#56753.
          github-token: ${{ needs.plan.outputs.from_run != '' && steps.app.outputs.token || '' }}

      - name: Upload the Linux binaries and point the channel
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: "https://${{ secrets.CF_R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
          SIGNING_KEY: ${{ secrets.CMUX_WEB_OTA_SIGNING_KEY }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/machine-channel"
          mkdir -p "$dir" && chmod 700 "$dir"
          # Write-once: another run or attempt that uploaded other bytes first keeps them, and this skips.
          rc=0
          scripts/ci/cmux-machine-linux-bytes.sh early assets/cmux-tui || rc=$?
          [[ $rc == 3 ]] && exit 0
          [[ $rc == 0 ]] || exit "$rc"
          python3 scripts/ci/cmux-machine-channel.py payload --binaries-dir assets/cmux-tui --machine-path \
            --commit "$GITHUB_SHA" --committed-at "$(git show -s --format=%ct HEAD)" \
            --download-dir "$dir/binaries" --out "$dir/payload.json"
          rm -rf "$dir/binaries"
          scripts/ci/cmux-machine-channel-point.sh "$dir/payload.json" "$dir"

  # The Cloud machine channel's journey verdict, minutes after point-x86_64 moves it, and its rollback to the
  # last proven build: .github/workflows/cloud-machine-channel-journey.yml (a baseline while this commit builds,
  # the verdict once the channel names it, then the settle). Its own file keeps the journey's leaked-machine age
  # bound off this workflow's jobs. A delivery step, not a gate: both callee jobs are continue-on-error.
  machine-channel-journey-baseline:
    needs: plan
    if: ${{ github.event_name == 'push' && (needs.plan.outputs.build == 'true' || needs.plan.outputs.from_run != '') }}
    permissions:
      contents: read
    uses: ./.github/workflows/cloud-machine-channel-journey.yml
    with:
      phase: baseline
    secrets:
      CMUX_DOGFOOD_STACK_EMAIL: ${{ secrets.CMUX_DOGFOOD_STACK_EMAIL }}
      CMUX_DOGFOOD_STACK_PASSWORD: ${{ secrets.CMUX_DOGFOOD_STACK_PASSWORD }}

  machine-channel-journey:
    needs: [point-x86_64, machine-channel-journey-baseline]
    if: ${{ !cancelled() && needs.point-x86_64.result == 'success' }}
    permissions:
      contents: read
    uses: ./.github/workflows/cloud-machine-channel-journey.yml
    with:
      phase: after
