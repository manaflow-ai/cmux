name: Web complexity candidate

on:
  # This is a fast, contributor-side diagnostic. The authoritative required
  # check runs from the base branch in web-complexity-trusted.yml.
  pull_request:
    paths:
      - web/**
  push:
    branches:
      - main
    paths:
      - web/**
      - .github/workflows/web-complexity.yml
      - scripts/ci/bun-install.sh

permissions:
  contents: read

concurrency:
  group: web-complexity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Temporary REST budget attribution: one gh-call line per GitHub API call (scripts/ci/api_call_log/env.sh).
  BASH_ENV: ${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh

jobs:
  complexity:
    name: Web complexity candidate
    # Pull requests execute contributor-controlled package install scripts. Keep
    # those runs on an ephemeral Blacksmith runner, never a runner variable.
    runs-on: ${{ vars.CI_BLACKSMITH_OFF == '1' && contains(toJSON(github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || (github.event_name == 'pull_request' && vars.CI_CLOUD_OVERFLOW_SAVED && (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-16vcpu-ubuntu-2404' || fromJSON(vars.RUNNER_POOLS).linux_16) || github.event_name == 'pull_request' && (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-4vcpu-ubuntu-2404' || fromJSON(vars.RUNNER_POOLS).linux_4) || vars.LINUX_RUNNER || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-4vcpu-ubuntu-2404' || fromJSON(vars.RUNNER_POOLS).linux_4))), '"blacksmith-') && (github.event.pull_request && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || 'cmux-fleet-linux-x64') || (github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || (github.event_name == 'pull_request' && vars.CI_CLOUD_OVERFLOW_SAVED && (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-16vcpu-ubuntu-2404' || fromJSON(vars.RUNNER_POOLS).linux_16) || github.event_name == 'pull_request' && (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-4vcpu-ubuntu-2404' || fromJSON(vars.RUNNER_POOLS).linux_4) || vars.LINUX_RUNNER || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-4vcpu-ubuntu-2404' || fromJSON(vars.RUNNER_POOLS).linux_4))) }}
    # An install that stalls fails inside scripts/ci/bun-install.sh with its reason; this limit only has to fit a slow
    # registry's two bounded attempts (2 x 300 s) plus the check, so slowness never cancels the job.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Fetch comparison revision
        env:
          COMPARISON_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash scripts/ci/fetch-complexity-base.sh "$COMPARISON_SHA"

      - name: Detect web changes
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CURRENT_SHA: ${{ github.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            changed_files="$(git diff --name-only --diff-filter=ACDMRT "$BASE_SHA" "$CURRENT_SHA" -- web .github/workflows/web-complexity.yml scripts/ci/bun-install.sh)"
          elif [ -n "${BEFORE_SHA:-}" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            changed_files="$(git diff --name-only --diff-filter=ACDMRT "$BEFORE_SHA" "$CURRENT_SHA" -- web .github/workflows/web-complexity.yml scripts/ci/bun-install.sh)"
          else
            changed_files="web/"
          fi

          if [ -n "$changed_files" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Web files changed; running the complexity gate."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No web files changed; the required check is satisfied."
          fi

      - name: Setup Bun
        if: steps.scope.outputs.run == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"

      # The same key as ci-web.yml's web jobs, so a pull request restores the package cache its base branch saved and
      # downloads only what changed. A pull request's save is scoped to its own ref: no other branch's run restores it,
      # so a contributor's install scripts cannot seed a cache that a trusted run reads.
      - name: Cache Bun package cache
        if: steps.scope.outputs.run == 'true'
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('web/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-${{ runner.arch }}-

      - name: Install web dependencies
        if: steps.scope.outputs.run == 'true'
        working-directory: web
        run: bash ../scripts/ci/bun-install.sh --frozen-lockfile

      - name: Validate Oxlint configuration
        if: steps.scope.outputs.run == 'true'
        working-directory: web
        run: ./node_modules/.bin/oxlint --config .oxlintrc.json --print-config app/page.tsx >/dev/null

      - name: Check complexity baseline
        if: steps.scope.outputs.run == 'true'
        working-directory: web
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base_sha="$PR_BASE_SHA"
            bun run lint:complexity -- --base "$base_sha" --head "$HEAD_SHA"
          elif [ -n "${PUSH_BASE_SHA:-}" ] && [ "$PUSH_BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            base_sha="$PUSH_BASE_SHA"
            bun run lint:complexity -- --base "$base_sha" --head "$HEAD_SHA"
          else
            echo "No previous push revision; checking the current baseline without a comparison."
            bun run lint:complexity
          fi
