name: Web complexity

on:
  # Run on every pull request so the required check is reported for both web
  # and non-web changes. The job exits quickly when no web files changed.
  pull_request:
  push:
    branches:
      - main
    paths:
      - web/**
      - .github/workflows/web-complexity.yml

permissions:
  contents: read

concurrency:
  group: web-complexity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  complexity:
    name: Web complexity
    runs-on: ${{ vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect web changes
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CURRENT_SHA: ${{ github.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            changed_files="$(git diff --name-only --diff-filter=ACMRT "$BASE_SHA" "$CURRENT_SHA" -- web)"
          elif [ -n "${BEFORE_SHA:-}" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            changed_files="$(git diff --name-only --diff-filter=ACMRT "$BEFORE_SHA" "$CURRENT_SHA" -- web)"
          else
            changed_files="web/"
          fi

          if [ -n "$changed_files" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Web files changed; running the complexity gate."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No web files changed; the required check is satisfied."
          fi

      - name: Setup Bun
        if: steps.scope.outputs.run == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Install web dependencies
        if: steps.scope.outputs.run == 'true'
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Validate Oxlint configuration
        if: steps.scope.outputs.run == 'true'
        working-directory: web
        run: ./node_modules/.bin/oxlint --config .oxlintrc.json --print-config app/page.tsx >/dev/null

      - name: Check complexity baseline
        if: steps.scope.outputs.run == 'true'
        working-directory: web
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: bun run lint:complexity -- --base "$BASE_SHA" --head "$HEAD_SHA"
