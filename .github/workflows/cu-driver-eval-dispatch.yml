name: cu driver eval dispatcher

# HQ#7146 G3a. Leo, 2026-11-05: "honestly i'd rather us look at lot more at Petal and stuff like we
# ought to be able to get a lot more efficient and start going towards crazy stuff... after being able
# to do the basics end to end and adding eval measurements, ofc". The Computer Use driver eval
# (feat-cmux-next's cu-driver-eval.yml, scripts/measure/cu-driver-eval/README.md) lives only on
# feat-cmux-next, and scheduled workflows run only from the default branch. Once a day this file on
# main starts it on feat-cmux-next, unless a run is already pending. Report only: nothing reads its
# result but the next run's summary diff.
on:
  schedule:
    - cron: "17 11 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: cu-driver-eval-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    if: github.repository == 'manaflow-ai/cmux'
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    permissions:
      actions: write
      contents: read
    timeout-minutes: 5
    steps:
      - name: Start the cu driver eval on feat-cmux-next unless one is pending
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const source = 'feat-cmux-next';
            const workflow = 'cu-driver-eval.yml';
            for (const status of ['queued', 'in_progress', 'waiting', 'pending', 'requested']) {
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner, repo, workflow_id: workflow, branch: source, status, per_page: 5,
              });
              if (data.total_count > 0) {
                core.notice(`A cu driver eval run is already ${status} (run ${data.workflow_runs[0].id}); nothing to start`);
                return;
              }
            }
            await github.rest.actions.createWorkflowDispatch({
              owner, repo, workflow_id: workflow,
              // Fully qualified: a tag named feat-cmux-next must never be picked.
              ref: `refs/heads/${source}`,
            });
            core.notice(`Started the cu driver eval on ${source}`);
