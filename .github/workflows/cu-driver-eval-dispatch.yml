name: cu driver eval dispatcher

# HQ#7146 G3a. Leo, 2026-11-05: "honestly i'd rather us look at lot more at Petal and stuff like we
# ought to be able to get a lot more efficient and start going towards crazy stuff... after being able
# to do the basics end to end and adding eval measurements, ofc". The Computer Use driver eval
# (feat-cmux-next's cu-driver-eval.yml, scripts/measure/cu-driver-eval/README.md) lives only on
# feat-cmux-next, and scheduled workflows run only from the default branch. Once a day this file on
# main starts it on feat-cmux-next, unless a run is already pending. Report only: nothing reads its
# result but the next run's summary diff.
on:
  schedule:
    - cron: "17 11 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: cu-driver-eval-dispatch
  cancel-in-progress: false

env:
  # Temporary REST budget attribution: one gh-call line per GitHub API call (scripts/ci/api_call_log/env.sh, fetched at a fixed commit when the checkout has no copy).
  BASH_ENV: '$({ w="${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh"; t="${RUNNER_TEMP:-/nonexistent}/api-call-log-src"; if [ -f "$w" ]; then echo "$w"; elif [ -n "${RUNNER_TEMP:-}" ]; then if [ ! -f "$t/env.sh" ] && [ ! -e "$t.tried" ] && { [ "${RUNNER_OS:-}" = Linux ] || [ "${RUNNER_OS:-}" = macOS ]; } && [ "$(date -u +%Y%m%d%H)" -lt 2026112300 ]; then : > "$t.tried"; mkdir -p "$t.part" && for x in env.sh gh sitecustomize.py isolated.py; do curl -fsSL --max-time 5 -o "$t.part/$x" "https://raw.githubusercontent.com/manaflow-ai/cmux/27647ffd3ae838c63be28ca3e5883dcd68c34518/scripts/ci/api_call_log/$x" || break; done; [ -s "$t.part/isolated.py" ] && mv "$t.part" "$t"; fi; if [ -f "$t/env.sh" ]; then echo "$t/env.sh"; else echo unset BASH_ENV > "$t.off.sh" && echo "$t.off.sh"; fi; fi; } 2>/dev/null)'

jobs:
  dispatch:
    if: github.repository == 'manaflow-ai/cmux'
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.CI_OVERFLOW_LINUX || 'cmux-linux' }}
    permissions:
      actions: write
      contents: read
    timeout-minutes: 20
    env:
      # A scheduled job's GitHub API waits stop here and fail loud (scripts/ci/gh_budget_wait.sh).
      GH_BUDGET_WAIT_MAX_SECONDS: "900"
    steps:
      # This commit's GitHub API wait (scripts/ci/gh_budget_wait.sh): every later gh call, and
      # each github-script step that installs gh_budget_wait.cjs, waits through a rate limit or a
      # GitHub 5xx under the job's GH_BUDGET_WAIT_MAX_SECONDS, then fails loud.
      - name: Checkout the GitHub API wait
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: .gh-budget-tooling
          sparse-checkout: |
            scripts/ci/gh_budget_wait.sh
            scripts/ci/gh_budget_wait.cjs
          sparse-checkout-cone-mode: false
      - name: Wait through GitHub API rate limits and 5xx in this job
        working-directory: ${{ github.workspace }}
        run: bash .gh-budget-tooling/scripts/ci/gh_budget_wait.sh --install

      - name: Start the cu driver eval on feat-cmux-next unless one is pending
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            if (process.env.GH_BUDGET_WAIT_JS) require(process.env.GH_BUDGET_WAIT_JS).install({ github, core });
            const { owner, repo } = context.repo;
            const source = 'feat-cmux-next';
            const workflow = 'cu-driver-eval.yml';
            // feat-cmux-next dropped its cu-driver-eval.yml in cmux#37003 (the Rust Computer Use
            // engine). Without that copy GitHub answers a dispatch with 422 "does not have
            // 'workflow_dispatch' trigger", which turned every daily tick red. Say so instead.
            try {
              await github.rest.repos.getContent({ owner, repo, path: `.github/workflows/${workflow}`, ref: `refs/heads/${source}` });
            } catch (error) {
              if (error.status !== 404) throw error;
              core.notice(`${source} has no ${workflow} (removed in cmux#37003); no cu driver eval to start`);
              return;
            }
            for (const status of ['queued', 'in_progress', 'waiting', 'pending', 'requested']) {
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner, repo, workflow_id: workflow, branch: source, status, per_page: 5,
              });
              if (data.total_count > 0) {
                core.notice(`A cu driver eval run is already ${status} (run ${data.workflow_runs[0].id}); nothing to start`);
                return;
              }
            }
            await github.rest.actions.createWorkflowDispatch({
              owner, repo, workflow_id: workflow,
              // Fully qualified: a tag named feat-cmux-next must never be picked.
              ref: `refs/heads/${source}`,
            });
            core.notice(`Started the cu driver eval on ${source}`);
