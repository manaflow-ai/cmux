name: command palette search benchmarks

# The wall-clock command-palette search benchmarks are gated out of the sharded
# app-host unit suite by CMUX_COMMAND_PALETTE_SEARCH_BENCHMARKS (see
# skipUnlessCommandPaletteSearchBenchmarksAreEnabled in
# cmuxTests/CommandPaletteNucleoFixtures.swift). A gate with no caller at all is
# deletion with extra steps: the benchmarks keep compiling and stop running.
# This workflow is that caller -- dispatch-only while automatic CI is paused, so
# running the benchmarks is a deliberate act rather than a daily cost. It runs
# the one script that owns the gate,
# scripts/test-command-palette-nucleo-ffi.sh, which enables the env var and
# names both benchmark classes; the script's own BENCH assertions fail the job
# if any gated benchmark silently skipped.
on:
  # Temporarily manual-only beginning 2026-07-13 to pause automatic CI.
  # tmux-corpus.yml and perf-activation.yml -- the two closest macOS
  # benchmark nightlies -- both carry this and have their crons removed.
  # A new cron here would quietly reverse that reduction, so the gate's
  # caller is dispatch-only until the pause lifts.
  workflow_dispatch:
    inputs:
      runner:
        description: macOS runner (auto follows MACOS_RUNNER_15)
        required: false
        default: auto
        type: choice
        options:
          - auto
          - blacksmith-6vcpu-macos-15
          - blacksmith-6vcpu-macos-26
          - blacksmith-6vcpu-macos-latest

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  command-palette-search-benchmarks:
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || ((!inputs.runner || inputs.runner == 'auto') && (vars.CI_PAID_MACOS_OVERFLOW == '1' && vars.MACOS_RUNNER_15 || 'blacksmith-6vcpu-macos-15') || inputs.runner) }}
    timeout-minutes: 60
    env:
      # XCTest app-host crashes can leave xcodebuild waiting in Swift's crash
      # backtracer until the job timeout. Keep crash handling non-interactive
      # and cheap so xcodebuild can restart/finish the suite.
      SWIFT_BACKTRACE: "interactive=no,timeout=0s,symbolicate=off,color=no"
      # Declared here, not in a step, so the always() summary and upload steps
      # still have a path when an earlier step fails.
      CMUX_NUCLEO_FFI_LOG: ${{ github.workspace }}/command-palette-search-benchmarks.log
    steps:
      - name: Clear stale git locks (self-hosted reused workspace)
        shell: bash
        run: |
          # Self-hosted macOS runners reuse the workspace. A job cancelled or
          # killed mid-checkout can leave a stale .git/modules/*/index.lock that
          # fails every later submodule checkout (e.g. ghostty). Clear them first.
          ws="${GITHUB_WORKSPACE:-$PWD}"
          rm -f "$ws/.git/index.lock" 2>/dev/null || true
          if [ -d "$ws/.git/modules" ]; then
            find "$ws/.git/modules" -type f -name "*.lock" -delete 2>/dev/null || true
          fi

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: recursive

      - name: Select Xcode
        run: |
          set -euo pipefail
          ./scripts/select-ci-xcode.sh

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Cache GhosttyKit.xcframework
        id: cache-ghosttykit
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: GhosttyKit.xcframework
          key: ghosttykit-sentry-off-v1-${{ hashFiles('.gitmodules', 'ghostty/**') }}

      - name: Download pre-built GhosttyKit.xcframework
        if: steps.cache-ghosttykit.outputs.cache-hit != 'true'
        run: ./scripts/download-prebuilt-ghosttykit.sh

      - name: Install zig
        run: ./scripts/install-zig-ci.sh

      - name: Install Rust
        run: ./scripts/install-rust-ci.sh

      - name: Cache Swift packages
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .ci-source-packages
          key: command-palette-bench-spm-${{ hashFiles('cmux.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: command-palette-bench-spm-

      - name: Sanitize Swift package cache
        run: python3 scripts/ci/sanitize-xcode-source-packages-cache.py .ci-source-packages

      - name: Prepare isolated DerivedData
        run: |
          set -euo pipefail
          DERIVED_DATA_PATH="${RUNNER_TEMP}/cmux-derived-data-command-palette-bench-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf "$DERIVED_DATA_PATH"
          mkdir -p "$DERIVED_DATA_PATH"
          echo "CMUX_NUCLEO_FFI_DERIVED_DATA=$DERIVED_DATA_PATH" >> "$GITHUB_ENV"

      - name: Resolve Swift packages
        run: |
          set -euo pipefail
          SOURCE_PACKAGES_DIR="$PWD/.ci-source-packages"
          mkdir -p "$SOURCE_PACKAGES_DIR"
          xcodebuild -project cmux.xcodeproj -scheme cmux-unit -configuration Debug \
            -derivedDataPath "$CMUX_NUCLEO_FFI_DERIVED_DATA" \
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES_DIR" \
            -resolvePackageDependencies

      - name: Run command palette search benchmarks
        run: |
          set -euo pipefail
          CMUX_NUCLEO_FFI_SOURCE_PACKAGES="$PWD/.ci-source-packages" \
            ./scripts/test-command-palette-nucleo-ffi.sh

      - name: Write benchmark summary
        if: always()
        run: |
          set -euo pipefail
          {
            echo "## Command palette search benchmarks"
            echo ""
            if [ -f "$CMUX_NUCLEO_FFI_LOG" ]; then
              grep 'BENCH cmd+' "$CMUX_NUCLEO_FFI_LOG" | sed 's/^/- `/; s/$/`/' || echo "No BENCH lines were emitted."
            else
              echo "The benchmark invocation produced no log."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: command-palette-search-benchmarks
          path: ${{ env.CMUX_NUCLEO_FFI_LOG }}
          if-no-files-found: ignore
