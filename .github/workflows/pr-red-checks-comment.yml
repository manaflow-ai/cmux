name: PR red checks comment

# The `checks` line of the status comment on a pull request into feat-cmux-next lists its red
# web and size checks (scripts/ci/pr_red_checks_comment.py, scripts/ci/pr_status.py). The checks
# stay advisory (chief 2026-10-12); this makes a red one impossible to miss. Each workflow that runs tracked checks calls this after them; every
# call recomputes from all check runs of the head commit, and the per-PR group orders the calls.
# The script comes from the base commit, never the pull request's code.
on:
  workflow_call:
    inputs:
      own_checks_green:
        # Whether the caller's tracked jobs all passed (or were skipped). Then a status line that
        # names no red has nothing for this call to change, and the script reads no check runs.
        type: boolean
        default: false

permissions: {}

jobs:
  comment:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'feat-cmux-next' }}
    # A declared light job (.github/runners.json hosted_light_jobs): one comment edit, 3-9 s of work.
    # Attempt 1 takes GitHub-hosted Ubuntu; it holds a pull-requests write token, so a re-run stays
    # ephemeral: the bounded LINUX_RUNNER mirror, then Blacksmith 8 vCPU (16 under the overflow switch).
    # On 2026-11-02 it waited up to 61 s on the saturated blacksmith-4vcpu-ubuntu-2404 queue.
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-4vcpu-ubuntu-2404' || github.run_attempt == 1 && 'ubuntu-24.04' || contains(fromJSON('["blacksmith-4vcpu-ubuntu-2404","blacksmith-8vcpu-ubuntu-2404","blacksmith-16vcpu-ubuntu-2404"]'), vars.LINUX_RUNNER) && vars.LINUX_RUNNER || vars.CI_CLOUD_OVERFLOW_SAVED && fromJSON(vars.RUNNER_POOLS).linux_16 || fromJSON(vars.RUNNER_POOLS).linux_8 }}
    timeout-minutes: 5
    continue-on-error: true
    concurrency:
      group: pr-red-checks-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      # actions: read for each red check's job steps (the base comparison in the script).
      actions: read
      checks: read
      contents: read
      pull-requests: write
    steps:
      - name: Checkout the comment script from the base commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          sparse-checkout: |
            scripts/ci/pr_red_checks_comment.py
            scripts/ci/pr_status.py
          sparse-checkout-cone-mode: false

      - name: Update the red checks line
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # Each red check is compared with this commit's run of it: new reds block, base reds do not.
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          OWN_CHECKS_GREEN: ${{ inputs.own_checks_green }}
        run: python3 scripts/ci/pr_red_checks_comment.py
