name: R2 storage census

# Read-only: lists every R2 bucket each CI key can see and reports bytes by key
# family and age (scripts/ci/r2_storage_census.py), so keep and prune rules are
# chosen against measured storage. It never writes or deletes. Each key runs in
# the environment that already guards it; the cmux-nightly-next bucket's key is
# limited to the nightly-next branch and is not read here.
on:
  schedule:
    - cron: "41 6 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: r2-storage-census
  cancel-in-progress: false

jobs:
  binaries:
    name: Census (binaries)
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || contains(fromJSON('["blacksmith-4vcpu-ubuntu-2404","blacksmith-16vcpu-ubuntu-2404","blacksmith-32vcpu-ubuntu-2404"]'), vars.LINUX_RUNNER) && vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 30
    environment: artifacts
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Census
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ format('https://{0}.r2.cloudflarestorage.com', secrets.CF_R2_ACCOUNT_ID) }}
          BUCKETS: cmux-binaries cmux-fleet-artifacts
        run: |
          set -euo pipefail
          args=(--endpoint-url "$R2_ENDPOINT" --json-out "$RUNNER_TEMP/r2-census-binaries.json")
          for bucket in $BUCKETS; do args+=(--bucket "$bucket"); done
          python3 scripts/ci/r2_storage_census.py "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload census
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: r2-census-binaries
          path: ${{ runner.temp }}/r2-census-binaries.json
          if-no-files-found: ignore
          retention-days: 30

  cef:
    name: Census (cef)
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || contains(fromJSON('["blacksmith-4vcpu-ubuntu-2404","blacksmith-16vcpu-ubuntu-2404","blacksmith-32vcpu-ubuntu-2404"]'), vars.LINUX_RUNNER) && vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Census
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CMUX_CEF_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CMUX_CEF_R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ format('https://{0}.r2.cloudflarestorage.com', secrets.CMUX_CEF_R2_ACCOUNT_ID) }}
          BUCKETS: cmux-cef
        run: |
          set -euo pipefail
          args=(--endpoint-url "$R2_ENDPOINT" --json-out "$RUNNER_TEMP/r2-census-cef.json")
          for bucket in $BUCKETS; do args+=(--bucket "$bucket"); done
          python3 scripts/ci/r2_storage_census.py "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload census
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: r2-census-cef
          path: ${{ runner.temp }}/r2-census-cef.json
          if-no-files-found: ignore
          retention-days: 30

  ci-cache:
    name: Census (ci-cache)
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || contains(fromJSON('["blacksmith-4vcpu-ubuntu-2404","blacksmith-16vcpu-ubuntu-2404","blacksmith-32vcpu-ubuntu-2404"]'), vars.LINUX_RUNNER) && vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 30
    environment: ${{ github.ref == 'refs/heads/main' && 'ci-cache-writer' || '' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Census
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CI_CACHE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CI_CACHE_R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ format('https://{0}.r2.cloudflarestorage.com', secrets.CI_CACHE_R2_ACCOUNT_ID) }}
          BUCKETS: cmux-ci-cache
        run: |
          set -euo pipefail
          args=(--endpoint-url "$R2_ENDPOINT" --json-out "$RUNNER_TEMP/r2-census-ci-cache.json")
          for bucket in $BUCKETS; do args+=(--bucket "$bucket"); done
          python3 scripts/ci/r2_storage_census.py "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload census
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: r2-census-ci-cache
          path: ${{ runner.temp }}/r2-census-ci-cache.json
          if-no-files-found: ignore
          retention-days: 30
