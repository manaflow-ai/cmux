name: Seed DerivedData (pool)

# One pool's DerivedData seed for seed-derived-data.yml, which calls this once
# per pool decide picked (its `seed` matrix, with that job's concurrency lane).
#
# `seed` builds on the pool itself, which may be a reused owned Mac (the
# trusted pool, or the owned pull-request pool MACOS_RUNNER_PR names), so it
# holds no secret and a read-only token. Restoring a seed needs neither: it
# reads the public URL (scripts/ci/r2-cache.sh). Where it used to upload to
# R2, it packs the archive r2-cache.sh would upload and puts it in this run's
# artifacts. `save`, on an ephemeral Linux runner no variable can move, holds
# the ci-cache-writer R2 keys and uploads those archives under the keys the
# old steps saved them under, and only the exact artifact (by id) and bytes
# (by sha256) this lane's build handed over. `attribute`, beside it, holds the write token
# that starts ci-compile-attribution.yml when the build fails.
#
# The job id `seed` is load-bearing: glaeda's job-started hook classes this
# job by (seed-derived-data.yml, seed), since a called workflow's
# GITHUB_WORKFLOW_REF names the caller and GITHUB_JOB the job here. GitHub
# lists the jobs as "seed (<pool>) / seed" and "seed (<pool>) / save";
# seed_decide.py, reuse_app_host_products.py and main_compile_attribution.py
# read them by those names and steps.

on:
  workflow_call:
    inputs:
      pool:
        description: The runner label to build on (decide's matrix.pool).
        required: true
        type: string
      root:
        description: The canonical root of a trusted-pool lane (decide's matrix.root), or empty for root 1.
        required: false
        type: string
        default: ""
      publisher:
        description: The pool that publishes the app-host product when it builds (decide's publisher).
        required: false
        type: string
        default: ""
    # Only `save` reads these, on its ephemeral runner, inside ci-cache-writer
    # (main only). They exist only in that environment, but GitHub resolves an
    # environment secret in a called workflow only when the caller passes it
    # by name; otherwise it is empty and every save silently writes nothing.
    secrets:
      CI_CACHE_R2_ACCESS_KEY_ID:
        required: true
      CI_CACHE_R2_SECRET_ACCESS_KEY:
        required: true
      CI_CACHE_R2_ACCOUNT_ID:
        required: true

permissions:
  contents: read

# A called workflow does not inherit the caller's env. r2-cache.sh restores
# through the public URL and refuses to save without it, so without this env
# every restore missed and every save wrote nothing.
env:
  CI_CACHE_R2_PUBLIC_URL: ${{ vars.CI_CACHE_R2_PUBLIC_URL || 'https://ci-cache.cmux.com' }}

jobs:
  seed:
    # Must match pull-request and main full-suite compile admission: the seed
    # key carries the toolchain and the build paths, so a mismatch is a miss,
    # not a wrong hit. tests/test_seed_derived_data.py evaluates both routes.
    runs-on: ${{ inputs.pool }}
    permissions:
      contents: read
    # A chain with no seed yet builds cold. The first root 2 seed on the
    # trusted pool (cmux11s) spent 14 minutes on checkout, packages and
    # resolve, then 44 in Build, and 60 cancelled it before it saved, so the
    # next push built cold again (run 36107956813). A seeded build finishes
    # in a fraction of either limit. 30 more minutes cover the wait for this
    # job's canonical root (Prepare admission build paths).
    timeout-minutes: 120
    outputs:
      # The save and attribute jobs act on these. Each archive is bound to this
      # job: the save job downloads the artifact by the id its upload returned
      # (not by name, which another job of the run could upload over), and
      # publishes it only with the sha256 its pack gave. An id is empty when
      # that upload did not run or failed. A re-run of only the save job keeps
      # these outputs, so it still fetches this attempt's artifacts.
      build: ${{ steps.build.outcome }}
      seed-key: ${{ steps.key.outputs.scoped }}${{ github.sha }}
      seed-artifact: ${{ steps.seed-upload.outputs.artifact-id }}
      seed-sha256: ${{ steps.seed-pack.outputs.packed-sha256 }}
      swift-packages-artifact: ${{ steps.swift-package-upload.outputs.artifact-id }}
      swift-packages-sha256: ${{ steps.swift-package-pack.outputs.packed-sha256 }}
      swiftpm-manifests-key: ${{ steps.swiftpm-manifest-key.outputs.key }}
      swiftpm-manifests-artifact: ${{ steps.swiftpm-manifest-upload.outputs.artifact-id }}
      swiftpm-manifests-sha256: ${{ steps.swiftpm-manifest-pack.outputs.packed-sha256 }}
      git-seed-artifact: ${{ steps.git-seed-upload.outputs.artifact-id }}
      git-seed-sha256: ${{ steps.git-seed.outputs.sha256 }}
    env:
      # The macOS 15 pool compiles with its own Xcode, as a pull request run
      # pr_runner_pool.py overflows there does; every other pool, the lane's.
      CMUX_CI_XCODE_APP: ${{ endsWith(inputs.pool, 'vcpu-macos-15') && vars.CMUX_CI_XCODE_APP_MACOS_15 || vars.CMUX_CI_XCODE_APP_PR || vars.CMUX_CI_XCODE_APP_MACOS_15 }}
      CMUX_CI_REQUIRED_MACOS_SDK_MAJOR: "26"
      CMUX_SKIP_ZIG_BUILD: "1"
      CMUX_SEED_ROOT: ${{ inputs.root }}
    steps:
      - name: Clear stale git locks (self-hosted reused workspace)
        shell: bash
        run: |
          ws="${GITHUB_WORKSPACE:-$PWD}"
          rm -f "$ws/.git/index.lock" 2>/dev/null || true
          if [ -d "$ws/.git/modules" ]; then
            find "$ws/.git/modules" -type f -name "*.lock" -delete 2>/dev/null || true
          fi

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: recursive

      - name: Prepare admission build paths
        env:
          MATRIX_POOL: ${{ inputs.pool }}
          TRUSTED_POOL: ${{ vars.CI_SEED_TRUSTED_POOL }}
        run: |
          set -euo pipefail
          # The same paths as ci-macos.yml compile admission: they are part of
          # the seed key. A root lane builds where an owned Mac's second
          # compile slot does. glaeda pins this job (one it does not know) to
          # root 1, and the trusted runner runs nothing else, so the root is
          # this job's alone.
          if [ -x scripts/ci/canonical-build-root.sh ]; then
            root="$(scripts/ci/canonical-build-root.sh --print-root)"
          else
            root="${CMUX_CI_CANONICAL_ROOT:?canonical root resolver is unavailable}"
          fi
          if [ -n "$CMUX_SEED_ROOT" ]; then
            case "$CMUX_SEED_ROOT:$MATRIX_POOL" in
              [2-9]:"$TRUSTED_POOL") ;;
              *) echo "::error::root $CMUX_SEED_ROOT is only for the trusted pool, not $MATRIX_POOL"; exit 1 ;;
            esac
            root="/private/tmp/cmux-ci-$CMUX_SEED_ROOT"
            echo "CMUX_CI_CANONICAL_ROOT=$root" >> "$GITHUB_ENV"
          fi
          # A far and a near seed of one root may run at once (the two
          # concurrency lanes), so on an owned Mac hold this root for the job
          # before clearing it. With glaeda's seed class the hook gives a seed
          # job no root, and this take holds (and waits for) the one its matrix
          # names. A hook that placed the job itself answers 2 for any other
          # root: then the root it exported must be this one, or the Mac runs
          # one seed at a time (one trusted runner), as before. A near and a far
          # seed of one root on one Mac queue here for up to 30 minutes, inside
          # the job's limit. Blacksmith has no helper.
          helper=/Users/Shared/cmux-build-fleet/bin/glaeda-canonical-root
          if [ -x "$helper" ]; then
            status=0
            "$helper" take "$root" --wait 1800 >/dev/null || status=$?
            placed="$(cat "${RUNNER_TEMP:-/nonexistent}/glaeda-canonical-root" 2>/dev/null || true)"
            case "$status" in
              0) echo "Holding $root for this job" ;;
              2) if [ "$placed" = "$root" ]; then
                   echo "The runner hook placed this job in $root"
                 else
                   echo "::warning::glaeda holds ${placed:-no root} for this job, not $root; safe only while this Mac runs one seed at a time (glaeda canonicalRoots must cover every seed root before a second trusted runner)"
                 fi ;;
              *) echo "::error::could not hold $root for this job (glaeda-canonical-root exit $status)"; exit 1 ;;
            esac
          fi
          scripts/ci/clear-dirs.sh "$root/derived-data-compile-admission" "$root/compile-admission-cas"
          echo "CMUX_COMPILE_ADMISSION_DERIVED_DATA=$root/derived-data-compile-admission" >> "$GITHUB_ENV"
          echo "CMUX_COMPILE_ADMISSION_CAS=$root/compile-admission-cas" >> "$GITHUB_ENV"
          if [ -z "$CMUX_SEED_ROOT" ]; then
            echo "CMUX_CI_CANONICAL_ROOT=$root" >> "$GITHUB_ENV"
          fi

      - name: Select Xcode
        run: ./scripts/select-ci-xcode.sh

      # A trusted seed Mac keeps the seeds it builds and adopts, so the next
      # seed job on it clones its lane's last seed instead of downloading it
      # back from R2 (mini-6 and cmux15 seed jobs spent p50 856 s and 512 s
      # at about 1.9 busy cores on 2026-09-25, cmuxterm-hq#661 Workstream 7).
      # Only on the runners vars.CI_SEED_KEEP_LOCAL_RUNNERS names (space
      # separated): the kept seed becomes the next R2 seed, so the Mac must
      # run nothing else as this user (cmux15; not mini-6, whose dev-build
      # worker builds PR code as cmux). The same per-root layout owned
      # admission uses (seed_caches). It starts with 185 GiB free, and once
      # the cache exists it stays on so prune_local keeps the disk at its
      # floor (seed_derived_data.LOCAL_KEEP_MIN_FREE_BYTES, and each root's
      # newest two).
      - name: Keep seeds on a trusted Mac
        if: inputs.pool == vars.CI_SEED_TRUSTED_POOL && contains(format(' {0} ', vars.CI_SEED_KEEP_LOCAL_RUNNERS), format(' {0} ', runner.name))
        continue-on-error: true
        run: |
          set -euo pipefail
          state=/Users/Shared/cmux-build-fleet/ci
          cache="$state/seeds"
          if [ -n "$CMUX_SEED_ROOT" ] && [ "$CMUX_SEED_ROOT" != 1 ]; then
            cache="$state/cmux-ci-$CMUX_SEED_ROOT/seeds"
          fi
          free_gib=$(df -g / | awk 'NR==2 {print $4}')
          if [ -d "$cache" ] || [ "${free_gib:-0}" -ge 185 ]; then
            echo "CMUX_SEED_LOCAL_CACHE=$cache" >> "$GITHUB_ENV"
            echo "Keeping seeds in $cache ($free_gib GiB free)"
          else
            echo "Not keeping seeds on this Mac: $free_gib GiB free, under 185"
          fi

      - name: Compute seed key
        id: key
        run: |
          set -euo pipefail
          fingerprint="$(scripts/ci/compile-app-host-test-product.sh canonical-fingerprint "$CMUX_COMPILE_ADMISSION_DERIVED_DATA")"
          prefix="admission-derived-data-v1-${RUNNER_OS}-${RUNNER_ARCH}-${fingerprint}-"
          # Adoption scopes the prefix itself; the save names this width.
          scoped="$(python3 scripts/ci/seed_derived_data.py scope "$prefix")"
          test -n "$scoped"
          echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
          echo "scoped=$scoped" >> "$GITHUB_OUTPUT"

      - name: Install compilation dependencies
        run: |
          ./scripts/install-rust-ci.sh
          ./scripts/download-prebuilt-ghosttykit.sh

      # The same contract compile admission computes: product inputs, Xcode,
      # SDK, host major, tool versions and the canonical build location. It
      # reads rustc and cargo, so it follows the install above.
      - name: Identify reusable compiled products
        id: product-key
        run: python3 scripts/ci/reuse_app_host_products.py key "$CMUX_COMPILE_ADMISSION_DERIVED_DATA"

      - name: Cache Swift packages
        id: swift-package-cache
        uses: ./.github/actions/cache-restore
        with:
          backend: ${{ vars.CI_CACHE_BACKEND || 'r2' }}
          path: .ci-source-packages
          key: spm-${{ hashFiles('cmux.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'scripts/ci/swiftpm-cache-layout') }}
          restore-keys: spm-

      - name: Sanitize Swift package cache
        run: python3 scripts/ci/sanitize-xcode-source-packages-cache.py .ci-source-packages

      # SwiftPM's evaluated-manifest cache, which compile admission restores
      # read-only (scripts/ci/swiftpm-manifest-cache.sh). Exact key only: a
      # miss starts empty so the saved cache holds just this revision's
      # manifests, at the canonical path admission resolves from. Root 1 only:
      # the key does not name the root, so a root lane could win the
      # write-once save with entries no root 1 reader hits, and its clear
      # would empty the cache every slot on that Mac shares. Owned Macs keep
      # their other roots' entries themselves (`install` merges).
      - name: Compute SwiftPM manifest cache key
        id: swiftpm-manifest-key
        run: scripts/ci/swiftpm-manifest-cache.sh key >> "$GITHUB_OUTPUT"

      - name: Restore SwiftPM manifest cache
        id: swiftpm-manifest-restore
        if: inputs.root == ''
        continue-on-error: true
        uses: ./.github/actions/cache-restore
        with:
          backend: ${{ vars.CI_CACHE_BACKEND || 'r2' }}
          path: ${{ runner.temp }}/swiftpm-manifests
          key: ${{ steps.swiftpm-manifest-key.outputs.key }}

      - name: Install SwiftPM manifest cache
        if: inputs.root == ''
        run: |
          set -euo pipefail
          if [ "$MANIFEST_CACHE_HIT" = true ]; then
            scripts/ci/swiftpm-manifest-cache.sh install "$RUNNER_TEMP/swiftpm-manifests"
          else
            scripts/ci/swiftpm-manifest-cache.sh clear
          fi
        env:
          MANIFEST_CACHE_HIT: ${{ steps.swiftpm-manifest-restore.outputs.cache-hit }}

      - name: Resolve Swift packages
        run: |
          set -euo pipefail
          scripts/ci/compile-app-host-test-product.sh canonical-resolve \
            "$CMUX_COMPILE_ADMISSION_DERIVED_DATA" "$PWD/.ci-source-packages"

      # Seed the `spm-` package cache from the first main push after a
      # Package.resolved change, instead of waiting up to a day for nightly.yml.
      # canonical-resolve resolved a copy in the canonical root, so the
      # workspace still holds only what was restored (on a miss, the previous
      # lockfile's packages); save the resolved copy, as nightly.yml does.
      # Packed and uploaded right after resolve, so a later failure cannot
      # lose it: the save job publishes it whatever this job's result. R2
      # saves are write-once per key, so matrix legs racing there are harmless.
      - name: Collect resolved Swift packages
        id: swift-package-collect
        if: steps.swift-package-cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          set -euo pipefail
          resolved="$CMUX_CI_CANONICAL_ROOT/src/.ci-source-packages"
          test -d "$resolved/.package-cache"
          rsync -a --delete "$resolved/" .ci-source-packages/
          python3 scripts/ci/sanitize-xcode-source-packages-cache.py .ci-source-packages

      # The R2 backend packs here and the save job uploads; any other backend
      # saves from this job, which needs no secret for it.
      - name: Pack Swift packages
        id: swift-package-pack
        if: steps.swift-package-collect.outcome == 'success'
        continue-on-error: true
        uses: ./.github/actions/cache-save
        with:
          backend: ${{ vars.CI_CACHE_BACKEND || 'r2' }}
          path: .ci-source-packages
          key: spm-${{ hashFiles('cmux.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'scripts/ci/swiftpm-cache-layout') }}
          pack-to: ${{ runner.temp }}/r2-pack/swift-packages

      - name: Upload packed Swift packages
        id: swift-package-upload
        if: steps.swift-package-pack.outcome == 'success' && (vars.CI_CACHE_BACKEND || 'r2') == 'r2'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: r2-pack-swift-packages-${{ inputs.pool }}${{ inputs.root && format('-root-{0}', inputs.root) || '' }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/r2-pack/swift-packages
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Stage SwiftPM manifest cache
        id: swiftpm-manifest-stage
        if: inputs.root == '' && steps.swiftpm-manifest-restore.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: scripts/ci/swiftpm-manifest-cache.sh stage "$RUNNER_TEMP/swiftpm-manifests"

      - name: Pack SwiftPM manifest cache
        id: swiftpm-manifest-pack
        if: steps.swiftpm-manifest-stage.outcome == 'success'
        continue-on-error: true
        uses: ./.github/actions/cache-save
        with:
          backend: ${{ vars.CI_CACHE_BACKEND || 'r2' }}
          path: ${{ runner.temp }}/swiftpm-manifests
          key: ${{ steps.swiftpm-manifest-key.outputs.key }}
          pack-to: ${{ runner.temp }}/r2-pack/swiftpm-manifests

      - name: Upload packed SwiftPM manifest cache
        id: swiftpm-manifest-upload
        if: steps.swiftpm-manifest-pack.outcome == 'success' && (vars.CI_CACHE_BACKEND || 'r2') == 'r2'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: r2-pack-swiftpm-manifests-${{ inputs.pool }}${{ inputs.root && format('-root-{0}', inputs.root) || '' }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/r2-pack/swiftpm-manifests
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      # Build on the nearest earlier seed in this commit's history, not the
      # newest pointer: nightly.yml's cold seed of an older main can hold that.
      # A miss is a cold build, which is still a correct seed, just a slower one.
      - name: Adopt the newest seed
        id: adopt
        continue-on-error: true
        timeout-minutes: 8
        env:
          PREFIX: ${{ steps.key.outputs.prefix }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/ci/seed_derived_data.py adopt \
            "$CMUX_CI_CANONICAL_SRC" "$CMUX_COMPILE_ADMISSION_DERIVED_DATA" \
            "$PREFIX" "$GITHUB_SHA"

      - name: Record seed inputs
        id: record
        run: python3 scripts/ci/seed_derived_data.py record "$CMUX_CI_CANONICAL_SRC" "$CMUX_COMPILE_ADMISSION_DERIVED_DATA"

      - name: Build
        id: build
        run: |
          set -euo pipefail
          started="$(python3 -c 'import time; print(time.monotonic())')"
          scripts/ci/compile-app-host-test-product.sh canonical-build \
            "$CMUX_COMPILE_ADMISSION_DERIVED_DATA" \
            "$PWD/.ci-source-packages" \
            "$CMUX_COMPILE_ADMISSION_CAS"
          python3 -c "import time; print(f'seconds={time.monotonic() - $started:.1f}')" >> "$GITHUB_OUTPUT"

      - name: Forget the adopted-build inode override
        if: always() && steps.adopt.outputs.hit == 'true'
        continue-on-error: true
        run: defaults delete com.apple.dt.XCBuild IgnoreFileSystemDeviceInodeChanges || true

      - name: Bound seed size
        id: bound
        run: python3 scripts/ci/seed_derived_data.py prune "$CMUX_COMPILE_ADMISSION_DERIVED_DATA"

      # Before the seed is packed for R2, and before the product steps below
      # rewrite Build/Products: the copy is the seed exactly as "Pack seed"
      # archives it (keep only clones the tree). An APFS clone, so seconds.
      # The LAN seed archive reads kept seeds from this Mac within a minute, so
      # keeping first hands them to the owned minis about 160 s sooner, the
      # length of the upload (cmuxterm-hq#658).
      - name: Keep the seed on this Mac
        if: steps.bound.outputs.save == 'true' && env.CMUX_SEED_LOCAL_CACHE != ''
        continue-on-error: true
        env:
          SEED_KEY: ${{ steps.key.outputs.scoped }}${{ github.sha }}
          SEED_PREFIX: ${{ steps.key.outputs.prefix }}
        run: python3 scripts/ci/seed_derived_data.py keep "$CMUX_COMPILE_ADMISSION_DERIVED_DATA" "$SEED_KEY" "$SEED_PREFIX"

      # The archive "Save seed" in the save job uploads, packed here before the
      # product steps rewrite Build/Products: 1.4 GB from 9.2 GB of DerivedData
      # (the prune bound is 12 GiB). Not continue-on-error, as the save was
      # not: a seed that did not reach the save job fails this job.
      - name: Pack seed
        id: seed-pack
        if: steps.bound.outputs.save == 'true'
        uses: ./.github/actions/cache-save
        with:
          backend: r2
          path: ${{ env.CMUX_COMPILE_ADMISSION_DERIVED_DATA }}
          key: ${{ steps.key.outputs.scoped }}${{ github.sha }}
          pack-to: ${{ runner.temp }}/r2-pack/seed

      - name: Upload packed seed
        id: seed-upload
        if: steps.seed-pack.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: r2-pack-seed-${{ inputs.pool }}${{ inputs.root && format('-root-{0}', inputs.root) || '' }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/r2-pack/seed
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      # Publish the product exactly as ci-macos.yml compile admission does
      # (tests/test_seed_derived_data.py pins the copy). Staging and relocation
      # rewrite Build/Products, so these follow "Pack seed". Only a main push
      # is a producer pull requests and E2E dispatches trust; a dispatch of
      # this workflow publishes no product: staging, packaging and upload run
      # on a main push only. A failure here
      # costs pull requests the adoption, never the seed. The product does not
      # depend on the width, so only the first
      # pool (decide's publisher) publishes it, under the one artifact name
      # admission looks up. When that pool skips, its seed's commit has these
      # build inputs, and so the product pull requests already adopt.
      - name: Stage compiled package frameworks
        id: stage-products
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && inputs.pool == inputs.publisher
        continue-on-error: true
        run: |
          set -euo pipefail
          products="$CMUX_COMPILE_ADMISSION_DERIVED_DATA/Build/Products/Debug"
          stable="/private/tmp/cmux-app-host-package-frameworks"
          mkdir -p "$stable"
          framework_source="$(find "$products" -type d -name 'CmuxAgentJournal*_PackageProduct.framework' -print -quit 2>/dev/null || true)"
          test -n "$framework_source"
          framework_root="$(dirname "$framework_source")"
          rsync -aL --no-times "$framework_root/" "$stable/"
          if [ -L "$products/PackageFrameworks" ]; then
            rm "$products/PackageFrameworks"
          fi
          mkdir -p "$products/PackageFrameworks"
          rsync -aL --no-times "$framework_root/" "$products/PackageFrameworks/"
          test -f "$products/PackageFrameworks/CmuxAgentJournal_27B6EF8727F6C277_PackageProduct.framework/Versions/A/CmuxAgentJournal_27B6EF8727F6C277_PackageProduct"

      - name: Package compiled app-host test product
        id: package-products
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.stage-products.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          # Fresh manifests embed the canonical checkout. Stamp that producer
          # before relocating into this job's workspace, as admission does.
          (cd "$CMUX_CI_CANONICAL_ROOT/src" && python3 scripts/ci/app_host_test_products.py stamp "$CMUX_COMPILE_ADMISSION_DERIVED_DATA")
          python3 scripts/ci/app_host_test_products.py restore "$CMUX_COMPILE_ADMISSION_DERIVED_DATA"
          python3 scripts/ci/app_host_test_products.py stamp "$CMUX_COMPILE_ADMISSION_DERIVED_DATA"
          python3 scripts/ci/reuse_app_host_products.py seal "$CMUX_COMPILE_ADMISSION_DERIVED_DATA"
          archive="$RUNNER_TEMP/app-host-products.tar.gz"
          # Build/Products reaches each framework binary through Versions/Current
          # symlinks, and product extractors accept no symlinks, so `tar -h` stored
          # every framework binary three times: 1.9 GB on disk became 2.7 GB of
          # tar and 830 MB gzipped. Stage the tree as hard links with the symlinks
          # followed (the same tree `tar -h` wrote, beside the DerivedData so the
          # links stay on one volume); tar then stores each file once and every
          # other path as a hard link, which tar -x, aa and
          # reuse_app_host_products.py all extract. Same files, 572 MB, packed
          # faster.
          stage="$(mktemp -d "${CMUX_COMPILE_ADMISSION_DERIVED_DATA%/*}/.product-pack.XXXXXX")"
          trap 'rm -rf "$stage"' EXIT
          (cd "$CMUX_COMPILE_ADMISSION_DERIVED_DATA" && pax -rwlL Build/Products "$stage")
          COPYFILE_DISABLE=1 tar -cf - -C "$stage" Build/Products | gzip -1 > "$archive"
          echo "sha256=$(shasum -a 256 "$archive" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      # Three days, as admission keeps its own: a pull request only matches
      # the newest main whose product inputs it shares, so an older product is
      # useful only until main's inputs change again.
      - name: Upload compiled app-host test product
        id: upload-products
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.package-products.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-host-products-v1-${{ steps.product-key.outputs.key }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/app-host-products.tar.gz
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

      # macOS jobs start their checkout from these objects, so a pull request
      # fetches only what changed since this main commit instead of the whole
      # tree and its submodules (scripts/ci/git-seed.sh). A failure costs them
      # the head start, never this seed. Not from the trusted owned runner:
      # its reused workspace .git grows across checkouts, and the Blacksmith
      # pools already save the same key.
      - name: Pack git object seed
        id: git-seed
        if: github.ref == 'refs/heads/main' && inputs.pool != vars.CI_SEED_TRUSTED_POOL
        continue-on-error: true
        timeout-minutes: 5
        run: scripts/ci/git-seed.sh pack "$GITHUB_WORKSPACE" "$RUNNER_TEMP/r2-pack/git-seed"

      - name: Upload packed git object seed
        id: git-seed-upload
        if: steps.git-seed.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: r2-pack-git-seed-${{ inputs.pool }}${{ inputs.root && format('-root-{0}', inputs.root) || '' }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/r2-pack/git-seed
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Summarize
        if: always()
        env:
          ADOPT_HIT: ${{ steps.adopt.outputs.hit }}
          ADOPT_KEY: ${{ steps.adopt.outputs.key }}
          ADOPT_REASON: ${{ steps.adopt.outputs.reason }}
          CHANGED: ${{ steps.adopt.outputs.changed_inputs }}
          BUILD_SECONDS: ${{ steps.build.outputs.seconds }}
          SAVED: ${{ steps.bound.outputs.save }}
          PRODUCT_KEY: ${{ steps.product-key.outputs.key }}
          PRODUCT_UPLOAD: ${{ steps.upload-products.outcome }}
        run: |
          {
            echo "### DerivedData seed for \`${GITHUB_SHA:0:10}\`"
            if [ "$ADOPT_HIT" = true ]; then
              echo "- built on \`$ADOPT_KEY\`, $CHANGED inputs changed"
            else
              echo "- cold build (\`${ADOPT_REASON:-no seed}\`)"
            fi
            echo "- build: ${BUILD_SECONDS:-?} s"
            echo "- packed for the save job: ${SAVED:-false}"
            echo "- app-host product \`${PRODUCT_KEY:-?}\`: ${PRODUCT_UPLOAD:-skipped}"
          } >> "$GITHUB_STEP_SUMMARY"

  # Uploads what `seed` packed, on a runner no repository variable can move.
  # Whatever `seed` ended with: the Swift packages and manifests it packed
  # right after resolve are saved even when the build fails later, as they
  # were when `seed` saved them itself. The seed archive exists only after a
  # successful build and a bounded prune.
  save:
    needs: seed
    if: always() && needs.seed.result != 'skipped'
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || 'blacksmith-4vcpu-ubuntu-2404' }}
    environment: ${{ github.ref == 'refs/heads/main' && 'ci-cache-writer' || '' }}
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      # r2-cache.sh, the lockfile that names the `spm-` key, and the index the
      # SwiftPM manifest key's inputs come from (every Package.swift and
      # submodule pointer), so not sparse. No submodules: their pointers are
      # in the index.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Download packed Swift packages
        id: swift-package-download
        if: needs.seed.outputs.swift-packages-artifact != ''
        continue-on-error: true
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          artifact-ids: ${{ needs.seed.outputs.swift-packages-artifact }}
          path: ${{ runner.temp }}/r2-pack/swift-packages

      # nightly.yml's exact `spm-` key, computed here from the lockfile rather
      # than taken from the build.
      - name: Save Swift packages
        if: steps.swift-package-download.outcome == 'success'
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CI_CACHE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CI_CACHE_R2_SECRET_ACCESS_KEY }}
          CI_CACHE_R2_ENDPOINT: ${{ format('https://{0}.r2.cloudflarestorage.com', secrets.CI_CACHE_R2_ACCOUNT_ID) }}
          CI_CACHE_R2_BUCKET: ${{ vars.CI_CACHE_R2_BUCKET }}
          KEY: spm-${{ hashFiles('cmux.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'scripts/ci/swiftpm-cache-layout') }}
          SHA256: ${{ needs.seed.outputs.swift-packages-sha256 }}
        run: scripts/ci/r2-cache.sh publish "$RUNNER_TEMP/r2-pack/swift-packages" "$KEY" "$SHA256"

      - name: Download packed SwiftPM manifest cache
        id: swiftpm-manifest-download
        if: needs.seed.outputs.swiftpm-manifests-artifact != ''
        continue-on-error: true
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          artifact-ids: ${{ needs.seed.outputs.swiftpm-manifests-artifact }}
          path: ${{ runner.temp }}/r2-pack/swiftpm-manifests

      # The key's last part names this commit's manifests, so this job computes
      # it from its own checkout. Its toolchain part hashes the Mac's
      # `xcodebuild -version`, which no Linux runner can compute, so only that
      # part, and the macOS runner OS and arch, come from the build.
      - name: Save SwiftPM manifest cache
        if: steps.swiftpm-manifest-download.outcome == 'success'
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CI_CACHE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CI_CACHE_R2_SECRET_ACCESS_KEY }}
          CI_CACHE_R2_ENDPOINT: ${{ format('https://{0}.r2.cloudflarestorage.com', secrets.CI_CACHE_R2_ACCOUNT_ID) }}
          CI_CACHE_R2_BUCKET: ${{ vars.CI_CACHE_R2_BUCKET }}
          KEY: ${{ needs.seed.outputs.swiftpm-manifests-key }}
          SHA256: ${{ needs.seed.outputs.swiftpm-manifests-sha256 }}
        run: |
          set -euo pipefail
          inputs="$(scripts/ci/swiftpm-manifest-cache.sh inputs)"
          [[ "$KEY" =~ ^swiftpm-manifests-v1-macOS-(ARM64|X64)-[0-9a-f]{16}-${inputs}$ ]] \
            || { echo "::error::not this commit's SwiftPM manifest cache key (inputs $inputs): $KEY"; exit 1; }
          scripts/ci/r2-cache.sh publish "$RUNNER_TEMP/r2-pack/swiftpm-manifests" "$KEY" "$SHA256"

      - name: Download packed seed
        id: seed-download
        if: needs.seed.outputs.seed-artifact != ''
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          artifact-ids: ${{ needs.seed.outputs.seed-artifact }}
          path: ${{ runner.temp }}/r2-pack/seed

      # Not continue-on-error, as before: a seed that was built and not saved
      # fails the run, and seed_decide.py counts only a saved one. The key's
      # fingerprint (32 hex over the Mac's xcodebuild -version and build
      # paths) and width (-j) need the Mac, so they come from the build, in
      # exactly that shape; the commit is this run's.
      - name: Save seed
        if: steps.seed-download.outcome == 'success'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CI_CACHE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CI_CACHE_R2_SECRET_ACCESS_KEY }}
          CI_CACHE_R2_ENDPOINT: ${{ format('https://{0}.r2.cloudflarestorage.com', secrets.CI_CACHE_R2_ACCOUNT_ID) }}
          CI_CACHE_R2_BUCKET: ${{ vars.CI_CACHE_R2_BUCKET }}
          KEY: ${{ needs.seed.outputs.seed-key }}
          SHA256: ${{ needs.seed.outputs.seed-sha256 }}
        run: |
          set -euo pipefail
          [[ "$KEY" =~ ^admission-derived-data-v1-macOS-(ARM64|X64)-[0-9a-f]{32}-j[1-9][0-9]{0,2}-${GITHUB_SHA}$ ]] \
            || { echo "::error::not this commit's DerivedData seed key: $KEY"; exit 1; }
          scripts/ci/r2-cache.sh publish "$RUNNER_TEMP/r2-pack/seed" "$KEY" "$SHA256"

      - name: Download packed git object seed
        id: git-seed-download
        if: needs.seed.outputs.git-seed-artifact != ''
        continue-on-error: true
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          artifact-ids: ${{ needs.seed.outputs.git-seed-artifact }}
          path: ${{ runner.temp }}/r2-pack/git-seed

      # git-seed-v1-<commit>: this job names it, not the build.
      - name: Save git object seed
        if: steps.git-seed-download.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 5
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CI_CACHE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CI_CACHE_R2_SECRET_ACCESS_KEY }}
          CI_CACHE_R2_ENDPOINT: ${{ format('https://{0}.r2.cloudflarestorage.com', secrets.CI_CACHE_R2_ACCOUNT_ID) }}
          CI_CACHE_R2_BUCKET: ${{ vars.CI_CACHE_R2_BUCKET }}
          SHA256: ${{ needs.seed.outputs.git-seed-sha256 }}
        run: scripts/ci/r2-cache.sh publish "$RUNNER_TEMP/r2-pack/git-seed" "git-seed-v1-$GITHUB_SHA" "$SHA256"

  # The seed's Build is main's compile verdict for the push. When it fails,
  # start ci-compile-attribution.yml now rather than when the slowest pool
  # ends the run (4 and 11 minutes later for the two breaks of 2026-09-29), so
  # the culprit is named within minutes. It only dispatches; a failure to is
  # harmless, since the run's completion triggers the attribution too. Its own
  # job, so the build on the pool holds no write token.
  attribute:
    needs: seed
    if: failure() && needs.seed.outputs.build == 'failure' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || 'blacksmith-4vcpu-ubuntu-2404' }}
    permissions:
      actions: write
    timeout-minutes: 5
    steps:
      - name: Start compile attribution
        continue-on-error: true
        timeout-minutes: 1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error --max-time 20 -X POST \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/ci-compile-attribution.yml/dispatches" \
            -d '{"ref":"main"}'
