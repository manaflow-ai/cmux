name: iOS App Review gate
run-name: >-
  App Review gate · ${{ inputs.ref || github.ref_name }} · ${{ inputs.lane || 'appstore' }}

# "Would Apple accept this build right now?" for the NEXT iOS app
# (cmux-next-ios, CmuxMobileApp). One run, one ranked list of everything a
# machine can find that App Review would reject: the reviewer's path walked on
# iPhone, iPad (the iPhone app in compatibility mode) and iPhone Duo, the
# dead-control walk, the guideline lint on the source, metadata, URLs and the
# exact binary, the rejection-history check and `asc validate --strict`.
# Every check is deterministic: no model judges the build (an agent reviewer
# pass on the iPad leg was removed, since it could answer differently on the
# same build and failed every app change while its API quota was spent).
#
# The production pipeline calls it (workflow_call) on the exact feat-cmux-next
# SHA it builds, before upload, and refuses to submit unless it is green on
# that SHA (outputs `blocking` and `sha`). It also runs on every feat-cmux-next
# push and pull request that touches the app, and fails one that adds a
# blocker not in cmux-next-ios/AppStoreReview/known-blockers.json: a change
# that breaks the reviewer's path is red before it merges, not found by Apple.
# A scheduled run would fire only from the default branch's copy of this file,
# so there is none here. Notes (*.md) and cmux-next-ios/verify/ evidence are
# not the app: a change to only those walks no reviewer path (cmux#43251,
# SECURITY.md and verify/parity-mac.md, took a Mac per device).
# AppStoreReview/ stays in: the lint reads its metadata, rejection history and
# known blockers. The last matching pattern wins, so the negations come
# after the includes they narrow and before the one they re-include.
# docs: cmux-next-ios/AppStoreReview/APP-REVIEW-GATE.md.
on:
  push:
    branches: [feat-cmux-next]
    paths:
      - "cmux-next-ios/**"
      # The local packages the app links (scripts/ci/ios_app_package_paths.py --check keeps this list exact).
      - "Packages/Shared/CMUXAuthCore/**"
      - "Packages/Shared/CMUXMobileCore/**"
      - "Packages/Shared/CmuxAgentBrands/**"
      - "Packages/Shared/CmuxAgentQuestion/**"
      - "Packages/Shared/CmuxAuthRuntime/**"
      - "Packages/Shared/CmuxChiefList/**"
      - "Packages/Shared/CmuxChiefVoiceCore/**"
      - "Packages/Shared/CmuxConnectivityTelemetry/**"
      - "Packages/Shared/CmuxDeviceHub/**"
      - "Packages/Shared/CmuxEgress/**"
      - "Packages/Shared/CmuxGhosttyKit/**"
      - "Packages/Shared/CmuxHomeCore/**"
      - "Packages/Shared/CmuxLiveCode/**"
      - "Packages/Shared/CmuxScreenKit/**"
      - "Packages/Shared/CmuxSpinner/**"
      - "Packages/Shared/CmuxTheme/**"
      - "Packages/Shared/CmuxVNC/**"
      - "Packages/Shared/CmuxVNCWebRTC/**"
      - "Packages/iOS/CmuxConversation/**"
      - "Packages/iOS/CmuxMobileBilling/**"
      - "Packages/iOS/CmuxMobileSupport/**"
      - "Packages/iOS/CmuxTabsKit/**"
      - "vendor/stack-auth-swift-sdk-prerelease/**"
      - "scripts/cmux-next/check-app-store-rules.py"
      - "tests/test_ios_app_review_gate.py"
      - ".github/workflows/ios-review-gate.yml"
      - "scripts/ci/ios_app_package_paths.py"
      - ".github/ios-review-gate-devices.json"
      - ".github/scripts/ios_review_gate_devices.py"
      - "!**/*.md"
      - "!cmux-next-ios/verify/**"
      - "cmux-next-ios/AppStoreReview/**"
  # Every app pull request walks the reviewer path (one macOS job per device,
  # side by side, about 30 minutes), so a change that breaks it is red before
  # it merges.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "cmux-next-ios/**"
      # The local packages the app links (scripts/ci/ios_app_package_paths.py --check keeps this list exact).
      - "Packages/Shared/CMUXAuthCore/**"
      - "Packages/Shared/CMUXMobileCore/**"
      - "Packages/Shared/CmuxAgentBrands/**"
      - "Packages/Shared/CmuxAgentQuestion/**"
      - "Packages/Shared/CmuxAuthRuntime/**"
      - "Packages/Shared/CmuxChiefList/**"
      - "Packages/Shared/CmuxChiefVoiceCore/**"
      - "Packages/Shared/CmuxConnectivityTelemetry/**"
      - "Packages/Shared/CmuxDeviceHub/**"
      - "Packages/Shared/CmuxEgress/**"
      - "Packages/Shared/CmuxGhosttyKit/**"
      - "Packages/Shared/CmuxHomeCore/**"
      - "Packages/Shared/CmuxLiveCode/**"
      - "Packages/Shared/CmuxScreenKit/**"
      - "Packages/Shared/CmuxSpinner/**"
      - "Packages/Shared/CmuxTheme/**"
      - "Packages/Shared/CmuxVNC/**"
      - "Packages/Shared/CmuxVNCWebRTC/**"
      - "Packages/iOS/CmuxConversation/**"
      - "Packages/iOS/CmuxMobileBilling/**"
      - "Packages/iOS/CmuxMobileSupport/**"
      - "Packages/iOS/CmuxTabsKit/**"
      - "vendor/stack-auth-swift-sdk-prerelease/**"
      - "scripts/cmux-next/check-app-store-rules.py"
      - "tests/test_ios_app_review_gate.py"
      - ".github/workflows/ios-review-gate.yml"
      - "scripts/ci/ios_app_package_paths.py"
      - ".github/ios-review-gate-devices.json"
      - ".github/scripts/ios_review_gate_devices.py"
      - "!**/*.md"
      - "!cmux-next-ios/verify/**"
      - "cmux-next-ios/AppStoreReview/**"
  workflow_dispatch:
    inputs:
      ref:
        description: App source to judge (branch, tag or SHA); empty is this ref
        required: false
        default: ""
      lane:
        description: appstore (the AppStore configuration, com.cmux.app), internal (cmux INTERNAL) or internal-submission (cmux INTERNAL judged as an App Store submission)
        required: false
        default: appstore
        type: choice
        options: [appstore, internal, internal-submission]
      ipa_artifact_run:
        description: Optional run id whose `app-store-ipa` artifact is the exact binary to lint
        required: false
        default: ""
      # Accepted and ignored: the agent reviewer pass is gone. main's ios-app-review-readiness.yml
      # still dispatches with inputs[agent_pass]=true, and GitHub refuses (422) a dispatch that
      # names an undeclared input. Drop this once main no longer sends it.
      agent_pass:
        description: Ignored (the agent reviewer pass was removed); kept so older dispatchers still work
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      ref:
        description: The app source to judge; the production pipeline passes the full feat-cmux-next SHA it builds
        type: string
        required: false
        default: ""
      # appstore, internal, or internal-submission: cmux INTERNAL's build held
      # to every appstore check (the INTERNAL builder's `submittable` run calls it).
      lane:
        type: string
        required: false
        default: appstore
      ipa_artifact_name:
        description: Artifact of the calling run that holds the exported .ipa
        type: string
        required: false
        default: ""
      # Accepted and ignored, as on workflow_dispatch above (a caller still passing it keeps working).
      agent_pass:
        type: boolean
        required: false
        default: false
      gate_ref:
        description: Where the gate's own scripts come from when called from another branch (resolved to one SHA)
        type: string
        required: false
        default: feat-cmux-next
    # A called workflow sees only the secrets its caller passes, even in a job
    # with `environment: release`: without these, asc-validate ran with an
    # empty key and blocked on "missing authentication" (run 45038240860).
    secrets:
      ASC_API_KEY_ID:
        required: false
      ASC_API_ISSUER_ID:
        required: false
      ASC_API_KEY_P8_BASE64:
        required: false
      # Declared so a called run's references resolve; the INTERNAL builder
      # passes none of these (only the ASC key), so a called run mints no
      # routing token and saves no R2 cache, as before: both steps continue on error.
      GLAEDA_ROUTE_APP_KEY:
        required: false
      CI_CACHE_R2_ACCESS_KEY_ID:
        required: false
      CI_CACHE_R2_SECRET_ACCESS_KEY:
        required: false
      CI_CACHE_R2_ACCOUNT_ID:
        required: false
    outputs:
      blocking:
        description: Number of blocking findings
        value: ${{ jobs.report.outputs.blocking }}
      sha:
        description: The full SHA the gate judged
        value: ${{ jobs.plan.outputs.sha }}

permissions:
  contents: read

concurrency:
  group: ios-review-gate-${{ github.event_name }}-${{ github.event.pull_request.number || inputs.ref || github.ref }}-${{ inputs.lane || 'appstore' }}
  # Latest wins for pull requests. A feat-cmux-next push run finishes: the
  # group holds one running and one pending run, and a newer push replaces
  # only the pending one, so base gets a verdict at its tip every run's length.
  # With cancel-in-progress on push, 99 of 100 base runs (2026-11-24 21:24Z to
  # 2026-11-25 03:26Z) were cancelled by the next push and base had no verdict
  # for the release-bar probe to read. A dispatched or called run (a
  # submission) always finishes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Temporary REST budget attribution: one gh-call line per GitHub API call (scripts/ci/api_call_log/env.sh, fetched at a fixed commit when the checkout has no copy).
  BASH_ENV: '$({ w="${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh"; t="${RUNNER_TEMP:-/nonexistent}/api-call-log-src"; if [ -f "$w" ]; then echo "$w"; elif [ -n "${RUNNER_TEMP:-}" ]; then if [ ! -f "$t/env.sh" ] && [ ! -e "$t.tried" ] && { [ "${RUNNER_OS:-}" = Linux ] || [ "${RUNNER_OS:-}" = macOS ]; } && [ "$(date -u +%Y%m%d%H)" -lt 2026112300 ]; then : > "$t.tried"; mkdir -p "$t.part" && for x in env.sh gh sitecustomize.py isolated.py; do curl -fsSL --max-time 5 -o "$t.part/$x" "https://raw.githubusercontent.com/manaflow-ai/cmux/27647ffd3ae838c63be28ca3e5883dcd68c34518/scripts/ci/api_call_log/$x" || break; done; [ -s "$t.part/isolated.py" ] && mv "$t.part" "$t"; fi; if [ -f "$t/env.sh" ]; then echo "$t/env.sh"; else echo unset BASH_ENV > "$t.off.sh" && echo "$t.off.sh"; fi; fi; } 2>/dev/null)'

jobs:
  plan:
    # Tier A of the merged pull request replay (scripts/ci/affected-jobs.json pull_request_skip): a pull request
    # into feat-cmux-next skips it unless labeled full-ci; the feat-cmux-next push runs it.
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft != true || contains(github.event.pull_request.labels.*.name, 'full-ci') || (vars.CI_DRAFT_CHEAP_TIER || '1') == '0') && ((github.event_name != 'pull_request' || !startsWith(github.event.pull_request.base.ref, 'feat-cmux-next') || contains(github.event.pull_request.labels.*.name, 'full-ci'))) }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || vars.CI_OVERFLOW_LINUX || 'cmux-linux' }}
    timeout-minutes: 5
    # The routing token (owned-pool picker below) lives in ci-routing-agent. A call from another
    # workflow (main's production pipeline) takes no environment, so its deploy rules never stop
    # the gate; its picker then reads the queue with the job token.
    environment: ${{ !contains(fromJSON('["pull_request","merge_group"]'), github.event_name) && contains(github.workflow_ref, '/.github/workflows/ios-review-gate.yml@') && 'ci-routing-agent' || '' }}
    permissions:
      contents: read
      actions: read
    outputs:
      runs_on: ${{ steps.pool.outputs.runs_on }}
      retry_runs_on: ${{ steps.pool.outputs.retry_runs_on }}
      label: ${{ steps.pool.outputs.label }}
      # The device families the reviewer-path matrix walks, and the whole
      # decision each leg checks against its image (see "Which device legs
      # take a Mac" below).
      families: ${{ steps.devices.outputs.families }}
      devices: ${{ steps.devices.outputs.devices }}
      sha: ${{ steps.plan.outputs.sha }}
      lane: ${{ steps.plan.outputs.lane }}
      gate_sha: ${{ steps.plan.outputs.gate_sha }}
    steps:
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          REF_INPUT: ${{ inputs.ref }}
          LANE_INPUT: ${{ inputs.lane }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GATE_REF_INPUT: ${{ inputs.gate_ref }}
          # A called workflow reports its caller's workflow_ref and sha.
          CALLED: ${{ !contains(github.workflow_ref, '/.github/workflows/ios-review-gate.yml@') }}
        run: |
          set -euo pipefail
          # One full SHA for every job, so the lint, the walk and the caller's
          # upload all judge the same commit even when a branch moves mid-run.
          # A branch resolves over git (ls-remote), which spends none of the
          # installation's REST quota: run 45056656791's plan failed twice on
          # "API rate limit exceeded for installation" on these reads
          # (2026-11-22). Anything else (a tag, a short SHA) still asks the API.
          resolve() {
            local r="$1" s
            s="$(git ls-remote "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
              "refs/heads/$r" 2>/dev/null | awk -v want="refs/heads/$r" '$2==want{print $1}')" || s=""
            [[ "$s" =~ ^[0-9a-f]{40}$ ]] || s="$(gh api "repos/$GITHUB_REPOSITORY/commits/$r" --jq .sha)"
            echo "$s"
          }
          ref="${REF_INPUT:-$HEAD_SHA}"
          if [[ "$ref" =~ ^[0-9a-f]{40}$ ]]; then
            sha="$ref"
          else
            sha="$(resolve "$ref")"
          fi
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::could not resolve $ref: $sha" >&2; exit 1; }
          lane="${LANE_INPUT:-appstore}"
          case "$lane" in appstore|internal|internal-submission) ;; *) echo "::error::unknown lane $lane" >&2; exit 1 ;; esac
          # The gate's own scripts, history and UI tests. Run directly, that is
          # this run's commit. Called from another branch (main's production
          # pipeline), github.sha is the caller's commit, which has no gate, so
          # the gate is read from `gate_ref` (feat-cmux-next by default),
          # resolved once to a full SHA here.
          if [ "$CALLED" = true ]; then
            gate_ref="${GATE_REF_INPUT:-feat-cmux-next}"
            gate_sha="$(resolve "$gate_ref")"
          else
            gate_sha="$GITHUB_SHA"
          fi
          [[ "$gate_sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::could not resolve the gate's commit: $gate_sha" >&2; exit 1; }
          {
            echo "sha=$sha"
            echo "gate_sha=$gate_sha"
            echo "lane=$lane"
          } >> "$GITHUB_OUTPUT"
          echo "App Review gate judges $sha ($lane)" | tee -a "$GITHUB_STEP_SUMMARY"
      # Which device legs take a Mac, decided here on Linux: a family the
      # macOS image has no simulator for (Duo today) used to wait a median
      # 41 minutes in the macOS queue only to skip in one. Its skip marker
      # now comes from this job, and every leg that does run checks the
      # list against its image (.github/ios-review-gate-devices.json).
      - name: Checkout the device list
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ steps.plan.outputs.gate_sha }}
          path: gate
          persist-credentials: false
          sparse-checkout: |
            .github/ios-review-gate-devices.json
            .github/scripts/ios_review_gate_devices.py
            scripts/ci/xcode-pins.txt
            cmux-next-ios/project.yml
            scripts/ci/ios_runner_pool.py
            scripts/ci/e2e_runner_pool.py
            scripts/ci/pr_runner_pool.py
            scripts/ci/github_spend.py
            scripts/ci/simple_pool_picker.py
            scripts/ci/deadline_http.py
            scripts/ci/warm_distance.py
            .gitmodules
          sparse-checkout-cone-mode: false
      - name: Which device legs take a Mac
        id: devices
        env:
          # The list describes manaflow-ai's macOS 26 pool; another
          # repository's image walks every family, as before.
          TRUST: ${{ github.repository_owner == 'manaflow-ai' }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          code=0
          python3 -I gate/.github/scripts/ios_review_gate_devices.py plan \
            --devices gate/.github/ios-review-gate-devices.json --pins gate/scripts/ci/xcode-pins.txt \
            --trust "$TRUST" --out-dir "$RUNNER_TEMP/planned" \
            > "$RUNNER_TEMP/plan.out" 2> "$RUNNER_TEMP/devices.txt" || code=$?
          # A pull request does not walk the iPad leg while the app is iPhone-only (every shipped
          # TARGETED_DEVICE_FAMILY in cmux-next-ios/project.yml is "1"; the gate's `families` reader
          # leaves out the Debug config, which also targets iPad so the foldable harness runs on an
          # iPad mini simulator, cmuxterm-hq docs/design/ios-foldable.md). On iPad such an app runs
          # in compatibility mode: the iPhone layout in a phone-sized window, the same screens the
          # iPhone leg walks. Leo, 2026-11-21: "for connection and ci, we can simply
          # move. and go." The leg took a second Mac for 24 min (p50) on every app pull request.
          # feat-cmux-next pushes, dispatches and the production pipeline's call still walk it,
          # so an iPad-only break still shows before an upload. The report reads the skip
          # marker written here (--expect-device-or-skipped ipad on a pull request).
          # The device decision (`devices`) is unchanged, so every leg's image check is too.
          if [ "$code" = 0 ] && [ "$EVENT" = pull_request ] \
            && [ "$(python3 -I gate/cmux-next-ios/scripts/app_review_gate.py families --source-root gate)" = 1 ]; then
            reason="pull request: the app is iPhone-only (TARGETED_DEVICE_FAMILY 1); feat-cmux-next pushes and the production pipeline walk the iPad leg"
            python3 -I -c '
          import json, sys
          path, reason, marker = sys.argv[1], sys.argv[2], sys.argv[3]
          lines = open(path).read().splitlines()
          out = []
          for line in lines:
              key, _, value = line.partition("=")
              if key in ("families", "skipped"):
                  items = json.loads(value)
                  items = [f for f in items if f != "ipad"] if key == "families" else sorted(set(items) | {"ipad"})
                  line = f"{key}={json.dumps(items)}"
              out.append(line)
          open(path, "w").write("\n".join(out) + "\n")
          with open(marker, "w") as f:
              f.write(json.dumps({"family": "ipad", "skipped": True, "planned": True, "reason": reason}) + "\n")
          ' "$RUNNER_TEMP/plan.out" "$reason" "$RUNNER_TEMP/planned/ipad.skipped.json"
            echo "- ipad: not walked on this pull request ($reason)" >> "$RUNNER_TEMP/devices.txt"
          fi
          cat "$RUNNER_TEMP/plan.out" >> "$GITHUB_OUTPUT"
          tee -a "$GITHUB_STEP_SUMMARY" < "$RUNNER_TEMP/devices.txt"
          exit "$code"
      - name: Upload the planned skips
        if: steps.devices.outputs.skipped != '[]'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # The report downloads every review-gate-* and reads each
          # <family>.skipped.json, wherever it came from.
          name: review-gate-planned-skips-${{ steps.plan.outputs.lane }}
          path: ${{ runner.temp }}/planned/*.skipped.json
          if-no-files-found: error
          retention-days: 3
      # Pick an idle owned Mac with an iOS simulator for the device legs with
      # the review-gate lane of scripts/ci/ios_runner_pool.py (the gate's own
      # copy, so a call from another branch picks with it too), then fall back
      # to Blacksmith macOS 26 on retries, forks, and when no owned simulator
      # mini is free. asc-validate keeps its ephemeral Blacksmith Mac: it
      # writes the App Store Connect key to the runner.
      - name: Mint the owned-pool routing token
        id: route-token
        if: (github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && vars.CI_PR_POOL_OWNED == '1' && vars.CI_IOS_OWNED == '1' && vars.GLAEDA_ROUTE_APP_ID != ''
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.GLAEDA_ROUTE_APP_ID }}
          private-key: ${{ secrets.GLAEDA_ROUTE_APP_KEY }}
          permission-administration: read
          # Queue, job and capacity-snapshot reads use this App's quota.
          permission-actions: read
          permission-organization-self-hosted-runners: read
      - name: Mint the repository routing token
        id: route-token-repo
        if: steps.route-token.outcome == 'failure'
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.GLAEDA_ROUTE_APP_ID }}
          private-key: ${{ secrets.GLAEDA_ROUTE_APP_KEY }}
          permission-administration: read
          permission-actions: read
      - name: Pick the macOS pool
        id: pool
        env:
          # The overflow switch the granted default reads (ios_runner_pool.py granted_default()).
          CI_OVERFLOW_MAC: ${{ vars.CI_OVERFLOW_MAC }}
          CI_RUNNER_STATE: ${{ vars.CI_RUNNER_STATE }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ROUTE_TOKEN: ${{ steps.route-token.outputs.token || steps.route-token-repo.outputs.token }}
          FORK_PULL_REQUEST: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          RUNNER_VARIABLE: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-6vcpu-macos-26' || vars.MACOS_RUNNER_TESTS || vars.MACOS_RUNNER_IOS }}
          IOS_OWNED: ${{ vars.CI_IOS_OWNED }}
          POOL_OWNED: ${{ vars.CI_PR_POOL_OWNED }}
          OWNED_SLOTS: ${{ vars.CI_OWNED_POOL_SLOTS }}
          PR_XCODE_APP: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && vars.CMUX_CI_XCODE_APP_PR || '' }}
          POOL_ORDER: ${{ vars.CI_PR_POOL_ORDER }}
          POOL_MAX_QUEUED: ${{ vars.CI_PR_POOL_MAX_QUEUED }}
          FAMILIES: ${{ steps.devices.outputs.families }}
          # Where the legs ran before the picker: a picker failure never stops the gate. Outside
          # manaflow-ai (no Blacksmith, no runner variables) it is hosted macos-26, a bare label
          # the step JSON-quotes; tests/test_ci_fork_runner_routing.py.
          FALLBACK_RUNS_ON: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || vars.RUNNER_POOLS && toJSON(fromJSON(vars.RUNNER_POOLS).macos_26) || '"blacksmith-6vcpu-macos-26"' }}
        run: |
          set -euo pipefail
          # One reviewer-path leg per planned family: a single family budgets
          # one simulator mini, two (a push walks iPhone and iPad) budget two.
          family="$(python3 -I -c 'import json, sys; f = json.loads(sys.argv[1]); print(f[0] if len(f) == 1 else "")' "$FAMILIES")"
          if ! python3 -I gate/scripts/ci/ios_runner_pool.py \
            --lane review-gate --fork "$FORK_PULL_REQUEST" --requested auto \
            --variable "$RUNNER_VARIABLE" --ios-owned "$IOS_OWNED" --owned "$POOL_OWNED" \
            --owned-slots "$OWNED_SLOTS" --pr-xcode-app "$PR_XCODE_APP" --order "$POOL_ORDER" \
            --max-queued "$POOL_MAX_QUEUED" --queue-rounds 0 \
            --device-family "$family" > "$RUNNER_TEMP/pool.out"; then
            case "$FALLBACK_RUNS_ON" in '"'*|'['*) ;; *) FALLBACK_RUNS_ON="\"$FALLBACK_RUNS_ON\"" ;; esac
            echo "::warning title=review gate pool::the picker failed; the device legs take $FALLBACK_RUNS_ON"
            printf 'label=\nruns_on=%s\nretry_runs_on=%s\npersistent=false\n' "$FALLBACK_RUNS_ON" "$FALLBACK_RUNS_ON" \
              > "$RUNNER_TEMP/pool.out"
          fi
          tee -a "$GITHUB_OUTPUT" < "$RUNNER_TEMP/pool.out"
      - name: Create the owned-pool marker
        id: marker
        if: steps.pool.outputs.persistent == 'true' && github.run_attempt == 1 && steps.devices.outputs.families != '[]'
        continue-on-error: true
        run: |
          set -euo pipefail
          marker="$RUNNER_TEMP/macos-pool-persistent.json"
          echo '{}' > "$marker"
          echo "path=$marker" >> "$GITHUB_OUTPUT"
      - name: Upload the persistent pool marker
        if: steps.marker.outputs.path != ''
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-pool-persistent-${{ github.run_id }}-${{ github.run_attempt }}-1-${{ steps.pool.outputs.label }}
          path: ${{ steps.marker.outputs.path }}
          retention-days: 1
      - name: Upload the simulator capacity marker
        if: steps.marker.outputs.path != ''
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-pool-persistent-${{ github.run_id }}-${{ github.run_attempt }}-1-glaeda-ios-sim
          path: ${{ steps.marker.outputs.path }}
          retention-days: 1
      - name: Upload the owned-pool watch marker
        if: steps.marker.outputs.path != ''
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: owned-pool-watch
          path: ${{ steps.marker.outputs.path }}
          retention-days: 1

  lint:
    needs: plan
    name: Guideline lint (${{ needs.plan.outputs.lane }})
    # Tier A of the merged pull request replay (scripts/ci/affected-jobs.json pull_request_skip): a pull request
    # into feat-cmux-next skips it unless labeled full-ci; the feat-cmux-next push runs it.
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft != true || contains(github.event.pull_request.labels.*.name, 'full-ci') || (vars.CI_DRAFT_CHEAP_TIER || '1') == '0') && ((github.event_name != 'pull_request' || !startsWith(github.event.pull_request.base.ref, 'feat-cmux-next') || contains(github.event.pull_request.labels.*.name, 'full-ci'))) }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || vars.CI_OVERFLOW_LINUX || 'cmux-linux' }}
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read  # ipa_artifact_run: another run's artifact
    env:
      LANE: ${{ needs.plan.outputs.lane }}
    steps:
      - name: Checkout the gate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # The gate's own commit (plan's gate_sha): a caller on another
          # branch (main's production pipeline) still runs the gate's scripts.
          ref: ${{ needs.plan.outputs.gate_sha }}
          path: gate
          persist-credentials: false
          sparse-checkout: |
            cmux-next-ios/scripts
            cmux-next-ios/AppStoreReview
            cmux-next-ios/UITests
      - name: Checkout the app source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.plan.outputs.sha }}
          path: app
          persist-credentials: false
      - name: Overlay the gate's history and tests
        run: |
          set -euo pipefail
          # The gate's own history and UI tests judge any source (an older
          # SHA being submitted). A source with no cmux-next-ios gets none,
          # and the lint says it is not the NEXT app.
          if [ -d app/cmux-next-ios ]; then
            mkdir -p app/cmux-next-ios/AppStoreReview
            cp gate/cmux-next-ios/AppStoreReview/rejection-history.json app/cmux-next-ios/AppStoreReview/
            cp gate/cmux-next-ios/UITests/AppReviewGateUITests.swift app/cmux-next-ios/UITests/
          fi
      - name: Download the exact binary
        if: inputs.ipa_artifact_name != ''
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ${{ inputs.ipa_artifact_name }}
          # The runner's temp folder, emptied before each job: a self-hosted worker keeps its workspace, and an
          # .ipa an earlier job left in `ipa/` would be linted as this binary (the self-hosted downloads guard, test_ci_self_hosted_downloads_are_fresh, run by hand).
          path: ${{ runner.temp }}/ipa
      - name: Download the dispatched run's binary
        if: inputs.ipa_artifact_run != ''
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: app-store-ipa
          run-id: ${{ inputs.ipa_artifact_run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/ipa
      - name: Lint
        env:
          WANT_IPA: ${{ inputs.ipa_artifact_name != '' || inputs.ipa_artifact_run != '' }}
          JUDGED_SHA: ${{ needs.plan.outputs.sha }}
        run: |
          set -euo pipefail
          args=(lint --source-root app --lane "$LANE" --check-urls --json "lint-$LANE.json")
          ipa="$(find "$RUNNER_TEMP/ipa" -name '*.ipa' 2>/dev/null | head -n 1 || true)"
          if [ -n "$ipa" ]; then
            # The binary must be built from the judged commit.
            args+=(--ipa "$ipa" --expect-commit "$JUDGED_SHA")
          elif [ "$WANT_IPA" = true ]; then
            # Asked to judge an exact binary and none arrived: never lint
            # the source alone and call that the binary's verdict.
            echo "::error::an .ipa was requested but none was downloaded" >&2
            exit 1
          fi
          # The report decides; a blocking lint still uploads its result.
          python3 -I gate/cmux-next-ios/scripts/app_review_gate.py "${args[@]}" || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        continue-on-error: true
        with:
          name: review-gate-lint-${{ env.LANE }}
          path: lint-${{ env.LANE }}.json
          retention-days: 3

  # The app and the gate for testing, built once on the build fleet (Linux) as each leg's Mac built them
  # (Debug, arm64, CMUX_MOBILE_APPLE_SIGN_IN=YES, TARGETED_DEVICE_FAMILY=1: `cmux-ci ios-build --what
  # gate-products`), so a leg's Mac only walks. Only when the gate's UI tests and rejection history at gate_sha are
  # the app's own at sha: the fleet builds the app's commit as it is, with no overlay. Anything else (another gate
  # commit, a red or unanswered build, a fork, outside manaflow-ai) leaves `use` empty and every leg builds on its
  # Mac as before, so the walk judges the same products either way. It never fails the run.
  # The job id ends in -fleet: the build-fleet gateway runner's job-started hook takes only thin cmux-ci client
  # jobs, by that suffix (run 45889626981 had it refused as gate-products).
  gate-products-fleet:
    needs: plan
    name: Build the app and the gate for testing (build fleet)
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft != true || contains(github.event.pull_request.labels.*.name, 'full-ci') || (vars.CI_DRAFT_CHEAP_TIER || '1') == '0') && ((github.event_name != 'pull_request' || !startsWith(github.event.pull_request.base.ref, 'feat-cmux-next') || contains(github.event.pull_request.labels.*.name, 'full-ci')) && github.repository_owner == 'manaflow-ai' && vars.CI_EVAL_STEP_GATEWAY != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) }}
    continue-on-error: true
    # The literal fallback never schedules: the job's if: skips outside manaflow-ai and when the variable is unset.
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.CI_EVAL_STEP_GATEWAY }}
    timeout-minutes: 45  # the client waits up to 600 s queued plus 1800 s running
    outputs:
      use: ${{ steps.done.outputs.use }}
    steps:
      - name: Checkout the app's gate files
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.plan.outputs.sha }}
          path: app
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            cmux-next-ios/UITests/AppReviewGateUITests.swift
            cmux-next-ios/AppStoreReview/rejection-history.json
      - name: Checkout the gate's files
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.plan.outputs.gate_sha }}
          path: gate
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            cmux-next-ios/UITests/AppReviewGateUITests.swift
            cmux-next-ios/AppStoreReview/rejection-history.json
      - name: Build on the build fleet
        id: build
        env:
          SHA: ${{ needs.plan.outputs.sha }}
        run: |
          set -uo pipefail
          for f in cmux-next-ios/UITests/AppReviewGateUITests.swift cmux-next-ios/AppStoreReview/rejection-history.json; do
            if ! cmp -s "app/$f" "gate/$f"; then
              echo "::notice title=gate products::$f at the gate's commit is not the app's; every leg builds on its Mac"
              exit 0
            fi
          done
          client="${CMUX_CI_CLIENT:-$HOME/.local/bin/cmux-ci}"
          if ! [[ -x "$client" ]]; then
            echo "::warning title=gate products::cmux-ci is not installed on runner $RUNNER_NAME; every leg builds on its Mac"
            exit 0
          fi
          out="$RUNNER_TEMP/out"
          status=0
          "$client" ios-build --what gate-products --ref "$SHA" --out "$out" --timeout 1800 --queue-timeout 600 || status=$?
          if [[ "$status" != 0 || ! -f "$out/ios-sim-build.tar.gz" ]]; then
            echo "::warning title=gate products::the build fleet gave no products for $SHA (exit $status); every leg builds on its Mac"
            exit 0
          fi
          ls -la "$out"
          echo "out=$out" >> "$GITHUB_OUTPUT"
      - name: Upload the products
        id: upload
        if: steps.build.outputs.out != ''
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # Not review-gate-*: the report downloads those.
          name: ios-gate-products-${{ needs.plan.outputs.lane }}
          path: ${{ steps.build.outputs.out }}/ios-sim-build.tar.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Hand them to the legs
        id: done
        if: steps.upload.outcome == 'success'
        run: echo "use=true" >> "$GITHUB_OUTPUT"

  reviewer-path:
    needs: [plan, gate-products-fleet]
    name: Reviewer path (${{ needs.plan.outputs.lane }}, ${{ matrix.family }})
    # Tier A of the merged pull request replay (scripts/ci/affected-jobs.json pull_request_skip): a pull request
    # into feat-cmux-next skips it unless labeled full-ci; the feat-cmux-next push runs it. It runs whether
    # gate-products built, skipped or failed (a leg with no products builds them itself).
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft != true || contains(github.event.pull_request.labels.*.name, 'full-ci') || (vars.CI_DRAFT_CHEAP_TIER || '1') == '0') && (!cancelled() && needs.plan.result == 'success' && (github.event_name != 'pull_request' || !startsWith(github.event.pull_request.base.ref, 'feat-cmux-next') || contains(github.event.pull_request.labels.*.name, 'full-ci'))) }}
    # One job per device, side by side: each walks one device (about 20
    # minutes) on the products gate-products built, or builds them first
    # (about 6) when it has none, where one job walking all
    # three in a row took about 45 minutes. A family with no simulator on
    # the image skips its build. No leg cancels another: the report needs
    # every family's result.
    strategy:
      fail-fast: false
      matrix:
        # iphone and ipad always; duo only when the plan's device list says
        # the image has it (it has not so far, so it takes no Mac).
        family: ${{ fromJSON(needs.plan.outputs.families) }}
    # An owned simulator mini from the plan job's picker on attempt 1, ephemeral Blacksmith macOS 26 on a
    # re-run or a fork pull request (which reads no repository variables).
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-6vcpu-macos-26' || fromJSON(github.run_attempt > 1 && contains(fromJSON('["github-actions[bot]","cmux-bot[bot]"]'), github.triggering_actor) && needs.plan.outputs.retry_runs_on || needs.plan.outputs.runs_on) }}
    timeout-minutes: 120
    env:
      LANE: ${{ needs.plan.outputs.lane }}
      # 'false' when gate-products built this commit's products: the leg takes them and builds nothing.
      BUILD_HERE: ${{ needs.gate-products-fleet.outputs.use != 'true' }}
      CMUX_CI_XCODE_APP: ${{ github.run_attempt == 1 && startsWith(needs.plan.outputs.label, 'glaeda-') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.CMUX_CI_XCODE_APP_PR || '' }}
    steps:
      - name: Result paths
        run: |
          # Under RUNNER_TEMP: upload-artifact refuses a path with '..'
          # (run 42799920852 lost every result that way).
          echo "DERIVED=${CMUX_DERIVED_DATA_SLOT:-$RUNNER_TEMP/dd}" >> "$GITHUB_ENV"
          echo "RESULTS=$RUNNER_TEMP/results" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/dd" "$RUNNER_TEMP/results"
      # The app source at the workspace root, so its local actions resolve;
      # the gate beside it in .review-gate (outside cmux-next-ios, which is
      # all xcodegen reads).
      - name: Checkout the app source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - name: Checkout the gate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.plan.outputs.gate_sha }}
          path: .review-gate
          persist-credentials: false
          sparse-checkout: |
            cmux-next-ios/scripts
            cmux-next-ios/AppStoreReview
            cmux-next-ios/UITests
            .github/scripts
      - name: Select Xcode
        run: ./scripts/select-ci-xcode.sh
      - name: The source is the NEXT app
        run: |
          set -euo pipefail
          if [ ! -f cmux-next-ios/project.yml ]; then
            # The gate judges the NEXT app only.
            echo "::error::${{ needs.plan.outputs.sha }} has no cmux-next-ios/project.yml: it is not the NEXT iOS app, so there is no reviewer path to walk" >&2
            exit 1
          fi
          # UITests is a whole-directory source in project.yml, so the copy
          # is compiled with no project edit.
          cp .review-gate/cmux-next-ios/UITests/AppReviewGateUITests.swift cmux-next-ios/UITests/
          mkdir -p cmux-next-ios/AppStoreReview
          cp .review-gate/cmux-next-ios/AppStoreReview/rejection-history.json cmux-next-ios/AppStoreReview/
      - name: Install xcodegen
        run: |
          set -euo pipefail
          command -v xcodegen >/dev/null || brew install xcodegen
          xcrun simctl list runtimes available | grep -Eq '\biOS\b' || xcodebuild -downloadPlatform iOS
      - name: Pick the ${{ matrix.family }} simulator
        env:
          FAMILY: ${{ matrix.family }}
        # Before the build: only the picker's no-simulator exit skips the
        # leg (with a marker the report reads); any other failure fails it.
        run: bash .review-gate/cmux-next-ios/scripts/app_review_pick_step.sh "$FAMILY"
      - name: Check the plan's device list on this image
        # The same picker for every family the plan decided, creating
        # nothing: a family the plan skipped that this image has, or one it
        # walks that the image lacks, is named here and fails the report.
        # The walk still runs.
        if: fromJSON(needs.plan.outputs.devices).decided
        continue-on-error: true
        env:
          DEVICE_PLAN: ${{ needs.plan.outputs.devices }}
        run: |
          python3 -I .review-gate/.github/scripts/ios_review_gate_devices.py check --plan "$DEVICE_PLAN" \
            --picker .review-gate/cmux-next-ios/scripts/app_review_pick_simulator.py \
            --out "$RESULTS/device-plan-mismatch.json"
      # CmuxMobileLinkFFI.xcframework is built only when what it is built from changes
      # (.github/scripts/ios_link_ffi_key.py): each job built it from scratch,
      # about 3 minutes of a Mac (run 43652999096). It lives in cmux NEXT's
      # R2 bucket: the Blacksmith Macs' GitHub store kept no save for a later
      # run (runs 43708277177 to 43721191135). Every run reads it with no
      # credential; seed-link-ffi below writes it on feat-cmux-next.
      - name: The framework's inputs
        id: ffi-key
        if: env.UDID != '' && env.BUILD_HERE == 'true'
        run: |
          set -euo pipefail
          # A ref from before the key script, or a key that fails, builds as before.
          if [ -f .review-gate/.github/scripts/ios_link_ffi_key.py ]; then
            python3 -I .review-gate/.github/scripts/ios_link_ffi_key.py --repo . --explain \
              --extra "xcode=$(xcodebuild -version | tr '\n' ' ')" --extra "runner=$RUNNER_OS-$RUNNER_ARCH" >> "$GITHUB_OUTPUT" \
              || echo "::warning::no cache key for CmuxMobileLinkFFI.xcframework; building it"
          fi
      - name: Restore the framework built from the same inputs
        id: ffi
        if: env.UDID != '' && env.BUILD_HERE == 'true' && steps.ffi-key.outputs.key != ''
        uses: ./.github/actions/cache-restore
        env:
          CI_CACHE_R2_PUBLIC_URL: https://ci-cache-next.cmux.com
          # The key names the Xcode build and the runner; the Linux writer
          # is not the Mac that built it.
          CI_CACHE_R2_NAMESPACE: ios-link-ffi
        with:
          backend: r2
          # One directory per entry: the framework and its generated Swift.
          path: ${{ runner.temp }}/link-ffi
          key: ios-link-ffi-xcframework-${{ steps.ffi-key.outputs.key }}
      - name: Put the restored framework in place
        id: ffi-place
        if: env.UDID != '' && env.BUILD_HERE == 'true' && steps.ffi.outputs.cache-hit == 'true'
        # An incomplete entry builds the framework instead of failing the leg.
        continue-on-error: true
        run: |
          set -euo pipefail
          test -d "$RUNNER_TEMP/link-ffi/CmuxMobileLinkFFI.xcframework"
          test -f "$RUNNER_TEMP/link-ffi/CmuxMobileLinkFFI.swift"
          kit=cmux-next-ios/CmuxMobileKit
          rm -rf "$kit/Frameworks/CmuxMobileLinkFFI.xcframework"
          mkdir -p "$kit/Frameworks" "$kit/Sources/CmuxMobileLinkFFI"
          cp -R "$RUNNER_TEMP/link-ffi/CmuxMobileLinkFFI.xcframework" "$kit/Frameworks/"
          cp "$RUNNER_TEMP/link-ffi/CmuxMobileLinkFFI.swift" "$kit/Sources/CmuxMobileLinkFFI/"
      # cmux-next-ios/rust pins the same toolchain as cmux-tui.
      - name: Set up pinned Rust
        if: env.UDID != '' && env.BUILD_HERE == 'true' && (steps.ffi.outputs.cache-hit != 'true' || steps.ffi-place.outcome != 'success')
        uses: ./.github/actions/setup-cmux-tui-rust
      - name: Cache cargo
        if: env.UDID != '' && env.BUILD_HERE == 'true' && (steps.ffi.outputs.cache-hit != 'true' || steps.ffi-place.outcome != 'success')
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && github.event_name != 'merge_group' && contains(fromJSON('["refs/heads/main","refs/heads/feat-cmux-next","refs/heads/nightly-next"]'), github.ref) }}
          # Why: docs/ci/cmux-next-workflow-notes.md#note-210 (pool runners keep different leftover toolchains)
          add-rust-environment-hash-key: false
          cache-bin: false
          workspaces: cmux-next-ios/rust
          key: ios-review-gate-${{ hashFiles('cmux-tui/rust-toolchain.toml', 'cmux-next-ios/rust/Cargo.lock', '.cargo/config.toml') }}
      - name: Build CmuxMobileLinkFFI.xcframework
        if: env.UDID != '' && env.BUILD_HERE == 'true' && (steps.ffi.outputs.cache-hit != 'true' || steps.ffi-place.outcome != 'success')
        env:
          JOBS: "6"
        run: bash cmux-next-ios/rust/scripts/build-xcframework.sh
      # This job never holds the bucket's write credentials: one leg hands
      # what it built to seed-link-ffi.
      - name: Stage the framework for the cache writer
        id: ffi-out
        if: env.UDID != '' && env.BUILD_HERE == 'true' && steps.ffi-key.outputs.key != '' && steps.ffi.outputs.cache-hit != 'true' && github.event_name == 'push' && matrix.family == 'iphone'
        continue-on-error: true
        env:
          FFI_KEY: ${{ steps.ffi-key.outputs.key }}
        run: |
          set -euo pipefail
          kit=cmux-next-ios/CmuxMobileKit
          out="$RUNNER_TEMP/link-ffi-out"
          mkdir -p "$out/framework"
          cp -R "$kit/Frameworks/CmuxMobileLinkFFI.xcframework" "$out/framework/"
          cp "$kit/Sources/CmuxMobileLinkFFI/CmuxMobileLinkFFI.swift" "$out/framework/"
          printf '%s\n' "$FFI_KEY" > "$out/key"
      - name: Hand the framework to the cache writer
        if: steps.ffi-out.outcome == 'success' && steps.ffi.outputs.cache-hit != 'true' && github.event_name == 'push'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-link-ffi-framework
          path: ${{ runner.temp }}/link-ffi-out
          retention-days: 1
          if-no-files-found: ignore
      # Package resolution is its own step so a refused GitHub fetch never ends
      # the leg. Run 45746201444 lost both device legs (cmux9, cmux10) to
      # `xcodebuild: error: Could not resolve package dependencies: ... swift-crypto.git:
      # The requested URL returned error: 403`. Their kept DerivedData slot already held
      # every clone, but Xcode refetches each remote before it builds. As test-ios.yml does,
      # a stamp of the Xcode version and every package manifest the app pulls in lets the
      # same inputs resolve offline (-skipPackageUpdates). Otherwise the step fetches with
      # three tries, and as a last resort resolves from whatever clones the slot keeps.
      - name: Resolve packages
        if: env.UDID != '' && env.BUILD_HERE == 'true'
        working-directory: cmux-next-ios
        run: |
          set -euo pipefail
          xcodegen generate -q
          dest="$(python3 -I ../.review-gate/cmux-next-ios/scripts/app_review_pick_simulator.py --family iphone --print-destination)"
          spm="$DERIVED/SourcePackages"
          stamp="$spm/.cmux-review-gate-resolved-sha256"
          inputs_sha="$( { xcodebuild -version; cat project.yml;
            git -C .. ls-files -z -- 'cmux-next-ios/**/Package.swift' 'cmux-next-ios/**/Package.resolved' \
              'Packages/**/Package.swift' 'Packages/**/Package.resolved' | sort -z | (cd .. && xargs -0 cat); } \
            | shasum -a 256 | cut -d' ' -f1)"
          resolve() {
            xcodebuild -project CmuxMobileApp.xcodeproj -scheme CmuxMobileApp \
              -destination "$dest,arch=arm64" -derivedDataPath "$DERIVED" "$@" -resolvePackageDependencies \
              > "$RESULTS/resolve.log" 2>&1
          }
          if [ "$(cat "$stamp" 2>/dev/null)" = "$inputs_sha" ] && resolve -skipPackageUpdates; then
            echo "packages: resolved offline from the kept clones (inputs $inputs_sha)"
          else
            rm -f "$stamp"
            ok=false
            for wait_s in 0 30 90; do
              sleep "$wait_s"
              if resolve; then ok=true; break; fi
              echo "::warning::package resolution failed (next wait after ${wait_s}s): $(grep -m1 -E 'error|fatal' "$RESULTS/resolve.log" | cut -c1-300)"
            done
            if [ "$ok" != true ] && [ -d "$spm/repositories" ] && resolve -skipPackageUpdates; then
              echo "::warning::GitHub refused every fetch; resolved from the clones this slot keeps"
              ok=true
            fi
            if [ "$ok" != true ]; then
              cat "$RESULTS/resolve.log"
              echo "::error::could not resolve package dependencies (3 tries and the kept clones)"
              exit 1
            fi
            mkdir -p "$spm"
            printf '%s\n' "$inputs_sha" > "$stamp"
          fi
      - name: Build the app and the gate for testing
        if: env.UDID != '' && env.BUILD_HERE == 'true'
        working-directory: cmux-next-ios
        run: |
          set -euo pipefail
          dest="$(python3 -I ../.review-gate/cmux-next-ios/scripts/app_review_pick_simulator.py --family iphone --print-destination)"
          # Debug: the mock account the walk signs in with is DEBUG only.
          # CMUX_MOBILE_APPLE_SIGN_IN=YES shows Sign in with Apple, as the
          # App Store configurations do (Debug hides it).
          # TARGETED_DEVICE_FAMILY=1: every build App Review gets is iPhone-only, so on iPad it
          # runs in compatibility mode (the iPhone layout in a phone-sized window). Debug alone
          # also targets iPad (project.yml, for the foldable harness on an iPad mini), and walked
          # as is, the iPad leg judged a two-pane layout no reviewer sees: run 45334322455 failed
          # 8 iPad tests that wait for the tab bar ("the shell must show") on that layout.
          xcodebuild -project CmuxMobileApp.xcodeproj -scheme CmuxMobileApp -configuration Debug \
            -destination "$dest,arch=arm64" -derivedDataPath "$DERIVED" -enableCodeCoverage NO \
            -skipPackageUpdates \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            CMUX_MOBILE_APPLE_SIGN_IN=YES TARGETED_DEVICE_FAMILY=1 \
            build-for-testing 2>&1 | tee "$RESULTS/build.log" | { grep -E 'error:|BUILD' || true; }
          # xcodebuild's own status: `|| true` on the pipeline would replace it.
          test "${PIPESTATUS[0]}" -eq 0
      # gate-products' build of this commit: Products/ with the .xctestrun, the app and its UI test runner.
      - name: Download the products the build fleet built
        if: env.UDID != '' && env.BUILD_HERE != 'true'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ios-gate-products-${{ env.LANE }}
          path: ${{ runner.temp }}/gate-products
      - name: Put the products in place
        if: env.UDID != '' && env.BUILD_HERE != 'true'
        run: |
          set -euo pipefail
          # Its own directory, not the derived data slot: a slot's earlier Build/Products is not this commit.
          mkdir -p "$RUNNER_TEMP/gate-build"
          tar -xzf "$RUNNER_TEMP/gate-products/ios-sim-build.tar.gz" -C "$RUNNER_TEMP/gate-build"
          echo "PRODUCTS=$RUNNER_TEMP/gate-build/Products" >> "$GITHUB_ENV"
          echo "built by the build fleet (gate-products, run $GITHUB_RUN_ID); this leg built nothing" > "$RESULTS/build.log"
          find "$RUNNER_TEMP/gate-build/Products" -maxdepth 2 \( -name '*.xctestrun' -o -name '*.app' \) -print
      - name: Walk the reviewer path on ${{ matrix.family }}
        if: env.UDID != ''
        env:
          FAMILY: ${{ matrix.family }}
        run: |
          # Never -e (Actions runs `bash -e`): a failing suite must still
          # write its status and result for the report (run 42947653685
          # stopped at the first exit 65).
          set +e
          set -uo pipefail
          family="$FAMILY"
          udid="$UDID"
          xctestrun="$(find "${PRODUCTS:-$DERIVED/Build/Products}" -name '*.xctestrun' | head -n 1)"
          xcrun simctl boot "$udid" 2>/dev/null || true
          xcrun simctl bootstatus "$udid" -b
          # A fixed status bar: the clock and battery are not the app, and the
          # report's screen diff against feat-cmux-next counted them as changes.
          xcrun simctl status_bar "$udid" override --time 9:41 --batteryState charged --batteryLevel 100 \
            --cellularMode active --cellularBars 4 --wifiBars 3 || true
          # iPad runs in dark mode, iPhone and Duo in light, so both
          # appearances are walked every run.
          if [ "$family" = ipad ]; then xcrun simctl ui "$udid" appearance dark || true; fi
          xcodebuild test-without-building -xctestrun "$xctestrun" \
            -destination "id=$udid,arch=arm64" -resultBundlePath "$RESULTS/$family.xcresult" \
            -only-testing:CmuxMobileAppUITests/AppReviewGateUITests \
            > "$RESULTS/$family.log" 2>&1
          code=$?
          grep -E ' error: |^Test Case .* failed|Executed [0-9]+ tests|^GATE-NOTE ' "$RESULTS/$family.log" || true
          # The report reads this: a suite that failed with no failed test
          # in its result (a crash, a build-for-testing mismatch) blocks.
          echo "{\"family\":\"$family\",\"exit\":$code}" > "$RESULTS/$family.status.json"
          # What rendered these stills, kept beside the goldens seed-goldens files under their input key
          # (cmux-shotdiff key). Not *.json: the report reads every review-gate-* JSON.
          python3 -I - "$udid" "$family" > "$RESULTS/$family.renderer" <<'FACTS' || true
          import json, subprocess, sys
          def out(*cmd):
              try:
                  return subprocess.run(cmd, capture_output=True, text=True, timeout=60).stdout.strip()
              except Exception:
                  return ""
          udid, family = sys.argv[1], sys.argv[2]
          device = {}
          for runtime, devices in json.loads(out("xcrun", "simctl", "list", "devices", "-j") or "{}").get("devices", {}).items():
              for d in devices:
                  if d.get("udid") == udid:
                      device = {"runtime": runtime, "name": d.get("name"), "type": d.get("deviceTypeIdentifier")}
          print(json.dumps({"family": family, "xcode": out("xcodebuild", "-version").replace("\n", " "),
                            "macos": out("sw_vers", "-productVersion"), "arch": out("uname", "-m"),
                            "appearance": "dark" if family == "ipad" else "light", "simulator": device}))
          FACTS
          xcrun xcresulttool get test-results tests --path "$RESULTS/$family.xcresult" > "$RESULTS/$family.json" || true
          mkdir -p "$RESULTS/screens/$family"
          xcrun xcresulttool export attachments --path "$RESULTS/$family.xcresult" --output-path "$RESULTS/screens/$family" >/dev/null 2>&1 || true
          # The iPad's stills at half size (1032x1376 on a 13-inch): full size they were 411 MB,
          # which the report's Linux runner could not download in its 6 min (3 of 4 pull request
          # runs on 2026-11-23) nor fetch as the baseline within the screen diff's 180 s. Only the
          # screen diff reads them, comparing like with like; same input, same resample.
          if [ "$family" = ipad ]; then
            find "$RESULTS/screens/$family" -name '*.png' -type f -print0 | while IFS= read -r -d '' png; do
              long="$(sips -g pixelWidth -g pixelHeight "$png" 2>/dev/null | awk '/pixel/ { if ($2 > m) m = $2 } END { print int(m / 2) }')"
              if [ "${long:-0}" -gt 0 ]; then sips --resampleHeightWidthMax "$long" "$png" >/dev/null 2>&1 || true; fi
            done
          fi
          # The report job decides; this step only records.
          exit 0
      - name: Upload results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # One artifact per device; the report downloads every review-gate-*.
          # The stills go in their own ios-gate-stills-* artifact below: the
          # iPad's are over 200 MB, and downloading them before the verdict ran
          # the report job past its timeout (a cancelled, red gate, run
          # 45078446389, with every leg green).
          name: review-gate-path-${{ env.LANE }}-${{ matrix.family }}
          path: |
            ${{ env.RESULTS }}/*.json
            ${{ env.RESULTS }}/*.log
          if-no-files-found: error
          retention-days: 3
      - name: Upload stills
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # Not review-gate-*: only the screen diff reads these. The status file
          # keeps RESULTS the common root, so the zip holds screens/<family>/.
          name: ios-gate-stills-${{ env.LANE }}-${{ matrix.family }}
          path: |
            ${{ env.RESULTS }}/*.status.json
            ${{ env.RESULTS }}/*.renderer
            ${{ env.RESULTS }}/screens
          if-no-files-found: warn
          retention-days: 3
      # The xcresult bundles (about 1 GB) are not uploaded: their test results,
      # logs and screenshots are exported above, which is all the report reads.

  asc-validate:
    # Apple's own readiness check, read-only: the version, the attached
    # build, metadata and screenshots, --strict. The NEXT app sells nothing,
    # so there is no subscription or in-app purchase check. Needs the release
    # environment, which serves main and rc/**: the appstore lane from main's
    # production pipeline, internal-submission (cmux INTERNAL, app
    # vars.IOS_INTERNAL_APP_ID) from the INTERNAL builder on rc/cnx-ios-builder.
    # Anywhere else it skips, and an internal-submission report then blocks
    # (asc.missing): that lane is never judged without Apple's check.
    needs: plan
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft != true || contains(github.event.pull_request.labels.*.name, 'full-ci') || (vars.CI_DRAFT_CHEAP_TIER || '1') == '0') && (github.event_name != 'pull_request' && ((needs.plan.outputs.lane == 'appstore' && github.ref == 'refs/heads/main') || (needs.plan.outputs.lane == 'internal-submission' && github.ref == 'refs/heads/rc/cnx-ios-builder'))) }}
    environment: release
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-6vcpu-macos-26' || fromJSON(vars.RUNNER_POOLS).macos_26 }}
    timeout-minutes: 20
    env:
      ASC_APP_ID: ${{ needs.plan.outputs.lane == 'internal-submission' && vars.IOS_INTERNAL_APP_ID || vars.IOS_APPSTORE_APP_ID }}
      LANE: ${{ needs.plan.outputs.lane }}
    steps:
      # Nothing from the judged source runs here: this job holds the App
      # Store Connect key. The gate's own scripts come from gate_sha, the
      # judged source is only read as data, and the version is read before
      # any secret is in the environment.
      - name: Checkout the gate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.plan.outputs.gate_sha }}
          path: gate
          persist-credentials: false
          sparse-checkout: |
            cmux-next-ios/scripts
            scripts/select-ci-xcode.sh
            scripts/ci/xcode-pins.txt
            .xcode-version
            .gitmodules
          sparse-checkout-cone-mode: false
      - name: Checkout the app source (data only)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.plan.outputs.sha }}
          path: app
          persist-credentials: false
          sparse-checkout: |
            cmux-next-ios/project.yml
            cmux-next-ios/AppStoreReview
            .gitmodules
          sparse-checkout-cone-mode: false
      - name: Select Xcode
        run: ./gate/scripts/select-ci-xcode.sh
      - name: Install asc
        run: brew list asc >/dev/null 2>&1 || brew install asc
      - name: The version to validate
        id: version
        run: |
          set -euo pipefail
          # The lane's configuration's MARKETING_VERSION (project.yml: AppStore,
          # or TestFlight's base one for internal-submission), read by the
          # gate's own script before any secret is exposed.
          version="$(python3 -I gate/cmux-next-ios/scripts/app_review_gate.py version --source-root app --lane "$LANE" || true)"
          [[ -z "$version" || "$version" =~ ^[0-9][0-9.]*$ ]] || version=""
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: asc validate --strict (read-only)
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          ASC_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -uo pipefail
          key="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$ASC_API_KEY_P8_BASE64" | base64 --decode > "$key"
          chmod 600 "$key"
          export ASC_KEY_ID="$ASC_API_KEY_ID" ASC_ISSUER_ID="$ASC_API_ISSUER_ID" ASC_PRIVATE_KEY_PATH="$key"
          version="$ASC_VERSION"
          if ! [[ "$ASC_APP_ID" =~ ^[0-9]+$ ]]; then
            # No app to validate against (vars.IOS_APPSTORE_APP_ID or vars.IOS_INTERNAL_APP_ID unset): fail closed.
            echo "{\"issues\":[{\"severity\":\"error\",\"code\":\"app.unknown\",\"message\":\"no App Store Connect app id for lane $LANE (repository variable IOS_APPSTORE_APP_ID or IOS_INTERNAL_APP_ID)\"}]}" > asc-validate.json
          elif [ -z "$version" ]; then
            echo '{"issues":[{"severity":"error","code":"version.unknown","message":"no MARKETING_VERSION in cmux-next-ios/project.yml"}]}' > asc-validate.json
          else
            asc validate --app "$ASC_APP_ID" --version "$version" --platform IOS --strict --output json > asc-validate.json || true
            # The app's version history: its first App Store version takes no
            # What's New (App Store Connect refuses it, run 45102744374).
            asc versions list --app "$ASC_APP_ID" --platform IOS --paginate --output json > app-store-versions.json || true
          fi
          if [ -d app/cmux-next-ios/AppStoreReview/metadata ]; then
            asc metadata validate --dir app/cmux-next-ios/AppStoreReview/metadata --output json > asc-metadata.json || true
          fi
          rm -f "$key"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        continue-on-error: true
        with:
          name: review-gate-asc
          path: |
            asc-*.json
            app-store-versions.json
          retention-days: 3

  # Writes the framework a leg built into cmux NEXT's R2 bucket, which the
  # legs read with no credential. The write credentials live in the
  # next-cache-writer environment (feat-cmux-next only), held by this Linux
  # job alone (tests/test_ci_pull_request_caches_are_read_only.py).
  seed-link-ffi:
    needs: reviewer-path
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft != true || contains(github.event.pull_request.labels.*.name, 'full-ci') || (vars.CI_DRAFT_CHEAP_TIER || '1') == '0') && (!cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/feat-cmux-next') }}
    # A seed that fails never turns the push run red; the report does not need it.
    continue-on-error: true
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || vars.CI_OVERFLOW_LINUX || 'cmux-linux' }}
    timeout-minutes: 10
    environment: ${{ github.ref == 'refs/heads/feat-cmux-next' && 'next-cache-writer' || '' }}
    env:
      CI_CACHE_R2_BUCKET: cmux-ci-cache-next
      # r2-cache.sh saves nothing without it.
      CI_CACHE_R2_PUBLIC_URL: https://ci-cache-next.cmux.com
      CI_CACHE_R2_NAMESPACE: ios-link-ffi
    steps:
      - name: Fetch the framework a leg built
        id: fetched
        continue-on-error: true
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ios-link-ffi-framework
          path: ${{ runner.temp }}/link-ffi
      - name: The framework's key
        id: staged
        if: steps.fetched.outcome == 'success'
        run: |
          set -euo pipefail
          key="$(head -c 128 "$RUNNER_TEMP/link-ffi/key" | tr -d '[:space:]')"
          if [[ "$key" =~ ^[0-9a-f]{64}$ ]] && [ -d "$RUNNER_TEMP/link-ffi/framework/CmuxMobileLinkFFI.xcframework" ] \
              && [ -f "$RUNNER_TEMP/link-ffi/framework/CmuxMobileLinkFFI.swift" ]; then
            echo "key=$key" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::the handed-off framework is incomplete; nothing saved"
          fi
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        if: steps.staged.outputs.key != ''
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/actions/cache-save
            scripts/ci/r2-cache.sh
            scripts/ci/lan_cache_fetch.py
            .gitmodules
          sparse-checkout-cone-mode: false
      - name: Save the framework for later runs
        if: steps.staged.outputs.key != ''
        # Another run saving the same key first is not a failure.
        continue-on-error: true
        uses: ./.github/actions/cache-save
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CI_CACHE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CI_CACHE_R2_SECRET_ACCESS_KEY }}
          CI_CACHE_R2_ENDPOINT: ${{ format('https://{0}.r2.cloudflarestorage.com', secrets.CI_CACHE_R2_ACCOUNT_ID) }}
        with:
          backend: r2
          path: ${{ runner.temp }}/link-ffi/framework
          key: ios-link-ffi-xcframework-${{ steps.staged.outputs.key }}

  # Files each leg's stills as the Mac golden of their inputs (B9 mac-golden-cache). `cmux-shotdiff key`
  # hashes every file .github/golden-inputs.json names for the ios-gate family at the gated commit; the
  # stills go into a cmux-shotdiff golden store saved to R2 as golden-ios-gate-<variant>-<key> (namespace
  # `goldens`, scripts/ci/r2-cache.sh). Any runner restores that store without credentials and judges its
  # own render against it with .github/actions/shotdiff, so a Linux render of unchanged inputs needs no
  # Mac. It renders nothing: it keeps what the legs already rendered. The first render of a key stays the
  # golden; a later one is checked against it, and the summary says whether the Mac render repeats.
  # Advisory, push runs only.
  seed-goldens:
    needs: [plan, reviewer-path]
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/feat-cmux-next' && needs.plan.result == 'success' }}
    continue-on-error: true
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.CI_OVERFLOW_LINUX || 'cmux-linux' }}
    timeout-minutes: 20
    environment: ${{ github.ref == 'refs/heads/feat-cmux-next' && 'next-cache-writer' || '' }}
    env:
      CI_CACHE_R2_BUCKET: cmux-ci-cache-next
      CI_CACHE_R2_PUBLIC_URL: https://ci-cache-next.cmux.com
      CI_CACHE_R2_NAMESPACE: goldens
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.plan.outputs.gate_sha }}
          persist-credentials: false
          # The key reads git trees only, which a sparse checkout still has; cmux-tui builds the binary.
          sparse-checkout: |
            .github/
            scripts/ci/r2-cache.sh
            scripts/ci/lan_cache_fetch.py
            scripts/ci/ios_gate_screen_diff.py
            scripts/ci/deadline_http.py
            cmux-tui/
          sparse-checkout-cone-mode: false
      - name: Fetch the legs' stills
        continue-on-error: true
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: ios-gate-stills-${{ needs.plan.outputs.lane }}-*
          path: ${{ runner.temp }}/stills
          merge-multiple: true
      - name: Any passing walk?
        id: walks
        env:
          STILLS: ${{ runner.temp }}/stills
        run: |
          set -uo pipefail
          passed=""
          for family in iphone ipad duo; do
            # Only a walk that passed is a golden; a failed one may have stopped halfway.
            if python3 -I -c 'import json, sys; sys.exit(json.load(open(sys.argv[1])).get("exit") != 0)' \
                "$STILLS/$family.status.json" 2>/dev/null && compgen -G "$STILLS/screens/$family/*.png" >/dev/null; then
              passed="$passed $family"
            else
              echo "$family: no passing walk in this run; nothing filed"
            fi
          done
          echo "families=${passed# }" >> "$GITHUB_OUTPUT"
      - name: Name the stills as the screen diff does
        if: ${{ steps.walks.outputs.families != '' }}
        env:
          STILLS: ${{ runner.temp }}/stills
          HEADS: ${{ runner.temp }}/heads
          FAMILIES: ${{ steps.walks.outputs.families }}
        # Exported attachments carry a fresh UUID in their file name; a golden needs the name the screen
        # diff matches by (ios_gate_screen_diff.load_screens), in cmux-shotdiff's name alphabet.
        run: |
          set -euo pipefail
          python3 -I - <<'NAMES'
          import os, re, shutil, sys
          from pathlib import Path
          sys.path.insert(0, "scripts/ci")
          from ios_gate_screen_diff import load_screens
          for family in os.environ["FAMILIES"].split():
              out = Path(os.environ["HEADS"]) / family
              out.mkdir(parents=True, exist_ok=True)
              screens = load_screens(Path(os.environ["STILLS"]) / "screens" / family)
              for name, path in screens.items():
                  shutil.copyfile(path, out / (re.sub(r"[^A-Za-z0-9._@+-]", "_", name.replace("#", "@")) + ".png"))
              print(f"{family}: {len(screens)} stills")
          NAMES
      - name: Set up pinned Rust
        if: ${{ steps.walks.outputs.families != '' }}
        uses: ./.github/actions/setup-cmux-tui-rust
      - name: Build cmux-shotdiff
        if: ${{ steps.walks.outputs.families != '' }}
        working-directory: cmux-tui
        run: |
          set -euo pipefail
          timeout 900 cargo build --locked --release -p cmux-shotdiff --bin cmux-shotdiff
          echo "CMUX_SHOTDIFF=$PWD/target/release/cmux-shotdiff" >> "$GITHUB_ENV"
      - name: File them under their input key
        if: ${{ steps.walks.outputs.families != '' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CI_CACHE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CI_CACHE_R2_SECRET_ACCESS_KEY }}
          CI_CACHE_R2_ENDPOINT: ${{ format('https://{0}.r2.cloudflarestorage.com', secrets.CI_CACHE_R2_ACCOUNT_ID) }}
          STILLS: ${{ runner.temp }}/stills
          HEADS: ${{ runner.temp }}/heads
          WORK: ${{ runner.temp }}/goldens
          FAMILIES: ${{ steps.walks.outputs.families }}
          GATE_SHA: ${{ needs.plan.outputs.gate_sha }}
        run: |
          set -uo pipefail
          {
            echo "### Mac goldens by input key (ios-gate)"
            echo
            echo "| variant | key | files | outcome |"
            echo "|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          for family in $FAMILIES; do
            keyjson="$("$CMUX_SHOTDIFF" key --inputs .github/golden-inputs.json --family ios-gate \
              --variant "$family" --rev "$GATE_SHA")" || { echo "::warning::$family: no input key"; continue; }
            key="$(jq -r .key <<<"$keyjson")"
            files="$(jq -r .files <<<"$keyjson")"
            name="golden-ios-gate-$family-$key"
            store="$WORK/$family"
            mkdir -p "$store"
            if scripts/ci/r2-cache.sh restore "$store" "$name" >/dev/null 2>&1 && [[ -f "$store/goldens.json" ]]; then
              # First render wins: check this one against it instead of replacing it.
              if "$CMUX_SHOTDIFF" batch --store "$store" --heads "$HEADS/$family" \
                  --out "$WORK/$family-check" --title "ios-gate $family: this render against the filed golden" \
                  --summary "$GITHUB_STEP_SUMMARY"; then
                outcome="already filed; this render matches"
              else
                outcome="already filed; this render differs (report in the summary)"
              fi
            else
              rm -rf "$store" && mkdir -p "$store"
              if ! "$CMUX_SHOTDIFF" bless --store "$store" --dir "$HEADS/$family" >/dev/null; then
                echo "::warning::$family: stills not blessed"; continue
              fi
              cp "$STILLS/$family.renderer" "$store/renderer.json" 2>/dev/null || true
              jq -n --argjson key "$keyjson" --arg sha "$GATE_SHA" --arg run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
                '{key: $key, gate_sha: $sha, run: $run}' > "$store/source.json"
              if scripts/ci/r2-cache.sh save "$store" "$name"; then
                outcome="filed ($(jq '.goldens | length' "$store/goldens.json") stills)"
              else
                outcome="not filed (save failed)"; echo "::warning::$family: goldens not saved"
              fi
            fi
            echo "| $family | \`${key:0:12}\` | $files | $outcome |" >> "$GITHUB_STEP_SUMMARY"
          done

  report:
    needs: [plan, lint, reviewer-path, asc-validate]
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft != true || contains(github.event.pull_request.labels.*.name, 'full-ci') || (vars.CI_DRAFT_CHEAP_TIER || '1') == '0') && (!cancelled() && needs.plan.result == 'success') }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || vars.CI_OVERFLOW_LINUX || 'cmux-linux' }}
    # The verdict needs only the small review-gate-* files; the stills download
    # and the screen diff that follow have their own step timeouts.
    timeout-minutes: 20
    # actions: read lets the screen diff download the newest feat-cmux-next
    # push run's ios-gate-stills-* (scripts/ci/ios_gate_screen_diff.py).
    permissions:
      contents: read
      actions: read
    outputs:
      blocking: ${{ steps.report.outputs.blocking }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.plan.outputs.gate_sha }}
          persist-credentials: false
          sparse-checkout: |
            cmux-next-ios/scripts
            cmux-next-ios/AppStoreReview
            scripts/ci
      # A pull request is judged on its base's known blockers, never on a list
      # it could edit to pin its own regression.
      - name: Checkout the base's known blockers
        if: github.event_name == 'pull_request'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false
          sparse-checkout: cmux-next-ios/AppStoreReview
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        continue-on-error: true
        with:
          pattern: review-gate-*
          path: in
      - name: One ranked list
        id: report
        env:
          ASC_RESULT: ${{ needs.asc-validate.result }}
          EVENT: ${{ github.event_name }}
          JUDGED_SHA: ${{ needs.plan.outputs.sha }}
          # The screen diff reads feat-cmux-next's push runs with it.
          GH_TOKEN: ${{ github.token }}
          GATE_LANE: ${{ needs.plan.outputs.lane }}
          # A direct push or pull_request run fails on a new blocker only:
          # the ones in known-blockers.json were there before it. A
          # submission (dispatch, or a call from the production pipeline)
          # refuses every blocker.
          RATCHET: ${{ contains(github.workflow_ref, '/.github/workflows/ios-review-gate.yml@') && (github.event_name == 'push' || github.event_name == 'pull_request') }}
        run: |
          set -uo pipefail
          echo "Judged: \`$JUDGED_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          args=(report --out review-gate.md)
          # Fail closed: a missing lint or device result blocks. Each device
          # is its own reviewer-path job; one that failed, was cancelled or
          # uploaded nothing leaves no result. Duo alone may instead leave
          # its skip marker (no Duo simulator on the image).
          # download-artifact puts a lone artifact straight into in/, not
          # in/<name>/, so find the files by name wherever they landed.
          args+=(--expect-lint --expect-device iphone --expect-device-or-skipped duo)
          # A pull request on the iPhone-only app leaves the plan's iPad skip marker instead
          # (see "Which device legs take a Mac"); every other run must have the iPad result.
          if [ "$EVENT" = pull_request ]; then args+=(--expect-device-or-skipped ipad); else args+=(--expect-device ipad); fi
          while IFS= read -r f; do args+=(--skipped "$f"); done < <(find in -name '*.skipped.json' -type f | sort)
          while IFS= read -r f; do args+=(--lint "$f"); done < <(find in -name 'lint-*.json' -type f | sort)
          for fam in iphone ipad duo; do
            while IFS= read -r f; do args+=(--xcresult-json "$f"); done < <(find in -name "$fam.json" -type f | sort)
          done
          while IFS= read -r f; do args+=(--suite-status "$f"); done < <(find in -name '*.status.json' -type f | sort)
          for fam in iphone ipad duo; do
            while IFS= read -r f; do args+=(--suite-log "$f"); done < <(find in -name "$fam.log" -type f | sort)
          done
          while IFS= read -r f; do args+=(--asc-validate "$f"); done < <(find in -name 'asc-*.json' -type f | sort)
          while IFS= read -r f; do args+=(--asc-versions "$f"); done < <(find in -name 'app-store-versions.json' -type f | sort | head -n1)
          if [ "$ASC_RESULT" = "skipped" ]; then args+=(--asc-skipped); fi
          known=cmux-next-ios/AppStoreReview/known-blockers.json
          if [ "$RATCHET" = true ] && [ -f "base/$known" ]; then
            args+=(--known-blockers "base/$known" --proposed-known-blockers "$known")
          elif [ "$RATCHET" = true ]; then
            # The base has no list yet: only the pull request that adds it.
            args+=(--known-blockers "$known")
          fi
          # Actions runs `bash -e`: take the verdict's status without exiting.
          code=0
          python3 -I cmux-next-ios/scripts/app_review_gate.py "${args[@]}" || code=$?
          echo "blocking=$(grep -oE '[0-9]+ blocking' review-gate.md | head -n1 | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          if [ "$code" -ne 0 ] && [ "$RATCHET" = true ]; then
            echo "::error::App Review gate: this change adds a blocker App Review would reject (see \"New in this change\" in the run summary)"
          elif [ "$RATCHET" = true ] && grep -q '^\*\*NO\*\*' review-gate.md; then
            echo "::warning::App Review gate: no new blocker, but the app would still not pass App Review (known-blockers.json); a submission run refuses it"
          fi
          # A leg whose image disagreed with the plan's device list: a
          # family skipped that the image has, or walked that it lacks.
          while IFS= read -r f; do
            echo "::error::App Review gate: a device leg's image disagrees with the plan ($f); check .github/ios-review-gate-devices.json"
            { echo; echo "**Device plan mismatch** ($f): this run fails until .github/ios-review-gate-devices.json is checked again."
              echo '```json'; cat "$f"; echo '```'; } | tee -a review-gate.md >> "$GITHUB_STEP_SUMMARY"
            code=1
          done < <(find in -name 'device-plan-mismatch.json' -type f | sort)
          exit $code
      # Warn only, after the verdict: a slow stills download can no longer
      # cancel the report (it did, run 45078446389).
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 6
        with:
          pattern: ios-gate-stills-*
          path: stills
      - name: Screen diff
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 9
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_LANE: ${{ needs.plan.outputs.lane }}
        run: |
          set -uo pipefail
          # Each family's stills against the newest feat-cmux-next push run's,
          # by attachment name: changed, new and removed screens, each
          # justified by a `Visual-change: <screen or *>: <why>` line in the
          # pull request body or not. It warns only and never sets $code.
          if [ -f scripts/ci/ios_gate_screen_diff.py ]; then
            timeout 420 python3 -I scripts/ci/ios_gate_screen_diff.py --head-root stills \
              --family iphone --family ipad --family duo --fetch-baseline --lane "$GATE_LANE" \
              --work "$RUNNER_TEMP/screen-baseline" --out "$RUNNER_TEMP/screens.md" \
              || echo "::warning::the iOS screen diff did not finish"
            if [ -f "$RUNNER_TEMP/screens.md" ]; then
              # Also into the log: a step summary has no API to read it back with.
              tee -a review-gate.md "$GITHUB_STEP_SUMMARY" < "$RUNNER_TEMP/screens.md"
              unjustified="$(grep -m1 -E '[0-9]+ iOS screens differ from feat-cmux-next with no Visual-change line' "$RUNNER_TEMP/screens.md" | tr -d '*' || true)"
              if [ -n "$unjustified" ]; then echo "::warning::$unjustified (see the run summary)"; fi
            fi
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: review-gate-report
          path: review-gate.md
          retention-days: 3
