name: Seed DerivedData

# Keeps a warm DerivedData for every main commit that changes the app-host
# build, so pull-request compile admission starts from its base commit's build,
# and main's full-suite run (ci-main-full-suite.yml) from its own commit's or
# the newest earlier one, instead of a cold compile (ci-macos.yml "Adopt the
# nightly DerivedData seed").
#
# Each seed builds incrementally from the newest earlier seed, so a merge costs
# the Mac time of its own diff: 30-130 s for one to five app files, measured in
# #13131, against about 950 s cold. nightly.yml `refresh-test-compilation-cache`
# writes a cold seed every six hours while CI_PR_POOL_OWNED is not 1, so a chain
# of incremental seeds never carries stale intermediates for long. While owned
# pools serve pull requests that schedule is off and the Blacksmith chains get
# no periodic cold reset; a seed_only dispatch of nightly.yml writes one.
#
# Separate from ci.yml on purpose: nothing waits on it. A pull request whose
# base has no seed yet adopts the newest one, and a miss is today's cold build.
#
# A push to main also publishes the app-host test product this build compiled,
# under the artifact name compile admission publishes it under. A pull request
# whose product inputs equal main's then adopts it in "Reuse exact compatible
# compiled products" instead of compiling, and so does an E2E dispatch of that
# commit (scripts/ci/reuse_app_host_products.py trusts only this workflow, on a
# main push, in this repository).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# The seeds build and save in seed-derived-data-pool.yml, which sets the R2
# public URL itself: a called workflow does not inherit this one's env.

jobs:
  decide:
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      build: ${{ steps.inputs.outputs.build }}
      pools: ${{ steps.inputs.outputs.pools }}
      matrix: ${{ steps.inputs.outputs.matrix }}
      # The pool that publishes the app-host product when it builds.
      publisher: ${{ steps.inputs.outputs.publisher }}
      # The pools whose seed goes in the far lane (seed_decide.py).
      far: ${{ steps.inputs.outputs.far }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          # seed_decide.py walks back up to ANCESTOR_LIMIT (30) commits.
          fetch-depth: 32

      # A push whose build fingerprint equals that of an existing seed (docs,
      # web, another workflow) builds exactly what that seed holds, and pull
      # requests fall back to it by prefix. Skip the Mac only then. The parent
      # is not enough: a newer push replaces a pending seed run, so the parent
      # often has no seed. seed_decide.py compares with the nearest seeded
      # ancestor instead, and builds on any doubt.
      - name: Compare build inputs with the nearest seed
        id: inputs
        env:
          GH_TOKEN: ${{ github.token }}
          XCODE_APP: ${{ vars.CMUX_CI_XCODE_APP_PR || vars.CMUX_CI_XCODE_APP_MACOS_15 }}
          XCODE_APP_MACOS_15: ${{ vars.CMUX_CI_XCODE_APP_MACOS_15 }}
          # The pools that seed; see the seed job. Each decides alone, so one
          # pool's failing seed never makes every push rebuild the others.
          SEED_POOL_1: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || vars.MACOS_RUNNER_PR == 'blacksmith-6vcpu-macos-26' && 'blacksmith-12vcpu-macos-26' || vars.MACOS_RUNNER_PR || 'blacksmith-6vcpu-macos-15' }}
          SEED_POOL_2: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || vars.MACOS_RUNNER_PR || 'blacksmith-6vcpu-macos-15' }}
          SEED_POOL_3: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || 'blacksmith-6vcpu-macos-15' }}
          # The owned std minis compile at -j14, and a j12 seed re-emits
          # every module there (cmuxterm-hq#590). Their j14 seed comes from a
          # trusted-only runner (glaeda-trusted-std-xcode-<version>, glaeda
          # docs/CMUX_MINI_RUNNER.md 2e) on a mini with no pull-request
          # runners, since every owned admission starts from the seed it
          # builds (the host choice is on cmuxterm-hq#590). It holds no R2
          # key: seed-derived-data-pool.yml's `save` uploads. Its job-started hook
          # admits only a push to main, so the pool joins only then. Empty
          # (the default) leaves it out.
          SEED_TRUSTED_POOL: ${{ github.repository == 'manaflow-ai/cmux' && github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CI_SEED_TRUSTED_POOL || '' }}
          # How many canonical roots the trusted pool seeds. An owned Mac's
          # second compile slot builds in /private/tmp/cmux-ci-2, which is
          # part of the seed key, so it never adopts a root 1 seed and
          # compiled cold (471 s, 98 re-emits, cmuxterm-hq#590). Each extra
          # root is one more job per push on the trusted pool, so raise it
          # only with a trusted runner to take it. Unset means 1.
          SEED_TRUSTED_ROOTS: ${{ vars.CI_SEED_TRUSTED_ROOTS || '1' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # Each pool's Xcode as the seed job picks it (its CMUX_CI_XCODE_APP).
          pools=()
          lanes=()
          if [ -n "$SEED_TRUSTED_POOL" ]; then
            case "$SEED_TRUSTED_ROOTS" in
              [1-9]) ;;
              *) echo "::error::CI_SEED_TRUSTED_ROOTS must be 1 to 9, not $SEED_TRUSTED_ROOTS"; exit 1 ;;
            esac
            for ((k = 2; k <= SEED_TRUSTED_ROOTS; k++)); do
              lanes+=("$SEED_TRUSTED_POOL@$k")
            done
          fi
          for pool in "$SEED_POOL_1" "$SEED_POOL_2" "$SEED_POOL_3" "$SEED_TRUSTED_POOL" ${lanes[@]+"${lanes[@]}"}; do
            case "$pool" in
              *vcpu-macos-15) pools+=(--pool "$pool=${XCODE_APP_MACOS_15:-$XCODE_APP}") ;;
              *) pools+=(--pool "$pool=$XCODE_APP") ;;
            esac
          done
          python3 scripts/ci/seed_decide.py --repository "$GITHUB_REPOSITORY" "${pools[@]}" \
            --event-name "$EVENT_NAME" --github-output "$GITHUB_OUTPUT"
          echo "publisher=$SEED_POOL_1" >> "$GITHUB_OUTPUT"

  seed:
    needs: decide
    if: needs.decide.outputs.build == 'true'
    # Each pool's seed is seed-derived-data-pool.yml: `seed` builds on the
    # pool with no secret, `save` uploads it to R2 from an ephemeral Linux
    # runner, and `attribute` starts the compile attribution when the build
    # fails. A call per pool, so each pool's save follows its own build, never
    # the slowest pool's.
    #
    # A seed serves only the width it was built at: Swift Build passes the
    # runner's CPU count to swift-driver as -j<n>, so a 12 vCPU seed reran
    # every SwiftDriver task and re-emitted 62 modules on a 6 vCPU admission
    # (run 36043267820). Admission takes the 12 vCPU pool when it is free and
    # the 6 vCPU one otherwise, so both seed, and seed_derived_data.py keys
    # each seed by its width. The first entry is the 12 vCPU pool of the same
    # image and Xcode, which starts in seconds and alone publishes the
    # product; the second is admission's own pool, the same pool again under
    # any other MACOS_RUNNER_PR. The third is the macOS 15 pool, which
    # pr_runner_pool.py overflows pull requests to, on its own Xcode
    # (CMUX_CI_XCODE_APP_MACOS_15): without a seed of its own every admission
    # there compiled cold for 17 to 25 minutes (2026-09-24). The fourth, when
    # CI_SEED_TRUSTED_POOL names one, is a trusted-only owned mini that seeds
    # j14 for the owned std pool on the lane's Xcode, and with
    # CI_SEED_TRUSTED_ROOTS above 1, once more per extra canonical root
    # (matrix.root). nightly.yml writes no cold j14 seed, so the j14 chain
    # only ever builds on its own last seed (or cold when none is near).
    # GitHub names these jobs "seed (<pool>) / seed" and "seed (<pool>) / save",
    # or "seed (<pool>, <root>) / ..."; seed_decide.py and
    # reuse_app_host_products.py match that.
    strategy:
      fail-fast: false
      # The pools decide found without a seed for this push's build inputs
      # (SEED_POOL_1..3, SEED_TRUSTED_POOL and its extra roots there), in
      # that order: {"include": [{"pool": ...}, {"pool": ..., "root": "2"}]}.
      matrix: ${{ fromJSON(needs.decide.outputs.matrix) }}
    # Two lanes per pool, one seed (build and save) at a time in each, and
    # never cancel-in-progress. main takes several merges an hour and a cold
    # seed takes 15-20 minutes on Blacksmith (about an hour on the trusted
    # pool), so cancelling the running seed for each newer push would starve
    # publishing for as long as merges keep arriving. With `false`, the
    # running seed always finishes and publishes, GitHub keeps at most one
    # pending call per group, and a newer push replaces it. Per pool, so the
    # 6 vCPU queue never holds back the 12 vCPU seed. A push far from its
    # pool's covering seed (decide's `far`: more than 5 app Swift files, a
    # package interface change or a hot file, warm_distance.py) goes in the
    # `-far` group, so a newer near push never replaces it and it starts
    # beside a running near seed; a newer far push still does
    # (seed_decide.py). tests/test_seed_derived_data.py pins this.
    concurrency:
      group: seed-derived-data-${{ matrix.pool }}${{ matrix.root && '-root-' || '' }}${{ matrix.root }}${{ contains(fromJSON(needs.decide.outputs.far || '[]'), matrix.root && format('{0}@{1}', matrix.pool, matrix.root) || matrix.pool) && '-far' || '' }}
      cancel-in-progress: false
    permissions:
      contents: read
      # Only the called `attribute` job writes: it dispatches
      # ci-compile-attribution.yml. The build on the pool reads only.
      actions: write
    uses: ./.github/workflows/seed-derived-data-pool.yml
    with:
      pool: ${{ matrix.pool }}
      root: ${{ matrix.root }}
      publisher: ${{ needs.decide.outputs.publisher }}
    # By name, never `inherit`: only the save job's ci-cache-writer environment
    # holds them, and only that job reads them (seed-derived-data-pool.yml).
    secrets:
      CI_CACHE_R2_ACCESS_KEY_ID: ${{ secrets.CI_CACHE_R2_ACCESS_KEY_ID }}
      CI_CACHE_R2_SECRET_ACCESS_KEY: ${{ secrets.CI_CACHE_R2_SECRET_ACCESS_KEY }}
      CI_CACHE_R2_ACCOUNT_ID: ${{ secrets.CI_CACHE_R2_ACCOUNT_ID }}
