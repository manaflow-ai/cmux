name: Seed DerivedData

# Keeps a warm DerivedData for every main commit that changes the app-host
# build, so pull-request compile admission starts from its base commit's build,
# and main's full-suite run (ci-main-full-suite.yml) from its own commit's or
# the newest earlier one, instead of a cold compile (ci-macos.yml "Adopt the
# nightly DerivedData seed").
#
# Each seed builds incrementally from the newest earlier seed, so a merge costs
# the Mac time of its own diff: 30-130 s for one to five app files, measured in
# #13131, against about 950 s cold. nightly.yml `refresh-test-compilation-cache`
# still writes a cold seed every six hours, so a chain of incremental seeds
# never carries stale intermediates for long.
#
# Separate from ci.yml on purpose: nothing waits on it. A pull request whose
# base has no seed yet adopts the newest one, and a miss is today's cold build.
#
# A push to main also publishes the app-host test product this build compiled,
# under the artifact name compile admission publishes it under. A pull request
# whose product inputs equal main's then adopts it in "Reuse exact compatible
# compiled products" instead of compiling (scripts/ci/reuse_app_host_products.py
# trusts only this workflow, on a main push, in this repository).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# r2-cache.sh restores through the public URL and refuses to save without it,
# so without this env every restore missed and every save wrote nothing.
env:
  CI_CACHE_R2_PUBLIC_URL: ${{ vars.CI_CACHE_R2_PUBLIC_URL || 'https://ci-cache.cmux.com' }}

# One seed at a time per runner pool, and never cancel-in-progress. main
# takes several merges an hour and a cold seed takes 15-20 minutes, so
# cancelling the running seed for each newer push would starve publishing for
# as long as merges keep arriving. With `false`, the running seed always
# finishes and publishes, GitHub keeps at most one pending run, and a newer
# push replaces that pending run, so the published seed is never more than
# about one build behind main. tests/test_seed_derived_data.py pins this.
concurrency:
  group: seed-derived-data-${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || vars.MACOS_RUNNER_PR == 'blacksmith-6vcpu-macos-26' && 'blacksmith-12vcpu-macos-26' || vars.MACOS_RUNNER_PR || 'blacksmith-6vcpu-macos-15' }}
  cancel-in-progress: false

jobs:
  decide:
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 10
    outputs:
      build: ${{ steps.inputs.outputs.build }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 2

      # A push that leaves the build fingerprint unchanged (docs, web, another
      # workflow) builds exactly what its parent's seed holds, and pull
      # requests fall back to that seed by prefix. Skip the Mac entirely.
      - name: Compare build inputs with the parent commit
        id: inputs
        env:
          XCODE_APP: ${{ vars.CMUX_CI_XCODE_APP_PR || vars.CMUX_CI_XCODE_APP_MACOS_15 }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = workflow_dispatch ] || ! git rev-parse -q --verify 'HEAD^1' >/dev/null; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          head="$(python3 scripts/ci/build_input_fingerprint.py --revision HEAD --extra "xcode=$XCODE_APP")"
          parent="$(python3 scripts/ci/build_input_fingerprint.py --revision 'HEAD^1' --extra "xcode=$XCODE_APP")"
          if [ "$head" = "$parent" ]; then
            echo "Build inputs unchanged since the parent commit; its seed already covers this one."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  seed:
    needs: decide
    if: needs.decide.outputs.build == 'true'
    # Must match pull-request and main full-suite compile admission: the seed
    # key carries the toolchain and the build paths, so a mismatch is a miss,
    # not a wrong hit. tests/test_seed_derived_data.py evaluates both routes.
    # The 12 vCPU macOS 26 pool runs the same image and Xcode as the 6 vCPU
    # one admission uses, but pull requests do not queue on it: on 2026-09-24
    # seeds waited 19-25 minutes for a 6 vCPU runner while 12 vCPU jobs
    # started in 15 s. Neither key names the runner size.
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || vars.MACOS_RUNNER_PR == 'blacksmith-6vcpu-macos-26' && 'blacksmith-12vcpu-macos-26' || vars.MACOS_RUNNER_PR || 'blacksmith-6vcpu-macos-15' }}
    environment: ${{ github.ref == 'refs/heads/main' && 'ci-cache-writer' || '' }}
    timeout-minutes: 60
    env:
      CMUX_CI_XCODE_APP: ${{ vars.CMUX_CI_XCODE_APP_PR || vars.CMUX_CI_XCODE_APP_MACOS_15 }}
      CMUX_CI_REQUIRED_MACOS_SDK_MAJOR: "26"
      CMUX_SKIP_ZIG_BUILD: "1"
    steps:
      - name: Clear stale git locks (self-hosted reused workspace)
        shell: bash
        run: |
          ws="${GITHUB_WORKSPACE:-$PWD}"
          rm -f "$ws/.git/index.lock" 2>/dev/null || true
          if [ -d "$ws/.git/modules" ]; then
            find "$ws/.git/modules" -type f -name "*.lock" -delete 2>/dev/null || true
          fi

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: recursive

      - name: Prepare admission build paths
        run: |
          set -euo pipefail
          # The same paths as ci-macos.yml compile admission: they are part of
          # the seed key.
          root="${CMUX_CI_CANONICAL_ROOT:-/private/tmp/cmux-ci}"
          rm -rf "$root/derived-data-compile-admission" "$root/compile-admission-cas"
          echo "CMUX_COMPILE_ADMISSION_DERIVED_DATA=$root/derived-data-compile-admission" >> "$GITHUB_ENV"
          echo "CMUX_COMPILE_ADMISSION_CAS=$root/compile-admission-cas" >> "$GITHUB_ENV"

      - name: Select Xcode
        run: ./scripts/select-ci-xcode.sh

      - name: Compute seed key
        id: key
        run: |
          set -euo pipefail
          fingerprint="$(scripts/ci/compile-app-host-test-product.sh canonical-fingerprint "$CMUX_COMPILE_ADMISSION_DERIVED_DATA")"
          echo "prefix=admission-derived-data-v1-${RUNNER_OS}-${RUNNER_ARCH}-${fingerprint}-" >> "$GITHUB_OUTPUT"

      - name: Install compilation dependencies
        run: |
          ./scripts/install-rust-ci.sh
          ./scripts/download-prebuilt-ghosttykit.sh

      # The same contract compile admission computes: product inputs, Xcode,
      # SDK, host major, tool versions and the canonical build location. It
      # reads rustc and cargo, so it follows the install above.
      - name: Identify reusable compiled products
        id: product-key
        run: python3 scripts/ci/reuse_app_host_products.py key "$CMUX_COMPILE_ADMISSION_DERIVED_DATA"

      - name: Cache Swift packages
        uses: ./.github/actions/cache-restore
        with:
          backend: ${{ vars.CI_CACHE_BACKEND || 'r2' }}
          path: .ci-source-packages
          key: spm-${{ hashFiles('cmux.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'scripts/ci/swiftpm-cache-layout') }}
          restore-keys: spm-

      - name: Sanitize Swift package cache
        run: python3 scripts/ci/sanitize-xcode-source-packages-cache.py .ci-source-packages

      # SwiftPM's evaluated-manifest cache, which compile admission and
      # cli-pipe-regressions restore read-only (scripts/ci/swiftpm-manifest-cache.sh).
      # Exact key only: a miss starts empty so the saved cache holds just this
      # revision's manifests, at the two paths readers resolve from.
      - name: Compute SwiftPM manifest cache key
        id: swiftpm-manifest-key
        run: scripts/ci/swiftpm-manifest-cache.sh key >> "$GITHUB_OUTPUT"

      - name: Restore SwiftPM manifest cache
        id: swiftpm-manifest-restore
        continue-on-error: true
        uses: ./.github/actions/cache-restore
        with:
          backend: ${{ vars.CI_CACHE_BACKEND || 'r2' }}
          path: ${{ runner.temp }}/swiftpm-manifests
          key: ${{ steps.swiftpm-manifest-key.outputs.key }}

      - name: Install SwiftPM manifest cache
        run: |
          set -euo pipefail
          if [ "$MANIFEST_CACHE_HIT" = true ]; then
            scripts/ci/swiftpm-manifest-cache.sh install "$RUNNER_TEMP/swiftpm-manifests"
          else
            rm -rf "$HOME/Library/Caches/org.swift.swiftpm/manifests"
          fi
        env:
          MANIFEST_CACHE_HIT: ${{ steps.swiftpm-manifest-restore.outputs.cache-hit }}

      - name: Resolve Swift packages
        run: |
          set -euo pipefail
          scripts/ci/compile-app-host-test-product.sh canonical-resolve \
            "$CMUX_COMPILE_ADMISSION_DERIVED_DATA" "$PWD/.ci-source-packages"

      # cli-pipe-regressions resolves in the runner workspace, not the canonical
      # root, and a manifest's cache entry names its absolute path. Repeat that
      # resolve here, with the same package directory, so its entries exist too.
      # canonical-resolve left the workspace package cache as restored.
      - name: Evaluate manifests at the cli-pipe-regressions path
        id: swiftpm-manifest-workspace
        if: steps.swiftpm-manifest-restore.outputs.cache-hit != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          set -euo pipefail
          rm -rf .spm-cache
          cp -cR .ci-source-packages .spm-cache
          scripts/ci/swiftpm-manifest-cache.sh run \
            xcodebuild -project cmux.xcodeproj -scheme cmux-cli \
            -configuration Debug -derivedDataPath "$RUNNER_TEMP/cmux-cli-resolve" \
            -clonedSourcePackagesDirPath "$PWD/.spm-cache" \
            -packageCachePath "$PWD/.spm-cache/.package-cache" \
            -resolvePackageDependencies
          rm -rf .spm-cache "$RUNNER_TEMP/cmux-cli-resolve"

      - name: Stage SwiftPM manifest cache
        id: swiftpm-manifest-stage
        if: steps.swiftpm-manifest-restore.outputs.cache-hit != 'true' && steps.swiftpm-manifest-workspace.outcome == 'success'
        continue-on-error: true
        run: scripts/ci/swiftpm-manifest-cache.sh stage "$RUNNER_TEMP/swiftpm-manifests"

      - name: Save SwiftPM manifest cache
        if: steps.swiftpm-manifest-stage.outcome == 'success'
        continue-on-error: true
        uses: ./.github/actions/cache-save
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CI_CACHE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CI_CACHE_R2_SECRET_ACCESS_KEY }}
          CI_CACHE_R2_ENDPOINT: ${{ format('https://{0}.r2.cloudflarestorage.com', secrets.CI_CACHE_R2_ACCOUNT_ID) }}
          CI_CACHE_R2_BUCKET: ${{ vars.CI_CACHE_R2_BUCKET }}
        with:
          backend: ${{ vars.CI_CACHE_BACKEND || 'r2' }}
          path: ${{ runner.temp }}/swiftpm-manifests
          key: ${{ steps.swiftpm-manifest-key.outputs.key }}

      # Build on the nearest earlier seed in this commit's history, not the
      # newest pointer: nightly.yml's cold seed of an older main can hold that.
      # A miss is a cold build, which is still a correct seed, just a slower one.
      - name: Adopt the newest seed
        id: adopt
        continue-on-error: true
        timeout-minutes: 8
        env:
          PREFIX: ${{ steps.key.outputs.prefix }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/ci/seed_derived_data.py adopt \
            "$CMUX_CI_CANONICAL_SRC" "$CMUX_COMPILE_ADMISSION_DERIVED_DATA" \
            "$PREFIX" "$GITHUB_SHA"

      - name: Record seed inputs
        id: record
        run: python3 scripts/ci/seed_derived_data.py record "$CMUX_CI_CANONICAL_SRC" "$CMUX_COMPILE_ADMISSION_DERIVED_DATA"

      - name: Build
        id: build
        run: |
          set -euo pipefail
          started="$(python3 -c 'import time; print(time.monotonic())')"
          scripts/ci/compile-app-host-test-product.sh canonical-build \
            "$CMUX_COMPILE_ADMISSION_DERIVED_DATA" \
            "$PWD/.ci-source-packages" \
            "$CMUX_COMPILE_ADMISSION_CAS"
          python3 -c "import time; print(f'seconds={time.monotonic() - $started:.1f}')" >> "$GITHUB_OUTPUT"

      - name: Forget the adopted-build inode override
        if: always() && steps.adopt.outputs.hit == 'true'
        continue-on-error: true
        run: defaults delete com.apple.dt.XCBuild IgnoreFileSystemDeviceInodeChanges || true

      - name: Bound seed size
        id: bound
        run: python3 scripts/ci/seed_derived_data.py prune "$CMUX_COMPILE_ADMISSION_DERIVED_DATA"

      - name: Save seed
        if: steps.bound.outputs.save == 'true'
        uses: ./.github/actions/cache-save
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CI_CACHE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CI_CACHE_R2_SECRET_ACCESS_KEY }}
          CI_CACHE_R2_ENDPOINT: ${{ format('https://{0}.r2.cloudflarestorage.com', secrets.CI_CACHE_R2_ACCOUNT_ID) }}
          CI_CACHE_R2_BUCKET: ${{ vars.CI_CACHE_R2_BUCKET }}
        with:
          backend: r2
          path: ${{ env.CMUX_COMPILE_ADMISSION_DERIVED_DATA }}
          key: ${{ steps.key.outputs.prefix }}${{ github.sha }}

      # Publish the product exactly as ci-macos.yml compile admission does
      # (tests/test_seed_derived_data.py pins the copy). Staging and relocation
      # rewrite Build/Products, so these follow "Save seed". Only a main push
      # is a producer pull requests trust; a dispatch would publish a product
      # nothing adopts. A failure here costs pull requests the adoption, never
      # the seed.
      - name: Stage compiled package frameworks
        id: stage-products
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          set -euo pipefail
          products="$CMUX_COMPILE_ADMISSION_DERIVED_DATA/Build/Products/Debug"
          stable="/private/tmp/cmux-app-host-package-frameworks"
          mkdir -p "$stable"
          framework_source="$(find "$products" -type d -name 'CmuxAgentJournal*_PackageProduct.framework' -print -quit 2>/dev/null || true)"
          test -n "$framework_source"
          framework_root="$(dirname "$framework_source")"
          rsync -aL "$framework_root/" "$stable/"
          if [ -L "$products/PackageFrameworks" ]; then
            rm "$products/PackageFrameworks"
          fi
          mkdir -p "$products/PackageFrameworks"
          rsync -aL "$framework_root/" "$products/PackageFrameworks/"
          test -f "$products/PackageFrameworks/CmuxAgentJournal_27B6EF8727F6C277_PackageProduct.framework/Versions/A/CmuxAgentJournal_27B6EF8727F6C277_PackageProduct"

      - name: Package compiled app-host test product
        id: package-products
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.stage-products.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          # Fresh manifests embed the canonical checkout. Stamp that producer
          # before relocating into this job's workspace, as admission does.
          (cd "${CMUX_CI_CANONICAL_ROOT:-/private/tmp/cmux-ci}/src" && python3 scripts/ci/app_host_test_products.py stamp "$CMUX_COMPILE_ADMISSION_DERIVED_DATA")
          python3 scripts/ci/app_host_test_products.py restore "$CMUX_COMPILE_ADMISSION_DERIVED_DATA"
          python3 scripts/ci/app_host_test_products.py stamp "$CMUX_COMPILE_ADMISSION_DERIVED_DATA"
          python3 scripts/ci/reuse_app_host_products.py seal "$CMUX_COMPILE_ADMISSION_DERIVED_DATA"
          archive="$RUNNER_TEMP/app-host-products.tar.gz"
          COPYFILE_DISABLE=1 tar -chf - -C "$CMUX_COMPILE_ADMISSION_DERIVED_DATA" Build/Products | gzip -1 > "$archive"
          echo "sha256=$(shasum -a 256 "$archive" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      # Three days, as admission keeps its own: a pull request only matches
      # the newest main whose product inputs it shares, so an older product is
      # useful only until main's inputs change again.
      - name: Upload compiled app-host test product
        id: upload-products
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.package-products.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-host-products-v1-${{ steps.product-key.outputs.key }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/app-host-products.tar.gz
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

      - name: Summarize
        if: always()
        env:
          ADOPT_HIT: ${{ steps.adopt.outputs.hit }}
          ADOPT_KEY: ${{ steps.adopt.outputs.key }}
          ADOPT_REASON: ${{ steps.adopt.outputs.reason }}
          CHANGED: ${{ steps.adopt.outputs.changed_inputs }}
          BUILD_SECONDS: ${{ steps.build.outputs.seconds }}
          SAVED: ${{ steps.bound.outputs.save }}
          PRODUCT_KEY: ${{ steps.product-key.outputs.key }}
          PRODUCT_UPLOAD: ${{ steps.upload-products.outcome }}
        run: |
          {
            echo "### DerivedData seed for \`${GITHUB_SHA:0:10}\`"
            if [ "$ADOPT_HIT" = true ]; then
              echo "- built on \`$ADOPT_KEY\`, $CHANGED inputs changed"
            else
              echo "- cold build (\`${ADOPT_REASON:-no seed}\`)"
            fi
            echo "- build: ${BUILD_SECONDS:-?} s"
            echo "- saved: ${SAVED:-false}"
            echo "- app-host product \`${PRODUCT_KEY:-?}\`: ${PRODUCT_UPLOAD:-skipped}"
          } >> "$GITHUB_STEP_SUMMARY"
