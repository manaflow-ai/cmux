name: Cloud VM image promotion

# A devbox source change is incomplete until a new, verified Freestyle image
# is recorded. This workflow deliberately stops at an artifact: a maintainer
# reviews the manifest diff and commits it to the source PR. It never pushes a
# manifest or moves a shared provider slug from Actions.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type PROMOTE to run the checked-in devbox bake and verification"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cloud-vm-image-promote-${{ github.ref }}
  cancel-in-progress: false

jobs:
  promote:
    if: github.repository == 'manaflow-ai/cmux' && github.ref_type == 'branch'
    runs-on: ${{ vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 180
    environment: cloud-vm-image-checks
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout the requested source ref
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Confirm deliberate promotion
        env:
          CONFIRM: ${{ inputs.confirm }}
          HAS_KEY: ${{ secrets.FREESTYLE_API_KEY != '' }}
        run: |
          set -euo pipefail
          if [ "$CONFIRM" != "PROMOTE" ]; then
            echo "::error::type PROMOTE in the confirm input to run an image promotion"
            exit 1
          fi
          if [ "$HAS_KEY" != "true" ]; then
            echo "::error::cloud-vm-image-checks has no FREESTYLE_API_KEY"
            exit 1
          fi
          printf 'source ref: %s\nsource sha: %s\n' "$GITHUB_REF" "$(git rev-parse HEAD)"

      - name: Bake, verify, derive, and stage the manifest
        env:
          CMUX_BAKE_ALLOW_BRANCH: "1"
          FREESTYLE_API_KEY: ${{ secrets.FREESTYLE_API_KEY }}
          PROMOTION_OUT: ${{ runner.temp }}/devbox-promotion.json
          SLUG: cmux-devbox-${{ github.run_id }}
        run: |
          set -euo pipefail
          bun run devbox:promote -- freestyle \
            --slug "$SLUG" \
            --pointer-slug none \
            --out "$PROMOTION_OUT"
          bun run devbox:manifest:check
          cp services/vms/images/manifest.json "$RUNNER_TEMP/devbox-manifest.json"

      - name: Summarize the staged promotion
        if: success()
        env:
          PROMOTION_OUT: ${{ runner.temp }}/devbox-promotion.json
        run: |
          set -euo pipefail
          {
            echo "### Verified devbox promotion"
            echo
            echo "Source: \\`$(git rev-parse HEAD)\\`"
            echo
            jq -r '.entries[] | "- \(.version): \(.imageId)"' "$PROMOTION_OUT"
            echo
            echo "The manifest and promotion receipt are attached as an artifact for review."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload manifest and promotion receipt
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: devbox-promotion-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ runner.temp }}/devbox-manifest.json
            ${{ runner.temp }}/devbox-promotion.json
