name: Cloud VM image promote

# The implementation lives on feat-cmux-next (plans/cmux-next/release-rails.md
# "Promote from CI"). GitHub dispatches only a workflow the default branch
# registers, so this inert copy lets a lane promote a smoked VM image snapshot
# to the dev channel on the cmux-next dev Freestyle account (environment
# cmux-next-vm-image-dev, which allows only feat-cmux-next):
#
#   gh workflow run cloud-vm-image-promote.yml -R manaflow-ai/cmux \
#     --ref feat-cmux-next -f channel=dev -f snapshot=<sh-id> -f bake_run=<run id>
#
# A dispatch runs the file at --ref, so feat-cmux-next's inputs and jobs win;
# these inputs only mirror them for the Actions form.
on:
  workflow_dispatch:
    inputs:
      channel:
        description: Channel to promote to (dev only for now)
        required: true
        default: dev
        type: choice
        options:
          - dev
      snapshot:
        description: Snapshot id to promote (sh-...); empty to only delete
        required: false
        default: ""
        type: string
      bake_run:
        description: The cloud-vm-image-bake.yml run (keep_snapshot) whose channel-dev.json records the snapshot
        required: false
        default: ""
        type: string
      delete_snapshot:
        description: Optional spare snapshot id (sh-...) to delete; refused when a channel file or wrangler.jsonc references it
        required: false
        default: ""
        type: string

permissions: {}

env:
  # Temporary REST budget attribution: one gh-call line per GitHub API call (scripts/ci/api_call_log/env.sh, fetched at a fixed commit when the checkout has no copy).
  BASH_ENV: '$({ w="${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh"; t="${RUNNER_TEMP:-/nonexistent}/api-call-log-src"; if [ -f "$w" ]; then echo "$w"; elif [ -n "${RUNNER_TEMP:-}" ]; then if [ ! -f "$t/env.sh" ] && [ ! -e "$t.tried" ] && { [ "${RUNNER_OS:-}" = Linux ] || [ "${RUNNER_OS:-}" = macOS ]; } && [ "$(date -u +%Y%m%d%H)" -lt 2026112300 ]; then : > "$t.tried"; mkdir -p "$t.part" && for x in env.sh gh sitecustomize.py isolated.py; do curl -fsSL --max-time 5 -o "$t.part/$x" "https://raw.githubusercontent.com/manaflow-ai/cmux/27647ffd3ae838c63be28ca3e5883dcd68c34518/scripts/ci/api_call_log/$x" || break; done; [ -s "$t.part/isolated.py" ] && mv "$t.part" "$t"; fi; if [ -f "$t/env.sh" ]; then echo "$t/env.sh"; else echo unset BASH_ENV > "$t.off.sh" && echo "$t.off.sh"; fi; fi; } 2>/dev/null)'

jobs:
  registration:
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || 'cmux-linux' }}
    timeout-minutes: 5
    steps:
      - run: echo "Cloud VM image promote is implemented on feat-cmux-next; dispatch it with --ref feat-cmux-next"
