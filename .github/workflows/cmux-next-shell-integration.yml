name: cmux-next shell integration

# cmux NEXT bundles Resources/shell-integration (scripts/cmux-next/bundle-ghostty-resources.sh),
# and feat-cmux-next pull requests edit it, but its tests ran only on the classic app's lanes for
# pull requests into main, or nowhere: these two had no registry entry
# (tests/test_pr_lane_coverage.py). This runs them for every feat-cmux-next pull request and push
# that touches the integration scripts: the prompt test on Linux with zsh, bash and fish, the zsh
# HEAD watcher test on a Mac.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [feat-cmux-next]
    paths:
      - "Resources/shell-integration/**"
      - "tests/test_shell_claude_rereports_pwd.py"
      - "tests/test_zsh_git_head_watch_no_fork.py"
      - ".github/workflows/cmux-next-shell-integration.yml"
  push:
    branches: [feat-cmux-next]
    paths:
      - "Resources/shell-integration/**"
      - "tests/test_shell_claude_rereports_pwd.py"
      - "tests/test_zsh_git_head_watch_no_fork.py"
      - ".github/workflows/cmux-next-shell-integration.yml"
  workflow_dispatch:

concurrency:
  group: cmux-next-shell-integration-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Temporary REST budget attribution: one gh-call line per GitHub API call (scripts/ci/api_call_log/env.sh, fetched at a fixed commit when the checkout has no copy).
  BASH_ENV: '$({ w="${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh"; t="${RUNNER_TEMP:-/nonexistent}/api-call-log-src"; if [ -f "$w" ]; then echo "$w"; elif [ -n "${RUNNER_TEMP:-}" ]; then if [ ! -f "$t/env.sh" ] && [ ! -e "$t.tried" ] && { [ "${RUNNER_OS:-}" = Linux ] || [ "${RUNNER_OS:-}" = macOS ]; } && [ "$(date -u +%Y%m%d%H)" -lt 2026112300 ]; then : > "$t.tried"; mkdir -p "$t.part" && for x in env.sh gh sitecustomize.py isolated.py; do curl -fsSL --max-time 5 -o "$t.part/$x" "https://raw.githubusercontent.com/manaflow-ai/cmux/27647ffd3ae838c63be28ca3e5883dcd68c34518/scripts/ci/api_call_log/$x" || break; done; [ -s "$t.part/isolated.py" ] && mv "$t.part" "$t"; fi; if [ -f "$t/env.sh" ]; then echo "$t/env.sh"; else echo unset BASH_ENV > "$t.off.sh" && echo "$t.off.sh"; fi; fi; } 2>/dev/null)'

jobs:
  shell-integration:
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft != true || contains(github.event.pull_request.labels.*.name, 'full-ci') || (vars.CI_DRAFT_CHEAP_TIER || '1') == '0') }}
    name: cmux-next shell integration
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && (vars.CI_FORK_LINUX_RUNNER || 'ubuntu-24.04') || 'cmux-linux' }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # The test fails on CI without zsh and fish rather than skip.
      - name: Install zsh and fish
        run: |
          set -euo pipefail
          if ! command -v zsh >/dev/null 2>&1 || ! command -v fish >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y zsh fish
          fi
          zsh --version
          fish --version

      - name: The first prompt after claude re-reports the shell's directory (zsh, bash, fish)
        if: ${{ !cancelled() }}
        run: python3 tests/test_shell_claude_rereports_pwd.py

  # The zsh git HEAD watcher starts only where it can read the shell's start time, which it does
  # with Darwin's kern.proc sysctl or BSD date(1) (_cmux_watcher_parent_start_time); on Linux it
  # never starts, so this test runs on a Mac, alone, as main's macos-cli-no-socket lane runs it.
  zsh-head-watch:
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft != true || contains(github.event.pull_request.labels.*.name, 'full-ci') || (vars.CI_DRAFT_CHEAP_TIER || '1') == '0') }}
    name: cmux-next zsh git HEAD watcher (macOS)
    # A same-repository run takes cmux-mac, the one own-branch Mac label (vars.CI_OVERFLOW_MAC
    # switches it during an outage); a fork pull request takes Blacksmith macOS.
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-6vcpu-macos-26' || vars.CI_OVERFLOW_MAC || 'cmux-mac' }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # The test needs only the system zsh; pin the Xcode like every other macOS job anyway.
      - name: Select Xcode
        run: ./scripts/select-ci-xcode.sh

      - name: The zsh git HEAD watcher polls without forking
        run: python3 tests/test_zsh_git_head_watch_no_fork.py
