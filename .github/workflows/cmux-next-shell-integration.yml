name: cmux-next shell integration

# cmux NEXT bundles Resources/shell-integration (scripts/cmux-next/bundle-ghostty-resources.sh),
# and feat-cmux-next pull requests edit it, but its tests ran only on the classic app's lanes for
# pull requests into main, or nowhere: these two had no registry entry
# (tests/test_pr_lane_coverage.py). This runs them for every feat-cmux-next pull request and push
# that touches the integration scripts: the prompt test on Linux with zsh, bash and fish, the zsh
# HEAD watcher test on a Mac.
on:
  pull_request:
    branches: [feat-cmux-next]
    paths:
      - "Resources/shell-integration/**"
      - "tests/test_shell_claude_rereports_pwd.py"
      - "tests/test_zsh_git_head_watch_no_fork.py"
      - ".github/workflows/cmux-next-shell-integration.yml"
  push:
    branches: [feat-cmux-next]
    paths:
      - "Resources/shell-integration/**"
      - "tests/test_shell_claude_rereports_pwd.py"
      - "tests/test_zsh_git_head_watch_no_fork.py"
      - ".github/workflows/cmux-next-shell-integration.yml"
  workflow_dispatch:

concurrency:
  group: cmux-next-shell-integration-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  shell-integration:
    name: cmux-next shell integration
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-2vcpu-ubuntu-2404' || fromJSON(vars.RUNNER_POOLS).linux }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # The test fails on CI without zsh and fish rather than skip.
      - name: Install zsh and fish
        run: |
          set -euo pipefail
          if ! command -v zsh >/dev/null 2>&1 || ! command -v fish >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y zsh fish
          fi
          zsh --version
          fish --version

      - name: The first prompt after claude re-reports the shell's directory (zsh, bash, fish)
        if: ${{ !cancelled() }}
        run: python3 tests/test_shell_claude_rereports_pwd.py

  # The zsh git HEAD watcher starts only where it can read the shell's start time, which it does
  # with Darwin's kern.proc sysctl or BSD date(1) (_cmux_watcher_parent_start_time); on Linux it
  # never starts, so this test runs on a Mac, alone, as main's macos-cli-no-socket lane runs it.
  zsh-head-watch:
    name: cmux-next zsh git HEAD watcher (macOS)
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || 'blacksmith-6vcpu-macos-26' }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # The test needs only the system zsh; pin the Xcode like every other macOS job anyway.
      - name: Select Xcode
        run: ./scripts/select-ci-xcode.sh

      - name: The zsh git HEAD watcher polls without forking
        run: python3 tests/test_zsh_git_head_watch_no_fork.py
