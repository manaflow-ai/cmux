name: optchat-chief
run-name: optchat-chief ${{ inputs.request_id }} @ ${{ inputs.commit }}

# The Chief's own crate (Native/OptChat/optchat-chief): its full test suite, then
# the behavior tests that need a real headless cmux-tui daemon (`#[ignore]`d in a
# plain `cargo test`, run here with CMUX_TUI_BIN): home_view_daemon (the Chief's
# live Home workspace block, cx-ebm.59.2). Dispatch on an exact
# pushed SHA, like the other cmux-next check workflows:
#   gh workflow run optchat-chief.yml --repo manaflow-ai/cmux --ref feat-cmux-next \
#     -f commit=<sha> -f request_id=<token>

on:
  workflow_dispatch:
    inputs:
      commit:
        description: "Exact pushed 40-character commit SHA to verify"
        required: true
        type: string
      request_id:
        description: "Unique caller token used to find this run"
        required: true
        type: string

concurrency:
  group: optchat-chief-${{ inputs.request_id }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CMUX_GHOSTTY_SRC: ""
  GHOSTTY_ZIG_SOURCE: ghostty-next

jobs:
  test:
    name: optchat-chief tests (with a real daemon)
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 60
    steps:
      - name: Validate dispatch inputs
        env:
          EXACT_COMMIT: ${{ inputs.commit }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          [[ "$EXACT_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::commit must be a lowercase 40-character SHA"; exit 1; }
          [[ "$REQUEST_ID" =~ ^[A-Za-z0-9._-]{1,100}$ ]] || { echo "::error::request_id contains unsupported characters"; exit 1; }

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ inputs.commit }}

      - name: Require exact checkout
        env:
          EXACT_COMMIT: ${{ inputs.commit }}
        run: test "$(git rev-parse HEAD)" = "$EXACT_COMMIT"

      - name: Init ghostty submodule
        run: git submodule update --init --depth 1 ghostty-next

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev pkg-config

      - name: Install zig
        run: ./scripts/install-zig-ci.sh

      - name: Build the cmux-tui daemon and CLI
        working-directory: cmux-tui
        run: cargo build --locked -p cmux-tui --bin cmux-tui

      - name: optchat-chief test suite
        working-directory: Native/OptChat/optchat-chief
        run: cargo test --locked

      - name: Behavior tests against a real daemon
        working-directory: Native/OptChat/optchat-chief
        run: |
          export CMUX_TUI_BIN="$GITHUB_WORKSPACE/cmux-tui/target/debug/cmux-tui"
          cargo test --locked --test home_view_daemon -- --ignored
