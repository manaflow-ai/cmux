name: IROH v2 deployment target diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  target:
    runs-on: ${{ vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 2
    steps:
      - name: Check account and required secret names without changing the Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 - <<'PY_CHECK'
          import json, os, urllib.request, urllib.error
          expected = "0c1675e0def6de1ab3a50a4e17dc5656"
          configured = os.environ.get("CLOUDFLARE_ACCOUNT_ID", "")
          token = os.environ.get("CLOUDFLARE_API_TOKEN", "")
          print("iroh_account_match=" + str(configured == expected).lower())
          if not configured or not token:
              raise SystemExit("Missing deployment authentication")
          required = {"API_TICKET_CURRENT_KEY_ID", "API_TICKET_KEYS", "AXIOM_TOKEN", "DATABASE_URL", "RELAY_KEY_ID", "RELAY_SIGNING_KEY", "RELAY_URLS", "SENTRY_DSN", "STACK_PROJECT_ID", "STACK_PUBLISHABLE_KEY", "STACK_SERVER_KEY"}
          targets = [("configured", configured)]
          if configured != expected:
              targets.append(("expected_iroh_account", expected))
          for label, account in targets:
              url = "https://api.cloudflare.com/client/v4/accounts/" + account + "/workers/scripts/cmux-iroh-v2-development/secrets"
              request = urllib.request.Request(url, headers={"Authorization": "Bearer " + token})
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      payload = json.load(response)
              except urllib.error.HTTPError as error:
                  print(json.dumps({"target": label, "http": error.code}))
                  continue
              if not payload.get("success"):
                  print(json.dumps({"target": label, "success": False, "errorCodes": [item.get("code") for item in payload.get("errors", [])]}))
                  continue
              names = sorted(item["name"] for item in payload.get("result", []) if isinstance(item, dict) and isinstance(item.get("name"), str))
              print(json.dumps({"target": label, "success": True, "secretNames": names, "missingRequiredNames": sorted(required - set(names))}))
              settings_url = "https://api.cloudflare.com/client/v4/accounts/" + account + "/workers/scripts/cmux-iroh-v2-development/settings"
              request = urllib.request.Request(settings_url, headers={"Authorization": "Bearer " + token})
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      settings = json.load(response)
              except urllib.error.HTTPError as error:
                  print(json.dumps({"target": label, "settingsHttp": error.code}))
                  continue
              result = settings.get("result") or {}
              bindings = [{"name": item.get("name"), "type": item.get("type")} for item in result.get("bindings", [])]
              print(json.dumps({"target": label, "settingsSuccess": settings.get("success"), "bindingNamesAndTypes": bindings}))
          PY_CHECK
