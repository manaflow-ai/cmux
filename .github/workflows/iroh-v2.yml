name: IROH v2

on:
  pull_request:
    paths:
      - workers/iroh-v2/**
      - Packages/Shared/CmuxIrxTransport/**
      - .github/workflows/iroh-v2.yml
  push:
    branches: [main]
    paths:
      - workers/iroh-v2/**
      - Packages/Shared/CmuxIrxTransport/**
      - .github/workflows/iroh-v2.yml
  workflow_dispatch:
    inputs:
      deploy_development:
        description: Deploy the tested revision to the development worker
        type: boolean
        default: false

# A new push cancels the previous run for the same pull request. Other events
# key on the run id, so they never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  client:
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || vars.MACOS_RUNNER_TESTS || vars.MACOS_RUNNER_IOS || 'blacksmith-6vcpu-macos-26' }}
    timeout-minutes: 15
    steps:
      - name: Verify GitHub-hosted route
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          REQUESTED_RUNNER: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || vars.MACOS_RUNNER_TESTS || vars.MACOS_RUNNER_IOS || 'blacksmith-6vcpu-macos-26' }}
          RUNNER_CONTEXT_NAME: ${{ runner.name }}
        run: |
          # The self-hosted fleet also carries a macos-26 label, so a macos-*
          # request must prove it landed on GitHub-hosted capacity before any
          # checkout.
          case "$REQUESTED_RUNNER" in
            macos-*)
              if [ "$RUNNER_ENVIRONMENT" != "github-hosted" ]; then
                echo "::error::$REQUESTED_RUNNER resolved outside GitHub-hosted capacity: $RUNNER_CONTEXT_NAME"
                exit 1
              fi
              ;;
          esac
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Run WebSocket ping regression tests
        run: swift test --package-path Packages/Shared/CmuxIrxTransport --filter V2URLSessionSocketTests

  backend:
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: workers/iroh-v2
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          # Miniflare 5 needs the ws upgrade events implemented in Bun 1.4.
          bun-version: "1.4.2"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
      - run: bun install --frozen-lockfile
      - name: Contracts, architecture, generated bindings and unit tests
        run: bun run check
      - name: Real Cloudflare runtime and SQLite tests
        run: bun run test:runtime
      - name: Validate staging and production bundles
        run: |
          bunx wrangler deploy --env staging --dry-run --outdir dist/staging
          bunx wrangler deploy --env production --dry-run --outdir dist/production

  deploy-development:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_development
    needs: backend
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 10
    concurrency:
      group: iroh-v2-deploy-development
      cancel-in-progress: false
    defaults:
      run:
        working-directory: workers/iroh-v2
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
      - run: bun install --frozen-lockfile
      - name: Deploy development worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          bunx wrangler deploy --env development
