name: IROH v2 deployment target diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  target:
    runs-on: ${{ vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 2
    steps:
      - name: Check account and required secret names without changing the Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 - <<'PY_CHECK'
          import hashlib, json, os, urllib.request, urllib.error
          expected = "0c1675e0def6de1ab3a50a4e17dc5656"
          configured = os.environ.get("CLOUDFLARE_ACCOUNT_ID", "")
          token = os.environ.get("CLOUDFLARE_API_TOKEN", "")
          print("iroh_account_match=" + str(configured == expected).lower())
          if not configured or not token:
              raise SystemExit("Missing deployment authentication")
          required = {"API_TICKET_CURRENT_KEY_ID", "API_TICKET_KEYS", "AXIOM_TOKEN", "DATABASE_URL", "RELAY_KEY_ID", "RELAY_SIGNING_KEY", "RELAY_URLS", "SENTRY_DSN", "STACK_PROJECT_ID", "STACK_PUBLISHABLE_KEY", "STACK_SERVER_KEY"}
          catalog_request = urllib.request.Request("https://api.cloudflare.com/client/v4/accounts/" + expected + "/workers/scripts", headers={"Authorization": "Bearer " + token})
          try:
              with urllib.request.urlopen(catalog_request, timeout=20) as response:
                  catalog = json.load(response)
              task_workers = [item.get("id") for item in catalog.get("result", []) if isinstance(item.get("id"), str) and any(marker in item["id"] for marker in ["13458", "13472"])]
              print(json.dumps({"taskWorkerNames": task_workers}))
          except urllib.error.HTTPError as error:
              print(json.dumps({"catalogHttp": error.code}))
          targets = [("configured", configured)]
          if configured != expected:
              targets.append(("expected_iroh_account", expected))
          for label, account in targets:
              url = "https://api.cloudflare.com/client/v4/accounts/" + account + "/workers/scripts/cmux-iroh-v2-development/secrets"
              request = urllib.request.Request(url, headers={"Authorization": "Bearer " + token})
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      payload = json.load(response)
              except urllib.error.HTTPError as error:
                  print(json.dumps({"target": label, "http": error.code}))
                  continue
              if not payload.get("success"):
                  print(json.dumps({"target": label, "success": False, "errorCodes": [item.get("code") for item in payload.get("errors", [])]}))
                  continue
              names = sorted(item["name"] for item in payload.get("result", []) if isinstance(item, dict) and isinstance(item.get("name"), str))
              print(json.dumps({"target": label, "success": True, "secretNames": names, "missingRequiredNames": sorted(required - set(names))}))
              settings_url = "https://api.cloudflare.com/client/v4/accounts/" + account + "/workers/scripts/cmux-iroh-v2-development/settings"
              request = urllib.request.Request(settings_url, headers={"Authorization": "Bearer " + token})
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      settings = json.load(response)
              except urllib.error.HTTPError as error:
                  print(json.dumps({"target": label, "settingsHttp": error.code}))
                  continue
              result = settings.get("result") or {}
              bindings = [{"name": item.get("name"), "type": item.get("type"), **({"service": item.get("service"), "environment": item.get("environment")} if item.get("type") == "service" else {})} for item in result.get("bindings", [])]
              print(json.dumps({"target": label, "settingsSuccess": settings.get("success"), "bindingNamesAndTypes": bindings}))
              canonical = next((item.get("service") for item in result.get("bindings", []) if item.get("name") == "CANONICAL" and item.get("type") == "service"), None)
              if isinstance(canonical, str) and canonical in {"cmux-v2-development"} and all(c.isalnum() or c in "-_" for c in canonical):
                  content_request = urllib.request.Request("https://api.cloudflare.com/client/v4/accounts/" + account + "/workers/scripts/" + canonical, headers={"Authorization": "Bearer " + token})
                  try:
                      with urllib.request.urlopen(content_request, timeout=20) as response:
                          content = response.read(8 * 1024 * 1024)
                      print(json.dumps({"canonical": canonical, "sourceSHA256": hashlib.sha256(content).hexdigest(), "sourceBytes": len(content), "usesConnectedWorkspaceBinding": b"HYPERDRIVE_CONNECTED_WORKSPACES" in content, "usesWorkspacePublisherSecret": b"WORKSPACE_PUBLISHER_SECRET" in content, "advertisesMacPeerRule": b"cmux.mac-peer-inbound.v1" in content, "implementsMacHostCapability": b"cmux.mac-host.v1" in content}))
                  except urllib.error.HTTPError as error:
                      print(json.dumps({"canonical": canonical, "sourceHttp": error.code}))
                  for suffix in ["settings", "secrets"]:
                      request = urllib.request.Request("https://api.cloudflare.com/client/v4/accounts/" + account + "/workers/scripts/" + canonical + "/" + suffix, headers={"Authorization": "Bearer " + token})
                      try:
                          with urllib.request.urlopen(request, timeout=20) as response:
                              value = json.load(response)
                      except urllib.error.HTTPError as error:
                          print(json.dumps({"canonical": canonical, "endpoint": suffix, "http": error.code}))
                          continue
                      if suffix == "secrets":
                          print(json.dumps({"canonical": canonical, "secretNames": sorted(item.get("name", "") for item in value.get("result", []))}))
                      else:
                          values = (value.get("result") or {}).get("bindings", [])
                          app_environment = next((item.get("text") for item in values if item.get("name") == "ENVIRONMENT" and item.get("type") == "plain_text"), None)
                          print(json.dumps({"canonical": canonical, "appEnvironment": app_environment, "bindingNamesAndTypes": [{"name": item.get("name"), "type": item.get("type")} for item in values]}))
          PY_CHECK
