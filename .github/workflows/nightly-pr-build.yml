# The NIGHTLY's own app compile and Rust helper builds, on the feat-cmux-next tip (and on a pull request when asked).
#
# A normal Debug or Release PR compile can miss failures specific to the Nightly configuration.
# This checks the Nightly settings when a landing PR changes their inputs:
#   - swift:   scripts/cmux-next/check-release-compile.sh --archs ARCH --nightly, as a fleet job, for
#              arm64 and x86_64: Release with -DCMUX_BLOCKING_CHECKS and -Osize, as app-build-release.sh.
#   - helpers: cargo check --release of each Rust helper the Nightly bundles, with its features and profile.
# Advisory: every job name says so, no rule requires it, and a fleet that does not answer is a warning.
# The swift job submits its fleet step and ends; the controller posts the verdict as its own check run
# (DETACH below), so no runner waits on the fleet queue.
# Each job keys its inputs (scripts/ci/job_input_fingerprint.py) and saves the key on a pass, so a push
# that changes nothing it builds from skips the build. Off switch: repository variable CI_NIGHTLY_PR_BUILD=0.
#
# Trunk cadence (2026-11-28). Leo: "de facto, im asking for 99% fewer minutes of ci time, period." The per-PR runs were
# ~28k runner-min/day on 11-27, and ~16.5k/day at 00Z 11-28 after the land-ask cut (#63376): ~28 PR heads an hour
# still asked. The Nightly itself compiles this configuration on the tip every 15 minutes, and no rule requires this
# check, so its only per-PR value was naming the PR that broke it. Now it runs once per 30-minute window on the
# feat-cmux-next tip (base-coalesce.yml), covering every commit since the last tip it ran on, and base-red-watch
# (cmuxterm-hq fleet-reconcilers, commit_bisect) bisects a red over that range to name the PR. pr-router.yml no
# longer starts it on a pull request (pr_router.json trunk_only); repository variable CI_NIGHTLY_PR_BUILD_PER_PR=1
# starts it there again, as before (land's ask and the merge train's tip). CI_NIGHTLY_PR_BUILD_COALESCE=0 runs
# every tip push.
name: nightly pr build

# Triggers: a push to feat-cmux-next (coalesced per 30-minute window), and a pull request into feat-cmux-next whose
# paths are scripts/ci/pr_router.json's when CI_NIGHTLY_PR_BUILD_PER_PR=1 (pr-router.yml calls it).
on:
  push:
    branches: [feat-cmux-next]
  workflow_call:

permissions: {}

jobs:
  # One run per 30-minute window on the tip: the first push of each window runs the jobs below over every commit
  # since the last tip this ran on (needs.coalesce.outputs.base); the window's other pushes skip them, no runner
  # taken. Skipped on a pull request (pr-router.yml's call).
  coalesce:
    if: ${{ github.repository_owner == 'manaflow-ai' && (vars.CI_NIGHTLY_PR_BUILD || '1') != '0' && github.event_name == 'push' }}
    # actions: read: base-coalesce lists this workflow's runs to re-run a window whose run failed.
    permissions:
      actions: read
    uses: ./.github/workflows/base-coalesce.yml
    with:
      key: nightly-pr-build
      hold_minutes: 30
      no_coalesce: ${{ format('{0}', vars.CI_NIGHTLY_PR_BUILD_COALESCE) == '0' }}

  route:
    name: nightly pr build route (advisory)
    needs: [coalesce]
    if: ${{ !cancelled() && github.repository_owner == 'manaflow-ai' && (vars.CI_NIGHTLY_PR_BUILD || '1') != '0' && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'push' && needs.coalesce.result == 'success' && needs.coalesce.outputs.run != 'false')) }}
    runs-on: cmux-linux
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      swift: ${{ steps.route.outputs.swift }}
      helpers: ${{ steps.route.outputs.helpers }}
      keys: ${{ steps.keys.outputs.keys }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 2
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/
          submodules: false
      # A pull request diffs its merge commit against the base; a tip push diffs every commit since the last tip this
      # ran on (the coalesce base; the push's own range when none is recorded).
      - name: Route the change
        id: route
        env:
          BASE: ${{ github.event_name == 'push' && (needs.coalesce.outputs.base != 'unknown' && needs.coalesce.outputs.base || github.event.before) || '' }}
        run: |
          base='HEAD^1'
          if [[ "$BASE" =~ ^[0-9a-f]{40}$ && "$BASE" != 0000000000000000000000000000000000000000 ]] &&
            git -c protocol.version=2 fetch --no-tags --depth=1 --filter=blob:none origin "$BASE"; then
            base="$BASE"
          fi
          python3 scripts/ci/nightly_pr_build.py route --base "$base" --rev HEAD | tee -a "$GITHUB_OUTPUT"
      # The fleet job builds the PR head, while this reusable workflow and its driver come from the
      # merge ref. Keeping the recipe revision separate lets an already-open PR predate this workflow.
      - name: Key the inputs at the head
        id: keys
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RECIPE_SHA: ${{ github.sha }}
        run: |
          git -c protocol.version=2 fetch --no-tags --depth=1 --filter=blob:none origin "$HEAD_SHA"
          python3 scripts/ci/nightly_pr_build.py keys --rev "$HEAD_SHA" --recipe-rev "$RECIPE_SHA" | tee -a "$GITHUB_OUTPUT"

  # The gateway runner's hook takes only job ids ending in -fleet; `swift` was refused (run 45799805163).
  swift-fleet:
    name: nightly app compile ${{ matrix.arch }} fleet job (advisory)
    needs: [route]
    if: ${{ needs.route.outputs.swift == 'true' }}
    # Use the gateway when configured, then the overflow pool, then the owned
    # Linux pool. The job remains a thin cmux-ci client on every route.
    runs-on: ${{ vars.CI_EVAL_STEP_GATEWAY || vars.CI_OVERFLOW_LINUX || 'cmux-linux' }}
    # The client waits up to QUEUE_WAIT_S (20 min) queued plus 3600 s running, with slack.
    timeout-minutes: 90
    # checks: read lets the job see the fleet verdict already posted on its head (the step below).
    permissions:
      checks: read
    strategy:
      # One arch's red cancels the other's wait. The reds seen are arch-independent: a Swift error in the
      # head or base, or the fleet refusing the step (source depot full), so the second arch only repeats it
      # while holding its runner up to an hour. 2026-11-27 07-13Z: in 89 runs that ran both arches, the other
      # arch outlived the first red by 1,035 job-min (~4.1k GitHub min/day). The next push runs both again.
      fail-fast: true
      matrix:
        arch: [arm64, x86_64]
    env:
      KEY: ${{ fromJSON(needs.route.outputs.keys)[matrix.arch] }}
      # The longest this job holds its gateway runner while the step waits in the fleet queue. Before
      # 2026-11-27 it was 3600 s: in 05:30-11:36Z that day 36 of the 102 jobs held a Mac mini gateway token
      # for about 60 min each, waiting out the queue (class light, p90 41-55 min), and then gave "no verdict".
      # That was about 2.2k of the job's 4.4k runner-min. Past this wait the job cancels the queued step (a
      # step left queued keeps its place and builds for no reader), and the check reads "not judged" as before.
      QUEUE_WAIT_S: "1200"
      # Detached (the default): the job submits the step, hands its verdict to the controller as the check run
      # REPORT_CHECK on the PR head (cmux-ci run --report-check --detach, report_check.go) and ends in about a
      # minute, so no runner waits on the fleet queue. Run 46030977376 job 140614747339 (11-27): the job held
      # runner cmux13s-mac-mini-glaeda-18 for 20.8 min while step a15a82e4b0c1617329eb48ec sat queued, then
      # "no verdict"; the two arches billed ~20k runner-min/day that way. CI_NIGHTLY_PR_BUILD_DETACH=0 waits
      # here as before (and records the input-key pass); a client or controller without --detach waits too.
      DETACH: ${{ vars.CI_NIGHTLY_PR_BUILD_DETACH || '1' }}
      REPORT_CHECK: nightly app compile ${{ matrix.arch }} fleet verdict (advisory)
      # A gateway Mac's own ~/.local/bin/cmux-ci can predate --detach; then the step below waited the whole
      # compile (2026-11-27 20:49Z job 140732035533 on cmux13s-mac-mini-glaeda-15: 20.1 min, while jobs on
      # current clients ended in 0.2-0.8 min). So when the local client lacks --detach, the step fetches the
      # controller's client (sha256-checked against its manifest, as .github/actions/fleet-client does) and
      # uses it. CI_NIGHTLY_PR_BUILD_LOCAL_CLIENT=1 keeps the runner's own client.
      CONTROLLER: ${{ vars.CMUX_FLEET_CONTROLLER }}
      LOCAL_CLIENT_ONLY: ${{ vars.CI_NIGHTLY_PR_BUILD_LOCAL_CLIENT || '0' }}
    steps:
      - name: Look up a pass with the same inputs
        id: cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/nightly-pr-build-pass
          key: ${{ env.KEY }}
          lookup-only: true
      - name: Skip a head the fleet already passed
        # A detached run (the default) never records the input-key pass above: its verdict lands later as the
        # check run REPORT_CHECK. So a re-run on the same head (a ready-to-land or full-ci label maps to
        # ready_for_review) compiled it again, cold. 2026-11-27 20:05-21:34Z: 17 of 74 head-arch pairs ran
        # more than once, 392 of 1,468 job-min. A success verdict for this arch on this head is the pass.
        if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        id: verdict
        env:
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          name="$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1]))' "$REPORT_CHECK")"
          body="$(curl -fsS --max-time 20 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "${GITHUB_API_URL:-https://api.github.com}/repos/$GITHUB_REPOSITORY/commits/$SHA/check-runs?check_name=$name&filter=all" || true)"
          passed="$(printf '%s' "$body" | python3 -c '
          import json, sys
          try:
              runs = json.load(sys.stdin).get("check_runs", [])
          except ValueError:
              runs = []
          print("true" if any(r.get("conclusion") == "success" for r in runs) else "false")
          ')"
          if [[ "$passed" == true ]]; then
            echo "::notice title=nightly app compile::$REPORT_CHECK already passed on ${SHA:0:12}; not compiling it again"
            echo "passed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Compile the app the Nightly's way (fleet job)
        if: ${{ steps.cache.outputs.cache-hit != 'true' && steps.verdict.outputs.passed != 'true' }}
        id: compile
        env:
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          ARCH: ${{ matrix.arch }}
          PR: ${{ github.event.pull_request.number && format('#{0}', github.event.pull_request.number) || format('{0} tip', github.ref_name) }}
        run: |
          set -uo pipefail
          client="${CMUX_CI_CLIENT:-$HOME/.local/bin/cmux-ci}"
          if ! [[ -x "$client" ]]; then
            echo "::warning title=nightly app compile::cmux-ci is not installed on runner $RUNNER_NAME; the Nightly's compile did not run"
            exit 0
          fi
          status=0
          # No --key: KEY fingerprints the inputs, so every PR whose Nightly inputs match shares it at a different
          # --ref, and the controller refuses the second with HTTP 409 "step_key already names a different step"
          # (run 45969778703 attempt 2). The client's default key is per run and attempt; the cache step above
          # is what skips a build whose inputs already passed.
          log="$RUNNER_TEMP/nightly-pr-build-$ARCH.log"
          detach=()
          usage="$("$client" run --help 2>/dev/null || true)"
          if [[ "$DETACH" != 0 && "$usage" != *--detach* && "$LOCAL_CLIENT_ONLY" != 1 && -n "$CONTROLLER" ]]; then
            fresh="$RUNNER_TEMP/fleet-client"
            mkdir -p "$fresh"
            if curl -fsS -m 30 "$CONTROLLER/v1/client/manifest" -o "$fresh/manifest.json" &&
              python3 -I - "$fresh" "$CONTROLLER" <<'PY'
          import hashlib, json, sys, urllib.request
          from pathlib import Path
          root, controller = Path(sys.argv[1]), sys.argv[2]
          for name, digest in json.loads((root / "manifest.json").read_text())["files"].items():
              if "/" in name or name.startswith("."):
                  raise SystemExit(f"bad client file name {name!r}")
              data = urllib.request.urlopen(f"{controller}/v1/client/files/{name}", timeout=30).read()
              if hashlib.sha256(data).hexdigest() != digest:
                  raise SystemExit(f"{name}: sha256 mismatch")
              (root / name).write_bytes(data)
          PY
            then
              printf '#!/bin/sh\nexec python3 -I %q "$@"\n' "$fresh/ci-client.py" > "$fresh/cmux-ci"
              chmod +x "$fresh/cmux-ci"
              fresh_usage="$("$fresh/cmux-ci" run --help 2>/dev/null || true)"
              if [[ "$fresh_usage" == *--detach* ]]; then
                echo "::notice title=nightly app compile::runner $RUNNER_NAME's cmux-ci lacks --detach; using the controller's client"
                client="$fresh/cmux-ci"
                usage="$fresh_usage"
              fi
            else
              echo "::warning title=nightly app compile::could not fetch the controller's client; waiting on the local one"
            fi
          fi
          if [[ "$DETACH" != 0 && "$usage" == *--detach* ]]; then
            detach=(--report-check "$REPORT_CHECK" --detach)
          elif [[ "$DETACH" != 0 ]]; then
            # This runner's cmux-ci cannot detach, so the job holds the runner for the whole fleet wait.
            # Name the runner and client so the stale installs can be counted and updated.
            echo "::warning title=nightly app compile::cmux-ci on runner $RUNNER_NAME has no --detach ($("$client" --version 2>&1 | head -1)); this job waits on the fleet"
          fi
          "$client" run --class isolated --script scripts/cmux-next/check-release-compile.sh --ref "$SHA" \
            --repo "$GITHUB_REPOSITORY" --arg=--archs --arg="$ARCH" --arg=--nightly \
            --reason "nightly pr build $PR $ARCH" --timeout 3600 --queue-timeout "$QUEUE_WAIT_S" ${detach[@]+"${detach[@]}"} 2>&1 \
            | tee "$log" || status=${PIPESTATUS[0]}
          if [[ "$status" == 0 ]] && grep -q ') detached; check run' "$log"; then
            # Submitted: the check run REPORT_CHECK on the head carries the verdict; nothing passed here yet.
            echo "::notice title=nightly app compile::the fleet posts the $ARCH verdict as check run \"$REPORT_CHECK\" on ${SHA:0:12}"
            exit 0
          fi
          step="$(grep -o -E 'step [0-9a-f]{24}' "$log" | head -1 | cut -d' ' -f2)"
          if [[ "$status" == 75 && -n "$step" ]] && grep -q 'is still queued after' "$log"; then
            # Not started within QUEUE_WAIT_S: the step would stay queued and build for nobody.
            "$client" cancel "$step" --reason "nightly pr build: not started within ${QUEUE_WAIT_S}s" || true
          fi
          if [[ "$status" != 0 ]] && grep -q 'source depot full' "$log"; then
            # The controller refused admission because its source depot was full (HTTP 503, or a step that
            # "failed on no worker"): no Mac built anything, so this is no verdict on the PR, like 69. Exit 1
            # here blocked land-judge on runs 46033734368 (#61459) and 46031330461 (#61407).
            status=69
          fi
          case "$status" in
            0) echo "passed=true" >> "$GITHUB_OUTPUT" ;;
            69|75|124) echo "::warning title=nightly app compile::the fleet job gave no verdict (exit $status: 69 controller unavailable, 75 or 124 did not finish); not judged" ;;
            *) echo "::error title=nightly app compile::fleet verification failed for $ARCH (cmux-ci exit $status); see the client output for the admission, setup or build error"
               exit "$status" ;;
          esac
      - name: Cancel the fleet step of a cancelled job
        # fail-fast (or a newer push) cancelled this job: its fleet step, queued or building, has no reader.
        if: ${{ cancelled() && steps.cache.outputs.cache-hit != 'true' && steps.verdict.outputs.passed != 'true' }}
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          client="${CMUX_CI_CLIENT:-$HOME/.local/bin/cmux-ci}"
          if ! [[ -x "$client" ]]; then
            echo "nightly pr build: no fleet client on runner $RUNNER_NAME, so no fleet step to cancel"
            exit 0
          fi
          log="$RUNNER_TEMP/nightly-pr-build-$ARCH.log"
          step="$(grep -o -E 'step [0-9a-f]{24}' "$log" 2>/dev/null | head -1 | cut -d' ' -f2)"
          if [[ -n "$step" ]]; then
            "$client" cancel "$step" --reason "nightly pr build: job cancelled" || true
          fi
      - name: Record the pass
        if: ${{ steps.compile.outputs.passed == 'true' || steps.verdict.outputs.passed == 'true' }}
        run: mkdir -p "$RUNNER_TEMP/nightly-pr-build-pass" && echo "$KEY" > "$RUNNER_TEMP/nightly-pr-build-pass/key"
      - name: Save the pass
        if: ${{ steps.compile.outputs.passed == 'true' || steps.verdict.outputs.passed == 'true' }}
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/nightly-pr-build-pass
          key: ${{ env.KEY }}

  helpers:
    name: nightly rust helpers (advisory)
    needs: [route]
    if: ${{ needs.route.outputs.helpers == 'true' }}
    runs-on: cmux-linux
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      KEY: ${{ fromJSON(needs.route.outputs.keys).helpers }}
    steps:
      - name: Look up a pass with the same inputs
        id: cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/nightly-pr-build-pass
          key: ${{ env.KEY }}
          lookup-only: true
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: false
      - name: Use the merge ref's Nightly driver for the source checkout
        if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        env:
          RECIPE_SHA: ${{ github.sha }}
        run: |
          git -c protocol.version=2 fetch --no-tags --depth=1 --filter=blob:none origin "$RECIPE_SHA"
          git checkout "$RECIPE_SHA" -- scripts/ci/nightly_pr_build.py
      - name: Install Linux build dependencies
        if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        run: scripts/ci/apt-ensure.sh clang libclang-dev pkg-config
      - name: Set up pinned Rust
        if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        uses: ./.github/actions/setup-cmux-tui-rust
      - name: Build each helper the way the Nightly builds it
        if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        run: python3 scripts/ci/nightly_pr_build.py helpers
      - name: Record the pass
        if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        run: mkdir -p "$RUNNER_TEMP/nightly-pr-build-pass" && echo "$KEY" > "$RUNNER_TEMP/nightly-pr-build-pass/key"
      - name: Save the pass
        if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/nightly-pr-build-pass
          key: ${{ env.KEY }}
