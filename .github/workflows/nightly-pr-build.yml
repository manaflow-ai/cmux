# The NIGHTLY's own app compile and Rust helper builds, on a pull request into feat-cmux-next.
#
# A normal Debug or Release PR compile can miss failures specific to the Nightly configuration.
# This checks the Nightly settings when a landing PR changes their inputs:
#   - swift:   scripts/cmux-next/check-release-compile.sh --archs ARCH --nightly, as a fleet job, for
#              arm64 and x86_64: Release with -DCMUX_BLOCKING_CHECKS and -Osize, as app-build-release.sh.
#   - helpers: cargo check --release of each Rust helper the Nightly bundles, with its features and profile.
# Advisory: every job name says so, no rule requires it, and a fleet that does not answer is a warning.
# Each job keys its inputs (scripts/ci/job_input_fingerprint.py) and saves the key on a pass, so a push
# that changes nothing it builds from skips the build. Off switch: repository variable CI_NIGHTLY_PR_BUILD=0.
name: nightly pr build

# Triggers: a pull request into feat-cmux-next whose paths are scripts/ci/pr_router.json's (pr-router.yml calls
# it).
on:
  workflow_call:

permissions: {}

jobs:
  route:
    name: nightly pr build route (advisory)
    if: ${{ github.repository_owner == 'manaflow-ai' && (vars.CI_NIGHTLY_PR_BUILD || '1') != '0' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: cmux-linux
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      swift: ${{ steps.route.outputs.swift }}
      helpers: ${{ steps.route.outputs.helpers }}
      keys: ${{ steps.keys.outputs.keys }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 2
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/
          submodules: false
      - name: Route the change
        id: route
        run: python3 scripts/ci/nightly_pr_build.py route --base 'HEAD^1' --rev HEAD | tee -a "$GITHUB_OUTPUT"
      # The fleet job builds the PR head, while this reusable workflow and its driver come from the
      # merge ref. Keeping the recipe revision separate lets an already-open PR predate this workflow.
      - name: Key the inputs at the head
        id: keys
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RECIPE_SHA: ${{ github.sha }}
        run: |
          git -c protocol.version=2 fetch --no-tags --depth=1 --filter=blob:none origin "$HEAD_SHA"
          python3 scripts/ci/nightly_pr_build.py keys --rev "$HEAD_SHA" --recipe-rev "$RECIPE_SHA" | tee -a "$GITHUB_OUTPUT"

  # The gateway runner's hook takes only job ids ending in -fleet; `swift` was refused (run 45799805163).
  swift-fleet:
    name: nightly app compile ${{ matrix.arch }} fleet job (advisory)
    needs: [route]
    if: ${{ needs.route.outputs.swift == 'true' }}
    # Use the gateway when configured, then the overflow pool, then the owned
    # Linux pool. The job remains a thin cmux-ci client on every route.
    runs-on: ${{ vars.CI_EVAL_STEP_GATEWAY || vars.CI_OVERFLOW_LINUX || 'cmux-linux' }}
    timeout-minutes: 140  # the client waits up to 3600 s queued plus 3600 s running
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]
    env:
      KEY: ${{ fromJSON(needs.route.outputs.keys)[matrix.arch] }}
    steps:
      - name: Look up a pass with the same inputs
        id: cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/nightly-pr-build-pass
          key: ${{ env.KEY }}
          lookup-only: true
      - name: Compile the app the Nightly's way (fleet job)
        if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        id: compile
        env:
          SHA: ${{ github.event.pull_request.head.sha }}
          ARCH: ${{ matrix.arch }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail
          client="${CMUX_CI_CLIENT:-$HOME/.local/bin/cmux-ci}"
          if ! [[ -x "$client" ]]; then
            echo "::warning title=nightly app compile::cmux-ci is not installed on runner $RUNNER_NAME; the Nightly's compile did not run"
            exit 0
          fi
          status=0
          # No --key: KEY fingerprints the inputs, so every PR whose Nightly inputs match shares it at a different
          # --ref, and the controller refuses the second with HTTP 409 "step_key already names a different step"
          # (run 45969778703 attempt 2). The client's default key is per run and attempt; the cache step above
          # is what skips a build whose inputs already passed.
          "$client" run --class isolated --script scripts/cmux-next/check-release-compile.sh --ref "$SHA" \
            --repo "$GITHUB_REPOSITORY" --arg=--archs --arg="$ARCH" --arg=--nightly \
            --reason "nightly pr build #$PR $ARCH" --timeout 3600 --queue-timeout 3600 || status=$?
          case "$status" in
            0) echo "passed=true" >> "$GITHUB_OUTPUT" ;;
            69|75|124) echo "::warning title=nightly app compile::the fleet job gave no verdict (exit $status: 69 controller unavailable, 75 or 124 did not finish); not judged" ;;
            *) echo "::error title=nightly app compile::fleet verification failed for $ARCH (cmux-ci exit $status); see the client output for the admission, setup or build error"
               exit "$status" ;;
          esac
      - name: Record the pass
        if: ${{ steps.compile.outputs.passed == 'true' }}
        run: mkdir -p "$RUNNER_TEMP/nightly-pr-build-pass" && echo "$KEY" > "$RUNNER_TEMP/nightly-pr-build-pass/key"
      - name: Save the pass
        if: ${{ steps.compile.outputs.passed == 'true' }}
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/nightly-pr-build-pass
          key: ${{ env.KEY }}

  helpers:
    name: nightly rust helpers (advisory)
    needs: [route]
    if: ${{ needs.route.outputs.helpers == 'true' }}
    runs-on: cmux-linux
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      KEY: ${{ fromJSON(needs.route.outputs.keys).helpers }}
    steps:
      - name: Look up a pass with the same inputs
        id: cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/nightly-pr-build-pass
          key: ${{ env.KEY }}
          lookup-only: true
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
          submodules: false
      - name: Use the merge ref's Nightly driver for the source checkout
        if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        env:
          RECIPE_SHA: ${{ github.sha }}
        run: |
          git -c protocol.version=2 fetch --no-tags --depth=1 --filter=blob:none origin "$RECIPE_SHA"
          git checkout "$RECIPE_SHA" -- scripts/ci/nightly_pr_build.py
      - name: Install Linux build dependencies
        if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        run: scripts/ci/apt-ensure.sh clang libclang-dev pkg-config
      - name: Set up pinned Rust
        if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        uses: ./.github/actions/setup-cmux-tui-rust
      - name: Build each helper the way the Nightly builds it
        if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        run: python3 scripts/ci/nightly_pr_build.py helpers
      - name: Record the pass
        if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        run: mkdir -p "$RUNNER_TEMP/nightly-pr-build-pass" && echo "$KEY" > "$RUNNER_TEMP/nightly-pr-build-pass/key"
      - name: Save the pass
        if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/nightly-pr-build-pass
          key: ${{ env.KEY }}
