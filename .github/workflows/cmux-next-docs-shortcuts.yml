name: cmux-next docs shortcuts

# feat-cmux-next takes direct pushes, so ci-web.yml's PR checks never run there.
# The keyboard shortcuts docs read web/data/cmux-shortcuts.generated.json, a
# copy of the cmux-next action catalog (DOCS-SHORTCUTS-FROM-CATALOG); this
# backstop fails when the copy or the page no longer matches the catalog.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmux-next-docs-shortcuts-${{ github.ref }}
  cancel-in-progress: true

env:
  # Temporary REST budget attribution: one gh-call line per GitHub API call (scripts/ci/api_call_log/env.sh, fetched at a fixed commit when the checkout has no copy).
  BASH_ENV: '$({ w="${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh"; t="${RUNNER_TEMP:-/nonexistent}/api-call-log-src"; if [ -f "$w" ]; then echo "$w"; elif [ -n "${RUNNER_TEMP:-}" ]; then if [ ! -f "$t/env.sh" ] && [ ! -e "$t.tried" ] && { [ "${RUNNER_OS:-}" = Linux ] || [ "${RUNNER_OS:-}" = macOS ]; } && [ "$(date -u +%Y%m%d%H)" -lt 2026112300 ]; then : > "$t.tried"; mkdir -p "$t.part" && for x in env.sh gh sitecustomize.py isolated.py; do curl -fsSL --max-time 5 -o "$t.part/$x" "https://raw.githubusercontent.com/manaflow-ai/cmux/27647ffd3ae838c63be28ca3e5883dcd68c34518/scripts/ci/api_call_log/$x" || break; done; [ -s "$t.part/isolated.py" ] && mv "$t.part" "$t"; fi; if [ -f "$t/env.sh" ]; then echo "$t/env.sh"; else echo unset BASH_ENV > "$t.off.sh" && echo "$t.off.sh"; fi; fi; } 2>/dev/null)'

jobs:
  docs-shortcuts:
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && (vars.CI_FORK_LINUX_RUNNER || 'ubuntu-24.04') || 'cmux-linux' }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
          no-cache: ${{ !startsWith(github.workspace, '/home/runner/work/') }}

      # The test reads only the catalog export, the string catalogs and its own
      # copy, so it needs no `bun install`.
      - name: Keyboard shortcuts docs match the action catalog
        working-directory: web
        run: bun test tests/docs-shortcuts.test.ts

      # The cmux-next CLI and settings reference pages are generated from the
      # same catalog and the settings schema (plans/cmux-next/docs-DESIGN.md).
      # The test imports docs-channel and the nav list, which pull in next-intl,
      # so this step needs the install.
      - name: Install web dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: cmux-next docs reference pages are fresh
        working-directory: web
        run: bun test tests/next-docs.test.ts
