name: high-signal review link

# Keep PRs navigable without publishing internal gallery payloads. The detailed
# visual evidence stays in the private HQ feed and Actions artifacts; the PR gets
# one stable link to those surfaces.
on:
  pull_request:
    branches: [feat-cmux-next]
    types: [opened, synchronize, reopened]
    paths:
      - "webviews/**"
      - "scripts/gallery-matrix/**"
      - "scripts/cmux-next/build-agent-pane-web.sh"
      - "bun.lock"
      - ".github/workflows/gallery-advisory.yml"
      - ".github/workflows/gallery-link.yml"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: gallery-link-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  link:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    steps:
      - name: Update the PR receipt
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SERVER: ${{ github.server_url }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          FEED_URL: https://cmux-lawrences-mac-mini.tail137216.ts.net:18443/feed/
        run: |
          set -euo pipefail
          # One receipt per PR, replaced on every push: the exact head, where
          # its visual evidence is, its checks, and how to get an app of it.
          # No link to this run: it only posts the comment, and the HQ feed
          # would read an Actions run link here as the PR's build.
          repo_url="$SERVER/$REPOSITORY"
          ref_query=$(jq -rn --arg q "branch:$HEAD_REF" '$q|@uri')
          body="<!-- cmux-gallery-link -->
          **Receipt for [\`${HEAD_SHA:0:7}\`]($repo_url/commit/$HEAD_SHA)** (this PR's head; a new push replaces it)
          - Visual review: [HQ feed card](${FEED_URL}?pr=${PR}&view=all) · [gallery before/after runs]($repo_url/actions/workflows/gallery-advisory.yml?query=$ref_query)
          - Checks: [this head]($repo_url/pull/$PR/checks?sha=$HEAD_SHA)
          - App of this head (app.zip, kept 1 day): \`gh workflow run reload-build.yml -R $REPOSITORY --ref feat-cmux-next -f tag=pr$PR -f ref=$HEAD_REF -f platform=macos -f backend_mode=local\`"
          existing=$(gh api --paginate "repos/$REPOSITORY/issues/$PR/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- cmux-gallery-link -->"))) | .id' | head -1)
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$REPOSITORY/issues/comments/$existing" -f body="$body" >/dev/null
          else
            gh api -X POST "repos/$REPOSITORY/issues/$PR/comments" -f body="$body" >/dev/null
          fi
