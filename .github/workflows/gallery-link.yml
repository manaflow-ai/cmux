name: high-signal review link

# Keep PRs navigable without publishing internal gallery payloads. The detailed
# visual evidence stays in the private HQ feed and Actions artifacts; the PR gets
# one stable link to those surfaces.
on:
  pull_request:
    branches: [feat-cmux-next]
    types: [opened, synchronize, reopened]
    paths:
      - "webviews/**"
      - "scripts/gallery-matrix/**"
      - "scripts/cmux-next/build-agent-pane-web.sh"
      - "bun.lock"
      - ".github/workflows/gallery-advisory.yml"
      - ".github/workflows/gallery-link.yml"

permissions: {}

concurrency:
  group: gallery-link-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  link:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Update the concise review link
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          FEED_URL: https://cmux-lawrences-mac-mini.tail137216.ts.net:18443/feed/
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          body="<!-- cmux-gallery-link -->
          Visual review: [HQ feed](${FEED_URL}?pr=${PR}&view=all) · [workflow run](${RUN_URL})"
          existing=$(gh api --paginate "repos/$REPOSITORY/issues/$PR/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- cmux-gallery-link -->"))) | .id' | head -1)
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$REPOSITORY/issues/comments/$existing" -f body="$body" >/dev/null
          else
            gh api -X POST "repos/$REPOSITORY/issues/$PR/comments" -f body="$body" >/dev/null
          fi
