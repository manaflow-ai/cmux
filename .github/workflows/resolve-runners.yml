name: Resolve runners

# Publishes the capability -> runner label map for the repository this run is
# on. Callers consume it as:
#
#   jobs:
#     runners:
#       uses: ./.github/workflows/resolve-runners.yml
#     build:
#       needs: runners
#       runs-on: ${{ fromJSON(needs.runners.outputs.map).macos_26 }}
#
# The map itself is .github/runners.json, resolved by
# scripts/ci/resolve_runners.py. A fork resolves to the GitHub-hosted fleet
# with no configuration at all: Blacksmith is an organization-level GitHub App,
# and a blacksmith-* label on a personal account does not error -- the job sits
# queued forever and holds the workflow's concurrency group.
#
# fromJSON() here is safe because `map` is always a non-empty JSON object: the
# resolver fails the job rather than print a partial map. The two override
# variables are read as plain strings and parsed in Python, never with
# fromJSON(vars.X), which fails the whole workflow when the variable is unset.

on:
  workflow_call:
    inputs:
      fleet:
        description: >-
          Force a fleet declared in .github/runners.json (for example "hosted").
          Empty means resolve from the repository owner.
        required: false
        type: string
        default: ""
    outputs:
      map:
        description: JSON object of capability key -> runner label.
        value: ${{ jobs.resolve.outputs.map }}
      fleet:
        description: Name of the fleet the map came from.
        value: ${{ jobs.resolve.outputs.fleet }}

permissions:
  contents: read

env:
  # Temporary REST budget attribution: one gh-call line per GitHub API call (scripts/ci/api_call_log/env.sh, fetched at a fixed commit when the checkout has no copy).
  BASH_ENV: '$({ w="${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh"; t="${RUNNER_TEMP:-/nonexistent}/api-call-log-src"; if [ -f "$w" ]; then echo "$w"; elif [ -n "${RUNNER_TEMP:-}" ]; then if [ ! -f "$t/env.sh" ] && [ ! -e "$t.tried" ] && { [ "${RUNNER_OS:-}" = Linux ] || [ "${RUNNER_OS:-}" = macOS ]; } && [ "$(date -u +%Y%m%d%H)" -lt 2026112300 ]; then : > "$t.tried"; mkdir -p "$t.part" && for x in env.sh gh sitecustomize.py isolated.py; do curl -fsSL --max-time 5 -o "$t.part/$x" "https://raw.githubusercontent.com/manaflow-ai/cmux/27647ffd3ae838c63be28ca3e5883dcd68c34518/scripts/ci/api_call_log/$x" || break; done; [ -s "$t.part/isolated.py" ] && mv "$t.part" "$t"; fi; if [ -f "$t/env.sh" ]; then echo "$t/env.sh"; else echo unset BASH_ENV > "$t.off.sh" && echo "$t.off.sh"; fi; fi; } 2>/dev/null)'

jobs:
  resolve:
    name: Resolve runner capabilities
    # Not the map: the job that resolves the fleet cannot depend on the map it
    # publishes. A fork takes the GitHub-hosted owner branch (no Blacksmith
    # there). In manaflow-ai (about 5 s of work, contents: read, no secret) a
    # same-repository event's attempt 1 takes the owned persistent pool,
    # cmux-linux; a fork pull request's run and every attempt 2+ (a re-run of a
    # job that stalled there) take the CI_TRUSTED_RUNNER selector, Blacksmith
    # by default, as overflow. Leo, 2026-11-19: "stop ... relying on it". On
    # 2026-11-21 at 11:44Z this job sat queued on attempt 1 on
    # blacksmith-4vcpu-ubuntu-2404 (16 queued there) while cmux-fleet-linux-x64
    # had 1,311 idle runners. It took GitHub-hosted Ubuntu on attempt 1 until
    # 2026-11-18, when hosted runners left light jobs queued for hours
    # (cmux#45735). No fromJSON(vars.*) here: an unset variable would fail
    # every caller's workflow.
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.run_attempt == 1 && !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'cmux-linux' || 'blacksmith-4vcpu-ubuntu-2404' }} # frozen-label: credentialed job, frozen to today's label
    timeout-minutes: 5
    outputs:
      map: ${{ steps.resolve.outputs.map }}
      fleet: ${{ steps.resolve.outputs.fleet }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          submodules: false
          sparse-checkout: |
            .github/runners.json
            scripts/ci/resolve_runners.py
            .gitmodules
          sparse-checkout-cone-mode: false

      - name: Resolve capability map
        id: resolve
        env:
          # Unset repository variables expand to the empty string, which the
          # resolver reads as "no override". Nothing here is fromJSON()-ed.
          INPUT_FLEET: ${{ inputs.fleet }}
          CMUX_CI_RUNNER_FLEET: ${{ vars.CMUX_CI_RUNNER_FLEET }}
          CMUX_CI_RUNNER_OVERRIDES: ${{ vars.CMUX_CI_RUNNER_OVERRIDES }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_FLEET}" ]; then
            CMUX_CI_RUNNER_FLEET="${INPUT_FLEET}"
            export CMUX_CI_RUNNER_FLEET
          fi
          python3 scripts/ci/resolve_runners.py

      - name: Report the resolved map
        env:
          RESOLVED_FLEET: ${{ steps.resolve.outputs.fleet }}
          RESOLVED_MAP: ${{ steps.resolve.outputs.map }}
        run: |
          set -euo pipefail
          {
            echo "### Runner capability map"
            echo
            echo "Owner \`${GITHUB_REPOSITORY_OWNER}\` resolved to fleet \`${RESOLVED_FLEET}\`."
            echo
            echo '```json'
            echo "${RESOLVED_MAP}"
            echo '```'
          } >>"${GITHUB_STEP_SUMMARY}"
