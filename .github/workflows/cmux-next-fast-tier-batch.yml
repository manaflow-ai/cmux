name: cmux-next fast tier batch

# Every cargo and script entry of the cmux NEXT fast tier (scripts/cmux-next/fast-tier.json) at one feat-cmux-next
# commit, in the post-merge batch (cmux-next-post-merge.yml, suite fast-tier). Its Swift entries run from the step
# table in suite pr-pipeline-mac (cmux-next-pr-pipeline-mac-batch.yml, ci/steps.toml mac-fast-tier), on
# pr-pipeline.yml's mac machine.
#
# Leo, 2026-11-21: "de facto, im asking for 99% fewer minutes of ci time, period." A pull request into
# feat-cmux-next runs only the fast tier entries, and the compiles, its change reaches (fast-tier.py
# --changed-files: affected_jobs.py's crate graph for a cargo entry, cmux_next_route.py's test targets for a
# swift one). Every entry still runs here, once a batch window, at the merged tip, where the batch's judge
# bisects a new red to its commit. `vars.CI_FAST_TIER_PR_SCOPE` set to `0` runs every entry on the pull request
# again. A dispatch runs this by hand.

on:
  workflow_call:
    inputs:
      sha:
        description: "The commit to test (the post-merge batch's tip or a bisect probe's commit). Empty: the event's own."
        type: string
        default: ""
      only:
        description: "The one job id to run (a bisect probe): cargo. Empty: every job."
        type: string
        default: ""
  workflow_dispatch:

permissions: {}

concurrency:
  # A batch run or bisect probe is keyed by its commit and job, so neither evicts the other's pending call.
  group: cmux-next-fast-tier-batch${{ inputs.sha && format('-{0}-{1}', inputs.sha, inputs.only) || format('-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  cargo:
    name: fast tier (cargo and script entries)
    if: ${{ (inputs.only == '' || inputs.only == 'cargo') && github.repository == 'manaflow-ai/cmux' }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || 'cmux-linux' }}
    permissions:
      contents: read
    # A cold cmux-tui test build (two packages) and the entries, each capped at 60 s.
    timeout-minutes: 45
    env:
      GHOSTTY_ZIG_SOURCE: ghostty-next
      CMUX_GHOSTTY_SRC: ""
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        timeout-minutes: 5
        with:
          ref: ${{ inputs.sha || '' }}
          persist-credentials: false
          submodules: false

      - name: Init the ghostty-next submodule (libghostty-vt for cmux-tui-core)
        run: bash scripts/ci/init-submodule.sh ghostty-next

      - name: Install zig
        run: ./scripts/install-zig-ci.sh

      - name: Set up pinned cmux-tui Rust
        uses: ./.github/actions/setup-cmux-tui-rust

      - name: Run every cargo and script entry
        run: python3 -I scripts/cmux-next/fast-tier.py --kind cargo --kind script --receipt "$RUNNER_TEMP/fast-tier-cargo.json"
