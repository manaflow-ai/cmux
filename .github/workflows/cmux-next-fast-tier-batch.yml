name: cmux-next fast tier batch

# Every entry of the cmux NEXT fast tier (scripts/cmux-next/fast-tier.json) at one feat-cmux-next commit, in the
# post-merge batch (cmux-next-post-merge.yml, suite fast-tier).
#
# Leo, 2026-11-21: "de facto, im asking for 99% fewer minutes of ci time, period." A pull request into
# feat-cmux-next runs only the fast tier entries, and the compiles, its change reaches (fast-tier.py
# --changed-files: affected_jobs.py's crate graph for a cargo entry, cmux_next_route.py's test targets for a
# swift one). Every entry still runs here, once a batch window, at the merged tip, where the batch's judge
# bisects a new red to its commit. `vars.CI_FAST_TIER_PR_SCOPE` set to `0` runs every entry on the pull request
# again. A dispatch runs this by hand.

on:
  workflow_call:
    inputs:
      sha:
        description: "The commit to test (the post-merge batch's tip or a bisect probe's commit). Empty: the event's own."
        type: string
        default: ""
      only:
        description: "The one job id to run (a bisect probe): cargo or swift. Empty: every job."
        type: string
        default: ""
  workflow_dispatch:

permissions: {}

concurrency:
  # A batch run or bisect probe is keyed by its commit and job, so neither evicts the other's pending call.
  group: cmux-next-fast-tier-batch${{ inputs.sha && format('-{0}-{1}', inputs.sha, inputs.only) || format('-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  cargo:
    name: fast tier (cargo and script entries)
    if: ${{ (inputs.only == '' || inputs.only == 'cargo') && github.repository == 'manaflow-ai/cmux' }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || 'cmux-linux' }}
    permissions:
      contents: read
    # A cold cmux-tui test build (two packages) and the entries, each capped at 60 s.
    timeout-minutes: 45
    env:
      GHOSTTY_ZIG_SOURCE: ghostty-next
      CMUX_GHOSTTY_SRC: ""
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        timeout-minutes: 5
        with:
          ref: ${{ inputs.sha || '' }}
          persist-credentials: false
          submodules: false

      - name: Init the ghostty-next submodule (libghostty-vt for cmux-tui-core)
        run: bash scripts/ci/init-submodule.sh ghostty-next

      - name: Install zig
        run: ./scripts/install-zig-ci.sh

      - name: Set up pinned cmux-tui Rust
        uses: ./.github/actions/setup-cmux-tui-rust

      - name: Run every cargo and script entry
        run: python3 -I scripts/cmux-next/fast-tier.py --kind cargo --kind script --receipt "$RUNNER_TEMP/fast-tier-cargo.json"

  swift:
    name: fast tier (Swift entries, build fleet)
    if: ${{ (inputs.only == '' || inputs.only == 'swift') && github.repository == 'manaflow-ai/cmux' && vars.CI_COMPILE_CHECK_GATEWAY != '' }}
    # The gateway only runs the fleet client; the suites build and run on a fleet Mac.
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || 'glaeda-gateway-xcode-26.6' }} # frozen-label: CI_COMPILE_CHECK_GATEWAY (cmux#54437)
    permissions:
      contents: read
    # The client's queue wait (20 min) and run limit (25 min), and the report.
    timeout-minutes: 50
    steps:
      - name: Checkout the registry
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        timeout-minutes: 5
        with:
          ref: ${{ inputs.sha || '' }}
          persist-credentials: false
          submodules: false
          fetch-depth: 1
          sparse-checkout: |
            scripts/cmux-next/fast-tier.json
            .gitmodules
          sparse-checkout-cone-mode: false

      - name: Run every Swift entry on the build fleet
        env:
          REF: ${{ inputs.sha || github.sha }}
        run: |
          set -uo pipefail
          if ! [[ "$REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::the commit to test is not a full sha ('$REF')"
            exit 1
          fi
          client="${CMUX_CI_CLIENT:-$HOME/.local/bin/cmux-ci}"
          # No client, a queue that never started the step, or no record of it is no verdict: a warning, never a
          # red the batch's judge would bisect into a revert (as the tip test-compile suite treats it).
          if ! [[ -x "$client" ]]; then
            echo "::warning title=Fast tier batch (Swift): no verdict::$client is not installed on runner $RUNNER_NAME"
            exit 0
          fi
          # Each package's suites, from the registry (the same Swift entries fast-tier.py runs; here they run on the build fleet, not this runner).
          mapfile -t packages < <(python3 -I -c 'import json, sys
          suites = {}
          for e in json.load(open(sys.argv[1]))["entries"]:
              if e["kind"] == "swift":
                  suites.setdefault(e["package"], []).append(e["filter"])
          for package, names in suites.items():
              print(package + " " + ",".join(names))' scripts/cmux-next/fast-tier.json)
          index=0
          for item in "${packages[@]}"; do
            index=$((index + 1))
            ( status=0
              "$client" run --class light --script scripts/ci/package-test-lane.sh --ref "$REF" \
                --arg=suite --arg="${item%% *}" --arg="${item#* }" --no-supersede \
                --env=CMUX_SWIFT_PACKAGE_TEST_TIMEOUT_SECONDS=60 \
                --timeout 1500 --queue-timeout 1200 > "$RUNNER_TEMP/fast-tier-batch-$index.log" 2>&1 || status=$?
              echo "$status" > "$RUNNER_TEMP/fast-tier-batch-$index.exit" ) &
          done
          wait
          step_re='^cmux-ci: step ([0-9a-f]{6,64}) '
          state_re='"state": *"([a-z_]*)"'
          code_re='"exit_code": *(-?[0-9]+)'
          failed=0
          index=0
          for item in "${packages[@]}"; do
            index=$((index + 1))
            package="${item%% *}"
            id="" state="" code="" status=""
            echo "::group::$package on the build fleet"
            while IFS= read -r line || [[ -n "$line" ]]; do
              printf '%s\n' "$line"
              if [[ -z "$id" && "$line" =~ $step_re ]]; then id="${BASH_REMATCH[1]}"; fi
            done < "$RUNNER_TEMP/fast-tier-batch-$index.log"
            echo "::endgroup::"
            read -r status < "$RUNNER_TEMP/fast-tier-batch-$index.exit" || status=""
            if [[ -n "$id" ]] && json="$("$client" status "$id" 2>&1)"; then
              if [[ "$json" =~ $state_re ]]; then state="${BASH_REMATCH[1]}"; fi
              if [[ "$json" =~ $code_re ]]; then code="${BASH_REMATCH[1]}"; fi
            fi
            if [[ "$status" == 0 && "$state" == done && "$code" == 0 ]]; then
              echo "$package: every suite passed at $REF (step $id)" | tee -a "$GITHUB_STEP_SUMMARY"
            elif [[ ( "$state" == failed || "$state" == done ) && "$code" =~ ^-?[0-9]+$ && "$code" -ne 0 ]]; then
              echo "::error title=Fast tier batch (Swift)::$package: a suite failed or did not build at $REF (step $id, exit $code)"
              failed=1
            else
              echo "::warning title=Fast tier batch (Swift): no verdict::$package: no verdict (client exit ${status:-unknown}, step ${id:-none} ${state:-unknown})"
            fi
          done
          exit "$failed"
