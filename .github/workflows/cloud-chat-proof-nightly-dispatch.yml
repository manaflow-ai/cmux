name: Cloud chat proof nightly dispatcher

# Leo 2026-11-08: "he creates a new workspace ... he selects the cloud button ... He can just start up Opus or
# Codex on cloud. Is that possible? Like right now, and it's just like, oh, okay, this works, and this just keeps
# working ... suppose he picks some random folder." Once a day this file on main starts feat-cmux-next's
# cloud-chat-proof.yml on the published NEXT DEV app, from a plain folder (from_folder), once for claude and once
# for codex: sign in, start a Cloud chat from the folder on staging and production, read the reply back (it must
# name a word only the folder's file holds), kill the machine. Scheduled workflows run only from the default
# branch, and the proof lives on feat-cmux-next, so this dispatches it and waits for its verdict. A red run opens
# one issue per agent, or comments on the open one; the next green run of that agent closes it. The wait and the
# API retries are in scripts/ci/cloud_chat_proof_dispatch.mjs (tests/cloud_chat_proof_dispatch.test.mjs).
on:
  schedule:
    - cron: "23 15 * * *"
  workflow_dispatch:

permissions: {}

env:
  # Temporary REST budget attribution: one gh-call line per GitHub API call (scripts/ci/api_call_log/env.sh, fetched at a fixed commit when the checkout has no copy).
  BASH_ENV: '$({ w="${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh"; t="${RUNNER_TEMP:-/nonexistent}/api-call-log-src"; if [ -f "$w" ]; then echo "$w"; elif [ -n "${RUNNER_TEMP:-}" ]; then if [ ! -f "$t/env.sh" ] && [ ! -e "$t.tried" ] && { [ "${RUNNER_OS:-}" = Linux ] || [ "${RUNNER_OS:-}" = macOS ]; } && [ "$(date -u +%Y%m%d%H)" -lt 2026112300 ]; then : > "$t.tried"; mkdir -p "$t.part" && for x in env.sh gh sitecustomize.py isolated.py; do curl -fsSL --max-time 5 -o "$t.part/$x" "https://raw.githubusercontent.com/manaflow-ai/cmux/27647ffd3ae838c63be28ca3e5883dcd68c34518/scripts/ci/api_call_log/$x" || break; done; [ -s "$t.part/isolated.py" ] && mv "$t.part" "$t"; fi; if [ -f "$t/env.sh" ]; then echo "$t/env.sh"; else echo unset BASH_ENV > "$t.off.sh" && echo "$t.off.sh"; fi; fi; } 2>/dev/null)'

jobs:
  proof:
    if: github.repository == 'manaflow-ai/cmux'
    strategy:
      fail-fast: false
      matrix:
        agent: [claude, codex]
    # It holds the cmux-bot App key, so LINUX_RUNNER may only pick a Blacksmith label from this list.
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || contains(fromJSON('["blacksmith-4vcpu-ubuntu-2404","blacksmith-8vcpu-ubuntu-2404","blacksmith-16vcpu-ubuntu-2404","blacksmith-32vcpu-ubuntu-2404"]'), vars.LINUX_RUNNER) && vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    permissions:
      actions: write
      contents: read
      issues: write
    # Finding the run (10 min), the wait (the proof's 260 min worst case plus 20) and the API retries.
    timeout-minutes: 325
    env:
      # A scheduled job's GitHub API waits stop here and fail loud (scripts/ci/gh_budget_wait.sh).
      GH_BUDGET_WAIT_MAX_SECONDS: "900"
    steps:
      # This commit's GitHub API wait (scripts/ci/gh_budget_wait.sh): every later gh call, and
      # each github-script step that installs gh_budget_wait.cjs, waits through a rate limit or a
      # GitHub 5xx under the job's GH_BUDGET_WAIT_MAX_SECONDS, then fails loud.
      - name: Checkout the GitHub API wait
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: .gh-budget-tooling
          sparse-checkout: |
            scripts/ci/gh_budget_wait.sh
            scripts/ci/gh_budget_wait.cjs
          sparse-checkout-cone-mode: false
      - name: Wait through GitHub API rate limits and 5xx in this job
        working-directory: ${{ github.workspace }}
        run: bash .gh-budget-tooling/scripts/ci/gh_budget_wait.sh --install

      # The cmux-bot installation has its own hourly quota. github.token's is shared with every other workflow,
      # and one rate-limited 403 on it while finding the run turned main red (run 43897769538); the retries
      # here last minutes, not the hour it takes that quota to reset. github.token stays the fallback.
      - name: Mint the cmux-bot token
        id: cmux-bot-token
        if: vars.CMUX_BOT_APP_ID != ''
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.CMUX_BOT_APP_ID }}
          private-key: ${{ secrets.CMUX_BOT_APP_KEY }}
          permission-actions: write
          permission-contents: read
          permission-issues: write

      - name: Checkout the dispatcher script
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: scripts/ci/cloud_chat_proof_dispatch.mjs
          sparse-checkout-cone-mode: false

      - name: Start the published Cloud chat proof from a folder and wait for its verdict
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          AGENT: ${{ matrix.agent }}
          # The cmux-bot token expires after one hour; the wait outlives it (scripts/ci/cloud_chat_proof_dispatch.mjs rotating()).
          FALLBACK_TOKEN: ${{ steps.cmux-bot-token.outputs.token && github.token || '' }}
        with:
          github-token: ${{ steps.cmux-bot-token.outputs.token || github.token }}
          script: |
            if (process.env.GH_BUDGET_WAIT_JS) require(process.env.GH_BUDGET_WAIT_JS).install({ github, core });
            const { owner, repo } = context.repo;
            const agent = process.env.AGENT;
            // GITHUB_RUN_ATTEMPT, not context: a rerun must never find the run an earlier attempt started.
            const requestId = `nightly-${context.runId}-${process.env.GITHUB_RUN_ATTEMPT}-${agent}`;
            const proof = await import(`${process.env.GITHUB_WORKSPACE}/scripts/ci/cloud_chat_proof_dispatch.mjs`);
            let fallback;
            if (process.env.FALLBACK_TOKEN) {
              fallback = getOctokit(process.env.FALLBACK_TOKEN);
              if (process.env.GH_BUDGET_WAIT_JS) require(process.env.GH_BUDGET_WAIT_JS).install({ github: fallback, core });
            }
            const result = await proof.prove({ github, fallback, owner, repo, agent, requestId, log: core.info });
            core.notice(`Cloud chat proof, ${agent} from a folder on the published app: ${result.verdict} ${result.where}`);
            await proof.report({ github, owner, repo, agent, ...result, log: core.info });
            if (!result.green) core.setFailed(`Cloud chat proof (${agent}) ${result.verdict}`);
