name: nightly-next health

# The cmux NEXT health gate. Its jobs and tooling live on feat-cmux-next and nightly-next
# (.github/workflows/nightly-next-health.yml there, scripts/ci/nightly_next_health.py,
# docs/ci/nightly-next-canary.md, Health gate). GitHub runs a schedule, and registers a dispatch,
# only from the default branch, so this copy on main holds the cron and the dispatch's inputs.
# Every 15 minutes job start dispatches the workflow on nightly-next, where release-next releases
# the feed's R2 token; that run judges the newest Nightly builds' real-session health from Sentry,
# writes health/<build>.json beside the build, and a failing newest build is pulled from the feed.
#
# Repository variable NIGHTLY_NEXT_HEALTH_GATE: `off` runs nothing; `report` writes verdicts and
# pulls nothing; unset or anything else pulls a failing build.
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      build:
        description: Judge this feed build (digits). Empty judges the newest Nightly builds.
        required: false
        default: ''
        type: string

permissions: {}

env:
  # Temporary REST budget attribution: one gh-call line per GitHub API call (scripts/ci/api_call_log/env.sh, fetched at a fixed commit when the checkout has no copy).
  BASH_ENV: '$({ w="${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh"; t="${RUNNER_TEMP:-/nonexistent}/api-call-log-src"; if [ -f "$w" ]; then echo "$w"; elif [ -n "${RUNNER_TEMP:-}" ]; then if [ ! -f "$t/env.sh" ] && [ ! -e "$t.tried" ] && { [ "${RUNNER_OS:-}" = Linux ] || [ "${RUNNER_OS:-}" = macOS ]; } && [ "$(date -u +%Y%m%d%H)" -lt 2026112300 ]; then : > "$t.tried"; mkdir -p "$t.part" && for x in env.sh gh sitecustomize.py isolated.py; do curl -fsSL --max-time 5 -o "$t.part/$x" "https://raw.githubusercontent.com/manaflow-ai/cmux/27647ffd3ae838c63be28ca3e5883dcd68c34518/scripts/ci/api_call_log/$x" || break; done; [ -s "$t.part/isolated.py" ] && mv "$t.part" "$t"; fi; if [ -f "$t/env.sh" ]; then echo "$t/env.sh"; else echo unset BASH_ENV > "$t.off.sh" && echo "$t.off.sh"; fi; fi; } 2>/dev/null)'

jobs:
  # No secrets: it only dispatches this workflow on nightly-next.
  start:
    if: github.repository == 'manaflow-ai/cmux' && github.event_name == 'schedule' && vars.NIGHTLY_NEXT_HEALTH_GATE != 'off'
    permissions:
      actions: write # dispatch nightly-next-health.yml
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.LINUX_RUNNER || fromJSON(vars.RUNNER_POOLS).linux_4 || 'blacksmith-4vcpu-ubuntu-2404' }}
    # The cron fires every 15 minutes: wait at most 9 of them through a spent API budget, so a
    # wait ends in the wrapper's own failure before the next run starts.
    timeout-minutes: 14
    env:
      GH_TOKEN: ${{ github.token }}
      GH_BUDGET_WAIT_MAX_SECONDS: "540"
    steps:
      - name: Check out the GitHub API budget wait
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: .gh-budget-tooling
          sparse-checkout: |
            scripts/ci/gh_budget_wait.sh
            scripts/ci/gh_budget_wait.cjs
          sparse-checkout-cone-mode: false
      - name: Wait through GitHub API rate limits and 5xx in this job
        working-directory: ${{ github.workspace }}
        run: bash .gh-budget-tooling/scripts/ci/gh_budget_wait.sh --install
      - name: Dispatch the judge on nightly-next
        run: gh workflow run nightly-next-health.yml -R "$GITHUB_REPOSITORY" --ref nightly-next
