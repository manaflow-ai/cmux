name: nightly-next health

# The cmux NEXT health gate (scripts/ci/nightly_next_health.py; docs/ci/nightly-next-canary.md, Health gate).
# Every 15 minutes it reads real-session health of the feed's newest Nightly build from Sentry release
# health (crash-free sessions and app hangs, against the Nightly build before it), writes the build's
# verdict to health/<build>.json beside verdicts/<build>.json in R2
# (https://files-next.cmux.com/nightly-next/next/health/<build>.json), and a `fail` pulls the build from
# the feed through nightly-next-rollback.yml (bad_build = if_newest = the build, so a build published
# meanwhile is never pulled). Before this the crash-free rate reached a person once a day, in
# cmux-next-quality-report.yml, which gates nothing.
#
# Repository variable NIGHTLY_NEXT_HEALTH_GATE: `off` runs nothing; `report` writes verdicts and pulls
# nothing; unset or anything else writes verdicts and pulls a failing build.
#
# GitHub runs a schedule, and registers a dispatch, only from the default branch, so this file is on
# main too. There the cron runs job start, which dispatches this workflow on nightly-next, where
# release-next releases the feed's R2 token; every other job runs only on nightly-next.
# The rollback drill (nightly-next-rollback-drill.yml, step health) calls it with drill true: it judges
# the drill feed's bad canary from a made-up failing reading and pulls it from the drill folder only.
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      build:
        description: Judge this feed build (digits). Empty judges the newest Nightly build.
        required: false
        default: ''
        type: string
  workflow_call:
    inputs:
      build:
        required: false
        default: ''
        type: string
      drill:
        description: Judge and pull in the drill folder (nightly-next/drill/), never the users' feed.
        required: false
        default: false
        type: boolean
    secrets:
      NIGHTLY_NEXT_R2_ACCESS_KEY_ID:
        required: false
      NIGHTLY_NEXT_R2_SECRET_ACCESS_KEY:
        required: false
      NIGHTLY_NEXT_R2_ACCOUNT_ID:
        required: false
  pull_request:
    paths:
      - .github/workflows/nightly-next-health.yml
      - scripts/ci/nightly_next_health.py
      - tests/test_nightly_next_health.py

permissions: {}

# One judge at a time per folder, never cancelled: a queued tick that starts after a pull reads the
# pulled feed and judges the build the feed serves now.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('nightly-next-health-pr-{0}', github.event.pull_request.number) || inputs.drill && format('nightly-next-health-drill-{0}', github.run_id) || 'nightly-next-health' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The same values as nightly-next-rollback.yml; nightly-next-guard.py checks every write against them.
  NIGHTLY_NEXT_FEED_BASE: https://files-next.cmux.com/nightly-next
  NIGHTLY_NEXT_R2_BUCKET: cmux-nightly-next
  NIGHTLY_NEXT_R2_PREFIX: nightly-next/
  NIGHTLY_APPCAST: appcast-arm64.xml
  # The appcast's folder under the feed base (empty for the users' feed), and the health files' folder,
  # beside verdicts/ and pulled.json (nightly.yml NIGHTLY_NEXT_VERDICTS_BASE).
  NIGHTLY_FEED_DIR: ${{ inputs.drill && 'drill/' || '' }}
  NIGHTLY_HEALTH_DIR: ${{ inputs.drill && 'drill/health/' || 'next/health/' }}

jobs:
  # No secrets: it only dispatches this workflow on nightly-next.
  start:
    if: github.repository == 'manaflow-ai/cmux' && github.event_name == 'schedule' && vars.NIGHTLY_NEXT_HEALTH_GATE != 'off'
    permissions:
      actions: write # dispatch nightly-next-health.yml
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.LINUX_RUNNER || fromJSON(vars.RUNNER_POOLS).linux_4 }}
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Dispatch the judge on nightly-next
        run: gh workflow run nightly-next-health.yml -R "$GITHUB_REPOSITORY" --ref nightly-next

  # main's tree has none of the tooling; its copy of this file only registers the cron.
  test:
    if: github.event_name == 'pull_request' && github.base_ref == 'feat-cmux-next'
    permissions:
      contents: read
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.LINUX_RUNNER || fromJSON(vars.RUNNER_POOLS).linux_4 }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Validate the health verdict and the pull decision
        run: python3 -I tests/test_nightly_next_health.py

  judge:
    if: >-
      github.repository == 'manaflow-ai/cmux' && github.ref == 'refs/heads/nightly-next' &&
      (github.event_name == 'workflow_dispatch' || inputs.drill) && (inputs.drill || vars.NIGHTLY_NEXT_HEALTH_GATE != 'off')
    environment: release-next
    permissions:
      contents: read
    # A literal ephemeral label: this job holds the feed's write token.
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.LINUX_RUNNER || fromJSON(vars.RUNNER_POOLS).linux_4 }}
    timeout-minutes: 10
    outputs:
      action: ${{ steps.judge.outputs.action }}
      build: ${{ steps.judge.outputs.build }}
      verdict: ${{ steps.judge.outputs.verdict }}
      why: ${{ steps.judge.outputs.why }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/ci/nightly_next_health.py
            scripts/ci/nightly-next-guard.py
            scripts/ci/upload-r2-object.py
          sparse-checkout-cone-mode: false

      - name: Read the feed and the build's earlier verdict
        id: feed
        env:
          BUILD: ${{ inputs.build }}
        run: |
          set -euo pipefail
          mkdir -p health
          curl -fsSL --retry 3 --connect-timeout 10 --max-time 30 -A "cmux-nightly-next-health/1" -H "Cache-Control: no-cache" \
            -o health/feed.xml "${NIGHTLY_NEXT_FEED_BASE}/${NIGHTLY_FEED_DIR}${NIGHTLY_APPCAST}?health=${GITHUB_RUN_ID}"
          build="${BUILD:-$(python3 -I scripts/ci/nightly_next_health.py pick --feed health/feed.xml)}"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          # A 404 is a build with no verdict yet.
          curl -fsSL --retry 2 --connect-timeout 10 --max-time 30 -A "cmux-nightly-next-health/1" -H "Cache-Control: no-cache" \
            -o health/existing.json "${NIGHTLY_NEXT_FEED_BASE}/${NIGHTLY_HEALTH_DIR}${build}.json?health=${GITHUB_RUN_ID}" || rm -f health/existing.json

      - name: Read Sentry release health
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          DRILL: ${{ inputs.drill }}
          BUILD: ${{ steps.feed.outputs.build }}
        run: |
          set -euo pipefail
          if [ "$DRILL" = true ]; then
            python3 -I scripts/ci/nightly_next_health.py drill-reading --build "$BUILD" \
              --now "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --out health/reading.json
          else
            python3 -I scripts/ci/nightly_next_health.py sentry-read --feed health/feed.xml --build "$BUILD" --out health/reading.json
          fi

      - name: Judge
        id: judge
        env:
          BUILD: ${{ steps.feed.outputs.build }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          args=()
          [ ! -f health/existing.json ] || args+=(--existing health/existing.json)
          result="$(python3 -I scripts/ci/nightly_next_health.py judge --feed health/feed.xml --reading health/reading.json \
            --build "$BUILD" --now "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --run-url "$RUN_URL" --out health/verdict.json "${args[@]}")"
          echo "$result"
          python3 - "$result" >> "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          r = json.loads(sys.argv[1])
          print(f"action={r['action']}")
          print(f"build={r['health']['build']}")
          print(f"verdict={r['health']['verdict']}")
          print("why=" + " ".join(r["why"].split()))
          PY

      - name: Write the verdict beside the build
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.NIGHTLY_NEXT_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.NIGHTLY_NEXT_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: "https://${{ secrets.NIGHTLY_NEXT_R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
          BUILD: ${{ steps.judge.outputs.build }}
        run: |
          set -euo pipefail
          key="${NIGHTLY_NEXT_R2_PREFIX}${NIGHTLY_HEALTH_DIR}${BUILD}.json"
          python3 -I scripts/ci/nightly-next-guard.py r2-key "$NIGHTLY_NEXT_R2_BUCKET" "$key"
          python3 scripts/ci/upload-r2-object.py --file health/verdict.json --endpoint-url "$R2_ENDPOINT" \
            --bucket "$NIGHTLY_NEXT_R2_BUCKET" --key "$key" --content-type application/json \
            --cache-control "no-cache, no-store, must-revalidate"

      - name: Summary
        if: always()
        env:
          BUILD: ${{ steps.judge.outputs.build }}
          VERDICT: ${{ steps.judge.outputs.verdict }}
          ACTION: ${{ steps.judge.outputs.action }}
          WHY: ${{ steps.judge.outputs.why }}
          MODE: ${{ inputs.drill && 'drill' || vars.NIGHTLY_NEXT_HEALTH_GATE || 'enforce' }}
        run: |
          {
            echo "### cmux NEXT health: build ${BUILD:-unknown}"
            echo ""
            echo "Verdict: ${VERDICT:-none} ($WHY)"
            echo ""
            if [ "$ACTION" = rollback ] && [ "$MODE" = report ]; then
              echo "NIGHTLY_NEXT_HEALTH_GATE is report: the build stays on the feed."
            elif [ "$ACTION" = rollback ]; then
              echo "Job rollback pulls it from the feed."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$VERDICT" = unknown ]; then
            echo "::warning title=nightly-next health::build $BUILD has no health verdict: $WHY"
          fi

  rollback:
    needs: judge
    if: needs.judge.outputs.action == 'rollback' && (inputs.drill || vars.NIGHTLY_NEXT_HEALTH_GATE != 'report')
    # The real rollback jobs. GitHub checks a called workflow's permissions against its caller's, so
    # this grants the fix-forward's (it never runs for a drill).
    permissions:
      actions: write
      contents: read
      issues: write
    uses: ./.github/workflows/nightly-next-rollback.yml
    secrets:
      NIGHTLY_NEXT_R2_ACCESS_KEY_ID: ${{ secrets.NIGHTLY_NEXT_R2_ACCESS_KEY_ID }}
      NIGHTLY_NEXT_R2_SECRET_ACCESS_KEY: ${{ secrets.NIGHTLY_NEXT_R2_SECRET_ACCESS_KEY }}
      NIGHTLY_NEXT_R2_ACCOUNT_ID: ${{ secrets.NIGHTLY_NEXT_R2_ACCOUNT_ID }}
    with:
      reason: "health gate: ${{ needs.judge.outputs.why }} (${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
      bad_build: ${{ needs.judge.outputs.build }}
      if_newest: ${{ needs.judge.outputs.build }}
      drill: ${{ inputs.drill }}
