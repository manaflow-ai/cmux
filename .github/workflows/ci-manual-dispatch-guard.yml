name: CI manual dispatch guard

# A requested workflow_run starts from the default branch, so this watcher
# keeps its cancellation token and code outside the workflow_dispatch branch.
# CI's read-only changes guard blocks fanout while this watcher cancels the run.
on:
  workflow_run:
    workflows: [CI]
    types: [requested]
    branches: [main]

permissions: {}

env:
  # Temporary REST budget attribution: one gh-call line per GitHub API call (scripts/ci/api_call_log/env.sh, fetched at a fixed commit when the checkout has no copy).
  BASH_ENV: '$({ w="${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh"; t="${RUNNER_TEMP:-/nonexistent}/api-call-log-src"; if [ -f "$w" ]; then echo "$w"; elif [ -n "${RUNNER_TEMP:-}" ]; then if [ ! -f "$t/env.sh" ] && [ ! -e "$t.tried" ] && { [ "${RUNNER_OS:-}" = Linux ] || [ "${RUNNER_OS:-}" = macOS ]; } && [ "$(date -u +%Y%m%d%H)" -lt 2026112300 ]; then : > "$t.tried"; mkdir -p "$t.part" && for x in env.sh gh sitecustomize.py isolated.py; do curl -fsSL --max-time 5 -o "$t.part/$x" "https://raw.githubusercontent.com/manaflow-ai/cmux/27647ffd3ae838c63be28ca3e5883dcd68c34518/scripts/ci/api_call_log/$x" || break; done; [ -s "$t.part/isolated.py" ] && mv "$t.part" "$t"; fi; if [ -f "$t/env.sh" ]; then echo "$t/env.sh"; else echo unset BASH_ENV > "$t.off.sh" && echo "$t.off.sh"; fi; fi; } 2>/dev/null)'
  SOURCE_WORKFLOW_PATHS: .github/workflows/ci.yml

jobs:
  guard:
    # Manual CI dispatches are supported only from main. The event filter
    # avoids starting this watcher for requests on feature branches, while
    # the job condition keeps the source workflow identity explicit.
    if: >-
      github.event.workflow_run.path == '.github/workflows/ci.yml' &&
      github.event.workflow_run.event == 'workflow_dispatch' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || 'blacksmith-4vcpu-ubuntu-2404' }} # ephemeral-required: trusted Actions control-plane token
    timeout-minutes: 3
    permissions:
      actions: write
      contents: read
      pull-requests: read
    steps:
      - name: Check out trusted guard code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Cancel stale or duplicate manual dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_EVENT_NAME: ${{ github.event.workflow_run.event }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_REF_NAME: ${{ github.event.workflow_run.head_branch }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_COVERAGE_FINGERPRINT: ${{ github.event.workflow_run.display_title }}
          SOURCE_WORKFLOW_PATH: ${{ github.event.workflow_run.path }}
        run: python3 scripts/ci/manual_dispatch_guard.py
