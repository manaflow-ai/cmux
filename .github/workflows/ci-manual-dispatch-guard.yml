name: CI manual dispatch guard

# A requested workflow_run starts from the default branch, so this watcher
# keeps its cancellation token and code outside the workflow_dispatch branch.
# CI's read-only changes guard blocks fanout while this watcher cancels the run.
on:
  workflow_run:
    workflows: [CI]
    types: [requested]

permissions: {}

env:
  SOURCE_WORKFLOW_PATHS: .github/workflows/ci.yml

jobs:
  ignore:
    name: Ignore non-manual CI run
    # GitHub cannot filter workflow_run by the producer's event name. Keep
    # non-manual CI requests out of the skipped-run count without granting the
    # cancellation token to an unrelated request.
    if: >-
      github.event.workflow_run.path != '.github/workflows/ci.yml' ||
      github.event.workflow_run.event != 'workflow_dispatch' ||
      github.event.workflow_run.head_branch != 'main'
    runs-on: ubuntu-24.04 # github-hosted-required: trusted Actions control-plane token
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Record that this request is outside the guard scope
        run: echo "CI manual dispatch guard is limited to workflow_dispatch on main."

  guard:
    # Manual CI dispatches are supported only from main. The event filter
    # cannot filter the producer's event or branch at request time, so the
    # job condition keeps the source workflow identity and branch explicit.
    if: >-
      github.event.workflow_run.path == '.github/workflows/ci.yml' &&
      github.event.workflow_run.event == 'workflow_dispatch' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04 # github-hosted-required: trusted Actions control-plane token
    timeout-minutes: 3
    permissions:
      actions: write
      contents: read
      pull-requests: read
    steps:
      - name: Check out trusted guard code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Cancel stale or duplicate manual dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_EVENT_NAME: ${{ github.event.workflow_run.event }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_REF_NAME: ${{ github.event.workflow_run.head_branch }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_COVERAGE_FINGERPRINT: ${{ github.event.workflow_run.display_title }}
          SOURCE_WORKFLOW_PATH: ${{ github.event.workflow_run.path }}
        run: python3 scripts/ci/manual_dispatch_guard.py
