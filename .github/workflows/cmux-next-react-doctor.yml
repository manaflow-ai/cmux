name: cmux-next React Doctor

# React Doctor (https://www.react.doctor/) on cmux-next's React projects, as a
# reporting ratchet: scripts/ci/react_doctor_gate.py reports, as ::warning
# annotations and a step-summary table, each React Doctor error a change adds
# over scripts/ci/react-doctor-baseline.json. React Doctor is lint, and lint
# never stops a merge (Leo, 2026-11-20: "WHY IS LINT EVEN STOPPING SHIT INSTEAD
# OF JUST BEING OOPS"), so the step exits 0 on findings and fixes go forward;
# the projects' own type-check and build jobs fail a broken tree. The job still
# fails when its gate tests fail or setup breaks. Local run: `bun run react-doctor`
# (`--strict` for the old failing verdict).
#
# Every pull request (no paths): feat-cmux-next requires `React Doctor (changed
# React projects)`, and a required check must report. The gate scans only the
# projects the change touches; a pull request that touches none skips the job
# (fast-check-route), which reports skipped, a pass.
# Pushes to feat-cmux-next scan every project, the whole tree as it now is: base
# stays red for as long as any project is over its baseline, whatever the push
# touched. A push run that scanned only what the push changed let one red push
# (the gate's own direct push, da29cd0af55, over its branch-made baseline) be
# followed by green runs on base while every PR touching webviews failed on rows
# it never changed, and base_red_excuse.py saw a green base and excused nothing.
#
# Not the official millionco/react-doctor action: it blocks on findings that
# changed lines introduce (no per-project baseline for this monorepo), posts PR
# comments and calls the score API. This gate keeps scan data on the runner
# (--no-score, --no-supply-chain, REACT_DOCTOR_NO_TELEMETRY).
on:
  pull_request:
  push:
    branches: [feat-cmux-next]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmux-next-react-doctor-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Temporary REST budget attribution: one gh-call line per GitHub API call (scripts/ci/api_call_log/env.sh, fetched at a fixed commit when the checkout has no copy).
  BASH_ENV: '$({ w="${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh"; t="${RUNNER_TEMP:-/nonexistent}/api-call-log-src"; if [ -f "$w" ]; then echo "$w"; elif [ -n "${RUNNER_TEMP:-}" ]; then if [ ! -f "$t/env.sh" ] && [ ! -e "$t.tried" ] && { [ "${RUNNER_OS:-}" = Linux ] || [ "${RUNNER_OS:-}" = macOS ]; } && [ "$(date -u +%Y%m%d%H)" -lt 2026112300 ]; then : > "$t.tried"; mkdir -p "$t.part" && for x in env.sh gh sitecustomize.py isolated.py; do curl -fsSL --max-time 5 -o "$t.part/$x" "https://raw.githubusercontent.com/manaflow-ai/cmux/27647ffd3ae838c63be28ca3e5883dcd68c34518/scripts/ci/api_call_log/$x" || break; done; [ -s "$t.part/isolated.py" ] && mv "$t.part" "$t"; fi; if [ -f "$t/env.sh" ]; then echo "$t/env.sh"; else echo unset BASH_ENV > "$t.off.sh" && echo "$t.off.sh"; fi; fi; } 2>/dev/null)'

jobs:
  # Whether this pull request touches an input of React Doctor (scripts/ci/fast-check-inputs.json: the React projects
  # and the gate's own files). A pull request that touches none skips the gate job before it takes a Blacksmith
  # runner; the skipped job reports skipped, which the required check reads as passed. The feat-cmux-next push scans
  # every project, so a miss is a fix-forward on base. A push or a dispatch skips this job, and the gate runs.
  fast-check-route:
    name: fast check route
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-2vcpu-ubuntu-2404' || fromJSON(vars.RUNNER_POOLS).linux_2 }}
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      react_doctor: ${{ steps.route.outputs.react_doctor }}
    steps:
      - name: Checkout the merge commit's router (trees only)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 2
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/ci/
      # A router failure leaves the output empty, and the gate runs.
      - name: Route the pull request (scripts/ci/fast_check_route.py)
        id: route
        continue-on-error: true
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: python3 scripts/ci/fast_check_route.py route --workflow .github/workflows/cmux-next-react-doctor.yml --labels "$LABELS"

  react-doctor:
    name: React Doctor (changed React projects)
    needs: fast-check-route
    # Tier B of the merged pull request replay (scripts/ci/affected-jobs.json pull_request_skip): a pull request
    # into feat-cmux-next skips it unless labeled full-ci; the feat-cmux-next push runs it, and its few misses are fixed forward.
    if: ${{ !cancelled() && needs.fast-check-route.outputs.react_doctor != 'false' && (github.event_name != 'pull_request' || github.event.pull_request.base.ref != 'feat-cmux-next' || contains(github.event.pull_request.labels.*.name, 'full-ci')) }}
    # Blacksmith, never GitHub-hosted; fork pull requests get a fixed Blacksmith label.
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-4vcpu-ubuntu-2404' || fromJSON(vars.RUNNER_POOLS).linux_4 }}
    timeout-minutes: 30
    env:
      REACT_DOCTOR_NO_TELEMETRY: "1"
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      # A pull request checks out its merge commit; HEAD^1 is the base it merges into.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Gate tests
        run: python3 tests/test_react_doctor_gate.py

      # A pull request scans what it changes; a push or a dispatch scans every project (see the top).
      - name: Pick the base
        id: base
        run: |
          set -euo pipefail
          base=""
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            base="$(git rev-parse HEAD^1)"
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          if [ -n "$base" ]; then
            projects="$(git diff --name-only "$base" HEAD | python3 -c 'import sys; sys.path.insert(0, "scripts/ci"); import react_doctor_gate as g; print(" ".join(g.select_projects(sys.stdin.read().split())))')"
          else
            echo "::notice title=React Doctor::$GITHUB_EVENT_NAME: scanning every project"
            projects="all"
          fi
          echo "projects=$projects" >> "$GITHUB_OUTPUT"
          echo "projects: ${projects:-none}"

      # Content-addressed result, in shadow (scripts/ci/receipt_input_key.py; cmuxterm-hq RFD 0016 "Borg without
      # Bazel"): the input key hashes what the scan reads for the selected projects. A green run records its
      # unsigned ci-receipt/v1 under that key; a later run with the same key reports would_skip=true and still runs
      # in full. Nothing is skipped until the controller signs receipts (RFD 0019). The cache entry is a shadow
      # measurement, never skip evidence.
      - name: Input key (shadow receipt)
        id: key
        if: steps.base.outputs.projects != ''
        continue-on-error: true
        env:
          PROJECTS: ${{ steps.base.outputs.projects }}
          BASE: ${{ steps.base.outputs.base }}
        run: python3 scripts/ci/receipt_input_key.py key react-doctor --units "$PROJECTS" --base "$BASE" --output "$GITHUB_OUTPUT"

      - name: Look up a receipt (shadow)
        id: receipt
        if: steps.key.outputs.input_key != ''
        continue-on-error: true
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/ci-receipt
          key: ci-receipt-v1-react-doctor-${{ steps.key.outputs.input_key }}
          lookup-only: true

      - name: Would skip (shadow)
        if: steps.key.outputs.input_key != ''
        continue-on-error: true
        env:
          INPUT_KEY: ${{ steps.key.outputs.input_key }}
          # A change to a pinned file (the gate's own scripts, tool or workflow; a check-paths.txt line) never skips.
          HIT: ${{ steps.receipt.outputs.cache-hit == 'true' && steps.key.outputs.pinned != 'true' }}
          PINNED: ${{ steps.key.outputs.pinned }}
        run: |
          echo "::notice title=ci-receipt shadow::react-doctor would_skip=$HIT pinned=$PINNED input_key=$INPUT_KEY"
          echo "ci-receipt shadow: react-doctor would_skip=$HIT pinned=$PINNED input_key=$INPUT_KEY" >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Bun
        if: steps.base.outputs.projects != ''
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
          no-cache: ${{ !startsWith(github.workspace, '/home/runner/work/') }}

      - name: Setup Node
        if: steps.base.outputs.projects != ''
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.22.1"

      - name: Cache Bun package cache
        if: steps.base.outputs.projects != ''
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.bun/install/cache
          key: bun-react-doctor-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/react-doctor/bun.lock', 'webviews/bun.lock', 'web/bun.lock', 'agent-chat/bun.lock', 'backend/bun.lock') }}
          restore-keys: bun-react-doctor-${{ runner.os }}-${{ runner.arch }}-

      - name: React Doctor gate
        env:
          BASE: ${{ steps.base.outputs.base }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/react-doctor"
          if [ -n "$BASE" ]; then
            python3 scripts/ci/react_doctor_gate.py --changed-from "$BASE" --out-dir "$RUNNER_TEMP/react-doctor"
          else
            python3 scripts/ci/react_doctor_gate.py --out-dir "$RUNNER_TEMP/react-doctor"
          fi

      - name: Record the receipt (shadow)
        if: success() && steps.key.outputs.input_key != '' && steps.receipt.outputs.cache-hit != 'true'
        continue-on-error: true
        env:
          INPUT_KEY: ${{ steps.key.outputs.input_key }}
          BASE: ${{ steps.base.outputs.base }}
        run: python3 scripts/ci/receipt_input_key.py record react-doctor --input-key "$INPUT_KEY" --base "$BASE" --out "$RUNNER_TEMP/ci-receipt/receipt.json"

      # Saved from feat-cmux-next pushes only: GitHub scopes a pull request's cache entries to that pull request,
      # so a PR's save is read by nothing else (tests/test_ci_no_run_scoped_cache_keys.py). PRs restore it.
      - name: Save the receipt (shadow)
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/feat-cmux-next' && steps.key.outputs.input_key != '' && steps.receipt.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/ci-receipt
          key: ci-receipt-v1-react-doctor-${{ steps.key.outputs.input_key }}

      - name: Upload reports
        if: always() && steps.base.outputs.projects != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: react-doctor-reports
          path: ${{ runner.temp }}/react-doctor
          retention-days: 3
          if-no-files-found: ignore
