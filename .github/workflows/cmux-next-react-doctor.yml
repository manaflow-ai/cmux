name: cmux-next React Doctor
on:
  pull_request:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ${{ fromJSON(vars.RUNNER_POOLS).linux_4 }}
    timeout-minutes: 30
    env:
      REACT_DOCTOR_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.22.1"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
      - name: Probe
        run: |
          set -x
          mkdir -p /tmp/rd /tmp/rdtool
          (cd /tmp/rdtool && echo '{"private":true}' > package.json && bun add --exact react-doctor@0.9.22 >/dev/null)
          RD=/tmp/rdtool/node_modules/.bin/react-doctor
          for p in webviews agent-chat backend web cmux-tui/frontends/web; do
            n=$(echo $p | tr / _)
            if [ -f $p/bun.lock ]; then (cd $p && bun install --frozen-lockfile --ignore-scripts >/dev/null 2>&1) || echo "install failed $p"; else (cd $p && npm ci --ignore-scripts >/dev/null 2>&1) || echo "install failed $p"; fi
            start=$(date +%s)
            (cd $p && timeout 900 $RD . -y --no-score --no-supply-chain --blocking none --json --json-out /tmp/rd/$n.json > /tmp/rd/$n.stdout 2>/tmp/rd/$n.stderr; echo "exit $?") || true
            echo "secs $(( $(date +%s) - start ))"
            head -c 1500 /tmp/rd/$n.stderr || true
            python3 -c "import json,sys;d=json.load(open('/tmp/rd/$n.json'));print(list(d.keys()));print(json.dumps({k:v for k,v in d.items() if k!='diagnostics'})[:3000]);ds=d.get('diagnostics',[]);print(len(ds));print(json.dumps(ds[:2])[:2000])" || head -c 2000 /tmp/rd/$n.stdout || true
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: rd-probe
          path: /tmp/rd
