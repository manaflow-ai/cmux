name: Deploy docs channels

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "CHANGELOG.md"
      # Standalone lint policy is not an input to the docs build.
      - "!web/scripts/check-complexity.mjs"
      - "!web/oxlint-complexity-baseline.txt"
      - "!web/.oxlintrc.json"
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # A deploy of classic web/ from main ships only past the classic deploy guard (Leo's label or a teammate's PR).
  guard:
    if: github.ref == 'refs/heads/main'
    permissions:
      actions: read
      contents: read
      pull-requests: read
    uses: ./.github/workflows/classic-deploy-guard.yml
    with:
      role: docs

  nightly:
    if: github.ref == 'refs/heads/main'
    needs: guard
    uses: ./.github/workflows/docs-deploy-reusable.yml
    with:
      channel: nightly
    secrets:
      vercel_org_id: ${{ secrets.VERCEL_ORG_ID }}
      vercel_project_id: ${{ secrets.VERCEL_NIGHTLY_DOCS_PROJECT_ID }}
      vercel_token: ${{ secrets.VERCEL_TOKEN }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/docs-deploy-reusable.yml
    with:
      channel: release
    secrets:
      vercel_org_id: ${{ secrets.VERCEL_ORG_ID }}
      vercel_project_id: ${{ secrets.VERCEL_RELEASE_DOCS_PROJECT_ID }}
      vercel_token: ${{ secrets.VERCEL_TOKEN }}
