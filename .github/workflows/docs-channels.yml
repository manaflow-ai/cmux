name: Deploy docs channels

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "CHANGELOG.md"
      # Standalone lint policy is not an input to the docs build.
      - "!web/scripts/check-complexity.mjs"
      - "!web/oxlint-complexity-baseline.txt"
      - "!web/.oxlintrc.json"
    tags: ["v*"]

permissions:
  contents: read

jobs:
  nightly:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/docs-deploy-reusable.yml
    with:
      channel: nightly

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/docs-deploy-reusable.yml
    with:
      channel: release
