name: cmux-next sidebar bench

# Leo 2026-11-27: "so i guess our other benches hadn't reached that? hm. did we map out all the benches of
# everything else too?" Lawrence's NIGHTLY beachballed 2-6 s with 1104 Chief-started chats and a ~160 KB
# cmux.json, and no sidebar bench had Chiefs or a big settings file. A pull request into feat-cmux-next that
# touches the sidebar, a Chief or the Home rules (scripts/ci/pr_router.json `paths`) runs the sidebar benches
# with Chiefs on a fleet Mac and fails when one misses its budget:
#   SidebarChiefLagTests       SidebarLagBench ticks and SidebarScrollBench with SidebarChiefFixture (1104 rows,
#                              5 Chiefs owning every chat, a ~160 KB settings file), before and after lines
#   ChiefFaceFlushBenchTests   one full sidebar flush at that scale (run once its file is on the head)
# The benches take seconds; the fleet build of CmuxNext is most of the job.
#
# The Mac run is a fleet step submitted from a Linux runner by the cmux-ci client (as cmux-next-fast-tier-batch.yml
# swift-fleet does; tests/test_ci_gateway_jobs_on_linux.py). No client, a queue that never started the step, or no
# record of it is no verdict: a warning, not a red.
on:
  # Started only by pr-router.yml (one router per push, RFD 0023).
  workflow_call:
  workflow_dispatch:

permissions: {}

concurrency:
  group: cmux-next-sidebar-bench-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    name: sidebar benches with Chiefs (build fleet)
    if: ${{ github.repository == 'manaflow-ai/cmux' }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || 'cmux-linux' }}
    permissions:
      contents: read
    # The client's queue wait (20 min) and run limit (25 min), and the report.
    timeout-minutes: 50
    steps:
      - name: Checkout the bench list
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        timeout-minutes: 5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          submodules: false
          fetch-depth: 1
          sparse-checkout: |
            .github/actions/fleet-client
            Packages/macOS/CmuxNext/Tests/CmuxNextAppTests/SidebarChiefLagTests.swift
            Packages/macOS/CmuxNext/Tests/CmuxNextAppTests/ChiefFaceFlushBenchTests.swift
          sparse-checkout-cone-mode: false

      - uses: ./.github/actions/fleet-client
        with:
          controller: ${{ vars.CMUX_FLEET_CONTROLLER }}

      - name: Run the sidebar benches on the build fleet
        env:
          REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -uo pipefail
          if ! [[ "$REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::the commit to test is not a full sha ('$REF')"
            exit 1
          fi
          client="${CMUX_CI_CLIENT:-$HOME/.local/bin/cmux-ci}"
          if ! [[ -x "$client" ]]; then
            echo "::warning title=Sidebar bench: no verdict::$client is not installed on runner $RUNNER_NAME"
            exit 0
          fi
          # A filter that runs no test fails the lane, so a bench whose file is not on the head is left out.
          suites=()
          tests=Packages/macOS/CmuxNext/Tests/CmuxNextAppTests
          for suite in SidebarChiefLagTests ChiefFaceFlushBenchTests; do
            if [[ -f "$tests/$suite.swift" ]]; then suites+=("$suite"); else echo "$suite is not on $REF: skipped"; fi
          done
          if [[ ${#suites[@]} -eq 0 ]]; then echo "no sidebar bench on $REF"; exit 0; fi
          filter="$(IFS=,; echo "${suites[*]}")"
          status=0
          "$client" run --class light --script scripts/ci/package-test-lane.sh --ref "$REF" \
            --arg=suite --arg=Packages/macOS/CmuxNext --arg="$filter" --no-supersede \
            --env=CMUX_SWIFT_PACKAGE_TEST_TIMEOUT_SECONDS=600 \
            --timeout 1500 --queue-timeout 1200 > "$RUNNER_TEMP/sidebar-bench.log" 2>&1 || status=$?
          step_re='^cmux-ci: step ([0-9a-f]{6,64}) '
          state_re='"state": *"([a-z_]*)"'
          code_re='"exit_code": *(-?[0-9]+)'
          id="" state="" code=""
          while IFS= read -r line || [[ -n "$line" ]]; do
            printf '%s\n' "$line"
            if [[ -z "$id" && "$line" =~ $step_re ]]; then id="${BASH_REMATCH[1]}"; fi
            if [[ "$line" == *SIDEBAR-CHIEF-* ]]; then printf '    %s\n' "${line#*SIDEBAR-}" >> "$GITHUB_STEP_SUMMARY"; fi
          done < "$RUNNER_TEMP/sidebar-bench.log"
          if [[ -n "$id" ]] && json="$("$client" status "$id" 2>&1)"; then
            if [[ "$json" =~ $state_re ]]; then state="${BASH_REMATCH[1]}"; fi
            if [[ "$json" =~ $code_re ]]; then code="${BASH_REMATCH[1]}"; fi
          fi
          if [[ "$status" == 0 && "$state" == "done" && "$code" == 0 ]]; then
            echo "$filter passed at $REF (step $id)" | tee -a "$GITHUB_STEP_SUMMARY"
          elif [[ ( "$state" == failed || "$state" == "done" ) && "$code" =~ ^-?[0-9]+$ && "$code" -ne 0 ]]; then
            echo "::error title=Sidebar bench::$filter: a bench missed its budget or did not build at $REF (step $id, exit $code)"
            exit 1
          else
            echo "::warning title=Sidebar bench: no verdict::no verdict (client exit $status, step ${id:-none} ${state:-unknown})"
          fi
