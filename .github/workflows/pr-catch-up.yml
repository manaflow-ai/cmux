name: PR catch-up

# RFC #14631, slice 1. Brings a pull request up to date with its base branch:
# merges the base into the head (never a rebase or force-push), resolves the
# generated-file conflicts with their generators, pushes, and comments.
#
# Ask for it with the `catch-up` label or a `/catch-up` comment. Only people
# with write, maintain or admin permission on this repository can start it.
# The permission API decides; author_association is not used, because private
# org members show up as CONTRIBUTOR or NONE there.
#
# Trust: both triggers run this file from the base branch with a write token,
# so the pull request's bytes are data only. Its head is checked out without
# credentials into `candidate/`, and everything that runs (catch_up_pr.py,
# normalize-pbxproj.py, generate-cmux-config-schema.py, merge-xcstrings.py)
# comes from `trusted/`, the commit this workflow was loaded from. Nothing
# from the head is executed, sourced or installed, and no event text is
# expanded inside a shell; it reaches steps through env only. The merge reads
# .gitattributes from the base commit, and resolvers refuse symlinks.
#
# Pushes use the GLAEDA route App token (contents and workflows write), so the
# new head starts CI like any push and a merge that brings in workflow changes
# is accepted. Without the App the job falls back to the Actions token, whose
# pushes do not start workflows; the comment says so. Fork heads are pushed only
# when the author allows edits by maintainers, and only with the App token.
# The push is a compare-and-swap against the head that was merged
# (--force-with-lease on that exact sha, of a commit that descends from it):
# it cannot drop commits, and it is refused if the branch moved meanwhile.
on:
  pull_request_target:
    types: [labeled]
  issue_comment:
    types: [created]

permissions: {}

jobs:
  catch-up:
    name: PR catch-up
    if: >-
      (
        github.event_name == 'pull_request_target' &&
        github.event.label.name == 'catch-up'
      ) || (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        github.event.comment.user.type == 'User' &&
        startsWith(github.event.comment.body, '/catch-up')
      )
    # Untrusted pull request bytes sit next to a write token here: keep them
    # on an ephemeral GitHub-hosted runner, never a variable-selected host.
    runs-on: ubuntu-24.04 # github-hosted-required: untrusted pull request bytes beside a write token
    timeout-minutes: 20
    # One catch-up per pull request at a time. Job level, so unrelated label
    # and comment events (skipped jobs) never replace a pending run.
    concurrency:
      group: pr-catch-up-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      # The fallback push when the App token is unavailable.
      contents: write
      # The result comment, the label removal and the reaction.
      issues: write
      pull-requests: write
    env:
      PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
      ACTOR: ${{ github.event.sender.login }}
      TRUSTED_SHA: ${{ github.sha }}
      TRUSTED: ${{ github.workspace }}/trusted
      CANDIDATE: ${{ github.workspace }}/candidate
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Check who asked
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          set -euo pipefail
          echo "allowed=false" >> "$GITHUB_OUTPUT"
          if [[ ! "$ACTOR" =~ ^[A-Za-z0-9-]+$ ]]; then
            echo "::notice::Catch-up is for people, not $ACTOR."
            exit 0
          fi
          if [[ "$EVENT_NAME" == issue_comment ]]; then
            # The whole comment must be the command; GitHub may append CRLF.
            body="${COMMENT_BODY//$'\r'/}"
            body="${body%"${body##*[![:space:]]}"}"
            if [[ "$body" != "/catch-up" ]]; then
              echo "Comment is not exactly /catch-up; nothing to do."
              exit 0
            fi
          fi
          role="$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$ACTOR/permission" --jq '.role_name' || true)"
          case "$role" in
            admin|maintain|write) ;;
            *)
              echo "::notice::$ACTOR has '${role:-no}' permission; catch-up needs write."
              exit 0
              ;;
          esac
          if [[ "$EVENT_NAME" == issue_comment ]]; then
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID/reactions" \
              -f content=rocket > /dev/null || true
          fi
          echo "allowed=true" >> "$GITHUB_OUTPUT"

      - name: Read the pull request
        id: pr
        if: steps.gate.outputs.allowed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The GraphQL variables are literal; gh substitutes them, not the shell.
          # shellcheck disable=SC2016
          gh api graphql -F number="$PR_NUMBER" -f owner="${GITHUB_REPOSITORY%%/*}" -f name="${GITHUB_REPOSITORY#*/}" \
            -f query='query($owner: String!, $name: String!, $number: Int!) {
              repository(owner: $owner, name: $name) {
                defaultBranchRef { name }
                pullRequest(number: $number) {
                  state headRefName headRefOid baseRefName
                  isCrossRepository maintainerCanModify
                  headRepository { nameWithOwner }
                  headRef { branchProtectionRule { id } }
                }
              }
            }' --jq '.data.repository.pullRequest + {defaultBranch: .data.repository.defaultBranchRef.name}' > "$RUNNER_TEMP/pr.json"
          state="$(jq -r '.state' "$RUNNER_TEMP/pr.json")"
          head_ref="$(jq -r '.headRefName' "$RUNNER_TEMP/pr.json")"
          head_sha="$(jq -r '.headRefOid' "$RUNNER_TEMP/pr.json")"
          base_ref="$(jq -r '.baseRefName' "$RUNNER_TEMP/pr.json")"
          head_repo="$(jq -r '.headRepository.nameWithOwner // ""' "$RUNNER_TEMP/pr.json")"
          cross="$(jq -r '.isCrossRepository' "$RUNNER_TEMP/pr.json")"
          editable="$(jq -r '.maintainerCanModify' "$RUNNER_TEMP/pr.json")"
          default_branch="$(jq -r '.defaultBranch' "$RUNNER_TEMP/pr.json")"
          protected="$(jq -r '.headRef.branchProtectionRule != null' "$RUNNER_TEMP/pr.json")"
          if [[ "$state" != OPEN ]]; then
            echo "::notice::#$PR_NUMBER is $state; nothing to catch up."
            exit 0
          fi
          refuse() {
            echo "::notice::$1"
            printf '%s\n' "$1" > "$RUNNER_TEMP/comment.md"
            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/comment.md"
            exit 0
          }
          if [[ -z "$head_repo" ]]; then
            refuse "The branch behind this pull request is gone (its fork was deleted), so there is nothing I can catch up."
          fi
          # Never merge into, or push to, a shared branch of this repository.
          if [[ "$cross" != true && ( "$head_ref" == "$default_branch" || "$protected" == true ) ]]; then
            refuse "This pull request comes from a protected branch of this repository, so catch-up leaves it alone. Merge the base by hand if you really mean it."
          fi
          # Branch and repository names come from the pull request author.
          # Refuse anything that is not a plain ref, sha or owner/name.
          git check-ref-format --branch "$head_ref" > /dev/null
          git check-ref-format --branch "$base_ref" > /dev/null
          [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$head_repo" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          pushable=true
          if [[ "$cross" == true && "$editable" != true ]]; then
            pushable=false
          fi
          {
            echo "head_ref=$head_ref"
            echo "head_sha=$head_sha"
            echo "base_ref=$base_ref"
            echo "head_repo=$head_repo"
            echo "pushable=$pushable"
          } >> "$GITHUB_OUTPUT"

      - name: Check out the trusted tools
        if: steps.pr.outputs.head_sha != ''
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: trusted
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      # Data only. The head commit is reachable from this repository through
      # refs/pull/N/head, fork or not, and the full history (without blobs,
      # which the merge fetches on demand) supplies the base branch and the
      # merge base.
      - name: Check out the pull request head as data
        if: steps.pr.outputs.head_sha != ''
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ github.repository }}
          ref: ${{ steps.pr.outputs.head_sha }}
          path: candidate
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
          submodules: false

      - name: Merge the base with the trusted tools
        id: merge
        if: steps.pr.outputs.head_sha != ''
        env:
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          BASE_REF: ${{ steps.pr.outputs.base_ref }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          [[ "$(git -C "$TRUSTED" rev-parse HEAD)" == "$TRUSTED_SHA" ]]
          [[ "$(git -C "$CANDIDATE" rev-parse HEAD)" == "$HEAD_SHA" ]]
          git -C "$CANDIDATE" rev-parse --verify --quiet "refs/remotes/origin/$BASE_REF^{commit}" > /dev/null
          code=0
          python3 -I "$TRUSTED/scripts/ci/catch_up_pr.py" merge \
            --repo "$CANDIDATE" --tools-root "$TRUSTED" --base "origin/$BASE_REF" --json \
            --note "Requested by $ACTOR on pull request #$PR_NUMBER." > "$RUNNER_TEMP/catch-up.json" || code=$?
          cat "$RUNNER_TEMP/catch-up.json"
          status="$(jq -r '.status' "$RUNNER_TEMP/catch-up.json")"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          {
            echo "### PR catch-up: $status"
            jq -r '(.resolved[] | "- resolved `\(.path)`: \(.method)"), (.blocking[] | "- blocking `\(.path)`: \(.reason)")' "$RUNNER_TEMP/catch-up.json"
          } >> "$GITHUB_STEP_SUMMARY"
          # Blocked (1) is an answer, not a failure; the comment carries it.
          if [[ "$code" -ne 0 && "$code" -ne 1 ]]; then
            exit "$code"
          fi

      - name: Mint the push token
        id: app-token
        if: steps.merge.outputs.status == 'merged' && steps.pr.outputs.pushable == 'true' && vars.GLAEDA_ROUTE_APP_ID != ''
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.GLAEDA_ROUTE_APP_ID }}
          private-key: ${{ secrets.GLAEDA_ROUTE_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-workflows: write

      - name: Push the merge to the pull request branch
        id: push
        if: steps.merge.outputs.status == 'merged' && steps.pr.outputs.pushable == 'true'
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          ACTIONS_TOKEN: ${{ github.token }}
          HEAD_REPO: ${{ steps.pr.outputs.head_repo }}
          HEAD_REF: ${{ steps.pr.outputs.head_ref }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          set -euo pipefail
          outcome=pushed
          token="$APP_TOKEN"
          if [[ -z "$token" ]]; then
            if [[ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]]; then
              # The Actions token cannot write to a fork.
              echo "outcome=push-denied" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            outcome=pushed-without-ci
            token="$ACTIONS_TOKEN"
          fi
          auth="$(printf 'x-access-token:%s' "$token" | base64 -w0)"
          echo "::add-mask::$auth"
          merged="$(git -C "$CANDIDATE" rev-parse HEAD)"
          # Compare-and-swap: the remote branch must still be the head that
          # was merged, and the new commit descends from it.
          if GIT_CONFIG_COUNT=1 \
             GIT_CONFIG_KEY_0="http.https://github.com/.extraheader" \
             GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" \
             git -C "$CANDIDATE" push --no-verify --porcelain \
               --force-with-lease="refs/heads/$HEAD_REF:$HEAD_SHA" \
               "https://github.com/$HEAD_REPO.git" "$merged:refs/heads/$HEAD_REF" \
               > "$RUNNER_TEMP/push.log" 2>&1; then
            echo "Pushed $merged to $HEAD_REPO:$HEAD_REF ($outcome)."
          else
            cat "$RUNNER_TEMP/push.log"
            if grep -qiE 'stale info|non-fast-forward|fetch first' "$RUNNER_TEMP/push.log"; then
              outcome=rejected
            elif grep -qi 'workflow' "$RUNNER_TEMP/push.log"; then
              outcome=needs-workflows
            else
              outcome=push-denied
            fi
          fi
          echo "outcome=$outcome" >> "$GITHUB_OUTPUT"

      - name: Comment the result
        if: always() && steps.pr.outputs.head_sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_STATUS: ${{ steps.merge.outputs.status }}
          PUSHABLE: ${{ steps.pr.outputs.pushable }}
          PUSH_OUTCOME: ${{ steps.push.outputs.outcome }}
          BASE_REF: ${{ steps.pr.outputs.base_ref }}
          HEAD_REF: ${{ steps.pr.outputs.head_ref }}
        run: |
          set -euo pipefail
          push="${PUSH_OUTCOME:-not-attempted}"
          if [[ "$MERGE_STATUS" == merged && "$PUSHABLE" != true ]]; then
            push=fork-not-editable
          elif [[ "$MERGE_STATUS" == merged && "$push" == not-attempted ]]; then
            push=push-denied
          fi
          python3 -I "$TRUSTED/scripts/ci/catch_up_pr.py" comment --result "$RUNNER_TEMP/catch-up.json" --push "$push" \
            --base-name "$BASE_REF" --head-name "$HEAD_REF" --run-url "$RUN_URL" > "$RUNNER_TEMP/comment.md"
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/comment.md"

      # The label is a one-shot request: drop it whatever happened, so adding
      # it again asks again. A 404 means it was not there.
      - name: Remove the catch-up label
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels/catch-up" > /dev/null 2>&1 || true
