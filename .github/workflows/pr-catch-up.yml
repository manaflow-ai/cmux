name: PR catch-up

# RFC #14631, slice 1. Brings a pull request up to date with its base branch:
# merges the base into the head (never a rebase), resolves the generated-file
# conflicts with their generators, pushes, and comments.
#
# It runs on its own when a push to main passes CI fast guards (main just went
# green at a new commit): scripts/ci/auto_catch_up_select.py picks the open
# pull requests against main whose head is an unprotected branch here, not a
# draft, not labeled `no-auto-catch-up`, quiet for 30 minutes, and either
# conflicting with main or red only because of main (the CI fast guards
# comment about the current head from guard_attribution.py marks a step "red
# on main too") while missing the green commit. At most CMUX_AUTO_CATCH_UP_MAX
# (default 15) per run, most recently pushed first. It comments only when it
# pushed or when a person must act on that head (a conflict outside the
# generated files, a refused push), once per head and without mentions; an
# up-to-date branch, an error, a head that moved or a refused merge stay
# silent, and the selector's ledger artifact stops it from selecting one head
# more than twice. The trigger is main's own push run, so there is no
# requester to check. It needs the route App: without its key it selects
# nothing, and without a token it does not push, since a push with the Actions
# token would leave the pull request with no checks.
#
# Ask for it by hand with the `catch-up` label or a `/catch-up` comment,
# optionally `/catch-up <full 40-hex sha>` to pin the head you looked at. Only
# people with write, maintain or admin permission on this repository can start
# it. The permission API decides; author_association is not used, because
# private org members show up as CONTRIBUTOR or NONE there.
#
# Version 1 supports head branches in this repository only. Anyone who can
# push there already has write access, so the head at request time is the
# head a writer vouches for. Fork heads are refused with a comment; fork
# support needs positive evidence that a maintainer approved the head.
#
# Four jobs, so the untrusted bytes never share a job with a write token. merge
# and finish run once per pull request, as a matrix of the selected ones (one
# entry for a request by hand), and hand over through a per-PR artifact
# because a matrix job has one set of outputs:
#
# - gate: who asked, and whether the head is a branch of this repository,
#   with a read-only token. No concurrency group, so comments from anyone
#   cannot cancel a writer's pending run.
# - select (automatic path): the selection above, read-only, from trusted/.
#   Each entry pins the head it judged; merge refuses a head that moved since,
#   and finish refuses a result for another head. It also keeps the attempt
#   ledger artifact, which counts selections per head.
# - merge: read-only token. Checks the head out as data (no credentials, no
#   submodules, no LFS) into `candidate/` and runs catch_up_pr.py and the
#   generators it calls (normalize-pbxproj.py, generate-cmux-config-schema.py,
#   merge-xcstrings.py) from `trusted/`, the commit this workflow was loaded
#   from. Nothing from the head is executed, sourced or installed, the merge
#   reads .gitattributes from the base commit, and resolvers refuse symlinks.
#   The merge commit leaves as a git bundle.
# - finish: write token. Trusts nothing from the merge job: it re-reads the
#   pull request, fetches both parents itself, and pushes only a commit whose
#   parents are the head and a base on the base branch and whose tree differs
#   from git's own merge of those parents only in the generated files
#   (catch_up_pr.py verify). Then it comments and removes the label.
#
# Pushes use the GLAEDA route App token (contents and workflows write), so the
# new head starts CI like any push and a merge that brings in workflow changes
# is accepted. Without the App a request by hand falls back to the Actions
# token, whose pushes do not start workflows, and the comment says so; the
# automatic path does not push at all. The push is a
# compare-and-swap (--force-with-lease on the exact head that was merged, of a
# commit that descends from it): it cannot drop commits, and it is refused if
# the branch moved meanwhile.
#
# Concurrency: never cancelled in progress, so a newer main run cannot stop a
# push. A request by hand and the automatic path use separate groups per pull
# request (pr-catch-up-merge-N and pr-catch-up-push-N, pr-catch-up-auto-merge-N
# and pr-catch-up-auto-push-N), because GitHub keeps one pending job per group
# and a newer one replaces it: an automatic run must never drop a writer's
# pending request. Two runs on one pull request cannot both land a push, since
# each push is a compare-and-swap on the head it merged.
on:
  pull_request_target:
    types: [labeled]
  issue_comment:
    types: [created]
  workflow_run:
    workflows: ["CI fast guards"]
    types: [completed]
    # Pull request runs would start a run whose jobs all skip.
    branches: [main]

permissions: {}

env:
  PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
  # The automatic path's attempt ledger (auto_catch_up_select.py).
  LEDGER_ARTIFACT: pr-catch-up-auto-ledger
  # The file behind the workflow_run trigger's display name
  # (tests/test_ci_workflow_run_sources.py).
  SOURCE_WORKFLOW_PATHS: .github/workflows/ci-fast-guards.yml

jobs:
  gate:
    name: PR catch-up gate
    if: >-
      (
        github.event_name == 'pull_request_target' &&
        github.event.label.name == 'catch-up'
      ) || (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        github.event.comment.user.type == 'User' &&
        startsWith(github.event.comment.body, '/catch-up')
      )
    runs-on: ubuntu-24.04 # github-hosted-required: control plane for a write-token workflow
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      allowed: ${{ steps.gate.outputs.allowed }}
      refusal: ${{ steps.gate.outputs.refusal }}
      # The one pull request this request is about, in the select job's shape.
      # The pin is empty or 40 hex characters (checked below).
      matrix: ${{ format('{{"include":[{{"pr":{0},"pin":"{1}","why":"request"}}]}}', github.event.pull_request.number || github.event.issue.number, steps.gate.outputs.pin) }}
    steps:
      - name: Check who asked, and for which branch
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.event.sender.login }}
          EVENT_NAME: ${{ github.event_name }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          echo "allowed=false" >> "$GITHUB_OUTPUT"
          if [[ ! "$ACTOR" =~ ^[A-Za-z0-9-]+$ ]]; then
            echo "::notice::Catch-up is for people, not $ACTOR."
            exit 0
          fi
          pin=""
          if [[ "$EVENT_NAME" == issue_comment ]]; then
            # The whole comment must be the command; GitHub may append CRLF.
            body="${COMMENT_BODY//$'\r'/}"
            body="${body%"${body##*[![:space:]]}"}"
            if [[ "$body" =~ ^/catch-up([[:space:]]+([0-9a-f]{40}))?$ ]]; then
              pin="${BASH_REMATCH[2]}"
            else
              echo "Comment is not /catch-up [full sha]; nothing to do."
              exit 0
            fi
          fi
          role="$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$ACTOR/permission" --jq '.role_name' || true)"
          case "$role" in
            admin|maintain|write) ;;
            *)
              echo "::notice::$ACTOR has '${role:-no}' permission; catch-up needs write."
              exit 0
              ;;
          esac
          # The GraphQL variables are literal; gh substitutes them, not the shell.
          # shellcheck disable=SC2016
          cross="$(gh api graphql -F number="$PR_NUMBER" -f owner="${GITHUB_REPOSITORY%%/*}" -f name="${GITHUB_REPOSITORY#*/}" \
            -f query='query($owner: String!, $name: String!, $number: Int!) {
              repository(owner: $owner, name: $name) { pullRequest(number: $number) { isCrossRepository } }
            }' --jq '.data.repository.pullRequest.isCrossRepository')"
          if [[ "$cross" != false ]]; then
            echo "refusal=Catch-up only runs on branches in this repository for now, so I left this one alone. A maintainer can merge main in by hand." >> "$GITHUB_OUTPUT"
          fi
          echo "pin=$pin" >> "$GITHUB_OUTPUT"
          echo "allowed=true" >> "$GITHUB_OUTPUT"

  select:
    name: PR catch-up selection
    # Main's own push run went green: the trigger is trusted, so no requester
    # is checked. Without the route App nothing could be pushed with checks,
    # so nothing is selected.
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.path == '.github/workflows/ci-fast-guards.yml' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      vars.GLAEDA_ROUTE_APP_ID != ''
    runs-on: ubuntu-24.04 # github-hosted-required: control plane for a write-token workflow
    timeout-minutes: 10
    # One selection at a time; a burst of main runs keeps the newest pending.
    concurrency:
      group: pr-catch-up-select
      cancel-in-progress: false
    permissions:
      # actions: read finds the previous run's ledger artifact.
      actions: read
      contents: read
      issues: read
      pull-requests: read
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      count: ${{ steps.select.outputs.count }}
    steps:
      - name: Check out the trusted tools
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: trusted
          fetch-depth: 1
          persist-credentials: false
          submodules: false
          lfs: false

      # The newest ledger any run on main left. A missing or unreadable one
      # starts empty: every head then gets its attempts again, nothing worse.
      - name: Read the previous attempt ledger
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ledger"
          id="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$LEDGER_ARTIFACT&per_page=20" \
            --jq '[.artifacts[] | select(.expired | not) | select(.workflow_run.head_branch == "main")] | max_by(.created_at) | .id // empty' || true)"
          if [[ "$id" =~ ^[0-9]+$ ]] &&
             gh api --method GET "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "$RUNNER_TEMP/ledger/previous.zip" &&
             unzip -p "$RUNNER_TEMP/ledger/previous.zip" ledger.json > "$RUNNER_TEMP/ledger/previous.json"; then
            echo "Read ledger artifact $id."
          else
            rm -f "$RUNNER_TEMP/ledger/previous.json"
            echo "No previous ledger; starting a new one."
          fi

      - name: Pick the pull requests to catch up
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          TRUSTED: ${{ github.workspace }}/trusted
          MAX: ${{ vars.CMUX_AUTO_CATCH_UP_MAX }}
          GREEN_SHA: ${{ github.event.workflow_run.head_sha }}
          # The App id is a variable, its key a secret; secrets cannot gate a
          # job, so a missing key is caught here and nothing is selected.
          HAS_APP_KEY: ${{ secrets.GLAEDA_ROUTE_APP_KEY != '' }}
        run: |
          set -euo pipefail
          if [[ "$HAS_APP_KEY" != true ]]; then
            echo "::warning::GLAEDA_ROUTE_APP_KEY is not set; automatic catch-up selects nothing."
            echo 'matrix={"include":[]}' >> "$GITHUB_OUTPUT"
            echo "count=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 -I "$TRUSTED/scripts/ci/auto_catch_up_select.py" --repo "$GITHUB_REPOSITORY" \
            --green-sha "$GREEN_SHA" --max "$MAX" --github-output "$GITHUB_OUTPUT" \
            --ledger-in "$RUNNER_TEMP/ledger/previous.json" --ledger-out "$RUNNER_TEMP/ledger/ledger.json"

      - name: Keep the attempt ledger for the next run
        if: steps.select.outputs.count != '' && steps.select.outputs.count != '0'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.LEDGER_ARTIFACT }}
          path: ${{ runner.temp }}/ledger/ledger.json
          retention-days: 7
          if-no-files-found: ignore

  merge:
    name: PR catch-up merge
    needs: [gate, select]
    # A writer's request, or the automatic selection when it picked any.
    if: >-
      !cancelled() && (
        (needs.gate.outputs.allowed == 'true' && needs.gate.outputs.refusal == '') ||
        (needs.select.result == 'success' && needs.select.outputs.count != '0')
      )
    # Untrusted pull request bytes: an ephemeral GitHub-hosted runner, never a
    # variable-selected host.
    runs-on: ubuntu-24.04 # github-hosted-required: checks out untrusted pull request bytes
    timeout-minutes: 20
    strategy:
      fail-fast: false
      # Read-only and GitHub-hosted, and finish waits for every entry, so the
      # whole default selection merges at once.
      max-parallel: 15
      matrix: ${{ fromJSON(needs.select.outputs.matrix || needs.gate.outputs.matrix) }}
    # One catch-up per pull request and path at a time. Only writers and
    # main's own green run reach this job.
    concurrency:
      group: ${{ github.event_name == 'workflow_run' && format('pr-catch-up-auto-merge-{0}', matrix.pr) || format('pr-catch-up-merge-{0}', matrix.pr) }}
      cancel-in-progress: false
    permissions:
      # actions: read lists the base branch's CI fast guards runs, to merge
      # the newest green base commit instead of a red tip.
      actions: read
      contents: read
      pull-requests: read
    env:
      PR_NUMBER: ${{ matrix.pr }}
      AUTO: ${{ github.event_name == 'workflow_run' }}
      TRUSTED_SHA: ${{ github.sha }}
      TRUSTED: ${{ github.workspace }}/trusted
      CANDIDATE: ${{ github.workspace }}/candidate
      # Never run an LFS smudge filter on pull request bytes.
      GIT_LFS_SKIP_SMUDGE: "1"
    steps:
      - name: Read the pull request and pin its head
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PIN: ${{ matrix.pin }}
        run: |
          set -euo pipefail
          refuse() {
            echo "::notice::$1"
            echo "refusal=$1" >> "$GITHUB_OUTPUT"
            exit 0
          }
          # The GraphQL variables are literal; gh substitutes them, not the shell.
          # shellcheck disable=SC2016
          gh api graphql -F number="$PR_NUMBER" -f owner="${GITHUB_REPOSITORY%%/*}" -f name="${GITHUB_REPOSITORY#*/}" \
            -f query='query($owner: String!, $name: String!, $number: Int!) {
              repository(owner: $owner, name: $name) {
                defaultBranchRef { name }
                pullRequest(number: $number) {
                  state headRefName headRefOid baseRefName isCrossRepository
                  headRepository { nameWithOwner }
                }
              }
            }' --jq '.data.repository.pullRequest + {defaultBranch: .data.repository.defaultBranchRef.name}' > "$RUNNER_TEMP/pr.json"
          state="$(jq -r '.state' "$RUNNER_TEMP/pr.json")"
          head_ref="$(jq -r '.headRefName' "$RUNNER_TEMP/pr.json")"
          head_sha="$(jq -r '.headRefOid' "$RUNNER_TEMP/pr.json")"
          base_ref="$(jq -r '.baseRefName' "$RUNNER_TEMP/pr.json")"
          head_repo="$(jq -r '.headRepository.nameWithOwner // ""' "$RUNNER_TEMP/pr.json")"
          cross="$(jq -r '.isCrossRepository' "$RUNNER_TEMP/pr.json")"
          default_branch="$(jq -r '.defaultBranch' "$RUNNER_TEMP/pr.json")"
          if [[ "$state" != OPEN ]]; then
            refuse "This pull request is $state, so there is nothing to catch up."
          fi
          if [[ "$cross" != false || "$head_repo" != "$GITHUB_REPOSITORY" ]]; then
            refuse "Catch-up only runs on branches in this repository for now, so I left this one alone. A maintainer can merge main in by hand."
          fi
          # Branch names come from the pull request author. Validate them
          # before they reach any URL or git argument.
          if ! git check-ref-format --branch "$head_ref" > /dev/null ||
             ! git check-ref-format --branch "$base_ref" > /dev/null ||
             [[ ! "$head_sha" =~ ^[0-9a-f]{40}$ ]]; then
            refuse "This pull request's branch name is not one I can safely work with."
          fi
          head_ref_url="$(jq -rn --arg ref "$head_ref" '$ref | @uri')"

          # Never merge into, or push to, a shared branch of this repository:
          # the default branch, classic protection, or any ruleset. Both REST
          # reads need only read access; an unreadable answer counts as
          # protected.
          classic="$(gh api "repos/$GITHUB_REPOSITORY/branches/$head_ref_url" --jq '.protected' || echo true)"
          rules="$(gh api "repos/$GITHUB_REPOSITORY/rules/branches/$head_ref_url" --jq 'length' || echo 1)"
          if [[ "$head_ref" == "$default_branch" || "$classic" != false || "$rules" != 0 ]]; then
            refuse "This pull request comes from a protected branch of this repository, so catch-up leaves it alone. Merge the base by hand if you really mean it."
          fi

          # Pin the head to what the requester saw. Only writers can push to
          # a branch of this repository, so without a pin the head now is one
          # a writer put there.
          if [[ "$EVENT_NAME" == pull_request_target && "$head_sha" != "$EVENT_HEAD_SHA" ]]; then
            refuse "New commits landed after the catch-up label was added, so I did not touch the branch. Add the label again if the new head is fine."
          fi
          if [[ -n "$PIN" && "$head_sha" != "$PIN" ]]; then
            refuse "The head is now ${head_sha:0:12}, not the ${PIN:0:12} you asked for, so I did not touch the branch."
          fi
          {
            echo "head_ref=$head_ref"
            echo "head_sha=$head_sha"
            echo "base_ref=$base_ref"
          } >> "$GITHUB_OUTPUT"

      - name: Check out the trusted tools
        if: steps.pr.outputs.head_sha != ''
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: trusted
          fetch-depth: 1
          persist-credentials: false
          submodules: false
          lfs: false

      # Data only. The full history (without blobs, which the merge fetches
      # on demand) supplies the base branch and the merge base.
      - name: Check out the pull request head as data
        if: steps.pr.outputs.head_sha != ''
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ github.repository }}
          ref: ${{ steps.pr.outputs.head_sha }}
          path: candidate
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
          submodules: false
          lfs: false

      # Merge the newest base commit whose CI fast guards passed, so a red
      # base tip does not hand this pull request its failures (the same
      # selection as the local merge-main tool). Its own step so the token
      # that reads the runs is never in the environment of the step that
      # works on pull request bytes. Any failure leaves the pick empty and the
      # merge falls back to the tip.
      - name: Pick the newest green base commit
        id: base
        if: steps.pr.outputs.head_sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ steps.pr.outputs.base_ref }}
        run: |
          set -euo pipefail
          selection="$RUNNER_TEMP/base-selection.json"
          python3 -I "$TRUSTED/scripts/ci/last_green_base.py" --repo "$CANDIDATE" --ref "origin/$BASE_REF" \
            --branch "$BASE_REF" --github-repo "$GITHUB_REPOSITORY" --json > "$selection" || true
          cat "$selection"
          chosen="$(jq -r '.chosen // empty' "$selection" 2> /dev/null || true)"
          tip="$(jq -r '.tip // empty' "$selection" 2> /dev/null || true)"
          if [[ "$chosen" =~ ^[0-9a-f]{40}$ && "$tip" =~ ^[0-9a-f]{40}$ ]]; then
            echo "chosen=$chosen" >> "$GITHUB_OUTPUT"
            echo "tip=$tip" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge the base with the trusted tools
        id: merge
        if: steps.pr.outputs.head_sha != ''
        env:
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          BASE_REF: ${{ steps.pr.outputs.base_ref }}
          ACTOR: ${{ github.event.sender.login }}
          GREEN_SHA: ${{ github.event.workflow_run.head_sha }}
          CHOSEN: ${{ steps.base.outputs.chosen }}
          TIP: ${{ steps.base.outputs.tip }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          [[ "$(git -C "$TRUSTED" rev-parse HEAD)" == "$TRUSTED_SHA" ]]
          [[ "$(git -C "$CANDIDATE" rev-parse HEAD)" == "$HEAD_SHA" ]]
          git -C "$CANDIDATE" rev-parse --verify --quiet "refs/remotes/origin/$BASE_REF^{commit}" > /dev/null
          mkdir -p "$RUNNER_TEMP/catch-up"
          result="$RUNNER_TEMP/catch-up/result.json"
          # The green pick from the step above; no verdict, or no green commit
          # among the newest 40, falls back to the tip as before.
          base="origin/$BASE_REF"
          note="Requested by $ACTOR on pull request #$PR_NUMBER."
          if [[ "$AUTO" == true ]]; then
            note="Automatic catch-up of pull request #$PR_NUMBER after CI fast guards passed on $BASE_REF at ${GREEN_SHA:0:12}."
          fi
          if [[ "$CHOSEN" =~ ^[0-9a-f]{40}$ && "$TIP" =~ ^[0-9a-f]{40}$ ]] &&
             git -C "$CANDIDATE" merge-base --is-ancestor "$CHOSEN" "origin/$BASE_REF"; then
            base="$CHOSEN"
            if [[ "$CHOSEN" != "$TIP" ]]; then
              note="$note Merged $BASE_REF at ${CHOSEN:0:12}, its newest commit with green CI fast guards; the tip ${TIP:0:12} was not green."
            fi
          fi
          code=0
          python3 -I "$TRUSTED/scripts/ci/catch_up_pr.py" merge \
            --repo "$CANDIDATE" --tools-root "$TRUSTED" --base "$base" --json \
            --title "Merge origin/$BASE_REF into the pull request head" \
            --note "$note" > "$result" || code=$?
          cat "$result"
          status="$(jq -r '.status' "$result")"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          {
            echo "### PR catch-up: $status"
            jq -r '(.resolved[] | "- resolved `\(.path)`: \(.method)"), (.blocking[] | "- blocking `\(.path)`: \(.reason)")' "$result"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$status" == merged ]]; then
            base_sha="$(jq -r '.base' "$result")"
            merged_sha="$(git -C "$CANDIDATE" rev-parse HEAD)"
            # Only the merge commit and the objects it adds; the push job
            # fetches both parents itself.
            git -C "$CANDIDATE" bundle create "$RUNNER_TEMP/catch-up/merge.bundle" HEAD "^$HEAD_SHA" "^$base_sha"
            echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
            echo "merged_sha=$merged_sha" >> "$GITHUB_OUTPUT"
          fi
          # Blocked (1) is an answer, not a failure; the comment carries it.
          if [[ "$code" -ne 0 && "$code" -ne 1 ]]; then
            exit "$code"
          fi

      # A matrix job has one set of outputs for all its entries, so each
      # entry's answer travels in its own artifact. The push job trusts it no
      # more than it trusted these outputs before: it validates every value
      # and checks the merge against the pull request itself.
      - name: Record the result for the push job
        if: always()
        env:
          REFUSAL: ${{ steps.pr.outputs.refusal }}
          HEAD_REF: ${{ steps.pr.outputs.head_ref }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          BASE_REF: ${{ steps.pr.outputs.base_ref }}
          STATUS: ${{ steps.merge.outputs.status }}
          BASE_SHA: ${{ steps.merge.outputs.base_sha }}
          MERGED_SHA: ${{ steps.merge.outputs.merged_sha }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/catch-up"
          jq -n --arg refusal "$REFUSAL" --arg head_ref "$HEAD_REF" --arg head_sha "$HEAD_SHA" \
            --arg base_ref "$BASE_REF" --arg status "$STATUS" --arg base_sha "$BASE_SHA" --arg merged_sha "$MERGED_SHA" \
            '{refusal: $refusal, head_ref: $head_ref, head_sha: $head_sha, base_ref: $base_ref,
              status: $status, base_sha: $base_sha, merged_sha: $merged_sha}' > "$RUNNER_TEMP/catch-up/outputs.json"

      - name: Hand the result to the push job
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: catch-up-${{ github.run_id }}-${{ matrix.pr }}
          path: ${{ runner.temp }}/catch-up/
          retention-days: 1
          if-no-files-found: ignore
          # A re-run attempt replaces the first attempt's result.
          overwrite: true

  finish:
    name: PR catch-up push and comment
    needs: [gate, select, merge]
    # Runs for every gated request so a label from someone without write
    # access is still removed, and for each automatically selected pull
    # request. Only a writer's request or main's own green run joins the
    # shared concurrency group, so such a label cannot cancel a pending push.
    if: >-
      always() && (
        needs.gate.result == 'success' ||
        (needs.select.result == 'success' && needs.select.outputs.count != '0')
      )
    runs-on: ubuntu-24.04 # github-hosted-required: holds the push token
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.select.outputs.matrix || needs.gate.outputs.matrix) }}
    concurrency:
      group: ${{ needs.select.result == 'success' && format('pr-catch-up-auto-push-{0}', matrix.pr) || needs.gate.outputs.allowed == 'true' && format('pr-catch-up-push-{0}', matrix.pr) || format('pr-catch-up-unprivileged-{0}-{1}', github.run_id, matrix.pr) }}
      cancel-in-progress: false
    permissions:
      # The fallback push when the App token is unavailable.
      contents: write
      # The result comment, the label removal and the reaction.
      issues: write
      pull-requests: write
    env:
      PR_NUMBER: ${{ matrix.pr }}
      AUTO: ${{ needs.select.result == 'success' }}
      # A writer asked, or main's own green run selected this pull request.
      AUTHORIZED: ${{ needs.gate.outputs.allowed == 'true' || needs.select.result == 'success' }}
      TRUSTED: ${{ github.workspace }}/trusted
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      GATE_REFUSAL: ${{ needs.gate.outputs.refusal }}
    steps:
      - name: Acknowledge the comment
        if: needs.gate.outputs.allowed == 'true' && github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          set -euo pipefail
          gh api -X POST "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID/reactions" \
            -f content=rocket > /dev/null || true

      - name: Check out the trusted tools
        if: env.AUTHORIZED == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: trusted
          fetch-depth: 1
          persist-credentials: false
          submodules: false
          lfs: false

      - name: Fetch the merge result
        if: env.AUTHORIZED == 'true' && needs.gate.outputs.refusal == ''
        continue-on-error: true
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: catch-up-${{ github.run_id }}-${{ matrix.pr }}
          path: ${{ runner.temp }}/catch-up

      # The merge job's answer for this pull request, validated before any of
      # it reaches a step (catch_up_pr.py read-result): commit ids are 40 hex,
      # branch names pass check-ref-format, the status is one the merge script
      # prints, the head is the pinned one, and the refusal is one line with no
      # workflow commands. Anything else reads as no answer.
      - name: Read the merge result
        id: merge
        if: env.AUTHORIZED == 'true'
        env:
          PIN: ${{ matrix.pin }}
        run: |
          set -euo pipefail
          python3 -I "$TRUSTED/scripts/ci/catch_up_pr.py" read-result \
            --file "$RUNNER_TEMP/catch-up/outputs.json" --pin "$PIN" >> "$GITHUB_OUTPUT"

      # Nothing the merge job produced is trusted here: the pull request is
      # read again, both parents are fetched from this repository, and the
      # merge commit is checked against git's own merge of them.
      - name: Verify the merge against the pull request
        id: verify
        if: env.AUTHORIZED == 'true' && steps.merge.outputs.status == 'merged'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.merge.outputs.head_sha }}
          HEAD_REF: ${{ steps.merge.outputs.head_ref }}
          BASE_REF: ${{ steps.merge.outputs.base_ref }}
          BASE_SHA: ${{ steps.merge.outputs.base_sha }}
          MERGED_SHA: ${{ steps.merge.outputs.merged_sha }}
        run: |
          set -euo pipefail
          echo "ok=false" >> "$GITHUB_OUTPUT"
          fail() { echo "::warning::$1"; exit 0; }
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ && "$BASE_SHA" =~ ^[0-9a-f]{40}$ && "$MERGED_SHA" =~ ^[0-9a-f]{40}$ ]] ||
            fail "merge outputs are not commit ids"
          # The GraphQL variables are literal; gh substitutes them, not the shell.
          # shellcheck disable=SC2016
          gh api graphql -F number="$PR_NUMBER" -f owner="${GITHUB_REPOSITORY%%/*}" -f name="${GITHUB_REPOSITORY#*/}" \
            -f query='query($owner: String!, $name: String!, $number: Int!) {
              repository(owner: $owner, name: $name) {
                defaultBranchRef { name }
                pullRequest(number: $number) {
                  state headRefName headRefOid baseRefName isCrossRepository
                  headRepository { nameWithOwner }
                }
              }
            }' --jq '.data.repository.pullRequest + {defaultBranch: .data.repository.defaultBranchRef.name}' > "$RUNNER_TEMP/pr.json"
          jq -e --arg repo "$GITHUB_REPOSITORY" --arg ref "$HEAD_REF" --arg sha "$HEAD_SHA" --arg base "$BASE_REF" '
            .state == "OPEN" and .isCrossRepository == false and .headRepository.nameWithOwner == $repo
            and .headRefName == $ref and .headRefOid == $sha and .baseRefName == $base
            and .headRefName != .defaultBranch' "$RUNNER_TEMP/pr.json" > /dev/null ||
            fail "the pull request no longer matches what was merged"
          git check-ref-format --branch "$HEAD_REF" > /dev/null || fail "invalid head branch"
          git check-ref-format --branch "$BASE_REF" > /dev/null || fail "invalid base branch"
          head_ref_url="$(jq -rn --arg ref "$HEAD_REF" '$ref | @uri')"
          classic="$(gh api "repos/$GITHUB_REPOSITORY/branches/$head_ref_url" --jq '.protected' || echo true)"
          rules="$(gh api "repos/$GITHUB_REPOSITORY/rules/branches/$head_ref_url" --jq 'length' || echo 1)"
          [[ "$classic" == false && "$rules" == 0 ]] || fail "the head branch is protected"

          # The base branch and the head, blob-less; the merge from the bundle.
          repo="$RUNNER_TEMP/push.git"
          git clone -q --bare --filter=blob:none --no-tags --single-branch --branch "$BASE_REF" \
            "https://github.com/$GITHUB_REPOSITORY.git" "$repo"
          git -C "$repo" fetch -q --no-tags origin "$HEAD_SHA"
          git -C "$repo" bundle verify "$RUNNER_TEMP/catch-up/merge.bundle" > /dev/null || fail "bad bundle"
          git -C "$repo" fetch -q --no-tags "$RUNNER_TEMP/catch-up/merge.bundle" "HEAD:refs/heads/catch-up-result"
          [[ "$(git -C "$repo" rev-parse refs/heads/catch-up-result)" == "$MERGED_SHA" ]] || fail "bundle holds another commit"
          if ! python3 -I "$TRUSTED/scripts/ci/catch_up_pr.py" verify --repo "$repo" \
            --head "$HEAD_SHA" --base "$BASE_SHA" --merged "$MERGED_SHA" --base-tip "refs/heads/$BASE_REF"; then
            fail "the merge commit is not a catch-up merge of the pull request"
          fi
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Mint the push token
        id: app-token
        if: steps.verify.outputs.ok == 'true' && vars.GLAEDA_ROUTE_APP_ID != ''
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.GLAEDA_ROUTE_APP_ID }}
          private-key: ${{ secrets.GLAEDA_ROUTE_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-workflows: write

      - name: Push the merge to the pull request branch
        id: push
        if: steps.verify.outputs.ok == 'true'
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          ACTIONS_TOKEN: ${{ github.token }}
          REPO: ${{ steps.verify.outputs.repo }}
          HEAD_SHA: ${{ steps.merge.outputs.head_sha }}
          HEAD_REF: ${{ steps.merge.outputs.head_ref }}
          MERGED_SHA: ${{ steps.merge.outputs.merged_sha }}
        run: |
          set -euo pipefail
          outcome=pushed
          token="$APP_TOKEN"
          if [[ -z "$token" && "$AUTO" == true ]]; then
            # An Actions-token push starts no workflows, which would leave the
            # pull request without checks on its new head. Nobody asked, so
            # leave the branch alone.
            echo "::warning::No route App token; the automatic catch-up of #$PR_NUMBER did not push."
            echo "outcome=skipped-no-app-token" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -z "$token" ]]; then
            outcome=pushed-without-ci
            token="$ACTIONS_TOKEN"
          fi
          auth="$(printf 'x-access-token:%s' "$token" | base64 -w0)"
          echo "::add-mask::$auth"
          # Compare-and-swap: the remote branch must still be the head that
          # was merged, and the new commit descends from it.
          if GIT_CONFIG_COUNT=1 \
             GIT_CONFIG_KEY_0="http.https://github.com/.extraheader" \
             GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" \
             git -C "$REPO" push --no-verify --porcelain \
               --force-with-lease="refs/heads/$HEAD_REF:$HEAD_SHA" \
               "https://github.com/$GITHUB_REPOSITORY.git" "$MERGED_SHA:refs/heads/$HEAD_REF" \
               > "$RUNNER_TEMP/push.log" 2>&1; then
            echo "Pushed $MERGED_SHA to $HEAD_REF ($outcome)."
          else
            cat "$RUNNER_TEMP/push.log"
            # git's own rejection reasons, then GitHub's refusal for a token
            # without workflow permission ("refusing to allow a GitHub App to
            # create or update workflow ... without `workflows` permission").
            if grep -qE '\[rejected\].*\((stale info|non-fast-forward|fetch first)\)' "$RUNNER_TEMP/push.log"; then
              outcome=rejected
            elif grep -qE 'refusing to allow .* to create or update workflow' "$RUNNER_TEMP/push.log"; then
              outcome=needs-workflows
            else
              outcome=push-denied
            fi
          fi
          echo "outcome=$outcome" >> "$GITHUB_OUTPUT"

      # By hand, every request gets an answer. The automatic path answers
      # only a push or something a person must fix, marked with the head it
      # tried so auto_catch_up_select.py does not try that head again, with no
      # mentions (catch_up_pr.py render_auto_comment); everything else,
      # including a refusal, stays silent and is bounded by the ledger.
      - name: Comment the result
        if: always() && env.AUTHORIZED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED: ${{ steps.verify.outputs.ok }}
          PUSH_OUTCOME: ${{ steps.push.outputs.outcome }}
          MERGE_REFUSAL: ${{ steps.merge.outputs.refusal }}
          MERGE_STATUS: ${{ steps.merge.outputs.status }}
          HEAD_SHA: ${{ steps.merge.outputs.head_sha }}
          HEAD_REF: ${{ steps.merge.outputs.head_ref }}
          BASE_REF: ${{ steps.merge.outputs.base_ref }}
        run: |
          set -euo pipefail
          comment="$RUNNER_TEMP/comment.md"
          # The merge job's refusal comes validated from the Read step.
          refusal="${GATE_REFUSAL:-$MERGE_REFUSAL}"
          if [[ -n "$refusal" ]]; then
            if [[ "$AUTO" == true ]]; then
              echo "Automatic catch-up of #$PR_NUMBER refused: $refusal"
              exit 0
            fi
            printf '%s\n' "$refusal" > "$comment"
          else
            push="${PUSH_OUTCOME:-not-attempted}"
            if [[ "$MERGE_STATUS" == merged && "$VERIFIED" != true ]]; then
              push=unverified
            fi
            auto=()
            if [[ "$AUTO" == true ]]; then
              auto=(--auto --head-sha "$HEAD_SHA")
            fi
            python3 -I "$TRUSTED/scripts/ci/catch_up_pr.py" comment --result "$RUNNER_TEMP/catch-up/result.json" \
              --push "$push" --base-name "${BASE_REF:-main}" --head-name "${HEAD_REF:-this branch}" \
              --run-url "$RUN_URL" "${auto[@]}" > "$comment"
          fi
          if [[ ! -s "$comment" ]]; then
            echo "Nothing to say on #$PR_NUMBER (${MERGE_STATUS:-no result}, ${PUSH_OUTCOME:-no push})."
            exit 0
          fi
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$comment"

      # The label is a one-shot request: drop it whatever happened, so adding
      # it again asks again. A 404 means it was not there.
      - name: Remove the catch-up label
        if: always() && github.event_name != 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels/catch-up" > /dev/null 2>&1 || true
