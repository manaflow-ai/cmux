name: Promote cmux-next to nightly-next

# Fast-forwards the protected branch `nightly-next` to a feat-cmux-next commit
# whose "cmux-next Release compile (Xcode 26)" check passed. The push to
# `nightly-next` starts nightly.yml, which signs and publishes the cmux-next
# track with the `release-next` environment (only `nightly-next` may use it).
#
# cmux-next.yml calls this after its Release compile passes on a push to
# feat-cmux-next. Those calls are debounced: at most one nightly-next build
# starts per NIGHTLY_NEXT_MIN_INTERVAL_HOURS (default 2), measured from the
# newest nightly.yml run on nightly-next; a skipped push waits for the next
# push or a manual run. Run workflow (dispatch) promotes on demand and
# bypasses the debounce, never the green check.
#
# Only the GitHub App that the nightly-next ruleset allows can move the branch
# (ruleset "nightly-next: fast-forward by the promote app only"), and the ref
# update is never forced, so the branch only ever fast-forwards.
on:
  workflow_call:
    inputs:
      sha:
        description: feat-cmux-next commit to promote.
        required: true
        type: string
  workflow_dispatch:
    inputs:
      sha:
        description: feat-cmux-next commit to promote (40 hex). Empty means the feat-cmux-next head.
        required: false
        default: ''
        type: string

permissions:
  contents: read
  checks: read
  actions: read

jobs:
  promote:
    name: Promote to nightly-next
    if: github.repository == 'manaflow-ai/cmux' && github.ref == 'refs/heads/feat-cmux-next'
    runs-on: ${{ vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 10
    concurrency:
      group: nightly-next-promote
      cancel-in-progress: false
    steps:
      - name: Mint branch app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.GLAEDA_ROUTE_APP_ID }}
          private-key: ${{ secrets.GLAEDA_ROUTE_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Fast-forward nightly-next
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          REQUESTED_SHA: ${{ inputs.sha }}
          DEBOUNCE: ${{ github.event_name == 'workflow_dispatch' && 'false' || 'true' }}
          MIN_INTERVAL_HOURS: ${{ vars.NIGHTLY_NEXT_MIN_INTERVAL_HOURS || '2' }}
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const source = 'feat-cmux-next';
            const target = 'nightly-next';
            const requiredCheck = 'cmux-next Release compile (Xcode 26)';
            const skip = (message) => { core.notice(message); };

            const sourceHead = (await github.rest.git.getRef({ owner, repo, ref: `heads/${source}` })).data.object.sha;
            const requested = (process.env.REQUESTED_SHA || '').trim();
            if (requested && !/^[0-9a-f]{40}$/.test(requested)) {
              core.setFailed(`sha must be 40 lowercase hex characters, got ${requested}`);
              return;
            }
            const sha = requested || sourceHead;

            // The commit must be on feat-cmux-next.
            if (sha !== sourceHead) {
              const { data } = await github.rest.repos.compareCommitsWithBasehead({ owner, repo, basehead: `${sha}...${sourceHead}` });
              if (data.status !== 'ahead') {
                core.setFailed(`${sha} is not on ${source} (compare status ${data.status})`);
                return;
              }
            }

            // The commit's Release compile must have passed.
            const runs = await github.paginate(github.rest.checks.listForRef, {
              owner, repo, ref: sha, check_name: requiredCheck, filter: 'latest', per_page: 100,
            });
            if (!runs.some((run) => run.status === 'completed' && run.conclusion === 'success')) {
              core.setFailed(`${sha} has no successful "${requiredCheck}" check`);
              return;
            }

            // Debounce pushes: one nightly-next build per interval.
            const minHours = Number(process.env.MIN_INTERVAL_HOURS);
            if (process.env.DEBOUNCE === 'true' && Number.isFinite(minHours) && minHours > 0) {
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner, repo, workflow_id: 'nightly.yml', branch: target, per_page: 1,
              });
              const last = data.workflow_runs[0];
              if (last) {
                const ageHours = (Date.now() - Date.parse(last.created_at)) / 3_600_000;
                if (ageHours < minHours) {
                  skip(`Debounced: the last ${target} build started ${ageHours.toFixed(2)}h ago (minimum ${minHours}h). Run this workflow by hand to promote now.`);
                  return;
                }
              }
            }

            // Fast-forward only. A missing branch is created at the commit.
            const writer = getOctokit(process.env.APP_TOKEN);
            let current = null;
            try {
              current = (await github.rest.git.getRef({ owner, repo, ref: `heads/${target}` })).data.object.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            if (current === sha) {
              skip(`${target} is already at ${sha}.`);
              return;
            }
            if (current) {
              const { data } = await github.rest.repos.compareCommitsWithBasehead({ owner, repo, basehead: `${current}...${sha}` });
              if (data.status !== 'ahead') {
                skip(`${sha} does not fast-forward ${target} from ${current} (compare status ${data.status}); nothing promoted.`);
                return;
              }
              await writer.rest.git.updateRef({ owner, repo, ref: `heads/${target}`, sha, force: false });
            } else {
              await writer.rest.git.createRef({ owner, repo, ref: `refs/heads/${target}`, sha });
            }
            core.notice(`Promoted ${target} to ${sha}; nightly.yml publishes it.`);
            await core.summary.addHeading('nightly-next promotion').addRaw(`\`${target}\`: ${current ?? '(new)'} -> ${sha}`).write();
