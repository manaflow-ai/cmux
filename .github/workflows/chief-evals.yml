# Chief fast evals (plans/cmux-next/agent-evals-DESIGN.md, "Chief fast evals"):
# every push that touches Chief code gets a score. GitHub-hosted Linux, never
# Blacksmith (Lawrence 2026-10-26). Deterministic cases (tests/eval_*.rs) gate;
# model cases (evals/cases/*.json) run through the team subrouter on the tailnet
# and are reported in the job summary. When the model route is down they are
# skipped with a warning, so a subrouter outage never reads as a Chief failure.
name: chief-evals
on:
  push:
    branches: [feat-cmux-next]
    paths:
      - "Native/OptChat/**"
      - "cmux-tui/crates/cmux-chief/**"
      - "cmux-tui/crates/cmux-conversation/**"
      - ".github/workflows/chief-evals.yml"
  workflow_dispatch:
    inputs:
      repeat:
        description: "runs per model case"
        default: "1"
permissions:
  contents: read
  id-token: write
# One run at a time, never cancelled: the branch moves every few minutes, and
# a cancelled run scores nothing.
concurrency:
  group: chief-evals-${{ github.ref }}
  cancel-in-progress: false
jobs:
  evals:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: Native/OptChat/optchat-chief
      - name: Build the eval runner and cases
        working-directory: Native/OptChat/optchat-chief
        run: |
          cargo build --locked --example chief_eval
          cargo test --locked --no-run $(ls tests/eval_*.rs | sed -E 's#tests/(.*)\.rs#--test \1#')
      - name: Deterministic cases (no model call)
        working-directory: Native/OptChat/optchat-chief
        run: evals/run.sh --no-model
      - name: Join tailnet (model route)
        id: tailnet
        continue-on-error: true
        if: github.repository_owner == 'manaflow-ai'
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4
        with:
          # Needs a trust credential for this branch (agent-evals-DESIGN.md).
          oauth-client-id: ${{ vars.TS_CHIEF_EVALS_OIDC_CLIENT_ID || vars.TS_E2E_OIDC_CLIENT_ID }}
          audience: ${{ vars.TS_CHIEF_EVALS_OIDC_AUDIENCE || vars.TS_E2E_OIDC_AUDIENCE }}
          tags: tag:ci
          use-cache: "true"
      - name: Model cases skipped (no tailnet)
        if: steps.tailnet.outcome != 'success'
        run: |
          echo "::warning::Chief model evals skipped: this runner could not join the tailnet (the model route is tailnet-only)"
          echo "Model cases skipped: no tailnet. Run evals/run.sh on a mini." >> "$GITHUB_STEP_SUMMARY"
      - name: Model cases
        if: steps.tailnet.outcome == 'success'
        working-directory: Native/OptChat/optchat-chief
        env:
          OPTCHAT_ANTHROPIC_BASE_URL: ${{ vars.CHIEF_EVAL_BASE_URL || 'http://100.89.225.106:31415' }}
          REPEAT: ${{ inputs.repeat || '1' }}
        run: |
          out="$RUNNER_TEMP/chief-evals"
          if ! target/debug/examples/chief_eval preflight; then
            echo "::warning::Chief model evals skipped: the model route $OPTCHAT_ANTHROPIC_BASE_URL does not answer"
            echo "Model cases skipped: model route down." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          set +e
          target/debug/examples/chief_eval --repeat "$REPEAT" --jobs 32 --min-pass "${{ vars.CHIEF_EVAL_MIN_PASS || '0.8' }}" --out "$out" | tee "$out.md"
          status=${PIPESTATUS[0]}
          { echo "## Chief fast evals"; echo; cat "$out.md"; } >> "$GITHUB_STEP_SUMMARY"
          exit $status
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: chief-evals
          path: ${{ runner.temp }}/chief-evals
          if-no-files-found: ignore
