# Chief fast evals (plans/cmux-next/agent-evals-DESIGN.md, "Chief fast evals"):
# every push that touches Chief code gets a score. Blacksmith Linux: no job in
# manaflow-ai selects a GitHub-hosted runner, so a GitHub billing block or a
# hosted queue never stops it (tests/test_ci_self_hosted_guard.sh,
# check_no_github_hosted_runners). Deterministic cases (tests/eval_*.rs) gate;
# model cases (evals/cases/*.json) run through the team subrouter on the tailnet
# and are reported in the job summary. When the model route is down they are
# skipped with a warning, so a subrouter outage never reads as a Chief failure.
#
# CI cut 2026-11-24 (goal ci-runner-min-per-day-50k): pull requests no longer run this advisory check; it gated
# nothing (no ruleset requires it, land-judge skips "(advisory)" names). Landings on feat-cmux-next and dispatch
# still run it, so a red shows up on base. The "(advisory)" name and pull_request conditions below stay inert.
name: chief-evals
on:
  push:
    branches: [feat-cmux-next]
    paths:
      - "Native/OptChat/**"
      - "cmux-tui/crates/cmux-chief/**"
      - "cmux-tui/crates/cmux-conversation/**"
      - ".github/workflows/chief-evals.yml"
      # A README or notes file alone starts nothing here (tests/test_ci_docs_only_prs.py); no build reads them.
      - "!**/README.md"
      - "!**/COORDINATION.md"
  workflow_dispatch:
    inputs:
      repeat:
        description: "runs per model case"
        default: "1"
      baseline_run:
        description: "run id whose chief-evals artifact is the baseline (default: the last feat-cmux-next run that has one)"
        default: ""
# Write scopes are job-scoped (tests/test_ci_workflow_permissions_are_job_scoped.py).
permissions: {}
# One run at a time, never cancelled on the branch: it moves every few minutes, and
# a cancelled run scores nothing. A pull request's newer push replaces its older run.
concurrency:
  group: chief-evals-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  # Temporary REST budget attribution: one gh-call line per GitHub API call (scripts/ci/api_call_log/env.sh, fetched at a fixed commit when the checkout has no copy).
  BASH_ENV: '$({ w="${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh"; t="${RUNNER_TEMP:-/nonexistent}/api-call-log-src"; if [ -f "$w" ]; then echo "$w"; elif [ -n "${RUNNER_TEMP:-}" ]; then if [ ! -f "$t/env.sh" ] && [ ! -e "$t.tried" ] && { [ "${RUNNER_OS:-}" = Linux ] || [ "${RUNNER_OS:-}" = macOS ]; } && [ "$(date -u +%Y%m%d%H)" -lt 2026112300 ]; then : > "$t.tried"; mkdir -p "$t.part" && for x in env.sh gh sitecustomize.py isolated.py; do curl -fsSL --max-time 5 -o "$t.part/$x" "https://raw.githubusercontent.com/manaflow-ai/cmux/27647ffd3ae838c63be28ca3e5883dcd68c34518/scripts/ci/api_call_log/$x" || break; done; [ -s "$t.part/isolated.py" ] && mv "$t.part" "$t"; fi; if [ -f "$t/env.sh" ]; then echo "$t/env.sh"; else echo unset BASH_ENV > "$t.off.sh" && echo "$t.off.sh"; fi; fi; } 2>/dev/null)'

jobs:
  evals:
    name: evals${{ github.event_name == 'pull_request' && ' (advisory)' || '' }}
    # A pull request joins the tailnet only once the Tailscale trust credential admits pull_request: set the repo
    # variable CHIEF_EVALS_PR_TAILNET=true then (tests/test_ci_workflow_tailnet_oidc_pr_gate.py, cmux#43753).
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft != true || contains(github.event.pull_request.labels.*.name, 'full-ci') || (vars.CI_DRAFT_CHEAP_TIER || '1') == '0') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository && vars.CHIEF_EVALS_PR_TAILNET == 'true') }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || vars.CI_OVERFLOW_LINUX || 'cmux-linux' }}
    timeout-minutes: 30
    outputs:
      # fleet-ab runs the model cases on the fleet when this join is refused.
      tailnet: ${{ steps.tailnet.outcome }}
    permissions:
      # gh run download of the baseline run's chief-evals artifact.
      actions: read
      contents: read
      # The tailnet join's OIDC token (tailscale/github-action oauth-client-id + audience).
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      # Before rust-cache: its cleanup must never reach a home a sibling runner builds from.
      - name: Give this runner instance its own CARGO_HOME
        uses: ./.github/actions/runner-cargo-home
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # The lockfile and toolchain name the entry: with the environment hash off, a bare key never changed, so the first save
          # was restored forever and its stale third-party crates rebuilt on every run (ci-min-per-pr-1500, 2026-11-25).
          key: ${{ hashFiles('Native/OptChat/optchat-chief/Cargo.lock', '.cargo/config.toml') }}
          save-if: ${{ github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && github.event_name != 'merge_group' && contains(fromJSON('["refs/heads/main","refs/heads/feat-cmux-next","refs/heads/nightly-next"]'), github.ref) }}
          # Why: docs/ci/cmux-next-workflow-notes.md#note-210 (pool runners keep different leftover toolchains)
          add-rust-environment-hash-key: false
          workspaces: Native/OptChat/optchat-chief
          # rust-cache deletes ~/.cargo/bin otherwise (tests/test_ci_rust_cache_keeps_runner_bin.py).
          cache-bin: false
      - name: Build the eval runner and cases
        working-directory: Native/OptChat/optchat-chief
        run: |
          cargo build --locked --example chief_eval
          eval_tests=()
          for file in tests/eval_*.rs; do
            name="${file#tests/}"
            eval_tests+=(--test "${name%.rs}")
          done
          cargo test --locked --no-run "${eval_tests[@]}"
      - name: Runner unit tests (scoring and baseline diff)
        working-directory: Native/OptChat/optchat-chief
        # The runner's own tests (case_counts, infra runs, baseline_diff,
        # `chief_eval diff`): no other job runs an example's tests, and they
        # went uncompiled once already.
        run: cargo test --locked --example chief_eval
      - name: Deterministic cases (no model call)
        working-directory: Native/OptChat/optchat-chief
        run: evals/run.sh --no-model
      - name: Join tailnet (model route)
        id: tailnet
        continue-on-error: true
        if: github.repository_owner == 'manaflow-ai'
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4
        with:
          # Needs a trust credential for this branch (agent-evals-DESIGN.md).
          oauth-client-id: ${{ vars.TS_CHIEF_EVALS_OIDC_CLIENT_ID || vars.TS_E2E_OIDC_CLIENT_ID }}
          audience: ${{ vars.TS_CHIEF_EVALS_OIDC_AUDIENCE || vars.TS_E2E_OIDC_AUDIENCE }}
          tags: tag:ci
          use-cache: "true"
      - name: Model cases skipped (no tailnet)
        if: steps.tailnet.outcome != 'success'
        run: |
          echo "::warning::Chief model evals skipped: this runner could not join the tailnet (the model route is tailnet-only)"
          echo "Model cases skipped: no tailnet. Run evals/run.sh on a mini." >> "$GITHUB_STEP_SUMMARY"
      - name: Model cases
        if: steps.tailnet.outcome == 'success'
        working-directory: Native/OptChat/optchat-chief
        env:
          OPTCHAT_ANTHROPIC_BASE_URL: ${{ vars.CHIEF_EVAL_BASE_URL || 'http://100.120.48.119:4016' }}
          REPEAT: ${{ inputs.repeat || '1' }}
          BASELINE_RUN: ${{ inputs.baseline_run }}
          GH_TOKEN: ${{ github.token }}
        run: |
          out="$RUNNER_TEMP/chief-evals"
          # The baseline: an earlier run's summary.json, diffed per group and
          # case in the summary (report only, never a gate).
          base="$RUNNER_TEMP/chief-evals-baseline"
          if [ -z "$BASELINE_RUN" ]; then
            BASELINE_RUN=$(gh run list -R "$GITHUB_REPOSITORY" -w chief-evals.yml -b feat-cmux-next \
              --status completed --limit 20 --json databaseId \
              --jq "[.[] | select(.databaseId != $GITHUB_RUN_ID) | .databaseId] | .[]" 2>/dev/null |
              while read -r id; do
                gh run download "$id" -R "$GITHUB_REPOSITORY" -n chief-evals -D "$base" >/dev/null 2>&1 &&
                  [ -f "$base/summary.json" ] && { echo "$id"; break; }
                rm -rf "$base"
              done || true)
          elif ! gh run download "$BASELINE_RUN" -R "$GITHUB_REPOSITORY" -n chief-evals -D "$base"; then
            echo "::warning::Chief evals: no chief-evals artifact in run $BASELINE_RUN; no baseline diff"
          fi
          baseline=()
          if [ -f "$base/summary.json" ]; then
            baseline=(--baseline "$base/summary.json")
          elif [ -n "$BASELINE_RUN" ]; then
            echo "::warning::Chief evals: run $BASELINE_RUN has no summary.json; no baseline diff"
          fi
          if ! target/debug/examples/chief_eval preflight; then
            echo "::warning::Chief model evals skipped: the model route $OPTCHAT_ANTHROPIC_BASE_URL does not answer"
            echo "Model cases skipped: model route down." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          set +e
          target/debug/examples/chief_eval --repeat "$REPEAT" --jobs 32 --min-pass "${{ vars.CHIEF_EVAL_MIN_PASS || '0.8' }}" --out "$out" "${baseline[@]}" | tee "$out.md"
          status=${PIPESTATUS[0]}
          {
            echo "## Chief fast evals"; echo
            [ ${#baseline[@]} -gt 0 ] && echo "Baseline: run [$BASELINE_RUN]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$BASELINE_RUN)" && echo
            cat "$out.md"
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: chief-evals
          path: ${{ runner.temp }}/chief-evals
          if-no-files-found: ignore
          # A later run diffs against it; the baseline is report-only, so a run
          # more than 3 days after the last one just shows no diff.
          retention-days: 3

  # The model cases when this runner cannot join the tailnet (refused with a token-exchange 403 on every run from
  # at least 2026-10-30 to 2026-11-23, so no push scored a model case or diffed against a baseline). A fleet
  # worker reaches the model route directly: scripts/measure/chief-evals.sh builds the eval runner at the
  # previous head and at this push, runs the same cases on both on one worker, and lists the cases this push
  # regressed (good Chief behavior lost) or improved. A report, never a gate. A thin cmux-ci client on the
  # build-fleet gateway runner (vars.CI_EVAL_STEP_GATEWAY), as cmux-next-ios-keyboard-motion.yml is; with the
  # variable unset nothing runs.
  fleet-ab:
    name: model cases A/B on the fleet
    needs: evals
    if: ${{ !cancelled() && github.repository_owner == 'manaflow-ai' && vars.CI_EVAL_STEP_GATEWAY != '' && github.event_name == 'push' && needs.evals.outputs.tailnet != 'success' && github.event.before != '' && github.event.before != '0000000000000000000000000000000000000000' }}
    runs-on: ${{ vars.CI_EVAL_STEP_GATEWAY }}
    timeout-minutes: 120
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - name: Before and after on one worker
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          BASE_URL: ${{ vars.CHIEF_EVAL_BASE_URL || 'http://100.120.48.119:4016' }}
        run: |
          set +e
          set -uo pipefail
          client="${CMUX_CI_CLIENT:-$HOME/.local/bin/cmux-ci}"
          if ! [[ -x "$client" ]]; then
            echo "::warning title=Chief evals A/B::$client is not installed on runner $RUNNER_NAME; no run"
            exit 0
          fi
          log="${RUNNER_TEMP:?}/chief-evals-ab.log"
          "$client" run --class exclusive --measurement --os linux --label measure --script scripts/measure/chief-evals.sh \
            --ref "$AFTER" --arg "base_url=$BASE_URL" --arg "before=$BEFORE" --arg "after=$AFTER" \
            --timeout 5400 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          {
            echo "## Chief evals A/B on the fleet"; echo
            echo "Before \`${BEFORE:0:12}\` (the previous head), after \`${AFTER:0:12}\`: the same cases on one worker."; echo
            if grep -q '^CHIEF-EVALS-DIFF ' "$log"; then
              sed -n '/^CHIEF-EVALS-DIFF /,$p' "$log" | tail -n +2
            else
              echo "No diff (exit $status): \`cmux-ci log\` of the step has the run."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$status" != 0 ]]; then
            echo "::warning title=Chief evals A/B::the fleet run exited $status"
          fi
          exit 0
