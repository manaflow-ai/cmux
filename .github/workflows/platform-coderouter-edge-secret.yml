name: Platform coderouter edge secret
# Whether cmux-platform-staging and cmux-platform-production carry a Worker SECRET named CLOUD_CODEROUTER_EDGE_HOST.
# cmux-platform #1681 commented the var out of wrangler.jsonc for both, and `wrangler deploy` replaces plain vars, yet
# production machines made 58 s after that deploy still got the shared coderouter rule (cmuxterm-hq#19439:
# `cloud coderouter edge` outcome `created`, 21:14Z 2026-11-22). A secret of the same name survives every deploy.
# Leo, 2026-11-22: "don't we just... point sr2 at it?"; and on unblocking: "if it unblocks, then it doesnt need ci. just do it."
#
# Names only: a Worker secret's value cannot be read back, so the check says present or absent. With `delete: true`
# it deletes that one name from the chosen Worker when present, so the wrangler.jsonc setting is the only switch
# again; nothing else is touched. Reads the Cloudflare token from cmux-next-production, as
# pair-machine-join-check.yml and platform-prod-secrets.yml do. The push trigger (this file only) registers it and
# runs the names-only check once.
on:
  push:
    branches: [feat-cmux-next]
    paths: [.github/workflows/platform-coderouter-edge-secret.yml]
  workflow_dispatch:
    inputs:
      delete:
        description: "delete CLOUD_CODEROUTER_EDGE_HOST from the chosen Worker when present"
        type: boolean
        default: false
      worker:
        description: "the Worker to delete it from (the check always reads both)"
        type: choice
        options: [cmux-platform-production, cmux-platform-staging]
        default: cmux-platform-production

permissions:
  contents: read

concurrency:
  group: platform-coderouter-edge-secret
  cancel-in-progress: false

env:
  # Temporary REST budget attribution: one gh-call line per GitHub API call (scripts/ci/api_call_log/env.sh, fetched at a fixed commit when the checkout has no copy).
  BASH_ENV: '$({ w="${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh"; t="${RUNNER_TEMP:-/nonexistent}/api-call-log-src"; if [ -f "$w" ]; then echo "$w"; elif [ -n "${RUNNER_TEMP:-}" ]; then if [ ! -f "$t/env.sh" ] && [ ! -e "$t.tried" ] && { [ "${RUNNER_OS:-}" = Linux ] || [ "${RUNNER_OS:-}" = macOS ]; } && [ "$(date -u +%Y%m%d%H)" -lt 2026112300 ]; then : > "$t.tried"; mkdir -p "$t.part" && for x in env.sh gh sitecustomize.py isolated.py; do curl -fsSL --max-time 5 -o "$t.part/$x" "https://raw.githubusercontent.com/manaflow-ai/cmux/27647ffd3ae838c63be28ca3e5883dcd68c34518/scripts/ci/api_call_log/$x" || break; done; [ -s "$t.part/isolated.py" ] && mv "$t.part" "$t"; fi; if [ -f "$t/env.sh" ]; then echo "$t/env.sh"; else echo unset BASH_ENV > "$t.off.sh" && echo "$t.off.sh"; fi; fi; } 2>/dev/null)'

jobs:
  check:
    if: github.ref == 'refs/heads/feat-cmux-next'
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.LINUX_RUNNER || fromJSON(vars.RUNNER_POOLS).linux_4 }}
    environment: cmux-next-production
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
      - name: CLOUD_CODEROUTER_EDGE_HOST on both Workers (names only), and the opt-in delete
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 0c1675e0def6de1ab3a50a4e17dc5656
          DELETE: ${{ inputs.delete && 'true' || 'false' }}
          TARGET: ${{ inputs.worker || 'cmux-platform-production' }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          WR="npx -y wrangler@4.156.0"
          NAME=CLOUD_CODEROUTER_EDGE_HOST
          case "$TARGET" in cmux-platform-production|cmux-platform-staging) ;; *) echo "::error::unknown worker"; exit 1 ;; esac
          # 0 = present, 1 = absent; a failed or unreadable list stops the job instead of reading as absent.
          has() {
            local out rc=0
            out="$($WR secret list --name "$1" --format json)" || { echo "::error::wrangler secret list failed for $1"; exit 1; }
            printf '%s' "$out" | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{const l=JSON.parse(d);if(!Array.isArray(l))process.exit(9);process.exit(l.some(s=>s.name===process.argv[1])?0:3)})' "$NAME" || rc=$?
            case "$rc" in 0) return 0 ;; 3) return 1 ;; *) echo "::error::could not read the secret list of $1"; exit 1 ;; esac
          }
          for w in cmux-platform-staging cmux-platform-production; do
            if has "$w"; then state=PRESENT; else state=absent; fi
            echo "$w $NAME: $state"
            echo "- \`$w\` $NAME (secret): $state" >> "$GITHUB_STEP_SUMMARY"
          done
          [ "$DELETE" = true ] || exit 0
          if has "$TARGET"; then
            $WR secret delete "$NAME" --name "$TARGET" --force
            if has "$TARGET"; then echo "::error::$TARGET still lists $NAME after the delete"; exit 1; fi
            echo "$TARGET $NAME: deleted"
            echo "- \`$TARGET\` $NAME: **deleted**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "$TARGET has no $NAME secret; nothing deleted"
          fi
