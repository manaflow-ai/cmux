name: cmux-tui build package

on:
  workflow_call:
    inputs:
      version:
        description: "npm package version, or the shared stable X.Y.Z version"
        required: true
        type: string
      pypi_version:
        description: "PyPI package version; defaults to version"
        required: false
        default: ""
        type: string
      package_npm:
        description: "Build and upload npm package directory artifacts"
        required: false
        default: true
        type: boolean
      package_pypi:
        description: "Build and upload PyPI wheel artifacts"
        required: false
        default: true
        type: boolean
      include_windows:
        description: "Also build and upload the experimental Windows artifact"
        required: false
        default: false
        type: boolean
      target_set:
        description: "Binary targets to build: all or macos-arm64"
        required: false
        default: all
        type: string
      build_cloudflare_relay:
        description: "Build and verify the Cloudflare relay"
        required: false
        default: true
        type: boolean
      verify_linux_arm64:
        description: "Run package entrypoint verification on native Linux ARM64"
        required: false
        default: true
        type: boolean
      macos_runner:
        description: "Optional macOS runner label override"
        required: false
        default: ""
        type: string
      linux_runner:
        description: "Optional Linux x64 runner label override"
        required: false
        default: ""
        type: string
      windows_runner:
        description: "Optional Windows runner label override"
        required: false
        default: ""
        type: string
      checkout_ref:
        description: "Optional git ref to build instead of the caller ref"
        required: false
        default: ""
        type: string

permissions: {}

jobs:
  plan-build:
    name: select binary targets
    runs-on: ${{ inputs.linux_runner != '' && inputs.linux_runner || vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
      linux_package_matrix: ${{ steps.targets.outputs.linux_package_matrix }}
    steps:
      - name: Select binary targets
        id: targets
        env:
          TARGET_SET: ${{ inputs.target_set }}
          PACKAGE_NPM: ${{ inputs.package_npm }}
          PACKAGE_PYPI: ${{ inputs.package_pypi }}
          INCLUDE_WINDOWS: ${{ inputs.include_windows }}
          MACOS_RUNNER: ${{ inputs.macos_runner != '' && inputs.macos_runner || vars.MACOS_RUNNER_15 || 'blacksmith-6vcpu-macos-15' }}
          LINUX_RUNNER: ${{ inputs.linux_runner != '' && inputs.linux_runner || vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
          LINUX_ARM64_RUNNER: ${{ vars.LINUX_ARM64_RUNNER || 'ubuntu-24.04-arm' }}
          VERIFY_LINUX_ARM64: ${{ inputs.verify_linux_arm64 }}
        shell: bash
        run: |
          python3 <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os

          targets = [
              {
                  "target": "aarch64-apple-darwin",
                  "build_target": "aarch64-apple-darwin",
                  "runner": os.environ["MACOS_RUNNER"],
                  "cross": False,
                  "ext": "",
                  "compatibility_target": "",
              },
              {
                  "target": "x86_64-apple-darwin",
                  "build_target": "x86_64-apple-darwin",
                  "runner": os.environ["MACOS_RUNNER"],
                  "cross": True,
                  "ext": "",
                  "compatibility_target": "",
              },
              {
                  "target": "x86_64-unknown-linux-musl",
                  "build_target": "x86_64-unknown-linux-musl",
                  "runner": os.environ["LINUX_RUNNER"],
                  "cross": True,
                  "ext": "",
                  "compatibility_target": "x86_64-unknown-linux-gnu",
              },
              {
                  "target": "aarch64-unknown-linux-musl",
                  "build_target": "aarch64-unknown-linux-musl",
                  "runner": os.environ["LINUX_RUNNER"],
                  "cross": True,
                  "ext": "",
                  "compatibility_target": "aarch64-unknown-linux-gnu",
              },
          ]
          target_set = os.environ["TARGET_SET"]
          if target_set == "all":
              selected = targets
          elif target_set == "macos-arm64":
              selected = [
                  target for target in targets
                  if target["target"] == "aarch64-apple-darwin"
              ]
          else:
              raise SystemExit(f"unsupported target_set: {target_set!r}")

          packages_requested = (
              os.environ["PACKAGE_NPM"] == "true"
              or os.environ["PACKAGE_PYPI"] == "true"
          )
          if packages_requested and target_set != "all":
              raise SystemExit("npm and PyPI packaging require target_set=all")
          if packages_requested and os.environ["INCLUDE_WINDOWS"] != "true":
              raise SystemExit("npm and PyPI packaging require include_windows=true")

          print("matrix=" + json.dumps({"include": selected}, separators=(",", ":")))

          linux_package_targets = [
              {
                  "architecture": "x64",
                  "runner": os.environ["LINUX_RUNNER"],
              }
          ]
          if os.environ["VERIFY_LINUX_ARM64"] == "true":
              linux_package_targets.append(
                  {
                      "architecture": "arm64",
                      "runner": os.environ["LINUX_ARM64_RUNNER"],
                  }
              )
          print(
              "linux_package_matrix="
              + json.dumps({"include": linux_package_targets}, separators=(",", ":"))
          )
          PY

  build:
    name: build ${{ matrix.target }}
    needs: plan-build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan-build.outputs.matrix) }}
    steps:
      - name: Checkout caller ref
        if: inputs.checkout_ref == ''
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Checkout requested ref
        if: inputs.checkout_ref != ''
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ inputs.checkout_ref }}

      - name: Init ghostty submodule
        run: git submodule update --init --depth 1 ghostty

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils clang libclang-dev musl-tools pkg-config

      - name: Resolve Ghostty Zig version
        id: ghostty-zig-version
        shell: bash
        run: |
          version="$(bash ./scripts/ghostty-zig-version.sh)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install zig
        uses: mlugg/setup-zig@8d6198c65fb0feaa111df26e6b467fea8345e46f # v2.0.5
        with:
          version: ${{ steps.ghostty-zig-version.outputs.version }}

      - name: Set up pinned Rust
        uses: ./.github/actions/setup-cmux-tui-rust

      - name: Install Rust target
        shell: bash
        run: rustup target add ${{ matrix.target }}

      - name: Install cargo-zigbuild
        if: matrix.cross == true && runner.os == 'Linux'
        shell: bash
        run: cargo install --locked cargo-zigbuild@0.20.0

      - name: Build cmux-tui (native)
        if: matrix.cross == false
        env:
          CMUX_TUI_DISTRIBUTION_VERSION: ${{ inputs.version }}
          PACKAGE_NPM: ${{ inputs.package_npm }}
        working-directory: cmux-tui
        shell: bash
        run: |
          # Package artifacts must build and stamp the checked-out submodule,
          # independent of any self-hosted runner source override.
          unset CMUX_GHOSTTY_SRC
          CMUX_TUI_BUILD_COMMIT="$(git -C .. rev-parse HEAD)"
          CMUX_TUI_GHOSTTY_COMMIT="$(git -C ../ghostty rev-parse HEAD)"
          export CMUX_TUI_BUILD_COMMIT CMUX_TUI_GHOSTTY_COMMIT CMUX_TUI_DISTRIBUTION_VERSION
          if [[ "$PACKAGE_NPM" == "true" ]]; then
            CMUX_TUI_NPM_BOOTSTRAP_VERSION="$CMUX_TUI_DISTRIBUTION_VERSION"
            export CMUX_TUI_NPM_BOOTSTRAP_VERSION
          fi
          cargo build -p cmux-tui --bin cmux-tui --bin cmux-tui-hook --release --locked --target ${{ matrix.build_target }}
          cargo build -p cmux-relay --bin cmux-relay --release --locked --target ${{ matrix.build_target }}

      - name: Build cmux-tui (Linux cross)
        if: matrix.cross == true && runner.os == 'Linux'
        env:
          CMUX_TUI_DISTRIBUTION_VERSION: ${{ inputs.version }}
          PACKAGE_NPM: ${{ inputs.package_npm }}
        working-directory: cmux-tui
        shell: bash
        run: |
          # Package artifacts must build and stamp the checked-out submodule,
          # independent of any self-hosted runner source override.
          unset CMUX_GHOSTTY_SRC
          CMUX_TUI_BUILD_COMMIT="$(git -C .. rev-parse HEAD)"
          CMUX_TUI_GHOSTTY_COMMIT="$(git -C ../ghostty rev-parse HEAD)"
          export CMUX_TUI_BUILD_COMMIT CMUX_TUI_GHOSTTY_COMMIT CMUX_TUI_DISTRIBUTION_VERSION
          if [[ "$PACKAGE_NPM" == "true" ]]; then
            CMUX_TUI_NPM_BOOTSTRAP_VERSION="$CMUX_TUI_DISTRIBUTION_VERSION"
            export CMUX_TUI_NPM_BOOTSTRAP_VERSION
          fi
          cargo zigbuild -p cmux-tui --bin cmux-tui --bin cmux-tui-hook --release --locked --target ${{ matrix.build_target }}
          cargo zigbuild -p cmux-relay --bin cmux-relay --release --locked --target ${{ matrix.build_target }}

      - name: Build cmux-tui (macOS cross)
        if: matrix.cross == true && runner.os == 'macOS'
        env:
          CMUX_TUI_DISTRIBUTION_VERSION: ${{ inputs.version }}
          PACKAGE_NPM: ${{ inputs.package_npm }}
        working-directory: cmux-tui
        shell: bash
        run: |
          # Xcode's macOS SDK natively supports cross-architecture builds.
          # cargo-zigbuild cannot resolve SDK frameworks when the host is arm64.
          unset CMUX_GHOSTTY_SRC
          CMUX_TUI_BUILD_COMMIT="$(git -C .. rev-parse HEAD)"
          CMUX_TUI_GHOSTTY_COMMIT="$(git -C ../ghostty rev-parse HEAD)"
          export CMUX_TUI_BUILD_COMMIT CMUX_TUI_GHOSTTY_COMMIT CMUX_TUI_DISTRIBUTION_VERSION
          if [[ "$PACKAGE_NPM" == "true" ]]; then
            CMUX_TUI_NPM_BOOTSTRAP_VERSION="$CMUX_TUI_DISTRIBUTION_VERSION"
            export CMUX_TUI_NPM_BOOTSTRAP_VERSION
          fi
          cargo build -p cmux-tui --bin cmux-tui --bin cmux-tui-hook --release --locked --target ${{ matrix.build_target }}
          cargo build -p cmux-relay --bin cmux-relay --release --locked --target ${{ matrix.build_target }}

      - name: Stage binary
        shell: bash
        run: |
          mkdir -p dist
          binary="dist/cmux-tui-${{ matrix.target }}${{ matrix.ext }}"
          hook_binary="dist/cmux-tui-hook-${{ matrix.target }}${{ matrix.ext }}"
          relay_binary="dist/cmux-relay-${{ matrix.target }}${{ matrix.ext }}"
          cp "cmux-tui/target/${{ matrix.target }}/release/cmux-tui${{ matrix.ext }}" "$binary"
          cp "cmux-tui/target/${{ matrix.target }}/release/cmux-tui-hook${{ matrix.ext }}" "$hook_binary"
          cp "cmux-tui/target/${{ matrix.target }}/release/cmux-relay${{ matrix.ext }}" "$relay_binary"
          if [[ -n "${{ matrix.compatibility_target }}" ]]; then
            cp "$binary" "dist/cmux-tui-${{ matrix.compatibility_target }}${{ matrix.ext }}"
            cp "$hook_binary" "dist/cmux-tui-hook-${{ matrix.compatibility_target }}${{ matrix.ext }}"
            cp "$relay_binary" "dist/cmux-relay-${{ matrix.compatibility_target }}${{ matrix.ext }}"
          fi
          ls -la dist

      - name: Verify non-npm binaries disable SSH auto-install
        if: runner.os == 'Linux' && matrix.target == 'x86_64-unknown-linux-musl' && inputs.package_npm == false
        shell: bash
        run: |
          CMUX_TUI_PROBE="$(dist/cmux-tui-${{ matrix.target }} remote-probe --json)"
          CMUX_TUI_EXPECTED_BUILD_IDENTITY="$(git rev-parse HEAD)"
          export CMUX_TUI_PROBE CMUX_TUI_EXPECTED_BUILD_IDENTITY
          python3 - <<'PY'
          import json
          import os

          probe = json.loads(os.environ["CMUX_TUI_PROBE"])
          expected_identity = os.environ["CMUX_TUI_EXPECTED_BUILD_IDENTITY"]
          if probe.get("build_identity") != expected_identity:
              raise SystemExit(
                  f"binary build identity {probe.get('build_identity')!r} "
                  f"!= {expected_identity!r}"
              )
          if probe.get("npm_bootstrap_version") is not None:
              raise SystemExit(
                  "non-npm binary unexpectedly advertises npm bootstrap version "
                  f"{probe.get('npm_bootstrap_version')!r}"
              )
          PY

      - name: Smoke-test release remote sessions
        if: matrix.target == 'x86_64-unknown-linux-musl'
        shell: bash
        run: cmux-tui/scripts/smoke-remote-release.sh "dist/cmux-tui-${{ matrix.target }}"

      - name: Test release remote sequence rollback
        if: matrix.target == 'x86_64-unknown-linux-musl'
        working-directory: cmux-tui
        shell: bash
        run: >-
          cargo test --release --locked --target ${{ matrix.target }}
          -p cmux-remote queue_admission_failure_rolls_back_sequence_and_replay

      - name: Upload binary artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cmux-tui-${{ matrix.target }}
          path: dist/cmux-tui-*${{ matrix.ext }}
          if-no-files-found: error

      - name: Upload relay binary artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cmux-relay-${{ matrix.target }}
          path: dist/cmux-relay-*${{ matrix.ext }}
          if-no-files-found: error

  cloudflare-relay:
    name: Cloudflare Durable Object relay
    if: inputs.build_cloudflare_relay
    runs-on: ${{ inputs.linux_runner != '' && inputs.linux_runner || vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: "1.91.0"
    permissions:
      contents: read
    defaults:
      run:
        working-directory: cmux-tui/relays/cloudflare-do
    steps:
      - name: Checkout caller ref
        if: inputs.checkout_ref == ''
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Checkout requested ref
        if: inputs.checkout_ref != ''
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ inputs.checkout_ref }}

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22.14.0"
          cache: npm
          cache-dependency-path: cmux-tui/relays/cloudflare-do/package-lock.json

      - name: Install pinned Rust toolchain and Worker builder
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component clippy --target wasm32-unknown-unknown
          cargo install --locked worker-build@0.8.5

      - name: Install pinned npm dependencies
        run: npm ci --no-audit --no-fund

      - name: Test and lint relay
        run: |
          python3 tests/validate_wrangler_config.py
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings

      - name: Audit npm dependencies
        run: npm audit --audit-level=high

      - name: Build Worker
        run: npm run build

      - name: Validate Wrangler deployment bundle
        run: npx --no-install wrangler deploy --dry-run --outdir "$RUNNER_TEMP/cmux-cloudflare-relay"

  build-windows:
    name: build x86_64-pc-windows-gnu
    if: inputs.include_windows
    runs-on: ${{ inputs.windows_runner != '' && inputs.windows_runner || vars.WINDOWS_RUNNER || 'windows-latest' }}
    timeout-minutes: 60
    env:
      CARGO_TARGET_X86_64_PC_WINDOWS_GNU_RUSTFLAGS: -C link-arg=-fuse-ld=lld
    permissions:
      contents: read
    steps:
      - name: Checkout caller ref
        if: inputs.checkout_ref == ''
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Checkout requested ref
        if: inputs.checkout_ref != ''
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ inputs.checkout_ref }}

      - name: Init ghostty submodule
        run: git submodule update --init --depth 1 ghostty

      - name: Resolve Ghostty Zig version
        id: ghostty-zig-version
        shell: bash
        run: |
          version="$(bash ./scripts/ghostty-zig-version.sh)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install zig
        uses: mlugg/setup-zig@8d6198c65fb0feaa111df26e6b467fea8345e46f # v2.0.5
        with:
          version: ${{ steps.ghostty-zig-version.outputs.version }}

      - name: Set up pinned Rust
        uses: ./.github/actions/setup-cmux-tui-rust

      - name: Install Rust target
        shell: bash
        run: |
          rustup target add x86_64-pc-windows-gnu
          printf '%s\n' 'C:\msys64\mingw64\bin' >> "$GITHUB_PATH"

      - name: Verify LLVM GNU linker
        shell: bash
        run: ld.lld --version

      - name: Build libghostty-vt + cmux-tui (Windows GNU)
        env:
          CMUX_TUI_DISTRIBUTION_VERSION: ${{ inputs.version }}
          PACKAGE_NPM: ${{ inputs.package_npm }}
        shell: bash
        run: |
          # Keep the manual Zig build and Cargo's build script on the same
          # checked-out Ghostty source whose revision is stamped below.
          unset CMUX_GHOSTTY_SRC
          CMUX_TUI_BUILD_COMMIT="$(git rev-parse HEAD)"
          CMUX_TUI_GHOSTTY_COMMIT="$(git -C ghostty rev-parse HEAD)"
          export CMUX_TUI_BUILD_COMMIT CMUX_TUI_GHOSTTY_COMMIT CMUX_TUI_DISTRIBUTION_VERSION
          if [[ "$PACKAGE_NPM" == "true" ]]; then
            CMUX_TUI_NPM_BOOTSTRAP_VERSION="$CMUX_TUI_DISTRIBUTION_VERSION"
            export CMUX_TUI_NPM_BOOTSTRAP_VERSION
          fi
          cd ghostty
          zig build -Demit-lib-vt=true -Demit-xcframework=false -Doptimize=ReleaseFast -Dtarget=x86_64-windows-gnu --prefix "$RUNNER_TEMP/ghostty-vt-win-gnu"
          cd ../cmux-tui
          cargo build -p cmux-tui --bin cmux-tui --bin cmux-tui-hook --release --locked --target x86_64-pc-windows-gnu

      - name: Prepare owned Windows native test temp root
        shell: pwsh
        run: |
          Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;

          public static class NativeDirectory {
              [DllImport("kernel32.dll", CharSet = CharSet.Unicode, SetLastError = true)]
              [return: MarshalAs(UnmanagedType.Bool)]
              public static extern bool CreateDirectoryW(string path, IntPtr securityAttributes);
          }
          '@
          $localAppData = [IO.Path]::GetFullPath($env:LOCALAPPDATA).TrimEnd([IO.Path]::DirectorySeparatorChar)
          $originalTemp = $env:TEMP
          $originalTmp = $env:TMP
          if ([string]::IsNullOrWhiteSpace($originalTemp) -or [string]::IsNullOrWhiteSpace($originalTmp)) {
            throw "The Windows runner must define TEMP and TMP"
          }
          $createdTemp = $false
          try {
            for ($attempt = 0; $attempt -lt 32; $attempt++) {
              # Keep the owned root short enough for Windows AF_UNIX test sockets.
              $testTempName = "c$([guid]::NewGuid().ToString('N').Substring(0, 7))"
              $candidate = [IO.Path]::GetFullPath((Join-Path $localAppData $testTempName))
              if (-not $candidate.StartsWith("$localAppData$([IO.Path]::DirectorySeparatorChar)", [StringComparison]::OrdinalIgnoreCase)) {
                throw "Native Windows test temp root escaped LOCALAPPDATA: $candidate"
              }
              if ([NativeDirectory]::CreateDirectoryW($candidate, [IntPtr]::Zero)) {
                $testTemp = $candidate
                $createdTemp = $true
                break
              }
              $errorCode = [Runtime.InteropServices.Marshal]::GetLastWin32Error()
              if ($errorCode -ne 183) {
                throw "Could not create the Windows native test temp root (error $errorCode)"
              }
            }
            if (-not $createdTemp) {
              throw "Could not reserve a unique Windows native test temp root"
            }

            $ownerMarker = Join-Path $testTemp ".cmux-ci-owner-$([guid]::NewGuid().ToString('N'))"
            $marker = [IO.File]::Open($ownerMarker, [IO.FileMode]::CreateNew, [IO.FileAccess]::Write, [IO.FileShare]::None)
            $marker.Dispose()
            $env:TEMP = $testTemp
            $env:TMP = $testTemp
            $env:CMUX_EXPECTED_TEMP_ROOT = $testTemp

            $probeSource = Join-Path $testTemp "temp-dir-probe.rs"
            $probeBinary = Join-Path $testTemp "temp-dir-probe.exe"
            @'
          use std::path::PathBuf;

          fn comparable(path: PathBuf) -> String {
              path.to_string_lossy()
                  .replace('/', "\\")
                  .trim_end_matches('\\')
                  .to_lowercase()
          }

          fn main() {
              let temp = std::env::temp_dir();
              let local = std::env::var_os("LOCALAPPDATA")
                  .map(PathBuf::from)
                  .expect("LOCALAPPDATA must be set");
              let expected = std::env::var_os("CMUX_EXPECTED_TEMP_ROOT")
                  .map(PathBuf::from)
                  .expect("CMUX_EXPECTED_TEMP_ROOT must be set");
              let temp_key = comparable(temp.clone());
              let local_key = comparable(local);
              let expected_key = comparable(expected);
              let is_inside = temp_key == local_key
                  || temp_key.starts_with(&(local_key.clone() + "\\"));
              assert!(
                  is_inside,
                  "std::env::temp_dir() escaped LOCALAPPDATA: {}",
                  temp.display()
              );
              assert_eq!(
                  temp_key,
                  expected_key,
                  "std::env::temp_dir() did not use the owned test root"
              );
              println!("std::env::temp_dir()={}", temp.display());
          }
          '@ | Set-Content -LiteralPath $probeSource -Encoding utf8
            rustc --target x86_64-pc-windows-gnu $probeSource -o $probeBinary
            & $probeBinary
            if ($LASTEXITCODE -ne 0) {
              throw "Rust temp directory probe failed with exit code $LASTEXITCODE"
            }
            Remove-Item Env:CMUX_EXPECTED_TEMP_ROOT
            @(
              "CMUX_WINDOWS_NATIVE_TEST_TEMP=$testTemp"
              "CMUX_WINDOWS_NATIVE_TEST_OWNER_MARKER=$ownerMarker"
              "CMUX_WINDOWS_NATIVE_TEST_ORIGINAL_TEMP=$originalTemp"
              "CMUX_WINDOWS_NATIVE_TEST_ORIGINAL_TMP=$originalTmp"
              "TEMP=$testTemp"
              "TMP=$testTemp"
            ) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          } catch {
            if ($createdTemp -and (Test-Path -LiteralPath $testTemp)) {
              Remove-Item -LiteralPath $testTemp -Recurse -Force -ErrorAction Stop
            }
            throw
          }

      - name: Verify native Windows remote probe
        shell: bash
        run: |
          output="$(cmux-tui/target/x86_64-pc-windows-gnu/release/cmux-tui.exe remote-probe --json)"
          printf '%s\n' "$output"
          python -c 'import json,sys; probe=json.load(sys.stdin); assert probe["app"] == "cmux-tui"; assert probe["os"] == "windows"' <<<"$output"

      - name: Verify native Windows remote startup is bounded
        shell: bash
        run: |
          set +e
          output="$(timeout 15s cmux-tui/target/x86_64-pc-windows-gnu/release/cmux-tui.exe remote-link --stdio --session ci-smoke </dev/null 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -ne 124
          if [[ "$status" -ne 0 ]]; then
            # Hosted Windows jobs forbid process breakaway. Production must
            # fail instead of starting an owner that dies with its carrier.
            grep -F "could not start Windows mux owner: Access is denied" <<<"$output"
          fi
          if [[ "$status" -eq 0 ]]; then
            cmux-tui/target/x86_64-pc-windows-gnu/release/cmux-tui.exe remote-stop --session ci-smoke
          fi

      - name: Verify native Windows SSH through hosted OpenSSH
        shell: pwsh
        run: |
          cmux-tui/scripts/smoke-windows-native-ssh.ps1 `
            -Binary cmux-tui/target/x86_64-pc-windows-gnu/release/cmux-tui.exe

      - name: Verify native Windows ConPTY terminal
        shell: bash
        run: cmux-tui/scripts/smoke-windows-native.sh cmux-tui/target/x86_64-pc-windows-gnu/release/cmux-tui.exe

      - name: Run native Windows tests
        shell: pwsh
        run: |
          Remove-Item Env:CMUX_GHOSTTY_SRC -ErrorAction SilentlyContinue
          Set-Location cmux-tui
          $failedSuites = @()

          # Preserve the complete Windows-native test commands from the owner branch.
          cargo test --workspace --exclude cmux-sdk --exclude cmux-sidebar --exclude cmux-terminal-client --exclude cmux-tui-core --exclude cmux-tui --locked --target x86_64-pc-windows-gnu
          if ($LASTEXITCODE -ne 0) {
            $failedSuites += "workspace"
          }
          cargo test -p cmux-tui-core --lib --locked --target x86_64-pc-windows-gnu windows
          if ($LASTEXITCODE -ne 0) {
            $failedSuites += "core Windows"
          }
          cargo test -p cmux-tui --bin cmux-tui --locked --target x86_64-pc-windows-gnu windows
          if ($LASTEXITCODE -ne 0) {
            $failedSuites += "TUI unit"
          }
          cargo test -p cmux-tui --test cli --locked --target x86_64-pc-windows-gnu local_and_authenticated_remote_namespaces_do_not_cross_target
          if ($LASTEXITCODE -ne 0) {
            $failedSuites += "remote help"
          }
          cargo test -p cmux-tui --bin cmux-tui --locked --target x86_64-pc-windows-gnu config_overrides_defaults
          if ($LASTEXITCODE -ne 0) {
            $failedSuites += "configuration defaults"
          }
          cargo test -p cmux-tui --test windows_remote_owner --locked --target x86_64-pc-windows-gnu
          if ($LASTEXITCODE -ne 0) {
            $failedSuites += "remote owner"
          }
          if ($failedSuites.Count -ne 0) {
            throw "Native Windows test suites failed: $($failedSuites -join ', ')"
          }

      - name: Verify long Windows state path
        shell: bash
        run: |
          python cmux-tui/scripts/smoke-windows-long-state-path.py \
            --binary cmux-tui/target/x86_64-pc-windows-gnu/release/cmux-tui.exe

      - name: Verify Windows terminal process exit
        shell: bash
        run: |
          python cmux-tui/scripts/smoke-windows-process-wait.py \
            --binary cmux-tui/target/x86_64-pc-windows-gnu/release/cmux-tui.exe

      - name: Set up Python for ConPTY verification
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12.10"

      - name: Verify Windows ConPTY resize
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --require-hashes \
            -r cmux-tui/scripts/requirements-windows-conpty.txt
          python cmux-tui/scripts/smoke-windows-conpty-resize.py \
            --binary cmux-tui/target/x86_64-pc-windows-gnu/release/cmux-tui.exe

      - name: Stage binary
        shell: bash
        run: |
          mkdir -p dist
          cp "cmux-tui/target/x86_64-pc-windows-gnu/release/cmux-tui.exe" "dist/cmux-tui-x86_64-pc-windows-gnu.exe"
          cp "cmux-tui/target/x86_64-pc-windows-gnu/release/cmux-tui-hook.exe" "dist/cmux-tui-hook-x86_64-pc-windows-gnu.exe"
          ls -la dist

      - name: Upload binary artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cmux-tui-x86_64-pc-windows-gnu
          path: |
            dist/cmux-tui-x86_64-pc-windows-gnu.exe
            dist/cmux-tui-hook-x86_64-pc-windows-gnu.exe
          if-no-files-found: error

      - name: Clean owned Windows native test temp root
        if: ${{ always() }}
        shell: pwsh
        run: |
          $testTemp = $env:CMUX_WINDOWS_NATIVE_TEST_TEMP
          if ([string]::IsNullOrWhiteSpace($testTemp)) {
            return
          }

          $localAppData = [IO.Path]::GetFullPath($env:LOCALAPPDATA).TrimEnd([IO.Path]::DirectorySeparatorChar)
          $testTemp = [IO.Path]::GetFullPath($testTemp).TrimEnd([IO.Path]::DirectorySeparatorChar)
          $parent = [IO.Path]::GetDirectoryName($testTemp)
          $leaf = [IO.Path]::GetFileName($testTemp)
          if (-not $parent.Equals($localAppData, [StringComparison]::OrdinalIgnoreCase)) {
            throw "Refusing to clean Windows temp root outside LOCALAPPDATA: $testTemp"
          }
          if ($leaf -notmatch '^c[0-9a-f]{7}$') {
            throw "Refusing to clean an unowned Windows temp root: $testTemp"
          }
          $ownerMarker = [IO.Path]::GetFullPath($env:CMUX_WINDOWS_NATIVE_TEST_OWNER_MARKER)
          $markerParent = [IO.Path]::GetDirectoryName($ownerMarker)
          $markerLeaf = [IO.Path]::GetFileName($ownerMarker)
          if (-not $markerParent.Equals($testTemp, [StringComparison]::OrdinalIgnoreCase)) {
            throw "Refusing to clean a Windows temp root without its exact ownership marker"
          }
          if ($markerLeaf -notmatch '^\.cmux-ci-owner-[0-9a-f]{32}$' -or -not (Test-Path -LiteralPath $ownerMarker -PathType Leaf)) {
            throw "Refusing to clean a Windows temp root without its job ownership marker"
          }
          $originalTemp = $env:CMUX_WINDOWS_NATIVE_TEST_ORIGINAL_TEMP
          $originalTmp = $env:CMUX_WINDOWS_NATIVE_TEST_ORIGINAL_TMP
          if ([string]::IsNullOrWhiteSpace($originalTemp) -or [string]::IsNullOrWhiteSpace($originalTmp)) {
            throw "Refusing to clean without the original Windows TEMP and TMP values"
          }
          @(
            "TEMP=$originalTemp"
            "TMP=$originalTmp"
            "CMUX_WINDOWS_NATIVE_TEST_TEMP="
            "CMUX_WINDOWS_NATIVE_TEST_OWNER_MARKER="
            "CMUX_WINDOWS_NATIVE_TEST_ORIGINAL_TEMP="
            "CMUX_WINDOWS_NATIVE_TEST_ORIGINAL_TMP="
          ) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          if (Test-Path -LiteralPath $testTemp) {
            Remove-Item -LiteralPath $testTemp -Recurse -Force -ErrorAction Stop
          }

  package:
    name: package distributions
    needs:
      - build
      - build-windows
    if: inputs.include_windows && (inputs.package_npm || inputs.package_pypi)
    runs-on: ${{ inputs.linux_runner != '' && inputs.linux_runner || vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      NPM_VERSION: ${{ inputs.version }}
      PYPI_VERSION: ${{ inputs.pypi_version != '' && inputs.pypi_version || inputs.version }}
    steps:
      - name: Checkout caller ref
        if: inputs.checkout_ref == ''
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Checkout requested ref
        if: inputs.checkout_ref != ''
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ inputs.checkout_ref }}

      - name: Download darwin arm64 binary
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: cmux-tui-aarch64-apple-darwin
          path: dist/binaries

      - name: Download darwin x64 binary
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: cmux-tui-x86_64-apple-darwin
          path: dist/binaries

      - name: Download linux x64 binary
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: cmux-tui-x86_64-unknown-linux-musl
          path: dist/binaries

      - name: Download linux arm64 binary
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: cmux-tui-aarch64-unknown-linux-musl
          path: dist/binaries

      - name: Download Windows companion binary
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: cmux-tui-x86_64-pc-windows-gnu
          path: dist/binaries

      - name: Build npm package directories
        if: inputs.package_npm
        run: |
          python3 cmux-tui/dist/scripts/package_npm.py \
            --binaries-dir dist/binaries \
            --version "$NPM_VERSION" \
            --out dist/npm-packages

      - name: Build PyPI wheels
        if: inputs.package_pypi
        run: |
          python3 cmux-tui/dist/scripts/package_pypi.py \
            --binaries-dir dist/binaries \
            --version "$PYPI_VERSION" \
            --out dist/pypi-wheels

      - name: Smoke verify npm packages
        if: inputs.package_npm
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import stat
          import sys

          version = os.environ["NPM_VERSION"]
          root = pathlib.Path("dist/npm-packages")
          platforms = {
              "cmux-tui-darwin-arm64": ("darwin", "arm64"),
              "cmux-tui-darwin-x64": ("darwin", "x64"),
              "cmux-tui-linux-x64": ("linux", "x64"),
              "cmux-tui-linux-arm64": ("linux", "arm64"),
          }
          launcher = json.loads((root / "cmux" / "package.json").read_text())
          deps = launcher.get("optionalDependencies", {})
          if deps != {name: version for name in platforms}:
              print(f"optionalDependencies mismatch: {deps}", file=sys.stderr)
              raise SystemExit(1)
          companion = root / "cmux" / "bin" / "cmux-tui-x86_64-pc-windows-gnu.exe"
          if not companion.is_file():
              raise SystemExit(f"missing Windows companion: {companion}")
          for name, (os_name, cpu) in platforms.items():
              package_json = json.loads((root / name / "package.json").read_text())
              if package_json["version"] != version:
                  raise SystemExit(f"{name}: version mismatch")
              if package_json["os"] != [os_name] or package_json["cpu"] != [cpu]:
                  raise SystemExit(f"{name}: os/cpu mismatch")
              binary = root / name / "bin" / "cmux-tui"
              if not binary.stat().st_mode & stat.S_IXUSR:
                  raise SystemExit(f"{binary} is not executable")
              hook = root / name / "bin" / "cmux-tui-hook"
              if not hook.stat().st_mode & stat.S_IXUSR:
                  raise SystemExit(f"{hook} is not executable")
          PY
          chmod +x dist/binaries/cmux-tui-x86_64-unknown-linux-musl
          dist/binaries/cmux-tui-x86_64-unknown-linux-musl --version >/tmp/cmux-tui-version.txt 2>&1 || \
            dist/binaries/cmux-tui-x86_64-unknown-linux-musl --help >/tmp/cmux-tui-version.txt 2>&1
          CMUX_TUI_PROBE="$(dist/binaries/cmux-tui-x86_64-unknown-linux-musl remote-probe --json)"
          CMUX_TUI_EXPECTED_BUILD_IDENTITY="$(git rev-parse HEAD)"
          export CMUX_TUI_PROBE CMUX_TUI_EXPECTED_BUILD_IDENTITY
          python3 - <<'PY'
          import json
          import os

          probe = json.loads(os.environ["CMUX_TUI_PROBE"])
          expected = os.environ["NPM_VERSION"]
          expected_identity = os.environ["CMUX_TUI_EXPECTED_BUILD_IDENTITY"]
          if probe.get("build_identity") != expected_identity:
              raise SystemExit(
                  f"binary build identity {probe.get('build_identity')!r} "
                  f"!= {expected_identity!r}"
              )
          if probe.get("distribution_version") != expected:
              raise SystemExit(
                  f"binary distribution version {probe.get('distribution_version')!r} != {expected!r}"
              )
          if probe.get("npm_bootstrap_version") != expected:
              raise SystemExit(
                  f"binary npm bootstrap version {probe.get('npm_bootstrap_version')!r} != {expected!r}"
              )
          PY

      - name: Archive npm package directories with executable modes
        if: inputs.package_npm
        run: |
          python3 cmux-tui/dist/scripts/package_npm_artifact.py create \
            --packages-dir dist/npm-packages \
            --archive dist/npm-packages.tar.gz

      - name: Smoke verify PyPI wheels
        if: inputs.package_pypi
        run: |
          set -euo pipefail
          for wheel in dist/pypi-wheels/*.whl; do
            python3 -m zipfile -l "$wheel" >"/tmp/$(basename "$wheel").list"
            grep -F "cmux_tui/bin/cmux-tui-x86_64-pc-windows-gnu.exe" \
              "/tmp/$(basename "$wheel").list"
          done
          python3 - <<'PY'
          import glob
          import stat
          import zipfile

          for path in glob.glob("dist/pypi-wheels/*.whl"):
              with zipfile.ZipFile(path) as wheel:
                  info = wheel.getinfo("cmux_tui/bin/cmux-tui-hook")
                  mode = info.external_attr >> 16
                  if not mode & stat.S_IXUSR:
                      raise SystemExit(f"{path}: bundled cmux-tui-hook is not executable")
          PY
          chmod +x dist/binaries/cmux-tui-x86_64-unknown-linux-musl
          dist/binaries/cmux-tui-x86_64-unknown-linux-musl --version >/tmp/cmux-tui-version.txt 2>&1 || \
            dist/binaries/cmux-tui-x86_64-unknown-linux-musl --help >/tmp/cmux-tui-version.txt 2>&1
          python3 -m venv /tmp/cmux-tui-wheel-smoke
          /tmp/cmux-tui-wheel-smoke/bin/python -m pip install --no-index --find-links dist/pypi-wheels cmux=="$PYPI_VERSION"
          /tmp/cmux-tui-wheel-smoke/bin/cmux --help >/tmp/cmux-help.txt
          grep -i usage /tmp/cmux-help.txt

      - name: Upload npm package directories
        if: inputs.package_npm
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-packages
          path: dist/npm-packages.tar.gz
          if-no-files-found: error

      - name: Upload PyPI wheels
        if: inputs.package_pypi
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pypi-wheels
          path: dist/pypi-wheels/*.whl
          if-no-files-found: error

  verify-linux-packages:
    name: verify Linux package entrypoints (${{ matrix.architecture }})
    needs:
      - plan-build
      - package
    if: ${{ inputs.package_npm || inputs.package_pypi }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan-build.outputs.linux_package_matrix) }}
    env:
      PYPI_VERSION: ${{ inputs.pypi_version != '' && inputs.pypi_version || inputs.version }}
    steps:
      - name: Checkout caller ref
        if: inputs.checkout_ref == ''
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Checkout requested ref
        if: inputs.checkout_ref != ''
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ inputs.checkout_ref }}

      - name: Download npm package archive
        if: inputs.package_npm
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: npm-packages
          path: dist

      - name: Restore npm package directories
        if: inputs.package_npm
        run: |
          python3 cmux-tui/dist/scripts/package_npm_artifact.py extract \
            --archive dist/npm-packages.tar.gz \
            --out dist

      - name: Download PyPI wheels
        if: inputs.package_pypi
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: pypi-wheels
          path: dist/pypi-wheels

      - name: Test Linux distributions
        env:
          PACKAGE_NPM: ${{ inputs.package_npm }}
          PACKAGE_PYPI: ${{ inputs.package_pypi }}
        run: |
          set -euo pipefail
          args=(--version "$PYPI_VERSION")
          if [[ "$PACKAGE_NPM" == "true" ]]; then
            args+=(--npm-packages dist/npm-packages)
          fi
          if [[ "$PACKAGE_PYPI" == "true" ]]; then
            args+=(--pypi-wheels dist/pypi-wheels)
          fi
          python3 cmux-tui/dist/scripts/test_linux_packages.py \
            --architecture "${{ matrix.architecture }}" \
            "${args[@]}"
