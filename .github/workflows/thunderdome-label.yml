name: thunderdome label

# Labels every thunderdome pull request `thunderdome` (a title that names the thunderdome, any
# case), so Leo and the team can pull them all up later, once their pictures are in, and compare
# the variants. Leo, 2026-11-05: "give them, like, a label or something for me to, like, review
# later on when the pictures all get there so that I can look at them, so that the team can look
# at them."
#
# A convenience label, never a gate: nothing reads it to hold or land a pull request.
# This copy must stay on main: GitHub runs a pull_request_target workflow from the default branch,
# so the feat-cmux-next copy alone (#36469) never ran, even for pull requests into feat-cmux-next.
# pull_request_target so fork pull requests can be labeled. It never checks out or runs the pull
# request's code: it reads the title and labels from the event and makes one label call.
# The push trigger fires once, when this file lands on main, and backfills the open thunderdome
# pull requests no event has labeled yet (#36859, #36885 and #36930 when it was added).

on:
  pull_request_target:
    branches: [feat-cmux-next, main]
    # No synchronize: the label follows the title, and a push changes no title (it started about
    # 3,000 skipped runs a day, 2026-11-20).
    types: [opened, reopened, edited]
  push:
    branches: [main]
    paths: [.github/workflows/thunderdome-label.yml]

permissions: {}

concurrency:
  group: thunderdome-label-${{ github.event.pull_request.number || 'backfill' }}
  cancel-in-progress: true

env:
  # Temporary REST budget attribution: one gh-call line per GitHub API call (scripts/ci/api_call_log/env.sh, fetched at a fixed commit when the checkout has no copy).
  BASH_ENV: '$({ w="${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh"; t="${RUNNER_TEMP:-/nonexistent}/api-call-log-src"; if [ -f "$w" ]; then echo "$w"; elif [ -n "${RUNNER_TEMP:-}" ]; then if [ ! -f "$t/env.sh" ] && [ ! -e "$t.tried" ] && { [ "${RUNNER_OS:-}" = Linux ] || [ "${RUNNER_OS:-}" = macOS ]; } && [ "$(date -u +%Y%m%d%H)" -lt 2026112300 ]; then : > "$t.tried"; mkdir -p "$t.part" && for x in env.sh gh sitecustomize.py isolated.py; do curl -fsSL --max-time 5 -o "$t.part/$x" "https://raw.githubusercontent.com/manaflow-ai/cmux/27647ffd3ae838c63be28ca3e5883dcd68c34518/scripts/ci/api_call_log/$x" || break; done; [ -s "$t.part/isolated.py" ] && mv "$t.part" "$t"; fi; if [ -f "$t/env.sh" ]; then echo "$t/env.sh"; else echo unset BASH_ENV > "$t.off.sh" && echo "$t.off.sh"; fi; fi; } 2>/dev/null)'

jobs:
  label:
    if: >-
      github.event_name == 'pull_request_target' &&
      contains(github.event.pull_request.title, 'thunderdome') &&
      !contains(github.event.pull_request.labels.*.name, 'thunderdome')
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.CI_PR_CONTROL_SKIP_FLEET != '1' && 'cmux-gcp-pr-control-jit-x64' || contains(fromJSON('["blacksmith-2vcpu-ubuntu-2404","blacksmith-4vcpu-ubuntu-2404","cmux-gcp-secret-jit-x64"]'), vars.CI_TRUSTED_RUNNER) && vars.CI_TRUSTED_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }} # ephemeral-required: trusted pull-request-write token; CI_TRUSTED_RUNNER picks the Blacksmith size
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Add the thunderdome label
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # The label exists; it is created only when adding it fails (a deleted label).
          gh pr edit "$NUMBER" --repo "$REPO" --add-label thunderdome ||
            { gh label create thunderdome --repo "$REPO" --color D93F0B \
                --description "A thunderdome variant: Leo and the team review these once their pictures are in" 2>/dev/null || true
              gh pr edit "$NUMBER" --repo "$REPO" --add-label thunderdome; }

  backfill:
    if: github.event_name == 'push'
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.CI_PR_CONTROL_SKIP_FLEET != '1' && 'cmux-gcp-pr-control-jit-x64' || contains(fromJSON('["blacksmith-2vcpu-ubuntu-2404","blacksmith-4vcpu-ubuntu-2404","cmux-gcp-secret-jit-x64"]'), vars.CI_TRUSTED_RUNNER) && vars.CI_TRUSTED_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }} # ephemeral-required: trusted pull-request-write token; CI_TRUSTED_RUNNER picks the Blacksmith size
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Label the open thunderdome pull requests that lack it
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh pr list --repo "$REPO" --state open --limit 200 \
              --search 'thunderdome in:title -label:thunderdome' --json number --jq '.[].number' |
            while read -r number; do
              echo "labeling #$number"
              gh pr edit "$number" --repo "$REPO" --add-label thunderdome
            done
