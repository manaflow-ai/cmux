name: thunderdome label

# Labels every thunderdome pull request `thunderdome` (a title that names the thunderdome, any
# case), so Leo and the team can pull them all up later, once their pictures are in, and compare
# the variants. Leo, 2026-11-05: "give them, like, a label or something for me to, like, review
# later on when the pictures all get there so that I can look at them, so that the team can look
# at them."
#
# A convenience label, never a gate: nothing reads it to hold or land a pull request.
# pull_request_target so fork pull requests can be labeled. It never checks out or runs the pull
# request's code: it reads the title and labels from the event and makes one label call.

on:
  pull_request_target:
    branches: [feat-cmux-next, main]
    # No synchronize: the label follows the title, and a push changes no title (it started about
    # 3,000 skipped runs a day, 2026-11-20).
    types: [opened, reopened, edited]

permissions: {}

concurrency:
  group: thunderdome-label-${{ github.event.pull_request.number }}${{ github.event.action == 'edited' && !github.event.changes.title && !github.event.changes.base && format('-edit-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  label:
    # An edit re-labels only when it changed the title or the base; a description edit starts no runner
    # (tests/test_ci_edit_events_start_no_runner.py).
    if: >-
      contains(github.event.pull_request.title, 'thunderdome') &&
      !contains(github.event.pull_request.labels.*.name, 'thunderdome') &&
      (github.event.action != 'edited' || github.event.changes.title || github.event.changes.base)
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || contains(fromJSON('["blacksmith-2vcpu-ubuntu-2404","blacksmith-4vcpu-ubuntu-2404"]'), vars.CI_TRUSTED_RUNNER) && vars.CI_TRUSTED_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }} # ephemeral-required: trusted pull-request-write token; CI_TRUSTED_RUNNER picks the Blacksmith size
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Add the thunderdome label
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # The label exists; it is created only when adding it fails (a deleted label).
          gh pr edit "$NUMBER" --repo "$REPO" --add-label thunderdome ||
            { gh label create thunderdome --repo "$REPO" --color D93F0B \
                --description "A thunderdome variant: Leo and the team review these once their pictures are in" 2>/dev/null || true
              gh pr edit "$NUMBER" --repo "$REPO" --add-label thunderdome; }
