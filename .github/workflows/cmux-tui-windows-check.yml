name: cmux-tui Windows check

# A fast compile check of cmux-tui-core and the cmux-tui bins for
# x86_64-pc-windows-gnu, cross-compiled on Linux. Two feat-cmux-next landings
# broke the Windows build on 2026-10-08 and only the dispatch-only full-mode
# cmux-tui.yml run (test (windows)) caught them hours later. This runs on every
# same-repository pull request into feat-cmux-next that touches cmux-tui, so a
# unix-only item is caught within minutes, before it lands; the base push's
# cmux-tui artifacts run builds the Windows daemon after it lands. It used to
# run on pushes to feat-cmux-next-* side branches, which also started it for
# side branches with no pull request (the 2026-10-27 push flood).
# Cut from pull requests on 2026-11-21 (ci-time-map: not required on main, 82% red on base breakage, ~6.9k runner-min a day,
# and no Windows release ships). It stays runnable on workflow_dispatch (a schedule would need a copy on main).
on:
  workflow_dispatch:

concurrency:
  group: cmux-tui-windows-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # libghostty-vt always builds from the ghostty-next gitlink: an empty
  # value overrides any runner-level CMUX_GHOSTTY_SRC (build.rs treats it
  # as unset).
  CMUX_GHOSTTY_SRC: ""
  GHOSTTY_ZIG_SOURCE: ghostty-next

jobs:
  route:
    name: route (crate graph)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || fromJSON(vars.RUNNER_POOLS).linux }}
    timeout-minutes: 5
    outputs:
      windows_gnu_check: ${{ steps.graph.outputs.windows_gnu_check }}
      windows_gnu_check_tree: ${{ steps.graph.outputs.windows_gnu_check_tree }}
    steps:
      # The merge commit and its parents: HEAD^1 is the base the pull request merges into.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 2

      # Jobs routed by the crate graph (scripts/ci/affected_jobs.py, scripts/ci/affected-jobs.json): each runs
      # when the change touches an input of a crate it builds (the crate, its path dependencies with their
      # features, the files their sources name) or of its own steps. A push, a dispatch, the full-ci label, a
      # change to the router and a cmux-tui path it cannot place run every job; so does a failed router (the
      # jobs read `!= 'false'`).
      - name: Which jobs can the change affect (crate graph)
        id: graph
        env:
          EVENT_NAME: ${{ github.event_name }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          base=""
          if [[ "$EVENT_NAME" == pull_request ]]; then
            base=$(git rev-parse HEAD^1 2>/dev/null || true)
          fi
          python3 scripts/ci/affected_jobs.py route --workflow .github/workflows/cmux-tui-windows-check.yml \
            --base "$base" --head HEAD --event "$EVENT_NAME" --labels "${LABELS:-[]}"

  windows-gnu-check:
    name: cargo check (x86_64-pc-windows-gnu)
    # Forks never ran this (it was push-only), so its runner pool stays
    # for this repository's own branches. It runs by the crate graph (the route job); a failed
    # router never skips it.
    needs: route
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (needs.route.result != 'success' || needs.route.outputs.windows_gnu_check != 'false') }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || !startsWith(vars.LINUX_RUNNER, 'blacksmith-') && vars.LINUX_RUNNER || vars.CI_CLOUD_OVERFLOW_SAVED && fromJSON(vars.RUNNER_POOLS).linux_16 || fromJSON(vars.RUNNER_POOLS).linux_8 }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      # A green result of this job for the same input tree (affected_jobs.py result_key) is this
      # run's result: the tested steps are skipped and the job reports green with that run named.
      - name: Reuse a green result for the same input tree
        id: tree
        uses: ./.github/actions/tree-result
        with:
          mode: restore
          job: windows-gnu-check
          key: ${{ needs.route.outputs.windows_gnu_check_tree }}

      - name: Init ghostty submodule
        if: ${{ steps.tree.outputs.hit != 'true' }}
        run: git submodule update --init --depth 1 ghostty-next

      - name: Install Linux and MinGW build dependencies
        if: ${{ steps.tree.outputs.hit != 'true' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev pkg-config gcc-mingw-w64-x86-64

      - name: Cache Zig package downloads
        if: ${{ steps.tree.outputs.hit != 'true' }}
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/zig
          key: cmux-tui-zig-${{ hashFiles('ghostty-next/build.zig.zon', 'ghostty-next/build.zig.zon.json') }}
          restore-keys: |
            cmux-tui-zig-

      - name: Install zig
        if: ${{ steps.tree.outputs.hit != 'true' }}
        run: ./scripts/install-zig-ci.sh

      - name: Fetch the ghostty-next Zig packages (cached, deadlined, retried)
        if: ${{ steps.tree.outputs.hit != 'true' }}
        uses: ./.github/actions/ghostty-zig-packages

      - name: Set up pinned Rust
        if: ${{ steps.tree.outputs.hit != 'true' }}
        uses: ./.github/actions/setup-cmux-tui-rust

      - name: Install the Windows GNU Rust target
        if: ${{ steps.tree.outputs.hit != 'true' }}
        run: rustup target add x86_64-pc-windows-gnu

      # One key for every pull request; each restores the newest cache its
      # scope can read and builds incrementally.
      - name: Cache cargo build
        if: ${{ steps.tree.outputs.hit != 'true' }}
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          workspaces: cmux-tui -> target
          shared-key: cmux-tui-windows-gnu-check

      - name: cargo check cmux-tui-core, cmux-tui and acpmux for Windows
        if: ${{ steps.tree.outputs.hit != 'true' }}
        working-directory: cmux-tui
        run: |
          set -o pipefail
          # cargo's output is kept so a stale Cargo.lock is named as such, not as a broken
          # Windows build (cargo-locks.py explain).
          log="$RUNNER_TEMP/windows-check.log"
          # The tests too, not only the libraries and bins: a unix-only test (std::os::unix,
          # libc::mkfifo) with no cfg landed through this check because it never compiled test
          # code, and then broke the Windows jobs that do (2026-11-16: cmux-tui.yml's test
          # (windows) checks acpmux --all-targets; cmux-tui-build-package.yml's long-path step
          # builds cmux-tui-core's lib tests). Each line is what one of those compiles.
          for targets in "-p cmux-tui-core -p cmux-tui -p acpmux" \
                         "-p acpmux --all-targets" \
                         "-p cmux-tui-core --lib --tests" \
                         "-p cmux-tui --lib --bins --tests"; do
            # shellcheck disable=SC2086 # $targets is a list of cargo arguments
            if ! cargo check --locked --target x86_64-pc-windows-gnu $targets 2>&1 | tee "$log"; then
              if python3 ../scripts/cmux-next/cargo-locks.py explain "$log"; then exit 1; fi
              echo "::error title=Windows build broken::cargo check --target x86_64-pc-windows-gnu $targets failed. A #[cfg(unix)] covers one item only; wrap whole blocks, and give Windows its own arm (a unix-only test gets #[cfg(unix)])."
              exit 1
            fi
          done

      - name: Record this green result for its input tree
        if: ${{ success() && steps.tree.outputs.hit != 'true' }}
        uses: ./.github/actions/tree-result
        with:
          mode: save
          job: windows-gnu-check
          key: ${{ needs.route.outputs.windows_gnu_check_tree }}
