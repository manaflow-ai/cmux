# Check-only coverage for the CloudDO migration to the tenant VM API.
# No live environments, migrations or deployments run from this workflow.
name: cmux VM Cloud adapter
on:
  push:
    branches: ["codex/vm-api-cloud-*"]
    paths: ["backend/**", "libs/vm-instance-identity/**", "workers/cmux-vm/sdk/**", "workers/cmux-vm/src/**", ".github/workflows/cmux-vm-cloud.yml"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    paths: ["workers/cmux-vm/sdk/**", "workers/cmux-vm/src/**", "libs/vm-instance-identity/**", "backend/apps/api/src/team-vm-api*", "backend/apps/api/test/team-vm-api*", ".github/workflows/cmux-vm-cloud.yml"]
permissions:
  contents: read
concurrency:
  group: vm-api-cloud-${{ github.event.pull_request.number || github.ref }}${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'feat-cmux-next' && (github.event.action == 'labeled' || github.event.action == 'unlabeled') && !contains(fromJSON('["full-ci","ready-to-land"]'), github.event.label.name) && format('-label-{0}', github.run_id) || '' }}
  # A newer push to a pull request supersedes its check; branch pushes still finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  # Temporary REST budget attribution: one gh-call line per GitHub API call (scripts/ci/api_call_log/env.sh, fetched at a fixed commit when the checkout has no copy).
  BASH_ENV: '$({ w="${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh"; t="${RUNNER_TEMP:-/nonexistent}/api-call-log-src"; if [ -f "$w" ]; then echo "$w"; elif [ -n "${RUNNER_TEMP:-}" ]; then if [ ! -f "$t/env.sh" ] && [ ! -e "$t.tried" ] && { [ "${RUNNER_OS:-}" = Linux ] || [ "${RUNNER_OS:-}" = macOS ]; } && [ "$(date -u +%Y%m%d%H)" -lt 2026112300 ]; then : > "$t.tried"; mkdir -p "$t.part" && for x in env.sh gh sitecustomize.py isolated.py; do curl -fsSL --max-time 5 -o "$t.part/$x" "https://raw.githubusercontent.com/manaflow-ai/cmux/27647ffd3ae838c63be28ca3e5883dcd68c34518/scripts/ci/api_call_log/$x" || break; done; [ -s "$t.part/isolated.py" ] && mv "$t.part" "$t"; fi; if [ -f "$t/env.sh" ]; then echo "$t/env.sh"; else echo unset BASH_ENV > "$t.off.sh" && echo "$t.off.sh"; fi; fi; } 2>/dev/null)'

jobs:
  check:
    if: ${{ (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci') || (github.event.pull_request.draft == true && (vars.CI_DRAFT_CHEAP_TIER || '1') == '0') || (github.event.pull_request.draft != true && (contains(github.event.pull_request.labels.*.name, 'ready-to-land') || github.event.pull_request.base.ref != 'feat-cmux-next' || github.event.pull_request.head.repo.full_name != github.repository || (vars.CI_LAND_TIER || '1') == '0'))) && !(github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'feat-cmux-next' && (github.event.action == 'labeled' || github.event.action == 'unlabeled') && !contains(fromJSON('["full-ci","ready-to-land"]'), github.event.label.name)) }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && (vars.CI_FORK_LINUX_RUNNER || 'ubuntu-24.04') || 'cmux-linux' }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend/apps/api
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Restore pinned Bun 1.4.4 from the CI cache bucket
        shell: bash
        continue-on-error: true
        run: bash "$GITHUB_WORKSPACE/scripts/ci/toolchain-r2.sh" restore bun 1.4.4 || true

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.4"
          no-cache: ${{ !startsWith(github.workspace, '/home/runner/work/') || !(github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && github.event_name != 'merge_group' && contains(fromJSON('["refs/heads/main","refs/heads/feat-cmux-next","refs/heads/nightly-next"]'), github.ref)) }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"
      - name: Cache Bun package cache
        timeout-minutes: 3
        continue-on-error: true
        if: ${{ (github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && github.event_name != 'merge_group' && contains(fromJSON('["refs/heads/main","refs/heads/feat-cmux-next","refs/heads/nightly-next"]'), github.ref)) }}
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.bun/install/cache
          key: bun-backend-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('backend/bun.lock') }}
          restore-keys: |
            bun-backend-${{ runner.os }}-${{ runner.arch }}-
      - name: Cache Bun package cache (restore only off base branches)
        timeout-minutes: 3
        continue-on-error: true
        if: ${{ !(github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && github.event_name != 'merge_group' && contains(fromJSON('["refs/heads/main","refs/heads/feat-cmux-next","refs/heads/nightly-next"]'), github.ref)) }}
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.bun/install/cache
          key: bun-backend-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('backend/bun.lock') }}
          restore-keys: |
            bun-backend-${{ runner.os }}-${{ runner.arch }}-
      - name: Install locked dependencies
        id: install
        working-directory: backend
        run: bash "$GITHUB_WORKSPACE/scripts/ci/bun-install.sh" --frozen-lockfile
      - name: API typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run typecheck
      - name: Protocol catalog and generated client drift
        id: catalog
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: backend
        run: |
          set -euo pipefail
          bun run catalog:export
          bun run catalog:client
          bun run catalog:rust
          paths=(catalog/cloud-operations.json ../clients/ts/cloud/src/generated.ts ../cmux-tui/crates/cmux-cloud-wire/src/generated)
          if [[ -n "$(git status --porcelain -- "${paths[@]}")" ]]; then
            git diff --stat -- "${paths[@]}"
            echo "::error::Protocol catalog or generated clients are stale; use the regenerated contract artifact"
            exit 1
          fi
      - name: Upload regenerated protocol contract
        if: ${{ failure() && steps.catalog.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-vm-cloud-contract-generated
          path: |
            backend/catalog/cloud-operations.json
            clients/ts/cloud/src/generated.ts
            cmux-tui/crates/cmux-cloud-wire/src/generated/*.rs
          retention-days: 7
      - name: Cloud tenant and adapter behavior
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run test -- test/team-vm-api
      - name: Existing Team VM binding behavior
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run test -- test/team-vm-bind.test.ts test/team-vm.test.ts test/team-vm-taint.test.ts test/team-vm-retired-fence.test.ts test/team-vm-export.test.ts
      - name: Existing server pairing and refusal recovery
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run test -- test/server-pairing.test.ts test/server-pairing-failures.test.ts
      - name: Backend source size
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: backend
        run: bun run lint:size
