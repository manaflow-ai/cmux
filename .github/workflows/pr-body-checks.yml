name: PR body checks

# The four feat-cmux-next pull request description lints, one runner for all of them. They were four
# workflows (pr-capture-check.yml, pr-design-spec-check.yml, pr-perf-section-check.yml,
# pr-cloud-backend-check.yml), each starting a Linux runner for a few seconds of Python: about 270,000
# runs and 69,000 runner-minutes in 14 days, with no failure. Each step here is the step its own
# workflow had, with its warn-only setting. The scripts and maps run from the base branch, never the
# pull request's code. They run on drafts and on a base-only update, as they did.
#
# A description edit no longer re-runs them (CI catch-value audit, 2026-11-26; Leo, 2026-11-25: "trim out
# vacuously true stuff"). Every step is advisory (ci/steps.toml `blocks = false`, the run step
# continue-on-error), so the job cannot go red on what it finds: its 319 red jobs from 2026-11-22 to
# 11-26 were all runner or checkout failures. Edits were all of its runs once pushes moved to
# pr-checks.yml: 3,507 jobs and 4,918 runner-minutes on 2026-11-25 alone, most from bots rewriting
# descriptions (Leo, 2026-11-17, on edits re-running checks: "why should it do that"). The next push
# re-lints the edited description in pr-checks.yml's advisory job.
#
# Pushes run in pr-checks.yml (CI v2 step 6, second cut). A push's lints are steps of pr-checks.yml's one
# advisory job, so a push starts one runner, not two (973 of these jobs a day in the 24 h to 2026-11-21T12Z,
# nearly all on pushes). This workflow keeps only the media-tour and perf labels, which change what the
# capture and perf lints ask for. GitHub cannot filter `on:` by label name, so a
# label trigger there would start a newer, skipped run of PR size, UI review, split-plan and link on every
# bot label toggle, and hide their answers. Both workflows run steps of the step table's `advisory` job,
# each naming its own with ci_steps.py --only.
#
# The job keeps the capture check's name first: cmuxterm-hq's next_autoland and base_red_watch read a job
# named pr-capture-check as the PR's own red. With a base whose table has the `capture` step, all four are
# advisory steps (ci/steps.toml) run together by scripts/ci/ci_steps.py, and only warn ("Advisory checks
# never block", CI v2); a base from before that runs the old capture step, which can go red (2 on bad input).
#
# Capture: a pull request that changes native app UI shows a real capture of it in its description
# (what `cmux-ci capture` prints, the media-tour label, or a `No capture: <why>` line); a capture or
# media-tour label also requires body proof that the after image was viewed and judged. It only warns
# and never fails (Leo, 2026-10-31: "WE DONT NEED F***ING SCREENSHOTS JUST LET ME TRY THE STUFF OUT").
#
# Design spec: a pull request that changes a UI surface's files cites the surface's design spec
# (.github/design-surfaces.json; 2026-10-28: #26071 replaced the model picker's harness tabs and nobody
# noticed). The map is the base branch's joined with the PR's (data only, from the merge commit), so a
# PR that moves a surface's files and maps the new paths is judged on both, and one that drops or
# shrinks the map is still judged by the base's.
#
# Perf section: a performance pull request (the perf label, or a perf word in its title or
# description; docs-only changes are exempt) records a `## Performance` table of before/after deltas,
# or a `No perf numbers: <why>` line. Advisory since the checks audit (Leo, 2026-11-01: "keep only
# what catches real breakage"; cmuxterm-hq#5745).
#
# Cloud backend: new cloud backend code goes to the private manaflow-ai/cmux-platform; a PR that adds
# or changes a path in .github/cloud-backend-paths.json gets a warning unless its description has a
# `cmux-platform:` line (Leo, 2026-10-31: "WHY DO WE HAVE SO MANY PRS IN CMUX INSTEAD OF
# CMUX-PLATFORM!?").
on:
  pull_request:
    branches: [feat-cmux-next]
    # A push (opened, synchronize, reopened, ready_for_review) runs these lints in pr-checks.yml's advisory job
    # (CI v2 step 6, second cut): this workflow keeps only the labels the lints read. No `edited`: see above.
    types: [labeled, unlabeled]

permissions: {}

# Into feat-cmux-next, a label event the checks do not read (anything but the media-tour and perf
# labels) skips the job and takes a concurrency group of its own, so it never cancels a real check in
# flight (tests/test_ci_label_events_skip_full_ci.py). Bots set and clear risk, hold and landing labels
# on hundreds of open pull requests, and each of those events queued a runner for the same answer.
concurrency:
  group: pr-body-checks-${{ github.event.pull_request.number }}${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'feat-cmux-next' && (github.event.action == 'labeled' || github.event.action == 'unlabeled') && !contains(fromJSON('["media-tour","media-tour-mac","perf","performance"]'), github.event.label.name) && format('-label-{0}', github.run_id) || '' }}
  cancel-in-progress: true

env:
  # Temporary REST budget attribution: one gh-call line per GitHub API call (scripts/ci/api_call_log/env.sh, fetched at a fixed commit when the checkout has no copy).
  BASH_ENV: '$({ w="${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh"; t="${RUNNER_TEMP:-/nonexistent}/api-call-log-src"; if [ -f "$w" ]; then echo "$w"; elif [ -n "${RUNNER_TEMP:-}" ]; then if [ ! -f "$t/env.sh" ] && [ ! -e "$t.tried" ] && { [ "${RUNNER_OS:-}" = Linux ] || [ "${RUNNER_OS:-}" = macOS ]; } && [ "$(date -u +%Y%m%d%H)" -lt 2026112300 ]; then : > "$t.tried"; mkdir -p "$t.part" && for x in env.sh gh sitecustomize.py isolated.py; do curl -fsSL --max-time 5 -o "$t.part/$x" "https://raw.githubusercontent.com/manaflow-ai/cmux/27647ffd3ae838c63be28ca3e5883dcd68c34518/scripts/ci/api_call_log/$x" || break; done; [ -s "$t.part/isolated.py" ] && mv "$t.part" "$t"; fi; if [ -f "$t/env.sh" ]; then echo "$t/env.sh"; else echo unset BASH_ENV > "$t.off.sh" && echo "$t.off.sh"; fi; fi; } 2>/dev/null)'

jobs:
  body:
    name: pr-capture-check, design spec, perf section, cloud backend
    if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'feat-cmux-next' && (github.event.action == 'labeled' || github.event.action == 'unlabeled') && !contains(fromJSON('["media-tour","media-tour-mac","perf","performance"]'), github.event.label.name)) }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || vars.CI_OVERFLOW_LINUX || 'cmux-linux' }}
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout the checks from the base branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: refs/heads/${{ github.event.pull_request.base.ref }}
          persist-credentials: false
          sparse-checkout: |
            scripts/ci/pr_capture_check.py
            scripts/cmux-next/media/path_map.py
            scripts/ci/pr_design_spec_check.py
            .github/design-surfaces.json
            scripts/ci/pr_perf_section_check.py
            scripts/ci/pr_cloud_backend_check.py
            .github/cloud-backend-paths.json
            ci/steps.toml
            scripts/ci/ci_steps.py
            .gitmodules
          sparse-checkout-cone-mode: false

      # The paths this pull request changes, from git rather than the files API (a call per 100 files
      # on each event: every push, label and description edit). The event's merge commit and its first
      # parent, the base, without blobs: two trees, read as data, never run. Only the merge of this head
      # counts; a stale or one-parent commit lists nothing. Each list is its own step with its own
      # `listed` output, so one that fails costs only the checks that read it: the capture and perf
      # checks then read the files API, and the design spec and cloud backend checks are skipped.
      #
      # paths.txt: a rename as both its old and new path, so a code file moved under docs/ is not
      # docs-only (perf, design spec). status.txt: each path with its status, added, modified or
      # deleted (cloud backend).
      - name: List the changed paths
        id: paths
        continue-on-error: true
        timeout-minutes: 2
        env:
          MERGE_SHA: ${{ github.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --quiet --depth=2 --filter=blob:none origin "$MERGE_SHA"
          [ "$(git rev-parse "$MERGE_SHA^2")" = "$HEAD_SHA" ]
          git diff --name-only -z --no-renames "$MERGE_SHA^1" "$MERGE_SHA" | tr '\0' '\n' > "$RUNNER_TEMP/paths.txt"
          git diff --name-status --no-renames "$MERGE_SHA^1" "$MERGE_SHA" > "$RUNNER_TEMP/status.txt"
          echo "listed=true" >> "$GITHUB_OUTPUT"

      # The merged tree's file list and its surface map (design spec).
      - name: List the merged tree and its surface map
        id: tree
        if: ${{ steps.paths.outputs.listed == 'true' && github.event.action != 'labeled' && github.event.action != 'unlabeled' }}
        continue-on-error: true
        timeout-minutes: 2
        env:
          MERGE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git ls-tree -r --name-only "$MERGE_SHA" > "$RUNNER_TEMP/tree.txt"
          git show "$MERGE_SHA:.github/design-surfaces.json" > "$RUNNER_TEMP/design-surfaces.json" || true
          echo "listed=true" >> "$GITHUB_OUTPUT"

      # The files API's `.filename` set (capture): a rename under its new name. It leaves out only a
      # change the base already carries, which merging changes nothing for. Last, since rename
      # detection may fetch blobs.
      - name: List the changed paths with renames
        id: renames
        continue-on-error: true
        timeout-minutes: 2
        env:
          MERGE_SHA: ${{ github.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --quiet --depth=2 --filter=blob:none origin "$MERGE_SHA"
          [ "$(git rev-parse "$MERGE_SHA^2")" = "$HEAD_SHA" ]
          git diff --name-only -z -M "$MERGE_SHA^1" "$MERGE_SHA" | tr '\0' '\n' > "$RUNNER_TEMP/capture-paths.txt"
          echo "listed=true" >> "$GITHUB_OUTPUT"

      # A base whose step table has no `capture` step (from before CI v2 step 6's second cut) runs the capture
      # check here, as it did: bad input is this job's red, as it was pr-capture-check's. A base with the step
      # runs it among the advisory steps below, where it only warns. Each later step still runs (!cancelled()).
      - name: Check the description for a real capture
        if: ${{ !cancelled() && !((github.event.action == 'labeled' || github.event.action == 'unlabeled') && !contains(fromJSON('["media-tour","media-tour-mac"]'), github.event.label.name)) }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BODY: ${{ github.event.pull_request.body }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          LISTED: ${{ steps.renames.outputs.listed }}
        run: |
          set -euo pipefail
          if grep -q '^\[step\.capture\]' ci/steps.toml 2>/dev/null; then
            echo "The base's step table runs the capture check (advisory steps, below)."
            exit 0
          fi
          if [ ! -f scripts/ci/pr_capture_check.py ]; then
            # The pull request that adds the check: its base has no check to run yet.
            echo "::notice::The base branch has no scripts/ci/pr_capture_check.py yet; nothing to check."
            exit 0
          fi
          printf '%s' "$BODY" > "$RUNNER_TEMP/capture-body.md"
          if [ "$LISTED" != true ]; then
            gh api --paginate "repos/$REPOSITORY/pulls/$PR/files?per_page=100" --jq '.[].filename' > "$RUNNER_TEMP/capture-paths.txt"
          fi
          python3 scripts/ci/pr_capture_check.py --body-file "$RUNNER_TEMP/capture-body.md" --paths-file "$RUNNER_TEMP/capture-paths.txt" \
            --labels "$LABELS" --head-sha "$HEAD_SHA" --pr "$PR"

      # The advisory steps of the step table (ci/steps.toml): the design spec, Performance table and
      # cloud backend lints, run at once by scripts/ci/ci_steps.py from the base's copy. Each one's
      # failure is a warning annotation and the runner exits 0, so they never turn this job red; the
      # step is continue-on-error as well, for a runner that cannot start. A label event runs only the
      # steps that list that label (perf and performance re-run the Performance table).
      - name: Run the advisory steps
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 4
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          LABEL: ${{ (github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PATHS_LISTED: ${{ steps.paths.outputs.listed }}
          TREE_LISTED: ${{ steps.tree.outputs.listed }}
          CAPTURE_LISTED: ${{ steps.renames.outputs.listed }}
          ADDITIONS: ${{ github.event.pull_request.additions }}
          DELETIONS: ${{ github.event.pull_request.deletions }}
        run: |
          set -euo pipefail
          if [ ! -f scripts/ci/ci_steps.py ] || [ ! -f ci/steps.toml ]; then
            # The pull request that adds the step table: its base has no runner yet.
            echo "::notice::The base branch has no step table yet; nothing to check."
            exit 0
          fi
          # The table's advisory job also holds pr-checks.yml's steps, which read what this event does not
          # carry: name this workflow's four (a base table without `capture` skips that name with a notice).
          # A base runner from before --only runs every step it has, which were only the last three.
          only=()
          if grep -q -- '--only' scripts/ci/ci_steps.py; then
            only=(--only "capture design-spec perf-section cloud-backend")
          fi
          python3 scripts/ci/ci_steps.py run --job advisory --label "$LABEL" "${only[@]}"
