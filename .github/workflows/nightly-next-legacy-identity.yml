name: nightly-next cmux NIGHTLY identity

# cx-x7hwx. Installs of the nightly-next track from before cmux NEXT
# (b9ac67887fa7, 2026-10-12) are cmux NIGHTLY (com.cmuxterm.app.nightly) and
# read the old feed NIGHTLY_NEXT_LEGACY_FEED_BASE/appcast-arm64.xml. Sparkle
# installs only an update with their bundle id or file name, and their
# terminals, agent sessions, keychain sign-in, browser data and preferences
# live under that id. So each published cmux NEXT build is also published to
# them, as the same build signed as cmux NIGHTLY
# (scripts/ci/nightly-next-legacy-identity.sh), on the old feed, with its signed
# release notes. Same Sparkle key; no new secret.
#
# nightly.yml (job request-nightly-identity-legacy) requests one run per
# published build. A separate run, so the nightly-next publish run never waits
# for this notarization and a failure here never touches cmux NEXT. A failure
# opens or updates the "cmux NIGHTLY-identity publication failed" issue; the old
# feed then keeps its previous build.
# Off switch: repository variable NIGHTLY_NEXT_LEGACY_IDENTITY=off.
on:
  # GitHub dispatches a workflow by file name only after an event has run it
  # once. The promotion that first brings this file to nightly-next registers
  # it here (no paths filter: a promotion can change more than the 300 files
  # GitHub filters on); a push run only skips its job.
  push:
    branches: [nightly-next]
  workflow_dispatch:
    inputs:
      build:
        description: Published cmux NEXT build number (sparkle:version) to publish to the cmux NIGHTLY-identity installs.
        required: true
        type: string

permissions: {}

# One at a time; a newer request waits and replaces an older waiting one.
concurrency:
  group: nightly-next-legacy-identity-${{ github.event_name }}
  cancel-in-progress: false

env:
  CREATE_DMG_VERSION: 8.0.0
  CHANNEL_RELEASE_TAG: nightly-next
  CHANNEL_DMG_PREFIX: cmux-nightly-next-macos
  # Release asset names of the cmux NIGHTLY-identity copies. They start with
  # the track prefix (nightly-next-guard.py appcast) but match none of the
  # track's prune patterns (prune_nightly_release_assets.py); this workflow
  # prunes them itself.
  LEGACY_DMG_PREFIX: cmux-nightly-next-macos-nightlyid-arm64-
  LEGACY_APPCAST: appcast-arm64.xml

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'manaflow-ai/cmux' && github.ref == 'refs/heads/nightly-next' && vars.NIGHTLY_NEXT_LEGACY_IDENTITY != 'off'
    # The nightly-next signing secrets; the environment admits only nightly-next.
    environment: release-next
    permissions:
      contents: write
      issues: write
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || vars.MACOS_RUNNER_26 || 'blacksmith-6vcpu-macos-26' }}
    timeout-minutes: 80
    env:
      CMUX_CI_XCODE_APP: ${{ vars.CMUX_CI_XCODE_APP_MACOS_26 }}
      CMUX_CI_REQUIRED_MACOS_SDK_MAJOR: "26"
      NIGHTLY_BUILD: ${{ inputs.build }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # One source for the track's feeds, bucket and key: nightly.yml's env.
      - name: Read the track settings from nightly.yml
        run: |
          set -euo pipefail
          [[ "$NIGHTLY_BUILD" =~ ^[0-9]+$ ]] || { echo "invalid build '$NIGHTLY_BUILD'" >&2; exit 1; }
          for name in NIGHTLY_NEXT_FEED_BASE NIGHTLY_NEXT_LEGACY_FEED_BASE NIGHTLY_NEXT_R2_BUCKET NIGHTLY_NEXT_SPARKLE_PUBLIC_KEY; do
            value="$(sed -n "s/^  ${name}: \(.*\)$/\1/p" .github/workflows/nightly.yml)"
            [ "$(printf '%s\n' "$value" | grep -c .)" = 1 ] || { echo "nightly.yml has no single env $name" >&2; exit 1; }
            # Plain values only: a quote or a trailing comment would be copied in.
            if [[ "$value" =~ [\"\'#[:space:]] ]]; then echo "nightly.yml env $name is not a plain value: $value" >&2; exit 1; fi
            echo "$name=$value" >> "$GITHUB_ENV"
          done

      # A rerun of an older request must never move the old feed back.
      - name: Skip a build older than the old feed's
        id: order
        run: |
          set -euo pipefail
          current="$(curl -fsSL --retry 3 -A "cmux-nightly-legacy/1" "${NIGHTLY_NEXT_LEGACY_FEED_BASE}/${LEGACY_APPCAST}" \
            | sed -n 's#.*<sparkle:version>\([0-9][0-9]*\)</sparkle:version>.*#\1#p' | sort -n | tail -1)"
          echo "old feed build: ${current:-none}; requested: $NIGHTLY_BUILD"
          if [ -n "$current" ] && [ "$NIGHTLY_BUILD" -le "$current" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "### Old feed already at $current; build $NIGHTLY_BUILD skipped" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Select Xcode
        if: steps.order.outputs.skip != 'true'
        run: ./scripts/select-ci-xcode.sh

      - name: Set up Node
        if: steps.order.outputs.skip != 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"

      # The same create-dmg as nightly.yml's build-sign-notarize-nightly.
      - name: Install create-dmg
        if: steps.order.outputs.skip != 'true'
        run: |
          CMUX_NODE_BIN="$(command -v node)"
          export npm_config_prefix="$RUNNER_TEMP/npm-global"
          mkdir -p "$npm_config_prefix"
          npm install --global "create-dmg@${CREATE_DMG_VERSION}"
          wrapper_dir="$RUNNER_TEMP/create-dmg-wrapper"
          mkdir -p "$wrapper_dir"
          cat > "$wrapper_dir/create-dmg" <<EOF
          #!/usr/bin/env bash
          exec "$CMUX_NODE_BIN" "$npm_config_prefix/lib/node_modules/create-dmg/cli.js" "\$@"
          EOF
          chmod +x "$wrapper_dir/create-dmg"
          echo "$wrapper_dir" >> "$GITHUB_PATH"

      - name: Download the published cmux NEXT DMG
        if: steps.order.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p next-in
          gh release download "$CHANNEL_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "${CHANNEL_DMG_PREFIX}-arm64-${NIGHTLY_BUILD}.dmg" --dir next-in

      - name: Import signing cert
        if: steps.order.outputs.skip != 'true'
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          [ -n "$APPLE_CERTIFICATE_BASE64" ] && [ -n "$APPLE_CERTIFICATE_PASSWORD" ] || { echo "Missing signing certificate secrets" >&2; exit 1; }
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security delete-keychain build.keychain >/dev/null 2>&1 || true
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import "$RUNNER_TEMP/cert.p12" -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"
          ./scripts/import-apple-developer-id-intermediates.sh build.keychain
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security list-keychains -d user -s build.keychain

      - name: Sign the build as cmux NIGHTLY
        if: steps.order.outputs.skip != 'true'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_NIGHTLY_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_NIGHTLY_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          [ -n "$APPLE_NIGHTLY_PROVISIONING_PROFILE_BASE64" ] || { echo "Missing APPLE_NIGHTLY_PROVISIONING_PROFILE_BASE64 (release-next)" >&2; exit 1; }
          NIGHTLY_PROFILE_PATH="$RUNNER_TEMP/nightly.provisionprofile"
          echo "$APPLE_NIGHTLY_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$NIGHTLY_PROFILE_PATH"
          LEGACY_FEED_URL="${NIGHTLY_NEXT_LEGACY_FEED_BASE}/${LEGACY_APPCAST}"
          NIGHTLY_NEXT_FEED_BASE="$NIGHTLY_NEXT_LEGACY_FEED_BASE" python3 scripts/ci/nightly-next-guard.py feed-url "$LEGACY_FEED_URL"
          NIGHTLY_PROFILE_PATH="$NIGHTLY_PROFILE_PATH" LEGACY_FEED_URL="$LEGACY_FEED_URL" \
            EXPECTED_SPARKLE_PUBLIC_KEY="$NIGHTLY_NEXT_SPARKLE_PUBLIC_KEY" \
            ./scripts/ci/nightly-next-legacy-identity.sh \
              "next-in/${CHANNEL_DMG_PREFIX}-arm64-${NIGHTLY_BUILD}.dmg" "$NIGHTLY_BUILD" legacy-app
          rm -f "$NIGHTLY_PROFILE_PATH"

      # Same packaging, notarization, stapling, spctl, smoke launch and
      # metadata checks as every NIGHTLY DMG. The Computer Use helper keeps
      # its own stapled ticket (keep-stapled-computer-use-helper.sh).
      - name: Notarize the cmux NIGHTLY DMG
        if: steps.order.outputs.skip != 'true'
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          mkdir -p legacy-out
          : > "$RUNNER_TEMP/unused-helper-state"
          CMUX_CHANNEL=nightly \
            CMUX_NOTARY_WAIT_TIMEOUT=45m \
            CMUX_NOTARIZE_COMPUTER_USE_HELPER_TOOL="$PWD/scripts/ci/keep-stapled-computer-use-helper.sh" \
            CMUX_COMPUTER_USE_NOTARY_SUBMISSION_FILE="$RUNNER_TEMP/unused-helper-state" \
            CMUX_NOTARY_SUBMISSION_FILE="$RUNNER_TEMP/legacy.notarization.state" \
            CMUX_NOTARY_OUTPUT_FILE="$RUNNER_TEMP/legacy.notarization.log" \
            ./scripts/ci/notarize-nightly-dmg.sh "legacy-app/cmux NIGHTLY.app" \
              "legacy-out/release.dmg" "legacy-out/${LEGACY_DMG_PREFIX}${NIGHTLY_BUILD}.dmg"
          codesign --verify --deep --strict --verbose=2 "legacy-app/cmux NIGHTLY.app"
          spctl -a -vv --type execute "legacy-app/cmux NIGHTLY.app"
          xcrun stapler validate "legacy-app/cmux NIGHTLY.app"

      - name: Generate the old feed's appcast
        if: steps.order.outputs.skip != 'true'
        env:
          TRACK: nightly-next
          NEXT_SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_NEXT_PRIVATE_KEY }}
          SPARKLE_CHANNEL: cmux-next
        run: |
          set -euo pipefail
          SPARKLE_PRIVATE_KEY="$(./scripts/ci/nightly-sparkle-key.sh)"
          export SPARKLE_PRIVATE_KEY
          SPARKLE_MINIMUM_SYSTEM_VERSION="$(python3 scripts/ci/appcast_minimum_system_version.py floor "legacy-app/cmux NIGHTLY.app")"
          export SPARKLE_MINIMUM_SYSTEM_VERSION
          # One full archive, no deltas: the old feed only has to move its
          # installs to the newest build.
          ./scripts/sparkle_generate_appcast.sh \
            "legacy-out/${LEGACY_DMG_PREFIX}${NIGHTLY_BUILD}.dmg" "$CHANNEL_RELEASE_TAG" "legacy-out/$LEGACY_APPCAST"
          # Carry the change summary of cmux NEXT's item for this build.
          curl -fsSL --retry 3 -A "cmux-nightly-legacy/1" -o "$RUNNER_TEMP/next-appcast.xml" "${NIGHTLY_NEXT_FEED_BASE}/${LEGACY_APPCAST}" || true
          python3 -I - "legacy-out/$LEGACY_APPCAST" "$RUNNER_TEMP/next-appcast.xml" "$NIGHTLY_BUILD" <<'PY'
          import re, sys
          out_path, next_path, build = sys.argv[1:]
          try:
              next_xml = open(next_path, encoding="utf-8").read()
          except OSError:
              sys.exit(0)
          for item in re.findall(r"<item>.*?</item>", next_xml, re.S):
              if f"<sparkle:version>{build}</sparkle:version>" in item:
                  desc = re.search(r"<description>.*?</description>", item, re.S)
                  if desc:
                      xml = open(out_path, encoding="utf-8").read()
                      xml = re.sub(r"\s*<description>.*?</description>", "", xml, flags=re.S)
                      xml = xml.replace("</item>", desc.group(0) + "</item>", 1)
                      open(out_path, "w", encoding="utf-8").write(xml)
                  break
          PY
          python3 scripts/ci/nightly-next-guard.py appcast "legacy-out/$LEGACY_APPCAST"
          grep -q "<sparkle:version>${NIGHTLY_BUILD}</sparkle:version>" "legacy-out/$LEGACY_APPCAST"
          cat "legacy-out/$LEGACY_APPCAST"

      - name: Publish the cmux NIGHTLY DMG, release notes and the old feed
        if: steps.order.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          AWS_ACCESS_KEY_ID: ${{ secrets.NIGHTLY_NEXT_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.NIGHTLY_NEXT_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: "https://${{ secrets.NIGHTLY_NEXT_R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
        run: |
          set -euo pipefail
          prefix="${NIGHTLY_NEXT_LEGACY_FEED_BASE#https://files-next.cmux.com/}"
          [ "$prefix" = nightly-next ] || { echo "unexpected old feed base $NIGHTLY_NEXT_LEGACY_FEED_BASE" >&2; exit 1; }
          upload() {  # <file> <key> <content-type> <cache-control>
            NIGHTLY_NEXT_R2_PREFIX="$prefix/" python3 scripts/ci/nightly-next-guard.py r2-key "$NIGHTLY_NEXT_R2_BUCKET" "$2"
            python3 scripts/ci/upload-r2-object.py --file "$1" --endpoint-url "$R2_ENDPOINT" \
              --bucket "$NIGHTLY_NEXT_R2_BUCKET" --key "$2" --content-type "$3" --cache-control "$4"
          }
          dmg="legacy-out/${LEGACY_DMG_PREFIX}${NIGHTLY_BUILD}.dmg"
          gh release upload "$CHANNEL_RELEASE_TAG" "$dmg" --repo "$GITHUB_REPOSITORY" --clobber
          # The appcast goes live only after its DMG is downloadable.
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${CHANNEL_RELEASE_TAG}/$(basename "$dmg")"
          curl -fsSIL --retry 5 --retry-all-errors --retry-delay 5 -o /dev/null "$url"
          # Signed release notes sit beside each appcast (ReleaseNotesStore):
          # copy cmux NEXT's index and this build's notes, already signed, next
          # to the old feed. Best effort: a notes problem never blocks the feed.
          copy_notes() {
            local src="${NIGHTLY_NEXT_FEED_BASE}/notes" name
            mkdir -p legacy-notes
            for name in index.json "${NIGHTLY_BUILD}.json"; do
              curl -fsSL --retry 3 -o "legacy-notes/$name" "$src/$name" || return 1
              curl -fsSL --retry 3 -o "legacy-notes/$name.sig" "$src/$name.sig" || return 1
            done
            # This build's notes first, the index (which names it) last.
            for name in "${NIGHTLY_BUILD}.json" index.json; do
              case "$name" in index.json) cache="no-cache, no-store, must-revalidate" ;; *) cache="public, max-age=3600" ;; esac
              upload "legacy-notes/$name" "$prefix/notes/$name" application/json "$cache" || return 1
              upload "legacy-notes/$name.sig" "$prefix/notes/$name.sig" text/plain "$cache" || return 1
            done
          }
          copy_notes || echo "::warning::release notes of build $NIGHTLY_BUILD were not copied next to the old feed; the feed is still published"
          upload "legacy-out/$LEGACY_APPCAST" "$prefix/$LEGACY_APPCAST" application/xml "no-cache, no-store, must-revalidate"
          # Keep the three newest cmux NIGHTLY-identity DMGs, never the one the feed names.
          gh release view "$CHANNEL_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' \
            | python3 -I -c 'import re, sys; p = re.compile("^" + re.escape(sys.argv[1]) + r"(\d+)\.dmg$"); keep = int(sys.argv[2]); names = sorted((int(m.group(1)), n) for n in sys.stdin.read().split() if (m := p.match(n))); [print(n) for b, n in names[:-3] if b != keep]' "$LEGACY_DMG_PREFIX" "$NIGHTLY_BUILD" \
            | while IFS= read -r old; do
                gh release delete-asset "$CHANNEL_RELEASE_TAG" "$old" --repo "$GITHUB_REPOSITORY" --yes || true
              done
          {
            echo "### cmux NIGHTLY-identity build ${NIGHTLY_BUILD} published (cx-x7hwx)"
            echo ""
            echo "- feed: ${NIGHTLY_NEXT_LEGACY_FEED_BASE}/${LEGACY_APPCAST}"
            echo "- DMG: $url"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report a failed publication
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          BUILD: ${{ inputs.build }}
        with:
          script: |
            const title = 'cmux NIGHTLY-identity publication failed (nightly-next-legacy-identity.yml)';
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `Build ${process.env.BUILD} was not published to the cmux NIGHTLY-identity installs (cx-x7hwx). cmux NEXT is not affected; the old feed keeps its previous build.\n\nRun: ${run}\n\nStop it with repository variable NIGHTLY_NEXT_LEGACY_IDENTITY=off.`;
            const { data: open } = await github.rest.issues.listForRepo({ ...context.repo, state: 'open', per_page: 100, labels: '' });
            const existing = open.find((issue) => issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ ...context.repo, title, body });
            }
            core.error(`cmux NIGHTLY-identity publication of build ${process.env.BUILD} failed; see ${run}`);

      - name: Cleanup keychain
        if: always()
        run: security delete-keychain build.keychain >/dev/null 2>&1 || true
