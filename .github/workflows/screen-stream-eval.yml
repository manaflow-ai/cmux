name: screen stream eval

# The screen stream eval (HQ#7146 G0; scripts/measure/screen-stream-eval/README.md): cmux.rd/1 and
# WebRTC through the same fixed scenarios (key and pointer glass-to-glass, kbps idle, typing and
# scrolling, 13 pt code OCR error, encode/network/decode split) on one console Mac, every day at the
# feat-cmux-next tip. Report only, no gate: the run uploads results.json and a summary.md that
# compares each number with the last successful daily run (artifacts keep 3 days, the repo's
# limit, so a daily run always finds yesterday's). It goes through the build-fleet
# gateway runner, which only hands the step to the controller with `cmux-ci run`.

# Daily: main's screen-stream-eval-dispatch.yml starts it (a schedule here would never fire, since
# scheduled workflows run only from the default branch).
on:
  workflow_dispatch:
    inputs:
      targets:
        description: "targets (scripts/measure/screen-stream-eval/targets/NAME.sh)"
        default: "rd,webrtc"
      samples:
        description: "inputs per latency row"
        default: "200"
      repeats:
        description: "window and OCR repeats (each number is their median)"
        default: "3"
      worker:
        description: "fleet worker (empty: vars.SCREEN_STREAM_EVAL_WORKER, else any idle console measure worker)"
        default: ""

permissions:
  contents: read
  actions: read

concurrency:
  group: screen-stream-eval
  cancel-in-progress: false

jobs:
  eval:
    if: github.repository_owner == 'manaflow-ai' && vars.CI_SWIFT_PACKAGE_TESTS_STEP_GATEWAY != ''
    runs-on: ${{ vars.CI_SWIFT_PACKAGE_TESTS_STEP_GATEWAY }}
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: feat-cmux-next
          fetch-depth: 1
          submodules: false
      - name: the last successful daily run
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os, urllib.request
          # The daily runs: main's screen-stream-eval-dispatch.yml starts them (scheduled workflows run only
          # from the default branch), so they are workflow_dispatch runs by github-actions[bot].
          url = f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}/actions/workflows/screen-stream-eval.yml/runs?event=workflow_dispatch&actor=github-actions%5Bbot%5D&status=success&per_page=1"
          request = urllib.request.Request(url, headers={"Authorization": f"Bearer {os.environ['GH_TOKEN']}", "Accept": "application/vnd.github+json"})
          try:
              runs = json.load(urllib.request.urlopen(request, timeout=30)).get("workflow_runs") or []
          except Exception as error:
              print(f"::warning::could not list earlier runs: {error}", file=__import__("sys").stderr)
              runs = []
          print(f"run={runs[0]['id'] if runs else ''}")
          EOF
      - name: earlier results
        if: steps.previous.outputs.run != ''
        continue-on-error: true
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: screen-stream-eval
          path: ${{ runner.temp }}/previous
          run-id: ${{ steps.previous.outputs.run }}
          github-token: ${{ github.token }}
      - name: eval on a fleet Mac
        env:
          TARGETS: ${{ inputs.targets || 'rd,webrtc' }}
          SAMPLES: ${{ inputs.samples || '200' }}
          REPEATS: ${{ inputs.repeats || '3' }}
          WORKER: ${{ inputs.worker || vars.SCREEN_STREAM_EVAL_WORKER || '' }}
        run: |
          set -uo pipefail
          client="${CMUX_CI_CLIENT:-$HOME/.local/bin/cmux-ci}"
          if ! [[ -x "$client" ]]; then
            echo "::error title=Build fleet client missing::$client is not installed on runner $RUNNER_NAME; the eval did not run."
            exit 127
          fi
          sha="$(git rev-parse HEAD)"
          log="$RUNNER_TEMP/eval.log"
          status=0
          # A console session worker (gui-session-v1): the hosts capture the screen and post input.
          target=()
          # A strict pin never moves to another worker (that one would lack the console grants).
          [ -n "$WORKER" ] && target=(--target-worker "$WORKER")
          [ -n "$WORKER" ] && "$client" run --help 2>/dev/null | grep -q -- --pin-strict && target+=(--pin-strict)
          "$client" run --class exclusive --measurement --label measure --label gui-session-v1 ${target[@]+"${target[@]}"} \
            --script scripts/measure/screen-stream-eval.sh --ref "$sha" --timeout 5400 \
            --artifact artifacts/screen-stream-eval/results.json \
            --arg="targets=$TARGETS" --arg="samples=$SAMPLES" --arg="repeats=$REPEATS" 2>&1 | tee "$log" || status=${PIPESTATUS[0]}
          out=artifacts/screen-stream-eval
          mkdir -p "$out"
          step="$(grep -o -E 'step [0-9a-f]{24}' "$log" | head -1 | cut -d' ' -f2)"
          if [[ -n "$step" ]]; then
            "$client" artifact "$step" "$out/results.json" || "$client" artifact --failed "$step" "$out/results.json" || true
          fi
          if [[ -s "$out/results.json" ]]; then
            previous=()
            [[ -s "$RUNNER_TEMP/previous/results.json" ]] && previous=(--previous "$RUNNER_TEMP/previous/results.json")
            python3 scripts/measure/screen-stream-eval/eval.py summary "$out/results.json" "$out/summary.md" ${previous[@]+"${previous[@]}"}
            cat "$out/summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error title=screen stream eval::no results.json came back (step ${step:-none}, exit $status)"
          fi
          exit "$status"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: screen-stream-eval
          path: |
            artifacts/screen-stream-eval/results.json
            artifacts/screen-stream-eval/summary.md
          if-no-files-found: ignore
          retention-days: 3
