name: screen stream eval

# The screen stream eval (HQ#7146 G0; scripts/measure/screen-stream-eval/README.md): cmux.rd/1 and
# WebRTC through the same fixed scenarios (key and pointer glass-to-glass, kbps idle, typing and
# scrolling, 13 pt code OCR error, encode/network/decode split) on one console Mac, every day at the
# feat-cmux-next tip. The run uploads results.json and a summary.md that compares each number with
# the last daily run that left results (artifacts keep 3 days, the repo's limit, so a daily run
# always finds yesterday's). Its one gate is the screen-share budget (budget_gate.py; cmuxterm-hq
# docs/design/screen-share-under-100ms.md, piece 6): a stage whose p50 is over its budget fails the
# run and is named in the job's error and in gate.json. It also publishes probe.json
# (schema cmux.screen-share-fast/1) for the screen-share-fast goal board. It goes through the build-fleet
# gateway runner, which only hands the step to the controller with `cmux-ci run`.

# Daily: main's screen-stream-eval-dispatch.yml starts it (a schedule here would never fire, since
# scheduled workflows run only from the default branch): the default targets, and an iPhone viewer run
# (targets=iphone-sim) pinned to a Mac with an iOS simulator runtime.
# Each run is named by its targets (the defaults keep the plain name), so a run's baseline is the last
# daily run with the same targets, the dispatcher tells a pending run of each apart, and the two runs
# wait for each other only on the fleet (each step is exclusive), never in a concurrency group whose
# newer pending run would cancel the other.
run-name: ${{ (inputs.targets && inputs.targets != 'rd,webrtc') && format('screen stream eval ({0})', inputs.targets) || 'screen stream eval' }}
on:
  workflow_dispatch:
    inputs:
      targets:
        description: "targets (scripts/measure/screen-stream-eval/targets/NAME.sh)"
        default: "rd,webrtc"
      samples:
        description: "inputs per latency row"
        default: "200"
      repeats:
        description: "window and OCR repeats (each number is their median)"
        default: "3"
      worker:
        description: "fleet worker (empty: vars.SCREEN_STREAM_EVAL_WORKER, else any idle console measure worker)"
        default: ""
      budget:
        description: "budget overrides for this run, STAGE=MS separated by spaces (proving the gate; the daily run passes none)"
        default: ""

permissions:
  contents: read
  actions: read

concurrency:
  group: screen-stream-eval-${{ inputs.targets || 'rd,webrtc' }}
  cancel-in-progress: false

env:
  # Temporary REST budget attribution: one gh-call line per GitHub API call (scripts/ci/api_call_log/env.sh, fetched at a fixed commit when the checkout has no copy).
  BASH_ENV: '$({ w="${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh"; t="${RUNNER_TEMP:-/nonexistent}/api-call-log-src"; if [ -f "$w" ]; then echo "$w"; elif [ -n "${RUNNER_TEMP:-}" ]; then if [ ! -f "$t/env.sh" ] && [ ! -e "$t.tried" ] && { [ "${RUNNER_OS:-}" = Linux ] || [ "${RUNNER_OS:-}" = macOS ]; } && [ "$(date -u +%Y%m%d%H)" -lt 2026112300 ]; then : > "$t.tried"; mkdir -p "$t.part" && for x in env.sh gh sitecustomize.py isolated.py; do curl -fsSL --max-time 5 -o "$t.part/$x" "https://raw.githubusercontent.com/manaflow-ai/cmux/27647ffd3ae838c63be28ca3e5883dcd68c34518/scripts/ci/api_call_log/$x" || break; done; [ -s "$t.part/isolated.py" ] && mv "$t.part" "$t"; fi; if [ -f "$t/env.sh" ]; then echo "$t/env.sh"; else echo unset BASH_ENV > "$t.off.sh" && echo "$t.off.sh"; fi; fi; } 2>/dev/null)'

jobs:
  eval:
    if: github.repository_owner == 'manaflow-ai' && vars.CI_EVAL_STEP_GATEWAY != ''
    runs-on: ${{ vars.CI_EVAL_STEP_GATEWAY }}
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: refs/heads/feat-cmux-next
          fetch-depth: 1
          submodules: false
          # A thin client on the gateway runner (glaeda GATEWAY_JOBS): only the summary script it runs
          # here, no other blob. The measure worker checks the tree out itself.
          filter: blob:none
          sparse-checkout: /scripts/measure/screen-stream-eval/
          sparse-checkout-cone-mode: false
      - name: the last daily run with results
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
          TARGETS: ${{ inputs.targets || 'rd,webrtc' }}
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os, urllib.request
          # The daily runs: main's screen-stream-eval-dispatch.yml starts them (scheduled workflows run only
          # from the default branch), so they are workflow_dispatch runs by github-actions[bot]. A run the
          # budget gate failed still measured, so the newest completed run with the same targets (its
          # name, this workflow's run-name) whose results artifact is still kept counts, whatever its conclusion.
          api = f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}/actions"
          def get(path):
              request = urllib.request.Request(f"{api}/{path}", headers={"Authorization": f"Bearer {os.environ['GH_TOKEN']}", "Accept": "application/vnd.github+json"})
              return json.load(urllib.request.urlopen(request, timeout=30))
          targets = os.environ["TARGETS"]
          title = "screen stream eval" if targets == "rd,webrtc" else f"screen stream eval ({targets})"
          found = ""
          try:
              runs = get("workflows/screen-stream-eval.yml/runs?event=workflow_dispatch&actor=github-actions%5Bbot%5D&status=completed&per_page=10").get("workflow_runs") or []
              for run in runs:
                  if run.get("display_title") != title:
                      continue
                  artifacts = get(f"runs/{run['id']}/artifacts?name=screen-stream-eval").get("artifacts") or []
                  if any(not a.get("expired") for a in artifacts):
                      found = str(run["id"])
                      break
          except Exception as error:
              print(f"::warning::could not list earlier runs: {error}", file=__import__("sys").stderr)
          print(f"run={found}")
          EOF
      - name: earlier results
        if: steps.previous.outputs.run != ''
        continue-on-error: true
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: screen-stream-eval
          path: ${{ runner.temp }}/previous
          run-id: ${{ steps.previous.outputs.run }}
          github-token: ${{ github.token }}
      - name: eval on a fleet Mac
        env:
          TARGETS: ${{ inputs.targets || 'rd,webrtc' }}
          SAMPLES: ${{ inputs.samples || '200' }}
          REPEATS: ${{ inputs.repeats || '3' }}
          WORKER: ${{ inputs.worker || vars.SCREEN_STREAM_EVAL_WORKER || '' }}
          BUDGET: ${{ inputs.budget || '' }}
        run: |
          set -uo pipefail
          client="${CMUX_CI_CLIENT:-$HOME/.local/bin/cmux-ci}"
          if ! [[ -x "$client" ]]; then
            echo "::error title=Build fleet client missing::$client is not installed on runner $RUNNER_NAME; the eval did not run."
            exit 127
          fi
          sha="$(git rev-parse HEAD)"
          log="$RUNNER_TEMP/eval.log"
          status=0
          # A console session worker (gui-session-v1): the hosts capture the screen and post input.
          target=()
          # A strict pin never moves to another worker (that one would lack the console grants).
          [ -n "$WORKER" ] && target=(--target-worker "$WORKER")
          [ -n "$WORKER" ] && "$client" run --help 2>/dev/null | grep -q -- --pin-strict && target+=(--pin-strict)
          "$client" run --class exclusive --measurement --label measure --label gui-session-v1 ${target[@]+"${target[@]}"} \
            --script scripts/measure/screen-stream-eval.sh --ref "$sha" --timeout 5400 \
            --artifact artifacts/screen-stream-eval/results.json \
            --arg="targets=$TARGETS" --arg="samples=$SAMPLES" --arg="repeats=$REPEATS" 2>&1 | tee "$log" || status=${PIPESTATUS[0]}
          out=artifacts/screen-stream-eval
          mkdir -p "$out"
          step="$(grep -o -E 'step [0-9a-f]{24}' "$log" | head -1 | cut -d' ' -f2)"
          if [[ -n "$step" ]]; then
            "$client" artifact "$step" "$out/results.json" || "$client" artifact --failed "$step" "$out/results.json" || true
          fi
          if [[ -s "$out/results.json" ]]; then
            previous=()
            [[ -s "$RUNNER_TEMP/previous/results.json" ]] && previous=(--previous "$RUNNER_TEMP/previous/results.json")
            python3 scripts/measure/screen-stream-eval/eval.py summary "$out/results.json" "$out/summary.md" ${previous[@]+"${previous[@]}"}
            python3 scripts/measure/screen-stream-eval/probe.py "$out/results.json" "$out/probe.json"
            cat "$out/summary.md" >> "$GITHUB_STEP_SUMMARY"
            # The budget gate: every stage's p50 against its budget; one over fails the run and is named.
            # It judges the rd target, so a dispatch without rd (targets=webrtc) stays a report.
            if [[ ",${TARGETS// /}," == *",rd,"* ]]; then
              overrides=()
              for pair in $BUDGET; do overrides+=(--budget "$pair"); done
              gate=0
              python3 scripts/measure/screen-stream-eval/budget_gate.py check "$out/results.json" \
                --out "$out/gate.json" --summary "$GITHUB_STEP_SUMMARY" ${overrides[@]+"${overrides[@]}"} || gate=$?
              [[ "$status" -eq 0 ]] && status=$gate
            fi
          else
            echo "::error title=screen stream eval::no results.json came back (step ${step:-none}, exit $status)"
            # Nothing measured is never a pass, also when the fleet step itself exited 0.
            [[ "$status" -eq 0 ]] && status=2
          fi
          exit "$status"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: screen-stream-eval
          path: |
            artifacts/screen-stream-eval/results.json
            artifacts/screen-stream-eval/summary.md
            artifacts/screen-stream-eval/probe.json
            artifacts/screen-stream-eval/gate.json
          if-no-files-found: ignore
          retention-days: 3  # retention-class: report
