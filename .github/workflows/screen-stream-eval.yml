name: screen stream eval

# Registration only. The screen stream eval lives on feat-cmux-next (its screen-stream-eval.yml, HQ#7146
# G0), and screen-stream-eval-dispatch.yml starts it there every day. GitHub dispatches a workflow by
# file name only when the repository knows that name, which needs the file on the default branch: this
# copy is that name. A dispatch with ref feat-cmux-next runs feat-cmux-next's file, not this one; run
# here on main, it does nothing.
on:
  workflow_dispatch:
    inputs:
      targets:
        description: "targets (feat-cmux-next's scripts/measure/screen-stream-eval/targets/NAME.sh)"
        default: "rd,webrtc"
      samples:
        description: "inputs per latency row"
        default: "200"
      repeats:
        description: "window and OCR repeats (each number is their median)"
        default: "3"
      worker:
        description: "fleet worker (empty: vars.SCREEN_STREAM_EVAL_WORKER)"
        default: ""

permissions: {}

env:
  # Temporary REST budget attribution: one gh-call line per GitHub API call (scripts/ci/api_call_log/env.sh, fetched at a fixed commit when the checkout has no copy).
  BASH_ENV: '$({ w="${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh"; t="${RUNNER_TEMP:-/nonexistent}/api-call-log-src"; if [ -f "$w" ]; then echo "$w"; elif [ -n "${RUNNER_TEMP:-}" ]; then if [ ! -f "$t/env.sh" ] && [ ! -e "$t.tried" ] && { [ "${RUNNER_OS:-}" = Linux ] || [ "${RUNNER_OS:-}" = macOS ]; } && [ "$(date -u +%Y%m%d%H)" -lt 2026112300 ]; then : > "$t.tried"; mkdir -p "$t.part" && for x in env.sh gh sitecustomize.py isolated.py; do curl -fsSL --max-time 5 -o "$t.part/$x" "https://raw.githubusercontent.com/manaflow-ai/cmux/27647ffd3ae838c63be28ca3e5883dcd68c34518/scripts/ci/api_call_log/$x" || break; done; [ -s "$t.part/isolated.py" ] && mv "$t.part" "$t"; fi; if [ -f "$t/env.sh" ]; then echo "$t/env.sh"; else echo unset BASH_ENV > "$t.off.sh" && echo "$t.off.sh"; fi; fi; } 2>/dev/null)'

jobs:
  eval:
    if: false
    # Never runs; the runner guards still read it: the declared 2 vCPU Linux pool, a fork's hosted label.
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || 'cmux-linux' }}
    steps:
      - run: echo "The screen stream eval runs from feat-cmux-next."
