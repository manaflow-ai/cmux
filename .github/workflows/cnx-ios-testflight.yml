name: cnx-ios TestFlight (cmux INTERNAL)

# Builds cnx-ios's TestFlight configuration for App Store Connect app
# "cmux INTERNAL" (dev.cmux.app.internal, app id 6791408425) with
# cnx-ios/scripts/testflight-build.sh: archive, export an App Store IPA,
# verify it, and validate it with Apple. It never uploads unless the
# `upload` input is true on a manual run.
#
# Signing material lives only in the `release` environment, whose deployment
# policy admits main, rc/** and v* tags (tests/test_ci_signing_secrets_need_release_environment.py).
# A push to the `cnx-ios-testflight` branch is therefore held at the
# environment gate until that policy admits it; see
# cnx-ios/verify/testflight-readiness.md.

on:
  push:
    # rc/cnx-ios-internal-* pushes are dogfood uploads to cmux INTERNAL
    # (internal testers only); the release environment admits rc/**.
    branches: [cnx-ios-testflight, 'rc/cnx-ios-internal-**']
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload the validated IPA to cmux INTERNAL (only after a production-acceptable verification round)"
        type: boolean
        default: false
      allow_backend_down:
        description: "Validate even if the production Worker is not live (never with upload)"
        type: boolean
        default: true
      allow_package_drift:
        description: "Build even if CmuxTabsKit/CmuxConversation differ from upstream (never with upload)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: cnx-ios-testflight
  cancel-in-progress: false

jobs:
  testflight:
    name: Archive, export, validate
    runs-on: ${{ vars.MACOS_RUNNER_IOS || 'blacksmith-6vcpu-macos-26' }}
    timeout-minutes: 90
    environment: release
    env:
      ASC_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
      # Push runs are validate-only; only a manual run can set upload.
      # rc/cnx-ios-internal-* pushes upload with every check on.
      INTERNAL_DOGFOOD: ${{ startsWith(github.ref, 'refs/heads/rc/cnx-ios-internal-') }}
      UPLOAD: ${{ startsWith(github.ref, 'refs/heads/rc/cnx-ios-internal-') || (github.event_name == 'workflow_dispatch' && inputs.upload) || false }}
      ALLOW_BACKEND_DOWN: ${{ !startsWith(github.ref, 'refs/heads/rc/cnx-ios-internal-') && (github.event_name != 'workflow_dispatch' || inputs.allow_backend_down) }}
      ALLOW_PACKAGE_DRIFT: ${{ !startsWith(github.ref, 'refs/heads/rc/cnx-ios-internal-') && (github.event_name != 'workflow_dispatch' || inputs.allow_package_drift) }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          # testflight-build.sh archives the commit with `git archive` and
          # compares the shared packages with their upstream branches.
          fetch-depth: 0

      - name: Fetch shared-package upstream branches
        run: git fetch --no-tags origin feat-cmux-next-tabs-kit:refs/remotes/origin/feat-cmux-next-tabs-kit feat-imsg-parity-gui:refs/remotes/origin/feat-imsg-parity-gui

      - name: Install tools (asc, xcodegen, Rust)
        run: |
          set -euo pipefail
          brew list asc >/dev/null 2>&1 || brew install asc
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi

      - name: Materialize App Store Connect API key
        env:
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          [ -n "${ASC_KEY_ID:-}" ] && [ -n "${ASC_ISSUER_ID:-}" ] && [ -n "${ASC_API_KEY_P8_BASE64:-}" ] \
            || { echo "Missing ASC_API_KEY_ID / ASC_API_ISSUER_ID / ASC_API_KEY_P8_BASE64" >&2; exit 1; }
          key_dir="$RUNNER_TEMP/asc"; mkdir -p "$key_dir"; chmod 700 "$key_dir"
          printf '%s' "$ASC_API_KEY_P8_BASE64" | base64 --decode > "$key_dir/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$key_dir/AuthKey_${ASC_KEY_ID}.p8"
          echo "ASC_PRIVATE_KEY_PATH=$key_dir/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"

      - name: Import iOS distribution certificate
        env:
          IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          [ -n "${IOS_DISTRIBUTION_CERTIFICATE_BASE64:-}" ] && [ -n "${IOS_DISTRIBUTION_CERTIFICATE_PASSWORD:-}" ] \
            || { echo "Missing IOS_DISTRIBUTION_CERTIFICATE_BASE64 / _PASSWORD" >&2; exit 1; }
          keychain=cnx-testflight.keychain
          password="$(uuidgen)"
          cert="$RUNNER_TEMP/ios-distribution.p12"
          printf '%s' "$IOS_DISTRIBUTION_CERTIFICATE_BASE64" | base64 --decode > "$cert"
          security delete-keychain "$keychain" >/dev/null 2>&1 || true
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$cert" -k "$keychain" -P "$IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$cert"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain"
          # The script picks the identity the profile authorizes by SHA-1.
          security find-identity -v -p codesigning "$keychain" | sed -E 's/[0-9A-F]{40}/<sha1>/'

      - name: Archive, export, verify, validate
        env:
          CNX_CI_ASC: "1"
        run: |
          set -euo pipefail
          args=()
          [ "$ALLOW_BACKEND_DOWN" != true ] || args+=(--allow-backend-down)
          [ "$ALLOW_PACKAGE_DRIFT" != true ] || args+=(--allow-package-drift)
          [ "$UPLOAD" != true ] || args+=(--upload)
          # Dogfood builds stay with internal testers ("cmux family" is external).
          if [ "$INTERNAL_DOGFOOD" = true ]; then
            args+=(--internal-only --what-to-test "New app: cmux-next for iPhone. This replaces the previous cmux INTERNAL app. It needs a Mac running cmux-next with Settings > Mobile > Allow iPhone Connections on, signed in to the same account. Early team dogfood: expect rough edges and report anything odd.")
          fi
          CNX_BUILDS_ROOT="$RUNNER_TEMP/cnx-builds" cnx-ios/scripts/testflight-build.sh --ref "$GITHUB_SHA" "${args[@]}"
          out="$(ls -d "$RUNNER_TEMP"/cnx-builds/*-testflight | head -1)"
          echo "CNX_OUT=$out" >> "$GITHUB_ENV"
          cat "$out/MANIFEST.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the manifest and logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cnx-ios-testflight-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/cnx-builds/*-testflight/MANIFEST.md
            ${{ runner.temp }}/cnx-builds/*-testflight/ExportOptions.plist
            ${{ runner.temp }}/cnx-builds/*-testflight/logs/
          if-no-files-found: ignore

      - name: Clean up signing material
        if: always()
        run: |
          security delete-keychain cnx-testflight.keychain >/dev/null 2>&1 || true
          rm -rf "$RUNNER_TEMP/asc"
