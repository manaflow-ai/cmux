name: chat-open perf report

# Report only: a pull request that touches the chat pane gets the chat open's attach_to_latest p50 and p95,
# merge base against head, measured on one runner in one job (webviews/bench/chat-open-ab.sh interleaves the two sides
# round by round), written to the job summary. It never fails the pull request: not on a regression, and not when
# the bench itself crashes (the summary says so). A gate needs Leo's say-so.
# Every number carries the runner class it came from, as the perf cron's rows do (cmuxterm-hq#18799): numbers
# from different classes are different series and are never compared.

on:
  pull_request:
    paths:
      - "webviews/src/agent-session/**"
      - "webviews/bench/**"
      - ".github/workflows/chat-open-perf-report.yml"
  # Every nightly's code (each push to nightly-next, whatever it touched) is measured against the nightly before it,
  # so NOW's chat_attach rows read a fresh number every nightly: the series.json artifact, keyed per runner class.
  push:
    branches:
      - nightly-next

permissions:
  contents: read

concurrency:
  group: chat-open-perf-report-${{ github.event.pull_request.number || github.ref }}
  # A pull request measures only its newest head. A branch keeps the running push and the newest one waiting.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Temporary REST budget attribution: one gh-call line per GitHub API call (scripts/ci/api_call_log/env.sh, fetched at a fixed commit when the checkout has no copy).
  BASH_ENV: '$({ w="${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh"; t="${RUNNER_TEMP:-/nonexistent}/api-call-log-src"; if [ -f "$w" ]; then echo "$w"; elif [ -n "${RUNNER_TEMP:-}" ]; then if [ ! -f "$t/env.sh" ] && [ ! -e "$t.tried" ] && { [ "${RUNNER_OS:-}" = Linux ] || [ "${RUNNER_OS:-}" = macOS ]; } && [ "$(date -u +%Y%m%d%H)" -lt 2026112300 ]; then : > "$t.tried"; mkdir -p "$t.part" && for x in env.sh gh sitecustomize.py isolated.py; do curl -fsSL --max-time 5 -o "$t.part/$x" "https://raw.githubusercontent.com/manaflow-ai/cmux/27647ffd3ae838c63be28ca3e5883dcd68c34518/scripts/ci/api_call_log/$x" || break; done; [ -s "$t.part/isolated.py" ] && mv "$t.part" "$t"; fi; if [ -f "$t/env.sh" ]; then echo "$t/env.sh"; else echo unset BASH_ENV > "$t.off.sh" && echo "$t.off.sh"; fi; fi; } 2>/dev/null)'
  HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  # The base branch's tip (or the push's previous tip). The bench measures against its merge base with the head
  # (the Fetch base step), so commits the base gained after the head branched never read as the head's change.
  BASE_TIP: ${{ github.event.pull_request.base.sha || github.event.before }}
  # Rounds of the A/B (each round opens every side and fixture) and timed opens per side, fixture and round:
  # 10 x 2 gives 20 opens per side and fixture, so p95 is the 19th of 20.
  ROUNDS: "10"
  OPENS: "2"

jobs:
  report:
    name: chat-open p50/p95 (report only)
    # vars.CMUX_CHAT_OPEN_PR_REPORT = 'off' skips the pull request run (the nightly-next push still measures it); unset keeps it.
    if: ${{ github.event_name != 'pull_request' || format('{0}', vars.CMUX_CHAT_OPEN_PR_REPORT) != 'off' }}
    # The Linux pool ci-web.yml uses; base and head run in this one job, so on one runner.
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && (vars.CI_FORK_LINUX_RUNNER || 'ubuntu-24.04') || 'cmux-linux' }}
    timeout-minutes: 75
    # A step that errors still leaves the job green; the summary step below says what broke.
    continue-on-error: true
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      - name: Fetch base
        run: |
          set -euo pipefail
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 2
          [[ "$BASE_TIP" =~ ^[0-9a-f]{40}$ ]] || exit 2
          test "$BASE_TIP" != 0000000000000000000000000000000000000000 || exit 2
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          # Deepen both sides until they meet: the merge base is the base the head's own change sits on.
          base=""
          for depth in 50 200 1000 5000; do
            git fetch --no-tags --depth="$depth" origin "$BASE_TIP" "$HEAD_SHA"
            if base="$(git merge-base "$BASE_TIP" "$HEAD_SHA")"; then break; fi
            base=""
          done
          test -n "$base"
          echo "base tip ${BASE_TIP:0:12}, head ${HEAD_SHA:0:12}, merge base ${base:0:12}"
          echo "BASE_SHA=$base" >> "$GITHUB_ENV"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
          no-cache: ${{ !startsWith(github.workspace, '/home/runner/work/') }}

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.22.1"

      - name: Cache Bun package cache
        if: ${{ (github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && github.event_name != 'merge_group' && contains(fromJSON('["refs/heads/main","refs/heads/feat-cmux-next","refs/heads/nightly-next"]'), github.ref)) }}
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.bun/install/cache
          key: bun-webviews-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('webviews/bun.lock') }}

      - name: Cache Bun package cache (restore only off base branches)
        if: ${{ !(github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && github.event_name != 'merge_group' && contains(fromJSON('["refs/heads/main","refs/heads/feat-cmux-next","refs/heads/nightly-next"]'), github.ref)) }}
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.bun/install/cache
          key: bun-webviews-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('webviews/bun.lock') }}

      - name: Install webviews dependencies
        working-directory: webviews
        run: bun install --frozen-lockfile

      - name: Cache Playwright apt packages
        uses: ./.github/actions/playwright-apt-cache
        with:
          engines: chromium

      - name: Playwright's bundled Chromium
        id: browser
        working-directory: webviews
        run: |
          # The bench runs on Playwright's own Chromium, as it does locally (CMUX_PLAYWRIGHT_BUNDLED_CHROMIUM=1): one
          # pinned build for both sides. A runner where that install fails measures on the installed Chrome instead.
          if ./node_modules/.bin/playwright install --with-deps chromium; then
            echo "CMUX_PLAYWRIGHT_BUNDLED_CHROMIUM=1" >> "$GITHUB_ENV"
            echo "browser=playwright-chromium-$(./node_modules/.bin/playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::no bundled Chromium; measuring on the installed Chrome"
            "$(git rev-parse --show-toplevel)/scripts/ci/ensure-system-chrome.sh"
            echo "browser=system-chrome" >> "$GITHUB_OUTPUT"
          fi

      - name: Runner class
        id: class
        env:
          RUNNER_LABEL: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && (vars.CI_FORK_LINUX_RUNNER || 'ubuntu-24.04') || 'cmux-linux' }}
        run: |
          # The series key, as the perf cron's rows carry it (`chat_open.compact.attach_to_latest@<runner class>`,
          # cmuxterm-hq#18799): a trend is read only within one class, so a move to another machine starts a new series
          # instead of reading as a regression. The class is the runs-on label, the arch and the cpu count.
          echo "class=${RUNNER_LABEL}-${RUNNER_ARCH,,}-$(nproc)c" >> "$GITHUB_OUTPUT"
          echo "cpu=$(awk -F: '/model name/ {gsub(/^ +/, "", $2); print $2; exit}' /proc/cpuinfo)" >> "$GITHUB_OUTPUT"

      - name: chat-open A/B, base against head
        id: bench
        working-directory: webviews
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/chat-open"
          if [ ! -f bench/chat-open-ab.sh ]; then
            echo "status=missing" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          OUT="$RUNNER_TEMP/chat-open/logs" bash bench/chat-open-ab.sh "$BASE_SHA" "$ROUNDS" "$OPENS" 2>&1 | tee "$RUNNER_TEMP/chat-open/ab.txt"
          echo "status=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Job summary
        if: ${{ !cancelled() }}
        env:
          BENCH_STATUS: ${{ steps.bench.outputs.status }}
          RUNNER_CLASS: ${{ steps.class.outputs.class }}
          RUNNER_CPU: ${{ steps.class.outputs.cpu }}
          BROWSER: ${{ steps.browser.outputs.browser }}
        run: |
          set +e
          python3 - <<'PY'
          import json, os, re
          tmp = os.environ["RUNNER_TEMP"]
          status = os.environ.get("BENCH_STATUS") or "did not run"
          klass = os.environ.get("RUNNER_CLASS") or "unknown"
          base, head = os.environ.get("BASE_SHA") or os.environ["BASE_TIP"], os.environ["HEAD_SHA"]
          os.makedirs(f"{tmp}/chat-open", exist_ok=True)
          rows = {}
          try:
              for line in open(f"{tmp}/chat-open/ab.txt"):
                  m = re.match(r"^(before|after)\s+(small|god)\s+(\d+)\s+([\d.]+)\s+([\d.]+)\s", line)
                  if m:
                      rows[(m[1], m[2])] = {"n": int(m[3]), "p50": float(m[4]), "p95": float(m[5])}
          except OSError:
              pass
          out = ["## chat-open attach_to_latest, base vs head (report only)", ""]
          out.append(f"Runner class `{klass}` ({os.environ.get('RUNNER_CPU') or 'cpu unknown'}), browser `{os.environ.get('BROWSER') or 'unknown'}`; "
                     f"base `{base[:12]}`, head `{head[:12]}`; webviews/bench/chat-open-ab.sh, "
                     f"{os.environ['ROUNDS']} rounds x {os.environ['OPENS']} opens, interleaved on this runner.")
          out.append("")
          if status == "missing":
              out.append("**Bench not run:** this head has no `webviews/bench/chat-open-ab.sh`. The check passes anyway.")
          elif status != "0":
              out.append(f"**The bench crashed or did not finish (status {status}).** The check passes anyway; "
                         "the log is in the step above and the `chat-open-perf` artifact.")
          series = []
          # A side with no rows: name its first error from the per-open logs (a head that does not build, a page
          # that never attaches), so the summary and NOW say why instead of "crashed or did not run".
          ansi = re.compile(r"\x1b\[[0-9;]*m")
          for side, label in (("before", "base"), ("after", "head")):
              if any((side, f) in rows for f in ("small", "god")):
                  continue
              first = ""
              for name in sorted(os.listdir(f"{tmp}/chat-open/logs")) if os.path.isdir(f"{tmp}/chat-open/logs") else []:
                  if not name.startswith(side + "-"):
                      continue
                  try:
                      lines = [ansi.sub("", l).strip() for l in open(f"{tmp}/chat-open/logs/{name}", errors="replace")]
                  except OSError:
                      continue
                  hits = [l for l in lines if re.search(r"\b\w*Error\b:|\berror:|\bTimeout\b", l)]
                  # The most specific line: one naming a source file, else the first error line.
                  first = next((l for l in hits if re.search(r"\.(tsx?|jsx?|mjs):", l)), hits[0] if hits else "")
                  if first:
                      first = re.sub(r"/home/runner/work/[^/]+/[^/]+/", "", first)[:300]
                      break
              if first:
                  out.append(f"**No {label} rows:** `{first}`")
                  series.append({"series": f"chat_open.error.{label}@{klass}", "runner_class": klass,
                                 "side": label, "error": first, "base_sha": base, "head_sha": head,
                                 "event": os.environ.get("GITHUB_EVENT_NAME"), "ref": os.environ.get("GITHUB_REF")})
          if rows:
              out += ["", "| fixture | n | base p50 | head p50 | p50 delta | base p95 | head p95 | p95 delta | reads as |",
                      "|---|---|---|---|---|---|---|---|---|"]
              for fixture in ("small", "god"):
                  b, a = rows.get(("before", fixture)), rows.get(("after", fixture))
                  if not b or not a:
                      out.append(f"| {fixture} | - | - | - | missing | - | - | missing | - |")
                      continue
                  def delta(k):
                      d = a[k] - b[k]
                      pct = 100 * d / b[k] if b[k] else 0.0
                      return d, f"{d:+.1f} ms ({pct:+.0f}%)"
                  d50, s50 = delta("p50")
                  d95, s95 = delta("p95")
                  # Past both bounds the p95 move reads as a regression (or an improvement); inside them, as noise.
                  bound = max(10.0, 0.10 * b["p95"])
                  verdict = "**regression**" if d95 > bound else "improvement" if d95 < -bound else "noise"
                  out.append(f"| {fixture} | {a['n']} | {b['p50']:.1f} | {a['p50']:.1f} | {s50} | "
                             f"{b['p95']:.1f} | {a['p95']:.1f} | {s95} | {verdict} |")
                  for k, d in (("p50", d50), ("p95", d95)):
                      row = "chat_open.compact" if fixture == "small" else "chat_open.god.compact"
                      series.append({"series": f"{row}.attach_to_latest.{k}@{klass}",
                                     "runner_class": klass, "fixture": fixture, "stat": k,
                                     "base": b[k], "head": a[k], "delta_ms": round(d, 1),
                                     "base_sha": base, "head_sha": head,
                                     "event": os.environ.get("GITHUB_EVENT_NAME"), "ref": os.environ.get("GITHUB_REF")})
              # The head's own numbers (on nightly-next, that nightly's code) and god over small, from this one job on
              # this one runner: goal chat-attach-p95's second condition (god within 1.2x of small).
              hs, hg = rows.get(("after", "small")), rows.get(("after", "god"))
              if hs and hg:
                  n = min(hs["n"], hg["n"])
                  out += ["", "| head | n | p50 | p95 |", "|---|---|---|---|",
                          f"| small | {hs['n']} | {hs['p50']:.1f} ms | {hs['p95']:.1f} ms |",
                          f"| god | {hg['n']} | {hg['p50']:.1f} ms | {hg['p95']:.1f} ms |"]
                  ratio = {k: round(hg[k] / hs[k], 3) for k in ("p50", "p95") if hs[k] > 0}
                  for k, r in ratio.items():
                      series.append({"series": f"chat_open.god_small_ratio.attach_to_latest.{k}@{klass}",
                                     "runner_class": klass, "fixture": "god/small", "stat": f"ratio_{k}",
                                     "head": r, "n": n, "head_sha": head,
                                     "event": os.environ.get("GITHUB_EVENT_NAME"), "ref": os.environ.get("GITHUB_REF")})
                  if ratio:
                      out.append(f"| god / small | {n} | {ratio.get('p50', 0):.2f}x | {ratio.get('p95', 0):.2f}x |")
                  if n < 10:
                      out += ["", f"**Fewer than 10 opens per fixture** (n={n}): too few for a p95."]
              out += ["", "A positive delta is head slower than base. A p95 move past 10 ms and 10% of base reads as a "
                      "regression or an improvement; anything inside that, as noise. Report only: nothing here fails "
                      "the pull request."]
          elif status == "0":
              out.append("**No result rows** in the bench output; the check passes anyway.")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("\n".join(out) + "\n")
          with open(f"{tmp}/chat-open/series.json", "w") as f:
              json.dump(series, f, indent=1)
          print("\n".join(out))
          PY
          exit 0

      - name: Upload logs and series
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chat-open-perf-${{ github.run_id }}-${{ steps.class.outputs.class || 'unknown' }}
          path: ${{ runner.temp }}/chat-open
          if-no-files-found: ignore
          retention-days: 14
