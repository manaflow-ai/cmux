name: fresh-chief-eval
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [feat-cmux-next]
    paths:
      - "Native/OptChat/optchat-chief/**"
jobs:
  eval:
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.CI_CLOUD_OVERFLOW_SAVED && 'blacksmith-8vcpu-ubuntu-2404' || 'blacksmith-2vcpu-ubuntu-2404' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - run: Native/OptChat/optchat-chief/scripts-fresh-chief-eval.sh
      # The health eval and the replay-case generator (measure/), on made-up fixtures.
      - run: python3 -m unittest test_chief_health test_replay_cases test_chief_digest
        working-directory: Native/OptChat/optchat-chief/measure
