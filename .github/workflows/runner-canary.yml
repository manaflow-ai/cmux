name: CI runner canary

# HQ dispatches one run per Linux pool label every five minutes.  The job is
# intentionally empty: its start time is the signal, and the runner label is
# the only variable under test.
on:
  workflow_dispatch:
    inputs:
      pool:
        description: Approved Linux pool key
        required: true
        type: choice
        options:
          - canary_fleet_linux
          - canary_freestyle_linux
          - canary_lane_build_linux
      nonce:
        description: Reconciler receipt id
        required: true
        type: string

permissions: {}

run-name: runner canary / ${{ inputs.pool }} / ${{ inputs.nonce }}

jobs:
  canary:
    name: canary (${{ inputs.pool }})
    runs-on: ${{ fromJSON(vars.RUNNER_POOLS)[inputs.pool] }}
    timeout-minutes: 3
    steps:
      - name: Start receipt
        run: |
          set -euo pipefail
          printf 'runner canary started on %s at %s\n' "$RUNNER_NAME" "$(date -u +%FT%TZ)"
