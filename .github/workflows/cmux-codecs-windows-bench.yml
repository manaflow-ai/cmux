name: cmux-codecs Windows bench

# Measurement, not a check: codec-bench's H.264 rows on Windows, OpenH264 next to Media
# Foundation's hardware MFT (`h264-mf`, present only on a runner with a GPU encoder) and its
# software MFT (`h264-mf-sw`). Nothing gates on it. A pull request never starts it; a push to
# a `lane/codec-bench-windows*` branch does (a new workflow can't be dispatched until it is on
# the default branch), and dispatch works once it is.
on:
  push:
    branches: ["lane/codec-bench-windows*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmux-codecs-windows-bench-${{ github.ref }}
  cancel-in-progress: false

env:
  # Temporary REST budget attribution: one gh-call line per GitHub API call (scripts/ci/api_call_log/env.sh, fetched at a fixed commit when the checkout has no copy).
  BASH_ENV: '$({ w="${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh"; t="${RUNNER_TEMP:-/nonexistent}/api-call-log-src"; if [ -f "$w" ]; then echo "$w"; elif [ -n "${RUNNER_TEMP:-}" ]; then if [ ! -f "$t/env.sh" ] && [ ! -e "$t.tried" ] && { [ "${RUNNER_OS:-}" = Linux ] || [ "${RUNNER_OS:-}" = macOS ]; } && [ "$(date -u +%Y%m%d%H)" -lt 2026112300 ]; then : > "$t.tried"; mkdir -p "$t.part" && for x in env.sh gh sitecustomize.py isolated.py; do curl -fsSL --max-time 5 -o "$t.part/$x" "https://raw.githubusercontent.com/manaflow-ai/cmux/27647ffd3ae838c63be28ca3e5883dcd68c34518/scripts/ci/api_call_log/$x" || break; done; [ -s "$t.part/isolated.py" ] && mv "$t.part" "$t"; fi; if [ -f "$t/env.sh" ]; then echo "$t/env.sh"; else echo unset BASH_ENV > "$t.off.sh" && echo "$t.off.sh"; fi; fi; } 2>/dev/null)'

jobs:
  bench:
    name: codec-bench H.264 rows (Windows)
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'windows-2025' || vars.WINDOWS_RUNNER || fromJSON(vars.RUNNER_POOLS).windows }}
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up pinned Rust
        uses: ./.github/actions/setup-cmux-tui-rust

      # cmux-codecs is its own cargo workspace. VP9 (libvpx's configure and make) and AV1
      # are left out: these rows are H.264 only.
      - name: Build codec-bench
        working-directory: cmux-tui/crates/cmux-codecs
        run: cargo build --release --locked --no-default-features --bin codec-bench

      # The same codec-bench.exe, for a Windows machine with a GPU encoder that no runner has:
      # codec-bench.exe --codecs h264,h264-mf --scenes page,scroll,drag,typing --loss 0,2,2b
      # --rtt-ms 50 --seconds 10
      - name: Keep codec-bench.exe
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codec-bench-windows-exe
          path: cmux-tui/crates/cmux-codecs/target/release/codec-bench.exe
          retention-days: 3  # retention-class: report

      # Windows Server ships Media Foundation (and its software H.264 MFT) as an optional
      # feature; client Windows has it built in. Without it the h264-mf rows say so.
      - name: Media Foundation feature (Windows Server)
        continue-on-error: true
        shell: pwsh
        run: |
          if (Get-Command Get-WindowsFeature -ErrorAction SilentlyContinue) {
            $f = Get-WindowsFeature Server-Media-Foundation
            if ($f -and -not $f.Installed) { Install-WindowsFeature Server-Media-Foundation | Format-List }
            Get-WindowsFeature Server-Media-Foundation | Format-Table -AutoSize
          }

      - name: GPUs on this machine
        shell: pwsh
        run: |
          Get-CimInstance Win32_VideoController | Select-Object Name, DriverVersion | Format-Table -AutoSize | Out-String | Tee-Object -Variable gpus
          Add-Content $env:GITHUB_STEP_SUMMARY "GPU: $gpus"

      # GitHub runs pwsh steps with $ErrorActionPreference = stop already. The rows go to the
      # job's own target directory and into the log and step summary.
      - name: Rows
        shell: pwsh
        working-directory: cmux-tui/crates/cmux-codecs
        run: |
          # One pass per variant: codecs, the encoder settings (CMUX_OPENH264_TUNING and
          # CMUX_MF_TUNING, read only by the bench), then the link's Mbps. The first pass is the
          # shipped settings.
          $variants = @(
            @('h264,h264-mf,h264-mf-sw', '', '', '30'),
            @('h264', 'frameskip=0', '', '30'),
            @('h264', 'frameskip=0,threads=4', '', '30'),
            @('h264', '', '', '10'),
            @('h264', 'frameskip=0', '', '10'),
            @('h264', '', '', '5'),
            @('h264', 'frameskip=0', '', '5'),
            @('h264-mf-sw', '', 'rc=pvbr,peak=200', '10')
          )
          $n = 0
          foreach ($v in $variants) {
            $n += 1
            $env:CMUX_OPENH264_TUNING = $v[1]
            $env:CMUX_MF_TUNING = $v[2]
            $head = "### variant $n codecs=$($v[0]) openh264=[$($v[1])] mf=[$($v[2])] link=$($v[3])"
            Write-Output $head
            Add-Content $env:GITHUB_STEP_SUMMARY $head
            $bench = @('--codecs', $v[0], '--scenes', 'page,scroll,drag,typing', '--loss', '0,2,2b', '--rtt-ms', '50', '--link-mbps', $v[3], '--seconds', '10', '--json', "target\codec-bench-windows-$n.jsonl")
            .\target\release\codec-bench.exe @bench | Tee-Object -Variable table
            if ($LASTEXITCODE -ne 0) { throw "codec-bench exited with $LASTEXITCODE" }
            Add-Content $env:GITHUB_STEP_SUMMARY ($table -join [Environment]::NewLine)
          }
          Write-Output '--- rows (JSON lines) ---'
          Get-Content target\codec-bench-windows-*.jsonl
