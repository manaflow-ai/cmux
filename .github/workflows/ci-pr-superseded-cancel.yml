name: CI PR superseded cancel

# Leo, 2026-11-21: "de facto, im asking for 99% fewer minutes of ci time, period."
#
# A push to a pull request cancels that pull request's runs on its older heads right away, across every workflow.
# Each workflow's own `cancel-in-progress` group cancels an older head's run only once that workflow's run on the new
# head is created, and the router's callees and later events start minutes after the push: on the 24 h to
# 2026-11-25T23Z, 69k job-minutes (about 46 per merged pull request) ran after a newer head of the same pull request
# was pushed. ci-shed-superseded-runs.yml sweeps every 10 minutes but stops only jobs that never started.
#
# scripts/ci/cancel_superseded_pr_runs.py has the policy (verdict()): never the pushed head's runs, never a rerun
# (attempt > 1), a workflow_dispatch or schedule run, a fork, a protected branch or a nightly/release/deploy/publish
# workflow. Same-repository pull requests only (a fork's token cannot cancel); no-janitor keeps every run.
on:
  pull_request:
    types: [synchronize]

permissions: {}

# A newer push supersedes an older canceller: the newer one cancels the same runs and more.
concurrency:
  group: ci-pr-superseded-cancel-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # Temporary REST budget attribution: one gh-call line per GitHub API call (scripts/ci/api_call_log/env.sh, fetched at a fixed commit when the checkout has no copy).
  BASH_ENV: '$({ w="${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh"; t="${RUNNER_TEMP:-/nonexistent}/api-call-log-src"; if [ -f "$w" ]; then echo "$w"; elif [ -n "${RUNNER_TEMP:-}" ]; then if [ ! -f "$t/env.sh" ] && [ ! -e "$t.tried" ] && { [ "${RUNNER_OS:-}" = Linux ] || [ "${RUNNER_OS:-}" = macOS ]; } && [ "$(date -u +%Y%m%d%H)" -lt 2026112300 ]; then : > "$t.tried"; mkdir -p "$t.part" && for x in env.sh gh sitecustomize.py isolated.py; do curl -fsSL --max-time 5 -o "$t.part/$x" "https://raw.githubusercontent.com/manaflow-ai/cmux/27647ffd3ae838c63be28ca3e5883dcd68c34518/scripts/ci/api_call_log/$x" || break; done; [ -s "$t.part/isolated.py" ] && mv "$t.part" "$t"; fi; if [ -f "$t/env.sh" ]; then echo "$t/env.sh"; else echo unset BASH_ENV > "$t.off.sh" && echo "$t.off.sh"; fi; fi; } 2>/dev/null)'

jobs:
  cancel:
    name: Cancel runs on older heads
    if: github.repository == 'manaflow-ai/cmux' && github.event.pull_request.head.repo.full_name == github.repository && !contains(github.event.pull_request.labels.*.name, 'no-janitor')
    # The pr router's runner: the small job every push already starts.
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || 'cmux-linux' }}
    timeout-minutes: 3
    permissions:
      actions: write
      contents: read
    steps:
      - name: Check out the cancel script
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/ci/cancel_superseded_pr_runs.py
            scripts/ci/shed_superseded_runs.py
            scripts/ci/deadline_http.py
            /.gitmodules
          sparse-checkout-cone-mode: false

      - name: Cancel this pull request's runs on older heads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SELF_RUN_ID: ${{ github.run_id }}
        run: python3 scripts/ci/cancel_superseded_pr_runs.py
