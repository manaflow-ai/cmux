name: CI PR run cleanup

# One dispatcher owns both pull-request run cleanup paths:
# - synchronize cancels runs on older heads with cancel_superseded_pr_runs.py.
# - closed joins ci.yml's pull-request concurrency group so merged/closed PR runs end.
# The closed event's job is always skipped; concurrency cancellation does the work
# before a runner is allocated. Release, nightly and promote workflows are never
# selected by the cancellation script.
on:
  pull_request:
    types: [closed, synchronize]

permissions: {}

concurrency:
  group: ${{ github.event.action == 'closed' && (contains(github.event.pull_request.labels.*.name, 'no-janitor') && format('ci-pr-closed-kept-{0}', github.event.pull_request.number) || format('CI-refs/pull/{0}/merge', github.event.pull_request.number)) || format('ci-pr-superseded-cancel-{0}', github.event.pull_request.number) }}
  cancel-in-progress: true

jobs:
  closed:
    name: Closed pull request cancellation
    if: ${{ false }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || contains(fromJSON('["blacksmith-2vcpu-ubuntu-2404","blacksmith-4vcpu-ubuntu-2404"]'), vars.CI_TRUSTED_RUNNER) && vars.CI_TRUSTED_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 1
    steps:
      - run: "true"

  superseded:
    name: Cancel runs on older heads
    if: github.repository == 'manaflow-ai/cmux' && github.event.action == 'synchronize' && github.event.pull_request.head.repo.full_name == github.repository && !contains(github.event.pull_request.labels.*.name, 'no-janitor')
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || 'cmux-linux' }}
    timeout-minutes: 3
    permissions:
      actions: write
      contents: read
    steps:
      - name: Check out the cancel script
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/ci/cancel_superseded_pr_runs.py
            scripts/ci/shed_superseded_runs.py
            scripts/ci/deadline_http.py
            /.gitmodules
          sparse-checkout-cone-mode: false

      - name: Cancel this pull request's runs on older heads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SELF_RUN_ID: ${{ github.run_id }}
        run: python3 scripts/ci/cancel_superseded_pr_runs.py
