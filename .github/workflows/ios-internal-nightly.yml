name: cmux-next iPhone INTERNAL builder
run-name: ${{ github.event_name == 'push' && 'cmux-next-ios INTERNAL builder branch moved' || format('cmux-next-ios INTERNAL {0}{1}', inputs.sha, inputs.submittable && ' (submittable)' || '') }}

# Continuous TestFlight builds of cmux-next's iPhone app (cmux-next-ios, App Store
# Connect app "cmux INTERNAL", dev.cmux.app.internal) for internal testers.
# Design: plans/cmux-next/ios-testflight-builder-DESIGN.md.
#
# Only ios-internal-nightly-trigger.yml dispatches this, on the admin-only
# branch rc/cnx-ios-builder (the `release` environment admits rc/**). The
# workflow file and the signing script therefore come from that frozen branch;
# feat-cmux-next code (inputs.sha) runs only in `archive`, which reads no
# secret. Archive on the dedicated mini while it is free, else Blacksmith; sign/validate/upload on an
# ephemeral Blacksmith Mac. "What to Test" is written by `notes`, which holds
# no signing secret (scripts/ci/ios_internal_notes.py).
on:
  # A push to rc/cnx-ios-builder (an admin fast-forward) only registers this
  # dispatch-only workflow with GitHub, which refuses to dispatch a workflow it
  # has never seen run; every job below skips on push.
  push:
    branches: [rc/cnx-ios-builder]
  workflow_dispatch:
    inputs:
      sha:
        description: feat-cmux-next commit (40 hex) to build
        required: true
        type: string
      base:
        description: last uploaded commit; "What to Test" lists base..sha (empty finds it in App Store Connect)
        required: false
        default: ''
        type: string
      # Off for every nightly (ios-internal-nightly-trigger.yml never sets it):
      # their builds stay internal-only. A person sets it to build cmux INTERNAL
      # for App Review (Leo, 2026-11-22: "esp cuz i NEED this shit on THE FUCKING
      # APP STORE"): the upload leaves out --internal-only, the version must be
      # above the record's last approved App Store version, the build is attached
      # to that App Store version, and the App Review gate judges the exact IPA as
      # an internal-submission. Nothing is submitted here: ios-internal-submit.yml
      # does that, dispatched by a person, only after this run's gate said YES.
      submittable:
        description: Build for App Review (no --internal-only; gate the IPA as an internal-submission). Nightlies leave it off.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

# One build runs, at most one waits, and a newer dispatch replaces the waiting
# one, so the newest feat-cmux-next head always builds next.
concurrency:
  group: cmux-mobile-internal-next
  cancel-in-progress: false

env:
  # Temporary REST budget attribution: one gh-call line per GitHub API call (scripts/ci/api_call_log/env.sh, fetched at a fixed commit when the checkout has no copy).
  BASH_ENV: '$({ w="${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh"; t="${RUNNER_TEMP:-/nonexistent}/api-call-log-src"; if [ -f "$w" ]; then echo "$w"; elif [ -n "${RUNNER_TEMP:-}" ]; then if [ ! -f "$t/env.sh" ] && [ ! -e "$t.tried" ] && { [ "${RUNNER_OS:-}" = Linux ] || [ "${RUNNER_OS:-}" = macOS ]; } && [ "$(date -u +%Y%m%d%H)" -lt 2026112300 ]; then : > "$t.tried"; mkdir -p "$t.part" && for x in env.sh gh sitecustomize.py isolated.py; do curl -fsSL --max-time 5 -o "$t.part/$x" "https://raw.githubusercontent.com/manaflow-ai/cmux/27647ffd3ae838c63be28ca3e5883dcd68c34518/scripts/ci/api_call_log/$x" || break; done; [ -s "$t.part/isolated.py" ] && mv "$t.part" "$t"; fi; if [ -f "$t/env.sh" ]; then echo "$t/env.sh"; else echo unset BASH_ENV > "$t.off.sh" && echo "$t.off.sh"; fi; fi; } 2>/dev/null)'

jobs:
  # The archive prefers the dedicated mini (vars.CI_IOS_INTERNAL_RUNNER, its own
  # glaeda-runner-<runner name> label, warm caches) but never waits on it: this
  # job hands it on only while that mini is online and idle (up to 5 min while
  # busy), else the archive takes Blacksmith. Before, runs-on read the variable
  # directly, and a set variable never falls through, so every archive waited
  # on one mini (scripts/ci/ios_internal_runner.py). No PR pool: the archive is
  # what ships to TestFlight. Reads the runner list only; no feat-cmux-next code.
  pick-archive-runner:
    name: Pick the archive runner
    if: github.repository == 'manaflow-ai/cmux' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/rc/cnx-ios-builder'
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && (vars.CI_FORK_LINUX_RUNNER || 'ubuntu-24.04') || 'cmux-linux' }}
    timeout-minutes: 10
    # The routing App key, as every other runner picker reads it.
    environment:
      name: ci-routing-agent
      deployment: false
    permissions:
      contents: read
    outputs:
      dedicated: ${{ steps.pick.outputs.dedicated }}
      attempt: ${{ steps.pick.outputs.attempt }}
    steps:
      - name: Checkout the picker at the workflow commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        continue-on-error: true
        timeout-minutes: 2
        with:
          persist-credentials: false
          sparse-checkout: scripts/ci

      - name: Mint the runner-list token
        id: route-token
        if: vars.GLAEDA_ROUTE_APP_ID != '' && vars.CI_IOS_INTERNAL_RUNNER != ''
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.GLAEDA_ROUTE_APP_ID }}
          private-key: ${{ secrets.GLAEDA_ROUTE_APP_KEY }}
          permission-administration: read

      - name: Pick the dedicated mini while it can take the job, else Blacksmith
        id: pick
        continue-on-error: true
        timeout-minutes: 8
        env:
          CI_RUNNER_STATE: ${{ vars.CI_RUNNER_STATE }}
          ROUTE_TOKEN: ${{ steps.route-token.outputs.token }}
          DEDICATED_LABEL: ${{ vars.CI_IOS_INTERNAL_RUNNER }}
        run: python3 scripts/ci/ios_internal_runner.py

  archive:
    name: Archive (unsigned, no secrets)
    needs: pick-archive-runner
    # !cancelled(): a failed picker leaves its outputs empty and the archive takes Blacksmith.
    if: "!cancelled() && github.repository == 'manaflow-ai/cmux' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/rc/cnx-ios-builder'"
    # The pick counts only on the attempt it was made for, so a re-run of failed
    # jobs that keeps the picker's outputs takes Blacksmith.
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || needs.pick-archive-runner.outputs.attempt == format('{0}', github.run_attempt) && needs.pick-archive-runner.outputs.dedicated != '' && needs.pick-archive-runner.outputs.dedicated || vars.CI_OVERFLOW_MAC || 'cmux-mac' }}
    timeout-minutes: 90
    outputs:
      marketing: ${{ steps.stamp.outputs.marketing }}
      build_number: ${{ steps.stamp.outputs.build_number }}
    env:
      SHA: ${{ inputs.sha }}
      # The dedicated mini keeps ~/cmux-mobile-builds/.cache (xcframework, cargo,
      # SwiftPM) warm between builds; a Blacksmith fallback builds under its temp.
      HOSTED_FALLBACK: ${{ !(needs.pick-archive-runner.outputs.attempt == format('{0}', github.run_attempt) && needs.pick-archive-runner.outputs.dedicated != '') }}
    steps:
      - name: Check the commit
        run: |
          set -euo pipefail
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "sha must be 40 lowercase hex" >&2; exit 1; }

      - name: Checkout the commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ inputs.sha }}
          # testflight-build.sh archives the commit with `git archive`.
          fetch-depth: 0

      # App Store Connect warns (ITMS-90725, one email per upload) on any build
      # made with an SDK older than iOS 27, and will refuse it. Blacksmith's
      # macOS 26 image carries Xcode 27 beside the pool's 26.6 pin
      # (scripts/ci/xcode-pins.txt), so this job pins a released Xcode 27
      # instead: vars.IOS_STORE_XCODE_APP if set, else Xcode 27.1, else the
      # newest Xcode_27.x on the image. Betas and release candidates are refused (App
      # Store Connect rejects their SDKs). No Xcode 27 fails the job: an
      # upload on the old SDK is what this replaces.
      - name: Pin Xcode 27 (iOS 27 SDK) for App Store Connect
        env:
          IOS_STORE_XCODE_APP: ${{ vars.IOS_STORE_XCODE_APP }}
        run: |
          set -euo pipefail
          pick="${IOS_STORE_XCODE_APP:-}"
          # 27.1 first: the release the hosted xcode-27 image defaults to. A
          # newer 27.x on an image can still be a release candidate.
          for app in /Applications/Xcode_27.1.app /Applications/Xcode_27.1.0.app; do
            [ -n "$pick" ] || { [ -d "$app/Contents/Developer" ] && pick="$app"; } || true
          done
          if [ -z "$pick" ]; then
            best=""; best_rank=-1
            for app in /Applications/Xcode_27*.app /Applications/Xcode.app; do
              [ -d "$app/Contents/Developer" ] || continue
              case "$(basename "$app")" in *[Bb]eta*|*[Rr]elease_[Cc]andidate*|*RC*) continue ;; esac
              v="$(DEVELOPER_DIR="$app/Contents/Developer" xcodebuild -version 2>/dev/null | awk 'NR==1{print $2}')"
              echo "found $app: Xcode ${v:-?}"
              case "$v" in 27|27.*) ;; *) continue ;; esac
              IFS=. read -r maj min pat <<< "$v"
              rank=$(( ${maj:-0} * 10000 + ${min:-0} * 100 + ${pat:-0} ))
              if [ "$rank" -gt "$best_rank" ]; then best="$app"; best_rank="$rank"; fi
            done
            pick="$best"
          fi
          if [ -z "$pick" ] || [ ! -d "$pick/Contents/Developer" ]; then
            echo "::error::No released Xcode 27 on this runner (looked for ${pick:-/Applications/Xcode_27*.app}); App Store Connect needs the iOS 27 SDK (ITMS-90725). Installed: $(find /Applications -maxdepth 1 -name "Xcode*.app" 2>/dev/null | sort | tr '\n' ' ')" >&2
            exit 1
          fi
          sdk="$(DEVELOPER_DIR="$pick/Contents/Developer" xcrun --sdk iphoneos --show-sdk-version)"
          case "$sdk" in 27|27.*) ;; *) echo "::error::$pick has iOS SDK $sdk, not 27" >&2; exit 1 ;; esac
          echo "Pinned $pick (iOS SDK $sdk) for App Store Connect"
          echo "CMUX_CI_XCODE_APP=$pick" >> "$GITHUB_ENV"
          CMUX_CI_XCODE_APP="$pick" ./scripts/select-ci-xcode.sh

      - name: Select Xcode
        run: ./scripts/select-ci-xcode.sh

      - name: Tools (xcodegen, Rust)
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:$HOME/.cargo/bin:$PATH"
          command -v xcodegen >/dev/null || brew install xcodegen
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          fi
          { echo "/opt/homebrew/bin"; echo "$HOME/.cargo/bin"; } >> "$GITHUB_PATH"

      - name: Version and build number
        id: stamp
        run: python3 scripts/ci/ios_internal_builder.py stamp --project-yml cmux-next-ios/project.yml

      - name: Archive
        env:
          MARKETING: ${{ steps.stamp.outputs.marketing }}
          BUILD_NUMBER: ${{ steps.stamp.outputs.build_number }}
        run: |
          set -euo pipefail
          root="$HOME/cmux-mobile-builds"
          [ "$HOSTED_FALLBACK" != true ] || root="$RUNNER_TEMP/cmux-mobile-builds"
          export CMUX_MOBILE_BUILDS_ROOT="$root"
          cmux-next-ios/scripts/testflight-build.sh --ref "$SHA" --unsigned --no-asc \
            --marketing-version "$MARKETING" --build-number "$BUILD_NUMBER"
          out="$(find "$root" -maxdepth 1 -type d -name "*-${SHA:0:10}-testflight" -print0 | xargs -0 ls -td | head -1)"
          mkdir -p "$RUNNER_TEMP/handoff"
          ditto -c -k --keepParent "$out/CmuxMobileApp.xcarchive" "$RUNNER_TEMP/handoff/CmuxMobileApp.xcarchive.zip"
          cp "$out/MANIFEST.md" "$RUNNER_TEMP/handoff/"
          cat "$out/MANIFEST.md" >> "$GITHUB_STEP_SUMMARY"

      # Fails the build before the signer gets it: what App Store Connect
      # rejects only after an upload (ITMS-90626, 90683, ...). The checker
      # is the built commit's; testflight-build.sh also runs it.
      - name: App Store review rules (built app)
        run: |
          set -euo pipefail
          root="$HOME/cmux-mobile-builds"
          [ "$HOSTED_FALLBACK" != true ] || root="$RUNNER_TEMP/cmux-mobile-builds"
          out="$(find "$root" -maxdepth 1 -type d -name "*-${SHA:0:10}-testflight" -print0 | xargs -0 ls -td | head -1)"
          python3 -I scripts/cmux-next/check-app-store-rules.py --source .
          python3 -I scripts/cmux-next/check-app-store-rules.py --app "$out/CmuxMobileApp.xcarchive/Products/Applications/CmuxMobileApp.app"
          # The SDK App Store Connect reads (ITMS-90725 when it is below iOS 27).
          sdk="$(/usr/libexec/PlistBuddy -c 'Print :DTSDKName' "$out/CmuxMobileApp.xcarchive/Products/Applications/CmuxMobileApp.app/Info.plist")"
          echo "Built with $sdk ($(/usr/libexec/PlistBuddy -c 'Print :DTXcodeBuild' "$out/CmuxMobileApp.xcarchive/Products/Applications/CmuxMobileApp.app/Info.plist"))" | tee -a "$GITHUB_STEP_SUMMARY"
          case "$sdk" in iphoneos27*) ;; *) echo "::error::The archive was built with $sdk; App Store Connect needs iphoneos27 or later (ITMS-90725)" >&2; exit 1 ;; esac

      - name: Hand the archive to the signer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-mobile-internal-archive-${{ github.run_id }}
          path: ${{ runner.temp }}/handoff/
          retention-days: 3
          if-no-files-found: error

      - name: Clear the hand-off copy
        if: always()
        run: rm -rf "$RUNNER_TEMP/handoff"

  # Only when the dispatch has no base (the first build after a manual or
  # retired-lane upload): the newest processed build's note records the commit
  # it was built from (its first line, written by `notes`). This job holds the
  # App Store Connect key only, reads one list, and hands on a commit id.
  previous-build:
    name: Last build in App Store Connect (read only)
    if: github.repository == 'manaflow-ai/cmux' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/rc/cnx-ios-builder' && inputs.base == ''
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || 'cmux-gcp-nightly-jit-x64' }}
    timeout-minutes: 10
    # Never fails the run: the trigger reads run conclusions as "uploaded or not".
    continue-on-error: true
    environment: release
    permissions:
      contents: read
    outputs:
      ref: ${{ steps.asc.outputs.ref }}
    steps:
      - name: Checkout the builder branch (trusted script)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          sparse-checkout: scripts/ci

      # A failure here only widens the note's range lookup to the run history;
      # it must not fail the run (the trigger reads run conclusions).
      - name: Read the commit the newest processed build records
        id: asc
        continue-on-error: true
        env:
          ASC_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          key_dir="$RUNNER_TEMP/asc"; mkdir -p "$key_dir"; chmod 700 "$key_dir"
          trap 'rm -rf "$key_dir"' EXIT
          printf '%s' "$ASC_API_KEY_P8_BASE64" | base64 --decode > "$key_dir/AuthKey.p8"
          chmod 600 "$key_dir/AuthKey.p8"
          ASC_PRIVATE_KEY_PATH="$key_dir/AuthKey.p8" python3 -I scripts/ci/ios_internal_notes.py asc-previous

  # "What to Test": the Changelog lines of the PRs in base..sha that change the
  # app (scripts/ci/ios_internal_notes.py). No signing secret: a read-only
  # token, and the builder branch's script reading feat-cmux-next history as data.
  notes:
    name: What to Test (no secrets)
    needs: previous-build
    if: ${{ !cancelled() && github.repository == 'manaflow-ai/cmux' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/rc/cnx-ios-builder' }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && (vars.CI_FORK_LINUX_RUNNER || 'ubuntu-24.04') || 'cmux-linux' }}
    timeout-minutes: 15
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: read
      actions: read
    env:
      SHA: ${{ inputs.sha }}
      BASE: ${{ inputs.base }}
      ASC_REF: ${{ needs.previous-build.outputs.ref }}
    steps:
      - name: Checkout the builder branch (trusted script)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          # History (trees, no file contents) for git log over base..sha; the
          # work tree is the script only.
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: scripts/ci

      # A failed note never stops the upload: the signer then sends the first line only.
      - name: Write the note
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "sha must be 40 lowercase hex" >&2; exit 1; }
          git fetch -q --no-tags --filter=blob:none origin "$SHA"
          mkdir -p "$RUNNER_TEMP/notes"
          python3 -I scripts/ci/ios_internal_notes.py notes --sha "$SHA" --base "$BASE" --asc-ref "$ASC_REF" \
            --out "$RUNNER_TEMP/notes/what-to-test.txt"
          sed 's/^/    /' "$RUNNER_TEMP/notes/what-to-test.txt" >> "$GITHUB_STEP_SUMMARY"  # indented: a fence in a PR line cannot break out

      - name: Hand the note to the signer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cnx-ios-internal-notes-${{ github.run_id }}
          path: ${{ runner.temp }}/notes/what-to-test.txt
          retention-days: 3
          if-no-files-found: ignore

  upload:
    name: Sign, validate, upload to cmux INTERNAL
    needs: [archive, notes]
    if: ${{ !cancelled() && needs.archive.result == 'success' && github.repository == 'manaflow-ai/cmux' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/rc/cnx-ios-builder' }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || vars.MACOS_RUNNER_26 || 'blacksmith-6vcpu-macos-26' }} # ephemeral signer (Blacksmith is trusted like hosted); the signing key stays off owned machines
    timeout-minutes: 75
    environment: release
    outputs:
      marketing: ${{ steps.upload.outputs.marketing }}
      build_number: ${{ steps.upload.outputs.build_number }}
      ipa_sha256: ${{ steps.upload.outputs.ipa_sha256 }}
    env:
      SHA: ${{ inputs.sha }}
      SUBMITTABLE: ${{ inputs.submittable }}
      ASC_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
    steps:
      - name: Checkout the builder branch (trusted signing script)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Fetch the built commit
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$SHA"
          git cat-file -e "$SHA^{commit}"

      - name: Check the builder branch carries the signing script
        run: |
          [ -x cmux-next-ios/scripts/testflight-build.sh ] || {
            echo "::error::rc/cnx-ios-builder has no cmux-next-ios/scripts/testflight-build.sh. An admin fast-forwards it to a feat-cmux-next commit that has cmux-next-ios (plans/cmux-next/ios-testflight-builder-DESIGN.md, Operations)."
            exit 1
          }

      # App Store Connect warns (ITMS-90725, one email per upload) on any build
      # made with an SDK older than iOS 27, and will refuse it. Blacksmith's
      # macOS 26 image carries Xcode 27 beside the pool's 26.6 pin
      # (scripts/ci/xcode-pins.txt), so this job pins a released Xcode 27
      # instead: vars.IOS_STORE_XCODE_APP if set, else Xcode 27.1, else the
      # newest Xcode_27.x on the image. Betas and release candidates are refused (App
      # Store Connect rejects their SDKs). No Xcode 27 fails the job: an
      # upload on the old SDK is what this replaces.
      - name: Pin Xcode 27 (iOS 27 SDK) for App Store Connect
        env:
          IOS_STORE_XCODE_APP: ${{ vars.IOS_STORE_XCODE_APP }}
        run: |
          set -euo pipefail
          pick="${IOS_STORE_XCODE_APP:-}"
          # 27.1 first: the release the hosted xcode-27 image defaults to. A
          # newer 27.x on an image can still be a release candidate.
          for app in /Applications/Xcode_27.1.app /Applications/Xcode_27.1.0.app; do
            [ -n "$pick" ] || { [ -d "$app/Contents/Developer" ] && pick="$app"; } || true
          done
          if [ -z "$pick" ]; then
            best=""; best_rank=-1
            for app in /Applications/Xcode_27*.app /Applications/Xcode.app; do
              [ -d "$app/Contents/Developer" ] || continue
              case "$(basename "$app")" in *[Bb]eta*|*[Rr]elease_[Cc]andidate*|*RC*) continue ;; esac
              v="$(DEVELOPER_DIR="$app/Contents/Developer" xcodebuild -version 2>/dev/null | awk 'NR==1{print $2}')"
              echo "found $app: Xcode ${v:-?}"
              case "$v" in 27|27.*) ;; *) continue ;; esac
              IFS=. read -r maj min pat <<< "$v"
              rank=$(( ${maj:-0} * 10000 + ${min:-0} * 100 + ${pat:-0} ))
              if [ "$rank" -gt "$best_rank" ]; then best="$app"; best_rank="$rank"; fi
            done
            pick="$best"
          fi
          if [ -z "$pick" ] || [ ! -d "$pick/Contents/Developer" ]; then
            echo "::error::No released Xcode 27 on this runner (looked for ${pick:-/Applications/Xcode_27*.app}); App Store Connect needs the iOS 27 SDK (ITMS-90725). Installed: $(find /Applications -maxdepth 1 -name "Xcode*.app" 2>/dev/null | sort | tr '\n' ' ')" >&2
            exit 1
          fi
          sdk="$(DEVELOPER_DIR="$pick/Contents/Developer" xcrun --sdk iphoneos --show-sdk-version)"
          case "$sdk" in 27|27.*) ;; *) echo "::error::$pick has iOS SDK $sdk, not 27" >&2; exit 1 ;; esac
          echo "Pinned $pick (iOS SDK $sdk) for App Store Connect"
          echo "CMUX_CI_XCODE_APP=$pick" >> "$GITHUB_ENV"
          CMUX_CI_XCODE_APP="$pick" ./scripts/select-ci-xcode.sh

      - name: Select Xcode
        run: ./scripts/select-ci-xcode.sh

      - name: Install asc
        run: brew list asc >/dev/null 2>&1 || brew install asc

      - name: Download the archive
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: cmux-mobile-internal-archive-${{ github.run_id }}
          path: ${{ runner.temp }}/handoff

      - name: Materialize App Store Connect API key
        env:
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          [ -n "${ASC_KEY_ID:-}" ] && [ -n "${ASC_ISSUER_ID:-}" ] && [ -n "${ASC_API_KEY_P8_BASE64:-}" ] \
            || { echo "Missing ASC_API_KEY_ID / ASC_API_ISSUER_ID / ASC_API_KEY_P8_BASE64 in the release environment" >&2; exit 1; }
          key_dir="$RUNNER_TEMP/asc"; mkdir -p "$key_dir"; chmod 700 "$key_dir"
          printf '%s' "$ASC_API_KEY_P8_BASE64" | base64 --decode > "$key_dir/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$key_dir/AuthKey_${ASC_KEY_ID}.p8"
          echo "ASC_PRIVATE_KEY_PATH=$key_dir/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"

      - name: Import iOS distribution certificate
        env:
          IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          [ -n "${IOS_DISTRIBUTION_CERTIFICATE_BASE64:-}" ] && [ -n "${IOS_DISTRIBUTION_CERTIFICATE_PASSWORD:-}" ] \
            || { echo "Missing IOS_DISTRIBUTION_CERTIFICATE_BASE64 / _PASSWORD in the release environment" >&2; exit 1; }
          keychain=cmux-mobile-internal.keychain
          password="$(uuidgen)"
          cert="$RUNNER_TEMP/ios-distribution.p12"
          printf '%s' "$IOS_DISTRIBUTION_CERTIFICATE_BASE64" | base64 --decode > "$cert"
          security delete-keychain "$keychain" >/dev/null 2>&1 || true
          security create-keychain -p "$password" "$keychain"
          # Idle lock within the job timeout (75 min); signing ends long before it
          # (tests/test_ci_signing_keychain_is_deleted_before_bundle_code.py).
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$cert" -k "$keychain" -P "$IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$cert"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain"

      # The app's and both extensions' App Store profiles, fetched from App Store
      # Connect for CI's own certificate, and regenerated there when none lists it
      # (a portal regeneration with other certificates, a capability change, an
      # expiry). Before 2026-11-17 the app's profile was a hand-set secret
      # (IOS_BETA_PROVISIONING_PROFILE_INTERNAL_BASE64) that drifted from the
      # certificate and stopped every upload. Fails here, before anything is
      # signed, when a profile does not list CI's certificate.
      # Regeneration deletes and creates profiles in App Store Connect; the
      # repository variable CMUX_IOS_CI_PROFILE_REGENERATE=0 turns it off (fetch
      # only, fail with the portal step). On by default.
      - name: App Store profiles for CI's certificate (fetch or regenerate)
        env:
          CMUX_IOS_CI_PROFILE_REGENERATE: ${{ vars.CMUX_IOS_CI_PROFILE_REGENERATE || '1' }}
        run: python3 -I scripts/ci/ios_ci_profiles.py --keychain cmux-mobile-internal.keychain --out-dir "$RUNNER_TEMP/asc"

      # The note comes from the `notes` job; this job only reads it. Without
      # one, the first line still records the commit for the next build.
      - name: Download the What to Test note
        continue-on-error: true
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: cnx-ios-internal-notes-${{ github.run_id }}
          path: ${{ runner.temp }}/notes

      - name: What to Test
        run: |
          set -euo pipefail
          note="$RUNNER_TEMP/notes/what-to-test.txt"
          if [ ! -s "$note" ]; then
            mkdir -p "$RUNNER_TEMP/notes"
            printf 'cmux-next iPhone, feat-cmux-next %s. Internal testers only.\n' "${SHA:0:12}" > "$note"
          fi
          cp "$note" "$RUNNER_TEMP/what-to-test.txt"
          cat "$RUNNER_TEMP/what-to-test.txt"

      - name: Sign, validate, upload
        id: upload
        env:
          CMUX_MOBILE_CI_ASC: "1"
          # The profiles that list CI's certificate (paths from the step above;
          # the names are for the script's messages; verify/rich-push.md).
          CMUX_MOBILE_PROFILE_NAME: cmux Internal Distribution CI
          CMUX_MOBILE_CONTENT_EXTENSION_PROFILE_NAME: cmux Internal Distribution CI Notification Content
          # The same for the notification service extension (verify/notifications-trust.md).
          CMUX_MOBILE_SERVICE_EXTENSION_PROFILE_NAME: cmux Internal Distribution CI Notification Service
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/archive"
          ditto -x -k "$RUNNER_TEMP/handoff/CmuxMobileApp.xcarchive.zip" "$RUNNER_TEMP/archive"
          # Nightlies: internal testers only. `submittable`: a build App Review may take.
          reach=(--internal-only)
          [ "$SUBMITTABLE" != true ] || reach=(--submittable)
          CMUX_MOBILE_BUILDS_ROOT="$RUNNER_TEMP/cmux-mobile-builds" cmux-next-ios/scripts/testflight-build.sh --ref "$SHA" \
            --from-archive "$RUNNER_TEMP/archive/CmuxMobileApp.xcarchive" --upload "${reach[@]}" \
            --what-to-test "$(cat "$RUNNER_TEMP/what-to-test.txt")"
          out="$(find "$RUNNER_TEMP/cmux-mobile-builds" -maxdepth 1 -type d -name "*-testflight" | head -1)"
          cat "$out/MANIFEST.md" >> "$GITHUB_STEP_SUMMARY"
          app="$RUNNER_TEMP/archive/CmuxMobileApp.xcarchive/Products/Applications/CmuxMobileApp.app"
          {
            echo "marketing=$(plutil -extract CFBundleShortVersionString raw "$app/Info.plist")"
            echo "build_number=$(plutil -extract CFBundleVersion raw "$app/Info.plist")"
            echo "ipa_sha256=$(shasum -a 256 "$out/CmuxMobileApp.ipa" | cut -d' ' -f1)"
          } >> "$GITHUB_OUTPUT"
          if [ "$SUBMITTABLE" = true ]; then
            mkdir -p "$RUNNER_TEMP/submission-ipa"
            cp "$out/CmuxMobileApp.ipa" "$RUNNER_TEMP/submission-ipa/"
          fi

      # `submittable` only: the processed build goes onto the record's App Store
      # version (the version must already exist in App Store Connect), so the
      # gate's `asc validate --strict` judges the version with this build.
      - name: Attach the build to its App Store version (submittable only)
        if: inputs.submittable
        env:
          ASC_APP_ID: ${{ vars.IOS_INTERNAL_APP_ID }}
          VERSION: ${{ steps.upload.outputs.marketing }}
          BUILD_NUMBER: ${{ steps.upload.outputs.build_number }}
        run: |
          set -euo pipefail
          [[ "$ASC_APP_ID" =~ ^[0-9]+$ ]] || { echo "::error::repository variable IOS_INTERNAL_APP_ID (cmux INTERNAL's App Store Connect app id) is not set" >&2; exit 1; }
          cmux-next-ios/scripts/asc_submit_review.sh attach --app "$ASC_APP_ID" --version "$VERSION" --build-number "$BUILD_NUMBER"

      # The exact IPA uploaded, for the App Review gate below and the submit
      # workflow's checksum check.
      - name: Hand the submittable IPA to the gate
        if: inputs.submittable
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-internal-submission-ipa-${{ github.run_id }}
          path: ${{ runner.temp }}/submission-ipa/CmuxMobileApp.ipa
          retention-days: 14
          if-no-files-found: error

      - name: Keep the manifest and logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-mobile-internal-${{ github.run_id }}
          retention-days: 3
          path: |
            ${{ runner.temp }}/cmux-mobile-builds/*-testflight/MANIFEST.md
            ${{ runner.temp }}/cmux-mobile-builds/*-testflight/ExportOptions.plist
            ${{ runner.temp }}/cmux-mobile-builds/*-testflight/logs/
          if-no-files-found: ignore

      - name: Delete signing material
        if: always()
        run: |
          security delete-keychain cmux-mobile-internal.keychain >/dev/null 2>&1 || true
          rm -rf "$RUNNER_TEMP/asc" "$RUNNER_TEMP/archive" "$RUNNER_TEMP/handoff" "$RUNNER_TEMP/submission-ipa"

  # `submittable` only: the App Review gate judges the exact uploaded IPA as
  # cmux INTERNAL's App Store submission (lane internal-submission: TestFlight
  # configuration, bundle dev.cmux.app.internal, signed entitlements, and
  # `asc validate --strict` against vars.IOS_INTERNAL_APP_ID in the release
  # environment). Its scripts come from feat-cmux-next (gate_ref).
  review-gate:
    name: App Review gate (internal-submission)
    needs: upload
    if: ${{ !cancelled() && needs.upload.result == 'success' && inputs.submittable && github.repository == 'manaflow-ai/cmux' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/rc/cnx-ios-builder' }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/ios-review-gate.yml
    with:
      ref: ${{ inputs.sha }}
      lane: internal-submission
      ipa_artifact_name: cmux-internal-submission-ipa-${{ github.run_id }}
      gate_ref: feat-cmux-next
    # Only the App Store Connect key, for the gate's read-only `asc validate`
    # (never `secrets: inherit`: the signing secrets stay with upload).
    secrets:
      ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
      ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
      ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}

  # The receipt ios-internal-submit.yml refuses to submit without: written only
  # when the gate judged this run's commit and IPA with no blocker.
  submission-receipt:
    name: Submission receipt (gate said YES)
    needs: [upload, review-gate]
    if: ${{ !cancelled() && needs.review-gate.result == 'success' && needs.review-gate.outputs.blocking == '0' && needs.review-gate.outputs.sha == inputs.sha }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && (vars.CI_FORK_LINUX_RUNNER || 'ubuntu-24.04') || 'cmux-linux' }}
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Write the receipt
        env:
          SHA: ${{ inputs.sha }}
          MARKETING: ${{ needs.upload.outputs.marketing }}
          BUILD_NUMBER: ${{ needs.upload.outputs.build_number }}
          IPA_SHA256: ${{ needs.upload.outputs.ipa_sha256 }}
          BLOCKING: ${{ needs.review-gate.outputs.blocking }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/receipt"
          python3 -I -c '
          import json, os, sys
          keys = ("SHA", "MARKETING", "BUILD_NUMBER", "IPA_SHA256", "BLOCKING", "GITHUB_RUN_ID")
          json.dump({k.lower(): os.environ[k] for k in keys} | {"bundle_id": "dev.cmux.app.internal", "lane": "internal-submission"},
                    open(sys.argv[1], "w"), indent=2)' "$RUNNER_TEMP/receipt/submission.json"
          { echo '```json'; cat "$RUNNER_TEMP/receipt/submission.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-internal-submission-receipt-${{ github.run_id }}
          path: ${{ runner.temp }}/receipt/submission.json
          retention-days: 14
          if-no-files-found: error
