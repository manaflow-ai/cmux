name: Cloud probe team grant

# Gives cmuxterm-hq's production probe team `paused-claim-probe` (team_0f8b004051872de73537) the operator Cloud plan
# grant cmuxVmPlan "pro" on its Stack team record, so cmux-platform answers its cloud.machine.create with a machine
# instead of cloud.plan.required (scripts/ci/cloud_probe_team_grant.py; it refuses every other team and project).
# It runs once when a change to it lands on main (a lane cannot dispatch it), and on dispatch; a rerun writes nothing.

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cloud-probe-team-grant.yml
      - scripts/ci/cloud_probe_team_grant.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloud-probe-team-grant
  cancel-in-progress: false

jobs:
  grant:
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || contains(fromJSON('["blacksmith-4vcpu-ubuntu-2404","blacksmith-8vcpu-ubuntu-2404","blacksmith-16vcpu-ubuntu-2404","blacksmith-32vcpu-ubuntu-2404"]'), vars.LINUX_RUNNER) && vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    # The production Stack keys (cloud-vm-smoke-sweep.yml's environment): deployments from main only.
    environment: cloud-vm-canary
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: scripts/ci
          sparse-checkout-cone-mode: true

      - name: Grant and read back
        env:
          NEXT_PUBLIC_STACK_PROJECT_ID: ${{ vars.NEXT_PUBLIC_STACK_PROJECT_ID }}
          STACK_SECRET_SERVER_KEY: ${{ secrets.STACK_SECRET_SERVER_KEY }}
        run: |
          set -o pipefail
          python3 scripts/ci/cloud_probe_team_grant.py | tee -a "$GITHUB_STEP_SUMMARY"
