name: Merge receipt

# Records on each merged pull request which checks on its head had passed when
# it merged and which had not (scripts/ci/merge_receipt.py), and labels it
# merged-unverified when a judging check was not green. It runs after the merge,
# so it cannot block or slow one. pull_request_target gives fork pull requests
# a write token; the job only reads the GitHub API and runs the script from the
# commit this workflow was loaded from, never the pull request's code.
on:
  pull_request_target:
    types: [closed]
    branches: [main]

permissions: {}

env:
  # Temporary REST budget attribution: one gh-call line per GitHub API call (scripts/ci/api_call_log/env.sh, fetched at a fixed commit when the checkout has no copy).
  BASH_ENV: '$({ w="${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh"; t="${RUNNER_TEMP:-/nonexistent}/api-call-log-src"; if [ -f "$w" ]; then echo "$w"; elif [ -n "${RUNNER_TEMP:-}" ]; then if [ ! -f "$t/env.sh" ] && [ ! -e "$t.tried" ] && { [ "${RUNNER_OS:-}" = Linux ] || [ "${RUNNER_OS:-}" = macOS ]; } && [ "$(date -u +%Y%m%d%H)" -lt 2026112300 ]; then : > "$t.tried"; mkdir -p "$t.part" && for x in env.sh gh sitecustomize.py isolated.py; do curl -fsSL --max-time 5 -o "$t.part/$x" "https://raw.githubusercontent.com/manaflow-ai/cmux/27647ffd3ae838c63be28ca3e5883dcd68c34518/scripts/ci/api_call_log/$x" || break; done; [ -s "$t.part/isolated.py" ] && mv "$t.part" "$t"; fi; if [ -f "$t/env.sh" ]; then echo "$t/env.sh"; else echo unset BASH_ENV > "$t.off.sh" && echo "$t.off.sh"; fi; fi; } 2>/dev/null)'

jobs:
  receipt:
    if: github.event.pull_request.merged == true
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || 'blacksmith-4vcpu-ubuntu-2404' }} # ephemeral-required: trusted pull-request-write token
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      checks: read
      statuses: read
    steps:
      # The comment and label writes spend REST. The job's GITHUB_TOKEN draws on the repository's one hourly pool,
      # which every workflow shares and which ran out at 09:33Z on 2026-11-16 (#40579: HTTP 403 on the comment read,
      # both attempts). The cmux-bot App has its own pool; github.token stays the fallback when it is not configured
      # or its mint fails.
      - name: Mint the cmux-bot token
        id: cmux-bot-token
        if: vars.CMUX_BOT_APP_ID != ''
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.CMUX_BOT_APP_ID }}
          private-key: ${{ secrets.CMUX_BOT_APP_KEY }}
          permission-issues: write
          permission-pull-requests: write

      - name: Checkout trusted script
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            scripts/ci/merge_receipt.py
            scripts/ci/pr_status.py
          sparse-checkout-cone-mode: false

      - name: Post merge receipt
        env:
          GH_TOKEN: ${{ steps.cmux-bot-token.outputs.token || github.token }}
          # The check rollup read (GraphQL) needs checks and statuses read: the job's own token.
          CHECKS_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: python3 scripts/ci/merge_receipt.py post --repo "$REPO" --pr "$PR"
