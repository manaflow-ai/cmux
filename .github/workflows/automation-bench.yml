name: Automation bench scoreboard

# Unit tests for the automation bench scoreboard (plans/cmux-next/automation-bench.md).
# Not a merge gate yet; live bench runs happen on fleet Macs, not here.

on:
  pull_request:
    paths:
      - tests/automation-bench/**
      - .github/workflows/automation-bench.yml
  push:
    branches: [feat-cmux-next]
    paths:
      - tests/automation-bench/**
      - .github/workflows/automation-bench.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: automation-bench-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scoreboard:
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-4vcpu-ubuntu-2404' || vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"
      - run: bun test tests/automation-bench
      - run: python3 tests/automation-bench/cua/test_cua_bench.py
