name: cmux-next PR autofix closed

# cmux-next-pr-closed-cancel.yml's twin for cmux-next-pr-autofix.yml, whose
# runs have a group of their own (cmux-next-pr-autofix-<number>), including its
# Mac action exports job: a merged or closed pull request's autofix run ends
# when the pull request closes instead of at the queue janitor's next sweep.
on:
  pull_request:
    types: [closed]
    branches: [feat-cmux-next]

permissions: {}

concurrency:
  group: ${{ contains(github.event.pull_request.labels.*.name, 'no-janitor') && format('cmux-next-pr-autofix-closed-kept-{0}', github.event.pull_request.number) || format('cmux-next-pr-autofix-{0}', github.event.pull_request.number) }}
  cancel-in-progress: true

env:
  # Temporary REST budget attribution: one gh-call line per GitHub API call (scripts/ci/api_call_log/env.sh, fetched at a fixed commit when the checkout has no copy).
  BASH_ENV: '$({ w="${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh"; t="${RUNNER_TEMP:-/nonexistent}/api-call-log-src"; if [ -f "$w" ]; then echo "$w"; elif [ -n "${RUNNER_TEMP:-}" ]; then if [ ! -f "$t/env.sh" ] && [ ! -e "$t.tried" ] && { [ "${RUNNER_OS:-}" = Linux ] || [ "${RUNNER_OS:-}" = macOS ]; } && [ "$(date -u +%Y%m%d%H)" -lt 2026112300 ]; then : > "$t.tried"; mkdir -p "$t.part" && for x in env.sh gh sitecustomize.py isolated.py; do curl -fsSL --max-time 5 -o "$t.part/$x" "https://raw.githubusercontent.com/manaflow-ai/cmux/27647ffd3ae838c63be28ca3e5883dcd68c34518/scripts/ci/api_call_log/$x" || break; done; [ -s "$t.part/isolated.py" ] && mv "$t.part" "$t"; fi; if [ -f "$t/env.sh" ]; then echo "$t/env.sh"; else echo unset BASH_ENV > "$t.off.sh" && echo "$t.off.sh"; fi; fi; } 2>/dev/null)'

jobs:
  cancelled:
    # The run's concurrency group does the work; every run is a closed event,
    # so this job is always skipped and never takes a runner.
    if: github.event.action != 'closed'
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || contains(fromJSON('["blacksmith-2vcpu-ubuntu-2404","blacksmith-4vcpu-ubuntu-2404"]'), vars.CI_TRUSTED_RUNNER) && vars.CI_TRUSTED_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 1
    steps:
      - run: "true"
