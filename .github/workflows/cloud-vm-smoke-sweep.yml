name: Cloud VM smoke sweep

# Every hour, delete production smoke users older than 30 minutes and their
# VMs. smoke-vm-api.mjs keeps a user whose VM it could not delete so a later
# sweep can retry; this workflow is that sweep now that the five-minute canary
# is retired. It creates no VM (no --create): the script only makes and
# deletes one throwaway user after the sweep. A leftover that still cannot be
# deleted fails the run, so a leaked VM shows up as a red run.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloud-vm-smoke-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || contains(fromJSON('["blacksmith-4vcpu-ubuntu-2404","blacksmith-8vcpu-ubuntu-2404","blacksmith-16vcpu-ubuntu-2404","blacksmith-32vcpu-ubuntu-2404"]'), vars.LINUX_RUNNER) && vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 10
    # The canary's environment: only the Stack keys, deployments from main only.
    environment: cloud-vm-canary
    defaults:
      run:
        working-directory: web
    env:
      CMUX_CLOUD_VM_ENV_SOURCE: process
      NEXT_PUBLIC_STACK_PROJECT_ID: ${{ vars.NEXT_PUBLIC_STACK_PROJECT_ID }}
      NEXT_PUBLIC_STACK_PUBLISHABLE_CLIENT_KEY: ${{ vars.NEXT_PUBLIC_STACK_PUBLISHABLE_CLIENT_KEY }}
      STACK_SECRET_SERVER_KEY: ${{ secrets.STACK_SECRET_SERVER_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: refs/heads/main
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Cache Bun packages
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.bun/install/cache
          key: bun-cloud-vm-smoke-sweep-${{ hashFiles('web/bun.lock') }}
          restore-keys: bun-cloud-vm-smoke-sweep-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Sweep leftover smoke users and their VMs
        run: bun scripts/cloud-vm/smoke-vm-api.mjs production --sweep-older-than-minutes 30
