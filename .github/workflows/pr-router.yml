name: pr router

# One router per push (cmuxterm-hq RFD 0023, "one router per push"). Every feat-cmux-next pull request
# head used to start each pull request workflow on its own, and each began with a routing job of its
# own that often skipped everything after it: on 11-20 the routing jobs alone were 7.1% of pull request
# runner-minutes, about 13 a head. Here ONE small job lists the changed files once (a blobless two-commit
# checkout of the merge commit, every changed path) and scripts/ci/pr_router.py decides which workflows
# the change can reach (scripts/ci/pr_router.json). Each routed workflow is a `workflow_call` job below,
# gated on the router's `start` list: a workflow it does not start costs no runner and reports one
# skipped check under its own name; one it starts reports `<its name> / <job>` as before.
#
# pr-pipeline.yml is the step table's callee (ci/steps.toml, the CI v2 design): the router starts it when
# the change routes a step of one of its jobs, so a new check is a step there, not a callee here.
#
# Adding a workflow: move its pull_request trigger (types, paths) into pr_router.json, give it
# `workflow_call:`, add its caller job here, run `python3 scripts/ci/pr_router.py check`.
on:
  pull_request:
    branches: [feat-cmux-next]
    # labeled: only `ready-to-land` and an added `full-ci` route (the land tier, scripts/ci/head_tier.py); the route
    # job skips any other. full-ci is the land tier's handoff from a lane VM: the lane-gh broker never sets ready-to-land
    # (autoland's queue), but a lane may add full-ci, so land-judge asks for the full tier with it there.
    types: [opened, synchronize, reopened, edited, ready_for_review, labeled]

permissions: {}

# A push supersedes the older head's run and the workflows it called. An edit runs in a group of its own,
# so it never cancels a push's run.
concurrency:
  # Another label (or full-ci taken off) gets a group of its own too, so it never cancels the head's run.
  group: pr-router-${{ github.event.pull_request.number }}${{ github.event.action == 'edited' && format('-edit-{0}', github.run_id) || '' }}${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'feat-cmux-next' && (github.event.action == 'labeled' && !contains(fromJSON('["full-ci","ready-to-land"]'), github.event.label.name) || github.event.action == 'unlabeled') && format('-label-{0}', github.run_id) || '' }}
  cancel-in-progress: true

env:
  # Temporary REST budget attribution: one gh-call line per GitHub API call (scripts/ci/api_call_log/env.sh, fetched at a fixed commit when the checkout has no copy).
  BASH_ENV: '$({ w="${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh"; t="${RUNNER_TEMP:-/nonexistent}/api-call-log-src"; if [ -f "$w" ]; then echo "$w"; elif [ -n "${RUNNER_TEMP:-}" ]; then if [ ! -f "$t/env.sh" ] && [ ! -e "$t.tried" ] && { [ "${RUNNER_OS:-}" = Linux ] || [ "${RUNNER_OS:-}" = macOS ]; } && [ "$(date -u +%Y%m%d%H)" -lt 2026112300 ]; then : > "$t.tried"; mkdir -p "$t.part" && for x in env.sh gh sitecustomize.py isolated.py; do curl -fsSL --max-time 5 -o "$t.part/$x" "https://raw.githubusercontent.com/manaflow-ai/cmux/27647ffd3ae838c63be28ca3e5883dcd68c34518/scripts/ci/api_call_log/$x" || break; done; [ -s "$t.part/isolated.py" ] && mv "$t.part" "$t"; fi; if [ -f "$t/env.sh" ]; then echo "$t/env.sh"; else echo unset BASH_ENV > "$t.off.sh" && echo "$t.off.sh"; fi; fi; } 2>/dev/null)'

jobs:
  route:
    name: pr router
    # A title or description edit routes only when a callee reads what changed: the size budget's
    # `size:` line, the classic API guard's `Classic API change:` line or the base (its diff moved).
    # Every other edit skips here with no runner. Each callee's own job `if:` still skips the edits it
    # does not read, so an edit routed for one callee starts no runner in another.
    if: ${{ (github.event.action != 'edited' || github.event.changes.base || (github.event.changes.body && (contains(github.event.pull_request.body, 'size:') || contains(github.event.changes.body.from, 'size:') || contains(github.event.pull_request.body, 'Classic API change:') || contains(github.event.changes.body.from, 'Classic API change:')))) && !(github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'feat-cmux-next' && (github.event.action == 'labeled' && !contains(fromJSON('["full-ci","ready-to-land"]'), github.event.label.name) || github.event.action == 'unlabeled')) }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || 'cmux-linux' }}
    timeout-minutes: 5
    permissions:
      # head_tier.py reads the previous head's Actions runs (the green-head base merge rule).
      actions: read
      contents: read
      # The land tier's `cmux/land-tier` commit status (below).
      statuses: write
    outputs:
      start: ${{ steps.route.outputs.start }}
      # The step table's jobs the change routes (pr_router.py table_jobs_routed): pr-pipeline.yml starts only those.
      table: ${{ steps.route.outputs.table }}
    steps:
      - name: Checkout the router (the merge commit and the base tip)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 2
          # A same-repo pull request's runner reads the git mirror, which serves whole blobs in about 10 s; a blob
          # filter skips the mirror and the sparse checkout then fetches each blob from GitHub (57 to 81 s a head,
          # note-559). A fork, or any other event, keeps blob:none.
          filter: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && '' || 'blob:none' }}
          sparse-checkout: |
            scripts/ci/pr_router.py
            scripts/ci/pr_router.json
            scripts/ci/docs_only_paths.py
            scripts/ci/workflow_paths_cover_inputs.py
            scripts/ci/gh_expressions.py
            scripts/ci/head_tier.py
            scripts/ci/deadline_http.py
            scripts/ci/fast_track.py
            scripts/ci/risk_tier.py
            scripts/ci/ci_steps.py
            scripts/ci/check_reusable_workflow_permissions.py
            scripts/ci/deadline_http.py
            ci/steps.toml
            .gitmodules
          sparse-checkout-cone-mode: false
      - name: Route
        id: route
        # A draft head starts only callees marked `draft` (scripts/ci/head_tier.py); 0 turns that off.
        env:
          CI_DRAFT_CHEAP_TIER: ${{ vars.CI_DRAFT_CHEAP_TIER || '1' }}
          # 1: a ready-to-land head runs the full tier again; unset or 0: it runs the affected tier and the full tier
          # runs hourly on feat-cmux-next (head_tier.py hourly full tier rule, cmux-next-hourly-full-tier.yml).
          CI_LAND_FULL_PER_PR: ${{ vars.CI_LAND_FULL_PER_PR || '0' }}
          # A head that only merges the base into a PR idle 24 h starts nothing (head_tier.py); 0 turns that off.
          CI_IDLE_BASE_MERGE_SKIP: ${{ vars.CI_IDLE_BASE_MERGE_SKIP || '1' }}
          # Docs, plans, skills, copy or tests-only changes run the cheap tier (fast_track.py); 0 turns that off.
          CMUX_FAST_TRACK: ${{ vars.CMUX_FAST_TRACK || '1' }}
          # A ready head into feat-cmux-next runs the cheap tier until `ready-to-land` is added (head_tier.py's land
          # rule, cmuxterm-hq goals/ci-runner-min-per-day-50k.md); 0 turns that off.
          CI_LAND_TIER: ${{ vars.CI_LAND_TIER || '1' }}
          # A head that only merges the base onto a green previous head starts nothing (head_tier.py); 0 turns that off.
          CI_GREEN_BASE_MERGE_SKIP: ${{ vars.CI_GREEN_BASE_MERGE_SKIP || '1' }}
          # The browser suites (pr-pipeline.yml's web-browser job) run on a PR only with `full-ci`; base pushes run
          # them (pr_router.py FULL_CI_ONLY_JOBS); 0 turns that off.
          CI_PR_BROWSER_FULL_CI_ONLY: ${{ vars.CI_PR_BROWSER_FULL_CI_ONLY || '1' }}
          # A ready-to-land head that only merges the base onto a head whose full tier passed runs the cheap tier and
          # carries cmux/land-tier success (head_tier.py's land carry rule); 0 turns that off.
          CI_LAND_CARRY: ${{ vars.CI_LAND_CARRY || '1' }}
          # The previous head's Actions runs (actions: read), for that rule.
          GH_TOKEN: ${{ github.token }}
        run: python3 -I scripts/ci/pr_router.py route
      # The land tier's handoff: `pending` while this head runs the cheap tier (land-judge then adds `ready-to-land`
      # instead of landing it), `success` once it runs the full tier. Not a required check; a fork head gets none.
      # The post goes out on the cmux-bot App's token, as cmux-next.yml's same-tree statuses do, with the job's
      # GITHUB_TOKEN as the fallback: that token's REST budget is the repository's, and when it was spent the post
      # failed ("API rate limit exceeded for installation", run 45657671903, 2026-11-25 16:47Z) under
      # continue-on-error, so the run read green, cmux/land-tier stayed `pending` from the cheap tier at a head the
      # full tier had run on, and its land waited on it: 29 of 119 cmux lands waiting on running checks at 17:50Z.
      - name: Mint the land tier status token
        id: land-status-token
        if: ${{ steps.route.outputs.land_status != '' && github.event.pull_request.head.repo.full_name == github.repository && vars.CMUX_BOT_APP_ID != '' }}
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.CMUX_BOT_APP_ID }}
          private-key: ${{ secrets.CMUX_BOT_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-statuses: write
      - name: Post the land tier status
        if: ${{ steps.route.outputs.land_status != '' && github.event.pull_request.head.repo.full_name == github.repository }}
        timeout-minutes: 3
        continue-on-error: true
        env:
          APP_TOKEN: ${{ steps.land-status-token.outputs.token }}
          JOB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
          STATE: ${{ steps.route.outputs.land_status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          LAND_STATUS_RETRY_S: '20'
        run: |
          if [ "$STATE" = success ]; then
            desc="The land's tier runs on this head (full; affected, with the full tier hourly on feat-cmux-next; or passed on the head this base merge sits on)"
          else
            desc="Cheap tier: the full tier runs when ready-to-land or full-ci is added"
          fi
          # Each token in turn, three rounds: a spent budget or a 5xx on one is retried on the other, then again.
          for round in 1 2 3; do
            for token in "$APP_TOKEN" "$JOB_TOKEN"; do
              [ -n "$token" ] || continue
              if GH_TOKEN="$token" gh api "repos/$REPO/statuses/$SHA" -f state="$STATE" -f context=cmux/land-tier \
                  -f description="$desc" -f target_url="$RUN_URL" >/dev/null; then
                exit 0
              fi
            done
            [ "$round" = 3 ] || sleep "$((LAND_STATUS_RETRY_S * round))"
          done
          echo "::warning::cmux/land-tier ($STATE) was not posted at $SHA: its land waits on the last state posted there"
          exit 1

  machine-channel-pr-head:
    # PR_HEAD_FAST_LANE: the merge points the Cloud machine channel at this head's thin build. Started only on a
    # land's own heads (pr_router.json land_handoff_only), not on every full-tier push.
    name: machine channel PR head build
    needs: route
    # The land tier (tests/test_head_tier.py land_tier_condition): a ready head into feat-cmux-next builds the thin
    # machine channel only once it is handed to land (`ready-to-land` or `full-ci`), not on every push or base merge.
    # Leo, 2026-11-23: "de facto, im asking for 99% fewer minutes of ci time, period."
    if: ${{ contains(fromJSON(needs.route.outputs.start || '[]'), 'cmux-machine-channel.yml') && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci') || (github.event.pull_request.draft == true && (vars.CI_DRAFT_CHEAP_TIER || '1') == '0') || (github.event.pull_request.draft != true && (contains(github.event.pull_request.labels.*.name, 'ready-to-land') || github.event.pull_request.base.ref != 'feat-cmux-next' || github.event.pull_request.head.repo.full_name != github.repository || (vars.CI_LAND_TIER || '1') == '0'))) }}
    uses: ./.github/workflows/cmux-machine-channel.yml
    permissions:
      contents: read
      pull-requests: read
      actions: read
      # The reusable package workflow's permission ceiling (cmux-machine-channel.yml's build jobs).
      id-token: write
      attestations: write

  size-budget:
    name: cmux-next size budget
    needs: route
    if: ${{ contains(fromJSON(needs.route.outputs.start || '[]'), 'cmux-next-size-budget.yml') }}
    uses: ./.github/workflows/cmux-next-size-budget.yml
    permissions:
      contents: read

  screen-share-drop-gate:
    name: screen share drop gate
    needs: route
    if: ${{ contains(fromJSON(needs.route.outputs.start || '[]'), 'screen-share-drop-gate.yml') }}
    uses: ./.github/workflows/screen-share-drop-gate.yml
    permissions:
      contents: read

  classic-api-guard:
    name: classic API guard
    needs: route
    if: ${{ contains(fromJSON(needs.route.outputs.start || '[]'), 'classic-api-guard.yml') }}
    uses: ./.github/workflows/classic-api-guard.yml
    permissions:
      contents: read
      pull-requests: read

  swift-linux-packages:
    name: Swift packages on Linux
    needs: route
    if: ${{ contains(fromJSON(needs.route.outputs.start || '[]'), 'swift-linux-packages.yml') }}
    uses: ./.github/workflows/swift-linux-packages.yml
    # A called workflow may ask no more than its caller job grants; with none granted here, every run
    # ended startup_failure with 0 jobs (swift-linux-packages.yml asks contents: read).
    permissions:
      contents: read

  ios-link-ffi-linux:
    name: iOS link FFI on Linux
    needs: route
    if: ${{ contains(fromJSON(needs.route.outputs.start || '[]'), 'ios-link-ffi-linux.yml') }}
    uses: ./.github/workflows/ios-link-ffi-linux.yml
    permissions:
      contents: read

  fast-gates:
    # The cmux-next/fast-gates status (merge_hold, next-autoland). A head the router starts nothing for starts none of
    # its jobs; its jobs' own `if:`s keep their tier rules. The merger dispatches the workflow when a head has no status.
    name: cmux-next fast gates
    needs: route
    if: ${{ contains(fromJSON(needs.route.outputs.start || '[]'), 'cmux-next-fast-gates.yml') }}
    uses: ./.github/workflows/cmux-next-fast-gates.yml
    permissions:
      contents: read
      pull-requests: read
      # The receipt job reads the receipt run; fast-gates-fail-fast cancels this head's other heavy runs.
      actions: write
      # resolve's receipt and post write the cmux-next/fast-gates status.
      statuses: write

  pipeline:
    name: pr pipeline
    needs: route
    if: ${{ contains(fromJSON(needs.route.outputs.start || '[]'), 'pr-pipeline.yml') }}
    uses: ./.github/workflows/pr-pipeline.yml
    with:
      jobs: ${{ needs.route.outputs.table || '' }}
    secrets:
      GLAEDA_ROUTE_APP_KEY: ${{ secrets.GLAEDA_ROUTE_APP_KEY }}
    permissions:
      contents: read
      # The ios job's picker reads the queue and its runs (scripts/ci/ios_runner_pool.py).
      actions: read
      # ci/run's step-result store on the controller's public route (pr-pipeline.yml); GitHub mints none for a fork.
      id-token: write

  # Head fail-fast: this head failed red of its own, so its other heavy runs are cancelled (scripts/ci/head_fail_fast.py).
  # Why: docs/ci/cmux-next-workflow-notes.md#note-head-fail-fast
  pipeline-fail-fast:
    name: head fail-fast after pr pipeline
    needs: pipeline
    if: ${{ failure() && needs.pipeline.result == 'failure' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && !contains(github.event.pull_request.labels.*.name, 'full-ci') && format('{0}', vars.CI_HEAD_FAIL_FAST) != '0' }}
    uses: ./.github/workflows/head-fail-fast.yml
    with:
      workflow: pr-router.yml
    permissions:
      actions: write
      contents: read
