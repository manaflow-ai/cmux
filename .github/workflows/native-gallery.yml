name: native gallery capture

on:
  pull_request:
    branches: [feat-cmux-next]
    paths:
      - "Packages/macOS/CmuxNext/Sources/CmuxNextSidebar/**"
      - "Packages/macOS/CmuxNext/Tests/CmuxNextAppTests/NativeSidebarGalleryTests.swift"
      - "Packages/macOS/CmuxNext/Tests/Fixtures/SidebarGallery/**"
      - "webviews/src/sidebar/SidebarNativeGallery.gallery.ts"
      - "scripts/ci/native-sidebar-gallery.sh"
      - ".github/workflows/native-gallery.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    if: ${{ vars.CI_EVAL_STEP_GATEWAY != '' && (github.event_name == 'workflow_dispatch' || (!github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository)) }}
    # The gateway only carries a thin cmux-ci client; the controller checks out
    # the requested ref on its GUI worker.
    runs-on: ${{ vars.CI_EVAL_STEP_GATEWAY }}
    timeout-minutes: 45
    steps:
      - name: Capture on a GUI fleet worker
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          client="${CMUX_CI_CLIENT:-$HOME/.local/bin/cmux-ci}"
          if ! [[ -x "$client" ]]; then
            echo "::error title=Build fleet client missing::$client is not installed on runner $RUNNER_NAME; the capture did not run."
            exit 127
          fi
          "$client" run --class light --display --script scripts/ci/package-test-lane.sh \
            --ref "$HEAD_SHA" --timeout 2400 --artifact artifacts/native-sidebar-gallery.tar \
            --arg suite --arg Packages/macOS/CmuxNext --arg CmuxNextAppTests/NativeSidebarGalleryTests
          test -f artifacts/native-sidebar-gallery.tar
      - name: Upload native gallery artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-sidebar-gallery-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/native-sidebar-gallery.tar
          if-no-files-found: warn
