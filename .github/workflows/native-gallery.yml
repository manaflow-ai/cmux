name: native gallery capture

on:
  pull_request:
    branches: [feat-cmux-next]
    paths:
      - "Packages/macOS/CmuxNext/Sources/CmuxNextSidebar/**"
      - "Packages/macOS/CmuxNext/Tests/CmuxNextAppTests/NativeSidebarGalleryTests.swift"
      - "Packages/macOS/CmuxNext/Tests/Fixtures/SidebarGallery/**"
      - "webviews/src/sidebar/SidebarNativeGallery.gallery.ts"
      - "scripts/ci/native-sidebar-gallery.sh"
      - ".github/workflows/native-gallery.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    if: ${{ github.event_name == 'workflow_dispatch' || (!github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Capture on a GUI fleet worker
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          job=$(cmux-ci run --class light --display --script scripts/ci/native-sidebar-gallery.sh \
            --ref "$HEAD_SHA" --artifact artifacts/native-sidebar-gallery.tar)
          cmux-ci wait "$job" --timeout 40m
          test -f artifacts/native-sidebar-gallery.tar
      - name: Upload native gallery artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-sidebar-gallery-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/native-sidebar-gallery.tar
          if-no-files-found: warn
