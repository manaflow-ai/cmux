name: Cloud task-local lifecycle

on:
  pull_request:
    paths:
      - Packages/macOS/CmuxCloud/Sources/CmuxCloud/Operations/CloudOperation*.swift
      - Packages/macOS/CmuxCloud/Sources/CmuxCloud/Telemetry/CloudTelemetry*.swift
      - Packages/macOS/CmuxCloud/Sources/CmuxCloud/Operations/CloudRemoteOperationStep.swift
      - scripts/select-ci-xcode.sh
      - scripts/ci/xcode-pins.txt
      - .xcode-version
      - Packages/macOS/CmuxFoundation/Sources/CmuxFoundation/Concurrency/TaskLocalReference.swift
      - Packages/macOS/CmuxCloud/Sources/CmuxCloud/Reads/CloudReadRequestCoordinator.swift
      - Sources/Surfaces/CloudMachineLoadingReservation.swift
      - tests/cloud_task_local/**
      - tests/surface_task_local/**
      - tests/test_cloud_task_local_lifecycle.py
      - tests/test_surface_task_local_reservations.py
      - .github/workflows/cloud-task-local-tests.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloud-task-local-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Temporary REST budget attribution: one gh-call line per GitHub API call (scripts/ci/api_call_log/env.sh, fetched at a fixed commit when the checkout has no copy).
  BASH_ENV: '$({ w="${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh"; t="${RUNNER_TEMP:-/nonexistent}/api-call-log-src"; if [ -f "$w" ]; then echo "$w"; elif [ -n "${RUNNER_TEMP:-}" ]; then if [ ! -f "$t/env.sh" ] && [ ! -e "$t.tried" ] && { [ "${RUNNER_OS:-}" = Linux ] || [ "${RUNNER_OS:-}" = macOS ]; } && [ "$(date -u +%Y%m%d%H)" -lt 2026112300 ]; then : > "$t.tried"; mkdir -p "$t.part" && for x in env.sh gh sitecustomize.py isolated.py; do curl -fsSL --max-time 5 -o "$t.part/$x" "https://raw.githubusercontent.com/manaflow-ai/cmux/27647ffd3ae838c63be28ca3e5883dcd68c34518/scripts/ci/api_call_log/$x" || break; done; [ -s "$t.part/isolated.py" ] && mv "$t.part" "$t"; fi; if [ -f "$t/env.sh" ]; then echo "$t/env.sh"; else echo unset BASH_ENV > "$t.off.sh" && echo "$t.off.sh"; fi; fi; } 2>/dev/null)'

jobs:
  lifecycle:
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-6vcpu-macos-26' || vars.CI_OVERFLOW_MAC || 'cmux-mac' }}
    timeout-minutes: 5
    env:
      CMUX_CI_XCODE_APP: ${{ vars.CMUX_CI_XCODE_APP_MACOS_26 }}
      CMUX_CI_REQUIRED_MACOS_SDK_MAJOR: "26"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Select Xcode
        run: ./scripts/select-ci-xcode.sh
      - name: Test optimized Cloud task-local lifecycle
        run: python3 tests/test_cloud_task_local_lifecycle.py
      - name: Test optimized surface task-local reservations
        run: python3 tests/test_surface_task_local_reservations.py
