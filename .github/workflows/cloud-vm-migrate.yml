name: Cloud VM DB migration

on:
  workflow_dispatch:
    inputs:
      target:
        description: Migration target
        required: true
        default: staging
        type: choice
        options: [staging, production]
      cleanup_iroh_challenges:
        description: Prune expired, consumed, and duplicate Iroh registration challenges after migration
        required: false
        default: false
        type: boolean

  workflow_call:
    inputs:
      target:
        description: Migration target (staging or production)
        required: true
        type: string
      ref:
        description: >-
          Reviewed main-history commit for production (ancestor checked by the
          caller). Defaults to main. Staging uses the calling event's sha.
        required: false
        default: ""
        type: string
      cleanup_iroh_challenges:
        description: Prune expired, consumed, and duplicate Iroh registration challenges after migration
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  # Production also migrates staging. One group prevents two runs from
  # applying to the same database at once.
  group: cloud-vm-migrate
  cancel-in-progress: false

jobs:
  preflight:
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.target == 'production' && (inputs.ref || 'refs/heads/main') || github.sha }}
      - name: Pin migration source
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Cloud VM migration preflight
        run: bun run cloud-vm:preflight -- --schema-only .
      - name: Rehearse Iroh cleanup on isolated Postgres
        if: ${{ inputs.cleanup_iroh_challenges }}
        run: bun run cloud-vm:preflight -- .

  migrate-staging:
    if: ${{ inputs.target == 'staging' || inputs.target == 'production' }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    needs: preflight
    environment: cloud-vm-staging
    defaults:
      run:
        working-directory: web
    env:
      CMUX_CLOUD_VM_ENV_SOURCE: process
      CMUX_DB_DRIVER: url
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Validate PlanetScale credentials
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::Missing cloud-vm-staging secret DATABASE_URL"
            exit 1
          fi
          case "$DATABASE_URL" in
            postgres://*|postgresql://*) ;;
            *) echo "::error::DATABASE_URL must use the PostgreSQL URL scheme"; exit 1 ;;
          esac
      - name: Verify staging PlanetScale connection (read only)
        run: bun run cloud-vm:migrate -- staging --check
      - name: Apply staging migration
        run: bun run cloud-vm:migrate -- staging
      - name: Clean up staging Iroh challenges
        if: ${{ inputs.cleanup_iroh_challenges }}
        run: bun run cloud-vm:cleanup-iroh -- staging --apply

  migrate-production:
    if: ${{ inputs.target == 'production' }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    needs: [preflight, migrate-staging]
    environment: cloud-vm-production
    defaults:
      run:
        working-directory: web
    env:
      CMUX_CLOUD_VM_ENV_SOURCE: process
      CMUX_DB_DRIVER: url
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Validate PlanetScale credentials
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::Missing cloud-vm-production secret DATABASE_URL"
            exit 1
          fi
          case "$DATABASE_URL" in
            postgres://*|postgresql://*) ;;
            *) echo "::error::DATABASE_URL must use the PostgreSQL URL scheme"; exit 1 ;;
          esac
      - name: Verify production PlanetScale connection (read only)
        run: bun run cloud-vm:migrate -- production --check
      - name: Apply production migration
        run: bun run cloud-vm:migrate -- production
      - name: Clean up production Iroh challenges
        if: ${{ inputs.cleanup_iroh_challenges }}
        run: bun run cloud-vm:cleanup-iroh -- production --apply
