name: Cloud VM DB migration

# Runs on demand (workflow_dispatch) and on every push to main that adds or
# changes a migration. Vercel deploys main on each push, so a migration that
# waited for a manual dispatch left production serving code against a schema
# without the tables it needs (2026-09-21: every Cloud create answered 503
# `vm_cloud_state_unavailable` because `cloud_runtimes` had never been created,
# and device-token reads failed on missing columns for days). A push applies
# staging first; the production job then waits for the cloud-vm-production
# environment's required reviewers, so production still gets a human approval.
on:
  workflow_dispatch:
    inputs:
      target:
        description: Migration target
        required: true
        default: staging
        type: choice
        options: [staging, production]
      cleanup_iroh_challenges:
        description: Prune expired, consumed, and duplicate Iroh registration challenges after migration
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - web/db/migrations/**

permissions:
  contents: read

concurrency:
  # Production also migrates staging. One group prevents two runs from
  # applying to the same database at once.
  group: cloud-vm-migrate
  cancel-in-progress: false

jobs:
  preflight:
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    runs-on: ${{ vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'push' && github.sha || (inputs.target == 'production' && 'refs/heads/main' || github.sha) }}
      - name: Pin migration source
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Cloud VM migration preflight
        run: bun run cloud-vm:preflight -- --schema-only .
      - name: Rehearse Iroh cleanup on isolated Postgres
        if: ${{ inputs.cleanup_iroh_challenges }}
        run: bun run cloud-vm:preflight -- .

  migrate-staging:
    if: ${{ github.event_name == 'push' || inputs.target == 'staging' || inputs.target == 'production' }}
    runs-on: ${{ vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    needs: preflight
    environment: cloud-vm-staging
    defaults:
      run:
        working-directory: web
    env:
      CMUX_CLOUD_VM_ENV_SOURCE: process
      CMUX_DB_DRIVER: url
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Validate PlanetScale credentials
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::Missing cloud-vm-staging secret DATABASE_URL"
            exit 1
          fi
          case "$DATABASE_URL" in
            postgres://*|postgresql://*) ;;
            *) echo "::error::DATABASE_URL must use the PostgreSQL URL scheme"; exit 1 ;;
          esac
      - name: Verify staging PlanetScale connection (read only)
        run: bun run cloud-vm:migrate -- staging --check
      - name: Apply staging migration
        run: bun run cloud-vm:migrate -- staging
      - name: Clean up staging Iroh challenges
        if: ${{ inputs.cleanup_iroh_challenges }}
        run: bun run cloud-vm:cleanup-iroh -- staging --apply

  migrate-production:
    if: ${{ github.event_name == 'push' || inputs.target == 'production' }}
    runs-on: ${{ vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    needs: [preflight, migrate-staging]
    environment: cloud-vm-production
    defaults:
      run:
        working-directory: web
    env:
      CMUX_CLOUD_VM_ENV_SOURCE: process
      CMUX_DB_DRIVER: url
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Validate PlanetScale credentials
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::Missing cloud-vm-production secret DATABASE_URL"
            exit 1
          fi
          case "$DATABASE_URL" in
            postgres://*|postgresql://*) ;;
            *) echo "::error::DATABASE_URL must use the PostgreSQL URL scheme"; exit 1 ;;
          esac
      - name: Verify production PlanetScale connection (read only)
        run: bun run cloud-vm:migrate -- production --check
      - name: Apply production migration
        run: bun run cloud-vm:migrate -- production
      - name: Clean up production Iroh challenges
        if: ${{ inputs.cleanup_iroh_challenges }}
        run: bun run cloud-vm:cleanup-iroh -- production --apply
