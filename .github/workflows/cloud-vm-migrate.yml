name: Cloud VM DB migration

on:
  workflow_dispatch:
    inputs:
      target:
        description: Migration target
        required: true
        default: staging
        type: choice
        options: [staging, production]
      cleanup_iroh_challenges:
        description: Prune expired, consumed, and duplicate Iroh registration challenges after migration
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  # Production also migrates staging. One group prevents two runs from
  # applying to the same database at once.
  group: cloud-vm-migrate
  cancel-in-progress: false

jobs:
  preflight:
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.LINUX_RUNNER || fromJSON(vars.RUNNER_POOLS).linux_4 }}
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.target == 'production' && 'refs/heads/main' || github.sha }}
      # Bun waits on a registry connection that stops answering with no limit of its own; scripts/ci/bun-install.sh
      # bounds it. This job's checkout may predate the script, so it comes from this workflow's own commit.
      - name: Check out the bounded bun install
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          path: .bun-install-tools
          persist-credentials: false
          sparse-checkout: scripts/ci/bun-install.sh
          sparse-checkout-cone-mode: false
      - name: Keep the bounded bun install outside the checkout
        working-directory: .
        run: mv .bun-install-tools/scripts/ci/bun-install.sh "$RUNNER_TEMP/bun-install.sh" && rm -rf .bun-install-tools
      - name: Pin migration source
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
      - name: Install dependencies
        run: bash "$RUNNER_TEMP/bun-install.sh" --frozen-lockfile
      - name: Cloud VM migration preflight
        run: bun run cloud-vm:preflight -- --schema-only .
      - name: Rehearse Iroh cleanup on isolated Postgres
        if: ${{ inputs.cleanup_iroh_challenges }}
        run: bun run cloud-vm:preflight -- .

  migrate-staging:
    if: ${{ inputs.target == 'staging' || inputs.target == 'production' }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.LINUX_RUNNER || fromJSON(vars.RUNNER_POOLS).linux_4 }}
    needs: preflight
    environment: cloud-vm-staging
    defaults:
      run:
        working-directory: web
    env:
      CMUX_CLOUD_VM_ENV_SOURCE: process
      CMUX_DB_DRIVER: url
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
      # Bun waits on a registry connection that stops answering with no limit of its own; scripts/ci/bun-install.sh
      # bounds it. This job's checkout may predate the script, so it comes from this workflow's own commit.
      - name: Check out the bounded bun install
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          path: .bun-install-tools
          persist-credentials: false
          sparse-checkout: scripts/ci/bun-install.sh
          sparse-checkout-cone-mode: false
      - name: Keep the bounded bun install outside the checkout
        working-directory: .
        run: mv .bun-install-tools/scripts/ci/bun-install.sh "$RUNNER_TEMP/bun-install.sh" && rm -rf .bun-install-tools
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
      - name: Install dependencies
        run: bash "$RUNNER_TEMP/bun-install.sh" --frozen-lockfile
      - name: Validate PlanetScale credentials
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::Missing cloud-vm-staging secret DATABASE_URL"
            exit 1
          fi
          case "$DATABASE_URL" in
            postgres://*|postgresql://*) ;;
            *) echo "::error::DATABASE_URL must use the PostgreSQL URL scheme"; exit 1 ;;
          esac
      - name: Verify staging PlanetScale connection (read only)
        run: bun run cloud-vm:migrate -- staging --check
      - name: Apply staging migration
        run: bun run cloud-vm:migrate -- staging
      - name: Run durable runtime promotion suite
        env:
          CMUX_DB_TEST: "1"
          CMUX_CLOUD_VM_ENV_SOURCE: process
          CMUX_DB_DRIVER: url
          DIRECT_DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: bun run test:runtime-promotion:db
      - name: Clean up staging Iroh challenges
        if: ${{ inputs.cleanup_iroh_challenges }}
        run: bun run cloud-vm:cleanup-iroh -- staging --apply

  migrate-production:
    if: ${{ inputs.target == 'production' }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.LINUX_RUNNER || fromJSON(vars.RUNNER_POOLS).linux_4 }}
    needs: [preflight, migrate-staging]
    environment: cloud-vm-production
    defaults:
      run:
        working-directory: web
    env:
      CMUX_CLOUD_VM_ENV_SOURCE: process
      CMUX_DB_DRIVER: url
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
      # Bun waits on a registry connection that stops answering with no limit of its own; scripts/ci/bun-install.sh
      # bounds it. This job's checkout may predate the script, so it comes from this workflow's own commit.
      - name: Check out the bounded bun install
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          path: .bun-install-tools
          persist-credentials: false
          sparse-checkout: scripts/ci/bun-install.sh
          sparse-checkout-cone-mode: false
      - name: Keep the bounded bun install outside the checkout
        working-directory: .
        run: mv .bun-install-tools/scripts/ci/bun-install.sh "$RUNNER_TEMP/bun-install.sh" && rm -rf .bun-install-tools
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
      - name: Install dependencies
        run: bash "$RUNNER_TEMP/bun-install.sh" --frozen-lockfile
      - name: Validate PlanetScale credentials
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::Missing cloud-vm-production secret DATABASE_URL"
            exit 1
          fi
          case "$DATABASE_URL" in
            postgres://*|postgresql://*) ;;
            *) echo "::error::DATABASE_URL must use the PostgreSQL URL scheme"; exit 1 ;;
          esac
      - name: Verify production PlanetScale connection (read only)
        run: bun run cloud-vm:migrate -- production --check
      - name: Apply production migration
        run: bun run cloud-vm:migrate -- production
      - name: Clean up production Iroh challenges
        if: ${{ inputs.cleanup_iroh_challenges }}
        run: bun run cloud-vm:cleanup-iroh -- production --apply
