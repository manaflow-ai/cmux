name: cmux-next fast-tier seed

# Seeds the R2 cache the cmux-next fast tier restores when it lands on
# Blacksmith (cmux-next.yml fast-tier). Owned minis keep their builds on their
# own SSD and never read it.
#
# NEXT has its own bucket, cmux-ci-cache-next, and its own writer environment,
# next-cache-writer, whose deployment branches are feat-cmux-next only: NEXT
# code never holds main's cache-writer credentials or writes main's
# cmux-ci-cache bucket (tests/test_ci_pull_request_caches_are_read_only.py).
# Pull requests read the bucket's public URL and hold no credential.
#
# A seed is one cold build of exactly what the Mac fast tier builds (its Swift
# entries; the cargo entries run on Linux with their own cargo cache), on the
# Blacksmith pool the fast tier overflows to, plus the input-time manifest the fast tier replays
# (scripts/ci/e2e_warm_derived_data.py) so a pull request rebuilds only the
# files that differ from the seed. It runs when the newest seed is older than
# SEED_INTERVAL_MINUTES (scripts/cmux-next/fast-tier-seed-due.py), and prunes
# seeds older than a day that no pointer names (scripts/ci/r2_cache_prune.py).
on:
  push:
    branches: [feat-cmux-next]

permissions: {}

# No workflow-wide concurrency group: each pool's seed has its own lane (the seed
# job's concurrency). One group for the workflow let seed run 39396578253, queued on
# a stalled blacksmith-12vcpu-macos-26 from 08:53 on 2026-10-20, hold every later
# push's seed pending until the next push cancelled it: 299 cancelled seeds, none
# landed, and every pull request's fast tier built CmuxNext cold (20 to 28 minutes).

env:
  SEED_INTERVAL_MINUTES: "30"
  CI_CACHE_R2_BUCKET: cmux-ci-cache-next
  CI_CACHE_R2_PUBLIC_URL: https://ci-cache-next.cmux.com

jobs:
  due:
    if: ${{ github.repository == 'manaflow-ai/cmux' && github.ref == 'refs/heads/feat-cmux-next' }}
    name: Is a fast-tier seed due
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.CI_CLOUD_OVERFLOW_SAVED && 'blacksmith-8vcpu-ubuntu-2404' || 'blacksmith-2vcpu-ubuntu-2404' }}
    timeout-minutes: 5
    environment: ${{ github.ref == 'refs/heads/feat-cmux-next' && 'next-cache-writer' || '' }}
    permissions:
      contents: read
    env:
      # The pool the cmux-next fast tier restores a seed on (scripts/ci/next_macos_cascade.py):
      # Blacksmith. The owned minis keep their builds on their own SSD and read no seed.
      # The cache key holds the workspace path (fast-tier-cache-key.sh), so a seed is
      # per pool. 6 vCPU, not 12: same image, Xcode pin and workspace path, and the
      # cascade fills 12 vCPU first (a seed queued there held the old workflow group 85+
      # minutes, run 39351410275).
      # No GitHub-hosted pool: the cascade no longer overflows to hosted macos-26, so
      # nothing restores a hosted seed (Leo, 2026-10-27: "THE GITHUB HOSTED MACS / ARE
      # THE SLOWEST THINGS"; tests/test_ci_no_github_hosted_macos.py). That pool's seeds
      # were 21 hosted jobs and 891 hosted minutes a day (2026-10-27).
      SEED_POOLS: >-
        [{"pool": "blacksmith", "runner": "blacksmith-6vcpu-macos-26", "workspace": "/Users/runner/_work/cmux/cmux", "timeout": 30}]
    outputs:
      pools: ${{ steps.due.outputs.pools }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/cmux-next/fast-tier-seed-due.py
            scripts/ci/r2_cache_census.py
          sparse-checkout-cone-mode: false

      - name: Check each pool's newest seed's age
        id: due
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CI_CACHE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CI_CACHE_R2_SECRET_ACCESS_KEY }}
          CI_CACHE_R2_ENDPOINT: ${{ format('https://{0}.r2.cloudflarestorage.com', secrets.CI_CACHE_R2_ACCOUNT_ID) }}
        run: |
          set -euo pipefail
          python3 -I scripts/cmux-next/fast-tier-seed-due.py --minutes "$SEED_INTERVAL_MINUTES" \
            --endpoint-url "$CI_CACHE_R2_ENDPOINT" --bucket "$CI_CACHE_R2_BUCKET" \
            --pools "$SEED_POOLS" | tee -a "$GITHUB_OUTPUT"

  seed:
    needs: due
    if: ${{ github.repository == 'manaflow-ai/cmux' && github.ref == 'refs/heads/feat-cmux-next' && needs.due.outputs.pools != '' && needs.due.outputs.pools != '[]' }}
    name: Seed the fast-tier build cache (${{ matrix.pool }})
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.due.outputs.pools) }}
    # One seed at a time per pool. A running seed finishes; a newer push replaces
    # only the pending one. A stalled pool holds only its own lane.
    concurrency:
      group: cmux-next-fast-tier-seed-${{ github.ref }}-${{ matrix.pool }}
      cancel-in-progress: false
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    environment: ${{ github.ref == 'refs/heads/feat-cmux-next' && 'next-cache-writer' || '' }}
    permissions:
      contents: read
    steps:
      # This job's tests can start acpmux daemons: they get a home of the job's
      # own, never the runner's ~/.acpmux, the mini's own daemon
      # (tests/test_ci_acpmux_job_home.py).
      - name: Give this job its own acpmux home
        run: |
          home="$RUNNER_TEMP/acpmux-home"
          rm -rf "$home" && mkdir -m 700 "$home"
          echo "ACPMUX_HOME=$RUNNER_TEMP/acpmux-home" >> "$GITHUB_ENV"
          # An inherited socket would still name another home's daemon; empty is unset.
          echo "ACPMUX_SOCKET=" >> "$GITHUB_ENV"

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: false
          fetch-depth: 2

      - name: Select Xcode
        run: ./scripts/select-ci-xcode.sh

      # The due job judged this pool by its workspace path's seeds; a runner that
      # checks out elsewhere would write a key no fast tier on the pool restores.
      - name: Check the workspace is the pool's
        env:
          POOL_WORKSPACE: ${{ matrix.workspace }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_WORKSPACE" != "$POOL_WORKSPACE" ]]; then
            echo "::error title=fast-tier seed::workspace $GITHUB_WORKSPACE is not the pool's $POOL_WORKSPACE (SEED_POOLS)"
            exit 1
          fi

      - name: Compute fast-tier cache keys
        id: fast-cache-key
        run: scripts/cmux-next/fast-tier-cache-key.sh >> "$GITHUB_OUTPUT"

      # Before the build: the times the products are built from. The fast tier
      # replays them onto every file whose content is unchanged.
      - name: Record the build's input times
        run: |
          set -euo pipefail
          mkdir -p Packages/macOS/CmuxNext/.build
          python3 -I scripts/ci/e2e_warm_derived_data.py record "$GITHUB_WORKSPACE" "$RUNNER_TEMP/cmux-fast-tier-input-mtimes.json"
          mv "$RUNNER_TEMP/cmux-fast-tier-input-mtimes.json" Packages/macOS/CmuxNext/.build/cmux-fast-tier-input-mtimes.json

      # The seed is the build. A red test entry still leaves a good build, so
      # only the builds decide whether it saves.
      - name: Run the fast tier
        id: tier
        continue-on-error: true
        run: python3 -I scripts/cmux-next/fast-tier.py --kind swift --receipt "$RUNNER_TEMP/cmux-next-fast-tier.json"

      # Also after a failure or a cancel: end the daemon of this job's home and
      # its agents (shutdown never starts one), then delete the home.
      - name: Stop this job's acpmux daemons and remove its home
        if: ${{ always() }}
        continue-on-error: true
        timeout-minutes: 3
        run: |
          home="$RUNNER_TEMP/acpmux-home"
          [[ -d "$home" ]] || exit 0
          acpmux="$(PATH="$PATH:$HOME/.local/bin:$HOME/.cargo/bin:/opt/homebrew/bin:/usr/local/bin" command -v acpmux || true)"
          [[ -z "$acpmux" ]] || env -u ACPMUX_SOCKET ACPMUX_HOME="$home" "$acpmux" daemon shutdown --end-agents || true
          rm -rf "$home"

      - name: Check that every build passed
        id: built
        run: |
          set -euo pipefail
          python3 -I - "$RUNNER_TEMP/cmux-next-fast-tier.json" <<'EOF'
          import json, sys
          builds = json.load(open(sys.argv[1]))["builds"]
          for build in builds:
              print(f"{build['status']:5} {build['seconds']:8.1f}s {build['command']}")
          sys.exit(0 if builds and all(b["status"] == "pass" for b in builds) else 1)
          EOF
          du -sh Packages/macOS/CmuxNext/.build Packages/Shared/CmuxHomeRender/.build | tee -a "$GITHUB_STEP_SUMMARY"

      # The swift archive goes last: its pointer is what a fast tier restores
      # by prefix, and by then the home archive of this commit exists.
      - name: Save the CmuxHomeRender build
        if: ${{ steps.built.outcome == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/feat-cmux-next' }}
        uses: ./.github/actions/cache-save
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CI_CACHE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CI_CACHE_R2_SECRET_ACCESS_KEY }}
          CI_CACHE_R2_ENDPOINT: ${{ format('https://{0}.r2.cloudflarestorage.com', secrets.CI_CACHE_R2_ACCOUNT_ID) }}
        with:
          backend: r2
          path: Packages/Shared/CmuxHomeRender/.build
          key: ${{ steps.fast-cache-key.outputs.home-key }}

      - name: Save the CmuxNext build
        if: ${{ steps.built.outcome == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/feat-cmux-next' }}
        uses: ./.github/actions/cache-save
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CI_CACHE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CI_CACHE_R2_SECRET_ACCESS_KEY }}
          CI_CACHE_R2_ENDPOINT: ${{ format('https://{0}.r2.cloudflarestorage.com', secrets.CI_CACHE_R2_ACCOUNT_ID) }}
        with:
          backend: r2
          path: Packages/macOS/CmuxNext/.build
          key: ${{ steps.fast-cache-key.outputs.swift-key }}

      - name: Prune seeds older than a day
        if: ${{ success() }}
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CI_CACHE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CI_CACHE_R2_SECRET_ACCESS_KEY }}
          CI_CACHE_R2_ENDPOINT: ${{ format('https://{0}.r2.cloudflarestorage.com', secrets.CI_CACHE_R2_ACCOUNT_ID) }}
        run: python3 -I scripts/ci/r2_cache_prune.py --endpoint-url "$CI_CACHE_R2_ENDPOINT" --bucket "$CI_CACHE_R2_BUCKET" --delete

      - name: Upload the seed's timing receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-next-fast-tier-seed-receipt-${{ matrix.pool }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          retention-days: 3
          path: ${{ runner.temp }}/cmux-next-fast-tier.json
          if-no-files-found: ignore
