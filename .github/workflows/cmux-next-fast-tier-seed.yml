name: cmux-next fast-tier seed

# Seeds the GitHub Actions cache entry the cmux-next fast tier restores when it
# lands on Blacksmith (cmux-next.yml fast-tier). Only feat-cmux-next pushes
# save, so every feat-cmux-next pull request can read the entry (a pull request
# reads its base branch's entries) and none can write one. No secret or
# environment: GitHub's own cache scoping is the trust boundary. Owned minis
# keep their builds on their own SSD and never read this entry.
#
# The entry is one cold build of exactly what the fast tier builds, on the pool
# the fast tier overflows to, plus the input-time manifest the fast tier
# replays (scripts/ci/e2e_warm_derived_data.py) so a pull request rebuilds only
# the files that differ from the seed. A seed runs when the newest one is older
# than SEED_INTERVAL_MINUTES (scripts/cmux-next/fast-tier-seed-due.py), and
# drops all but the two newest after it saves.
on:
  push:
    branches: [feat-cmux-next, ci/next-fast-tier-seed-probe]

permissions: {}

# One seed at a time. A running seed finishes; a newer push replaces only the
# pending one.
concurrency:
  group: cmux-next-fast-tier-seed-${{ github.ref }}
  cancel-in-progress: false

env:
  SEED_INTERVAL_MINUTES: "0"
  SEED_KEY_PREFIX: cmux-next-fast-v2-

jobs:
  due:
    if: ${{ github.repository == 'manaflow-ai/cmux' }}
    name: Is a fast-tier seed due
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      due: ${{ steps.due.outputs.due }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          sparse-checkout: scripts/cmux-next/fast-tier-seed-due.py
          sparse-checkout-cone-mode: false

      - name: Check the newest seed's age
        id: due
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/caches?ref=$GITHUB_REF&key=$SEED_KEY_PREFIX&sort=created_at&direction=desc&per_page=100" \
            | python3 -I scripts/cmux-next/fast-tier-seed-due.py due --minutes "$SEED_INTERVAL_MINUTES" \
            | tee -a "$GITHUB_OUTPUT"

  seed:
    needs: due
    if: ${{ github.repository == 'manaflow-ai/cmux' && needs.due.outputs.due == 'true' }}
    name: Seed the fast-tier build cache
    runs-on: blacksmith-12vcpu-macos-26
    timeout-minutes: 30
    permissions:
      actions: write
      contents: read
    # As in the fast tier (cmux-next.yml): cmux-tui-core builds libghostty-vt from ghostty-next.
    env:
      GHOSTTY_ZIG_SOURCE: ghostty-next
      CMUX_GHOSTTY_SRC: ""
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: false
          fetch-depth: 2

      - name: Select Xcode
        run: ./scripts/select-ci-xcode.sh

      - name: Set up pinned cmux-tui Rust
        uses: ./.github/actions/setup-cmux-tui-rust

      - name: Init the ghostty-next submodule (libghostty-vt for cmux-tui-core)
        run: bash scripts/ci/init-submodule.sh ghostty-next

      - name: Install zig
        run: ./scripts/install-zig-ci.sh

      - name: Compute fast-tier cache key
        id: fast-cache-key
        run: scripts/cmux-next/fast-tier-cache-key.sh >> "$GITHUB_OUTPUT"

      # PROBE ONLY (never merged): the fast tier's warm path, to measure it.
      - name: Restore fast-tier build cache
        id: fast-cache-restore
        continue-on-error: true
        uses: ./.github/actions/cache-restore
        with:
          backend: github
          path: |
            Packages/macOS/CmuxNext/.build
            Packages/Shared/CmuxHomeRender/.build
            cmux-tui/target
          key: ${{ steps.fast-cache-key.outputs.key }}
          restore-keys: ${{ steps.fast-cache-key.outputs.prefix }}

      - name: Replay the seed's input times
        if: ${{ steps.fast-cache-restore.outputs.cache-matched-key != '' }}
        continue-on-error: true
        run: time python3 -I scripts/ci/e2e_warm_derived_data.py replay "$GITHUB_WORKSPACE" Packages/macOS/CmuxNext/.build/cmux-fast-tier-input-mtimes.json

      # Before the build: the times the products are built from. The fast tier
      # replays them onto every file whose content is unchanged.
      - name: Record the build's input times
        run: |
          set -euo pipefail
          mkdir -p Packages/macOS/CmuxNext/.build
          python3 -I scripts/ci/e2e_warm_derived_data.py record "$GITHUB_WORKSPACE" "$RUNNER_TEMP/cmux-fast-tier-input-mtimes.json"
          mv "$RUNNER_TEMP/cmux-fast-tier-input-mtimes.json" Packages/macOS/CmuxNext/.build/cmux-fast-tier-input-mtimes.json

      # The seed is the build. A red test entry still leaves a good build, so
      # only the builds decide whether it saves.
      - name: Run the fast tier
        id: tier
        continue-on-error: true
        run: python3 -I scripts/cmux-next/fast-tier.py --receipt "$RUNNER_TEMP/cmux-next-fast-tier.json"

      - name: Check that every build passed
        id: built
        run: |
          set -euo pipefail
          python3 -I - "$RUNNER_TEMP/cmux-next-fast-tier.json" <<'EOF'
          import json, sys
          builds = json.load(open(sys.argv[1]))["builds"]
          for build in builds:
              print(f"{build['status']:5} {build['seconds']:8.1f}s {build['command']}")
          sys.exit(0 if builds and all(b["status"] == "pass" for b in builds) else 1)
          EOF
          du -sh Packages/macOS/CmuxNext/.build Packages/Shared/CmuxHomeRender/.build cmux-tui/target | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Save the fast-tier build cache
        if: ${{ steps.built.outcome == 'success' && github.event_name == 'push' && (github.ref == 'refs/heads/feat-cmux-next' || github.ref == 'refs/heads/ci/next-fast-tier-seed-probe') }}
        uses: ./.github/actions/cache-save
        with:
          backend: github
          path: |
            Packages/macOS/CmuxNext/.build
            Packages/Shared/CmuxHomeRender/.build
            cmux-tui/target
          key: ${{ steps.fast-cache-key.outputs.key }}

      # The 10 GB repository cache evicts least recently used entries; a
      # superseded seed is never restored again, so drop it instead of letting
      # it push other workflows' entries out.
      - name: Drop superseded seeds
        if: ${{ success() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/caches?ref=$GITHUB_REF&key=$SEED_KEY_PREFIX&sort=created_at&direction=desc&per_page=100" \
            | python3 -I scripts/cmux-next/fast-tier-seed-due.py stale --keep 2 \
            | while read -r id; do
                gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/caches/$id" && echo "dropped cache $id"
              done

      - name: Upload the seed's timing receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-next-fast-tier-seed-receipt-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cmux-next-fast-tier.json
          if-no-files-found: ignore
