name: Xcode incremental generation primary probe

on:
  push:
    branches:
      - exp/incremental-state-primary-20260921

permissions:
  contents: read
  actions: read

env:
  CI_CACHE_R2_PUBLIC_URL: ${{ vars.CI_CACHE_R2_PUBLIC_URL }}
  CANARY_BASE: 2393fd16b875819909c8f633271934a3f6d0292e
  CANARY_TARGET: 2f943925239bcff183fcb452379725fa3b4b4b20
  CANARY_REPO_URL: https://github.com/manaflow-ai/cmux.git
  CANARY_SEED_RUN_ID: "35676212414"
  CMUX_CI_XCODE_APP: ${{ vars.CMUX_CI_XCODE_APP_MACOS_15 }}
  CMUX_CI_REQUIRED_MACOS_SDK_MAJOR: "26"
  CMUX_SKIP_ZIG_BUILD: "1"

jobs:
  restored-generation:
    name: Restored generation A to B
    runs-on: blacksmith-6vcpu-macos-15
    timeout-minutes: 75
    steps:
      - name: Checkout probe harness
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Preserve benchmark harness outside worktree
        run: |
          cp scripts/ci/benchmark-incremental-generation.py "$RUNNER_TEMP/benchmark.py"
          chmod +x "$RUNNER_TEMP/benchmark.py"

      - name: Select Xcode
        run: ./scripts/select-ci-xcode.sh

      - name: Start generation download timer
        run: python3 -c 'import os,time; open(os.environ["RUNNER_TEMP"]+"/generation-download-start","w").write(str(time.monotonic()))'

      - name: Download seed worktree
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: incremental-canary-worktree
          path: ${{ runner.temp }}/worktree-artifact
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.CANARY_SEED_RUN_ID }}

      - name: Download seed DerivedData
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: incremental-canary-derived-data
          path: ${{ runner.temp }}/dd-artifact
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.CANARY_SEED_RUN_ID }}

      - name: Record generation download
        run: |
          python3 - <<'PY'
          import json, os, time
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          payload = {
              "seconds": round(time.monotonic() - float((root / "generation-download-start").read_text()), 6),
              "worktree_archive_bytes": (root / "worktree-artifact/worktree.tar.gz").stat().st_size,
              "derived_data_archive_bytes": (root / "dd-artifact/derived-data.tar.gz").stat().st_size,
          }
          (root / "generation-download.json").write_text(json.dumps(payload, sort_keys=True, indent=2) + "\n")
          print("CMUX_PRIMARY_DOWNLOAD=" + json.dumps(payload, sort_keys=True))
          PY

      - name: Restore worktree A and advance in place to B
        run: |
          python3 "$RUNNER_TEMP/benchmark.py" source-restored \
            --workspace "$GITHUB_WORKSPACE" \
            --archive "$RUNNER_TEMP/worktree-artifact/worktree.tar.gz" \
            --repo-url "$CANARY_REPO_URL" \
            --base "$CANARY_BASE" \
            --target "$CANARY_TARGET" \
            --metrics "$RUNNER_TEMP/source.json"

      - name: Restore DerivedData A
        run: |
          python3 "$RUNNER_TEMP/benchmark.py" extract-dd \
            --archive "$RUNNER_TEMP/dd-artifact/derived-data.tar.gz" \
            --derived "$RUNNER_TEMP/cmux-derived-data-compile-admission" \
            --metrics "$RUNNER_TEMP/dd-restore.json"

      - name: Compute Swift package cache key
        id: package-key
        run: |
          echo "hash=$(shasum -a 256 cmux.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Restore Swift packages
        id: spm-cache
        uses: ./.github/actions/cache-restore
        with:
          backend: ${{ vars.CI_CACHE_BACKEND }}
          path: ${{ runner.temp }}/cmux-source-packages
          key: spm-${{ steps.package-key.outputs.hash }}
          restore-keys: spm-

      - name: Sanitize Swift package cache
        run: python3 scripts/ci/sanitize-xcode-source-packages-cache.py "$RUNNER_TEMP/cmux-source-packages"

      - name: Compute compilation cache fingerprint
        id: cas-key
        run: |
          fingerprint="$(scripts/ci/compile-app-host-test-product.sh fingerprint "$RUNNER_TEMP/cmux-derived-data-compile-admission")"
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"

      - name: Restore shared Xcode compilation CAS
        id: cas-cache
        uses: ./.github/actions/cache-restore
        with:
          backend: ${{ vars.CI_CACHE_BACKEND }}
          path: ${{ runner.temp }}/cmux-compile-admission-cas
          key: xcode-compilation-test-${{ runner.os }}-${{ runner.arch }}-${{ steps.cas-key.outputs.fingerprint }}-${{ env.CANARY_BASE }}
          restore-keys: |
            xcode-compilation-test-${{ runner.os }}-${{ runner.arch }}-${{ steps.cas-key.outputs.fingerprint }}-
            xcode-compilation-test-${{ runner.os }}-${{ runner.arch }}-

      - name: Build restored generation
        id: build
        continue-on-error: true
        run: |
          python3 "$RUNNER_TEMP/benchmark.py" build \
            --workspace "$GITHUB_WORKSPACE" \
            --derived "$RUNNER_TEMP/cmux-derived-data-compile-admission" \
            --source-packages "$RUNNER_TEMP/cmux-source-packages" \
            --cas "$RUNNER_TEMP/cmux-compile-admission-cas" \
            --label restored-generation-primary \
            --source-metrics "$RUNNER_TEMP/source.json" \
            --dd-metrics "$RUNNER_TEMP/dd-restore.json" \
            --metrics "$RUNNER_TEMP/build.json"

      - name: Preserve raw build log
        if: always()
        run: cp "$RUNNER_TEMP/cmux-derived-data-compile-admission/cmux-build.log" "$RUNNER_TEMP/cmux-build.log" 2>/dev/null || true

      - name: Record primary probe row
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          SPM_CACHE_HIT: ${{ steps.spm-cache.outputs.cache-hit }}
          CAS_CACHE_HIT: ${{ steps.cas-cache.outputs.cache-hit }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          row = {
              "arm": "restored-generation-primary",
              "seed_run_id": os.environ["CANARY_SEED_RUN_ID"],
              "build_outcome": os.environ.get("BUILD_OUTCOME", ""),
              "spm_exact_hit": os.environ.get("SPM_CACHE_HIT", ""),
              "cas_exact_hit": os.environ.get("CAS_CACHE_HIT", ""),
          }
          for key, name in [
              ("generation_download", "generation-download.json"),
              ("source", "source.json"),
              ("derived_restore", "dd-restore.json"),
              ("build", "build.json"),
          ]:
              path = root / name
              row[key] = json.loads(path.read_text()) if path.is_file() else None
          (root / "row.json").write_text(json.dumps(row, sort_keys=True, indent=2) + "\n")
          print("CMUX_PRIMARY_ROW=" + json.dumps(row, sort_keys=True))
          PY

      - name: Upload primary probe evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: incremental-primary-probe
          path: |
            ${{ runner.temp }}/generation-download.json
            ${{ runner.temp }}/source.json
            ${{ runner.temp }}/dd-restore.json
            ${{ runner.temp }}/build.json
            ${{ runner.temp }}/row.json
            ${{ runner.temp }}/cmux-build.log
          if-no-files-found: ignore
          retention-days: 1

      - name: Fail if build failed
        if: steps.build.outcome != 'success'
        run: exit 1
