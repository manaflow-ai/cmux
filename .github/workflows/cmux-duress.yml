name: cmux-duress scenarios

# The offline duress simulator (cmux-tui/crates/cmux-duress, cmux-next-ios/design/duress-sim.md) kept current
# with feat-cmux-next: each head that touches cmux-tui/ or cmux-next-ios/ builds cmux-duress from a warm cargo
# cache, runs its tests and the headless bench (examples/duress_paths.rs), and replays every scenario
# (`cmux-duress scenario list`, then `cmux-duress scenario run NAME`, one JSON line each). The job summary shows
# each scenario's numbers beside the previous feat-cmux-next push's (that run's `duress-scenarios` artifact).
# A red means a test failed, the bench panicked, or a scenario failed or printed no JSON line.
#
# Until cmux-duress is on the head (it lands with lane/ios-duress-sim) the job says so and passes. Until the
# `scenario` subcommand is (a sibling lane adds it), the scenario step says so and passes; once the binary's
# usage names `scenario`, a failing `scenario list` is a red.
#
# Nightly: a schedule runs only main's copy of a workflow (.github/AGENTS.md, item 6), so this file has no
# cron of its own; the push trigger covers each head, and workflow_dispatch reruns one by hand.

on:
  push:
    branches:
      - feat-cmux-next
    # What the job reads: the workspace (cmux-duress, its path dependencies, the PTY recording under
    # cmux-agent-cli-render's fixtures), the iPhone side that plays the replay files, chat-sim's recorded lane
    # session (inputs::DEFAULT_CHAT), the ghostty-next gitlink that ghostty-vt builds, and the scripts and
    # local actions the steps run.
    paths:
      - "cmux-tui/**"
      - "cmux-next-ios/**"
      - "webviews/test/fixtures/chat-sim/**"
      - "ghostty-next"
      - ".github/workflows/cmux-duress.yml"
      - ".github/actions/setup-cmux-tui-rust/**"
      - ".github/actions/runner-cargo-home/**"
      - ".github/actions/ghostty-zig-packages/**"
      - ".github/actions/cache-restore/**"
      - ".github/actions/cache-save/**"
      - "scripts/ci/init-submodule.sh"
      - "scripts/ci/fetch-ghostty-zig-packages.sh"
      - "scripts/install-zig-ci.sh"
      - "scripts/ghostty-zig-version.sh"
      - "scripts/ci/zig-tarballs.sha256"
      - "tests/test_cmux_duress_workflow.py"
  workflow_dispatch:

permissions: {}

concurrency:
  # One run at a time; a burst of pushes runs the newest waiting head, never cancelling one mid-run.
  group: cmux-duress-${{ github.ref }}
  cancel-in-progress: false

env:
  # libghostty-vt builds from the ghostty-next gitlink (as cmux-tui.yml).
  CMUX_GHOSTTY_SRC: ""

jobs:
  duress:
    name: cmux-duress tests, bench and scenarios
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.CI_OVERFLOW_LINUX || 'cmux-linux' }}
    # A cold build of cmux-duress with ghostty-vt and cmux-agent-cli-render, debug and release, plus the bench
    # and the scenarios; a warm cache leaves most of this unused.
    timeout-minutes: 45
    permissions:
      contents: read
      # The previous feat-cmux-next push's scenario lines (one run list, one artifact download).
      actions: read
    env:
      GHOSTTY_ZIG_SOURCE: ghostty-next
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # The replay step below, run against a stand-in binary: it skips `scenario list`'s header row.
      - name: Test the scenario replay step
        run: python3 tests/test_cmux_duress_workflow.py

      - name: Is cmux-duress on this head?
        id: crate
        run: |
          if [[ -f cmux-tui/crates/cmux-duress/Cargo.toml ]]; then
            echo "have=true" >> "$GITHUB_OUTPUT"
          else
            echo "have=false" >> "$GITHUB_OUTPUT"
            echo "::notice::cmux-tui/crates/cmux-duress is not on this head yet (it lands with lane/ios-duress-sim); nothing to run"
            echo "cmux-duress is not on this head yet (it lands with lane/ios-duress-sim); nothing ran." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Init ghostty submodule
        if: steps.crate.outputs.have == 'true'
        run: bash scripts/ci/init-submodule.sh ghostty-next

      - name: Install Linux build dependencies
        if: steps.crate.outputs.have == 'true' && runner.os == 'Linux'
        run: |
          # Skip apt when the runner image already has these (tests/test_ci_apt_skips_baked_packages.py).
          if dpkg -s clang libclang-dev pkg-config >/dev/null 2>&1; then
            echo "clang libclang-dev pkg-config: already installed"
          else
            sudo apt-get update
            sudo apt-get install -y clang libclang-dev pkg-config
          fi

      - name: Install zig
        if: steps.crate.outputs.have == 'true'
        run: ./scripts/install-zig-ci.sh

      - name: Fetch the ghostty-next Zig packages (cached, deadlined, retried)
        if: steps.crate.outputs.have == 'true'
        uses: ./.github/actions/ghostty-zig-packages

      - name: Set up pinned Rust
        if: steps.crate.outputs.have == 'true'
        uses: ./.github/actions/setup-cmux-tui-rust

      # The cargo cache setup of cmux-tui.yml's test job, under its own key (this job builds one package, debug
      # and release, not the workspace). Saved only from a feat-cmux-next push; every run restores it.
      - name: Cache cargo build
        if: steps.crate.outputs.have == 'true'
        id: cargo-cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Why: docs/ci/cmux-next-workflow-notes.md#note-210 (pool runners keep different leftover toolchains)
          add-rust-environment-hash-key: false
          cache-bin: false
          workspaces: cmux-tui -> target
          shared-key: cmux-duress-linux-${{ hashFiles('cmux-tui/rust-toolchain.toml', 'cmux-tui/Cargo.lock', '.cargo/config.toml') }}
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/feat-cmux-next' }}

      - name: Report cargo cache hit
        if: steps.crate.outputs.have == 'true'
        env:
          CACHE_HIT: ${{ steps.cargo-cache.outputs.cache-hit }}
        run: |
          {
            echo "### Rust compile cache"
            echo
            echo "- key: \`cmux-duress-linux\`, exact hit: \`${CACHE_HIT:-false}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: cargo test -p cmux-duress
        if: steps.crate.outputs.have == 'true'
        working-directory: cmux-tui
        run: cargo test -p cmux-duress --locked

      - name: Headless bench (examples/duress_paths.rs)
        if: steps.crate.outputs.have == 'true'
        working-directory: cmux-tui
        run: |
          set -o pipefail
          cargo run --release --locked -p cmux-duress --example duress_paths | tee "$RUNNER_TEMP/duress-bench.md"
          {
            echo "### Headless duress bench"
            echo
            cat "$RUNNER_TEMP/duress-bench.md"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build the cmux-duress binary
        if: steps.crate.outputs.have == 'true'
        working-directory: cmux-tui
        run: cargo build --release --locked -p cmux-duress --bin cmux-duress

      # Every scenario `scenario list` names, each replayed by `scenario run NAME` (one JSON line). A failed run
      # or a missing or unparsable line is recorded and fails the delta step below, after every scenario ran.
      - name: Replay every scenario
        if: steps.crate.outputs.have == 'true'
        id: scenarios
        working-directory: cmux-tui
        run: |
          set -uo pipefail
          bin=target/release/cmux-duress
          out="$RUNNER_TEMP/duress-scenarios"
          mkdir -p "$out"
          : > "$out/scenarios.jsonl"
          : > "$out/broken.txt"
          if ! "$bin" scenario list > "$out/names.txt" 2> "$out/list.err"; then
            if "$bin" --help 2>&1 | grep -qw scenario; then
              echo "::error::cmux-duress scenario list failed: $(head -c 2000 "$out/list.err")"
              echo "scenario list" >> "$out/broken.txt"
            else
              echo "::notice::cmux-duress has no scenario subcommand on this head yet (a sibling lane adds it); scenarios skipped"
              echo "### Duress scenarios" >> "$GITHUB_STEP_SUMMARY"
              echo "cmux-duress has no \`scenario\` subcommand on this head yet; nothing replayed." >> "$GITHUB_STEP_SUMMARY"
              echo "ran=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "ran=true" >> "$GITHUB_OUTPUT"
          # `scenario list` prints a table: a `name  headless  summary` header row, then one row per scenario.
          while IFS= read -r name; do
            name="${name%%[[:space:]]*}"
            [[ -n "$name" && "$name" != \#* && "$name" != name ]] || continue
            echo "::group::scenario $name"
            # A failing scenario still prints its JSON line: keep its numbers either way, so the next run
            # has a baseline and the summary shows how far off the check is.
            line="$("$bin" scenario run "$name")"
            rc=$?
            line="$(printf '%s\n' "$line" | grep -E '^\{' | tail -n 1)"
            if [[ -n "$line" ]] && python3 -c 'import json,sys; json.loads(sys.argv[1])' "$line" 2>/dev/null; then
              printf '{"scenario": %s, "result": %s}\n' "$(python3 -c 'import json,sys; print(json.dumps(sys.argv[1]))' "$name")" "$line" >> "$out/scenarios.jsonl"
            else
              echo "::error::scenario $name printed no JSON line"
              echo "$name: no JSON line" >> "$out/broken.txt"
            fi
            if [[ $rc -ne 0 ]]; then
              echo "::error::scenario $name exited $rc"
              echo "$name: exited $rc" >> "$out/broken.txt"
            fi
            echo "::endgroup::"
          done < "$out/names.txt"
          if [[ ! -s "$out/scenarios.jsonl" && ! -s "$out/broken.txt" ]]; then
            echo "::error::cmux-duress scenario list named no scenario"
            echo "scenario list: named no scenario" >> "$out/broken.txt"
          fi

      - name: Find the previous feat-cmux-next push's scenario lines
        if: steps.scenarios.outputs.ran == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          # The newest earlier push run that finished its replay (green or red: a red run still uploads its
          # lines, and a run that only ever compared with green ones had no baseline while a scenario failed).
          prev="$(gh run list -R "$REPO" --workflow cmux-duress.yml --branch feat-cmux-next --event push \
            --status completed --limit 10 --json databaseId,conclusion \
            --jq "[.[] | select(.databaseId != $RUN_ID and (.conclusion == \"success\" or .conclusion == \"failure\"))][0].databaseId // empty")"
          if [[ -z "$prev" ]]; then
            echo "no earlier finished feat-cmux-next push run"
            exit 0
          fi
          gh run download "$prev" -R "$REPO" -n duress-scenarios -D "$RUNNER_TEMP/duress-previous"
          echo "$prev" > "$RUNNER_TEMP/duress-previous/run-id"

      - name: Scenario deltas against the previous run
        if: steps.scenarios.outputs.ran == 'true'
        env:
          OUT: ${{ runner.temp }}/duress-scenarios
          PREV: ${{ runner.temp }}/duress-previous
        run: |
          python3 - <<'PY'
          import json, os, pathlib

          out, prev = pathlib.Path(os.environ["OUT"]), pathlib.Path(os.environ["PREV"])

          def load(path):
              rows = {}
              if path.is_file():
                  for line in path.read_text().splitlines():
                      try:
                          row = json.loads(line)
                          rows[row["scenario"]] = row["result"]
                      except (ValueError, KeyError, TypeError):
                          pass
              return rows

          def numbers(value, prefix=""):
              """Every numeric leaf of a JSON value, by dotted path."""
              if isinstance(value, bool):
                  return {}
              if isinstance(value, (int, float)):
                  return {prefix or "value": value}
              found = {}
              if isinstance(value, dict):
                  for key, item in value.items():
                      found.update(numbers(item, f"{prefix}.{key}" if prefix else str(key)))
              return found

          def failed(result):
              """A scenario's own verdict (`"verdict": "fail"`), when its line carries one."""
              if not isinstance(result, dict):
                  return False
              return any(result.get(key) is False for key in ("ok", "pass", "passed")) or \
                  str(result.get("verdict", result.get("status", ""))).lower() in ("fail", "failed", "error")

          def known(result):
              """The open bug a scenario reproduces (`known_failing`), if its file names one."""
              return result.get("known_failing") if isinstance(result, dict) else None

          now, before = load(out / "scenarios.jsonl"), load(prev / "scenarios.jsonl")
          broken = [line for line in (out / "broken.txt").read_text().splitlines() if line.strip()]
          broken += [f"{name}: its line says it failed" for name, result in now.items()
                     if failed(result) and not known(result)
                     and not any(item.startswith(f"{name}:") for item in broken)]
          known_failing = [f"`{name}`: {known(result)}" for name, result in sorted(now.items())
                           if failed(result) and known(result)]
          fixed = [name for name, result in sorted(now.items()) if known(result) and not failed(result)]
          for name in fixed:
              print(f"::warning::scenario {name} passes now: drop known_failing from its scenarios/{name}.toml")
          prev_run = (prev / "run-id").read_text().strip() if (prev / "run-id").is_file() else ""

          lines = ["### Duress scenarios", ""]
          lines.append(f"{len(now)} scenario(s) replayed; before = run {prev_run}" if prev_run
                       else f"{len(now)} scenario(s) replayed; no earlier finished feat-cmux-next push to compare with")
          lines.append("")
          if broken:
              lines += ["**Broken:**", ""] + [f"- {item}" for item in broken] + [""]
          if known_failing:
              lines += ["**Known failing** (an open bug; not a red):", ""] + [f"- {item}" for item in known_failing] + [""]
          if fixed:
              lines += ["**Passes now** (drop `known_failing`): " + ", ".join(f"`{name}`" for name in fixed), ""]
          gone = sorted(set(before) - set(now))
          if gone:
              lines += ["Gone since the previous run: " + ", ".join(f"`{name}`" for name in gone), ""]
          lines += ["| scenario | metric | before | after | delta |", "|---|---|---:|---:|---:|"]
          for name in sorted(now):
              after_numbers, before_numbers = numbers(now[name]), numbers(before.get(name))
              for metric in sorted(after_numbers):
                  after = after_numbers[metric]
                  old = before_numbers.get(metric)
                  if old is None:
                      delta = "new"
                  elif old == 0:
                      delta = "0" if after == 0 else "n/a"
                  else:
                      delta = f"{(after - old) / abs(old) * 100:+.1f}%"
                  lines.append(f"| `{name}` | `{metric}` | {'' if old is None else old} | {after} | {delta} |")
          text = "\n".join(lines) + "\n"
          print(text)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(text)
          raise SystemExit(1 if broken else 0)
          PY

      - name: Keep this run's scenario lines for the next run
        if: ${{ !cancelled() && steps.scenarios.outputs.ran == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: duress-scenarios
          path: ${{ runner.temp }}/duress-scenarios/
          retention-days: 30
          if-no-files-found: ignore
