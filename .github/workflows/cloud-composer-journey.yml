name: Cloud composer journey (nightly's source, tagged DEV app)

# Leo, 2026-11-10: "how did NONE of these work/get tested?", "i already told you to test these", "did you guys
# not test these". The journey itself lives on feat-cmux-next (cloud-composer-journey.yml there, driving
# scripts/cmux-next/cloud-composer-journey.py): the new-chat composer's Cloud start as a person drives it, over
# folder x account x mode, against a nightly build's source. This copy on main does two things only:
#
# - registers the workflow, since GitHub dispatches only a workflow the default branch has:
#     gh workflow run cloud-composer-journey.yml -R manaflow-ai/cmux --ref feat-cmux-next -f nightly_build=BUILD
#   A dispatch runs the file at --ref, so feat-cmux-next's inputs and jobs win; these mirror them for the form.
# - schedules it beside the hourly production journey (cloud-journey-prod.yml): every six hours it dispatches the
#   feat-cmux-next run against the newest Nightly build, unless one is already queued or running. That run's red
#   opens or updates the issue "Cloud composer journey (staging) is red" and its next green closes it, as the
#   production journey's red issue does, so the coordinator sees both the same way.
#
# It reads no secret: the dispatched run holds the agent test account in its own environment.
on:
  schedule:
    - cron: "37 */6 * * *"
  workflow_dispatch:
    inputs:
      nightly_build:
        description: The Nightly feed build to test (digits); empty for the newest
        required: false
        default: ""
        type: string
      backend:
        description: The Cloud backend the app signs in to
        required: false
        default: staging
        type: choice
        options: [staging, prod]
      only:
        description: "Cell filter: comma list of folder, account or mode names, or folder/account/mode ids"
        required: false
        default: ""
        type: string
      request_id:
        description: Names the run, so a dispatcher finds it
        required: false
        default: ""
        type: string

permissions: {}

concurrency:
  group: cloud-composer-journey-dispatch-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  dispatch:
    if: github.repository == 'manaflow-ai/cmux' && github.event_name == 'schedule'
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    permissions:
      actions: write
      contents: read
    timeout-minutes: 5
    steps:
      - name: Start the composer journey on feat-cmux-next unless one is pending
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const source = 'feat-cmux-next';
            const workflow = 'cloud-composer-journey.yml';
            for (const status of ['queued', 'in_progress', 'waiting', 'pending', 'requested']) {
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner, repo, workflow_id: workflow, branch: source, status, per_page: 5,
              });
              if (data.total_count > 0) {
                core.notice(`A composer journey is already ${status} (run ${data.workflow_runs[0].id}); nothing to start`);
                return;
              }
            }
            await github.rest.actions.createWorkflowDispatch({
              owner, repo, workflow_id: workflow,
              // Fully qualified: a tag named feat-cmux-next must never be picked.
              ref: `refs/heads/${source}`,
              inputs: { backend: 'staging', request_id: 'scheduled' },
            });
            core.notice(`Started the Cloud composer journey on ${source} against the newest Nightly build`);

  registration:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    steps:
      - run: echo "The Cloud composer journey is implemented on feat-cmux-next; dispatch it with --ref feat-cmux-next"
