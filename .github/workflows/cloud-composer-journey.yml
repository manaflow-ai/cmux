name: Cloud composer journey (nightly's source, tagged DEV app)

# Leo, 2026-11-10: "how did NONE of these work/get tested?", "i already told you to test these", "did you guys
# not test these". The journey itself lives on feat-cmux-next (cloud-composer-journey.yml there, driving
# scripts/cmux-next/cloud-composer-journey.py): the new-chat composer's Cloud start as a person drives it, over
# folder x account x mode, against a nightly build's source. This copy on main does two things only:
#
# - registers the workflow, since GitHub dispatches only a workflow the default branch has:
#     gh workflow run cloud-composer-journey.yml -R manaflow-ai/cmux --ref feat-cmux-next -f nightly_build=BUILD
#   A dispatch runs the file at --ref, so feat-cmux-next's inputs and jobs win; these mirror them for the form.
# - schedules it beside the hourly production journey (cloud-journey-prod.yml): every six hours it dispatches the
#   feat-cmux-next run against the newest Nightly build, unless one is already queued or running. That run's red
#   opens or updates the issue "Cloud composer journey (staging) is red" and its next green closes it, as the
#   production journey's red issue does, so the coordinator sees both the same way.
#
# It reads no secret: the dispatched run holds the agent test account in its own environment.
on:
  schedule:
    - cron: "37 */6 * * *"
  workflow_dispatch:
    inputs:
      nightly_build:
        description: The Nightly feed build to test (digits); empty for the newest
        required: false
        default: ""
        type: string
      backend:
        description: The Cloud backend the app signs in to
        required: false
        default: staging
        type: choice
        options: [staging, prod]
      only:
        description: "Cell filter: comma list of folder, account or mode names, or folder/account/mode ids"
        required: false
        default: ""
        type: string
      request_id:
        description: Names the run, so a dispatcher finds it
        required: false
        default: ""
        type: string

permissions: {}

concurrency:
  group: cloud-composer-journey-dispatch-${{ github.event_name }}
  cancel-in-progress: false

env:
  # Temporary REST budget attribution: one gh-call line per GitHub API call (scripts/ci/api_call_log/env.sh, fetched at a fixed commit when the checkout has no copy).
  BASH_ENV: '$({ w="${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh"; t="${RUNNER_TEMP:-/nonexistent}/api-call-log-src"; if [ -f "$w" ]; then echo "$w"; elif [ -n "${RUNNER_TEMP:-}" ]; then if [ ! -f "$t/env.sh" ] && [ ! -e "$t.tried" ] && { [ "${RUNNER_OS:-}" = Linux ] || [ "${RUNNER_OS:-}" = macOS ]; } && [ "$(date -u +%Y%m%d%H)" -lt 2026112300 ]; then : > "$t.tried"; mkdir -p "$t.part" && for x in env.sh gh sitecustomize.py isolated.py; do curl -fsSL --max-time 5 -o "$t.part/$x" "https://raw.githubusercontent.com/manaflow-ai/cmux/27647ffd3ae838c63be28ca3e5883dcd68c34518/scripts/ci/api_call_log/$x" || break; done; [ -s "$t.part/isolated.py" ] && mv "$t.part" "$t"; fi; if [ -f "$t/env.sh" ]; then echo "$t/env.sh"; else echo unset BASH_ENV > "$t.off.sh" && echo "$t.off.sh"; fi; fi; } 2>/dev/null)'

jobs:
  dispatch:
    if: github.repository == 'manaflow-ai/cmux' && github.event_name == 'schedule'
    # It holds the cmux-bot App key, so no variable may move it (tests/test_ci_fork_runner_routing.py).
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || 'cmux-gcp-secret-jit-x64' }}
    permissions:
      actions: write
      contents: read
    timeout-minutes: 20
    env:
      # A scheduled job's GitHub API waits stop here and fail loud (scripts/ci/gh_budget_wait.sh).
      GH_BUDGET_WAIT_MAX_SECONDS: "900"
    steps:
      # This commit's GitHub API wait (scripts/ci/gh_budget_wait.sh): the github-script step below
      # installs gh_budget_wait.cjs and waits through a rate limit or a GitHub 5xx under the job's
      # GH_BUDGET_WAIT_MAX_SECONDS, then fails loud.
      - name: Checkout the GitHub API wait
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: .gh-budget-tooling
          sparse-checkout: |
            scripts/ci/gh_budget_wait.sh
            scripts/ci/gh_budget_wait.cjs
          sparse-checkout-cone-mode: false
      - name: Wait through GitHub API rate limits and 5xx in this job
        working-directory: ${{ github.workspace }}
        run: bash .gh-budget-tooling/scripts/ci/gh_budget_wait.sh --install

      # Two hourly REST budgets instead of one: the cmux-bot installation's, then github.token's for reads
      # (gh_budget_wait.cjs `spare`). github.token's budget is shared with every workflow in the repo; a
      # dispatcher on it alone went red for a day when it was spent (cmux#61103, the same class).
      - name: Mint the cmux-bot token
        id: cmux-bot-token
        if: vars.CMUX_BOT_APP_ID != ''
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.CMUX_BOT_APP_ID }}
          private-key: ${{ secrets.CMUX_BOT_APP_KEY }}
          permission-actions: write
          permission-contents: read

      - name: Start the composer journey on feat-cmux-next unless one is pending
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SPARE_READ_TOKEN: ${{ steps.cmux-bot-token.outputs.token && github.token || '' }}
        with:
          github-token: ${{ steps.cmux-bot-token.outputs.token || github.token }}
          script: |
            if (process.env.GH_BUDGET_WAIT_JS) require(process.env.GH_BUDGET_WAIT_JS).install({ github, core, spare: process.env.SPARE_READ_TOKEN ? getOctokit(process.env.SPARE_READ_TOKEN) : undefined });
            const { owner, repo } = context.repo;
            const source = 'feat-cmux-next';
            const workflow = 'cloud-composer-journey.yml';
            // The journey itself lands on feat-cmux-next separately (cmux#40902). Until that branch
            // has its copy, GitHub answers a dispatch with 422 "does not have 'workflow_dispatch'
            // trigger", which turned every six-hour tick red. Say so and start nothing instead.
            try {
              await github.rest.repos.getContent({ owner, repo, path: `.github/workflows/${workflow}`, ref: `refs/heads/${source}` });
            } catch (error) {
              if (error.status !== 404) throw error;
              core.notice(`${source} has no ${workflow} yet (cmux#40902); no composer journey to start`);
              return;
            }
            for (const status of ['queued', 'in_progress', 'waiting', 'pending', 'requested']) {
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner, repo, workflow_id: workflow, branch: source, status, per_page: 5,
              });
              if (data.total_count > 0) {
                core.notice(`A composer journey is already ${status} (run ${data.workflow_runs[0].id}); nothing to start`);
                return;
              }
            }
            await github.rest.actions.createWorkflowDispatch({
              owner, repo, workflow_id: workflow,
              // Fully qualified: a tag named feat-cmux-next must never be picked.
              ref: `refs/heads/${source}`,
              inputs: { backend: 'staging', request_id: 'scheduled' },
            });
            core.notice(`Started the Cloud composer journey on ${source} against the newest Nightly build`);

  registration:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.CI_OVERFLOW_LINUX || 'cmux-linux' }}
    timeout-minutes: 5
    steps:
      - run: echo "The Cloud composer journey is implemented on feat-cmux-next; dispatch it with --ref feat-cmux-next"
