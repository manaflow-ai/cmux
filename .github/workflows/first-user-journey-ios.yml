name: First-user journey (iOS)
run-name: >-
  First-user journey (iOS) · ${{ inputs.ref || github.head_ref || github.ref_name }}

# The NEXT iPhone app's first-user journey, walked on a freshly erased
# simulator every night: sign-in, setup, pairing, Home and its tabs, a chat,
# Settings and each of its pages, the Face ID lock, the error states and the
# smallest and largest text sizes, every control tapped
# (cmux-next-ios/UITests/FirstUserJourneyUITests.swift). The run's
# results.json (the shared first-user-journey schema, surface "ios"),
# summary.md, the screenshots of every red and a video of the whole run are
# the `first-user-journey-ios` artifact, which the cmux quality report reads.
# A red is a finding, not a failed job: the job fails only when the journey
# could not run or no results came out.
#
# A schedule fires only from the default branch's copy of a workflow. That
# copy (main) has no cmux-next-ios, so its scheduled run only dispatches this
# workflow on feat-cmux-next, where the journey runs. It runs on no pull
# request: try
# a change with `gh workflow run first-user-journey-ios.yml --ref BRANCH`.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: App source to walk (branch, tag or SHA); empty is this ref
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: first-user-journey-ios-${{ inputs.ref || github.ref }}
  cancel-in-progress: false

env:
  # Temporary REST budget attribution: one gh-call line per GitHub API call (scripts/ci/api_call_log/env.sh, fetched at a fixed commit when the checkout has no copy).
  BASH_ENV: '$({ w="${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh"; t="${RUNNER_TEMP:-/nonexistent}/api-call-log-src"; if [ -f "$w" ]; then echo "$w"; elif [ -n "${RUNNER_TEMP:-}" ]; then if [ ! -f "$t/env.sh" ] && [ ! -e "$t.tried" ] && { [ "${RUNNER_OS:-}" = Linux ] || [ "${RUNNER_OS:-}" = macOS ]; } && [ "$(date -u +%Y%m%d%H)" -lt 2026112300 ]; then : > "$t.tried"; mkdir -p "$t.part" && for x in env.sh gh sitecustomize.py isolated.py; do curl -fsSL --max-time 5 -o "$t.part/$x" "https://raw.githubusercontent.com/manaflow-ai/cmux/27647ffd3ae838c63be28ca3e5883dcd68c34518/scripts/ci/api_call_log/$x" || break; done; [ -s "$t.part/isolated.py" ] && mv "$t.part" "$t"; fi; if [ -f "$t/env.sh" ]; then echo "$t/env.sh"; else echo unset BASH_ENV > "$t.off.sh" && echo "$t.off.sh"; fi; fi; } 2>/dev/null)'

jobs:
  route:
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || 'cmux-linux' }}
    timeout-minutes: 5
    permissions:
      actions: write # the default branch's scheduled run starts feat-cmux-next's
    outputs:
      walk: ${{ steps.route.outputs.walk }}
      runs_on: ${{ steps.pool.outputs.runs_on }}
      retry_runs_on: ${{ steps.pool.outputs.retry_runs_on }}
    steps:
      - name: Checkout pool helper
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: |
            scripts/ci/ios_runner_pool.py
            scripts/ci/e2e_runner_pool.py
            scripts/ci/pr_runner_pool.py
            scripts/ci/github_spend.py
            scripts/ci/deadline_http.py
            scripts/ci/simple_pool_picker.py
            scripts/ci/warm_distance.py
            .gitmodules
          sparse-checkout-cone-mode: false
          persist-credentials: false
      # The macOS pool the walk runs on (scripts/ci/ios_runner_pool.py, the
      # one-simulator lane ios-screenshots.yml uses): an owned Mac with an
      # iOS simulator when CI_IOS_OWNED allows, else MACOS_RUNNER_IOS; a
      # re-run takes retry_runs_on.
      - name: Pick the macOS pool
        id: pool
        env:
          # The overflow switch the granted default reads (ios_runner_pool.py granted_default()).
          CI_OVERFLOW_MAC: ${{ vars.CI_OVERFLOW_MAC }}
          CI_RUNNER_STATE: ${{ vars.CI_RUNNER_STATE }}
          RUNNER_VARIABLE: ${{ vars.MACOS_RUNNER_IOS }}
          IOS_OWNED: ${{ vars.CI_IOS_OWNED }}
          POOL_OWNED: ${{ vars.CI_PR_POOL_OWNED }}
          OWNED_SLOTS: ${{ vars.CI_OWNED_POOL_SLOTS }}
          PR_XCODE_APP: ${{ vars.CMUX_CI_XCODE_APP_PR }}
        run: |
          set -euo pipefail
          route="$(python3 scripts/ci/ios_runner_pool.py \
            --lane screenshots \
            --variable "$RUNNER_VARIABLE" \
            --ios-owned "$IOS_OWNED" \
            --owned "$POOL_OWNED" \
            --owned-slots "$OWNED_SLOTS" \
            --pr-xcode-app "$PR_XCODE_APP")"
          echo "$route" >> "$GITHUB_OUTPUT"
          echo "$route"
      - id: route
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = schedule ] && [ "$REF" != refs/heads/feat-cmux-next ]; then
            gh workflow run first-user-journey-ios.yml --repo "$GITHUB_REPOSITORY" --ref feat-cmux-next
            echo "::notice::started the journey on feat-cmux-next"
            echo "walk=false" >> "$GITHUB_OUTPUT"
          else
            echo "walk=true" >> "$GITHUB_OUTPUT"
          fi

  journey:
    needs: route
    if: needs.route.outputs.walk == 'true'
    name: Walk the first-user journey (iPhone simulator)
    # No secret in this job: the mock account (DEBUG) stands in for sign-in.
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || fromJSON(github.run_attempt > 1 && needs.route.outputs.retry_runs_on || needs.route.outputs.runs_on) }}
    timeout-minutes: 75
    steps:
      - name: Result paths
        run: |
          echo "DERIVED=${CMUX_DERIVED_DATA_SLOT:-$RUNNER_TEMP/dd}" >> "$GITHUB_ENV"
          echo "RAW=$RUNNER_TEMP/raw" >> "$GITHUB_ENV"
          echo "OUT=$RUNNER_TEMP/first-user-journey-ios" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/dd" "$RUNNER_TEMP/raw" "$RUNNER_TEMP/first-user-journey-ios"
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Select Xcode
        run: ./scripts/select-ci-xcode.sh
      # CmuxMobileLinkFFI.xcframework is built only when what it is built from changes. The key is the one
      # cmux-next-ios-kit.yml uses (scripts/ci/ios_link_ffi_key.py: the packages the FFI library compiles, the lock,
      # the toolchain, the build script and the checked-in bindings, plus the selected Xcode), so the entry a
      # feat-cmux-next kit run saves is this job's hit too. The older key (.github/scripts/ios_link_ffi_key.py) hashed
      # the whole cmux-next-ios/rust tree, cmux-mobile-host and every tests/ included, so most Rust merges moved it and
      # the build (150-275 s of a Mac) ran on 13 of 19 reliability-matrix runs (2026-11-24). A pull request only reads
      # the cache; other events save what they built when its bindings match the checked-in ones (the kit's drift
      # check). A key that cannot be read (no Python 3.11 tomllib, a ref from before the script) builds, as before.
      - name: The framework's inputs
        id: ffi-key
        continue-on-error: true
        run: |
          set -euo pipefail
          if [ -f scripts/ci/ios_link_ffi_key.py ]; then
            inputs="$(python3 scripts/ci/ios_link_ffi_key.py)"
            xcode="$(xcodebuild -version | tr -cs 'A-Za-z0-9.' '-')"
            echo "key=cmux-next-ios-link-ffi-xcf-${RUNNER_OS}-${RUNNER_ARCH}-${xcode}-${inputs}" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::no cache key for CmuxMobileLinkFFI.xcframework; building it"
          fi
      - name: Restore the framework built from the same inputs
        id: ffi
        if: steps.ffi-key.outputs.key != ''
        continue-on-error: true
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: cmux-next-ios/CmuxMobileKit/Frameworks/CmuxMobileLinkFFI.xcframework
          key: ${{ steps.ffi-key.outputs.key }}
      - name: Set up pinned Rust
        if: steps.ffi.outputs.cache-hit != 'true'
        uses: ./.github/actions/setup-cmux-tui-rust
      - name: Cache cargo
        if: steps.ffi.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && github.event_name != 'merge_group' && contains(fromJSON('["refs/heads/main","refs/heads/feat-cmux-next","refs/heads/nightly-next"]'), github.ref) }}
          # Why: docs/ci/cmux-next-workflow-notes.md#note-210 (pool runners keep different leftover toolchains)
          add-rust-environment-hash-key: false
          cache-bin: false
          workspaces: cmux-next-ios/rust
          # The lockfile and toolchain name the entry: with the environment hash off, a bare key never changed, so the
          # first save was restored forever and its stale third-party crates rebuilt on every run (2026-11-24).
          key: first-user-journey-ios-${{ hashFiles('cmux-tui/rust-toolchain.toml', 'cmux-next-ios/rust/Cargo.lock', '.cargo/config.toml') }}
      - name: Build CmuxMobileLinkFFI.xcframework
        if: steps.ffi.outputs.cache-hit != 'true'
        env:
          JOBS: "6"
        run: bash cmux-next-ios/rust/scripts/build-xcframework.sh
      - name: Do the built bindings match the checked-in ones
        id: ffi-drift
        if: steps.ffi-key.outputs.key != '' && steps.ffi.outputs.cache-hit != 'true' && github.event_name != 'pull_request'
        run: |
          # The build rewrites the bindings and restores Cargo.lock: a tracked change is drift, and the kit's
          # entries promise none, so a drifted build is used here but not saved.
          if git diff --quiet -- cmux-next-ios/; then echo "clean=true" >> "$GITHUB_OUTPUT"; fi
      - name: Save the framework for later runs
        if: steps.ffi-drift.outputs.clean == 'true'
        # Another job saving the same key first is not a failure.
        continue-on-error: true
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: cmux-next-ios/CmuxMobileKit/Frameworks/CmuxMobileLinkFFI.xcframework
          key: ${{ steps.ffi-key.outputs.key }}
      - name: Install xcodegen
        run: |
          set -euo pipefail
          command -v xcodegen >/dev/null || brew install xcodegen
          xcrun simctl list runtimes available | grep -Eq '\biOS\b' || xcodebuild -downloadPlatform iOS
      - name: Build the app and the journey for testing
        working-directory: cmux-next-ios
        run: |
          set -euo pipefail
          xcodegen generate -q
          dest="$(python3 -I scripts/app_review_pick_simulator.py --family iphone --print-destination)"
          # Debug: the mock account is DEBUG only. Sign in with Apple shows,
          # as in the App Store configurations.
          xcodebuild -project CmuxMobileApp.xcodeproj -scheme CmuxMobileApp -configuration Debug \
            -destination "$dest,arch=arm64" -derivedDataPath "$DERIVED" -enableCodeCoverage NO \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            CMUX_MOBILE_APPLE_SIGN_IN=YES \
            build-for-testing 2>&1 | tee "$RAW/build.log" | { grep -E 'error:|BUILD' || true; }
          test "${PIPESTATUS[0]}" -eq 0
      - name: Walk the journey on a freshly erased iPhone
        # The test caps itself at 30 min (FirstUserJourneyUITests.journeyBudget);
        # The perl alarm below stops a hang (macOS has no `timeout`), and the steps after still report.
        timeout-minutes: 45
        run: |
          # Never -e: a failing suite must still leave its log and screenshots
          # for the report.
          set +e
          set -uo pipefail
          xctestrun="$(find "$DERIVED/Build/Products" -name '*.xctestrun' | head -n 1)"
          # The smallest current iPhone the image has, so layout breaks show
          # first; the review gate covers the Pro Max and iPad.
          # The fleet's pinned runtime when the host has it, else the newest.
          runtime="$(xcrun simctl list runtimes available -j | python3 -I scripts/ci/ios_sim_runtime.py --prefer-pin --runtime-only 2>/dev/null || true)"
          udid=""
          for model in "iPhone 17e" "iPhone 16e" "iPhone 17" "iPhone 16"; do
            type_id="$(xcrun simctl list devicetypes -j | python3 -I -c "import json,sys; t=[d['identifier'] for d in json.load(sys.stdin)['devicetypes'] if d['name']==sys.argv[1]]; print(t[0] if t else '')" "$model")"
            [ -n "$type_id" ] && [ -n "$runtime" ] || continue
            udid="$(xcrun simctl create "fuj-$GITHUB_RUN_ID" "$type_id" "$runtime" 2>/dev/null)" && { echo "device: $model ($udid)"; break; }
          done
          if [ -z "$udid" ]; then
            udid="$(python3 -I cmux-next-ios/scripts/app_review_pick_simulator.py --family iphone --print-udid)"
            echo "device: review gate's iPhone ($udid)"
          fi
          # A fresh install: nothing installed, no permission ever answered.
          xcrun simctl shutdown "$udid" 2>/dev/null || true
          xcrun simctl erase "$udid"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          echo "SIM=$udid" >> "$GITHUB_ENV"
          xcrun simctl io "$udid" recordVideo --codec h264 --force "$OUT/journey.mp4" > "$RAW/video.log" 2>&1 &
          video=$!
          perl -e 'alarm shift; exec @ARGV or die "exec: $!"' 2400 xcodebuild test-without-building -xctestrun "$xctestrun" \
            -destination "id=$udid,arch=arm64" -resultBundlePath "$RAW/journey.xcresult" \
            -only-testing:CmuxMobileAppUITests/FirstUserJourneyUITests \
            -test-timeouts-enabled YES -maximum-test-execution-time-allowance 420 \
            > "$RAW/journey.log" 2>&1
          code=$?
          # Our own recorder, by its PID: SIGINT finishes the file. A recorder that never started writing
          # ignores it, so it gets 20 s, then KILL: an unbounded `wait` here hung the step to its limit.
          kill -INT "$video" 2>/dev/null
          for _ in $(seq 20); do kill -0 "$video" 2>/dev/null || break; sleep 1; done
          kill -KILL "$video" 2>/dev/null
          wait "$video" 2>/dev/null
          echo "$code" > "$RAW/exit"
          grep -E '^FUJ |Executed [0-9]+ tests|^Test Case .* failed' "$RAW/journey.log" | tail -n 200
          mkdir -p "$RAW/attachments"
          xcrun xcresulttool export attachments --path "$RAW/journey.xcresult" --output-path "$RAW/attachments" >/dev/null 2>&1 || true
          exit 0
      - name: Write results.json and summary.md
        if: always()
        env:
          BUILD: ${{ inputs.ref || github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          code="$(cat "$RAW/exit" 2>/dev/null || echo 1)"
          python3 -I cmux-next-ios/scripts/first_user_journey_report.py \
            --log "$RAW/journey.log" --attachments "$RAW/attachments" --exit-code "$code" \
            --build "$BUILD" --run-url "$RUN_URL" --out "$OUT"
          cp "$RAW/journey.log" "$OUT/journey.log" 2>/dev/null || true
          cat "$OUT/summary.md" >> "$GITHUB_STEP_SUMMARY"
      # Leo, 2026-11-24: "this on reviving had tons of layout shifts." journey.mp4 read frame by frame for blocks
      # that jump (move in one frame and stay), blinks and staggered settles: the table in this run's summary and
      # journey.mp4.shifts.json in the artifact. A report, never a failure (the seeded recordings gate the detector).
      - name: Layout shifts in the journey recording
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 10
        run: |
          [ -s "$OUT/journey.mp4" ] || { echo "no journey.mp4"; exit 0; }
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          command -v ffmpeg >/dev/null || { echo "no ffmpeg on this host: no layout-shift report" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; }
          python3 -I scripts/cmux-next/recording-shifts-report.py "$OUT/journey.mp4" \
            --title "Layout shifts in journey.mp4" --summary "$GITHUB_STEP_SUMMARY"
      - name: Upload first-user-journey-ios
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: first-user-journey-ios
          # results.json and summary.md at the artifact root.
          path: ${{ env.OUT }}
          if-no-files-found: error
          retention-days: 3
      - name: Remove the run's simulator
        if: always()
        run: |
          # Only the device this run created (named fuj-<run id>).
          udid="$(xcrun simctl list devices -j | python3 -I -c "import json,sys; print(next((d['udid'] for v in json.load(sys.stdin)['devices'].values() for d in v if d['name']==sys.argv[1]), ''))" "fuj-$GITHUB_RUN_ID")"
          [ -n "$udid" ] && xcrun simctl delete "$udid" || true
