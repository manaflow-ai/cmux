name: Storage maintenance

# One entry point for storage hygiene. Each job keeps its own credentials,
# permissions, runner and main-only guard. The weekly schedule runs both the
# read-only census and PR media cleanup; each other schedule runs one task.
on:
  schedule:
    - cron: "37 * * * *"
    - cron: "23 5 * * *"
    - cron: "53 7 * * *"
    - cron: "41 6 * * 1"
  workflow_dispatch:
    inputs:
      task:
        description: Storage task to run
        required: true
        default: r2-census
        type: choice
        options:
          - actions-artifacts
          - r2-cache
          - r2-binaries
          - r2-census
          - pr-media
      delete:
        description: Send deletes for the selected prune task. Unchecked reports only.
        required: false
        default: false
        type: boolean
      apply:
        description: Rewrite the PR media branch. Used only by the pr-media task.
        required: false
        default: false
        type: boolean

permissions: {}

env:
  # Temporary REST budget attribution: one gh-call line per GitHub API call (scripts/ci/api_call_log/env.sh, fetched at a fixed commit when the checkout has no copy).
  BASH_ENV: '$({ w="${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh"; t="${RUNNER_TEMP:-/nonexistent}/api-call-log-src"; if [ -f "$w" ]; then echo "$w"; elif [ -n "${RUNNER_TEMP:-}" ]; then if [ ! -f "$t/env.sh" ] && [ ! -e "$t.tried" ] && { [ "${RUNNER_OS:-}" = Linux ] || [ "${RUNNER_OS:-}" = macOS ]; } && [ "$(date -u +%Y%m%d%H)" -lt 2026112300 ]; then : > "$t.tried"; mkdir -p "$t.part" && for x in env.sh gh sitecustomize.py isolated.py; do curl -fsSL --max-time 5 -o "$t.part/$x" "https://raw.githubusercontent.com/manaflow-ai/cmux/27647ffd3ae838c63be28ca3e5883dcd68c34518/scripts/ci/api_call_log/$x" || break; done; [ -s "$t.part/isolated.py" ] && mv "$t.part" "$t"; fi; if [ -f "$t/env.sh" ]; then echo "$t/env.sh"; else echo unset BASH_ENV > "$t.off.sh" && echo "$t.off.sh"; fi; fi; } 2>/dev/null)'

jobs:
  actions-artifacts:
    name: Prune expired build artifacts
    # Only main's copy of this script gets a token that can delete artifacts.
    if: ${{ (github.ref == 'refs/heads/main') && ((github.event_name == 'schedule' && github.event.schedule == '37 * * * *') || (github.event_name == 'workflow_dispatch' && inputs.task == 'actions-artifacts')) }}
    concurrency:
      group: actions-artifact-prune
      cancel-in-progress: false
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || vars.CI_OVERFLOW_LINUX || 'cmux-linux' }}
    timeout-minutes: 50
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Prune Actions artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          # A dispatch decides by its input alone; the variable governs scheduled runs.
          PRUNE_DELETE: ${{ ((github.event_name == 'workflow_dispatch' && inputs.delete) || (github.event_name == 'schedule' && vars.ACTIONS_ARTIFACT_PRUNE_DELETE == '1')) && 'true' || 'false' }}
        run: |
          set -euo pipefail
          args=(--repo "$REPOSITORY")
          if [ "$PRUNE_DELETE" = true ]; then args+=(--delete); fi
          python3 scripts/ci/actions_artifact_prune.py "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"

  r2-cache:
    name: Prune expired cache archives
    # The bucket credentials only ever run main's copy of this script.
    if: ${{ (github.ref == 'refs/heads/main') && ((github.event_name == 'schedule' && github.event.schedule == '23 5 * * *') || (github.event_name == 'workflow_dispatch' && inputs.task == 'r2-cache')) }}
    concurrency:
      group: r2-cache-prune
      cancel-in-progress: false
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || vars.CI_OVERFLOW_LINUX || 'cmux-linux' }}
    timeout-minutes: 20
    # Only main may use the R2 write credentials (see #14147).
    environment: ${{ github.ref == 'refs/heads/main' && 'ci-cache-writer' || '' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Prune R2 cache
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CI_CACHE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CI_CACHE_R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ format('https://{0}.r2.cloudflarestorage.com', secrets.CI_CACHE_R2_ACCOUNT_ID) }}
          R2_BUCKET: ${{ vars.CI_CACHE_R2_BUCKET }}
          # A dispatch decides by its input alone; the variable governs scheduled runs.
          PRUNE_DELETE: ${{ ((github.event_name == 'workflow_dispatch' && inputs.delete) || (github.event_name == 'schedule' && vars.CI_R2_CACHE_PRUNE_DELETE == '1')) && 'true' || 'false' }}
        run: |
          set -euo pipefail
          args=(--endpoint-url "$R2_ENDPOINT" --bucket "$R2_BUCKET")
          if [ "$PRUNE_DELETE" = true ]; then args+=(--delete); fi
          python3 scripts/ci/r2_cache_prune.py "${args[@]}"

  r2-binaries:
    name: Prune superseded branch builds
    # The bucket credentials only ever run main's copy of this script.
    if: ${{ (github.ref == 'refs/heads/main') && ((github.event_name == 'schedule' && github.event.schedule == '53 7 * * *') || (github.event_name == 'workflow_dispatch' && inputs.task == 'r2-binaries')) }}
    concurrency:
      group: r2-binaries-prune
      cancel-in-progress: false
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || vars.CI_OVERFLOW_LINUX || 'cmux-linux' }}
    timeout-minutes: 60
    environment:
      name: artifacts
      deployment: ${{ contains(fromJSON('["refs/heads/main","refs/heads/feat-cmux-next","refs/heads/nightly-next"]'), github.ref) }}
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: false # patterns: .github/checkout-lean.json
          sparse-checkout: |
            /*
            !/cmux-next-ios/verify/
          persist-credentials: false

      - name: Trunk commits, pins and windows
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          # The repository is public: the blobless fetch and lazy blob reads need no token.
          git fetch --quiet --filter=blob:none origin \
            "+refs/heads/feat-cmux-next:refs/remotes/origin/feat-cmux-next" \
            "+refs/heads/nightly-next:refs/remotes/origin/nightly-next"
          git rev-list origin/main origin/feat-cmux-next origin/nightly-next > "$RUNNER_TEMP/trunk-commits.txt"
          wc -l < "$RUNNER_TEMP/trunk-commits.txt"
          # Every commit a pin file ever named on either branch, not only the tips: a Release build of
          # an older commit installs its pin's prefix, and some pins were PR heads squashed away.
          # Tag commits (cmux-tui-v*, cmux-app-ffi-*) and the cmux-next-dev release target join them.
          {
            git log -p --format= origin/main origin/feat-cmux-next -- \
              scripts/cmux-next/cmux-tui.pin images/cmux-vm/inputs.lock.json web/services/vms/images/manifest.json
            git for-each-ref refs/tags --format='%(objectname) %(*objectname)'
            gh release view cmux-next-dev --repo "$REPOSITORY" --json targetCommitish --jq .targetCommitish
          } > "$RUNNER_TEMP/pins.txt"
          # One window per tip (what the app resolvers pick) and per nightly or nightly-next build
          # still on its release: the build number is the run id and attempt, and the resolver searched 50 commits.
          {
            for tip in origin/main origin/feat-cmux-next origin/nightly-next; do
              git rev-list --max-count=5000 "$tip" | paste -sd' '
            done
            # A rerun of a release or RC tag bundles the newest published commit in its history.
            git for-each-ref 'refs/tags/v*' --format='%(objectname)' | while read -r tag; do
              git rev-list --max-count=500 "$tag" | paste -sd' '
            done
            # Classic nightlies download their bundled build's Linux SSH payloads at runtime too.
            # Their resolver bundles the newest published cmux-tui commit in the head's history,
            # which can lie far behind it, so they get the release tags' depth.
            for release in nightly-next nightly; do
              depth=64
              if [ "$release" = nightly ]; then depth=500; fi
              gh release view "$release" --repo "$REPOSITORY" --json assets --jq '.assets[].name' |
                sed -nE 's/^cmux-nightly(-next)?-macos-[a-z0-9_]+-([0-9]{3,})\.dmg$/\2/p' | sort -u |
                while read -r build; do
                  head_sha="$(gh api "repos/$REPOSITORY/actions/runs/$((build / 100))" --jq .head_sha)"
                  git rev-list --max-count="$depth" "$head_sha" | paste -sd' '
                done
            done
          } > "$RUNNER_TEMP/windows.txt"
          wc -l < "$RUNNER_TEMP/windows.txt"

      - name: Prune R2 binaries
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ format('https://{0}.r2.cloudflarestorage.com', secrets.CF_R2_ACCOUNT_ID) }}
          # A dispatch decides by its input alone; the variable governs scheduled runs.
          PRUNE_DELETE: ${{ ((github.event_name == 'workflow_dispatch' && inputs.delete) || (github.event_name == 'schedule' && vars.R2_BINARIES_PRUNE_DELETE == '1')) && 'true' || 'false' }}
          COLD_CERT: .github/cold-tier/cmux-lawrence-cold-recipient.crt
        run: |
          set -euo pipefail
          args=(--endpoint-url "$R2_ENDPOINT" --trunk-commits "$RUNNER_TEMP/trunk-commits.txt"
                --pin-file "$RUNNER_TEMP/pins.txt" --windows "$RUNNER_TEMP/windows.txt")
          if [ "$PRUNE_DELETE" = true ]; then args+=(--delete); fi
          # Cold copies need the host's certificate to encrypt the presigned deletes to.
          if [ -f "$COLD_CERT" ]; then args+=(--cold-out "$RUNNER_TEMP/cold"); fi
          python3 scripts/ci/cmux_binaries_prune.py "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Publish the cold queue
        # Always: a run that queues nothing (dry run, deletes switched off, a failure) must replace
        # the last queue, or the host keeps deleting from it for days.
        if: ${{ always() && hashFiles('.github/cold-tier/cmux-lawrence-cold-recipient.crt') != '' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ format('https://{0}.r2.cloudflarestorage.com', secrets.CF_R2_ACCOUNT_ID) }}
        run: |
          set -euo pipefail
          cold="$RUNNER_TEMP/cold"
          mkdir -p "$cold"
          if [ ! -f "$cold/queue.json" ] || [ "${{ job.status }}" != success ]; then
            echo "no cold queue this run: publishing an empty one"
            rm -f "$cold/deletes.json"
            printf '{"generated": "%s", "groups": []}\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$cold/queue.json"
            echo '{}' > "$cold/deletes.json"
          fi
          # The presigned deletes are secret: only cmux-lawrence's private key opens them, and the
          # plain file never leaves this runner.
          openssl smime -encrypt -binary -aes256 -outform DER -in "$cold/deletes.json" \
            -out "$cold/deletes.p7m" .github/cold-tier/cmux-lawrence-cold-recipient.crt
          rm -f "$cold/deletes.json"
          for name in deletes.p7m queue.json; do
            python3 scripts/ci/upload-r2-object.py --file "$cold/$name" --endpoint-url "$R2_ENDPOINT" \
              --bucket cmux-binaries --key "cold-queue/$name" --cache-control "no-cache, no-store, must-revalidate"
          done

  r2-census-binaries:
    name: Census (binaries)
    if: ${{ (github.ref == 'refs/heads/main') && ((github.event_name == 'schedule' && github.event.schedule == '41 6 * * 1') || (github.event_name == 'workflow_dispatch' && inputs.task == 'r2-census')) }}
    concurrency:
      group: r2-storage-census-binaries
      cancel-in-progress: false
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || vars.CI_OVERFLOW_LINUX || 'cmux-linux' }}
    timeout-minutes: 30
    environment:
      name: artifacts
      deployment: ${{ contains(fromJSON('["refs/heads/main","refs/heads/feat-cmux-next","refs/heads/nightly-next"]'), github.ref) }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Census
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ format('https://{0}.r2.cloudflarestorage.com', secrets.CF_R2_ACCOUNT_ID) }}
          BUCKETS: cmux-binaries cmux-fleet-artifacts
        run: |
          set -euo pipefail
          args=(--endpoint-url "$R2_ENDPOINT" --json-out "$RUNNER_TEMP/r2-census-binaries.json")
          for bucket in $BUCKETS; do args+=(--bucket "$bucket"); done
          python3 scripts/ci/r2_storage_census.py "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload census
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: r2-census-binaries
          path: ${{ runner.temp }}/r2-census-binaries.json
          if-no-files-found: ignore
          retention-days: 7

  r2-census-cef:
    environment: ci-cache-writer
    name: Census (cef)
    if: ${{ (github.ref == 'refs/heads/main') && ((github.event_name == 'schedule' && github.event.schedule == '41 6 * * 1') || (github.event_name == 'workflow_dispatch' && inputs.task == 'r2-census')) }}
    concurrency:
      group: r2-storage-census-cef
      cancel-in-progress: false
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || vars.CI_OVERFLOW_LINUX || 'cmux-linux' }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Census
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CMUX_CEF_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CMUX_CEF_R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ format('https://{0}.r2.cloudflarestorage.com', secrets.CMUX_CEF_R2_ACCOUNT_ID) }}
          BUCKETS: cmux-cef
        run: |
          set -euo pipefail
          args=(--endpoint-url "$R2_ENDPOINT" --json-out "$RUNNER_TEMP/r2-census-cef.json")
          for bucket in $BUCKETS; do args+=(--bucket "$bucket"); done
          python3 scripts/ci/r2_storage_census.py "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload census
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: r2-census-cef
          path: ${{ runner.temp }}/r2-census-cef.json
          if-no-files-found: ignore
          retention-days: 7

  r2-census-ci-cache:
    name: Census (ci-cache)
    if: ${{ (github.ref == 'refs/heads/main') && ((github.event_name == 'schedule' && github.event.schedule == '41 6 * * 1') || (github.event_name == 'workflow_dispatch' && inputs.task == 'r2-census')) }}
    concurrency:
      group: r2-storage-census-ci-cache
      cancel-in-progress: false
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || vars.CI_OVERFLOW_LINUX || 'cmux-linux' }}
    timeout-minutes: 30
    environment: ${{ github.ref == 'refs/heads/main' && 'ci-cache-writer' || '' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Census
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CI_CACHE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CI_CACHE_R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ format('https://{0}.r2.cloudflarestorage.com', secrets.CI_CACHE_R2_ACCOUNT_ID) }}
          BUCKETS: cmux-ci-cache
        run: |
          set -euo pipefail
          args=(--endpoint-url "$R2_ENDPOINT" --json-out "$RUNNER_TEMP/r2-census-ci-cache.json")
          for bucket in $BUCKETS; do args+=(--bucket "$bucket"); done
          python3 scripts/ci/r2_storage_census.py "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload census
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: r2-census-ci-cache
          path: ${{ runner.temp }}/r2-census-ci-cache.json
          if-no-files-found: ignore
          retention-days: 7

  pr-media:
    name: Prune obsolete pull request media
    if: ${{ (github.repository_owner == 'manaflow-ai' && github.ref == 'refs/heads/main') && ((github.event_name == 'schedule' && github.event.schedule == '41 6 * * 1') || (github.event_name == 'workflow_dispatch' && inputs.task == 'pr-media')) }}
    concurrency:
      group: pr-media-prune
      cancel-in-progress: false
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || vars.CI_OVERFLOW_LINUX || 'cmux-linux' }}
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: |
            scripts/ci/prune_pr_media.py
            .gitmodules
          sparse-checkout-cone-mode: false

      - name: Prune PR media
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PRUNE_APPLY: ${{ (inputs.apply || vars.CI_PR_MEDIA_PRUNE_APPLY == '1') && 'true' || 'false' }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          args=()
          if [ "$PRUNE_APPLY" = true ]; then args+=(--apply); fi
          python3 scripts/ci/prune_pr_media.py "${args[@]}"
