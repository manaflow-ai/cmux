name: webviews sampled nightly

# The nightly tier of the webview tests (cmuxterm-hq docs/design/test-lifecycle.md, scripts/ci/test_lifecycle.py):
# proof tests past their review-by date and proofs demoted to tier=sampled run here once a night instead of on
# every push. Leo, 2026-11-22: "we need to get rid of the notion that we run tests indefinitely after they get
# created. full stop." GitHub runs schedules only from the default branch, so the test-lifecycle sweep timer
# (leo-workspace tools/test_lifecycle_sweep.py) dispatches this file on feat-cmux-next every night. A red here
# gates nothing: the sweep reads the verdicts and promotes a proof that caught a regression to guard by PR.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: webviews-sampled-nightly
  cancel-in-progress: false

jobs:
  sampled:
    name: webviews sampled tier
    if: github.repository == 'manaflow-ai/cmux'
    runs-on: ${{ vars.CI_LINUX_GATE_OWNED_RUNNER }}
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
          no-cache: ${{ !startsWith(github.workspace, '/home/runner/work/') }}

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.22.1"

      - name: Install webviews
        run: ./scripts/build-webviews-app.sh --check --skip-typecheck

      - name: Build the web bundles
        run: ./scripts/cmux-next/build-web-bundles.sh --force

      - name: Install headless engines
        working-directory: webviews
        run: ./node_modules/.bin/playwright install --with-deps webkit && "$(git rev-parse --show-toplevel)/scripts/ci/ensure-system-chrome.sh" && "$(git rev-parse --show-toplevel)/scripts/ci/pin-browser-test-font.sh"

      - name: Test the sampled tier
        working-directory: webviews
        env:
          CMUX_WEB_TEST_TIER: nightly
          CMUX_WEB_TEST_RESULTS: ${{ runner.temp }}/sampled-results.json
          CMUX_WEB_TEST_JOBS: "8"
        run: ../scripts/ci/run-webviews-tests.sh

      - name: Upload the verdicts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: webviews-sampled-results
          path: ${{ runner.temp }}/sampled-results.json
          if-no-files-found: ignore
          retention-days: 30
