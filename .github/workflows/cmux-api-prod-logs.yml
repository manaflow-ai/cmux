name: cmux-api production logs

# The implementation lives on feat-cmux-next. GitHub dispatches only a
# workflow the default branch registers, so this inert copy lets lanes run:
#
#   gh workflow run cmux-api-prod-logs.yml -R manaflow-ai/cmux --ref feat-cmux-next
#
# A dispatch runs the file at --ref, so feat-cmux-next's jobs win. The inputs
# repeat feat-cmux-next's names so a dispatch's inputs validate. This copy uses
# no secret, environment or checkout.
on:
  workflow_dispatch:
    inputs:
      account:
        description: "Exact parsed team/account id"
        required: true
      start:
        description: "UTC window start (empty: 30 minutes ago)"
        required: false
        default: ""
      minutes:
        description: "window length in minutes (1-60)"
        required: false
        default: "30"
      needles:
        description: "Required comma-separated search terms"
        required: true
        default: ""

permissions: {}

jobs:
  registration:
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    steps:
      - run: echo "cmux-api production logs is implemented on feat-cmux-next; dispatch it with --ref feat-cmux-next"
