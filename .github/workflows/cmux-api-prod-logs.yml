name: cmux-api production logs

# The implementation lives on feat-cmux-next. GitHub dispatches only a
# workflow the default branch registers, so this inert copy lets lanes run:
#
#   gh workflow run cmux-api-prod-logs.yml -R manaflow-ai/cmux --ref feat-cmux-next
#
# A dispatch runs the file at --ref, so feat-cmux-next's jobs win. The inputs
# repeat feat-cmux-next's names so a dispatch's inputs validate. This copy uses
# no secret, environment or checkout.
on:
  workflow_dispatch:
    inputs:
      account:
        description: "Exact parsed team/account id"
        required: true
      start:
        description: "UTC window start (empty: 30 minutes ago)"
        required: false
        default: ""
      minutes:
        description: "window length in minutes (1-60)"
        required: false
        default: "30"
      needles:
        description: "Required comma-separated search terms"
        required: true
        default: ""

permissions: {}

env:
  # Temporary REST budget attribution: one gh-call line per GitHub API call (scripts/ci/api_call_log/env.sh, fetched at a fixed commit when the checkout has no copy).
  BASH_ENV: '$({ w="${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh"; t="${RUNNER_TEMP:-/nonexistent}/api-call-log-src"; if [ -f "$w" ]; then echo "$w"; elif [ -n "${RUNNER_TEMP:-}" ]; then if [ ! -f "$t/env.sh" ] && [ ! -e "$t.tried" ] && { [ "${RUNNER_OS:-}" = Linux ] || [ "${RUNNER_OS:-}" = macOS ]; } && [ "$(date -u +%Y%m%d%H)" -lt 2026112300 ]; then : > "$t.tried"; mkdir -p "$t.part" && for x in env.sh gh sitecustomize.py isolated.py; do curl -fsSL --max-time 5 -o "$t.part/$x" "https://raw.githubusercontent.com/manaflow-ai/cmux/27647ffd3ae838c63be28ca3e5883dcd68c34518/scripts/ci/api_call_log/$x" || break; done; [ -s "$t.part/isolated.py" ] && mv "$t.part" "$t"; fi; if [ -f "$t/env.sh" ]; then echo "$t/env.sh"; else echo unset BASH_ENV > "$t.off.sh" && echo "$t.off.sh"; fi; fi; } 2>/dev/null)'

jobs:
  registration:
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || 'cmux-linux' }}
    steps:
      - run: echo "cmux-api production logs is implemented on feat-cmux-next; dispatch it with --ref feat-cmux-next"
