name: PR 9789 hosted STOP signal diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signal-diagnostic:
    runs-on: tart-macos-15
    timeout-minutes: 20
    steps:
      - name: Validate Tart runner identity
        run: |
          case "${{ runner.name }}" in tart-cmux-*) ;; *) exit 1 ;; esac
          test -f /etc/cmux-tart-ci
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2
      - name: Prove diagnostic parent
        run: test "$(git rev-parse HEAD^)" = 52a16cd5cfbe57bcf96a5824c85c5d85b900a274
      - name: Run signal diagnostic
        run: swift test --package-path Packages/macOS/CmuxFoundation --filter unpublishedCleanupFreezesRootBeforePublisherSetup
