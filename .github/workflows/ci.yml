name: PR 9789 WarpBuild identity red proof

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  warpbuild-identity-red:
    runs-on: tart-macos-15
    timeout-minutes: 10
    env:
      EXPECTED_SOURCE: 2a6de7a11ea84192bd18fb1ec4ea524829f251f9
    steps:
      - name: Validate Tart runner identity
        run: |
          case "${{ runner.name }}" in tart-cmux-*) ;; *) exit 1 ;; esac
          test -f /etc/cmux-tart-ci
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2
      - name: Prove exact source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_SOURCE"
          git diff --exit-code "$EXPECTED_SOURCE" HEAD -- . ':(exclude).github/workflows/ci.yml'
      - name: Prove the documented provider identity is rejected
        shell: bash
        run: |
          set +e
          tests/test_ci_app_host_runner_identity.sh 2>&1 | tee /tmp/cmux-pr9789-runner-identity-red.log
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -ne 0
          grep -F 'validator rejected a WarpBuild app-host runner' /tmp/cmux-pr9789-runner-identity-red.log
          echo 'RED PROOF ACCEPTED: exact test-only source rejects the documented WarpBuild identity'
          exit 1
