name: PR 9789 WarpBuild identity green proof

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  warpbuild-identity-green:
    runs-on: tart-macos-15
    timeout-minutes: 10
    env:
      EXPECTED_SOURCE: 0af52e6d831b5118b3a08cf6cca359eae5d4717b
    steps:
      - name: Validate Tart runner identity
        run: |
          case "${{ runner.name }}" in tart-cmux-*) ;; *) exit 1 ;; esac
          test -f /etc/cmux-tart-ci
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2
      - name: Prove exact source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_SOURCE"
          git diff --exit-code "$EXPECTED_SOURCE" HEAD -- . ':(exclude).github/workflows/ci.yml'
      - name: Prove the documented provider identity is accepted
        shell: bash
        run: |
          set -euo pipefail
          tests/test_ci_app_host_runner_identity.sh 2>&1 | tee /tmp/cmux-pr9789-runner-identity-green.log
          grep -F 'PASS: app-host isolation requires an ephemeral runner identity' /tmp/cmux-pr9789-runner-identity-green.log
          echo 'GREEN PROOF ACCEPTED: exact fixed source accepts the documented WarpBuild identity'
