name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bounded-recovery-queue:
    runs-on: warp-macos-15-arm64-6x
    timeout-minutes: 20
    env:
      CMUX_CI_XCODE_APP: ${{ vars.CMUX_CI_XCODE_APP_MACOS_15 }}
      CMUX_CI_REQUIRED_MACOS_SDK_MAJOR: "26"
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Select Xcode
        run: ./scripts/select-ci-xcode.sh

      - name: Run bounded recovery queue regression
        run: |
          set -euo pipefail
          test_status=0
          output="$(
            swift test \
              --package-path Packages/macOS/CmuxFoundation \
              --filter SSHForegroundAuthenticationRetryPolicyTests.recoveryQueueDeduplicatesAndCapsPendingGroups \
              2>&1
          )" || test_status=$?
          printf '%s\n' "$output"
          if ! printf '%s\n' "$output" | grep -Eq \
            'Test recoveryQueueDeduplicatesAndCapsPendingGroups\(shellPath:\) with 2 test cases (passed|failed)'; then
            echo "Expected both bounded recovery queue parameter cases to run" >&2
            exit 97
          fi
          exit "$test_status"
