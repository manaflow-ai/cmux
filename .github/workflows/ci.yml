name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recovery-capacity:
    runs-on: warp-macos-15-arm64-6x
    timeout-minutes: 20
    env:
      CMUX_CI_XCODE_APP: ${{ vars.CMUX_CI_XCODE_APP_MACOS_15 }}
      CMUX_CI_REQUIRED_MACOS_SDK_MAJOR: "26"
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Select Xcode
        run: ./scripts/select-ci-xcode.sh
      - name: Run bounded recovery capacity regressions
        run: |
          set -uo pipefail
          retry_status=0
          retry_output="$(swift test --package-path Packages/macOS/CmuxFoundation --filter SSHPTYAttachRetryScriptBuilderTests.retriesLocalRecoveryQueueCapacityBeforeAuthentication 2>&1)" || retry_status=$?
          printf '%s\n' "$retry_output"
          if ! printf '%s\n' "$retry_output" | grep -Eq 'Test retriesLocalRecoveryQueueCapacityBeforeAuthentication\(\) (passed|failed)'; then exit 97; fi
          bound_status=0
          bound_output="$(swift test --package-path Packages/macOS/CmuxFoundation --filter SSHPTYAttachRetryScriptBuilderTests.boundsLocalRecoveryQueueCapacityRetries 2>&1)" || bound_status=$?
          printf '%s\n' "$bound_output"
          if ! printf '%s\n' "$bound_output" | grep -Eq 'Test boundsLocalRecoveryQueueCapacityRetries\(\) (passed|failed)'; then exit 98; fi
          queue_status=0
          queue_output="$(swift test --package-path Packages/macOS/CmuxFoundation --filter SSHForegroundAuthenticationRetryPolicyTests.recoveryQueueDeduplicatesAndCapsPendingGroups 2>&1)" || queue_status=$?
          printf '%s\n' "$queue_output"
          if ! printf '%s\n' "$queue_output" | grep -Eq 'Test recoveryQueueDeduplicatesAndCapsPendingGroups\(shellPath:\) with 2 test cases (passed|failed)'; then exit 99; fi
          printf 'focused-statuses=%s/%s/%s\n' "$retry_status" "$bound_status" "$queue_status"
          if [ "$retry_status" -ne 0 ] || [ "$bound_status" -ne 0 ] || [ "$queue_status" -ne 0 ]; then exit 1; fi
