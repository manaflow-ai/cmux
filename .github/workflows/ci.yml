name: PR 9789 zsh diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zsh-diagnostic:
    runs-on: tart-macos-15
    timeout-minutes: 25
    env:
      CMUX_CI_XCODE_APP: ${{ vars.CMUX_CI_XCODE_APP_MACOS_15 }}
      CMUX_CI_REQUIRED_MACOS_SDK_MAJOR: "26"
      EXPECTED_SOURCE: 48be63042f02a007658185ce65099decad39d91f
    steps:
      - name: Validate Tart runner identity
        run: |
          set -euo pipefail
          case "${{ runner.name }}" in
            tart-cmux-*) ;;
            *) exit 1 ;;
          esac
          test -f /etc/cmux-tart-ci

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2

      - name: Prove diagnostic base
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_SOURCE"

      - name: Select Xcode
        run: ./scripts/select-ci-xcode.sh

      - name: Trace unpublished cleanup
        shell: bash
        run: swift test --package-path Packages/macOS/CmuxFoundation --filter unpublishedCleanupFreezesRootBeforePublisherSetup
