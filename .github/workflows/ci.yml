name: CI

on:
  # Run the router for every pull request. The Linux layer is cheap and the
  # change classifier below keeps unrelated macOS jobs skipped. A workflow-level
  # path filter would let ordinary Swift changes merge with only ci-status from
  # the fallback workflow without validating the app.
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      cache_backend:
        description: Cache store for this run. `default` follows the CI_CACHE_BACKEND repository variable.
        required: false
        default: default
        type: choice
        options:
          - default
          - github
          - warp
          - r2
      release_archs:
        description: Architectures the Release check compiles. `default` follows the CI_RELEASE_BUILD_ARCHS repository variable, which is universal when unset.
        required: false
        default: default
        type: choice
        options:
          - default
          - universal
          - arm64

permissions:
  contents: read

env:
  CI_CACHE_R2_PUBLIC_URL: ${{ vars.CI_CACHE_R2_PUBLIC_URL }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ${{ vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 5
    outputs:
      macos: ${{ steps.detect.outputs.macos }}
      web: ${{ steps.detect.outputs.web }}
      agent_session_web: ${{ steps.detect.outputs.agent_session_web }}
      release_build: ${{ steps.detect.outputs.release_build }}
      linux_guard_tests: ${{ steps.linux_guards.outputs.linux_guard_tests }}
      linux_guard_history: ${{ steps.linux_guards.outputs.linux_guard_history }}
      linux_guard_cli: ${{ steps.linux_guards.outputs.linux_guard_cli }}
      linux_guard_source: ${{ steps.linux_guards.outputs.linux_guard_source }}
      ghosttykit_release: ${{ steps.linux_guards.outputs.ghosttykit_release }}
      full_suite: ${{ steps.suite.outputs.full_suite }}
      compile_admitted: ${{ steps.admitted.outputs.compile_admitted }}
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2

      - name: Detect CI change areas
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          emit_all_areas() {
            {
              echo "macos=true"
              echo "web=true"
              echo "agent_session_web=true"
              echo "release_build=true"
            } >> "$GITHUB_OUTPUT"
          }

          if [ "$EVENT_NAME" = "pull_request" ] || [ "$EVENT_NAME" = "merge_group" ]; then
            # Checkout depth 2 contains the synthetic merge commit and its
            # base parent, even when base/head histories are shallow boundaries.
            # The event's base SHA is where the pull request last synced. Once
            # main moves on it is outside this checkout, and a diff from it
            # would also count everything main gained since. The merge commit's
            # first parent is the base it was actually built on.
            if git rev-parse -q --verify "$MERGE_SHA^2" > /dev/null; then
              BASE_SHA="$(git rev-parse "$MERGE_SHA^1")"
            fi
            # Keep both sides of renames visible to path-based guard routing.
            # A guarded file moved into docs/ must still run its owning checks.
            if ! git diff --no-renames --name-only "$BASE_SHA" "$MERGE_SHA" > /tmp/cmux-ci-changed-files.txt; then
              echo "Could not compute PR diff; running all CI areas." >&2
              emit_all_areas
              exit 0
            fi

            if [ ! -s /tmp/cmux-ci-changed-files.txt ]; then
              echo "PR diff is empty; running all CI areas."
              emit_all_areas
              exit 0
            fi

            # A provenance-only PR gets the cheap Linux guard and avoids
            # queuing the unrelated macOS/web/Go suites. Keep this exception
            # narrow: an unrelated workflow edit or source/configuration file
            # opts back into normal routing below. The workflow edit is allowed
            # only when this PR also contains one of the explicit provenance
            # inputs, so this guard's own wiring does not queue unrelated app
            # suites.
            ghosttykit_guard_only=true
            has_ghosttykit_guard_file=false
            ci_router_changed=false
            ci_workflow_changed=false
            while IFS= read -r changed_file; do
              case "$changed_file" in
                ghostty|scripts/download-prebuilt-ghosttykit.sh|scripts/validate-xcframework-archive.py|scripts/ghosttykit-checksums.txt|tests/test_ci_ghosttykit_release_check.sh)
                  has_ghosttykit_guard_file=true
                  ;;
                tests/test_ci_change_areas.py)
                  ci_router_changed=true
                  ;;
                .github/workflows/ci.yml)
                  ci_workflow_changed=true
                  ;;
                scripts/ci/*)
                  ci_router_changed=true
                  ghosttykit_guard_only=false
                  ;;
                *)
                  ghosttykit_guard_only=false
                  ;;
              esac
            done < /tmp/cmux-ci-changed-files.txt
            if [ "$ghosttykit_guard_only" = true ] && [ "$has_ghosttykit_guard_file" = true ]; then
              echo "GhosttyKit provenance-only PR; running the release guard."
              {
                echo "macos=false"
                echo "web=false"
                echo "agent_session_web=false"
                echo "release_build=false"
              } >> "$GITHUB_OUTPUT"
              exit 0
            fi

            # This guard lives in workflow YAML, before the PR-editable detector
            # runs. Router/workflow edits must fail open even if a PR breaks the
            # detector's own self-change classification.
            if [ "$ci_router_changed" = true ]; then
              echo "CI router changed; running all CI areas."
              emit_all_areas
              exit 0
            fi

            # The detector is unchanged here, so it may judge a ci.yml edit: only
            # an edit confined to Linux jobs skips macOS, and anything it cannot
            # read runs every area.
            workflow_base_args=()
            if [ "$ci_workflow_changed" = true ]; then
              if ! git show "$BASE_SHA:.github/workflows/ci.yml" > /tmp/cmux-ci-base-workflow.yml; then
                echo "Could not read the base ci.yml; running all CI areas." >&2
                emit_all_areas
                exit 0
              fi
              workflow_base_args=(--ci-workflow-base /tmp/cmux-ci-base-workflow.yml)
            fi

            python3 scripts/ci/detect_ci_change_areas.py \
              --event-name "$EVENT_NAME" \
              --files-from /tmp/cmux-ci-changed-files.txt \
              ${workflow_base_args[@]+"${workflow_base_args[@]}"}
            exit 0
          fi

          python3 scripts/ci/detect_ci_change_areas.py \
            --event-name "$EVENT_NAME" \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA"

      # Compile admission runs on every routed push. The rest of the macOS suite
      # runs on merge groups and dispatches always, and on pull requests unless
      # the repository variable CI_PULL_REQUEST_SUITE is "compile-only". Under
      # that policy the "full-ci" label opts one pull request back in. Labels are
      # read live so a re-run sees a label added after the push.
      - name: Choose the macOS suite for this run
        id: suite
        env:
          EVENT_NAME: ${{ github.event_name }}
          PULL_REQUEST_POLICY: ${{ vars.CI_PULL_REQUEST_SUITE }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          args=(--event-name "$EVENT_NAME" --pull-request-policy "$PULL_REQUEST_POLICY" --github-output "$GITHUB_OUTPUT")
          labels="$RUNNER_TEMP/pull-request-labels.txt"
          if [ -n "$PULL_REQUEST_NUMBER" ] && gh api "repos/$GITHUB_REPOSITORY/issues/$PULL_REQUEST_NUMBER/labels" --paginate --jq '.[].name' > "$labels"; then
            args+=(--labels-file "$labels")
          fi
          python3 scripts/ci/choose_ci_suite.py "${args[@]}"

      - name: Route Linux guard suites
        id: linux_guards
        env:
          EVENT_NAME: ${{ github.event_name }}
          MACOS: ${{ steps.detect.outputs.macos }}
        run: |
          set -euo pipefail
          # A candidate router cannot skip its own tests. Keep this decision
          # in the workflow, outside the PR-editable helper.
          if [ -f /tmp/cmux-ci-changed-files.txt ]; then
            while IFS= read -r path; do
              case "$path" in
                .github/workflows/ci.yml|scripts/ci/*|tests/test_ci_change_areas.py|tests/test_ci_linux_guard_routing.py)
                  for route in linux_guard_tests linux_guard_history linux_guard_cli linux_guard_source ghosttykit_release; do
                    echo "$route=true" >> "$GITHUB_OUTPUT"
                  done
                  exit 0
                  ;;
              esac
            done < /tmp/cmux-ci-changed-files.txt
          fi
          python3 scripts/ci/detect_linux_guard_changes.py \
            --event-name "$EVENT_NAME" --macos "$MACOS" \
            --files-from /tmp/cmux-ci-changed-files.txt >> "$GITHUB_OUTPUT"

      # A push that changes nothing the Xcode build reads (a guard test, another
      # workflow, docs, a merge of main that only moved web) has nothing new to
      # compile. Each pull request run publishes its build-input fingerprint as
      # an artifact name, and a compile-only run whose fingerprint an earlier run
      # of the same in-org branch already compiled skips compile admission. Runs
      # with the full suite always compile, because the shards need the product.
      # The artifact name carries the run attempt, so a pass only vouches for the
      # fingerprint published in its own attempt. These steps are an optimization:
      # any of them failing leaves compile_admitted unset, which compiles.
      - name: Fingerprint the build inputs
        id: inputs
        continue-on-error: true
        if: ${{ github.event_name == 'pull_request' && steps.detect.outputs.macos == 'true' }}
        env:
          XCODE_APP: ${{ vars.CMUX_CI_XCODE_APP_MACOS_15 }}
        run: |
          set -euo pipefail
          fingerprint="$(python3 scripts/ci/build_input_fingerprint.py --extra "xcode=$XCODE_APP")"
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
          echo "$fingerprint" > "$RUNNER_TEMP/build-inputs.txt"

      - name: Publish the build-input fingerprint
        continue-on-error: true
        if: ${{ steps.inputs.outputs.fingerprint != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-inputs-${{ steps.inputs.outputs.fingerprint }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/build-inputs.txt
          retention-days: 7
          overwrite: true

      - name: Look for an earlier run that compiled these inputs
        id: admitted
        continue-on-error: true
        if: ${{ steps.inputs.outputs.fingerprint != '' && steps.suite.outputs.full_suite == 'false' }}
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.head_ref }}
          FINGERPRINT: ${{ steps.inputs.outputs.fingerprint }}
        run: |
          set -euo pipefail
          python3 scripts/ci/find_admitted_build.py --repository "$GITHUB_REPOSITORY" --branch "$BRANCH" \
            --fingerprint "$FINGERPRINT" --current-run-id "$GITHUB_RUN_ID" --github-output "$GITHUB_OUTPUT"

  static-preflight:
    name: Fast static checks
    # No package installs, submodules or app build: reject malformed inputs
    # before starting the longer guard, web and macOS stages.
    runs-on: ${{ vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Validate XCStrings catalog structure
        run: python3 scripts/lint-xcstrings.py

      - name: Validate macOS localization parity
        run: python3 scripts/localization_catalog.py check

      - name: Validate pbxproj syntax, objectVersion pin and normalization
        run: |
          python3 tests/test_normalize_pbxproj.py
          ./scripts/check-pbxproj.sh

      - name: Validate Claude launch environment policy generation
        run: python3 scripts/generate-claude-launch-environment-policy.py --check

      - name: Validate pbxproj test-wiring lint
        run: ./tests/test_ci_pbxproj_test_wiring.sh

      - name: Validate workspace SPM package grouping
        run: python3 scripts/check-workspace-package-groups.py --check

      - name: Validate feature flags (naming, owners, expiry, single use, no reuse)
        run: python3 scripts/lint-feature-flags.py

  workflow-guard-tests:
    needs: [changes, static-preflight]
    if: ${{ needs.changes.outputs.linux_guard_tests == 'true' }}
    runs-on: ${{ vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    # This job executes scripts from the pull request. It needs only read
    # access for checkout, never workflow, issue, or repository write access.
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Validate macOS runner guards
        run: ./tests/test_ci_self_hosted_guard.sh

      - name: Validate tagged reload works without the shared dev backend
        run: ./tests/test_reload_local_backend_mode.sh

      - name: Validate release SDK build lane
        run: ./tests/test_ci_release_sdk_lane.sh

      - name: Validate docs deployment authentication guard
        run: python3 tests/test_docs_deploy_auth_guard.py

      - name: Validate reload shared DerivedData default
        run: ./tests/test_reload_shared_derived_data.sh

      - name: Validate sidebar extension point generation
        run: python3 tests/test_write_sidebar_extension_point.py

      - name: Validate Localizable.xcstrings catalog structure
        run: python3 tests/test_localizable_xcstrings_structure.py

      - name: Validate Python test harness syntax
        run: git ls-files 'tests/*.py' 'tests_v2/*.py' 'scripts/*.py' | xargs python3 -m py_compile

      - name: Test macOS localization catalog tooling
        run: |
          python3 tests/test_localization_catalog.py
          python3 tests/test_localize_changes.py

      - name: Validate cmux-cloud-vm skill covers the vm CLI
        run: python3 tests/test_cloud_vm_skill_coverage.py

      - name: Test XCStrings catalog lint
        run: python3 tests/test_lint_xcstrings.py

      - name: Validate TUI npm package artifact transfer
        run: python3 tests/test_tui_npm_package_artifact.py

      - name: Validate TUI package artifact contract
        run: python3 tests/test_tui_package_contract.py

      - name: Set up Bun for Claude launch environment policy test
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.6"

      - name: Validate Claude launch environment policy behavior
        working-directory: agent-chat
        run: bun test/claude-environment.test.ts

      # The committed control-plane wire types (Swift + TS) must be exactly
      # what quicktype regenerates from schemas/control-plane/; fails on any
      # hand edit or schema change without regen. Needs bun (bunx quicktype),
      # set up above.
      - name: Validate control-plane generated types
        run: ./scripts/check-control-plane-types.sh

      - name: Set up Python 3.9 for nightly prune compatibility
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.9"

      - name: Install workflow guard Python dependencies
        run: python3 -m pip install --disable-pip-version-check --no-input PyYAML==6.0.3 bashlex==0.18

      - name: Validate Blacksmith Testbox broker trust boundary
        run: python3 tests/test_ci_testbox_broker_guard.py

      - name: Validate local hook trust boundary
        run: python3 tests/test_preflight_trust.py

      - name: Validate required checks report for the merge queue
        run: python3 tests/test_ci_merge_queue_required_checks.py

      - name: Validate package test selection
        run: python3 tests/test_ci_select_package_tests.py

      - name: Validate shallow complexity comparison fetching
        run: python3 tests/test_ci_fetch_complexity_base.py

      - name: Validate Ghostty helper cache failure handling
        run: bash tests/test_ghostty_cli_helper_cache.sh

      - name: Validate stale run cleanup eligibility
        run: python3 tests/test_cleanup_stale_runs.py

      - name: Validate the trusted web complexity workflow
        run: python3 tests/test_web_complexity_trusted_workflow.py

      - name: Validate pull request caches are read-only
        run: python3 tests/test_ci_pull_request_caches_are_read_only.py

      - name: Validate Release check architectures
        run: ./tests/test_ci_release_build_archs.sh

      - name: Validate the R2 cache store script
        run: bash tests/test_ci_r2_cache.sh

      - name: Validate nightly prune Python compatibility
        run: PYTHON_BIN=python3.9 bash ./tests/test_ci_nightly_prune_python_compat.sh

      - name: Validate activation benchmark scrollback sizing
        run: python3 tests/test_perf_activation_scrollback_sizing.py

      - name: Validate create-dmg version pinning
        run: ./tests/test_ci_create_dmg_pinned.sh

      - name: Validate app bundle license compliance
        run: ./tests/test_app_bundle_license_compliance.sh

      - name: Validate unit-test SwiftPM retry guard
        run: ./tests/test_ci_unit_test_spm_retry.sh

      - name: Validate checkout failure network diagnostics
        run: python3 tests/test_ci_checkout_network_diagnostics.py

      - name: Validate Swift Testing suite timeout guard
        run: python3 tests/test_swift_testing_suite_timeout.py

      - name: Validate xcodebuild noninteractive crash prompt guard
        run: python3 tests/test_ci_xcodebuild_noninteractive_helper.py

      - name: Validate xcodebuild failure diagnostics
        run: ./tests/test_ci_xcodebuild_with_diagnostics.sh

      - name: Validate focused test launcher
        run: python3 tests/test_run_e2e.py

      - name: Validate app-host xcodebuild retry guard
        run: ./tests/test_ci_app_host_xcodebuild_retry.sh

      - name: Validate app-host xcodebuild attempt budget
        run: ./tests/test_ci_app_host_xcodebuild_attempts.sh

      - name: Validate notification semantics gates
        run: python3 tests/test_ci_notification_semantics.py

      - name: Validate app-host test failure classification
        run: python3 tests/test_ci_app_host_test_output.py

      - name: Validate app-host failure census
        run: python3 tests/test_ci_app_host_failure_census.py

      - name: Validate app-host user configuration isolation
        run: python3 tests/test_ci_app_host_home_isolation.py

      - name: Validate app-host identity and cleanup confirmation
        run: bash tests/test_ci_app_host_identity.sh

      - name: Validate app-host process receipts
        run: bash tests/test_ci_app_host_processes.sh

      - name: Validate isolated app-host home cleanup
        run: bash tests/test_ci_app_host_home_cleanup.sh

      - name: Validate Xcode SourcePackages cache sanitizer
        run: python3 tests/test_ci_sanitize_xcode_source_packages_cache.py

      - name: Validate local build cache preflight
        run: |
          python3 tests/test_local_build_cache_preflight.py
          python3 tests/test_local_build_cache_policy.py

      - name: Validate Xcode compilation cache pruning
        run: python3 tests/test_ci_prune_xcode_compilation_cache.py

      - name: Validate TestFlight notes generator
        run: python3 tests/test_ios_testflight_notes.py

      - name: Validate CMUX INTERNAL main-push path filter
        run: python3 tests/test_ios_testflight_main_push_filter.py

      - name: Validate external TestFlight group assignment helper
        run: python3 tests/test_ios_testflight_external_distribution.py

      - name: Validate Pro TestFlight distribution workflow
        run: python3 tests/test_ios_testflight_pro_distribution.py

      - name: Validate iOS App Store lane identity
        run: python3 tests/test_ios_appstore_lane_identity.py

      - name: Validate cmux scheme test configuration
        run: ./tests/test_ci_scheme_testaction_debug.sh

      - name: Validate selected iOS test execution guard
        run: python3 tests/test_ios_selected_test_execution.py

      - name: Validate cmuxTests sharding
        run: |
          python3 scripts/ci/cmux_unit_test_shard.py --validate
          python3 tests/test_ci_cmux_unit_test_shard.py

      - name: Validate GhosttyKit checksum verification
        run: ./tests/test_ci_ghosttykit_checksum_verification.sh

      - name: Validate stalled GhosttyKit downloads resume
        run: ./tests/test_ci_ghosttykit_download_stall.sh

      - name: Validate GhosttyKit release check behavior
        run: ./tests/test_ci_ghosttykit_release_check.sh

      - name: Validate Zig install without sudo
        run: ./tests/test_install_zig_ci_no_sudo.sh

      - name: Validate Zig download resume and mirror isolation
        run: ./tests/test_install_zig_ci_download_resume.sh

      - name: Initialize Ghostty for Zig version guard
        run: git submodule update --init --depth 1 ghostty

      - name: Validate Ghostty Zig version synchronization
        run: ./tests/test_ghostty_zig_version_sync.sh

      - name: Validate bundled-resource incremental outputs
        run: ./tests/test_build_app_bundled_resources.sh

      - name: Validate virtual display lock
        run: ./tests/test_ci_virtual_display_lock.sh

      - name: Validate nightly tag push auth
        run: ./tests/test_ci_nightly_tag_push_auth.sh

      - name: Validate nightly Xcode selection
        run: ./tests/test_ci_nightly_xcode_selection.sh

      - name: Validate CI Xcode selection fast path
        run: ./tests/test_ci_xcode_selection_fast_path.sh

      - name: Validate resumable GitHub release publication
        run: python3 tests/test_github_release_publication.py

      - name: Validate universal nightly workflow
        run: bash ./tests/test_nightly_universal_build.sh

      - name: Validate test compilation cache seeding
        run: bash ./tests/test_ci_test_compilation_cache_seed.sh

      - name: Validate cmux-tui client installation
        run: bash ./tests/test_install_cmux_tui_client.sh

      - name: Validate nightly notarization behavior
        run: ./tests/test_notarize_nightly_dmg.sh

      - name: Validate Sparkle delta finalization
        run: ./tests/test_finalize_sparkle_deltas.sh

      - name: Validate previous nightly build fetch
        run: ./tests/test_fetch_previous_nightly_dmgs.sh

      - name: Validate Computer Use helper notarization behavior
        run: ./tests/test_notarize_computer_use_helper.sh

      - name: Validate release asset guard
        run: node scripts/release_asset_guard.test.js

      - name: Validate CI change area filter
        run: |
          python3 tests/test_ci_change_areas.py
          python3 tests/test_ci_linux_guard_routing.py
          python3 tests/test_app_host_test_products.py
          python3 tests/test_reuse_app_host_products.py
          python3 tests/test_reuse_release_product.py
          python3 tests/test_ci_release_product_reuse.py
          python3 tests/test_ci_product_publication.py

      - name: Validate Python R2 appcast upload guard
        run: ./tests/test_ci_r2_upload_python.sh

      - name: Validate release-build timeout guard
        run: ./tests/test_ci_release_build_timeout.sh

      - name: Validate reusable workflow permission grants
        run: python3 tests/test_ci_reusable_workflow_permissions.py

      - name: Validate release does not gate on iOS screenshot capture
        run: ./tests/test_ci_release_ios_screenshots_decoupled.sh

      - name: Validate Sparkle monotonic guard modes
        run: ./tests/test_sparkle_build_monotonic_modes.sh

      - name: Validate release tunnel extension identifiers
        run: ./tests/test_ci_release_tunnel_identifiers.sh

      - name: Validate Sparkle appcast generation without previous archives
        run: ./tests/test_sparkle_generate_appcast_no_deltas.sh

      - name: Validate markdown viewer asset compression
        run: ./tests/test_compress_markdown_viewer_assets.sh

      - name: Validate release bundle stripping
        run: ./tests/test_strip_release_bundle.sh

      - name: Validate current GhosttyKit checksum pin
        run: ./tests/test_ci_ghosttykit_checksum_present.sh

      - name: Validate Swift warning budget guard
        run: ./tests/test_ci_swift_warning_budget.sh

      - name: Validate auxiliary window close shortcut lint
        run: ./tests/test_ci_auxiliary_window_close_shortcuts.sh

      - name: Validate bash shell integration job control
        run: python3 tests/test_bash_integration_no_done_notifications.py

      - name: Validate focused Dock shortcut routing guard
        run: python3 tests/test_dock_shortcut_routing_guard.py

      - name: Validate bash prompt bootstrap composes with user PROMPT_COMMAND (starship)
        run: python3 tests/test_issue_5164_starship_prompt_composition.py

      - name: Validate test determinism gate
        run: |
          python3 scripts/check-test-determinism.py --self-test
          python3 scripts/check-test-determinism.py --strict

  workflow-guard-history:
    needs: [changes, static-preflight]
    if: ${{ needs.changes.outputs.linux_guard_history == 'true' }}
    # The lockfile policy diffs against the merge base, so this is the only
    # guard job that fetches history.
    runs-on: ${{ vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.9
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.9"

      - name: Install workflow guard Python dependencies
        run: python3 -m pip install --disable-pip-version-check --no-input PyYAML==6.0.3 bashlex==0.18

      - name: Validate SwiftPM lockfile policy
        run: |
          python3 tests/test_package_resolved_policy_remote_inputs.py
          python3 tests/test_check_package_resolved_policy.py
          python3 scripts/check-package-resolved-policy.py

  workflow-guard-cli-scripts:
    needs: [changes, static-preflight]
    if: ${{ needs.changes.outputs.linux_guard_cli == 'true' }}
    # Slow guards run beside workflow-guard-tests so they do not extend it.
    runs-on: ${{ vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python 3.9
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.9"

      - name: Install workflow guard Python dependencies
        run: python3 -m pip install --disable-pip-version-check --no-input PyYAML==6.0.3 bashlex==0.18

      - name: Validate cmux-tui client commit resolution
        run: ./tests/test_ci_resolve_cmux_tui_client_commit.sh

      - name: Validate cmux profiling support scripts
        run: ./tests/test_start_cmux_profiling.sh

  workflow-guard-source-lints:
    needs: [changes, static-preflight]
    if: ${{ needs.changes.outputs.linux_guard_source == 'true' }}
    # Slow guards run beside workflow-guard-tests so they do not extend it.
    runs-on: ${{ vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python 3.9
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.9"

      - name: Install workflow guard Python dependencies
        run: python3 -m pip install --disable-pip-version-check --no-input PyYAML==6.0.3 bashlex==0.18

      - name: Validate sidebar lazy-layout guard
        run: python3 tests/test_ci_sidebar_lazy_layout_guard.py

      - name: Initialize Bonsplit for deferred-work ownership guard
        run: git submodule update --init --depth 1 vendor/bonsplit

      - name: Validate stored DispatchWorkItem ownership
        run: |
          python3 tests/test_lint_stored_dispatch_work_items.py
          python3 scripts/lint-stored-dispatch-work-items.py

  ghosttykit-release-check:
    needs: [changes, static-preflight]
    if: ${{ needs.changes.outputs.ghosttykit_release == 'true' }}
    name: GhosttyKit release check
    permissions:
      contents: read
    # Check the pinned framework before using a Mac, and on provenance changes.
    runs-on: ${{ vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Read pinned Ghostty SHA
        run: |
          set -euo pipefail
          GHOSTTY_SHA="$(git ls-tree HEAD ghostty | awk '$4 == "ghostty" { print $3; exit }')"
          test -n "$GHOSTTY_SHA"
          echo "Pinned Ghostty SHA: $GHOSTTY_SHA"
          echo "GHOSTTY_SHA=$GHOSTTY_SHA" >> "$GITHUB_ENV"

      - name: Verify published GhosttyKit release and checksum
        env:
          # A missing GitHub release should fail quickly rather than spending
          # the helper's nightly retry budget on a known 404.
          GHOSTTYKIT_DOWNLOAD_RETRIES: "0"
          GHOSTTYKIT_DOWNLOAD_RETRY_DELAY: "1"
        run: ./scripts/download-prebuilt-ghosttykit.sh --verify-only

  web-typecheck:
    needs: [changes, static-preflight]
    if: ${{ needs.changes.outputs.web == 'true' }}
    runs-on: ${{ vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate managed relay catalog
        run: bun tools/generate-managed-iroh-relay-catalog.ts --check

      - name: Typecheck
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/web-typecheck.log"
          set +e
          bun run typecheck 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          set -e

          # The native TypeScript preview compiler can abort on a healthy
          # runner. Retry that transient compiler crash once, while keeping
          # real type errors as immediate failures.
          if [ "$status" -ne 0 ] \
            && grep -Fq 'Aborted (core dumped)' "$log"; then
            echo "::warning::native tsgo aborted during web typecheck; retrying once"
            bun run typecheck
            exit $?
          fi

          exit "$status"

      - name: Web tests
        run: bun run test

      - name: Install browser for instant navigation tests
        run: bunx playwright install --with-deps chromium

      - name: Instant navigation tests
        env:
          # The preceding Typecheck step owns the repository-wide tsgo gate;
          # avoid launching a second tsgo process inside Playwright's server
          # command on constrained Linux runners.
          CMUX_INSTANT_SKIP_TYPECHECK: "1"
        run: bun run test:instant

  # Checks for in-app React webviews (currently the diff viewer; more cmux React
  # surfaces will live alongside it).
  react-apps-check:
    needs: [changes, static-preflight]
    if: ${{ needs.changes.outputs.web == 'true' }}
    runs-on: ${{ vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Verify generated webviews assets
        run: ./scripts/build-webviews-app.sh --check

      - name: Verify React Compiler for webviews
        run: ./scripts/check-webviews-react-compiler.mjs

      - name: Typecheck webviews
        working-directory: webviews
        run: bun run typecheck

      - name: Test webviews
        working-directory: webviews
        run: bun run test

      - name: Oxlint webviews
        working-directory: webviews
        run: bun run lint:ci

      - name: React Doctor
        working-directory: webviews
        run: bun run react-doctor:ci

  diff-sidecar-check:
    needs: [changes, static-preflight]
    # Generated protocol and streaming benchmarks also cover webview-only diffs.
    if: ${{ needs.changes.outputs.macos == 'true' || needs.changes.outputs.web == 'true' }}
    runs-on: ${{ vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust
        run: ./scripts/install-rust-ci.sh

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install webview dependencies
        working-directory: webviews
        run: bun install --frozen-lockfile

      - name: Check Rust sidecar
        run: |
          ./scripts/run-diff-sidecar-cargo.sh fmt --manifest-path Native/DiffSidecar/Cargo.toml --all --check
          ./scripts/run-diff-sidecar-cargo.sh clippy --manifest-path Native/DiffSidecar/Cargo.toml --all-targets --locked --no-default-features -- -D warnings
          ./scripts/run-diff-sidecar-cargo.sh clippy --manifest-path Native/DiffSidecar/Cargo.toml --all-targets --all-features --locked -- -D warnings
          ./scripts/run-diff-sidecar-cargo.sh test --manifest-path Native/DiffSidecar/Cargo.toml --all-targets --locked --no-default-features
          ./scripts/run-diff-sidecar-cargo.sh test --manifest-path Native/DiffSidecar/Cargo.toml --all-targets --all-features --locked

      - name: Verify generated protocol types
        run: ./scripts/generate-diff-sidecar-types.sh --check

      - name: Enforce diff-viewer performance budgets
        env:
          CMUX_DIFF_WEB_BENCH_ITERATIONS: "10"
        run: ./scripts/benchmark-diff-viewer.sh

  web-db-migrations:
    needs: [changes, static-preflight]
    if: ${{ needs.changes.outputs.web == 'true' }}
    runs-on: ${{ vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    defaults:
      run:
        working-directory: web
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cmux_test
          POSTGRES_PASSWORD: cmux
          POSTGRES_USER: cmux
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cmux -d cmux_test"
          --health-interval 1s
          --health-timeout 5s
          --health-retries 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply migrations
        env:
          DATABASE_URL: postgres://cmux:cmux@localhost:5432/cmux_test
          DIRECT_DATABASE_URL: postgres://cmux:cmux@localhost:5432/cmux_test
        run: bunx drizzle-kit migrate --config drizzle.config.ts

      - name: Re-apply migrations
        env:
          DATABASE_URL: postgres://cmux:cmux@localhost:5432/cmux_test
          DIRECT_DATABASE_URL: postgres://cmux:cmux@localhost:5432/cmux_test
        run: bunx drizzle-kit migrate --config drizzle.config.ts

      - name: Database behavior tests
        env:
          CMUX_DB_TEST: "1"
          DATABASE_URL: postgres://cmux:cmux@localhost:5432/cmux_test
          DIRECT_DATABASE_URL: postgres://cmux:cmux@localhost:5432/cmux_test
        run: bun run test:db:behavior

  app-host-unit-tests:
    permissions:
      contents: read
      actions: read
    needs:
      - changes
      - linux-preflight
      - macos-compile-admission
    # !cancelled() disables the implicit success() gate, which GitHub evaluates
    # over the transitive needs chain: linux-preflight runs behind routed linux
    # jobs that legitimately skip (web/go/agent-session paths), and that
    # transitive skip otherwise marks every macOS job skipped even when
    # linux-preflight itself succeeds. Require the direct needs explicitly.
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.linux-preflight.result == 'success' && needs.macos-compile-admission.result == 'success' && needs.changes.outputs.macos == 'true' && needs.changes.outputs.full_suite == 'true' }}
    name: app-host unit tests (${{ matrix.shard }}/6)
    # App-host XCTest needs a runner that can broker testmanagerd control
    # sessions, so route through the shared MACOS_RUNNER_15 var like the other
    # macOS jobs. The fallback is what fork pull requests get, because
    # repository variables are not exposed to them, so it names the same
    # Blacksmith pool main uses and never the paid overflow provider.
    runs-on: ${{ vars.MACOS_RUNNER_15 || 'blacksmith-6vcpu-macos-15' }}
    timeout-minutes: 75
    strategy:
      # A pull request wants every shard's failures in one run. A merge group
      # only needs a verdict, and the first failure already is one.
      fail-fast: ${{ github.event_name == 'merge_group' }}
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    env:
      # This independent job-level marker makes every app-host wrapper fail
      # closed if a setup step or environment handoff loses either redirect.
      CMUX_CI_APP_HOST_ISOLATION_REQUIRED: "1"
      CMUX_APP_HOST_SHARD: ${{ matrix.shard }}
      CMUX_CI_XCODE_APP: ${{ vars.CMUX_CI_XCODE_APP_MACOS_15 }}
      CMUX_CI_REQUIRED_MACOS_SDK_MAJOR: "26"
      CMUX_SKIP_ZIG_BUILD: "1"
      # Strict steps run outside the batch, in four groups on four workers.
      # CMUX_APP_HOST_RESERVED_WALL_SECONDS is each group's measured wall time,
      # so the batch gives those workers less and every shard ends together.
      # Update both when a group moves or grows.
      CMUX_APP_HOST_GLOBAL_SEARCH_SHARD: "1"
      CMUX_APP_HOST_CLI_REGRESSION_SHARD: "4"
      CMUX_APP_HOST_FOCUSED_REGRESSION_B_SHARD: "5"
      CMUX_APP_HOST_FOCUSED_REGRESSION_SHARD: "6"
      CMUX_APP_HOST_RESERVED_WALL_SECONDS: "1=474 4=235 5=245 6=284"
      # Four-way packing now exceeds the app-host's memory budget as the suite
      # grows: a shard can crash around 1,000 UI tests and poison the remaining
      # selectors. Six-way packing keeps each broad shard near 13 minutes of
      # measured work; allow focused gates and one app-host restart headroom.
      CMUX_UNIT_TEST_TIMEOUT_SECONDS: "1800"
      # The broad shard can spend several minutes in XCTest's post-suite
      # teardown while native UI processes drain. Allow that quiet period
      # within the job's 75-minute cap instead of restarting a healthy batch.
      CMUX_XCODEBUILD_NONINTERACTIVE_IDLE_TIMEOUT_SECONDS: "1200"
      # XCTest app-host crashes can leave xcodebuild waiting in Swift's crash
      # backtracer until the job timeout. Keep crash handling non-interactive
      # and cheap so xcodebuild can restart/finish the suite.
      SWIFT_BACKTRACE: "interactive=no,timeout=0s,symbolicate=off,color=no"
      CMUX_XCODEBUILD_NONINTERACTIVE_POST_TEST_TIMEOUT_SECONDS: "45"
    steps:
      - name: Clear stale git locks (self-hosted reused workspace)
        shell: bash
        run: |
          # Self-hosted macOS runners reuse the workspace. A job cancelled or
          # killed mid-checkout can leave a stale .git/modules/*/index.lock that
          # fails every later submodule checkout (e.g. ghostty). Clear them first.
          ws="${GITHUB_WORKSPACE:-$PWD}"
          rm -f "$ws/.git/index.lock" 2>/dev/null || true
          if [ -d "$ws/.git/modules" ]; then
            find "$ws/.git/modules" -type f -name "*.lock" -delete 2>/dev/null || true
          fi

      - name: Checkout
        id: checkout
        continue-on-error: true
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          persist-credentials: false

      # WarpBuild can lose GitHub DNS on an otherwise healthy runner. Retry the
      # checkout once only after that action fails; healthy jobs still perform
      # one checkout, and a second failure remains a hard failure with evidence.
      - name: Retry checkout after transient network failure
        id: checkout-retry
        if: steps.checkout.outcome == 'failure'
        continue-on-error: true
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          persist-credentials: false

      - name: Diagnose checkout network failure
        if: steps.checkout.outcome == 'failure' && steps.checkout-retry.outcome == 'failure'
        timeout-minutes: 1
        run: |
          set -u

          # Keep provider/network evidence in the job log without failing the original
          # operation. These commands are intentionally read-only and emit no tokens.
          echo "== network diagnostics (runner=${RUNNER_NAME:-unknown}) ==" >&2
          if command -v scutil >/dev/null 2>&1; then
            scutil --dns 2>&1 || true
          fi
          if command -v route >/dev/null 2>&1; then
            route -n get default 2>&1 || true
          fi
          if command -v ifconfig >/dev/null 2>&1; then
            ifconfig 2>&1 || true
          fi
          if command -v dscacheutil >/dev/null 2>&1; then
            dscacheutil -q host -a name github.com 2>&1 || true
          fi
          if command -v curl >/dev/null 2>&1; then
            curl --connect-timeout 5 --max-time 10 --silent --show-error --head https://github.com/ 2>&1 || true
          fi
          echo "== end network diagnostics ==" >&2
          exit 1

      - name: Select Xcode
        run: |
          set -euo pipefail
          ./scripts/select-ci-xcode.sh

      - name: Capture Ghostty revision
        id: ghostty-revision
        run: |
          echo "sha=$(git -C ghostty rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache GhosttyKit.xcframework
        id: cache-ghosttykit
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: GhosttyKit.xcframework
          key: ghosttykit-sentry-off-v1-${{ steps.ghostty-revision.outputs.sha }}

      - name: Download pre-built GhosttyKit.xcframework
        if: steps.cache-ghosttykit.outputs.cache-hit != 'true'
        run: |
          ./scripts/download-prebuilt-ghosttykit.sh

      - name: Install Rust
        run: |
          ./scripts/install-rust-ci.sh

      - name: Cache Swift packages
        uses: ./.github/actions/cache-restore
        with:
          backend: ${{ inputs.cache_backend != 'default' && inputs.cache_backend || vars.CI_CACHE_BACKEND }}
          path: .ci-source-packages
          key: spm-${{ hashFiles('cmux.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-

      - name: Sanitize Swift package cache
        run: python3 scripts/ci/sanitize-xcode-source-packages-cache.py .ci-source-packages

      - name: Prepare isolated DerivedData
        run: |
          set -euo pipefail
          DERIVED_DATA_PATH="$RUNNER_TEMP/cmux-derived-data-tests-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-shard-${{ matrix.shard }}"
          rm -rf "$DERIVED_DATA_PATH"
          mkdir -p "$DERIVED_DATA_PATH"
          echo "CMUX_DERIVED_DATA_PATH=$DERIVED_DATA_PATH" >> "$GITHUB_ENV"

      - name: Try shared R2 artifact transport
        id: r2-products
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          CI_ARTIFACT_R2_URL: ${{ vars.CI_ARTIFACT_R2_URL }}
          ARTIFACT_ID: ${{ needs.macos-compile-admission.outputs.artifact_id }}
        run: python3 scripts/ci/restore-r2-artifact.py

      - name: Download compiled app-host test product
        if: steps.r2-products.outputs.hit != 'true'
        uses: ./.github/actions/download-test-product
        with:
          artifact-id: ${{ needs.macos-compile-admission.outputs.artifact_id }}
          path: ${{ runner.temp }}/app-host-products

      - name: Restore compiled app-host test product
        env:
          EXPECTED_SHA256: ${{ needs.macos-compile-admission.outputs.sha256 }}
        run: scripts/ci/restore-app-host-test-product.sh

      - name: Prepare isolated app-host home
        id: prepare-app-host-home
        run: scripts/ci/prepare-app-host-home.sh

      - name: Resolve Swift packages
        run: |
          set -euo pipefail
          SOURCE_PACKAGES_DIR="$PWD/.ci-source-packages"
          mkdir -p "$SOURCE_PACKAGES_DIR"
          resolve_log="$RUNNER_TEMP/cmux-swiftpm-resolve-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-shard-${{ matrix.shard }}.log"

          for attempt in 1 2 3; do
            set +e
            xcodebuild -project cmux.xcodeproj -scheme cmux-unit -configuration Debug \
              -derivedDataPath "$CMUX_DERIVED_DATA_PATH" \
              -clonedSourcePackagesDirPath "$SOURCE_PACKAGES_DIR" \
              -resolvePackageDependencies 2>&1 | tee "$resolve_log"
            resolve_status="${PIPESTATUS[0]}"
            set -e

            if [ "$resolve_status" -eq 0 ]; then
              # Guard against a stale/poisoned Swift-package cache: a restored
              # .ci-source-packages can make resolve report success without the
              # binary artifacts (Sparkle/Sentry) actually present, which then
              # fails the build. Verify they materialized; if not, clear and retry.
              if [ -d "$SOURCE_PACKAGES_DIR/artifacts/sparkle/Sparkle/Sparkle.xcframework" ] && [ -d "$SOURCE_PACKAGES_DIR/artifacts/sentry-cocoa/Sentry/Sentry.xcframework" ]; then
                exit 0
              fi
              echo "Resolve succeeded but binary artifacts are missing (stale cache); clearing and retrying" >&2
              rm -rf "$SOURCE_PACKAGES_DIR"  # whole dir — resolve will not re-materialize artifacts into a partial tree
            fi

            # SwiftPM stores binary download destinations under the runner's
            # global cache even when clonedSourcePackagesDirPath is isolated.
            # A reused runner can leave the Iroh archive destination behind;
            # SwiftPM then reports "already exists in file system" on every
            # retry. Clear both resolver layers only for that cache collision,
            # while preserving other failures for diagnosis.
            if [ "$resolve_status" -ne 0 ] && grep -Fq "already exists in file system" "$resolve_log"; then
              echo "SwiftPM artifact cache collision detected; clearing resolver caches before retry" >&2
              rm -rf "$HOME/Library/Caches/org.swift.swiftpm"
              mkdir -p "$HOME/Library/Caches/org.swift.swiftpm"
              rm -rf "$SOURCE_PACKAGES_DIR"
              mkdir -p "$SOURCE_PACKAGES_DIR"
            fi

            # Keep the existing three-attempt policy, but record resolver
            # state when a package attempt fails so provider incidents are
            # distinguishable from SwiftPM or cache defects.
            scripts/ci/capture-network-diagnostics.sh || true
            if [ "$attempt" -eq 3 ]; then
              echo "Failed to resolve Swift packages after 3 attempts" >&2
              exit 1
            fi
            echo "Package resolution failed on attempt $attempt, retrying..."
            sleep $((attempt * 5))
          done

      - name: Restage package frameworks after resolution
        run: |
          set -euo pipefail
          products="$CMUX_DERIVED_DATA_PATH/Build/Products/Debug"
          if [ -L "$products/PackageFrameworks" ]; then
            rm "$products/PackageFrameworks"
          fi
          mkdir -p "$products/PackageFrameworks"
          framework_source="$(find "$products" -type d -name 'CmuxAgentJournal*_PackageProduct.framework' -print -quit 2>/dev/null || true)"
          test -n "$framework_source"
          rsync -aL "$(dirname "$framework_source")/" "$products/PackageFrameworks/"
          test -f "$products/PackageFrameworks/CmuxAgentJournal_27B6EF8727F6C277_PackageProduct.framework/Versions/A/CmuxAgentJournal_27B6EF8727F6C277_PackageProduct"

      - name: Run Ghostty split-theme appearance regression
        if: ${{ matrix.shard == fromJSON(env.CMUX_APP_HOST_FOCUSED_REGRESSION_SHARD) }}
        run: |
          set -euo pipefail
          DERIVED_DATA_PATH="${RUNNER_TEMP:-/tmp}/cmux-terminal-core-split-theme"
          rm -rf "$DERIVED_DATA_PATH"
          (
            cd Packages/macOS/CmuxTerminalCore
            xcodebuild \
              -scheme CmuxTerminalCore-Package \
              -destination "platform=macOS" \
              -derivedDataPath "$DERIVED_DATA_PATH" \
              build-for-testing
          )
          xcrun xctest "$DERIVED_DATA_PATH/Build/Products/Debug/CmuxTerminalCoreTests.xctest"

      - name: Enable XCTest automation mode
        run: |
          set -euo pipefail
          if ! command -v automationmodetool >/dev/null 2>&1; then
            echo "::warning::automationmodetool is unavailable; XCTest will use its default automation-mode setup"
            exit 0
          fi
          if sudo -n true 2>/dev/null; then
            sudo -n automationmodetool enable-automationmode-without-authentication
          else
            echo "::warning::Passwordless sudo unavailable; XCTest will use its default automation-mode setup"
          fi

      - name: Run main window zoom placement regressions
        if: ${{ matrix.shard == fromJSON(env.CMUX_APP_HOST_FOCUSED_REGRESSION_SHARD) }}
        run: |
          # The bulk app-host classifier tolerates ordinary assertion failures.
          # Window placement regressions must fail the shard directly while
          # reusing the compile-admission product.
          set -euo pipefail
          test_log="$RUNNER_TEMP/cmux-main-window-zoom-placement.txt"
          scripts/ci/run-in-console-session.sh \
            scripts/ci/run-app-host-xcodebuild.sh \
            -xctestrun "$CMUX_APP_HOST_XCTESTRUN" \
            -destination "platform=macOS" \
            -only-testing:cmuxTests/MainWindowZoomPlacementTests \
            CMUX_SKIP_ZIG_BUILD=1 \
