name: PR 9789 acknowledged handoff red proof

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acknowledged-handoff-red:
    runs-on: tart-macos-15
    timeout-minutes: 20
    env:
      EXPECTED_SOURCE: d85922a1df1adccdccfe46e12077b417b6a16f18
    steps:
      - name: Validate Tart runner identity
        run: |
          case "${{ runner.name }}" in tart-cmux-*) ;; *) exit 1 ;; esac
          test -f /etc/cmux-tart-ci
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2
      - name: Prove exact source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_SOURCE"
          git diff --exit-code "$EXPECTED_SOURCE" HEAD -- . ':(exclude).github/workflows/ci.yml'
      - name: Prove the test-only source exposes both reviewed defects
        shell: bash
        run: |
          set +e
          set -uo pipefail
          swift test --package-path Packages/macOS/CmuxFoundation --filter failedOwnershipHandoffUsesBoundedBackgroundOwner 2>&1 | tee /tmp/cmux-pr9789-bounded-red.log
          bounded_status=${PIPESTATUS[0]}
          swift test --package-path Packages/macOS/CmuxFoundation --filter cleanupRetainsAcknowledgedUnpublishedHandoff 2>&1 | tee /tmp/cmux-pr9789-ack-red.log
          ack_status=${PIPESTATUS[0]}
          swift test --package-path Packages/macOS/CmuxFoundation --filter durablePendingHandoffResumesBoundedTreeCleanup 2>&1 | tee /tmp/cmux-pr9789-durable-red.log
          durable_status=${PIPESTATUS[0]}
          set -e
          printf 'red statuses: bounded=%s ack=%s durable=%s\n' "$bounded_status" "$ack_status" "$durable_status"
          test "$bounded_status" -ne 0
          test "$ack_status" -eq 0
          test "$durable_status" -ne 0
          grep -F 'failedOwnershipHandoffUsesBoundedBackgroundOwner() recorded an issue' /tmp/cmux-pr9789-bounded-red.log
          grep -F 'cleanupRetainsAcknowledgedUnpublishedHandoff(shellPath:) with 2 test cases passed' /tmp/cmux-pr9789-ack-red.log
          grep -F 'durablePendingHandoffResumesBoundedTreeCleanup(shellPath:) recorded an issue' /tmp/cmux-pr9789-durable-red.log
          echo 'RED PROOF ACCEPTED: exact test-only source has an unbounded worker and no durable pending recovery'
          exit 1
