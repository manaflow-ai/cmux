name: PR 9789 nested handoff red proof

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nested-handoff-red:
    runs-on: tart-macos-15
    timeout-minutes: 20
    env:
      EXPECTED_SOURCE: dcfc685486fccd513c2fe31a7ea00b81e03cf2f4
    steps:
      - name: Validate Tart runner identity
        run: |
          case "${{ runner.name }}" in tart-cmux-*) ;; *) exit 1 ;; esac
          test -f /etc/cmux-tart-ci
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2
      - name: Prove exact source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_SOURCE"
          git diff --exit-code "$EXPECTED_SOURCE" HEAD -- . ':(exclude).github/workflows/ci.yml'
      - name: Prove nested cleanup loses live handoff state
        shell: bash
        run: |
          set +e
          set -uo pipefail
          swift test --package-path Packages/macOS/CmuxFoundation --filter nestedAuthenticationCleanupRetainsLiveHandoffOwner 2>&1 | tee /tmp/cmux-pr9789-nested-handoff-red.log
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -ne 0
          grep -F 'nestedAuthenticationCleanupRetainsLiveHandoffOwner() recorded an issue' /tmp/cmux-pr9789-nested-handoff-red.log
          echo 'RED PROOF ACCEPTED: exact test-only source loses live handoff state in the nested shell'
          exit 1
