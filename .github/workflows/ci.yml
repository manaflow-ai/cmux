name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  worker-identity:
    runs-on: ${{ vars.MACOS_RUNNER_DUAL_XCODE || 'blacksmith-6vcpu-macos-15' }}
    timeout-minutes: 20
    env:
      CMUX_CI_XCODE_APP: ${{ vars.CMUX_CI_XCODE_APP_MACOS_15 }}
      CMUX_CI_REQUIRED_MACOS_SDK_MAJOR: "26"
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Select Xcode
        run: ./scripts/select-ci-xcode.sh

      - name: Run worker identity regression
        run: |
          set -euo pipefail
          test_status=0
          output="$(
            swift test \
              --package-path Packages/macOS/CmuxFoundation \
              --filter SSHForegroundAuthenticationRetryPolicyTests.workerKillRevalidatesStableIdentity \
              2>&1
          )" || test_status=$?
          printf '%s\n' "$output"
          if ! printf '%s\n' "$output" | grep -Eq \
            'Test run with 2 tests( in [0-9]+ suites?)? (passed|failed)'; then
            echo "Expected exactly two worker identity test cases to run" >&2
            exit 97
          fi
          exit "$test_status"
