name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recovery-capacity:
    runs-on: warp-macos-15-arm64-6x
    timeout-minutes: 20
    env:
      CMUX_CI_XCODE_APP: ${{ vars.CMUX_CI_XCODE_APP_MACOS_15 }}
      CMUX_CI_REQUIRED_MACOS_SDK_MAJOR: "26"
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Select Xcode
        run: ./scripts/select-ci-xcode.sh

      - name: Run recovery capacity regressions
        run: |
          set -uo pipefail
          builder_status=0
          builder_output="$(
            swift test \
              --package-path Packages/macOS/CmuxFoundation \
              --filter SSHPTYAttachRetryScriptBuilderTests.retriesLocalRecoveryQueueCapacityBeforeAuthentication \
              2>&1
          )" || builder_status=$?
          printf '%s\n' "$builder_output"
          if ! printf '%s\n' "$builder_output" | grep -Eq \
            'Test retriesLocalRecoveryQueueCapacityBeforeAuthentication\(\) (passed|failed)'; then
            echo "Expected the authentication capacity retry test to run" >&2
            exit 97
          fi

          queue_status=0
          queue_output="$(
            swift test \
              --package-path Packages/macOS/CmuxFoundation \
              --filter SSHForegroundAuthenticationRetryPolicyTests.recoveryQueueDeduplicatesAndCapsPendingGroups \
              2>&1
          )" || queue_status=$?
          printf '%s\n' "$queue_output"
          if ! printf '%s\n' "$queue_output" | grep -Eq \
            'Test recoveryQueueDeduplicatesAndCapsPendingGroups\(shellPath:\) with 2 test cases (passed|failed)'; then
            echo "Expected both recovery queue capacity parameter cases to run" >&2
            exit 98
          fi

          if [ "$builder_status" -ne 0 ]; then exit "$builder_status"; fi
          exit "$queue_status"
