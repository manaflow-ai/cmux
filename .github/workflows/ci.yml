name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell-parse-diagnostic:
    runs-on: warp-macos-15-arm64-6x
    timeout-minutes: 20
    env:
      CMUX_CI_XCODE_APP: ${{ vars.CMUX_CI_XCODE_APP_MACOS_15 }}
      CMUX_CI_REQUIRED_MACOS_SDK_MAJOR: "26"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - run: ./scripts/select-ci-xcode.sh
      - run: swift test --package-path Packages/macOS/CmuxFoundation --filter SSHForegroundAuthenticationRetryPolicyTests.recoveryQueueDeduplicatesAndCapsPendingGroups
