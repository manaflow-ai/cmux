name: PR 9789 nested handoff green proof

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nested-handoff-green:
    runs-on: tart-macos-15
    timeout-minutes: 20
    env:
      EXPECTED_SOURCE: 07dd8131b0b5dcf64c5f743f527780df42358ed5
    steps:
      - name: Validate Tart runner identity
        run: |
          case "${{ runner.name }}" in tart-cmux-*) ;; *) exit 1 ;; esac
          test -f /etc/cmux-tart-ci
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2
      - name: Prove exact source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_SOURCE"
          git diff --exit-code "$EXPECTED_SOURCE" HEAD -- . ':(exclude).github/workflows/ci.yml'
      - name: Prove nested cleanup retains live handoff state
        shell: bash
        run: |
          set -euo pipefail
          swift test --package-path Packages/macOS/CmuxFoundation --filter nestedAuthenticationCleanupRetainsLiveHandoffOwner 2>&1 | tee /tmp/cmux-pr9789-nested-handoff-green.log
          grep -F 'nestedAuthenticationCleanupRetainsLiveHandoffOwner() passed' /tmp/cmux-pr9789-nested-handoff-green.log
          echo 'GREEN PROOF ACCEPTED: exact fixed source retains live handoff state in the nested shell'
