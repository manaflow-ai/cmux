name: CI

on:
  # Run the router for every pull request. The Linux layer is cheap and the
  # change classifier below keeps unrelated macOS jobs skipped. A workflow-level
  # path filter would let ordinary Swift changes merge with only ci-status from
  # the fallback workflow without validating the app.
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  merge_group:
  workflow_dispatch:
    inputs:
      cache_backend:
        description: Cache store for this run. `default` follows the CI_CACHE_BACKEND repository variable.
        required: false
        default: default
        type: choice
        options:
          - default
          - github
          - warp
          - r2
      release_archs:
        description: Architectures the Release check compiles. `default` follows the CI_RELEASE_BUILD_ARCHS repository variable, which is universal when unset.
        required: false
        default: default
        type: choice
        options:
          - default
          - universal
          - arm64

permissions:
  contents: read

env:
  # Fork pull requests do not receive repository variables; the public read
  # URL is not a secret, so default it rather than run every fork build cold.
  CI_CACHE_R2_PUBLIC_URL: ${{ vars.CI_CACHE_R2_PUBLIC_URL || 'https://ci-cache.cmux.com' }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A label-only rerun can escalate the same head to full-ci. Let the current
  # compile finish and publish its app-host product so the queued run can reuse
  # it instead of throwing away a long compile and starting from zero.
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action != 'labeled' && github.event.action != 'unlabeled' }}

jobs:
  changes:
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 5
    outputs:
      macos: ${{ steps.detect.outputs.macos }}
      cli: ${{ steps.detect.outputs.cli }}
      claude_wrapper: ${{ steps.standalone.outputs.claude_wrapper }}
      browser: ${{ steps.standalone.outputs.browser }}
      remote_daemon: ${{ steps.standalone.outputs.remote_daemon }}
      remote_daemon_native: ${{ steps.standalone.outputs.remote_daemon_native }}
      # Empty until the base revision of the router knows this area, so the
      # consumers below read a missing value as "not routed".
      swift_packages: ${{ steps.detect.outputs.swift_packages || 'false' }}
      web: ${{ steps.detect.outputs.web }}
      agent_session_web: ${{ steps.detect.outputs.agent_session_web }}
      release_build: ${{ steps.detect.outputs.release_build }}
      linux_guard_tests: ${{ steps.linux_guards.outputs.linux_guard_tests }}
      linux_guard_test_groups: ${{ steps.linux_guards.outputs.linux_guard_test_groups }}
      linux_guard_history: ${{ steps.linux_guards.outputs.linux_guard_history }}
      linux_guard_cli: ${{ steps.linux_guards.outputs.linux_guard_cli }}
      linux_guard_source: ${{ steps.linux_guards.outputs.linux_guard_source }}
      ghosttykit_release: ${{ steps.unchanged_inputs.outputs.compile_admitted == 'true' && 'false' || steps.linux_guards.outputs.ghosttykit_release }}
      full_suite: ${{ steps.suite.outputs.full_suite }}
      # A canary run (choose_ci_suite.py: the consumer canary, or suites only
      # the reverse test impact selector reached) only rides on a compile this
      # run pays for; when either reuse check finds one, it is dropped.
      unit_suite: ${{ steps.suite.outputs.unit_canary == 'true' && (steps.unchanged_inputs.outputs.compile_admitted == 'true' || steps.admitted.outputs.compile_admitted == 'true') && 'false' || steps.suite.outputs.unit_suite }}
      unit_selectors: ${{ !(steps.suite.outputs.unit_canary == 'true' && (steps.unchanged_inputs.outputs.compile_admitted == 'true' || steps.admitted.outputs.compile_admitted == 'true')) && steps.suite.outputs.unit_selectors || '' }}
      unit_strict_steps: ${{ steps.suite.outputs.unit_strict_steps }}
      # Only ever true for a changed-suites run the diff selected, which never
      # takes the canary drop above.
      # A compile admission on an owned Mac never runs app-host suites: glaeda
      # gives it the compile token, not the gui token, so the suites would
      # collide with a GUI shard on the same mini. The changed suites run on
      # the one shard (shard 8) instead, owned or Blacksmith (pr_runner_pool.py).
      unit_in_admission: ${{ steps.macos-pool.outputs.persistent != 'true' && steps.suite.outputs.unit_in_admission || 'false' }}
      coverage_gap: ${{ steps.suite.outputs.coverage_gap }}
      compile_admitted: ${{ steps.unchanged_inputs.outputs.compile_admitted == 'true' && 'true' || steps.admitted.outputs.compile_admitted }}
      source_parent1: ${{ steps.source-identity.outputs.parent1 }}
      # The macOS pool every pull-request macOS job in this run uses, chosen
      # once so a Blacksmith run is never split across pools. On an owned pool
      # only the jobs in macos_pr_owned_jobs take it (see pr_runner_pool.py).
      # Empty keeps each job's own MACOS_RUNNER_PR fallback: every event but a
      # pull request, and any uncertainty.
      macos_pr_runner: ${{ steps.macos-pool.outputs.runner }}
      macos_pr_xcode_app: ${{ steps.macos-pool.outputs.xcode_app }}
      # Set only when the pool is persistent (owned Macs): the Blacksmith pool
      # a re-run of failed jobs takes, since it reuses these outputs and must
      # not queue on the owned pool unwatched.
      macos_pr_retry_runner: ${{ steps.macos-pool.outputs.retry_runner }}
      # Set only for a full suite on a Blacksmith pool: the pool on the same
      # Xcode its app-host shards take when it has more room for them.
      macos_pr_shard_runner: ${{ steps.macos-pool.outputs.shard_runner }}
      # Set only when the pool is persistent: the jobs of attempt 1 that take
      # it (" admission shard-1 ... "); every other job takes the retry runner.
      macos_pr_owned_jobs: ${{ steps.macos-pool.outputs.owned_jobs }}
      # Set only when the pool is persistent: the owned label, which attempt 2
      # of an owned job takes after a refusal (ci-owned-pool-rescue.yml
      # re-runs failed jobs once on the fleet before Blacksmith).
      macos_pr_refused_retry_runner: ${{ steps.macos-pool.outputs.refused_retry_runner }}
      # Set only when the pool is persistent and CI_OWNED_POOL_SLOTS gives it
      # a root count: glaeda-root-<class>-xcode-<version>, the one runner per
      # mini that takes a canonical-root job. The root jobs in
      # macos_pr_owned_jobs (admission, shards, lag, cli-product) take it in
      # place of the pool label, on attempt 1 and after a refusal.
      macos_pr_root_runner: ${{ steps.macos-pool.outputs.root_runner }}
      # Set only beside a root runner, when the pool has machines beyond its
      # root runners: glaeda-side-<class>-xcode-<version>, the minis' other
      # runners. The side lanes in macos_pr_owned_jobs (claude-wrapper,
      # remote-daemon) take it in place of the pool label, so they never hold
      # a root runner.
      macos_pr_side_runner: ${{ steps.macos-pool.outputs.side_runner }}
      # Set only beside a root runner, when an idle one carries the warm label
      # of this run's merge base: ["<root label>", "glaeda-warm-<sha12>"],
      # the labels compile admission's attempt 1 takes instead.
      macos_pr_admission_runner: ${{ steps.macos-pool.outputs.admission_runner }}
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2

      - name: Record GitHub-selected source identity
        id: source-identity
        run: |
          set -u
          parent1=""
          # Only the first parent is used (compile admission's merge-base
          # seed lookup). The other fields just absorb the rest of the line.
          # shellcheck disable=SC2034
          read -r commit parent1 rest <<EOF
          $(git rev-list --parents -n1 HEAD)
          EOF
          echo "parent1=${parent1:-}" >> "$GITHUB_OUTPUT"

      - name: Detect CI change areas
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          emit_all_areas() {
            {
              echo "macos=true"
              echo "web=true"
              echo "agent_session_web=true"
              echo "cli=true"
              echo "swift_packages=true"
              echo "release_build=true"
            } >> "$GITHUB_OUTPUT"
          }

          if [ "$EVENT_NAME" = "pull_request" ] || [ "$EVENT_NAME" = "merge_group" ]; then
            # Checkout depth 2 contains the synthetic merge commit and its
            # base parent, even when base/head histories are shallow boundaries.
            # The event's base SHA is where the pull request last synced. Once
            # main moves on it is outside this checkout, and a diff from it
            # would also count everything main gained since. The merge commit's
            # first parent is the base it was actually built on.
            if git rev-parse -q --verify "$MERGE_SHA^2" > /dev/null; then
              BASE_SHA="$(git rev-parse "$MERGE_SHA^1")"
            fi
            # Keep both sides of renames visible to path-based guard routing.
            # A guarded file moved into docs/ must still run its owning checks.
            rm -f /tmp/cmux-ci-base-workflow.yml
            if ! git diff --no-renames --name-only "$BASE_SHA" "$MERGE_SHA" > /tmp/cmux-ci-changed-files.txt; then
              # Absence means unavailable; an existing empty file means a known empty diff.
              rm -f /tmp/cmux-ci-changed-files.txt
              echo "Could not compute PR diff; running all CI areas." >&2
              emit_all_areas
              exit 0
            fi
            # The standalone route compares ci.yml job by job with this base.
            # Absence means unavailable, and that step then fails open.
            if grep -Fxq '.github/workflows/ci.yml' /tmp/cmux-ci-changed-files.txt; then
              git show "$BASE_SHA:.github/workflows/ci.yml" > /tmp/cmux-ci-base-workflow.yml \
                || rm -f /tmp/cmux-ci-base-workflow.yml
            fi
            # The changed lines of cmuxTests/, so choose_ci_suite.py can tell
            # which declarations a test edit touched, and of ci-macos.yml, so
            # it can tell whether an edit sits in the app-host shards' job.
            # Absent reads as "every line of each changed file".
            git diff --no-renames -U0 "$BASE_SHA" "$MERGE_SHA" -- cmuxTests .github/workflows/ci-macos.yml \
              > /tmp/cmux-ci-tests.diff || rm -f /tmp/cmux-ci-tests.diff
            # The changed lines of app code, so choose_ci_suite.py can add the
            # suites whose tests mention what changed (reverse_test_impact.py).
            git diff --no-renames -U0 "$BASE_SHA" "$MERGE_SHA" -- Sources Packages/macOS Packages/Shared CLI \
              > /tmp/cmux-ci-app.diff || rm -f /tmp/cmux-ci-app.diff

            if [ ! -s /tmp/cmux-ci-changed-files.txt ]; then
              echo "PR diff is empty; skipping product-area CI."
              {
                echo "macos=false"
                echo "web=false"
                echo "agent_session_web=false"
                echo "cli=false"
                echo "swift_packages=false"
                echo "release_build=false"
              } >> "$GITHUB_OUTPUT"
              exit 0
            fi

            # Registry edits that only register Linux guards do not change the
            # native test lanes. Missing history keeps the detector fail-open.
            registry_base_args=()
            if grep -Fxq 'tests/test-execution.toml' /tmp/cmux-ci-changed-files.txt; then
              registry_base="$(mktemp "${RUNNER_TEMP:-/tmp}/cmux-test-registry-base.XXXXXX")"
              if git show "$BASE_SHA:tests/test-execution.toml" > "$registry_base"; then
                registry_base_args=(--test-registry-base "$registry_base")
              fi
            fi

            # Most project.pbxproj edits wire app or test files. The detector
            # compares the CLI route's targets with the base revision; without
            # it, any project edit keeps the CLI lane.
            xcode_project_base_args=()
            if grep -Fxq 'cmux.xcodeproj/project.pbxproj' /tmp/cmux-ci-changed-files.txt; then
              xcode_project_base="$(mktemp "${RUNNER_TEMP:-/tmp}/cmux-xcode-project-base.XXXXXX")"
              if git show "$BASE_SHA:cmux.xcodeproj/project.pbxproj" > "$xcode_project_base"; then
                xcode_project_base_args=(--xcode-project-base "$xcode_project_base")
              fi
            fi

            # ci-macos.yml is compared job by job with its base: an edit that
            # leaves the Release jobs and their inputs alone runs the Mac jobs
            # without the Release build. Without the base, every job runs.
            macos_workflow_base_args=()
            if grep -Fxq '.github/workflows/ci-macos.yml' /tmp/cmux-ci-changed-files.txt; then
              macos_workflow_base="$(mktemp "${RUNNER_TEMP:-/tmp}/cmux-macos-workflow-base.XXXXXX")"
              if git show "$BASE_SHA:.github/workflows/ci-macos.yml" > "$macos_workflow_base"; then
                macos_workflow_base_args=(--macos-workflow-base "$macos_workflow_base")
              fi
            fi

            # A provenance-only PR gets the cheap Linux guard and avoids
            # queuing the unrelated macOS/web/Go suites. Keep this exception
            # narrow: an unrelated workflow edit or source/configuration file
            # opts back into normal routing below. The workflow edit is allowed
            # only when this PR also contains one of the explicit provenance
            # inputs, so this guard's own wiring does not queue unrelated app
            # suites.
            ghosttykit_guard_only=true
            has_ghosttykit_guard_file=false
            ci_router_changed=false
            ci_workflow_changed=false
            while IFS= read -r changed_file; do
              case "$changed_file" in
                ghostty|scripts/download-prebuilt-ghosttykit.sh|scripts/validate-xcframework-archive.py|scripts/ghosttykit-checksums.txt|tests/test_ci_ghosttykit_release_check.sh)
                  has_ghosttykit_guard_file=true
                  ;;
                tests/test_ci_change_areas.py)
                  ci_router_changed=true
                  ;;
                scripts/ci/detect_ci_change_areas.py)
                  ci_router_changed=true
                  ghosttykit_guard_only=false
                  ;;
                scripts/ci/build_input_fingerprint.py|scripts/ci/find_admitted_build.py|scripts/ci/app_host_test_products.py|scripts/ci/compile-app-host-test-product.sh|scripts/ci/product_input_identity.py|scripts/ci/peer_product_source.py|scripts/ci/restore-app-host-test-product.sh|scripts/ci/reuse_app_host_products.py|scripts/ci/sanitize-xcode-source-packages-cache.py|scripts/ci/web_validation.py|scripts/ci/download-run-artifact.py)
                  # These have explicit owning lanes and names that cannot
                  # shadow Python stdlib imports used by the router.
                  ghosttykit_guard_only=false
                  ;;
                .github/workflows/ci.yml)
                  ci_workflow_changed=true
                  ;;
                scripts/ci/*)
                  # Unknown scripts/ci files fail open before invoking the
                  # PR-controlled Python detector. A new file here could
                  # otherwise shadow a stdlib import (for example subprocess.py).
                  ci_router_changed=true
                  ghosttykit_guard_only=false
                  ;;
                *)
                  ghosttykit_guard_only=false
                  ;;
              esac
            done < /tmp/cmux-ci-changed-files.txt
            if [ "$ghosttykit_guard_only" = true ] && [ "$has_ghosttykit_guard_file" = true ]; then
              echo "GhosttyKit provenance-only PR; running the release guard."
              {
                echo "macos=false"
                echo "web=false"
                echo "agent_session_web=false"
                echo "cli=false"
                echo "swift_packages=false"
                echo "release_build=false"
              } >> "$GITHUB_OUTPUT"
              exit 0
            fi

            # Product routing for CI-policy edits comes from the trusted base
            # revision, not candidate-controlled router code. Strip only known
            # routing-policy files; mixed PRs still route their real product
            # inputs through the base classifier. Unknown scripts/ci inputs stay
            # in the list and therefore fail open.
            if [ "$ci_router_changed" = true ] || [ "$ci_workflow_changed" = true ]; then
              # ci.yml is stripped below, but its `macos` job is the CLI lane's
              # call site: it passes the `cli` route to compile admission and
              # cli-product-tests. An edit to that job, or to the triggers and
              # permissions before `jobs:` that it inherits, runs the lane.
              cli_call_site_changed=false
              if [ "$ci_workflow_changed" = true ]; then
                if ! git show "$BASE_SHA:.github/workflows/ci.yml" > /tmp/cmux-ci-base-workflow.yml \
                  || ! python3 - /tmp/cmux-ci-base-workflow.yml .github/workflows/ci.yml <<'PY'
          import re
          import sys

          def cli_call_site(path: str) -> tuple[str, str]:
              text = open(path, encoding="utf-8").read()
              preamble, marker, body = text.partition("\njobs:\n")
              if not marker:
                  raise SystemExit(1)
              for block in re.split(r"(?m)^  (?=[A-Za-z0-9_-]+:\s*$)", body):
                  if block.partition(":")[0] == "macos":
                      return preamble, block
              return preamble, ""

          raise SystemExit(0 if cli_call_site(sys.argv[1]) == cli_call_site(sys.argv[2]) else 1)
          PY
                then
                  cli_call_site_changed=true
                  echo "ci.yml's CLI lane call site changed; running the CLI lane."
                fi
              fi

              product_files=/tmp/cmux-ci-product-files.txt
              : > "$product_files"
              while IFS= read -r path; do
                case "$path" in
                  .github/workflows/ci.yml|.github/workflows/ci-guards.yml|scripts/ci/detect_ci_change_areas.py|scripts/ci/detect_linux_guard_changes.py|scripts/ci/workflow_guard_groups.py|tests/test_ci_change_areas.py|tests/test_ci_linux_guard_routing.py|tests/test_ci_guard_workflow_structure.py)
                    ;;
                  *)
                    printf '%s\n' "$path" >> "$product_files"
                    ;;
                esac
              done < /tmp/cmux-ci-changed-files.txt

              if [ ! -s "$product_files" ]; then
                echo "CI routing-policy-only PR; skipping product-area CI."
                {
                  echo "macos=false"
                  echo "web=false"
                  echo "agent_session_web=false"
                  echo "cli=$cli_call_site_changed"
                  echo "swift_packages=false"
                  echo "release_build=false"
                } >> "$GITHUB_OUTPUT"
                exit 0
              fi

              trusted_base="$(git rev-parse -q --verify 'HEAD^1' || true)"
              trusted_root="$RUNNER_TEMP/trusted-ci-router"
              rm -rf "$trusted_root"
              mkdir -p "$trusted_root"
              trusted_ok=true
              for trusted_path in \
                scripts/ci/detect_ci_change_areas.py \
                scripts/ci/select_package_tests.py \
                scripts/ci/workloads/ci-guard.sh \
                .github/workflows/ci.yml \
                .github/workflows/ci-guards.yml \
                .github/workflows/ci-web.yml \
                .github/workflows/ci-macos.yml
              do
                mkdir -p "$trusted_root/$(dirname "$trusted_path")"
                if [ -z "$trusted_base" ] || ! git show "$trusted_base:$trusted_path" > "$trusted_root/$trusted_path"; then
                  trusted_ok=false
                  break
                fi
              done
              # The router derives macOS's local-package closure from the Xcode
              # project and every Package.swift. Without them it keeps all iOS
              # package edits macOS-relevant and compiles the app for nothing.
              # One archive instead of a mkdir and git show per file: about 80
              # manifests made this copy most of the trusted router's runtime.
              if [ "$trusted_ok" = true ]; then
                trusted_inputs=()
                while IFS= read -r trusted_path; do
                  trusted_inputs+=("$trusted_path")
                done < <(git ls-tree -r --name-only "$trusted_base" -- cmux.xcodeproj/project.pbxproj Packages | grep -E '(^cmux\.xcodeproj/project\.pbxproj$|^Packages/[^/]+/[^/]+/Package\.swift$)')
                if [ "${#trusted_inputs[@]}" -gt 0 ]; then
                  git --literal-pathspecs archive "$trusted_base" -- "${trusted_inputs[@]}" \
                    | tar -x -C "$trusted_root" || true
                fi
              fi
              if [ "$trusted_ok" != true ]; then
                echo "Could not load trusted base router; running all CI areas." >&2
                emit_all_areas
                exit 0
              fi

              echo "CI routing policy changed; classifying product inputs with the trusted base router."
              if [ "${#registry_base_args[@]}" -gt 0 ] && ! python3 "$trusted_root/scripts/ci/detect_ci_change_areas.py" --help | grep -q -- '--test-registry-base'; then
                echo "Trusted router predates registry comparison; running all CI areas."
                emit_all_areas
                exit 0
              fi
              # A trusted router that predates the project comparison keeps
              # the CLI lane for every project edit, which is safe.
              if [ "${#xcode_project_base_args[@]}" -gt 0 ] && ! python3 "$trusted_root/scripts/ci/detect_ci_change_areas.py" --help | grep -q -- '--xcode-project-base'; then
                xcode_project_base_args=()
              fi
              # One that predates the job comparison keeps the Release build
              # for every ci-macos.yml edit, which is safe.
              if [ "${#macos_workflow_base_args[@]}" -gt 0 ] && ! python3 "$trusted_root/scripts/ci/detect_ci_change_areas.py" --help | grep -q -- '--macos-workflow-base'; then
                macos_workflow_base_args=()
              fi
              trusted_areas=/tmp/cmux-ci-trusted-areas.txt
              : > "$trusted_areas"
              (
                cd "$trusted_root"
                CMUX_CI_HEAD_TEST_REFERENCE_ROOT="${GITHUB_WORKSPACE:-$PWD}" \
                python3 scripts/ci/detect_ci_change_areas.py \
                  --event-name "$EVENT_NAME" \
                  --files-from "$product_files" \
                  ${registry_base_args[@]+"${registry_base_args[@]}"} \
                  ${xcode_project_base_args[@]+"${xcode_project_base_args[@]}"} \
                  ${macos_workflow_base_args[@]+"${macos_workflow_base_args[@]}"} \
                  --github-output "$trusted_areas"
              )
              if [ "$cli_call_site_changed" = true ]; then
                sed 's/^cli=false$/cli=true/' "$trusted_areas" >> "$GITHUB_OUTPUT"
              else
                cat "$trusted_areas" >> "$GITHUB_OUTPUT"
              fi
              exit 0
            fi

            # The detector is unchanged here, so it may judge a ci.yml edit: only
            # an edit confined to Linux jobs skips macOS, and anything it cannot
            # read runs every area.
            workflow_base_args=()
            if [ "$ci_workflow_changed" = true ]; then
              if ! git show "$BASE_SHA:.github/workflows/ci.yml" > /tmp/cmux-ci-base-workflow.yml; then
                echo "Could not read the base ci.yml; running all CI areas." >&2
                emit_all_areas
                exit 0
              fi
              workflow_base_args=(--ci-workflow-base /tmp/cmux-ci-base-workflow.yml)
            fi

            python3 scripts/ci/detect_ci_change_areas.py \
              --event-name "$EVENT_NAME" \
              --files-from /tmp/cmux-ci-changed-files.txt \
              ${registry_base_args[@]+"${registry_base_args[@]}"} \
              ${xcode_project_base_args[@]+"${xcode_project_base_args[@]}"} \
              ${macos_workflow_base_args[@]+"${macos_workflow_base_args[@]}"} \
              ${workflow_base_args[@]+"${workflow_base_args[@]}"}
            exit 0
          fi

          python3 scripts/ci/detect_ci_change_areas.py \
            --event-name "$EVENT_NAME" \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA"

      - name: Route standalone project workflows
        id: standalone
        run: |
          set -euo pipefail
          claude_wrapper=false
          browser=false
          remote_daemon=false
          remote_daemon_native=false
          ci_workflow_changed=false
          if [ -f /tmp/cmux-ci-changed-files.txt ]; then
            while IFS= read -r path; do
              case "$path" in
                .github/workflows/ci.yml)
                  # The caller owns the browser job's condition and target;
                  # that lane runs on Linux. The Mac lanes are judged below.
                  browser=true
                  ci_workflow_changed=true
                  ;;
                Resources/bin/cmux-claude-wrapper|tests/test_claude_wrapper_hooks.py|tests/node_runtime.py|scripts/ci/run_python_test_lane.py|scripts/ci/test_execution_registry.py)
                  # Not tests/test-execution.toml: every new test registers
                  # there, and the wrapper entry is pinned by a Linux guard.
                  claude_wrapper=true
                  ;;
                cmux-browser/*|.github/workflows/cmux-browser.yml)
                  browser=true
                  ;;
                daemon/remote/*|scripts/*remote_daemon*|scripts/release_asset_guard*|tests/*remote_daemon*|.github/workflows/remote-daemon.yml)
                  remote_daemon=true
                  remote_daemon_native=true
                  ;;
                .github/workflows/release.yml|.github/workflows/nightly.yml)
                  # Packaging contracts run on Linux; unchanged Go code does
                  # not need another native build on the shared Mac pool.
                  remote_daemon=true
                  ;;
              esac
            done < /tmp/cmux-ci-changed-files.txt
          else
            claude_wrapper=true
            browser=true
            remote_daemon=true
            remote_daemon_native=true
          fi
          # ci.yml runs the wrapper lane inline and calls remote-daemon.yml with
          # its native_tests input. Only an edit to that job, or to the
          # triggers, env and permissions before `jobs:`, changes what a Mac
          # lane runs. Edits to the routing, status and Linux jobs decide only
          # whether it runs, which the Linux guard tests already check. A
          # missing or unreadable base, a duplicate job, or a YAML alias in the
          # lane's job selects both lanes.
          if [ "$ci_workflow_changed" = true ]; then
            if python3 - /tmp/cmux-ci-base-workflow.yml .github/workflows/ci.yml \
              > /tmp/cmux-ci-standalone-callers.txt <<'PY'
          import re
          import sys

          def jobs(path: str) -> tuple[str, dict[str, str]]:
              text = open(path, encoding="utf-8").read()
              preamble, marker, body = text.partition("\njobs:\n")
              if not marker:
                  raise SystemExit(1)
              blocks: dict[str, str] = {}
              for block in re.split(r"(?m)^  (?=[A-Za-z0-9_-]+:\s*$)", body):
                  name = block.partition(":")[0]
                  if not block.strip():
                      continue
                  if name in blocks:
                      raise SystemExit(1)
                  blocks[name] = block
              return preamble, blocks

          (base_preamble, base_jobs), (head_preamble, head_jobs) = jobs(sys.argv[1]), jobs(sys.argv[2])
          alias = re.compile(r"(?m)(?:<<:|[:-])\s*\*[A-Za-z0-9_.-]+\s*$")
          for job in ("claude-wrapper", "remote-daemon"):
              base_block, head_block = base_jobs.get(job, ""), head_jobs.get(job, "")
              if (
                  base_preamble != head_preamble
                  or base_block != head_block
                  or alias.search(base_block)
                  or alias.search(head_block)
              ):
                  print(job)
          PY
            then
              callers="$(tr '\n' ' ' < /tmp/cmux-ci-standalone-callers.txt)"
              echo "ci.yml changed; Mac lane callers that differ: ${callers:-none}"
              case " $callers " in
                *" claude-wrapper "*) claude_wrapper=true ;;
              esac
              case " $callers " in
                *" remote-daemon "*)
                  remote_daemon=true
                  remote_daemon_native=true
                  ;;
              esac
            else
              echo "Could not compare ci.yml with its base; running the Mac standalone lanes."
              claude_wrapper=true
              remote_daemon=true
              remote_daemon_native=true
            fi
          fi
          {
            echo "claude_wrapper=$claude_wrapper"
            echo "browser=$browser"
            echo "remote_daemon=$remote_daemon"
            echo "remote_daemon_native=$remote_daemon_native"
          } >> "$GITHUB_OUTPUT"

      # Compile admission runs on every routed push. The rest of the macOS suite
      # runs on merge groups and dispatches always, and on pull requests unless
      # the repository variable CI_PULL_REQUEST_SUITE is "compile-only". Under
      # that policy the "full-ci" label opts one pull request back in. Labels
      # come from this run's event payload, so a rerun replays the same label
      # snapshot; labeled/unlabeled events above create a fresh run instead.
      - name: Choose the macOS suite for this run
        id: suite
        env:
          EVENT_NAME: ${{ github.event_name }}
          # Fork pull requests do not receive repository variables, so keep
          # the default in sync with the repository setting (#13095).
          PULL_REQUEST_POLICY: ${{ vars.CI_PULL_REQUEST_SUITE || 'compile-only' }}
        run: |
          set -euo pipefail
          # The diff list is only written for pull_request and merge_group, and
          # only once the diff could be read. Omitting the flag reports an
          # unknown diff, which fails closed in coverage_gap().
          files_args=()
          if [ -f /tmp/cmux-ci-changed-files.txt ]; then
            files_args=(--files-from /tmp/cmux-ci-changed-files.txt)
          fi
          if [ -f /tmp/cmux-ci-tests.diff ]; then
            files_args+=(--diff-from /tmp/cmux-ci-tests.diff)
          fi
          if [ -f /tmp/cmux-ci-app.diff ]; then
            files_args+=(--app-diff-from /tmp/cmux-ci-app.diff)
          fi
          python3 scripts/ci/choose_ci_suite.py \
            --event-name "$EVENT_NAME" \
            --pull-request-policy "$PULL_REQUEST_POLICY" \
            --event-path "$GITHUB_EVENT_PATH" \
            ${files_args[@]+"${files_args[@]}"} \
            --github-output "$GITHUB_OUTPUT"

      - name: Mint the owned-pool routing token
        id: route-token
        # The org's manaflow-glaeda-route App, read-only on runners, so the
        # pool choice below sees which owned Macs are idle now. Same-repository
        # pull requests and main's full-suite dispatch only, on this ephemeral
        # Linux runner: a fork run never sees the key, and no Mac ever holds
        # it. Any failure (no key yet, the App not installed) leaves the token
        # empty, and the choice falls back to the janitor snapshot and
        # CI_OWNED_POOL_SLOTS.
        if: (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') && vars.CI_PR_POOL_OWNED == '1' && vars.GLAEDA_ROUTE_APP_ID != ''
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.GLAEDA_ROUTE_APP_ID }}
          private-key: ${{ secrets.GLAEDA_ROUTE_APP_KEY }}
          permission-administration: read

      - name: Choose the pull request macOS pool
        id: macos-pool
        # Fail-safe: any error leaves the outputs empty, which is today's route.
        # Main's full-suite dispatch (ci-main-full-suite.yml) is routed too,
        # onto the owned pools only, placed like a pull request unless
        # CI_OWNED_MAIN_RESERVE holds machines back for pull requests
        # (pr_runner_pool.py, "Main's full suite"); ci-macos.yml already reads
        # these outputs for a workflow_dispatch on main.
        continue-on-error: true
        timeout-minutes: 1
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          DEFAULT_RUNNER: ${{ vars.MACOS_RUNNER_PR }}
          # Empty unless the step above minted it: idle owned runners, live.
          ROUTE_TOKEN: ${{ steps.route-token.outputs.token }}
          POOL_OVERFLOW: ${{ vars.CI_PR_POOL_OVERFLOW }}
          POOL_ORDER: ${{ vars.CI_PR_POOL_ORDER }}
          POOL_MAX_QUEUED: ${{ vars.CI_PR_POOL_MAX_QUEUED }}
          # Rounds of queue a pool may hold, owned or Blacksmith (default 1; 0 off).
          POOL_QUEUE_ROUNDS: ${{ vars.CI_PR_POOL_QUEUE_ROUNDS }}
          # Owned Mac pools (off unless 1), their machine counts, and the lane
          # Xcode whose version names their label (glaeda-std-xcode-26.6).
          POOL_OWNED: ${{ vars.CI_PR_POOL_OWNED }}
          OWNED_SLOTS: ${{ vars.CI_OWNED_POOL_SLOTS }}
          # 1 lets a run take the owned machines that are free and send its
          # other jobs to Blacksmith, instead of all or nothing (off unless 1).
          POOL_OWNED_SPLIT: ${{ vars.CI_PR_POOL_OWNED_SPLIT }}
          OWNED_LIGHT_RETRY: ${{ vars.CI_OWNED_LIGHT_RETRY }}
          # 0 keeps GUI jobs (app-host shards, tests-build-and-lag) off them.
          POOL_OWNED_GUI: ${{ vars.CI_PR_POOL_OWNED_GUI }}
          # Machines and root runners main's dispatch leaves free (default 0).
          OWNED_MAIN_RESERVE: ${{ vars.CI_OWNED_MAIN_RESERVE }}
          CMUX_CI_XCODE_APP_PR: ${{ (github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') && vars.CMUX_CI_XCODE_APP_PR || '' }}
          # Handed to the macOS 15 pool's jobs only when the run lands there.
          CMUX_CI_XCODE_APP_MACOS_15: ${{ vars.CMUX_CI_XCODE_APP_MACOS_15 }}
          # This run's macOS jobs, from the routing above, so an owned pool is
          # taken only when every job of the run gets a machine at once.
          RUN_MACOS: ${{ steps.detect.outputs.macos }}
          RUN_FULL_SUITE: ${{ steps.suite.outputs.full_suite }}
          RUN_UNIT_SUITE: ${{ steps.suite.outputs.unit_suite }}
          RUN_UNIT_IN_ADMISSION: ${{ steps.suite.outputs.unit_in_admission }}
          RUN_UNIT_SELECTORS: ${{ steps.suite.outputs.unit_selectors }}
          RUN_CLAUDE_WRAPPER: ${{ steps.standalone.outputs.claude_wrapper }}
          RUN_CLI: ${{ steps.detect.outputs.cli }}
          RUN_REMOTE_DAEMON: ${{ steps.standalone.outputs.remote_daemon }}
          # The main commit this run merges onto, whose warm label (a root
          # runner that kept a build of it) compile admission may take.
          MERGED_ONTO: ${{ steps.source-identity.outputs.parent1 || github.event.pull_request.base.sha }}
          WARM_LABELS: ${{ vars.CI_OWNED_WARM_LABELS }}
        run: python3 scripts/ci/pr_runner_pool.py

      # A job queued on a persistent pool (owned Macs) waits for it however long
      # it stays busy. The owned-pool-watch job starts ci-owned-pool-rescue.yml,
      # running from main, and this marker tells it to watch the run and re-run
      # it on Blacksmith when a job waits past CI_OWNED_POOL_RESCUE_SECONDS. No persistent pool, no marker, no watching.
      # Fail-safe like the picker: a missing marker only means the run is not
      # watched, which is how every run behaved before the rescue existed.
      - name: Mark a run on a persistent macOS pool
        id: macos-pool-marker
        if: ${{ steps.macos-pool.outputs.persistent == 'true' }}
        continue-on-error: true
        env:
          POOL: ${{ steps.macos-pool.outputs.runner }}
        run: |
          set -euo pipefail
          marker="$RUNNER_TEMP/macos-pool-persistent.json"
          POOL="$POOL" MARKER="$marker" python3 -c 'import json,os; json.dump({"pool": os.environ["POOL"]}, open(os.environ["MARKER"], "w"))'
          echo "path=$marker" >> "$GITHUB_OUTPUT"

      - name: Upload the persistent pool marker
        if: ${{ steps.macos-pool-marker.outputs.path != '' }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # The janitor reads the run's peak and pool from the name.
          name: macos-pool-persistent-${{ github.run_id }}-${{ github.run_attempt }}-${{ steps.macos-pool.outputs.jobs }}-${{ steps.macos-pool.outputs.runner }}
          path: ${{ steps.macos-pool-marker.outputs.path }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Route Linux guard suites
        id: linux_guards
        env:
          EVENT_NAME: ${{ github.event_name }}
          MACOS: ${{ steps.detect.outputs.macos }}
        run: |
          set -euo pipefail
          # Candidate routing policy cannot skip its own guard tests. For a
          # policy-only PR, keep workflow-guard-tests coverage while avoiding
          # unrelated history/CLI/source-lint jobs. ci-macos/ci-web edits retain
          # the full test-group matrix because many groups inspect those reusable
          # workflows. Mixed product changes still fail open below.
          policy_only=true
          routing_policy_changed=false
          full_guard_matrix=false
          macos_workflow_changed=false
          other_full_guard_matrix=false
          if [ -f /tmp/cmux-ci-changed-files.txt ]; then
            while IFS= read -r path; do
              case "$path" in
                .github/workflows/ci-guards.yml)
                  routing_policy_changed=true
                  full_guard_matrix=true
                  other_full_guard_matrix=true
                  ;;
                .github/workflows/ci.yml|scripts/ci/detect_ci_change_areas.py|scripts/ci/detect_linux_guard_changes.py|scripts/ci/workflow_guard_groups.py|tests/test_ci_change_areas.py|tests/test_ci_linux_guard_routing.py|tests/test_ci_guard_workflow_structure.py)
                  routing_policy_changed=true
                  ;;
                .github/workflows/ci-macos.yml)
                  full_guard_matrix=true
                  macos_workflow_changed=true
                  ;;
                .github/workflows/ci-web.yml)
                  full_guard_matrix=true
                  other_full_guard_matrix=true
                  ;;
                .github/workflows/web-complexity.yml|.github/workflows/web-complexity-trusted.yml|tests/test_web_complexity_trusted_workflow.py)
                  ;;
                *)
                  policy_only=false
                  ;;
              esac
            done < /tmp/cmux-ci-changed-files.txt
          else
            policy_only=false
          fi

          if [ "$routing_policy_changed" = true ] && [ "$policy_only" = true ]; then
            {
              echo "linux_guard_tests=true"
              echo "linux_guard_history=false"
              echo "linux_guard_cli=false"
              echo "linux_guard_source=false"
              if [ "$MACOS" = "true" ]; then
                echo "ghosttykit_release=true"
              else
                echo "ghosttykit_release=false"
              fi
              if [ "$full_guard_matrix" = true ]; then
                release_only=false
                if [ "$macos_workflow_changed" = true ] && [ "$other_full_guard_matrix" = false ]; then
                  if python3 - <<'PY'
          import re
          import subprocess
          from pathlib import Path

          def jobs(text: str) -> dict[str, str]:
              _, marker, body = text.partition("\njobs:\n")
              if not marker:
                  raise SystemExit(2)
              result = {}
              for block in re.split(r"(?m)^  (?=[A-Za-z0-9_-]+:\s*$)", body):
                  if not block.strip():
                      continue
                  name = block.partition(":")[0]
                  if not re.fullmatch(r"[A-Za-z0-9_-]+", name) or name in result:
                      raise SystemExit(2)
                  result[name] = block
              return result

          base = subprocess.check_output(
              ["git", "show", "HEAD^1:.github/workflows/ci-macos.yml"],
              text=True,
          )
          head = Path(".github/workflows/ci-macos.yml").read_text(encoding="utf-8")
          base_jobs = jobs(base)
          head_jobs = jobs(head)
          changed = {
              name
              for name in base_jobs.keys() | head_jobs.keys()
              if base_jobs.get(name) != head_jobs.get(name)
          }
          release_only_jobs = {"release-admission", "release-build", "macos-status"}
          raise SystemExit(0 if changed and changed <= release_only_jobs else 1)
          PY
                  then
                    release_only=true
                  fi
                fi

                if [ "$release_only" = true ]; then
                  echo 'linux_guard_test_groups=["preflight","ci","release-ios","release-notary","release-tooling"]'
                else
                  echo 'linux_guard_test_groups=["preflight","ci","app-host-execution","app-host-watchdog","app-host-process","app-host-cache","release-ios","release-notary","release-tooling","quality-sharding","quality-runtime","quality-determinism"]'
                fi
              else
                echo 'linux_guard_test_groups=["ci"]'
              fi
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          python3 scripts/ci/detect_linux_guard_changes.py \
            --event-name "$EVENT_NAME" --macos "$MACOS" \
            --files-from /tmp/cmux-ci-changed-files.txt >> "$GITHUB_OUTPUT"

      # A push that changes nothing the Xcode build reads (a guard test, another
      # workflow, docs, a merge of main that only moved web) has nothing new to
      # compile. Each pull request run publishes its build-input fingerprint as
      # an artifact name, and a compile-only run whose fingerprint an earlier run
      # of the same in-org branch already compiled skips compile admission. Runs
      # with the full suite or unit-ci always compile, because the app-host
      # shards need the product and only run behind a compile admission that
      # succeeded in this run.
      # The artifact name carries the run attempt, so a pass only vouches for the
      # fingerprint published in its own attempt. These steps are an optimization:
      # any of them failing leaves compile_admitted unset, which compiles.
      - name: Fingerprint the build inputs
        id: inputs
        continue-on-error: true
        if: ${{ github.event_name == 'pull_request' && steps.detect.outputs.macos == 'true' }}
        env:
          # Both steps are pull-request-only, and the xcode= extra exists so the
          # fingerprint moves when the pinned toolchain does. Read the same lane
          # the pull-request macOS jobs compile under, or a lane move would reuse
          # a build admitted under the previous Xcode and skip the compile. A run
          # pr_runner_pool.py moved to the macOS 15 pool compiles under its Xcode.
          XCODE_APP: ${{ steps.macos-pool.outputs.xcode_app || github.event.pull_request.head.repo.full_name == github.repository && vars.CMUX_CI_XCODE_APP_PR || vars.CMUX_CI_XCODE_APP_MACOS_15 }}
        run: |
          set -euo pipefail
          fingerprint="$(python3 scripts/ci/build_input_fingerprint.py --extra "xcode=$XCODE_APP")"
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
          echo "$fingerprint" > "$RUNNER_TEMP/build-inputs.txt"

      - name: Skip compile when build inputs are unchanged
        id: unchanged_inputs
        continue-on-error: true
        if: ${{ steps.inputs.outputs.fingerprint != '' && steps.suite.outputs.full_suite == 'false' && (steps.suite.outputs.unit_suite != 'true' || steps.suite.outputs.unit_canary == 'true') }}
        env:
          # Both steps are pull-request-only, and the xcode= extra exists so the
          # fingerprint moves when the pinned toolchain does. Read the same lane
          # the pull-request macOS jobs compile under, or a lane move would reuse
          # a build admitted under the previous Xcode and skip the compile. A run
          # pr_runner_pool.py moved to the macOS 15 pool compiles under its Xcode.
          XCODE_APP: ${{ steps.macos-pool.outputs.xcode_app || github.event.pull_request.head.repo.full_name == github.repository && vars.CMUX_CI_XCODE_APP_PR || vars.CMUX_CI_XCODE_APP_MACOS_15 }}
          HEAD_FINGERPRINT: ${{ steps.inputs.outputs.fingerprint }}
        run: |
          set -euo pipefail
          if [ -f /tmp/cmux-ci-changed-files.txt ] && grep -qxE 'scripts/ci/(build_input_fingerprint\.py|product_input_identity\.py)' /tmp/cmux-ci-changed-files.txt; then
            echo "Fingerprint implementation changed; keeping compile admission."
            exit 0
          fi
          if ! git rev-parse -q --verify 'HEAD^1' >/dev/null; then
            echo "Comparison parent unavailable; keeping compile admission."
            exit 0
          fi
          parent_fingerprint="$(python3 scripts/ci/build_input_fingerprint.py --revision 'HEAD^1' --extra "xcode=$XCODE_APP")"
          if [ "$parent_fingerprint" = "$HEAD_FINGERPRINT" ]; then
            echo "compile_admitted=true" >> "$GITHUB_OUTPUT"
            echo "App-host build inputs are unchanged; skipping macOS compile admission."
          else
            echo "App-host build inputs changed; compile admission remains required."
          fi

      - name: Publish the build-input fingerprint
        continue-on-error: true
        if: ${{ steps.inputs.outputs.fingerprint != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-inputs-${{ steps.inputs.outputs.fingerprint }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/build-inputs.txt
          retention-days: 7
          overwrite: true

      - name: Look for an earlier run that compiled these inputs
        id: admitted
        continue-on-error: true
        if: ${{ steps.inputs.outputs.fingerprint != '' && steps.suite.outputs.full_suite == 'false' && (steps.suite.outputs.unit_suite != 'true' || steps.suite.outputs.unit_canary == 'true') && steps.unchanged_inputs.outputs.compile_admitted != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.head_ref }}
          FINGERPRINT: ${{ steps.inputs.outputs.fingerprint }}
        run: |
          set -euo pipefail
          python3 scripts/ci/find_admitted_build.py --repository "$GITHUB_REPOSITORY" --branch "$BRANCH" \
            --fingerprint "$FINGERPRINT" --current-run-id "$GITHUB_RUN_ID" --github-output "$GITHUB_OUTPUT"

  # Report only. choose_ci_suite.py in `changes` already adds the suites
  # reverse_test_impact.py names to the changed-suites run; this job records
  # the full answer, what was considered and what it would cost, in the step
  # summary and a 14-day artifact so its recall can be measured against later
  # failures on main. It is its own job so it never
  # delays routing: nothing needs it, ci-status does not wait for it, it has
  # no outputs, and it cannot fail the run (continue-on-error at job level).
  #
  # Like the trusted router in `changes`, the selector and everything it
  # imports come from the merge commit's first parent, into a directory of
  # their own, so a pull request cannot change what is reported about it and
  # a new scripts/ci/ file cannot shadow an import. The pull request's tree is
  # only read as text. Until the selector is on the base there is nothing to
  # report.
  reverse-test-impact:
    name: Reverse test impact (report only)
    needs: [changes]
    if: ${{ github.event_name == 'pull_request' && needs.changes.result == 'success' }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # The merge commit and its first parent, the trusted base.
          fetch-depth: 2
          persist-credentials: false

      - name: Report reverse test impact (report only)
        continue-on-error: true
        run: |
          set -uo pipefail
          out="$RUNNER_TEMP/reverse-test-impact"
          rm -rf "$out"
          mkdir -p "$out/trusted"
          base="$(git rev-parse -q --verify 'HEAD^1' || true)"
          if [ -z "$base" ]; then
            echo "No base revision in this checkout; nothing to report."
            exit 0
          fi
          # A file, not a pipe into grep -q: an early grep exit would SIGPIPE
          # git on a large diff and pipefail would read that as no match.
          git diff --no-renames --name-only "$base" HEAD > "$out/names" || true
          if ! grep -qE '^(Sources/|CLI/|Packages/(macOS|Shared)/[^/]+/Sources/)' "$out/names"; then
            echo "No app source changes; nothing to report."
            exit 0
          fi
          if ! git archive "$base" -- \
            scripts/ci/reverse_test_impact.py \
            scripts/ci/choose_ci_suite.py \
            scripts/ci/cmux_unit_test_shard.py \
            scripts/ci/test_impact.py \
            scripts/ci/cmux-unit-test-timings.json \
            | tar -x -C "$out/trusted" 2>/dev/null; then
            echo "The base revision has no reverse test impact selector; nothing to report."
            exit 0
          fi
          trusted="$out/trusted"
          diff_args=(--diff-from "$out/app.diff")
          if ! git diff --no-renames -U0 "$base" HEAD -- Sources Packages/macOS Packages/Shared CLI > "$out/app.diff"; then
            # The selector records "diff unavailable" rather than guessing.
            diff_args=()
          fi
          python3 -I "$trusted/scripts/ci/reverse_test_impact.py" \
            --root "$GITHUB_WORKSPACE" \
            ${diff_args[@]+"${diff_args[@]}"} \
            --output "$out/report.json" \
            --summary "$GITHUB_STEP_SUMMARY" \
            || echo "::warning::Reverse test impact report failed; routing is unchanged."
          exit 0

      - name: Upload the reverse test impact report
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reverse-test-impact-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/reverse-test-impact/report.json
          if-no-files-found: ignore
          retention-days: 14

  owned-pool-watch:
    # Starts ci-owned-pool-rescue.yml (from main) for a run whose `changes`
    # job placed jobs on an owned pool, so a run on an ephemeral pool, a fork
    # or a retry creates no rescue workflow run at all. It is the one job in
    # this workflow with Actions write, and it runs no repository code:
    # no checkout, one API call. The watcher re-checks the run it is given.
    # Fail-safe: if the dispatch fails the run is only not watched, and
    # ci-status does not wait for this job. Main's full-suite dispatch
    # (ci-main-full-suite.yml) is placed on the owned pools like a
    # same-repository pull request, so it is watched too.
    name: Watch owned pool jobs
    needs: changes
    # A same-repository pull request whose picker placed nothing owned is
    # watched too when ci-macos.yml's late-placement may still move its jobs
    # after compile admission (a full or unit suite, or the CLI lane): the
    # watch waits for that job and follows the run only if it moved some.
    if: ${{ (needs.changes.outputs.macos_pr_owned_jobs != '' || github.event_name == 'pull_request' && vars.GLAEDA_ROUTE_APP_ID != '' && (needs.changes.outputs.macos == 'true' && (needs.changes.outputs.full_suite == 'true' || needs.changes.outputs.unit_suite == 'true') || needs.changes.outputs.cli == 'true')) && (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') && github.run_attempt == 1 && vars.CI_PR_POOL_OWNED == '1' && (vars.CI_OWNED_POOL_RESCUE || '1') != '0' }}
    runs-on: ubuntu-24.04 # github-hosted-required: one API call; keeps CI's Linux pool free
    timeout-minutes: 5
    # Job level, like reverse-test-impact, so macos-admission-gate never
    # waits on it.
    continue-on-error: true
    permissions:
      actions: write
    steps:
      - name: Dispatch the persistent pool rescue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          # 1 when the picker placed nothing owned: wait for late placement.
          LATE: ${{ needs.changes.outputs.macos_pr_owned_jobs == '' && '1' || '0' }}
        run: gh workflow run ci-owned-pool-rescue.yml --ref main -f run_id="$RUN_ID" -f run_attempt="$RUN_ATTEMPT" -f late="$LATE"

  static-preflight:
    name: Fast static checks
    # No package installs, submodules or app build: reject malformed inputs
    # before starting macOS and the other Linux stages. Guards and web run
    # beside it, because the macOS gate waits for them.
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Run the contributor static preflight
        run: python3 scripts/verify-local.py

  guards:
    # Not after static-preflight: the guards are the last job
    # macos-admission-gate waits for (median ~110 s after changes), and the
    # gate still requires static-preflight, so starting them together lets it
    # decline ~25 s sooner without admitting macOS on a rejected diff.
    needs: [changes]
    if: ${{ needs.changes.outputs.linux_guard_tests != 'false' || needs.changes.outputs.linux_guard_history != 'false' || needs.changes.outputs.linux_guard_cli != 'false' || needs.changes.outputs.linux_guard_source != 'false' }}
    uses: ./.github/workflows/ci-guards.yml
    with:
      linux_guard_tests: ${{ needs.changes.outputs.linux_guard_tests }}
      linux_guard_test_groups: ${{ needs.changes.outputs.linux_guard_test_groups }}
      linux_guard_history: ${{ needs.changes.outputs.linux_guard_history }}
      linux_guard_cli: ${{ needs.changes.outputs.linux_guard_cli }}
      linux_guard_source: ${{ needs.changes.outputs.linux_guard_source }}

  ghosttykit-release-check:
    needs: [changes]
    if: ${{ needs.changes.outputs.ghosttykit_release == 'true' }}
    name: GhosttyKit release check
    permissions:
      contents: read
    # Check the pinned framework before using a Mac, and on provenance changes.
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Read pinned Ghostty SHA
        run: |
          set -euo pipefail
          GHOSTTY_SHA="$(git ls-tree HEAD ghostty | awk '$4 == "ghostty" { print $3; exit }')"
          test -n "$GHOSTTY_SHA"
          echo "Pinned Ghostty SHA: $GHOSTTY_SHA"
          echo "GHOSTTY_SHA=$GHOSTTY_SHA" >> "$GITHUB_ENV"

      - name: Verify published GhosttyKit release and checksum
        env:
          # A missing GitHub release should fail quickly rather than spending
          # the helper's nightly retry budget on a known 404.
          GHOSTTYKIT_DOWNLOAD_RETRIES: "0"
          GHOSTTYKIT_DOWNLOAD_RETRY_DELAY: "1"
        run: ./scripts/download-prebuilt-ghosttykit.sh --verify-only

  browser:
    needs: [changes]
    if: ${{ needs.changes.outputs.browser == 'true' }}
    uses: ./.github/workflows/cmux-browser.yml

  remote-daemon:
    needs: [changes, static-preflight]
    if: ${{ needs.changes.outputs.remote_daemon == 'true' }}
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/remote-daemon.yml
    with:
      pr_runner: ${{ needs.changes.outputs.macos_pr_runner }}
      pr_retry_runner: ${{ needs.changes.outputs.macos_pr_retry_runner }}
      pr_owned_jobs: ${{ needs.changes.outputs.macos_pr_owned_jobs }}
      pr_refused_retry_runner: ${{ needs.changes.outputs.macos_pr_refused_retry_runner }}
      pr_side_runner: ${{ needs.changes.outputs.macos_pr_side_runner }}
      native_tests: ${{ needs.changes.outputs.remote_daemon_native == 'true' || contains(github.event.pull_request.labels.*.name, 'full-ci') }}

  web:
    # Beside static-preflight for the same reason as guards.
    needs: [changes]
    if: ${{ needs.changes.outputs.web != 'false' || needs.changes.outputs.agent_session_web != 'false' }}
    uses: ./.github/workflows/ci-web.yml
    with:
      web: ${{ needs.changes.outputs.web }}
      macos: ${{ needs.changes.outputs.macos }}
      agent_session_web: ${{ needs.changes.outputs.agent_session_web }}

  claude-wrapper:
    name: Claude wrapper regressions
    needs: [changes, static-preflight]
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.static-preflight.result == 'success' && (needs.changes.outputs.claude_wrapper == 'true' || (needs.changes.outputs.macos == 'true' && needs.changes.outputs.full_suite == 'true')) }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && (startsWith(needs.changes.outputs.macos_pr_runner, 'blacksmith-') && needs.changes.outputs.macos_pr_runner || 'blacksmith-6vcpu-macos-15') || github.event_name == 'pull_request' && github.run_attempt == 2 && github.triggering_actor == 'github-actions[bot]' && contains(needs.changes.outputs.macos_pr_owned_jobs, ' claude-wrapper ') && (needs.changes.outputs.macos_pr_side_runner || needs.changes.outputs.macos_pr_refused_retry_runner) || github.event_name == 'pull_request' && (github.run_attempt > 1 || !contains(needs.changes.outputs.macos_pr_owned_jobs, ' claude-wrapper ')) && needs.changes.outputs.macos_pr_retry_runner || github.event_name == 'pull_request' && (needs.changes.outputs.macos_pr_side_runner || needs.changes.outputs.macos_pr_runner || vars.MACOS_RUNNER_PR || 'blacksmith-6vcpu-macos-15') || vars.CI_PAID_MACOS_OVERFLOW == '1' && vars.MACOS_RUNNER_15 || 'blacksmith-6vcpu-macos-15') }}
    timeout-minutes: 10
    steps:
      - name: Checkout wrapper and test inputs
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          # The lane reads only these: about 740 files instead of the whole
          # 17,000-file tree, which took this Mac about 30 s to check out.
          sparse-checkout: |
            Resources/bin
            scripts/ci
            tests
      - name: Find an existing Node runtime
        id: node
        run: |
          python3 - <<'PYTHON'
          import os
          import sys
          from pathlib import Path
          if sys.version_info < (3, 9):
              raise SystemExit("Claude wrapper tests require Python 3.9 or newer")
          print(sys.version)
          sys.path.insert(0, "tests")
          from node_runtime import ensure_node_on_path
          node = ensure_node_on_path()
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"available={'true' if node else 'false'}\n")
          if node:
              with open(os.environ["GITHUB_PATH"], "a") as path:
                  path.write(str(Path(node).parent) + "\n")
          PYTHON
      - name: Install Node only when the runner has none
        if: ${{ steps.node.outputs.available != 'true' }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"

      - name: Run standalone Claude wrapper regressions
        run: |
          set -euo pipefail
          # Missing Node must fail this required lane, never produce the
          # legacy test script's successful SKIP result.
          node --version
          python3 scripts/ci/run_python_test_lane.py --lane macos-claude-wrapper

  # macOS compile admission starts as soon as `changes` and the static stage
  # pass, beside the fast Linux-only jobs instead of behind them. Over 75 gated
  # pull request runs (2026-09-24) those jobs finished a median 99 s (p90
  # 166 s) after the static stage, and admission then queued behind this gate;
  # the compile is the longest path in the run, so that wait was all wall time.
  #
  # This gate still has its say over every Mac job that runs the product,
  # through ordinary job results: no sleep and no polling. It is every job
  # that needs nothing beyond changes/static-preflight and runs only on Linux;
  # the workflow test derives the same list. Jobs with a Mac runner
  # (claude-wrapper, remote-daemon) are already billed and slow, so
  # waiting on them saves nothing. It finishes long before a compile does, and
  # compile admission's last step reads its result once: a declined gate
  # fails admission, which skips the shards, CLI product tests, lag and
  # Release lanes. Over those 75 runs it declined 5; each now spends one
  # compile admission (median 655 s) that it used to skip.
  #
  # A failed gate declines by failing this job rather than being skipped:
  # a first attempt only, so "Re-run failed jobs" re-runs it and compile
  # admission, and a re-run attempt admits macOS to collect Mac results
  # anyway. Other events skip it.
  macos-admission-gate:
    name: macOS admission gate
    needs:
      - changes
      - static-preflight
      - suite-coverage
      - ghosttykit-release-check
      - browser
      - guards
      - web
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.changes.result == 'success' && needs.static-preflight.result == 'success' && (needs.changes.outputs.macos != 'false' || needs.changes.outputs.cli == 'true') && (needs.changes.outputs.full_suite == 'true' || needs.changes.outputs.cli == 'true' || needs.changes.outputs.compile_admitted != 'true') }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Decline macOS after a failed Linux gate
        env:
          GATE_NEEDS: ${{ toJSON(needs) }}
        run: |
          set -u
          if [ "$GITHUB_RUN_ATTEMPT" != 1 ]; then
            echo "Re-run attempt; admitting macOS."
            exit 0
          fi
          # Only a concluded `failure` declines; `cancelled` means the run is
          # already going away. Unreadable input admits.
          failed="$(jq -r '[to_entries[] | select(.value.result == "failure") | .key] | join(", ")' <<<"$GATE_NEEDS")" || failed=""
          if [ -n "$failed" ]; then
            echo "::error::$failed already failed; not admitting macOS product consumers. Re-run failed jobs to collect macOS results anyway."
            exit 1
          fi
          echo "Fast Linux jobs passed or were skipped; admitting macOS."

  macos:
    needs:
      - changes
      - static-preflight
    # Not after macos-admission-gate: compile admission checks that gate
    # before its consumers start, instead of waiting for it (see above).
    # swift_packages is its own call reason: a pull request that only touches
    # Packages/ still needs the package-test lane, which is not part of compile
    # admission and would otherwise be skipped whenever the app-host product is
    # already admitted or the macOS area is neutral (a Packages/iOS package
    # outside the desktop closure). Other jobs retain their macos/cli gates.
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.static-preflight.result == 'success' && (((needs.changes.outputs.macos != 'false' || needs.changes.outputs.cli == 'true') && (needs.changes.outputs.full_suite == 'true' || needs.changes.outputs.unit_suite == 'true' || needs.changes.outputs.cli == 'true' || needs.changes.outputs.compile_admitted != 'true')) || needs.changes.outputs.swift_packages == 'true') }}
    permissions:
      actions: read
      id-token: write
      attestations: read
      contents: read
      pull-requests: read
    uses: ./.github/workflows/ci-macos.yml
    with:
      macos: ${{ needs.changes.outputs.macos }}
      cli: ${{ needs.changes.outputs.cli }}
      full_suite: ${{ needs.changes.outputs.full_suite }}
      unit_suite: ${{ needs.changes.outputs.unit_suite }}
      unit_selectors: ${{ needs.changes.outputs.unit_selectors }}
      unit_strict_steps: ${{ needs.changes.outputs.unit_strict_steps }}
      unit_in_admission: ${{ needs.changes.outputs.unit_in_admission }}
      swift_packages: ${{ needs.changes.outputs.swift_packages }}
      compile_admitted: ${{ needs.changes.outputs.compile_admitted }}
      release_build: ${{ needs.changes.outputs.release_build }}
      source_parent1: ${{ needs.changes.outputs.source_parent1 }}
      cache_backend: ${{ inputs.cache_backend }}
      release_archs: ${{ inputs.release_archs }}
      pr_runner: ${{ needs.changes.outputs.macos_pr_runner }}
      pr_retry_runner: ${{ needs.changes.outputs.macos_pr_retry_runner }}
      pr_shard_runner: ${{ needs.changes.outputs.macos_pr_shard_runner }}
      pr_owned_jobs: ${{ needs.changes.outputs.macos_pr_owned_jobs }}
      pr_refused_retry_runner: ${{ needs.changes.outputs.macos_pr_refused_retry_runner }}
      pr_root_runner: ${{ needs.changes.outputs.macos_pr_root_runner }}
      pr_admission_runner: ${{ needs.changes.outputs.macos_pr_admission_runner }}
      pr_xcode_app: ${{ needs.changes.outputs.macos_pr_xcode_app }}
    # ci-macos.yml's late-placement reads idle root runners with it.
    secrets:
      GLAEDA_ROUTE_APP_KEY: ${{ secrets.GLAEDA_ROUTE_APP_KEY }}

  tests:
    name: tests
    needs:
      - changes
      - linux-preflight
      - macos
      - web
    if: ${{ always() }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 5
    steps:
      - name: Check platform workflow routing
        env:
          TESTS_NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          needs = json.loads(os.environ["TESTS_NEEDS"])
          changes = needs["changes"]
          if changes["result"] != "success":
              print(f"changes: {changes['result']}", file=sys.stderr)
              sys.exit(1)
          outputs = changes.get("outputs", {})
          macos_route = outputs.get("macos")
          if macos_route not in {"true", "false"}:
              print(f"invalid route macos={macos_route!r}", file=sys.stderr)
              sys.exit(1)
          preflight = needs["linux-preflight"]
          if macos_route == "true":
              if preflight["result"] != "success":
                  print(f"linux preflight did not pass: {preflight['result']}", file=sys.stderr)
                  sys.exit(1)
          elif preflight["result"] not in {"success", "skipped"}:
              print(
                  f"linux preflight had unexpected result: {preflight['result']}",
                  file=sys.stderr,
              )
              sys.exit(1)
          macos_result = needs["macos"]["result"]
          full_suite = outputs.get("full_suite")
          compile_admitted = outputs.get("compile_admitted")
          # The package-test lane is routed independently of compile admission
          # and of the macOS area, so it can require the called workflow on its
          # own. Keep this in sync with the `macos` job's own `if:`.
          swift_packages = outputs.get("swift_packages") == "true"
          # `unit-ci` asks for app-host unit tests without the full suite, so a
          # routed macOS run is required even when compile admission reused a
          # product and full_suite stayed false.
          unit_suite = outputs.get("unit_suite") == "true"
          macos_work_required = swift_packages or (
              (
                  unit_suite
                  or outputs.get("cli") == "true"
                  or not (full_suite == "false" and compile_admitted == "true")
              )
              and (macos_route == "true" or outputs.get("cli") == "true")
          )
          if macos_work_required:
              if macos_result != "success":
                  print(f"macOS workflow did not pass: {macos_result}", file=sys.stderr)
                  sys.exit(1)
          elif macos_result not in {"success", "skipped"}:
              print(f"macOS workflow had unexpected result: {macos_result}", file=sys.stderr)
              sys.exit(1)
          web_result = needs["web"]["result"]
          if web_result not in {"success", "skipped"}:
              print(f"web workflow did not pass: {web_result}", file=sys.stderr)
              sys.exit(1)
          print(f"changes.macos={macos_route}")
          print(f"changes.full_suite={outputs.get('full_suite')}")
          print(f"changes.swift_packages={outputs.get('swift_packages')}")
          print(f"linux-preflight={preflight['result']}")
          print(f"macos={macos_result}")
          print(f"web={web_result}")
          PY

  linux-preflight:
    name: linux-preflight
    # Retain the Linux verdict in the required final statuses. It no longer
    # serializes independent macOS work behind the full Linux suite.
    needs:
      - changes
      - static-preflight
      - guards
      - ghosttykit-release-check
      - web
    # This job exists only to admit macOS work after the cheap layer passes.
    # This replaces the old unconditional `if: ${{ always() }}`: if the change
    # router explicitly says macOS is irrelevant, skip the runner allocation.
    # Missing/invalid route output fails open by running the preflight.
    if: ${{ always() && needs.changes.outputs.macos != 'false' }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 5
    steps:
      - name: Check routed Linux results
        env:
          PREFLIGHT_NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          needs = json.loads(os.environ["PREFLIGHT_NEEDS"])
          required = (
              "changes",
              "static-preflight",
          )
          allowed_routed = {
              "ghosttykit-release-check",
          }

          bad = {}
          for name in required:
              result = needs[name]["result"]
              if result != "success":
                  bad[name] = result

          outputs = needs["changes"].get("outputs", {})
          guard_routes = (
              "linux_guard_tests",
              "linux_guard_history",
              "linux_guard_cli",
              "linux_guard_source",
          )
          invalid_guard_routes = {
              route: outputs.get(route)
              for route in guard_routes
              if outputs.get(route) not in {"true", "false"}
          }
          for route, value in sorted(invalid_guard_routes.items()):
              bad[f"guards.{route}"] = f"invalid route {route}={value!r}"

          guard_result = needs["guards"]["result"]
          if any(outputs.get(route) == "true" for route in guard_routes):
              if guard_result != "success":
                  bad["guards"] = f"{guard_result} (one or more guard routes=true)"
          elif not invalid_guard_routes and guard_result not in {"success", "skipped"}:
              bad["guards"] = guard_result

          web_routes = ("web", "agent_session_web")
          invalid_web_routes = {
              route: outputs.get(route)
              for route in web_routes
              if outputs.get(route) not in {"true", "false"}
          }
          for route, value in sorted(invalid_web_routes.items()):
              bad[f"web.{route}"] = f"invalid route {route}={value!r}"

          web_result = needs["web"]["result"]
          if any(outputs.get(route) == "true" for route in web_routes):
              if web_result != "success":
                  bad["web"] = f"{web_result} (one or more web routes=true)"
          elif not invalid_web_routes and web_result not in {"success", "skipped"}:
              bad["web"] = web_result

          routed_outputs = {
              "ghosttykit-release-check": "ghosttykit_release",
          }
          for name in sorted(allowed_routed):
              result = needs[name]["result"]
              route = routed_outputs[name]
              if outputs.get(route) not in {"true", "false"}:
                  bad[name] = f"invalid route {route}={outputs.get(route)!r}"
              elif outputs.get(route) == "true":
                  if result != "success":
                      bad[name] = f"{result} (route {route}=true)"
              elif result not in {"success", "skipped"}:
                  bad[name] = result

          if bad:
              for name, result in bad.items():
                  print(f"{name}: {result}", file=sys.stderr)
              sys.exit(1)

          print(
              "routes: "
              f"macos={outputs.get('macos')} "
              f"web={outputs.get('web')} "
              f"agent_session_web={outputs.get('agent_session_web')}"
          )
          for name, data in sorted(needs.items()):
              print(f"{name}: {data['result']}")
          PY

  suite-coverage:
    timeout-minutes: 5
    # Compile admission builds the test bundle and stops, so a pull request
    # that edits cmuxTests/ and skips the full suite runs none of the code it
    # changed. The policy that allows the skip is written for a merge queue
    # that no longer gates main, so refuse the run here instead of reporting
    # green on a diff nothing observed. A cmuxTests/ diff selects
    # `app-host unit tests` by itself (choose_ci_suite.py), so it never lands
    # here. What does is cmuxUITests/, which no pull request job executes, and
    # a diff that could not be read: "full-ci" runs everything, and
    # "no-full-ci" records that skipping it is deliberate.
    needs:
      - changes
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.coverage_gap == 'true' }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    steps:
      - name: Require the suite that judges this diff
        run: |
          echo "This pull request changes cmuxUITests/, or its diff could not be" >&2
          echo "read, and this run skipped the macOS suite, so nothing observed it." >&2
          echo "(A cmuxTests/ change runs 'app-host unit tests' automatically.)" >&2
          echo >&2
          echo "No pull request job executes cmuxUITests/. Add the 'full-ci' label" >&2
          echo "to run the suite on a fresh run, or 'no-full-ci' to record that" >&2
          echo "skipping it is deliberate." >&2
          exit 1

  ci-status:
    needs:
      - changes
      - claude-wrapper
      - suite-coverage
      - static-preflight
      - guards
      - ghosttykit-release-check
      - browser
      - remote-daemon
      - web
      - linux-preflight
      - macos-admission-gate
      - macos
      - tests
    if: ${{ always() }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    # One step that reads `needs` and decides. Its siblings are bounded at 5
    # to 20 minutes; this one was inheriting the six-hour default, as the
    # required check every pull request waits on.
    timeout-minutes: 5
    steps:
      - name: Check routed CI jobs
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          needs = json.loads(os.environ["CI_NEEDS"])
          allowed = {"success", "skipped"}
          bad = {
              name: data["result"]
              for name, data in sorted(needs.items())
              if data["result"] not in allowed
          }

          outputs = needs["changes"].get("outputs", {})
          wrapper_required = outputs.get("claude_wrapper") == "true" or (
              outputs.get("macos") == "true" and outputs.get("full_suite") == "true"
          )
          if wrapper_required and needs.get("claude-wrapper", {}).get("result") != "success":
              bad["claude-wrapper"] = needs.get("claude-wrapper", {}).get("result", "missing")

          if bad:
              for name, result in bad.items():
                  print(f"{name}: {result}", file=sys.stderr)
              sys.exit(1)

          for name, data in sorted(needs.items()):
              print(f"{name}: {data['result']}")
          PY
