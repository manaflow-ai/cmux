name: PR 9789 focused package proof

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-package-proof:
    runs-on: tart-macos-15
    timeout-minutes: 25
    env:
      CMUX_CI_XCODE_APP: ${{ vars.CMUX_CI_XCODE_APP_MACOS_15 }}
      CMUX_CI_REQUIRED_MACOS_SDK_MAJOR: "26"
      EXPECTED_SOURCE: 9309c998e6f238839e18b8105933e28cf72aff48
    steps:
      - name: Validate Tart runner identity
        run: |
          set -euo pipefail
          case "${{ runner.name }}" in
            tart-cmux-*) ;;
            *) exit 1 ;;
          esac
          test -f /etc/cmux-tart-ci

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2

      - name: Prove exact green source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_SOURCE"
          git diff --exit-code "$EXPECTED_SOURCE" HEAD -- . ':(exclude).github/workflows/ci.yml'

      - name: Select Xcode
        run: ./scripts/select-ci-xcode.sh

      - name: Run focused recovery worker regression
        run: |
          set -euo pipefail
          swift test \
            --package-path Packages/macOS/CmuxFoundation \
            --filter recoverySweepSchedulingDoesNotBlockStartupOrHideCurrentQueueEntry \
            2>&1 | tee /tmp/cmux-pr9789-package-proof.log
          grep -Eq 'Test run with 2 tests.*passed' /tmp/cmux-pr9789-package-proof.log
