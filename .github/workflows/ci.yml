name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  receipt-order:
    runs-on: ${{ vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2

      - name: Validate receipt publication order
        run: |
          python3 - <<'PY'
          import runpy

          guard = runpy.run_path("tests/test_ci_app_host_home_isolation.py")
          check = guard["require_receipt_before_lease_watcher"]
          check(
              guard["APP_HOST_RECEIPT_CONSTRUCTOR"],
              "test-bundle process receipt",
              "CmuxWatchAppHostAttemptLease(leaseDescriptor)",
          )
          check(
              guard["APP_HOST_RECEIPT_WRITER"],
              "early app process receipt",
              "watchAttemptLease(leaseDescriptor)",
          )
          print("PASS: receipts publish before lease watchers start")
          PY
