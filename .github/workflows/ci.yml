            for attempt in 1 2; do
              suite_output="$RUNNER_TEMP/cmux-remote-tmux-mirror-${suite}-attempt-${attempt}.txt"
              set +e
              scripts/ci/run-in-console-session.sh \
                scripts/ci/run-app-host-xcodebuild.sh \
                -xctestrun "$CMUX_APP_HOST_XCTESTRUN" \
                -destination "platform=macOS" \
                CMUX_SKIP_ZIG_BUILD=1 \
                -only-testing:"cmuxTests/$suite" \
                test-without-building 2>&1 | tee "$suite_output"
              suite_status="${PIPESTATUS[0]}"
              set -e
              if [ "$suite_status" -eq 0 ]; then
                break
              fi
              if [ "$attempt" -eq 1 ] \
                && grep -Fq 'Restarting after unexpected exit, crash, or test timeout' "$suite_output"; then
                echo "::warning::app host crashed while running cmuxTests/${suite} (https://github.com/manaflow-ai/cmux/issues/9348); rerunning the suite once"
                continue
              fi
              echo "cmuxTests/${suite} failed with status ${suite_status} on attempt ${attempt}"
              exit "$suite_status"
            done
