name: Issue 12791 focused packages
run-name: "Issue 12791 packages @ ${{ inputs.source_ref }}"
on:
  workflow_dispatch:
    inputs:
      source_ref:
        required: true
        type: string
permissions:
  contents: read
jobs:
  packages:
    runs-on: blacksmith-6vcpu-macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ inputs.source_ref }}
      - run: git submodule update --init vendor/bonsplit
      - run: ./scripts/select-ci-xcode.sh
      - name: Git watcher lifecycle
        run: swift test --package-path Packages/macOS/CmuxSidebarGit --filter 'WatcherRegistrationLifecycleTests|WatcherSafetyTests'
      - name: Browser discovery
        if: ${{ !cancelled() }}
        run: swift test --package-path Packages/macOS/CmuxBrowser --filter BrowserInstalledBrowserDetector
      - name: Native lifecycle
        if: ${{ !cancelled() }}
        run: swift test --package-path Packages/macOS/CmuxFoundation --filter 'FileSystemEventStreamLifecycleTests|RecursivePathWatcherTests'
