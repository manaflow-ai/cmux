name: PR 9789 fallback ownership red proof

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fallback-red:
    runs-on: tart-macos-15
    timeout-minutes: 20
    env:
      EXPECTED_SOURCE: 3742430fb935c2f3f5a102bf8a29774f8859ffc7
    steps:
      - name: Validate Tart runner identity
        run: |
          case "${{ runner.name }}" in tart-cmux-*) ;; *) exit 1 ;; esac
          test -f /etc/cmux-tart-ci
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2
      - name: Prove exact source
        run: |
          test "$(git rev-parse HEAD^)" = "$EXPECTED_SOURCE"
          git diff --exit-code "$EXPECTED_SOURCE" HEAD -- . ':(exclude).github/workflows/ci.yml'
      - name: Prove fallback ownership fails before the fix
        shell: bash
        run: |
          set +e
          set -uo pipefail
          swift test --package-path Packages/macOS/CmuxFoundation --filter unpublishedFallbackFailurePublishesDurableOwnership 2>&1 | tee /tmp/cmux-pr9789-fallback.log
          fallback_status=${PIPESTATUS[0]}
          set -e
          printf 'fallback status: %s\n' "$fallback_status"
          test "$fallback_status" -ne 0
          grep -F 'unpublishedFallbackFailurePublishesDurableOwnership(shellPath:) recorded an issue' /tmp/cmux-pr9789-fallback.log
          grep -F 'Expectation failed: (result.status → 99) == 0' /tmp/cmux-pr9789-fallback.log
          echo 'RED PROOF ACCEPTED: fallback failure kills only the root on the exact parent'
          exit 1
