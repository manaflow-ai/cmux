      - name: Run remote tmux mirror detach and placement regressions
        id: remote-tmux-mirror
        if: ${{ matrix.shard == fromJSON(env.CMUX_APP_HOST_FOCUSED_REGRESSION_SHARD) }}
        run: |
          # Closing a mirrored workspace must never kill the remote tmux session,
          # and --new-window must consolidate mirrors moved across source windows.
          # Keep these destructive/topology regressions outside the tolerant full
          # suite so an ordinary assertion failure cannot be accepted as expected.
          # The placement case creates three native windows and several
          # Ghostty-backed panels. Run the close and placement suites in separate
          # app-host processes so renderer teardown from one topology workload
          # cannot crash the next before its assertions execute.
          #
          # The app host still crashes intermittently mid-suite here
          # (https://github.com/manaflow-ai/cmux/issues/9348): the crash point
          # moves between tests and the relaunched host passes every remaining
          # test. Rerun a suite once, and only when xcodebuild reports that the
          # host exited, crashed, or timed out. An assertion failure never earns
          # a rerun, and a second crash still fails the shard.
          set -euo pipefail
          rm -f -- "$RUNNER_TEMP"/cmux-remote-tmux-mirror-*.txt
          for suite in \
            RemoteTmuxMirrorCloseDetachTests \
            RemoteTmuxMirrorFocusPolicyTests \
            RemoteTmuxMirrorDedicatedPlacementTests
