name: PR 9789 hosted freeze diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-diagnostic:
    runs-on: tart-macos-15
    timeout-minutes: 20
    steps:
      - name: Validate Tart runner identity
        run: |
          set -euo pipefail
          case "${{ runner.name }}" in
            tart-cmux-*) ;;
            *) exit 1 ;;
          esac
          test -f /etc/cmux-tart-ci
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2
      - name: Prove diagnostic parent
        run: test "$(git rev-parse HEAD^)" = 9f038ab9a799c699f674ceeed3ab4458b55b7122
      - name: Run hosted diagnostics
        shell: bash
        run: |
          set +e
          set -uo pipefail
          swift test --package-path Packages/macOS/CmuxFoundation --filter unpublishedCleanupFreezesRootBeforePublisherSetup 2>&1 | tee /tmp/unpublished.log
          unpublished_status=${PIPESTATUS[0]}
          swift test --package-path Packages/macOS/CmuxFoundation --filter schedulesRecoveryAfterNewAuthenticationGroupIsQueued 2>&1 | tee /tmp/group.log
          group_status=${PIPESTATUS[0]}
          printf 'diagnostic statuses: unpublished=%s group=%s\n' "$unpublished_status" "$group_status"
          exit 1
