name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ssh-recovery-identity:
    runs-on: warp-macos-15-arm64-6x
    timeout-minutes: 20
    env:
      CMUX_CI_XCODE_APP: ${{ vars.CMUX_CI_XCODE_APP_MACOS_15 }}
      CMUX_CI_REQUIRED_MACOS_SDK_MAJOR: "26"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - run: ./scripts/select-ci-xcode.sh
      - name: Run SSH recovery identity regressions
        run: |
          set -uo pipefail
          run_filter() {
            local name="$1" filter="$2" pattern="$3" output status
            status=0
            output="$(swift test --package-path Packages/macOS/CmuxFoundation --filter "$filter" 2>&1)" || status=$?
            printf '%s\n' "$output"
            if ! printf '%s\n' "$output" | grep -Eq "$pattern"; then exit 96; fi
            printf '%s=%s\n' "$name" "$status"
            return "$status"
          }
          statuses=()
          run_filter stable SSHForegroundAuthenticationRetryPolicyTests.stableIdentityUsesKernelStartTimestamp 'Test stableIdentityUsesKernelStartTimestamp\(shellPath:\) with 2 test cases (passed|failed)' || statuses+=(stable:$?)
          run_filter publisher SSHForegroundAuthenticationRetryPolicyTests.publishesWorkerIdentityUsingKernelProcessLayout 'Test publishesWorkerIdentityUsingKernelProcessLayout\(shellPath:\) with 2 test cases (passed|failed)' || statuses+=(publisher:$?)
          run_filter conservative SSHForegroundAuthenticationRetryPolicyTests.cleanupOwnerReadFailureDoesNotProveAbandonment 'Test cleanupOwnerReadFailureDoesNotProveAbandonment\(shellPath:\) with 2 test cases (passed|failed)' || statuses+=(conservative:$?)
          run_filter retry SSHPTYAttachRetryScriptBuilderTests.retriesLocalRecoveryQueueCapacityBeforeAuthentication 'Test retriesLocalRecoveryQueueCapacityBeforeAuthentication\(\) (passed|failed)' || statuses+=(retry:$?)
          run_filter bounded SSHPTYAttachRetryScriptBuilderTests.boundsLocalRecoveryQueueCapacityRetries 'Test boundsLocalRecoveryQueueCapacityRetries\(\) (passed|failed)' || statuses+=(bounded:$?)
          run_filter queue SSHForegroundAuthenticationRetryPolicyTests.recoveryQueueDeduplicatesAndCapsPendingGroups 'Test recoveryQueueDeduplicatesAndCapsPendingGroups\(shellPath:\) with 2 test cases (passed|failed)' || statuses+=(queue:$?)
          run_filter delayed SSHForegroundAuthenticationRetryPolicyTests.recoverySchedulerRunsDelayedSweepAfterPassLimit 'Test recoverySchedulerRunsDelayedSweepAfterPassLimit\(shellPath:\) with 2 test cases (passed|failed)' || statuses+=(delayed:$?)
          printf 'failures=%s\n' "${statuses[*]:-none}"
          [ "${#statuses[@]}" -eq 0 ]
