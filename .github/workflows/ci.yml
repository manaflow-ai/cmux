name: PR 9789 final owner paths green proof

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  final-owner-paths-green:
    runs-on: tart-macos-15
    timeout-minutes: 20
    env:
      EXPECTED_SOURCE: 663916d21480eb08ce75b97ee078abb247a2416b
    steps:
      - name: Validate Tart runner identity
        run: |
          case "${{ runner.name }}" in tart-cmux-*) ;; *) exit 1 ;; esac
          test -f /etc/cmux-tart-ci
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2
      - name: Prove exact source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_SOURCE"
          git diff --exit-code "$EXPECTED_SOURCE" HEAD -- . ':(exclude).github/workflows/ci.yml'
      - name: Prove owner publication receives final paths
        shell: bash
        run: |
          set -euo pipefail
          swift test --package-path Packages/macOS/CmuxFoundation --filter workerPublicationUsesFinalOwnerPaths 2>&1 | tee /tmp/cmux-pr9789-owner-paths-green.log
          grep -F 'workerPublicationUsesFinalOwnerPaths(shellPath:) with 2 test cases passed' /tmp/cmux-pr9789-owner-paths-green.log
          echo 'GREEN PROOF ACCEPTED: exact fixed source passes final paths to the owner publisher'
