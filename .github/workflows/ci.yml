name: PR 9789 exact-head focused proof

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-package-proof:
    runs-on: tart-macos-15
    timeout-minutes: 25
    env:
      CMUX_CI_XCODE_APP: ${{ vars.CMUX_CI_XCODE_APP_MACOS_15 }}
      CMUX_CI_REQUIRED_MACOS_SDK_MAJOR: "26"
      EXPECTED_SOURCE: b3e7602c73baf503679d1e8eede851e3116702ee
    steps:
      - name: Validate Tart runner identity
        run: |
          set -euo pipefail
          case "${{ runner.name }}" in
            tart-cmux-*) ;;
            *) exit 1 ;;
          esac
          test -f /etc/cmux-tart-ci

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2

      - name: Prove exact source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_SOURCE"
          git diff --exit-code "$EXPECTED_SOURCE" HEAD -- . ':(exclude).github/workflows/ci.yml'

      - name: Select Xcode
        run: ./scripts/select-ci-xcode.sh

      - name: Run focused cleanup regressions
        shell: bash
        run: |
          set +e
          set -uo pipefail
          swift test --package-path Packages/macOS/CmuxFoundation --filter recoverySweepSchedulingDoesNotBlockStartupOrHideCurrentQueueEntry 2>&1 | tee /tmp/cmux-pr9789-worker.log
          worker_status=${PIPESTATUS[0]}
          swift test --package-path Packages/macOS/CmuxFoundation --filter unpublishedCleanupFreezesRootBeforePublisherSetup 2>&1 | tee /tmp/cmux-pr9789-unpublished.log
          unpublished_status=${PIPESTATUS[0]}
          swift test --package-path Packages/macOS/CmuxFoundation --filter liveReaperLockOwnerSurvivesTransientIdentityReadFailure 2>&1 | tee /tmp/cmux-pr9789-lock.log
          lock_status=${PIPESTATUS[0]}
          set -e
          printf 'focused statuses: worker=%s unpublished=%s lock=%s\n' "$worker_status" "$unpublished_status" "$lock_status"
          test "$worker_status" -eq 0
          test "$unpublished_status" -eq 0
          test "$lock_status" -eq 0
          grep -F 'recoverySweepSchedulingDoesNotBlockStartupOrHideCurrentQueueEntry(shellPath:) with 2 test cases passed' /tmp/cmux-pr9789-worker.log
          grep -F 'unpublishedCleanupFreezesRootBeforePublisherSetup(shellPath:) with 2 test cases passed' /tmp/cmux-pr9789-unpublished.log
          grep -F 'liveReaperLockOwnerSurvivesTransientIdentityReadFailure(shellPath:) with 2 test cases passed' /tmp/cmux-pr9789-lock.log
          echo 'GREEN PROOF: all focused regressions passed on the corrected exact head'
