name: PR 9789 final owner paths red proof

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  final-owner-paths-red:
    runs-on: tart-macos-15
    timeout-minutes: 20
    env:
      EXPECTED_SOURCE: f1a41024c6f72eda16c82c96570c1d5cea9d33af
    steps:
      - name: Validate Tart runner identity
        run: |
          case "${{ runner.name }}" in tart-cmux-*) ;; *) exit 1 ;; esac
          test -f /etc/cmux-tart-ci
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2
      - name: Prove exact source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_SOURCE"
          git diff --exit-code "$EXPECTED_SOURCE" HEAD -- . ':(exclude).github/workflows/ci.yml'
      - name: Prove owner publication receives temporary paths
        shell: bash
        run: |
          set +e
          set -uo pipefail
          swift test --package-path Packages/macOS/CmuxFoundation --filter workerPublicationUsesFinalOwnerPaths 2>&1 | tee /tmp/cmux-pr9789-owner-paths-red.log
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -ne 0
          grep -F 'workerPublicationUsesFinalOwnerPaths(shellPath:)' /tmp/cmux-pr9789-owner-paths-red.log
          grep -F 'recorded an issue' /tmp/cmux-pr9789-owner-paths-red.log
          echo 'RED PROOF ACCEPTED: exact test-only source passes temporary paths to the owner publisher'
          exit 1
