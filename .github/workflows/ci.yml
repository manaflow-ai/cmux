name: PR 9789 exact cleanup ownership proof

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-package-proof:
    runs-on: tart-macos-15
    timeout-minutes: 25
    env:
      EXPECTED_SOURCE: 2a4b23870f190d92b12adb8df8f9c4755998e949
    steps:
      - name: Validate Tart runner identity
        run: |
          case "${{ runner.name }}" in tart-cmux-*) ;; *) exit 1 ;; esac
          test -f /etc/cmux-tart-ci
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2
      - name: Prove exact source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_SOURCE"
          git diff --exit-code "$EXPECTED_SOURCE" HEAD -- . ':(exclude).github/workflows/ci.yml'
      - name: Run focused cleanup regressions
        shell: bash
        run: |
          set +e
          set -uo pipefail
          swift test --package-path Packages/macOS/CmuxFoundation --filter recoverySweepSchedulingDoesNotBlockStartupOrHideCurrentQueueEntry 2>&1 | tee /tmp/cmux-pr9789-worker.log
          worker_status=${PIPESTATUS[0]}
          swift test --package-path Packages/macOS/CmuxFoundation --filter unpublishedCleanupFreezesRootBeforePublisherSetup 2>&1 | tee /tmp/cmux-pr9789-unpublished.log
          unpublished_status=${PIPESTATUS[0]}
          swift test --package-path Packages/macOS/CmuxFoundation --filter liveReaperLockOwnerSurvivesTransientIdentityReadFailure 2>&1 | tee /tmp/cmux-pr9789-lock.log
          lock_status=${PIPESTATUS[0]}
          swift test --package-path Packages/macOS/CmuxFoundation --filter schedulesRecoveryAfterNewAuthenticationGroupIsQueued 2>&1 | tee /tmp/cmux-pr9789-group-schedule.log
          group_schedule_status=${PIPESTATUS[0]}
          swift test --package-path Packages/macOS/CmuxFoundation --filter authenticationGroupCreationFailureHonorsPendingSignal 2>&1 | tee /tmp/cmux-pr9789-group-signal.log
          group_signal_status=${PIPESTATUS[0]}
          swift test --package-path Packages/macOS/CmuxFoundation --filter unpublishedFallbackFailurePublishesDurableOwnership 2>&1 | tee /tmp/cmux-pr9789-fallback.log
          fallback_status=${PIPESTATUS[0]}
          swift test --package-path Packages/macOS/CmuxFoundation --filter failedDurableFallbackRetriesInProcessCleanup 2>&1 | tee /tmp/cmux-pr9789-handoff-retry.log
          handoff_retry_status=${PIPESTATUS[0]}
          swift test --package-path Packages/macOS/CmuxFoundation --filter cleanupRetryRetainsReparentedOwnedIdentity 2>&1 | tee /tmp/cmux-pr9789-owned-retry.log
          owned_retry_status=${PIPESTATUS[0]}
          set -e
          printf 'focused statuses: worker=%s unpublished=%s lock=%s group_schedule=%s group_signal=%s fallback=%s handoff_retry=%s owned_retry=%s\n' "$worker_status" "$unpublished_status" "$lock_status" "$group_schedule_status" "$group_signal_status" "$fallback_status" "$handoff_retry_status" "$owned_retry_status"
          test "$worker_status" -eq 0
          test "$unpublished_status" -eq 0
          test "$lock_status" -eq 0
          test "$group_schedule_status" -eq 0
          test "$group_signal_status" -eq 0
          test "$fallback_status" -eq 0
          test "$handoff_retry_status" -eq 0
          test "$owned_retry_status" -eq 0
          grep -F 'recoverySweepSchedulingDoesNotBlockStartupOrHideCurrentQueueEntry(shellPath:) with 2 test cases passed' /tmp/cmux-pr9789-worker.log
          grep -F 'unpublishedCleanupFreezesRootBeforePublisherSetup(shellPath:) with 2 test cases passed' /tmp/cmux-pr9789-unpublished.log
          grep -F 'liveReaperLockOwnerSurvivesTransientIdentityReadFailure(shellPath:) with 2 test cases passed' /tmp/cmux-pr9789-lock.log
          grep -F 'schedulesRecoveryAfterNewAuthenticationGroupIsQueued() passed' /tmp/cmux-pr9789-group-schedule.log
          grep -F 'authenticationGroupCreationFailureHonorsPendingSignal() passed' /tmp/cmux-pr9789-group-signal.log
          grep -F 'unpublishedFallbackFailurePublishesDurableOwnership(shellPath:) with 2 test cases passed' /tmp/cmux-pr9789-fallback.log
          grep -F 'failedDurableFallbackRetriesInProcessCleanup(shellPath:) with 2 test cases passed' /tmp/cmux-pr9789-handoff-retry.log
          grep -F 'cleanupRetryRetainsReparentedOwnedIdentity(shellPath:) with 2 test cases passed' /tmp/cmux-pr9789-owned-retry.log
          echo 'GREEN PROOF: all eight focused regressions passed on the exact final head'
