name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolate-unauthorized-refresh:
    name: HostRuntime unauthorized refresh
    runs-on: warp-macos-15-arm64-6x
    timeout-minutes: 10
    env:
      CMUX_CI_XCODE_APP: ${{ vars.CMUX_CI_XCODE_APP_MACOS_15 }}
      CMUX_CI_REQUIRED_MACOS_SDK_MAJOR: "26"
    steps:
      - name: Checkout exact diagnostic SHA
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Select Xcode
        run: ./scripts/select-ci-xcode.sh

      - name: Run suspected hanging method
        run: |
          python3 scripts/ci/run_with_timeout.py \
            --timeout-seconds 45 \
            -- swift test \
              --package-path Packages/Shared/CmuxIrohTransport \
              --filter unauthorizedRegistrationRefreshDeactivatesActiveEndpoint
