name: PR 9789 bounded ownership handoff red proof

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ownership-handoff-red:
    runs-on: tart-macos-15
    timeout-minutes: 20
    env:
      EXPECTED_SOURCE: 9b8265585d24bd8053b1b816ad99bfa0235e1293
    steps:
      - name: Validate Tart runner identity
        run: |
          case "${{ runner.name }}" in tart-cmux-*) ;; *) exit 1 ;; esac
          test -f /etc/cmux-tart-ci
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2
      - name: Prove exact source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_SOURCE"
          git diff --exit-code "$EXPECTED_SOURCE" HEAD -- . ':(exclude).github/workflows/ci.yml'
      - name: Prove the test-only source exposes both ownership defects
        shell: bash
        run: |
          set +e
          set -uo pipefail
          swift test --package-path Packages/macOS/CmuxFoundation --filter unpublishedFallbackFailurePublishesDurableOwnership 2>&1 | tee /tmp/cmux-pr9789-descendants-red.log
          descendants_status=${PIPESTATUS[0]}
          swift test --package-path Packages/macOS/CmuxFoundation --filter failedOwnershipHandoffUsesBoundedBackgroundOwner 2>&1 | tee /tmp/cmux-pr9789-bounds-red.log
          bounds_status=${PIPESTATUS[0]}
          set -e
          printf 'red statuses: descendants=%s bounds=%s\n' "$descendants_status" "$bounds_status"
          test "$descendants_status" -ne 0
          test "$bounds_status" -ne 0
          grep -F 'unpublishedFallbackFailurePublishesDurableOwnership(shellPath:) recorded an issue' /tmp/cmux-pr9789-descendants-red.log
          grep -F 'failedOwnershipHandoffUsesBoundedBackgroundOwner() recorded an issue' /tmp/cmux-pr9789-bounds-red.log
          echo 'RED PROOF ACCEPTED: exact test-only source loses descendants and has no bounded background owner'
          exit 1
