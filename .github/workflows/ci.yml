name: PR 9789 cleanup retry ownership red proof

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup-retry-red:
    runs-on: tart-macos-15
    timeout-minutes: 20
    env:
      EXPECTED_SOURCE: f90957996fb2bb70932596eb3e5b03fd3be0241a
    steps:
      - name: Validate Tart runner identity
        run: |
          case "${{ runner.name }}" in tart-cmux-*) ;; *) exit 1 ;; esac
          test -f /etc/cmux-tart-ci
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2
      - name: Prove exact source
        run: |
          test "$(git rev-parse HEAD^)" = "$EXPECTED_SOURCE"
          git diff --exit-code "$EXPECTED_SOURCE" HEAD -- . ':(exclude).github/workflows/ci.yml'
      - name: Prove both retry ownership regressions fail before the fix
        shell: bash
        run: |
          set +e
          set -uo pipefail
          swift test --package-path Packages/macOS/CmuxFoundation --filter failedDurableFallbackRetriesInProcessCleanup 2>&1 | tee /tmp/cmux-pr9789-handoff-retry.log
          handoff_retry_status=${PIPESTATUS[0]}
          swift test --package-path Packages/macOS/CmuxFoundation --filter cleanupRetryRetainsReparentedOwnedIdentity 2>&1 | tee /tmp/cmux-pr9789-owned-retry.log
          owned_retry_status=${PIPESTATUS[0]}
          set -e
          printf 'retry red statuses: handoff=%s owned=%s\n' "$handoff_retry_status" "$owned_retry_status"
          test "$handoff_retry_status" -ne 0
          test "$owned_retry_status" -ne 0
          grep -F 'failedDurableFallbackRetriesInProcessCleanup(shellPath:) recorded an issue' /tmp/cmux-pr9789-handoff-retry.log
          grep -F 'cleanupRetryRetainsReparentedOwnedIdentity(shellPath:) recorded an issue' /tmp/cmux-pr9789-owned-retry.log
          grep -F 'Expectation failed: (result.status → 99) == 0' /tmp/cmux-pr9789-handoff-retry.log
          grep -F 'Expectation failed: (result.status → 99) == 0' /tmp/cmux-pr9789-owned-retry.log
          echo 'RED PROOF ACCEPTED: retry ownership fails on the exact test-only parent'
          exit 1
