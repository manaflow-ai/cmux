name: E2E test with video recording
run-name: ${{ inputs.test_filter }} on ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || ((!inputs.runner || inputs.runner == 'auto') && (vars.MACOS_RUNNER_TESTS || 'blacksmith-6vcpu-macos-26') || inputs.runner) }} @ ${{ inputs.ref || github.ref_name }}${{ inputs.dispatch_id != '' && format(' [{0}]', inputs.dispatch_id) || '' }}

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, full SHA, or short SHA to test
        required: false
        default: ""
      test_filter:
        description: "Test class or class/method, or a comma-separated list sharing one target; optionally target-qualified as cmuxUITests/Class or cmuxTests/Class"
        required: true
      dispatch_id:
        description: "Optional caller-generated id echoed into the run name so dispatchers can resolve their exact run"
        required: false
        default: ""
      test_timeout:
        description: "Per-test timeout in seconds"
        required: false
        default: "120"
      job_timeout:
        description: "Timeout in minutes for building and for testing; the build job, which also runs the tests, gets twice this"
        required: false
        default: "45"
      record_video:
        description: Record the virtual display during UI tests
        required: false
        default: true
        type: boolean
      runner:
        description: "Runner OS (auto follows MACOS_RUNNER_TESTS; on the 6vcpu macOS 26 default it takes the pool pull request CI would: an owned Mac with a free slot when CI_PR_POOL_OWNED is 1, else 12vcpu while it has headroom, else 6vcpu; glaeda-* are the owned Macs and record no video)"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - blacksmith-6vcpu-macos-15
          - blacksmith-6vcpu-macos-26
          - blacksmith-12vcpu-macos-26
          - blacksmith-6vcpu-macos-latest
          - glaeda-std-xcode-26.6

# run-name and the concurrency group cannot read job outputs, so they spell
# `auto` as the 6vcpu default even when the runner job routes the run to
# the 12vcpu pool. Every auto dispatch of one ref and filter still shares a
# group, so a newer one still cancels the older wherever it landed. run-e2e.sh
# names the pool it chose explicitly, so its titles are exact.
concurrency:
  group: e2e-${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || ((!inputs.runner || inputs.runner == 'auto') && (vars.MACOS_RUNNER_TESTS || 'blacksmith-6vcpu-macos-26') || inputs.runner) }}-${{ inputs.ref || github.ref_name }}-${{ inputs.test_filter }}
  cancel-in-progress: true

# This lane checks out and compiles a dispatcher-chosen ref, so it should hold
# the narrowest token that still works. It reads the repository, downloads a
# public GhosttyKit release over plain curl, and uploads its own artifacts;
# none of that needs a writable token.
permissions:
  contents: read

jobs:
  resolve-ref:
    uses: ./.github/workflows/resolve-dispatch-ref.yml
    with:
      ref: ${{ inputs.ref }}

  runner:
    # The macOS pool build and test run on. `auto` follows MACOS_RUNNER_TESTS.
    # On the 6vcpu macOS 26 default an E2E run takes a macOS 26 pool by pull
    # request CI's rule (pr_runner_pool.py): the first pool in CI_PR_POOL_ORDER
    # (12vcpu, then 6vcpu) with a machine free and no release or nightly job
    # queued on it, else the shorter queue in rounds. Every Blacksmith
    # pool is sponsored; only a queued release or nightly job holds 12vcpu
    # back. Any error reading the queue stays on 6vcpu, and
    # CI_E2E_LARGE_POOL_OVERFLOW=0 turns the choice off. run-e2e.sh applies the
    # same rule from the same script. With CI_PR_POOL_OWNED=1 an owned Mac
    # (glaeda-*) comes first while its job starts within CI_PR_POOL_QUEUE_ROUNDS
    # job lengths and no later than on Blacksmith, as for pull requests. A job an owned Mac leaves queued or refuses is re-run by
    # ci-owned-pool-rescue.yml, and every re-run attempt of build or test takes
    # retry_label (Blacksmith) instead, so a busy Mac never strands a run.
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 5
    # Reads the queue janitor's pool snapshot and the runs created since it
    # (four API calls at most; see e2e_runner_pool.py for the budget).
    permissions:
      contents: read
      actions: read
    outputs:
      # e2e_runner_pool.py only knows the manaflow-ai pools, so a fork takes
      # the GitHub-hosted image here, as in run-name and the concurrency group.
      label: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || steps.pool.outputs.label }}
      # What build and test take from attempt 2 on: the label, except that an
      # owned Mac becomes the 6vcpu macOS 26 pool (same Xcode build).
      retry_label: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || steps.pool.outputs.retry_label }}
    steps:
      # The helper comes from this workflow's revision, not the tested one,
      # which may predate it.
      - name: Checkout pool helper
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: |
            scripts/ci/e2e_runner_pool.py
            scripts/ci/pr_runner_pool.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Pick the macOS pool
        id: pool
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REQUESTED_RUNNER: ${{ inputs.runner }}
          RUNNER_VARIABLE: ${{ vars.MACOS_RUNNER_TESTS }}
          LARGE_POOL_OVERFLOW: ${{ vars.CI_E2E_LARGE_POOL_OVERFLOW }}
          POOL_ORDER: ${{ vars.CI_PR_POOL_ORDER }}
          POOL_MAX_QUEUED: ${{ vars.CI_PR_POOL_MAX_QUEUED }}
          POOL_QUEUE_ROUNDS: ${{ vars.CI_PR_POOL_QUEUE_ROUNDS }}
          POOL_OWNED: ${{ vars.CI_PR_POOL_OWNED }}
          OWNED_SLOTS: ${{ vars.CI_OWNED_POOL_SLOTS }}
          PR_XCODE_APP: ${{ vars.CMUX_CI_XCODE_APP_PR }}
          TEST_FILTER: ${{ inputs.test_filter }}
          OWNED_UI: ${{ vars.CI_E2E_OWNED_UI }}
        run: |
          set -euo pipefail
          label="$(python3 scripts/ci/e2e_runner_pool.py \
            --requested "$REQUESTED_RUNNER" \
            --variable "$RUNNER_VARIABLE" \
            --overflow "$LARGE_POOL_OVERFLOW" \
            --order "$POOL_ORDER" \
            --max-queued "$POOL_MAX_QUEUED" \
            --queue-rounds "$POOL_QUEUE_ROUNDS" \
            --owned "$POOL_OWNED" \
            --owned-slots "$OWNED_SLOTS" \
            --pr-xcode-app "$PR_XCODE_APP" \
            --test-filter "$TEST_FILTER" \
            --owned-ui "$OWNED_UI")"
          retry_label="$(python3 scripts/ci/e2e_runner_pool.py --retry-of "$label")"
          {
            echo "label=$label"
            echo "retry_label=$retry_label"
          } >> "$GITHUB_OUTPUT"
          echo "Runner: $label (requested ${REQUESTED_RUNNER:-auto}; a re-run takes $retry_label)"

      # ci-owned-pool-rescue.yml's sweeper watches a run
      # with this marker and re-runs a job an owned Mac leaves queued or
      # refuses. Fail-safe: without it the run is only not watched.
      - name: Mark a run on a persistent macOS pool
        id: marker
        if: ${{ startsWith(steps.pool.outputs.label, 'glaeda-') && github.run_attempt == 1 }}
        continue-on-error: true
        run: |
          set -euo pipefail
          marker="$RUNNER_TEMP/macos-pool-persistent.json"
          echo '{}' > "$marker"
          echo "path=$marker" >> "$GITHUB_OUTPUT"

      - name: Upload the persistent pool marker
        if: ${{ steps.marker.outputs.path != '' }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-pool-persistent-${{ github.run_id }}-${{ github.run_attempt }}-1-${{ steps.pool.outputs.label }}
          path: ${{ steps.marker.outputs.path }}
          retention-days: 1

      # The owned-pool rescue sweeper (ci-owned-pool-rescue.yml) finds the runs
      # it watches by this fixed name, one listing for all of them.
      - name: Upload the owned-pool watch marker
        if: ${{ steps.marker.outputs.path != '' }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: owned-pool-watch
          path: ${{ steps.marker.outputs.path }}
          retention-days: 1

  filter:
    # Seconds on Linux, and it rejects a malformed selector before either
    # macOS job is scheduled. After the build/test split a bad filter would
    # otherwise surface only once a full compile had already been paid for.
    # It reads the pool only to turn video off on owned Macs.
    needs: [runner]
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    outputs:
      target: ${{ steps.filter.outputs.target }}
      filter: ${{ steps.filter.outputs.filter }}
      selector: ${{ steps.filter.outputs.selector }}
      selectors: ${{ steps.filter.outputs.selectors }}
      count: ${{ steps.filter.outputs.count }}
      record_video: ${{ steps.filter.outputs.record_video }}
      build_timeout: ${{ steps.filter.outputs.build_timeout }}
    steps:
      - name: Normalize test filter
        id: filter
        env:
          TEST_FILTER_INPUT: ${{ inputs.test_filter }}
          RECORD_VIDEO_INPUT: ${{ inputs.record_video }}
          RUNNER_LABEL: ${{ needs.runner.outputs.label }}
          JOB_TIMEOUT: ${{ inputs.job_timeout || '45' }}
        run: |
          set -euo pipefail
          # The build job compiles and then runs the tests, each of which
          # job_timeout used to bound in a job of its own. Expressions have no
          # arithmetic, so its doubled budget is computed here.
          case "$JOB_TIMEOUT" in
            ''|*[!0-9]*)
              echo "::error::job_timeout must be a whole number of minutes, got '$JOB_TIMEOUT'"
              exit 1
              ;;
          esac
          raw_filter="$TEST_FILTER_INPUT"
          if [ -z "$raw_filter" ]; then
            echo "::error::test_filter must not be empty"
            exit 1
          fi

          # A comma-separated list runs several selectors against one compile.
          # Dispatchers chasing one flake routinely fire several filters at the
          # same commit seconds apart, and each of those runs paid its own cold
          # build of identical source.
          # A trailing field is never visited by the split loop below, so
          # "cmuxTests/AlphaTests," would otherwise pass as a single selector
          # instead of failing the empty-entry check.
          case "$raw_filter" in
            ,*|*,)
              echo "::error::test_filter '$raw_filter' has a leading or trailing comma"
              exit 1
              ;;
          esac

          selectors=""
          filters=""
          test_target=""
          count=0
          rest="$raw_filter"
          while [ -n "$rest" ]; do
            case "$rest" in
              *,*) entry="${rest%%,*}"; rest="${rest#*,}" ;;
              *) entry="$rest"; rest="" ;;
            esac
            # Tolerate spaces after commas without accepting interior spaces.
            entry="${entry# }"
            entry="${entry% }"
            if [ -z "$entry" ]; then
              echo "::error::test_filter '$raw_filter' has an empty entry"
              exit 1
            fi

            case "$entry" in
              cmuxTests/*)
                entry_target="cmuxTests"
                entry_filter="${entry#cmuxTests/}"
                ;;
              cmuxUITests/*)
                entry_target="cmuxUITests"
                entry_filter="${entry#cmuxUITests/}"
                ;;
              *)
                # Back-compat: bare Class or Class/method continues to target UI tests.
                entry_target="cmuxUITests"
                entry_filter="$entry"
                ;;
            esac

            if [ -z "$entry_filter" ]; then
              echo "::error::test_filter entry '$entry' is missing a class or class/method after '$entry_target/'"
              exit 1
            fi

            case "$entry_filter" in
              /*|*//*|*\ *)
                echo "::error::test_filter entry '$entry' is not a valid class or class/method selector"
                exit 1
                ;;
            esac

            if [ -z "$test_target" ]; then
              test_target="$entry_target"
            elif [ "$test_target" != "$entry_target" ]; then
              # One xcodebuild invocation runs one scheme. Mixing targets would
              # need two, which is a larger change than batching one burst.
              echo "::error::test_filter may not mix cmuxTests and cmuxUITests entries: '$raw_filter'"
              exit 1
            fi

            case ",$selectors," in
              *",$entry_target/$entry_filter,"*)
                echo "::error::test_filter repeats '$entry_target/$entry_filter'"
                exit 1
                ;;
            esac

            selectors="${selectors:+$selectors,}$entry_target/$entry_filter"
            filters="${filters:+$filters,}$entry_filter"
            count=$((count + 1))
          done

          # The first entry keeps the single-selector outputs meaningful for
          # steps that still reason about one filter.
          normalized_filter="${filters%%,*}"
          test_selector="${selectors%%,*}"
          record_video_effective="false"
          if [ "$test_target" = "cmuxUITests" ] && [ "$RECORD_VIDEO_INPUT" = "true" ]; then
            record_video_effective="true"
          fi
          # Owned Macs (glaeda-*) keep SIP on, so the workflow cannot grant
          # screen capture through the TCC database the way it does on
          # Blacksmith. Their tests run without video rather than fail on it.
          case "$RUNNER_LABEL" in
            glaeda-*)
              if [ "$record_video_effective" = "true" ]; then
                echo "::notice::No video on owned Mac $RUNNER_LABEL; the tests still run."
              fi
              record_video_effective="false"
              ;;
          esac

          {
            echo "target=$test_target"
            echo "filter=$normalized_filter"
            echo "selector=$test_selector"
            echo "selectors=$selectors"
            echo "count=$count"
            echo "record_video=$record_video_effective"
            echo "build_timeout=$((JOB_TIMEOUT * 2))"
          } >> "$GITHUB_OUTPUT"

          echo "Requested filter: $raw_filter"
          echo "Resolved target: $test_target"
          echo "Resolved selectors ($count): $selectors"

  sibling:
    # Dispatches of one commit with other selectors run in other concurrency
    # groups, so each compiled the same product. When an earlier dispatch is
    # already compiling this revision on the same macOS, wait for it here, on
    # Linux, so this run holds no macOS runner meanwhile; the build job then
    # adopts that product through its reuse step. See e2e_sibling_build.py.
    needs: [resolve-ref, runner]
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    steps:
      # The helper comes from this workflow's revision, not the tested one,
      # which may predate it.
      - name: Checkout sibling helper
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: scripts/ci/e2e_sibling_build.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # A seed dispatch exists to compile, and never adopts a product.
      - name: Wait for an earlier compile of this revision
        if: ${{ !startsWith(inputs.dispatch_id, 'e2e-derived-data-seed-') }}
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_REF: ${{ needs.resolve-ref.outputs.sha }}
          CMUX_PRODUCT_RUNNER: ${{ needs.runner.outputs.label }}
          CMUX_E2E_SIBLING_WAIT_SECONDS: "1800"
        # Waiting is an economy, never a gate: every outcome compiles or adopts.
        run: python3 scripts/ci/e2e_sibling_build.py wait || true

  build:
    needs: [resolve-ref, filter, runner, sibling]
    # The sibling wait never gates the build.
    if: ${{ !cancelled() && needs.resolve-ref.result == 'success' && needs.filter.result == 'success' && needs.runner.result == 'success' }}
    runs-on: ${{ github.run_attempt > 1 && needs.runner.outputs.retry_label || needs.runner.outputs.label }}
    # Reuse lists this contract's artifacts and downloads one from an earlier
    # run. Nothing else in this lane reads the Actions API, and nothing writes.
    permissions:
      contents: read
      actions: read
    # Compiles, then runs the tests on the same runner (see "Run the
    # selected tests here"), so the budget covers both.
    timeout-minutes: ${{ fromJSON(needs.filter.outputs.build_timeout) }}
    outputs:
      # Whether this job went on to run the tests itself. The `test` job runs
      # only when it did not.
      tested: ${{ steps.test-here.outputs.tested }}
      # One of the two upload steps runs.
      artifact_id: ${{ steps.upload-product.outputs.artifact-id || steps.upload-product-after-tests.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload-product.outputs.artifact-digest || steps.upload-product-after-tests.outputs.artifact-digest }}
      sha256: ${{ steps.package.outputs.sha256 }}
      product_contract: ${{ steps.product-key.outputs.key }}
      xcode_app: ${{ env.CMUX_CI_XCODE_APP }}
    env:
      TEST_REF: ${{ needs.resolve-ref.outputs.sha }}
      CMUX_CI_MAX_MACOS_SDK_MAJOR: "26"
      # The DerivedData seed key hashes `xcodebuild -version`, and
      # seed-derived-data.yml builds seeds on the macOS 26 pull-request pool
      # with CMUX_CI_XCODE_APP_PR. On a macOS 26 runner take that pin so a seed
      # can match; elsewhere keep select-ci-xcode.sh's pool default, which is
      # the only Xcode the macOS 15 image carries (as pr_runner_pool.py pairs
      # them).
      # An owned Mac's label (glaeda-<class>-xcode-<version>) names that same
      # pin, and a re-run of it takes a macOS 26 pool.
      CMUX_CI_XCODE_APP: ${{ (contains(needs.runner.outputs.label, 'macos-26') || startsWith(needs.runner.outputs.label, 'glaeda-')) && vars.CMUX_CI_XCODE_APP_PR || '' }}
      # Match the compile-admission contract so an E2E dispatch can adopt the
      # product a pull request already compiled for the same revision.
      # contract() hashes the Xcode and SDK that were selected, not the
      # CMUX_CI_XCODE_APP selector, so this lane need not pin Xcode the way
      # ci.yml does, nor run on the same runner size: it has to land on the
      # same Xcode build and macOS major. The intra-run handoff uses the
      # artifact id, not the name, so nothing here depends on it.
      CMUX_SKIP_ZIG_BUILD: "1"
      CMUX_PRODUCT_RUNNER: ${{ github.run_attempt > 1 && needs.runner.outputs.retry_label || needs.runner.outputs.label }}
    steps:
      - name: Verify GitHub-hosted route
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          REQUESTED_RUNNER: ${{ needs.runner.outputs.label }}
          RUNNER_CONTEXT_NAME: ${{ runner.name }}
        run: |
          # The self-hosted fleet also carries a macos-26 label, so a macos-*
          # request must prove it landed on GitHub-hosted capacity before any
          # checkout.
          case "$REQUESTED_RUNNER" in
            macos-*)
              if [ "$RUNNER_ENVIRONMENT" != "github-hosted" ]; then
                echo "::error::$REQUESTED_RUNNER resolved outside GitHub-hosted capacity: $RUNNER_CONTEXT_NAME"
                exit 1
              fi
              ;;
          esac

      # Start from main's git objects, so checkout fetches only what changed
      # since then instead of the whole tree and its submodules
      # (scripts/ci/git-seed.sh, as ci-macos.yml does). The script is read at
      # this commit over HTTPS because nothing is checked out yet. A miss, or a
      # reused self-hosted workspace, leaves checkout to work as before.
      - name: Restore git object seed
        continue-on-error: true
        timeout-minutes: 3
        env:
          CI_CACHE_R2_PUBLIC_URL: ${{ vars.CI_CACHE_R2_PUBLIC_URL || 'https://ci-cache.cmux.com' }}
        run: |
          set -euo pipefail
          script="$RUNNER_TEMP/git-seed.sh"
          curl --fail --silent --show-error --location --connect-timeout 10 --max-time 30 \
            -o "$script" "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/scripts/ci/git-seed.sh"
          bash "$script" restore "$GITHUB_WORKSPACE"

      - name: Clear stale git locks (self-hosted reused workspace)
        shell: bash
        run: |
          # Self-hosted macOS runners reuse the workspace. A job cancelled or
          # killed mid-checkout can leave a stale .git/modules/*/index.lock that
          # fails every later submodule checkout (e.g. ghostty). Clear them first.
          ws="${GITHUB_WORKSPACE:-$PWD}"
          rm -f "$ws/.git/index.lock" 2>/dev/null || true
          if [ -d "$ws/.git/modules" ]; then
            find "$ws/.git/modules" -type f -name "*.lock" -delete 2>/dev/null || true
          fi

      - name: Checkout
        id: checkout
        continue-on-error: true
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.resolve-ref.outputs.sha }}
          submodules: recursive

      # A seeded repository that checkout cannot use (a submodule moved to
      # another URL) must not fail the retry the same way.
      - name: Discard the git object seed after a failed checkout
        if: steps.checkout.outcome == 'failure'
        run: rm -rf "$GITHUB_WORKSPACE/.git"

      - name: Retry checkout without the git object seed
        if: steps.checkout.outcome == 'failure'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.resolve-ref.outputs.sha }}
          submodules: recursive

      - name: Capture SHA
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Select Xcode
        run: |
          set -euo pipefail
          ./scripts/select-ci-xcode.sh

      - name: Prepare isolated DerivedData
        id: compilation-cache-key
        run: |
          set -euo pipefail
          # Cache entries include absolute compiler paths. Keep these stable
          # within a runner pool, but never reuse old assembled test products.
          # The build runs at the canonical root under the name compile
          # admission uses, so it can adopt the DerivedData seeds main
          # publishes for admission (see "Adopt the DerivedData seed").
          workspace_path="$(cd "$GITHUB_WORKSPACE" && pwd -P)"
          # The CAS path is a compiler argument, so it must match admission's
          # too: any other value invalidates every compile the seed carries.
          DERIVED_DATA_PATH="${CMUX_CI_CANONICAL_ROOT:-/private/tmp/cmux-ci}/derived-data-compile-admission"
          CACHE_PATH="${CMUX_CI_CANONICAL_ROOT:-/private/tmp/cmux-ci}/compile-admission-cas"
          rm -rf -- "$DERIVED_DATA_PATH" "$CACHE_PATH"
          mkdir -p "$DERIVED_DATA_PATH" "$CACHE_PATH"
          echo "CMUX_DERIVED_DATA_PATH=$DERIVED_DATA_PATH" >> "$GITHUB_ENV"
          echo "CMUX_E2E_COMPILATION_CACHE=$CACHE_PATH" >> "$GITHUB_ENV"
          fingerprint="$({
            echo e2e-compilation-v1
            xcodebuild -version
            printf 'workspace=%s\nderived-data=%s\ncas=%s\n' "$workspace_path" "$DERIVED_DATA_PATH" "$CACHE_PATH"
          } | shasum -a 256 | awk '{print $1}')"
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"

      - name: Install Rust
        run: |
          ./scripts/install-rust-ci.sh

      # No Bun or zig here. The build never runs either: CMUX_SKIP_ZIG_BUILD
      # stubs the zig helper and no Xcode build phase calls Bun. But
      # `contract()` fingerprints both, and compile admission installs
      # neither, so installing them gave every product this job built a name
      # no pull request product could match. The test job still installs Bun.
      #
      # Every tool `contract()` fingerprints is installed by now. Computing the
      # key earlier recorded some of them as absent, which made the published
      # artifact's name disagree with the receipt sealed inside it, so nothing
      # could ever adopt it.
      - name: Identify the compiled product this revision needs
        id: product-key
        run: python3 scripts/ci/reuse_app_host_products.py key "$CMUX_DERIVED_DATA_PATH"

      - name: Reuse a compiled product instead of building one
        id: reuse
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/reuse_app_host_products.py restore "$CMUX_DERIVED_DATA_PATH"

      # An owned Mac (glaeda-*) keeps compile admission's DerivedData and
      # resolved packages between jobs (owned_build_state.py), at
      # this same root, path and fingerprint. Start from them instead of
      # downloading about 1.7 GB of packages and a 1.6-1.9 GB seed at 6-7 MB/s
      # (8 minutes on 2026-09-25). A kept DerivedData is warm only when its
      # stamp matches this build's canonical fingerprint; any miss, mismatch
      # or failure leaves the download path below as it was.
      #
      # It never records, keeps or saves a DerivedData: a dispatch builds
      # whatever revision it names, so it must not become the next pull
      # request's starting point; only compile admission writes that. It does
      # write the upkeep admission does: `check` updates seed-source.json and
      # drops a kept DerivedData that outgrew its cap, and with
      # CI_OWNED_PREFER_SEED the seed adopt keeps a downloaded seed and prunes
      # the local seed cache (seeds are stored under their R2 keys; a prune
      # spares any touched in the last 10 minutes). glaeda gives this job the
      # root's token for the whole job, so no admission writes this root's
      # state meanwhile.
      #
      # The helper comes from this workflow's revision, like the E2E test
      # steps: an older tested revision's copy moved the kept state out of
      # the store for a `keep` this job never runs.
      - name: Reuse this owned Mac's build state
        id: owned-state
        if: ${{ steps.reuse.outputs.hit != 'true' && startsWith(env.CMUX_PRODUCT_RUNNER, 'glaeda-') }}
        continue-on-error: true
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          CI_CACHE_R2_PUBLIC_URL: ${{ vars.CI_CACHE_R2_PUBLIC_URL || 'https://ci-cache.cmux.com' }}
        run: |
          set -euo pipefail
          # Each canonical root keeps its own state, as ci-macos.yml's
          # build-slot lays it out; packages hold no build paths, so every
          # root shares the Mac's.
          packages=/Users/Shared/cmux-build-fleet/ci
          root="${CMUX_CI_CANONICAL_ROOT:-/private/tmp/cmux-ci}"
          case "$root" in
            /private/tmp/cmux-ci) store="$packages" ;;
            /private/tmp/cmux-ci-[0-9]|/private/tmp/cmux-ci-[0-9][0-9]) store="$packages/${root##*/}" ;;
            *) echo "::error::unexpected CMUX_CI_CANONICAL_ROOT $root"; exit 1 ;;
          esac
          tools="$RUNNER_TEMP/owned-state-tools"
          rm -rf -- "$tools"
          mkdir -p "$tools"
          for name in owned_build_state.py e2e_warm_derived_data.py parallel_artifact_download.py \
            r2-cache.sh seed_derived_data.py; do
            curl --fail --silent --show-error --location --connect-timeout 10 --max-time 30 \
              -o "$tools/$name" "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$WORKFLOW_SHA/scripts/ci/$name"
          done
          fingerprint="$(scripts/ci/compile-app-host-test-product.sh canonical-fingerprint "$CMUX_DERIVED_DATA_PATH")"
          python3 "$tools/owned_build_state.py" check "$store" "$fingerprint" "$PWD" "$packages"
          {
            echo "store=$store"
            echo "seeds=$store/seeds"
            echo "tools=$tools"
          } >> "$GITHUB_OUTPUT"

      # Only an input to compiling, and not part of the product contract, so an
      # adopted product never needs it.
      - name: Download pre-built GhosttyKit.xcframework
        if: ${{ steps.reuse.outputs.hit != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ./scripts/download-prebuilt-ghosttykit.sh

      - name: Restore E2E compilation cache
        if: ${{ steps.reuse.outputs.hit != 'true' }}
        id: compilation-cache-restore
        continue-on-error: true
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ env.CMUX_E2E_COMPILATION_CACHE }}
          key: e2e-compilation-v1-${{ runner.os }}-${{ runner.arch }}-all-${{ steps.compilation-cache-key.outputs.fingerprint }}-${{ env.TEST_REF }}
          restore-keys: e2e-compilation-v1-${{ runner.os }}-${{ runner.arch }}-all-${{ steps.compilation-cache-key.outputs.fingerprint }}-

      - name: Discard incomplete E2E compilation cache
        if: ${{ steps.reuse.outputs.hit != 'true' && steps.compilation-cache-restore.outcome == 'failure' }}
        run: |
          set -euo pipefail
          if [ "$CMUX_E2E_COMPILATION_CACHE" != "${CMUX_CI_CANONICAL_ROOT:-/private/tmp/cmux-ci}/compile-admission-cas" ]; then
            echo "::error::refusing to clear an unowned compilation cache"
            exit 1
          fi
          rm -rf -- "$CMUX_E2E_COMPILATION_CACHE"
          mkdir -p "$CMUX_E2E_COMPILATION_CACHE"
          echo "::warning::E2E cache restore failed; compiling with an empty cache"

      # Restore only, from the seed nightly.yml saves after a resolve. This job
      # resolves in the canonical root, so the workspace copy is still exactly
      # what was restored: saving it (as actions/cache did) stored a fallback
      # restore of the previous Package.resolved under the new exact key, and
      # every later exact hit then failed its offline resolve and fetched every
      # remote (run 36134675453: 44 s wasted, then 86 s online).
      - name: Cache Swift packages
        id: swift-package-cache
        if: ${{ steps.reuse.outputs.hit != 'true' && steps.owned-state.outputs.packages != 'true' }}
        env:
          CI_CACHE_R2_PUBLIC_URL: ${{ vars.CI_CACHE_R2_PUBLIC_URL || 'https://ci-cache.cmux.com' }}
        uses: ./.github/actions/cache-restore
        with:
          backend: ${{ vars.CI_CACHE_BACKEND || 'r2' }}
          path: .ci-source-packages
          key: spm-${{ hashFiles('cmux.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'scripts/ci/swiftpm-cache-layout') }}
          restore-keys: spm-

      - name: Sanitize Swift package cache
        if: ${{ steps.reuse.outputs.hit != 'true' }}
        run: python3 scripts/ci/sanitize-xcode-source-packages-cache.py .ci-source-packages

      # The key names only the Xcode version and the canonical paths, the same
      # key compile admission computes, so it is known before the source tree
      # is copied there.
      - name: Compute the DerivedData seed key
        id: seed-key
        if: ${{ steps.reuse.outputs.hit != 'true' && (vars.CI_ADMISSION_SEED_DERIVED_DATA || '1') != '0' && (vars.CI_CACHE_BACKEND || 'r2') == 'r2' }}
        run: |
          set -euo pipefail
          fingerprint="$(scripts/ci/compile-app-host-test-product.sh canonical-fingerprint "$CMUX_DERIVED_DATA_PATH")"
          echo "prefix=admission-derived-data-v1-${{ runner.os }}-${{ runner.arch }}-$fingerprint-" >> "$GITHUB_OUTPUT"

      # As in compile admission: with CI_OWNED_PREFER_SEED set, a warm Mac
      # takes a seed instead of its kept DerivedData when the seed compiles
      # less (owned_build_state.py `prefer`). Read only, like the step above.
      - name: Prefer a near seed over this owned Mac's DerivedData
        id: prefer-seed
        if: ${{ steps.seed-key.outputs.prefix != '' && steps.owned-state.outputs.warm == 'true' && vars.CI_OWNED_PREFER_SEED != '' }}
        continue-on-error: true
        timeout-minutes: 3
        env:
          SEED_PREFIX: ${{ steps.seed-key.outputs.prefix }}
          MAX_DISTANCE: ${{ vars.CI_OWNED_PREFER_SEED }}
          OWNED_TOOLS: ${{ steps.owned-state.outputs.tools }}
          OWNED_STORE: ${{ steps.owned-state.outputs.store }}
          CMUX_SEED_LOCAL_CACHE: ${{ steps.owned-state.outputs.seeds }}
          CI_CACHE_R2_PUBLIC_URL: ${{ vars.CI_CACHE_R2_PUBLIC_URL || 'https://ci-cache.cmux.com' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 "$OWNED_TOOLS/owned_build_state.py" prefer "$OWNED_STORE" "$PWD" \
            "$SEED_PREFIX" "$TEST_REF" "$MAX_DISTANCE"

      # Same as compile admission: the download needs only the key, so it runs
      # while packages resolve. "Adopt the DerivedData seed" reuses this pick
      # and waits for it; if this step fails, adopt picks and downloads itself.
      - name: Start the DerivedData seed download
        if: ${{ steps.seed-key.outputs.prefix != '' && (steps.owned-state.outputs.warm != 'true' || steps.prefer-seed.outputs.prefer == 'true') }}
        continue-on-error: true
        timeout-minutes: 3
        env:
          SEED_PREFIX: ${{ steps.seed-key.outputs.prefix }}
          CI_CACHE_R2_PUBLIC_URL: ${{ vars.CI_CACHE_R2_PUBLIC_URL || 'https://ci-cache.cmux.com' }}
          GH_TOKEN: ${{ github.token }}
          # An owned Mac clones a seed it keeps (or glaeda fetched ahead)
          # instead of downloading it, and takes the one prefer-seed compared.
          CMUX_SEED_LOCAL_CACHE: ${{ vars.CI_OWNED_PREFER_SEED != '' && steps.owned-state.outputs.seeds || '' }}
          CMUX_SEED_EXACT: ${{ steps.prefer-seed.outputs.local == 'true' && steps.prefer-seed.outputs.seed_key || '' }}
          CMUX_SEED_DISTANCE: ${{ steps.prefer-seed.outputs.seed_distance }}
        run: |
          python3 scripts/ci/seed_derived_data.py start \
            "$CMUX_DERIVED_DATA_PATH" "$SEED_PREFIX" "$TEST_REF"

      # Copies the checkout to the canonical root and resolves there. See
      # scripts/ci/canonical-build-root.sh and compile-app-host-test-product.sh.
      - name: Resolve Swift packages
        if: ${{ steps.reuse.outputs.hit != 'true' }}
        env:
          CMUX_CI_SWIFTPM_CACHE_EXACT_HIT: ${{ steps.swift-package-cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          scripts/ci/compile-app-host-test-product.sh canonical-resolve \
            "$CMUX_DERIVED_DATA_PATH" "$PWD/.ci-source-packages"

      # A fresh checkout makes every file newer than any earlier build, so
      # without this even a one-line test change recompiles the app host.
      # Adopt the DerivedData seed seed-derived-data.yml built for TEST_REF,
      # or for its nearest ancestor with one, the same seeds compile
      # admission adopts. Main seeds every push that changes the build, so
      # the seed is usually a few commits from the tested revision, which is
      # the only distance where adoption pays (#14098). The swap happens only
      # after a complete restore, and every miss or failure is a cold build.
      # Seeds are written only by main-branch jobs in the ci-cache-writer
      # environment and read here without credentials.
      - name: Adopt the DerivedData seed
        id: seed
        if: ${{ steps.seed-key.outputs.prefix != '' && (steps.owned-state.outputs.warm != 'true' || steps.prefer-seed.outputs.prefer == 'true') }}
        continue-on-error: true
        timeout-minutes: 8
        env:
          SEED_PREFIX: ${{ steps.seed-key.outputs.prefix }}
          CI_CACHE_R2_PUBLIC_URL: ${{ vars.CI_CACHE_R2_PUBLIC_URL || 'https://ci-cache.cmux.com' }}
          GH_TOKEN: ${{ github.token }}
          CMUX_SEED_LOCAL_CACHE: ${{ vars.CI_OWNED_PREFER_SEED != '' && steps.owned-state.outputs.seeds || '' }}
          CMUX_SEED_EXACT: ${{ steps.prefer-seed.outputs.local == 'true' && steps.prefer-seed.outputs.seed_key || '' }}
          CMUX_SEED_DISTANCE: ${{ steps.prefer-seed.outputs.seed_distance }}
        run: |
          python3 scripts/ci/seed_derived_data.py adopt \
            "$CMUX_CI_CANONICAL_SRC" "$CMUX_DERIVED_DATA_PATH" \
            "$SEED_PREFIX" "$TEST_REF"

      # Where the seed would go: the resolve has just recreated the
      # DerivedData, so clone the kept one in and replay the input times
      # admission recorded in it. A preferred seed that missed still leaves
      # the Mac warm. The clone is this job's; the kept copy stays as it was.
      - name: Adopt this owned Mac's DerivedData
        id: owned-adopt
        if: ${{ steps.owned-state.outputs.warm == 'true' && (steps.prefer-seed.outputs.prefer != 'true' || steps.seed.outputs.hit != 'true') }}
        continue-on-error: true
        env:
          OWNED_TOOLS: ${{ steps.owned-state.outputs.tools }}
          OWNED_STORE: ${{ steps.owned-state.outputs.store }}
        run: python3 "$OWNED_TOOLS/owned_build_state.py" adopt "$OWNED_STORE" "$CMUX_DERIVED_DATA_PATH" "$CMUX_CI_CANONICAL_SRC"

      # A failed clone can leave part of the kept DerivedData behind (its
      # copytree fallback does not clean up), and the compile would trust it.
      # Start that build empty instead.
      - name: Discard a partly adopted DerivedData
        if: ${{ steps.owned-adopt.outcome == 'failure' }}
        run: |
          set -euo pipefail
          case "$CMUX_DERIVED_DATA_PATH" in
            /private/tmp/cmux-ci/derived-data-compile-admission|/private/tmp/cmux-ci-[0-9]/derived-data-compile-admission|/private/tmp/cmux-ci-[0-9][0-9]/derived-data-compile-admission) ;;
            *) echo "::error::refusing to clear an unowned DerivedData path: $CMUX_DERIVED_DATA_PATH"; exit 1 ;;
          esac
          rm -rf -- "$CMUX_DERIVED_DATA_PATH"
          mkdir -p "$CMUX_DERIVED_DATA_PATH"

      - name: Build the app-host and UI test product
        id: compile
        if: ${{ steps.reuse.outputs.hit != 'true' }}
        run: |
          set -euo pipefail
          # Builds the app-host profile (cmux, cmux-unit, cmux-cli-tests;
          # numeric locale reuses cmux-unit), so one product serves both
          # cmuxTests and cmuxUITests dispatches.
          started="$(python3 -c 'import time; print(time.monotonic())')"
          scripts/ci/compile-app-host-test-product.sh canonical-build \
            "$CMUX_DERIVED_DATA_PATH" \
            "$PWD/.ci-source-packages" \
            "$CMUX_E2E_COMPILATION_CACHE" \
            "$RUNNER_TEMP/cmux-e2e-compile.txt"
          finished="$(python3 -c 'import time; print(time.monotonic())')"
          python3 -c 'import sys; print(f"seconds={round(float(sys.argv[2])-float(sys.argv[1]), 3)}")' \
            "$started" "$finished" >> "$GITHUB_OUTPUT"

      # Adoption sets a per-user Xcode default. Only a build whose inputs were
      # just replayed should ignore inode changes, so a reused runner does not
      # carry it into an unrelated job.
      - name: Forget the adopted-build inode override
        if: ${{ always() && (steps.seed.outcome != 'skipped' || steps.owned-adopt.outcome != 'skipped') }}
        continue-on-error: true
        run: defaults delete com.apple.dt.XCBuild IgnoreFileSystemDeviceInodeChanges || true

      - name: Package the compiled test product
        id: package
        run: |
          set -euo pipefail
          # A fresh build's manifests embed the canonical checkout, as in
          # ci-macos.yml compile admission. Stamp that producer before
          # relocating into this job's workspace for consumers.
          if [ "${{ steps.reuse.outputs.hit }}" != true ]; then
            (cd "${CMUX_CI_CANONICAL_ROOT:-/private/tmp/cmux-ci}/src" && python3 scripts/ci/app_host_test_products.py stamp "$CMUX_DERIVED_DATA_PATH")
            python3 scripts/ci/app_host_test_products.py restore "$CMUX_DERIVED_DATA_PATH"
          fi
          python3 scripts/ci/app_host_test_products.py stamp "$CMUX_DERIVED_DATA_PATH"
          python3 scripts/ci/reuse_app_host_products.py seal "$CMUX_DERIVED_DATA_PATH"
          archive="$RUNNER_TEMP/app-host-products.tar.gz"
          # Still a gzip stream, so every consumer reads it unchanged. The
          # default level spends about a minute squeezing Mach-O binaries that
          # travel between two jobs on the same fleet and are deleted after.
          # COPYFILE_DISABLE stops macOS tar adding AppleDouble entries
          # (Build/._Products) for Xcode's xattrs. macOS tar folds them back
          # in on extract, so the test job never noticed, but cross-run reuse
          # extracts with Python and rejects them as unscoped paths.
          # Build/Products reaches each framework binary through Versions/Current
          # symlinks, and product extractors accept no symlinks, so `tar -h` stored
          # every framework binary three times: 1.9 GB on disk became 2.7 GB of
          # tar and 830 MB gzipped. Stage the tree as hard links with the symlinks
          # followed (the same tree `tar -h` wrote, beside the DerivedData so the
          # links stay on one volume); tar then stores each file once and every
          # other path as a hard link, which tar -x, aa and
          # reuse_app_host_products.py all extract. Same files, 572 MB, packed
          # faster.
          stage="$(mktemp -d "${CMUX_DERIVED_DATA_PATH%/*}/.product-pack.XXXXXX")"
          trap 'rm -rf "$stage"' EXIT
          (cd "$CMUX_DERIVED_DATA_PATH" && pax -rwlL Build/Products "$stage")
          COPYFILE_DISABLE=1 tar -cf - -C "$stage" Build/Products | gzip -1 > "$archive"
          echo "sha256=$(shasum -a 256 "$archive" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "bytes=$(wc -c < "$archive" | tr -d ' ')" >> "$GITHUB_OUTPUT"

      # An owned Mac uploads at 6-7 MB/s, so the 573 MB product took about
      # 130 s there before the tests could start. When this job tests on an
      # owned Mac, the upload runs after the tests instead (below); the
      # tests restore from the archive, not the upload.
      - name: Upload the compiled test product
        id: upload-product
        if: ${{ (vars.CI_E2E_TEST_IN_BUILD || '1') == '0' || !startsWith(env.CMUX_PRODUCT_RUNNER, 'glaeda-') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-host-products-v1-${{ steps.product-key.outputs.key }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/app-host-products.tar.gz
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

      - name: Report what this build cost
        if: always()
        env:
          COMPILE_SECONDS: ${{ steps.compile.outputs.seconds }}
          ARCHIVE_BYTES: ${{ steps.package.outputs.bytes }}
          REUSE_HIT: ${{ steps.reuse.outputs.hit }}
          REUSE_MISSES: ${{ steps.reuse.outputs.miss_reasons }}
          REUSE_PRODUCER: ${{ steps.reuse.outputs.producer_run_id }}
          REUSE_SAVED: ${{ steps.reuse.outputs.macos_runner_minutes_saved }}
          REUSE_TRANSFER: ${{ steps.reuse.outputs.transfer_seconds }}
          SEED_HIT: ${{ steps.seed.outputs.hit }}
          SEED_KEY: ${{ steps.seed.outputs.key }}
          SEED_DISTANCE: ${{ steps.seed.outputs.seed_distance }}
          SEED_CHANGED: ${{ steps.seed.outputs.changed_inputs }}
          SEED_SECONDS: ${{ steps.seed.outputs.seconds }}
          SEED_REASON: ${{ steps.seed.outputs.reason }}
          OWNED_HIT: ${{ steps.owned-adopt.outputs.hit }}
          OWNED_CHANGED: ${{ steps.owned-adopt.outputs.changed_inputs }}
          OWNED_PACKAGES: ${{ steps.owned-state.outputs.packages }}
        run: |
          set -euo pipefail
          {
            echo "### Compiled test product"
            echo
            if [ "$REUSE_HIT" = "true" ]; then
              echo "Adopted the product run $REUSE_PRODUCER compiled; transferred in ${REUSE_TRANSFER:-unknown} s."
              echo "Avoided ${REUSE_SAVED:-unknown} macOS runner-minutes of compilation."
            else
              echo "Compiled from source in ${COMPILE_SECONDS:-unknown} s."
              echo "No product to adopt (${REUSE_MISSES:-none})."
              if [ "$SEED_HIT" = "true" ]; then
                echo "Started from DerivedData seed \`$SEED_KEY\` (${SEED_DISTANCE:-unknown} commits back), adopted in ${SEED_SECONDS:-unknown} s; ${SEED_CHANGED:-unknown} inputs differed."
              elif [ "$OWNED_HIT" = "true" ]; then
                echo "Started from this owned Mac's kept DerivedData; ${OWNED_CHANGED:-unknown} inputs differed."
              else
                echo "Started from empty DerivedData (${SEED_REASON:-not attempted})."
              fi
            fi
            if [ "$OWNED_PACKAGES" = "true" ]; then
              echo "Swift packages came from this owned Mac, not the cache."
            fi
            echo "Archive: ${ARCHIVE_BYTES:-unknown} bytes."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check the selected revision against main
        id: revision-on-main
        continue-on-error: true
        if: ${{ always() && !cancelled() && steps.compilation-cache-key.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          contained="$(python3 scripts/ci/revision_on_main.py)"
          echo "contained=$contained" >> "$GITHUB_OUTPUT"
          echo "Selected revision contained in main: $contained"

      - name: Bound E2E compilation cache
        id: compilation-cache-bound
        continue-on-error: true
        if: ${{ always() && !cancelled() && steps.compilation-cache-key.outcome == 'success' }}
        env:
          WORKFLOW_REF: ${{ github.ref }}
          # The tests run after the cache is saved, so what makes the cache
          # worth seeding is a product that built cleanly.
          TEST_OUTCOME: ${{ steps.compile.outcome }}
          REVISION_ON_MAIN: ${{ steps.revision-on-main.outputs.contained }}
        run: |
          set -euo pipefail
          echo "save=false" >> "$GITHUB_OUTPUT"
          # A dispatch can execute any selected revision, so only code main
          # already contains may seed caches that later selected refs restore.
          # Requiring the selected revision to equal the workflow SHA also
          # expressed that, but no dispatcher passes main's tip, so the cache
          # never gained an entry.
          if [ "$WORKFLOW_REF" != refs/heads/main ] \
            || [[ ! "$TEST_REF" =~ ^[0-9a-f]{40}$ ]] \
            || [ "${REVISION_ON_MAIN:-false}" != true ] \
            || [ "$TEST_OUTCOME" != success ]; then
            echo "E2E compilation cache is read-only for this selected revision/result"
            exit 0
          fi
          cache_path="$CMUX_E2E_COMPILATION_CACHE"
          if [ ! -d "$cache_path" ] || [ -z "$(find "$cache_path" -type f -print -quit)" ]; then
            echo "E2E compilation cache is empty; skipping save"
            exit 0
          fi
          cache_kib="$(du -sk "$cache_path" | awk '{print $1}')"
          echo "E2E compilation cache size: $cache_kib KiB"
          if [ "$cache_kib" -gt $((5 * 1024 * 1024)) ]; then
            echo "::warning::E2E compilation cache exceeds 5 GiB; skipping save"
            exit 0
          fi
          echo "save=true" >> "$GITHUB_OUTPUT"

      - name: Save E2E compilation cache
        continue-on-error: true
        if: ${{ always() && !cancelled() && steps.compilation-cache-bound.outputs.save == 'true' && steps.compilation-cache-restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ env.CMUX_E2E_COMPILATION_CACHE }}
          key: e2e-compilation-v1-${{ runner.os }}-${{ runner.arch }}-all-${{ steps.compilation-cache-key.outputs.fingerprint }}-${{ env.TEST_REF }}

      - name: Clean owned DerivedData
        if: always()
        run: |
          set -euo pipefail
          derived_data_path="${CMUX_DERIVED_DATA_PATH:-}"
          cache_path="${CMUX_E2E_COMPILATION_CACHE:-}"
          case "$cache_path" in
            "${CMUX_CI_CANONICAL_ROOT:-/private/tmp/cmux-ci}/compile-admission-cas"|"") ;;
            *) echo "::error::refusing to remove unowned compilation cache: $cache_path"; exit 1 ;;
          esac
          case "$derived_data_path" in
            "${CMUX_CI_CANONICAL_ROOT:-/private/tmp/cmux-ci}/derived-data-compile-admission")
              rm -rf -- "$derived_data_path"
              if [ -n "$cache_path" ]; then rm -rf -- "$cache_path"; fi
              # The tests run next, in this job, from a DerivedData of their
              # own. Hand the variable over empty, so their cleanup finds
              # nothing to refuse when a failure skips their preparation.
              echo "CMUX_DERIVED_DATA_PATH=" >> "$GITHUB_ENV"
              ;;
            "")
              echo "DerivedData was not prepared; nothing to clean"
              ;;
            *)
              echo "::error::refusing to remove unowned DerivedData path: $derived_data_path"
              exit 1
              ;;
          esac

      # The tests used to run in the `test` job, which queued a second time for
      # a runner of this same label, then downloaded and restored the product
      # this job had just uploaded. With the macOS pools saturated that second
      # wait ran 10 to 60 minutes, and most runs were cancelled before it ended
      # (2026-09-25). Run them here instead, from the archive packaged above.
      # The upload stays: later dispatches of this revision adopt it (see
      # e2e_sibling_build.py and reuse_app_host_products.py), and the `test`
      # job reads it when this job does not test. CI_E2E_TEST_IN_BUILD=0 hands
      # the tests back to that job.
      - name: Run the selected tests here
        id: test-here
        if: ${{ (vars.CI_E2E_TEST_IN_BUILD || '1') != '0' }}
        run: echo "tested=true" >> "$GITHUB_OUTPUT"

      # The steps come from this workflow's revision, not the tested one, which
      # may predate them. The scripts they call are the tested revision's, as
      # they always were.
      - name: Checkout the E2E test steps
        if: ${{ steps.test-here.outputs.tested == 'true' }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.workflow_sha }}
          path: .e2e-workflow
          sparse-checkout: .github/actions/e2e-run-tests
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Run selected tests
        id: tests
        if: ${{ steps.test-here.outputs.tested == 'true' }}
        uses: ./.e2e-workflow/.github/actions/e2e-run-tests
        with:
          target: ${{ needs.filter.outputs.target }}
          filter: ${{ needs.filter.outputs.filter }}
          selector: ${{ needs.filter.outputs.selector }}
          selectors: ${{ needs.filter.outputs.selectors }}
          count: ${{ needs.filter.outputs.count }}
          record-video: ${{ needs.filter.outputs.record_video }}
          test-filter: ${{ inputs.test_filter }}
          test-timeout: ${{ inputs.test_timeout || '120' }}
          ref-display: ${{ inputs.ref || github.ref_name }}
          source-revision: ${{ needs.resolve-ref.outputs.sha }}
          artifact-id: ${{ steps.upload-product.outputs.artifact-id }}
          artifact-digest: ${{ steps.upload-product.outputs.artifact-digest }}
          sha256: ${{ steps.package.outputs.sha256 }}
          product-contract: ${{ steps.product-key.outputs.key }}
          product-from-producer: "true"

      # main_regression_bisect.py reads a run's verdict from its failed
      # top-level step names, and the jobs API does not list an action's own
      # steps. This step fails, under the name the bisect reads as "no such
      # test", when a selector matched no built test at this revision.
      - name: Resolve selectors against the built tests
        if: ${{ failure() && steps.tests.outcome == 'failure' }}
        run: test ! -e "$RUNNER_TEMP/cmux-e2e-selectors-unresolved"

      # The owned-Mac upload deferred from before the tests.
      # e2e_sibling_build.py and reuse_app_host_products.py count a producer
      # as done once either upload step succeeded (step names must stay
      # unique for product_input_identity.py). It runs whatever the tests
      # did, so a failing test still publishes an intact product for later
      # dispatches; the fallback `test` job never needs it, since this job
      # tested. It also runs when the job is cancelled, so a superseded
      # dispatch still publishes what it compiled. The tested revision's test
      # code ran between packaging and here, so the archive must still hash
      # to what the package step sealed.
      - name: Check the product archive before the late upload
        id: late-upload-check
        if: ${{ always() && steps.package.outcome == 'success' && steps.upload-product.outcome == 'skipped' }}
        env:
          EXPECTED_SHA256: ${{ steps.package.outputs.sha256 }}
        run: echo "$EXPECTED_SHA256  $RUNNER_TEMP/app-host-products.tar.gz" | shasum -a 256 -c -

      - name: Upload the compiled test product after the tests
        id: upload-product-after-tests
        if: ${{ always() && steps.late-upload-check.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-host-products-v1-${{ steps.product-key.outputs.key }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/app-host-products.tar.gz
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  test:
    needs: [resolve-ref, filter, runner, build]
    # The fallback: build normally runs the tests itself (see "Run the
    # selected tests here"). Like build, a failed sibling wait must not skip
    # tests a build succeeded for, and the implicit success() reads every
    # upstream job.
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.build.outputs.tested != 'true' }}
    # scripts/ci/parallel_artifact_download.py reads this run's artifact
    # metadata through the Actions API; the workflow-level token is
    # contents-only. Narrow and additive, mirroring ci-macos.yml's admission
    # job rather than widening the whole workflow.
    permissions:
      contents: read
      actions: read
    runs-on: ${{ github.run_attempt > 1 && needs.runner.outputs.retry_label || needs.runner.outputs.label }}
    timeout-minutes: ${{ fromJSON(inputs.job_timeout || '45') }}
    env:
      CMUX_CI_MAX_MACOS_SDK_MAJOR: "26"
      # The build job's pin, so this job selects the Xcode that linked the
      # product it runs. The app-host test environment is set by the
      # e2e-run-tests action wherever the tests run.
      CMUX_CI_XCODE_APP: ${{ needs.build.outputs.xcode_app }}
    steps:
      - name: Verify GitHub-hosted route
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          REQUESTED_RUNNER: ${{ needs.runner.outputs.label }}
          RUNNER_CONTEXT_NAME: ${{ runner.name }}
        run: |
          # The self-hosted fleet also carries a macos-26 label, so a macos-*
          # request must prove it landed on GitHub-hosted capacity before any
          # checkout.
          case "$REQUESTED_RUNNER" in
            macos-*)
              if [ "$RUNNER_ENVIRONMENT" != "github-hosted" ]; then
                echo "::error::$REQUESTED_RUNNER resolved outside GitHub-hosted capacity: $RUNNER_CONTEXT_NAME"
                exit 1
              fi
              ;;
          esac

      # Start from main's git objects, so checkout fetches only what changed
      # since then instead of the whole tree and its submodules
      # (scripts/ci/git-seed.sh, as ci-macos.yml does). The script is read at
      # this commit over HTTPS because nothing is checked out yet. A miss, or a
      # reused self-hosted workspace, leaves checkout to work as before.
      - name: Restore git object seed
        continue-on-error: true
        timeout-minutes: 3
        env:
          CI_CACHE_R2_PUBLIC_URL: ${{ vars.CI_CACHE_R2_PUBLIC_URL || 'https://ci-cache.cmux.com' }}
        run: |
          set -euo pipefail
          script="$RUNNER_TEMP/git-seed.sh"
          curl --fail --silent --show-error --location --connect-timeout 10 --max-time 30 \
            -o "$script" "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/scripts/ci/git-seed.sh"
          bash "$script" restore "$GITHUB_WORKSPACE"

      - name: Clear stale git locks (self-hosted reused workspace)
        shell: bash
        run: |
          # Self-hosted macOS runners reuse the workspace. A job cancelled or
          # killed mid-checkout can leave a stale .git/modules/*/index.lock that
          # fails every later submodule checkout (e.g. ghostty). Clear them first.
          ws="${GITHUB_WORKSPACE:-$PWD}"
          rm -f "$ws/.git/index.lock" 2>/dev/null || true
          if [ -d "$ws/.git/modules" ]; then
            find "$ws/.git/modules" -type f -name "*.lock" -delete 2>/dev/null || true
          fi

      - name: Checkout
        id: checkout
        continue-on-error: true
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.resolve-ref.outputs.sha }}
          submodules: recursive

      # A seeded repository that checkout cannot use (a submodule moved to
      # another URL) must not fail the retry the same way.
      - name: Discard the git object seed after a failed checkout
        if: steps.checkout.outcome == 'failure'
        run: rm -rf "$GITHUB_WORKSPACE/.git"

      - name: Retry checkout without the git object seed
        if: steps.checkout.outcome == 'failure'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.resolve-ref.outputs.sha }}
          submodules: recursive

      - name: Select Xcode
        run: |
          set -euo pipefail
          ./scripts/select-ci-xcode.sh

      - name: Read the compiled test product over parallel range requests
        id: parallel-product
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
          ARTIFACT_PROVIDER_DIGEST: ${{ needs.build.outputs.artifact_digest }}
        run: python3 scripts/ci/parallel_artifact_download.py

      # actions/download-artifact reads the provider blob over one connection,
      # which sustains about 2 MB/s on the Blacksmith macOS fleet. It stays as
      # the fallback so a transport miss costs minutes, not the whole run.

      - name: Download the compiled test product
        if: ${{ steps.parallel-product.outputs.hit != 'true' }}
        uses: ./.github/actions/download-test-product
        with:
          artifact-id: ${{ needs.build.outputs.artifact_id }}
          path: ${{ runner.temp }}/app-host-products

      # The steps come from this workflow's revision, not the tested one, which
      # may predate them.
      - name: Checkout the E2E test steps
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.workflow_sha }}
          path: .e2e-workflow
          sparse-checkout: .github/actions/e2e-run-tests
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Run selected tests
        id: tests
        uses: ./.e2e-workflow/.github/actions/e2e-run-tests
        with:
          target: ${{ needs.filter.outputs.target }}
          filter: ${{ needs.filter.outputs.filter }}
          selector: ${{ needs.filter.outputs.selector }}
          selectors: ${{ needs.filter.outputs.selectors }}
          count: ${{ needs.filter.outputs.count }}
          record-video: ${{ needs.filter.outputs.record_video }}
          test-filter: ${{ inputs.test_filter }}
          test-timeout: ${{ inputs.test_timeout || '120' }}
          ref-display: ${{ inputs.ref || github.ref_name }}
          source-revision: ${{ needs.resolve-ref.outputs.sha }}
          artifact-id: ${{ needs.build.outputs.artifact_id }}
          artifact-digest: ${{ needs.build.outputs.artifact_digest }}
          sha256: ${{ needs.build.outputs.sha256 }}
          product-contract: ${{ needs.build.outputs.product_contract }}
          parallel-product-hit: ${{ steps.parallel-product.outputs.hit }}
          parallel-product-transfer-seconds: ${{ steps.parallel-product.outputs.transfer_seconds }}

      # main_regression_bisect.py reads a run's verdict from its failed
      # top-level step names, and the jobs API does not list an action's own
      # steps. This step fails, under the name the bisect reads as "no such
      # test", when a selector matched no built test at this revision.
      - name: Resolve selectors against the built tests
        if: ${{ failure() && steps.tests.outcome == 'failure' }}
        run: test ! -e "$RUNNER_TEMP/cmux-e2e-selectors-unresolved"
