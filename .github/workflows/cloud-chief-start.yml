name: Cloud Chief start (machine.chief_start on staging)

# A Chief on its own Cloud machine, started with cmux-cloud-api's machine.chief_start (the daemon's
# cloud.machine.chief_start) on staging: scripts/cmux-next/cloud-chief-start-check.ts. It runs the call through the
# crate's daemonless cloud_call example (the same perform the daemon runs), puts this run's optchat-chief on a
# machine whose image has no Chief host yet, and checks the start, its resume (same key: one machine, one Chief)
# and that cmux-chief.service runs. The test machine is cmux-test-<run>-chief-start, deleted in the finally path;
# leftovers older than 3 h are swept by the next run.
#
# Secrets: the staging agent test account in cmux-next-vm-image-dev (as cloud-journey-pr.yml) and a Claude
# credential for the Chief's turns (ANTHROPIC_API_KEY, else the journey Claude Code token, as
# cloud-chief-turn-proof.yml). Same-repo pull requests only; without them the job fails, never skips. A Chief reply
# that names the credential's own limit judges nothing: the run ends NOT JUDGED with a warning, exit 0.

on:
  workflow_dispatch:
  pull_request:
    branches: [feat-cmux-next]
    paths:
      - cmux-tui/crates/cmux-cloud-api/src/chief_machine*.rs
      - cmux-tui/crates/cmux-cloud-api/src/chief_turn.rs
      - cmux-tui/crates/cmux-cloud-api/examples/cloud_call.rs
      - Native/OptChat/optchat-chief/src/cloud/**
      - scripts/cmux-next/cloud-chief-start-check.ts
      - scripts/cmux-next/cloud-chief-start-check.test.ts
      - scripts/cmux-next/cloud-chief-turn-proof.ts
      - .github/workflows/cloud-chief-start.yml

permissions:
  contents: read

concurrency:
  group: cloud-chief-start-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # A workflow sweep that reaches this only through workflow files skips its heavy jobs (self-edit-sweep.yml,
  # scripts/ci/self_edit_sweep.py); a pull request under 10 changed files or with full-ci never starts the gate.
  self-edit:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.changed_files >= 10 && !contains(github.event.pull_request.labels.*.name, 'full-ci') }}
    uses: ./.github/workflows/self-edit-sweep.yml
    with:
      workflow: .github/workflows/cloud-chief-start.yml
    permissions:
      contents: read

  check:
    needs: self-edit
    if: ${{ !cancelled() && needs.self-edit.outputs.run != 'false' && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || contains(fromJSON('["blacksmith-8vcpu-ubuntu-2404","blacksmith-16vcpu-ubuntu-2404","blacksmith-4vcpu-ubuntu-2404"]'), vars.LINUX_RUNNER) && vars.LINUX_RUNNER || vars.CI_CLOUD_OVERFLOW_SAVED && fromJSON(vars.RUNNER_POOLS).linux_16 || fromJSON(vars.RUNNER_POOLS).linux_8 }}
    environment:
      name: cmux-next-vm-image-dev
      deployment: false
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          submodules: false
      - name: Install the musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools clang pkg-config
      - name: Set up cmux-tui Rust
        uses: ./.github/actions/setup-cmux-tui-rust
      - name: Give this runner instance its own CARGO_HOME
        uses: ./.github/actions/runner-cargo-home
      - name: Build cloud_call (cmux-cloud-api) and optchat-chief (x86_64 musl)
        id: build
        env:
          CARGO_NET_RETRY: "10"
          CARGO_HTTP_TIMEOUT: "120"
          # Match cloud-journey-pr's check profile. Run 45862969979 was canceled
          # while compiling cloud_call's generated client, before any live step.
          CARGO_PROFILE_DEV_OPT_LEVEL: "0"
          CARGO_PROFILE_DEV_DEBUG: line-tables-only
          CARGO_INCREMENTAL: "0"
          CC_x86_64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          # This binary only has to run for the check. The shipping profile (fat LTO, one codegen unit)
          # took 33 min on a Freestyle runner and ran into the job limit (run 45772263280, attempt 2).
          CARGO_PROFILE_RELEASE_LTO: "off"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
        run: |
          set -euo pipefail
          (cd cmux-tui && cargo build -p cmux-cloud-api --example cloud_call --locked)
          call="$(cd cmux-tui && echo "${CARGO_TARGET_DIR:-$PWD/target}")/debug/examples/cloud_call"
          test -x "$call"
          rustup target add x86_64-unknown-linux-musl
          (cd Native/OptChat/optchat-chief && cargo build --release --locked --target x86_64-unknown-linux-musl --bin optchat-chief)
          chief="$(cd Native/OptChat/optchat-chief && echo "${CARGO_TARGET_DIR:-$PWD/target}")/x86_64-unknown-linux-musl/release/optchat-chief"
          file "$chief" | grep -q 'statically linked\|static-pie linked'
          echo "call=$call" >> "$GITHUB_OUTPUT"
          echo "chief=$chief" >> "$GITHUB_OUTPUT"
      - name: Restore pinned Bun 1.4.4 from the CI cache bucket
        shell: bash
        continue-on-error: true
        run: bash "$GITHUB_WORKSPACE/scripts/ci/toolchain-r2.sh" restore bun 1.4.4 || true

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
          no-cache: ${{ !startsWith(github.workspace, '/home/runner/work/') || !(github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && github.event_name != 'merge_group' && contains(fromJSON('["refs/heads/main","refs/heads/feat-cmux-next","refs/heads/nightly-next"]'), github.ref)) }}
      - name: Check the Chief reply verdicts
        run: bun test scripts/cmux-next/cloud-chief-start-check.test.ts
      - name: Start a Chief on its own staging machine
        env:
          CMUX_DOGFOOD_STACK_EMAIL: ${{ secrets.CMUX_DOGFOOD_STACK_EMAIL }}
          CMUX_DOGFOOD_STACK_PASSWORD: ${{ secrets.CMUX_DOGFOOD_STACK_PASSWORD }}
          PRODUCT_TEAM: ${{ vars.CMUX_JOURNEY_PRODUCT_TEAM }}
          # Owner mode, as the Mac app sends the owner's Claude login (stdin tail, never argv): staging installs no
          # SR2 model route, so CHIEF_START_AUTH=sr2 answers "Not logged in" there. The same secrets as
          # cloud-chief-turn-proof.yml; a reply naming the credential's limit ends NOT JUDGED (exit 0), not red.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CMUX_JOURNEY_CLAUDE_CODE_OAUTH_TOKEN || secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          bun scripts/cmux-next/cloud-chief-start-check.ts --target staging \
            --call "${{ steps.build.outputs.call }}" --binary "${{ steps.build.outputs.chief }}" \
            --out "$RUNNER_TEMP/cloud-chief-start" --run "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - name: Keep the step table
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cloud-chief-start-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/cloud-chief-start/journey.json
            ${{ runner.temp }}/cloud-chief-start/summary.md
          if-no-files-found: warn
          retention-days: 3
