# cdn-bills-read: RFD 0166 row 305, "Read the bills". Read-only: 30 days of the network counters the
# repo's existing secrets can see, printed as one table in the job summary. Writes nothing anywhere.
#
# Leo, 2026-11-25: "if it's cloud-related stuff. do not ever only plan. always be starting and
# continuing and carrying things through."
#
#   gh workflow run cdn-bills-read.yml --repo manaflow-ai/cmux --ref main [-f days=30]
#
# Cloudflare (CLOUDFLARE_API_TOKEN, the one device-hub-logs.yml uses) through the GraphQL analytics
# API: R2 operations by bucket and class, R2 storage, Realtime TURN and SFU bytes, zone HTTP bytes.
# Vercel (VERCEL_TOKEN, VERCEL_ORG_ID, as vercel-staging-env-apply.yml): billed charges. A dataset the
# token cannot read prints its error as the row, so every bill gets a number or the reason it has
# none. GCP SKU dollars need the billing admin or the BigQuery export, and no repo secret has that.
name: cdn-bills-read

on:
  workflow_dispatch:
    inputs:
      days:
        description: "window in days, ending now (1-31)"
        required: false
        default: "30"

permissions:
  contents: read

concurrency:
  group: cdn-bills-read
  cancel-in-progress: false

jobs:
  read:
    # A job holding secrets runs where no variable can move it (test_ci_fork_runner_routing.py), as vercel-auth-health.yml.
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.CI_SECRET_SKIP_FLEET != '1' && 'cmux-gcp-secret-jit-x64' || contains(fromJSON('["blacksmith-4vcpu-ubuntu-2404","blacksmith-8vcpu-ubuntu-2404","blacksmith-16vcpu-ubuntu-2404","blacksmith-32vcpu-ubuntu-2404"]'), vars.LINUX_RUNNER) && vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 15
    steps:
      - name: Read 30 days of CDN, R2, TURN and Vercel counters
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 0c1675e0def6de1ab3a50a4e17dc5656
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          DAYS: ${{ inputs.days }}
        shell: python3 -I {0}
        run: |
          import datetime as dt, json, os, urllib.error, urllib.request
          from collections import defaultdict

          DAYS = max(1, min(31, int(os.environ.get("DAYS") or 30)))
          NOW = dt.datetime.now(dt.timezone.utc).replace(minute=0, second=0, microsecond=0)
          START = NOW - dt.timedelta(days=DAYS)
          ACCOUNT = os.environ["CLOUDFLARE_ACCOUNT_ID"]
          CF = os.environ.get("CLOUDFLARE_API_TOKEN", "")
          rows = []  # (source, what, value, note)

          def iso(t): return t.strftime("%Y-%m-%dT%H:%M:%SZ")
          def gb(b): return f"{b / 1e9:,.2f} GB"
          def days():
              t = START
              while t < NOW:
                  yield t, min(t + dt.timedelta(days=1), NOW)
                  t += dt.timedelta(days=1)

          def http(url, token, body=None):
              req = urllib.request.Request(url, data=json.dumps(body).encode() if body else None,
                  headers={"Authorization": f"Bearer {token}", "Content-Type": "application/json"})
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      return json.loads(r.read() or b"null")
              except urllib.error.HTTPError as e:
                  raise RuntimeError(f"HTTP {e.code}: {e.read()[:300].decode(errors='replace')}")

          def gql(query, variables):
              out = http("https://api.cloudflare.com/client/v4/graphql", CF, {"query": query, "variables": variables})
              if out.get("errors"):
                  raise RuntimeError("; ".join(e.get("message", "?") for e in out["errors"])[:300])
              return out["data"]

          def per_day(dataset, fields, dims, flt_key="datetime"):
              """Sums `dataset` day by day over the window, grouped by `dims`."""
              total = defaultdict(lambda: defaultdict(float))
              q = ("query($a:String!,$f:%s){viewer{accounts(filter:{accountTag:$a}){%s(limit:10000,filter:$f){sum{%s} dimensions{%s}}}}}"
                   % (dataset[0].upper() + dataset[1:] + "Filter_InputObject", dataset, " ".join(fields), " ".join(dims)))
              for a, b in days():
                  d = gql(q, {"a": ACCOUNT, "f": {f"{flt_key}_geq": iso(a), f"{flt_key}_lt": iso(b)}})
                  for g in d["viewer"]["accounts"][0][dataset]:
                      key = tuple(g["dimensions"].get(x) for x in dims)
                      for f in fields:
                          total[key][f] += g["sum"].get(f) or 0
              return total

          def cloudflare():
              if not CF:
                  rows.append(("Cloudflare", "all", "-", "CLOUDFLARE_API_TOKEN is empty"))
                  return
              # R2 operations: Class A and B per bucket (pricing classes per developers.cloudflare.com/r2/pricing).
              CLASS_A = {"ListBuckets", "PutBucket", "ListObjects", "PutObject", "CopyObject", "CompleteMultipartUpload",
                         "CreateMultipartUpload", "LifecycleStorageTierTransition", "ListMultipartUploads", "UploadPart",
                         "UploadPartCopy", "ListParts", "PutBucketEncryption", "PutBucketCors", "PutBucketLifecycleConfiguration"}
              try:
                  ops = per_day("r2OperationsAdaptiveGroups", ["requests"], ["bucketName", "actionType"])
                  by = defaultdict(lambda: [0.0, 0.0])
                  for (bucket, action), s in ops.items():
                      by[bucket][0 if action in CLASS_A else 1] += s["requests"]
                  for bucket, (a, b) in sorted(by.items(), key=lambda x: -sum(x[1])):
                      rows.append(("R2 ops", bucket, f"A {a:,.0f} / B {b:,.0f}",
                                   f"list price ${a / 1e6 * 4.5 + b / 1e6 * 0.36:,.2f} before free tier"))
                  if not by:
                      rows.append(("R2 ops", "all buckets", "0", "no operations in the window"))
              except Exception as e:
                  rows.append(("R2 ops", "all buckets", "-", f"not readable: {e}"))
              try:
                  q = ("query($a:String!,$f:R2StorageAdaptiveGroupsFilter_InputObject){viewer{accounts(filter:{accountTag:$a})"
                       "{r2StorageAdaptiveGroups(limit:10000,filter:$f,orderBy:[datetime_DESC]){max{payloadSize metadataSize objectCount} dimensions{bucketName datetime}}}}}")
                  d = gql(q, {"a": ACCOUNT, "f": {"datetime_geq": iso(NOW - dt.timedelta(days=1)), "datetime_lt": iso(NOW)}})
                  seen = {}
                  for g in d["viewer"]["accounts"][0]["r2StorageAdaptiveGroups"]:
                      seen.setdefault(g["dimensions"]["bucketName"], g["max"])
                  total = sum(m["payloadSize"] + m["metadataSize"] for m in seen.values())
                  rows.append(("R2 storage", f"{len(seen)} buckets", gb(total), f"list price ${total / 1e9 * 0.015:,.2f}/month"))
              except Exception as e:
                  rows.append(("R2 storage", "all buckets", "-", f"not readable: {e}"))
              for name, ds in (("TURN", "callsTurnUsageAdaptiveGroups"), ("Realtime SFU", "callsUsageAdaptiveGroups")):
                  try:
                      t = per_day(ds, ["egressBytes", "ingressBytes"], ["date"] if ds == "callsUsageAdaptiveGroups" else ["datetimeHour"])
                      e = sum(s["egressBytes"] for s in t.values()); i = sum(s["ingressBytes"] for s in t.values())
                      rows.append((name, "egress / ingress", f"{gb(e)} / {gb(i)}", "billed on egress past 1 TB/month free"))
                  except Exception as err:
                      rows.append((name, "egress", "-", f"not readable: {err}"))
              try:
                  zones = http(f"https://api.cloudflare.com/client/v4/zones?account.id={ACCOUNT}&per_page=50", CF)["result"]
                  q = ("query($z:String!,$f:ZoneHttpRequests1dGroupsFilter_InputObject){viewer{zones(filter:{zoneTag:$z})"
                       "{httpRequests1dGroups(limit:40,filter:$f){sum{bytes cachedBytes requests}}}}}")
                  for z in zones:
                      d = gql(q, {"z": z["id"], "f": {"date_geq": START.date().isoformat(), "date_lt": NOW.date().isoformat()}})
                      gs = d["viewer"]["zones"][0]["httpRequests1dGroups"]
                      b = sum(g["sum"]["bytes"] for g in gs); c = sum(g["sum"]["cachedBytes"] for g in gs)
                      rows.append(("CF zone", z["name"], gb(b), f"{c / b * 100 if b else 0:.0f}% cached, {sum(g['sum']['requests'] for g in gs):,} requests"))
              except Exception as e:
                  rows.append(("CF zones", "all", "-", f"not readable: {e}"))

          def vercel():
              tok, team = os.environ.get("VERCEL_TOKEN", ""), os.environ.get("VERCEL_ORG_ID", "")
              if not tok:
                  rows.append(("Vercel", "all", "-", "VERCEL_TOKEN is empty")); return
              t = f"&teamId={team}" if team else ""
              try:
                  # FOCUS charges, one JSON object a line (vercel.com/docs/rest-api billing charges).
                  req = urllib.request.Request(f"https://api.vercel.com/v1/billing/charges?from={iso(START)}&to={iso(NOW)}{t}",
                                               headers={"Authorization": f"Bearer {tok}"})
                  with urllib.request.urlopen(req, timeout=60) as r:
                      lines = [json.loads(x) for x in r.read().decode().splitlines() if x.strip()]
                  agg = defaultdict(lambda: [0.0, 0.0, ""])
                  for c in lines:
                      k = c.get("ServiceName") or c.get("ChargeDescription") or "?"
                      agg[k][0] += float(c.get("ConsumedQuantity") or 0)
                      agg[k][1] += float(c.get("BilledCost") or 0)
                      agg[k][2] = c.get("ConsumedUnit") or agg[k][2]
                  for k, (q, cost, unit) in sorted(agg.items(), key=lambda x: -x[1][1]):
                      if q or cost:
                          rows.append(("Vercel", k, f"{q:,.2f} {unit}", f"billed ${cost:,.2f}"))
                  if not agg:
                      rows.append(("Vercel", "charges", "0", "no charge lines in the window"))
              except Exception as e:
                  rows.append(("Vercel", "charges", "-", f"not readable: {getattr(e, 'code', '')} {e}"[:300]))

          cloudflare()
          vercel()
          rows.append(("GCP", "egress SKUs", "-", "not readable here: needs the billing admin (Console Billing) or the BigQuery billing export; no repo secret holds either"))

          out = [f"## CDN bills, {START:%Y-%m-%d} to {NOW:%Y-%m-%d} ({DAYS} days)", "",
                 "| Source | What | Value | Note |", "| --- | --- | --- | --- |"]
          out += [f"| {a} | {b} | {c} | {str(d).replace('|', '/')} |" for a, b, c, d in rows]
          text = "\n".join(out)
          print(text)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(text + "\n")
