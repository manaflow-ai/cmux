name: cmux-tui spec inventory

on:
  push:
    branches:
      - main
    paths:
      - "cmux-tui/**"
      - ".github/workflows/cmux-tui-spec.yml"
      - ".github/scripts/cmux-tui-fmt-changed.py"
      - ".github/scripts/test_cmux_tui_fmt_changed.py"
      - ".github/actions/setup-cmux-tui-rust/**"
  pull_request:
    paths:
      - "cmux-tui/**"
      - ".github/workflows/cmux-tui-spec.yml"
      - ".github/scripts/cmux-tui-fmt-changed.py"
      - ".github/scripts/test_cmux_tui_fmt_changed.py"
      - ".github/actions/setup-cmux-tui-rust/**"
  workflow_dispatch:

concurrency:
  group: cmux-tui-spec-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-4vcpu-ubuntu-2404' || vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Test inventory checker
        run: python3 cmux-tui/scripts/test_check_spec_inventory.py

      - name: Test frontend documentation protocol
        run: python3 cmux-tui/scripts/test_frontend_docs.py

      - name: Check protocol and TUI action inventory
        run: python3 cmux-tui/scripts/check-spec-inventory.py

      - name: Test deterministic SDK generator
        env:
          PYTHONPATH: cmux-tui/bindings
        run: python3 -m unittest discover -s cmux-tui/bindings/codegen/tests -v

      - name: Test SDK schema checker
        run: python3 cmux-tui/scripts/test_check_sdk_schema.py

      - name: Check SDK schema against runtime inventory
        run: python3 cmux-tui/scripts/check-sdk-schema.py

      - name: Test public resource boundary checker
        run: python3 cmux-tui/scripts/test_check_resource_api_boundary.py

      - name: Check public resource API boundary
        run: python3 cmux-tui/scripts/check-resource-api-boundary.py

      - name: Check generated SDK wire layers
        run: python3 cmux-tui/bindings/codegen/generate.py --check

  # PR CI never runs cmux-tui.yml (dispatch only), so #18706 landed unformatted
  # Rust and broke base `cargo fmt --check`. rustfmt alone on the packages the
  # change touches: no build and no dependency download.
  rustfmt:
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-4vcpu-ubuntu-2404' || vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Test the changed-package rustfmt check
        run: python3 .github/scripts/test_cmux_tui_fmt_changed.py

      - name: Set up pinned Rust
        uses: ./.github/actions/setup-cmux-tui-rust

      # Pull requests compare with the base their merge commit was made on
      # (its first parent; the event's base.sha can be older), pushes with the
      # commit before them; a dispatch (or a new branch) checks every package.
      - name: Fetch the comparison base
        id: base
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'push' && github.event.before || '' }}
        run: |
          if [[ "$EVENT_NAME" == pull_request ]]; then
            BASE_SHA=$(git cat-file -p HEAD | awk '/^parent /{print $2; exit}')
          fi
          if [[ -n "$BASE_SHA" && "$BASE_SHA" != 0000000000000000000000000000000000000000 ]]; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA" || echo "::warning::could not fetch $BASE_SHA; checking every package"
          fi
          echo "sha=$BASE_SHA" >> "$GITHUB_OUTPUT"

      - name: cargo fmt --check on changed cmux-tui packages
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: python3 .github/scripts/cmux-tui-fmt-changed.py --base "$BASE_SHA"
