name: cmux-tui spec inventory

on:
  push:
    branches:
      - main
      # The clippy job's cargo cache is saved from feat-cmux-next pushes, so pull
      # requests into it start warm.
      - feat-cmux-next
    paths:
      - "cmux-tui/**"
      - ".github/workflows/cmux-tui-spec.yml"
      - ".github/scripts/cmux-tui-fmt-changed.py"
      - ".github/scripts/test_cmux_tui_fmt_changed.py"
      - ".github/scripts/cmux-tui-clippy-changed.py"
      - ".github/scripts/test_cmux_tui_clippy_changed.py"
      - ".github/actions/setup-cmux-tui-rust/**"
      - "scripts/cmux-next/rust_panic_ratchet.py"
      - "scripts/cmux-next/rust-panic-baseline.json"
      - "plans/cmux-next/rust-panic-free.md"
      - "scripts/ci/cargo_test_verdict.py"
      - "scripts/ci/test_reds.py"
      - "tests/test_cargo_test_verdict.py"
      # Files outside cmux-tui that acpmux or its path dependencies include_str!
      # (tests/test_cargo_test_verdict.py keeps this list whole).
      - "docs/remote-agents-and-cloud.md"
      - "schemas/deeplinks/agent-link.json"
      - "schemas/link-token/keyset-vectors.json"
      - "schemas/link-token/native.json"
      - "schemas/link-token/vectors.json"
      - "schemas/settings/source/subsessions.json"
      - "schemas/settings/source/trust.json"
      - "skills/cmux-acpmux/SKILL.md"
      - "skills/cmux-browser/**"
      - "skills/cmux-cua/SKILL.md"
      - "skills/cmux/SKILL.md"
  pull_request:
    paths:
      - "cmux-tui/**"
      - ".github/workflows/cmux-tui-spec.yml"
      - ".github/scripts/cmux-tui-fmt-changed.py"
      - ".github/scripts/test_cmux_tui_fmt_changed.py"
      - ".github/scripts/cmux-tui-clippy-changed.py"
      - ".github/scripts/test_cmux_tui_clippy_changed.py"
      - ".github/actions/setup-cmux-tui-rust/**"
      - "scripts/cmux-next/rust_panic_ratchet.py"
      - "scripts/cmux-next/rust-panic-baseline.json"
      - "plans/cmux-next/rust-panic-free.md"
      - "scripts/ci/cargo_test_verdict.py"
      - "scripts/ci/test_reds.py"
      - "tests/test_cargo_test_verdict.py"
      # Files outside cmux-tui that acpmux or its path dependencies include_str!
      # (tests/test_cargo_test_verdict.py keeps this list whole).
      - "docs/remote-agents-and-cloud.md"
      - "schemas/deeplinks/agent-link.json"
      - "schemas/link-token/keyset-vectors.json"
      - "schemas/link-token/native.json"
      - "schemas/link-token/vectors.json"
      - "schemas/settings/source/subsessions.json"
      - "schemas/settings/source/trust.json"
      - "skills/cmux-acpmux/SKILL.md"
      - "skills/cmux-browser/**"
      - "skills/cmux-cua/SKILL.md"
      - "skills/cmux/SKILL.md"
  workflow_dispatch:
    inputs:
      commit:
        description: "clippy job only: replay this exact 40-character commit (a past PR head) with this run's check script"
        required: false
        default: ""
        type: string
      base:
        description: "clippy job only: the commit to compare the replayed one with (its merge base); empty lints the whole workspace"
        required: false
        default: ""
        type: string

concurrency:
  group: cmux-tui-spec-${{ github.workflow }}-${{ github.ref }}-${{ inputs.commit }}
  # A newer push to a pull request supersedes its run; base-branch pushes each finish
  # (the clippy job saves its cargo cache from them).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-4vcpu-ubuntu-2404' || fromJSON(vars.RUNNER_POOLS).linux }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Test inventory checker
        run: python3 cmux-tui/scripts/test_check_spec_inventory.py

      - name: Test frontend documentation protocol
        run: python3 cmux-tui/scripts/test_frontend_docs.py

      - name: Test the machine join script
        run: sh cmux-tui/scripts/machine-join.test.sh

      - name: Check protocol and TUI action inventory
        run: python3 cmux-tui/scripts/check-spec-inventory.py

      - name: Test deterministic SDK generator
        env:
          PYTHONPATH: cmux-tui/bindings
        run: python3 -m unittest discover -s cmux-tui/bindings/codegen/tests -v

      - name: Test SDK schema checker
        run: python3 cmux-tui/scripts/test_check_sdk_schema.py

      - name: Check SDK schema against runtime inventory
        run: python3 cmux-tui/scripts/check-sdk-schema.py

      # A schema change can change what a phone may send (DaemonLanePolicy+Fields.generated.swift).
      - name: Check the phone lane field allowlist
        run: python3 -I scripts/cmux-next/gen-phone-lane-fields.py --check

      - name: Test public resource boundary checker
        run: python3 cmux-tui/scripts/test_check_resource_api_boundary.py

      - name: Check public resource API boundary
        run: python3 cmux-tui/scripts/check-resource-api-boundary.py

      - name: Check generated SDK wire layers
        run: python3 cmux-tui/bindings/codegen/generate.py --check

  # A daemon protocol change that can break an older or newer peer must ship
  # a compat rule (cmux-tui/crates/cmux-api-compat; spec/api-compat.json).
  api-compat:
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-4vcpu-ubuntu-2404' || !startsWith(vars.LINUX_RUNNER, 'blacksmith-') && vars.LINUX_RUNNER || vars.CI_CLOUD_OVERFLOW_SAVED && 'blacksmith-8vcpu-ubuntu-2404' || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up pinned Rust
        uses: ./.github/actions/setup-cmux-tui-rust

      - name: Protocol changes need compat rules
        working-directory: cmux-tui
        run: cargo run --locked -p cmux-api-compat --bin api-compat-check

  # spec/acpmux-protocol.json is generated from acpmux's protocol registry, and
  # webviews' acpmux-protocol:check only compares the TS with that committed IR. Only
  # cmux-tui.yml (dispatch) ran `protocol_ir_is_current`, so #27050 added
  # _acpmux/mesh_control to the registry without the IR and left a base red until
  # #27556. This runs acpmux's protocol module tests (the IR among them) when a change
  # touches acpmux or its build inputs: everything the IR is made of lives in the
  # acpmux crate, plus schemars in the lockfile. Only the lib test target builds,
  # none of acpmux's integration test binaries.
  acpmux-protocol-ir:
    name: acpmux protocol IR is current
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-4vcpu-ubuntu-2404' || !startsWith(vars.LINUX_RUNNER, 'blacksmith-') && vars.LINUX_RUNNER || vars.CI_CLOUD_OVERFLOW_SAVED && 'blacksmith-16vcpu-ubuntu-2404' || 'blacksmith-8vcpu-ubuntu-2404' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # Pull requests compare with the base their merge commit was made on (its first
      # parent), pushes with the commit before them; with no usable base (a dispatch
      # or a new branch) the tests run. --no-renames lists both sides of a move, so moving
      # the IR out of the crate still counts.
      - name: Does the change touch acpmux or its build inputs
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event_name == 'push' && github.event.before || '' }}
        run: |
          if [[ "$EVENT_NAME" == pull_request ]]; then
            BASE_SHA=$(git cat-file -p HEAD | awk '/^parent /{print $2; exit}')
          fi
          run=true
          if [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ && "$BASE_SHA" != 0000000000000000000000000000000000000000 ]] \
            && git fetch --no-tags --depth=1 origin "$BASE_SHA" \
            && changed=$(git diff --no-renames --name-only "$BASE_SHA" HEAD); then
            if ! grep -qE '^(cmux-tui/(crates/acpmux/|Cargo\.(toml|lock)$|rust-toolchain(\.toml)?$|\.cargo/)|\.github/workflows/cmux-tui-spec\.yml$|\.github/actions/setup-cmux-tui-rust/)' <<<"$changed"; then
              run=false
              echo "No acpmux or cmux-tui build input changed since ${BASE_SHA:0:12}; nothing to check." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - name: Set up pinned Rust
        if: ${{ steps.scope.outputs.run == 'true' }}
        uses: ./.github/actions/setup-cmux-tui-rust

      # Only a feat-cmux-next push saves the build cache; a pull request reads the base branch's.
      - name: Cache cargo build
        if: ${{ steps.scope.outputs.run == 'true' }}
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          workspaces: cmux-tui -> target
          shared-key: cmux-tui-acpmux-lib-test
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/feat-cmux-next' }}

      # `protocol::` selects exactly the protocol module's tests (src/protocol/tests.rs);
      # a filter that matches none (a moved module) fails rather than passing empty.
      - name: "cargo test -p acpmux --lib -- protocol::"
        if: ${{ steps.scope.outputs.run == 'true' }}
        working-directory: cmux-tui
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/acpmux-protocol-tests.log"
          if ! cargo test --locked -p acpmux --lib -- protocol:: 2>&1 | tee "$log"; then
            echo "::error title=acpmux protocol tests::a protocol test failed. A stale IR (protocol_ir_is_current) is regenerated with ACPMUX_PROTOCOL_BLESS=1 cargo test -p acpmux --lib protocol_ir_is_current in cmux-tui, then bun run acpmux-protocol:codegen in webviews"
            exit 1
          fi
          if ! grep -qE 'test result: ok\. [1-9][0-9]* passed' "$log"; then
            echo "::error title=acpmux protocol tests::the protocol:: filter matched no test; fix this step's filter"
            exit 1
          fi

  # acpmux's lib tests (the inbox, turn cap and carried turn units among them) and its
  # hub_integration suite (agent_inbox, carried_turns, inbox_digest, ...) ran only in Fast
  # checks and on the fleet, so #27921 and #27868 landed red tests and left base red for
  # hours (2026-10-30). This runs both when a change touches acpmux or its build inputs.
  # A red head run is judged per test (scripts/ci/cargo_test_verdict.py, which uses
  # test_reds.py): each failing test runs again alone on the head and on the merge parent;
  # a flake or a test that fails on the merge parent too only warns, and a crash, a cut-short
  # binary, a compile error or a test the merge parent passes fails the job. A
  # feat-cmux-next push runs the suites plainly, so a base red shows red there.
  acpmux-tests:
    name: acpmux tests (lib, hub_integration)
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-4vcpu-ubuntu-2404' || !startsWith(vars.LINUX_RUNNER, 'blacksmith-') && vars.LINUX_RUNNER || vars.CI_CLOUD_OVERFLOW_SAVED && 'blacksmith-16vcpu-ubuntu-2404' || 'blacksmith-8vcpu-ubuntu-2404' }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Test the per-test verdict
        run: python3 tests/test_cargo_test_verdict.py

      # As acpmux-protocol-ir: pull requests compare with their merge commit's first parent,
      # pushes with the commit before them; with no usable base the suites run.
      - name: Does the change touch an input of acpmux's tests
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event_name == 'push' && github.event.before || '' }}
        run: |
          if [[ "$EVENT_NAME" == pull_request ]]; then
            BASE_SHA=$(git cat-file -p HEAD | awk '/^parent /{print $2; exit}')
          fi
          run=true
          if [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ && "$BASE_SHA" != 0000000000000000000000000000000000000000 ]] \
            && git fetch --no-tags --depth=1 origin "$BASE_SHA" \
            && changed=$(git diff --no-renames --name-only "$BASE_SHA" HEAD); then
            # acpmux, its path dependencies, the files they include_str!, the workspace
            # manifest, lockfile and toolchain, and this job's own files.
            if ! python3 scripts/ci/cargo_test_verdict.py touches cmux-tui/crates/acpmux <<<"$changed"; then
              run=false
              echo "No input of acpmux's tests changed since ${BASE_SHA:0:12}; nothing to test." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "base=$BASE_SHA" >> "$GITHUB_OUTPUT"

      # As cmux-tui.yml's Linux test job: acpmux's sandbox tests need bubblewrap.
      - name: Install bubblewrap
        if: ${{ steps.scope.outputs.run == 'true' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          echo "ACPMUX_REQUIRE_BWRAP=1" >> "$GITHUB_ENV"

      - name: Set up pinned Rust
        if: ${{ steps.scope.outputs.run == 'true' }}
        uses: ./.github/actions/setup-cmux-tui-rust

      # Only a feat-cmux-next push saves the build cache; a pull request reads the base branch's.
      - name: Cache cargo build
        if: ${{ steps.scope.outputs.run == 'true' }}
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          workspaces: cmux-tui -> target
          shared-key: cmux-tui-acpmux-tests
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/feat-cmux-next' }}

      - name: cargo test -p acpmux --lib --test hub_integration
        if: ${{ steps.scope.outputs.run == 'true' }}
        working-directory: cmux-tui
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ steps.scope.outputs.base }}
          JOB: acpmux tests
        run: |
          set -o pipefail
          umask 022
          verdict=../scripts/ci/cargo_test_verdict.py
          head_log="$RUNNER_TEMP/acpmux-tests-head.log"
          suites=(--locked -p acpmux --lib --test hub_integration --no-fail-fast)
          started=$SECONDS
          if cargo test "${suites[@]}" 2>&1 | tee "$head_log"; then
            echo "acpmux tests: green in $((SECONDS - started)) s" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ "$EVENT_NAME" != pull_request ]]; then
            exit 1
          fi
          mapfile -t names < <(python3 "$verdict" failed "$head_log")
          retry_log="$RUNNER_TEMP/acpmux-tests-retry.log"
          base_log="$RUNNER_TEMP/acpmux-tests-base.log"
          # Many failures at once are no flake: the retry runs only a few, alone.
          if (( ${#names[@]} > 0 && ${#names[@]} <= 30 )); then
            echo "::group::retry ${#names[@]} failing test(s) alone on the head"
            cargo test "${suites[@]}" -- --exact --test-threads=1 "${names[@]}" > "$retry_log" 2>&1 || true
            cat "$retry_log"
            echo "::endgroup::"
          fi
          if (( ${#names[@]} > 0 )) && [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::group::replay ${#names[@]} failing test(s) on the merge parent ${BASE_SHA:0:12}"
            # The scope step fetched the merge parent; its build shares this target dir.
            if git worktree add --detach "$RUNNER_TEMP/acpmux-base" "$BASE_SHA"; then
              (cd "$RUNNER_TEMP/acpmux-base/cmux-tui" &&
                CARGO_TARGET_DIR="$GITHUB_WORKSPACE/cmux-tui/target" \
                  cargo test "${suites[@]}" -- --exact "${names[@]}") > "$base_log" 2>&1 || true
            fi
            cat "$base_log" 2>/dev/null || true
            echo "::endgroup::"
          fi
          echo "acpmux tests: red head run judged after $((SECONDS - started)) s" >> "$GITHUB_STEP_SUMMARY"
          python3 "$verdict" judge --head "$head_log" --retry "$retry_log" --base "$base_log" --job "$JOB"

  # PR CI never runs cmux-tui.yml (dispatch only), so #18706 landed unformatted
  # Rust and broke base `cargo fmt --check`. rustfmt alone on the packages the
  # change touches: no build and no dependency download.
  rustfmt:
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-4vcpu-ubuntu-2404' || fromJSON(vars.RUNNER_POOLS).linux }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Test the changed-package rustfmt check
        run: python3 .github/scripts/test_cmux_tui_fmt_changed.py

      - name: Set up pinned Rust
        uses: ./.github/actions/setup-cmux-tui-rust

      # Pull requests compare with the base their merge commit was made on
      # (its first parent; the event's base.sha can be older), pushes with the
      # commit before them; a dispatch (or a new branch) checks every package.
      - name: Fetch the comparison base
        id: base
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'push' && github.event.before || '' }}
        run: |
          if [[ "$EVENT_NAME" == pull_request ]]; then
            BASE_SHA=$(git cat-file -p HEAD | awk '/^parent /{print $2; exit}')
          fi
          if [[ -n "$BASE_SHA" && "$BASE_SHA" != 0000000000000000000000000000000000000000 ]]; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA" || echo "::warning::could not fetch $BASE_SHA; checking every package"
          fi
          echo "sha=$BASE_SHA" >> "$GITHUB_OUTPUT"

      # Formatting is a style guard: for pull requests into feat-cmux-next it warns
      # (Leo 2026-10-19); elsewhere it still fails.
      - name: cargo fmt --check on changed cmux-tui packages
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
          CMUX_NEXT_STYLE_GUARDS: ${{ (github.base_ref || github.ref_name) == 'feat-cmux-next' && 'warn' || 'fail' }}
        run: |
          rc=0
          python3 .github/scripts/cmux-tui-fmt-changed.py --base "$BASE_SHA" || rc=$?
          if [[ "$rc" != 0 && "$CMUX_NEXT_STYLE_GUARDS" == warn ]]; then
            echo "::warning title=cmux-tui rustfmt (warn-only)::changed cmux-tui packages are not rustfmt-clean; run cargo fmt in cmux-tui"
            exit 0
          fi
          exit "$rc"

  # PR CI never runs cmux-tui.yml (dispatch only), whose workspace clippy is the only
  # `--all-targets` lint of cmux-tui, and the fast tier's cargo entries only run tests.
  # So #23163 and #23372 landed clippy reds in cmux-tui/crates/cmux-tui/tests/ and broke
  # base clippy for everyone. This lints, with -D warnings and --all-targets, each
  # cmux-tui workspace package the change touches and each member depending on one
  # (the whole workspace when the
  # workspace manifest, lockfile, clippy config or toolchain pin changes). Blocking:
  # clippy is not a style guard (cmux-tui.yml's note). A dispatch with `commit` replays
  # a past head with this run's script, to prove the check catches what it missed.
  clippy:
    name: clippy (changed cmux-tui packages)
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-4vcpu-ubuntu-2404' || vars.CI_CLOUD_OVERFLOW_SAVED && 'blacksmith-16vcpu-ubuntu-2404' || 'blacksmith-8vcpu-ubuntu-2404' }}
    timeout-minutes: 40
    # ghostty-vt-sys builds libghostty-vt from the ghostty-next gitlink with zig, as in
    # cmux-tui.yml (an empty CMUX_GHOSTTY_SRC overrides a runner-level one).
    env:
      GHOSTTY_ZIG_SOURCE: ghostty-next
      CMUX_GHOSTTY_SRC: ""
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Test the changed-package clippy check
        run: python3 .github/scripts/test_cmux_tui_clippy_changed.py

      # A replay checks the old tree with this run's script.
      - name: Keep this run's check scripts
        run: cp .github/scripts/cmux-tui-clippy-changed.py .github/scripts/cmux-tui-fmt-changed.py "$RUNNER_TEMP/"

      - name: Check out the replayed commit
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.commit != '' }}
        env:
          COMMIT: ${{ inputs.commit }}
        run: |
          if [[ ! "$COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::commit must be a lowercase 40-character SHA" >&2
            exit 1
          fi
          git fetch --no-tags --depth=1 origin "$COMMIT"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$COMMIT"

      # Pull requests compare with the base their merge commit was made on (its first
      # parent), pushes with the commit before them, a replay with its `base`; with none
      # (or a new branch) the whole workspace is linted.
      - name: Fetch the comparison base
        id: base
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event_name == 'push' && github.event.before || github.event_name == 'workflow_dispatch' && inputs.base || '' }}
        run: |
          if [[ "$EVENT_NAME" == pull_request ]]; then
            BASE_SHA=$(git cat-file -p HEAD | awk '/^parent /{print $2; exit}')
          fi
          if [[ -n "$BASE_SHA" && ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::warning::base is not a full commit SHA; linting the whole workspace"
            BASE_SHA=""
          fi
          if [[ -n "$BASE_SHA" && "$BASE_SHA" != 0000000000000000000000000000000000000000 ]]; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA" || echo "::warning::could not fetch $BASE_SHA; linting the whole workspace"
          fi
          echo "sha=$BASE_SHA" >> "$GITHUB_OUTPUT"

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev pkg-config

      - name: Init the ghostty-next submodule (libghostty-vt for ghostty-vt-sys)
        run: bash scripts/ci/init-submodule.sh ghostty-next

      - name: Install zig
        run: ./scripts/install-zig-ci.sh

      - name: Set up pinned Rust
        uses: ./.github/actions/setup-cmux-tui-rust

      # Only a feat-cmux-next push saves the build cache; a pull request reads the base branch's.
      - name: Cache cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          workspaces: cmux-tui -> target
          shared-key: cmux-tui-pr-clippy
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/feat-cmux-next' }}

      - name: cargo clippy --all-targets on changed cmux-tui packages
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: python3 "$RUNNER_TEMP/cmux-tui-clippy-changed.py" --repo "$GITHUB_WORKSPACE" --base "$BASE_SHA"

      # The host's clone/enrollment and root-peer IPC invariants must execute,
      # not only compile. Reuse this job's Rust setup and warm target directory.
      - name: Cloud host identity tests
        if: ${{ !cancelled() }}
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          set -o pipefail
          if [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] \
            && changed=$(git diff --no-renames --name-only "$BASE_SHA" HEAD); then
            if ! python3 scripts/ci/cargo_test_verdict.py touches cmux-tui/crates/cmux-host <<<"$changed"; then
              echo "No Cloud host test input changed; skipping identity tests." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi
          cd cmux-tui
          log="$RUNNER_TEMP/cmux-host-identity-tests.log"
          cargo test --locked -p cmux-host --lib identity 2>&1 | tee "$log"
          if ! grep -qE 'test result: ok\. [1-9][0-9]* passed' "$log"; then
            echo "::error title=Cloud host identity tests::identity selected no test"
            exit 1
          fi

      # The panic ratchet (plans/cmux-next/rust-panic-free.md) on the same packages:
      # their production targets with the ratchet's lints, judged against the baseline
      # at HEAD. Only cmux-tui.yml's dispatch run checked it before, so #27935 landed two
      # acpmux indexing_slicing hits and turned base lint red.
      - name: Rust panic ratchet on changed cmux-tui packages
        if: ${{ !cancelled() }}
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: python3 "$RUNNER_TEMP/cmux-tui-clippy-changed.py" --repo "$GITHUB_WORKSPACE" --base "$BASE_SHA" --panic-ratchet "$RUNNER_TEMP/panic-clippy.jsonl"

      - name: Upload panic ratchet clippy JSON
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: panic-clippy-pr-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/panic-clippy.jsonl
          if-no-files-found: ignore
          retention-days: 3
