name: cmux-tui spec inventory

on:
  push:
    branches:
      # feat-cmux-next runs this in the post-merge batch (cmux-next-post-merge.yml, suite
      # cmux-tui-spec), not per push; its clippy and test jobs save their cargo caches there.
      - main
    paths:
      - "cmux-tui/**"
      - ".github/workflows/cmux-tui-spec.yml"
      - ".github/scripts/cmux-tui-fmt-changed.py"
      - ".github/scripts/test_cmux_tui_fmt_changed.py"
      - ".github/scripts/cmux-tui-clippy-changed.py"
      - ".github/scripts/test_cmux_tui_clippy_changed.py"
      - ".github/scripts/cmux-tui-spec-changed.py"
      - ".github/scripts/test_cmux_tui_spec_changed.py"
      - ".github/actions/setup-cmux-tui-rust/**"
      - ".github/actions/runner-cargo-home/**"
      - "scripts/cmux-next/rust_panic_ratchet.py"
      - "scripts/cmux-next/rust-panic-baseline.json"
      - "plans/cmux-next/rust-panic-free.md"
      - "scripts/ci/cargo_target_strip.py"
      - "scripts/ci/cargo_test_verdict.py"
      - "scripts/ci/git_tree.py"
      - "scripts/ci/test_reds.py"
      - "scripts/ci/acpmux-tests-pr-deferred.txt"
      - "tests/test_cargo_test_verdict.py"
      - ".github/workflows/cmux-next-post-merge.yml"
      - "scripts/ci/cargo-lib-tests-at-once.sh"
      - "scripts/ci/tests/cargo-lib-tests-at-once.test.sh"
      # The router's own files (affected_jobs.py SELF): a change to them runs every routed job.
      - "scripts/ci/affected-jobs.json"
      - "scripts/ci/affected_jobs.py"
      - "scripts/ci/affected_jobs_replay.py"
      - "scripts/ci/tooling_only.py"
      - "scripts/ci/tree_result.py"
      - ".github/actions/tree-result/**"
      - ".github/actions/cache-restore/**"
      - ".github/actions/cache-save/**"
      - "tests/test_ci_tree_result.py"
      - "tests/test_ci_affected_jobs.py"
      # Files outside cmux-tui that acpmux or its path dependencies include_str!
      # (tests/test_cargo_test_verdict.py keeps this list whole).
      - "Packages/macOS/CmuxNext/Tests/CmuxNextSidebarTests/Fixtures/sidebar-layout-cases.json"
      - "Packages/macOS/CmuxNext/Sources/CmuxNextSettingsWindow/Localizable.xcstrings.d/**"
      - "Resources/theme-files/*.json"
      - "Resources/sidebar-looks/*.json"
      - "docs/remote-agents-and-cloud.md"
      - "plans/cmux-next/spec-proposals/visuals/design-tokens.json"
      - "schemas/build-identity/vectors.json"
      - "schemas/defaults/cmux-next.json"
      - "schemas/deeplinks/agent-link.json"
      - "schemas/link-token/keyset-vectors.json"
      - "schemas/link-token/native.json"
      - "schemas/link-token/vectors.json"
      - "schemas/settings/source/updates.json"
      - "schemas/settings/retired-keys.json"
      - "schemas/settings/settings-schema.json"
      - "schemas/settings/source/agent-cache.json"
      - "schemas/settings/source/agent-defaults.json"
      - "schemas/settings/source/agent-settle.json"
      - "schemas/settings/source/agent-retry.json"
      - "schemas/settings/source/general.json"
      - "schemas/settings/source/subsessions.json"
      - "schemas/settings/source/trust.json"
      - "schemas/theme/slots.json"
      - "schemas/theme/theme-ink-vectors.json"
      - "schemas/transcript-look/transcript-look.json"
      - "scripts/measure/screen-stream-eval/wifi-away-holds.json"
      - "skills/*/SKILL.md"
      - "skills/cmux-browser/**"
      - "skills/cmux-customization/**"
      - "scripts/ci/webviews_test_results.py"
      - "scripts/cmux-next/run-v2-gates.sh"
      - "scripts/cmux-next/tests/run-v2-gates.test.sh"
      - "scripts/cmux-next/v2-gates.d/**"
      - "scripts/measure/screen-stream-eval/wifi-away-holds.json"
      - "webviews/src/agent-session/acpmux/rows/parity/*.changes.jsonl"
      - "webviews/src/pages/shared/generated/pageRouter.ts"
      # Inputs of the jobs scripts/ci/affected_jobs.py routes by the crate graph, outside the globs above
      # (`affected_jobs.py check` keeps this whole; `affected_jobs.py paths --workflow` lists them all).
      - "Packages/macOS/CmuxNext/Tests/CmuxNextSidebarTests/Fixtures/sidebar-layout-cases.json"
      - "Packages/macOS/CmuxNext/Tests/Fixtures/AgentChatStream/**"
      - "Packages/macOS/CmuxNext/Tests/Fixtures/AgentListStream/**"
      - "Resources/cmux-cli-path/fish/vendor_conf.d/cmux-cli-path.fish"
      - "Resources/cmux-cli-path/zsh/.zshenv"
      - "backend/catalog/cloud-operations.json"
      - "backend/packages/home-core/conformance/conversation-import-cases.json"
      - "ghostty-next"
      - "plans/cmux-next/action-surfaces.json"
      - "plans/cmux-next/daemon-capabilities.json"
      - "schemas/ghostty-shell-features/vectors.json"
      - "schemas/settings/source/agent-defaults.json"
      - "schemas/settings/source/mcp-servers.json"
      - "schemas/terminal-sizing/fixtures.json"
      - "scripts/ci/init-submodule.sh"
      - "scripts/ci/apt-ensure.sh"
      - "scripts/cmux-next/cargo-locks.py"
      - "scripts/install-zig-ci.sh"
      - "webviews/src/agent-session/acpmux/rows/parity/**"
      - "webviews/test/fixtures/adopted-codex-turn.events.json"
      - "workers/cmux-vm/cli/crates/cmux-vm-codegen/src/normalize.rs"
  # Every pull request (no paths): feat-cmux-next requires `clippy (changed cmux-tui
  # packages)`, and a required check must report. The `changes` job below says whether
  # the change touches a `push` path above; when it touches none, every job is skipped,
  # which GitHub counts as passing. The `push` list is the only list.
      # Customize inputs of the routed jobs: the seven-language conformance and
      # Windows check read these, so a change to them must start this workflow
      # (scripts/ci/affected_jobs.py check names the ones a paths list misses).
      - "schemas/settings/source/agent-defaults.json"
      - "schemas/settings/source/mcp-servers.json"
      # The installers' signed release file check (linux-release-verify.test.sh) reads these.
      - "web/public/tui/install-static.sh"
      - "Packages/macOS/CmuxNext/Sources/CmuxNextUpdater/Resources/web-update-keys.json"
      - "web/services/vms/drivers/linuxRelease.ts"
      - "web/app/globals.css"
      - "schemas/settings/file-keys.json"
      - "schemas/sidebar-hover-card-rules/vectors.json"
      - "schemas/sidebar-item-info/vectors.json"
      - "schemas/sidebar-drag-geometry/vectors.json"
      - "schemas/settings/source/notifications.json"
      - "schemas/settings/source/page-layout.json"
      - "docs/mdm/cmux-example.mobileconfig"
      - "docs/mdm/com.manaflow.cmux.intune.plist"
      - "docs/mdm/com.manaflow.cmux.json"
      - "docs/mdm/com.manaflow.cmux.plist"
      - "docs/mdm/managed-preferences.md"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  workflow_call:
    inputs:
      sha:
        description: Commit to test (empty is the caller's commit).
        type: string
        default: ""
      only:
        description: Run only this job id (a bisect probe); empty runs every job.
        type: string
        default: ""
      base:
        description: "clippy job only: the commit the window starts at (the post-merge plan's base: the last judged batch's head, or a probe's known-good commit); empty lints the whole workspace"
        type: string
        default: ""
    # Base-side callers (post-merge batch, feat-cmux-next pushes) pass the R2 write secrets so base-comparison
    # logs go to R2: the GitHub cache is over its 10 GB cap and evicts them before pull requests read them.
    # Pull request callers pass none; they only read, which needs no credentials.
    secrets:
      CI_CACHE_R2_ACCESS_KEY_ID:
        required: false
      CI_CACHE_R2_SECRET_ACCESS_KEY:
        required: false
      CI_CACHE_R2_ACCOUNT_ID:
        required: false
  workflow_dispatch:
    inputs:
      commit:
        description: "clippy job only: replay this exact 40-character commit (a past PR head) with this run's check script"
        required: false
        default: ""
        type: string
      base:
        description: "clippy job only: the commit to compare the replayed one with (its merge base); empty lints the whole workspace"
        required: false
        default: ""
        type: string

concurrency:
  # A post-merge call (inputs.sha set) is keyed by its caller's run too: same-commit calls (a confirm round's red-1/red-2,
  # back-to-back probes) evicted or cancelled each other, and each lost call was dispatched again (cmux runs 45988834788, 45997396504).
  group: cmux-tui-spec-${{ github.workflow }}-${{ github.ref }}-${{ inputs.commit }}${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'feat-cmux-next' && (github.event.action == 'labeled' && !contains(fromJSON('["full-ci","ready-to-land"]'), github.event.label.name) || github.event.action == 'unlabeled') && format('-label-{0}', github.run_id) || '' }}${{ inputs.sha && format('-call-{0}', github.run_id) || '' }}
  # A newer push to a pull request supersedes its run; base-branch pushes each finish
  # (the clippy job saves its cargo cache from them).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Style guards (lint, format, size, drift) warn everywhere but main and release tags, which stay strict (Leo
  # 2026-10-19, #22396). Keyed on the strict refs, not on feat-cmux-next, so a stacked pull request (base: another
  # lane branch) warns like its parent instead of failing on findings feat-cmux-next already has (#54185).
  # Steps read it as CMUX_NEXT_STYLE_GUARDS; tests/test_style_guards_level.py evaluates it.
  CMUX_NEXT_STYLE_GUARDS_LEVEL: ${{ (github.base_ref == 'main' || github.event.merge_group.base_ref == 'refs/heads/main' || (!github.base_ref && !github.event.merge_group && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')))) && 'fail' || 'warn' }}
  # Warnings never fail a pull request's compile (Leo, 2026-11-19); pushes, dispatches, nightly and release
  # keep them errors. scripts/ci/warnings_policy.py.
  CI_WARNINGS: ${{ github.event_name == 'pull_request' && 'soft' || 'deny' }}
  # Temporary REST budget attribution: one gh-call line per GitHub API call (scripts/ci/api_call_log/env.sh, fetched at a fixed commit when the checkout has no copy).
  BASH_ENV: '$({ w="${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh"; t="${RUNNER_TEMP:-/nonexistent}/api-call-log-src"; if [ -f "$w" ]; then echo "$w"; elif [ -n "${RUNNER_TEMP:-}" ]; then if [ ! -f "$t/env.sh" ] && [ ! -e "$t.tried" ] && { [ "${RUNNER_OS:-}" = Linux ] || [ "${RUNNER_OS:-}" = macOS ]; } && [ "$(date -u +%Y%m%d%H)" -lt 2026112300 ]; then : > "$t.tried"; mkdir -p "$t.part" && for x in env.sh gh sitecustomize.py isolated.py; do curl -fsSL --max-time 5 -o "$t.part/$x" "https://raw.githubusercontent.com/manaflow-ai/cmux/27647ffd3ae838c63be28ca3e5883dcd68c34518/scripts/ci/api_call_log/$x" || break; done; [ -s "$t.part/isolated.py" ] && mv "$t.part" "$t"; fi; if [ -f "$t/env.sh" ]; then echo "$t/env.sh"; else echo unset BASH_ENV > "$t.off.sh" && echo "$t.off.sh"; fi; fi; } 2>/dev/null)'

jobs:
  # The router (cmux-tui-spec-changed.py): on a pull request, whether its change touches
  # one of this workflow's `push` paths. A push or a dispatch always runs every job.
  changes:
    if: ${{ (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci') || (github.event.pull_request.draft == true && (vars.CI_DRAFT_CHEAP_TIER || '1') == '0') || (github.event.pull_request.draft != true && ((contains(github.event.pull_request.labels.*.name, 'ready-to-land') && vars.CI_LAND_FULL_PER_PR == '1') || github.event.pull_request.base.ref != 'feat-cmux-next' || github.event.pull_request.head.repo.full_name != github.repository || (vars.CI_LAND_TIER || '1') == '0'))) && !(github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'feat-cmux-next' && (github.event.action == 'labeled' && !contains(fromJSON('["full-ci","ready-to-land"]'), github.event.label.name) || github.event.action == 'unlabeled')) }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || 'cmux-linux' }}
    timeout-minutes: 12
    # head_tier.py reads the previous head's Actions runs (green-head base merge rule) and cmux/land-tier
    # (land carry rule); the post-merge batch's caller grants the same.
    permissions:
      actions: read
      contents: read
      statuses: read
    # A head pr-router.yml starts nothing for (head_tier.py `none`: an idle or green-head base merge, a same patch)
    # or runs only the cheap tier for (a sync merge, a draft) runs none of the routed jobs below: every routed output
    # reads `false` (steps.tier), as ci.yml's changes outputs do. A push, a dispatch, the post-merge batch and `full-ci` run as before.
    outputs:
      run: ${{ steps.tier.outputs.skip == 'true' && 'false' || (steps.route.outputs.run) }}
      acpmux_protocol_ir: ${{ steps.tier.outputs.skip == 'true' && 'false' || (steps.graph.outputs.acpmux_protocol_ir || steps.gate.outputs.acpmux_protocol_ir) }}
      acpmux_protocol_ir_tree: ${{ steps.graph.outputs.acpmux_protocol_ir_tree }}
      remote_web_wasm: ${{ steps.tier.outputs.skip == 'true' && 'false' || (steps.graph.outputs.remote_web_wasm || steps.gate.outputs.remote_web_wasm) }}
      remote_web_wasm_tree: ${{ steps.graph.outputs.remote_web_wasm_tree }}
      acpmux_tests: ${{ steps.tier.outputs.skip == 'true' && 'false' || (steps.graph.outputs.acpmux_tests || steps.gate.outputs.acpmux_tests) }}
      acpmux_tests_tree: ${{ steps.graph.outputs.acpmux_tests_tree }}
      acpmux_sim: ${{ steps.tier.outputs.skip == 'true' && 'false' || (steps.graph.outputs.acpmux_sim || steps.gate.outputs.acpmux_sim) }}
      acpmux_sim_tree: ${{ steps.graph.outputs.acpmux_sim_tree }}
      carrier_sim: ${{ steps.tier.outputs.skip == 'true' && 'false' || (steps.graph.outputs.carrier_sim || steps.gate.outputs.carrier_sim) }}
      carrier_sim_tree: ${{ steps.graph.outputs.carrier_sim_tree }}
      router_changed: ${{ steps.tier.outputs.skip == 'true' && 'false' || (steps.graph.outputs.router_changed || steps.gate.outputs.router_changed) }}
      acpmux_own: ${{ steps.tier.outputs.skip == 'true' && 'false' || (steps.acpmux-own.outputs.changed) }}
    steps:
      # The merge commit and its parents: HEAD^1 is the base the pull request merges into.
      # Blobless, and at first only the router's own files: the names and trees come from git (about 1 s).
      # The next step checks out the rest only when the change needs the crate graph.
      # A checkout GitHub's slowness broke (2026-11-25, cmux#58001) is tried twice more after a pause, as
      # cmux-next.yml path_route's is: every job routed here waits on it.
      - id: checkout
        name: Checkout
        if: ${{ github.event_name != 'pull_request' || !startsWith(runner.name, 'cmux-runner-pool-') }}
        timeout-minutes: 3
        continue-on-error: true
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with: &tui-spec-route-checkout
          persist-credentials: false
          ref: ${{ inputs.sha || '' }}
          fetch-depth: 2
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: &changes-sparse |
            /.github/workflows/cmux-tui-spec.yml
            /.github/scripts/
            /scripts/ci/*.py
            /scripts/ci/*.json
            /scripts/ci/prefetch-sparse-checkout.sh
            /.gitmodules
      - name: Pause before the checkout retry
        if: steps.checkout.outcome == 'failure'
        run: rm -rf "$GITHUB_WORKSPACE/.git"; sleep 15
      - id: checkout-retry
        name: Retry the checkout after a transient fetch failure
        if: steps.checkout.outcome == 'failure'
        timeout-minutes: 3
        continue-on-error: true
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with: *tui-spec-route-checkout
      - name: Pause before the last checkout try
        if: steps.checkout.outcome == 'failure' && steps.checkout-retry.outcome == 'failure'
        run: rm -rf "$GITHUB_WORKSPACE/.git"; sleep 30
      - name: Retry the checkout a last time
        if: steps.checkout.outcome == 'failure' && steps.checkout-retry.outcome == 'failure'
        timeout-minutes: 3
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with: *tui-spec-route-checkout

      # A cmux-runner-pool VM checks out from its local git mirror (/var/lib/cmux-git) instead, as
      # cmux-next-fast-gates.yml does: actions/checkout's blob:none fetch borrowing the mirror copies ~3 GB of
      # promisor objects (50-140 s of each light job's 1.5-3 min in 2026-11-25 step timings). Unfiltered, the
      # fetch sends only what the mirror lacks: the same commit (depth 2) and sparse paths. Other runners keep the action.
      - name: "Pool mirror: Checkout"
        if: ${{ github.event_name == 'pull_request' && startsWith(runner.name, 'cmux-runner-pool-') }}
        env:
          SHA: ${{ github.sha }}
          TOKEN: ${{ github.token }}
          SPARSE: *changes-sparse
        run: |
          set -euo pipefail
          mirror=/var/lib/cmux-git/cmux.git/objects
          [[ -d "$mirror" ]] || { echo "::error::no git mirror at $mirror on this pool VM"; exit 1; }
          cd "$GITHUB_WORKSPACE"
          # Reuse a .git this step made (borrows the mirror, no promisor or partial-clone filter): `git checkout` then
          # writes only what changed since the last job on this VM, not the whole tree (~10.7 s of ~13 s, rnd rc-0e8e7c8b).
          reuse=fresh
          if [[ -d .git && "$(cat .git/objects/info/alternates 2>/dev/null)" == "$mirror" ]] \
            && [[ -z "$(git config --get remote.origin.promisor || true)$(git config --get extensions.partialclone || true)$(git config --get remote.origin.partialclonefilter || true)" ]] \
            && [[ "$(git config --get remote.origin.url || true)" == "https://github.com/$GITHUB_REPOSITORY" ]] \
            && git rev-parse -q --verify HEAD >/dev/null 2>&1; then
            reuse=reused
            if ! git reset -q --hard || ! git clean -ffdxq; then reuse=fresh; fi
            # `git sparse-checkout disable` (another job on this VM) moves sparsity into config.worktree, which
            # overrides the core.sparseCheckout this step writes: keep .git/config the only config.
            git config --unset-all extensions.worktreeConfig || true
          fi
          if [[ $reuse == fresh ]]; then
            find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +
            git init -q .
            echo "$mirror" > .git/objects/info/alternates
            git config gc.auto 0
            git remote add origin "https://github.com/$GITHUB_REPOSITORY"
          fi
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          # --depth routes the fetch through the pool's git shim (the mirror path); only this command sees the token.
          # GitHub sends only keepalives while it builds a pack: abort a transfer under 1 B/s for 60 s (never
          # 1000 B/s), bound each try and try 3 times (handbook network-transfer-stalls-the-whole-job). The mirror holds
          # the objects, so this repository is complete without a failed try and a retry into it is safe.
          for try in 1 2 3; do
            if GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" \
              timeout 240 git -c http.lowSpeedLimit=1 -c http.lowSpeedTime=60 fetch --no-tags --no-recurse-submodules --depth=2 origin "+$SHA:refs/remotes/origin/checkout"; then break; fi
            [[ $try -lt 3 ]] || { echo "::error::merge ref fetch failed on all 3 tries (240 s each) on runner ${RUNNER_NAME:-unknown}"; exit 1; }
            echo "::warning::merge ref fetch failed on try $try of 3, trying again"; sleep $((try == 1 ? 5 : 15))
          done
          if [[ -n "${SPARSE//[[:space:]]/}" ]]; then
            git config core.sparseCheckout true
            printf '%s\n' "$SPARSE" > .git/info/sparse-checkout
          fi
          # 8 parallel workers halve writing the ~69k-file tree (12.5 -> 6.2 s median, fresh .git or a sparse widen after a
          # narrower job on this VM; rnd rc-c6f133b4).
          git -c checkout.workers=8 checkout -q -f --detach "$SHA"
          # SPARSE may be empty: `reapply` exits 128 outside a sparse checkout; `disable` widens a reused sparse .git.
          if [[ $reuse == reused ]]; then if [[ -n "${SPARSE//[[:space:]]/}" ]]; then git sparse-checkout reapply; else git sparse-checkout disable; fi; fi
          echo "checked out $(git rev-parse HEAD) from the pool mirror workspace=$reuse"

      # head_tier.py, the router's own tier decision (pr-router.yml, ci.yml's changes job), with the same switches.
      # Its failure (continue-on-error) leaves skip empty: every job routes as before.
      - name: CI tier of this head
        id: tier
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'feat-cmux-next' && inputs.sha == '' }}
        continue-on-error: true
        env:
          CI_DRAFT_CHEAP_TIER: ${{ vars.CI_DRAFT_CHEAP_TIER || '1' }}
          CI_LAND_FULL_PER_PR: ${{ vars.CI_LAND_FULL_PER_PR || '0' }}
          CI_IDLE_BASE_MERGE_SKIP: ${{ vars.CI_IDLE_BASE_MERGE_SKIP || '1' }}
          CI_LAND_TIER: ${{ vars.CI_LAND_TIER || '1' }}
          CI_GREEN_BASE_MERGE_SKIP: ${{ vars.CI_GREEN_BASE_MERGE_SKIP || '1' }}
          CI_LAND_CARRY: ${{ vars.CI_LAND_CARRY || '1' }}
          # A full-ci or ready-to-land label on a head that only merges the base onto a head whose land tier ran
          # carries that run (head_tier.py's full-ci base merge carry rule); 0 turns that off.
          CI_FULL_CI_BASE_MERGE_CARRY: ${{ vars.CI_FULL_CI_BASE_MERGE_CARRY || '1' }}
          # Heavy jobs run only on the event that hands a head to land (head_tier.py's heavy-at-land rule); 0 turns that off.
          CI_HEAVY_AT_LAND: ${{ vars.CI_HEAVY_AT_LAND || '1' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f scripts/ci/head_tier.py ]; then exit 0; fi
          tier=$(python3 -I scripts/ci/head_tier.py tier)
          skip=false
          if [[ "$tier" == none || "$tier" == cheap ]]; then skip=true; fi
          echo "tier=$tier skip=$skip"
          { echo "tier=$tier"; echo "skip=$skip"; } >> "$GITHUB_OUTPUT"

      # Whether the change needs the crate graph at all (affected_jobs.py gate): it does when it touches this
      # workflow's push paths, a crate manifest or Rust source anywhere, or what `check` reads (the routed and
      # skipped workflows, the map, the router). A pull request that touches none skips the graph, its checkout
      # and the check (240 of the last 397 feat-cmux-next merges, 2026-11-24; about 50 s of this job's 63 s p50 went
      # to them): every routed job reads `false`, and the feat-cmux-next push still runs them all. A push, a dispatch or no base: needed (full-ci follows the graph).
      - name: Does the change need the crate graph?
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          TIER_SKIP: ${{ steps.tier.outputs.skip }}
        run: |
          # A none or cheap head (steps.tier) routes nothing: no crate graph, its checkout or the check.
          if [[ "$TIER_SKIP" == true ]]; then echo "needed=false" >> "$GITHUB_OUTPUT"; echo "tier skip: no graph"; exit 0; fi
          base=""
          if [[ "$EVENT_NAME" == pull_request ]]; then
            base=$(git rev-parse HEAD^1 2>/dev/null || true)
          fi
          python3 scripts/ci/affected_jobs.py gate --workflow .github/workflows/cmux-tui-spec.yml \
            --base "$base" --head HEAD --event "$EVENT_NAME" --labels "${LABELS:-[]}" --full-ci-follows-graph

      # The dirs the graph reads blobs under (the crate graph's manifests and sources, the map, the scripts).
      # `git sparse-checkout set` fetched their blobs in one batched request, about 32 s (2026-11-24), and stalled
      # whole when GitHub was slow (cmux#58001); the prefetch script splits it into parallel fetches it retries.
      # A full depth-2 checkout of the whole tree took 36 s of this job's 44 s (p50, 2026-11-21). A blob outside
      # these dirs reads as NeedsFullTree and routes every job (fail-open), never fewer.
      - name: Check out what the crate graph reads
        if: steps.gate.outputs.needed != 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s\n' /.github/ /scripts/ /tests/ /cmux-tui/ /first-party-apps/ /workers/ /schemas/ /plans/ /.gitmodules \
            | bash scripts/ci/prefetch-sparse-checkout.sh

      # The base side of the change: the crate graph also reads the base's copy of each changed file
      # (base_tree), which a blobless checkout lacks. One batched fetch of just those blobs (git diff
      # prefetches both sides); without it a change under cmux-tui/ would route every job.
      - name: Fetch the base copies of the changed files
        if: github.event_name == 'pull_request' && steps.gate.outputs.needed != 'false'
        continue-on-error: true
        run: git diff --no-renames --numstat HEAD^1 HEAD -- .github scripts tests cmux-tui first-party-apps workers schemas plans > /dev/null

      - name: Test the router
        if: steps.gate.outputs.needed != 'false'
        run: python3 .github/scripts/test_cmux_tui_spec_changed.py

      - name: Does the change touch this workflow's paths?
        id: route
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          base=""
          if [[ "$EVENT_NAME" == pull_request ]]; then
            base=$(git rev-parse HEAD^1 2>/dev/null || true)
          fi
          python3 .github/scripts/cmux-tui-spec-changed.py --workflow .github/workflows/cmux-tui-spec.yml --base "$base" --head HEAD

      # The heavy test jobs route by the crate graph, not by the paths above: each runs when the change
      # touches an input of a crate it tests (scripts/ci/affected-jobs.json; the crate, its path
      # dependencies and the files their sources name). A push, a dispatch, the full-ci label, a change to
      # the router and a path it cannot place run every job. The full-ci label runs every job the change can
      # affect (the pull request skips lifted), not the ones whose inputs match the base (--full-ci-follows-graph:
      # 2026-11-26, about 33,000 of this workflow's 96,000 runner-minutes a day were full-ci heads that touched none
      # of a heavy job's inputs). Unreadable labels or changes still run every job. A failed router runs them all on a push (the jobs
      # read `!= 'false'`) and none on a pull request, whose red router check is re-run instead (cmux#58001).
      - name: Which test jobs can the change affect (crate graph)
        id: graph
        if: steps.gate.outputs.needed != 'false'
        env:
          EVENT_NAME: ${{ github.event_name }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          base=""
          if [[ "$EVENT_NAME" == pull_request ]]; then
            base=$(git rev-parse HEAD^1 2>/dev/null || true)
          fi
          python3 scripts/ci/affected_jobs.py route --workflow .github/workflows/cmux-tui-spec.yml \
            --base "$base" --head HEAD --event "$EVENT_NAME" --labels "${LABELS:-[]}" --full-ci-follows-graph

      # acpmux tests run on a pull request only when the change touches acpmux's own crates or the job's own
      # inputs, not when it reaches them through a path dependency (CI 10x, 2026-11-21: 2.87% of pull request
      # runner-minutes, 0.93% of heads it alone caught). feat-cmux-next pushes still run it on every reach (the
      # router's safety net), so a red a dependency causes shows on the tip. A diff git cannot list runs it.
      - name: Does the change touch acpmux's own paths?
        id: acpmux-own
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          changed=true
          if [[ "$EVENT_NAME" == pull_request ]] && files=$(git diff --no-renames --name-only HEAD^1 HEAD 2>/dev/null); then
            if ! grep -Eq '^(cmux-tui/crates/acpmux[^/]*/|cmux-tui/(Cargo\.lock|rust-toolchain(\.toml)?)$|scripts/cmux-next/(run-v2-gates\.sh|v2-gates\.d/)|scripts/ci/(cargo_test_verdict|git_tree|test_reds|affected_jobs)\.py$|scripts/ci/affected-jobs\.json$|scripts/ci/acpmux-tests-pr-deferred\.txt$|tests/test_cargo_test_verdict\.py$|\.github/workflows/cmux-tui-spec\.yml$)' <<< "$files"; then
              changed=false
            fi
          fi
          echo "acpmux's own paths changed: $changed"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      # This job runs on every pull request, so a change that gives a routed job a new input (a new
      # include_str!, a fixture, a script) outside the `paths:` of that job's workflow fails here, by name,
      # rather than leaving the input untested. A red here runs every routed job. A change the gate passes
      # over touches nothing the check reads but the existence of a file a job names (the push checks it).
      - name: Every routed job's inputs are on its workflow's paths
        if: steps.gate.outputs.needed != 'false'
        run: python3 scripts/ci/affected_jobs.py check

  # A pull request that changes the crate-graph router (scripts/ci/affected_jobs.py's SELF) replays the
  # last 30 merged pull requests through the base's router and its own: what each runs, what changed, and
  # a red when the new one raises or skips a job on a change to that job's own crate.
  router-replay:
    name: crate-graph router replay
    needs: changes
    if: ${{ (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci') || (github.event.pull_request.draft == true && (vars.CI_DRAFT_CHEAP_TIER || '1') == '0') || (github.event.pull_request.draft != true && ((contains(github.event.pull_request.labels.*.name, 'ready-to-land') && vars.CI_LAND_FULL_PER_PR == '1') || github.event.pull_request.base.ref != 'feat-cmux-next' || github.event.pull_request.head.repo.full_name != github.repository || (vars.CI_LAND_TIER || '1') == '0'))) && (((inputs.only == '' || inputs.only == 'router-replay') && (!cancelled() && needs.changes.outputs.router_changed == 'true'))) && !(github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'feat-cmux-next' && (github.event.action == 'labeled' && !contains(fromJSON('["full-ci","ready-to-land"]'), github.event.label.name) || github.event.action == 'unlabeled')) }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || 'cmux-linux' }}
    timeout-minutes: 20
    steps:
      # The merge commit, its base parent and the 30 commits before it, each with its own parent.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          ref: ${{ inputs.sha || '' }}
          fetch-depth: 40

      - name: Replay merged pull requests through both routers
        run: |
          set -o pipefail
          python3 scripts/ci/affected_jobs_replay.py --base-ref HEAD^1 --limit 30 | tee -a "$GITHUB_STEP_SUMMARY"

  inventory:
    needs: changes
    # A router that failed or was skipped never skips the job (a skip passes a required check).
    # Tier A of the merged pull request replay (scripts/ci/affected-jobs.json pull_request_skip): a pull request
    # into feat-cmux-next skips it unless labeled full-ci; the post-merge batch runs it.
    if: ${{ (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci') || (github.event.pull_request.draft == true && (vars.CI_DRAFT_CHEAP_TIER || '1') == '0') || (github.event.pull_request.draft != true && ((contains(github.event.pull_request.labels.*.name, 'ready-to-land') && vars.CI_LAND_FULL_PER_PR == '1') || github.event.pull_request.base.ref != 'feat-cmux-next' || github.event.pull_request.head.repo.full_name != github.repository || (vars.CI_LAND_TIER || '1') == '0'))) && (((inputs.only == '' || inputs.only == 'inventory') && ((!cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.run == 'true')) && (github.event_name != 'pull_request' || !startsWith(github.event.pull_request.base.ref, 'feat-cmux-next') || contains(github.event.pull_request.labels.*.name, 'full-ci'))))) && !(github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'feat-cmux-next' && (github.event.action == 'labeled' && !contains(fromJSON('["full-ci","ready-to-land"]'), github.event.label.name) || github.event.action == 'unlabeled')) }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || 'cmux-linux' }}
    timeout-minutes: 10 # the machine join test runs its suite under three shells (about 4 min on a lane VM)
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          ref: ${{ inputs.sha || '' }}

      - name: Test inventory checker
        run: python3 cmux-tui/scripts/test_check_spec_inventory.py

      - name: Test frontend documentation protocol
        run: python3 cmux-tui/scripts/test_frontend_docs.py

      - name: Test the machine join script
        run: sh cmux-tui/scripts/machine-join.test.sh

      # The signed Linux release file path of install-static.sh and machine-join.sh
      # (cmuxterm-hq docs/design/linux-signed-packages.md section 8).
      - name: Test the installers' signed release file check
        run: sh cmux-tui/scripts/linux-release-verify.test.sh

      - name: Check protocol and TUI action inventory
        run: python3 cmux-tui/scripts/check-spec-inventory.py

      - name: Test deterministic SDK generator
        env:
          PYTHONPATH: cmux-tui/bindings
        run: python3 -m unittest discover -s cmux-tui/bindings/codegen/tests -v

      - name: Test SDK schema checker
        run: python3 cmux-tui/scripts/test_check_sdk_schema.py

      - name: Check SDK schema against runtime inventory
        run: python3 cmux-tui/scripts/check-sdk-schema.py

      # A schema change can change what a phone may send (DaemonLanePolicy+Fields.generated.swift).
      - name: Check the phone lane field allowlist
        run: python3 -I scripts/cmux-next/gen-phone-lane-fields.py --check

      - name: Test public resource boundary checker
        run: python3 cmux-tui/scripts/test_check_resource_api_boundary.py

      - name: Check public resource API boundary
        run: python3 cmux-tui/scripts/check-resource-api-boundary.py

      - name: Check generated SDK wire layers
        run: python3 cmux-tui/bindings/codegen/generate.py --check

  # A daemon protocol change that can break an older or newer peer must ship
  # a compat rule (cmux-tui/crates/cmux-api-compat; spec/api-compat.json).
  api-compat:
    needs: changes
    # A router that failed or was skipped never skips the job (a skip passes a required check).
    # Tier A of the merged pull request replay (scripts/ci/affected-jobs.json pull_request_skip): a pull request
    # into feat-cmux-next skips it unless labeled full-ci; the post-merge batch runs it.
    if: ${{ (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci') || (github.event.pull_request.draft == true && (vars.CI_DRAFT_CHEAP_TIER || '1') == '0') || (github.event.pull_request.draft != true && ((contains(github.event.pull_request.labels.*.name, 'ready-to-land') && vars.CI_LAND_FULL_PER_PR == '1') || github.event.pull_request.base.ref != 'feat-cmux-next' || github.event.pull_request.head.repo.full_name != github.repository || (vars.CI_LAND_TIER || '1') == '0'))) && (((inputs.only == '' || inputs.only == 'api-compat') && ((!cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.run == 'true')) && (github.event_name != 'pull_request' || !startsWith(github.event.pull_request.base.ref, 'feat-cmux-next') || contains(github.event.pull_request.labels.*.name, 'full-ci'))))) && !(github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'feat-cmux-next' && (github.event.action == 'labeled' && !contains(fromJSON('["full-ci","ready-to-land"]'), github.event.label.name) || github.event.action == 'unlabeled')) }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || 'cmux-linux' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          ref: ${{ inputs.sha || '' }}

      - name: Set up pinned Rust
        uses: ./.github/actions/setup-cmux-tui-rust

      - name: Protocol changes need compat rules
        working-directory: cmux-tui
        run: cargo run --locked -p cmux-api-compat --bin api-compat-check

      # acpmux's wire is an ABI too (hq RFD 0178): breaks need a rule in
      # crates/acpmux/spec/acpmux-abi.compat.json. Reads the committed IR, no acpmux build.
      - name: acpmux protocol changes need compat rules
        working-directory: cmux-tui
        run: cargo run --locked -p cmux-api-compat --bin api-compat-check -- --acpmux

  # spec/acpmux-protocol.json is generated from acpmux's protocol registry, and
  # webviews' build generates its TS types from that committed IR. Only
  # cmux-tui.yml (dispatch) ran `protocol_ir_is_current`, so #27050 added
  # _acpmux/mesh_control to the registry without the IR and left a base red until
  # #27556. This runs acpmux's protocol module tests (the IR among them) when a change
  # touches acpmux or its build inputs: everything the IR is made of lives in the
  # acpmux crate, plus schemars in the lockfile. Only the lib test target builds,
  # none of acpmux's integration test binaries.
  acpmux-protocol-ir:
    name: acpmux protocol IR is current
    needs: changes
    # By the crate graph (the changes job's graph step). A router that failed or was skipped never skips
    # the job (a skip passes a required check), and neither does a missing output.
    # A pull request whose files miss acpmux's own paths skips it even with full-ci (the post-merge batch and base
    # pushes still run it): 2026-11-26 14:00-21:03Z, the acpmux family took 7,125 runner-min (about 13 per merge)
    # on about 390 full-ci runs with acpmux_own=false, with 0 reds of the pull request's own (every red matched a red base).
    # A pull request that changes acpmux runs it: while pull requests skipped it (pull_request_skip Tier A),
    # base went red on a stale IR four times on 2026-11-26 (#55935's taskList, transfer_end_stale at
    # a8aa49b3, rooms and transcript_offload), each a protocol change whose own run would have failed.
    # Not on a pull request whose run also starts acpmux-tests (the conjunct after the land tier's): that job's
    # `cargo test -p acpmux --lib` builds the same lib test target and runs every protocol:: test with the rest
    # (none is in scripts/ci/acpmux-tests-pr-deferred.txt), so this job only built and ran them a second time. In
    # 2026-11-26 13:30-14:45Z it started beside acpmux-tests on most pull request runs, about 10 min each, about
    # 10.5k runner-min a day (Leo: "Okay, surely we don't need to do that many Linux builds, do we?"). The
    # conjunct is acpmux-tests' own `if` for a pull request with a router that succeeded; any other run keeps this job.
    if: ${{ ((github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci') || (github.event.pull_request.draft == true && (vars.CI_DRAFT_CHEAP_TIER || '1') == '0') || (github.event.pull_request.draft != true && ((contains(github.event.pull_request.labels.*.name, 'ready-to-land') && vars.CI_LAND_FULL_PER_PR == '1') || github.event.pull_request.base.ref != 'feat-cmux-next' || github.event.pull_request.head.repo.full_name != github.repository || (vars.CI_LAND_TIER || '1') == '0'))) && (((inputs.only == '' || inputs.only == 'acpmux-protocol-ir') && ((!cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.acpmux_protocol_ir != 'false')) && (github.event_name != 'pull_request' || needs.changes.outputs.acpmux_own != 'false')))) && !(github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'feat-cmux-next' && (github.event.action == 'labeled' && !contains(fromJSON('["full-ci","ready-to-land"]'), github.event.label.name) || github.event.action == 'unlabeled'))) && (github.event_name != 'pull_request' || needs.changes.result == 'success' || needs.changes.result == 'skipped') && !(github.event_name == 'pull_request' && inputs.only == '' && needs.changes.result == 'success' && needs.changes.outputs.acpmux_tests != 'false' && needs.changes.outputs.acpmux_own != 'false' && ((github.event_name != 'pull_request' || !startsWith(github.event.pull_request.base.ref, 'feat-cmux-next') || contains(github.event.pull_request.labels.*.name, 'full-ci')) || vars.ACPMUX_TESTS_ON_PULL_REQUESTS == 'on')) }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || 'cmux-linux' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          ref: ${{ inputs.sha || '' }}

      # A green result of this job for the same input tree (affected_jobs.py result_key) is this
      # run's result: the tested steps are skipped and the job reports green with that run named.
      - name: Reuse a green result for the same input tree
        id: tree
        uses: ./.github/actions/tree-result
        with:
          mode: restore
          job: acpmux-protocol-ir
          key: ${{ needs.changes.outputs.acpmux_protocol_ir_tree }}

      - name: Set up pinned Rust
        if: ${{ steps.tree.outputs.hit != 'true' }}
        uses: ./.github/actions/setup-cmux-tui-rust

      # Only a feat-cmux-next push saves the build cache; a pull request reads the base branch's.
      - name: Cache cargo build
        id: rust-cache
        if: ${{ steps.tree.outputs.hit != 'true' }}
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          workspaces: cmux-tui -> target
          shared-key: cmux-tui-acpmux-lib-test-${{ hashFiles('cmux-tui/rust-toolchain.toml', 'cmux-tui/Cargo.lock', '.cargo/config.toml') }}
          save-if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/feat-cmux-next' }}
          # Save even when the tip's tests are red: a red tip saved nothing, so every pull request built cold.
          cache-on-failure: true
          # Key on the toolchain file and lockfiles only, not the runner's CARGO_*/RUST* env: those hold
          # HOME paths that differ per runner (/home/runner vs /home/runner2), so a pull request missed the
          # base save unless it drew the same runner layout. Cargo's fingerprints check every reused crate.
          add-rust-environment-hash-key: false

      # `protocol::` selects exactly the protocol module's tests (src/protocol/tests.rs);
      # a filter that matches none (a moved module) fails rather than passing empty.
      # The GitHub cache is over its 10 GB cap and evicts rust-cache's feat-cmux-next save before pull requests
      # read it (every sampled run on 2026-11-26 found none and built cold, 6-16 min): on a miss the base's build comes
      # from R2 (cmux-ci-cache-next), as cmux-next.yml's fast-tier-cargo.
      # acpmux tests' build (acpmux's lib tests among its targets), read only: this job saves nothing.
      - name: Key the cargo build in R2
        id: r2-cargo-key
        if: ${{ github.repository == 'manaflow-ai/cmux' && steps.tree.outputs.hit != 'true' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          inputs="$( { git ls-files -z -- 'cmux-tui/Cargo.lock' 'cmux-tui/**/Cargo.lock' 'cmux-tui/rust-toolchain.toml' '.cargo/config.toml' \
            | xargs -0 sha256sum; rustc -Vv; cargo -V; } | sha256sum | cut -c1-16)"
          workspace="$(printf '%s' "$GITHUB_WORKSPACE" | sha256sum | cut -c1-8)"
          prefix="cmux-tui-spec-acpmux-tests-cargo-v1-$workspace-"
          {
            echo "target-prefix=$prefix"
            echo "target-key=$prefix$inputs"
            echo "registry-prefix=cmux-tui-spec-cargo-registry-v1-"
            echo "registry-key=cmux-tui-spec-cargo-registry-v1-$inputs"
            echo "registry=${CARGO_HOME:-$HOME/.cargo}/registry"
          } >> "$GITHUB_OUTPUT"

      # Only when rust-cache found nothing: a hit there is the same build, nearer.
      - name: Restore the cargo build from R2
        id: r2-cargo-target
        if: ${{ steps.tree.outputs.hit != 'true' && steps.r2-cargo-key.outputs.target-key != '' && steps.rust-cache.outputs.cache-hit != 'true' }}
        timeout-minutes: 4
        continue-on-error: true
        uses: ./.github/actions/cache-restore
        env:
          CI_CACHE_R2_PUBLIC_URL: https://ci-cache-next.cmux.com
        with:
          backend: r2
          path: cmux-tui/target
          key: ${{ steps.r2-cargo-key.outputs.target-key }}
          restore-keys: ${{ steps.r2-cargo-key.outputs.target-prefix }}

      - name: Restore the cargo registry from R2
        id: r2-cargo-registry
        if: ${{ steps.tree.outputs.hit != 'true' && steps.r2-cargo-key.outputs.registry-key != '' && steps.rust-cache.outputs.cache-hit != 'true' }}
        timeout-minutes: 4
        continue-on-error: true
        uses: ./.github/actions/cache-restore
        env:
          CI_CACHE_R2_PUBLIC_URL: https://ci-cache-next.cmux.com
        with:
          backend: r2
          path: ${{ steps.r2-cargo-key.outputs.registry }}
          key: ${{ steps.r2-cargo-key.outputs.registry-key }}
          restore-keys: ${{ steps.r2-cargo-key.outputs.registry-prefix }}

      - name: "cargo test -p acpmux --lib -- protocol::"
        if: ${{ steps.tree.outputs.hit != 'true' }}
        working-directory: cmux-tui
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/acpmux-protocol-tests.log"
          if ! cargo test --locked -p acpmux --lib -- protocol:: 2>&1 | tee "$log"; then
            # A stale Cargo.lock is named as such, not as a failed test (cargo-locks.py explain).
            if python3 ../scripts/cmux-next/cargo-locks.py explain "$log"; then exit 1; fi
            echo "::error title=acpmux protocol tests::a protocol test failed. A stale IR or ABI snapshot is regenerated with ACPMUX_PROTOCOL_BLESS=1 cargo test -p acpmux --lib protocol:: in cmux-tui (a break needs a rule in crates/acpmux/spec/acpmux-abi.compat.json first), then bun run acpmux-protocol:codegen in webviews"
            exit 1
          fi
          if ! grep -qE 'test result: ok\. [1-9][0-9]* passed' "$log"; then
            echo "::error title=acpmux protocol tests::the protocol:: filter matched no test; fix this step's filter"
            exit 1
          fi

      - name: Record this green result for its input tree
        if: ${{ success() && steps.tree.outputs.hit != 'true' }}
        uses: ./.github/actions/tree-result
        with:
          mode: save
          job: acpmux-protocol-ir
          key: ${{ needs.changes.outputs.acpmux_protocol_ir_tree }}

  # acpmux's lib tests (the inbox, turn cap and carried turn units among them) and its
  # hub_integration suite (agent_inbox, carried_turns, inbox_digest, ...) ran only in Fast
  # checks and on the fleet, so #27921 and #27868 landed red tests and left base red for
  # hours (2026-10-30). This runs both when a change touches acpmux or its build inputs.
  # A red head run is judged per test (scripts/ci/cargo_test_verdict.py, which uses
  # test_reds.py): a failing test that is red in feat-cmux-next's own last run of this job (the
  # log each push saves, at most 3 h old) is the base's; any other runs again alone on the
  # head, and one that fails alone too runs on the merge parent. A flake or a test that fails
  # on the base too only warns, and a crash, a cut-short binary, a compile error or a test the
  # base passes fails the job. A feat-cmux-next push runs the suites plainly, so a base red
  # shows red there. Base stood red on about 22 tests from 2026-11-20, and retrying them all
  # alone and rebuilding the whole merge parent to replay them took 11 of a run's 35 minutes
  # (job 136819139023); the saved log answers those without a rebuild.
  # The acpmux-* crates acpmux is built from (acpmux-book, acpmux-core, acpmux-client,
  # acpmux-build-id, acpmux-list-types) run here too, lib and tests/: no hosted job ran them,
  # so two changes left their tests red on base in one day (2026-11-14): #42834 changed what
  # acpmux-book answers and left acpmux-core's test of the old answer, and #42906 left two
  # acpmux-core tests that #42943 repaired. tests/test_cargo_test_verdict.py fails when the
  # suites miss such a crate or one of its tests/ files. acpmux's own tests/v2_gate_home.rs
  # runs here as well: it is the only test build of the v2 gate registry (benches/v2/mod.rs),
  # no hosted job ran it, and #42725 left two of its tests red on base. The same Python test
  # asks for every tests/v2_*.rs of acpmux that holds a test a plain run starts.
  # tests/permission_matrix.rs runs here too: every harness x access level x chat x host x
  # default-policy combination a person meets, so a change to acpmux's permission handling
  # shows its red on its own pull request (Leo, 2026-11-17: "we need to test out more of these
  # permission related combinations in ci"). The job and
  # step keep their names: the scope step finds earlier runs by them.
  # tests/daemon_list_order_start.rs (the start task sorts the list order before any chat log
  # is read) runs here too: no pull request check ran it.
  acpmux-tests:
    name: acpmux tests (lib, hub_integration)
    needs: changes
    # By the crate graph (the changes job's graph step). A router that failed or was skipped never skips
    # the job (a skip passes a required check), and neither does a missing output.
    # On a pull request, only when acpmux's own paths change (the changes job's acpmux-own step), full-ci included:
    # full-ci lifts the feat-cmux-next skip below but not this one. A full-ci PR reaching acpmux only through a path
    # dependency ran the whole suite on every head (25T17-26T17Z: 1,162 PR runs, 28.2k job-min, ~24 min each; 18 of
    # 27 sampled touched no acpmux path); the post-merge batch still runs it on every reach.
    # Tier B of the merged pull request replay (scripts/ci/affected-jobs.json pull_request_skip): a pull request into
    # feat-cmux-next skips it unless labeled full-ci, and the post-merge batch (suite cmux-tui-spec) runs it. In
    # 11-13Z on 2026-11-23 it took 2,567 runner-min on 96 pull requests, and about 3 of the 14 reds sampled were the
    # pull request's own. Off: the repository variable ACPMUX_TESTS_ON_PULL_REQUESTS=on runs it on pull requests again.
    if: ${{ ((github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci') || (github.event.pull_request.draft == true && (vars.CI_DRAFT_CHEAP_TIER || '1') == '0') || (github.event.pull_request.draft != true && ((contains(github.event.pull_request.labels.*.name, 'ready-to-land') && vars.CI_LAND_FULL_PER_PR == '1') || github.event.pull_request.base.ref != 'feat-cmux-next' || github.event.pull_request.head.repo.full_name != github.repository || (vars.CI_LAND_TIER || '1') == '0'))) && (((inputs.only == '' || inputs.only == 'acpmux-tests') && (!cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.acpmux_own != 'false') && (needs.changes.result != 'success' || needs.changes.outputs.acpmux_tests != 'false')) && ((github.event_name != 'pull_request' || !startsWith(github.event.pull_request.base.ref, 'feat-cmux-next') || contains(github.event.pull_request.labels.*.name, 'full-ci')) || vars.ACPMUX_TESTS_ON_PULL_REQUESTS == 'on'))) && !(github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'feat-cmux-next' && (github.event.action == 'labeled' && !contains(fromJSON('["full-ci","ready-to-land"]'), github.event.label.name) || github.event.action == 'unlabeled'))) && (github.event_name != 'pull_request' || needs.changes.result == 'success' || needs.changes.result == 'skipped') }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || 'cmux-linux' }}
    timeout-minutes: 40
    # A feat-cmux-next run saves the base's test log to R2 (cmux-ci-cache-next). Only next-cache-writer holds the
    # write credentials, and its deployment branches are feat-cmux-next only (tests/test_ci_pull_request_caches_are_read_only.py).
    environment: ${{ github.ref == 'refs/heads/feat-cmux-next' && 'next-cache-writer' || '' }}
    env:
      CI_CACHE_R2_BUCKET: cmux-ci-cache-next
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          ref: ${{ inputs.sha || '' }}

      # The test step's time budget counts from here, so it ends with a verdict inside timeout-minutes.
      - name: Start the time budget
        run: echo "ACPMUX_TESTS_STARTED=$(date +%s)" >> "$GITHUB_ENV"

      # A green result of this job for the same input tree (affected_jobs.py result_key) is this
      # run's result: the tested steps are skipped and the job reports green with that run named.
      - name: Reuse a green result for the same input tree
        id: tree
        uses: ./.github/actions/tree-result
        with:
          mode: restore
          job: acpmux-tests
          key: ${{ needs.changes.outputs.acpmux_tests_tree }}

      - name: Test the per-test verdict
        if: ${{ steps.tree.outputs.hit != 'true' }}
        run: python3 tests/test_cargo_test_verdict.py

      # A red head run replays its failing tests on the merge parent (the test step): fetch it.
      - name: Fetch the merge parent
        id: scope
        if: ${{ steps.tree.outputs.hit != 'true' && (github.event_name == 'pull_request') }}
        run: |
          base=$(git cat-file -p HEAD | awk '/^parent /{print $2; exit}')
          if [[ "$base" =~ ^[0-9a-f]{40}$ ]] && git fetch --no-tags --depth=1 origin "$base"; then
            echo "base=$base" >> "$GITHUB_OUTPUT"
          fi

      # feat-cmux-next's own last run of this job (saved below by each push): the merge parent's when
      # that push ran it, else the newest. The test step uses it only when at most 3 h old.
      - name: Restore the base's last test log
        if: ${{ steps.tree.outputs.hit != 'true' && github.event_name == 'pull_request' }}
        uses: ./.github/actions/cache-restore
        env:
          CI_CACHE_R2_PUBLIC_URL: https://ci-cache-next.cmux.com
        with:
          # R2, not the GitHub cache: that store is over its 10 GB cap and evicted this small entry before
          # pull requests read it, so their base comparison missed and every base red was charged to them.
          backend: r2
          path: ${{ runner.temp }}/acpmux-base-run
          key: acpmux-tests-base-log-${{ steps.scope.outputs.base || 'none' }}
          restore-keys: acpmux-tests-base-log-

      # As cmux-tui.yml's Linux test job: acpmux's sandbox tests need bubblewrap.
      - name: Install bubblewrap
        if: ${{ steps.tree.outputs.hit != 'true' }}
        run: |
          bash scripts/ci/apt-ensure.sh bubblewrap
          # Ubuntu 24.04 (the pool runners) refuses unprivileged user namespaces to unconfined
          # programs, so bwrap cannot start and the four linux_sandbox::bwrap tests fail on every
          # run, base included (as cmux-tui-sdks.yml).
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          echo "ACPMUX_REQUIRE_BWRAP=1" >> "$GITHUB_ENV"

      - name: Set up pinned Rust
        if: ${{ steps.tree.outputs.hit != 'true' }}
        uses: ./.github/actions/setup-cmux-tui-rust

      # The test step's library runner: a three-crate workspace, about 10 s.
      - name: Test the library test runner
        if: ${{ steps.tree.outputs.hit != 'true' }}
        run: bash scripts/ci/tests/cargo-lib-tests-at-once.test.sh

      # Only a feat-cmux-next push saves the build cache; a pull request reads the base branch's.
      - name: Cache cargo build
        id: rust-cache
        if: ${{ steps.tree.outputs.hit != 'true' }}
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          workspaces: cmux-tui -> target
          shared-key: cmux-tui-acpmux-tests-${{ hashFiles('cmux-tui/rust-toolchain.toml', 'cmux-tui/Cargo.lock', '.cargo/config.toml') }}
          save-if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/feat-cmux-next' }}
          # Save even when the tip's tests are red: a red tip saved nothing, so every pull request built cold.
          cache-on-failure: true
          # Keyed on the pinned toolchain and the lockfile, not on rust-cache's environment hash: that
          # hashes every toolchain `rustup toolchain list` shows, and the pool hosts keep different
          # leftover ones (1.88, 1.98.1, 1.100 beside the pinned 1.95), so each host saved and looked
          # under its own key: 117 of 133 runs in 18-23Z on 2026-11-21 found no cache and built cold.
          # Key on the toolchain file and lockfiles only, not the runner's CARGO_*/RUST* env: those hold
          # HOME paths that differ per runner (/home/runner vs /home/runner2), so a pull request missed the
          # base save unless it drew the same runner layout. Cargo's fingerprints check every reused crate.
          add-rust-environment-hash-key: false

      # The GitHub cache is over its 10 GB cap and evicts rust-cache's feat-cmux-next save before pull requests
      # read it (every sampled run on 2026-11-26 found none and built cold, 6-16 min): on a miss the base's build comes
      # from R2 (cmux-ci-cache-next), as cmux-next.yml's fast-tier-cargo.
      - name: Key the cargo build in R2
        id: r2-cargo-key
        if: ${{ github.repository == 'manaflow-ai/cmux' && steps.tree.outputs.hit != 'true' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          inputs="$( { git ls-files -z -- 'cmux-tui/Cargo.lock' 'cmux-tui/**/Cargo.lock' 'cmux-tui/rust-toolchain.toml' '.cargo/config.toml' \
            | xargs -0 sha256sum; rustc -Vv; cargo -V; } | sha256sum | cut -c1-16)"
          workspace="$(printf '%s' "$GITHUB_WORKSPACE" | sha256sum | cut -c1-8)"
          prefix="cmux-tui-spec-acpmux-tests-cargo-v1-$workspace-"
          {
            echo "target-prefix=$prefix"
            echo "target-key=$prefix$inputs"
            echo "registry-prefix=cmux-tui-spec-cargo-registry-v1-"
            echo "registry-key=cmux-tui-spec-cargo-registry-v1-$inputs"
            echo "registry=${CARGO_HOME:-$HOME/.cargo}/registry"
          } >> "$GITHUB_OUTPUT"

      # Only when rust-cache found nothing: a hit there is the same build, nearer.
      - name: Restore the cargo build from R2
        id: r2-cargo-target
        if: ${{ steps.tree.outputs.hit != 'true' && steps.r2-cargo-key.outputs.target-key != '' && steps.rust-cache.outputs.cache-hit != 'true' }}
        timeout-minutes: 4
        continue-on-error: true
        uses: ./.github/actions/cache-restore
        env:
          CI_CACHE_R2_PUBLIC_URL: https://ci-cache-next.cmux.com
        with:
          backend: r2
          path: cmux-tui/target
          key: ${{ steps.r2-cargo-key.outputs.target-key }}
          restore-keys: ${{ steps.r2-cargo-key.outputs.target-prefix }}

      - name: Restore the cargo registry from R2
        id: r2-cargo-registry
        if: ${{ steps.tree.outputs.hit != 'true' && steps.r2-cargo-key.outputs.registry-key != '' && steps.rust-cache.outputs.cache-hit != 'true' }}
        timeout-minutes: 4
        continue-on-error: true
        uses: ./.github/actions/cache-restore
        env:
          CI_CACHE_R2_PUBLIC_URL: https://ci-cache-next.cmux.com
        with:
          backend: r2
          path: ${{ steps.r2-cargo-key.outputs.registry }}
          key: ${{ steps.r2-cargo-key.outputs.registry-key }}
          restore-keys: ${{ steps.r2-cargo-key.outputs.registry-prefix }}

      - name: v2 bench home emits all gate rows
        if: ${{ steps.tree.outputs.hit != 'true' }}
        working-directory: cmux-tui
        run: |
          output="$RUNNER_TEMP/acpmux-v2-bench.json"
          # The test step's profile, not bench's (release: thin LTO, acpmux at one codegen unit).
          # With no --measures the home only lists its rows and times nothing, so optimizing it
          # bought nothing, and the release build was a second full build of acpmux and every
          # dependency beside the test step's; under the test profile the test step reuses it.
          cargo bench -q --profile test -p acpmux --bench v2 -- --output "$output"
          python3 - "$output" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as f:
              rows = json.load(f)["rows"]
          expected = {"1", "1b", "2", "2b", "3", "4", "5", "5b", "6", "7", "8", "9", "10", "11", "12", "13"}
          assert expected.issubset({row["pr"] for row in rows})
          PY

      - name: cargo test -p acpmux --lib --test hub_integration
        id: test
        if: ${{ steps.tree.outputs.hit != 'true' }}
        working-directory: cmux-tui
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ steps.scope.outputs.base }}
          BASE_RUN: ${{ runner.temp }}/acpmux-base-run
          JOB: acpmux tests
          DEFER: ${{ vars.ACPMUX_TESTS_PR_DEFER }}
          FULL_CI: ${{ contains(github.event.pull_request.labels.*.name, 'full-ci') }}
        run: |
          set -o pipefail
          umask 022
          verdict=../scripts/ci/cargo_test_verdict.py
          head_log="$RUNNER_TEMP/acpmux-tests-head.log"
          suites=(--locked -p acpmux -p acpmux-book -p acpmux-build-id -p acpmux-client -p acpmux-core
            -p acpmux-list-types --lib --test hub_integration --test ffi --test v2_client
            --test v2_gate_home --test v2_chat_recorded_stream --test permission_matrix
            --test daemon_list_order_start --test durable_watch_lifecycle --test transfer_cli --no-fail-fast)
          # The two concurrent runs below: every package with the libraries, every package with the
          # integration test targets (tests/test_cargo_test_verdict.py reads `suites` itself).
          pkgs=() targets=()
          for ((i = 0; i < ${#suites[@]}; i++)); do
            case "${suites[i]}" in
              --locked) pkgs+=(--locked) ;;
              -p) pkgs+=(-p "${suites[i + 1]}"); i=$((i + 1)) ;;
              --test) targets+=(--test "${suites[i + 1]}"); i=$((i + 1)) ;;
            esac
          done
          # A pull request skips the slowest tests (scripts/ci/acpmux-tests-pr-deferred.txt): each ran past 60 s
          # in most pull request runs and set the run's length. The post-merge batch runs every test, so a red
          # one of them causes shows on the tip. Off: the full-ci label, or the repository variable
          # ACPMUX_TESTS_PR_DEFER=off.
          skip=()
          if [[ "$EVENT_NAME" == pull_request && "$FULL_CI" != true && "$DEFER" != off ]]; then
            while read -r name; do
              [[ -n "$name" && "$name" != \#* ]] && skip+=(--skip "$name")
            done < ../scripts/ci/acpmux-tests-pr-deferred.txt
            (( ${#skip[@]} )) && skip=(--exact "${skip[@]}")
            echo "acpmux tests: $(( (${#skip[@]} - 1) / 2 )) slow test(s) deferred to the post-merge batch" >> "$GITHUB_STEP_SUMMARY"
          fi
          started=$SECONDS
          # The time budget: the job's 40-minute cap (timeout-minutes) cancels a run with no verdict, and 43 pull
          # request runs in 12-18Z on 2026-11-22 (1,512 min) ended so, in a slow host's library tests or in the merge
          # parent's replay. Every run here stops at the budget instead: what it cut short is printed and judged
          # red by name. The steps after this one get the rest (the push saves the cargo cache).
          reserve=150
          [[ "$EVENT_NAME" == pull_request ]] || reserve=420
          deadline=$(( ${ACPMUX_TESTS_STARTED:-$(date +%s)} + 40 * 60 - reserve ))
          out_of_time="$RUNNER_TEMP/acpmux-tests-out-of-time"
          # The seconds left before the deadline less $1 (kept for what follows), at least 1.
          left() { local n=$(( deadline - ${1:-0} - $(date +%s) )); echo $(( n > 1 ? n : 1 )); }
          # COMMAND, stopped at the budget less $1 s: timeout signals its whole process group (cargo and the
          # test binary it runs), and the run is marked out of time.
          bounded() {
            local keep=$1 rc=0
            shift
            timeout -k 20 "$(left "$keep")" "$@" || rc=$?
            (( rc == 124 || rc == 137 )) && echo "$*" >> "$out_of_time"
            return "$rc"
          }
          # One build, then the library tests and the integration tests run at once: one after
          # another the host sat mostly idle behind each binary's slowest few tests (acpmux's lib
          # ~390 s, acpmux-book's ~200 s, hub_integration ~200 s on a quiet host). Both runs keep
          # every -p, so cargo resolves the same features and rebuilds nothing;
          # the integration tests print as they run and the libraries' log follows them.
          run_all() {
            bounded 60 cargo test "${suites[@]}" --no-run 2>&1 || return 1
            local libs=0 tests=0
            # Each package's library binary runs at once with the others (RFD 0016, one shard per
            # workspace member group): `cargo test --lib` ran acpmux's (~431 s) and then
            # acpmux-book's (~208 s). The log reads as cargo prints it, one binary after another.
            bounded 60 ../scripts/ci/cargo-lib-tests-at-once.sh "$RUNNER_TEMP/acpmux-tests-lib" "${pkgs[@]}" -- "${skip[@]}" \
              > "$RUNNER_TEMP/acpmux-tests-lib.log" 2>&1 &
            local lib_pid=$!
            bounded 60 cargo test "${pkgs[@]}" "${targets[@]}" --no-fail-fast -- "${skip[@]}" 2>&1 || tests=$?
            wait "$lib_pid" || libs=$?
            cat "$RUNNER_TEMP/acpmux-tests-lib.log"
            if (( libs == 124 || libs == 137 )); then
              # Stopped at the budget, the script printed none of its binaries' logs: print each as far as it got.
              for log in "$RUNNER_TEMP"/acpmux-tests-lib/[0-9]*.log; do
                [[ -f "$log" ]] && { echo "     Running unittests (stopped at the time budget: $(basename "$log"))"; cat "$log"; }
              done
            fi
            (( libs == 0 && tests == 0 ))
          }
          if run_all 2>&1 | tee "$head_log"; then
            echo "acpmux tests: green in $((SECONDS - started)) s" >> "$GITHUB_STEP_SUMMARY"
            echo "clean=true" >> "$GITHUB_OUTPUT"  # green on its own: the only green the tree result keeps
            exit 0
          fi
          if [[ -s "$out_of_time" ]]; then
            # Named by the run's own "has been running for over 60 seconds" lines that never finished.
            running=$(sed -nE 's/.*test (.+) has been running for over 60 seconds.*/\1/p' "$head_log" | sort -u |
              while read -r name; do grep -qF "test $name ... " "$head_log" || echo "$name"; done | head -20 | paste -sd ' ')
            echo "::error title=$JOB (out of time)::the run reached the job's time budget after $((SECONDS - started)) s and was stopped before the 40-minute cap; still running: ${running:-none named}"
            echo "acpmux tests: stopped at the time budget after $((SECONDS - started)) s (still running: ${running:-none named})" >> "$GITHUB_STEP_SUMMARY"
            # Cut short, the run is red whatever a retry or the merge parent says: judged now, by name, with no
            # retry or replay.
            python3 "$verdict" judge --head "$head_log" --job "$JOB" || true
            exit 1
          fi
          if [[ "$EVENT_NAME" != pull_request ]]; then
            exit 1
          fi
          mapfile -t names < <(python3 "$verdict" failed "$head_log")
          retry_log="$RUNNER_TEMP/acpmux-tests-retry.log"
          base_log="$RUNNER_TEMP/acpmux-tests-base.log"
          # feat-cmux-next's own last run: a test red there is the base's (the judge reads it), so it
          # is neither retried nor replayed.
          recent=() base_red=()
          if [[ -f "$BASE_RUN/head.log.gz" && "$(cat "$BASE_RUN/time" 2>/dev/null)" =~ ^[0-9]+$ ]] &&
            (( $(date +%s) - $(cat "$BASE_RUN/time") <= 10800 )); then
            base_run_sha=$(head -c 40 "$BASE_RUN/sha" 2>/dev/null || true)
            gunzip -c "$BASE_RUN/head.log.gz" > "$RUNNER_TEMP/acpmux-tests-base-run.log"
            recent=(--recent-base "$RUNNER_TEMP/acpmux-tests-base-run.log"
              --recent-base-label "feat-cmux-next's own run at ${base_run_sha:0:12}")
            mapfile -t base_red < <(python3 "$verdict" failed "$RUNNER_TEMP/acpmux-tests-base-run.log")
            echo "base's own run at ${base_run_sha:0:12}: ${#base_red[@]} red test(s)"
          fi
          todo=()
          for name in "${names[@]}"; do
            [[ " ${base_red[*]} " == *" $name "* ]] || todo+=("$name")
          done
          # Many failures at once are no flake: the retry runs only a few, alone.
          if (( ${#todo[@]} > 0 && ${#todo[@]} <= 30 )); then
            echo "::group::retry ${#todo[@]} failing test(s) alone on the head"
            bounded 30 cargo test "${suites[@]}" -- --exact --test-threads=1 "${todo[@]}" > "$retry_log" 2>&1 || true
            cat "$retry_log"
            echo "::endgroup::"
            # A test that passed alone is a flake already: only the rest need the merge parent.
            failed_alone=()
            for name in "${todo[@]}"; do
              grep -qxF "test $name ... ok" "$retry_log" || failed_alone+=("$name")
            done
            todo=("${failed_alone[@]}")
          fi
          # The replay rebuilds the crates the change touched on the merge parent (up to 9 min when acpmux-core changed):
          # with less time left than that it would only reach the
          # cap, so the judge reads the base's own recent run alone and says so.
          if (( ${#todo[@]} > 0 )) && [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] && (( $(left) < 600 )); then
            echo "::warning title=$JOB::no time for the merge parent's replay ($(left) s left of the budget); judged on the base's recent run, if one was found"
            echo "acpmux tests: merge parent replay skipped, $(left) s left of the budget" >> "$GITHUB_STEP_SUMMARY"
          elif (( ${#todo[@]} > 0 )) && [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            names=("${todo[@]}")
            echo "::group::replay ${#names[@]} failing test(s) on the merge parent ${BASE_SHA:0:12}"
            # The scope step fetched the merge parent. It is built in place, in this same checkout, and the head is
            # checked out again after: cargo keys every workspace crate on its source path, so a worktree elsewhere
            # ($RUNNER_TEMP/acpmux-base until 2026-11-27) rebuilt the whole workspace, about 9 min of a red run
            # (job 140187307508: 9m 10s for the head, 9m 02s for the parent). In place git rewrites only the files
            # that differ, so cargo rebuilds only the crates the change touched and those depending on them.
            head_sha=$(git rev-parse HEAD)
            if git -C "$GITHUB_WORKSPACE" checkout -q -f --detach "$BASE_SHA"; then
              # A test target the change adds is not on the merge parent, and cargo refuses the
              # whole run for one unknown `--test`: every red then read as the change's own
              # (#45327, which adds tests/permission_matrix.rs). The replay names only targets
              # the parent has.
              base_suites=()
              for ((i = 0; i < ${#suites[@]}; i++)); do
                if [[ "${suites[i]}" != --test ]]; then
                  base_suites+=("${suites[i]}")
                  continue
                fi
                i=$((i + 1))
                if compgen -G "crates/*/tests/${suites[i]}.rs" ||
                  compgen -G "crates/*/tests/${suites[i]}/main.rs"; then
                  base_suites+=(--test "${suites[i]}")
                fi > /dev/null
              done
              bounded 30 cargo test "${base_suites[@]}" -- --exact "${names[@]}" > "$base_log" 2>&1 || true
              # The head again before anything else reads the checkout (the verdict script, the saves below).
              git -C "$GITHUB_WORKSPACE" checkout -q -f --detach "$head_sha" ||
                { echo "::error title=$JOB::could not check the head out again after the merge parent replay"; exit 1; }
            fi
            cat "$base_log" 2>/dev/null || true
            echo "::endgroup::"
          fi
          echo "acpmux tests: red head run judged after $((SECONDS - started)) s" >> "$GITHUB_STEP_SUMMARY"
          python3 "$verdict" judge --head "$head_log" --retry "$retry_log" --base "$base_log" --job "$JOB" "${recent[@]}"

      # feat-cmux-next's build for the R2 restore above, red or green (as rust-cache's cache-on-failure): dependencies
      # only, as rust-cache keeps (scripts/ci/cargo_target_strip.py; cmux-next.yml's fast-tier-cargo does the same).
      - name: Strip the workspace's own output before the R2 save
        id: r2-cargo-strip
        if: ${{ !cancelled() && steps.tree.outputs.hit != 'true' && (steps.test.outcome == 'success' || steps.test.outcome == 'failure') && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.sha != '' && inputs.only == '')) && github.ref == 'refs/heads/feat-cmux-next' && steps.r2-cargo-key.outputs.target-key != '' && steps.r2-cargo-target.outputs.cache-hit != 'true' }}
        continue-on-error: true
        env:
          REGISTRY: ${{ steps.r2-cargo-key.outputs.registry }}
        run: |
          set -euo pipefail
          # Inside the job's 40-minute cap: a save that would run past it is skipped, not cut off.
          if [[ -n "${ACPMUX_TESTS_STARTED:-}" ]] && (( $(date +%s) - ACPMUX_TESTS_STARTED > 30 * 60 )); then
            echo "R2 cargo save skipped: under 10 min left in the job" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          # --cargo-metadata, not every target name as --workspace-crates: tests/http.rs and tests/digest.rs
          # are named like the third-party http and digest, so that deleted them and a restore rebuilt 27 crates.
          cargo metadata --no-deps --format-version 1 --manifest-path cmux-tui/Cargo.toml > "$RUNNER_TEMP/cargo-metadata.json"
          python3 -I scripts/ci/cargo_target_strip.py cmux-tui/target --cargo-metadata "$RUNNER_TEMP/cargo-metadata.json"
          rm -rf "$REGISTRY/src"
          du -sh cmux-tui/target "$REGISTRY" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Save the cargo build to R2
        if: ${{ !cancelled() && steps.tree.outputs.hit != 'true' && steps.r2-cargo-strip.outcome == 'success' }}
        timeout-minutes: 6
        continue-on-error: true
        uses: ./.github/actions/cache-save
        env:
          CI_CACHE_R2_PUBLIC_URL: https://ci-cache-next.cmux.com
          AWS_ACCESS_KEY_ID: ${{ secrets.CI_CACHE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CI_CACHE_R2_SECRET_ACCESS_KEY }}
          CI_CACHE_R2_ENDPOINT: ${{ format('https://{0}.r2.cloudflarestorage.com', secrets.CI_CACHE_R2_ACCOUNT_ID) }}
        with:
          backend: r2
          path: cmux-tui/target
          key: ${{ steps.r2-cargo-key.outputs.target-key }}

      - name: Save the cargo registry to R2
        if: ${{ !cancelled() && steps.tree.outputs.hit != 'true' && steps.r2-cargo-strip.outcome == 'success' && steps.r2-cargo-registry.outputs.cache-hit != 'true' }}
        timeout-minutes: 6
        continue-on-error: true
        uses: ./.github/actions/cache-save
        env:
          CI_CACHE_R2_PUBLIC_URL: https://ci-cache-next.cmux.com
          AWS_ACCESS_KEY_ID: ${{ secrets.CI_CACHE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CI_CACHE_R2_SECRET_ACCESS_KEY }}
          CI_CACHE_R2_ENDPOINT: ${{ format('https://{0}.r2.cloudflarestorage.com', secrets.CI_CACHE_R2_ACCOUNT_ID) }}
        with:
          backend: r2
          path: ${{ steps.r2-cargo-key.outputs.registry }}
          key: ${{ steps.r2-cargo-key.outputs.registry-key }}

      # The whole log of this push's run, red or green, for the pull requests into feat-cmux-next (the restore
      # step above): a few hundred kB gzipped, one per push that ran the tests, restored by prefix.
      # feat-cmux-next runs this job only in the post-merge batch (a workflow_call from a workflow_dispatch,
      # inputs.sha the tested tip), never on a push: with `push` alone nothing was saved after #52321, every red
      # pull request found no base log, retried the base's own reds alone and replayed them on a rebuilt merge
      # parent (about 15 of a red run's 33 min), and a base test flaky there read as the change's own red. A
      # bisect probe (inputs.only) tests an old commit, so it saves nothing.
      - name: Save this push's test log for pull requests
        if: ${{ !cancelled() && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.sha != '' && inputs.only == '')) && github.ref == 'refs/heads/feat-cmux-next' && steps.tree.outputs.hit != 'true' && (steps.test.outcome == 'success' || steps.test.outcome == 'failure') }}
        env:
          TESTED_SHA: ${{ inputs.sha }}
        run: |
          dir="$RUNNER_TEMP/acpmux-base-run"
          [[ -s "$RUNNER_TEMP/acpmux-tests-head.log" ]] || exit 0
          mkdir -p "$dir"
          gzip -c "$RUNNER_TEMP/acpmux-tests-head.log" > "$dir/head.log.gz"
          echo "${TESTED_SHA:-$GITHUB_SHA}" > "$dir/sha"
          date +%s > "$dir/time"

      - name: Save the base's last test log
        if: ${{ !cancelled() && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.sha != '' && inputs.only == '')) && github.ref == 'refs/heads/feat-cmux-next' && steps.tree.outputs.hit != 'true' && (steps.test.outcome == 'success' || steps.test.outcome == 'failure') }}
        uses: ./.github/actions/cache-save
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CI_CACHE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CI_CACHE_R2_SECRET_ACCESS_KEY }}
          CI_CACHE_R2_ENDPOINT: ${{ format('https://{0}.r2.cloudflarestorage.com', secrets.CI_CACHE_R2_ACCOUNT_ID) }}
          CI_CACHE_R2_BUCKET: cmux-ci-cache-next
          CI_CACHE_R2_PUBLIC_URL: https://ci-cache-next.cmux.com
        with:
          backend: r2
          path: ${{ runner.temp }}/acpmux-base-run
          key: acpmux-tests-base-log-${{ inputs.sha || github.sha }}
          # Pull requests judge base reds by this entry: a save that wrote nothing fails, not warns.
          required: true

      # A red the judge excused (a flake that passed alone, a test red on the merge parent too) is green
      # for this base only: it is not kept for the tree.
      - name: Record this green result for its input tree
        if: ${{ success() && steps.tree.outputs.hit != 'true' && steps.test.outputs.clean == 'true' }}
        uses: ./.github/actions/tree-result
        with:
          mode: save
          job: acpmux-tests
          key: ${{ needs.changes.outputs.acpmux_tests_tree }}

  # The deterministic simulation of the daemon (tests/sim.rs, HQ#6740): the real hub under a
  # simulated runtime, network, disk and clock, with crashes and partitions at any step. Each
  # seed checks that no prompt or steer is lost or applied twice, that seq has no gaps and that
  # a resumed chat ends as an uninterrupted one. A failing seed prints the command that replays
  # it. acpmux-sim-sweep.yml runs thousands of seeds a day; this runs a few hundred per change.
  acpmux-sim:
    name: acpmux simulation (seeds)
    needs: changes
    # By the crate graph (the changes job's graph step). A router that failed or was skipped never skips
    # the job (a skip passes a required check), and neither does a missing output.
    # Tier A of the merged pull request replay (scripts/ci/affected-jobs.json pull_request_skip): a pull request
    # into feat-cmux-next skips it unless labeled full-ci; the post-merge batch runs it.
    # A pull request whose files miss acpmux's own paths skips it even with full-ci (the post-merge batch and base
    # pushes still run it): 2026-11-26 14:00-21:03Z, the acpmux family took 7,125 runner-min (about 13 per merge)
    # on about 390 full-ci runs with acpmux_own=false, with 0 reds of the pull request's own (every red matched a red base).
    # The last conjunct keeps seeded simulations off pull requests into feat-cmux-next unless SIMS_ON_PULL_REQUESTS=on.
    if: ${{ ((github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci') || (github.event.pull_request.draft == true && (vars.CI_DRAFT_CHEAP_TIER || '1') == '0') || (github.event.pull_request.draft != true && ((contains(github.event.pull_request.labels.*.name, 'ready-to-land') && vars.CI_LAND_FULL_PER_PR == '1') || github.event.pull_request.base.ref != 'feat-cmux-next' || github.event.pull_request.head.repo.full_name != github.repository || (vars.CI_LAND_TIER || '1') == '0'))) && (((inputs.only == '' || inputs.only == 'acpmux-sim') && ((!cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.acpmux_sim != 'false')) && (github.event_name != 'pull_request' || needs.changes.outputs.acpmux_own != 'false') && (github.event_name != 'pull_request' || !startsWith(github.event.pull_request.base.ref, 'feat-cmux-next') || contains(github.event.pull_request.labels.*.name, 'full-ci'))))) && !(github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'feat-cmux-next' && (github.event.action == 'labeled' && !contains(fromJSON('["full-ci","ready-to-land"]'), github.event.label.name) || github.event.action == 'unlabeled'))) && (github.event_name != 'pull_request' || needs.changes.result == 'success' || needs.changes.result == 'skipped') && (github.event_name != 'pull_request' || !startsWith(github.event.pull_request.base.ref, 'feat-cmux-next') || vars.SIMS_ON_PULL_REQUESTS == 'on') }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || 'cmux-linux' }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          ref: ${{ inputs.sha || '' }}

      # A green result of this job for the same input tree (affected_jobs.py result_key) is this
      # run's result: the tested steps are skipped and the job reports green with that run named.
      - name: Reuse a green result for the same input tree
        id: tree
        uses: ./.github/actions/tree-result
        with:
          mode: restore
          job: acpmux-sim
          key: ${{ needs.changes.outputs.acpmux_sim_tree }}

      - name: Set up pinned Rust
        if: ${{ steps.tree.outputs.hit != 'true' }}
        uses: ./.github/actions/setup-cmux-tui-rust

      - name: Cache cargo build
        id: rust-cache
        if: ${{ steps.tree.outputs.hit != 'true' }}
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          workspaces: cmux-tui -> target
          shared-key: cmux-tui-acpmux-sim-${{ hashFiles('cmux-tui/rust-toolchain.toml', 'cmux-tui/Cargo.lock', '.cargo/config.toml') }}
          save-if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/feat-cmux-next' }}
          # Save even when the tip's tests are red: a red tip saved nothing, so every pull request built cold.
          cache-on-failure: true
          # Key on the toolchain file and lockfiles only, not the runner's CARGO_*/RUST* env: those hold
          # HOME paths that differ per runner (/home/runner vs /home/runner2), so a pull request missed the
          # base save unless it drew the same runner layout. Cargo's fingerprints check every reused crate.
          add-rust-environment-hash-key: false

      # acpmux-sim built cold on every sampled run on 2026-11-26 (566-587 crates, 12-16 min): rust-cache's save is evicted
      # as acpmux-tests' was. acpmux-tests' R2 build is the same test profile and dependency graph; only acpmux itself
      # rebuilds for the sim feature. Read only, as the protocol IR job: this job saves nothing.
      - name: Key the cargo build in R2
        id: r2-cargo-key
        if: ${{ github.repository == 'manaflow-ai/cmux' && steps.tree.outputs.hit != 'true' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          inputs="$( { git ls-files -z -- 'cmux-tui/Cargo.lock' 'cmux-tui/**/Cargo.lock' 'cmux-tui/rust-toolchain.toml' '.cargo/config.toml' \
            | xargs -0 sha256sum; rustc -Vv; cargo -V; } | sha256sum | cut -c1-16)"
          workspace="$(printf '%s' "$GITHUB_WORKSPACE" | sha256sum | cut -c1-8)"
          prefix="cmux-tui-spec-acpmux-tests-cargo-v1-$workspace-"
          {
            echo "target-prefix=$prefix"
            echo "target-key=$prefix$inputs"
            echo "registry-prefix=cmux-tui-spec-cargo-registry-v1-"
            echo "registry-key=cmux-tui-spec-cargo-registry-v1-$inputs"
            echo "registry=${CARGO_HOME:-$HOME/.cargo}/registry"
          } >> "$GITHUB_OUTPUT"

      # Only when rust-cache found nothing: a hit there is the same build, nearer.
      - name: Restore the cargo build from R2
        id: r2-cargo-target
        if: ${{ steps.tree.outputs.hit != 'true' && steps.r2-cargo-key.outputs.target-key != '' && steps.rust-cache.outputs.cache-hit != 'true' }}
        timeout-minutes: 4
        continue-on-error: true
        uses: ./.github/actions/cache-restore
        env:
          CI_CACHE_R2_PUBLIC_URL: https://ci-cache-next.cmux.com
        with:
          backend: r2
          path: cmux-tui/target
          key: ${{ steps.r2-cargo-key.outputs.target-key }}
          restore-keys: ${{ steps.r2-cargo-key.outputs.target-prefix }}

      - name: Restore the cargo registry from R2
        id: r2-cargo-registry
        if: ${{ steps.tree.outputs.hit != 'true' && steps.r2-cargo-key.outputs.registry-key != '' && steps.rust-cache.outputs.cache-hit != 'true' }}
        timeout-minutes: 4
        continue-on-error: true
        uses: ./.github/actions/cache-restore
        env:
          CI_CACHE_R2_PUBLIC_URL: https://ci-cache-next.cmux.com
        with:
          backend: r2
          path: ${{ steps.r2-cargo-key.outputs.registry }}
          key: ${{ steps.r2-cargo-key.outputs.registry-key }}
          restore-keys: ${{ steps.r2-cargo-key.outputs.registry-prefix }}

      - name: cargo test -p acpmux --features sim --test sim
        if: ${{ steps.tree.outputs.hit != 'true' }}
        working-directory: cmux-tui
        env:
          # The same seeds on every change, so a red names the change and not the window; the
          # daily sweep explores new seeds and files what it finds.
          SIM_SEEDS: "256"
          SIM_SEED_BASE: "0"
        run: |
          set -o pipefail
          cargo test --locked -p acpmux --features sim --test sim -- --nocapture 2>&1 | tee "$RUNNER_TEMP/sim.log"
          grep -E '^sim: ' "$RUNNER_TEMP/sim.log" >> "$GITHUB_STEP_SUMMARY" || true

      # The clippy job builds without `--features sim`, so the simulation's code and the
      # daemon's sim-only seams were never linted. Lints are warnings (--cap-lints warn, as the
      # clippy job: lint never stops a merge); a compile error still fails.
      - name: cargo clippy -p acpmux --features sim --test sim
        if: ${{ steps.tree.outputs.hit != 'true' }}
        working-directory: cmux-tui
        run: cargo clippy --locked -p acpmux --features sim --test sim -- --cap-lints warn

      - name: Record this green result for its input tree
        if: ${{ success() && steps.tree.outputs.hit != 'true' }}
        uses: ./.github/actions/tree-result
        with:
          mode: save
          job: acpmux-sim
          key: ${{ needs.changes.outputs.acpmux_sim_tree }}

  # The carrier's deterministic simulation (cmux-remote tests/carrier_sim.rs): the real daemon and
  # client over a simulated carrier with seeded cuts, drops, slow links, relay swaps and daemon
  # restarts. A fixed window of seeds on every change that touches the carrier's crates; the sweep
  # (cmuxterm-hq cloud-chaos.yml, probe carrier-sim-no-lost-events) runs thousands of new seeds a day.
  carrier-sim:
    name: carrier simulation (seeds)
    needs: changes
    # By the crate graph (the changes job's graph step). A router that failed or was skipped never skips
    # the job (a skip passes a required check), and neither does a missing output.
    # After merge (CI 10x, 2026-11-21: 1.02% of pull request runner-minutes, 0.05% of heads it alone caught): every
    # post-merge batch runs it (the safety net runs every job); a pull request only with the full-ci label, and not
    # one into feat-cmux-next (the last conjunct): land puts full-ci on nearly every landing head, so it ran 137 times
    # on pull request heads in 2026-11-26 14-17Z (173 runner-min/h). Back on: repository variable SIMS_ON_PULL_REQUESTS=on.
    if: ${{ ((github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci') || (github.event.pull_request.draft == true && (vars.CI_DRAFT_CHEAP_TIER || '1') == '0') || (github.event.pull_request.draft != true && ((contains(github.event.pull_request.labels.*.name, 'ready-to-land') && vars.CI_LAND_FULL_PER_PR == '1') || github.event.pull_request.base.ref != 'feat-cmux-next' || github.event.pull_request.head.repo.full_name != github.repository || (vars.CI_LAND_TIER || '1') == '0'))) && (((inputs.only == '' || inputs.only == 'carrier-sim') && (!cancelled() && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')) && (needs.changes.result != 'success' || needs.changes.outputs.carrier_sim != 'false')))) && !(github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'feat-cmux-next' && (github.event.action == 'labeled' && !contains(fromJSON('["full-ci","ready-to-land"]'), github.event.label.name) || github.event.action == 'unlabeled'))) && (github.event_name != 'pull_request' || needs.changes.result == 'success' || needs.changes.result == 'skipped') && (github.event_name != 'pull_request' || !startsWith(github.event.pull_request.base.ref, 'feat-cmux-next') || vars.SIMS_ON_PULL_REQUESTS == 'on') }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || 'cmux-linux' }}
    timeout-minutes: 40
    env:
      GHOSTTY_ZIG_SOURCE: ghostty-next
      CMUX_GHOSTTY_SRC: ""
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          ref: ${{ inputs.sha || '' }}

      # A green result of this job for the same input tree (affected_jobs.py result_key) is this
      # run's result: the tested steps are skipped and the job reports green with that run named.
      - name: Reuse a green result for the same input tree
        id: tree
        uses: ./.github/actions/tree-result
        with:
          mode: restore
          job: carrier-sim
          key: ${{ needs.changes.outputs.carrier_sim_tree }}

      - name: Install Linux build dependencies
        if: ${{ steps.tree.outputs.hit != 'true' }}
        run: bash scripts/ci/apt-ensure.sh clang libclang-dev pkg-config

      # cmux-remote depends on ghostty-vt: ghostty-vt-sys builds libghostty-vt from the
      # ghostty-next gitlink with zig, as the clippy job does.
      - name: Init the ghostty-next submodule (libghostty-vt for ghostty-vt-sys)
        if: ${{ steps.tree.outputs.hit != 'true' }}
        run: bash scripts/ci/init-submodule.sh ghostty-next

      - name: Install zig
        if: ${{ steps.tree.outputs.hit != 'true' }}
        run: ./scripts/install-zig-ci.sh

      - name: Set up pinned Rust
        if: ${{ steps.tree.outputs.hit != 'true' }}
        uses: ./.github/actions/setup-cmux-tui-rust

      - name: Cache cargo build
        if: ${{ steps.tree.outputs.hit != 'true' }}
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          workspaces: cmux-tui -> target
          shared-key: cmux-tui-carrier-sim-${{ hashFiles('cmux-tui/rust-toolchain.toml', 'cmux-tui/Cargo.lock', '.cargo/config.toml') }}
          save-if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/feat-cmux-next' }}
          # Save even when the tip's tests are red: a red tip saved nothing, so every pull request built cold.
          cache-on-failure: true
          # Key on the toolchain file and lockfiles only, not the runner's CARGO_*/RUST* env: those hold
          # HOME paths that differ per runner (/home/runner vs /home/runner2), so a pull request missed the
          # base save unless it drew the same runner layout. Cargo's fingerprints check every reused crate.
          add-rust-environment-hash-key: false

      - name: cargo test -p cmux-remote --test carrier_sim
        if: ${{ steps.tree.outputs.hit != 'true' }}
        working-directory: cmux-tui
        env:
          # The same seeds on every change, so a red names the change and not the window.
          CARRIER_SIM_SEEDS: "256"
          CARRIER_SIM_SEED_BASE: "0"
        run: |
          set -o pipefail
          cargo test --locked -p cmux-remote --test carrier_sim -- --nocapture 2>&1 | tee "$RUNNER_TEMP/sim.log"
          grep -E '^sim: ' "$RUNNER_TEMP/sim.log" >> "$GITHUB_STEP_SUMMARY" || true

      - name: Record this green result for its input tree
        if: ${{ success() && steps.tree.outputs.hit != 'true' }}
        uses: ./.github/actions/tree-result
        with:
          mode: save
          job: carrier-sim
          key: ${{ needs.changes.outputs.carrier_sim_tree }}

  # PR CI never runs cmux-tui.yml (dispatch only), so #18706 landed unformatted
  # Rust and broke base `cargo fmt --check`. rustfmt alone on the packages the
  # change touches: no build and no dependency download.
  rustfmt:
    needs: changes
    # A router that failed or was skipped never skips the job (a skip passes a required check).
    # Tier A of the merged pull request replay (scripts/ci/affected-jobs.json pull_request_skip): a pull request
    # into feat-cmux-next skips it unless labeled full-ci; the post-merge batch runs it.
    if: ${{ (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci') || (github.event.pull_request.draft == true && (vars.CI_DRAFT_CHEAP_TIER || '1') == '0') || (github.event.pull_request.draft != true && ((contains(github.event.pull_request.labels.*.name, 'ready-to-land') && vars.CI_LAND_FULL_PER_PR == '1') || github.event.pull_request.base.ref != 'feat-cmux-next' || github.event.pull_request.head.repo.full_name != github.repository || (vars.CI_LAND_TIER || '1') == '0'))) && (((inputs.only == '' || inputs.only == 'rustfmt') && ((!cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.run == 'true')) && (github.event_name != 'pull_request' || !startsWith(github.event.pull_request.base.ref, 'feat-cmux-next') || contains(github.event.pull_request.labels.*.name, 'full-ci'))))) && !(github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'feat-cmux-next' && (github.event.action == 'labeled' && !contains(fromJSON('["full-ci","ready-to-land"]'), github.event.label.name) || github.event.action == 'unlabeled')) }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || 'cmux-linux' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          ref: ${{ inputs.sha || '' }}

      - name: Merge the head onto the live base
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GIT_AUTH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # An inline step, not a local action: a stale merge commit may predate both.
          if grep -qs merge-live-base scripts/ci/compile_preflight.py; then
            python3 -I scripts/ci/compile_preflight.py merge-live-base . "$BASE_REF" "$PR_NUMBER"
          else
            echo "this checkout predates scripts/ci/compile_preflight.py merge-live-base; keeping GitHub's merge commit"
          fi

      - name: Test the changed-package rustfmt check
        run: python3 .github/scripts/test_cmux_tui_fmt_changed.py

      - name: Set up pinned Rust
        uses: ./.github/actions/setup-cmux-tui-rust

      # Pull requests compare with the base their merge commit was made on
      # (its first parent; the event's base.sha can be older), pushes with the
      # commit before them; a dispatch (or a new branch) checks every package.
      - name: Fetch the comparison base
        id: base
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'push' && github.event.before || '' }}
        run: |
          if [[ "$EVENT_NAME" == pull_request ]]; then
            BASE_SHA=$(git cat-file -p HEAD | awk '/^parent /{print $2; exit}')
          fi
          if [[ -n "$BASE_SHA" && "$BASE_SHA" != 0000000000000000000000000000000000000000 ]]; then
            # A slow link once stalled this fetch and the fallback linted every crate,
            # turning old debt in untouched crates into this PR's red. Retry first.
            fetched=""
            for attempt in 1 2 3; do
              if timeout 240 git -c http.lowSpeedLimit=1 -c http.lowSpeedTime=60 fetch --no-tags --depth=1 origin "$BASE_SHA"; then fetched=1; break; fi
              sleep $((attempt * 5))
            done
            [[ -n "$fetched" ]] || echo "::warning::could not fetch $BASE_SHA; checking every package after 3 tries"
          fi
          echo "sha=$BASE_SHA" >> "$GITHUB_OUTPUT"

      # Formatting is a style guard: for pull requests into feat-cmux-next it warns
      # (Leo 2026-10-19); elsewhere it still fails.
      - name: cargo fmt --check on changed cmux-tui packages
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
          CMUX_NEXT_STYLE_GUARDS: ${{ env.CMUX_NEXT_STYLE_GUARDS_LEVEL }}
        run: |
          rc=0
          python3 .github/scripts/cmux-tui-fmt-changed.py --base "$BASE_SHA" || rc=$?
          if [[ "$rc" != 0 && "$CMUX_NEXT_STYLE_GUARDS" == warn ]]; then
            # The script already printed a ::warning file=<the file>,line= annotation for each unformatted file.
            exit 0
          fi
          exit "$rc"

  # The browser client is a wasm32 crate but keeps native compilation for its protocol tests.
  # Keep this check on the Linux path so a cmux-tui change cannot land with a wasm-only compile
  # failure hidden behind the native package checks.
  # By the crate graph (scripts/ci/affected-jobs.json remote-web-wasm: cmux-remote-web, its path dependencies, the
  # workspace inputs), not by this workflow's paths: 2026-11-27 00:30-01:30Z it ran on 49% of pull request heads,
  # 540 job-min in the hour, most of them changes that reach no input of the wasm build (Leo, ci-min-per-pr-14: "de
  # facto, im asking for 99% fewer minutes of ci time, period."). A green build for the same input tree is reused
  # (tree-result). A router that failed or was skipped never skips it, and neither does a missing output.
  remote-web-wasm:
    name: cmux remote web wasm
    needs: changes
    # Tier rule first (head_tier.py, as clippy and acpmux-tests): `changes` is skipped for a cheap or landing head, and a skipped
    # router read as `result != 'success'` ran this on every head (273 runs in 40 min, 11-27 04Z). The post-merge batch
    # (suite cmux-tui-spec) and the feat-cmux-next push run it. Routed by the crate graph (scripts/ci/affected-jobs.json): it builds cmux-remote-web and what that reaches, so a
    # change none of those inputs sees skips it; a failed router, a push and full-ci on a reaching change run it.
    if: ${{ (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci') || (github.event.pull_request.draft == true && (vars.CI_DRAFT_CHEAP_TIER || '1') == '0') || (github.event.pull_request.draft != true && ((contains(github.event.pull_request.labels.*.name, 'ready-to-land') && vars.CI_LAND_FULL_PER_PR == '1') || github.event.pull_request.base.ref != 'feat-cmux-next' || github.event.pull_request.head.repo.full_name != github.repository || (vars.CI_LAND_TIER || '1') == '0'))) && (inputs.only == '' || inputs.only == 'remote-web-wasm') && (!cancelled() && (needs.changes.result != 'success' || (needs.changes.outputs.run == 'true' && needs.changes.outputs.remote_web_wasm != 'false'))) }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || 'cmux-linux' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ inputs.sha || '' }}

      # A green result of this job for the same input tree (affected_jobs.py result_key) is this
      # run's result: the build is skipped and the job reports green with that run named.
      - name: Reuse a green result for the same input tree
        id: tree
        uses: ./.github/actions/tree-result
        with:
          mode: restore
          job: remote-web-wasm
          key: ${{ needs.changes.outputs.remote_web_wasm_tree }}

      - name: Install the wasm compiler dependencies
        if: ${{ steps.tree.outputs.hit != 'true' }}
        run: bash scripts/ci/apt-ensure.sh clang

      - name: Set up pinned Rust
        if: ${{ steps.tree.outputs.hit != 'true' }}
        uses: ./.github/actions/setup-cmux-tui-rust

      - name: Install wasm32 target
        if: ${{ steps.tree.outputs.hit != 'true' }}
        run: rustup target add wasm32-unknown-unknown

      - name: Build cmux-remote-web for wasm32
        if: ${{ steps.tree.outputs.hit != 'true' }}
        working-directory: cmux-tui
        run: cargo build --locked --target wasm32-unknown-unknown -p cmux-remote-web

      - name: Record this green result for its input tree
        if: ${{ success() && steps.tree.outputs.hit != 'true' }}
        uses: ./.github/actions/tree-result
        with:
          mode: save
          job: remote-web-wasm
          key: ${{ needs.changes.outputs.remote_web_wasm_tree }}

  # PR CI never runs cmux-tui.yml (dispatch only), whose workspace clippy is the only
  # `--all-targets` lint of cmux-tui, and the fast tier's cargo entries only run tests.
  # So #23163 and #23372 landed clippy reds in cmux-tui/crates/cmux-tui/tests/ and broke
  # base clippy for everyone. This lints, with --all-targets, each
  # cmux-tui workspace package the change touches and each member depending on one
  # (a lockfile or workspace manifest change counts for the members it reaches; the whole
  # workspace when another workspace table, the clippy config or toolchain pin changes,
  # or there is no base; a post-merge call passes its plan's base). Only compile
  # errors fail it: lints run under --cap-lints warn and become ::warning annotations and a
  # step-summary list, fixed forward (Leo, 2026-11-20: "WHY IS LINT EVEN STOPPING SHIT
  # INSTEAD OF JUST BEING OOPS"). The panic ratchet step below still fails on a new panic
  # site. A dispatch with `commit` replays a past head with this run's script.
  clippy:
    name: clippy (changed cmux-tui packages)
    needs: changes
    # A router that failed or was skipped never skips the job (a skip passes a required check).
    # Tier B of the merged pull request replay (scripts/ci/affected-jobs.json pull_request_skip): a pull request
    # into feat-cmux-next skips it unless labeled full-ci; the post-merge batch runs it, and its few misses are fixed forward.
    if: ${{ (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci') || (github.event.pull_request.draft == true && (vars.CI_DRAFT_CHEAP_TIER || '1') == '0') || (github.event.pull_request.draft != true && ((contains(github.event.pull_request.labels.*.name, 'ready-to-land') && vars.CI_LAND_FULL_PER_PR == '1') || github.event.pull_request.base.ref != 'feat-cmux-next' || github.event.pull_request.head.repo.full_name != github.repository || (vars.CI_LAND_TIER || '1') == '0'))) && (((inputs.only == '' || inputs.only == 'clippy') && ((!cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.run == 'true')) && (github.event_name != 'pull_request' || !startsWith(github.event.pull_request.base.ref, 'feat-cmux-next') || contains(github.event.pull_request.labels.*.name, 'full-ci'))))) && !(github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'feat-cmux-next' && (github.event.action == 'labeled' && !contains(fromJSON('["full-ci","ready-to-land"]'), github.event.label.name) || github.event.action == 'unlabeled')) }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || 'cmux-linux' }}
    timeout-minutes: 40
    # ghostty-vt-sys builds libghostty-vt from the ghostty-next gitlink with zig, as in
    # cmux-tui.yml (an empty CMUX_GHOSTTY_SRC overrides a runner-level one).
    # CMUX_GHOSTTY_VT_ZIG_CPU=baseline: libghostty-vt for any x86-64 CPU, so the warm target
    # below stays valid on every Blacksmith host model (scripts/blacksmith-testbox-source-mtimes.py).
    # A feat-cmux-next run saves its cargo build to R2 (cmux-ci-cache-next): only next-cache-writer holds the write
    # credentials, and its deployment branches are feat-cmux-next only (tests/test_ci_pull_request_caches_are_read_only.py).
    environment: ${{ github.ref == 'refs/heads/feat-cmux-next' && 'next-cache-writer' || '' }}
    env:
      GHOSTTY_ZIG_SOURCE: ghostty-next
      CMUX_GHOSTTY_SRC: ""
      CMUX_GHOSTTY_VT_ZIG_CPU: baseline
      CI_CACHE_R2_BUCKET: cmux-ci-cache-next
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          ref: ${{ inputs.sha || '' }}

      - name: Merge the head onto the live base
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GIT_AUTH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # An inline step, not a local action: a stale merge commit may predate both.
          if grep -qs merge-live-base scripts/ci/compile_preflight.py; then
            python3 -I scripts/ci/compile_preflight.py merge-live-base . "$BASE_REF" "$PR_NUMBER"
          else
            echo "this checkout predates scripts/ci/compile_preflight.py merge-live-base; keeping GitHub's merge commit"
          fi

      - name: Test the changed-package clippy check
        run: python3 .github/scripts/test_cmux_tui_clippy_changed.py

      # A replay checks the old tree with this run's script.
      - name: Keep this run's check scripts
        run: cp .github/scripts/cmux-tui-clippy-changed.py .github/scripts/cmux-tui-fmt-changed.py scripts/ci/apt-ensure.sh "$RUNNER_TEMP/"

      - name: Check out the replayed commit
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.commit != '' }}
        env:
          COMMIT: ${{ inputs.commit }}
        run: |
          if [[ ! "$COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::commit must be a lowercase 40-character SHA" >&2
            exit 1
          fi
          git fetch --no-tags --depth=1 origin "$COMMIT"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$COMMIT"

      # Pull requests compare with the base their merge commit was made on (its first
      # parent), pushes with the commit before them, a replay with its `base`; with none
      # (or a new branch) the whole workspace is linted.
      - name: Fetch the comparison base
        id: base
        env:
          EVENT_NAME: ${{ github.event_name }}
          # A post-merge call (its event is the batch's workflow_dispatch) passes its plan's base: without it every
          # call linted the whole workspace (225 members, 11.6 and 15.8 min in jobs 140465633373 and 140499897736).
          BASE_SHA: ${{ github.event_name == 'push' && github.event.before || github.event_name == 'workflow_dispatch' && inputs.base || '' }}
        run: |
          if [[ "$EVENT_NAME" == pull_request ]]; then
            BASE_SHA=$(git cat-file -p HEAD | awk '/^parent /{print $2; exit}')
          fi
          if [[ -n "$BASE_SHA" && ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::warning::base is not a full commit SHA; linting the whole workspace"
            BASE_SHA=""
          fi
          if [[ -n "$BASE_SHA" && "$BASE_SHA" != 0000000000000000000000000000000000000000 ]]; then
            # A slow link once stalled this fetch and the fallback linted every crate,
            # turning old debt in untouched crates into this PR's red. Retry first.
            fetched=""
            for attempt in 1 2 3; do
              if timeout 240 git -c http.lowSpeedLimit=1 -c http.lowSpeedTime=60 fetch --no-tags --depth=1 origin "$BASE_SHA"; then fetched=1; break; fi
              sleep $((attempt * 5))
            done
            [[ -n "$fetched" ]] || echo "::warning::could not fetch $BASE_SHA; linting the whole workspace after 3 tries"
          fi
          echo "sha=$BASE_SHA" >> "$GITHUB_OUTPUT"

      - name: Install Linux build dependencies
        # Persistent fleet images already carry these packages. Avoid network and
        # sudo work on that path; cold runners still install every missing package.
        # The kept copy: a replayed commit from before the helper has no scripts/ci/apt-ensure.sh.
        run: bash "$RUNNER_TEMP/apt-ensure.sh" clang libclang-dev pkg-config

      - name: Init the ghostty-next submodule (libghostty-vt for ghostty-vt-sys)
        run: bash scripts/ci/init-submodule.sh ghostty-next

      - name: Install zig
        run: ./scripts/install-zig-ci.sh

      - name: Set up pinned Rust
        uses: ./.github/actions/setup-cmux-tui-rust

      # Warm start (projected fleet checkouts; Leo, 2026-11-17: "what if we were able to adopt
      # that... for our own workflows? our own remote machines, our own ci?"): the last
      # feat-cmux-next clippy's whole target dir and cargo registry on a Blacksmith sticky disk,
      # as cmux-tui-build-package.yml's warm legs. rust-cache holds dependency builds only, and
      # the fresh checkout gives every source a new mtime, so cargo checked every workspace
      # crate the changed packages need again (cargo #6529). The disk is a block clone (mounted
      # in seconds), and scripts/ci/machine-channel-warm-target.sh gives each source whose
      # content equals the snapshot's its recorded mtime back, so only crates whose files
      # changed are checked again; a changed file keeps its fresh mtime, so correctness never
      # depends on the snapshot. Only feat-cmux-next pushes commit the disk; every other run
      # mounts a clone of it and never writes it back. A failed mount falls back to the
      # rust-cache restore below, as before. Keys are literal (tests/test_ci_testbox_broker_guard.py).
      - name: Mount the warm clippy target (feat-cmux-next push, commits)
        id: warm-next
        if: startsWith(runner.name, 'blacksmith') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/feat-cmux-next'
        continue-on-error: true
        uses: useblacksmith/stickydisk@3f6be1451e3cad893b778bc93495c80452a5da26 # v1.7.2
        with:
          key: cmux-tui-clippy-warm-v1-next
          path: /home/runner/cmux-tui-clippy-warm
          commit: on-change

      - name: Mount the warm clippy target (other runs, read-only)
        id: warm-read
        if: startsWith(runner.name, 'blacksmith') && !((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/feat-cmux-next')
        continue-on-error: true
        uses: useblacksmith/stickydisk@3f6be1451e3cad893b778bc93495c80452a5da26 # v1.7.2
        with:
          key: cmux-tui-clippy-warm-v1-next
          path: /home/runner/cmux-tui-clippy-warm
          commit: "false"

      - name: Link the warm clippy target
        id: warm
        if: steps.warm-next.outcome == 'success' || steps.warm-read.outcome == 'success'
        continue-on-error: true
        env:
          WARM_WRITES: ${{ steps.warm-next.outcome == 'success' }}
        # A run that never writes the disk links it only when a feat-cmux-next run has recorded a
        # snapshot there; an empty disk would be a cold build where rust-cache is warm.
        run: |
          set -euo pipefail
          disk=/home/runner/cmux-tui-clippy-warm
          if [[ "$WARM_WRITES" != true && ! -f "$disk/target/.machine-channel-warm-source" ]]; then
            echo "warm target: miss (no feat-cmux-next snapshot on the disk yet); rust-cache restore instead"
            exit 0
          fi
          start=$(date +%s)
          bash scripts/ci/machine-channel-warm-target.sh restore "$disk" x86_64-unknown-linux-gnu
          if [[ "$(readlink cmux-tui/target 2>/dev/null || true)" == /home/runner/cmux-tui-clippy-warm/target ]]; then
            echo "linked=true" >> "$GITHUB_OUTPUT"
          fi
          echo "warm target: restore took $(( $(date +%s) - start )) s"

      # Only a feat-cmux-next push saves the build cache; a pull request reads the base branch's.
      # Skipped when the warm target above is linked.
      - name: Cache cargo build
        id: rust-cache
        if: steps.warm.outputs.linked != 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          workspaces: cmux-tui -> target
          shared-key: cmux-tui-pr-clippy-${{ hashFiles('cmux-tui/rust-toolchain.toml', 'cmux-tui/Cargo.lock', '.cargo/config.toml') }}
          save-if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/feat-cmux-next' }}
          # Save even when the tip's tests are red: a red tip saved nothing, so every pull request built cold.
          cache-on-failure: true
          # Key on the toolchain file and lockfiles only, not the runner's CARGO_*/RUST* env: those hold
          # HOME paths that differ per runner (/home/runner vs /home/runner2), so a pull request missed the
          # base save unless it drew the same runner layout. Cargo's fingerprints check every reused crate.
          add-rust-environment-hash-key: false

      # The GitHub cache is over its 10 GB cap and evicts rust-cache's feat-cmux-next save before pull requests
      # read it (every sampled run on 2026-11-26 found none and built cold, 6-16 min): on a miss the base's build comes
      # from R2 (cmux-ci-cache-next), as cmux-next.yml's fast-tier-cargo.
      - name: Key the cargo build in R2
        id: r2-cargo-key
        if: ${{ github.repository == 'manaflow-ai/cmux' && steps.warm.outputs.linked != 'true' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          inputs="$( { git ls-files -z -- 'cmux-tui/Cargo.lock' 'cmux-tui/**/Cargo.lock' 'cmux-tui/rust-toolchain.toml' '.cargo/config.toml' \
            | xargs -0 sha256sum; rustc -Vv; cargo -V; } | sha256sum | cut -c1-16)"
          workspace="$(printf '%s' "$GITHUB_WORKSPACE" | sha256sum | cut -c1-8)"
          prefix="cmux-tui-spec-clippy-cargo-v1-$workspace-"
          {
            echo "target-prefix=$prefix"
            echo "target-key=$prefix$inputs"
            echo "registry-prefix=cmux-tui-spec-cargo-registry-v1-"
            echo "registry-key=cmux-tui-spec-cargo-registry-v1-$inputs"
            echo "registry=${CARGO_HOME:-$HOME/.cargo}/registry"
          } >> "$GITHUB_OUTPUT"

      # Only when rust-cache found nothing: a hit there is the same build, nearer.
      - name: Restore the cargo build from R2
        id: r2-cargo-target
        if: ${{ steps.r2-cargo-key.outputs.target-key != '' && steps.rust-cache.outputs.cache-hit != 'true' }}
        timeout-minutes: 4
        continue-on-error: true
        uses: ./.github/actions/cache-restore
        env:
          CI_CACHE_R2_PUBLIC_URL: https://ci-cache-next.cmux.com
        with:
          backend: r2
          path: cmux-tui/target
          key: ${{ steps.r2-cargo-key.outputs.target-key }}
          restore-keys: ${{ steps.r2-cargo-key.outputs.target-prefix }}

      - name: Restore the cargo registry from R2
        id: r2-cargo-registry
        if: ${{ steps.r2-cargo-key.outputs.registry-key != '' && steps.rust-cache.outputs.cache-hit != 'true' }}
        timeout-minutes: 4
        continue-on-error: true
        uses: ./.github/actions/cache-restore
        env:
          CI_CACHE_R2_PUBLIC_URL: https://ci-cache-next.cmux.com
        with:
          backend: r2
          path: ${{ steps.r2-cargo-key.outputs.registry }}
          key: ${{ steps.r2-cargo-key.outputs.registry-key }}
          restore-keys: ${{ steps.r2-cargo-key.outputs.registry-prefix }}

      # A red the PR autofix repairs (machine-applicable lints in this change's own files) passes as autofixed
      # once the autofix push is on (vars.CMUX_PR_AUTOFIX_PUSH, cmux-next-pr-autofix-push.yml on main): the fix
      # arrives as its own commit, linted strictly (the script's --autofixed-ok).
      - name: cargo clippy --all-targets on changed cmux-tui packages
        id: clippy
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
          AUTOFIXED_OK: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'feat-cmux-next' && github.event.pull_request.head.repo.full_name == github.repository && vars.CMUX_PR_AUTOFIX_PUSH == '1' && github.event.pull_request.head.sha || '' }}
        run: python3 "$RUNNER_TEMP/cmux-tui-clippy-changed.py" --repo "$GITHUB_WORKSPACE" --base "$BASE_SHA" ${AUTOFIXED_OK:+--autofixed-ok "$AUTOFIXED_OK"}

      # The host's clone/enrollment and root-peer IPC invariants must execute,
      # not only compile. Reuse this job's Rust setup and warm target directory.
      - name: Cloud host identity tests
        if: ${{ !cancelled() }}
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          set -o pipefail
          if [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] \
            && changed=$(git diff --no-renames --name-only "$BASE_SHA" HEAD); then
            if ! python3 scripts/ci/cargo_test_verdict.py touches cmux-tui/crates/cmux-host <<<"$changed"; then
              echo "No Cloud host test input changed; skipping identity tests." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi
          cd cmux-tui
          log="$RUNNER_TEMP/cmux-host-identity-tests.log"
          cargo test --locked -p cmux-host --lib identity 2>&1 | tee "$log"
          if ! grep -qE 'test result: ok\. [1-9][0-9]* passed' "$log"; then
            echo "::error title=Cloud host identity tests::identity selected no test"
            exit 1
          fi

      # The panic ratchet (plans/cmux-next/rust-panic-free.md) on the same packages:
      # their production targets with the ratchet's lints, judged against the baseline
      # at HEAD. Only cmux-tui.yml's dispatch run checked it before, so #27935 landed two
      # acpmux indexing_slicing hits and turned base lint red.
      # PRs compare base hits; pushes keep enforcing the strict baseline.
      - name: Rust panic ratchet on changed cmux-tui packages
        if: ${{ !cancelled() }}
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: python3 "$RUNNER_TEMP/cmux-tui-clippy-changed.py" --repo "$GITHUB_WORKSPACE" --base "$BASE_SHA" --panic-ratchet "$RUNNER_TEMP/panic-clippy.jsonl" ${{ github.event_name == 'pull_request' && '--compare-base' || '' }}

      - name: Upload panic ratchet clippy JSON
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: panic-clippy-pr-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/panic-clippy.jsonl
          if-no-files-found: ignore
          retention-days: 3

      # feat-cmux-next's build for the R2 restore above, red or green (as rust-cache's cache-on-failure): dependencies
      # only, as rust-cache keeps (scripts/ci/cargo_target_strip.py; cmux-next.yml's fast-tier-cargo does the same).
      - name: Strip the workspace's own output before the R2 save
        id: r2-cargo-strip
        if: ${{ !cancelled() && (steps.clippy.outcome == 'success' || steps.clippy.outcome == 'failure') && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.commit == '' && inputs.only == '')) && github.ref == 'refs/heads/feat-cmux-next' && steps.r2-cargo-key.outputs.target-key != '' && steps.r2-cargo-target.outputs.cache-hit != 'true' }}
        continue-on-error: true
        env:
          REGISTRY: ${{ steps.r2-cargo-key.outputs.registry }}
        run: |
          set -euo pipefail
          # --cargo-metadata, not every target name as --workspace-crates: tests/http.rs and tests/digest.rs
          # are named like the third-party http and digest, so that deleted them and a restore rebuilt 27 crates.
          cargo metadata --no-deps --format-version 1 --manifest-path cmux-tui/Cargo.toml > "$RUNNER_TEMP/cargo-metadata.json"
          python3 -I scripts/ci/cargo_target_strip.py cmux-tui/target --cargo-metadata "$RUNNER_TEMP/cargo-metadata.json"
          rm -rf "$REGISTRY/src"
          du -sh cmux-tui/target "$REGISTRY" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Save the cargo build to R2
        if: ${{ !cancelled() && steps.r2-cargo-strip.outcome == 'success' }}
        timeout-minutes: 6
        continue-on-error: true
        uses: ./.github/actions/cache-save
        env:
          CI_CACHE_R2_PUBLIC_URL: https://ci-cache-next.cmux.com
          AWS_ACCESS_KEY_ID: ${{ secrets.CI_CACHE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CI_CACHE_R2_SECRET_ACCESS_KEY }}
          CI_CACHE_R2_ENDPOINT: ${{ format('https://{0}.r2.cloudflarestorage.com', secrets.CI_CACHE_R2_ACCOUNT_ID) }}
        with:
          backend: r2
          path: cmux-tui/target
          key: ${{ steps.r2-cargo-key.outputs.target-key }}

      - name: Save the cargo registry to R2
        if: ${{ !cancelled() && steps.r2-cargo-strip.outcome == 'success' && steps.r2-cargo-registry.outputs.cache-hit != 'true' }}
        timeout-minutes: 6
        continue-on-error: true
        uses: ./.github/actions/cache-save
        env:
          CI_CACHE_R2_PUBLIC_URL: https://ci-cache-next.cmux.com
          AWS_ACCESS_KEY_ID: ${{ secrets.CI_CACHE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CI_CACHE_R2_SECRET_ACCESS_KEY }}
          CI_CACHE_R2_ENDPOINT: ${{ format('https://{0}.r2.cloudflarestorage.com', secrets.CI_CACHE_R2_ACCOUNT_ID) }}
        with:
          backend: r2
          path: ${{ steps.r2-cargo-key.outputs.registry }}
          key: ${{ steps.r2-cargo-key.outputs.registry-key }}

      # Before the sticky disk's post step commits it: bound it, then record the source
      # mtimes and the commit next to the artifacts, so the next run restores them.
      - name: Record the warm clippy target
        if: ${{ !cancelled() && steps.warm-next.outcome == 'success' && steps.warm.outputs.linked == 'true' }}
        continue-on-error: true
        run: bash scripts/ci/machine-channel-warm-target.sh record /home/runner/cmux-tui-clippy-warm x86_64-unknown-linux-gnu
