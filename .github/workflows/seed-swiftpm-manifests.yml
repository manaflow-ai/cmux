name: Seed SwiftPM manifests

# Seeds SwiftPM's evaluated-manifest cache (scripts/ci/swiftpm-manifest-cache.sh)
# for the macOS 15 pool. Compile admission restores it read-only;
# seed-derived-data.yml already seeds the macOS 26 pool on every main push that
# changes the build. The cache key names the Xcode, and the pull
# request pool picker sends some jobs to blacksmith-6vcpu-macos-15 with
# CMUX_CI_XCODE_APP_MACOS_15, so without this those jobs always miss: 40-121 s
# resolves against 12-24 s on the seeded pool (#14257).
#
# A schedule rather than every main push: that pool has the longest queue, and
# nothing waits on this. Entries are keyed on manifest contents, so a seed a few
# hours old still serves every manifest that has not changed since; readers fall
# back to it by prefix. An exact hit ends the job after the restore.

on:
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CI_CACHE_R2_PUBLIC_URL: ${{ vars.CI_CACHE_R2_PUBLIC_URL || 'https://ci-cache.cmux.com' }}

concurrency:
  group: seed-swiftpm-manifests
  cancel-in-progress: false

jobs:
  seed:
    if: github.repository_owner == 'manaflow-ai' && github.ref == 'refs/heads/main'
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'macos-15' || 'blacksmith-6vcpu-macos-15' }}
    environment: ${{ github.ref == 'refs/heads/main' && 'ci-cache-writer' || '' }}
    timeout-minutes: 20
    env:
      CMUX_CI_XCODE_APP: ${{ vars.CMUX_CI_XCODE_APP_MACOS_15 }}
      CMUX_CI_REQUIRED_MACOS_SDK_MAJOR: "26"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Select Xcode
        run: ./scripts/select-ci-xcode.sh

      - name: Compute SwiftPM manifest cache key
        id: swiftpm-manifest-key
        run: scripts/ci/swiftpm-manifest-cache.sh key >> "$GITHUB_OUTPUT"

      - name: Restore SwiftPM manifest cache
        id: swiftpm-manifest-restore
        continue-on-error: true
        uses: ./.github/actions/cache-restore
        with:
          backend: ${{ vars.CI_CACHE_BACKEND || 'r2' }}
          path: ${{ runner.temp }}/swiftpm-manifests
          key: ${{ steps.swiftpm-manifest-key.outputs.key }}

      # Resolve needs the local bonsplit package and the GhosttyKit binary
      # target; the ghostty checkout itself only names the framework to fetch.
      - name: Prepare package inputs
        if: steps.swiftpm-manifest-restore.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          git submodule update --init --depth 1 vendor/bonsplit
          GHOSTTY_SHA="$(git ls-tree HEAD ghostty | awk '{print $3}')" ./scripts/download-prebuilt-ghosttykit.sh

      - name: Restore Swift packages
        if: steps.swiftpm-manifest-restore.outputs.cache-hit != 'true'
        uses: ./.github/actions/cache-restore
        with:
          backend: ${{ vars.CI_CACHE_BACKEND || 'r2' }}
          path: .ci-source-packages
          key: spm-${{ hashFiles('cmux.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'scripts/ci/swiftpm-cache-layout') }}
          restore-keys: spm-

      - name: Sanitize Swift package cache
        if: steps.swiftpm-manifest-restore.outputs.cache-hit != 'true'
        run: python3 scripts/ci/sanitize-xcode-source-packages-cache.py .ci-source-packages

      # The resolve seed-derived-data.yml runs, at the canonical root compile
      # admission uses: a manifest's entry names its absolute path. Starts
      # empty so the saved cache holds only this revision's manifests.
      - name: Evaluate manifests at the reader path
        if: steps.swiftpm-manifest-restore.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          scripts/ci/swiftpm-manifest-cache.sh clear
          root="${CMUX_CI_CANONICAL_ROOT:-/private/tmp/cmux-ci}"
          scripts/ci/compile-app-host-test-product.sh canonical-resolve \
            "$root/derived-data-compile-admission" "$PWD/.ci-source-packages"
          scripts/ci/swiftpm-manifest-cache.sh stage "$RUNNER_TEMP/swiftpm-manifests"

      - name: Save SwiftPM manifest cache
        if: steps.swiftpm-manifest-restore.outputs.cache-hit != 'true'
        uses: ./.github/actions/cache-save
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CI_CACHE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CI_CACHE_R2_SECRET_ACCESS_KEY }}
          CI_CACHE_R2_ENDPOINT: ${{ format('https://{0}.r2.cloudflarestorage.com', secrets.CI_CACHE_R2_ACCOUNT_ID) }}
          CI_CACHE_R2_BUCKET: ${{ vars.CI_CACHE_R2_BUCKET }}
        with:
          backend: ${{ vars.CI_CACHE_BACKEND || 'r2' }}
          path: ${{ runner.temp }}/swiftpm-manifests
          key: ${{ steps.swiftpm-manifest-key.outputs.key }}
