name: App Store shelf cargo seed

# Saves the compiled dependencies of the App Store shelf check's cargo build (cmux-tui's `it` test binary, built
# with scripts/ci/app-store-shelf-check.sh's flags) to R2 for every shelf job to restore:
# cmux-next-guards.yml app-store-shelf-pr on pull requests and app-store-shelf.yml shelf on pushes. Both key with
# scripts/ci/app-store-shelf-cargo-key.sh, as this does.
#
# Why: every shelf run that reached its inputs compiled 635 crates cold with no cargo cache: 5 to 12 min of a 5 to 13
# min job, about 50 of the 257 shelf jobs an hour (2026-11-27). Leo: "de facto, im asking for 99% fewer minutes of
# ci time, period."
#
# Cost: one build a cargo key change (the lockfiles, the toolchain, the check's flags). A push whose key already has
# an entry stops after the key step. The R2 write credentials live in next-cache-writer, which admits only
# feat-cmux-next; pull requests read the public URL and never write (tests/test_ci_pull_request_caches_are_read_only.py).

on:
  push:
    branches: [feat-cmux-next]
    paths:
      - "cmux-tui/Cargo.lock"
      - "cmux-tui/**/Cargo.lock"
      - "cmux-tui/rust-toolchain.toml"
      - "scripts/ci/app-store-shelf-check.sh"
      - "scripts/ci/app-store-shelf-cargo-key.sh"
      - ".github/workflows/app-store-shelf-cargo-seed.yml"
  workflow_dispatch:

permissions: {}

# One seed at a time; a newer push only replaces the waiting one, never one mid-save.
concurrency:
  group: app-store-shelf-cargo-seed
  cancel-in-progress: false

env:
  BASH_ENV: '$({ w="${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh"; t="${RUNNER_TEMP:-/nonexistent}/api-call-log-src"; if [ -f "$w" ]; then echo "$w"; elif [ -n "${RUNNER_TEMP:-}" ]; then if [ ! -f "$t/env.sh" ] && [ ! -e "$t.tried" ] && { [ "${RUNNER_OS:-}" = Linux ] || [ "${RUNNER_OS:-}" = macOS ]; } && [ "$(date -u +%Y%m%d%H)" -lt 2026112300 ]; then : > "$t.tried"; mkdir -p "$t.part" && for x in env.sh gh sitecustomize.py isolated.py; do curl -fsSL --max-time 5 -o "$t.part/$x" "https://raw.githubusercontent.com/manaflow-ai/cmux/27647ffd3ae838c63be28ca3e5883dcd68c34518/scripts/ci/api_call_log/$x" || break; done; [ -s "$t.part/isolated.py" ] && mv "$t.part" "$t"; fi; if [ -f "$t/env.sh" ]; then echo "$t/env.sh"; else echo unset BASH_ENV > "$t.off.sh" && echo "$t.off.sh"; fi; fi; } 2>/dev/null)'

jobs:
  seed:
    name: Save the App Store shelf cargo build
    if: ${{ github.repository == 'manaflow-ai/cmux' && github.ref == 'refs/heads/feat-cmux-next' }}
    # The shelf jobs' runner, so the workspace path the key hashes matches theirs.
    runs-on: cmux-linux
    environment: ${{ github.ref == 'refs/heads/feat-cmux-next' && 'next-cache-writer' || '' }}
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      CI_CACHE_R2_BUCKET: cmux-ci-cache-next
      GHOSTTY_ZIG_SOURCE: ghostty-next
      CMUX_GHOSTTY_SRC: ""
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          submodules: false

      - name: Set up pinned cmux-tui Rust
        uses: ./.github/actions/setup-cmux-tui-rust

      - name: Key the cargo build in R2
        id: r2-cargo-key
        run: bash scripts/ci/app-store-shelf-cargo-key.sh --seed >> "$GITHUB_OUTPUT"

      # An exact hit means this key is already seeded: the rest is skipped.
      - name: Restore the cargo build from R2
        id: r2-cargo-target
        timeout-minutes: 4
        continue-on-error: true
        uses: ./.github/actions/cache-restore
        env:
          CI_CACHE_R2_PUBLIC_URL: https://ci-cache-next.cmux.com
        with:
          backend: r2
          path: cmux-tui/target
          key: ${{ steps.r2-cargo-key.outputs.target-key }}
          restore-keys: ${{ steps.r2-cargo-key.outputs.target-prefix }}

      - name: Restore the cargo registry from R2
        id: r2-cargo-registry
        if: ${{ steps.r2-cargo-target.outputs.cache-hit != 'true' }}
        timeout-minutes: 4
        continue-on-error: true
        uses: ./.github/actions/cache-restore
        env:
          CI_CACHE_R2_PUBLIC_URL: https://ci-cache-next.cmux.com
        with:
          backend: r2
          path: ${{ steps.r2-cargo-key.outputs.registry }}
          key: ${{ steps.r2-cargo-key.outputs.registry-key }}
          restore-keys: ${{ steps.r2-cargo-key.outputs.registry-prefix }}

      - name: Install Linux build dependencies
        if: ${{ steps.r2-cargo-target.outputs.cache-hit != 'true' }}
        run: |
          # Skip apt when the runner image already has these (tests/test_ci_apt_skips_baked_packages.py).
          if dpkg -s clang libclang-dev pkg-config >/dev/null 2>&1; then
            echo "clang libclang-dev pkg-config: already installed"
          else
            bash scripts/ci/apt-retry.sh -y clang libclang-dev pkg-config
          fi

      - name: Init the ghostty-next submodule (libghostty-vt for cmux-tui-core)
        if: ${{ steps.r2-cargo-target.outputs.cache-hit != 'true' }}
        run: bash scripts/ci/init-submodule.sh ghostty-next

      - name: Install zig
        if: ${{ steps.r2-cargo-target.outputs.cache-hit != 'true' }}
        run: ./scripts/install-zig-ci.sh

      # The check's exact build (app-store-shelf-check.sh's command and flags), without running the tests.
      - name: Build the shelf check's test binary
        id: build
        if: ${{ steps.r2-cargo-target.outputs.cache-hit != 'true' }}
        working-directory: cmux-tui
        run: |
          unset CARGO_TARGET_DIR
          export CARGO_PROFILE_DEV_DEBUG=0 CARGO_PROFILE_TEST_DEBUG=0 CARGO_INCREMENTAL=0
          cargo test --locked -p cmux-tui --test it --no-run

      # Dependencies only, as cloud-journey-pr.yml's seed saves them (scripts/ci/cargo_target_strip.py).
      - name: Strip the workspace's own output before the R2 save
        id: r2-cargo-strip
        if: ${{ success() && steps.build.outcome == 'success' }}
        env:
          REGISTRY: ${{ steps.r2-cargo-key.outputs.registry }}
        run: |
          set -euo pipefail
          cargo metadata --no-deps --format-version 1 --manifest-path cmux-tui/Cargo.toml > "$RUNNER_TEMP/cargo-metadata.json"
          python3 -I scripts/ci/cargo_target_strip.py cmux-tui/target --cargo-metadata "$RUNNER_TEMP/cargo-metadata.json"
          # Extracted sources come back from the .crate files in registry/cache.
          rm -rf "$REGISTRY/src"
          du -sh cmux-tui/target "$REGISTRY" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Save the cargo build to R2
        if: ${{ success() && steps.r2-cargo-strip.outcome == 'success' }}
        timeout-minutes: 6
        uses: ./.github/actions/cache-save
        env:
          CI_CACHE_R2_PUBLIC_URL: https://ci-cache-next.cmux.com
          AWS_ACCESS_KEY_ID: ${{ secrets.CI_CACHE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CI_CACHE_R2_SECRET_ACCESS_KEY }}
          CI_CACHE_R2_ENDPOINT: ${{ format('https://{0}.r2.cloudflarestorage.com', secrets.CI_CACHE_R2_ACCOUNT_ID) }}
        with:
          backend: r2
          path: cmux-tui/target
          key: ${{ steps.r2-cargo-key.outputs.target-key }}

      - name: Save the cargo registry to R2
        if: ${{ success() && steps.r2-cargo-strip.outcome == 'success' && steps.r2-cargo-registry.outputs.cache-hit != 'true' }}
        timeout-minutes: 6
        uses: ./.github/actions/cache-save
        env:
          CI_CACHE_R2_PUBLIC_URL: https://ci-cache-next.cmux.com
          AWS_ACCESS_KEY_ID: ${{ secrets.CI_CACHE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CI_CACHE_R2_SECRET_ACCESS_KEY }}
          CI_CACHE_R2_ENDPOINT: ${{ format('https://{0}.r2.cloudflarestorage.com', secrets.CI_CACHE_R2_ACCOUNT_ID) }}
        with:
          backend: r2
          path: ${{ steps.r2-cargo-key.outputs.registry }}
          key: ${{ steps.r2-cargo-key.outputs.registry-key }}
