name: Testbox broker guard

# The main CI suite is dispatch-only right now, so the trust-boundary guard for
# the Blacksmith Testbox lane gets its own always-on workflow. It must run on
# every pull request, with no path filter: a path filter is exactly the thing a
# change that moves the guard could slip past.
on:
  pull_request:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: testbox-broker-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: Testbox broker trust boundary
    runs-on: ${{ vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Prepare guard Python
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/testbox-guard-venv"
          "$RUNNER_TEMP/testbox-guard-venv/bin/python" -m pip install \
            --disable-pip-version-check \
            --no-input \
            PyYAML==6.0.3
          echo "TESTBOX_GUARD_PYTHON=$RUNNER_TEMP/testbox-guard-venv/bin/python" >> "$GITHUB_ENV"

      - name: Validate Blacksmith Testbox broker trust boundary
        run: |
          "$TESTBOX_GUARD_PYTHON" tests/test_ci_testbox_broker_guard.py

      - name: Validate receipt-bound cleanup ownership check
        run: ./tests/test_testbox_cleanup_receipt_ref.sh

      - name: Lint the Testbox lane helpers
        run: >-
          shellcheck
          scripts/blacksmith-bounded-command.sh
          scripts/blacksmith-cmux-tui-testbox-stage.sh
          scripts/blacksmith-testbox-cleanup.sh
          scripts/blacksmith-testbox-keepalive.sh
          scripts/ci/install-actionlint.sh
          tests/test_ci_actionlint_download.sh

      - name: Test the actionlint downloader without a network outage
        run: ./tests/test_ci_actionlint_download.sh

      - name: Check that every workflow is linted
        run: python3 tests/test_ci_actionlint_covers_every_workflow.py

      - name: Check that push and pull_request path filters agree
        run: |
          "$TESTBOX_GUARD_PYTHON" tests/test_ci_workflow_path_filter_parity.py

      - name: Lint every workflow
        env:
          ACTIONLINT_VERSION: "1.7.7"
          ACTIONLINT_SHA256: "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757"
          ACTIONLINT_ASSET_ID: "221573254"
          # actionlint hands each `run:` body to shellcheck. info and style
          # findings are advisory here -- SC2086 on a variable that cannot
          # word-split, SC2035 on a deliberate glob -- and 18 of them exist
          # across the tree today. Warnings and errors gate; they are the
          # levels at which shellcheck is describing a way the script can
          # actually behave differently than it reads.
          SHELLCHECK_OPTS: "-S warning"
        run: |
          set -euo pipefail
          ./scripts/ci/install-actionlint.sh
          # No file arguments: actionlint discovers every workflow in the
          # repository, so a workflow added tomorrow is linted tomorrow
          # without anyone extending a list. Suppressions live in
          # .github/actionlint.yaml, where they are reviewable in one place.
          "$RUNNER_TEMP/actionlint"
