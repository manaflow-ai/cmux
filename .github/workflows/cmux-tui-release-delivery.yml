name: cmux-tui registry delivery

on:
  workflow_dispatch:
  workflow_run:
    workflows: [cmux-tui release binaries]
    types: [completed]
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

env:
  # Temporary REST budget attribution: one gh-call line per GitHub API call (scripts/ci/api_call_log/env.sh, fetched at a fixed commit when the checkout has no copy).
  BASH_ENV: '$({ w="${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh"; t="${RUNNER_TEMP:-/nonexistent}/api-call-log-src"; if [ -f "$w" ]; then echo "$w"; elif [ -n "${RUNNER_TEMP:-}" ]; then if [ ! -f "$t/env.sh" ] && [ ! -e "$t.tried" ] && { [ "${RUNNER_OS:-}" = Linux ] || [ "${RUNNER_OS:-}" = macOS ]; } && [ "$(date -u +%Y%m%d%H)" -lt 2026112300 ]; then : > "$t.tried"; mkdir -p "$t.part" && for x in env.sh gh sitecustomize.py isolated.py; do curl -fsSL --max-time 5 -o "$t.part/$x" "https://raw.githubusercontent.com/manaflow-ai/cmux/27647ffd3ae838c63be28ca3e5883dcd68c34518/scripts/ci/api_call_log/$x" || break; done; [ -s "$t.part/isolated.py" ] && mv "$t.part" "$t"; fi; if [ -f "$t/env.sh" ]; then echo "$t/env.sh"; else echo unset BASH_ENV > "$t.off.sh" && echo "$t.off.sh"; fi; fi; } 2>/dev/null)'
  # The file that must carry the display name in the trigger above. Renaming a
  # workflow silently stops every `workflow_run` consumer of it, so
  # tests/test_ci_workflow_run_sources.py derives the expected name from this
  # path and fails the pull request that renames it.
  SOURCE_WORKFLOW_PATHS: .github/workflows/cmux-tui-release.yml

concurrency:
  group: cmux-tui-registry-delivery
  cancel-in-progress: false

jobs:
  delivery:
    name: verify registry delivery
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && (vars.CI_FORK_LINUX_RUNNER || 'ubuntu-24.04') || vars.CI_OVERFLOW_LINUX || 'cmux-linux' }}
    timeout-minutes: 5
    steps:
      # Always use the trusted default branch, never workflow_run's source.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1
      - name: Check newest stable TUI release on PyPI and npm
        env:
          GH_TOKEN: ${{ github.token }}
        # The post-build check may still be inside the two-hour delivery grace
        # period. The scheduled check catches forgotten approvals after it.
        run: python3 cmux-tui/scripts/check_release_delivery.py
