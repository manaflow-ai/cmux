name: cmux-tui registry delivery

on:
  workflow_dispatch:
  workflow_run:
    workflows: [cmux-tui release binaries]
    types: [completed]
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

env:
  # The file that must carry the display name in the trigger above. Renaming a
  # workflow silently stops every `workflow_run` consumer of it, so
  # tests/test_ci_workflow_run_sources.py derives the expected name from this
  # path and fails the pull request that renames it.
  SOURCE_WORKFLOW_PATHS: .github/workflows/cmux-tui-release.yml

concurrency:
  group: cmux-tui-registry-delivery
  cancel-in-progress: false

jobs:
  delivery:
    name: verify registry delivery
    # The cmux-bot mint below holds an App key: LINUX_RUNNER moves this job only among Blacksmith sizes.
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || contains(fromJSON('["blacksmith-4vcpu-ubuntu-2404","blacksmith-8vcpu-ubuntu-2404","blacksmith-16vcpu-ubuntu-2404","blacksmith-32vcpu-ubuntu-2404"]'), vars.LINUX_RUNNER) && vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 5
    steps:
      # Always use the trusted default branch, never workflow_run's source.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1
      # This job's reads spend the cmux-bot App's own budget, not the repository's GITHUB_TOKEN pool
      # (1,000 requests an hour shared by every workflow; run 43989417033 failed on "API rate limit
      # exceeded for installation"). github.token stays the fallback: for a failed mint, a
      # refused read, and every write (hq docs/compendium/ci-quotas.md, cmux#35264).
      - name: Mint the cmux-bot token for this job's reads
        id: read-token
        if: vars.CMUX_BOT_APP_ID != ''
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.CMUX_BOT_APP_ID }}
          private-key: ${{ secrets.CMUX_BOT_APP_KEY }}
          permission-contents: read

      - name: Check newest stable TUI release on PyPI and npm
        env:
          GH_TOKEN: ${{ steps.read-token.outputs.token || github.token }}
          GH_FALLBACK_TOKEN: ${{ github.token }}
        # The post-build check may still be inside the two-hour delivery grace
        # period. The scheduled check catches forgotten approvals after it.
        run: python3 cmux-tui/scripts/check_release_delivery.py
