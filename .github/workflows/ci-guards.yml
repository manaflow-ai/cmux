  workflow-guard-history:
    if: ${{ inputs.linux_guard_history == 'true' }}
    # The lockfile policy compares the candidate with the exact base parent of
    # GitHub's synthetic PR/merge-group commit. Depth 2 contains HEAD and that
    # parent; the policy does not need the rest of repository history.
    runs-on: ${{ vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # PR/merge-group synthetic commits need only HEAD + first parent.
          # Manual dispatches have no synthetic parent, so retain full history
          # and origin/main for the policy's fallback merge-base comparison.
          fetch-depth: ${{ github.event_name == 'workflow_dispatch' && '0' || '2' }}
          persist-credentials: false

      - name: Bind package policy to synthetic merge base
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
        env:
          CHECKED_OUT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = "$CHECKED_OUT_SHA" ]
          base="$(git rev-parse HEAD^1)"
          git cat-file -e "$base^{commit}"
          echo "PACKAGE_RESOLVED_POLICY_BASE_REF=$base" >> "$GITHUB_ENV"
          echo "Package policy base: $base"

      - name: Set up Python 3.9
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.9"

      - name: Install workflow guard Python dependencies
        run: python3 -m pip install --disable-pip-version-check --no-input PyYAML==6.0.3 bashlex==0.18

      - name: Validate SwiftPM lockfile policy
        run: |
          python3 tests/test_package_resolved_policy_remote_inputs.py
          python3 tests/test_check_package_resolved_policy.py
          python3 scripts/check-package-resolved-policy.py

  workflow-guard-cli-scripts:
    if: ${{ inputs.linux_guard_cli == 'true' }}
    name: workflow-guard-cli-scripts / ${{ matrix.group }}
    strategy:
      fail-fast: false
      matrix:
        group: [tui-resolution, profiling]
    # The two slow CLI contracts are independent; run them beside each other
    # and let the reusable-workflow job aggregate their result.
    runs-on: ${{ vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python 3.9
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.9"

      - name: Install workflow guard Python dependencies
        run: python3 -m pip install --disable-pip-version-check --no-input PyYAML==6.0.3 bashlex==0.18

      - name: Validate cmux-tui client commit resolution
        if: ${{ matrix.group == 'tui-resolution' }}
        run: ./tests/test_ci_resolve_cmux_tui_client_commit.sh

      - name: Validate cmux profiling support scripts
        if: ${{ matrix.group == 'profiling' }}
        run: ./tests/test_start_cmux_profiling.sh

  workflow-guard-source-lints:
    if: ${{ inputs.linux_guard_source == 'true' }}
    name: workflow-guard-source-lints / ${{ matrix.group }}
    strategy:
      fail-fast: false
      matrix:
        group: [sidebar-layout, dispatch-ownership]
    # These source-policy scans are independent and each dominates wall time;
    # run them concurrently and aggregate through the reusable-workflow job.
    runs-on: ${{ vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python 3.9
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.9"

      - name: Install workflow guard Python dependencies
        run: python3 -m pip install --disable-pip-version-check --no-input PyYAML==6.0.3 bashlex==0.18

      - name: Validate source-lint guard structure
        if: ${{ matrix.group == 'sidebar-layout' }}
        run: python3 tests/test_ci_source_lint_guard_structure.py

      - name: Validate sidebar lazy-layout guard
        if: ${{ matrix.group == 'sidebar-layout' }}
        run: python3 tests/test_ci_sidebar_lazy_layout_guard.py

      - name: Initialize Bonsplit for deferred-work ownership guard
        if: ${{ matrix.group == 'dispatch-ownership' }}
        run: git submodule update --init --depth 1 vendor/bonsplit

      - name: Validate stored DispatchWorkItem ownership
        if: ${{ matrix.group == 'dispatch-ownership' }}
        run: |
          python3 tests/test_lint_stored_dispatch_work_items.py
          python3 scripts/lint-stored-dispatch-work-items.py

  guard-status:
    name: Guard status
    needs:
      - workflow-guard-tests
      - workflow-guard-history
      - workflow-guard-cli-scripts
      - workflow-guard-source-lints
    if: ${{ always() }}
    runs-on: ${{ vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 5
    steps:
      - name: Check routed guard jobs
        env:
          GUARD_INPUTS: ${{ toJSON(inputs) }}
          GUARD_NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          inputs = json.loads(os.environ["GUARD_INPUTS"])
          needs = json.loads(os.environ["GUARD_NEEDS"])
          route_jobs = {
              "linux_guard_tests": "workflow-guard-tests",
              "linux_guard_history": "workflow-guard-history",
              "linux_guard_cli": "workflow-guard-cli-scripts",
              "linux_guard_source": "workflow-guard-source-lints",
          }
          bad = {}
          for route, job in sorted(route_jobs.items()):
              value = inputs.get(route)
              result = needs[job]["result"]
              if value not in {"true", "false"}:
                  bad[route] = f"invalid route {route}={value!r}"
              elif value == "true":
                  if result != "success":
                      bad[job] = f"{result} (route {route}=true)"
              elif result not in {"success", "skipped"}:
                  bad[job] = result

          if bad:
              for name, result in bad.items():
                  print(f"{name}: {result}", file=sys.stderr)
              sys.exit(1)

          for route, job in sorted(route_jobs.items()):
              print(f"{route}={inputs.get(route)} {job}={needs[job]['result']}")
          PY
