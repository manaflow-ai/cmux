        group: [dispatch-ownership]
    # These source-policy scans are independent and each dominates wall time;
    # run them concurrently and aggregate through the reusable-workflow job.
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || 'cmux-linux' }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Python 3.9
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.9"

      - name: Install workflow guard Python dependencies
        run: python3 -m pip install --disable-pip-version-check --no-input PyYAML==6.0.3 bashlex==0.18

      - name: Validate source-lint guard structure
        if: ${{ matrix.group == 'dispatch-ownership' }}
        run: python3 tests/test_ci_source_lint_guard_structure.py

      - name: Validate stored DispatchWorkItem ownership
        if: ${{ matrix.group == 'dispatch-ownership' }}
        run: |
          python3 tests/test_lint_stored_dispatch_work_items.py
          python3 scripts/lint-stored-dispatch-work-items.py

  guard-status:
    name: Guard status
    needs:
      - workflow-guard-submodule-forward-only
      - workflow-guard-tests
      - workflow-guard-history
      - workflow-guard-cli-scripts
      - workflow-guard-source-lints
    # Preserve the guard verdict after a failure, but do not start a rollup
    # after GitHub has cancelled the run.
    if: ${{ always() && !cancelled() }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || 'cmux-linux' }}
    timeout-minutes: 5
    steps:
      - name: Check routed guard jobs
        env:
          GUARD_INPUTS: ${{ toJSON(inputs) }}
          GUARD_NEEDS: ${{ toJSON(needs) }}
          GUARD_EVENT: ${{ github.event_name }}
          GUARD_BASE_REF: ${{ github.base_ref }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          def exit_with_verdict(results, what, may_skip=()):
              """scripts/ci/needs_verdict.py PYTHON_RULE, copied verbatim (tests/test_needs_verdict.py)."""
              def word(r):
                  return (r or "").replace(":", " ").split(" ", 1)[0]
              bad = {n: r for n, r in results.items() if word(r) != "success" and not (r == "skipped" and n in may_skip)}
              if not bad:
                  return
              failed = {n: r for n, r in bad.items() if word(r) in ("failure", "invalid")}
              for n, r in bad.items():
                  print(f"{n}: {r or 'none'}", file=sys.stderr)
              if failed:
                  print(f"::error::summary red: {what}: " + "; ".join(f"{n}: {r}" for n, r in failed.items()))
                  sys.exit(1)
              named = ", ".join(f"{n} {r or 'none'}" for n, r in bad.items())
              print(f"::error::no verdict: {what}: {named}; nothing it summarizes was judged: re-run the run")
              sys.exit(3)


          inputs = json.loads(os.environ["GUARD_INPUTS"])
          needs = json.loads(os.environ["GUARD_NEEDS"])
          route_jobs = {
              "submodule_forward_only": "workflow-guard-submodule-forward-only",
              "linux_guard_tests": "workflow-guard-tests",
              "linux_guard_history": "workflow-guard-history",
              "linux_guard_cli": "workflow-guard-cli-scripts",
              "linux_guard_source": "workflow-guard-source-lints",
          }
          results, may_skip = {}, set()
          for route, job in sorted(route_jobs.items()):
              if route == "submodule_forward_only":
                  results[job] = needs[job]["result"]
                  # A feat-cmux-next pull request runs it as the ci/steps.toml step (pr-pipeline.yml): the job skips.
                  if os.environ.get("GUARD_EVENT") == "pull_request" and os.environ.get("GUARD_BASE_REF") == "feat-cmux-next":
                      may_skip.add(job)
                  continue
              value = inputs.get(route)
              result = needs[job]["result"]
              if value not in {"true", "false"}:
                  results[route] = f"invalid route {route}={value!r}"
              elif value == "true":
                  # Pull requests run the `ci` group in the first-class
                  # `CI fast guards` job in ci.yml. The reusable matrix
                  # excludes that group, so a route containing only `ci`
                  # legitimately has no matrix leg to report here. Every
                  # other requested group still needs a successful matrix
                  # aggregate; malformed or missing group metadata fails
                  # closed instead of silently accepting an empty route.
                  if route == "linux_guard_tests":
                      raw_groups = inputs.get("linux_guard_test_groups")
                      try:
                          groups = json.loads(raw_groups) if isinstance(raw_groups, str) else None
                      except (TypeError, ValueError):
                          groups = None
                      if not isinstance(groups, list) or not all(isinstance(group, str) for group in groups):
                          results[route] = f"invalid linux_guard_test_groups={raw_groups!r}"
                          continue
                      if groups and set(groups) == {"ci"}:
                          print("linux_guard_tests=authoritative CI fast guards job")
                          continue
                  results[job] = f"{result} (route {route}=true)"
              else:
                  results[job] = result
                  may_skip.add(job)

          exit_with_verdict(results, "Guard status", may_skip)

          for route, job in sorted(route_jobs.items()):
              print(f"{route}={inputs.get(route)} {job}={needs[job]['result']}")
          PY
