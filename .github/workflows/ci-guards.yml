name: CI guards

on:
  workflow_call:
    inputs:
      linux_guard_tests:
        required: true
        type: string
      linux_guard_test_groups:
        required: true
        type: string
      linux_guard_history:
        required: true
        type: string
      linux_guard_cli:
        required: true
        type: string
      linux_guard_source:
        required: true
        type: string

permissions:
  contents: read

jobs:
  workflow-guard-submodule-forward-only:
    name: workflow-guard-submodule-forward-only
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-4vcpu-ubuntu-2404' || vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout parent repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # The synthetic PR commit and its first parent are sufficient for
          # the merge-base comparison, and keep this guard shallow like the
          # neighboring history guard.
          fetch-depth: 2
          # The guard initializes only changed gitlinks after comparing them.
          submodules: false
          persist-credentials: false

      - name: Bind submodule guard to synthetic merge parent
        run: |
          set -euo pipefail
          base="$(git rev-parse HEAD^1)"
          git cat-file -e "$base^{commit}"
          echo "GITHUB_BASE_SHA=$base" >> "$GITHUB_ENV"
          echo "GITHUB_HEAD_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Validate submodule gitlinks move forward only
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/submodule_forward_only.py

      - name: Test submodule forward-only guard
        run: python3 tests/test_submodule_forward_only.py

  workflow-guard-tests:
    if: ${{ inputs.linux_guard_tests == 'true' }}
    name: workflow-guard-tests / ${{ matrix.group }}
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(inputs.linux_guard_test_groups) }}
        exclude:
          - group: ci
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-4vcpu-ubuntu-2404' || vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    # Its three sibling guard jobs are bounded at 15; 65 recent runs peaked at 0.8 min.
    timeout-minutes: 15
    # This job executes scripts from the pull request. It needs only read
    # access for checkout, never workflow, issue, or repository write access.
    # The always-on CI fast-guards job owns the `ci` group for pull requests;
    # this routed matrix keeps the other groups that observe the diff.
    permissions:
      contents: read
    # Every guard step is `!cancelled() && <its group>`: a red guard no longer
    # skips the rest of its group, so one run names every failing guard (on
    # cmux#22135 one release-notary failure hid 47 of the group's 65 guards).
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # toolchain_notices.py (the license compliance test) reads
      # ghostty-next/build.zig.zon and fails when it is missing; only
      # feat-cmux-next has that submodule.
      - name: Initialize ghostty-next for the toolchain notices
        if: ${{ !cancelled() && matrix.group == 'release-notary' }}
        run: |
          if git config -f .gitmodules --get submodule.ghostty-next.path >/dev/null; then
            git submodule update --init --depth 1 ghostty-next
          fi

      - name: Validate macOS runner guards
        if: ${{ !cancelled() && matrix.group == 'preflight' }}
        run: ./tests/test_ci_self_hosted_guard.sh

      - name: A red runner guard check cannot skip or excuse another
        if: ${{ !cancelled() && matrix.group == 'preflight' }}
        run: python3 tests/test_ci_guard_check_isolation.py

      - name: Validate workflow files stay under GitHub's size limit
        if: ${{ !cancelled() && matrix.group == 'preflight' }}
        run: python3 tests/test_workflow_file_size.py

      - name: Validate Swift incremental diagnostics tooling
        if: ${{ !cancelled() && matrix.group == 'preflight' }}
        run: python3 tests/test_swift_incremental_diagnostics.py

      - name: Validate build graph health tooling
        if: ${{ !cancelled() && matrix.group == 'preflight' }}
        run: python3 tests/test_build_graph_health.py

      - name: Validate Zig-free fleet step lockfiles
        if: ${{ !cancelled() && matrix.group == 'preflight' }}
        run: python3 tests/test_zig_free_step_lockfiles.py

      - name: Validate CMUX workload profile contract
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: python3 tests/test_ci_workload_profiles.py

      - name: Validate repository variable defaults
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: python3 tests/test_ci_repo_variable_defaults.py

      - name: Validate scripts keep full clones full
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: python3 tests/test_ci_no_shallow_dev_fetch.py

      # Build scripts add a Rust target only when it is missing (rustup target add
      # reaches static.rust-lang.org even for an installed target).
      - name: Validate scripts add only missing Rust targets
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: python3 tests/test_ci_rust_targets_installed_first.py

      - name: Test the Rust targets helper
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: bash tests/test_rust_targets_helper.sh

      # Fleet rules as a shrink-only ratchet: no fleet sudo keychain reads, no
      # new kill by process name or pattern, nothing depends on the personal
      # Linux workstation (tests/fleet-rule-allowlist.json).
      - name: Validate fleet rule lints
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: python3 tests/test_ci_fleet_rule_lints.py

      - name: Validate the local and fast guard runner
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: python3 tests/test_ci_run_guards.py

      - name: Validate the CI timing readout
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: python3 tests/test_ci_timing_readout.py

      - name: Validate the repository variable check
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: python3 tests/test_ci_check_repo_variables.py

      - name: Validate the cloud overflow switch
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: python3 tests/test_ci_cloud_overflow_switch.py

      - name: Validate guard failure attribution
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: python3 tests/test_ci_guard_attribution.py

      - name: Validate main-fix merge evidence
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: python3 tests/test_gh_merge_green.py

      - name: Validate the bug-fix proof-section warning
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: python3 tests/test_pr_proof_section.py

      - name: Validate the PR capture check
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: python3 tests/test_pr_capture_check.py

      - name: Validate the PR perf section check
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: python3 tests/test_pr_perf_section_check.py

      - name: Validate gh-merge-green --revert
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: python3 tests/test_gh_merge_green_revert.py

      - name: Validate base-red excusal for gh-merge-green
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: python3 tests/test_base_red_excuse.py

      - name: Validate merge freezes as issues
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: python3 tests/test_merge_freeze.py

      - name: Validate bounded GitHub list reads (no gh api paginate flag under scripts/)
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: python3 tests/test_gh_pages.py

      - name: Validate main compile attribution
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: python3 tests/test_main_compile_attribution.py

      - name: Validate generated cmux-next coordination index
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: python3 scripts/cmux-next/generate-coordination-index.py --check

      - name: Validate CI failure attribution
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: python3 tests/test_ci_classify_failures.py

      - name: Validate the workflow_run handlers' API budget
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: python3 tests/test_ci_workflow_run_api_budget.py

      - name: Require the R2 public URL wherever the R2 cache actions run
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: python3 tests/test_ci_r2_cache_public_url.py

      - name: Validate macOS jobs select a pinned Xcode
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: python3 tests/test_ci_macos_xcode_selection.py

      - name: Validate the CEF shim C++ tests run without a Mac
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: python3 tests/test_cmux_next_shim_cpp_linux.py

      - name: Validate Xcode pin audit
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: python3 tests/test_ci_xcode_pin_audit.py

      - name: Validate the bash 3.2 parse job runs without a Mac
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: python3 tests/test_bash32_linux_job.py

      - name: Validate the macOS keychain real-import runs only for keychain changes
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: python3 tests/test_signing_keychain_real_import_gate.py

      - name: Validate v0.64.25 rpath repair workflow contract
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: bash tests/test_repair_v06425_workflow.sh

      - name: Validate Xcode build metrics receipt
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: python3 tests/test_build_metrics.py

      - name: Validate fleet compiler-cache wiring
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: bash tests/test_ci_fleet_compilation_cache.sh

      - name: Validate feature flag linter scope
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: python3 -m unittest tests/test_lint_feature_flags_scope.py tests/test_lint_feature_flags_review_date.py

      - name: Validate feature flag review lead-time report
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: python3 tests/test_feature_flag_review_lead_time.py

      - name: Validate feature flag review drift issue
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: python3 tests/test_feature_flag_review_drift_issue.py

      - name: Validate canonical compile cache build root
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: python3 tests/test_ci_canonical_build_root.py

      - name: Validate seeded macOS checkout
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: python3 tests/test_ci_git_seed.py

      - name: Run canonical CMUX CI guard profile
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: |
          set -euo pipefail
          state_root="$RUNNER_TEMP/cmux-ci-guard-profile"
          result_path="$state_root/result.json"
          rm -rf "$state_root"
          if python3 scripts/ci/cmux_workload_profile.py run cmux.ci.guard \
            --generation 1 \
            --state-class cold \
            --state-root "$state_root" \
            --result "$result_path"; then
            status=0
          else
            status=$?
          fi
          [[ ! -f "$result_path" ]] || cat "$result_path"
          exit "$status"

      - name: Validate tagged reload works without the shared dev backend
        if: ${{ !cancelled() && matrix.group == 'preflight' }}
        run: ./tests/test_reload_local_backend_mode.sh

      - name: Validate per-run iOS E2E backend script contracts
        if: ${{ !cancelled() && matrix.group == 'preflight' }}
        run: python3 tests/test_e2e_backend_scripts.py

      - name: Validate release SDK build lane
        if: ${{ !cancelled() && matrix.group == 'preflight' }}
        run: ./tests/test_ci_release_sdk_lane.sh

      - name: Validate build-only reload keeps the tagged app bundle
        if: ${{ !cancelled() && matrix.group == 'preflight' }}
        run: ./tests/test_reload_build_only_keeps_tagged_app.sh

      - name: Validate reload refuses DEV tags a shipped build owns
        if: ${{ !cancelled() && matrix.group == 'preflight' }}
        run: ./tests/test_reload_refuses_shipped_tags.sh

      - name: Validate reload --release builds the Release configuration
        if: ${{ !cancelled() && matrix.group == 'preflight' }}
        run: ./tests/test_reload_release_configuration.sh

      - name: Validate docs deployment authentication guard
        if: ${{ !cancelled() && matrix.group == 'preflight' }}
        run: python3 tests/test_docs_deploy_auth_guard.py

      - name: Validate web complexity scan scoping
        if: ${{ !cancelled() && matrix.group == 'preflight' }}
        run: python3 tests/test_web_complexity_scope.py

      # test-ios.yml and cmux-next.yml run the iOS package conventions lint for
      # feat-cmux-next too, so this guard and the test-ios.yml dispatch guard are in
      # preflight, which feat-cmux-next pull requests route; release-ios guards only
      # main's iOS upload path.
      - name: Validate iOS package conventions for this change
        if: ${{ !cancelled() && matrix.group == 'preflight' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          python3 tests/test_ci_ios_conventions_diff.py
          # The conventions lint scans the whole repository, so gating a PR on
          # it directly turns every open PR red whenever main carries one
          # unrelated violation (#10409). Judge the change instead: report only
          # violations absent from the base. Skipped outside PR/merge-group,
          # where there is no base to compare against.
          if [ -n "${BASE_SHA:-}" ]; then
            if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
              git fetch --no-tags --depth=1 origin "$BASE_SHA"
            fi
            ./scripts/ci/lint-ios-conventions-diff.sh "$BASE_SHA"
          else
            echo "No base revision for this event; conventions diff skipped."
          fi

      - name: Validate reload shared DerivedData default
        if: ${{ !cancelled() && matrix.group == 'preflight' }}
        run: ./tests/test_reload_shared_derived_data.sh

      - name: Validate reload's xcodebuild lock root ignores TMPDIR
        if: ${{ !cancelled() && matrix.group == 'preflight' }}
        run: ./tests/test_reload_xcodebuild_lock_root.sh

      - name: Validate reload emits the app module on Xcode versions that fail the module merge
        if: ${{ !cancelled() && matrix.group == 'preflight' }}
        run: ./tests/test_reload_app_module_emission.sh

      - name: Validate Resources property lists have unique keys
        if: ${{ !cancelled() && matrix.group == 'preflight' }}
        run: python3 tests/test_resources_plist_unique_keys.py

      - name: Validate dev builds declare http/https at Alternate rank
        if: ${{ !cancelled() && matrix.group == 'preflight' }}
        run: python3 tests/test_web_url_handler_rank.py

      - name: Validate the release-media scenes and changelog patcher
        if: ${{ !cancelled() && matrix.group == 'preflight' }}
        run: python3 tests/test_release_media.py

      - name: Validate .xcstrings merge driver
        if: ${{ !cancelled() && matrix.group == 'preflight' }}
        run: python3 tests/test_merge_xcstrings.py

      - name: Validate project.pbxproj merge driver
        if: ${{ !cancelled() && matrix.group == 'preflight' }}
        run: python3 tests/test_merge_pbxproj.py


      - name: "Validate Swift Testing #require is not nested"
        if: ${{ !cancelled() && matrix.group == 'preflight' }}
        run: python3 tests/test_swift_testing_require_not_nested.py
      - name: Validate pairing tests name their URL scheme
        if: ${{ !cancelled() && matrix.group == 'preflight' }}
        run: |
          python3 tests/test_pairing_scheme_lint.py
          python3 tests/test_pairing_scheme_is_explicit_in_tests.py
      - name: Validate Python test harness syntax
        if: ${{ !cancelled() && matrix.group == 'quality-determinism' }}
        run: git ls-files 'tests/*.py' 'tests_v2/*.py' 'scripts/*.py' | xargs python3 -m py_compile

      - name: Test private R2 URL presigner
        if: ${{ !cancelled() && matrix.group == 'preflight' }}
        run: python3 tests/test_r2_presign.py

      - name: Validate CI process-tree cancellation cleanup
        if: ${{ !cancelled() && matrix.group == 'preflight' }}
        run: python3 tests/test_ci_process_tree_reaping.py

      - name: Test Computer Use drag regression harness
        if: ${{ !cancelled() && matrix.group == 'preflight' }}
        run: python3 tests/test_cmux_cua_drag_cursor_harness.py

      - name: Validate Python test execution registry
        if: ${{ !cancelled() && matrix.group == 'preflight' }}
        env:
          CMUX_TEST_REGISTRY_BASE_REF: ${{ github.event.pull_request.base.ref || github.event.merge_group.base_ref || '' }}
        run: |
          set -euo pipefail
          args=()
          if [[ -n "$CMUX_TEST_REGISTRY_BASE_REF" ]]; then
            # Keep this fetch shallow. With the current base tip, merge-base may
            # be unavailable, and the two-tree diff fallback is the right answer.
            git fetch --no-tags --depth=1 origin "$CMUX_TEST_REGISTRY_BASE_REF"
            CMUX_TEST_REGISTRY_BASE_SHA="$(git rev-parse FETCH_HEAD)"
            args=(--base-sha "$CMUX_TEST_REGISTRY_BASE_SHA")
          fi
          python3 scripts/ci/validate_test_execution_registry.py "${args[@]+"${args[@]}"}"

      - name: Validate Python test execution registry blast radius
        if: ${{ !cancelled() && matrix.group == 'preflight' }}
        run: python3 tests/test_ci_test_execution_registry.py

      - name: Validate dev-fleet warm-slot lifecycle
        if: ${{ !cancelled() && matrix.group == 'preflight' }}
        run: |
          python3 tests/test_dev_fleet_warm_slot.py
          python3 tests/test_benchmark_dev_fleet_warm_slots.py

      - name: Test review fabric contracts
        if: ${{ !cancelled() && matrix.group == 'preflight' }}
        run: python3 tests/test_review_fabric.py

      - name: Test macOS localization catalog tooling
        if: ${{ !cancelled() && matrix.group == 'preflight' }}
        run: |
          python3 tests/test_localization_catalog.py
          python3 tests/test_localize_changes.py
          python3 tests/test_localization_defaults.py

      - name: Test fake-socket CLI test helpers
        if: ${{ !cancelled() && matrix.group == 'preflight' }}
        run: python3 tests/test_fake_socket_env.py

      # release-notary is the group cmux-next-guards.yml runs on every
      # feat-cmux-next pull request and push, where these files live.
      - name: Test What's New highlights and release notes
        if: ${{ !cancelled() && matrix.group == 'release-notary' }}
        # Every command runs, and the step fails at the end if any failed, so
        # one red (test_digest.py on a bad highlight) never hides the rest.
        run: |
          failed=()
          for command in \
            "python3 scripts/whats-new/test_digest.py" \
            "python3 scripts/whats-new/test_validate.py" \
            "python3 scripts/whats-new/test_community.py" \
            "python3 tests/test_cmux_next_release_notes.py" \
            "python3 tests/test_release_notes_pr_media.py" \
            "python3 tests/test_release_notes_clips.py" \
            "python3 tests/test_whats_new_clips.py" \
            "python3 scripts/cmux-next/media/whats-new-clips.py check"; do
            echo "::group::$command"
            $command || failed+=("$command")
            echo "::endgroup::"
          done
          for command in "${failed[@]}"; do echo "::error::failed: $command"; done
          [ "${#failed[@]}" -eq 0 ]

      - name: Test the server bootstrap candidate renderer
        if: ${{ !cancelled() && matrix.group == 'preflight' }}
        run: python3 scripts/server-release/test_render.py

      - name: Test the /release changelog line classifier
        if: ${{ !cancelled() && matrix.group == 'preflight' }}
        run: python3 tests/test_release_changelog_lines.py

      - name: Test the PR media uploader
        if: ${{ !cancelled() && matrix.group == 'preflight' }}
        run: python3 tests/test_pr_media.py

      - name: Test the cmux NEXT nightly reel builder
        if: ${{ !cancelled() && matrix.group == 'preflight' }}
        run: python3 tests/test_cmux_next_reel.py

      - name: Test the cmux NEXT media tour's app window capture
        if: ${{ !cancelled() && matrix.group == 'preflight' }}
        run: python3 tests/test_cmux_next_tour.py

      - name: Test XCStrings catalog lint
        if: ${{ !cancelled() && matrix.group == 'preflight' }}
        run: python3 tests/test_lint_xcstrings.py

      - name: Validate TUI npm package artifact transfer
        if: ${{ !cancelled() && matrix.group == 'preflight' }}
        run: python3 tests/test_tui_npm_package_artifact.py

      - name: Validate TUI package artifact contract
        if: ${{ !cancelled() && matrix.group == 'preflight' }}
        run: python3 tests/test_tui_package_contract.py

      - name: Validate Claude launch environment policy generation
        if: ${{ !cancelled() && matrix.group == 'preflight' }}
        run: python3 scripts/generate-claude-launch-environment-policy.py --check

      - name: Set up Bun for guard tests
        if: ${{ !cancelled() && (matrix.group == 'preflight-agent-chat' || matrix.group == 'release-ios') }}
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"

      # TypeScript is pinned exactly in agent-chat's devDependencies, so this
      # check uses the locked local compiler instead of fetching one at runtime.
      - name: Type-check agent-chat
        if: ${{ !cancelled() && matrix.group == 'preflight-agent-chat' }}
        working-directory: agent-chat
        run: |
          bun install --frozen-lockfile
          ./node_modules/.bin/tsc --noEmit

      # Runs the agent-chat boundary tests (a real server process and the
      # cmux-chat script; run-tests.ts).
      - name: Run agent-chat tests
        if: ${{ !cancelled() && matrix.group == 'preflight-agent-chat' }}
        working-directory: agent-chat
        run: bun run test

      # The committed control-plane wire types (Swift + TS) must be exactly
      # what quicktype regenerates from schemas/control-plane/; fails on any
      # hand edit or schema change without regen. Needs bun (bunx quicktype),
      # set up above.
      - name: Validate control-plane generated types
        if: ${{ !cancelled() && matrix.group == 'preflight-agent-chat' }}
        run: ./scripts/check-control-plane-types.sh

      # Runs web/scripts/check-complexity.mjs against scratch repositories, so
      # it needs the Bun set up above rather than the `ci` group's Python only.
      - name: Validate web complexity source enumeration
        if: ${{ !cancelled() && matrix.group == 'preflight-agent-chat' }}
        run: python3 tests/test_web_complexity_source_enumeration.py

      - name: Set up Python 3.9 for nightly prune compatibility
        if: ${{ !cancelled() && matrix.group == 'release-tooling' }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.9"

      - name: Prepare workflow guard Python dependencies
        if: ${{ !cancelled() && (matrix.group == 'preflight' || matrix.group == 'ci' || matrix.group == 'app-host-execution' || matrix.group == 'app-host-cache' || matrix.group == 'release-notary' || matrix.group == 'release-tooling') }}
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/workflow-guard-venv"
          packages=(PyYAML==6.0.3)
          if [[ "${{ matrix.group }}" == "release-tooling" ]]; then
            packages+=(bashlex==0.18)
          fi
          "$RUNNER_TEMP/workflow-guard-venv/bin/python" -m pip install \
            --disable-pip-version-check \
            --no-input \
            "${packages[@]}"
          echo "$RUNNER_TEMP/workflow-guard-venv/bin" >> "$GITHUB_PATH"

      - name: Validate Blacksmith Testbox broker trust boundary
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: python3 tests/test_ci_testbox_broker_guard.py

      # Keep the Testbox trust checks in the routed CI guard matrix. This
      # replaces the former always-on testbox-broker-guard workflow, which
      # repeated this work on every pull request and main push.
      - name: Validate Testbox cleanup receipt ownership
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: ./tests/test_testbox_cleanup_receipt_ref.sh
      - name: Testbox keepalive counts a command in the checkout as use
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: ./tests/test_testbox_keepalive_busy.sh

