name: CI guards

on:
  workflow_call:
    inputs:
      linux_guard_tests:
        required: true
        type: string
      linux_guard_test_groups:
        required: true
        type: string
      linux_guard_history:
        required: true
        type: string
      linux_guard_cli:
        required: true
        type: string
      linux_guard_source:
        required: true
        type: string

permissions:
  contents: read

jobs:
  workflow-guard-tests:
    if: ${{ inputs.linux_guard_tests == 'true' }}
    name: workflow-guard-tests / ${{ matrix.group }}
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(inputs.linux_guard_test_groups) }}
    runs-on: ${{ vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    # Its three sibling guard jobs are bounded at 15; 65 recent runs peaked at 0.8 min.
    timeout-minutes: 15
    # This job executes scripts from the pull request. It needs only read
    # access for checkout, never workflow, issue, or repository write access.
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Validate macOS runner guards
        if: ${{ matrix.group == 'preflight' }}
        run: ./tests/test_ci_self_hosted_guard.sh

      - name: Validate persistent Mac compile admission contract
        if: ${{ matrix.group == 'preflight' }}
        run: python3 tests/test_ci_persistent_mac_compile.py

      - name: Validate Swift incremental diagnostics tooling
        if: ${{ matrix.group == 'preflight' }}
        run: python3 tests/test_swift_incremental_diagnostics.py

      - name: Validate build graph health tooling
        if: ${{ matrix.group == 'preflight' }}
        run: python3 tests/test_build_graph_health.py

      - name: Validate CMUX workload profile contract
        if: ${{ matrix.group == 'ci' }}
        run: python3 tests/test_ci_workload_profiles.py

      - name: Validate repository variable defaults
        if: ${{ matrix.group == 'ci' }}
        run: python3 tests/test_ci_repo_variable_defaults.py

      - name: Validate quality guard structure
        if: ${{ matrix.group == 'ci' }}
        run: python3 tests/test_ci_quality_guard_structure.py

      - name: Validate Xcode build metrics receipt
        if: ${{ matrix.group == 'ci' }}
        run: python3 tests/test_build_metrics.py

      - name: Validate app-host guard structure
        if: ${{ matrix.group == 'ci' }}
        run: python3 tests/test_ci_app_host_guard_structure.py

      - name: Validate canonical compile cache build root
        if: ${{ matrix.group == 'ci' }}
        run: python3 tests/test_ci_canonical_build_root.py

      - name: Validate release guard structure
        if: ${{ matrix.group == 'ci' }}
        run: python3 tests/test_ci_release_guard_structure.py

      - name: Run canonical CMUX CI guard profile
        if: ${{ matrix.group == 'ci' }}
        run: |
          set -euo pipefail
          state_root="$RUNNER_TEMP/cmux-ci-guard-profile"
          result_path="$state_root/result.json"
          rm -rf "$state_root"
          if python3 scripts/ci/cmux_workload_profile.py run cmux.ci.guard \
            --generation 1 \
            --state-class cold \
            --state-root "$state_root" \
            --result "$result_path"; then
            status=0
          else
            status=$?
          fi
          [[ ! -f "$result_path" ]] || cat "$result_path"
          exit "$status"

      - name: Validate tagged reload works without the shared dev backend
        if: ${{ matrix.group == 'preflight' }}
        run: ./tests/test_reload_local_backend_mode.sh

      - name: Validate release SDK build lane
        if: ${{ matrix.group == 'preflight' }}
        run: ./tests/test_ci_release_sdk_lane.sh

      - name: Validate build-only reload keeps the tagged app bundle
        if: ${{ matrix.group == 'preflight' }}
        run: ./tests/test_reload_build_only_keeps_tagged_app.sh

      - name: Validate docs deployment authentication guard
        if: ${{ matrix.group == 'preflight' }}
        run: python3 tests/test_docs_deploy_auth_guard.py

      - name: Validate reload shared DerivedData default
        if: ${{ matrix.group == 'preflight' }}
        run: ./tests/test_reload_shared_derived_data.sh

      - name: Validate sidebar extension point generation
        if: ${{ matrix.group == 'preflight' }}
        run: python3 tests/test_write_sidebar_extension_point.py

      - name: Validate Localizable.xcstrings catalog structure
        if: ${{ matrix.group == 'preflight' }}
        run: python3 tests/test_localizable_xcstrings_structure.py

      - name: Validate .xcstrings merge driver
        if: ${{ matrix.group == 'preflight' }}
        run: python3 tests/test_merge_xcstrings.py


      - name: "Validate Swift Testing #require is not nested"
        if: ${{ matrix.group == 'preflight' }}
        run: python3 tests/test_swift_testing_require_not_nested.py
      - name: Validate pairing tests name their URL scheme
        if: ${{ matrix.group == 'preflight' }}
        run: |
          python3 tests/test_pairing_scheme_lint.py
          python3 tests/test_pairing_scheme_is_explicit_in_tests.py
      - name: Validate Python test harness syntax
        if: ${{ matrix.group == 'preflight' }}
        run: git ls-files 'tests/*.py' 'tests_v2/*.py' 'scripts/*.py' | xargs python3 -m py_compile

      - name: Validate Python test execution registry
        if: ${{ matrix.group == 'preflight' }}
        env:
          CMUX_TEST_REGISTRY_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
        run: |
          set -euo pipefail
          args=()
          if [[ -n "$CMUX_TEST_REGISTRY_BASE_SHA" ]]; then
            git fetch --no-tags --depth=1 origin "$CMUX_TEST_REGISTRY_BASE_SHA"
            args=(--base-sha "$CMUX_TEST_REGISTRY_BASE_SHA")
          fi
          python3 scripts/ci/validate_test_execution_registry.py "${args[@]}"

      - name: Validate Python test execution registry blast radius
        if: ${{ matrix.group == 'preflight' }}
        run: python3 tests/test_ci_test_execution_registry.py

      - name: Validate dev-fleet warm-slot lifecycle
        if: ${{ matrix.group == 'preflight' }}
        run: |
          python3 tests/test_dev_fleet_warm_slot.py
          python3 tests/test_benchmark_dev_fleet_warm_slots.py

      - name: Test review fabric contracts
        if: ${{ matrix.group == 'preflight' }}
        run: python3 tests/test_review_fabric.py

      - name: Test macOS localization catalog tooling
        if: ${{ matrix.group == 'preflight' }}
        run: |
          python3 tests/test_localization_catalog.py
          python3 tests/test_localize_changes.py

      - name: Validate cmux-cloud-vm skill covers the vm CLI
        if: ${{ matrix.group == 'preflight' }}
        run: python3 tests/test_cloud_vm_skill_coverage.py

      - name: Test XCStrings catalog lint
        if: ${{ matrix.group == 'preflight' }}
        run: python3 tests/test_lint_xcstrings.py

      - name: Validate TUI npm package artifact transfer
        if: ${{ matrix.group == 'preflight' }}
        run: python3 tests/test_tui_npm_package_artifact.py

      - name: Validate TUI package artifact contract
        if: ${{ matrix.group == 'preflight' }}
        run: python3 tests/test_tui_package_contract.py

      - name: Validate Claude launch environment policy generation
        if: ${{ matrix.group == 'preflight' }}
        run: python3 scripts/generate-claude-launch-environment-policy.py --check

      # The Swift validator reads the schema embedded in CmuxFoundation, so it
      # must be regenerated whenever web/data/cmux.schema.json changes.
      - name: Validate embedded cmux.json schema generation
        if: ${{ matrix.group == 'preflight' }}
        run: python3 scripts/generate-cmux-config-schema.py --check

      - name: Set up Bun for guard tests
        if: ${{ matrix.group == 'preflight' || matrix.group == 'release-ios' }}
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.6"

      - name: Validate Claude launch environment policy behavior
        if: ${{ matrix.group == 'preflight' }}
        working-directory: agent-chat
        run: bun test/claude-environment.test.ts

      # The committed control-plane wire types (Swift + TS) must be exactly
      # what quicktype regenerates from schemas/control-plane/; fails on any
      # hand edit or schema change without regen. Needs bun (bunx quicktype),
      # set up above.
      - name: Validate control-plane generated types
        if: ${{ matrix.group == 'preflight' }}
        run: ./scripts/check-control-plane-types.sh

      - name: Set up Python 3.9 for nightly prune compatibility
        if: ${{ matrix.group == 'release-tooling' }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.9"

      - name: Prepare workflow guard Python dependencies
        if: ${{ matrix.group == 'preflight' || matrix.group == 'ci' || matrix.group == 'app-host-execution' || matrix.group == 'app-host-process' || matrix.group == 'app-host-cache' || matrix.group == 'release-notary' || matrix.group == 'release-tooling' }}
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/workflow-guard-venv"
          packages=(PyYAML==6.0.3)
          if [[ "${{ matrix.group }}" == "release-tooling" ]]; then
            packages+=(bashlex==0.18)
          fi
          "$RUNNER_TEMP/workflow-guard-venv/bin/python" -m pip install \
            --disable-pip-version-check \
            --no-input \
            "${packages[@]}"
          echo "$RUNNER_TEMP/workflow-guard-venv/bin" >> "$GITHUB_PATH"

      - name: Validate Blacksmith Testbox broker trust boundary
        if: ${{ matrix.group == 'ci' }}
        run: python3 tests/test_ci_testbox_broker_guard.py

      - name: Validate local hook trust boundary
        if: ${{ matrix.group == 'ci' }}
        run: python3 tests/test_preflight_trust.py

      - name: Validate required checks report for the merge queue
        if: ${{ matrix.group == 'ci' }}
        run: python3 tests/test_ci_merge_queue_required_checks.py

      - name: Validate required-check drift reconciliation
        if: ${{ matrix.group == 'ci' }}
        run: python3 tests/test_ci_required_checks_drift.py

      - name: Validate package test selection
        if: ${{ matrix.group == 'ci' }}
        run: python3 tests/test_ci_select_package_tests.py

      - name: Validate workflow_run triggers name workflows that exist
        if: ${{ matrix.group == 'ci' }}
        run: python3 tests/test_ci_workflow_run_sources.py

      - name: Validate shallow complexity comparison fetching
        if: ${{ matrix.group == 'ci' }}
        run: python3 tests/test_ci_fetch_complexity_base.py

      - name: Validate Ghostty helper cache failure handling
        if: ${{ matrix.group == 'release-tooling' }}
        run: bash tests/test_ghostty_cli_helper_cache.sh

      - name: Validate Ghostty Zig workflow pinning
        if: ${{ matrix.group == 'release-tooling' }}
        run: python3 tests/test_check_ghostty_zig_workflows.py

      - name: Validate Release helper architecture handoff
        if: ${{ matrix.group == 'release-tooling' }}
        run: python3 tests/test_ci_release_helper_archs.py

      - name: Validate stale run cleanup eligibility
        if: ${{ matrix.group == 'ci' }}
        run: python3 tests/test_cleanup_stale_runs.py

      - name: Validate the scheduled main full-suite run
        if: ${{ matrix.group == 'ci' }}
        run: python3 tests/test_ci_main_full_suite.py

      - name: Validate CI queue janitor policy
        if: ${{ matrix.group == 'ci' }}
        run: python3 tests/test_ci_queue_janitor.py

      - name: Validate CI health report
        if: ${{ matrix.group == 'ci' }}
        run: python3 tests/test_ci_health_report.py

      - name: Validate the trusted web complexity workflow
        if: ${{ matrix.group == 'ci' }}
        run: python3 tests/test_web_complexity_trusted_workflow.py

      - name: Validate every workflow guard is wired
        if: ${{ matrix.group == 'ci' }}
        run: python3 tests/test_ci_workflow_guards_are_wired.py

      - name: Validate required checks are bounded
        if: ${{ matrix.group == 'ci' }}
        run: python3 tests/test_ci_required_checks_are_bounded.py

      - name: Validate triage radar scoring
        if: ${{ matrix.group == 'ci' }}
        run: python3 tests/test_triage_radar.py

      - name: Validate cmux-tui focused filter routing
        if: ${{ matrix.group == 'ci' }}
        run: python3 tests/test_tui_focused_filter_guard.py

      - name: Validate the tui publish dispatch budget
        if: ${{ matrix.group == 'ci' }}
        run: python3 tests/test_tui_publish_dispatch_budget.py

      - name: Validate pull request caches are read-only
        if: ${{ matrix.group == 'ci' }}
        run: python3 tests/test_ci_pull_request_caches_are_read_only.py

      - name: Validate Release check architectures
        if: ${{ matrix.group == 'release-tooling' }}
        run: ./tests/test_ci_release_build_archs.sh

      - name: Validate exact Release product reuse
        if: ${{ matrix.group == 'release-tooling' }}
        run: |
          python3 tests/test_reuse_release_product.py
          python3 tests/test_ci_release_product_reuse.py

      - name: Validate the R2 cache store script
        if: ${{ matrix.group == 'ci' }}
        run: bash tests/test_ci_r2_cache.sh

      - name: Validate the R2 cache census
        if: ${{ matrix.group == 'ci' }}
        run: python3 tests/test_ci_r2_cache_census.py

      - name: Validate nightly prune Python compatibility
        if: ${{ matrix.group == 'release-tooling' }}
        run: |
          PYTHON_BIN=python3.9 bash ./tests/test_ci_nightly_prune_python_compat.sh
          python3 tests/test_prune_nightly_release_assets.py

      - name: Validate activation benchmark scrollback sizing
        if: ${{ matrix.group == 'ci' }}
        run: python3 tests/test_perf_activation_scrollback_sizing.py

      - name: Validate create-dmg version pinning
        if: ${{ matrix.group == 'release-notary' }}
        run: ./tests/test_ci_create_dmg_pinned.sh

      - name: Validate app bundle license compliance
        if: ${{ matrix.group == 'release-notary' }}
        run: ./tests/test_app_bundle_license_compliance.sh

      - name: Validate unit-test SwiftPM retry guard
        if: ${{ matrix.group == 'app-host-execution' }}
        run: ./tests/test_ci_unit_test_spm_retry.sh

      - name: Validate checkout failure network diagnostics
        if: ${{ matrix.group == 'ci' }}
        run: python3 tests/test_ci_checkout_network_diagnostics.py

      - name: Validate Swift Testing suite timeout guard
        if: ${{ matrix.group == 'app-host-execution' }}
        run: python3 tests/test_swift_testing_suite_timeout.py

      - name: Validate Swift package execution evidence
        if: ${{ matrix.group == 'app-host-execution' }}
        run: |
          python3 tests/test_swift_test_execution.py
          python3 tests/test_swift_package_execution.py

      - name: Validate xcodebuild noninteractive crash prompt guard
        if: ${{ matrix.group == 'app-host-execution' }}
        run: python3 tests/test_ci_xcodebuild_noninteractive_helper.py

      - name: Validate xcodebuild failure diagnostics
        if: ${{ matrix.group == 'app-host-execution' }}
        run: ./tests/test_ci_xcodebuild_with_diagnostics.sh

      - name: Validate pipe-safe CI capture
        if: ${{ matrix.group == 'app-host-execution' }}
        run: |
          bash tests/test_ci_run_and_capture.sh
          python3 tests/test_ci_app_host_pipe_capture.py

      - name: Validate focused test launcher
        if: ${{ matrix.group == 'app-host-execution' }}
        run: |
          python3 tests/test_run_e2e.py
          python3 tests/test_ci_e2e_compilation_cache.py

      - name: Validate app-host xcodebuild retry guard
        if: ${{ matrix.group == 'app-host-execution' }}
        run: ./tests/test_ci_app_host_xcodebuild_retry.sh

      - name: Validate app-host xcodebuild attempt budget
        if: ${{ matrix.group == 'app-host-execution' }}
        run: ./tests/test_ci_app_host_xcodebuild_attempts.sh

      - name: Validate console-session environment forwarding
        if: ${{ matrix.group == 'app-host-execution' }}
        run: python3 tests/test_ci_console_session_env_forwarding.py

      - name: Validate notification semantics gates
        if: ${{ matrix.group == 'ci' }}
        run: python3 tests/test_ci_notification_semantics.py

      - name: Validate app-host test failure classification
        if: ${{ matrix.group == 'app-host-process' }}
        run: python3 tests/test_ci_app_host_test_output.py

      - name: Validate app-host failure census
        if: ${{ matrix.group == 'app-host-process' }}
        run: python3 tests/test_ci_app_host_failure_census.py

      - name: Validate app-host result ratchet
        if: ${{ matrix.group == 'app-host-process' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          python3 tests/test_ci_app_host_result_accounting.py
          python3 scripts/ci/app_host_result_accounting.py validate-catalog scripts/ci/app-host-known-failures.json

          if [ -n "${BASE_SHA:-}" ]; then
            if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
              git fetch --no-tags --depth=1 origin "$BASE_SHA"
            fi
            base_catalog="$RUNNER_TEMP/app-host-known-failures-base.json"
            catalog_path="scripts/ci/app-host-known-failures.json"
            if ! base_path="$(git ls-tree -r --name-only "$BASE_SHA" -- "$catalog_path")"; then
              echo "Unable to inspect the base app-host known-failure catalog." >&2
              exit 1
            elif [ -z "$base_path" ]; then
              echo "Bootstrapping app-host known-failure catalog; future changes are subset-only."
            else
              git show "$BASE_SHA:$catalog_path" >"$base_catalog"
              python3 scripts/ci/app_host_result_accounting.py catalog-diff --base "$base_catalog" --current "$catalog_path"
            fi
          fi

      - name: Validate app-host user configuration isolation
        if: ${{ matrix.group == 'app-host-process' }}
        run: python3 tests/test_ci_app_host_home_isolation.py

      - name: Validate app-host identity and cleanup confirmation
        if: ${{ matrix.group == 'app-host-process' }}
        run: bash tests/test_ci_app_host_identity.sh

      - name: Validate app-host process receipts
        if: ${{ matrix.group == 'app-host-process' }}
        run: bash tests/test_ci_app_host_processes.sh

      - name: Validate isolated app-host home cleanup
        if: ${{ matrix.group == 'app-host-process' }}
        run: bash tests/test_ci_app_host_home_cleanup.sh

      - name: Validate Xcode SourcePackages cache sanitizer
        if: ${{ matrix.group == 'app-host-cache' }}
        run: python3 tests/test_ci_sanitize_xcode_source_packages_cache.py

      - name: Validate local build cache preflight
        if: ${{ matrix.group == 'app-host-cache' }}
        run: |
          python3 tests/test_local_build_cache_preflight.py
          python3 tests/test_local_build_cache_policy.py

      - name: Validate Xcode compilation cache pruning
        if: ${{ matrix.group == 'app-host-cache' }}
        run: python3 tests/test_ci_prune_xcode_compilation_cache.py

      - name: Validate TestFlight notes generator
        if: ${{ matrix.group == 'release-ios' }}
        run: python3 tests/test_ios_testflight_notes.py

      - name: Validate CMUX INTERNAL main-push path filter
        if: ${{ matrix.group == 'release-ios' }}
        run: python3 tests/test_ios_testflight_main_push_filter.py

      - name: Validate external TestFlight group assignment helper
        if: ${{ matrix.group == 'release-ios' }}
        run: python3 tests/test_ios_testflight_external_distribution.py

      - name: Validate Pro TestFlight distribution workflow
        if: ${{ matrix.group == 'release-ios' }}
        run: python3 tests/test_ios_testflight_pro_distribution.py

      - name: Validate iOS App Store lane identity
        if: ${{ matrix.group == 'release-ios' }}
        run: python3 tests/test_ios_appstore_lane_identity.py

      - name: Validate TestFlight upload argument expansion
        if: ${{ matrix.group == 'release-ios' }}
        run: python3 tests/test_ios_upload_array_expansion.py

      - name: Validate iOS screenshot capture fail-fast
        if: ${{ matrix.group == 'release-ios' }}
        run: python3 tests/test_ios_screenshot_capture_guard.py

      - name: Validate TestFlight assignment after a post-upload failure
        if: ${{ matrix.group == 'release-ios' }}
        run: python3 tests/test_ios_testflight_assignment_after_upload.py

      - name: Validate the TestFlight archive log is kept on failure
        if: ${{ matrix.group == 'release-ios' }}
        run: python3 tests/test_ios_testflight_archive_log.py

      - name: Validate iOS upload lean checkout
        if: ${{ matrix.group == 'release-ios' }}
        run: python3 tests/test_ios_upload_lean_checkout.py

      - name: Validate iOS upload batching
        if: ${{ matrix.group == 'release-ios' }}
        run: python3 tests/test_ios_upload_batching.py

      - name: Validate tagged iOS device entitlement fallback
        if: ${{ matrix.group == 'release-ios' }}
        run: node --test ios/tests/tagged-device-entitlements.test.mjs

      - name: Validate manual iOS workflow ref resolution
        if: ${{ matrix.group == 'release-ios' }}
        run: python3 tests/test_ios_workflow_dispatch_ref.py

      - name: Validate cmux scheme test configuration
        if: ${{ matrix.group == 'app-host-cache' }}
        run: ./tests/test_ci_scheme_testaction_debug.sh

      - name: Validate selected iOS test execution guard
        if: ${{ matrix.group == 'app-host-cache' }}
        run: python3 tests/test_ios_selected_test_execution.py

      - name: Validate cmuxTests sharding
        if: ${{ matrix.group == 'quality-sharding' }}
        run: |
          python3 scripts/ci/cmux_unit_test_shard.py --validate
          python3 tests/test_ci_cmux_unit_test_shard.py

      - name: Validate GhosttyKit checksum verification
        if: ${{ matrix.group == 'release-tooling' }}
        run: ./tests/test_ci_ghosttykit_checksum_verification.sh

      - name: Validate stalled GhosttyKit downloads resume
        if: ${{ matrix.group == 'release-tooling' }}
        run: ./tests/test_ci_ghosttykit_download_stall.sh

      - name: Validate GhosttyKit release check behavior
        if: ${{ matrix.group == 'release-tooling' }}
        run: ./tests/test_ci_ghosttykit_release_check.sh

      - name: Validate Zig install without sudo
        if: ${{ matrix.group == 'release-tooling' }}
        run: ./tests/test_install_zig_ci_no_sudo.sh

      - name: Validate Zig download resume and mirror isolation
        if: ${{ matrix.group == 'release-tooling' }}
        run: ./tests/test_install_zig_ci_download_resume.sh

      - name: Initialize Ghostty for Zig version guard
        if: ${{ matrix.group == 'release-tooling' }}
        run: git submodule update --init --depth 1 ghostty

      - name: Validate Ghostty Zig version synchronization
        if: ${{ matrix.group == 'release-tooling' }}
        run: ./tests/test_ghostty_zig_version_sync.sh

      - name: Validate bundled-resource incremental outputs
        if: ${{ matrix.group == 'quality-runtime' }}
        run: ./tests/test_build_app_bundled_resources.sh

      - name: Validate virtual display lock
        if: ${{ matrix.group == 'quality-runtime' }}
        run: ./tests/test_ci_virtual_display_lock.sh

      - name: Validate nightly tag push auth
        if: ${{ matrix.group == 'release-notary' }}
        run: ./tests/test_ci_nightly_tag_push_auth.sh

      - name: Validate nightly Xcode selection
        if: ${{ matrix.group == 'release-notary' }}
        run: ./tests/test_ci_nightly_xcode_selection.sh

      - name: Validate CI Xcode selection fast path
        if: ${{ matrix.group == 'release-notary' }}
        run: ./tests/test_ci_xcode_selection_fast_path.sh

      - name: Validate resumable GitHub release publication
        if: ${{ matrix.group == 'release-notary' }}
        run: python3 tests/test_github_release_publication.py

      - name: Validate the Homebrew cask update gate
        if: ${{ matrix.group == 'release-notary' }}
        run: python3 tests/test_release_homebrew_gate.py

      - name: Validate universal GhosttyKit and Release build settings
        if: ${{ matrix.group == 'release-notary' }}
        run: ./tests/test_ci_universal_release_settings.sh

      - name: Validate universal nightly workflow
        if: ${{ matrix.group == 'release-notary' }}
        run: bash ./tests/test_nightly_universal_build.sh

      - name: Validate nightly push throttle
        if: ${{ matrix.group == 'release-notary' }}
        run: python3 tests/test_ci_nightly_push_throttle.py

      - name: Validate test compilation cache seeding
        if: ${{ matrix.group == 'quality-sharding' }}
        run: bash ./tests/test_ci_test_compilation_cache_seed.sh

      - name: Validate cmux-tui client installation
        if: ${{ matrix.group == 'release-tooling' }}
        run: bash ./tests/test_install_cmux_tui_client.sh

      - name: Validate nightly notarization behavior
        if: ${{ matrix.group == 'release-notary' }}
        run: ./tests/test_notarize_nightly_dmg.sh

      - name: Validate Sparkle delta finalization
        if: ${{ matrix.group == 'release-notary' }}
        run: ./tests/test_finalize_sparkle_deltas.sh

