      # action's canary preflight passes. A local run (scripts/ci/guards-local.sh)
      # installs nothing; without tesseract the tests skip themselves.
      - name: Validate the media publishing gate with real OCR
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        timeout-minutes: 6
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          if ! command -v tesseract >/dev/null && [ "${GITHUB_ACTIONS:-}" = true ] && command -v apt-get >/dev/null; then
            # Wait for an unattended-upgrades or runner apt run instead of failing on the dpkg lock.
            sudo apt-get -o DPkg::Lock::Timeout=120 update -qq || sudo apt-get -o DPkg::Lock::Timeout=120 update -qq
            sudo apt-get -o DPkg::Lock::Timeout=120 install -y -qq --no-install-recommends tesseract-ocr tesseract-ocr-eng >/dev/null
          fi
          python3 tests/test_ci_pr_media_privacy.py -v SeededTermEndToEndTests

