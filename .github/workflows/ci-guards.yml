  guard-status:
    name: Guard status
    needs:
      - workflow-guard-submodule-forward-only
      - workflow-guard-tests
      - workflow-guard-history
      - workflow-guard-cli-scripts
      - workflow-guard-source-lints
    # Preserve the guard verdict after a failure, but do not start a rollup
    # after GitHub has cancelled the run.
    if: ${{ !cancelled() }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-4vcpu-ubuntu-2404' || vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 5
    steps:
      - name: Check routed guard jobs
        env:
          GUARD_INPUTS: ${{ toJSON(inputs) }}
          GUARD_NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          inputs = json.loads(os.environ["GUARD_INPUTS"])
          needs = json.loads(os.environ["GUARD_NEEDS"])
          route_jobs = {
              "submodule_forward_only": "workflow-guard-submodule-forward-only",
              "linux_guard_tests": "workflow-guard-tests",
              "linux_guard_history": "workflow-guard-history",
              "linux_guard_cli": "workflow-guard-cli-scripts",
              "linux_guard_source": "workflow-guard-source-lints",
          }
          bad = {}
          for route, job in sorted(route_jobs.items()):
              if route == "submodule_forward_only":
                  if needs[job]["result"] != "success":
                      bad[job] = needs[job]["result"]
                  continue
              value = inputs.get(route)
              result = needs[job]["result"]
              if value not in {"true", "false"}:
                  bad[route] = f"invalid route {route}={value!r}"
              elif value == "true":
                  # Pull requests run the `ci` group in the first-class
                  # `CI fast guards` job in ci.yml. The reusable matrix
                  # excludes that group, so a route containing only `ci`
                  # legitimately has no matrix leg to report here. Every
                  # other requested group still needs a successful matrix
                  # aggregate; malformed or missing group metadata fails
                  # closed instead of silently accepting an empty route.
                  if route == "linux_guard_tests":
                      raw_groups = inputs.get("linux_guard_test_groups")
                      try:
                          groups = json.loads(raw_groups) if isinstance(raw_groups, str) else None
                      except (TypeError, ValueError):
                          groups = None
                      if not isinstance(groups, list) or not all(isinstance(group, str) for group in groups):
                          bad[route] = f"invalid linux_guard_test_groups={raw_groups!r}"
                          continue
                      if groups and set(groups) == {"ci"}:
                          print("linux_guard_tests=authoritative CI fast guards job")
                          continue
                  if result != "success":
                      bad[job] = f"{result} (route {route}=true)"
              elif result not in {"success", "skipped"}:
                  bad[job] = result

          if bad:
              for name, result in bad.items():
                  print(f"{name}: {result}", file=sys.stderr)
              sys.exit(1)

          for route, job in sorted(route_jobs.items()):
              print(f"{route}={inputs.get(route)} {job}={needs[job]['result']}")
          PY
