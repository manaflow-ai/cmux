name: CI guards

on:
  workflow_call:
    inputs:
      linux_guard_tests:
        required: true
        type: string
      linux_guard_test_groups:
        required: true
        type: string
      linux_guard_history:
        required: true
        type: string
      linux_guard_cli:
        required: true
        type: string
      linux_guard_source:
        required: true
        type: string

permissions:
  contents: read

env:
  # zizmor and gitleaks fail a change only on a security hole it adds (scripts/static-analysis/ratchet.py ZIZMOR_HOLES,
  # any gitleaks secret); every other finding is report-only. "0" makes the holes warnings too.
  CMUX_STATIC_ANALYSIS_BLOCKING: "1"
  # Temporary REST budget attribution: one gh-call line per GitHub API call (scripts/ci/api_call_log/env.sh, fetched at a fixed commit when the checkout has no copy).
  BASH_ENV: '$({ w="${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh"; t="${RUNNER_TEMP:-/nonexistent}/api-call-log-src"; if [ -f "$w" ]; then echo "$w"; elif [ -n "${RUNNER_TEMP:-}" ]; then if [ ! -f "$t/env.sh" ] && [ ! -e "$t.tried" ] && { [ "${RUNNER_OS:-}" = Linux ] || [ "${RUNNER_OS:-}" = macOS ]; } && [ "$(date -u +%Y%m%d%H)" -lt 2026112300 ]; then : > "$t.tried"; mkdir -p "$t.part" && for x in env.sh gh sitecustomize.py isolated.py; do curl -fsSL --max-time 5 -o "$t.part/$x" "https://raw.githubusercontent.com/manaflow-ai/cmux/27647ffd3ae838c63be28ca3e5883dcd68c34518/scripts/ci/api_call_log/$x" || break; done; [ -s "$t.part/isolated.py" ] && mv "$t.part" "$t"; fi; if [ -f "$t/env.sh" ]; then echo "$t/env.sh"; else echo unset BASH_ENV > "$t.off.sh" && echo "$t.off.sh"; fi; fi; } 2>/dev/null)'

jobs:
  workflow-guard-submodule-forward-only:
    name: workflow-guard-submodule-forward-only
    # A feat-cmux-next pull request runs this job's commands as the ci/steps.toml step `submodule-forward-only`
    # (pr-pipeline.yml); a push, dispatch, the post-merge batch and a pull request into any other base still run them
    # here. Guard status counts the skip as fine only on such a pull request. The base is matched exactly: a pull
    # request into a stacked feat-cmux-next-* branch starts no pr-pipeline.yml run, so the job runs there.
    if: ${{ github.event_name != 'pull_request' || github.base_ref != 'feat-cmux-next' }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || 'cmux-linux' }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout parent repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # The synthetic PR commit and its first parent are sufficient for
          # the merge-base comparison, and keep this guard shallow like the
          # neighboring history guard.
          fetch-depth: 2
          # The guard initializes only changed gitlinks after comparing them.
          submodules: false
          persist-credentials: false

      - name: Bind submodule guard to synthetic merge parent
        run: |
          set -euo pipefail
          base="$(git rev-parse HEAD^1)"
          git cat-file -e "$base^{commit}"
          echo "GITHUB_BASE_SHA=$base" >> "$GITHUB_ENV"
          echo "GITHUB_HEAD_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Validate submodule gitlinks move forward only
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/submodule_forward_only.py

      - name: Test submodule forward-only guard
        run: python3 tests/test_submodule_forward_only.py

      # No build fetches a Zig package from a third-party host: codeberg.org's
      # outage on 2026-11-11 failed every cold libghostty-vt build (translate_c's
      # aro is git+https://codeberg.org/ziglang/arocc). Every URL dependency of
      # the Ghostty sources' trees, transitive ones included, is mirrored in
      # scripts/ci/zig-packages.lock on a host we control. A change to the lock,
      # a Ghostty gitlink or the detector also downloads every mirrored copy and
      # checks its sha256 and its own dependencies.
      - name: Validate no build fetches a Zig package from a third-party host
        run: |
          set -euo pipefail
          git submodule update --init --depth 1 ghostty ghostty-next
          args=()
          if git diff --name-only HEAD^1 HEAD -- scripts/ci/zig-packages.lock scripts/ci/zig_package_mirror.py ghostty ghostty-next | grep -q .; then
            args+=(--online)
          fi
          python3 scripts/ci/zig_package_mirror.py check ${args[@]+"${args[@]}"}

  workflow-guard-tests:
    if: ${{ inputs.linux_guard_tests == 'true' }}
    name: workflow-guard-tests / ${{ matrix.group }}
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(inputs.linux_guard_test_groups) }}
        exclude:
          - group: ci
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || 'cmux-linux' }}
    # Its three sibling guard jobs are bounded at 15; 65 recent runs peaked at 0.8 min.
    timeout-minutes: 15
    # This job executes scripts from the pull request. It needs only read
    # access for checkout, never workflow, issue, or repository write access.
    # The always-on CI fast-guards job owns the `ci` group for pull requests;
    # this routed matrix keeps the other groups that observe the diff.
    permissions:
      contents: read
    # Every guard step is `!cancelled() && <its group>`: a red guard no longer
    # skips the rest of its group, so one run names every failing guard (on
    # cmux#22135 one release-notary failure hid 47 of the group's 65 guards).
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # A persistent cmux-linux host reuses its workspace: drop the submodule checkouts a
      # previous job left there. Only on a self-hosted runner: never in a checkout run_ci_guards.py runs locally.
      - name: Drop stale submodule checkouts (self-hosted reused workspace)
        run: if [ "${RUNNER_ENVIRONMENT:-}" = self-hosted ]; then scripts/ci/reset-stale-submodules.sh; fi

      # toolchain_notices.py (the license compliance test) reads
      # ghostty-next/build.zig.zon and fails when it is missing; only
      # feat-cmux-next has that submodule.
      - name: Initialize ghostty-next for the toolchain notices
        if: ${{ !cancelled() && matrix.group == 'release-notary' }}
        run: |
          if git config -f .gitmodules --get submodule.ghostty-next.path >/dev/null; then
            git submodule update --init --depth 1 ghostty-next
          fi

      - name: Validate macOS runner guards
        if: ${{ !cancelled() && matrix.group == 'preflight' }}
        run: ./tests/test_ci_self_hosted_guard.sh

      - name: A red runner guard check cannot skip or excuse another
        if: ${{ !cancelled() && matrix.group == 'preflight' }}
        run: python3 tests/test_ci_guard_check_isolation.py

      - name: Validate workflow files stay under GitHub's size limit
        if: ${{ !cancelled() && matrix.group == 'preflight' }}
        run: python3 tests/test_workflow_file_size.py

      - name: Validate Swift incremental diagnostics tooling
        if: ${{ !cancelled() && matrix.group == 'preflight' }}
        run: python3 tests/test_swift_incremental_diagnostics.py

      - name: Validate build graph health tooling
        if: ${{ !cancelled() && matrix.group == 'preflight' }}
        run: python3 tests/test_build_graph_health.py

      - name: Validate Zig-free fleet step lockfiles
        if: ${{ !cancelled() && matrix.group == 'preflight' }}
        run: python3 tests/test_zig_free_step_lockfiles.py

      - name: No new hard-coded team host in cmux-tui or OptChat product code
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: python3 tests/test_check_team_hosts.py

      - name: Validate CMUX workload profile contract
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: python3 tests/test_ci_workload_profiles.py

      - name: Validate repository variable defaults
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: python3 tests/test_ci_repo_variable_defaults.py

      - name: Jobs that only drive the build fleet run on Linux, not a gateway Mac
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: python3 tests/test_ci_gateway_jobs_on_linux.py

      - name: Validate scripts keep full clones full
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: python3 tests/test_ci_no_shallow_dev_fetch.py

      # Build scripts add a Rust target only when it is missing (rustup target add
      # reaches static.rust-lang.org even for an installed target).
      - name: Validate scripts add only missing Rust targets
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: python3 tests/test_ci_rust_targets_installed_first.py

      - name: Test the Rust targets helper
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: bash tests/test_rust_targets_helper.sh

      # Fleet rules as a shrink-only ratchet: no fleet sudo keychain reads, no
      # new kill by process name or pattern, nothing depends on the personal
      # Linux workstation (tests/fleet-rule-allowlist.json).
      - name: Validate fleet rule lints
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: python3 tests/test_ci_fleet_rule_lints.py

      # Fleet-built test products a Mac unpacks: archive member checks and the same-length path mapping.
      - name: Test the fleet test products fetcher
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: python3 tests/test_ci_fleet_test_products.py

      # The fleet iOS build client the Linux kit job calls: token, submit, poll, artifact.
      - name: Test the fleet iOS build client
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: python3 tests/test_ci_fleet_ios_build.py

      # Noclobber is not exclusive creation: no set -C, and no guessable name in a shared temp folder, in scripts/
      # and .github/ (an allowlist with reasons that only shrinks).
      - name: Validate no guessable shared-temp names
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: python3 tests/test_ci_noclobber_sweep.py

      - name: Validate the local and fast guard runner
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: |
          python3 tests/test_ci_run_guards.py
          python3 tests/test_ci_tooling_steps.py

      - name: Validate push triggers name their branches
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: python3 tests/test_ci_push_trigger_branches.py

      - name: Validate no new check first runs after the merge
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: |
          python3 tests/test_ci_post_merge_checks.py
          python3 tests/test_ci_post_merge_batch.py
          python3 tests/test_ci_routed_jobs_check_needs.py
          python3 tests/test_ci_oops_isolate.py
          python3 tests/test_ci_piece_swap.py

      - name: Validate the step table
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: |
          python3 tests/test_ci_step_table.py
          python3 tests/test_ci_ios_fast_verdict.py
          python3 tests/test_ci_ios_fast_dispatch.py
          python3 tests/test_indexnow_notification.py

      - name: Validate the green receipts that skip unchanged checks
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: python3 tests/test_ci_pr_receipt.py

      - name: Validate CDN readers name their client
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: python3 tests/test_ci_cdn_user_agent.py

      - name: Validate the CI timing readout
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: python3 tests/test_ci_timing_readout.py

      - name: Validate the repository variable check
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: python3 tests/test_ci_check_repo_variables.py

      - name: Validate the Cloud capture account provisioning
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: python3 tests/test_cloud_capture_provision.py

      - name: Validate the Cloud chat proof script
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: python3 tests/test_cloud_chat_proof.py

      - name: Validate the Cloud chat proof failure evidence
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: python3 tests/test_cloud_chat_proof_failure_evidence.py

      - name: Validate the cmux login GitHub Action (OIDC exchange, RFD 0183)
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: python3 tests/test_cloud_login_action.py

      - name: Validate the cloud overflow switch
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: python3 tests/test_ci_cloud_overflow_switch.py

      - name: Validate guard failure attribution
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: python3 tests/test_ci_guard_attribution.py

      - name: Validate main-fix merge evidence
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: python3 tests/test_gh_merge_green.py

      - name: Validate the bug-fix proof-section warning
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: python3 tests/test_pr_proof_section.py

      - name: Validate the classic API auto-deploy guard
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: python3 tests/test_classic_api_guard.py

      - name: Validate the controller's idle classic API guard step
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: python3 tests/test_ci_advisory_idle_step.py

      - name: Validate the classic-frozen guard
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: python3 tests/test_classic_frozen_guard.py

      - name: Validate the language-boundaries check
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: python3 tests/test_language_boundaries.py

      - name: Validate the PR capture check
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: python3 tests/test_pr_capture_check.py

      - name: Validate attachment admission caps
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: python3 tests/test_attachment_caps_guard.py

      # No new size or count cap in the send path, as a shrink-only ratchet
      # (tests/send-path-cap-allowlist.json).
      - name: Validate send-path caps
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: python3 tests/test_send_path_caps.py

      # No new hard timeout below 30 seconds in the app/daemon request paths;
      # existing hits ratchet down in tests/short-timeout-allowlist.json.
      - name: Validate short timeout ratchet
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: python3 tests/test_short_timeout_guard.py

      # NEXT code adds no call to classic Cloud (/api/vm, /api/runs, a cmux.com
      # or cmux-staging API base), as a shrink-only ratchet
      # (tests/classic-cloud-route-allowlist.json).
      - name: Validate NEXT adds no classic Cloud routes
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: python3 tests/test_classic_cloud_routes.py

      # Every host NEXT's code names is listed in docs/privacy.md, and the list
      # stays exact (a row whose host left the code fails too). On a PR it reads only the changed files
      # (CMUX_GUARDS_BASE_SHA, tests/guard_delta.py).
      - name: Validate NEXT's outbound hosts are listed
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: python3 tests/test_outbound_hosts.py

      # The changed-files answer equals the whole scan's on throwaway repos.
      - name: Test the scan guards' changed-files-only mode
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: python3 tests/test_guard_delta.py

      # Every connectivity host NEXT's code names (ICE servers, relays, signaling, backend, update hosts) is in
      # config/network/allowlist.json, the list firewall admins allow; docs/network-requirements.md is rendered from it.
      - name: Validate NEXT's connectivity hosts are in the network allowlist
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: python3 tests/test_network_allowlist.py

      # Every outbound HTTP client or socket NEXT makes goes through the egress gate, which refuses unlisted hosts
      # at run time; tests/egress_ungated.json lists the sites not moved yet and may only shrink.
      - name: Validate NEXT's outbound sites go through the egress gate
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: python3 tests/test_egress_gate.py

      # Every egress gate site has a test that sends planted secrets through the real client to cmux-egress's
      # capture server and finds them in no request (tests/egress_seeded.json; its todo count may only go down).
      - name: Validate every egress gate site has a seeded-secret test
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: python3 tests/test_egress_seeded.py

      - name: Validate the PR perf section check
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: python3 tests/test_pr_perf_section_check.py

      - name: Validate the PR design spec check
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: python3 tests/test_pr_design_spec_check.py

      - name: Validate the PR body checks run each lint on its own events
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: python3 tests/test_pr_body_checks.py

      - name: Validate the PR cloud backend check
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: python3 tests/test_pr_cloud_backend_check.py

      - name: Validate gh-merge-green --revert
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: python3 tests/test_gh_merge_green_revert.py

      - name: Validate base-red excusal for gh-merge-green
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: python3 tests/test_base_red_excuse.py

      - name: Validate the base-red skip of PR jobs
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: python3 tests/test_ci_base_red_skip.py

      - name: Validate apt package handling on runner images
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: python3 tests/test_ci_apt_skips_baked_packages.py

      - name: Validate iroh Apple suite coverage
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: python3 tests/test_ci_iroh_apple_suites_have_mac_home.py

      - name: Validate commands on owned Mac runners
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: python3 tests/test_ci_owned_mac_jobs_no_sudo.py

      - name: Validate the Linux batch workflow
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: python3 tests/test_ci_pr_pipeline_linux_batch.py

      - name: Validate relay journey build caching
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: python3 tests/test_ci_relay_journey_build_cache.py

      - name: Validate dispatch workflow registration
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: python3 tests/test_ci_workflows_registered.py

      - name: Validate API workerd green markers
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: python3 tests/test_api_workerd_green_marker.py

      - name: Validate the hot verify workspace mirror seed
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: python3 tests/test_ci_hot_verify_mirror_seed.py

      - name: Validate job routing on router failure
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: python3 tests/test_ci_path_route_skips_on_failure.py

      - name: Validate app compile deferral on pull requests
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: python3 tests/test_cmux_next_pr_app_compile_deferred.py

      - name: Validate cmux-tui tree requests for pull requests
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: python3 tests/test_cmux_tui_tree_request_pr.py

      - name: Validate fleet fallback reporting
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: python3 tests/test_fleet_fallback.py

      - name: Validate the head fail-fast of PR runs
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: python3 tests/test_ci_head_fail_fast.py

      - name: Validate the kit's base-red notice
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: python3 tests/test_ci_ios_kit_base_red.py

      - name: Validate merge freezes as issues
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: python3 tests/test_merge_freeze.py

      - name: Validate bounded GitHub list reads (no gh api paginate flag under scripts/)
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: python3 tests/test_gh_pages.py

      - name: Validate main compile attribution
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: python3 tests/test_main_compile_attribution.py

      - name: Validate generated cmux-next coordination index
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: python3 scripts/cmux-next/generate-coordination-index.py --check

      - name: Validate CI failure attribution
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: python3 tests/test_ci_classify_failures.py

      # scripts/ci/oops is cmuxterm-hq tools/ci-oops, vendored byte for byte.
      - name: Validate the vendored ci-oops classifier
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: python3 scripts/ci/oops/test_ci_oops_vendored.py

      - name: Validate in-job ci-oops retry and ledger
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: python3 scripts/ci/oops/test_retry.py

      - name: Validate the workflow_run handlers' API budget
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: python3 tests/test_ci_workflow_run_api_budget.py

      - name: Require the R2 public URL wherever the R2 cache actions run
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: python3 tests/test_ci_r2_cache_public_url.py

      # scripts/ci/vm-image-qcow2.sh (RFD 0100 step 6): a tiny raw image and rootfs tarball become a qcow2 whose
      # sha256 file verifies. qemu-img is not on every runner image; the test skips its conversions without it.
      - name: Validate the VM image qcow2 export
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: |
          command -v qemu-img >/dev/null || timeout 120 sudo -n apt-get -o DPkg::Lock::Timeout=100 install -y -qq qemu-utils >/dev/null 2>&1 || true
          python3 tests/test_ci_vm_image_qcow2.py

      - name: Validate macOS jobs select a pinned Xcode
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: |
          python3 tests/test_ci_macos_xcode_selection.py
          python3 tests/test_ci_mac_grants.py
          python3 tests/test_mac_live_delivery.py
          python3 tests/test_nightly_next_signer_pick.py
          python3 tests/test_macos_cross_builds_have_go.py
          python3 tests/test_nightly_job_sdkroot.py

      - name: Validate the CEF shim C++ tests run without a Mac
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: python3 tests/test_cmux_next_shim_cpp_linux.py

      - name: Validate Xcode pin audit
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: python3 tests/test_ci_xcode_pin_audit.py

      - name: Validate the bash 3.2 parse job runs without a Mac
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: python3 tests/test_bash32_linux_job.py

      - name: Validate the macOS keychain real-import runs only for keychain changes
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: python3 tests/test_signing_keychain_real_import_gate.py

      - name: Validate Xcode build metrics receipt
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: python3 tests/test_build_metrics.py

      - name: Validate fleet compiler-cache wiring
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: |
          bash tests/test_ci_fleet_compilation_cache.sh
          python3 tests/test_ci_fleet_compilation_cache.py

      - name: Validate the VM runner guest Bun cache marker check
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: bash tests/test_ci_fsr_bun_cache.sh

      - name: Validate feature flag linter scope
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: python3 -m unittest tests/test_lint_feature_flags_scope.py tests/test_lint_feature_flags_review_date.py

      - name: Validate feature flag review lead-time report
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: python3 tests/test_feature_flag_review_lead_time.py

      - name: Validate feature flag review drift issue
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: python3 tests/test_feature_flag_review_drift_issue.py

      - name: Validate canonical compile cache build root
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: |
          python3 tests/test_ci_canonical_build_root.py
          python3 tests/test_ci_cache_restore_receipt.py

      - name: Validate seeded macOS checkout
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: python3 tests/test_ci_git_seed.py

      - name: Run canonical CMUX CI guard profile
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: |
          set -euo pipefail
          state_root="$RUNNER_TEMP/cmux-ci-guard-profile"
          result_path="$state_root/result.json"
          rm -rf "$state_root"
          if python3 scripts/ci/cmux_workload_profile.py run cmux.ci.guard \
            --generation 1 \
            --state-class cold \
            --state-root "$state_root" \
            --result "$result_path"; then
            status=0
          else
            status=$?
          fi
          [[ ! -f "$result_path" ]] || cat "$result_path"
          # ci-guard.sh's per-command and per-test checks (run_ci_guards.py --results).
          if [[ -n "${CMUX_GUARD_CHECK_RESULTS:-}" && -f "$state_root/guard-checks.tsv" ]]; then
            cat "$state_root/guard-checks.tsv" >> "$CMUX_GUARD_CHECK_RESULTS"
          fi
          exit "$status"

      - name: Validate tagged reload works without the shared dev backend
        if: ${{ !cancelled() && matrix.group == 'preflight' }}
        run: ./tests/test_reload_local_backend_mode.sh

      - name: Validate per-run iOS E2E backend script contracts
        if: ${{ !cancelled() && matrix.group == 'preflight' }}
        run: python3 tests/test_e2e_backend_scripts.py

      - name: Validate release SDK build lane
        if: ${{ !cancelled() && matrix.group == 'preflight' }}
        run: ./tests/test_ci_release_sdk_lane.sh

      - name: Validate build-only reload keeps the tagged app bundle
        if: ${{ !cancelled() && matrix.group == 'preflight' }}
        run: ./tests/test_reload_build_only_keeps_tagged_app.sh

      - name: Validate reload refuses DEV tags a shipped build owns
        if: ${{ !cancelled() && matrix.group == 'preflight' }}
        run: ./tests/test_reload_refuses_shipped_tags.sh

      - name: Validate reload --release builds the Release configuration
        if: ${{ !cancelled() && matrix.group == 'preflight' }}
        run: ./tests/test_reload_release_configuration.sh

      - name: Validate reload signs ad hoc unless CMUX_DEV_SIGN_IDENTITY names a present identity
        if: ${{ !cancelled() && matrix.group == 'preflight' }}
        run: ./tests/test_reload_dev_sign_identity.sh

      - name: Validate docs deployment authentication guard
        if: ${{ !cancelled() && matrix.group == 'preflight' }}
        run: python3 tests/test_docs_deploy_auth_guard.py

      - name: Validate web complexity scan scoping
        if: ${{ !cancelled() && matrix.group == 'preflight' }}
        run: python3 tests/test_web_complexity_scope.py

      # test-ios.yml and cmux-next.yml run the iOS package conventions lint for
      # feat-cmux-next too, so this guard and the test-ios.yml dispatch guard are in
      # preflight, which feat-cmux-next pull requests route; release-ios guards only
      # main's iOS upload path.
      - name: Validate iOS package conventions for this change
        if: ${{ !cancelled() && matrix.group == 'preflight' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          python3 tests/test_ci_ios_conventions_diff.py
          # --files-from grades only files under the lint's own roots: it is the iOS line's lint.
          python3 tests/test_lint_ios_conventions_scope.py
          # The conventions lint scans the whole repository, so gating a PR on
          # it directly turns every open PR red whenever main carries one
          # unrelated violation (#10409). Judge the change instead: report only
          # violations absent from the base. Skipped outside PR/merge-group,
          # where there is no base to compare against.
          if [ -n "${BASE_SHA:-}" ]; then
            if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
              git fetch --no-tags --depth=1 origin "$BASE_SHA"
            fi
            ./scripts/ci/lint-ios-conventions-diff.sh "$BASE_SHA"
          else
            echo "No base revision for this event; conventions diff skipped."
          fi

      # Leo, 2026-11-24: "wer need to chase all these placeholders doen and prevent them".
      # Fails a change that adds a spinner, skeleton or "Loading…" line to the iPhone app;
      # only added lines count (cmux-next-ios/design/placeholder-inventory.md lists the rest).
      - name: Validate no new iOS loading placeholders
        if: ${{ !cancelled() && matrix.group == 'preflight' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          python3 tests/test_ci_ios_loading_placeholders.py
          if [ -n "${BASE_SHA:-}" ]; then
            if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
              git fetch --no-tags --depth=1 origin "$BASE_SHA"
            fi
            python3 scripts/ci/check-ios-loading-placeholders.py "$BASE_SHA"
          else
            echo "No base revision for this event; placeholder check skipped."
          fi

      # Aziz, 2026-11-25: "it says mac is asleep incorrect" (cmux#57792). The service only
      # knows no Mac has cmux connected, so iPhone copy must not say a Mac is asleep.
      - name: Validate iOS copy never claims a Mac is asleep
        if: ${{ !cancelled() && matrix.group == 'preflight' }}
        run: |
          set -euo pipefail
          python3 tests/test_ci_ios_presence_claims.py
          python3 scripts/ci/check-ios-presence-claims.py

      - name: Validate reload shared DerivedData default
        if: ${{ !cancelled() && matrix.group == 'preflight' }}
        run: ./tests/test_reload_shared_derived_data.sh

      - name: Validate reload's xcodebuild lock root ignores TMPDIR
        if: ${{ !cancelled() && matrix.group == 'preflight' }}
        run: ./tests/test_reload_xcodebuild_lock_root.sh

      - name: Validate reload emits the app module on Xcode versions that fail the module merge
        if: ${{ !cancelled() && matrix.group == 'preflight' }}
        run: ./tests/test_reload_app_module_emission.sh

      - name: Validate Resources property lists have unique keys
        if: ${{ !cancelled() && matrix.group == 'preflight' }}
        run: python3 tests/test_resources_plist_unique_keys.py

      - name: Validate dev builds declare http/https at Alternate rank
        if: ${{ !cancelled() && matrix.group == 'preflight' }}
        run: python3 tests/test_web_url_handler_rank.py

      - name: Validate the release-media scenes and changelog patcher
        if: ${{ !cancelled() && matrix.group == 'preflight' }}
        run: python3 tests/test_release_media.py

      - name: Validate .xcstrings merge driver
        if: ${{ !cancelled() && matrix.group == 'preflight' }}
        run: python3 tests/test_merge_xcstrings.py

      - name: Validate project.pbxproj merge driver
        if: ${{ !cancelled() && matrix.group == 'preflight' }}
        run: python3 tests/test_merge_pbxproj.py


      - name: "Validate Swift Testing #require is not nested"
        if: ${{ !cancelled() && matrix.group == 'preflight' }}
        run: python3 tests/test_swift_testing_require_not_nested.py
      - name: Validate pairing tests name their URL scheme
        if: ${{ !cancelled() && matrix.group == 'preflight' }}
        run: |
          python3 tests/test_pairing_scheme_lint.py
          python3 tests/test_pairing_scheme_is_explicit_in_tests.py
      - name: Validate Python test harness syntax
        if: ${{ !cancelled() && matrix.group == 'quality-determinism' }}
        run: git ls-files 'tests/*.py' 'tests_v2/*.py' 'scripts/*.py' | xargs python3 -m py_compile

      - name: Test private R2 URL presigner
        if: ${{ !cancelled() && matrix.group == 'preflight' }}
        run: python3 tests/test_r2_presign.py

      - name: Validate CI process-tree cancellation cleanup
        if: ${{ !cancelled() && matrix.group == 'preflight' }}
        run: python3 tests/test_ci_process_tree_reaping.py

      - name: Validate Python test execution registry
        if: ${{ !cancelled() && matrix.group == 'preflight' }}
        env:
          CMUX_TEST_REGISTRY_BASE_REF: ${{ github.event.pull_request.base.ref || github.event.merge_group.base_ref || '' }}
        run: |
          set -euo pipefail
          args=()
          if [[ -n "$CMUX_TEST_REGISTRY_BASE_REF" ]]; then
            # Keep this fetch shallow. With the current base tip, merge-base may
            # be unavailable, and the two-tree diff fallback is the right answer.
            git fetch --no-tags --depth=1 origin "$CMUX_TEST_REGISTRY_BASE_REF"
            CMUX_TEST_REGISTRY_BASE_SHA="$(git rev-parse FETCH_HEAD)"
            args=(--base-sha "$CMUX_TEST_REGISTRY_BASE_SHA")
          fi
          # A push only warns: the pull request that adds an unregistered test is the one that fails.
          if [[ "${GITHUB_EVENT_NAME:-}" == push ]]; then
            args+=(--warn-only)
          fi
          python3 scripts/ci/validate_test_execution_registry.py "${args[@]+"${args[@]}"}"

      - name: Validate Python test execution registry blast radius
        if: ${{ !cancelled() && matrix.group == 'preflight' }}
        run: python3 tests/test_ci_test_execution_registry.py

      - name: Test review fabric contracts
        if: ${{ !cancelled() && matrix.group == 'preflight' }}
        run: python3 tests/test_review_fabric.py

      - name: Test macOS localization catalog tooling
        if: ${{ !cancelled() && matrix.group == 'preflight' }}
        run: |
          python3 tests/test_localization_catalog.py
          python3 tests/test_localize_changes.py
          python3 tests/test_localization_defaults.py

      - name: Test fake-socket CLI test helpers
        if: ${{ !cancelled() && matrix.group == 'preflight' }}
        run: python3 tests/test_fake_socket_env.py

      # release-notary is the group cmux-next-guards.yml runs on every
      # feat-cmux-next pull request and push, where these files live.
      - name: Test What's New highlights and release notes
        if: ${{ !cancelled() && matrix.group == 'release-notary' }}
        # Every command runs, and the step fails at the end if any failed, so
        # one red (test_digest.py on a bad highlight) never hides the rest.
        run: |
          failed=()
          for command in \
            "python3 scripts/whats-new/test_digest.py" \
            "python3 scripts/whats-new/test_validate.py" \
            "python3 scripts/whats-new/test_community.py" \
            "python3 tests/test_cmux_next_release_notes.py" \
            "python3 tests/test_release_notes_pr_media.py" \
            "python3 tests/test_release_notes_clips.py" \
            "python3 tests/test_whats_new_clips.py" \
            "python3 scripts/cmux-next/media/whats-new-clips.py check"; do
            echo "::group::$command"
            $command || failed+=("$command")
            echo "::endgroup::"
          done
          for command in "${failed[@]}"; do echo "::error::failed: $command"; done
          [ "${#failed[@]}" -eq 0 ]

      - name: Test the server bootstrap candidate renderer
        if: ${{ !cancelled() && matrix.group == 'preflight' }}
        run: python3 scripts/server-release/test_render.py

      - name: Test the /release changelog line classifier
        if: ${{ !cancelled() && matrix.group == 'preflight' }}
        run: python3 tests/test_release_changelog_lines.py

      - name: Test the PR media uploader
        if: ${{ !cancelled() && matrix.group == 'preflight' }}
        run: python3 tests/test_pr_media.py

      - name: Test the cmux NEXT nightly reel builder
        if: ${{ !cancelled() && matrix.group == 'preflight' }}
        run: python3 tests/test_cmux_next_reel.py

      - name: Test the cmux NEXT media tour's app window capture
        if: ${{ !cancelled() && matrix.group == 'preflight' }}
        run: python3 tests/test_cmux_next_tour.py

      - name: Test the cmux NEXT nightly visual gate
        if: ${{ !cancelled() && matrix.group == 'preflight' }}
        run: python3 tests/test_cmux_next_visual_gate.py

      - name: Test XCStrings catalog lint
        if: ${{ !cancelled() && matrix.group == 'preflight' }}
        run: python3 tests/test_lint_xcstrings.py

      - name: Validate TUI npm package artifact transfer
        if: ${{ !cancelled() && matrix.group == 'preflight' }}
        run: python3 tests/test_tui_npm_package_artifact.py

      - name: Validate TUI package artifact contract
        if: ${{ !cancelled() && matrix.group == 'preflight' }}
        run: python3 tests/test_tui_package_contract.py

      - name: Validate Claude launch environment policy generation
        if: ${{ !cancelled() && matrix.group == 'preflight' }}
        run: python3 scripts/generate-claude-launch-environment-policy.py --check

      - name: Restore pinned Bun 1.4.4 from the CI cache bucket
        if: ${{ !cancelled() && (matrix.group == 'preflight-agent-chat' || matrix.group == 'release-ios') }}
        shell: bash
        continue-on-error: true
        run: bash "$GITHUB_WORKSPACE/scripts/ci/toolchain-r2.sh" restore bun 1.4.4 || true

      - name: Set up Bun for guard tests
        if: ${{ !cancelled() && (matrix.group == 'preflight-agent-chat' || matrix.group == 'release-ios') }}
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
          no-cache: ${{ !startsWith(github.workspace, '/home/runner/work/') || !(github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && github.event_name != 'merge_group' && contains(fromJSON('["refs/heads/main","refs/heads/feat-cmux-next","refs/heads/nightly-next"]'), github.ref)) }}

      # TypeScript is pinned exactly in agent-chat's devDependencies, so this
      # check uses the locked local compiler instead of fetching one at runtime.
      - name: Type-check agent-chat
        if: ${{ !cancelled() && matrix.group == 'preflight-agent-chat' }}
        working-directory: agent-chat
        run: |
          bun install --frozen-lockfile
          ./node_modules/.bin/tsc --noEmit

      # Runs the agent-chat boundary tests (a real server process and the
      # cmux-chat script; run-tests.ts).
      - name: Run agent-chat tests
        if: ${{ !cancelled() && matrix.group == 'preflight-agent-chat' }}
        working-directory: agent-chat
        run: bun run test

      # The committed control-plane wire types (Swift + TS) must be exactly
      # what quicktype regenerates from schemas/control-plane/; fails on any
      # hand edit or schema change without regen. Needs bun (bunx quicktype),
      # set up above.
      - name: Validate control-plane generated types
        if: ${{ !cancelled() && matrix.group == 'preflight-agent-chat' }}
        run: ./scripts/check-control-plane-types.sh

      # Runs web/scripts/check-complexity.mjs against scratch repositories, so
      # it needs the Bun set up above rather than the `ci` group's Python only.
      - name: Validate web complexity source enumeration
        if: ${{ !cancelled() && matrix.group == 'preflight-agent-chat' }}
        run: python3 tests/test_web_complexity_source_enumeration.py

      # The machine join E2E harness: redaction, origin refusal and failure paths
      # (fake fetch and fake acpmux; no network, no secret).
      - name: Validate the machine join E2E harness
        if: ${{ !cancelled() && matrix.group == 'preflight-agent-chat' }}
        run: bun test scripts/cmux-next/machine-join-e2e.test.ts

      # The Auto journey's S4 phone sends, and the deploy check's retries: a failed Cloud journey runs once more, and db-release waits out a
      # full database (fake bun and fake connect; no network, no secret).
      - name: Validate the Cloud journey and deploy gate retries
        if: ${{ !cancelled() && matrix.group == 'preflight-agent-chat' }}
        run: bun test scripts/cmux-next/auto-journey-s4.test.ts scripts/cmux-next/cloud-journey.test.ts scripts/cmux-next/cloud-journey-retry.test.ts scripts/cmux-next/cloud-journey-first-text.test.ts scripts/cmux-next/cloud-journey-window.test.ts scripts/cmux-next/cloud-journey-preclaim-login.test.ts scripts/cmux-next/cloud-journey-teammate.test.ts

      # The staging test account sweep's picker: age, state, activity and creator decide what goes (pure; no
      # network, no secret).
      - name: Validate the staging test account sweep picker
        if: ${{ !cancelled() && matrix.group == 'preflight-agent-chat' }}
        run: bun test scripts/cmux-next/cloud-test-sweep.test.ts

      # The machine vault E2E harness: cleanup, refusal, skip and leak paths (fake fetch and
      # fake CLIs; no network, no secret).
      - name: Validate the machine vault E2E harness
        if: ${{ !cancelled() && matrix.group == 'preflight-agent-chat' }}
        run: bun test scripts/cmux-next/machine-vault-e2e.test.ts

      - name: Set up Python 3.9 for nightly prune compatibility
        if: ${{ !cancelled() && matrix.group == 'release-tooling' }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.9"

      - name: Prepare workflow guard Python dependencies
        if: ${{ !cancelled() && (matrix.group == 'preflight' || matrix.group == 'ci' || matrix.group == 'app-host-execution' || matrix.group == 'app-host-cache' || matrix.group == 'release-notary' || matrix.group == 'release-tooling') }}
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/workflow-guard-venv"
          packages=(PyYAML==6.0.3)
          if [[ "${{ matrix.group }}" == "release-tooling" ]]; then
            packages+=(bashlex==0.18)
          fi
          "$RUNNER_TEMP/workflow-guard-venv/bin/python" -m pip install \
            --disable-pip-version-check \
            --no-input \
            "${packages[@]}"
          echo "$RUNNER_TEMP/workflow-guard-venv/bin" >> "$GITHUB_PATH"

      - name: Validate the machine join E2E workflow's secret scope
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: python3 tests/test_machine_join_e2e_workflow.py

      - name: Validate Blacksmith Testbox broker trust boundary
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: python3 tests/test_ci_testbox_broker_guard.py

      # Keep the Testbox trust checks in the routed CI guard matrix. This
      # replaces the former always-on testbox-broker-guard workflow, which
      # repeated this work on every pull request and main push.
      - name: Validate Testbox cleanup receipt ownership
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: ./tests/test_testbox_cleanup_receipt_ref.sh
      - name: Testbox keepalive counts a command in the checkout as use
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: ./tests/test_testbox_keepalive_busy.sh

      - name: Testbox source mtimes restore only unchanged files
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: python3 tests/test_testbox_source_mtimes.py

      - name: Testbox target prune keeps the warm disk bounded
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: ./tests/test_testbox_target_prune.sh

      - name: Validate Testbox setup identity marker
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: ./tests/test_testbox_setup_identity.sh

      # -x follows each `# shellcheck source=` (repo-root relative), so a test that sources
      # scripts/cmux-next/tests/lib/git-fixture.sh lints with it instead of failing SC1091.
      - name: Lint the Testbox lane helpers
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: shellcheck -x scripts/blacksmith-bounded-command.sh scripts/blacksmith-cmux-tui-testbox-stage.sh scripts/blacksmith-testbox-cleanup.sh scripts/blacksmith-testbox-keepalive.sh scripts/blacksmith-testbox-busy.sh tests/test_testbox_keepalive_busy.sh scripts/blacksmith-testbox-target-prune.sh tests/test_testbox_target_prune.sh scripts/ci/install-actionlint.sh tests/test_ci_actionlint_download.sh tests/test_testbox_setup_identity.sh

      - name: Test the actionlint downloader without a network outage
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: ./tests/test_ci_actionlint_download.sh

      - name: Check that every workflow is linted
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: python3 tests/test_ci_actionlint_covers_every_workflow.py

      - name: Check that every workflow file is under GitHub's 500 KB limit, with room
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: python3 tests/test_ci_workflow_file_size.py

      - name: Check that no workflow gates a step on hashFiles() outside the workspace
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: python3 tests/test_ci_workflow_hashfiles_in_workspace.py

      - name: Check that no workflow submits a build-fleet job with a lapsing --pool
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: python3 tests/test_ci_workflows_pin_no_fleet_pool.py

      - name: Check that push and pull_request path filters agree
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: python3 tests/test_ci_workflow_path_filter_parity.py

      - name: Check that path-filtered workflows start for their tests' inputs
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: python3 tests/test_ci_workflow_paths_cover_inputs.py

      - name: Check that a docs-only pull request starts only the allowed workflows
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: python3 tests/test_ci_docs_only_prs.py

      - name: Check that a direct feat-cmux-next push compiles inside a taken coalesce window
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: python3 tests/test_base_coalesce_direct_push.py

      - name: Check that a cmux-rd-host change runs its macOS clippy and tests
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: python3 tests/test_ci_rd_host_macos_route.py

      - name: Validate the backend migration flow (append-only plan, push-safe guards)
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: python3 tests/test_backend_migration_flow.py

      - name: Validate the backend migrations plan skips the API when no migration changed
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: python3 tests/test_backend_migrations_plan.py

      - name: Lint every workflow
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        env:
          # manaflow-ai/actionlint v1.7.12-manaflow.1: upstream main 011a6d15 with the
          # shellcheck stdin deadlock fix (rhysd/actionlint#651), built
          # reproducibly; the release notes hold the build recipe.
          ACTIONLINT_VERSION: "1.7.12-manaflow.1"
          ACTIONLINT_SHA256: "9446e75901c9bc4447fa6cc1706b7b1b0c1af77fac1586a7c227170c902ecc25"
          ACTIONLINT_ASSET_ID: "656977422"
          # Warnings and errors gate; informational shellcheck findings do not.
          SHELLCHECK_OPTS: "-S warning"
        run: |
          set -euo pipefail
          ./scripts/ci/install-actionlint.sh
          "$RUNNER_TEMP/actionlint"

      # zizmor over the workflows and composite actions this change adds or edits, at its base and its head: a
      # new finding in ratchet.py's ZIZMOR_HOLES (untrusted input into a run: script, a privileged trigger that
      # checks out the pull request's head, a poisoned release cache, persisted credentials) fails; any other new
      # finding, and every finding already on the base, is a warning. Offline, a few seconds. Linux only.
      - name: Fail on a workflow security hole this change adds (zizmor)
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: |
          python3 tests/test_static_analysis_ratchet.py
          python3 scripts/static-analysis/ratchet.py zizmor

      # gitleaks over this change's commits (a merge commit's or push's diff against its first parent or
      # CMUX_GUARDS_BASE_SHA), values redacted: any secret fails. Linux only (LINUX_ONLY_STEPS).
      - name: Fail on a secret this change commits (gitleaks)
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: python3 scripts/static-analysis/ratchet.py gitleaks

      - name: Validate contributor verification receipts and selection
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: |
          python3 tests/test_verification_receipt.py
          python3 tests/test_verify_local.py

      - name: Validate local hook trust boundary
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: python3 tests/test_preflight_trust.py

      - name: Validate hook installation leaves existing hooks alone
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: python3 tests/test_install_git_hooks.py

      - name: Validate the Cargo.lock merge driver
        if: ${{ !cancelled() && matrix.group == 'ci' }}
        run: python3 tests/test_merge_cargo_lock.py

