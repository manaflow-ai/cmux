  workflow-guard-history:
    if: ${{ inputs.linux_guard_history == 'true' }}
    # The lockfile policy compares the candidate with the exact base parent of
    # GitHub's synthetic PR/merge-group commit. Depth 2 contains HEAD and that
    # parent; the policy does not need the rest of repository history.
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-4vcpu-ubuntu-2404' || vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # PR/merge-group synthetic commits need only HEAD + first parent.
          # fetch-depth 0 would also fetch every branch of the repository
          # (about ten thousand). That took 3-10 minutes and sometimes the
          # whole 15 minute job (run 37374680247).
          fetch-depth: 2
          persist-credentials: false

      - name: Fetch main history for a manual dispatch
        # A manual dispatch has no synthetic parent, so the policy falls back
        # to merge-base(origin/main, HEAD). Fetch only those two histories,
        # without file contents; the policy reads the few it needs on demand.
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          CHECKED_OUT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --filter=blob:none --unshallow origin \
            +refs/heads/main:refs/remotes/origin/main "$CHECKED_OUT_SHA"
          git merge-base origin/main HEAD

      - name: Bind package policy to synthetic merge base
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
        env:
          CHECKED_OUT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = "$CHECKED_OUT_SHA" ]
          base="$(git rev-parse HEAD^1)"
          git cat-file -e "$base^{commit}"
          echo "PACKAGE_RESOLVED_POLICY_BASE_REF=$base" >> "$GITHUB_ENV"
          echo "Package policy base: $base"

      - name: Set up Python 3.9
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.9"

      - name: Install workflow guard Python dependencies
        run: python3 -m pip install --disable-pip-version-check --no-input PyYAML==6.0.3 bashlex==0.18

      - name: Validate SwiftPM lockfile policy
        run: |
          python3 tests/test_package_resolved_policy_remote_inputs.py
          python3 tests/test_check_package_resolved_policy.py
          python3 scripts/check-package-resolved-policy.py

