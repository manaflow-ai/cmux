name: CI guards

on:
  workflow_call:
    inputs:
      linux_guard_tests:
        required: true
        type: string
      linux_guard_history:
        required: true
        type: string
      linux_guard_cli:
        required: true
        type: string
      linux_guard_source:
        required: true
        type: string

permissions:
  contents: read

jobs:
  workflow-guard-tests:
    if: ${{ inputs.linux_guard_tests == 'true' }}
    runs-on: ${{ vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    # This job executes scripts from the pull request. It needs only read
    # access for checkout, never workflow, issue, or repository write access.
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Validate macOS runner guards
        run: ./tests/test_ci_self_hosted_guard.sh

      - name: Validate tagged reload works without the shared dev backend
        run: ./tests/test_reload_local_backend_mode.sh

      - name: Validate release SDK build lane
        run: ./tests/test_ci_release_sdk_lane.sh

      - name: Validate docs deployment authentication guard
        run: python3 tests/test_docs_deploy_auth_guard.py

      - name: Validate reload shared DerivedData default
        run: ./tests/test_reload_shared_derived_data.sh

      - name: Validate sidebar extension point generation
        run: python3 tests/test_write_sidebar_extension_point.py

      - name: Validate Localizable.xcstrings catalog structure
        run: python3 tests/test_localizable_xcstrings_structure.py

      - name: Validate Python test harness syntax
        run: git ls-files 'tests/*.py' 'tests_v2/*.py' 'scripts/*.py' | xargs python3 -m py_compile

      - name: Test macOS localization catalog tooling
        run: |
          python3 tests/test_localization_catalog.py
          python3 tests/test_localize_changes.py

      - name: Validate cmux-cloud-vm skill covers the vm CLI
        run: python3 tests/test_cloud_vm_skill_coverage.py

      - name: Test XCStrings catalog lint
        run: python3 tests/test_lint_xcstrings.py

      - name: Validate TUI npm package artifact transfer
        run: python3 tests/test_tui_npm_package_artifact.py

      - name: Validate TUI package artifact contract
        run: python3 tests/test_tui_package_contract.py

      - name: Set up Bun for Claude launch environment policy test
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.6"

      - name: Validate Claude launch environment policy behavior
        working-directory: agent-chat
        run: bun test/claude-environment.test.ts

      # The committed control-plane wire types (Swift + TS) must be exactly
      # what quicktype regenerates from schemas/control-plane/; fails on any
      # hand edit or schema change without regen. Needs bun (bunx quicktype),
      # set up above.
      - name: Validate control-plane generated types
        run: ./scripts/check-control-plane-types.sh

      - name: Set up Python 3.9 for nightly prune compatibility
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.9"

      - name: Install workflow guard Python dependencies
        run: python3 -m pip install --disable-pip-version-check --no-input PyYAML==6.0.3 bashlex==0.18

      - name: Validate Blacksmith Testbox broker trust boundary
        run: python3 tests/test_ci_testbox_broker_guard.py

      - name: Validate local hook trust boundary
        run: python3 tests/test_preflight_trust.py

      - name: Validate required checks report for the merge queue
        run: python3 tests/test_ci_merge_queue_required_checks.py

      - name: Validate package test selection
        run: python3 tests/test_ci_select_package_tests.py

      - name: Validate shallow complexity comparison fetching
        run: python3 tests/test_ci_fetch_complexity_base.py

      - name: Validate Ghostty helper cache failure handling
        run: bash tests/test_ghostty_cli_helper_cache.sh

      - name: Validate stale run cleanup eligibility
        run: python3 tests/test_cleanup_stale_runs.py

      - name: Validate the trusted web complexity workflow
        run: python3 tests/test_web_complexity_trusted_workflow.py

      - name: Validate pull request caches are read-only
        run: python3 tests/test_ci_pull_request_caches_are_read_only.py

      - name: Validate Release check architectures
        run: ./tests/test_ci_release_build_archs.sh

      - name: Validate the R2 cache store script
        run: bash tests/test_ci_r2_cache.sh

      - name: Validate nightly prune Python compatibility
        run: PYTHON_BIN=python3.9 bash ./tests/test_ci_nightly_prune_python_compat.sh

      - name: Validate activation benchmark scrollback sizing
        run: python3 tests/test_perf_activation_scrollback_sizing.py

      - name: Validate create-dmg version pinning
        run: ./tests/test_ci_create_dmg_pinned.sh

      - name: Validate app bundle license compliance
        run: ./tests/test_app_bundle_license_compliance.sh

      - name: Validate unit-test SwiftPM retry guard
        run: ./tests/test_ci_unit_test_spm_retry.sh

      - name: Validate checkout failure network diagnostics
        run: python3 tests/test_ci_checkout_network_diagnostics.py

      - name: Validate Swift Testing suite timeout guard
        run: python3 tests/test_swift_testing_suite_timeout.py

      - name: Validate xcodebuild noninteractive crash prompt guard
        run: python3 tests/test_ci_xcodebuild_noninteractive_helper.py

      - name: Validate xcodebuild failure diagnostics
        run: ./tests/test_ci_xcodebuild_with_diagnostics.sh

      - name: Validate focused test launcher
        run: python3 tests/test_run_e2e.py

      - name: Validate app-host xcodebuild retry guard
        run: ./tests/test_ci_app_host_xcodebuild_retry.sh

      - name: Validate app-host xcodebuild attempt budget
        run: ./tests/test_ci_app_host_xcodebuild_attempts.sh

      - name: Validate notification semantics gates
        run: python3 tests/test_ci_notification_semantics.py

      - name: Validate app-host test failure classification
        run: python3 tests/test_ci_app_host_test_output.py

      - name: Validate app-host failure census
        run: python3 tests/test_ci_app_host_failure_census.py

      - name: Validate app-host user configuration isolation
        run: python3 tests/test_ci_app_host_home_isolation.py

      - name: Validate app-host identity and cleanup confirmation
        run: bash tests/test_ci_app_host_identity.sh

      - name: Validate app-host process receipts
        run: bash tests/test_ci_app_host_processes.sh

      - name: Validate isolated app-host home cleanup
        run: bash tests/test_ci_app_host_home_cleanup.sh

      - name: Validate Xcode SourcePackages cache sanitizer
        run: python3 tests/test_ci_sanitize_xcode_source_packages_cache.py

      - name: Validate local build cache preflight
        run: |
          python3 tests/test_local_build_cache_preflight.py
          python3 tests/test_local_build_cache_policy.py

      - name: Validate Xcode compilation cache pruning
        run: python3 tests/test_ci_prune_xcode_compilation_cache.py

      - name: Validate TestFlight notes generator
        run: python3 tests/test_ios_testflight_notes.py

      - name: Validate CMUX INTERNAL main-push path filter
        run: python3 tests/test_ios_testflight_main_push_filter.py

      - name: Validate external TestFlight group assignment helper
        run: python3 tests/test_ios_testflight_external_distribution.py

      - name: Validate Pro TestFlight distribution workflow
        run: python3 tests/test_ios_testflight_pro_distribution.py

      - name: Validate iOS App Store lane identity
        run: python3 tests/test_ios_appstore_lane_identity.py

      - name: Validate cmux scheme test configuration
        run: ./tests/test_ci_scheme_testaction_debug.sh

      - name: Validate selected iOS test execution guard
        run: python3 tests/test_ios_selected_test_execution.py

      - name: Validate cmuxTests sharding
        run: |
          python3 scripts/ci/cmux_unit_test_shard.py --validate
          python3 tests/test_ci_cmux_unit_test_shard.py

      - name: Validate GhosttyKit checksum verification
        run: ./tests/test_ci_ghosttykit_checksum_verification.sh

      - name: Validate stalled GhosttyKit downloads resume
        run: ./tests/test_ci_ghosttykit_download_stall.sh

      - name: Validate GhosttyKit release check behavior
        run: ./tests/test_ci_ghosttykit_release_check.sh

      - name: Validate Zig install without sudo
        run: ./tests/test_install_zig_ci_no_sudo.sh

      - name: Validate Zig download resume and mirror isolation
        run: ./tests/test_install_zig_ci_download_resume.sh

      - name: Initialize Ghostty for Zig version guard
        run: git submodule update --init --depth 1 ghostty

      - name: Validate Ghostty Zig version synchronization
        run: ./tests/test_ghostty_zig_version_sync.sh

      - name: Validate bundled-resource incremental outputs
        run: ./tests/test_build_app_bundled_resources.sh

      - name: Validate virtual display lock
        run: ./tests/test_ci_virtual_display_lock.sh

      - name: Validate nightly tag push auth
        run: ./tests/test_ci_nightly_tag_push_auth.sh

      - name: Validate nightly Xcode selection
        run: ./tests/test_ci_nightly_xcode_selection.sh

      - name: Validate CI Xcode selection fast path
        run: ./tests/test_ci_xcode_selection_fast_path.sh

      - name: Validate resumable GitHub release publication
        run: python3 tests/test_github_release_publication.py

      - name: Validate universal nightly workflow
        run: bash ./tests/test_nightly_universal_build.sh

      - name: Validate test compilation cache seeding
        run: bash ./tests/test_ci_test_compilation_cache_seed.sh

      - name: Validate cmux-tui client installation
        run: bash ./tests/test_install_cmux_tui_client.sh

      - name: Validate nightly notarization behavior
        run: ./tests/test_notarize_nightly_dmg.sh

      - name: Validate Sparkle delta finalization
        run: ./tests/test_finalize_sparkle_deltas.sh

      - name: Validate previous nightly build fetch
        run: ./tests/test_fetch_previous_nightly_dmgs.sh

      - name: Validate Computer Use helper notarization behavior
        run: ./tests/test_notarize_computer_use_helper.sh

      - name: Validate release asset guard
        run: node scripts/release_asset_guard.test.js

      - name: Validate CI change area filter
        run: |
          python3 tests/test_ci_change_areas.py
          python3 tests/test_ci_linux_guard_routing.py
          python3 tests/test_app_host_test_products.py
          python3 tests/test_reuse_app_host_products.py
          python3 tests/test_ci_product_publication.py

      - name: Validate Python R2 appcast upload guard
        run: ./tests/test_ci_r2_upload_python.sh

      - name: Validate release-build timeout guard
        run: ./tests/test_ci_release_build_timeout.sh

      - name: Validate reusable workflow permission grants
        run: python3 tests/test_ci_reusable_workflow_permissions.py

      - name: Validate release does not gate on iOS screenshot capture
        run: ./tests/test_ci_release_ios_screenshots_decoupled.sh

      - name: Validate Sparkle monotonic guard modes
        run: ./tests/test_sparkle_build_monotonic_modes.sh

      - name: Validate release tunnel extension identifiers
        run: ./tests/test_ci_release_tunnel_identifiers.sh

      - name: Validate Sparkle appcast generation without previous archives
        run: ./tests/test_sparkle_generate_appcast_no_deltas.sh

      - name: Validate markdown viewer asset compression
        run: ./tests/test_compress_markdown_viewer_assets.sh

      - name: Validate release bundle stripping
        run: ./tests/test_strip_release_bundle.sh

      - name: Validate current GhosttyKit checksum pin
        run: ./tests/test_ci_ghosttykit_checksum_present.sh

      - name: Validate Swift warning budget guard
        run: ./tests/test_ci_swift_warning_budget.sh

      - name: Validate auxiliary window close shortcut lint
        run: ./tests/test_ci_auxiliary_window_close_shortcuts.sh

      - name: Validate bash shell integration job control
        run: python3 tests/test_bash_integration_no_done_notifications.py

      - name: Validate focused Dock shortcut routing guard
        run: python3 tests/test_dock_shortcut_routing_guard.py

      - name: Validate bash prompt bootstrap composes with user PROMPT_COMMAND (starship)
        run: python3 tests/test_issue_5164_starship_prompt_composition.py

      - name: Validate test determinism gate
        run: |
          python3 scripts/check-test-determinism.py --self-test
          python3 scripts/check-test-determinism.py --strict

  workflow-guard-history:
    if: ${{ inputs.linux_guard_history == 'true' }}
    # The lockfile policy diffs against the merge base, so this is the only
    # guard job that fetches history.
    runs-on: ${{ vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.9
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.9"

      - name: Install workflow guard Python dependencies
        run: python3 -m pip install --disable-pip-version-check --no-input PyYAML==6.0.3 bashlex==0.18

      - name: Validate SwiftPM lockfile policy
        run: |
          python3 tests/test_package_resolved_policy_remote_inputs.py
          python3 tests/test_check_package_resolved_policy.py
          python3 scripts/check-package-resolved-policy.py

  workflow-guard-cli-scripts:
    if: ${{ inputs.linux_guard_cli == 'true' }}
    # Slow guards run beside workflow-guard-tests so they do not extend it.
    runs-on: ${{ vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python 3.9
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.9"

      - name: Install workflow guard Python dependencies
        run: python3 -m pip install --disable-pip-version-check --no-input PyYAML==6.0.3 bashlex==0.18

      - name: Validate cmux-tui client commit resolution
        run: ./tests/test_ci_resolve_cmux_tui_client_commit.sh

      - name: Validate cmux profiling support scripts
        run: ./tests/test_start_cmux_profiling.sh

  workflow-guard-source-lints:
    if: ${{ inputs.linux_guard_source == 'true' }}
    # Slow guards run beside workflow-guard-tests so they do not extend it.
    runs-on: ${{ vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python 3.9
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.9"

      - name: Install workflow guard Python dependencies
        run: python3 -m pip install --disable-pip-version-check --no-input PyYAML==6.0.3 bashlex==0.18

      - name: Validate sidebar lazy-layout guard
        run: python3 tests/test_ci_sidebar_lazy_layout_guard.py

      - name: Initialize Bonsplit for deferred-work ownership guard
        run: git submodule update --init --depth 1 vendor/bonsplit

      - name: Validate stored DispatchWorkItem ownership
        run: |
          python3 tests/test_lint_stored_dispatch_work_items.py
          python3 scripts/lint-stored-dispatch-work-items.py

  guard-status:
    name: Guard status
    needs:
      - workflow-guard-tests
      - workflow-guard-history
      - workflow-guard-cli-scripts
      - workflow-guard-source-lints
    if: ${{ always() }}
    runs-on: ${{ vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 5
    steps:
      - name: Check routed guard jobs
        env:
          GUARD_INPUTS: ${{ toJSON(inputs) }}
          GUARD_NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          inputs = json.loads(os.environ["GUARD_INPUTS"])
          needs = json.loads(os.environ["GUARD_NEEDS"])
          route_jobs = {
              "linux_guard_tests": "workflow-guard-tests",
              "linux_guard_history": "workflow-guard-history",
              "linux_guard_cli": "workflow-guard-cli-scripts",
              "linux_guard_source": "workflow-guard-source-lints",
          }
          bad = {}
          for route, job in sorted(route_jobs.items()):
              value = inputs.get(route)
              result = needs[job]["result"]
              if value not in {"true", "false"}:
                  bad[route] = f"invalid route {route}={value!r}"
              elif value == "true":
                  if result != "success":
                      bad[job] = f"{result} (route {route}=true)"
              elif result not in {"success", "skipped"}:
                  bad[job] = result

          if bad:
              for name, result in bad.items():
                  print(f"{name}: {result}", file=sys.stderr)
              sys.exit(1)

          for route, job in sorted(route_jobs.items()):
              print(f"{route}={inputs.get(route)} {job}={needs[job]['result']}")
          PY
