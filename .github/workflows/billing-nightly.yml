name: Billing nightly

# The slow half of billing CI. Pull requests that touch billing run the fast
# half (billing.yml: unit, database and server end-to-end story tests, picked
# by scripts/ci/billing_lane.py). Every night, on main's HEAD:
#
# - suite: billing.yml in full (every billing job, whatever changed), so a
#   non-billing change the lane's path filter missed still meets every
#   billing test within a day.
# - apple-delivery (Sandbox and Production): asks the App Store Server API for
#   a TEST notification for com.cmux.app, waits until Apple reports it was
#   delivered to our notification URL (https://cmux.com/api/billing/apple/
#   notifications serves both environments of the App Store app), then reads
#   GET /api/cron/apple-notifications/health?uuid= to confirm the ledger
#   recorded it. Production delivery is what paying customers depend on.
#   Until the app's first App Store release Apple answers every Production
#   call with a bodyless 401, even for a key the Sandbox accepts. The job then
#   probes the Sandbox with the same key: if it answers, the Production job
#   passes with a neutral note ("locked until the first App Store release");
#   if the Sandbox refuses too, it is a red credential error. After the first
#   release an operator sets the repository variable
#   APPLE_IAP_PRODUCTION_RELEASED=1, and from then on a Production 401 is red
#   (docs/billing/ios-in-app-purchases.md, "After the first App Store release").
# - apple-api: the In-App Purchase key authenticates and a known Sandbox
#   subscription (vars.APPLE_IAP_HEALTH_ORIGINAL_TRANSACTION_ID) has a status.
# - storekit: the StoreKit simulator suite (BillingStoreKitTests) lives with
#   the iOS billing client on feat-cmux-next. GitHub runs schedules only from
#   main, so this job dispatches billing-nightly.yml on feat-cmux-next, as
#   ios-reliability-matrix.yml does; that file runs the suite when it exists
#   and reports its own red.
# - alert: one "Billing nightly is red" issue, opened on a red night, its body
#   rewritten on later reds and closed by the next green, as
#   cloud-journey-prod.yml does; and one Slack message to #cmux-automations
#   when the state changes, as cloud-vm-canary.yml does.
#
# Secrets live in the `billing-nightly` environment. An operator first limits
# its deployment branches to main, then adds the secrets: any workflow on any
# branch can name an environment, so that rule is the real boundary, and the
# config step fails the job when secrets are present without it. Until the
# secrets exist, the Apple jobs skip with a summary that names what is
# missing, and the night stays green:
#   APPLE_IAP_KEY_ID, APPLE_IAP_ISSUER_ID, APPLE_IAP_PRIVATE_KEY: the server's
#     In-App Purchase key (docs/billing/ios-in-app-purchases.md, "Server env").
#   APPLE_NOTIFICATIONS_HEALTH_TOKEN: the same value as the production web
#     deployment's APPLE_NOTIFICATIONS_HEALTH_TOKEN (`openssl rand -hex 32`;
#     the route refuses a token shorter than 32 characters).
#   CMUX_NOTIFY_TOKEN: the notify-only token cloud-vm-canary.yml uses.
#   Variable APPLE_IAP_HEALTH_ORIGINAL_TRANSACTION_ID: a Sandbox subscription
#     of com.cmux.app to look up (apple-api skips without it).
#   Variable APPLE_IAP_PRODUCTION_RELEASED: `1` once com.cmux.app has its
#     first App Store release (see apple-delivery above). The nightly's key is
#     an In-App Purchase key, which cannot read App Store Connect, so an
#     operator records the release here.
#
# Real Sandbox purchases with a tester account need a device and are a manual
# release checklist item (docs/billing/ios-in-app-purchases.md), not this job.
on:
  schedule:
    - cron: "41 9 * * *"
  workflow_dispatch:
    inputs:
      post_release_check:
        description: "Also run the post-release check: Production TEST notification delivered and stored, Production history answers, backfill cursor moves (waits up to 35 min for the cron)"
        type: boolean
        default: false

permissions:
  contents: read

env:
  # Temporary REST budget attribution: one gh-call line per GitHub API call (scripts/ci/api_call_log/env.sh, fetched at a fixed commit when the checkout has no copy).
  BASH_ENV: '$({ w="${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh"; t="${RUNNER_TEMP:-/nonexistent}/api-call-log-src"; if [ -f "$w" ]; then echo "$w"; elif [ -n "${RUNNER_TEMP:-}" ]; then if [ ! -f "$t/env.sh" ] && [ ! -e "$t.tried" ] && { [ "${RUNNER_OS:-}" = Linux ] || [ "${RUNNER_OS:-}" = macOS ]; } && [ "$(date -u +%Y%m%d%H)" -lt 2026112300 ]; then : > "$t.tried"; mkdir -p "$t.part" && for x in env.sh gh sitecustomize.py isolated.py; do curl -fsSL --max-time 5 -o "$t.part/$x" "https://raw.githubusercontent.com/manaflow-ai/cmux/27647ffd3ae838c63be28ca3e5883dcd68c34518/scripts/ci/api_call_log/$x" || break; done; [ -s "$t.part/isolated.py" ] && mv "$t.part" "$t"; fi; if [ -f "$t/env.sh" ]; then echo "$t/env.sh"; else echo unset BASH_ENV > "$t.off.sh" && echo "$t.off.sh"; fi; fi; } 2>/dev/null)'

jobs:
  suite:
    name: suite
    if: github.repository == 'manaflow-ai/cmux' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/billing.yml
    permissions:
      contents: read

  apple-delivery:
    name: apple-delivery (${{ matrix.environment }})
    # Only main's own definition gets the environment's secrets.
    if: github.repository == 'manaflow-ai/cmux' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        environment: [Sandbox, Production]
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 15
    environment: billing-nightly
    permissions:
      actions: read # read the environment's deployment-branch rule
      contents: read
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Check configuration
        id: config
        working-directory: .
        env:
          HAS_APPLE_IAP_KEY_ID: ${{ secrets.APPLE_IAP_KEY_ID != '' }}
          HAS_APPLE_IAP_ISSUER_ID: ${{ secrets.APPLE_IAP_ISSUER_ID != '' }}
          HAS_APPLE_IAP_PRIVATE_KEY: ${{ secrets.APPLE_IAP_PRIVATE_KEY != '' }}
          HAS_APPLE_NOTIFICATIONS_HEALTH_TOKEN: ${{ secrets.APPLE_NOTIFICATIONS_HEALTH_TOKEN != '' }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/billing_nightly.py config --environment billing-nightly APPLE_IAP_KEY_ID APPLE_IAP_ISSUER_ID APPLE_IAP_PRIVATE_KEY APPLE_NOTIFICATIONS_HEALTH_TOKEN

      - name: Setup Bun
        if: steps.config.outputs.ready == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Cache Bun package cache
        if: ${{ (steps.config.outputs.ready == 'true') && (github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && github.event_name != 'merge_group' && contains(fromJSON('["refs/heads/main","refs/heads/feat-cmux-next","refs/heads/nightly-next"]'), github.ref)) }}
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('web/bun.lock') }}

      - name: Cache Bun package cache (restore only off base branches)
        if: ${{ (steps.config.outputs.ready == 'true') && !(github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && github.event_name != 'merge_group' && contains(fromJSON('["refs/heads/main","refs/heads/feat-cmux-next","refs/heads/nightly-next"]'), github.ref)) }}
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('web/bun.lock') }}

      - name: Install dependencies
        if: steps.config.outputs.ready == 'true'
        run: bun install --frozen-lockfile

      - name: Apple delivery round trip (com.cmux.app, ${{ matrix.environment }})
        if: steps.config.outputs.ready == 'true'
        env:
          APPLE_IAP_KEY_ID: ${{ secrets.APPLE_IAP_KEY_ID }}
          APPLE_IAP_ISSUER_ID: ${{ secrets.APPLE_IAP_ISSUER_ID }}
          APPLE_IAP_PRIVATE_KEY: ${{ secrets.APPLE_IAP_PRIVATE_KEY }}
          APPLE_NOTIFICATIONS_HEALTH_TOKEN: ${{ secrets.APPLE_NOTIFICATIONS_HEALTH_TOKEN }}
          ENVIRONMENT: ${{ matrix.environment }}
          APPLE_IAP_PRODUCTION_RELEASED: ${{ vars.APPLE_IAP_PRODUCTION_RELEASED }}
          HEALTH_URL: ${{ vars.BILLING_NIGHTLY_HEALTH_URL || 'https://cmux.com/api/cron/apple-notifications/health' }}
        run: |
          bun scripts/billing/apple-nightly-check.ts delivery \
            --environment "$ENVIRONMENT" --bundle-id com.cmux.app \
            --health-url "$HEALTH_URL"

  apple-api:
    name: apple-api
    if: github.repository == 'manaflow-ai/cmux' && github.ref == 'refs/heads/main'
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 10
    environment: billing-nightly
    permissions:
      actions: read # read the environment's deployment-branch rule
      contents: read
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Check configuration
        id: config
        working-directory: .
        env:
          HAS_APPLE_IAP_KEY_ID: ${{ secrets.APPLE_IAP_KEY_ID != '' }}
          HAS_APPLE_IAP_ISSUER_ID: ${{ secrets.APPLE_IAP_ISSUER_ID != '' }}
          HAS_APPLE_IAP_PRIVATE_KEY: ${{ secrets.APPLE_IAP_PRIVATE_KEY != '' }}
          HAS_APPLE_IAP_HEALTH_ORIGINAL_TRANSACTION_ID: ${{ vars.APPLE_IAP_HEALTH_ORIGINAL_TRANSACTION_ID != '' }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/billing_nightly.py config --environment billing-nightly APPLE_IAP_KEY_ID APPLE_IAP_ISSUER_ID APPLE_IAP_PRIVATE_KEY APPLE_IAP_HEALTH_ORIGINAL_TRANSACTION_ID

      - name: Setup Bun
        if: steps.config.outputs.ready == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Cache Bun package cache
        if: ${{ (steps.config.outputs.ready == 'true') && (github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && github.event_name != 'merge_group' && contains(fromJSON('["refs/heads/main","refs/heads/feat-cmux-next","refs/heads/nightly-next"]'), github.ref)) }}
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('web/bun.lock') }}

      - name: Cache Bun package cache (restore only off base branches)
        if: ${{ (steps.config.outputs.ready == 'true') && !(github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && github.event_name != 'merge_group' && contains(fromJSON('["refs/heads/main","refs/heads/feat-cmux-next","refs/heads/nightly-next"]'), github.ref)) }}
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('web/bun.lock') }}

      - name: Install dependencies
        if: steps.config.outputs.ready == 'true'
        run: bun install --frozen-lockfile

      - name: App Store Server API status lookup (com.cmux.app, Sandbox)
        if: steps.config.outputs.ready == 'true'
        env:
          APPLE_IAP_KEY_ID: ${{ secrets.APPLE_IAP_KEY_ID }}
          APPLE_IAP_ISSUER_ID: ${{ secrets.APPLE_IAP_ISSUER_ID }}
          APPLE_IAP_PRIVATE_KEY: ${{ secrets.APPLE_IAP_PRIVATE_KEY }}
          ORIGINAL_TRANSACTION_ID: ${{ vars.APPLE_IAP_HEALTH_ORIGINAL_TRANSACTION_ID }}
        run: |
          bun scripts/billing/apple-nightly-check.ts api \
            --environment Sandbox --bundle-id com.cmux.app \
            --original-transaction-id "$ORIGINAL_TRANSACTION_ID"

  # After com.cmux.app's first App Store release: one dispatch proves the
  # Production App Store Server API path end to end, with no lock fallback.
  #   gh workflow run billing-nightly.yml -R manaflow-ai/cmux --ref main -f post_release_check=true
  # A red post-release check turns the run red and `alert` reports it.
  apple-post-release:
    name: apple-post-release
    if: github.repository == 'manaflow-ai/cmux' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.post_release_check
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 50
    environment: billing-nightly
    permissions:
      actions: read # read the environment's deployment-branch rule
      contents: read
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Check configuration
        id: config
        working-directory: .
        env:
          HAS_APPLE_IAP_KEY_ID: ${{ secrets.APPLE_IAP_KEY_ID != '' }}
          HAS_APPLE_IAP_ISSUER_ID: ${{ secrets.APPLE_IAP_ISSUER_ID != '' }}
          HAS_APPLE_IAP_PRIVATE_KEY: ${{ secrets.APPLE_IAP_PRIVATE_KEY != '' }}
          HAS_APPLE_NOTIFICATIONS_HEALTH_TOKEN: ${{ secrets.APPLE_NOTIFICATIONS_HEALTH_TOKEN != '' }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/billing_nightly.py config --environment billing-nightly APPLE_IAP_KEY_ID APPLE_IAP_ISSUER_ID APPLE_IAP_PRIVATE_KEY APPLE_NOTIFICATIONS_HEALTH_TOKEN

      - name: Setup Bun
        if: steps.config.outputs.ready == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        if: steps.config.outputs.ready == 'true'
        run: bun install --frozen-lockfile

      - name: Post-release check (com.cmux.app, Production)
        if: steps.config.outputs.ready == 'true'
        env:
          APPLE_IAP_KEY_ID: ${{ secrets.APPLE_IAP_KEY_ID }}
          APPLE_IAP_ISSUER_ID: ${{ secrets.APPLE_IAP_ISSUER_ID }}
          APPLE_IAP_PRIVATE_KEY: ${{ secrets.APPLE_IAP_PRIVATE_KEY }}
          APPLE_NOTIFICATIONS_HEALTH_TOKEN: ${{ secrets.APPLE_NOTIFICATIONS_HEALTH_TOKEN }}
          HEALTH_URL: ${{ vars.BILLING_NIGHTLY_HEALTH_URL || 'https://cmux.com/api/cron/apple-notifications/health' }}
        run: |
          bun scripts/billing/apple-nightly-check.ts post-release \
            --bundle-id com.cmux.app --health-url "$HEALTH_URL"

  storekit:
    name: storekit
    # No secrets: it only dispatches this workflow on feat-cmux-next.
    if: github.repository == 'manaflow-ai/cmux' && github.ref == 'refs/heads/main'
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.CI_OVERFLOW_LINUX || 'cmux-linux' }}
    timeout-minutes: 20
    permissions:
      actions: write # dispatch billing-nightly.yml on feat-cmux-next
      contents: read
    env:
      # A scheduled job's GitHub API waits stop here and fail loud (scripts/ci/gh_budget_wait.sh).
      GH_BUDGET_WAIT_MAX_SECONDS: "900"
    steps:
      # This commit's GitHub API wait (scripts/ci/gh_budget_wait.sh): every later gh call, and
      # each github-script step that installs gh_budget_wait.cjs, waits through a rate limit or a
      # GitHub 5xx under the job's GH_BUDGET_WAIT_MAX_SECONDS, then fails loud.
      - name: Checkout the GitHub API wait
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: .gh-budget-tooling
          sparse-checkout: |
            scripts/ci/gh_budget_wait.sh
            scripts/ci/gh_budget_wait.cjs
          sparse-checkout-cone-mode: false
      - name: Wait through GitHub API rate limits and 5xx in this job
        working-directory: ${{ github.workspace }}
        run: bash .gh-budget-tooling/scripts/ci/gh_budget_wait.sh --install

      - name: Dispatch the StoreKit suite on feat-cmux-next
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Until feat-cmux-next has its billing-nightly.yml, there is nothing to run.
          # Only a 404 means the file is not there yet; any other error fails the job.
          if ! out="$(gh api "repos/$GITHUB_REPOSITORY/contents/.github/workflows/billing-nightly.yml?ref=feat-cmux-next" --silent 2>&1)"; then
            if grep -q "HTTP 404" <<< "$out"; then
              echo "feat-cmux-next has no billing-nightly.yml yet; StoreKit suite skipped." | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "::error::could not read feat-cmux-next's billing-nightly.yml: $out"
            exit 1
          fi
          gh workflow run billing-nightly.yml -R "$GITHUB_REPOSITORY" --ref feat-cmux-next
          echo "Dispatched billing-nightly.yml on feat-cmux-next; it reports the StoreKit suite in its own run and issue." >> "$GITHUB_STEP_SUMMARY"

  alert:
    name: alert
    needs: [suite, apple-delivery, apple-api, apple-post-release, storekit]
    if: ${{ always() && github.repository == 'manaflow-ai/cmux' && github.ref == 'refs/heads/main' }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 5
    environment: billing-nightly
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          sparse-checkout: scripts/ci/billing_nightly.py
          sparse-checkout-cone-mode: false

      - name: Open, update or close the red-nightly issue; tell Slack when the state changes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NEEDS: ${{ toJSON(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CMUX_NOTIFY_TOKEN: ${{ secrets.CMUX_NOTIFY_TOKEN }}
          CMUX_NOTIFY_URL: https://cmux-testflight-founders.debussy.workers.dev
          # #cmux-automations
          CMUX_NOTIFY_CHANNEL: C0BA32V49FD
        run: python3 scripts/ci/billing_nightly.py alert --title "Billing nightly is red" --workflow billing-nightly.yml
