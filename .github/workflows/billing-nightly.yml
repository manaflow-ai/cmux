name: Billing nightly

# feat-cmux-next's half of the Billing nightly. GitHub runs schedules only from
# the default branch, so main's billing-nightly.yml holds the tick: its
# `storekit` job dispatches this file on feat-cmux-next every night, as
# ios-reliability-matrix.yml does. A dispatch runs this branch's file, never
# main's, so the two share a name and nothing else.
#
# - lane: billing.yml in full on feat-cmux-next's tip: every billing web,
#   database and typecheck step, the iOS billing packages, and the StoreKit
#   Testing slot (BillingStoreKitTests: SKTestSession against a .storekit
#   file; buy, renew, expire, billing retry, refund, ask to buy, interrupted
#   purchase). The slot skips until the rewritten iOS billing client adds that
#   target (scripts/ci/billing_lane.py storekit_target).
# - alert: one "Billing nightly (feat-cmux-next) is red" issue, opened on a red
#   night, rewritten on later reds and closed by the next green, with main's
#   scripts/ci/billing_nightly.py. No secrets: Slack hears about main's nightly.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Temporary REST budget attribution: one gh-call line per GitHub API call (scripts/ci/api_call_log/env.sh, fetched at a fixed commit when the checkout has no copy).
  BASH_ENV: '$({ w="${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh"; t="${RUNNER_TEMP:-/nonexistent}/api-call-log-src"; if [ -f "$w" ]; then echo "$w"; elif [ -n "${RUNNER_TEMP:-}" ]; then if [ ! -f "$t/env.sh" ] && [ ! -e "$t.tried" ] && { [ "${RUNNER_OS:-}" = Linux ] || [ "${RUNNER_OS:-}" = macOS ]; } && [ "$(date -u +%Y%m%d%H)" -lt 2026112300 ]; then : > "$t.tried"; mkdir -p "$t.part" && for x in env.sh gh sitecustomize.py isolated.py; do curl -fsSL --max-time 5 -o "$t.part/$x" "https://raw.githubusercontent.com/manaflow-ai/cmux/27647ffd3ae838c63be28ca3e5883dcd68c34518/scripts/ci/api_call_log/$x" || break; done; [ -s "$t.part/isolated.py" ] && mv "$t.part" "$t"; fi; if [ -f "$t/env.sh" ]; then echo "$t/env.sh"; else echo unset BASH_ENV > "$t.off.sh" && echo "$t.off.sh"; fi; fi; } 2>/dev/null)'

jobs:
  lane:
    name: lane
    if: github.repository == 'manaflow-ai/cmux' && github.ref == 'refs/heads/feat-cmux-next'
    uses: ./.github/workflows/billing.yml
    # Nightlies stay on our own Macs (Lawrence, 2026-10-30): ios-billing takes
    # an owned glaeda-ios-sim mini (ios_runner_pool.py `runner: owned`), never
    # the Blacksmith default; only a person's re-run moves to Blacksmith.
    with:
      runner: owned
    permissions:
      contents: read
      # billing.yml's billing job reads the queue janitor's pool snapshot (an artifact).
      actions: read

  alert:
    name: alert
    needs: [lane]
    if: ${{ !cancelled() && github.repository == 'manaflow-ai/cmux' && github.ref == 'refs/heads/feat-cmux-next' }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && (vars.CI_FORK_LINUX_RUNNER || 'ubuntu-24.04') || vars.CI_OVERFLOW_LINUX || 'cmux-linux' }}
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      # The alert script lives with the tick on main.
      - name: Checkout main's alert script
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: refs/heads/main
          sparse-checkout: |
            scripts/ci/billing_nightly.py
            .gitmodules
          sparse-checkout-cone-mode: false

      - name: Open, update or close the red-nightly issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NEEDS: ${{ toJSON(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 scripts/ci/billing_nightly.py alert --title "Billing nightly (feat-cmux-next) is red" --workflow billing-nightly.yml --no-slack
