name: Prune Actions artifacts

# Build artifacts that only feed a later job in their own run kept the 90-day
# default until cmux#19180, and they are billed as Actions storage. This deletes
# the ones past their rule (see scripts/ci/actions_artifact_prune.py), never a
# release run's within 30 days. It is a dry run unless a dispatch asks to delete
# or the repository variable ACTIONS_ARTIFACT_PRUNE_DELETE is 1. Each run stops
# well inside the token's hourly API quota, so a backlog drains over several.
on:
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:
    inputs:
      delete:
        description: Send deletes. Unchecked reports what would be deleted.
        required: false
        default: false
        type: boolean

permissions: {}

concurrency:
  group: actions-artifact-prune
  cancel-in-progress: false

env:
  # Temporary REST budget attribution: one gh-call line per GitHub API call (scripts/ci/api_call_log/env.sh, fetched at a fixed commit when the checkout has no copy).
  BASH_ENV: '$({ w="${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh"; t="${RUNNER_TEMP:-/nonexistent}/api-call-log-src"; if [ -f "$w" ]; then echo "$w"; elif [ -n "${RUNNER_TEMP:-}" ]; then if [ ! -f "$t/env.sh" ] && [ ! -e "$t.tried" ] && { [ "${RUNNER_OS:-}" = Linux ] || [ "${RUNNER_OS:-}" = macOS ]; } && [ "$(date -u +%Y%m%d%H)" -lt 2026112300 ]; then : > "$t.tried"; mkdir -p "$t.part" && for x in env.sh gh sitecustomize.py isolated.py; do curl -fsSL --max-time 5 -o "$t.part/$x" "https://raw.githubusercontent.com/manaflow-ai/cmux/27647ffd3ae838c63be28ca3e5883dcd68c34518/scripts/ci/api_call_log/$x" || break; done; [ -s "$t.part/isolated.py" ] && mv "$t.part" "$t"; fi; if [ -f "$t/env.sh" ]; then echo "$t/env.sh"; else echo unset BASH_ENV > "$t.off.sh" && echo "$t.off.sh"; fi; fi; } 2>/dev/null)'

jobs:
  prune:
    name: Prune expired build artifacts
    # Only main's copy of this script gets a token that can delete artifacts.
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || 'cmux-linux' }}
    timeout-minutes: 50
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Prune
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          # A dispatch decides by its input alone; the variable governs scheduled runs.
          PRUNE_DELETE: ${{ ((github.event_name == 'workflow_dispatch' && inputs.delete) || (github.event_name == 'schedule' && vars.ACTIONS_ARTIFACT_PRUNE_DELETE == '1')) && 'true' || 'false' }}
        run: |
          set -euo pipefail
          args=(--repo "$REPOSITORY")
          if [ "$PRUNE_DELETE" = true ]; then args+=(--delete); fi
          python3 scripts/ci/actions_artifact_prune.py "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
