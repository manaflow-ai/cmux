name: Prune Actions artifacts

# Build artifacts that only feed a later job in their own run kept the 90-day
# default until cmux#19180, and they are billed as Actions storage. This deletes
# the ones past their rule (see scripts/ci/actions_artifact_prune.py), never a
# release run's within 30 days. It is a dry run unless a dispatch asks to delete
# or the repository variable ACTIONS_ARTIFACT_PRUNE_DELETE is 1. Each run stops
# well inside the token's hourly API quota, so a backlog drains over several.
on:
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:
    inputs:
      delete:
        description: Send deletes. Unchecked reports what would be deleted.
        required: false
        default: false
        type: boolean

permissions: {}

concurrency:
  group: actions-artifact-prune
  cancel-in-progress: false

jobs:
  prune:
    name: Prune expired build artifacts
    # Only main's copy of this script gets a token that can delete artifacts.
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 50
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Prune
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          # A dispatch decides by its input alone; the variable governs scheduled runs.
          PRUNE_DELETE: ${{ ((github.event_name == 'workflow_dispatch' && inputs.delete) || (github.event_name == 'schedule' && vars.ACTIONS_ARTIFACT_PRUNE_DELETE == '1')) && 'true' || 'false' }}
        run: |
          set -euo pipefail
          args=(--repo "$REPOSITORY")
          if [ "$PRUNE_DELETE" = true ]; then args+=(--delete); fi
          python3 scripts/ci/actions_artifact_prune.py "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
