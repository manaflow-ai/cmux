name: cmux-next perf bench

# Nightly xbench (msg 2654): cmux NEXT against Chrome, Helium, Ardia, Dia and
# Safari on the bench mini (cmux20-bench; scripts/perf-bench/README.md). The step builds a
# Release app at the feat-cmux-next tip, runs alone on an idle worker
# (class exclusive) and fails when a cmux row regressed past
# scripts/perf-bench/baseline/<chip>-macos<major>.json, or broke an enforced resource budget
# (cmux-budget, scripts/perf-bench/budgets.json). It goes through the
# build-fleet gateway runner (the one CI_SWIFT_PACKAGE_TESTS_STEP_GATEWAY names),
# which only hands the step to the controller with `cmux-ci run`.

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
    inputs:
      rounds:
        description: "rounds (each browser once per round)"
        default: "3"
      browsers:
        description: "browsers"
        default: "cmux-chromium,cmux-webkit,cmux-terminal,cmux-budget,chrome,helium,ardia,dia,safari"
      worker:
        description: "fleet worker (empty: any idle bench worker, today cmux20-bench)"
        default: ""
      gate:
        description: "1: fail on a cmux row regressed past the baseline; 0: report only (a budget-only run has no baseline rows)"
        default: "1"
      tabswitch:
        description: "tab switch matrix kinds, or off (off also skips the tagged Debug build when palette is off)"
        default: "chromium,webkit,markdown,chat"
      palette:
        description: "palette open timing: on or off"
        default: "on"

permissions:
  contents: read

concurrency:
  group: cmux-next-perf-bench
  cancel-in-progress: false

jobs:
  bench:
    if: github.repository_owner == 'manaflow-ai' && vars.CI_SWIFT_PACKAGE_TESTS_STEP_GATEWAY != ''
    runs-on: ${{ vars.CI_SWIFT_PACKAGE_TESTS_STEP_GATEWAY }}
    timeout-minutes: 420
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: feat-cmux-next
          fetch-depth: 1
          submodules: false
      - name: xbench on a fleet mini
        env:
          ROUNDS: ${{ inputs.rounds || '3' }}
          BROWSERS: ${{ inputs.browsers || 'cmux-chromium,cmux-webkit,cmux-terminal,cmux-budget,chrome,helium,ardia,dia,safari' }}
          WORKER: ${{ inputs.worker || '' }}
          GATE: ${{ inputs.gate || '1' }}
          TABSWITCH: ${{ inputs.tabswitch || 'chromium,webkit,markdown,chat' }}
          PALETTE: ${{ inputs.palette || 'on' }}
        run: |
          set -uo pipefail
          client="${CMUX_CI_CLIENT:-$HOME/.local/bin/cmux-ci}"
          if ! [[ -x "$client" ]]; then
            echo "::error title=Build fleet client missing::$client is not installed on runner $RUNNER_NAME; the bench did not run."
            exit 127
          fi
          sha="$(git rev-parse HEAD)"
          target=()
          [ -n "$WORKER" ] && target=(--target-worker "$WORKER")
          status=0
          "$client" run --class exclusive --measurement --label bench \
            --script scripts/measure/perf-bench.sh --ref "$sha" --timeout 23400 \
            --artifact artifacts/perf-bench/results.json ${target[@]+"${target[@]}"} \
            --arg="rounds=$ROUNDS" --arg="browsers=$BROWSERS" --arg="gate=$GATE" \
            --arg="tabswitch=$TABSWITCH" --arg="palette=$PALETTE" | tee "$RUNNER_TEMP/bench.log" || status=$?
          # The report prints BENCH.md into the step log; show it on the run page.
          sed -n '/^# xbench, /,$p' "$RUNNER_TEMP/bench.log" | grep -v '^PERF-BENCH-' >> "$GITHUB_STEP_SUMMARY" || true
          grep -E '^(PERF-BENCH-GATE|PERF-BUDGET)' "$RUNNER_TEMP/bench.log" >> "$GITHUB_STEP_SUMMARY" || true
          exit "$status"
