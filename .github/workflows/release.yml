name: Release macOS app

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions: {}

concurrency:
  group: stable-appcast-publication
  cancel-in-progress: false

env:
  CREATE_DMG_VERSION: 8.0.0

jobs:
  generate-ios-screenshots:
    name: Generate iOS App Store screenshots
    # Runs alongside the macOS build so every stable tag still ships screenshot
    # artifacts captured at the exact release ref. It is deliberately not a
    # dependency of build-sign-notarize: the DMG consumes nothing from it, and a
    # slow or flaky simulator capture (up to 300 minutes) must neither delay nor
    # fail a macOS release (https://github.com/manaflow-ai/cmux/issues/12149).
    # A failed capture still turns the run red, so it stays visible.
    #
    # Least privilege: capture-only reads the repository and nothing else, so
    # this job hands the callee neither the release token scopes nor the
    # repository secrets. The App Store Connect upload path inside the called
    # workflow is gated to workflow_dispatch from main and is unreachable from
    # a release run, so `secrets: inherit` would only have exposed the signing,
    # notarization, Sparkle and R2 secrets to a UI-test job.
    permissions:
      contents: read
    uses: ./.github/workflows/ios-screenshots.yml
    with:
      ref: ${{ github.ref }}
      languages: "en-US,de-DE,fr-FR,ar-SA,es-ES,zh-Hant,zh-Hans,ko,ja"
      upload: false

  build-ghostty-cli-helper:
    permissions:
      contents: write
      attestations: write
      id-token: write
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'macos-15' || (vars.CI_PAID_MACOS_OVERFLOW == '1' && vars.MACOS_RUNNER_15 || 'blacksmith-6vcpu-macos-15') }}
    timeout-minutes: 20
    steps:
      - name: Clear stale git locks (self-hosted reused workspace)
        shell: bash
        run: |
          # Self-hosted macOS runners reuse the workspace. A job cancelled or
          # killed mid-checkout can leave a stale .git/modules/*/index.lock that
          # fails every later submodule checkout (e.g. ghostty). Clear them first.
          ws="${GITHUB_WORKSPACE:-$PWD}"
          rm -f "$ws/.git/index.lock" 2>/dev/null || true
          if [ -d "$ws/.git/modules" ]; then
            find "$ws/.git/modules" -type f -name "*.lock" -delete 2>/dev/null || true
          fi

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install zig
        run: ./scripts/install-zig-ci.sh

      - name: Cache Zig packages
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/zig
          key: zig-packages-${{ hashFiles('ghostty/build.zig.zon', 'ghostty/build.zig.zon.json') }}
          restore-keys: zig-packages-

      - name: Build universal Ghostty CLI helper
        run: |
          set -euo pipefail
          mkdir -p ghostty-cli-helper
          ./scripts/build-ghostty-cli-helper.sh --universal --output ghostty-cli-helper/ghostty
          lipo ghostty-cli-helper/ghostty -verify_arch arm64 x86_64

      - name: Upload universal Ghostty CLI helper
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-ghostty-cli-helper
          path: ghostty-cli-helper/ghostty
          if-no-files-found: error
          retention-days: 3

  # A release bundles the cmux-tui of its own commit (cx-urd.9.1), as
  # nightly-next does: the daemon published for this commit's cmux-tui tree
  # (pin-cmux-tui.sh resolve-exact; the publishing commit may be an older
  # commit with the same tree key, its attested manifest carries the same
  # sha256). Every pushed branch's cmux-tui-artifacts run publishes its head's
  # tree, so a tag cut from a pushed commit is normally published already. An
  # unpublished tree waits up to CMUX_TUI_TREE_WAIT_SECONDS, then fails with
  # the publish command; a release never ships another commit's daemon.
  resolve-release-cmux-tui-client:
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-4vcpu-ubuntu-2404' || fromJSON(vars.RUNNER_POOLS).linux }}
    permissions:
      contents: read
    timeout-minutes: 55
    outputs:
      commit: ${{ steps.resolve.outputs.commit }}
      key: ${{ steps.resolve.outputs.key }}
      source_commit: ${{ steps.resolve.outputs.source_commit }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: false

      - name: Resolve this commit's cmux-tui client
        id: resolve
        env:
          CMUX_TUI_TREE_WAIT_SECONDS: "2700"
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Prints commit=, key=, source_commit= (this commit), tip_key=, behind=0
          # and behind_hours=0 lines and writes them to the step summary.
          resolved="$(scripts/cmux-next/pin-cmux-tui.sh resolve-exact)"
          printf '%s\n' "$resolved"
          grep -Eq '^commit=[0-9a-f]{40}$' <<<"$resolved"
          grep -Eq '^key=[0-9a-f]{40}$' <<<"$resolved"
          grep -Fxq "source_commit=$RELEASE_SHA" <<<"$resolved"
          printf '%s\n' "$resolved" >> "$GITHUB_OUTPUT"

  # Leo, 2026-10-28: the release signing jobs may run on our own Macs ("we can just read the code").
  # Picks build-sign-notarize's runner (scripts/ci/signing_runner.py): a drained owned Mac on attempt 1 while
  # vars.CI_SIGN_OWNED is 1, held whole for the job (its claim step), else the Blacksmith macOS label
  # whose queue moves, and the other size for a re-run. The routing App key stays in this Linux job's
  # routing environment and is minted only on the refs the release environment allows (main, rc/**, v* tags), so
  # no other branch's picker code ever holds it; actions: read is the queue janitor's pool snapshot. A failed pick reads as
  # success, and build-sign-notarize then falls back to Blacksmith 6 vCPU.
  pick-sign-runner:
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.CI_CLOUD_OVERFLOW_SAVED && 'blacksmith-8vcpu-ubuntu-2404' || 'blacksmith-4vcpu-ubuntu-2404' }}
    environment: ci-routing-agent
    continue-on-error: true
    # Checkout, then the token mints 1 + 1 and the pick 3.
    timeout-minutes: 8
    permissions:
      actions: read
      contents: read
    outputs:
      owned: ${{ steps.pick.outputs.owned }}
      runner: ${{ steps.pick.outputs.runner }}
      alternate: ${{ steps.pick.outputs.alternate }}
    steps:
      - name: Checkout the picker
        if: github.repository_owner == 'manaflow-ai'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          sparse-checkout: scripts/ci

      - name: Mint the owned-pool routing token
        id: route-token
        if: github.repository == 'manaflow-ai/cmux' && vars.CI_SIGN_OWNED == '1' && vars.CI_PR_POOL_OWNED == '1' && vars.GLAEDA_ROUTE_APP_ID != '' && github.run_attempt == 1 && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/rc/') || startsWith(github.ref, 'refs/tags/v'))
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.GLAEDA_ROUTE_APP_ID }}
          private-key: ${{ secrets.GLAEDA_ROUTE_APP_KEY }}
          permission-administration: read
          permission-organization-self-hosted-runners: read

      - name: Mint the routing token without the org permission
        id: route-token-repo
        if: steps.route-token.outcome == 'failure'
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.GLAEDA_ROUTE_APP_ID }}
          private-key: ${{ secrets.GLAEDA_ROUTE_APP_KEY }}
          permission-administration: read

      - name: Pick the signing runner
        id: pick
        if: github.repository_owner == 'manaflow-ai'
        continue-on-error: true
        timeout-minutes: 3
        env:
          ENABLED: ${{ vars.CI_SIGN_OWNED }}
          ROUTE_TOKEN: ${{ steps.route-token.outputs.token || steps.route-token-repo.outputs.token }}
          OWNED_LABELS: ${{ vars.CI_SIDE_LANE_RUNNER }}
          SNAPSHOT_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ vars.MACOS_RUNNER_26 }}
        run: python3 scripts/ci/signing_runner.py

  build-sign-notarize:
    permissions: &build-sign-notarize-permissions
      contents: write
      attestations: write
      id-token: write
    # Production secrets: GitHub releases them only to protected refs (the
    # environment's deployment branch policy: main, tags v*).
    environment: release
    needs: [build-ghostty-cli-helper, resolve-release-cmux-tui-client, pick-sign-runner]
    # Build the app on macOS 26 so SDK-gated SwiftUI Liquid Glass code compiles
    # into stable releases. The real universal Ghostty CLI helper is built on
    # macOS 15 above because Zig 0.15.2 cannot link it on macOS 26.
    # Import the Apple Developer ID intermediate chain into the build keychain
    # below so signing does not depend on mutable runner login-keychain state.
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || github.run_attempt == 1 && needs.pick-sign-runner.outputs.owned && fromJSON(needs.pick-sign-runner.outputs.owned) || github.run_attempt > 1 && needs.pick-sign-runner.outputs.alternate || needs.pick-sign-runner.outputs.runner || 'blacksmith-6vcpu-macos-26' }}
    # Notarization wait times vary on Apple's side; the app and the final DMG
    # serialize. v0.64.22 took 40 minutes with the legacy app's extra helper
    # builds and notarizations. Keep at least 25 percent above the measured
    # duration. Ten more minutes are the release publisher's rate-limit budget
    # (publish-release-assets.py, RATE_LIMIT_BUDGET_SECONDS), which waits at the end.
    timeout-minutes: 100
    outputs: &build-sign-notarize-outputs
      # owned when the claim gate passed on an owned Mac; the Blacksmith twin signs when it did not.
      claim: ${{ steps.claim-gate.outputs.claim }}
    steps: &build-sign-notarize-steps
      # First, before the checkout's token or any secret: on an owned Mac this job holds the whole
      # mini (glaeda's exclusive class) or fails here (tests/test_ci_signing_owned_mac.py CLAIM_GATE).
      - name: Hold the whole Mac before any credential
        id: claim-gate
        shell: bash
        run: |
          owned=""
          case "${RUNNER_NAME:-}" in *-glaeda|*-glaeda-*) owned=1 ;; esac
          if [ -d /Users/Shared/cmux-build-fleet ]; then owned=1; fi
          if [ -n "$owned" ]; then
            if [ "${GLAEDA_JOB_CLAIM:-}" != exclusive ]; then
              echo "::error title=Signing runner::This owned Mac did not give the job the whole mini; this run's Blacksmith job signs instead."
              exit 1
            fi
            hooks=$(curl -fsS --proto '=https' --retry 3 --max-time 20 \
              "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/scripts/ci/glaeda-signing-hooks.txt") || hooks=""
            hook="${GLAEDA_HOOK_SHA256:-}"
            listed=""
            if [[ "$hook" =~ ^[0-9a-f]{64}$ ]]; then
              while read -r sha _; do if [ "$sha" = "$hook" ]; then listed=1; fi; done <<< "$hooks"
            fi
            if [ -z "$listed" ]; then
              echo "::error title=Signing runner::glaeda hook ${hook:-unnamed} is not one scripts/ci/glaeda-signing-hooks.txt lists; this run's Blacksmith job signs instead."
              exit 1
            fi
            echo "claim=owned" >> "$GITHUB_OUTPUT"
          fi

      - name: Clear stale git locks (self-hosted reused workspace)
        shell: bash
        run: |
          # Self-hosted macOS runners reuse the workspace. A job cancelled or
          # killed mid-checkout can leave a stale .git/modules/*/index.lock that
          # fails every later submodule checkout (e.g. ghostty). Clear them first.
          ws="${GITHUB_WORKSPACE:-$PWD}"
          rm -f "$ws/.git/index.lock" 2>/dev/null || true
          if [ -d "$ws/.git/modules" ]; then
            find "$ws/.git/modules" -type f -name "*.lock" -delete 2>/dev/null || true
          fi

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # The job token can write release assets. Steps that need it get it as
          # GH_TOKEN; it is not left in .git/config for the build and runtime checks.
          persist-credentials: false
          submodules: recursive

      # Before any secret: the same check again, and a signing keychain a killed job left is removed.
      - name: Claim the whole Mac for signing
        run: ./scripts/ci/signing-runner-claim.sh

      - name: Validate Sparkle build number is monotonic
        # A tag push is about to publish, so a stale build number must fail.
        # A non-tag workflow_dispatch is the built-in dry run: it publishes
        # nothing and normally runs from a branch that has not been bumped yet,
        # so the same condition only warns there.
        env:
          CMUX_SPARKLE_MONOTONIC_MODE: ${{ startsWith(github.ref, 'refs/tags/') && 'enforce' || 'warn' }}
        run: ./tests/test_ci_sparkle_build_monotonic.sh

      - name: Guard immutable release assets
        id: guard_release_assets
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { evaluateReleaseAssetGuard } = require('./scripts/release_asset_guard');
            const tag = context.ref.startsWith('refs/tags/')
              ? context.ref.replace('refs/tags/', '')
              : null;
            core.setOutput('skip_all', 'false');
            core.setOutput('skip_upload', 'false');
            core.setOutput('release_state', 'clear');
            core.setOutput('resume_release_id', '');
            core.setOutput('resume_assets', '');
            core.setOutput('resume_asset_count', '');
            if (!tag) {
              core.notice('workflow_dispatch is not running from a tag; release guard is in dry-run mode.');
              return;
            }
            const { owner, repo } = context.repo;
            // The tags endpoint 404s for drafts, so list every release for the
            // tag as well. One release object may exist: with two, the assets
            // and the published release can differ (v0.65.2 shipped 0 assets).
            let byTag = null;
            try {
              byTag = (await github.rest.repos.getReleaseByTag({ owner, repo, tag })).data;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const listed = (await github.paginate(github.rest.repos.listReleases, { owner, repo, per_page: 100 }))
              .filter((entry) => entry.tag_name === tag);
            const ids = [...new Set([...(byTag ? [byTag.id] : []), ...listed.map((entry) => entry.id)])];
            if (ids.length > 1) {
              core.setFailed(
                `Release ${tag} has ${ids.length} release objects (ids ${ids.sort((a, b) => a - b).join(', ')}). ` +
                'Delete the duplicate drafts, then rerun.'
              );
              return;
            }
            const release = byTag || listed[0];
            if (!release) {
              core.notice(`Release ${tag} does not exist yet; safe to build and publish assets.`);
              return;
            }
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
              owner, repo, release_id: release.id, per_page: 100,
            });
            const existingAssetNames = assets.filter((asset) => asset.state === 'uploaded').map((asset) => asset.name);
            const {
              conflicts,
              missingImmutableAssets,
              guardState,
              hasPartialConflict,
              shouldSkipBuildAndUpload,
            } = evaluateReleaseAssetGuard({ existingAssetNames });

            core.setOutput('release_state', guardState);

            if (hasPartialConflict) {
              core.setFailed(
                `Release ${tag} has a partial immutable asset state. Existing immutable assets: ` +
                `${conflicts.join(', ')}. Missing immutable assets: ${missingImmutableAssets.join(', ')}. ` +
                'Resolve release assets manually before rerunning.'
              );
              return;
            }

            if (shouldSkipBuildAndUpload && !release.draft) {
              core.notice(
                `Release ${tag} already contains immutable assets (${conflicts.join(', ')}). ` +
                'Skipping build, notarization, and upload to preserve existing signed artifacts.'
              );
              core.setOutput('skip_all', 'true');
              core.setOutput('skip_upload', 'true');
              return;
            }

            if (shouldSkipBuildAndUpload) {
              // A failure between upload and publish left a complete staged
              // draft. A rebuild would produce different signed bytes, so never
              // rebuild: publish this draft by id and upload its own appcast to
              // R2. A published release stays a no-op, so a rerun never
              // republishes a release someone demoted.
              core.notice(
                `Release ${tag} is a staged draft (id ${release.id}) with every immutable asset ` +
                `(${conflicts.join(', ')}). Skipping build and upload; resuming publication from the draft.`
              );
              core.setOutput('skip_all', 'true');
              core.setOutput('skip_upload', 'true');
              core.setOutput('resume_release_id', String(release.id));
              core.setOutput('resume_assets', existingAssetNames.join(' '));
              core.setOutput('resume_asset_count', String(assets.length));
              return;
            }

            core.notice(`Release ${tag} exists but has no immutable release assets yet; continuing.`);

      - name: Select Xcode
        if: steps.guard_release_assets.outputs.skip_all != 'true'
        run: ./scripts/select-ci-xcode.sh

      # Same self-sufficiency as nightly: a self-hosted macOS runner may lack npm
      # on PATH, which breaks the pinned create-dmg install below. setup-node
      # guarantees node/npm regardless of which runner picks up the job.
      - name: Set up Node
        if: steps.guard_release_assets.outputs.skip_all != 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22.23.4"

      - name: Setup Bun
        if: steps.guard_release_assets.outputs.skip_all != 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"

      - name: Install build deps
        if: steps.guard_release_assets.outputs.skip_all != 'true'
        run: |
          ./scripts/install-rust-ci.sh
          CMUX_NODE_BIN="$(command -v node)"
          export npm_config_prefix="$RUNNER_TEMP/npm-global"
          mkdir -p "$npm_config_prefix"
          npm install --global "create-dmg@${CREATE_DMG_VERSION}"
          wrapper_dir="$RUNNER_TEMP/create-dmg-wrapper"
          mkdir -p "$wrapper_dir"
          cat > "$wrapper_dir/create-dmg" <<EOF
          #!/usr/bin/env bash
          exec "$CMUX_NODE_BIN" "$npm_config_prefix/lib/node_modules/create-dmg/cli.js" "\$@"
          EOF
          chmod +x "$wrapper_dir/create-dmg"
          echo "$wrapper_dir" >> "$GITHUB_PATH"

      - name: Build in-tree acpmux for the app bundle
        if: steps.guard_release_assets.outputs.skip_all != 'true'
        env:
          CMUX_NEXT_ACPMUX_ARCHS: arm64,x86_64
        run: |
          set -euo pipefail
          acpmux_bin="$RUNNER_TEMP/cmux-next-acpmux/acpmux"
          scripts/cmux-next/build-acpmux.sh --output "$acpmux_bin"
          echo "CMUX_NEXT_ACPMUX_BIN=$acpmux_bin" >> "$GITHUB_ENV"
          # The built-in full uBlock Origin must be in every release (bundle-ublock.sh).
          echo "CMUX_NEXT_REQUIRE_UBLOCK=1" >> "$GITHUB_ENV"

      - name: Download pre-built GhosttyKit.xcframework
        if: steps.guard_release_assets.outputs.skip_all != 'true'
        run: |
          ./scripts/download-prebuilt-ghosttykit.sh

      - name: Cache Swift packages
        if: steps.guard_release_assets.outputs.skip_all != 'true'
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .spm-cache
          key: spm-${{ hashFiles('cmux.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'scripts/ci/swiftpm-cache-layout') }}
          restore-keys: spm-

      - name: Sanitize Swift package cache
        if: steps.guard_release_assets.outputs.skip_all != 'true'
        run: python3 scripts/ci/sanitize-xcode-source-packages-cache.py .spm-cache

      - name: Derive Sparkle public key from private key
        if: steps.guard_release_assets.outputs.skip_all != 'true'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            echo "Missing SPARKLE_PRIVATE_KEY secret" >&2
            exit 1
          fi
          DERIVED_PUBLIC_KEY=$(
            printf '%s' "$SPARKLE_PRIVATE_KEY" |
              env -u SPARKLE_PRIVATE_KEY swift scripts/derive_sparkle_public_key.swift --stdin
          )
          echo "Derived Sparkle public key: $DERIVED_PUBLIC_KEY"
          echo "SPARKLE_PUBLIC_KEY=$DERIVED_PUBLIC_KEY" >> "$GITHUB_ENV"

      - name: Set up Go for the SSH daemon assets
        if: steps.guard_release_assets.outputs.skip_all != 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # The exact Go of the shipped cmuxd-remote (its go.mod `toolchain` line);
          # build_remote_daemon_release_assets.sh refuses any other.
          go-version-file: daemon/remote/go.mod
          cache: false

      # The Embed CEF phase embeds the pinned Chromium engine
      # (scripts/cmux-next/cef-manifest.json) from the ensure-cef cache. This
      # step fills the cache from the private R2 bucket with the read-only key
      # (the GitHub release with CMUX_CEF_READ_TOKEN is the fallback); only
      # this step gets the key. x86_64 Macs get the engine only when the
      # manifest has an x86_64 artifact. With no readable source the app ships the browser
      # as unavailable (warned below).
      - name: Fetch the Chromium engine
        if: steps.guard_release_assets.outputs.skip_all != 'true'
        env:
          CMUX_CEF_R2_ACCOUNT_ID: ${{ secrets.CMUX_CEF_R2_ACCOUNT_ID }}
          CMUX_CEF_R2_ACCESS_KEY_ID: ${{ secrets.CMUX_CEF_R2_ACCESS_KEY_ID }}
          CMUX_CEF_R2_SECRET_ACCESS_KEY: ${{ secrets.CMUX_CEF_R2_SECRET_ACCESS_KEY }}
          CMUX_CEF_R2_ENV_FILE: /dev/null
          GH_TOKEN: ${{ secrets.CMUX_CEF_READ_TOKEN }}
        # The x86_64 engine (a manifest "x86_64" object) lets a universal
        # build embed both slices (embed-cef.sh); without it this prints
        # nothing and the universal app keeps the arm64 engine.
        run: |
          scripts/cmux-next/ensure-cef.sh --optional
          scripts/cmux-next/ensure-cef.sh --optional --arch x86_64
          # The remote browser host the Embed remote browser host phase puts in
          # Contents/Helpers (phone browser tabs, arm64). From R2 with the same key;
          # unavailable, the app builds without it (the phase warns). A digest
          # mismatch fails here. The tailnet store is not reachable from runners.
          if [[ -x scripts/cmux-next/ensure-remote-browser-host.sh ]]; then
            CMUX_RB_HOST_NO_STORE=1 scripts/cmux-next/ensure-remote-browser-host.sh --optional >/dev/null
          fi

      # THIRD_PARTY_LICENSES.md for exactly what this release bundles: the
      # daemon, app host and Cloud server come from this commit's cmux-tui tree
      # (resolve-release-cmux-tui-client), so the notices do too, with exact
      # closures from `cargo tree` (build-acpmux.sh needs cargo on this runner).
      # The Release build copies the regenerated file; verify-app-bundle-licenses.sh
      # checks the signed bundle against scripts/cmux-next/notices/bundle-map.json.
      - name: Generate third-party notices (this commit's cmux-tui)
        if: steps.guard_release_assets.outputs.skip_all != 'true'
        env:
          CMUX_NOTICES_ALLOW_CARGO: "1"
          CMUX_NOTICES_CACHE: ${{ runner.temp }}/cmux-notices
        run: |
          ./scripts/cmux-next/generate-third-party-notices.sh --tui-source tree \
            --cargo-trees "$RUNNER_TEMP/cmux-notices-cargo-trees" --write-cargo-trees

      # The Bundle cmux-tui phase bundles none (deferred): "Install universal
      # Ghostty CLI helper" below installs this tree's universal cmux-tui client
      # (install-cmux-tui-client.sh); the phase never takes another build's client.
      - name: Build universal app (Release)
        if: steps.guard_release_assets.outputs.skip_all != 'true'
        run: |
          CMUX_NEXT_TUI_MODE=deferred CMUX_SKIP_ZIG_BUILD=1 xcodebuild -scheme cmux -configuration Release -derivedDataPath build-universal \
            -destination 'generic/platform=macOS' \
            -clonedSourcePackagesDirPath .spm-cache \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO build

      - name: Report the embedded Chromium engine
        if: steps.guard_release_assets.outputs.skip_all != 'true'
        run: |
          set -euo pipefail
          app="build-universal/Build/Products/Release/cmux.app"
          # An app built for the fleet benches keeps the debug.* commands; it never ships.
          ./scripts/cmux-next/check-no-bench-hooks.sh "$app"
          framework="$app/Contents/Frameworks/Chromium Embedded Framework.framework"
          if [[ -d "$framework" ]]; then
            echo "Chromium engine embedded: $(lipo -archs "$framework/Versions/A/Chromium Embedded Framework")"
            # Chromium's license notices must ship with the engine (not CEF's sample page).
            ./scripts/cmux-next/check-cef-credits.sh "$app"
          else
            echo "::warning title=No Chromium engine::The CEF artifact was not readable (secrets CMUX_CEF_R2_*); this release ships the browser as unavailable."
          fi

      - name: Build and embed verified SSH daemon assets
        if: steps.guard_release_assets.outputs.skip_all != 'true'
        run: |
          set -euo pipefail
          app="build-universal/Build/Products/Release/cmux.app"
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")"
          ./scripts/build_remote_daemon_release_assets.sh \
            --version "$version" --release-tag "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" --output-dir remote-daemon-assets
          # No --verify-cli here: the cmux-tui client is installed below (the
          # Bundle cmux-tui phase bundled none). "Verify signed app SSH daemon
          # contract" runs the bundled-CLI query on the signed app.
          python3 scripts/verify_remote_daemon_release.py \
            --manifest remote-daemon-assets/cmuxd-remote-manifest.json \
            --assets-dir remote-daemon-assets --app "$app" --embed

      - name: Attest SSH daemon release assets
        if: steps.guard_release_assets.outputs.skip_all != 'true'
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: remote-daemon-assets/cmuxd-remote-*

      - name: Download universal Ghostty CLI helper
        if: steps.guard_release_assets.outputs.skip_all != 'true'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: cmux-ghostty-cli-helper
          path: ghostty-cli-helper

      - name: Install universal Ghostty CLI helper
        if: steps.guard_release_assets.outputs.skip_all != 'true'
        env:
          # install-cmux-tui-client.sh verifies the manifest's build-provenance
          # attestation with gh before trusting it.
          GH_TOKEN: ${{ github.token }}
          CMUX_TUI_CLIENT_COMMIT: ${{ needs.resolve-release-cmux-tui-client.outputs.commit }}
          CMUX_TUI_CLIENT_KEY: ${{ needs.resolve-release-cmux-tui-client.outputs.key }}
        run: |
          set -euo pipefail
          ./scripts/install-prebuilt-ghostty-cli-helper.sh \
            ghostty-cli-helper/ghostty \
            build-universal/Build/Products/Release/cmux.app
          # A release bundles the universal client of its own commit's cmux-tui
          # tree (resolve-release-cmux-tui-client) or fails.
          cmux_tui_commit="$CMUX_TUI_CLIENT_COMMIT"
          [[ "$cmux_tui_commit" =~ ^[0-9a-f]{40}$ ]] || { echo "resolve-release-cmux-tui-client produced no commit" >&2; exit 1; }
          ./scripts/install-cmux-tui-client.sh \
            build-universal/Build/Products/Release/cmux.app \
            --manifest-url "https://files.cmux.com/cmux-tui/${cmux_tui_commit}/manifest.json" \
            --expected-commit "$cmux_tui_commit" \
            --require-capability wireguard-hub \
            --require-acpmux
          ./scripts/cmux-next/write-cmux-tui-version.sh \
            build-universal/Build/Products/Release/cmux.app "$cmux_tui_commit" "$CMUX_TUI_CLIENT_KEY"
          # The bundled daemon must serve every capability the app relies on.
          ./scripts/cmux-next/check-daemon-capabilities.sh \
            --static-only \
            --binary build-universal/Build/Products/Release/cmux.app/Contents/Resources/bin/cmux-tui

      - name: Verify binary architectures
        if: steps.guard_release_assets.outputs.skip_all != 'true'
        run: |
          set -euo pipefail
          APP_BINARY="build-universal/Build/Products/Release/cmux.app/Contents/MacOS/cmux"
          CLI_BINARY="build-universal/Build/Products/Release/cmux.app/Contents/Resources/bin/cmux"
          HELPER_BINARY="build-universal/Build/Products/Release/cmux.app/Contents/Resources/bin/ghostty"
          DIFF_SIDECAR="build-universal/Build/Products/Release/cmux.app/Contents/Resources/bin/cmux-diff-sidecar"
          APP_ARCHS="$(lipo -archs "$APP_BINARY")"
          CLI_ARCHS="$(lipo -archs "$CLI_BINARY")"
          HELPER_ARCHS="$(lipo -archs "$HELPER_BINARY")"
          SDK_VERSION="$(otool -l "$APP_BINARY" | awk '/LC_BUILD_VERSION/ { in_version=1; next } in_version && /sdk / { print $2; exit }')"
          echo "App binary architectures: $APP_ARCHS"
          echo "CLI binary architectures: $CLI_ARCHS"
          echo "Ghostty helper architectures: $HELPER_ARCHS"
          echo "App SDK version: $SDK_VERSION"
          [[ "$APP_ARCHS" == *arm64* && "$APP_ARCHS" == *x86_64* ]]
          [[ "$CLI_ARCHS" == *arm64* && "$CLI_ARCHS" == *x86_64* ]]
          [[ "$HELPER_ARCHS" == *arm64* && "$HELPER_ARCHS" == *x86_64* ]]
          # bin/cmux is the cmux-tui binary; cmux-tui and acpmux are symlinks to it.
          for alias in cmux-tui acpmux; do
            [[ "$(readlink "build-universal/Build/Products/Release/cmux.app/Contents/Resources/bin/$alias")" == cmux ]] || {
              echo "bin/$alias is not a symlink to cmux" >&2; exit 1; }
          done
          ./scripts/verify-diff-sidecar-artifact.sh "$DIFF_SIDECAR"
          [[ "$SDK_VERSION" == 26.* ]]

      - name: Verify bundled Ghostty theme picker helper
        if: steps.guard_release_assets.outputs.skip_all != 'true'
        run: |
          set -euo pipefail
          HELPER_BINARY="build-universal/Build/Products/Release/cmux.app/Contents/Resources/bin/ghostty"
          [ -x "$HELPER_BINARY" ] || { echo "Ghostty theme picker helper not found at $HELPER_BINARY" >&2; exit 1; }

      - name: Inject Sparkle keys into Info.plist
        if: steps.guard_release_assets.outputs.skip_all != 'true'
        run: |
          APP_PLIST="build-universal/Build/Products/Release/cmux.app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Delete :SUPublicEDKey" "$APP_PLIST" >/dev/null 2>&1 || true
          /usr/libexec/PlistBuddy -c "Delete :SUFeedURL" "$APP_PLIST" >/dev/null 2>&1 || true
          echo "Adding SUPublicEDKey to Info.plist..."
          /usr/libexec/PlistBuddy -c "Add :SUPublicEDKey string ${SPARKLE_PUBLIC_KEY}" "$APP_PLIST"
          echo "Adding SUFeedURL to Info.plist..."
          /usr/libexec/PlistBuddy -c "Add :SUFeedURL string https://github.com/manaflow-ai/cmux/releases/latest/download/appcast.xml" "$APP_PLIST"
          echo "Verifying:"
          /usr/libexec/PlistBuddy -c "Print :SUPublicEDKey" "$APP_PLIST"
          /usr/libexec/PlistBuddy -c "Print :SUFeedURL" "$APP_PLIST"

      - name: Embed release provisioning profile
        if: steps.guard_release_assets.outputs.skip_all != 'true'
        env:
          APPLE_RELEASE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_RELEASE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          if [ -z "$APPLE_RELEASE_PROVISIONING_PROFILE_BASE64" ]; then
            echo "Missing APPLE_RELEASE_PROVISIONING_PROFILE_BASE64 secret" >&2
            exit 1
          fi
          APP_PATH="build-universal/Build/Products/Release/cmux.app"
          PROFILE_PATH="$APP_PATH/Contents/embedded.provisionprofile"
          TMP_PROFILE="$(mktemp /tmp/cmux-release-profile.XXXXXX)"
          TMP_PLIST="$(mktemp /tmp/cmux-release-profile.XXXXXX.plist)"
          trap 'rm -f "$TMP_PROFILE" "$TMP_PLIST"' EXIT
          echo "$APPLE_RELEASE_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$TMP_PROFILE"
          security cms -D -i "$TMP_PROFILE" > "$TMP_PLIST"
          APP_ID="$(/usr/libexec/PlistBuddy -c "Print :Entitlements:com.apple.application-identifier" "$TMP_PLIST")"
          if [ "$APP_ID" != "7WLXT3NR37.com.cmuxterm.app" ]; then
            echo "Release provisioning profile targets unexpected app ID: $APP_ID" >&2
            exit 1
          fi
          WEBAUTHN_ENTITLEMENT="$(/usr/libexec/PlistBuddy -c "Print :Entitlements:com.apple.developer.web-browser.public-key-credential" "$TMP_PLIST")"
          if [ "$WEBAUTHN_ENTITLEMENT" != "true" ]; then
            echo "Release provisioning profile missing WebAuthn browser entitlement" >&2
            exit 1
          fi
          PROVISIONS_ALL_DEVICES="$(/usr/libexec/PlistBuddy -c "Print :ProvisionsAllDevices" "$TMP_PLIST")"
          if [ "$PROVISIONS_ALL_DEVICES" != "true" ]; then
            echo "Release provisioning profile is not a Developer ID all-devices profile" >&2
            exit 1
          fi
          cp "$TMP_PROFILE" "$PROFILE_PATH"

      - name: Strip release binaries
        if: steps.guard_release_assets.outputs.skip_all != 'true'
        run: ./scripts/strip-release-bundle.sh "build-universal/Build/Products/Release/cmux.app"

      # The signing keychain exists only while this job signs. The CLI and
      # helper checks above ran before it existed; it is deleted before the
      # static artifact checks below, and created again for notarization.
      # scripts/ci/signing-keychain.sh owns its lifetime.
      - name: Import signing cert
        if: steps.guard_release_assets.outputs.skip_all != 'true'
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: ./scripts/ci/signing-keychain.sh create

      - name: Codesign app
        if: steps.guard_release_assets.outputs.skip_all != 'true'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          if [ -z "$APPLE_SIGNING_IDENTITY" ]; then
            echo "Missing APPLE_SIGNING_IDENTITY secret" >&2
            exit 1
          fi
          APP_PATH="build-universal/Build/Products/Release/cmux.app"
          ./scripts/sign-cmux-bundle.sh \
            "$APP_PATH" \
            cmux.release.entitlements \
            "$APPLE_SIGNING_IDENTITY"

      - name: Delete signing keychain before runtime checks
        if: always()
        run: ./scripts/ci/signing-keychain.sh delete

      - name: Verify bundled Mach-O load commands
        if: steps.guard_release_assets.outputs.skip_all != 'true'
        run: ./scripts/verify-bundle-load-commands.sh "build-universal/Build/Products/Release/cmux.app"

      - name: Verify signed app SSH daemon contract
        if: steps.guard_release_assets.outputs.skip_all != 'true'
        run: |
          python3 scripts/verify_remote_daemon_release.py \
            --manifest remote-daemon-assets/cmuxd-remote-manifest.json \
            --assets-dir remote-daemon-assets \
            --app "build-universal/Build/Products/Release/cmux.app" --verify-cli

      # sign-cmux-bundle.sh ran only the static sidecar checks while the
      # keychain existed. Run the full check, with the handshake, now.
      - name: Verify signed diff sidecar runtime contract
        if: steps.guard_release_assets.outputs.skip_all != 'true'
        run: |
          set -euo pipefail
          app="build-universal/Build/Products/Release/cmux.app"
          ./scripts/verify-diff-sidecar-artifact.sh \
            "$app/Contents/Resources/bin/cmux-diff-sidecar" \
            --archs "$(lipo -archs "$app/Contents/MacOS/cmux")" \
            --require-signed


      # The helper re-seal and the DMG need the identity again. This step
      # deletes the keychain right after the DMG signature, before static
      # verification of the stapled artifact.
      - name: Import signing cert for notarization
        if: steps.guard_release_assets.outputs.skip_all != 'true'
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: ./scripts/ci/signing-keychain.sh create

      - name: Notarize app
        if: steps.guard_release_assets.outputs.skip_all != 'true'
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          # notarytool authenticates with the team App Store Connect API key.
          # The decoded key stays in a private temp dir removed on exit.
          NOTARY_TMP="$(mktemp -d "$RUNNER_TEMP/cmux-notary.XXXXXX")"
          trap 'rm -rf "$NOTARY_TMP"' EXIT
          source ./scripts/ci/lib/notary-auth.sh
          notary_auth_init "$NOTARY_TMP"
          APP_PATH="build-universal/Build/Products/Release/cmux.app"
          ZIP_SUBMIT="cmux-notary.zip"
          DMG_RELEASE="cmux-macos.dmg"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$ZIP_SUBMIT"
          APP_SUBMIT_JSON="$(xcrun notarytool submit "$ZIP_SUBMIT" "${NOTARY_AUTH_ARGS[@]}" --wait --output-format json)"
          APP_SUBMIT_ID="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])' <<<"$APP_SUBMIT_JSON")"
          APP_STATUS="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])' <<<"$APP_SUBMIT_JSON")"
          if [ "$APP_STATUS" != "Accepted" ]; then
            echo "App notarization failed with status: $APP_STATUS" >&2
            xcrun notarytool log "$APP_SUBMIT_ID" "${NOTARY_AUTH_ARGS[@]}" || true
            exit 1
          fi
          xcrun stapler staple "$APP_PATH"
          xcrun stapler validate "$APP_PATH"
          spctl -a -vv --type execute "$APP_PATH"
          rm -f "$ZIP_SUBMIT"
          # create-dmg generates a styled drag-to-install DMG
          create-dmg \
            --no-code-sign \
            "$APP_PATH" \
            ./
          # create-dmg emits an LZFSE (ULFO) image. Re-encode to LZMA (ULMO), as
          # nightly does: about a quarter smaller, and macOS 14+ mounts it.
          CREATED_DMGS=()
          while IFS= read -r -d '' dmg; do CREATED_DMGS+=("$dmg"); done \
            < <(find . -maxdepth 1 -name 'cmux*.dmg' ! -name "$DMG_RELEASE" -print0)
          if [ "${#CREATED_DMGS[@]}" -ne 1 ]; then
            echo "Expected exactly one create-dmg image, found ${#CREATED_DMGS[@]}" >&2
            exit 1
          fi
          CREATED_DMG="${CREATED_DMGS[0]}"
          hdiutil convert "$CREATED_DMG" -quiet -format ULMO -ov -o "$DMG_RELEASE"
          rm -f "$CREATED_DMG"
          DMG_FORMAT="$(hdiutil imageinfo "$DMG_RELEASE" | awk -F': *' '/^Format:/ {print $2; exit}')"
          if [ "$DMG_FORMAT" != "ULMO" ]; then
            echo "Expected ULMO (LZMA) DMG after conversion, got: ${DMG_FORMAT:-unknown}" >&2
            exit 1
          fi
          # The Apple waits above can pass the keychain's short idle lock.
          ./scripts/ci/signing-keychain.sh unlock
          /usr/bin/codesign --force --timestamp --keychain build.keychain \
            --sign "$APPLE_SIGNING_IDENTITY" \
            "$DMG_RELEASE"
          /usr/bin/codesign --verify --verbose=2 "$DMG_RELEASE"
          # That was the last signature for the universal app. Delete the
          # keychain before anything runs the stapled app.
          ./scripts/ci/signing-keychain.sh delete
          DMG_SUBMIT_JSON="$(xcrun notarytool submit "$DMG_RELEASE" "${NOTARY_AUTH_ARGS[@]}" --wait --output-format json)"
          DMG_SUBMIT_ID="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])' <<<"$DMG_SUBMIT_JSON")"
          DMG_STATUS="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])' <<<"$DMG_SUBMIT_JSON")"
          if [ "$DMG_STATUS" != "Accepted" ]; then
            echo "DMG notarization failed with status: $DMG_STATUS" >&2
            xcrun notarytool log "$DMG_SUBMIT_ID" "${NOTARY_AUTH_ARGS[@]}" || true
            exit 1
          fi
          xcrun stapler staple "$DMG_RELEASE"
          xcrun stapler validate "$DMG_RELEASE"
          # Apple is done with the universal app. Delete the decoded notary key,
          # then verify the exact stapled DMG without launching bundle code.
          notary_auth_forget "$NOTARY_TMP"
          ./scripts/ci/verify-dmg-artifact.sh "$DMG_RELEASE" stable --require-stapled-app

      - name: Gate distribution with syspolicy_check
        if: steps.guard_release_assets.outputs.skip_all != 'true'
        run: |
          set -euo pipefail
          syspolicy_check distribution "build-universal/Build/Products/Release/cmux.app"

      - name: Upload dSYMs to Sentry
        if: steps.guard_release_assets.outputs.skip_all != 'true'
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: manaflow
          SENTRY_PROJECT: cmuxterm-macos
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then
            echo "SENTRY_AUTH_TOKEN not set, skipping dSYM upload"
            exit 0
          fi
          SENTRY_CLI="$(./scripts/ensure-sentry-cli.sh)"
          "$SENTRY_CLI" debug-files upload --include-sources build-universal/Build/Products/Release/

      - name: Generate Sparkle appcast
        if: steps.guard_release_assets.outputs.skip_all != 'true'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            echo "Missing SPARKLE_PRIVATE_KEY secret" >&2
            exit 1
          fi
          # The item carries the bundle's macOS floor (14.0 for cmux-next since 2026-10-13). A
          # pinned final legacy item, when present, keeps macOS 14/15 on the
          # last legacy build (skills/cmux-release/references/cmux-next-update-floor.md).
          SPARKLE_MINIMUM_SYSTEM_VERSION="$(python3 scripts/ci/appcast_minimum_system_version.py floor build-universal/Build/Products/Release/cmux.app)"
          export SPARKLE_MINIMUM_SYSTEM_VERSION
          if [ -f scripts/cmux-next/legacy-appcast-item.xml ]; then
            export SPARKLE_LEGACY_APPCAST_ITEM_FILE=scripts/cmux-next/legacy-appcast-item.xml
          fi
          ./scripts/sparkle_generate_appcast.sh cmux-macos.dmg "$GITHUB_REF_NAME" appcast.xml
          # macOS /bin/bash 3.2 can report "unbound variable" from a script with
          # an EXIT trap and still exit 0; dry run 34227505375 (2026-09-08)
          # uploaded a DMG with no appcast that way. The feed must exist, carry
          # an EdDSA signature and point at this DMG before anything uploads it.
          test -s appcast.xml
          grep -q 'sparkle:edSignature' appcast.xml
          grep -q 'cmux-macos.dmg' appcast.xml
          grep -q "<sparkle:minimumSystemVersion>${SPARKLE_MINIMUM_SYSTEM_VERSION}</sparkle:minimumSystemVersion>" appcast.xml

      - name: Upload build artifacts (dry-run)
        if: steps.guard_release_assets.outputs.skip_upload != 'true' && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-release-dry-run
          retention-days: 7
          path: |
            cmux-macos.dmg
            appcast.xml
            remote-daemon-assets/cmuxd-remote-*
            docs/mdm/com.manaflow.cmux.*
            docs/mdm/cmux-example.mobileconfig
            docs/mdm/ddm-legacy-profile-declaration.json
            docs/mdm/managed-preferences.md
          if-no-files-found: error

      # The MDM schema for this release (enterprise P17-5): administrators fetch
      # https://github.com/manaflow-ai/cmux/releases/download/<tag>/com.manaflow.cmux.plist
      # (Jamf JSON, Intune plist, example profile, DDM declaration, key table) for the
      # exact version they deploy. ManagedPreferencesManifestTests keeps docs/mdm current.
      - name: Upload release asset
        id: upload_release
        if: steps.guard_release_assets.outputs.skip_upload != 'true' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/ci/publish-release-assets.py \
            --repo "$GITHUB_REPOSITORY" --tag "$GITHUB_REF_NAME" \
            --github-output "$GITHUB_OUTPUT" \
            --immutable cmux-macos.dmg \
            --immutable 'remote-daemon-assets/cmuxd-remote-*' \
            --immutable 'docs/mdm/com.manaflow.cmux.*' \
            --immutable docs/mdm/cmux-example.mobileconfig \
            --immutable docs/mdm/ddm-legacy-profile-declaration.json \
            --immutable docs/mdm/managed-preferences.md \
            --feed appcast.xml

      # GNU libintl is LGPL-2.1-or-later. GhosttyKit and the ghostty CLI helper
      # are built with -Di18n=false, so no shipped Mach-O may define a libintl
      # symbol unless this release carries gettext-0.24.tar.gz and COPYING.LIB.
      - name: Verify shipped libintl has its source
        if: steps.guard_release_assets.outputs.skip_upload != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          args=(build-universal/Build/Products/Release/cmux.app)
          if [ "${{ github.event_name }}" = "push" ] && [ "${GITHUB_REF#refs/tags/}" != "$GITHUB_REF" ]; then
            args+=(--release-repo "$GITHUB_REPOSITORY" --release-tag "$GITHUB_REF_NAME")
          fi
          python3 scripts/verify_app_libintl.py "${args[@]}"

      # Installs read releases/latest/download/appcast.xml, so only the
      # highest stable version may become latest. A backport tag (for
      # example v0.62.1 after v0.63.1) is published without taking it over.
      - name: Decide whether this release is latest
        id: latest_release
        if: (steps.guard_release_assets.outputs.skip_upload != 'true' || steps.guard_release_assets.outputs.resume_release_id != '') && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          published="$(gh release list --exclude-drafts --exclude-pre-releases --json tagName -q '.[].tagName')"
          highest="$(printf '%s\n%s\n' "$published" "$GITHUB_REF_NAME" | sed '/^$/d' | sort -V | tail -1)"
          if [ "$highest" = "$GITHUB_REF_NAME" ]; then
            echo "make_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "$GITHUB_REF_NAME is older than $highest; publishing without marking it latest"
            echo "make_latest=false" >> "$GITHUB_OUTPUT"
          fi

      # A rerun whose guard found a complete staged release builds nothing, so
      # take the appcast the R2 step uploads from that release itself. It was
      # signed for exactly the DMG on the release.
      - name: Download the staged appcast for a resumed release
        if: steps.guard_release_assets.outputs.resume_release_id != '' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          RESUME_RELEASE_ID: ${{ steps.guard_release_assets.outputs.resume_release_id }}
        run: |
          python3 scripts/ci/finalize-release.py download \
            --repo "$GITHUB_REPOSITORY" --tag "$GITHUB_REF_NAME" --release-id "$RESUME_RELEASE_ID" \
            --asset appcast.xml --dest .

      # Publish the exact release the upload step staged (or the guard found),
      # by id. A tag lookup cannot see drafts: softprops/action-gh-release made
      # a second release for v0.65.2 and published it with 0 assets while the
      # assets sat on the staged draft. finalize-release.py refuses any other
      # release for the tag and verifies the published release by tag.
      - name: Publish verified release
        if: (steps.guard_release_assets.outputs.skip_upload != 'true' || steps.guard_release_assets.outputs.resume_release_id != '') && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.upload_release.outputs.release_id || steps.guard_release_assets.outputs.resume_release_id }}
          UPLOADED_ASSETS: ${{ steps.upload_release.outputs.asset_names }}
          UPLOADED_COUNT: ${{ steps.upload_release.outputs.asset_count }}
          RESUME_ASSETS: ${{ steps.guard_release_assets.outputs.resume_assets }}
          RESUME_COUNT: ${{ steps.guard_release_assets.outputs.resume_asset_count }}
          MAKE_LATEST: ${{ steps.latest_release.outputs.make_latest }}
        run: |
          set -euo pipefail
          expect=()
          names=()
          if [ -n "$UPLOADED_ASSETS" ]; then
            read -ra names <<<"$UPLOADED_ASSETS"
            for name in "${names[@]}"; do expect+=(--expect-asset "$name"); done
            expect+=(--expect-count "$UPLOADED_COUNT")
          else
            # Resumed: everything on the release plus the MDM files the upload
            # step publishes, which the immutable-asset guard does not list.
            read -ra names <<<"$RESUME_ASSETS"
            for name in "${names[@]}"; do expect+=(--expect-asset "$name"); done
            expect+=(--expect-count "$RESUME_COUNT")
            for file in docs/mdm/com.manaflow.cmux.* docs/mdm/cmux-example.mobileconfig \
              docs/mdm/ddm-legacy-profile-declaration.json docs/mdm/managed-preferences.md; do
              expect+=(--expect-asset "$(basename "$file")")
            done
          fi
          python3 scripts/ci/finalize-release.py publish \
            --repo "$GITHUB_REPOSITORY" --tag "$GITHUB_REF_NAME" --release-id "$RELEASE_ID" \
            --generate-notes --prerelease false --make-latest "$MAKE_LATEST" "${expect[@]}"

      - name: Upload release appcast to R2
        if: (steps.guard_release_assets.outputs.skip_upload != 'true' || steps.guard_release_assets.outputs.resume_release_id != '') && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          AWS_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: "https://${{ secrets.CF_R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
        run: |
          set -euo pipefail

          # Guard: only upload if this tag is the highest semver release.
          # Prevents a backport tag (e.g. v0.62.1 after v0.63.1) from
          # overwriting the stable appcast with an older version.
          LATEST=$(gh release list --exclude-drafts --exclude-pre-releases \
            --json tagName -q '.[].tagName' | sort -V | tail -1)
          if [ -n "$LATEST" ] && [ "$LATEST" != "$GITHUB_REF_NAME" ]; then
            echo "Skipping R2 stable upload: $GITHUB_REF_NAME is not the latest release ($LATEST)"
            exit 0
          fi

          # Upload after GitHub Release publish so the appcast never references
          # a DMG that doesn't exist yet. R2 PutObject is atomic, so the appcast
          # is either the old version or the new one, never missing.
          python3 scripts/ci/upload-r2-object.py \
            --file appcast.xml \
            --endpoint-url "$R2_ENDPOINT" \
            --bucket cmux-binaries \
            --key stable/appcast.xml \
            --content-type "application/xml" \
            --cache-control "no-cache, no-store, must-revalidate"

          echo "R2 appcast upload complete: https://files.cmux.com/stable/appcast.xml"

      - name: Cleanup keychain
        if: always()
        run: |
          ./scripts/ci/signing-keychain.sh delete --keychain build.keychain \
            || security delete-keychain build.keychain >/dev/null 2>&1 || true
          rm -f /tmp/cert.p12

  build-sign-notarize-blacksmith:
    permissions: *build-sign-notarize-permissions
    environment: release
    needs: [build-ghostty-cli-helper, resolve-release-cmux-tui-client, pick-sign-runner, build-sign-notarize]
    # The same run signs on Blacksmith when the owned Mac took build-sign-notarize but its claim gate never passed
    # (glaeda refused the job, or a hook scripts/ci/glaeda-signing-hooks.txt does not list admitted it).
    if: "!cancelled() && github.run_attempt == 1 && needs.pick-sign-runner.outputs.owned != '' && needs.build-sign-notarize.result != 'skipped' && needs.build-sign-notarize.result != 'cancelled' && needs.build-sign-notarize.outputs.claim != 'owned'"
    # Blacksmith only: this run's sign when the owned Mac refused the job (its claim gate).
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || github.run_attempt > 1 && needs.pick-sign-runner.outputs.alternate || needs.pick-sign-runner.outputs.runner || 'blacksmith-6vcpu-macos-26' }}
    timeout-minutes: 100
    outputs: *build-sign-notarize-outputs
    steps: *build-sign-notarize-steps
