name: Release macOS app trigger

# This workflow is an unprivileged event source only. The protected-main
# `Release macOS app` workflow_run dispatcher performs all release work after
# it revalidates this exact file and the tag commit.
on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  announce:
    runs-on: ubuntu-24.04 # github-hosted-required: unprivileged tag observer
    permissions: {}
    timeout-minutes: 2
    steps:
      - name: Emit queued release event
        run: |
          set -euo pipefail
          echo "Tag event queued for trusted protected-main release dispatcher: ${GITHUB_REF_NAME}"
