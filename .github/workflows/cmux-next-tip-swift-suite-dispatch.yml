name: cmux NEXT tip suite dispatcher (Swift, daemon)

# A feat-cmux-next push skips the CmuxNext Swift suite (push CI is the app
# build only), so a Swift suite red on the base stayed invisible: the
# CmuxNextAppTests run had ended mid-way with status 0 for over a day
# (2026-10-21), and newTabMenuListsTheKindsFirst sat red on the base until
# #25854. Every 30 minutes this may ask cmux-next.yml for one tip_swift_suite
# run on the feat-cmux-next tip (only the Swift tier, every target). Its
# "cmux-next swift test" check run on the tip commit is the visible base
# signal, and scripts/ci/base_red_excuse.py reads it. The plan
# (scripts/ci/tip_swift_suite_plan.js) batches it:
#   - one run at a time, at most one per tick: a run in flight, or one created
#     in the last 25 minutes, skips the tick;
#   - a tip with a swift-test verdict (pass or fail) is not run again; a run
#     with no verdict (runner lost, setup failed, cancelled) is retried on the
#     next tick, at most three runs per tip;
#   - a new tip runs only when the diff since the last green tip suite (else
#     the newest red one) reaches swift-test, by cmux-next's own router
#     (scripts/ci/cmux_next_route.py on the tip), or when there is no such run
#     or it is not an ancestor. Every verdict comes from the swift-test job.
#
# The daemon suite does the same for daemon-test (2026-10-30: a feat-cmux-next push never runs it,
# so the base had no "cmux-next daemon tests" verdict for hours and no pull request's daemon red
# could be compared with it, #27692): a tip_daemon_suite run, routed on the router's daemon tier,
# and also once the tip is 20 landings past its last verdict, so the base log stays fresh. Each
# suite is its own matrix leg and keeps its own cadence.
# Each tick is one short job per suite; nothing waits or loops. Scheduled workflows run
# only from the default branch, hence this file on main.
on:
  schedule:
    - cron: "11,41 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: cmux-next-tip-swift-suite-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    if: github.repository == 'manaflow-ai/cmux'
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    permissions:
      actions: write
      contents: read
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        suite: [swift, daemon]
    steps:
      - name: Checkout the plan
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: scripts/ci/tip_swift_suite_plan.js
          sparse-checkout-cone-mode: false

      - name: Plan this tick
        id: plan
        env:
          SUITE: ${{ matrix.suite }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { plan } = require(`${process.env.GITHUB_WORKSPACE}/scripts/ci/tip_swift_suite_plan.js`);
            const p = await plan({ github, context, suite: process.env.SUITE });
            core.notice(`${p.action}: ${p.reason} (tip ${p.tip})`);
            core.setOutput('action', p.action);
            core.setOutput('tip', p.tip);
            core.setOutput('base', p.base);

      # Only the router's inputs: its scripts, the package manifests, the target
      # graph and the test sources it looks suites up in. Blobs come on demand.
      - name: Checkout the tip's router
        if: steps.plan.outputs.action == 'route'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ steps.plan.outputs.tip }}
          path: tip
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            scripts/ci
            scripts/cmux-next
            Packages

      - name: Does the change since the last tested base reach swift-test?
        id: route
        if: steps.plan.outputs.action == 'route'
        env:
          TIP: ${{ steps.plan.outputs.tip }}
          BASE: ${{ steps.plan.outputs.base }}
          SUITE: ${{ matrix.suite }}
        run: |
          set -euo pipefail
          [[ "$TIP" =~ ^[0-9a-f]{40}$ && "$BASE" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::bad tip or base sha"; exit 1; }
          git -C tip fetch --no-tags --filter=blob:none --depth=1 origin "$BASE"
          git -C tip diff --no-renames --name-only "$BASE" "$TIP" > "$RUNNER_TEMP/changed.txt"
          [[ "$SUITE" == swift || "$SUITE" == daemon ]] || { echo "::error::unknown suite $SUITE"; exit 1; }
          reached=false
          if [ -s "$RUNNER_TEMP/changed.txt" ]; then
            # The router as a pull request with this diff would see it: swift=true when the
            # diff reaches a Swift test target or the swift test job's own inputs; daemon=true
            # when it reaches the live-daemon suites.
            python3 tip/scripts/ci/cmux_next_route.py --root tip --event pull_request \
              --changed-files "$RUNNER_TEMP/changed.txt" --summary "$GITHUB_STEP_SUMMARY" > "$RUNNER_TEMP/route.txt"
            reached="$(sed -n "s/^${SUITE}=//p" "$RUNNER_TEMP/route.txt")"
          fi
          echo "Since ${BASE:0:11}: $(wc -l < "$RUNNER_TEMP/changed.txt" | tr -d ' ') files changed; $SUITE tier reached: $reached" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "reached=$reached" >> "$GITHUB_OUTPUT"

      - name: Dispatch the tip's suite
        if: steps.plan.outputs.action == 'dispatch' || steps.route.outputs.reached == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TIP: ${{ steps.plan.outputs.tip }}
          SUITE: ${{ matrix.suite }}
        with:
          script: |
            const { dispatch } = require(`${process.env.GITHUB_WORKSPACE}/scripts/ci/tip_swift_suite_plan.js`);
            if (await dispatch({ github, context, suite: process.env.SUITE, core })) {
              core.notice(`Requested the ${process.env.SUITE} suite on feat-cmux-next ${process.env.TIP}`);
            }
