name: cmux-tui release binaries

# Builds and verifies the cmux-tui distribution artifacts once. A coordinated
# stable release can then dispatch the npm and PyPI publishers with this run's
# artifact ID, avoiding identical rebuilds in each registry workflow.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "TUI package version to build, for example 0.1.0"
        required: true
        type: string
      include_windows:
        description: "Include experimental Windows packages (requires registry publisher setup)"
        required: true
        default: false
        type: boolean
      publish_npm:
        description: "Publish the verified npm artifacts after the build"
        required: true
        default: false
        type: boolean
      publish_pypi:
        description: "Publish the verified PyPI artifacts after the build"
        required: true
        default: false
        type: boolean
      confirm_tui_cmux:
        description: "Set true only for the coordinated npm cmux TUI publish"
        required: true
        default: false
        type: boolean
  push:
    tags:
      - "cmux-tui-v*"

permissions: {}

concurrency:
  group: cmux-tui-release-${{ github.ref }}
  # A stable build/publish run must finish before a recovery dispatch starts;
  # cancelling it can strand an immutable tag with only partial registries.
  cancel-in-progress: false

jobs:
  version:
    name: derive package version
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Derive package version
        id: version
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
          PUBLISH_NPM: ${{ inputs.publish_npm }}
          CONFIRM_TUI_CMUX: ${{ inputs.confirm_tui_cmux }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE:-}" != "tag" ]]; then
            echo "Stable artifacts require a cmux-tui-vX.Y.Z tag ref." >&2
            exit 1
          fi
          [[ "$GITHUB_REF_NAME" =~ ^cmux-tui-v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "tag must match cmux-tui-vX.Y.Z" >&2
            exit 1
          }
          version="${GITHUB_REF_NAME#cmux-tui-v}"
          if [[ -n "$DISPATCH_VERSION" && "$DISPATCH_VERSION" != "$version" ]]; then
            echo "workflow_dispatch version $DISPATCH_VERSION does not match tag version $version" >&2
            exit 1
          fi

          if [[ "$PUBLISH_NPM" == "true" && "$CONFIRM_TUI_CMUX" != "true" ]]; then
            echo "npm publishing requires confirm_tui_cmux=true." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build-package:
    needs: version
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/cmux-tui-build-package.yml
    with:
      version: ${{ needs.version.outputs.version }}
      package_npm: true
      package_pypi: true
      include_windows: ${{ inputs.include_windows == true }}
      attest_packages: true
      # The Cloudflare Worker is deployed separately and is not shipped in
      # these native packages. Keep its tests in its own verification lane.

  dispatch-publishers:
    name: dispatch verified artifacts to registries
    if: ${{ inputs.publish_npm || inputs.publish_pypi }}
    needs: build-package
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    permissions:
      actions: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
      VERSION: ${{ inputs.version }}
      ARTIFACT_RUN_ID: ${{ github.run_id }}
      SOURCE_SHA: ${{ github.sha }}
      PUBLISH_NPM: ${{ inputs.publish_npm }}
      PUBLISH_PYPI: ${{ inputs.publish_pypi }}
    steps:
      - name: Dispatch registry publishers
        run: |
          set -euo pipefail
          # NEVER wait for the publisher's conclusion here: each publisher's
          # validate-version step waits for THIS run to conclude successfully,
          # so a dispatcher that watches the publisher deadlocks the release
          # (both sides wait on each other; the publisher's shorter timeout
          # loses). Broke 0.13.0; the publishers self-guard with their own
          # validation + gated environments, and this run's summary links the
          # runs. return_run_details makes each dispatch answer with the run it
          # created, so nothing polls the run list for it.
          dispatch_publisher() {
            local workflow="$1"
            local label="$2"
            shift 2
            local run_id
            run_id="$(gh api -X POST "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/dispatches" \
              -f ref="$TAG" "$@" -F return_run_details=true --jq '.workflow_run_id // ""')"
            run_id="${run_id//[[:space:]]/}"
            if [[ ! "$run_id" =~ ^[0-9]+$ ]]; then
              # The run id only decorates this run's summary. The publisher was
              # dispatched and validates itself, so failing here turns a
              # completed dispatch into a red run -- and each publisher rejects
              # an artifact run whose conclusion is not success, which makes a
              # fully built, verified, attested release permanently
              # unpublishable through this path. Warn and finish instead.
              echo "::warning::$label publisher was dispatched but the dispatch named no run; it should appear in the Actions list for $workflow" >&2
              echo "- $label publisher dispatched (run id not returned)" >> "$GITHUB_STEP_SUMMARY"
              return 0
            fi
            echo "$label publisher run dispatched: $run_id"
            echo "- $label publisher run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$run_id" >> "$GITHUB_STEP_SUMMARY"
          }
          {
            echo "### Registry publishing"
            echo
            echo "- Verified artifact run: $ARTIFACT_RUN_ID"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$PUBLISH_NPM" == "true" ]]; then
            dispatch_publisher tui-publish-npm.yml "npm" \
              -f "inputs[version]=$VERSION" \
              -f "inputs[artifact_run_id]=$ARTIFACT_RUN_ID" \
              -f "inputs[confirm_tui_cmux]=true"
          fi
          if [[ "$PUBLISH_PYPI" == "true" ]]; then
            dispatch_publisher tui-publish-pypi.yml "PyPI" \
              -f "inputs[version]=$VERSION" \
              -f "inputs[artifact_run_id]=$ARTIFACT_RUN_ID"
          fi
