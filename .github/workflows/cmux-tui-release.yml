name: cmux-tui release binaries

# Builds and verifies the cmux-tui distribution artifacts once. A coordinated
# stable release can then dispatch the npm and PyPI publishers with this run's
# artifact ID, avoiding identical rebuilds in each registry workflow.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "TUI package version to build, for example 0.1.0"
        required: true
        type: string
      publish_npm:
        description: "Publish the verified npm artifacts after the build"
        required: true
        default: false
        type: boolean
      publish_pypi:
        description: "Publish the verified PyPI artifacts after the build"
        required: true
        default: false
        type: boolean
      confirm_tui_cmux:
        description: "Set true only for the coordinated cmux TUI registry publish"
        required: true
        default: false
        type: boolean
  push:
    tags:
      - "cmux-tui-v*"

permissions: {}

concurrency:
  group: cmux-tui-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: derive package version
    runs-on: ${{ vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Derive package version
        id: version
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
          PUBLISH_NPM: ${{ inputs.publish_npm }}
          PUBLISH_PYPI: ${{ inputs.publish_pypi }}
          CONFIRM_TUI_CMUX: ${{ inputs.confirm_tui_cmux }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE:-}" != "tag" ]]; then
            echo "Stable artifacts require a cmux-tui-vX.Y.Z tag ref." >&2
            exit 1
          fi
          [[ "$GITHUB_REF_NAME" =~ ^cmux-tui-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo "tag must match cmux-tui-vX.Y.Z" >&2
            exit 1
          }
          version="${GITHUB_REF_NAME#cmux-tui-v}"
          if [[ -n "$DISPATCH_VERSION" && "$DISPATCH_VERSION" != "$version" ]]; then
            echo "workflow_dispatch version $DISPATCH_VERSION does not match tag version $version" >&2
            exit 1
          fi

          if [[ "$PUBLISH_NPM" == "true" && "$CONFIRM_TUI_CMUX" != "true" ]]; then
            echo "npm publishing requires confirm_tui_cmux=true." >&2
            exit 1
          fi
          if [[ "$PUBLISH_PYPI" == "true" && "$CONFIRM_TUI_CMUX" != "true" ]]; then
            echo "PyPI publishing requires confirm_tui_cmux=true." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build-package:
    needs: version
    permissions:
      contents: read
    uses: ./.github/workflows/cmux-tui-build-package.yml
    with:
      version: ${{ needs.version.outputs.version }}
      package_npm: true
      package_pypi: true
      include_windows: true

  dispatch-publishers:
    name: dispatch verified artifacts to registries
    if: ${{ inputs.publish_npm || inputs.publish_pypi }}
    needs: build-package
    runs-on: ${{ vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    # npm and PyPI waits are sequential, each bounded to 90 minutes.
    timeout-minutes: 210
    permissions:
      actions: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
      VERSION: ${{ inputs.version }}
      ARTIFACT_RUN_ID: ${{ github.run_id }}
      PUBLISH_NPM: ${{ inputs.publish_npm }}
      PUBLISH_PYPI: ${{ inputs.publish_pypi }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Dispatch registry publishers
        run: |
          set -euo pipefail
          npm_run_id=""
          pypi_run_id=""
          npm_dispatched=false
          pypi_dispatched=false
          dispatch_failure=0
          npm_conclusion="not-dispatched"
          pypi_conclusion="not-dispatched"
          extract_run_id() {
            local output="$1"
            local run_url
            run_url="$(
              printf '%s\n' "$output" |
                grep -Eo 'https://github\.com/[^[:space:]]+/actions/runs/[0-9]+' |
                tail -n 1 || true
            )"
            [[ "$run_url" =~ /actions/runs/[0-9]+$ ]] || return 1
            printf '%s\n' "${run_url##*/}"
          }

          if [[ "$PUBLISH_NPM" == "true" ]]; then
            if npm_dispatch_output="$(
              gh workflow run tui-publish-npm.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG" \
                -f version="$VERSION" \
                -f artifact_run_id="$ARTIFACT_RUN_ID" \
                -f confirm_tui_cmux=true 2>&1
            )"; then
              if npm_run_id="$(extract_run_id "$npm_dispatch_output")"; then
                npm_dispatched=true
              else
                echo "npm publisher dispatch did not return a run URL; refusing to guess" >&2
                dispatch_failure=1
                npm_conclusion=dispatch-failure
              fi
            else
              printf '%s\n' "$npm_dispatch_output" >&2
              echo "npm publisher dispatch failed; continuing to reconcile any other dispatched publisher." >&2
              dispatch_failure=1
              npm_conclusion=dispatch-failure
            fi
          fi
          if [[ "$PUBLISH_PYPI" == "true" ]]; then
            if pypi_dispatch_output="$(
              gh workflow run tui-publish-pypi.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG" \
                -f version="$VERSION" \
                -f artifact_run_id="$ARTIFACT_RUN_ID" \
                -f confirm_tui_cmux=true 2>&1
            )"; then
              if pypi_run_id="$(extract_run_id "$pypi_dispatch_output")"; then
                pypi_dispatched=true
              else
                echo "PyPI publisher dispatch did not return a run URL; refusing to guess" >&2
                dispatch_failure=1
                pypi_conclusion=dispatch-failure
              fi
            else
              printf '%s\n' "$pypi_dispatch_output" >&2
              echo "PyPI publisher dispatch failed; continuing to reconcile any other dispatched publisher." >&2
              dispatch_failure=1
              pypi_conclusion=dispatch-failure
            fi
          fi

          publisher_failure=0
          if [[ "$npm_dispatched" == "true" ]]; then
            if npm_result="$(
              WAIT_TIMEOUT_SECONDS=5400 bash .github/scripts/wait-for-workflow-run.sh \
                tui-publish-npm.yml "$TAG" "$GITHUB_SHA" \
                "$npm_run_id"
            )"; then
              IFS=$'\t' read -r _ npm_conclusion <<<"$npm_result"
            else
              publisher_failure=1
              npm_conclusion=failure
            fi
          fi
          if [[ "$pypi_dispatched" == "true" ]]; then
            if pypi_result="$(
              WAIT_TIMEOUT_SECONDS=5400 bash .github/scripts/wait-for-workflow-run.sh \
                tui-publish-pypi.yml "$TAG" "$GITHUB_SHA" \
                "$pypi_run_id"
            )"; then
              IFS=$'\t' read -r _ pypi_conclusion <<<"$pypi_result"
            else
              publisher_failure=1
              pypi_conclusion=failure
            fi
          fi
          {
            echo "### Registry publishing"
            echo
            echo "- Verified artifacts: ready"
            if [[ "$PUBLISH_NPM" == "true" ]]; then
              echo "- npm publisher: $npm_conclusion"
            fi
            if [[ "$PUBLISH_PYPI" == "true" ]]; then
              echo "- PyPI publisher: $pypi_conclusion"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          (( dispatch_failure == 0 && publisher_failure == 0 )) || exit 1
