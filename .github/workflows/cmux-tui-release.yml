name: cmux-tui release binaries

# Builds and verifies the cmux-tui distribution artifacts once. A coordinated
# stable release can then dispatch the npm and PyPI publishers with this run's
# artifact ID, avoiding identical rebuilds in each registry workflow.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "TUI package version to build, for example 0.1.0"
        required: true
        type: string
      publish_npm:
        description: "Publish the verified npm artifacts after the build"
        required: true
        default: false
        type: boolean
      publish_pypi:
        description: "Publish the verified PyPI artifacts after the build"
        required: true
        default: false
        type: boolean
      confirm_tui_cmux:
        description: "Set true only for the coordinated npm cmux TUI publish"
        required: true
        default: false
        type: boolean
  push:
    tags:
      - "cmux-tui-v*"

permissions: {}

concurrency:
  group: cmux-tui-release-${{ github.ref }}
  # A stable build/publish run must finish before a recovery dispatch starts;
  # cancelling it can strand an immutable tag with only partial registries.
  cancel-in-progress: false

jobs:
  version:
    name: derive package version
    runs-on: ${{ vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Derive package version
        id: version
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
          PUBLISH_NPM: ${{ inputs.publish_npm }}
          CONFIRM_TUI_CMUX: ${{ inputs.confirm_tui_cmux }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE:-}" != "tag" ]]; then
            echo "Stable artifacts require a cmux-tui-vX.Y.Z tag ref." >&2
            exit 1
          fi
          [[ "$GITHUB_REF_NAME" =~ ^cmux-tui-v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "tag must match cmux-tui-vX.Y.Z" >&2
            exit 1
          }
          version="${GITHUB_REF_NAME#cmux-tui-v}"
          if [[ -n "$DISPATCH_VERSION" && "$DISPATCH_VERSION" != "$version" ]]; then
            echo "workflow_dispatch version $DISPATCH_VERSION does not match tag version $version" >&2
            exit 1
          fi

          if [[ "$PUBLISH_NPM" == "true" && "$CONFIRM_TUI_CMUX" != "true" ]]; then
            echo "npm publishing requires confirm_tui_cmux=true." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build-package:
    needs: version
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/cmux-tui-build-package.yml
    with:
      version: ${{ needs.version.outputs.version }}
      package_npm: true
      package_pypi: true
      include_windows: true
      attest_packages: true

  dispatch-publishers:
    name: dispatch verified artifacts to registries
    if: ${{ inputs.publish_npm || inputs.publish_pypi }}
    needs: build-package
    runs-on: ${{ vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    permissions:
      actions: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
      VERSION: ${{ inputs.version }}
      ARTIFACT_RUN_ID: ${{ github.run_id }}
      SOURCE_SHA: ${{ github.sha }}
      PUBLISH_NPM: ${{ inputs.publish_npm }}
      PUBLISH_PYPI: ${{ inputs.publish_pypi }}
    steps:
      - name: Dispatch registry publishers
        run: |
          set -euo pipefail
          started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # Discovery only — NEVER wait for the publisher's conclusion here:
          # each publisher's validate-version step waits for THIS run to
          # conclude successfully, so a dispatcher that watches the
          # publisher deadlocks the release (both sides poll each other;
          # the publisher's shorter timeout loses). Broke 0.13.0; the
          # publishers self-guard with their own validation + gated
          # environments, and this run's summary links the runs.
          record_publisher() {
            local workflow="$1"
            local label="$2"
            local run_id=""
            local delay=2
            local discovery_deadline=$((SECONDS + 300))
            while (( SECONDS < discovery_deadline )); do
              run_id="$(
                gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" \
                  --event workflow_dispatch --limit 50 --json databaseId,headSha,headBranch,status,conclusion,createdAt \
                  --jq '.[] | select(.headBranch == env.TAG and .headSha == env.SOURCE_SHA and .createdAt >= env.STARTED_AT) | .databaseId' \
                  | head -n 1
              )"
              run_id="${run_id//[[:space:]]/}"
              if [[ -n "$run_id" ]]; then
                break
              fi
              sleep "$delay"
              (( delay = delay < 30 ? delay * 2 : 30 ))
            done
            if [[ -z "$run_id" ]]; then
              echo "$label publisher run was not visible after dispatch" >&2
              return 1
            fi
            echo "$label publisher run dispatched: $run_id"
            echo "- $label publisher run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$run_id" >> "$GITHUB_STEP_SUMMARY"
          }
          export TAG SOURCE_SHA STARTED_AT="$started_at"

          if [[ "$PUBLISH_NPM" == "true" ]]; then
            gh workflow run tui-publish-npm.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG" \
              -f version="$VERSION" \
              -f artifact_run_id="$ARTIFACT_RUN_ID" \
              -f confirm_tui_cmux=true
          fi
          if [[ "$PUBLISH_PYPI" == "true" ]]; then
            gh workflow run tui-publish-pypi.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG" \
              -f version="$VERSION" \
              -f artifact_run_id="$ARTIFACT_RUN_ID"
          fi
          {
            echo "### Registry publishing"
            echo
            echo "- Verified artifact run: $ARTIFACT_RUN_ID"
            if [[ "$PUBLISH_NPM" == "true" ]]; then
              echo "- Dispatched npm publisher"
            fi
            if [[ "$PUBLISH_PYPI" == "true" ]]; then
              echo "- Dispatched PyPI publisher"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$PUBLISH_NPM" == "true" ]]; then
            record_publisher tui-publish-npm.yml "npm"
          fi
          if [[ "$PUBLISH_PYPI" == "true" ]]; then
            record_publisher tui-publish-pypi.yml "PyPI"
          fi
