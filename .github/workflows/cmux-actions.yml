# CI for cmux Actions (workers/cmux-actions), the GitHub Actions engine
# experiment (beads cx-0uj). Runs the typecheck and the Vitest suites,
# including the fixture tests that parse and plan every workflow in this
# directory. No deploy job: nothing is deployed before the intake slice.

name: cmux Actions

on:
  pull_request:
    paths:
      - workers/cmux-actions/**
      - .github/workflows/**
      - .github/actions/**
  push:
    branches: [main, feat-cmux-next]
    paths:
      - workers/cmux-actions/**
      - .github/workflows/**
      - .github/actions/**
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-4vcpu-ubuntu-2404' || vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: workers/cmux-actions
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
      # Until bun.lock is committed, install resolves it here and uploads it,
      # and the last step fails so an unpinned install never passes.
      - id: install
        run: |
          if [ -f bun.lock ]; then
            bun install --frozen-lockfile
          else
            bun install
            echo "generated=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload the resolved lockfile
        if: ${{ steps.install.outputs.generated == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-actions-bun-lock
          path: workers/cmux-actions/bun.lock
          retention-days: 3
      - name: Typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run typecheck
      - name: Tests (expressions, matrix, every workflow fixture)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run test
      - name: Require a committed lockfile
        if: ${{ steps.install.outputs.generated == 'true' }}
        run: |
          echo "::error::commit workers/cmux-actions/bun.lock (artifact cmux-actions-bun-lock)"
          exit 1
