# CI for cmux Actions (workers/cmux-actions), the GitHub Actions engine
# experiment (beads cx-0uj). Runs the typecheck and the Vitest suites,
# including the fixture tests that parse and plan every workflow in this
# directory. No deploy job: nothing is deployed before the intake slice.

name: cmux Actions

# On demand only (2026-11-20): an experiment that deploys nothing, untouched since 2026-11-02,
# and red on every run of the last day while its .github/workflows/** filter started it on about
# 345 pull requests a day. Run it by hand when the worker changes:
#   gh workflow run cmux-actions.yml --repo manaflow-ai/cmux --ref <branch>
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Temporary REST budget attribution: one gh-call line per GitHub API call (scripts/ci/api_call_log/env.sh, fetched at a fixed commit when the checkout has no copy).
  BASH_ENV: '$({ w="${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh"; t="${RUNNER_TEMP:-/nonexistent}/api-call-log-src"; if [ -f "$w" ]; then echo "$w"; elif [ -n "${RUNNER_TEMP:-}" ]; then if [ ! -f "$t/env.sh" ] && [ ! -e "$t.tried" ] && { [ "${RUNNER_OS:-}" = Linux ] || [ "${RUNNER_OS:-}" = macOS ]; } && [ "$(date -u +%Y%m%d%H)" -lt 2026112300 ]; then : > "$t.tried"; mkdir -p "$t.part" && for x in env.sh gh sitecustomize.py isolated.py; do curl -fsSL --max-time 5 -o "$t.part/$x" "https://raw.githubusercontent.com/manaflow-ai/cmux/27647ffd3ae838c63be28ca3e5883dcd68c34518/scripts/ci/api_call_log/$x" || break; done; [ -s "$t.part/isolated.py" ] && mv "$t.part" "$t"; fi; if [ -f "$t/env.sh" ]; then echo "$t/env.sh"; else echo unset BASH_ENV > "$t.off.sh" && echo "$t.off.sh"; fi; fi; } 2>/dev/null)'

jobs:
  check:
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && (vars.CI_FORK_LINUX_RUNNER || 'ubuntu-24.04') || 'cmux-linux' }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: workers/cmux-actions
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
          no-cache: ${{ !startsWith(github.workspace, '/home/runner/work/') }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
      - name: Cache Bun package cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.bun/install/cache
          key: bun-cmux-actions-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('workers/cmux-actions/bun.lock') }}
          restore-keys: |
            bun-cmux-actions-${{ runner.os }}-${{ runner.arch }}-
      # Until bun.lock is committed, install resolves it here and uploads it,
      # and the last step fails so an unpinned install never passes.
      - id: install
        run: |
          if [ -f bun.lock ]; then
            bash "$GITHUB_WORKSPACE/scripts/ci/bun-install.sh" --frozen-lockfile
          else
            bash "$GITHUB_WORKSPACE/scripts/ci/bun-install.sh" --
            echo "generated=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload the resolved lockfile
        if: ${{ steps.install.outputs.generated == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-actions-bun-lock
          path: workers/cmux-actions/bun.lock
          retention-days: 3
      - name: Typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run typecheck
      - name: Tests (expressions, matrix, every workflow fixture)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run test
      - name: Require a committed lockfile
        if: ${{ steps.install.outputs.generated == 'true' }}
        run: |
          echo "::error::commit workers/cmux-actions/bun.lock (artifact cmux-actions-bun-lock)"
          exit 1
