name: fleet compile-check
# The guard reads this title: it binds the run to the one sha it compiled.
run-name: fleet compile-check ${{ inputs.sha }}

# Compile-check the app at one exact commit on the build fleet and post the
# verdict as the commit status fleet/compile-check on that commit.
# What a pass proves, and what the status text says: the app executable's Swift
# sources (86 of CmuxNext's 88 production targets) compile against the macOS
# SDK and link, in Debug, with the swift.org toolchain; and, at the same time
# on a fleet Mac, the test targets the change can break compile in Debug
# (`package-test-lane.sh compile-tests MERGE_BASE`: the CmuxNext test targets
# that depend on a changed target in the SwiftPM target graph, and the macOS
# package lane's packages whose sources or path dependencies changed,
# scripts/ci/compile_test_plan.py). The app executable links no test target,
# so #23360 (a throwing call in #expect without try) and #23163 (a fake that
# missed a protocol requirement) passed the app check and broke the base's
# test build. The test targets compile on a Mac because the Linux pool's SDK
# has no Testing module. The merge base is feat-cmux-next's, read from
# GitHub's compare API. Neither is the Xcode
# Release compile: that build uses Apple's compiler and the optimizer, and can
# fail where this passes. So a red Release compile always wins here, and the
# Release compile still runs on the base after the merge.
# scripts/ci/merge_compile_guard.py accepts a success here in place of a
# queued "cmux-next Release compile (Xcode 26)" (#22845 sat queued over an
# hour after its fleet pass, with 60 minis offline). It trusts the status only
# when it links a finished, green run of this file dispatched from
# feat-cmux-next (its commit on that branch) and titled with the full sha; a
# status a token posts itself, or a run of a copy of this file on another
# branch or a tag, does not count. It never overrides a red Release compile.
#
#   gh workflow run fleet-compile-check.yml --ref feat-cmux-next -f sha=<full head sha>

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full 40-character commit sha to compile-check (a pull request's head)
        required: true
        type: string

permissions: {}

concurrency:
  group: fleet-compile-check-${{ inputs.sha }}
  cancel-in-progress: false

jobs:
  compile-check:
    name: fleet compile-check
    if: ${{ github.repository_owner == 'manaflow-ai' && github.ref == 'refs/heads/feat-cmux-next' && vars.CI_COMPILE_CHECK_GATEWAY != '' }}
    # The literal fallbacks never schedule: the job's if: skips outside manaflow-ai and when the variable is unset.
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.CI_COMPILE_CHECK_GATEWAY || 'blacksmith-4vcpu-ubuntu-2404' }}
    permissions:
      statuses: write
      contents: read  # the compare API: the head's merge base with feat-cmux-next
    timeout-minutes: 50  # the client waits up to 600 + 1200 s plus its own slack; the posts up to 2 x 30 s and 6 x 30 s, plus backoff (155 s, or up to 5 x 120 s when GitHub sends Retry-After)
    steps:
      # The gateway checks nothing out: the fleet fetches the commit itself.
      # Each check exits 0 for a pass, 1 for a compile failure, anything else
      # for no verdict; only two passes post success, and the run fails
      # whenever it is not a pass.
      - name: Compile-check the app and its test targets on the build fleet and post fleet/compile-check
        env:
          SHA: ${{ inputs.sha }}
          CONTEXT: fleet/compile-check
          GH_TOKEN: ${{ github.token }}
          API: ${{ github.api_url }}/repos/${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          if ! [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error title=fleet compile-check::sha must be a full 40-character lowercase commit sha, got '$SHA'"
            exit 1
          fi
          # Every value is fixed text, the checked sha, the runner name or GitHub's run URL: none needs JSON escaping.
          # GitHub answers 403 (a secondary rate limit on content creation, as 09:34-09:38Z on 2026-10-21 when every
          # run here failed before cmux-ci started), 429 or 5xx under load: retry with backoff, honoring
          # Retry-After, and print what GitHub said. Any other 4xx, and a 403 that is not a rate limit, is final; a
          # status posted twice is harmless (the newest wins). Only the final post decides the step.
          # Each try gives up after 30 s, so a connection GitHub never answers is retried, not waited on until the job times out.
          post() {
            local body code wait attempt tries="${3:-6}"
            body="$(printf '{"state":"%s","description":"%s","target_url":"%s","context":"%s"}' \
              "$1" "$2" "$RUN_URL" "$CONTEXT")"
            for ((attempt = 1; attempt <= tries; attempt++)); do
              : > "$RUNNER_TEMP/status-response"
              code="$(curl -sS --connect-timeout 10 --max-time 30 -o "$RUNNER_TEMP/status-response" -D "$RUNNER_TEMP/status-headers" -w '%{http_code}' \
                -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
                "$API/statuses/$SHA" -d "$body")" || code=000
              case "$code" in
                2??) return 0 ;;
                429|5??|000) ;;
                403) grep -qi 'rate limit' "$RUNNER_TEMP/status-response" || grep -qi '^retry-after:' "$RUNNER_TEMP/status-headers" || break ;;
                *) break ;;
              esac
              [ "$attempt" -ge "$tries" ] && break
              wait="$(sed -n 's/^[Rr]etry-[Aa]fter: *\([0-9]*\).*/\1/p' "$RUNNER_TEMP/status-headers" 2>/dev/null | head -n 1)"
              wait="${wait:-$((5 * 2 ** (attempt - 1)))}"
              [ "$wait" -gt 120 ] && wait=120
              echo "fleet/compile-check $1 post: HTTP $code (try $attempt); retrying in ${wait}s: $(head -c 300 "$RUNNER_TEMP/status-response" 2>/dev/null)"
              sleep "$wait"
            done
            echo "::warning title=fleet compile-check::could not post $CONTEXT=$1 (HTTP $code): $(head -c 300 "$RUNNER_TEMP/status-response" 2>/dev/null)"
            return 1
          }
          # The verdict is in the run's summary and log whatever the status post does; a status that could not be
          # posted fails the run, so a reader of the run never takes a missing status for a pass.
          verdict() {
            echo "fleet compile-check verdict for $SHA: $1 ($2)"
            echo "### fleet compile-check: $1 for \`$SHA\`"$'\n\n'"$2" >> "$GITHUB_STEP_SUMMARY"
            post "$1" "$2" || { echo "::error title=fleet compile-check::the verdict is $1, but $CONTEXT could not be posted"; return 1; }
          }
          # A gateway without the client has no verdict; it must never post "did not compile" (cmux17, run 39573725240).
          client="${CMUX_CI_CLIENT:-$HOME/.local/bin/cmux-ci}"
          if ! [[ -x "$client" ]]; then
            echo "::error title=fleet compile-check::$client is not installed on runner $RUNNER_NAME"
            verdict error "No build-fleet verdict: cmux-ci is not installed on runner $RUNNER_NAME"
            exit 2
          fi
          # pending is informational: two tries, and a failed post never stops the compile.
          post pending "Compiling the app executable and the test targets the change reaches on the build fleet" 2 || true
          # The test targets a change can break are those it reaches from its merge base with feat-cmux-next.
          merge_base=""
          if compare="$(curl -fsS --retry 3 --connect-timeout 10 --max-time 60 \
              -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "$API/compare/feat-cmux-next...$SHA?per_page=1")"; then
            merge_base="$(python3 -c 'import json, sys; print(json.load(sys.stdin)["merge_base_commit"]["sha"])' <<< "$compare" 2>/dev/null || true)"
          fi
          app_log="$RUNNER_TEMP/app-compile.log" tests_log="$RUNNER_TEMP/test-compile.log"
          # The app on the Linux pool and the test targets on a Mac, at the same time.
          app_status=0
          "$client" compile-check --ref "$SHA" --app \
            --timeout 1200 --queue-timeout 600 > "$app_log" 2>&1 &
          app_pid=$!
          tests_status=0
          if [[ "$merge_base" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Merge base with feat-cmux-next: $merge_base"
            "$client" run --class light --script scripts/ci/package-test-lane.sh --ref "$SHA" \
              --arg=compile-tests --arg="$merge_base" \
              --timeout 1500 --queue-timeout 600 > "$tests_log" 2>&1 || tests_status=$?
          else
            echo "No merge base with feat-cmux-next for $SHA" > "$tests_log"
            tests_status=69
          fi
          wait "$app_pid" || app_status=$?
          echo "::group::app executable (exit $app_status)"; cat "$app_log"; echo "::endgroup::"
          echo "::group::test targets (exit $tests_status)"; cat "$tests_log"; echo "::endgroup::"
          # Exit 1 is a compile failure only after the lane says so; a head whose
          # package-test-lane.sh predates compile-tests refuses the phase (exit 2).
          case "$tests_status" in
            0) tests=pass ;;
            1) grep -q '^compile-tests: a test target did not compile' "$tests_log" && tests=fail || tests=none ;;
            *) grep -q 'unknown argument compile-tests' "$tests_log" && tests=old || tests=none ;;
          esac
          case "$app_status" in
            0) app=pass ;;
            1) app=fail ;;
            *) app=none ;;
          esac
          echo "app executable: $app (exit $app_status); test targets: $tests (exit $tests_status)"
          if [[ "$app" == fail && "$tests" == fail ]]; then
            verdict failure "Neither the app executable nor a test target the change reaches compiled (Debug, build fleet)"; exit 1
          elif [[ "$app" == fail ]]; then
            verdict failure "The app executable did not compile (Debug, swift.org toolchain, build fleet)"; exit 1
          elif [[ "$tests" == fail ]]; then
            verdict failure "A test target the change reaches did not compile (Debug, build fleet Mac)"; exit 1
          elif [[ "$app" == none ]]; then
            verdict error "No build-fleet verdict on the app executable (exit $app_status)"; exit 2
          elif [[ "$tests" == old ]]; then
            verdict error "No test-target verdict: this head predates compile-tests; merge feat-cmux-next and dispatch again"; exit 2
          elif [[ "$tests" == none ]]; then
            verdict error "No build-fleet verdict on the test targets (exit $tests_status)"; exit 2
          fi
          verdict success "App executable and the test targets the change reaches compiled (Debug, build fleet); not the Xcode Release compile" || exit 1
