name: fixit-handoff

# A feat-cmux-next type check that fixit-compile could not fix (no machine fix) is reverted, not left for a fix
# agent. Leo, 2026-11-22: "should've been caught and fixed faster. hell, maybe even should've been automatic." and
# "if the fix is clear i think you guys should be able to unilaterally push commits directly." The nightly's webview
# checks and the post-merge batch's web suite dispatch this on feat-cmux-next when fixit-compile left a red
# (scripts/ci/oops/fixit_handoff.py signal). `find` (read-only) names the first red commit after the last green and
# checks its revert on the tip; `land` (the routing App's token) pushes that revert to the branch when it is clear
# and not a teammate's, else opens the revert's own pull request for next-autoland. vars.FIXIT_HANDOFF: 0 turns it
# off, `pr` never pushes the branch directly.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: "The commit whose type check was red (empty: the branch tip)."
        type: string
        default: ""
      check:
        description: "Which type check (webviews or web)."
        type: choice
        options: [webviews, web]
        default: webviews
      origin:
        description: "The run that found the red."
        type: string
        default: ""

permissions: {}

concurrency:
  # One hand-off at a time; a second red while one runs queues (the tip check makes it a no-op once fixed).
  group: fixit-handoff-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  find:
    if: ${{ vars.FIXIT_HANDOFF != '0' && github.ref_name == 'feat-cmux-next' }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || 'cmux-linux' }}
    # About 15 type checks at most (a bisect over up to 64 commits, the tip, the revert), each an install and a check.
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      culprit: ${{ steps.find.outputs.culprit }}
      good: ${{ steps.find.outputs.good }}
      tip: ${{ steps.find.outputs.tip }}
      clear: ${{ steps.find.outputs.clear }}
      verified: ${{ steps.find.outputs.verified }}
      reason: ${{ steps.find.outputs.reason }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.22.1"
      - name: Find the culprit and check its revert
        id: find
        env:
          RED: ${{ inputs.sha }}
          CHECK: ${{ inputs.check }}
          FIXIT_HANDOFF: ${{ vars.FIXIT_HANDOFF }}
        run: python3 -I scripts/ci/oops/fixit_handoff.py find --red "$RED" --check "$CHECK"

  land:
    needs: find
    if: ${{ vars.FIXIT_HANDOFF != '0' && github.ref_name == 'feat-cmux-next' && needs.find.outputs.culprit != '' }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || 'cmux-linux' }}
    timeout-minutes: 15
    environment: ci-routing-agent
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          ref: ${{ needs.find.outputs.tip }}
          fetch-depth: 0
          filter: blob:none
      # As cmux-next-post-merge.yml's revert job: reads on the route App's own budget.
      - name: Mint the read token
        id: read-token
        if: vars.GLAEDA_ROUTE_APP_ID != ''
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.GLAEDA_ROUTE_APP_ID }}
          private-key: ${{ secrets.GLAEDA_ROUTE_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-actions: read
          permission-contents: read
      # The revert's push (to the branch, or to its revert/pr-N branch) and its pull request: the routing App's token,
      # so the push and the pull request start CI. workflows write: a branch based on feat-cmux-next differs from
      # main in its workflow files (post_merge_batch.push_token).
      - name: Mint the revert token
        id: app-token
        timeout-minutes: 1
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.GLAEDA_ROUTE_APP_ID }}
          private-key: ${{ secrets.GLAEDA_ROUTE_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
      - name: Push the revert, or open its pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_READ_TOKEN: ${{ steps.read-token.outputs.token }}
          PUSH_TOKEN: ${{ steps.app-token.outputs.token }}
          FIXIT_HANDOFF: ${{ vars.FIXIT_HANDOFF }}
          CHECK: ${{ inputs.check }}
          CULPRIT: ${{ needs.find.outputs.culprit }}
          TIP: ${{ needs.find.outputs.tip }}
          GOOD: ${{ needs.find.outputs.good }}
          CLEAR: ${{ needs.find.outputs.clear }}
          VERIFIED: ${{ needs.find.outputs.verified }}
          REASON: ${{ needs.find.outputs.reason }}
          ORIGIN: ${{ inputs.origin }}
        run: |
          python3 -I scripts/ci/oops/fixit_handoff.py land --check "$CHECK" --culprit "$CULPRIT" --tip "$TIP" \
            --good "$GOOD" --clear "$CLEAR" --verified "$VERIFIED" --reason "$REASON" --origin "$ORIGIN" \
            --push-url "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
