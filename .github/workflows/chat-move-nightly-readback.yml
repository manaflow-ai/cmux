name: Chat move Nightly readback

# A chat moved between Local, Cloud and AutoCloud by the CLI, every direction, timed and read back, in a published
# cmux NEXT NIGHTLY (scripts/measure/chat-move-nightly-readback.sh). As cloud-mvp-nightly-readback.yml does, this job
# only drives the build fleet: it fetches the controller's client (.github/actions/fleet-client) and sends the script
# to a fleet display Mac with `--sign-in agent`. No fleet Mac holds the agent account: the client reads the
# production agent Stack pair from this job's environment (cmux-next-cloud-journey, limited to feat-cmux-next by
# GitHub's branch policy), signs in on this runner, seals the session to the leasing worker's key and revokes it
# when the step ends. Nothing secret is printed or uploaded.
# Leo, 2026-11-25 (ask-af0e3bf355): "cli stuff/agents being able to toggle to and from and whatever autocloud and
# such".
#   gh workflow run chat-move-nightly-readback.yml --ref feat-cmux-next -f build=4612541169301

on:
  push:
    branches: [feat-cmux-next]
    paths:
      - .github/workflows/chat-move-nightly-readback.yml
  workflow_dispatch:
    inputs:
      build:
        description: "NIGHTLY build number (CFBundleVersion) to check; empty = the newest in the NEXT feed"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: chat-move-nightly-readback-${{ inputs.build || github.run_id }}
  cancel-in-progress: false

jobs:
  # The job id ends in -fleet: the gateway runner hook (glaeda scripts/glaeda-cmux-runner-hook) takes a home-repo
  # job on mac-gateway only as a thin cmux-ci client, named so; as `readback`, run 46199736166 was refused at set-up.
  readback-fleet:
    if: github.ref == 'refs/heads/feat-cmux-next' && github.repository == 'manaflow-ai/cmux' && vars.CI_EVAL_STEP_GATEWAY != ''
    environment:
      name: cmux-next-cloud-journey
      deployment: false
    # An owned Mac: the fleet controller answers only on the tailnet, and no owned Linux runner reached it (the
    # client fetch timed out in runs 46037691304 and 46039141923 here, and in each chief-evals fleet job on
    # 2026-11-27; #60707 met the same on the Swift fast tier). The job only submits the step and waits, on the
    # same label as every other fleet driver (chief-evals, rivals-nightly, nightly-pr-build): mac-gateway, a tailnet
    # Mac. Not cmux-mac with vars.CI_OVERFLOW_MAC: on 2026-11-28 the overflow sent run 46197818945 to
    # blacksmith-6vcpu-macos-26, which has no route to the controller, after runs 46194667200 and 46195913072 sat
    # on cmux-mac until "not acquired by Runner". Back to cmux-linux once that pool reaches the controller.
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || 'mac-gateway' }} # frozen-label: CI_EVAL_STEP_GATEWAY (cmux#54437)
    # The display queue waits hours when busy (run 46102219213: source bundling 24 min, then 87 measurements
    # ahead; p90 of the exclusive class 517-764 min over 24 h). A 25-min queue wait cancelled every readback
    # before its turn, so the job waits up to 3 h for a display Mac, plus the step's 40 min.
    timeout-minutes: 230
    steps:
      # Only the client action is checked out here. The display worker checks out this commit and runs the
      # script from it.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          sparse-checkout: .github/actions/fleet-client

      - uses: ./.github/actions/fleet-client
        with:
          controller: ${{ vars.CMUX_FLEET_CONTROLLER }}

      - name: Move a chat every way in the NIGHTLY on a display Mac
        id: readback
        env:
          BUILD: ${{ inputs.build }}
          REF_SHA: ${{ github.sha }}
          # The client's `--sign-in agent` account, and the Stack project a NIGHTLY signs in to (production;
          # scripts/cmux-next/dev-signin-token.py BACKENDS; a publishable key is public).
          CMUX_UITEST_STACK_EMAIL: ${{ secrets.CMUX_DOGFOOD_STACK_EMAIL }}
          CMUX_UITEST_STACK_PASSWORD: ${{ secrets.CMUX_DOGFOOD_STACK_PASSWORD }}
          CMUX_SIGNIN_STACK_PROJECT: 9790718f-14cd-4f7e-824d-eaf527a82b82
          CMUX_SIGNIN_STACK_CLIENT_KEY: pck_kzj80gx4mh2jrzn1cx6y5e8jk0kwa01vkevh2p9zd4twr
        run: |
          set -uo pipefail
          if [ -n "$BUILD" ] && ! printf '%s' "$BUILD" | grep -Eqx '[0-9]{1,20}'; then
            echo "::error::build must be a NIGHTLY build number (digits only)"
            exit 1
          fi
          if [ -z "$CMUX_UITEST_STACK_EMAIL" ] || [ -z "$CMUX_UITEST_STACK_PASSWORD" ]; then
            echo "::error::the production agent Stack pair is missing from this job's environment"
            exit 1
          fi
          client="${CMUX_CI_CLIENT:-$HOME/.local/bin/cmux-ci}"
          if ! [[ -x "$client" ]]; then
            echo "::error::$client is not installed on runner $RUNNER_NAME; nothing was read back."
            exit 1
          fi
          out="$RUNNER_TEMP/chat-move-nightly-readback"
          mkdir -p "$out"
          args=()
          if [ -n "$BUILD" ]; then args+=("--arg=build=$BUILD"); fi
          # A dispatched readback is a Leo ask's receipt: the exclusive display queue's p90 wait (517-764 min,
          # line ~45) outlasts the 3 h queue wait, so runs 46145802408 and 46163427711 never started (exit 75).
          # --urgent takes the urgent display hold after 5 min (hq docs/handbook/urgent-step-waits-behind-a-hold.md).
          # Push runs (this file changed) stay ordinary.
          if [ "${GITHUB_EVENT_NAME:-}" = workflow_dispatch ]; then
            args+=(--urgent --reason "chat move NIGHTLY readback: a Leo ask receipt, dispatched by $GITHUB_ACTOR")
          fi
          status=0
          "$client" run --class exclusive --display --sign-in agent \
            --script scripts/measure/chat-move-nightly-readback.sh --ref "$REF_SHA" --repo manaflow-ai/cmux \
            --key "chat-move-readback-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" "${args[@]}" \
            --artifact .build/chat-move-nightly-readback/report.tgz \
            --timeout 2400 --queue-timeout 10800 2>&1 | tee "$out/step.log" || status=${PIPESTATUS[0]}
          step="$(grep -o -E 'step [0-9a-f]{24}' "$out/step.log" | head -1 | cut -d' ' -f2 || true)"
          if [[ "$status" == 75 && -n "$step" ]]; then
            # Not started within the queue wait: the step stays queued after the client stops waiting.
            "$client" cancel "$step" --reason "chat move readback: no display Mac within 3 h" || true
          fi
          if [[ -n "$step" ]]; then
            "$client" artifact "$step" "$out/report.tgz" || "$client" artifact --failed "$step" "$out/report.tgz" || true
          fi
          echo "fleet step ${step:-none} exited $status; report: $([[ -s "$out/report.tgz" ]] && echo returned || echo none)"
          grep -E '^(CMV |CHAT_MOVE_READBACK )' "$out/step.log" >> "$GITHUB_STEP_SUMMARY" || true
          # No step id means the controller never took the step (a refusal, no route): that is the rig, whatever the
          # client's exit code. Run 46086119436 reported a refused step (HTTP 400) as a product failure.
          if [[ -z "$step" && "$status" != 0 ]]; then
            echo "::error::Chat move readback: the fleet took no step (client exit $status); the rig could not run it"
            exit 3
          fi
          case "$status" in
            0) echo "Chat move readback passed (build ${BUILD:-newest})" >> "$GITHUB_STEP_SUMMARY" ;;
            1) echo "::error::Chat move readback: a product step failed (exit 1)" ;;
            75) echo "::error::Chat move readback: still queued for a display Mac after 3 h (exit 75); nothing ran, so this is no product result" ;;
            *) echo "::error::Chat move readback: the rig could not run it (exit $status)" ;;
          esac
          exit "$status"

      - name: Upload the report (result.json and every answer)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chat-move-nightly-readback
          path: ${{ runner.temp }}/chat-move-nightly-readback
          if-no-files-found: warn
          retention-days: 14
