name: cmux-next web performance

# Staged policy: manual runs only. Activation needs the trusted validator, budget and a
# measured baseline on feat-cmux-next, and a trigger whose workflow comes from the base
# (workflow_run), not pull_request, whose workflow file the PR itself supplies. Pending
# baselines still fail validation. See webviews/test/latency/ACTIVATION.md.
on:
  workflow_dispatch:
    inputs:
      head_sha:
        description: "full commit SHA to measure (manual runs only)"
        required: false
        type: string
      base_sha:
        description: "full current target base SHA containing trusted policy"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: cmux-next-web-perf-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  HEAD_SHA: ${{ github.event.pull_request.head.sha || inputs.head_sha || github.sha }}
  BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.base_sha || github.sha }}
  PR_NUMBER: ${{ github.event.pull_request.number || '' }}

jobs:
  measure:
    name: Linux Chromium measurement
    runs-on: ${{ vars.CI_BLACKSMITH_OFF == '1' && contains(toJSON(github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-4vcpu-ubuntu-2404' || fromJSON(vars.RUNNER_POOLS).linux_16)), '"blacksmith-') && (github.event.pull_request && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || 'cmux-fleet-linux-x64') || (github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-4vcpu-ubuntu-2404' || fromJSON(vars.RUNNER_POOLS).linux_16)) }}
    timeout-minutes: 40
    outputs:
      harness_status: ${{ steps.measure.outputs.harness_status }}
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || inputs.head_sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      - name: Verify exact head and fetch base identity
        run: |
          set -euo pipefail
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 2
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 2
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          git fetch --no-tags --depth=1 origin "$BASE_SHA"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.22.1"

      - name: Cache Bun package cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.bun/install/cache
          key: bun-web-perf-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('webviews/bun.lock') }}

      - name: Install webviews dependencies
        working-directory: webviews
        run: bun install --frozen-lockfile

      - name: Cache Playwright apt packages
        uses: ./.github/actions/playwright-apt-cache
        with:
          engines: chromium

      - name: Install system Chrome
        working-directory: webviews
        run: |
          "$(git rev-parse --show-toplevel)/scripts/ci/ensure-system-chrome.sh"

      - name: Measure with the target base's harness
        run: |
          set -euo pipefail
          # The candidate's app is what gets measured; the harness that drives it, times it and writes the
          # results is the target base's, checked out last, after every candidate setup step, so a harness
          # edit in the PR can't be what reports its numbers. This guards against drift, not a hostile PR:
          # under pull_request the PR supplies this workflow file itself (see ACTIVATION.md). A base with
          # no harness yet has nothing to measure with: fail closed.
          git cat-file -e "$BASE_SHA:webviews/scripts/latency/run.ts" || {
            echo "target base $BASE_SHA has no latency harness to measure with" >&2
            exit 1
          }
          rm -rf webviews/scripts/latency webviews/test/latency
          git checkout "$BASE_SHA" -- webviews/scripts/latency webviews/test/latency

      - name: Measure exact head
        id: measure
        working-directory: webviews
        env:
          CMUX_LATENCY_HARNESS_SHA: ${{ env.BASE_SHA }}
        run: |
          set +e
          bun scripts/latency/run.ts --ci --no-fail --engine chromium --pages "chat flows,chat 3000 paged,chat 3000 resident,chat rail" --runs 10 --base "$BASE_SHA" \
            --trace-dir "$RUNNER_TEMP/web-perf-traces" \
            --json "$RUNNER_TEMP/web-perf-results.json" --require longTasks,reactCommits,cpu
          status=$?
          echo "harness_status=$status" >> "$GITHUB_OUTPUT"
          # Preserve failure evidence for the separate trusted validation job.
          exit 0

      - name: Upload measurement data only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-perf-measurement-${{ github.run_id }}-${{ env.HEAD_SHA }}
          path: |
            ${{ runner.temp }}/web-perf-results.json
            ${{ runner.temp }}/web-perf-traces
          if-no-files-found: warn
          retention-days: 3

  validate:
    name: Linux Chromium performance gate
    needs: measure
    if: ${{ always() }}
    # A fresh cloud runner is a trust boundary. Do not route this job onto a
    # persistent worker where candidate processes or tools could survive: linux_4
    # is the pool of ephemeral Blacksmith sizes kept for exactly that.
    runs-on: ${{ vars.CI_BLACKSMITH_OFF == '1' && contains(toJSON(github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-4vcpu-ubuntu-2404' || fromJSON(vars.RUNNER_POOLS).linux_4)), '"blacksmith-') && (github.event.pull_request && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || 'cmux-fleet-linux-x64') || (github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-4vcpu-ubuntu-2404' || fromJSON(vars.RUNNER_POOLS).linux_4)) }}
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      HARNESS_STATUS: ${{ needs.measure.outputs.harness_status }}
    defaults:
      run:
        working-directory: trusted
    steps:
      - name: Checkout exact trusted target base
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.base.sha || inputs.base_sha || github.sha }}
          path: trusted
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      - name: Verify trusted source and preserve policy
        run: |
          set -euo pipefail
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 2
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 2
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          mkdir -p "$RUNNER_TEMP/web-perf-validation"
          cp webviews/test/latency/baseline.json "$RUNNER_TEMP/web-perf-validation/baseline.json"
          cp webviews/test/latency/budget.json "$RUNNER_TEMP/web-perf-validation/budget.json"

      - name: Setup trusted Bun runtime
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"

      - name: Download measurement artifact as data
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: web-perf-measurement-${{ github.run_id }}-${{ env.HEAD_SHA }}
          path: ${{ runner.temp }}/web-perf-evidence

      - name: Validate data with trusted base policy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          bun webviews/scripts/latency/validate.ts \
            --results "$RUNNER_TEMP/web-perf-evidence/web-perf-results.json" \
            --trace-dir "$RUNNER_TEMP/web-perf-evidence/web-perf-traces" \
            --baseline webviews/test/latency/baseline.json \
            --budget webviews/test/latency/budget.json \
            --expected-head "$HEAD_SHA" --expected-base "$BASE_SHA" --require-base-harness --pr "$PR_NUMBER" \
            --report "$RUNNER_TEMP/web-perf-validation/report.md"
          status=$?
          test "$HARNESS_STATUS" = 0 || { echo "Chromium harness failed or did not finish" >&2; exit 1; }
          exit "$status"

      - name: Upload trusted verdict and policy
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-perf-validation-${{ github.run_id }}-${{ env.HEAD_SHA }}
          path: ${{ runner.temp }}/web-perf-validation
          if-no-files-found: warn
          retention-days: 3
