name: cmux-next web performance

# Mandatory Linux Chromium evidence for every feat-cmux-next pull request. The
# harness is production-only; this gate compares the PR head with a baseline
# captured at the exact base SHA. No native perf cron or GUI benchmark is used.
on:
  pull_request:
    branches: [feat-cmux-next]
    paths:
      - webviews/**
      - .github/workflows/cmux-next-web-perf.yml
  workflow_dispatch:
    inputs:
      head_sha:
        description: "full commit SHA to measure (manual runs only)"
        required: false
        type: string
      base_sha:
        description: "full base SHA paired with the checked-in baseline"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: cmux-next-web-perf-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  chromium-perf:
    name: Linux Chromium performance gate
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-4vcpu-ubuntu-2404' || !startsWith(vars.LINUX_RUNNER, 'blacksmith-') && vars.LINUX_RUNNER || vars.CI_CLOUD_OVERFLOW_SAVED && 'blacksmith-16vcpu-ubuntu-2404' || 'blacksmith-32vcpu-ubuntu-2404' }}
    timeout-minutes: 40
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha || inputs.head_sha || github.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.base_sha || github.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number || '' }}
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || inputs.head_sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      - name: Verify exact head and base inputs
        run: |
          set -euo pipefail
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "HEAD_SHA must be a full lowercase SHA" >&2; exit 2; }
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "BASE_SHA must be a full lowercase SHA" >&2; exit 2; }
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.22.1"

      - name: Cache Bun package cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.bun/install/cache
          key: bun-web-perf-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('webviews/bun.lock') }}

      - name: Install webviews dependencies
        working-directory: webviews
        run: bun install --frozen-lockfile

      - name: Cache Playwright apt packages
        uses: ./.github/actions/playwright-apt-cache
        with:
          engines: chromium

      - name: Install headless Chromium
        working-directory: webviews
        run: ./node_modules/.bin/playwright install --with-deps --only-shell chromium

      - name: Fetch exact base and trusted baseline
        run: |
          set -euo pipefail
          # Fetch the commit only; the harness never installs/builds a second tree.
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          if git cat-file -e "$BASE_SHA:webviews/test/latency/baseline.json"; then
            git show "$BASE_SHA:webviews/test/latency/baseline.json" > "$RUNNER_TEMP/web-perf-baseline.json"
          else
            printf '%s\n' '{"schemaVersion":1,"status":"pending","reason":"baseline file is absent; capture the first hosted Linux Chromium run","source":null,"results":{}}' > "$RUNNER_TEMP/web-perf-baseline.json"
          fi
          if git cat-file -e "$BASE_SHA:webviews/test/latency/budget.json"; then
            git show "$BASE_SHA:webviews/test/latency/budget.json" > "$RUNNER_TEMP/web-perf-budget.json"
          else
            # The budget is policy (50 ms p95), not a measured baseline. Keep
            # the first PR report actionable while the policy file lands.
            cp webviews/test/latency/budget.json "$RUNNER_TEMP/web-perf-budget.json"
          fi

      - name: Measure exact head
        id: measure
        working-directory: webviews
        run: |
          set +e
          bun scripts/latency/run.ts --ci --engine chromium --runs 10 --base "$BASE_SHA" \
            --json "$RUNNER_TEMP/web-perf-results.json" --require longTasks,reactCommits,cpu
          status=$?
          echo "harness_status=$status" >> "$GITHUB_OUTPUT"
          # The validator and artifact steps must still publish the failure evidence.
          exit 0

      - name: Verify trusted baseline artifacts
        if: always()
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/web-perf-baseline.json"
          test -s "$RUNNER_TEMP/web-perf-budget.json"

      - name: Validate evidence and write PR report
        if: always()
        run: |
          set -euo pipefail
          bun webviews/scripts/latency/validate.ts \
            --results "$RUNNER_TEMP/web-perf-results.json" \
            --baseline "$RUNNER_TEMP/web-perf-baseline.json" \
            --budget "$RUNNER_TEMP/web-perf-budget.json" \
            --expected-head "$HEAD_SHA" --pr "$PR_NUMBER" \
            --report "$RUNNER_TEMP/web-perf-report.md"

      - name: Upload exact-head evidence and report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-perf-${{ github.event.pull_request.number || github.run_id }}-${{ env.HEAD_SHA }}
          path: |
            ${{ runner.temp }}/web-perf-results.json
            ${{ runner.temp }}/web-perf-baseline.json
            ${{ runner.temp }}/web-perf-budget.json
            ${{ runner.temp }}/web-perf-report.md
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce harness and validator verdicts
        if: always()
        run: |
          test "${{ steps.measure.outputs.harness_status }}" = 0 || { echo "Chromium harness failed" >&2; exit 1; }
          test -f "$RUNNER_TEMP/web-perf-report.md"
          grep -q -- '- verdict: **pass**' "$RUNNER_TEMP/web-perf-report.md" || { echo "web perf validator failed" >&2; exit 1; }
