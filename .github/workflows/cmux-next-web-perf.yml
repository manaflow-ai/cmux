name: cmux-next manual performance

# Staged policy: manual runs only. Activation needs the trusted validator, budget and a
# measured baseline on feat-cmux-next, and a trigger whose workflow comes from the base
# (workflow_run), not pull_request, whose workflow file the PR itself supplies. Pending
# baselines still fail validation. See webviews/test/latency/ACTIVATION.md.
on:
  # Register this manual entry point on NEXT; all jobs below require dispatch.
  push:
    branches: [feat-cmux-next]
    paths: [.github/workflows/cmux-next-web-perf.yml]
  workflow_dispatch:
    inputs:
      suite:
        description: "Measurement suite (stress requires base and head)"
        type: choice
        options: [chromium, stress]
        default: chromium
      base:
        description: "base commit sha (40 hex): the before"
        required: false
      head:
        description: "head commit sha (40 hex): the after"
        required: false
      angles:
        description: "angles (comma list of cpu,chats,scale,cli,memory)"
        default: "cpu,chats,scale,cli,memory"
      window:
        description: "seconds per measured window"
        default: "20"
      worker:
        description: "fleet worker (empty: any idle bench worker)"
        default: ""
      head_sha:
        description: "full commit SHA to measure (manual runs only)"
        required: false
        type: string
      base_sha:
        description: "full current target base SHA containing trusted policy"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'push' && format('manual-bench-register-{0}', github.ref) || inputs.suite == 'stress' && 'cmux-next-stress-bench' || format('cmux-next-web-perf-{0}', github.event.pull_request.number || github.ref) }}
  cancel-in-progress: ${{ inputs.suite != 'stress' }}

env:
  # Temporary REST budget attribution: one gh-call line per GitHub API call (scripts/ci/api_call_log/env.sh, fetched at a fixed commit when the checkout has no copy).
  BASH_ENV: '$({ w="${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh"; t="${RUNNER_TEMP:-/nonexistent}/api-call-log-src"; if [ -f "$w" ]; then echo "$w"; elif [ -n "${RUNNER_TEMP:-}" ]; then if [ ! -f "$t/env.sh" ] && [ ! -e "$t.tried" ] && { [ "${RUNNER_OS:-}" = Linux ] || [ "${RUNNER_OS:-}" = macOS ]; } && [ "$(date -u +%Y%m%d%H)" -lt 2026112300 ]; then : > "$t.tried"; mkdir -p "$t.part" && for x in env.sh gh sitecustomize.py isolated.py; do curl -fsSL --max-time 5 -o "$t.part/$x" "https://raw.githubusercontent.com/manaflow-ai/cmux/27647ffd3ae838c63be28ca3e5883dcd68c34518/scripts/ci/api_call_log/$x" || break; done; [ -s "$t.part/isolated.py" ] && mv "$t.part" "$t"; fi; if [ -f "$t/env.sh" ]; then echo "$t/env.sh"; else echo unset BASH_ENV > "$t.off.sh" && echo "$t.off.sh"; fi; fi; } 2>/dev/null)'
  HEAD_SHA: ${{ github.event.pull_request.head.sha || inputs.head_sha || github.sha }}
  BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.base_sha || github.sha }}
  PR_NUMBER: ${{ github.event.pull_request.number || '' }}

jobs:
  measure:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.suite != 'stress' }}
    name: Linux Chromium measurement
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || 'cmux-linux' }}
    timeout-minutes: 40
    outputs:
      harness_status: ${{ steps.measure.outputs.harness_status }}
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || inputs.head_sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      - name: Verify exact head and fetch base identity
        run: |
          set -euo pipefail
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 2
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 2
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          git fetch --no-tags --depth=1 origin "$BASE_SHA"

      - name: Restore pinned Bun 1.4.4 from the CI cache bucket
        shell: bash
        continue-on-error: true
        run: bash "$GITHUB_WORKSPACE/scripts/ci/toolchain-r2.sh" restore bun 1.4.4 || true

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
          no-cache: ${{ !startsWith(github.workspace, '/home/runner/work/') }}

      - name: Restore pinned Node 24.22.1 from the CI cache bucket
        shell: bash
        continue-on-error: true
        run: bash "$GITHUB_WORKSPACE/scripts/ci/toolchain-r2.sh" restore node 24.22.1 || true

      - name: Setup Node
        timeout-minutes: 5
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.22.1"

      - name: Cache Bun package cache
        timeout-minutes: 3
        continue-on-error: true
        if: ${{ (github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && github.event_name != 'merge_group' && contains(fromJSON('["refs/heads/main","refs/heads/feat-cmux-next","refs/heads/nightly-next"]'), github.ref)) }}
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.bun/install/cache
          key: bun-web-shared-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('web/bun.lock', 'webviews/bun.lock', 'cmux-tui/frontends/web/bun.lock', 'scripts/react-doctor/bun.lock', 'agent-chat/bun.lock', 'backend/bun.lock') }}
          restore-keys: bun-web-shared-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache Bun package cache (restore only off base branches)
        if: ${{ !(github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && github.event_name != 'merge_group' && contains(fromJSON('["refs/heads/main","refs/heads/feat-cmux-next","refs/heads/nightly-next"]'), github.ref)) }}
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.bun/install/cache
          key: bun-web-shared-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('web/bun.lock', 'webviews/bun.lock', 'cmux-tui/frontends/web/bun.lock', 'scripts/react-doctor/bun.lock', 'agent-chat/bun.lock', 'backend/bun.lock') }}
          restore-keys: bun-web-shared-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Install webviews dependencies
        working-directory: webviews
        run: bun install --frozen-lockfile

      - name: Cache Playwright apt packages
        uses: ./.github/actions/playwright-apt-cache
        with:
          engines: chromium

      - name: Install system Chrome
        working-directory: webviews
        run: |
          "$(git rev-parse --show-toplevel)/scripts/ci/ensure-system-chrome.sh"

      - name: Measure with the target base's harness
        run: |
          set -euo pipefail
          # The candidate's app is what gets measured; the harness that drives it, times it and writes the
          # results is the target base's, checked out last, after every candidate setup step, so a harness
          # edit in the PR can't be what reports its numbers. This guards against drift, not a hostile PR:
          # under pull_request the PR supplies this workflow file itself (see ACTIVATION.md). A base with
          # no harness yet has nothing to measure with: fail closed.
          git cat-file -e "$BASE_SHA:webviews/scripts/latency/run.ts" || {
            echo "target base $BASE_SHA has no latency harness to measure with" >&2
            exit 1
          }
          rm -rf webviews/scripts/latency webviews/test/latency
          git checkout "$BASE_SHA" -- webviews/scripts/latency webviews/test/latency

      - name: Measure exact head
        id: measure
        working-directory: webviews
        env:
          CMUX_LATENCY_HARNESS_SHA: ${{ env.BASE_SHA }}
        run: |
          set +e
          bun scripts/latency/run.ts --ci --no-fail --engine chromium --pages "chat flows,chat 3000 paged,chat 3000 resident,chat rail" --runs 10 --base "$BASE_SHA" \
            --trace-dir "$RUNNER_TEMP/web-perf-traces" \
            --json "$RUNNER_TEMP/web-perf-results.json" --require longTasks,reactCommits,cpu
          status=$?
          echo "harness_status=$status" >> "$GITHUB_OUTPUT"
          # Preserve failure evidence for the separate trusted validation job.
          exit 0

      - name: Upload measurement data only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-perf-measurement-${{ github.run_id }}-${{ env.HEAD_SHA }}
          path: |
            ${{ runner.temp }}/web-perf-results.json
            ${{ runner.temp }}/web-perf-traces
          if-no-files-found: warn
          retention-days: 3

  validate:
    name: Linux Chromium performance gate
    needs: measure
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.suite != 'stress' }}
    # A fresh cloud runner is a trust boundary. Do not route this job onto a
    # persistent worker where candidate processes or tools could survive: linux_4
    # is the pool of ephemeral Blacksmith sizes kept for exactly that.
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || 'blacksmith-4vcpu-ubuntu-2404' }} # frozen-label: validates head output with base code; tests/test_web_perf_validation_boundary.py keeps it off any runner the measuring job may have touched
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      HARNESS_STATUS: ${{ needs.measure.outputs.harness_status }}
    defaults:
      run:
        working-directory: trusted
    steps:
      - name: Checkout exact trusted target base
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.base.sha || inputs.base_sha || github.sha }}
          path: trusted
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      - name: Verify trusted source and preserve policy
        run: |
          set -euo pipefail
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 2
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 2
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          mkdir -p "$RUNNER_TEMP/web-perf-validation"
          cp webviews/test/latency/baseline.json "$RUNNER_TEMP/web-perf-validation/baseline.json"
          cp webviews/test/latency/budget.json "$RUNNER_TEMP/web-perf-validation/budget.json"

      - name: Setup trusted Bun runtime
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
          no-cache: ${{ !startsWith(github.workspace, '/home/runner/work/') }}

      - name: Download measurement artifact as data
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: web-perf-measurement-${{ github.run_id }}-${{ env.HEAD_SHA }}
          path: ${{ runner.temp }}/web-perf-evidence

      - name: Validate data with trusted base policy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          bun webviews/scripts/latency/validate.ts \
            --results "$RUNNER_TEMP/web-perf-evidence/web-perf-results.json" \
            --trace-dir "$RUNNER_TEMP/web-perf-evidence/web-perf-traces" \
            --baseline webviews/test/latency/baseline.json \
            --budget webviews/test/latency/budget.json \
            --expected-head "$HEAD_SHA" --expected-base "$BASE_SHA" --require-base-harness --pr "$PR_NUMBER" \
            --report "$RUNNER_TEMP/web-perf-validation/report.md"
          status=$?
          test "$HARNESS_STATUS" = 0 || { echo "Chromium harness failed or did not finish" >&2; exit 1; }
          exit "$status"

      - name: Upload trusted verdict and policy
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-perf-validation-${{ github.run_id }}-${{ env.HEAD_SHA }}
          path: ${{ runner.temp }}/web-perf-validation
          if-no-files-found: warn
          retention-days: 3

  # Exclusive-fleet A/B stress measurement; command and artifact contract unchanged.
  stress-measure:
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'stress' && github.repository_owner == 'manaflow-ai' && vars.CI_EVAL_STEP_GATEWAY != ''
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || 'glaeda-gateway-xcode-26.6' }} # frozen-label: CI_EVAL_STEP_GATEWAY (cmux#54437)
    timeout-minutes: 300
    permissions: {}
    steps:
      # No checkout: the gateway runner takes only thin cmux-ci clients. The bench Mac checks each sha out itself.
      - name: stress at base and head on the bench Mac
        env:
          BASE: ${{ inputs.base }}
          HEAD: ${{ inputs.head }}
          ANGLES: ${{ inputs.angles }}
          WINDOW: ${{ inputs.window }}
          WORKER: ${{ inputs.worker }}
        run: |
          set -uo pipefail
          client="${CMUX_CI_CLIENT:-$HOME/.local/bin/cmux-ci}"
          if ! [[ -x "$client" ]]; then
            echo "::error title=Build fleet client missing::$client is not installed on runner $RUNNER_NAME; nothing was measured."
            exit 127
          fi
          for sha in "$BASE" "$HEAD"; do
            if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error title=Stress bench::'$sha' is not a 40-hex commit sha"
              exit 1
            fi
          done
          if ! [[ "$ANGLES" =~ ^[a-z,]+$ && "$WINDOW" =~ ^[0-9]+$ ]]; then
            echo "::error title=Stress bench::angles must be a comma list of names and window a whole number"
            exit 1
          fi
          target=()
          [ -n "$WORKER" ] && target=(--target-worker "$WORKER")
          out="$RUNNER_TEMP/stress"
          mkdir -p "$out"
          status=0
          for side in base head; do
            sha="$BASE"; [ "$side" = head ] && sha="$HEAD"
            log="$out/$side.log"
            # Before and after compare only on one machine: the head side runs strictly on the worker the base
            # side ran on (any bench worker today is one Mac, but a second bench Mac must not split the pair).
            if [ "$side" = head ] && [ -n "${base_worker:-}" ]; then
              target=(--target-worker "$base_worker" --pin-strict)
            fi
            "$client" run --class exclusive --measurement --label bench --display \
              --script scripts/measure/split-spring.sh --ref "$sha" --timeout 7200 \
              --key "stress-$side-$sha-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
              --artifact artifacts/split-spring/report.json ${target[@]+"${target[@]}"} \
              --arg=--suite=stress --arg="--angles=$ANGLES" --arg="--window=$WINDOW" --arg=--vdisplay=120 \
              2>&1 | tee "$log" || status=1
            step="$(grep -o -E '\b[0-9a-f]{24}\b' "$log" | head -1)"
            if [[ -n "$step" ]]; then
              "$client" artifact "$step" "$out/$side.json" || "$client" artifact --failed "$step" "$out/$side.json" || true
            fi
            worker=""
            if [[ -n "$step" ]]; then
              worker="$("$client" status "$step" 2>/dev/null | python3 -c 'import json,sys; print(json.load(sys.stdin).get("worker") or "")' 2>/dev/null || true)"
            fi
            [ "$side" = base ] && base_worker="$worker"
            echo "$side: fleet step ${step:-none} on ${worker:-unknown worker}; report $([[ -s "$out/$side.json" ]] && echo returned || echo none)"
            echo "$side=${worker:-unknown}" >> "$out/workers.txt"
          done
          exit "$status"
      - name: Upload the reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stress-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/stress/
          if-no-files-found: warn

  stress-compare:
    needs: stress-measure
    if: ${{ !cancelled() && needs.stress-measure.result != 'skipped' }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || 'cmux-linux' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout: scripts/bench
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: stress-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/stress
      - name: Before/after
        env:
          BASE: ${{ inputs.base }}
          HEAD: ${{ inputs.head }}
        run: |
          set -uo pipefail
          # A plain ledger directory for this run only: nothing is pushed to the shared ledger from CI.
          export CMUX_BENCH_LEDGER="$RUNNER_TEMP/ledger"
          mkdir -p "$CMUX_BENCH_LEDGER"
          dir="$RUNNER_TEMP/stress"
          for side in base head; do
            sha="$BASE"; [ "$side" = head ] && sha="$HEAD"
            if [[ -s "$dir/$side.json" ]]; then
              scripts/bench/cmux-bench stress --import "$dir/$side.json" --build "$sha" --host-name bench || true
            else
              echo "::warning title=Stress bench::no $side report (see the measure job's log)"
            fi
          done
          {
            echo "## stress: ${BASE:0:12} -> ${HEAD:0:12}"
            echo
            scripts/bench/cmux-bench compare "stress@sha:$BASE" "stress@sha:$HEAD" --markdown --no-pull \
              || echo "compare: needs both reports"
          } | tee -a "$GITHUB_STEP_SUMMARY"
