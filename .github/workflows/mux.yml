# The mux brain host's bun test suite (mux/). Any branch push that touches mux/
# runs it, and a lane can dispatch it on any pushed ref:
#   gh workflow run mux.yml --repo manaflow-ai/cmux --ref <branch>
# Bun is pinned to the version CI and the fleet hosts use; the lockfile is frozen.

name: mux

on:
  pull_request:
    paths:
      - mux/**
      - .github/workflows/mux.yml
  push:
    paths:
      - mux/**
      - .github/workflows/mux.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mux-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  test:
    name: mux bun test
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-4vcpu-ubuntu-2404' || vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mux
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - run: bun test
