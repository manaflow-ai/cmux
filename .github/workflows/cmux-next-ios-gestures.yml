name: cmux-next iOS gesture conflicts

# The gesture matrix's UI suite (cmux-next-ios/design/gesture-matrix.md;
# cmux-next-ios/UITests/GestureConflictUITests.swift): real drags, swipes and pinches on the app's offline
# demos, each asserting which view took the touch. Leo, 2026-11-23: "there are no doubt dozens of ...
# interactions like this which should've just very easily been caught and understood and iterated on."
# A pull request into feat-cmux-next that touches the iPhone app's Swift runs it, so a new conflict (a
# composer drag that lowers the keyboard, a back swipe that starts on text being edited) is red on the
# pull request that adds it. A thin cmux-ci client on the build-fleet gateway runner
# (vars.CI_EVAL_STEP_GATEWAY), as cmux-next-ios-keyboard-motion.yml is: one fleet simulator step
# (scripts/ci/cmux-next-ios-sim.sh test ui=GestureConflictUITests). With the variable unset, on a fork or
# on a draft nothing runs; without the client on the runner it warns and passes.
#
# Detached (the default, CI_IOS_GESTURES_DETACH): the job submits the step and hands its verdict to the
# controller, which posts the check run REPORT_CHECK on the head when the step ends (cmux-ci run --report-check
# --detach, cmuxterm-hq build-fleet/cmd/controller/report_check.go: success, failure, or neutral for no verdict,
# with the log tail and `cmux-ci log JOB`), so no GitHub runner waits on the simulator queue. A failed gesture
# cell is still red on the pull request that adds it, on that check. The waiting job held a gateway runner for
# 112 min per run: 31 runs and 3,468 runner-min in 6 h to 11:34Z on 11-28 (~13.9k/day, the second job in NOW's
# ci_minutes), nearly all of it the runner waiting for a simulator. Same cut as cmux-next-ios-try-ahead.yml
# (#63497), nightly-pr-build.yml and cmux-next-split-table.yml. Leo, 2026-11-27: "de facto, im asking for 99%
# fewer minutes of ci time, period." CI_IOS_GESTURES_DETACH=0, a dispatch on a branch name (the check needs a
# commit SHA) or a client and controller without --detach wait here as before.

on:
  pull_request:
    # labeled: the heavy-at-land rule on `gestures` runs it on the event that adds ready-to-land (or full-ci).
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    branches: [feat-cmux-next]
    paths:
      - "cmux-next-ios/**/*.swift"
      - "cmux-next-ios/project.yml"
      - "scripts/ci/cmux-next-ios-sim.sh"
      - ".github/workflows/cmux-next-ios-gestures.yml"
  push:
    branches: [nightly-next]
  # The post-merge batch tier (cmuxterm-hq docs/rfd/0023-ci-10x.md part 3; cmux-next-post-merge.yml, suite
  # ios-gestures in .github/post-merge-batch.json): once a batch window at the merged tip, when the commits since the
  # last batch touched the paths above; a red there is bisected to the merge that made it. Not detached there: the
  # batch's judge reads this job's own verdict.
  workflow_call:
    inputs:
      sha:
        description: "The commit to test (the post-merge batch's tip or a bisect probe's commit). Empty: the event's own."
        type: string
        default: ""
      only:
        description: "The one job id to run (a bisect probe): gestures. Empty: every job."
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      ref:
        description: Commit or branch to test (default the dispatched ref)
        required: false
        type: string

permissions: {}

concurrency:
  group: cmux-next-ios-gestures-${{ github.event.pull_request.number || inputs.sha || github.sha }}${{ inputs.sha && format('-call-{0}', github.run_id) || '' }}${{ (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'feat-cmux-next' && (github.event.action == 'labeled' && !contains(fromJSON('["full-ci","ready-to-land"]'), github.event.label.name) || github.event.action == 'unlabeled') && format('-label-{0}', github.run_id)) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gestures-fleet:
    name: Gesture conflicts on a fleet simulator
    # Post-merge batch tier (cmuxterm-hq docs/rfd/0023-ci-10x.md, tier B: "A new check starts in tier B unless it
    # shows a sole red"; Leo, 2026-11-21: "everything else runs once post-merge, batched"): on a pull request this
    # runs only on the `labeled` event that adds full-ci, at that head. The land's ready-to-land event no longer runs
    # it: the post-merge batch (suite ios-gestures) does, once a window at the merged tip. At land it was 5,948
    # runner-min in 4 h (59 runs, 13Z..17Z 11-28, NOW ci_minutes), about 35.7k a day. CI_IOS_SIM_POST_MERGE=0 runs it
    # at ready-to-land again (the heavy-at-land rule, CI_HEAVY_AT_LAND, as before). Dispatch and the nightly-next
    # push: as before.
    if: >-
      ${{ github.repository_owner == 'manaflow-ai' && vars.CI_EVAL_STEP_GATEWAY != '' && (inputs.only == '' || inputs.only == 'gestures')
      && (github.event_name != 'pull_request'
      || (github.event.pull_request.draft != true && github.event.pull_request.head.repo.full_name == github.repository))
      && (github.event_name != 'pull_request' || (github.event.action == 'labeled' && contains(fromJSON('["full-ci","ready-to-land"]'), github.event.label.name) && (github.event.label.name == 'full-ci' || (vars.CI_IOS_SIM_POST_MERGE || '1') == '0')) || ((vars.CI_HEAVY_AT_LAND || '1') == '0' && (vars.CI_IOS_SIM_POST_MERGE || '1') == '0' && github.event.action != 'labeled'))
      && !(github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'feat-cmux-next' && (github.event.action == 'labeled' && !contains(fromJSON('["full-ci","ready-to-land"]'), github.event.label.name) || github.event.action == 'unlabeled')) }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || 'mac-gateway' }} # frozen-label: CI_EVAL_STEP_GATEWAY (linux-pickers-gone host pins)
    timeout-minutes: 240
    permissions:
      contents: read
    env:
      DETACH: ${{ inputs.sha != '' && '0' || vars.CI_IOS_GESTURES_DETACH || '1' }}
      REPORT_CHECK: Gesture conflicts (fleet simulator verdict)
    steps:
      # Only the composite action's folder: the step runs on a fleet Mac, not here.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          sparse-checkout: .github/actions/fleet-client
          sparse-checkout-cone-mode: false

      # A gateway Mac's own ~/.local/bin/cmux-ci can predate --detach; the controller's client
      # (sha256-checked against its manifest) can detach. Unreachable, this runner's own client waits as before.
      - name: Fleet client from the controller
        if: ${{ vars.CMUX_FLEET_CONTROLLER != '' }}
        continue-on-error: true
        uses: ./.github/actions/fleet-client
        with:
          controller: ${{ vars.CMUX_FLEET_CONTROLLER }}

      - name: Run GestureConflictUITests
        env:
          REF: ${{ inputs.sha || inputs.ref || github.event.pull_request.head.sha || github.sha }}
        run: |
          set -uo pipefail
          client="${CMUX_CI_CLIENT:-$HOME/.local/bin/cmux-ci}"
          if ! [[ -x "$client" ]]; then
            echo "::warning title=Gesture conflicts::$client is not installed on runner $RUNNER_NAME; not run"
            exit 0
          fi
          log="${RUNNER_TEMP:?}/gestures.log"
          detach=()
          usage="$("$client" run --help 2>/dev/null || true)"
          if [[ "${DETACH:-1}" != 0 && "$usage" == *--detach* && "$REF" =~ ^[0-9a-f]{40}$ ]]; then
            detach=(--repo "$GITHUB_REPOSITORY" --report-check "$REPORT_CHECK" --detach)
          fi
          status=0
          "$client" run --class simulator --script scripts/ci/cmux-next-ios-sim.sh --ref "$REF" --timeout 5400 --sim-features none \
            --arg test --arg ui=GestureConflictUITests ${detach[@]+"${detach[@]}"} 2>&1 | tee "$log" || status=${PIPESTATUS[0]}
          if [[ ${#detach[@]} -gt 0 && "$status" == 0 ]] && grep -q ') detached; check run' "$log"; then
            # Submitted: the controller posts "$REPORT_CHECK" on the head when the step ends; no runner waits.
            step="$(grep -o -E 'step [0-9a-f]{24}' "$log" | head -1 | cut -d' ' -f2)" || step=""
            echo "::notice title=Gesture conflicts::the fleet posts \"$REPORT_CHECK\" on ${REF:0:12} when the suite ends"
            echo "### Gesture conflicts at ${REF:0:12}: submitted (step ${step:-?}); the check \"$REPORT_CHECK\" carries the verdict" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "### Gesture conflicts at ${REF:0:12}"
            echo
            echo '```'
            grep -E "Test Case .*(passed|failed)|error: .*GestureConflictUITests" "$log" | tail -40 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            echo "::error title=Gesture conflicts::a gesture matrix cell regressed (cmux-next-ios/design/gesture-matrix.md); see the failed test above"
          fi
          exit "$status"
