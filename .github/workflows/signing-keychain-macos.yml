name: Signing keychain (macOS)

# The real-import test for scripts/ci/signing-keychain.sh. It makes a throwaway
# self-signed identity, so it needs no secret and no environment, and it runs
# on a fresh macOS runner for every change to the keychain tool.
on:
  # Pull requests cover other branches; push runs only for the two trunks, so
  # a PR commit does not run twice.
  push:
    branches: [main, feat-cmux-next]
    paths:
      - scripts/ci/**/*.sh
      - scripts/ci/signing-keychain.sh
      - scripts/ci/lib/signing-runtime-guard.sh
      - scripts/import-apple-developer-id-intermediates.sh
      - scripts/apple-developer-id-certs/**
      - tests/test_signing_keychain_real_import.sh
      - tests/test_derive_sparkle_public_key.sh
      - scripts/derive_sparkle_public_key.swift
      - tests/test_bash32_parse_guard.sh
      - scripts/*.sh
      - scripts/cmux-next/*.sh
      - .github/workflows/nightly.yml
      - .github/workflows/signing-keychain-macos.yml
  pull_request:
    paths:
      - scripts/ci/**/*.sh
      - scripts/ci/signing-keychain.sh
      - scripts/ci/lib/signing-runtime-guard.sh
      - scripts/import-apple-developer-id-intermediates.sh
      - scripts/apple-developer-id-certs/**
      - tests/test_signing_keychain_real_import.sh
      - tests/test_derive_sparkle_public_key.sh
      - scripts/derive_sparkle_public_key.swift
      - tests/test_bash32_parse_guard.sh
      - scripts/*.sh
      - scripts/cmux-next/*.sh
      - .github/workflows/nightly.yml
      - .github/workflows/signing-keychain-macos.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: signing-keychain-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The triggers above are wide for bash32-syntax (any scripts/ci change can
  # break macOS /bin/bash 3.2), and that job runs on Linux. The real import
  # needs a Mac but tests only the keychain tool, so this Linux job starts it
  # only when the tool, what it sources, its test or this workflow changed.
  # Before this, every scripts/*.sh PR queued a Blacksmith macOS job (nine at
  # once on 2026-10-27, ahead of nightly signing on the same label). A diff
  # that cannot be read (new branch, too many files, API error) runs it.
  real-import-plan:
    name: Does the keychain tool change?
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.CI_CLOUD_OVERFLOW_SAVED && 'blacksmith-4vcpu-ubuntu-2404' || 'blacksmith-2vcpu-ubuntu-2404' }}
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      run: ${{ steps.plan.outputs.run }}
    steps:
      - name: Compare the changed files with the keychain tool's inputs
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          # Keep in sync with tests/test_signing_keychain_real_import_gate.py.
          INPUTS: |-
            ^scripts/ci/signing-keychain\.sh$
            ^scripts/ci/lib/signing-runtime-guard\.sh$
            ^scripts/import-apple-developer-id-intermediates\.sh$
            ^scripts/apple-developer-id-certs/
            ^scripts/select-ci-xcode\.sh$
            ^tests/test_signing_keychain_real_import\.sh$
            ^tests/test_derive_sparkle_public_key\.sh$
            ^scripts/derive_sparkle_public_key\.swift$
            ^\.github/workflows/signing-keychain-macos\.yml$
        run: |
          set -uo pipefail
          run=true
          if [ "$EVENT" != workflow_dispatch ] && [ -n "$BASE" ] && [ "${BASE//0/}" != "" ]; then
            if files="$(gh api "repos/$REPO/compare/$BASE...$HEAD" \
                --jq 'if (.files | length) >= 300 then error("too many files") else .files[].filename end')"; then
              if ! grep -E -f <(printf '%s\n' "$INPUTS") <<<"$files" >/dev/null; then
                run=false
              fi
            else
              echo "::warning::could not read the diff; running the real import"
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "real import: $run" >> "$GITHUB_STEP_SUMMARY"

  real-import:
    name: Real keychain import (throwaway identity)
    needs: real-import-plan
    if: ${{ needs.real-import-plan.outputs.run == 'true' }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || 'blacksmith-6vcpu-macos-26' }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # codesign and security come from the system; pin the Xcode like every
      # other macOS job anyway.
      - name: Select Xcode
        run: ./scripts/select-ci-xcode.sh

      - name: Import, sign and delete with a throwaway identity
        run: bash tests/test_signing_keychain_real_import.sh

  # macOS runs scripts/ci with /bin/bash 3.2, which rejects some scripts that
  # bash 5 accepts (a heredoc inside $(...) with an apostrophe broke nightly-next
  # run 39011132580). Linux CI uses bash 5, so this check parses with GNU bash
  # 3.2.57, the release macOS /bin/bash is, built on Linux
  # (scripts/ci/build-bash32.sh): no Mac needed. The parse guard test below
  # proves this bash rejects the construct that broke nightly-next.
  bash32-syntax:
    name: scripts/ci parse under /bin/bash 3.2
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-4vcpu-ubuntu-2404' || fromJSON(vars.RUNNER_POOLS).linux }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Restore bash 3.2.57
        id: bash32-cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/bash32
          key: bash-3.2.57-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/ci/build-bash32.sh') }}

      - name: Build bash 3.2.57
        run: |
          ./scripts/ci/build-bash32.sh "$RUNNER_TEMP/bash32"
          echo "CMUX_PARSE_BASH=$RUNNER_TEMP/bash32/bin/bash" >> "$GITHUB_ENV"

      - name: Save bash 3.2.57
        if: steps.bash32-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/bash32
          key: ${{ steps.bash32-cache.outputs.cache-primary-key }}

      - name: Parse every scripts/ci shell script with bash 3.2
        run: ./scripts/ci/check-bash32-parse.sh .github/workflows/nightly.yml

      - name: Parse guards fail on a script bash 3.2 cannot parse
        run: |
          "$CMUX_PARSE_BASH" tests/test_bash32_parse_guard.sh | tee "$RUNNER_TEMP/guard.out"
          ! grep -q '^SKIP' "$RUNNER_TEMP/guard.out"
