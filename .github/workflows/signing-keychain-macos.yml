name: Signing keychain (macOS)

# The real-import test for scripts/ci/signing-keychain.sh. It makes a throwaway
# self-signed identity, so it needs no secret and no environment, and it runs
# on a fresh macOS runner for every change to the keychain tool.
on:
  # Pull requests cover other branches; push runs only for the two trunks, so
  # a PR commit does not run twice.
  push:
    branches: [main, feat-cmux-next]
    paths:
      - scripts/ci/signing-keychain.sh
      - scripts/ci/lib/signing-runtime-guard.sh
      - scripts/import-apple-developer-id-intermediates.sh
      - scripts/apple-developer-id-certs/**
      - tests/test_signing_keychain_real_import.sh
      - scripts/derive_sparkle_public_key.swift
      - tests/test_derive_sparkle_public_key.sh
      - .github/workflows/signing-keychain-macos.yml
  pull_request:
    paths:
      - scripts/ci/signing-keychain.sh
      - scripts/ci/lib/signing-runtime-guard.sh
      - scripts/import-apple-developer-id-intermediates.sh
      - scripts/apple-developer-id-certs/**
      - tests/test_signing_keychain_real_import.sh
      - scripts/derive_sparkle_public_key.swift
      - tests/test_derive_sparkle_public_key.sh
      - .github/workflows/signing-keychain-macos.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: signing-keychain-macos-${{ github.ref }}
  cancel-in-progress: true

env:
  # Temporary REST budget attribution: one gh-call line per GitHub API call (scripts/ci/api_call_log/env.sh, fetched at a fixed commit when the checkout has no copy).
  BASH_ENV: '$({ w="${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh"; t="${RUNNER_TEMP:-/nonexistent}/api-call-log-src"; if [ -f "$w" ]; then echo "$w"; elif [ -n "${RUNNER_TEMP:-}" ]; then if [ ! -f "$t/env.sh" ] && [ ! -e "$t.tried" ] && { [ "${RUNNER_OS:-}" = Linux ] || [ "${RUNNER_OS:-}" = macOS ]; } && [ "$(date -u +%Y%m%d%H)" -lt 2026112300 ]; then : > "$t.tried"; mkdir -p "$t.part" && for x in env.sh gh sitecustomize.py isolated.py; do curl -fsSL --max-time 5 -o "$t.part/$x" "https://raw.githubusercontent.com/manaflow-ai/cmux/27647ffd3ae838c63be28ca3e5883dcd68c34518/scripts/ci/api_call_log/$x" || break; done; [ -s "$t.part/isolated.py" ] && mv "$t.part" "$t"; fi; if [ -f "$t/env.sh" ]; then echo "$t/env.sh"; else echo unset BASH_ENV > "$t.off.sh" && echo "$t.off.sh"; fi; fi; } 2>/dev/null)'

jobs:
  real-import:
    name: Real keychain import (throwaway identity)
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || contains(fromJSON('["blacksmith-6vcpu-macos-26","blacksmith-12vcpu-macos-26"]'), fromJSON(vars.RUNNER_POOLS || '{}').macos_26) && fromJSON(vars.RUNNER_POOLS || '{}').macos_26 || 'blacksmith-6vcpu-macos-26' }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # codesign and security come from the system; pin the Xcode like every
      # other macOS job anyway.
      - name: Select Xcode
        run: ./scripts/select-ci-xcode.sh

      - name: Import, sign and delete with a throwaway identity
        run: bash tests/test_signing_keychain_real_import.sh
