name: Linux tests

# An ad-hoc run of the bun, webview and browser test files an agent names, at a
# pushed commit, on Blacksmith Linux. Agents ran these on a shared dev box
# because CI had no lane for a few files; this is that lane, so dev boxes stay
# for agents and builds. One command:
#
#   ./scripts/run-linux-tests.sh --ref <pushed-sha> webviews/test/foo.test.tsx [...] --wait
#
# The files run one `bun test` process each (as scripts/ci/run-webviews-tests.sh
# does in CI) with Playwright's Chromium and WebKit installed, after the web
# bundles are built, so browser-lane suites run instead of skipping. Only a
# branch head of this repository runs (resolve-dispatch-ref.yml): the run is on
# main, and code from a fork's commit must never run at main's cache scope. The
# plan script comes from this workflow's own revision, never the tested commit,
# and the job's token is read-only.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Full commit SHA (or branch) to test; it must be pushed
        required: true
        type: string
      files:
        description: Test files, space or newline separated (repository paths, or paths under webviews/)
        required: true
        type: string
      runner:
        description: Blacksmith Linux size
        required: false
        type: choice
        default: blacksmith-8vcpu-ubuntu-2404
        options:
          - blacksmith-4vcpu-ubuntu-2404
          - blacksmith-8vcpu-ubuntu-2404
          - blacksmith-16vcpu-ubuntu-2404
          - blacksmith-32vcpu-ubuntu-2404
      build_bundles:
        description: Build the cmux-next web bundles first (tests that read them need it)
        required: false
        type: boolean
        default: true
      file_timeout:
        description: Seconds one file may run
        required: false
        type: string
        default: "600"
      dispatch_id:
        description: Set by run-linux-tests.sh so it can find this run
        required: false
        type: string
        default: ""

run-name: "Linux tests ${{ inputs.dispatch_id }} @ ${{ inputs.ref }}"

permissions:
  contents: read

jobs:
  resolve:
    uses: ./.github/workflows/resolve-dispatch-ref.yml
    with:
      ref: ${{ inputs.ref }}

  test:
    name: Run the named test files
    needs: resolve
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || inputs.runner }}
    timeout-minutes: 60
    steps:
      - name: Refuse a commit that is not a branch head here
        env:
          TRUSTED: ${{ needs.resolve.outputs.trusted_ref }}
          SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          if [ "$TRUSTED" != true ]; then
            echo "::error::$SHA is not the head of a branch of this repository; push it to a branch here and dispatch that head"
            exit 1
          fi

      - name: Check out the lane's plan script
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: lane
          persist-credentials: false
          sparse-checkout: scripts/ci/linux_test_files.py
          sparse-checkout-cone-mode: false

      - name: Check out the commit under test
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: src
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false

      - name: Plan the run
        env:
          FILES: ${{ inputs.files }}
        run: |
          set -euo pipefail
          python3 lane/scripts/ci/linux_test_files.py plan --root src --files="$FILES" > "$RUNNER_TEMP/plan.tsv"
          {
            echo "### Linux tests at \`$(git -C src rev-parse HEAD)\`"
            echo
            while IFS=$'\t' read -r package files; do
              echo "- \`$package\`: $(wc -w <<< "$files") file(s)"
            done < "$RUNNER_TEMP/plan.tsv"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # The tested commit pins bun (webviews/package.json devEngines); a branch
      # that moved to a newer bun must not be tested with this file's older one.
      - name: Read the commit's bun version
        id: bun
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, pathlib, re
          version = "1.4.2"
          try:
              manifest = json.loads(pathlib.Path("src/webviews/package.json").read_text())
              pinned = str(((manifest.get("devEngines") or {}).get("packageManager") or {}).get("version") or "")
              if re.fullmatch(r"\d+\.\d+\.\d+", pinned):
                  version = pinned
          except (OSError, ValueError, AttributeError):
              pass
          print(f"version={version}")
          PY

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ steps.bun.outputs.version }}

      # `vp` and the bundle build run on Node and need ^22.18 or ^24.11.
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.11.1"

      - name: Cache Bun package cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.bun/install/cache
          key: bun-linux-tests-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/**/bun.lock') }}
          restore-keys: bun-linux-tests-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache Playwright browsers
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-linux-tests-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/webviews/bun.lock') }}

      - name: Install the packages and browsers
        working-directory: src
        run: |
          set -euo pipefail
          # fd 3, so bun and playwright never read the plan as their stdin.
          while IFS=$'\t' read -r -u 3 package _; do
            echo "::group::bun install in $package"
            (cd "$package" && bun install --frozen-lockfile)
            echo "::endgroup::"
            if [ -x "$package/node_modules/.bin/playwright" ]; then
              echo "::group::Playwright engines for $package"
              (cd "$package" && ./node_modules/.bin/playwright install --with-deps --only-shell chromium webkit)
              echo "::endgroup::"
            fi
          done 3< "$RUNNER_TEMP/plan.tsv"

      # The web bundles are build output that bundle, budget and browser tests read.
      - name: Build the web bundles
        if: ${{ inputs.build_bundles }}
        working-directory: src
        run: |
          set -euo pipefail
          if cut -f1 "$RUNNER_TEMP/plan.tsv" | grep -qx webviews && [ -x scripts/cmux-next/build-web-bundles.sh ]; then
            ./scripts/cmux-next/build-web-bundles.sh --force
          else
            echo "No webviews files, or no bundle build at this commit; skipping."
          fi

      - name: Run the test files
        working-directory: src
        env:
          FILE_TIMEOUT: ${{ inputs.file_timeout }}
        run: |
          # Actions starts the step with `bash -e`: without +e the first failing file ends the run.
          set +e -uo pipefail
          [[ "$FILE_TIMEOUT" =~ ^[1-9][0-9]*$ ]] || { echo "::error::file_timeout must be a whole number of seconds"; exit 2; }
          failed=0
          {
            echo
            echo "| file | result | seconds |"
            echo "| --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          while IFS=$'\t' read -r -u 3 package files; do
            for file in $files; do
              echo "::group::$package/$file"
              start=$SECONDS
              # A file may need longer: a `// cmux-web-test-timeout: SECONDS` header line, as in CI.
              limit=$(head -n 20 "$package/$file" | sed -n 's|^// cmux-web-test-timeout: \([1-9][0-9]*\)$|\1|p' | head -n 1)
              { [ -n "$limit" ] && [ "$limit" -gt "$FILE_TIMEOUT" ]; } || limit=$FILE_TIMEOUT
              # "./" names the file; a bare path is a substring filter that also runs its namesakes.
              (cd "$package" && timeout -k 10 "$limit" bun test "./$file" < /dev/null)
              code=$?
              echo "::endgroup::"
              case $code in
                0) result=pass ;;
                124) result="timed out after ${limit}s"; failed=1 ;;
                *) result="failed ($code)"; failed=1 ;;
              esac
              [ "$code" = 0 ] || echo "::error file=$package/$file::$result"
              echo "| \`$package/$file\` | $result | $((SECONDS - start)) |" >> "$GITHUB_STEP_SUMMARY"
            done
          done 3< "$RUNNER_TEMP/plan.tsv"
          exit "$failed"
