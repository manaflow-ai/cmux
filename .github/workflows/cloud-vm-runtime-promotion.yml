name: Cloud VM runtime promotion

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref containing the runtime slice
        required: true
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: cloud-vm-runtime-promotion-staging
  cancel-in-progress: false

jobs:
  staging-db:
    name: staging runtime promotion DB suite
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    environment: cloud-vm-staging
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout requested ref
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
      - name: Install web dependencies
        run: bun install --frozen-lockfile
      - name: Validate staging database secret
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          test -n "${DATABASE_URL:-}" || { echo "::error::Missing cloud-vm-staging DATABASE_URL"; exit 1; }
          case "$DATABASE_URL" in postgres://*|postgresql://*) ;; *) echo "::error::DATABASE_URL must use PostgreSQL"; exit 1 ;; esac
      - name: Verify staging schema
        env:
          CMUX_CLOUD_VM_ENV_SOURCE: process
          CMUX_DB_DRIVER: url
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: bun run cloud-vm:migrate -- staging --check
      - name: Run durable runtime promotion suite
        env:
          CMUX_DB_TEST: "1"
          CMUX_CLOUD_VM_ENV_SOURCE: process
          CMUX_DB_DRIVER: url
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: bun run test:runtime-promotion:db
