name: 13474 direct ownership test

on:
  push:
    branches:
      - fix/13474-viewport-lease-followup

permissions:
  contents: read

jobs:
  ownership:
    runs-on: blacksmith-6vcpu-macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          submodules: recursive
          persist-credentials: false
      - name: Select Xcode
        run: |
          set -euo pipefail
          if [ -d "/Applications/Xcode.app/Contents/Developer" ]; then
            XCODE_DIR="/Applications/Xcode.app/Contents/Developer"
          else
            XCODE_APP="$(find /Applications -maxdepth 1 -type d -name 'Xcode*.app' -print 2>/dev/null | sort | tail -n 1)"
            XCODE_DIR="$XCODE_APP/Contents/Developer"
          fi
          echo "DEVELOPER_DIR=$XCODE_DIR" >> "$GITHUB_ENV"
          export DEVELOPER_DIR="$XCODE_DIR"
          xcodebuild -version
      - name: Provision GhosttyKit
        run: |
          set -euo pipefail
          ./scripts/download-prebuilt-ghosttykit.sh || ./scripts/ensure-ghosttykit.sh
      - name: Run ownership suite
        run: |
          set -euo pipefail
          DEVICE_ID="$(
            xcrun simctl list devices available -j | python3 -c '
          import json, sys
          d=json.load(sys.stdin)["devices"]
          for runtime, devices in d.items():
              if "iOS" not in runtime:
                  continue
              for device in devices:
                  if device.get("isAvailable", True) and device.get("name","").startswith("iPhone"):
                      print(device["udid"])
                      raise SystemExit(0)
          raise SystemExit("no available iPhone simulator")
          '
          )"
          xcodebuild \
            -workspace ios/cmux.xcworkspace \
            -scheme cmux-ios \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -derivedDataPath "$RUNNER_TEMP/cmux-13474-followup" \
            -collect-test-diagnostics never \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 60 \
            -maximum-test-execution-time-allowance 120 \
            "-only-testing:CmuxMobileShellUITests/TerminalSurfaceMountOwnershipTests" \
            test
