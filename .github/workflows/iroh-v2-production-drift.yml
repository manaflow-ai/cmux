name: IROH v2 production drift

# The shipped Mac app depends on directory rules the IROH v2 Worker implements
# (workers/iroh-v2/src/rules.ts). Production is deployed by hand, so this check
# compares the deployed Worker with main and files an issue when a rule on main
# is not live (https://github.com/manaflow-ai/cmux/issues/13458). It never
# deploys anything.

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - workers/iroh-v2/src/**
      - workers/iroh-v2/scripts/check-production-drift.ts
      - .github/workflows/iroh-v2-production-drift.yml

permissions:
  contents: read

concurrency:
  group: iroh-v2-production-drift
  cancel-in-progress: false

env:
  # Temporary REST budget attribution: one gh-call line per GitHub API call (scripts/ci/api_call_log/env.sh, fetched at a fixed commit when the checkout has no copy).
  BASH_ENV: '$({ w="${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh"; t="${RUNNER_TEMP:-/nonexistent}/api-call-log-src"; if [ -f "$w" ]; then echo "$w"; elif [ -n "${RUNNER_TEMP:-}" ]; then if [ ! -f "$t/env.sh" ] && [ ! -e "$t.tried" ] && { [ "${RUNNER_OS:-}" = Linux ] || [ "${RUNNER_OS:-}" = macOS ]; } && [ "$(date -u +%Y%m%d%H)" -lt 2026112300 ]; then : > "$t.tried"; mkdir -p "$t.part" && for x in env.sh gh sitecustomize.py isolated.py; do curl -fsSL --max-time 5 -o "$t.part/$x" "https://raw.githubusercontent.com/manaflow-ai/cmux/27647ffd3ae838c63be28ca3e5883dcd68c34518/scripts/ci/api_call_log/$x" || break; done; [ -s "$t.part/isolated.py" ] && mv "$t.part" "$t"; fi; if [ -f "$t/env.sh" ]; then echo "$t/env.sh"; else echo unset BASH_ENV > "$t.off.sh" && echo "$t.off.sh"; fi; fi; } 2>/dev/null)'

jobs:
  drift:
    # Fork pull requests cannot use the private Blacksmith pool.
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || 'cmux-linux' }}
    timeout-minutes: 25
    permissions:
      contents: read
      issues: write
    defaults:
      run:
        working-directory: workers/iroh-v2
    env:
      # A scheduled job's GitHub API waits stop here and fail loud (scripts/ci/gh_budget_wait.sh).
      GH_BUDGET_WAIT_MAX_SECONDS: "900"
    steps:
      # This commit's GitHub API wait (scripts/ci/gh_budget_wait.sh): every later gh call, and
      # each github-script step that installs gh_budget_wait.cjs, waits through a rate limit or a
      # GitHub 5xx under the job's GH_BUDGET_WAIT_MAX_SECONDS, then fails loud.
      - name: Checkout the GitHub API wait
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: .gh-budget-tooling
          sparse-checkout: |
            scripts/ci/gh_budget_wait.sh
            scripts/ci/gh_budget_wait.cjs
          sparse-checkout-cone-mode: false
      - name: Wait through GitHub API rate limits and 5xx in this job
        working-directory: ${{ github.workspace }}
        run: bash .gh-budget-tooling/scripts/ci/gh_budget_wait.sh --install

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # The deployed revision must be resolvable for the ancestry check.
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - name: Compare the production Worker with main
        id: drift
        continue-on-error: true
        run: bun scripts/check-production-drift.ts --base "$GITHUB_SHA" | tee drift-report.txt
      - name: Open, update, or close the drift issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          DRIFT_OUTCOME: ${{ steps.drift.outcome }}
          HEAD_SHA: ${{ github.sha }}
        with:
          script: |
            if (process.env.GH_BUDGET_WAIT_JS) require(process.env.GH_BUDGET_WAIT_JS).install({ github, core });
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const label = 'iroh-v2-production-drift';
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const report = fs.existsSync('workers/iroh-v2/drift-report.txt') ? fs.readFileSync('workers/iroh-v2/drift-report.txt', 'utf8').trim() : '(no report)';
            const open = await github.rest.issues.listForRepo({ owner, repo, labels: label, state: 'open', per_page: 1 });
            if (process.env.DRIFT_OUTCOME === 'success') {
              if (open.data.length > 0) {
                const body = `Production matches main again as of ${process.env.HEAD_SHA} (${runUrl}).\n\n\`\`\`\n${report}\n\`\`\``;
                await github.rest.issues.createComment({ owner, repo, issue_number: open.data[0].number, body });
                await github.rest.issues.update({ owner, repo, issue_number: open.data[0].number, state: 'closed' });
              }
              return;
            }
            const body = `The production IROH v2 Worker does not match main at ${process.env.HEAD_SHA} (${runUrl}).\n\nMac clients built from main depend on the directory rules in workers/iroh-v2/src/rules.ts; until production is deployed they show "The Devices service is out of date" for other Macs.\n\nDeploy from a clean main checkout: \`cd workers/iroh-v2 && bun install --frozen-lockfile && CLOUDFLARE_ACCOUNT_ID=<account> bun run deploy:production\`, then confirm with \`curl -sS https://cmux-v2.debussy.workers.dev/v2/health\`. This issue closes itself on the next run that finds no drift.\n\n\`\`\`\n${report}\n\`\`\``;
            try {
              await github.rest.issues.getLabel({ owner, repo, name: label });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.issues.createLabel({ owner, repo, name: label, color: 'b60205', description: 'Production IROH v2 Worker is behind main' });
            }
            if (open.data.length > 0) {
              await github.rest.issues.update({ owner, repo, issue_number: open.data[0].number, body });
            } else {
              await github.rest.issues.create({ owner, repo, title: 'IROH v2 production Worker is behind main', labels: [label], body });
            }
      - name: Fail when production drifted
        if: steps.drift.outcome != 'success'
        run: |
          echo "::error::The production IROH v2 Worker is behind main; see the drift issue for the deploy step."
          exit 1
