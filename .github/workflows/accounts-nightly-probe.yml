name: Accounts NIGHTLY probe

# Non-gating evidence run: it exercises the published signed NIGHTLY and uploads the person-path receipt.
# It never promotes, rolls back, or changes the NIGHTLY feed.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      build:
        description: Optional CFBundleVersion to probe; empty uses the newest arm64 appcast item
        required: false
        default: ''
        type: string
      dmg:
        description: Optional signed NIGHTLY DMG URL (overrides build)
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: accounts-nightly-probe-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  probe:
    name: Accounts flow on published NIGHTLY
    environment: cmux-next-cloud-journey
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || (vars.CI_BLACKSMITH_MACOS != 'on' && (github.run_attempt < 3 || github.triggering_actor != 'github-actions[bot]') && (vars.CI_SIDE_LANE_LABELS != '' && fromJSON(vars.CI_SIDE_LANE_LABELS) || vars.CI_SIDE_LANE_RUNNER) || vars.MACOS_RUNNER_26 || fromJSON(vars.RUNNER_POOLS).macos_26) }}
    timeout-minutes: 35
    env:
      CMUX_UITEST_STACK_EMAIL: ${{ secrets.CMUX_ACCOUNTS_PROBE_STACK_EMAIL }}
      CMUX_UITEST_STACK_PASSWORD: ${{ secrets.CMUX_ACCOUNTS_PROBE_STACK_PASSWORD }}
      CMUX_GITHUB_TEST_LOGIN: ${{ secrets.CMUX_ACCOUNTS_PROBE_GITHUB_LOGIN }}
      CMUX_GITHUB_TEST_PASSWORD: ${{ secrets.CMUX_ACCOUNTS_PROBE_GITHUB_PASSWORD }}
      CMUX_GITHUB_TEST_TOTP_SEED: ${{ secrets.CMUX_ACCOUNTS_PROBE_GITHUB_TOTP_SEED }}
      CMUX_CLOUD_API: https://cloud-api.cmux.dev
    steps:
      - name: Checkout probe
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      # main does not carry the NEXT signed-artifact and launch helpers.
      - name: Checkout pinned NEXT runtime
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: 407f098797fdb7d98b61dd6f00970fa126b53983
          path: runtime
          persist-credentials: false
      - name: Select Xcode
        working-directory: runtime
        run: ./scripts/select-ci-xcode.sh
      - name: Overlay reviewed Accounts probe
        run: |
          cp scripts/measure/accounts-nightly-probe.py runtime/scripts/measure/accounts-nightly-probe.py
          cp scripts/measure/accounts-nightly-probe.sh runtime/scripts/measure/accounts-nightly-probe.sh
          cp scripts/measure/accounts-nightly-launch.py runtime/scripts/measure/accounts-nightly-launch.py
      - name: Run fresh-install Accounts probe
        working-directory: runtime
        env:
          BUILD: ${{ inputs.build }}
          DMG: ${{ inputs.dmg }}
        run: |
          set -euo pipefail
          args=()
          if [ -n "$DMG" ]; then args+=("dmg=$DMG"); elif [ -n "$BUILD" ]; then args+=("build=$BUILD"); fi
          scripts/measure/accounts-nightly-probe.sh "${args[@]}"
      - name: Upload Accounts evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: accounts-nightly-probe-${{ github.run_id }}
          path: runtime/.build/accounts-nightly-probe/run-*/report.tgz
          if-no-files-found: warn
          retention-days: 1
