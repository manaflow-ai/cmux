name: Accounts NIGHTLY probe

# Non-gating evidence run: it exercises the published signed NIGHTLY and uploads the person-path receipt.
# It never promotes, rolls back, or changes the NIGHTLY feed.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      build:
        description: Optional CFBundleVersion to probe; empty uses the newest arm64 appcast item
        required: false
        default: ''
        type: string
      dmg:
        description: Optional signed NIGHTLY DMG URL (overrides build)
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  # A nightly workflow is never deduped (scripts/ci/cron_concurrency.py): one group per run.
  group: accounts-nightly-probe-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  probe:
    name: Accounts flow on published NIGHTLY
    environment: cmux-next-cloud-journey
    # It holds test-account secrets, so it runs where no variable can move it: an ephemeral Mac
    # (tests/test_ci_fork_runner_routing.py; PAID_ONLY_JOBS in tests/test_ci_paid_queue_pin.py).
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || 'blacksmith-6vcpu-macos-26' }}
    timeout-minutes: 35
    env:
      CMUX_UITEST_STACK_EMAIL: ${{ secrets.CMUX_UITEST_STACK_EMAIL || secrets.CMUX_DOGFOOD_STACK_EMAIL }}
      CMUX_UITEST_STACK_PASSWORD: ${{ secrets.CMUX_UITEST_STACK_PASSWORD || secrets.CMUX_DOGFOOD_STACK_PASSWORD }}
      CMUX_GITHUB_TEST_LOGIN: ${{ secrets.CMUX_GITHUB_TEST_LOGIN }}
      CMUX_GITHUB_TEST_PASSWORD: ${{ secrets.CMUX_GITHUB_TEST_PASSWORD }}
      CMUX_GITHUB_TEST_TOTP_SEED: ${{ secrets.CMUX_GITHUB_TEST_TOTP_SEED }}
      CMUX_CLOUD_API: ${{ vars.CMUX_CLOUD_API || 'https://cloud-api-staging.cmux.dev' }}
    steps:
      - name: Checkout probe
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      # The side-instance launcher, the look-keys AX/RPC driver and the dev sign-in token helper live on
      # feat-cmux-next, the NIGHTLY's branch; take them from there rather than keeping copies on main.
      - name: Checkout NEXT helpers
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: feat-cmux-next
          path: .next-helpers
          persist-credentials: false
          sparse-checkout: |
            scripts/cmux-next/side-instance.sh
            scripts/cmux-next/dev-signin-token.py
            scripts/measure/look-keys-readback.py
          sparse-checkout-cone-mode: false
      - name: Place NEXT helpers
        run: |
          set -euo pipefail
          mkdir -p scripts/cmux-next
          for f in scripts/cmux-next/side-instance.sh scripts/cmux-next/dev-signin-token.py scripts/measure/look-keys-readback.py; do
            [ -e "$f" ] || cp -p ".next-helpers/$f" "$f"
          done
      - name: Select pinned Xcode
        run: ./scripts/select-ci-xcode.sh
      - name: Run fresh-install Accounts probe
        env:
          BUILD: ${{ inputs.build }}
          DMG: ${{ inputs.dmg }}
        run: |
          set -euo pipefail
          args=()
          if [ -n "$DMG" ]; then args+=("dmg=$DMG"); elif [ -n "$BUILD" ]; then args+=("build=$BUILD"); fi
          scripts/measure/accounts-nightly-probe.sh "${args[@]}"
      - name: Upload Accounts evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: accounts-nightly-probe-${{ github.run_id }}
          path: .build/accounts-nightly-probe/report.tgz
          if-no-files-found: warn
          retention-days: 14
