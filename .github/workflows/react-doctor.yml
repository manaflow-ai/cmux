name: React Doctor
on:
  pull_request:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ${{ fromJSON(vars.RUNNER_POOLS).linux_4 }}
    timeout-minutes: 30
    env:
      REACT_DOCTOR_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.22.1"
      - name: Probe
        run: |
          set -x
          mkdir -p /tmp/rd
          for p in webviews agent-chat cmux-tui/frontends/web backend/apps/dashboard web; do
            n=$(echo $p | tr / _)
            ( cd $p && timeout 600 npx -y react-doctor@0.9.22 . --no-score --no-supply-chain --blocking none --json --json-out /tmp/rd/$n.json > /tmp/rd/$n.stdout 2>/tmp/rd/$n.stderr; echo "exit $?" )
            head -c 1500 /tmp/rd/$n.stderr
            python3 -c "import json,sys;d=json.load(open('/tmp/rd/$n.json'));print(list(d.keys()));print(json.dumps({k:v for k,v in d.items() if k!='diagnostics'})[:3000]);ds=d.get('diagnostics',[]);print(len(ds));print(json.dumps(ds[:2])[:2000])" || head -c 2000 /tmp/rd/$n.stdout
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: rd-probe
          path: /tmp/rd
