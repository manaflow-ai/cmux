name: iOS App Review readiness

# Finds every iOS App Store release blocker we can see before App Review does,
# on every push to main, instead of one blocker per rejection. The run's
# conclusion is the readiness answer.
#
# The App Store app is the cmux NEXT iPhone app (cmux-next-ios, com.cmux.app,
# built from feat-cmux-next), so its gate is feat-cmux-next's
# ios-review-gate.yml (cmux-next-ios/AppStoreReview/APP-REVIEW-GATE.md): the
# guideline lint, and the reviewer-path walk on iPhone, iPad and iPhone Duo.
# The review-gate job dispatches that workflow on feat-cmux-next for the
# feat-cmux-next head and takes its run's conclusion, as
# ios-reliability-matrix.yml starts the matrix. It holds no secret: the gate
# runs as feat-cmux-next's own run, and main's release key never reaches a
# workflow defined on another branch.
#
# A dispatched gate runs on refs/heads/feat-cmux-next, where its asc-validate
# job skips (it needs the release environment, which serves main), and main's
# production pipeline that used to call it with the key is retired
# (ios-app-store.yml). So the App Store Connect half runs here, on main, in
# the app-store-connect job: `asc validate --strict` and `asc metadata
# validate`, and the review package (cmux#40346's checks, now feat-cmux-next's
# cmux-next-ios/scripts/asc_review_package.py: the App Review notes render
# from App Store Connect's review detail, and every locale's Support URL
# matches the repository), each read-only (--dry-run: nothing is written).
# That job runs only `asc` and the gate's own scripts at the judged
# feat-cmux-next SHA, as the gate's asc-validate job does; the keyless verdict
# job ranks their JSON with the gate's report (app_review_gate.py report),
# which blocks on every finding and on a check that left no result.
#
# No paths filter. One waiter at a time: the push run holding the group runs to
# its verdict, and a newer main push waits pending behind it (no runner held);
# a still newer push replaces that pending run, which ends cancelled, and the
# pending run carries the verdict for the newest feat-cmux-next (the gate
# judges feat-cmux-next's head, not the main commit). Until 2026-11-27 a newer
# push cancelled the running waiter instead: main moves every few minutes and
# a gate takes up to 2 h, so 34 of the 40 push runs to 11-27 00:11Z ended
# cancelled, none passed, and the ios-app-store-live probe's readiness part
# (no red on the last 10 main pushes) could never pass. Until
# 2026-11-21 every main push held its own runner for up to 6 h polling the same
# gate run: 28 waiters on 11-20 held 168 runner-hours and all timed out with no
# verdict (CI 10x, T1; Leo, 2026-11-21 03:45Z: "clearly we need to be hitting a
# 10x improvement in not running useless jobs"). A dispatch keeps its own group.
#
# The store-declarations job diffs ios/AppStoreReview/store-declarations.json (the age rating and App Privacy
# answers, cmuxterm-hq#18638) against App Store Connect for cmux (com.cmux.app, ASC 6783338052) on every main
# push: a declared age-rating field that differs, or an ASC field nobody declared, turns the run red with the
# exact age-rating-patch attributes that fix it. App Privacy has no ASC API, so its step summary carries the
# declared answers as the block to enter by hand. It needs main's ASC key (the `release` environment, which
# deploys from main), reads only, and runs scripts/ci/ios_asc_ops.py from this main commit.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.event_name == 'push' && 'ios-app-review-readiness-push' || format('ios-app-review-readiness-{0}', github.run_id) }}
  # Never cancel the running waiter: only the pending one is replaced (see the header).
  cancel-in-progress: false

permissions: {}

env:
  # Temporary REST budget attribution: one gh-call line per GitHub API call (scripts/ci/api_call_log/env.sh, fetched at a fixed commit when the checkout has no copy).
  BASH_ENV: '$({ w="${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh"; t="${RUNNER_TEMP:-/nonexistent}/api-call-log-src"; if [ -f "$w" ]; then echo "$w"; elif [ -n "${RUNNER_TEMP:-}" ]; then if [ ! -f "$t/env.sh" ] && [ ! -e "$t.tried" ] && { [ "${RUNNER_OS:-}" = Linux ] || [ "${RUNNER_OS:-}" = macOS ]; } && [ "$(date -u +%Y%m%d%H)" -lt 2026112300 ]; then : > "$t.tried"; mkdir -p "$t.part" && for x in env.sh gh sitecustomize.py isolated.py; do curl -fsSL --max-time 5 -o "$t.part/$x" "https://raw.githubusercontent.com/manaflow-ai/cmux/27647ffd3ae838c63be28ca3e5883dcd68c34518/scripts/ci/api_call_log/$x" || break; done; [ -s "$t.part/isolated.py" ] && mv "$t.part" "$t"; fi; if [ -f "$t/env.sh" ]; then echo "$t/env.sh"; else echo unset BASH_ENV > "$t.off.sh" && echo "$t.off.sh"; fi; fi; } 2>/dev/null)'

jobs:
  store-declarations:
    name: Store declarations match App Store Connect
    if: github.repository == 'manaflow-ai/cmux' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.run_attempt == 1 && 'cmux-gcp-nightly-jit-x64' || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 10
    environment: release
    steps:
      - name: Checkout the script and the declarations
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/ci
            ios/AppStoreReview/metadata

      - name: Diff the declarations against App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          key_dir="$RUNNER_TEMP/asc"; mkdir -p "$key_dir"; chmod 700 "$key_dir"
          trap 'rm -rf "$key_dir"' EXIT
          printf '%s' "$ASC_API_KEY_P8_BASE64" | base64 --decode > "$key_dir/AuthKey.p8"
          chmod 600 "$key_dir/AuthKey.p8"
          ASC_PRIVATE_KEY_PATH="$key_dir/AuthKey.p8" python3 -I scripts/ci/ios_asc_ops.py declarations-check \
            --app 6783338052

  review-gate:
    name: NEXT App Review gate
    if: github.repository == 'manaflow-ai/cmux'
    permissions:
      actions: write # dispatch and read ios-review-gate.yml
      contents: read
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.CI_SECRET_SKIP_FLEET != '1' && 'cmux-gcp-secret-jit-x64' || contains(fromJSON('["blacksmith-2vcpu-ubuntu-2404","blacksmith-4vcpu-ubuntu-2404","blacksmith-8vcpu-ubuntu-2404","cmux-gcp-secret-jit-x64"]'), vars.CI_TRUSTED_RUNNER) && vars.CI_TRUSTED_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    # Gate runs have taken up to about 2 hours (the reviewer-path jobs and their
    # macOS queue), and a followed successor waits behind the run holding the
    # gate's group first, so up to about 4; past this the push run is red with
    # no verdict. 360 is the job ceiling.
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # The job token shares the repository's per-hour Actions budget with every
      # other workflow: 26 of the 90 failed push runs from 2026-11-19 to 11-26
      # ended in this step on "API rate limit exceeded for installation" after
      # all 5 tries (runs 45735xxx at 03:20Z, 45720515905), red with no verdict,
      # so the ios-app-store-live probe's readiness part could not pass whatever
      # the gate said. The cmux bot App's token has its own hour (cmux#55829,
      # cmux#57719). Only this step uses it: an App token lasts an hour and the
      # wait below can take up to 6, so the wait keeps the job token (it reads
      # every 2 min and already retries a refused read).
      - name: Mint the cmux bot App token
        id: app-token
        if: ${{ vars.CMUX_BOT_APP_ID != '' }}
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.CMUX_BOT_APP_ID }}
          private-key: ${{ secrets.CMUX_BOT_APP_KEY }}
          permission-actions: write
          permission-contents: read

      - name: Find or dispatch the gate for the feat-cmux-next head
        id: dispatch
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        run: |
          set -euo pipefail
          # One refused read must not turn the push run red with no verdict (run
          # 43618862433): each call gets 5 tries, 30, 60, 120 and 240 s apart. A
          # dispatch whose reply was lost and is sent again makes at most one
          # extra gate run. gh api prints a refused call's error body to stdout,
          # so only the successful try's output is passed on; a failed try's body
          # goes into its warning (run 45101415966 failed 5 times and said
          # nothing about why).
          ghr() {
            local out err delay=30
            err="$(mktemp)"
            for try in 1 2 3 4 5; do
              out="$(gh api "$@" 2>"$err")" && { printf '%s\n' "$out"; return 0; }
              echo "::warning::gh api $1 failed (try $try of 5): $(cat "$err" - <<<"$out" | tr '\n' ' ' | cut -c1-300)" >&2
              [[ $try -lt 5 ]] && { sleep "$delay"; delay=$((delay * 2)); }
            done
            return 1
          }
          sha="$(ghr "repos/$GITHUB_REPOSITORY/commits/feat-cmux-next" --jq .sha)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::could not resolve feat-cmux-next: $sha" >&2; exit 1; }
          # A main push does not change the code the gate judges, so pushes while
          # feat-cmux-next stays put share one gate run: the newest not-cancelled
          # one this workflow dispatched for that SHA (a bot actor, lane
          # appstore). A new dispatch per push would also let the gate's
          # concurrency group cancel a queued one, a red with no blocker found.
          # actor.type Bot: a run this workflow dispatched with the cmux bot App
          # token (above) or, when the App could not be minted, the job token;
          # a person's dispatch (type User) is not taken as ours.
          # The repository's run list, matched on each run's workflow path: the
          # gate's file exists only on feat-cmux-next, not in this branch's
          # .github/workflows.
          # The lookup only saves a gate run, so a lookup GitHub keeps refusing
          # dispatches a new one instead of turning the push run red with no
          # verdict (readiness run 45101415966: the list read failed 5 times).
          run_id="$(ghr "repos/$GITHUB_REPOSITORY/actions/runs?event=workflow_dispatch&branch=feat-cmux-next&head_sha=$sha&per_page=30" \
            --jq '[.workflow_runs[] | select(.path == ".github/workflows/ios-review-gate.yml" and .actor.type == "Bot" and .conclusion != "cancelled")][0].id // empty')" \
            || { echo "::warning::could not list gate runs for $sha; dispatching one" >&2; run_id=""; }
          if [[ -z "$run_id" ]]; then
            # return_run_details: the reply names the run this dispatch made, so a
            # concurrent dispatch is never mistaken for it. No inputs.ref: the gate
            # judges its own head, which is the run's head_sha, the key the lookup
            # above reuses it by, even when feat-cmux-next moved since $sha.
            run_id="$(ghr -X POST "repos/$GITHUB_REPOSITORY/actions/workflows/ios-review-gate.yml/dispatches" \
              -f ref=feat-cmux-next -f "inputs[lane]=appstore" -f "inputs[agent_pass]=true" \
              -F return_run_details=true --jq .workflow_run_id)"
          fi
          [[ "$run_id" =~ ^[0-9]+$ ]] || { echo "::error::no gate run for $sha: $run_id" >&2; exit 1; }
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "App Review gate for feat-cmux-next $sha: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$run_id" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      # The verdict is the gate run's own conclusion, and nothing else. A read
      # GitHub refuses (the installation's rate limit answered HTTP 403 in run
      # 43618862433 while the gate ran on) is retried, never taken as the
      # verdict; the job's timeout bounds the wait.
      #
      # Every dispatch shares the gate's one concurrency group, so a newer
      # dispatch (feat-cmux-next moved) replaces a queued one, which ends
      # cancelled with no job run (gate run 43622919851, readiness run
      # 43622910673). A cancelled run was superseded: the wait follows the
      # newest live gate run this workflow dispatched after it, and carries
      # that run's verdict on the newer feat-cmux-next.
      - name: Wait for the gate's verdict
        env:
          RUN_ID: ${{ steps.dispatch.outputs.run_id }}
        run: |
          set -uo pipefail
          run_id="$RUN_ID"
          while :; do
            url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$run_id"
            state="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq '.status + " " + (.conclusion // "")')" \
              || { echo "::warning::could not read $url; retrying in 2 min"; sleep 120; continue; }
            if [[ "$state" == "completed cancelled" ]]; then
              next="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?event=workflow_dispatch&branch=feat-cmux-next&per_page=50" \
                --jq "[.workflow_runs[] | select(.path == \".github/workflows/ios-review-gate.yml\" and .actor.type == \"Bot\" and .conclusion != \"cancelled\" and .id > $run_id)][0].id // empty")" \
                || { echo "::warning::could not list the gate's runs; retrying in 2 min"; sleep 120; continue; }
              if [[ "$next" =~ ^[0-9]+$ ]]; then
                echo "Gate run $url was cancelled for a newer dispatch; following run $next"
                run_id="$next"
                continue
              fi
            fi
            case "$state" in
              "completed success") echo "The App Review gate passed: $url"; exit 0 ;;
              completed*) echo "::error::the App Review gate concluded ${state#completed }: $url"; exit 1 ;;
            esac
            sleep 120
          done

  # The feat-cmux-next commit the App Store Connect checks judge, and the
  # version they validate (the AppStore configuration's MARKETING_VERSION),
  # read with no secret in the job.
  plan:
    name: App Store Connect plan
    if: github.repository == 'manaflow-ai/cmux'
    permissions:
      contents: read
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.CI_OVERFLOW_LINUX || 'cmux-linux' }}
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: refs/heads/feat-cmux-next
          persist-credentials: false
          sparse-checkout: |
            cmux-next-ios/project.yml
            cmux-next-ios/scripts
          sparse-checkout-cone-mode: false
      - name: Resolve the judged commit and version
        id: plan
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          version="$(python3 -I cmux-next-ios/scripts/app_review_gate.py version --source-root . --lane appstore || true)"
          [[ "$version" =~ ^[0-9][0-9.]*$ ]] || version=""
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "App Store Connect checks judge feat-cmux-next $sha, version ${version:-unknown}" | tee -a "$GITHUB_STEP_SUMMARY"

  # Read-only: nothing here writes to App Store Connect. The key is decoded
  # for this one step and removed after it; the outputs are asc's JSON and the
  # review package's own lines, which carry no account value.
  app-store-connect:
    name: App Store Connect (asc validate --strict, review package; read-only)
    needs: plan
    if: github.repository == 'manaflow-ai/cmux' && github.ref == 'refs/heads/main'
    environment: release
    permissions:
      contents: read
    # It holds the App Store Connect key, so it takes an ephemeral Linux
    # machine, as ios-asc-ops.yml's key-holding job does; nothing here needs a Mac.
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.run_attempt == 1 && 'cmux-gcp-nightly-jit-x64' || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 20
    env:
      ASC_APP_ID: ${{ vars.IOS_APPSTORE_APP_ID }}
      ASC_VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
          sparse-checkout: |
            cmux-next-ios/project.yml
            cmux-next-ios/scripts
            cmux-next-ios/AppStoreReview
          sparse-checkout-cone-mode: false
      - name: Install asc
        env:
          ASC_CLI_VERSION: 7.2.0
          ASC_CLI_SHA256: b77872625ba50d95a3a92b3d289d28617e1ccec6d9ae80206ef1956bcb6121ba
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/bin"; mkdir -p "$bin"
          curl -fsSL --retry 3 -o "$bin/asc" \
            "https://github.com/rudrankriyam/App-Store-Connect-CLI/releases/download/$ASC_CLI_VERSION/asc_${ASC_CLI_VERSION}_linux_amd64"
          echo "$ASC_CLI_SHA256  $bin/asc" | sha256sum -c -
          chmod +x "$bin/asc"
          echo "$bin" >> "$GITHUB_PATH"
          "$bin/asc" --version
      - name: Read-only App Store Connect checks
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          set -uo pipefail
          mkdir -p out
          key="$RUNNER_TEMP/AuthKey.p8"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$ASC_API_KEY_P8_BASE64" | base64 --decode > "$key"
          chmod 600 "$key"
          unset ASC_API_KEY_P8_BASE64
          export ASC_KEY_ID="$ASC_API_KEY_ID" ASC_ISSUER_ID="$ASC_API_ISSUER_ID" ASC_PRIVATE_KEY_PATH="$key"
          error() { printf '{"issues":[{"severity":"error","code":"%s","message":"%s"}]}\n' "$1" "$2"; }
          if ! [[ "$ASC_APP_ID" =~ ^[0-9]+$ ]]; then
            error app.unknown "no App Store Connect app id (repository variable IOS_APPSTORE_APP_ID)" > out/asc-validate.json
            exit 0
          fi
          if [ -z "$ASC_VERSION" ]; then
            error version.unknown "no MARKETING_VERSION in cmux-next-ios/project.yml" > out/asc-validate.json
            exit 0
          fi
          asc validate --app "$ASC_APP_ID" --version "$ASC_VERSION" --platform IOS --strict --output json > out/asc-validate.json || true
          asc metadata validate --dir cmux-next-ios/AppStoreReview/metadata --output json > out/asc-metadata.json || true
          # The review package, --dry-run: sync-notes fails when App Store
          # Connect lacks a value the notes need (demo account, contact) and
          # notes a drift the submission's own sync-notes writes; sync-listing
          # fails on a locale whose Support URL differs (Guideline 1.5).
          pkg=cmux-next-ios/scripts/asc_review_package.py
          python3 -I "$pkg" --app "$ASC_APP_ID" --config AppStore sync-notes --version "$ASC_VERSION" --dry-run 2> out/notes.log
          notes=$?
          python3 -I "$pkg" --app "$ASC_APP_ID" --config AppStore sync-listing --version "$ASC_VERSION" --dry-run 2> out/listing.log
          listing=$?
          cat out/notes.log out/listing.log
          python3 -I - "$notes" "$listing" > out/asc-review-package.json <<'PY'
          import json, sys
          issues = []
          for code, status, log in (("review-package.notes", int(sys.argv[1]), "out/notes.log"),
                                    ("review-package.support-url", int(sys.argv[2]), "out/listing.log")):
              lines = [l.split(": ", 1)[-1].strip() for l in open(log, errors="replace") if l.strip()]
              if status:
                  bad = [l.removeprefix("BLOCKING: ") for l in lines if l.startswith(("BLOCKING", "error"))] or lines[-1:]
                  issues += [{"severity": "error", "code": code, "message": m[:500]} for m in bad or [f"exited {status}"]]
              else:
                  issues += [{"severity": "info", "code": code, "message": m[:500]} for m in lines]
          json.dump({"issues": issues}, sys.stdout)
          PY
          rm -f out/*.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: asc-readiness
          path: out/asc-*.json
          retention-days: 3

  # The verdict, with no secret: the gate's own report on the App Store
  # Connect JSON. Every finding blocks, and a check that left no result is
  # `asc.missing`, never a pass.
  app-store-connect-verdict:
    name: App Store Connect verdict
    needs: [plan, app-store-connect]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    permissions:
      contents: read
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.CI_OVERFLOW_LINUX || 'cmux-linux' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
          sparse-checkout: cmux-next-ios/scripts
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        continue-on-error: true
        with:
          name: asc-readiness
          path: in
      - name: One ranked list
        run: |
          set -uo pipefail
          args=(report --out app-store-connect.md)
          while IFS= read -r f; do args+=(--asc-validate "$f"); done < <(find in -name 'asc-*.json' -type f 2>/dev/null | sort)
          python3 -I cmux-next-ios/scripts/app_review_gate.py "${args[@]}"
