name: iOS App Review readiness

# Finds every iOS App Store release blocker we can see before App Review does,
# on every push to main, instead of one blocker per rejection. The run's
# conclusion is the readiness answer.
#
# The App Store app is the cmux NEXT iPhone app (cmux-next-ios, com.cmux.app,
# built from feat-cmux-next), so this runs feat-cmux-next's App Review gate
# (.github/workflows/ios-review-gate.yml, cmux-next-ios/AppStoreReview/
# APP-REVIEW-GATE.md) against the feat-cmux-next head: the guideline lint on
# the source, the reviewer-path walk on iPhone, iPad and iPhone Duo with the
# agent reviewer pass, and `asc validate --strict` (read-only; it needs the
# `release` environment, which serves only main). The gate fails on any
# blocking finding.
#
# No paths filter: every main push must leave a run behind, and no run is
# cancelled for a newer one, so each push keeps its own verdict.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ios-app-review-readiness-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  review-gate:
    name: NEXT App Review gate
    uses: manaflow-ai/cmux/.github/workflows/ios-review-gate.yml@feat-cmux-next
    # A called workflow gets at most these; the gate's lint job reads actions.
    permissions:
      contents: read
      actions: read
    with:
      ref: feat-cmux-next
      lane: appstore
      agent_pass: true
      gate_ref: feat-cmux-next
    # The agent pass's Claude token and the App Store Connect key (release
    # environment) are read inside the gate.
    secrets: inherit
