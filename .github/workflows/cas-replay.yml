name: cas/1 replay (RFD 0166)

# RFD 0166's replay harness in CI (cmuxterm-hq docs/rfd/0166-own-cdn.md, "Scoreboard rows"): row W1,
# the in-app web update's bytes per merge under cas/1, from the real feat-cmux-next web bundle
# publishes. scripts/cas/web_ota_replay.py fetches the newest bundle archives
# (cmux-next-web-bundle-publish.yml's `cmux-next-web-bundles` artifacts, kept 3 days), unpacks them and
# runs cmux-cas's `cas-replay` over them, oldest first. The job summary shows the p50, p90 and max of
# what a client holding the previous bundle reads by Range GET, against today's whole archive, and
# beside it what per-file `zstd -19 --long=27 --patch-from` needs for the same merge (the RFD's
# PATCH lever: the bundle is a few large minified files, where FastCDC chunks miss).
#
# It reports, it does not gate: the RFD's target (<= 10 % at p50) is not met yet. A red means the
# crate's tests failed or the replay could not run (fewer than two publishes, a bad archive, a crash).
# Row B1 (job b1): DerivedData seed restore bytes when the runner holds seed N-1.
# scripts/cas/derived_data_replay.py finds main's newest seeds on the public CI cache (one key
# prefix, read from the newest seed-derived-data.yml run's log), streams each tar.zst into a tree
# and replays them with the same `cas-replay`. Seeds land on main, not here; each run takes
# main's newest (a schedule fires only from main's copy of a workflow, so none here).
# Row U2 (a Mac 20 NIGHTLYs behind) is the `u2` job: scripts/cas/mac_update_replay.py fetches published
# nightly-next DMGs from the feed, unpacks the .app with 7-Zip and replays N-20, N-1 and N.
#
# Row A1 (job a1): fleet host acpmux update bytes. scripts/cas/acpmux_update_replay.py finds the
# newest published acpmux builds (files.cmux.com/cmux-tui/tree/<key>/) along feat-cmux-next's history
# and replays each update against the previous build: today's whole binary, zstd -19, cas/1 Range GETs
# and zstd --patch-from the installed build.
#
# Every web merge reruns it (the push paths include webviews/), so the row moves with each publish.

on:
  push:
    branches:
      - feat-cmux-next
    paths:
      - "cmux-tui/crates/cmux-cas/**"
      - "cmux-tui/crates/cmux-signed-envelope/**"
      - "scripts/cas/**"
      - "scripts/cmux-next/web-bundle-archive.py"
      - "webviews/**"
      - ".github/workflows/cas-replay.yml"
      - "scripts/ci/verify_cas_replay_artifact.py"
      - "tests/test_cas_web_ota_replay.py"
      - "tests/test_cas_derived_data_replay.py"
      - "tests/test_cas_mac_update_replay.py"
      - "tests/test_cas_acpmux_update_replay.py"
      - "tests/test_cas_replay_workflow.py"
      - "tests/test_verify_cas_replay_artifact.py"
  pull_request:
    paths:
      - "cmux-tui/crates/cmux-cas/**"
      - "cmux-tui/crates/cmux-signed-envelope/**"
      - "scripts/cas/**"
      - "scripts/cmux-next/web-bundle-archive.py"
      - ".github/workflows/cas-replay.yml"
      - "scripts/ci/verify_cas_replay_artifact.py"
      - "tests/test_cas_web_ota_replay.py"
      - "tests/test_cas_derived_data_replay.py"
      - "tests/test_cas_mac_update_replay.py"
      - "tests/test_cas_acpmux_update_replay.py"
      - "tests/test_cas_replay_workflow.py"
      - "tests/test_verify_cas_replay_artifact.py"
  workflow_dispatch:
    inputs:
      count:
        description: "bundle publishes to replay (newest first, oldest replayed first)"
        default: "30"
      seeds:
        description: "B1: consecutive DerivedData seeds to replay (each up to 12 GiB unpacked)"
        default: "2"
      behind:
        description: "U2: how many published NIGHTLYs behind the oldest client is"
        default: "20"
      builds:
        description: "A1: consecutive published acpmux builds to replay"
        default: "12"

permissions: {}

concurrency:
  group: cas-replay-${{ github.ref }}
  # A push to feat-cmux-next is never cancelled: a run cancelled mid-way burned its runner minutes for no result
  # (about 40 runner-h/day cancelled, cmuxterm-hq#29655). The group keeps one run going and the newest push pending
  # (GitHub drops an older pending one, which holds no runner). A pull request's newer head still supersedes its run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cas_replay_build:
    name: Build cas-replay once
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || 'cmux-linux' }}
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    outputs:
      artifact_name: ${{ steps.artifact_name.outputs.name }}
      artifact_transport: ${{ steps.artifact-transport.outputs.transport }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Verify CAS replay artifact validation
        run: python3 tests/test_verify_cas_replay_artifact.py

      - name: Set up pinned Rust
        uses: ./.github/actions/setup-cmux-tui-rust

      - name: Cache cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Why: docs/ci/cmux-next-workflow-notes.md#note-210 (pool runners keep different leftover toolchains)
          add-rust-environment-hash-key: false
          cache-bin: false
          workspaces: cmux-tui -> target
          shared-key: cas-replay-linux-${{ hashFiles('cmux-tui/rust-toolchain.toml', 'cmux-tui/Cargo.lock', '.cargo/config.toml') }}
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/feat-cmux-next' }}

      - name: Build cas-replay
        working-directory: cmux-tui
        run: cargo build --release --locked -p cmux-cas --bin cas-replay

      - name: Stage cas-replay and provenance manifest
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/cas-replay-artifact"
          mkdir -p "$stage"
          cp cmux-tui/target/release/cas-replay "$stage/cas-replay"
          chmod +x "$stage/cas-replay"
          source_sha=$(git rev-parse HEAD)
          test "$source_sha" = "$SOURCE_SHA"
          toolchain_sha=$(sha256sum cmux-tui/rust-toolchain.toml | awk '{print $1}')
          binary_sha=$(sha256sum "$stage/cas-replay" | awk '{print $1}')
          python3 - "$stage/manifest.json" "$source_sha" "$toolchain_sha" "$binary_sha" <<'PY'
          import json
          import os
          import sys

          output, source_sha, toolchain_sha, binary_sha = sys.argv[1:]
          manifest = {
              "schema_version": 1,
              "source_sha": source_sha,
              "runner_os": os.environ["RUNNER_OS"],
              "runner_arch": os.environ["RUNNER_ARCH"],
              "build_profile": "release",
              "cargo_package": "cmux-cas",
              "cargo_bin": "cas-replay",
              "rust_toolchain_sha256": toolchain_sha,
              "binary_sha256": binary_sha,
          }
          with open(output, "w", encoding="utf-8") as fh:
              json.dump(manifest, fh, sort_keys=True)
              fh.write("\n")
          PY

      # R2 is authoritative when this job has an OIDC identity. A fork pull request
      # without that identity is the only case that uses GitHub's artifact service.
      - name: Select the run artifact transport
        id: artifact-transport
        env:
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
        run: |
          set -euo pipefail
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] && [ -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "transport=r2" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = pull_request ] && [ "$HEAD_REPOSITORY" != "$GITHUB_REPOSITORY" ]; then
            echo "transport=github" >> "$GITHUB_OUTPUT"
          else
            echo "::error::R2 artifact transport requires GitHub OIDC; only fork pull requests may use GitHub artifacts"
            exit 1
          fi

      - name: Name run-scoped cas-replay artifact
        id: artifact_name
        run: echo "name=cas-replay-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Upload cas-replay executable to R2
        if: steps.artifact-transport.outputs.transport == 'r2'
        uses: ./.github/actions/r2-artifact/upload
        with:
          name: ${{ steps.artifact_name.outputs.name }}
          path: ${{ runner.temp }}/cas-replay-artifact
          if-no-files-found: error
          retention-days: 1

      - name: Upload cas-replay executable without OIDC
        if: steps.artifact-transport.outputs.transport == 'github'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.artifact_name.outputs.name }}
          path: ${{ runner.temp }}/cas-replay-artifact
          if-no-files-found: error
          retention-days: 1

  w1:
    name: cas/1 replay, row W1 (web update bytes per merge)
    needs: cas_replay_build
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || 'cmux-linux' }}
    # About 7 s per 54 MB bundle tree to hash and compress, plus a cold build of one small crate.
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      # The publish runs' list and their bundle artifacts.
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Test the replay driver
        run: python3 tests/test_cas_web_ota_replay.py

      - name: Set up pinned Rust
        uses: ./.github/actions/setup-cmux-tui-rust

      - name: Cache cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Why: docs/ci/cmux-next-workflow-notes.md#note-210 (pool runners keep different leftover toolchains)
          add-rust-environment-hash-key: false
          cache-bin: false
          workspaces: cmux-tui -> target
          shared-key: cas-replay-linux-${{ hashFiles('cmux-tui/rust-toolchain.toml', 'cmux-tui/Cargo.lock', '.cargo/config.toml') }}
          # The producer is the only writer for this run's Cargo cache.
          save-if: false

      - name: cargo test -p cmux-cas
        working-directory: cmux-tui
        run: cargo test -p cmux-cas --locked

      - name: Download cas-replay executable from R2
        if: needs.cas_replay_build.outputs.artifact_transport == 'r2'
        uses: ./.github/actions/r2-artifact/download
        with:
          name: ${{ needs.cas_replay_build.outputs.artifact_name }}
          path: ${{ runner.temp }}/cas-replay-artifact

      - name: Download cas-replay executable without OIDC
        if: needs.cas_replay_build.outputs.artifact_transport == 'github'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ${{ needs.cas_replay_build.outputs.artifact_name }}
          path: ${{ runner.temp }}/cas-replay-artifact

      - name: Verify cas-replay provenance and install it
        run: |
          python3 scripts/ci/verify_cas_replay_artifact.py "$RUNNER_TEMP/cas-replay-artifact" \
            --source-sha "$(git rev-parse HEAD)" \
            --toolchain cmux-tui/rust-toolchain.toml \
            --install-to cmux-tui/target/release/cas-replay

      - name: Replay the newest web bundle publishes (W1)
        env:
          GH_TOKEN: ${{ github.token }}
          COUNT: ${{ inputs.count || '30' }}
        run: |
          set -euo pipefail
          python3 scripts/cas/web_ota_replay.py --cas-replay cmux-tui/target/release/cas-replay \
            --count "$COUNT" --work "$RUNNER_TEMP/cas-replay-w1" | tee "$RUNNER_TEMP/w1.json"

      - name: Keep the rows
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cas-replay-w1
          path: |
            ${{ runner.temp }}/cas-replay-w1/rows.jsonl
            ${{ runner.temp }}/w1.json
          if-no-files-found: ignore
          retention-days: 14

  b1:
    name: cas/1 replay, row B1 (DerivedData seed restore bytes)
    needs: cas_replay_build
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || 'cmux-linux' }}
    # Two seeds of ~9.2 GiB (1.52 GB archives): about 10 min each to stream and unpack, then
    # about 8 min per tree to hash and compress (measured on a lane VM, 2026-11-26).
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
      # The newest seed-derived-data.yml run's job log names the seed key prefix.
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Test the replay driver
        run: python3 tests/test_cas_derived_data_replay.py

      - name: Download cas-replay executable from R2
        if: needs.cas_replay_build.outputs.artifact_transport == 'r2'
        uses: ./.github/actions/r2-artifact/download
        with:
          name: ${{ needs.cas_replay_build.outputs.artifact_name }}
          path: ${{ runner.temp }}/cas-replay-artifact

      - name: Download cas-replay executable without OIDC
        if: needs.cas_replay_build.outputs.artifact_transport == 'github'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ${{ needs.cas_replay_build.outputs.artifact_name }}
          path: ${{ runner.temp }}/cas-replay-artifact

      - name: Verify cas-replay provenance and install it
        run: |
          python3 scripts/ci/verify_cas_replay_artifact.py "$RUNNER_TEMP/cas-replay-artifact" \
            --source-sha "$(git rev-parse HEAD)" \
            --toolchain cmux-tui/rust-toolchain.toml \
            --install-to cmux-tui/target/release/cas-replay

      - name: Replay main's newest DerivedData seeds (B1)
        env:
          GH_TOKEN: ${{ github.token }}
          COUNT: ${{ inputs.seeds || '2' }}
        run: |
          set -euo pipefail
          python3 scripts/cas/derived_data_replay.py --cas-replay cmux-tui/target/release/cas-replay \
            --count "$COUNT" --work "$RUNNER_TEMP/cas-replay-b1" | tee "$RUNNER_TEMP/b1.json"

      - name: Keep the rows
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cas-replay-b1
          path: |
            ${{ runner.temp }}/cas-replay-b1/rows.jsonl
            ${{ runner.temp }}/b1.json
          if-no-files-found: ignore
          retention-days: 14

  u2:
    name: cas/1 replay, row U2 (Mac update bytes, 20 NIGHTLYs behind)
    needs: cas_replay_build
    # U2's input is the published NIGHTLYs, not this repo's paths. A schedule would run only from the
    # default branch (main), so every feat-cmux-next push that runs W1 also asks the feed for its
    # newest NIGHTLY. A push replays only when that build has no replay yet (a cache marker keyed
    # by the build), so a web merge costs one appcast read, not 750 MB of DMGs. PRs and dispatch
    # always replay.
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || 'cmux-linux' }}
    # Three ~250 MB DMGs to fetch and about 10 s each to unpack to a ~750 MB tree; cas-replay
    # compresses every distinct chunk at zstd 19 on one core (the trees, then the DMGs), which is
    # the long part. About 3.5 GB of disk in RUNNER_TEMP.
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      # The nightly.yml runs list, which names the published builds.
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Newest published NIGHTLY
        id: newest
        run: |
          set -euo pipefail
          build=$(curl -fsSL --retry 3 https://files-next.cmux.com/nightly-next/appcast-arm64.xml \
            | python3 -c 'import re,sys; print(re.search(r"<sparkle:version>(\d+)</sparkle:version>", sys.stdin.read()).group(1))')
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "Newest NIGHTLY on the feed: $build"

      - name: Has this NIGHTLY been replayed?
        id: seen
        if: github.event_name == 'push'
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/u2-marker
          key: cas-replay-u2-${{ steps.newest.outputs.build }}
          lookup-only: true

      - name: Test the replay driver
        if: steps.seen.outputs.cache-hit != 'true'
        run: python3 tests/test_cas_mac_update_replay.py

      # 7-Zip 24.09, pinned by hash. Ubuntu 24.04's 7zip package (23.01+dfsg) cannot read the
      # DMG's XZ blocks ("Unsupported Method"); 24.09 reads the DMG and its APFS volume in one pass.
      - name: Install 7-Zip
        if: steps.seen.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/7zip"
          mkdir -p "$d"
          curl -fsSL --retry 3 -o "$d/7z.tar.xz" https://github.com/ip7z/7zip/releases/download/24.09/7z2409-linux-x64.tar.xz
          echo "914c7e20ad5ef8e4d3cf08620ff8894b28fe11b7eb99809d6930870fbe48a281  $d/7z.tar.xz" | sha256sum -c -
          tar -xJf "$d/7z.tar.xz" -C "$d" 7zz
          echo "$d" >> "$GITHUB_PATH"

      - name: Download cas-replay executable from R2
        if: steps.seen.outputs.cache-hit != 'true' && needs.cas_replay_build.outputs.artifact_transport == 'r2'
        uses: ./.github/actions/r2-artifact/download
        with:
          name: ${{ needs.cas_replay_build.outputs.artifact_name }}
          path: ${{ runner.temp }}/cas-replay-artifact

      - name: Download cas-replay executable without OIDC
        if: steps.seen.outputs.cache-hit != 'true' && needs.cas_replay_build.outputs.artifact_transport == 'github'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ${{ needs.cas_replay_build.outputs.artifact_name }}
          path: ${{ runner.temp }}/cas-replay-artifact

      - name: Verify cas-replay provenance and install it
        if: steps.seen.outputs.cache-hit != 'true'
        run: |
          python3 scripts/ci/verify_cas_replay_artifact.py "$RUNNER_TEMP/cas-replay-artifact" \
            --source-sha "$(git rev-parse HEAD)" \
            --toolchain cmux-tui/rust-toolchain.toml \
            --install-to cmux-tui/target/release/cas-replay

      - name: Replay N-20, N-1 and N (U2)
        if: steps.seen.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BEHIND: ${{ inputs.behind || '20' }}
        run: |
          set -euo pipefail
          python3 scripts/cas/mac_update_replay.py --cas-replay cmux-tui/target/release/cas-replay \
            --behind "$BEHIND" --work "$RUNNER_TEMP/cas-replay-u2" | tee "$RUNNER_TEMP/u2.json"

      - name: Mark this NIGHTLY replayed
        if: github.event_name == 'push' && steps.seen.outputs.cache-hit != 'true'
        run: mkdir -p "$RUNNER_TEMP/u2-marker" && cp "$RUNNER_TEMP/u2.json" "$RUNNER_TEMP/u2-marker/"

      - name: Save the marker
        if: github.event_name == 'push' && steps.seen.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/u2-marker
          key: cas-replay-u2-${{ steps.newest.outputs.build }}

      - name: Keep the rows
        if: always() && steps.seen.outputs.cache-hit != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cas-replay-u2
          path: |
            ${{ runner.temp }}/cas-replay-u2/rows.jsonl
            ${{ runner.temp }}/u2.json
          if-no-files-found: ignore
          retention-days: 14

  a1:
    name: cas/1 replay, row A1 (acpmux update bytes per published build)
    # Like U2, its input is what is published, not this repo's paths: a push replays only when the
    # feat-cmux-next channel names a build with no replay yet (a cache marker keyed by its tree key),
    # so a web merge costs one channel read.
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || 'cmux-linux' }}
    # Keying ~1500 commits (16 at a time), 12 x 75 MB downloads, 23 zstd -19 runs and one cas-replay.
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          # Discovery keys feat-cmux-next's first-parent commits; published builds are coalesced.
          fetch-depth: 1600
          ref: feat-cmux-next

      - name: Newest channel build
        id: newest
        run: |
          set -euo pipefail
          key=$(curl -fsSL --retry 3 https://files.cmux.com/cmux-tui/channels/feat-cmux-next.json \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["key"])')
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "feat-cmux-next channel tree: $key"

      - name: Has this build been replayed?
        id: seen
        if: github.event_name == 'push'
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/a1-marker
          key: cas-replay-a1-${{ steps.newest.outputs.key }}
          lookup-only: true

      # The PR's own copy of the driver and its test (the checkout above is feat-cmux-next's).
      - name: Use this commit's driver
        if: steps.seen.outputs.cache-hit != 'true' && github.event_name == 'pull_request'
        env:
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$SHA"
          git checkout "$SHA" -- scripts/cas tests/test_cas_acpmux_update_replay.py cmux-tui/crates/cmux-cas

      - name: Test the replay driver
        if: steps.seen.outputs.cache-hit != 'true'
        run: python3 tests/test_cas_acpmux_update_replay.py

      - name: Set up pinned Rust
        if: steps.seen.outputs.cache-hit != 'true'
        uses: ./.github/actions/setup-cmux-tui-rust

      - name: Cache cargo build
        if: steps.seen.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Why: docs/ci/cmux-next-workflow-notes.md#note-210 (pool runners keep different leftover toolchains)
          add-rust-environment-hash-key: false
          cache-bin: false
          workspaces: cmux-tui -> target
          shared-key: cas-replay-linux-${{ hashFiles('cmux-tui/rust-toolchain.toml', 'cmux-tui/Cargo.lock', '.cargo/config.toml') }}
          save-if: false

      - name: Build cas-replay
        if: steps.seen.outputs.cache-hit != 'true'
        working-directory: cmux-tui
        run: cargo build --release --locked -p cmux-cas --bin cas-replay

      - name: Replay the newest published acpmux builds (A1)
        if: steps.seen.outputs.cache-hit != 'true'
        env:
          BUILDS: ${{ inputs.builds || '12' }}
        run: |
          set -euo pipefail
          python3 scripts/cas/acpmux_update_replay.py --cas-replay cmux-tui/target/release/cas-replay \
            --rev HEAD --walk 1500 --count "$BUILDS" --work "$RUNNER_TEMP/cas-replay-a1" | tee "$RUNNER_TEMP/a1.json"

      - name: Mark this build replayed
        if: github.event_name == 'push' && steps.seen.outputs.cache-hit != 'true'
        run: mkdir -p "$RUNNER_TEMP/a1-marker" && cp "$RUNNER_TEMP/a1.json" "$RUNNER_TEMP/a1-marker/"

      - name: Save the marker
        if: github.event_name == 'push' && steps.seen.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/a1-marker
          key: cas-replay-a1-${{ steps.newest.outputs.key }}

      - name: Keep the rows
        if: always() && steps.seen.outputs.cache-hit != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cas-replay-a1
          path: |
            ${{ runner.temp }}/cas-replay-a1/rows.jsonl
            ${{ runner.temp }}/a1.json
          if-no-files-found: ignore
          retention-days: 14
