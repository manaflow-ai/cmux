name: cmux skill contracts

on:
  pull_request:
    paths:
      - "skills/cmux-browser/**"
      - "skills/cmux-capture/**"
      - "skills/cmux-settings/**"
      - "skills/*/SKILL.md"
      - "web/data/cmux.schema.json"
      - "Sources/CmuxSettingsJSONPathSupport.swift"
      - "tests/test_cmux_settings_supported_paths.py"
      - ".agents/skills"
      - ".claude/skills/**"
      - "skills.sh"
      - "scripts/validate-cmux-browser-skill.py"
      - "tests/test_cmux_browser_skill.py"
      - "tests/test_cmux_capture_skill.py"
      - "tests/test_skill_descriptions.py"
      - "CLI/CMUXCLI+Record.swift"
      - "CLI/CMUXCLI+Screenshot.swift"
      - "CLI/CMUXCLI+TaskHelp.swift"
      - "Sources/WindowRecordingSession.swift"
      - "Sources/TerminalController+WindowRecording.swift"
      - "Sources/TerminalController+WindowScreenshotMethod.swift"
      - "Packages/macOS/CmuxFoundation/Sources/CmuxFoundation/WindowCapture/WindowScreenshotRequest.swift"
      - "Packages/macOS/CmuxFoundation/Sources/CmuxFoundation/WindowRecording/WindowRecordingRequest.swift"
      - "tests/test_cmux_settings_jsonc.py"
      - "tests/test_cmux_settings_transactions.py"
      - ".github/workflows/cmux-skill-contract.yml"
  push:
    branches: [main]
    paths:
      - "skills/cmux-browser/**"
      - "skills/cmux-capture/**"
      - "skills/cmux-settings/**"
      - "skills/*/SKILL.md"
      - "web/data/cmux.schema.json"
      - "Sources/CmuxSettingsJSONPathSupport.swift"
      - "tests/test_cmux_settings_supported_paths.py"
      - ".agents/skills"
      - ".claude/skills/**"
      - "skills.sh"
      - "scripts/validate-cmux-browser-skill.py"
      - "tests/test_cmux_browser_skill.py"
      - "tests/test_cmux_capture_skill.py"
      - "tests/test_skill_descriptions.py"
      - "CLI/CMUXCLI+Record.swift"
      - "CLI/CMUXCLI+Screenshot.swift"
      - "CLI/CMUXCLI+TaskHelp.swift"
      - "Sources/WindowRecordingSession.swift"
      - "Sources/TerminalController+WindowRecording.swift"
      - "Sources/TerminalController+WindowScreenshotMethod.swift"
      - "Packages/macOS/CmuxFoundation/Sources/CmuxFoundation/WindowCapture/WindowScreenshotRequest.swift"
      - "Packages/macOS/CmuxFoundation/Sources/CmuxFoundation/WindowRecording/WindowRecordingRequest.swift"
      - "tests/test_cmux_settings_jsonc.py"
      - "tests/test_cmux_settings_transactions.py"
      - ".github/workflows/cmux-skill-contract.yml"

permissions:
  contents: read

concurrency:
  group: cmux-skill-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-skill:
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-4vcpu-ubuntu-2404' || vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Validate browser skill documentation contract
        run: python3 scripts/validate-cmux-browser-skill.py --no-cli

      - name: Exercise browser skill regression guard
        run: python3 tests/test_cmux_browser_skill.py

      - name: Exercise capture skill regression guard
        run: python3 tests/test_cmux_capture_skill.py

      # Skill validators load the frontmatter with PyYAML, so the check does too.
      - name: Exercise skill description regression guard
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/skill-descriptions-venv"
          "$RUNNER_TEMP/skill-descriptions-venv/bin/python" -m pip install --disable-pip-version-check --no-input PyYAML==6.0.3
          "$RUNNER_TEMP/skill-descriptions-venv/bin/python" tests/test_skill_descriptions.py

      - name: Exercise settings JSONC mutation regressions
        run: python3 tests/test_cmux_settings_jsonc.py

      - name: Exercise settings transaction regressions
        run: python3 tests/test_cmux_settings_transactions.py

      - name: Exercise settings skill path validation
        run: python3 tests/test_cmux_settings_supported_paths.py
