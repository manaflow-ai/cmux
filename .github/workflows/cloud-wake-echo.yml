name: Cloud wake-to-first-echo (staging)

# hq#21300: one 2 vCPU / 4 GiB staging machine paused and woken by the platform 50 times; each wake timed to the first
# echo of a typed character (scripts/cmux-next/cloud-wake-echo.ts, run as cloud-journey.ts --wake-echo 50).
# Runs on a feat-cmux-next pull request whose body carries `wake-echo: run` alone on its line. Same-repo PRs only.
# Secrets: the staging agent test account in cmux-next-vm-image-dev, as cloud-resume-matrix.yml.

on:
  pull_request:
    branches: [feat-cmux-next]
    types: [edited, synchronize, opened, reopened]

permissions:
  contents: read

concurrency:
  group: cloud-wake-echo-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  wake-echo:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.body, 'wake-echo: run') &&
      (github.event.action != 'edited' || github.event.changes.body != null)
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || contains(fromJSON('["blacksmith-8vcpu-ubuntu-2404","blacksmith-16vcpu-ubuntu-2404","blacksmith-4vcpu-ubuntu-2404"]'), vars.LINUX_RUNNER) && vars.LINUX_RUNNER || fromJSON(vars.RUNNER_POOLS).linux_8 }}
    environment:
      name: cmux-next-vm-image-dev
      deployment: false
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
          no-cache: ${{ !startsWith(github.workspace, '/home/runner/work/') }}
      - name: Wake to first echo (staging, 50 cycles, 5 s hold)
        # Under the job's 150: the upload below still runs when this one is cut. The run ends itself by --wake-echo-deadline.
        timeout-minutes: 135
        env:
          CMUX_DOGFOOD_STACK_EMAIL: ${{ secrets.CMUX_DOGFOOD_STACK_EMAIL }}
          CMUX_DOGFOOD_STACK_PASSWORD: ${{ secrets.CMUX_DOGFOOD_STACK_PASSWORD }}
          PRODUCT_TEAM: ${{ vars.CMUX_JOURNEY_PRODUCT_TEAM }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/wake-echo"
          mkdir -p "$out"
          deadline=$(( $(date +%s) + 125 * 60 ))
          bun scripts/cmux-next/cloud-journey.ts --backend staging --out "$out" --model stub \
            --wake-echo 50 --wake-echo-hold 5 --wake-echo-deadline "$deadline"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wake-echo
          path: |
            ${{ runner.temp }}/wake-echo/wake-echo.json
            ${{ runner.temp }}/wake-echo/wake-echo.md
            ${{ runner.temp }}/wake-echo/journey.json
            ${{ runner.temp }}/wake-echo/summary.md
          if-no-files-found: warn
          retention-days: 30
