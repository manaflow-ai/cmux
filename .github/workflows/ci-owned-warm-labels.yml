name: CI owned warm labels
run-name: owned-warm-labels-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}

# A compile admission on an owned Mac keeps its DerivedData, and uploads the
# main commits that build starts from cheaply (owned-warm-keys-<run>-<attempt>,
# ci-macos.yml). When the CI run completes, this labels the runner that ran it
# glaeda-warm-<sha12> for each, and takes those labels off the other runners of
# its pool, so pr_runner_pool.py can send a later admission merging onto one of
# them to that Mac (warm affinity). scripts/ci/owned_warm_labels.py has the
# rules.
#
# Changing runner labels needs the org route App with administration: write,
# so it is triggered by workflow_run and its code comes from main: a pull
# request cannot change it. It trusts only the keys from the artifact; the
# runner comes from the jobs API. Off unless CI_OWNED_WARM_LABELS is 1. It only
# makes API requests, so it runs on a GitHub-hosted runner rather than holding
# a slot in CI's Linux pool.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions: {}

env:
  # Renaming the source workflow silently stops every `workflow_run` consumer
  # of it; tests/test_ci_workflow_run_sources.py derives the expected name from
  # this path. The script confirms the run's own `path` again before acting.
  SOURCE_WORKFLOW_PATHS: .github/workflows/ci.yml

concurrency:
  group: owned-warm-labels-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
  cancel-in-progress: true

jobs:
  label:
    name: Label the owned Mac that kept this run's build
    if: ${{ vars.CI_OWNED_WARM_LABELS == '1' && vars.GLAEDA_ROUTE_APP_ID != '' && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-24.04 # github-hosted-required: only calls the Actions API; keeps CI's Linux pool free
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      # Most runs have no warm keys (no owned Mac, or no warm-keys yet); the
      # download then fails and every step after it is skipped.
      - name: Download the warm keys
        id: keys
        continue-on-error: true
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: owned-warm-keys-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/owned-warm-keys

      - name: Checkout trusted labeler
        if: steps.keys.outcome == 'success'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          persist-credentials: false

      - name: Mint the runner labeling token
        id: route-token
        if: steps.keys.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.GLAEDA_ROUTE_APP_ID }}
          private-key: ${{ secrets.GLAEDA_ROUTE_APP_KEY }}
          permission-administration: write

      - name: Label the runner
        if: steps.keys.outcome == 'success' && steps.route-token.outputs.token != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ROUTE_TOKEN: ${{ steps.route-token.outputs.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          RUN_PATH: ${{ github.event.workflow_run.path }}
          KEYS_FILE: ${{ runner.temp }}/owned-warm-keys/warm-keys.json
        run: python3 scripts/ci/owned_warm_labels.py
