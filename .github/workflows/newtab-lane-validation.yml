name: New Tab lane validation
on:
  push:
    branches: [fix/next-newtab-priority-cx3]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ${{ vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.2'
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24.11.1'
      - name: Install webview dependencies
        run: cd webviews && bun install --frozen-lockfile
      - name: Prove regressions fail before the fix
        run: |
          git restore --source=22426acd48891414bea8ddba21a15a149b0221c8 --worktree webviews/src/agent-session/acpmux/newtab/NewTabScreen.tsx webviews/src/agent-session/acpmux/newtab/NewTabScreen.test.tsx
          set +e
          (cd webviews && bun test src/agent-session/acpmux/newtab/NewTabScreen.test.tsx) > red-test.log 2>&1
          result=$?
          set -e
          cat red-test.log
          git restore --worktree webviews/src/agent-session/acpmux/newtab/NewTabScreen.tsx webviews/src/agent-session/acpmux/newtab/NewTabScreen.test.tsx
          test "$result" -ne 0
      - name: Format and lint
        continue-on-error: true
        run: cd webviews && bun run check:fix
      - name: Focused New Tab and project tests
        continue-on-error: true
        run: cd webviews && bun test src/agent-session/acpmux/newtab src/agent-session/acpmux/NewTabPage.test.tsx src/agent-session/acpmux/omnibar.test.ts src/agent-session/acpmux/ProjectChooser.test.tsx src/agent-session/acpmux/newTabIntent.test.ts
      - name: Regenerate committed web resources
        run: scripts/cmux-next/regenerate-web-bundles.sh
      - name: Localization audit
        continue-on-error: true
        run: |
          scripts/localize-changes --base upstream/feat-cmux-next
          python3 scripts/localization_catalog.py check
      - name: Save generated changes
        if: always()
        run: git diff --binary > generated.patch
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: newtab-generated
          path: |
            generated.patch
            red-test.log
