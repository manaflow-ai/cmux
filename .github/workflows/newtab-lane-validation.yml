name: New Tab acceptance validation
on:
  push:
    branches: [validate/next-newtab-cx3]
permissions:
  contents: read
concurrency:
  group: newtab-acceptance-validation
  cancel-in-progress: true
jobs:
  focused:
    runs-on: ${{ vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.2'
      - name: Install dependencies
        run: cd webviews && bun install --frozen-lockfile
      - name: Focused composer and project behavior
        run: cd webviews && bun test src/agent-session/acpmux/emptyState.test.ts src/agent-session/acpmux/composer.test.tsx src/agent-session/acpmux/quickComposer.test.tsx src/agent-session/acpmux/NewTabPage.test.tsx src/agent-session/acpmux/omnibar.test.ts src/agent-session/acpmux/newtab
