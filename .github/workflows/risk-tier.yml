name: risk tier

# Labels each feat-cmux-next pull request risk:low, risk:normal or risk:high from what it changes
# (docs/ci/risk-tiers.md). Low and normal never wait for a person: the check passes as soon as it
# has graded them (about a minute, alongside the rest of CI). A high head with no sign-off, or with
# a BLOCK, gets a warning only: the lander lands nothing without an independent SHIP at the head and
# never one with a BLOCK there (cmuxterm-hq#5745). Any tier stays red while it takes back another
# pull request's change from the last week, until a `Takes back #N: <why>` line owns it.
# gh-merge-green and next-autoland refuse a red `risk evidence` check.
#
# pull_request_target so fork pull requests can be labeled. It never checks out or runs the
# pull request's code: the classifier comes from the base branch and reads only the changed-file
# list, the commit list and the description through the API.

on:
  pull_request_target:
    branches: [feat-cmux-next]
    types: [opened, synchronize, reopened, edited, ready_for_review, labeled, unlabeled]

permissions:
  contents: read

env:
  # Temporary REST budget attribution: one gh-call line per GitHub API call (scripts/ci/api_call_log/env.sh, fetched at a fixed commit when the checkout has no copy).
  BASH_ENV: '$({ w="${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh"; t="${RUNNER_TEMP:-/nonexistent}/api-call-log-src"; if [ -f "$w" ]; then echo "$w"; elif [ -n "${RUNNER_TEMP:-}" ]; then if [ ! -f "$t/env.sh" ] && [ ! -e "$t.tried" ] && { [ "${RUNNER_OS:-}" = Linux ] || [ "${RUNNER_OS:-}" = macOS ]; } && [ "$(date -u +%Y%m%d%H)" -lt 2026112300 ]; then : > "$t.tried"; mkdir -p "$t.part" && for x in env.sh gh sitecustomize.py isolated.py; do curl -fsSL --max-time 5 -o "$t.part/$x" "https://raw.githubusercontent.com/manaflow-ai/cmux/27647ffd3ae838c63be28ca3e5883dcd68c34518/scripts/ci/api_call_log/$x" || break; done; [ -s "$t.part/isolated.py" ] && mv "$t.part" "$t"; fi; if [ -f "$t/env.sh" ]; then echo "$t/env.sh"; else echo unset BASH_ENV > "$t.off.sh" && echo "$t.off.sh"; fi; fi; } 2>/dev/null)'

jobs:
  evidence:
    # Every event grades, with no job-level `if`: a skipped `risk evidence` run would be the newest
    # check of that name and read as a pass. The unit tests live in risk-tier-tests.yml for the
    # same reason. A newer event cancels an older grading run; gh-merge-green refuses a cancelled
    # check, so the newest finished run is always a real verdict.
    name: risk evidence
    concurrency:
      group: risk-evidence-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.CI_PR_CONTROL_SKIP_FLEET != '1' && 'cmux-gcp-pr-control-jit-x64' || contains(fromJSON('["blacksmith-2vcpu-ubuntu-2404","blacksmith-4vcpu-ubuntu-2404"]'), vars.CI_TRUSTED_RUNNER) && vars.CI_TRUSTED_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }} # ephemeral-required: trusted pull-request-write token; CI_TRUSTED_RUNNER picks the Blacksmith size
    timeout-minutes: 8
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout the base's classifier
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: |
            scripts/ci/risk_tier.py
            scripts/ci/ui_review_advisory.py
          sparse-checkout-cone-mode: false
      # The base's last 9 days of history, for the check that flags taking back a change another
      # pull request merged recently (a stale base). A fresh repository with full blobs, not the
      # sparse checkout above: actions/checkout makes that a blobless partial clone, and blame in
      # one fetches blobs one by one, past its timeout on busy files. This takes about 60 s and
      # 270 MB, then blame takes seconds. Capped at 150 s so the job (5 min) always finishes: a
      # slow fetch skips the check with a warning instead of turning the check red.
      - name: Fetch the base's recent history
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          REPO: ${{ github.repository }}
        run: |
          history="$RUNNER_TEMP/base-history"
          git init -q "$history"
          # Blobless: commits and trees only (16 MB in 5 s, against 681 MB in 115 s with blobs, 11-21); risk_tier.py
          # fetches the versions of the files it blames in one round trip (prefetch_blobs).
          if timeout 120 git -C "$history" fetch -q --no-tags --filter=blob:none --shallow-since="9 days ago" "https://github.com/$REPO.git" \
              "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"; then
            echo "BASE_HISTORY=$history" >> "$GITHUB_ENV"
          else
            echo "::warning::recent-revert check skipped: base history unavailable"
          fi
      - name: Grade the pull request
        id: grade
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 scripts/ci/risk_tier.py pr --repo "$REPO" --number "$NUMBER" ${BASE_HISTORY:+--repo-dir "$BASE_HISTORY"} \
            --event "$GITHUB_EVENT_PATH" --github-output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY" \
            --files-out "$RUNNER_TEMP/changed-files.json"
      # A UI pull request opens before its diff is read (the Mastra Factory reading note): one with no try command
      # gets `Try: cmux app try N` written into its description. It adds and never refuses; a pull request that
      # already names a try command, or says `Try: none, <why>`, costs no call. A write by this token starts no new run.
      - name: Add the try line to a UI pull request
        if: always() && hashFiles('scripts/ci/ui_review_advisory.py') != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          [ -f "$RUNNER_TEMP/changed-files.json" ] || { echo "no changed-file list; skipped"; exit 0; }
          printf '%s' "$BODY" > "$RUNNER_TEMP/body.md"
          python3 scripts/ci/ui_review_advisory.py --add-try "$REPO" --pr "$NUMBER" \
            --body-file "$RUNNER_TEMP/body.md" --files-json "$RUNNER_TEMP/changed-files.json"
      # The label is a convenience; the check's verdict is the gate, so a label API error never fails it.
      - name: Set the risk label
        # An ungraded run (a GitHub rate limit, risk_tier.py's RateLimited) sets no label and leaves the old one.
        if: steps.grade.outputs.label != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          LABEL: ${{ steps.grade.outputs.label }}
          # The labels as this event delivered them (after the change on a labeled or unlabeled event): no read of
          # them from the API, about 283 runs an hour (tests/test_ci_risk_label_from_event.py).
          LABELS_JSON: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          # The tier labels exist: they are created only when adding one fails (a fork, a deleted
          # label). Creating all four on every run cost four refused REST calls, about 400 an hour.
          create_labels() {
            for tier in low normal high; do
              gh label create "risk:$tier" --repo "$REPO" --color "$(case $tier in low) echo 0E8A16;; normal) echo FBCA04;; high) echo B60205;; esac)" \
                --description "Risk tier (docs/ci/risk-tiers.md)" 2>/dev/null || true
            done
            gh label create "risk:human-ok" --repo "$REPO" --color 5319E7 \
              --description "A maintainer looked at this high-risk PR (agents never add it)" 2>/dev/null || true
          }
          current=$(printf '%s' "$LABELS_JSON" | jq -r '.[]')
          # risk:medium is the old name for risk:normal.
          for old in $(grep -E '^risk:(low|medium|normal|high)$' <<<"$current" || true); do
            [ "$old" = "$LABEL" ] || gh pr edit "$NUMBER" --repo "$REPO" --remove-label "$old"
          done
          if ! grep -qx "$LABEL" <<<"$current"; then
            gh pr edit "$NUMBER" --repo "$REPO" --add-label "$LABEL" ||
              { create_labels; gh pr edit "$NUMBER" --repo "$REPO" --add-label "$LABEL"; }
          fi
      # Since cmuxterm-hq#5745 only an unowned takeback keeps this check red: a squash from a stale base
      # that quietly reverts a change merged in the last week is real breakage. A BLOCK (or an unreadable
      # verdict) on a high head only warns here, since every pull request already lands only on an
      # independent review at its exact head and a BLOCK there keeps it out. ENFORCE_FROM stays for
      # gh-merge-green, which reads it from the base.
      - name: Hold high until the head is signed off
        if: steps.grade.outputs.ready != 'true'
        env:
          TIER: ${{ steps.grade.outputs.tier }}
          TAKES_BACK: ${{ steps.grade.outputs.takes_back }}
          TAKES_BACK_FIX: ${{ steps.grade.outputs.takes_back_fix }}
          ENFORCE_FROM: "2026-10-24T00:00:00Z"
        run: |
          if [ "$TAKES_BACK" = true ]; then
            echo "::error::risk:$TIER takes back a recent change. $TAKES_BACK_FIX"
            exit 1
          fi
          echo "::warning::risk:$TIER is held by its review verdict (the job summary says why). The lander refuses a BLOCK at the head; this check does not."
