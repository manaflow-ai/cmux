name: risk tier

# Labels each feat-cmux-next pull request risk:low, risk:normal or risk:high from what it changes
# (docs/ci/risk-tiers.md). Low and normal never wait for a person: the check passes as soon as it
# has graded them (about a minute, alongside the rest of CI). High stays red until the head is signed
# off: an independent review receipt `Review (<reviewer>): SHIP at <full head sha>`, an approving
# review on the head commit, or risk:human-ok from a maintainer. Any tier is
# held while it takes back another pull request's change from the last week, until a
# `Takes back #N: <why>` line owns it. gh-merge-green and next-autoland refuse a red `risk evidence` check.
#
# pull_request_target so fork pull requests can be labeled. It never checks out or runs the
# pull request's code: the classifier comes from the base branch and reads only the changed-file
# list, the commit list and the description through the API.

on:
  pull_request_target:
    branches: [feat-cmux-next]
    types: [opened, synchronize, reopened, edited, ready_for_review, labeled, unlabeled]

permissions:
  contents: read

jobs:
  evidence:
    # Every event grades, with no job-level `if`: a skipped `risk evidence` run would be the newest
    # check of that name and read as a pass. The unit tests live in risk-tier-tests.yml for the
    # same reason. A newer event cancels an older grading run; gh-merge-green refuses a cancelled
    # check, so the newest finished run is always a real verdict.
    name: risk evidence
    concurrency:
      group: risk-evidence-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || contains(fromJSON('["ubuntu-24.04","blacksmith-2vcpu-ubuntu-2404","blacksmith-4vcpu-ubuntu-2404"]'), vars.CI_TRUSTED_RUNNER) && vars.CI_TRUSTED_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }} # ephemeral-required: trusted pull-request-write token; CI_TRUSTED_RUNNER picks Blacksmith (default) or GitHub-hosted
    timeout-minutes: 8
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout the base's classifier
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: scripts/ci/risk_tier.py
          sparse-checkout-cone-mode: false
      # The base's last 9 days of history, for the check that flags taking back a change another
      # pull request merged recently (a stale base). A fresh repository with full blobs, not the
      # sparse checkout above: actions/checkout makes that a blobless partial clone, and blame in
      # one fetches blobs one by one, past its timeout on busy files. This takes about 60 s and
      # 270 MB, then blame takes seconds. Capped at 150 s so the job (5 min) always finishes: a
      # slow fetch skips the check with a warning instead of turning the check red.
      - name: Fetch the base's recent history
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          REPO: ${{ github.repository }}
        run: |
          history="$RUNNER_TEMP/base-history"
          git init -q "$history"
          if timeout 120 git -C "$history" fetch -q --no-tags --shallow-since="9 days ago" "https://github.com/$REPO.git" \
              "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"; then
            echo "BASE_HISTORY=$history" >> "$GITHUB_ENV"
          else
            echo "::warning::recent-revert check skipped: base history unavailable"
          fi
      - name: Grade the pull request
        id: grade
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 scripts/ci/risk_tier.py pr --repo "$REPO" --number "$NUMBER" ${BASE_HISTORY:+--repo-dir "$BASE_HISTORY"} \
            --github-output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"
      # The label is a convenience; the check's verdict is the gate, so a label API error never fails it.
      #
      # Every workflow in the repository shares GITHUB_TOKEN's REST budget of 1,000 requests an
      # hour, and this one grades every event on every open pull request: 340 runs in the 70 minutes
      # before 03:10Z on 2026-10-26. So this step spends no request in the usual case, where the
      # pull request already carries the tier it just graded. It used to open with four
      # `gh label create` calls every run, about 1,160 requests an hour on their own, more than the
      # whole budget, and every one of them only ever answered that the label already exists: all
      # four labels have existed for months, and risk:low and risk:normal still carry the default
      # colour, so not one of those calls ever took effect. The quota they drained is the same one
      # the DEV publish handoff and the CLA checks spend, which ran out repeatedly on 2026-10-26.
      #
      # The labels are created on demand now, only when an add reports one missing, and the pull
      # request's current labels come from the event payload instead of a `gh pr view`.
      #
      # What a run costs, in `gh` invocations, measured with a recording `gh`
      # (tests/test_risk_label_api_budget.py): none in the usual case, where the pull request
      # already carries exactly this tier; one when the live read finds that state; three on a tier
      # change (the read, the add, the remove), plus one per extra stale tier; two when there is no
      # tier yet; two more when an add fails and the label has to be created and re-added. It was
      # five on every run, about 1,450 requests an hour against a 1,000/hour installation budget.
      # (`gh` invocations, not REST requests: a recording `gh` cannot see inside the real one. Each
      # of these verbs is one request today.)
      #
      # Two races, neither closed by cancellation alone, since cancelling a run does not retract an
      # API write already in flight:
      #
      #  - Two runs on different heads can grade different tiers, and both writing would leave two
      #    tier labels. So the live read also reads the head, and a run whose graded head is no
      #    longer the pull request's head writes nothing: it is stale and a newer run is grading.
      #    That costs no extra request, since the read was already being made.
      #  - Two runs on the SAME head grade the same tier, so what they race to write agrees.
      #
      # The payload can still be a moment stale. `labeled` and `unlabeled` are in this workflow's
      # triggers, so a person's or a PAT's relabel fires a fresh run; only an edit made with
      # GITHUB_TOKEN starts no run. That window is the price of the zero-request path.
      - name: Set the risk label
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          LABEL: ${{ steps.grade.outputs.label }}
          GRADED_HEAD: ${{ github.event.pull_request.head.sha }}
          CURRENT_JSON: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          set -uo pipefail
          # The grade step always writes a label and this step is skipped when it fails, so an empty
          # LABEL is unreachable. Refuse it anyway rather than strip the tier the gate already set:
          # an empty LABEL would read every risk label as stale and ask to add one with no name.
          if [ -z "${LABEL:-}" ]; then
            echo "::warning::the grade step produced no label; leaving the pull request's labels alone"
            exit 0
          fi
          # The tier labels in a JSON array of label names, one per line. Exact equality, never a
          # regex: jq's `$` matches before a trailing newline, so `^risk:high$` accepted a label
          # literally named "risk:high\n" and the command substitution below then stripped that
          # newline, leaving the step convinced a tier it does not have is already set. A label name
          # may hold anything, including a newline, so only `==` tells a tier from a lookalike.
          tiers() { jq -r '.[] | select(. == "risk:low" or . == "risk:medium" or . == "risk:normal" or . == "risk:high")' <<<"$1"; }
          # Whether a set of labels is already what we want: this tier, and no other. Safe against
          # the substitution stripping newlines, because a tier value can no longer contain one.
          settled() { [ "$(tiers "$1")" = "$LABEL" ]; }
          add() { gh pr edit "$NUMBER" --repo "$REPO" --add-label "$LABEL"; }

          if settled "$CURRENT_JSON"; then
            echo "$LABEL is already the only risk label; no API request spent"
            exit 0
          fi
          # Only once the payload says an edit is due: confirm against the live pull request before
          # making one. One request on the rare change path, none in the usual case above.
          read_ok=yes
          if ! live="$(gh pr view "$NUMBER" --repo "$REPO" --json labels,headRefOid \
            --jq '{labels: [.labels[].name], head: .headRefOid}')"; then
            echo "::warning::could not read the live labels; going by the event payload"
            read_ok=no
            live_json="$CURRENT_JSON"
          else
            live_json="$(jq -c '.labels' <<<"$live")"
            live_head="$(jq -r '.head' <<<"$live")"
            # A run that graded an older head is stale: a newer run is grading the current one, and
            # two runs writing different tiers would leave the pull request with both.
            if [ -n "${GRADED_HEAD:-}" ] && [ "$live_head" != "$GRADED_HEAD" ]; then
              echo "the head moved from $GRADED_HEAD to $live_head while this run graded; a newer run owns the label"
              exit 0
            fi
            if settled "$live_json"; then
              echo "$LABEL became the only risk label while this run graded; nothing to do"
              exit 0
            fi
          fi

          if [ "$read_ok" = no ]; then
            # The payload may disagree with the pull request in either direction, so it may not
            # authorise a removal: trusting it once skipped the add and removed the old tier,
            # leaving no tier at all. Make sure the wanted label is on, remove nothing, and let a
            # run with a real read do the cleanup. Adding a label a pull request already has is a
            # no-op, so this costs one request and cannot be wrong.
            add || echo "::warning::could not add $LABEL"
            exit 0
          fi

          have=no
          tiers "$live_json" | grep -qxF "$LABEL" && have=yes
          if [ "$have" = no ]; then
            if add; then
              have=yes
            else
              # The only way this label can be missing from the repository is a fresh fork.
              case "$LABEL" in
                risk:low) color=0E8A16 ;;
                risk:normal) color=FBCA04 ;;
                *) color=B60205 ;;
              esac
              gh label create "$LABEL" --repo "$REPO" --color "$color" \
                --description "Risk tier (docs/ci/risk-tiers.md)" || true
              add && have=yes
            fi
          fi
          if [ "$have" = no ]; then
            # Stripping the old tier now would leave the pull request with no tier at all, which is
            # worse than a stale one: `risk evidence` grades from the diff either way, but a person
            # and next-autoland both read the label. Leave it; the next event grades again.
            echo "::warning::could not add $LABEL; leaving the pull request's risk labels alone rather than leaving it with no tier"
            exit 0
          fi
          # `|| true`: grep exits 1 when there is nothing stale, which under `pipefail` would be
          # the script's own exit status. $(...) drops the trailing newline, so an empty result
          # feeds the loop one empty line, which it skips.
          stale="$(tiers "$live_json" | grep -vxF "$LABEL" || true)"
          while IFS= read -r old; do
            [ -n "$old" ] || continue
            gh pr edit "$NUMBER" --repo "$REPO" --remove-label "$old" || echo "::warning::could not remove $old"
          done <<<"$stale"
      # Advisory until ENFORCE_FROM, so high pull requests already in flight can get their sign-off:
      # until then a missing item is a warning and the check passes. gh-merge-green reads this
      # value from the base and, after it, refuses a verdict that finished before it.
      - name: Hold high until the head is signed off
        if: steps.grade.outputs.ready != 'true'
        env:
          TIER: ${{ steps.grade.outputs.tier }}
          ENFORCE_FROM: "2026-10-24T00:00:00Z"
        run: |
          if [ "$(date -u +%s)" -lt "$(date -u -d "$ENFORCE_FROM" +%s)" ]; then
            echo "::warning::risk:$TIER is held (the job summary says why); this is advisory until $ENFORCE_FROM, then it blocks merge."
            echo "Advisory until $ENFORCE_FROM: this check passes now and blocks merge after that." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "::error::risk:$TIER is held before merge; the job summary says what clears it."
          exit 1
