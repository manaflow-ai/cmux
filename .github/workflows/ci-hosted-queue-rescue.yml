name: CI hosted queue rescue

# `workflow_run` is intentional here: this job only reads completed run/job
# metadata and requests a rerun through the Actions API. It never checks out or
# executes pull-request code, and the numeric inputs are validated before use.
# Keep this explanation beside the trigger for dangerous-trigger audits.
# GitHub-hosted jobs can be cancelled by the Actions service after waiting
# about fifteen minutes without ever receiving a runner. A cancelled required
# check is reported as a failure even though no step ran. This trusted watcher
# runs on the Blacksmith pool, identifies that exact no-runner queue timeout,
# and reruns the original hosted workflow. It never runs pull-request code and
# it never cancels a rescue that is already inspecting or rerunning a job.
on:
  workflow_run:
    workflows:
      - CLA policy guard
      - CLA Assistant
      - CI
      - CI fast guards
    types: [completed]

permissions: {}

env:
  # Keep the workflow_run display names tied to their source files. The
  # workflow-source guard will fail if one of these workflows is renamed or
  # moved without updating this rescue.
  SOURCE_WORKFLOW_PATHS: >-
    .github/workflows/cla-policy-guard.yml
    .github/workflows/cla.yml
    .github/workflows/ci.yml
    .github/workflows/ci-fast-guards.yml

concurrency:
  # A rescue is an Actions mutation. Keep duplicate notifications serialized
  # and never cancel the one that may be about to rerun the hosted check.
  group: ci-hosted-queue-rescue-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
  cancel-in-progress: false

jobs:
  rescue:
    name: Rescue a hosted queue timeout
    permissions:
      # Read run/job metadata and request the guarded rerun.
      actions: write
    if: >-
      github.repository == 'manaflow-ai/cmux' &&
      contains(fromJSON('["failure","cancelled"]'), github.event.workflow_run.conclusion) &&
      contains(fromJSON('["pull_request","pull_request_target","issue_comment","merge_group"]'), github.event.workflow_run.event)
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || contains(fromJSON('["blacksmith-4vcpu-ubuntu-2404","blacksmith-16vcpu-ubuntu-2404","blacksmith-32vcpu-ubuntu-2404"]'), vars.LINUX_RUNNER) && vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 5
    steps:
      - name: Mint the cmux-bot token
        id: cmux-bot-token
        if: vars.CMUX_BOT_APP_ID != ''
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.CMUX_BOT_APP_ID }}
          private-key: ${{ secrets.CMUX_BOT_APP_KEY }}
          permission-actions: write
          permission-checks: read
          permission-contents: read
          permission-issues: write
          permission-pull-requests: write

      # The two reads go on the manaflow-glaeda-route App's own budget (GITHUB_TOKEN's ran
      # out on 2026-10-21). The re-run stays on GH_TOKEN: attempt 3 is routed by its
      # triggering actor being github-actions[bot] (ci-macos.yml).
      - name: Mint the glaeda-route token
        id: glaeda-token
        if: vars.GLAEDA_ROUTE_APP_ID != ''
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.GLAEDA_ROUTE_APP_ID }}
          private-key: ${{ secrets.GLAEDA_ROUTE_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-actions: read
          skip-token-revoke: true

      # The glaeda-route App installation's budget around the reads below (a free
      # rate_limit read): the installation is shared, so the delta between `before`
      # and `after` is this step's reads plus whatever else ran meanwhile.
      - name: Log the glaeda-route App budget before
        if: ${{ (steps.glaeda-token.outputs.token) != '' }}
        continue-on-error: true
        timeout-minutes: 1
        env:
          GH_TOKEN: ${{ steps.glaeda-token.outputs.token }}
          PROBE: ${{ github.workflow }}/rescue/before
        run: >-
          gh api rate_limit --jq
          '"app-budget \(env.PROBE) used=\(.resources.core.used) reset=\(.resources.core.reset) at=\(now | floor)"'

      - name: Rerun only a no-runner hosted queue timeout
        env:
          GH_TOKEN: ${{ steps.cmux-bot-token.outputs.token || github.token }}
          READ_TOKEN: ${{ steps.cmux-bot-token.outputs.token || steps.glaeda-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          EVENT_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          EVENT_CREATED_AT: ${{ github.event.workflow_run.created_at }}
          EVENT_UPDATED_AT: ${{ github.event.workflow_run.updated_at }}
          MIN_QUEUE_AGE_SECONDS: "840"
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$EVENT_ATTEMPT" =~ ^[1-9][0-9]*$ ]]

          # The event already carries the attempt and the timestamps. Nearly every
          # run it names ended in seconds, so it is ruled out here without an API
          # call (every workflow shares GITHUB_TOKEN's budget; it ran out on
          # 2026-10-06). The live run is still read below before any rerun.
          (( EVENT_ATTEMPT < 3 )) || {
            echo "retry limit reached for run $RUN_ID"
            exit 0
          }
          if [[ -n "$EVENT_CREATED_AT" && -n "$EVENT_UPDATED_AT" ]]; then
            event_age_seconds=$(( $(date -u -d "$EVENT_UPDATED_AT" +%s) - $(date -u -d "$EVENT_CREATED_AT" +%s) ))
            (( event_age_seconds >= MIN_QUEUE_AGE_SECONDS )) || {
              echo "run ended before the hosted queue timeout (${event_age_seconds}s)"
              exit 0
            }
          fi

          # A read on READ_TOKEN, then on GH_TOKEN when it is refused or unset.
          read_api() {
            local out
            if [[ -n "${READ_TOKEN:-}" && "$READ_TOKEN" != "$GH_TOKEN" ]] && out="$(GH_TOKEN="$READ_TOKEN" gh api "$@")"; then
              printf '%s' "$out"
              return 0
            fi
            gh api "$@"
          }

          run_json="$(read_api "repos/$GH_REPO/actions/runs/$RUN_ID")"
          current_attempt="$(jq -r '.run_attempt // 0' <<<"$run_json")"
          [[ "$current_attempt" == "$EVENT_ATTEMPT" ]] || {
            echo "run attempt already changed; another rescue owns it"
            exit 0
          }
          (( current_attempt < 3 )) || {
            echo "retry limit reached for run $RUN_ID"
            exit 0
          }

          created_at="$(jq -r '.created_at // empty' <<<"$run_json")"
          updated_at="$(jq -r '.updated_at // empty' <<<"$run_json")"
          [[ -n "$created_at" && -n "$updated_at" ]]
          age_seconds=$(( $(date -u -d "$updated_at" +%s) - $(date -u -d "$created_at" +%s) ))
          (( age_seconds >= MIN_QUEUE_AGE_SECONDS )) || {
            echo "run ended before the hosted queue timeout (${age_seconds}s)"
            exit 0
          }

          jobs_json="$(read_api --paginate "repos/$GH_REPO/actions/runs/$RUN_ID/jobs?per_page=100")"
          jq -e '
            (.jobs | length > 0) and
            all(.jobs[];
              .conclusion == "cancelled" and
              ((.runner_id // 0) == 0) and
              ((.runner_name // "") == "") and
              ((.steps // []) | length == 0))
          ' <<<"$jobs_json" >/dev/null || {
            echo "cancelled run had a runner, steps, or a mixed result; leaving it for normal failure handling"
            exit 0
          }

          echo "rerunning hosted queue timeout $RUN_ID (attempt $current_attempt, ${age_seconds}s)"
          gh api -X POST "repos/$GH_REPO/actions/runs/$RUN_ID/rerun" >/dev/null

      - name: Log the glaeda-route App budget after
        if: ${{ !cancelled() && (steps.glaeda-token.outputs.token) != '' }}
        continue-on-error: true
        timeout-minutes: 1
        env:
          GH_TOKEN: ${{ steps.glaeda-token.outputs.token }}
          PROBE: ${{ github.workflow }}/rescue/after
        run: >-
          gh api rate_limit --jq
          '"app-budget \(env.PROBE) used=\(.resources.core.used) reset=\(.resources.core.reset) at=\(now | floor)"'
