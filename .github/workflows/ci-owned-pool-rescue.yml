name: CI persistent pool rescue
run-name: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' && !inputs.run_id) && 'owned-pool-sweeper' || format('owned-pool-rescue-{0}-{1}{2}', inputs.run_id || github.event.workflow_run.id, inputs.run_attempt || github.event.workflow_run.run_attempt, github.event.action == 'completed' && '-completed' || '') }}

# pr_runner_pool.py may put a pull request run's macOS jobs on a persistent
# pool (owned Macs). GitHub never re-routes a queued job, so when that pool is
# busy the run would wait for it indefinitely. This workflow watches such a run
# and, when one of its jobs has waited past CI_OWNED_POOL_RESCUE_SECONDS,
# cancels the run and re-runs it; the retry attempt never takes a persistent
# pool, so it lands on Blacksmith. A job an owned runner refused at job start
# (it failed in seconds, before any step succeeded) gets its failed jobs re-run
# instead, which moves them to the picker's retry_runner on Blacksmith.
# scripts/ci/owned_pool_rescue.py has the rules.
#
# One sweeper watches the busy sources (SWEEP=1, owned_pool_rescue.sweep()).
# The pickers of ci.yml, test-e2e.yml, test-ios.yml, iroh-release-gate.yml and
# cmux-next-dev-daily.yml upload an
# `owned-pool-watch` artifact when they place attempt 1 on an owned pool, and
# ci-macos.yml's late-placement an `owned-pool-watch-late` one when it moves
# jobs onto one; every minute the sweeper lists both names repository-wide
# and gives each new run a thread running the per-run watch. A run marked
# `owned-pool-watch-refusals` (cmux-next.yml, no free overflow) and its
# re-runs are watched for refusals only: a long queue is left alone. Every
# five ticks the sweeper also scans every unfinished cmux-next pull request
# run for an owned job stalled past a bound, queued with no runner or held by
# a runner with no step progress, and moves it to Blacksmith while that label
# has room, a few runs a sweeper at most (owned_pool_rescue.STALL_MOVE; run
# 42878905180 queued over two hours on 2026-11-10). Until
# 2026-09-25 each such run had its own owned-pool-watch job, a "Watch owned
# pool jobs" check on the pull request, dispatching its own rescue run: 263
# rescue runs in the 2 hours to 12:30 UTC, and 59 of the last 60 did nothing.
# A sweeper adopts runs for 5 hours, then stops its watches and gives a
# rescue it started 40 minutes to settle (25, plus 15 for waits through GitHub
# rate limits; RESCUE_GRACE_SECONDS). The two-hourly cron queues the next
# one in the concurrency group, which for sweepers never cancels in progress,
# so it starts as the old one ends and a started rescue is never killed. A
# run the old one re-ran is resumed at attempt 2, and a run refused while no
# sweeper ran is still found by its marker. A dispatch without run_id starts
# a sweeper by hand; one with run_id watches that run alone, at its current
# attempt whatever its number (owned_pool_rescue.dispatch_target()).
#
# Two kinds of source keep the workflow_run trigger:
# - ios-screenshots.yml: release.yml calls it with only `contents: read`, so a
#   job there asking for Actions write would fail the release at parse time
#   (#12149). Its direct dispatches are rare (no run from 2026-09-23 to 09-25).
# nightly.yml (build-nightly-app has no picker either) is watched by the
# sweeper, not a job of its own per run: attempt 1 of main's push and schedule
# runs while NIGHTLY_MAIN_WATCHED, and every nightly-next push
# (owned_pool_rescue.GitHub.nightly_runs()). A per-run watch held a Blacksmith
# runner for the whole build: 16 of this workflow's 31 runner-hours from 22:00Z
# to 00:50Z on 2026-11-21.
# The side lanes (owned_pool_rescue.SIDE_WORKFLOW_PATHS, every other workflow
# owned_pool_sources.py finds on main or feat-cmux-next) have no picker and no
# marker: the sweeper finds each failed run of one by path, which is when a
# refused job's failed jobs can be re-run. They do not wake a fresh rescue
# through workflow_run (one per run, #16076), except a cmux-next.yml DEV daily
# dispatch or feat-cmux-next push that finished red: one rescue per failed
# attempt, so a refused DEV compile never waits on the sweeper's API budget.
# It needs actions: write, and its code comes from main. It runs whenever
# owned pools are on (CI_PR_POOL_OWNED is 1), because a run on an owned pool
# has no other way off it; CI_OWNED_POOL_RESCUE=0 turns it off. The switch
# gets its default before the comparison: an unset variable is null, and
# null == '0' in an expression. It only polls; it runs on an ephemeral
# Blacksmith runner (CI_TRUSTED_RUNNER), not on an owned pool it may rescue.
on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_run:
    workflows:
      - iOS App Store screenshots
      # The DEV publisher's runner job offers verify to an owned Mac on its
      # first workflow_dispatch attempt; watch it for a queue/refusal rescue.
      - cmux NEXT DEV daily
      # cmux-next.yml: only `completed`, and only a failed DEV daily or tip
      # Swift suite dispatch, base-branch push or same-repository pull
      # request run (the job's `if`), so a job the runner hook refused gets
      # its own rescue at any attempt instead of waiting up to two hours for
      # the sweeper, whose cmux-bot listings run out of the hour's API budget
      # (owned_pool_rescue.completed_target()). A pull request's refused swift
      # test stayed red until then (run 40671913126, 2026-10-28). The three
      # sources above act on `requested` only.
      - cmux-next
    types: [requested, completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: One CI, E2E or iOS run to watch (empty starts a sweeper)
        required: false
        default: ""
        type: string
      run_attempt:
        description: The attempt that placed jobs on an owned pool
        required: false
        default: "1"
        type: string
      late:
        description: 1 when the picker placed nothing owned, so the watch waits for ci-macos.yml's late placement
        required: false
        default: "0"
        type: string
      rerun:
        description: 1 to re-run run_id's failed and cancelled jobs as cmux-bot (cancelling it first if it still waits), so its Mac jobs are placed again
        required: false
        default: "0"
        type: string

permissions: {}

env:
  # Temporary REST budget attribution: one gh-call line per GitHub API call (scripts/ci/api_call_log/env.sh, fetched at a fixed commit when the checkout has no copy).
  BASH_ENV: '$({ w="${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh"; t="${RUNNER_TEMP:-/nonexistent}/api-call-log-src"; if [ -f "$w" ]; then echo "$w"; elif [ -n "${RUNNER_TEMP:-}" ]; then if [ ! -f "$t/env.sh" ] && [ ! -e "$t.tried" ] && { [ "${RUNNER_OS:-}" = Linux ] || [ "${RUNNER_OS:-}" = macOS ]; } && [ "$(date -u +%Y%m%d%H)" -lt 2026112300 ]; then : > "$t.tried"; mkdir -p "$t.part" && for x in env.sh gh sitecustomize.py isolated.py; do curl -fsSL --max-time 5 -o "$t.part/$x" "https://raw.githubusercontent.com/manaflow-ai/cmux/27647ffd3ae838c63be28ca3e5883dcd68c34518/scripts/ci/api_call_log/$x" || break; done; [ -s "$t.part/isolated.py" ] && mv "$t.part" "$t"; fi; if [ -f "$t/env.sh" ]; then echo "$t/env.sh"; else echo unset BASH_ENV > "$t.off.sh" && echo "$t.off.sh"; fi; fi; } 2>/dev/null)'
  # Renaming the source workflow silently stops every `workflow_run` consumer
  # of it; tests/test_ci_workflow_run_sources.py derives the expected name from
  # this path. The script confirms the run's own `path` again before acting.
  SOURCE_WORKFLOW_PATHS: >-
    .github/workflows/ios-screenshots.yml
    .github/workflows/cmux-next-dev-daily.yml
    .github/workflows/cmux-next.yml

# A `completed` event has a group of its own: every source's run now wakes one
# (its job skipped unless it is a failed cmux-next DEV run), and in the
# `requested` event's group it would cancel that event's watch as the run ends,
# just when a refusal is found.
concurrency:
  group: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' && !inputs.run_id) && 'owned-pool-sweeper' || format('owned-pool-rescue-{0}-{1}{2}', inputs.run_id || github.event.workflow_run.id, inputs.run_attempt || github.event.workflow_run.run_attempt, github.event.action == 'completed' && '-completed' || '') }}
  # A queued sweeper waits for the running one: its rescues are never killed.
  cancel-in-progress: ${{ !(github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' && !inputs.run_id) }}

jobs:
  rescue:
    name: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' && !inputs.run_id) && 'Sweep runs on persistent pools' || 'Rescue a run stuck on a persistent pool' }}
    if: ${{ vars.CI_PR_POOL_OWNED == '1' && (vars.CI_OWNED_POOL_RESCUE || '1') != '0' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event.action == 'requested' && github.event.workflow_run.path != '.github/workflows/cmux-next.yml' && (github.event.workflow_run.path != '.github/workflows/ios-screenshots.yml' && contains(fromJSON('["pull_request","push","schedule","workflow_dispatch"]'), github.event.workflow_run.event) && (startsWith(vars.CI_SIDE_LANE_RUNNER, 'glaeda-side-') || startsWith(vars.CI_LIGHT_LANE_RUNNER, 'glaeda-side-')) || github.event.workflow_run.path == '.github/workflows/ios-screenshots.yml' && github.event.workflow_run.event == 'workflow_dispatch' || github.event.workflow_run.path == '.github/workflows/cmux-next-dev-daily.yml' && github.event.workflow_run.event == 'workflow_dispatch') && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.run_attempt == 1 || github.event.action == 'completed' && github.event.workflow_run.path == '.github/workflows/cmux-next.yml' && github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.head_repository.full_name == github.repository && (github.event.workflow_run.event == 'workflow_dispatch' && (startsWith(github.event.workflow_run.display_title, 'cmux NEXT DEV daily') || startsWith(github.event.workflow_run.display_title, 'cmux-next tip Swift suite') || startsWith(github.event.workflow_run.display_title, 'cmux-next tip daemon suite')) || github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'feat-cmux-next' || github.event.workflow_run.event == 'pull_request')) }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.CI_QUEUE_RESERVED == '1' && 'cmux-gcp-queue-jit-x64' || vars.CI_REPAIR_SKIP_FLEET != '1' && 'cmux-gcp-repair-jit-x64' || contains(fromJSON('["blacksmith-2vcpu-ubuntu-2404","blacksmith-4vcpu-ubuntu-2404","blacksmith-8vcpu-ubuntu-2404","cmux-gcp-secret-jit-x64"]'), vars.CI_TRUSTED_RUNNER) && vars.CI_TRUSTED_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }} # ephemeral-required: polls the Actions API; keeps CI's Linux pool free; CI_TRUSTED_RUNNER picks the Blacksmith size
    # A sweeper adopts runs for 300 minutes and gives a rescue 40 more to
    # settle, 15 of them for waits through GitHub rate limits (SWEEP_SECONDS,
    # RESCUE_GRACE_SECONDS). A single run's watch is at most 150 minutes plus
    # the same grace (JOB_TIMEOUT_SECONDS).
    timeout-minutes: 345
    permissions:
      actions: write
      contents: read
      # The tailnet OIDC join (the owned stall move's build controller holds) mints a GitHub OIDC token.
      id-token: write
      pull-requests: read
    steps:
      - name: Checkout trusted rescue
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: refs/heads/main
          persist-credentials: false

      - name: Check current declared light-job routes
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' && !inputs.run_id) && vars.CI_HOSTED_LIGHT_RESCUE_DISABLED != '1'
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: refs/heads/feat-cmux-next
          path: .rescue-workflows
          sparse-checkout: .github
          persist-credentials: false

      - name: Mint the cmux-bot token
        id: cmux-bot-token
        if: vars.CMUX_BOT_APP_ID != ''
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.CMUX_BOT_APP_ID }}
          private-key: ${{ secrets.CMUX_BOT_APP_KEY }}
          permission-actions: write
          permission-checks: read
          permission-contents: read
          permission-issues: write
          permission-pull-requests: write

      # The cmux-bot installation's hour when this job starts (GET /rate_limit is free), as an
      # `app-spend-pool:` line HQ's spend publisher sums (scripts/ci/app_spend_mark.py).
      - name: Read the cmux-bot budget before this job
        id: app-spend
        continue-on-error: true
        timeout-minutes: 1
        env:
          APP_SPEND_TOKEN: ${{ steps.cmux-bot-token.outputs.token }}
        run: python3 scripts/ci/app_spend_mark.py start ci-owned-pool-rescue/rescue

      # The rescue reads a failed side-lane run's `needs` graph from its workflow file
      # (owned_pool_rescue.downstream_of_refusals()), which needs PyYAML. Best effort:
      # without it that check excuses nothing and the rescue runs as before.
      - name: Prepare rescue Python
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/rescue-venv"
          "$RUNNER_TEMP/rescue-venv/bin/python" -m pip install --disable-pip-version-check --no-input PyYAML==6.0.3
          echo "$RUNNER_TEMP/rescue-venv/bin" >> "$GITHUB_PATH"

      # The owned stall move (owned_pool_rescue.OWNED_STALL_MOVE) reads the build controller's holds
      # (GET /v1/workers) at move time, which only a tailnet node can reach. Until vars.TS_RESCUE_OIDC_CLIENT_ID
      # names a tailnet OIDC client for this job, the step is skipped, the holds are unreadable, and the owned move
      # moves nothing (it fails closed). Best effort: the rest of the rescue never needs the tailnet.
      - name: Join tailnet for the build controller's holds
        if: vars.TS_RESCUE_OIDC_CLIENT_ID != ''
        continue-on-error: true
        timeout-minutes: 3
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4
        with:
          oauth-client-id: ${{ vars.TS_RESCUE_OIDC_CLIENT_ID }}
          audience: ${{ vars.TS_RESCUE_OIDC_AUDIENCE }}
          tags: tag:ci-rescue

      - name: Watch runs on persistent pools
        env:
          # The minute light-job pass reads as cmux-bot (its own installation pool) and falls back to the
          # repository's shared GITHUB_TOKEN pool, which the NEXT nightly needs, only while cmux-bot's is low or
          # refused (scripts/ci/hosted_light_rescue.py). Never the routing App. Writes stay on github.token.
          HOSTED_LIGHT_TOKEN: ${{ steps.cmux-bot-token.outputs.token || github.token }}
          HOSTED_LIGHT_FALLBACK_TOKEN: ${{ github.token }}
          HOSTED_LIGHT_POLICY: .rescue-workflows/.github
          HOSTED_LIGHT_DISABLED: ${{ vars.CI_HOSTED_LIGHT_RESCUE_DISABLED }}
          # Keep every Actions read on the workflow's existing token. The
          # routing App is reserved for picker decisions, not this polling
          # loop, so a busy sweeper cannot drain its installation quota.
          READ_TOKEN: ${{ steps.cmux-bot-token.outputs.token || github.token }}
          # A CI run's budget grows by a round per queue round the picker allows.
          QUEUE_ROUNDS: ${{ vars.CI_PR_POOL_QUEUE_ROUNDS }}
          GH_TOKEN: ${{ steps.cmux-bot-token.outputs.token || github.token }}
          # The cmux-bot token above lasts an hour and a sweeper five: with the App's key the script
          # mints the next one itself (owned_pool_rescue.GitHub._fresh_token()). Only when that mint
          # worked, so GH_TOKEN is the App's.
          BOT_APP_ID: ${{ steps.cmux-bot-token.outputs.token && vars.CMUX_BOT_APP_ID || '' }}
          BOT_APP_KEY: ${{ steps.cmux-bot-token.outputs.token && secrets.CMUX_BOT_APP_KEY || '' }}
          RESCUE_SECONDS: ${{ vars.CI_OWNED_POOL_RESCUE_SECONDS }}
          # cmux-next uses the repository rescue window. A bot rerun reaches
          # attempt 3 and takes the workflow's Blacksmith fallback; manual
          # reruns stay minis-first through attempt 2.
          SIDE_RESCUE_SECONDS: ${{ vars.CI_OWNED_POOL_RESCUE_SECONDS }}
          POOL_OWNED: ${{ vars.CI_PR_POOL_OWNED }}
          # cmux-next.yml's Mac fallbacks past the bot's attempt 3 read these; the stall move judges each label's
          # room, and moves nothing while one names an owned pool (owned_pool_rescue.stall_destinations()).
          STALL_RUNNER: ${{ vars.MACOS_RUNNER_26 }}
          STALL_POOLS: ${{ vars.RUNNER_POOLS }}
          # Not `on` (unset): cmux-next.yml's Mac fallbacks take CI_SIDE_LANE_RUNNER, so the stall move would only
          # re-queue a job at the back of the owned side lane; it moves nothing (owned_pool_rescue.STALL_SWITCH_OFF).
          # `pr-rescue`: a pull request run's re-run takes Blacksmith, so the move acts on pull request runs only.
          STALL_BLACKSMITH_MACOS: ${{ vars.CI_BLACKSMITH_MACOS }}
          # The side label a cmux-next bot re-run takes while that switch is off: a rescue never sends a job there
          # while its queue is deeper than the one the job leaves (owned_pool_rescue.rerun_side_label()).
          SIDE_LANE_RUNNER: ${{ vars.CI_SIDE_LANE_RUNNER }}
          # While that switch is off, the owned stall move re-routes a stalled run to another owned mini: the runner
          # registrations tell which runners sit on held hosts, and the build controller (default: the one
          # cmuxterm-hq's next-dogfood runner gate reads) names the holds (owned_pool_rescue.owned_route_from_env()).
          STALL_RUNNER_STATE: ${{ vars.CI_RUNNER_STATE }}
          STALL_FLEET_CONTROLLER: ${{ vars.CI_FLEET_CONTROLLER }}
          WATCH_RUN_ID: ${{ inputs.run_id }}
          # The sweeper watches attempt 1 of main's nightly while it asks for the trusted mini
          # (owned_pool_rescue.GitHub.nightly_runs()).
          NIGHTLY_MAIN_WATCHED: ${{ startsWith(vars.CI_SEED_TRUSTED_POOL, 'glaeda-trusted-') && startsWith(vars.CI_NIGHTLY_TRUSTED_RUNNER, 'glaeda-runner-') }}
          SWEEP: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' && !inputs.run_id) && '1' || '' }}
          # 1: wait for ci-macos.yml's late-placement before calling the run ephemeral.
          LATE_PLACEMENT: ${{ inputs.late }}
          # 1 with run_id: re-run that run's failed and cancelled jobs as cmux-bot, cancelling it first if it still
          # waits, so its Mac jobs are placed again (owned_pool_rescue.rerun_named()).
          RERUN: ${{ inputs.rerun }}
        run: python3 scripts/ci/owned_pool_rescue.py

      # This job's spend: the pool again and the difference from the reading above (an upper bound, since
      # every job holding a cmux-bot token spends the same pool).
      - name: Read the cmux-bot budget after this job
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        env:
          APP_SPEND_TOKEN: ${{ steps.cmux-bot-token.outputs.token }}
        run: python3 scripts/ci/app_spend_mark.py end ci-owned-pool-rescue/rescue
