name: CI persistent pool rescue
run-name: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' && !inputs.run_id) && 'owned-pool-sweeper' || format('owned-pool-rescue-{0}-{1}', inputs.run_id || github.event.workflow_run.id, inputs.run_attempt || github.event.workflow_run.run_attempt) }}

# pr_runner_pool.py may put a pull request run's macOS jobs on a persistent
# pool (owned Macs). GitHub never re-routes a queued job, so when that pool is
# busy the run would wait for it indefinitely. This workflow watches such a run
# and, when one of its jobs has waited past CI_OWNED_POOL_RESCUE_SECONDS,
# cancels the run and re-runs it; the retry attempt never takes a persistent
# pool, so it lands on Blacksmith. A job an owned runner refused at job start
# (it failed in seconds, before any step succeeded) gets its failed jobs re-run
# instead, which moves them to the picker's retry_runner on Blacksmith.
# scripts/ci/owned_pool_rescue.py has the rules.
#
# One sweeper watches the busy sources (SWEEP=1, owned_pool_rescue.sweep()).
# The pickers of ci.yml, test-e2e.yml and test-ios.yml upload an
# `owned-pool-watch` artifact when they place attempt 1 on an owned pool, and
# ci-macos.yml's late-placement an `owned-pool-watch-late` one when it moves
# jobs onto one; every minute the sweeper lists both names repository-wide
# and gives each new run a thread running the per-run watch. Until
# 2026-09-25 each such run had its own owned-pool-watch job, a "Watch owned
# pool jobs" check on the pull request, dispatching its own rescue run: 263
# rescue runs in the 2 hours to 12:30 UTC, and 59 of the last 60 did nothing.
# A sweeper adopts runs for 5 hours, then stops its watches and gives a
# rescue it started 25 minutes to settle. The two-hourly cron queues the next
# one in the concurrency group, which for sweepers never cancels in progress,
# so it starts as the old one ends and a started rescue is never killed. A
# run the old one re-ran is resumed at attempt 2, and a run refused while no
# sweeper ran is still found by its marker. A dispatch without run_id starts
# a sweeper by hand; one with run_id watches that run alone.
#
# Two kinds of source keep the workflow_run trigger:
# - ios-screenshots.yml: release.yml calls it with only `contents: read`, so a
#   job there asking for Actions write would fail the release at parse time
#   (#12149). Its direct dispatches are rare (no run from 2026-09-23 to 09-25).
# - The side lanes (auth-refresh-tests, cloud-command-deadlines,
#   cloud-machine-tests, cloud-task-local-tests, iroh-v2, relay-tls,
#   terminal-hang-diagnostics) have no picker: while vars.CI_SIDE_LANE_RUNNER
#   names a glaeda-side-* label, every same-repository attempt-1 pull request
#   run of theirs is on the fleet, so a dispatch would save no run.
# It needs actions: write, and its code comes from main. It runs whenever
# owned pools are on (CI_PR_POOL_OWNED is 1), because a run on an owned pool
# has no other way off it; CI_OWNED_POOL_RESCUE=0 turns it off. The switch
# gets its default before the comparison: an unset variable is null, and
# null == '0' in an expression. It only polls, so it runs on a GitHub-hosted
# runner rather than holding a slot in CI's Linux pool.
on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_run:
    workflows:
      - iOS App Store screenshots
      # Side lanes (owned_pool_rescue.SIDE_WORKFLOW_PATHS): watched only while
      # vars.CI_SIDE_LANE_RUNNER routes them to the fleet.
      - Auth and session lifecycle
      - Cloud command deadlines
      - Cloud machine lifecycle
      - Cloud task-local lifecycle
      - IROH v2
      - Relay TLS system trust
      - Terminal hang diagnostics
    types: [requested]
  workflow_dispatch:
    inputs:
      run_id:
        description: One CI, E2E or iOS run to watch (empty starts a sweeper)
        required: false
        default: ""
        type: string
      run_attempt:
        description: The attempt that placed jobs on an owned pool
        required: false
        default: "1"
        type: string
      late:
        description: 1 when the picker placed nothing owned, so the watch waits for ci-macos.yml's late placement
        required: false
        default: "0"
        type: string

permissions: {}

env:
  # Renaming the source workflow silently stops every `workflow_run` consumer
  # of it; tests/test_ci_workflow_run_sources.py derives the expected name from
  # this path. The script confirms the run's own `path` again before acting.
  SOURCE_WORKFLOW_PATHS: >-
    .github/workflows/ios-screenshots.yml
    .github/workflows/auth-refresh-tests.yml .github/workflows/cloud-command-deadlines.yml
    .github/workflows/cloud-machine-tests.yml .github/workflows/cloud-task-local-tests.yml
    .github/workflows/iroh-v2.yml .github/workflows/relay-tls.yml
    .github/workflows/terminal-hang-diagnostics.yml

concurrency:
  group: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' && !inputs.run_id) && 'owned-pool-sweeper' || format('owned-pool-rescue-{0}-{1}', inputs.run_id || github.event.workflow_run.id, inputs.run_attempt || github.event.workflow_run.run_attempt) }}
  # A queued sweeper waits for the running one: its rescues are never killed.
  cancel-in-progress: ${{ !(github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' && !inputs.run_id) }}

jobs:
  rescue:
    name: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' && !inputs.run_id) && 'Sweep runs on persistent pools' || 'Rescue a run stuck on a persistent pool' }}
    if: ${{ vars.CI_PR_POOL_OWNED == '1' && (vars.CI_OWNED_POOL_RESCUE || '1') != '0' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event == 'pull_request' && startsWith(vars.CI_SIDE_LANE_RUNNER, 'glaeda-side-') || github.event.workflow_run.path == '.github/workflows/ios-screenshots.yml' && github.event.workflow_run.event == 'workflow_dispatch') && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.run_attempt == 1) }}
    runs-on: ubuntu-24.04 # github-hosted-required: polls the Actions API; keeps CI's Linux pool free
    # A sweeper adopts runs for 300 minutes and gives a rescue 25 more to
    # settle (SWEEP_SECONDS, RESCUE_GRACE_SECONDS). A single run's watch is
    # at most 150 minutes plus the same grace (JOB_TIMEOUT_SECONDS).
    timeout-minutes: 340
    permissions:
      actions: write
      contents: read
      pull-requests: read
    steps:
      - name: Checkout trusted rescue
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          persist-credentials: false

      - name: Watch runs on persistent pools
        env:
          # A CI run's budget grows by a round per queue round the picker allows.
          QUEUE_ROUNDS: ${{ vars.CI_PR_POOL_QUEUE_ROUNDS }}
          GH_TOKEN: ${{ github.token }}
          RESCUE_SECONDS: ${{ vars.CI_OWNED_POOL_RESCUE_SECONDS }}
          POOL_OWNED: ${{ vars.CI_PR_POOL_OWNED }}
          WATCH_RUN_ID: ${{ inputs.run_id }}
          SWEEP: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' && !inputs.run_id) && '1' || '' }}
          # 1: wait for ci-macos.yml's late-placement before calling the run ephemeral.
          LATE_PLACEMENT: ${{ inputs.late }}
          # 1: a stuck run's full re-run may take the light pool; watch it.
          OWNED_LIGHT_RETRY: ${{ vars.CI_OWNED_LIGHT_RETRY }}
        run: python3 scripts/ci/owned_pool_rescue.py
