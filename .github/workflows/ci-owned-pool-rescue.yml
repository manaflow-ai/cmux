name: CI persistent pool rescue
run-name: owned-pool-rescue-${{ inputs.run_id }}-${{ inputs.run_attempt }}

# pr_runner_pool.py may put a pull request run's macOS jobs on a persistent
# pool (owned Macs). GitHub never re-routes a queued job, so when that pool is
# busy the run would wait for it indefinitely. This workflow watches such a run
# and, when one of its jobs has waited past CI_OWNED_POOL_RESCUE_SECONDS,
# cancels the run and re-runs it; the retry attempt never takes a persistent
# pool, so it lands on Blacksmith. A job an owned runner refused at job start
# (it failed in seconds, before any step succeeded) gets its failed jobs re-run
# instead, which moves them to the picker's retry_runner on Blacksmith.
# scripts/ci/owned_pool_rescue.py has the rules.
#
# A dispatch starts it: ci.yml's and test-e2e.yml's owned-pool-watch job
# dispatches it on main with the run's id, only when the picker placed jobs on
# an owned pool. A run on an ephemeral pool, a fork, a push or a retry attempt
# starts no watcher, so there is no rescue workflow run for it at all. Until
# 2026-09-25 this was a workflow_run `requested` consumer of CI and E2E and
# started for every run: 578 runs from 2026-09-24 to 09-25 05:00 UTC, 361 of
# which were skipped (fork pull requests) or found no owned pool. The script
# reads the run from the API and applies the checks the event filter did
# (ci.yml or test-e2e.yml, a same-repository pull request run or an E2E
# dispatch, attempt 1), so a dispatch naming any other run does nothing. Only
# attempt 1 is watched, so the re-run this workflow starts is never watched
# twice.
# It needs actions: write, and its code comes from main. It runs whenever
# owned pools are on (CI_PR_POOL_OWNED is 1), because a run on an owned pool
# has no other way off it; CI_OWNED_POOL_RESCUE=0 turns it off. The switch
# gets its default before the comparison: an unset variable is null, and
# null == '0' in an expression. It only polls, so it runs on a GitHub-hosted
# runner rather than holding a slot in CI's Linux pool.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: The CI or E2E run to watch
        required: true
        type: string
      run_attempt:
        description: The attempt that placed jobs on an owned pool
        required: false
        default: "1"
        type: string

permissions: {}

concurrency:
  group: owned-pool-rescue-${{ inputs.run_id }}-${{ inputs.run_attempt }}
  cancel-in-progress: true

jobs:
  rescue:
    name: Rescue a run stuck on a persistent pool
    if: ${{ vars.CI_PR_POOL_OWNED == '1' && (vars.CI_OWNED_POOL_RESCUE || '1') != '0' }}
    runs-on: ubuntu-24.04 # github-hosted-required: polls the Actions API; keeps CI's Linux pool free
    # The watch limit is 60 minutes (150 for an E2E run), reads may retry, and
    # a rescue may run 25 more for a cancel to settle and the re-run
    # (JOB_TIMEOUT_SECONDS in the script).
    timeout-minutes: 180
    permissions:
      actions: write
      contents: read
      pull-requests: read
    steps:
      - name: Checkout trusted rescue
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          persist-credentials: false

      - name: Watch the run's persistent pool jobs
        env:
          GH_TOKEN: ${{ github.token }}
          RESCUE_SECONDS: ${{ vars.CI_OWNED_POOL_RESCUE_SECONDS }}
          POOL_OWNED: ${{ vars.CI_PR_POOL_OWNED }}
          WATCH_RUN_ID: ${{ inputs.run_id }}
        run: python3 scripts/ci/owned_pool_rescue.py
