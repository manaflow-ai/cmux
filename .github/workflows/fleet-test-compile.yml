name: fleet test-compile (advisory)

# Advisory: compile the Swift test targets a pull request can break, on the
# fleet's Linux pool, and fail this check when one does not compile.
#
# fleet/compile-check (fleet-compile-check.yml) compiles only the app
# executable, which links no test target. #23360 (a throwing call inside
# #expect without try) and #23163 (a fake that missed a protocol requirement)
# passed it and broke feat-cmux-next's test build. This check covers that gap.
#
# It runs `cmux-ci compile-check --package DIR` (`swift build --build-tests` of
# each planned package on a Linux pool VM), not a Mac step. Until 2026-11-15
# it was a light fleet step on a Mac (package-test-lane.sh compile-tests, 20 to
# 60 minutes each), and 5 to 9 of them at once kept the owned minis at a load
# that held their side-std listeners offline while 65 required PR jobs queued.
# On the pool CmuxNext with all its tests compiled in 490 s and each other lane
# package in 26 to 47 s; a test target that does not compile fails the job
# (exit 1). The pool compiles every test target of a planned package, a
# superset of the plan's target list.
#
# It gates nothing: fleet/compile-check, the landing gate and the Release
# compile neither wait for it nor read it. A red here is a test
# target that does not compile at the PR's merge commit. The workflow's name
# says "(advisory)" like its job's, so a reader that judges a whole check suite
# (cmuxterm-hq now_pr_verdict.py, the head's verdict time) skips it as well.
#
# Since 2026-11-25 the compile job runs on a Linux runner and reads the verdict
# of the build fleet controller's own test-target compile of the pull request
# head (scripts/ci/fleet_compile_result.py --phase test-compile, the trusted
# base copy), as cmux-next.yml's app compile does: the read submits it, and no
# Mac runner waits on the pool. Before, the job held a gateway Mac
# (vars.CI_TEST_COMPILE_GATEWAY) only to wait for the client. That label is now
# a fallback: the mac-fallback job runs the old client on it only when the read
# gives no verdict and the variable is set (never the required compile's
# CI_COMPILE_CHECK_GATEWAY: on 2026-10-22 this check held 13 of the 19 runners
# serving glaeda-side-light-xcode-27.2 while 71 required app compiles queued).
#
# The plan (scripts/ci/compile_test_plan.py, over the merge commit's diff from
# its base) is the macOS package lane's packages whose sources or path
# dependencies changed. An empty plan passes on a Linux runner in seconds and
# queues nothing. A hot-only pull request (scripts/ci/cmux_next_route.py
# --hot-only, the router cmux-next.yml skips its Mac app jobs by) gets an empty
# plan: it changes nothing a Swift test target reads.
#
# CmuxNext is compiled here again. From 2026-10-30 it was skipped, because
# cmux-next.yml's swift test job ran `swift build --build-tests` on every
# same-repository pull request (650 duplicate fleet compile-tests steps, about
# 55 Mac worker hours, in 24 hours). Since 2026-11-05 that job runs on a pull
# request only with full-ci: run on every PR push it was cancelled by a merge,
# a newer push or a re-run before it finished (37 of 78 check runs cancelled,
# none passed). So this check is again what compiles a PR's CmuxNext test
# targets.
#
# Since 2026-11-21 a pull request runs it only with the full-ci label. Leo,
# 2026-11-21: "id rather we simply cut shit now and revisit later." Each run
# held a Mac gateway runner while its client waited on the Linux pool: 132
# runner-hours a day over 11-13..21 (ci-dash's Mac job log, 4,393 jobs at a
# median 0.01 cores), the largest share of the Mac runner time spent waiting.
# It gates nothing, and over 11-13..19 it was the only real red on 4.3% of PR
# heads (cmuxterm-hq docs/ci/bottleneck-and-skip-candidates-2026-11-21.md).
# What it would have caught, cmux-next-tip-test-compile.yml catches after the
# merge: it compiles the change since its last green run on every push and
# opens the "Swift test targets do not compile" issue. Revert this condition
# to run it on every same-repository pull request again.

# Cut from pull requests on 2026-11-21 (ci-time-map: advisory, read by nothing; ~6.9k fleet runner-min a day). It stays runnable
# by workflow_dispatch; cmux-next-tip-test-compile.yml still compiles the test targets on the base.
on:
  workflow_dispatch:

permissions: {}

env:
  # Temporary REST budget attribution: one gh-call line per GitHub API call (scripts/ci/api_call_log/env.sh, fetched at a fixed commit when the checkout has no copy).
  BASH_ENV: '$({ w="${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh"; t="${RUNNER_TEMP:-/nonexistent}/api-call-log-src"; if [ -f "$w" ]; then echo "$w"; elif [ -n "${RUNNER_TEMP:-}" ]; then if [ ! -f "$t/env.sh" ] && [ ! -e "$t.tried" ] && { [ "${RUNNER_OS:-}" = Linux ] || [ "${RUNNER_OS:-}" = macOS ]; } && [ "$(date -u +%Y%m%d%H)" -lt 2026112300 ]; then : > "$t.tried"; mkdir -p "$t.part" && for x in env.sh gh sitecustomize.py isolated.py; do curl -fsSL --max-time 5 -o "$t.part/$x" "https://raw.githubusercontent.com/manaflow-ai/cmux/27647ffd3ae838c63be28ca3e5883dcd68c34518/scripts/ci/api_call_log/$x" || break; done; [ -s "$t.part/isolated.py" ] && mv "$t.part" "$t"; fi; if [ -f "$t/env.sh" ]; then echo "$t/env.sh"; else echo unset BASH_ENV > "$t.off.sh" && echo "$t.off.sh"; fi; fi; } 2>/dev/null)'

concurrency:
  group: fleet-test-compile-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  plan:
    name: fleet test-compile plan
    # The fleet takes same-repository pull requests only (as the Swift canary's fleet job).
    # A pull request compiles its test targets here only with full-ci (2026-11-21, below); the tip compile
    # (cmux-next-tip-test-compile.yml) checks every feat-cmux-next push that reaches a test target.
    if: ${{ github.repository_owner == 'manaflow-ai' && github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.labels.*.name, 'full-ci') }}
    # Blacksmith, behind the fork branch, so a GitHub billing block cannot stop it (tests/test_ci_self_hosted_guard.sh).
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || 'cmux-linux' }}
    permissions:
      contents: read
    timeout-minutes: 5
    outputs:
      needed: ${{ steps.plan.outputs.needed }}
      base: ${{ steps.plan.outputs.base }}
      packages: ${{ steps.plan.outputs.packages }}
    steps:
      - name: Checkout the merge commit and its base
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: false
          fetch-depth: 2

      # Leo, 2026-11-15: "if it's only needing to swap out the app, isn't there like a more minimal set of CI
      # that we can get it to do". A pull request cmux_next_route.py calls hot-only (every file a running app
      # takes live through hot-apply.py, or one that reaches no app tier; no full-ci or dev-build label) changes
      # nothing a Swift test target reads, so it compiles none: an empty plan, no gateway runner, no Mac.
      # The router's verdict on this same diff, never a copy of its rule. A router error keeps the plan.
      - name: Plan the test targets this change reaches
        id: plan
        env:
          EVENT_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          set -euo pipefail
          base="$(git rev-parse HEAD^1)"
          git diff --no-renames --name-only "$base" HEAD > "$RUNNER_TEMP/changed.txt"
          python3 scripts/ci/compile_test_plan.py --changed-files "$RUNNER_TEMP/changed.txt" > "$RUNNER_TEMP/plan.txt"
          hot_only=false
          if python3 scripts/ci/cmux_next_route.py --hot-only --event pull_request \
              --changed-files "$RUNNER_TEMP/changed.txt" --labels "$EVENT_LABELS" --base-rev "$base" \
              > "$RUNNER_TEMP/hot.txt"; then
            if grep -qx 'hot_only=true' "$RUNNER_TEMP/hot.txt"; then hot_only=true; fi
          else
            echo "::warning title=fleet test-compile::cmux_next_route.py --hot-only failed; compiling the plan."
          fi
          planned="$(cat "$RUNNER_TEMP/plan.txt")"
          if [[ "$hot_only" == true ]]; then
            : > "$RUNNER_TEMP/plan.txt"
          fi
          {
            echo "### fleet test-compile plan"
            echo
            if [[ "$hot_only" == true ]]; then
              echo "Hot-only pull request ($(grep '^hot_layers=' "$RUNNER_TEMP/hot.txt" | cut -d= -f2-)): it changes nothing a Swift test target reads, so nothing compiles and no Mac is queued."
              if [[ -n "$planned" ]]; then
                echo
                echo 'The path plan would have compiled:'
                echo
                echo '```'
                echo "$planned"
                echo '```'
              fi
            elif [ -s "$RUNNER_TEMP/plan.txt" ]; then
              echo 'Package, then its test targets (none listed: every one):'
              echo
              echo '```'
              cat "$RUNNER_TEMP/plan.txt"
              echo '```'
            else
              echo "The change reaches no test target: nothing to compile, no Mac queued."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/plan.txt"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          # The package directory names under Packages/ (the first word of each plan line), space-separated.
          echo "packages=$(awk 'NF { n = split($1, part, "/"); printf "%s%s", sep, part[n]; sep = " " }' "$RUNNER_TEMP/plan.txt")" >> "$GITHUB_OUTPUT"
          if [ -s "$RUNNER_TEMP/plan.txt" ]; then echo "needed=true"; else echo "needed=false"; fi >> "$GITHUB_OUTPUT"

  compile:
    name: fleet/test-compile (advisory)
    needs: plan
    # A Linux runner reads the controller's verdict; no Mac waits on the pool (2026-11-25).
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || 'cmux-linux' }}
    permissions:
      contents: read
    # The read waits up to 3600 s for the pool's compile (a cold build of a purged package took over 55 minutes).
    timeout-minutes: 75
    outputs:
      verdict: ${{ steps.read.outputs.verdict }}
    steps:
      # The reader comes from the base, never the pull request's tree (as cmux-next.yml's app compile reads it).
      - name: Checkout the trusted compile result reader
        if: ${{ needs.plan.outputs.needed == 'true' }}
        continue-on-error: true
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          sparse-checkout: scripts/ci
          persist-credentials: false
      # The controller submits the head's test-target compile (`swift build --build-tests` of each planned package
      # on the Linux pool) when this read names it, and answers its verdict. pass is green, fail is red, and
      # anything else is no verdict: a warning, and the Mac fallback below runs when CI_TEST_COMPILE_GATEWAY is set.
      - name: Read the Linux pool's test-target compile
        id: read
        env:
          NEEDED: ${{ needs.plan.outputs.needed }}
          REF: ${{ github.event.pull_request.head.sha || github.sha }}
          PR: ${{ github.event.pull_request.number }}
          PACKAGES: ${{ needs.plan.outputs.packages }}
        run: |
          set -uo pipefail
          if [[ "$NEEDED" != true ]]; then
            echo "The change reaches no test target: nothing to compile."
            echo "verdict=skip" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          no_verdict() {
            echo "::warning title=fleet test-compile::No test-compile verdict: $1"
            echo "verdict=none" >> "$GITHUB_OUTPUT"
            exit 0
          }
          packages=""
          for package in $PACKAGES; do
            if ! [[ "$package" =~ ^[A-Za-z][A-Za-z0-9._-]*$ ]]; then
              no_verdict "the plan named '$package', not a package directory"
            fi
            packages="${packages:+$packages,}$package"
          done
          [[ -n "$packages" ]] || no_verdict "the plan named no package"
          reader=scripts/ci/fleet_compile_result.py
          if ! [[ -f "$reader" ]] || ! grep -q '"test-compile"' "$reader"; then
            no_verdict "the trusted compile result reader predates the test-compile read"
          fi
          word="$(python3 "$reader" --sha "$REF" --repo "$GITHUB_REPOSITORY" --pr "$PR" --phase test-compile \
            --packages "$packages" --wait 3600 --no-record 300 2>"$RUNNER_TEMP/fleet-result.err")" || word=none
          why=""
          if [[ -f "$RUNNER_TEMP/fleet-result.err" ]]; then
            cat "$RUNNER_TEMP/fleet-result.err" >&2
            why="$(sed -n 's/^fleet compile result for [0-9a-f]*: [a-z]* (\(.*\))$/\1/p' "$RUNNER_TEMP/fleet-result.err" | tail -n 1)"
          fi
          case "$word" in
            pass)
              echo "verdict=pass" >> "$GITHUB_OUTPUT"
              echo "Every planned test target compiled at $REF ($packages)." ;;
            fail)
              echo "verdict=fail" >> "$GITHUB_OUTPUT"
              echo "::error title=fleet test-compile::A test target this change reaches does not compile (advisory): ${why:-no reason given}"
              exit 1 ;;
            *) no_verdict "${why:-$word}" ;;
          esac

  # Only when the read gives no verdict and CI_TEST_COMPILE_GATEWAY names a label: the old gateway client, which
  # holds a fleet runner while the pool compiles. Unset, nothing queues.
  mac-fallback:
    name: fleet/test-compile fallback (advisory)
    needs: [plan, compile]
    if: ${{ needs.compile.outputs.verdict == 'none' && vars.CI_TEST_COMPILE_GATEWAY != '' }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || 'glaeda-gateway-xcode-27.2' }} # frozen-label: CI_TEST_COMPILE_GATEWAY (cmux#54437)
    permissions: {}
    # Longer than the client's queue (1200 s) plus run (3600 s) timeouts and its
    # report: a job timeout concludes as a failure, which would read as red.
    timeout-minutes: 90
    steps:
      - name: Say why this runs
        run: echo "::warning title=mac fallback::The Linux read of the controller's test-target compile gave no verdict; compiling through the gateway client."
      # The gateway checks nothing out: the pool fetches the merge commit itself.
      # Exit 0 is a pass. Exit 1 is a compile failure (this check goes red).
      # Anything else (69, 75 or 124: no pool VM, queue or run timeout, the
      # client) is no verdict: a warning, and this check stays green.
      - name: Compile the planned test targets through the gateway client
        env:
          REF: ${{ github.sha }}
          PACKAGES: ${{ needs.plan.outputs.packages }}
        run: |
          set -uo pipefail
          client="${CMUX_CI_CLIENT:-$HOME/.local/bin/cmux-ci}"
          if ! [[ -x "$client" ]]; then
            echo "::warning title=fleet test-compile::$client is not installed on runner $RUNNER_NAME; no test-compile verdict."
            exit 0
          fi
          args=()
          for package in $PACKAGES; do
            if ! [[ "$package" =~ ^[A-Za-z0-9._-]+$ ]]; then
              echo "::warning title=fleet test-compile::The plan named '$package', not a package directory; no test-compile verdict."
              exit 0
            fi
            args+=(--package "$package")
          done
          if [[ ${#args[@]} -eq 0 ]]; then
            echo "::warning title=fleet test-compile::The plan named no package; no test-compile verdict."
            exit 0
          fi
          # Advisory: the controller's `idle` request class (cmuxterm-hq#23557), when this runner's client has it.
          if "$client" compile-check --help 2>/dev/null | grep -q -- '--priority {'; then
            args+=(--priority idle)
          fi
          status=0
          "$client" compile-check --ref "$REF" "${args[@]}" \
            --timeout 3600 --queue-timeout 1200 || status=$?
          if [[ "$status" -eq 0 ]]; then
            echo "Every planned test target compiled."
          elif [[ "$status" -eq 1 ]]; then
            echo "::error title=fleet test-compile::A test target this change reaches does not compile (advisory; see the errors above)."
            exit 1
          else
            echo "::warning title=fleet test-compile::No test-compile verdict (exit $status)."
          fi
