name: cmux-next size budget

# The bundle-size budget of a pull request into feat-cmux-next. The nightly DMG grew from 205 MB
# (2026-10-20) to 285 MB (2026-11-12) against a 216 MB cap while the only size check ran once a night
# and never blocked (cmuxterm-hq docs/perf/bundle-size.md). Leo, 2026-11-12: "in terms of the
# performance on, like, the bundle size and whatever ... I don't really know what's going on there."
#
# scripts/cmux-next/bundle-size-pr.py compares the change with its base on Linux: the committed
# bytes the app ships, the built web bundles (built for the base and the head when a web input
# changed, web-bundle-key.py --routed) and the crates each shipped Rust binary links. Growth over
# the budget's threshold, or a new crate, fails until the description has a line
# `size: <reason>`. Editing the description re-runs it.
#
# What the head can change: the job that decides (size-budget) runs no code of the head. It reads
# the head only through git, and runs the base commit's checker and budget, written out with
# `git show` before anything else runs. The head's web build runs in its own job (web-head) and hands
# over only byte counts, so a head build script can misreport its own web bytes but cannot reach
# the checker, the budget, the base's counts or the files and Rust checks. This file itself is read
# from the pull request's merge commit, as every pull_request workflow is; a change to it shows in
# the diff under review.
on:
  # Started only by pr-router.yml (one router per push, RFD 0023), which lists the changed files once and
  # calls this workflow when the change touches an input it measures (scripts/ci/pr_router.json
  # `affects`). Its check runs report as `cmux-next size budget / ...`; when the router does not start it,
  # one skipped `cmux-next size budget` check reports instead.
  workflow_call:
    inputs:
      web_bundle_key:
        required: false
        type: string
        default: ""
      web_bundle_transport:
        required: false
        type: string
        default: ""
      web_bundle_artifact:
        required: false
        type: string
        default: ""

permissions: {}

# The description only matters through its `size:` line. An edit with no `size:` line before or
# after it (a title, a base, a HOLD line) measures nothing: it takes no runner and its own group,
# so it never cancels a push's or a `size:` edit's run. GitHub's contains() ignores case, as the
# checker's REASON_LINE does (pattern pr-edit-fans-out-ci in cmuxterm-hq docs/handbook: 130 HOLD-line
# edits on 2026-11-17 queued this workflow 41 times).
concurrency:
  group: cmux-next-size-budget-${{ github.event.pull_request.number }}${{ github.event.action == 'edited' && !(github.event.changes.body && (contains(github.event.pull_request.body, 'size:') || contains(github.event.changes.body.from, 'size:'))) && format('-edit-{0}', github.run_id) || '' }}
  cancel-in-progress: true

env:
  # Temporary REST budget attribution: one gh-call line per GitHub API call (scripts/ci/api_call_log/env.sh, fetched at a fixed commit when the checkout has no copy).
  BASH_ENV: '$({ w="${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh"; t="${RUNNER_TEMP:-/nonexistent}/api-call-log-src"; if [ -f "$w" ]; then echo "$w"; elif [ -n "${RUNNER_TEMP:-}" ]; then if [ ! -f "$t/env.sh" ] && [ ! -e "$t.tried" ] && { [ "${RUNNER_OS:-}" = Linux ] || [ "${RUNNER_OS:-}" = macOS ]; } && [ "$(date -u +%Y%m%d%H)" -lt 2026112300 ]; then : > "$t.tried"; mkdir -p "$t.part" && for x in env.sh gh sitecustomize.py isolated.py; do curl -fsSL --max-time 5 -o "$t.part/$x" "https://raw.githubusercontent.com/manaflow-ai/cmux/27647ffd3ae838c63be28ca3e5883dcd68c34518/scripts/ci/api_call_log/$x" || break; done; [ -s "$t.part/isolated.py" ] && mv "$t.part" "$t"; fi; if [ -f "$t/env.sh" ]; then echo "$t/env.sh"; else echo unset BASH_ENV > "$t.off.sh" && echo "$t.off.sh"; fi; fi; } 2>/dev/null)'

jobs:
  plan:
    name: cmux-next size budget (plan)
    # An edit that adds, changes or removes no `size:` line changes nothing measured.
    if: ${{ !(github.event.action == 'edited' && !(github.event.changes.body && (contains(github.event.pull_request.body, 'size:') || contains(github.event.changes.body.from, 'size:')))) }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || 'cmux-linux' }}
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      tool: ${{ steps.plan.outputs.tool }}
      web: ${{ steps.plan.outputs.web }}
      base: ${{ steps.plan.outputs.base }}
      # The base's web byte counts from its published bundles (R2), when feat-cmux-next's own push already built
      # them; empty on a miss, and web-base builds the base as before.
      base_bytes: ${{ steps.base-bytes.outputs.bytes }}
    steps:
      # Blobless and sparse to the paths web-bundle-key.py reads (the same list web-base uses): the
      # plan reads git objects and the web inputs only, and a full checkout of both commits was most
      # of its minute and a half.
      - name: Checkout
        if: ${{ !startsWith(runner.name, 'cmux-runner-pool-') }}
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          # The pull request's merge commit and its first parent (the base).
          fetch-depth: 2
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: &plan-sparse |
            /webviews/
            /schemas/
            /scripts/
            /web/data/
            /examples/
            /config/
            /clients/ts/
            /Resources/markdown-viewer/
            /release-notes/next/
            /Packages/macOS/CmuxNext/Sources/**/*.xcstrings
            /.gitmodules

      # A cmux-runner-pool VM checks out from its local git mirror (/var/lib/cmux-git) instead, as
      # cmux-next-fast-gates.yml does: actions/checkout's blob:none fetch borrowing the mirror copies ~3 GB of
      # promisor objects (50-140 s of each light job's 1.5-3 min in 2026-11-25 step timings). Unfiltered, the
      # fetch sends only what the mirror lacks: the same commit (depth 2) and sparse paths. Other runners keep the action.
      - name: "Pool mirror: Checkout"
        if: ${{ startsWith(runner.name, 'cmux-runner-pool-') }}
        env:
          SHA: ${{ github.sha }}
          TOKEN: ${{ github.token }}
          SPARSE: *plan-sparse
        run: |
          set -euo pipefail
          mirror=/var/lib/cmux-git/cmux.git/objects
          [[ -d "$mirror" ]] || { echo "::error::no git mirror at $mirror on this pool VM"; exit 1; }
          cd "$GITHUB_WORKSPACE"
          find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          git init -q .
          echo "$mirror" > .git/objects/info/alternates
          git config gc.auto 0
          git remote add origin "https://github.com/$GITHUB_REPOSITORY"
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          # --depth routes the fetch through the pool's git shim (the mirror path); only this command sees the token.
          GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" \
            git fetch --no-tags --no-recurse-submodules --depth=2 origin "+$SHA:refs/remotes/origin/checkout"
          if [[ -n "${SPARSE//[[:space:]]/}" ]]; then
            git config core.sparseCheckout true
            printf '%s\n' "$SPARSE" > .git/info/sparse-checkout
          fi
          git checkout -q --detach "$SHA"
          echo "checked out $(git rev-parse HEAD) from the pool mirror"

      - name: The base, and whether a web input changed
        id: plan
        run: |
          set -euo pipefail
          echo "base=$(git rev-parse HEAD^1)" >> "$GITHUB_OUTPUT"
          if ! git cat-file -e HEAD^1:scripts/cmux-next/bundle-size-pr.py 2>/dev/null; then
            # The pull request that adds the budget: its base has none to run yet.
            echo "::notice::The base has no scripts/cmux-next/bundle-size-pr.py yet; nothing to check."
            echo "tool=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "tool=true" >> "$GITHUB_OUTPUT"
          # The base's web inputs only, as in the main checkout (a full second tree was the other half).
          git worktree add --no-checkout -f -f --detach "$RUNNER_TEMP/base" HEAD^1
          git -C "$RUNNER_TEMP/base" sparse-checkout set --no-cone \
            /webviews/ /schemas/ /scripts/ /web/data/ /examples/ /config/ /clients/ts/ \
            /Resources/markdown-viewer/ /release-notes/next/ '/Packages/macOS/CmuxNext/Sources/**/*.xcstrings'
          git -C "$RUNNER_TEMP/base" checkout -q HEAD
          mapfile -t routed < <(python3 -I "$RUNNER_TEMP/base/scripts/cmux-next/web-bundle-key.py" "$RUNNER_TEMP/base" --routed)
          if git diff --quiet HEAD^1 HEAD -- "${routed[@]}"; then
            echo "web=false" >> "$GITHUB_OUTPUT"
          else
            echo "web=true" >> "$GITHUB_OUTPUT"
          fi
          # The base's source key, as cmux-next.yml's web-bundles job computes it on the feat-cmux-next push
          # that publishes the bundles under it (cmux-next-web-bundles-v1-<key>, R2 namespace `any`).
          echo "base_key=$(python3 -I "$RUNNER_TEMP/base/scripts/cmux-next/web-bundle-key.py" "$RUNNER_TEMP/base" --source)" >> "$GITHUB_OUTPUT"

      # The base is a feat-cmux-next commit, and its push run already built and published its web bundles: read
      # them instead of building the base again on every pull request head (6,626 runner-min a day on
      # 2026-11-22..23 for web-base, 4.9 min each; 8 of 12 sampled base commits were in R2). Only feat-cmux-next
      # pushes write that store (environment next-cache-writer). A miss or any failure leaves base_bytes empty.
      - name: The base's published web bundles
        id: base-bundles
        if: ${{ steps.plan.outputs.web == 'true' && steps.plan.outputs.base_key != '' && (vars.CMUX_SIZE_BUDGET_BASE_FROM_R2 || '1') != '0' }}
        continue-on-error: true
        timeout-minutes: 4
        uses: ./.github/actions/cache-restore
        env:
          CI_CACHE_R2_PUBLIC_URL: https://ci-cache-next.cmux.com
          CI_CACHE_R2_NAMESPACE: any
        with:
          backend: r2
          path: ${{ runner.temp }}/base-web
          key: cmux-next-web-bundles-v1-${{ steps.plan.outputs.base_key }}

      - name: The base's web bytes from them
        id: base-bytes
        if: ${{ steps.base-bundles.outputs.cache-hit == 'true' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          # The base's counter, as web-base runs it on its own build.
          bytes="$(python3 -I "$RUNNER_TEMP/base/scripts/cmux-next/bundle-size-pr.py" web-bytes "$RUNNER_TEMP/base-web")"
          echo "bytes=$bytes" >> "$GITHUB_OUTPUT"

  # The two web builds: each in its own job, from its own commit, handing over only byte counts.
  web-base:
    name: cmux-next size budget (web, base)
    needs: plan
    # Only when plan found no published bundles of the base.
    if: ${{ needs.plan.outputs.tool == 'true' && needs.plan.outputs.web == 'true' && needs.plan.outputs.base_bytes == '' }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || 'cmux-linux' }}
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      bytes: ${{ steps.measure.outputs.bytes }}
    steps:
      # Only what web-bundle-key.py --source hashes (INPUTS and what webviews imports), with
      # no blobs outside it: a published key needs no build. A file left out changes the key,
      # so a narrow pattern can only miss, never reuse the wrong bundles.
      - name: Checkout the base
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          ref: ${{ needs.plan.outputs.base }}
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /webviews/
            /schemas/
            /scripts/
            /web/data/
            /examples/
            /config/
            /clients/ts/
            /Resources/markdown-viewer/
            /release-notes/next/
            /Packages/macOS/CmuxNext/Sources/**/*.xcstrings
            /.gitmodules
      # The base is a feat-cmux-next commit, so cmux-next-web-bundle-publish.yml has usually
      # published its bundles already (same key, same pinned toolchain): fetch, don't rebuild.
      - name: The base's published web bundles
        id: published
        env:
          CMUX_WEB_NODE_VERSION: "24.22.1"
        run: |
          set -euo pipefail
          key="$(python3 -I scripts/cmux-next/web-bundle-key.py . --source)"
          [[ "$key" =~ ^[0-9a-f]{64}$ ]]
          rc=3
          if [[ -x scripts/cmux-next/fetch-web-bundles.sh ]]; then
            scripts/cmux-next/fetch-web-bundles.sh --key "$key" --out "$RUNNER_TEMP/web" >/dev/null && rc=0 || rc=$?
          fi
          if [[ "$rc" == 0 ]]; then
            echo "hit=true" >> "$GITHUB_OUTPUT"
            echo "base web bundles: published under $key"
          else
            echo "hit=false" >> "$GITHUB_OUTPUT"
            echo "base web bundles: $key not fetched (exit $rc); building"
            rm -rf "$RUNNER_TEMP/web"
            git sparse-checkout disable
          fi
      - name: Restore pinned Bun 1.4.4 from the CI cache bucket
        if: steps.published.outputs.hit != 'true'
        shell: bash
        continue-on-error: true
        run: bash "$GITHUB_WORKSPACE/scripts/ci/toolchain-r2.sh" restore bun 1.4.4 || true

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: steps.published.outputs.hit != 'true'
        with:
          bun-version: "1.4.4"
          no-cache: ${{ !startsWith(github.workspace, '/home/runner/work/') || !(github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && github.event_name != 'merge_group' && contains(fromJSON('["refs/heads/main","refs/heads/feat-cmux-next","refs/heads/nightly-next"]'), github.ref)) }}
      - name: Restore pinned Node 24.22.1 from the CI cache bucket
        if: steps.published.outputs.hit != 'true'
        shell: bash
        continue-on-error: true
        run: bash "$GITHUB_WORKSPACE/scripts/ci/toolchain-r2.sh" restore node 24.22.1 || true

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        timeout-minutes: 5
        if: steps.published.outputs.hit != 'true'
        with:
          node-version: "24.22.1"
      - name: Build and measure
        id: measure
        env:
          HIT: ${{ steps.published.outputs.hit }}
        run: |
          set -euo pipefail
          if [[ "$HIT" != true ]]; then
            (cd webviews && bun install --frozen-lockfile >/dev/null)
            ./scripts/cmux-next/build-web-bundles.sh --out-root "$RUNNER_TEMP/web"
          fi
          # An assignment, not an echo argument: set -e then stops on a missing output (exit 2).
          bytes="$(python3 -I scripts/cmux-next/bundle-size-pr.py web-bytes "$RUNNER_TEMP/web")"
          echo "bytes=$bytes" >> "$GITHUB_OUTPUT"

  web-head:
    name: cmux-next size budget (web, head)
    needs: plan
    if: ${{ needs.plan.outputs.tool == 'true' && needs.plan.outputs.web == 'true' }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || 'cmux-linux' }}
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    outputs:
      bytes: ${{ steps.measure.outputs.bytes }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 2
      # The web-bundles producer keys every tracked web input, the lockfile and each
      # build script through web-bundle-key.py. Reuse that exact result when this PR's
      # head has already been built by the base push or another workflow.
      - name: Source key of the web bundles
        id: web-bundle-key
        env:
          CMUX_WEB_NODE_VERSION: "24.22.1"
        run: echo "key=$(python3 scripts/cmux-next/web-bundle-key.py . --source)" >> "$GITHUB_OUTPUT"

      - name: Validate the producer source key
        env:
          PRODUCER_KEY: ${{ inputs.web_bundle_key }}
          SOURCE_KEY: ${{ steps.web-bundle-key.outputs.key }}
        run: test -z "$PRODUCER_KEY" || test "$PRODUCER_KEY" = "$SOURCE_KEY"
      - name: Restore this run's web bundles from R2
        if: inputs.web_bundle_key != '' && inputs.web_bundle_transport == 'r2'
        uses: ./.github/actions/r2-artifact/download
        with:
          name: ${{ inputs.web_bundle_artifact }}
          path: ${{ runner.temp }}/web
      - name: Restore this run's web bundles without a fleet identity
        if: inputs.web_bundle_key != '' && inputs.web_bundle_transport == 'github'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ${{ inputs.web_bundle_artifact }}
          path: ${{ runner.temp }}/web
      - name: Verify this run's web bundles
        id: web-bundle-run
        if: inputs.web_bundle_key != ''
        env:
          KEY: ${{ steps.web-bundle-key.outputs.key }}
          TRANSPORT: ${{ inputs.web_bundle_transport }}
        run: |
          test "$TRANSPORT" = r2 || test "$TRANSPORT" = github
          python3 -I scripts/ci/compile_preflight.py web-artifact verify "$RUNNER_TEMP/web" "$KEY"
          echo hit=true >> "$GITHUB_OUTPUT"

      - name: Restore the published web bundles
        if: steps.web-bundle-run.outputs.hit != 'true'
        id: web-bundle-r2
        continue-on-error: true
        timeout-minutes: 4
        uses: ./.github/actions/cache-restore
        env:
          CI_CACHE_R2_PUBLIC_URL: https://ci-cache-next.cmux.com
          CI_CACHE_R2_NAMESPACE: any
        with:
          backend: r2
          path: ${{ runner.temp }}/web
          key: cmux-next-web-bundles-v1-${{ steps.web-bundle-key.outputs.key }}

      - name: Restore the web bundles from the source-keyed cache
        timeout-minutes: 5
        id: web-bundle-cache
        if: steps.web-bundle-run.outputs.hit != 'true' && steps.web-bundle-r2.outputs.cache-hit != 'true'
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/web
          key: cmux-next-web-bundles-v1-${{ steps.web-bundle-key.outputs.key }}
          enableCrossOsArchive: true

      - name: Restore pinned Bun 1.4.4 from the CI cache bucket
        if: steps.web-bundle-run.outputs.hit != 'true' && steps.web-bundle-r2.outputs.cache-hit != 'true' && steps.web-bundle-cache.outputs.cache-hit != 'true'
        shell: bash
        continue-on-error: true
        run: bash "$GITHUB_WORKSPACE/scripts/ci/toolchain-r2.sh" restore bun 1.4.4 || true
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: steps.web-bundle-run.outputs.hit != 'true' && steps.web-bundle-r2.outputs.cache-hit != 'true' && steps.web-bundle-cache.outputs.cache-hit != 'true'
        with:
          bun-version: "1.4.4"
          no-cache: ${{ !startsWith(github.workspace, '/home/runner/work/') || !(github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && github.event_name != 'merge_group' && contains(fromJSON('["refs/heads/main","refs/heads/feat-cmux-next","refs/heads/nightly-next"]'), github.ref)) }}
      - name: Restore pinned Node 24.22.1 from the CI cache bucket
        if: steps.web-bundle-run.outputs.hit != 'true' && steps.web-bundle-r2.outputs.cache-hit != 'true' && steps.web-bundle-cache.outputs.cache-hit != 'true'
        shell: bash
        continue-on-error: true
        run: bash "$GITHUB_WORKSPACE/scripts/ci/toolchain-r2.sh" restore node 24.22.1 || true
      - name: Setup Node
        timeout-minutes: 5
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        if: steps.web-bundle-run.outputs.hit != 'true' && steps.web-bundle-r2.outputs.cache-hit != 'true' && steps.web-bundle-cache.outputs.cache-hit != 'true'
        with:
          node-version: "24.22.1"
      - name: Build and measure
        id: measure
        env:
          WEB_BUNDLE_HIT: ${{ steps.web-bundle-run.outputs.hit == 'true' || steps.web-bundle-r2.outputs.cache-hit == 'true' || steps.web-bundle-cache.outputs.cache-hit == 'true' }}
        run: |
          set -euo pipefail
          # The base's counter, written out before the head's code runs.
          git show HEAD^1:scripts/cmux-next/bundle-size-pr.py > "$RUNNER_TEMP/bundle-size-pr.py"
          git show HEAD^1:scripts/cmux-next/bundle-size-budget.json > "$RUNNER_TEMP/bundle-size-budget.json"
          # The startup JS each page parses before first paint (scripts/cmux-next/web-entry-js.mjs), the
          # base's script and budget, the same way. It reports: an entry over its cap warns, nothing fails.
          entry_js=false
          if git show HEAD^1:scripts/cmux-next/web-entry-js.mjs > "$RUNNER_TEMP/web-entry-js.mjs" 2>/dev/null &&
            git show HEAD^1:scripts/cmux-next/web-entry-js-budget.json > "$RUNNER_TEMP/web-entry-js-budget.json" 2>/dev/null; then
            entry_js=true
          fi
          if [[ "$WEB_BUNDLE_HIT" != true ]]; then
            (cd webviews && bun install --frozen-lockfile >/dev/null)
            ./scripts/cmux-next/build-web-bundles.sh --out-root "$RUNNER_TEMP/web"
          else
            echo "web bundles: reused source-keyed cache ${{ steps.web-bundle-key.outputs.key }}"
          fi
          bytes="$(python3 -I "$RUNNER_TEMP/bundle-size-pr.py" web-bytes "$RUNNER_TEMP/web" --budget "$RUNNER_TEMP/bundle-size-budget.json")"
          echo "bytes=$bytes" >> "$GITHUB_OUTPUT"
          if [[ "$entry_js" == true ]]; then
            rc=0
            node "$RUNNER_TEMP/web-entry-js.mjs" "$RUNNER_TEMP/web" --budget "$RUNNER_TEMP/web-entry-js-budget.json" \
              --markdown > "$RUNNER_TEMP/web-entry-js.md" || rc=$?
            cat "$RUNNER_TEMP/web-entry-js.md"
            { echo '### Startup JS per page'; cat "$RUNNER_TEMP/web-entry-js.md"; } >> "$GITHUB_STEP_SUMMARY"
            if (( rc != 0 )); then
              echo "::warning title=Startup JS over budget::$(head -1 "$RUNNER_TEMP/web-entry-js.md" | tr -d '*`')"
            fi
          fi

  size-budget:
    # An edit with no `size:` line skips this job, and a skipped job reads as success for a check:
    # that run publishes another name so it never replaces a red `cmux-next size budget`.
    name: ${{ github.event.action == 'edited' && !(github.event.changes.body && (contains(github.event.pull_request.body, 'size:') || contains(github.event.changes.body.from, 'size:'))) && 'cmux-next size budget metadata edit (ignored)' || 'cmux-next size budget' }}
    needs: [plan, web-base, web-head]
    # Runs when the web builds ran or were skipped; a failed build fails this check below.
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || 'cmux-linux' }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # The checker reads the two commits through git only (ls-tree, show, log; the web counts arrive
      # as files in RUNNER_TEMP), so no working tree beyond its own folder is written.
      # It needs every blob of both commits: `ls-tree -r -l` reads each blob's size. A sparse checkout
      # with no filter is blob:none (actions/checkout), and the checker then fetched those blobs one
      # lazy fetch at a time: from 18Z 11-24 the check ran 3.3 min a run on average, and 86 of 101
      # runs on Freestyle runners hit the 10-minute timeout (872 runner-min in 5 h). blob:limit=1g
      # takes every blob in the one depth-2 fetch, as the full checkout did, and writes only this folder.
      - name: Checkout
        if: ${{ needs.plan.outputs.tool == 'true' && !startsWith(runner.name, 'cmux-runner-pool-') }}
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 2
          filter: blob:limit=1g
          sparse-checkout: |
            scripts/cmux-next

      # A cmux-runner-pool VM checks out from its local git mirror (/var/lib/cmux-git) instead, as
      # cmux-next-fast-gates.yml does: actions/checkout's blob:none fetch borrowing the mirror copies ~3 GB of
      # promisor objects (50-140 s of each light job's 1.5-3 min in 2026-11-25 step timings). Unfiltered, the
      # fetch sends only what the mirror lacks: the same commit (depth 2) and sparse paths. Other runners keep the action.
      - name: "Pool mirror: Checkout"
        if: ${{ needs.plan.outputs.tool == 'true' && startsWith(runner.name, 'cmux-runner-pool-') }}
        env:
          SHA: ${{ github.sha }}
          TOKEN: ${{ github.token }}
          SPARSE: |
            /scripts/cmux-next/
        run: |
          set -euo pipefail
          mirror=/var/lib/cmux-git/cmux.git/objects
          [[ -d "$mirror" ]] || { echo "::error::no git mirror at $mirror on this pool VM"; exit 1; }
          cd "$GITHUB_WORKSPACE"
          find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          git init -q .
          echo "$mirror" > .git/objects/info/alternates
          git config gc.auto 0
          git remote add origin "https://github.com/$GITHUB_REPOSITORY"
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          # --depth routes the fetch through the pool's git shim (the mirror path); only this command sees the token.
          GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" \
            git fetch --no-tags --no-recurse-submodules --depth=2 origin "+$SHA:refs/remotes/origin/checkout"
          if [[ -n "${SPARSE//[[:space:]]/}" ]]; then
            git config core.sparseCheckout true
            printf '%s\n' "$SPARSE" > .git/info/sparse-checkout
          fi
          git checkout -q --detach "$SHA"
          echo "checked out $(git rev-parse HEAD) from the pool mirror"

      - name: Check the size budget
        env:
          TOOL: ${{ needs.plan.outputs.tool }}
          WEB: ${{ needs.plan.outputs.web }}
          WEB_BASE_RESULT: ${{ needs.web-base.result }}
          WEB_HEAD_RESULT: ${{ needs.web-head.result }}
          WEB_BASE: ${{ needs.plan.outputs.base_bytes || needs.web-base.outputs.bytes }}
          WEB_BASE_FROM_PLAN: ${{ needs.plan.outputs.base_bytes != '' }}
          WEB_HEAD: ${{ needs.web-head.outputs.bytes }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          if [[ "$TOOL" != true ]]; then
            echo "The base has no size budget yet; nothing to check."
            exit 0
          fi
          # The base's counts came from plan (its published bundles) when web-base was skipped for them.
          [[ "$WEB_BASE_FROM_PLAN" == true && "$WEB_BASE_RESULT" == skipped ]] && WEB_BASE_RESULT=success
          if [[ "$WEB" == true && ( "$WEB_BASE_RESULT" != success || "$WEB_HEAD_RESULT" != success ) ]]; then
            echo "::error title=Bundle size not measured::a web build failed (base: $WEB_BASE_RESULT, head: $WEB_HEAD_RESULT)"
            exit 2
          fi
          # The base commit's checker and budget, read through git: no file of the head runs.
          git show HEAD^1:scripts/cmux-next/bundle-size-pr.py > "$RUNNER_TEMP/bundle-size-pr.py"
          git show HEAD^1:scripts/cmux-next/bundle-size-budget.json > "$RUNNER_TEMP/bundle-size-budget.json"
          printf '%s\n' "$BODY" > "$RUNNER_TEMP/body.md"
          web=()
          if [[ "$WEB" == true ]]; then
            printf '%s\n' "$WEB_BASE" > "$RUNNER_TEMP/web-base.json"
            printf '%s\n' "$WEB_HEAD" > "$RUNNER_TEMP/web-head.json"
            web=(--web-base "$RUNNER_TEMP/web-base.json" --web-head "$RUNNER_TEMP/web-head.json")
          fi
          rc=0
          python3 -I "$RUNNER_TEMP/bundle-size-pr.py" check --repo "$GITHUB_WORKSPACE" \
            --budget "$RUNNER_TEMP/bundle-size-budget.json" \
            --base HEAD^1 --head HEAD --body-file "$RUNNER_TEMP/body.md" ${web[@]+"${web[@]}"} \
            --json "$RUNNER_TEMP/size-budget.json" > "$RUNNER_TEMP/size-budget.md" || rc=$?
          cat "$RUNNER_TEMP/size-budget.md"
          { echo '### Bundle size'; cat "$RUNNER_TEMP/size-budget.md"; } >> "$GITHUB_STEP_SUMMARY"
          headline="$(head -1 "$RUNNER_TEMP/size-budget.md" | tr -d '*`')"
          if (( rc == 1 )); then
            echo "::error title=Bundle size over budget::$headline"
          fi
          exit "$rc"
