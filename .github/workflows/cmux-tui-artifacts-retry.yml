name: cmux-tui artifacts retry

# A transient registry or R2 failure must not strand a cmux-tui tree key. A
# run cannot rerun itself while it is in progress (GitHub answers 403 "This
# workflow is already running"), so this workflow reruns the failed jobs of a
# completed, failed cmux-tui artifacts run, up to attempt 3. "Re-run failed
# jobs" also reruns their dependents, so the publish jobs run again. It lives
# on main because workflow_run runs from the default branch; it acts only on
# feat-cmux-next's tree-publishing runs (main's same-named workflow publishes
# no tree).
#
# An immutable R2 conflict is never retried: a rebuild is not byte-identical.
# scripts/ci/cmux_tui_artifacts_retry.py reads the immutable-r2-conflict
# annotation of the failed jobs, leaves that run red and fails here with the
# job name.
#
# A cancelled feat-cmux-next run is retried too when no runner ever took its
# cancelled jobs: the CI queue janitor cancels a job queued 2 h with no
# runner, and attempt 1 queues the tree jobs on the owned GCP lane label.
# On 2026-11-19 the feat-cmux-next pushes from 01:20Z were cancelled that way;
# none was retried, so `cmux app try` found no mac-live.json for any of them.
# The rerun is attempt 2, which takes the Blacksmith route. A run someone
# cancelled while a job ran stays as it is.
#
# workflow_run runs this file from the default branch only, and it checks out
# the default branch: no code of the failed run executes here. It never acts
# on a run that a fork head started (tests/test_ci_fork_runner_routing.py).
on:
  workflow_run:
    workflows: ["cmux-tui artifacts"]
    types: [completed]

env:
  # Temporary REST budget attribution: one gh-call line per GitHub API call (scripts/ci/api_call_log/env.sh, fetched at a fixed commit when the checkout has no copy).
  BASH_ENV: '$({ w="${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh"; t="${RUNNER_TEMP:-/nonexistent}/api-call-log-src"; if [ -f "$w" ]; then echo "$w"; elif [ -n "${RUNNER_TEMP:-}" ]; then if [ ! -f "$t/env.sh" ] && [ ! -e "$t.tried" ] && { [ "${RUNNER_OS:-}" = Linux ] || [ "${RUNNER_OS:-}" = macOS ]; } && [ "$(date -u +%Y%m%d%H)" -lt 2026112300 ]; then : > "$t.tried"; mkdir -p "$t.part" && for x in env.sh gh sitecustomize.py isolated.py; do curl -fsSL --max-time 5 -o "$t.part/$x" "https://raw.githubusercontent.com/manaflow-ai/cmux/27647ffd3ae838c63be28ca3e5883dcd68c34518/scripts/ci/api_call_log/$x" || break; done; [ -s "$t.part/isolated.py" ] && mv "$t.part" "$t"; fi; if [ -f "$t/env.sh" ]; then echo "$t/env.sh"; else echo unset BASH_ENV > "$t.off.sh" && echo "$t.off.sh"; fi; fi; } 2>/dev/null)'
  # The producer behind the display name above; tests/test_ci_workflow_run_sources.py
  # fails if it is renamed without this trigger.
  SOURCE_WORKFLOW_PATHS: .github/workflows/cmux-tui-artifacts.yml

permissions: {}

concurrency:
  group: cmux-tui-artifacts-retry-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  retry:
    name: retry failed cmux-tui publish
    if: >-
      ${{ github.repository_owner == 'manaflow-ai' &&
          (github.event.workflow_run.conclusion == 'failure' ||
           github.event.workflow_run.conclusion == 'cancelled' && github.event.workflow_run.head_branch == 'feat-cmux-next') &&
          github.event.workflow_run.event == 'push' &&
          (github.event.workflow_run.head_branch == 'feat-cmux-next' || startsWith(github.event.workflow_run.head_branch, 'cmux-tui-pin-')) &&
          github.event.workflow_run.run_attempt < 3 &&
          github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.CI_OVERFLOW_LINUX || 'cmux-linux' }}
    timeout-minutes: 5
    permissions:
      actions: write
      checks: read
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Rerun failed jobs unless an immutable R2 conflict failed the run
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: python3 scripts/ci/cmux_tui_artifacts_retry.py --repo "$REPOSITORY" --run-id "$RUN_ID"
