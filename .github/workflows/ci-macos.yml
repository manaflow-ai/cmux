name: CI macOS

on:
  workflow_call:
    inputs:
      macos:
        required: true
        type: string
      cli:
        required: false
        default: "false"
        type: string
      full_suite:
        required: true
        type: string
      # Path-derived selection for the swift-package-tests lane, so a pull
      # request that changes a Swift package still executes that package's
      # tests under the compile-only suite policy. Optional and defaulted:
      # a caller (or a trusted base router) that predates this input leaves it
      # empty, which reads as "not routed" everywhere below.
      swift_packages:
        required: false
        default: ""
        type: string
      # Label-derived selection for `app-host unit tests`. The full suite
      # already implies it; this lets `unit-ci` ask for compile admission plus
      # that one job, which reads the product admission already built, without
      # waking the package, lag, release-admission and Release-build lanes.
      # Optional and defaulted for the same reason as swift_packages: a caller
      # that predates this input leaves it empty, which reads as "not routed".
      unit_suite:
        required: false
        default: ""
        type: string
      # Space-separated cmuxTests/ suites when `unit_suite` came from a diff
      # that only edits those suites. `app-host unit tests` then runs just
      # them on one worker instead of every suite on seven. Empty runs all.
      unit_selectors:
        required: false
        default: ""
        type: string
      # `|`-delimited names of the strict steps below that own a suite in
      # unit_selectors. A changed-suites run runs those steps as they are,
      # since each gives its suites an app host and settings of their own.
      unit_strict_steps:
        required: false
        default: ""
        type: string
      # "true" when compile admission runs the unit_selectors suites itself,
      # on the runner that just built the product, instead of handing them to
      # a separate `app-host unit tests` worker. choose_ci_suite.py sets it
      # only when no strict step owns a selected suite and the diff leaves the
      # consumer path alone, which the separate worker still has to prove.
      # Empty (a caller that predates it) keeps the separate worker.
      unit_in_admission:
        required: false
        default: ""
        type: string
      product_artifacts:
        required: false
        default: "layered"
        type: string
      compile_admitted:
        required: true
        type: string
      release_build:
        required: true
        type: string
      source_identity_valid:
        required: true
        type: string
      source_tree:
        required: true
        type: string
      source_parent1:
        required: true
        type: string
      cache_backend:
        required: false
        default: ""
        type: string
      release_archs:
        required: false
        default: ""
        type: string

permissions:
  contents: read

# A called workflow does not inherit the caller's workflow-level env, so the
# R2 cache URL must be declared here or every R2 restore reports a miss.
env:
  CI_CACHE_R2_PUBLIC_URL: ${{ vars.CI_CACHE_R2_PUBLIC_URL || 'https://ci-cache.cmux.com' }}
  # Which schemes the producer builds, and the profile the product's identity
  # records. A purely CLI-routed change only feeds cli-product-tests, which
  # needs the cmux-cli product and its test bundle -- not the app, and not the
  # app-host or numeric-locale bundles.
  #
  # macOS routing keeps the full product while anything needs it: the app-host
  # shards consume it, and admission is also the check that proves the app
  # itself still compiles. Once an earlier run has admitted these inputs and
  # no app-host shard is routed, a CLI route only needs the cli product.
  # Producer and consumer must agree here, so it is declared once for every job
  # -- a consumer recomputing a different profile's identity simply declines
  # the artifact, which would silently cost a compile instead of reusing one.
  CMUX_PRODUCT_PROFILE: ${{ inputs.macos == 'true' && (inputs.full_suite == 'true' || inputs.unit_suite == 'true' || inputs.compile_admitted != 'true') && 'app-host' || 'cli' }}

jobs:
  macos-compile-admission:
    name: macOS compile admission
    # Spend one macOS slot proving that the app-host test product compiles
    # before starting the six test shards. The shards download this run's
    # build products and run test-without-building, so a compiler failure
    # cannot fan out across every macOS worker and a successful build is not
    # repeated six times.
    if: ${{ (inputs.macos == 'true' || inputs.cli == 'true') && (inputs.compile_admitted != 'true' || inputs.full_suite == 'true' || inputs.cli == 'true') }}
    # The cli clause above still compiles when an earlier run already admitted
    # these inputs. CMUX_PRODUCT_PROFILE then selects the cli product, one
    # scheme, so it no longer buys a full app build.
    # Pull requests and main's full-suite dispatch (ci-main-full-suite.yml)
    # compile on the pool and Xcode seed-derived-data.yml builds with, so both
    # can adopt its DerivedData seed below. Merge groups and dispatches on
    # other branches keep the macos-15 lane.
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || ((github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') && (vars.MACOS_RUNNER_PR || 'blacksmith-6vcpu-macos-15') || vars.CI_PAID_MACOS_OVERFLOW == '1' && vars.MACOS_RUNNER_15 || 'blacksmith-6vcpu-macos-15') }}
    # A changed-suites run adds its tests after the compile: the same
    # 30-minute batch ceiling the separate worker had.
    timeout-minutes: ${{ inputs.unit_in_admission == 'true' && 105 || 75 }}
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      # The outcome of the changed suites this job ran after compiling, so
      # macOS status can tell a test failure from a compile failure. Empty
      # when the job ran none.
      changed_suites: ${{ steps.run-changed-suites.outcome }}
      artifact_id: ${{ steps.upload-products.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload-products.outputs.artifact-digest }}
      layer_index_artifact_id: ${{ steps.upload-layer-index.outputs.artifact-id }}
      layer_index_digest: ${{ steps.upload-layer-index.outputs.artifact-digest }}
      sha256: ${{ steps.package-products.outputs.sha256 }}
      product_contract: ${{ steps.product-key.outputs.key }}
      source_revision: ${{ github.sha }}
      producer_run_id: ${{ github.run_id }}
      producer_run_attempt: ${{ github.run_attempt }}
      # The pool and Xcode this product was built with. Every job that runs
      # the product takes both from here, so a routing change to this job
      # (MACOS_RUNNER_PR, a new event on the pull-request route) moves its
      # consumers with it.
      runner: ${{ env.CMUX_PRODUCT_RUNNER }}
      xcode_app: ${{ env.CMUX_CI_XCODE_APP }}
    env:
      CMUX_NODE_PRODUCT_CACHE_ROOT: ${{ vars.CMUX_NODE_PRODUCT_CACHE_ROOT }}
      CMUX_NODE_PRODUCT_CACHE_MAX_BYTES: ${{ vars.CMUX_NODE_PRODUCT_CACHE_MAX_BYTES }}
      CMUX_NODE_PRODUCT_CACHE_WAIT_SECONDS: ${{ vars.CMUX_NODE_PRODUCT_CACHE_WAIT_SECONDS }}
      CMUX_ARTIFACT_PEER_URLS: ${{ vars.CMUX_ARTIFACT_PEER_URLS }}
      CMUX_ARTIFACT_PEER_TOKEN_FILE: ${{ vars.CMUX_ARTIFACT_PEER_TOKEN_FILE }}
      CMUX_CI_XCODE_APP: ${{ (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') && (vars.CMUX_CI_XCODE_APP_PR || vars.CMUX_CI_XCODE_APP_MACOS_15) || vars.CMUX_CI_XCODE_APP_MACOS_15 }}
      CMUX_CI_REQUIRED_MACOS_SDK_MAJOR: "26"
      CMUX_SKIP_ZIG_BUILD: "1"
      # Names the pool this job actually ran on. The app-host product contract
      # keys on the toolchain and the build path instead, so a product built
      # here at the canonical root matches on any pool with the same Xcode.
      # The macOS runner guard still requires it to track runs-on.
      CMUX_PRODUCT_RUNNER: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || ((github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') && (vars.MACOS_RUNNER_PR || 'blacksmith-6vcpu-macos-15') || vars.CI_PAID_MACOS_OVERFLOW == '1' && vars.MACOS_RUNNER_15 || 'blacksmith-6vcpu-macos-15') }}
      # What the changed-suites steps at the end of this job read, with the
      # values `app-host unit tests` gives its changed-suites worker, shard 8.
      # The compile reads none of them: it runs plain xcodebuild and bakes the
      # isolation condition in itself, and SWIFT_BACKTRACE only changes how a
      # crashing Swift process reports. product_input_identity.py keeps them
      # out of the product recipe.
      CMUX_CI_APP_HOST_ISOLATION_REQUIRED: "1"
      CMUX_APP_HOST_SHARD: "8"
      CMUX_APP_HOST_UNIT_SELECTORS: ${{ inputs.unit_selectors }}
      CMUX_APP_HOST_CAPTURE_XCRESULTS: "1"
      CMUX_UNIT_TEST_TIMEOUT_SECONDS: "1800"
      CMUX_XCODEBUILD_NONINTERACTIVE_IDLE_TIMEOUT_SECONDS: "1200"
      CMUX_XCODEBUILD_NONINTERACTIVE_RESTART_BUDGET: "2"
      SWIFT_BACKTRACE: "interactive=no,timeout=0s,symbolicate=off,color=no"
      CMUX_XCODEBUILD_NONINTERACTIVE_POST_TEST_TIMEOUT_SECONDS: "45"
    steps:
      - name: Reject stale pull request rerun
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          run_head="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq '.head_sha' 2>/dev/null || true)"
          current_head="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.head.sha' 2>/dev/null || true)"
          if [ -z "$run_head" ] || [ -z "$current_head" ]; then
            echo "Could not resolve run/PR head identity; continuing with normal CI."
            exit 0
          fi
          if [ "$current_head" != "$run_head" ]; then
            echo "Refusing stale PR run: run head $run_head; current head $current_head." >&2
            exit 1
          fi
      - name: Start compile admission timers
        run: |
          now="$(python3 -c 'import time; print(time.monotonic())')"
          {
            echo "CMUX_MACOS_ADMISSION_STARTED=$now"
            echo "CMUX_HOSTED_SOURCE_PREP_STARTED=$now"
          } >> "$GITHUB_ENV"

      - name: Clear stale git locks (self-hosted reused workspace)
        shell: bash
        run: |
          set -euo pipefail
          ws="${GITHUB_WORKSPACE:-$PWD}"
          rm -f "$ws/.git/index.lock" 2>/dev/null || true
          if [ -d "$ws/.git/modules" ]; then
            find "$ws/.git/modules" -type f -name "*.lock" -delete 2>/dev/null || true
          fi

      - name: Checkout
        id: checkout
        continue-on-error: true
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          persist-credentials: false

      # WarpBuild can lose GitHub DNS on an otherwise healthy runner. Retry the
      # checkout once only after that action fails; healthy jobs still perform
      # one checkout, and a second failure remains a hard failure with evidence.
      - name: Retry checkout after transient network failure
        id: checkout-retry
        if: steps.checkout.outcome == 'failure'
        continue-on-error: true
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          persist-credentials: false

      - name: Diagnose checkout network failure
        if: steps.checkout.outcome == 'failure' && steps.checkout-retry.outcome == 'failure'
        timeout-minutes: 1
        run: |
          set -u

          # Keep provider/network evidence in the job log without failing the original
          # operation. These commands are intentionally read-only and emit no tokens.
          echo "== network diagnostics (runner=${RUNNER_NAME:-unknown}) ==" >&2
          if command -v scutil >/dev/null 2>&1; then
            scutil --dns 2>&1 || true
          fi
          if command -v route >/dev/null 2>&1; then
            route -n get default 2>&1 || true
          fi
          if command -v ifconfig >/dev/null 2>&1; then
            ifconfig 2>&1 || true
          fi
          if command -v dscacheutil >/dev/null 2>&1; then
            dscacheutil -q host -a name github.com 2>&1 || true
          fi
          if command -v curl >/dev/null 2>&1; then
            curl --connect-timeout 5 --max-time 10 --silent --show-error --head https://github.com/ 2>&1 || true
          fi
          echo "== end network diagnostics ==" >&2
          exit 1

      - name: Record hosted source preparation
        id: hosted-source-prep
        run: |
          now="$(python3 -c 'import time; print(time.monotonic())')"
          seconds="$(python3 -c 'import sys; print(round(float(sys.argv[2])-float(sys.argv[1]), 6))' "$CMUX_HOSTED_SOURCE_PREP_STARTED" "$now")"
          echo "seconds=$seconds" >> "$GITHUB_OUTPUT"

      - name: Measure hosted queue-to-start
        id: hosted-queue
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime
          import json
          import os
          import subprocess

          result = subprocess.run(
              ["gh", "api", f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}/jobs?filter=latest&per_page=100"],
              check=True, text=True, capture_output=True,
          )
          jobs = json.loads(result.stdout).get("jobs", [])
          # A reusable workflow prefixes its jobs with the caller's job id, so the
          # reported name is "macos / macOS compile admission" on every real run.
          matches = [
              job
              for job in jobs
              if str(job.get("name") or "").rsplit(" / ", 1)[-1] == "macOS compile admission"
          ]
          if len(matches) != 1:
              raise SystemExit(f"expected one admission job, found {len(matches)}")
          job = matches[0]
          created = datetime.datetime.fromisoformat(job["created_at"].replace("Z", "+00:00"))
          started = datetime.datetime.fromisoformat(job["started_at"].replace("Z", "+00:00"))
          seconds = max(0.0, (started - created).total_seconds())
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"seconds={seconds:.3f}\n")
          print(f"hosted admission queue-to-start: {seconds:.3f}s")
          PY

      - name: Prepare isolated admission DerivedData
        run: |
          set -euo pipefail
          # Fixed paths survive across jobs on persistent runners. Clear them
          # before any trusted product/cache restoration.
          root="${CMUX_CI_CANONICAL_ROOT:-/private/tmp/cmux-ci}"
          rm -rf "$root/derived-data-compile-admission" "$root/compile-admission-cas"
          echo "CMUX_COMPILE_ADMISSION_DERIVED_DATA=${CMUX_CI_CANONICAL_ROOT:-/private/tmp/cmux-ci}/derived-data-compile-admission" >> "$GITHUB_ENV"
          # Outside DerivedData: the resolve step below recreates that directory.
          echo "CMUX_COMPILE_ADMISSION_CAS=${CMUX_CI_CANONICAL_ROOT:-/private/tmp/cmux-ci}/compile-admission-cas" >> "$GITHUB_ENV"

      - name: Select Xcode
        run: ./scripts/select-ci-xcode.sh

      - name: Install Rust
        run: ./scripts/install-rust-ci.sh

      - name: Identify reusable compiled products
        id: product-key
        run: python3 scripts/ci/reuse_app_host_products.py key "$CMUX_COMPILE_ADMISSION_DERIVED_DATA"

      - name: Reuse exact compatible compiled products
        id: reuse-products
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/reuse_app_host_products.py restore "$CMUX_COMPILE_ADMISSION_DERIVED_DATA"

      - name: Record compiled-product reuse metrics
        if: always()
        env:
          REUSE_HIT: ${{ steps.reuse-products.outputs.hit }}
          REUSE_REASON: ${{ steps.reuse-products.outputs.reason }}
          REUSE_MISS_REASONS: ${{ steps.reuse-products.outputs.miss_reasons }}
          REUSE_COMPILE_SECONDS: ${{ steps.reuse-products.outputs.compile_seconds_avoided }}
          REUSE_LOOKUP_SECONDS: ${{ steps.reuse-products.outputs.lookup_seconds }}
          REUSE_TRANSFER_SECONDS: ${{ steps.reuse-products.outputs.transfer_seconds }}
          REUSE_RESTORE_SECONDS: ${{ steps.reuse-products.outputs.restore_seconds }}
          REUSE_TOTAL_SECONDS: ${{ steps.reuse-products.outputs.total_reuse_seconds }}
          REUSE_MACOS_MINUTES_SAVED: ${{ steps.reuse-products.outputs.macos_runner_minutes_saved }}
        run: |
          set -euo pipefail
          show() {
            if [ -n "${1:-}" ]; then printf '%s' "$1"; else printf '%s' "n/a"; fi
          }
          {
            echo "### Compiled-product reuse"
            echo "- hit: $(show "$REUSE_HIT")"
            echo "- outcome: $(show "$REUSE_REASON")"
            echo "- miss/fallback reasons: $(show "$REUSE_MISS_REASONS")"
            echo "- compile seconds avoided: $(show "$REUSE_COMPILE_SECONDS")"
            echo "- lookup seconds: $(show "$REUSE_LOOKUP_SECONDS")"
            echo "- transfer seconds: $(show "$REUSE_TRANSFER_SECONDS")"
            echo "- restore seconds: $(show "$REUSE_RESTORE_SECONDS")"
            echo "- total reuse seconds: $(show "$REUSE_TOTAL_SECONDS")"
            echo "- macOS runner minutes saved: $(show "$REUSE_MACOS_MINUTES_SAVED")"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Observe persistent Mac compile candidate
        id: persistent-route
        if: ${{ steps.reuse-products.outputs.hit != 'true' && github.event_name == 'pull_request' && inputs.source_identity_valid == 'true' && (vars.CI_PERSISTENT_MAC_COMPILE == 'pilot' || vars.CI_PERSISTENT_MAC_COMPILE == 'all' || vars.CI_PERSISTENT_MAC_COMPILE == 'on' || vars.CI_PERSISTENT_MAC_COMPILE == 'true' || vars.CI_PERSISTENT_MAC_COMPILE == '1') && github.event.pull_request.head.repo.full_name == github.repository && (github.event.pull_request.author_association == 'MEMBER' || github.event.pull_request.author_association == 'OWNER') }}
        env:
          GH_TOKEN: ${{ github.token }}
          CI_PERSISTENT_MAC_COMPILE: ${{ vars.CI_PERSISTENT_MAC_COMPILE }}
          CI_PERSISTENT_MAC_COMPILE_COHORT: ${{ vars.CI_PERSISTENT_MAC_COMPILE_COHORT }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_REF: ${{ github.head_ref }}
          AUTHOR_ASSOCIATION: ${{ github.event.pull_request.author_association }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SOURCE_TREE: ${{ inputs.source_tree }}
          SOURCE_PARENT1: ${{ inputs.source_parent1 }}
        run: |
          set -euo pipefail
          route_started="$(python3 -c 'import time; print(time.monotonic())')"
          python3 scripts/ci/persistent_mac_route.py \
            --observe-only \
            --ready-only \
            --event-name "$GITHUB_EVENT_NAME" \
            --selector "$CI_PERSISTENT_MAC_COMPILE" \
            --cohort "$CI_PERSISTENT_MAC_COMPILE_COHORT" \
            --repository "$GITHUB_REPOSITORY" \
            --pr-number "$PR_NUMBER" \
            --head-repository "$HEAD_REPOSITORY" \
            --head-ref "$HEAD_REF" \
            --author-association "$AUTHOR_ASSOCIATION" \
            --head-sha "$HEAD_SHA" \
            --source-sha "$GITHUB_SHA" \
            --source-tree "$SOURCE_TREE" \
            --source-parent1 "$SOURCE_PARENT1" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --github-output "$GITHUB_OUTPUT"
          route_finished="$(python3 -c 'import time; print(time.monotonic())')"
          route_wall="$(python3 -c 'import sys; print(round(float(sys.argv[2])-float(sys.argv[1]), 6))' "$route_started" "$route_finished")"
          echo "route_wall_seconds=$route_wall" >> "$GITHUB_OUTPUT"

      - name: Download persistent Mac compile product
        id: persistent-download
        if: steps.reuse-products.outputs.hit != 'true' && steps.persistent-route.outputs.use_persistent == 'true'
        continue-on-error: true
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          artifact-ids: ${{ steps.persistent-route.outputs.artifact_id }}
          path: ${{ runner.temp }}/persistent-mac-compile
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.persistent-route.outputs.producer_run_id }}

      - name: Revalidate persistent Mac compile product
        id: persistent-restore
        if: steps.reuse-products.outputs.hit != 'true' && steps.persistent-download.outcome == 'success'
        continue-on-error: true
        env:
          EXPECTED_SOURCE_SHA: ${{ github.sha }}
          EXPECTED_SOURCE_TREE: ${{ inputs.source_tree }}
        run: |
          set -euo pipefail
          [ -z "$(git status --porcelain --untracked-files=all)" ] || {
            echo "hosted validation checkout is dirty" >&2
            exit 1
          }
          [ "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_SOURCE_TREE" ]

          # Every identity check below runs after the archive is expanded here, and
          # the fallback compile runs in this same DerivedData. A refused product
          # must not become that compile's input, so arm the cleanup before the
          # first byte is written and keep it until this step's own success.
          revalidated=false
          cleanup() {
            [ "$revalidated" = true ] && return 0
            rm -rf "$CMUX_COMPILE_ADMISSION_DERIVED_DATA"
          }
          trap cleanup EXIT

          archive="$(find "$RUNNER_TEMP/persistent-mac-compile" -type f -name 'persistent-mac-compile.tar.gz' -print -quit)"
          [ -n "$archive" ] && [ -f "$archive" ]
          mkdir -p "$CMUX_COMPILE_ADMISSION_DERIVED_DATA"
          tar -xzf "$archive" -C "$CMUX_COMPILE_ADMISSION_DERIVED_DATA"
          metrics="$CMUX_COMPILE_ADMISSION_DERIVED_DATA/persistent-mac-metrics.json"
          test -f "$metrics"

          python3 scripts/ci/app_host_test_products.py restore "$CMUX_COMPILE_ADMISSION_DERIVED_DATA"

          METRICS="$metrics" EXPECTED_SOURCE_SHA="$EXPECTED_SOURCE_SHA" EXPECTED_SOURCE_TREE="$EXPECTED_SOURCE_TREE" python3 - <<'PY'
          import hashlib
          import json
          import os
          import platform
          import subprocess
          from pathlib import Path

          metrics = json.load(open(os.environ["METRICS"]))
          expected_sha = os.environ["EXPECTED_SOURCE_SHA"]
          expected_tree = os.environ["EXPECTED_SOURCE_TREE"]

          def output(*argv):
              return subprocess.check_output(argv, text=True).strip()

          def digest(path):
              value = hashlib.sha256()
              with Path(path).open("rb") as stream:
                  for block in iter(lambda: stream.read(1024 * 1024), b""):
                      value.update(block)
              return value.hexdigest()

          source = metrics.get("source", {})
          if source != {"commit": expected_sha, "tree": expected_tree}:
              raise SystemExit("persistent producer source identity mismatch")
          if output("git", "rev-parse", "HEAD") != expected_sha:
              raise SystemExit("hosted checkout revision mismatch")
          if output("git", "rev-parse", "HEAD^{tree}") != expected_tree:
              raise SystemExit("hosted checkout tree mismatch")
          if output("git", "status", "--porcelain", "--untracked-files=all"):
              raise SystemExit("hosted checkout became dirty during validation")

          lockfile = "cmux.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved"
          if digest(lockfile) != metrics.get("package_resolved_sha256"):
              raise SystemExit("Package.resolved identity mismatch")
          submodules = output("git", "submodule", "status", "--recursive").encode()
          if hashlib.sha256(submodules).hexdigest() != metrics.get("submodule_identity_sha256"):
              raise SystemExit("submodule identity mismatch")

          toolchain = metrics.get("toolchain", {})
          if toolchain.get("xcode") != output("xcodebuild", "-version"):
              raise SystemExit("Xcode identity mismatch")
          if toolchain.get("sdk_version") != output("xcrun", "--sdk", "macosx", "--show-sdk-version"):
              raise SystemExit("macOS SDK version mismatch")
          if toolchain.get("sdk_build") != output("xcrun", "--sdk", "macosx", "--show-sdk-build-version"):
              raise SystemExit("macOS SDK build mismatch")
          if platform.machine() != "arm64":
              raise SystemExit("persistent product validation requires Apple Silicon")

          classification = metrics.get("classification")
          if classification not in {"hot", "partially-warm", "cold-reset"}:
              raise SystemExit("invalid persistent cache classification")
          glaeda = metrics.get("glaeda", {})
          for key in ("cache_key", "invocation_identity", "generation"):
              if not isinstance(glaeda.get(key), str) or not glaeda[key]:
                  raise SystemExit(f"Glaeda receipt omitted {key}")
          if not isinstance(glaeda.get("reset_reasons"), list):
              raise SystemExit("Glaeda reset lineage is invalid")
          print(
              f"validated persistent product class={classification} "
              f"cache_key={glaeda['cache_key']} invocation={glaeda['invocation_identity']}"
          )
          PY

          revalidated=true
          {
            echo "hit=true"
            echo "classification=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["classification"])' "$metrics")"
            echo "metrics=$metrics"
          } >> "$GITHUB_OUTPUT"

      - name: Capture Ghostty revision
        if: steps.reuse-products.outputs.hit != 'true' && steps.persistent-restore.outputs.hit != 'true'
        id: ghostty-revision
        run: echo "sha=$(git -C ghostty rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache GhosttyKit.xcframework
        if: steps.reuse-products.outputs.hit != 'true' && steps.persistent-restore.outputs.hit != 'true'
        id: cache-ghosttykit-admission
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: GhosttyKit.xcframework
          key: ghosttykit-sentry-off-v1-${{ steps.ghostty-revision.outputs.sha }}

      - name: Download pre-built GhosttyKit.xcframework
        if: steps.reuse-products.outputs.hit != 'true' && steps.persistent-restore.outputs.hit != 'true' && steps.cache-ghosttykit-admission.outputs.cache-hit != 'true'
        run: ./scripts/download-prebuilt-ghosttykit.sh

      - name: Cache Swift packages
        id: swift-package-cache
        if: steps.reuse-products.outputs.hit != 'true' && steps.persistent-restore.outputs.hit != 'true'
        uses: ./.github/actions/cache-restore
        with:
          backend: ${{ inputs.cache_backend != 'default' && inputs.cache_backend || vars.CI_CACHE_BACKEND || 'r2' }}
          path: .ci-source-packages
          key: spm-${{ hashFiles('cmux.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'scripts/ci/swiftpm-cache-layout') }}
          restore-keys: spm-

      - name: Sanitize Swift package cache
        if: steps.reuse-products.outputs.hit != 'true' && steps.persistent-restore.outputs.hit != 'true'
        run: python3 scripts/ci/sanitize-xcode-source-packages-cache.py .ci-source-packages

      # The key names only the Xcode version and the canonical paths, so it is
      # known before the source tree is copied there.
      - name: Compute test compilation cache key
        if: steps.reuse-products.outputs.hit != 'true' && steps.persistent-restore.outputs.hit != 'true'
        id: compilation-cache-key
        run: |
          set -euo pipefail
          echo "fingerprint=$(scripts/ci/compile-app-host-test-product.sh canonical-fingerprint "$CMUX_COMPILE_ADMISSION_DERIVED_DATA")" >> "$GITHUB_OUTPUT"

      # The seed download (~40 s) needs only that key, so it runs while
      # packages resolve instead of after them. "Adopt the nightly DerivedData
      # seed" below reuses the seed this step picked and waits for it; if this
      # step fails, adopt picks and downloads itself.
      - name: Start the DerivedData seed download
        if: steps.reuse-products.outputs.hit != 'true' && steps.persistent-restore.outputs.hit != 'true' && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') && (vars.CI_ADMISSION_SEED_DERIVED_DATA || '1') != '0' && (inputs.cache_backend != 'default' && inputs.cache_backend || vars.CI_CACHE_BACKEND || 'r2') == 'r2'
        continue-on-error: true
        # Picking the seed probes the bucket before the download detaches; a
        # hung CDN must not hold up the resolve. adopt then picks for itself.
        timeout-minutes: 3
        env:
          SEED_PREFIX: admission-derived-data-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.compilation-cache-key.outputs.fingerprint }}-
          # A pull request builds on the merge commit's first parent, which
          # ci.yml reads off the checkout and verifies is GITHUB_SHA's; base.sha
          # is only the fallback. Main's full-suite dispatch builds GITHUB_SHA
          # itself, whose own seed may already exist, else its parent's.
          MERGED_ONTO: ${{ github.event_name == 'pull_request' && (inputs.source_parent1 || github.event.pull_request.base.sha) || github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/ci/seed_derived_data.py start \
            "$CMUX_COMPILE_ADMISSION_DERIVED_DATA" "$SEED_PREFIX" "$MERGED_ONTO"

      # Nothing here reads the workspace package cache after resolve, so it
      # moves into the canonical root instead of a second copy, and an exact
      # cache hit resolves without fetching every package remote. See
      # scripts/ci/canonical-build-root.sh and compile-app-host-test-product.sh.
      - name: Resolve Swift packages
        id: hosted-package-readiness
        if: steps.reuse-products.outputs.hit != 'true' && steps.persistent-restore.outputs.hit != 'true'
        env:
          CMUX_CI_MOVE_SOURCE_PACKAGES: "1"
          CMUX_CI_SWIFTPM_CACHE_EXACT_HIT: ${{ steps.swift-package-cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          started="$(python3 -c 'import time; print(time.monotonic())')"
          rm -rf "$CMUX_COMPILE_ADMISSION_DERIVED_DATA"
          scripts/ci/compile-app-host-test-product.sh canonical-resolve \
            "$CMUX_COMPILE_ADMISSION_DERIVED_DATA" "$PWD/.ci-source-packages"
          finished="$(python3 -c 'import time; print(time.monotonic())')"
          seconds="$(python3 -c 'import sys; print(round(float(sys.argv[2])-float(sys.argv[1]), 6))' "$started" "$finished")"
          echo "seconds=$seconds" >> "$GITHUB_OUTPUT"

      # No test compilation cache restore. Swift keys each compile job on its
      # whole module, so `cmux` and cmuxUITests missed on every file even with
      # the key, paths and Xcode matching the nightly seed (581/581 and 566/566
      # in sampled admission logs, 2026-09-24). Only modules unchanged since the
      # six-hourly seed hit, and the DerivedData seed below already leaves those
      # built. The restore spent 13-43 s pulling 932 MB for that.
      # tests/test_ci_test_compilation_cache_seed.sh pins its absence.

      # The compilation cache cannot help the app target: Swift keys each job on
      # its whole module, and `cmux` is one module. Xcode's incremental build
      # tracks dependencies per file, but only against an existing DerivedData,
      # and a fresh checkout makes every file look new. Adopt the DerivedData
      # seed-derived-data.yml built for the main commit this build sits on
      # (every main push that changes the build), or for its nearest ancestor
      # with one, built on this runner, Xcode and path. Restore the recorded
      # time onto every byte-identical input, and Xcode rebuilds only what
      # differs. Pull requests adopt the seed of the main commit they merge
      # onto. Main's full-suite dispatch adopts the seed of the commit it
      # tests: the seeder starts on the same push, so that seed is often still
      # building, and the nearest ancestor's (usually the parent's) leaves only
      # one merge's diff to compile. Seeds are written only by main-branch jobs
      # in the ci-cache-writer environment and read here without credentials.
      # Merge-group and other-branch dispatch builds stay clean. Any miss or
      # failure is today's cold build. CI_ADMISSION_SEED_DERIVED_DATA=0 turns
      # it off.
      #
      # The merge commit's first parent, not github.event.pull_request.base.sha:
      # the event's base can be commits older than the main this job compiles
      # (9567d6e against 2f0592d in job 107537609232), and each commit between
      # them costs compile time.
      - name: Adopt the nightly DerivedData seed
        id: seed-derived-data
        if: steps.reuse-products.outputs.hit != 'true' && steps.persistent-restore.outputs.hit != 'true' && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') && (vars.CI_ADMISSION_SEED_DERIVED_DATA || '1') != '0' && (inputs.cache_backend != 'default' && inputs.cache_backend || vars.CI_CACHE_BACKEND || 'r2') == 'r2'
        continue-on-error: true
        timeout-minutes: 8
        env:
          SEED_PREFIX: admission-derived-data-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.compilation-cache-key.outputs.fingerprint }}-
          # A pull request builds on the merge commit's first parent, which
          # ci.yml reads off the checkout and verifies is GITHUB_SHA's; base.sha
          # is only the fallback. Main's full-suite dispatch builds GITHUB_SHA
          # itself, whose own seed may already exist, else its parent's.
          MERGED_ONTO: ${{ github.event_name == 'pull_request' && (inputs.source_parent1 || github.event.pull_request.base.sha) || github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/ci/seed_derived_data.py adopt \
            "$CMUX_CI_CANONICAL_SRC" "$CMUX_COMPILE_ADMISSION_DERIVED_DATA" \
            "$SEED_PREFIX" "$MERGED_ONTO"

      - name: Compile app-host test product
        id: hosted-compile
        if: steps.reuse-products.outputs.hit != 'true' && steps.persistent-restore.outputs.hit != 'true'
        run: |
          set -uo pipefail
          started="$(python3 -c 'import time; print(time.monotonic())')"
          scripts/ci/compile-app-host-test-product.sh canonical-build \
            "$CMUX_COMPILE_ADMISSION_DERIVED_DATA" \
            "$PWD/.ci-source-packages" \
            "$CMUX_COMPILE_ADMISSION_CAS" \
            "$RUNNER_TEMP/cmux-compile-admission.txt"
          status=$?
          finished="$(python3 -c 'import time; print(time.monotonic())')"
          seconds="$(python3 -c 'import sys; print(round(float(sys.argv[2])-float(sys.argv[1]), 6))' "$started" "$finished")"
          echo "seconds=$seconds" >> "$GITHUB_OUTPUT"
          exit "$status"

      # Adoption sets a per-user Xcode default. Only a build whose inputs were
      # just replayed should ignore inode changes, so a reused runner does not
      # carry it into an unrelated job.
      - name: Forget the adopted-build inode override
        if: always() && steps.seed-derived-data.outputs.hit == 'true'
        continue-on-error: true
        run: defaults delete com.apple.dt.XCBuild IgnoreFileSystemDeviceInodeChanges || true

      - name: Generate Xcode build metrics receipt
        id: build-metrics
        if: always() && !cancelled() && steps.hosted-compile.outcome != 'skipped'
        continue-on-error: true
        env:
          HOSTED_COMPILE_SECONDS: ${{ steps.hosted-compile.outputs.seconds }}
          HOSTED_COMPILE_OUTCOME: ${{ steps.hosted-compile.outcome }}
        run: |
          set -euo pipefail
          args=(
            "$CMUX_COMPILE_ADMISSION_DERIVED_DATA"
            --output "$RUNNER_TEMP/xcode-build-metrics.json"
            --compile-outcome "$HOSTED_COMPILE_OUTCOME"
            --summary "$GITHUB_STEP_SUMMARY"
          )
          if [ -n "$HOSTED_COMPILE_SECONDS" ]; then
            args+=(--compile-seconds "$HOSTED_COMPILE_SECONDS")
          fi
          python3 scripts/ci/build_metrics.py "${args[@]}"

      - name: Upload Xcode build metrics receipt
        id: upload-build-metrics
        if: always() && !cancelled() && steps.build-metrics.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xcode-build-metrics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/xcode-build-metrics.json
          retention-days: 14
          if-no-files-found: ignore

      - name: Validate Swift warning budget
        id: warning-validation
        if: steps.reuse-products.outputs.hit != 'true'
        run: |
          set -euo pipefail
          started="$(python3 -c 'import time; print(time.monotonic())')"
          # The build writes one log per scheme, and the profile's first scheme
          # is the one whose warnings the budget covers (cmux for app-host,
          # cmux-cli-tests for a CLI-only product).
          first_scheme="$(python3 scripts/ci/product_input_identity.py schemes | awk '{print $1}')"
          log="$CMUX_COMPILE_ADMISSION_DERIVED_DATA/$first_scheme-build.log"
          test -s "$log" || { echo "::error::missing Swift warning log $log" >&2; exit 1; }
          python3 scripts/swift_warning_budget.py --log "$log"
          finished="$(python3 -c 'import time; print(time.monotonic())')"
          seconds="$(python3 -c 'import sys; print(round(float(sys.argv[2])-float(sys.argv[1]), 6))' "$started" "$finished")"
          echo "seconds=$seconds" >> "$GITHUB_OUTPUT"

      - name: Stage compiled package frameworks
        run: |
          set -euo pipefail
          products="$CMUX_COMPILE_ADMISSION_DERIVED_DATA/Build/Products/Debug"
          stable="/private/tmp/cmux-app-host-package-frameworks"
          mkdir -p "$stable"
          framework_source="$(find "$products" -type d -name 'CmuxAgentJournal*_PackageProduct.framework' -print -quit 2>/dev/null || true)"
          test -n "$framework_source"
          framework_root="$(dirname "$framework_source")"
          rsync -aL "$framework_root/" "$stable/"
          if [ -L "$products/PackageFrameworks" ]; then
            rm "$products/PackageFrameworks"
          fi
          mkdir -p "$products/PackageFrameworks"
          rsync -aL "$framework_root/" "$products/PackageFrameworks/"
          test -f "$products/PackageFrameworks/CmuxAgentJournal_27B6EF8727F6C277_PackageProduct.framework/Versions/A/CmuxAgentJournal_27B6EF8727F6C277_PackageProduct"

      # These no-socket probes take seconds and need only the compiled CLI.
      # Fail admission before allocating app-host shards or the runtime job.
      - name: Run early CLI binary smoke checks
        run: |
          set -euo pipefail
          CLI_BIN="$CMUX_COMPILE_ADMISSION_DERIVED_DATA/Build/Products/Debug/cmux"
          if [ ! -x "$CLI_BIN" ]; then
            echo "cmux CLI binary missing from this admission build" >&2
            exit 1
          fi
          CMUX_CLI_BIN="$CLI_BIN" python3 tests/test_cli_version_memory_guard.py
          CMUX_CLI_BIN="$CLI_BIN" python3 tests/test_cli_contract_help.py
          CMUX_CLI_BIN="$CLI_BIN" python3 tests/test_cli_config_doctor.py

      # Compile-only forks without targeted CLI tests have no artifact consumers and cannot seed reuse:
      # both the reuse selector and broker require an in-repository producer.
      # Keep unknown metadata, every full suite, and in-org reuse producers.
      - name: Start product publication timer
        run: echo "CMUX_PRODUCT_PUBLICATION_STARTED=$(python3 -c 'import time; print(time.monotonic())')" >> "$GITHUB_ENV"

      - name: Choose product artifact publication
        id: publish-products
        env:
          PRODUCT_FULL_SUITE: ${{ inputs.full_suite }}
          PRODUCT_CLI: ${{ inputs.cli }}
          PRODUCT_UNIT_SUITE: ${{ inputs.unit_suite }}
          PRODUCT_EVENT: ${{ github.event_name }}
          PRODUCT_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PRODUCT_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import os
          head = os.environ.get("PRODUCT_HEAD_REPOSITORY", "").strip()
          repository = os.environ.get("PRODUCT_REPOSITORY", "").strip()
          # `unit-ci` makes app-host unit tests a consumer of this product
          # under the compile-only policy, so the fork product stops being
          # unused and must still be packaged and uploaded.
          unused_fork_product = (
              os.environ.get("PRODUCT_FULL_SUITE") == "false"
              and os.environ.get("PRODUCT_CLI") == "false"
              and os.environ.get("PRODUCT_UNIT_SUITE") != "true"
              and os.environ.get("PRODUCT_EVENT") == "pull_request"
              and bool(head) and bool(repository)
              and head.casefold() != repository.casefold()
          )
          publish = not unused_fork_product
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"publish={str(publish).lower()}\n")
          if not publish:
              print("Skipping unused compile-only fork product packaging and upload.")
          PY

      - name: Package compiled app-host test product
        id: package-products
        if: steps.publish-products.outputs.publish == 'true'
        run: |
          set -euo pipefail
          # Fresh manifests embed the canonical checkout. Stamp that producer
          # before relocating into this job's workspace for reuse and consumers.
          if [ "${{ steps.reuse-products.outputs.hit }}" != true ] && [ "${{ steps.persistent-restore.outputs.hit }}" != true ]; then
            (cd "${CMUX_CI_CANONICAL_ROOT:-/private/tmp/cmux-ci}/src" && python3 scripts/ci/app_host_test_products.py stamp "$CMUX_COMPILE_ADMISSION_DERIVED_DATA")
            python3 scripts/ci/app_host_test_products.py restore "$CMUX_COMPILE_ADMISSION_DERIVED_DATA"
          fi
          python3 scripts/ci/app_host_test_products.py stamp "$CMUX_COMPILE_ADMISSION_DERIVED_DATA"
          python3 scripts/ci/reuse_app_host_products.py seal "$CMUX_COMPILE_ADMISSION_DERIVED_DATA"
          archive="$RUNNER_TEMP/app-host-products.tar.gz"
          # COPYFILE_DISABLE: see the matching note in test-e2e.yml. gzip -1
          # takes about a third of the default level's time on this product
          # for an archive about 11% larger.
          COPYFILE_DISABLE=1 tar -chf - -C "$CMUX_COMPILE_ADMISSION_DERIVED_DATA" Build/Products | gzip -1 > "$archive"
          echo "sha256=$(shasum -a 256 "$archive" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Upload compiled app-host test product
        id: upload-products
        if: steps.publish-products.outputs.publish == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-host-products-v1-${{ steps.product-key.outputs.key }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/app-host-products.tar.gz
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

      - name: Package app-host product layers
        id: package-layers
        if: ${{ steps.upload-products.outcome == 'success' && inputs.full_suite == 'true' && inputs.product_artifacts == 'layered' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        continue-on-error: true
        run: |
          set -euo pipefail
          normalized="$(mktemp -d "$RUNNER_TEMP/cmux-layer-normalized.XXXXXX")"
          trap 'rm -rf "$normalized"' EXIT
          tar -xzf "$RUNNER_TEMP/app-host-products.tar.gz" -C "$normalized"
          python3 scripts/ci/app_host_layer_transport.py identity "$normalized/identity.json"
          python3 scripts/ci/app_host_layered_products.py pack             "$normalized" "$RUNNER_TEMP/app-host-layers"             --identity "$normalized/identity.json"

      - name: Upload app-host app-cli layer
        id: upload-layer-app-cli
        if: steps.package-layers.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-host-layer-app-cli-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/app-host-layers/app-cli.aar
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

      - name: Upload app-host runtime layer
        id: upload-layer-runtime
        if: steps.package-layers.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-host-layer-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/app-host-layers/runtime.aar
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

      - name: Upload app-host tests layer
        id: upload-layer-tests
        if: steps.package-layers.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-host-layer-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/app-host-layers/tests.aar
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

      - name: Upload app-host diagnostics layer
        id: upload-layer-diagnostics
        if: steps.package-layers.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-host-layer-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/app-host-layers/diagnostics.aar
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

      - name: Pin app-host layer provider identities
        id: pin-layer-index
        if: ${{ steps.upload-layer-app-cli.outcome == 'success' && steps.upload-layer-runtime.outcome == 'success' && steps.upload-layer-tests.outcome == 'success' && steps.upload-layer-diagnostics.outcome == 'success' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          CMUX_RUN_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          APP_CLI_ID: ${{ steps.upload-layer-app-cli.outputs.artifact-id }}
          APP_CLI_DIGEST: ${{ steps.upload-layer-app-cli.outputs.artifact-digest }}
          RUNTIME_ID: ${{ steps.upload-layer-runtime.outputs.artifact-id }}
          RUNTIME_DIGEST: ${{ steps.upload-layer-runtime.outputs.artifact-digest }}
          TESTS_ID: ${{ steps.upload-layer-tests.outputs.artifact-id }}
          TESTS_DIGEST: ${{ steps.upload-layer-tests.outputs.artifact-digest }}
          DIAGNOSTICS_ID: ${{ steps.upload-layer-diagnostics.outputs.artifact-id }}
          DIAGNOSTICS_DIGEST: ${{ steps.upload-layer-diagnostics.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          rows = []
          for name in ("app-cli", "runtime", "tests", "diagnostics"):
              key = name.replace("-", "_").upper()
              rows.append({
                  "name": name,
                  "artifact_id": os.environ[key + "_ID"],
                  "artifact_digest": os.environ[key + "_DIGEST"],
              })
          (Path(os.environ["RUNNER_TEMP"]) / "app-host-layer-receipts.json").write_text(
              json.dumps(rows)
          )
          PY
          python3 scripts/ci/app_host_layer_transport.py publish-index             "$RUNNER_TEMP/app-host-layers"             --receipts "$RUNNER_TEMP/app-host-layer-receipts.json"

      - name: Upload pinned app-host layer index
        id: upload-layer-index
        if: steps.pin-layer-index.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-host-layer-index-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/app-host-layers/app-host-layer-index.json
            ${{ runner.temp }}/app-host-layers/app-host-layers.json
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

      - name: Record compile admission metrics
        id: admission-metrics
        if: always() && !cancelled()
        env:
          ROUTE_USE_PERSISTENT: ${{ steps.persistent-route.outputs.use_persistent }}
          ROUTE_REASON: ${{ steps.persistent-route.outputs.fallback_reason }}
          QUEUE_TO_START_SECONDS: ${{ steps.persistent-route.outputs.queue_to_start_seconds }}
          PRODUCER_ALLOCATED_SECONDS: ${{ steps.persistent-route.outputs.producer_allocated_seconds }}
          ROUTE_WALL_SECONDS: ${{ steps.persistent-route.outputs.route_wall_seconds }}
          PERSISTENT_HIT: ${{ steps.persistent-restore.outputs.hit }}
          PERSISTENT_CLASS: ${{ steps.persistent-restore.outputs.classification }}
          PERSISTENT_METRICS: ${{ steps.persistent-restore.outputs.metrics }}
          HOSTED_QUEUE_SECONDS: ${{ steps.hosted-queue.outputs.seconds }}
          HOSTED_SOURCE_PREP_SECONDS: ${{ steps.hosted-source-prep.outputs.seconds }}
          HOSTED_PACKAGE_SECONDS: ${{ steps.hosted-package-readiness.outputs.seconds }}
          HOSTED_COMPILE_SECONDS: ${{ steps.hosted-compile.outputs.seconds }}
          WARNING_SECONDS: ${{ steps.warning-validation.outputs.seconds }}
          SEED_OUTCOME: ${{ steps.seed-derived-data.outcome }}
          SEED_HIT: ${{ steps.seed-derived-data.outputs.hit }}
          SEED_KEY: ${{ steps.seed-derived-data.outputs.key }}
          SEED_REASON: ${{ steps.seed-derived-data.outputs.reason }}
          SEED_CHANGED_INPUTS: ${{ steps.seed-derived-data.outputs.changed_inputs }}
          SEED_DISTANCE: ${{ steps.seed-derived-data.outputs.seed_distance }}
          SEED_SECONDS: ${{ steps.seed-derived-data.outputs.seconds }}
          PRODUCT_PUBLISHED: ${{ steps.publish-products.outputs.publish }}
          PRODUCT_UPLOAD_OUTCOME: ${{ steps.upload-products.outcome }}
        run: |
          set -euo pipefail
          finished="$(python3 -c 'import time; print(time.monotonic())')"
          publication_seconds="$(python3 -c 'import os,sys; start=os.environ.get("CMUX_PRODUCT_PUBLICATION_STARTED"); print("" if not start else round(float(sys.argv[1])-float(start), 6))' "$finished")"
          admission_seconds="$(python3 -c 'import os,sys; print(round(float(sys.argv[1])-float(os.environ["CMUX_MACOS_ADMISSION_STARTED"]), 6))' "$finished")"
          metrics="$RUNNER_TEMP/macos-compile-admission-metrics.json"

          FINISHED="$finished" PUBLICATION_SECONDS="$publication_seconds" ADMISSION_SECONDS="$admission_seconds" METRICS="$metrics" python3 - <<'PY'
          import json
          import os

          def number(name):
              raw = os.environ.get(name, "").strip()
              return float(raw) if raw else None

          persistent = {}
          persistent_path = os.environ.get("PERSISTENT_METRICS", "").strip()
          if persistent_path:
              try:
                  persistent = json.load(open(persistent_path))
              except (OSError, ValueError):
                  persistent = {}

          persistent_hit = os.environ.get("PERSISTENT_HIT") == "true"
          classification = os.environ.get("PERSISTENT_CLASS") if persistent_hit else "hosted fallback"
          fallback_reason = ""
          if not persistent_hit:
              if os.environ.get("ROUTE_USE_PERSISTENT") == "true":
                  fallback_reason = "persistent_artifact_validation_failed"
              else:
                  fallback_reason = os.environ.get("ROUTE_REASON") or "persistent_route_unused"

          source_preparation = (
              persistent.get("source_preparation_seconds")
              if persistent_hit else number("HOSTED_SOURCE_PREP_SECONDS")
          )
          package_readiness = (
              persistent.get("package_readiness_seconds")
              if persistent_hit else number("HOSTED_PACKAGE_SECONDS")
          )
          compile_duration = (
              persistent.get("compile_duration_seconds")
              if persistent_hit else number("HOSTED_COMPILE_SECONDS")
          )

          result = {
              "schema_version": 1,
              "classification": classification,
              "fallback_reason": fallback_reason,
              "queue_to_start_seconds": (
                  number("QUEUE_TO_START_SECONDS") if persistent_hit else number("HOSTED_QUEUE_SECONDS")
              ),
              "source_preparation_seconds": source_preparation,
              "package_readiness_seconds": package_readiness,
              "compile_duration_seconds": compile_duration,
              "warning_validation_seconds": number("WARNING_SECONDS"),
              "artifact_publication_seconds": number("PUBLICATION_SECONDS"),
              "route_wall_seconds": number("ROUTE_WALL_SECONDS"),
              "required_admission_runner_seconds": number("ADMISSION_SECONDS"),
              # Route observation runs inside the already-allocated hosted
              # admission job, so ADMISSION_SECONDS already contains it.
              "total_macos_compile_admission_seconds": number("ADMISSION_SECONDS"),
              "persistent_runner_allocated_seconds": number("PRODUCER_ALLOCATED_SECONDS"),
              "hosted_admission_runner_allocated_seconds": number("ADMISSION_SECONDS"),
              "product_published": os.environ.get("PRODUCT_PUBLISHED") == "true",
              "product_upload_outcome": os.environ.get("PRODUCT_UPLOAD_OUTCOME", ""),
              "persistent": persistent,
              "seed_derived_data": {
                  "outcome": os.environ.get("SEED_OUTCOME", ""),
                  "hit": os.environ.get("SEED_HIT") == "true",
                  "key": os.environ.get("SEED_KEY", ""),
                  "reason": os.environ.get("SEED_REASON", ""),
                  "changed_inputs": number("SEED_CHANGED_INPUTS"),
                  "commits_behind": number("SEED_DISTANCE"),
                  "adoption_seconds": number("SEED_SECONDS"),
              },
          }
          with open(os.environ["METRICS"], "w") as stream:
              json.dump(result, stream, sort_keys=True, indent=2)
              stream.write("\n")
          print(json.dumps(result, sort_keys=True))
          PY

          echo "path=$metrics" >> "$GITHUB_OUTPUT"
          METRICS="$metrics" python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import os

          data = json.load(open(os.environ["METRICS"]))
          print("### macOS compile admission timing")
          print()
          for label, key in (
              ("class", "classification"),
              ("fallback reason", "fallback_reason"),
              ("queue to owned runner", "queue_to_start_seconds"),
              ("source preparation", "source_preparation_seconds"),
              ("package readiness", "package_readiness_seconds"),
              ("compile", "compile_duration_seconds"),
              ("warning validation", "warning_validation_seconds"),
              ("artifact publication", "artifact_publication_seconds"),
              ("route/controller wall", "route_wall_seconds"),
              ("required admission runner", "required_admission_runner_seconds"),
              ("total admission wall", "total_macos_compile_admission_seconds"),
              ("persistent runner allocated", "persistent_runner_allocated_seconds"),
          ):
              print(f"- {label}: `{data.get(key)}`")
          seed = data.get("seed_derived_data") or {}
          if seed.get("hit"):
              behind = seed.get("commits_behind")
              distance = "newest pointer" if behind is None else f"{int(behind)} commits behind"
              print(f"- seed DerivedData: `{seed.get('key')}`, {distance}, {seed.get('changed_inputs')} inputs changed, adopted in {seed.get('adoption_seconds')}s")
          elif seed.get("outcome") not in (None, "", "skipped"):
              print(f"- seed DerivedData: miss (`{seed.get('reason')}`)")
          PY

      - name: Upload compile admission metrics
        id: upload-admission-metrics
        if: always() && !cancelled() && steps.admission-metrics.outputs.path != ''
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-compile-admission-metrics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.admission-metrics.outputs.path }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Seed node-local compiled product cache
        if: steps.publish-products.outputs.publish == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload-products.outputs.artifact-id }}
          ARTIFACT_PROVIDER_DIGEST: ${{ steps.upload-products.outputs.artifact-digest }}
          EXPECTED_SHA256: ${{ steps.package-products.outputs.sha256 }}
          CMUX_PRODUCT_CONTRACT: ${{ steps.product-key.outputs.key }}
          CMUX_PRODUCT_SOURCE_REVISION: ${{ github.sha }}
          CMUX_PRODUCT_PRODUCER_RUN_ID: ${{ github.run_id }}
          CMUX_PRODUCT_PRODUCER_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: python3 scripts/ci/node_product_cache.py seed "$RUNNER_TEMP/app-host-products.tar.gz"

      # A changed-suites run (inputs.unit_in_admission) tests here, on the
      # runner that just built the product, rather than queueing a separate
      # `app-host unit tests` worker to download it again. Everything above has
      # already packaged and uploaded the product, so a test failure below
      # still leaves it for reruns (app-host-test-rerun.yml) and reuse. These
      # steps run the same scripts, in the same order, as that worker's
      # changed-suites run; only the product's source differs. The restore
      # unpacks the uploaded archive into a DerivedData of its own, so the
      # tests run the exact bytes the other consumers download.
      - name: Prepare isolated DerivedData
        id: test-derived-data
        if: ${{ inputs.unit_in_admission == 'true' }}
        run: |
          set -euo pipefail
          DERIVED_DATA_PATH="$RUNNER_TEMP/cmux-derived-data-tests-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-shard-${CMUX_APP_HOST_SHARD}"
          rm -rf "$DERIVED_DATA_PATH"
          mkdir -p "$DERIVED_DATA_PATH"
          echo "CMUX_DERIVED_DATA_PATH=$DERIVED_DATA_PATH" >> "$GITHUB_ENV"

      - name: Restore compiled app-host test product
        id: restore-test-products
        if: ${{ inputs.unit_in_admission == 'true' }}
        env:
          ARTIFACT_ID: ${{ steps.upload-products.outputs.artifact-id }}
          ARTIFACT_PROVIDER_DIGEST: ${{ steps.upload-products.outputs.artifact-digest }}
          EXPECTED_SHA256: ${{ steps.package-products.outputs.sha256 }}
          CMUX_PRODUCT_CONTRACT: ${{ steps.product-key.outputs.key }}
          CMUX_PRODUCT_SOURCE_REVISION: ${{ github.sha }}
          CMUX_PRODUCT_PRODUCER_RUN_ID: ${{ github.run_id }}
          CMUX_PRODUCT_PRODUCER_RUN_ATTEMPT: ${{ github.run_attempt }}
          CMUX_PRODUCT_FROM_PRODUCER: "true"
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/app-host-products"
          ln -f "$RUNNER_TEMP/app-host-products.tar.gz" "$RUNNER_TEMP/app-host-products/app-host-products.tar.gz"
          scripts/ci/restore-app-host-test-product.sh

      - name: Prepare isolated app-host home
        id: prepare-app-host-home
        if: ${{ inputs.unit_in_admission == 'true' }}
        run: scripts/ci/prepare-app-host-home.sh

      - name: Enumerate built app-host tests
        if: ${{ inputs.unit_in_admission == 'true' }}
        run: scripts/ci/enumerate-app-host-tests.sh

      - name: Upload built app-host test inventory
        if: ${{ inputs.unit_in_admission == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-app-host-test-inventory-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/cmux-app-host-test-enumeration.json
            ${{ runner.temp }}/cmux-app-host-test-inventory.json
            ${{ runner.temp }}/cmux-app-host-test-enumeration.log
          if-no-files-found: error
          retention-days: 14

      - name: Enable XCTest automation mode
        if: ${{ inputs.unit_in_admission == 'true' }}
        run: scripts/ci/enable-xctest-automation-mode.sh

      - name: Run changed app-host suites
        id: run-changed-suites
        if: ${{ inputs.unit_in_admission == 'true' }}
        run: scripts/ci/run-app-host-unit-batches.sh

      - name: Report a changed-suites failure apart from the compile
        if: ${{ failure() && steps.run-changed-suites.outcome == 'failure' }}
        run: |
          echo "::error title=Changed suites failed::The app-host product compiled and was uploaded; the changed suites failed in 'Run changed app-host suites'. app-host-test-rerun.yml can rerun them against this run's product."

      - name: Collect app-host failure diagnostics
        id: collect-app-host-diagnostics
        if: ${{ (failure() || cancelled()) && steps.test-derived-data.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: scripts/ci/collect-app-host-diagnostics.sh

      - name: Upload app-host failure diagnostics
        id: upload-app-host-diagnostics
        if: ${{ (failure() || cancelled()) && steps.test-derived-data.outcome == 'success' }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-app-host-diagnostics-shard-${{ env.CMUX_APP_HOST_SHARD }}-run-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cmux-app-host-diagnostics-shard-${{ env.CMUX_APP_HOST_SHARD }}-run-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 7

      - name: Report evidence collection outcomes
        if: ${{ always() }}
        env:
          EVIDENCE_OUTCOMES: >-
            upload-admission-metrics=${{ steps.upload-admission-metrics.outcome }}
            upload-build-metrics=${{ steps.upload-build-metrics.outcome }}
            collect-app-host-diagnostics=${{ steps.collect-app-host-diagnostics.outcome }}
            upload-app-host-diagnostics=${{ steps.upload-app-host-diagnostics.outcome }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os

          rows = []
          for entry in os.environ["EVIDENCE_OUTCOMES"].split():
              label, _, outcome = entry.partition("=")
              # An empty outcome means the step never ran, which is the same
              # thing as skipped for this purpose.
              rows.append((label, outcome or "skipped"))

          # A green job skips every evidence step by design, so stay silent
          # rather than adding a section to every summary in the repository.
          if any(outcome != "skipped" for _, outcome in rows):
              summary = os.environ.get("GITHUB_STEP_SUMMARY")
              if summary:
                  with open(summary, "a", encoding="utf-8") as handle:
                      handle.write("### Evidence collection\n\n")
                      for label, outcome in rows:
                          handle.write(f"- {label}: `{outcome}`\n")
                      handle.write("\n")

          # Annotations go to stdout, where the runner reads them, and surface
          # at the top of the run instead of inside a step nobody opens.
          for label, outcome in rows:
              if outcome == "failure":
                  print(
                      f"::warning title=Evidence not captured::{label} failed, "
                      "so its evidence does not exist for this job"
                  )
          PY

      - name: Clean up isolated app-host home
        if: ${{ always() && inputs.unit_in_admission == 'true' }}
        env:
          CMUX_APP_HOST_PREPARATION_OUTCOME: ${{ steps.prepare-app-host-home.outcome }}
        run: |
          # The same contract as the cleanup in `app-host unit tests`: once
          # setup starts, even partial or cancelled preparation needs cleanup.
          case "$CMUX_APP_HOST_PREPARATION_OUTCOME" in
            skipped|"")
              echo "App-host preparation did not start; no isolated home to clean."
              ;;
            success|failure|cancelled)
              scripts/ci/run-in-console-session.sh scripts/ci/cleanup-app-host-home.sh
              ;;
            *)
              echo "::error::Unexpected app-host preparation outcome: $CMUX_APP_HOST_PREPARATION_OUTCOME"
              exit 1
              ;;
          esac

  app-host-unit-tests:
    permissions:
      contents: read
      actions: read
      id-token: write
    needs:
      - macos-compile-admission
    # !cancelled() disables the implicit success() gate, which GitHub evaluates
    # over the transitive needs chain: linux-preflight runs behind routed linux
    # jobs that legitimately skip (web/go/agent-session paths), and that
    # transitive skip otherwise marks every macOS job skipped even when
    # linux-preflight itself succeeds. Require the direct needs explicitly.
    # A changed-suites run that compile admission ran itself
    # (inputs.unit_in_admission) needs no worker here.
    if: ${{ !cancelled() && needs.macos-compile-admission.result == 'success' && inputs.macos == 'true' && (inputs.full_suite == 'true' || inputs.unit_suite == 'true') && inputs.unit_in_admission != 'true' }}
    name: ${{ inputs.unit_selectors != '' && 'app-host unit tests (changed suites)' || format('app-host unit tests ({0}/7)', matrix.shard) }}
    # Every consumer runs on compile admission's pool and pins its Xcode,
    # both read from the admission's outputs. The shards run test-without-building
    # against the admission's cmuxTests bundle, which only loads under the
    # Xcode that linked it: a bundle linked by Xcode 26.6 (macos-26) imports
    # Testing.framework symbols Xcode 26.3 (macos-15) does not ship, and dies
    # in dlopen before running a test. Striping the shards over pools with
    # different Xcodes (#14097) did exactly that once MACOS_RUNNER_PR moved
    # compile admission to macOS 26. To spread shards over providers again,
    # every pool involved must carry the admission's exact Xcode; the
    # restore step refuses an older one with both versions named.
    runs-on: ${{ needs.macos-compile-admission.outputs.runner }}
    timeout-minutes: 75
    strategy:
      # A pull request wants every shard's failures in one run. A merge group
      # only needs a verdict, and the first failure already is one.
      fail-fast: ${{ github.event_name == 'merge_group' }}
      matrix:
        # Each row is a consumer. The rows are JSON because a static include
        # row always becomes a job, and a changed-suites run
        # (inputs.unit_selectors) must drop the seven numbered consumers for
        # one worker. That worker is shard 8, which matches none of the
        # numbered shards below that own a strict step, so it executes only
        # its own batch. No row names a pool: see runs-on above.
        include: >-
          ${{ fromJSON(inputs.unit_selectors != '' && '[
          {"shard": 8}
          ]' || '[
          {"shard": 1},
          {"shard": 2},
          {"shard": 3},
          {"shard": 4},
          {"shard": 5},
          {"shard": 6},
          {"shard": 7}
          ]') }}
    env:
      CMUX_NODE_PRODUCT_CACHE_ROOT: ${{ vars.CMUX_NODE_PRODUCT_CACHE_ROOT }}
      CMUX_NODE_PRODUCT_CACHE_MAX_BYTES: ${{ vars.CMUX_NODE_PRODUCT_CACHE_MAX_BYTES }}
      CMUX_NODE_PRODUCT_CACHE_WAIT_SECONDS: ${{ vars.CMUX_NODE_PRODUCT_CACHE_WAIT_SECONDS }}
      CMUX_ARTIFACT_PEER_URLS: ${{ vars.CMUX_ARTIFACT_PEER_URLS }}
      CMUX_ARTIFACT_PEER_TOKEN_FILE: ${{ vars.CMUX_ARTIFACT_PEER_TOKEN_FILE }}
      # This independent job-level marker makes every app-host wrapper fail
      # closed if a setup step or environment handoff loses either redirect.
      CMUX_CI_APP_HOST_ISOLATION_REQUIRED: "1"
      CMUX_APP_HOST_SHARD: ${{ matrix.shard }}
      CMUX_APP_HOST_UNIT_SELECTORS: ${{ inputs.unit_selectors }}
      CMUX_APP_HOST_CAPTURE_XCRESULTS: "1"
      # The admission's own pin, so the shards select the Xcode that linked
      # the product they run.
      CMUX_CI_XCODE_APP: ${{ needs.macos-compile-admission.outputs.xcode_app }}
      CMUX_CI_REQUIRED_MACOS_SDK_MAJOR: "26"
      CMUX_SKIP_ZIG_BUILD: "1"
      # Global search owns a seventh consumer because its serialized container
      # takes about eight minutes; it skips the broad batches entirely. The
      # remaining strict groups share workers with broad batches, so reserve
      # their measured wall time when packing those six workers.
      CMUX_APP_HOST_GLOBAL_SEARCH_SHARD: "7"
      CMUX_APP_HOST_CLI_REGRESSION_SHARD: "4"
      CMUX_APP_HOST_FOCUSED_REGRESSION_B_SHARD: "5"
      CMUX_APP_HOST_FOCUSED_REGRESSION_SHARD: "6"
      CMUX_APP_HOST_RESERVED_WALL_SECONDS: "4=235 5=213 6=235"
      # Four-way packing now exceeds the app-host's memory budget as the suite
      # grows: a shard can crash around 1,000 UI tests and poison the remaining
      # selectors. Six-way packing keeps each broad shard near 13 minutes of
      # measured work; allow focused gates and one app-host restart headroom.
      CMUX_UNIT_TEST_TIMEOUT_SECONDS: "1800"
      # The broad shard can spend several minutes in XCTest's post-suite
      # teardown while native UI processes drain. Allow that quiet period
      # within the job's 75-minute cap instead of restarting a healthy batch.
      CMUX_XCODEBUILD_NONINTERACTIVE_IDLE_TIMEOUT_SECONDS: "1200"
      # A crashed app host is relaunched by xcodebuild, which resumes the run
      # and can crash again indefinitely, so neither the idle timeout above nor
      # the 75-minute job cap ends a crash loop early. A healthy shard restarts
      # zero times and the wall-clock budget above allows one, so aborting on
      # the third restart leaves that headroom untouched while bounding the
      # loop. Wall clock cannot make this call: the measured 7.55-minute median
      # of the step and the 40-plus-minute crash-looping shards are not
      # separable by a duration threshold with any safe margin.
      # https://github.com/manaflow-ai/cmux/issues/13707
      CMUX_XCODEBUILD_NONINTERACTIVE_RESTART_BUDGET: "2"
      # XCTest app-host crashes can leave xcodebuild waiting in Swift's crash
      # backtracer until the job timeout. Keep crash handling non-interactive
      # and cheap so xcodebuild can restart/finish the suite.
      SWIFT_BACKTRACE: "interactive=no,timeout=0s,symbolicate=off,color=no"
      CMUX_XCODEBUILD_NONINTERACTIVE_POST_TEST_TIMEOUT_SECONDS: "45"
    steps:
      # Runs before checkout so a misrouted shard never checks out the PR.
      # The self-hosted fleet also carries a macos-26 label, so a macos-*
      # request must prove it landed on GitHub-hosted capacity.
      - name: Verify GitHub-hosted route
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          REQUESTED_RUNNER: ${{ needs.macos-compile-admission.outputs.runner }}
          RUNNER_CONTEXT_NAME: ${{ runner.name }}
        run: |
          set -euo pipefail
          case "$REQUESTED_RUNNER" in
            macos-*)
              if [ "$RUNNER_ENVIRONMENT" != "github-hosted" ]; then
                echo "::error::$REQUESTED_RUNNER resolved outside GitHub-hosted capacity: $RUNNER_CONTEXT_NAME"
                exit 1
              fi
              ;;
          esac

      - name: Clear stale git locks (self-hosted reused workspace)
        shell: bash
        run: |
          # Self-hosted macOS runners reuse the workspace. A job cancelled or
          # killed mid-checkout can leave a stale .git/modules/*/index.lock that
          # fails every later submodule checkout (e.g. ghostty). Clear them first.
          ws="${GITHUB_WORKSPACE:-$PWD}"
          rm -f "$ws/.git/index.lock" 2>/dev/null || true
          if [ -d "$ws/.git/modules" ]; then
            find "$ws/.git/modules" -type f -name "*.lock" -delete 2>/dev/null || true
          fi

      - name: Checkout
        id: checkout
        continue-on-error: true
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # WarpBuild can lose GitHub DNS on an otherwise healthy runner. Retry the
      # checkout once only after that action fails; healthy jobs still perform
      # one checkout, and a second failure remains a hard failure with evidence.
      - name: Retry checkout after transient network failure
        id: checkout-retry
        if: steps.checkout.outcome == 'failure'
        continue-on-error: true
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Diagnose checkout network failure
        if: steps.checkout.outcome == 'failure' && steps.checkout-retry.outcome == 'failure'
        timeout-minutes: 1
        run: |
          set -u

          # Keep provider/network evidence in the job log without failing the original
          # operation. These commands are intentionally read-only and emit no tokens.
          echo "== network diagnostics (runner=${RUNNER_NAME:-unknown}) ==" >&2
          if command -v scutil >/dev/null 2>&1; then
            scutil --dns 2>&1 || true
          fi
          if command -v route >/dev/null 2>&1; then
            route -n get default 2>&1 || true
          fi
          if command -v ifconfig >/dev/null 2>&1; then
            ifconfig 2>&1 || true
          fi
          if command -v dscacheutil >/dev/null 2>&1; then
            dscacheutil -q host -a name github.com 2>&1 || true
          fi
          if command -v curl >/dev/null 2>&1; then
            curl --connect-timeout 5 --max-time 10 --silent --show-error --head https://github.com/ 2>&1 || true
          fi
          echo "== end network diagnostics ==" >&2
          exit 1

      - name: Select Xcode
        run: |
          set -euo pipefail
          ./scripts/select-ci-xcode.sh

      - name: Prepare isolated DerivedData
        run: |
          set -euo pipefail
          DERIVED_DATA_PATH="$RUNNER_TEMP/cmux-derived-data-tests-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-shard-${{ matrix.shard }}"
          rm -rf "$DERIVED_DATA_PATH"
          mkdir -p "$DERIVED_DATA_PATH"
          echo "CMUX_DERIVED_DATA_PATH=$DERIVED_DATA_PATH" >> "$GITHUB_ENV"

      - name: Try node-local compiled product cache
        id: node-products
        continue-on-error: true
        env:
          ARTIFACT_ID: ${{ needs.macos-compile-admission.outputs.artifact_id }}
          ARTIFACT_PROVIDER_DIGEST: ${{ needs.macos-compile-admission.outputs.artifact_digest }}
          EXPECTED_SHA256: ${{ needs.macos-compile-admission.outputs.sha256 }}
          CMUX_PRODUCT_CONTRACT: ${{ needs.macos-compile-admission.outputs.product_contract }}
          CMUX_PRODUCT_SOURCE_REVISION: ${{ needs.macos-compile-admission.outputs.source_revision }}
          CMUX_PRODUCT_PRODUCER_RUN_ID: ${{ needs.macos-compile-admission.outputs.producer_run_id }}
          CMUX_PRODUCT_PRODUCER_RUN_ATTEMPT: ${{ needs.macos-compile-admission.outputs.producer_run_attempt }}
          CMUX_NODE_PRODUCT_CACHE_FALLBACK_SOURCE: ${{ vars.CMUX_ARTIFACT_PEER_URLS != '' && 'peer' || (vars.CI_ARTIFACT_R2_URL != '' && 'r2' || 'github') }}
        run: python3 scripts/ci/node_product_cache.py acquire "$RUNNER_TEMP/app-host-products"

      - name: Try trusted fleet peer artifact source
        id: peer-products
        if: steps.node-products.outputs.hit != 'true'
        continue-on-error: true
        env:
          ARTIFACT_ID: ${{ needs.macos-compile-admission.outputs.artifact_id }}
          ARTIFACT_PROVIDER_DIGEST: ${{ needs.macos-compile-admission.outputs.artifact_digest }}
          EXPECTED_SHA256: ${{ needs.macos-compile-admission.outputs.sha256 }}
          CMUX_PRODUCT_CONTRACT: ${{ needs.macos-compile-admission.outputs.product_contract }}
          CMUX_PRODUCT_SOURCE_REVISION: ${{ needs.macos-compile-admission.outputs.source_revision }}
          CMUX_PRODUCT_PRODUCER_RUN_ID: ${{ needs.macos-compile-admission.outputs.producer_run_id }}
          CMUX_PRODUCT_PRODUCER_RUN_ATTEMPT: ${{ needs.macos-compile-admission.outputs.producer_run_attempt }}
        run: python3 scripts/ci/peer_product_source.py fetch "$RUNNER_TEMP/app-host-products"

      - name: Restore selective app-host product layers
        id: restore-layers
        if: steps.node-products.outputs.hit != 'true' && steps.peer-products.outputs.hit != 'true' && needs.macos-compile-admission.outputs.layer_index_artifact_id != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          CMUX_RUN_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CMUX_APP_HOST_LAYER_PROFILE: app-host-tests
          LAYER_INDEX_ID: ${{ needs.macos-compile-admission.outputs.layer_index_artifact_id }}
          LAYER_INDEX_DIGEST: ${{ needs.macos-compile-admission.outputs.layer_index_digest }}
        run: |
          python3 scripts/ci/app_host_layer_transport.py restore             "${CMUX_DERIVED_DATA_PATH}-layers"             --index-id "$LAYER_INDEX_ID"             --index-digest "$LAYER_INDEX_DIGEST"

      # R2 is an optional remote broker. With no configured endpoint, a peer
      # miss falls straight through to the canonical GitHub artifact.
      - name: Try shared R2 artifact transport
        id: r2-products
        if: steps.node-products.outputs.hit != 'true' && steps.peer-products.outputs.hit != 'true' && steps.restore-layers.outputs.hit != 'true' && vars.CI_ARTIFACT_R2_URL != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          CI_ARTIFACT_R2_URL: ${{ vars.CI_ARTIFACT_R2_URL }}
          ARTIFACT_ID: ${{ needs.macos-compile-admission.outputs.artifact_id }}
          ARTIFACT_PROVIDER_DIGEST: ${{ needs.macos-compile-admission.outputs.artifact_digest }}
        run: python3 scripts/ci/restore-r2-artifact.py

      # Same exact-ID GitHub artifact, read over parallel range requests. The
      # single-stream download-artifact path sustained ~2 MB/s on Blacksmith
      # macOS (7-10 min per consumer); it stays below as the fallback.
      - name: Try parallel GitHub artifact transport
        id: parallel-products
        if: steps.node-products.outputs.hit != 'true' && steps.peer-products.outputs.hit != 'true' && steps.restore-layers.outputs.hit != 'true' && steps.r2-products.outputs.hit != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.macos-compile-admission.outputs.artifact_id }}
          ARTIFACT_PROVIDER_DIGEST: ${{ needs.macos-compile-admission.outputs.artifact_digest }}
        run: python3 scripts/ci/parallel_artifact_download.py

      - name: Download compiled app-host test product
        if: steps.node-products.outputs.hit != 'true' && steps.peer-products.outputs.hit != 'true' && steps.restore-layers.outputs.hit != 'true' && steps.r2-products.outputs.hit != 'true' && steps.parallel-products.outputs.hit != 'true'
        uses: ./.github/actions/download-test-product
        with:
          artifact-id: ${{ needs.macos-compile-admission.outputs.artifact_id }}
          path: ${{ runner.temp }}/app-host-products

      - name: Restore compiled app-host test product
        id: restore-products
        env:
          ARTIFACT_ID: ${{ needs.macos-compile-admission.outputs.artifact_id }}
          ARTIFACT_PROVIDER_DIGEST: ${{ needs.macos-compile-admission.outputs.artifact_digest }}
          EXPECTED_SHA256: ${{ needs.macos-compile-admission.outputs.sha256 }}
          CMUX_PRODUCT_CONTRACT: ${{ needs.macos-compile-admission.outputs.product_contract }}
          CMUX_PRODUCT_SOURCE_REVISION: ${{ needs.macos-compile-admission.outputs.source_revision }}
          CMUX_PRODUCT_PRODUCER_RUN_ID: ${{ needs.macos-compile-admission.outputs.producer_run_id }}
          CMUX_PRODUCT_PRODUCER_RUN_ATTEMPT: ${{ needs.macos-compile-admission.outputs.producer_run_attempt }}
          CMUX_LAYER_RESTORED: ${{ steps.restore-layers.outputs.hit }}
          CMUX_NODE_PRODUCT_CACHE_HIT: ${{ steps.node-products.outputs.hit }}
          CMUX_NODE_PRODUCT_CACHE_LOOKUP_SECONDS: ${{ steps.node-products.outputs.lookup_seconds }}
          CMUX_PEER_PRODUCT_HIT: ${{ steps.peer-products.outputs.hit }}
          CMUX_PEER_PRODUCT_LOOKUP_SECONDS: ${{ steps.peer-products.outputs.lookup_seconds }}
          CMUX_PEER_PRODUCT_TRANSFER_SECONDS: ${{ steps.peer-products.outputs.transfer_seconds }}
          CMUX_PEER_PRODUCT_BYTES: ${{ steps.peer-products.outputs.bytes_transferred }}
          CMUX_R2_PRODUCT_HIT: ${{ steps.r2-products.outputs.hit }}
          CMUX_PARALLEL_PRODUCT_HIT: ${{ steps.parallel-products.outputs.hit }}
          CMUX_PARALLEL_PRODUCT_TRANSFER_SECONDS: ${{ steps.parallel-products.outputs.transfer_seconds }}
          CMUX_ARTIFACT_R2_RESULT: ${{ steps.r2-products.outputs.r2_result }}
        run: scripts/ci/restore-app-host-test-product.sh

      - name: Finalize node-local compiled product cache
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.macos-compile-admission.outputs.artifact_id }}
          ARTIFACT_PROVIDER_DIGEST: ${{ needs.macos-compile-admission.outputs.artifact_digest }}
          EXPECTED_SHA256: ${{ needs.macos-compile-admission.outputs.sha256 }}
          CMUX_PRODUCT_CONTRACT: ${{ needs.macos-compile-admission.outputs.product_contract }}
          CMUX_PRODUCT_SOURCE_REVISION: ${{ needs.macos-compile-admission.outputs.source_revision }}
          CMUX_PRODUCT_PRODUCER_RUN_ID: ${{ needs.macos-compile-admission.outputs.producer_run_id }}
          CMUX_PRODUCT_PRODUCER_RUN_ATTEMPT: ${{ needs.macos-compile-admission.outputs.producer_run_attempt }}
          CMUX_NODE_PRODUCT_CACHE_TOKEN: ${{ steps.node-products.outputs.token }}
          CMUX_NODE_PRODUCT_CACHE_LEASE: ${{ steps.node-products.outputs.lease }}
          CMUX_NODE_PRODUCT_SOURCE_CLASS: ${{ steps.peer-products.outputs.hit == 'true' && 'peer' || (steps.r2-products.outputs.hit == 'true' && 'r2' || 'github') }}
          CMUX_PRODUCT_RESTORE_SUCCEEDED: ${{ steps.restore-products.outcome == 'success' && steps.restore-layers.outputs.hit != 'true' }}
        run: python3 scripts/ci/node_product_cache.py finalize "$RUNNER_TEMP/app-host-products/app-host-products.tar.gz"

      - name: Prepare isolated app-host home
        id: prepare-app-host-home
        run: scripts/ci/prepare-app-host-home.sh

      - name: Enumerate built app-host tests
        run: scripts/ci/enumerate-app-host-tests.sh

      - name: Upload built app-host test inventory
        if: ${{ matrix.shard == 1 || inputs.unit_selectors != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-app-host-test-inventory-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/cmux-app-host-test-enumeration.json
            ${{ runner.temp }}/cmux-app-host-test-inventory.json
            ${{ runner.temp }}/cmux-app-host-test-enumeration.log
          if-no-files-found: error
          retention-days: 14

      - name: Enable XCTest automation mode
        run: scripts/ci/enable-xctest-automation-mode.sh

      - name: Run My Devices regressions
        if: ${{ (matrix.shard == fromJSON(env.CMUX_APP_HOST_FOCUSED_REGRESSION_SHARD) || contains(inputs.unit_strict_steps, '|Run My Devices regressions|')) }}
        env:
          CMUX_APP_HOST_XCODEBUILD_ATTEMPTS: "1"
        run: |
          # The broad app-host suite tolerates ordinary assertion failures.
          # Gate every My Devices suite directly on xcodebuild's exit status,
          # with no retry that could hide a lifecycle timeout or host crash.
          # Like the other focused steps, reuse the admission-produced test
          # product instead of compiling the app again.
          set -euo pipefail
          scripts/ci/run-in-console-session.sh \
            scripts/ci/run-app-host-xcodebuild.sh \
            -xctestrun "$CMUX_APP_HOST_XCTESTRUN" \
            -destination "platform=macOS" \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 120 \
            -maximum-test-execution-time-allowance 120 \
            CMUX_SKIP_ZIG_BUILD=1 \
            -only-testing:cmuxTests/DeviceDirectoryLifecycleTests \
            -only-testing:cmuxTests/DeviceDirectoryMergeTests \
            -only-testing:cmuxTests/DeviceLinkReconnectPolicyTests \
            -only-testing:cmuxTests/DevicePresenceWireTests \
            -only-testing:cmuxTests/DeviceRegistryClientTests \
            -only-testing:cmuxTests/DeviceRouteSelectorTests \
            -only-testing:cmuxTests/DeviceTerminalMirrorTests \
            -only-testing:cmuxTests/DeviceWorkspaceProjectionTests \
            -only-testing:cmuxTests/DevicesCloudTreeBuilderTests \
            -only-testing:cmuxTests/DevicesSidebarModeTests \
            -only-testing:cmuxTests/SurfaceMachineIDDeviceEncodingTests \
            test-without-building

      - name: Run five-tab renderer memory regression
        if: ${{ matrix.shard == fromJSON(env.CMUX_APP_HOST_FOCUSED_REGRESSION_SHARD) }}
        run: |
          # Use a dedicated app-host process so task_vm_info deltas only compare
          # one versus five real Ghostty renderers in this workload. The focused
          # invocation also makes footprint assertion failures non-tolerant.
          set -euo pipefail
          CMUX_RENDERER_MEMORY_REGRESSION=1 \
            scripts/ci/run-in-console-session.sh \
            scripts/ci/run-app-host-xcodebuild.sh \
            -xctestrun "$CMUX_APP_HOST_XCTESTRUN" \
            -destination "platform=macOS" \
            CMUX_SKIP_ZIG_BUILD=1 \
            -only-testing:cmuxTests/GhosttySurfaceOverlayTests/testFiveTabRendererFootprintReturnsToOneRendererTargetAcrossHideRevealCycles \
            test-without-building

      - name: Run Pi Feed ownership regressions
        if: ${{ (matrix.shard == fromJSON(env.CMUX_APP_HOST_FOCUSED_REGRESSION_SHARD) || contains(inputs.unit_strict_steps, '|Run Pi Feed ownership regressions|')) }}
        run: |
          # Swift Testing assertion failures are tolerated in the full sharded
          # app-host suite. Keep Feed ingestion and ownership on a non-tolerant
          # focused invocation so valid Pi Feed targets cannot silently regress.
          set -euo pipefail
          # Each suite mutates process-global app/store state. Give every suite
          # a fresh app-host process so Swift Testing cannot interleave them.
          for suite in \
            FeedCoordinatorTests \
            PiFeedOwnershipTests \
            PiFeedDockOwnershipTests
          do
            scripts/ci/run-in-console-session.sh \
              scripts/ci/run-app-host-xcodebuild.sh \
              -xctestrun "$CMUX_APP_HOST_XCTESTRUN" \
              -destination "platform=macOS" \
              CMUX_SKIP_ZIG_BUILD=1 \
              -only-testing:"cmuxTests/$suite" \
              test-without-building
          done

      - name: Run remote tmux mirror detach and placement regressions
        id: remote-tmux-mirror
        if: ${{ (matrix.shard == fromJSON(env.CMUX_APP_HOST_FOCUSED_REGRESSION_SHARD) || contains(inputs.unit_strict_steps, '|Run remote tmux mirror detach and placement regressions|')) }}
        run: |
          # Closing a mirrored workspace must never kill the remote tmux session,
          # and --new-window must consolidate mirrors moved across source windows.
          # Keep these destructive/topology regressions outside the tolerant full
          # suite so an ordinary assertion failure cannot be accepted as expected.
          # The placement case creates three native windows and several
          # Ghostty-backed panels. Run the close and placement suites in separate
          # app-host processes so renderer teardown from one topology workload
          # cannot crash the next before its assertions execute.
          #
          # A crash remains a shard failure. A passing rerun cannot erase tests
          # completed before the crash, so wrapper retries are limited to
          # failures that occur before test execution begins.
          set -euo pipefail
          rm -f -- "$RUNNER_TEMP"/cmux-remote-tmux-mirror-*.txt
          for suite in \
            RemoteTmuxMirrorCloseDetachTests \
            RemoteTmuxMirrorFocusPolicyTests \
            RemoteTmuxMirrorDedicatedPlacementTests
          do
            suite_output="$RUNNER_TEMP/cmux-remote-tmux-mirror-${suite}-attempt-1.txt"
            bash scripts/ci/run-and-capture.sh "$suite_output" \
              scripts/ci/run-in-console-session.sh \
              env "CMUX_TAG=remote-tmux-${suite}" \
              scripts/ci/run-app-host-xcodebuild.sh \
              -xctestrun "$CMUX_APP_HOST_XCTESTRUN" \
              -destination "platform=macOS" \
              CMUX_SKIP_ZIG_BUILD=1 \
              -test-timeouts-enabled YES \
              -default-test-execution-time-allowance 180 \
              -maximum-test-execution-time-allowance 180 \
              -only-testing:"cmuxTests/$suite" \
              test-without-building
            scripts/ci/require_selected_test_execution.sh "$suite_output" "cmuxTests/$suite"
          done

      - name: Collect RemoteTmuxMirror crash diagnostics
        id: collect-mirror-diagnostics
        if: ${{ failure() && steps.remote-tmux-mirror.outcome == 'failure' }}
        continue-on-error: true
        shell: bash
        run: |
          set -u
          diagnostics="$RUNNER_TEMP/cmux-remote-tmux-mirror-diagnostics"
          rm -rf -- "$diagnostics"
          mkdir -p "$diagnostics"

          # XCTest runs with an isolated HOME. Preserve its reports before the
          # always-running app-host cleanup removes that home.
          if [ -n "${CMUX_APP_HOST_HOME:-}" ]; then
            # The console account owns the isolated home on runners where the
            # GitHub agent is a different user. Validate the published identity
            # before using its resolved path, then fall back to passwordless
            # sudo only for this exact authenticated run scope.
            ci_script_dir="${GITHUB_WORKSPACE:-$PWD}/scripts/ci"
            # shellcheck source=scripts/ci/app-host-isolation.sh
            source "$ci_script_dir/app-host-isolation.sh"
            if cmux_validate_published_app_host_identity_values; then
              crash_reports="$CMUX_RESOLVED_APP_HOST_HOME/.local/state/cmux/crash"
              reports_present=0
              if [ -d "$crash_reports" ] \
                || sudo -n test -d "$crash_reports" 2>/dev/null; then
                reports_present=1
              fi
              if [ "$reports_present" -eq 1 ]; then
                copied=0
                if cp -R "$crash_reports" "$diagnostics/crash-reports" 2>/dev/null; then
                  copied=1
                elif sudo -n true 2>/dev/null; then
                  rm -rf -- "$diagnostics/crash-reports"
                  if sudo -n cp -R "$crash_reports" "$diagnostics/crash-reports" \
                    && sudo -n chown -R "$(id -u):$(id -g)" "$diagnostics/crash-reports"; then
                    copied=1
                  fi
                fi
                if [ "$copied" -ne 1 ]; then
                  echo "::warning::unable to read isolated app-host crash reports" >&2
                fi
              fi
            else
              echo "::warning::app-host identity validation failed; crash reports not collected" >&2
            fi
          fi

          shopt -s nullglob
          suite_logs=("$RUNNER_TEMP"/cmux-remote-tmux-mirror-*.txt)
          if [ "${#suite_logs[@]}" -gt 0 ]; then
            cp "${suite_logs[@]}" "$diagnostics/" || true
          fi

          find "$diagnostics" -type f -print || true

      - name: Upload RemoteTmuxMirror crash diagnostics
        id: upload-mirror-diagnostics
        if: ${{ failure() && steps.remote-tmux-mirror.outcome == 'failure' }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-remote-tmux-mirror-diagnostics-${{ matrix.shard }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cmux-remote-tmux-mirror-diagnostics
          if-no-files-found: ignore
          retention-days: 7

      - name: Run focused browser regressions
        if: ${{ (matrix.shard == fromJSON(env.CMUX_APP_HOST_FOCUSED_REGRESSION_B_SHARD) || contains(inputs.unit_strict_steps, '|Run focused browser regressions|')) }}
        run: |
          # Focused gates for https://github.com/manaflow-ai/cmux/issues/7380 and #8054.
          # The tolerant full-suite step can crash-skip late suites (see #5888
          # note above), so these regressions get non-tolerant focused
          # invocations. Both suites create portal-owned AppKit/WebKit windows
          # and touch process-wide window/portal registries; keep each in a
          # fresh app-host process so Swift Testing cannot interleave them.
          set -euo pipefail
          for suite in \
            BrowserOmnibarSuggestionClickRoutingTests \
            BrowserPanelViewIdentityTests
          do
            scripts/ci/run-in-console-session.sh \
              scripts/ci/run-app-host-xcodebuild.sh \
              -xctestrun "$CMUX_APP_HOST_XCTESTRUN" \
              -destination "platform=macOS" \
              CMUX_SKIP_ZIG_BUILD=1 \
              -only-testing:"cmuxTests/$suite" \
              test-without-building
          done

      - name: Run remote tmux mirror active-pane regression
        if: ${{ (matrix.shard == fromJSON(env.CMUX_APP_HOST_FOCUSED_REGRESSION_B_SHARD) || contains(inputs.unit_strict_steps, '|Run remote tmux mirror active-pane regression|')) }}
        run: |
          # Focused gates for https://github.com/manaflow-ai/cmux/issues/7372.
          # The tolerant full-suite step can crash-skip late suites (see #5888
          # note above), so the seed and immediate-update paths get a
          # non-tolerant invocation.
          set -euo pipefail
          scripts/ci/run-in-console-session.sh \
            scripts/ci/run-app-host-xcodebuild.sh \
            -xctestrun "$CMUX_APP_HOST_XCTESTRUN" \
            -destination "platform=macOS" \
            CMUX_SKIP_ZIG_BUILD=1 \
            -only-testing:cmuxTests/RemoteTmuxWindowMirrorFocusSeedTests \
            test-without-building

      - name: Run remote tmux mirror layout identity regression
        if: ${{ (matrix.shard == fromJSON(env.CMUX_APP_HOST_FOCUSED_REGRESSION_B_SHARD) || contains(inputs.unit_strict_steps, '|Run remote tmux mirror layout identity regression|')) }}
        run: |
          # The tolerant full-suite step may accept expected failures or stop
          # after an app-host crash. Keep #7833's identity suite non-tolerant
          # so a missing incremental-reconcile regression cannot pass the shard.
          set -euo pipefail
          scripts/ci/run-in-console-session.sh \
            scripts/ci/run-app-host-xcodebuild.sh \
            -xctestrun "$CMUX_APP_HOST_XCTESTRUN" \
            -destination "platform=macOS" \
            CMUX_SKIP_ZIG_BUILD=1 \
            -only-testing:cmuxTests/RemoteTmuxMirrorLayoutIdentityTests \
            test-without-building

      - name: Run socket ACL reload regression
        if: ${{ (matrix.shard == fromJSON(env.CMUX_APP_HOST_FOCUSED_REGRESSION_B_SHARD) || contains(inputs.unit_strict_steps, '|Run socket ACL reload regression|')) }}
        run: |
          # The tolerant full-suite step can accept assertion failures or
          # crash-skip late suites. Keep #7984's live reload and denial tests
          # non-tolerant so a snapshotted socket ACL cannot pass the shard.
          set -euo pipefail
          scripts/ci/run-in-console-session.sh \
            scripts/ci/run-app-host-xcodebuild.sh \
            -xctestrun "$CMUX_APP_HOST_XCTESTRUN" \
            -destination "platform=macOS" \
            CMUX_SKIP_ZIG_BUILD=1 \
            -only-testing:cmuxTests/SocketACLReloadRegressionTests \
            test-without-building

      - name: Run terminal creation interactive-shell CLI regression
        if: ${{ matrix.shard == fromJSON(env.CMUX_APP_HOST_FOCUSED_REGRESSION_B_SHARD) }}
        run: |
          set -euo pipefail

          CLI_BIN="$(
            find "$CMUX_DERIVED_DATA_PATH" -path "*/Build/Products/Debug/cmux" -exec stat -f '%m %N' {} \; \
              | sort -nr \
              | head -1 \
              | cut -d' ' -f2-
          )"
          if [ -z "${CLI_BIN:-}" ] || [ ! -x "$CLI_BIN" ]; then
            echo "cmux CLI binary not found in DerivedData" >&2
            exit 1
          fi

          CMUX_CLI_BIN="$CLI_BIN" python3 tests/test_cli_creation_initial_command.py

      - name: Run settings file-store no-op persistence regression
        if: ${{ (matrix.shard == fromJSON(env.CMUX_APP_HOST_FOCUSED_REGRESSION_B_SHARD) || contains(inputs.unit_strict_steps, '|Run settings file-store no-op persistence regression|')) }}
        run: |
          # The broad app-host suite tolerates expected failures and can stop
          # after an app-host crash. Keep the settings persistence regression
          # non-tolerant so a no-op UserDefaults write cannot pass the shard.
          set -euo pipefail
          scripts/ci/run-in-console-session.sh \
            scripts/ci/run-app-host-xcodebuild.sh \
            -xctestrun "$CMUX_APP_HOST_XCTESTRUN" \
            -destination "platform=macOS" \
            CMUX_SKIP_ZIG_BUILD=1 \
            -only-testing:cmuxTests/KeyboardShortcutSettingsFileStoreNoOpPersistenceTests \
            test-without-building

      - name: Run issue 8373 sidebar convergence regression
        if: ${{ (matrix.shard == fromJSON(env.CMUX_APP_HOST_FOCUSED_REGRESSION_B_SHARD) || contains(inputs.unit_strict_steps, '|Run issue 8373 sidebar convergence regression|')) }}
        timeout-minutes: 5
        run: |
          # The broad app-host suite tolerates Swift Testing assertion failures.
          # Keep #8373's real NSHostingView/LazyVStack workload non-tolerant and
          # require its bounded identity/snapshot/memory evidence line.
          set -euo pipefail
          test_log="$RUNNER_TEMP/cmux-issue-8373-sidebar.txt"
          bash scripts/ci/run-and-capture.sh "$test_log" \
            scripts/ci/run-in-console-session.sh \
            env CMUX_TAG=issue-8373-sidebar \
            scripts/ci/run-app-host-xcodebuild.sh \
            -xctestrun "$CMUX_APP_HOST_XCTESTRUN" \
            -destination "platform=macOS" \
            -parallel-testing-enabled NO \
            CMUX_SKIP_ZIG_BUILD=1 \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 180 \
            -maximum-test-execution-time-allowance 180 \
            -only-testing:cmuxTests/SidebarIssue8373StressTests \
            test-without-building
          scripts/ci/require_selected_test_execution.sh \
            "$test_log" cmuxTests/SidebarIssue8373StressTests
          grep -F "ISSUE_8373_STRESS " "$test_log"

      - name: Run sidebar workspace-switch layout regression
        if: ${{ (matrix.shard == fromJSON(env.CMUX_APP_HOST_FOCUSED_REGRESSION_B_SHARD) || contains(inputs.unit_strict_steps, '|Run sidebar workspace-switch layout regression|')) }}
        run: |
          # The tolerant full-suite step can accept Swift Testing assertion
          # failures when XCTest reports "0 unexpected". Keep #9612's real
          # window-switch workload non-tolerant so NSHostingView layout
          # reentry cannot silently return.
          set -euo pipefail
          scripts/ci/run-in-console-session.sh \
            scripts/ci/run-app-host-xcodebuild.sh \
            -xctestrun "$CMUX_APP_HOST_XCTESTRUN" \
            -destination "platform=macOS" \
            CMUX_SKIP_ZIG_BUILD=1 \
            -only-testing:cmuxTests/SidebarWorkspaceSwitchLayoutFaultTests \
            test-without-building

      - name: Run terminal portal visibility regressions
        if: ${{ (matrix.shard == fromJSON(env.CMUX_APP_HOST_FOCUSED_REGRESSION_B_SHARD) || contains(inputs.unit_strict_steps, '|Run terminal portal visibility regressions|')) }}
        run: |
          # These tests mutate the process-wide terminal portal registry and
          # include Swift Testing assertions that the tolerant broad shard can
          # otherwise classify as expected. Give them a dedicated app host.
          set -euo pipefail
          scripts/ci/run-in-console-session.sh \
            scripts/ci/run-app-host-xcodebuild.sh \
            -xctestrun "$CMUX_APP_HOST_XCTESTRUN" \
            -destination "platform=macOS" \
            CMUX_SKIP_ZIG_BUILD=1 \
            -only-testing:cmuxTests/GhosttyTerminalViewVisibilityPolicyTests \
            test-without-building

      - name: Ensure node for app-host wrapper regressions
        id: detect-node
        if: ${{ matrix.shard == fromJSON(env.CMUX_APP_HOST_CLI_REGRESSION_SHARD) }}
        run: |
          set -euo pipefail
          # App-host wrapper regressions, including OpenCode and Claude hooks,
          # execute JavaScript through `node`. The tart-macos-15 runner image
          # shipped without node on the runner PATH (2026-07-10), which failed
          # every branch. Reuse an image-provided node when present; otherwise
          # install one below before the unit-test batches start.
          for candidate in "$(command -v node || true)" /opt/homebrew/bin/node /usr/local/bin/node; do
            if [ -n "$candidate" ] && [ -x "$candidate" ]; then
              dirname "$candidate" >> "$GITHUB_PATH"
              "$candidate" --version
              echo "found=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "no node runtime in the runner image; installing via setup-node"
          echo "found=false" >> "$GITHUB_OUTPUT"

      - name: Install node (runner image has none)
        if: ${{ matrix.shard == fromJSON(env.CMUX_APP_HOST_CLI_REGRESSION_SHARD) && steps.detect-node.outputs.found == 'false' }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"

      - name: Run Ghostty numeric locale tests
        if: ${{ (matrix.shard == fromJSON(env.CMUX_APP_HOST_FOCUSED_REGRESSION_B_SHARD) || contains(inputs.unit_strict_steps, '|Run Ghostty numeric locale tests|')) }}
        run: |
          # LC_NUMERIC is process-global. Keep these tests in their own app-host
          # invocation and disable Xcode's parallel test execution for it.
          set -euo pipefail
          scripts/ci/run-in-console-session.sh \
            scripts/ci/run-app-host-xcodebuild.sh \
            -xctestrun "$CMUX_NUMERIC_LOCALE_XCTESTRUN" \
            -destination "platform=macOS" \
            -only-testing:cmuxTests/GhosttyNumericLocaleTests \
            -parallel-testing-enabled NO \
            CMUX_SKIP_ZIG_BUILD=1 \
            test-without-building

      - name: Run global search shortcut regressions
        if: ${{ (matrix.shard == fromJSON(env.CMUX_APP_HOST_GLOBAL_SEARCH_SHARD) || contains(inputs.unit_strict_steps, '|Run global search shortcut regressions|')) }}
        timeout-minutes: 40
        run: |
          # This serialized container owns global shortcut settings. Keep its
          # mutations out of unrelated UI suites' retained window graphs; it
          # exceeded thirteen minutes in a shared app host. Run the whole
          # container in its own non-tolerant app host, including every nested
          # test, as a plain `xcodebuild test-without-building` gate like every
          # other focused gate. The compile admission job has already produced
          # the test bundle, so this shard only spends time running tests.
          set -euo pipefail
          test_log="$RUNNER_TEMP/cmux-global-search-shortcuts.txt"
          bash scripts/ci/run-and-capture.sh "$test_log" \
            scripts/ci/run-in-console-session.sh \
            env CMUX_TAG=global-search-shortcuts \
            scripts/ci/run-app-host-xcodebuild.sh \
            -xctestrun "$CMUX_APP_HOST_XCTESTRUN" \
            -destination "platform=macOS" \
            CMUX_SKIP_ZIG_BUILD=1 \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 300 \
            -maximum-test-execution-time-allowance 300 \
            -only-testing:cmuxTests/GlobalSearchShortcutBehaviorTests \
            test-without-building
          scripts/ci/require_selected_test_execution.sh \
            "$test_log" cmuxTests/GlobalSearchShortcutBehaviorTests

      - name: Run Cloud machine ordering acceptance
        if: ${{ !cancelled() && steps.prepare-app-host-home.outcome == 'success' && (matrix.shard == fromJSON(env.CMUX_APP_HOST_FOCUSED_REGRESSION_SHARD) || contains(inputs.unit_strict_steps, '|Run Cloud machine ordering acceptance|')) }}
        timeout-minutes: 10
        run: |
          # Separate invocations prove each selector executed tests; a healthy
          # suite cannot mask a miswired or accidentally empty selector.
          set -euo pipefail
          for suite in CloudMachineDragSourceTests CloudMachineOrderingTests \
            CloudOperationRecorderTests CloudReadRequestCoordinatorTests \
            VMClientReadCoalescingTests; do
            test_log="$RUNNER_TEMP/cmux-cloud-ordering-${suite}.txt"
            bash scripts/ci/run-and-capture.sh "$test_log" \
              scripts/ci/run-in-console-session.sh \
              env "CMUX_TAG=cloud-ordering-${suite}" \
              scripts/ci/run-app-host-xcodebuild.sh \
              -xctestrun "$CMUX_APP_HOST_XCTESTRUN" \
              -destination "platform=macOS" \
              CMUX_SKIP_ZIG_BUILD=1 \
              -test-timeouts-enabled YES \
              -default-test-execution-time-allowance 60 \
              -maximum-test-execution-time-allowance 60 \
              -only-testing:"cmuxTests/$suite" \
              test-without-building
            scripts/ci/require_selected_test_execution.sh "$test_log" "cmuxTests/$suite"
          done

      - name: Run unit tests
        if: ${{ matrix.shard != fromJSON(env.CMUX_APP_HOST_GLOBAL_SEARCH_SHARD) }}
        run: scripts/ci/run-app-host-unit-batches.sh

      - name: Run bundled Ghostty theme picker helper regression
        if: ${{ matrix.shard == fromJSON(env.CMUX_APP_HOST_CLI_REGRESSION_SHARD) }}
        run: |
          set -euo pipefail
          ./tests/test_bundled_ghostty_theme_picker_helper.sh

      - name: Set up Bun for Pi extension dispatch regression
        if: ${{ matrix.shard == fromJSON(env.CMUX_APP_HOST_CLI_REGRESSION_SHARD) }}
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.6"

      - name: Run agent notification semantics
        if: ${{ (matrix.shard == fromJSON(env.CMUX_APP_HOST_FOCUSED_REGRESSION_SHARD) || contains(inputs.unit_strict_steps, '|Run agent notification semantics|')) }}
        run: |
          set -euo pipefail
          # Reuse compile admission's product instead of rebuilding the app in
          # agent-notification-tests.yml. Keep each suite in a fresh host and
          # require positive execution, outside the tolerant broad batches.
          command -v node
          bun_path="$(command -v bun)"
          bun_install="$(dirname "$(dirname "$bun_path")")"
          for suite in \
            AgentNotificationRegressionTests \
            AgentJournalLifecycleCenterTests \
            FeedWaiterRegistryTests \
            ClaudeBackgroundWorkNotifyTests \
            OpenCodeHookRegressionTests
          do
            test_log="$RUNNER_TEMP/cmux-notification-${suite}.txt"
            bash scripts/ci/run-and-capture.sh "$test_log" \
              scripts/ci/run-in-console-session.sh \
              env "TEST_RUNNER_PATH=$PATH" "TEST_RUNNER_BUN_INSTALL=$bun_install" \
                "CMUX_TAG=notification-${suite}" \
              scripts/ci/run-app-host-xcodebuild.sh \
              -xctestrun "$CMUX_APP_HOST_XCTESTRUN" \
              -destination "platform=macOS" \
              CMUX_SKIP_ZIG_BUILD=1 \
              -test-timeouts-enabled YES \
              -default-test-execution-time-allowance 180 \
              -maximum-test-execution-time-allowance 180 \
              -only-testing:"cmuxTests/$suite" \
              test-without-building
            scripts/ci/require_selected_test_execution.sh "$test_log" "cmuxTests/$suite"
          done

      - name: Install pinned nushell (shell-integration tests)
        if: ${{ matrix.shard == fromJSON(env.CMUX_APP_HOST_CLI_REGRESSION_SHARD) }}
        run: |
          set -euo pipefail

          # tests/test_nushell_*.py drive the bundled nushell shell
          # integration through a real `nu`. Pin the release binary (no brew:
          # deterministic, fast, checksum-verified) and match the version the
          # integration was verified against.
          NU_VERSION="0.113.1"
          case "$(uname -m)" in
            arm64|aarch64)
              NU_ARCH="aarch64-apple-darwin"
              NU_SHA256="458aa21674221b2e8adbd784f9ba8113288b78f3c352465cef37b114ff3dffd5"
              ;;
            x86_64)
              NU_ARCH="x86_64-apple-darwin"
              NU_SHA256="18ec6448cd8562b4f94ba24bace6164c5d8b8d634c8105751ec45e17d34549b2"
              ;;
            *)
              echo "unsupported runner arch for pinned nushell: $(uname -m)" >&2
              exit 1
              ;;
          esac

          NU_DIR="$RUNNER_TEMP/cmux-nushell"
          mkdir -p "$NU_DIR"
          curl -fsSL --retry 3 -o "$NU_DIR/nu.tar.gz" \
            "https://github.com/nushell/nushell/releases/download/${NU_VERSION}/nu-${NU_VERSION}-${NU_ARCH}.tar.gz"
          echo "$NU_SHA256  $NU_DIR/nu.tar.gz" | shasum -a 256 -c -
          tar -xzf "$NU_DIR/nu.tar.gz" -C "$NU_DIR" --strip-components=1
          test -x "$NU_DIR/nu"
          "$NU_DIR/nu" --version
          echo "$NU_DIR" >> "$GITHUB_PATH"

      - name: Validate bash prompt bootstrap export compatibility
        if: ${{ matrix.shard == fromJSON(env.CMUX_APP_HOST_CLI_REGRESSION_SHARD) }}
        run: |
          set -euo pipefail
          # macOS provides the legacy Bash 3.2 path; install Homebrew Bash so
          # this regression also exercises the newer PROMPT_COMMAND array path.
          if ! brew list --formula bash >/dev/null 2>&1; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install bash
          fi
          BASH_NEW_BIN="$(brew --prefix bash)/bin/bash"
          test -x /bin/bash
          test -x "$BASH_NEW_BIN"
          CMUX_BASH_32_BIN=/bin/bash \
            CMUX_BASH_NEW_BIN="$BASH_NEW_BIN" \
            python3 tests/test_issue_11257_prompt_command_export.py

      - name: Run open-wrapper shell regressions
        if: ${{ matrix.shard == fromJSON(env.CMUX_APP_HOST_CLI_REGRESSION_SHARD) }}
        run: python3 scripts/ci/run_python_test_lane.py --lane macos-shell

      - name: Run CLI no-socket regressions
        if: ${{ matrix.shard == fromJSON(env.CMUX_APP_HOST_CLI_REGRESSION_SHARD) }}
        run: |
          set -euo pipefail

          CLI_BIN="$(
            find "$CMUX_DERIVED_DATA_PATH" -path "*/Build/Products/Debug/cmux" -exec stat -f '%m %N' {} \; \
              | sort -nr \
              | head -1 \
              | cut -d' ' -f2-
          )"
          if [ -z "${CLI_BIN:-}" ] || [ ! -x "$CLI_BIN" ]; then
            echo "cmux CLI binary not found in DerivedData" >&2
            exit 1
          fi

          CMUX_CLI_BIN="$CLI_BIN" python3 scripts/ci/run_python_test_lane.py --lane macos-cli-no-socket

          if ! command -v fish >/dev/null 2>&1; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install fish
          fi
          command -v fish >/dev/null 2>&1 || {
            echo "fish is required for the issue #9075 shell socket regression" >&2
            exit 1
          }
          python3 scripts/ci/run_python_test_lane.py --lane macos-shell-fish
          CMUX_CLI_BIN="$CLI_BIN" python3 scripts/ci/run_python_test_lane.py --lane macos-cli-no-socket-post-fish

      - name: Collect app-host failure diagnostics
        id: collect-app-host-diagnostics
        if: ${{ failure() || cancelled() }}
        continue-on-error: true
        shell: bash
        run: scripts/ci/collect-app-host-diagnostics.sh

      - name: Upload app-host failure diagnostics
        id: upload-app-host-diagnostics
        if: ${{ failure() || cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-app-host-diagnostics-shard-${{ env.CMUX_APP_HOST_SHARD }}-run-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cmux-app-host-diagnostics-shard-${{ env.CMUX_APP_HOST_SHARD }}-run-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 7

      - name: Report evidence collection outcomes
        if: ${{ always() }}
        env:
          EVIDENCE_OUTCOMES: >-
            collect-mirror-diagnostics=${{ steps.collect-mirror-diagnostics.outcome }}
            upload-mirror-diagnostics=${{ steps.upload-mirror-diagnostics.outcome }}
            collect-app-host-diagnostics=${{ steps.collect-app-host-diagnostics.outcome }}
            upload-app-host-diagnostics=${{ steps.upload-app-host-diagnostics.outcome }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os

          rows = []
          for entry in os.environ["EVIDENCE_OUTCOMES"].split():
              label, _, outcome = entry.partition("=")
              # An empty outcome means the step never ran, which is the same
              # thing as skipped for this purpose.
              rows.append((label, outcome or "skipped"))

          # A green job skips every evidence step by design, so stay silent
          # rather than adding a section to every summary in the repository.
          if any(outcome != "skipped" for _, outcome in rows):
              summary = os.environ.get("GITHUB_STEP_SUMMARY")
              if summary:
                  with open(summary, "a", encoding="utf-8") as handle:
                      handle.write("### Evidence collection\n\n")
                      for label, outcome in rows:
                          handle.write(f"- {label}: `{outcome}`\n")
                      handle.write("\n")

          # Annotations go to stdout, where the runner reads them, and surface
          # at the top of the run instead of inside a step nobody opens.
          for label, outcome in rows:
              if outcome == "failure":
                  print(
                      f"::warning title=Evidence not captured::{label} failed, "
                      "so its evidence does not exist for this job"
                  )
          PY

      - name: Clean up isolated app-host home
        if: ${{ always() }}
        env:
          CMUX_APP_HOST_PREPARATION_OUTCOME: ${{ steps.prepare-app-host-home.outcome }}
        run: |
          # Checkout may have failed before these scripts existed. Once setup
          # starts, even partial or cancelled preparation still needs cleanup.
          case "$CMUX_APP_HOST_PREPARATION_OUTCOME" in
            skipped|"")
              echo "App-host preparation did not start; no isolated home to clean."
              ;;
            success|failure|cancelled)
              scripts/ci/run-in-console-session.sh scripts/ci/cleanup-app-host-home.sh
              ;;
            *)
              echo "::error::Unexpected app-host preparation outcome: $CMUX_APP_HOST_PREPARATION_OUTCOME"
              exit 1
              ;;
          esac

  cli-product-tests:
    permissions:
      contents: read
      actions: read
      # The R2 artifact transport mints an OIDC token for its broker.
      id-token: write
    needs:
      - macos-compile-admission
    # Targeted CLI routing consumes the shared compiled product even when prior
    # compile admission exists; it does not enable the app-host/full-suite lanes.
    # Same !cancelled() reasoning as app-host-unit-tests: the implicit success()
    # gate would count a legitimately skipped linux job in the transitive needs
    # chain as a reason to skip every macOS job.
    if: ${{ !cancelled() && needs.macos-compile-admission.result == 'success' && (inputs.cli == 'true' || (inputs.macos == 'true' && inputs.full_suite == 'true')) }}
    name: CLI product tests
    # cmuxCLITests has no app host, so it needs no testmanagerd control session
    # and no GUI console session. It still needs the compiled product, so it
    # reuses macos-compile-admission's artifact like the app-host shards do,
    # on the pool and Xcode that built it: the test bundle only loads under
    # the Xcode that linked it.
    runs-on: ${{ needs.macos-compile-admission.outputs.runner }}
    timeout-minutes: 40
    env:
      CMUX_NODE_PRODUCT_CACHE_ROOT: ${{ vars.CMUX_NODE_PRODUCT_CACHE_ROOT }}
      CMUX_NODE_PRODUCT_CACHE_MAX_BYTES: ${{ vars.CMUX_NODE_PRODUCT_CACHE_MAX_BYTES }}
      CMUX_NODE_PRODUCT_CACHE_WAIT_SECONDS: ${{ vars.CMUX_NODE_PRODUCT_CACHE_WAIT_SECONDS }}
      CMUX_ARTIFACT_PEER_URLS: ${{ vars.CMUX_ARTIFACT_PEER_URLS }}
      CMUX_ARTIFACT_PEER_TOKEN_FILE: ${{ vars.CMUX_ARTIFACT_PEER_TOKEN_FILE }}
      CMUX_CI_XCODE_APP: ${{ needs.macos-compile-admission.outputs.xcode_app }}
      CMUX_CI_REQUIRED_MACOS_SDK_MAJOR: "26"
      CMUX_SKIP_ZIG_BUILD: "1"
      SWIFT_BACKTRACE: "interactive=no,timeout=0s,symbolicate=off,color=no"
    steps:
      - name: Verify GitHub-hosted route
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          REQUESTED_RUNNER: ${{ needs.macos-compile-admission.outputs.runner }}
          RUNNER_CONTEXT_NAME: ${{ runner.name }}
        run: |
          set -euo pipefail
          case "$REQUESTED_RUNNER" in
            macos-*)
              if [ "$RUNNER_ENVIRONMENT" != "github-hosted" ]; then
                echo "::error::$REQUESTED_RUNNER resolved outside GitHub-hosted capacity: $RUNNER_CONTEXT_NAME"
                exit 1
              fi
              ;;
          esac

      - name: Clear stale git locks (self-hosted reused workspace)
        shell: bash
        run: |
          ws="${GITHUB_WORKSPACE:-$PWD}"
          rm -f "$ws/.git/index.lock" 2>/dev/null || true
          if [ -d "$ws/.git/modules" ]; then
            find "$ws/.git/modules" -type f -name "*.lock" -delete 2>/dev/null || true
          fi

      # No submodules: this lane never compiles Ghostty or the app, it only
      # loads an already-built bundle and spawns the already-built CLI.
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Select Xcode
        run: |
          set -euo pipefail
          ./scripts/select-ci-xcode.sh

      - name: Prepare isolated DerivedData
        run: |
          set -euo pipefail
          DERIVED_DATA_PATH="$RUNNER_TEMP/cmux-derived-data-cli-tests-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf "$DERIVED_DATA_PATH"
          mkdir -p "$DERIVED_DATA_PATH"
          echo "CMUX_DERIVED_DATA_PATH=$DERIVED_DATA_PATH" >> "$GITHUB_ENV"

      - name: Try node-local compiled product cache
        id: node-products
        continue-on-error: true
        env:
          ARTIFACT_ID: ${{ needs.macos-compile-admission.outputs.artifact_id }}
          ARTIFACT_PROVIDER_DIGEST: ${{ needs.macos-compile-admission.outputs.artifact_digest }}
          EXPECTED_SHA256: ${{ needs.macos-compile-admission.outputs.sha256 }}
          CMUX_PRODUCT_CONTRACT: ${{ needs.macos-compile-admission.outputs.product_contract }}
          CMUX_PRODUCT_SOURCE_REVISION: ${{ needs.macos-compile-admission.outputs.source_revision }}
          CMUX_PRODUCT_PRODUCER_RUN_ID: ${{ needs.macos-compile-admission.outputs.producer_run_id }}
          CMUX_PRODUCT_PRODUCER_RUN_ATTEMPT: ${{ needs.macos-compile-admission.outputs.producer_run_attempt }}
          CMUX_NODE_PRODUCT_CACHE_FALLBACK_SOURCE: ${{ vars.CMUX_ARTIFACT_PEER_URLS != '' && 'peer' || (vars.CI_ARTIFACT_R2_URL != '' && 'r2' || 'github') }}
        run: python3 scripts/ci/node_product_cache.py acquire "$RUNNER_TEMP/app-host-products"

      - name: Try trusted fleet peer artifact source
        id: peer-products
        if: steps.node-products.outputs.hit != 'true'
        continue-on-error: true
        env:
          ARTIFACT_ID: ${{ needs.macos-compile-admission.outputs.artifact_id }}
          ARTIFACT_PROVIDER_DIGEST: ${{ needs.macos-compile-admission.outputs.artifact_digest }}
          EXPECTED_SHA256: ${{ needs.macos-compile-admission.outputs.sha256 }}
          CMUX_PRODUCT_CONTRACT: ${{ needs.macos-compile-admission.outputs.product_contract }}
          CMUX_PRODUCT_SOURCE_REVISION: ${{ needs.macos-compile-admission.outputs.source_revision }}
          CMUX_PRODUCT_PRODUCER_RUN_ID: ${{ needs.macos-compile-admission.outputs.producer_run_id }}
          CMUX_PRODUCT_PRODUCER_RUN_ATTEMPT: ${{ needs.macos-compile-admission.outputs.producer_run_attempt }}
        run: python3 scripts/ci/peer_product_source.py fetch "$RUNNER_TEMP/app-host-products"

      # R2 is an optional remote broker. With no configured endpoint, a peer
      # miss falls straight through to the canonical GitHub artifact.
      - name: Try shared R2 artifact transport
        id: r2-products
        if: steps.node-products.outputs.hit != 'true' && steps.peer-products.outputs.hit != 'true' && vars.CI_ARTIFACT_R2_URL != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          CI_ARTIFACT_R2_URL: ${{ vars.CI_ARTIFACT_R2_URL }}
          ARTIFACT_ID: ${{ needs.macos-compile-admission.outputs.artifact_id }}
          ARTIFACT_PROVIDER_DIGEST: ${{ needs.macos-compile-admission.outputs.artifact_digest }}
        run: python3 scripts/ci/restore-r2-artifact.py

      # Same exact-ID GitHub artifact over parallel range requests; the
      # single-stream download below stays as the fallback.
      - name: Try parallel GitHub artifact transport
        id: parallel-products
        if: steps.node-products.outputs.hit != 'true' && steps.peer-products.outputs.hit != 'true' && steps.r2-products.outputs.hit != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.macos-compile-admission.outputs.artifact_id }}
          ARTIFACT_PROVIDER_DIGEST: ${{ needs.macos-compile-admission.outputs.artifact_digest }}
        run: python3 scripts/ci/parallel_artifact_download.py

      - name: Download compiled test product
        if: steps.node-products.outputs.hit != 'true' && steps.peer-products.outputs.hit != 'true' && steps.r2-products.outputs.hit != 'true' && steps.parallel-products.outputs.hit != 'true'
        uses: ./.github/actions/download-test-product
        with:
          artifact-id: ${{ needs.macos-compile-admission.outputs.artifact_id }}
          path: ${{ runner.temp }}/app-host-products

      - name: Restore compiled test product
        id: restore-products
        env:
          ARTIFACT_ID: ${{ needs.macos-compile-admission.outputs.artifact_id }}
          ARTIFACT_PROVIDER_DIGEST: ${{ needs.macos-compile-admission.outputs.artifact_digest }}
          EXPECTED_SHA256: ${{ needs.macos-compile-admission.outputs.sha256 }}
          CMUX_PRODUCT_CONTRACT: ${{ needs.macos-compile-admission.outputs.product_contract }}
          CMUX_PRODUCT_SOURCE_REVISION: ${{ needs.macos-compile-admission.outputs.source_revision }}
          CMUX_PRODUCT_PRODUCER_RUN_ID: ${{ needs.macos-compile-admission.outputs.producer_run_id }}
          CMUX_PRODUCT_PRODUCER_RUN_ATTEMPT: ${{ needs.macos-compile-admission.outputs.producer_run_attempt }}
          CMUX_NODE_PRODUCT_CACHE_HIT: ${{ steps.node-products.outputs.hit }}
          CMUX_NODE_PRODUCT_CACHE_LOOKUP_SECONDS: ${{ steps.node-products.outputs.lookup_seconds }}
          CMUX_PEER_PRODUCT_HIT: ${{ steps.peer-products.outputs.hit }}
          CMUX_PEER_PRODUCT_LOOKUP_SECONDS: ${{ steps.peer-products.outputs.lookup_seconds }}
          CMUX_PEER_PRODUCT_TRANSFER_SECONDS: ${{ steps.peer-products.outputs.transfer_seconds }}
          CMUX_PEER_PRODUCT_BYTES: ${{ steps.peer-products.outputs.bytes_transferred }}
          CMUX_R2_PRODUCT_HIT: ${{ steps.r2-products.outputs.hit }}
          CMUX_PARALLEL_PRODUCT_HIT: ${{ steps.parallel-products.outputs.hit }}
          CMUX_PARALLEL_PRODUCT_TRANSFER_SECONDS: ${{ steps.parallel-products.outputs.transfer_seconds }}
          CMUX_ARTIFACT_R2_RESULT: ${{ steps.r2-products.outputs.r2_result }}
        run: scripts/ci/restore-app-host-test-product.sh

      - name: Finalize node-local compiled product cache
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.macos-compile-admission.outputs.artifact_id }}
          ARTIFACT_PROVIDER_DIGEST: ${{ needs.macos-compile-admission.outputs.artifact_digest }}
          EXPECTED_SHA256: ${{ needs.macos-compile-admission.outputs.sha256 }}
          CMUX_PRODUCT_CONTRACT: ${{ needs.macos-compile-admission.outputs.product_contract }}
          CMUX_PRODUCT_SOURCE_REVISION: ${{ needs.macos-compile-admission.outputs.source_revision }}
          CMUX_PRODUCT_PRODUCER_RUN_ID: ${{ needs.macos-compile-admission.outputs.producer_run_id }}
          CMUX_PRODUCT_PRODUCER_RUN_ATTEMPT: ${{ needs.macos-compile-admission.outputs.producer_run_attempt }}
          CMUX_NODE_PRODUCT_CACHE_TOKEN: ${{ steps.node-products.outputs.token }}
          CMUX_NODE_PRODUCT_CACHE_LEASE: ${{ steps.node-products.outputs.lease }}
          CMUX_NODE_PRODUCT_SOURCE_CLASS: ${{ steps.peer-products.outputs.hit == 'true' && 'peer' || (steps.r2-products.outputs.hit == 'true' && 'r2' || 'github') }}
          CMUX_PRODUCT_RESTORE_SUCCEEDED: ${{ steps.restore-products.outcome == 'success' }}
        run: python3 scripts/ci/node_product_cache.py finalize "$RUNNER_TEMP/app-host-products/app-host-products.tar.gz"

      - name: Resolve the CLI under test
        run: |
          set -euo pipefail
          products="$CMUX_DERIVED_DATA_PATH/Build/Products/Debug"
          cli="$products/cmux"
          if [ ! -x "$cli" ]; then
            cli="$(find "$products" -path "*.app/Contents/Resources/bin/cmux" -perm -111 -print -quit)"
          fi
          if [ -z "${cli:-}" ] || [ ! -x "$cli" ]; then
            echo "::error::no cmux CLI in the restored product" >&2
            exit 1
          fi
          echo "CMUX_CLI_PATH=$cli" >> "$GITHUB_ENV"
          echo "Testing $cli"

      - name: Isolate HOME
        run: |
          set -euo pipefail
          cli_home="$RUNNER_TEMP/cmux-cli-tests-home"
          rm -rf "$cli_home"
          mkdir -p "$cli_home/.config"
          echo "CMUX_CLI_TESTS_HOME=$cli_home" >> "$GITHUB_ENV"

      - name: Run CLI product tests
        run: |
          set -euo pipefail
          test_log="$RUNNER_TEMP/cmux-cli-product-tests.log"
          # xcodebuild forwards only TEST_RUNNER_-prefixed variables into the
          # test process, so a bare HOME in the job environment reaches
          # xcodebuild and stops there. CFFIXED_USER_HOME has to travel with
          # it: Foundation resolves NSHomeDirectory() through getpwuid unless
          # that is set, so HOME alone still leaves every fixture reading the
          # runner's real home between reused self-hosted runs. CMUX_CLI_PATH
          # needs the prefix too, or the tests fall back to searching the
          # products directory and may run a different binary than the one
          # resolved above.
          env \
            "TEST_RUNNER_HOME=$CMUX_CLI_TESTS_HOME" \
            "TEST_RUNNER_CFFIXED_USER_HOME=$CMUX_CLI_TESTS_HOME" \
            "TEST_RUNNER_XDG_CONFIG_HOME=$CMUX_CLI_TESTS_HOME/.config" \
            "TEST_RUNNER_SSH_AUTH_SOCK=" \
            "TEST_RUNNER_CMUX_CLI_PATH=$CMUX_CLI_PATH" \
            bash scripts/ci/run-and-capture.sh "$test_log" \
            xcodebuild test-without-building \
            -xctestrun "$CMUX_CLI_TESTS_XCTESTRUN" \
            -destination "platform=macOS" \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 180 \
            -maximum-test-execution-time-allowance 300 \
            -only-testing:cmuxCLITests
          scripts/ci/require_selected_test_execution.sh "$test_log" "cmuxCLITests"

      - name: Upload CLI product test log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-product-tests-log-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cmux-cli-product-tests.log
          if-no-files-found: ignore
          retention-days: 7

  swift-package-tests:
    # Stays on the macos-15 pool on every event, including pull requests. The
    # "Select helper Xcode" step below pins CMUX_CI_REQUIRED_MACOS_SDK_MAJOR=15
    # and the build then asserts HELPER_SDK_VERSION == 15.*, so the job needs an
    # image carrying an SDK 15 Xcode; select-ci-xcode.sh exits non-zero rather
    # than falling back when it cannot find one. The macos-26 image has no SDK 15.
    # It is the one pull-request macOS job MACOS_RUNNER_PR must not move.
    #
    # That SDK 15 pin is self-imposed, not a toolchain limit. It dates from Zig
    # 0.15.2, whose MachO linker could not resolve libSystem against an
    # Xcode 26.4+ SDK (ziglang/zig#31658, fixed by #31673 in Zig 0.16.0). The
    # Ghostty submodule has required 0.16.0 since at least 2026-09-17 and
    # install-zig-ci.sh derives the version from that manifest, so the original
    # reason is likely gone -- but no helper build has run on a macos-26 image to
    # prove it, and the SDK assertion would fail there first regardless.
    # !cancelled() disables the implicit success() gate, which GitHub evaluates
    # over the transitive needs chain: linux-preflight runs behind routed linux
    # jobs that legitimately skip (web/go/agent-session paths), and that
    # transitive skip otherwise marks every macOS job skipped even when
    # linux-preflight itself succeeds. Require the direct needs explicitly.
    # Two reasons to run: the full suite, or a change the router attributed to
    # a Swift package. The second is deliberately independent of inputs.macos:
    # Packages/iOS packages outside the desktop product's closure are
    # macOS-neutral for the app build yet still own tests this lane runs.
    # The job narrows itself to the affected packages in "Select package
    # tests", so the routed case costs one runner and a short build, not the
    # full 33-package sweep.
    if: ${{ (inputs.macos == 'true' && inputs.full_suite == 'true') || inputs.swift_packages == 'true' }}
    outputs:
      release_archs: ${{ steps.release-archs.outputs.archs }}
      ghostty_helper_sha256: ${{ steps.ghostty-helper-identity.outputs.sha256 }}
      ghostty_helper_toolchain_sha256: ${{ steps.ghostty-helper-identity.outputs.toolchain_sha256 }}
      ghostty_helper_sdk: ${{ steps.ghostty-helper-identity.outputs.sdk }}
    # Build the release helper with SDK 15, then run package tests with SDK 26.
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'macos-15' || (vars.CI_PAID_MACOS_OVERFLOW == '1' && vars.MACOS_RUNNER_DUAL_XCODE || 'blacksmith-6vcpu-macos-15') }}
    timeout-minutes: 40
    env:
      CMUX_CI_XCODE_APP: ${{ vars.CMUX_CI_XCODE_APP_MACOS_15 }}
      CMUX_CI_HELPER_XCODE_APP: ${{ vars.CMUX_CI_HELPER_XCODE_APP_MACOS_15 }}
      CMUX_CI_REQUIRED_MACOS_SDK_MAJOR: "26"
    steps:
      - name: Clear stale git locks (self-hosted reused workspace)
        shell: bash
        run: |
          # Self-hosted macOS runners reuse the workspace. A job cancelled or
          # killed mid-checkout can leave a stale .git/modules/*/index.lock that
          # fails every later submodule checkout (e.g. ghostty). Clear them first.
          ws="${GITHUB_WORKSPACE:-$PWD}"
          rm -f "$ws/.git/index.lock" 2>/dev/null || true
          if [ -d "$ws/.git/modules" ]; then
            find "$ws/.git/modules" -type f -name "*.lock" -delete 2>/dev/null || true
          fi

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          # Depth 2 reaches the parent this commit was built on, which is what
          # "Select package tests" diffs against.
          fetch-depth: 2

      - name: Select package tests
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          FULL_SUITE: ${{ inputs.full_suite }}
        run: |
          set -euo pipefail
          PACKAGES=(
            CMUXAuthCore
            CmuxBrowser
            CmuxCanvasUI
            CmuxCloudMachines
            CmuxComputerUse
            CmuxCore
            CmuxRemoteDaemon
            CmuxRemoteWorkspace
            CmuxRemoteSession
            CmuxAgentChat
            CmuxAgentSessionStore
            CmuxAuthRuntime
            CmuxIrohTransport
            CmuxIrxTransport
            CmuxHive
            CmuxCommandPalette
            CmuxControlSocket
            CmuxFoundation
            CmuxGit
            CmuxMobileTerminalKit
            CmuxMobileWorkspace
            CmuxNotifications
            CmuxSettings
            CmuxSettingsUI
            CmuxSurfaceCatalogModel
            CmuxSudoBroker
            CmuxSudoBrokerUI
            CmuxTerminal
            CmuxTerminalCore
            CmuxUpdater
            CMUXAgentLaunch
            CmuxAgentJournal
            CmuxFilePreviewCore
            CmuxSyntaxHighlighting
          )

          changed="$RUNNER_TEMP/changed-files.txt"
          selected="$RUNNER_TEMP/selected-packages.txt"
          if { [ "$EVENT_NAME" = "pull_request" ] || [ "$EVENT_NAME" = "merge_group" ]; } \
            && git diff --no-renames --name-only HEAD^1 HEAD > "$changed" 2>/dev/null; then
            echo "changed_files=$changed" >> "$GITHUB_OUTPUT"
            # vendor/bonsplit is a submodule, so a revision bump is the bare path.
            if grep -qE '^vendor/bonsplit(/|$)' "$changed" || grep -qxF '.github/workflows/ci.yml' "$changed"; then
              echo "bonsplit=true" >> "$GITHUB_OUTPUT"
            fi
            selection_args=(--changed-files "$changed")
            if [ "$FULL_SUITE" != "true" ]; then
              # Match the router's candidate filtering even for mixed PRs.
              # A package edit plus a workflow edit must not become a full sweep.
              selection_args+=(--routed-inputs-only)
            fi
            python3 scripts/ci/select_package_tests.py "${selection_args[@]}" "${PACKAGES[@]}" > "$selected"
          else
            if [ "$FULL_SUITE" != "true" ]; then
              echo "::error::Diff unavailable for targeted package tests; refusing a full sweep."
              exit 1
            fi
            echo "Diff unavailable; running every package."
            echo "bonsplit=true" >> "$GITHUB_OUTPUT"
            printf '%s\n' "${PACKAGES[@]}" > "$selected"
          fi

          count="$(wc -l < "$selected" | tr -d ' ')"
          echo "selected_packages=$selected" >> "$GITHUB_OUTPUT"
          echo "selected_count=$count" >> "$GITHUB_OUTPUT"

          if grep -qxE 'CmuxTerminal|CmuxTerminalCore' "$selected"; then
            echo "needs_ghosttykit=true" >> "$GITHUB_OUTPUT"
          else
            echo "needs_ghosttykit=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -qxF CmuxCommandPalette "$selected"; then
            echo "needs_rust=true" >> "$GITHUB_OUTPUT"
          else
            echo "needs_rust=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Selected $count of ${#PACKAGES[@]} Swift packages."

      # Resolve once for the helper producer and Release consumer. Nightly
      # still builds the shipped universal app independently of this policy.
      - name: Resolve Release check architectures
        id: release-archs
        if: ${{ inputs.full_suite == 'true' && inputs.release_build == 'true' }}
        env:
          REQUESTED_ARCHS: ${{ inputs.release_archs != 'default' && inputs.release_archs || vars.CI_RELEASE_BUILD_ARCHS }}
        run: |
          set -euo pipefail
          archs="$(./scripts/ci/release-build-archs.sh "$REQUESTED_ARCHS")"
          echo "Release check architectures: $archs"
          echo "archs=$archs" >> "$GITHUB_OUTPUT"

      # Only release-build consumes this artifact. Package/app-host tests use
      # the prebuilt GhosttyKit framework and do not need the Release CLI.
      - name: Select helper Xcode
        if: ${{ inputs.full_suite == 'true' && inputs.release_build == 'true' }}
        run: |
          set -euo pipefail
          # The helper is a Zig build that needs an SDK 15 Xcode, below the
          # .xcode-version floor, so it opts out of the pool pin and the floor.
          CMUX_CI_XCODE_APP="$CMUX_CI_HELPER_XCODE_APP" \
            CMUX_CI_REQUIRED_MACOS_SDK_MAJOR=15 \
            CMUX_CI_XCODE_ALLOW_BELOW_FLOOR=1 \
            ./scripts/select-ci-xcode.sh

      - name: Install zig
        if: ${{ inputs.full_suite == 'true' && inputs.release_build == 'true' }}
        run: ./scripts/install-zig-ci.sh

      - name: Cache Zig packages
        if: ${{ inputs.full_suite == 'true' && inputs.release_build == 'true' }}
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/zig
          key: zig-packages-${{ hashFiles('ghostty/build.zig.zon', 'ghostty/build.zig.zon.json') }}
          restore-keys: zig-packages-

      - name: Build Release Ghostty CLI helper
        if: ${{ inputs.full_suite == 'true' && inputs.release_build == 'true' }}
        env:
          RELEASE_ARCHS: ${{ steps.release-archs.outputs.archs }}
        run: |
          set -euo pipefail
          mkdir -p ghostty-cli-helper
          # Keep this step parseable by the Ghostty submodule workflow guard.
          if [[ "$RELEASE_ARCHS" == arm64 ]]; then
            set -- --target aarch64-macos
          elif [[ "$RELEASE_ARCHS" == "arm64 x86_64" ]]; then
            set -- --universal
          else
            echo "unsupported Release helper architectures: $RELEASE_ARCHS" >&2
            exit 1
          fi
          ./scripts/build-ghostty-cli-helper.sh "$@" --output ghostty-cli-helper/ghostty
          ./scripts/ci/verify-binary-archs.sh "$RELEASE_ARCHS" ghostty-cli-helper/ghostty
          for arch in $RELEASE_ARCHS; do
            thin="ghostty-cli-helper/ghostty"
            if [[ "$RELEASE_ARCHS" == "arm64 x86_64" ]]; then
              thin="ghostty-cli-helper/ghostty-$arch"
              lipo ghostty-cli-helper/ghostty -thin "$arch" -output "$thin"
            fi
            HELPER_SDK_VERSION="$(otool -l "$thin" | awk '/LC_BUILD_VERSION/ { in_version=1; next } in_version && /sdk / { print $2; exit }')"
            echo "Ghostty helper $arch SDK version: $HELPER_SDK_VERSION"
            [[ "$HELPER_SDK_VERSION" == 15.* ]]
          done

      - name: Record Release Ghostty helper identity
        id: ghostty-helper-identity
        if: ${{ inputs.full_suite == 'true' && inputs.release_build == 'true' }}
        run: |
          set -euo pipefail
          helper=ghostty-cli-helper/ghostty
          sha256="$(shasum -a 256 "$helper" | awk '{print $1}')"
          toolchain_sha256="$({ xcodebuild -version; xcrun --sdk macosx --show-sdk-build-version; } | shasum -a 256 | awk '{print $1}')"
          sdk="$(otool -l "$helper" | awk '/LC_BUILD_VERSION/ { in_version=1; next } in_version && /sdk / { print $2; exit }')"
          test -n "$sdk"
          echo "Release Ghostty helper sha256: $sha256"
          echo "Release Ghostty helper toolchain sha256: $toolchain_sha256"
          echo "Release Ghostty helper SDK: $sdk"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          echo "toolchain_sha256=$toolchain_sha256" >> "$GITHUB_OUTPUT"
          echo "sdk=$sdk" >> "$GITHUB_OUTPUT"

      - name: Upload Release Ghostty CLI helper
        if: ${{ inputs.full_suite == 'true' && inputs.release_build == 'true' }}
        id: upload-ghostty-cli-helper
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-ghostty-cli-helper
          path: ghostty-cli-helper/ghostty
          if-no-files-found: error
          retention-days: 1

      - name: Retry Release Ghostty CLI helper upload
        if: ${{ inputs.full_suite == 'true' && inputs.release_build == 'true' && steps.upload-ghostty-cli-helper.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-ghostty-cli-helper
          path: ghostty-cli-helper/ghostty
          if-no-files-found: error
          retention-days: 1
          overwrite: true

      - name: Select Xcode
        run: |
          set -euo pipefail
          ./scripts/select-ci-xcode.sh

      - name: Capture Ghostty revision
        if: ${{ steps.select.outputs.needs_ghosttykit == 'true' }}
        id: ghostty-revision
        run: |
          echo "sha=$(git -C ghostty rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache GhosttyKit.xcframework
        if: ${{ steps.select.outputs.needs_ghosttykit == 'true' }}
        id: cache-ghosttykit-package-tests
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: GhosttyKit.xcframework
          key: ghosttykit-sentry-off-v1-${{ steps.ghostty-revision.outputs.sha }}

      - name: Validate cached GhosttyKit.xcframework
        if: ${{ steps.select.outputs.needs_ghosttykit == 'true' }}
        id: validate-ghosttykit-package-tests
        shell: bash
        run: |
          set -euo pipefail
          if [ -f GhosttyKit.xcframework/Info.plist ]; then
            echo "valid=true" >> "$GITHUB_OUTPUT"
          else
            rm -rf GhosttyKit.xcframework
            echo "valid=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download pre-built GhosttyKit.xcframework
        if: ${{ steps.select.outputs.needs_ghosttykit == 'true' && steps.validate-ghosttykit-package-tests.outputs.valid != 'true' }}
        run: |
          ./scripts/download-prebuilt-ghosttykit.sh

      - name: Install Rust
        if: ${{ steps.select.outputs.needs_rust == 'true' }}
        run: |
          ./scripts/install-rust-ci.sh

      - name: Run Bonsplit package tests
        if: ${{ steps.select.outputs.bonsplit == 'true' }}
        run: |
          set -euo pipefail
          # Blacksmith macOS runners intermittently abort a package's test
          # runner at startup. Retry exactly once only for the known signal
          # 5/6 crash immediately after build and before test output, matching
          # the package loop below.
          test_status=0
          output="$(swift test --package-path vendor/bonsplit 2>&1)" || test_status=$?
          printf '%s\n' "$output"
          if [ "$test_status" -ne 0 ] \
            && grep -Fq 'Build complete!' <<<"$output" \
            && grep -Eq 'Exited with unexpected signal code [56]([^0-9]|$)' <<<"$output" \
            && ! grep -Eq '^(Test Suite|Test Case|◇ |↳ |✔ |✘ )' <<<"$output"; then
            echo "Test runner crashed at startup (runner flake); retrying Bonsplit once."
            test_status=0
            output="$(swift test --package-path vendor/bonsplit 2>&1)" || test_status=$?
            printf '%s\n' "$output"
          fi
          if [ "$test_status" -ne 0 ]; then
            exit "$test_status"
          fi
          printf '%s\n' "$output" | python3 scripts/ci/require_swift_test_execution.py --log /dev/stdin

      - name: Run Swift package unit tests
        env:
          SELECTED_PACKAGES: ${{ steps.select.outputs.selected_packages }}
          SELECTED_COUNT: ${{ steps.select.outputs.selected_count }}
        run: |
          set -euo pipefail
          # The cmux-unit scheme only runs the cmuxTests app-host suite; it does
          # not execute the SPM package test targets. Run them here so package
          # tests (settings stores, secret-file migration, socket-control
          # convergence, etc.) are a real CI gate, not just compiled.
          # Scoped to packages that build headlessly via SwiftPM (no GhosttyKit /
          # app-target dependency). Add a package here once its `swift test`
          # is confirmed to resolve standalone. The GhosttyKit-referencing
          # packages (CmuxTerminalCore and the terminal packages stacked on
          # it) are the exception: their binaryTarget only needs the
          # xcframework present at the repo root (downloaded earlier in this
          # job), and their test runners link a C stub for the @_silgen_name
          # symbol instead of the GhosttyKit archive.
          selected="$SELECTED_PACKAGES"
          test -f "$selected"
          echo "Testing $SELECTED_COUNT selected Swift packages."
          # SwiftPM emits an error-severity diagnostic while planning the
          # GhosttyKit binaryTarget (the xcframework's static archive is not
          # lib-prefixed: "unexpected binary name"/"unexpected binary
          # framework"). The build and every test still succeed, but the
          # diagnostic poisons the process exit code on a fresh .build. For
          # the GhosttyKit-referencing packages only, tolerate exactly that
          # case: a nonzero exit passes only when the all-tests-passed summary
          # is present, no test failures are reported, and the only error
          # lines are that known diagnostic. Everything else (compile errors,
          # test failures, crashes) still fails the job.
          if grep -qxF CmuxCommandPalette "$selected"; then
            # CmuxCommandPalette's nucleo FFI tests load the Rust dylib through
            # CMUX_NUCLEO_FFI_LIB (they skip when it is absent, so build it here
            # to keep the FFI parity suite a real gate).
            cargo build --manifest-path Native/CommandPaletteNucleoFFI/Cargo.toml --release
            export CMUX_NUCLEO_FFI_LIB="$PWD/Native/CommandPaletteNucleoFFI/target/release/libcmux_command_palette_nucleo_ffi.dylib"
          fi
          while IFS= read -r pkg; do
            [ -n "$pkg" ] || continue
            # Packages live under group folders (Packages/{Shared,iOS,macOS}/);
            # resolve the actual directory so this list stays group-agnostic.
            pkgdir="$(find Packages -mindepth 2 -maxdepth 2 -type d -name "$pkg" -print -quit)"
            if [ -z "$pkgdir" ]; then
              echo "::error::package '$pkg' not found under Packages/*/ (renamed or moved?)"
              exit 1
            fi
            echo "::group::swift test $pkgdir"
            swift_test_args=(--package-path "$pkgdir")
            # Preserve the notification workflow's warning gate without a
            # second package build or changing the existing startup retry.
            case "$pkg" in
              CMUXAgentLaunch|CmuxAgentJournal)
                swift_test_args+=(-Xswiftc -warnings-as-errors)
                ;;
            esac
            case "$pkg" in
            # CmuxFoundation has several process-tree suites whose child
            # fixtures share global process resources; run each suite in its
            # own Swift Testing process just like the auth/transport suites.
            CmuxAgentChat|CmuxAuthRuntime|CmuxFoundation|CmuxIrohTransport|CmuxIrxTransport)
              ./scripts/ci/run-swift-testing-suites.sh "$pkgdir"
              ;;
            CmuxTerminal|CmuxTerminalCore)
              test_status=0
              output="$(swift test "${swift_test_args[@]}" 2>&1)" || test_status=$?
              printf '%s\n' "$output"
              if [ "$test_status" -ne 0 ]; then
                if [ "$test_status" -eq 1 ] \
                  && grep -Eq 'error:.*unexpected binary' <<<"$output" \
                  && python3 scripts/ci/require_swift_test_execution.py --log /dev/stdin <<<"$output" \
                  && ! grep -Eq 'with [1-9][0-9]* failures?' <<<"$output" \
                  && ! grep -Fq 'Exited with unexpected signal code' <<<"$output" \
                  && ! grep -Eq '(^|[^a-zA-Z])error:' <<<"$(grep -v 'unexpected binary' <<<"$output")"; then
                  echo "Tolerated cosmetic GhosttyKit binaryTarget diagnostic; all tests passed."
                else
                  exit "$test_status"
                fi
              else
                printf '%s\n' "$output" | python3 scripts/ci/require_swift_test_execution.py --log /dev/stdin
              fi
              ;;
            *)
              # Blacksmith macOS runners intermittently abort a package's
              # test runner at startup (signal 5/6 immediately after "Build
              # complete!", zero test output). That is a runner flake, not a
              # test failure: retry exactly once, and only when no test
              # output was emitted.
              test_status=0
              output="$(swift test "${swift_test_args[@]}" 2>&1)" || test_status=$?
              printf '%s\n' "$output"
              if [ "$test_status" -ne 0 ] \
                && grep -Fq 'Build complete!' <<<"$output" \
                && grep -Eq 'Exited with unexpected signal code [56]([^0-9]|$)' <<<"$output" \
                && ! grep -Eq '^(Test Suite|Test Case|◇ |↳ |✔ |✘ )' <<<"$output"; then
                echo "Test runner crashed at startup (runner flake); retrying $pkg once."
                test_status=0
                output="$(swift test "${swift_test_args[@]}" 2>&1)" || test_status=$?
                printf '%s\n' "$output"
              fi
              if [ "$test_status" -ne 0 ]; then
                exit "$test_status"
              fi
              printf '%s\n' "$output" | python3 scripts/ci/require_swift_test_execution.py --log /dev/stdin
              ;;
            esac
            echo "::endgroup::"
          done < "$selected"

      # A package test runner that dies on a signal prints one line from
      # SwiftPM ("Exited with unexpected signal code N") and nothing else: no
      # faulting address, no thread, no frames. That is why the only tool this
      # job has ever had for a crash is a retry whose signal list has to be
      # guessed at. macOS already wrote the report; collect it so the next
      # crash is diagnosed from a backtrace instead of from the signal number.
      - name: Collect test runner crash reports
        if: ${{ failure() }}
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          reports="$RUNNER_TEMP/package-test-crash-reports"
          mkdir -p "$reports"
          found=0
          for dir in "$HOME/Library/Logs/DiagnosticReports" /Library/Logs/DiagnosticReports; do
            [ -d "$dir" ] || continue
            # Only this job's own crashes: reports written since the runner
            # started this workspace, from SwiftPM test runners and swift-*
            # tools. -newer keeps an unrelated report from an earlier job out.
            while IFS= read -r report; do
              case "$(basename "$report")" in
                *PackageTests*|*xctest*|*swift-testing*|*swift*)
                  cp "$report" "$reports/" 2>/dev/null && found=$((found + 1))
                  ;;
              esac
            done < <(find "$dir" -maxdepth 1 -type f \( -name '*.ips' -o -name '*.crash' \) -newer "$GITHUB_WORKSPACE/.git" 2>/dev/null)
          done
          if [ "$found" -eq 0 ]; then
            echo "No matching crash report found. A signal the kernel does not report (for example a runner-initiated kill) leaves none."
            exit 0
          fi
          echo "Collected $found crash report(s)."
          for report in "$reports"/*; do
            echo "::group::$(basename "$report")"
            # The .ips header is one JSON line followed by the payload; print
            # enough to identify the signal, the faulting address and the
            # crashing thread's frames without dumping every loaded image.
            head -c 20000 "$report"
            echo
            echo "::endgroup::"
          done

      - name: Upload test runner crash reports
        if: ${{ failure() }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: swift-package-tests-crash-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/package-test-crash-reports
          if-no-files-found: ignore
          retention-days: 7

  tests-build-and-lag:
    permissions:
      contents: read
      actions: read
      id-token: write
    needs:
      - macos-compile-admission
    # !cancelled() disables the implicit success() gate, which GitHub evaluates
    # over the transitive needs chain: linux-preflight runs behind routed linux
    # jobs that legitimately skip (web/go/agent-session paths), and that
    # transitive skip otherwise marks every macOS job skipped even when
    # linux-preflight itself succeeds. Require the direct needs explicitly.
    if: ${{ !cancelled() && needs.macos-compile-admission.result == 'success' && inputs.macos == 'true' && inputs.full_suite == 'true' }}
    # Reuse compile admission's app and UI test products; this runner only
    # performs display and runtime verification. Its route and Xcode pin
    # restate compile admission's (the test bundles only load under the Xcode
    # that linked them), except that paid overflow may move non-PR display
    # work to MACOS_RUNNER_DISPLAY under the same macOS 15 pin. Main's
    # full-suite dispatch follows admission onto the pull-request pool and
    # Xcode. The product consumer guard in the CI change-area tests fails when
    # the two drift.
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || ((github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') && (vars.MACOS_RUNNER_PR || 'blacksmith-6vcpu-macos-15') || vars.CI_PAID_MACOS_OVERFLOW == '1' && vars.MACOS_RUNNER_DISPLAY || 'blacksmith-6vcpu-macos-15') }}
    timeout-minutes: 75
    env:
      CMUX_NODE_PRODUCT_CACHE_ROOT: ${{ vars.CMUX_NODE_PRODUCT_CACHE_ROOT }}
      CMUX_NODE_PRODUCT_CACHE_MAX_BYTES: ${{ vars.CMUX_NODE_PRODUCT_CACHE_MAX_BYTES }}
      CMUX_NODE_PRODUCT_CACHE_WAIT_SECONDS: ${{ vars.CMUX_NODE_PRODUCT_CACHE_WAIT_SECONDS }}
      CMUX_ARTIFACT_PEER_URLS: ${{ vars.CMUX_ARTIFACT_PEER_URLS }}
      CMUX_ARTIFACT_PEER_TOKEN_FILE: ${{ vars.CMUX_ARTIFACT_PEER_TOKEN_FILE }}
      CMUX_CI_XCODE_APP: ${{ (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') && (vars.CMUX_CI_XCODE_APP_PR || vars.CMUX_CI_XCODE_APP_MACOS_15) || vars.CMUX_CI_XCODE_APP_MACOS_15 }}
      CMUX_CI_REQUIRED_MACOS_SDK_MAJOR: "26"
    steps:
      - name: Validate display runner identity
        env:
          REQUESTED_RUNNER: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || ((github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') && (vars.MACOS_RUNNER_PR || 'blacksmith-6vcpu-macos-15') || vars.CI_PAID_MACOS_OVERFLOW == '1' && vars.MACOS_RUNNER_DISPLAY || 'blacksmith-6vcpu-macos-15') }}
          RUNNER_CONTEXT_NAME: ${{ runner.name }}
        run: |
          set -euo pipefail
          echo "Requested runner: $REQUESTED_RUNNER"
          case "$REQUESTED_RUNNER" in
            depot-*)
              case "$RUNNER_CONTEXT_NAME" in
                depot-*)
                  echo "Resolved runner matches depot-*? yes"
                  ;;
                *)
                  echo "Resolved runner matches depot-*? no"
                  echo "::error::$REQUESTED_RUNNER resolved outside Depot. Remove $REQUESTED_RUNNER from non-Depot self-hosted runners or choose a different runner."
                  exit 1
                  ;;
              esac
              ;;
            *)
              echo "Display runner is not Depot; skipping Depot identity guard"
              ;;
          esac

      - name: Clear stale git locks (self-hosted reused workspace)
        shell: bash
        run: |
          # Self-hosted macOS runners reuse the workspace. A job cancelled or
          # killed mid-checkout can leave a stale .git/modules/*/index.lock that
          # fails every later submodule checkout (e.g. ghostty). Clear them first.
          ws="${GITHUB_WORKSPACE:-$PWD}"
          rm -f "$ws/.git/index.lock" 2>/dev/null || true
          if [ -d "$ws/.git/modules" ]; then
            find "$ws/.git/modules" -type f -name "*.lock" -delete 2>/dev/null || true
          fi

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive

      - name: Select Xcode
        run: |
          set -euo pipefail
          ./scripts/select-ci-xcode.sh

      - name: Prepare isolated DerivedData
        run: |
          set -euo pipefail
          DERIVED_DATA_PATH="$RUNNER_TEMP/cmux-deriveddata-tests-build-and-lag"
          rm -rf "$DERIVED_DATA_PATH"
          mkdir -p "$DERIVED_DATA_PATH"
          echo "CMUX_DERIVED_DATA_PATH=$DERIVED_DATA_PATH" >> "$GITHUB_ENV"

      - name: Try node-local compiled product cache
        id: node-products
        continue-on-error: true
        env:
          ARTIFACT_ID: ${{ needs.macos-compile-admission.outputs.artifact_id }}
          ARTIFACT_PROVIDER_DIGEST: ${{ needs.macos-compile-admission.outputs.artifact_digest }}
          EXPECTED_SHA256: ${{ needs.macos-compile-admission.outputs.sha256 }}
          CMUX_PRODUCT_CONTRACT: ${{ needs.macos-compile-admission.outputs.product_contract }}
          CMUX_PRODUCT_SOURCE_REVISION: ${{ needs.macos-compile-admission.outputs.source_revision }}
          CMUX_PRODUCT_PRODUCER_RUN_ID: ${{ needs.macos-compile-admission.outputs.producer_run_id }}
          CMUX_PRODUCT_PRODUCER_RUN_ATTEMPT: ${{ needs.macos-compile-admission.outputs.producer_run_attempt }}
          CMUX_NODE_PRODUCT_CACHE_FALLBACK_SOURCE: ${{ vars.CMUX_ARTIFACT_PEER_URLS != '' && 'peer' || (vars.CI_ARTIFACT_R2_URL != '' && 'r2' || 'github') }}
        run: python3 scripts/ci/node_product_cache.py acquire "$RUNNER_TEMP/app-host-products"

      - name: Try trusted fleet peer artifact source
        id: peer-products
        if: steps.node-products.outputs.hit != 'true'
        continue-on-error: true
        env:
          ARTIFACT_ID: ${{ needs.macos-compile-admission.outputs.artifact_id }}
          ARTIFACT_PROVIDER_DIGEST: ${{ needs.macos-compile-admission.outputs.artifact_digest }}
          EXPECTED_SHA256: ${{ needs.macos-compile-admission.outputs.sha256 }}
          CMUX_PRODUCT_CONTRACT: ${{ needs.macos-compile-admission.outputs.product_contract }}
          CMUX_PRODUCT_SOURCE_REVISION: ${{ needs.macos-compile-admission.outputs.source_revision }}
          CMUX_PRODUCT_PRODUCER_RUN_ID: ${{ needs.macos-compile-admission.outputs.producer_run_id }}
          CMUX_PRODUCT_PRODUCER_RUN_ATTEMPT: ${{ needs.macos-compile-admission.outputs.producer_run_attempt }}
        run: python3 scripts/ci/peer_product_source.py fetch "$RUNNER_TEMP/app-host-products"

      - name: Restore selective app-host product layers
        id: restore-layers
        if: steps.node-products.outputs.hit != 'true' && steps.peer-products.outputs.hit != 'true' && needs.macos-compile-admission.outputs.layer_index_artifact_id != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          CMUX_RUN_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CMUX_APP_HOST_LAYER_PROFILE: app-host-tests
          LAYER_INDEX_ID: ${{ needs.macos-compile-admission.outputs.layer_index_artifact_id }}
          LAYER_INDEX_DIGEST: ${{ needs.macos-compile-admission.outputs.layer_index_digest }}
        run: |
          python3 scripts/ci/app_host_layer_transport.py restore             "${CMUX_DERIVED_DATA_PATH}-layers"             --index-id "$LAYER_INDEX_ID"             --index-digest "$LAYER_INDEX_DIGEST"

      # R2 is an optional remote broker. With no configured endpoint, a peer
      # miss falls straight through to the canonical GitHub artifact.
      - name: Try shared R2 artifact transport
        id: r2-products
        if: steps.node-products.outputs.hit != 'true' && steps.peer-products.outputs.hit != 'true' && steps.restore-layers.outputs.hit != 'true' && vars.CI_ARTIFACT_R2_URL != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          CI_ARTIFACT_R2_URL: ${{ vars.CI_ARTIFACT_R2_URL }}
          ARTIFACT_ID: ${{ needs.macos-compile-admission.outputs.artifact_id }}
          ARTIFACT_PROVIDER_DIGEST: ${{ needs.macos-compile-admission.outputs.artifact_digest }}
        run: python3 scripts/ci/restore-r2-artifact.py

      # Same exact-ID GitHub artifact, read over parallel range requests. The
      # single-stream download-artifact path sustained ~2 MB/s on Blacksmith
      # macOS (7-10 min per consumer); it stays below as the fallback.
      - name: Try parallel GitHub artifact transport
        id: parallel-products
        if: steps.node-products.outputs.hit != 'true' && steps.peer-products.outputs.hit != 'true' && steps.restore-layers.outputs.hit != 'true' && steps.r2-products.outputs.hit != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.macos-compile-admission.outputs.artifact_id }}
          ARTIFACT_PROVIDER_DIGEST: ${{ needs.macos-compile-admission.outputs.artifact_digest }}
        run: python3 scripts/ci/parallel_artifact_download.py

      - name: Download compiled app-host test product
        if: steps.node-products.outputs.hit != 'true' && steps.peer-products.outputs.hit != 'true' && steps.restore-layers.outputs.hit != 'true' && steps.r2-products.outputs.hit != 'true' && steps.parallel-products.outputs.hit != 'true'
        uses: ./.github/actions/download-test-product
        with:
          artifact-id: ${{ needs.macos-compile-admission.outputs.artifact_id }}
          path: ${{ runner.temp }}/app-host-products

      - name: Restore compiled app-host test product
        id: restore-products
        env:
          ARTIFACT_ID: ${{ needs.macos-compile-admission.outputs.artifact_id }}
          ARTIFACT_PROVIDER_DIGEST: ${{ needs.macos-compile-admission.outputs.artifact_digest }}
          EXPECTED_SHA256: ${{ needs.macos-compile-admission.outputs.sha256 }}
          CMUX_PRODUCT_CONTRACT: ${{ needs.macos-compile-admission.outputs.product_contract }}
          CMUX_PRODUCT_SOURCE_REVISION: ${{ needs.macos-compile-admission.outputs.source_revision }}
          CMUX_PRODUCT_PRODUCER_RUN_ID: ${{ needs.macos-compile-admission.outputs.producer_run_id }}
          CMUX_PRODUCT_PRODUCER_RUN_ATTEMPT: ${{ needs.macos-compile-admission.outputs.producer_run_attempt }}
          CMUX_LAYER_RESTORED: ${{ steps.restore-layers.outputs.hit }}
          CMUX_NODE_PRODUCT_CACHE_HIT: ${{ steps.node-products.outputs.hit }}
          CMUX_NODE_PRODUCT_CACHE_LOOKUP_SECONDS: ${{ steps.node-products.outputs.lookup_seconds }}
          CMUX_PEER_PRODUCT_HIT: ${{ steps.peer-products.outputs.hit }}
          CMUX_PEER_PRODUCT_LOOKUP_SECONDS: ${{ steps.peer-products.outputs.lookup_seconds }}
          CMUX_PEER_PRODUCT_TRANSFER_SECONDS: ${{ steps.peer-products.outputs.transfer_seconds }}
          CMUX_PEER_PRODUCT_BYTES: ${{ steps.peer-products.outputs.bytes_transferred }}
          CMUX_R2_PRODUCT_HIT: ${{ steps.r2-products.outputs.hit }}
          CMUX_PARALLEL_PRODUCT_HIT: ${{ steps.parallel-products.outputs.hit }}
          CMUX_PARALLEL_PRODUCT_TRANSFER_SECONDS: ${{ steps.parallel-products.outputs.transfer_seconds }}
          CMUX_ARTIFACT_R2_RESULT: ${{ steps.r2-products.outputs.r2_result }}
        run: scripts/ci/restore-app-host-test-product.sh

      - name: Finalize node-local compiled product cache
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.macos-compile-admission.outputs.artifact_id }}
          ARTIFACT_PROVIDER_DIGEST: ${{ needs.macos-compile-admission.outputs.artifact_digest }}
          EXPECTED_SHA256: ${{ needs.macos-compile-admission.outputs.sha256 }}
          CMUX_PRODUCT_CONTRACT: ${{ needs.macos-compile-admission.outputs.product_contract }}
          CMUX_PRODUCT_SOURCE_REVISION: ${{ needs.macos-compile-admission.outputs.source_revision }}
          CMUX_PRODUCT_PRODUCER_RUN_ID: ${{ needs.macos-compile-admission.outputs.producer_run_id }}
          CMUX_PRODUCT_PRODUCER_RUN_ATTEMPT: ${{ needs.macos-compile-admission.outputs.producer_run_attempt }}
          CMUX_NODE_PRODUCT_CACHE_TOKEN: ${{ steps.node-products.outputs.token }}
          CMUX_NODE_PRODUCT_CACHE_LEASE: ${{ steps.node-products.outputs.lease }}
          CMUX_NODE_PRODUCT_SOURCE_CLASS: ${{ steps.peer-products.outputs.hit == 'true' && 'peer' || (steps.r2-products.outputs.hit == 'true' && 'r2' || 'github') }}
          CMUX_PRODUCT_RESTORE_SUCCEEDED: ${{ steps.restore-products.outcome == 'success' && steps.restore-layers.outputs.hit != 'true' }}
        run: python3 scripts/ci/node_product_cache.py finalize "$RUNNER_TEMP/app-host-products/app-host-products.tar.gz"

      - name: Run display UI regressions
        run: scripts/ci/run-display-ui-regressions.sh

      - name: Create virtual display
        run: |
          set -euo pipefail
          HELPER_PATH="$RUNNER_TEMP/create-virtual-display"
          VDISPLAY_READY="$RUNNER_TEMP/cmux-build-lag-vdisplay.ready"
          VDISPLAY_ID_PATH="$RUNNER_TEMP/cmux-build-lag-vdisplay.id"
          VDISPLAY_LOG="$RUNNER_TEMP/cmux-build-lag-vdisplay.log"
          VDISPLAY_PID=""

          clang -framework Foundation -framework CoreGraphics \
            -o "$HELPER_PATH" scripts/create-virtual-display.m

          cleanup_display_attempt() {
            if [ -n "${VDISPLAY_PID:-}" ]; then
              kill "$VDISPLAY_PID" >/dev/null 2>&1 || true
              for _ in $(seq 1 50); do
                kill -0 "$VDISPLAY_PID" >/dev/null 2>&1 || break
                sleep 0.1
              done
              if kill -0 "$VDISPLAY_PID" >/dev/null 2>&1; then
                kill -9 "$VDISPLAY_PID" >/dev/null 2>&1 || true
                wait "$VDISPLAY_PID" >/dev/null 2>&1 || true
              fi
              VDISPLAY_PID=""
            fi
            scripts/ci/virtual-display-lock.sh reap-strays || true
            scripts/ci/virtual-display-lock.sh release || true
          }

          for attempt in 1 2 3; do
            rm -f "$VDISPLAY_READY" "$VDISPLAY_ID_PATH" "$VDISPLAY_LOG"
            LOCK_ENV="$(scripts/ci/virtual-display-lock.sh acquire)"
            eval "$LOCK_ENV"
            export CMUX_VDISPLAY_LOCK_DIR CMUX_VDISPLAY_LOCK_TOKEN
            {
              echo "CMUX_VDISPLAY_LOCK_DIR=$CMUX_VDISPLAY_LOCK_DIR"
              echo "CMUX_VDISPLAY_LOCK_TOKEN=$CMUX_VDISPLAY_LOCK_TOKEN"
            } >> "$GITHUB_ENV"

            # Now that we hold the lock, reap any leaked display helper so a
            # CGVirtualDisplay orphaned by a crashed/cancelled job cannot block
            # this create on persistent self-hosted runners.
            scripts/ci/virtual-display-lock.sh reap-strays || true

            "$HELPER_PATH" \
              --ready-path "$VDISPLAY_READY" \
              --display-id-path "$VDISPLAY_ID_PATH" \
              >"$VDISPLAY_LOG" 2>&1 &
            VDISPLAY_PID=$!
            scripts/ci/virtual-display-lock.sh set-owner "$VDISPLAY_PID"

            {
              echo "VDISPLAY_PID=$VDISPLAY_PID"
              echo "VDISPLAY_HELPER_PATH=$HELPER_PATH"
              echo "VDISPLAY_READY=$VDISPLAY_READY"
              echo "VDISPLAY_ID_PATH=$VDISPLAY_ID_PATH"
              echo "VDISPLAY_LOG=$VDISPLAY_LOG"
            } >> "$GITHUB_ENV"

            for _ in $(seq 1 100); do
              if [ -s "$VDISPLAY_READY" ] && [ -s "$VDISPLAY_ID_PATH" ]; then
                break
              fi
              if ! kill -0 "$VDISPLAY_PID" 2>/dev/null; then
                echo "Virtual display helper exited before readiness on attempt $attempt" >&2
                cat "$VDISPLAY_LOG" >&2 || true
                break
              fi
              sleep 0.1
            done

            if [ -s "$VDISPLAY_READY" ] && [ -s "$VDISPLAY_ID_PATH" ]; then
              echo "Virtual display ready: $(tr -d '\n' < "$VDISPLAY_ID_PATH")"
              cat "$VDISPLAY_LOG"
              exit 0
            fi

            echo "Virtual display not ready on attempt $attempt" >&2
            cat "$VDISPLAY_LOG" >&2 || true
            cleanup_display_attempt
            if [ "$attempt" -eq 3 ]; then
              echo "Failed to create virtual display after 3 attempts" >&2
              exit 1
            fi
            sleep 5
          done

      - name: Run CoreAnimation main-thread startup regression
        run: |
          set -euo pipefail
          APP="$(
            find "$CMUX_DERIVED_DATA_PATH" -path "*/Build/Products/Debug/cmux DEV.app" -exec stat -f '%m %N' {} \; \
              | sort -nr \
              | head -1 \
              | cut -d' ' -f2-
          )"
          if [ -z "${APP:-}" ] || [ ! -d "$APP" ]; then
            echo "cmux DEV.app not found in DerivedData" >&2
            exit 1
          fi

          CMUX_ALLOW_UNTAGGED_CA_REGRESSION=1 \
          CMUX_CA_ASSERT_HOLD_SECONDS=15 \
          CMUX_TAG="ci-ca-main-thread" \
          ./scripts/verify-main-thread-ca-transactions.sh "$APP"

      - name: Run workspace churn typing-lag regression
        run: |
          set -euo pipefail

          APP="$(find "$CMUX_DERIVED_DATA_PATH" -path "*/Build/Products/Debug/cmux DEV.app" -print -quit)"
          if [ -z "${APP:-}" ] || [ ! -d "$APP" ]; then
            echo "cmux DEV.app not found in DerivedData" >&2
            exit 1
          fi

          TAG="ci-lag"
          SOCK="/tmp/cmux-debug-${TAG}.sock"
          BUNDLE_ID="$(
            /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Contents/Info.plist" 2>/dev/null \
              || echo 'com.cmuxterm.app.debug'
          )"

          pkill -x "cmux DEV" || true
          rm -f "$SOCK" "/tmp/cmux-${TAG}.sock" || true
          defaults write "$BUNDLE_ID" socketControlMode -string full >/dev/null 2>&1 || true

          CMUX_TAG="$TAG" CMUX_SOCKET_PATH="$SOCK" CMUX_UI_TEST_MODE=1 "$APP/Contents/MacOS/cmux DEV" >/tmp/cmux-ci-lag.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" >/dev/null 2>&1 || true' EXIT

          for _ in {1..240}; do
            [ -S "$SOCK" ] && break
            sleep 0.25
          done
          [ -S "$SOCK" ] || { echo "Socket not ready at $SOCK" >&2; exit 1; }

          CMUX_SOCKET_PATH="$SOCK" \
          CMUX_LAG_MAX_P95_RATIO=1.70 \
          CMUX_LAG_MAX_AVG_RATIO=1.70 \
          CMUX_LAG_MIN_BASELINE_P95_MS_FOR_RATIO=6.0 \
          CMUX_LAG_MIN_BASELINE_AVG_MS_FOR_RATIO=4.0 \
          CMUX_LAG_MAX_P95_DELTA_MS=20.0 \
          CMUX_LAG_MAX_AVG_DELTA_MS=12.0 \
          CMUX_LAG_MAX_CHURN_P95_MS=35 \
          CMUX_LAG_KEY_EVENTS=180 \
          python3 tests/test_workspace_churn_up_arrow_lag.py

      - name: Cleanup virtual display
        if: always()
        run: |
          set -euo pipefail
          if [ -n "${VDISPLAY_PID:-}" ]; then
            kill "$VDISPLAY_PID" >/dev/null 2>&1 || true
            for _ in $(seq 1 50); do
              kill -0 "$VDISPLAY_PID" >/dev/null 2>&1 || break
              sleep 0.1
            done
            if kill -0 "$VDISPLAY_PID" >/dev/null 2>&1; then
              kill -9 "$VDISPLAY_PID" >/dev/null 2>&1 || true
              wait "$VDISPLAY_PID" >/dev/null 2>&1 || true
            fi
          fi
          scripts/ci/virtual-display-lock.sh reap-strays || true
          scripts/ci/virtual-display-lock.sh release || true
          rm -f "${VDISPLAY_HELPER_PATH:-}" "${VDISPLAY_READY:-}" "${VDISPLAY_ID_PATH:-}" "${VDISPLAY_LOG:-}"

  release-admission:
    needs:
      - swift-package-tests
      - macos-compile-admission
    if: ${{ !cancelled() && needs.swift-package-tests.result == 'success' && needs.macos-compile-admission.result == 'success' && inputs.release_build == 'true' && inputs.full_suite == 'true' }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 20
    steps:
      - name: Wait for routed Linux preflight
        env:
          API_URL: ${{ github.api_url }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          TARGET_JOB: "linux-preflight"
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import time
          import urllib.error
          import urllib.request

          api_url = os.environ["API_URL"].rstrip("/")
          token = os.environ["GH_TOKEN"]
          repository = os.environ["REPOSITORY"]
          run_id = os.environ["RUN_ID"]
          target_job = os.environ["TARGET_JOB"]
          url = f"{api_url}/repos/{repository}/actions/runs/{run_id}/jobs?filter=latest&per_page=100"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "User-Agent": "cmux-ci-release-admission",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          last_state = "job has not appeared yet"
          for attempt in range(210):
              request = urllib.request.Request(url, headers=headers)
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      jobs = json.load(response).get("jobs", [])
              except (OSError, urllib.error.URLError, json.JSONDecodeError) as exc:
                  last_state = f"GitHub API error: {exc}"
              else:
                  target = next((job for job in jobs if job.get("name") == target_job), None)
                  if target is None:
                      last_state = "job has not appeared yet"
                  else:
                      status = target.get("status")
                      conclusion = target.get("conclusion")
                      last_state = f"status={status} conclusion={conclusion}"
                      if status == "completed":
                          if conclusion == "success":
                              print(f"{target_job} passed; admitting Release build")
                              sys.exit(0)
                          print(
                              f"{target_job} completed with {conclusion}; blocking Release build",
                              file=sys.stderr,
                          )
                          sys.exit(1)

              if attempt % 12 == 0:
                  print(f"Waiting for {target_job}: {last_state}")
              time.sleep(5)

          print(f"Timed out waiting for {target_job}: {last_state}", file=sys.stderr)
          sys.exit(1)
          PY

  release-build:
    needs:
      - swift-package-tests
      - macos-compile-admission
      - release-admission
    # Keep the universal Release compile behind both its macOS prerequisites
    # and the routed Linux verdict so a red guard never launches the paid runner.
    if: ${{ !cancelled() && needs.swift-package-tests.result == 'success' && needs.macos-compile-admission.result == 'success' && needs.release-admission.result == 'success' && inputs.release_build == 'true' && inputs.full_suite == 'true' }}
    # Compile the same unsigned universal Release app that nightly builds before
    # signing, notarization, and publishing. This catches DEBUG/Release boundary
    # mistakes before they reach main.
    # Keep the app build on macOS 26 so SDK-gated SwiftUI Liquid Glass code
    # compiles into the same artifact shape as nightly and stable releases.
    # Release builds need enough disk for a universal Release build plus the
    # restored SwiftPM cache, which the macOS 26 image already carries. The
    # variable names that image, not this lane.
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || (vars.MACOS_RUNNER_26 || 'blacksmith-6vcpu-macos-26') }}
    timeout-minutes: 60
    permissions:
      actions: read
      attestations: read
      contents: read
    env:
      CMUX_CI_XCODE_APP: ${{ vars.CMUX_CI_XCODE_APP_MACOS_26 }}
      CMUX_CI_REQUIRED_MACOS_SDK_MAJOR: "26"
      CMUX_SKIP_ZIG_BUILD: "1"
      CMUX_PRODUCT_RUNNER: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || (vars.MACOS_RUNNER_26 || 'blacksmith-6vcpu-macos-26') }}
      CMUX_RELEASE_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Clear stale git locks (self-hosted reused workspace)
        shell: bash
        run: |
          # Self-hosted macOS runners reuse the workspace. A job cancelled or
          # killed mid-checkout can leave a stale .git/modules/*/index.lock that
          # fails every later submodule checkout (e.g. ghostty). Clear them first.
          ws="${GITHUB_WORKSPACE:-$PWD}"
          rm -f "$ws/.git/index.lock" 2>/dev/null || true
          if [ -d "$ws/.git/modules" ]; then
            find "$ws/.git/modules" -type f -name "*.lock" -delete 2>/dev/null || true
          fi

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive

      - name: Select Xcode
        run: |
          set -euo pipefail
          ./scripts/select-ci-xcode.sh

      - name: Validate app bundle thinning
        run: ./tests/test_thin_app_bundle.sh

      # Tool versions are part of the Release fingerprint, so select them before
      # lookup. These are cheap relative to compiling the app and are also used
      # by current-run validation.
      - name: Install Rust
        run: ./scripts/install-rust-ci.sh

      - name: Set up Go for the Cloud tunnel extension
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          cache: false

      - name: Validate cmux-tui client installation
        run: /bin/bash ./tests/test_install_cmux_tui_client.sh

      # The assembled app includes cmux-tui. Resolve and authenticate the exact
      # immutable producer before product lookup so restored bytes are bound to
      # the same helper identity a fresh build would install.
      - name: Resolve Release cmux-tui producer identity
        id: release-tui
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest_url="https://files.cmux.com/cmux-tui/latest/manifest.json"
          latest_manifest="$RUNNER_TEMP/cmux-tui-release-latest-manifest.json"
          curl --proto '=https' --tlsv1.2 -fsSL --retry 5 --retry-delay 3 --retry-all-errors --retry-connrefused "$latest_url" -o "$latest_manifest"
          gh attestation verify "$latest_manifest" \
            --repo manaflow-ai/cmux \
            --signer-workflow manaflow-ai/cmux/.github/workflows/cmux-tui-artifacts.yml >&2
          commit="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["commit"])' "$latest_manifest")"
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          manifest_url="https://files.cmux.com/cmux-tui/$commit/manifest.json"
          manifest="$RUNNER_TEMP/cmux-tui-release-manifest.json"
          curl --proto '=https' --tlsv1.2 -fsSL --retry 5 --retry-delay 3 --retry-all-errors --retry-connrefused "$manifest_url" -o "$manifest"
          gh attestation verify "$manifest" \
            --repo manaflow-ai/cmux \
            --signer-workflow manaflow-ai/cmux/.github/workflows/cmux-tui-artifacts.yml \
            --source-digest "$commit" >&2
          manifest_commit="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["commit"])' "$manifest")"
          test "$manifest_commit" = "$commit"
          manifest_sha256="$(shasum -a 256 "$manifest" | awk '{print $1}')"
          echo "Release cmux-tui producer: $commit"
          echo "Release cmux-tui manifest sha256: $manifest_sha256"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "manifest_url=$manifest_url" >> "$GITHUB_OUTPUT"
          echo "manifest_sha256=$manifest_sha256" >> "$GITHUB_OUTPUT"

      - name: Reclaim release runner disk
        run: |
          set -euo pipefail
          echo "Disk before cleanup:"
          df -h /
          rm -rf build-universal .spm-cache
          echo "Disk after cleanup:"
          df -h /

      - name: Identify reusable unsigned Release product
        id: release-product-key
        env:
          CMUX_RELEASE_ARCHS: ${{ needs.swift-package-tests.outputs.release_archs }}
          CMUX_RELEASE_GHOSTTY_HELPER_SHA256: ${{ needs.swift-package-tests.outputs.ghostty_helper_sha256 }}
          CMUX_RELEASE_GHOSTTY_HELPER_TOOLCHAIN_SHA256: ${{ needs.swift-package-tests.outputs.ghostty_helper_toolchain_sha256 }}
          CMUX_RELEASE_GHOSTTY_HELPER_SDK: ${{ needs.swift-package-tests.outputs.ghostty_helper_sdk }}
          CMUX_RELEASE_TUI_COMMIT: ${{ steps.release-tui.outputs.commit }}
          CMUX_RELEASE_TUI_MANIFEST_SHA256: ${{ steps.release-tui.outputs.manifest_sha256 }}
        run: python3 scripts/ci/reuse_release_product.py key build-universal

      - name: Restore exact unsigned Release product
        id: restore-release-product
        env:
          GH_TOKEN: ${{ github.token }}
          CMUX_RELEASE_ARCHS: ${{ needs.swift-package-tests.outputs.release_archs }}
          CMUX_RELEASE_GHOSTTY_HELPER_SHA256: ${{ needs.swift-package-tests.outputs.ghostty_helper_sha256 }}
          CMUX_RELEASE_GHOSTTY_HELPER_TOOLCHAIN_SHA256: ${{ needs.swift-package-tests.outputs.ghostty_helper_toolchain_sha256 }}
          CMUX_RELEASE_GHOSTTY_HELPER_SDK: ${{ needs.swift-package-tests.outputs.ghostty_helper_sdk }}
          CMUX_RELEASE_TUI_COMMIT: ${{ steps.release-tui.outputs.commit }}
          CMUX_RELEASE_TUI_MANIFEST_SHA256: ${{ steps.release-tui.outputs.manifest_sha256 }}
        run: python3 scripts/ci/reuse_release_product.py restore build-universal

      - name: Report Release restore decision
        run: |
          echo "Release product restore: ${{ steps.restore-release-product.outputs.outcome }} (${{ steps.restore-release-product.outputs.reason }})"
          echo "Release product restore seconds: ${{ steps.restore-release-product.outputs.restore_seconds }}"

      - name: Compute Xcode compilation cache key
        if: steps.restore-release-product.outputs.hit != 'true'
        id: compilation-cache-key
        run: |
          set -euo pipefail
          echo "toolchain=$(xcodebuild -version | shasum -a 256 | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Capture Ghostty revision
        if: steps.restore-release-product.outputs.hit != 'true'
        id: ghostty-revision
        run: |
          echo "sha=$(git -C ghostty rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache GhosttyKit.xcframework
        if: steps.restore-release-product.outputs.hit != 'true'
        id: cache-ghosttykit-release
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: GhosttyKit.xcframework
          key: ghosttykit-sentry-off-v1-${{ steps.ghostty-revision.outputs.sha }}

      - name: Download pre-built GhosttyKit.xcframework
        if: steps.restore-release-product.outputs.hit != 'true' && steps.cache-ghosttykit-release.outputs.cache-hit != 'true'
        run: ./scripts/download-prebuilt-ghosttykit.sh

      - name: Cache Xcode compilation results
        if: steps.restore-release-product.outputs.hit != 'true'
        uses: ./.github/actions/cache-restore
        with:
          backend: ${{ inputs.cache_backend != 'default' && inputs.cache_backend || vars.CI_CACHE_BACKEND || 'r2' }}
          path: build-universal/CompilationCache.noindex
          key: xcode-compilation-release-${{ runner.os }}-${{ runner.arch }}-${{ steps.compilation-cache-key.outputs.toolchain }}-${{ github.event.pull_request.base.sha || github.sha }}
          restore-keys: |
            xcode-compilation-release-${{ runner.os }}-${{ runner.arch }}-${{ steps.compilation-cache-key.outputs.toolchain }}-

      - name: Cache Swift packages
        if: steps.restore-release-product.outputs.hit != 'true'
        uses: ./.github/actions/cache-restore
        with:
          backend: ${{ inputs.cache_backend != 'default' && inputs.cache_backend || vars.CI_CACHE_BACKEND || 'r2' }}
          path: .spm-cache
          key: spm-${{ hashFiles('cmux.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'scripts/ci/swiftpm-cache-layout') }}
          restore-keys: spm-

      - name: Sanitize Swift package cache
        if: steps.restore-release-product.outputs.hit != 'true'
        run: python3 scripts/ci/sanitize-xcode-source-packages-cache.py .spm-cache

      - name: Build app (Release)
        id: build-release
        if: steps.restore-release-product.outputs.hit != 'true'
        env:
          RELEASE_ARCHS: ${{ needs.swift-package-tests.outputs.release_archs }}
        run: |
          set -euo pipefail
          case "$RELEASE_ARCHS" in
            arm64|"arm64 x86_64") ;;
            *) echo "missing or invalid producer architectures: $RELEASE_ARCHS" >&2; exit 1 ;;
          esac
          started="$(date +%s)"
          CMUX_SKIP_ZIG_BUILD=1 xcodebuild -project cmux.xcodeproj -scheme cmux -configuration Release -derivedDataPath build-universal \
            -destination 'generic/platform=macOS' \
            -clonedSourcePackagesDirPath .spm-cache \
            -packageCachePath "$PWD/.spm-cache/.package-cache" \
            ARCHS="$RELEASE_ARCHS" \
            ONLY_ACTIVE_ARCH=NO \
            COMPILATION_CACHE_ENABLE_CACHING=YES \
            COMPILATION_CACHE_LIMIT_SIZE=3221225472 \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO ASSETCATALOG_COMPILER_APPICON_NAME=AppIcon-Nightly build
          ended="$(date +%s)"
          echo "compile_seconds=$((ended - started))" >> "$GITHUB_OUTPUT"

      - name: Download Release Ghostty CLI helper
        if: steps.restore-release-product.outputs.hit != 'true'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: cmux-ghostty-cli-helper
          path: ghostty-cli-helper

      - name: Install Release helpers
        if: steps.restore-release-product.outputs.hit != 'true'
        env:
          RELEASE_ARCHS: ${{ needs.swift-package-tests.outputs.release_archs }}
          GH_TOKEN: ${{ github.token }}
          CMUX_TUI_COMMIT: ${{ steps.release-tui.outputs.commit }}
          CMUX_TUI_MANIFEST_URL: ${{ steps.release-tui.outputs.manifest_url }}
        run: |
          set -euo pipefail
          ./scripts/install-prebuilt-ghostty-cli-helper.sh \
            ghostty-cli-helper/ghostty \
            build-universal/Build/Products/Release/cmux.app --archs "$RELEASE_ARCHS"
          case "$RELEASE_ARCHS" in
            arm64) client_arch=arm64 ;;
            "arm64 x86_64") client_arch=universal ;;
            *) echo "unsupported Release client architectures: $RELEASE_ARCHS" >&2; exit 1 ;;
          esac
          ./scripts/install-cmux-tui-client.sh build-universal/Build/Products/Release/cmux.app \
            --manifest-url "$CMUX_TUI_MANIFEST_URL" \
            --expected-commit "$CMUX_TUI_COMMIT" \
            --arch "$client_arch"

      # This validator is deliberately shared by the fresh and restored paths.
      # It validates current-run helper identity plus the existing architecture,
      # SDK, codesign, and diff-sidecar Release contract.
      - name: Validate Release artifact slices
        id: validate-release
        env:
          RELEASE_ARCHS: ${{ needs.swift-package-tests.outputs.release_archs }}
          EXPECTED_GHOSTTY_SHA256: ${{ needs.swift-package-tests.outputs.ghostty_helper_sha256 }}
        run: |
          set -euo pipefail
          started="$(date +%s)"
          APP_BINARY="build-universal/Build/Products/Release/cmux.app/Contents/MacOS/cmux"
          CLI_BINARY="build-universal/Build/Products/Release/cmux.app/Contents/Resources/bin/cmux"
          HELPER_BINARY="build-universal/Build/Products/Release/cmux.app/Contents/Resources/bin/ghostty"
          CMUX_CUA_BINARY="build-universal/Build/Products/Release/cmux.app/Contents/Resources/bin/cmux-cua"
          DIFF_SIDECAR="build-universal/Build/Products/Release/cmux.app/Contents/Resources/bin/cmux-diff-sidecar"
          test -x "$APP_BINARY"
          test -x "$CLI_BINARY"
          TUI_CLIENT="build-universal/Build/Products/Release/cmux.app/Contents/Resources/bin/cmux-tui"
          test -x "$TUI_CLIENT"
          test -x "$HELPER_BINARY"
          test -x "$CMUX_CUA_BINARY"
          test -x "$DIFF_SIDECAR"
          file "$APP_BINARY" "$CLI_BINARY" "$HELPER_BINARY" "$CMUX_CUA_BINARY" "$DIFF_SIDECAR"
          SDK_VERSION="$(otool -l "$APP_BINARY" | awk '/LC_BUILD_VERSION/ { in_version=1; next } in_version && /sdk / { print $2; exit }')"
          echo "App SDK version: $SDK_VERSION"
          ./scripts/ci/verify-binary-archs.sh "$RELEASE_ARCHS" "$APP_BINARY" "$CLI_BINARY" "$CMUX_CUA_BINARY" "$HELPER_BINARY" "$TUI_CLIENT"
          test "$(shasum -a 256 "$HELPER_BINARY" | awk '{print $1}')" = "$EXPECTED_GHOSTTY_SHA256"
          codesign --verify --strict --verbose=4 "$CMUX_CUA_BINARY"
          ./scripts/verify-diff-sidecar-artifact.sh "$DIFF_SIDECAR" --archs "$RELEASE_ARCHS"
          [[ "$SDK_VERSION" == 26.* ]]
          ended="$(date +%s)"
          echo "validation_seconds=$((ended - started))" >> "$GITHUB_OUTPUT"

      - name: Seal exact unsigned Release product
        if: steps.restore-release-product.outputs.hit != 'true' && !startsWith(steps.release-product-key.outputs.key, 'unavailable-')
        env:
          CMUX_RELEASE_ARCHS: ${{ needs.swift-package-tests.outputs.release_archs }}
          CMUX_RELEASE_GHOSTTY_HELPER_SHA256: ${{ needs.swift-package-tests.outputs.ghostty_helper_sha256 }}
          CMUX_RELEASE_GHOSTTY_HELPER_TOOLCHAIN_SHA256: ${{ needs.swift-package-tests.outputs.ghostty_helper_toolchain_sha256 }}
          CMUX_RELEASE_GHOSTTY_HELPER_SDK: ${{ needs.swift-package-tests.outputs.ghostty_helper_sdk }}
          CMUX_RELEASE_TUI_COMMIT: ${{ steps.release-tui.outputs.commit }}
          CMUX_RELEASE_TUI_MANIFEST_SHA256: ${{ steps.release-tui.outputs.manifest_sha256 }}
        run: python3 scripts/ci/reuse_release_product.py seal build-universal

      - name: Package exact unsigned Release product
        if: steps.restore-release-product.outputs.hit != 'true' && !startsWith(steps.release-product-key.outputs.key, 'unavailable-')
        run: python3 scripts/ci/reuse_release_product.py pack build-universal "$RUNNER_TEMP/cmux-release-product.tar.gz"

      - name: Upload exact unsigned Release product
        id: upload-release-product
        if: steps.restore-release-product.outputs.hit != 'true' && !startsWith(steps.release-product-key.outputs.key, 'unavailable-')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-products-v1-${{ steps.release-product-key.outputs.key }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cmux-release-product.tar.gz
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

      - name: Emit Release product reuse receipt
        id: release-product-receipt
        if: always()
        env:
          PRODUCT_KEY: ${{ steps.release-product-key.outputs.key }}
          RESTORE_HIT: ${{ steps.restore-release-product.outputs.hit }}
          RESTORE_OUTCOME: ${{ steps.restore-release-product.outputs.outcome }}
          RESTORE_REASON: ${{ steps.restore-release-product.outputs.reason }}
          RESTORE_SECONDS: ${{ steps.restore-release-product.outputs.restore_seconds }}
          PRODUCER_RUN_ID: ${{ steps.restore-release-product.outputs.producer_run_id }}
          PRODUCER_RUN_ATTEMPT: ${{ steps.restore-release-product.outputs.producer_run_attempt }}
          PRODUCER_URL: ${{ steps.restore-release-product.outputs.producer_url }}
          PRODUCER_ARTIFACT_ID: ${{ steps.restore-release-product.outputs.artifact_id }}
          BUILD_STEP_OUTCOME: ${{ steps.build-release.outcome }}
          COMPILE_SECONDS: ${{ steps.build-release.outputs.compile_seconds }}
          VALIDATION_STEP_OUTCOME: ${{ steps.validate-release.outcome }}
          VALIDATION_SECONDS: ${{ steps.validate-release.outputs.validation_seconds }}
          UPLOAD_STEP_OUTCOME: ${{ steps.upload-release-product.outcome }}
          UPLOAD_ARTIFACT_ID: ${{ steps.upload-release-product.outputs.artifact-id }}
          RELEASE_ARCHS: ${{ needs.swift-package-tests.outputs.release_archs }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          restore = os.environ.get("RESTORE_OUTCOME", "") or "fallback_rebuild"
          events = []
          if restore == "exact_restore":
              events.append("exact_restore")
          elif restore == "restore_miss":
              events.append("restore_miss")
          else:
              events.append("fallback_rebuild")
          build = os.environ.get("BUILD_STEP_OUTCOME", "")
          if build == "success":
              events.append("fresh_compile")
          route = "github_artifact" if restore == "exact_restore" else (
              "github_artifact_publish" if os.environ.get("UPLOAD_STEP_OUTCOME") == "success" else "local_compile"
          )
          receipt = {
              "schema_version": 1,
              "events": events,
              "fingerprint": os.environ.get("PRODUCT_KEY", ""),
              "route": route,
              "restore": {
                  "outcome": restore,
                  "reason": os.environ.get("RESTORE_REASON", ""),
                  "seconds": os.environ.get("RESTORE_SECONDS", ""),
              },
              "producer": {
                  "run_id": os.environ.get("PRODUCER_RUN_ID", ""),
                  "run_attempt": os.environ.get("PRODUCER_RUN_ATTEMPT", ""),
                  "url": os.environ.get("PRODUCER_URL", ""),
                  "artifact_id": os.environ.get("PRODUCER_ARTIFACT_ID", ""),
              },
              "consumer": {
                  "run_id": os.environ.get("GITHUB_RUN_ID", ""),
                  "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT", ""),
                  "revision": os.environ.get("GITHUB_SHA", ""),
                  "release_architectures": os.environ.get("RELEASE_ARCHS", ""),
              },
              "compile": {
                  "outcome": build,
                  "seconds": os.environ.get("COMPILE_SECONDS", ""),
              },
              "validation": {
                  "outcome": os.environ.get("VALIDATION_STEP_OUTCOME", ""),
                  "seconds": os.environ.get("VALIDATION_SECONDS", ""),
              },
              "published_artifact_id": os.environ.get("UPLOAD_ARTIFACT_ID", ""),
          }
          path = Path(os.environ["RUNNER_TEMP"]) / "release-product-reuse-receipt.json"
          path.write_text(json.dumps(receipt, indent=2, sort_keys=True) + "\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("### Release product reuse\n")
              summary.write(f"- events: {', '.join(events)}\n")
              summary.write(f"- route: {route}\n")
              summary.write(f"- restore: {restore} ({receipt['restore']['reason']}) in {receipt['restore']['seconds']}s\n")
              summary.write(f"- compile: {build or 'skipped'} in {receipt['compile']['seconds'] or '0'}s\n")
              summary.write(f"- validation: {receipt['validation']['outcome'] or 'skipped'} in {receipt['validation']['seconds'] or '0'}s\n")
              if receipt["producer"]["url"]:
                  summary.write(f"- producer: {receipt['producer']['url']} attempt {receipt['producer']['run_attempt']} artifact {receipt['producer']['artifact_id']}\n")
          PY

      - name: Upload Release product reuse receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-product-reuse-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-product-reuse-receipt.json
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0

  macos-status:
    name: macOS status
    needs:
      - macos-compile-admission
      - app-host-unit-tests
      - cli-product-tests
      - swift-package-tests
      - tests-build-and-lag
      - release-admission
      - release-build
    if: ${{ always() }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 5
    steps:
      - name: Check routed macOS jobs
        env:
          MACOS_INPUTS: ${{ toJSON(inputs) }}
          MACOS_NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          inputs = json.loads(os.environ["MACOS_INPUTS"])
          needs = json.loads(os.environ["MACOS_NEEDS"])
          # The caller leaves compile_admitted unset when its build-input reuse
          # steps are skipped (full suite or unit-ci) or fail; unset means "compile", the
          # same reading the macos-compile-admission job condition uses.
          if inputs.get("compile_admitted") == "":
              inputs["compile_admitted"] = "false"
          inputs.setdefault("cli", "false")
          # A caller that predates the swift_packages input leaves it unset or
          # empty, which reads as "the package lane was not separately routed".
          if inputs.get("swift_packages", "") == "":
              inputs["swift_packages"] = "false"
          for route in ("macos", "cli", "full_suite", "compile_admitted", "release_build", "swift_packages"):
              if inputs.get(route) not in {"true", "false"}:
                  print(f"invalid route {route}={inputs.get(route)!r}", file=sys.stderr)
                  sys.exit(1)

          macos = inputs["macos"] == "true"
          full_suite = inputs["full_suite"] == "true"
          cli = inputs["cli"] == "true"
          # The package lane is routed from changed paths, so it is required
          # whenever the router selected it even under the compile-only suite.
          swift_packages = inputs["swift_packages"] == "true"
          # `unit-ci` asks for app-host unit tests without the full suite, and
          # clears suite-coverage on the strength of them, so a skip here must
          # fail rather than read as a job nobody routed. Empty or missing
          # means a caller that predates the input.
          unit_suite = inputs.get("unit_suite", "") == "true"
          # A changed-suites run compile admission runs itself replaces the
          # separate worker, so admission's success is what proves the tests.
          in_admission = inputs.get("unit_in_admission", "") == "true"
          required = {
              "macos-compile-admission": (macos or cli) and (inputs["compile_admitted"] != "true" or full_suite or cli or in_admission),
              "app-host-unit-tests": macos and (full_suite or unit_suite) and not in_admission,
              "cli-product-tests": cli or (macos and full_suite),
              "swift-package-tests": (macos and full_suite) or swift_packages,
              "tests-build-and-lag": macos and full_suite,
              "release-admission": macos and full_suite and inputs["release_build"] == "true",
              "release-build": macos and full_suite and inputs["release_build"] == "true",
          }
          bad = {}
          for job, wanted in sorted(required.items()):
              result = needs[job]["result"]
              if wanted and result != "success":
                  bad[job] = result
              elif not wanted and result not in {"success", "skipped"}:
                  bad[job] = result
          if bad:
              for job, result in bad.items():
                  detail = ""
                  if job == "macos-compile-admission":
                      # Only set when admission ran the changed suites.
                      suites = needs[job].get("outputs", {}).get("changed_suites", "")
                      if suites == "failure":
                          detail = " (the product compiled and uploaded; the changed suites failed)"
                      elif suites in {"", "skipped"} and in_admission:
                          detail = " (before the changed suites ran)"
                  print(f"{job}: {result}{detail}", file=sys.stderr)
              sys.exit(1)
          for job, wanted in sorted(required.items()):
              print(f"{job}: required={str(wanted).lower()} result={needs[job]['result']}")
          PY
