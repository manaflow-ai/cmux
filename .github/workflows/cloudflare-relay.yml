name: Cloudflare relay

# The Durable Object relay under cmux-tui/relays/cloudflare-do is verified here,
# on the pull request that changes it.
#
# It used to be a job inside cmux-tui-build-package.yml behind a
# `build_cloudflare_relay` input that defaulted to true. Four of the five callers
# passed false, so in practice the only run that ever executed it was
# relay-publish-npm.yml -- a publishing run. That put the verification in the
# worst possible place twice over: it never ran when the relay changed, only when
# something shipped; and because `publish` needs `build-package`, a red relay job
# blocked the cmux-relay publish. `npm audit --audit-level=high` and
# `cargo clippy -- -D warnings` both go red on a third-party advisory or a new
# lint with no change to this repository at all, so an unrelated upstream event
# could stop a release.
on:
  pull_request:
    paths:
      - cmux-tui/relays/cloudflare-do/**
      - .github/actions/setup-cmux-tui-rust/**
      - .github/actions/runner-cargo-home/**
      - .github/workflows/cloudflare-relay.yml
  push:
    branches:
      - main
    paths:
      - cmux-tui/relays/cloudflare-do/**
      - .github/actions/setup-cmux-tui-rust/**
      - .github/actions/runner-cargo-home/**
      - .github/workflows/cloudflare-relay.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-relay-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Temporary REST budget attribution: one gh-call line per GitHub API call (scripts/ci/api_call_log/env.sh, fetched at a fixed commit when the checkout has no copy).
  BASH_ENV: '$({ w="${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh"; t="${RUNNER_TEMP:-/nonexistent}/api-call-log-src"; if [ -f "$w" ]; then echo "$w"; elif [ -n "${RUNNER_TEMP:-}" ]; then if [ ! -f "$t/env.sh" ] && [ ! -e "$t.tried" ] && { [ "${RUNNER_OS:-}" = Linux ] || [ "${RUNNER_OS:-}" = macOS ]; } && [ "$(date -u +%Y%m%d%H)" -lt 2026112300 ]; then : > "$t.tried"; mkdir -p "$t.part" && for x in env.sh gh sitecustomize.py isolated.py; do curl -fsSL --max-time 5 -o "$t.part/$x" "https://raw.githubusercontent.com/manaflow-ai/cmux/27647ffd3ae838c63be28ca3e5883dcd68c34518/scripts/ci/api_call_log/$x" || break; done; [ -s "$t.part/isolated.py" ] && mv "$t.part" "$t"; fi; if [ -f "$t/env.sh" ]; then echo "$t/env.sh"; else echo unset BASH_ENV > "$t.off.sh" && echo "$t.off.sh"; fi; fi; } 2>/dev/null)'

jobs:
  cloudflare-relay:
    name: Cloudflare Durable Object relay
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || vars.CI_OVERFLOW_LINUX || 'cmux-linux' }}
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: cmux-tui/relays/cloudflare-do
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22.14.0"

      - name: Cache the npm cache
        if: ${{ (github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && github.event_name != 'merge_group' && contains(fromJSON('["refs/heads/main","refs/heads/feat-cmux-next","refs/heads/nightly-next"]'), github.ref)) }}
        continue-on-error: true
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.npm
          key: npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('cmux-tui/relays/cloudflare-do/package-lock.json') }}

      - name: Cache the npm cache (restore only off base branches)
        if: ${{ !(github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && github.event_name != 'merge_group' && contains(fromJSON('["refs/heads/main","refs/heads/feat-cmux-next","refs/heads/nightly-next"]'), github.ref)) }}
        continue-on-error: true
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.npm
          key: npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('cmux-tui/relays/cloudflare-do/package-lock.json') }}

      - name: Set up pinned Rust toolchain
        uses: ./.github/actions/setup-cmux-tui-rust

      # worker-build links openssl-sys; the persistent cmux-linux pool has no
      # OpenSSL headers unless a job installs them.
      - name: Install pinned Rust toolchain and Worker builder
        run: |
          if ! pkg-config --exists openssl 2>/dev/null; then
            sudo apt-get -o DPkg::Lock::Timeout=120 update
            sudo DEBIAN_FRONTEND=noninteractive apt-get -o DPkg::Lock::Timeout=120 install -y --no-install-recommends libssl-dev pkg-config
          fi
          rustup target add wasm32-unknown-unknown
          cargo install --locked worker-build@0.8.5

      - name: Install pinned npm dependencies
        run: npm ci --no-audit --no-fund

      - name: Test and lint relay
        run: |
          python3 tests/validate_wrangler_config.py
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings

      - name: Audit npm dependencies
        run: npm audit --audit-level=high

      - name: Build Worker
        run: npm run build

      - name: Validate Wrangler deployment bundle
        run: npx --no-install wrangler deploy --dry-run --outdir "$RUNNER_TEMP/cmux-cloudflare-relay"
