name: risk tier tests

# Unit tests for the risk classifier. Kept out of risk-tier.yml so a pull_request run never
# reports a skipped `risk evidence` check on the head commit.

on:
  pull_request:
    branches: [feat-cmux-next]
    paths:
      - scripts/ci/risk_tier.py
      - tests/test_risk_tier.py
      - tests/git_fixture_env.py
      - .github/workflows/risk-tier.yml
      - .github/workflows/risk-tier-tests.yml

permissions:
  contents: read

concurrency:
  group: risk-tier-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # Temporary REST budget attribution: one gh-call line per GitHub API call (scripts/ci/api_call_log/env.sh).
  BASH_ENV: ${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh

jobs:
  tests:
    name: risk tier tests
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-4vcpu-ubuntu-2404' || fromJSON(vars.RUNNER_POOLS).linux }} # read-only unit tests
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/ci/risk_tier.py
            tests/test_risk_tier.py
            tests/git_fixture_env.py
            .github/workflows/risk-tier.yml
          sparse-checkout-cone-mode: false
      - run: python3 tests/test_risk_tier.py -v
