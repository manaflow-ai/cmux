name: Labels sync

on:
  push:
    branches: [main]
    paths:
      - .github/labels.json
      - scripts/ci/sync_labels.py
      - .github/workflows/labels-sync.yml
  workflow_dispatch:

permissions:
  contents: read

# A pull request validates the manifest as the labels-manifest step of ci/steps.toml (pr-pipeline.yml).
# Push and dispatch runs write labels and keep one shared, never-cancelled group.
concurrency:
  group: labels-sync
  cancel-in-progress: false

env:
  # Temporary REST budget attribution: one gh-call line per GitHub API call (scripts/ci/api_call_log/env.sh).
  BASH_ENV: ${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh

jobs:
  apply:
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || contains(fromJSON('["blacksmith-2vcpu-ubuntu-2404","blacksmith-4vcpu-ubuntu-2404"]'), vars.CI_TRUSTED_RUNNER) && vars.CI_TRUSTED_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }} # ephemeral-required: trusted issue-write token; CI_TRUSTED_RUNNER picks the Blacksmith size
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Create or update the labels in the manifest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/ci/sync_labels.py
