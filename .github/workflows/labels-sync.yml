name: Labels sync

on:
  push:
    branches: [main]
    paths:
      - .github/labels.json
      - scripts/ci/sync_labels.py
      - .github/workflows/labels-sync.yml
  pull_request:
    paths:
      - .github/labels.json
      - scripts/ci/sync_labels.py
      - .github/workflows/labels-sync.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Pull request runs only validate the manifest, each in its own pull request's
  # group, and a newer push cancels the older one. Push and dispatch runs write
  # labels and keep the one shared, never-cancelled group.
  group: labels-sync${{ github.event_name == 'pull_request' && format('-pr-{0}', github.event.pull_request.number) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Temporary REST budget attribution: one gh-call line per GitHub API call (scripts/ci/api_call_log/env.sh).
  BASH_ENV: ${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != '' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || github.repository == 'manaflow-ai/cmux' && (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') || github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/')) && 'cmux-linux' || 'cmux-gcp-pr-control-jit-x64' }} # read-only PR manifest validation
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Check the manifest parses and fits GitHub's limits
        run: python3 scripts/ci/sync_labels.py --dry-run

  apply:
    if: github.event_name != 'pull_request'
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || 'cmux-gcp-pr-control-jit-x64' }} # ephemeral-required: trusted issue-write token
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Create or update the labels in the manifest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/ci/sync_labels.py
