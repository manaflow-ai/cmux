name: Cloud MVP Nightly readback

# The Auto/Cloud MVP read back in the app on a published cmux NEXT NIGHTLY, with a video and result.json
# (scripts/measure/cloud-mvp-nightly-readback.sh). The script records the screen with the fleet display pool's
# granted recorder, which no GitHub-hosted Mac has (run 45983121033: "cannot record", exit 3), so this job only
# drives the build fleet: on Linux it fetches the controller's client (.github/actions/fleet-client) and sends the
# script to a fleet display Mac with `--sign-in agent`. No fleet Mac holds the agent account: the client reads the
# production agent Stack pair from this job's environment (cmux-next-cloud-journey, limited to feat-cmux-next by
# GitHub's branch policy), signs in on this runner, seals the session to the leasing worker's key and revokes it
# when the step ends. Nothing secret is printed or uploaded.
# Leo, 2026-11-26: "austin was also really wanting to have a demo of the auto/hybrid cloud thing. and have it in
# the nightly. can we put our mvp in?"
#   gh workflow run cloud-mvp-nightly-readback.yml --ref feat-cmux-next -f build=4592220755201

on:
  push:
    branches: [feat-cmux-next]
    paths:
      - .github/workflows/cloud-mvp-nightly-readback.yml
  workflow_dispatch:
    inputs:
      build:
        description: "NIGHTLY build number (CFBundleVersion) to check; empty = the newest in the NEXT feed"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: cloud-mvp-nightly-readback-${{ inputs.build || github.run_id }}
  cancel-in-progress: false

jobs:
  readback:
    if: github.ref == 'refs/heads/feat-cmux-next' && github.repository == 'manaflow-ai/cmux' && vars.CI_EVAL_STEP_GATEWAY != ''
    environment:
      name: cmux-next-cloud-journey
      deployment: false
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || 'cmux-linux' }}
    timeout-minutes: 75
    steps:
      # Only the client action is checked out here. The display worker checks out this commit and runs the
      # script from it.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          sparse-checkout: .github/actions/fleet-client

      - uses: ./.github/actions/fleet-client
        with:
          controller: ${{ vars.CMUX_FLEET_CONTROLLER }}

      - name: Read the Cloud MVP back in the NIGHTLY on a display Mac
        id: readback
        env:
          BUILD: ${{ inputs.build }}
          REF_SHA: ${{ github.sha }}
          # The client's `--sign-in agent` account, and the Stack project a NIGHTLY signs in to (production;
          # scripts/cmux-next/dev-signin-token.py BACKENDS; a publishable key is public).
          CMUX_UITEST_STACK_EMAIL: ${{ secrets.CMUX_DOGFOOD_STACK_EMAIL }}
          CMUX_UITEST_STACK_PASSWORD: ${{ secrets.CMUX_DOGFOOD_STACK_PASSWORD }}
          CMUX_SIGNIN_STACK_PROJECT: 9790718f-14cd-4f7e-824d-eaf527a82b82
          CMUX_SIGNIN_STACK_CLIENT_KEY: pck_kzj80gx4mh2jrzn1cx6y5e8jk0kwa01vkevh2p9zd4twr
        run: |
          set -uo pipefail
          if [ -n "$BUILD" ] && ! printf '%s' "$BUILD" | grep -Eqx '[0-9]{1,20}'; then
            echo "::error::build must be a NIGHTLY build number (digits only)"
            exit 1
          fi
          if [ -z "$CMUX_UITEST_STACK_EMAIL" ] || [ -z "$CMUX_UITEST_STACK_PASSWORD" ]; then
            echo "::error::the production agent Stack pair is missing from this job's environment"
            exit 1
          fi
          client="${CMUX_CI_CLIENT:-$HOME/.local/bin/cmux-ci}"
          if ! [[ -x "$client" ]]; then
            echo "::error::$client is not installed on runner $RUNNER_NAME; nothing was read back."
            exit 1
          fi
          out="$RUNNER_TEMP/cloud-mvp-nightly-readback"
          mkdir -p "$out"
          args=()
          if [ -n "$BUILD" ]; then args+=("--arg=build=$BUILD"); fi
          status=0
          "$client" run --class exclusive --display --sign-in agent \
            --script scripts/measure/cloud-mvp-nightly-readback.sh --ref "$REF_SHA" --repo manaflow-ai/cmux \
            --key "cloud-mvp-readback-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" "${args[@]}" \
            --artifact .build/cloud-mvp-nightly-readback/report.tgz \
            --timeout 2400 --queue-timeout 1500 2>&1 | tee "$out/step.log" || status=${PIPESTATUS[0]}
          step="$(grep -o -E 'step [0-9a-f]{24}' "$out/step.log" | head -1 | cut -d' ' -f2)"
          if [[ "$status" == 75 && -n "$step" ]]; then
            # Not started within the queue wait: the step stays queued after the client stops waiting.
            "$client" cancel "$step" --reason "cloud MVP readback: no display Mac within 1500 s" || true
          fi
          if [[ -n "$step" ]]; then
            "$client" artifact "$step" "$out/report.tgz" || "$client" artifact --failed "$step" "$out/report.tgz" || true
          fi
          echo "fleet step ${step:-none} exited $status; report: $([[ -s "$out/report.tgz" ]] && echo returned || echo none)"
          grep -E '^(CMR |CLOUD_MVP_READBACK )' "$out/step.log" >> "$GITHUB_STEP_SUMMARY" || true
          case "$status" in
            0) echo "Cloud MVP readback passed (build ${BUILD:-newest})" >> "$GITHUB_STEP_SUMMARY" ;;
            1) echo "::error::Cloud MVP readback: a product step failed (exit 1)" ;;
            *) echo "::error::Cloud MVP readback: the rig could not run it (exit $status)" ;;
          esac
          exit "$status"

      - name: Upload the report (video and result.json)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cloud-mvp-nightly-readback
          path: ${{ runner.temp }}/cloud-mvp-nightly-readback
          if-no-files-found: warn
          retention-days: 7
