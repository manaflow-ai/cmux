name: private-names

# Fails a pull request whose title, body, added lines or file paths carry the name of a private project, before
# it merges. Such names reached merged pull requests and a CI script here and were taken out only afterwards
# (#57782). The list is not public: this job mints App read tokens for the private ops repository,
# fetches its checker (tools/agent-guards/private_names.py) and runs it on this pull request. The log says only
# where a match sits (title, body line, file:line), never what matched.
#
# pull_request, not pull_request_target: no code from the pull request runs (nothing is checked out), and a
# fork's run has no secrets, so a fork's pull request is skipped. edited reruns it when a title or body changes.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions: {}

concurrency:
  group: private-names-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    if: github.repository_owner == 'manaflow-ai' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: read
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || 'cmux-linux' }}
    # The checker fetch's wait (at most 240 s) and the checker's PRIVATE_NAMES_READ_BOUND_S (300 s), inside 10 minutes.
    timeout-minutes: 10
    steps:
      # cmux-bot's installation budget first: the routing App runs past its hourly cap and answers 403 then.
      - name: Mint the private checker read token (cmux-bot)
        id: bot-token
        if: vars.CMUX_BOT_APP_ID != ''
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.CMUX_BOT_APP_ID }}
          private-key: ${{ secrets.CMUX_BOT_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            cmuxterm-hq
            cmux
          permission-contents: read
          permission-pull-requests: read
      - name: Mint the private checker read token (routing App)
        id: route-token
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.GLAEDA_ROUTE_APP_ID }}
          private-key: ${{ secrets.GLAEDA_ROUTE_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            cmuxterm-hq
            cmux
          permission-contents: read
          permission-pull-requests: read
      - name: Check the pull request for private names
        env:
          BOT_TOKEN: ${{ steps.bot-token.outputs.token }}
          ROUTE_TOKEN: ${{ steps.route-token.outputs.token }}
          GH_TOKEN: ${{ github.token }}
          # The job token is shared by every run in this repo and runs out; the checker falls back to these.
          PR_READ_TOKENS: ${{ steps.bot-token.outputs.token }} ${{ steps.route-token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          # A read every token's budget refused waits for the soonest reset inside this bound, not a capped 60 s
          # that ends red for a rerun the next hour turns green (runs 45960905805, 45960538227: 3 of 3 tokens 403).
          PRIVATE_NAMES_READ_BOUND_S: '300'
          FETCH_WAIT_S: '240'
        run: |
          set -euo pipefail
          checker="$RUNNER_TEMP/private_names.py"
          url="https://api.github.com/repos/${GITHUB_REPOSITORY_OWNER}/cmuxterm-hq/contents/tools/agent-guards/private_names.py?ref=main"
          fetched=""
          # One round over both App tokens. A quota refusal (403/429 with x-ratelimit-remaining 0 or Retry-After)
          # records when that token's budget is back; the soonest one inside FETCH_WAIT_S gets one more round.
          fetch_round() {
            soonest=""
            for name in BOT_TOKEN ROUTE_TOKEN; do
              token="${!name}"
              [ -n "$token" ] || continue
              headers="$RUNNER_TEMP/checker.headers"
              code="$(curl -sS --retry 2 --max-time 60 -D "$headers" -o "$checker" -w '%{http_code}' \
                -H 'accept: application/vnd.github.raw' \
                -H @<(printf 'authorization: Bearer %s\n' "$token") "$url")" || code=000
              if [ "$code" = 200 ]; then
                fetched="$name"
                return 0
              fi
              if [ "$code" = 403 ] || [ "$code" = 429 ]; then
                lower="$(tr -d '\r' < "$headers" | tr '[:upper:]' '[:lower:]')"
                after="$(sed -n 's/^retry-after: *\([0-9][0-9]*\)$/\1/p' <<<"$lower" | tail -n 1)"
                reset="$(sed -n 's/^x-ratelimit-reset: *\([0-9][0-9]*\)$/\1/p' <<<"$lower" | tail -n 1)"
                at=""
                if [ -n "$after" ]; then at=$(( $(date +%s) + after ));
                elif grep -qx 'x-ratelimit-remaining: *0' <<<"$lower" && [ -n "$reset" ]; then at="$reset"; fi
                if [ -n "$at" ] && { [ -z "$soonest" ] || [ "$at" -lt "$soonest" ]; }; then soonest="$at"; fi
              fi
              echo "::notice::the checker fetch answered $code with $name"
            done
            return 1
          }
          if ! fetch_round && [ -n "$soonest" ]; then
            wait=$(( soonest - $(date +%s) + 5 ))
            [ "$wait" -ge 1 ] || wait=1
            if [ "$wait" -le "$FETCH_WAIT_S" ]; then
              echo "::notice::every App token's budget refused the checker fetch; fetching again in ${wait}s"
              sleep "$wait"
              fetch_round || true
            fi
          fi
          if [ -z "$fetched" ]; then
            echo "::error::private-names could not fetch its checker with either App token (rate limit or access); rerun this check"
            exit 1
          fi
          # The changed files' contents come from the head commit over git, which costs no REST quota; the
          # checker used to read each one through the contents API (one read per changed file, per push and
          # per title or body edit). The wrapper comes from the base commit, never the pull request's tree: no
          # code from the pull request runs here. A failed fetch leaves every file on the REST read, as before.
          # The remote is named pr-head, not origin: the pool's git shim gives a repository whose origin is cmux the
          # runner's mirror as an alternate and then runs its fetches without --depth or --filter. For these two
          # commits that fetch took about 2 minutes where a shallow blobless one takes seconds (job p50 12 s before
          # #61892, 131 s after; 263 runs in the 17:00Z hour, about 500 runner-minutes).
          gitdir="$RUNNER_TEMP/head.git"
          git init --quiet --bare "$gitdir"
          git -C "$gitdir" remote add pr-head "https://github.com/${GITHUB_REPOSITORY}.git"
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          wrapper="$RUNNER_TEMP/private_names_local.py"
          if [ -n "${HEAD_SHA:-}" ] && [ -n "${BASE_SHA:-}" ] \
              && git -C "$gitdir" -c "http.https://github.com/.extraheader=$auth" fetch --quiet --no-tags --depth=1 \
                --filter=blob:none pr-head "$HEAD_SHA" "$BASE_SHA" \
              && git -C "$gitdir" cat-file blob "$BASE_SHA:scripts/ci/private_names_local.py" > "$wrapper" 2>/dev/null; then
            python3 -I "$wrapper" "$checker" "$gitdir" "$HEAD_SHA" "$GITHUB_REPOSITORY" "$PR_NUMBER"
          else
            echo "::notice::no git read of the head commit (the fetch failed or the base has no wrapper yet); each file is read through the API"
            python3 -I "$checker" check-pr "$GITHUB_REPOSITORY" "$PR_NUMBER"
          fi
