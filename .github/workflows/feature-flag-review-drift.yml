name: Feature flag review drift

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: feature-flag-review-drift
  cancel-in-progress: false

env:
  # Temporary REST budget attribution: one gh-call line per GitHub API call (scripts/ci/api_call_log/env.sh, fetched at a fixed commit when the checkout has no copy).
  BASH_ENV: '$({ w="${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh"; t="${RUNNER_TEMP:-/nonexistent}/api-call-log-src"; if [ -f "$w" ]; then echo "$w"; elif [ -n "${RUNNER_TEMP:-}" ]; then if [ ! -f "$t/env.sh" ] && [ ! -e "$t.tried" ] && { [ "${RUNNER_OS:-}" = Linux ] || [ "${RUNNER_OS:-}" = macOS ]; } && [ "$(date -u +%Y%m%d%H)" -lt 2026112300 ]; then : > "$t.tried"; mkdir -p "$t.part" && for x in env.sh gh sitecustomize.py isolated.py; do curl -fsSL --max-time 5 -o "$t.part/$x" "https://raw.githubusercontent.com/manaflow-ai/cmux/27647ffd3ae838c63be28ca3e5883dcd68c34518/scripts/ci/api_call_log/$x" || break; done; [ -s "$t.part/isolated.py" ] && mv "$t.part" "$t"; fi; if [ -f "$t/env.sh" ]; then echo "$t/env.sh"; else echo unset BASH_ENV > "$t.off.sh" && echo "$t.off.sh"; fi; fi; } 2>/dev/null)'

jobs:
  report:
    permissions:
      contents: read
      issues: write
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || 'cmux-gcp-secret-jit-x64' }}
    timeout-minutes: 25
    env:
      # A scheduled job's GitHub API waits stop here and fail loud (scripts/ci/gh_budget_wait.sh).
      GH_BUDGET_WAIT_MAX_SECONDS: "900"
    steps:
      # This commit's GitHub API wait (scripts/ci/gh_budget_wait.sh): every later gh call, and
      # each github-script step that installs gh_budget_wait.cjs, waits through a rate limit or a
      # GitHub 5xx under the job's GH_BUDGET_WAIT_MAX_SECONDS, then fails loud.
      - name: Checkout the GitHub API wait
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: .gh-budget-tooling
          sparse-checkout: |
            scripts/ci/gh_budget_wait.sh
            scripts/ci/gh_budget_wait.cjs
          sparse-checkout-cone-mode: false
      - name: Wait through GitHub API rate limits and 5xx in this job
        working-directory: ${{ github.workspace }}
        run: bash .gh-budget-tooling/scripts/ci/gh_budget_wait.sh --install

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Report feature flag review dates
        run: python3 scripts/report-feature-flag-review-lead-time.py --json > feature-flag-review-report.json
      # Its report outlives an exhausted GITHUB_TOKEN: spare App tokens, then the reset (runs 45548650589 and
      # 45551813915 failed, and their report died on "API rate limit exceeded for installation"). Optional: a
      # ref without these files reports with the job token alone.
      - name: Check out the failure report tools
        continue-on-error: true
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 1
          path: .incident-report
          sparse-checkout: |
            /.github/actions/spare-issue-tokens/
            /scripts/ci/gh-spare
            /scripts/ci/incident_report.cjs
          sparse-checkout-cone-mode: false
      - name: Mint spare issue tokens
        id: spare
        continue-on-error: true
        uses: ./.incident-report/.github/actions/spare-issue-tokens
        with:
          bot-app-id: ${{ vars.CMUX_BOT_APP_ID }}
          bot-key: ${{ secrets.CMUX_BOT_APP_KEY }}
          route-app-id: ${{ vars.GLAEDA_ROUTE_APP_ID }}
          route-key: ${{ secrets.GLAEDA_ROUTE_APP_KEY }}
      - name: Open or update the review date issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          CMUX_BOT_TOKEN: ${{ steps.spare.outputs.cmux-bot }}
          ROUTE_TOKEN: ${{ steps.spare.outputs.glaeda-route }}
          HEAD_SHA: ${{ github.sha }}
        with:
          script: |
            // Every request outlives an exhausted GITHUB_TOKEN on the spare App tokens (scripts/ci/incident_report.cjs).
            try {
              require(`${process.env.GITHUB_WORKSPACE}/.incident-report/scripts/ci/incident_report.cjs`).arm(github, { core, getOctokit,
                spares: [{ name: 'cmux-bot', token: process.env.CMUX_BOT_TOKEN }, { name: 'glaeda-route', token: process.env.ROUTE_TOKEN }] });
            } catch (error) {
              core.warning(`incident_report.cjs is not here (${error.message}); reporting with the job token alone`);
            }
            if (process.env.GH_BUDGET_WAIT_JS) require(process.env.GH_BUDGET_WAIT_JS).install({ github, core });
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const label = 'feature-flag-review-drift';
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const open = await github.rest.issues.listForRepo({ owner, repo, labels: label, state: 'open', per_page: 1 });
            let report;
            try {
              report = JSON.parse(fs.readFileSync('feature-flag-review-report.json', 'utf8'));
              if (!Array.isArray(report)) {
                throw new Error(report?.error || 'expected a report array');
              }
            } catch (error) {
              const body = `The feature flag review report failed at ${process.env.HEAD_SHA} (${runUrl}): ${error.message}. Existing review warnings remain unresolved; this run cannot give an all-clear.`;
              core.warning(body);
              if (open.data.length > 0) {
                await github.rest.issues.createComment({ owner, repo, issue_number: open.data[0].number, body });
              } else {
                try {
                  await github.rest.issues.getLabel({ owner, repo, name: label });
                } catch (labelError) {
                  if (labelError.status !== 404) throw labelError;
                  await github.rest.issues.createLabel({ owner, repo, name: label, color: 'b60205', description: 'Feature flag review dates are approaching' });
                }
                await github.rest.issues.create({ owner, repo, title: 'Feature flag review report failed', labels: [label], body });
              }
              return;
            }
            if (report.length === 0) {
              if (open.data.length > 0) {
                const body = `No valid feature flag review dates are approaching or already expired (30-day lead time) as of ${process.env.HEAD_SHA} (${runUrl}). Malformed dates are checked by the feature flag linter.`;
                await github.rest.issues.createComment({ owner, repo, issue_number: open.data[0].number, body });
                await github.rest.issues.update({ owner, repo, issue_number: open.data[0].number, state: 'closed' });
              }
              return;
            }
            const mention = flag => flag.owner ? `@${flag.owner}` : 'no owner';
            const rows = report.map(flag => `| \`${flag.key}\` | \`${flag.source}\` | ${mention(flag)} | ${flag.reviewBy} | ${flag.daysRemaining} | ${flag.daysRemaining < 0 ? 'Already expired' : 'Approaching'} |`).join('\n');
            const body = `Feature flag review dates are approaching or already expired as of ${process.env.HEAD_SHA} (${runUrl}).\n\n| Key | Source file | Owner | reviewBy | Days remaining | Status |\n| --- | --- | --- | --- | ---: | --- |\n${rows}\n\nAn expired date is a warning in CI everywhere, and fails the feature flag linter only on a change that edits that flag's declaration. Review, remove, or consciously extend these flags. This issue is updated daily by the scheduled report.`;
            // Editing an issue body does not notify new mentions, so ping each
            // owner in a comment the first day their flag shows as expired.
            const previous = open.data.length > 0 ? (open.data[0].body || '') : null;
            const wasExpired = key => (previous || '').split('\n').some(line => line.startsWith(`| \`${key}\` |`) && line.includes('Already expired'));
            const newlyExpired = previous === null ? [] : report.filter(flag => flag.daysRemaining < 0 && !wasExpired(flag.key));
            try {
              await github.rest.issues.getLabel({ owner, repo, name: label });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.issues.createLabel({ owner, repo, name: label, color: 'b60205', description: 'Feature flag review dates are approaching' });
            }
            if (open.data.length > 0) {
              await github.rest.issues.update({ owner, repo, issue_number: open.data[0].number, body });
              if (newlyExpired.length > 0) {
                const lines = newlyExpired.map(flag => `- \`${flag.key}\` (reviewBy ${flag.reviewBy}): ${mention(flag)}`).join('\n');
                await github.rest.issues.createComment({ owner, repo, issue_number: open.data[0].number, body: `These feature flags passed their review date:\n\n${lines}\n\nRemove each flag or consciously extend its reviewBy date.` });
              }
            } else {
              await github.rest.issues.create({ owner, repo, title: 'Feature flag review dates are approaching', labels: [label], body });
            }
