name: Runnable link (staging)

# cmuxterm-hq#23807: a link that opens a working copy of a live project. Sets up a real project
# (clone, install, service running, an agent session on a canary credential) on a staging parent,
# mints a runnable link (cmux-platform POST /v1/runnable-links, or its parts where that is off),
# opens it --runs times (fork, running, first exec, scrub, usable) and times a fresh clone-and-setup
# baseline (scripts/cmux-next/runnable-link.ts). Staging only, the agent test account the Cloud
# journey uses; same-repo pull requests and a dispatch on feat-cmux-next only.

on:
  workflow_dispatch:
    inputs:
      runs:
        description: "Link opens to time (1 to 10)"
        default: "10"
      baseline:
        description: "Fresh clone-and-setup runs to time (0 to 10)"
        default: "3"
  pull_request:
    branches: [feat-cmux-next]
    paths:
      - scripts/cmux-next/runnable-link.ts
      - scripts/cmux-next/runnable-link.test.ts
      - .github/workflows/runnable-link.yml

permissions:
  contents: read

concurrency:
  group: runnable-link-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  measure:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/feat-cmux-next' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || fromJSON(vars.RUNNER_POOLS).linux_8 }}
    environment:
      name: cmux-next-vm-image-dev
      deployment: false
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: false
          sparse-checkout: scripts/cmux-next
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
      - name: Unit tests
        run: bun test scripts/cmux-next/runnable-link.test.ts
      - name: Runnable link on staging
        env:
          CMUX_DOGFOOD_STACK_EMAIL: ${{ secrets.CMUX_DOGFOOD_STACK_EMAIL }}
          CMUX_DOGFOOD_STACK_PASSWORD: ${{ secrets.CMUX_DOGFOOD_STACK_PASSWORD }}
          RUNS: ${{ inputs.runs || '10' }}
          BASELINE: ${{ inputs.baseline || '3' }}
        run: |
          set -o pipefail
          bun scripts/cmux-next/runnable-link.ts --backend staging --runs "$RUNS" --baseline "$BASELINE" --out "$RUNNER_TEMP/runnable-link.json"
      - name: Verdict in the summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/runnable-link.json" ]; then
            { echo '```json'; python3 -m json.tool "$RUNNER_TEMP/runnable-link.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: runnable-link-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/runnable-link.json
          if-no-files-found: warn
          retention-days: 7
