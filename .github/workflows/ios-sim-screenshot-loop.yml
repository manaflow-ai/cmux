# Pull-request simulator loop for iOS, fire and forget (Leo, 2026-11-27: "do we have any checks for ios
# visually interactively etc how much is manual how much can be audomated"; "make it fire and forget").
#
# Attempt 1 takes the owned side label (CI_PR_POOL_OWNED), a re-run vars.MACOS_RUNNER_26 or Blacksmith macOS;
# only a fork's run uses GitHub's macos-26 (tests/test_ci_no_github_hosted_macos.py, test_ci_paid_queue_pin.py). Build the app, boot an iPhone simulator, launch it and drive the chat
# composer keyboard (ComposerKeyboardPinUITests, both the Chief and the terminal composer) and the terminal
# keyboard (TerminalKeyboardNoResizeUITests: vim and a mock Claude Code screen, keyboard up and down five
# times) through XCUITest. Every XCTAttachment screenshot, a screen recording and the result bundle's test
# results are uploaded as the `ios-sim-screenshots` artifact. Same harness as ios-launch-tti-hosted.yml:
# scripts/ci/cmux-next-ios-sim.sh test ui=SUITE,SUITE video.
#
# Never blocking: the job is continue-on-error and not a required check. It reports in the step summary and
# the artifact; a red run is information, not a gate.
name: iOS simulator screenshot loop

on:
  pull_request:
    # labeled: the heavy-at-land rule on `loop` runs it on the event that adds ready-to-land (or full-ci).
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    paths:
      - cmux-next-ios/**
      - Packages/iOS/**
      - scripts/ci/cmux-next-ios-sim.sh
      - .github/workflows/ios-sim-screenshot-loop.yml
  # The post-merge batch tier (cmuxterm-hq docs/rfd/0023-ci-10x.md part 3; cmux-next-post-merge.yml, suite
  # ios-sim-screenshot-loop in .github/post-merge-batch.json): once a batch window at the merged tip, when the
  # commits since the last batch touched the paths above. The screenshots are that run's artifact.
  workflow_call:
    inputs:
      sha:
        description: "The commit to drive (the post-merge batch's tip or a bisect probe's commit). Empty: the event's own."
        type: string
        default: ""
      only:
        description: "The one job id to run (a bisect probe): loop. Empty: every job."
        type: string
        default: ""
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}${{ inputs.sha && format('-call-{0}', github.run_id) || '' }}${{ (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'feat-cmux-next' && (github.event.action == 'labeled' && !contains(fromJSON('["full-ci","ready-to-land"]'), github.event.label.name) || github.event.action == 'unlabeled') && format('-label-{0}', github.run_id)) || '' }}
  cancel-in-progress: true

jobs:
  loop:
    name: composer + terminal keyboard screenshots
    # Post-merge batch tier (cmuxterm-hq docs/rfd/0023-ci-10x.md: an advisory check, and a new check "starts in tier
    # B unless it shows a sole red"; Leo, 2026-11-21: "everything else runs once post-merge, batched"): on a pull
    # request into feat-cmux-next this runs only on the `labeled` event that adds full-ci, at that head; the land's
    # ready-to-land event no longer runs it, the post-merge batch (suite ios-sim-screenshot-loop) does. At land it was
    # 1,540 runner-min in 4 h (64 runs, 13Z..17Z 11-28, NOW ci_minutes), about 9.2k a day. Another base keeps the
    # heavy-at-land rule (ready-to-land or full-ci); CI_IOS_SIM_POST_MERGE=0 restores it here too, and
    # CI_HEAVY_AT_LAND=0 with it every push as before. Dispatch: as before.
    if: ${{ (inputs.only == '' || inputs.only == 'loop') && (github.event_name != 'pull_request' || (github.event.action == 'labeled' && contains(fromJSON('["full-ci","ready-to-land"]'), github.event.label.name) && (github.event.label.name == 'full-ci' || github.event.pull_request.base.ref != 'feat-cmux-next' || (vars.CI_IOS_SIM_POST_MERGE || '1') == '0')) || ((vars.CI_HEAVY_AT_LAND || '1') == '0' && github.event.action != 'labeled' && (github.event.pull_request.base.ref != 'feat-cmux-next' || (vars.CI_IOS_SIM_POST_MERGE || '1') == '0'))) && !(github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'feat-cmux-next' && (github.event.action == 'labeled' && !contains(fromJSON('["full-ci","ready-to-land"]'), github.event.label.name) || github.event.action == 'unlabeled')) }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-6vcpu-macos-26' || github.run_attempt == 1 && vars.CI_PR_POOL_OWNED == '1' && (vars.CI_LIGHT_LANE_RUNNER || (vars.CI_SIDE_LANE_LABELS != '' && fromJSON(vars.CI_SIDE_LANE_LABELS) || vars.CI_SIDE_LANE_RUNNER)) || vars.MACOS_RUNNER_26 || fromJSON(vars.RUNNER_POOLS).macos_26 }}
    continue-on-error: true
    # The hosted simulator build and both UI suites can exceed an hour. Keep the
    # fire-and-forget run alive long enough to produce its screenshots instead of
    # turning the informational check into a cancelled failure at 75 minutes.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ inputs.sha || '' }}

      # A fork's run is on GitHub's hosted macos-26 image, which has Xcode 26.6, not the pool pin (27.2); the
      # floor is 26. Every other run takes the pool pin from scripts/ci/xcode-pins.txt.
      - name: Select Xcode
        env:
          CMUX_CI_XCODE_APP: ${{ github.repository_owner != 'manaflow-ai' && '/Applications/Xcode_26.6.app' || '' }}
        run: |
          set -euo pipefail
          ./scripts/select-ci-xcode.sh
          echo "DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"

      - name: Set up pinned Rust
        uses: ./.github/actions/setup-cmux-tui-rust

      - name: Drive the composer and terminal keyboard (XCUITest)
        id: run
        continue-on-error: true
        env:
          JOBS: "4"
        run: |
          set -uo pipefail
          bash scripts/ci/cmux-next-ios-sim.sh test \
            ui=ComposerKeyboardPinUITests,TerminalKeyboardNoResizeUITests video
          rc=$?
          echo "status=$rc" >> "$GITHUB_OUTPUT"
          exit "$rc"

      - name: Summary
        if: ${{ !cancelled() }}
        env:
          STATUS: ${{ steps.run.outputs.status }}
        run: |
          {
            echo "### iOS simulator screenshot loop"
            echo
            echo "XCUITest exit status: ${STATUS:-none}. Not a required check; the screenshots are in the artifact."
            echo
            [ -f artifacts/ios-sim/SUMMARY.md ] && cat artifacts/ios-sim/SUMMARY.md
          } >> "$GITHUB_STEP_SUMMARY"
          find artifacts/ios-sim -name '*.png' 2>/dev/null | wc -l | xargs echo "screenshots:"

      - name: Upload screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-sim-screenshots
          path: |
            artifacts/ios-sim/screens/
            artifacts/ios-sim/*-attachments/
            artifacts/ios-sim/*-tests.json
            artifacts/ios-sim/*-console.txt
            artifacts/ios-sim/ui-video-small.mp4
            artifacts/ios-sim/ui-video.mp4
            artifacts/ios-sim/SUMMARY.md
            artifacts/ios-sim/ui-tests-failures.txt
          retention-days: 7
          if-no-files-found: warn
