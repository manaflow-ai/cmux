name: R2 upload tests

on:
  pull_request:
    paths:
      - .github/workflows/r2-upload-tests.yml
      - .github/workflows/nightly.yml
      - .github/workflows/release.yml
      - .github/workflows/cmux-tui-artifacts.yml
      - scripts/ci/publish-release-assets.py
      - scripts/ci/finalize-release.py
      - tests/test_github_release_publication.py
      - scripts/ci/upload-r2-object.py
      - tests/test_ci_r2_upload_python.sh
      - tests/test_r2_upload_requests.py
      - .github/workflows/cmux-tui-artifacts-retry.yml
      - scripts/ci/cmux_tui_artifacts_retry.py
      - tests/test_cmux_tui_artifacts_retry.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r2-upload-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Temporary REST budget attribution: one gh-call line per GitHub API call (scripts/ci/api_call_log/env.sh, fetched at a fixed commit when the checkout has no copy).
  BASH_ENV: '$({ w="${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh"; t="${RUNNER_TEMP:-/nonexistent}/api-call-log-src"; if [ -f "$w" ]; then echo "$w"; elif [ -n "${RUNNER_TEMP:-}" ]; then if [ ! -f "$t/env.sh" ] && [ ! -e "$t.tried" ] && { [ "${RUNNER_OS:-}" = Linux ] || [ "${RUNNER_OS:-}" = macOS ]; } && [ "$(date -u +%Y%m%d%H)" -lt 2026112300 ]; then : > "$t.tried"; mkdir -p "$t.part" && for x in env.sh gh sitecustomize.py isolated.py; do curl -fsSL --max-time 5 -o "$t.part/$x" "https://raw.githubusercontent.com/manaflow-ai/cmux/27647ffd3ae838c63be28ca3e5883dcd68c34518/scripts/ci/api_call_log/$x" || break; done; [ -s "$t.part/isolated.py" ] && mv "$t.part" "$t"; fi; if [ -f "$t/env.sh" ]; then echo "$t/env.sh"; else echo unset BASH_ENV > "$t.off.sh" && echo "$t.off.sh"; fi; fi; } 2>/dev/null)'

jobs:
  r2-upload-tests:
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || vars.CI_OVERFLOW_LINUX || 'cmux-linux' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - run: bash tests/test_ci_r2_upload_python.sh
      - run: python3 tests/test_github_release_publication.py
      # finalize-release.py runs only at real publish time; at least prove it loads.
      - run: python3 scripts/ci/finalize-release.py publish --help && python3 scripts/ci/finalize-release.py download --help && python3 scripts/ci/finalize-release.py adopt --help
      - run: python3 tests/test_cmux_tui_artifacts_retry.py
