name: R2 upload tests

on:
  pull_request:
    paths:
      - .github/workflows/r2-upload-tests.yml
      - .github/workflows/nightly.yml
      - .github/workflows/release.yml
      - .github/workflows/cmux-tui-artifacts.yml
      - scripts/ci/publish-release-assets.py
      - tests/test_github_release_publication.py
      - scripts/ci/upload-r2-object.py
      - tests/test_ci_r2_upload_python.sh
      - tests/test_r2_upload_requests.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r2-upload-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  r2-upload-tests:
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - run: bash tests/test_ci_r2_upload_python.sh
      - run: python3 tests/test_github_release_publication.py
