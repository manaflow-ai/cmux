name: PR status line

# Writes one line of a pull request's status comment (scripts/ci/pr_status.py) for a job
# that runs off GitHub: bead-autoclose.py (the bead it created) and hq's pr-preview (the
# preview link). Those jobs hold a person's token, so a comment they post shows as that
# person; a dispatch shows only in Actions, and the line lands as github-actions.
# Inputs are a pull request number and one validated value: `field` refuses anything that
# is not a bead id or a commit SHA, so a dispatch cannot put free text on a pull request.
# GitHub dispatches only a workflow on the default branch, so callers run it on main; the
# same file and script are on feat-cmux-next.
on:
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true
      bead:
        description: Bead id (cx-...) to show on the pull request
        required: false
        default: ""
      preview:
        description: Head SHA whose visual preview is in the private review feed
        required: false
        default: ""

permissions: {}

env:
  # Temporary REST budget attribution: one gh-call line per GitHub API call (scripts/ci/api_call_log/env.sh, fetched at a fixed commit when the checkout has no copy).
  BASH_ENV: '$({ w="${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh"; t="${RUNNER_TEMP:-/nonexistent}/api-call-log-src"; if [ -f "$w" ]; then echo "$w"; elif [ -n "${RUNNER_TEMP:-}" ]; then if [ ! -f "$t/env.sh" ] && [ ! -e "$t.tried" ] && { [ "${RUNNER_OS:-}" = Linux ] || [ "${RUNNER_OS:-}" = macOS ]; } && [ "$(date -u +%Y%m%d%H)" -lt 2026112300 ]; then : > "$t.tried"; mkdir -p "$t.part" && for x in env.sh gh sitecustomize.py isolated.py; do curl -fsSL --max-time 5 -o "$t.part/$x" "https://raw.githubusercontent.com/manaflow-ai/cmux/27647ffd3ae838c63be28ca3e5883dcd68c34518/scripts/ci/api_call_log/$x" || break; done; [ -s "$t.part/isolated.py" ] && mv "$t.part" "$t"; fi; if [ -f "$t/env.sh" ]; then echo "$t/env.sh"; else echo unset BASH_ENV > "$t.off.sh" && echo "$t.off.sh"; fi; fi; } 2>/dev/null)'

jobs:
  line:
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.CI_PR_CONTROL_SKIP_FLEET != '1' && 'cmux-gcp-pr-control-jit-x64' || contains(fromJSON('["blacksmith-2vcpu-ubuntu-2404","blacksmith-4vcpu-ubuntu-2404","blacksmith-8vcpu-ubuntu-2404","cmux-gcp-secret-jit-x64"]'), vars.CI_TRUSTED_RUNNER) && vars.CI_TRUSTED_RUNNER || 'blacksmith-2vcpu-ubuntu-2404' }} # ephemeral-required: write token; one comment edit, so the smallest trusted runner
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout the status script
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          sparse-checkout: scripts/ci/pr_status.py
          sparse-checkout-cone-mode: false

      - name: Write the line
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ inputs.pr }}
          BEAD: ${{ inputs.bead }}
          PREVIEW: ${{ inputs.preview }}
        run: |
          set -euo pipefail
          [[ "$PR" =~ ^[0-9]+$ ]] || { echo "::error::pr must be a number"; exit 2; }
          python3 scripts/ci/pr_status.py field --repo "$REPO" --pr "$PR" --bead "$BEAD" --preview "$PREVIEW"
