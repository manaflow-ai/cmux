# First connect on iOS (LaunchTTIUITests, warm, mock Mac) measured on a hosted macOS runner, before and
# after one change, with one harness: scripts/ci/cmux-next-ios-sim.sh test ui=LaunchTTIUITests, the
# harness goals/ios-release-bar-readback.json's first_connect names (cmuxterm-hq). Fleet simulator
# steps are off for this work, so this is the route that needs no owned Mac.
#
# Each leg checks out its ref, then both run one harness script: cmux-next-ios-sim.sh from HARNESS_REF
# (cmux#58989's fix for the cold-cache SwiftPM race that left a leg with no test run), so only the app
# under test differs between the legs. The warm suite runs each of its two flows (chat, terminal) 10 times: 20 samples of
# list_ms (process start to the workspaces list usable) per leg, the probe's first_connect samples.
name: iOS launch TTI (hosted)

on:
  pull_request:
    paths:
      - .github/workflows/ios-launch-tti-hosted.yml
  workflow_dispatch:
    inputs:
      before:
        description: Before ref (branch or SHA)
        required: false
        default: feat-cmux-next
      after:
        description: After ref (branch or SHA)
        required: false
        default: dec8a3407e923697df15d4a61d668852a747f2ff

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  measure:
    name: launch TTI (${{ matrix.leg }})
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'macos-26' || fromJSON(vars.RUNNER_POOLS).macos_26 }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: premain
            ref: 63240ca15f87fb8e14d42c2cfe94de700c0f04b2
            profile: "0"
            nomirror: "0"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ matrix.ref }}

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: 3281c18ad94f0e8ba5d8ddffeaa7ab5227c8015c
          path: .harness
          sparse-checkout: scripts/ci/cmux-next-ios-sim.sh
          sparse-checkout-cone-mode: false

      - name: One harness for both legs
        run: |
          set -euo pipefail
          cp .harness/scripts/ci/cmux-next-ios-sim.sh scripts/ci/cmux-next-ios-sim.sh
          rm -rf .harness
          echo "harness: scripts/ci/cmux-next-ios-sim.sh at 3281c18a (cmux#58989)"

      - name: Select Xcode
        run: |
          set -euo pipefail
          ./scripts/select-ci-xcode.sh
          echo "DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"

      - name: Set up pinned Rust
        uses: ./.github/actions/setup-cmux-tui-rust

      - name: LaunchTTIUITests (warm)
        id: run
        env:
          JOBS: "6"
          TEST_RUNNER_CMUX_MOBILE_LAUNCH_PROFILE: ${{ matrix.profile }}
          TEST_RUNNER_CMUX_MOBILE_LAUNCH_NO_LOG_MIRROR: ${{ matrix.nomirror }}
        run: |
          set -uo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          # xctrace aborts on this virtual Mac (run 45993228691), so /usr/bin/sample (task_for_pid,
          # no kperf) samples each launch's threads for 8 s from the moment the process exists.
          # No sampler this run: /usr/bin/sample at 1 ms stretched launches to 6-8 s (run 46025003942).
          S="$RUNNER_TEMP/samples"; mkdir -p "$S"; sampler=
          st=0; bash scripts/ci/cmux-next-ios-sim.sh test ui=LaunchTTIUITests || st=$?  # the step shell is bash -e (run 46005665118)
          echo "status=$st" >> "$GITHUB_OUTPUT"
          [ -z "$sampler" ] || kill "$sampler" 2>/dev/null
          ls -la "$S" | head -40
          mkdir -p artifacts/ios-sim; tar -czf artifacts/ios-sim/samples.tgz -C "$RUNNER_TEMP" samples
          grep -rhoI 'LAUNCHPROFILE {.*' artifacts/ios-sim --include='*.txt' | sort -u > artifacts/ios-sim/launch-profile.txt || true
          grep -rhoI 'LAUNCHENV .*' artifacts/ios-sim --include='*.txt' | sort -u > artifacts/ios-sim/launch-env.txt || true

      - name: Plain launches (no XCUITest)
        if: ${{ !cancelled() }}
        run: |
          # Splits pre-main: the warm suite's `main` mark sits 2.5-3.8 s after process start. The same
          # Demo app launched by simctl alone, 10 times, its own `timing launch NAME (Nms)` lines.
          set -uo pipefail
          app=$(find .build/ios-sim -path '*Demo-iphonesimulator/CmuxMobileApp.app' -maxdepth 6 | head -1)
          [ -n "$app" ] || { echo "no Demo app"; exit 0; }
          echo "app: $app"
          bid=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")
          rt=$(xcrun simctl list runtimes -j | python3 -c 'import json,sys; r=[x for x in json.load(sys.stdin)["runtimes"] if x["isAvailable"] and x["platform"]=="iOS"]; print(r[-1]["identifier"])')
          dt=$(xcrun simctl list devicetypes -j | python3 -c 'import json,sys; d=[x["identifier"] for x in json.load(sys.stdin)["devicetypes"] if "iPhone-1" in x["identifier"] or "iPhone-2" in x["identifier"]]; print(d[-1])')
          u=$(xcrun simctl create plain-launch "$dt" "$rt"); xcrun simctl boot "$u"; xcrun simctl bootstatus "$u" -b >/dev/null
          xcrun simctl install "$u" "$app"
          log=artifacts/ios-sim/plain-launch.log
          xcrun simctl spawn "$u" log stream --level info --style compact --predicate 'subsystem == "dev.cmux.mobile" AND category == "timing"' > "$log" 2>&1 &
          lp=$!; sleep 3
          for i in $(seq 10); do
            xcrun simctl launch "$u" "$bid" >/dev/null; sleep 12
            xcrun simctl terminate "$u" "$bid" >/dev/null 2>&1; sleep 2
          done
          kill "$lp" 2>/dev/null; xcrun simctl delete "$u" || true
          python3 - "$log" <<'PY'
          import re, sys, statistics as s
          runs = []; cur = {}
          for line in open(sys.argv[1]):
              m = re.search(r"timing launch (\w+) \((\d+)ms\)", line)
              if not m: continue
              if m[1] == "main" and cur: runs.append(cur); cur = {}
              cur[m[1]] = int(m[2])
          if cur: runs.append(cur)
          keys = ["main", "app_init", "did_finish_launching", "root_body", "first_frame", "first_idle"]
          print("PLAINLAUNCH n=%d " % len(runs) + " ".join(
              f"{k}={s.median([r[k] for r in runs if k in r]):.0f}" for k in keys if any(k in r for r in runs)))
          print("PLAINLAUNCH main_each=" + ",".join(str(r.get("main")) for r in runs))
          PY

      - name: Export the time-profile table
        if: ${{ !cancelled() }}
        run: |
          set -uo pipefail
          d=$(mktemp -d); ditto -x -k artifacts/ios-sim/ui-profile.trace.zip "$d" || exit 0
          t=$(find "$d" -maxdepth 2 -name '*.trace' | head -1)
          xcrun xctrace export --input "$t" --xpath '/trace-toc/run[@number="1"]/data/table[@schema="time-profile"]' --output "$d/table.xml"
          gzip -c "$d/table.xml" > artifacts/ios-sim/ui-time-profile.xml.gz; ls -la artifacts/ios-sim/

      - name: First connect p50/p90
        if: ${{ !cancelled() }}
        env:
          LEG: ${{ matrix.leg }}
          SHA: ${{ steps.run.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json, math, os, pathlib
          src = pathlib.Path("artifacts/ios-sim/launch-tti.jsonl")
          rows = [json.loads(l) for l in src.read_text().splitlines() if l.strip()] if src.exists() else []
          warm = [r for r in rows if r.get("phase") == "warm" and isinstance(r.get("list_ms"), (int, float))]
          samples = [round(r["list_ms"]) for r in warm]
          def rank(p):
              s = sorted(samples)
              return s[max(0, math.ceil(p / 100 * len(s)) - 1)] if s else None
          out = {"leg": os.environ["LEG"], "sha": os.environ["SHA"], "n": len(samples), "samples_ms": samples,
                 "p50_ms": rank(50), "p90_ms": rank(90), "runner": os.environ.get("RUNNER_NAME", ""),
                 "run_url": os.environ["RUN_URL"]}
          pathlib.Path("artifacts/ios-sim/first-connect.json").parent.mkdir(parents=True, exist_ok=True)
          pathlib.Path("artifacts/ios-sim/first-connect.json").write_text(json.dumps(out, indent=1) + "\n")
          print("FIRSTCONNECT " + json.dumps(out))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(f"### first connect ({out['leg']}, {out['sha'][:10]})\n\n")
              f.write(f"list_ms (process start to workspaces list usable), warm, n={out['n']}: "
                      f"p50 {out['p50_ms']} ms, p90 {out['p90_ms']} ms (nearest rank)\n\n")
              f.write(f"samples_ms: {samples}\n\n")
          PY
          if [ -f artifacts/ios-sim/SUMMARY.md ]; then cat artifacts/ios-sim/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Upload launch samples
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: launch-tti-${{ matrix.leg }}
          path: |
            artifacts/ios-sim/launch-tti.jsonl
            artifacts/ios-sim/first-connect.json
            artifacts/ios-sim/SUMMARY.md
            artifacts/ios-sim/ui-profile-summary.md
            artifacts/ios-sim/ui-profile-summary.json
            artifacts/ios-sim/ui-time-profile.xml.gz
            artifacts/ios-sim/samples.tgz
            artifacts/ios-sim/ui-tests-failures.txt
            artifacts/ios-sim/launch-tti-error.txt
            artifacts/ios-sim/launch-profile.txt
            artifacts/ios-sim/launch-env.txt
          retention-days: 3
          if-no-files-found: warn
