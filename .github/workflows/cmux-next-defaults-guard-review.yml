name: cmux-next defaults guard review

# A review on a feat-cmux-next pull request re-runs its latest `defaults guard`
# run (cmux-next-defaults-guard.yml, pull_request_target), which judges the
# approval from the base's guard with the reviews as they are now. This file
# decides nothing: a pull_request_review run uses the pull request's own copy
# of its workflow, so the verdict never comes from here (scripts/ci/defaults_guard.py
# lists an edit to this file as a default change). A fork's token is read-only:
# its review leaves the check for a maintainer or the next push to re-run.
on:
  pull_request_review:
    types: [submitted, dismissed, edited]

permissions: {}

concurrency:
  group: cmux-next-defaults-guard-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  rerun:
    if: ${{ github.event.pull_request.base.ref == 'feat-cmux-next' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || contains(fromJSON('["ubuntu-24.04","blacksmith-2vcpu-ubuntu-2404","blacksmith-4vcpu-ubuntu-2404"]'), vars.CI_TRUSTED_RUNNER) && vars.CI_TRUSTED_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }} # ephemeral-required: trusted actions-write token; CI_TRUSTED_RUNNER picks Blacksmith (default) or GitHub-hosted
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Re-run the trusted defaults guard
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          error_file="$(mktemp)"
          trap 'rm -f "$error_file"' EXIT
          if ! run_id="$(gh api "repos/$REPO/actions/workflows/cmux-next-defaults-guard.yml/runs?event=pull_request_target&head_sha=$HEAD_SHA&per_page=20" \
            --jq '.workflow_runs[0].id // empty' 2>"$error_file")"; then
            if grep -Eq 'HTTP 404|404 Not Found' "$error_file"; then
              echo "No defaults guard run on $HEAD_SHA yet; the runs endpoint returned 404."
              exit 0
            fi
            cat "$error_file" >&2
            exit 1
          fi
          if [[ -z "$run_id" ]]; then
            echo "No defaults guard run on $HEAD_SHA yet; it reads the reviews when it runs."
            exit 0
          fi
          # A run still going may have read the reviews before this one: let it finish, then re-run it.
          gh run watch "$run_id" --repo "$REPO" --interval 10 > /dev/null || true
          gh run rerun "$run_id" --repo "$REPO"
          echo "Re-ran defaults guard run $run_id for $HEAD_SHA."
