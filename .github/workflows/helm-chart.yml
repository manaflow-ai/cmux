name: helm chart

# The self-host Helm chart, deploy/helm/cmux-agent-host (RFD 0100 section 9, step 7): helm lint --strict with each
# ci/*-values.yaml, then the render tests (helm template only; no cluster).
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "deploy/helm/**"
      - ".github/workflows/helm-chart.yml"
  push:
    branches: [feat-cmux-next, main]
    paths:
      - "deploy/helm/**"
      - ".github/workflows/helm-chart.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: helm-chart-${{ github.ref }}
  cancel-in-progress: true

env:
  # Temporary REST budget attribution: one gh-call line per GitHub API call (scripts/ci/api_call_log/env.sh, fetched at a fixed commit when the checkout has no copy).
  BASH_ENV: '$({ w="${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh"; t="${RUNNER_TEMP:-/nonexistent}/api-call-log-src"; if [ -f "$w" ]; then echo "$w"; elif [ -n "${RUNNER_TEMP:-}" ]; then if [ ! -f "$t/env.sh" ] && [ ! -e "$t.tried" ] && { [ "${RUNNER_OS:-}" = Linux ] || [ "${RUNNER_OS:-}" = macOS ]; } && [ "$(date -u +%Y%m%d%H)" -lt 2026112300 ]; then : > "$t.tried"; mkdir -p "$t.part" && for x in env.sh gh sitecustomize.py isolated.py; do curl -fsSL --max-time 5 -o "$t.part/$x" "https://raw.githubusercontent.com/manaflow-ai/cmux/27647ffd3ae838c63be28ca3e5883dcd68c34518/scripts/ci/api_call_log/$x" || break; done; [ -s "$t.part/isolated.py" ] && mv "$t.part" "$t"; fi; if [ -f "$t/env.sh" ]; then echo "$t/env.sh"; else echo unset BASH_ENV > "$t.off.sh" && echo "$t.off.sh"; fi; fi; } 2>/dev/null)'
  HELM_VERSION: v3.16.3
  HELM_SHA256: f5355c79190951eed23c5432a3b920e071f4c00a64f75e077de0dd4cb7b294ea

jobs:
  lint-and-render:
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.CI_PR_CONTROL_SKIP_FLEET != '1' && 'cmux-gcp-pr-control-jit-x64' || contains(fromJSON('["blacksmith-2vcpu-ubuntu-2404","blacksmith-4vcpu-ubuntu-2404"]'), vars.CI_TRUSTED_RUNNER) && vars.CI_TRUSTED_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }} # ephemeral-required: chart PRs are untrusted input; CI_TRUSTED_RUNNER picks the Blacksmith size
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install helm (pinned, sha256-checked)
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/helm"
          mkdir -p "$dir"
          tgz="$dir/helm.tgz"
          curl -fsSL --retry 3 -o "$tgz" "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  $tgz" | sha256sum -c -
          tar -xzf "$tgz" -C "$dir" linux-amd64/helm
          echo "$dir/linux-amd64" >> "$GITHUB_PATH"

      - name: Install PyYAML if missing
        run: python3 -c 'import yaml' 2>/dev/null || python3 -m pip install --user --quiet pyyaml==6.0.2 || python3 -m pip install --user --quiet --break-system-packages pyyaml==6.0.2

      - name: helm lint --strict, every ci values file
        run: |
          set -euo pipefail
          helm version
          for chart in deploy/helm/*/; do
            for values in "$chart"ci/*-values.yaml; do
              helm lint --strict "$chart" -f "$values"
            done
          done

      - name: Render tests (helm template)
        run: python3 deploy/helm/cmux-agent-host/tests/render_test.py
