name: cmux-next post-merge batch

# The base's deferred checks run here on the clock, not once per merge (RFD 0023 in cmuxterm-hq;
# Leo 2026-11-21: "everything else runs once post-merge, batched"). main's
# cmux-next-post-merge-dispatch.yml ticks every 30 min and starts a batch run on the newest
# feat-cmux-next tip once a window (vars.NEXT_POST_MERGE_WINDOW_MINUTES, default 120) has passed
# since the last one and the tip is untested. A batch run calls every suite in
# .github/post-merge-batch.json whose paths the commits since the last batch run touched. A job red
# here and green on the last batch run where it ran starts a bisect: probe runs of that job alone,
# each dispatched by the one before, end on the first red commit, and the last probe opens its
# revert pull request through normal landing (never merged here). scripts/ci/post_merge_batch.py
# holds the logic; a push to a lane/post-merge-drill-* branch runs a batch there (the drill).
on:
  workflow_dispatch:
    inputs:
      mode:
        description: batch (every reached suite on the branch tip) or probe (one job at one commit).
        type: choice
        options: [batch, probe]
        default: batch
      reason:
        description: Why this batch run started (tick, manual).
        type: string
        default: manual
      suite:
        description: "probe: the suite key in .github/post-merge-batch.json."
        type: string
        default: ""
      job:
        description: "probe: the red job's full name in the batch run."
        type: string
        default: ""
      only:
        description: "probe: the job id the suite runs alone (empty: the whole suite)."
        type: string
        default: ""
      sha:
        description: "probe: the commit to test."
        type: string
        default: ""
      good:
        description: "probe: the newest commit known green."
        type: string
        default: ""
      bad:
        description: "probe: the oldest commit known red (empty: confirm the batch's red first)."
        type: string
        default: ""
      origin:
        description: "probe: the batch run that found the red."
        type: string
        default: ""
      tries:
        description: "probe: retries of this probe after a run with no verdict."
        type: string
        default: "0"
      pieces:
        description: "probe: hot swap out state (scripts/ci/piece_swap.py State); sha is then the culprit with some pieces swapped out."
        type: string
        default: ""
  push:
    branches:
      - lane/post-merge-drill-*

run-name: >-
  ${{ inputs.mode == 'probe'
      && format('probe {0} {1} at {2}', inputs.suite, inputs.only || 'all', inputs.sha)
      || format('batch {0}', inputs.reason || github.event_name) }}

permissions: {}

concurrency:
  # One batch run per branch at a time; probes queue per suite and job, never cancelled.
  group: cmux-next-post-merge-${{ github.ref_name }}-${{ inputs.mode == 'probe' && format('probe-{0}-{1}', inputs.suite, inputs.only) || 'batch' }}
  cancel-in-progress: false

env:
  # Temporary REST budget attribution: one gh-call line per GitHub API call (scripts/ci/api_call_log/env.sh, fetched at a fixed commit when the checkout has no copy).
  BASH_ENV: '$({ w="${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh"; t="${RUNNER_TEMP:-/nonexistent}/api-call-log-src"; if [ -f "$w" ]; then echo "$w"; elif [ -n "${RUNNER_TEMP:-}" ]; then if [ ! -f "$t/env.sh" ] && [ ! -e "$t.tried" ] && { [ "${RUNNER_OS:-}" = Linux ] || [ "${RUNNER_OS:-}" = macOS ]; } && [ "$(date -u +%Y%m%d%H)" -lt 2026112300 ]; then : > "$t.tried"; mkdir -p "$t.part" && for x in env.sh gh sitecustomize.py isolated.py; do curl -fsSL --max-time 5 -o "$t.part/$x" "https://raw.githubusercontent.com/manaflow-ai/cmux/27647ffd3ae838c63be28ca3e5883dcd68c34518/scripts/ci/api_call_log/$x" || break; done; [ -s "$t.part/isolated.py" ] && mv "$t.part" "$t"; fi; if [ -f "$t/env.sh" ]; then echo "$t/env.sh"; else echo unset BASH_ENV > "$t.off.sh" && echo "$t.off.sh"; fi; fi; } 2>/dev/null)'

jobs:
  plan:
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || 'cmux-linux' }}
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    outputs:
      suites: ${{ steps.plan.outputs.suites }}
      sha: ${{ steps.plan.outputs.sha }}
      only: ${{ steps.plan.outputs.only }}
    steps:
      # The checkout takes the tip only, and the next step fetches this ref's history and nothing else: fetching
      # every branch (32,106 of them on 2026-11-22) hung or lost the runner in plan jobs 137288423007,
      # 137313024795, 137322557043 and judge job 137302455752. Each step is bounded and tried once more.
      - id: checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        continue-on-error: true
        timeout-minutes: 5
        with:
          persist-credentials: false
      - name: Check out again
        if: steps.checkout.outcome != 'success'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        timeout-minutes: 5
        with:
          persist-credentials: false
      - name: Fetch this ref's history
        timeout-minutes: 4
        run: |
          for attempt in 1 2; do
            shallow=""; [ "$(git rev-parse --is-shallow-repository)" = true ] && shallow=--unshallow
            timeout 110 git fetch --quiet --no-tags --filter=blob:none $shallow origin "$(git rev-parse HEAD)" && exit 0
          done
          exit 1
      # Reads on the route App's own budget, not the GITHUB_TOKEN every workflow in the repository shares
      # (cmux-next-quality-report.yml does the same); the script falls back to GITHUB_TOKEN when it is spent.
      - name: Mint the read token
        id: read-token
        if: vars.GLAEDA_ROUTE_APP_ID != ''
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.GLAEDA_ROUTE_APP_ID }}
          private-key: ${{ secrets.GLAEDA_ROUTE_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-actions: read
          permission-contents: read
      - name: Plan the suites
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          GH_READ_TOKEN: ${{ steps.read-token.outputs.token }}
          MODE: ${{ inputs.mode || 'batch' }}
          SUITE: ${{ inputs.suite }}
          ONLY: ${{ inputs.only }}
          PROBE_SHA: ${{ inputs.sha }}
          BRANCH: ${{ github.ref_name }}
        run: |
          python3 scripts/ci/post_merge_batch.py plan --branch "$BRANCH" --mode "$MODE" --sha "$GITHUB_SHA" \
            --suite "$SUITE" --only "$ONLY" --probe-sha "$PROBE_SHA"

  # One caller job per suite in .github/post-merge-batch.json; its name is the suite key.
  drill:
    needs: plan
    if: contains(needs.plan.outputs.suites, ' drill ')
    uses: ./.github/workflows/post-merge-drill.yml
    with:
      sha: ${{ needs.plan.outputs.sha }}
      only: ${{ needs.plan.outputs.only }}
    permissions:
      contents: read

  cmux-tui-windows-check:
    needs: plan
    if: contains(needs.plan.outputs.suites, ' cmux-tui-windows-check ')
    uses: ./.github/workflows/cmux-tui-windows-check.yml
    with:
      sha: ${{ needs.plan.outputs.sha }}
      only: ${{ needs.plan.outputs.only }}
    permissions:
      contents: read

  acpmux-sim-sweep:
    needs: plan
    if: contains(needs.plan.outputs.suites, ' acpmux-sim-sweep ')
    uses: ./.github/workflows/acpmux-sim-sweep.yml
    with:
      sha: ${{ needs.plan.outputs.sha }}
      only: ${{ needs.plan.outputs.only }}
    permissions:
      contents: read

  swift-acpmux-protocol:
    needs: plan
    if: contains(needs.plan.outputs.suites, ' swift-acpmux-protocol ')
    uses: ./.github/workflows/swift-acpmux-protocol.yml
    with:
      sha: ${{ needs.plan.outputs.sha }}
      only: ${{ needs.plan.outputs.only }}
    permissions:
      contents: read

  rust-workspaces:
    needs: plan
    if: contains(needs.plan.outputs.suites, ' rust-workspaces ')
    uses: ./.github/workflows/rust-workspaces.yml
    with:
      sha: ${{ needs.plan.outputs.sha }}
      only: ${{ needs.plan.outputs.only }}
    permissions:
      actions: read
      contents: read

  web:
    needs: plan
    if: contains(needs.plan.outputs.suites, ' web ')
    uses: ./.github/workflows/ci-web.yml
    with:
      sha: ${{ needs.plan.outputs.sha }}
      only: ${{ needs.plan.outputs.only }}
    # actions: read: the base's webview test history and duration manifest are artifacts (ci-web.yml).
    permissions:
      contents: read
      actions: read

  tip-test-compile:
    needs: plan
    if: contains(needs.plan.outputs.suites, ' tip-test-compile ')
    uses: ./.github/workflows/cmux-next-tip-test-compile.yml
    with:
      sha: ${{ needs.plan.outputs.sha }}
      only: ${{ needs.plan.outputs.only }}
    permissions:
      actions: write
      contents: read
      issues: write

  judge:
    needs: [plan, drill, cmux-tui-windows-check, acpmux-sim-sweep, swift-acpmux-protocol, rust-workspaces, web, tip-test-compile]
    # A probe's judge also runs when its plan job died (a lost runner: drill-8 probe run 44980687386): it then
    # sees no verdict and dispatches the same probe again, so the bisect goes on instead of stopping.
    if: ${{ !cancelled() && (needs.plan.result == 'success' || inputs.mode == 'probe') }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || 'cmux-linux' }}
    timeout-minutes: 20
    permissions:
      actions: write
      contents: read
    outputs:
      culprit: ${{ steps.judge.outputs.culprit }}
      job: ${{ steps.judge.outputs.job }}
      good: ${{ steps.judge.outputs.good }}
      origin: ${{ steps.judge.outputs.origin }}
      pieces: ${{ steps.judge.outputs.pieces }}
      piece: ${{ steps.judge.outputs.piece }}
    steps:
      # The checkout takes the tip only, and the next step fetches this ref's history and nothing else: fetching
      # every branch (32,106 of them on 2026-11-22) hung or lost the runner in plan jobs 137288423007,
      # 137313024795, 137322557043 and judge job 137302455752. Each step is bounded and tried once more.
      - id: checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        continue-on-error: true
        timeout-minutes: 5
        with:
          persist-credentials: false
      - name: Check out again
        if: steps.checkout.outcome != 'success'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        timeout-minutes: 5
        with:
          persist-credentials: false
      - name: Fetch this ref's history
        timeout-minutes: 4
        run: |
          for attempt in 1 2; do
            shallow=""; [ "$(git rev-parse --is-shallow-repository)" = true ] && shallow=--unshallow
            timeout 110 git fetch --quiet --no-tags --filter=blob:none $shallow origin "$(git rev-parse HEAD)" && exit 0
          done
          exit 1
      # Reads on the route App's own budget, not the GITHUB_TOKEN every workflow in the repository shares
      # (cmux-next-quality-report.yml does the same); the script falls back to GITHUB_TOKEN when it is spent.
      - name: Mint the read token
        id: read-token
        if: vars.GLAEDA_ROUTE_APP_ID != ''
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.GLAEDA_ROUTE_APP_ID }}
          private-key: ${{ secrets.GLAEDA_ROUTE_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-actions: read
          permission-contents: read
      - name: Judge the run
        id: judge
        env:
          GH_TOKEN: ${{ github.token }}
          GH_READ_TOKEN: ${{ steps.read-token.outputs.token }}
          MODE: ${{ inputs.mode || 'batch' }}
          BRANCH: ${{ github.ref_name }}
          SUITE: ${{ inputs.suite }}
          JOB: ${{ inputs.job }}
          ONLY: ${{ inputs.only }}
          PROBE_SHA: ${{ inputs.sha }}
          GOOD: ${{ inputs.good }}
          BAD: ${{ inputs.bad }}
          ORIGIN: ${{ inputs.origin }}
          TRIES: ${{ inputs.tries }}
          PIECES: ${{ inputs.pieces }}
        run: |
          python3 scripts/ci/post_merge_batch.py judge --branch "$BRANCH" --mode "$MODE" --sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" --suite "$SUITE" --job "$JOB" --only "$ONLY" --probe-sha "$PROBE_SHA" \
            --good "$GOOD" --bad "$BAD" --origin "$ORIGIN" --tries "$TRIES" --pieces "$PIECES"

  revert:
    needs: judge
    if: ${{ !cancelled() && needs.judge.outputs.culprit != '' }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || 'cmux-linux' }}
    timeout-minutes: 25
    # The routing App's key lives in ci-routing-agent, which serves the base; a drill branch opens
    # its revert with GITHUB_TOKEN instead (that pull request starts no CI, which a drill needs not).
    environment: ${{ github.ref_name == 'feat-cmux-next' && 'ci-routing-agent' || '' }}
    # actions: write: hot swap out dispatches its piece probes (scripts/ci/piece_swap.py) with this job's token.
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      # The checkout takes the tip only, and the next step fetches this ref's history and nothing else: fetching
      # every branch (32,106 of them on 2026-11-22) hung or lost the runner in plan jobs 137288423007,
      # 137313024795, 137322557043 and judge job 137302455752. Each step is bounded and tried once more.
      - id: checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        continue-on-error: true
        timeout-minutes: 5
        with:
          persist-credentials: false
          ref: ${{ github.ref_name }}
      - name: Check out again
        if: steps.checkout.outcome != 'success'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        timeout-minutes: 5
        with:
          persist-credentials: false
          ref: ${{ github.ref_name }}
      - name: Fetch this ref's history
        timeout-minutes: 4
        run: |
          for attempt in 1 2; do
            shallow=""; [ "$(git rev-parse --is-shallow-repository)" = true ] && shallow=--unshallow
            timeout 110 git fetch --quiet --no-tags --filter=blob:none $shallow origin "$(git rev-parse HEAD)" && exit 0
          done
          exit 1
      # Reads on the route App's own budget, not the GITHUB_TOKEN every workflow in the repository shares
      # (cmux-next-quality-report.yml does the same); the script falls back to GITHUB_TOKEN when it is spent.
      - name: Mint the read token
        id: read-token
        if: vars.GLAEDA_ROUTE_APP_ID != ''
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.GLAEDA_ROUTE_APP_ID }}
          private-key: ${{ secrets.GLAEDA_ROUTE_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-actions: read
          permission-contents: read
      # A pull request GITHUB_TOKEN opens starts no CI, so on the base the revert opens with the
      # routing App's token, as cmux-next.yml's release-compile-revert does.
      - name: Mint the revert PR token
        id: app-token
        if: ${{ github.ref_name == 'feat-cmux-next' && vars.GLAEDA_ROUTE_APP_ID != '' }}
        timeout-minutes: 1
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.GLAEDA_ROUTE_APP_ID }}
          private-key: ${{ secrets.GLAEDA_ROUTE_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
      # Creating a branch based on feat-cmux-next needs workflows write: its workflow files differ from
      # main's, and GitHub refuses or times out a token without it (drill-5, -6 and -7). Minted on every
      # branch, so a drill proves the same push; the pull request itself still opens with GH_TOKEN.
      # The push token is contents write only. A swap-out or revert whose diff touches .github/workflows/**
      # takes the workflows token below instead; that mint may fail (the App had no Workflows permission,
      # hq#18499) and then only such a diff stops, with the command to do it by hand.
      - name: Mint the revert push token
        id: push-token
        if: vars.GLAEDA_ROUTE_APP_ID != ''
        timeout-minutes: 1
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.GLAEDA_ROUTE_APP_ID }}
          private-key: ${{ secrets.GLAEDA_ROUTE_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
      - name: Mint the workflows push token
        id: workflows-token
        if: vars.GLAEDA_ROUTE_APP_ID != ''
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.GLAEDA_ROUTE_APP_ID }}
          private-key: ${{ secrets.GLAEDA_ROUTE_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-workflows: write
      - name: Swap out the piece, or open the revert pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          GH_READ_TOKEN: ${{ steps.read-token.outputs.token }}
          PUSH_TOKEN: ${{ steps.push-token.outputs.token || steps.app-token.outputs.token || github.token }}
          WORKFLOWS_TOKEN: ${{ steps.workflows-token.outputs.token }}
          CULPRIT: ${{ needs.judge.outputs.culprit }}
          RED_JOB: ${{ needs.judge.outputs.job }}
          GOOD: ${{ needs.judge.outputs.good }}
          ORIGIN: ${{ needs.judge.outputs.origin }}
          BRANCH: ${{ github.ref_name }}
          DISPATCH_TOKEN: ${{ github.token }}
          # Hot swap out first, for classes .github/piece-swap.json lists (only drill ships); 0 turns it off.
          NEXT_PIECE_SWAP: ${{ vars.NEXT_PIECE_SWAP }}
          PIECES: ${{ needs.judge.outputs.pieces }}
          PIECE: ${{ needs.judge.outputs.piece }}
        run: |
          git config user.name "cmux post-merge batch"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 scripts/ci/post_merge_batch.py revert --branch "$BRANCH" --culprit "$CULPRIT" --job "$RED_JOB" \
            --good "$GOOD" --origin "$ORIGIN" --pieces "$PIECES" --piece "$PIECE" \
            --push-url "https://x-access-token:{token}@github.com/${GITHUB_REPOSITORY}.git"
