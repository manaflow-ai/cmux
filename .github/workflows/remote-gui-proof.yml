name: Remote GUI proof (localhost SSH host, NEXT DEV app)
run-name: ${{ format('Remote GUI proof{0}', inputs.request_id != '' && format(' {0}', inputs.request_id) || '') }}

# One manual trip through cmux NEXT Remote over SSH in the app's GUI, on a throwaway CI Mac.
# Leo, 2026-11-10: "we're not a terminal-first app anymore. cmux-next is a gui."; Remote is "something
# that I do certainly care about". No soak, no gate: manual dispatch only, nothing waits on it.
#
# The SSH host is this same Mac: scripts/cmux-next/remote-gui-proof-host.sh adds a second local account
# (rhost) with a stand-in `claude` (no Claude login on the runner; it answers PONG) and a key-only sshd
# on 127.0.0.1 only, and gives the runner user the ssh alias e2ehost. Nothing listens beyond loopback.
# scripts/cmux-next/remote-gui-proof.py drives a tagged Debug build of the dispatched commit (built as
# cloud-chat-proof.yml build=tagged does, but signed out: no account is needed for an SSH host) through
# its control socket: add the host, start a chat there and read the first reply, move a chat
# there and back, drop the network (pf on lo0) and restore it. Each step leaves a light-mode still,
# and the evidence (evidence.json) holds the times: pick host -> first reply, drop -> working again.
on:
  workflow_dispatch:
    inputs:
      drop_seconds:
        description: How long the network stays dropped before it is restored
        required: false
        default: "30"
        type: string
      request_id:
        description: Names the run (its run-name), so the requester finds it
        required: false
        default: ""
        type: string

permissions:
  contents: read
  # An earlier run's built-app artifact (Restore the built app from an earlier run's artifact).
  actions: read

concurrency:
  group: remote-gui-proof-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  proof:
    # An ephemeral Blacksmith Mac (never an owned one, never GitHub-hosted: tests/test_ci_no_github_hosted_macos.py):
    # the proof adds a user, an sshd and pf rules, which only a throwaway Mac may take.
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || vars.MACOS_RUNNER_26 || 'blacksmith-6vcpu-macos-26' }}
    timeout-minutes: 180
    env:
      CMUX_SKIP_ZIG_BUILD: "1"
      # remote-gui-proof-host.sh changes the machine (a user, sshd, pf) only where this says it is throwaway.
      REMOTE_GUI_PROOF_THROWAWAY: "1"
      SWIFT_BACKTRACE: interactive=no,timeout=0s,symbolicate=off,color=no
    steps:
      - name: Proof directory
        run: echo "PROOF_DIR=$RUNNER_TEMP/remote-gui-proof" >> "$GITHUB_ENV"

      - name: Checkout cmux
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: recursive

      # The built app is kept by its sources (as scripts/measure/split-spring.sh keys its app cache): a change to
      # the proof's own scripts or a workflow builds nothing, so a selector fix reruns in minutes, not the ~2 h of
      # acpmux and app builds on this runner (run 42827751536: 31 min acpmux, 63 min app).
      - name: App key
        id: app-key
        run: |
          key="$( { git ls-tree HEAD | grep -v -E $'\t(scripts|\\.github)$'; git ls-tree HEAD:scripts | grep -v -E $'\t(cmux-next|measure)$'; } \
            | git hash-object --stdin)"
          echo "key=rgp-app-$key" >> "$GITHUB_OUTPUT"
          echo "App key: rgp-app-$key"

      # The cache alone did not carry it: run 42870121112 logged "Cache saved with key: rgp-app-3e4bde67..." and run
      # 42878100302, on the same branch 50 min later, "Cache not found for input keys: rgp-app-3e4bde67...". So the app
      # also goes up as an artifact named by the key, and a later run takes the newest unexpired one.
      - name: Restore the built app
        id: app-cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/rgp-app
          key: ${{ steps.app-key.outputs.key }}

      - name: Restore the built app from an earlier run's artifact
        id: app-artifact
        if: steps.app-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          KEY: ${{ steps.app-key.outputs.key }}
        run: |
          set -uo pipefail
          id="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$KEY&per_page=5" \
            --jq '[.artifacts[] | select(.expired == false)][0].id // empty' 2>/dev/null)"
          if [ -z "$id" ]; then echo "no artifact $KEY"; echo "hit=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          mkdir -p "$RUNNER_TEMP/rgp-dl" "$RUNNER_TEMP/rgp-app"
          if gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "$RUNNER_TEMP/rgp-dl/a.zip" \
            && ditto -x -k "$RUNNER_TEMP/rgp-dl/a.zip" "$RUNNER_TEMP/rgp-dl" \
            && ditto -x -k "$RUNNER_TEMP/rgp-dl/rgp-app.zip" "$RUNNER_TEMP/rgp-app" \
            && [ -d "$RUNNER_TEMP/rgp-app/cmux DEV rgp.app" ]; then
            echo "Reusing artifact $id ($KEY)" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "hit=true" >> "$GITHUB_OUTPUT"
          else
            echo "artifact $id did not unpack"; echo "hit=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Select Xcode
        run: ./scripts/select-ci-xcode.sh

      # Same toolchain as reload-build.yml: the webviews `vp build` runs on node,
      # and check-webviews-bun-version.sh refuses a bun older than the
      # webviews/package.json devEngines pin, which stopped run 41798237731.
      - name: Setup Node
        if: steps.app-cache.outputs.cache-hit != 'true' && steps.app-artifact.outputs.hit != 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.22.1"

      - name: Setup Bun
        if: steps.app-cache.outputs.cache-hit != 'true' && steps.app-artifact.outputs.hit != 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"

      # Before the acpmux build: its libghostty-vt (ghostty-vt-sys) runs `zig build`
      # in ghostty-next. As nightly.yml's "Install compilation dependencies": the
      # classic ghostty Zig (CMUX_ZIG, PATH) and ghostty-next's own as CMUX_VT_ZIG.
      # After the build, run 42730570609 stopped at "failed to run 'zig build' ...
      # No such file or directory".
      - name: Install build prerequisites
        if: steps.app-cache.outputs.cache-hit != 'true' && steps.app-artifact.outputs.hit != 'true'
        run: |
          set -euo pipefail
          ./scripts/install-zig-ci.sh
          GHOSTTY_ZIG_SOURCE=ghostty-next ZIG_FORCE_LOCAL_INSTALL=1 ZIG_PUBLISH_ENV=CMUX_VT_ZIG ./scripts/install-zig-ci.sh
          ./scripts/download-prebuilt-ghosttykit.sh || ./scripts/ensure-ghosttykit.sh

      # As in reload-build.yml: without these, reload.sh waits for a cmux-tui
      # artifacts run of the exact tree, which stopped run 41806140144. The
      # app bundle starts the in-tree acpmux, and the client comes from the
      # newest published commit with the same cmux-tui and Ghostty inputs,
      # checked against its build-provenance attestation.
      - name: Build in-tree acpmux
        if: steps.app-cache.outputs.cache-hit != 'true' && steps.app-artifact.outputs.hit != 'true'
        run: |
          set -euo pipefail
          ./scripts/install-rust-ci.sh
          # ghostty-vt-sys reads ZIG first (as refresh-build-in-tree-acpmux.sh does).
          if [[ -z "${ZIG:-}" && -n "${CMUX_VT_ZIG:-}" ]]; then
            export ZIG="$CMUX_VT_ZIG"
          fi
          acpmux_bin="$RUNNER_TEMP/cmux-next-acpmux/acpmux"
          scripts/cmux-next/build-acpmux.sh --output "$acpmux_bin"
          echo "CMUX_NEXT_ACPMUX_BIN=$acpmux_bin" >> "$GITHUB_ENV"

      - name: Install the matching published cmux-tui client
        if: steps.app-cache.outputs.cache-hit != 'true' && steps.app-artifact.outputs.hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          client_commit="$(scripts/ci/resolve-cmux-tui-client-commit.sh)"
          git diff --exit-code "$client_commit" HEAD -- cmux-tui ghostty ghostty-next
          client_bundle="$RUNNER_TEMP/cmux-tui-prebuilt"
          mkdir -p "$client_bundle/Contents"
          env -u CMUX_TUI_CLIENT_LOCAL scripts/install-cmux-tui-client.sh "$client_bundle" \
            --manifest-url "https://files.cmux.com/cmux-tui/$client_commit/manifest.json" \
            --expected-commit "$client_commit" --require-capability wireguard-hub \
            --attest-signer-workflow "$GITHUB_REPOSITORY/.github/workflows/cmux-tui-artifacts.yml"
          client="$client_bundle/Contents/Resources/bin/cmux"
          probe="$("$client" remote-probe --json)"
          version="$("$client" --version)"
          # Packaged clients stamp the libghostty-vt source: ghostty-next where
          # the tree has it, else ghostty (older trees).
          ghostty_source=ghostty
          if git rev-parse --verify -q HEAD:ghostty-next >/dev/null; then
            ghostty_source=ghostty-next
          fi
          ghostty_sha="$(git rev-parse "HEAD:$ghostty_source")"
          PROBE="$probe" VERSION="$version" EXPECTED_COMMIT="$client_commit" EXPECTED_GHOSTTY="$ghostty_sha" python3 - <<'PYVERIFY'
          import json
          import os

          if json.loads(os.environ["PROBE"]).get("build_identity") != os.environ["EXPECTED_COMMIT"]:
              raise SystemExit("published cmux-tui client has the wrong build identity")
          if os.environ["EXPECTED_GHOSTTY"] not in os.environ["VERSION"]:
              raise SystemExit("published cmux-tui client has the wrong Ghostty identity")
          PYVERIFY
          echo "CMUX_TUI_CLIENT_LOCAL=$client" >> "$GITHUB_ENV"

      # A tagged Debug build of this commit, as cloud-chat-proof.yml build=tagged (without its account): the
      # proof drives the app through its debug control surface (debug.page, debug.agent_pane, debug.key,
      # debug.window_snapshot), which the published NEXT DEV app, a Release build, does not compile in.
      - name: Build the tagged app
        if: steps.app-cache.outputs.cache-hit != 'true' && steps.app-artifact.outputs.hit != 'true'
        run: |
          set -euo pipefail
          # --keep-app: without it a --build-only build deletes the bundle it made and prints no App path
          # (run 42827751536: "==> removed temporary build-only artifact" after a 63 min build).
          ./scripts/reload.sh --tag rgp --build-only --keep-app "$RUNNER_TEMP/rgp-app/cmux DEV rgp.app" \
            --swift-frontend-workaround | tee "$RUNNER_TEMP/reload.out"
          app="$(awk '/^App path:/{getline; sub(/^ +/, ""); print; exit}' "$RUNNER_TEMP/reload.out")"
          if [ -z "$app" ] || [ ! -d "$app" ]; then
            echo "::error::reload.sh printed no app path"
            exit 1
          fi
          echo "PROOF_APP=$app" >> "$GITHUB_ENV"

      - name: Keep the built app
        if: steps.app-cache.outputs.cache-hit != 'true' && steps.app-artifact.outputs.hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/rgp-app
          key: ${{ steps.app-key.outputs.key }}

      - name: Upload the built app (for a later run)
        if: steps.app-cache.outputs.cache-hit != 'true' && steps.app-artifact.outputs.hit != 'true'
        run: ditto -c -k --sequesterRsrc --keepParent "$PROOF_APP" "$RUNNER_TEMP/rgp-app.zip"

      - name: Upload the built app artifact
        if: steps.app-cache.outputs.cache-hit != 'true' && steps.app-artifact.outputs.hit != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.app-key.outputs.key }}
          path: ${{ runner.temp }}/rgp-app.zip
          if-no-files-found: error
          retention-days: 3

      - name: Use the kept app
        if: steps.app-cache.outputs.cache-hit == 'true' || steps.app-artifact.outputs.hit == 'true'
        run: |
          app="$RUNNER_TEMP/rgp-app/cmux DEV rgp.app"
          [ -d "$app" ] || { echo "::error::the restored cache holds no app"; exit 1; }
          echo "Reusing the app built for ${{ steps.app-key.outputs.key }}" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "PROOF_APP=$app" >> "$GITHUB_ENV"

      # The Add Device card is a native panel: the proof clicks its controls with real mouse events found through
      # the accessibility tree (osascript, System Events). Grant osascript that on this throwaway runner when the
      # image has not; best effort, and the proof records a refusal as a snag.
      - name: Accessibility for osascript (throwaway runner)
        continue-on-error: true
        run: |
          now="$(date +%s)"
          for db in "/Library/Application Support/com.apple.TCC/TCC.db" "$HOME/Library/Application Support/com.apple.TCC/TCC.db"; do
            sudo sqlite3 "$db" "INSERT OR REPLACE INTO access (service, client, client_type, auth_value, auth_reason, auth_version, indirect_object_identifier, flags, last_modified) VALUES ('kTCCServiceAccessibility', '/usr/bin/osascript', 1, 2, 4, 1, 'UNUSED', 0, $now);" \
              && echo "accessibility row in $db" || echo "no write to $db"
            sudo sqlite3 "$db" "INSERT OR REPLACE INTO access (service, client, client_type, auth_value, auth_reason, auth_version, indirect_object_identifier, flags, last_modified) VALUES ('kTCCServiceAppleEvents', '/usr/bin/osascript', 1, 2, 4, 1, 'com.apple.systemevents', 0, $now);" \
              && echo "apple events row in $db" || echo "no write to $db"
          done
          csrutil status || true
          osascript -l JavaScript -e 'Application("System Events").processes.length' || true

      - name: SSH host on loopback (second local account, key-only sshd)
        run: scripts/cmux-next/remote-gui-proof-host.sh up "$PROOF_DIR/host"

      - name: Remote journey in the app
        timeout-minutes: 35
        env:
          DROP_SECONDS: ${{ inputs.drop_seconds || '30' }}
        run: |
          python3 -I scripts/cmux-next/remote-gui-proof.py --app "$PROOF_APP" --tag "rgp-$GITHUB_RUN_ID" \
            --host-dir "$PROOF_DIR/host" --drop-seconds "$DROP_SECONDS" --out "$PROOF_DIR/out"

      - name: Summarize
        if: always()
        run: |
          [ -s "$PROOF_DIR/out/summary.md" ] && cat "$PROOF_DIR/out/summary.md" >> "$GITHUB_STEP_SUMMARY" || true
          cp "$PROOF_DIR/host/sshd.log" "$PROOF_DIR/out/" 2>/dev/null || true

      - name: Upload stills and evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: remote-gui-proof
          path: ${{ runner.temp }}/remote-gui-proof/out/
          if-no-files-found: warn
          retention-days: 3

      - name: Stop the SSH host
        if: always()
        run: scripts/cmux-next/remote-gui-proof-host.sh down "$PROOF_DIR/host" || true
