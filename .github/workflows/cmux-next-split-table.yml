name: cmux-next split table

# Instant-splits goal (Leo's persona: one probe, one table, run on every PR): a pull request into feat-cmux-next that
# touches split, pane, panel or divider code gets one split-scale run (scripts/cmux-next/split-scale-bench.py --quick:
# 1 and 4 splits, empty and browser panes, one round) on the bench Mac, and the table of every transition, worst row
# first, input to first frame in ms, blank frames and retargets (end-point drift), before (the newest measured
# nightly's same cells) -> after (this head), on the run's summary and in one pull request comment (updated
# in place). A row over 16 ms, with a blank frame or unmeasured is marked. REPORT-ONLY: no job here fails on a row
# and no required check reads it (no new blocking gate without data; the pull request that added it proposes one).
# Same-repo, non-draft pull requests only (a fork's head cannot run on an owned Mac). A fleet step is queued
# as a measurement on the bench Mac alone; no bench Mac in time leaves a note, not a red.
# Leo: "we can't be letting important rfds like that take breaks unless I put in fleet wide pauses, esp when this is
# stuff that materially improves the app".

on:
  pull_request:
    branches: [feat-cmux-next]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - .github/workflows/cmux-next-split-table.yml
      - scripts/measure/split-spring.sh
      - scripts/cmux-next/split-scale-bench.py
      - scripts/cmux-next/split_scale_metrics.py
      - scripts/cmux-next/frame_timing.py
      - scripts/cmux-next/split-spring-terminal.py
      - Packages/macOS/CmuxNext/Sources/CmuxNextDesign/Diagnostics/TransitionFrameLog.swift
      - "Packages/macOS/CmuxNext/Sources/**/*Split*.swift"
      - "Packages/macOS/CmuxNext/Sources/**/*Divider*.swift"
      - "Packages/macOS/CmuxNext/Sources/**/*Pane*.swift"
      - "Packages/macOS/CmuxNext/Sources/**/*Panel*.swift"
      - "Packages/macOS/CmuxNext/Sources/**/*Layout*.swift"

  workflow_dispatch:
    inputs:
      ref:
        description: "sha (40 hex) to measure"
        required: true

permissions: {}

concurrency:
  group: cmux-next-split-table-${{ github.event.pull_request.number || github.run_id }}${{ startsWith(github.event_name, 'pull_request') && github.event.action == 'ready_for_review' && format('-ready-{0}', github.run_id) || '' }}
  cancel-in-progress: true

env:
  # Temporary REST budget attribution: one gh-call line per GitHub API call (scripts/ci/api_call_log/env.sh, fetched at a fixed commit when the checkout has no copy).
  BASH_ENV: '$({ w="${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh"; t="${RUNNER_TEMP:-/nonexistent}/api-call-log-src"; if [ -f "$w" ]; then echo "$w"; elif [ -n "${RUNNER_TEMP:-}" ]; then if [ ! -f "$t/env.sh" ] && [ ! -e "$t.tried" ] && { [ "${RUNNER_OS:-}" = Linux ] || [ "${RUNNER_OS:-}" = macOS ]; } && [ "$(date -u +%Y%m%d%H)" -lt 2026112300 ]; then : > "$t.tried"; mkdir -p "$t.part" && for x in env.sh gh sitecustomize.py isolated.py; do curl -fsSL --max-time 5 -o "$t.part/$x" "https://raw.githubusercontent.com/manaflow-ai/cmux/27647ffd3ae838c63be28ca3e5883dcd68c34518/scripts/ci/api_call_log/$x" || break; done; [ -s "$t.part/isolated.py" ] && mv "$t.part" "$t"; fi; if [ -f "$t/env.sh" ]; then echo "$t/env.sh"; else echo unset BASH_ENV > "$t.off.sh" && echo "$t.off.sh"; fi; fi; } 2>/dev/null)'

jobs:
  # The id ends in -fleet: the gateway runner's hook admits thin cmux-ci client jobs by that suffix.
  measure-fleet:
    if: >-
      ${{ github.repository == 'manaflow-ai/cmux' && vars.CI_EVAL_STEP_GATEWAY != ''
      && (github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository
      && !github.event.pull_request.draft)) }}
    runs-on: mac-gateway # frozen-label: CI_EVAL_STEP_GATEWAY (cmux#54437)
    timeout-minutes: 120
    permissions: {}
    outputs:
      detached: ${{ steps.measure.outputs.detached }}
    steps:
      # No checkout: the gateway runner takes only thin cmux-ci clients. The bench Mac checks the sha out itself.
      - name: split-scale (quick) on the bench Mac
        id: measure
        env:
          SHA: ${{ inputs.ref || github.event.pull_request.head.sha }}
          # Detached (the default): the job submits the step and ends; the controller posts the step's verdict, with
          # the log tail that ends in the table (split-spring.sh prints it), as the check run REPORT_CHECK on the
          # head (cmux-ci run --report-check --detach, report_check.go), so no runner waits for the one bench Mac.
          # The 18-21Z window on 11-27 billed 1404.4 runner-min for 52 runs here (27 min a run, 11.3 per merged
          # PR), nearly all of it the gateway runner waiting in the bench Mac's queue. CI_SPLIT_TABLE_DETACH=0
          # waits here as before; a client without --detach waits too. Same cut as nightly-pr-build (#62619).
          DETACH: ${{ vars.CI_SPLIT_TABLE_DETACH || '1' }}
          REPORT_CHECK: cmux-next split table (report-only)
          # A gateway Mac's own ~/.local/bin/cmux-ci can predate --detach (cmux#63089: nightly-pr-build's detach
          # never took on those runners, 20.1 min a job). Then the step fetches the controller's client
          # (sha256-checked against its manifest, as nightly-pr-build.yml does) and uses it.
          # CI_SPLIT_TABLE_LOCAL_CLIENT=1 keeps the runner's own client.
          CONTROLLER: ${{ vars.CMUX_FLEET_CONTROLLER }}
          LOCAL_CLIENT_ONLY: ${{ vars.CI_SPLIT_TABLE_LOCAL_CLIENT || '0' }}
          # The measure script's own build config (split-spring.sh --config=...): a bench build for the fleet step, never a shipped one.
          MEASURE_CONFIG: bench
          # The longest this job holds its Mac mini gateway runner while the step waits in the exclusive queue. It was
          # 3600 s: of the 19 "successful" runs in 16:43-21:15Z on 2026-11-27, 13 held a gateway runner 60-64 min
          # waiting it out and returned no report (run 46063032927: step 5fef8fd13e39246893d2ef5a never left the
          # queue; that class's p90 queue wait was 1124 min). 1200 s matches cmux-next-tab-switch.yml and
          # nightly-pr-build.yml; past it the step is cancelled, so it gives its place back.
          QUEUE_WAIT_S: "1200"
        run: |
          set -uo pipefail
          client="${CMUX_CI_CLIENT:-$HOME/.local/bin/cmux-ci}"
          if ! [[ -x "$client" ]]; then
            echo "::warning title=Split table::$client is not installed on runner $RUNNER_NAME; nothing was measured."
            exit 0
          fi
          if ! [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::warning title=Split table::'$SHA' is not a 40-hex commit sha"
            exit 0
          fi
          out="$RUNNER_TEMP/split-table"
          mkdir -p "$out"
          log="$out/run.log"
          detach=()
          usage="$("$client" run --help 2>/dev/null || true)"
          if [[ "$DETACH" != 0 && "$usage" != *--detach* && "$LOCAL_CLIENT_ONLY" != 1 && -n "$CONTROLLER" ]]; then
            fresh="$RUNNER_TEMP/fleet-client"
            mkdir -p "$fresh"
            if curl -fsS -m 30 "$CONTROLLER/v1/client/manifest" -o "$fresh/manifest.json" &&
              python3 -I - "$fresh" "$CONTROLLER" <<'PY'
          import hashlib, json, sys, urllib.request
          from pathlib import Path
          root, controller = Path(sys.argv[1]), sys.argv[2]
          for name, digest in json.loads((root / "manifest.json").read_text())["files"].items():
              if "/" in name or name.startswith("."):
                  raise SystemExit(f"bad client file name {name!r}")
              data = urllib.request.urlopen(f"{controller}/v1/client/files/{name}", timeout=30).read()
              if hashlib.sha256(data).hexdigest() != digest:
                  raise SystemExit(f"{name}: sha256 mismatch")
              (root / name).write_bytes(data)
          PY
            then
              printf '#!/bin/sh\nexec python3 -I %q "$@"\n' "$fresh/ci-client.py" > "$fresh/cmux-ci"
              chmod +x "$fresh/cmux-ci"
              fresh_usage="$("$fresh/cmux-ci" run --help 2>/dev/null || true)"
              if [[ "$fresh_usage" == *--detach* ]]; then
                echo "::notice title=Split table::runner $RUNNER_NAME's cmux-ci lacks --detach; using the controller's client"
                client="$fresh/cmux-ci"
                usage="$fresh_usage"
              fi
            else
              echo "::warning title=Split table::could not fetch the controller's client; waiting on the local one"
            fi
          fi
          if [[ "$DETACH" != 0 && "$usage" == *--detach* ]]; then
            detach=(--repo "$GITHUB_REPOSITORY" --report-check "$REPORT_CHECK" --detach)
          fi
          # The before column: the newest NEXT nightly's own split-scale measurement (split_scale_nightly.py's step,
          # key split-scale-nightly-<sha12>) of the same quick cells, read from the controller and passed to the bench
          # as --baseline (split_scale_metrics.encode_baseline's format, kept in step here: the gateway has no
          # checkout). One bench run gives before and after, so a pull request adds no second exclusive hold on the
          # bench Mac. Each call is bounded (30-120 s); any miss leaves no before column, never a red.
          baseline=()
          # The script goes to a file first: macOS bash 3.2 misparses a heredoc inside $(...) whose body has quotes
          # and parentheses ("unexpected EOF while looking for matching `)'").
          cat > "$RUNNER_TEMP/split-table-baseline.py" <<'PY'
          import base64, json, os, re, subprocess, sys, urllib.request, xml.etree.ElementTree as ET, zlib
          client, out = sys.argv[1], sys.argv[2]
          feed = "https://files-next.cmux.com/nightly-next/appcast-arm64.xml"
          ns = "{https://cmux.com/xml-namespaces/cmux}sourceCommit"
          sparkle = "{http://www.andymatuschak.org/xml-namespaces/sparkle}version"
          try:
              body = urllib.request.urlopen(urllib.request.Request(feed, headers={"User-Agent": "split-table"}), timeout=30).read()
              items = ET.fromstring(body).findall("./channel/item")
          except Exception as e:
              sys.exit(f"split table: no nightly feed ({e})")
          builds = []
          for item in items:
              v = (item.findtext(sparkle) or "").strip()
              m = re.search(r"cmux-published-sha:\s*([0-9a-f]{40})", item.findtext("description") or "")
              sha = m.group(1) if m else (item.findtext(ns) or "").strip()
              if v.isdigit() and re.fullmatch(r"[0-9a-f]{40}", sha):
                  builds.append((int(v), sha))
          def steps_of(sha):
              try:
                  steps = json.loads(subprocess.run([client, "status", "--ref", sha], capture_output=True, text=True, timeout=60).stdout or "[]")
              except Exception:
                  return []
              return [(j["id"], sha) for j in steps if isinstance(j, dict) and j.get("state") == "done"
                      and str(j.get("step_key") or "").startswith(f"split-scale-nightly-{sha[:12]}")][-1:]
          # The feed keeps only its two newest builds and the newest is often still queued for the bench Mac: then the
          # newest finished full-matrix split-scale step of the last 3 days (the nightly tick's args, no cell filter).
          found = [hit for _, sha in sorted(builds, reverse=True) for hit in steps_of(sha)][:1]
          if not found:
              import datetime as dt
              since = (dt.datetime.now(dt.timezone.utc) - dt.timedelta(days=3)).strftime("%Y-%m-%dT%H:%M:%SZ")
              try:
                  hist = json.loads(subprocess.run([client, "history", "--since", since, "--state", "done", "--class", "exclusive",
                                                    "--fields", "id,ref,args,updated_at", "--format", "json"],
                                                   capture_output=True, text=True, timeout=120).stdout or "[]")
              except Exception:
                  hist = []
              full = [j for j in hist if isinstance(j, dict) and "--suite=split-scale" in (j.get("args") or [])
                      and not any(a.startswith(("--quick", "--splits", "--contents", "--workspaces", "--transitions",
                                                "--moves", "--diag", "--app-env", "--baseline")) for a in j.get("args") or [])]
              full.sort(key=lambda j: j.get("updated_at") or "")
              found = [(j["id"], j["ref"]) for j in full[-1:] if re.fullmatch(r"[0-9a-f]{40}", j.get("ref") or "")]
          for step, sha in found:
              path = f"{out}/baseline-report.json"
              try:
                  subprocess.run([client, "artifact", step, path], capture_output=True, timeout=120, check=True)
                  report = json.load(open(path))
                  os.remove(path)  # 1.7 MB: not the artifact upload's business
              except Exception:
                  continue
              keep = re.compile(r"s[14]-(empty|browser)-w1")  # split-scale-bench.py --quick's cells
              cells = {c: {t: {k: s.get(k) for k in ("first_frame_ms", "blank_frames", "retargets", "settled_ms")}
                           for t, s in per.items() if isinstance(s, dict)}
                       for c, per in (report.get("cells") or {}).items() if keep.fullmatch(c)}
              if cells:
                  raw = json.dumps({"sha": sha, "cells": cells}, separators=(",", ":")).encode()
                  print(base64.urlsafe_b64encode(zlib.compress(raw, 9)).decode())
                  sys.exit(0)
          sys.exit("split table: no finished split-scale measurement to compare with")
          PY
          base_arg="$(python3 -I "$RUNNER_TEMP/split-table-baseline.py" "$client" "$out" || true)"
          if [[ -n "$base_arg" ]]; then
            baseline=("--arg=--baseline=$base_arg")
            echo "::notice title=Split table::before column: the newest measured split-scale matrix (${#base_arg} byte arg)"
          else
            echo "::notice title=Split table::no before column (no finished split-scale matrix to compare with)"
          fi
          # Build at light class first, so the bench Mac's exclusive hold covers only the measuring
          # (split-spring.sh CMUX_MEASURE_PHASE). Only a client that knows the flag sends it.
          build_first=()
          [[ "$usage" == *--build-first* ]] && build_first=(--build-first)
          status=0
          "$client" run --class exclusive --measurement --label bench --display \
            --script scripts/measure/split-spring.sh --ref "$SHA" --timeout 5400 --queue-timeout "$QUEUE_WAIT_S" \
            --key "split-table-$SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" ${build_first[@]+"${build_first[@]}"} \
            --artifact artifacts/split-spring/report.json ${detach[@]+"${detach[@]}"} \
            --arg=--suite=split-scale --arg=--config=$MEASURE_CONFIG --arg=--quick --arg=--vdisplay=120 \
            ${baseline[@]+"${baseline[@]}"} 2>&1 | tee "$log" || status=${PIPESTATUS[0]}
          [[ "$status" == 0 ]] || echo "::warning title=Split table::the fleet step did not finish (exit $status; report-only: nothing fails)"
          if [[ ${#detach[@]} -gt 0 ]] && grep -q ') detached; check run' "$log"; then
            # Submitted: the check run carries the table when the bench Mac is done; nothing to fetch here.
            echo "detached=1" >> "$GITHUB_OUTPUT"
            echo "::notice title=Split table::the bench Mac posts the table as check run \"$REPORT_CHECK\" on ${SHA:0:12}"
            exit 0
          fi
          step="$(grep -o -E '\b[0-9a-f]{24}\b' "$log" | head -1 || true)"
          if [[ "$status" == 75 && -n "$step" ]]; then
            # Not started within QUEUE_WAIT_S: a queued step keeps its place after the client stops waiting and later
            # runs on the bench Mac for nobody, ahead of every later measurement (cmux-next-tab-switch.yml does the same).
            "$client" cancel "$step" --reason "split table: not started within ${QUEUE_WAIT_S}s" || true
          fi
          if [[ -n "$step" ]]; then
            "$client" artifact "$step" "$out/report.json" || "$client" artifact --failed "$step" "$out/report.json" || true
          fi
          echo "fleet step ${step:-none}; report $([[ -s "$out/report.json" ]] && echo returned || echo none)"
          exit 0
      # A newer push cancels this run (concurrency above), but the fleet step it queued keeps its place and later runs
      # on the bench Mac for nobody. Cancel it too: the client prints the step id as soon as it is queued.
      - name: Cancel the superseded fleet step
        if: ${{ cancelled() }}
        timeout-minutes: 2
        run: |
          set -uo pipefail
          client="${CMUX_CI_CLIENT:-$HOME/.local/bin/cmux-ci}"
          log="$RUNNER_TEMP/split-table/run.log"
          step="$( [[ -r "$log" ]] && grep -o -E '\b[0-9a-f]{24}\b' "$log" | head -1 || true)"
          if [[ -x "$client" && -n "$step" ]]; then
            "$client" cancel "$step" --reason "split table: superseded (run $GITHUB_RUN_ID cancelled)" || true
          fi
      - name: Upload the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: split-table-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/split-table/
          if-no-files-found: warn

  report:
    needs: measure-fleet
    if: ${{ !cancelled() && needs.measure-fleet.result != 'skipped' }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || 'cmux-linux' }}
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write # the one comment
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout: scripts/cmux-next
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        continue-on-error: true
        with:
          name: split-table-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/split-table
      - name: The table, worst row first
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ inputs.ref || github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DETACHED: ${{ needs.measure-fleet.outputs.detached }}
          CHECKS_URL: ${{ github.server_url }}/${{ github.repository }}/pull/${{ github.event.pull_request.number }}/checks
        run: |
          # Report-only: a failed comment read or write warns, never fails the job (a bare `id="$(gh ...)"` under bash -e and pipefail exited 1 silently on #61185).
          set -uo pipefail
          report="$RUNNER_TEMP/split-table/report.json"
          body="$RUNNER_TEMP/split-table/comment.md"
          mkdir -p "$RUNNER_TEMP/split-table" # no artifact (measure refused or failed) leaves no directory
          python3 - "$report" "$body" <<'PY'
          import json, os, sys
          sys.path.insert(0, "scripts/cmux-next")
          import split_scale_metrics as ssm
          report, out = sys.argv[1:3]
          sha, run = os.environ["SHA"], os.environ["RUN_URL"]
          try:
              data = json.load(open(report))
              rows, base_sha = data.get("row_table"), data.get("baseline_sha")
          except (OSError, ValueError):
              rows = base_sha = None
          head = "<!-- cmux-next-split-table -->\n## Split table (report-only)\n\n"
          foot = f"\n\nSplit-scale quick (1 and 4 splits, empty and browser) at `{sha[:12]}`; [run]({run}). Report-only: no check reads it."
          if os.environ.get("DETACHED") == "1":
              text = (f"The bench Mac posts this head's table as the check run **cmux-next split table (report-only)** "
                      f"([checks]({os.environ['CHECKS_URL']})) when it is done; no runner waits for it here.")
          else:
              text = ssm.row_table_markdown(rows, base_sha=base_sha) if rows else "No table: the bench Mac returned no report (none free in time, or the run failed; see the run)."
          open(out, "w").write(head + text + foot)
          PY
          cat "$body" >> "$GITHUB_STEP_SUMMARY"
          if [[ -n "$PR" ]]; then
            id="$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments?per_page=100" \
              --jq '[.[] | select(.user.type == "Bot" and (.body | startswith("<!-- cmux-next-split-table -->")))] | last | .id // empty' 2>"$RUNNER_TEMP/split-table/lookup.err" | tail -n 1)" \
              || { echo "::warning title=Split table::could not list the PR comments ($(head -c 300 "$RUNNER_TEMP/split-table/lookup.err")); posting a new one"; id=""; }
            if [[ -n "$id" ]]; then
              gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@"$body" >/dev/null || echo "::warning title=Split table::could not update the comment"
            else
              gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F body=@"$body" >/dev/null || echo "::warning title=Split table::could not post the comment"
            fi
          fi
