name: cmux-next web bundle publish

# Publishes the built cmux-next web bundles (agent pane, React pages, Agent
# Activity, webviews app) per source key on files.cmux.com, like
# the cmux-tui tree (cx-ycne). GPUI hosts these React pages in CEF and fetches
# them with scripts/cmux-next/fetch-web-bundles.sh instead of building webviews/
# with bun + node on every host. Layout (bucket cmux-binaries, public under
# https://files.cmux.com/):
#   cmux-next-web/<key>/web-bundles-<sha256>.tar.gz   immutable, content-addressed
#   cmux-next-web/<key>/manifest.json                 written last; its presence
#                                                     means the key is complete
#   cmux-next-web/ota/every-merge.json                the signed every-merge pointer
#   cmux-next-web/ota/nightly.json                    the signed promoted-NEXT pointer
#                                                     (pointer job, from nightly-next)
# <key> = scripts/cmux-next/web-bundle-key.py . --source. Pushes that change no
# bundle input do not run this; a key that is already published is skipped.
#
# A pull request's web layer (cmuxterm-hq docs/design/experiments-shelf.md): a
# dispatch on feat-cmux-next with `pr` (and `base`, default the tip) builds the
# PR's head merged onto base, publishes it under its key as above, and writes
#   cmux-next-web/pr/<N>/latest.json        the newest layer of PR N (short cache)
#   cmux-next-web/pr/<N>/<head>-<base>.json the same, for that head on that base
# naming the key, the head, the base, the web ABI and what live_apply.py says
# the PR changes (`cmux customize use pr:N` reads it). Same-repo PRs only; no web
# update pointer moves.
#
# A branch or a commit, pushed with no PR (`ref`: a branch name, or a full commit
# on a branch of this repository), is the same, with its change taken from where
# it branched off feat-cmux-next, under
#   cmux-next-web/ref/<slug>/latest.json and .../<head>-<base>.json
# where <slug> is the ref with `/` as `--` (`cmux customize use branch:NAME`,
# `sha:SHA`). A fork's code never runs here: a commit that no branch of this
# repository has is refused, and a fork publishes its own layer
# (cmux-web-layer-fork.yml, run in the fork).
on:
  push:
    branches: [feat-cmux-next, nightly-next]
    paths:
      - "webviews/**"
      - "schemas/settings/**"
      # The feature tips' source (webviews/scripts/pages/gen-feature-tips.mjs).
      - "release-notes/next/highlights/**"
      - "Resources/markdown-viewer/marked.min.js"
      - "scripts/build-webviews-app.sh"
      - "scripts/check-webviews-bun-version.sh"
      - "scripts/webviews_bun_version.py"
      - "scripts/cmux-next/build-agent-pane-web.sh"
      - "scripts/cmux-next/build-agent-activity-web.sh"
      - "scripts/cmux-next/build-pages-web.sh"
      - "scripts/cmux-next/build-optchat-inspector-web.sh"
      - "scripts/cmux-next/build-web-bundles.sh"
      - "scripts/cmux-next/web-bundle-key.py"
      # Files outside webviews/ that webviews sources import (web-bundle-key.py --inputs;
      # tests/test_web_bundle_key_inputs.sh keeps this list complete).
      - "web/data/model-catalog/**"
      - "Resources/markdown-viewer/viewer-navigation.js"
      - "clients/ts/cloud/src/generated.ts"
      - "config/vite-plus/**"
      - "schemas/sync-motion/**"
      - "schemas/agent-pane/**"
      # The layout grid the transcript imports (src/agent-session/acpmux/transcriptGrid.ts).
      - "schemas/layout-grid/layout-grid.json"
      - "schemas/type-scale/type-scale.json"
      # The design scale the shared tooltip tokens import (src/ui/tooltipTokens.ts).
      - "schemas/design-scale/design-scale.json"
      # The theme slots the slot registry imports (src/slots/registry.ts).
      - "schemas/theme/slots.json"
      - "scripts/cmux-next/web-bundle-archive.py"
      - "scripts/cmux-next/web-ota-pointer.py"
      - "Packages/macOS/CmuxNext/Sources/CmuxNextUpdater/Resources/web-update-keys.json"
      - "Packages/macOS/CmuxNext/Sources/**/*.xcstrings"
      - ".github/workflows/cmux-next-web-bundle-publish.yml"
  workflow_dispatch:
    inputs:
      pr:
        description: "A pull request's web layer: its number (same-repo PRs only)"
        required: false
        default: ""
      ref:
        description: "A branch's or commit's web layer: a branch name, or a full commit on a branch of this repository (not with pr)"
        required: false
        default: ""
      base:
        description: "The commit the change is applied onto (default: the feat-cmux-next tip)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  # Keys are content-addressed: the newest push covers the tip, so an older
  # pending run can be replaced. A started run finishes.
  group: cmux-next-web-bundle-publish-${{ github.ref }}-${{ inputs.pr || inputs.ref || 'push' }}-${{ inputs.base }}
  cancel-in-progress: false

jobs:
  # The build runs third-party npm code (bun install, Vite), so it holds no
  # secret: it packs the archive and the manifest as a workflow artifact. The
  # publish job below gets the R2 credentials, starts from a clean checkout and
  # runs no bun or node (the cmux-tui artifacts build/publish split).
  build:
    if: github.repository == 'manaflow-ai/cmux' && (github.ref == 'refs/heads/feat-cmux-next' || github.ref == 'refs/heads/nightly-next' && !inputs.pr && !inputs.ref)
    name: build the web bundles for this source key
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || !startsWith(vars.LINUX_RUNNER, 'blacksmith-') && vars.LINUX_RUNNER || vars.CI_CLOUD_OVERFLOW_SAVED && fromJSON(vars.RUNNER_POOLS).linux_8 || fromJSON(vars.RUNNER_POOLS).linux_4 }}
    timeout-minutes: 20
    permissions:
      contents: read
      # A PR layer reads the PR (its head repo and head) in the merge step only.
      pull-requests: read
    env:
      # The Node value is part of web-bundle-key.py --source. Changing it moves
      # the published identity, so write-once R2 objects cannot hide a toolchain
      # change behind an old manifest. Bun is declared by webviews/package.json.
      CMUX_WEB_NODE_VERSION: "24.22.1"
    outputs:
      key: ${{ steps.key.outputs.key }}
      published: ${{ steps.key.outputs.published }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          # A PR layer merges the PR head onto base, so it needs their history (no blobs).
          fetch-depth: ${{ (inputs.pr || inputs.ref) && '0' || '1' }}
          filter: ${{ (inputs.pr || inputs.ref) && 'blob:none' || '' }}

      # A PR layer: the PR's head merged onto base, built and published like a push.
      # The build below runs the PR's code with no secret, as it runs a push's.
      - name: Apply the pull request or ref onto its base
        if: inputs.pr || inputs.ref
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr }}
          REF: ${{ inputs.ref }}
          BASE: ${{ inputs.base }}
        run: |
          set -euo pipefail
          [[ -z "$PR" || -z "$REF" ]] || { echo "::error::give pr or ref, not both"; exit 1; }
          [[ -z "$BASE" || "$BASE" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::base must be a full commit sha"; exit 1; }
          if [[ -n "$PR" ]]; then
            [[ "$PR" =~ ^[0-9]+$ ]] || { echo "::error::pr must be a number, got $PR"; exit 1; }
            info="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq '[.head.repo.full_name, .head.sha, .base.ref, .title, .state] | @tsv')"
            IFS=$'\t' read -r head_repo head base_ref title state <<<"$info"
            [[ "$head_repo" == "$GITHUB_REPOSITORY" ]] || { echo "::error::#$PR comes from $head_repo; only same-repo PRs get a published layer"; exit 1; }
            git fetch -q --filter=blob:none origin "+refs/pull/$PR/head:refs/remotes/pr/head"
            [[ "$(git rev-parse refs/remotes/pr/head)" == "$head" ]] || head="$(git rev-parse refs/remotes/pr/head)"
            label="#$PR"
          else
            # A branch of this repository, or a commit one of its branches has. A commit only a
            # fork has is refused: fork code never builds here (it publishes its own layer).
            [[ "$REF" =~ ^[A-Za-z0-9._/-]+$ && "$REF" != -* && "$REF" != *..* ]] || { echo "::error::ref must be a branch name or a full commit, got $REF"; exit 1; }
            base_ref=feat-cmux-next state=""
            if git ls-remote --exit-code -q origin "refs/heads/$REF" >/dev/null; then
              kind=branch
              git fetch -q --filter=blob:none origin "+refs/heads/$REF:refs/remotes/pr/head"
              head="$(git rev-parse refs/remotes/pr/head)"
            elif [[ "$REF" =~ ^[0-9a-f]{40}$ ]]; then
              kind=sha head="$REF"
              git fetch -q --filter=blob:none origin '+refs/heads/*:refs/remotes/origin/*'
              git cat-file -e "$head^{commit}" 2>/dev/null || git fetch -q --filter=blob:none origin "$head" || true
              git cat-file -e "$head^{commit}" 2>/dev/null && [[ -n "$(git for-each-ref --count=1 --contains "$head" refs/remotes/origin)" ]] \
                || { echo "::error::$REF is on no branch of $GITHUB_REPOSITORY (a fork's commit?): a fork publishes its own layer with cmux-web-layer-fork.yml"; exit 1; }
            else
              echo "::error::$REF is no branch of $GITHUB_REPOSITORY and no full commit"; exit 1
            fi
            title="$(git log -1 --format=%s "$head")"
            label="$REF"
          fi
          base="${BASE:-$(git rev-parse HEAD)}"
          git cat-file -e "$base^{commit}" 2>/dev/null || git fetch -q --filter=blob:none origin "$base"
          # The layer is the change's own diff on the app's commit, nothing else. Merging the head
          # would also bring every commit between that commit and where it branched off, so the
          # diff from its branch point is applied instead.
          git fetch -q --filter=blob:none origin "+refs/heads/$base_ref:refs/remotes/pr/base"
          fork="$(git merge-base refs/remotes/pr/base "$head")"
          git -c advice.detachedHead=false checkout -q --detach "$base"
          if ! git diff --binary "$fork" "$head" | git apply -q --3way --index; then
            echo "::error::$label (${head:0:12}) does not apply onto ${base:0:12}: it conflicts with what changed since; rebase it"
            exit 1
          fi
          git -c user.name=cmux-ci -c user.email=ci@cmux.invalid -c commit.gpgsign=false commit -q --allow-empty -m "$label ${head:0:12} on ${base:0:12}"
          classify="$(python3 scripts/cmux-next/live_apply.py --json "$fork" "$head")"
          mkdir -p "$RUNNER_TEMP/pr-layer"
          python3 - "$RUNNER_TEMP/pr-layer/layer.json" "$PR" "$REF" "${kind:-}" "$head" "$base" "$(git rev-parse HEAD)" "$title" "$state" "$classify" <<'PY'
          import json, sys
          path, pr, ref, kind, head, base, merge, title, state, classify = sys.argv[1:]
          layer = {"schema": 1, "repo": "manaflow-ai/cmux", "title": title, "state": state,
                   "head": head, "base": base, "merge": merge, "classify": json.loads(classify)}
          if pr:
              layer["pr"] = int(pr)
          else:
              layer["kind"], layer["ref"] = kind, ref
          json.dump(layer, open(path, "w"), indent=1, sort_keys=True)
          PY
          cat "$RUNNER_TEMP/pr-layer/layer.json"

      - name: Source key and whether it is published
        id: key
        run: |
          set -euo pipefail
          key="$(python3 scripts/cmux-next/web-bundle-key.py . --source)"
          [[ "$key" =~ ^[0-9a-f]{64}$ ]]
          echo "key=$key" >> "$GITHUB_OUTPUT"
          manifest="$RUNNER_TEMP/web-bundle-manifest.json"
          code="$(curl -sS -o "$manifest" -w '%{http_code}' --retry 3 --max-time 60 "https://files.cmux.com/cmux-next-web/$key/manifest.json?verify=$GITHUB_RUN_ID" || true)"
          if [[ "$code" != 200 ]]; then
            echo "published=false" >> "$GITHUB_OUTPUT"
          elif python3 - "$manifest" <<'PY'
          import json, sys
          import runpy
          import os
          manifest = json.load(open(sys.argv[1]))
          key = runpy.run_path("scripts/cmux-next/web-bundle-key.py")
          raise SystemExit(0 if key["manifest_matches_toolchain"](
              manifest, key["declared_bun_version"]("."), os.environ["CMUX_WEB_NODE_VERSION"]
          ) else 1)
          PY
          then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "web bundles for $key are already published with the pinned Bun/Node toolchain" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::the existing manifest for $key has a different Bun/Node toolchain; refusing immutable-key publication"
            exit 1
          fi

      - name: Setup Bun
        if: steps.key.outputs.published != 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
          no-cache: ${{ !startsWith(github.workspace, '/home/runner/work/') }}

      - name: Give this job its own bun
        if: steps.key.outputs.published != 'true'
        run: scripts/cmux-next/private-bun.sh

      # The webviews app's `vp build` must run on node (build-web-bundles.sh).
      - name: Setup Node
        if: steps.key.outputs.published != 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.CMUX_WEB_NODE_VERSION }}

      - name: Build the web bundles
        if: steps.key.outputs.published != 'true'
        run: scripts/cmux-next/build-web-bundles.sh --out-root "$RUNNER_TEMP/web-bundles-out"

      - name: Pack the archive and the manifest
        if: steps.key.outputs.published != 'true'
        env:
          KEY: ${{ steps.key.outputs.key }}
        run: |
          set -euo pipefail
          [[ "$(python3 scripts/cmux-next/web-bundle-key.py . --source)" == "$KEY" ]] || { echo "the build changed a bundle input" >&2; exit 1; }
          dir="$RUNNER_TEMP/web-bundles-publish"; mkdir -p "$dir"
          sha="$(python3 scripts/cmux-next/web-bundle-archive.py pack "$RUNNER_TEMP/web-bundles-out" "$dir/web-bundles.tar.gz")"
          archive="web-bundles-$sha.tar.gz"
          mv "$dir/web-bundles.tar.gz" "$dir/$archive"
          python3 - "$dir/manifest.json" "$KEY" "$archive" "$sha" "$(stat -c %s "$dir/$archive")" <<'PY'
          import json, os, runpy, subprocess, sys
          path, key, archive, sha, size = sys.argv[1:]
          normalize = runpy.run_path("scripts/cmux-next/web-bundle-key.py")["normalize_toolchain_version"]
          outputs = subprocess.run(["python3", "scripts/cmux-next/web-bundle-key.py", os.environ["RUNNER_TEMP"] + "/web-bundles-out", "--outputs"],
                                   capture_output=True, text=True).stdout.strip()
          commit = subprocess.run(["git", "rev-parse", "HEAD"], capture_output=True, text=True, check=True).stdout.strip()
          json.dump({"schema": 1, "key": key, "commit": commit, "run_id": int(os.environ["GITHUB_RUN_ID"]),
                     "archive": archive, "sha256": sha, "size": int(size),
                     "bun": normalize(subprocess.run(["bun", "--version"], capture_output=True, text=True).stdout),
                     "node": normalize(subprocess.run(["node", "--version"], capture_output=True, text=True).stdout),
                     "outputs": outputs or None}, open(path, "w"), indent=1, sort_keys=True)
          PY
          cat "$dir/manifest.json"

      - name: Hand the archive to the publish job
        if: steps.key.outputs.published != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cmux-next-web-bundles
          path: ${{ runner.temp }}/web-bundles-publish
          if-no-files-found: error
          retention-days: 3

      # The PR layer's pointer: the layer facts, its key and the web ABI it needs. Handed on
      # even when the key was already published, so the pointer always moves to this head.
      - name: Write the PR layer pointer
        if: inputs.pr || inputs.ref
        env:
          KEY: ${{ steps.key.outputs.key }}
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/pr-layer/layer.json" "$KEY" <<'PY'
          import json, sys
          path, key = sys.argv[1:]
          layer = json.load(open(path))
          layer["key"] = key
          layer["abi"] = int(json.load(open("webviews/src/web-abi.json"))["abi"])
          layer["run_id"] = int(__import__("os").environ["GITHUB_RUN_ID"])
          json.dump(layer, open(path, "w"), indent=1, sort_keys=True)
          PY
          cat "$RUNNER_TEMP/pr-layer/layer.json"

      - name: Hand the PR layer pointer to the publish job
        if: inputs.pr || inputs.ref
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cmux-next-web-pr-layer
          path: ${{ runner.temp }}/pr-layer
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: build
    if: needs.build.outputs.published != 'true' || inputs.pr || inputs.ref
    name: publish the web bundles to files.cmux.com
    environment:
      name: artifacts
      deployment: ${{ !inputs.pr && !inputs.ref && contains(fromJSON('["refs/heads/main","refs/heads/feat-cmux-next","refs/heads/nightly-next"]'), github.ref) }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.LINUX_RUNNER || fromJSON(vars.RUNNER_POOLS).linux_4 }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Download the archive
        if: needs.build.outputs.published != 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cmux-next-web-bundles
          path: ${{ runner.temp }}/web-bundles-publish

      - name: Upload to R2 (archive first, manifest last)
        if: needs.build.outputs.published != 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: "https://${{ secrets.CF_R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
          KEY: ${{ needs.build.outputs.key }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/web-bundles-publish"
          archive="$(python3 -c 'import json,sys; m=json.load(open(sys.argv[1])); assert m["key"]==sys.argv[2]; print(m["archive"])' "$dir/manifest.json" "$KEY")"
          [[ "$archive" =~ ^web-bundles-[0-9a-f]{64}\.tar\.gz$ && -f "$dir/$archive" ]]
          published() { [[ "$(curl -sS -o /dev/null -w '%{http_code}' --max-time 60 "https://files.cmux.com/cmux-next-web/$KEY/manifest.json?verify=$GITHUB_RUN_ID-$1" || true)" == 200 ]]; }
          if published a; then echo "key $KEY was published meanwhile; nothing to do"; exit 0; fi
          up() { python3 scripts/ci/upload-r2-object.py --write-once --endpoint-url "$R2_ENDPOINT" --bucket cmux-binaries \
                   --cache-control "public, max-age=31536000, immutable" --file "$1" --key "cmux-next-web/$KEY/$2" --content-type "$3"; }
          up "$dir/$archive" "$archive" application/gzip
          up "$dir/manifest.json" manifest.json application/json || published b

      - name: Verify the publication with the fetch helper
        env:
          KEY: ${{ needs.build.outputs.key }}
        run: |
          set -euo pipefail
          out="$(scripts/cmux-next/fetch-web-bundles.sh --key "$KEY" --out "$RUNNER_TEMP/web-bundles-fetched")"
          test -d "$out/Packages/macOS/CmuxNext/Sources/CmuxNextAgentPane/Resources/agent-pane"
          echo "published https://files.cmux.com/cmux-next-web/$KEY/manifest.json" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Download the PR layer pointer
        if: inputs.pr || inputs.ref
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cmux-next-web-pr-layer
          path: ${{ runner.temp }}/pr-layer

      # The pointer is not content-addressed: latest.json moves to every new head (short cache),
      # and <head>-<base>.json names one layer for good.
      - name: Upload the PR layer pointer
        if: inputs.pr || inputs.ref
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: "https://${{ secrets.CF_R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
          KEY: ${{ needs.build.outputs.key }}
          PR: ${{ inputs.pr }}
          REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          layer="$RUNNER_TEMP/pr-layer/layer.json"
          read -r head base <<<"$(python3 -c 'import json,sys; m=json.load(open(sys.argv[1])); assert m["key"]==sys.argv[2] and (m.get("pr")==int(sys.argv[3]) if sys.argv[3] else m.get("ref")==sys.argv[4]); print(m["head"], m["base"])' "$layer" "$KEY" "$PR" "$REF")"
          [[ "$head" =~ ^[0-9a-f]{40}$ && "$base" =~ ^[0-9a-f]{40}$ ]]
          if [[ -n "$PR" ]]; then folder="pr/$PR"; else folder="ref/${REF//\//--}"; fi
          up() { python3 scripts/ci/upload-r2-object.py --endpoint-url "$R2_ENDPOINT" --bucket cmux-binaries \
                   --cache-control "$2" --file "$layer" --key "cmux-next-web/$folder/$1" --content-type application/json; }
          up "$head-$base.json" "public, max-age=31536000, immutable"
          up latest.json "public, max-age=30, must-revalidate"
          curl -fsS --retry 3 --max-time 60 "https://files.cmux.com/cmux-next-web/$folder/latest.json?check=$GITHUB_RUN_ID" | python3 -c 'import json,sys; m=json.load(sys.stdin); assert m["key"]==sys.argv[1], m' "$KEY"
          echo "${PR:+#}${PR:-$REF} layer ${head:0:12} on ${base:0:12} -> $KEY: https://files.cmux.com/cmux-next-web/$folder/latest.json" | tee -a "$GITHUB_STEP_SUMMARY"

  # The web update channels (plans/cmux-next/web-ota.md): every-merge follows
  # feat-cmux-next, while nightly follows the promoted nightly-next branch. Both
  # point at this push's bundles, signed with the ed25519 key the app trusts,
  # so a NIGHTLY app serves a merged web change minutes later, with no Mac build. Also runs when
  # the key was already published (a revert to known bundles). Like publish, it runs no bun or
  # node: only this checkout's scripts touch the signing key. An older run never moves the
  # pointer back (web-ota-pointer.py newer).
  pointer:
    needs: [build, publish]
    if: ${{ always() && !inputs.pr && !inputs.ref && needs.build.result == 'success' && (needs.publish.result == 'success' || needs.publish.result == 'skipped') }}
    name: sign the web update pointer
    environment:
      name: artifacts
      deployment: ${{ contains(fromJSON('["refs/heads/main","refs/heads/feat-cmux-next","refs/heads/nightly-next"]'), github.ref) }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.LINUX_RUNNER || fromJSON(vars.RUNNER_POOLS).linux_4 }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Sign and upload the pointer
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: "https://${{ secrets.CF_R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
          SIGNING_KEY: ${{ secrets.CMUX_WEB_OTA_SIGNING_KEY }}
          KEY: ${{ needs.build.outputs.key }}
          CHANNEL: ${{ github.ref_name == 'nightly-next' && 'nightly' || 'every-merge' }}
        run: |
          set -euo pipefail
          if [[ -z "$SIGNING_KEY" ]]; then
            echo "::error::CMUX_WEB_OTA_SIGNING_KEY is required for the production web update pointer"
            exit 1
          fi
          ptr=scripts/cmux-next/web-ota-pointer.py
          keys=Packages/macOS/CmuxNext/Sources/CmuxNextUpdater/Resources/web-update-keys.json
          dir="$RUNNER_TEMP/web-ota"
          mkdir -p "$dir" && chmod 700 "$dir"
          trap 'rm -f "$dir/key.pem"' EXIT
          (umask 077; printf '%s\n' "$SIGNING_KEY" > "$dir/key.pem")
          curl -fsS --retry 3 --max-time 60 -o "$dir/manifest.json" "https://files.cmux.com/cmux-next-web/$KEY/manifest.json?pointer=$GITHUB_RUN_ID"
          # Any payload failure, including a missing outputs digest, fails production
          # publication. Exit 3 is only meaningful for the newer-pointer no-op below.
          rc=0
          python3 "$ptr" payload --manifest "$dir/manifest.json" --abi-file webviews/src/web-abi.json --channel "$CHANNEL" \
            --commit "$GITHUB_SHA" --committed-at "$(git show -s --format=%ct HEAD)" --out "$dir/payload.json" || rc=$?
          [[ $rc == 0 ]] || exit "$rc"
          python3 "$ptr" sign --payload "$dir/payload.json" --key "$dir/key.pem" --keys "$keys" --out "$dir/$CHANNEL.json"
          rm -f "$dir/key.pem"
          code="$(curl -sS -o "$dir/current.json" -w '%{http_code}' --retry 3 --max-time 60 "https://files.cmux.com/cmux-next-web/ota/$CHANNEL.json?pointer=$GITHUB_RUN_ID" || true)"
          [[ "$code" == 200 ]] || rm -f "$dir/current.json"
          python3 "$ptr" newer --pointer "$dir/$CHANNEL.json" --keys "$keys" --current "$dir/current.json" || rc=$?
          [[ $rc == 3 ]] && exit 0
          [[ $rc == 0 ]] || exit "$rc"
          python3 scripts/ci/upload-r2-object.py --endpoint-url "$R2_ENDPOINT" --bucket cmux-binaries \
            --cache-control "public, max-age=60, must-revalidate" --file "$dir/$CHANNEL.json" \
            --key "cmux-next-web/ota/$CHANNEL.json" --content-type application/json
          curl -fsS --retry 3 --max-time 60 -o "$dir/check.json" "https://files.cmux.com/cmux-next-web/ota/$CHANNEL.json?check=$GITHUB_RUN_ID"
          python3 "$ptr" verify --pointer "$dir/check.json" --keys "$keys" --channel "$CHANNEL"
          echo "$CHANNEL web update -> $KEY (${GITHUB_SHA:0:12})" | tee -a "$GITHUB_STEP_SUMMARY"
