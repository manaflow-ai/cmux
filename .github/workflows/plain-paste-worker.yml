name: Plain paste worker controls
on:
  pull_request:
    paths:
      - 'workers/cmux-paste-text/**'
      - 'scripts/build-plain-text-paste-worker.sh'
      - 'tests/test_plain_text_paste_worker.py'
      - 'tests/fixtures/plain_paste_provider.m'
      - 'tests/fixtures/plain_paste_client.swift'
      - 'Sources/TerminalPlainTextPasteWorker*.swift'
      - 'Sources/TerminalPastePreparationWorkerClient.swift'
      - 'Sources/TerminalPastePreparationWorkerError.swift'
      - '.github/workflows/plain-paste-worker.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
env:
  # Temporary REST budget attribution: one gh-call line per GitHub API call (scripts/ci/api_call_log/env.sh, fetched at a fixed commit when the checkout has no copy).
  BASH_ENV: '$({ w="${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh"; t="${RUNNER_TEMP:-/nonexistent}/api-call-log-src"; if [ -f "$w" ]; then echo "$w"; elif [ -n "${RUNNER_TEMP:-}" ]; then if [ ! -f "$t/env.sh" ] && [ ! -e "$t.tried" ] && { [ "${RUNNER_OS:-}" = Linux ] || [ "${RUNNER_OS:-}" = macOS ]; } && [ "$(date -u +%Y%m%d%H)" -lt 2026112300 ]; then : > "$t.tried"; mkdir -p "$t.part" && for x in env.sh gh sitecustomize.py isolated.py; do curl -fsSL --max-time 5 -o "$t.part/$x" "https://raw.githubusercontent.com/manaflow-ai/cmux/27647ffd3ae838c63be28ca3e5883dcd68c34518/scripts/ci/api_call_log/$x" || break; done; [ -s "$t.part/isolated.py" ] && mv "$t.part" "$t"; fi; if [ -f "$t/env.sh" ]; then echo "$t/env.sh"; else echo unset BASH_ENV > "$t.off.sh" && echo "$t.off.sh"; fi; fi; } 2>/dev/null)'

jobs:
  paste-worker-macos-15:
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'macos-15' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-6vcpu-macos-15' || vars.CI_PAID_MACOS_OVERFLOW == '1' && vars.MACOS_RUNNER_15 || 'blacksmith-6vcpu-macos-15') }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Require reporter OS family
        run: |
          sw_vers
          test "$(sw_vers -productVersion | cut -d. -f1)" = 15
      - name: Select Xcode
        run: ./scripts/select-ci-xcode.sh
      - name: Build only the isolated helper and provider fixture
        run: |
          mkdir -p "$RUNNER_TEMP/plain-paste"
          scripts/build-plain-text-paste-worker.sh "$RUNNER_TEMP/plain-paste/helper" 'arm64 x86_64'
          xcrun clang -fobjc-arc -fmodules -Wall -Wextra -Werror -framework AppKit \
            tests/fixtures/plain_paste_provider.m -o "$RUNNER_TEMP/plain-paste/provider"
          codesign --verify --strict "$RUNNER_TEMP/plain-paste/helper"
          xcrun swiftc -swift-version 6 -parse-as-library \
            Sources/TerminalPlainTextPasteWorkerPool.swift \
            Sources/TerminalPlainTextPasteWorkerConnection.swift \
            Sources/TerminalPastePreparationWorkerError.swift \
            tests/fixtures/plain_paste_client.swift -o "$RUNNER_TEMP/plain-paste/client"
      - name: Exercise actual pasteboard providers and lifecycle
        env:
          CMUX_PASTE_HELPER: ${{ runner.temp }}/plain-paste/helper
          CMUX_PASTE_PROVIDER: ${{ runner.temp }}/plain-paste/provider
          CMUX_PASTE_CLIENT: ${{ runner.temp }}/plain-paste/client
        run: python3 tests/test_plain_text_paste_worker.py 2>&1 | tee "$RUNNER_TEMP/plain-paste/results.log"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          retention-days: 1
          name: plain-paste-controls-macos15
          path: ${{ runner.temp }}/plain-paste/results.log
