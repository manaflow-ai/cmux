name: CodeRouter transfer tests

on:
  push:
    branches: [main]
    paths:
      - web/services/coderouter/**
      - web/app/api/coderouter/accounts/**
      - web/db/**
      - web/tests/coderouter-transfer-*.test.ts
      - web/package.json
      - web/bun.lock
      - .github/workflows/coderouter-transfer-tests.yml
  pull_request:
    paths:
      - web/services/coderouter/**
      - web/app/api/coderouter/accounts/**
      - web/db/**
      - web/tests/coderouter-transfer-*.test.ts
      - web/package.json
      - web/bun.lock
      - .github/workflows/coderouter-transfer-tests.yml

permissions:
  contents: read

jobs:
  transfer:
    runs-on: ${{ vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cmux_test
          POSTGRES_PASSWORD: cmux
          POSTGRES_USER: cmux
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cmux -d cmux_test"
          --health-interval 1s
          --health-timeout 5s
          --health-retries 30
    env:
      CMUX_DB_TEST: "1"
      DATABASE_URL: postgres://cmux:cmux@localhost:5432/cmux_test
      DIRECT_DATABASE_URL: postgres://cmux:cmux@localhost:5432/cmux_test
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bunx drizzle-kit migrate --config drizzle.config.ts
      - run: bun test --max-concurrency=1 tests/coderouter-transfer-db-behavior.test.ts
      - run: bun test tests/coderouter-transfer-route.test.ts
      - run: bun run typecheck
