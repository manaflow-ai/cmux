name: Cloud machine channel (thin, every push)

# MACHINE_CHANNEL_EVERY_PUSH (Leo: "how ab the deploys too? for cloud? and optimize those").
# cmux-tui-artifacts.yml builds the Cloud machine channel's thin x86_64 cmux-tui
# (build-machine-channel-x86_64 -> point-machine-channel-early) only in the run that won
# base-coalesce's window: the first feat-cmux-next push of each NEXT_TUI_ARTIFACTS_HOLD_MINUTES
# (60) window. Every later push in the window gets run=false and builds nothing, so a fix merged
# mid-window waited for the next window's first push before its ~21 min thin build even started:
# up to 60 + 27 min from merge to warm Cloud machines. 7abd2948 (run 45600240822, a window
# opener) took 27 min: coalesce 8 s, preflight 11 s, thin x86_64 build 11:00:32-11:21:38Z (21 min),
# point 11:21:43-11:22:22Z.
#
# This workflow builds the same thin x86_64 leg on every feat-cmux-next push that can change the
# binaries, outside the coalesce window, and points the channel the same way. Newest wins: one run
# builds and one waits (workflow concurrency, cancel-in-progress false); a newer push replaces the
# waiting run, so at most one thin build runs at a time and a started build is never cancelled.
# The point is forward-only (web-ota-pointer.py newer) and write-once per commit
# (scripts/ci/cmux-machine-linux-bytes.sh: another run's bytes for the same commit win and this
# skips, rc 3), so a window opener whose tree run also points its commit is harmless.
# cmux-tui-artifacts.yml's own early points, aarch64 completion and fat fallback are unchanged.
# Off switch: repository variable NEXT_MACHINE_CHANNEL_EVERY_PUSH=0.

on:
  push:
    branches:
      - feat-cmux-next
    # The tree inputs that reach the Linux cmux-tui (scripts/cmux-next/cmux-tui-tree-inputs.txt):
    # a web-only push changes no byte the channel ships.
    paths:
      - "cmux-tui/**"
      - "!cmux-tui/docs/**"
      - "webviews/**"
      - "schemas/**"
      - "web/data/model-catalog/**"
      - "ghostty"
      - "ghostty-next"
      - "first-party-apps/cloud/server/**"
      - "workers/cmux-vm/cli/**"
      - "scripts/cmux-next/**"
      - "scripts/ci/**"
      - ".github/actions/setup-cmux-tui-rust/**"
      - ".github/workflows/cmux-tui-build-package.yml"
      - ".github/workflows/cmux-machine-channel-thin.yml"

concurrency:
  group: cmux-machine-channel-thin
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  profiles:
    name: read the machine channel build profile
    if: ${{ github.repository == 'manaflow-ai/cmux' && github.run_attempt == 1 && format('{0}', vars.NEXT_MACHINE_CHANNEL_EVERY_PUSH) != '0' }}
    runs-on: cmux-gcp-nightly-x64
    timeout-minutes: 5
    outputs:
      build_profiles: ${{ steps.read.outputs.build_profiles }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/cmux-next/cmux-tui-build-profiles.json
            .gitmodules
          sparse-checkout-cone-mode: false
      - id: read
        shell: bash
        run: |
          set -euo pipefail
          echo "build_profiles=$(jq -c . scripts/cmux-next/cmux-tui-build-profiles.json)" >> "$GITHUB_OUTPUT"

  build:
    name: build-machine-channel
    needs: profiles
    permissions:
      contents: read
      # The reusable package workflow's permission ceiling (cmux-tui-artifacts.yml's build).
      id-token: write
      attestations: write
    uses: ./.github/workflows/cmux-tui-build-package.yml
    # The R2 cargo cache (its thin key, shared with cmux-tui-artifacts.yml's thin legs).
    secrets:
      CI_CACHE_R2_ACCESS_KEY_ID: ${{ secrets.CI_CACHE_R2_ACCESS_KEY_ID }}
      CI_CACHE_R2_SECRET_ACCESS_KEY: ${{ secrets.CI_CACHE_R2_SECRET_ACCESS_KEY }}
      CI_CACHE_R2_ACCOUNT_ID: ${{ secrets.CI_CACHE_R2_ACCOUNT_ID }}
    with:
      version: 0.0.0-r2.sha-${{ github.sha }}
      package_npm: false
      package_pypi: false
      include_windows: false
      target_set: ${{ fromJSON(needs.profiles.outputs.build_profiles).machine_channel.x86_64_target_set }}
      lto: ${{ fromJSON(needs.profiles.outputs.build_profiles).machine_channel.lto }}
      artifact_prefix: ${{ fromJSON(needs.profiles.outputs.build_profiles).machine_channel.artifact_prefix }}
      linux_runner: cmux-linux

  point:
    # R2 credentials, as cmux-tui-artifacts.yml's point-machine-channel-early.
    environment:
      name: artifacts
      deployment: true
    name: point the Cloud machine channel at this commit's x86_64 Linux build
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: cmux-linux
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # The owned build lanes reuse the workspace (cmux-tui-artifacts.yml, run 44398113924).
      - name: Repair a reused self-hosted checkout
        shell: bash
        run: |
          if [ "${RUNNER_ENVIRONMENT:-}" = self-hosted ]; then
            git sparse-checkout disable 2>/dev/null || true
            git reset -q --hard HEAD
          fi

      - name: Download the machine channel's x86_64 cmux-tui binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: machine-channel-cmux-tui-x86_64-unknown-linux-musl
          path: assets/cmux-tui
          merge-multiple: true

      - name: Upload the Linux binaries and point the channel
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: "https://${{ secrets.CF_R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
          SIGNING_KEY: ${{ secrets.CMUX_WEB_OTA_SIGNING_KEY }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/machine-channel"
          mkdir -p "$dir" && chmod 700 "$dir"
          # Write-once: another run that uploaded this commit's bytes first keeps them, and this skips.
          rc=0
          scripts/ci/cmux-machine-linux-bytes.sh early assets/cmux-tui || rc=$?
          [[ $rc == 3 ]] && exit 0
          [[ $rc == 0 ]] || exit "$rc"
          python3 scripts/ci/cmux-machine-channel.py payload --binaries-dir assets/cmux-tui --machine-path \
            --commit "$GITHUB_SHA" --committed-at "$(git show -s --format=%ct HEAD)" \
            --download-dir "$dir/binaries" --out "$dir/payload.json" --target x86_64-unknown-linux-musl
          rm -rf "$dir/binaries"
          scripts/ci/cmux-machine-channel-point.sh "$dir/payload.json" "$dir"
