name: cmux-next hot verify

# Look first, then test (Leo, 2026-11-15): "front load that. Just screenshot it, take a video, touch it,
# interact with it, click around with it, and then push it through the various testing instead of the other way
# around." And: "maybe the code doesn't even need to be compiled". A pull request whose change the engine
# (scripts/cmux-next/hot-verify.py plan) can put onto a running NEXT nightly with no build (layers web, rust or
# customize, needs_build false) is looked at on a fleet Mac right after the push, beside the slow checks, and
# gets ONE comment: the marker line, the app build (nightly build and CMUXCommit), the PR head as the tested
# version, before/after light and dark, the video and the phase timings (push_to_first_shot_s among them). A new
# head edits that comment in place. Advisory: never a required check, never gates a merge.
#
# Two halves, the cmux-next-media hand-off shape. The pull request run (this file as the PR has it, no secret,
# read-only token) runs the plan on the PR head and, for an eligible change, starts a run of this workflow on
# feat-cmux-next (workflow_dispatch pr/head/layers). That run takes this file and every script from the
# protected branch, never from the PR:
#   - web: one dispatch of cmux-next-web-bundle-publish.yml (pr=N, its own credentials); nothing waits for it
#     (the worker serves the head's web itself when latest.json does not name the head yet)
#   - rust: the head's cmux-tui tree key (cmux-tui-artifacts.yml publishes cmux-tui/tree/<key>/completion.json for a
#     same-repository PR head, written last). The worker looks at a sha: source, which gets no cargo build, so the
#     daemon comes only from the published tree; 6 of 8 looks that failed on a worker (2026-11-15/16) had started
#     before it was published.
#   - request: a job on a Linux runner whose NAME is the look's request
#     (`hot verify request pr=N head=SHA attempt=A kind=K event=E layers=L [tree=KEY]`). It runs nothing. The build
#     fleet controller reads it from the workflow_job webhook (cmuxterm-hq build-fleet/cmd/controller/hot_verify_look.go),
#     waits for the tree a rust look names, queues build-fleet/pr_capture/fleet-step-hot-verify.sh on a display
#     worker (it copies the NEXT nightly, applies the change with the engine from the feat-cmux-next tip, shoots,
#     clicks, records), and when the step ends dispatches this workflow on feat-cmux-next again with look_result:
#     the step's state and a signed link to its out.tar. No GitHub runner waits for a fleet Mac (Leo, 2026-11-18,
#     on CI time: "You do it. Just do it. Keep doing it."): the look job used to hold a Mac mini runner for the
#     whole queue wait, 13,591 runner-minutes on 2026-11-17, and the rust job polled on Linux for 6,035 more.
#   - publish (the look_result run): the pr-media environment (it admits only the protected branches) downloads
#     out.tar as data, checks every file with the shared pr-media privacy check (the worker's own text reader's
#     lines too), uploads through .github/actions/pr-media-publish and writes the comment
#     (scripts/cmux-next/hot-verify-ci.py render/post), all in one job. A look with no out.tar starts one more look.
# No engine on the PR head or the base yet, a needs-build plan (against the published nightly's CMUXCommit, as the
# worker plans): each ends the run with a step-summary line and no comment.
on:
  pull_request:
    branches: [feat-cmux-next]
    # closed: a PR that merged with no look receipt gets one look at its merge commit (the `plan` job).
    types: [opened, synchronize, reopened, ready_for_review, closed]
    # Path gate (2026-11-21, CI 10x; Leo: "Make each one advisory, after-merge or path-gated, unless it caught a real
    # failure"). A look needs a layer the engine can put onto the running nightly with no build: web (webviews/,
    # cmux-tui/frontends/web/) or rust (the cmux-tui tree build's inputs that live_apply.py sorts as daemon: cmux-tui/,
    # acpmux/, Rust and Cargo manifests; scripts/cmux-next/cmux-tui-tree-inputs.txt). Any other change plans
    # "nothing in the app changes" or "needs a build", so its head started a run, a Linux runner and a plan for no
    # look (6,879 heads planned in 11-13..19, 1 own red). Only a change that can reach a layer starts it now, the
    # merged (closed) half included; the `!` lines are scripts/ci/docs_only_paths.py's prose excludes. A change to the
    # engine's layer rules (live_apply.py, hot-apply.py) updates this list in the same pull request.
    paths:
      - "webviews/**"
      - "cmux-tui/**"
      - "acpmux/**"
      - "first-party-apps/cloud/server/**"
      - "**/*.rs"
      - "**/Cargo.toml"
      - ".github/workflows/cmux-next-hot-verify.yml"
      - "!**/*.md"
      - "!docs/**/*.png"
      - "!docs/**/*.jpg"
      - "!docs/**/*.gif"
      - "!docs/**/*.webp"
      - "!plans/**/*.png"
      - "!plans/**/*.jpg"
      - "!plans/**/*.gif"
      - "!plans/**/*.webp"
  # docs-only-fallback.yml calls this in a pull request's own context when GitHub's `paths:` could have skipped it
  # wrongly (over 300 changed files, or a full-ci/dev-build label): scripts/ci/docs_only_paths.py.
  workflow_call:
  # GitHub dispatches only a workflow it knows on a branch; a push that changes this file registers it on
  # feat-cmux-next (its jobs skip), as cmux-tui-tree-request.yml does.
  push:
    branches: [feat-cmux-next]
    paths: [.github/workflows/cmux-next-hot-verify.yml]
  workflow_dispatch:
    inputs:
      pr:
        description: "The same-repository pull request into feat-cmux-next to look at"
        required: true
        type: string
      head:
        description: "Its head (40 hex); a run for a head the PR moved past posts nothing"
        required: true
        type: string
      layers:
        description: "The plan's layers (web, rust, customize; comma-separated)"
        required: true
        type: string
      event_at:
        description: "Epoch seconds of the pull request event (push to comment time)"
        required: false
        default: ""
        type: string
      attempt:
        description: "1 for the one more look a result run starts after a look the fleet lost"
        required: false
        default: "0"
        type: string
      kind:
        description: "head: the PR head; merge: a merged PR's merge commit"
        required: false
        default: "head"
        type: string
      look_result:
        description: "Set by the build fleet controller only: the fleet step's result (JSON) for the run that posts it"
        required: false
        default: ""
        type: string

permissions: {}

# One look per pull request: a newer head replaces the older one, in either half. The look at a merge commit has
# its own group, so it never cancels a head look still queued or running when the PR merged. A result run has its
# own group per head: it never cancels a newer head's request run, nor one that one cancels it.
concurrency:
  group: cmux-next-hot-verify-${{ github.event_name }}-${{ github.event.pull_request.number || inputs.pr || github.sha }}${{ (github.event.action == 'closed' || inputs.kind == 'merge') && '-merge' || '' }}${{ inputs.look_result != '' && format('-result-{0}', inputs.head) || '' }}
  cancel-in-progress: true

env:
  # Temporary REST budget attribution: one gh-call line per GitHub API call (scripts/ci/api_call_log/env.sh). It
  # switches itself off at 2026-11-22 00:00 UTC.
  BASH_ENV: '$({ w="${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh"; t="${RUNNER_TEMP:-/nonexistent}/api-call-log-src"; if [ -f "$w" ]; then echo "$w"; elif [ -n "${RUNNER_TEMP:-}" ]; then if [ ! -f "$t/env.sh" ] && [ ! -e "$t.tried" ] && { [ "${RUNNER_OS:-}" = Linux ] || [ "${RUNNER_OS:-}" = macOS ]; } && [ "$(date -u +%Y%m%d%H)" -lt 2026112300 ]; then : > "$t.tried"; mkdir -p "$t.part" && for x in env.sh gh sitecustomize.py isolated.py; do curl -fsSL --max-time 5 -o "$t.part/$x" "https://raw.githubusercontent.com/manaflow-ai/cmux/27647ffd3ae838c63be28ca3e5883dcd68c34518/scripts/ci/api_call_log/$x" || break; done; [ -s "$t.part/isolated.py" ] && mv "$t.part" "$t"; fi; if [ -f "$t/env.sh" ]; then echo "$t/env.sh"; else echo unset BASH_ENV > "$t.off.sh" && echo "$t.off.sh"; fi; fi; } 2>/dev/null)'

jobs:
  # The pull request half: the engine's plan, on the PR head, with no secret. Drafts wait until they are ready,
  # forks never run, and CI_QUOTA_HOLD=1 pauses it while the GITHUB_TOKEN budget is held for the nightly.
  plan:
    name: plan the look
    if: ${{ vars.CI_QUOTA_HOLD != '1' && github.repository == 'manaflow-ai/cmux' && github.event_name == 'pull_request' && !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository && (github.event.action != 'closed' || github.event.pull_request.merged) }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-4vcpu-ubuntu-2404' || vars.LINUX_RUNNER || fromJSON(vars.RUNNER_POOLS).linux_4 }}
    timeout-minutes: 10
    permissions:
      contents: read
      # the merged half reads the PR's comments for a look receipt (hot-verify-receipt.py)
      issues: read
      pull-requests: read
    outputs:
      eligible: ${{ steps.plan.outputs.eligible }}
      layers: ${{ steps.plan.outputs.layers }}
    steps:
      # The engine and this workflow's helper come from the base branch (the same rules for every PR, as the
      # fleet step's engine does); the PR head is fetched as git objects and planned as `sha:` (no worktree
      # of it). A PR that brings the engine itself, before the base has one, is planned with its own scripts/.
      - name: Checkout the base branch's scripts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          persist-credentials: false
          filter: blob:none
          sparse-checkout: scripts
          sparse-checkout-cone-mode: true
      - name: Plan
        id: plan
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR: ${{ github.event.pull_request.number }}
          # A merged PR (the closed event) is planned at its merge commit: on feat-cmux-next, the engine plans the
          # change from the commit's first parent, with the nightly behind it.
          HEAD_SHA: ${{ github.event.action == 'closed' && github.event.pull_request.merge_commit_sha || github.event.pull_request.head.sha }}
          MERGED: ${{ github.event.action == 'closed' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # A merged PR that already has a look receipt (any head) needs no look at its merge commit. Only a receipt
          # that was found skips. An unreadable answer (the token out of quota) still looks: a second look costs one
          # fleet look and edits the bot's receipt comment, while skipping lost #45098's look (run 44033383427).
          if [[ "$MERGED" == true ]]; then
            receipt="$(python3 scripts/cmux-next/hot-verify-receipt.py --pr "$PR" --repo "$GITHUB_REPOSITORY")" || receipt="receipt=unknown"
            if [[ "$receipt" == receipt=unknown ]]; then
              echo "hot verify: #$PR's look receipt could not be read; looking at its merge commit anyway" | tee -a "$GITHUB_STEP_SUMMARY"
            elif [[ "$receipt" != receipt=false ]]; then
              echo "eligible=false" >> "$GITHUB_OUTPUT"
              echo "hot verify: #$PR merged with a look receipt already ($receipt); no look at its merge commit" | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi
          # The plan sorts the change against its merge base with origin/feat-cmux-next (no app on Linux):
          # 45 days of history, as the fleet step's engine clone keeps.
          since="$(date -u -d '45 days ago' +%Y-%m-%d)"
          timeout 600 git fetch -q --no-tags --filter=blob:none --shallow-since="$since" origin \
            "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF" "+refs/pull/$PR/head:refs/remotes/pr/head"
          # The checkout's depth-1 fetch marks the base tip shallow, and --shallow-since does not deepen a tip
          # the clone already has: #43862's head then shared no history with it, and the plan failed at
          # `git merge-base` (5 of 9 looks, 2026-11-15T18:2xZ). Deepen until they meet, doubling each time: the
          # branch takes about 700 commits a day, and 200 to 25600 reaches past the 45 days fetched above.
          for depth in 200 400 800 1600 3200 6400 12800 25600; do
            git merge-base refs/remotes/pr/head "refs/remotes/origin/$BASE_REF" > /dev/null 2>&1 && break
            timeout 120 git fetch -q --no-tags --filter=blob:none --deepen="$depth" origin \
              "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF" "+refs/pull/$PR/head:refs/remotes/pr/head"
          done
          if [[ "$MERGED" != true && "$(git rev-parse refs/remotes/pr/head)" != "$HEAD_SHA" ]]; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "hot verify: #$PR moved past ${HEAD_SHA:0:12}; its own run plans it" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ "$MERGED" == true ]] && ! git merge-base --is-ancestor "$HEAD_SHA" "refs/remotes/origin/$BASE_REF" 2>/dev/null; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "hot verify: #$PR's merge commit ${HEAD_SHA:0:12} is not on $BASE_REF; no look" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          [[ -f scripts/cmux-next/hot-verify.py ]] || git -c advice.detachedHead=false checkout -q --detach "$HEAD_SHA"
          engine=scripts/cmux-next/hot-verify.py
          tool=scripts/cmux-next/hot-verify-ci.py
          if [[ ! -f "$tool" || ! -f "$engine" ]]; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "hot verify: the engine (scripts/cmux-next/hot-verify.py) is not on $BASE_REF or this head yet; nothing to look at" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Plan against the nightly the worker copies (the NEXT feed's item, its cmux:sourceCommit), as the worker
          # plans: planned against the merge base, 128 steps a day (2026-11-17) queued for a Mac and ended "needs a
          # build" there. A feed or commit that cannot be read plans against the merge base, as before.
          base=()
          if [[ "$tool" == scripts/cmux-next/hot-verify-ci.py ]] && grep -q '"nightly-commit"' "$tool" \
              && curl -fsS --retry 2 --max-time 30 "https://files-next.cmux.com/nightly-next/appcast-arm64.xml?reader=cmux-hot-verify-plan" -o "$RUNNER_TEMP/feed.xml"; then
            nightly="$(python3 "$tool" nightly-commit "$RUNNER_TEMP/feed.xml" || true)"
            if [[ "$nightly" =~ ^[0-9a-f]{40}$ ]] && { git cat-file -e "$nightly^{commit}" 2>/dev/null \
                || timeout 120 git fetch -q --no-tags --filter=blob:none origin "$nightly" 2>/dev/null; } \
                && git cat-file -e "$nightly^{commit}" 2>/dev/null; then
              base=(--base "$nightly")
              echo "hot verify plan: against the NEXT nightly's commit ${nightly:0:12}" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "hot verify plan: the NEXT nightly's commit is not readable here; against the merge base" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          status=0
          timeout 300 python3 "$engine" plan --source "sha:$HEAD_SHA" --repo . ${base[@]+"${base[@]}"} --json > "$RUNNER_TEMP/plan.out" 2> "$RUNNER_TEMP/plan.err" || status=$?
          if [[ $status != 0 ]] || ! python3 -c 'import json,sys; json.load(open(sys.argv[1]))' "$RUNNER_TEMP/plan.out" 2>/dev/null; then
            # An engine without --json prints the text form.
            status=0
            timeout 300 python3 "$engine" plan --source "sha:$HEAD_SHA" --repo . ${base[@]+"${base[@]}"} > "$RUNNER_TEMP/plan.out" 2>> "$RUNNER_TEMP/plan.err" || status=$?
          fi
          if [[ $status != 0 ]]; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "hot verify: the engine's plan failed (exit $status); no look. $(tail -c 300 "$RUNNER_TEMP/plan.err" | tr '\n' ' ')" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 "$tool" verdict "$RUNNER_TEMP/plan.out" | tee -a "$GITHUB_OUTPUT"
          echo "hot verify plan: $(grep '^reason=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2-)" >> "$GITHUB_STEP_SUMMARY"

  # Start the look on feat-cmux-next. Data only: the run there reads the pull request again and takes nothing
  # else from here. A dispatch that never starts ends this job red (below).
  hand-off:
    name: start the look on feat-cmux-next
    needs: plan
    if: ${{ needs.plan.outputs.eligible == 'true' }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-4vcpu-ubuntu-2404' || vars.LINUX_RUNNER || fromJSON(vars.RUNNER_POOLS).linux_4 }}
    timeout-minutes: 25
    # actions: write starts the run; nothing here can write pr-media or the PR.
    permissions:
      actions: write
    steps:
      - name: Dispatch the look
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.action == 'closed' && github.event.pull_request.merge_commit_sha || github.event.pull_request.head.sha }}
          KIND: ${{ github.event.action == 'closed' && 'merge' || 'head' }}
          LAYERS: ${{ needs.plan.outputs.layers }}
          EVENT_AT: ${{ github.event.pull_request.updated_at }}
        run: |
          set -uo pipefail
          event_at="$(date -u -d "$EVENT_AT" +%s 2>/dev/null || date -u +%s)"
          # A dispatch that fails is a PR with no look. It used to print a line and end green, so no one saw the
          # PRs it lost. It now retries for at most 20 minutes (a rate limit waits for its reset, read from the
          # rate_limit endpoint, which costs no quota) and ends red if the look never started.
          deadline=$(( $(date +%s) + 20 * 60 ))
          pause=30
          for attempt in 1 2 3 4 5 6; do
            if gh workflow run cmux-next-hot-verify.yml --repo "$GITHUB_REPOSITORY" --ref feat-cmux-next \
                -f pr="$PR" -f head="$HEAD_SHA" -f layers="$LAYERS" -f event_at="$event_at" -f kind="$KIND" 2> "$RUNNER_TEMP/dispatch.err"; then
              echo "hot verify: the look ($LAYERS) runs on feat-cmux-next for ${HEAD_SHA:0:12} (attempt $attempt)" | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            why="$(tr '\n' ' ' < "$RUNNER_TEMP/dispatch.err" | cut -c1-200)"
            echo "hot verify: attempt $attempt could not start the look: $why"
            wait_s=$pause
            if grep -qi "rate limit" "$RUNNER_TEMP/dispatch.err"; then
              # Only a spent core bucket waits for its reset; a secondary rate limit keeps the short backoff.
              remaining=1 reset=0
              read -r remaining reset < <(gh api rate_limit --jq '"\(.resources.core.remaining) \(.resources.core.reset)"' 2>/dev/null || echo "1 0") || true
              [[ "$remaining" == 0 && "$reset" =~ ^[0-9]+$ ]] && (( reset > $(date +%s) )) && wait_s=$(( reset - $(date +%s) + 5 ))
            fi
            (( $(date +%s) + wait_s < deadline )) || break
            sleep "$wait_s"
            pause=$(( pause * 2 ))
          done
          echo "::error title=hot verify::could not start the look on feat-cmux-next for ${HEAD_SHA:0:12}: $why"
          echo "hot verify: no look for ${HEAD_SHA:0:12}; the dispatch failed: $why" >> "$GITHUB_STEP_SUMMARY"
          exit 1

  # The feat-cmux-next half. The pull request, read again: open, into feat-cmux-next, from this repository,
  # still at the head the plan saw.
  target:
    name: check the pull request
    if: ${{ github.event_name == 'workflow_dispatch' && github.repository == 'manaflow-ai/cmux' && github.ref == 'refs/heads/feat-cmux-next' && inputs.look_result == '' }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-4vcpu-ubuntu-2404' || vars.LINUX_RUNNER || fromJSON(vars.RUNNER_POOLS).linux_4 }}
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ok: ${{ steps.check.outputs.ok }}
      pr: ${{ steps.check.outputs.pr }}
      head: ${{ steps.check.outputs.head }}
      pr_head: ${{ steps.check.outputs.pr_head }}
      web: ${{ steps.check.outputs.web }}
      rust: ${{ steps.check.outputs.rust }}
      layers: ${{ steps.check.outputs.layers }}
      kind: ${{ steps.check.outputs.kind }}
      attempt: ${{ steps.check.outputs.attempt }}
      event_at: ${{ steps.check.outputs.event_at }}
    steps:
      - name: Checkout the pull request check
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |
            /scripts/cmux-next/hot-verify-pr.sh
            /scripts/ci/gh_budget_wait.sh
          sparse-checkout-cone-mode: false
      - name: Wait through GitHub API rate limits in this job's gh calls
        run: bash scripts/ci/gh_budget_wait.sh --install
      - name: Read the pull request
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr }}
          HEAD_SHA: ${{ inputs.head }}
          LAYERS: ${{ inputs.layers }}
          KIND: ${{ inputs.kind }}
          ATTEMPT: ${{ inputs.attempt }}
          EVENT_AT: ${{ inputs.event_at }}
        run: |
          bash scripts/cmux-next/hot-verify-pr.sh

  # The PR's web layer on files.cmux.com: one dispatch of cmux-next-web-bundle-publish.yml's own pr path (its
  # build job runs the PR's web build with no secret; its publish job holds its own credentials). Nothing waits
  # for it here: the look does not need it (the worker serves the head's web itself when latest.json does not name
  # the head yet), and the wait for latest.json held a Linux runner for up to 40 minutes per look.
  web:
    name: web layer
    needs: target
    if: ${{ inputs.look_result == '' && needs.target.outputs.ok == 'true' && needs.target.outputs.web == 'true' }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-4vcpu-ubuntu-2404' || vars.LINUX_RUNNER || fromJSON(vars.RUNNER_POOLS).linux_4 }}
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Start the web layer
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.target.outputs.pr }}
        run: |
          set -euo pipefail
          gh workflow run cmux-next-web-bundle-publish.yml --repo "$GITHUB_REPOSITORY" --ref feat-cmux-next -f pr="$PR"
          echo "web layer of #$PR: publishing (\`cmux customize use pr:$PR\` once files.cmux.com/cmux-next-web/pr/$PR/latest.json names the head)" >> "$GITHUB_STEP_SUMMARY"

  # The head's cmux-tui tree key. cmux-tui-artifacts.yml publishes the tree for a same-repository PR head, its
  # completion.json last; the build fleet controller queues the look once that answers (at most 50 minutes). No
  # runner waits for it: the old wait here held a Linux runner 6,035 minutes on 2026-11-17.
  rust:
    name: rust layer
    needs: target
    if: ${{ inputs.look_result == '' && needs.target.outputs.ok == 'true' && needs.target.outputs.rust == 'true' }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-4vcpu-ubuntu-2404' || vars.LINUX_RUNNER || fromJSON(vars.RUNNER_POOLS).linux_4 }}
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      - name: Checkout the pull request head (trees only)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.target.outputs.head }}
          persist-credentials: false
          filter: blob:none
          # The key script and its inputs list; the key itself reads git trees, which blob:none keeps.
          sparse-checkout: |
            /scripts/ci/cmux_tui_tree_key.py
            /scripts/cmux-next/cmux-tui-tree-inputs.txt
          sparse-checkout-cone-mode: false
      - name: The head's cmux-tui tree key
        id: key
        env:
          HEAD_SHA: ${{ needs.target.outputs.head }}
        run: |
          set -euo pipefail
          # The key script and its inputs list come from the head; the key reads git trees only (no PR code runs
          # beyond this script, and this job holds no secret).
          key="$(python3 scripts/ci/cmux_tui_tree_key.py --version v2 HEAD)"
          [[ "$key" =~ ^[0-9a-f]{40,64}$ ]] || { echo "::error::no cmux-tui tree key for ${HEAD_SHA:0:12}"; exit 1; }
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "cmux-tui tree of ${HEAD_SHA:0:12}: https://files.cmux.com/cmux-tui/tree/$key/ (the look is queued once it is published)" >> "$GITHUB_STEP_SUMMARY"

  # The look's request. The job runs nothing: its NAME is the request, and the build fleet controller reads it from
  # the workflow_job webhook when it ends green (cmuxterm-hq build-fleet/cmd/controller/hot_verify_look.go). The
  # controller queues the fleet step (and, for a rust look, waits for the tree first), supersedes the PR's queued
  # looks at other heads, and dispatches this workflow with look_result when the step ends. No runner waits.
  request:
    name: hot verify request pr=${{ needs.target.outputs.pr }} head=${{ needs.target.outputs.head }} attempt=${{ needs.target.outputs.attempt }} kind=${{ needs.target.outputs.kind }} event=${{ needs.target.outputs.event_at }} layers=${{ needs.target.outputs.layers }}${{ needs.rust.outputs.key != '' && format(' tree={0}', needs.rust.outputs.key) || '' }}
    needs: [target, rust]
    # After the rust job: skipped when the change has no rust layer.
    if: ${{ !cancelled() && inputs.look_result == '' && needs.target.outputs.ok == 'true' && (needs.rust.result == 'success' || needs.rust.result == 'skipped') }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-4vcpu-ubuntu-2404' || vars.LINUX_RUNNER || fromJSON(vars.RUNNER_POOLS).linux_4 }}
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Hand the look to the build fleet
        env:
          PR: ${{ needs.target.outputs.pr }}
          HEAD_SHA: ${{ needs.target.outputs.head }}
          TREE: ${{ needs.rust.outputs.key }}
        run: |
          echo "hot verify: the build fleet runs the look of #$PR at ${HEAD_SHA:0:12}${TREE:+ once its cmux-tui tree is published}; its result starts a run of this workflow that posts it" >> "$GITHUB_STEP_SUMMARY"

  # The result run: the build fleet controller's dispatch with look_result when the look's step ended. ONE job, so
  # a result waits for one Linux runner, not two in a row: on 2026-11-19 every result run's `target` sat queued for
  # the shared 4 vCPU Linux runners, and its `publish` or `again` queued again after it. It reads the PR (the same
  # check as `target`) and the step's result, as data: it must name this PR and head. An out.tar is checked and
  # posted. No out.tar means the look never judged the change: the fleet lost it (a lent Mac's disk decline, a
  # worker that stopped renewing its lease, a step queued past the controller's 3 h bound). On 2026-11-16 nothing
  # started such a look again, so each was lost for good; now one more look starts, once (attempt=1). A look's own
  # verdict (needs a build, failed shots) comes back in out.tar and is never retried.
  # Every write goes through .github/actions/pr-media-publish (the private-terms list, OCR, the shared privacy
  # check) from this protected branch's own scripts; out.tar is data from a fleet worker.
  publish:
    name: post the look
    if: ${{ github.event_name == 'workflow_dispatch' && github.repository == 'manaflow-ai/cmux' && github.ref == 'refs/heads/feat-cmux-next' && inputs.look_result != '' }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-4vcpu-ubuntu-2404' || vars.LINUX_RUNNER || fromJSON(vars.RUNNER_POOLS).linux_4 }}
    timeout-minutes: 50  # 20, plus hot-verify-ci.py's QUOTA_WAIT_SECONDS (1800) for a post out of quota
    environment: pr-media
    # contents: write reaches the pr-media branch (the code branches are protected by their rulesets);
    # pull-requests: write edits or posts the one comment; actions: write starts one more look and finds a
    # gallery run on the head.
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Checkout the publisher
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            .github/actions/pr-media-publish
            scripts/pr-media.py
            scripts/ci/pr_media_privacy.py
            scripts/ci/pr_media_gate.py
            scripts/ci/pr_media_ocr_tesseract.py
            scripts/ci/pr_media_ocr.swift
            scripts/cmux-next/hot-verify-ci.py
            scripts/cmux-next/hot-verify-pr.sh
            scripts/ci/gh_budget_wait.sh
          sparse-checkout-cone-mode: false
      - name: Wait through GitHub API rate limits in this job's gh calls
        run: bash scripts/ci/gh_budget_wait.sh --install
      - name: Read the pull request
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr }}
          HEAD_SHA: ${{ inputs.head }}
          LAYERS: ${{ inputs.layers }}
          KIND: ${{ inputs.kind }}
          ATTEMPT: ${{ inputs.attempt }}
          EVENT_AT: ${{ inputs.event_at }}
        run: |
          bash scripts/cmux-next/hot-verify-pr.sh
      - name: Read the look's result
        id: result
        if: ${{ steps.check.outputs.ok == 'true' }}
        env:
          LOOK_RESULT: ${{ inputs.look_result }}
          PR: ${{ inputs.pr }}
          HEAD_SHA: ${{ inputs.head }}
        run: |
          set -euo pipefail
          python3 scripts/cmux-next/hot-verify-ci.py result --pr "$PR" --head "$HEAD_SHA" > "$RUNNER_TEMP/result.out"
          url="$(sed -n 's/^url=//p' "$RUNNER_TEMP/result.out")"
          echo "hot verify: the fleet's look: $(sed -n 's/^reason=//p' "$RUNNER_TEMP/result.out")" | tee -a "$GITHUB_STEP_SUMMARY"
          { echo "url=$url"; [[ -n "$url" ]] && echo "tar=true" || echo "tar=false"; } >> "$GITHUB_OUTPUT"
      - name: Dispatch one more look
        if: ${{ steps.check.outputs.ok == 'true' && steps.result.outputs.tar == 'false' && inputs.attempt != '1' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr }}
          HEAD_SHA: ${{ inputs.head }}
          LAYERS: ${{ inputs.layers }}
          EVENT_AT: ${{ inputs.event_at }}
          KIND: ${{ inputs.kind }}
        run: |
          set -euo pipefail
          gh workflow run cmux-next-hot-verify.yml --repo "$GITHUB_REPOSITORY" --ref feat-cmux-next \
            -f pr="$PR" -f head="$HEAD_SHA" -f layers="$LAYERS" -f event_at="$EVENT_AT" -f kind="${KIND:-head}" -f attempt=1
          echo "hot verify: the look returned no out.tar; one more look runs for ${HEAD_SHA:0:12}" | tee -a "$GITHUB_STEP_SUMMARY"
      # The fleet step's out.tar, from the fleet artifact store's signed link (the controller's look_result): data
      # from a fleet worker, unpacked and checked below before anything is published.
      - name: Download the look's out.tar
        if: ${{ steps.check.outputs.ok == 'true' && steps.result.outputs.tar == 'true' }}
        env:
          URL: ${{ steps.result.outputs.url }}
        run: |
          set -euo pipefail
          [[ "$URL" == https://* ]] || { echo "::error::the look's out.tar link is not https"; exit 1; }
          mkdir -p "$RUNNER_TEMP/artifact"
          curl -fsS --retry 3 --max-time 600 --max-filesize 629145600 "$URL" -o "$RUNNER_TEMP/artifact/out.tar"
      - name: Unpack and stage
        id: stage
        if: ${{ steps.check.outputs.ok == 'true' && steps.result.outputs.tar == 'true' }}
        env:
          PR: ${{ inputs.pr }}
          HEAD_SHA: ${{ inputs.head }}
        run: |
          set -euo pipefail
          out="$(python3 scripts/cmux-next/hot-verify-ci.py unpack "$RUNNER_TEMP/artifact/out.tar" "$RUNNER_TEMP/out")"
          echo "out=$out" >> "$GITHUB_OUTPUT"
          python3 scripts/cmux-next/hot-verify-ci.py stage "$out" --pr "$PR" --head "$HEAD_SHA" \
            --stage "$RUNNER_TEMP/hv/media" --text "$RUNNER_TEMP/hv/text/hv-text.txt" > "$RUNNER_TEMP/stage.out"
          if python3 -c 'import json,sys; sys.exit(0 if json.load(open(sys.argv[1]))["needs_build"] else 1)' "$RUNNER_TEMP/stage.out"; then
            echo "needs_build=true" >> "$GITHUB_OUTPUT"
            echo "hot verify: the worker's plan against the nightly says this change needs a build; no comment (the build path covers it)" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "needs_build=false" >> "$GITHUB_OUTPUT"
            ls "$RUNNER_TEMP/hv/media" 2>/dev/null | sed 's/^/staged: /' || true
          fi
      - name: Is the gallery advisory also on this head
        id: gallery
        if: ${{ steps.stage.outputs.needs_build == 'false' }}
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ inputs.head }}
        run: |
          set -uo pipefail
          count="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/gallery-advisory.yml/runs?head_sha=$HEAD_SHA&event=pull_request&per_page=1" --jq .total_count 2>/dev/null || echo 0)"
          [[ "$count" =~ ^[0-9]+$ && "$count" -gt 0 ]] && echo "gallery=true" >> "$GITHUB_OUTPUT" || echo "gallery=false" >> "$GITHUB_OUTPUT"
      - name: Install ffmpeg
        if: ${{ steps.stage.outputs.needs_build == 'false' }}
        timeout-minutes: 4
        continue-on-error: true
        env:
          DEBIAN_FRONTEND: noninteractive
        run: command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg >/dev/null)
      - name: Check, upload and comment
        if: ${{ steps.stage.outputs.needs_build == 'false' }}
        uses: ./.github/actions/pr-media-publish
        env:
          PR: ${{ inputs.pr }}
          HEAD_SHA: ${{ inputs.head }}
          OUT: ${{ steps.stage.outputs.out }}
          GALLERY: ${{ steps.gallery.outputs.gallery }}
          EVENT_AT: ${{ inputs.event_at }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          private-terms: ${{ secrets.PR_MEDIA_PRIVATE_TERMS }}
          agent-authors: ${{ vars.PR_MEDIA_AGENT_AUTHORS }}
          github-token: ${{ github.token }}
          command: |
            set -euo pipefail
            hv="$RUNNER_TEMP/hv"
            uploaded=()
            # The worker's own text reader's lines go through the same check as the files (pr_media_privacy.py
            # reads a .txt line by line); a hit there withholds every file.
            if python3 scripts/ci/pr_media_privacy.py check --path-prefix "$PR" "$hv/text/hv-text.txt"; then
              if compgen -G "$hv/media/*" >/dev/null; then
                if python3 scripts/pr-media.py --pr "$PR" --repo "$GITHUB_REPOSITORY" --force "$hv/media"; then
                  uploaded=(--uploaded)
                else
                  echo "::warning title=hot verify::pr-media refused or failed the upload; the comment carries no shots"
                fi
              fi
            else
              echo "::warning title=hot verify::the worker's text reader saw private text; no shots are published"
            fi
            gallery=()
            [[ "${GALLERY:-false}" == true ]] && gallery=(--gallery)
            event=()
            [[ "${EVENT_AT:-}" =~ ^[0-9]{9,11}$ ]] && event=(--event-at "$EVENT_AT")
            python3 scripts/cmux-next/hot-verify-ci.py render "$OUT" --pr "$PR" --head "$HEAD_SHA" \
              --repo "$GITHUB_REPOSITORY" --stage-json "$hv/stage.json" --run-url "$RUN_URL" \
              ${uploaded[@]+"${uploaded[@]}"} ${gallery[@]+"${gallery[@]}"} ${event[@]+"${event[@]}"} > "$hv/comment.md"
            python3 scripts/cmux-next/hot-verify-ci.py post "$hv/comment.md" --pr "$PR" --head "$HEAD_SHA" \
              --repo "$GITHUB_REPOSITORY" | tee -a "$GITHUB_STEP_SUMMARY"
