name: cmux-next web bundles

# feat-cmux-next takes direct pushes, so ci-web.yml's PR checks never run there.
# This backstop rebuilds the committed web bundles on every push that touches them.
# safe-push.sh runs the same checks before the push.
on:
  push:
    branches: [feat-cmux-next]
    paths:
      - "webviews/**"
      - "Resources/markdown-viewer/webviews-app/**"
      - "Packages/macOS/CmuxNext/Sources/CmuxNextAgentPane/Resources/agent-pane/**"
      - "Packages/macOS/CmuxNext/Sources/CmuxNextAgentActivity/Resources/**"
      - "scripts/build-webviews-app.sh"
      - "scripts/cmux-next/build-agent-pane-web.sh"
      - "scripts/cmux-next/build-palette-ranker.sh"
      - "scripts/cmux-next/build-agent-activity-web.sh"
      - "scripts/cmux-next/build-optchat-inspector-web.sh"
      - "scripts/cmux-next/build-pages-web.sh"
      - "scripts/cmux-next/build-web-bundles.sh"
      - "scripts/cmux-next/web-bundle-key.py"
      - "Packages/macOS/CmuxNext/Sources/CmuxNextPages/Resources/pages/**"
      - "Native/OptChat/optchat-chief/inspector/**"
      - ".github/workflows/cmux-next-web-bundles.yml"

permissions:
  contents: read

concurrency:
  group: cmux-next-web-bundles-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundles:
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-4vcpu-ubuntu-2404' || vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"

      # `vp check` runs on Node and needs ^22.18 or ^24.11; bun still installs.
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.11.1"

      - name: Verify generated webviews assets
        run: ./scripts/build-webviews-app.sh --check

      - name: Verify generated cmux-next agent pane
        run: ./scripts/cmux-next/build-agent-pane-web.sh --check

      - name: Verify generated cmux-next palette ranker
        run: ./scripts/cmux-next/build-palette-ranker.sh --check

      - name: Verify generated cmux-next Agent Activity
        run: ./scripts/cmux-next/build-agent-activity-web.sh --check

      - name: Verify generated Chief memory inspector
        run: ./scripts/cmux-next/build-optchat-inspector-web.sh --check

      # The app build path (cx-vn5): build-web-bundles.sh, which every build
      # entry runs before it compiles, must produce the committed bundles byte
      # for byte, the pages included.
      - name: Verify the app build path's web bundles
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/web-bundles"
          ./scripts/cmux-next/build-web-bundles.sh --out-root "$out"
          status=0
          for path in \
            Packages/macOS/CmuxNext/Sources/CmuxNextAgentPane/Resources/agent-pane \
            Packages/macOS/CmuxNext/Sources/CmuxNextPages/Resources/pages \
            Packages/macOS/CmuxNext/Sources/CmuxNextAgentActivity/Resources/agent-activity \
            Packages/macOS/CmuxNext/Sources/CmuxNextPalette/Resources/palette-ranker.js \
            Resources/markdown-viewer/webviews-app; do
            diff -r "$path" "$out/$path" >/dev/null || { echo "::error::$path differs from build-web-bundles.sh output"; diff -rq "$path" "$out/$path" || true; status=1; }
          done
          exit "$status"

  # Signal only for now (the coordinator's call): `vp check` and the full
  # webviews test suite. Make them blocking (drop continue-on-error) once both
  # are green on the branch.
  webviews-checks:
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-4vcpu-ubuntu-2404' || vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"

      # `vp check` runs on Node and needs ^22.18 or ^24.11; bun still installs.
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.11.1"

      - name: Install webviews dependencies
        working-directory: webviews
        run: bun install --frozen-lockfile

      - name: vp check
        working-directory: webviews
        run: bun run check

      - name: bun test
        working-directory: webviews
        run: bun test

  # Interaction-latency scoreboard (plans/cmux-next/zero-latency.md): input-to-paint of every
  # page's named actions in headless Chromium and WebKit. A scoreboard only: it reports numbers in
  # the step summary and never blocks. It becomes required after 3 days with no flakes (the
  # coordinator's call).
  latency-scoreboard:
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-4vcpu-ubuntu-2404' || vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.11.1"

      - name: Install webviews dependencies
        working-directory: webviews
        run: bun install --frozen-lockfile

      - name: Install headless engines
        working-directory: webviews
        run: ./node_modules/.bin/playwright install --with-deps --only-shell chromium webkit

      - name: Measure
        working-directory: webviews
        run: bun run latency:ci

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: latency-results
          path: webviews/latency-results.json
          if-no-files-found: ignore
