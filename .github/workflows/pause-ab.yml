name: Pause-policy A/B (staging)

# How long a cmux Cloud machine stays awake under each pause policy for the same chat:
# scripts/cmux-next/pause-ab.ts signs in as the staging agent test account, creates --per-arm machines per arm
# (`pause-ab-<tag>-<arm>-<i>`), sets each arm with cloud.machine.idle_policy.set {pause_policy}, drives the same seeded
# stub-model chat on all of them, and reports awake/paused seconds, resumes and resume latency per arm, plus whether
# the guest advertised `activity-turn-end`. Every machine it made is deleted, pass or fail.
#
# Secrets: CMUX_DOGFOOD_STACK_EMAIL/_PASSWORD in cmux-next-vm-image-dev (the pair cloud-journey-pr.yml reads).
# Manual: `gh workflow run pause-ab.yml --repo manaflow-ai/cmux --ref <branch>` (workflow_dispatch needs this
# file on the default branch first).

run-name: Pause-policy A/B (staging) ${{ github.head_ref || github.ref_name }} ${{ inputs.arms || 'turn_end,aggressive' }}

on:
  workflow_dispatch:
    inputs:
      arms:
        description: "Comma-separated pause policies, one arm each"
        required: false
        type: string
        default: "turn_end,aggressive"
      per_arm:
        description: "Machines per arm (pairs: machine i of every arm shares seed + i - 1)"
        required: false
        type: string
        default: "10"
      turns:
        description: "Stub turns per machine"
        required: false
        type: string
        default: "8"
      seed:
        description: "Seed for the idle gaps"
        required: false
        type: string
        default: "7"
      gaps:
        description: "Idle gap choices in seconds"
        required: false
        type: string
        default: "20,45,90,180"
  # A PR that changes the harness runs it once with the defaults (10 seeded pairs: one machine per arm proved nothing
  # about which policy is better, run 45846918347), so the first run needs no default-branch copy of this file.
  pull_request:
    branches: [feat-cmux-next]
    paths:
      - .github/workflows/pause-ab.yml
      - scripts/cmux-next/pause-ab.ts
      - scripts/cmux-next/pause-ab.test.ts

permissions:
  contents: read

concurrency:
  group: pause-ab-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ab:
    if: github.repository == 'manaflow-ai/cmux' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    environment:
      name: cmux-next-vm-image-dev
      deployment: false
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || 'cmux-linux' }}
    # Pairs come up one after another for up to 25 minutes, the last pair drives about 20, then four-at-a-time deletes.
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          # Two commits, so a PR's merge commit has its base (HEAD^1) for the reach check below.
          fetch-depth: 2
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/cmux-next/
            /tests/fixtures/model-stub/
            /Packages/macOS/CmuxNext/Sources/CmuxNextCloudCredentials/
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
          no-cache: ${{ !startsWith(github.workspace, '/home/runner/work/') }}
      - name: Unit tests
        run: bun test scripts/cmux-next/pause-ab.test.ts
      # The 20-machine staging A/B (40-70 min a run) measures the harness and its arguments, so a PR runs it when it
      # changes what the A/B executes: the sparse paths above, or the A/B step's own block in this file. A PR that only
      # edits this file elsewhere (an action pin, runner labels, retention days) runs the unit tests and skips it: in
      # the 4 h to 04:46Z on 11-27, 8 of 10 A/B runs came from such sweeps (checkout repin, retention-days, ci labels,
      # base-red caches) and failed on staging bring-up, ~40-70 runner minutes each.
      - name: Does this change reach the A/B
        id: reach
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != pull_request ] || ! git rev-parse -q --verify HEAD^1 >/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          ab_step() { git show "$1:.github/workflows/pause-ab.yml" 2>/dev/null | awk '/- name: A\/B on staging/{p=1} /- name: Summary/{p=0} p && !/if: steps\.reach\./'; }
          if ! git diff --quiet HEAD^1 HEAD -- scripts/cmux-next/ tests/fixtures/model-stub/ Packages/macOS/CmuxNext/Sources/CmuxNextCloudCredentials/ \
            || [ "$(ab_step HEAD^1)" != "$(ab_step HEAD)" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "A/B skipped: this PR changes neither the harness paths nor the A/B step (unit tests ran)." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - name: A/B on staging
        if: steps.reach.outputs.run == 'true'
        env:
          CMUX_DOGFOOD_STACK_EMAIL: ${{ secrets.CMUX_DOGFOOD_STACK_EMAIL }}
          CMUX_DOGFOOD_STACK_PASSWORD: ${{ secrets.CMUX_DOGFOOD_STACK_PASSWORD }}
          ARMS: ${{ inputs.arms || 'turn_end,aggressive' }}
          PER_ARM: ${{ inputs.per_arm || '10' }}
          TURNS: ${{ inputs.turns || '8' }}
          SEED: ${{ inputs.seed || '7' }}
          GAPS: ${{ inputs.gaps || '20,45,90,180' }}
        run: >-
          bun scripts/cmux-next/pause-ab.ts --backend staging --out "$RUNNER_TEMP/pause-ab"
          --arms "$ARMS" --per-arm "$PER_ARM" --turns "$TURNS" --seed "$SEED" --gaps "$GAPS"
      - name: Summary
        if: always() && steps.reach.outputs.run != 'false'
        run: cat "$RUNNER_TEMP/pause-ab/summary.md" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "no summary written" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: pause-ab-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pause-ab/
          if-no-files-found: warn
          retention-days: 3
