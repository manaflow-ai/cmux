name: Incremental generation salvage canary

on:
  push:
    branches:
      - exp/incremental-state-salvage-20260921

permissions:
  contents: read
  actions: read

env:
  CI_CACHE_R2_PUBLIC_URL: ${{ vars.CI_CACHE_R2_PUBLIC_URL }}
  CANARY_BASE: 2393fd16b875819909c8f633271934a3f6d0292e
  CANARY_TARGET: 2f943925239bcff183fcb452379725fa3b4b4b20
  CANARY_REPO_URL: https://github.com/manaflow-ai/cmux.git
  SEED_RUN_ID: '35671427595'
  CMUX_CI_XCODE_APP: ${{ vars.CMUX_CI_XCODE_APP_MACOS_15 }}
  CMUX_CI_REQUIRED_MACOS_SDK_MAJOR: '26'
  CMUX_SKIP_ZIG_BUILD: '1'

jobs:
  benchmark:
    name: Salvage ${{ matrix.arm }}
    runs-on: ${{ vars.MACOS_RUNNER_15 || 'blacksmith-6vcpu-macos-15' }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        arm:
          - cold-fresh
          - fresh-restored-dd
          - restored-generation
          - restored-synthetic-merge
    steps:
      - name: Checkout harness
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Preserve harness outside worktree
        run: |
          cp scripts/ci/benchmark-incremental-generation.py "$RUNNER_TEMP/benchmark.py"
          chmod +x "$RUNNER_TEMP/benchmark.py"

      - name: Select Xcode
        run: ./scripts/select-ci-xcode.sh

      - name: Start worktree download timer
        if: startsWith(matrix.arm, 'restored-')
        run: python3 -c 'import os,time; open(os.environ["RUNNER_TEMP"]+"/worktree-download-start","w").write(str(time.monotonic()))'

      - name: Download seed worktree
        if: startsWith(matrix.arm, 'restored-')
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: incremental-canary-worktree
          path: ${{ runner.temp }}/worktree-artifact
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SEED_RUN_ID }}

      - name: Record worktree download time
        if: startsWith(matrix.arm, 'restored-')
        run: |
          python3 - <<'PY'
          import json, os, time
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          archive = root / 'worktree-artifact/worktree.tar.gz'
          payload = {'kind':'worktree-download','seconds':round(time.monotonic()-float((root/'worktree-download-start').read_text()),6),'archive_bytes':archive.stat().st_size}
          (root/'worktree-download.json').write_text(json.dumps(payload,sort_keys=True,indent=2)+'\n')
          print('CMUX_CANARY_TRANSFER='+json.dumps(payload,sort_keys=True))
          PY

      - name: Start DerivedData download timer
        if: matrix.arm != 'cold-fresh'
        run: python3 -c 'import os,time; open(os.environ["RUNNER_TEMP"]+"/dd-download-start","w").write(str(time.monotonic()))'

      - name: Download seed DerivedData
        if: matrix.arm != 'cold-fresh'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: incremental-canary-derived-data
          path: ${{ runner.temp }}/dd-artifact
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SEED_RUN_ID }}

      - name: Record DerivedData download time
        if: matrix.arm != 'cold-fresh'
        run: |
          python3 - <<'PY'
          import json, os, time
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          archive = root / 'dd-artifact/derived-data.tar.gz'
          payload = {'kind':'derived-data-download','seconds':round(time.monotonic()-float((root/'dd-download-start').read_text()),6),'archive_bytes':archive.stat().st_size}
          (root/'dd-download.json').write_text(json.dumps(payload,sort_keys=True,indent=2)+'\n')
          print('CMUX_CANARY_TRANSFER='+json.dumps(payload,sort_keys=True))
          PY

      - name: Materialize fresh B
        if: matrix.arm == 'cold-fresh' || matrix.arm == 'fresh-restored-dd'
        run: |
          python3 "$RUNNER_TEMP/benchmark.py" source-fresh --workspace "$GITHUB_WORKSPACE" --base "$CANARY_BASE" --target "$CANARY_TARGET" --metrics "$RUNNER_TEMP/source.json"

      - name: Restore A worktree and advance to B
        if: matrix.arm == 'restored-generation'
        run: |
          python3 "$RUNNER_TEMP/benchmark.py" source-restored --workspace "$GITHUB_WORKSPACE" --archive "$RUNNER_TEMP/worktree-artifact/worktree.tar.gz" --repo-url "$CANARY_REPO_URL" --base "$CANARY_BASE" --target "$CANARY_TARGET" --metrics "$RUNNER_TEMP/source.json"

      - name: Restore A worktree and create synthetic merge
        if: matrix.arm == 'restored-synthetic-merge'
        run: |
          python3 "$RUNNER_TEMP/benchmark.py" source-restored --workspace "$GITHUB_WORKSPACE" --archive "$RUNNER_TEMP/worktree-artifact/worktree.tar.gz" --repo-url "$CANARY_REPO_URL" --base "$CANARY_BASE" --target "$CANARY_TARGET" --synthetic-merge --metrics "$RUNNER_TEMP/source.json"

      - name: Restore DerivedData
        if: matrix.arm != 'cold-fresh'
        run: |
          python3 "$RUNNER_TEMP/benchmark.py" extract-dd --archive "$RUNNER_TEMP/dd-artifact/derived-data.tar.gz" --derived "$RUNNER_TEMP/cmux-derived-data-compile-admission" --metrics "$RUNNER_TEMP/dd-restore.json"

      - name: Keep cold DerivedData empty
        if: matrix.arm == 'cold-fresh'
        run: rm -rf "$RUNNER_TEMP/cmux-derived-data-compile-admission"

      - name: Compute Swift package key
        id: package-key
        run: |
          echo "hash=$(shasum -a 256 cmux.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Restore Swift packages
        id: spm-cache
        uses: ./.github/actions/cache-restore
        with:
          backend: ${{ vars.CI_CACHE_BACKEND }}
          path: ${{ runner.temp }}/cmux-source-packages
          key: spm-${{ steps.package-key.outputs.hash }}
          restore-keys: spm-

      - name: Sanitize Swift packages
        run: python3 scripts/ci/sanitize-xcode-source-packages-cache.py "$RUNNER_TEMP/cmux-source-packages"

      - name: Compute compilation CAS fingerprint
        id: cas-key
        run: |
          fingerprint="$(scripts/ci/compile-app-host-test-product.sh fingerprint "$RUNNER_TEMP/cmux-derived-data-compile-admission")"
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"

      - name: Restore shared Xcode compilation CAS
        id: cas-cache
        uses: ./.github/actions/cache-restore
        with:
          backend: ${{ vars.CI_CACHE_BACKEND }}
          path: ${{ runner.temp }}/cmux-compile-admission-cas
          key: xcode-compilation-test-${{ runner.os }}-${{ runner.arch }}-${{ steps.cas-key.outputs.fingerprint }}-${{ env.CANARY_BASE }}
          restore-keys: |
            xcode-compilation-test-${{ runner.os }}-${{ runner.arch }}-${{ steps.cas-key.outputs.fingerprint }}-

      - name: Build arm
        id: build
        continue-on-error: true
        run: |
          python3 "$RUNNER_TEMP/benchmark.py" build --workspace "$GITHUB_WORKSPACE" --derived "$RUNNER_TEMP/cmux-derived-data-compile-admission" --source-packages "$RUNNER_TEMP/cmux-source-packages" --cas "$RUNNER_TEMP/cmux-compile-admission-cas" --label "${{ matrix.arm }}" --source-metrics "$RUNNER_TEMP/source.json" --dd-metrics "$RUNNER_TEMP/dd-restore.json" --metrics "$RUNNER_TEMP/build.json"

      - name: Preserve build log
        if: always()
        run: cp "$RUNNER_TEMP/cmux-derived-data-compile-admission/cmux-build.log" "$RUNNER_TEMP/cmux-build.log" 2>/dev/null || true

      - name: Record row
        if: always()
        env:
          ARM: ${{ matrix.arm }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          SPM_CACHE_HIT: ${{ steps.spm-cache.outputs.cache-hit }}
          CAS_CACHE_HIT: ${{ steps.cas-cache.outputs.cache-hit }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])
          row={'arm':os.environ['ARM'],'build_outcome':os.environ.get('BUILD_OUTCOME',''),'spm_restore_hit':os.environ.get('SPM_CACHE_HIT',''),'cas_restore_hit':os.environ.get('CAS_CACHE_HIT','')}
          for key,name in [('source','source.json'),('derived_restore','dd-restore.json'),('build','build.json'),('worktree_download','worktree-download.json'),('derived_data_download','dd-download.json')]:
              p=root/name; row[key]=json.loads(p.read_text()) if p.is_file() else None
          (root/'row.json').write_text(json.dumps(row,sort_keys=True,indent=2)+'\n')
          print('CMUX_CANARY_ROW='+json.dumps(row,sort_keys=True))
          PY

      - name: Upload metrics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: incremental-salvage-${{ matrix.arm }}
          path: |
            ${{ runner.temp }}/source.json
            ${{ runner.temp }}/dd-restore.json
            ${{ runner.temp }}/build.json
            ${{ runner.temp }}/worktree-download.json
            ${{ runner.temp }}/dd-download.json
            ${{ runner.temp }}/row.json
            ${{ runner.temp }}/cmux-build.log
          if-no-files-found: ignore
          retention-days: 1

      - name: Fail on build failure
        if: steps.build.outcome != 'success'
        run: exit 1
