name: intro walk check

# The Make cmux Yours intro walk (webviews/scripts/intro-walk.mjs) on the pull request that changes it, so a
# regression shows on the change itself and not first in the 6-hourly probe (cmuxterm-hq intro-walk-probe.yml,
# goal intro-walk-front-door). The same walk as the probe: it builds the gallery and walks every arm at three
# widths in headless Chromium (no layout shift per pick, one op per pick, footer never covered, Skip putting back
# the opening choices), and fails when any check fails. The report is uploaded; compare two with
# `bun scripts/intro-walk-diff.mjs before.json after.json`.
#
# Narrow on purpose: PR-wide gallery renders were taken off pull requests for cost (cmuxterm-hq#16094). This runs
# only when the onboarding page or the walk itself changes (a few PRs a day, one ~10 min Linux job each); a change
# elsewhere that breaks the walk is still the probe's to catch. No ruleset requires this check, so the path filter
# never leaves a pull request waiting on it.

on:
  pull_request:
    branches: [feat-cmux-next]
    types: [opened, synchronize, reopened]
    paths:
      - "webviews/src/pages/onboarding/**"
      - "webviews/scripts/intro-walk.mjs"
      - "webviews/scripts/intro-walk-diff.mjs"
      - ".github/workflows/intro-walk-check.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: intro-walk-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  walk:
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || vars.CI_OVERFLOW_LINUX || 'cmux-linux' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.22.1"
      # Restore only, as the probe does: its combined cache action once hung 29 min in the post-job save.
      - name: Restore bun packages
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.bun/install/cache
            ~/.cache/ms-playwright
          key: intro-walk-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('webviews/bun.lock') }}
      - name: Walk every Make cmux Yours arm
        working-directory: webviews
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/intro-walk"
          bun install --frozen-lockfile
          ./node_modules/.bin/playwright install --with-deps chromium
          timeout 900 bun scripts/intro-walk.mjs --out "$RUNNER_TEMP/intro-walk/report.json"
      - name: Upload the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: intro-walk-report
          path: ${{ runner.temp }}/intro-walk/report.json
          if-no-files-found: ignore
          retention-days: 14
