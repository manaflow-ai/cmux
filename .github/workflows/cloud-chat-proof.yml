name: Cloud chat proof (staging, tagged DEV app)

# The implementation lives on feat-cmux-next. GitHub dispatches only a
# workflow the default branch registers, so this inert copy lets lanes run:
#
#   gh workflow run cloud-chat-proof.yml -R manaflow-ai/cmux --ref feat-cmux-next
#
# A dispatch runs the file at --ref, so feat-cmux-next's inputs and jobs win;
# these inputs only mirror them for the Actions form.
on:
  workflow_dispatch:
    inputs:
      prompt:
        description: The prompt the Cloud chat gets
        required: false
        default: "Reply with one short sentence that names the planet you are on."
        type: string
      agent:
        description: The harness the chat starts (claude or codex)
        required: false
        default: claude
        type: choice
        options: [claude, codex]

permissions: {}

jobs:
  registration:
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    steps:
      - run: echo "The Cloud chat proof is implemented on feat-cmux-next; dispatch it with --ref feat-cmux-next"
