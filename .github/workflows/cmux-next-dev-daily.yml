name: cmux NEXT DEV daily

on:
  # The source workflow dispatches this publisher after its exact app artifact
  # is complete. The five-minute dispatcher is the retry/backstop and also
  # hands over completed source runs. Keeping this publisher dispatch-only
  # avoids a skipped publisher run for every unrelated cmux-next completion.
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "The cmux-next.yml dev daily run whose Release app to publish"
        required: true

run-name: >-
  ${{ github.event_name == 'workflow_dispatch' && format('cmux NEXT DEV daily · publish {0}', inputs.source_run_id) || 'cmux NEXT DEV daily' }}

permissions: {}

env:
  # Keep the source workflow pinned in the receipt and resolver checks.
  SOURCE_WORKFLOW_PATHS: .github/workflows/cmux-next.yml

jobs:
  sign:
    # The source run is checked again by id in the first step.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    name: Sign cmux NEXT DEV
    # No concurrency group: a group keeps one pending run and replaces it with
    # each newer handoff, so while the signer waited for a runner every newer
    # source run was cancelled before it started (2026-10-26: nothing published
    # from 00:13Z for over six hours). Signing shares no state between source
    # runs (the build number is the source run id), and publish and tip each
    # refuse to roll their channel back, so a newer handoff signs alongside.
    # This job signs and runs no code from the app. verify runs the app's
    # sidecar without secrets; publish uploads only the archive it tested.
    environment: release
    # Linux, with stock rcodesign (scripts/ci/rcodesign-sign-bundle-dev.sh): no
    # macOS queue, and no keychain (the signer keeps the key in its own
    # temporary directory). The Mac jobs check its output: verify runs codesign
    # on the archive publish ships, and tip runs it before building the DMG.
    # 4 vCPU: packing the app with deflate is CPU-bound.
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    outputs:
      signed: ${{ steps.package.outputs.signed }}
      source_sha: ${{ steps.package.outputs.source_sha }}
      build: ${{ steps.stamp.outputs.build }}
    env:
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      RELEASE_TAG: cmux-next-dev
      APP_NAME: cmux NEXT DEV
      BUNDLE_ID: com.cmuxterm.app.debug.next
      APP_ARCHIVE_NAME: cmux-NEXT-DEV.zip
      # The tip feed (hotswap-opus, 2026-10-24). The path keeps "/nightly-next/"
      # so UpdateFeedResolver reads it as a cmux NEXT nightly feed; the app runs
      # Sparkle for com.cmuxterm.app.debug.next only when it carries this feed.
      TIP_FEED_URL: https://files.cmux.com/nightly-next/tip/appcast-arm64.xml
      # The first feat-cmux-next commit whose app runs Sparkle on the tip feed
      # (#24954). An older source would carry the feed but never read it.
      TIP_APP_FLOOR_SHA: df21458196edaaf3de5192da56ecd2a315aacae7
      # A source run may have unrelated red checks while its app-producing Mac
      # job succeeded. Those independent reds must not suppress this channel.
      SOURCE_APP_PRODUCER_JOBS: |-
        cmux NEXT DEV Release compile
        cmux app scheme compile (Debug)
        cmux-next Release compile (Xcode 26)
    steps:
      # The source-run reads below (run, jobs, artifact, compares) go through the
      # manaflow-glaeda-route App's own budget, read-only, not the GITHUB_TOKEN
      # budget every workflow in the repository shares: that one was spent when
      # these publishers started on 2026-10-26 (runs 40258137182, 40293667155,
      # 40298877772 failed in "Resolve the source run" with "API rate limit
      # exceeded for installation"). No App (a fork) or a failed mint leaves it
      # empty, and GITHUB_TOKEN reads as before.
      - name: Mint the source-run read token
        id: read-token
        if: vars.GLAEDA_ROUTE_APP_ID != ''
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.GLAEDA_ROUTE_APP_ID }}
          private-key: ${{ secrets.GLAEDA_ROUTE_APP_KEY }}
          permission-actions: read
          permission-contents: read

      # SOURCE_SHA is the commit the source run built: a dev daily run of
      # cmux-next.yml on feat-cmux-next whose name carries the SHA it was asked
      # for (cmux-next.yml fails a run whose checkout is not that SHA).
      - name: Resolve the source run
        env:
          GH_TOKEN: ${{ steps.read-token.outputs.token || github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]] || { echo "error: source run id '$SOURCE_RUN_ID' is not a number" >&2; exit 1; }
          sha="$(gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN_ID" --jq '
            select(.event == "workflow_dispatch" and .head_branch == "feat-cmux-next"
                   and .path == ".github/workflows/cmux-next.yml" and .status == "completed"
                   and .head_repository.full_name == env.GH_REPO
                   and (.name == "cmux NEXT DEV daily · " + .head_sha or .display_title == "cmux NEXT DEV daily · " + .head_sha))
            | .head_sha')"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "error: run $SOURCE_RUN_ID is not a finished cmux NEXT DEV daily run of cmux-next.yml on feat-cmux-next" >&2; exit 1; }
          # head_branch is a short name, the same for a tag called
          # feat-cmux-next: require the commit to be on the branch itself.
          branch_sha="$(gh api "repos/$GH_REPO/git/ref/heads/feat-cmux-next" --jq '.object.sha')"
          [[ "$branch_sha" =~ ^[0-9a-f]{40}$ ]] || { echo "error: could not read refs/heads/feat-cmux-next" >&2; exit 1; }
          on_branch="$(gh api "repos/$GH_REPO/compare/$sha...$branch_sha" --jq '.status')"
          [[ "$on_branch" == ahead || "$on_branch" == identical ]] || {
            echo "error: $sha is not on refs/heads/feat-cmux-next ($branch_sha is $on_branch of it)" >&2
            exit 1
          }
          echo "SOURCE_SHA=$sha" >> "$GITHUB_ENV"
          echo "Source run $SOURCE_RUN_ID built feat-cmux-next $sha"

      - name: Require a successful app-producing job
        id: source-gate
        env:
          GH_TOKEN: ${{ steps.read-token.outputs.token || github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          jobs="$(gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN_ID/jobs?filter=latest&per_page=100" \
            --jq '.jobs[] | select(.conclusion == "success") | .name' || true)"
          eligible=false
          while IFS= read -r job_name; do
            while IFS= read -r producer_name; do
              if [[ -n "$job_name" && "$job_name" == "$producer_name" ]]; then
                eligible=true
              fi
            done <<< "$SOURCE_APP_PRODUCER_JOBS"
          done <<< "$jobs"
          if [[ "$eligible" != true ]]; then
            echo "::notice::cmux-next run $SOURCE_RUN_ID has no successful app-producing job; skipping daily publication"
          fi
          echo "eligible=$eligible" >> "$GITHUB_OUTPUT"

      - name: Download the exact Release app artifact
        id: source-artifact
        if: steps.source-gate.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ steps.read-token.outputs.token || github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cmux-next-dev-daily/source"
          artifact_name="cmux-next-dev-daily-unsigned-${SOURCE_SHA}"
          if ! gh run download "$SOURCE_RUN_ID" --repo "$GH_REPO" --name "$artifact_name" --dir "$RUNNER_TEMP/cmux-next-dev-daily/source"; then
            echo "::error::cmux-next run $SOURCE_RUN_ID has no current Release app artifact; retry the handoff" >&2
            exit 1
          fi
          archive="$(find "$RUNNER_TEMP/cmux-next-dev-daily/source" -type f -name '*.zip' -print -quit)"
          test -f "$archive" || { echo "::error::source run $SOURCE_RUN_ID artifact has no app archive" >&2; exit 1; }
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Checkout trusted signing and updater scripts
        if: steps.source-artifact.outputs.archive != ''
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      # The source archive is ditto -c -k --keepParent output. dev_app_linux.py
      # unpacks it as ditto -x -k does (symlinks, modes, AppleDouble dropped)
      # and makes the PlistBuddy edits.
      - name: Unpack and verify channel identity
        if: steps.source-artifact.outputs.archive != ''
        env:
          SOURCE_ARCHIVE: ${{ steps.source-artifact.outputs.archive }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/cmux-next-dev-daily/unpacked"
          mkdir -p "$root"
          python3 scripts/ci/dev_app_linux.py unzip "$SOURCE_ARCHIVE" "$root"
          app="$(find "$root" -maxdepth 2 -type d -name "$APP_NAME.app" -print -quit)"
          test -d "$app"
          python3 scripts/ci/dev_app_linux.py identity "$app/Contents/Info.plist" "$BUNDLE_ID" "$APP_NAME" "$SOURCE_SHA"
          echo "app=$app" >> "$GITHUB_OUTPUT"
        id: unpack

      # Before signing, so the signature covers them: a build number Sparkle
      # can order (the source run id; every DEV build was 108 before), the
      # tip feed, and the public half of the NIGHTLY Sparkle key the tip job
      # signs the feed with.
      - name: Stamp the tip feed, its key and a build number
        id: stamp
        if: steps.source-artifact.outputs.archive != ''
        env:
          APP_PATH: ${{ steps.unpack.outputs.app }}
          NIGHTLY_SPARKLE_PRIVATE_KEY: ${{ secrets.NIGHTLY_SPARKLE_PRIVATE_KEY }}
          GH_TOKEN: ${{ steps.read-token.outputs.token || github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          floor="$(gh api "repos/$GH_REPO/compare/$TIP_APP_FLOOR_SHA...$SOURCE_SHA" --jq '.status')"
          if [[ "$floor" != ahead && "$floor" != identical ]]; then
            echo "::notice::$SOURCE_SHA predates the tip app ($TIP_APP_FLOOR_SHA is $floor of it); no tip feed for this build"
            exit 0
          fi
          [[ -n "$NIGHTLY_SPARKLE_PRIVATE_KEY" ]] || { echo "Missing NIGHTLY_SPARKLE_PRIVATE_KEY" >&2; exit 1; }
          # The script reads the key from the variable it names (never argv).
          public_key="$(python3 scripts/ci/dev_app_linux.py sparkle-public-key NIGHTLY_SPARKLE_PRIVATE_KEY)"
          [[ "$public_key" =~ ^[A-Za-z0-9+/]{43}=$ ]] || { echo "could not derive the tip Sparkle public key" >&2; exit 1; }
          build="$SOURCE_RUN_ID"
          python3 scripts/ci/dev_app_linux.py stamp "$APP_PATH/Contents/Info.plist" "$build" "$TIP_FEED_URL" "$public_key"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "Tip build $build, feed $TIP_FEED_URL, key $public_key"

      - name: Install rcodesign
        if: steps.source-artifact.outputs.archive != ''
        run: ./scripts/ci/install-rcodesign.sh "$RUNNER_TEMP/rcodesign" >> "$GITHUB_ENV"

      # The app comes from a feat-cmux-next build. None of its code runs in
      # this job: the signer only reads and rewrites its files, and
      # rcodesign-verifies every Mach-O it signed.
      - name: Sign and verify cmux NEXT DEV
        if: steps.source-artifact.outputs.archive != ''
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APP_PATH: ${{ steps.unpack.outputs.app }}
        run: |
          set -euo pipefail
          [[ -n "$APPLE_SIGNING_IDENTITY" ]] || { echo "Missing APPLE_SIGNING_IDENTITY" >&2; exit 1; }
          ./scripts/ci/rcodesign-sign-bundle-dev.sh "$APP_PATH" cmux.next-dev.entitlements

      # The same archive ditto -c -k --keepParent makes: symlinks stay links
      # and exec bits stay set (dev_app_linux.py zip).
      - name: Package the signed app
        id: package
        if: steps.source-artifact.outputs.archive != ''
        env:
          APP_PATH: ${{ steps.unpack.outputs.app }}
        run: |
          set -euo pipefail
          mkdir -p signed-handoff
          python3 scripts/ci/dev_app_linux.py zip "$APP_PATH" "signed-handoff/$APP_ARCHIVE_NAME"
          (cd signed-handoff && sha256sum "$APP_ARCHIVE_NAME" > "$APP_ARCHIVE_NAME.sha256")
          echo "signed=true" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - name: Upload the signed app
        if: steps.source-artifact.outputs.archive != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-next-dev-daily-signed
          path: signed-handoff/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 3

  # Offers verify to the owned Macs (Leo, 2026-10-24: owned Macs before
  # Blacksmith). It runs e2e_runner_pool.py, test-e2e.yml's picker, as
  # iroh-release-gate.yml does: an owned pool on the lane's Xcode pin while
  # CI_PR_POOL_OWNED is 1 and a machine is free now (no queue rounds), else
  # nothing. `label` is set only for an owned pick, so any other answer, a
  # skipped pick or a failure of this job leaves verify on Blacksmith. The
  # routing App key stays in this Linux job; verify holds no secret.
  runner:
    needs: sign
    if: needs.sign.outputs.signed == 'true'
    environment: release
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 5
    # Reads the queue janitor's pool snapshot (e2e_runner_pool.py's budget)
    # and the owned runners through the routing App's own budget.
    permissions:
      contents: read
      actions: read
    outputs:
      # An owned label (glaeda-...) or empty.
      label: ${{ steps.pool.outputs.label }}
    steps:
      # Only main's own dispatch of this workflow (the sign job's condition)
      # is offered an owned Mac, and only on its first attempt.
      - name: Checkout pool helper
        if: github.repository_owner == 'manaflow-ai' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.run_attempt == 1 && vars.CI_PR_POOL_OWNED == '1'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: |
            scripts/ci/e2e_runner_pool.py
            scripts/ci/pr_runner_pool.py
            scripts/ci/simple_pool_picker.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Mint the owned-pool routing token
        id: route-token
        # As in iroh-release-gate.yml: idle owned runners read live. Any
        # failure leaves the token empty and the janitor snapshot decides.
        if: github.repository_owner == 'manaflow-ai' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.run_attempt == 1 && vars.CI_PR_POOL_OWNED == '1' && vars.GLAEDA_ROUTE_APP_ID != ''
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.GLAEDA_ROUTE_APP_ID }}
          private-key: ${{ secrets.GLAEDA_ROUTE_APP_KEY }}
          permission-administration: read
          permission-organization-self-hosted-runners: read

      - name: Mint the routing token without the org permission
        id: route-token-repo
        if: steps.route-token.outcome == 'failure'
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.GLAEDA_ROUTE_APP_ID }}
          private-key: ${{ secrets.GLAEDA_ROUTE_APP_KEY }}
          permission-administration: read

      - name: Pick the macOS pool
        id: pool
        if: github.repository_owner == 'manaflow-ai' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.run_attempt == 1 && vars.CI_PR_POOL_OWNED == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          ROUTE_TOKEN: ${{ steps.route-token.outputs.token || steps.route-token-repo.outputs.token }}
          GH_REPO: ${{ github.repository }}
          POOL_ORDER: ${{ vars.CI_PR_POOL_ORDER }}
          POOL_MAX_QUEUED: ${{ vars.CI_PR_POOL_MAX_QUEUED }}
          POOL_OWNED: ${{ vars.CI_PR_POOL_OWNED }}
          OWNED_SLOTS: ${{ vars.CI_OWNED_POOL_SLOTS }}
          PR_XCODE_APP: ${{ vars.CMUX_CI_XCODE_APP_PR }}
        run: |
          set -uo pipefail
          label="$(python3 scripts/ci/e2e_runner_pool.py \
            --requested auto \
            --order "$POOL_ORDER" \
            --max-queued "$POOL_MAX_QUEUED" \
            --owned "$POOL_OWNED" \
            --owned-slots "$OWNED_SLOTS" \
            --pr-xcode-app "$PR_XCODE_APP")" || label=""
          case "$label" in
            glaeda-*) ;;
            *) echo "No owned Mac free now (picker said '${label:-nothing}'); Blacksmith macOS 26 takes verify."; label="" ;;
          esac
          echo "label=$label" >> "$GITHUB_OUTPUT"
          [ -z "$label" ] || echo "Runner: $label (a re-run takes Blacksmith macOS 26)"

      # ci-owned-pool-rescue.yml's sweeper watches a run with these markers and
      # re-runs verify when an owned Mac leaves it queued or refuses it
      # (attempt 2 takes Blacksmith); the queue janitor counts the first one
      # against the pool. Fail-safe: without them the run is only not watched.
      - name: Mark a run on a persistent macOS pool
        id: marker
        if: ${{ steps.pool.outputs.label != '' && github.run_attempt == 1 }}
        continue-on-error: true
        run: |
          set -euo pipefail
          marker="$RUNNER_TEMP/macos-pool-persistent.json"
          echo '{}' > "$marker"
          echo "path=$marker" >> "$GITHUB_OUTPUT"

      - name: Upload the persistent pool marker
        if: ${{ steps.marker.outputs.path != '' }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-pool-persistent-${{ github.run_id }}-${{ github.run_attempt }}-1-${{ steps.pool.outputs.label }}
          path: ${{ steps.marker.outputs.path }}
          retention-days: 1

      - name: Upload the owned-pool watch marker
        if: ${{ steps.marker.outputs.path != '' }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: owned-pool-watch
          path: ${{ steps.marker.outputs.path }}
          retention-days: 1

  verify:
    name: Verify signed cmux NEXT DEV
    # No environment and no secrets: this job runs the app's diff sidecar.
    # The admission gate: the signer runs on Linux, so Apple's codesign first
    # checks the archive here, and publish and tip ship it only when this job
    # succeeded with outputs.verified 'true'. Not continue-on-error: a red
    # verify fails the run, so the dispatcher hands the source run over again.
    # Attempt 1 takes the runner job's owned label when it named one (a fresh
    # work directory, removed after the job); every re-run, the owned-pool
    # rescue's included, takes Blacksmith. Rule 6 of
    # tests/test_ci_signing_keychain_is_deleted_before_bundle_code.py allows
    # exactly this runs-on (OWNED_VERIFY_JOBS).
    needs: [sign, runner]
    # The runner job is only a placement: its failure keeps Blacksmith.
    if: ${{ !cancelled() && needs.sign.result == 'success' && needs.sign.outputs.signed == 'true' }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || (github.run_attempt == 1 && needs.runner.outputs.label || 'blacksmith-6vcpu-macos-26') }}
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      verified: ${{ steps.check.outputs.verified }}
    env:
      APP_NAME: cmux NEXT DEV
      APP_ARCHIVE_NAME: cmux-NEXT-DEV.zip
      # An owned Mac carries only the lane's Xcode pin, which its label names.
      CMUX_CI_XCODE_APP: ${{ github.run_attempt == 1 && needs.runner.outputs.label != '' && vars.CMUX_CI_XCODE_APP_PR || '' }}
    steps:
      - name: Clear stale git locks (self-hosted reused workspace)
        shell: bash
        run: |
          # Owned Macs reuse the workspace; a job killed mid-checkout can leave
          # a stale lock that fails the next checkout.
          ws="${GITHUB_WORKSPACE:-$PWD}"
          rm -f "$ws/.git/index.lock" 2>/dev/null || true
          if [ -d "$ws/.git/modules" ]; then
            find "$ws/.git/modules" -type f -name "*.lock" -delete 2>/dev/null || true
          fi

      - name: Checkout trusted verification scripts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Select Xcode
        run: ./scripts/select-ci-xcode.sh

      # The download, unpack and checks happen in a new directory, removed in
      # the always() step below, never in the reused workspace.
      - name: Make a fresh work directory
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/cmux-next-dev-verify-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          rm -rf "$dir"
          mkdir -p "$dir"
          echo "VERIFY_DIR=$dir" >> "$GITHUB_ENV"

      - name: Download the signed app
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: cmux-next-dev-daily-signed
          path: ${{ env.VERIFY_DIR }}/signed-handoff

      - name: Verify signed diff sidecar runtime contract
        id: check
        run: |
          set -euo pipefail
          scripts="$PWD/scripts"
          entitlements="$PWD/cmux.next-dev.entitlements"
          cd "$VERIFY_DIR"
          (cd signed-handoff && shasum -a 256 -c "$APP_ARCHIVE_NAME.sha256")
          mkdir -p signed
          /usr/bin/ditto -x -k "signed-handoff/$APP_ARCHIVE_NAME" signed
          APP_PATH="signed/$APP_NAME.app"
          # A framework link that came back from the Linux zip as a copy or a
          # file fails this check (unsealed or ambiguous bundle contents).
          /usr/bin/codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          # The codesign -d checks sign-cmux-bundle.sh made after signing.
          python3 "$scripts/ci/verify_signed_dev_app.py" "$APP_PATH" "$entitlements"
          "$scripts/verify-diff-sidecar-artifact.sh" \
            "$APP_PATH/Contents/Resources/bin/cmux-diff-sidecar" \
            --archs "$(lipo -archs "$APP_PATH/Contents/MacOS/cmux")" \
            --require-signed
          mkdir -p tested
          cp "signed-handoff/$APP_ARCHIVE_NAME.sha256" tested/tested.sha256
          echo "verified=true" >> "$GITHUB_OUTPUT"

      - name: Upload the tested digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-next-dev-daily-tested
          path: ${{ env.VERIFY_DIR }}/tested/tested.sha256
          if-no-files-found: error
          retention-days: 3

      - name: Remove the work directory
        if: always()
        run: |
          if [[ -n "${VERIFY_DIR:-}" ]]; then rm -rf "$VERIFY_DIR"; fi

  publish:
    name: Publish cmux NEXT DEV
    # Leo: "skip whatever else slows it (smoke, train gating, waiting for
    # nightly)." Signing and Apple's codesign verification remain the
    # admission gate; with the signer on Linux, codesign runs in verify, so
    # publish needs verify to succeed with outputs.verified 'true'. A skipped
    # or cancelled verify blocks it (its outputs are empty then, and its result
    # is not success).
    needs: [sign, verify]
    if: ${{ !cancelled() && needs.sign.result == 'success' && needs.sign.outputs.signed == 'true' && needs.verify.result == 'success' && needs.verify.outputs.verified == 'true' }}
    # No concurrency group (a group replaces a pending run, which the dev-build
    # rule forbids): runs publish side by side, and the newest source commit
    # wins. The check and the write happen inside a lease on R2 (conditional
    # writes), so no run writes between another's check and its write. The
    # lease outlives the publish step's own timeout on R2's clock, so it is
    # never taken from a run that is still writing.
    environment: release
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || 'blacksmith-4vcpu-ubuntu-2404' }}
    # Room for one wait of up to an hour for the API budget's reset (below).
    timeout-minutes: 75
    permissions:
      contents: write
    env:
      RELEASE_TAG: cmux-next-dev
      APP_ARCHIVE_NAME: cmux-NEXT-DEV.zip
      SOURCE_SHA: ${{ needs.sign.outputs.source_sha }}
    steps:
      - name: Download the signed app
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: cmux-next-dev-daily-signed
          path: signed-handoff

      - name: Require the signed archive
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "sign job gave no source SHA" >&2; exit 1; }
          cp "signed-handoff/$APP_ARCHIVE_NAME" "$RUNNER_TEMP/$APP_ARCHIVE_NAME"
          (cd signed-handoff && shasum -a 256 "$APP_ARCHIVE_NAME") > "$RUNNER_TEMP/$APP_ARCHIVE_NAME.sha256"

      - name: Checkout trusted R2 scripts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: scripts/ci

      # The release writes need contents: write, which only GITHUB_TOKEN has here,
      # and GITHUB_TOKEN's budget is shared by every workflow (run 40243784267
      # failed its asset upload with "API rate limit exceeded for installation").
      # One bounded wait, not a poll: when fewer than 30 calls are left, wait for
      # the reset, at most an hour (scripts/ci/gh_budget_wait.sh --reserve, #25434,
      # which main does not carry yet). Reading /rate_limit costs nothing.
      - name: Wait for the API budget before publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          left="$(gh api rate_limit --jq '.resources.core.remaining' 2>/dev/null || echo "")"
          [[ "$left" =~ ^[0-9]+$ ]] || exit 0
          (( left >= 30 )) && exit 0
          now="$(date +%s)"
          reset="$(gh api rate_limit --jq '.resources.core.reset' 2>/dev/null || echo 0)"
          [[ "$reset" =~ ^[0-9]+$ ]] || reset=0
          wait=$(( reset > now ? reset - now + 5 : 60 ))
          (( wait > 3600 )) && wait=3600
          echo "::notice title=GitHub API budget::$left calls left; waiting ${wait}s for the reset before publishing"
          sleep "$wait"

      - name: Publish the rolling GitHub prerelease
        # The step's own bound, which the R2 lease below outlives; the budget
        # wait above runs before the lease is taken.
        timeout-minutes: 45
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          AWS_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: "https://${{ secrets.CF_R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
          R2_BUCKET: cmux-binaries
          LEASE_KEY: nightly-next/locks/cmux-next-dev-publish.json
          # The commit the channel publishes, recorded before the release
          # changes: a write that fails halfway still blocks older commits.
          RECORD_KEY: nightly-next/locks/cmux-next-dev-published.json
          LEASE_OWNER: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/$APP_ARCHIVE_NAME"
          notes="$(cat <<EOF
          Rolling cmux NEXT DEV Release build from feat-cmux-next commit $SOURCE_SHA.

          This channel is Developer ID signed and intentionally not notarized; download with curl or gh so macOS does not add quarantine.
          EOF
          )"
          # The budget check above is not enough: other workflows spend the shared
          # budget between it and these calls (run 40350641729's asset upload was
          # refused a second after the check passed). A call refused for the rate
          # limit waits for the reset and runs again: at most 3 tries, and at most
          # 15 minutes of waiting in this step (one ledger file, subshells
          # included), since the step holds the R2 lease while it waits.
          # A refused request did nothing on GitHub's side, so retrying a one-request
          # call (view, compare, upload --clobber, edit) is safe; any other failure
          # fails as before. Each attempt's stdout is held back and only a
          # successful attempt's is printed: gh api prints a refused response's body
          # on stdout, which would otherwise precede the real answer in a capture.
          waited_file="$RUNNER_TEMP/gh-budget-waited"
          ghw() {
            local try rc out err now reset wait waited
            for try in 1 2 3; do
              out="$(mktemp)"
              err="$(mktemp)"
              gh "$@" >"$out" 2>"$err" && { cat "$out"; cat "$err" >&2; rm -f "$out" "$err"; return 0; }
              rc=$?
              cat "$err" >&2
              if (( try == 3 )) || ! grep -qiE 'rate limit exceeded|secondary rate limit|too many requests|HTTP 429' "$err" "$out"; then
                rm -f "$out" "$err"
                return "$rc"
              fi
              rm -f "$out" "$err"
              waited="$(cat "$waited_file" 2>/dev/null || echo 0)"
              now="$(date +%s)"
              reset="$(gh api rate_limit --jq '.resources.core.reset' 2>/dev/null || echo 0)"
              [[ "$reset" =~ ^[0-9]+$ ]] || reset=0
              wait=$(( reset > now ? reset - now + 5 : 60 ))
              (( wait > 900 - waited )) && wait=$(( 900 - waited ))
              (( wait > 0 )) || return "$rc"
              echo "::notice title=GitHub API budget::gh $1 $2 refused for the rate limit (try $try of 3); waiting ${wait}s for the reset" >&2
              sleep "$wait"
              echo $(( waited + wait )) > "$waited_file"
            done
          }
          # Never roll the channel back. The record names the newest commit any
          # run started publishing (before the record existed, the release
          # notes did). This run writes when its commit is newer, or is that
          # commit (a run repairing its own failed write). Two commits that
          # diverged mean feat-cmux-next was rewritten: the one still on the
          # branch wins. Any read or compare error fails the run.
          compare() {
            local status
            status="$(ghw api "repos/$GH_REPO/compare/$1...$2" --jq '.status')" || exit 1
            case "$status" in
              ahead|behind|identical|diverged) echo "$status" ;;
              *) echo "compare $1...$2 gave '$status'" >&2; exit 1 ;;
            esac
          }
          on_branch() {
            local status
            status="$(compare "$1" feat-cmux-next)" || exit 1
            [[ "$status" == ahead || "$status" == identical ]]
          }
          published_commit() {
            local body
            record_etag="$(python3 scripts/ci/r2_cas.py get --key "$RECORD_KEY" --out "$RUNNER_TEMP/record.json")" || exit 1
            if [[ "$record_etag" != absent ]]; then
              published="$(jq -r '.commit // empty' "$RUNNER_TEMP/record.json")" || exit 1
              [[ "$published" =~ ^[0-9a-f]{40}$ ]] || { echo "the publish record names no commit" >&2; exit 1; }
              return
            fi
            published=""
            if ! body="$(ghw api "repos/$GH_REPO/releases/tags/$RELEASE_TAG" --jq '.body // ""' 2>"$RUNNER_TEMP/release.err")"; then
              grep -q 'HTTP 404' "$RUNNER_TEMP/release.err" || { cat "$RUNNER_TEMP/release.err" >&2; exit 1; }
              return 0  # no release yet
            fi
            published="$(grep -oE 'commit [0-9a-f]{40}' <<<"$body" | head -n 1 | cut -d' ' -f2)" || published=""
            # A release that exists but names no commit (empty or edited notes)
            # could be newer than this run.
            [[ -n "$published" ]] || { echo "the $RELEASE_TAG release names no source commit; not overwriting it" >&2; exit 1; }
          }
          # Whether the repository still has the commit: false only on GitHub's
          # "no such commit" (404 or 422); any other error fails the run.
          exists() {
            ghw api "repos/$GH_REPO/commits/$1" --jq '.sha' >/dev/null 2>"$RUNNER_TEMP/commit.err" && return 0
            grep -qE 'HTTP (404|422)' "$RUNNER_TEMP/commit.err" && return 1
            cat "$RUNNER_TEMP/commit.err" >&2; exit 1
          }
          not_newer() {
            published_commit
            [[ -n "$published" ]] || return 1
            # A recorded commit the repository no longer has (a force push and
            # garbage collection after a failed write) cannot be compared, and
            # would block every later run. A commit still on the source branch
            # replaces it, with an annotation naming the lost commit.
            if ! exists "$published"; then
              if on_branch "$SOURCE_SHA"; then
                echo "::warning title=cmux NEXT DEV record reset::the recorded commit $published no longer exists; $SOURCE_SHA, on the source branch, replaces it"
                return 1
              fi
              echo "the recorded commit $published no longer exists and $SOURCE_SHA is not on the source branch" >&2; exit 1
            fi
            local status
            status="$(compare "$SOURCE_SHA" "$published")" || exit 1
            case "$status" in
              behind|identical) return 1 ;;
              diverged)
                if ! on_branch "$published" && on_branch "$SOURCE_SHA"; then return 1; fi ;;
            esac
            echo "::notice::cmux NEXT DEV already publishes $published, which is not older than $SOURCE_SHA; skipping"
            return 0
          }
          record() {
            local condition=(--if-absent)
            [[ "$record_etag" == absent ]] || condition=(--if-match "$record_etag")
            jq -n --arg commit "$SOURCE_SHA" --arg run "$LEASE_OWNER" '{commit: $commit, run: $run}' > "$RUNNER_TEMP/record-new.json"
            python3 scripts/ci/r2_cas.py put --key "$RECORD_KEY" --file "$RUNNER_TEMP/record-new.json" \
              --content-type application/json --cache-control no-store "${condition[@]}" \
              || { echo "the publish record changed outside the lease" >&2; exit 1; }
          }
          # The tag sits on this workflow's main commit: a tag at a feat-cmux-next
          # commit needs the workflows permission (HTTP 403). The notes name
          # the source commit; consumers read only the assets.
          # The notes change last, so they never name a commit whose assets did
          # not upload.
          write() {
            # Create (once, when the release does not exist yet) makes several
            # requests, so it is not replayed: a refusal fails the job and the
            # dispatcher retries.
            if ! ghw release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
              gh release create "$RELEASE_TAG" --repo "$GH_REPO" --target "$GITHUB_SHA" --title 'cmux NEXT DEV' --notes "$notes" --prerelease --latest=false \
                "$archive" "$archive.sha256"
            else
              ghw release upload "$RELEASE_TAG" --repo "$GH_REPO" "$archive" "$archive.sha256" --clobber
              ghw release edit "$RELEASE_TAG" --repo "$GH_REPO" --title 'cmux NEXT DEV' --notes "$notes" --prerelease --latest=false
            fi
          }
          # This step's timeout (45 minutes: 25 waiting for the lease, 15 of
          # rate-limit waits, the rest for the work) ends every holder before
          # its lease (50 minutes on R2's clock) runs out.
          python3 scripts/ci/r2_cas.py lock --key "$LEASE_KEY" --owner "$LEASE_OWNER" --ttl 3000 --wait 1500 \
            || { echo "another publisher held the lease for 25 minutes" >&2; exit 1; }
          trap 'python3 scripts/ci/r2_cas.py unlock --key "$LEASE_KEY" --owner "$LEASE_OWNER" || true' EXIT
          not_newer && exit 0
          record
          python3 scripts/ci/r2_cas.py holds --key "$LEASE_KEY" --owner "$LEASE_OWNER" \
            || { echo "lost the publish lease before writing" >&2; exit 1; }
          write
          echo "Published $RELEASE_TAG for $SOURCE_SHA"

  # The tip feed (Leo, 2026-10-24: "a separate app ... that is able to just
  # track the latest tip"). cmux NEXT DEV reads it with Sparkle and installs
  # each build by itself; deltas from the last builds keep a pull small.
  # Independent of publish: a notarization or feed failure never holds the
  # rolling prerelease, and the prerelease never holds the feed. Like publish,
  # it ships only what verify passed: Apple's codesign checks the Linux
  # signature there before tip builds, signs or submits a DMG.
  tip:
    name: Publish the cmux NEXT DEV tip feed
    # Advisory: the dispatcher treats only successful publisher runs as
    # handled, so a red tip job would re-sign and re-publish the same source
    # run every tick. A failure still shows red on the job.
    continue-on-error: true
    needs: [sign, verify]
    if: ${{ !cancelled() && needs.sign.result == 'success' && needs.sign.outputs.signed == 'true' && needs.sign.outputs.build != '' && needs.verify.result == 'success' && needs.verify.outputs.verified == 'true' }}
    # No concurrency group (a group replaces a pending run, which the dev-build
    # rule forbids): tip runs side by side, and the newest build wins. The
    # feed write is a compare-and-swap on R2 (If-Match on the feed it read),
    # so an older build can never overwrite a newer one.
    environment: release
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || 'blacksmith-6vcpu-macos-26' }}
    timeout-minutes: 55
    permissions:
      contents: read
    env:
      APP_NAME: cmux NEXT DEV
      APP_ARCHIVE_NAME: cmux-NEXT-DEV.zip
      TIP_DMG_NAME: cmux-NEXT-DEV.dmg
      # Each attempt's archive and deltas get their own names: every attempt
      # signs its own DMG, and R2 keeps uploads write-once, so a feed's
      # signature always matches the bytes behind its URL and a re-run never
      # collides with an earlier attempt's upload.
      TIP_RUN_TAG: r${{ github.run_id }}-${{ github.run_attempt }}
      TIP_BUILD: ${{ needs.sign.outputs.build }}
      SOURCE_SHA: ${{ needs.sign.outputs.source_sha }}
      TIP_BASE_URL: https://files.cmux.com/nightly-next/tip
      TIP_R2_PREFIX: nightly-next/tip
      TIP_APPCAST: appcast-arm64.xml
      # Builds the feed keeps; the newest gets deltas from the others.
      TIP_KEEP: "3"
    steps:
      - name: Checkout trusted feed scripts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Select Xcode
        run: ./scripts/select-ci-xcode.sh

      - name: Download the signed app
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: cmux-next-dev-daily-signed
          path: signed-handoff

      # Never roll the feed back, and fetch the builds deltas start from.
      - name: Read the live tip feed
        id: feed
        run: |
          set -euo pipefail
          (cd signed-handoff && shasum -a 256 -c "$APP_ARCHIVE_NAME.sha256")
          [[ "$TIP_BUILD" =~ ^[0-9]+$ ]] || { echo "tip build '$TIP_BUILD' is not a number" >&2; exit 1; }
          mkdir -p tip-previous
          status="$(curl --silent --show-error --location --retry 3 --output tip-live.xml --write-out '%{http_code}' \
            -H 'Cache-Control: no-cache' "$TIP_BASE_URL/$TIP_APPCAST?build=$TIP_BUILD")"
          if [[ "$status" == 404 ]]; then
            echo "No tip feed yet; publishing the first item"
            echo "fresh=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$status" == 200 ]] || { echo "tip feed returned HTTP $status" >&2; exit 1; }
          python3 scripts/ci/tip_feed.py previous tip-live.xml --build "$TIP_BUILD" --keep "$TIP_KEEP" > tip-previous.txt
          if [[ "$(head -n 1 tip-previous.txt)" != fresh ]]; then
            echo "::notice::the tip feed already has build $(head -n 1 tip-previous.txt | cut -d' ' -f2), not older than $TIP_BUILD; skipping"
            echo "fresh=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tail -n +2 tip-previous.txt | while read -r url; do
            curl --fail --silent --show-error --location --retry 3 -o "tip-previous/$(basename "$url")" "$url" \
              || echo "::warning::could not fetch $url; no delta from it"
          done
          echo "fresh=true" >> "$GITHUB_OUTPUT"

      # The signed archive the sign job made on Linux (its sha256 was checked
      # above), checked by codesign before it goes into the DMG.
      - name: Build the tip DMG
        if: steps.feed.outputs.fresh == 'true'
        run: |
          set -euo pipefail
          mkdir -p signed tip-handoff
          /usr/bin/ditto -x -k "signed-handoff/$APP_ARCHIVE_NAME" signed
          /usr/bin/codesign --verify --deep --strict --verbose=2 "signed/$APP_NAME.app"
          dmg_root="$RUNNER_TEMP/cmux-next-dev-tip/dmg-root"
          mkdir -p "$dmg_root"
          /usr/bin/ditto "signed/$APP_NAME.app" "$dmg_root/$APP_NAME.app"
          ln -s /Applications "$dmg_root/Applications"
          hdiutil create -quiet -volname "$APP_NAME" -srcfolder "$dmg_root" -format ULMO -ov "tip-handoff/$TIP_DMG_NAME"

      - name: Import the protected Developer ID certificate
        if: steps.feed.outputs.fresh == 'true'
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        # No code from the app runs in this job, and the keychain is deleted
        # right after the DMG signature.
        run: |
          set -euo pipefail
          ./scripts/ci/signing-keychain.sh create --keychain cmux-next-dev-tip.keychain
          echo "CMUX_NEXT_DEV_TIP_KEYCHAIN=cmux-next-dev-tip.keychain" >> "$GITHUB_ENV"

      - name: Sign the tip DMG
        if: steps.feed.outputs.fresh == 'true'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          [[ -n "$APPLE_SIGNING_IDENTITY" ]] || { echo "Missing APPLE_SIGNING_IDENTITY" >&2; exit 1; }
          ./scripts/ci/signing-keychain.sh unlock
          /usr/bin/codesign --force --timestamp --keychain "$CMUX_NEXT_DEV_TIP_KEYCHAIN" --sign "$APPLE_SIGNING_IDENTITY" "tip-handoff/$TIP_DMG_NAME"
          /usr/bin/codesign --verify --verbose=2 "tip-handoff/$TIP_DMG_NAME"

      - name: Delete signing keychain after signing
        if: always() && steps.feed.outputs.fresh == 'true'
        run: ./scripts/ci/signing-keychain.sh delete

      - name: Notarize and staple the tip DMG
        if: steps.feed.outputs.fresh == 'true'
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          NOTARY_TMP="$(mktemp -d "$RUNNER_TEMP/cmux-notary.XXXXXX")"
          trap 'rm -rf "$NOTARY_TMP"' EXIT
          source ./scripts/ci/lib/notary-auth.sh
          notary_auth_init "$NOTARY_TMP"
          dmg="tip-handoff/$TIP_DMG_NAME"
          # Submit, then wait for that submission; submit again (and wait)
          # when its status could not be read.
          status=""
          submit="$(xcrun notarytool submit "$dmg" "${NOTARY_AUTH_ARGS[@]}" --no-wait --output-format json)"
          id="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])' <<<"$submit")"
          [[ "$id" =~ ^[0-9a-f-]{36}$ ]] || { echo "unexpected notarytool id '$id'" >&2; exit 1; }
          if result="$(xcrun notarytool wait "$id" "${NOTARY_AUTH_ARGS[@]}" --timeout 30m --output-format json)"; then
            status="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])' <<<"$result")"
          fi
          [[ -n "$status" ]] || echo "::warning::could not read submission $id; submitting again"
          if [[ -z "$status" ]]; then
            submit="$(xcrun notarytool submit "$dmg" "${NOTARY_AUTH_ARGS[@]}" --wait --timeout 30m --output-format json)"
            id="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])' <<<"$submit")"
            status="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])' <<<"$submit")"
          fi
          if [[ "$status" != Accepted ]]; then
            echo "tip DMG notarization failed with status: $status" >&2
            xcrun notarytool log "$id" "${NOTARY_AUTH_ARGS[@]}" || true
            exit 1
          fi
          notary_auth_forget "$NOTARY_TMP"
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          # The archive name carries the build so each item keeps its own URL.
          mkdir -p tip-new
          cp "$dmg" "tip-new/cmux-NEXT-DEV-$TIP_BUILD-$TIP_RUN_TAG.dmg"

      - name: Generate the tip appcast with deltas
        if: steps.feed.outputs.fresh == 'true'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.NIGHTLY_SPARKLE_PRIVATE_KEY }}
          DOWNLOAD_URL_PREFIX: https://files.cmux.com/nightly-next/tip/
          RELEASE_NOTES_URL: https://github.com/${{ github.repository }}/commit/${{ needs.sign.outputs.source_sha }}
          SPARKLE_PREVIOUS_ARCHIVES_DIR: tip-previous
          SPARKLE_MAXIMUM_DELTAS: "2"
          SPARKLE_DELTA_NAME_PREFIX: cmux-NEXT-DEV-tip-${{ github.run_id }}-${{ github.run_attempt }}-
        run: |
          set -euo pipefail
          # The feed key must be the key the app inside this DMG trusts:
          # sparkle_generate_appcast.sh's sign_update fallback would otherwise
          # sign with a key installed tip apps reject.
          signing_key="$(
            printf '%s' "$SPARKLE_PRIVATE_KEY" |
              env -u SPARKLE_PRIVATE_KEY swift scripts/derive_sparkle_public_key.swift --stdin
          )"
          mount="$(mktemp -d "$RUNNER_TEMP/tip-dmg.XXXXXX")"
          hdiutil attach -quiet -nobrowse -readonly -mountpoint "$mount" "tip-new/cmux-NEXT-DEV-$TIP_BUILD-$TIP_RUN_TAG.dmg"
          app_key="$(/usr/libexec/PlistBuddy -c 'Print :SUPublicEDKey' "$mount/cmux NEXT DEV.app/Contents/Info.plist")"
          app_build="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$mount/cmux NEXT DEV.app/Contents/Info.plist")"
          hdiutil detach -quiet "$mount"
          [[ "$app_key" == "$signing_key" ]] || { echo "the tip app trusts $app_key, but the feed would be signed by $signing_key" >&2; exit 1; }
          [[ "$app_build" == "$TIP_BUILD" ]] || { echo "the DMG holds build $app_build, not $TIP_BUILD" >&2; exit 1; }
          mkdir -p tip-out
          ./scripts/sparkle_generate_appcast.sh "tip-new/cmux-NEXT-DEV-$TIP_BUILD-$TIP_RUN_TAG.dmg" cmux-next-tip "tip-out/$TIP_APPCAST" 2>&1 | tee tip-appcast.log
          if grep -q "generate_appcast did not add edSignature" tip-appcast.log; then
            echo "generate_appcast refused the key for this archive; not publishing a feed the app cannot verify" >&2
            exit 1
          fi
          python3 scripts/ci/tip_feed.py check "tip-out/$TIP_APPCAST" --build "$TIP_BUILD"

      # Archives and deltas first, the feed last: a feed never names a file
      # that is not there yet.
      - name: Upload the tip feed to R2
        if: steps.feed.outputs.fresh == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: "https://${{ secrets.CF_R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
          R2_BUCKET: cmux-binaries
        run: |
          set -euo pipefail
          key="$TIP_R2_PREFIX/$TIP_APPCAST"
          # The feed as R2 holds it now: its ETag, and stop if it already has
          # this build or a newer one.
          read_live() {
            etag="$(python3 scripts/ci/r2_cas.py get --key "$key" --out tip-live-now.xml)"
            newest=0
            [[ "$etag" == absent ]] || newest="$(python3 scripts/ci/tip_feed.py newest tip-live-now.xml)"
            if (( newest >= TIP_BUILD )); then
              echo "::notice::the tip feed already has build $newest, not older than $TIP_BUILD; not writing the feed"
              exit 0
            fi
          }
          read_live
          # Archives and deltas are write-once under names unique to this
          # attempt, so no run replaces bytes a feed already signed. Until the
          # feed names them, they are this attempt's alone: a run that ends
          # without writing the feed removes them (cmux_binaries_prune.py leaves
          # this prefix alone). A feed write that failed without a clear
          # conflict may have landed, or may still land, so after one the
          # uploads stay.
          uploaded=() written=false unsure=false
          cleanup() {
            local status=$?  # the step's own status, kept: the trap never turns a failure green
            if [[ "$unsure" == true ]]; then
              echo "::warning::a tip feed write ended without a clear answer; keeping this attempt's uploads"
            elif [[ "$written" != true ]]; then
              for object in ${uploaded[@]+"${uploaded[@]}"}; do
                python3 scripts/ci/r2_cas.py delete --key "$object" || echo "::warning::could not remove $object"
              done
            fi
            exit "$status"
          }
          trap cleanup EXIT
          upload() {
            local object
            object="$TIP_R2_PREFIX/$(basename "$1")"
            uploaded+=("$object")
            python3 scripts/ci/upload-r2-object.py --file "$1" --endpoint-url "$R2_ENDPOINT" \
              --bucket cmux-binaries --key "$object" \
              --content-type "$2" --cache-control "$3" --write-once
          }
          upload "tip-new/cmux-NEXT-DEV-$TIP_BUILD-$TIP_RUN_TAG.dmg" application/x-apple-diskimage "public, max-age=31536000, immutable"
          for delta in tip-out/*.delta; do
            [[ -f "$delta" ]] || continue
            upload "$delta" application/octet-stream "public, max-age=31536000, immutable"
          done
          # Compare and swap. The appcast was generated from an earlier read of
          # the feed, so this build's item is merged onto the feed R2 holds now
          # (a build published in between stays), and written only while R2
          # still holds that feed. A run that loses the race reads again.
          for attempt in 1 2 3 4 5; do
            (( attempt == 1 )) || read_live
            if [[ "$etag" == absent ]]; then live=absent condition=(--if-absent); else live=tip-live-now.xml condition=(--if-match "$etag"); fi
            python3 scripts/ci/tip_feed.py merge "tip-out/$TIP_APPCAST" "$live" --build "$TIP_BUILD" --keep "$TIP_KEEP" --out tip-merged.xml
            python3 scripts/ci/tip_feed.py check tip-merged.xml --build "$TIP_BUILD"
            rc=0 unsure=true
            python3 scripts/ci/r2_cas.py put --key "$key" --file tip-merged.xml \
              --content-type application/xml --cache-control "no-cache, no-store, must-revalidate" "${condition[@]}" || rc=$?
            if (( rc == 0 )); then written=true; break; fi
            (( rc == 3 )) || exit "$rc"
            unsure=false  # R2 refused the write: it never lands
            echo "::warning::another run wrote the tip feed first; reading it again (attempt $attempt)"
            (( attempt < 5 )) || { echo "the tip feed kept changing under build $TIP_BUILD" >&2; exit 1; }
          done
          {
            echo "### cmux NEXT DEV tip $TIP_BUILD"
            echo "feat-cmux-next $SOURCE_SHA, feed $TIP_BASE_URL/$TIP_APPCAST"
            echo "deltas: $(find tip-out -name '*.delta' | wc -l | tr -d ' ')"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup signing keychain
        if: always()
        run: |
          if [[ -n "${CMUX_NEXT_DEV_TIP_KEYCHAIN:-}" ]]; then
            ./scripts/ci/signing-keychain.sh delete --keychain "$CMUX_NEXT_DEV_TIP_KEYCHAIN" \
              || security delete-keychain "$CMUX_NEXT_DEV_TIP_KEYCHAIN" >/dev/null 2>&1 || true
          fi
