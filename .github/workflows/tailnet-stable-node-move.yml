name: Tailnet stable node move (real staging VMs)

# The stable tailnet node's move with two real staging Cloud machines as its backends:
# cmux-tui/crates/cmux-tailnet-front/testing/stable-node-vm-move.sh. A throwaway headscale runs in docker on
# this runner (reached from the VMs through a bore.pub TCP relay), acpmux built with --features tailnet hosts
# the front (node `cmux`), scripts/cmux-next/tailnet-move-vms.ts starts cmux-test-<run>-tailnet-move-a and -b
# and joins each with its own single-use ephemeral key, and the run moves workspace default A -> B under
# move_probe.py load and prints stable-node-e2e.sh's rows (reach, move numbers, restart identity).
# Both VMs are logged out and deleted in the script's cleanup and again in the always() step below; leftovers
# older than 3 h are swept by the next run.
#
# Secrets: the staging agent test account in cmux-next-vm-image-dev (as cloud-chief-start.yml). Same-repo pull
# requests only; without the pair the job fails, never skips.

on:
  workflow_dispatch:
  pull_request:
    branches: [feat-cmux-next]
    paths:
      - cmux-tui/crates/cmux-tailnet-front/testing/stable-node-vm-move.sh
      - cmux-tui/crates/cmux-tailnet-front/testing/move_probe.py
      - scripts/cmux-next/tailnet-move-vms.ts
      - .github/workflows/tailnet-stable-node-move.yml
      - cmux-tui/crates/cmux-tailnet-join/**
      - cmux-tui/crates/cmux-tui/src/cli/vm_tailnet.rs

permissions:
  contents: read

concurrency:
  group: tailnet-stable-node-move-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  move:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || contains(fromJSON('["blacksmith-8vcpu-ubuntu-2404","blacksmith-16vcpu-ubuntu-2404","blacksmith-4vcpu-ubuntu-2404"]'), vars.LINUX_RUNNER) && vars.LINUX_RUNNER || vars.CI_CLOUD_OVERFLOW_SAVED && fromJSON(vars.RUNNER_POOLS).linux_16 || fromJSON(vars.RUNNER_POOLS).linux_8 }}
    environment:
      name: cmux-next-vm-image-dev
      deployment: false
    # Two cold debug builds (acpmux --features tailnet, then cmux-tui) took 52 min in run 45715050700
    # and 68 min on a freestyle runner in run 45830130860, whose move then hit a 100-min cap mid-step.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: false
      - name: Restore pinned Bun 1.4.4 from the CI cache bucket
        shell: bash
        continue-on-error: true
        run: bash "$GITHUB_WORKSPACE/scripts/ci/toolchain-r2.sh" restore bun 1.4.4 || true
      # Before the build: the always() cleanup below needs bun even when the build fails.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
          no-cache: ${{ !startsWith(github.workspace, '/home/runner/work/') }}
      # The cmux CLI (cmux-tui) links libghostty-vt, built with Zig from the ghostty-next submodule
      # (cloud-journey-pr.yml's steps). Run 45715050700 failed without them: ghostty-next missing build.zig.
      - name: Initialize the ghostty-next submodule
        run: git submodule update --init --depth 1 ghostty ghostty-next
      - name: Install Linux cmux-tui build dependencies
        run: |
          # Skip apt when the runner image already has these (tests/test_ci_apt_skips_baked_packages.py).
          if dpkg -s clang libclang-dev pkg-config >/dev/null 2>&1; then
            echo "clang libclang-dev pkg-config: already installed"
          else
            sudo apt-get update
            sudo apt-get install -y clang libclang-dev pkg-config
          fi
      - name: Set up cmux-tui Rust
        uses: ./.github/actions/setup-cmux-tui-rust
      - name: Resolve Ghostty Zig version
        id: ghostty-zig-version
        env:
          GHOSTTY_ZIG_SOURCE: ghostty-next
        run: |
          set -euo pipefail
          version="$(bash ./scripts/ghostty-zig-version.sh)"
          [[ -n "$version" ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Set up Zig for Ghostty
        uses: mlugg/setup-zig@8d6198c65fb0feaa111df26e6b467fea8345e46f # v2.0.5
        with:
          version: ${{ steps.ghostty-zig-version.outputs.version }}
          use-cache: false
      - name: Restore the Zig global cache (feat-cmux-next pushes save it)
        uses: ./.github/actions/zig-global-cache
      - name: Give this runner instance its own CARGO_HOME
        uses: ./.github/actions/runner-cargo-home
      # cmux-tailnet's build script compiles libtailscale with `go build` (cmux-tui.yml's step).
      - name: Set up pinned Go (libtailscale)
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: cmux-tui/crates/cmux-tailnet/go-version
          cache: ${{ !contains(runner.name, '-glaeda') }}
          cache-dependency-path: cmux-tui/crates/cmux-tailnet/build.rs
      - name: Build acpmux --features tailnet and the cmux CLI
        id: build
        env:
          CARGO_NET_RETRY: "10"
          CARGO_HTTP_TIMEOUT: "120"
          # Run 45615581795 filled the runner's disk (ENOSPC) mid-build: debug info and incremental state are
          # most of a debug target dir, and this binary is only run, never debugged.
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_INCREMENTAL: "0"
          GHOSTTY_ZIG_SOURCE: ghostty-next
          CMUX_GHOSTTY_SRC: ""
        run: |
          set -euo pipefail
          df -h "$GITHUB_WORKSPACE" "${CARGO_TARGET_DIR:-$GITHUB_WORKSPACE}" 2>/dev/null || true
          (cd cmux-tui && cargo build -p acpmux --features tailnet --locked --bin acpmux)
          bin="$(cd cmux-tui && echo "${CARGO_TARGET_DIR:-$PWD/target}")/debug/acpmux"
          test -x "$bin"
          echo "acpmux=$bin" >> "$GITHUB_OUTPUT"
          # The cmux CLI (cmux-tui) mints VM B's key from a headscale API key (`cmux vm tailnet mint-key`).
          (cd cmux-tui && cargo build -p cmux-tui --locked --bin cmux-tui)
          cli="$(dirname "$bin")/cmux-tui"
          test -x "$cli"
          echo "cmux=$cli" >> "$GITHUB_OUTPUT"
      - name: Move the stable node's placement between two staging VMs
        env:
          CMUX_DOGFOOD_STACK_EMAIL: ${{ secrets.CMUX_DOGFOOD_STACK_EMAIL }}
          CMUX_DOGFOOD_STACK_PASSWORD: ${{ secrets.CMUX_DOGFOOD_STACK_PASSWORD }}
          PRODUCT_TEAM: ${{ vars.CMUX_JOURNEY_PRODUCT_TEAM }}
          RUN: ${{ github.run_id }}-${{ github.run_attempt }}
          OUT: ${{ runner.temp }}/tailnet-move/rows.txt
        run: |
          mkdir -p "$RUNNER_TEMP/tailnet-move"
          bash cmux-tui/crates/cmux-tailnet-front/testing/stable-node-vm-move.sh "${{ steps.build.outputs.acpmux }}" "${{ steps.build.outputs.cmux }}"
      - name: Log out and delete this run's VMs (again, if the script died first)
        if: always()
        continue-on-error: true
        env:
          CMUX_DOGFOOD_STACK_EMAIL: ${{ secrets.CMUX_DOGFOOD_STACK_EMAIL }}
          CMUX_DOGFOOD_STACK_PASSWORD: ${{ secrets.CMUX_DOGFOOD_STACK_PASSWORD }}
          PRODUCT_TEAM: ${{ vars.CMUX_JOURNEY_PRODUCT_TEAM }}
        run: |
          command -v bun >/dev/null || { echo "bun not set up; nothing of this run's to clean up by name"; exit 0; }
          bun scripts/cmux-next/tailnet-move-vms.ts down --run "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" || echo "::warning::tailnet-move-vms down failed; the next run sweeps machines older than 3 h"
      - name: Rows in the job summary
        if: always() && !cancelled()
        run: |
          f="$RUNNER_TEMP/tailnet-move/rows.txt"
          [ -s "$f" ] || exit 0
          { echo '```'; cat "$f"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the rows
        if: always() && !cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tailnet-stable-node-move-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/tailnet-move/rows.txt
          if-no-files-found: warn
          retention-days: 7
