name: base coalesce

# One run per window on the feat-cmux-next tip, for a push workflow whose checks need not run on every merge
# (cmuxterm-hq docs/rfd/0023-ci-10x.md, "everything else runs once post-merge, batched"). A caller adds one job,
#
#   coalesce:
#     uses: ./.github/workflows/base-coalesce.yml
#     with: { key: cmux-next-guards, hold_minutes: 30, no_coalesce: ${{ format('{0}', vars.NEXT_GUARDS_COALESCE) == '0' }} }
#
# and gives each of its other top-level jobs `needs: coalesce` and
# `if: ${{ !cancelled() && needs.coalesce.outputs.run != 'false' && (its own condition) }}`.
# Diffing steps read `needs.coalesce.outputs.base` (the last tip a run started on) where they read
# github.event.before, so a run checks every commit since that run.
#
# The rule: the first feat-cmux-next push in each HOLD-minute window (wall clock, epoch / HOLD) runs the checks,
# covering every commit since the last tip that ran; every other push skips them (run=false: its jobs report as
# skipped, no runner taken). Nothing sleeps on a runner (cmux-next-web's coalesce job held one for up to its whole
# window: about 2,200 runner-minutes a day, ci-dash feed 2026-11-14/16/17). Pushes on feat-cmux-next are about 2.5
# minutes apart (median 1.3, p99 17, max 73 over 2026-11-13..21), so a window's first push comes minutes after it
# opens; a base red is seen at most HOLD + the gap to the next push + the run's own time after it lands, and
# base-red-watch (cmuxterm-hq fleet-reconcilers, commit_bisect) bisects the red job over the covered range.
#
# A direct push (its head commit's committer is not GitHub's merge committer `noreply@github.com`, so no PR merge
# made it) runs too when the caller passes `run_direct_pushes: true`, even inside a taken window: it covers from the
# last tested tip and records itself, so a hand-pushed break gets its own run. cmux-next.yml passes it for the app
# compile: on 2026-11-25 a direct push at 09:17Z broke the compile and its run skipped every compile job, because an
# earlier push had taken the 09:00-09:30 window (cmuxterm-hq docs/handbook/required-checks-are-not-the-compile.md).
#
# Always runs (run=true): a pull request, a workflow_dispatch or workflow_call, any ref but feat-cmux-next, the off
# switch, and a re-run (attempt > 1), which routes from the base its first attempt recorded. State is two tiny
# Actions cache entries per run on feat-cmux-next's scope: `base-coalesce-KEY-w-WINDOW` (this window has its run) and
# `base-coalesce-KEY-t-SHA` (SHA ran; its content is the base it covered from). A lost entry costs one extra run, or
# a run whose base is unknown (base=unknown: the caller checks everything or falls back to its own push range).
# Two pushes racing into an empty window can both run; nothing is ever cancelled.
#
# A window whose run failed is not held (2026-11-25): the next push after a failed or cancelled run of this workflow
# in the window runs again, once per failed run (`base-coalesce-KEY-w-WINDOW-r-RUNID`), at most RETRIES times a
# window. On 2026-11-25 cmux-tui-artifacts' 01:31Z window run failed on a manifest typo fixed four minutes later, and
# every push of the next hour built nothing: no Linux acpmux tree was published for 200 commits, so the lane VMs kept
# an 00:28Z acpmux and the merged fixes never reached them. Leo: "you can't afford to be waiting for the freaking
# things that would fix CI to go through CI". A failed lookup holds the window as before.
#
# The failed run is found without the REST API first: a caller's last job calls this workflow again with
# `mark_failed: true` when a job of a run that claimed the window failed, and it saves the tiny marker
# `base-coalesce-KEY-f-WINDOW-ROUND-RUNID` (ROUND: 0 for the window's run, 1.. for its retries; none past RETRIES).
# A caller passes `held: true` for a run that failed after it delivered its window's output (cmux-tui-artifacts: its
# tree published, then only the daemon tests failed): the marker `base-coalesce-KEY-f-WINDOW-held-RUNID` holds the
# window. On 2026-11-26 four 01:00Z runs each published and rebuilt the whole tree for one daemon-test red.
# The REST lookup is the fallback for a caller with no marker job, and is skipped when the installation's REST budget
# is spent (2026-11-25 02:37Z: the first push after the fix got HTTP 403 and held the window).
on:
  workflow_call:
    inputs:
      key:
        description: the caller's coalescing key (its workflow file's stem)
        type: string
        required: true
      hold_minutes:
        description: the window; the checks run at most once per window on the tip
        type: number
        default: 30
      no_coalesce:
        description: no coalescing; every push runs (the caller passes its vars switch)
        type: boolean
        default: false
      run_direct_pushes:
        description: >-
          a push whose head commit GitHub did not commit (no PR merge: a hand push, a bot's autofix) runs even inside a
          taken window; lander merges keep coalescing
        type: boolean
        default: false
      runner:
        description: >-
          the runner label for this job ('' keeps cmux-linux). A caller on the nightly's critical path passes its own
          pool: on 2026-11-25 cmux-tui-artifacts' gate queued 44 min on a backed-up cmux-linux for a 5 s cache read
        type: string
        default: ''
      mark_failed:
        description: "the caller's failure job: save this run's failed marker for WINDOW (needs.coalesce.outputs.window)"
        type: boolean
        default: false
      window:
        description: with mark_failed, the window this run's coalesce job named
        type: string
        default: ''
      round:
        description: with mark_failed, this run's round in its window (needs.coalesce.outputs.round)
        type: string
        default: ''
      held:
        description: >-
          with mark_failed, the run failed after it delivered what its window exists for (cmux-tui-artifacts: its
          tree published): save a held marker, so the window's next push does not run it all again for a red that a
          rebuild does not fix, and does not fall back to the REST lookup that would find this run
        type: boolean
        default: false
    outputs:
      run:
        description: "'true' when this run's checks run, 'false' when a newer window's run covers this push"
        value: ${{ jobs.coalesce.outputs.run }}
      base:
        description: "the last tip a run of KEY started on (a sha), 'unknown' when none is recorded, '' when not coalescing"
        value: ${{ jobs.coalesce.outputs.base }}
      window:
        description: this push's window (for a mark_failed call)
        value: ${{ jobs.coalesce.outputs.window }}
      round:
        description: "0 when this run claimed its window, 1.. when it re-runs a failed run of it, '' otherwise"
        value: ${{ jobs.coalesce.outputs.round }}
      claimed:
        description: "'true' when this run claimed its window or a retry of it (a failure job marks only such a run)"
        value: ${{ jobs.coalesce.outputs.claimed }}

permissions: {}

env:
  # Temporary REST budget attribution: one gh-call line per GitHub API call (scripts/ci/api_call_log/env.sh, fetched at a fixed commit when the checkout has no copy).
  BASH_ENV: '$({ w="${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh"; t="${RUNNER_TEMP:-/nonexistent}/api-call-log-src"; if [ -f "$w" ]; then echo "$w"; elif [ -n "${RUNNER_TEMP:-}" ]; then if [ ! -f "$t/env.sh" ] && [ ! -e "$t.tried" ] && { [ "${RUNNER_OS:-}" = Linux ] || [ "${RUNNER_OS:-}" = macOS ]; } && [ "$(date -u +%Y%m%d%H)" -lt 2026112300 ]; then : > "$t.tried"; mkdir -p "$t.part" && for x in env.sh gh sitecustomize.py isolated.py; do curl -fsSL --max-time 5 -o "$t.part/$x" "https://raw.githubusercontent.com/manaflow-ai/cmux/27647ffd3ae838c63be28ca3e5883dcd68c34518/scripts/ci/api_call_log/$x" || break; done; [ -s "$t.part/isolated.py" ] && mv "$t.part" "$t"; fi; if [ -f "$t/env.sh" ]; then echo "$t/env.sh"; else echo unset BASH_ENV > "$t.off.sh" && echo "$t.off.sh"; fi; fi; } 2>/dev/null)'

jobs:
  coalesce:
    name: coalesce
    # Only pushes to feat-cmux-next decide anything: a pull request (and a workflow_call from one), a dispatch and any
    # other ref skip this job, so its outputs are empty and the caller's jobs run as before.
    if: ${{ !inputs.mark_failed && github.event_name == 'push' && github.ref == 'refs/heads/feat-cmux-next' }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || inputs.runner || 'cmux-linux' }}
    timeout-minutes: 5
    # actions: read lists this workflow's runs in the window (the failed-run retry); the caller's coalesce job grants it.
    permissions:
      actions: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
      base: ${{ steps.decide.outputs.base }}
      window: ${{ steps.window.outputs.window }}
      round: ${{ steps.decide.outputs.round }}
      claimed: ${{ steps.decide.outputs.save }}
    env:
      KEY: ${{ inputs.key }}
      HOLD_MINUTES: ${{ inputs.hold_minutes }}
      ON: ${{ !inputs.no_coalesce && '1' || '0' }}
      RETRIES: 3
      # Read from the push payload, no API call. GitHub commits every PR merge (squash, merge, rebase through the API)
      # as `GitHub <noreply@github.com>`; anything else on the tip was pushed by hand or by a bot.
      DIRECT: ${{ inputs.run_direct_pushes && github.event.head_commit.committer.email != 'noreply@github.com' && '1' || '0' }}
    steps:
      - name: Name this push's window
        id: window
        run: |
          set -euo pipefail
          [[ "$KEY" =~ ^[a-z0-9-]+$ ]] || { echo "::error::bad coalesce key: $KEY"; exit 1; }
          hold=${HOLD_MINUTES%.*}; [[ "$hold" =~ ^[0-9]+$ && "$hold" -ge 1 ]] || { echo "::error::bad hold_minutes: $HOLD_MINUTES"; exit 1; }
          window=$(( $(date +%s) / (hold * 60) ))
          echo "window=$window" >> "$GITHUB_OUTPUT"
          echo "start=$(date -u -d "@$(( window * hold * 60 ))" +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          mkdir -p .base-coalesce

      # Every entry uses this one relative path: actions/cache versions an entry by its path strings, so a lookup
      # under another path (or under runner.temp, which differs between runners) never matches.
      # A re-run: the base its first attempt covered from, so it checks the same commits again.
      - name: Read this push's own record (a re-run)
        id: own
        if: ${{ env.ON == '1' && github.run_attempt != '1' }}
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .base-coalesce/record
          key: base-coalesce-${{ inputs.key }}-t-${{ github.sha }}

      - name: Has this window's run started?
        id: claimed
        if: ${{ env.ON == '1' && github.run_attempt == '1' }}
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .base-coalesce/record
          key: base-coalesce-${{ inputs.key }}-w-${{ steps.window.outputs.window }}
          lookup-only: true

      # A claimed window whose run already failed: the newest run of this workflow in the window with a job a runner
      # took that ended failure, timed_out or cancelled (a run still waiting on other jobs counts: on 2026-11-25 the
      # failed build's run sat in progress for its macOS fallback). A run whose jobs never started (a queued run
      # cancelled as superseded, a coalesced run) is not one. At most RETRIES such runs a window are retried.
      - name: Did a run of this window leave a failed marker?
        id: marker
        if: ${{ env.ON == '1' && steps.claimed.outputs.cache-hit == 'true' }}
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .base-coalesce/record
          key: base-coalesce-${{ inputs.key }}-f-${{ steps.window.outputs.window }}-none
          restore-keys: base-coalesce-${{ inputs.key }}-f-${{ steps.window.outputs.window }}-
          lookup-only: true

      - name: Did this window's run fail?
        id: failed
        if: ${{ env.ON == '1' && steps.claimed.outputs.cache-hit == 'true' }}
        continue-on-error: true
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          START: ${{ steps.window.outputs.start }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WINDOW: ${{ steps.window.outputs.window }}
          MARKER: ${{ steps.marker.outputs.cache-matched-key }}
        run: |
          set -euo pipefail
          if [ -n "$MARKER" ]; then  # the newest marker: ROUND-RUNID, or held-RUNID (mark_failed's held)
            rest=${MARKER##*-f-"$WINDOW"-}; round=${rest%%-*}; id=${rest#*-}
            if [ "$round" = held ]; then
              echo "run $id of this window failed after it delivered its window's output (a held marker): the window holds"
            elif [[ "$round" =~ ^[0-9]+$ && "$id" =~ ^[0-9]+$ ]] && [ "$round" -lt "$RETRIES" ]; then
              echo "run $id of this window failed (its marker, round $round): this push runs again unless another push already did"
              printf 'retry=%s\nround=%s\n' "$id" "$((round + 1))" >> "$GITHUB_OUTPUT"
            else
              echo "the newest failed marker of this window is $MARKER: past $RETRIES retries, the window holds"
            fi
            exit 0
          fi
          wf=${WORKFLOW_REF%%@*}; wf=${wf##*/}
          # A window holds about 25 runs an hour per workflow, most coalesced successes: ask for the failing states only.
          runs=$(for state in in_progress failure timed_out cancelled; do
            timeout 30 gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$wf/runs?branch=feat-cmux-next&event=push&status=$state&created=%3E%3D$START&per_page=20" \
              --jq ".workflow_runs[] | select(.id != $GITHUB_RUN_ID) | \"\\(.run_started_at) \\(.id)\""
          done | sort -r | awk '{print $2}')
          n=0
          for id in $runs; do  # newest first
            [[ "$id" =~ ^[0-9]+$ ]] || continue
            ran=$(timeout 30 gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs?per_page=100" \
              --jq '[.jobs[] | select((.runner_name // "") != "" and (.conclusion == "failure" or .conclusion == "timed_out" or .conclusion == "cancelled"))] | length')
            [ "$ran" -gt 0 ] || continue
            n=$((n + 1))
            [ -n "${retry:-}" ] || retry=$id
          done
          if [ -n "${retry:-}" ] && [ "$n" -le "$RETRIES" ]; then
            echo "run $retry of this window failed: this push runs again unless another push already did"
            printf 'retry=%s\nround=%s\n' "$retry" "$n" >> "$GITHUB_OUTPUT"
          elif [ -n "${retry:-}" ]; then
            echo "$n runs of this window failed (more than $RETRIES): the window holds until the next one"
          fi

      - name: Has a push already re-run that failed run?
        id: retried
        if: ${{ steps.failed.outputs.retry != '' }}
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .base-coalesce/record
          key: base-coalesce-${{ inputs.key }}-w-${{ steps.window.outputs.window }}-r-${{ steps.failed.outputs.retry }}
          lookup-only: true

      # The newest `-t-` entry is the last tip a run started on; its key names it.
      - name: Find the last tested tip
        id: last
        if: ${{ env.ON == '1' && steps.own.outputs.cache-hit != 'true' && (steps.claimed.outputs.cache-hit != 'true' || env.DIRECT == '1' || (steps.failed.outputs.retry != '' && steps.retried.outputs.cache-hit != 'true')) }}
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .base-coalesce/record
          key: base-coalesce-${{ inputs.key }}-t-none
          restore-keys: base-coalesce-${{ inputs.key }}-t-
          lookup-only: true

      - name: Decide
        id: decide
        env:
          CLAIMED: ${{ steps.claimed.outputs.cache-hit }}
          OWN_HIT: ${{ steps.own.outputs.cache-hit }}
          LAST_KEY: ${{ steps.last.outputs.cache-matched-key }}
          WINDOW: ${{ steps.window.outputs.window }}
          RETRY: ${{ steps.failed.outputs.retry }}
          RETRIED: ${{ steps.retried.outputs.cache-hit }}
          ROUND: ${{ steps.failed.outputs.round }}
        run: |
          set -euo pipefail
          sha_re='^[0-9a-f]{40}$'
          if [ "$ON" != 1 ]; then
            echo "not coalescing (the off switch): the checks run on this push's own range"
            printf 'run=true\nbase=\nsave=false\nsave_window=false\n' >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$OWN_HIT" = true ]; then
            base=$(head -c 64 .base-coalesce/record | tr -dc '0-9a-z')
            [[ "$base" =~ $sha_re ]] || base=unknown
            echo "a re-run of ${GITHUB_SHA:0:12}: the checks run again from ${base:0:12}, the range its first attempt covered"
            printf 'run=true\nbase=%s\nsave=false\nsave_window=false\n' "$base" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$CLAIMED" = true ] && [ "$DIRECT" = 1 ]; then
            base=${LAST_KEY##*-t-}
            [[ "$base" =~ $sha_re ]] || base=unknown
            [ "$base" != "$GITHUB_SHA" ] || base=unknown
            echo "a direct push (not a PR merge) inside a taken window: the checks run on ${GITHUB_SHA:0:12}, covering since ${base:0:12}"
            echo "### $KEY: direct push, runs on ${GITHUB_SHA:0:12}, covering since ${base}" >> "$GITHUB_STEP_SUMMARY"
            printf '%s\n' "$base" > .base-coalesce/record
            printf 'run=true\nbase=%s\nsave=true\nsave_window=false\n' "$base" >> "$GITHUB_OUTPUT"; exit 0
          fi
          round=0
          if [ "$CLAIMED" = true ] && [ -n "$RETRY" ] && [ "$RETRIED" != true ]; then
            echo "this window's run $RETRY failed: ${GITHUB_SHA:0:12} runs again instead of waiting for the next window"
            round=${ROUND:-1}
          elif [ "$CLAIMED" = true ]; then
            echo "this ${HOLD_MINUTES}-minute window's run has started on an earlier push: the next window's first push covers ${GITHUB_SHA:0:12}"
            echo "### $KEY: coalesced (a later push's run covers this one)" >> "$GITHUB_STEP_SUMMARY"
            printf 'run=false\nbase=\nsave=false\nsave_window=false\n' >> "$GITHUB_OUTPUT"; exit 0
          fi
          base=${LAST_KEY##*-t-}
          [[ "$base" =~ $sha_re ]] || base=unknown
          [ "$base" != "$GITHUB_SHA" ] || base=unknown  # a re-run whose own record was lost: its range is unknown
          echo "the first push of this window: the checks run on ${GITHUB_SHA:0:12}, covering every push since ${base:0:12}"
          echo "### $KEY: runs on ${GITHUB_SHA:0:12}, covering since ${base}" >> "$GITHUB_STEP_SUMMARY"
          # mkdir again: a pool runner's disk-floor prune can empty the workspace between steps (2026-11-25 20:11Z, job
          # 139480437957 on w2a-0015: "No such file or directory", and the window's retry built nothing).
          mkdir -p .base-coalesce && printf '%s\n' "$base" > .base-coalesce/record
          printf 'run=true\nbase=%s\nsave=true\nsave_window=true\nround=%s\n' "$base" "$round" >> "$GITHUB_OUTPUT"

      - name: Claim this window
        if: ${{ steps.decide.outputs.save_window == 'true' && github.run_attempt == '1' }}
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .base-coalesce/record
          key: base-coalesce-${{ inputs.key }}-w-${{ steps.window.outputs.window }}${{ steps.failed.outputs.retry != '' && format('-r-{0}', steps.failed.outputs.retry) || '' }}

      - name: Record this tip as tested
        if: ${{ steps.decide.outputs.save == 'true' && github.run_attempt == '1' }}
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .base-coalesce/record
          key: base-coalesce-${{ inputs.key }}-t-${{ github.sha }}

      # A persistent pool runner keeps its workspace: leave nothing behind for the next job's checkout.
      - name: Clean up
        if: ${{ always() }}
        run: rm -rf .base-coalesce

  # The caller's failure job (mark_failed): a run that claimed its window, or a retry of it, failed. Its marker lets
  # the next push of the window run again without the REST API (the header).
  mark:
    name: mark this window's run failed
    if: ${{ inputs.mark_failed && github.event_name == 'push' && github.ref == 'refs/heads/feat-cmux-next' }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || inputs.runner || 'cmux-linux' }}
    timeout-minutes: 5
    env:
      WINDOW: ${{ inputs.window }}
      ROUND: ${{ inputs.round }}
      HELD: ${{ inputs.held }}
      RETRIES: 3
    steps:
      - name: Name the marker
        id: name
        run: |
          set -euo pipefail
          [[ "$WINDOW" =~ ^[0-9]+$ && "$ROUND" =~ ^[0-9]+$ ]] || { echo "no window or round: nothing to mark"; exit 0; }
          mkdir -p .base-coalesce && printf '%s\n' "$GITHUB_RUN_ID" > .base-coalesce/record
          if [ "$HELD" = true ]; then
            echo "key=$WINDOW-held-$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"
            echo "run $GITHUB_RUN_ID (round $ROUND of window $WINDOW) failed after it delivered its output: the window holds"
            exit 0
          fi
          if [ "$ROUND" -ge "$RETRIES" ]; then
            echo "round $ROUND of window $WINDOW failed: past $RETRIES retries, the window holds"; exit 0
          fi
          echo "key=$WINDOW-$ROUND-$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "run $GITHUB_RUN_ID (round $ROUND of window $WINDOW) failed: the next push of the window runs again"

      - name: Save the failed marker
        if: ${{ steps.name.outputs.key != '' }}
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .base-coalesce/record
          key: base-coalesce-${{ inputs.key }}-f-${{ steps.name.outputs.key }}

      - name: Clean up
        if: ${{ always() }}
        run: rm -rf .base-coalesce
