name: Cloud Surge proof (development)

# The proof run of cmux-platform#1594's Cloud Surge ops on the DEVELOPMENT backend
# (https://cmux-api-development.debussy.workers.dev), hq docs/rfd/0025-cloud-surge.md "Proof before enabling".
# scripts/cmux-next/cloud-journey.ts --surge signs in as the dev agent test account (a person's session: create
# refuses agent and install tokens), previews {count 2, ttl_seconds 300}, creates it under one idempotency key,
# replays that key (must answer replayed with the same slots), sends the key with count 1 (must answer
# idempotency.conflict), and deletes every machine any receipt named, pass or fail. The step table is the summary.
#
# Leo, 2026-11-21: "we need to productionize it as well for cmux. the whole scaling shit up and whatnot. the surge."
#
# Secrets: CMUX_DOGFOOD_STACK_EMAIL/_PASSWORD in cmux-next-vm-image-dev, which admits feat-cmux-next only.
# Runs on feat-cmux-next only: a push there that changes .github/cloud-surge-proof/request (land a PR that edits it),
# or a manual dispatch once this file is on the default branch.

on:
  workflow_dispatch: {}
  push:
    branches: [feat-cmux-next]
    paths:
      - .github/cloud-surge-proof/request

permissions:
  contents: read

concurrency:
  group: cloud-surge-proof
  cancel-in-progress: false

env:
  # Temporary REST budget attribution: one gh-call line per GitHub API call (scripts/ci/api_call_log/env.sh, fetched at a fixed commit when the checkout has no copy).
  BASH_ENV: '$({ w="${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh"; t="${RUNNER_TEMP:-/nonexistent}/api-call-log-src"; if [ -f "$w" ]; then echo "$w"; elif [ -n "${RUNNER_TEMP:-}" ]; then if [ ! -f "$t/env.sh" ] && [ ! -e "$t.tried" ] && { [ "${RUNNER_OS:-}" = Linux ] || [ "${RUNNER_OS:-}" = macOS ]; } && [ "$(date -u +%Y%m%d%H)" -lt 2026112300 ]; then : > "$t.tried"; mkdir -p "$t.part" && for x in env.sh gh sitecustomize.py isolated.py; do curl -fsSL --max-time 5 -o "$t.part/$x" "https://raw.githubusercontent.com/manaflow-ai/cmux/0d5b239cfa47036c6f7d49b4933d124f87138eff/scripts/ci/api_call_log/$x" || break; done; [ -s "$t.part/isolated.py" ] && mv "$t.part" "$t"; fi; if [ -f "$t/env.sh" ]; then echo "$t/env.sh"; else echo unset BASH_ENV > "$t.off.sh" && echo "$t.off.sh"; fi; fi; } 2>/dev/null)'

jobs:
  proof:
    if: github.repository == 'manaflow-ai/cmux' && github.ref == 'refs/heads/feat-cmux-next'
    environment:
      name: cmux-next-vm-image-dev
      deployment: false
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && (vars.CI_FORK_LINUX_RUNNER || 'ubuntu-24.04') || 'cmux-linux' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/cmux-next/
            /tests/fixtures/model-stub/
            /Packages/macOS/CmuxNext/Sources/CmuxNextCloudCredentials/
            scripts/ci/toolchain-r2.sh
            scripts/ci/toolchain-archives.sha256
            scripts/ci/r2-cache.sh
            scripts/ci/lan_cache_fetch.py
            .gitmodules
      - name: Restore pinned Bun 1.4.4 from the CI cache bucket
        shell: bash
        continue-on-error: true
        run: bash "$GITHUB_WORKSPACE/scripts/ci/toolchain-r2.sh" restore bun 1.4.4 || true

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
          no-cache: ${{ !startsWith(github.workspace, '/home/runner/work/') || !(github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && github.event_name != 'merge_group' && contains(fromJSON('["refs/heads/main","refs/heads/feat-cmux-next","refs/heads/nightly-next"]'), github.ref)) }}
      - name: Surge preview, create, replay, conflict, cleanup on development
        env:
          CMUX_DOGFOOD_STACK_EMAIL: ${{ secrets.CMUX_DOGFOOD_STACK_EMAIL }}
          CMUX_DOGFOOD_STACK_PASSWORD: ${{ secrets.CMUX_DOGFOOD_STACK_PASSWORD }}
        run: bun scripts/cmux-next/cloud-journey.ts --backend dev --surge --out "$RUNNER_TEMP/surge-proof"
      - name: Summary
        if: always()
        run: cat "$RUNNER_TEMP/surge-proof/summary.md" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "no summary written" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: cloud-surge-proof-${{ github.run_id }}
          path: ${{ runner.temp }}/surge-proof/
          if-no-files-found: warn
          retention-days: 3
