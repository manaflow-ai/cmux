name: gallery feel

# The feel check (scripts/gallery-matrix/feel.ts): a simulated cursor hovers, clicks and drags every
# visible control of each gallery state a change touches, and grades what it feels like with numbers:
# dead clicks, slow responses (input to first visible change, over 200 ms), pop-in (content in a later
# wave, 100 ms or more after the first response), layout jumps after a click's first wave, and any
# layout shift on a hover. Leo, 2026-11-22: "these should be doable via automation. the "feel" and
# "vibes" thing. you can simulate cursors clicking around."
#
# A finding counts only when a second, fresh render of the state shows it again (the runner's noise
# is not the page's feel). scripts/gallery-matrix/feel-baseline.json lists the known findings with
# why; a new finding fails the check, and a listed one no longer seen is printed so its line can go.
# Every number is in the artifact's feel.json, findings or not, and the step summary prints the
# response p50/p95/max of the run.
#
# Linux, Chromium only: Long Animation Frames, layout-shift entries and the trusted mouse are
# Chromium's. A pull request crawls the states its change touches (touched.ts), at most MAX_STATES
# of them, picked by relevance; a push to feat-cmux-next does the same for what it touched; a
# dispatch crawls every state (the full read of the base).

on:
  pull_request:
    branches: [feat-cmux-next]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "webviews/src/**"
      - "!webviews/src/**/*.test.ts"
      - "!webviews/src/**/*.test.tsx"
      - "!webviews/src/**/*.md"
      - "scripts/gallery-matrix/feel.ts"
      - "scripts/gallery-matrix/feel-browser.test.ts"
      - "scripts/gallery-matrix/feel-baseline.json"
      - ".github/workflows/gallery-feel.yml"
  push:
    branches: [feat-cmux-next]
    paths:
      - "webviews/src/**"
      - "!webviews/src/**/*.test.ts"
      - "!webviews/src/**/*.test.tsx"
      - "!webviews/src/**/*.md"
      - "scripts/gallery-matrix/feel.ts"
      - "scripts/gallery-matrix/feel-browser.test.ts"
      - "scripts/gallery-matrix/feel-baseline.json"
      - ".github/workflows/gallery-feel.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gallery-feel-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  feel:
    name: feel
    if: ${{ vars.CI_QUOTA_HOLD != '1' && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-4vcpu-ubuntu-2404' || fromJSON(vars.RUNNER_POOLS).linux_8 }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: ${{ github.event_name == 'push' && '0' || '2' }}
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /webviews/
            /scripts/
            /.github/
            /config/vite-plus/
            /schemas/
            /design/icons/neko-candidates/
            /first-party-apps/*/preview/**
            /Resources/ghostty/themes/
            /Resources/cmux-themes/
            /Resources/markdown-viewer/
            /Packages/Shared/CmuxAgentQuestion/Sources/CmuxAgentQuestion/Fixtures/
            /Packages/macOS/CmuxNext/Sources/**/*.xcstrings
            /Packages/macOS/CmuxNext/Sources/CmuxNextDesign/Windows/WebTheme.swift
            /Packages/macOS/CmuxNext/Sources/CmuxNextDesign/Tunables/MetricTunables.swift
            /web/data/model-catalog/
            /release-notes/next/highlights/
            /examples/gallery/
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
          no-cache: ${{ !startsWith(github.workspace, '/home/runner/work/') }}

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.22.1"

      - name: Cache Playwright's apt packages
        continue-on-error: true
        uses: ./.github/actions/playwright-apt-cache
        with:
          engines: chromium

      - name: Choose the states to crawl
        id: entries
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          MAX_ENTRIES: "12"
        run: |
          set -euo pipefail
          cd webviews
          bun install --frozen-lockfile
          if [ "$EVENT" = pull_request ]; then
            git diff --name-only HEAD^1 HEAD > "$RUNNER_TEMP/changed.txt"
          elif [ "$EVENT" = push ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            git diff --name-only "$BEFORE" HEAD > "$RUNNER_TEMP/changed.txt"
          else
            echo .github/workflows/gallery-feel.yml > "$RUNNER_TEMP/changed.txt"
          fi
          bun scripts/gallery/touched.ts --changed "$RUNNER_TEMP/changed.txt" --out "$RUNNER_TEMP/touched.json"
          # The checker itself changed, or a dispatch: every state.
          if [ "$EVENT" = workflow_dispatch ] || grep -q '^scripts/gallery-matrix/feel\|^\.github/workflows/gallery-feel\.yml$' "$RUNNER_TEMP/changed.txt"; then
            all=true
          else
            all=$(jq -r .all "$RUNNER_TEMP/touched.json")
          fi
          # Most relevant first (touched.ts `ranked`): the changed component's own entries lead; at most
          # MAX_ENTRIES of them, so a shared stylesheet does not crawl the whole gallery on a pull request.
          ids=$(jq -r --argjson n "$MAX_ENTRIES" '[(.ranked // [])[].id] + (.entries // [])
            | reduce .[] as $id ([]; if index([$id]) then . else . + [$id] end) | .[:$n] | join(",")' "$RUNNER_TEMP/touched.json")
          echo "all=$all" >> "$GITHUB_OUTPUT"
          echo "ids=$ids" >> "$GITHUB_OUTPUT"
          echo "all=$all; touched entries: ${ids:-none}"

      - name: Crawl with a simulated cursor
        if: ${{ steps.entries.outputs.all == 'true' || steps.entries.outputs.ids != '' }}
        timeout-minutes: 20
        env:
          ALL: ${{ steps.entries.outputs.all }}
          IDS: ${{ steps.entries.outputs.ids }}
          EVENT: ${{ github.event_name }}
          # A pull request or push reads at most this many states (about 4 s each with its re-check);
          # a dispatch reads all of them.
          MAX_STATES: "60"
          CMUX_GALLERY_IN_VM: "1"
        run: |
          set -euo pipefail
          (cd scripts/gallery-matrix && bun install --frozen-lockfile && "$(git rev-parse --show-toplevel)/scripts/ci/ensure-system-chrome.sh")
          cd webviews
          max=$MAX_STATES
          if [ "$ALL" = true ]; then
            bun scripts/gallery/manifest.ts --frame component --out "$RUNNER_TEMP/manifest.json"
            [ "$EVENT" = workflow_dispatch ] && max=0
            CMUX_STRINGS_BEST_EFFORT=1 CMUX_GALLERY_OUT_DIR="$RUNNER_TEMP/gallery" bun run gallery:build
          else
            bun scripts/gallery/manifest.ts --frame component --entries "$IDS" --out "$RUNNER_TEMP/manifest.json"
            CMUX_STRINGS_BEST_EFFORT=1 CMUX_GALLERY_ENTRIES="$IDS" CMUX_GALLERY_OUT_DIR="$RUNNER_TEMP/gallery" bun run gallery:build
          fi
          cd "$GITHUB_WORKSPACE/scripts/gallery-matrix"
          bun feel.ts --manifest "$RUNNER_TEMP/manifest.json" --gallery-dir "$RUNNER_TEMP/gallery" \
            --output-dir "$RUNNER_TEMP/feel" --max-states "$max" --concurrency "$(nproc)"

      - name: Upload the feel report
        if: ${{ !cancelled() && (steps.entries.outputs.all == 'true' || steps.entries.outputs.ids != '') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gallery-feel-${{ github.event.pull_request.number || 0 }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/feel
          retention-days: 7
          if-no-files-found: ignore
