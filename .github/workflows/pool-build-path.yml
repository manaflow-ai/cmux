name: pool build path

# The Linux pool builds every cmux-next dev app from feat-cmux-next, and among its first steps it compiles
# the app's C ABI workspace (cmux-tui/crates/cmux-app-ffi and the FFI crates that name it in
# `package.workspace`). A pull request into feat-cmux-next does not compile that workspace before it merges:
# rust-workspaces.yml plans it there with --reads-only (Tier A, scripts/ci/affected-jobs.json), which plans a
# workspace only for a file it reads from outside its tree, not for a change to its own crates. #60470 changed
# cmux-layout-reducer-ffi's build.rs, merged with no compile, and every pool image refresh after it failed
# (E0583, fixed forward by #60839).
#
# This is that compile and nothing more: `cargo check --locked --workspace --all-targets` of the workspace,
# only when the change reaches it (rust-workspaces.py plan --own-only: its own paths or a path dependency's).
# A change that does not reach it pays the plan, a few seconds. Warnings never fail it.

on:
  pull_request:
    branches:
      - feat-cmux-next
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "cmux-tui/crates/**"
      - "cmux-tui/rust-toolchain.toml"
      - ".cargo/config.toml"
      - ".github/rust-workspaces.toml"
      - ".github/scripts/rust-workspaces.py"
      - ".github/workflows/pool-build-path.yml"
  workflow_dispatch:

concurrency:
  group: pool-build-path-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app-ffi:
    name: app FFI workspace compiles
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft != true }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || vars.CI_OVERFLOW_LINUX || 'cmux-linux' }}
    timeout-minutes: 30
    env:
      ROOT: cmux-tui/crates/cmux-app-ffi
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Does this change reach the app FFI workspace?
        id: reach
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != pull_request ]]; then echo "hit=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          base=$(git cat-file -p HEAD | awk '/^parent /{print $2; exit}')
          jobs=$(python3 .github/scripts/rust-workspaces.py plan --base "$base" --own-only)
          if python3 -c 'import json, os, sys; sys.exit(0 if any(j["root"] == os.environ["ROOT"] for j in json.loads(sys.argv[1])) else 1)' "$jobs"; then
            echo "hit=true" >> "$GITHUB_OUTPUT"
            echo "the change reaches $ROOT: compiling it"
          else
            echo "the change does not reach $ROOT: nothing to compile"
          fi

      - name: Install Linux build dependencies
        if: ${{ steps.reach.outputs.hit == 'true' }}
        run: |
          if dpkg -s clang libclang-dev pkg-config >/dev/null 2>&1; then
            echo "clang libclang-dev pkg-config: already installed"
          else
            sudo apt-get update
            sudo apt-get install -y clang libclang-dev pkg-config
          fi

      - name: Set up pinned Rust
        if: ${{ steps.reach.outputs.hit == 'true' }}
        uses: ./.github/actions/setup-cmux-tui-rust

      - name: Install the workspace's own toolchain pin
        if: ${{ steps.reach.outputs.hit == 'true' }}
        working-directory: ${{ env.ROOT }}
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup toolchain install
          cargo --version

      # rust-workspaces.yml's cache for this root (it saves on feat-cmux-next pushes); restore only.
      - name: Cache cargo build
        if: ${{ steps.reach.outputs.hit == 'true' }}
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          add-rust-environment-hash-key: false
          cache-bin: false
          workspaces: ${{ env.ROOT }} -> target
          key: ${{ env.ROOT }}-${{ hashFiles('cmux-tui/rust-toolchain.toml', 'cmux-tui/crates/cmux-app-ffi/Cargo.lock', 'cmux-tui/crates/cmux-app-ffi/rust-toolchain.toml', '.cargo/config.toml') }}
          save-if: false

      - name: cargo check --workspace --all-targets
        if: ${{ steps.reach.outputs.hit == 'true' }}
        working-directory: ${{ env.ROOT }}
        run: PATH="$HOME/.cargo/bin:$PATH" cargo check --locked --workspace --all-targets
