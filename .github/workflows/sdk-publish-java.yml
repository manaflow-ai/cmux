name: sdk publish java

on:
  workflow_dispatch:
    inputs:
      version:
        description: "SDK version to validate, for example 0.1.0"
        required: true
        type: string

permissions: {}

concurrency:
  group: sdk-publish-java-${{ github.ref }}
  cancel-in-progress: false

env:
  # Temporary REST budget attribution: one gh-call line per GitHub API call (scripts/ci/api_call_log/env.sh, fetched at a fixed commit when the checkout has no copy).
  BASH_ENV: '$({ w="${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh"; t="${RUNNER_TEMP:-/nonexistent}/api-call-log-src"; if [ -f "$w" ]; then echo "$w"; elif [ -n "${RUNNER_TEMP:-}" ]; then if [ ! -f "$t/env.sh" ] && [ ! -e "$t.tried" ] && { [ "${RUNNER_OS:-}" = Linux ] || [ "${RUNNER_OS:-}" = macOS ]; } && [ "$(date -u +%Y%m%d%H)" -lt 2026112300 ]; then : > "$t.tried"; mkdir -p "$t.part" && for x in env.sh gh sitecustomize.py isolated.py; do curl -fsSL --max-time 5 -o "$t.part/$x" "https://raw.githubusercontent.com/manaflow-ai/cmux/27647ffd3ae838c63be28ca3e5883dcd68c34518/scripts/ci/api_call_log/$x" || break; done; [ -s "$t.part/isolated.py" ] && mv "$t.part" "$t"; fi; if [ -f "$t/env.sh" ]; then echo "$t/env.sh"; else echo unset BASH_ENV > "$t.off.sh" && echo "$t.off.sh"; fi; fi; } 2>/dev/null)'
  # libghostty-vt always builds from the ghostty-next gitlink: an empty
  # value overrides any runner-level CMUX_GHOSTTY_SRC (build.rs treats it
  # as unset).
  CMUX_GHOSTTY_SRC: ""

jobs:
  version:
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || vars.CI_OVERFLOW_LINUX || 'cmux-linux' }}
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Validate tag and package versions
        id: version
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="$DISPATCH_VERSION"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "workflow_dispatch version must match X.Y.Z" >&2
            exit 1
          }
          python3 - "$version" <<'PY'
          import json
          import pathlib
          import sys
          import tomllib

          expected = sys.argv[1]
          root = pathlib.Path.cwd()
          versions = {
              "typescript package.json": json.loads((root / "cmux-tui/bindings/typescript/package.json").read_text())["version"],
              "python pyproject.toml": tomllib.loads((root / "cmux-tui/bindings/python/pyproject.toml").read_text())["project"]["version"],
              "rust Cargo.toml": tomllib.loads((root / "cmux-tui/bindings/rust/Cargo.toml").read_text())["package"]["version"],
          }
          mismatches = {name: got for name, got in versions.items() if got != expected}
          if mismatches:
              for name, got in mismatches.items():
                  print(f"{name}: expected {expected}, got {got}", file=sys.stderr)
              raise SystemExit(1)
          print(f"All package versions match {expected}")
          PY
          python3 cmux-tui/bindings/check-versions.py --expected "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  bindings-e2e-java:
    env:
      GHOSTTY_ZIG_SOURCE: ghostty-next
    needs: version
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || vars.CI_OVERFLOW_LINUX || 'cmux-linux' }}
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Init ghostty submodule
        shell: bash
        run: |
          bash scripts/ci/init-submodule.sh ghostty
          bash scripts/ci/init-submodule.sh ghostty-next

      - name: Install Linux build dependencies
        run: |
          # Skip apt when the runner image already has these (tests/test_ci_apt_skips_baked_packages.py).
          if dpkg -s clang libclang-dev pkg-config >/dev/null 2>&1; then
            echo "clang libclang-dev pkg-config: already installed"
          else
            sudo apt-get update
            sudo apt-get install -y clang libclang-dev pkg-config
          fi

      - name: Install zig
        run: ./scripts/install-zig-ci.sh

      - name: Rust version
        run: |
          rustc --version || true
          if ! command -v cargo >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi

      # The reused fleet image (LINUX_RUNNER) has no hosted toolcache JDK
      # (JAVA_HOME_17_X64 unset); setup-java provisions Temurin 17 on any runner.
      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Java version
        run: |
          java -version
          javac -version

      - name: Build cmux-tui server
        working-directory: cmux-tui
        run: cargo build -p cmux-tui --bin cmux-tui --locked

      - name: Java SDK conformance
        run: |
          report="$RUNNER_TEMP/cmux-sdk-conformance-java.txt"
          python3 cmux-tui/bindings/conformance/runner.py \
            --language java \
            --require java \
            --cmux-tui-bin "$GITHUB_WORKSPACE/cmux-tui/target/debug/cmux-tui" |
            tee "$report"
          grep -Eq '^PASS +java +live-creation-exit-restart-unix$' "$report"

  maven-central-todo:
    needs: bindings-e2e-java
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || vars.CI_OVERFLOW_LINUX || 'cmux-linux' }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Maven Central publish not implemented
        run: |
          echo "Java publishing is intentionally not automated yet."
          echo "TODO: add Maven Central publishing after com.cmux namespace verification, project metadata, and signing/provenance setup are complete."
