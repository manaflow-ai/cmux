name: coderouter publish npm

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable X.Y.Z CodeRouter release version
        required: true
        type: string

permissions: {}

concurrency:
  group: coderouter-publish-npm-${{ inputs.version }}
  cancel-in-progress: false

env:
  # Temporary REST budget attribution: one gh-call line per GitHub API call (scripts/ci/api_call_log/env.sh, fetched at a fixed commit when the checkout has no copy).
  BASH_ENV: '$({ w="${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh"; t="${RUNNER_TEMP:-/nonexistent}/api-call-log-src"; if [ -f "$w" ]; then echo "$w"; elif [ -n "${RUNNER_TEMP:-}" ]; then if [ ! -f "$t/env.sh" ] && [ ! -e "$t.tried" ] && { [ "${RUNNER_OS:-}" = Linux ] || [ "${RUNNER_OS:-}" = macOS ]; } && [ "$(date -u +%Y%m%d%H)" -lt 2026112300 ]; then : > "$t.tried"; mkdir -p "$t.part" && for x in env.sh gh sitecustomize.py isolated.py; do curl -fsSL --max-time 5 -o "$t.part/$x" "https://raw.githubusercontent.com/manaflow-ai/cmux/27647ffd3ae838c63be28ca3e5883dcd68c34518/scripts/ci/api_call_log/$x" || break; done; [ -s "$t.part/isolated.py" ] && mv "$t.part" "$t"; fi; if [ -f "$t/env.sh" ]; then echo "$t/env.sh"; else echo unset BASH_ENV > "$t.off.sh" && echo "$t.off.sh"; fi; fi; } 2>/dev/null)'

jobs:
  publish:
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-latest' || fromJSON(vars.RUNNER_POOLS).provenance }} # github-hosted-required: npm provenance needs a GitHub-hosted runner
    timeout-minutes: 30
    environment:
      name: npm-coderouter
      url: https://www.npmjs.com/package/coderouter
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22.23.4"
          registry-url: https://registry.npmjs.org
      - name: Download verified npm package
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          mkdir dist
          gh release download "coderouter-v$VERSION" \
            --pattern coderouter-npm-launcher.tgz \
            --pattern SHA256SUMS \
            --dir dist
          (
            cd dist
            grep 'coderouter-npm-launcher.tgz$' SHA256SUMS \
              | sha256sum --check
          )
          package_json="$(tar -xOf \
            dist/coderouter-npm-launcher.tgz \
            package/package.json)"
          [[ "$(jq -r .version <<<"$package_json")" == "$VERSION" ]]
          [[ "$(jq -r .license <<<"$package_json")" == "GPL-3.0-or-later" ]]
      - run: npm install -g npm@11.5.1
      - name: Publish through npm trusted publishing
        run: npm publish --provenance ./dist/coderouter-npm-launcher.tgz
