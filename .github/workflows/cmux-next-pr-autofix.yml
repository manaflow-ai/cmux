name: cmux-next PR autofix

# Runs the base autofix's mechanical repairs (scripts/cmux-next/base-autofix.sh)
# on the immutable merge tree for a feat-cmux-next pull request, so a pull request lands with its
# generated files, formatting and pins already right instead of leaving them
# to the base bot after the merge (cmux-next-base-autofix.yml stays the
# backstop for merges that cross). Repairs that need a person stay with the
# pull request.
#
# The action exports (plans/cmux-next/action-surfaces.json, actions.md,
# links.json) and the settings exports (schemas/settings/settings-schema.json,
# docs/mdm) need a Mac swift test: when the pull request
# changes their inputs (autofix-areas.sh: actions, settings), action-exports
# regenerates them on a Mac (scripts/cmux-next/regenerate-action-exports.sh,
# regenerate-settings-exports.sh) and repair copies them in before it rewrites
# the defaults snapshot from them, and the docs shortcuts and app-host files
# from regenerated action exports (never from a settings-only artifact). Rust
# and the docs read the committed copy, so they stay checked in, but no person
# regenerates them.
#
# Two jobs hold the token boundary, so the pull request's own code never runs next to a write token:
#   repair: runs the repairs the pull request's changed paths need
#     (scripts/cmux-next/autofix-areas.sh), plus cargo clippy --fix
#     (machine-applicable lints only) on the cmux-tui crates it changes
#     (scripts/cmux-next/autofix-clippy.sh), with a read-only token, and uploads
#     the result as a patch (artifact pr-autofix-patch, also the fix for a fork
#     pull request: its summary says how to apply it).
#   push: same-repo pull requests only. Mints a token from the PR autofix App
#     (CMUX_PR_AUTOFIX_APP_ID/KEY: contents write only; an App token's push
#     starts the pull request's checks again, GITHUB_TOKEN's does not). The
#     FFI release App is not usable here: its credentials live in the
#     ffi-release environment, for feat-cmux-next only
#     (tests/test_ci_signing_secrets_need_release_environment.py). Until the
#     App's secrets exist the job leaves the repairs in the artifact. It
#     applies the patch with the base branch tip's scripts/cmux-next/pr-autofix-apply.sh
#     (only repair outputs; never a workflow, manifest or lockfile) and pushes
#     one commit to the pull request's branch.
# No loop: a head that is already an autofix commit (its Autofix-Run trailer)
# is not repaired again, and a repaired head has nothing left to repair.
# Each job checks out github.sha, the merge commit created for this event. The
# base SHA in the event payload is the matching immutable first parent; neither
# is replaced by a moving branch tip during the run.
on:
  pull_request:
    branches: [feat-cmux-next]

permissions: {}

concurrency:
  group: cmux-next-pr-autofix-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Whether the Mac action-exports job runs: decided on Linux, so a pull
  # request that changes neither the catalog nor the settings never takes a Mac.
  action-areas:
    name: action export areas
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.CI_CLOUD_OVERFLOW_SAVED && 'blacksmith-8vcpu-ubuntu-2404' || 'blacksmith-2vcpu-ubuntu-2404' }}
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      actions: ${{ steps.areas.outputs.actions }}
      settings: ${{ steps.areas.outputs.settings }}
      changed: ${{ steps.changed.outputs.changed }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          # The freshness guard needs the true merge base, not a depth-1 head:
          # the whole commit graph, but no historical blobs (a full clone took
          # about 280 s here and ran into this job's 5-minute timeout).
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      # The pull request's changed paths from the commit graph this job already
      # fetched, instead of the files API (a call per 100 files, on every push):
      # the same comparison (the merge base to the head), every rename as both
      # of its paths (--no-renames lists the old path removed and the new one
      # added, as `.filename, .previous_filename` does), and no 3000-file cap.
      # A git failure leaves `listed` unset, and the next step reads the API.
      - name: Changed paths
        id: changed
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git diff --no-renames --name-only -z "$BASE_SHA...$HEAD_SHA" | tr '\0' '\n' > "$RUNNER_TEMP/changed.txt"
          echo "listed=true" >> "$GITHUB_OUTPUT"
          # generated-drift reads the list from here (gzip, base64), so it needs
          # no files API call and no commit graph of its own. Past 96 KB
          # (an environment variable holds 128 KB) it reads the API.
          encoded="$(gzip -9n < "$RUNNER_TEMP/changed.txt" | base64 -w0)"
          if [ "${#encoded}" -le 98304 ]; then
            echo "changed=$encoded" >> "$GITHUB_OUTPUT"
          fi

      - name: Autofix scripts from the base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/autofix"
          git archive "$BASE_SHA" scripts/cmux-next | tar -x -C "$RUNNER_TEMP/autofix"

      - name: Refuse stale generator inputs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          checker="$RUNNER_TEMP/autofix/scripts/cmux-next/check-generator-inputs.sh"
          [[ -x "$checker" ]] || checker="$GITHUB_WORKSPACE/scripts/cmux-next/check-generator-inputs.sh"
          "$checker" --base-ref "$BASE_SHA" --merge-ref HEAD

      # The same paths as repair's Changed areas step (the files API, an
      # autofix head repairs nothing); only the actions and settings keys are used.
      - name: Changed areas
        id: areas
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
          LISTED: ${{ steps.changed.outputs.listed }}
        run: |
          set -euo pipefail
          # The base's copy, or the pull request's while the base has no actions area yet.
          areas="$RUNNER_TEMP/autofix/scripts/cmux-next/autofix-areas.sh"
          grep -q '^area actions ' "$areas" || areas=scripts/cmux-next/autofix-areas.sh
          if git log -1 --format=%B "${{ github.event.pull_request.head.sha }}" | grep -q '^Autofix-Run: ' || ! grep -q '^area actions ' "$areas"; then
            printf 'actions=false\nsettings=false\n' | tee -a "$GITHUB_OUTPUT"
          elif [ "$CHANGED_FILES" -ge 3000 ]; then
            "$areas" --all | grep -E '^(actions|settings)=' | tee -a "$GITHUB_OUTPUT"
          else
            if [ "$LISTED" != true ]; then
              gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files?per_page=100" \
                --jq '.[] | .filename, (.previous_filename // empty)' > "$RUNNER_TEMP/changed.txt"
            fi
            "$areas" < "$RUNNER_TEMP/changed.txt" | grep -E '^(actions|settings)=' | tee -a "$GITHUB_OUTPUT"
          fi

  # Regenerates the action and settings exports on a Mac with a read-only token
  # and hands them to repair as the action-exports artifact (files at their
  # repository paths). A pull request whose catalog or settings do not build
  # gets none of those exports; its other repairs still run, but push holds
  # them back (an Autofix-Run head would skip the exports on every later run).
  action-exports:
    name: action exports (Mac)
    needs: action-areas
    if: needs.action-areas.outputs.actions == 'true' || needs.action-areas.outputs.settings == 'true'
    # The exports need a logged-in session, not the console gui token, so once the
    # fleet carries glaeda#1530's session label (vars.CI_SESSION_LABEL is 1) this
    # takes it and runs beside a console GUI job; until then the gui label.
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-6vcpu-macos-26' || vars.CI_PR_POOL_OWNED == '1' && (github.run_attempt == 1 || !contains(fromJSON('["github-actions[bot]","cmux-bot[bot]"]'), github.triggering_actor)) && (vars.CI_SESSION_LABEL == '1' && 'glaeda-session-std-xcode-26.6' || 'glaeda-gui-std-xcode-26.6') || vars.CI_PR_POOL_OWNED == '1' && 'blacksmith-6vcpu-macos-26' || vars.MACOS_RUNNER_26 || 'blacksmith-6vcpu-macos-26' }}
    timeout-minutes: 40
    permissions:
      contents: read
    outputs:
      # Changed exports are available and verified only after upload succeeds.
      # A verified no-op needs no artifact; a failed upload withholds changed exports.
      exports: ${{ steps.upload-exports.outcome == 'success' }}
      verified: ${{ steps.require-exports.outcome == 'success' && steps.regenerate.outcome == 'success' && (steps.require-exports.outputs.exports != 'true' || steps.upload-exports.outcome == 'success') }}
      settings-verified: ${{ steps.require-exports.outcome == 'success' && steps.settings.outcome == 'success' && (steps.require-exports.outputs.exports != 'true' || steps.upload-exports.outcome == 'success') }}
    env:
      CMUX_CI_XCODE_APP: ${{ vars.CMUX_CI_XCODE_APP_MACOS_26 }}
      CMUX_CI_REQUIRED_MACOS_SDK_MAJOR: "26"
    steps:
      # This job's tests can start acpmux daemons: they get a home of the job's
      # own, never the runner's ~/.acpmux, the mini's own daemon
      # (tests/test_ci_acpmux_job_home.py).
      - name: Give this job its own acpmux home
        run: |
          home="$RUNNER_TEMP/acpmux-home"
          rm -rf "$home" && mkdir -m 700 "$home"
          echo "ACPMUX_HOME=$RUNNER_TEMP/acpmux-home" >> "$GITHUB_ENV"
          # An inherited socket would still name another home's daemon; empty is unset.
          echo "ACPMUX_SOCKET=" >> "$GITHUB_ENV"

      - name: Clear stale git locks (self-hosted reused workspace)
        shell: bash
        run: rm -f "${GITHUB_WORKSPACE:-$PWD}/.git/index.lock" 2>/dev/null || true

      # The generator check needs the merge base, not historical blobs: with every
      # blob this fetch put 5.3 GiB of all-branch history into the mini's reused
      # workspace, which every later job on that runner kept (cmux14, 2026-10-21).
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          filter: blob:none # the commit graph without historical blobs, as action-areas
          persist-credentials: false
          submodules: false

      - name: Drop stale submodule checkouts (self-hosted reused workspace)
        run: scripts/ci/reset-stale-submodules.sh

      - name: Autofix scripts from the base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/autofix"
          git archive "$BASE_SHA" scripts/cmux-next | tar -x -C "$RUNNER_TEMP/autofix"

      - name: Refuse stale generator inputs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          checker="$RUNNER_TEMP/autofix/scripts/cmux-next/check-generator-inputs.sh"
          [[ -x "$checker" ]] || checker="$GITHUB_WORKSPACE/scripts/cmux-next/check-generator-inputs.sh"
          "$checker" --base-ref "$BASE_SHA" --merge-ref HEAD

      - name: Select Xcode
        run: ./scripts/select-ci-xcode.sh

      - name: Set up pinned cmux-tui Rust (sidebar layout reducer)
        uses: ./.github/actions/setup-cmux-tui-rust

      # The package's resources include the web bundles (cmux-next.yml's
      # generated-files job builds them the same way).
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"

      - name: Give this job its own bun
        run: scripts/cmux-next/private-bun.sh

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.22.1"

      - name: Source key of the web bundles
        id: web-bundle-key
        run: echo "key=$(python3 scripts/cmux-next/web-bundle-key.py . --source)" >> "$GITHUB_OUTPUT"

      - name: Restore the web bundles built for this source key
        id: web-bundle-cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: web-bundles-out
          key: cmux-next-web-bundles-v1-${{ steps.web-bundle-key.outputs.key }}

      - name: Install the restored web bundles
        if: steps.web-bundle-cache.outputs.cache-hit == 'true'
        run: scripts/cmux-next/build-web-bundles.sh --from web-bundles-out

      # These bundles only host the export tests and are never shipped or cached, so a missing
      # translation is a warning here: a stale settings schema must not stop the job that
      # regenerates it (the deadlock after #22577).
      - name: Build the web bundles
        env:
          CMUX_STRINGS_BEST_EFFORT: "1"
        run: scripts/cmux-next/build-web-bundles.sh

      # A catalog that does not build is the pull request's own red elsewhere;
      # this job then hands over nothing and the other repairs still run.
      - name: Regenerate the action exports
        id: regenerate
        if: needs.action-areas.outputs.actions == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          # The base's copy, or the pull request's before the base has one.
          regenerate="$RUNNER_TEMP/autofix/scripts/cmux-next/regenerate-action-exports.sh"
          [[ -x "$regenerate" ]] || regenerate=scripts/cmux-next/regenerate-action-exports.sh
          "$regenerate" "$RUNNER_TEMP/action-exports" 2>&1 | tee "$RUNNER_TEMP/action-exports.txt"
          if grep -q '^regenerated: ' "$RUNNER_TEMP/action-exports.txt"; then
            echo "exports=true" >> "$GITHUB_OUTPUT"
          fi

      # The settings exports, as cmux-next-base-autofix.yml regenerates them after
      # a merge. The script copies each export before its final freshness check
      # (each export rewritten by this run), so it writes into a folder of its own, and the files
      # join the action-exports artifact only when the whole regeneration
      # succeeded: a failed one hands repair nothing half-made.
      - name: Regenerate the settings exports
        id: settings
        if: needs.action-areas.outputs.settings == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          # The base's copy, or the pull request's before the base has one.
          regenerate="$RUNNER_TEMP/autofix/scripts/cmux-next/regenerate-settings-exports.sh"
          [[ -x "$regenerate" ]] || regenerate=scripts/cmux-next/regenerate-settings-exports.sh
          "$regenerate" "$RUNNER_TEMP/settings-exports" 2>&1 | tee "$RUNNER_TEMP/settings-exports.txt"
          if grep -q '^regenerated: ' "$RUNNER_TEMP/settings-exports.txt"; then
            mkdir -p "$RUNNER_TEMP/action-exports"
            cp -R "$RUNNER_TEMP/settings-exports/." "$RUNNER_TEMP/action-exports/"
            echo "exports=true" >> "$GITHUB_OUTPUT"
          fi

      # Also after a failure or a cancel: end the daemon of this job's home and
      # its agents (shutdown never starts one), then delete the home.
      - name: Stop this job's acpmux daemons and remove its home
        if: ${{ always() }}
        continue-on-error: true
        timeout-minutes: 3
        run: |
          home="$RUNNER_TEMP/acpmux-home"
          [[ -d "$home" ]] || exit 0
          acpmux="$(PATH="$PATH:$HOME/.local/bin:$HOME/.cargo/bin:/opt/homebrew/bin:/usr/local/bin" command -v acpmux || true)"
          [[ -z "$acpmux" ]] || env -u ACPMUX_SOCKET ACPMUX_HOME="$home" "$acpmux" daemon shutdown --end-agents || true
          rm -rf "$home"

      # A generator can report its exact missing input and continue-on-error can otherwise
      # let this job pass. A successful exporter copies only changed files; a verified
      # no-op needs no artifact. Promised changed files must exist before repair uses them.
      # The source stamp is intentionally derived and ignored, so an old exporter that still
      # requires the retired stamp names an input that must not enter this artifact.
      - name: Require generated exports
        id: require-exports
        if: always()
        env:
          ACTIONS_REQUESTED: ${{ needs.action-areas.outputs.actions }}
          SETTINGS_REQUESTED: ${{ needs.action-areas.outputs.settings }}
          ACTIONS_EXPORTS: ${{ steps.regenerate.outputs.exports }}
          SETTINGS_EXPORTS: ${{ steps.settings.outputs.exports }}
          ACTIONS_OUTCOME: ${{ steps.regenerate.outcome }}
          SETTINGS_OUTCOME: ${{ steps.settings.outcome }}
        run: |
          set -euo pipefail
          failed=0
          if [[ "$ACTIONS_REQUESTED" == true && "$ACTIONS_OUTCOME" != success ]]; then
            echo "::error::action exporter did not complete successfully (outcome: $ACTIONS_OUTCOME)"
            if [[ -f "$RUNNER_TEMP/action-exports.txt" ]]; then
              grep -E '::error::' "$RUNNER_TEMP/action-exports.txt" || true
            fi
            failed=1
          fi
          if [[ "$SETTINGS_REQUESTED" == true && "$SETTINGS_OUTCOME" != success ]]; then
            echo "::error::settings exporter did not complete successfully (outcome: $SETTINGS_OUTCOME); required input/output mismatch follows"
            if [[ -f "$RUNNER_TEMP/settings-exports.txt" ]]; then
              grep -E '::error::' "$RUNNER_TEMP/settings-exports.txt" || true
            fi
            failed=1
          fi
          if [[ "$failed" != 0 ]]; then exit 1; fi
          if [[ "$ACTIONS_EXPORTS" != true && "$SETTINGS_EXPORTS" != true ]]; then
            echo "::notice::Requested exports verified fresh; no changed files to upload"
            echo "exports=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ ! -d "$RUNNER_TEMP/action-exports" ]] || ! find "$RUNNER_TEMP/action-exports" -type f -print -quit | grep -q .; then
            echo "::error::exporter reported changed files but uploaded no files"
            exit 1
          fi
          echo "exports=true" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: upload-exports
        if: steps.require-exports.outcome == 'success' && steps.require-exports.outputs.exports == 'true'
        with:
          name: action-exports
          path: ${{ runner.temp }}/action-exports
          if-no-files-found: error
          retention-days: 1

      # The next job on this runner starts from the git seed at its own depth, not from
      # this job's all-branch partial clone (a later job's missing blob would be fetched
      # mid-step, unretried).
      - name: Discard the workspace repository (self-hosted reused workspace)
        if: always()
        run: rm -rf "$GITHUB_WORKSPACE/.git"

  repair:
    name: autofix repairs
    # The action exports come first: the docs shortcuts are rewritten from them.
    # The other repairs still run when the Mac job fails or is skipped.
    needs: [action-areas, action-exports]
    if: ${{ !cancelled() }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.CI_CLOUD_OVERFLOW_SAVED && 'blacksmith-16vcpu-ubuntu-2404' || 'blacksmith-4vcpu-ubuntu-2404' }}
    # clippy compiles the changed crates (cached below).
    timeout-minutes: 40
    permissions:
      contents: read
      pull-requests: read
    outputs:
      patch: ${{ steps.patch.outputs.patch }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          filter: blob:none # the commit graph without historical blobs, as action-areas
          persist-credentials: false

      # The pull request's changed paths from the commit graph this job already
      # fetched, instead of the files API (a call per 100 files, on every push):
      # the same comparison (the merge base to the head), every rename as both
      # of its paths (--no-renames lists the old path removed and the new one
      # added, as `.filename, .previous_filename` does), and no 3000-file cap.
      # A git failure leaves `listed` unset, and the next step reads the API.
      - name: Changed paths
        id: changed
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git diff --no-renames --name-only -z "$BASE_SHA...$HEAD_SHA" | tr '\0' '\n' > "$RUNNER_TEMP/changed.txt"
          echo "listed=true" >> "$GITHUB_OUTPUT"

      # The autofix's own scripts come from the immutable base snapshot, and
      # all generators run on the immutable merge tree for this event.
      - name: Autofix scripts from the base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/autofix"
          git archive "$BASE_SHA" scripts/cmux-next scripts/ci | tar -x -C "$RUNNER_TEMP/autofix"
          echo "AUTOFIX=$RUNNER_TEMP/autofix/scripts/cmux-next" >> "$GITHUB_ENV"

      - name: Refuse stale generator inputs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          checker="$AUTOFIX/check-generator-inputs.sh"
          [[ -x "$checker" ]] || checker="$GITHUB_WORKSPACE/scripts/cmux-next/check-generator-inputs.sh"
          "$checker" --base-ref "$BASE_SHA" --merge-ref HEAD

      - name: Changed areas
        id: areas
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
          LISTED: ${{ steps.changed.outputs.listed }}
        run: |
          set -euo pipefail
          if git log -1 --format=%B "${{ github.event.pull_request.head.sha }}" | grep -q '^Autofix-Run: '; then
            echo "The head is an autofix commit; nothing to repair." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          # A pull request of 3000 files or more runs every area (the files
          # API, the fallback, stops at 3000 without an error). Otherwise the
          # Changed paths step listed them from git; without it, the files API,
          # not `gh pr diff`: GitHub refuses the diff of a PR over 300 files
          # (HTTP 406). A rename lists both paths.
          if [ "$CHANGED_FILES" -ge 3000 ]; then
            "$AUTOFIX/autofix-areas.sh" --all | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$LISTED" != true ]; then
            gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files?per_page=100" \
              --jq '.[] | .filename, (.previous_filename // empty)' > "$RUNNER_TEMP/changed.txt"
          fi
          "$AUTOFIX/autofix-areas.sh" < "$RUNNER_TEMP/changed.txt" | tee -a "$GITHUB_OUTPUT"

      # dump-package needs the Swift 6.2 tools (ci-target-graph.py); see
      # cmux-next-base-autofix.yml.
      - name: Dump the CmuxNext package manifest
        if: steps.areas.outputs.graph == 'true'
        run: |
          set -euo pipefail
          docker run --rm -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE:ro" -w "$GITHUB_WORKSPACE/Packages/macOS/CmuxNext" \
            docker.io/library/swift@sha256:eccc7a97f9b9881d9659e2e788081fd7675f86d39793b51200bfb178398b3784 \
            swift package dump-package > "$RUNNER_TEMP/package-dump.json"

      - name: Setup Node
        if: steps.areas.outputs.strings == 'true' || steps.areas.outputs.webviews == 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.22.1"

      - name: Setup Bun
        if: steps.areas.outputs.shortcuts == 'true' || steps.areas.outputs.apphost == 'true' || needs.action-exports.outputs.exports == 'true' || steps.areas.outputs.cloud == 'true' || steps.areas.outputs.webviews == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"

      - name: Set up pinned cmux-tui Rust
        if: steps.areas.outputs.fmt == 'true' || steps.areas.outputs.clippy == 'true'
        uses: ./.github/actions/setup-cmux-tui-rust

      - name: Cache cargo build
        if: steps.areas.outputs.clippy == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          workspaces: cmux-tui -> target
          shared-key: cmux-pr-autofix-clippy

      # Before the other repairs, so their cargo fmt sees clippy's edits.
      - name: cargo clippy --fix
        if: steps.areas.outputs.clippy == 'true'
        run: |
          set -euo pipefail
          "$AUTOFIX/autofix-clippy.sh" "$GITHUB_WORKSPACE" < "$RUNNER_TEMP/changed.txt" | tee "$RUNNER_TEMP/clippy.txt"

      # Packages installed without lifecycle scripts; this job has no write token.
      - name: vp fmt
        if: steps.areas.outputs.webviews == 'true'
        working-directory: webviews
        run: |
          set -euo pipefail
          bun install --frozen-lockfile --ignore-scripts
          node_modules/.bin/vp fmt
          git diff --binary -- . > "$RUNNER_TEMP/webviews-fmt.patch"
          git checkout --quiet -- .

      - name: Download the regenerated action exports
        if: steps.areas.outputs.skip == 'false' && needs.action-exports.outputs.exports == 'true'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: action-exports
          path: ${{ runner.temp }}/action-exports

      - name: Repair
        if: steps.areas.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          GRAPH: ${{ steps.areas.outputs.graph }}
          STRINGS: ${{ steps.areas.outputs.strings }}
          SDK: ${{ steps.areas.outputs.sdk }}
          CAPABILITIES: ${{ steps.areas.outputs.capabilities }}
          SHORTCUTS: ${{ steps.areas.outputs.shortcuts }}
          APPHOST: ${{ steps.areas.outputs.apphost }}
          ACTIONS: ${{ steps.areas.outputs.actions || needs.action-areas.outputs.actions }}
          EXPORTS_VERIFIED: ${{ needs.action-exports.outputs.verified }}
          SETTINGS: ${{ steps.areas.outputs.settings || needs.action-areas.outputs.settings }}
          SETTINGS_VERIFIED: ${{ needs.action-exports.outputs.settings-verified }}
          RATCHETS: ${{ steps.areas.outputs.ratchets }}
          CLOUD: ${{ steps.areas.outputs.cloud }}
          GHOSTTY: ${{ steps.areas.outputs.ghostty }}
          FMT: ${{ steps.areas.outputs.fmt }}
        run: |
          set -euo pipefail
          args=()
          # Regenerated exports are copied in. The docs shortcuts and app-host
          # files follow the action exports only when this run regenerated them:
          # a settings-only artifact would rewrite them from the committed
          # action-surfaces.json, which can be older than their committed copies
          # (#21814 lost paletteKey.toggleActions that way).
          if [[ -d "$RUNNER_TEMP/action-exports" ]]; then
            args+=(--generated "$RUNNER_TEMP/action-exports")
            [[ -d "$RUNNER_TEMP/action-exports/plans/cmux-next" ]] && SHORTCUTS=true APPHOST=true
          fi
          [[ "$GRAPH" == true ]] && args+=(--package-dump "$RUNNER_TEMP/package-dump.json")
          [[ "$STRINGS" == true ]] && args+=(--strings)
          [[ "$SDK" == true ]] && args+=(--sdk)
          # The source parser regenerates the daemon capability export without a Swift build.
          [[ "$CAPABILITIES" == true ]] && grep -q -- '--capabilities)' "$AUTOFIX/base-autofix.sh" && args+=(--capabilities)
          [[ "$SHORTCUTS" == true ]] && args+=(--docs-shortcuts)
          # The base's script takes --app-host once this repair has landed there.
          [[ "$APPHOST" == true ]] && grep -q -- '--app-host)' "$AUTOFIX/base-autofix.sh" && args+=(--app-host)
          # Dependency order: the shortcuts and app-host files follow the action
          # exports, so they wait while the exports' inputs changed unverified.
          [[ "$ACTIONS" == true && "$EXPORTS_VERIFIED" != true ]] && grep -q -- '--unverified-exports)' "$AUTOFIX/base-autofix.sh" && args+=(--unverified-exports)
          # The defaults snapshot follows the settings exports the same way.
          [[ "$SETTINGS" == true && "$SETTINGS_VERIFIED" != true ]] && grep -q -- '--unverified-settings-exports)' "$AUTOFIX/base-autofix.sh" && args+=(--unverified-settings-exports)
          [[ "$RATCHETS" == true ]] && args+=(--ratchets)
          [[ "$CLOUD" == true ]] && args+=(--cloud-clients)
          [[ -s "$RUNNER_TEMP/webviews-fmt.patch" ]] && args+=(--webviews-fmt-patch "$RUNNER_TEMP/webviews-fmt.patch")
          [[ "$FMT" == true ]] || args+=(--no-fmt)
          cat "$RUNNER_TEMP/clippy.txt" 2>/dev/null > "$RUNNER_TEMP/autofix.txt" || true
          "$AUTOFIX/base-autofix.sh" ${args[@]+"${args[@]}"} "$GITHUB_WORKSPACE" | tee -a "$RUNNER_TEMP/autofix.txt"
          # The GhosttyKit checksum, when the release for the pull request's
          # ghostty commit is already published (exit 3: not yet; the base
          # bot pins it after the merge). Any other failure (a branch whose
          # download script predates --print-release) is left to the base bot.
          if [[ "$GHOSTTY" == true ]]; then
            status=0
            "$AUTOFIX/ghosttykit-checksum.sh" "$GITHUB_WORKSPACE" | tee -a "$RUNNER_TEMP/autofix.txt" || status=$?
            if (( status != 0 && status != 3 )); then
              echo "left: GhosttyKit checksum lookup failed (exit $status); the base bot pins it after the merge" | tee -a "$RUNNER_TEMP/autofix.txt"
            fi
          fi
          { echo "### PR autofix at ${GITHUB_SHA:0:12}"; echo; sed 's/^/- /' "$RUNNER_TEMP/autofix.txt"; } >> "$GITHUB_STEP_SUMMARY"

      - name: Patch
        id: patch
        if: steps.areas.outputs.skip == 'false'
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # The repair runs on the immutable merge tree, but the artifact must
          # be based on the exact branch head that triggered this run. Refuse
          # to produce a patch if either identity is missing or mismatched;
          # otherwise a formatter-only repair can accidentally publish a
          # commit whose parent no longer contains the PR's functional diff.
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git rev-parse "${HEAD_SHA}^{commit}")" = "${HEAD_SHA}"
          # Repairs ran on the merged tree. Replace the index with the PR head
          # tree before staging so the artifact is a patch against the exact
          # branch head; this avoids applying base-only context at push time.
          git add -A
          mapfile -t changed < <(git diff --cached --name-only)
          git read-tree "$HEAD_SHA"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          tracked=() untracked=()
          for path in "${changed[@]}"; do
            if git cat-file -e "$HEAD_SHA:$path" 2>/dev/null; then
              tracked+=("$path")
            else
              untracked+=("$path")
            fi
          done
          : > "$RUNNER_TEMP/pr-autofix.patch"
          if (( ${#tracked[@]} )); then git diff --binary -- "${tracked[@]}" >> "$RUNNER_TEMP/pr-autofix.patch"; fi
          if (( ${#untracked[@]} )); then
            git add -A -- "${untracked[@]}"
            git diff --cached --binary -- "${untracked[@]}" >> "$RUNNER_TEMP/pr-autofix.patch"
          fi
          cp "$RUNNER_TEMP/autofix.txt" "$RUNNER_TEMP/pr-autofix.txt"
          if [[ ! -s "$RUNNER_TEMP/pr-autofix.patch" ]]; then
            echo "Nothing to repair." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "patch=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "patch=true" >> "$GITHUB_OUTPUT"
          {
            echo
            echo "Repairs: artifact \`pr-autofix-patch\`. A same-repo branch gets them as a commit from the push job; on a fork, download the artifact and run:"
            echo
            echo "    git apply --index pr-autofix.patch && git commit -m 'chore(next): PR autofix' && git push   # on $HEAD_REF (--index stages new files too)"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.patch.outputs.patch == 'true'
        with:
          name: pr-autofix-patch
          path: |
            ${{ runner.temp }}/pr-autofix.patch
            ${{ runner.temp }}/pr-autofix.txt
          if-no-files-found: error
          retention-days: 7

  # A pull request carries only the generated files its own changes caused
  # (scripts/cmux-next/generated_outputs.py, #21946). An output changed without
  # its inputs (regenerated against a newer base, or a stale copy a merge kept)
  # conflicts with every other pull request and can drop the base's newer rows;
  # the base autofix regenerates it after each merge. The check runs the base's
  # copy of the table on the pull request's changed list (the files API's set)
  # and reads nothing from the head.
  # The `generated-drift-ok` label skips it, for a generator fix that ships its
  # own regenerated output in a later commit. It takes effect on the next push
  # (a re-run reuses the event's labels). The changed list comes from
  # action-areas (git, no API call); when that job failed or left no list, the
  # check still runs and reads the files API.
  generated-drift:
    name: generated drift
    needs: [action-areas]
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.CI_CLOUD_OVERFLOW_SAVED && 'blacksmith-8vcpu-ubuntu-2404' || 'blacksmith-2vcpu-ubuntu-2404' }}
    timeout-minutes: 5
    if: ${{ !cancelled() && !contains(github.event.pull_request.labels.*.name, 'generated-drift-ok') }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          sparse-checkout: scripts/cmux-next
          sparse-checkout-cone-mode: true

      - name: Generated files this pull request did not cause
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          CHANGED: ${{ needs.action-areas.outputs.changed }}
        run: |
          set -euo pipefail
          [[ -f scripts/cmux-next/generated_outputs.py ]] || { echo "The base has no generated_outputs.py yet."; exit 0; }
          if [ -z "$CHANGED" ] || ! printf '%s' "$CHANGED" | base64 -d | gunzip > "$RUNNER_TEMP/changed.txt"; then
            gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files?per_page=100" \
              --jq '.[] | .filename, (.previous_filename // empty)' > "$RUNNER_TEMP/changed.txt"
          fi
          if ! python3 -I scripts/cmux-next/generated_outputs.py drift --changed "$RUNNER_TEMP/changed.txt" > "$RUNNER_TEMP/drift.txt"; then
            sed 's/^/::error::/' "$RUNNER_TEMP/drift.txt"
            { echo "### Generated files this pull request did not cause"; sed 's/^/- /' "$RUNNER_TEMP/drift.txt"; } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  push:
    name: push the repairs
    # The contents-write App key is never exposed to PR-controlled workflow
    # code. A main-only environment intentionally leaves PR repairs as an
    # artifact until this push is moved behind a trusted workflow_run broker.
    environment: cmux-pr-autofix
    needs: [action-areas, action-exports, repair]
    # Explicit status checks: the implicit success() would fail on the
    # action-exports job, which most pull requests skip. The areas must have
    # been read and the exports made (or not needed): a pushed head carries an
    # Autofix-Run trailer, action-areas skips the exports for such a head, so a
    # push after a cancelled areas job (its fetch timing out) or failed exports
    # would leave the exports stale for every later run (#21814, run 39315375602).
    if: ${{ github.event_name != 'pull_request' && !cancelled() && needs.action-areas.result == 'success' && (needs.action-exports.result == 'success' || needs.action-exports.result == 'skipped') && needs.repair.result == 'success' && needs.repair.outputs.patch == 'true' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.CI_CLOUD_OVERFLOW_SAVED && 'blacksmith-8vcpu-ubuntu-2404' || 'blacksmith-2vcpu-ubuntu-2404' }} # ephemeral-required: holds a contents write token for a pull request branch; ephemeral Blacksmith VM
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      # The apply script comes from the base branch's tip (as the repair's
      # scripts do): the patch was made by the pull request's code, and the
      # script decides what of it may be pushed.
      - name: Check out the base's apply script
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: refs/heads/${{ github.event.pull_request.base.ref }}
          path: base
          persist-credentials: false
          sparse-checkout: scripts/cmux-next
          sparse-checkout-cone-mode: true

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: head
          persist-credentials: false

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: pr-autofix-patch
          path: ${{ runner.temp }}/pr-autofix

      - name: Apply and commit
        id: commit
        env:
          HAS_APP: ${{ secrets.CMUX_PR_AUTOFIX_APP_ID != '' && secrets.CMUX_PR_AUTOFIX_APP_KEY != '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          test "$(git -C head rev-parse HEAD)" = "${HEAD_SHA}"
          apply=base/scripts/cmux-next/pr-autofix-apply.sh
          if [[ "$HAS_APP" != true ]]; then
            echo "::notice::No PR autofix App secrets (CMUX_PR_AUTOFIX_APP_ID/KEY) yet; the repairs stay in the artifact pr-autofix-patch."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ ! -x "$apply" ]]; then
            echo "::notice::The base has no pr-autofix-apply.sh yet; the repairs stay in the artifact."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Only what the pull request owns (#21946): its own files, and outputs whose
          # inputs it changed. The list comes from the files API, not the artifact.
          owned=()
          if grep -q -- '--changed' "$apply"; then
            gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files?per_page=100" \
              --jq '.[] | .filename, (.previous_filename // empty)' > "$RUNNER_TEMP/changed.txt"
            owned=(--changed "$RUNNER_TEMP/changed.txt")
          fi
          "$apply" "$RUNNER_TEMP/pr-autofix/pr-autofix.patch" head ${owned[@]+"${owned[@]}"} | tee -a "$GITHUB_STEP_SUMMARY"
          if ! git -C head status --porcelain | grep -q .; then
            echo "Every repair belongs to the base autofix; nothing to push." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cd head
          git config user.name "cmux-autofix[bot]"
          git config user.email "cmux-autofix[bot]@users.noreply.github.com"
          git add -A
          git commit --quiet -m "chore(next): PR autofix at ${HEAD_SHA:0:12}" \
            -m "$(git diff --cached --name-only | sed 's/^/- /')" \
            -m "Autofix-Run: $RUN_URL"
          test "$(git rev-parse HEAD^)" = "${HEAD_SHA}"
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Mint the PR autofix App token
        id: app-token
        if: steps.commit.outputs.pushed == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.CMUX_PR_AUTOFIX_APP_ID }}
          private-key: ${{ secrets.CMUX_PR_AUTOFIX_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Push to the pull request branch
        if: steps.commit.outputs.pushed == 'true'
        working-directory: head
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          # A plain push: a newer push to the branch wins, and its run repairs it.
          if ! git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push --quiet \
              "https://github.com/$GITHUB_REPOSITORY.git" "HEAD:refs/heads/$HEAD_REF"; then
            echo "::notice::$HEAD_REF moved during the repair; the newer push's run repairs it." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "Pushed $(git rev-parse --short HEAD) to $HEAD_REF." | tee -a "$GITHUB_STEP_SUMMARY"
