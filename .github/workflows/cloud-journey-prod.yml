name: Cloud journey (production, hourly)

# The NEXT Cloud journey (scripts/cmux-next/cloud-journey.ts) against production every hour: sign in as the
# production agent test account, create a machine, pass the account's Claude login the way the Mac app does
# (CloudCredentialTransfer's preflight, fs/write and installer), start Claude, send a chat, read the reply back,
# delete the machine. The step table is the run summary; probe.json (one cmuxterm-hq probes.py row,
# `cloud-chat-replies-production`: ok with the send-to-reply ms, or fail with the failed step) is the artifact.
# A red run opens one issue, or rewrites the open one's body; the next green run closes it.
#
# Secrets: the repository's production agent test account (CMUX_DOGFOOD_STACK_EMAIL and _PASSWORD; the
# cmux-next-vm-image-dev environment shadows them with the staging account, so this job takes no environment)
# and CLAUDE_CODE_OAUTH_TOKEN, the login machine-vault-e2e.yml gives its daemons. They reach the one run step
# through env; the journey sends them only in headers and request bodies and scrubs them from its output.
#
# The schedule registers from main; the scripts it runs come from feat-cmux-next. A pull request that changes
# the journey runs it at its own head.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/cloud-journey-prod.yml
      - scripts/cmux-next/cloud-journey.ts
      - Packages/macOS/CmuxNext/Sources/CmuxNextCloudCredentials/CloudCredentialInstaller.swift

permissions:
  contents: read

concurrency:
  group: cloud-journey-prod-${{ github.event.pull_request.number || 'tick' }}
  cancel-in-progress: false

jobs:
  journey:
    # Never on a fork's pull request: it gets no secrets, and the job would only note a skip.
    if: github.repository_owner == 'manaflow-ai' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ${{ contains(fromJSON('["blacksmith-8vcpu-ubuntu-2404","blacksmith-16vcpu-ubuntu-2404","blacksmith-4vcpu-ubuntu-2404"]'), vars.LINUX_RUNNER) && vars.LINUX_RUNNER || fromJSON(vars.RUNNER_POOLS).linux_2 }}
    timeout-minutes: 30
    outputs:
      outcome: ${{ steps.journey.outputs.outcome }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'feat-cmux-next' }}
          sparse-checkout: |
            scripts/cmux-next
            Packages/macOS/CmuxNext/Sources/CmuxNextCloudCredentials
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
      - name: Cloud journey (prod)
        id: journey
        env:
          CMUX_DOGFOOD_STACK_EMAIL: ${{ secrets.CMUX_DOGFOOD_STACK_EMAIL }}
          CMUX_DOGFOOD_STACK_PASSWORD: ${{ secrets.CMUX_DOGFOOD_STACK_PASSWORD }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -uo pipefail
          out="$RUNNER_TEMP/cloud-journey"
          mkdir -p "$out"
          bun scripts/cmux-next/cloud-journey.ts --backend prod --out "$out" --probe-out "$out/probe.json" --skip sync,pause
          code=$?
          cat "$out/summary.md" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "(no summary written)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" = 0 ]; then echo "outcome=pass" >> "$GITHUB_OUTPUT"; else echo "outcome=fail" >> "$GITHUB_OUTPUT"; fi
          exit "$code"
      - name: Keep the step table and the probe row
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cloud-journey-prod
          path: ${{ runner.temp }}/cloud-journey
          if-no-files-found: ignore
          retention-days: 14

  # One issue for a red production journey: opened on the first red, its body rewritten on later reds (no
  # comment per hour), closed by the next green. Scheduled and dispatched runs only, never a pull request's.
  issue:
    needs: [journey]
    # A timed-out or cancelled journey writes no outcome: that is a red too. Only main's own runs touch the issue.
    if: always() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')) && needs.journey.result != 'skipped'
    runs-on: ${{ fromJSON(vars.RUNNER_POOLS).linux_2 }}
    permissions:
      issues: write
    timeout-minutes: 5
    steps:
      - name: Open, update or close the red-journey issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OUTCOME: ${{ needs.journey.outputs.outcome || 'fail' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="Cloud journey (production) is red"
          open="$(gh issue list --state open --search "\"$title\" in:title" --json number,title \
            --jq "map(select(.title == \"$title\"))[0].number // \"\"")"
          if [ "$OUTCOME" = pass ]; then
            if [ -n "$open" ]; then gh issue close "$open" --comment "Green again: a production chat reply was read back ([run]($RUN_URL))."; fi
            exit 0
          fi
          # shellcheck disable=SC2016 # backticks are Markdown, not a command
          body="$(printf 'The hourly production Cloud journey (`.github/workflows/cloud-journey-prod.yml`) failed.\n\nLatest red run: %s (its summary has the step table; `probe.json` in its artifact names the failed step).\n\nUpdated %s. The next green run closes this issue.\n' "$RUN_URL" "$(date -u +%Y-%m-%dT%H:%MZ)")"
          if [ -n "$open" ]; then
            gh issue edit "$open" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
