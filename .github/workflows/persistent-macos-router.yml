name: Persistent macOS compile router
run-name: persistent-mac-router-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}

# `requested` fires once, when the CI run record is created. `in_progress`
# fires again every time a CI job starts, so one CI run used to create about
# five extra router runs that the condition on the route job then skipped.
# `requested` carries what the router reads: the run id and attempt that name
# the route request artifact exist as soon as the run record does, and the wait
# in the route job covers the interval until CI publishes it.
#
# The documented cost is that `requested` is not delivered when a workflow is
# re-run. Re-running all of CI therefore publishes a route request that nothing
# collects, and that attempt compiles on a hosted runner — the same path taken
# whenever no trusted request is published. Re-running only failed jobs was
# already inert here, because the attempt's request artifact is never republished.
on:
  workflow_run:
    workflows: [CI]
    types: [requested]

permissions: {}

env:
  # The file that must carry the display name in the trigger above. Renaming a
  # workflow silently stops every `workflow_run` consumer of it, so
  # tests/test_ci_workflow_run_sources.py derives the expected name from this
  # path and fails the pull request that renames it.
  SOURCE_WORKFLOW_PATHS: .github/workflows/ci.yml

concurrency:
  group: persistent-mac-router-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
  cancel-in-progress: true

jobs:
  route:
    name: Route persistent Mac compile
    if: ${{ github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.head_repository.full_name == github.repository && (vars.CI_PERSISTENT_MAC_COMPILE == 'pilot' || vars.CI_PERSISTENT_MAC_COMPILE == 'all' || vars.CI_PERSISTENT_MAC_COMPILE == 'on' || vars.CI_PERSISTENT_MAC_COMPILE == 'true' || vars.CI_PERSISTENT_MAC_COMPILE == '1') }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    # The wait below may use 600s, and the dispatch step that follows bounds
    # itself by CI_PERSISTENT_MAC_QUEUE_SECONDS + CI_PERSISTENT_MAC_EXECUTION_SECONDS,
    # which persistent_mac_route.py admits up to 600s in total. 15 minutes no
    # longer covers both, and being killed between dispatch and the cancel
    # handler would leave an owned Mac compiling for nothing.
    timeout-minutes: 25
    permissions:
      actions: write
      contents: read
      pull-requests: read
    steps:
      - name: Checkout trusted router
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          persist-credentials: false

      - name: Find exact CI route request
        id: request-artifact
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
          CI_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          set -euo pipefail
          name="persistent-mac-route-request-$CI_RUN_ID-$CI_RUN_ATTEMPT"
          # The router now attaches when CI is requested rather than once a job
          # is running, so this wait spans CI's queue time as well as the
          # changes job that publishes the request. The deadline is the upper
          # bound; a CI run that finished without publishing ends the wait after
          # one more look, so an ineligible pull request does not hold a runner.
          deadline=$(( $(date +%s) + 600 ))
          artifact_id=""
          ci_finished=false
          polls=0
          while :; do
            # There is no second notification to fall back on, and the old
            # trigger's repeat events used to replace a router run that had
            # died on a transient error. Treat a failed read as "not yet".
            payload="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID/artifacts?name=$name&per_page=100" 2>/dev/null || true)"
            count="$(python3 -c 'import json,sys; print(len(json.load(sys.stdin).get("artifacts", [])))' <<<"$payload" 2>/dev/null || echo 0)"
            if [ "$count" -gt 1 ]; then
              echo "multiple persistent route request artifacts found" >&2
              exit 1
            fi
            if [ "$count" -eq 1 ]; then
              artifact_id="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["artifacts"][0]["id"])' <<<"$payload")"
              break
            fi
            if [ "$ci_finished" = true ] || [ "$(date +%s)" -ge "$deadline" ]; then
              break
            fi
            # A superseded CI run is cancelled within seconds, so ask about once
            # every 30s rather than on every look for the artifact. The token's
            # hourly budget is shared across the repository.
            polls=$(( polls + 1 ))
            if [ $(( polls % 6 )) -eq 0 ]; then
              status="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID" --jq .status 2>/dev/null || true)"
              if [ "$status" = "completed" ]; then
                ci_finished=true
              fi
            fi
            sleep 5
          done
          if [ -z "$artifact_id" ]; then
            echo "No trusted persistent route request was published; hosted admission remains authoritative."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "found=true"
            echo "artifact_id=$artifact_id"
          } >> "$GITHUB_OUTPUT"

      - name: Download exact CI route request
        if: ${{ steps.request-artifact.outputs.found == 'true' }}
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          artifact-ids: ${{ steps.request-artifact.outputs.artifact_id }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/persistent-mac-route-request

      - name: Validate route request envelope
        id: request
        if: ${{ steps.request-artifact.outputs.found == 'true' }}
        env:
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
          CI_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          set -euo pipefail
          request="$(find "$RUNNER_TEMP/persistent-mac-route-request" -type f -name 'persistent-mac-route-request.json' -print -quit)"
          [ -n "$request" ] && [ -f "$request" ]
          REQUEST="$request" python3 - <<'PY'
          import json
          import os
          import re

          payload = json.load(open(os.environ["REQUEST"], encoding="utf-8"))
          required = {
              "schema_version", "request_id", "pr_number", "source_sha", "source_tree",
              "source_parent1", "head_sha", "head_ref", "head_repository",
              "author_association",
          }
          if set(payload) != required or payload["schema_version"] != 1:
              raise SystemExit("invalid persistent route request schema")
          expected_id = f"{os.environ['CI_RUN_ID']}-{os.environ['CI_RUN_ATTEMPT']}"
          if payload["request_id"] != expected_id:
              raise SystemExit("persistent route request identity mismatch")
          if not re.fullmatch(r"[1-9][0-9]*", str(payload["pr_number"])):
              raise SystemExit("invalid persistent route pull request number")
          for key in ("source_sha", "source_tree", "source_parent1", "head_sha"):
              if not isinstance(payload[key], str) or not re.fullmatch(r"[a-f0-9]{40,64}", payload[key]):
                  raise SystemExit(f"invalid persistent route {key}")
          if payload["head_repository"].casefold() != os.environ["GITHUB_REPOSITORY"].casefold():
              raise SystemExit("persistent route request is not same-repository")
          for key in ("head_ref", "head_repository", "author_association"):
              value = payload[key]
              if not isinstance(value, str) or not value or len(value) > 240 or "\n" in value or "\r" in value:
                  raise SystemExit(f"invalid persistent route {key}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              for key in (
                  "pr_number", "source_sha", "source_tree", "source_parent1",
                  "head_sha", "head_ref", "head_repository", "author_association",
              ):
                  output.write(f"{key}={payload[key]}\n")
          PY

      - name: Dispatch and bound persistent compile
        id: route
        if: ${{ steps.request-artifact.outputs.found == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          CI_PERSISTENT_MAC_COMPILE: ${{ vars.CI_PERSISTENT_MAC_COMPILE }}
          CI_PERSISTENT_MAC_COMPILE_COHORT: ${{ vars.CI_PERSISTENT_MAC_COMPILE_COHORT }}
          CI_PERSISTENT_MAC_QUEUE_SECONDS: ${{ vars.CI_PERSISTENT_MAC_QUEUE_SECONDS }}
          CI_PERSISTENT_MAC_EXECUTION_SECONDS: ${{ vars.CI_PERSISTENT_MAC_EXECUTION_SECONDS }}
          PR_NUMBER: ${{ steps.request.outputs.pr_number }}
          HEAD_REPOSITORY: ${{ steps.request.outputs.head_repository }}
          HEAD_REF: ${{ steps.request.outputs.head_ref }}
          AUTHOR_ASSOCIATION: ${{ steps.request.outputs.author_association }}
          HEAD_SHA: ${{ steps.request.outputs.head_sha }}
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
          SOURCE_TREE: ${{ steps.request.outputs.source_tree }}
          SOURCE_PARENT1: ${{ steps.request.outputs.source_parent1 }}
          CI_SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          CI_SOURCE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          set -euo pipefail
          queue_seconds="${CI_PERSISTENT_MAC_QUEUE_SECONDS:-90}"
          execution_seconds="${CI_PERSISTENT_MAC_EXECUTION_SECONDS:-480}"
          python3 scripts/ci/persistent_mac_route.py \
            --event-name pull_request \
            --selector "$CI_PERSISTENT_MAC_COMPILE" \
            --cohort "$CI_PERSISTENT_MAC_COMPILE_COHORT" \
            --repository "$GITHUB_REPOSITORY" \
            --pr-number "$PR_NUMBER" \
            --head-repository "$HEAD_REPOSITORY" \
            --head-ref "$HEAD_REF" \
            --author-association "$AUTHOR_ASSOCIATION" \
            --head-sha "$HEAD_SHA" \
            --source-sha "$SOURCE_SHA" \
            --source-tree "$SOURCE_TREE" \
            --source-parent1 "$SOURCE_PARENT1" \
            --run-id "$CI_SOURCE_RUN_ID" \
            --run-attempt "$CI_SOURCE_RUN_ATTEMPT" \
            --queue-seconds "$queue_seconds" \
            --execution-seconds "$execution_seconds" \
            --github-output "$GITHUB_OUTPUT"

      - name: Record router evidence
        if: ${{ always() && steps.request-artifact.outputs.found == 'true' }}
        env:
          REQUEST_ID: ${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          USE_PERSISTENT: ${{ steps.route.outputs.use_persistent }}
          FALLBACK_REASON: ${{ steps.route.outputs.fallback_reason }}
          PRODUCER_RUN_ID: ${{ steps.route.outputs.producer_run_id }}
          ARTIFACT_ID: ${{ steps.route.outputs.artifact_id }}
          QUEUE_SECONDS: ${{ steps.route.outputs.queue_to_start_seconds }}
          ALLOCATED_SECONDS: ${{ steps.route.outputs.producer_allocated_seconds }}
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import os
          print("### Persistent Mac router")
          print()
          for label, name in (
              ("request", "REQUEST_ID"),
              ("use persistent", "USE_PERSISTENT"),
              ("fallback reason", "FALLBACK_REASON"),
              ("producer run", "PRODUCER_RUN_ID"),
              ("artifact", "ARTIFACT_ID"),
              ("queue-to-start seconds", "QUEUE_SECONDS"),
              ("allocated runner seconds", "ALLOCATED_SECONDS"),
          ):
              print(f"- {label}: `{os.environ.get(name, '')}`")
          PY
