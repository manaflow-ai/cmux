name: CI cloud overflow probe

# Blacksmith is overflow behind the owned minis. When it stops starting jobs
# (2026-09-29: from about 10:15Z, 1 of about 1,986 runners online and about
# 150 runs queued for two hours), the runner variables that send overflow
# there (LINUX_RUNNER, CI_TRUSTED_RUNNER, MACOS_RUNNER_*, CI_PAID_MACOS_OVERFLOW) are pointed at
# the owned pools and another Blacksmith Linux size, and pointed back once it serves
# again. One switch: `probe` asks for each Blacksmith Linux size compiles run
# on and only prints a line; `watch`, on the trusted CI_TRUSTED_RUNNER selector, waits for them.
# scripts/ci/cloud_overflow_switch.py has the rules:
#
# - Every probe starts within CI_CLOUD_PROBE_MINUTES (default 5) of being
#   queued: if this switch had turned overflow off, every variable it changed
#   is restored from the CI_CLOUD_OVERFLOW_SAVED record (unless someone
#   changed it since) and the record is deleted.
# - None does: the record is written (each variable's value before, its
#   failover, when and why), the variables are pointed at their failovers,
#   runs already stuck on a Blacksmith label are force-cancelled and re-run,
#   and this run force-cancels itself, since its probes would stay queued.
# - Some start and some do not: nothing changes either way.
#
# The lane switches (CI_PR_POOL_OWNED, CI_E2E_OWNED_UI, CI_IOS_OWNED, ...) are
# never touched: minis-first routing does not change, only where overflow
# goes. Nothing here gates a merge.
#
# Writing variables takes a token no workflow permission grants. Use the
# existing manaflow-glaeda-route App (`GLAEDA_ROUTE_APP_ID` and
# `GLAEDA_ROUTE_APP_KEY`), which is already configured at repository scope.
# Without it the watch still probes and names the values to set by hand, and
# fails.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Probe and report what would change without writing any variable or cancelling any run"
        required: true
        default: true
        type: boolean
      probe_label:
        description: "Drill: probe this label instead (a label no runner has simulates an outage); always a dry run"
        required: false
        default: ""
        type: string

permissions: {}

# One probe at a time: a second waits instead of racing the first one's writes.
# The group is fixed on purpose: the switch's variable writes and record delete
# are separate calls, so two watches must never run at once. A run whose probe
# never starts cannot hold it for long: the watch runs on a size the probe does
# not test by default (below), decides within CI_CLOUD_PROBE_MINUTES, and force-cancels its
# own run. On 2026-10-28 the watch sat queued on Blacksmith Linux beside its
# probe instead, so the group stayed held for an hour.
concurrency:
  group: ci-cloud-overflow-probe
  cancel-in-progress: false

jobs:
  probe:
    # One probe per Blacksmith Linux size compiles run on
    # (cloud_overflow_switch.PROBE_LABELS). Overflow goes off only when none of
    # them starts, and back on only when all start: a single probed label is a pin, and on 2026-10-28 the 4 vCPU
    # label alone stalling flipped the whole fleet four times. A drill probes
    # only its own label.
    name: Blacksmith probe (${{ matrix.label }})
    if: github.repository_owner == 'manaflow-ai'
    strategy:
      fail-fast: false
      matrix:
        label: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.probe_label != '' && format('["{0}"]', inputs.probe_label) || '["blacksmith-4vcpu-ubuntu-2404", "blacksmith-16vcpu-ubuntu-2404"]') }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || matrix.label }}
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Started
        run: echo "Blacksmith started this job on ${RUNNER_NAME:-an unnamed runner}"

  watch:
    name: Watch the probe and switch overflow
    if: github.repository_owner == 'manaflow-ai'
    # Its own bounded selector over CI_TRUSTED_RUNNER, the variable the other
    # GLAEDA_ROUTE_APP_KEY control jobs read (ci-owned-pool-rescue, ci-stale-run-janitor).
    # The expression bounds the value to one-job Blacksmith Linux VMs (2 or 8 vCPU), so no
    # variable can move this App key to a reused machine. Unlike the shared trusted selector it
    # never resolves to a size the probes ask for (PROBE_LABELS, 4 and 16 vCPU) or to GitHub-
    # hosted Ubuntu: any other value, unset included (the switch's restore can unset it, and
    # its alternate failover is 4 vCPU), takes Blacksmith 2 vCPU. So a stalled probe size never holds the watch, and with it the
    # concurrency group, as on 2026-10-28 (tests/test_ci_cloud_overflow_switch.py).
    # It used to name the literal blacksmith-6vcpu-macos-26, a single-label pin with no
    # fallback: on 2026-11-03 RUNNER_POOLS marked that label dead and run 41688532704's
    # watch queued 19 minutes (17:53Z-18:12Z), so the hosted light rescue below ran about
    # every 20-25 minutes instead of every pass (cmuxterm-hq#6671). It needs no macOS
    # (Python and gh only).
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || contains(fromJSON('["blacksmith-2vcpu-ubuntu-2404","blacksmith-8vcpu-ubuntu-2404"]'), vars.CI_TRUSTED_RUNNER) && vars.CI_TRUSTED_RUNNER || 'blacksmith-2vcpu-ubuntu-2404' }} # ephemeral-required: holds the App key that writes runner variables; never a probed size
    timeout-minutes: 25
    permissions:
      actions: write
      contents: read
    steps:
      - name: Check out trusted switch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # The variables signing jobs read are repository-wide, but most signing jobs live on
      # feat-cmux-next: read its workflows too (signing_runner_variables.py). Without them the
      # switch fails closed and writes no owned label to any runner variable.
      - name: Check out feat-cmux-next's workflows
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: feat-cmux-next
          path: .signing-workflows/feat-cmux-next
          sparse-checkout: .github/workflows
          persist-credentials: false

      # The existing route App carries the repository variable permission; the
      # action cannot narrow permissions by name, so the token carries what
      # that App has.
      - name: Mint the switch token
        id: switch-token
        if: vars.GLAEDA_ROUTE_APP_ID != ''
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.GLAEDA_ROUTE_APP_ID }}
          private-key: ${{ secrets.GLAEDA_ROUTE_APP_KEY }}

      # Reads only (this run's probe jobs, and the queued and in-progress listings when a probe stalls):
      # cmux-bot's installation has its own pool, so the watch's polling stops spending the repository
      # GITHUB_TOKEN's 1,000/h that every workflow shares (the NEXT nightly's notarization step ran
      # out of it on 2026-11-04). Read-only: force-cancel and re-run stay on the workflow token
      # (GH_FALLBACK_TOKEN), as do refused reads; variable writes stay on the switch token.
      - name: Mint the cmux-bot read token
        id: cmux-bot-token
        if: vars.CMUX_BOT_APP_ID != ''
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.CMUX_BOT_APP_ID }}
          private-key: ${{ secrets.CMUX_BOT_APP_KEY }}
          permission-actions: read

      - name: Probe and switch
        id: switch
        env:
          GH_TOKEN: ${{ steps.cmux-bot-token.outputs.token || github.token }}
          GH_FALLBACK_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SWITCH_TOKEN: ${{ steps.switch-token.outputs.token }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && (inputs.dry_run || inputs.probe_label != '') && 'true' || 'false' }}
          PROBE_LABEL_DRILL: ${{ github.event_name == 'workflow_dispatch' && inputs.probe_label || '' }}
          PROBE_MINUTES: ${{ vars.CI_CLOUD_PROBE_MINUTES }}
          SIGNING_WORKFLOW_DIRS: .signing-workflows/feat-cmux-next/.github/workflows
          # Live values from the expression context; '' is unset. Runner labels
          # only, as in ci-repo-variables.yml: a step's env is in its public log.
          VAR_CI_CLOUD_OVERFLOW_SAVED: ${{ vars.CI_CLOUD_OVERFLOW_SAVED }}
          VAR_CI_CLOUD_FAILOVER: ${{ vars.CI_CLOUD_FAILOVER }}
          VAR_CMUX_CI_XCODE_APP_PR: ${{ vars.CMUX_CI_XCODE_APP_PR }}
          # NAME=value per line, read ungated on purpose: the switch has to see
          # what each variable holds to put it back (the same reporting read as
          # ci-repo-variables.yml).
          CMUX_CI_RUNNER_VARIABLES: |
            CI_PAID_MACOS_OVERFLOW=${{ vars.CI_PAID_MACOS_OVERFLOW }}
            CI_TRUSTED_RUNNER=${{ vars.CI_TRUSTED_RUNNER }}
            LINUX_RUNNER=${{ vars.LINUX_RUNNER }}
            MACOS_RUNNER_15=${{ vars.MACOS_RUNNER_15 }}
            MACOS_RUNNER_26=${{ vars.MACOS_RUNNER_26 }}
            MACOS_RUNNER_26_LARGE=${{ vars.MACOS_RUNNER_26_LARGE }}
            MACOS_RUNNER_DISPLAY=${{ vars.MACOS_RUNNER_DISPLAY }}
            MACOS_RUNNER_DUAL_XCODE=${{ vars.MACOS_RUNNER_DUAL_XCODE }}
            MACOS_RUNNER_IOS=${{ vars.MACOS_RUNNER_IOS }}
            MACOS_RUNNER_PR=${{ vars.MACOS_RUNNER_PR }}
            MACOS_RUNNER_TESTS=${{ vars.MACOS_RUNNER_TESTS }}
        run: bash scripts/ci/python-with-yaml.sh scripts/ci/cloud_overflow_switch.py

      # The queue-aware spill (cmux#31884): a size that keeps starting jobs is never dead, so
      # on 2026-11-02 the linux pool stayed on 4 vCPU with 428 jobs queued beside 535 running
      # while 16 vCPU had room. The reviewed feat-cmux-next entry point at this pinned commit
      # runs main's unchanged runner_pools.py policy, then spills linux off a backed-up member.
      # Only its two files are checked out; main's policy and clients stay this checkout's.
      - name: Check out the reviewed linux pool spill
        id: spill-tooling
        if: always() && steps.switch.outcome != 'skipped'
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: c736d2e6c1db29305963040992f89f9466630f79 # cmux#31884 + #31962 + #31980 on feat-cmux-next
          path: .runner-pool-tooling
          sparse-checkout: |
            scripts/ci/linux_pool_spill.py
            scripts/ci/runner_pool_reconcile.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # The one routing source (docs/ci-runners.md "Runner pools"): point each pool in
      # RUNNER_POOLS at its first member that is not dead, from the probe's per-label health
      # and the queue janitor's snapshot, and spill linux off a backed-up member (above).
      # Without the spill checkout, main's runner_pools.py runs alone as before.
      # Runs whatever the switch decided, with its token.
      # GH_TOKEN only reads (the spill's queue sample lists in-flight runs and their jobs; the policy reads the
      # janitor's pool snapshot artifact), so it is the cmux-bot read token minted above: measured on
      # 2026-11-04 (14:03-15:02Z) at about 54 GITHUB_TOKEN requests a run, six runs an hour. Variable writes stay
      # on SWITCH_TOKEN; a failed mint falls back to the workflow token.
      - name: Point the runner pools at live members
        if: always() && steps.switch.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ steps.cmux-bot-token.outputs.token || github.token }}
          GH_REPO: ${{ github.repository }}
          SWITCH_TOKEN: ${{ steps.switch-token.outputs.token }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && (inputs.dry_run || inputs.probe_label != '') && 'true' || 'false' }}
          RUNNER_POOLS: ${{ vars.RUNNER_POOLS }}
          # Read live through the API first; these are the job-start values, the fallback.
          CI_CLOUD_LABEL_HEALTH: ${{ vars.CI_CLOUD_LABEL_HEALTH }}
          LINUX_RUNNER: ${{ vars.LINUX_RUNNER }}
          CI_CLOUD_OVERFLOW_SAVED: ${{ vars.CI_CLOUD_OVERFLOW_SAVED }}
          SPILL_TOOLING: ${{ steps.spill-tooling.outcome == 'success' && '.runner-pool-tooling/scripts/ci/linux_pool_spill.py' || '' }}
        run: |
          if [ -n "$SPILL_TOOLING" ] && [ -f "$SPILL_TOOLING" ]; then
            python3 "$SPILL_TOOLING" --policy-root "$GITHUB_WORKSPACE" && exit 0
            echo "::warning title=Runner pools::the linux pool spill failed; main's runner_pools.py runs alone"
            python3 scripts/ci/runner_pools.py
          else
            echo "::warning title=Runner pools::no linux pool spill checkout; main's runner_pools.py runs alone"
            python3 scripts/ci/runner_pools.py
          fi

      # Last, in its own step so the summary above is already saved. If the
      # switch did not observe every probe start (one may still be queued),
      # cancel this run even when the switch failed before it could write its
      # output; otherwise a queued probe can hold the concurrency group forever.
      - name: End this run's stuck probe
        if: always() && steps.switch.outputs.outcome != 'started'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/force-cancel"
