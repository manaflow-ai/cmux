name: Incremental generation canary

on:
  push:
    branches:
      - incgen-canary-20260921
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: incgen-canary-20260921
  cancel-in-progress: true

env:
  BASE_SHA: e6e057975a84b3fef58e4b6fe2e1c9a5b8a37bb1
  CMUX_CI_XCODE_APP: ${{ vars.CMUX_CI_XCODE_APP_MACOS_15 }}
  CMUX_CI_REQUIRED_MACOS_SDK_MAJOR: "26"
  CMUX_SKIP_ZIG_BUILD: "1"

jobs:
  seed:
    name: Seed incremental generation
    runs-on: ${{ vars.MACOS_RUNNER_15 || 'blacksmith-6vcpu-macos-15' }}
    timeout-minutes: 75
    outputs:
      transport_viable: ${{ steps.seed.outputs.transport_viable }}
      generation_archive_bytes: ${{ steps.seed.outputs.generation_archive_bytes }}
    steps:
      - name: Publish canary run locator
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=pending \
            -f context="incgen-canary-run-$GITHUB_RUN_ID" \
            -f description="branch-only incremental-generation benchmark" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Checkout canary harness
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: false

      - name: Select Xcode
        run: ./scripts/select-ci-xcode.sh

      - name: Install Rust
        run: ./scripts/install-rust-ci.sh

      - name: Ensure zstd
        run: command -v zstd >/dev/null || brew install zstd

      - name: Build seed and compress generation
        id: seed
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/incgen-artifacts
        run: |
          set -euo pipefail
          mkdir -p "$ARTIFACT_DIR"
          bash ./scripts/ci/benchmark-xcode-incremental-generation.sh             seed "$BASE_SHA" "$GITHUB_SHA" "$ARTIFACT_DIR"

      - name: Upload seed metrics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: incgen-seed-metrics-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/incgen-artifacts/results.jsonl
            ${{ runner.temp }}/incgen-artifacts/mtime-results.jsonl
            ${{ runner.temp }}/incgen-artifacts/environment.txt
            ${{ runner.temp }}/incgen-artifacts/seed-swift-stat.tsv
            ${{ runner.temp }}/incgen-artifacts/*.log.zst
          if-no-files-found: warn
          retention-days: 1
          compression-level: 0

      - name: Upload generation A
        if: steps.seed.outputs.transport_viable == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: incgen-generation-${{ github.run_id }}
          path: ${{ runner.temp }}/incgen-artifacts/generation-A.tar.zst
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Upload support A
        if: steps.seed.outputs.transport_viable == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: incgen-support-${{ github.run_id }}
          path: ${{ runner.temp }}/incgen-artifacts/support-A.tar.zst
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  consumer:
    name: Replay incremental generation
    needs: seed
    if: needs.seed.outputs.transport_viable == 'true'
    runs-on: ${{ vars.MACOS_RUNNER_15 || 'blacksmith-6vcpu-macos-15' }}
    timeout-minutes: 120
    steps:
      - name: Checkout canary harness
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: false

      - name: Select Xcode
        run: ./scripts/select-ci-xcode.sh

      - name: Install Rust
        run: ./scripts/install-rust-ci.sh

      - name: Ensure zstd
        run: command -v zstd >/dev/null || brew install zstd

      - name: Download seed metrics
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: incgen-seed-metrics-${{ github.run_id }}
          path: ${{ runner.temp }}/incgen-artifacts

      - name: Download generation A
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: incgen-generation-${{ github.run_id }}
          path: ${{ runner.temp }}/incgen-artifacts

      - name: Download support A
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: incgen-support-${{ github.run_id }}
          path: ${{ runner.temp }}/incgen-artifacts

      - name: Replay benchmark matrix
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/incgen-artifacts
        run: |
          set -euo pipefail
          bash ./scripts/ci/benchmark-xcode-incremental-generation.sh             consumer "$BASE_SHA" "$GITHUB_SHA" "$ARTIFACT_DIR"

      - name: Upload replay metrics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: incgen-replay-metrics-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/incgen-artifacts/results.jsonl
            ${{ runner.temp }}/incgen-artifacts/mtime-results.jsonl
            ${{ runner.temp }}/incgen-artifacts/environment.txt
            ${{ runner.temp }}/incgen-artifacts/*.log.zst
          if-no-files-found: warn
          retention-days: 1
          compression-level: 0
