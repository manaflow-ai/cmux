name: cmux-tui channel heal

# Every Linux host's acpmux-update.timer installs what files.cmux.com/cmux-tui/channels/feat-cmux-next.json names,
# every 15 minutes, and only cmux-tui-artifacts.yml's point-feat-channel job moves that file. A run that died (pool
# runner exit 143, a flaky daemon test) held the channel until a person reran it: 2026-11-24/25, a304d6a4 for 13 h
# while about 600 commits landed (Leo, 2026-11-25: "every acpmux fix waits on cmux CI, then the NIGHTLY, then the
# fleet picking up the new acpmux" / "do not catch-22 yourselves"). Every 15 minutes this reads the channel and, when
# its oldest missing feat-cmux-next commit is over HEAL_LAG_MIN (45) minutes old and no artifacts run on
# feat-cmux-next is queued or running, reruns the newest failed run's failed jobs, or dispatches a run on the branch
# (scripts/ci/cmux_tui_channel_heal.py). The point job stays the only writer and moves forward only, to a
# daemon-tested tree. It runs on the repair pool (cmux-gcp-repair-jit-x64), set apart from the build pools.
# vars.CMUX_TUI_CHANNEL_HEAL=0 turns it off.
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the decision only"
        required: false
        default: false
        type: boolean

permissions: {}

concurrency:
  group: cmux-tui-channel-heal
  cancel-in-progress: false

env:
  BASH_ENV: '$({ w="${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh"; t="${RUNNER_TEMP:-/nonexistent}/api-call-log-src"; if [ -f "$w" ]; then echo "$w"; elif [ -n "${RUNNER_TEMP:-}" ]; then if [ ! -f "$t/env.sh" ] && [ ! -e "$t.tried" ] && { [ "${RUNNER_OS:-}" = Linux ] || [ "${RUNNER_OS:-}" = macOS ]; } && [ "$(date -u +%Y%m%d%H)" -lt 2026112300 ]; then : > "$t.tried"; mkdir -p "$t.part" && for x in env.sh gh sitecustomize.py isolated.py; do curl -fsSL --max-time 5 -o "$t.part/$x" "https://raw.githubusercontent.com/manaflow-ai/cmux/27647ffd3ae838c63be28ca3e5883dcd68c34518/scripts/ci/api_call_log/$x" || break; done; [ -s "$t.part/isolated.py" ] && mv "$t.part" "$t"; fi; if [ -f "$t/env.sh" ]; then echo "$t/env.sh"; else echo unset BASH_ENV > "$t.off.sh" && echo "$t.off.sh"; fi; fi; } 2>/dev/null)'

jobs:
  heal:
    name: heal the feat-cmux-next acpmux channel
    if: github.repository == 'manaflow-ai/cmux' && (vars.CMUX_TUI_CHANNEL_HEAL || '1') != '0'
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.CI_REPAIR_SKIP_FLEET != '1' && 'cmux-gcp-repair-jit-x64' || fromJSON(vars.RUNNER_POOLS || '{}').linux_4 || 'ubuntu-24.04' }} # ephemeral-required: holds an actions-write token to rerun or dispatch the artifacts workflow; the repair pool, as cmux-next-package-deps-heal.yml
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: feat-cmux-next
          # The lag is measured in first-parent history; 1500 commits covers more than a day of landings.
          fetch-depth: 1500
          persist-credentials: false

      - name: Read the channel and act once
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: feat-cmux-next
          DRY: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: |
          set -euo pipefail
          git update-ref refs/remotes/origin/feat-cmux-next HEAD
          python3 scripts/ci/cmux_tui_channel_heal.py $DRY | tee -a "$GITHUB_STEP_SUMMARY"
