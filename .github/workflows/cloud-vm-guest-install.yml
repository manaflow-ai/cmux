name: Cloud VM guest installation

on:
  pull_request:
    paths:
      - web/services/vms/drivers/**
      - web/services/vms/guestCli*.ts
      - web/services/vms/guestPrompt.ts
      - web/services/vms/workflows.ts
      - web/services/vms/repository.ts
      - web/services/vms/routeHelpers.ts
      - web/services/vms/vmErrorMessages.ts
      - web/messages/**
      - web/tests/vm-guest-*.test.ts
      - web/tests/fixtures/freestyleGuest.ts
      - web/tests/vm-workflows.test.ts
      - web/package.json
      - web/bun.lock
      - .github/workflows/cloud-vm-guest-install.yml
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: cloud-vm-guest-install-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guest-install:
    runs-on: ${{ vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cmux_test
          POSTGRES_PASSWORD: cmux
          POSTGRES_USER: cmux
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cmux -d cmux_test"
          --health-interval 1s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - name: SDK and guest filesystem regressions
        run: bun test tests/vm-guest-install.test.ts tests/vm-guest-install-runtime.test.ts tests/vm-guest-install-deadline.test.ts tests/vm-guest-create-response.test.ts
      - name: Migrate isolated database
        env:
          DATABASE_URL: postgres://cmux:cmux@localhost:5432/cmux_test
        run: bunx drizzle-kit migrate --config drizzle.config.ts
      - name: Guest provisioning and idempotency in PostgreSQL
        env:
          CMUX_DB_TEST: "1"
          DATABASE_URL: postgres://cmux:cmux@localhost:5432/cmux_test
        run: bun test --timeout=30000 --test-name-pattern 'guest bootstrap|unconfirmed guest' tests/vm-workflows.test.ts
