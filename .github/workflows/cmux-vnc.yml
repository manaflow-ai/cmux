name: CmuxVNC

# The shared RFB (VNC) client engine (Packages/Shared/CmuxVNC): protocol,
# authentication and decoder unit tests, plus end-to-end runs against the
# package's loopback demo server. The cmux-next app and the iOS demo
# (experiments/cmux-vnc-ios) both link it.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - Packages/Shared/CmuxVNC/**
      - scripts/select-ci-xcode.sh
      - scripts/ci/xcode-pins.txt
      - .xcode-version
      - .github/workflows/cmux-vnc.yml
  push:
    branches: [main]
    paths:
      - Packages/Shared/CmuxVNC/**
      - scripts/select-ci-xcode.sh
      - scripts/ci/xcode-pins.txt
      - .xcode-version
      - .github/workflows/cmux-vnc.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmux-vnc-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Temporary REST budget attribution: one gh-call line per GitHub API call (scripts/ci/api_call_log/env.sh, fetched at a fixed commit when the checkout has no copy).
  BASH_ENV: '$({ w="${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh"; t="${RUNNER_TEMP:-/nonexistent}/api-call-log-src"; if [ -f "$w" ]; then echo "$w"; elif [ -n "${RUNNER_TEMP:-}" ]; then if [ ! -f "$t/env.sh" ] && [ ! -e "$t.tried" ] && { [ "${RUNNER_OS:-}" = Linux ] || [ "${RUNNER_OS:-}" = macOS ]; } && [ "$(date -u +%Y%m%d%H)" -lt 2026112300 ]; then : > "$t.tried"; mkdir -p "$t.part" && for x in env.sh gh sitecustomize.py isolated.py; do curl -fsSL --max-time 5 -o "$t.part/$x" "https://raw.githubusercontent.com/manaflow-ai/cmux/27647ffd3ae838c63be28ca3e5883dcd68c34518/scripts/ci/api_call_log/$x" || break; done; [ -s "$t.part/isolated.py" ] && mv "$t.part" "$t"; fi; if [ -f "$t/env.sh" ]; then echo "$t/env.sh"; else echo unset BASH_ENV > "$t.off.sh" && echo "$t.off.sh"; fi; fi; } 2>/dev/null)'

jobs:
  swift-test:
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft != true || contains(github.event.pull_request.labels.*.name, 'full-ci') || (vars.CI_DRAFT_CHEAP_TIER || '1') == '0') }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-6vcpu-macos-15' || github.event_name == 'pull_request' && (vars.MACOS_RUNNER_PR || fromJSON(vars.RUNNER_POOLS).macos_15) || vars.CI_PAID_MACOS_OVERFLOW == '1' && vars.MACOS_RUNNER_15 || fromJSON(vars.RUNNER_POOLS).macos_15) }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Select pinned Xcode
        run: ./scripts/select-ci-xcode.sh
      # The engine's own tests (CmuxVNCTests) run on Linux (scripts/ci/swift-linux-packages.txt); the Mac runs
      # only what needs Apple's network transport, CommonCrypto or a live host.
      - name: Test the RFB engine's Apple integration
        run: swift test --package-path Packages/Shared/CmuxVNC --filter CmuxVNCIntegrationTests
