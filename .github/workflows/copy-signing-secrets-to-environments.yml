name: Copy signing secrets to environments (one-shot)

# One-shot migration. The release signing material is stored as repository
# secrets, which any workflow on any pushed branch can read. This workflow copies
# the values into the protected `release` and `release-next` environments without
# exposing them: each value is encrypted on the runner with the environment's
# libsodium public key (sealed box) and only the ciphertext leaves the job, as a
# 1-day artifact. An admin then PUTs the ciphertext with
# `gh api -X PUT repos/manaflow-ai/cmux/environments/<env>/secrets/<name>`.
# Only GitHub holds the environment private keys, so the ciphertext reveals nothing.
#
# The public keys are pinned below and never come from an input: an input key
# would let anyone who can dispatch this workflow decrypt the values.
# Delete this workflow after the copy.

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: copy-signing-secrets-to-environments
  cancel-in-progress: false

env:
  # GET repos/manaflow-ai/cmux/environments/<env>/secrets/public-key, 2026-10-09.
  RELEASE_KEY_ID: "3380204578043523366"
  RELEASE_PUBLIC_KEY: "Gpf4i8CZaZMi76KGQZtNaC4tRxhxABHqWS02FaBWVnI="
  RELEASE_NEXT_KEY_ID: "3380204578043523366"
  RELEASE_NEXT_PUBLIC_KEY: "fDSefNYl+1U3aWewge4/qvzPdWzjxtKItqdqxorQyHg="

jobs:
  signing:
    # Reads the repository copies. The release environment holds none of these
    # names yet, so each value resolves from repository level.
    if: github.ref == 'refs/heads/main'
    environment: release
    runs-on: blacksmith-4vcpu-ubuntu-2404 # ephemeral VM, one job per machine
    timeout-minutes: 10
    steps:
      - name: Install libsodium bindings from the Ubuntu archive
        run: |
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq --no-install-recommends python3-nacl >/dev/null

      - name: Encrypt for release and release-next
        env:
          TARGETS: >-
            {"release": ["APPLE_CERTIFICATE_BASE64", "APPLE_CERTIFICATE_PASSWORD",
              "ASC_API_KEY_ID", "ASC_API_ISSUER_ID", "ASC_API_KEY_P8_BASE64",
              "SPARKLE_PRIVATE_KEY", "NIGHTLY_SPARKLE_PRIVATE_KEY", "HOMEBREW_TAP_TOKEN",
              "IOS_DISTRIBUTION_CERTIFICATE_BASE64", "IOS_DISTRIBUTION_CERTIFICATE_PASSWORD",
              "IOS_PROD_PROVISIONING_PROFILE_BASE64", "IOS_BETA_PROVISIONING_PROFILE_BASE64",
              "IOS_BETA_PROVISIONING_PROFILE_INTERNAL_BASE64",
              "IOS_BETA_EXTENSION_PROVISIONING_PROFILE_BASE64"],
             "release-next": ["APPLE_CERTIFICATE_BASE64", "APPLE_CERTIFICATE_PASSWORD",
              "ASC_API_KEY_ID", "ASC_API_ISSUER_ID", "ASC_API_KEY_P8_BASE64"]}
          S_APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          S_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          S_ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          S_ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          S_ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          S_SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          S_NIGHTLY_SPARKLE_PRIVATE_KEY: ${{ secrets.NIGHTLY_SPARKLE_PRIVATE_KEY }}
          S_HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          S_IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          S_IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          S_IOS_PROD_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROD_PROVISIONING_PROFILE_BASE64 }}
          S_IOS_BETA_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_BETA_PROVISIONING_PROFILE_BASE64 }}
          S_IOS_BETA_PROVISIONING_PROFILE_INTERNAL_BASE64: ${{ secrets.IOS_BETA_PROVISIONING_PROFILE_INTERNAL_BASE64 }}
          S_IOS_BETA_EXTENSION_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_BETA_EXTENSION_PROVISIONING_PROFILE_BASE64 }}
        run: |
          /usr/bin/python3 -I - <<'PY'
          import base64, json, os, sys
          from nacl.public import PublicKey, SealedBox
          keys = {
              "release": (os.environ["RELEASE_KEY_ID"], os.environ["RELEASE_PUBLIC_KEY"]),
              "release-next": (os.environ["RELEASE_NEXT_KEY_ID"], os.environ["RELEASE_NEXT_PUBLIC_KEY"]),
          }
          out, missing = [], []
          for environment, names in json.loads(os.environ["TARGETS"]).items():
              key_id, key = keys[environment]
              box = SealedBox(PublicKey(base64.b64decode(key)))
              for name in names:
                  value = os.environ.get("S_" + name, "")
                  if not value:
                      missing.append(f"{environment}/{name}")
                      continue
                  out.append({"environment": environment, "name": name, "key_id": key_id,
                              "encrypted_value": base64.b64encode(box.encrypt(value.encode())).decode()})
          with open("ciphertexts.json", "w") as f:
              json.dump(out, f)
          print(f"encrypted {len(out)} values; empty (not copied): {missing or 'none'}")
          sys.exit(1 if missing else 0)
          PY

      - name: Upload ciphertext only
        if: ${{ !cancelled() && hashFiles('ciphertexts.json') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signing-ciphertexts
          path: ciphertexts.json
          retention-days: 1

  cache-writer:
    # The R2 cache write credentials live only in ci-cache-writer. The iOS upload
    # jobs now enter release, so release needs its own copy.
    if: github.ref == 'refs/heads/main'
    environment: ${{ github.ref == 'refs/heads/main' && 'ci-cache-writer' || '' }}
    runs-on: blacksmith-4vcpu-ubuntu-2404 # ephemeral VM, one job per machine
    timeout-minutes: 10
    steps:
      - name: Install libsodium bindings from the Ubuntu archive
        run: |
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq --no-install-recommends python3-nacl >/dev/null

      - name: Encrypt for release
        env:
          S_CI_CACHE_R2_ACCESS_KEY_ID: ${{ secrets.CI_CACHE_R2_ACCESS_KEY_ID }}
          S_CI_CACHE_R2_ACCOUNT_ID: ${{ secrets.CI_CACHE_R2_ACCOUNT_ID }}
          S_CI_CACHE_R2_SECRET_ACCESS_KEY: ${{ secrets.CI_CACHE_R2_SECRET_ACCESS_KEY }}
        run: |
          /usr/bin/python3 -I - <<'PY'
          import base64, json, os, sys
          from nacl.public import PublicKey, SealedBox
          key_id, key = os.environ["RELEASE_KEY_ID"], os.environ["RELEASE_PUBLIC_KEY"]
          box = SealedBox(PublicKey(base64.b64decode(key)))
          out, missing = [], []
          for name in ("CI_CACHE_R2_ACCESS_KEY_ID", "CI_CACHE_R2_ACCOUNT_ID", "CI_CACHE_R2_SECRET_ACCESS_KEY"):
              value = os.environ.get("S_" + name, "")
              if not value:
                  missing.append(name)
                  continue
              out.append({"environment": "release", "name": name, "key_id": key_id,
                          "encrypted_value": base64.b64encode(box.encrypt(value.encode())).decode()})
          with open("ciphertexts.json", "w") as f:
              json.dump(out, f)
          print(f"encrypted {len(out)} values; empty (not copied): {missing or 'none'}")
          sys.exit(1 if missing else 0)
          PY

      - name: Upload ciphertext only
        if: ${{ !cancelled() && hashFiles('ciphertexts.json') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cache-ciphertexts
          path: ciphertexts.json
          retention-days: 1
