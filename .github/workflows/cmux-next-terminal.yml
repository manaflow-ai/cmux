name: cmux-next terminal suites

# The terminal stack's own tests on every feat-cmux-next push that touches it
# (2026-10-20, terminal parity audit). Before this workflow none of them ran on a push:
# - ghostty-vt (libghostty-vt from ghostty-next): the VT, tmux regress
#   (tmux_conformance.rs, ported from tmux regress/), kitty graphics, unicode and
#   corpus suites, with ghostty-vt-sys, cmux-pty, cmux-terminal-sizing,
#   cmux-terminal-client and cmux-encode (the crates of
#   scripts/ci/cmux-tui-rust-check.sh terminal, which a fleet step runs by hand).
# - the shared Swift terminal packages (CmuxTerminalSizing, CmuxTerminalStream),
#   which ci-macos.yml tests on pull requests only.
# The Linux jobs run on Blacksmith 32 vCPU: the crates except cmux-pty (OS-specific
# code) and one test whose golden digests were recorded on macOS, and the two
# pure-Swift packages' tests. The Mac job keeps what Linux cannot stand in for:
# cmux-pty and that corpus test. It runs on the owned Mac minis
# (CI_SIDE_LANE_RUNNER, as cmux-tui.yml's macOS job); without that variable it
# skips.

on:
  push:
    branches: [feat-cmux-next]
    paths:
      - ghostty-next
      - cmux-tui/crates/ghostty-vt/**
      - cmux-tui/crates/ghostty-vt-sys/**
      - cmux-tui/crates/cmux-pty/**
      - cmux-tui/crates/cmux-terminal-sizing/**
      - cmux-tui/crates/cmux-terminal-client/**
      - cmux-tui/crates/cmux-encode/**
      - cmux-tui/Cargo.lock
      - schemas/terminal-corpus/**
      - Packages/Shared/CmuxTerminalSizing/**
      - Packages/Shared/CmuxTerminalStream/**
      - .github/workflows/cmux-next-terminal.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmux-next-terminal-${{ github.ref }}
  cancel-in-progress: true

jobs:

  rust-terminal-linux:
    name: terminal crates (portable)
    if: github.repository_owner == 'manaflow-ai'
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-4vcpu-ubuntu-2404' || fromJSON(vars.RUNNER_POOLS).linux }}
    timeout-minutes: 40
    env:
      GHOSTTY_ZIG_SOURCE: ghostty-next
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Init ghostty-next
        run: git submodule update --init --depth 1 ghostty-next

      - name: Install zig
        run: ./scripts/install-zig-ci.sh

      - name: Fetch the ghostty-next Zig packages (cached, deadlined, retried)
        uses: ./.github/actions/ghostty-zig-packages

      - name: Set up pinned Rust
        uses: ./.github/actions/setup-cmux-tui-rust

      # terminal_corpus_snapshots_encode_ready_and_complete compares digests recorded on
      # macOS and fails on Linux; the Mac job below runs it.
      # ZIG: ghostty-vt-sys's build.rs runs $ZIG before the zig on PATH.
      - name: cargo test (terminal crates)
        working-directory: cmux-tui
        run: |
          export ZIG="$CMUX_ZIG"
          cargo test --locked --no-fail-fast \
            -p ghostty-vt -p ghostty-vt-sys -p cmux-terminal-sizing \
            -p cmux-terminal-client -p cmux-encode \
            -- --skip terminal_corpus_snapshots_encode_ready_and_complete

  swift-terminal-linux:
    name: Swift terminal packages (portable)
    if: github.repository_owner == 'manaflow-ai'
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-4vcpu-ubuntu-2404' || fromJSON(vars.RUNNER_POOLS).linux }}
    timeout-minutes: 30
    container: swift:6.2-noble
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: swift test (terminal packages)
        run: |
          status=0
          for package in CmuxTerminalSizing CmuxTerminalStream; do
            echo "::group::$package"
            swift test --package-path "Packages/Shared/$package" || { echo "::error::$package failed"; status=1; }
            echo "::endgroup::"
          done
          exit "$status"

  rust-terminal:
    name: terminal crates (cmux-pty and corpus snapshot, macOS)
    if: github.repository_owner == 'manaflow-ai' && vars.CI_SIDE_LANE_RUNNER != ''
    # The bot's third attempt leaves the minis, as in ci-macos.yml, so a refused run cannot loop there.
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || (github.run_attempt <= 2 || !contains(fromJSON('["github-actions[bot]","cmux-bot[bot]"]'), github.triggering_actor)) && vars.CI_SIDE_LANE_RUNNER || fromJSON(vars.RUNNER_POOLS).macos_26 }}
    timeout-minutes: 40
    env:
      GHOSTTY_ZIG_SOURCE: ghostty-next
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # A mini reuses its workspace: drop submodule checkouts a previous job left.
      - name: Drop stale submodule checkouts (self-hosted reused workspace)
        run: scripts/ci/reset-stale-submodules.sh

      - name: Use short temporary directory for macOS socket tests
        run: echo "TMPDIR=/tmp" >> "$GITHUB_ENV"

      # Zig and cargo find the macOS SDK through xcrun, so the selected Xcode's, on any runner.
      - name: Select Xcode
        run: ./scripts/select-ci-xcode.sh

      - name: Init ghostty-next
        run: git submodule update --init --depth 1 ghostty-next

      - name: Install zig
        run: ./scripts/install-zig-ci.sh

      - name: Fetch the ghostty-next Zig packages (cached, deadlined, retried)
        uses: ./.github/actions/ghostty-zig-packages

      - name: Set up pinned Rust
        uses: ./.github/actions/setup-cmux-tui-rust

      # ZIG: setup-cmux-tui-rust puts ~/.cargo/bin ahead of the installed Zig on PATH,
      # and a mini's ~/.cargo/bin/zig can be an older Zig (cmux10: 0.16.0, so every
      # run since ghostty-next's 0.17 sync failed in ghostty-vt-sys). ghostty-vt-sys's
      # build.rs runs $ZIG first, so it gets the Zig install-zig-ci.sh verified.
      - name: cargo test (cmux-pty, corpus snapshot with macOS digests)
        working-directory: cmux-tui
        run: |
          export ZIG="$CMUX_ZIG"
          "$ZIG" version
          cargo test --locked --no-fail-fast -p cmux-pty
          cargo test --locked -p ghostty-vt --test terminal_corpus
