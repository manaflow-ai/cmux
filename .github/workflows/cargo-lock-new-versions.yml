name: cargo lock new versions

# A changed Cargo.lock may use only (crate, version) pairs some base Cargo.lock already has,
# unless the pull request body has a `Cargo-Lock-New-Versions: <why>` line. #42155 called itself
# a version alignment that added none and added seven; review could only take its word for it.
# The logic and its tests are scripts/ci/cargo-lock-new-versions (Rust, no dependencies).
# Runs only when a Cargo.lock changes; `edited` re-runs it when the body gains the line.

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    paths:
      - "**/Cargo.lock"
      - "scripts/ci/cargo-lock-new-versions/**"
      - ".github/workflows/cargo-lock-new-versions.yml"

concurrency:
  group: cargo-lock-new-versions-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: changed Cargo.lock adds no crate version absent from base
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-2vcpu-ubuntu-2404' || fromJSON(vars.RUNNER_POOLS).linux_2 }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # The merge commit's first parent is the base it was made on.
      - name: Fetch the base
        id: base
        run: |
          BASE_SHA=$(git cat-file -p HEAD | awk '/^parent /{print $2; exit}')
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          echo "sha=$BASE_SHA" >> "$GITHUB_OUTPUT"

      - name: Set up pinned Rust
        uses: ./.github/actions/setup-cmux-tui-rust

      - name: Every changed Cargo.lock uses only base crate versions
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          cargo run --quiet --locked --manifest-path scripts/ci/cargo-lock-new-versions/Cargo.toml -- --base "$BASE_SHA"
