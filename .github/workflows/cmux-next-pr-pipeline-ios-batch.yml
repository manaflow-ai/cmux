name: cmux-next pr pipeline ios batch

# Every step of pr-pipeline.yml's `ios` job (ci/steps.toml: ios-kit-macos, ios-kit, ios-phone-cells) at one
# feat-cmux-next commit, in the post-merge batch (cmux-next-post-merge.yml, suite pr-pipeline-ios).
#
# Leo, 2026-11-21: "we need to absolutely get that f***ing CI V2, that Borg design up and running everywhere."
# A pull request no longer routes the ios job (scripts/ci/pr_router.json), and the push runs of
# cmux-next-ios-kit.yml and ios-reliability-matrix.yml ran the same checks once a merge, outside the table. They
# run here instead, once a batch window and only when the window touched an ios step's inputs (the suite's paths in
# .github/post-merge-batch.json; tests/test_ci_post_merge_batch.py keeps them the steps' inputs), at the merged tip,
# where the batch's judge bisects a new red to its commit. The machines are pr-pipeline.yml's: ios-runner picks the
# simulator Mac (scripts/ci/ios_runner_pool.py, lane pipeline) and `ios macos` takes the mac job's pool, so the
# batch adds no Mac pool of its own. The steps run are the ones the window's changed paths reach (inputs.base..sha, as
# the push runs were path-filtered); with no base every ios step runs. A step whose inputs this tree already passed is
# reused from the step-result store. A dispatch runs this by hand.

on:
  workflow_call:
    inputs:
      sha:
        description: "The commit to test (the post-merge batch's tip or a bisect probe's commit). Empty: the event's own."
        type: string
        default: ""
      only:
        description: "The one job id to run (a bisect probe): ios (the picker and both legs: ios-kit reads the macOS leg's verdict). Empty: every job."
        type: string
        default: ""
      base:
        description: "The commit the window starts after (the post-merge batch's plan base, or a bisect probe's known-good commit): the steps run are the ones base..sha reaches. Empty: every step."
        type: string
        default: ""
  workflow_dispatch:

permissions: {}

concurrency:
  group: cmux-next-pr-pipeline-ios-batch${{ inputs.sha && format('-{0}-{1}', inputs.sha, inputs.only) || format('-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  # pr-pipeline.yml's ios-runner: an idle owned simulator Mac first, Blacksmith macOS 26 on a re-run. The markers let
  # the pool charge this run's simulator while it holds one. It reads with the job token (no App token here).
  ios-runner:
    name: ios runner
    if: ${{ (inputs.only == '' || inputs.only == 'ios') && github.repository == 'manaflow-ai/cmux' }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.CI_OVERFLOW_LINUX || 'cmux-linux' }}
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      runs_on: ${{ steps.pool.outputs.runs_on }}
      retry_runs_on: ${{ steps.pool.outputs.retry_runs_on }}
      label: ${{ steps.pool.outputs.label }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        timeout-minutes: 5
        with:
          ref: ${{ inputs.sha || '' }}
          sparse-checkout: |
            scripts/ci/ios_runner_pool.py
            scripts/ci/e2e_runner_pool.py
            scripts/ci/pr_runner_pool.py
            scripts/ci/github_spend.py
            scripts/ci/simple_pool_picker.py
            scripts/ci/deadline_http.py
            scripts/ci/warm_distance.py
            .gitmodules
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Pick the macOS pool
        id: pool
        env:
          CI_RUNNER_STATE: ${{ vars.CI_RUNNER_STATE }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUNNER_VARIABLE: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || vars.MACOS_RUNNER_TESTS || vars.MACOS_RUNNER_IOS }}
          IOS_OWNED: ${{ vars.CI_IOS_OWNED }}
          POOL_OWNED: ${{ vars.CI_PR_POOL_OWNED }}
          OWNED_SLOTS: ${{ vars.CI_OWNED_POOL_SLOTS }}
          POOL_ORDER: ${{ vars.CI_PR_POOL_ORDER }}
          POOL_MAX_QUEUED: ${{ vars.CI_PR_POOL_MAX_QUEUED }}
        run: |
          set -euo pipefail
          python3 scripts/ci/ios_runner_pool.py \
            --lane pipeline --fork false --requested auto \
            --variable "$RUNNER_VARIABLE" --ios-owned "$IOS_OWNED" --owned "$POOL_OWNED" \
            --owned-slots "$OWNED_SLOTS" --pr-xcode-app "" --order "$POOL_ORDER" \
            --max-queued "$POOL_MAX_QUEUED" --queue-rounds 0 \
            --device-family iphone | tee -a "$GITHUB_OUTPUT"
      - name: Create the owned-pool marker
        id: marker
        if: steps.pool.outputs.persistent == 'true' && github.run_attempt == 1
        continue-on-error: true
        run: |
          set -euo pipefail
          marker="$RUNNER_TEMP/macos-pool-persistent.json"
          echo '{}' > "$marker"
          echo "path=$marker" >> "$GITHUB_OUTPUT"
      - name: Upload the persistent pool marker
        if: steps.marker.outputs.path != ''
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-pool-persistent-${{ github.run_id }}-${{ github.run_attempt }}-1-${{ steps.pool.outputs.label }}
          path: ${{ steps.marker.outputs.path }}
          retention-days: 1
      - name: Upload the simulator capacity marker
        if: steps.marker.outputs.path != ''
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-pool-persistent-${{ github.run_id }}-${{ github.run_attempt }}-1-glaeda-ios-sim
          path: ${{ steps.marker.outputs.path }}
          retention-days: 1
      - name: Upload the owned-pool watch marker
        if: steps.marker.outputs.path != ''
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: owned-pool-watch
          path: ${{ steps.marker.outputs.path }}
          retention-days: 1

  # pr-pipeline.yml's ios job: every ios step but ios-kit-macos, on the Mac ios-runner picked, one iPhone simulator.
  # The fleet pool's simulator steps are pull-request only there and are left out here.
  ios:
    name: ios
    needs: [ios-runner]
    if: ${{ (inputs.only == '' || inputs.only == 'ios') && github.repository == 'manaflow-ai/cmux' }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || fromJSON(github.run_attempt > 1 && needs.ios-runner.outputs.retry_runs_on || needs.ios-runner.outputs.runs_on) }}
    # pr-pipeline.yml's bound for the same job.
    timeout-minutes: 170
    permissions:
      contents: read
      # ci/run's step-result store (gh-events.cmux.com/github/step-results): the runner pool is off the tailnet.
      id-token: write
      # ios-kit reads the `ios macos` job's verdict (scripts/ci/ios_macos_leg.py).
      actions: read
    steps:
      - name: Checkout the commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.sha || '' }}
          persist-credentials: false
          fetch-depth: 2
          submodules: false
          # An owned Mac reuses its workspace: keep the ignored cargo target, so the xcframework builds incrementally.
          clean: false
      # The paths base..sha changed (the batch window, or a probe's range from its known-good commit), for ci/run's
      # route. No base, or one this checkout cannot fetch, is an unknown change: every step runs.
      - name: List the paths the window changed
        if: ${{ inputs.base != '' }}
        timeout-minutes: 5
        continue-on-error: true
        env:
          BASE: ${{ inputs.base }}
          TOKEN: ${{ github.token }}
        run: |
          # GitHub 403s anonymous fetches from the office Macs' address: the fetch sends the job token.
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')
          if [[ "$BASE" =~ ^[0-9a-f]{40}$ ]] \
            && GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" \
              git fetch --no-tags --no-recurse-submodules --depth=1 origin "$BASE" \
            && git diff --name-only --no-renames -z "$BASE" HEAD > "$RUNNER_TEMP/changed-paths.txt"; then
            echo "PATHS_FILE=$RUNNER_TEMP/changed-paths.txt" >> "$GITHUB_ENV"
            echo "$(tr -cd '\0' < "$RUNNER_TEMP/changed-paths.txt" | wc -c | tr -d ' ') paths changed since $BASE"
          else
            echo "::notice::No window base to diff ('$BASE'): every step runs."
          fi
      # A reused workspace keeps what earlier jobs left untracked; the ignored builds stay.
      - name: Drop untracked leftovers (self-hosted reused workspace)
        run: git clean -ffd
      # owned_pool_rescue.py reads this step by name.
      - name: Select Xcode
        run: ./scripts/select-ci-xcode.sh
      # GitHub 403s anonymous fetches from the office Macs' address; xcodebuild's SwiftPM clones send the job token.
      - name: Authenticate github.com fetches with the job token
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/github_fetch_auth.py
      # Every routed ios step but ios-kit-macos, which the `ios macos` job runs; `none` names no step.
      - name: Run the routed ios steps (ci/steps.toml)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          only="$(ci/run route ${PATHS_FILE:+--paths-file "$PATHS_FILE"} | python3 -I -c 'import json, sys
          print(" ".join(n for n in json.load(sys.stdin).get("ios", []) if n != "ios-kit-macos") or "none")')"
          ci/run run --job ios ${PATHS_FILE:+--paths-file "$PATHS_FILE"} --only "$only"

  # pr-pipeline.yml's `ios macos` job: the kit's macOS swift test (ios-kit-macos) beside the simulator leg, on
  # Blacksmith's macOS when vars.CI_BLACKSMITH_MACOS is on, else the mac job's pool. ios-kit reads its verdict by
  # this job's name (a caller's `<suite> / ios macos` too).
  ios-macos:
    name: ios macos
    if: ${{ (inputs.only == '' || inputs.only == 'ios') && github.repository == 'manaflow-ai/cmux' }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || vars.CI_BLACKSMITH_MACOS == 'on' && 'blacksmith-6vcpu-macos-26' || vars.CI_OVERFLOW_MAC || 'cmux-mac' }}
    # pr-pipeline.yml's bound for the same job.
    timeout-minutes: 70
    permissions:
      contents: read
      # ci/run's step-result store (gh-events.cmux.com/github/step-results): the runner pool is off the tailnet.
      id-token: write
    env:
      CMUX_CI_XCODE_APP: ${{ vars.CMUX_CI_XCODE_APP_MACOS_26 }}
      CMUX_CI_REQUIRED_MACOS_SDK_MAJOR: "26"
    steps:
      - name: Checkout the commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.sha || '' }}
          persist-credentials: false
          fetch-depth: 2
          submodules: false
          # An owned Mac reuses its workspace: keep the ignored cargo target, so the xcframework builds incrementally.
          clean: false
      # The paths base..sha changed (the batch window, or a probe's range from its known-good commit), for ci/run's
      # route. No base, or one this checkout cannot fetch, is an unknown change: every step runs.
      - name: List the paths the window changed
        if: ${{ inputs.base != '' }}
        timeout-minutes: 5
        continue-on-error: true
        env:
          BASE: ${{ inputs.base }}
          TOKEN: ${{ github.token }}
        run: |
          # GitHub 403s anonymous fetches from the office Macs' address: the fetch sends the job token.
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')
          if [[ "$BASE" =~ ^[0-9a-f]{40}$ ]] \
            && GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" \
              git fetch --no-tags --no-recurse-submodules --depth=1 origin "$BASE" \
            && git diff --name-only --no-renames -z "$BASE" HEAD > "$RUNNER_TEMP/changed-paths.txt"; then
            echo "PATHS_FILE=$RUNNER_TEMP/changed-paths.txt" >> "$GITHUB_ENV"
            echo "$(tr -cd '\0' < "$RUNNER_TEMP/changed-paths.txt" | wc -c | tr -d ' ') paths changed since $BASE"
          else
            echo "::notice::No window base to diff ('$BASE'): every step runs."
          fi
      # A reused workspace keeps what earlier jobs left untracked; the ignored builds stay.
      - name: Drop untracked leftovers (self-hosted reused workspace)
        run: git clean -ffd
      - name: Select Xcode
        run: ./scripts/select-ci-xcode.sh
      - name: Run the kit's macOS swift test (ci/steps.toml ios-kit-macos)
        run: ci/run run --job ios ${PATHS_FILE:+--paths-file "$PATHS_FILE"} --only ios-kit-macos
