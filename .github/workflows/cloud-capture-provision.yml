name: Cloud capture account provision

# Makes (or finds) the staging Cloud test account the team's Cloud capture runs sign in as, gives it a
# fresh random password and the `pro` operator plan, and seals the email and password to the capture
# environment's GitHub public key (scripts/ci/cloud_capture_provision.py). The run publishes only that
# ciphertext (artifact `sealed-secrets`, 1 day); only GitHub can open it. A maintainer then stores it with
# `python3 scripts/ci/sealed_secrets.py put sealed-secrets.json` (docs/ci-sealed-secrets.md).
#
# The password exists only inside the Provision step: masked as soon as it is made, sent to Stack, sealed
# and dropped. Every run is a rotation, so rerunning is how the credential is replaced.
#
# With `target: production`, the same steps make the production test account (cmux-cloud-capture-prod@manaflow.dev)
# in the PRODUCTION Stack project with environment cloud-vm-production's server key (that environment admits
# feat-cmux-next), sealed to cmuxterm-hq cloud-capture as CLOUD_PROBE_PRODUCTION_STACK_EMAIL and _PASSWORD for the
# hourly production Cloud chat probe (cmuxterm-hq synthetic-probes.yml app-chat-production). The log names the
# account's Stack user id (not a secret). grant_email never runs against production.
#
# With `target: production-team`, the same for a second production account (cmux-cloud-capture-prod-team@manaflow.dev),
# sealed to cmuxterm-hq cloud-capture as CLOUD_PROBE_PRODUCTION_TEAM_STACK_EMAIL and _PASSWORD: the probe's shared-team
# row (cmuxterm-hq cloud-chat-replies-production-team), which joins a shared team the probe account must stay out of.
# The run also makes that account a member of the company team "cmux" with the production server key and reads the
# membership back (no hand invitation, and no person's account standing in). `team_only: true` with that target does
# only the membership step: no rotation, nothing sealed or uploaded, and the account must already exist.
#
# With `target: journey-production`, the same for the production Cloud journey's own account
# (cmux-cloud-capture-journey-prod@manaflow.dev), sealed to this repository's cmux-next-cloud-journey environment as
# CMUX_DOGFOOD_STACK_EMAIL and _PASSWORD (cloud-journey-prod.yml and backend.yml journey-production).
#
# With `target: journey-guest`, the same steps make the second staging account (cmux-cloud-capture-guest@manaflow.dev,
# "Capture Guest"), sealed to this repository's cmux-next-vm-image-dev environment as CMUX_DOGFOOD_GUEST_STACK_EMAIL
# and _PASSWORD: the guest side of two-account tests such as a chat share (cloud-chat-proof.yml signin_account).
#
# With `target: platform-staging` or `platform-production`, cmux-platform's own journey accounts
# (cmux-cloud-capture-platform@ and -platform-prod@manaflow.dev), sealed to manaflow-ai/cmux-platform's repository
# secrets (no environment) as CMUX_DOGFOOD_STACK_* and CMUX_JOURNEY_PROD_STACK_*: the journeys after its deploys.
# `put` then needs write access to that repository's secrets.
#
# With `probe_teams: N` (target capture), the run only makes sure the staging capture account is the only member of N
# probe teams ("cmux probe team K (test accounts only)"), each with the team operator grant: the teams a concurrent-create
# probe spreads its creates over (cmuxterm-hq platform_probe.py "teams"; 3x10 needs 2, 5x10 needs 4). A rerun finds
# the teams it made and makes no more; nothing is rotated, sealed or uploaded.
#
# With `grant_email` set, the run only gives that existing capture test account (cmux-cloud-capture…@manaflow.dev,
# e.g. the no-team owner account) the `pro` operator plan: no password change, nothing sealed or uploaded.

on:
  workflow_dispatch:
    inputs:
      grant_email:
        description: Only grant the pro operator plan to this existing capture test account (no rotation, no bundle)
        required: false
        default: ""
      target:
        description: "capture: the staging capture account. production: the production probe account. production-team: the production probe's shared-team account. journey-production: the production Cloud journey's account (both cloud-vm-production). journey-guest: the second staging account for two-account tests. platform-staging, platform-production: cmux-platform's deploy journeys"
        type: choice
        options: [capture, production, production-team, journey-production, journey-guest, platform-staging, platform-production]
        default: capture
      team_only:
        description: "With target production-team: only make the existing account a member of the company team (no rotation, no bundle)"
        type: boolean
        required: false
        default: false
      probe_teams:
        description: "With target capture: only make sure the capture account is the only member of this many probe teams, each granted the team plan (0 = off; 4 lets a 5x10 probe run; no rotation, no bundle)"
        type: number
        required: false
        default: 0

permissions:
  contents: read

concurrency:
  group: cloud-capture-provision
  cancel-in-progress: false

jobs:
  provision:
    # The staging server key is handed only to feat-cmux-next's own code.
    if: github.ref == 'refs/heads/feat-cmux-next'
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.LINUX_RUNNER || fromJSON(vars.RUNNER_POOLS).linux_4 }}
    # Each target's own server key: the script refuses a key whose project is not the target's.
    environment: ${{ (inputs.target == 'production' || inputs.target == 'production-team' || inputs.target == 'journey-production' || inputs.target == 'platform-production') && 'cloud-vm-production' || 'cloud-vm-staging' }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # The dispatched commit itself, never a later tip: the server key goes only to code that was reviewed.
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: scripts/ci
          sparse-checkout-cone-mode: true

      - name: libsodium
        if: inputs.grant_email == '' && !inputs.team_only && inputs.probe_teams == 0
        run: |
          set -euo pipefail
          if ! ldconfig -p | grep -q 'libsodium\.so\.23'; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends libsodium23
          fi

      - name: Grant the operator plan only
        if: inputs.probe_teams == 0 && inputs.grant_email != '' && inputs.target != 'production' && inputs.target != 'production-team' && inputs.target != 'journey-production' && inputs.target != 'platform-production'
        env:
          NEXT_PUBLIC_STACK_PROJECT_ID: ${{ vars.NEXT_PUBLIC_STACK_PROJECT_ID }}
          NEXT_PUBLIC_STACK_PUBLISHABLE_CLIENT_KEY: ${{ vars.NEXT_PUBLIC_STACK_PUBLISHABLE_CLIENT_KEY }}
          STACK_SECRET_SERVER_KEY: ${{ secrets.STACK_SECRET_SERVER_KEY }}
          GRANT_EMAIL: ${{ inputs.grant_email }}
        run: python3 scripts/ci/cloud_capture_provision.py --grant-only "$GRANT_EMAIL"

      - name: Join the company team only
        if: inputs.probe_teams == 0 && inputs.grant_email == '' && inputs.team_only
        env:
          NEXT_PUBLIC_STACK_PROJECT_ID: ${{ vars.NEXT_PUBLIC_STACK_PROJECT_ID }}
          NEXT_PUBLIC_STACK_PUBLISHABLE_CLIENT_KEY: ${{ vars.NEXT_PUBLIC_STACK_PUBLISHABLE_CLIENT_KEY }}
          STACK_SECRET_SERVER_KEY: ${{ secrets.STACK_SECRET_SERVER_KEY }}
          TARGET: ${{ inputs.target || 'capture' }}
        run: python3 scripts/ci/cloud_capture_provision.py --target "$TARGET" --team-only

      - name: Make the probe teams only
        if: inputs.probe_teams > 0 && inputs.grant_email == '' && !inputs.team_only
        env:
          NEXT_PUBLIC_STACK_PROJECT_ID: ${{ vars.NEXT_PUBLIC_STACK_PROJECT_ID }}
          NEXT_PUBLIC_STACK_PUBLISHABLE_CLIENT_KEY: ${{ vars.NEXT_PUBLIC_STACK_PUBLISHABLE_CLIENT_KEY }}
          STACK_SECRET_SERVER_KEY: ${{ secrets.STACK_SECRET_SERVER_KEY }}
          TARGET: ${{ inputs.target || 'capture' }}
          PROBE_TEAMS: ${{ inputs.probe_teams }}
        run: python3 scripts/ci/cloud_capture_provision.py --target "$TARGET" --probe-teams "$PROBE_TEAMS"

      - name: Provision and seal
        if: inputs.grant_email == '' && !inputs.team_only && inputs.probe_teams == 0
        env:
          NEXT_PUBLIC_STACK_PROJECT_ID: ${{ vars.NEXT_PUBLIC_STACK_PROJECT_ID }}
          NEXT_PUBLIC_STACK_PUBLISHABLE_CLIENT_KEY: ${{ vars.NEXT_PUBLIC_STACK_PUBLISHABLE_CLIENT_KEY }}
          STACK_SECRET_SERVER_KEY: ${{ secrets.STACK_SECRET_SERVER_KEY }}
          TARGET: ${{ inputs.target || 'capture' }}
        run: python3 scripts/ci/cloud_capture_provision.py --target "$TARGET" --out "$RUNNER_TEMP/sealed-secrets.json"

      - name: Upload the sealed bundle (ciphertext only)
        if: inputs.grant_email == '' && !inputs.team_only && inputs.probe_teams == 0
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sealed-secrets
          path: ${{ runner.temp }}/sealed-secrets.json
          retention-days: 1
          if-no-files-found: error
