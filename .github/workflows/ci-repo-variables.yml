name: CI repository variables

# `gh variable set` changes CI routing with no pull request, so no PR check
# ever sees the new value, and the readers fail soft: a malformed
# CI_OWNED_POOL_SLOTS counts as zero minis, a forbidden runner label is refused
# at dispatch. scripts/ci/check_repo_variables.py runs the readers' own
# validators against the live values and fails this run on a bad one. The
# schedule is what catches a `gh variable set`; the push trigger covers edits
# to the check itself. No pull_request trigger: a fork's run would read these
# variables in fork code, and tests/test_ci_check_repo_variables.py (in the
# guard suite) covers a PR that edits the check.
#
# Values come from the expression context (no token scope can read the
# variables API), named one by one: a step's env is printed in its public log,
# and only runner labels and pool sizes belong there, as in ci-health-report.yml.
# tests/test_ci_check_repo_variables.py keeps this list equal to that one.

on:
  schedule:
    - cron: "*/15 * * * *"
  push:
    branches: [main]
    paths:
      - .github/workflows/ci-repo-variables.yml
      - scripts/ci/check_repo_variables.py
      - scripts/ci/cloud_overflow_switch.py
      - scripts/ci/pr_runner_pool.py
      - scripts/ci/runner_label_policy.py
      - scripts/ci/runs_on_values.py
      - scripts/ci/signing_runner_variables.py
      - scripts/ci/python-with-yaml.sh
      - scripts/ci/runner_pools.py
      - .github/runners.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-repo-variables-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check repository variables
    if: ${{ github.repository == 'manaflow-ai/cmux' }}
    # The linux pool, not LINUX_RUNNER: this job checks LINUX_RUNNER, so it must not wait on it.
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || fromJSON(vars.RUNNER_POOLS).linux || 'blacksmith-32vcpu-ubuntu-2404' }}
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Check out reviewed runner-pool tooling
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: feat-cmux-next
          path: .runner-pool-tooling
          sparse-checkout: |
            scripts/ci/runner_pool_reconcile.py
            tests/test_ci_runner_pool_reconcile.py
            .github/workflows/ci.yml
            .github/workflows/cmux-next-ios-kit.yml
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Check main policy with the reviewed tooling
        env:
          RUNNER_POOL_POLICY_ROOT: ${{ github.workspace }}
        run: bash scripts/ci/python-with-yaml.sh .runner-pool-tooling/tests/test_ci_runner_pool_reconcile.py

      # Signing jobs on feat-cmux-next read runner variables too (scripts/ci/signing_runner_variables.py).
      # Without this checkout the check fails closed: every runner variable must be ephemeral.
      - name: Check out feat-cmux-next's workflows
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: feat-cmux-next
          path: .signing-workflows/feat-cmux-next
          sparse-checkout: .github/workflows
          persist-credentials: false

      - name: Check the live values
        env:
          SIGNING_WORKFLOW_DIRS: .signing-workflows/feat-cmux-next/.github/workflows
          CI_OWNED_POOL_SLOTS: ${{ vars.CI_OWNED_POOL_SLOTS }}
          CMUX_CI_XCODE_APP_PR: ${{ vars.CMUX_CI_XCODE_APP_PR }}
          # Present while the cloud overflow switch has Blacksmith overflow off.
          CI_CLOUD_OVERFLOW_SAVED: ${{ vars.CI_CLOUD_OVERFLOW_SAVED }}
          # Must not equal CI_SIDE_LANE_RUNNER: the daemon tests gate nightly-next promotion.
          CI_NEXT_DAEMON_POOL: ${{ vars.CI_NEXT_DAEMON_POOL }}
          # cmux-tui-pin-* pushes' daemon tests (else CI_LIGHT_LANE_RUNNER): must equal
          # neither CI_NEXT_DAEMON_POOL nor CI_SIDE_LANE_RUNNER.
          CI_PIN_DAEMON_POOL: ${{ vars.CI_PIN_DAEMON_POOL }}
          CMUX_CI_RUNNER_VARIABLES: |
            CI_CONTROL_RUNNER=${{ vars.CI_CONTROL_RUNNER }}
            CI_LIGHT_LANE_RUNNER=${{ vars.CI_LIGHT_LANE_RUNNER }}
            CI_NIGHTLY_TRUSTED_RUNNER=${{ vars.CI_NIGHTLY_TRUSTED_RUNNER }}
            CI_NIGHTLY_NEXT_BUILD_RUNNER=${{ vars.CI_NIGHTLY_NEXT_BUILD_RUNNER }}
            CI_NIGHTLY_NEXT_TRUSTED_POOL=${{ vars.CI_NIGHTLY_NEXT_TRUSTED_POOL }}
            CI_NIGHTLY_NEXT_TRUSTED_RUNNER=${{ vars.CI_NIGHTLY_NEXT_TRUSTED_RUNNER }}
            CI_PR_POOL_ORDER=${{ vars.CI_PR_POOL_ORDER }}
            CI_SEED_TRUSTED_POOL=${{ vars.CI_SEED_TRUSTED_POOL }}
            CI_SIDE_LANE_RUNNER=${{ vars.CI_SIDE_LANE_RUNNER }}
            CI_TRUSTED_RUNNER=${{ vars.CI_TRUSTED_RUNNER }}
            CMUX_CI_RUNNER_FLEET=${{ vars.CMUX_CI_RUNNER_FLEET }}
            CMUX_CI_RUNNER_OVERRIDES=${{ vars.CMUX_CI_RUNNER_OVERRIDES }}
            LINUX_ARM64_RUNNER=${{ vars.LINUX_ARM64_RUNNER }}
            LINUX_RUNNER=${{ vars.LINUX_RUNNER }}
            MACOS_RUNNER_15=${{ vars.MACOS_RUNNER_15 }}
            MACOS_RUNNER_26=${{ vars.MACOS_RUNNER_26 }}
            MACOS_RUNNER_26_LARGE=${{ vars.MACOS_RUNNER_26_LARGE }}
            MACOS_RUNNER_BACKGROUND=${{ vars.MACOS_RUNNER_BACKGROUND || 'blacksmith-6vcpu-macos-15' }}
            MACOS_RUNNER_DISPLAY=${{ vars.MACOS_RUNNER_DISPLAY }}
            MACOS_RUNNER_DUAL_XCODE=${{ vars.MACOS_RUNNER_DUAL_XCODE }}
            MACOS_RUNNER_IOS=${{ vars.MACOS_RUNNER_IOS }}
            MACOS_RUNNER_PR=${{ vars.MACOS_RUNNER_PR }}
            MACOS_RUNNER_TESTS=${{ vars.MACOS_RUNNER_TESTS }}
            NIGHTLY_NEXT_TRAIN_RUNNER=${{ vars.NIGHTLY_NEXT_TRAIN_RUNNER }}
            WINDOWS_RUNNER=${{ vars.WINDOWS_RUNNER }}
        run: bash scripts/ci/python-with-yaml.sh scripts/ci/check_repo_variables.py

      # RUNNER_POOLS, the one routing source (scripts/ci/runner_pools.py): every pool set, each to
      # one of its declared members. A missing pool fails every job that reads it. LINUX_RUNNER,
      # which most Linux runs-on still read, must name a member of the linux pool unless the
      # overflow switch's record is set (runner_pools.MIRRORS).
      - name: Check the runner pools
        if: ${{ !cancelled() }}
        env:
          RUNNER_POOLS: ${{ vars.RUNNER_POOLS }}
          CI_CLOUD_LABEL_HEALTH: ${{ vars.CI_CLOUD_LABEL_HEALTH }}
          LINUX_RUNNER: ${{ vars.LINUX_RUNNER }}
          CI_CLOUD_OVERFLOW_SAVED: ${{ vars.CI_CLOUD_OVERFLOW_SAVED }}
        run: python3 .runner-pool-tooling/scripts/ci/runner_pool_reconcile.py --source-root "$GITHUB_WORKSPACE" --check

      # No runs-on waits on one machine through a variable's value
      # (scripts/ci/runs_on_values.py). The workflow text passes
      # `vars.X || <pool>` however X is set, and a set X never falls through,
      # so this reads each runs-on of every branch below that runs workflows
      # with the live values. Every variable a runs-on reads is passed by name
      # (tests/test_ci_runs_on_values.py keeps the list complete for this tree;
      # the script names any other branch's variable missing here).
      - name: Check no runs-on waits on one machine
        id: runs-on-values
        if: ${{ !cancelled() }}
        env:
          # Branches whose workflows run: the default branch, the cmux NEXT
          # branches, and rc/cnx-ios-builder (the iPhone INTERNAL builder runs
          # its own frozen copy of ios-internal-nightly.yml).
          ROUTE_BRANCHES: main feat-cmux-next nightly-next rc/cnx-ios-builder
          CMUX_CI_RUNS_ON_VARIABLES: |
            CI_CLOUD_OVERFLOW_SAVED=${{ vars.CI_CLOUD_OVERFLOW_SAVED }}
            CI_COMPILE_CHECK_GATEWAY=${{ vars.CI_COMPILE_CHECK_GATEWAY }}
            CI_CONTROL_RUNNER=${{ vars.CI_CONTROL_RUNNER }}
            CI_IOS_INTERNAL_RUNNER=${{ vars.CI_IOS_INTERNAL_RUNNER }}
            CI_NIGHTLY_NEXT_BUILD_RUNNER=${{ vars.CI_NIGHTLY_NEXT_BUILD_RUNNER }}
            CI_LIGHT_LANE_RUNNER=${{ vars.CI_LIGHT_LANE_RUNNER }}
            CI_NEXT_DAEMON_POOL=${{ vars.CI_NEXT_DAEMON_POOL }}
            CI_NEXT_PROMOTE_POOL=${{ vars.CI_NEXT_PROMOTE_POOL }}
            CI_NIGHTLY_NEXT_TRUSTED_RUNNER=${{ vars.CI_NIGHTLY_NEXT_TRUSTED_RUNNER }}
            CI_NIGHTLY_TRUSTED_RUNNER=${{ vars.CI_NIGHTLY_TRUSTED_RUNNER }}
            CI_PAID_MACOS_OVERFLOW=${{ vars.CI_PAID_MACOS_OVERFLOW }}
            CI_PERF_CRON_GATEWAY=${{ vars.CI_PERF_CRON_GATEWAY }}
            CI_PIN_DAEMON_POOL=${{ vars.CI_PIN_DAEMON_POOL }}
            CI_PR_POOL_OWNED=${{ vars.CI_PR_POOL_OWNED }}
            CI_SEED_TRUSTED_POOL=${{ vars.CI_SEED_TRUSTED_POOL }}
            CI_SESSION_LABEL=${{ vars.CI_SESSION_LABEL }}
            CI_SESSION_LANE_RUNNER=${{ vars.CI_SESSION_LANE_RUNNER }}
            CI_SIDE_LANE_RUNNER=${{ vars.CI_SIDE_LANE_RUNNER }}
            CI_SWIFT_PACKAGE_TESTS_STEP_GATEWAY=${{ vars.CI_SWIFT_PACKAGE_TESTS_STEP_GATEWAY }}
            CI_TEST_COMPILE_GATEWAY=${{ vars.CI_TEST_COMPILE_GATEWAY }}
            CI_TIP_TEST_COMPILE_GATEWAY=${{ vars.CI_TIP_TEST_COMPILE_GATEWAY }}
            CI_TRUSTED_RUNNER=${{ vars.CI_TRUSTED_RUNNER }}
            LINUX_RUNNER=${{ vars.LINUX_RUNNER }}
            LINUX_RUNNER_DARWIN_CROSS=${{ vars.LINUX_RUNNER_DARWIN_CROSS }}
            MACOS_RUNNER_15=${{ vars.MACOS_RUNNER_15 }}
            MACOS_RUNNER_26=${{ vars.MACOS_RUNNER_26 }}
            MACOS_RUNNER_BACKGROUND=${{ vars.MACOS_RUNNER_BACKGROUND || 'blacksmith-6vcpu-macos-15' }}
            MACOS_RUNNER_DISPLAY=${{ vars.MACOS_RUNNER_DISPLAY }}
            MACOS_RUNNER_DUAL_XCODE=${{ vars.MACOS_RUNNER_DUAL_XCODE }}
            MACOS_RUNNER_IOS=${{ vars.MACOS_RUNNER_IOS }}
            MACOS_RUNNER_PR=${{ vars.MACOS_RUNNER_PR }}
            MACOS_RUNNER_TESTS=${{ vars.MACOS_RUNNER_TESTS }}
            NIGHTLY_NEXT_TRAIN_RUNNER=${{ vars.NIGHTLY_NEXT_TRAIN_RUNNER }}
            RUNNER_POOLS=${{ vars.RUNNER_POOLS }}
            WINDOWS_RUNNER=${{ vars.WINDOWS_RUNNER }}
        run: |
          set -euo pipefail
          trees=()
          for branch in $ROUTE_BRANCHES; do
            dir="$RUNNER_TEMP/runs-on-values/$branch"
            mkdir -p "$dir"
            if [ "refs/heads/$branch" = "$GITHUB_REF" ]; then
              cp -R .github/workflows/. "$dir/"
              trees+=("$branch=$dir")
              continue
            fi
            # Exit 2 is "no such ref" (a retired branch runs nothing: drop it from ROUTE_BRANCHES);
            # any other failure fails the step, so a branch is never skipped silently.
            status=0
            git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null || status=$?
            if [ "$status" = 2 ]; then
              echo "::notice title=runs-on value::$branch does not exist; nothing to check there"
              continue
            elif [ "$status" != 0 ]; then
              echo "::error title=runs-on value::could not read $branch from origin (git ls-remote exit $status)"
              exit 1
            else
              git fetch --quiet --no-tags --depth=1 origin "+refs/heads/$branch:refs/remotes/origin/$branch"
              git archive "refs/remotes/origin/$branch" .github/workflows | tar -x -C "$dir" --strip-components=2
            fi
            trees+=("$branch=$dir")
          done
          python3 scripts/ci/runs_on_values.py "${trees[@]}"
