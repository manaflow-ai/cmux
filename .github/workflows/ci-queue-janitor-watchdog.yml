name: CI queue janitor watchdog

# The queue janitor's sweep (ci-queue-janitor.yml) runs on a one-job repair VM
# (cmux-gcp-repair-jit-x64), or on cmux-fleet-linux-x64 when the repository variable
# CI_QUEUE_JANITOR_ON_FLEET is 1, and is what files "Runner label starved:
# <label>" issues. When its label starts no runner the sweep cannot run, so it
# can never report its own label. This watchdog watches the label the sweep
# runs on (LABEL follows the same variable) and runs on the other one, never on
# a Blacksmith label, in its own workflow (a sweep queued in the janitor's
# concurrency group would hold a job of that workflow pending too). It reads
# only the age of the newest macos-pool-load artifact. Over STALE_SECONDS it
# opens the issue for the sweep's label; the next sweep that runs closes it
# (starved_labels.sync_issues()). tests/test_ci_janitor_watchdog_route.py.
# cmux run 43807536777 sat queued on that label for 13 h with no alert
# (tests/test_ci_starved_labels.py).
# A stale snapshot is not proof of no runners: the sweep also waits when the
# label is saturated (cmux#47855 paged "starved" while 64 of its runners were
# online and 82 busy, and the sweep waited 77 min for one). Before filing, the
# watchdog reads the label's live roster (scripts/ci/janitor_watchdog_roster.py):
# an online runner on it means saturated (a warning, no starved issue, and a
# starved issue this watchdog filed is closed); none online on two reads means
# starved and files the issue; an unreadable roster files nothing (a red run
# that names the roster unknown). An unknown roster used to file the issue, and
# the next run, reading the roster, closed it as saturated a minute later
# (cmux#50767, #51512, #51605): only a confirmed "starved" opens one now
# (tests/test_ci_janitor_watchdog.py).

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-queue-janitor-watchdog
  cancel-in-progress: false

env:
  # Temporary REST budget attribution: one gh-call line per GitHub API call (scripts/ci/api_call_log/env.sh, fetched at a fixed commit when the checkout has no copy).
  BASH_ENV: '$({ w="${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh"; t="${RUNNER_TEMP:-/nonexistent}/api-call-log-src"; if [ -f "$w" ]; then echo "$w"; elif [ -n "${RUNNER_TEMP:-}" ]; then if [ ! -f "$t/env.sh" ] && [ ! -e "$t.tried" ] && { [ "${RUNNER_OS:-}" = Linux ] || [ "${RUNNER_OS:-}" = macOS ]; } && [ "$(date -u +%Y%m%d%H)" -lt 2026112300 ]; then : > "$t.tried"; mkdir -p "$t.part" && for x in env.sh gh sitecustomize.py isolated.py; do curl -fsSL --max-time 5 -o "$t.part/$x" "https://raw.githubusercontent.com/manaflow-ai/cmux/27647ffd3ae838c63be28ca3e5883dcd68c34518/scripts/ci/api_call_log/$x" || break; done; [ -s "$t.part/isolated.py" ] && mv "$t.part" "$t"; fi; if [ -f "$t/env.sh" ]; then echo "$t/env.sh"; else echo unset BASH_ENV > "$t.off.sh" && echo "$t.off.sh"; fi; fi; } 2>/dev/null)'

jobs:
  watch:
    name: Alert when the janitor sweep stops publishing
    if: github.repository_owner == 'manaflow-ai'
    permissions:
      actions: read
      contents: read # the roster script and the GitHub API wait
      issues: write
    # Off the label it watches: the fleet label while the sweep is on its one-job repair VM, the repair VM while
    # CI_QUEUE_JANITOR_ON_FLEET=1 puts the sweep on the fleet label. GitHub-hosted Ubuntu starts nothing in
    # manaflow-ai (Leo, 2026-11-21: "the ci must flow").
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.CI_QUEUE_JANITOR_ON_FLEET != '1' && 'cmux-fleet-linux-x64' || 'cmux-gcp-repair-jit-x64' }}
    timeout-minutes: 20
    env:
      # A scheduled job's GitHub API waits stop here and fail loud (scripts/ci/gh_budget_wait.sh).
      GH_BUDGET_WAIT_MAX_SECONDS: "900"
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      # The sweep's label, from the same variable as ci-queue-janitor.yml's runs-on.
      LABEL: ${{ vars.CI_QUEUE_JANITOR_ON_FLEET == '1' && 'cmux-fleet-linux-x64' || 'cmux-gcp-repair-jit-x64' }}
      STALE_SECONDS: "1800"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: |
            scripts/ci/janitor_watchdog_roster.py
            .github/actions/app-token-spread/
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # This commit's GitHub API wait (scripts/ci/gh_budget_wait.sh): every later gh call, and
      # each github-script step that installs gh_budget_wait.cjs, waits through a rate limit or a
      # GitHub 5xx under the job's GH_BUDGET_WAIT_MAX_SECONDS, then fails loud. It follows the
      # workspace checkout above, whose clean would remove it.
      - name: Checkout the GitHub API wait
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: .gh-budget-tooling
          sparse-checkout: |
            scripts/ci/gh_budget_wait.sh
            scripts/ci/gh_budget_wait.cjs
          sparse-checkout-cone-mode: false
      - name: Wait through GitHub API rate limits and 5xx in this job
        working-directory: ${{ github.workspace }}
        run: bash .gh-budget-tooling/scripts/ci/gh_budget_wait.sh --install

      # The routing App's read-only runner token: the workflow token cannot list
      # self-hosted runners. Any failure leaves it empty and the roster unknown.
      - name: Mint the runner roster token
        id: route-token
        if: vars.GLAEDA_ROUTE_APP_ID != ''
        continue-on-error: true
        timeout-minutes: 1
        uses: ./.github/actions/app-token-spread
        with:
          route-app-id: ${{ vars.GLAEDA_ROUTE_APP_ID }}
          route-private-key: ${{ secrets.GLAEDA_ROUTE_APP_KEY }}
          bot-app-id: ${{ vars.CMUX_BOT_APP_ID }}
          bot-private-key: ${{ secrets.CMUX_BOT_APP_KEY }}
          permission-administration: read
          permission-organization-self-hosted-runners: read

      - name: Open the starved-label issue when the newest sweep snapshot is stale
        env:
          ROUTE_TOKEN: ${{ steps.route-token.outputs.token }}
        run: |
          set -euo pipefail
          newest="$(gh api "repos/$GH_REPO/actions/artifacts?name=macos-pool-load&per_page=20" \
            --jq '[.artifacts[] | select(.expired | not) | select(.workflow_run.head_branch == "main") | .created_at] | max // ""')"
          age=999999
          if [ -n "$newest" ]; then
            age=$(( $(date -u +%s) - $(date -u -d "$newest" +%s) ))
          fi
          echo "newest macos-pool-load: ${newest:-none} (${age}s old)"
          if [ "$age" -lt "$STALE_SECONDS" ]; then
            exit 0
          fi
          title="Runner label starved: $LABEL"
          lead="No queue janitor sweep has published a macos-pool-load snapshot for"
          if [ "$LABEL" = "cmux-fleet-linux-x64" ]; then
            roster="$(python3 scripts/ci/janitor_watchdog_roster.py || echo "unknown runner roster unknown: the roster read failed")"
          else
            # A one-job JIT label has no standing roster: the runner scaler mints a VM per queued job, so an
            # idle roster read would always say starved.
            roster="jit \`$LABEL\` is a one-job JIT label, so there is no standing runner roster to read"
          fi
          state="${roster%% *}"
          detail="${roster#* }"
          echo "roster: $roster"
          if [ "$state" = "saturated" ]; then
            # Busy, not dead: the sweep waits behind the label's own queue. No starved
            # issue; close the one this watchdog filed (its body starts with $lead).
            echo "::warning::Runner label saturated: $LABEL: no janitor snapshot for ${age}s; $detail"
            echo "- Runner label saturated: $LABEL: no janitor snapshot for ${age}s; $detail" >> "$GITHUB_STEP_SUMMARY"
            ours="$(gh issue list --state open --search "\"$title\" in:title" --json number,title,body 2>/dev/null |
              jq -r --arg t "$title" --arg lead "$lead" '.[] | select(.title == $t and (.body // "" | startswith($lead))) | .number' || true)"
            for number in $ours; do
              gh issue close "$number" --comment "The janitor snapshot is ${age}s old, but \`$LABEL\` is saturated, not starved ($detail): the sweep waits behind that label's queue. Closing this snapshot-age alert."
            done
            exit 0
          fi
          if [ "$state" = "starved" ]; then
            why="The live roster confirms it on two reads: $detail."
          elif [ "$state" = "jit" ]; then
            why=""
          else
            # Unread is not starved: the run that next reads the roster would close the issue as saturated
            # (cmux#50767, #51512, #51605). A red run, no issue; an issue already open is left as it is.
            echo "::error::Runner label $LABEL: no janitor snapshot for ${age}s, and the roster is unknown, so no starved issue: $detail"
            echo "- Runner label $LABEL: no janitor snapshot for ${age}s; roster unknown, no starved issue filed: $detail" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ "$LABEL" = "cmux-fleet-linux-x64" ]; then
            move="The sweep runs on \`$LABEL\` because the repository variable \`CI_QUEUE_JANITOR_ON_FLEET\` is 1, so that label is likely booting no runners. Unset that variable to move the sweep back to its one-job repair VM \`cmux-gcp-repair-jit-x64\`"
          else
            move="The sweep runs on the one-job JIT label \`$LABEL\`, so the runner scaler is likely minting no VM for it (cmuxterm-hq tools/fleet-reconcilers/runner_pool.py). Set the repository variable \`CI_QUEUE_JANITOR_ON_FLEET=1\` to move the sweep to \`cmux-fleet-linux-x64\`"
          fi
          body="$lead ${age}s (newest: ${newest:-none}). ${why:+$why }$move, cancel the waiting ci-queue-janitor run that holds its concurrency group (or, if GitHub refuses that cancel, move the group key in ci-queue-janitor.yml), and dispatch a fresh sweep (docs/ci-runners.md). The next sweep that runs closes this issue."
          echo "::error::$title: no janitor snapshot for ${age}s; $detail"
          echo "- $title: no janitor snapshot for ${age}s; $detail" >> "$GITHUB_STEP_SUMMARY"
          existing="$(gh issue list --state open --search "\"$title\" in:title" --json number,title 2>/dev/null |
            jq -r --arg t "$title" '[.[] | select(.title == $t) | .number] | first // ""' || true)"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
          exit 1
