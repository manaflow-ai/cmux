name: CI queue janitor watchdog

# The queue janitor's sweep (ci-queue-janitor.yml) runs on GitHub-hosted
# ubuntu-24.04, or on cmux-fleet-linux-x64 when the repository variable
# CI_QUEUE_JANITOR_ON_FLEET is 1, and is what files "Runner label starved:
# <label>" issues. When its label starts no runner the sweep cannot run, so it
# can never report its own label. This watchdog watches the label the sweep
# runs on (LABEL follows the same variable) and runs on the other one, never on
# a Blacksmith label, in its own workflow (a sweep queued in the janitor's
# concurrency group would hold a job of that workflow pending too). It reads
# only the age of the newest macos-pool-load artifact. Over STALE_SECONDS it
# opens the issue for the sweep's label; the next sweep that runs closes it
# (starved_labels.sync_issues()). tests/test_ci_janitor_watchdog_route.py.
# cmux run 43807536777 sat queued on that label for 13 h with no alert
# (tests/test_ci_starved_labels.py).

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-queue-janitor-watchdog
  cancel-in-progress: true

jobs:
  watch:
    name: Alert when the janitor sweep stops publishing
    if: github.repository_owner == 'manaflow-ai'
    permissions:
      actions: read
      issues: write
    # Off the label it watches: the fleet label while the sweep is on hosted Ubuntu, hosted Ubuntu while
    # CI_QUEUE_JANITOR_ON_FLEET=1 puts the sweep on the fleet label.
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.CI_QUEUE_JANITOR_ON_FLEET != '1' && 'cmux-fleet-linux-x64' || 'ubuntu-24.04' }}
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      # The sweep's label, from the same variable as ci-queue-janitor.yml's runs-on.
      LABEL: ${{ vars.CI_QUEUE_JANITOR_ON_FLEET == '1' && 'cmux-fleet-linux-x64' || 'ubuntu-24.04' }}
      STALE_SECONDS: "1800"
    steps:
      - name: Open the starved-label issue when the newest sweep snapshot is stale
        run: |
          set -euo pipefail
          newest="$(gh api "repos/$GH_REPO/actions/artifacts?name=macos-pool-load&per_page=20" \
            --jq '[.artifacts[] | select(.expired | not) | select(.workflow_run.head_branch == "main") | .created_at] | max // ""')"
          age=999999
          if [ -n "$newest" ]; then
            age=$(( $(date -u +%s) - $(date -u -d "$newest" +%s) ))
          fi
          echo "newest macos-pool-load: ${newest:-none} (${age}s old)"
          if [ "$age" -lt "$STALE_SECONDS" ]; then
            exit 0
          fi
          title="Runner label starved: $LABEL"
          if [ "$LABEL" = "cmux-fleet-linux-x64" ]; then
            move="The sweep runs on \`$LABEL\` because the repository variable \`CI_QUEUE_JANITOR_ON_FLEET\` is 1, so that label is likely booting no runners. Unset that variable to move the sweep back to GitHub-hosted \`ubuntu-24.04\`"
          else
            move="The sweep runs on GitHub-hosted \`$LABEL\`, so that queue is likely busy. Set the repository variable \`CI_QUEUE_JANITOR_ON_FLEET=1\` to move the sweep to \`cmux-fleet-linux-x64\`"
          fi
          body="No queue janitor sweep has published a macos-pool-load snapshot for ${age}s (newest: ${newest:-none}). $move, cancel the waiting ci-queue-janitor run that holds its concurrency group (or, if GitHub refuses that cancel, move the group key in ci-queue-janitor.yml), and dispatch a fresh sweep (docs/ci-runners.md). The next sweep that runs closes this issue."
          echo "::error::$title: no janitor snapshot for ${age}s"
          echo "- $title: no janitor snapshot for ${age}s" >> "$GITHUB_STEP_SUMMARY"
          existing="$(gh issue list --state open --search "\"$title\" in:title" --json number,title 2>/dev/null |
            jq -r --arg t "$title" '[.[] | select(.title == $t) | .number] | first // ""' || true)"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
          exit 1
