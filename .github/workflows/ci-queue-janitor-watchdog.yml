name: CI queue janitor watchdog

# The queue janitor's sweep (ci-queue-janitor.yml) runs on cmux-gcp-repair-jit-x64
# and is what files "Runner label starved: <label>" issues. When that label
# boots no runner the sweep cannot run, so it can never report its own label.
# This watchdog runs on the sweep's previous selector, in its own workflow (a
# sweep queued in the janitor's concurrency group would hold a job of that
# workflow pending too), and reads only the age of the newest macos-pool-load
# artifact. Over STALE_SECONDS it opens the starved-label issue for the fleet
# label; the next sweep that runs closes it (starved_labels.sync_issues()).
# cmux run 43807536777 sat queued on that label for 13 h with no alert
# (tests/test_ci_starved_labels.py).
# A stale snapshot is not proof of no runners: the sweep also waits when the
# label is saturated (cmux#47855 paged "starved" while 64 of its runners were
# online and 82 busy, and the sweep waited 77 min for one). Before filing, the
# watchdog reads the label's live roster (scripts/ci/janitor_watchdog_roster.py):
# an online runner on it means saturated (a warning, no starved issue, and a
# starved issue this watchdog filed is closed); none online means starved; an
# unreadable roster keeps the snapshot-only alert and names the roster unknown
# (tests/test_ci_janitor_watchdog.py).

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-queue-janitor-watchdog
  cancel-in-progress: true

jobs:
  watch:
    name: Alert when the janitor sweep stops publishing
    if: github.repository_owner == 'manaflow-ai'
    permissions:
      actions: read
      contents: read
      issues: write
    runs-on: ${{ contains(fromJSON('["blacksmith-4vcpu-ubuntu-2404","blacksmith-8vcpu-ubuntu-2404","blacksmith-16vcpu-ubuntu-2404","blacksmith-32vcpu-ubuntu-2404"]'), fromJSON(vars.RUNNER_POOLS || '{}').linux) && fromJSON(vars.RUNNER_POOLS || '{}').linux || contains(fromJSON('["blacksmith-4vcpu-ubuntu-2404","blacksmith-8vcpu-ubuntu-2404","blacksmith-16vcpu-ubuntu-2404","blacksmith-32vcpu-ubuntu-2404"]'), vars.LINUX_RUNNER) && vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      LABEL: cmux-gcp-repair-jit-x64
      STALE_SECONDS: "1800"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: |
            scripts/ci/janitor_watchdog_roster.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # The routing App's read-only runner token: the workflow token cannot list
      # self-hosted runners. Any failure leaves it empty and the roster unknown.
      - name: Mint the runner roster token
        id: route-token
        if: vars.GLAEDA_ROUTE_APP_ID != ''
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.GLAEDA_ROUTE_APP_ID }}
          private-key: ${{ secrets.GLAEDA_ROUTE_APP_KEY }}
          permission-administration: read
          permission-organization-self-hosted-runners: read

      - name: Open the starved-label issue when the newest sweep snapshot is stale
        env:
          ROUTE_TOKEN: ${{ steps.route-token.outputs.token }}
        run: |
          set -euo pipefail
          newest="$(gh api "repos/$GH_REPO/actions/artifacts?name=macos-pool-load&per_page=20" \
            --jq '[.artifacts[] | select(.expired | not) | select(.workflow_run.head_branch == "main") | .created_at] | max // ""')"
          age=999999
          if [ -n "$newest" ]; then
            age=$(( $(date -u +%s) - $(date -u -d "$newest" +%s) ))
          fi
          echo "newest macos-pool-load: ${newest:-none} (${age}s old)"
          if [ "$age" -lt "$STALE_SECONDS" ]; then
            exit 0
          fi
          title="Runner label starved: $LABEL"
          lead="No queue janitor sweep has published a macos-pool-load snapshot for"
          roster="$(python3 scripts/ci/janitor_watchdog_roster.py || echo "unknown runner roster unknown: the roster read failed")"
          state="${roster%% *}"
          detail="${roster#* }"
          echo "roster: $roster"
          if [ "$state" = "saturated" ]; then
            # Busy, not dead: the sweep waits behind the label's own queue. No starved
            # issue; close the one this watchdog filed (its body starts with $lead).
            echo "::warning::Runner label saturated: $LABEL: no janitor snapshot for ${age}s; $detail"
            echo "- Runner label saturated: $LABEL: no janitor snapshot for ${age}s; $detail" >> "$GITHUB_STEP_SUMMARY"
            ours="$(gh issue list --state open --search "\"$title\" in:title" --json number,title,body 2>/dev/null |
              jq -r --arg t "$title" --arg lead "$lead" '.[] | select(.title == $t and (.body // "" | startswith($lead))) | .number' || true)"
            for number in $ours; do
              gh issue close "$number" --comment "The janitor snapshot is ${age}s old, but \`$LABEL\` is saturated, not starved ($detail): the sweep waits behind that label's queue. Closing this snapshot-age alert."
            done
            exit 0
          fi
          if [ "$state" = "starved" ]; then
            why="The live roster confirms it: $detail."
          else
            why="The live roster could not be read, so whether the label is starved or saturated is unknown ($detail)."
          fi
          body="$lead ${age}s (newest: ${newest:-none}). The sweep runs on \`$LABEL\`, so that label is likely booting no runners. $why Set the repository variable \`CI_REPAIR_SKIP_FLEET=1\` to move the janitors back to their previous selector, cancel the stalled ci-queue-janitor run that holds its concurrency group (or, if GitHub refuses that cancel, move the group key in ci-queue-janitor.yml), and dispatch a fresh sweep (docs/ci-runners.md). The next sweep that runs closes this issue."
          echo "::error::$title: no janitor snapshot for ${age}s; $detail"
          echo "- $title: no janitor snapshot for ${age}s; $detail" >> "$GITHUB_STEP_SUMMARY"
          existing="$(gh issue list --state open --search "\"$title\" in:title" --json number,title 2>/dev/null |
            jq -r --arg t "$title" '[.[] | select(.title == $t) | .number] | first // ""' || true)"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
          exit 1
