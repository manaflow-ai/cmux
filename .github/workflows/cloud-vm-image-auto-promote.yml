name: Cloud VM image auto-promote

# A kept, smoked bake may request promotion when the staleness reconciler dispatched it.
# This receiver runs only after the bake workflow has completed successfully, so the
# promotion workflow never races a still-running bake or downloads a partial artifact.
on:
  workflow_run:
    workflows:
      - Cloud VM image bake
    types:
      - completed
    branches:
      - feat-cmux-next

permissions:
  contents: read

concurrency:
  group: cloud-vm-image-auto-promote-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  dispatch:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'workflow_dispatch' &&
      github.event.workflow_run.head_branch == 'feat-cmux-next' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    steps:
      - name: Download the completed bake artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: cmux-vm-image-bake-${{ github.event.workflow_run.id }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/bake

      - name: Dispatch the checked-in dev promotion
        env:
          GH_TOKEN: ${{ github.token }}
          BAKE_RUN: ${{ github.event.workflow_run.id }}
          ARTIFACT_DIR: ${{ runner.temp }}/bake
        run: |
          set -euo pipefail
          marker="$ARTIFACT_DIR/auto-promote.json"
          if [ ! -f "$marker" ]; then
            echo "The completed bake did not request auto-promotion; nothing to dispatch."
            exit 0
          fi
          snapshot="$(jq -r '.snapshot // empty' "$marker")"
          var="$(jq -r '.var // empty' "$marker")"
          [[ "$snapshot" =~ ^sh-[0-9a-f]{32}$ ]] || { echo "::error title=Auto-promotion::invalid snapshot in marker"; exit 1; }
          [[ "$var" =~ ^(CLOUD_FREESTYLE_SNAPSHOT|TEAM_VM_SNAPSHOT)$ ]] || { echo "::error title=Auto-promotion::invalid image variable in marker"; exit 1; }
          candidate="$ARTIFACT_DIR/channel-dev.json"
          jq -e --arg snapshot "$snapshot" --arg var "$var" '.snapshot_id == $snapshot and .var == $var and .smoke.result == "PASSED"' "$candidate" > /dev/null
          gh workflow run cloud-vm-image-promote.yml \
            --repo "$GITHUB_REPOSITORY" --ref feat-cmux-next \
            -f channel=dev -f snapshot="$snapshot" -f bake_run="$BAKE_RUN"
          echo "Dispatched dev promotion for $snapshot from bake run $BAKE_RUN ($var)."
