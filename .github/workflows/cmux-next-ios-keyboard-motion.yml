name: cmux-next iOS keyboard motion bench

# How the iPhone app moves when the system keyboard shows, hides or is dragged down, per surface
# (scripts/measure/ios-keyboard-motion.sh: KeyboardMotionBenchUITests on one fleet simulator, then
# ios_keyboard_motion.py's report.json). Non-blocking: no pull_request trigger, so no pull request
# waits on it; it measures each nightly-next tip and on demand (workflow_dispatch, any ref), and keeps
# the report as an artifact and in the run summary. Its own workflow because there is no iOS UI test
# nightly to join. A thin cmux-ci client on the build-fleet gateway runner (vars.CI_EVAL_STEP_GATEWAY),
# as cmux-next-iphone-clips.yml's record job is; with the variable unset nothing runs.

on:
  push:
    branches: [nightly-next]
  workflow_dispatch:
    inputs:
      ref:
        description: Commit or branch to measure (default the dispatched ref)
        required: false
        type: string

permissions: {}

concurrency:
  # One run at a time per workflow on nightly-next tips, not one per commit (ci-min-per-pr-30; Leo, 2026-11-21:
  # "de facto, im asking for 99% fewer minutes of ci time, period."). nightly-next moves about 20 times a day,
  # and a per-commit group let every push start its own gateway job at once: they queued behind one another
  # at the fleet's one simulator per Mac while each held a gateway runner, and on 11-26 eleven clips and
  # energy runs sat to their timeout (240 and 150 min) and were cancelled: 1,172 of the 2,071 runner-min the
  # three simulator benches spent in the timing feed's 24 h to 19Z. One group keeps the run in flight and only the newest pushed tip pending (GitHub drops the older
  # pending one, a tip the newer one supersedes), and a pending run holds no runner. cmux-next-media.yml's
  # nightly tour does the same (cmux-next-media-nightly-tip).
  # A dispatch (any ref, on demand) keeps its own per-run group: only nightly-next pushes share the tip group.
  group: cmux-next-ios-keyboard-motion-${{ github.event_name == 'push' && 'nightly-tip' || github.run_id }}
  cancel-in-progress: false

jobs:
  bench:
    name: Keyboard motion on a fleet simulator
    if: ${{ github.repository_owner == 'manaflow-ai' && vars.CI_EVAL_STEP_GATEWAY != '' }}
    # The client waits on Linux; native work stays on the fleet worker.
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || 'cmux-linux' }}
    timeout-minutes: 150
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - name: Checkout fleet client tooling
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          submodules: false
          fetch-depth: 1
          sparse-checkout: |
            .github/actions/fleet-client
            .gitmodules
          sparse-checkout-cone-mode: false

      - uses: ./.github/actions/fleet-client
        with:
          controller: ${{ vars.CMUX_FLEET_CONTROLLER }}

      - name: Measure
        env:
          REF: ${{ inputs.ref || github.sha }}
        run: |
          set +e
          set -uo pipefail
          client="${CMUX_CI_CLIENT:-$HOME/.local/bin/cmux-ci}"
          if ! [[ -x "$client" ]]; then
            echo "::warning title=Keyboard motion bench::$client is not installed on runner $RUNNER_NAME; no run"
            exit 0
          fi
          out="${RUNNER_TEMP:?}/ios-keyboard-motion"
          mkdir -p "$out"
          log="$out/step.log"
          "$client" run --class simulator --label measure --script scripts/measure/ios-keyboard-motion.sh \
            --ref "$REF" --timeout 7200 --artifact .build/ios-keyboard-motion/report.json 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          step="$(grep -o -E 'step [0-9a-f]{24}' "$log" | head -1 | cut -d' ' -f2)"
          if [ -n "$step" ]; then
            "$client" artifact "$step" "$out/report.json" || "$client" artifact --failed "$step" "$out/report.json" \
              || echo "::warning title=Keyboard motion bench::step $step returned no report"
          fi
          if [ -s "$out/report.json" ]; then
            python3 -c 'import json, sys; print(json.load(open(sys.argv[1])).get("table_md", ""))' "$out/report.json" \
              >> "$GITHUB_STEP_SUMMARY"
          fi
          [ "$status" -eq 0 ] || echo "::warning title=Keyboard motion bench::the step exited $status (not blocking)"
          exit 0

      - name: Keep the report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-next-ios-keyboard-motion
          path: ${{ runner.temp }}/ios-keyboard-motion
          if-no-files-found: ignore
          retention-days: 14
