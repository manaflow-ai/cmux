name: Debug and Labs keys report dispatcher

# Leo, 2026-11-05, on the ranked list whose move 10 is "Flip or delete Debug/Labs flags after 7 days":
# "i meant can you do all of htem". feat-cmux-next's debug-labs-keys-report.yml lists every Debug
# Settings and Labs key in cmux NEXT older than a week with its owner and case, as one issue. It lives
# on feat-cmux-next (main keeps an inert registration of it, which GitHub needs to dispatch it), and
# scheduled workflows run only from the default branch, so once a day this
# file on main starts it there, unless a run is already pending. Report only.
on:
  schedule:
    - cron: "41 13 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: debug-labs-keys-dispatch
  cancel-in-progress: false

env:
  # Temporary REST budget attribution: one gh-call line per GitHub API call (scripts/ci/api_call_log/env.sh, fetched at a fixed commit when the checkout has no copy).
  BASH_ENV: '$({ w="${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh"; t="${RUNNER_TEMP:-/nonexistent}/api-call-log-src"; if [ -f "$w" ]; then echo "$w"; elif [ -n "${RUNNER_TEMP:-}" ]; then if [ ! -f "$t/env.sh" ] && [ ! -e "$t.tried" ] && { [ "${RUNNER_OS:-}" = Linux ] || [ "${RUNNER_OS:-}" = macOS ]; } && [ "$(date -u +%Y%m%d%H)" -lt 2026112300 ]; then : > "$t.tried"; mkdir -p "$t.part" && for x in env.sh gh sitecustomize.py isolated.py; do curl -fsSL --max-time 5 -o "$t.part/$x" "https://raw.githubusercontent.com/manaflow-ai/cmux/27647ffd3ae838c63be28ca3e5883dcd68c34518/scripts/ci/api_call_log/$x" || break; done; [ -s "$t.part/isolated.py" ] && mv "$t.part" "$t"; fi; if [ -f "$t/env.sh" ]; then echo "$t/env.sh"; else echo unset BASH_ENV > "$t.off.sh" && echo "$t.off.sh"; fi; fi; } 2>/dev/null)'

jobs:
  dispatch:
    if: github.repository == 'manaflow-ai/cmux'
    # It holds the cmux-bot App key, so no variable may move it (tests/test_ci_fork_runner_routing.py).
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || 'blacksmith-4vcpu-ubuntu-2404' }}
    permissions:
      actions: write
      contents: read
    timeout-minutes: 20
    env:
      # A scheduled job's GitHub API waits stop here and fail loud (scripts/ci/gh_budget_wait.sh).
      GH_BUDGET_WAIT_MAX_SECONDS: "900"
    steps:
      # This commit's GitHub API wait (scripts/ci/gh_budget_wait.sh): every later gh call, and
      # each github-script step that installs gh_budget_wait.cjs, waits through a rate limit or a
      # GitHub 5xx under the job's GH_BUDGET_WAIT_MAX_SECONDS, then fails loud.
      - name: Checkout the GitHub API wait
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: .gh-budget-tooling
          sparse-checkout: |
            scripts/ci/gh_budget_wait.sh
            scripts/ci/gh_budget_wait.cjs
          sparse-checkout-cone-mode: false
      - name: Wait through GitHub API rate limits and 5xx in this job
        working-directory: ${{ github.workspace }}
        run: bash .gh-budget-tooling/scripts/ci/gh_budget_wait.sh --install

      # Two hourly REST budgets instead of one: the cmux-bot installation's, then github.token's for reads
      # (gh_budget_wait.cjs `spare`). github.token's budget is shared with every workflow in the repo, and a
      # rate-limited read on it alone turned main red for a day (runs 45791594489, 45809391120, 45804008279,
      # 45831824446, 45944569896: "the budget resets in ...s, past this job's 900s left to wait").
      - name: Mint the cmux-bot token
        id: cmux-bot-token
        if: vars.CMUX_BOT_APP_ID != ''
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.CMUX_BOT_APP_ID }}
          private-key: ${{ secrets.CMUX_BOT_APP_KEY }}
          permission-actions: write
          permission-contents: read

      - name: Start the Debug and Labs keys report on feat-cmux-next unless one is pending
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SPARE_READ_TOKEN: ${{ steps.cmux-bot-token.outputs.token && github.token || '' }}
        with:
          github-token: ${{ steps.cmux-bot-token.outputs.token || github.token }}
          script: |
            if (process.env.GH_BUDGET_WAIT_JS) require(process.env.GH_BUDGET_WAIT_JS).install({ github, core, spare: process.env.SPARE_READ_TOKEN ? getOctokit(process.env.SPARE_READ_TOKEN) : undefined });
            const { owner, repo } = context.repo;
            const source = 'feat-cmux-next';
            const workflow = 'debug-labs-keys-report.yml';
            // feat-cmux-next's copy is the one that runs. cmux#54280 moved it to a private repo (2026-11-24), and
            // a dispatch of a ref without the file fails "Workflow does not have 'workflow_dispatch' trigger"
            // (runs 45626408061, 45831824446). Only a 404 skips; any other error fails the job.
            try {
              await github.rest.repos.getContent({ owner, repo, path: `.github/workflows/${workflow}`, ref: source });
            } catch (error) {
              if (error.status !== 404) throw error;
              core.notice(`${source} has no ${workflow} (moved to a private repo in cmux#54280); nothing to start`);
              await core.summary.addRaw(`${source} has no ${workflow}; the Debug and Labs keys report was not started.\n`).write();
              return;
            }
            for (const status of ['queued', 'in_progress', 'waiting', 'pending', 'requested']) {
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner, repo, workflow_id: workflow, branch: source, status, per_page: 5,
              });
              if (data.total_count > 0) {
                core.notice(`A Debug and Labs keys report run is already ${status} (run ${data.workflow_runs[0].id}); nothing to start`);
                return;
              }
            }
            await github.rest.actions.createWorkflowDispatch({
              owner, repo, workflow_id: workflow,
              // Fully qualified: a tag named feat-cmux-next must never be picked.
              ref: `refs/heads/${source}`,
            });
            core.notice(`Started the Debug and Labs keys report on ${source}`);
