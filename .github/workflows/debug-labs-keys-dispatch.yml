name: Debug and Labs keys report dispatcher

# Leo, 2026-11-05, on the ranked list whose move 10 is "Flip or delete Debug/Labs flags after 7 days":
# "i meant can you do all of htem". feat-cmux-next's debug-labs-keys-report.yml lists every Debug
# Settings and Labs key in cmux NEXT older than a week with its owner and case, as one issue. It lives
# only on feat-cmux-next, and scheduled workflows run only from the default branch, so once a day this
# file on main starts it there, unless a run is already pending. Report only.
on:
  schedule:
    - cron: "41 13 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: debug-labs-keys-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    if: github.repository == 'manaflow-ai/cmux'
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    permissions:
      actions: write
      contents: read
    timeout-minutes: 5
    steps:
      - name: Start the Debug and Labs keys report on feat-cmux-next unless one is pending
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const source = 'feat-cmux-next';
            const workflow = 'debug-labs-keys-report.yml';
            for (const status of ['queued', 'in_progress', 'waiting', 'pending', 'requested']) {
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner, repo, workflow_id: workflow, branch: source, status, per_page: 5,
              });
              if (data.total_count > 0) {
                core.notice(`A Debug and Labs keys report run is already ${status} (run ${data.workflow_runs[0].id}); nothing to start`);
                return;
              }
            }
            await github.rest.actions.createWorkflowDispatch({
              owner, repo, workflow_id: workflow,
              // Fully qualified: a tag named feat-cmux-next must never be picked.
              ref: `refs/heads/${source}`,
            });
            core.notice(`Started the Debug and Labs keys report on ${source}`);
