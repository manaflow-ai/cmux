name: cmux-next agent connection chaos

# The agent connection chaos suite (scripts/cmux-next/agent-conn-chaos/CONTRACT.md) on a fleet Mac, for each pull
# request that touches the link between the chat pane and the acpmux daemon. The suite updates the app, kills the
# daemon and the app, hangs the daemon, stops both (a sleep simulation) and takes the socket and port away
# mid-turn, and fails when the link does not come back by itself, the page shows an error or Retry, or a turn is
# lost or doubled. One fleet step (--class light --display); the entry script (scripts/measure/agent-conn-chaos.sh) refuses the
# reserved hosts by name, and the suite kills only its own tagged app and that app's daemon.
#
# Every pull request into feat-cmux-next triggers it (no `paths:`), so the check always reports and can be made
# required. The `route` job (Linux, seconds, a trees-only checkout) diffs the merge commit against its base and matches them against
# CONNECTION_PATHS; a pull request that touches none skips the `agent connection chaos` job, which reports
# skipped, a pass.
#
# Admission: the fleet controller runs scripts/measure/agent-conn-chaos.sh at a commit on feat-cmux-next or main
# (any unlisted scripts/measure script, light class), and at a pull request's head only once the script is on its
# ci-step list (hq build-fleet/cmd/controller/ci_step.go); the worker then checks the head did not change the
# script's bytes. Until then a pull request run is refused (HTTP 400) and this job is red, not skipped.

# First landing: dispatch only. The controller refuses a scripts/measure script whose bytes are not yet on
# feat-cmux-next ("a change to it takes effect only after it lands there"), so the pull request that adds the
# script can never run it and its check would be red on every connection-path pull request. The follow-up that
# has a green fleet Mac run at a feat-cmux-next commit restores the trigger:
#   pull_request: {branches: [feat-cmux-next], types: [opened, synchronize, reopened, ready_for_review]}
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "commit sha (40 hex)"
        required: true
      cases:
        description: "cases (comma list; empty: all)"
        default: ""

permissions:
  contents: read

concurrency:
  group: cmux-next-agent-conn-chaos-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  route:
    name: agent connection chaos route
    if: github.event_name == 'pull_request'
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || 'cmux-linux' }}
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      run: ${{ steps.route.outputs.run }}
    steps:
      # The merge commit, trees only: HEAD^1 is the base it merges into. A git fetch, not the REST API, whose
      # installation quota ran out under this job on 2026-11-27 (HTTP 403 "API rate limit exceeded").
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 2
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/cmux-next-agent-conn-chaos.yml
      - id: route
        env:
          # fnmatch patterns (a `*` also matches `/`): the connection path and the suite itself.
          CONNECTION_PATHS: >-
            cmux-tui/crates/acpmux/*
            Packages/macOS/CmuxNext/Sources/CmuxNextAgentPane/*
            webviews/src/agent-session/*
            webviews/src/pane/*
            scripts/cmux-next/agent-conn-chaos/*
            scripts/measure/agent-conn-chaos.sh
            scripts/cmux-next/bench_memory.py
            scripts/cmux-next/bench_power.py
            scripts/cmux-next/bench_relaunch_reconnect.py
            scripts/cmux-next/idle_cost_load.py
            .github/workflows/cmux-next-agent-conn-chaos.yml
        run: |
          set -uo pipefail
          # A diff that cannot be read runs the suite rather than skip it.
          if ! git diff --name-only HEAD^1 HEAD > "$RUNNER_TEMP/files.txt"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "could not read the pull request's diff: the chaos suite runs"
            exit 0
          fi
          hit="$(python3 -I -c '
          import fnmatch, os, sys
          pats = os.environ["CONNECTION_PATHS"].split()
          files = open(sys.argv[1]).read().split()
          print(next((f for f in files if any(fnmatch.fnmatch(f, p) for p in pats)), ""))
          ' "$RUNNER_TEMP/files.txt")" || hit="(the matcher failed)"
          if [[ -n "$hit" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "touches the agent connection path ($hit and maybe more): the chaos suite runs"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "touches no agent connection path ($(wc -l < "$RUNNER_TEMP/files.txt") files): the chaos suite is skipped"
          fi

  # The job id ends in -fleet: the gateway runner's job-started hook admits only thin cmux-ci clients, and a
  # home-repository job id ending in -fleet is the contract it knows them by. The bare id `chaos` was refused there.
  chaos-fleet:
    name: agent connection chaos
    needs: route
    if: >-
      !cancelled() && github.repository_owner == 'manaflow-ai' && vars.CI_EVAL_STEP_GATEWAY != '' &&
      (github.event_name != 'pull_request' || (needs.route.outputs.run == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || 'mac-gateway' }} # frozen-label: CI_EVAL_STEP_GATEWAY (cmux#54437)
    timeout-minutes: 120
    permissions: {}
    steps:
      # No checkout: the gateway runner takes only thin cmux-ci clients. The fleet Mac checks the sha out itself.
      - name: chaos suite on a fleet Mac
        env:
          SHA: ${{ github.event.pull_request.head.sha || inputs.ref }}
          CASES: ${{ inputs.cases }}
        run: |
          set -uo pipefail
          client="${CMUX_CI_CLIENT:-$HOME/.local/bin/cmux-ci}"
          if ! [[ -x "$client" ]]; then
            echo "::error title=Build fleet client missing::$client is not installed on runner $RUNNER_NAME; nothing was run."
            exit 127
          fi
          if ! [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error title=Agent connection chaos::'$SHA' is not a 40-hex commit sha"
            exit 1
          fi
          extra=()
          if [[ -n "$CASES" ]]; then
            [[ "$CASES" =~ ^[a-z,-]+$ ]] || { echo "::error::cases must be a comma list of case names"; exit 1; }
            extra=(--arg="--cases=$CASES")
          fi
          out="$RUNNER_TEMP/chaos"
          mkdir -p "$out"
          status=0
          "$client" run --class light --display \
            --script scripts/measure/agent-conn-chaos.sh --ref "$SHA" --timeout 5400 \
            --key "agent-conn-chaos-$SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --artifact artifacts/agent-conn-chaos/result.json ${extra[@]+"${extra[@]}"} \
            2>&1 | tee "$out/step.log" || status=1
          step="$(grep -o -E '\b[0-9a-f]{24}\b' "$out/step.log" | head -1)"
          if [[ -n "$step" ]]; then
            "$client" artifact "$step" "$out/result.json" || "$client" artifact --failed "$step" "$out/result.json" || true
          fi
          {
            echo "## Agent connection chaos at ${SHA:0:12}"
            sed -n '/AGENT-CONN-CHAOS-TABLE-BEGIN/,/AGENT-CONN-CHAOS-TABLE-END/p' "$out/step.log" | grep -v 'TABLE-' || echo "no table: see the log"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Upload the result
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-conn-chaos-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/chaos/
          if-no-files-found: warn
