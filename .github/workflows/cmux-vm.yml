      # (DEV_TEST_TENANT_IDS), create, exec, pause and delete by exact id.
      - name: Smoke the production Worker (service key, dev/test team)
        if: steps.gate.outputs.enabled == 'true' && steps.gate.outputs.service_key == 'true'
        continue-on-error: true
        env:
          CMUX_VM_SMOKE_URL: ${{ vars.CMUX_VM_PRODUCTION_URL }}
          # Optional (cx-b4h.13): a service key limited to role=chief and to this synthetic team.
          CMUX_VM_SMOKE_SERVICE_KEY: ${{ secrets.CMUX_VM_SMOKE_SERVICE_KEY }}
          CMUX_VM_SMOKE_SERVICE_TEAM: ${{ vars.CMUX_VM_SMOKE_SERVICE_TEAM }}
        run: bun scripts/smoke.ts
      # The product create path (scripts/smoke-product.ts): a product team (never-pause -1 idle default) and the approved boot image, as cmux-platform creates. The dev/test leg
      # above passed while every product create answered 503 (cmux#35012). No step-level continue-on-error, so
      # a red shows on the job; the job itself stays non-blocking.
      # No key: the job's GitHub OIDC token (audience: the Worker's origin) maps to the Worker's CMUX_VM_CI_TRUST row
      # ci-product-smoke, its own team and VMs only, at most 2, each paused after 15 minutes and deleted once stopped.
      - name: Smoke the product create path (CI OIDC principal, product team, approved boot image)
        if: steps.gate.outputs.enabled == 'true'
        env:
          CMUX_VM_SMOKE_URL: ${{ vars.CMUX_VM_PRODUCTION_URL }}
          CMUX_VM_SMOKE_IMAGE: ${{ vars.CMUX_VM_SMOKE_IMAGE }}
          CMUX_VM_SMOKE_IMAGE_REVISION: ${{ vars.CMUX_VM_SMOKE_IMAGE_REVISION }}
        run: bun scripts/smoke-product.ts

  tail-production:
    # Action tail-production: streams the production Worker's live events (`wrangler tail`) for tail_minutes,
    # so a 503 "temporarily unavailable" shows the dependency behind it while someone reproduces it. Only the
    # Cloudflare secrets are read, in cmux-vm-production like the deploy (a dispatchable job that reads a secret
    # names its environment, tests/test_supplychain_security.py). Printed per event:
    # time, method, path, status, outcome, Durable Object RPC, log lines and exceptions (scripts/tail-filter.mjs);
    # no headers, bodies or query strings, emails redacted.
    name: tail production
    # feat-cmux-next only: the job runs checked-out code (bun install, the filter) with the Cloudflare token.
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'tail-production' && github.ref == 'refs/heads/feat-cmux-next'
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-4vcpu-ubuntu-2404' || vars.LINUX_RUNNER || fromJSON(vars.RUNNER_POOLS).linux_4 }}
    timeout-minutes: 30
    environment: cmux-vm-production
    defaults:
      run:
        working-directory: workers/cmux-vm
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
      - run: bun install --frozen-lockfile
      - name: Tail cmux-vm-production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MINUTES: ${{ inputs.tail_minutes }}
        run: |
          set -euo pipefail
          minutes="${MINUTES:-10}"
          case "$minutes" in ''|*[!0-9]*) minutes=10 ;; esac
          [ "$minutes" -ge 1 ] || minutes=1
          [ "$minutes" -le 25 ] || minutes=25
          echo "tailing cmux-vm-production for ${minutes}m"
          # wrangler prints pretty JSON events on stdout and its banner on stderr; the filter keeps only the
          # summary of each event (no headers or bodies: this log is public).
          # timeout's exit 124 is the normal end of the window; any other failure (auth, wrangler, the filter) fails the job.
          status=0
          timeout "${minutes}m" node_modules/.bin/wrangler tail cmux-vm-production --format json 2> "$RUNNER_TEMP/wrangler-tail.err" \
            | node scripts/tail-filter.mjs || status=$?
          tail -n 5 "$RUNNER_TEMP/wrangler-tail.err" | sed -E 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/<email>/g'
          echo "tail ended"
          [ "$status" = 0 ] || [ "$status" = 124 ] || exit "$status"

  sweep-orphans-production:
    # cmux#35013: provider VMs whose create failed after the provider made them (no ownership row) run and bill
    # unpaused. This lists them and, with dry_run=false, deletes them in the same run (scripts/sweep-orphans.ts lists
    # first, then lists again and deletes). The Worker's cron runs the same sweep every 5 minutes; this is the
    # on-demand run. feat-cmux-next only: the job runs checked-out code with the production provider key and database.
    name: sweep orphan VMs (production)
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'sweep-orphans-production' && github.ref == 'refs/heads/feat-cmux-next'
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-4vcpu-ubuntu-2404' || vars.LINUX_RUNNER || fromJSON(vars.RUNNER_POOLS).linux_4 }}
    timeout-minutes: 20
    environment: cmux-vm-production
    defaults:
      run:
        working-directory: workers/cmux-vm
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      - name: Sweep cmux-vm-production orphans
        env:
          CMUX_VM_ENVIRONMENT: production
          UPSTREAM_API_URL: https://api.freestyle.sh
          CMUX_VM_UPSTREAM_API_KEY: ${{ secrets.CMUX_VM_UPSTREAM_API_KEY }}
          CMUX_VM_DATABASE_URL: ${{ secrets.CMUX_VM_DATABASE_URL }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ "$DRY_RUN" = false ]; then bun scripts/sweep-orphans.ts --delete; else bun scripts/sweep-orphans.ts; fi

  migrate-production:
    # Production cmux_vm migrations (release-rails.md, "Production migrations from CI"): every push to
    # feat-cmux-next and action deploy-production apply them before the deploy (no rehearsal: NEXT production
    # has only our team, Leo 2026-11-03/04); action migrate-production runs them alone, in cmux-vm-production.
    # Shares deploy-production's concurrency group, so a migration and a deploy never overlap. Changes only schema cmux_vm of cmux-prod main and the PlanetScale role cmux-vm-owner.
    name: migrate production (cmux_vm)
    if: >-
      !cancelled() && github.ref == 'refs/heads/feat-cmux-next' && (needs.check.result == 'success' || needs.check.result == 'skipped') &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.action == 'migrate-production' || inputs.action == 'deploy-production')))
    needs: check
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-4vcpu-ubuntu-2404' || vars.LINUX_RUNNER || fromJSON(vars.RUNNER_POOLS).linux_4 }}
    # A rehearsal restores a branch copy (up to 20 min) and an apply rehearses again, plus the PITR wait.
    timeout-minutes: 90
    environment: cmux-vm-production
    concurrency:
      group: cmux-vm-deploy-production
      cancel-in-progress: false
    steps:
      # Fail closed: without the PlanetScale service token nothing runs (no checkout, no install, no read).
      - name: Required secrets
        env:
          DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.action == 'migrate-production' && inputs.dry_run) }}
          HAS_PSCALE_ID: ${{ secrets.PLANETSCALE_SERVICE_TOKEN_ID != '' }}
          HAS_PSCALE_TOKEN: ${{ secrets.PLANETSCALE_SERVICE_TOKEN != '' }}
          HAS_DB: ${{ secrets.CMUX_VM_DATABASE_URL != '' }}
        run: |
          set -euo pipefail
          missing=()
          [ "$HAS_PSCALE_ID" = true ] || missing+=(PLANETSCALE_SERVICE_TOKEN_ID)
          [ "$HAS_PSCALE_TOKEN" = true ] || missing+=(PLANETSCALE_SERVICE_TOKEN)
          [ "$HAS_DB" = true ] || missing+=(CMUX_VM_DATABASE_URL)
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error title=migrate-production::cmux-vm-production lacks ${missing[*]}; nothing ran (PLANETSCALE_SERVICE_TOKEN_ID and PLANETSCALE_SERVICE_TOKEN are a PlanetScale service token of org cmux with access to cmux-prod)"
            exit 1
          fi
          echo "mode: $([ "$DRY_RUN" = true ] && echo 'dry run (inspect, plan, rehearse)' || echo 'APPLY to cmux-prod main, schema cmux_vm')"
      # Full history without blobs: the apply checks HEAD is on origin/feat-cmux-next and the compat gate
      # compares release tags and web revisions by ancestry.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: false # patterns: .github/checkout-lean.json
          sparse-checkout: |
            /*
            !/cmux-next-ios/verify/
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
      - name: Install the release rails
        working-directory: scripts/cmux-next/release
        run: bun install --frozen-lockfile
      - name: Install pscale 0.349.0 (checksum pinned)
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) arch=amd64; sum=139dc952ccdd21e68b3e70c20f48f9adb3559ee62f6fdcd6d42ddf9b086825f7 ;;
            aarch64|arm64) arch=arm64; sum=c319e1f1c6699e0fc1ec455329be241c0c555ef244b0edb0f90751eb5cc13f09 ;;
            *) echo "::error::no pinned pscale for $(uname -m)"; exit 1 ;;
          esac
          dir="$RUNNER_TEMP/pscale"
          mkdir -p "$dir"
          tarball="$dir/pscale.tar.gz"
          curl -fsSL --retry 3 -o "$tarball" "https://github.com/planetscale/cli/releases/download/v0.349.0/pscale_0.349.0_linux_${arch}.tar.gz"
          echo "$sum  $tarball" | sha256sum -c -
          tar -xzf "$tarball" -C "$dir" pscale
          "$dir/pscale" version
          echo "PSCALE_BIN=$dir/pscale" >> "$GITHUB_ENV"
      # Production steps run with only the variables they need (release-rails.md, "Hardening 1"): every other
      # exported variable is unset in the subshell first, so nothing else reaches the rails or a child.
      - name: ${{ (github.event_name == 'workflow_dispatch' && inputs.action == 'migrate-production' && inputs.dry_run) && 'Inspect, plan and rehearse (dry run; production unchanged)' || 'Inspect, owner, adopt and apply (production)' }}
        working-directory: scripts/cmux-next/release
        env:
          MODE: ${{ (github.event_name == 'workflow_dispatch' && inputs.action == 'migrate-production' && inputs.dry_run) && 'dry-run' || 'migrate' }}
          CMUX_VM_SKIP_REHEARSAL: ${{ (github.event_name == 'push' || inputs.action == 'deploy-production' || inputs.skip_rehearsal) && 'true' || 'false' }}
          PLANETSCALE_SERVICE_TOKEN_ID: ${{ secrets.PLANETSCALE_SERVICE_TOKEN_ID }}
          PLANETSCALE_SERVICE_TOKEN: ${{ secrets.PLANETSCALE_SERVICE_TOKEN }}
          CMUX_VM_DATABASE_URL: ${{ secrets.CMUX_VM_DATABASE_URL }}
          CMUX_RELEASE_RECEIPTS_DIR: ${{ runner.temp }}/receipts
        run: |
          set -euo pipefail
          mkdir -p "$CMUX_RELEASE_RECEIPTS_DIR"
          # Shell (unexported) copies: the cleanup below unsets every exported variable not in `keep`.
          mode="$MODE"
          tools="$(dirname "$PSCALE_BIN"):$(dirname "$(command -v bun)"):$(dirname "$(command -v node)")${VERCEL_BIN_DIR:+:$VERCEL_BIN_DIR}"
          keep=" PLANETSCALE_SERVICE_TOKEN_ID PLANETSCALE_SERVICE_TOKEN CMUX_VM_DATABASE_URL CMUX_RELEASE_RECEIPTS_DIR CMUX_VM_SKIP_REHEARSAL PSCALE_BIN HOME GITHUB_ACTIONS GITHUB_RUN_ID GITHUB_RUN_ATTEMPT GITHUB_SHA "
          (
            for v in $(compgen -e); do
              case "$keep" in *" $v "*) ;; *) unset "$v" 2>/dev/null || true ;; esac
            done
            export PATH="$tools:/usr/local/bin:/usr/bin:/bin"
            exec bun prod-owner.ts "$mode"
          )
      - name: Upload the release receipts
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-vm-migrate-production-receipts
          path: ${{ runner.temp }}/receipts
          if-no-files-found: ignore
          retention-days: 90
