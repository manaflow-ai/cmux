          bun ../../scripts/cmux-next/release/worker-release.ts verify --worker cmux-vm-staging
          --url "${URL:-https://vm-staging.cmux.dev}" --routes release-smoke.json
          --previous-file "$RUNNER_TEMP/cmux-vm-previous-version" --changed-since "$BEFORE" --source-dir .
