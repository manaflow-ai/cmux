          CMUX_VM_SERVICE_KEYS_CLOUD_PLATFORM: ${{ secrets.CMUX_VM_SERVICE_KEYS_CLOUD_PLATFORM }}
        run: bash scripts/deploy.sh
      # Runs whenever the deploy step started, also when it failed half way (deploy.sh deploys, then
      # sets secrets: a failed `secret bulk` leaves a version that answers 503 "not configured"), and
      # on a cancel or timeout (always()).
      # Pin the smoke host (scripts/cmux-next/release/pin-host.ts): DoH, IPv4 first, waits up to 300 s for a
      # new domain's record. Runners have no IPv6 route and a fresh domain is NXDOMAIN at first (2026-10-09).
