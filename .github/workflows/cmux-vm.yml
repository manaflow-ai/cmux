          # Optional: more entries appended to CMUX_VM_SERVICE_KEYS (deploy.sh), so a key is added without rewriting it.
          CMUX_VM_SERVICE_KEYS_EXTRA: ${{ secrets.CMUX_VM_SERVICE_KEYS_EXTRA }}
