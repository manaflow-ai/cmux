          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun ../../scripts/cmux-next/release/worker-release.ts previous --worker cmux-vm-staging --wrangler node_modules/.bin/wrangler --out "$RUNNER_TEMP/cmux-vm-previous-version"
