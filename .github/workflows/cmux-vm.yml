          CMUX_DOGFOOD_STACK_PASSWORD: ${{ secrets.CMUX_JOURNEY_PROD_STACK_PASSWORD }}
          PRODUCT_TEAM: ${{ vars.CMUX_JOURNEY_PRODUCT_TEAM }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          bash ../../scripts/cmux-next/cloud-journey-ci.sh
          rc=$?
          set -e
          if [ "$rc" != 3 ]; then exit 0; fi
          previous="$(cat "$RUNNER_TEMP/cmux-vm-previous-version" 2>/dev/null || true)"
          if [ -z "$previous" ]; then
            echo "::error title=Cloud journey::the deploy turned journey steps red and no previous version is recorded; fix forward now"
            exit 1
          fi
          node_modules/.bin/wrangler rollback "$previous" --name cmux-vm-production -y --message "auto-rollback: Cloud journey red"
          echo "::error title=Cloud journey::the deploy turned journey steps red; rolled cmux-vm-production back to $previous"
          exit 1

  # The Cloud journey on production right after a deploy, as the production agent test account. That pair is in
  # cmux-next-cloud-journey (as in backend.yml's journey-production), not in cmux-vm-production, whose journey steps
  # above say "not run" until it holds CMUX_JOURNEY_PROD_STACK_*. This job proves the deploy (its verdict
  # annotation is what cmuxterm-hq's cloud_deploy_gate reads, within 5 min of the deploy); it does not roll back.
  # It takes no deploy lock: a queued job in that concurrency group would cancel a queued deploy. Instead the gate
  # proves no deploy with a journey that finished after a later production deploy.
  journey-production:
    needs: deploy-production
    # Never after a rollback: a journey on the previous version would prove the deploy it replaced.
    if: >-
      (!cancelled() && needs.deploy-production.result == 'success' && needs.deploy-production.outputs.deployed == 'success') &&
      !(github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'feat-cmux-next' && (github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name != 'cmux-vm-breaking-change-ok')
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-4vcpu-ubuntu-2404' || vars.LINUX_RUNNER || fromJSON(vars.RUNNER_POOLS).linux_4 }}
    # The full lifecycle journey's waits; cloud-journey-prod.yml allows the same.
    timeout-minutes: 30
    environment: cmux-next-cloud-journey
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/cmux-next
            Packages/macOS/CmuxNext/Sources/CmuxNextCloudCredentials
            tests/fixtures/model-stub
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
      - name: Cloud journey (prod, after the deploy)
        env:
          JOURNEY_MODEL: stub
          TARGET: prod
          CMUX_DOGFOOD_STACK_EMAIL: ${{ secrets.CMUX_DOGFOOD_STACK_EMAIL }}
          CMUX_DOGFOOD_STACK_PASSWORD: ${{ secrets.CMUX_DOGFOOD_STACK_PASSWORD }}
          PRODUCT_TEAM: ${{ vars.CMUX_JOURNEY_PRODUCT_TEAM }}
        run: bash scripts/cmux-next/cloud-journey-ci.sh

  smoke-production:
    # After deploy-production, or alone (action smoke-production: the live version, no deploy, no rollback).
    # This is diagnostic only and never blocks the feature branch or nightly.
    continue-on-error: true
    if: >-
      !cancelled() && github.ref == 'refs/heads/feat-cmux-next' &&
      ((github.event_name == 'workflow_dispatch' && inputs.action == 'smoke-production') ||
      ((github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.action == 'deploy-production')) && needs.deploy-production.result == 'success'))
    needs: deploy-production
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-4vcpu-ubuntu-2404' || vars.LINUX_RUNNER || fromJSON(vars.RUNNER_POOLS).linux_4 }}
    timeout-minutes: 15
    environment: cmux-vm-production
    # id-token: the product smoke authenticates with this job's GitHub OIDC token (workers/cmux-vm/src/auth/ci-trust.ts).
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: cmux-vm-smoke-production
      cancel-in-progress: false
    # The product create's own outcome (before the job-level continue-on-error), which image-roll-settle reads.
    outputs:
      product: ${{ steps.product.outcome }}
      boot_image: ${{ steps.product.outputs.boot_image }}
      done_at: ${{ steps.product.outputs.done_at }}
    defaults:
      run:
        working-directory: workers/cmux-vm
    steps:
      - id: gate
        working-directory: .
        env:
          ENABLED: ${{ vars.CMUX_VM_DEPLOY_ENABLED }}
          URL: ${{ vars.CMUX_VM_PRODUCTION_URL }}
          HAS_KEY: ${{ secrets.CMUX_VM_SMOKE_SERVICE_KEY != '' }}
        run: |
          # The product smoke needs no key (OIDC); only the dev/test service leg needs CMUX_VM_SMOKE_SERVICE_KEY.
          echo "service_key=$HAS_KEY" >> "$GITHUB_OUTPUT"
          [ "$HAS_KEY" = true ] || echo "::notice::No CMUX_VM_SMOKE_SERVICE_KEY in cmux-vm-production: the dev/test service leg is skipped."
          if [ "$ENABLED" = 1 ] && [ -n "$URL" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::error::Production smoke cannot run: needs CMUX_VM_DEPLOY_ENABLED=1 and CMUX_VM_PRODUCTION_URL in cmux-vm-production."
            exit 1
          fi
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        if: steps.gate.outputs.enabled == 'true'
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: steps.gate.outputs.enabled == 'true'
        with:
          bun-version: "1.4.4"
      # Pin the smoke host (scripts/cmux-next/release/pin-host.ts): DoH, IPv4 first, waits up to 300 s for a
      # new domain's record. Runners have no IPv6 route and a fresh domain is NXDOMAIN at first (2026-10-09).
      - name: Pin the smoke host's address
        if: steps.gate.outputs.enabled == 'true'
        continue-on-error: true
        working-directory: .
        env:
          URL: ${{ vars.CMUX_VM_PRODUCTION_URL }}
        run: |
          host="${URL:-https://vm.cmux.dev}"; host="${host#https://}"; host="${host%%/*}"
          line="$(bun scripts/cmux-next/release/pin-host.ts --host "$host" --wait-seconds 300)"
          echo "$line" | sudo tee -a /etc/hosts
      # Smoke-only runs (and after a deploy, again): every route; no previous version is passed, so a red
      # result fails the job and never rolls back.
      - name: Smoke health and every route (no rollback)
        if: steps.gate.outputs.enabled == 'true'
        continue-on-error: true
        env:
          URL: ${{ vars.CMUX_VM_PRODUCTION_URL }}
        run: >-
          bun ../../scripts/cmux-next/release/worker-release.ts verify --worker cmux-vm-production
          --url "${URL:-https://vm.cmux.dev}" --routes release-smoke.json --source-dir .
      # Production has no tenant smoke key: the service leg alone, on a synthetic dev/test team
      # (DEV_TEST_TENANT_IDS), create, exec, pause and delete by exact id.
      - name: Smoke the production Worker (service key, dev/test team)
        if: steps.gate.outputs.enabled == 'true' && steps.gate.outputs.service_key == 'true'
        continue-on-error: true
        env:
          CMUX_VM_SMOKE_URL: ${{ vars.CMUX_VM_PRODUCTION_URL }}
          # Optional (cx-b4h.13): a service key limited to role=chief and to this synthetic team.
          CMUX_VM_SMOKE_SERVICE_KEY: ${{ secrets.CMUX_VM_SMOKE_SERVICE_KEY }}
          CMUX_VM_SMOKE_SERVICE_TEAM: ${{ vars.CMUX_VM_SMOKE_SERVICE_TEAM }}
        run: bun scripts/smoke.ts
      # The product create path (scripts/smoke-product.ts): a product team (never-pause -1 idle default) and the approved boot image, as cmux-platform creates. The dev/test leg
      # above passed while every product create answered 503 (cmux#35012). No step-level continue-on-error, so
      # a red shows on the job; the job itself stays non-blocking.
      # No key: the job's GitHub OIDC token (audience: the Worker's origin) maps to the Worker's CMUX_VM_CI_TRUST row
      # ci-product-smoke, its own team and VMs only, at most 2, each paused after 15 minutes and deleted once stopped.
      # On an image roll or rollback commit (cloud-vm-image-roll.yml, image-roll-settle) and a rollback's retried
      # deploy it boots the first image, whatever CMUX_VM_SMOKE_IMAGE names: that boot is the production check.
      - name: Smoke the product create path (CI OIDC principal, product team, approved boot image)
        id: product
        if: steps.gate.outputs.enabled == 'true'
        env:
          CMUX_VM_SMOKE_URL: ${{ vars.CMUX_VM_PRODUCTION_URL }}
          CMUX_VM_SMOKE_IMAGE: "${{ !startsWith(github.event.head_commit.message, 'cmux-vm: image roll') && inputs.image_rollback == '' && vars.CMUX_VM_SMOKE_IMAGE || '' }}"
          CMUX_VM_SMOKE_IMAGE_REVISION: "${{ !startsWith(github.event.head_commit.message, 'cmux-vm: image roll') && inputs.image_rollback == '' && vars.CMUX_VM_SMOKE_IMAGE_REVISION || '' }}"
        run: bun scripts/smoke-product.ts

  # After an image roll commit's production deploy and smoke (cloud-vm-image-roll.yml, subject "cmux-vm: image
  # roll "), and after each production deploy of a rollback (subject "cmux-vm: image rollback ", or the
  # deploy-production dispatch with image_rollback this job sends). `auto-roll.ts settle` decides:
  #   roll      green (the product create booted the image) records it. Anything else (failed, cancelled, timed
  #             out, skipped) lands a rollback commit that takes the image out of both lists
  #             (image-roll-push.sh rollback), first or not, so a newer roll's own rollback can never bring it
  #             back; only an image already gone from both lists needs nothing. A cancel proves nothing: the
  #             deploy queue never cancels a running deploy, so a cancel is a person or a timeout.
  #   rollback  verified when the deployed list no longer has the image and the create booted its first entry.
  #             Otherwise it dispatches deploy-production again, at most ROLLBACK_DEPLOYS deploys in all, then
  #             records rollback_failed and comments on the cloud-image-roll issue. It never lands another
  #             rollback commit, so a rollback cannot loop.
  image-roll-settle:
    needs: [deploy-production, smoke-production]
    if: >-
      always() && github.repository == 'manaflow-ai/cmux' && github.ref == 'refs/heads/feat-cmux-next' &&
      ((github.event_name == 'push' && startsWith(github.event.head_commit.message, 'cmux-vm: image roll')) ||
      (github.event_name == 'workflow_dispatch' && inputs.action == 'deploy-production' && inputs.image_rollback != '')) &&
      !(github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'feat-cmux-next' && (github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name != 'cmux-vm-breaking-change-ok')
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-4vcpu-ubuntu-2404' || vars.LINUX_RUNNER || fromJSON(vars.RUNNER_POOLS).linux_4 }}
    timeout-minutes: 15
    # The push App key is a repository secret; the environment (feat-cmux-next only) bounds who can reach it.
    environment: cmux-vm-production
    # actions: write dispatches a rollback's retried deploy (gh workflow run cmux-vm.yml).
    permissions:
      actions: write
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: feat-cmux-next
          fetch-depth: 50
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
      - name: Read the roll
        id: roll
        env:
          EVENT: ${{ github.event_name }}
          MESSAGE: ${{ github.event.head_commit.message }}
          IN_IMAGE: ${{ inputs.image_rollback }}
          IN_RUN: ${{ inputs.image_roll_run }}
          IN_ATTEMPT: ${{ inputs.image_rollback_attempt }}
          DEPLOY: ${{ needs.deploy-production.result }}
          PRODUCT: ${{ needs.smoke-production.outputs.product }}
          BOOT: ${{ needs.smoke-production.outputs.boot_image }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = push ]; then
            run="$(sed -n 's/^Image-Roll-Run: \([0-9]\{1,20\}\)$/\1/p' <<< "$MESSAGE" | tail -1)"
            image="$(sed -n 's/^Image-Roll-Image: \(cloud-native-auto-[a-z0-9-]\{1,44\}\)$/\1/p' <<< "$MESSAGE" | tail -1)"
            kind=roll attempt=1
            if [[ "$MESSAGE" == "cmux-vm: image rollback "* ]]; then kind=rollback; fi
          else
            run="$IN_RUN" image="$IN_IMAGE" kind=rollback attempt="$IN_ATTEMPT"
            [[ "$run" =~ ^[0-9]{1,20}$ && "$image" =~ ^cloud-native-auto-[a-z0-9-]{1,44}$ && "$attempt" =~ ^[1-9][0-9]?$ ]] \
              || { echo "::error title=Image roll::bad image_rollback, image_roll_run or image_rollback_attempt"; exit 1; }
          fi
          [ -n "$run" ] && [ -n "$image" ] || { echo "::error title=Image roll::the commit has no Image-Roll-Run or Image-Roll-Image trailer"; exit 1; }
          # Written first: if the decision below fails, the record step still runs and is loud (no outcome is never green).
          { echo "run=$run"; echo "image=$image"; echo "kind=$kind"; echo "attempt=$attempt"; } >> "$GITHUB_OUTPUT"
          # What this run deployed (github.sha) and what the tip says now (the checkout).
          git fetch -q --depth 1 origin "$GITHUB_SHA" || true
          git show "${GITHUB_SHA}:workers/cmux-vm/wrangler.jsonc" > "$RUNNER_TEMP/deployed-wrangler.jsonc"
          bun images/cmux-vm/auto-roll.ts settle --kind "$kind" --image "$image" --deploy "$DEPLOY" --product "$PRODUCT" \
            --boot-image "$BOOT" --attempt "$attempt" --deployed-wrangler "$RUNNER_TEMP/deployed-wrangler.jsonc" > "$RUNNER_TEMP/settle.json"
          cat "$RUNNER_TEMP/settle.json"
          outcome="$(jq -r .outcome "$RUNNER_TEMP/settle.json")"
          { echo "outcome=$outcome"; echo "next=$(jq -r .nextAttempt "$RUNNER_TEMP/settle.json")"; } >> "$GITHUB_OUTPUT"
          echo "Image ${kind} ${run} (${image}): ${outcome}. $(jq -r .reason "$RUNNER_TEMP/settle.json")." | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Mint the push token
        id: push-token
        if: steps.roll.outputs.outcome == 'rollback'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.CMUX_PR_AUTOFIX_APP_ID }}
          private-key: ${{ secrets.CMUX_PR_AUTOFIX_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
      - name: Roll the image back
        id: rollback
        if: steps.roll.outputs.outcome == 'rollback'
        env:
          TOKEN: ${{ steps.push-token.outputs.token }}
          IMAGE: ${{ steps.roll.outputs.image }}
          ROLL: ${{ steps.roll.outputs.run }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          {
            echo "cmux-vm: image rollback ${IMAGE} (production deploy or smoke red on ${GITHUB_SHA:0:12})"
            echo
            echo "The production deploy or the product create on ${IMAGE} was not green in ${RUN_URL}; the image leaves"
            echo "VM_BOOT_IMAGES and the entry before it boots again."
            echo
            echo "Image-Roll-Run: ${ROLL}"
            echo "Image-Roll-Image: ${IMAGE}"
            echo "Image-Roll-Rollback-Of: ${GITHUB_SHA}"
          } > "$RUNNER_TEMP/message.txt"
          images/cmux-vm/image-roll-push.sh rollback --image "$IMAGE" --message-file "$RUNNER_TEMP/message.txt" | tee "$RUNNER_TEMP/rollback.out"
          tail -1 "$RUNNER_TEMP/rollback.out" | sed 's/^/Rollback: /' >> "$GITHUB_STEP_SUMMARY"
      # A rollback not yet verified: deploy production again (the tip, which no longer has the image first) and
      # settle that deploy the same way, with the next attempt number.
      - name: Deploy the rollback again
        id: retry
        if: steps.roll.outputs.outcome == 'retry'
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ steps.roll.outputs.image }}
          ROLL: ${{ steps.roll.outputs.run }}
          NEXT: ${{ steps.roll.outputs.next }}
        run: |
          set -euo pipefail
          gh workflow run cmux-vm.yml --repo "$GITHUB_REPOSITORY" --ref feat-cmux-next -f action=deploy-production \
            -f image_rollback="$IMAGE" -f image_roll_run="$ROLL" -f image_rollback_attempt="$NEXT"
          echo "::warning title=Image rollback::${IMAGE}'s rollback is not verified yet; production deploy ${NEXT} dispatched"
      - name: Record the production smoke and any rollback
        if: always() && steps.roll.outputs.run != ''
        env:
          TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          ROLL: ${{ steps.roll.outputs.run }}
          IMAGE: ${{ steps.roll.outputs.image }}
          KIND: ${{ steps.roll.outputs.kind }}
          ATTEMPT: ${{ steps.roll.outputs.attempt }}
          OUTCOME: ${{ steps.roll.outputs.outcome }}
          DEPLOY: ${{ needs.deploy-production.result }}
          PRODUCT: ${{ needs.smoke-production.outputs.product }}
          BOOT: ${{ needs.smoke-production.outputs.boot_image }}
          SMOKE_DONE_AT: ${{ needs.smoke-production.outputs.done_at }}
          ROLLBACK: ${{ steps.rollback.outputs.result }}
          ROLLBACK_SHA: ${{ steps.rollback.outputs.sha }}
          RETRY: ${{ steps.retry.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # A retry whose dispatch failed leaves nothing to verify the rollback: as loud as rollback_failed.
          if [ "$OUTCOME" = retry ] && [ "$RETRY" != success ]; then OUTCOME=rollback_failed; fi
          seen="deploy ${DEPLOY:-none}, product smoke ${PRODUCT:-not run}, booted ${BOOT:-nothing}"
          if [ "$KIND" = roll ]; then
            jq -n --arg now "$now" --arg run "$RUN_URL" --arg commit "$GITHUB_SHA" --arg deploy "$DEPLOY" --arg product "${PRODUCT:-}" \
              --arg boot "${BOOT:-}" --arg outcome "$OUTCOME" --arg rollback "${ROLLBACK:-}" --arg rollback_sha "${ROLLBACK_SHA:-}" \
              --arg smoke_done "${SMOKE_DONE_AT:-$now}" \
              '{production: {commit: $commit, run: $run, deploy: $deploy, product_smoke: (if $product == "" then "not-run" else $product end), boot_image: $boot,
                  smoke_done_at: $smoke_done, green: ($outcome == "green"), superseded: ($outcome == "superseded")},
                rolled_back: ($rollback == "pushed"),
                rollback: (if $outcome != "rollback" then null else {result: (if $rollback == "" then "failed" else $rollback end), commit: $rollback_sha, at: $now} end)}' \
              | bash images/cmux-vm/image-roll-record.sh "$ROLL" || echo "::warning title=Image roll record::the record was not written"
            case "$OUTCOME" in green|superseded) exit 0 ;; esac
            what="${IMAGE} was not green in production (${seen}); rollback: ${ROLLBACK:-failed}"
          else
            jq -n --arg now "$now" --arg run "$RUN_URL" --arg commit "$GITHUB_SHA" --arg deploy "$DEPLOY" --arg product "${PRODUCT:-}" \
              --arg boot "${BOOT:-}" --arg outcome "$OUTCOME" --arg attempt "$ATTEMPT" \
              '{rollback: {result: (if $outcome == "retry" then "retrying" else $outcome end),
                  deploys: {($attempt): {commit: $commit, run: $run, deploy: $deploy, product_smoke: (if $product == "" then "not-run" else $product end), boot_image: $boot, at: $now}}},
                rollback_failed: ($outcome == "rollback_failed")}' \
              | bash images/cmux-vm/image-roll-record.sh "$ROLL" || echo "::warning title=Image roll record::the record was not written"
            case "$OUTCOME" in verified|retry) exit 0 ;; esac
            what="the rollback of ${IMAGE} is not verified after production deploy ${ATTEMPT} (${seen}); production may still boot it: rollback_failed"
          fi
          echo "::error title=Cloud VM image roll::${what}"
          body="Cloud VM image roll ${ROLL}: ${what}. ${RUN_URL}"
          issue="$(gh issue list --repo "$GITHUB_REPOSITORY" --label cloud-image-roll --state open --limit 1 --json number --jq '.[0].number // empty' || true)"
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh label create cloud-image-roll --repo "$GITHUB_REPOSITORY" --color B60205 --description "Cloud VM image roll gate, promotion or rollback" --force > /dev/null || true
            gh issue create --repo "$GITHUB_REPOSITORY" --label cloud-image-roll --title "Cloud VM image roll is red" --body "$body" \
              || gh issue create --repo "$GITHUB_REPOSITORY" --title "Cloud VM image roll is red" --body "$body"
          fi
          exit 1

  tail-production:
    # Action tail-production: streams the production Worker's live events (`wrangler tail`) for tail_minutes,
    # so a 503 "temporarily unavailable" shows the dependency behind it while someone reproduces it. Only the
    # Cloudflare secrets are read, in cmux-vm-production like the deploy (a dispatchable job that reads a secret
    # names its environment, tests/test_supplychain_security.py). Printed per event:
    # time, method, path, status, outcome, Durable Object RPC, log lines and exceptions (scripts/tail-filter.mjs);
    # no headers, bodies or query strings, emails redacted.
    name: tail production
    # feat-cmux-next only: the job runs checked-out code (bun install, the filter) with the Cloudflare token.
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'tail-production' && github.ref == 'refs/heads/feat-cmux-next'
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-4vcpu-ubuntu-2404' || vars.LINUX_RUNNER || fromJSON(vars.RUNNER_POOLS).linux_4 }}
    timeout-minutes: 30
    environment: cmux-vm-production
    defaults:
      run:
        working-directory: workers/cmux-vm
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
      - run: bun install --frozen-lockfile
      - name: Tail cmux-vm-production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MINUTES: ${{ inputs.tail_minutes }}
        run: |
          set -euo pipefail
          minutes="${MINUTES:-10}"
          case "$minutes" in ''|*[!0-9]*) minutes=10 ;; esac
          [ "$minutes" -ge 1 ] || minutes=1
          [ "$minutes" -le 25 ] || minutes=25
          echo "tailing cmux-vm-production for ${minutes}m"
          # wrangler prints pretty JSON events on stdout and its banner on stderr; the filter keeps only the
          # summary of each event (no headers or bodies: this log is public).
          # timeout's exit 124 is the normal end of the window; any other failure (auth, wrangler, the filter) fails the job.
          status=0
          timeout "${minutes}m" node_modules/.bin/wrangler tail cmux-vm-production --format json 2> "$RUNNER_TEMP/wrangler-tail.err" \
            | node scripts/tail-filter.mjs || status=$?
          tail -n 5 "$RUNNER_TEMP/wrangler-tail.err" | sed -E 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/<email>/g'
          echo "tail ended"
          [ "$status" = 0 ] || [ "$status" = 124 ] || exit "$status"

  sweep-orphans-production:
    # cmux#35013: provider VMs whose create failed after the provider made them (no ownership row) run and bill
    # unpaused. This lists them and, with dry_run=false, deletes them in the same run (scripts/sweep-orphans.ts lists
    # first, then lists again and deletes). The Worker's cron runs the same sweep every 5 minutes; this is the
    # on-demand run. feat-cmux-next only: the job runs checked-out code with the production provider key and database.
    name: sweep orphan VMs (production)
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'sweep-orphans-production' && github.ref == 'refs/heads/feat-cmux-next'
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-4vcpu-ubuntu-2404' || vars.LINUX_RUNNER || fromJSON(vars.RUNNER_POOLS).linux_4 }}
    timeout-minutes: 20
    environment: cmux-vm-production
    defaults:
      run:
        working-directory: workers/cmux-vm
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      - name: Sweep cmux-vm-production orphans
        env:
          CMUX_VM_ENVIRONMENT: production
          UPSTREAM_API_URL: https://api.freestyle.sh
          CMUX_VM_UPSTREAM_API_KEY: ${{ secrets.CMUX_VM_UPSTREAM_API_KEY }}
          CMUX_VM_DATABASE_URL: ${{ secrets.CMUX_VM_DATABASE_URL }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ "$DRY_RUN" = false ]; then bun scripts/sweep-orphans.ts --delete; else bun scripts/sweep-orphans.ts; fi

  migrate-production:
    # Production cmux_vm migrations (release-rails.md, "Production migrations from CI"): every push to
    # feat-cmux-next and action deploy-production apply them before the deploy (no rehearsal: NEXT production
    # has only our team, Leo 2026-11-03/04); action migrate-production runs them alone, in cmux-vm-production.
    # Shares deploy-production's concurrency group, so a migration and a deploy never overlap. Changes only schema cmux_vm of cmux-prod main and the PlanetScale role cmux-vm-owner.
    name: migrate production (cmux_vm)
    # Not on an image roll or rollback commit (cloud-vm-image-roll.yml): it changes only wrangler.jsonc and the
    # image lock, never a migration, and its deploy waited 1.4 min here for nothing (run 42369188953; goal
    # cloud-fix-to-machine). deploy-production's ordering gate still refuses a commit production lacks a migration for.
    if: >-
      !cancelled() && github.ref == 'refs/heads/feat-cmux-next' && (needs.check.result == 'success' || needs.check.result == 'skipped') &&
      !(github.event_name == 'push' && startsWith(github.event.head_commit.message, 'cmux-vm: image roll')) &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.action == 'migrate-production' || inputs.action == 'deploy-production')))
    needs: check
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-4vcpu-ubuntu-2404' || vars.LINUX_RUNNER || fromJSON(vars.RUNNER_POOLS).linux_4 }}
    # A rehearsal restores a branch copy (up to 20 min) and an apply rehearses again, plus the PITR wait.
    timeout-minutes: 90
    environment: cmux-vm-production
    concurrency:
      group: cmux-vm-deploy-production
      cancel-in-progress: false
    steps:
      # Fail closed: without the PlanetScale service token nothing runs (no checkout, no install, no read).
      - name: Required secrets
        env:
          DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.action == 'migrate-production' && inputs.dry_run) }}
          HAS_PSCALE_ID: ${{ secrets.PLANETSCALE_SERVICE_TOKEN_ID != '' }}
          HAS_PSCALE_TOKEN: ${{ secrets.PLANETSCALE_SERVICE_TOKEN != '' }}
          HAS_DB: ${{ secrets.CMUX_VM_DATABASE_URL != '' }}
        run: |
          set -euo pipefail
          missing=()
          [ "$HAS_PSCALE_ID" = true ] || missing+=(PLANETSCALE_SERVICE_TOKEN_ID)
          [ "$HAS_PSCALE_TOKEN" = true ] || missing+=(PLANETSCALE_SERVICE_TOKEN)
          [ "$HAS_DB" = true ] || missing+=(CMUX_VM_DATABASE_URL)
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error title=migrate-production::cmux-vm-production lacks ${missing[*]}; nothing ran (PLANETSCALE_SERVICE_TOKEN_ID and PLANETSCALE_SERVICE_TOKEN are a PlanetScale service token of org cmux with access to cmux-prod)"
            exit 1
          fi
          echo "mode: $([ "$DRY_RUN" = true ] && echo 'dry run (inspect, plan, rehearse)' || echo 'APPLY to cmux-prod main, schema cmux_vm')"
      # Full history without blobs: the apply checks HEAD is on origin/feat-cmux-next and the compat gate
      # compares release tags and web revisions by ancestry.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: false # patterns: .github/checkout-lean.json
          sparse-checkout: |
            /*
            !/cmux-next-ios/verify/
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
      - name: Install the release rails
        working-directory: scripts/cmux-next/release
        run: bun install --frozen-lockfile
      - name: Install pscale 0.349.0 (checksum pinned)
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) arch=amd64; sum=139dc952ccdd21e68b3e70c20f48f9adb3559ee62f6fdcd6d42ddf9b086825f7 ;;
            aarch64|arm64) arch=arm64; sum=c319e1f1c6699e0fc1ec455329be241c0c555ef244b0edb0f90751eb5cc13f09 ;;
            *) echo "::error::no pinned pscale for $(uname -m)"; exit 1 ;;
          esac
          dir="$RUNNER_TEMP/pscale"
          mkdir -p "$dir"
          tarball="$dir/pscale.tar.gz"
          curl -fsSL --retry 3 -o "$tarball" "https://github.com/planetscale/cli/releases/download/v0.349.0/pscale_0.349.0_linux_${arch}.tar.gz"
          echo "$sum  $tarball" | sha256sum -c -
          tar -xzf "$tarball" -C "$dir" pscale
          "$dir/pscale" version
          echo "PSCALE_BIN=$dir/pscale" >> "$GITHUB_ENV"
      # Production steps run with only the variables they need (release-rails.md, "Hardening 1"): every other
      # exported variable is unset in the subshell first, so nothing else reaches the rails or a child.
      - name: ${{ (github.event_name == 'workflow_dispatch' && inputs.action == 'migrate-production' && inputs.dry_run) && 'Inspect, plan and rehearse (dry run; production unchanged)' || 'Inspect, owner, adopt and apply (production)' }}
        working-directory: scripts/cmux-next/release
        env:
          MODE: ${{ (github.event_name == 'workflow_dispatch' && inputs.action == 'migrate-production' && inputs.dry_run) && 'dry-run' || 'migrate' }}
          CMUX_VM_SKIP_REHEARSAL: ${{ (github.event_name == 'push' || inputs.action == 'deploy-production' || inputs.skip_rehearsal) && 'true' || 'false' }}
          PLANETSCALE_SERVICE_TOKEN_ID: ${{ secrets.PLANETSCALE_SERVICE_TOKEN_ID }}
          PLANETSCALE_SERVICE_TOKEN: ${{ secrets.PLANETSCALE_SERVICE_TOKEN }}
          CMUX_VM_DATABASE_URL: ${{ secrets.CMUX_VM_DATABASE_URL }}
          CMUX_RELEASE_RECEIPTS_DIR: ${{ runner.temp }}/receipts
        run: |
          set -euo pipefail
          mkdir -p "$CMUX_RELEASE_RECEIPTS_DIR"
          # Shell (unexported) copies: the cleanup below unsets every exported variable not in `keep`.
          mode="$MODE"
          tools="$(dirname "$PSCALE_BIN"):$(dirname "$(command -v bun)"):$(dirname "$(command -v node)")${VERCEL_BIN_DIR:+:$VERCEL_BIN_DIR}"
          keep=" PLANETSCALE_SERVICE_TOKEN_ID PLANETSCALE_SERVICE_TOKEN CMUX_VM_DATABASE_URL CMUX_RELEASE_RECEIPTS_DIR CMUX_VM_SKIP_REHEARSAL PSCALE_BIN HOME GITHUB_ACTIONS GITHUB_RUN_ID GITHUB_RUN_ATTEMPT GITHUB_SHA "
          (
            for v in $(compgen -e); do
              case "$keep" in *" $v "*) ;; *) unset "$v" 2>/dev/null || true ;; esac
            done
            export PATH="$tools:/usr/local/bin:/usr/bin:/bin"
            exec bun prod-owner.ts "$mode"
          )
      - name: Upload the release receipts
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-vm-migrate-production-receipts
          path: ${{ runner.temp }}/receipts
          if-no-files-found: ignore
          retention-days: 90
