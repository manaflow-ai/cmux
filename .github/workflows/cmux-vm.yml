      run:
        working-directory: workers/cmux-vm
    steps:
      - id: gate
        working-directory: .
        env:
          ENABLED: ${{ vars.CMUX_VM_DEPLOY_ENABLED }}
          URL: ${{ vars.CMUX_VM_PRODUCTION_URL }}
