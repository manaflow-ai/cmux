# CI/CD for the cmux VM API Worker (workers/cmux-vm).
#
# `check` runs on every pull request and main push that touches the Worker:
# typecheck (including the compile-time proof misuse cases), oxlint with the
# gdp-ts preset, the workerd integration tests with a fake upstream, the
# PGlite store tests against the real migration, and the bundle size budget.
#
# Deploy jobs are off until the repository variable CMUX_VM_DEPLOY_ENABLED is
# "1". Each deploy job runs in a GitHub environment that holds its secrets:
#
#   environment          trigger                       Worker
#   cmux-vm-preview      same-repo pull request        cmux-vm-preview (workers.dev)
#   cmux-vm-staging      push to main                  cmux-vm-staging
#   cmux-vm-production   tag cmux-vm-v*                cmux-vm-production
#
# Repository secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID.
# Environment secrets (each environment): CMUX_VM_UPSTREAM_API_KEY,
# CMUX_VM_STACK_PROJECT_ID, CMUX_VM_STACK_SECRET_SERVER_KEY. They reach the
# Worker through `wrangler secret put` on stdin and are never printed.

name: cmux VM

on:
  pull_request:
    paths:
      - workers/cmux-vm/**
      - .github/workflows/cmux-vm.yml
  push:
    branches: [main]
    tags: ["cmux-vm-v*"]
    paths:
      - workers/cmux-vm/**
      - .github/workflows/cmux-vm.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-4vcpu-ubuntu-2404' || vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: workers/cmux-vm
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"
      # Wrangler, Vitest and the Oxlint JS plugin (TypeScript sources) need a
      # current Node; the Blacksmith image ships an older one.
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
      # TEMPORARY bootstrap: the first CI run creates bun.lock; it is then committed and this becomes --frozen-lockfile.
      - id: install
        run: if [ -f bun.lock ]; then bun install --frozen-lockfile; else bun install; fi
      # Every check below runs whenever install succeeded, so one run reports all failures.
      - name: Typecheck (includes compile-time proof misuse cases)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run typecheck
      - name: Oxlint with the gdp-ts preset
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run lint
      - name: openapi.json matches the HttpApi definition
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run openapi:check
      - name: Integration tests in workerd (fake upstream)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run test:workers
      - name: Store tests on PGlite against the migration
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run test:pg
      - name: Bundle (staging config, dry run)
        id: bundle
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run bundle
      - name: Bundle size budget
        if: ${{ !cancelled() && steps.bundle.outcome == 'success' }}
        run: bun run bundle:check
      - name: Upload regenerated openapi.json and lockfile
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-vm-generated
          path: |
            workers/cmux-vm/dist/openapi.json
            workers/cmux-vm/bun.lock
          if-no-files-found: ignore
          retention-days: 7

  deploy-preview:
    if: vars.CMUX_VM_DEPLOY_ENABLED == '1' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: check
    runs-on: ${{ vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 10
    environment: cmux-vm-preview
    concurrency:
      group: cmux-vm-deploy-preview
      cancel-in-progress: false
    defaults:
      run:
        working-directory: workers/cmux-vm
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
      - run: bun install --frozen-lockfile
      - name: Deploy and set secrets
        env:
          TARGET: preview
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CMUX_VM_UPSTREAM_API_KEY: ${{ secrets.CMUX_VM_UPSTREAM_API_KEY }}
          CMUX_VM_STACK_PROJECT_ID: ${{ secrets.CMUX_VM_STACK_PROJECT_ID }}
          CMUX_VM_STACK_SECRET_SERVER_KEY: ${{ secrets.CMUX_VM_STACK_SECRET_SERVER_KEY }}
        run: bash scripts/deploy.sh

  deploy-staging:
    if: vars.CMUX_VM_DEPLOY_ENABLED == '1' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ${{ vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 10
    environment: cmux-vm-staging
    concurrency:
      group: cmux-vm-deploy-staging
      cancel-in-progress: false
    defaults:
      run:
        working-directory: workers/cmux-vm
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
      - run: bun install --frozen-lockfile
      - name: Deploy and set secrets
        env:
          TARGET: staging
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CMUX_VM_UPSTREAM_API_KEY: ${{ secrets.CMUX_VM_UPSTREAM_API_KEY }}
          CMUX_VM_STACK_PROJECT_ID: ${{ secrets.CMUX_VM_STACK_PROJECT_ID }}
          CMUX_VM_STACK_SECRET_SERVER_KEY: ${{ secrets.CMUX_VM_STACK_SECRET_SERVER_KEY }}
        run: bash scripts/deploy.sh

  deploy-production:
    if: vars.CMUX_VM_DEPLOY_ENABLED == '1' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/cmux-vm-v')
    needs: check
    runs-on: ${{ vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 10
    environment: cmux-vm-production
    concurrency:
      group: cmux-vm-deploy-production
      cancel-in-progress: false
    defaults:
      run:
        working-directory: workers/cmux-vm
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
      - run: bun install --frozen-lockfile
      - name: Deploy and set secrets
        env:
          TARGET: production
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CMUX_VM_UPSTREAM_API_KEY: ${{ secrets.CMUX_VM_UPSTREAM_API_KEY }}
          CMUX_VM_STACK_PROJECT_ID: ${{ secrets.CMUX_VM_STACK_PROJECT_ID }}
          CMUX_VM_STACK_SECRET_SERVER_KEY: ${{ secrets.CMUX_VM_STACK_SECRET_SERVER_KEY }}
        run: bash scripts/deploy.sh
