      # result fails the job and never rolls back.
      - name: Smoke health and every route (no rollback)
        if: steps.gate.outputs.enabled == 'true'
        continue-on-error: true
        env:
          URL: ${{ vars.CMUX_VM_PRODUCTION_URL }}
        run: >-
          bun ../../scripts/cmux-next/release/worker-release.ts verify --worker cmux-vm-production
          --url "${URL:-https://vm.cmux.dev}" --routes release-smoke.json --source-dir .
