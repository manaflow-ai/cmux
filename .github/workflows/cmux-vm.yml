# CI/CD for the cmux VM API Worker (workers/cmux-vm).
#
# `check` runs on every pull request and main push that touches the Worker:
# typecheck (including the compile-time proof misuse cases), oxlint with the
# gdp-ts preset, the workerd integration tests with a fake upstream, the
# PGlite store tests against the real migration, and the bundle size budget.
#
# Deploy jobs are off until the repository variable CMUX_VM_DEPLOY_ENABLED is
# "1". Each deploy job runs in a GitHub environment that holds its secrets:
#
#   environment          trigger                       Worker
#   cmux-vm-preview      push to a feat-cmux-vm-<lane>  cmux-vm-preview-<lane> (workers.dev)
#   cmux-vm-staging      push to main or feat-cmux-next cmux-vm-staging, then smoke-staging
#
# feat-cmux-next deploys staging while cmux VM lands there first (Lawrence,
# 2026-10-07: "into feat-cmux-next is all we want rn, no main").
#
# deploy-staging refuses a commit whose migrations staging lacks (db-release.ts
# gate reads the database), records the serving version, deploys, smokes
# health and changed routes (release-smoke.json) and runs `wrangler rollback`
# to the recorded version on red (plans/cmux-next/release-rails.md).
#
# smoke-staging runs scripts/smoke.ts against the staging Worker after each
# staging deploy: create, exec, pause and delete by exact id on the test
# tenant. It needs the cmux-vm-staging environment variable
# CMUX_VM_STAGING_URL and secret CMUX_VM_SMOKE_API_KEY (an API key of the
# dedicated smoke tenant with vm:read, vm:write and vm:exec); without them it
# is skipped with a notice. With the optional secret CMUX_VM_SMOKE_API_KEY_B
# (a key of a second smoke tenant with the same scopes) the smoke also proves
# that the second tenant gets 404 for every call on the first tenant's VM.
# With the optional secret CMUX_VM_SMOKE_SERVICE_KEY and variable
# CMUX_VM_SMOKE_SERVICE_TEAM it also smokes the service principal (cx-b4h.13);
# the staging Worker then needs that key's hash in the environment secret
# CMUX_VM_SERVICE_KEYS, which deploy-staging installs when it is set, with the
# entries of the optional secrets CMUX_VM_SERVICE_KEYS_EXTRA and
# CMUX_VM_SERVICE_KEYS_CLOUD_PLATFORM appended.
#
# Production: every push to feat-cmux-next that touches the Worker runs check, then
# migrate-production (apply the landed cmux_vm migrations, no rehearsal; nothing new
# is a no-op), then deploy-production and smoke-production in the same run, for the
# same SHA. No manual step between a landing and production (M2 of cmuxterm-hq
# plans/cloud/ARCHITECTURE-2026-11.md). Action deploy-production does the same for
# the dispatched feat-cmux-next commit. Environment
# cmux-vm-production (feat-cmux-next only) holds the same secret names as
# staging plus CMUX_VM_SERVICE_KEYS and CMUX_VM_SMOKE_SERVICE_KEY, and the
# variables CMUX_VM_DEPLOY_ENABLED, CMUX_VM_PRODUCTION_URL and
# CMUX_VM_SMOKE_SERVICE_TEAM. first_production_deploy=true only for the first.
# Action smoke-production runs only the production route and service smoke
# against the live version (no deploy, no rollback). Its product leg
# (scripts/smoke-product.ts) creates the way cmux-platform does, with no key: the
# job's GitHub OIDC token maps to the Worker's CMUX_VM_CI_TRUST row ci-product-smoke
# (a product team, not in DEV_TEST_TENANT_IDS, so the never-pause -1 idle default),
# the approved boot image and no idle timeout.
#
# Repository secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID.
# Environment secrets (each environment): CMUX_VM_UPSTREAM_API_KEY,
# CMUX_VM_STACK_PROJECT_ID, CMUX_VM_STACK_SECRET_SERVER_KEY and
# CMUX_VM_DATABASE_URL. No Hyperdrive id is committed: each deploy first
# creates or updates the Hyperdrive config named after the environment from
# CMUX_VM_DATABASE_URL (idempotent), then resolves its id by that name.
#
# Manual runs (workflow_dispatch) choose one read-only or setup action:
#   cloudflare-preflight  token, Workers scripts and Hyperdrive list checks
#   hyperdrive-ensure     create or update the Hyperdrive config named after
#                         the chosen environment from its CMUX_VM_DATABASE_URL
#   deploy-staging        deploy the dispatched ref to staging, then smoke it
#   tail-production       stream the production Worker's live events (wrangler tail) for
#                         tail_minutes; repository Cloudflare secrets, feat-cmux-next only
#   migrate-production    apply the landed cmux_vm migrations to cmux-prod main (job
#                         migrate-production, feat-cmux-next only, environment
#                         cmux-vm-production; every feat-cmux-next push runs it as an apply
#                         before the production deploy). Fails closed until the environment holds
#                         PLANETSCALE_SERVICE_TOKEN_ID and PLANETSCALE_SERVICE_TOKEN.
#                         dry_run (default true) only inspects (roles, cmux_vm owners,
#                         tracking table) and runs db-release.ts plan and rehearse on a
#                         throwaway branch copy; dry_run=false makes sure the PlanetScale
#                         role cmux-vm-owner owns cmux_vm, adopts 0001-0009 when untracked,
#                         and runs db-release.ts apply (it rehearses again; the cmux-old
#                         compat gate is skipped, the change being confined to cmux_vm,
#                         prod-owner.ts). Only schema cmux_vm changes;
#                         scripts/cmux-next/release/prod-owner.ts, release-rails.md
#                         "Production migrations from CI".
#   sweep-orphans-production  list provider VMs of production that no cmux_vm ownership row records, older than
#                         15 minutes, with our exact slug and metadata (cmux#35013); dry_run=false then deletes them
#                         and logs each id. The Worker's 5-minute cron runs the same sweep (src/upstream/orphan-sweep.ts).

name: cmux VM

on:
  pull_request:
    # labeled/unlabeled: re-run when cmux-vm-breaking-change-ok is added or removed.
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      - workers/cmux-vm/**
      # The Stack webhook signature check shared with the cmux-next API Worker.
      - libs/svix-webhook/**
      - libs/vm-instance-identity/**
      - .github/workflows/cmux-vm.yml
  push:
    # Lane branches deploy the preview Worker (decision V6). The preview
    # environment admits only feat-cmux-vm-* refs, which a pull_request run
    # (refs/pull/N/merge) never is, so preview deploys run on push.
    # Agent implementation branches run checks; only feat-cmux-vm-* deploy previews.
    branches: [main, feat-cmux-next, "feat-cmux-vm-*", "codex/vm-api-*"]
    paths:
      - workers/cmux-vm/**
      # The Stack webhook signature check shared with the cmux-next API Worker.
      - libs/svix-webhook/**
      - libs/vm-instance-identity/**
      - .github/workflows/cmux-vm.yml
  workflow_dispatch:
    inputs:
      action:
        description: Manual action
        type: choice
        options: [cloudflare-preflight, hyperdrive-ensure, deploy-staging, deploy-production, smoke-production, migrate-production, tail-production, sweep-orphans-production]
        default: cloudflare-preflight
      environment:
        description: Environment for hyperdrive-ensure
        type: choice
        options: [cmux-vm-staging, cmux-vm-preview]
        default: cmux-vm-staging
      first_production_deploy:
        description: deploy-production only, the Worker's first production deploy (no version to roll back to)
        type: boolean
        default: false
      dry_run:
        description: migrate-production and sweep-orphans-production only, inspect and list; change nothing on production (false applies or deletes)
        type: boolean
        default: true
      skip_rehearsal:
        description: migrate-production with dry_run=false only, apply without the point-in-time rehearsal copy (push and deploy-production always skip it); every other check still runs
        type: boolean
        default: false
      tail_minutes:
        description: tail-production only, minutes to stream the production Worker's events (at most 25)
        type: string
        default: "10"
      # image-roll-settle dispatches these: a rollback whose production deploy was not verified is deployed
      # again (auto-roll.ts ROLLBACK_DEPLOYS bounds it), and this run's settle checks it the same way.
      image_rollback:
        description: deploy-production only, set by image-roll-settle; the auto-rolled image a rollback took out
        type: string
        default: ""
      image_roll_run:
        description: deploy-production with image_rollback only, the roll's run id (its record)
        type: string
        default: ""
      image_rollback_attempt:
        description: deploy-production with image_rollback only, which production deploy of the rollback this is
        type: string
        default: ""

concurrency:
  # A label event for any other label gets a group of its own, so it never
  # cancels the running check; `check` skips on it.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'feat-cmux-next' && (github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name != 'cmux-vm-breaking-change-ok' && format('-label-{0}', github.run_id) || '' }}${{ github.event_name == 'workflow_dispatch' && format('-dispatch-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Temporary REST budget attribution: one gh-call line per GitHub API call (scripts/ci/api_call_log/env.sh).
  BASH_ENV: ${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh

jobs:
  check:
    # A label event re-runs it only for cmux-vm-breaking-change-ok.
    if: (github.event_name != 'workflow_dispatch' || inputs.action == 'deploy-staging' || inputs.action == 'deploy-production') && !(github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'feat-cmux-next' && (github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name != 'cmux-vm-breaking-change-ok')
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-4vcpu-ubuntu-2404' || !startsWith(vars.LINUX_RUNNER, 'blacksmith-') && vars.LINUX_RUNNER || vars.CI_CLOUD_OVERFLOW_SAVED && fromJSON(vars.RUNNER_POOLS).linux_16 || fromJSON(vars.RUNNER_POOLS).linux_8 }}
    timeout-minutes: 15
    # actions: read finds an earlier run's check for an image roll commit (step roll).
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        working-directory: workers/cmux-vm
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      # An image roll or rollback commit (cloud-vm-image-roll.yml, image-roll-settle; the subject migrate-production
      # skips on) gets the short check: the boot image lists, the bundle dry run and its size budget, not the 2.7 min
      # of typecheck, lint and tests (goal cloud-fix-to-machine). Only when the push changes nothing but
      # inputs.lock.json and wrangler.jsonc, and an earlier feat-cmux-next push run's check passed on a tree whose
      # checked paths differ from this one only in wrangler.jsonc. Anything it cannot confirm runs the full check.
      - name: Image roll commit with a passed check on the same code (short check)
        id: roll
        if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/feat-cmux-next' &&
          startsWith(github.event.head_commit.message, 'cmux-vm: image roll')
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -uo pipefail
          full() { echo "::notice title=cmux-vm check::full check: $1"; echo "short=false" >> "$GITHUB_OUTPUT"; exit 0; }
          { [ -n "$BEFORE" ] && ! [[ "$BEFORE" =~ ^0+$ ]]; } || full "no previous tip"
          git fetch --quiet --no-tags --depth=1 origin "$BEFORE" || full "cannot fetch the previous tip $BEFORE"
          pushed="$(git diff --name-only "$BEFORE" HEAD)" || full "cannot diff the push"
          [ -n "$pushed" ] || full "the push changes no file"
          while IFS= read -r f; do
            case "$f" in images/cmux-vm/inputs.lock.json|workers/cmux-vm/wrangler.jsonc) ;; *) full "the push changes $f" ;; esac
          done <<< "$pushed"
          # Every path check reads; between the passed run's commit and this one only wrangler.jsonc may differ.
          checked=(workers/cmux-vm libs/svix-webhook libs/vm-instance-identity .github/workflows/cmux-vm.yml scripts/cmux-next/release)
          runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/cmux-vm.yml/runs?branch=feat-cmux-next&event=push&per_page=20" \
            --jq ".workflow_runs[] | select(.id != $GITHUB_RUN_ID) | \"\(.id) \(.head_sha)\"")" || full "cannot list earlier runs"
          # At most 20 runs (one page) and 5 job reads.
          reads=0
          while read -r id sha; do
            [ -n "$id" ] && [ "$reads" -lt 5 ] || break
            git fetch --quiet --no-tags --depth=1 origin "$sha" || continue
            diff="$(git diff --name-only "$sha" HEAD -- "${checked[@]}")" || continue
            [ -z "$diff" ] || [ "$diff" = workers/cmux-vm/wrangler.jsonc ] || continue
            reads=$((reads + 1))
            check="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs?filter=latest&per_page=100" --jq '[.jobs[] | select(.name == "check") | .conclusion] | first // ""')" || continue
            if [ "$check" = success ]; then
              echo "::notice title=cmux-vm check::short check: run $id passed check on ${sha:0:12}, the same code but wrangler.jsonc"
              echo "short=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done <<< "$runs"
          full "no earlier passed check on the same code"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
      # Wrangler, Vitest and the Oxlint JS plugin (TypeScript sources) need a
      # current Node; the Blacksmith image ships an older one.
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
      - id: install
        run: bun install --frozen-lockfile
      # Every check below runs whenever install succeeded, so one run reports all failures.
      - name: Migration lint (expand-only, schema cmux_vm only, numbering, hash lock)
        if: ${{ !cancelled() && steps.roll.outputs.short != 'true' }}
        working-directory: scripts/cmux-next/release
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          bun install --frozen-lockfile
          # A new branch (all-zero BEFORE) lints against origin/feat-cmux-next; a base that cannot be fetched fails.
          if [ -z "$BASE" ] || [[ "$BASE" =~ ^0+$ ]]; then
            git fetch --quiet --no-tags --depth=1 origin feat-cmux-next || { echo "::error title=Migration lint::cannot fetch origin/feat-cmux-next"; exit 1; }
            BASE="$(git rev-parse FETCH_HEAD)"
          else
            git fetch --quiet --no-tags --depth=1 origin "$BASE" || { echo "::error title=Migration lint::cannot fetch the base $BASE; refusing to lint without it"; exit 1; }
          fi
          bun lint.ts --tree cmux-vm --base "$BASE"
      - name: Typecheck (includes compile-time proof misuse cases)
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.roll.outputs.short != 'true' }}
        run: bun run typecheck
      - name: Oxlint with the gdp-ts preset
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.roll.outputs.short != 'true' }}
        run: bun run lint
      - name: gdp-ts preset rejects forged proofs (self-test)
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.roll.outputs.short != 'true' }}
        run: bun run lint:selftest
      - name: openapi.json matches the HttpApi definition
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.roll.outputs.short != 'true' }}
        run: bun run openapi:check
      # PRs compare with their base branch; check-only pushes compare with the previous commit.
      # Add the label cmux-vm-breaking-change-ok to accept them deliberately.
      - name: openapi.json has no breaking change against the base branch
        if: ${{ !cancelled() && (github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/codex/vm-api-'))) }}
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref || github.event.before }}
          ACCEPT_BREAKING: ${{ contains(github.event.pull_request.labels.*.name, 'cmux-vm-breaking-change-ok') }}
        run: bash scripts/openapi-breaking.sh "$BASE_REF"
      - name: Upstream coverage (every upstream operation wrapped, planned or denied)
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.roll.outputs.short != 'true' }}
        run: bun run coverage:upstream
      - name: Integration tests in workerd (fake upstream)
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.roll.outputs.short != 'true' }}
        run: bun run test:workers
      - name: Generated creation storage survives an older ledger
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.roll.outputs.short != 'true' }}
        run: bun scripts/test-generated-creation-compat.ts
      - name: Snapshot capture storage survives an older ledger
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.roll.outputs.short != 'true' }}
        run: bun scripts/test-snapshot-capture-compat.ts
      - name: Snapshot key fences survive the previous capture engine
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.roll.outputs.short != 'true' }}
        run: bun scripts/test-snapshot-key-fence-compat.ts
      - name: Fork capture intent survives the previous ledger
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.roll.outputs.short != 'true' }}
        run: bun scripts/test-fork-capture-compat.ts
      - name: Pending history discovers slots from the previous writer
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.roll.outputs.short != 'true' }}
        run: bun scripts/test-pending-history-compat.ts
      - name: Service key scope grants merge only declared, known scopes
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.roll.outputs.short != 'true' }}
        run: bun scripts/test-key-grants.ts
      - name: Store tests on PGlite against the migration
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.roll.outputs.short != 'true' }}
        run: bun run test:pg
      # Both modes: each environment's list parses and passes the Worker's schema (auto-roll.ts locate), and stays
      # within Cloudflare's 5,120-byte text binding limit (MAX_BYTES), so a list the deploy would refuse fails here.
      - name: Boot image lists and the image lock parse, within the binding limit
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: .
        run: |
          bun -e '
            const { readFileSync } = await import("node:fs");
            const { DEFAULT_LOCK, DEFAULT_WRANGLER, MAX_BYTES, locate } = await import(`${process.cwd()}/images/cmux-vm/auto-roll.ts`);
            JSON.parse(readFileSync(DEFAULT_LOCK, "utf8"));
            const text = readFileSync(DEFAULT_WRANGLER, "utf8");
            for (const env of ["staging", "production"]) {
              const bytes = Buffer.byteLength(JSON.stringify(locate(text, env).images), "utf8");
              console.log(`${env} VM_BOOT_IMAGES: ${bytes} bytes (at most ${MAX_BYTES})`);
              if (bytes > MAX_BYTES) throw new Error(`${env} VM_BOOT_IMAGES is ${bytes} bytes, over ${MAX_BYTES}`);
            }
          '
      - name: Bundle (staging config, dry run)
        id: bundle
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run bundle
      - name: Bundle size budget
        if: ${{ !cancelled() && steps.bundle.outcome == 'success' }}
        run: bun run bundle:check
      # On drift, openapi:check leaves the regenerated document in dist/.
      - name: Upload regenerated openapi.json
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-vm-openapi
          path: workers/cmux-vm/dist/openapi.json
          if-no-files-found: ignore
          retention-days: 7

  # Read-only: confirms the repository Cloudflare token works and can see
  # Workers scripts and Hyperdrive configs. Prints HTTP codes and counts only.
  cloudflare-preflight:
    environment: cloudflare-ops
    name: cloudflare preflight
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'cloudflare-preflight'
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-4vcpu-ubuntu-2404' || vars.LINUX_RUNNER || fromJSON(vars.RUNNER_POOLS).linux_4 }}
    timeout-minutes: 5
    steps:
      - name: Read-only Cloudflare API checks
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "::error::CLOUDFLARE_API_TOKEN is not set"; exit 1; }
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "::error::CLOUDFLARE_ACCOUNT_ID is not set"; exit 1; }
          umask 077
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          # The token goes to curl through a header file, never argv or logs.
          printf 'Authorization: Bearer %s\n' "$CLOUDFLARE_API_TOKEN" > "$work/auth"
          api="https://api.cloudflare.com/client/v4"
          get() { curl -sS -o "$work/body" -w '%{http_code}' -H @"$work/auth" "$api$1" || echo 000; }
          # Prints only the HTTP code, the API success flag and a result count.
          summary() { jq -r '"success=\(.success) results=\(if (.result|type)=="array" then (.result|length) else "n/a" end)"' "$work/body" 2>/dev/null || echo "unparseable body"; }
          failed=0
          code="$(get "/accounts/$CLOUDFLARE_ACCOUNT_ID/tokens/verify")"
          if [ "$code" = 200 ]; then
            echo "token verify (account token): HTTP $code $(summary)"
          else
            echo "token verify (account token): HTTP $code"
            code="$(get "/user/tokens/verify")"
            echo "token verify (user token): HTTP $code $(summary)"
            [ "$code" = 200 ] || failed=1
          fi
          code="$(get "/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts")"
          echo "workers scripts list: HTTP $code $(summary)"
          [ "$code" = 200 ] || failed=1
          code="$(get "/accounts/$CLOUDFLARE_ACCOUNT_ID/hyperdrive/configs")"
          echo "hyperdrive configs list: HTTP $code $(summary)"
          [ "$code" = 200 ] || failed=1
          exit "$failed"

  hyperdrive-ensure:
    name: hyperdrive ensure
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'hyperdrive-ensure' && contains(fromJSON('["cmux-vm-staging","cmux-vm-preview"]'), inputs.environment)
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-4vcpu-ubuntu-2404' || vars.LINUX_RUNNER || fromJSON(vars.RUNNER_POOLS).linux_4 }}
    timeout-minutes: 5
    environment: ${{ inputs.environment }}
    concurrency:
      group: cmux-vm-hyperdrive-${{ inputs.environment }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: workers/cmux-vm
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
      - name: Create or update the Hyperdrive config
        env:
          CONFIG_NAME: ${{ inputs.environment }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CMUX_VM_DATABASE_URL: ${{ secrets.CMUX_VM_DATABASE_URL }}
        run: bash scripts/hyperdrive.sh ensure "$CONFIG_NAME"

  deploy-preview:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/feat-cmux-vm-')
    needs: check
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-4vcpu-ubuntu-2404' || vars.LINUX_RUNNER || fromJSON(vars.RUNNER_POOLS).linux_4 }}
    timeout-minutes: 10
    environment: cmux-vm-preview
    concurrency:
      group: cmux-vm-deploy-preview-${{ github.ref_name }}
      cancel-in-progress: false
