  smoke-production:
    # After deploy-production, or alone (action smoke-production: the live version, no deploy, no rollback).
    # This is diagnostic only and never blocks the feature branch or nightly.
    continue-on-error: true
    if: >-
      !cancelled() && github.ref == 'refs/heads/feat-cmux-next' &&
      ((github.event_name == 'workflow_dispatch' && inputs.action == 'smoke-production') ||
      ((github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.action == 'deploy-production')) && needs.deploy-production.result == 'success'))
