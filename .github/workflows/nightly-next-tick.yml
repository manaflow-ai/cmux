name: nightly-next tick

# A NEXT nightly used to start only from a feat-cmux-next push: cmux-next.yml's
# request-nightly-next after a green Release compile, or cmux-tui-artifacts.yml
# once the commit's tree published. A push whose run was cancelled by the next
# push, or whose request waited on a stalled pool, asked for nothing. This tick
# asks again whenever a cmux-next or cmux-tui artifacts push run on
# feat-cmux-next finishes, whatever its conclusion (a cancelled run finishes
# too), and on demand, for the newest feat-cmux-next commit that is buildable
# (green Release compile, published cmux-tui tree, fresh strings;
# scripts/cmux-next/request-nightly-next.sh). The event path still starts builds
# as soon as possible, and a 30-minute catch-up handles missed workflow events
# (the dedicated builder Mac is cmux22, plans/cmux-next/nightly-builder-DESIGN.md).
# Main's promote job ignores
# a request that does not move nightly-next forward, and the concurrency group
# below keeps one tick running and one waiting, so a burst of finished runs
# costs at most two ticks. GitHub runs `workflow_run` only from the default
# branch: this file must exist on main.
on:
  workflow_run:
    workflows: ["cmux-next", "cmux-tui artifacts"]
    branches: [feat-cmux-next]
    types: [completed]
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      sha:
        description: feat-cmux-next commit (40 hex) to ask for; empty asks for the newest buildable one
        required: false
        default: ''
        type: string

permissions: {}

env:
  # `workflows:` spells display names; these are the files behind them
  # (tests/test_ci_workflow_run_sources.py).
  SOURCE_WORKFLOW_PATHS: .github/workflows/cmux-next.yml .github/workflows/cmux-tui-artifacts.yml

concurrency:
  # GitHub keeps one pending run per shared group and evicts older pending
  # runs. Give each trigger its own group; the coalesce job below owns the
  # one-running/newest-waiting policy explicitly instead.
  group: nightly-next-tick-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  coalesce:
    if: github.repository == 'manaflow-ai/cmux'
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    permissions:
      actions: read
    outputs:
      owner: ${{ steps.coalesce.outputs.owner }}
    steps:
      - name: Coalesce tick requests without cancelling work
        id: coalesce
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const activeStates = new Set(['queued', 'requested', 'waiting', 'pending', 'in_progress']);
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
            const activeRuns = async () => {
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'nightly-next-tick.yml',
                per_page: 100,
              });
              return data.workflow_runs
                .filter((run) => activeStates.has(run.status))
                .sort((a, b) => Date.parse(a.created_at) - Date.parse(b.created_at) || Number(a.id) - Number(b.id));
            };
            for (let attempt = 0; attempt < 48; attempt += 1) {
              const runs = await activeRuns();
              const current = runs.find((run) => run.id === context.runId);
              if (!current) {
                core.notice('Current tick is not visible in the run list yet; retrying.');
                await sleep(5000);
                continue;
              }
              const order = (run) => [Date.parse(run.created_at), Number(run.id)];
              const currentOrder = order(current);
              const before = (run) => {
                const candidate = order(run);
                return candidate[0] < currentOrder[0] ||
                  candidate[0] === currentOrder[0] && candidate[1] < currentOrder[1];
              };
              const after = (run) => {
                const candidate = order(run);
                return candidate[0] > currentOrder[0] ||
                  candidate[0] === currentOrder[0] && candidate[1] > currentOrder[1];
              };
              const older = runs.filter((run) => run.id !== current.id && before(run));
              const newer = runs.some((run) => run.id !== current.id && after(run));
              if (older.length && newer) {
                core.notice(`A newer tick ${newer ? 'is queued' : 'exists'}; retiring this older waiter.`);
                core.setOutput('owner', 'false');
                return;
              }
              if (!older.length) {
                core.notice('This tick owns the delivery slot and will read the latest branch tip.');
                core.setOutput('owner', 'true');
                return;
              }
              core.notice(`Waiting for the active tick ${older[0].id} to finish (attempt ${attempt + 1}/48).`);
              await sleep(15000);
            }
            core.setFailed('coalescer did not acquire the delivery slot before timeout');

  request:
    needs: coalesce
    if: needs.coalesce.outputs.owner == 'true' && github.repository == 'manaflow-ai/cmux' && (github.event_name != 'workflow_run' || github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04 # nightly path never waits on Blacksmith
    timeout-minutes: 15
    permissions:
      # actions: read finds the Release compile; actions: write dispatches
      # main's promote-nightly-next.
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ inputs.sha != '' && inputs.sha || 'refs/heads/feat-cmux-next' }}
          fetch-depth: 150

      # The release train (nightly-next-train.yml, docs/ci/nightly-next-train.md).
      # Unset or dry-run: the train plans from the last good build and its run
      # summary is the plan; the promotion below still goes ahead. on: the
      # train replaces it (a train commit is not on feat-cmux-next, so a plain
      # promotion after one is refused). off: nothing.
      - name: Start the nightly-next train
        if: vars.NIGHTLY_NEXT_TRAIN != 'off'
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ vars.NIGHTLY_NEXT_TRAIN == 'on' && 'drive' || 'plan' }}
        run: |
          set -euo pipefail
          gh workflow run nightly-next-train.yml -R "$GITHUB_REPOSITORY" --ref feat-cmux-next -f mode="$MODE" \
            || echo "::warning::could not start the nightly-next train ($MODE); is nightly-next-train.yml on feat-cmux-next and main?"

      - name: Request nightly-next promotion on main
        if: vars.NIGHTLY_NEXT_TRAIN != 'on'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The tip's cmux-tui tree is often still publishing, so walk back
          # first-parent commits until one has a published, daemon-tested tree; the script
          # then picks the newest green Release compile with that tree.
          for sha in $(git rev-list --first-parent -n 120 HEAD); do
            git checkout -q --detach "$sha"
            out="$(scripts/cmux-next/request-nightly-next.sh --tree-ready "$sha" --repo "$GITHUB_REPOSITORY" 2>&1)" || { printf '%s\n' "$out"; exit 1; }
            printf '%s\n' "$out"
            # Stop once a promotion is requested or nightly-next already has
            # it; pass over commits with no published or daemon-tested tree.
            ! grep -qE '^requested nightly-next promotion|already on nightly-next' <<<"$out" || exit 0
          done
          echo "::warning::none of the 120 newest feat-cmux-next commits has a published cmux-tui tree"
