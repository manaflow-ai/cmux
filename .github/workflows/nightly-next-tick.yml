name: nightly-next tick

# The nightly-next cadence: this tick moves nightly-next to the newest
# feat-cmux-next commit that is buildable (published, daemon-tested cmux-tui
# tree, fresh strings; scripts/cmux-next/request-nightly-next.sh), and that push
# starts exactly one nightly build. Main's promote job ignores a request that
# does not move nightly-next forward, so a tick with nothing new starts nothing.
# Builds are never cancelled: a tick may start a newer build beside a running
# one, and publication is latest-wins (publish-nightly's check-build recheck
# refuses a build no newer than the feed).
#
# When it runs: at landing (a feat-cmux-next cmux-next or cmux-tui artifacts
# push run finishing, the two things that make a commit buildable), when a
# nightly-next build finishes, on a 5-minute backstop cron, and by dispatch
# (a person, or nightly-next-feed-watch.yml when the feed falls behind). Whether
# it promotes is the rolling rule (scripts/ci/nightly_next_rolling.py): at once
# when nothing is building nightly-next, else once the oldest landing the
# running build does not carry has waited 10 minutes, so a burst of landings
# becomes one build of the newest tip beside the running one. A dispatch for
# one commit skips the rule.
#
# Until 2026-10-28 every cmux-next or cmux-tui artifacts run on feat-cmux-next
# promoted with no such rule (workflow_run here, and request-nightly-next in
# those workflows), so each landing started a full Release build: six ran at
# once on 2026-10-28 and only the newest could publish. Leo: "every 30 mins or
# so you do it / within 30min you replace". Then a 30-minute cron alone kept the
# feed 45-50 minutes behind each landing (Leo, 2026-10-29: "and where are the
# nightlies!?"). Only the tick promotes: its request carries the "tick:" prefix
# (the gh shim below marks it), and main's promote job skips a request without
# it from github-actions[bot], since older revisions of request-nightly-next.sh
# still send one on every landing (promote-nightly-next.mjs decideRequest). The
# tick also sets NIGHTLY_NEXT_PROMOTE=1, without which newer revisions only
# report. A schedule and workflow_run run only from the default branch: this
# file must exist on main.
on:
  workflow_run:
    workflows: ["cmux-next", "cmux-tui artifacts", "Nightly macOS build"]
    branches: [feat-cmux-next, nightly-next]
    types: [completed]
  schedule:
    - cron: "4-59/5 * * * *"
  workflow_dispatch:
    inputs:
      sha:
        description: feat-cmux-next commit (40 hex) to ask for; empty asks for the newest buildable one
        required: false
        default: ''
        type: string

permissions: {}

env:
  # `workflows:` spells display names; these are the files behind them
  # (tests/test_ci_workflow_run_sources.py).
  SOURCE_WORKFLOW_PATHS: .github/workflows/cmux-next.yml .github/workflows/cmux-tui-artifacts.yml .github/workflows/nightly.yml

jobs:
  request:
    # A workflow_run counts only for this repository's own push runs: feat-cmux-next
    # landings and nightly-next builds.
    if: github.repository == 'manaflow-ai/cmux' && (github.event_name != 'workflow_run' || github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository)
    # CI_CONTROL_RUNNER, when set, takes this control job off Blacksmith Linux
    # (2026-10-28: every Blacksmith Linux size stopped starting jobs from ~20:00Z).
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.CI_CONTROL_RUNNER || 'blacksmith-2vcpu-ubuntu-2404' }}
    # 15 minutes of work, plus the hour its gh calls may wait for a rate limit (below).
    timeout-minutes: 75
    # One tick runs and the newest waits: GitHub replaces an older pending tick
    # with a newer one. A tick only asks main's nightly.yml for a promotion and
    # reads the branch tip when it starts, so a replaced pending tick loses
    # nothing, and no build is ever cancelled: the builds run in nightly.yml,
    # whose own groups never cancel (a delivery-concurrency test enforces it).
    # A dispatch for one commit gets its own group so a later tick cannot
    # replace it.
    # This replaced a github-script coalescer that listed this workflow's runs
    # every 15 s for up to 12 minutes per waiting tick, a large share of the
    # repository's GITHUB_TOKEN quota (nightly-next runs 40234225207 and
    # 40240049419 then failed with "API rate limit exceeded for installation").
    concurrency:
      group: ${{ inputs.sha != '' && format('nightly-next-tick-{0}', github.run_id) || 'nightly-next-tick' }}
      cancel-in-progress: false
    permissions:
      # actions: read finds the Release compile; actions: write dispatches
      # main's promote-nightly-next.
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ inputs.sha != '' && inputs.sha || 'refs/heads/feat-cmux-next' }}
          fetch-depth: 150

      # This workflow's own copy of the wrapper, not the checked-out branch's.
      - name: Checkout the gh rate-limit wait
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: .tick-tooling
          sparse-checkout: |
            scripts/ci/gh_budget_wait.sh
            scripts/ci/nightly_next_cancelled_tip.sh
            scripts/ci/nightly_compile_red.py
            scripts/ci/nightly_next_feed_watch.py
            scripts/ci/nightly_next_rolling.py
            scripts/ci/nightly_next_stuck_run.py
            scripts/ci/nightly_repick.py
            scripts/ci/owned_pool_rescue.py
            scripts/ci/owned_pool_sources.py
            scripts/ci/pr_runner_pool.py
            scripts/ci/simple_pool_picker.py
            scripts/ci/ui_tests_dispatch.py
          sparse-checkout-cone-mode: false

      # A tick refused "API rate limit exceeded for installation" lost its promotion
      # (2026-10-26, run 40325957281, while /rate_limit showed thousands of calls left).
      # scripts/ci/gh_budget_wait.sh puts a gh first on PATH that waits instead: until the
      # reset when a budget reads exhausted, else 60, 120, 240, then 300 s, at most an hour
      # per job, each wait logged. The first refusal also logs GitHub's message and the
      # token's /rate_limit headers then, to name the limiter.
      - name: Wait through GitHub API rate limits in this job's gh calls
        run: bash .tick-tooling/scripts/ci/gh_budget_wait.sh --install

      # The release train (nightly-next-train.yml, docs/ci/nightly-next-train.md).
      # on: the train replaces the promotion below (a train commit is not on
      # feat-cmux-next, so a plain promotion after one is refused). Anything
      # else starts no train: a dry run only plans and runs every car's guards
      # (an hour for 145 cars), publishes nothing, and its runs displaced each
      # other in group nightly-next-train on every landing. Run mode=plan by
      # hand for a plan.
      - name: Start the nightly-next train
        if: vars.NIGHTLY_NEXT_TRAIN == 'on'
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: drive
        run: |
          set -euo pipefail
          gh workflow run nightly-next-train.yml -R "$GITHUB_REPOSITORY" --ref feat-cmux-next -f mode="$MODE" \
            || echo "::warning::could not start the nightly-next train ($MODE); is nightly-next-train.yml on feat-cmux-next and main?"

      # nightly_repick.py (run by the re-run below) reads nightly.yml's `needs` graph with
      # PyYAML. Best effort: without it the re-run takes the attempt's failed jobs, as before.
      - name: Prepare the re-run's Python
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 -c 'import yaml' 2>/dev/null && exit 0
          python3 -m venv "$RUNNER_TEMP/tick-venv"
          "$RUNNER_TEMP/tick-venv/bin/python" -m pip install --disable-pip-version-check --no-input PyYAML==6.0.3
          echo "$RUNNER_TEMP/tick-venv/bin" >> "$GITHUB_PATH"

      # A nightly-next or promotion run with a job no runner took for 20 minutes (a label
      # that stopped serving, run 40771197361) is cancelled here when an existing path builds
      # it again: the step below re-runs the tip's push run, the tip builds over an older
      # commit's, and the promotion request asks again. Gated and running runs are never
      # cancelled; scripts/ci/nightly_next_stuck_run.py. Only in the shared, serialized tick
      # group (no sha input), so two ticks never act on one run at once.
      - name: Cancel a nightly-next run stuck without a runner
        if: inputs.sha == ''
        continue-on-error: true
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          NIGHTLY_NEXT_TRAIN: ${{ vars.NIGHTLY_NEXT_TRAIN }}
        run: python3 .tick-tooling/scripts/ci/nightly_next_stuck_run.py "$GITHUB_REPOSITORY"

      # A tip on nightly-next whose newest run ended cancelled (a rescue that lost its
      # re-run, run 40340830337) is never requested again below ("already on
      # nightly-next"), so it is re-run here; scripts/ci/nightly_next_cancelled_tip.sh.
      - name: Re-run a cancelled nightly-next tip
        # An explicit SHA asks for a newer tip without waiting on recovery of the
        # current nightly tip (whose API reads may wait out an hour of rate limits).
        # Automatic ticks retain recovery in their shared, serialized group.
        if: inputs.sha == ''
        # The promotion below must run even when this check cannot.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .tick-tooling/scripts/ci/nightly_next_cancelled_tip.sh "$GITHUB_REPOSITORY"

      # The rolling rule (scripts/ci/nightly_next_rolling.py): promote at once when nothing is
      # building nightly-next, else once the oldest landing the running build does not carry
      # has waited 10 minutes. A dispatch for one commit skips it. It reads through the API only;
      # its failure modes are in the script's docstring.
      - name: Apply the rolling rule
        id: rolling
        if: vars.NIGHTLY_NEXT_TRAIN != 'on' && inputs.sha == ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          WINDOW_MINUTES: ${{ vars.NIGHTLY_NEXT_ROLLING_MINUTES || '10' }}
        run: python3 .tick-tooling/scripts/ci/nightly_next_rolling.py --repo "$GITHUB_REPOSITORY" --tip "$(git rev-parse HEAD)" --window-minutes "$WINDOW_MINUTES"

      - name: Request nightly-next promotion on main
        if: vars.NIGHTLY_NEXT_TRAIN != 'on' && steps.rolling.outputs.go != 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          # The cadence: request-nightly-next.sh dispatches a promotion only from here.
          NIGHTLY_NEXT_PROMOTE: "1"
        run: |
          set -euo pipefail
          # The tip's cmux-tui tree is often still publishing, so walk back
          # first-parent commits until one has a published, daemon-tested tree; the script
          # then picks the newest green Release compile with that tree.
          refusals="$RUNNER_TEMP/refusals.txt"
          : > "$refusals"
          # Each commit runs its own revision of request-nightly-next.sh, and
          # each call listed 99 cmux-next push runs and read their jobs again,
          # up to 120 times a tick: with the old coalescer, most of the
          # repository's GITHUB_TOKEN budget (2026-10-25). Two cuts and the cadence
          # mark, all here so they hold for every revision:
          # 1. A gh in front of PATH keeps those two read-only listings for
          #    this tick (a failed read is never kept).
          # 2. --tree-ready answers for the commit's cmux-tui tree: it searches
          #    every recent push run with that tree between nightly-next and
          #    the branch, whichever commit asks. A commit whose tree a newer
          #    commit already asked about gets the same answer, so it is
          #    passed over. Only when nightly-next is in this history: without
          #    it the script bounds the search by the asking commit instead.
          GH_REAL="$(command -v gh)"
          GH_TICK_CACHE="$RUNNER_TEMP/gh-tick-cache"
          export GH_REAL GH_TICK_CACHE
          mkdir -p "$GH_TICK_CACHE/bin"
          cat > "$GH_TICK_CACHE/bin/gh" <<'SH'
          #!/usr/bin/env bash
          set -uo pipefail
          if [[ "${1:-}" == api ]]; then
            case "${!#}" in
              repos/*/actions/workflows/cmux-next.yml/runs\?*|repos/*/actions/runs/*/jobs\?*)
                file="$GH_TICK_CACHE/$(printf '%s\n' "$*" | { command -v sha256sum >/dev/null && sha256sum || shasum -a 256; } | cut -c1-40)"
                [[ -s "$file" ]] && { cat "$file"; exit 0; }
                "$GH_REAL" "$@" > "$file.$$" || { rc=$?; cat "$file.$$"; rm -f "$file.$$"; exit "$rc"; }
                mv "$file.$$" "$file" && cat "$file"
                exit
                ;;
            esac
          fi
          # 3. The tick's promotion request carries the "tick:" prefix, which
          #    main's promote job admits (a landing's request lacks it), so
          #    every revision's dispatch is marked here.
          if [[ "${1:-} ${2:-} ${3:-}" == "workflow run nightly.yml" ]]; then
            args=()
            for arg in "$@"; do
              # Any form: "-f k=v" (k=v alone), "-fk=v", "--field=k=v", -F, --raw-field.
              if [[ "$arg" == *promote_nightly_next_sha=* && "$arg" != *promote_nightly_next_sha=tick:* ]]; then
                arg="${arg/promote_nightly_next_sha=/promote_nightly_next_sha=tick:}"
              fi
              args+=("$arg")
            done
            exec "$GH_REAL" "${args[@]}"
          fi
          exec "$GH_REAL" "$@"
          SH
          chmod +x "$GH_TICK_CACHE/bin/gh"
          export PATH="$GH_TICK_CACHE/bin:$PATH"
          dedupe=""
          if line="$(git ls-remote origin refs/heads/nightly-next 2>/dev/null)" \
             && git cat-file -e "${line%%[[:space:]]*}^{commit}" 2>/dev/null; then
            dedupe=1
          fi
          asked_keys=" "
          for sha in $(git rev-list --first-parent -n 120 HEAD); do
            git checkout -q --detach "$sha"
            if [[ -n "$dedupe" ]] && key="$(python3 scripts/ci/cmux_tui_tree_key.py --version v2 "$sha" 2>/dev/null)" \
               && [[ "$key" =~ ^[0-9a-f]{40}$ ]]; then
              [[ "$asked_keys" != *" $key "* ]] || continue
              asked_keys+="$key "
            fi
            out="$(scripts/cmux-next/request-nightly-next.sh --tree-ready "$sha" --repo "$GITHUB_REPOSITORY" 2>&1)" || { printf '%s\n' "$out"; exit 1; }
            printf '%s\n' "$out"
            # Stop once a promotion is requested or nightly-next already has
            # it; pass over commits with no published or daemon-tested tree.
            ! grep -q '^requested nightly-next promotion' <<<"$out" || exit 0
            grep -E '^not promoting' <<<"$out" >> "$refusals" || true
            ! grep -q 'already on nightly-next' <<<"$out" || break
          done
          # Nothing requested. nightly-next-feed-watch.yml quotes this
          # annotation (title "nightly-next tick") when the feed falls behind,
          # so its alarm names why every newer commit was refused.
          if [[ -s "$refusals" ]]; then
            tally="$(sed -E 's/^not promoting( [0-9a-f]{12})?: //; s/[0-9a-f]{12,40}/<sha>/g' "$refusals" | sort | uniq -c | sort -rn | head -3 \
              | awk '{n=$1; $1=""; printf "%s%dx%s", (NR>1 ? "; " : ""), n, $0}')"
            echo "::warning title=nightly-next tick::no newer feat-cmux-next commit is promotable ($(wc -l < "$refusals" | tr -d ' ') refused): $tally"
          fi
