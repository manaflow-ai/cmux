concurrency:
  # A pull request's newer push supersedes its run. A batch run and its bisect probes (one commit, one job each)
  # never cancel one another, and a started batch run is never cancelled.
  group: cmux-tui-sdks-${{ github.workflow }}-${{ github.ref }}${{ inputs.sha && format('-{0}-{1}', inputs.sha, inputs.only) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Warnings never fail a pull request's compile (Leo, 2026-11-19); pushes, dispatches, nightly and release
  # keep them errors. scripts/ci/warnings_policy.py.
  CI_WARNINGS: ${{ github.event_name == 'pull_request' && 'soft' || 'deny' }}
  # libghostty-vt always builds from the ghostty-next gitlink: an empty
  # value overrides any runner-level CMUX_GHOSTTY_SRC (build.rs treats it
  # as unset).
  CMUX_GHOSTTY_SRC: ""
  # Temporary REST budget attribution: one gh-call line per GitHub API call (scripts/ci/api_call_log/env.sh, fetched at a fixed commit when the checkout has no copy).
  BASH_ENV: '$({ w="${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh"; t="${RUNNER_TEMP:-/nonexistent}/api-call-log-src"; if [ -f "$w" ]; then echo "$w"; elif [ -n "${RUNNER_TEMP:-}" ]; then if [ ! -f "$t/env.sh" ] && [ ! -e "$t.tried" ] && { [ "${RUNNER_OS:-}" = Linux ] || [ "${RUNNER_OS:-}" = macOS ]; } && [ "$(date -u +%Y%m%d%H)" -lt 2026112300 ]; then : > "$t.tried"; mkdir -p "$t.part" && for x in env.sh gh sitecustomize.py isolated.py; do curl -fsSL --max-time 5 -o "$t.part/$x" "https://raw.githubusercontent.com/manaflow-ai/cmux/27647ffd3ae838c63be28ca3e5883dcd68c34518/scripts/ci/api_call_log/$x" || break; done; [ -s "$t.part/isolated.py" ] && mv "$t.part" "$t"; fi; if [ -f "$t/env.sh" ]; then echo "$t/env.sh"; else echo unset BASH_ENV > "$t.off.sh" && echo "$t.off.sh"; fi; fi; } 2>/dev/null)'

jobs:
  contract:
    name: protocol contract
    # Tier A of the merged pull request replay (scripts/ci/affected-jobs.json pull_request_skip): a pull request
    # into feat-cmux-next skips it unless labeled full-ci; the feat-cmux-next push runs it.
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft != true || contains(github.event.pull_request.labels.*.name, 'full-ci') || (vars.CI_DRAFT_CHEAP_TIER || '1') == '0') && ((github.event_name != 'pull_request' || !startsWith(github.event.pull_request.base.ref, 'feat-cmux-next') || contains(github.event.pull_request.labels.*.name, 'full-ci'))) }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && (vars.CI_FORK_LINUX_RUNNER || 'ubuntu-24.04') || 'cmux-linux' }}
    timeout-minutes: 8
    outputs:
      sdk_inputs: ${{ steps.sdk-inputs.outputs.changed }}
      conformance: ${{ steps.graph.outputs.conformance }}
      conformance_tree: ${{ steps.graph.outputs.conformance_tree }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ inputs.sha || '' }}
          # The pull request merge commit and its base parent.
          fetch-depth: 2

      # The package, consumer and MSRV lanes read only the bindings, spec/, the
      # cmux-tui workspace manifests and toolchain pins, and this workflow.
      # Runtime-crate and release-workflow edits still run this contract job
      # and the live conformance lane, which builds cmux-tui. Anything that is
      # not a pull request, or a diff that cannot be read, runs every lane.
      - name: Detect SDK package inputs
        id: sdk-inputs
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          changed=true
          if [ "$EVENT_NAME" = "pull_request" ] && git rev-parse -q --verify 'HEAD^2' > /dev/null; then
            if files="$(git diff --no-renames --name-only 'HEAD^1' HEAD)"; then
              if ! grep -Eq '^(cmux-tui/[^/]+$|cmux-tui/(bindings|spec|vendor|build-support)/|cmux-tui/crates/[^/]+/Cargo\.toml$|\.github/actions/setup-cmux-tui-rust/|\.github/workflows/cmux-tui-sdks\.yml$)' <<< "$files"; then
                changed=false
              fi
            fi
          fi
          echo "SDK package inputs changed: $changed"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      # Jobs routed by the crate graph (scripts/ci/affected_jobs.py, scripts/ci/affected-jobs.json): each runs
      # when the change touches an input of a crate it builds (the crate, its path dependencies with their
      # features, the files their sources name) or of its own steps. A push, a dispatch, the full-ci label, a
      # change to the router and a cmux-tui path it cannot place run every job; so does a failed router (the
      # jobs read `!= 'false'`).
      - name: Which jobs can the change affect (crate graph)
        id: graph
        env:
          EVENT_NAME: ${{ github.event_name }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          base=""
          if [[ "$EVENT_NAME" == pull_request ]]; then
            base=$(git rev-parse HEAD^1 2>/dev/null || true)
          fi
          python3 scripts/ci/affected_jobs.py route --workflow .github/workflows/cmux-tui-sdks.yml \
            --base "$base" --head HEAD --event "$EVENT_NAME" --labels "${LABELS:-[]}"

      # Its download can fail (GitHub answered 504 on 2026-11-08). Then the job takes a 3.12 from uv,
      # or else the runner's python3, in a venv (the runner's own Python refuses a pip install).
      - name: Set up Python
        id: python
        continue-on-error: true
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12.8"

      - name: Install workflow guard dependencies
        env:
          SETUP_PYTHON: ${{ steps.python.outcome }}
        run: |
          set -euo pipefail
          pip_flags=()
          if [ "$SETUP_PYTHON" != "success" ]; then
            venv="$RUNNER_TEMP/python"
            if command -v uv >/dev/null 2>&1 && uv venv --seed --python 3.12 "$venv" >/dev/null 2>&1; then
              echo "::warning::setup-python failed; using uv's Python 3.12"
            elif python3 -m venv "$venv" >/dev/null 2>&1; then
              echo "::warning::setup-python failed; using the runner's $(python3 --version) in a venv"
            else
              # No venv module (no ensurepip): the runner's own Python, for this user.
              echo "::warning::setup-python failed; using the runner's $(python3 --version)"
              venv=""
              pip_flags=(--user --break-system-packages)
              if python3 -c 'import yaml' 2>/dev/null; then
                echo "the runner's Python already has PyYAML $(python3 -c 'import yaml; print(yaml.__version__)')"
                exit 0
              fi
            fi
            if [ -n "$venv" ]; then
              echo "$venv/bin" >> "$GITHUB_PATH"
              PATH="$venv/bin:$PATH"
            fi
          fi
          python3 -m pip install \
            --disable-pip-version-check \
            "${pip_flags[@]}" \
            "PyYAML==6.0.3"

      - name: Test published artifact manifest verifier
        run: python3 -m unittest discover -s cmux-tui/scripts -p 'test_verify_published_manifest.py' -v

      - name: Test SDK schema drift checker
        run: python3 cmux-tui/scripts/test_check_sdk_schema.py

      - name: Check SDK schema against runtime fields
        run: python3 cmux-tui/scripts/check-sdk-schema.py

      - name: Test public resource boundary checker
        run: python3 cmux-tui/scripts/test_check_resource_api_boundary.py

      - name: Check public resource API boundary
        run: python3 cmux-tui/scripts/check-resource-api-boundary.py

      - name: Test and check the seven SDK capability descriptors
        run: python3 cmux-tui/bindings/rust/scripts/test_sync_resource_api.py

      - name: Test deterministic SDK generator
        env:
          PYTHONPATH: cmux-tui/bindings
        run: python3 -m unittest discover -s cmux-tui/bindings/codegen/tests -v

      - name: Check all generated SDK wire layers
        run: python3 cmux-tui/bindings/codegen/generate.py --check

      - name: Test package version guard
        run: |
          python3 -m unittest discover \
            -s cmux-tui/bindings/tests \
            -p 'test_*.py' \
            -v

      - name: Test SDK publishing workflow guards
        run: python3 tests/test_tui_publish_workflow_security.py -v

      # The feat-cmux-next debug daemon is saved under conformance's key.
      - name: Test the headless debug daemon producer
        run: python3 tests/test_cmux_tui_headless_debug_workflow.py -v

      - name: Test public TUI installers
        run: python3 tests/test_tui_installers.py

      - name: Test PyPI post-upload reconciliation helper
        run: bash tests/test_tui_pypi_postpublish_reconcile.sh

      - name: Test TUI registry delivery check
        run: python3 cmux-tui/scripts/test_check_release_delivery.py

      - name: Test TUI package artifact contract
        run: python3 tests/test_tui_package_contract.py

      - name: Test TUI npm artifact transfer contract
        run: python3 tests/test_tui_npm_package_artifact.py

      - name: Check package versions
        run: python3 cmux-tui/bindings/check-versions.py --published-only

      - name: Test shared conformance runner
        run: |
          python3 -m unittest discover \
            -s cmux-tui/bindings/conformance \
            -p 'test_*.py' \
            -v

  packages:
    name: ${{ matrix.language }} package
    needs: contract
    # Tier A of the merged pull request replay (scripts/ci/affected-jobs.json pull_request_skip): a pull request
    # into feat-cmux-next skips it unless labeled full-ci; the post-merge batch runs it.
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft != true || contains(github.event.pull_request.labels.*.name, 'full-ci') || (vars.CI_DRAFT_CHEAP_TIER || '1') == '0') && ((inputs.only == '' || inputs.only == 'packages') && ((needs.contract.outputs.sdk_inputs == 'true') && (github.event_name != 'pull_request' || !startsWith(github.event.pull_request.base.ref, 'feat-cmux-next') || contains(github.event.pull_request.labels.*.name, 'full-ci')))) }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && (vars.CI_FORK_LINUX_RUNNER || 'ubuntu-24.04') || 'cmux-linux' }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        language:
          - python
          - typescript
          - rust
          - go
          - java
          - cpp
          - zig
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ inputs.sha || '' }}

      - name: Set up Python 3.9
        if: matrix.language == 'python'
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.9"

      - name: Set up Node.js
        if: matrix.language == 'typescript'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20.19.5"
          cache: npm
          cache-dependency-path: cmux-tui/bindings/typescript/package-lock.json

      - name: Set up pinned Rust toolchain
        if: matrix.language == 'rust'
        uses: ./.github/actions/setup-cmux-tui-rust

      # Keep cargo's registry and cmux-tui/target for the Rust SDK leg between runs.
      # Only feat-cmux-next saves, as in rust-msrv.
      - name: Cache cargo build
        if: matrix.language == 'rust'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Why: docs/ci/cmux-next-workflow-notes.md#note-210 (pool runners keep different leftover toolchains)
          add-rust-environment-hash-key: false
          cache-bin: false
          workspaces: cmux-tui -> target
          save-if: ${{ github.ref == 'refs/heads/feat-cmux-next' }}

      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.22.12"
          cache-dependency-path: cmux-tui/bindings/go/go.mod

      # The reused fleet image (LINUX_RUNNER) has no hosted toolcache JDK, so
      # JAVA_HOME_17_X64 is unset there; setup-java provisions Temurin 17 on any runner.
      - name: Set up JDK 17
        if: matrix.language == 'java'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      # The reused fleet image (LINUX_RUNNER) may ship no clang or cmake; install what is missing.
      - name: Select Clang C++20
        if: matrix.language == 'cpp'
        run: |
          missing=()
          command -v clang++ >/dev/null 2>&1 || missing+=(clang)
          command -v cmake >/dev/null 2>&1 || missing+=(cmake)
          if [ "${#missing[@]}" -gt 0 ]; then
            sudo apt-get update
            sudo apt-get install -y "${missing[@]}"
          fi
          clang++ --version
          cmake --version

      - name: Set up Zig
        if: matrix.language == 'zig'
        uses: mlugg/setup-zig@8d6198c65fb0feaa111df26e6b467fea8345e46f # v2.0.5
        with:
          version: 0.15.2
          # Its own cache saves a new entry per run; zig-global-cache keys it stably.
          use-cache: false
      - name: Restore the Zig global cache (feat-cmux-next pushes save it)
        if: matrix.language == 'zig'
        uses: ./.github/actions/zig-global-cache

      - name: Test and install Python SDK
        if: matrix.language == 'python'
        env:
          PYTHONPATH: cmux-tui/bindings/python
        run: |
          python3 -m pip install \
            --disable-pip-version-check \
            "setuptools==80.9.0"
          python3 -m unittest discover -s cmux-tui/bindings/python/tests -v
          python3 -m pip install \
            --no-build-isolation \
            --no-deps \
            --target "$RUNNER_TEMP/cmux-python-package" \
            ./cmux-tui/bindings/python
          CMUX_PYTHON_PACKAGE="$RUNNER_TEMP/cmux-python-package" python3 - <<'PY'
          import importlib.metadata
          import os
          import pathlib
          import sys

          package = pathlib.Path(os.environ["CMUX_PYTHON_PACKAGE"]).resolve()
          sys.path.insert(0, str(package))
          import cmux

          assert pathlib.Path(cmux.__file__).resolve().is_relative_to(package)
          distribution = next(
              item
              for item in importlib.metadata.distributions(path=[str(package)])
              if item.metadata["Name"] == "cmux-sdk"
          )
          assert not distribution.requires
          PY

      - name: Test packed TypeScript SDK
        if: matrix.language == 'typescript'
        working-directory: cmux-tui/bindings/typescript
        run: |
          npm ci --no-audit --no-fund
          npm test

      - name: Test and package Rust SDKs
        if: matrix.language == 'rust'
        working-directory: cmux-tui
        run: |
          cargo fmt -p cmux-sdk -p cmux-sidebar -- --check
          cargo test \
            -p cmux-sdk \
            -p cmux-sidebar \
            --all-targets \
            --locked
          cargo test \
            -p cmux-sdk \
            -p cmux-sidebar \
            --doc \
            --locked
          python3 "$GITHUB_WORKSPACE/scripts/ci/warnings_policy.py" run -- cargo clippy \
            -p cmux-sdk \
            -p cmux-sidebar \
            --all-targets \
            --locked \
            -- -D warnings
          # Embedders such as Chromium build without sha2 (socket-path-hash).
          cargo test -p cmux-sdk --all-targets --locked --no-default-features
          python3 "$GITHUB_WORKSPACE/scripts/ci/warnings_policy.py" run -- cargo clippy -p cmux-sdk --all-targets --locked --no-default-features -- -D warnings
          RUSTDOCFLAGS="-D warnings" \
            python3 "$GITHUB_WORKSPACE/scripts/ci/warnings_policy.py" run -- \
            cargo doc \
              -p cmux-sdk \
              -p cmux-sidebar \
              --locked \
              --no-deps
          cargo package -p cmux-sdk --locked
          # Full sidebar packaging resolves its versioned crates.io dependency.
          # Publish cmux-sdk first; CI still verifies the exact sidebar file set.
          cargo package -p cmux-sidebar --locked --list

      - name: Test Go SDK
        if: matrix.language == 'go'
        working-directory: cmux-tui/bindings/go
        run: |
          go test ./...
          go test -race ./...
          go vet ./...

      - name: Test external Java jar consumer
        if: matrix.language == 'java'
        working-directory: cmux-tui/bindings/java
        run: bash scripts/test.sh

      - name: Test installed C++ package consumer
        if: matrix.language == 'cpp'
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake \
            -S cmux-tui/bindings/cpp \
            -B "$RUNNER_TEMP/cmux-cpp-sdk" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS="-Wall -Wextra -Wpedantic -Werror"
          cmake --build "$RUNNER_TEMP/cmux-cpp-sdk" --parallel
          ctest --test-dir "$RUNNER_TEMP/cmux-cpp-sdk" --output-on-failure

      - name: Test Zig SDK
        if: matrix.language == 'zig'
        working-directory: cmux-tui/bindings/zig
        run: |
          test "$(zig version)" = "0.15.2"
          zig fmt --check build.zig src examples
          zig build test
          zig build

  consumers:
    name: ${{ matrix.language }} consumer
    needs: contract
    # Tier A of the merged pull request replay (scripts/ci/affected-jobs.json pull_request_skip): a pull request
    # into feat-cmux-next skips it unless labeled full-ci; the post-merge batch runs it.
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft != true || contains(github.event.pull_request.labels.*.name, 'full-ci') || (vars.CI_DRAFT_CHEAP_TIER || '1') == '0') && ((inputs.only == '' || inputs.only == 'consumers') && ((needs.contract.outputs.sdk_inputs == 'true') && (github.event_name != 'pull_request' || !startsWith(github.event.pull_request.base.ref, 'feat-cmux-next') || contains(github.event.pull_request.labels.*.name, 'full-ci')))) }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && (vars.CI_FORK_LINUX_RUNNER || 'ubuntu-24.04') || 'cmux-linux' }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        language:
          - python
          - typescript
          - rust
          - go
          - java
          - cpp
          - zig
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ inputs.sha || '' }}

      - name: Set up Python 3.9
        if: matrix.language == 'python'
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.9"

      - name: Set up Node.js
        if: matrix.language == 'typescript'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20.19.5"
          cache: npm
          cache-dependency-path: |
            cmux-tui/bindings/typescript/package-lock.json
            cmux-tui/bindings/examples/typescript-browser-controller/package-lock.json

      - name: Set up pinned Rust toolchain
        if: matrix.language == 'rust'
        uses: ./.github/actions/setup-cmux-tui-rust

      # Keep cargo's registry and the two Rust consumer example target dirs between
      # runs. Pull requests only restore: a push to main or a dispatch saves.
      - name: Cache cargo build
        if: matrix.language == 'rust'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Why: docs/ci/cmux-next-workflow-notes.md#note-210 (pool runners keep different leftover toolchains)
          add-rust-environment-hash-key: false
          cache-bin: false
          workspaces: |
            cmux-tui/bindings/examples/rust-agent-dashboard -> target
            cmux-tui/bindings/examples/rust-sidebar-monitor -> target
          save-if: ${{ github.ref == 'refs/heads/feat-cmux-next' }}

      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.22.12"
          cache-dependency-path: |
            cmux-tui/bindings/go/go.mod
            cmux-tui/bindings/examples/go-terminal-bot/go.mod

      # The reused fleet image (LINUX_RUNNER) has no hosted toolcache JDK, so
      # JAVA_HOME_17_X64 is unset there; setup-java provisions Temurin 17 on any runner.
      - name: Set up JDK 17
        if: matrix.language == 'java'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      # The reused fleet image (LINUX_RUNNER) may ship no clang or cmake; install what is missing.
      - name: Select Clang C++20
        if: matrix.language == 'cpp'
        run: |
          missing=()
          command -v clang++ >/dev/null 2>&1 || missing+=(clang)
          command -v cmake >/dev/null 2>&1 || missing+=(cmake)
          if [ "${#missing[@]}" -gt 0 ]; then
            sudo apt-get update
            sudo apt-get install -y "${missing[@]}"
          fi
          clang++ --version
          cmake --version

      - name: Set up Zig
        if: matrix.language == 'zig'
        uses: mlugg/setup-zig@8d6198c65fb0feaa111df26e6b467fea8345e46f # v2.0.5
        with:
          version: 0.15.2
          # Its own cache saves a new entry per run; zig-global-cache keys it stably.
          use-cache: false
      - name: Restore the Zig global cache (feat-cmux-next pushes save it)
        if: matrix.language == 'zig'
        uses: ./.github/actions/zig-global-cache

      - name: Test Python agent watchdog
        if: matrix.language == 'python'
        working-directory: cmux-tui/bindings/examples/python-agent-watchdog
        env:
          PYTHONPATH: ${{ github.workspace }}/cmux-tui/bindings/python
        run: python3 -m unittest discover -s tests -v

      - name: Test Python development orchestrator
        if: matrix.language == 'python'
        working-directory: cmux-tui/bindings/examples/python-dev-orchestrator
        env:
          PYTHONPATH: ${{ github.workspace }}/cmux-tui/bindings/python:${{ github.workspace }}/cmux-tui/bindings/examples/python-dev-orchestrator
        run: python3 -m unittest discover -s tests -v

      - name: Test TypeScript browser controller
        if: matrix.language == 'typescript'
        working-directory: cmux-tui/bindings/examples/typescript-browser-controller
        run: |
          npm ci --no-audit --no-fund
          npm test

      - name: Test Rust resource consumers
        if: matrix.language == 'rust'
        run: |
          cargo test \
            --manifest-path cmux-tui/bindings/examples/rust-agent-dashboard/Cargo.toml \
            --locked
          python3 "$GITHUB_WORKSPACE/scripts/ci/warnings_policy.py" run -- cargo clippy \
            --manifest-path cmux-tui/bindings/examples/rust-agent-dashboard/Cargo.toml \
            --locked \
            --all-targets \
            -- -D warnings
          cargo test \
            --manifest-path cmux-tui/bindings/examples/rust-sidebar-monitor/Cargo.toml \
            --locked \
            --all-targets
          python3 "$GITHUB_WORKSPACE/scripts/ci/warnings_policy.py" run -- cargo clippy \
            --manifest-path cmux-tui/bindings/examples/rust-sidebar-monitor/Cargo.toml \
            --locked \
            --all-targets \
            -- -D warnings

      - name: Test Go terminal bot
        if: matrix.language == 'go'
        working-directory: cmux-tui/bindings/examples/go-terminal-bot
        run: |
          go test ./...
          go test -race ./...
          go vet ./...

      - name: Test Java CI orchestrator
        if: matrix.language == 'java'
        run: cmux-tui/bindings/examples/java-ci-orchestrator/scripts/test.sh

      - name: Test installed C++ terminal frontend
        if: matrix.language == 'cpp'
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake \
            -S cmux-tui/bindings/cpp \
            -B "$RUNNER_TEMP/cmux-cpp-install-build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMUX_BUILD_TESTS=OFF
          cmake --build "$RUNNER_TEMP/cmux-cpp-install-build" --parallel
          cmake \
            --install "$RUNNER_TEMP/cmux-cpp-install-build" \
            --prefix "$RUNNER_TEMP/cmux-cpp-install"
          cmake \
            -S cmux-tui/bindings/examples/cpp-terminal-frontend \
            -B "$RUNNER_TEMP/cmux-cpp-frontend" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMUX_CPP_SDK_DIR= \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/cmux-cpp-install"
          cmake --build "$RUNNER_TEMP/cmux-cpp-frontend" --parallel
          ctest --test-dir "$RUNNER_TEMP/cmux-cpp-frontend" --output-on-failure

      - name: Test Zig session supervisor
        if: matrix.language == 'zig'
        working-directory: cmux-tui/bindings/examples/zig-session-supervisor
        run: |
          test "$(zig version)" = "0.15.2"
          zig fmt --check build.zig src tests
          zig build test -Doptimize=Debug
          zig build test -Doptimize=ReleaseSafe
          zig build -Doptimize=Debug
          zig build -Doptimize=ReleaseSafe

  rust-msrv:
    name: Rust SDK MSRV (1.88)
    needs: contract
    # Tier A of the merged pull request replay (scripts/ci/affected-jobs.json pull_request_skip): a pull request
    # into feat-cmux-next skips it unless labeled full-ci; the post-merge batch runs it.
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft != true || contains(github.event.pull_request.labels.*.name, 'full-ci') || (vars.CI_DRAFT_CHEAP_TIER || '1') == '0') && ((inputs.only == '' || inputs.only == 'rust-msrv') && ((needs.contract.outputs.sdk_inputs == 'true') && (github.event_name != 'pull_request' || !startsWith(github.event.pull_request.base.ref, 'feat-cmux-next') || contains(github.event.pull_request.labels.*.name, 'full-ci')))) }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && (vars.CI_FORK_LINUX_RUNNER || 'ubuntu-24.04') || 'cmux-linux' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ inputs.sha || '' }}

      # The reused fleet image (LINUX_RUNNER) may lack rustup or keep it off PATH;
      # provision it as setup-cmux-tui-rust does.
      - name: Install Rust 1.88 MSRV toolchain
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --default-toolchain none --no-modify-path
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustup toolchain install 1.88.0 --profile minimal --component clippy --component rustfmt

      # Before rust-cache: its cleanup must never reach a home a sibling runner builds from.
      - name: Give this runner instance its own CARGO_HOME
        uses: ./.github/actions/runner-cargo-home

      # Keep cargo's registry and the four target dirs (the cmux-tui workspace that
      # holds the SDK crates, and the three example workspaces) between runs. The
      # job's own key, with the toolchain in it, so 1.88 artifacts never mix with
      # the pinned toolchain's. Only feat-cmux-next saves: a pull request restores what its
      # base (and main, the default branch) saved, and a branch's own save never
      # comes back, so it would only push useful entries out of the cache store.
      - name: Cache cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Why: docs/ci/cmux-next-workflow-notes.md#note-210 (pool runners keep different leftover toolchains)
          add-rust-environment-hash-key: false
          cache-bin: false
          workspaces: |
            cmux-tui -> target
            cmux-tui/bindings/examples/rust-agent-screen-detection -> target
            cmux-tui/bindings/examples/rust-agent-dashboard -> target
            cmux-tui/bindings/examples/rust-sidebar-monitor -> target
          key: rust-1.88.0
          save-if: ${{ github.ref == 'refs/heads/feat-cmux-next' }}

      - name: Test public Rust SDK crates and examples on MSRV
        run: |
          cargo +1.88.0 fmt --manifest-path cmux-tui/bindings/rust/Cargo.toml -- --check
          cargo +1.88.0 test --manifest-path cmux-tui/bindings/rust/Cargo.toml --locked
          cargo +1.88.0 test --manifest-path cmux-tui/bindings/rust-sidebar/Cargo.toml --locked
          cargo +1.88.0 test \
            --manifest-path cmux-tui/bindings/examples/rust-agent-screen-detection/Cargo.toml \
            --locked
          python3 "$GITHUB_WORKSPACE/scripts/ci/warnings_policy.py" run -- cargo +1.88.0 clippy \
            --manifest-path cmux-tui/bindings/examples/rust-agent-dashboard/Cargo.toml \
            --locked \
            --all-targets \
            -- -D warnings
          python3 "$GITHUB_WORKSPACE/scripts/ci/warnings_policy.py" run -- cargo +1.88.0 clippy \
            --manifest-path cmux-tui/bindings/examples/rust-sidebar-monitor/Cargo.toml \
            --locked \
            --all-targets \
            -- -D warnings

  conformance:
    env:
      GHOSTTY_ZIG_SOURCE: ghostty-next
    name: seven-language live conformance
    needs: contract
    # By the crate graph (the contract job's graph step); a failed or skipped router never skips it.
    # Tier A (scripts/ci/affected-jobs.json pull_request_skip), as contract is: a pull request into
    # feat-cmux-next skips it unless labeled full-ci, and the feat-cmux-next push runs it. Without the clause
    # the skipped contract left sdk_inputs empty, which reads as != 'false': 148 of its 154 pull request runs
    # on 11-21 14:29-17:00Z ran on heads that changed no SDK input (5 of 282 merged commits did).
    # After merge (CI 10x, 2026-11-21: 1.57% of pull request runner-minutes, 0.05% of heads it alone caught): a
    # pull request runs it only when it changes the SDK and protocol inputs (sdk_inputs: bindings/, spec/, the
    # workspace manifests) or carries full-ci; every post-merge batch the graph reaches runs it.
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft != true || contains(github.event.pull_request.labels.*.name, 'full-ci') || (vars.CI_DRAFT_CHEAP_TIER || '1') == '0') && ((inputs.only == '' || inputs.only == 'conformance') && (!cancelled() && (github.event_name != 'pull_request' || !startsWith(github.event.pull_request.base.ref, 'feat-cmux-next') || contains(github.event.pull_request.labels.*.name, 'full-ci')) && (github.event_name != 'pull_request' || needs.contract.outputs.sdk_inputs != 'false' || contains(github.event.pull_request.labels.*.name, 'full-ci')) && (needs.contract.result != 'success' || needs.contract.outputs.conformance != 'false'))) }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && (vars.CI_FORK_LINUX_RUNNER || 'ubuntu-24.04') || 'cmux-linux' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ inputs.sha || '' }}

      # A green result of this job for the same input tree (affected_jobs.py result_key) is this
      # run's result: the tested steps are skipped and the job reports green with that run named.
      - name: Reuse a green result for the same input tree
        id: tree
        uses: ./.github/actions/tree-result
        with:
          mode: restore
          job: conformance
          key: ${{ needs.contract.outputs.conformance_tree }}

      - name: Initialize Ghostty protocol submodule
        if: ${{ steps.tree.outputs.hit != 'true' }}
        shell: bash
        run: |
          bash scripts/ci/init-submodule.sh ghostty
          bash scripts/ci/init-submodule.sh ghostty-next

      - name: Install Linux build dependencies
        if: ${{ steps.tree.outputs.hit != 'true' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev pkg-config cmake

      - name: Set up Python
        if: ${{ steps.tree.outputs.hit != 'true' }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12.8"

      - name: Set up Node.js
        if: ${{ steps.tree.outputs.hit != 'true' }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22.23.4"
          cache: npm
          cache-dependency-path: cmux-tui/bindings/typescript/package-lock.json

      - name: Set up pinned cmux-tui Rust
        if: ${{ steps.tree.outputs.hit != 'true' }}
        uses: ./.github/actions/setup-cmux-tui-rust

      - name: Set up Go
        if: ${{ steps.tree.outputs.hit != 'true' }}
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.22.12"
          cache-dependency-path: cmux-tui/bindings/go/go.mod

      # The reused fleet image (LINUX_RUNNER) has no hosted toolcache JDK, so
      # JAVA_HOME_17_X64 is unset there; setup-java provisions Temurin 17 on any runner.
      - name: Set up JDK 17
        if: ${{ steps.tree.outputs.hit != 'true' }}
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Resolve Ghostty Zig version
        if: ${{ steps.tree.outputs.hit != 'true' }}
        id: ghostty-zig-version
        run: |
          set -euo pipefail
          version="$(bash ./scripts/ghostty-zig-version.sh)"
          [[ -n "$version" ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Zig for Ghostty
        if: ${{ steps.tree.outputs.hit != 'true' }}
        uses: mlugg/setup-zig@8d6198c65fb0feaa111df26e6b467fea8345e46f # v2.0.5
        with:
          version: ${{ steps.ghostty-zig-version.outputs.version }}
          # Its own cache saves a new entry per run; zig-global-cache keys it stably.
          use-cache: false
      - name: Restore the Zig global cache (feat-cmux-next pushes save it)
        if: ${{ steps.tree.outputs.hit != 'true' }}
        uses: ./.github/actions/zig-global-cache

      - name: Install TypeScript adapter build tools
        if: ${{ steps.tree.outputs.hit != 'true' }}
        working-directory: cmux-tui/bindings/typescript
        run: npm ci --no-audit --no-fund

      # The build reads only the cmux-tui tree, the ghostty submodules, and the
      # zig and Rust toolchains (the Zig that the ghostty-next gitlink's
      # build.zig.zon names, and cmux-tui/rust-toolchain.toml).
      # Keyed on exactly those, an unchanged tree skips a five-minute compile,
      # which is every run started by a workflow-only edit.
      - name: Key the headless cmux-tui build
        if: ${{ steps.tree.outputs.hit != 'true' }}
        id: headless-key
        run: |
          set -euo pipefail
          echo "key=cmux-tui-headless-v3-${RUNNER_OS}-${RUNNER_ARCH}-$(git rev-parse HEAD:cmux-tui)-$(git rev-parse HEAD:ghostty)-$(git rev-parse HEAD:ghostty-next)" >> "$GITHUB_OUTPUT"

      - name: Restore the headless cmux-tui build
        if: ${{ steps.tree.outputs.hit != 'true' }}
        id: headless-cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: cmux-tui/target/debug/cmux-tui
          key: ${{ steps.headless-key.outputs.key }}

      # The exact binary's key names the whole cmux-tui tree, so a PR that changes
      # cmux-tui never hits it. Restore feat-cmux-next's target dir
      # (cmux-tui-headless-debug.yml saves it) and rebuild only what changed. Read-only here.
      - name: Cache the cmux-tui target dir
        if: ${{ steps.tree.outputs.hit != 'true' && (steps.headless-cache.outputs.cache-hit != 'true') }}
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Why: docs/ci/cmux-next-workflow-notes.md#note-210 (pool runners keep different leftover toolchains)
          add-rust-environment-hash-key: false
          cache-bin: false
          workspaces: cmux-tui -> target
          shared-key: cmux-tui-headless-debug
          cache-workspace-crates: "true"
          save-if: false

      - name: Build exact headless cmux-tui
        if: ${{ steps.tree.outputs.hit != 'true' && (steps.headless-cache.outputs.cache-hit != 'true') }}
        working-directory: cmux-tui
        env:
          GHOSTTY_ZIG_REQUIRED: ${{ steps.ghostty-zig-version.outputs.version }}
          # libghostty-vt for any x86-64 CPU: this binary is cached and restored on other pool hosts,
          # and a build-host-native one dies with SIGILL there (v3 key drops the native v2 builds).
          CMUX_GHOSTTY_VT_ZIG_CPU: baseline
        run: |
          test "$(zig version)" = "$GHOSTTY_ZIG_REQUIRED"
          cargo build -p cmux-tui --bin cmux-tui --locked

      # Pull request caches stay read-only. main publishes the build they reuse,
      # and cmux-tui-headless-debug.yml does on feat-cmux-next.
      - name: Save the headless cmux-tui build
        if: ${{ steps.tree.outputs.hit != 'true' && ((github.event_name == 'push' || inputs.sha != '') && steps.headless-cache.outputs.cache-hit != 'true') }}
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: cmux-tui/target/debug/cmux-tui
          key: ${{ steps.headless-key.outputs.key }}

      - name: Set up Zig for SDK conformance
        if: ${{ steps.tree.outputs.hit != 'true' }}
        uses: mlugg/setup-zig@8d6198c65fb0feaa111df26e6b467fea8345e46f # v2.0.5
        with:
          version: 0.15.2
          # Its own cache saves a new entry per run; zig-global-cache keys it stably.
          use-cache: false
      - name: Restore the Zig global cache (feat-cmux-next pushes save it)
        if: ${{ steps.tree.outputs.hit != 'true' }}
        uses: ./.github/actions/zig-global-cache

      - name: Run shared fake and live protocol contract
        if: ${{ steps.tree.outputs.hit != 'true' }}
        env:
          CC: clang
          CXX: clang++
          CMUX_ZIG: zig
          NODE_OPTIONS: --experimental-websocket
        run: |
          test "$(zig version)" = "0.15.2"
          test "$(node -p 'typeof WebSocket')" = "function"
          python3 cmux-tui/bindings/conformance/runner.py \
            --require python,typescript,rust,go,java,cpp,zig \
            --cmux-tui-bin "$GITHUB_WORKSPACE/cmux-tui/target/debug/cmux-tui"

      # cmux::raw::ByteAttachment, the typed state calls, Home (ensure_home,
      # conversation tabs, typed conversation results), and tab groups, closed
      # history, ephemeral workspaces and typed bookmarks, and the daemon
      # client's mirror (tab groups, bookmarks-changed, personal-changed and
      # spaces) against the exact
      # headless daemon built above.
      - name: Test Rust SDK byte attachment and typed state against the live daemon
        if: ${{ steps.tree.outputs.hit != 'true' && (needs.contract.outputs.sdk_inputs == 'true') }}
        working-directory: cmux-tui
        env:
          CMUX_SDK_LIVE_TUI_BIN: ${{ github.workspace }}/cmux-tui/target/debug/cmux-tui
        run: |
          cargo test -p cmux-sdk --locked --test byte_attachment_live --test typed_state_ops_live --test home_conversation_live --test state_resources_live --test capabilities_per_connection_live -- --nocapture
          cargo test -p cmux-daemon-client --locked --test mirror_live --test mirror_agent_tabs_live --test spaces_live --test session_deltas_live -- --nocapture

      # Kept only from a run in which every tested step ran: the live SDK step above runs only when the
      # change touched the SDKs, which is the diff's, not the tree's.
      - name: Record this green result for its input tree
        if: ${{ success() && steps.tree.outputs.hit != 'true' && needs.contract.outputs.sdk_inputs == 'true' }}
        uses: ./.github/actions/tree-result
        with:
          mode: save
          job: conformance
          key: ${{ needs.contract.outputs.conformance_tree }}

  # The code-mode MCP (cmux-tui/bindings/typescript/code-mode/mcp.mjs) and the bwrap sandbox of
  # scripts/cmux-next/cmux-code-mode-runner: a cancelled cmux_exec returns and leaves no process
  # behind. No job ran this test (it had no registry entry, tests/test_pr_lane_coverage.py), and
  # it skips without bun and bwrap, so this job installs both and the test fails on CI without them.
  code-mode:
    name: code-mode MCP cancellation
    # Tier A of the merged pull request replay (scripts/ci/affected-jobs.json pull_request_skip): a pull request
    # into feat-cmux-next skips it unless labeled full-ci; the post-merge batch runs it.
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft != true || contains(github.event.pull_request.labels.*.name, 'full-ci') || (vars.CI_DRAFT_CHEAP_TIER || '1') == '0') && ((inputs.only == '' || inputs.only == 'code-mode') && ((github.event_name != 'pull_request' || !startsWith(github.event.pull_request.base.ref, 'feat-cmux-next') || contains(github.event.pull_request.labels.*.name, 'full-ci')))) }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && (vars.CI_FORK_LINUX_RUNNER || 'ubuntu-24.04') || 'cmux-linux' }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ inputs.sha || '' }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
          no-cache: ${{ !startsWith(github.workspace, '/home/runner/work/') }}

      # Ubuntu 24.04 lets only AppArmor-profiled programs make an unprivileged user
      # namespace; bwrap needs one, so the runner VM lifts that restriction.
      - name: Install bwrap
        run: |
          set -euo pipefail
          if ! command -v bwrap >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y bubblewrap
          fi
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --unshare-all --ro-bind / / true

      - name: A cancelled cmux_exec returns and leaves no process behind
        run: python3 tests/test_cmux_code_mode_mcp.py
