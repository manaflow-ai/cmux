name: cmux-tui SDKs

on:
  # feat-cmux-next runs this in the post-merge batch (cmux-next-post-merge.yml, suite cmux-tui-sdks
  # in .github/post-merge-batch.json), not once per merge: sha is the commit to test, only one job
  # id a bisect probe runs alone. Leo 2026-11-21: "whatever we need to cut, we cut."
  workflow_call:
    inputs:
      sha:
        description: Commit to test (empty is the caller's commit).
        type: string
        default: ""
      only:
        description: Run only this job id (a bisect probe); empty runs every job.
        type: string
        default: ""
