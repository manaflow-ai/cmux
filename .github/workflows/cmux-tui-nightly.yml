name: cmux-tui nightly

on:
  # Dispatch on nightly-next: that branch holds the promoted, green
  # feat-cmux-next head and only the promote app can move it, so the npm-tui
  # environment admits it. Packages publish under the `next` dist-tag.
  workflow_dispatch:
    inputs:
      include_windows:
        description: "Include experimental Windows packages (requires registry publisher setup)"
        required: true
        default: false
        type: boolean

permissions: {}

concurrency:
  group: tui-nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: derive nightly versions
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    permissions:
      contents: read
    outputs:
      npm_version: ${{ steps.version.outputs.npm_version }}
      pypi_version: ${{ steps.version.outputs.pypi_version }}
      head_sha: ${{ steps.version.outputs.head_sha }}
    steps:
      - name: Require a nightly-next or main dispatch
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/nightly-next" && "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Refusing to publish a TUI nightly from $GITHUB_REF; dispatch this workflow on nightly-next." >&2
            exit 1
          fi

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Derive nightly versions
        id: version
        run: |
          set -euo pipefail
          git fetch --force --tags
          latest_tag="$(
            git tag --merged HEAD --list 'cmux-tui-v*' --sort=-v:refname |
              grep -E '^cmux-tui-v[0-9]+\.[0-9]+\.[0-9]+$' |
              head -n 1 || true
          )"
          if [[ -z "$latest_tag" ]]; then
            next_stable="0.9.0"
          else
            latest="${latest_tag#cmux-tui-v}"
            IFS=. read -r major minor patch <<<"$latest"
            next_stable="$major.$minor.$((patch + 1))"
          fi
          stamp="$(date -u +%Y%m%d)"
          npm_version="$next_stable-nightly.$stamp.$GITHUB_RUN_NUMBER"
          pypi_version="$next_stable.dev${stamp}${GITHUB_RUN_NUMBER}"
          head_sha="$(git rev-parse HEAD)"
          if [[ "$head_sha" != "$GITHUB_SHA" ]]; then
            echo "Nightly checkout $head_sha does not match workflow commit $GITHUB_SHA" >&2
            exit 1
          fi
          {
            echo "npm_version=$npm_version"
            echo "pypi_version=$pypi_version"
            echo "head_sha=$head_sha"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### TUI nightly"
            echo
            echo "- HEAD: $head_sha"
            echo "- npm: $npm_version"
            echo "- PyPI: $pypi_version"
          } >> "$GITHUB_STEP_SUMMARY"

  build-package:
    needs: version
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/cmux-tui-build-package.yml
    with:
      retention_days: 30  # tui-publish-npm/pypi download these by run id
      version: ${{ needs.version.outputs.npm_version }}
      package_npm: true
      # PyPI's pypi-tui environment admits only cmux-tui-v* tags with a
      # reviewer, so a main nightly can never publish there; tagged releases
      # (tui-publish-pypi.yml) own PyPI.
      package_pypi: false
      include_windows: ${{ inputs.include_windows == true }}
      attest_packages: true
      # Match stable native packages; the Cloudflare Worker deploys separately.
      # macOS legs build on the light-class minis' side lane (attempt 1),
      # re-runs on Blacksmith macOS, never a hosted Mac (Leo, 2026-10-27);
      # Linux legs take the builder's own Blacksmith defaults (empty input:
      # LINUX_RUNNER for light jobs, 32 vCPU for the builds), never
      # GitHub-hosted Ubuntu. A literal
      # light label, not vars.CI_SIDE_LANE_RUNNER: the std pools include the
      # benchmark mini cmux11s, which nightlies must never reach (a153,
      # 2026-10-20). See docs/ci-runners.md.
      macos_runner: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || 'glaeda-side-light-xcode-26.6' }}
      macos_retry_runner: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || 'blacksmith-6vcpu-macos-15' }}
      linux_runner: ''
      linux_arm64_runner: ''
      # Windows legs (include_windows) take the builder's Blacksmith default
      # (WINDOWS_RUNNER, else blacksmith-4vcpu-windows-2025), never a
      # GitHub-hosted image (user, 2026-10-28: Blacksmith for everything).
      windows_runner: ''
      # Pin the exact sha the version job resolved so every matrix leg builds
      # the same commit even if main advances mid-run.
      checkout_ref: ${{ needs.version.outputs.head_sha }}

  publish-npm:
    needs:
      - version
      - build-package
    runs-on: ubuntu-latest # github-hosted-required: npm provenance needs a github-hosted runner
    permissions:
      contents: read
      id-token: write
      attestations: read
    environment:
      name: npm-tui
      url: https://www.npmjs.com/package/cmux
    steps:
      - name: Checkout immutable nightly source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ needs.version.outputs.head_sha }}

      - name: Download npm package directories
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: npm-packages
          path: dist

      - name: Download the generated third-party notices
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: package-notices
          path: dist/package-notices

      - name: Restore npm package executable modes
        run: |
          python3 cmux-tui/dist/scripts/package_npm_artifact.py extract \
            --archive dist/npm-packages.tar.gz \
            --out dist

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22.23.4"
          registry-url: https://registry.npmjs.org

      - name: Install npm with OIDC support
        run: npm install -g npm@11.5.1

      - name: Revalidate packed npm contract
        env:
          # Windows packages exist only when the dispatch asked for them.
          WINDOWS_FLAG: ${{ inputs.include_windows == true && '--include-windows' || '' }}
        run: |
          python3 cmux-tui/dist/scripts/validate_package_contract.py \
            --npm-packages dist/npm-packages \
            --version "${{ needs.version.outputs.npm_version }}" \
            --notices-dir dist/package-notices \
            ${WINDOWS_FLAG:+"$WINDOWS_FLAG"} \
            --install-npm-package cmux-tui-linux-x64 \
            --install-npm-relay-package cmux-relay-linux-x64

      - name: Verify native npm package attestations
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.version.outputs.head_sha }}
        run: |
          set -euo pipefail
          mapfile -d '' binaries < <(
            find dist/npm-packages -type f \
              \( -path '*/cmux-tui-*/bin/cmux-tui*' -o \
                 -path '*/cmux-relay-*/bin/chatmux-relay*' \) \
              -print0 | sort -z
          )
          ((${#binaries[@]} > 0))
          for binary in "${binaries[@]}"; do
            gh attestation verify "$binary" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/cmux-tui-build-package.yml" \
              --deny-self-hosted-runners \
              --source-digest "$RELEASE_SHA" \
              --source-ref "$GITHUB_REF"
          done

      # cmux-relay packages are validated in the artifact contract above but
      # publish only through the cmux-relay-v* tag family
      # (relay-publish-npm.yml); nightlies never move relay dist-tags.
      # Linux and macOS testers install `cmux@next`.
      - name: Publish platform packages with next dist-tag
        env:
          INCLUDE_WINDOWS: ${{ inputs.include_windows == true }}
        run: |
          set -euo pipefail
          packages=(
            cmux-tui-darwin-arm64
            cmux-tui-darwin-x64
            cmux-tui-linux-x64
            cmux-tui-linux-arm64
          )
          [[ "$INCLUDE_WINDOWS" != true ]] || packages+=(cmux-tui-win32-x64)
          for package in "${packages[@]}"; do
            echo "Publishing $package"
            npm publish --provenance --tag next "dist/npm-packages/$package"
          done

      - name: Publish launcher package with next dist-tag
        run: npm publish --provenance --tag next dist/npm-packages/cmux
