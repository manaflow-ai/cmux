name: CI artifact transport

on:
  pull_request:
    paths:
      - .github/workflows/ci-artifact-transport.yml
      - .github/workflows/ci.yml
      - .github/workflows/ci-macos.yml
      - workers/ci-artifacts/**
      - scripts/ci/restore-r2-artifact.py
      - scripts/ci/parallel_artifact_download.py
      - tests/test_ci_parallel_artifact_transport.py
      - scripts/ci/node_product_cache.py
      - scripts/ci/peer_product_source.py
      - scripts/ci/app-host-products-archive.sh
      - scripts/ci/app_host_layer_transport.py
      - scripts/ci/app_host_layered_products.py
      - tests/test_app_host_layer_transport.py
      - tests/test_app_host_layered_products.py
      - tests/test_app_host_products_archive.sh
      - tests/test_ci_selective_layer_wiring.py
      - scripts/ci/restore-app-host-test-product.sh
      - tests/test_node_product_cache.py
      - scripts/ci/verify-r2-canary.py
      - scripts/ci/r2-canary-cloudflare.py
      - tests/test_ci_r2_canary.py
      - .github/workflows/ci-artifact-canary.yml
      - tests/test_ci_r2_artifact.py
  push:
    branches: [main]
    paths:
      - .github/workflows/ci-artifact-transport.yml
      - workers/ci-artifacts/**
      - scripts/ci/restore-r2-artifact.py
      - scripts/ci/parallel_artifact_download.py
      - tests/test_ci_parallel_artifact_transport.py
      - scripts/ci/node_product_cache.py
      - scripts/ci/peer_product_source.py
      - scripts/ci/restore-app-host-test-product.sh
      - tests/test_node_product_cache.py
      - scripts/ci/verify-r2-canary.py
      - scripts/ci/r2-canary-cloudflare.py
      - tests/test_ci_r2_canary.py
      - .github/workflows/ci-artifact-canary.yml
      - tests/test_ci_r2_artifact.py

permissions:
  contents: read

concurrency:
  group: ci-artifact-transport-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  transport:
    runs-on: ${{ vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Detect Worker changes
        id: worker
        run: |
          set -euo pipefail
          if ! base="$(git rev-parse -q --verify 'HEAD^1')"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Comparison parent unavailable; running Worker validation."
            exit 0
          fi

          set +e
          git diff --quiet --no-renames "$base" HEAD -- \
            workers/ci-artifacts \
            .github/workflows/ci-artifact-transport.yml
          diff_status=$?
          set -e

          case "$diff_status" in
            0) echo "run=false" >> "$GITHUB_OUTPUT" ;;
            1) echo "run=true" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "run=true" >> "$GITHUB_OUTPUT"
              echo "::warning::Worker diff unavailable; validating conservatively."
              ;;
          esac

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        if: steps.worker.outputs.run == 'true'
        with:
          node-version: '24'
      - name: Test transport and fallback
        run: |
          python3 tests/test_node_product_cache.py
          python3 tests/test_ci_r2_artifact.py
          python3 tests/test_ci_r2_canary.py
          python3 tests/test_app_host_layer_transport.py
          python3 tests/test_app_host_layered_products.py
          bash tests/test_app_host_products_archive.sh
          python3 tests/test_ci_selective_layer_wiring.py
          python3 tests/test_ci_parallel_artifact_transport.py
      - name: Install local Worker test tools
        if: steps.worker.outputs.run == 'true'
        working-directory: workers/ci-artifacts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test Worker with local R2 and Durable Objects
        if: steps.worker.outputs.run == 'true'
        working-directory: workers/ci-artifacts
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: npm run check
