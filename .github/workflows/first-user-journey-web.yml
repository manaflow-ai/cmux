name: first-user journey (web)

# Registration only. The real first-user journey matrix lives on feat-cmux-next. GitHub resolves a
# workflow by file name only when the file exists on the default branch, so without this file the
# dispatch from first-user-journey-web-dispatch.yml 404s. A dispatch with ref feat-cmux-next runs
# feat-cmux-next's own first-user-journey-web.yml, never this one. This copy has no schedule,
# pull_request or push trigger, so it never runs on main by itself, and a dispatch on main does nothing.
# The inputs mirror feat-cmux-next's so a dispatch's inputs validate wherever GitHub checks them.
on:
  workflow_dispatch:
    inputs:
      only:
        description: "Cells to run, comma-separated (claude/signed-out, claude, pages/settings); empty runs every cell"
        required: false
        default: ""

permissions: {}

env:
  # Temporary REST budget attribution: one gh-call line per GitHub API call (scripts/ci/api_call_log/env.sh, fetched at a fixed commit when the checkout has no copy).
  BASH_ENV: '$({ w="${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh"; t="${RUNNER_TEMP:-/nonexistent}/api-call-log-src"; if [ -f "$w" ]; then echo "$w"; elif [ -n "${RUNNER_TEMP:-}" ]; then if [ ! -f "$t/env.sh" ] && [ ! -e "$t.tried" ] && { [ "${RUNNER_OS:-}" = Linux ] || [ "${RUNNER_OS:-}" = macOS ]; } && [ "$(date -u +%Y%m%d%H)" -lt 2026112300 ]; then : > "$t.tried"; mkdir -p "$t.part" && for x in env.sh gh sitecustomize.py isolated.py; do curl -fsSL --max-time 5 -o "$t.part/$x" "https://raw.githubusercontent.com/manaflow-ai/cmux/27647ffd3ae838c63be28ca3e5883dcd68c34518/scripts/ci/api_call_log/$x" || break; done; [ -s "$t.part/isolated.py" ] && mv "$t.part" "$t"; fi; if [ -f "$t/env.sh" ]; then echo "$t/env.sh"; else echo unset BASH_ENV > "$t.off.sh" && echo "$t.off.sh"; fi; fi; } 2>/dev/null)'

jobs:
  registration:
    if: github.ref != 'refs/heads/main'
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || 'cmux-linux' }}
    timeout-minutes: 1
    steps:
      - name: Nothing to do outside feat-cmux-next
        run: echo "the first-user journey runs from feat-cmux-next's first-user-journey-web.yml"
