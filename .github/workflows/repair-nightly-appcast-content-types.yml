name: Repair nightly appcast Content-Type

on:
  pull_request:
    paths:
      - .github/workflows/repair-nightly-appcast-content-types.yml
      - scripts/ci/repair-nightly-appcast-content-types.py
      - scripts/ci/upload-r2-object.py
      - tests/test_repair_nightly_appcast_content_types.py
  workflow_dispatch:
    inputs:
      execute:
        description: Correct only the four existing nightly feeds with conditional writes
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

# One group per run: every write is conditional, so runs never need to wait
# for each other, and a shared group let a pull request run replace a waiting
# repair.
concurrency:
  group: repair-nightly-appcast-content-types-${{ github.run_id }}
  cancel-in-progress: false

env:
  # Temporary REST budget attribution: one gh-call line per GitHub API call (scripts/ci/api_call_log/env.sh, fetched at a fixed commit when the checkout has no copy).
  BASH_ENV: '$({ w="${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh"; t="${RUNNER_TEMP:-/nonexistent}/api-call-log-src"; if [ -f "$w" ]; then echo "$w"; elif [ -n "${RUNNER_TEMP:-}" ]; then if [ ! -f "$t/env.sh" ] && [ ! -e "$t.tried" ] && { [ "${RUNNER_OS:-}" = Linux ] || [ "${RUNNER_OS:-}" = macOS ]; } && [ "$(date -u +%Y%m%d%H)" -lt 2026112300 ]; then : > "$t.tried"; mkdir -p "$t.part" && for x in env.sh gh sitecustomize.py isolated.py; do curl -fsSL --max-time 5 -o "$t.part/$x" "https://raw.githubusercontent.com/manaflow-ai/cmux/27647ffd3ae838c63be28ca3e5883dcd68c34518/scripts/ci/api_call_log/$x" || break; done; [ -s "$t.part/isolated.py" ] && mv "$t.part" "$t"; fi; if [ -f "$t/env.sh" ]; then echo "$t/env.sh"; else echo unset BASH_ENV > "$t.off.sh" && echo "$t.off.sh"; fi; fi; } 2>/dev/null)'

jobs:
  test:
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && github.event_name != 'merge_group' && github.run_attempt == 1 && 'cmux-gcp-nightly-jit-x64' || vars.CI_OVERFLOW_LINUX || 'cmux-linux' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - run: python3 tests/test_repair_nightly_appcast_content_types.py

  repair:
    # Production secrets: GitHub releases them only to protected refs (the
    # environment's deployment branch policy: main, tags v*).
    environment: release
    if: github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && github.event_name != 'merge_group' && github.run_attempt == 1 && 'cmux-gcp-nightly-jit-x64' || vars.CI_CLOUD_OVERFLOW_SAVED && 'blacksmith-16vcpu-ubuntu-2404' || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Refuse to race an active nightly workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          active=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/nightly.yml/runs?per_page=100" \
            --jq '[.workflow_runs[] | select(.status != "completed")] | length')
          if [ "$active" != 0 ]; then
            echo "Nightly publication is active; retry this repair after it finishes."
            exit 1
          fi
      - name: Repair current objects without changing their XML
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: "https://${{ secrets.CF_R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
          EXECUTE: ${{ inputs.execute }}
        run: |
          set -euo pipefail
          args=()
          if [ "$EXECUTE" = true ]; then args+=(--execute); fi
          python3 scripts/ci/repair-nightly-appcast-content-types.py \
            --endpoint-url "$R2_ENDPOINT" "${args[@]}"
      - name: Verify all four public HEAD responses
        if: inputs.execute
        run: |
          python3 - <<'PY'
          import subprocess
          for feed in ("appcast-arm64.xml", "appcast-x86_64.xml", "appcast-universal.xml", "appcast.xml"):
              output = subprocess.check_output(
                  ["curl", "--fail", "--silent", "--show-error", "--head", "--max-time", "30",
                   f"https://files.cmux.com/nightly/{feed}"], text=True,
              )
              headers = dict(line.split(":", 1) for line in output.splitlines() if ":" in line)
              headers = {key.lower(): value.strip() for key, value in headers.items()}
              content_type = headers.get("content-type")
              print(f"{feed}: Content-Type: {content_type}")
              assert content_type == "application/xml", feed
          PY
