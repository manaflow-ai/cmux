name: Cloud provider Release compile guard

on:
  pull_request:
    paths:
      - Sources/Surfaces/CmuxTuiSurfaceProvider*.swift
      - Sources/Surfaces/CmuxTuiSurfaceProviders.swift
      - Sources/Surfaces/Workspace+CloudPaneRouting.swift
      - Sources/Cloud/CloudTreeCellView.swift
      - cmux.xcodeproj/project.pbxproj
      - .github/workflows/cloud-provider-release-guard.yml
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or SHA to compile
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: cloud-provider-release-${{ github.event.pull_request.number || inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  cloud-provider-release-compile:
    name: Cloud provider Release compile
    runs-on: ${{ vars.MACOS_RUNNER_26_RELEASE || 'blacksmith-12vcpu-macos-26' }}
    timeout-minutes: 45
    env:
      CMUX_CI_XCODE_APP: ${{ vars.CMUX_CI_XCODE_APP_MACOS_26 }}
      CMUX_CI_REQUIRED_MACOS_SDK_MAJOR: "26"
      SOURCE_PACKAGES_DIR: ${{ github.workspace }}/.ci-source-packages
      DERIVED_DATA_PATH: ${{ github.workspace }}/build-cloud-provider-release
    steps:
      - name: Clear stale git locks
        shell: bash
        run: |
          set -euo pipefail
          ws="${GITHUB_WORKSPACE:-$PWD}"
          rm -f "$ws/.git/index.lock" 2>/dev/null || true
          if [ -d "$ws/.git/modules" ]; then
            find "$ws/.git/modules" -type f -name "*.lock" -delete 2>/dev/null || true
          fi

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || inputs.ref || github.sha }}
          fetch-depth: 0
          submodules: recursive

      - name: Select Xcode
        run: ./scripts/select-ci-xcode.sh

      - name: Install Rust for app support targets
        run: ./scripts/install-rust-ci.sh

      - name: Download prebuilt GhosttyKit
        run: ./scripts/download-prebuilt-ghosttykit.sh

      - name: Cache Swift packages
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .ci-source-packages
          key: cloud-provider-spm-${{ hashFiles('cmux.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: cloud-provider-spm-

      - name: Sanitize Swift package cache
        run: python3 scripts/ci/sanitize-xcode-source-packages-cache.py "$SOURCE_PACKAGES_DIR"

      - name: Set up Go for the Cloud tunnel extension
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          cache: false

      - name: Resolve Swift packages
        run: |
          set -euo pipefail
          mkdir -p "$SOURCE_PACKAGES_DIR"
          for attempt in 1 2 3; do
            if xcodebuild -project cmux.xcodeproj -scheme cmux -configuration Release \
              -derivedDataPath "$DERIVED_DATA_PATH" \
              -clonedSourcePackagesDirPath "$SOURCE_PACKAGES_DIR" \
              -resolvePackageDependencies; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Failed to resolve Swift packages after 3 attempts" >&2
              exit 1
            fi
            echo "Package resolution failed on attempt $attempt, retrying..." >&2
            sleep $((attempt * 5))
          done

      - name: Build unsigned universal Release app
        run: |
          set -euo pipefail
          rm -rf "$DERIVED_DATA_PATH"
          CMUX_SKIP_ZIG_BUILD=1 xcodebuild \
            -scheme cmux \
            -configuration Release \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES_DIR" \
            -destination 'generic/platform=macOS' \
            -showBuildTimingSummary \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO \
            ASSETCATALOG_COMPILER_APPICON_NAME=AppIcon-Nightly \
            build
