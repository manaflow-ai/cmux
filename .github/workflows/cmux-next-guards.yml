name: cmux-next guards

# ci.yml skips its guards for feat-cmux-next (cmux-next.yml is that branch's
# CI) and never runs on push, so nothing ran the release and nightly guard
# tests there: tests/test_nightly_cmux_tui_resolve.py stayed red on the branch
# unseen. nightly-next ships from feat-cmux-next, so run the release-notary
# group (nightly, notarization, nightly-next guard and publication tests) for
# its pull requests and pushes. There is no workflow path filter, so a base red
# shows on the push that caused it.
#
# A push runs the group in nightly-guards, judged at its tip, so a base red
# still fails the push that caused it. A pull request runs it inside the CI
# guard group's head-and-base comparison instead (ci-guard-group, below), which
# fails only on a step red on the change and not on its base, and only when the
# change reaches what the group reads: release, notary and signing paths, the
# workflows and CI scripts it pins, and the release notes and updater sources it
# reads (detect_linux_guard_changes.RELEASE_NOTARY_INPUTS). On every pull request
# it cost about 200,000 runner-minutes in 14 days, and none of its 18 PR failures
# was the change's own (cmuxterm-hq plans/ci/baggage-2026-11-05.md). Run on its own,
# every pull request was red while the branch was: workflow-text pins in this
# group (nightly.yml, warm-sources.json, the step-coverage map) go red on any
# push that edits those files without the tests, and 833 of 1656 pull request
# runs in the 24 h to 2026-11-05 08:24Z were red with the base's reds alone.
on:
  pull_request:
    branches: [feat-cmux-next]
  push:
    branches: [feat-cmux-next]

permissions:
  contents: read

# The CmuxNextApp size cap is a structural guard: while this is `warn` it
# prints its findings as a warning and passes (Leo, 2026-10-19). Set it to
# `fail` to make it block again. The crash ratchet, the defaults snapshot
# freshness, the guard self-tests and the menu check still fail.
env:
  CMUX_NEXT_STYLE_GUARDS: warn
  # Temporary REST budget attribution: one gh-call line per GitHub API call (scripts/ci/api_call_log/env.sh).
  BASH_ENV: ${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh

concurrency:
  group: cmux-next-guards-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A pin manifest is a publication contract: a source change that records a
  # missing artifact would otherwise fail much later on a cold pool VM.  This
  # uses the same read-only store credentials as the release path and a fresh
  # cache, so a worker-local copy cannot make a missing publication look green.
  # Fork pull requests cannot receive the protected store key; their merge
  # push runs this check before any pool image or nightly can consume the pin.
  pinned-asset-store:
    name: pinned assets exist in store
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-4vcpu-ubuntu-2404' || vars.LINUX_RUNNER || fromJSON(vars.RUNNER_POOLS).linux_4 }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Resolve the previous revision
        id: base
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          base=""
          if [[ "$EVENT_NAME" == pull_request ]]; then
            base="$(git rev-parse HEAD^1)"
          elif [[ "$BEFORE" =~ ^[0-9a-f]{40}$ ]] && [[ ! "$BEFORE" =~ ^0+$ ]]; then
            if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              git fetch --no-tags --depth=1 origin "$BEFORE" >/dev/null 2>&1 || true
            fi
            if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              base="$BEFORE"
            fi
          fi
          base="${base:-HEAD^1}"
          echo "base=$base" >> "$GITHUB_OUTPUT"

      - name: Verify changed pinned assets exist in the store
        env:
          CMUX_CEF_R2_ACCOUNT_ID: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && secrets.CMUX_CEF_R2_ACCOUNT_ID || '' }}
          CMUX_CEF_R2_ACCESS_KEY_ID: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && secrets.CMUX_CEF_R2_ACCESS_KEY_ID || '' }}
          CMUX_CEF_R2_SECRET_ACCESS_KEY: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && secrets.CMUX_CEF_R2_SECRET_ACCESS_KEY || '' }}
          CMUX_CEF_R2_ENV_FILE: /dev/null
        run: scripts/cmux-next/check-pinned-assets.sh "${{ steps.base.outputs.base }}"

  nightly-guards:
    # !cancelled(): a skipped or failed portable-placement leaves the group on its usual runner.
    needs: [portable-placement]
    if: ${{ !cancelled() }}
    permissions:
      contents: read
      checks: read
    uses: ./.github/workflows/ci-guards.yml
    with:
      # Fleet Linux or a free mini when portable-placement found one; empty keeps ci-guards.yml's own runner.
      guard_tests_runner: ${{ needs.portable-placement.outputs.placed_attempt == format('{0}', github.run_attempt) && contains(needs.portable-placement.outputs.linux_jobs, ' release-notary ') && needs.portable-placement.outputs.linux_runner || needs.portable-placement.outputs.placed_attempt == format('{0}', github.run_attempt) && contains(needs.portable-placement.outputs.mini_jobs, ' release-notary ') && needs.portable-placement.outputs.mini_runner || '' }}
      # Pushes only: a pull request runs release-notary in ci-guard-group's head-and-base comparison (header),
      # and keeps this call for the submodule forward-only guard and Guard status.
      linux_guard_tests: ${{ github.event_name != 'pull_request' && 'true' || 'false' }}
      linux_guard_test_groups: '["release-notary"]'
      linux_guard_history: ${{ 'false' }}
      linux_guard_cli: ${{ 'false' }}
      linux_guard_source: ${{ 'false' }}

  # Signing jobs (nightly.yml, cmux-tui-artifacts.yml) take their runner from these variables, so they must
  # name ephemeral runners only: Blacksmith or GitHub's hosted Linux, never an owned mini
  # (tests/test_ci_signing_keychain_is_deleted_before_bundle_code.py rule 7). Unset falls back to a Blacksmith
  # literal and passes. This job's own runner is a literal, so a variable at a missing label still goes red.
  signing-runner-variables:
    name: signing runner variables are ephemeral
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.CI_CLOUD_OVERFLOW_SAVED && 'blacksmith-8vcpu-ubuntu-2404' || 'blacksmith-2vcpu-ubuntu-2404' }}
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Runner variables that signing jobs read name ephemeral runners
        env:
          LINUX_RUNNER: ${{ vars.LINUX_RUNNER }}
          MACOS_RUNNER_26: ${{ vars.MACOS_RUNNER_26 }}
        run: |
          bad=0
          for name in LINUX_RUNNER MACOS_RUNNER_26; do
            value="${!name}"
            case "$value" in
              ""|blacksmith-*|ubuntu-*) echo "$name=${value:-<unset>}" ;;
              *) echo "::error::vars.$name is '$value'; signing jobs run on it, so it must be blacksmith-* or ubuntu-*"; bad=1 ;;
            esac
          done
          [ "$bad" = 0 ] || exit 1

  # The tooling tests' and the release-notary guards' runner (the CI guard group runs on Linux only, below).
  # Jobs that need neither Linux nor Blacksmith take fleet Linux (vars.LINUX_RUNNER when it names our
  # own Linux runner), else a mini idle now with no nightly job waiting on its pool, else their
  # Blacksmith label (scripts/ci/portable_job_placement.py; Leo, 2026-10-31: "i mean the linux things
  # cant our minis just run them"). Every step fails open: no output keeps each job's Blacksmith route.
  # The placement code comes from the base branch, as macos-placement's does.
  portable-placement:
    name: portable job placement
    if: ${{ github.repository_owner == 'manaflow-ai' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (github.run_attempt == 1 || github.run_attempt == 2 && contains(fromJSON('["github-actions[bot]","cmux-bot[bot]"]'), github.triggering_actor)) }}
    environment: ${{ github.event_name != 'pull_request' && 'ci-routing-agent' || '' }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-2vcpu-ubuntu-2404' || !startsWith(vars.LINUX_RUNNER, 'blacksmith-') && vars.LINUX_RUNNER || vars.CI_CLOUD_OVERFLOW_SAVED && fromJSON(vars.RUNNER_POOLS).linux_8 || fromJSON(vars.RUNNER_POOLS).linux_2 }}
    timeout-minutes: 4
    permissions:
      # The queue janitor's pool snapshot (nightly jobs waiting on a pool).
      actions: read
      contents: read
    outputs:
      linux_runner: ${{ steps.place.outputs.linux_runner }}
      linux_jobs: ${{ steps.place.outputs.linux_jobs }}
      mini_runner: ${{ steps.place.outputs.mini_runner }}
      mini_jobs: ${{ steps.place.outputs.mini_jobs }}
      # A re-run of failed jobs carries this job's outputs from an earlier attempt; a job takes them
      # only in the attempt that placed it, so a stale reading never sends it to a busy mini.
      placed_attempt: ${{ github.run_attempt }}
    steps:
      - name: Check out the trusted placement
        timeout-minutes: 1
        continue-on-error: true
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          sparse-checkout: scripts/ci
          persist-credentials: false

      # A mini or fleet Linux host reuses its workspace: drop the submodule checkouts a previous job
      # left there (a no-op on Blacksmith, which starts with none).
      - name: Drop stale submodule checkouts (self-hosted reused workspace)
        continue-on-error: true
        run: if [ -x scripts/ci/reset-stale-submodules.sh ]; then scripts/ci/reset-stale-submodules.sh; fi

      - name: Mint the owned-pool routing token
        id: route-token
        if: vars.GLAEDA_ROUTE_APP_ID != ''
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.GLAEDA_ROUTE_APP_ID }}
          private-key: ${{ secrets.GLAEDA_ROUTE_APP_KEY }}
          permission-administration: read
          permission-organization-self-hosted-runners: read

      - name: Mint the cmux-bot runner-read token
        id: route-token-fallback
        if: vars.CMUX_BOT_APP_ID != ''
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.CMUX_BOT_APP_ID }}
          private-key: ${{ secrets.CMUX_BOT_APP_KEY }}
          permission-organization-self-hosted-runners: read

      - name: Place the portable jobs
        id: place
        continue-on-error: true
        timeout-minutes: 2
        env:
          CI_RUNNER_STATE: ${{ vars.CI_RUNNER_STATE }}
          JOBS: tooling-tests release-notary
          # Fork branch first: a fork never reads the runner variables (and its job is skipped); ubuntu-24.04 places nothing.
          FLEET_LINUX: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || vars.LINUX_RUNNER }}
          SIDE_LABEL: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || vars.CI_PR_POOL_OWNED == '1' && vars.CI_SIDE_LANE_RUNNER || '' }}
          ROUTE_TOKEN: ${{ steps.route-token.outputs.token }}
          ROUTE_TOKEN_FALLBACK: ${{ steps.route-token-fallback.outputs.token }}
          SNAPSHOT_TOKEN: ${{ github.token }}
        run: |
          # A base branch that predates the script places nothing: every job keeps its Blacksmith route.
          if [ ! -f scripts/ci/portable_job_placement.py ]; then
            echo "portable placement: the trusted base predates scripts/ci/portable_job_placement.py"
            exit 0
          fi
          python3 scripts/ci/portable_job_placement.py

  # ci-guards.yml's `ci` group (workflow lints, hook trust, runner and cache policy: scripts/ci/guards-local.sh's
  # default set) ran only in ci.yml's "CI fast guards", which skips feat-cmux-next pull requests, and ci.yml never
  # runs on its pushes. Nothing ran it for the branch: tests/test_preflight_trust.py errored there unseen until
  # #23006 (tests/test_feat_ci_guard_group.py).
  # ci.yml also routes ci-guards.yml's other groups by path, again only into main, so about 70 guard tests
  # never ran for feat-cmux-next (tests/pr-lane-exemptions.json). This job runs them too: --feat-routes picks
  # the groups a pull request's paths route to (detect_linux_guard_changes.classify_feat, workflow_guard_groups.py's
  # ownership), and every routed group on a push. The main-only release-ios group never runs here; release-notary runs here
  # on a pull request that reaches its inputs (compared with its base) and in nightly-guards on a push (judged at the tip).
  ci-guard-group:
    name: cmux-next CI guard group
    # 32 vCPU, a guard worker per core: the head and the base each run every routed group, on every pull request
    # and push (175-359 s on 4 vCPU with 8 workers). vars.LINUX_RUNNER names the 4 vCPU size, so it is read only
    # when it names a non-Blacksmith runner; in a Blacksmith outage CI_CLOUD_OVERFLOW_SAVED moves it to 16 vCPU
    # (tests/test_feat_ci_guard_group.py, tests/test_ci_blacksmith_linux_failover.py).
    # Linux only: fleet Linux (vars.LINUX_RUNNER when it names our own runner), then Blacksmith. Not a portable
    # job: on a mini 24 of its steps red (no python3.9 or node, temp-cwd scripts),
    # so portable-placement does not place it.
    if: ${{ !cancelled() }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-4vcpu-ubuntu-2404' || !startsWith(vars.LINUX_RUNNER, 'blacksmith-') && vars.LINUX_RUNNER || vars.CI_CLOUD_OVERFLOW_SAVED && fromJSON(vars.RUNNER_POOLS).linux_16 || fromJSON(vars.RUNNER_POOLS).linux_8 }}
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          # A pull request's merge commit and its first parent (the base) for the changed files.
          fetch-depth: 2

      # A mini or fleet Linux host reuses its workspace: drop the submodule checkouts a previous job
      # left there (a no-op on Blacksmith, which starts with none).
      - name: Drop stale submodule checkouts (self-hosted reused workspace)
        run: scripts/ci/reset-stale-submodules.sh

      # The base this change is judged against, and the diff the groups are routed by: a pull request's
      # merge commit against its first parent (pull_request.base.sha lags it once the base moves), a push
      # against the previous tip. A push runs every routed group (no list): a product-only change routes
      # none on its pull request, and a guard it breaks then shows on the push that landed it. No base
      # (a new branch, an unreadable tip) routes every group and runs no base comparison.
      # A push that touches what the guards read (.github/, tests/, scripts/ci/) is judged at its tip: no base
      # comparison, so every red step fails the push. Judged only against the previous tip, a red that persists
      # stays green: 18 guard steps sat red on the branch, unseen, until #31366
      # (detect_linux_guard_changes.feat_push_judges_tip).
      - name: Changed files
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          base=""
          if [[ "$EVENT_NAME" == pull_request ]]; then
            base="$(git rev-parse HEAD^1)"
          elif [[ "$BEFORE" =~ ^[0-9a-f]{40}$ && ! "$BEFORE" =~ ^0+$ ]] \
            && git fetch --no-tags --depth=1 origin "$BEFORE"; then
            base="$BEFORE"
            # The checkout holds HEAD and its parent only, so a push of more than one commit leaves
            # the previous tip in a separate shallow history and `git merge-base` (the SwiftPM
            # lockfile policy's comparison, PACKAGE_RESOLVED_POLICY_BASE_REF) finds nothing. Deepen
            # HEAD's history, commits and trees only, until it reaches the previous tip; a force-push
            # whose tip is not reached within 400 commits keeps no base, as an unreadable tip does.
            for _ in 1 2 3 4 5 6 7 8; do
              git merge-base "$BEFORE" HEAD >/dev/null 2>&1 && break
              git fetch --no-tags --filter=blob:none --deepen=50 origin "$GITHUB_SHA" || break
            done
            if ! git merge-base "$BEFORE" HEAD >/dev/null 2>&1; then
              echo "::warning::the previous tip $BEFORE shares no history with HEAD within reach"
              base=""
            fi
          fi
          if [[ -n "$base" ]] && git diff --name-only --no-renames "$base" HEAD > "$RUNNER_TEMP/changed-files.txt"; then
            echo "$(wc -l < "$RUNNER_TEMP/changed-files.txt") changed files against $base"
            echo "base=$base" >> "$GITHUB_OUTPUT"
            if [[ "$EVENT_NAME" != pull_request ]]; then
              tip="$(python3 scripts/ci/detect_linux_guard_changes.py --feat-push-tip "$RUNNER_TEMP/changed-files.txt")"
              echo "tip=$tip" >> "$GITHUB_OUTPUT"
              rm -f "$RUNNER_TEMP/changed-files.txt"
              echo "a push runs every routed guard group"
              if [[ "$tip" == true ]]; then
                echo "the push touches what the guards read: every red step at the tip fails it"
              fi
            fi
          else
            rm -f "$RUNNER_TEMP/changed-files.txt"
            echo "::warning::no base to diff against; every routed guard group runs"
          fi

      # run_ci_guards.py skips ci-guards.yml's `uses:` setup steps, so this job provides their tools:
      # bun (at ci-guards.yml's pin) for preflight-agent-chat, and python3.9 beside the runner's python3
      # for release-tooling's nightly prune compatibility step (PYTHON_BIN=python3.9).
      - name: Set up Bun for guard tests
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"

      # setup-python installs 3.9 on Linux; a runner without it takes the one uv installs, if any.
      # The head and the base run on the same machine, so either way they compare like for like.
      - name: Set up Python 3.9 for nightly prune compatibility
        id: python39
        if: runner.os == 'Linux'
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.9"
          update-environment: false

      - name: Put python3.9 on PATH
        env:
          PYTHON39: ${{ steps.python39.outputs.python-path }}
        run: |
          mkdir -p "$RUNNER_TEMP/python39"
          if [ -z "$PYTHON39" ] && command -v uv >/dev/null 2>&1; then
            PYTHON39="$(uv python find 3.9 2>/dev/null || { uv python install 3.9 >/dev/null 2>&1 && uv python find 3.9; } || true)"
          fi
          if [ -z "$PYTHON39" ]; then
            echo "::warning::no Python 3.9 on this runner; the nightly prune compatibility step reds on the head and the base alike"
            exit 0
          fi
          ln -sf "$PYTHON39" "$RUNNER_TEMP/python39/python3.9"
          echo "$RUNNER_TEMP/python39" >> "$GITHUB_PATH"

      # The branch had 24 of the group's 134 steps red before this job ran there (2026-10-21), so the job fails
      # only on a step red on this change but not on its base; the base's reds are warnings
      # (scripts/ci/guards_new_reds.py). The base's steps run with this checkout's runner (--root).
      - name: Checkout the base
        if: (steps.changes.outputs.base || '') != '' && (steps.changes.outputs.base) != '0000000000000000000000000000000000000000' && steps.changes.outputs.tip != 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ steps.changes.outputs.base }}
          path: .guard-base
          persist-credentials: false

      # A pull request routes release-notary by its paths like the other groups (classify_feat,
      # RELEASE_NOTARY_INPUTS); a push leaves it out here, since nightly-guards runs it at the tip (header).
      - name: Run the ci guard group and the routed groups
        env:
          CMUX_GUARDS_BASE_SHA: ${{ steps.changes.outputs.base }}
          GUARDS_AT_TIP: ${{ steps.changes.outputs.tip }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # The base checkout is untracked in this workspace; the workload profile refuses a dirty checkout.
          echo "/.guard-base/" >> .git/info/exclude
          # The groups are literal flags so scripts/ci/pr_test_lanes.py sees what a pull request runs.
          groups=()
          if [ "$EVENT_NAME" = pull_request ]; then
            scripts/ci/guards-local.sh --no-stamp --keep-going --jobs "$(getconf _NPROCESSORS_ONLN)" --feat-routes "$RUNNER_TEMP/changed-files.txt" --results "$RUNNER_TEMP/guards-head.json" || true
          else
            groups=(--skip-group release-notary)
            scripts/ci/guards-local.sh --no-stamp --keep-going --jobs "$(getconf _NPROCESSORS_ONLN)" --feat-routes "$RUNNER_TEMP/changed-files.txt" --skip-group release-notary --results "$RUNNER_TEMP/guards-head.json" || true
          fi
          # The base re-runs only the steps red on the head (guards_new_reds.py --red-steps): a step green on the
          # head is never the change's, and the full base pass doubled the job once release-notary joined it.
          steps=()
          while IFS= read -r step; do
            [ -n "$step" ] && steps+=(--step "$step")
          done < <(python3 scripts/ci/guards_new_reds.py --red-steps "$RUNNER_TEMP/guards-head.json")
          if [ -d .guard-base ] && [ "${#steps[@]}" -gt 0 ]; then
            echo "re-running the head's $(( ${#steps[@]} / 2 )) red steps on the base"
            scripts/ci/guards-local.sh --no-stamp --keep-going --jobs "$(getconf _NPROCESSORS_ONLN)" "${groups[@]}" --feat-routes "$RUNNER_TEMP/changed-files.txt" "${steps[@]}" --root .guard-base \
              --results "$RUNNER_TEMP/guards-base.json" > "$RUNNER_TEMP/guards-base.log" 2>&1 || true
            tail -1 "$RUNNER_TEMP/guards-base.log"
          elif [ -d .guard-base ]; then
            echo "no red step on the head; the base is not re-run"
            echo '{}' > "$RUNNER_TEMP/guards-base.json"
          fi
          if [ "$GUARDS_AT_TIP" = true ]; then
            python3 scripts/ci/guards_new_reds.py --tip "$RUNNER_TEMP/guards-head.json"
          else
            python3 scripts/ci/guards_new_reds.py "$RUNNER_TEMP/guards-head.json" "$RUNNER_TEMP/guards-base.json"
          fi

  # The static checks that may be red on the base, in one runner session and one checkout. Each was a job of its own
  # (vt-link-graph, nightly-static-capabilities, defaults-snapshot, page-strings), seconds of work behind a runner start
  # and a fresh checkout. Every step runs whatever an earlier one did (`!cancelled()`), so one red never hides another
  # check's result, and the job is red when any step is. Each step's name says which check it is: next_autoland judges
  # this job against the base step by step, so a step red on the change alone stays the change's own though another is
  # red on the base (2026-11-01, #31201: a check hidden in a group red on the base landed red).
  #
  # vt-link-graph also runs the nightly's libghostty-vt notices precondition: a ghostty-next gitlink move without a
  # regenerated vt-link-graph.json failed every nightly-next build for 9 hours (10-11), and nothing else checked it
  # before the nightly.
  #
  # build-nightly-app's static capability check (check-daemon-capabilities.sh --static-only) skips the capabilities
  # identify_capabilities adds at runtime, from a hand list. A runtime capability the app lists and the list misses
  # fails every nightly-next build: agent-session-login-v1 (#30214) kept the feed at one build for 90 minutes on
  # 2026-11-01. It runs here, not in the release-notary group, so a red there never hides it.
  #
  # The defaults snapshot's tests and the settings export stamp, in seconds (the defaults snapshot is bot-only).
  #
  # Every web bundle build runs gen-strings.mjs strict, but only pull requests that touch webviews/ run its tests.
  # 2c661dec960b renamed a setting in Swift and the catalogs, the committed settings schema kept the old keys, and the
  # first red was the bundle build on every later push and webviews/ pull request (10-20, "settings: 63 strings
  # missing"). The page strings step runs the same strict generation on every pull request and push, with no path
  # filter, so a catalog edit or a renamed setting is red where it lands. It runs last: it writes the generated
  # strings into the checkout.
  static-checks:
    name: cmux-next static checks (vt-link-graph, nightly static capabilities, defaults snapshot, page strings)
    # A fork pull request runs on a hosted runner, never on LINUX_RUNNER.
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-4vcpu-ubuntu-2404' || vars.LINUX_RUNNER || fromJSON(vars.RUNNER_POOLS).linux_4 }}
    # Each former job's 5-minute cap is split among its steps (vt-link-graph 2+1+2, nightly static capabilities 5,
    # defaults snapshot 2+1+2, page strings 2+3), so with the checkout's 5 the steps' caps sum to the job's
    # 25 and no step's stall can use up another's time. A step that times out fails and the next step still runs.
    timeout-minutes: 25
    steps:
      - name: Checkout
        timeout-minutes: 5
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          # HEAD^1: the base tip of a pull request's merge commit, or the
          # previous commit of a push (the defaults snapshot reads it).
          fetch-depth: 2

      - name: vt-link-graph.json is for the libghostty-vt gitlink
        if: ${{ !cancelled() }}
        timeout-minutes: 2
        run: python3 scripts/cmux-next/notices/check_ghostty_vt_notices.py --check-link-graph scripts/cmux-next/notices/vt-link-graph.json

      # The release-path package step's own data check: package-notices.json's
      # libghostty-vt texts are for the graph's commit (#19508 moved the notices,
      # the graph followed seven hours later) and the pinned texts match.
      - name: package-notices.json covers vt-link-graph.json
        if: ${{ !cancelled() }}
        timeout-minutes: 1
        run: python3 cmux-tui/dist/scripts/package_notices.py check-data

      # Pull-request dry runs of the nightly's Ghostty notice steps
      # (.github/nightly-step-coverage.json), on fixtures: the license collector
      # and verify-ghostty-license-bundle.py behind "Inject the Ghostty
      # dependency licenses", and check_ghostty_vt_notices.py's --license-manifest
      # mode behind "libghostty-vt Zig packages are covered by the notices".
      - name: The nightly's Ghostty license checks pass on fixtures
        if: ${{ !cancelled() }}
        timeout-minutes: 2
        run: |
          python3 cmux-tui/build-support/notices/ghostty/test_ghostty_licenses.py
          python3 scripts/cmux-next/notices/test_check_bundle_notices.py
          python3 scripts/cmux-next/notices/test_check_ghostty_vt_notices.py

      - name: Every runtime-added app capability is skipped by the static check
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: python3 tests/test_cmux_next_static_capability_runtime_only.py

      - name: The defaults snapshot tests
        if: ${{ !cancelled() }}
        timeout-minutes: 2
        run: python3 tests/test_defaults_guard.py

      # PR #19754 moved the workspace and tab menus' group rows into More and
      # nothing failed (Lawrence 2026-10-14: "my groups UI is lost").
      - name: The group rows stay at the top of the right-click menus
        if: ${{ !cancelled() }}
        timeout-minutes: 1
        run: python3 scripts/cmux-next/check-group-menus.py
      # Lawrence 2026-10-19: right-click New Tab Group failed while the palette
      # path worked. A menu row with its own selector is a second path beside
      # the registered action; new ones fail here.
      - name: Menu rows run registered actions, not inline selectors
        if: ${{ !cancelled() }}
        timeout-minutes: 2
        run: python3 scripts/cmux-next/check-menu-actions.py

      - name: Setup Node
        if: ${{ !cancelled() }}
        timeout-minutes: 2
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.22.1"

      # No install: the generator reads only the catalogs and the settings schema.
      - name: Every page's strings generate with no missing translation
        if: ${{ !cancelled() }}
        timeout-minutes: 3
        env:
          CMUX_STRINGS_BEST_EFFORT: ""
        run: node webviews/scripts/pages/gen-strings.mjs
  # The nightly-next build generates the Rust third-party notices from the
  # tree (scripts/cmux-next/generate-third-party-notices.sh --tui-source tree).
  # A new path crate it cannot map failed the nightly publish (run 38359624385,
  # cmux-git, 2026-10-13) hours after the landing. This runs the same generation
  # when a pull request or push changes a Rust manifest or the notices tooling,
  # so such a change is red at its own landing.
  rust-notices-tree:
    name: cmux-next Rust notices generate
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-4vcpu-ubuntu-2404' || fromJSON(vars.RUNNER_POOLS).linux }}
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Changed notice inputs
        id: inputs
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || [[ "$BASE_SHA" =~ ^0+$ ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          changed="$(git diff --name-only "$BASE_SHA" HEAD)"
          pattern='(^|/)Cargo\.(toml|lock)$|^scripts/cmux-next/remote-browser-host\.pin\.json$|^cmux-tui/build-support/notices/|^scripts/cmux-next/generate-third-party-notices\.sh$|^scripts/cmux-next/notices/|^Packages/macOS/CmuxNext/Package\.resolved$|^scripts/build-cmux-cua\.sh$'
          if grep -qE "$pattern" <<<"$changed"; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi

      - name: Generate the Rust notices from this tree (as the nightly does)
        if: steps.inputs.outputs.run == 'true'
        env:
          CMUX_NOTICES_ALLOW_CARGO: "1"
          CMUX_NOTICES_CACHE: ${{ runner.temp }}/cmux-notices
        run: |
          ./scripts/cmux-next/generate-third-party-notices.sh --tui-source tree \
            --cargo-trees "$RUNNER_TEMP/cmux-notices-cargo-trees" --write-cargo-trees

  # The checks that judge a change against its base, in one runner session and one checkout: red only for the
  # change's own regression, so a base red never excuses them (next_autoland's NEVER_BASE matches "size cap" and
  # "crash ratchet" in this job's name; base-red-watch's base pass ignores it for the same words). Each was a job of its
  # own, seconds of work behind a runner start and a fresh checkout. Every step runs whatever an earlier one did
  # (`!cancelled()`), so one red never hides another check's result; each step's name says which check it is. The
  # checkout holds a pull request's merge commit and its first parent (the base); a push compares against
  # event.before, fetched by each step that needs it.
  #
  # The CmuxNextApp size cap (code-quality.md SW14). cmux-next.yml's checks job skips pushes to feat-cmux-next and runs
  # on pull requests only for its path filter, so GitHub merges grew the App past the cap. This workflow has no path
  # filter, so the check can be a required one. Only the size cap runs here: the god-file checks stay warn-only, and
  # the size cap warns too while CMUX_NEXT_STYLE_GUARDS is `warn`. A pull request fails on real source growth against
  # its merge commit's first parent (the base); comment/blank-line-only merge noise is ignored. A push compares against
  # event.before, so a push that went around safe-push still turns red.
  #
  # The crash ratchet (plans/cmux-next/crash-elimination.md). safe-push runs it before a direct push, but a GitHub
  # merge skips safe-push, so #20223 added 3 unwraps unchecked (2026-10-13). The change's own ratchet script and
  # baseline run on its tree and on the base tree (a pull request's merge-commit first parent; a push's previous tip);
  # the step is red when the change turns the ratchet red, or makes an already red base worse. The change's baseline is
  # also judged against the base's copy, so it may only go down: a raised counted row is red (a hit that moved to
  # another module carries its row), and a recorded waiver (a raised waived row) is a warning annotation.
  #
  # cmux NEXT's catalogs hold translation debt from before the parity check covered them (42,072 errors in 118 catalogs
  # on 2026-10-21). scripts/localization-debt-baseline.json records each catalog's counts; the localization step fails
  # when a change adds debt anywhere or raises the baseline above the base's copy, so the debt only goes down
  # (scripts/localization_catalog.py).
  #
  # No new committed generated files (Leo, 2026-10-21: "don't commit generatable stuff"): committed outputs conflict on
  # every base move. scripts/ci/generated_files_guard.py reads its rules (scripts/ci/generated-files.json and its
  # baseline) from the base, so a change cannot loosen them for itself; a generated file the base already tracks
  # uncovered is a note, not this change's red.
  own-change-checks:
    name: cmux-next size cap, crash ratchet, localization debt ratchet, no new generated files
    # A fork pull request runs on a hosted runner, never on LINUX_RUNNER.
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-4vcpu-ubuntu-2404' || vars.LINUX_RUNNER || fromJSON(vars.RUNNER_POOLS).linux_4 }}
    # Each former job's cap goes to its steps (size cap 5, crash ratchet 10, localization 5, generated files 2+8), so
    # with the checkout's 5 the steps' caps sum to the job's 35 and no step's stall can use up another's time. A step
    # that times out fails and the next step still runs. The generated files guard's 8 covers a generator check's
    # 120 s try and its 240 s retry (generated_files_guard.py): a busy runner makes it slower, never red.
    timeout-minutes: 35
    steps:
      - name: Checkout
        timeout-minutes: 5
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          # A pull request's merge commit and its first parent (the base).
          fetch-depth: 2

      - name: CmuxNextApp size cap
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          base=()
          if [[ "$EVENT_NAME" == pull_request ]]; then
            base=(--base HEAD^1)
          elif [[ "$BEFORE" =~ ^[0-9a-f]{40}$ && ! "$BEFORE" =~ ^0+$ ]] \
            && git fetch --no-tags --depth=1 origin "$BEFORE"; then
            base=(--base "$BEFORE")
          else
            # No previous tip to compare with: the plain cap check.
            echo "::warning::no previous tip to compare with; checking the plain cap"
          fi
          rc=0
          scripts/cmux-next/check-app-size.sh ${base[@]+"${base[@]}"} "$GITHUB_WORKSPACE" || rc=$?
          # Exit 1 is over the cap (warn-only); any other code is a broken check and fails.
          if (( rc == 1 )) && [[ "$CMUX_NEXT_STYLE_GUARDS" == warn ]]; then
            echo "::warning title=CmuxNextApp size cap (warn-only)::the App target is over its size cap; see this step's log"
            exit 0
          fi
          exit "$rc"

      - name: cmux-next crash ratchet
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: scripts/ci/crash-ratchet-against-base.sh

      # Every task and process has an owner (cmuxterm-hq#9096): no file gains a spawn with no
      # owner, and the baseline only goes down against the base (HEAD^1 of a pull request's merge
      # commit, the previous tip of a push).
      - name: cmux-next spawn-owner ratchet
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          base=()
          if [[ "$EVENT_NAME" == pull_request ]]; then
            base=(--base-ref HEAD^1)
          elif [[ "$BEFORE" =~ ^[0-9a-f]{40}$ && ! "$BEFORE" =~ ^0+$ ]] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            base=(--base-ref "$BEFORE")
          fi
          python3 -I scripts/cmux-next/check-spawn-owner.py "$GITHUB_WORKSPACE" ${base[@]+"${base[@]}"}

      - name: cmux-next localization debt ratchet
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          base_ref=""
          if [[ "$EVENT_NAME" == pull_request ]]; then
            base_ref=HEAD^1
          elif [[ "$BEFORE" =~ ^[0-9a-f]{40}$ && ! "$BEFORE" =~ ^0+$ ]] \
            && git fetch --no-tags --depth=1 origin "$BEFORE"; then
            base_ref="$BEFORE"
          fi
          args=()
          base_baseline="$RUNNER_TEMP/localization-debt-baseline.base.json"
          if [[ -n "$base_ref" ]] && git show "$base_ref:scripts/localization-debt-baseline.json" > "$base_baseline" 2>/dev/null; then
            args=(--base-baseline "$base_baseline")
          fi
          # Debt the base has past its own baseline is the base's red, not this change's (#23877).
          # The base tree also proves a catalog move: a same-named catalog must hold the old
          # one's strings to inherit its baseline. Pushes need it too (feat-cmux-next lands by push).
          if [[ -n "$base_ref" && ${#args[@]} -gt 0 ]]; then
            base_root="$RUNNER_TEMP/localization-base"
            mkdir -p "$base_root"
            git archive "$base_ref" -- ':(glob)Resources/**/*.xcstrings' ':(glob)Packages/macOS/*/Sources/**/*.xcstrings' \
              scripts/localization_catalog.py scripts/localization-allowed-omissions.json scripts/localization-plurals.json \
              | tar -x -C "$base_root"
            args+=(--base-root "$base_root")
          fi
          python3 scripts/localization_catalog.py check "${args[@]}"

      - name: The generated files guard's own tests
        if: ${{ !cancelled() }}
        timeout-minutes: 2
        run: python3 tests/test_generated_files_guard.py

      - name: cmux-next no new generated files
        if: ${{ !cancelled() }}
        timeout-minutes: 8
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          base_ref=""
          if [[ "$EVENT_NAME" == pull_request ]]; then
            base_ref="$(git rev-parse HEAD^1)"
          elif [[ "$BEFORE" =~ ^[0-9a-f]{40}$ && ! "$BEFORE" =~ ^0+$ ]] \
            && git fetch --no-tags --depth=1 origin "$BEFORE"; then
            base_ref="$BEFORE"
          fi
          if [[ -z "$base_ref" ]]; then
            echo "::warning::no previous tip to compare with; nothing to check"
            exit 0
          fi
          python3 scripts/ci/generated_files_guard.py check --repo . --base "$base_ref" --head HEAD

  # A red own-change check (the size cap, the crash ratchet) or static check (page strings among them) on a pull
  # request into feat-cmux-next gets the same "red: <check>" comment as a red web check (chief 2026-10-12): ci.yml calls
  # this workflow after `web`; both callers update one comment, recomputed from all check runs of the head commit.
  pr-red-checks:
    needs: [own-change-checks, static-checks]
    if: ${{ always() && !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'feat-cmux-next' }}
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: write
    uses: ./.github/workflows/pr-red-checks-comment.yml
    with:
      own_checks_green: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}

  # The tests of feat-cmux-next's own CI tooling (nightly-next's App ID, the
  # cmux-tui republish path, the crash ratchet, the red-checks comment, the
  # backdrop art generator). Each is stdlib Python with fakes for the network
  # and the binaries it calls; only the web lint hook's test also needs bun.
  tooling-tests:
    # A fork pull request runs on a hosted runner, never on LINUX_RUNNER. Others take fleet Linux, then a free
    # mini (portable-placement: stdlib Python with fakes, and bun), then Blacksmith.
    needs: [portable-placement]
    if: ${{ !cancelled() }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-4vcpu-ubuntu-2404' || needs.portable-placement.outputs.placed_attempt == format('{0}', github.run_attempt) && contains(needs.portable-placement.outputs.linux_jobs, ' tooling-tests ') && needs.portable-placement.outputs.linux_runner || needs.portable-placement.outputs.placed_attempt == format('{0}', github.run_attempt) && contains(needs.portable-placement.outputs.mini_jobs, ' tooling-tests ') && needs.portable-placement.outputs.mini_runner || vars.CI_CLOUD_OVERFLOW_SAVED && fromJSON(vars.RUNNER_POOLS).linux_16 || fromJSON(vars.RUNNER_POOLS).linux_4 }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          # HEAD^1: a pull request's base for the registry check.
          fetch-depth: 2

      # A mini or fleet Linux host reuses its workspace: drop the submodule checkouts a previous job
      # left there (a no-op on Blacksmith, which starts with none).
      - name: Drop stale submodule checkouts (self-hosted reused workspace)
        run: scripts/ci/reset-stale-submodules.sh

      # Four of these tests and the registry check read workflows with PyYAML. Fleet Linux and Blacksmith images
      # carry it, but a mini's python3 does not (ModuleNotFoundError: yaml on cmux14, 2026-11-03), so the job
      # puts its own copy first on PATH wherever it lands.
      - name: Prepare tooling-test Python (PyYAML)
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/tooling-tests-venv"
          "$RUNNER_TEMP/tooling-tests-venv/bin/python" -m pip install \
            --disable-pip-version-check \
            --no-input \
            PyYAML==6.0.3
          echo "$RUNNER_TEMP/tooling-tests-venv/bin" >> "$GITHUB_PATH"

      - name: nightly-next's App ID and profile through the ASC API
        run: python3 tests/test_asc_developer_id_app.py

      # Time-bomb row: suites whose fixtures carry calendar dates, with the clock set to 2101. A test
      # that reads the real clock instead of passing its own goes red here, not the day a date passes.
      - name: Fixture-date suites with the clock at 2101 (CMUX_NOW_EPOCH)
        env:
          CMUX_NOW_EPOCH: "4133980800"
        run: |
          python3 tests/test_asc_developer_id_app.py
          python3 -m unittest tests/test_lint_feature_flags_scope.py tests/test_lint_feature_flags_review_date.py

      - name: A malformed CMUX_NOW_EPOCH stops each script with one line
        run: python3 -I tests/test_cmux_now_epoch.py

      - name: A rebuilt cmux-tui commit reuses its earlier publication
        run: python3 tests/test_cmux_tui_republish_same_commit.py

      - name: verify-cmux-tui-hosted.sh leaves its hosted run alone when the wait ends
        run: python3 tests/test_verify_cmux_tui_hosted.py

      - name: The crash ratchet is judged against the base
        run: python3 tests/test_crash_ratchet_compare.py

      - name: The spawn-owner ratchet's rules (cmuxterm-hq#9096)
        run: python3 tests/test_spawn_owner_ratchet.py

      - name: The red-checks line of the PR status comment
        run: python3 tests/test_pr_red_checks_comment.py

      - name: The backdrop art catalog and brightness range
        run: python3 tests/test_backdrop_art_generator.py

      - name: Remote Powerlevel10k prompt reset compatibility
        run: |
          if ! command -v zsh >/dev/null 2>&1; then
            sudo apt-get -o DPkg::Lock::Timeout=300 update
            sudo apt-get -o DPkg::Lock::Timeout=300 install -y zsh
          fi
          python3 tests/test_issue_4148_remote_p10k_keyboard_reset.py

      - name: The fast gates workflow and its merge and gate script
        run: python3 tests/test_cmux_next_fast_gates.py

      - name: A scheduled dispatch runs the whole Swift suite on the feat-cmux-next tip
        run: python3 tests/test_cmux_next_tip_swift_suite.py

      - name: A quit scheduled on the run loop never exits a test process
        run: python3 tests/test_cmux_next_deferred_terminate.py

      - name: Every check path a merger reads matches a tracked file
        run: python3 tests/test_check_paths.py

      - name: A toast's button never opens Settings as a stand-in
        run: python3 tests/test_check_toast_targets.py

      - name: The crash-class rules fast gate fails only on findings the pull request adds
        run: python3 tests/test_crash_class_fast_gate.py

      - name: The localization debt ratchet
        run: python3 tests/test_localization_catalog.py

      - name: A stacked cmux NEXT pull request skips ci.yml's legacy lanes
        run: python3 tests/test_next_line.py

      # web-validation.yml ran this only on main pushes, so a2d6b35 broke the runner's test on
      # feat-cmux-next unseen (#23430). A fake bun stands in; no web test runs.
      - name: The per-file webviews test runner (scripts/ci/run-webviews-tests.sh)
        run: python3 tests/test_webviews_tests_per_file.py

      # The TAP health classifier and its base-red integration stay on the same
      # tooling-tests PR lane as the producer's published snapshot contract.
      - name: The TAP test-health classifier and base-red evidence
        run: python3 tests/test_tap_test_health.py

      # A test no feat-cmux-next pull request runs lands red unseen: a2d6b35 broke
      # tests/test_webviews_tests_per_file.py, which only main pushes and the nightly ran (#23430).
      - name: Every Python test runs on a pull request lane, or is a reviewed exemption
        run: python3 tests/test_pr_lane_coverage.py

      # The registry check with the pull request lanes: a test no feat-cmux-next pull request
      # runs needs a job that runs it (routed by the paths it tests) or an entry in
      # tests/pr-lane-exemptions.json with the reason. ci-guards.yml's copy of this check is in
      # the preflight group, which feat-cmux-next pull requests do not run. HEAD^1 is the base.
      # A finding the base already has warns, and on a push every finding warns: only the pull
      # request that adds an unregistered test fails (Leo, 2026-11-05).
      - name: The Python test registry, and the tests no pull request runs
        run: python3 scripts/ci/validate_test_execution_registry.py --pr-lanes feat-cmux-next --base-sha "$(git rev-parse HEAD^1)" ${{ github.event_name == 'push' && '--warn-only' || '' }}

      # The web lint pre-push hook (scripts/web-lint.sh, scripts/web_lint_prepush.py) on throwaway
      # repositories with stand-in packages; cmux-next-web.yml ran it only on pushes. A stand-in
      # package with no node_modules gets a `bun install`.
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"

      - name: The web lint pre-push hook
        run: python3 tests/test_web_lint_prepush.py

      # Tests of feat-cmux-next tooling that no feat pull request ran: some had no registry entry,
      # others ran only from a push, schedule, release or main-only job, so a feat pull request
      # that broke their code landed green (tests/test_pr_lane_coverage.py). Each is stdlib Python
      # with fakes for the binaries and network it calls. They run even after an earlier red so
      # one red does not hide another.
      - name: The app-linked crate license gate (check_app_crate_licenses.py)
        if: ${{ !cancelled() }}
        run: python3 tests/test_app_crate_licenses.py

      - name: The selector check's fleet step wrapper refuses other arguments (check-objc-selectors.sh)
        if: ${{ !cancelled() }}
        run: python3 tests/test_check_objc_selectors_step.py

      - name: The package lane's prebuild-one compiles or fails (package-test-lane.sh)
        if: ${{ !cancelled() }}
        run: python3 tests/test_ci_package_lane_prebuild.py

      - name: The iOS simulator step runs the declared runtime, never just the newest (ios_sim_runtime.py)
        if: ${{ !cancelled() }}
        run: python3 -I tests/test_ios_sim_runtime.py

      - name: The iOS simulator step reuses a verified FFI build, and a broken cache only warns (ios_ffi_cache.py)
        if: ${{ !cancelled() }}
        run: python3 -I tests/test_ios_ffi_cache.py

      - name: The iOS Chief benchmark repeats one simulator and requires retained measurements
        if: ${{ !cancelled() }}
        run: python3 -I tests/test_ios_chief_benchmark_route.py

      # cmux-next-ios replaces the classic app under the production App Store record. Its listing
      # (cmux-next-ios/AppStoreReview/metadata) names only screens the release app shows, in every
      # locale, and its review notes sync script fills or refuses every value (asc_review_package.py).
      - name: The cmux-next-ios App Store listing names only screens the app has, in every locale
        if: ${{ !cancelled() }}
        run: python3 -I tests/test_ios_appstore_listing_text.py

      - name: The cmux-next-ios App Review notes and Support URL sync (asc_review_package.py)
        if: ${{ !cancelled() }}
        run: python3 -I tests/test_asc_review_package.py

      # cmux-ci sends a package-test-lane suite step that names a display suite to a display
      # worker; the list it reads is derived from the suites' own display skip traits, so a
      # Swift change that adds or drops such a trait without the list fails here.
      - name: The display suite list matches the suites' display skip traits (display_suites.py)
        if: ${{ !cancelled() }}
        run: |
          python3 scripts/ci/display_suites.py --check
          python3 tests/test_ci_display_suites.py

      - name: The exact-run SwiftPM test product transport (swiftpm_test_product.py)
        if: ${{ !cancelled() }}
        run: python3 tests/test_swiftpm_test_product.py

      - name: The String Catalog compile of the CmuxNext test bundles
        if: ${{ !cancelled() }}
        run: python3 tests/test_compile_string_catalogs.py

      - name: The deferred DEV publication notifier (cmux_next_tree_notify.py)
        if: ${{ !cancelled() }}
        run: python3 tests/test_cmux_next_dev_daily_notify_cli.py

      - name: The cmux-tui tree publication (publish-cmux-tui-tree.py)
        if: ${{ !cancelled() }}
        run: python3 tests/test_publish_cmux_tui_tree.py

      - name: The tour media publisher's extra windows (media/publish.py)
        if: ${{ !cancelled() }}
        run: python3 tests/test_cmux_next_media_publish_windows.py

      - name: The Mach-O filter of the app thinning (list-macho-candidates.py)
        if: ${{ !cancelled() }}
        run: python3 tests/test_list_macho_candidates.py

      - name: The cross build's macOS link stubs and Mach-O parity verdict
        if: ${{ !cancelled() }}
        run: |
          python3 tests/test_ci_macos_stubs.py
          python3 tests/test_ci_macho_parity.py

      - name: Set up Rust for the tailnet build-script fixture
        if: ${{ !cancelled() }}
        uses: ./.github/actions/setup-cmux-tui-rust

      - name: The tailnet target selection and job-local Go installer
        if: ${{ !cancelled() }}
        run: |
          python3 tests/test_tailnet_build_delivery.py
          python3 tests/test_tailnet_go.py
          bash scripts/cmux-next/tests/rust-daemon-miss-builds.test.sh

      - name: The cmux-browser-host release package
        if: ${{ !cancelled() }}
        run: python3 tests/test_browser_host_release_package.py

      # A remote that does not answer is retried and named as the network, never read as a missing
      # ref, and no script swallows a remote read's failure (nightly run 43113697713).
      - name: Remote reads tell no answer from no ref
        if: ${{ !cancelled() }}
        run: bash scripts/cmux-next/tests/origin-net.test.sh

      - name: install-zig-ci.sh installs only a reviewed Zig
        if: ${{ !cancelled() }}
        run: python3 tests/test_install_zig_ci_reviewed_version.py

      - name: The Xcode project normalizer of the commit hook and merge driver (normalize-pbxproj.py)
        if: ${{ !cancelled() }}
        run: python3 tests/test_normalize_pbxproj.py

      - name: The web verdict of feat-cmux-next pushes and web routing (web_validation.py)
        if: ${{ !cancelled() }}
        run: python3 tests/test_web_validation.py

      # cmux-next-tip-test-compile.yml runs the script only on feat-cmux-next pushes, so a pull
      # request that broke it landed green; a fake cmux-ci client and GitHub API stand in.
      - name: The per-push tip test compile (tip-test-compile.sh)
        if: ${{ !cancelled() }}
        run: python3 tests/test_ci_tip_test_compile.py
