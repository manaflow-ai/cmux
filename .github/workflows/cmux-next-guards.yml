name: cmux-next guards

# ci.yml skips its guards for feat-cmux-next (cmux-next.yml is that branch's
# CI) and never runs on push, so nothing ran the release and nightly guard
# tests there: tests/test_nightly_cmux_tui_resolve.py stayed red on the branch
# unseen. nightly-next ships from feat-cmux-next, so run the release-notary
# group (nightly, notarization, nightly-next guard and publication tests) for
# its pull requests and pushes. Pushes have no path filter, so a base red shows
# on the push that caused it; pull requests carry only the docs-only block
# (scripts/ci/docs_only_paths.py): a pull request of prose nothing reads starts
# no run (none of these jobs is a required check; tests/test_ci_docs_only_prs.py).
#
# A push runs the group in its release-notary job, judged at its tip, so a base red
# still fails the push that caused it, and in the CI guard group, so the merge
# gate's base-red excuse finds a base verdict for every release-notary step a
# pull request's guard group can fail. A pull request runs it inside the CI
# guard group's head-and-base comparison instead (ci-guard-group, below), which
# fails only on a step red on the change and not on its base, and only when the
# change reaches what the group reads: release, notary and signing paths, the
# workflows and CI scripts it pins, and the release notes and updater sources it
# reads (detect_linux_guard_changes.RELEASE_NOTARY_INPUTS). On every pull request
# it cost about 200,000 runner-minutes in 14 days, and none of its 18 PR failures
# was the change's own (cmuxterm-hq plans/ci/baggage-2026-11-05.md). Run on its own,
# every pull request was red while the branch was: workflow-text pins in this
# group (nightly.yml, warm-sources.json, the step-coverage map) go red on any
# push that edits those files without the tests, and 833 of 1656 pull request
# runs in the 24 h to 2026-11-05 08:24Z were red with the base's reds alone.
on:
  pull_request:
    branches: [feat-cmux-next]
    # docs-only paths: BEGIN (scripts/ci/docs_only_paths.py --sync writes this block; edit DOCS_ONLY_PATHS there)
    paths:
      - "**"
      - "!**/*.md"
      - "!docs/**/*.png"
      - "!docs/**/*.jpg"
      - "!docs/**/*.gif"
      - "!docs/**/*.webp"
      - "!plans/**/*.png"
      - "!plans/**/*.jpg"
      - "!plans/**/*.gif"
      - "!plans/**/*.webp"
      - "**/AGENTS.md"
      - "**/CLAUDE.md"
      - "**/SKILL.md"
      - ".github/**"
      - "**/skills/**"
      - "**/references/**"
      - "**/templates/**"
      - "**/Resources/**"
      - "**/fixtures/**"
      - "**/testdata/**"
      - "**/test/**"
      - "**/tests/**"
      - "CHANGELOG.md"
      - "THIRD_PARTY_LICENSES.md"
      - "release-notes/**"
      - "docs/agent-hooks.md"
      - "docs/chief-setup-prompts.md"
      - "docs/configuration.md"
      - "docs/ci/node-product-cache-maintenance.md"
      - "plans/cmux-next/actions.md"
      - "docs/mdm/managed-preferences.md"
      - "docs/ci/health-report.md"
      - "docs/privacy.md"
      - "**/notices/**"
      - "vendor/stack-auth-swift-sdk-prerelease/README.cmux.md"
      - "cmux-tui/README.md"
      - "docs/remote-agents-and-cloud.md"
      - "docs/cmux-next/customize-recipes.md"
      - "cmux-tui/crates/acpmux/README.md"
      - "cmux-tui/crates/acpmux/docs/**"
      - "cmux-tui/crates/cmux-browser-host/js/guide.md"
      - "cmux-tui/crates/cmux-extension-sdk/README.md"
      - "cmux-tui/vendor/terminput-crossterm/README.md"
      - "mux/packages/brain/conformance/README.md"
    # docs-only paths: END
  # docs-only-fallback.yml calls this in a pull request's own context when the docs-only `paths:` above could
  # have skipped it wrongly (over 300 changed files, or a full-ci/dev-build label): scripts/ci/docs_only_paths.py.
  workflow_call:
  push:
    branches: [feat-cmux-next]

permissions:
  contents: read

# The CmuxNextApp size cap is a structural guard: while this is `warn` it
# prints its findings as a warning and passes (Leo, 2026-10-19). Set it to
# `fail` to make it block again. The crash ratchet, the defaults snapshot
# freshness, the guard self-tests and the menu check still fail.
env:
  CMUX_NEXT_STYLE_GUARDS: warn
  # Temporary REST budget attribution: one gh-call line per GitHub API call (scripts/ci/api_call_log/env.sh, fetched at a fixed commit when the checkout has no copy).
  BASH_ENV: '$({ w="${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh"; t="${RUNNER_TEMP:-/nonexistent}/api-call-log-src"; if [ -f "$w" ]; then echo "$w"; elif [ -n "${RUNNER_TEMP:-}" ]; then if [ ! -f "$t/env.sh" ] && [ ! -e "$t.tried" ] && { [ "${RUNNER_OS:-}" = Linux ] || [ "${RUNNER_OS:-}" = macOS ]; } && [ "$(date -u +%Y%m%d%H)" -lt 2026112300 ]; then : > "$t.tried"; mkdir -p "$t.part" && for x in env.sh gh sitecustomize.py isolated.py; do curl -fsSL --max-time 5 -o "$t.part/$x" "https://raw.githubusercontent.com/manaflow-ai/cmux/27647ffd3ae838c63be28ca3e5883dcd68c34518/scripts/ci/api_call_log/$x" || break; done; [ -s "$t.part/isolated.py" ] && mv "$t.part" "$t"; fi; if [ -f "$t/env.sh" ]; then echo "$t/env.sh"; else echo unset BASH_ENV > "$t.off.sh" && echo "$t.off.sh"; fi; fi; } 2>/dev/null)'

concurrency:
  group: cmux-next-guards-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which fast checks this pull request can change the verdict of (scripts/ci/fast-check-inputs.json). The CI guard
  # group runs when the change routes a guard group (detect_linux_guard_changes.classify_feat), reaches what the `ci`
  # group reads (workflow_guard_groups.groups_for_path) or touches .github/, tests/ or scripts/ci/; a product-only
  # change that does none of these skips it before it takes an 8 vCPU runner. A push runs every job here, so a miss is
  # a fix-forward on base, and a push or a dispatch skips this job.
  fast-check-route:
    name: fast check route
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && (vars.CI_FORK_LINUX_RUNNER || 'ubuntu-24.04') || 'cmux-linux' }}
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      ci_guard_group: ${{ steps.route.outputs.ci_guard_group }}
      own_change_checks: ${{ steps.route.outputs.own_change_checks }}
      generated_merge_audit: ${{ steps.route.outputs.generated_merge_audit }}
    steps:
      # The guard ownership reads ci-guards.yml and the tests' imports.
      - name: Checkout the merge commit's router (trees only)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 2
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/
            /.github/
            /tests/
      # A router failure leaves the output empty, and the checks run.
      - name: Route the pull request (scripts/ci/fast_check_route.py)
        id: route
        continue-on-error: true
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: python3 scripts/ci/fast_check_route.py route --workflow .github/workflows/cmux-next-guards.yml --labels "$LABELS"

  # zizmor and gitleaks on every pull request, fail mode, judged on the merge against its first parent: a workflow
  # security hole (scripts/static-analysis/ratchet.py ZIZMOR_HOLES) or a secret the change adds fails it; every
  # other finding, and everything already on the base, is a warning. The CI guard group runs the same two steps on
  # pushes (ci-guards.yml), but it skips feat-cmux-next pull requests not labeled full-ci, so this job is what
  # judges them. Offline after the pinned, checksummed tool download; about 30 s on a 2 vCPU runner.
  security-holes:
    name: workflow security holes and secrets this change adds
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && (vars.CI_FORK_LINUX_RUNNER || 'ubuntu-24.04') || 'cmux-linux' }}
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      CMUX_STATIC_ANALYSIS_BLOCKING: "1"
    steps:
      # A persistent pool VM keeps the last job's checkout as a git cache. One left sparse (patterns, skip-worktree
      # bits) or with a ref to a missing object makes actions/checkout leave files out or fail (runs 44739498261 and
      # 44733869883, 2026-11-20); remove it so checkout clones fresh. Its manual test: test_ci_reused_sparse_checkout.py.
      - name: Remove a reused workspace left sparse or broken (self-hosted Linux)
        working-directory: ${{ github.workspace }}
        if: runner.os == 'Linux'
        shell: bash
        run: |
          [ "${RUNNER_ENVIRONMENT:-}" = self-hosted ] && [ -e "$GITHUB_WORKSPACE/.git" ] || exit 0
          cd "$GITHUB_WORKSPACE"
          why=""
          if [ "$(git config --get core.sparseCheckout 2>/dev/null)" = true ] || [ -e .git/info/sparse-checkout ]; then
            why="sparse"
          elif git ls-files -v 2>/dev/null | grep -q '^S'; then
            why="skip-worktree entries"
          elif ! git rev-parse --verify -q 'HEAD^{commit}' >/dev/null; then
            why="HEAD does not resolve"
          elif git for-each-ref --format='%(objectname)' 2>/dev/null | git cat-file --batch-check 2>/dev/null | grep -q ' missing$'; then
            why="a ref names a missing object"
          else
            exit 0
          fi
          echo "reused workspace on ${RUNNER_NAME:-this runner}: $why; removing it so checkout starts clean"
          find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +

      - name: Checkout
        timeout-minutes: 5
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          # A pull request's merge commit and its first parent (the base).
          fetch-depth: 2

      - name: Fail on a workflow security hole this change adds (zizmor)
        if: ${{ !cancelled() }}
        timeout-minutes: 3
        run: |
          python3 tests/test_static_analysis_ratchet.py
          python3 scripts/static-analysis/ratchet.py zizmor --base HEAD^1 --head HEAD

      - name: Fail on a secret this change commits (gitleaks)
        if: ${{ !cancelled() }}
        timeout-minutes: 3
        run: python3 scripts/static-analysis/ratchet.py gitleaks --base HEAD^1 --head HEAD

  # One run per 30-minute window on the feat-cmux-next tip (base-coalesce.yml): the first push of each window runs
  # every job below, covering every push since the last run (each diffing step reads needs.coalesce.outputs.base
  # where it read event.before); the other pushes' jobs report skipped, with no runner taken. 18,301 runner-minutes a
  # day ran here on pushes alone (about 530 runs a day, ci-dash feed 2026-11-14/16/17); about 48 runs a day now.
  # A red is seen within about 30 minutes plus the gap to the next push (median 1.3, max 73 minutes over
  # 2026-11-13..21) plus the run, and base-red-watch bisects it over the covered range. Pull requests are unchanged
  # (the coalesce job is skipped on them). vars.NEXT_GUARDS_COALESCE = '0' runs every push again.
  coalesce:
    uses: ./.github/workflows/base-coalesce.yml
    with:
      key: cmux-next-guards
      hold_minutes: 30
      no_coalesce: ${{ format('{0}', vars.NEXT_GUARDS_COALESCE) == '0' }}

  # A pin manifest is a publication contract: a source change that records a
  # missing artifact would otherwise fail much later on a cold pool VM.  This
  # uses the same read-only store credentials as the release path and a fresh
  # cache, so a worker-local copy cannot make a missing publication look green.
  # Fork pull requests cannot receive the protected store key; their merge
  # push runs this check before any pool image or nightly can consume the pin.
  pinned-asset-store:
    needs: coalesce
    name: pinned assets exist in store
    # Tier A of the merged pull request replay (scripts/ci/affected-jobs.json pull_request_skip): a pull request
    # into feat-cmux-next skips it unless labeled full-ci; the feat-cmux-next push runs it.
    if: ${{ (!cancelled() && needs.coalesce.outputs.run != 'false' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && (github.event_name != 'pull_request' || !startsWith(github.event.pull_request.base.ref, 'feat-cmux-next') || contains(github.event.pull_request.labels.*.name, 'full-ci')) }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && (vars.CI_FORK_LINUX_RUNNER || 'ubuntu-24.04') || 'cmux-linux' }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # A persistent pool VM keeps the last job's checkout as a git cache. One left sparse (patterns, skip-worktree
      # bits) or with a ref to a missing object makes actions/checkout leave files out or fail (runs 44739498261 and
      # 44733869883, 2026-11-20); remove it so checkout clones fresh. Its manual test: test_ci_reused_sparse_checkout.py.
      - name: Remove a reused workspace left sparse or broken (self-hosted Linux)
        working-directory: ${{ github.workspace }}
        if: runner.os == 'Linux'
        shell: bash
        run: |
          [ "${RUNNER_ENVIRONMENT:-}" = self-hosted ] && [ -e "$GITHUB_WORKSPACE/.git" ] || exit 0
          cd "$GITHUB_WORKSPACE"
          why=""
          if [ "$(git config --get core.sparseCheckout 2>/dev/null)" = true ] || [ -e .git/info/sparse-checkout ]; then
            why="sparse"
          elif git ls-files -v 2>/dev/null | grep -q '^S'; then
            why="skip-worktree entries"
          elif ! git rev-parse --verify -q 'HEAD^{commit}' >/dev/null; then
            why="HEAD does not resolve"
          elif git for-each-ref --format='%(objectname)' 2>/dev/null | git cat-file --batch-check 2>/dev/null | grep -q ' missing$'; then
            why="a ref names a missing object"
          else
            exit 0
          fi
          echo "reused workspace on ${RUNNER_NAME:-this runner}: $why; removing it so checkout starts clean"
          find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Resolve the previous revision
        id: base
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ needs.coalesce.outputs.base != 'unknown' && needs.coalesce.outputs.base || github.event.before }}
        run: |
          set -euo pipefail
          base=""
          if [[ "$EVENT_NAME" == pull_request ]]; then
            base="$(git rev-parse HEAD^1)"
          elif [[ "$BEFORE" =~ ^[0-9a-f]{40}$ ]] && [[ ! "$BEFORE" =~ ^0+$ ]]; then
            if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              git fetch --no-tags --depth=1 origin "$BEFORE" >/dev/null 2>&1 || true
            fi
            if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              base="$BEFORE"
            fi
          fi
          base="${base:-HEAD^1}"
          echo "base=$base" >> "$GITHUB_OUTPUT"

      - name: Verify changed pinned assets exist in the store
        env:
          CMUX_CEF_R2_ACCOUNT_ID: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && secrets.CMUX_CEF_R2_ACCOUNT_ID || '' }}
          CMUX_CEF_R2_ACCESS_KEY_ID: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && secrets.CMUX_CEF_R2_ACCESS_KEY_ID || '' }}
          CMUX_CEF_R2_SECRET_ACCESS_KEY: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && secrets.CMUX_CEF_R2_SECRET_ACCESS_KEY || '' }}
          CMUX_CEF_R2_ENV_FILE: /dev/null
        run: scripts/cmux-next/check-pinned-assets.sh "${{ steps.base.outputs.base }}"

  nightly-guards:
    needs: coalesce
    if: ${{ !cancelled() && needs.coalesce.outputs.run != 'false' }}
    permissions:
      contents: read
      checks: read
    uses: ./.github/workflows/ci-guards.yml
    with:
      # Never the matrix leg: it ran release-notary's 124 steps one after another, 915 s on 4 vCPU, past its
      # 15-minute job on every push (run 44110521024). A push runs them in parallel in the release-notary job (below);
      # a pull request runs them in ci-guard-group's head-and-base comparison (header). This call keeps the
      # submodule forward-only guard and Guard status.
      linux_guard_tests: ${{ 'false' }}
      linux_guard_test_groups: '["release-notary"]'
      linux_guard_history: ${{ 'false' }}
      linux_guard_cli: ${{ 'false' }}
      linux_guard_source: ${{ 'false' }}

  # A push's release-notary guards (nightly, notarization, nightly-next publication), judged at the tip so a base
  # red fails the push that caused it. run_ci_guards.py runs the group's ci-guards.yml steps, every one, a worker
  # per core: the ghostty-next init first, then the rest in parallel, each in its own RUNNER_TEMP and session. In
  # the matrix leg, one after another, the 124 steps took 915 s on 4 vCPU and the 15-minute job ended cancelled
  # with no verdict on every push sampled (runs 44105922962, 44107327387, 44109411155, 44110521024). Each red
  # step is named on a `guard red step (tip): STEP` line. Linux only: the persistent cmux-linux pool. Never a mini,
  # as for the guard group: on cmux13 (run 44211360475) 12 of its steps went red for the mini alone (no node, no
  # Linux tools), where every step finished in 230 s.
  release-notary:
    name: release-notary guards at the tip
    needs: coalesce
    if: ${{ !cancelled() && needs.coalesce.outputs.run != 'false' && (github.event_name != 'pull_request') }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || 'cmux-linux' }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # A persistent pool VM keeps the last job's checkout as a git cache. One left sparse (patterns, skip-worktree
      # bits) or with a ref to a missing object makes actions/checkout leave files out or fail (runs 44739498261 and
      # 44733869883, 2026-11-20); remove it so checkout clones fresh. Its manual test: test_ci_reused_sparse_checkout.py.
      - name: Remove a reused workspace left sparse or broken (self-hosted Linux)
        working-directory: ${{ github.workspace }}
        if: runner.os == 'Linux'
        shell: bash
        run: |
          [ "${RUNNER_ENVIRONMENT:-}" = self-hosted ] && [ -e "$GITHUB_WORKSPACE/.git" ] || exit 0
          cd "$GITHUB_WORKSPACE"
          why=""
          if [ "$(git config --get core.sparseCheckout 2>/dev/null)" = true ] || [ -e .git/info/sparse-checkout ]; then
            why="sparse"
          elif git ls-files -v 2>/dev/null | grep -q '^S'; then
            why="skip-worktree entries"
          elif ! git rev-parse --verify -q 'HEAD^{commit}' >/dev/null; then
            why="HEAD does not resolve"
          elif git for-each-ref --format='%(objectname)' 2>/dev/null | git cat-file --batch-check 2>/dev/null | grep -q ' missing$'; then
            why="a ref names a missing object"
          else
            exit 0
          fi
          echo "reused workspace on ${RUNNER_NAME:-this runner}: $why; removing it so checkout starts clean"
          find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # A self-hosted Linux host reuses its workspace: drop the submodule checkouts a previous job
      # left there (a no-op on Blacksmith, which starts with none).
      - name: Drop stale submodule checkouts (self-hosted reused workspace)
        run: scripts/ci/reset-stale-submodules.sh

      - name: Run the release-notary guards
        run: |
          # The job ends at 15 minutes; the group gets 13 of them (--deadline: a mini has no GNU timeout), so a stuck
          # step ends in a "timed out" verdict instead of a cancelled job.
          scripts/ci/guards-local.sh --no-stamp --keep-going --jobs "$(getconf _NPROCESSORS_ONLN)" --group release-notary --deadline 780 --results "$RUNNER_TEMP/release-notary.json" || true
          python3 scripts/ci/guards_new_reds.py --tip "$RUNNER_TEMP/release-notary.json"

  # Signing jobs (the nightly notarization and iOS nightly Mac jobs) take their runner from this variable, so they must
  # name ephemeral runners only: Blacksmith or GitHub's hosted Linux, never an owned mini
  # (tests/test_ci_signing_keychain_is_deleted_before_bundle_code.py rule 7). Unset falls back to a Blacksmith
  # literal and passes. This job's own runner is a literal, so a variable at a missing label still goes red.
  signing-runner-variables:
    needs: coalesce
    name: signing runner variables are ephemeral
    # Tier A of the merged pull request replay (scripts/ci/affected-jobs.json pull_request_skip): a pull request
    # into feat-cmux-next skips it unless labeled full-ci; the feat-cmux-next push runs it.
    if: ${{ (!cancelled() && needs.coalesce.outputs.run != 'false') && (github.event_name != 'pull_request' || !startsWith(github.event.pull_request.base.ref, 'feat-cmux-next') || contains(github.event.pull_request.labels.*.name, 'full-ci')) }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.CI_CLOUD_OVERFLOW_SAVED && 'blacksmith-8vcpu-ubuntu-2404' || 'blacksmith-2vcpu-ubuntu-2404' }}
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Runner variables that signing jobs read name ephemeral runners
        env:
          MACOS_RUNNER_26: ${{ vars.MACOS_RUNNER_26 }}
        run: |
          bad=0
          for name in MACOS_RUNNER_26; do
            value="${!name}"
            case "$value" in
              ""|blacksmith-*|ubuntu-*) echo "$name=${value:-<unset>}" ;;
              *) echo "::error::vars.$name is '$value'; signing jobs run on it, so it must be blacksmith-* or ubuntu-*"; bad=1 ;;
            esac
          done
          [ "$bad" = 0 ] || exit 1

  # ci-guards.yml's `ci` group (workflow lints, hook trust, runner and cache policy: scripts/ci/guards-local.sh's
  # default set) ran only in ci.yml's "CI fast guards", which skips feat-cmux-next pull requests, and ci.yml never
  # runs on its pushes. Nothing ran it for the branch: tests/test_preflight_trust.py errored there unseen until
  # #23006 (tests/test_feat_ci_guard_group.py).
  # ci.yml also routes ci-guards.yml's other groups by path, again only into main, so about 70 guard tests
  # never ran for feat-cmux-next (tests/pr-lane-exemptions.json). This job runs them too: --feat-routes picks
  # the groups a pull request's paths route to (detect_linux_guard_changes.classify_feat, workflow_guard_groups.py's
  # ownership), and every routed group on a push. The main-only release-ios group never runs here; release-notary runs here
  # on a pull request that reaches its inputs (compared with its base) and on every push (here, and in the release-notary job).
  ci-guard-group:
    name: cmux-next CI guard group
    # A guard worker per core: the head and the base each run every routed group, on every pull request and push
    # (175-359 s on 4 vCPU with 8 workers).
    # Linux only: the persistent cmux-linux pool, never a mini (on a mini 24 of its steps went red: no python3.9 or
    # node, temp-cwd scripts).
    needs: [coalesce, fast-check-route]
    # Tier B of the merged pull request replay (scripts/ci/affected-jobs.json pull_request_skip): a pull request
    # into feat-cmux-next skips it unless labeled full-ci; the feat-cmux-next push runs it, and its few misses are fixed forward.
    if: ${{ !cancelled() && needs.coalesce.outputs.run != 'false' && needs.fast-check-route.outputs.ci_guard_group != 'false' && (github.event_name != 'pull_request' || !startsWith(github.event.pull_request.base.ref, 'feat-cmux-next') || contains(github.event.pull_request.labels.*.name, 'full-ci')) }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && (vars.CI_FORK_LINUX_RUNNER || 'ubuntu-24.04') || 'cmux-linux' }}
    # Temporary 35 (was 25) until the head pass is short again: green p50 rose from about 15 min to 20-23 min on
    # 11-20 12Z, and a third of runs were cancelled at 25 with no verdict, then re-run (hq docs/ci/ci-cut-ledger.md).
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      # The guard step's bounds count from here, the job's own clock, not from the step: the checkouts and setup before it
      # took 1.5 to 3 minutes, so a bound counted from the step let the job pass its 25 minutes in the post steps and end
      # "cancelled" (139 of 452 cancels in 24 h ended at 25 minutes, each masking the step's own verdict).
      - name: Note when the job started
        shell: bash
        run: echo "GUARD_JOB_STARTED=$(date +%s)" >> "$GITHUB_ENV"

      # A persistent pool VM keeps the last job's checkout as a git cache. One left sparse (patterns, skip-worktree
      # bits) or with a ref to a missing object makes actions/checkout leave files out or fail (runs 44739498261 and
      # 44733869883, 2026-11-20); remove it so checkout clones fresh. Its manual test: test_ci_reused_sparse_checkout.py.
      - name: Remove a reused workspace left sparse or broken (self-hosted Linux)
        working-directory: ${{ github.workspace }}
        if: runner.os == 'Linux'
        shell: bash
        run: |
          [ "${RUNNER_ENVIRONMENT:-}" = self-hosted ] && [ -e "$GITHUB_WORKSPACE/.git" ] || exit 0
          cd "$GITHUB_WORKSPACE"
          why=""
          if [ "$(git config --get core.sparseCheckout 2>/dev/null)" = true ] || [ -e .git/info/sparse-checkout ]; then
            why="sparse"
          elif git ls-files -v 2>/dev/null | grep -q '^S'; then
            why="skip-worktree entries"
          elif ! git rev-parse --verify -q 'HEAD^{commit}' >/dev/null; then
            why="HEAD does not resolve"
          elif git for-each-ref --format='%(objectname)' 2>/dev/null | git cat-file --batch-check 2>/dev/null | grep -q ' missing$'; then
            why="a ref names a missing object"
          else
            exit 0
          fi
          echo "reused workspace on ${RUNNER_NAME:-this runner}: $why; removing it so checkout starts clean"
          find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          # A pull request's merge commit and its first parent (the base) for the changed files.
          fetch-depth: 2

      # A mini or fleet Linux host reuses its workspace: drop the submodule checkouts a previous job
      # left there (a no-op on Blacksmith, which starts with none).
      - name: Drop stale submodule checkouts (self-hosted reused workspace)
        run: scripts/ci/reset-stale-submodules.sh

      # The base this change is judged against, and the diff the groups are routed by: a pull request's
      # merge commit against its first parent (pull_request.base.sha lags it once the base moves), a push
      # against the previous tip. A push runs every routed group (no list): a product-only change routes
      # none on its pull request, and a guard it breaks then shows on the push that landed it. No base
      # (a new branch, an unreadable tip) routes every group and runs no base comparison.
      # A push that touches what the guards read (.github/, tests/, scripts/ci/) is judged at its tip: no base
      # comparison, so every red step fails the push. Judged only against the previous tip, a red that persists
      # stays green: 18 guard steps sat red on the branch, unseen, until #31366
      # (detect_linux_guard_changes.feat_push_judges_tip).
      - name: Changed files
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ needs.coalesce.outputs.base != 'unknown' && needs.coalesce.outputs.base || github.event.before }}
        run: |
          base=""
          if [[ "$EVENT_NAME" == pull_request ]]; then
            base="$(git rev-parse HEAD^1)"
          elif [[ "$BEFORE" =~ ^[0-9a-f]{40}$ && ! "$BEFORE" =~ ^0+$ ]] \
            && git fetch --no-tags --depth=1 origin "$BEFORE"; then
            base="$BEFORE"
            # The checkout holds HEAD and its parent only, so a push of more than one commit leaves
            # the previous tip in a separate shallow history and `git merge-base` (the SwiftPM
            # lockfile policy's comparison, PACKAGE_RESOLVED_POLICY_BASE_REF) finds nothing. Deepen
            # HEAD's history, commits and trees only, until it reaches the previous tip; a force-push
            # whose tip is not reached within 400 commits keeps no base, as an unreadable tip does.
            for _ in 1 2 3 4 5 6 7 8; do
              git merge-base "$BEFORE" HEAD >/dev/null 2>&1 && break
              git fetch --no-tags --filter=blob:none --deepen=50 origin "$GITHUB_SHA" || break
            done
            if ! git merge-base "$BEFORE" HEAD >/dev/null 2>&1; then
              echo "::warning::the previous tip $BEFORE shares no history with HEAD within reach"
              base=""
            fi
          fi
          if [[ -n "$base" ]] && git diff --name-only --no-renames "$base" HEAD > "$RUNNER_TEMP/changed-files.txt"; then
            echo "$(wc -l < "$RUNNER_TEMP/changed-files.txt") changed files against $base"
            echo "base=$base" >> "$GITHUB_OUTPUT"
            if [[ "$EVENT_NAME" != pull_request ]]; then
              tip="$(python3 scripts/ci/detect_linux_guard_changes.py --feat-push-tip "$RUNNER_TEMP/changed-files.txt")"
              echo "tip=$tip" >> "$GITHUB_OUTPUT"
              rm -f "$RUNNER_TEMP/changed-files.txt"
              echo "a push runs every routed guard group"
              if [[ "$tip" == true ]]; then
                echo "the push touches what the guards read: every red step at the tip fails it"
              fi
            fi
          else
            rm -f "$RUNNER_TEMP/changed-files.txt"
            echo "::warning::no base to diff against; every routed guard group runs"
          fi

      # run_ci_guards.py skips ci-guards.yml's `uses:` setup steps, so this job provides their tools:
      # bun (at ci-guards.yml's pin) for preflight-agent-chat, and python3.9 beside the runner's python3
      # for release-tooling's nightly prune compatibility step (PYTHON_BIN=python3.9).
      - name: Set up Bun for guard tests
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
          no-cache: ${{ !startsWith(github.workspace, '/home/runner/work/') }}

      # setup-python installs 3.9 on Linux; a runner without it takes the one uv installs, if any.
      # The head and the base run on the same machine, so either way they compare like for like.
      # Its download can fail (GitHub answered 504 on 2026-11-08); the next step's fallback covers that
      # too, so a failed setup leaves no path rather than failing the group.
      - name: Set up Python 3.9 for nightly prune compatibility
        id: python39
        if: runner.os == 'Linux'
        continue-on-error: true
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.9"
          update-environment: false

      - name: Put python3.9 on PATH
        env:
          PYTHON39: ${{ steps.python39.outputs.python-path }}
        run: |
          mkdir -p "$RUNNER_TEMP/python39"
          if [ -z "$PYTHON39" ] && command -v uv >/dev/null 2>&1; then
            PYTHON39="$(uv python find 3.9 2>/dev/null || { uv python install 3.9 >/dev/null 2>&1 && uv python find 3.9; } || true)"
          fi
          if [ -z "$PYTHON39" ]; then
            echo "::warning::no Python 3.9 on this runner; the nightly prune compatibility step reds on the head and the base alike"
            exit 0
          fi
          # A wrapper, not a symlink: setup-python's 3.9 is a shared-library build that finds libpython3.9.so through
          # LD_LIBRARY_PATH, which update-environment: false leaves unset (a persistent pool runner: "libpython3.9.so.1.0:
          # cannot open shared object file", guards run 44762407859).
          lib="$(cd "$(dirname "$PYTHON39")/../lib" 2>/dev/null && pwd || true)"
          # shellcheck disable=SC2016 # $LD_LIBRARY_PATH and $@ are the wrapper's own, expanded when it runs
          printf '#!/bin/sh\nLD_LIBRARY_PATH="%s${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" exec "%s" "$@"\n' "$lib" "$PYTHON39" \
            > "$RUNNER_TEMP/python39/python3.9"
          chmod 755 "$RUNNER_TEMP/python39/python3.9"
          "$RUNNER_TEMP/python39/python3.9" -c 'import sys; assert sys.version_info[:2] == (3, 9)' \
            || { echo "::warning::$PYTHON39 does not start as Python 3.9"; rm -f "$RUNNER_TEMP/python39/python3.9"; exit 0; }
          echo "$RUNNER_TEMP/python39" >> "$GITHUB_PATH"

      # The branch had 24 of the group's 134 steps red before this job ran there (2026-10-21), so the job fails
      # only on a step red on this change but not on its base; the base's reds are warnings
      # (scripts/ci/guards_new_reds.py). The base's steps run with this checkout's runner (--root).
      - name: Checkout the base
        if: (steps.changes.outputs.base || '') != '' && (steps.changes.outputs.base) != '0000000000000000000000000000000000000000' && steps.changes.outputs.tip != 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ steps.changes.outputs.base }}
          path: .guard-base
          persist-credentials: false

      # A pull request routes release-notary by its paths like the other groups (classify_feat,
      # RELEASE_NOTARY_INPUTS). A push runs every routed group, release-notary included, so every guard step a pull
      # request's run can fail has a verdict in the base's newest push run of this job, the run the merge gate's
      # base-red excuse reads (base_red_excuse.py GUARD_GROUP_JOB). While a push left release-notary to
      # nightly-guards, a release-notary red on a pull request had no base verdict here and was never excused
      # (cmux#45374, cmux#44413).
      - name: Run the ci guard group and the routed groups
        env:
          CMUX_GUARDS_BASE_SHA: ${{ steps.changes.outputs.base }}
          GUARDS_AT_TIP: ${{ steps.changes.outputs.tip }}
        run: |
          # The job ends at 25 minutes; the base pass gets what the head pass leaves of 22 minutes of the job, so a slow base ends in a
          # verdict (with unfinished base steps deferred to the merge gate) instead of a cancelled job that land-judge waits on.
          # The head pass is bound too, to 15 minutes, so a slow head leaves 8 for the base's re-run and the verdict. Unbound,
          # a head pass still running 23 minutes into the step (442 steps, 4 workers) was cancelled by the job timeout with
          # no verdict. A cut head is red, never green: its unfinished steps have no result to compare.
          step_started=$(date +%s)
          # Both passes and the verdict end by minute 22 of the job (3 minutes left for the post steps and the runner's clean-up).
          job_deadline=$(( ${GUARD_JOB_STARTED:-$step_started} + 22 * 60 ))
          # The base checkout is untracked in this workspace; the workload profile refuses a dirty checkout.
          echo "/.guard-base/" >> .git/info/exclude
          # The same call on a pull request and a push: a push has no changed-files list, so --feat-routes routes every group.
          # A pull request runs, within those groups, only the steps its diff reaches (--affected,
          # scripts/ci/guard_step_inputs.py): a step whose inputs it leaves as they were gives the base's verdict again.
          # A push runs every step, so each step skipped here still has a verdict on the base.
          affected=()
          if [ -f "$RUNNER_TEMP/changed-files.txt" ] && [ -n "$CMUX_GUARDS_BASE_SHA" ]; then
            affected=(--affected "$CMUX_GUARDS_BASE_SHA")
          fi
          head_budget=$(( job_deadline - $(date +%s) ))
          if [ "$head_budget" -gt $(( 15 * 60 )) ]; then head_budget=$(( 15 * 60 )); fi
          if [ "$head_budget" -lt 60 ]; then head_budget=60; fi
          head_status=0
          timeout --kill-after=10 "$head_budget" \
            scripts/ci/guards-local.sh --no-stamp --keep-going --jobs "$(getconf _NPROCESSORS_ONLN)" --feat-routes "$RUNNER_TEMP/changed-files.txt" "${affected[@]}" --results "$RUNNER_TEMP/guards-head.json" || head_status=$?
          if [ "$head_status" -eq 124 ] || [ "$head_status" -eq 137 ]; then
            echo "::error title=ci guard group head pass cut::the head pass hit its ${head_budget}s bound (exit ${head_status}); its unfinished steps have no head result"
            scripts/ci/guards-local.sh --list --feat-routes "$RUNNER_TEMP/changed-files.txt" "${affected[@]}" 2>/dev/null \
              | sed -n 's/^  - //p; s/  (Linux only; skipped here)$//' | sort -u > "$RUNNER_TEMP/guards-plan.txt" || true
            # --results has one key per finished step; a step with no key was cut off.
            sed -n 's/^  "\(.*\)": \(true\|false\),\{0,1\}$/\1/p' "$RUNNER_TEMP/guards-head.json" | sort -u > "$RUNNER_TEMP/guards-done.txt" || true
            comm -23 "$RUNNER_TEMP/guards-plan.txt" "$RUNNER_TEMP/guards-done.txt" > "$RUNNER_TEMP/guards-cut.txt" || true
            echo "$(wc -l < "$RUNNER_TEMP/guards-cut.txt") of $(wc -l < "$RUNNER_TEMP/guards-plan.txt") planned steps had no head result when it was cut (first 40):"
            head -n 40 "$RUNNER_TEMP/guards-cut.txt"
          fi
          # The base re-runs only the steps red on the head (guards_new_reds.py --red-steps): a step green on the
          # head is never the change's, and the full base pass doubled the job once release-notary joined it.
          steps=()
          while IFS= read -r step; do
            [ -n "$step" ] && steps+=(--step "$step")
          done < <(python3 scripts/ci/guards_new_reds.py --red-steps "$RUNNER_TEMP/guards-head.json")
          if [ -d .guard-base ] && [ "${#steps[@]}" -gt 0 ]; then
            echo "re-running the head's $(( ${#steps[@]} / 2 )) red steps on the base"
            budget=$(( job_deadline - $(date +%s) ))
            if [ "$budget" -lt 60 ]; then budget=60; fi
            timeout --kill-after=10 "$budget" \
              scripts/ci/guards-local.sh --no-stamp --keep-going --jobs "$(getconf _NPROCESSORS_ONLN)" --feat-routes "$RUNNER_TEMP/changed-files.txt" "${steps[@]}" --root .guard-base \
              --results "$RUNNER_TEMP/guards-base.json" > "$RUNNER_TEMP/guards-base.log" 2>&1 \
              || echo "::warning::the base re-run ended early (exit $?, budget ${budget}s); unfinished steps are deferred to the merge gate"
            tail -1 "$RUNNER_TEMP/guards-base.log"
          elif [ -d .guard-base ]; then
            echo "no red step on the head; the base is not re-run"
            echo '{}' > "$RUNNER_TEMP/guards-base.json"
          fi
          if [ "$GUARDS_AT_TIP" = true ]; then
            python3 scripts/ci/guards_new_reds.py --tip "$RUNNER_TEMP/guards-head.json"
          else
            python3 scripts/ci/guards_new_reds.py "$RUNNER_TEMP/guards-head.json" "$RUNNER_TEMP/guards-base.json"
          fi

  # The static checks that may be red on the base, in one runner session and one checkout. Each was a job of its own
  # (vt-link-graph, nightly-static-capabilities, defaults-snapshot, page-strings), seconds of work behind a runner start
  # and a fresh checkout. Every step runs whatever an earlier one did (`!cancelled()`), so one red never hides another
  # check's result, and the job is red when any step is. Each step's name says which check it is: next_autoland judges
  # this job against the base step by step, so a step red on the change alone stays the change's own though another is
  # red on the base (2026-11-01, #31201: a check hidden in a group red on the base landed red).
  #
  # vt-link-graph also runs the nightly's libghostty-vt notices precondition: a ghostty-next gitlink move without a
  # regenerated vt-link-graph.json failed every nightly-next build for 9 hours (10-11), and nothing else checked it
  # before the nightly.
  #
  # build-nightly-app's static capability check (check-daemon-capabilities.sh --static-only) skips the capabilities
  # identify_capabilities adds at runtime, from a hand list. A runtime capability the app lists and the list misses
  # fails every nightly-next build: agent-session-login-v1 (#30214) kept the feed at one build for 90 minutes on
  # 2026-11-01. It runs here, not in the release-notary group, so a red there never hides it.
  #
  # The defaults snapshot's tests and the settings export stamp, in seconds (the defaults snapshot is bot-only).
  #
  # Every web bundle build runs gen-strings.mjs strict, but only pull requests that touch webviews/ run its tests.
  # 2c661dec960b renamed a setting in Swift and the catalogs, the committed settings schema kept the old keys, and the
  # first red was the bundle build on every later push and webviews/ pull request (10-20, "settings: 63 strings
  # missing"). The page strings step runs the same strict generation on every pull request and push, with no path
  # filter, so a catalog edit or a renamed setting is red where it lands. It runs last: it writes the generated
  # strings into the checkout.
  static-checks:
    needs: coalesce
    name: cmux-next static checks (vt-link-graph, nightly static capabilities, defaults snapshot, page strings)
    # Tier A of the merged pull request replay (scripts/ci/affected-jobs.json pull_request_skip): a pull request
    # into feat-cmux-next skips it unless labeled full-ci; the feat-cmux-next push runs it.
    if: ${{ (!cancelled() && needs.coalesce.outputs.run != 'false') && (github.event_name != 'pull_request' || !startsWith(github.event.pull_request.base.ref, 'feat-cmux-next') || contains(github.event.pull_request.labels.*.name, 'full-ci')) }}
    # A fork pull request runs on a hosted runner, never on LINUX_RUNNER.
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && (vars.CI_FORK_LINUX_RUNNER || 'ubuntu-24.04') || 'cmux-linux' }}
    # Each former job's 5-minute cap is split among its steps (vt-link-graph 2+1+2, nightly static capabilities 5,
    # defaults snapshot 2+1+2, page strings 2+3), so with the checkout's 5 the steps' caps sum to the job's
    # 25 and no step's stall can use up another's time. A step that times out fails and the next step still runs.
    timeout-minutes: 25
    steps:
      # A persistent pool VM keeps the last job's checkout as a git cache. One left sparse (patterns, skip-worktree
      # bits) or with a ref to a missing object makes actions/checkout leave files out or fail (runs 44739498261 and
      # 44733869883, 2026-11-20); remove it so checkout clones fresh. Its manual test: test_ci_reused_sparse_checkout.py.
      - name: Remove a reused workspace left sparse or broken (self-hosted Linux)
        working-directory: ${{ github.workspace }}
        if: runner.os == 'Linux'
        shell: bash
        run: |
          [ "${RUNNER_ENVIRONMENT:-}" = self-hosted ] && [ -e "$GITHUB_WORKSPACE/.git" ] || exit 0
          cd "$GITHUB_WORKSPACE"
          why=""
          if [ "$(git config --get core.sparseCheckout 2>/dev/null)" = true ] || [ -e .git/info/sparse-checkout ]; then
            why="sparse"
          elif git ls-files -v 2>/dev/null | grep -q '^S'; then
            why="skip-worktree entries"
          elif ! git rev-parse --verify -q 'HEAD^{commit}' >/dev/null; then
            why="HEAD does not resolve"
          elif git for-each-ref --format='%(objectname)' 2>/dev/null | git cat-file --batch-check 2>/dev/null | grep -q ' missing$'; then
            why="a ref names a missing object"
          else
            exit 0
          fi
          echo "reused workspace on ${RUNNER_NAME:-this runner}: $why; removing it so checkout starts clean"
          find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +

      - name: Checkout
        timeout-minutes: 5
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          # HEAD^1: the base tip of a pull request's merge commit, or the
          # previous commit of a push (the defaults snapshot reads it).
          fetch-depth: 2

      - name: vt-link-graph.json is for the libghostty-vt gitlink
        if: ${{ !cancelled() }}
        timeout-minutes: 2
        run: python3 scripts/cmux-next/notices/check_ghostty_vt_notices.py --check-link-graph scripts/cmux-next/notices/vt-link-graph.json

      # The release-path package step's own data check: package-notices.json's
      # libghostty-vt texts are for the graph's commit (#19508 moved the notices,
      # the graph followed seven hours later) and the pinned texts match.
      - name: package-notices.json covers vt-link-graph.json
        if: ${{ !cancelled() }}
        timeout-minutes: 1
        run: python3 cmux-tui/dist/scripts/package_notices.py check-data

      # Pull-request dry runs of the nightly's Ghostty notice steps
      # (.github/nightly-step-coverage.json), on fixtures: the license collector
      # and verify-ghostty-license-bundle.py behind "Inject the Ghostty
      # dependency licenses", and check_ghostty_vt_notices.py's --license-manifest
      # mode behind "libghostty-vt Zig packages are covered by the notices".
      - name: The nightly's Ghostty license checks pass on fixtures
        if: ${{ !cancelled() }}
        timeout-minutes: 2
        run: |
          python3 cmux-tui/build-support/notices/ghostty/test_ghostty_licenses.py
          python3 scripts/cmux-next/notices/test_check_bundle_notices.py
          python3 scripts/cmux-next/notices/test_check_ghostty_vt_notices.py

      - name: Every runtime-added app capability is skipped by the static check
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: python3 tests/test_cmux_next_static_capability_runtime_only.py

      - name: The defaults snapshot tests
        if: ${{ !cancelled() }}
        timeout-minutes: 2
        run: python3 tests/test_defaults_guard.py

      # PR #19754 moved the workspace and tab menus' group rows into More and
      # nothing failed (Lawrence 2026-10-14: "my groups UI is lost").
      - name: The group rows stay at the top of the right-click menus
        if: ${{ !cancelled() }}
        timeout-minutes: 1
        run: python3 scripts/cmux-next/check-group-menus.py
      # Lawrence 2026-10-19: right-click New Tab Group failed while the palette
      # path worked. A menu row with its own selector is a second path beside
      # the registered action; new ones fail here.
      - name: Menu rows run registered actions, not inline selectors
        if: ${{ !cancelled() }}
        timeout-minutes: 2
        run: python3 scripts/cmux-next/check-menu-actions.py

      - name: Setup Node
        if: ${{ !cancelled() }}
        timeout-minutes: 2
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.22.1"

      # No install: the generator reads only the catalogs and the settings schema.
      - name: Every page's strings generate with no missing translation
        if: ${{ !cancelled() }}
        timeout-minutes: 3
        env:
          CMUX_STRINGS_BEST_EFFORT: ""
        run: node webviews/scripts/pages/gen-strings.mjs
  # The nightly-next build generates the Rust third-party notices from the
  # tree (scripts/cmux-next/generate-third-party-notices.sh --tui-source tree).
  # A new path crate it cannot map failed the nightly publish (run 38359624385,
  # cmux-git, 2026-10-13) hours after the landing. This runs the same generation
  # when a pull request or push changes a Rust manifest or the notices tooling,
  # so such a change is red at its own landing.
  rust-notices-tree:
    needs: coalesce
    name: cmux-next Rust notices generate
    # Tier A of the merged pull request replay (scripts/ci/affected-jobs.json pull_request_skip): a pull request
    # into feat-cmux-next skips it unless labeled full-ci; the feat-cmux-next push runs it.
    if: ${{ (!cancelled() && needs.coalesce.outputs.run != 'false') && (github.event_name != 'pull_request' || !startsWith(github.event.pull_request.base.ref, 'feat-cmux-next') || contains(github.event.pull_request.labels.*.name, 'full-ci')) }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && (vars.CI_FORK_LINUX_RUNNER || 'ubuntu-24.04') || 'cmux-linux' }}
    timeout-minutes: 25
    steps:
      # A persistent pool VM keeps the last job's checkout as a git cache. One left sparse (patterns, skip-worktree
      # bits) or with a ref to a missing object makes actions/checkout leave files out or fail (runs 44739498261 and
      # 44733869883, 2026-11-20); remove it so checkout clones fresh. Its manual test: test_ci_reused_sparse_checkout.py.
      - name: Remove a reused workspace left sparse or broken (self-hosted Linux)
        working-directory: ${{ github.workspace }}
        if: runner.os == 'Linux'
        shell: bash
        run: |
          [ "${RUNNER_ENVIRONMENT:-}" = self-hosted ] && [ -e "$GITHUB_WORKSPACE/.git" ] || exit 0
          cd "$GITHUB_WORKSPACE"
          why=""
          if [ "$(git config --get core.sparseCheckout 2>/dev/null)" = true ] || [ -e .git/info/sparse-checkout ]; then
            why="sparse"
          elif git ls-files -v 2>/dev/null | grep -q '^S'; then
            why="skip-worktree entries"
          elif ! git rev-parse --verify -q 'HEAD^{commit}' >/dev/null; then
            why="HEAD does not resolve"
          elif git for-each-ref --format='%(objectname)' 2>/dev/null | git cat-file --batch-check 2>/dev/null | grep -q ' missing$'; then
            why="a ref names a missing object"
          else
            exit 0
          fi
          echo "reused workspace on ${RUNNER_NAME:-this runner}: $why; removing it so checkout starts clean"
          find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Changed notice inputs
        id: inputs
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || needs.coalesce.outputs.base != 'unknown' && needs.coalesce.outputs.base || github.event.before }}
        run: |
          set -euo pipefail
          if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || [[ "$BASE_SHA" =~ ^0+$ ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          changed="$(git diff --name-only "$BASE_SHA" HEAD)"
          pattern='(^|/)Cargo\.(toml|lock)$|^scripts/cmux-next/remote-browser-host\.pin\.json$|^cmux-tui/build-support/notices/|^scripts/cmux-next/generate-third-party-notices\.sh$|^scripts/cmux-next/notices/|^Packages/macOS/CmuxNext/Package\.resolved$'
          if grep -qE "$pattern" <<<"$changed"; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi

      - name: Generate the Rust notices from this tree (as the nightly does)
        if: steps.inputs.outputs.run == 'true'
        env:
          CMUX_NOTICES_ALLOW_CARGO: "1"
          CMUX_NOTICES_CACHE: ${{ runner.temp }}/cmux-notices
        run: |
          ./scripts/cmux-next/generate-third-party-notices.sh --tui-source tree \
            --cargo-trees "$RUNNER_TEMP/cmux-notices-cargo-trees" --write-cargo-trees

  # The checks that judge a change against its base, in one runner session and one checkout: red only for the
  # change's own regression, so a base red never excuses them (next_autoland's NEVER_BASE matches "size cap" and
  # "crash ratchet" in this job's name; base-red-watch's base pass ignores it for the same words). Each was a job of its
  # own, seconds of work behind a runner start and a fresh checkout. Every step runs whatever an earlier one did
  # (`!cancelled()`), so one red never hides another check's result; each step's name says which check it is. The
  # checkout holds a pull request's merge commit and its first parent (the base); a push compares against
  # event.before, fetched by each step that needs it.
  #
  # The CmuxNextApp size cap (code-quality.md SW14). cmux-next.yml's checks job skips pushes to feat-cmux-next and runs
  # on pull requests only for its path filter, so GitHub merges grew the App past the cap. This workflow has no path
  # filter, so the check can be a required one. Only the size cap runs here: the god-file checks stay warn-only, and
  # the size cap warns too while CMUX_NEXT_STYLE_GUARDS is `warn`. A pull request fails on real source growth against
  # its merge commit's first parent (the base); comment/blank-line-only merge noise is ignored. A push compares against
  # event.before, so a push that went around safe-push still turns red.
  #
  # The crash ratchet (plans/cmux-next/crash-elimination.md). safe-push runs it before a direct push, but a GitHub
  # merge skips safe-push, so #20223 added 3 unwraps unchecked (2026-10-13). The change's own ratchet script and
  # baseline run on its tree and on the base tree (a pull request's merge-commit first parent; a push's previous tip);
  # the step is red when the change turns the ratchet red, or makes an already red base worse. The change's baseline is
  # also judged against the base's copy, so it may only go down: a raised counted row is red (a hit that moved to
  # another module carries its row), and a recorded waiver (a raised waived row) is a warning annotation.
  #
  # cmux NEXT's catalogs hold translation debt from before the parity check covered them (42,072 errors in 118 catalogs
  # on 2026-10-21). scripts/localization-debt-baseline.json records each catalog's counts; the localization step fails
  # when a change adds debt anywhere or raises the baseline above the base's copy, so the debt only goes down
  # (scripts/localization_catalog.py).
  #
  # No new committed generated files (Leo, 2026-10-21: "don't commit generatable stuff"): committed outputs conflict on
  # every base move. scripts/ci/generated_files_guard.py reads its rules (scripts/ci/generated-files.json and its
  # baseline) from the base, so a change cannot loosen them for itself; a generated file the base already tracks
  # uncovered is a note, not this change's red.
  own-change-checks:
    name: cmux-next size cap, crash ratchet, localization debt ratchet, no new generated files
    # A pull request that touches none of these checks' trees, adds no file and touches no generated path or
    # generator (fast-check-route) skips it.
    needs: [coalesce, fast-check-route]
    # Tier B of the merged pull request replay (scripts/ci/affected-jobs.json pull_request_skip): a pull request
    # into feat-cmux-next skips it unless labeled full-ci; the feat-cmux-next push runs it, and its few misses are fixed forward.
    if: ${{ !cancelled() && needs.coalesce.outputs.run != 'false' && needs.fast-check-route.outputs.own_change_checks != 'false' && (github.event_name != 'pull_request' || !startsWith(github.event.pull_request.base.ref, 'feat-cmux-next') || contains(github.event.pull_request.labels.*.name, 'full-ci')) }}
    # A fork pull request runs on a hosted runner, never on LINUX_RUNNER.
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && (vars.CI_FORK_LINUX_RUNNER || 'ubuntu-24.04') || 'cmux-linux' }}
    # Each former job's cap goes to its steps (size cap 5, crash ratchet 10, spawn-owner ratchet 5, localization 5,
    # generated files 8), so with the checkout's 5 the steps' caps sum to the job's 38 and no step's stall can use up
    # another's time. A step
    # that times out fails and the next step still runs. The generated files guard's 8 holds its checks' one shared
    # 400 s deadline (generated_files_guard.py DEADLINE_SECONDS): a check that cannot finish inside it warns, so a
    # busy runner makes the guard slower, never red, and it always ends before the step's limit to print why.
    timeout-minutes: 38
    steps:
      # A persistent pool VM keeps the last job's checkout as a git cache. One left sparse (patterns, skip-worktree
      # bits) or with a ref to a missing object makes actions/checkout leave files out or fail (runs 44739498261 and
      # 44733869883, 2026-11-20); remove it so checkout clones fresh. Its manual test: test_ci_reused_sparse_checkout.py.
      - name: Remove a reused workspace left sparse or broken (self-hosted Linux)
        working-directory: ${{ github.workspace }}
        if: runner.os == 'Linux'
        shell: bash
        run: |
          [ "${RUNNER_ENVIRONMENT:-}" = self-hosted ] && [ -e "$GITHUB_WORKSPACE/.git" ] || exit 0
          cd "$GITHUB_WORKSPACE"
          why=""
          if [ "$(git config --get core.sparseCheckout 2>/dev/null)" = true ] || [ -e .git/info/sparse-checkout ]; then
            why="sparse"
          elif git ls-files -v 2>/dev/null | grep -q '^S'; then
            why="skip-worktree entries"
          elif ! git rev-parse --verify -q 'HEAD^{commit}' >/dev/null; then
            why="HEAD does not resolve"
          elif git for-each-ref --format='%(objectname)' 2>/dev/null | git cat-file --batch-check 2>/dev/null | grep -q ' missing$'; then
            why="a ref names a missing object"
          else
            exit 0
          fi
          echo "reused workspace on ${RUNNER_NAME:-this runner}: $why; removing it so checkout starts clean"
          find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +

      - name: Checkout
        timeout-minutes: 5
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          # A pull request's merge commit and its first parent (the base).
          fetch-depth: 2

      - name: CmuxNextApp size cap
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ needs.coalesce.outputs.base != 'unknown' && needs.coalesce.outputs.base || github.event.before }}
        run: |
          base=()
          if [[ "$EVENT_NAME" == pull_request ]]; then
            base=(--base HEAD^1)
          elif [[ "$BEFORE" =~ ^[0-9a-f]{40}$ && ! "$BEFORE" =~ ^0+$ ]] \
            && git fetch --no-tags --depth=1 origin "$BEFORE"; then
            base=(--base "$BEFORE")
          else
            # No previous tip to compare with: the plain cap check.
            echo "::warning::no previous tip to compare with; checking the plain cap"
          fi
          rc=0
          scripts/cmux-next/check-app-size.sh ${base[@]+"${base[@]}"} "$GITHUB_WORKSPACE" || rc=$?
          # Exit 1 is over the cap (warn-only); any other code is a broken check and fails.
          if (( rc == 1 )) && [[ "$CMUX_NEXT_STYLE_GUARDS" == warn ]]; then
            echo "::warning title=CmuxNextApp size cap (warn-only)::the App target is over its size cap; see this step's log"
            exit 0
          fi
          exit "$rc"

      - name: cmux-next crash ratchet
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ needs.coalesce.outputs.base != 'unknown' && needs.coalesce.outputs.base || github.event.before }}
        run: scripts/ci/crash-ratchet-against-base.sh

      # Every task and process has an owner (cmuxterm-hq#9096): no file gains a spawn with no
      # owner, and the baseline only goes down against the base (HEAD^1 of a pull request's merge
      # commit, the previous tip of a push).
      - name: cmux-next spawn-owner ratchet
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ needs.coalesce.outputs.base != 'unknown' && needs.coalesce.outputs.base || github.event.before }}
        run: |
          base=()
          if [[ "$EVENT_NAME" == pull_request ]]; then
            base=(--base-ref HEAD^1)
          elif [[ "$BEFORE" =~ ^[0-9a-f]{40}$ && ! "$BEFORE" =~ ^0+$ ]] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            base=(--base-ref "$BEFORE")
          fi
          python3 -I scripts/cmux-next/check-spawn-owner.py "$GITHUB_WORKSPACE" ${base[@]+"${base[@]}"}

      - name: cmux-next localization debt ratchet
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ needs.coalesce.outputs.base != 'unknown' && needs.coalesce.outputs.base || github.event.before }}
        run: |
          base_ref=""
          if [[ "$EVENT_NAME" == pull_request ]]; then
            base_ref=HEAD^1
          elif [[ "$BEFORE" =~ ^[0-9a-f]{40}$ && ! "$BEFORE" =~ ^0+$ ]] \
            && git fetch --no-tags --depth=1 origin "$BEFORE"; then
            base_ref="$BEFORE"
          fi
          args=()
          base_baseline="$RUNNER_TEMP/localization-debt-baseline.base.json"
          if [[ -n "$base_ref" ]] && git show "$base_ref:scripts/localization-debt-baseline.json" > "$base_baseline" 2>/dev/null; then
            args=(--base-baseline "$base_baseline")
          fi
          # Debt the base has past its own baseline is the base's red, not this change's (#23877).
          # The base tree also proves a catalog move: a same-named catalog must hold the old
          # one's strings to inherit its baseline. Pushes need it too (feat-cmux-next lands by push).
          if [[ -n "$base_ref" && ${#args[@]} -gt 0 ]]; then
            base_root="$RUNNER_TEMP/localization-base"
            mkdir -p "$base_root"
            git archive "$base_ref" -- ':(glob)Resources/**/*.xcstrings' ':(glob)Packages/macOS/*/Sources/**/*.xcstrings' \
              scripts/localization_catalog.py scripts/localization-allowed-omissions.json scripts/localization-plurals.json \
              | tar -x -C "$base_root"
            args+=(--base-root "$base_root")
          fi
          python3 scripts/localization_catalog.py check "${args[@]}"

      - name: cmux-next no new generated files
        if: ${{ !cancelled() }}
        timeout-minutes: 8
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ needs.coalesce.outputs.base != 'unknown' && needs.coalesce.outputs.base || github.event.before }}
        run: |
          base_ref=""
          if [[ "$EVENT_NAME" == pull_request ]]; then
            base_ref="$(git rev-parse HEAD^1)"
          elif [[ "$BEFORE" =~ ^[0-9a-f]{40}$ && ! "$BEFORE" =~ ^0+$ ]] \
            && git fetch --no-tags --depth=1 origin "$BEFORE"; then
            base_ref="$BEFORE"
          fi
          if [[ -z "$base_ref" ]]; then
            echo "::warning::no previous tip to compare with; nothing to check"
            exit 0
          fi
          python3 scripts/ci/generated_files_guard.py check --repo . --base "$base_ref" --head HEAD

  # The generated files guard's own tests and the generated merge audit (every file the guard calls generated merges
  # through the driver its family needs, scripts/cmux-next/generated_merge.py audit). They ran in own-change-checks,
  # which nearly every pull request starts (it reads Packages/ and cmux-tui/crates/), and took about 2 of its 4.5
  # minutes there; their own inputs (the guard's rules, the merge drivers, .gitattributes, generated paths) change in
  # about 3% of pull requests. A pull request that touches none of them skips this job (fast-check-route); the
  # feat-cmux-next push runs it, so a miss is a fix-forward on base.
  generated-merge-audit:
    name: cmux-next generated files merge without a person
    needs: [coalesce, fast-check-route]
    # Tier B, as own-change-checks it came from (scripts/ci/affected-jobs.json pull_request_skip): a pull request into
    # feat-cmux-next skips it unless labeled full-ci; the feat-cmux-next push runs it, and its few misses are fixed forward.
    if: ${{ !cancelled() && needs.coalesce.outputs.run != 'false' && needs.fast-check-route.outputs.generated_merge_audit != 'false' && (github.event_name != 'pull_request' || !startsWith(github.event.pull_request.base.ref, 'feat-cmux-next') || contains(github.event.pull_request.labels.*.name, 'full-ci')) }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && (vars.CI_FORK_LINUX_RUNNER || 'ubuntu-24.04') || 'cmux-linux' }}
    # The checkout's 5, the guard tests' 2 and the audit's 8 (#48930: past 3 min on a busy runner).
    timeout-minutes: 15
    steps:
      # A persistent pool VM keeps the last job's checkout as a git cache. One left sparse (patterns, skip-worktree
      # bits) or with a ref to a missing object makes actions/checkout leave files out or fail (runs 44739498261 and
      # 44733869883, 2026-11-20); remove it so checkout clones fresh. Its manual test: test_ci_reused_sparse_checkout.py.
      - name: Remove a reused workspace left sparse or broken (self-hosted Linux)
        working-directory: ${{ github.workspace }}
        if: runner.os == 'Linux'
        shell: bash
        run: |
          [ "${RUNNER_ENVIRONMENT:-}" = self-hosted ] && [ -e "$GITHUB_WORKSPACE/.git" ] || exit 0
          cd "$GITHUB_WORKSPACE"
          why=""
          if [ "$(git config --get core.sparseCheckout 2>/dev/null)" = true ] || [ -e .git/info/sparse-checkout ]; then
            why="sparse"
          elif git ls-files -v 2>/dev/null | grep -q '^S'; then
            why="skip-worktree entries"
          elif ! git rev-parse --verify -q 'HEAD^{commit}' >/dev/null; then
            why="HEAD does not resolve"
          elif git for-each-ref --format='%(objectname)' 2>/dev/null | git cat-file --batch-check 2>/dev/null | grep -q ' missing$'; then
            why="a ref names a missing object"
          else
            exit 0
          fi
          echo "reused workspace on ${RUNNER_NAME:-this runner}: $why; removing it so checkout starts clean"
          find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +

      - name: Checkout
        timeout-minutes: 5
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          # A pull request's merge commit and its first parent (the base).
          fetch-depth: 2

      - name: The generated files guard's own tests
        if: ${{ !cancelled() }}
        timeout-minutes: 2
        run: python3 tests/test_generated_files_guard.py

      # Every file the guard calls generated merges through the driver its family needs, so no
      # merge leaves a person a generated-file conflict (scripts/cmux-next/generated_merge.py audit).
      - name: Generated files merge without a person
        if: ${{ !cancelled() }}
        timeout-minutes: 8
        run: python3 tests/test_generated_merge.py

  # A red own-change check (the size cap, the crash ratchet) or static check (page strings among them) on a pull
  # request into feat-cmux-next gets the same "red: <check>" comment as a red web check (chief 2026-10-12): ci.yml calls
  # this workflow after `web`; both callers update one comment, recomputed from all check runs of the head commit.
  pr-red-checks:
    needs: [own-change-checks, static-checks]
    if: ${{ always() && !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'feat-cmux-next' }}
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: write
    uses: ./.github/workflows/pr-red-checks-comment.yml
    with:
      own_checks_green: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}

  # The tests of feat-cmux-next's own CI tooling (nightly-next's App ID, the
  # cmux-tui republish path, the crash ratchet, the red-checks comment, the
  # backdrop art generator). Each is stdlib Python with fakes for the network
  # and the binaries it calls; only the web lint hook's test also needs bun.
  tooling-tests:
    # A fork pull request runs on a hosted runner, never on LINUX_RUNNER; others take the persistent cmux-linux pool.
    needs: coalesce
    # Tier A of the merged pull request replay (scripts/ci/affected-jobs.json pull_request_skip): a pull request
    # into feat-cmux-next skips it unless labeled full-ci; the feat-cmux-next push runs it.
    if: ${{ (!cancelled() && needs.coalesce.outputs.run != 'false') && (github.event_name != 'pull_request' || !startsWith(github.event.pull_request.base.ref, 'feat-cmux-next') || contains(github.event.pull_request.labels.*.name, 'full-ci')) }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && (vars.CI_FORK_LINUX_RUNNER || 'ubuntu-24.04') || 'cmux-linux' }}
    timeout-minutes: 15
    steps:
      # A persistent pool VM keeps the last job's checkout as a git cache. One left sparse (patterns, skip-worktree
      # bits) or with a ref to a missing object makes actions/checkout leave files out or fail (runs 44739498261 and
      # 44733869883, 2026-11-20); remove it so checkout clones fresh. Its manual test: test_ci_reused_sparse_checkout.py.
      - name: Remove a reused workspace left sparse or broken (self-hosted Linux)
        id: setup-reused-workspace
        working-directory: ${{ github.workspace }}
        if: runner.os == 'Linux'
        shell: bash
        run: |
          [ "${RUNNER_ENVIRONMENT:-}" = self-hosted ] && [ -e "$GITHUB_WORKSPACE/.git" ] || exit 0
          cd "$GITHUB_WORKSPACE"
          why=""
          if [ "$(git config --get core.sparseCheckout 2>/dev/null)" = true ] || [ -e .git/info/sparse-checkout ]; then
            why="sparse"
          elif git ls-files -v 2>/dev/null | grep -q '^S'; then
            why="skip-worktree entries"
          elif ! git rev-parse --verify -q 'HEAD^{commit}' >/dev/null; then
            why="HEAD does not resolve"
          elif git for-each-ref --format='%(objectname)' 2>/dev/null | git cat-file --batch-check 2>/dev/null | grep -q ' missing$'; then
            why="a ref names a missing object"
          else
            exit 0
          fi
          echo "reused workspace on ${RUNNER_NAME:-this runner}: $why; removing it so checkout starts clean"
          find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          # HEAD^1: a pull request's base for the registry check.
          fetch-depth: 2

      # A self-hosted Linux host reuses its workspace: drop the submodule checkouts a previous job
      # left there (a no-op on Blacksmith, which starts with none).
      - name: Drop stale submodule checkouts (self-hosted reused workspace)
        id: setup-submodules
        run: scripts/ci/reset-stale-submodules.sh

      # Four of these tests and the registry check read workflows with PyYAML. Fleet Linux and Blacksmith images
      # carry it, but a mini's python3 does not (ModuleNotFoundError: yaml on cmux14, 2026-11-03), so the job
      # puts its own copy first on PATH wherever it lands. pytest-xdist runs the two slowest files (the
      # webviews runner's and the web lint hook's tests, about 80 s each, nearly all of it waiting on
      # subprocesses and their timeouts at about 0.2 cores) four tests at a time; every test still runs,
      # each in its own temporary directory.
      - name: Prepare tooling-test Python (PyYAML, pytest-xdist)
        id: setup-python
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/tooling-tests-venv"
          "$RUNNER_TEMP/tooling-tests-venv/bin/python" -m pip install \
            --disable-pip-version-check \
            --no-input \
            PyYAML==6.0.3 \
            pytest==8.3.5 \
            pytest-xdist==3.6.1
          echo "$RUNNER_TEMP/tooling-tests-venv/bin" >> "$GITHUB_PATH"

      # Leo, 2026-11-19: "only meaningful tests ... not just there for ticky tack". Each selectable step below runs only
      # when this pull request's diff reaches a test it runs (scripts/ci/tooling_steps.py). A step of this job, not a
      # router job's: Linux CI is one persistent pool (hq decisions/junctions.md 2026-11-20), so no placement job is
      # left to carry it. Fails open: a failure here leaves tooling_all empty, and every step runs.
      - name: Select the steps this diff reaches (tooling_steps.py)
        id: setup-tooling-route
        if: ${{ github.event_name == 'pull_request' }}
        continue-on-error: true
        timeout-minutes: 2
        run: |
          set -uo pipefail
          git diff --no-renames --name-only HEAD^1 HEAD > "$RUNNER_TEMP/changed.txt"
          if ! python3 scripts/ci/tooling_steps.py route --workflow .github/workflows/cmux-next-guards.yml \
              --job tooling-tests --changed-files "$RUNNER_TEMP/changed.txt" --event pull_request \
              --github-output "$RUNNER_TEMP/tooling.out" --summary "$GITHUB_STEP_SUMMARY"; then
            echo "::warning title=tooling-tests selection::tooling_steps.py failed; tooling-tests runs every step."
            printf 'tooling_all=true\ntooling_steps=\n' > "$RUNNER_TEMP/tooling.out"
          fi
          cat "$RUNNER_TEMP/tooling.out" >> "$GITHUB_OUTPUT"

      - name: nightly-next's App ID and profile through the ASC API
        id: tt-asc-developer-id-app
        if: ${{ success() && (steps.setup-tooling-route.outputs.tooling_all != 'false' || contains(steps.setup-tooling-route.outputs.tooling_steps, ' tt-asc-developer-id-app ')) }}
        run: python3 tests/test_asc_developer_id_app.py

      # Time-bomb row: suites whose fixtures carry calendar dates, with the clock set to 2101. A test
      # that reads the real clock instead of passing its own goes red here, not the day a date passes.
      - name: Fixture-date suites with the clock at 2101 (CMUX_NOW_EPOCH)
        id: tt-fixture-dates-2101
        if: ${{ success() && (steps.setup-tooling-route.outputs.tooling_all != 'false' || contains(steps.setup-tooling-route.outputs.tooling_steps, ' tt-fixture-dates-2101 ')) }}
        env:
          CMUX_NOW_EPOCH: "4133980800"
        run: |
          python3 tests/test_asc_developer_id_app.py
          python3 -m unittest tests/test_lint_feature_flags_scope.py tests/test_lint_feature_flags_review_date.py

      - name: A malformed CMUX_NOW_EPOCH stops each script with one line
        id: tt-cmux-now-epoch
