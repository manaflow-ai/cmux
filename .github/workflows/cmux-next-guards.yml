      - name: The display suite list derives from the suites' display skip traits (display_suites.py)
        id: tt-display-suites
        if: ${{ !cancelled() && (steps.setup-tooling-route.outputs.tooling_all != 'false' || contains(steps.setup-tooling-route.outputs.tooling_steps, ' tt-display-suites ')) }}
        run: |
          python3 scripts/ci/display_suites.py
          python3 tests/test_ci_display_suites.py

      - name: The exact-run SwiftPM test product transport (swiftpm_test_product.py)
        id: tt-swiftpm-test-product
        if: ${{ !cancelled() && (steps.setup-tooling-route.outputs.tooling_all != 'false' || contains(steps.setup-tooling-route.outputs.tooling_steps, ' tt-swiftpm-test-product ')) }}
        run: python3 tests/test_swiftpm_test_product.py

      - name: The String Catalog compile of the CmuxNext test bundles
        id: tt-compile-string-catalogs
        if: ${{ !cancelled() && (steps.setup-tooling-route.outputs.tooling_all != 'false' || contains(steps.setup-tooling-route.outputs.tooling_steps, ' tt-compile-string-catalogs ')) }}
