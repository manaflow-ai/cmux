name: cmux-next guards

# ci.yml skips its guards for feat-cmux-next (cmux-next.yml is that branch's
# CI) and never runs on push, so nothing ran the release and nightly guard
# tests there: tests/test_nightly_cmux_tui_resolve.py stayed red on the branch
# unseen. nightly-next ships from feat-cmux-next, so run the release-notary
# group (nightly, notarization, nightly-next guard and publication tests) for
# its pull requests and pushes. It takes under a minute; there is no path
# filter so a base red shows on the push that caused it.
#
# vt-link-graph also runs the nightly's libghostty-vt notices precondition: a
# ghostty-next gitlink move without a regenerated vt-link-graph.json failed every
# nightly-next build for 9 hours (10-11), and nothing else checked it before the
# nightly.
on:
  pull_request:
    branches: [feat-cmux-next]
  push:
    branches: [feat-cmux-next]

permissions:
  contents: read

concurrency:
  group: cmux-next-guards-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  nightly-guards:
    permissions:
      contents: read
      checks: read
    uses: ./.github/workflows/ci-guards.yml
    with:
      linux_guard_tests: ${{ 'true' }}
      linux_guard_test_groups: '["release-notary"]'
      linux_guard_history: ${{ 'false' }}
      linux_guard_cli: ${{ 'false' }}
      linux_guard_source: ${{ 'false' }}

  vt-link-graph:
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: vt-link-graph.json is for the libghostty-vt gitlink
        run: python3 scripts/cmux-next/notices/check_ghostty_vt_notices.py --check-link-graph scripts/cmux-next/notices/vt-link-graph.json

      # The release-path package step's own data check: package-notices.json's
      # libghostty-vt texts are for the graph's commit (#19508 moved the notices,
      # the graph followed seven hours later) and the pinned texts match.
      - name: package-notices.json covers vt-link-graph.json
        run: python3 cmux-tui/dist/scripts/package_notices.py check-data

  # The CmuxNextApp size cap (code-quality.md SW14) for pull requests into
  # feat-cmux-next and pushes to it. cmux-next.yml's checks job skips pushes to
  # feat-cmux-next and runs on pull requests only for its path filter, so GitHub
  # merges grew the App past the cap. This workflow has no path filter, so the
  # check can be a required one.
  # Only the size cap runs here: the god-file checks stay warn-only. A pull
  # request fails on what it grows (its merge commit's first parent is the
  # base); a push fails on what it grew over the previous tip (event.before), so
  # a push that went around safe-push turns the tip run red.
  app-size:
    name: cmux-next CmuxNextApp size cap
    # A fork pull request runs on a hosted runner, never on LINUX_RUNNER.
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-4vcpu-ubuntu-2404' || vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          # A pull request's merge commit and its first parent (the base).
          fetch-depth: 2

      - name: CmuxNextApp size cap
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          base=()
          if [[ "$EVENT_NAME" == pull_request ]]; then
            base=(--base HEAD^1)
          elif [[ "$BEFORE" =~ ^[0-9a-f]{40}$ && ! "$BEFORE" =~ ^0+$ ]] \
            && git fetch --no-tags --depth=1 origin "$BEFORE"; then
            base=(--base "$BEFORE")
          else
            # No previous tip to compare with: the plain cap check.
            echo "::warning::no previous tip to compare with; checking the plain cap"
          fi
          scripts/cmux-next/check-app-size.sh ${base[@]+"${base[@]}"} "$GITHUB_WORKSPACE"

  # The defaults guard's tests, and schemas/defaults/cmux-next.json matching the
  # action and settings exports, in seconds; cmux-next-defaults-guard.yml judges
  # the changes and the approval.
  defaults-snapshot:
    # A fork pull request runs on a hosted runner, never on LINUX_RUNNER.
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-4vcpu-ubuntu-2404' || vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: The defaults guard judges changes and approvals
        run: python3 tests/test_defaults_guard.py

      - name: The defaults snapshot matches the exports
        run: python3 scripts/ci/defaults_guard.py check-fresh
