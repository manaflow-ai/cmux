name: iOS link FFI on Linux

# RFD 0051 route 2: Swift calls the Rust FFI through the checked-in uniffi binding on Linux.
# rust/scripts/build-linux-ffi.sh builds libcmux_mobile_link_ffi.a, checks that bindgen on it
# reproduces CmuxMobileKit/Sources/CmuxMobileLinkFFI/CmuxMobileLinkFFI.swift, generates the C header
# into the kit's Linux system-library module, and runs CmuxMobileLinkFFILinuxTests (strings,
# records, enums, a Rust error, a Swift callback Rust calls, an async call). The reliability
# projection's scripted transports prove the controller only; this is the linkage receipt.
# The Mac kit job keeps its own coverage of the binding through the xcframework.

on:
  # A feat-cmux-next pull request starts this only through pr-router.yml (scripts/ci/pr_router.json
  # `affects`: the FFI crate, the binding, the kit manifest, these tests, Swift pairing/remote-view/
  # terminal-projection sources, the script, this file). This is the required cross-commit receipt:
  # both skew directions must link and complete the daemon identify handshake.
  workflow_call:
    inputs:
      head:
        type: string
        default: ''
      linkage:
        type: boolean
        default: true
      pair_skew:
        type: boolean
        default: true
  push:
    branches: [feat-cmux-next]
    paths:
      - cmux-next-ios/rust/**
      - cmux-tui/crates/**
      - cmux-next-ios/CmuxMobileKit/Package.swift
      - cmux-next-ios/CmuxMobileKit/Sources/CmuxMobileLinkFFI/**
      - cmux-next-ios/CmuxMobileKit/Sources/CmuxMobileLinkFFIFFILinux/**
      - cmux-next-ios/CmuxMobileKit/Tests/CmuxMobileLinkFFILinuxTests/**
      - .github/workflows/ios-link-ffi-linux.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ios-link-ffi-linux-${{ inputs.head || github.ref }}-${{ toJSON(inputs.linkage) == 'false' && 'skew' || 'linkage' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linkage:
    name: Swift to Rust FFI on Linux
    if: ${{ toJSON(inputs.linkage) != 'false' }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || 'cmux-linux' }}
    timeout-minutes: 40
    container: public.ecr.aws/docker/library/swift:6.2-noble@sha256:d6f8f6112e9a63da0a4a151d6b93acd16699d35c0b82531ac1a245f5af210197
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: never
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install build tools
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends ca-certificates curl build-essential pkg-config libssl-dev python3
          # rust-toolchain.toml pins the version; rustup installs it on first cargo call.
          curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Build the library and run the Linux linkage tests
        working-directory: cmux-next-ios/rust
        run: ./scripts/build-linux-ffi.sh

  # Phone vs Mac skew (scripts/ci/mobile-pair-skew.sh): this head's iPhone link dials the Mac
  # host the published NEXT nightly was built from, over every transport, and the daemon
  # channel must answer. Leo, 11-27: "i mean we cant connect to phone anyways right now lol".
  pair-skew:
    name: phone and Mac supported shipped window
    if: ${{ toJSON(inputs.pair_skew) != 'false' }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || 'cmux-linux' }}
    timeout-minutes: 40
    container: public.ecr.aws/docker/library/swift:6.2-noble@sha256:d6f8f6112e9a63da0a4a151d6b93acd16699d35c0b82531ac1a245f5af210197
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: never
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Begin full gate timing
        run: echo "PAIR_GATE_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          # A dispatch uses resolve's PR head, never the workflow's base SHA.
          ref: ${{ inputs.head || github.sha }}

      - name: Install build tools
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends ca-certificates curl build-essential pkg-config libssl-dev python3 git
          curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Resolve the last three published builds of each app
        id: shipped
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/ci/mobile_pair_shipped_window.py refresh --registry scripts/ci/mobile_pair_shipped_window.json --count 3 --output "$RUNNER_TEMP/pair-shipped.json"
          python3 scripts/ci/mobile_pair_shipped_window.py resolve --registry "$RUNNER_TEMP/pair-shipped.json" --count 3 --github-output "$GITHUB_OUTPUT" > "$RUNNER_TEMP/pair-window.json"

      - name: Restore immutable shipped-source binaries
        id: binaries
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/pair-binaries
          key: phone-pair-binaries-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.shipped.outputs.fingerprint }}-${{ hashFiles('cmux-next-ios/rust/rust-toolchain.toml') }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: cmux-next-ios/rust -> ${{ runner.temp }}/pair-skew-target
          shared-key: phone-pair-skew-v1
          cache-bin: false

      # Serial source pairs reuse the PR's two executables and the dependency target.
      # The immutable binary cache builds each shipped source/role at most once per window.
      - name: Dial both directions across the supported shipped window
        env:
          SKEW_LOG_DIR: ${{ runner.temp }}/pair-skew-logs
          SKEW_BINARY_CACHE_DIR: ${{ runner.temp }}/pair-binaries
          CARGO_TARGET_DIR: ${{ runner.temp }}/pair-skew-target
        run: |
          git config --global --add safe.directory '*'
          mkdir -p "$CARGO_TARGET_DIR" "$SKEW_LOG_DIR"
          cp "$RUNNER_TEMP/pair-window.json" "$SKEW_LOG_DIR/window.json"
          python3 scripts/ci/mobile_pair_matrix.py "$RUNNER_TEMP/pair-window.json"

      - name: Cache the verified immutable binaries
        if: ${{ success() && steps.binaries.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/pair-binaries
          key: ${{ steps.binaries.outputs.cache-primary-key }}

      - name: Record full gate wall time
        if: always()
        env:
          SKEW_LOG_DIR: ${{ runner.temp }}/pair-skew-logs
        run: |
          mkdir -p "$SKEW_LOG_DIR"
          python3 - <<'PY'
          import json, os, pathlib, time
          pathlib.Path(os.environ["SKEW_LOG_DIR"], "gate-cost.json").write_text(json.dumps({
              "wall_seconds": time.time() - float(os.environ["PAIR_GATE_START"]),
              "scope": "job steps: checkout, tool installation, publication discovery, cache and pair matrix; excludes runner provisioning",
          }) + "\n")
          PY

      - name: Upload the pair logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pair-skew-logs
          path: ${{ runner.temp }}/pair-skew-logs
          if-no-files-found: ignore
