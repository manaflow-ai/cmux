name: iOS link FFI on Linux

# RFD 0051 route 2: Swift calls the Rust FFI through the checked-in uniffi binding on Linux.
# rust/scripts/build-linux-ffi.sh builds libcmux_mobile_link_ffi.a, checks that bindgen on it
# reproduces CmuxMobileKit/Sources/CmuxMobileLinkFFI/CmuxMobileLinkFFI.swift, generates the C header
# into the kit's Linux system-library module, and runs CmuxMobileLinkFFILinuxTests (strings,
# records, enums, a Rust error, a Swift callback Rust calls, an async call). The reliability
# projection's scripted transports prove the controller only; this is the linkage receipt.
# The Mac kit job keeps its own coverage of the binding through the xcframework.

on:
  # A feat-cmux-next pull request starts this only through pr-router.yml (scripts/ci/pr_router.json
  # `affects`: the FFI crate, the binding, the kit manifest, these tests, the script, this file).
  workflow_call:
  push:
    branches: [feat-cmux-next]
    paths:
      - cmux-next-ios/rust/**
      - cmux-tui/crates/**
      - cmux-next-ios/CmuxMobileKit/Package.swift
      - cmux-next-ios/CmuxMobileKit/Sources/CmuxMobileLinkFFI/**
      - cmux-next-ios/CmuxMobileKit/Sources/CmuxMobileLinkFFIFFILinux/**
      - cmux-next-ios/CmuxMobileKit/Tests/CmuxMobileLinkFFILinuxTests/**
      - .github/workflows/ios-link-ffi-linux.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-link-ffi-linux-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linkage:
    name: Swift to Rust FFI on Linux
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || 'cmux-linux' }}
    timeout-minutes: 40
    container: public.ecr.aws/docker/library/swift:6.2-noble@sha256:d6f8f6112e9a63da0a4a151d6b93acd16699d35c0b82531ac1a245f5af210197
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: never
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install build tools
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends ca-certificates curl build-essential pkg-config libssl-dev python3
          # rust-toolchain.toml pins the version; rustup installs it on first cargo call.
          curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Build the library and run the Linux linkage tests
        working-directory: cmux-next-ios/rust
        run: ./scripts/build-linux-ffi.sh

  # Phone vs Mac skew (scripts/ci/mobile-pair-skew.sh): this head's iPhone link dials the Mac
  # host the published NEXT nightly was built from, over every transport, and the daemon
  # channel must answer. Leo, 11-27: "i mean we cant connect to phone anyways right now lol".
  pair-skew:
    # Phone x Mac version matrix past identify, against a real cmux-tui daemon (scripts/ci/mobile-pair-skew.sh):
    # phone {N-1, N} x Mac {N-1, N}, fresh and carried (a Mac upgraded or downgraded under a paired phone), over
    # webrtc, WireGuard, TURN only and the WSS relay, each held 60 s under typing, plus loss and a week-old FAR row.
    # Leo, 11-27: "well clearly we need to be able to support the multiple versions as it goes".
    # It builds cmux-tui three times, so it runs on feat-cmux-next pushes and by hand, not per PR.
    name: iPhone link vs NIGHTLY Mac host
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || 'cmux-linux' }}
    timeout-minutes: 120
    container: public.ecr.aws/docker/library/swift:6.2-noble@sha256:d6f8f6112e9a63da0a4a151d6b93acd16699d35c0b82531ac1a245f5af210197
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: never
      CARGO_INCREMENTAL: "0"
      CMUX_GHOSTTY_VT_ZIG_CPU: baseline
      # N-1: the commit TestFlight 1cd1537001 (and Leo's NIGHTLY Mac) shipped from; bump with each TestFlight.
      SKEW_N1_SHA: 1cd1537001bb87a5d692e1ff44ba5e5c64ff9ae6
      # FAR: a week-old build (2026-11-20).
      SKEW_FAR_SHA: 67ddfde57e50cbe6b2c6554435f5e7584e26ea74
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install build tools
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends ca-certificates curl build-essential pkg-config libssl-dev python3 git clang libclang-dev xz-utils
          curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Checkout N-1
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ env.SKEW_N1_SHA }}
          path: .skew-n1
          persist-credentials: false

      - name: Checkout FAR
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ env.SKEW_FAR_SHA }}
          path: .skew-far
          persist-credentials: false

      - name: Ghostty submodules (cmux-tui builds libghostty-vt from them)
        run: |
          git config --global --add safe.directory '*'
          for tree in . .skew-n1 .skew-far; do git -C "$tree" submodule update --init --depth 1 ghostty-next; done

      - name: Resolve Ghostty Zig version
        id: ghostty-zig-version
        env:
          GHOSTTY_ZIG_SOURCE: ghostty-next
        run: echo "version=$(bash ./scripts/ghostty-zig-version.sh)" >> "$GITHUB_OUTPUT"

      - name: Set up Zig for Ghostty
        uses: mlugg/setup-zig@8d6198c65fb0feaa111df26e6b467fea8345e46f # v2.0.5
        with:
          version: ${{ steps.ghostty-zig-version.outputs.version }}
          use-cache: false

      - name: Phone x Mac matrix
        # Report-only until the link holds (Leo's NIGHTLY: WireGuard dying every 2-43 s); then drop this line.
        continue-on-error: true
        env:
          SKEW_LOG_DIR: ${{ runner.temp }}/pair-skew-logs
          SKEW_SUMMARY: ${{ github.step_summary }}
        run: scripts/ci/mobile-pair-skew.sh .skew-n1 . .skew-far

      - name: Upload the pair logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pair-skew-logs
          path: ${{ runner.temp }}/pair-skew-logs
          if-no-files-found: ignore
