name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

# Do not inherit repository-level token scopes. The job grants only the
# read permissions and OIDC exchange it needs.
permissions: {}

concurrency:
  # Cancel webhook retries by immutable comment or review ID. GitHub issue
  # events do not expose a delivery ID, so keep each issue event independent
  # rather than risking cancellation of a legitimate request.
  group: claude-${{ github.repository }}-${{ github.event.comment.id || github.event.review.id || github.run_id }}
  cancel-in-progress: true

env:
  # Temporary REST budget attribution: one gh-call line per GitHub API call (scripts/ci/api_call_log/env.sh, fetched at a fixed commit when the checkout has no copy).
  BASH_ENV: '$({ w="${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh"; t="${RUNNER_TEMP:-/nonexistent}/api-call-log-src"; if [ -f "$w" ]; then echo "$w"; elif [ -n "${RUNNER_TEMP:-}" ]; then if [ ! -f "$t/env.sh" ] && [ ! -e "$t.tried" ] && { [ "${RUNNER_OS:-}" = Linux ] || [ "${RUNNER_OS:-}" = macOS ]; } && [ "$(date -u +%Y%m%d%H)" -lt 2026112300 ]; then : > "$t.tried"; mkdir -p "$t.part" && for x in env.sh gh sitecustomize.py isolated.py; do curl -fsSL --max-time 5 -o "$t.part/$x" "https://raw.githubusercontent.com/manaflow-ai/cmux/27647ffd3ae838c63be28ca3e5883dcd68c34518/scripts/ci/api_call_log/$x" || break; done; [ -s "$t.part/isolated.py" ] && mv "$t.part" "$t"; fi; if [ -f "$t/env.sh" ]; then echo "$t/env.sh"; else echo unset BASH_ENV > "$t.off.sh" && echo "$t.off.sh"; fi; fi; } 2>/dev/null)'

jobs:
  claude:
    name: Claude request
    # Webhook events cannot filter on comment text. Admit only human-authored
    # mentions so bot chatter never reaches the secret-bearing action.
    if: |
      (github.event_name == 'issue_comment' && github.event.comment.user.type == 'User' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && github.event.comment.user.type == 'User' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && github.event.review.user.type == 'User' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && github.event.issue.user.type == 'User' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    # Anyone can write @claude, and the job starts before the action checks
    # write access, so no runner variable may pick the machine.
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || 'cmux-gcp-secret-jit-x64' }} # ephemeral-required: any commenter can start it
    timeout-minutes: 15
    # The workflow-level group only deduplicates webhook retries by event ID.
    # The pinned action checks repository write access before it invokes Claude.
    permissions:
      contents: read # Read the checked-out base and PR files.
      pull-requests: read # Read PR metadata and review requests.
      issues: read # Read issue comments and issue-trigger payloads.
      id-token: write # Exchange a short-lived token for the scoped GitHub App token.
      actions: read # Read CI results on pull requests.
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # Review events otherwise default to the PR merge ref. Pin the
          # workspace to the immutable base commit before the secret-bearing
          # action runs. The action fetches the PR only after its actor check
          # and restores protected configuration paths from the base.
          # Keep the checkout credential for that authenticated fetch; the
          # action removes it before Claude starts.
          ref: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: true

      # The pool action lives on main; a base checkout (e.g. feat-cmux-next) may not carry it.
      - name: Checkout the Claude login pool action
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.workflow_sha }}
          path: .claude-pool
          sparse-checkout: .github/actions/claude-pool
          persist-credentials: false
      - name: Reach the Claude login pool
        id: pool
        continue-on-error: true
        timeout-minutes: 3
        uses: ./.claude-pool/.github/actions/claude-pool
        with:
          oauth-client-id: ${{ vars.TS_CI_OIDC_CLIENT_ID }}
          audience: ${{ vars.TS_CI_OIDC_AUDIENCE }}
      - name: Keep the pool checkout out of Claude's commits
        run: echo /.claude-pool/ >> .git/info/exclude

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@781d62e9d5fbd78b24dcdfd42858332d485fe462 # v1.0.212
        with:
          # Through the pool when it answers (the gateway ignores the key); else the shared token.
          claude_code_oauth_token: ${{ steps.pool.outputs.base-url == '' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          anthropic_api_key: ${{ steps.pool.outputs.base-url != '' && 'subrouter2' || '' }}
          settings: ${{ steps.pool.outputs.base-url != '' && format('{{"env":{{"ANTHROPIC_BASE_URL":"{0}"}}}}', steps.pool.outputs.base-url) || '' }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Optional: Give a custom prompt to Claude. If this is not specified, Claude will perform the instructions specified in the comment that tagged it.
          # prompt: 'Update the pull request description to include a summary of changes.'

          # Optional: Add claude_args to customize behavior and configuration
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
          # claude_args: '--allowed-tools Bash(gh pr:*)'
