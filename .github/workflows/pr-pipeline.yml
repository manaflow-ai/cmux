name: pr pipeline

# The PR pipeline (the CI v2 design, "One step table"): a pull request's checks are steps of
# ci/steps.toml, run by `ci/run` in a few jobs, not a workflow, a runner and a checkout apiece. This is
# the `linux` job: one machine, one checkout of the merge commit, and every `linux` step the change
# routes, side by side. Each step's output is one log group, a failed step is one annotation, and the
# summary lists every step with its seconds.
#
# pr-router.yml starts it, and only when the change routes a step (scripts/ci/pr_router.json
# `table_jobs`): a pull request that touches no step's inputs costs no runner here.
#
# Adding a check: add a step to ci/steps.toml. No new workflow, no router edit.
on:
  workflow_call:
    inputs:
      # The table's jobs the change routes, a JSON list (pr-router.yml's `table` output). Empty: every job runs
      # its routed steps (a job with none routed prints so and passes).
      jobs:
        required: false
        type: string
        default: ""
    # The ios fast verdict, for pr-router.yml's ios-fast-status (the `cmux/ios-fast` commit status): whether its plan
    # builds anything, its summary, and the ios-fast job's result (empty when it never finished).
    outputs:
      ios_fast_run:
        value: ${{ jobs.ios-fast-runner.outputs.run }}
      ios_fast_summary:
        value: ${{ jobs.ios-fast-runner.outputs.summary }}
      ios_fast_verdict:
        value: ${{ jobs.ios-fast.outputs.verdict }}
    secrets:
      # The org's manaflow-glaeda-route App key (read-only on runners), for the ios-runner job's live read of the
      # owned simulator Macs. Optional: without it the picker reads with the run's token.
      GLAEDA_ROUTE_APP_KEY:
        required: false
      # The cmux-bot App key (read-only on runners), for the even-run pool and queue reads. Optional: the picker
      # falls back to the repository routing token when it is unavailable.
      CMUX_BOT_APP_KEY:
        required: false

permissions: {}

env:
  # Temporary REST budget attribution: one gh-call line per GitHub API call (scripts/ci/api_call_log/env.sh, fetched at a fixed commit when the checkout has no copy).
  BASH_ENV: '$({ w="${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh"; t="${RUNNER_TEMP:-/nonexistent}/api-call-log-src"; if [ -f "$w" ]; then echo "$w"; elif [ -n "${RUNNER_TEMP:-}" ]; then if [ ! -f "$t/env.sh" ] && [ ! -e "$t.tried" ] && { [ "${RUNNER_OS:-}" = Linux ] || [ "${RUNNER_OS:-}" = macOS ]; } && [ "$(date -u +%Y%m%d%H)" -lt 2026112300 ]; then : > "$t.tried"; mkdir -p "$t.part" && for x in env.sh gh sitecustomize.py isolated.py; do curl -fsSL --max-time 5 -o "$t.part/$x" "https://raw.githubusercontent.com/manaflow-ai/cmux/27647ffd3ae838c63be28ca3e5883dcd68c34518/scripts/ci/api_call_log/$x" || break; done; [ -s "$t.part/isolated.py" ] && mv "$t.part" "$t"; fi; if [ -f "$t/env.sh" ]; then echo "$t/env.sh"; else echo unset BASH_ENV > "$t.off.sh" && echo "$t.off.sh"; fi; fi; } 2>/dev/null)'

jobs:
  linux:
    name: linux
    # The land tier (#54886's condition, tests/test_head_tier.py land_tier_condition): a ready head into feat-cmux-next
    # runs this job only once it is handed to land (`ready-to-land` or `full-ci`), not on every push; then the label guard.
    # Leo, 2026-11-23: "de facto, im asking for 99% fewer minutes of ci time, period."
    if: ${{ (inputs.jobs == '' || contains(fromJSON(inputs.jobs), 'linux')) && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci') || (github.event.pull_request.draft == true && (vars.CI_DRAFT_CHEAP_TIER || '1') == '0') || (github.event.pull_request.draft != true && (contains(github.event.pull_request.labels.*.name, 'ready-to-land') || github.event.pull_request.base.ref != 'feat-cmux-next' || github.event.pull_request.head.repo.full_name != github.repository || (vars.CI_LAND_TIER || '1') == '0'))) && !(github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'feat-cmux-next' && (github.event.action == 'labeled' || github.event.action == 'unlabeled') && !contains(fromJSON('["full-ci","ready-to-land"]'), github.event.label.name)) }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-4vcpu-ubuntu-2404' || vars.CI_OVERFLOW_LINUX || 'cmux-linux' }}
    # Above setup (10 min), the tool downloads (3 min), the waves of the slowest step (6 min; steps two at
    # once on 2 CPUs) and the `alone` steps (ci-artifact-worker, web-production-build, the package conventions gate
    # and the four web test shards 6 min each, the cmux_next_ daemon tests 65 min, the iOS matrix protocol 45 min,
    # the App Store shelf 45 min, the acpmux instruction counts 40 min, the compile canary 30 min, the cmux VM Rust
    # clients 30 min, the nightly and cmux-tui release guards 20 min, the cmux cloud CLI 15 min): 471 min with
    # 41 shared steps (21 waves), plus room for the checkout, so a slow step is reported by the runner, not cut here.
    timeout-minutes: 488
    permissions:
      contents: read
      # ci/run's step-result store (gh-events.cmux.com/github/step-results): the runner pool is off the tailnet.
      id-token: write
      # The base's verdict of cmux-next-guards.yml's tooling-tests job (the tooling-tests-base-red step below).
      actions: read
    outputs:
      # A step that needs a Mac after all (the Swift canary with no build fleet pass) names itself here.
      mac_fallback: ${{ steps.run.outputs.mac_fallback }}
      canary_targets: ${{ steps.run.outputs.canary_targets }}
    steps:
      - name: Checkout the merge commit and the base tip
        if: ${{ !startsWith(runner.name, 'cmux-runner-pool-') }}
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: "Pool mirror: checkout the merge commit and the base tip"
        if: ${{ startsWith(runner.name, 'cmux-runner-pool-') }}
        env:
          SHA: ${{ github.sha }}
          TOKEN: ${{ github.token }}
        # As cmux-next-guards.yml: a pool VM fetches the two commits on top of its local git mirror. actions/checkout
        # over the network held pool jobs 10-22 min on 2026-11-25 (jobs 139566604071, 139582651582) until the runner
        # was lost, a red with no log.
        run: |
          set -euo pipefail
          mirror=/var/lib/cmux-git/cmux.git/objects
          [[ -d "$mirror" ]] || { echo "::error::no git mirror at $mirror on this pool VM"; exit 1; }
          cd "$GITHUB_WORKSPACE"
          find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          git init -q .
          echo "$mirror" > .git/objects/info/alternates
          git config gc.auto 0
          git remote add origin "https://github.com/$GITHUB_REPOSITORY"
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" \
            git fetch --no-tags --no-recurse-submodules --depth=2 origin "+$SHA:refs/remotes/origin/checkout"
          git checkout -q --detach "$SHA"
          echo "checked out $(git rev-parse HEAD) from the pool mirror"
      - name: List the changed paths
        # Every path the merge commit changes against the base tip, both sides of a rename (what the
        # router read). With no merge commit there is no list, and ci/run then runs every step.
        run: |
          if git rev-parse -q --verify 'HEAD^2' >/dev/null; then
            git diff --name-only --no-renames -z 'HEAD^1' HEAD > "$RUNNER_TEMP/changed-paths.txt"
            echo "PATHS_FILE=$RUNNER_TEMP/changed-paths.txt" >> "$GITHUB_ENV"
            tr -cd '\0' < "$RUNNER_TEMP/changed-paths.txt" | wc -c
          else
            echo "::notice::No merge commit to diff: every linux step runs."
          fi
      # cmux-next-guards.yml's tooling-tests-base-red job, carried over with the tooling-tests steps (Leo,
      # 2026-11-23: "we're drowning in our own workflow"): while that job is red on feat-cmux-next, a pull request
      # does not run tooling-tests-1..5, as it does not run the job (scripts/ci/base_red_skip.py: fails open, 10% of
      # skips still run as the audit, label full-ci runs them, vars.CI_SKIP_WHILE_BASE_RED == '0' turns it off). The
      # steps are left out of the run rather than passed, so no skip is stored as a pass under their inputs.
      - name: Tooling tests red on the base right now?
        id: tooling-tests-base-red
        if: ${{ github.event_name == 'pull_request' && format('{0}', vars.CI_SKIP_WHILE_BASE_RED) != '0' && !contains(github.event.pull_request.labels.*.name, 'full-ci') }}
        continue-on-error: true
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I scripts/ci/base_red_skip.py decide --workflow cmux-next-guards.yml --job "tooling-tests" >> "$GITHUB_OUTPUT"
      - name: Run the routed linux steps (ci/steps.toml)
        id: run
        # Leo, 2026-11-21: "de facto, im asking for 99% fewer minutes of ci time, period." --pr-scope runs the steps
        # the change reaches through an input that names their files; a step it reaches only through a whole-directory
        # input (`web/**`, `cmux-tui/**`) or the pipeline's own files runs in the post-merge batch, every linux step at
        # the merged tip (cmux-next-pr-pipeline-linux-batch.yml, whose judge bisects a new red).
        # vars.CI_PR_PIPELINE_LINUX_PR_SCOPE=0 runs the whole route on the pull request again.
        env:
          CI_PR_PIPELINE_LINUX_PR_SCOPE: ${{ github.event_name == 'pull_request' && (vars.CI_PR_PIPELINE_LINUX_PR_SCOPE || '1') || '0' }}
          # tooling-tests-1..5 leave a step only a wide reach selects to the post-merge batch, as the job does.
          CI_TOOLING_TESTS_PR_SCOPE: ${{ vars.CI_TOOLING_TESTS_PR_SCOPE || '1' }}
          TOOLING_TESTS_BASE_RED: ${{ steps.tooling-tests-base-red.outputs.base_red }}
        run: |
          scope=()
          [ "${CI_PR_PIPELINE_LINUX_PR_SCOPE:-0}" = 1 ] && scope=(--pr-scope)
          # The routed linux steps less tooling-tests-N; a route that cannot be read runs every step (fails open).
          only=""
          if [ "${TOOLING_TESTS_BASE_RED:-}" = true ] && only="$(ci/run route ${PATHS_FILE:+--paths-file "$PATHS_FILE"} "${scope[@]}" \
              | python3 -I -c 'import json, re, sys
          print(" ".join(n for n in json.load(sys.stdin).get("linux", []) if not re.fullmatch(r"tooling-tests-\d+", n)))')"; then
            if [ -z "$only" ]; then
              echo "No linux step is routed but tooling-tests-1..5, which the base's red skips."
              exit 0
            fi
          fi
          ci/run run --job linux ${PATHS_FILE:+--paths-file "$PATHS_FILE"} ${only:+--only "$only"} "${scope[@]}"
      # A type check (the `web-typecheck` step) whose every error had one safe language-service fix, and passed with
      # them: the patch fixit_compile.py wrote to $RUNNER_TEMP/fixit-compile, for the cmuxterm-hq fixit-compile
      # reconciler (tools/ci-oops/fixit_push.py, which reads a run's `fixit-compile-*` artifacts) to push onto a
      # lane/* branch as a fixup commit (ci-oops 0a). No patch, no artifact.
      - name: Upload the fixit-compile patch
        if: ${{ failure() && !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fixit-compile-${{ github.job }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fixit-compile
          if-no-files-found: ignore
          retention-days: 3
      # A failed web test shard's JUnit report (the `web-tests-N` steps keep it only on failure), under the name
      # ci-web.yml's `Web tests (N/4)` job used, which scripts/ci/web_test_failure_census.py reads. No report, no artifact.
      - name: Upload the web test JUnit report (shard 1)
        if: ${{ failure() && !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-test-junit-shard1-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/web-test-junit/shard1/junit.xml
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload the web test JUnit report (shard 2)
        if: ${{ failure() && !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-test-junit-shard2-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/web-test-junit/shard2/junit.xml
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload the web test JUnit report (shard 3)
        if: ${{ failure() && !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-test-junit-shard3-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/web-test-junit/shard3/junit.xml
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload the web test JUnit report (shard 4)
        if: ${{ failure() && !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-test-junit-shard4-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/web-test-junit/shard4/junit.xml
          if-no-files-found: ignore
          retention-days: 7

  # The `web-browser` job: the browser suites (Playwright and real Chrome), on their own warm Linux VM so a
  # webview change never waits behind the linux job's guards, and a change that routes no browser step starts no
  # runner here. Each step installs the browser engines it launches (`playwright install --with-deps`, apt through
  # sudo, which the pool's runners grant as they did for ci-web.yml's jobs).
  web-browser:
    name: web-browser
    # The land tier (#54886's condition, tests/test_head_tier.py land_tier_condition): a ready head into feat-cmux-next
    # runs this job only once it is handed to land (`ready-to-land` or `full-ci`), not on every push; then the label guard.
    # Leo, 2026-11-23: "de facto, im asking for 99% fewer minutes of ci time, period."
    if: ${{ (inputs.jobs == '' || contains(fromJSON(inputs.jobs), 'web-browser')) && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci') || (github.event.pull_request.draft == true && (vars.CI_DRAFT_CHEAP_TIER || '1') == '0') || (github.event.pull_request.draft != true && (contains(github.event.pull_request.labels.*.name, 'ready-to-land') || github.event.pull_request.base.ref != 'feat-cmux-next' || github.event.pull_request.head.repo.full_name != github.repository || (vars.CI_LAND_TIER || '1') == '0'))) && !(github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'feat-cmux-next' && (github.event.action == 'labeled' || github.event.action == 'unlabeled') && !contains(fromJSON('["full-ci","ready-to-land"]'), github.event.label.name)) }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-4vcpu-ubuntu-2404' || vars.CI_OVERFLOW_LINUX || 'cmux-linux' }}
    # Setup (10 min), the tool downloads (3 min), the web-browser steps two at once, each wave as long as its slowest
    # step, then each `alone` step (tests/test_ci_step_table.py holds this).
    timeout-minutes: 88
    permissions:
      contents: read
      # pr_receipt.py's lookup: an earlier run's green receipt artifact for these inputs.
      actions: read
      # ci/run's step-result store (gh-events.cmux.com/github/step-results): the runner pool is off the tailnet.
      id-token: write
    steps:
      - name: Checkout the merge commit and the base tip
        if: ${{ !startsWith(runner.name, 'cmux-runner-pool-') }}
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: "Pool mirror: checkout the merge commit and the base tip"
        if: ${{ startsWith(runner.name, 'cmux-runner-pool-') }}
        env:
          SHA: ${{ github.sha }}
          TOKEN: ${{ github.token }}
        # As cmux-next-guards.yml: a pool VM fetches the two commits on top of its local git mirror. actions/checkout
        # over the network held pool jobs 10-22 min on 2026-11-25 (jobs 139566604071, 139582651582) until the runner
        # was lost, a red with no log.
        run: |
          set -euo pipefail
          mirror=/var/lib/cmux-git/cmux.git/objects
          [[ -d "$mirror" ]] || { echo "::error::no git mirror at $mirror on this pool VM"; exit 1; }
          cd "$GITHUB_WORKSPACE"
          find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          git init -q .
          echo "$mirror" > .git/objects/info/alternates
          git config gc.auto 0
          git remote add origin "https://github.com/$GITHUB_REPOSITORY"
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" \
            git fetch --no-tags --no-recurse-submodules --depth=2 origin "+$SHA:refs/remotes/origin/checkout"
          git checkout -q --detach "$SHA"
          echo "checked out $(git rev-parse HEAD) from the pool mirror"
      - name: List the changed paths
        run: |
          if git rev-parse -q --verify 'HEAD^2' >/dev/null; then
            git diff --name-only --no-renames -z 'HEAD^1' HEAD > "$RUNNER_TEMP/changed-paths.txt"
            echo "PATHS_FILE=$RUNNER_TEMP/changed-paths.txt" >> "$GITHUB_ENV"
            tr -cd '\0' < "$RUNNER_TEMP/changed-paths.txt" | wc -c
          else
            echo "::notice::No merge commit to diff: every web-browser step runs."
          fi
      # A green receipt (scripts/ci/pr_receipt.py): an earlier run of this pull request's branch or of its base passed
      # these same inputs (the web-browser steps' inputs, the change's diff in them and the table, runner and workflow),
      # so the steps report that pass, its run linked here, and do not run again. 825 job-minutes in two days
      # (11-23..24) were this job on inputs it had already passed. A fork, the full-ci label or no merge commit asks
      # for nothing; full-ci still records. Any error is a miss, and the steps run.
      - name: Look up a green receipt for these inputs (pr_receipt.py)
        id: receipt
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && env.PATHS_FILE != '' }}
        continue-on-error: true
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          CI_PR_RECEIPTS: ${{ vars.CI_PR_RECEIPTS }}
          FULL_CI: ${{ contains(github.event.pull_request.labels.*.name, 'full-ci') }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          find=(); [ "$FULL_CI" = true ] && find=(--no-find)
          python3 -I scripts/ci/pr_receipt.py lookup --check web-browser --branch "$HEAD_REF" --branch "$BASE_REF" \
            "${find[@]}" --output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"
      # The agent-pane-real-acpmux step builds acpmux on an ephemeral runner: with no cargo cache it compiled ~470
      # crates from scratch and could pass its 1800 s budget (job 138744570179, 2026-11-24). Restore the dependency
      # build agent-pane-acpmux-cache.yml saves from feat-cmux-next, only when that step is routed. Never saves here
      # (a pull request's save is a per-ref copy no other pull request can read, #54905).
      - name: Does the change route the agent pane's acpmux build?
        id: acpmux
        run: |
          # The step's own finer router reads one path a line (ci/run's $CI_PATHS_FILE); PATHS_FILE is NUL-separated.
          lines=""
          if [ -n "${PATHS_FILE:-}" ]; then lines="$RUNNER_TEMP/changed-paths-lines.txt"; tr '\0' '\n' < "$PATHS_FILE" > "$lines"; fi
          if ci/run route ${PATHS_FILE:+--paths-file "$PATHS_FILE"} \
              | python3 -c 'import json,sys; sys.exit(0 if "agent-pane-real-acpmux" in json.load(sys.stdin).get("web-browser", []) else 1)' \
            && CI_PATHS_FILE="$lines" python3 -I scripts/ci/web_subareas.py has agent_pane; then
            echo "routed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Restore the agent pane's acpmux cargo build
        if: ${{ steps.acpmux.outputs.routed == 'true' }}
        continue-on-error: true
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Why: docs/ci/cmux-next-workflow-notes.md#note-210 (pool runners keep different leftover toolchains)
          add-rust-environment-hash-key: false
          cache-bin: false
          shared-key: agent-pane-real-acpmux
          save-if: false
          workspaces: cmux-tui -> target
      - name: Run the routed web-browser steps (ci/steps.toml)
        if: ${{ steps.receipt.outputs.run == '' }}
        # The react-apps-check step asks scripts/ci/react_apps_fleet.py, as ci-web.yml's shard pick does, with these.
        env:
          CI_PR_BASE_REF: ${{ github.base_ref }}
          CI_FULL_CI: ${{ contains(github.event.pull_request.labels.*.name, 'full-ci') }}
          CI_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CI_REACT_APPS_FLEET: ${{ vars.CI_REACT_APPS_FLEET || '1' }}
          CI_REACT_APPS_FLEET_AUDIT: ${{ vars.CI_REACT_APPS_FLEET_AUDIT || '16' }}
          CI_WEBVIEWS_FULL_TO_BATCH: ${{ vars.CI_WEBVIEWS_FULL_TO_BATCH || '1' }}
          CI_WEBVIEWS_PUSH_CLASSES: ${{ vars.CI_WEBVIEWS_PUSH_CLASSES || '1' }}
          CI_WEBVIEWS_CI_EDIT_SAMPLE: ${{ vars.CI_WEBVIEWS_CI_EDIT_SAMPLE || '1' }}
          CI_WEBVIEWS_NARROW_SELECTION: ${{ vars.CI_WEBVIEWS_NARROW_SELECTION || '1' }}
        run: ci/run run --job web-browser ${PATHS_FILE:+--paths-file "$PATHS_FILE"}
      - name: Write the green receipt for later heads (pr_receipt.py)
        id: record
        if: ${{ success() && steps.receipt.outputs.key != '' && steps.receipt.outputs.run == '' }}
        env:
          KEY: ${{ steps.receipt.outputs.key }}
        run: python3 -I scripts/ci/pr_receipt.py record --check web-browser --key "$KEY" --out "$RUNNER_TEMP/pr-receipt/receipt.json"
      - name: Upload the green receipt
        if: ${{ success() && steps.record.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-receipt-web-browser-${{ steps.receipt.outputs.key }}
          path: ${{ runner.temp }}/pr-receipt/receipt.json
          if-no-files-found: ignore
          retention-days: 7
      # The real-daemon pane checks' measurements (the agent-pane-real-acpmux step writes $RUNNER_TEMP/agent-pane-real-acpmux).
      - name: Upload the agent pane measurements
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-pane-real-acpmux-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/agent-pane-real-acpmux
          if-no-files-found: ignore
          retention-days: 3
      # The react-apps-check step's pick, lane logs and test results (scripts/ci/react-apps-check-fleet.sh).
      - name: Upload the react-apps-check logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: react-apps-check-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/react-apps-check
          if-no-files-found: ignore
          retention-days: 3
  # The `ios` job's Mac: an idle owned simulator Mac first (scripts/ci/ios_runner_pool.py, the `pipeline` lane: one
  # simulator job on one Mac), Blacksmith macOS 26 on a re-run, a fork or a fork owner. The markers let the pool
  # charge this run's simulator while it holds one, as cmux-next-ios-kit.yml's and ios-reliability-matrix.yml's
  # pickers do. Not a job of ci/steps.toml: it runs no step, only places the ios job, and only when that runs.
  ios-runner:
    name: ios runner
    # The land tier (#54886's condition, tests/test_head_tier.py land_tier_condition), as linux and web-browser:
    # a ready head into feat-cmux-next runs this job only once it is handed to land, not on every push.
    # Leo, 2026-11-23: "de facto, im asking for 99% fewer minutes of ci time, period."
    if: ${{ (inputs.jobs == '' || contains(fromJSON(inputs.jobs), 'ios')) && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci') || (github.event.pull_request.draft == true && (vars.CI_DRAFT_CHEAP_TIER || '1') == '0') || (github.event.pull_request.draft != true && (contains(github.event.pull_request.labels.*.name, 'ready-to-land') || github.event.pull_request.base.ref != 'feat-cmux-next' || github.event.pull_request.head.repo.full_name != github.repository || (vars.CI_LAND_TIER || '1') == '0'))) && !(github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'feat-cmux-next' && (github.event.action == 'labeled' || github.event.action == 'unlabeled') && !contains(fromJSON('["full-ci","ready-to-land"]'), github.event.label.name)) }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-4vcpu-ubuntu-2404' || vars.CI_OVERFLOW_LINUX || 'cmux-linux' }}
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      runs_on: ${{ steps.pool.outputs.runs_on }}
      retry_runs_on: ${{ steps.pool.outputs.retry_runs_on }}
      label: ${{ steps.pool.outputs.label }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: |
            scripts/ci/ios_runner_pool.py
            scripts/ci/xcode-pins.txt
            scripts/ci/e2e_runner_pool.py
            scripts/ci/pr_runner_pool.py
            scripts/ci/github_spend.py
            scripts/ci/simple_pool_picker.py
            scripts/ci/deadline_http.py
            scripts/ci/warm_distance.py
            .gitmodules
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Mint the cmux-bot read token
        # Every run reads on cmux-bot's installation budget, so per-PR reads
        # stop draining the build controller's routing App (5067688 read 0 remaining at 02:17Z and
        # 10:32Z on 2026-11-25 with the controller itself at 234 calls/h; an
        # even/odd run-id split only cut it to ~9.5k/h on 2026-11-26).
        id: route-token-bot
        if: (github.event.pull_request.head.repo.full_name == github.repository && vars.CI_PR_POOL_OWNED == '1' && vars.CI_IOS_OWNED == '1' && vars.CMUX_BOT_APP_ID != '') && vars.CMUX_BOT_APP_ID != ''
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.CMUX_BOT_APP_ID }}
          private-key: ${{ secrets.CMUX_BOT_APP_KEY }}
          permission-administration: read
          permission-actions: read
          permission-organization-self-hosted-runners: read

      - name: Mint the owned-pool routing token
        id: route-token
        if: (github.event.pull_request.head.repo.full_name == github.repository && vars.CI_PR_POOL_OWNED == '1' && vars.CI_IOS_OWNED == '1' && vars.GLAEDA_ROUTE_APP_ID != '') && steps.route-token-bot.outputs.token == ''
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.GLAEDA_ROUTE_APP_ID }}
          private-key: ${{ secrets.GLAEDA_ROUTE_APP_KEY }}
          permission-administration: read
          # Queue, job and capacity-snapshot reads use this App's quota.
          permission-actions: read
          permission-organization-self-hosted-runners: read
      - name: Mint the cmux-bot read token
        # Every run reads on cmux-bot's installation budget, so per-PR reads
        # stop draining the build controller's routing App (5067688 read 0 remaining at 02:17Z and
        # 10:32Z on 2026-11-25 with the controller itself at 234 calls/h; an
        # even/odd run-id split only cut it to ~9.5k/h on 2026-11-26).
        id: route-token-repo-bot
        if: (steps.route-token.outcome == 'failure') && vars.CMUX_BOT_APP_ID != ''
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.CMUX_BOT_APP_ID }}
          private-key: ${{ secrets.CMUX_BOT_APP_KEY }}
          permission-administration: read
          permission-actions: read

      - name: Mint the repository routing token
        id: route-token-repo
        if: (steps.route-token.outcome == 'failure') && steps.route-token-repo-bot.outputs.token == ''
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.GLAEDA_ROUTE_APP_ID }}
          private-key: ${{ secrets.GLAEDA_ROUTE_APP_KEY }}
          permission-administration: read
          permission-actions: read
      - name: Pick the macOS pool
        id: pool
        env:
          CI_RUNNER_STATE: ${{ vars.CI_RUNNER_STATE }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ROUTE_TOKEN: ${{ (steps.route-token-bot.outputs.token || steps.route-token.outputs.token) || (steps.route-token-repo-bot.outputs.token || steps.route-token-repo.outputs.token) }}
          FORK_PULL_REQUEST: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          RUNNER_VARIABLE: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-6vcpu-macos-26' || vars.MACOS_RUNNER_TESTS || vars.MACOS_RUNNER_IOS }}
          IOS_OWNED: ${{ vars.CI_IOS_OWNED }}
          POOL_OWNED: ${{ vars.CI_PR_POOL_OWNED }}
          OWNED_SLOTS: ${{ vars.CI_OWNED_POOL_SLOTS }}
          PR_XCODE_APP: ${{ github.event.pull_request.head.repo.full_name == github.repository && vars.CMUX_CI_XCODE_APP_PR || '' }}
          POOL_ORDER: ${{ vars.CI_PR_POOL_ORDER }}
          POOL_MAX_QUEUED: ${{ vars.CI_PR_POOL_MAX_QUEUED }}
        run: |
          set -euo pipefail
          python3 scripts/ci/ios_runner_pool.py \
            --lane pipeline --fork "$FORK_PULL_REQUEST" --requested auto \
            --variable "$RUNNER_VARIABLE" --ios-owned "$IOS_OWNED" --owned "$POOL_OWNED" \
            --owned-slots "$OWNED_SLOTS" --pr-xcode-app "$PR_XCODE_APP" --order "$POOL_ORDER" \
            --max-queued "$POOL_MAX_QUEUED" --queue-rounds 0 \
            --device-family iphone | tee -a "$GITHUB_OUTPUT"
      - name: Create the owned-pool marker
        id: marker
        if: steps.pool.outputs.persistent == 'true' && github.run_attempt == 1
        continue-on-error: true
        run: |
          set -euo pipefail
          marker="$RUNNER_TEMP/macos-pool-persistent.json"
          echo '{}' > "$marker"
          echo "path=$marker" >> "$GITHUB_OUTPUT"
      - name: Upload the persistent pool marker
        if: steps.marker.outputs.path != ''
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-pool-persistent-${{ github.run_id }}-${{ github.run_attempt }}-1-${{ steps.pool.outputs.label }}
          path: ${{ steps.marker.outputs.path }}
          retention-days: 1
      - name: Upload the simulator capacity marker
        if: steps.marker.outputs.path != ''
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-pool-persistent-${{ github.run_id }}-${{ github.run_attempt }}-1-glaeda-ios-sim
          path: ${{ steps.marker.outputs.path }}
          retention-days: 1
      - name: Upload the owned-pool watch marker
        if: steps.marker.outputs.path != ''
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: owned-pool-watch
          path: ${{ steps.marker.outputs.path }}
          retention-days: 1

  # The `ios` job: the CmuxMobileKit tests and the reliability matrix's phone cells (ci/steps.toml's ios steps), on
  # the Mac ios-runner picked, one iPhone simulator, one step after the other. The kit's macOS swift test
  # (ios-kit-macos) runs in the `ios macos` job below, beside this one; ios-kit reads its verdict.
  ios:
    name: ios
    needs: [ios-runner]
    # The land tier (#54886's condition, tests/test_head_tier.py land_tier_condition), as linux and web-browser:
    # a ready head into feat-cmux-next runs this job only once it is handed to land, not on every push.
    # Leo, 2026-11-23: "de facto, im asking for 99% fewer minutes of ci time, period."
    if: ${{ (inputs.jobs == '' || contains(fromJSON(inputs.jobs), 'ios')) && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci') || (github.event.pull_request.draft == true && (vars.CI_DRAFT_CHEAP_TIER || '1') == '0') || (github.event.pull_request.draft != true && (contains(github.event.pull_request.labels.*.name, 'ready-to-land') || github.event.pull_request.base.ref != 'feat-cmux-next' || github.event.pull_request.head.repo.full_name != github.repository || (vars.CI_LAND_TIER || '1') == '0'))) && !(github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'feat-cmux-next' && (github.event.action == 'labeled' || github.event.action == 'unlabeled') && !contains(fromJSON('["full-ci","ready-to-land"]'), github.event.label.name)) }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-6vcpu-macos-26' || fromJSON(github.run_attempt > 1 && needs.ios-runner.outputs.retry_runs_on || needs.ios-runner.outputs.runs_on) }}
    # ci/run's setup (10 min) and tool downloads (3 min), then the `alone` kit (80 min with the fleet pool's wait) and
    # phone cells (45 min), the fleet pool's build (25 min), with room for the checkout and Xcode
    # (tests/test_ci_step_table.py holds this).
    timeout-minutes: 170
    permissions:
      contents: read
      # ci/run's step-result store (gh-events.cmux.com/github/step-results): the runner pool is off the tailnet.
      id-token: write
      # ios-kit reads the `ios macos` job's verdict (scripts/ci/ios_macos_leg.py).
      actions: read
    env:
      CMUX_CI_XCODE_APP: ${{ github.run_attempt == 1 && startsWith(needs.ios-runner.outputs.label, 'glaeda-') && github.event.pull_request.head.repo.full_name == github.repository && vars.CMUX_CI_XCODE_APP_PR || '' }}
    steps:
      - name: Checkout the merge commit and the base tip
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 2
          submodules: false
          # An owned Mac reuses its workspace: keep the ignored cargo target, so the xcframework builds incrementally.
          clean: false
      - name: List the changed paths
        run: |
          if git rev-parse -q --verify 'HEAD^2' >/dev/null; then
            git diff --name-only --no-renames -z 'HEAD^1' HEAD > "$RUNNER_TEMP/changed-paths.txt"
            echo "PATHS_FILE=$RUNNER_TEMP/changed-paths.txt" >> "$GITHUB_ENV"
            tr -cd '\0' < "$RUNNER_TEMP/changed-paths.txt" | wc -c
          else
            echo "::notice::No merge commit to diff: every ios step runs."
          fi
      # A reused workspace keeps what earlier jobs left untracked; the ignored builds stay.
      - name: Drop untracked leftovers (self-hosted reused workspace)
        run: git clean -ffd
      # owned_pool_rescue.py reads this step by name.
      - name: Select Xcode
        run: ./scripts/select-ci-xcode.sh
      # GitHub 403s anonymous fetches from the office Macs' address; xcodebuild's SwiftPM clones send the job token.
      - name: Authenticate github.com fetches with the job token
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/github_fetch_auth.py
      # The kit's simulator tests on the fleet pool (scripts/ci/ios-sim-pool.sh): this Mac builds for testing and
      # the pool runs them; the ios-kit step reads the verdict, with this Mac as the fallback when the pool gives none.
      # On by default (Leo, 2026-11-25: "freeing up the Mac's from doing things that don't need Mac's asap"); the
      # shadow run that timed both ran its one run (#56945). vars.CMUX_IOS_SIM_LINUX=off leaves the pool out. Same-repo pull requests only.
      - name: Fleet pool, build the kit's simulator tests
        id: sim-pool
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.CMUX_IOS_SIM_LINUX != 'off' && vars.CMUX_FLEET_CONTROLLER != '' }}
        continue-on-error: true
        timeout-minutes: 25
        run: |
          if ! ci/run route ${PATHS_FILE:+--paths-file "$PATHS_FILE"} | python3 -c 'import json, sys; sys.exit("ios-kit" not in (json.load(sys.stdin).get("ios") or []))'; then
            echo "ios-kit is not routed: no pool run"; exit 0
          fi
          bash scripts/ci/ios-sim-pool.sh pack
          echo "packed=1" >> "$GITHUB_OUTPUT"
      # The products go to the fleet pool's own store (for this run's pool step only), not to an artifact here.
      - name: Fleet pool, upload the products
        id: sim-pool-upload
        if: ${{ steps.sim-pool.outputs.packed == '1' }}
        continue-on-error: true
        timeout-minutes: 10
        env:
          CONTROLLER: ${{ vars.CMUX_FLEET_CONTROLLER }}
        run: bash scripts/ci/ios-sim-pool.sh upload
      - name: Fleet pool, submit
        if: ${{ steps.sim-pool.outputs.packed == '1' && steps.sim-pool-upload.outcome == 'success' }}
        continue-on-error: true
        env:
          CONTROLLER: ${{ vars.CMUX_FLEET_CONTROLLER }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/ci/ios-sim-pool.sh submit
      # Every routed ios step but ios-kit-macos, which the `ios macos` job runs. ios-kit-macos routes only with
      # ios-kit (the same inputs), so the list is never empty when it is routed; `none` names no step.
      - name: Run the routed ios steps (ci/steps.toml)
        env:
          CMUX_IOS_SIM_LINUX: ${{ vars.CMUX_IOS_SIM_LINUX == 'off' && 'off' || 'on' }}
          CMUX_IOS_SIM_POOL_DIR: ${{ runner.temp }}/sim-pool
          GH_TOKEN: ${{ github.token }}
        run: |
          only="$(ci/run route ${PATHS_FILE:+--paths-file "$PATHS_FILE"} | python3 -I -c 'import json, sys
          print(" ".join(n for n in json.load(sys.stdin).get("ios", []) if n != "ios-kit-macos") or "none")')"
          ci/run run --job ios ${PATHS_FILE:+--paths-file "$PATHS_FILE"} --only "$only"

  # The `ios macos` job: the kit's macOS swift test (ci/steps.toml's ios-kit-macos), which ios-kit ran before its
  # simulator leg in the `ios` job. On its own Mac it runs beside the simulator leg instead of before it: the `ios`
  # verdict is the longer leg, not the sum (Aziz's iOS PR verdict, goal ios-ci-under-5min). It needs no simulator,
  # so it takes the mac job's pool, cmux-mac (RFD 0165: no Blacksmith macOS switch on own-branch runs). ios-kit reads its
  # verdict (scripts/ci/ios_macos_leg.py): a red one skips the simulator leg and turns `ios` red, as before.
  ios-macos:
    name: ios macos
    if: ${{ inputs.jobs == '' || contains(fromJSON(inputs.jobs), 'ios') }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-6vcpu-macos-26' || 'cmux-mac' }}
    # ci/run's setup (10 min) and tool downloads (3 min), then the `alone` ios-kit-macos (45 min), with room for the
    # checkout and Xcode (tests/test_ci_step_table.py holds this).
    timeout-minutes: 70
    permissions:
      contents: read
      # ci/run's step-result store (gh-events.cmux.com/github/step-results): the runner pool is off the tailnet.
      id-token: write
    # No picker to wait on: it starts with the run, on the mac job's Xcode.
    env:
      CMUX_CI_XCODE_APP: ${{ vars.CMUX_CI_XCODE_APP_MACOS_26 }}
      CMUX_CI_REQUIRED_MACOS_SDK_MAJOR: "26"
    steps:
      - name: Checkout the merge commit and the base tip
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 2
          submodules: false
          # An owned Mac reuses its workspace: keep the ignored cargo target, so the xcframework builds incrementally.
          clean: false
      - name: List the changed paths
        run: |
          if git rev-parse -q --verify 'HEAD^2' >/dev/null; then
            git diff --name-only --no-renames -z 'HEAD^1' HEAD > "$RUNNER_TEMP/changed-paths.txt"
            echo "PATHS_FILE=$RUNNER_TEMP/changed-paths.txt" >> "$GITHUB_ENV"
            tr -cd '\0' < "$RUNNER_TEMP/changed-paths.txt" | wc -c
          else
            echo "::notice::No merge commit to diff: every ios step runs."
          fi
      # A reused workspace keeps what earlier jobs left untracked; the ignored builds stay.
      - name: Drop untracked leftovers (self-hosted reused workspace)
        run: git clean -ffd
      - name: Select Xcode
        run: ./scripts/select-ci-xcode.sh
      - name: Run the kit's macOS swift test (ci/steps.toml ios-kit-macos)
        run: ci/run run --job ios ${PATHS_FILE:+--paths-file "$PATHS_FILE"} --only ios-kit-macos

  # The fast iOS verdict (goal ios-ci-under-5min: an iOS pull request's verdict in under 5 min p90, queue included).
  # Additive: the `ios` job above and the iOS workflows after merge run as before, and no branch rule requires it.
  # ios-fast-runner reads the merge commit's diff (scripts/ci/ios_fast_verdict.py: the kit test target a changed
  # source maps to, else a kit or app build) and, only when an iOS target changed, picks a Mac as ios-runner does;
  # ios-fast builds that target on the warm owned mini (clean: false keeps the xcframework, DerivedData slot and
  # resolved packages) and runs only its tests, as its own check, so it reports before the full matrix. It does not
  # wait for the router's `ios` route (pr_router.json routes none since #57353): every full-tier pull request plans.
  # vars.CI_IOS_FAST_VERDICT=0 turns it off.
  ios-fast-runner:
    name: ios fast verdict runner
    if: ${{ vars.CI_IOS_FAST_VERDICT != '0' }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-4vcpu-ubuntu-2404' || vars.CI_OVERFLOW_LINUX || 'cmux-linux' }}
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      run: ${{ steps.plan.outputs.run }}
      plan: ${{ steps.plan.outputs.plan }}
      summary: ${{ steps.plan.outputs.summary }}
      runs_on: ${{ steps.pool.outputs.runs_on }}
      retry_runs_on: ${{ steps.pool.outputs.retry_runs_on }}
      label: ${{ steps.pool.outputs.label }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 2
          sparse-checkout: |
            ci/
            scripts/ci/
            cmux-next-ios/CmuxMobileKit/Tests/
            .gitmodules
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Plan the changed iOS targets
        id: plan
        run: python3 scripts/ci/ios_fast_verdict.py plan
      - name: Mint the cmux-bot read token (even runs)
        # Even run ids read on cmux-bot's installation budget, odd ones on
        # manaflow-glaeda-route's, so per-PR reads stop draining the build
        # controller's routing App (5067688 read 0 remaining at 02:17Z and
        # 10:32Z on 2026-11-25 with the controller itself at 234 calls/h).
        id: route-token-bot
        if: steps.plan.outputs.run == 'true' && (github.event.pull_request.head.repo.full_name == github.repository && vars.CI_PR_POOL_OWNED == '1' && vars.CI_IOS_OWNED == '1' && vars.CMUX_BOT_APP_ID != '') && vars.CMUX_BOT_APP_ID != '' && (endsWith(format('{0}', github.run_id), '0') || endsWith(format('{0}', github.run_id), '2') || endsWith(format('{0}', github.run_id), '4') || endsWith(format('{0}', github.run_id), '6') || endsWith(format('{0}', github.run_id), '8'))
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.CMUX_BOT_APP_ID }}
          private-key: ${{ secrets.CMUX_BOT_APP_KEY }}
          permission-administration: read
          permission-actions: read
          permission-organization-self-hosted-runners: read

      - name: Mint the owned-pool routing token
        id: route-token
        if: steps.plan.outputs.run == 'true' && (github.event.pull_request.head.repo.full_name == github.repository && vars.CI_PR_POOL_OWNED == '1' && vars.CI_IOS_OWNED == '1' && vars.GLAEDA_ROUTE_APP_ID != '') && steps.route-token-bot.outputs.token == ''
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.GLAEDA_ROUTE_APP_ID }}
          private-key: ${{ secrets.GLAEDA_ROUTE_APP_KEY }}
          permission-administration: read
          # Queue, job and capacity-snapshot reads use this App's quota.
          permission-actions: read
          permission-organization-self-hosted-runners: read
      - name: Mint the cmux-bot read token (even runs)
        # Even run ids read on cmux-bot's installation budget, odd ones on
        # manaflow-glaeda-route's, so per-PR reads stop draining the build
        # controller's routing App (5067688 read 0 remaining at 02:17Z and
        # 10:32Z on 2026-11-25 with the controller itself at 234 calls/h).
        id: route-token-repo-bot
        if: steps.plan.outputs.run == 'true' && (steps.route-token.outcome == 'failure') && vars.CMUX_BOT_APP_ID != '' && (endsWith(format('{0}', github.run_id), '0') || endsWith(format('{0}', github.run_id), '2') || endsWith(format('{0}', github.run_id), '4') || endsWith(format('{0}', github.run_id), '6') || endsWith(format('{0}', github.run_id), '8'))
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.CMUX_BOT_APP_ID }}
          private-key: ${{ secrets.CMUX_BOT_APP_KEY }}
          permission-administration: read
          permission-actions: read

      - name: Mint the repository routing token
        id: route-token-repo
        if: steps.plan.outputs.run == 'true' && (steps.route-token.outcome == 'failure') && steps.route-token-repo-bot.outputs.token == ''
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.GLAEDA_ROUTE_APP_ID }}
          private-key: ${{ secrets.GLAEDA_ROUTE_APP_KEY }}
          permission-administration: read
          permission-actions: read
      - name: Pick the macOS pool
        id: pool
        if: steps.plan.outputs.run == 'true'
        env:
          CI_RUNNER_STATE: ${{ vars.CI_RUNNER_STATE }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ROUTE_TOKEN: ${{ (steps.route-token-bot.outputs.token || steps.route-token.outputs.token) || (steps.route-token-repo-bot.outputs.token || steps.route-token-repo.outputs.token) }}
          FORK_PULL_REQUEST: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          RUNNER_VARIABLE: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-6vcpu-macos-26' || vars.MACOS_RUNNER_TESTS || vars.MACOS_RUNNER_IOS }}
          IOS_OWNED: ${{ vars.CI_IOS_OWNED }}
          POOL_OWNED: ${{ vars.CI_PR_POOL_OWNED }}
          OWNED_SLOTS: ${{ vars.CI_OWNED_POOL_SLOTS }}
          PR_XCODE_APP: ${{ github.event.pull_request.head.repo.full_name == github.repository && vars.CMUX_CI_XCODE_APP_PR || '' }}
          POOL_ORDER: ${{ vars.CI_PR_POOL_ORDER }}
          POOL_MAX_QUEUED: ${{ vars.CI_PR_POOL_MAX_QUEUED }}
        run: |
          set -euo pipefail
          python3 scripts/ci/ios_runner_pool.py \
            --lane pipeline --fork "$FORK_PULL_REQUEST" --requested auto \
            --variable "$RUNNER_VARIABLE" --ios-owned "$IOS_OWNED" --owned "$POOL_OWNED" \
            --owned-slots "$OWNED_SLOTS" --pr-xcode-app "$PR_XCODE_APP" --order "$POOL_ORDER" \
            --max-queued "$POOL_MAX_QUEUED" --queue-rounds 0 \
            --device-family iphone | tee -a "$GITHUB_OUTPUT"
      - name: Create the owned-pool marker
        id: marker
        if: steps.pool.outputs.persistent == 'true' && github.run_attempt == 1
        continue-on-error: true
        run: |
          set -euo pipefail
          marker="$RUNNER_TEMP/macos-pool-persistent.json"
          echo '{}' > "$marker"
          echo "path=$marker" >> "$GITHUB_OUTPUT"
      - name: Upload the persistent pool marker
        if: steps.marker.outputs.path != ''
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-pool-persistent-${{ github.run_id }}-${{ github.run_attempt }}-1-${{ steps.pool.outputs.label }}
          path: ${{ steps.marker.outputs.path }}
          retention-days: 1
      - name: Upload the simulator capacity marker
        if: steps.marker.outputs.path != ''
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-pool-persistent-${{ github.run_id }}-${{ github.run_attempt }}-1-glaeda-ios-sim
          path: ${{ steps.marker.outputs.path }}
          retention-days: 1
      - name: Upload the owned-pool watch marker
        if: steps.marker.outputs.path != ''
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: owned-pool-watch
          path: ${{ steps.marker.outputs.path }}
          retention-days: 1

  ios-fast:
    name: ios fast verdict
    needs: [ios-fast-runner]
    if: ${{ needs.ios-fast-runner.outputs.run == 'true' }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-6vcpu-macos-26' || fromJSON(github.run_attempt > 1 && needs.ios-fast-runner.outputs.retry_runs_on || needs.ios-fast-runner.outputs.runs_on) }}
    # Warm: about 3-4 min. Cold (a new Mac, a changed FFI or Package.resolved): the FFI (the fleet's copy, up to
    # 10 min, or this Mac builds it) and a full kit build.
    timeout-minutes: 40
    permissions:
      contents: read
    outputs:
      verdict: ${{ steps.verdict.outputs.verdict }}
    env:
      CMUX_CI_XCODE_APP: ${{ github.run_attempt == 1 && startsWith(needs.ios-fast-runner.outputs.label, 'glaeda-') && github.event.pull_request.head.repo.full_name == github.repository && vars.CMUX_CI_XCODE_APP_PR || '' }}
    steps:
      - name: Checkout the merge commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          # An owned Mac reuses its workspace: the ignored xcframework and cargo target stay warm.
          clean: false
      # A reused workspace keeps what earlier jobs left untracked; the ignored builds stay.
      - name: Drop untracked leftovers (self-hosted reused workspace)
        run: git clean -ffd
      # owned_pool_rescue.py reads this step by name.
      - name: Select Xcode
        run: ./scripts/select-ci-xcode.sh
      - name: Build the changed iOS target and run its tests
        env:
          PLAN: ${{ needs.ios-fast-runner.outputs.plan }}
          SUMMARY: ${{ needs.ios-fast-runner.outputs.summary }}
        run: |
          echo "::notice title=iOS fast verdict::$SUMMARY"
          bash scripts/ci/ios_fast_verdict.sh
      # pr-router.yml's ios-fast-status posts this as `cmux/ios-fast`.
      - name: Record the verdict
        id: verdict
        if: ${{ success() || failure() }}
        env:
          STATUS: ${{ job.status }}
        run: echo "verdict=$STATUS" >> "$GITHUB_OUTPUT"

  # The `mac` job: the Mac tier of a feat-cmux-next pull request, the fast tier's Swift suites, which was
  # cmux-next.yml's fast-tier job (and its build-fleet variants) on a pull request. The Swift canary is a `linux`
  # step now (swift-canary): it reads the build fleet's Debug compile of the head instead of compiling on a Mac. pr-router.yml starts it only when the change routes a `mac` step and the head is in the full tier (a
  # draft runs no Mac, scripts/ci/pr_router.py FULL_TIER_JOBS). Each step asks scripts/ci/mac_tiers.py whether its
  # tier is routed (cmux_next_route.py, the router cmux-next.yml's path_route runs), and so does the step below
  # that gates this job's Mac setup, so a path the steps' globs over-route costs a checkout and a few seconds.
  # A fork's pull request runs on Blacksmith; nightlies never run here.
  mac:
    name: mac
    # The land tier (#54886's condition, tests/test_head_tier.py land_tier_condition), as linux and web-browser:
    # a ready head into feat-cmux-next runs this job only once it is handed to land, not on every push.
    # Leo, 2026-11-23: "de facto, im asking for 99% fewer minutes of ci time, period."
    if: ${{ (inputs.jobs == '' || contains(fromJSON(inputs.jobs), 'mac')) && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci') || (github.event.pull_request.draft == true && (vars.CI_DRAFT_CHEAP_TIER || '1') == '0') || (github.event.pull_request.draft != true && (contains(github.event.pull_request.labels.*.name, 'ready-to-land') || github.event.pull_request.base.ref != 'feat-cmux-next' || github.event.pull_request.head.repo.full_name != github.repository || (vars.CI_LAND_TIER || '1') == '0'))) && !(github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'feat-cmux-next' && (github.event.action == 'labeled' || github.event.action == 'unlabeled') && !contains(fromJSON('["full-ci","ready-to-land"]'), github.event.label.name)) }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-6vcpu-macos-26' || 'cmux-mac' }}
    # The Mac setup below (Xcode, the owned build root, two cache restores of up to 8 min each), then ci/run: its
    # setup (10 min), the tool downloads (3 min), then the `alone` fast tier (tests/test_ci_step_table.py
    # holds this).
    timeout-minutes: 165
    permissions:
      contents: read
      # ci/run's step-result store (gh-events.cmux.com/github/step-results): the runner pool is off the tailnet.
      id-token: write
    env:
      CMUX_CI_XCODE_APP: ${{ vars.CMUX_CI_XCODE_APP_MACOS_26 }}
      CMUX_CI_REQUIRED_MACOS_SDK_MAJOR: "26"
    steps:
      - name: Checkout the merge commit and the base tip
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 2
          submodules: false
          # An owned Mac reuses its workspace: keep the ignored SwiftPM builds a clean would delete.
          clean: false
      - name: List the changed paths
        run: |
          if git rev-parse -q --verify 'HEAD^2' >/dev/null; then
            git diff --name-only --no-renames -z 'HEAD^1' HEAD > "$RUNNER_TEMP/changed-paths.txt"
            echo "PATHS_FILE=$RUNNER_TEMP/changed-paths.txt" >> "$GITHUB_ENV"
            tr -cd '\0' < "$RUNNER_TEMP/changed-paths.txt" | wc -c
          else
            echo "::notice::No merge commit to diff: every mac step runs."
          fi
      - name: Route the Mac tiers
        id: tiers
        env:
          CI_PATHS_FILE: ${{ env.PATHS_FILE }}
          CI_DRAFT_CHEAP_TIER: ${{ vars.CI_DRAFT_CHEAP_TIER || '1' }}
          # 1: a ready-to-land head runs the full tier again; unset or 0: it runs the affected tier and the full tier
          # runs hourly on feat-cmux-next (head_tier.py hourly full tier rule, cmux-next-hourly-full-tier.yml).
          CI_LAND_FULL_PER_PR: ${{ vars.CI_LAND_FULL_PER_PR || '0' }}
          CI_IDLE_BASE_MERGE_SKIP: ${{ vars.CI_IDLE_BASE_MERGE_SKIP || '1' }}
        run: python3 -I scripts/ci/mac_tiers.py route --github-output "$GITHUB_OUTPUT"
      - name: Drop stale submodule checkouts (self-hosted reused workspace)
        if: steps.tiers.outputs.fast_tier == 'true'
        run: |
          scripts/ci/reset-stale-submodules.sh
          git clean -ffd
      # The fast tier's tests can start acpmux daemons: they get a home of this job's own.
      - name: Give this job its own acpmux home
        if: steps.tiers.outputs.fast_tier == 'true'
        run: |
          home="$RUNNER_TEMP/acpmux-home"
          rm -rf "$home" && mkdir -m 700 "$home"
          echo "ACPMUX_HOME=$home" >> "$GITHUB_ENV"
          # An inherited socket would still name another home's daemon; empty is unset.
          echo "ACPMUX_SOCKET=" >> "$GITHUB_ENV"
      # owned_pool_rescue.py reads this step by name.
      - name: Select Xcode
        if: steps.tiers.outputs.fast_tier == 'true'
        run: ./scripts/select-ci-xcode.sh
      # On an owned Mac the Swift steps build in a leased root every runner slot shares (owned_spm_scratch.py
      # lease); its holder process keeps the lease until the job ends, so this stays a workflow step.
      - name: Keep Swift package builds on this owned Mac
        id: spm-root
        if: steps.tiers.outputs.fast_tier == 'true' && contains(runner.name, '-glaeda')
        continue-on-error: true
        env:
          # GitHub 403s anonymous fetches from the office Macs' address: scripts/ci/github_fetch_auth.py
          GH_TOKEN: ${{ github.token }}
          CMUX_FAST_TIER_OWNED_SEED: ${{ (vars.CI_FAST_TIER_OWNED_SEED || '1') != '0' && '1' || '' }}
        run: |
          python3 scripts/ci/owned_spm_scratch.py lease "$GITHUB_WORKSPACE"
          python3 scripts/ci/swiftpm_prefetch_binary_artifacts.py --package-path Packages/macOS/CmuxNext
          python3 scripts/ci/github_fetch_auth.py || true
      - name: Name the build root
        if: steps.tiers.outputs.fast_tier == 'true'
        env:
          ROOT: ${{ steps.spm-root.outputs.root || github.workspace }}
        run: echo "CMUX_MAC_ROOT=$ROOT" >> "$GITHUB_ENV"
      # The fast tier's warm start: the newest base seed cmux-next-fast-tier-seed.yml saved (a pull request only
      # restores), as cmux-next.yml's fast-tier job restores it.
      - name: Compute fast-tier cache keys
        id: fast-cache-key
        if: steps.tiers.outputs.fast_tier == 'true' && (!contains(runner.name, '-glaeda') || steps.spm-root.outputs.seed == '1')
        env:
          CMUX_FAST_CACHE_WORKSPACE: ${{ steps.spm-root.outputs.root || github.workspace }}
        run: scripts/cmux-next/fast-tier-cache-key.sh "$CMUX_FAST_CACHE_WORKSPACE" >> "$GITHUB_OUTPUT"
      - name: Restore the CmuxNext build
        id: fast-cache-restore
        if: steps.fast-cache-key.outputs.swift-key != ''
        continue-on-error: true
        uses: ./.github/actions/cache-restore
        env:
          CI_CACHE_R2_PUBLIC_URL: https://ci-cache-next.cmux.com
          CMUX_LAN_CACHE_TIMEOUT: "480"
        with:
          backend: r2
          path: ${{ format('{0}/Packages/macOS/CmuxNext/.build', steps.spm-root.outputs.root || github.workspace) }}
          key: ${{ steps.fast-cache-key.outputs.swift-key }}
          restore-keys: ${{ steps.fast-cache-key.outputs.swift-prefix }}
      - name: Name the restored seed
        id: fast-cache-seed
        if: steps.fast-cache-restore.outputs.cache-matched-key != ''
        env:
          MATCHED: ${{ steps.fast-cache-restore.outputs.cache-matched-key }}
          PREFIX: ${{ steps.fast-cache-key.outputs.swift-prefix }}
          SEED_ROOT: ${{ steps.spm-root.outputs.seed }}
        run: |
          echo "commit=${MATCHED#"$PREFIX"}" >> "$GITHUB_OUTPUT"
          if [[ "$SEED_ROOT" == 1 ]]; then python3 scripts/ci/owned_spm_scratch.py seeded; fi
      - name: Restore the CmuxHomeRender build of that seed
        if: steps.fast-cache-seed.outputs.commit != ''
        continue-on-error: true
        uses: ./.github/actions/cache-restore
        env:
          CI_CACHE_R2_PUBLIC_URL: https://ci-cache-next.cmux.com
          CMUX_LAN_CACHE_TIMEOUT: "480"
        with:
          backend: r2
          path: ${{ format('{0}/Packages/Shared/CmuxHomeRender/.build', steps.spm-root.outputs.root || github.workspace) }}
          key: ${{ steps.fast-cache-key.outputs.home-prefix }}${{ steps.fast-cache-seed.outputs.commit }}
      - name: Replay the seed's input times
        if: steps.fast-cache-seed.outputs.commit != ''
        continue-on-error: true
        env:
          ROOT: ${{ steps.spm-root.outputs.root || github.workspace }}
        run: python3 -I scripts/ci/e2e_warm_derived_data.py replay "$ROOT" "$ROOT/Packages/macOS/CmuxNext/.build/cmux-fast-tier-input-mtimes.json"
      - name: Run the routed mac steps (ci/steps.toml)
        env:
          CMUX_FAST_SWIFT_CACHE_KEY: ${{ steps.fast-cache-key.outputs.swift-key }}
          CMUX_FAST_SWIFT_CACHE_HIT: ${{ steps.fast-cache-restore.outputs.cache-hit }}
          CMUX_FAST_CACHE_MATCHED_KEY: ${{ steps.fast-cache-restore.outputs.cache-matched-key }}
          # `0` runs every fast tier suite on the pull request again, not only the ones the change reaches.
          CI_FAST_TIER_PR_SCOPE: ${{ vars.CI_FAST_TIER_PR_SCOPE || '1' }}
          # `1` takes the fast tier's Swift test bundles from the fleet job that built them for this commit
          # (scripts/ci/fleet-test-products.py); with none this Mac builds them. Off unless set.
          CMUX_SWIFT_TEST_PRODUCTS: ${{ vars.CI_FAST_TIER_PRODUCTS_FLEET == '1' && 'fleet' || 'build' }}
          CMUX_FLEET_CONTROLLER: ${{ vars.CMUX_FLEET_CONTROLLER }}
          CMUX_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: ci/run run --job mac ${PATHS_FILE:+--paths-file "$PATHS_FILE"}
      - name: Stop this job's acpmux daemons and remove its home
        if: ${{ always() && steps.tiers.outputs.fast_tier == 'true' }}
        continue-on-error: true
        timeout-minutes: 3
        run: |
          home="$RUNNER_TEMP/acpmux-home"
          [[ -d "$home" ]] || exit 0
          acpmux="$(PATH="$PATH:$HOME/.local/bin:$HOME/.cargo/bin:/opt/homebrew/bin:/usr/local/bin" command -v acpmux || true)"
          [[ -z "$acpmux" ]] || env -u ACPMUX_SOCKET ACPMUX_HOME="$home" "$acpmux" daemon shutdown --end-agents || true
          rm -rf "$home"
      # The fast tier's timing receipt (the mac-fast-tier step writes it), named as cmux-next.yml's fast-tier job
      # names it, so its readers find a pull request's receipt here.
      - name: Upload fast-tier timing receipt
        if: ${{ always() && steps.tiers.outputs.fast_tier == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-next-fast-tier-receipt-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cmux-next-fast-tier.json
          if-no-files-found: warn
          retention-days: 7

  # The Mac fallback: a linux step that could not get its answer from the build fleet (the Swift canary with a
  # fail or no verdict) runs here on a Mac, and this run's verdict is the step's. Every run of this job is a
  # fallback, logged by its name in the timing records and by the linux step's `fleet fallback` warning, so the
  # fleet side gets fixed. Leo, 2026-11-25: "having our mac fleet be able to like... exist as fallbacks if we
  # fucked up logic for linux and whatnot is still fine".
  mac-fallback:
    name: mac fallback
    needs: linux
    if: ${{ !cancelled() && needs.linux.outputs.mac_fallback != '' }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-6vcpu-macos-26' || 'cmux-mac' }}
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      CMUX_CI_XCODE_APP: ${{ vars.CMUX_CI_XCODE_APP_MACOS_26 }}
      CMUX_CI_REQUIRED_MACOS_SDK_MAJOR: "26"
    steps:
      - name: Checkout the merge commit and the base tip
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 2
          submodules: false
          clean: false
      - name: Select Xcode
        run: ./scripts/select-ci-xcode.sh
      - name: Swift canary on a Mac (fleet fallback)
        if: ${{ contains(needs.linux.outputs.mac_fallback, 'swift-canary') }}
        env:
          TARGETS: ${{ needs.linux.outputs.canary_targets }}
        run: |
          echo "::warning title=fleet fallback::Swift canary compiled on a Mac: the build fleet had no pass for this head"
          read -r -a targets <<< "$TARGETS"
          if ((${#targets[@]} == 0)); then
            echo "the Swift canary fell back with no target" >&2
            exit 1
          fi
          cd Packages/macOS/CmuxNext
          for target in "${targets[@]}"; do
            echo "Canary target: $target"
            swift build --configuration debug --target "$target"
          done
