name: pr pipeline

# The PR pipeline (the CI v2 design, "One step table"): a pull request's checks are steps of
# ci/steps.toml, run by `ci/run` in a few jobs, not a workflow, a runner and a checkout apiece. This is
# the `linux` job: one machine, one checkout of the merge commit, and every `linux` step the change
# routes, side by side. Each step's output is one log group, a failed step is one annotation, and the
# summary lists every step with its seconds.
#
# pr-router.yml starts it, and only when the change routes a step (scripts/ci/pr_router.json
# `table_jobs`): a pull request that touches no step's inputs costs no runner here.
#
# Adding a check: add a step to ci/steps.toml. No new workflow, no router edit.
on:
  workflow_call:
    inputs:
      # The table's jobs the change routes, a JSON list (pr-router.yml's `table` output). Empty: every job runs
      # its routed steps (a job with none routed prints so and passes).
      jobs:
        required: false
        type: string
        default: ""
    secrets:
      # The org's manaflow-glaeda-route App key (read-only on runners), for the ios-runner job's live read of the
      # owned simulator Macs. Optional: without it the picker reads with the run's token.
      GLAEDA_ROUTE_APP_KEY:
        required: false

permissions: {}

env:
  # Temporary REST budget attribution: one gh-call line per GitHub API call (scripts/ci/api_call_log/env.sh, fetched at a fixed commit when the checkout has no copy).
  BASH_ENV: '$({ w="${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh"; t="${RUNNER_TEMP:-/nonexistent}/api-call-log-src"; if [ -f "$w" ]; then echo "$w"; elif [ -n "${RUNNER_TEMP:-}" ]; then if [ ! -f "$t/env.sh" ] && [ ! -e "$t.tried" ] && { [ "${RUNNER_OS:-}" = Linux ] || [ "${RUNNER_OS:-}" = macOS ]; } && [ "$(date -u +%Y%m%d%H)" -lt 2026112300 ]; then : > "$t.tried"; mkdir -p "$t.part" && for x in env.sh gh sitecustomize.py isolated.py; do curl -fsSL --max-time 5 -o "$t.part/$x" "https://raw.githubusercontent.com/manaflow-ai/cmux/27647ffd3ae838c63be28ca3e5883dcd68c34518/scripts/ci/api_call_log/$x" || break; done; [ -s "$t.part/isolated.py" ] && mv "$t.part" "$t"; fi; if [ -f "$t/env.sh" ]; then echo "$t/env.sh"; else echo unset BASH_ENV > "$t.off.sh" && echo "$t.off.sh"; fi; fi; } 2>/dev/null)'

jobs:
  linux:
    name: linux
    if: ${{ inputs.jobs == '' || contains(fromJSON(inputs.jobs), 'linux') }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-4vcpu-ubuntu-2404' || vars.CI_OVERFLOW_LINUX || 'cmux-linux' }}
    # Above setup (10 min), the tool downloads (3 min), the waves of the slowest step (6 min; steps two at
    # once on 2 CPUs) and the `alone` steps (ci-artifact-worker and coderouter 6 min each, the cmux_next_ daemon tests 65 min,
    # the iOS matrix protocol 45 min), with room for the checkout, so a slow step is reported by the runner, not cut here.
    timeout-minutes: 215
    permissions:
      contents: read
    steps:
      - name: Checkout the merge commit and the base tip
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: List the changed paths
        # Every path the merge commit changes against the base tip, both sides of a rename (what the
        # router read). With no merge commit there is no list, and ci/run then runs every step.
        run: |
          if git rev-parse -q --verify 'HEAD^2' >/dev/null; then
            git diff --name-only --no-renames -z 'HEAD^1' HEAD > "$RUNNER_TEMP/changed-paths.txt"
            echo "PATHS_FILE=$RUNNER_TEMP/changed-paths.txt" >> "$GITHUB_ENV"
            tr -cd '\0' < "$RUNNER_TEMP/changed-paths.txt" | wc -c
          else
            echo "::notice::No merge commit to diff: every linux step runs."
          fi
      - name: Run the routed linux steps (ci/steps.toml)
        run: ci/run run --job linux ${PATHS_FILE:+--paths-file "$PATHS_FILE"}
      # A type check (the `web-typecheck` step) whose every error had one safe language-service fix, and passed with
      # them: the patch fixit_compile.py wrote to $RUNNER_TEMP/fixit-compile, for the cmuxterm-hq fixit-compile
      # reconciler (tools/ci-oops/fixit_push.py, which reads a run's `fixit-compile-*` artifacts) to push onto a
      # lane/* branch as a fixup commit (ci-oops 0a). No patch, no artifact.
      - name: Upload the fixit-compile patch
        if: ${{ failure() && !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fixit-compile-${{ github.job }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fixit-compile
          if-no-files-found: ignore
          retention-days: 3

  # The `web-browser` job: the browser suites (Playwright and real Chrome), on their own warm Linux VM so a
  # webview change never waits behind the linux job's guards, and a change that routes no browser step starts no
  # runner here. Each step installs the browser engines it launches (`playwright install --with-deps`, apt through
  # sudo, which the pool's runners grant as they did for ci-web.yml's jobs).
  web-browser:
    name: web-browser
    if: ${{ inputs.jobs == '' || contains(fromJSON(inputs.jobs), 'web-browser') }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-4vcpu-ubuntu-2404' || vars.CI_OVERFLOW_LINUX || 'cmux-linux' }}
    # Setup (10 min), the tool downloads (3 min), the web-browser steps two at once, each wave as long as its slowest
    # step, then each `alone` step (tests/test_ci_step_table.py holds this).
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout the merge commit and the base tip
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: List the changed paths
        run: |
          if git rev-parse -q --verify 'HEAD^2' >/dev/null; then
            git diff --name-only --no-renames -z 'HEAD^1' HEAD > "$RUNNER_TEMP/changed-paths.txt"
            echo "PATHS_FILE=$RUNNER_TEMP/changed-paths.txt" >> "$GITHUB_ENV"
            tr -cd '\0' < "$RUNNER_TEMP/changed-paths.txt" | wc -c
          else
            echo "::notice::No merge commit to diff: every web-browser step runs."
          fi
      - name: Run the routed web-browser steps (ci/steps.toml)
        run: ci/run run --job web-browser ${PATHS_FILE:+--paths-file "$PATHS_FILE"}
      # The real-daemon pane checks' measurements (the agent-pane-real-acpmux step writes $RUNNER_TEMP/agent-pane-real-acpmux).
      - name: Upload the agent pane measurements
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-pane-real-acpmux-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/agent-pane-real-acpmux
          if-no-files-found: ignore
          retention-days: 3
  # The `ios` job's Mac: an idle owned simulator Mac first (scripts/ci/ios_runner_pool.py, the `pipeline` lane: one
  # simulator job on one Mac), Blacksmith macOS 26 on a re-run, a fork or a fork owner. The markers let the pool
  # charge this run's simulator while it holds one, as cmux-next-ios-kit.yml's and ios-reliability-matrix.yml's
  # pickers do. Not a job of ci/steps.toml: it runs no step, only places the ios job, and only when that runs.
  ios-runner:
    name: ios runner
    if: ${{ inputs.jobs == '' || contains(fromJSON(inputs.jobs), 'ios') }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-4vcpu-ubuntu-2404' || vars.CI_OVERFLOW_LINUX || 'cmux-linux' }}
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      runs_on: ${{ steps.pool.outputs.runs_on }}
      retry_runs_on: ${{ steps.pool.outputs.retry_runs_on }}
      label: ${{ steps.pool.outputs.label }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: |
            scripts/ci/ios_runner_pool.py
            scripts/ci/e2e_runner_pool.py
            scripts/ci/pr_runner_pool.py
            scripts/ci/github_spend.py
            scripts/ci/simple_pool_picker.py
            scripts/ci/deadline_http.py
            scripts/ci/warm_distance.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Mint the owned-pool routing token
        id: route-token
        if: github.event.pull_request.head.repo.full_name == github.repository && vars.CI_PR_POOL_OWNED == '1' && vars.CI_IOS_OWNED == '1' && vars.GLAEDA_ROUTE_APP_ID != ''
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.GLAEDA_ROUTE_APP_ID }}
          private-key: ${{ secrets.GLAEDA_ROUTE_APP_KEY }}
          permission-administration: read
          # Queue, job and capacity-snapshot reads use this App's quota.
          permission-actions: read
          permission-organization-self-hosted-runners: read
      - name: Mint the repository routing token
        id: route-token-repo
        if: steps.route-token.outcome == 'failure'
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.GLAEDA_ROUTE_APP_ID }}
          private-key: ${{ secrets.GLAEDA_ROUTE_APP_KEY }}
          permission-administration: read
          permission-actions: read
      - name: Pick the macOS pool
        id: pool
        env:
          CI_RUNNER_STATE: ${{ vars.CI_RUNNER_STATE }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ROUTE_TOKEN: ${{ steps.route-token.outputs.token || steps.route-token-repo.outputs.token }}
          FORK_PULL_REQUEST: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          RUNNER_VARIABLE: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-6vcpu-macos-26' || vars.MACOS_RUNNER_TESTS || vars.MACOS_RUNNER_IOS }}
          IOS_OWNED: ${{ vars.CI_IOS_OWNED }}
          POOL_OWNED: ${{ vars.CI_PR_POOL_OWNED }}
          OWNED_SLOTS: ${{ vars.CI_OWNED_POOL_SLOTS }}
          PR_XCODE_APP: ${{ github.event.pull_request.head.repo.full_name == github.repository && vars.CMUX_CI_XCODE_APP_PR || '' }}
          POOL_ORDER: ${{ vars.CI_PR_POOL_ORDER }}
          POOL_MAX_QUEUED: ${{ vars.CI_PR_POOL_MAX_QUEUED }}
        run: |
          set -euo pipefail
          python3 scripts/ci/ios_runner_pool.py \
            --lane pipeline --fork "$FORK_PULL_REQUEST" --requested auto \
            --variable "$RUNNER_VARIABLE" --ios-owned "$IOS_OWNED" --owned "$POOL_OWNED" \
            --owned-slots "$OWNED_SLOTS" --pr-xcode-app "$PR_XCODE_APP" --order "$POOL_ORDER" \
            --max-queued "$POOL_MAX_QUEUED" --queue-rounds 0 \
            --device-family iphone | tee -a "$GITHUB_OUTPUT"
      - name: Create the owned-pool marker
        id: marker
        if: steps.pool.outputs.persistent == 'true' && github.run_attempt == 1
        continue-on-error: true
        run: |
          set -euo pipefail
          marker="$RUNNER_TEMP/macos-pool-persistent.json"
          echo '{}' > "$marker"
          echo "path=$marker" >> "$GITHUB_OUTPUT"
      - name: Upload the persistent pool marker
        if: steps.marker.outputs.path != ''
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-pool-persistent-${{ github.run_id }}-${{ github.run_attempt }}-1-${{ steps.pool.outputs.label }}
          path: ${{ steps.marker.outputs.path }}
          retention-days: 1
      - name: Upload the simulator capacity marker
        if: steps.marker.outputs.path != ''
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-pool-persistent-${{ github.run_id }}-${{ github.run_attempt }}-1-glaeda-ios-sim
          path: ${{ steps.marker.outputs.path }}
          retention-days: 1
      - name: Upload the owned-pool watch marker
        if: steps.marker.outputs.path != ''
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: owned-pool-watch
          path: ${{ steps.marker.outputs.path }}
          retention-days: 1

  # The `ios` job: the CmuxMobileKit tests and the reliability matrix's phone cells (ci/steps.toml's ios steps), on
  # the Mac ios-runner picked, one iPhone simulator, one step after the other.
  ios:
    name: ios
    needs: [ios-runner]
    if: ${{ inputs.jobs == '' || contains(fromJSON(inputs.jobs), 'ios') }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-6vcpu-macos-26' || fromJSON(github.run_attempt > 1 && needs.ios-runner.outputs.retry_runs_on || needs.ios-runner.outputs.runs_on) }}
    # ci/run's setup (10 min) and tool downloads (3 min), then the `alone` kit (60 min) and phone cells (45 min), with
    # room for the checkout and Xcode (tests/test_ci_step_table.py holds this).
    timeout-minutes: 125
    permissions:
      contents: read
    env:
      CMUX_CI_XCODE_APP: ${{ github.run_attempt == 1 && startsWith(needs.ios-runner.outputs.label, 'glaeda-') && github.event.pull_request.head.repo.full_name == github.repository && vars.CMUX_CI_XCODE_APP_PR || '' }}
    steps:
      - name: Checkout the merge commit and the base tip
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 2
          submodules: false
          # An owned Mac reuses its workspace: keep the ignored cargo target, so the xcframework builds incrementally.
          clean: false
      - name: List the changed paths
        run: |
          if git rev-parse -q --verify 'HEAD^2' >/dev/null; then
            git diff --name-only --no-renames -z 'HEAD^1' HEAD > "$RUNNER_TEMP/changed-paths.txt"
            echo "PATHS_FILE=$RUNNER_TEMP/changed-paths.txt" >> "$GITHUB_ENV"
            tr -cd '\0' < "$RUNNER_TEMP/changed-paths.txt" | wc -c
          else
            echo "::notice::No merge commit to diff: every ios step runs."
          fi
      # A reused workspace keeps what earlier jobs left untracked; the ignored builds stay.
      - name: Drop untracked leftovers (self-hosted reused workspace)
        run: git clean -ffd
      # owned_pool_rescue.py reads this step by name.
      - name: Select Xcode
        run: ./scripts/select-ci-xcode.sh
      - name: Run the routed ios steps (ci/steps.toml)
        run: ci/run run --job ios ${PATHS_FILE:+--paths-file "$PATHS_FILE"}
