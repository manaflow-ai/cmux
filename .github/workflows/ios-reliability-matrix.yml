name: iOS reliability matrix

# The iOS connectivity and reliability matrix
# (cmux-next-ios/reliability-matrix/cells.json): network, app state, host side,
# scale and pairing cells, each with a small and a degenerate ("god") variant
# held to 1.2x of the small one. Pattern page: cmuxterm-hq
# docs/handbook/patterns/ios-connectivity-matrix.md.
#
# - protocol (Linux): every test of the cmux-next-ios/rust workspace, which no
#   other job ran: the link suites (roaming, loopback, hybrid, media), the
#   host suites and the matrix cells in
#   cmux-mobile-host/tests/reliability_matrix.rs (real Link, real host
#   services, fake daemon, a toxic pipe for latency, loss and outages).
# - ios (an owned simulator mini, iOS simulator): the phone's cells in
#   CmuxMobileLiveTests/ConnectivityMatrixTests.swift and the existing tests
#   the catalog names (link recovery, cached lists), and the terminal
#   projection's resize harness on the phone (TerminalProjectionResizeHarnessTests).
# - report: one table in the run summary (scripts/ci/ios_reliability_matrix.py);
#   it fails when a cell marked `gate: true` fails. Nightly runs the same full
#   matrix on feat-cmux-next.
# A feat-cmux-next pull request runs the matrix as steps of ci/steps.toml (CI v2 step 11): the protocol cells as
# the linux job's `ios-matrix-protocol`, the phone cells as the ios job's `ios-phone-cells`, each with its suite's
# report. This workflow keeps the push to feat-cmux-next, the nightly and the dispatch.
on:
  push:
    branches: [feat-cmux-next]
    paths:
      - "cmux-next-ios/rust/**"
      - "cmux-next-ios/CmuxMobileKit/Sources/CmuxMobileLive/**"
      - "cmux-next-ios/CmuxMobileKit/Sources/CmuxMobileTransport/**"
      - "cmux-next-ios/CmuxMobileKit/Sources/CmuxMobileLinkFFI/**"
      - "cmux-next-ios/CmuxMobileKit/Tests/CmuxMobileLiveTests/**"
      - "cmux-next-ios/reliability-matrix/**"
      - "cmux-next-ios/CmuxMobileKit/Sources/CmuxMobileTerminal/**"
      - "cmux-next-ios/CmuxMobileKit/Tests/CmuxMobileTerminalTests/TerminalProjection*"
      - "cmux-tui/crates/cmux-terminal-projection/**"
      - "cmux-tui/crates/cmux-wg/**"
      - "cmux-tui/crates/cmux-transport/**"
      - "cmux-tui/vendor/smoltcp/**"
      - "scripts/ci/ios_reliability_matrix.py"
      - ".github/workflows/ios-reliability-matrix.yml"
  schedule:
    # Nightly, full matrix (08:17Z).
    - cron: "17 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A dispatch (main's nightly cron) or a schedule gets a group of its own: with
  # cancel-in-progress false, GitHub still cancels a run pending in a group when a newer
  # one joins it, so a nightly queued behind a running push run would be dropped by the
  # next push (cmux-next-ios-kit.yml's nightly 43572826977, 2026-11-14).
  group: ios-reliability-matrix-${{ github.ref }}${{ contains(fromJSON('["workflow_dispatch","schedule"]'), github.event_name) && format('-nightly-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Temporary REST budget attribution: one gh-call line per GitHub API call (scripts/ci/api_call_log/env.sh, fetched at a fixed commit when the checkout has no copy).
  BASH_ENV: '$({ w="${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh"; t="${RUNNER_TEMP:-/nonexistent}/api-call-log-src"; if [ -f "$w" ]; then echo "$w"; elif [ -n "${RUNNER_TEMP:-}" ]; then if [ ! -f "$t/env.sh" ] && [ ! -e "$t.tried" ] && { [ "${RUNNER_OS:-}" = Linux ] || [ "${RUNNER_OS:-}" = macOS ]; } && [ "$(date -u +%Y%m%d%H)" -lt 2026112300 ]; then : > "$t.tried"; mkdir -p "$t.part" && for x in env.sh gh sitecustomize.py isolated.py; do curl -fsSL --max-time 5 -o "$t.part/$x" "https://raw.githubusercontent.com/manaflow-ai/cmux/27647ffd3ae838c63be28ca3e5883dcd68c34518/scripts/ci/api_call_log/$x" || break; done; [ -s "$t.part/isolated.py" ] && mv "$t.part" "$t"; fi; if [ -f "$t/env.sh" ]; then echo "$t/env.sh"; else echo unset BASH_ENV > "$t.off.sh" && echo "$t.off.sh"; fi; fi; } 2>/dev/null)'
  CARGO_TERM_COLOR: never

jobs:
  # Pick an idle owned Mac with an iOS simulator with the phone-cells lane of
  # scripts/ci/ios_runner_pool.py (one simulator job on one Mac; when the
  # pool's simulator runners are full, a mini's sim-first runner with a free
  # simulator), then fall back to Blacksmith on retries. The markers let the
  # pool charge this run's simulator while it holds one.
  runner:
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft != true || contains(github.event.pull_request.labels.*.name, 'full-ci') || (vars.CI_DRAFT_CHEAP_TIER || '1') == '0') }}
    environment: ${{ !contains(fromJSON('["pull_request","merge_group"]'), github.event_name) && 'ci-routing-agent' || '' }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-4vcpu-ubuntu-2404' || 'cmux-linux' }}
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      runs_on: ${{ steps.pool.outputs.runs_on }}
      retry_runs_on: ${{ steps.pool.outputs.retry_runs_on }}
      label: ${{ steps.pool.outputs.label }}
      persistent: ${{ steps.pool.outputs.persistent }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: |
            scripts/ci/ios_runner_pool.py
            scripts/ci/e2e_runner_pool.py
            scripts/ci/pr_runner_pool.py
            scripts/ci/github_spend.py
            scripts/ci/simple_pool_picker.py
            scripts/ci/deadline_http.py
            scripts/ci/warm_distance.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Mint the owned-pool routing token
        id: route-token
        if: (github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && vars.CI_PR_POOL_OWNED == '1' && vars.CI_IOS_OWNED == '1' && vars.GLAEDA_ROUTE_APP_ID != ''
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.GLAEDA_ROUTE_APP_ID }}
          private-key: ${{ secrets.GLAEDA_ROUTE_APP_KEY }}
          permission-administration: read
          # Queue, job and capacity-snapshot reads use this App's quota.
          permission-actions: read
          permission-organization-self-hosted-runners: read
      - name: Mint the repository routing token
        id: route-token-repo
        if: steps.route-token.outcome == 'failure'
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.GLAEDA_ROUTE_APP_ID }}
          private-key: ${{ secrets.GLAEDA_ROUTE_APP_KEY }}
          permission-administration: read
          permission-actions: read
      - name: Pick the macOS pool
        id: pool
        env:
          # The overflow switch the granted default reads (ios_runner_pool.py granted_default()).
          CI_OVERFLOW_MAC: ${{ vars.CI_OVERFLOW_MAC }}
          CI_RUNNER_STATE: ${{ vars.CI_RUNNER_STATE }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ROUTE_TOKEN: ${{ steps.route-token.outputs.token || steps.route-token-repo.outputs.token }}
          FORK_PULL_REQUEST: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          RUNNER_VARIABLE: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-6vcpu-macos-26' || vars.MACOS_RUNNER_TESTS || vars.MACOS_RUNNER_IOS }}
          IOS_OWNED: ${{ vars.CI_IOS_OWNED }}
          POOL_OWNED: ${{ vars.CI_PR_POOL_OWNED }}
          OWNED_SLOTS: ${{ vars.CI_OWNED_POOL_SLOTS }}
          PR_XCODE_APP: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && vars.CMUX_CI_XCODE_APP_PR || '' }}
          POOL_ORDER: ${{ vars.CI_PR_POOL_ORDER }}
          POOL_MAX_QUEUED: ${{ vars.CI_PR_POOL_MAX_QUEUED }}
        run: |
          set -euo pipefail
          python3 scripts/ci/ios_runner_pool.py \
            --lane phone-cells --fork "$FORK_PULL_REQUEST" --requested auto \
            --variable "$RUNNER_VARIABLE" --ios-owned "$IOS_OWNED" --owned "$POOL_OWNED" \
            --owned-slots "$OWNED_SLOTS" --pr-xcode-app "$PR_XCODE_APP" --order "$POOL_ORDER" \
            --max-queued "$POOL_MAX_QUEUED" --queue-rounds 0 \
            --device-family iphone | tee -a "$GITHUB_OUTPUT"
      - name: Create the owned-pool marker
        id: marker
        if: steps.pool.outputs.persistent == 'true' && github.run_attempt == 1
        continue-on-error: true
        run: |
          set -euo pipefail
          marker="$RUNNER_TEMP/macos-pool-persistent.json"
          echo '{}' > "$marker"
          echo "path=$marker" >> "$GITHUB_OUTPUT"
      - name: Upload the persistent pool marker
        if: steps.marker.outputs.path != ''
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-pool-persistent-${{ github.run_id }}-${{ github.run_attempt }}-1-${{ steps.pool.outputs.label }}
          path: ${{ steps.marker.outputs.path }}
          retention-days: 1
      - name: Upload the simulator capacity marker
        if: steps.marker.outputs.path != ''
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-pool-persistent-${{ github.run_id }}-${{ github.run_attempt }}-1-glaeda-ios-sim
          path: ${{ steps.marker.outputs.path }}
          retention-days: 1
      - name: Upload the owned-pool watch marker
        if: steps.marker.outputs.path != ''
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: owned-pool-watch
          path: ${{ steps.marker.outputs.path }}
          retention-days: 1

  protocol:
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft != true || contains(github.event.pull_request.labels.*.name, 'full-ci') || (vars.CI_DRAFT_CHEAP_TIER || '1') == '0') }}
    name: protocol cells (Linux)
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-4vcpu-ubuntu-2404' || 'cmux-linux' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'schedule' && 'feat-cmux-next' || '' }}

      - name: Set up pinned Rust
        uses: ./.github/actions/setup-cmux-tui-rust

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && github.event_name != 'merge_group' && contains(fromJSON('["refs/heads/main","refs/heads/feat-cmux-next","refs/heads/nightly-next"]'), github.ref) }}
          # Why: docs/ci/cmux-next-workflow-notes.md#note-210 (pool runners keep different leftover toolchains)
          add-rust-environment-hash-key: false
          cache-bin: false
          workspaces: cmux-next-ios/rust
          key: ios-reliability-matrix

      - name: cargo test (cmux-next-ios/rust workspace, matrix cells included)
        working-directory: cmux-next-ios/rust
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/matrix"
          # Every suite, no early stop: the report decides what gates. The
          # matrix cells time themselves, so they run one at a time, in
          # release (the app's host and the phone's FFI ship optimized).
          { cargo test --locked --workspace --no-fail-fast ;
            cargo test --release --locked -p cmux-mobile-host --test reliability_matrix --no-fail-fast -- --ignored --nocapture --test-threads=1 ; } \
            2>&1 | tee "$RUNNER_TEMP/matrix/rust.log" || true

      # Mac scroll to iPhone display (Leo, 2026-11-22, ask-0e9bbe35bb), Mac idle and Mac CPU busy
      # (one spinning thread per core), over the good-wifi shaper: this step fails when either
      # arm's p95 passes tests/scroll_to_display_baseline.json's limit. The rows go to the summary.
      - name: Scroll-to-display gate (idle and loaded Mac CPU)
        working-directory: cmux-next-ios/rust
        run: |
          set -o pipefail
          cargo test --release --locked -p cmux-mobile-host --test scroll_to_display -- --ignored --nocapture --test-threads=1 \
            2>&1 | tee "$RUNNER_TEMP/matrix/scroll.log"
        timeout-minutes: 10

      - name: Scroll-to-display rows
        if: ${{ !cancelled() }}
        run: |
          { echo '### Mac scroll to phone display (ms)'; echo '```';
            grep -E '^SCROLL-(ROW|GATE)' "$RUNNER_TEMP/matrix/scroll.log" || echo 'no rows';
            echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: matrix-rust-log
          path: |
            ${{ runner.temp }}/matrix/rust.log
            ${{ runner.temp }}/matrix/scroll.log
          retention-days: 3

  ios:
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft != true || contains(github.event.pull_request.labels.*.name, 'full-ci') || (vars.CI_DRAFT_CHEAP_TIER || '1') == '0') }}
    needs: [runner]
    name: phone cells (iOS simulator)
    # An owned simulator mini from the runner job, Blacksmith macOS 26 on a re-run or a fork.
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-6vcpu-macos-26' || fromJSON(github.run_attempt > 1 && needs.runner.outputs.retry_runs_on || needs.runner.outputs.runs_on) }}
    timeout-minutes: 60
    env:
      CMUX_CI_XCODE_APP: ${{ github.run_attempt == 1 && startsWith(needs.runner.outputs.label, 'glaeda-') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.CMUX_CI_XCODE_APP_PR || '' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'schedule' && 'feat-cmux-next' || '' }}

      - name: Select Xcode
        run: ./scripts/select-ci-xcode.sh

      # CmuxMobileLinkFFI.xcframework is built only when what it is built from changes
      # (.github/scripts/ios_link_ffi_key.py): each job built it from scratch,
      # about 3 minutes of a Mac (run 43652999096). A pull request only
      # reads the cache; other events save what they built.
      - name: The framework's inputs
        id: ffi-key
        run: |
          set -euo pipefail
          # A ref from before the key script, or a key that fails, builds as before.
          if [ -f .github/scripts/ios_link_ffi_key.py ]; then
            python3 -I .github/scripts/ios_link_ffi_key.py --repo . --explain \
              --extra "xcode=$(xcodebuild -version | tr '\n' ' ')" --extra "runner=$RUNNER_OS-$RUNNER_ARCH" >> "$GITHUB_OUTPUT" \
              || echo "::warning::no cache key for CmuxMobileLinkFFI.xcframework; building it"
          fi
      - name: Restore the framework built from the same inputs
        id: ffi
        if: steps.ffi-key.outputs.key != ''
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            cmux-next-ios/CmuxMobileKit/Frameworks/CmuxMobileLinkFFI.xcframework
            cmux-next-ios/CmuxMobileKit/Sources/CmuxMobileLinkFFI/CmuxMobileLinkFFI.swift
          key: ios-link-ffi-xcframework-${{ steps.ffi-key.outputs.key }}
      - name: Set up pinned Rust
        if: steps.ffi.outputs.cache-hit != 'true'
        uses: ./.github/actions/setup-cmux-tui-rust

      - name: Cache cargo
        if: steps.ffi.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && github.event_name != 'merge_group' && contains(fromJSON('["refs/heads/main","refs/heads/feat-cmux-next","refs/heads/nightly-next"]'), github.ref) }}
          # Why: docs/ci/cmux-next-workflow-notes.md#note-210 (pool runners keep different leftover toolchains)
          add-rust-environment-hash-key: false
          cache-bin: false
          workspaces: cmux-next-ios/rust
          key: ios-reliability-matrix-apple

      - name: Build CmuxMobileLinkFFI.xcframework
        if: steps.ffi.outputs.cache-hit != 'true'
        env:
          JOBS: "4"
        run: bash cmux-next-ios/rust/scripts/build-xcframework.sh
      - name: Save the framework for later runs
        if: steps.ffi-key.outputs.key != '' && steps.ffi.outputs.cache-hit != 'true' && github.event_name != 'pull_request'
        # Another job saving the same key first is not a failure.
        continue-on-error: true
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            cmux-next-ios/CmuxMobileKit/Frameworks/CmuxMobileLinkFFI.xcframework
            cmux-next-ios/CmuxMobileKit/Sources/CmuxMobileLinkFFI/CmuxMobileLinkFFI.swift
          key: ios-link-ffi-xcframework-${{ steps.ffi-key.outputs.key }}

      - name: xcodebuild test (matrix cells)
        working-directory: cmux-next-ios/CmuxMobileKit
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/matrix"
          udid="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          found = sorted(
              (runtime, device["udid"])
              for runtime, items in devices.items()
              if ".SimRuntime.iOS-26" in runtime
              for device in items
              if device["name"].startswith("iPhone")
          )
          print(found[-1][1] if found else "")
          ')"
          if [[ -z "$udid" ]]; then
            echo "::error::no available iOS 26 iPhone simulator on this runner" >&2
            exit 1
          fi
          echo "simulator $udid"
          # Not -quiet: the report reads each test's result and its MATRIX lines.
          xcodebuild test -scheme CmuxMobileKit-Package -destination "id=$udid,arch=arm64" \
            -enableCodeCoverage NO -derivedDataPath "${CMUX_DERIVED_DATA_SLOT:-$RUNNER_TEMP/dd-ios-sim}" CODE_SIGNING_ALLOWED=NO \
            -only-testing:CmuxMobileLiveTests/ConnectivityMatrixTests \
            -only-testing:CmuxMobileLiveTests/LinkRecoveryTests \
            -only-testing:CmuxMobileLiveTests/PairingRetryTests \
            -only-testing:CmuxMobileWorkspacesTests/WorkspacesLaunchStateTests \
            -only-testing:CmuxMobileTerminalTests/TerminalProjectionResizeHarnessTests \
            2>&1 | tee "$RUNNER_TEMP/matrix/ios.log" || true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: matrix-ios-log
          path: ${{ runner.temp }}/matrix/ios.log
          retention-days: 3

  report:
    name: matrix report
    needs: [protocol, ios]
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft != true || contains(github.event.pull_request.labels.*.name, 'full-ci') || (vars.CI_DRAFT_CHEAP_TIER || '1') == '0') && (!cancelled()) }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-4vcpu-ubuntu-2404' || 'cmux-linux' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/ci/ios_reliability_matrix.py
            cmux-next-ios/reliability-matrix
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: matrix-*-log
          path: logs
          merge-multiple: true
      - name: Matrix table
        env:
          PROTOCOL_RESULT: ${{ needs.protocol.result }}
          IOS_RESULT: ${{ needs.ios.result }}
        run: |
          set -o pipefail
          needs_verdict() {  # scripts/ci/needs_verdict.py SHELL_RULE, copied verbatim (tests/test_needs_verdict.py)
            local what=$1 failed="" unjudged="" pair name result; shift
            for pair in "$@"; do
              name=${pair%%=*}; result=${pair#*=}
              if [[ "$name" == *"?" ]]; then name=${name%"?"}; [[ "$result" == skipped ]] && result=success; fi
              case "${result%%[ :]*}" in
                success) ;;
                failure|invalid) failed+=" $name: $result;" ;;
                *) unjudged+=" $name ${result:-none}," ;;
              esac
            done
            if [[ -n "$failed" ]]; then echo "::error::summary red: $what:${failed%;}"; return 1; fi
            if [[ -n "$unjudged" ]]; then
              echo "::error::no verdict: $what:${unjudged%,}; nothing it summarizes was judged: re-run the run"; return 3
            fi
            echo "$what: every job passed"
          }
          # The jobs' results first (scripts/ci/needs_verdict.py): one that judged nothing is no verdict, never a
          # table read from a partial log; a red still prints the table, then stays red.
          verdict=0
          needs_verdict "iOS reliability matrix" "protocol?=$PROTOCOL_RESULT" "ios?=$IOS_RESULT" || verdict=$?
          (( verdict != 3 )) || exit 3
          args=()
          [[ "$PROTOCOL_RESULT" != "skipped" ]] && args+=(--rust logs/rust.log)
          [[ "$IOS_RESULT" != "skipped" ]] && args+=(--ios logs/ios.log)
          if (( verdict )); then
            python3 scripts/ci/ios_reliability_matrix.py "${args[@]}" --json matrix.json | tee -a "$GITHUB_STEP_SUMMARY" || true
            exit "$verdict"
          fi
          python3 scripts/ci/ios_reliability_matrix.py "${args[@]}" --json matrix.json | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: matrix-results
          path: matrix.json
          retention-days: 3
