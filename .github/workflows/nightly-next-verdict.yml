name: nightly-next verdict
# The durable canary verdict of one cmux NEXT build (docs/ci/nightly-next-train.md).
# nightly-next-canary.yml dispatches it after each scheduled check of a feed
# build; it writes verdicts/<build>.json next to the cmux NEXT appcast in R2
# (https://files-next.cmux.com/nightly-next/next/verdicts/<build>.json). The
# train's base is the newest feed build whose verdict is `pass`
# (scripts/ci/nightly_next_train.py base). The Actions cache the canary keeps
# is only its "already checked" marker; it expires, this does not.
#
# Trust: the run reads the build's commit itself (the build number is
# `<nightly-next run id><attempt>`; that run's head on nightly-next), and a
# `pass` counts only when canary_run is a scheduled nightly-next-canary.yml run
# of this repository whose `canary <build>` job succeeded. `fail` and
# `skipped` never make a build a base, so they are written as given.
#
# Release rings (scripts/ci/nightly_next_ring.py): with repository variable
# NIGHTLY_NEXT_DEV_RING=on, nightly.yml publishes each new build as
# cmux-next-dev (Dev only). After writing a verdict, this run sets every feed
# item's channel from the verdicts again, so a build whose canary passed moves
# to cmux-next (Nightly, and every build from before rings). With the variable
# off, every item goes back to cmux-next.
#
# Run it on branch nightly-next; release-next, which holds the feed's R2
# token, deploys only to that branch. GitHub registers a dispatch workflow
# only from the default branch, so this file is on main too; a run there
# does nothing.
on:
  workflow_dispatch:
    inputs:
      build:
        description: cmux NEXT build number (digits)
        required: true
        type: string
      verdict:
        description: pass, fail or skipped
        required: true
        type: string
      canary_run:
        description: The nightly-next-canary.yml run that checked the build (its id)
        required: true
        type: string

permissions: {}

concurrency:
  group: nightly-next-verdict-${{ inputs.build }}
  cancel-in-progress: false

env:
  # The same values as nightly.yml; nightly-next-guard.py checks every write against them.
  NIGHTLY_NEXT_FEED_BASE: https://files-next.cmux.com/nightly-next/next
  NIGHTLY_NEXT_R2_BUCKET: cmux-nightly-next
  NIGHTLY_NEXT_R2_PREFIX: nightly-next/next/
  NIGHTLY_APPCAST: appcast-arm64.xml
  # The old cmux NIGHTLY-identity feed (nightly.yml NIGHTLY_NEXT_LEGACY_FEED_BASE):
  # the same builds signed as cmux NIGHTLY, on the same rings.
  NIGHTLY_NEXT_LEGACY_FEED_BASE: https://files-next.cmux.com/nightly-next
  NIGHTLY_NEXT_LEGACY_R2_PREFIX: nightly-next/

jobs:
  write:
    if: github.repository == 'manaflow-ai/cmux' && github.ref == 'refs/heads/nightly-next'
    environment: release-next
    permissions:
      actions: read
      contents: read
    # A literal ephemeral label: this job holds the feed's write token.
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/ci/nightly_next_train.py
            scripts/ci/nightly_next_fix_forward.py
            scripts/ci/nightly-next-guard.py
            scripts/ci/nightly_next_ring.py
            scripts/ci/upload-r2-object.py
          sparse-checkout-cone-mode: false

      - name: Check the verdict and write the document
        id: doc
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD: ${{ inputs.build }}
          VERDICT: ${{ inputs.verdict }}
          CANARY_RUN: ${{ inputs.canary_run }}
        run: |
          set -euo pipefail
          python3 scripts/ci/nightly_next_train.py verdict-check \
            --repo "$GITHUB_REPOSITORY" --build "$BUILD" --verdict "$VERDICT" \
            --canary-run "$CANARY_RUN" --out "verdict.json"
          echo "key=${NIGHTLY_NEXT_R2_PREFIX}verdicts/${BUILD}.json" >> "$GITHUB_OUTPUT"

      - name: Upload the verdict
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.NIGHTLY_NEXT_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.NIGHTLY_NEXT_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: "https://${{ secrets.NIGHTLY_NEXT_R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
          KEY: ${{ steps.doc.outputs.key }}
        run: |
          set -euo pipefail
          python3 scripts/ci/nightly-next-guard.py r2-key "$NIGHTLY_NEXT_R2_BUCKET" "$KEY"
          python3 scripts/ci/upload-r2-object.py \
            --file verdict.json \
            --endpoint-url "$R2_ENDPOINT" \
            --bucket "$NIGHTLY_NEXT_R2_BUCKET" \
            --key "$KEY" \
            --content-type "application/json" \
            --cache-control "no-cache, no-store, must-revalidate"
          # The same document beside the old feed: a cmux NIGHTLY-identity app
          # reads verdicts next to its own feed (Channels card, Go Back).
          legacy_key="${NIGHTLY_NEXT_LEGACY_R2_PREFIX}verdicts/${KEY##*/}"
          NIGHTLY_NEXT_R2_PREFIX="$NIGHTLY_NEXT_LEGACY_R2_PREFIX" python3 scripts/ci/nightly-next-guard.py r2-key "$NIGHTLY_NEXT_R2_BUCKET" "$legacy_key"
          python3 scripts/ci/upload-r2-object.py \
            --file verdict.json \
            --endpoint-url "$R2_ENDPOINT" \
            --bucket "$NIGHTLY_NEXT_R2_BUCKET" \
            --key "$legacy_key" \
            --content-type "application/json" \
            --cache-control "no-cache, no-store, must-revalidate" \
            || echo "::warning::the verdict was not copied beside the old feed ($legacy_key)"
          {
            echo "### nightly-next verdict"
            echo
            echo '```json'
            cat verdict.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Promotion: the feed's channels follow the verdicts. The write happens
      # only while the feed still holds the bytes read (If-Match on its ETag);
      # a publication that lands meanwhile wins, and it derives the channels
      # from the same verdicts (republish-nightly-deltas).
      - name: Move builds whose canary passed to Nightly
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.NIGHTLY_NEXT_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.NIGHTLY_NEXT_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: "https://${{ secrets.NIGHTLY_NEXT_R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
          DEV_RING: ${{ vars.NIGHTLY_NEXT_DEV_RING == 'on' && 'on' || 'off' }}
        run: |
          set -euo pipefail
          mkdir -p ring
          curl -fsSL --retry 3 -A "cmux-nightly-next-ring/1" -H "Cache-Control: no-cache" \
            -o ring/live.xml "${NIGHTLY_NEXT_FEED_BASE}/${NIGHTLY_APPCAST}?ring=${GITHUB_RUN_ID}"
          summary="$(python3 scripts/ci/nightly_next_ring.py retag --feed ring/live.xml \
            --out "ring/$NIGHTLY_APPCAST" --mode "$DEV_RING" --verdicts-base "$NIGHTLY_NEXT_FEED_BASE")"
          echo "$summary"
          if [ "$(python3 -I -c 'import json, sys; print(json.loads(sys.argv[1])["changed"])' "$summary")" != True ]; then
            echo "Release rings ($DEV_RING): the feed's channels already match the verdicts." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          key="${NIGHTLY_NEXT_R2_PREFIX}${NIGHTLY_APPCAST}"
          python3 scripts/ci/nightly-next-guard.py appcast "ring/$NIGHTLY_APPCAST"
          python3 scripts/ci/nightly-next-guard.py r2-key "$NIGHTLY_NEXT_R2_BUCKET" "$key"
          status=0
          python3 scripts/ci/upload-r2-object.py \
            --file "ring/$NIGHTLY_APPCAST" \
            --endpoint-url "$R2_ENDPOINT" \
            --bucket "$NIGHTLY_NEXT_R2_BUCKET" \
            --key "$key" \
            --content-type "application/xml" \
            --cache-control "no-cache, no-store, must-revalidate" \
            --replace-sha256 "$(shasum -a 256 ring/live.xml | awk '{print $1}')" --conflict-exit-code 3 || status=$?
          if [ "$status" = 3 ]; then
            echo "::notice title=nightly-next rings::the feed changed after this run read it; the newer write sets the channels from the same verdicts"
            exit 0
          fi
          [ "$status" = 0 ] || exit "$status"
          echo "Release rings ($DEV_RING): wrote the feed's channels $summary" >> "$GITHUB_STEP_SUMMARY"

      # The old cmux NIGHTLY-identity feed carries the same builds on the same
      # rings (nightly.yml publish-nightly-identity-legacy): the same promotion,
      # from the same verdicts. It runs after the NEXT feed's write, which a
      # failure here keeps; the run goes red so the two feeds are not left on
      # different rings quietly. The retag is derived from the verdicts, so a
      # re-run of this job (or the next verdict) repairs the old feed.
      - name: Move the old feed's builds whose canary passed to Nightly
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.NIGHTLY_NEXT_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.NIGHTLY_NEXT_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: "https://${{ secrets.NIGHTLY_NEXT_R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
          DEV_RING: ${{ vars.NIGHTLY_NEXT_DEV_RING == 'on' && 'on' || 'off' }}
        run: |
          set -euo pipefail
          mkdir -p legacy-ring
          curl -fsSL --retry 3 -A "cmux-nightly-next-ring/1" -H "Cache-Control: no-cache" \
            -o legacy-ring/live.xml "${NIGHTLY_NEXT_LEGACY_FEED_BASE}/${NIGHTLY_APPCAST}?ring=${GITHUB_RUN_ID}"
          summary="$(python3 scripts/ci/nightly_next_ring.py retag --feed legacy-ring/live.xml \
            --out "legacy-ring/$NIGHTLY_APPCAST" --mode "$DEV_RING" --verdicts-base "$NIGHTLY_NEXT_FEED_BASE")"
          echo "$summary"
          if [ "$(python3 -I -c 'import json, sys; print(json.loads(sys.argv[1])["changed"])' "$summary")" != True ]; then
            echo "Release rings ($DEV_RING): the old feed's channels already match the verdicts." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          key="${NIGHTLY_NEXT_LEGACY_R2_PREFIX}${NIGHTLY_APPCAST}"
          python3 scripts/ci/nightly-next-guard.py appcast "legacy-ring/$NIGHTLY_APPCAST"
          NIGHTLY_NEXT_R2_PREFIX="$NIGHTLY_NEXT_LEGACY_R2_PREFIX" python3 scripts/ci/nightly-next-guard.py r2-key "$NIGHTLY_NEXT_R2_BUCKET" "$key"
          status=0
          python3 scripts/ci/upload-r2-object.py \
            --file "legacy-ring/$NIGHTLY_APPCAST" \
            --endpoint-url "$R2_ENDPOINT" \
            --bucket "$NIGHTLY_NEXT_R2_BUCKET" \
            --key "$key" \
            --content-type "application/xml" \
            --cache-control "no-cache, no-store, must-revalidate" \
            --replace-sha256 "$(shasum -a 256 legacy-ring/live.xml | awk '{print $1}')" --conflict-exit-code 3 || status=$?
          if [ "$status" = 3 ]; then
            echo "::notice title=nightly-next rings::the old feed changed after this run read it; its next write sets the channels from the same verdicts"
            exit 0
          fi
          [ "$status" = 0 ] || exit "$status"
          echo "Release rings ($DEV_RING): wrote the old feed's channels $summary" >> "$GITHUB_STEP_SUMMARY"
