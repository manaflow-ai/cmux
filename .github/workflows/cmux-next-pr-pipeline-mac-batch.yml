name: cmux-next pr pipeline mac batch

# Every step of pr-pipeline.yml's `mac` job (ci/steps.toml: mac-fast-tier, every Swift suite of the fast tier) at
# one feat-cmux-next commit, in the post-merge batch (cmux-next-post-merge.yml, suite pr-pipeline-mac).
#
# Leo, 2026-11-21: "we need to absolutely get that f***ing CI V2, that Borg design up and running everywhere."
# A pull request runs only the fast tier suites its change reaches (the mac step's `--changed-files`); every suite
# still runs here, once a batch window and only when the window touched the step's inputs (the suite's paths in
# .github/post-merge-batch.json; tests/test_ci_post_merge_batch.py keeps them the steps' inputs), at the merged tip,
# where the batch's judge bisects a new red to its commit. This replaces cmux-next-fast-tier-batch.yml's Swift leg,
# which ran the same `fast-tier.py --kind swift` entries outside the table. The machine is pr-pipeline.yml's
# (vars.CI_OVERFLOW_MAC, else cmux-mac), and the Mac setup below is that job's. scripts/ci/mac_tiers.py routes the
# fast tier from the window's changed paths (inputs.base..sha; no base routes it), and once routed every suite runs.
# A dispatch runs this by hand.

on:
  workflow_call:
    inputs:
      sha:
        description: "The commit to test (the post-merge batch's tip or a bisect probe's commit). Empty: the event's own."
        type: string
        default: ""
      only:
        description: "The one job id to run (a bisect probe): mac. Empty: every job."
        type: string
        default: ""
      base:
        description: "The commit the window starts after (the post-merge batch's plan base, or a bisect probe's known-good commit): the steps run are the ones base..sha reaches. Empty: every step."
        type: string
        default: ""
  workflow_dispatch:

permissions: {}

concurrency:
  # A post-merge call (inputs.sha set) is keyed by its caller's run too: same-commit calls (a confirm round's red-1/red-2,
  # back-to-back probes) evicted or cancelled each other, and each lost call was dispatched again (cmux runs 45988834788, 45997396504).
  group: cmux-next-pr-pipeline-mac-batch${{ inputs.sha && format('-{0}-{1}', inputs.sha, inputs.only) || format('-{0}', github.run_id) }}${{ inputs.sha && format('-call-{0}', github.run_id) || '' }}
  cancel-in-progress: false

jobs:
  mac:
    name: mac
    if: ${{ (inputs.only == '' || inputs.only == 'mac') && github.repository == 'manaflow-ai/cmux' }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || vars.CI_OVERFLOW_MAC || 'cmux-mac' }}
    # pr-pipeline.yml's bound for the same job.
    timeout-minutes: 165
    permissions:
      contents: read
      # ci/run's step-result store (gh-events.cmux.com/github/step-results): the runner pool is off the tailnet.
      id-token: write
    env:
      # The batch is this commit's only run of the `alone` steps (nothing re-runs it): they run on a red job too.
      CI_RUN_ALONE_ON_RED: "1"
      CMUX_CI_XCODE_APP: ${{ vars.CMUX_CI_XCODE_APP_MACOS_26 }}
      CMUX_CI_REQUIRED_MACOS_SDK_MAJOR: "26"
    steps:
      - name: Checkout the commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.sha || '' }}
          persist-credentials: false
          fetch-depth: 2
          submodules: false
          # An owned Mac reuses its workspace: keep the ignored SwiftPM builds a clean would delete.
          clean: false
      # The paths base..sha changed (the batch window, or a probe's range from its known-good commit), for ci/run's
      # route. No base, or one this checkout cannot fetch, is an unknown change: every step runs.
      - name: List the paths the window changed
        if: ${{ inputs.base != '' }}
        timeout-minutes: 5
        continue-on-error: true
        env:
          BASE: ${{ inputs.base }}
          TOKEN: ${{ github.token }}
        run: |
          # GitHub 403s anonymous fetches from the office Macs' address: the fetch sends the job token.
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')
          if [[ "$BASE" =~ ^[0-9a-f]{40}$ ]] \
            && GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" \
              git fetch --no-tags --no-recurse-submodules --depth=1 origin "$BASE" \
            && git diff --name-only --no-renames -z "$BASE" HEAD > "$RUNNER_TEMP/changed-paths.txt"; then
            echo "PATHS_FILE=$RUNNER_TEMP/changed-paths.txt" >> "$GITHUB_ENV"
            echo "$(tr -cd '\0' < "$RUNNER_TEMP/changed-paths.txt" | wc -c | tr -d ' ') paths changed since $BASE"
          else
            echo "::notice::No window base to diff ('$BASE'): every step runs."
          fi
      - name: Route the Mac tiers
        id: tiers
        env:
          CI_PATHS_FILE: ${{ env.PATHS_FILE }}
        run: python3 -I scripts/ci/mac_tiers.py route --github-output "$GITHUB_OUTPUT"
      - name: Drop stale submodule checkouts (self-hosted reused workspace)
        if: steps.tiers.outputs.fast_tier == 'true'
        run: |
          scripts/ci/reset-stale-submodules.sh
          git clean -ffd
      # The fast tier's tests can start acpmux daemons: they get a home of this job's own.
      - name: Give this job its own acpmux home
        if: steps.tiers.outputs.fast_tier == 'true'
        run: |
          home="$RUNNER_TEMP/acpmux-home"
          rm -rf "$home" && mkdir -m 700 "$home"
          echo "ACPMUX_HOME=$home" >> "$GITHUB_ENV"
          # An inherited socket would still name another home's daemon; empty is unset.
          echo "ACPMUX_SOCKET=" >> "$GITHUB_ENV"
      # owned_pool_rescue.py reads this step by name.
      - name: Select Xcode
        if: steps.tiers.outputs.fast_tier == 'true'
        run: ./scripts/select-ci-xcode.sh
      # On an owned Mac the Swift steps build in a leased root every runner slot shares (owned_spm_scratch.py
      # lease); its holder process keeps the lease until the job ends, so this stays a workflow step.
      - name: Keep Swift package builds on this owned Mac
        id: spm-root
        if: steps.tiers.outputs.fast_tier == 'true' && contains(runner.name, '-glaeda')
        continue-on-error: true
        env:
          # GitHub 403s anonymous fetches from the office Macs' address: scripts/ci/github_fetch_auth.py
          GH_TOKEN: ${{ github.token }}
          CMUX_FAST_TIER_OWNED_SEED: ${{ (vars.CI_FAST_TIER_OWNED_SEED || '1') != '0' && '1' || '' }}
        run: |
          python3 scripts/ci/owned_spm_scratch.py lease "$GITHUB_WORKSPACE"
          python3 scripts/ci/swiftpm_prefetch_binary_artifacts.py --package-path Packages/macOS/CmuxNext
          python3 scripts/ci/github_fetch_auth.py || true
      - name: Name the build root
        if: steps.tiers.outputs.fast_tier == 'true'
        env:
          ROOT: ${{ steps.spm-root.outputs.root || github.workspace }}
        run: echo "CMUX_MAC_ROOT=$ROOT" >> "$GITHUB_ENV"
      # The fast tier's warm start: the newest base seed cmux-next-fast-tier-seed.yml saved (restore only).
      - name: Compute fast-tier cache keys
        id: fast-cache-key
        if: steps.tiers.outputs.fast_tier == 'true' && (!contains(runner.name, '-glaeda') || steps.spm-root.outputs.seed == '1')
        env:
          CMUX_FAST_CACHE_WORKSPACE: ${{ steps.spm-root.outputs.root || github.workspace }}
        run: scripts/cmux-next/fast-tier-cache-key.sh "$CMUX_FAST_CACHE_WORKSPACE" >> "$GITHUB_OUTPUT"
      - name: Restore the CmuxNext build
        id: fast-cache-restore
        if: steps.fast-cache-key.outputs.swift-key != ''
        continue-on-error: true
        uses: ./.github/actions/cache-restore
        env:
          CI_CACHE_R2_PUBLIC_URL: https://ci-cache-next.cmux.com
          CMUX_LAN_CACHE_TIMEOUT: "480"
        with:
          backend: r2
          path: ${{ format('{0}/Packages/macOS/CmuxNext/.build', steps.spm-root.outputs.root || github.workspace) }}
          key: ${{ steps.fast-cache-key.outputs.swift-key }}
          restore-keys: ${{ steps.fast-cache-key.outputs.swift-prefix }}
      - name: Name the restored seed
        id: fast-cache-seed
        if: steps.fast-cache-restore.outputs.cache-matched-key != ''
        env:
          MATCHED: ${{ steps.fast-cache-restore.outputs.cache-matched-key }}
          PREFIX: ${{ steps.fast-cache-key.outputs.swift-prefix }}
          SEED_ROOT: ${{ steps.spm-root.outputs.seed }}
        run: |
          echo "commit=${MATCHED#"$PREFIX"}" >> "$GITHUB_OUTPUT"
          if [[ "$SEED_ROOT" == 1 ]]; then python3 scripts/ci/owned_spm_scratch.py seeded; fi
      - name: Restore the CmuxHomeRender build of that seed
        if: steps.fast-cache-seed.outputs.commit != ''
        continue-on-error: true
        uses: ./.github/actions/cache-restore
        env:
          CI_CACHE_R2_PUBLIC_URL: https://ci-cache-next.cmux.com
          CMUX_LAN_CACHE_TIMEOUT: "480"
        with:
          backend: r2
          path: ${{ format('{0}/Packages/Shared/CmuxHomeRender/.build', steps.spm-root.outputs.root || github.workspace) }}
          key: ${{ steps.fast-cache-key.outputs.home-prefix }}${{ steps.fast-cache-seed.outputs.commit }}
      - name: Replay the seed's input times
        if: steps.fast-cache-seed.outputs.commit != ''
        continue-on-error: true
        env:
          ROOT: ${{ steps.spm-root.outputs.root || github.workspace }}
        run: python3 -I scripts/ci/e2e_warm_derived_data.py replay "$ROOT" "$ROOT/Packages/macOS/CmuxNext/.build/cmux-fast-tier-input-mtimes.json"
      # The steps the window reaches; mac-fast-tier then runs every Swift suite, not only the ones the window reaches
      # (CI_FAST_TIER_PR_SCOPE 0), as cmux-next-fast-tier-batch.yml's Swift leg did.
      - name: Run the routed mac steps (ci/steps.toml)
        env:
          CMUX_FAST_SWIFT_CACHE_KEY: ${{ steps.fast-cache-key.outputs.swift-key }}
          CMUX_FAST_SWIFT_CACHE_HIT: ${{ steps.fast-cache-restore.outputs.cache-hit }}
          CMUX_FAST_CACHE_MATCHED_KEY: ${{ steps.fast-cache-restore.outputs.cache-matched-key }}
          CI_FAST_TIER_PR_SCOPE: "0"
          CMUX_SWIFT_TEST_PRODUCTS: ${{ vars.CI_FAST_TIER_PRODUCTS_FLEET == '1' && 'fleet' || 'build' }}
          CMUX_FLEET_CONTROLLER: ${{ vars.CMUX_FLEET_CONTROLLER }}
        run: ci/run run --job mac ${PATHS_FILE:+--paths-file "$PATHS_FILE"}
      - name: Stop this job's acpmux daemons and remove its home
        if: ${{ always() && steps.tiers.outputs.fast_tier == 'true' }}
        continue-on-error: true
        timeout-minutes: 3
        run: |
          home="$RUNNER_TEMP/acpmux-home"
          [[ -d "$home" ]] || exit 0
          acpmux="$(PATH="$PATH:$HOME/.local/bin:$HOME/.cargo/bin:/opt/homebrew/bin:/usr/local/bin" command -v acpmux || true)"
          [[ -z "$acpmux" ]] || env -u ACPMUX_SOCKET ACPMUX_HOME="$home" "$acpmux" daemon shutdown --end-agents || true
          rm -rf "$home"
      - name: Upload fast-tier timing receipt
        if: ${{ always() && steps.tiers.outputs.fast_tier == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-next-fast-tier-batch-receipt-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cmux-next-fast-tier.json
          if-no-files-found: warn
          retention-days: 7  # retention-class: publish
