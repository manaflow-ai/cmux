name: acpmux simulation sweep

# The large run of acpmux's deterministic simulation (cmux-tui/crates/acpmux/tests/sim.rs,
# HQ#6740): thousands of seeds with every fault kind, a new window of seeds each run. The
# per-change run (cmux-tui-spec.yml, acpmux-sim) keeps a fixed window of a few hundred. A red
# run lists each failing seed with the command that replays it, in the log and the summary.
#
# A schedule fires only from the default branch's copy of this file, so landings on
# feat-cmux-next that touch acpmux run it too.
#
# Pull requests no longer run this sweep (an advisory check nothing read, ci-time-map cut, 2026-11-21): the per-change
# run in cmux-tui-spec.yml (acpmux-sim) covers a pull request; feat-cmux-next keeps the full sweep. (Its schedule was dropped: a schedule fires only from main's copy of this file,
# and main has none, so it never fired.)

on:
  # feat-cmux-next runs this in the post-merge batch (cmux-next-post-merge.yml, suite acpmux-sim-sweep
  # in .github/post-merge-batch.json, reached by cmux-tui/crates/acpmux/** and cmux-tui/Cargo.lock), not
  # once per merge: sha is the commit to test, only one job id a bisect probe runs alone. Each run sweeps
  # a new window of seeds (SIM_SEED_BASE), so a probe replays other seeds than the batch run that went
  # red; the red run's summary lists each failing seed with its replay command.
  workflow_call:
    inputs:
      sha:
        description: Commit to test (empty is the caller's commit).
        type: string
        default: ""
      only:
        description: Run only this job id (a bisect probe); empty runs every job.
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      seeds:
        description: "Seeds to run"
        required: false
        default: "4000"
        type: string
      faults:
        description: "SIM_FAULTS: a comma list of crash, power, network; or all, none"
        required: false
        default: "crash,network"
        type: string

# A started sweep always finishes: acpmux landings come often enough that cancelling on a
# newer push left no sweep finishing (the first one after #34601 was cancelled). The group
# still keeps at most one sweep running and one waiting, the newest.
concurrency:
  # A batch run and its bisect probes (one commit, one job each) never cancel one another.
  group: acpmux-sim-sweep-${{ github.ref }}${{ inputs.sha && format('-{0}-{1}', inputs.sha, inputs.only) || '' }}
  # A pull request's newer push replaces its older sweep.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Temporary REST budget attribution: one gh-call line per GitHub API call (scripts/ci/api_call_log/env.sh, fetched at a fixed commit when the checkout has no copy).
  BASH_ENV: '$({ w="${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh"; t="${RUNNER_TEMP:-/nonexistent}/api-call-log-src"; if [ -f "$w" ]; then echo "$w"; elif [ -n "${RUNNER_TEMP:-}" ]; then if [ ! -f "$t/env.sh" ] && [ ! -e "$t.tried" ] && { [ "${RUNNER_OS:-}" = Linux ] || [ "${RUNNER_OS:-}" = macOS ]; } && [ "$(date -u +%Y%m%d%H)" -lt 2026112300 ]; then : > "$t.tried"; mkdir -p "$t.part" && for x in env.sh gh sitecustomize.py isolated.py; do curl -fsSL --max-time 5 -o "$t.part/$x" "https://raw.githubusercontent.com/manaflow-ai/cmux/27647ffd3ae838c63be28ca3e5883dcd68c34518/scripts/ci/api_call_log/$x" || break; done; [ -s "$t.part/isolated.py" ] && mv "$t.part" "$t"; fi; if [ -f "$t/env.sh" ]; then echo "$t/env.sh"; else echo unset BASH_ENV > "$t.off.sh" && echo "$t.off.sh"; fi; fi; } 2>/dev/null)'

jobs:
  sweep:
    name: ${{ github.event_name == 'pull_request' && 'sim sweep' || 'acpmux simulation sweep' }} (${{ matrix.faults }}${{ matrix.resend == '0' && ', bare resend' || '' }}${{ matrix.known_gap && ', known gap' || '' }})${{ github.event_name == 'pull_request' && ' (advisory)' || '' }}
    if: ${{ (inputs.only == '' || inputs.only == 'sweep') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || 'cmux-linux' }}
    timeout-minutes: ${{ github.event_name == 'pull_request' && 45 || 90 }}
    strategy:
      fail-fast: false
      matrix:
        # The standard faults, and the bare resend the web pane sends (no resend flag), which
        # holds once the daemon dedupes every logged prompt id (invariants.rs).
        # A known gap leg runs options that show a gap in invariants.rs KNOWN_GAPS. A seed that
        # fails only by it (it holds once the gap's cause is taken away) is counted in the
        # summary, not failed; any other failing seed fails the leg like the standard one.
        include:
          - faults: crash,network
            resend: "1"
            known_gap: false
          - faults: crash,network
            resend: "0"
            known_gap: true
          - faults: power
            resend: "1"
            known_gap: true
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          # A batch run or probe tests inputs.sha; under the batch caller github.sha is its tip.
          ref: ${{ inputs.sha || github.sha }}

      # The sweep builds acpmux's test profile (several GiB of target) and then runs thousands of seeds; a pool host
      # admitted at the pool's per-job need had too little left (run 45768539377, 2026-11-26: "No space left on
      # device", 50 MB free, every leg). scripts/ci/pool-make-room.sh (cmux#58361) runs the pool hook's room phase
      # with this job's need, bounded; it never fails the job and does nothing off a pool host or before it lands.
      - name: Make room on the pool host
        if: runner.os == 'Linux' && startsWith(runner.name, 'cmux-runner-pool-')
        continue-on-error: true
        timeout-minutes: 3
        shell: bash
        run: |
          if [ -x scripts/ci/pool-make-room.sh ]; then
            scripts/ci/pool-make-room.sh "$((25 * 1024 * 1024 * 1024))" 120
          else
            df -h "$GITHUB_WORKSPACE" || true
          fi

      - name: Set up pinned Rust
        uses: ./.github/actions/setup-cmux-tui-rust

      - name: Cache cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Why: docs/ci/cmux-next-workflow-notes.md#note-210 (pool runners keep different leftover toolchains)
          add-rust-environment-hash-key: false
          cache-bin: false
          workspaces: cmux-tui -> target
          shared-key: cmux-tui-acpmux-sim-${{ hashFiles('cmux-tui/rust-toolchain.toml', 'cmux-tui/Cargo.lock', '.cargo/config.toml') }}
          save-if: false

      - name: Run the seeds
        working-directory: cmux-tui
        env:
          # A pull request runs a quarter of the sweep: enough seeds past cmux-tui-spec's fixed window to catch a
          # new fault path, in a time a 4 vCPU runner fits.
          SIM_SEEDS: ${{ inputs.seeds || (github.event_name == 'pull_request' && '1000') || '4000' }}
          # Past the per-change window, a new window every run.
          SIM_SEED_BASE: ${{ github.run_number }}0000
          # A dispatch's faults input, else the leg's (the batch caller's inputs carry none).
          SIM_FAULTS: ${{ inputs.faults || matrix.faults }}
          SIM_RESEND: ${{ matrix.resend }}
          # Only a known-gap leg counts a seed that fails by a known gap instead of failing.
          SIM_KNOWN_GAPS: ${{ matrix.known_gap && '1' || '0' }}
        run: |
          set -o pipefail
          status=0
          # Chunks of at most 500 seeds, each its own process: every hub a seed builds stays
          # alive until the process exits (about 13 MB a seed), so 4000 seeds in one process
          # reached 31 GB and filled the host's disk with swap (run 45768539377). The test
          # refuses more than 500 in one process.
          chunk=400
          : > "$RUNNER_TEMP/sim.log"
          cargo test --locked -p acpmux --features sim --test sim --no-run 2>&1 | tail -n 5
          done_seeds=0
          while [ "$done_seeds" -lt "$SIM_SEEDS" ]; do
            n=$(( SIM_SEEDS - done_seeds < chunk ? SIM_SEEDS - done_seeds : chunk ))
            SIM_SEEDS="$n" SIM_SEED_BASE=$(( SIM_SEED_BASE + done_seeds )) \
              cargo test --locked -p acpmux --features sim --test sim seeds_hold -- --nocapture 2>&1 \
              | tee -a "$RUNNER_TEMP/sim.log" || status=$?
            done_seeds=$(( done_seeds + n ))
          done
          {
            grep -E '^sim: ' "$RUNNER_TEMP/sim.log" || true
            grep -E '^seed [0-9]+:|replay:' "$RUNNER_TEMP/sim.log" | head -60 || true
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
