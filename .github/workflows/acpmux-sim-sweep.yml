name: acpmux simulation sweep

# The large run of acpmux's deterministic simulation (cmux-tui/crates/acpmux/tests/sim.rs,
# HQ#6740): thousands of seeds with every fault kind, a new window of seeds each run. The
# per-change run (cmux-tui-spec.yml, acpmux-sim) keeps a fixed window of a few hundred. A red
# run lists each failing seed with the command that replays it, in the log and the summary.
#
# A schedule fires only from the default branch's copy of this file, so landings on
# feat-cmux-next that touch acpmux run it too.
#
# A pull request into feat-cmux-next that touches acpmux runs a smaller sweep (PR_SEEDS a leg, on the 4 vCPU pool) as
# an advisory check: no ruleset requires it, and on a pull request the job is named "sim sweep (...) (advisory)",
# so merge_hold and next-autoland neither wait on nor refuse for it (the name leaves out "acpmux", which merge_hold's
# own-diff route reads as the PR's own acpmux suite). A red there is a follow-up (ci-oops soft class), not a merge
# block. The push and the schedule keep the full sweep.

on:
  schedule:
    - cron: "17 7 * * *"
  push:
    branches:
      - feat-cmux-next
    paths:
      - "cmux-tui/crates/acpmux/**"
      - "cmux-tui/Cargo.lock"
      - ".github/workflows/acpmux-sim-sweep.yml"
  pull_request:
    branches:
      - feat-cmux-next
    paths:
      - "cmux-tui/crates/acpmux/**"
      - "cmux-tui/Cargo.lock"
      - ".github/workflows/acpmux-sim-sweep.yml"
      # A README or notes file alone starts nothing here (tests/test_ci_docs_only_prs.py); no build reads them.
      - "!**/README.md"
      - "!**/COORDINATION.md"
  workflow_dispatch:
    inputs:
      seeds:
        description: "Seeds to run"
        required: false
        default: "4000"
        type: string
      faults:
        description: "SIM_FAULTS: a comma list of crash, power, network; or all, none"
        required: false
        default: "crash,network"
        type: string

# A started sweep always finishes: acpmux landings come often enough that cancelling on a
# newer push left no sweep finishing (the first one after #34601 was cancelled). The group
# still keeps at most one sweep running and one waiting, the newest.
concurrency:
  group: acpmux-sim-sweep-${{ github.ref }}
  # A pull request's newer push replaces its older sweep.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  sweep:
    name: ${{ github.event_name == 'pull_request' && 'sim sweep' || 'acpmux simulation sweep' }} (${{ matrix.faults }}${{ matrix.resend == '0' && ', bare resend' || '' }}${{ matrix.known_gap && ', known gap' || '' }})${{ github.event_name == 'pull_request' && ' (advisory)' || '' }}
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && fromJSON(vars.RUNNER_POOLS).linux_4 || !startsWith(vars.LINUX_RUNNER, 'blacksmith-') && vars.LINUX_RUNNER || vars.CI_CLOUD_OVERFLOW_SAVED && fromJSON(vars.RUNNER_POOLS).linux_16 || fromJSON(vars.RUNNER_POOLS).linux_8 }}
    timeout-minutes: ${{ github.event_name == 'pull_request' && 45 || 90 }}
    strategy:
      fail-fast: false
      matrix:
        # The standard faults, and the bare resend the web pane sends (no resend flag), which
        # holds once the daemon dedupes every logged prompt id (invariants.rs).
        # A known gap leg runs options that show a gap in invariants.rs KNOWN_GAPS. A seed that
        # fails only by it (it holds once the gap's cause is taken away) is counted in the
        # summary, not failed; any other failing seed fails the leg like the standard one.
        include:
          - faults: crash,network
            resend: "1"
            known_gap: false
          - faults: crash,network
            resend: "0"
            known_gap: true
          - faults: power
            resend: "1"
            known_gap: true
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          # The schedule runs main's copy of this file; the simulation lives on feat-cmux-next.
          ref: ${{ github.event_name == 'schedule' && 'feat-cmux-next' || github.sha }}

      - name: Set up pinned Rust
        uses: ./.github/actions/setup-cmux-tui-rust

      - name: Cache cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          workspaces: cmux-tui -> target
          shared-key: cmux-tui-acpmux-sim
          save-if: false

      - name: Run the seeds
        working-directory: cmux-tui
        env:
          # A pull request runs a quarter of the sweep: enough seeds past cmux-tui-spec's fixed window to catch a
          # new fault path, in a time a 4 vCPU runner fits.
          SIM_SEEDS: ${{ inputs.seeds || (github.event_name == 'pull_request' && '1000') || '4000' }}
          # Past the per-change window, a new window every run.
          SIM_SEED_BASE: ${{ github.run_number }}0000
          SIM_FAULTS: ${{ github.event_name == 'workflow_dispatch' && inputs.faults || matrix.faults }}
          SIM_RESEND: ${{ matrix.resend }}
          # Only a known-gap leg counts a seed that fails by a known gap instead of failing.
          SIM_KNOWN_GAPS: ${{ matrix.known_gap && '1' || '0' }}
        run: |
          set -o pipefail
          status=0
          cargo test --locked -p acpmux --features sim --test sim seeds_hold -- --nocapture 2>&1 | tee "$RUNNER_TEMP/sim.log" || status=$?
          {
            grep -E '^sim: ' "$RUNNER_TEMP/sim.log" || true
            grep -E '^seed [0-9]+:|replay:' "$RUNNER_TEMP/sim.log" | head -60 || true
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
