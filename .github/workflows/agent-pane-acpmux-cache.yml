name: agent pane acpmux cargo cache

# Saves the cargo build of acpmux (debug, cmux-tui -> target) from feat-cmux-next under the rust-cache key
# `agent-pane-real-acpmux`, which pr-pipeline.yml's web-browser job restores (save-if: false) before the
# agent-pane-real-acpmux step (ci/steps.toml) builds acpmux. Without it that step compiled ~470 crates cold on an
# ephemeral runner and could pass its 1800 s budget (job 138744570179, 2026-11-24): ci-web.yml's job that used to
# save the key only runs in the post-merge batch, saves only when its browser tests pass, and no entry existed.
#
# This job only builds, so a red test never costs the cache. rust-cache keeps the dependencies (it drops the
# workspace's own crates before saving) and keys them by Cargo.lock, the manifests and rust-toolchain.toml, so a
# push that changes none of those finds its exact key and skips the build. A pull request whose key differs
# restores the newest entry by prefix and rebuilds only what changed.
#
# A schedule runs only main's copy of a workflow (.github/AGENTS.md, item 6): the push trigger covers each change
# to the key's inputs, and workflow_dispatch refills an evicted entry.

on:
  push:
    branches:
      - feat-cmux-next
    paths:
      - "cmux-tui/Cargo.lock"
      - "cmux-tui/**/Cargo.toml"
      - "cmux-tui/rust-toolchain.toml"
      - ".cargo/config.toml"
      - "cmux-tui/.cargo/**"
      - ".github/workflows/agent-pane-acpmux-cache.yml"
      - ".github/actions/setup-cmux-tui-rust/**"
  workflow_dispatch:

permissions: {}

concurrency:
  # One save at a time; a burst of pushes builds the newest waiting head, never cancelling one mid-save.
  group: agent-pane-acpmux-cache-${{ github.ref }}
  cancel-in-progress: false

jobs:
  save:
    name: Save the acpmux cargo build
    if: ${{ github.repository == 'manaflow-ai/cmux' && github.ref == 'refs/heads/feat-cmux-next' }}
    runs-on: cmux-linux
    # A cold debug build of acpmux took more than 30 min on a small runner; a warm one a few minutes.
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up pinned Rust
        uses: ./.github/actions/setup-cmux-tui-rust

      # The same settings as pr-pipeline.yml's restore, so the key matches.
      - name: Cache cargo build
        id: cargo-cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Why: docs/ci/cmux-next-workflow-notes.md#note-210 (pool runners keep different leftover toolchains)
          add-rust-environment-hash-key: false
          cache-bin: false
          shared-key: agent-pane-real-acpmux-${{ hashFiles('cmux-tui/rust-toolchain.toml', 'cmux-tui/Cargo.lock', '.cargo/config.toml') }}
          save-if: ${{ github.ref == 'refs/heads/feat-cmux-next' }}
          workspaces: cmux-tui -> target

      - name: Build acpmux
        if: ${{ steps.cargo-cache.outputs.cache-hit != 'true' }}
        working-directory: cmux-tui
        # The step's own build flags (ci/steps.toml agent-pane-real-acpmux), so the restored dependencies match.
        run: CARGO_INCREMENTAL=0 cargo build --locked -p acpmux --bin acpmux
