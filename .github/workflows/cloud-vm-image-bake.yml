name: Cloud VM image bake

# Bakes the cmux VM image from images/cmux-vm/inputs.lock.json and smoke-tests
# it (plans/cmux-next/vm-image.md 4.11), or bakes twice and diffs the SBOMs and
# file hashes (mode: repro). Branch bakes only: every VM and snapshot is named
# cmuxnp-dev-vmimg-<run>, recorded in a ledger the moment it exists, and
# deleted by id at the end, also when a step fails. No promotion and no image
# manifest change happens here.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: bake = one bake + smoke; repro = two bakes + SBOM/file-hash diff
        required: true
        default: bake
        type: choice
        options:
          - bake
          - repro
      clones:
        description: Smoke clones (latency sample size)
        required: false
        default: "5"
        type: string

permissions:
  contents: read

concurrency:
  group: cloud-vm-image-bake-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bake:
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    # Same environment and secret as the image reachability check; no new secret.
    environment: cloud-vm-image-checks
    timeout-minutes: 60
    defaults:
      run:
        working-directory: web
    env:
      OUT_DIR: ${{ github.workspace }}/cmux-vm-image-out
      TAG: ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate the input lock
        run: bun test tests/vm-image-cmux-vm-lock.test.ts

      - name: Bake
        if: inputs.mode == 'bake'
        id: bake
        env:
          FREESTYLE_API_KEY: ${{ secrets.FREESTYLE_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$OUT_DIR"
          bun ../images/cmux-vm/bake.ts --tag "$TAG" --out-dir "$OUT_DIR" | tee "$OUT_DIR/bake.out"
          snapshot="$(awk '/^IMAGE_ID /{print $2}' "$OUT_DIR/bake.out" | tail -1)"
          test -n "$snapshot"
          echo "snapshot=$snapshot" >> "$GITHUB_OUTPUT"

      - name: Smoke
        if: inputs.mode == 'bake'
        env:
          FREESTYLE_API_KEY: ${{ secrets.FREESTYLE_API_KEY }}
          SNAPSHOT: ${{ steps.bake.outputs.snapshot }}
          CLONES: ${{ inputs.clones }}
        run: bun ../images/cmux-vm/smoke.ts --snapshot "$SNAPSHOT" --tag "$TAG" --clones "$CLONES" --out-dir "$OUT_DIR" | tee "$OUT_DIR/smoke.out"

      - name: Reproducibility
        if: inputs.mode == 'repro'
        env:
          FREESTYLE_API_KEY: ${{ secrets.FREESTYLE_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$OUT_DIR"
          bun ../images/cmux-vm/repro.ts --tag "$TAG" --out-dir "$OUT_DIR" | tee "$OUT_DIR/repro.out"

      # Deletes every id the ledger recorded and did not delete yet: the bake
      # snapshot, and any builder or clone a failed or cancelled step left.
      - name: Delete everything this run created
        if: always()
        env:
          FREESTYLE_API_KEY: ${{ secrets.FREESTYLE_API_KEY }}
        run: |
          if [ -f "$OUT_DIR/resources.tsv" ]; then
            bun ../images/cmux-vm/cleanup.ts --ledger "$OUT_DIR/resources.tsv"
          else
            echo "no ledger; nothing was created"
          fi

      - name: Upload SBOM, manifest and logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-vm-image-${{ inputs.mode }}-${{ github.run_id }}
          path: ${{ github.workspace }}/cmux-vm-image-out
          if-no-files-found: warn
          retention-days: 30
