name: Cloud VM image bake

# Bakes the cmux VM image from images/cmux-vm/inputs.lock.json and smoke-tests
# it (plans/cmux-next/vm-image.md 4.11), or bakes twice and diffs the SBOMs and
# file hashes (mode: repro). Branch bakes only: every VM and snapshot is named
# cmuxnp-dev-vmimg-<run>, recorded in a ledger the moment it exists, and
# deleted by id at the end, also when a step fails (keep_snapshot keeps only the
# snapshot, as the dev channel candidate). No promotion and no image manifest
# change happens here. team_vm bakes the image the Worker boots for team VMs
# (TEAM_VM_SNAPSHOT) instead of personal Cloud machines (CLOUD_FREESTYLE_SNAPSHOT):
# bake.ts and smoke.ts get --team-vm, the names carry ci-team-, and the candidate
# records which var it is for, as a channels/dev.json history entry needs.
# dev_tree bakes the public cmux checkout, its Rust and Zig toolchains and warm build
# caches in (bake.ts --dev-tree) and measures time to first build on new machines
# (first-build.ts): first-build-before on the dev channel's image while the bake runs,
# the bake job on the new image after the smoke, and first-build-report puts the two
# side by side in the run summary.
# mode prod-copy bakes the production copy of a recorded dev image (prod-copy.ts): the same
# lock and flags, on the production Freestyle account in environment cmux-next-vm-image-prod,
# named cmuxnp-prod-vmimg-<tag> (the prefix the production Worker boots), smoked, kept, and
# written as channel-production.json for cloud-vm-image-promote.yml channel production, which
# records it as names.production. The prod-gate job refuses before anything runs while that
# environment is missing or not limited to feat-cmux-next, so production stays inert until it exists.
# layered (the default) bakes the image as cached layers, system -> agents -> app (web/scripts/cmux-vm-image/layers.ts):
# a layer whose input hash has a snapshot is booted, a missing one is built and kept under
# cmuxnp-dev-vmimg-sys-/agt-<key>, and only the app layer (cmux-tui) is baked on every run. Its SBOM and
# file manifest are taken after the snapshot, beside the smoke (inventory.ts). layered=false is the full bake
# from the lock: the manual fallback, and the weekly run main's cloud-vm-image-full-bake.yml starts, so the
# image stays reproducible from the lock alone. A dev tree bake is always a full bake.
# large_image (off by default) also makes the large image (web/scripts/cmux-vm-image/large-image.ts): after the
# image's own snapshot the same builder is grown to the default Cloud chat start size (4 vCPU / 16 GiB / 64 GiB)
# and snapshotted again as <name>-large, then smoked on its own (large-smoke.ts: clones boot at that size with no
# resize). It has its own ledger (large/resources.tsv), so it is kept only when its own smoke passed and the
# candidate records it, as the member `large` of channel-dev.json. The image's own snapshot, id, smoke and
# candidate fields are the same with it on or off, and a large image that fails is a warning, never a red run:
# nothing boots it yet (creates still boot the image and grow it).
on:
  workflow_dispatch:
    inputs:
      mode:
        description: bake = one bake + smoke; repro = two bakes + SBOM/file-hash diff; prod-copy = the production copy of dev_snapshot (production account); first-session = time a first session's installs with and without package caches baked in (dev_snapshot, else the dev channel's image)
        required: true
        default: bake
        type: choice
        options:
          - bake
          - repro
          - prod-copy
          - first-session
      dev_snapshot:
        description: "prod-copy only: the dev image (sh-...) in channels/dev.json history to copy; its lock and flags are reused"
        required: false
        default: ""
        type: string
      clones:
        description: Smoke clones (latency sample size; at least 2 for the identity checks)
        required: false
        default: "5"
        type: string
      keep_snapshot:
        description: Keep the baked snapshot as the dev channel candidate (VMs are still deleted)
        required: false
        default: false
        type: boolean
      auto_promote:
        description: After a successful kept bake and smoke, let the completion receiver dispatch the checked-in dev promotion workflow
        required: false
        default: false
        type: boolean
      probes:
        description: Also run the VM agent bind probe (dev API) and the sm->md resize probe, and with agent_tools the agent tools probe (rd-* desktop checks)
        required: false
        default: false
        type: boolean
      agent_tools:
        description: Bake the required Cloud desktop closure (browser role, on-demand agent display and computer use, cmux-rd desktop socket, and acpmux tool dir; bead cx-h8n)
        required: false
        default: true
        type: boolean
      team_vm:
        description: Bake the team VM image (TEAM_VM_SNAPSHOT; adds the team files root /srv/team, bead cx-cemg); the smoke checks /srv/team and the candidate records var TEAM_VM_SNAPSHOT
        required: false
        default: false
        type: boolean
      dev_tree:
        description: Bake the cmux checkout, its Rust and Zig toolchains and warm build caches in (dev snapshots only), and measure time to first build before and after
        required: false
        default: false
        type: boolean
      layered:
        description: Bake from cached layers (system -> agents -> app); only layers whose inputs changed rebuild. Off = the full bake from the lock (the weekly run)
        required: false
        default: true
        type: boolean
      large_image:
        description: Also bake and smoke the large image, the same builder grown to the default Cloud chat start size (4 vCPU / 16 GiB / 64 GiB), named <name>-large. No create boots it yet; not with team_vm or dev_tree
        required: false
        default: false
        type: boolean
  # The image roll (cloud-vm-image-roll.yml) calls the bake with roll: true: it pins cmux_tui_commit into this
  # checkout's lock first (when set), and hands the gated candidate back as outputs. Nothing else differs.
  workflow_call:
    inputs:
      mode: { type: string, required: true }
      clones: { type: string, required: false, default: "5" }
      keep_snapshot: { type: boolean, required: false, default: false }
      probes: { type: boolean, required: false, default: false }
      agent_tools: { type: boolean, required: false, default: true }
      layered: { type: boolean, required: false, default: true }
      large_image: { type: boolean, required: false, default: false }
      roll: { type: boolean, required: false, default: false }
      cmux_tui_commit: { type: string, required: false, default: "" }
    # The Freestyle key and the UI test login are repository secrets, which a called workflow gets only when its
    # caller passes them (the image roll passes exactly these three). Optional, so a direct dispatch is unchanged.
    # A secret of the bake job's environment still takes precedence over a passed one. prod-copy never runs this
    # way: workflow_call has no dev_snapshot input, so "Check the production copy inputs" refuses it.
    secrets:
      FREESTYLE_API_KEY: { required: false }
      CMUX_UITEST_STACK_EMAIL: { required: false }
      CMUX_UITEST_STACK_PASSWORD: { required: false }
    outputs:
      candidate:
        description: The kept image's record (channel-dev.json, one line of JSON); empty unless every gate passed
        value: ${{ jobs.bake.outputs.candidate }}
      revision:
        description: The image revision (the bake tag, ci-<run>-<attempt>)
        value: ${{ jobs.bake.outputs.revision }}
      live_failing:
        description: The agent tools probe's checks that fail on the candidate and already failed on the live image (warnings, not blocking), one Markdown line each; empty when none
        value: ${{ jobs.bake.outputs.live_failing }}

permissions:
  contents: read

# A first-session probe bakes nothing and boots only its own machines, so it queues apart from the bakes: one
# pending slot per group, and a bake dispatched behind a pending probe would otherwise cancel it (and the reverse).
concurrency:
  group: cloud-vm-image-bake-${{ github.ref }}${{ inputs.mode == 'first-session' && '-probe' || '' }}${{ inputs.roll && '-roll' || '' }}
  cancel-in-progress: false

env:
  # Temporary REST budget attribution: one gh-call line per GitHub API call (scripts/ci/api_call_log/env.sh, fetched at a fixed commit when the checkout has no copy).
  BASH_ENV: '$({ w="${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh"; t="${RUNNER_TEMP:-/nonexistent}/api-call-log-src"; if [ -f "$w" ]; then echo "$w"; elif [ -n "${RUNNER_TEMP:-}" ]; then if [ ! -f "$t/env.sh" ] && [ ! -e "$t.tried" ] && { [ "${RUNNER_OS:-}" = Linux ] || [ "${RUNNER_OS:-}" = macOS ]; } && [ "$(date -u +%Y%m%d%H)" -lt 2026112300 ]; then : > "$t.tried"; mkdir -p "$t.part" && for x in env.sh gh sitecustomize.py isolated.py; do curl -fsSL --max-time 5 -o "$t.part/$x" "https://raw.githubusercontent.com/manaflow-ai/cmux/27647ffd3ae838c63be28ca3e5883dcd68c34518/scripts/ci/api_call_log/$x" || break; done; [ -s "$t.part/isolated.py" ] && mv "$t.part" "$t"; fi; if [ -f "$t/env.sh" ]; then echo "$t/env.sh"; else echo unset BASH_ENV > "$t.off.sh" && echo "$t.off.sh"; fi; fi; } 2>/dev/null)'

jobs:
  # prod-copy only, before any job names the production environment (a job that names a missing
  # environment creates it, unprotected): it must exist and allow feat-cmux-next only.
  prod-gate:
    if: inputs.mode == 'prod-copy'
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && (vars.CI_FORK_LINUX_RUNNER || 'ubuntu-24.04') || 'cmux-linux' }}
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      PROD_ENV: cmux-next-vm-image-prod
    steps:
      - name: Check the production environment
        run: |
          set -euo pipefail
          refuse() { echo "::error title=Production environment::$1"; exit 1; }
          [ "$GITHUB_REF" = refs/heads/feat-cmux-next ] || refuse "dispatch from feat-cmux-next, not $GITHUB_REF"
          inert="production stays off until $PROD_ENV exists, allows branch feat-cmux-next only, and holds FREESTYLE_API_KEY (production account) plus the team-owned production Stack test profile (CMUX_UITEST_STACK_EMAIL and CMUX_UITEST_STACK_PASSWORD); a trusted production snapshot must already be recorded in channel data for the account check; nothing ran"
          gh api "repos/$GITHUB_REPOSITORY/environments/$PROD_ENV" > "$RUNNER_TEMP/prod-env.json" 2> /dev/null || refuse "$PROD_ENV does not exist or cannot be read: $inert"
          [ "$(jq -r '.deployment_branch_policy | "\(.custom_branch_policies // false) \(.protected_branches // false)"' "$RUNNER_TEMP/prod-env.json")" = "true false" ] || refuse "$PROD_ENV has no custom branch policy (or also allows protected branches): $inert"
          gh api "repos/$GITHUB_REPOSITORY/environments/$PROD_ENV/deployment-branch-policies" --jq '[.branch_policies[] | "\(.type // "branch"):\(.name)"] | sort | join(",")' > "$RUNNER_TEMP/prod-env-branches.txt" || refuse "cannot read the branch policies of $PROD_ENV: $inert"
          [ "$(cat "$RUNNER_TEMP/prod-env-branches.txt")" = "branch:feat-cmux-next" ] || refuse "$PROD_ENV allows $(cat "$RUNNER_TEMP/prod-env-branches.txt"), not branch feat-cmux-next only: $inert"
          echo "$PROD_ENV exists and allows branch feat-cmux-next only"

  bake:
    needs: prod-gate
    # Every mode but prod-copy skips prod-gate and runs as before; prod-copy runs only after it passed.
    if: ${{ !cancelled() && (needs.prod-gate.result == 'success' || (inputs.mode != 'prod-copy' && needs.prod-gate.result == 'skipped')) }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || inputs.roll && vars.CI_DEPLOY_SKIP_FLEET != '1' && 'cmux-gcp-deploy-jit-x64' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && (vars.CI_FORK_LINUX_RUNNER || 'ubuntu-24.04') || 'cmux-linux' }}
    # The cmux-next dev Freestyle account only (D-A7): never the shared classic account.
    # prod-copy alone bakes on the production account, in its own environment.
    # Both environments allow only feat-cmux-next.
    environment: ${{ inputs.mode == 'prod-copy' && 'cmux-next-vm-image-prod' || 'cmux-next-vm-image-dev' }}
    permissions:
      contents: read
    # A dev tree bake runs a cold cmux-tui build on the builder (2 vCPUs), then the after runs.
    timeout-minutes: ${{ inputs.dev_tree && 150 || 60 }}
    outputs:
      candidate: ${{ steps.roll_candidate.outputs.candidate }}
      revision: ${{ steps.roll_candidate.outputs.revision }}
      live_failing: ${{ steps.live_failing.outputs.lines }}
    defaults:
      run:
        working-directory: web
    env:
      OUT_DIR: ${{ github.workspace }}/cmux-vm-image-out
      TAG: ci-${{ inputs.team_vm && 'team-' || '' }}${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      # prod-copy: refuse before anything is created. The flags come from the dev image's record.
      - name: Check the production copy inputs
        if: inputs.mode == 'prod-copy'
        working-directory: .
        env:
          DEV_SNAPSHOT: ${{ inputs.dev_snapshot }}
          # agent_tools defaults true because every Cloud Native bake carries the desktop closure. The other
          # flags still come from the dev image's recorded bake in prod-copy mode.
          FLAG_INPUTS: ${{ (inputs.team_vm || inputs.dev_tree || inputs.probes) && 'set' || '' }}
          # Whether each production secret is set, never its value: the copy is only useful once promote can run too.
          HAS_KEY: ${{ secrets.FREESTYLE_API_KEY != '' && 'yes' || '' }}
          HAS_EMAIL: ${{ secrets.CMUX_UITEST_STACK_EMAIL != '' && 'yes' || '' }}
          HAS_PASSWORD: ${{ secrets.CMUX_UITEST_STACK_PASSWORD != '' && 'yes' || '' }}
        run: |
          set -euo pipefail
          refuse() { echo "::error title=Production copy::$1"; exit 1; }
          [ "$GITHUB_REF" = refs/heads/feat-cmux-next ] || refuse "dispatch from feat-cmux-next, not $GITHUB_REF"
          [[ "$DEV_SNAPSHOT" =~ ^sh-[0-9a-f]{32}$ ]] || refuse "dev_snapshot must be the dev image's snapshot id (sh-...)"
          [ -z "$FLAG_INPUTS" ] || refuse "team_vm, dev_tree and probes come from the dev image's record in prod-copy mode; leave them off"
          [ -n "$HAS_KEY" ] && [ -n "$HAS_EMAIL" ] && [ -n "$HAS_PASSWORD" ] || refuse "cmux-next-vm-image-prod needs FREESTYLE_API_KEY (production account), CMUX_UITEST_STACK_EMAIL and CMUX_UITEST_STACK_PASSWORD; nothing was created"

      # Every newly baked Cloud Native image carries the cmux-rd desktop closure. A false
      # value is accepted only for prod-copy, where the flags are read from the recorded
      # dev image and prod-copy.ts enforces the same contract.
      - name: Require the Cloud desktop closure
        if: inputs.mode != 'prod-copy' && !inputs.agent_tools
        working-directory: .
        run: |
          echo "::error title=Cloud image::agent_tools is required; every new Cloud Native image must include the cmux-rd desktop closure" >&2
          exit 1

      # A persistent pool VM keeps the last job's checkout as a git cache. One left sparse (patterns, skip-worktree
      # bits) or with a ref to a missing object makes actions/checkout leave files out or fail (runs 44739498261 and
      # 44733869883, 2026-11-20); remove it so checkout clones fresh. Its manual test: test_ci_reused_sparse_checkout.py.
      - name: Remove a reused workspace left sparse or broken (self-hosted Linux)
        working-directory: ${{ github.workspace }}
        if: runner.os == 'Linux'
        shell: bash
        run: |
          [ "${RUNNER_ENVIRONMENT:-}" = self-hosted ] && [ -e "$GITHUB_WORKSPACE/.git" ] || exit 0
          cd "$GITHUB_WORKSPACE"
          why=""
          if [ "$(git config --get core.sparseCheckout 2>/dev/null)" = true ] || [ -e .git/info/sparse-checkout ]; then
            why="sparse"
          elif git ls-files -v 2>/dev/null | grep -q '^S'; then
            why="skip-worktree entries"
          elif ! git rev-parse --verify -q 'HEAD^{commit}' >/dev/null; then
            why="HEAD does not resolve"
          elif git for-each-ref --format='%(objectname)' 2>/dev/null | git cat-file --batch-check 2>/dev/null | grep -q ' missing$'; then
            why="a ref names a missing object"
          else
            exit 0
          fi
          echo "reused workspace on ${RUNNER_NAME:-this runner}: $why; removing it so checkout starts clean"
          find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
          no-cache: ${{ !startsWith(github.workspace, '/home/runner/work/') }}

      # web/'s install was 3.4 of the run's 14 min with a cold package cache (run 41857345925). The cache holds
      # package tarballs only, no secret; this job runs on feat-cmux-next only, so only that branch writes it.
      - name: Cache Bun package cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.bun/install/cache
          key: bun-vm-image-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('web/bun.lock') }}
          restore-keys: |
            bun-vm-image-${{ runner.os }}-${{ runner.arch }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # An image roll bakes the lock with the build it rolls (images/cmux-vm/pin-cmux-tui.ts); the roll's
      # commit writes the same lock, and refuses one that no longer hashes to what was baked here.
      - name: Pin cmux-tui for the image roll
        if: inputs.roll
        env:
          COMMIT: ${{ inputs.cmux_tui_commit }}
          MODE: ${{ inputs.mode }}
          KEEP: ${{ inputs.keep_snapshot && 'true' || '' }}
        run: |
          set -euo pipefail
          if [ "$MODE" != bake ] || [ -z "$KEEP" ]; then
            echo '::error title=Image roll::a roll bakes a kept image (mode bake, keep_snapshot)'
            exit 1
          fi
          if [ -n "$COMMIT" ]; then bun ../images/cmux-vm/pin-cmux-tui.ts --commit "$COMMIT" --write; fi

      - name: Validate the input lock
        run: |
          bun test tests/vm-image-cmux-vm-lock.test.ts

      - name: Bake
        if: inputs.mode == 'bake'
        id: bake
        env:
          FREESTYLE_API_KEY: ${{ secrets.FREESTYLE_API_KEY }}
          AGENT_TOOLS: ${{ inputs.agent_tools && '--agent-tools' || '' }}
          TEAM_VM: ${{ inputs.team_vm && '--team-vm' || '' }}
          DEV_TREE: ${{ inputs.dev_tree && '--dev-tree' || '' }}
          LAYERED: ${{ inputs.layered && '--layered --defer-inventory' || '' }}
          LARGE: ${{ inputs.large_image && '--large' || '' }}
        run: |
          set -euo pipefail
          mkdir -p "$OUT_DIR"
          # A dev tree is a checkout of this commit: no cached layer can hold it.
          if [ -n "$DEV_TREE" ]; then LAYERED=""; fi
          # shellcheck disable=SC2086
          bun ../images/cmux-vm/bake.ts --tag "$TAG" --out-dir "$OUT_DIR" $AGENT_TOOLS $TEAM_VM $DEV_TREE $LAYERED $LARGE | tee "$OUT_DIR/bake.out"
          snapshot="$(awk '/^IMAGE_ID /{print $2}' "$OUT_DIR/bake.out" | tail -1)"
          test -n "$snapshot"
          echo "snapshot=$snapshot" >> "$GITHUB_OUTPUT"
          # The large image, when asked for and made: its own output, read only by the large smoke.
          large_snapshot="$(awk '/^LARGE_IMAGE_ID /{print $2}' "$OUT_DIR/bake.out" | tail -1)"
          echo "large_snapshot=$large_snapshot" >> "$GITHUB_OUTPUT"
          if [ -n "$LARGE" ] && [ -z "$large_snapshot" ]; then
            echo "::warning title=Large image::the bake made no large image (LARGE IMAGE FAILED in the bake log); the image itself is unaffected"
          fi

      - name: Smoke
        if: inputs.mode == 'bake'
        id: smoke
        env:
          FREESTYLE_API_KEY: ${{ secrets.FREESTYLE_API_KEY }}
          SNAPSHOT: ${{ steps.bake.outputs.snapshot }}
          CLONES: ${{ inputs.clones }}
          PROBES: ${{ inputs.probes && '--agent-probe --resize-probe' || '' }}
          # A team image must also pass the /srv/team check.
          TEAM_VM: ${{ inputs.team_vm && '--team-vm' || '' }}
          # A per-commit (layered) bake samples idle CPU over the idle-wakeup check's own minute; a full bake (the
          # weekly run, and a dev tree bake, which the Bake step always runs in full) keeps the two-minute sample.
          IDLE_SECONDS: ${{ (inputs.layered && !inputs.dev_tree) && '60' || '120' }}
        run: |
          set -euo pipefail
          # A layered bake left its builder for the SBOM and file manifest (inventory.ts); they run beside the
          # smoke, on another machine, and the image record (bake-*.json) gets them before any candidate.
          inventory_pid=""
          if find "$OUT_DIR" -maxdepth 1 -name 'bake-*.json' -exec grep -q '"inventoryVmId"' {} \; -print | grep -q .; then
            bun ../images/cmux-vm/inventory.ts --out-dir "$OUT_DIR" > "$OUT_DIR/inventory.out" 2>&1 &
            inventory_pid=$!
          fi
          smoke_status=0
          # shellcheck disable=SC2086
          bun ../images/cmux-vm/smoke.ts --snapshot "$SNAPSHOT" --tag "$TAG" --clones "$CLONES" --idle-seconds "$IDLE_SECONDS" --out-dir "$OUT_DIR" $PROBES $TEAM_VM | tee "$OUT_DIR/smoke.out" || smoke_status=$?
          if [ -n "$inventory_pid" ]; then
            inventory_status=0
            wait "$inventory_pid" || inventory_status=$?
            tail -3 "$OUT_DIR/inventory.out"
            [ "$inventory_status" -eq 0 ] || { echo "::error title=Image inventory::the SBOM or file manifest failed (inventory.out)"; exit 1; }
          fi
          exit "$smoke_status"

      # The large image's own smoke (large-smoke.ts), after the image's: clones boot at the large size with no
      # resize. A failure is a warning and leaves the large image out of the candidate; the run's cleanup then
      # deletes it. The image's own smoke above is the only gate on the image.
      - name: Large image smoke
        if: inputs.mode == 'bake' && steps.bake.outputs.large_snapshot != ''
        id: large_smoke
        continue-on-error: true
        env:
          FREESTYLE_API_KEY: ${{ secrets.FREESTYLE_API_KEY }}
          LARGE_SNAPSHOT: ${{ steps.bake.outputs.large_snapshot }}
        run: |
          set -euo pipefail
          status=0
          bun ../images/cmux-vm/large-smoke.ts --snapshot "$LARGE_SNAPSHOT" --tag "$TAG" --clones 2 --out-dir "$OUT_DIR" | tee "$OUT_DIR/large-smoke.out" || status=$?
          if [ "$status" -ne 0 ]; then
            echo "::warning title=Large image::the large image's smoke failed (large-smoke.out); it is not recorded and will be deleted. The image itself is unaffected"
          fi
          exit "$status"

      # Time to first build on new machines of this image (first-build.ts); first-build-before
      # measures the dev channel's image the same way.
      - name: First build after
        if: inputs.mode == 'bake' && inputs.dev_tree
        id: first_build
        env:
          FREESTYLE_API_KEY: ${{ secrets.FREESTYLE_API_KEY }}
          SNAPSHOT: ${{ steps.bake.outputs.snapshot }}
        run: |
          set -euo pipefail
          bun ../images/cmux-vm/first-build.ts --mode after --snapshot "$SNAPSHOT" --tag "$TAG" --ref "$GITHUB_SHA" --out-dir "$OUT_DIR" | tee "$OUT_DIR/first-build-after.out"

      # The agent tools probe (agent-tools-probe.ts) on a clone of this image: the recorded MCP servers and
      # skills, the agent display, computer use, the cmux-rd desktop socket (rd-* checks) and the harness gate (acp ensure
      # for every harness the Cloud chat picker offers, harness-gate.ts). In a roll the gate blocks only regressions: it
      # runs the same ensure on a clone of production's boot image (--baseline live), and a harness already failing there
      # is a warning. The probe deletes
      # its clone. --agent-tools images only, with probes on.
      - name: Agent tools probe
        if: inputs.mode == 'bake' && inputs.agent_tools && inputs.probes
        id: agent_tools_probe
        env:
          FREESTYLE_API_KEY: ${{ secrets.FREESTYLE_API_KEY }}
          SNAPSHOT: ${{ steps.bake.outputs.snapshot }}
          BASELINE: ${{ inputs.roll && 'live' || 'none' }}
        run: |
          set -euo pipefail
          bun scripts/cmux-vm-image/agent-tools-probe.ts --snapshot "$SNAPSHOT" --tag "$TAG" --out-dir "$OUT_DIR" --baseline "$BASELINE" | tee "$OUT_DIR/agent-tools-probe.out"

      # A check already failing on the live image warns and does not block (harness-gate.ts LIVE_FAILING_FILE); its
      # lines go on as the live_failing output, which the image roll's report job files on one issue.
      - name: Checks already failing on the live image
        if: always() && steps.agent_tools_probe.outcome != 'skipped'
        id: live_failing
        run: |
          set -euo pipefail
          if [ -s "$OUT_DIR/live-failing.md" ]; then
            { echo "lines<<LIVE_FAILING_EOF"; head -c 6000 "$OUT_DIR/live-failing.md" | grep -v '^LIVE_FAILING_EOF$'; echo; echo "LIVE_FAILING_EOF"; } >> "$GITHUB_OUTPUT"
            cat "$OUT_DIR/live-failing.md"
          else
            echo "none"
          fi

      # The fields of a channels/dev.json history entry (promote.ts promotes only a
      # recorded snapshot_id with smoke PASSED, under --var <var>).
      - name: Dev channel candidate
        if: inputs.mode == 'bake' && inputs.keep_snapshot
        id: candidate
        env:
          SNAPSHOT: ${{ steps.bake.outputs.snapshot }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          SNAPSHOT_VAR: ${{ inputs.team_vm && 'TEAM_VM_SNAPSHOT' || 'CLOUD_FREESTYLE_SNAPSHOT' }}
          AGENT_TOOLS: ${{ inputs.agent_tools && '--agent-tools' || '' }}
          TEAM_VM: ${{ inputs.team_vm && '--team-vm' || '' }}
          DEV_TREE: ${{ inputs.dev_tree && '--dev-tree' || '' }}
          LAYERED: ${{ inputs.layered && '--layered --defer-inventory' || '' }}
          PROBES: ${{ inputs.probes && '--agent-probe --resize-probe' || '' }}
          CLONES: ${{ inputs.clones }}
          AUTO_PROMOTE: ${{ inputs.auto_promote }}
        run: |
          set -euo pipefail
          if [ -n "$DEV_TREE" ]; then LAYERED=""; fi
          bake_json="$(find "$OUT_DIR" -maxdepth 1 -name 'bake-*.json' | head -1)"
          smoke_json="$OUT_DIR/smoke-$TAG.json"
          jq -e '.passed == true' "$smoke_json" > /dev/null
          candidate="$OUT_DIR/channel-dev.json"
          # The large image of this bake, only when its own smoke passed on that very snapshot: the member `large`
          # (name, id, size, smoke). Every other field of the candidate is the same with or without it.
          large=null
          large_smoke="$OUT_DIR/smoke-large-$TAG.json"
          if [ -f "$large_smoke" ]; then
            large="$(jq -c --slurpfile s "$large_smoke" --arg run "$RUN_ID" \
              '(.large // null) as $l
               | if $l != null and $s[0].passed == true and $s[0].snapshotId == $l.snapshotId
                 then {snapshot: $l.name, snapshot_id: $l.snapshotId, size: {vcpu: $l.size.vcpu, mem_gib: $l.size.memGiB, disk_gib: $l.size.diskGiB},
                       smoke: {result: "PASSED", at: (now|todate), detail: "large-smoke.ts (CI run \($run)): \($s[0].checks | length) checks passed"}}
                 else null end' "$bake_json")"
          fi
          jq -n --slurpfile b "$bake_json" --slurpfile s "$smoke_json" --arg id "$SNAPSHOT" --arg sha "$SOURCE_SHA" --arg run "$RUN_ID" --argjson large "$large" \
            --arg var "$SNAPSHOT_VAR" --arg bake "images/cmux-vm/bake.ts $AGENT_TOOLS $TEAM_VM $DEV_TREE $LAYERED" --arg smoke "smoke.ts --clones $CLONES $PROBES $TEAM_VM" \
            'def words: split(" ") | map(select(. != "")) | join(" ");
             ($bake | words) as $bake | ($smoke | words) as $smoke |
             {schema: 1, env: "dev", var: $var, snapshot: $b[0].name, snapshot_id: $id, lock_sha256: $b[0].lockSha256, source_sha: $sha, run: ($run|tonumber), baked_at: (now|todate),
              bake: "\($bake) (CI run \($run))", smoke: {result: "PASSED", at: (now|todate), detail: "\($smoke) (CI run \($run)): \($s[0].checks | length) checks passed"}}
             + (if ($b[0].desktop // null) != null then {desktop: $b[0].desktop} else {} end)
             + (if ($b[0].inputsSha256 // null) != null then {inputs_sha256: $b[0].inputsSha256} else {} end)
             + (if ($b[0].daemonIdentify.capabilities // [] | type) == "array" then {cmux_tui: {commit: ($b[0].daemonIdentify.build_commit // $sha), committed_at: (now|todate), capabilities: $b[0].daemonIdentify.capabilities}} else {} end)
             + (if $b[0].teamFilesRoot then {team_files_root: $b[0].teamFilesRoot} else {} end)
             + (if $large != null then {large: $large} else {} end)' \
            > "$candidate"
          cat "$candidate"
          if [ "$AUTO_PROMOTE" = true ]; then
            jq -n --arg var "$SNAPSHOT_VAR" --arg snapshot "$SNAPSHOT" '{auto_promote: true, var: $var, snapshot: $snapshot}' > "$OUT_DIR/auto-promote.json"
          fi

      # The roll's gate is every step above (bake, the clone smoke, the agent tools probe): this runs only
      # when all of them passed and the candidate was written, so a red gate leaves the output empty.
      - name: Image roll candidate
        if: inputs.mode == 'bake' && inputs.roll
        id: roll_candidate
        run: |
          set -euo pipefail
          jq -e '.snapshot_id and .lock_sha256' "$OUT_DIR/channel-dev.json" > /dev/null
          {
            echo "candidate=$(jq -c . "$OUT_DIR/channel-dev.json")"
            echo "revision=$TAG"
          } >> "$GITHUB_OUTPUT"
      # The copy repeats the dev image's lock and flags. The key must not be the dev account's
      # (prod-copy.ts account-check: it resolves a trusted recorded
      # production snapshot to its id, and refuses a third account). In every prod-copy step the key reaches
      # bun only as a 0600 file (FREESTYLE_API_KEY_FILE), never in a child's environment.
      - name: Plan the production copy
        if: inputs.mode == 'prod-copy'
        id: plan
        env:
          FREESTYLE_KEY_SECRET: ${{ secrets.FREESTYLE_API_KEY }}
          DEV_SNAPSHOT: ${{ inputs.dev_snapshot }}
        run: |
          set -euo pipefail
          # First: the key moves to an unexported shell variable, so no child process inherits it.
          key="$FREESTYLE_KEY_SECRET"
          unset FREESTYLE_KEY_SECRET
          umask 077
          key_file="$(mktemp "$RUNNER_TEMP/freestyle-key.XXXXXX")"
          trap 'rm -f "$key_file"' EXIT
          printf '%s' "$key" > "$key_file"
          unset key
          chmod 600 "$key_file"
          bun scripts/cmux-vm-image/prod-copy.ts plan --dev-snapshot "$DEV_SNAPSHOT" | tee "$RUNNER_TEMP/prod-copy-plan.out"
          flags="$(sed -n 's/^FLAGS //p' "$RUNNER_TEMP/prod-copy-plan.out")"
          var="$(sed -n 's/^VAR //p' "$RUNNER_TEMP/prod-copy-plan.out")"
          [[ "$flags" =~ ^--prod-copy( --agent-tools)?( --team-vm)?$ ]]
          [[ "$var" =~ ^(CLOUD_FREESTYLE_SNAPSHOT|TEAM_VM_SNAPSHOT)$ ]]
          FREESTYLE_API_KEY_FILE="$key_file" bun scripts/cmux-vm-image/prod-copy.ts account-check
          {
            echo "flags=$flags"
            echo "var=$var"
            echo "team_vm=$([ "$var" = TEAM_VM_SNAPSHOT ] && echo --team-vm || true)"
          } >> "$GITHUB_OUTPUT"

      - name: Bake the production copy
        if: inputs.mode == 'prod-copy'
        id: prod_bake
        env:
          FREESTYLE_KEY_SECRET: ${{ secrets.FREESTYLE_API_KEY }}
          FLAGS: ${{ steps.plan.outputs.flags }}
        run: |
          set -euo pipefail
          # First: the key moves to an unexported shell variable, so no child process inherits it.
          key="$FREESTYLE_KEY_SECRET"
          unset FREESTYLE_KEY_SECRET
          umask 077
          key_file="$(mktemp "$RUNNER_TEMP/freestyle-key.XXXXXX")"
          trap 'rm -f "$key_file"' EXIT
          printf '%s' "$key" > "$key_file"
          unset key
          chmod 600 "$key_file"
          mkdir -p "$OUT_DIR"
          # shellcheck disable=SC2086
          FREESTYLE_API_KEY_FILE="$key_file" bun ../images/cmux-vm/bake.ts --tag "$TAG" --out-dir "$OUT_DIR" $FLAGS | tee "$OUT_DIR/bake.out"
          snapshot="$(awk '/^IMAGE_ID /{print $2}' "$OUT_DIR/bake.out" | tail -1)"
          test -n "$snapshot"
          echo "snapshot=$snapshot" >> "$GITHUB_OUTPUT"

      - name: Smoke the production copy
        if: inputs.mode == 'prod-copy'
        env:
          FREESTYLE_KEY_SECRET: ${{ secrets.FREESTYLE_API_KEY }}
          SNAPSHOT: ${{ steps.prod_bake.outputs.snapshot }}
          CLONES: ${{ inputs.clones }}
          TEAM_VM: ${{ steps.plan.outputs.team_vm }}
        run: |
          set -euo pipefail
          # First: the key moves to an unexported shell variable, so no child process inherits it.
          key="$FREESTYLE_KEY_SECRET"
          unset FREESTYLE_KEY_SECRET
          umask 077
          key_file="$(mktemp "$RUNNER_TEMP/freestyle-key.XXXXXX")"
          trap 'rm -f "$key_file"' EXIT
          printf '%s' "$key" > "$key_file"
          unset key
          chmod 600 "$key_file"
          # shellcheck disable=SC2086
          FREESTYLE_API_KEY_FILE="$key_file" bun ../images/cmux-vm/smoke.ts --snapshot "$SNAPSHOT" --tag "$TAG" --clones "$CLONES" --out-dir "$OUT_DIR" $TEAM_VM | tee "$OUT_DIR/smoke.out"

      # What promote-record.ts --production-copy records as names.production of the dev entry.
      - name: Production copy candidate
        if: inputs.mode == 'prod-copy'
        id: prod_candidate
        env:
          SNAPSHOT: ${{ steps.prod_bake.outputs.snapshot }}
          DEV_SNAPSHOT: ${{ inputs.dev_snapshot }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          SNAPSHOT_VAR: ${{ steps.plan.outputs.var }}
          FLAGS: ${{ steps.plan.outputs.flags }}
          TEAM_VM: ${{ steps.plan.outputs.team_vm }}
          CLONES: ${{ inputs.clones }}
        run: |
          set -euo pipefail
          bake_json="$(find "$OUT_DIR" -maxdepth 1 -name 'bake-*.json' | head -1)"
          smoke_json="$OUT_DIR/smoke-$TAG.json"
          jq -e '.passed == true' "$smoke_json" > /dev/null
          jq -e '.name | startswith("cmuxnp-prod-vmimg-")' "$bake_json" > /dev/null
          jq -n --slurpfile b "$bake_json" --slurpfile s "$smoke_json" --arg id "$SNAPSHOT" --arg dev "$DEV_SNAPSHOT" --arg sha "$SOURCE_SHA" --arg run "$RUN_ID" \
            --arg var "$SNAPSHOT_VAR" --arg bake "images/cmux-vm/bake.ts $FLAGS" --arg smoke "smoke.ts --clones $CLONES $TEAM_VM" \
            'def words: split(" ") | map(select(. != "")) | join(" ");
             ($bake | words) as $bake | ($smoke | words) as $smoke |
             {schema: 1, env: "production", copy_of: $dev, var: $var, snapshot: $b[0].name, snapshot_id: $id, lock_sha256: $b[0].lockSha256, source_sha: $sha, run: ($run|tonumber), baked_at: (now|todate),
              bake: "\($bake) (CI run \($run))", smoke: {result: "PASSED", at: (now|todate), detail: "\($smoke) (CI run \($run)): \($s[0].checks | length) checks passed"}}
             + (if ($b[0].desktop // null) != null then {desktop: $b[0].desktop} else {} end)
             + (if ($b[0].inputsSha256 // null) != null then {inputs_sha256: $b[0].inputsSha256} else {} end)
             + (if $b[0].teamFilesRoot then {team_files_root: $b[0].teamFilesRoot} else {} end)' \
            > "$OUT_DIR/channel-production.json"
          cat "$OUT_DIR/channel-production.json"

      - name: Reproducibility
        if: inputs.mode == 'repro'
        env:
          FREESTYLE_API_KEY: ${{ secrets.FREESTYLE_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$OUT_DIR"
          bun ../images/cmux-vm/repro.ts --tag "$TAG" --out-dir "$OUT_DIR" | tee "$OUT_DIR/repro.out"

      # Should a bake step fill package caches? Only where a first session measurably gets faster (first-session.ts).
      - name: First-session cache probe
        if: inputs.mode == 'first-session'
        env:
          FREESTYLE_API_KEY: ${{ secrets.FREESTYLE_API_KEY }}
          DEV_SNAPSHOT: ${{ inputs.dev_snapshot }}
        run: |
          set -euo pipefail
          mkdir -p "$OUT_DIR"
          snapshot="${DEV_SNAPSHOT:-$(jq -r '.snapshot_id' ../images/cmux-vm/channels/dev.json)}"
          bun ../images/cmux-vm/first-session.ts --snapshot "$snapshot" --tag "$TAG" --out-dir "$OUT_DIR" | tee "$OUT_DIR/first-session.out"

      # Deletes every id the ledger recorded and did not delete yet: the bake
      # snapshot, and any builder or clone a failed or cancelled step left.
      - name: Delete everything this run created
        if: always() && inputs.mode != 'prod-copy'
        env:
          FREESTYLE_API_KEY: ${{ secrets.FREESTYLE_API_KEY }}
          # Keep the snapshot only when its smoke (and a dev tree's first build) passed; a failed bake leaves nothing behind.
          KEEP: ${{ inputs.keep_snapshot && inputs.mode == 'bake' && steps.smoke.outcome == 'success' && (!inputs.dev_tree || steps.first_build.outcome == 'success') && (!(inputs.agent_tools && inputs.probes) || steps.agent_tools_probe.outcome == 'success') && '--keep-snapshot' || '' }}
          # The bake step ignores layered for a dev tree (always a full bake), so the GC does too.
          LAYERED: ${{ inputs.layered && !inputs.dev_tree && inputs.mode == 'bake' && 'true' || '' }}
        run: |
          if [ -f "$OUT_DIR/resources.tsv" ]; then
            # shellcheck disable=SC2086
            bun ../images/cmux-vm/cleanup.ts --ledger "$OUT_DIR/resources.tsv" $KEEP
          else
            echo "no ledger; nothing was created"
          fi
          # The large image and its smoke clones (their own ledger): the snapshot stays only when the image's is
          # kept and the candidate records it (its own smoke passed); otherwise it goes with its clones.
          if [ -f "$OUT_DIR/large/resources.tsv" ]; then
            keep_large=""
            if [ -n "$KEEP" ] && jq -e '.large.snapshot_id' "$OUT_DIR/channel-dev.json" > /dev/null 2>&1; then keep_large=--keep-snapshot; fi
            bun ../images/cmux-vm/cleanup.ts --ledger "$OUT_DIR/large/resources.tsv" $keep_large || echo "::warning title=Large image::some large image resources were not deleted (large/resources.tsv in the artifact)"
          fi
          # Layers built this run are kept (the next run boots them); only a builder a killed run left goes.
          if [ -f "$OUT_DIR/layers/resources.tsv" ]; then
            bun ../images/cmux-vm/cleanup.ts --ledger "$OUT_DIR/layers/resources.tsv" --keep-snapshot
          fi
          # Old cached layers go: the newest 3 of each, every referenced one and their parents stay (gc-layers.ts).
          if [ -f "$OUT_DIR/layers/resources.tsv" ] || [ "$LAYERED" = true ]; then
            bun ../images/cmux-vm/gc-layers.ts --keep 3 || echo "::warning title=Layer GC::some old layer snapshots were not deleted"
          fi

      # The production copy is kept only once its candidate (a passed smoke) is written.
      - name: Delete everything this production copy run created
        if: always() && inputs.mode == 'prod-copy'
        env:
          FREESTYLE_KEY_SECRET: ${{ secrets.FREESTYLE_API_KEY }}
          KEEP: ${{ steps.prod_candidate.outcome == 'success' && '--keep-snapshot' || '' }}
        run: |
          set -euo pipefail
          # First: the key moves to an unexported shell variable, so no child process inherits it.
          key="$FREESTYLE_KEY_SECRET"
          unset FREESTYLE_KEY_SECRET
          umask 077
          key_file="$(mktemp "$RUNNER_TEMP/freestyle-key.XXXXXX")"
          trap 'rm -f "$key_file"' EXIT
          printf '%s' "$key" > "$key_file"
          unset key
          chmod 600 "$key_file"
          if [ -f "$OUT_DIR/resources.tsv" ]; then
            # shellcheck disable=SC2086
            FREESTYLE_API_KEY_FILE="$key_file" bun ../images/cmux-vm/cleanup.ts --ledger "$OUT_DIR/resources.tsv" $KEEP
          else
            echo "no ledger; nothing was created"
          fi

      - name: Upload SBOM, manifest and logs
        if: always()
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-vm-image-${{ inputs.mode }}-${{ github.run_id }}
          path: ${{ github.workspace }}/cmux-vm-image-out
          if-no-files-found: warn
          # Keep only candidates that passed every gate for delayed manual promotions; transient
          # and failed bakes expire quickly so they cannot consume the repository quota.
          retention-days: ${{ fromJSON(((inputs.mode == 'prod-copy' && steps.prod_candidate.outcome == 'success') || (inputs.mode == 'bake' && steps.candidate.outcome == 'success')) && '7' || '3') }}


  # Time to first build on new machines of the dev channel's image, which has no dev tree:
  # clone, toolchains and a cold build of this run's commit (first-build.ts --mode before), while the bake runs.
  first-build-before:
    if: inputs.mode == 'bake' && inputs.dev_tree
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && (vars.CI_FORK_LINUX_RUNNER || 'ubuntu-24.04') || 'cmux-linux' }}
    environment:
      name: cmux-next-vm-image-dev
      deployment: false
    timeout-minutes: 150
    defaults:
      run:
        working-directory: web
    env:
      OUT_DIR: ${{ github.workspace }}/cmux-vm-image-out
      TAG: ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      # A persistent pool VM keeps the last job's checkout as a git cache. One left sparse (patterns, skip-worktree
      # bits) or with a ref to a missing object makes actions/checkout leave files out or fail (runs 44739498261 and
      # 44733869883, 2026-11-20); remove it so checkout clones fresh. Its manual test: test_ci_reused_sparse_checkout.py.
      - name: Remove a reused workspace left sparse or broken (self-hosted Linux)
        working-directory: ${{ github.workspace }}
        if: runner.os == 'Linux'
        shell: bash
        run: |
          [ "${RUNNER_ENVIRONMENT:-}" = self-hosted ] && [ -e "$GITHUB_WORKSPACE/.git" ] || exit 0
          cd "$GITHUB_WORKSPACE"
          why=""
          if [ "$(git config --get core.sparseCheckout 2>/dev/null)" = true ] || [ -e .git/info/sparse-checkout ]; then
            why="sparse"
          elif git ls-files -v 2>/dev/null | grep -q '^S'; then
            why="skip-worktree entries"
          elif ! git rev-parse --verify -q 'HEAD^{commit}' >/dev/null; then
            why="HEAD does not resolve"
          elif git for-each-ref --format='%(objectname)' 2>/dev/null | git cat-file --batch-check 2>/dev/null | grep -q ' missing$'; then
            why="a ref names a missing object"
          else
            exit 0
          fi
          echo "reused workspace on ${RUNNER_NAME:-this runner}: $why; removing it so checkout starts clean"
          find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
          no-cache: ${{ !startsWith(github.workspace, '/home/runner/work/') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: First build before
        env:
          FREESTYLE_API_KEY: ${{ secrets.FREESTYLE_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$OUT_DIR"
          snapshot="$(jq -r .snapshot_id ../images/cmux-vm/channels/dev.json)"
          bun ../images/cmux-vm/first-build.ts --mode before --snapshot "$snapshot" --tag "$TAG" --ref "$GITHUB_SHA" --out-dir "$OUT_DIR" | tee "$OUT_DIR/first-build-before.out"

      - name: Delete everything this run created
        if: always()
        env:
          FREESTYLE_API_KEY: ${{ secrets.FREESTYLE_API_KEY }}
        run: |
          if [ -f "$OUT_DIR/resources.tsv" ]; then
            bun ../images/cmux-vm/cleanup.ts --ledger "$OUT_DIR/resources.tsv"
          else
            echo "no ledger; nothing was created"
          fi

      - name: Upload the measurement
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-vm-image-first-build-before-${{ github.run_id }}
          path: ${{ github.workspace }}/cmux-vm-image-out
          if-no-files-found: warn
          retention-days: 3

  # The before/after table in the run summary (first-build.ts --report; no Freestyle access).
  first-build-report:
    if: ${{ !cancelled() && inputs.mode == 'bake' && inputs.dev_tree }}
    needs: [bake, first-build-before]
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && (vars.CI_FORK_LINUX_RUNNER || 'ubuntu-24.04') || 'cmux-linux' }}
    timeout-minutes: 5
    steps:
      # A persistent pool VM keeps the last job's checkout as a git cache. One left sparse (patterns, skip-worktree
      # bits) or with a ref to a missing object makes actions/checkout leave files out or fail (runs 44739498261 and
      # 44733869883, 2026-11-20); remove it so checkout clones fresh. Its manual test: test_ci_reused_sparse_checkout.py.
      - name: Remove a reused workspace left sparse or broken (self-hosted Linux)
        working-directory: ${{ github.workspace }}
        if: runner.os == 'Linux'
        shell: bash
        run: |
          [ "${RUNNER_ENVIRONMENT:-}" = self-hosted ] && [ -e "$GITHUB_WORKSPACE/.git" ] || exit 0
          cd "$GITHUB_WORKSPACE"
          why=""
          if [ "$(git config --get core.sparseCheckout 2>/dev/null)" = true ] || [ -e .git/info/sparse-checkout ]; then
            why="sparse"
          elif git ls-files -v 2>/dev/null | grep -q '^S'; then
            why="skip-worktree entries"
          elif ! git rev-parse --verify -q 'HEAD^{commit}' >/dev/null; then
            why="HEAD does not resolve"
          elif git for-each-ref --format='%(objectname)' 2>/dev/null | git cat-file --batch-check 2>/dev/null | grep -q ' missing$'; then
            why="a ref names a missing object"
          else
            exit 0
          fi
          echo "reused workspace on ${RUNNER_NAME:-this runner}: $why; removing it so checkout starts clean"
          find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
          no-cache: ${{ !startsWith(github.workspace, '/home/runner/work/') }}

      - name: Download the measurements
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: cmux-vm-image-*-${{ github.run_id }}
          path: ${{ runner.temp }}/first-build
          merge-multiple: true

      - name: Before/after table
        env:
          DIR: ${{ runner.temp }}/first-build
        run: |
          set -euo pipefail
          before="$(find "$DIR" -name 'first-build-before-*.json' | head -1)"
          after="$(find "$DIR" -name 'first-build-after-*.json' | head -1)"
          if [ -z "$before" ] || [ -z "$after" ]; then
            echo "a side has no measurement (before: ${before:-none}, after: ${after:-none})" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          bun images/cmux-vm/first-build.ts --report "$before" "$after" | tee -a "$GITHUB_STEP_SUMMARY"
