name: CI main full suite

# Pull requests run only the tests their diff reaches, and the merge queue that
# ran the full suite before landing is off. This workflow is the full-suite
# signal for main, run continuously and one at a time: a push to main dispatches
# CI on main's HEAD when no full-suite run is in flight, and each run's
# completion dispatches the next on the newest HEAD. A red result therefore
# covers only the commits that landed during one run. The schedule is a
# backstop for a missed event. It keeps one tracking issue open while main is
# red, and names the merged pull requests suspected of each new failure, on
# the issue and on those pull requests (main_regression_attribution.py).
#
# It dispatches ci.yml instead of calling it so the run keeps the identity the
# app-host product transport trusts (path ci.yml, event workflow_dispatch), and
# so CI's own routing, suite choice and runner selection stay untouched. Every
# workflow_dispatch CI run routes every area and runs the full suite.
on:
  push:
    branches: [main]
  schedule:
    - cron: "23 */3 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Dispatch CI even when main's HEAD already has a full-suite run.
        required: false
        default: false
        type: boolean
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions: {}

env:
  # Temporary REST budget attribution: one gh-call line per GitHub API call (scripts/ci/api_call_log/env.sh, fetched at a fixed commit when the checkout has no copy).
  BASH_ENV: '$({ w="${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh"; t="${RUNNER_TEMP:-/nonexistent}/api-call-log-src"; if [ -f "$w" ]; then echo "$w"; elif [ -n "${RUNNER_TEMP:-}" ]; then if [ ! -f "$t/env.sh" ] && [ ! -e "$t.tried" ] && { [ "${RUNNER_OS:-}" = Linux ] || [ "${RUNNER_OS:-}" = macOS ]; } && [ "$(date -u +%Y%m%d%H)" -lt 2026112300 ]; then : > "$t.tried"; mkdir -p "$t.part" && for x in env.sh gh sitecustomize.py isolated.py; do curl -fsSL --max-time 5 -o "$t.part/$x" "https://raw.githubusercontent.com/manaflow-ai/cmux/27647ffd3ae838c63be28ca3e5883dcd68c34518/scripts/ci/api_call_log/$x" || break; done; [ -s "$t.part/isolated.py" ] && mv "$t.part" "$t"; fi; if [ -f "$t/env.sh" ]; then echo "$t/env.sh"; else echo unset BASH_ENV > "$t.off.sh" && echo "$t.off.sh"; fi; fi; } 2>/dev/null)'
  # Keep the display-name trigger checked against its stable workflow identity.
  SOURCE_WORKFLOW_PATHS: .github/workflows/ci.yml

jobs:
  dispatch:
    name: Dispatch full-suite CI on main
    # A completed full-suite run on main is what starts the next one, so the
    # gate always finds either nothing in flight or the run it must wait for.
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || (github.event.workflow_run.event == 'workflow_dispatch' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.path == '.github/workflows/ci.yml')) }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || contains(fromJSON('["cmux-gcp-secret-jit-x64","cmux-gcp-nightly-jit-x64"]'), vars.CI_TRUSTED_RUNNER) && vars.CI_TRUSTED_RUNNER || 'cmux-gcp-nightly-jit-x64' }}
    timeout-minutes: 20
    # Never cancel a running gate: it holds the slot until its dispatched run
    # exists, so two gates never both see "nothing in flight". GitHub drops
    # an older pending gate when a newer one queues, which is harmless because
    # every gate reads main's HEAD afresh. Each dispatched CI run has a
    # concurrency group of its own (ci.yml), so a dispatch never replaces a
    # full-suite run still pending.
    concurrency:
      group: ci-main-full-suite-dispatch
      cancel-in-progress: false
    permissions:
      actions: write
      contents: read
    env:
      # A scheduled job's GitHub API waits stop here and fail loud (scripts/ci/gh_budget_wait.sh).
      GH_BUDGET_WAIT_MAX_SECONDS: "900"
    steps:
      # This commit's GitHub API wait (scripts/ci/gh_budget_wait.sh): every later gh call, and
      # each github-script step that installs gh_budget_wait.cjs, waits through a rate limit or a
      # GitHub 5xx under the job's GH_BUDGET_WAIT_MAX_SECONDS, then fails loud.
      - name: Checkout the GitHub API wait
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: .gh-budget-tooling
          sparse-checkout: |
            scripts/ci/gh_budget_wait.sh
            scripts/ci/gh_budget_wait.cjs
          sparse-checkout-cone-mode: false
      - name: Wait through GitHub API rate limits and 5xx in this job
        working-directory: ${{ github.workspace }}
        run: bash .gh-budget-tooling/scripts/ci/gh_budget_wait.sh --install

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: scripts/ci

      # A scheduled job's calls on the job token share the repository's per-hour installation pool with
      # every other workflow; spent, the call ends "HTTP 403: API rate limit exceeded for installation" and
      # the nightly silently does not run (ios-reliability-matrix 11-23/11-25, cmux#57719). The cmux bot
      # App's token has its own hour; the job token stays the fallback when it cannot be minted.
      # Detector: scripts/ci/cron_dispatch_token_lint.py.
      - name: Mint the cmux bot App token
        id: app-token
        if: ${{ vars.CMUX_BOT_APP_ID != '' }}
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.CMUX_BOT_APP_ID }}
          private-key: ${{ secrets.CMUX_BOT_APP_KEY }}
          permission-actions: write
          permission-contents: read
      - name: Skip when main's HEAD already has a full-suite run
        id: gate
        env:
          # The job token's hour runs out under load, and a gate that cannot
          # read main fails open into a dispatch (the 15:25Z schedule gate on
          # 2026-11-26), so it reads on the cmux bot App's token like the
          # dispatch below.
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          FORCE: ${{ inputs.force && 'true' || 'false' }}
          COMPLETED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if ! head_sha="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"; then
            # A completed run cannot show that main moved, so leave it to the
            # schedule rather than re-run the commit that just finished.
            if [ -n "${COMPLETED_SHA:-}" ] && [ "$FORCE" != "true" ]; then
              echo "Could not read main's HEAD after a completed run; the schedule retries."
              echo "dispatch=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Could not read main's HEAD; dispatching the full suite."
            echo "dispatch=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gate_args=()
          if [ "$FORCE" = "true" ]; then
            gate_args+=(--force)
          fi
          if [ -n "${COMPLETED_SHA:-}" ]; then
            gate_args+=(--completed-sha "$COMPLETED_SHA")
          fi
          python3 scripts/ci/main_full_suite.py gate --head-sha "$head_sha" ${gate_args[@]+"${gate_args[@]}"}

      - name: Dispatch CI on main
        if: ${{ steps.gate.outputs.dispatch == 'true' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        run: |
          set -euo pipefail
          # Hold this job's concurrency slot until the new run exists, so the
          # next gate sees it in flight instead of dispatching a second one.
          # return_run_details makes the dispatch answer with the run GitHub
          # created, so there is nothing to poll for; a dispatch that names no
          # run fails rather than passing for "listed".
          run_url="$(gh api -X POST "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/dispatches" \
            -f ref=main -F return_run_details=true --jq '.html_url // ""')"
          if [ -z "$run_url" ]; then
            echo "::error::The CI dispatch returned no run, so the next gate may dispatch main a second time."
            exit 1
          fi
          echo "Dispatched full-suite CI on main: $run_url" >> "$GITHUB_STEP_SUMMARY"

  report:
    name: Sync the main full-suite failure issue
    # workflow_run reports each dispatched CI run as it completes. The
    # scheduled tick re-syncs from the newest green or red run, so a missed
    # workflow_run event is caught within one tick. A push has nothing new to
    # report. Reports are idempotent.
    if: ${{ (github.event_name != 'workflow_run' && github.event_name != 'push' && github.ref == 'refs/heads/main') || (github.event.workflow_run.event == 'workflow_dispatch' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.path == '.github/workflows/ci.yml') }}
    # The cmux-bot mint below holds an App key: LINUX_RUNNER moves this job only among Blacksmith sizes.
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.CI_SECRET_SKIP_FLEET != '1' && 'cmux-gcp-secret-jit-x64' || contains(fromJSON('["blacksmith-4vcpu-ubuntu-2404","blacksmith-8vcpu-ubuntu-2404","blacksmith-16vcpu-ubuntu-2404","blacksmith-32vcpu-ubuntu-2404"]'), vars.LINUX_RUNNER) && vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    # Attribution reads the failed app-host shard logs of two runs (about
    # three minutes) and diffs the pull requests merged between them.
    timeout-minutes: 20
    concurrency:
      group: ci-main-full-suite-report
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      issues: write
      # Comments on the pull requests suspected of a new failure.
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false
          # The trees attribution ranks pull requests against, besides the scripts.
          sparse-checkout: |
            scripts/ci
            cmuxTests
            Sources
            Packages/macOS
            Packages/Shared
            CLI

      # This job's reads spend the cmux-bot App's own budget, not the repository's GITHUB_TOKEN pool
      # (1,000 requests an hour shared by every workflow; run 44010289849 failed on "API rate limit
      # exceeded for installation"). github.token stays the fallback: for a failed mint, a
      # refused read, and every write (hq docs/compendium/ci-quotas.md, cmux#35264).
      - name: Mint the cmux-bot token for this job's reads
        id: read-token
        if: vars.CMUX_BOT_APP_ID != ''
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.CMUX_BOT_APP_ID }}
          private-key: ${{ secrets.CMUX_BOT_APP_KEY }}
          permission-actions: read
          permission-contents: read
          permission-issues: read
          permission-pull-requests: read

      # scripts/ci/gh_app_token.sh --reads-only: a gh read made with github.token goes out as the App
      # (github.token again when the App is refused); issue and comment writes stay github.token's.
      - name: Send this job's gh reads as the cmux-bot App, github.token as the fallback
        env:
          GH_APP_TOKEN: ${{ steps.read-token.outputs.token }}
          GH_FALLBACK_TOKEN: ${{ github.token }}
        run: bash scripts/ci/gh_app_token.sh --install --reads-only

      - name: Attribute new failures to merged pull requests
        # A report-only heuristic: its failure must not stop the issue sync.
        continue-on-error: true
        # A hung fetch or API call must not eat the job's 20 minutes: the rest
        # is left for the issue sync.
        timeout-minutes: 12
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          # Main's recent history, without blobs, for the commit range between
          # two runs and each merged pull request's diff. Continuous runs keep
          # that range to a few dozen commits.
          git fetch --no-tags --filter=blob:none --depth=1000 origin main
          run_args=()
          if [ -n "$RUN_ID" ]; then
            run_args=(--run-id "$RUN_ID")
          fi
          python3 scripts/ci/main_regression_attribution.py report ${run_args[@]+"${run_args[@]}"} \
            --section-output "$RUNNER_TEMP/new-failures.md"

      - name: Open, update or close the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          run_args=()
          if [ -n "$RUN_ID" ]; then
            run_args=(--run-id "$RUN_ID")
          fi
          python3 scripts/ci/main_full_suite.py report ${run_args[@]+"${run_args[@]}"} \
            --extra-section "$RUNNER_TEMP/new-failures.md"
