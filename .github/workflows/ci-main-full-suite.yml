name: CI main full suite

# Pull requests run only the tests their diff reaches, and the merge queue that
# ran the full suite before landing is off. This workflow is the full-suite
# signal for main, run continuously and one at a time: a push to main dispatches
# CI on main's HEAD when no full-suite run is in flight, and each run's
# completion dispatches the next on the newest HEAD. A red result therefore
# covers only the commits that landed during one run. The schedule is a
# backstop for a missed event. It keeps one tracking issue open while main is
# red, and names the merged pull requests suspected of each new failure, on
# the issue and on those pull requests (main_regression_attribution.py).
#
# It dispatches ci.yml instead of calling it so the run keeps the identity the
# app-host product transport trusts (path ci.yml, event workflow_dispatch), and
# so CI's own routing, suite choice and runner selection stay untouched. Every
# workflow_dispatch CI run routes every area and runs the full suite.
on:
  push:
    branches: [main]
  schedule:
    - cron: "23 */3 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Dispatch CI even when main's HEAD already has a full-suite run.
        required: false
        default: false
        type: boolean
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions: {}

env:
  # Keep the display-name trigger checked against its stable workflow identity.
  SOURCE_WORKFLOW_PATHS: .github/workflows/ci.yml

jobs:
  dispatch:
    name: Dispatch full-suite CI on main
    # A completed full-suite run on main is what starts the next one, so the
    # gate always finds either nothing in flight or the run it must wait for.
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || (github.event.workflow_run.event == 'workflow_dispatch' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.path == '.github/workflows/ci.yml')) }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 5
    # Never cancel a running gate: it holds the slot until its dispatched run
    # is listed, so two gates never both see "nothing in flight". GitHub drops
    # an older pending gate when a newer one queues, which is harmless because
    # every gate reads main's HEAD afresh. Dispatched CI runs share ci.yml's
    # main concurrency group, which does not cancel in-progress non-PR runs.
    concurrency:
      group: ci-main-full-suite-dispatch
      cancel-in-progress: false
    permissions:
      actions: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: scripts/ci

      - name: Skip when main's HEAD already has a full-suite run
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force && 'true' || 'false' }}
          COMPLETED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if ! head_sha="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"; then
            # A completed run cannot show that main moved, so leave it to the
            # schedule rather than re-run the commit that just finished.
            if [ -n "${COMPLETED_SHA:-}" ] && [ "$FORCE" != "true" ]; then
              echo "Could not read main's HEAD after a completed run; the schedule retries."
              echo "dispatch=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Could not read main's HEAD; dispatching the full suite."
            echo "dispatch=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gate_args=()
          if [ "$FORCE" = "true" ]; then
            gate_args+=(--force)
          fi
          if [ -n "${COMPLETED_SHA:-}" ]; then
            gate_args+=(--completed-sha "$COMPLETED_SHA")
          fi
          python3 scripts/ci/main_full_suite.py gate --head-sha "$head_sha" ${gate_args[@]+"${gate_args[@]}"}

      - name: Dispatch CI on main
        if: ${{ steps.gate.outputs.dispatch == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Hold this job's concurrency slot until the new run is listed, so the
          # next gate sees it in flight instead of dispatching a second one.
          # Compare creation times rather than run ids, so a failed lookup
          # cannot pass for "listed". The margin absorbs runner clock skew; any
          # other run it lets through is in flight and holds the next gate too.
          since="$(date -u -d '-60 seconds' +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref main
          listed=false
          for _ in $(seq 1 30); do
            newest="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=workflow_dispatch&per_page=1" --jq '.workflow_runs[0].created_at // ""' || true)"
            if [ -n "$newest" ] && [[ ! "$newest" < "$since" ]]; then
              listed=true
              break
            fi
            sleep 3
          done
          if [ "$listed" != true ]; then
            echo "::error::The dispatched CI run was not listed after 30 checks, so the next gate may dispatch main a second time."
            exit 1
          fi
          echo "Dispatched full-suite CI on main." >> "$GITHUB_STEP_SUMMARY"

  report:
    name: Sync the main full-suite failure issue
    # workflow_run reports each dispatched CI run as it completes. The
    # scheduled tick re-syncs from the newest green or red run, so a missed
    # workflow_run event is caught within one tick. A push has nothing new to
    # report. Reports are idempotent.
    if: ${{ (github.event_name != 'workflow_run' && github.event_name != 'push' && github.ref == 'refs/heads/main') || (github.event.workflow_run.event == 'workflow_dispatch' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.path == '.github/workflows/ci.yml') }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    # Attribution reads the failed app-host shard logs of two runs (about
    # three minutes) and diffs the pull requests merged between them.
    timeout-minutes: 20
    concurrency:
      group: ci-main-full-suite-report
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      issues: write
      # Comments on the pull requests suspected of a new failure.
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false
          # The trees attribution ranks pull requests against, besides the scripts.
          sparse-checkout: |
            scripts/ci
            cmuxTests
            Sources
            Packages/macOS
            Packages/Shared
            CLI

      - name: Attribute new failures to merged pull requests
        # A report-only heuristic: its failure must not stop the issue sync.
        continue-on-error: true
        # A hung fetch or API call must not eat the job's 20 minutes: the rest
        # is left for the issue sync.
        timeout-minutes: 12
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          # Main's recent history, without blobs, for the commit range between
          # two runs and each merged pull request's diff. Continuous runs keep
          # that range to a few dozen commits.
          git fetch --no-tags --filter=blob:none --depth=1000 origin main
          run_args=()
          if [ -n "$RUN_ID" ]; then
            run_args=(--run-id "$RUN_ID")
          fi
          python3 scripts/ci/main_regression_attribution.py report ${run_args[@]+"${run_args[@]}"} \
            --section-output "$RUNNER_TEMP/new-failures.md"

      - name: Open, update or close the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          run_args=()
          if [ -n "$RUN_ID" ]; then
            run_args=(--run-id "$RUN_ID")
          fi
          python3 scripts/ci/main_full_suite.py report ${run_args[@]+"${run_args[@]}"} \
            --extra-section "$RUNNER_TEMP/new-failures.md"
