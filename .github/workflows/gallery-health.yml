name: gallery health

# Every gallery state must render (scripts/gallery-matrix/health.ts): a state that errors, never
# reports ready, crashes the renderer, or whose play cannot reach it fails this check unless
# scripts/gallery-matrix/broken-allowlist.json names it with why. A pull request, and each push to
# feat-cmux-next, renders the entries it touches (touched.ts; everything for a global stylesheet or
# a change to the checker). A schedule here would never fire: GitHub runs schedules only from the
# default branch (main), and this workflow lives on feat-cmux-next.

on:
  pull_request:
    branches: [feat-cmux-next]
    types: [opened, synchronize, reopened]
    paths:
      - "webviews/**"
      - "scripts/gallery-matrix/**"
      - "bun.lock"
      - ".github/workflows/gallery-health.yml"
  push:
    branches: [feat-cmux-next]
    paths:
      - "webviews/**"
      - "scripts/gallery-matrix/**"
      - "bun.lock"
      - ".github/workflows/gallery-health.yml"

permissions:
  contents: read

concurrency:
  # A push renders only what it touched, so a later push must not cancel it.
  group: gallery-health-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  health:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.11.1"

      - name: Cache Playwright's apt packages
        continue-on-error: true
        uses: ./.github/actions/playwright-apt-cache
        with:
          engines: chromium

      - name: Choose the entries to render
        id: entries
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          cd webviews
          bun install --frozen-lockfile
          if [ "$EVENT" = pull_request ]; then
            git diff --name-only "$(git merge-base "origin/$BASE_REF" HEAD)" HEAD > "$RUNNER_TEMP/changed.txt"
          elif git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            git diff --name-only "$BEFORE" HEAD > "$RUNNER_TEMP/changed.txt"
          else
            # A new branch tip with no previous commit to compare: render everything.
            echo .github/workflows/gallery-health.yml > "$RUNNER_TEMP/changed.txt"
          fi
          if [ -s "$RUNNER_TEMP/changed.txt" ]; then
            bun scripts/gallery/touched.ts --changed "$RUNNER_TEMP/changed.txt" --out "$RUNNER_TEMP/touched.json"
            # The checker itself changed: render everything with it.
            if grep -q '^scripts/gallery-matrix/\|^\.github/workflows/gallery-health\.yml$' "$RUNNER_TEMP/changed.txt"; then
              echo 'all=true' >> "$GITHUB_OUTPUT"
            else
              echo "all=$(jq -r .all "$RUNNER_TEMP/touched.json")" >> "$GITHUB_OUTPUT"
            fi
            echo "ids=$(jq -r '.entries | join(",")' "$RUNNER_TEMP/touched.json")" >> "$GITHUB_OUTPUT"
          else
            echo 'all=false' >> "$GITHUB_OUTPUT"
            echo 'ids=' >> "$GITHUB_OUTPUT"
          fi

      - name: Render the gallery and judge it
        if: ${{ steps.entries.outputs.all == 'true' || steps.entries.outputs.ids != '' }}
        env:
          ALL: ${{ steps.entries.outputs.all }}
          IDS: ${{ steps.entries.outputs.ids }}
          SHARD: ${{ matrix.shard }}
          CMUX_GALLERY_IN_VM: "1"
        run: |
          set -euo pipefail
          cd webviews
          if [ "$ALL" = true ]; then
            bun scripts/gallery/manifest.ts --frame component --out "$RUNNER_TEMP/manifest.json"
          else
            bun scripts/gallery/manifest.ts --frame component --entries "$IDS" --out "$RUNNER_TEMP/manifest.json"
          fi
          CMUX_GALLERY_OUT_DIR="$RUNNER_TEMP/gallery" bun run gallery:build
          cd "$GITHUB_WORKSPACE/scripts/gallery-matrix"
          bun install --frozen-lockfile
          ./node_modules/.bin/playwright install --with-deps --only-shell chromium
          bun health.ts --manifest "$RUNNER_TEMP/manifest.json" --gallery-dir "$RUNNER_TEMP/gallery" \
            --output-dir "$RUNNER_TEMP/health" --shard-count 4 --shard-index "$SHARD"

      - name: Upload the health run
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gallery-health-${{ matrix.shard }}
          path: ${{ runner.temp }}/health
          if-no-files-found: ignore
          retention-days: 7
