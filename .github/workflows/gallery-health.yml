name: gallery health

# Every gallery state must render (scripts/gallery-matrix/health.ts): a state that errors, never
# reports ready, crashes the renderer, or whose play cannot reach it fails this check unless
# scripts/gallery-matrix/broken-allowlist.json names it with why. On a pull request, a red state that is red the
# same way on the base it merged with is the base's: the check warns on it and passes (base reds
# are warnings, not failures). A crash, a cut-short render, or no base result still fails. A pull request
# (when the trigger is put back) renders the entries it touches (touched.ts; everything for a global
# stylesheet or a change to the checker). The post-merge batch renders every entry. Both run only when a
# path the gallery render reads changes: the suite's `paths` in .github/post-merge-batch.json, which
# scripts/gallery-matrix/unplaced.py also reads (tests/test_ci_gallery_health_merge_ref.py keeps it in step
# with touched.ts and with the files the gallery imports from outside webviews/). A filter is safe because no
# ruleset requires this check: a pull request that changes none of these paths gets no gallery
# health check at all, never a pending one, and next-autoland gates on the check only where it ran.
# If this check is ever made required, move the filter into a router job first (cmux-next.yml
# path_route), so a skipped pull request reports a pass instead of waiting forever.
#
# A routed file that no entry imports renders every entry (scripts/gallery-matrix/unplaced.py): a file
# outside webviews/src/, or a webviews/src/ file that is not source (a string catalog, an untraced
# asset). It is global to every page. An unreached webviews/src/ source file renders nothing.
#
# A dispatch (workflow_dispatch) renders every entry at the dispatched ref: the nightly full render
# of the base. A schedule here would never fire: GitHub runs schedules only from the default
# branch (main), and this workflow lives on feat-cmux-next, so the nightly needs a dispatcher on
# main that dispatches this workflow on feat-cmux-next once a day (as
# cmux-next-resource-budget-dispatch.yml does for cmux-next-perf-bench.yml).

on:
  # Not on pull requests (2026-11-21, CI time map): the 16 render shards were ~75,000 runner-minutes a day,
  # 89% of them on pull requests, at a 3% miss rate (cmuxterm-hq#16094). Nor on each push to feat-cmux-next
  # (2026-11-21, the post-merge batch tier, RFD 0023 in cmuxterm-hq): the post-merge batch
  # (cmux-next-post-merge.yml, suite gallery-health) calls it with the tip once a window, when the commits
  # since the last batch touched a path the render reads, and renders every entry with no base (as the
  # nightly dispatch does), so a red there fails and the batch bisects it to the merge that made it. The
  # paths list lives in that suite of .github/post-merge-batch.json: what a gallery render reads, and nothing
  # else (2026-11-05 CI audit, cmuxterm-hq plans/ci/baggage-2026-11-05.md): the webviews UI sources and the
  # gallery's own build, the files outside webviews/ they import or read (galleryHost.ts, gen-strings.mjs),
  # the lockfiles of both installs, the checker and this workflow. Scripts are listed file by file. The
  # PR-only parts below (the base gallery job, the base replay) stay, so putting `pull_request:` (branches
  # [feat-cmux-next], types opened/synchronize/reopened, that paths list) back is the whole revert.
  workflow_call:
    inputs:
      sha:
        description: "The commit to render (the post-merge batch's tip or a bisect probe's commit). Empty: the event's own."
        type: string
        default: ""
      only:
        description: "The one job id to run (a bisect probe): health. Empty: every job."
        type: string
        default: ""
      base:
        description: "The commit the red states are judged against (the post-merge batch's last judged batch head, or a bisect probe's known-good commit): a state red there too is a standing red, listed by name and not failed. Empty: no base, every red state fails."
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      screenshots:
        description: "Screenshots to upload besides red states': `all` (every state, for browsing index.html), or states (entry#variant) and entries, comma-separated"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  # The nightly dispatch and a post-merge batch run (or bisect probe) of the same commit must not cancel
  # each other: under the batch caller github.sha is the caller's tip, so the batch keys on inputs.sha.
  group: gallery-health-${{ github.event.pull_request.number || format('{0}-{1}', inputs.sha && format('batch-{0}', inputs.only) || github.event_name, inputs.sha || github.sha) }}
  cancel-in-progress: true

env:
  # Temporary REST budget attribution: one gh-call line per GitHub API call (scripts/ci/api_call_log/env.sh, fetched at a fixed commit when the checkout has no copy).
  BASH_ENV: '$({ w="${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh"; t="${RUNNER_TEMP:-/nonexistent}/api-call-log-src"; if [ -f "$w" ]; then echo "$w"; elif [ -n "${RUNNER_TEMP:-}" ]; then if [ ! -f "$t/env.sh" ] && [ ! -e "$t.tried" ] && { [ "${RUNNER_OS:-}" = Linux ] || [ "${RUNNER_OS:-}" = macOS ]; } && [ "$(date -u +%Y%m%d%H)" -lt 2026112300 ]; then : > "$t.tried"; mkdir -p "$t.part" && for x in env.sh gh sitecustomize.py isolated.py; do curl -fsSL --max-time 5 -o "$t.part/$x" "https://raw.githubusercontent.com/manaflow-ai/cmux/27647ffd3ae838c63be28ca3e5883dcd68c34518/scripts/ci/api_call_log/$x" || break; done; [ -s "$t.part/isolated.py" ] && mv "$t.part" "$t"; fi; if [ -f "$t/env.sh" ]; then echo "$t/env.sh"; else echo unset BASH_ENV > "$t.off.sh" && echo "$t.off.sh"; fi; fi; } 2>/dev/null)'

jobs:
  # The base gallery, built once a run while the shards render the head (~5 minutes, so it is ready before any
  # shard judges), for the shards whose red states replay on the base: each built the whole gallery itself,
  # ~55-85 s of every judged shard on 2026-11-11, and 54 of 72 pull request runs judged all 16 shards. It checks
  # out the same merge ref the shards do and builds its first parent; a shard uses the build only when that is
  # its own base (base-sha.txt) and builds its red entries itself otherwise (missing, failed, or a moved merge
  # ref). Pull requests only: a push's base is the tip it replaced, which its shards resolve themselves.
  base-gallery:
    name: base gallery
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || vars.CI_OVERFLOW_LINUX || 'cmux-linux' }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.sha || '' }}
          # A pull request needs the merge and its two parents (the base is HEAD^1, which the base replay
          # restores); a dispatch needs only the tip. Only a push compares with `before`, which may be any
          # depth back. Full history took ~90 s of every shard's ~95 s checkout (2026-11-11 timing records).
          # Quoted: in an expression `cond && 0 || 2` is always 2, because 0 is falsy and `||` takes the
          # right side. The string '0' is truthy, so a push really fetches full history.
          fetch-depth: ${{ github.event_name == 'push' && '0' || '2' }}
          filter: blob:none
          # Only what a render reads: the folders and files of the `paths` list above (every routed path
          # is inside these; tests/test_ci_gallery_health_merge_ref.py keeps it so), and scripts/ and
          # .github/ for this job's own tools. The whole tree minus verify/ fetched ~600 MB of blobs this
          # job never opens (cmux-tui, Packages' Swift, web/, docs): ~60 s of every shard's ~8-minute job
          # (2026-11-11 timing records). `git restore ... -- .` in the base replay keeps to these paths.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /webviews/
            /cmux-tui/crates/acpmux/spec/acpmux-protocol.json
            /examples/gallery/
            /examples/looks/
            /scripts/
            /.github/
            /config/vite-plus/
            /schemas/
            /design/icons/neko-candidates/
            /first-party-apps/*/preview/**
            /Resources/ghostty/themes/
            /Resources/cmux-themes/
            /Resources/markdown-viewer/
            /Packages/Shared/CmuxAgentQuestion/Sources/CmuxAgentQuestion/Fixtures/
            /Packages/macOS/CmuxNext/Sources/**/*.xcstrings
            /Packages/macOS/CmuxNext/Sources/CmuxNextDesign/Windows/WebTheme.swift
            /Packages/macOS/CmuxNext/Sources/CmuxNextDesign/Tunables/MetricTunables.swift
            /Packages/macOS/CmuxNext/Sources/CmuxNextPages/PageDescriptor.swift
            /web/data/model-catalog/
            /release-notes/next/highlights/
            /first-party-apps/*/preview/scenes.json
            scripts/ci/toolchain-r2.sh
            scripts/ci/toolchain-archives.sha256
            scripts/ci/r2-cache.sh
            scripts/ci/lan_cache_fetch.py
            scripts/ci/toolchain-r2.sh
            scripts/ci/toolchain-archives.sha256
            scripts/ci/r2-cache.sh
            scripts/ci/lan_cache_fetch.py
            /.gitmodules
          persist-credentials: false

      - name: Restore pinned Bun 1.4.4 from the CI cache bucket
        shell: bash
        continue-on-error: true
        run: bash "$GITHUB_WORKSPACE/scripts/ci/toolchain-r2.sh" restore bun 1.4.4 || true

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
          no-cache: ${{ !startsWith(github.workspace, '/home/runner/work/') || !(github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && github.event_name != 'merge_group' && contains(fromJSON('["refs/heads/main","refs/heads/feat-cmux-next","refs/heads/nightly-next"]'), github.ref)) }}

      - name: Restore pinned Node 24.22.1 from the CI cache bucket
        shell: bash
        continue-on-error: true
        run: bash "$GITHUB_WORKSPACE/scripts/ci/toolchain-r2.sh" restore node 24.22.1 || true

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.22.1"

      - name: Build the base gallery
        run: |
          set -euo pipefail
          base=$(git rev-parse HEAD^1)
          # The tree the judge step restores, by the same command.
          git restore --source="$base" --staged --worktree -- . ':(exclude)scripts/gallery-matrix'
          cd webviews
          bun install --frozen-lockfile
          # A base is only replayed to excuse the head's reds: a translation the base lacked (one a later
          # push added) must not stop its build, or no red is excused (2026-11-21, base 22d99c7425).
          CMUX_STRINGS_BEST_EFFORT=1 CMUX_GALLERY_OUT_DIR="$RUNNER_TEMP/base-gallery" bun run gallery:build
          echo "$base" > "$RUNNER_TEMP/base-gallery/base-sha.txt"
          echo "built the base gallery of $base: $(find "$RUNNER_TEMP/base-gallery" -type f | wc -l) files"

      - name: Upload the base gallery
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gallery-base-build
          path: ${{ runner.temp }}/base-gallery
          retention-days: 1
          if-no-files-found: error
          # A whole-workflow rerun runs this job again under the same run, where the first attempt's artifact
          # of this name already exists: without this the upload fails and the rerun goes red.
          overwrite: true

  # Picks the entries this run renders and sizes the health matrix to them (2026-11-22, CI time map): sixteen
  # shards started on every run, so a push that touched one entry paid sixteen checkouts, installs and gallery
  # builds to render a few dozen cases (most push runs, ~20 runner-minutes each), and a full render past 16 x
  # MAX_CASES_PER_SHARD failed shard 0 on every run ("outgrows its shards", 13,002 cases on 2026-11-22). Now a
  # run gets ceil(cases / MAX_CASES_PER_SHARD) shards, at most MAX_SHARDS, and a run that renders nothing
  # starts none.
  plan:
    name: plan
    if: ${{ (inputs.only == '' || inputs.only == 'health') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || vars.CI_OVERFLOW_LINUX || 'cmux-linux' }}
    timeout-minutes: 15
    outputs:
      all: ${{ steps.entries.outputs.all }}
      ids: ${{ steps.entries.outputs.ids }}
      cases: ${{ steps.size.outputs.cases }}
      shards: ${{ steps.size.outputs.shards }}
      split: ${{ steps.size.outputs.split }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.sha || '' }}
          # A pull request needs the merge and its two parents (the base is HEAD^1, which the base replay
          # restores); a dispatch needs only the tip. Only a push compares with `before`, which may be any
          # depth back. Full history took ~90 s of every shard's ~95 s checkout (2026-11-11 timing records).
          # Quoted: in an expression `cond && 0 || 2` is always 2, because 0 is falsy and `||` takes the
          # right side. The string '0' is truthy, so a push really fetches full history.
          fetch-depth: ${{ github.event_name == 'push' && '0' || '2' }}
          filter: blob:none
          # Only what a render reads: the folders and files of the `paths` list above (every routed path
          # is inside these; tests/test_ci_gallery_health_merge_ref.py keeps it so), and scripts/ and
          # .github/ for this job's own tools. The whole tree minus verify/ fetched ~600 MB of blobs this
          # job never opens (cmux-tui, Packages' Swift, web/, docs): ~60 s of every shard's ~8-minute job
          # (2026-11-11 timing records). `git restore ... -- .` in the base replay keeps to these paths.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /webviews/
            /cmux-tui/crates/acpmux/spec/acpmux-protocol.json
            /examples/gallery/
            /examples/looks/
            /scripts/
            /.github/
            /config/vite-plus/
            /schemas/
            /design/icons/neko-candidates/
            /first-party-apps/*/preview/**
            /Resources/ghostty/themes/
            /Resources/cmux-themes/
            /Resources/markdown-viewer/
            /Packages/Shared/CmuxAgentQuestion/Sources/CmuxAgentQuestion/Fixtures/
            /Packages/macOS/CmuxNext/Sources/**/*.xcstrings
            /Packages/macOS/CmuxNext/Sources/CmuxNextDesign/Windows/WebTheme.swift
            /Packages/macOS/CmuxNext/Sources/CmuxNextDesign/Tunables/MetricTunables.swift
            /Packages/macOS/CmuxNext/Sources/CmuxNextPages/PageDescriptor.swift
            /web/data/model-catalog/
            /release-notes/next/highlights/
            /first-party-apps/*/preview/scenes.json
            scripts/ci/toolchain-r2.sh
            scripts/ci/toolchain-archives.sha256
            scripts/ci/r2-cache.sh
            scripts/ci/lan_cache_fetch.py
            scripts/ci/toolchain-r2.sh
            scripts/ci/toolchain-archives.sha256
            scripts/ci/r2-cache.sh
            scripts/ci/lan_cache_fetch.py
            /.gitmodules
          persist-credentials: false

      - name: Restore pinned Bun 1.4.4 from the CI cache bucket
        shell: bash
        continue-on-error: true
        run: bash "$GITHUB_WORKSPACE/scripts/ci/toolchain-r2.sh" restore bun 1.4.4 || true

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
          no-cache: ${{ !startsWith(github.workspace, '/home/runner/work/') || !(github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && github.event_name != 'merge_group' && contains(fromJSON('["refs/heads/main","refs/heads/feat-cmux-next","refs/heads/nightly-next"]'), github.ref)) }}

      - name: Restore pinned Node 24.22.1 from the CI cache bucket
        shell: bash
        continue-on-error: true
        run: bash "$GITHUB_WORKSPACE/scripts/ci/toolchain-r2.sh" restore node 24.22.1 || true

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.22.1"

      - name: Choose the entries to render
        id: entries
        env:
          EVENT: ${{ inputs.sha != '' && 'workflow_dispatch' || github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # Each part in its own log group, so its time shows in the log and in the controller's
          # /v1/github/job-groups: the step takes ~45 s a shard while bun install (~1.5 s) and touched.ts
          # alone (~1.5 s on Linux) explain little of it (2026-11-11). Find the cost before cutting it.
          cd webviews
          echo "::group::bun install"
          bun install --frozen-lockfile
          echo "::endgroup::"
          echo "::group::changed files"
          if [ "$EVENT" = pull_request ]; then
            # The merge's first parent is the base it was merged with: the diff is the pull request's change.
            git diff --name-only HEAD^1 HEAD > "$RUNNER_TEMP/changed.txt"
          elif [ "$EVENT" = workflow_dispatch ]; then
            # The nightly full render of the base, or a post-merge batch run: render everything.
            echo .github/workflows/gallery-health.yml > "$RUNNER_TEMP/changed.txt"
          elif git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            git diff --name-only "$BEFORE" HEAD > "$RUNNER_TEMP/changed.txt"
          else
            # A new branch tip with no previous commit to compare: render everything.
            echo .github/workflows/gallery-health.yml > "$RUNNER_TEMP/changed.txt"
          fi
          echo "$(wc -l < "$RUNNER_TEMP/changed.txt") changed files"
          echo "::endgroup::"
          if [ -s "$RUNNER_TEMP/changed.txt" ]; then
            echo "::group::touched entries"
            bun scripts/gallery/touched.ts --changed "$RUNNER_TEMP/changed.txt" --out "$RUNNER_TEMP/touched.json"
            echo "::endgroup::"
            # The checker itself changed: render everything with it. So does a routed file no entry
            # imports (a theme, a font, a string catalog, a lockfile): it is global to every page, and
            # rendering nothing would pass with no verdict.
            if grep -q '^scripts/gallery-matrix/\|^\.github/workflows/gallery-health\.yml$' "$RUNNER_TEMP/changed.txt"; then
              echo 'all=true' >> "$GITHUB_OUTPUT"
            elif [ "$(python3 ../scripts/gallery-matrix/unplaced.py ../.github/workflows/gallery-health.yml \
                "$RUNNER_TEMP/changed.txt" "$RUNNER_TEMP/touched.json")" = true ]; then
              echo 'all=true' >> "$GITHUB_OUTPUT"
            else
              echo "all=$(jq -r .all "$RUNNER_TEMP/touched.json")" >> "$GITHUB_OUTPUT"
            fi
            echo "ids=$(jq -r '.entries | join(",")' "$RUNNER_TEMP/touched.json")" >> "$GITHUB_OUTPUT"
          else
            echo 'all=false' >> "$GITHUB_OUTPUT"
            echo 'ids=' >> "$GITHUB_OUTPUT"
          fi

      - name: Size the matrix to the cases
        id: size
        env:
          ALL: ${{ steps.entries.outputs.all }}
          IDS: ${{ steps.entries.outputs.ids }}
          # Held in step with "Hold each shard within its time budget" (tests/test_ci_gallery_health_merge_ref.py).
          MAX_CASES_PER_SHARD: "800"
          MAX_SHARDS: "32"
          # A push's full render runs a slice of the full split, not all of it (2026-11-23, Leo 2026-11-21 ~03:55Z:
          # "id rather we simply cut shit now and revisit later"). Most pushes that render everything touch no
          # entry: a string catalog, a theme or a CI sweep that edits every workflow (9 of 15 runs, 23:23Z-00:55Z
          # 11-22, each 17 shards; full renders were about 75% of the workflow's runner time). Each such push
          # renders PUSH_FULL_SHARDS shards of the 17, and the next one the next slice (by run number), so a
          # stretch of pushes still covers every case. The off switch: the repository variable
          # GALLERY_HEALTH_PUSH_FULL_SHARDS set to `all` renders every shard again; a number sets the slice. A
          # dispatch (the full render of a ref) and a push that touched entries are unchanged.
          EVENT: ${{ github.event_name }}
          PUSH_FULL_SHARDS: ${{ vars.GALLERY_HEALTH_PUSH_FULL_SHARDS || '2' }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          cd webviews
          if [ "$ALL" = true ]; then
            bun scripts/gallery/manifest.ts --frame component --out "$RUNNER_TEMP/manifest.json"
          elif [ -n "$IDS" ]; then
            bun scripts/gallery/manifest.ts --frame component --entries "$IDS" --out "$RUNNER_TEMP/manifest.json"
          else
            echo '[]' > "$RUNNER_TEMP/manifest.json"
          fi
          cases=$(jq length "$RUNNER_TEMP/manifest.json")
          shards=$(( (cases + MAX_CASES_PER_SHARD - 1) / MAX_CASES_PER_SHARD ))
          [ "$shards" -le "$MAX_SHARDS" ] || shards=$MAX_SHARDS
          echo "cases=$cases" >> "$GITHUB_OUTPUT"
          echo "split=$shards" >> "$GITHUB_OUTPUT"
          echo "$cases cases to render: $shards shard(s) of at most $MAX_CASES_PER_SHARD (at most $MAX_SHARDS shards)"
          slice=${PUSH_FULL_SHARDS:-all}
          if [ "${EVENT:-}" = push ] && [ "$ALL" = true ] && [[ "$slice" =~ ^[0-9]+$ ]] && [ "$slice" -gt 0 ] \
              && [ "$slice" -lt "$shards" ]; then
            # Consecutive runs take consecutive slices, wrapping, so ceil(shards / slice) full-render pushes cover all.
            start=$(( (${RUN_NUMBER:-0} * slice) % shards ))
            echo "shards=$(jq -cn --argjson n "$shards" --argjson k "$slice" --argjson s "$start" \
              '[range($k) | (. + $s) % $n]')" >> "$GITHUB_OUTPUT"
            echo "a push's full render: $slice of the $shards shards, from shard $start (GALLERY_HEALTH_PUSH_FULL_SHARDS=all renders every shard)"
          else
            echo "shards=$(jq -cn --argjson n "$shards" '[range($n)]')" >> "$GITHUB_OUTPUT"
          fi

  health:
    needs: plan
    if: ${{ (inputs.only == '' || inputs.only == 'health') && needs.plan.outputs.shards != '[]' && needs.plan.outputs.shards != '' }}
    # The 16 vCPU pool (its next member is 32 vCPU when 16 starts nothing): a shard's render is CPU-bound, about
    # three quarters of each case is the stage's page loading and mounting in a fresh renderer, and on 4 vCPU the
    # four workers held the CPU at 91% (#41952's shards: per-case p50 1.0-1.6 s against 583 ms alone, render 4-6
    # min of a 7-11 min job). Same 73 cases, same runner code (2026-11-13, AMD EPYC, 8 cores x 2 threads): 4 vCPU
    # with 4 workers 30.5 s, 8 with 8 17.3 s, 16 with 12 13.4 s. Reusing a context per worker or merging the reads
    # after ready saved 6% at most: the page load is the cost, so a shard gets more cores, not less setup
    # (ask-378f0fa70e).
    # A pull request's shards take the 8 vCPU pool, a dispatch's full render keeps 16 (2026-11-18): the
    # Blacksmith org vCPU cap starved every pool, and 16 shards of 16 vCPU asked 256 vCPU of it per push.
    # From the numbers above, 8 vCPU renders the 73 cases in 17.3 s against 13.4 s, at 138 vCPU-seconds
    # against 214: a shard takes about a third longer and the run 35% fewer vCPU-seconds, at half the peak.
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || vars.CI_OVERFLOW_LINUX || 'cmux-linux' }}
    timeout-minutes: 45
    # As many shards as the run's cases need (the plan job): at most MAX_CASES_PER_SHARD each, so a shard runs in
    # under 10 minutes as the gallery grows. At eight fixed shards, with three cases at once, a shard's render took
    # 9 to 13 minutes and its job 11 to 17 (run 42946512341, 2026-11-11); a full render is ~17 shards now.
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      # A pull request renders its merge with base (the event's merge ref), as the other PR gates do:
      # a branch cut before a base fix must not keep failing on what base already fixed. A push
      # renders the pushed commit.
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.sha || '' }}
          # A pull request needs the merge and its two parents (the base is HEAD^1, which the base replay
          # restores); a dispatch needs only the tip. Only a push compares with `before`, which may be any
          # depth back. Full history took ~90 s of every shard's ~95 s checkout (2026-11-11 timing records).
          # Quoted: in an expression `cond && 0 || 2` is always 2, because 0 is falsy and `||` takes the
          # right side. The string '0' is truthy, so a push really fetches full history.
          fetch-depth: ${{ github.event_name == 'push' && '0' || '2' }}
          filter: blob:none
          # Only what a render reads: the folders and files of the `paths` list above (every routed path
          # is inside these; tests/test_ci_gallery_health_merge_ref.py keeps it so), and scripts/ and
          # .github/ for this job's own tools. The whole tree minus verify/ fetched ~600 MB of blobs this
          # job never opens (cmux-tui, Packages' Swift, web/, docs): ~60 s of every shard's ~8-minute job
          # (2026-11-11 timing records). `git restore ... -- .` in the base replay keeps to these paths.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /webviews/
            /cmux-tui/crates/acpmux/spec/acpmux-protocol.json
            /examples/gallery/
            /examples/looks/
            /scripts/
            /.github/
            /config/vite-plus/
            /schemas/
            /design/icons/neko-candidates/
            /first-party-apps/*/preview/**
            /Resources/ghostty/themes/
            /Resources/cmux-themes/
            /Resources/markdown-viewer/
            /Packages/Shared/CmuxAgentQuestion/Sources/CmuxAgentQuestion/Fixtures/
            /Packages/macOS/CmuxNext/Sources/**/*.xcstrings
            /Packages/macOS/CmuxNext/Sources/CmuxNextDesign/Windows/WebTheme.swift
            /Packages/macOS/CmuxNext/Sources/CmuxNextDesign/Tunables/MetricTunables.swift
            /Packages/macOS/CmuxNext/Sources/CmuxNextPages/PageDescriptor.swift
            /web/data/model-catalog/
            /release-notes/next/highlights/
            /first-party-apps/*/preview/scenes.json
            scripts/ci/toolchain-r2.sh
            scripts/ci/toolchain-archives.sha256
            scripts/ci/r2-cache.sh
            scripts/ci/lan_cache_fetch.py
            scripts/ci/toolchain-r2.sh
            scripts/ci/toolchain-archives.sha256
            scripts/ci/r2-cache.sh
            scripts/ci/lan_cache_fetch.py
            /.gitmodules
          persist-credentials: false

      - name: Resolve the head and the merge
        id: resolve
        env:
          # A post-merge batch run (inputs.sha set) is a full render, whatever event started the batch. It is
          # judged against inputs.base (the last judged batch's head, or a probe's known-good commit) when the
          # caller passes one; with none it has no base, as the nightly dispatch has.
          EVENT: ${{ inputs.sha != '' && 'workflow_dispatch' || github.event_name }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          BATCH_BASE: ${{ inputs.sha != '' && inputs.base || '' }}
        run: |
          set -euo pipefail
          merge=$(git rev-parse HEAD)
          if [ "$EVENT" = pull_request ]; then
            # The merge ref moves with each push; a stale one renders another head.
            [ "$(git rev-parse HEAD^2)" = "$PR_HEAD" ] || { echo "::error::the merge ref is not on the pull request head $PR_HEAD; push again"; exit 1; }
            head=$PR_HEAD
            base=$(git rev-parse HEAD^1)
          elif [ "$EVENT" = push ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            # A push is judged against the tip it replaced (the event's `before`): a state red there
            # too was red before this push and is a warning here; only a state this push turned red
            # fails it, so the red names the push that caused it.
            head=$merge
            base=$BEFORE
          elif [ -n "$BATCH_BASE" ]; then
            # A post-merge batch (or bisect probe) is judged against the commit its caller named: a state
            # red there too is a standing red, listed by name in the summary, and only a state red since
            # then fails, so the batch's bisect hunts the merge that made a new red, not an old one.
            [[ "$BATCH_BASE" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::inputs.base is not a commit sha: $BATCH_BASE"; exit 1; }
            git cat-file -e "$BATCH_BASE^{commit}" 2>/dev/null \
              || timeout 120 git fetch --quiet --no-tags --depth=1 --filter=blob:none origin "$BATCH_BASE" \
              || { echo "::error::could not fetch the batch base $BATCH_BASE"; exit 1; }
            head=$merge
            base=$BATCH_BASE
          else
            # The nightly dispatch, or a new branch tip with no previous commit: no base, so every
            # red state fails. The dispatch's full render is what keeps an old red from hiding.
            head=$merge
            base=
          fi
          { echo "head_sha=$head"; echo "merge_sha=$merge"; echo "base_sha=$base"; } >> "$GITHUB_OUTPUT"
          echo "head $head, rendering $merge${base:+ (merged with base $base)}"

      - name: Restore pinned Bun 1.4.4 from the CI cache bucket
        shell: bash
        continue-on-error: true
        run: bash "$GITHUB_WORKSPACE/scripts/ci/toolchain-r2.sh" restore bun 1.4.4 || true

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
          no-cache: ${{ !startsWith(github.workspace, '/home/runner/work/') || !(github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && github.event_name != 'merge_group' && contains(fromJSON('["refs/heads/main","refs/heads/feat-cmux-next","refs/heads/nightly-next"]'), github.ref)) }}

      - name: Restore pinned Node 24.22.1 from the CI cache bucket
        shell: bash
        continue-on-error: true
        run: bash "$GITHUB_WORKSPACE/scripts/ci/toolchain-r2.sh" restore node 24.22.1 || true

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.22.1"

      - name: Cache Playwright's apt packages
        continue-on-error: true
        uses: ./.github/actions/playwright-apt-cache
        with:
          engines: chromium

      # The plan job chose the entries and sized the matrix; a shard only installs what its build needs.
      - name: Install the webviews packages
        id: install
        working-directory: webviews
        run: bun install --frozen-lockfile

      # Merge-time signal for the job's own time (cmuxterm-hq docs/handbook/fast-job-outgrows-its-budget.md):
      # the gallery grows a few cases with most pull requests, and at a fixed shard count each shard's
      # render grows with it, from ~15 to ~24 minutes in four days before anyone saw it (2026-11-07..11).
      # A full render of 11,424 cases over 16 shards (714 a shard) ran its job in about 8.5 minutes at p90
      # against a 10-minute budget (2026-11-11). The plan job sizes the matrix to MAX_CASES_PER_SHARD, so this
      # fails only when a run needs more than its MAX_SHARDS, naming the shard count that fits. It judges the
      # cases this run renders (the plan's count), not a full render's: a one-entry push runs one shard. Shard 0
      # only: one error, not one a shard.
      - name: Hold each shard within its time budget
        # It goes on so the render still gives its verdict; "Fail past the case budget" fails the job.
        id: cap
        if: ${{ !cancelled() && strategy.job-index == 0 && steps.install.outcome == 'success' }}
        continue-on-error: true
        env:
          CASES: ${{ needs.plan.outputs.cases }}
          # The full split, which a push's full render starts only a slice of (the plan job).
          SHARDS: ${{ needs.plan.outputs.split || strategy.job-total }}
          MAX_CASES_PER_SHARD: "800"
        run: |
          set -euo pipefail
          per=$(( (CASES + SHARDS - 1) / SHARDS ))
          need=$(( (CASES + MAX_CASES_PER_SHARD - 1) / MAX_CASES_PER_SHARD ))
          echo "this run renders $CASES cases: $per a shard over $SHARDS shards (at most $MAX_CASES_PER_SHARD)"
          if [ "$per" -gt "$MAX_CASES_PER_SHARD" ]; then
            echo "::error title=gallery health outgrows its shards::this run renders $CASES cases, $per a shard over $SHARDS shards; past $MAX_CASES_PER_SHARD a shard's job runs over its 10-minute budget. Raise MAX_SHARDS in the plan job of .github/workflows/gallery-health.yml to $need shards."
            exit 1
          fi

      # GITHUB_ENV takes effect in the next step: resolve the browser before either head or base
      # renders, so both use the same executable instead of comparing Chrome with headless-shell.
      - name: Setup gallery browser
        if: ${{ needs.plan.outputs.all == 'true' || needs.plan.outputs.ids != '' }}
        working-directory: scripts/gallery-matrix
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          "$(git rev-parse --show-toplevel)/scripts/ci/ensure-system-chrome.sh"
          # The UI font is the macOS system font (SF Pro), which Linux lacks: without the pin the stack
          # falls to DejaVu Sans, a much wider face, so every stage wraps and sizes text unlike the Mac.
          # Inter, as the browser tests draw it (B7 webviews-linux-parity, scripts/gallery-matrix/parity.py).
          "$(git rev-parse --show-toplevel)/scripts/ci/pin-browser-test-font.sh"

      # A red here is judged state by state against the base in the next step, so the step goes on.
      - name: Render the gallery and judge it
        id: render
        if: ${{ needs.plan.outputs.all == 'true' || needs.plan.outputs.ids != '' }}
        continue-on-error: true
        # A render that stalls stops here with time left for the judge and the upload, instead of the job's
        # 45 minutes cancelling it with no verdict. With sixteen shards a render takes about 5 minutes.
        timeout-minutes: 20
        env:
          ALL: ${{ needs.plan.outputs.all }}
          IDS: ${{ needs.plan.outputs.ids }}
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ needs.plan.outputs.split || strategy.job-total }}
          CMUX_GALLERY_IN_VM: "1"
        run: |
          set -euo pipefail
          cd webviews
          if [ "$ALL" = true ]; then
            bun scripts/gallery/manifest.ts --frame component --out "$RUNNER_TEMP/manifest.json"
            subset=""
          else
            bun scripts/gallery/manifest.ts --frame component --entries "$IDS" --out "$RUNNER_TEMP/manifest.json"
            # Build only the entries this render reads (galleryEntrySubset in webviews/dev-server/galleryHost.ts),
            # as the base replay below does: each of 16 shards built all ~3,200 gallery modules (~55-85 s) to
            # render a handful of touched entries. The ids come from the manifest, not $IDS: --entries matches
            # by prefix, so the manifest can hold entries $IDS does not name exactly. A mock-app entry, or an
            # empty list, builds everything.
            subset="$(jq -r '[.[].params.entry // empty] | unique | join(",")' "$RUNNER_TEMP/manifest.json")"
          fi
          CMUX_GALLERY_ENTRIES="$subset" CMUX_GALLERY_OUT_DIR="$RUNNER_TEMP/gallery" bun run gallery:build
          cd "$GITHUB_WORKSPACE/scripts/gallery-matrix"
          # Three workers per four vCPUs past 8: two threads share each core there, and 12 workers on 16
          # vCPU rendered as fast as 16 with a lower p90 (3.0 s against 4.3) and less ready-CPU drift.
          cpus=$(nproc)
          workers=$(( cpus > 8 ? cpus * 3 / 4 : cpus ))
          bun health.ts --manifest "$RUNNER_TEMP/manifest.json" --gallery-dir "$RUNNER_TEMP/gallery" \
            --output-dir "$RUNNER_TEMP/health" --shard-count "$SHARDS" --shard-index "$SHARD" --concurrency "$workers"

      # The base gallery the "base gallery" job built for this run. Not there yet, or failed: the judge step
      # builds the red entries itself.
      - name: Fetch the base gallery
        if: ${{ !cancelled() && steps.render.outcome == 'failure' && github.event_name == 'pull_request' }}
        continue-on-error: true
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: gallery-base-build
          path: ${{ runner.temp }}/base-gallery

      # The rulebook's base reds are warnings: each red state of a pull request is rendered again on
      # the base it merged with (the merge's first parent), and each red state of a push on the tip
      # that push replaced (`before`), by the same checker, budgets and allowlist, and
      # scripts/ci/test_reds.py (the one per-test classifier) compares them state by state. A state
      # red the same way on the base is a warning; any other red state, a crashed render, a
      # health.json that is missing or cut short, a base render that gives no whole result, and any
      # red on the nightly dispatch (it has no base to compare with) fail the check.
      # It replays only the red states, never their whole entries: replaying entries re-rendered
      # 1,308 cases for one shard's ~40 red states (manifest --entries also matches by prefix, so
      # agent-pane.composer pulled in every agent-pane.composer-* entry), ran past the job's
      # timeout and left a cancelled job with no verdict. Its own budget makes a slow replay fail
      # here, with the upload still to come, instead of cancelling the job.
      - name: Judge the red states against the base
        if: ${{ !cancelled() && steps.render.outcome == 'failure' }}
        timeout-minutes: 15
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ steps.resolve.outputs.base_sha }}
          # health.ts renders only on CI or a VM; without this it stops before it writes a verdict.
          CMUX_GALLERY_IN_VM: "1"
        run: |
          set -euo pipefail
          classify="$RUNNER_TEMP/test_reds.py"
          cp scripts/ci/test_reds.py "$classify"
          head="$RUNNER_TEMP/health/health.json"
          if [ ! -s "$head" ]; then
            echo "::error::the render step stopped before it wrote health.json (it ran past its 20-minute limit or crashed): no verdict, see its log"
            exit 1
          fi
          if [ -z "$BASE_SHA" ]; then
            echo "::error::gallery health is red on this $EVENT, which has no base to compare with: every red state fails it"
            exit 1
          fi
          rc=0
          entries=$(python3 "$classify" gallery --head "$head" --entries) || rc=$?
          if [ "$rc" = 2 ]; then
            echo "::error::the render step failed but health.json names no red state: a setup or tool failure, never a base red"
            exit 1
          fi
          [ "$rc" = 0 ] || exit 1
          states=$(python3 "$classify" gallery --head "$head" --states)
          echo "replaying on base $BASE_SHA: $states"
          # Everything but the checker goes back to the base, so only the webviews tree differs.
          git restore --source="$BASE_SHA" --staged --worktree -- . ':(exclude)scripts/gallery-matrix'
          cd webviews
          # Each part in its own log group, so the replay's time is attributed (job-groups) before it is cut.
          echo "::group::base bun install"
          bun install --frozen-lockfile
          echo "::endgroup::"
          bun scripts/gallery/manifest.ts --frame component --entries "$entries" --out "$RUNNER_TEMP/base-entries.json"
          # Every case (theme, width) of each red state, and nothing else. A state the base does not have
          # renders nothing there, so the classifier calls it the head's own.
          jq --arg states "$states" '($states | split(",")) as $red
            | map(select(((.params.entry // "") + "#" + (.params.variant // "")) as $state | any($red[]; . == $state)))' \
            "$RUNNER_TEMP/base-entries.json" > "$RUNNER_TEMP/base-manifest.json"
          echo "base replay: $(jq length "$RUNNER_TEMP/base-manifest.json") of $(jq length "$RUNNER_TEMP/base-entries.json") cases of those entries"
          # The "base gallery" job's build of this base, when "Fetch the base gallery" got it. Otherwise only
          # the red entries' files are compiled here (CMUX_GALLERY_ENTRIES, galleryEntrySubset in
          # webviews/dev-server/galleryHost.ts; a base from before that plugin builds everything).
          if [ "$(cat "$RUNNER_TEMP/base-gallery/base-sha.txt" 2>/dev/null)" = "$BASE_SHA" ]; then
            echo "base gallery: the base gallery job's build of $BASE_SHA"
          else
            rm -rf "$RUNNER_TEMP/base-gallery"
            echo "::group::base gallery build"
            # Best-effort strings, as in the base gallery job: a translation the base lacked fails no replay.
            CMUX_STRINGS_BEST_EFFORT=1 CMUX_GALLERY_ENTRIES="$entries" CMUX_GALLERY_OUT_DIR="$RUNNER_TEMP/base-gallery" bun run gallery:build
            echo "::endgroup::"
          fi
          cd "$GITHUB_WORKSPACE/scripts/gallery-matrix"
          # Red on the base is the point here: its exit says so, and its verdict is read from health.json
          # below. A replay that wrote no health.json gave no verdict, and says so here.
          # The head keeps a state red only when it is red on every retry; the base renders twice with
          # no retries and a state red in either render is the base's. Holding the base to every retry
          # too called states that flake on the base (layout shift) the pull request's own.
          # Each render takes one case at a time, so a render under load does not excuse a red the head
          # kept on a quiet runner. The two renders run side by side: one after the other they were ~55 s
          # each for ten red cases (2026-11-11), most of it a case waiting out its play's timeout, not CPU.
          # Two pages at once is still less than the head's own render, which runs three.
          for pass in 1 2; do
            (
              rc=0
              bun health.ts --manifest "$RUNNER_TEMP/base-manifest.json" --gallery-dir "$RUNNER_TEMP/base-gallery" \
                --retries 0 --concurrency 1 --output-dir "$RUNNER_TEMP/health/base/$pass" > "$RUNNER_TEMP/base-render-$pass.log" 2>&1 || rc=$?
              echo "$rc" > "$RUNNER_TEMP/base-render-$pass.rc"
            ) &
          done
          wait
          bases=()
          for pass in 1 2; do
            echo "::group::base render $pass"
            cat "$RUNNER_TEMP/base-render-$pass.log"
            echo "::endgroup::"
            if [ ! -s "$RUNNER_TEMP/health/base/$pass/health.json" ]; then
              echo "::error::the base replay of $entries wrote no health.json (health.ts exited $(cat "$RUNNER_TEMP/base-render-$pass.rc")): no base verdict, so nothing is excused"
              exit 1
            fi
            bases+=(--base "$RUNNER_TEMP/health/base/$pass/health.json")
          done
          rc=0
          python3 "$classify" gallery --head "$head" "${bases[@]}" \
            --base-name "base ${BASE_SHA:0:12}" --annotate | tee "$RUNNER_TEMP/verdict.txt" || rc=$?
          grep -v '^::' "$RUNNER_TEMP/verdict.txt" >> "$GITHUB_STEP_SUMMARY" || true
          # Every standing red (red on the base too) by name, so a red this run excuses is never hidden.
          standing=$(python3 "$classify" gallery --head "$head" "${bases[@]}" --json | jq -r '.shared[]' 2>/dev/null) || true
          if [ -n "$standing" ]; then
            { echo; echo "Standing reds (red on base ${BASE_SHA:0:12} too, not failed here): $(grep -c . <<<"$standing")"
              sed 's/^/- /' <<<"$standing"; } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$rc"

      - name: Fail past the case budget
        if: ${{ !cancelled() && steps.cap.outcome == 'failure' }}
        run: |
          echo "::error::gallery health outgrows its shards: see the step \"Hold each shard within its time budget\""
          exit 1

      - name: Record what was rendered
        if: ${{ always() && steps.resolve.outcome == 'success' }}
        env:
          HEAD_SHA: ${{ steps.resolve.outputs.head_sha }}
          MERGE_SHA: ${{ steps.resolve.outputs.merge_sha }}
          BASE_SHA: ${{ steps.resolve.outputs.base_sha }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/health"
          # The head the pull request shows, beside the merge commit actually rendered.
          jq -n --arg head "$HEAD_SHA" --arg merge "$MERGE_SHA" --arg base "$BASE_SHA" \
            '{head_sha: $head, rendered_sha: $merge, base_sha: $base}' > "$RUNNER_TEMP/health/source.json"

      # The upload carries what its readers need (scripts/gallery-matrix/upload-set.ts): health.json,
      # source.json, each attempt's results.json and index.html, and the screenshots of red states, head
      # and base replay. A passing state's screenshot is read by nothing; a full render wrote ~190 MB of
      # them a shard (cmuxterm-hq#9131). The dispatch input `screenshots` keeps more.
      - name: Keep only the screenshots a reader needs
        if: ${{ always() && (steps.render.outcome == 'success' || steps.render.outcome == 'failure') }}
        continue-on-error: true
        env:
          KEEP: ${{ inputs.screenshots }}
        run: bun scripts/gallery-matrix/upload-set.ts --dir "$RUNNER_TEMP/health" --keep "$KEEP"

      - name: Upload the health run
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gallery-health-${{ matrix.shard }}
          path: ${{ runner.temp }}/health
          if-no-files-found: ignore
          retention-days: 7
