name: gallery health

# Every gallery state must render (scripts/gallery-matrix/health.ts): a state that errors, never
# reports ready, crashes the renderer, or whose play cannot reach it fails this check unless
# scripts/gallery-matrix/broken-allowlist.json names it with why. On a pull request, a red state that is red the
# same way on the base it merged with is the base's: the check warns on it and passes (base reds
# are warnings, not failures). A crash, a cut-short render, or no base result still fails. A pull request, and each push to
# feat-cmux-next, renders the entries it touches (touched.ts; everything for a global stylesheet or
# a change to the checker). Both run only when a path the gallery render reads changes (the list
# below; tests/test_ci_gallery_health_merge_ref.py keeps it in step with touched.ts and with the
# files the gallery imports from outside webviews/). The workflow-level filter is safe because no
# ruleset requires this check: a pull request that changes none of these paths gets no gallery
# health check at all, never a pending one, and next-autoland gates on the check only where it ran.
# If this check is ever made required, move the filter into a router job first (cmux-next.yml
# path_route), so a skipped pull request reports a pass instead of waiting forever.
#
# A routed file that no entry imports renders every entry (scripts/gallery-matrix/unplaced.py): a file
# outside webviews/src/, or a webviews/src/ file that is not source (a string catalog, an untraced
# asset). It is global to every page. An unreached webviews/src/ source file renders nothing.
#
# A dispatch (workflow_dispatch) renders every entry at the dispatched ref: the nightly full render
# of the base. A schedule here would never fire: GitHub runs schedules only from the default
# branch (main), and this workflow lives on feat-cmux-next, so the nightly needs a dispatcher on
# main that dispatches this workflow on feat-cmux-next once a day (as
# cmux-next-resource-budget-dispatch.yml does for cmux-next-perf-bench.yml).

on:
  pull_request:
    branches: [feat-cmux-next]
    types: [opened, synchronize, reopened]
    paths:
      # What a gallery render reads, and nothing else (2026-11-05 CI audit, cmuxterm-hq
      # plans/ci/baggage-2026-11-05.md): the webviews UI sources and the gallery's own build, the
      # files outside webviews/ they import or read (galleryHost.ts, gen-strings.mjs, uiFont.ts),
      # the lockfiles of both installs, the checker and this workflow. webviews/test, webviews/bench,
      # the other webviews scripts and the repository's root bun.lock render nothing here.
      - "webviews/src/**"
      - "!webviews/src/**/*.test.ts"
      - "!webviews/src/**/*.test.tsx"
      - "webviews/dev-server/**"
      - "webviews/scripts/gallery/**"
      - "webviews/scripts/agent-pane/**"
      - "webviews/scripts/pages/**"
      - "webviews/test/latency/mock-host.ts"
      - "webviews/vite.config.ts"
      - "webviews/vite.config.gallery.ts"
      - "webviews/reactCompiler.mjs"
      - "webviews/package.json"
      - "webviews/bun.lock"
      - "webviews/bunfig.toml"
      - "webviews/tsconfig.json"
      - "config/vite-plus/**"
      - "scripts/gallery-matrix/**"
      - "scripts/cmux-next/build-agent-pane-web.sh"
      - "scripts/ci/test_reds.py"
      - "scripts/ci/ensure-system-chrome.sh"
      - ".github/actions/playwright-apt-cache/**"
      - ".github/workflows/gallery-health.yml"
      - "schemas/gallery/**"
      - "schemas/agent-pane/wake-state.json"
      - "schemas/design-scale/**"
      - "schemas/type-scale/**"
      - "schemas/motion-scale/**"
      - "schemas/layout-grid/**"
      - "schemas/sync-motion/**"
      - "schemas/settings/settings-schema.json"
      - "Resources/ghostty/themes/**"
      - "Resources/cmux-themes/**"
      - "Resources/markdown-viewer/**"
      - "Packages/Shared/CmuxAgentQuestion/Sources/CmuxAgentQuestion/Fixtures/**"
      - "Packages/macOS/CmuxNext/Sources/CmuxNextDesign/Resources/Fonts/**"
      - "Packages/macOS/CmuxNext/Sources/CmuxNextDesign/Windows/WebTheme.swift"
      - "Packages/macOS/CmuxNext/Sources/CmuxNextDesign/Tunables/MetricTunables.swift"
      - "Packages/macOS/CmuxNext/Sources/CmuxNextActions/ActionCatalog.xcstrings"
      - "Packages/macOS/CmuxNext/Sources/CmuxNextActions/BrowserProfileActions.xcstrings"
      - "Packages/macOS/CmuxNext/Sources/CmuxNextActions/HistoryActions.xcstrings"
      - "Packages/macOS/CmuxNext/Sources/CmuxNextActions/RemoteActions.xcstrings"
      - "Packages/macOS/CmuxNext/Sources/CmuxNextApp/Resources/KeybindingsPage.xcstrings"
      - "Packages/macOS/CmuxNext/Sources/CmuxNextApp/Resources/MobilePairing.xcstrings"
      - "Packages/macOS/CmuxNext/Sources/CmuxNextApp/Resources/Passwords.xcstrings"
      - "Packages/macOS/CmuxNext/Sources/CmuxNextApps/Resources/Localizable.xcstrings"
      - "Packages/macOS/CmuxNext/Sources/CmuxNextBookmarks/Resources/Localizable.xcstrings"
      - "Packages/macOS/CmuxNext/Sources/CmuxNextHistory/Resources/Localizable.xcstrings"
      - "Packages/macOS/CmuxNext/Sources/CmuxNextServer/Resources/AddMachine.xcstrings"
      - "Packages/macOS/CmuxNext/Sources/CmuxNextSettings/Localizable.xcstrings"
      - "Packages/macOS/CmuxNext/Sources/CmuxNextSettingsWindow/Localizable.xcstrings"
      - "web/data/model-catalog/**"
      - "release-notes/next/highlights/**"
  push:
    branches: [feat-cmux-next]
    paths:
      - "webviews/src/**"
      - "!webviews/src/**/*.test.ts"
      - "!webviews/src/**/*.test.tsx"
      - "webviews/dev-server/**"
      - "webviews/scripts/gallery/**"
      - "webviews/scripts/agent-pane/**"
      - "webviews/scripts/pages/**"
      - "webviews/test/latency/mock-host.ts"
      - "webviews/vite.config.ts"
      - "webviews/vite.config.gallery.ts"
      - "webviews/reactCompiler.mjs"
      - "webviews/package.json"
      - "webviews/bun.lock"
      - "webviews/bunfig.toml"
      - "webviews/tsconfig.json"
      - "config/vite-plus/**"
      - "scripts/gallery-matrix/**"
      - "scripts/cmux-next/build-agent-pane-web.sh"
      - "scripts/ci/test_reds.py"
      - "scripts/ci/ensure-system-chrome.sh"
      - ".github/actions/playwright-apt-cache/**"
      - ".github/workflows/gallery-health.yml"
      - "schemas/gallery/**"
      - "schemas/agent-pane/wake-state.json"
      - "schemas/design-scale/**"
      - "schemas/type-scale/**"
      - "schemas/motion-scale/**"
      - "schemas/layout-grid/**"
      - "schemas/sync-motion/**"
      - "schemas/settings/settings-schema.json"
      - "Resources/ghostty/themes/**"
      - "Resources/cmux-themes/**"
      - "Resources/markdown-viewer/**"
      - "Packages/Shared/CmuxAgentQuestion/Sources/CmuxAgentQuestion/Fixtures/**"
      - "Packages/macOS/CmuxNext/Sources/CmuxNextDesign/Resources/Fonts/**"
      - "Packages/macOS/CmuxNext/Sources/CmuxNextDesign/Windows/WebTheme.swift"
      - "Packages/macOS/CmuxNext/Sources/CmuxNextDesign/Tunables/MetricTunables.swift"
      - "Packages/macOS/CmuxNext/Sources/CmuxNextActions/ActionCatalog.xcstrings"
      - "Packages/macOS/CmuxNext/Sources/CmuxNextActions/BrowserProfileActions.xcstrings"
      - "Packages/macOS/CmuxNext/Sources/CmuxNextActions/HistoryActions.xcstrings"
      - "Packages/macOS/CmuxNext/Sources/CmuxNextActions/RemoteActions.xcstrings"
      - "Packages/macOS/CmuxNext/Sources/CmuxNextApp/Resources/KeybindingsPage.xcstrings"
      - "Packages/macOS/CmuxNext/Sources/CmuxNextApp/Resources/MobilePairing.xcstrings"
      - "Packages/macOS/CmuxNext/Sources/CmuxNextApp/Resources/Passwords.xcstrings"
      - "Packages/macOS/CmuxNext/Sources/CmuxNextApps/Resources/Localizable.xcstrings"
      - "Packages/macOS/CmuxNext/Sources/CmuxNextBookmarks/Resources/Localizable.xcstrings"
      - "Packages/macOS/CmuxNext/Sources/CmuxNextHistory/Resources/Localizable.xcstrings"
      - "Packages/macOS/CmuxNext/Sources/CmuxNextServer/Resources/AddMachine.xcstrings"
      - "Packages/macOS/CmuxNext/Sources/CmuxNextSettings/Localizable.xcstrings"
      - "Packages/macOS/CmuxNext/Sources/CmuxNextSettingsWindow/Localizable.xcstrings"
      - "web/data/model-catalog/**"
      - "release-notes/next/highlights/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A push renders only what it touched, so a later push must not cancel it; nor may a push and the
  # nightly dispatch of the same commit cancel each other.
  group: gallery-health-${{ github.event.pull_request.number || format('{0}-{1}', github.event_name, github.sha) }}
  cancel-in-progress: true

env:
  # Temporary REST budget attribution: one gh-call line per GitHub API call (scripts/ci/api_call_log/env.sh).
  BASH_ENV: ${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh

jobs:
  health:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-4vcpu-ubuntu-2404' || fromJSON(vars.RUNNER_POOLS).linux }}
    timeout-minutes: 45
    # Eight shards, so a shard's render and its base replay both fit the timeout: with four, a
    # full render took ~27 minutes and the replay of its red states (every red state is rendered
    # again up to twice more when it stays red) ~14 more, past 45 minutes.
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      # A pull request renders its merge with base (the event's merge ref), as the other PR gates do:
      # a branch cut before a base fix must not keep failing on what base already fixed. A push
      # renders the pushed commit.
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: false # patterns: .github/checkout-lean.json
          sparse-checkout: |
            /*
            !/cmux-next-ios/verify/
          persist-credentials: false

      - name: Resolve the head and the merge
        id: resolve
        env:
          EVENT: ${{ github.event_name }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          merge=$(git rev-parse HEAD)
          if [ "$EVENT" = pull_request ]; then
            # The merge ref moves with each push; a stale one renders another head.
            [ "$(git rev-parse HEAD^2)" = "$PR_HEAD" ] || { echo "::error::the merge ref is not on the pull request head $PR_HEAD; push again"; exit 1; }
            head=$PR_HEAD
            base=$(git rev-parse HEAD^1)
          else
            head=$merge
            base=
          fi
          { echo "head_sha=$head"; echo "merge_sha=$merge"; echo "base_sha=$base"; } >> "$GITHUB_OUTPUT"
          echo "head $head, rendering $merge${base:+ (merged with base $base)}"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.22.1"

      - name: Cache Playwright's apt packages
        continue-on-error: true
        uses: ./.github/actions/playwright-apt-cache
        with:
          engines: chromium

      - name: Choose the entries to render
        id: entries
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          cd webviews
          bun install --frozen-lockfile
          if [ "$EVENT" = pull_request ]; then
            # The merge's first parent is the base it was merged with: the diff is the pull request's change.
            git diff --name-only HEAD^1 HEAD > "$RUNNER_TEMP/changed.txt"
          elif [ "$EVENT" = workflow_dispatch ]; then
            # The nightly full render of the base: render everything.
            echo .github/workflows/gallery-health.yml > "$RUNNER_TEMP/changed.txt"
          elif git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            git diff --name-only "$BEFORE" HEAD > "$RUNNER_TEMP/changed.txt"
          else
            # A new branch tip with no previous commit to compare: render everything.
            echo .github/workflows/gallery-health.yml > "$RUNNER_TEMP/changed.txt"
          fi
          if [ -s "$RUNNER_TEMP/changed.txt" ]; then
            bun scripts/gallery/touched.ts --changed "$RUNNER_TEMP/changed.txt" --out "$RUNNER_TEMP/touched.json"
            # The checker itself changed: render everything with it. So does a routed file no entry
            # imports (a theme, a font, a string catalog, a lockfile): it is global to every page, and
            # rendering nothing would pass with no verdict.
            if grep -q '^scripts/gallery-matrix/\|^\.github/workflows/gallery-health\.yml$' "$RUNNER_TEMP/changed.txt"; then
              echo 'all=true' >> "$GITHUB_OUTPUT"
            elif [ "$(python3 ../scripts/gallery-matrix/unplaced.py ../.github/workflows/gallery-health.yml \
                "$RUNNER_TEMP/changed.txt" "$RUNNER_TEMP/touched.json")" = true ]; then
              echo 'all=true' >> "$GITHUB_OUTPUT"
            else
              echo "all=$(jq -r .all "$RUNNER_TEMP/touched.json")" >> "$GITHUB_OUTPUT"
            fi
            echo "ids=$(jq -r '.entries | join(",")' "$RUNNER_TEMP/touched.json")" >> "$GITHUB_OUTPUT"
          else
            echo 'all=false' >> "$GITHUB_OUTPUT"
            echo 'ids=' >> "$GITHUB_OUTPUT"
          fi

      # GITHUB_ENV takes effect in the next step: resolve the browser before either head or base
      # renders, so both use the same executable instead of comparing Chrome with headless-shell.
      - name: Setup gallery browser
        if: ${{ steps.entries.outputs.all == 'true' || steps.entries.outputs.ids != '' }}
        working-directory: scripts/gallery-matrix
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          "$(git rev-parse --show-toplevel)/scripts/ci/ensure-system-chrome.sh"

      # A red here is judged state by state against the base in the next step, so the step goes on.
      - name: Render the gallery and judge it
        id: render
        if: ${{ steps.entries.outputs.all == 'true' || steps.entries.outputs.ids != '' }}
        continue-on-error: true
        env:
          ALL: ${{ steps.entries.outputs.all }}
          IDS: ${{ steps.entries.outputs.ids }}
          SHARD: ${{ matrix.shard }}
          CMUX_GALLERY_IN_VM: "1"
        run: |
          set -euo pipefail
          cd webviews
          if [ "$ALL" = true ]; then
            bun scripts/gallery/manifest.ts --frame component --out "$RUNNER_TEMP/manifest.json"
          else
            bun scripts/gallery/manifest.ts --frame component --entries "$IDS" --out "$RUNNER_TEMP/manifest.json"
          fi
          CMUX_GALLERY_OUT_DIR="$RUNNER_TEMP/gallery" bun run gallery:build
          cd "$GITHUB_WORKSPACE/scripts/gallery-matrix"
          bun health.ts --manifest "$RUNNER_TEMP/manifest.json" --gallery-dir "$RUNNER_TEMP/gallery" \
            --output-dir "$RUNNER_TEMP/health" --shard-count 8 --shard-index "$SHARD"

      # The rulebook's base reds are warnings: each red state of a pull request is rendered again on
      # the base it merged with (the merge's first parent), by the same checker, budgets and
      # allowlist, and scripts/ci/test_reds.py (the one per-test classifier) compares them state by
      # state. A state red the same way on the base is a warning; any other red state, a crashed
      # render, a health.json that is missing or cut short, a base render that gives no whole
      # result, and any red on a push (it has no base to compare with) fail the check.
      # It replays only the red states, never their whole entries: replaying entries re-rendered
      # 1,308 cases for one shard's ~40 red states (manifest --entries also matches by prefix, so
      # agent-pane.composer pulled in every agent-pane.composer-* entry), ran past the job's
      # timeout and left a cancelled job with no verdict. Its own budget makes a slow replay fail
      # here, with the upload still to come, instead of cancelling the job.
      - name: Judge the red states against the base
        if: ${{ !cancelled() && steps.render.outcome == 'failure' }}
        timeout-minutes: 15
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ steps.resolve.outputs.base_sha }}
          # health.ts renders only on CI or a VM; without this it stops before it writes a verdict.
          CMUX_GALLERY_IN_VM: "1"
        run: |
          set -euo pipefail
          classify="$RUNNER_TEMP/test_reds.py"
          cp scripts/ci/test_reds.py "$classify"
          head="$RUNNER_TEMP/health/health.json"
          if [ "$EVENT" != pull_request ] || [ -z "$BASE_SHA" ]; then
            echo "::error::gallery health is red on this $EVENT, which has no base to compare with"
            exit 1
          fi
          rc=0
          entries=$(python3 "$classify" gallery --head "$head" --entries) || rc=$?
          if [ "$rc" = 2 ]; then
            echo "::error::the render step failed but health.json names no red state: a setup or tool failure, never a base red"
            exit 1
          fi
          [ "$rc" = 0 ] || exit 1
          states=$(python3 "$classify" gallery --head "$head" --states)
          echo "replaying on base $BASE_SHA: $states"
          # Everything but the checker goes back to the base, so only the webviews tree differs.
          git restore --source="$BASE_SHA" --staged --worktree -- . ':(exclude)scripts/gallery-matrix'
          cd webviews
          bun install --frozen-lockfile
          bun scripts/gallery/manifest.ts --frame component --entries "$entries" --out "$RUNNER_TEMP/base-entries.json"
          # Every case (theme, width) of each red state, and nothing else. A state the base does not have
          # renders nothing there, so the classifier calls it the head's own.
          jq --arg states "$states" '($states | split(",")) as $red
            | map(select(((.params.entry // "") + "#" + (.params.variant // "")) as $state | any($red[]; . == $state)))' \
            "$RUNNER_TEMP/base-entries.json" > "$RUNNER_TEMP/base-manifest.json"
          echo "base replay: $(jq length "$RUNNER_TEMP/base-manifest.json") of $(jq length "$RUNNER_TEMP/base-entries.json") cases of those entries"
          CMUX_GALLERY_OUT_DIR="$RUNNER_TEMP/base-gallery" bun run gallery:build
          cd "$GITHUB_WORKSPACE/scripts/gallery-matrix"
          # Red on the base is the point here: its exit says so, and its verdict is read from health.json
          # below. A replay that wrote no health.json gave no verdict, and says so here.
          # The head keeps a state red only when it is red on every retry; the base renders twice with
          # no retries and a state red in either render is the base's. Holding the base to every retry
          # too called states that flake on the base (layout shift) the pull request's own.
          bases=()
          for pass in 1 2; do
            rc=0
            bun health.ts --manifest "$RUNNER_TEMP/base-manifest.json" --gallery-dir "$RUNNER_TEMP/base-gallery" \
              --retries 0 --output-dir "$RUNNER_TEMP/health/base/$pass" || rc=$?
            if [ ! -s "$RUNNER_TEMP/health/base/$pass/health.json" ]; then
              echo "::error::the base replay of $entries wrote no health.json (health.ts exited $rc): no base verdict, so nothing is excused"
              exit 1
            fi
            bases+=(--base "$RUNNER_TEMP/health/base/$pass/health.json")
          done
          rc=0
          python3 "$classify" gallery --head "$head" "${bases[@]}" \
            --base-name "base ${BASE_SHA:0:12}" --annotate | tee "$RUNNER_TEMP/verdict.txt" || rc=$?
          grep -v '^::' "$RUNNER_TEMP/verdict.txt" >> "$GITHUB_STEP_SUMMARY" || true
          exit "$rc"

      - name: Record what was rendered
        if: ${{ always() && steps.resolve.outcome == 'success' }}
        env:
          HEAD_SHA: ${{ steps.resolve.outputs.head_sha }}
          MERGE_SHA: ${{ steps.resolve.outputs.merge_sha }}
          BASE_SHA: ${{ steps.resolve.outputs.base_sha }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/health"
          # The head the pull request shows, beside the merge commit actually rendered.
          jq -n --arg head "$HEAD_SHA" --arg merge "$MERGE_SHA" --arg base "$BASE_SHA" \
            '{head_sha: $head, rendered_sha: $merge, base_sha: $base}' > "$RUNNER_TEMP/health/source.json"

      - name: Upload the health run
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gallery-health-${{ matrix.shard }}
          path: ${{ runner.temp }}/health
          if-no-files-found: ignore
          retention-days: 7
