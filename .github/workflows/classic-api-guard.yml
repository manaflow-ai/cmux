name: classic API guard

# Classic cmux.com and its API deploy on their own (Vercel) when a commit lands on main. A pull request into main that changes one of the guarded paths in
# scripts/ci/classic-auto-deploy.json fails until its description has a line
# `Classic API change: <reason>`; into feat-cmux-next it is a warning only, since that branch
# deploys nothing classic. scripts/ci/classic_api_guard.py decides, run from the base commit,
# never the pull request's code; the head is read only as a list of changed paths. Editing the
# description re-runs it. New NEXT Cloud backend code goes to manaflow-ai/cmux-platform.
# Leo, 2026-11-04: "apparently the api if we change it it'll auto deploy so we wanna make extra
# sure we dont change it for clasisc".
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
    # Generated by scripts/ci/pr_trigger_paths.py from scripts/ci/classic-auto-deploy.json (guarded deploys); run its `write` after editing that.
    paths:
      - ".github/workflows/classic-api-guard.yml"
      - "config/iroh/managed-relay-catalog.json"
      - "scripts/ci/classic-auto-deploy.json"
      - "scripts/ci/classic_api_guard.py"
      - "web/app/api/**"
      - "web/app/authorize/**"
      - "web/app/env.ts"
      - "web/app/handler/**"
      - "web/app/lib/**"
      - "web/app/v1/**"
      - "web/app/vm/**"
      - "web/bun.lock"
      - "web/data/agent-models.ts"
      - "web/data/mobile-mac-compat.ts"
      - "web/data/model-catalog/**"
      - "web/db/**"
      - "web/instrumentation.ts"
      - "web/next.config.ts"
      - "web/openapi/**"
      - "web/orpc/**"
      - "web/package.json"
      - "web/patches/**"
      - "web/proxy.ts"
      - "web/security-headers.ts"
      - "web/services/**"
      - "web/vercel.json"
      - "workers/presence/src/generated/managedRelayCatalog.ts"
      - "!**/*.md"
      - "!**/*.test.mjs"
      - "!**/*.test.ts"
  # A feat-cmux-next pull request starts this only through pr-router.yml (one router per push, RFD 0023):
  # the router lists the changed files once and calls it when a change reaches a path classic
  # auto-deploys (scripts/ci/pr_router.json `affects`), or on an edit of the `Classic API change:` line
  # or the base. A change that touches none of them (19 in 20 merges) starts no runner here.
  workflow_call:

permissions: {}

# The description only matters through its `Classic API change:` line. An edit with no such line
# before or after it (a title, a HOLD line) cannot change the verdict: it takes no runner and its
# own group, so it never cancels a push's run (pattern pr-edit-fans-out-ci in cmuxterm-hq
# docs/handbook: 130 HOLD-line edits on 2026-11-17 queued this workflow 39 times). A base change
# re-runs it: the diff it judges moved.
concurrency:
  group: classic-api-guard-${{ github.event.pull_request.number }}${{ github.event.action == 'edited' && !github.event.changes.base && !(github.event.changes.body && (contains(github.event.pull_request.body, 'Classic API change:') || contains(github.event.changes.body.from, 'Classic API change:'))) && format('-edit-{0}', github.run_id) || '' }}
  cancel-in-progress: true

env:
  # Temporary REST budget attribution: one gh-call line per GitHub API call (scripts/ci/api_call_log/env.sh, fetched at a fixed commit when the checkout has no copy).
  BASH_ENV: '$({ w="${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh"; t="${RUNNER_TEMP:-/nonexistent}/api-call-log-src"; if [ -f "$w" ]; then echo "$w"; elif [ -n "${RUNNER_TEMP:-}" ]; then if [ ! -f "$t/env.sh" ] && [ ! -e "$t.tried" ] && { [ "${RUNNER_OS:-}" = Linux ] || [ "${RUNNER_OS:-}" = macOS ]; } && [ "$(date -u +%Y%m%d%H)" -lt 2026112300 ]; then : > "$t.tried"; mkdir -p "$t.part" && for x in env.sh gh sitecustomize.py isolated.py; do curl -fsSL --max-time 5 -o "$t.part/$x" "https://raw.githubusercontent.com/manaflow-ai/cmux/27647ffd3ae838c63be28ca3e5883dcd68c34518/scripts/ci/api_call_log/$x" || break; done; [ -s "$t.part/isolated.py" ] && mv "$t.part" "$t"; fi; if [ -f "$t/env.sh" ]; then echo "$t/env.sh"; else echo unset BASH_ENV > "$t.off.sh" && echo "$t.off.sh"; fi; fi; } 2>/dev/null)'

jobs:
  classic-api:
    # A skipped run would read as a pass and replace a failing one, so the edit that skips it
    # publishes another name.
    name: ${{ github.event.action == 'edited' && !github.event.changes.base && !(github.event.changes.body && (contains(github.event.pull_request.body, 'Classic API change:') || contains(github.event.changes.body.from, 'Classic API change:'))) && 'classic-api-guard metadata edit (ignored)' || 'classic-api-guard' }}
    if: ${{ !(github.event.action == 'edited' && !github.event.changes.base && !(github.event.changes.body && (contains(github.event.pull_request.body, 'Classic API change:') || contains(github.event.changes.body.from, 'Classic API change:')))) }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && (vars.CI_FORK_LINUX_RUNNER || 'ubuntu-24.04') || 'cmux-linux' }}
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out the guard from the base commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            scripts/ci/classic_api_guard.py
            scripts/ci/classic-auto-deploy.json
            .gitmodules
          sparse-checkout-cone-mode: false

      - name: Check the changed paths against classic's auto-deploys
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.ref }}
          BODY: ${{ github.event.pull_request.body }}
          CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ ! -f scripts/ci/classic_api_guard.py ]; then
            # The pull request that adds the guard: its base has no guard to run yet.
            echo "::notice::The base has no scripts/ci/classic_api_guard.py yet; nothing to check."
            exit 0
          fi
          printf '%s' "$BODY" > "$RUNNER_TEMP/body.md"
          # One record per changed file; a rename's old path also counts as changed, but not as a record.
          # From the PR's merge commit, not the files API: this runs on most pull request events (about 180 runs an
          # hour on 2026-11-21), and each REST listing spent the repository's GITHUB_TOKEN hour that every workflow
          # shares (the production promote gates 403'd on it, backend.yml run 44878749398). Its first parent is the
          # base, so the diff is what the PR changes. --no-renames lists a rename as its old and new path, each its
          # own record (never fewer records than files). Trees only, no blobs.
          # The token goes through the environment, not git's argv.
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraheader
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          export GIT_CONFIG_VALUE_0
          # The merge ref can lag a push: use it only when its second parent is this event's head.
          # Its first may be any base commit: the event's base.sha is the base when the PR was last
          # synced, often many merges behind on a busy base, so requiring it left the git listing
          # unusable (language-boundaries.yml's, cmux#41500 at d059d7bd, 2026-11-11). The diff from
          # whichever base GitHub merged with is still what the PR changes there.
          if git fetch --no-tags --filter=blob:none --depth=2 \
               origin "+refs/pull/$PR/merge:refs/guard/merge" \
             && git rev-parse --verify --quiet refs/guard/merge^1 > /dev/null \
             && [ "$(git rev-parse refs/guard/merge^2)" = "$HEAD_SHA" ] \
             && git diff --name-only --no-renames refs/guard/merge^1 refs/guard/merge > "$RUNNER_TEMP/files.tsv"; then
            :
          else
            # No merge commit of this head yet (a conflict, or GitHub still making it): one REST listing.
            echo "::notice::No merge commit of this head yet; listing the changed paths over the API."
            if gh api --paginate "repos/$REPOSITORY/pulls/$PR/files?per_page=100" \
                 --jq '.[] | [.filename, (.previous_filename // "")] | @tsv' > "$RUNNER_TEMP/files.tsv"; then
              :
            elif [ "$BASE" != "main" ]; then
              # Into feat-cmux-next the guard only warns, so a missing listing warns too.
              echo "::warning::Could not list the changed paths (no current merge ref, and the files API failed); this check only warns into $BASE."
              exit 0
            else
              echo "::error::Could not list the changed paths; re-run this check."
              exit 1
            fi
          fi
          records=$(wc -l < "$RUNNER_TEMP/files.tsv" | tr -d ' ')
          tr '\t' '\n' < "$RUNNER_TEMP/files.tsv" | sed '/^$/d' > "$RUNNER_TEMP/paths.txt"
          # The guard comes from the base: a base older than --listed-records gets the old count.
          listed=()
          if grep -q -- '--listed-records' scripts/ci/classic_api_guard.py; then
            listed=(--listed-records "$records")
          fi
          python3 scripts/ci/classic_api_guard.py --base "$BASE" \
            --body-file "$RUNNER_TEMP/body.md" --paths-file "$RUNNER_TEMP/paths.txt" \
            --expected-files "$CHANGED_FILES" "${listed[@]}"
