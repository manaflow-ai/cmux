name: classic API guard

# Classic cmux.com and its API deploy on their own (Vercel) when a commit lands on main. A pull request into main that changes one of the guarded paths in
# scripts/ci/classic-auto-deploy.json fails until its description has a line
# `Classic API change: <reason>`; into feat-cmux-next it is a warning only, since that branch
# deploys nothing classic. scripts/ci/classic_api_guard.py decides, run from the base commit,
# never the pull request's code; the head is read only as a list of changed paths. Editing the
# description re-runs it. New NEXT Cloud backend code goes to manaflow-ai/cmux-platform.
# Leo, 2026-11-04: "apparently the api if we change it it'll auto deploy so we wanna make extra
# sure we dont change it for clasisc".
on:
  pull_request:
    branches: [main, feat-cmux-next]
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions: {}

concurrency:
  group: classic-api-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  classic-api:
    name: classic-api-guard
    # Every edit re-runs it (a skipped run would read as a pass and replace a failing one).
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-4vcpu-ubuntu-2404' || fromJSON(vars.RUNNER_POOLS).linux }}
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out the guard from the base commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            scripts/ci/classic_api_guard.py
            scripts/ci/classic-auto-deploy.json
          sparse-checkout-cone-mode: false

      - name: Check the changed paths against classic's auto-deploys
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.ref }}
          BODY: ${{ github.event.pull_request.body }}
          CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
          MERGE_SHA: ${{ github.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ ! -f scripts/ci/classic_api_guard.py ]; then
            # The pull request that adds the guard: its base has no guard to run yet.
            echo "::notice::The base has no scripts/ci/classic_api_guard.py yet; nothing to check."
            exit 0
          fi
          printf '%s' "$BODY" > "$RUNNER_TEMP/body.md"
          # The changed paths come from the event's merge commit without blobs, as
          # pr-design-spec-check.yml reads them: no API call, so a spent REST quota cannot fail the
          # guard. --no-renames lists a rename as its old and its new path. Nothing from the head is
          # checked out or run; git only lists paths. git's list has no length cap, so the
          # --expected-files cross-check (GitHub's file listing stops at 3,000 entries) is passed only
          # on the REST fallback, the one listing that can be cut short.
          expected=()
          if git fetch --no-tags --quiet --depth=2 --filter=blob:none origin "$MERGE_SHA" \
            && [ "$(git rev-parse "$MERGE_SHA^2")" = "$HEAD_SHA" ] \
            && git diff --name-only -z --no-renames "$MERGE_SHA^1" "$MERGE_SHA" | tr '\0' '\n' > "$RUNNER_TEMP/paths.txt"; then
            echo "changed paths: $(wc -l < "$RUNNER_TEMP/paths.txt" | tr -d ' ') from the merge commit (git)"
          else
            echo "::notice title=classic API guard::git could not list the changed paths; reading them over the API"
            # A rename counts as both its old and its new path.
            gh api --paginate "repos/$REPOSITORY/pulls/$PR/files?per_page=100" \
              --jq '.[] | .filename, (.previous_filename // empty)' > "$RUNNER_TEMP/paths.txt"
            expected=(--expected-files "$CHANGED_FILES")
          fi
          python3 scripts/ci/classic_api_guard.py --base "$BASE" \
            --body-file "$RUNNER_TEMP/body.md" --paths-file "$RUNNER_TEMP/paths.txt" \
            "${expected[@]}"
