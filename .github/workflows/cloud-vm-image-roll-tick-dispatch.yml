name: Cloud VM image roll tick dispatcher

# The Cloud lock (images/cmux-vm/inputs.lock.json on feat-cmux-next) moved only when a roll that a build's dispatch
# or an image push started also passed. 2026-11-28: 11 of 19 rolls failed and nothing retried them until the next
# trigger, and no roll was requested 09:21Z-17:36Z, so the lock pinned c6cd14b5 for 9.5 h (11.2 h behind at the
# next promotion; NOW's cloud-lock bound is 120 min). Scheduled workflows run only from the default branch, hence
# this file on main. Every 20 minutes it starts one "newest" roll of feat-cmux-next's cloud-vm-image-roll.yml
# (input newest): its plan picks the build the Cloud machine channel serves, else the newest published on the tip,
# and rolls nothing when that is pinned (one plan job of about a minute). A roll already queued is left alone (a
# newer request would replace it); a running one gets this tick waiting behind it. The roll's gate is unchanged.
on:
  schedule:
    - cron: "11,31,51 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: cloud-vm-image-roll-tick-dispatch
  cancel-in-progress: false

env:
  # Temporary REST budget attribution: one gh-call line per GitHub API call (scripts/ci/api_call_log/env.sh, fetched at a fixed commit when the checkout has no copy).
  BASH_ENV: '$({ w="${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh"; t="${RUNNER_TEMP:-/nonexistent}/api-call-log-src"; if [ -f "$w" ]; then echo "$w"; elif [ -n "${RUNNER_TEMP:-}" ]; then if [ ! -f "$t/env.sh" ] && [ ! -e "$t.tried" ] && { [ "${RUNNER_OS:-}" = Linux ] || [ "${RUNNER_OS:-}" = macOS ]; } && [ "$(date -u +%Y%m%d%H)" -lt 2026112300 ]; then : > "$t.tried"; mkdir -p "$t.part" && for x in env.sh gh sitecustomize.py isolated.py; do curl -fsSL --max-time 5 -o "$t.part/$x" "https://raw.githubusercontent.com/manaflow-ai/cmux/27647ffd3ae838c63be28ca3e5883dcd68c34518/scripts/ci/api_call_log/$x" || break; done; [ -s "$t.part/isolated.py" ] && mv "$t.part" "$t"; fi; if [ -f "$t/env.sh" ]; then echo "$t/env.sh"; else echo unset BASH_ENV > "$t.off.sh" && echo "$t.off.sh"; fi; fi; } 2>/dev/null)'

jobs:
  dispatch:
    if: github.repository == 'manaflow-ai/cmux'
    # It holds the cmux-bot App key, so no variable may move it (tests/test_ci_fork_runner_routing.py), and it
    # takes an owned one-job JIT VM, the nightly/cron label (tests/test_ci_secret_jobs_secret_jit.py).
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || 'cmux-gcp-nightly-jit-x64' }}
    permissions:
      actions: write
      contents: read
    timeout-minutes: 20
    env:
      # A scheduled job's GitHub API waits stop here and fail loud (scripts/ci/gh_budget_wait.sh).
      GH_BUDGET_WAIT_MAX_SECONDS: "900"
    steps:
      # This commit's GitHub API wait (scripts/ci/gh_budget_wait.sh): every later gh call, and
      # each github-script step that installs gh_budget_wait.cjs, waits through a rate limit or a
      # GitHub 5xx under the job's GH_BUDGET_WAIT_MAX_SECONDS, then fails loud.
      - name: Checkout the GitHub API wait
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: .gh-budget-tooling
          sparse-checkout: |
            scripts/ci/gh_budget_wait.sh
            scripts/ci/gh_budget_wait.cjs
            scripts/ci/app_spend_mark.py
          sparse-checkout-cone-mode: false
      - name: Wait through GitHub API rate limits and 5xx in this job
        working-directory: ${{ github.workspace }}
        run: bash .gh-budget-tooling/scripts/ci/gh_budget_wait.sh --install

      # Two hourly REST budgets instead of one: the cmux-bot installation's, then github.token's for reads
      # (gh_budget_wait.cjs `spare`). github.token's budget is shared with every workflow in the repo; a
      # dispatcher on it alone went red for a day when it was spent (cmux#61103, the same class).
      - name: Mint the cmux-bot token
        id: cmux-bot-token
        if: vars.CMUX_BOT_APP_ID != ''
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.CMUX_BOT_APP_ID }}
          private-key: ${{ secrets.CMUX_BOT_APP_KEY }}
          permission-actions: write
          permission-contents: read

      # Under the cmux-bot floor this tick spends github.token only (scripts/ci/app_spend_mark.py).
      - name: Read the cmux-bot budget before the tick
        id: app-spend
        continue-on-error: true
        timeout-minutes: 1
        env:
          APP_SPEND_TOKEN: ${{ steps.cmux-bot-token.outputs.token }}
        run: python3 .gh-budget-tooling/scripts/ci/app_spend_mark.py start cloud-vm-image-roll-tick-dispatch/dispatch --floor pass

      - name: Start one newest image roll on feat-cmux-next unless one is queued
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SPARE_READ_TOKEN: ${{ steps.app-spend.outputs.low != 'true' && steps.cmux-bot-token.outputs.token && github.token || '' }}
        with:
          github-token: ${{ steps.app-spend.outputs.low != 'true' && steps.cmux-bot-token.outputs.token || github.token }}
          script: |
            if (process.env.GH_BUDGET_WAIT_JS) require(process.env.GH_BUDGET_WAIT_JS).install({ github, core, spare: process.env.SPARE_READ_TOKEN ? getOctokit(process.env.SPARE_READ_TOKEN) : undefined });
            const { owner, repo } = context.repo;
            const source = 'feat-cmux-next';
            const workflow = 'cloud-vm-image-roll.yml';
            // Only a queued roll: a build's own request waiting there carries its commit, and a dispatch now would
            // replace it (one pending per group). A running roll gets this tick queued behind it.
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner, repo, workflow_id: workflow, branch: source, status: 'queued', per_page: 5,
            });
            if (data.total_count > 0) {
              core.notice(`An image roll is already queued (run ${data.workflow_runs[0].id}); nothing to start`);
              return;
            }
            await github.rest.actions.createWorkflowDispatch({
              owner, repo, workflow_id: workflow,
              // Fully qualified: a tag named feat-cmux-next must never be picked.
              ref: `refs/heads/${source}`,
              inputs: { newest: 'true' },
            });
            core.notice(`Started a newest image roll on ${source}`);

      - name: Read the cmux-bot budget after the tick
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        env:
          APP_SPEND_TOKEN: ${{ steps.cmux-bot-token.outputs.token }}
        run: python3 .gh-budget-tooling/scripts/ci/app_spend_mark.py end cloud-vm-image-roll-tick-dispatch/dispatch
