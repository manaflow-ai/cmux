name: gallery visual evidence (advisory)

# This is a small, best-effort visual receipt for webview changes. The existing
# `gallery PR diff` workflow remains the full matrix and publisher; this lane
# samples the first few touched states so a reviewer gets before/after PNGs
# quickly. It is deliberately separate and non-blocking: do not add this check
# to branch protection, and keep the job-level continue-on-error guard.
on:
  pull_request:
    branches: [feat-cmux-next]
    types: [opened, synchronize, reopened]
    paths:
      - "webviews/**"
      - "scripts/gallery-matrix/**"
      - "scripts/cmux-next/build-agent-pane-web.sh"
      - "bun.lock"
      - ".github/workflows/gallery-advisory.yml"

permissions:
  contents: read

concurrency:
  group: gallery-advisory-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  capture:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    # A visual receipt must never hold up a functional PR. The final artifact
    # step still runs when a browser or gallery build is unavailable.
    continue-on-error: true
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-4vcpu-ubuntu-2404' || vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 20
    steps:
      - name: Initialize evidence directory
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gallery-advisory"
          cat > "$RUNNER_TEMP/gallery-advisory/README.md" <<'EOF'
          This is an advisory visual receipt. A missing or failed capture never blocks a merge.
          The full gallery PR matrix remains the authoritative visual check.
          EOF

      # Full history for the merge base, but blobless: a full clone spent about
      # 188 s of this job's 4.7 min (six runs, 2026-10-19). Git fetches the
      # head's and the base worktree's files on checkout.
      - name: Checkout the PR head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.11.1"

      - name: Capture a bounded before/after receipt
        continue-on-error: true
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CMUX_GALLERY_IN_VM: "1"
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/gallery-advisory"
          base_sha=$(git merge-base "origin/$BASE_REF" HEAD)
          git diff --name-only "$base_sha" HEAD > "$RUNNER_TEMP/changed.txt"

          cd webviews
          bun install --frozen-lockfile
          bun scripts/gallery/touched.ts --changed "$RUNNER_TEMP/changed.txt" --out "$RUNNER_TEMP/touched.json"
          ids=$(jq -r '.entries | join(",")' "$RUNNER_TEMP/touched.json")
          count=$(jq '.entries | length' "$RUNNER_TEMP/touched.json")
          cp "$RUNNER_TEMP/touched.json" "$evidence/touched.json"
          if [ "$count" = 0 ]; then
            echo "No gallery entries were touched; no visual receipt was needed." | tee "$evidence/summary.txt"
            exit 0
          fi

          # Pair the default dark/light themes at one compact width. The cap is
          # intentional: the full gallery workflow owns exhaustive coverage. The
          # manifests list every touched state; the sample below picks 16.
          bun scripts/gallery/manifest.ts --entries "$ids" --themes pair --widths narrow \
            --frame component --out "$RUNNER_TEMP/head-all.json"
          CMUX_GALLERY_OUT_DIR="$RUNNER_TEMP/gallery-head" bun run gallery:build

          git worktree add --detach "$RUNNER_TEMP/base" "$base_sha"
          if [ -f "$RUNNER_TEMP/base/webviews/vite.config.gallery.ts" ] && [ -f "$RUNNER_TEMP/base/webviews/scripts/gallery/manifest.ts" ]; then
            cd "$RUNNER_TEMP/base/webviews"
            bun install --frozen-lockfile
            bun scripts/gallery/manifest.ts --entries "$ids" --themes pair --widths narrow \
              --frame component --out "$RUNNER_TEMP/base-all.json"
            CMUX_GALLERY_OUT_DIR="$RUNNER_TEMP/gallery-base" bun run gallery:build
          else
            echo '[]' > "$RUNNER_TEMP/base-all.json"
          fi

          # The sample: the states this PR adds first (no base case has their id),
          # then the rest in order, 16 at most. A PR that touches a shared file
          # touches every entry, and the first 16 in order are then unrelated to
          # it. The base keeps the sampled states, then the ones this PR removes.
          jq -s '(.[1] | map({key: .id, value: true}) | from_entries) as $base
            | ([.[0][] | select($base[.id] | not)] + [.[0][] | select($base[.id])]) | .[0:16]' \
            "$RUNNER_TEMP/head-all.json" "$RUNNER_TEMP/base-all.json" > "$RUNNER_TEMP/head.json"
          jq -s '(.[0] | map({key: .id, value: true}) | from_entries) as $head
            | (.[2] | map({key: .id, value: true}) | from_entries) as $all
            | ([.[1][] | select($head[.id])] + [.[1][] | select($all[.id] | not)]) | .[0:16]' \
            "$RUNNER_TEMP/head.json" "$RUNNER_TEMP/base-all.json" "$RUNNER_TEMP/head-all.json" > "$RUNNER_TEMP/base.json"

          cd "$GITHUB_WORKSPACE/scripts/gallery-matrix"
          bun install --frozen-lockfile
          ./node_modules/.bin/playwright install --with-deps --only-shell chromium
          # Each stage renders its own states: a state the PR adds has no base
          # variant to render (the base reports it not ready), and one it removes
          # has no head variant.
          for stage in base head; do
            gallery="$RUNNER_TEMP/gallery-$stage"
            out="$evidence/$stage"
            mkdir -p "$out"
            if [ "$(jq length "$RUNNER_TEMP/$stage.json")" = 0 ]; then
              # Every sampled state is new: nothing to render before.
              echo '[]' > "$out/results.json"
              continue
            fi
            if [ -d "$gallery" ]; then
              bun runner.ts --manifest "$RUNNER_TEMP/$stage.json" --gallery-dir "$gallery" \
                --output-dir "$out" --engines chromium --shard-count 1 --shard-index 0
            else
              echo "Missing $stage gallery build; advisory capture failed." >&2
              exit 1
            fi
            test -f "$out/results.json"
            expected_sha="$HEAD_SHA"
            if [ "$stage" = base ]; then expected_sha="$base_sha"; fi
            jq -e --arg sha "$expected_sha" \
              'length > 0 and all(.[]; .revision.sha == $sha and (.revision.source | type == "string"))' \
              "$out/results.json" >/dev/null || {
                echo "Gallery provenance mismatch in $stage: expected $expected_sha" >&2
                jq '[.[] | {id, engine, revision}]' "$out/results.json" >&2
                exit 1
              }
          done

          mkdir -p "$evidence/diff"
          bun pr.ts --base "$evidence/base" --head "$evidence/head" \
            --base-manifest "$RUNNER_TEMP/base.json" --head-manifest "$RUNNER_TEMP/head.json" \
            --out "$evidence/diff" --pr "$PR" --head-sha "$HEAD_SHA" --base-sha "$base_sha" \
            --artifact-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}#artifacts"
          jq -r '.[] | [.status, .entry, .variant, .theme, .engine] | @tsv' \
            "$evidence/diff/outcomes.json" > "$evidence/summary.tsv"
          {
            echo "Captured advisory receipt for $HEAD_SHA (base $base_sha)."
            echo "Sample: up to 16 states, new ones first, dark/light themes, narrow component width, Chromium."
            echo "The receipt is informational and never a merge gate."
          } | tee "$evidence/summary.txt" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload advisory visual receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gallery-advisory-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/gallery-advisory
          if-no-files-found: warn
          retention-days: 30
