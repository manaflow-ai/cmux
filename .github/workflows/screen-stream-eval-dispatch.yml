name: screen stream eval dispatcher

# The screen stream eval (HQ#7146 G0; feat-cmux-next's scripts/measure/screen-stream-eval/README.md)
# measures cmux.rd/1 and WebRTC on a fleet Mac through feat-cmux-next's screen-stream-eval.yml. That
# workflow's own daily cron never fires: scheduled workflows run only from the default branch, and it
# lives only on feat-cmux-next. Once a day this file on main starts it on feat-cmux-next, unless a run
# is already pending. The run reports only (results.json and a summary with each number's change
# against the previous daily run); nothing reads its result and it never fails a check. GitHub only
# dispatches a workflow name the default branch registers: screen-stream-eval.yml here is that (inert).
# Two runs a day, each skipped while a run with its title is pending: the default targets (rd,webrtc)
# on the eval's worker, and the iPhone viewer (targets=iphone-sim, cmuxterm-hq goals/ss-ios-viewer.md)
# pinned to vars.SCREEN_STREAM_EVAL_IPHONE_WORKER (a Mac with an iOS simulator runtime and the eval
# launcher's Screen Recording and Accessibility grants), else to the eval's own worker variable.
# HQ's fleet-reconciler-screen-share-fast.yml pulls the iphone-sim run for NOW's
# screen_share_fast.iphone_present_p95_ms. One run's failed dispatch (GitHub answered 500 on
# 2026-11-25 and 11-26, so no eval ran those days) never skips the other; the job fails after both tries.
on:
  schedule:
    - cron: "41 10 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: screen-stream-eval-dispatch
  cancel-in-progress: false

env:
  # Temporary REST budget attribution: one gh-call line per GitHub API call (scripts/ci/api_call_log/env.sh, fetched at a fixed commit when the checkout has no copy).
  BASH_ENV: '$({ w="${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh"; t="${RUNNER_TEMP:-/nonexistent}/api-call-log-src"; if [ -f "$w" ]; then echo "$w"; elif [ -n "${RUNNER_TEMP:-}" ]; then if [ ! -f "$t/env.sh" ] && [ ! -e "$t.tried" ] && { [ "${RUNNER_OS:-}" = Linux ] || [ "${RUNNER_OS:-}" = macOS ]; } && [ "$(date -u +%Y%m%d%H)" -lt 2026112300 ]; then : > "$t.tried"; mkdir -p "$t.part" && for x in env.sh gh sitecustomize.py isolated.py; do curl -fsSL --max-time 5 -o "$t.part/$x" "https://raw.githubusercontent.com/manaflow-ai/cmux/27647ffd3ae838c63be28ca3e5883dcd68c34518/scripts/ci/api_call_log/$x" || break; done; [ -s "$t.part/isolated.py" ] && mv "$t.part" "$t"; fi; if [ -f "$t/env.sh" ]; then echo "$t/env.sh"; else echo unset BASH_ENV > "$t.off.sh" && echo "$t.off.sh"; fi; fi; } 2>/dev/null)'

jobs:
  dispatch:
    if: github.repository == 'manaflow-ai/cmux'
    # It holds the cmux-bot App key, so no variable may move it (tests/test_ci_fork_runner_routing.py).
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || 'cmux-gcp-secret-jit-x64' }}
    permissions:
      actions: write
      contents: read
    timeout-minutes: 20
    env:
      # A scheduled job's GitHub API waits stop here and fail loud (scripts/ci/gh_budget_wait.sh).
      GH_BUDGET_WAIT_MAX_SECONDS: "900"
    steps:
      # This commit's GitHub API wait (scripts/ci/gh_budget_wait.sh): every later gh call, and
      # each github-script step that installs gh_budget_wait.cjs, waits through a rate limit or a
      # GitHub 5xx under the job's GH_BUDGET_WAIT_MAX_SECONDS, then fails loud.
      - name: Checkout the GitHub API wait
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: .gh-budget-tooling
          sparse-checkout: |
            scripts/ci/gh_budget_wait.sh
            scripts/ci/gh_budget_wait.cjs
          sparse-checkout-cone-mode: false
      - name: Wait through GitHub API rate limits and 5xx in this job
        working-directory: ${{ github.workspace }}
        run: bash .gh-budget-tooling/scripts/ci/gh_budget_wait.sh --install

      # Two hourly REST budgets instead of one: the cmux-bot installation's, then github.token's for reads
      # (gh_budget_wait.cjs `spare`). github.token's budget is shared with every workflow in the repo, and a
      # rate-limited read on it alone turned main red for a day (runs 45791594489, 45809391120, 45804008279,
      # 45831824446, 45944569896: "the budget resets in ...s, past this job's 900s left to wait").
      - name: Mint the cmux-bot token
        id: cmux-bot-token
        if: vars.CMUX_BOT_APP_ID != ''
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.CMUX_BOT_APP_ID }}
          private-key: ${{ secrets.CMUX_BOT_APP_KEY }}
          permission-actions: write
          permission-contents: read

      - name: Start the screen stream evals on feat-cmux-next unless one is pending
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          IPHONE_WORKER: ${{ vars.SCREEN_STREAM_EVAL_IPHONE_WORKER || '' }}
          SPARE_READ_TOKEN: ${{ steps.cmux-bot-token.outputs.token && github.token || '' }}
        with:
          github-token: ${{ steps.cmux-bot-token.outputs.token || github.token }}
          script: |
            if (process.env.GH_BUDGET_WAIT_JS) require(process.env.GH_BUDGET_WAIT_JS).install({ github, core, spare: process.env.SPARE_READ_TOKEN ? getOctokit(process.env.SPARE_READ_TOKEN) : undefined });
            const { owner, repo } = context.repo;
            const source = 'feat-cmux-next';
            const workflow = 'screen-stream-eval.yml';
            // Each run's title is the eval's run-name: the plain name for rd,webrtc, else the targets
            // in parentheses. Its baseline is the last daily run with the same title.
            const runs = [
              { title: 'screen stream eval', inputs: { targets: 'rd,webrtc' } },
              { title: 'screen stream eval (iphone-sim)', inputs: { targets: 'iphone-sim', worker: process.env.IPHONE_WORKER || '' } },
            ];
            const pending = new Map();
            for (const status of ['queued', 'in_progress', 'waiting', 'pending', 'requested']) {
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner, repo, workflow_id: workflow, branch: source, status, per_page: 20,
              });
              for (const run of data.workflow_runs) {
                if (!pending.has(run.display_title)) pending.set(run.display_title, `${status} (run ${run.id})`);
              }
            }
            const failed = [];
            for (const { title, inputs } of runs) {
              if (pending.has(title)) {
                core.notice(`${title}: a run is already ${pending.get(title)}; nothing to start`);
                continue;
              }
              try {
                await github.rest.actions.createWorkflowDispatch({
                  owner, repo, workflow_id: workflow,
                  // Fully qualified: a tag named feat-cmux-next must never be picked.
                  ref: `refs/heads/${source}`,
                  inputs,
                });
                core.notice(`Started ${title} on ${source}`);
              } catch (error) {
                core.error(`${title}: dispatch failed: ${error.message}`);
                failed.push(title);
              }
            }
            if (failed.length) core.setFailed(`dispatch failed for: ${failed.join(', ')}`);
