name: screen stream eval dispatcher

# The screen stream eval (HQ#7146 G0; feat-cmux-next's scripts/measure/screen-stream-eval/README.md)
# measures cmux.rd/1 and WebRTC on a fleet Mac through feat-cmux-next's screen-stream-eval.yml. That
# workflow's own daily cron never fires: scheduled workflows run only from the default branch, and it
# lives only on feat-cmux-next. Once a day this file on main starts it on feat-cmux-next, unless a run
# is already pending. The run reports only (results.json and a summary with each number's change
# against the previous daily run); nothing reads its result and it never fails a check. GitHub only
# dispatches a workflow name the default branch registers: screen-stream-eval.yml here is that (inert).
on:
  schedule:
    - cron: "41 10 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: screen-stream-eval-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    if: github.repository == 'manaflow-ai/cmux'
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    permissions:
      actions: write
      contents: read
    timeout-minutes: 5
    steps:
      - name: Start the screen stream eval on feat-cmux-next unless one is pending
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const source = 'feat-cmux-next';
            const workflow = 'screen-stream-eval.yml';
            for (const status of ['queued', 'in_progress', 'waiting', 'pending', 'requested']) {
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner, repo, workflow_id: workflow, branch: source, status, per_page: 5,
              });
              if (data.total_count > 0) {
                core.notice(`A screen stream eval run is already ${status} (run ${data.workflow_runs[0].id}); nothing to start`);
                return;
              }
            }
            // No inputs: the eval's defaults are the daily run. It finds its baseline as the last
            // successful run this dispatcher started (actor github-actions[bot]).
            await github.rest.actions.createWorkflowDispatch({
              owner, repo, workflow_id: workflow,
              // Fully qualified: a tag named feat-cmux-next must never be picked.
              ref: `refs/heads/${source}`,
            });
            core.notice(`Started the screen stream eval on ${source}`);
