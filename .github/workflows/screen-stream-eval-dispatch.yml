name: screen stream eval dispatcher

# The screen stream eval (HQ#7146 G0; feat-cmux-next's scripts/measure/screen-stream-eval/README.md)
# measures cmux.rd/1 and WebRTC on a fleet Mac through feat-cmux-next's screen-stream-eval.yml. That
# workflow's own daily cron never fires: scheduled workflows run only from the default branch, and it
# lives only on feat-cmux-next. Once a day this file on main starts two runs of it on feat-cmux-next,
# each unless a run of its own is already pending: the daily run (rd and webrtc, the eval's defaults),
# and the iPhone viewer's run (targets=iphone-sim) pinned to a Mac with an iOS simulator runtime. The
# iPhone run is its own run, so a slow simulator build never pushes the daily run past its step
# timeout and a Mac without the runtime never gets it (unpinned, its steps sat queued for days).
# cmuxterm-hq's fleet-reconciler-screen-share-fast.yml (pull-iphone) reads its results for NOW's
# screen_share_fast.iphone_present_p95_ms. The eval names each run by its targets (its run-name:
# "screen stream eval" for the defaults, "screen stream eval (iphone-sim)"), which is how a pending
# run is told apart here. The run reports only (results.json and a summary with each number's change
# against the previous daily run); nothing reads its result and it never fails a check. GitHub only
# dispatches a workflow name the default branch registers: screen-stream-eval.yml here is that (inert).
on:
  schedule:
    - cron: "41 10 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: screen-stream-eval-dispatch
  cancel-in-progress: false

env:
  # Temporary REST budget attribution: one gh-call line per GitHub API call (scripts/ci/api_call_log/env.sh, fetched at a fixed commit when the checkout has no copy).
  BASH_ENV: '$({ w="${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh"; t="${RUNNER_TEMP:-/nonexistent}/api-call-log-src"; if [ -f "$w" ]; then echo "$w"; elif [ -n "${RUNNER_TEMP:-}" ]; then if [ ! -f "$t/env.sh" ] && [ ! -e "$t.tried" ] && { [ "${RUNNER_OS:-}" = Linux ] || [ "${RUNNER_OS:-}" = macOS ]; } && [ "$(date -u +%Y%m%d%H)" -lt 2026112300 ]; then : > "$t.tried"; mkdir -p "$t.part" && for x in env.sh gh sitecustomize.py isolated.py; do curl -fsSL --max-time 5 -o "$t.part/$x" "https://raw.githubusercontent.com/manaflow-ai/cmux/27647ffd3ae838c63be28ca3e5883dcd68c34518/scripts/ci/api_call_log/$x" || break; done; [ -s "$t.part/isolated.py" ] && mv "$t.part" "$t"; fi; if [ -f "$t/env.sh" ]; then echo "$t/env.sh"; else echo unset BASH_ENV > "$t.off.sh" && echo "$t.off.sh"; fi; fi; } 2>/dev/null)'

jobs:
  dispatch:
    if: github.repository == 'manaflow-ai/cmux'
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.CI_OVERFLOW_LINUX || 'cmux-linux' }}
    permissions:
      actions: write
      contents: read
    timeout-minutes: 20
    env:
      # A scheduled job's GitHub API waits stop here and fail loud (scripts/ci/gh_budget_wait.sh).
      GH_BUDGET_WAIT_MAX_SECONDS: "900"
    steps:
      # This commit's GitHub API wait (scripts/ci/gh_budget_wait.sh): every later gh call, and
      # each github-script step that installs gh_budget_wait.cjs, waits through a rate limit or a
      # GitHub 5xx under the job's GH_BUDGET_WAIT_MAX_SECONDS, then fails loud.
      - name: Checkout the GitHub API wait
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: .gh-budget-tooling
          sparse-checkout: |
            scripts/ci/gh_budget_wait.sh
            scripts/ci/gh_budget_wait.cjs
          sparse-checkout-cone-mode: false
      - name: Wait through GitHub API rate limits and 5xx in this job
        working-directory: ${{ github.workspace }}
        run: bash .gh-budget-tooling/scripts/ci/gh_budget_wait.sh --install

      - name: Start the screen stream eval on feat-cmux-next unless one is pending
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          # A Mac with an iOS simulator runtime (screen-stream-eval/targets/iphone-sim.sh stops on one
          # without): its own variable, else the daily run's worker (that Mac has the runtime).
          IPHONE_WORKER: ${{ vars.SCREEN_STREAM_EVAL_IPHONE_WORKER || vars.SCREEN_STREAM_EVAL_WORKER || '' }}
        with:
          script: |
            if (process.env.GH_BUDGET_WAIT_JS) require(process.env.GH_BUDGET_WAIT_JS).install({ github, core });
            const { owner, repo } = context.repo;
            const source = 'feat-cmux-next';
            const workflow = 'screen-stream-eval.yml';
            // Fully qualified: a tag named feat-cmux-next must never be picked.
            const ref = `refs/heads/${source}`;
            const pending = [];
            for (const status of ['queued', 'in_progress', 'waiting', 'pending', 'requested']) {
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner, repo, workflow_id: workflow, branch: source, status, per_page: 20,
              });
              for (const run of data.workflow_runs) pending.push({ status, run });
            }
            // No inputs: the eval's defaults are the daily run. Each run finds its baseline as the last
            // run this dispatcher started (actor github-actions[bot]) with the same targets.
            const runs = [
              { title: 'screen stream eval', inputs: undefined },
              { title: 'screen stream eval (iphone-sim)',
                inputs: { targets: 'iphone-sim', worker: process.env.IPHONE_WORKER } },
            ];
            for (const { title, inputs } of runs) {
              if (inputs && !inputs.worker) {
                core.warning(`No worker for "${title}": set vars.SCREEN_STREAM_EVAL_IPHONE_WORKER to a Mac with an iOS simulator runtime; not starting it unpinned`);
                continue;
              }
              const open = pending.find(({ run }) => (run.display_title || run.name) === title);
              if (open) {
                core.notice(`A "${title}" run is already ${open.status} (run ${open.run.id}); not starting another`);
                continue;
              }
              await github.rest.actions.createWorkflowDispatch({ owner, repo, workflow_id: workflow, ref, inputs });
              core.notice(`Started "${title}" on ${source}${inputs ? ` (${JSON.stringify(inputs)})` : ''}`);
            }
