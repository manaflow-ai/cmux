# Builds cmux-mobile-ffi (plans/cmux-next/mobile-rust-core.md, slice 0) for
# both mobile platforms and runs the shared terminal sizing fixtures
# (schemas/terminal-sizing/fixtures.json) in Rust, in Swift against the
# generated bindings and the xcframework, and in Kotlin against the generated
# bindings and the host-built library.
#
# - rust: fmt, clippy -D warnings and the Rust tests of the three crates and
#   cmux-cloud-wire (the catalog wire types: generated-file drift and the
#   backend/catalog/cloud-vectors.json round trip).
# - apple: static libraries for iOS arm64, the iOS simulator (arm64, x86_64)
#   and macOS (arm64, x86_64) in CmuxMobileFFI.xcframework; `swift test` on the
#   macOS slice and `xcodebuild test` on an iOS simulator.
# - android: cargo-ndk .so files for arm64-v8a and x86_64, the Kotlin
#   bindings, the AAR, and JUnit tests on the runner's JVM (JNA loads the
#   host-built libcmux_mobile_ffi.so; no emulator runs here).
#
# - publish (feat-cmux-next pushes and dispatches of the branch tip only): the
#   apple job's xcframework, its generated CmuxMobileFFI.swift, SHA256SUMS and
#   SOURCE_SHA as the prerelease cmux-mobile-ffi-<source sha> (never latest,
#   never overwritten), the way app-ffi-release.yml publishes CCmuxAppFFI.
# - repin: pins the newest published release in
#   Packages/Shared/CmuxMobileFFI/mobile-ffi-pin.json and commits the matching
#   bindings beside it (scripts/cmux-next/publish-mobile-ffi-repin.sh): on the
#   base with the base autofix identity when CMUX_NEXT_BASE_AUTOFIX is 1, else
#   through the mobile-ffi-repin pull request. ios/CmuxiOS links the pinned
#   xcframework through that package; scripts/cmux-next/check-mobile-ffi-pin.sh
#   checks the pin (the rust job runs it on every push).
#
# The AAR is still an artifact only; GitHub Packages for it is a later slice.
name: cmux-mobile-ffi

#
# CI cut 2026-11-24 (goal ci-runner-min-per-day-50k): pull requests no longer run this advisory check; it gated
# nothing (no ruleset requires it, land-judge skips "(advisory)" names). Landings on feat-cmux-next and dispatch
# still run it, so a red shows up on base. The "(advisory)" name and pull_request conditions below stay inert.
on:
  push:
    branches:
      - feat-cmux-next
      - "feat-cmux-next-hq39-mobile-*"
      - "feat-cmux-next-object-sync*"
    paths:
      - ".github/workflows/cmux-mobile-ffi.yml"
      - ".github/actions/setup-cmux-tui-rust/**"
      - ".github/actions/runner-cargo-home/**"
      - "cmux-tui/Cargo.toml"
      - "cmux-tui/Cargo.lock"
      - "cmux-tui/rust-toolchain.toml"
      - "cmux-tui/crates/cmux-terminal-sizing/**"
      - "cmux-tui/crates/cmux-mobile-core/**"
      - "cmux-tui/crates/cmux-mobile-ffi/**"
      - "cmux-tui/crates/cmux-cloud-wire/**"
      # The rest of the published library's inputs (check-mobile-ffi-pin.sh --list-inputs).
      - "cmux-tui/crates/cmux-rd-screen/**"
      - "cmux-tui/crates/cmux-relay-snapshot/**"
      - "schemas/terminal-sizing/**"
      # The generated wire types (cmux-cloud-wire) and their vector gate.
      - "backend/catalog/cloud-operations.json"
      - "backend/catalog/cloud-vectors.json"
      - "backend/packages/protocol/scripts/export-rust-client.ts"
      # The ownership mirror (cmux-cloud-wire::mirror) and its trace vectors.
      - "schemas/ownership-mirror/**"
      - "backend/packages/ownership/src/**"
      - "backend/packages/ownership/scripts/export-mirror-vectors.ts"
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit or branch to build (defaults to the dispatched ref)"
        required: false
        default: ""
        type: string

concurrency:
  group: cmux-mobile-ffi-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/feat-cmux-next' }}

permissions: {}

env:
  # Warnings never fail a pull request's compile (Leo, 2026-11-19); pushes, dispatches, nightly and release
  # keep them errors. scripts/ci/warnings_policy.py.
  CI_WARNINGS: ${{ github.event_name == 'pull_request' && 'soft' || 'deny' }}
  # Temporary REST budget attribution: one gh-call line per GitHub API call (scripts/ci/api_call_log/env.sh, fetched at a fixed commit when the checkout has no copy).
  BASH_ENV: '$({ w="${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh"; t="${RUNNER_TEMP:-/nonexistent}/api-call-log-src"; if [ -f "$w" ]; then echo "$w"; elif [ -n "${RUNNER_TEMP:-}" ]; then if [ ! -f "$t/env.sh" ] && [ ! -e "$t.tried" ] && { [ "${RUNNER_OS:-}" = Linux ] || [ "${RUNNER_OS:-}" = macOS ]; } && [ "$(date -u +%Y%m%d%H)" -lt 2026112300 ]; then : > "$t.tried"; mkdir -p "$t.part" && for x in env.sh gh sitecustomize.py isolated.py; do curl -fsSL --max-time 5 -o "$t.part/$x" "https://raw.githubusercontent.com/manaflow-ai/cmux/27647ffd3ae838c63be28ca3e5883dcd68c34518/scripts/ci/api_call_log/$x" || break; done; [ -s "$t.part/isolated.py" ] && mv "$t.part" "$t"; fi; if [ -f "$t/env.sh" ]; then echo "$t/env.sh"; else echo unset BASH_ENV > "$t.off.sh" && echo "$t.off.sh"; fi; fi; } 2>/dev/null)'
  CARGO_TERM_COLOR: always
  # Every job installs the toolchain pinned in cmux-tui/rust-toolchain.toml.
  CMUX_MOBILE_FFI_CRATE: cmux-mobile-ffi

jobs:
  rust:
    name: rust (fmt, clippy, tests)${{ github.event_name == 'pull_request' && ' (advisory)' || '' }}
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft != true || (contains(github.event.pull_request.labels.*.name, 'full-ci') && (github.event.pull_request.base.ref != 'feat-cmux-next' || (github.event.action == 'labeled' && github.event.label.name == 'full-ci') || (vars.CI_FULL_CI_ONE_SHOT || '1') == '0')) || (vars.CI_DRAFT_CHEAP_TIER || '1') == '0') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || 'cmux-linux' }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up pinned Rust
        uses: ./.github/actions/setup-cmux-tui-rust

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && github.event_name != 'merge_group' && contains(fromJSON('["refs/heads/main","refs/heads/feat-cmux-next","refs/heads/nightly-next"]'), github.ref) }}
          # Why: docs/ci/cmux-next-workflow-notes.md#note-210 (pool runners keep different leftover toolchains)
          add-rust-environment-hash-key: false
          cache-bin: false
          workspaces: cmux-tui
          key: cmux-mobile-ffi-rust-${{ hashFiles('cmux-tui/rust-toolchain.toml', 'cmux-tui/Cargo.lock', '.cargo/config.toml') }}

      - name: Restore pinned Bun 1.4.4 from the CI cache bucket
        shell: bash
        continue-on-error: true
        run: bash "$GITHUB_WORKSPACE/scripts/ci/toolchain-r2.sh" restore bun 1.4.4 || true

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
          no-cache: ${{ !startsWith(github.workspace, '/home/runner/work/') || !(github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && github.event_name != 'merge_group' && contains(fromJSON('["refs/heads/main","refs/heads/feat-cmux-next","refs/heads/nightly-next"]'), github.ref)) }}

      - name: Generated wire types match the catalog
        working-directory: backend/packages/protocol
        run: bun scripts/export-rust-client.ts --check

      # feat-cmux-next only: a pin behind the sources is the normal state for
      # the hour after an FFI push (this run publishes and re-pins it), so
      # --stale-grace passes it with a note and fails it once it stays behind.
      - name: Check the mobile FFI pin
        if: ${{ github.ref == 'refs/heads/feat-cmux-next' && inputs.ref == '' }}
        run: bash scripts/cmux-next/check-mobile-ffi-pin.sh --verify-release --stale-grace 5400

      - name: rustfmt
        working-directory: cmux-tui
        run: cargo fmt --check -p cmux-terminal-sizing -p cmux-mobile-core -p cmux-mobile-ffi -p cmux-cloud-wire

      - name: clippy
        working-directory: cmux-tui
        run: python3 "$GITHUB_WORKSPACE/scripts/ci/warnings_policy.py" run -- cargo clippy --locked -p cmux-terminal-sizing -p cmux-mobile-core -p cmux-mobile-ffi -p cmux-cloud-wire --all-targets --keep-going -- -D warnings

      - name: Rust tests (fixtures included)
        working-directory: cmux-tui
        run: cargo test --locked -p cmux-terminal-sizing -p cmux-mobile-core -p cmux-mobile-ffi -p cmux-cloud-wire

  apple:
    name: apple (xcframework, Swift tests)
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft != true || (contains(github.event.pull_request.labels.*.name, 'full-ci') && (github.event.pull_request.base.ref != 'feat-cmux-next' || (github.event.action == 'labeled' && github.event.label.name == 'full-ci') || (vars.CI_FULL_CI_ONE_SHOT || '1') == '0')) || (vars.CI_DRAFT_CHEAP_TIER || '1') == '0') && (github.event_name != 'pull_request') }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'macos-26' || vars.CI_PAID_MACOS_OVERFLOW == '1' && vars.MACOS_RUNNER_15 || fromJSON(vars.RUNNER_POOLS).macos_15 }}
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.assemble.outputs.tag }}
      checksum: ${{ steps.assemble.outputs.checksum }}
      source: ${{ steps.assemble.outputs.source }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}

      - name: Select Xcode
        run: |
          set -euo pipefail
          ./scripts/select-ci-xcode.sh

      - name: Set up pinned Rust
        uses: ./.github/actions/setup-cmux-tui-rust

      - name: Install Apple targets
        run: |
          rustup target add \
            aarch64-apple-ios \
            aarch64-apple-ios-sim \
            x86_64-apple-ios \
            aarch64-apple-darwin \
            x86_64-apple-darwin

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && github.event_name != 'merge_group' && contains(fromJSON('["refs/heads/main","refs/heads/feat-cmux-next","refs/heads/nightly-next"]'), github.ref) }}
          # Why: docs/ci/cmux-next-workflow-notes.md#note-210 (pool runners keep different leftover toolchains)
          add-rust-environment-hash-key: false
          cache-bin: false
          workspaces: cmux-tui
          key: cmux-mobile-ffi-apple-${{ hashFiles('cmux-tui/rust-toolchain.toml', 'cmux-tui/Cargo.lock', '.cargo/config.toml') }}

      - name: Build static libraries
        working-directory: cmux-tui
        env:
          # Thin LTO leaves LLVM bitcode in the archive, which Apple's ld cannot
          # read from a newer rustc.
          CARGO_PROFILE_RELEASE_LTO: "off"
          RUSTFLAGS: "-C embed-bitcode=no"
          IPHONEOS_DEPLOYMENT_TARGET: "17.0"
          MACOSX_DEPLOYMENT_TARGET: "14.0"
        run: |
          set -euo pipefail
          for target in aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --locked --release -p "$CMUX_MOBILE_FFI_CRATE" --lib --target "$target"
            lib="target/$target/release/libcmux_mobile_ffi.a"
            exported="$(nm -g "$lib" 2>/dev/null | grep -c ' T _uniffi_cmux_mobile_ffi_' || true)"
            echo "$target: $exported exported uniffi symbols"
            if [[ "$exported" -lt 1 ]]; then
              echo "::error::$lib exports no uniffi text symbols" >&2
              exit 1
            fi
          done

      - name: Generate Swift bindings
        working-directory: cmux-tui
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/uniffi-swift"
          rm -rf "$out"
          cargo run --locked -p "$CMUX_MOBILE_FFI_CRATE" --features bindgen --bin uniffi-bindgen -- \
            generate --library target/aarch64-apple-darwin/release/libcmux_mobile_ffi.dylib \
            --language swift --out-dir "$out"
          ls -l "$out"
          sources=crates/cmux-mobile-ffi/swift/Sources/CmuxMobileFFI
          mkdir -p "$sources"
          cp "$out/CmuxMobileFFI.swift" "$sources/"

      - name: Assemble xcframework
        id: assemble
        run: |
          set -euo pipefail
          # Static frameworks, not bare libraries: bare-library slices copy
          # their module maps to one Build/Products include path and collide.
          lib=cmux-tui/target
          gen="$RUNNER_TEMP/uniffi-swift"
          name=CmuxMobileFFIFFI
          out="$RUNNER_TEMP/xcframework"
          xcf="$out/$name.xcframework"
          rm -rf "$out"
          mkdir -p "$xcf"
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' cmux-tui/crates/cmux-mobile-ffi/Cargo.toml | head -1)"
          entries=""
          add_slice() {
            local slice="$1" platform="$2" supported="$3" minos="$4" variant="$5" architectures="$6"
            shift 6
            local archive="$out/$slice/libcmux_mobile_ffi.a"
            local fw="$xcf/$slice/$name.framework"
            mkdir -p "$(dirname "$archive")" "$fw/Headers" "$fw/Modules"
            if [[ "$#" == 1 ]]; then cp "$1" "$archive"; else lipo -create "$@" -output "$archive"; fi
            cp "$archive" "$fw/$name"
            cp "$gen/$name.h" "$fw/Headers/"
            printf 'framework module %s {\n    umbrella header "%s.h"\n    export *\n    module * { export * }\n}\n' "$name" "$name" > "$fw/Modules/module.modulemap"
            local variant_key=""
            [[ -z "$variant" ]] || variant_key="<key>SupportedPlatformVariant</key><string>$variant</string>"
            cat > "$fw/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleDevelopmentRegion</key><string>en</string>
            <key>CFBundleExecutable</key><string>$name</string>
            <key>CFBundleIdentifier</key><string>com.cmuxterm.$name</string>
            <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
            <key>CFBundleName</key><string>$name</string>
            <key>CFBundlePackageType</key><string>FMWK</string>
            <key>CFBundleShortVersionString</key><string>$version</string>
            <key>CFBundleVersion</key><string>1</string>
            <key>CFBundleSupportedPlatforms</key><array><string>$supported</string></array>
            <key>MinimumOSVersion</key><string>$minos</string>
          </dict></plist>
          PLIST
            plutil -lint "$fw/Info.plist"
            local architectures_xml=""
            for architecture in $architectures; do architectures_xml+="<string>$architecture</string>"; done
            entries+="<dict><key>BinaryPath</key><string>$name.framework/$name</string><key>LibraryIdentifier</key><string>$slice</string><key>LibraryPath</key><string>$name.framework</string><key>SupportedArchitectures</key><array>$architectures_xml</array><key>SupportedPlatform</key><string>$platform</string>$variant_key</dict>"
          }
          add_slice ios-arm64 ios iPhoneOS 17.0 "" "arm64" \
            "$lib/aarch64-apple-ios/release/libcmux_mobile_ffi.a"
          add_slice ios-arm64_x86_64-simulator ios iPhoneSimulator 17.0 simulator "arm64 x86_64" \
            "$lib/aarch64-apple-ios-sim/release/libcmux_mobile_ffi.a" \
            "$lib/x86_64-apple-ios/release/libcmux_mobile_ffi.a"
          add_slice macos-arm64_x86_64 macos MacOSX 14.0 "" "arm64 x86_64" \
            "$lib/aarch64-apple-darwin/release/libcmux_mobile_ffi.a" \
            "$lib/x86_64-apple-darwin/release/libcmux_mobile_ffi.a"
          cat > "$xcf/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>AvailableLibraries</key><array>$entries</array>
            <key>CFBundlePackageType</key><string>XFWK</string>
            <key>XCFrameworkFormatVersion</key><string>1.0</string>
          </dict></plist>
          PLIST
          plutil -lint "$xcf/Info.plist"
          find "$xcf" -exec touch -t 198001010000 {} +
          (cd "$out" && ditto -c -k --keepParent "$name.xcframework" "$name.xcframework.zip")
          checksum="$(shasum -a 256 "$out/$name.xcframework.zip" | awk '{print $1}')"
          # The release assets beside the zip: the bindings generated from this
          # build (they must match the library: uniffi checks its contract
          # version and checksums at load), and the source commit.
          cp "$gen/CmuxMobileFFI.swift" "$out/CmuxMobileFFI.swift"
          source="$(git rev-parse HEAD)"
          printf '%s\n' "$source" > "$out/SOURCE_SHA"
          bindings="$(shasum -a 256 "$out/CmuxMobileFFI.swift" | awk '{print $1}')"
          printf '%s  %s\n%s  %s\n' "$checksum" "$name.xcframework.zip" "$bindings" CmuxMobileFFI.swift > "$out/SHA256SUMS"
          echo "xcframework sha256: $checksum"
          {
            echo "tag=cmux-mobile-ffi-$source"
            echo "checksum=$checksum"
            echo "source=$source"
          } >> "$GITHUB_OUTPUT"
          mkdir -p cmux-tui/crates/cmux-mobile-ffi/swift/build
          cp -R "$xcf" cmux-tui/crates/cmux-mobile-ffi/swift/build/

      - name: Report sizes
        run: |
          set -euo pipefail
          {
            echo "### cmux-mobile-ffi Apple sizes (bytes)"
            echo
            echo "| slice | static library |"
            echo "| --- | --- |"
            for slice in ios-arm64 ios-arm64_x86_64-simulator macos-arm64_x86_64; do
              echo "| $slice | $(stat -f %z "$RUNNER_TEMP/xcframework/$slice/libcmux_mobile_ffi.a") |"
            done
            echo "| xcframework zip | $(stat -f %z "$RUNNER_TEMP/xcframework/CmuxMobileFFIFFI.xcframework.zip") |"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Report linked size
        run: |
          set -euo pipefail
          # An archive holds all of std; what an app pays is the code a link
          # keeps. Link a program that takes the address of every exported
          # uniffi symbol, with dead stripping, and compare it to an empty one.
          work="$RUNNER_TEMP/linked-size"
          mkdir -p "$work"
          {
            echo "### cmux-mobile-ffi linked size (bytes, -dead_strip, every uniffi export kept)"
            echo
            echo "| slice | empty program | with library | added |"
            echo "| --- | --- | --- | --- |"
            for spec in "ios-arm64 iphoneos arm64-apple-ios17.0" "ios-arm64_x86_64-simulator iphonesimulator arm64-apple-ios17.0-simulator"; do
              read -r slice sdk triple <<<"$spec"
              archive="$RUNNER_TEMP/xcframework/$slice/libcmux_mobile_ffi.a"
              symbols=()
              while IFS= read -r symbol; do symbols+=("$symbol"); done < <(
                nm -gU "$archive" 2>/dev/null |
                  awk '$2 == "T" && $3 ~ /^_(uniffi|ffi)_cmux_mobile_ffi_/ { print substr($3, 2) }' | sort -u
              )
              {
                printf 'extern void %s(void);\n' "${symbols[@]}"
                echo 'int main(void) { const void *volatile p[] = {'
                printf '  (const void *)&%s,\n' "${symbols[@]}"
                echo '  0 }; return p[0] == 0; }'
              } > "$work/$slice.c"
              echo 'int main(void) { return 0; }' > "$work/empty.c"
              sysroot="$(xcrun --sdk "$sdk" --show-sdk-path)"
              xcrun --sdk "$sdk" clang -target "$triple" -isysroot "$sysroot" -Os -Wl,-dead_strip \
                -o "$work/empty-$slice" "$work/empty.c"
              xcrun --sdk "$sdk" clang -target "$triple" -isysroot "$sysroot" -Os -Wl,-dead_strip \
                -o "$work/linked-$slice" "$work/$slice.c" "$archive" -framework Foundation -framework Security
              strip -x "$work/empty-$slice" "$work/linked-$slice"
              empty="$(stat -f %z "$work/empty-$slice")"
              linked="$(stat -f %z "$work/linked-$slice")"
              echo "| $slice (${#symbols[@]} exports) | $empty | $linked | $((linked - empty)) |"
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Swift fixture tests (macOS slice)
        working-directory: cmux-tui/crates/cmux-mobile-ffi/swift
        run: swift test

      - name: Swift fixture tests (iOS simulator slice)
        working-directory: cmux-tui/crates/cmux-mobile-ffi/swift
        run: |
          set -euo pipefail
          udid="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          found = sorted(
              (runtime, device["udid"])
              for runtime, items in devices.items()
              if ".SimRuntime.iOS-" in runtime
              for device in items
              if device["name"].startswith("iPhone")
          )
          print(found[-1][1] if found else "")
          ')"
          if [[ -z "$udid" ]]; then
            echo "::error::no available iPhone simulator on this runner" >&2
            exit 1
          fi
          scheme="$(xcodebuild -list -json | python3 -c '
          import json, sys
          schemes = json.load(sys.stdin)["workspace"]["schemes"]
          print("CmuxMobileFFI-Package" if "CmuxMobileFFI-Package" in schemes else "CmuxMobileFFI")
          ')"
          echo "simulator $udid, scheme $scheme"
          xcodebuild test -scheme "$scheme" -destination "id=$udid" \
            -derivedDataPath "${CMUX_DERIVED_DATA_SLOT:-$RUNNER_TEMP}/dd-sim" CODE_SIGNING_ALLOWED=NO

      - name: Link the iOS device slice
        working-directory: cmux-tui/crates/cmux-mobile-ffi/swift
        run: |
          set -euo pipefail
          scheme="$(xcodebuild -list -json | python3 -c '
          import json, sys
          schemes = json.load(sys.stdin)["workspace"]["schemes"]
          print("CmuxMobileFFI-Package" if "CmuxMobileFFI-Package" in schemes else "CmuxMobileFFI")
          ')"
          xcodebuild build-for-testing -scheme "$scheme" -destination "generic/platform=iOS" \
            -derivedDataPath "${CMUX_DERIVED_DATA_SLOT:-$RUNNER_TEMP}/dd-device" CODE_SIGNING_ALLOWED=NO

      - name: Upload xcframework
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: CmuxMobileFFIFFI.xcframework
          retention-days: 7
          path: |
            ${{ runner.temp }}/xcframework/CmuxMobileFFIFFI.xcframework.zip
            ${{ runner.temp }}/xcframework/SHA256SUMS
            ${{ runner.temp }}/xcframework/SOURCE_SHA
            ${{ runner.temp }}/xcframework/CmuxMobileFFI.swift
            ${{ runner.temp }}/uniffi-swift
          if-no-files-found: error

  android:
    name: android (cargo-ndk, AAR, Kotlin tests)
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft != true || (contains(github.event.pull_request.labels.*.name, 'full-ci') && (github.event.pull_request.base.ref != 'feat-cmux-next' || (github.event.action == 'labeled' && github.event.label.name == 'full-ci') || (vars.CI_FULL_CI_ONE_SHOT || '1') == '0')) || (vars.CI_DRAFT_CHEAP_TIER || '1') == '0') && (github.event_name != 'pull_request') }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || 'cmux-linux' }}
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      NDK_VERSION: r27c
      CARGO_NDK_VERSION: 3.5.4
      GRADLE_VERSION: "8.13"
      GRADLE_SHA256: 20f1b1176237254a6fc204d8434196fa11a4cfb387567519c61556e8710aed78
      ANDROID_PLATFORM: "24"
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up pinned Rust
        uses: ./.github/actions/setup-cmux-tui-rust

      - name: Install Android targets
        run: rustup target add aarch64-linux-android x86_64-linux-android

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && github.event_name != 'merge_group' && contains(fromJSON('["refs/heads/main","refs/heads/feat-cmux-next","refs/heads/nightly-next"]'), github.ref) }}
          # Why: docs/ci/cmux-next-workflow-notes.md#note-210 (pool runners keep different leftover toolchains)
          add-rust-environment-hash-key: false
          cache-bin: false
          workspaces: cmux-tui
          key: cmux-mobile-ffi-android-${{ hashFiles('cmux-tui/rust-toolchain.toml', 'cmux-tui/Cargo.lock', '.cargo/config.toml') }}

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Set up Android NDK
        id: ndk
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1.6.0
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: false

      - name: Install cargo-ndk and Gradle
        run: |
          set -euo pipefail
          cargo install cargo-ndk --version "$CARGO_NDK_VERSION" --locked
          zip="$RUNNER_TEMP/gradle-$GRADLE_VERSION-bin.zip"
          curl --proto '=https' --tlsv1.2 -fsSL -o "$zip" \
            "https://services.gradle.org/distributions/gradle-$GRADLE_VERSION-bin.zip"
          echo "$GRADLE_SHA256  $zip" | sha256sum --check --strict
          unzip -q "$zip" -d "$RUNNER_TEMP/gradle"
          echo "$RUNNER_TEMP/gradle/gradle-$GRADLE_VERSION/bin" >> "$GITHUB_PATH"

      - name: Build host library and Kotlin bindings
        working-directory: cmux-tui
        run: |
          set -euo pipefail
          cargo build --locked -p "$CMUX_MOBILE_FFI_CRATE" --lib
          out="$RUNNER_TEMP/uniffi-kotlin"
          rm -rf "$out"
          cargo run --locked -p "$CMUX_MOBILE_FFI_CRATE" --features bindgen --bin uniffi-bindgen -- \
            generate --library target/debug/libcmux_mobile_ffi.so \
            --language kotlin --no-format --out-dir "$out"
          find "$out" -type f -print

      - name: Build Android libraries
        working-directory: cmux-tui
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          cargo ndk -t arm64-v8a -t x86_64 --platform "$ANDROID_PLATFORM" -o "$RUNNER_TEMP/jniLibs" \
            build --locked --release -p "$CMUX_MOBILE_FFI_CRATE" --lib
          find "$RUNNER_TEMP/jniLibs" -type f -name '*.so' -print
          for abi in arm64-v8a x86_64; do
            test -s "$RUNNER_TEMP/jniLibs/$abi/libcmux_mobile_ffi.so"
          done

      - name: Kotlin fixture tests and AAR
        working-directory: cmux-tui/crates/cmux-mobile-ffi/android
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace \
            -PuniffiKotlinDir="$RUNNER_TEMP/uniffi-kotlin" \
            -PjniLibsDir="$RUNNER_TEMP/jniLibs" \
            -PhostLibDir="$GITHUB_WORKSPACE/cmux-tui/target/debug" \
            -PsizingFixtures="$GITHUB_WORKSPACE/schemas/terminal-sizing/fixtures.json" \
            :ffi:testDebugUnitTest :ffi:assembleRelease
          aar=ffi/build/outputs/aar/ffi-release.aar
          test -s "$aar"
          unzip -l "$aar" | grep -E 'jni/(arm64-v8a|x86_64)/libcmux_mobile_ffi.so'
          mkdir -p "$RUNNER_TEMP/aar"
          cp "$aar" "$RUNNER_TEMP/aar/cmux-mobile-ffi-release.aar"
          (cd "$RUNNER_TEMP/aar" && sha256sum cmux-mobile-ffi-release.aar > SHA256SUMS)

      - name: Report sizes
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          strip="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
          test -x "$strip"
          packed="$RUNNER_TEMP/aar-unpacked"
          rm -rf "$packed" && mkdir -p "$packed"
          unzip -q "$RUNNER_TEMP/aar/cmux-mobile-ffi-release.aar" 'jni/*' -d "$packed"
          {
            echo "### cmux-mobile-ffi Android sizes (bytes)"
            echo
            echo "| ABI | cargo-ndk .so | stripped | in the AAR |"
            echo "| --- | --- | --- | --- |"
            for abi in arm64-v8a x86_64; do
              so="$RUNNER_TEMP/jniLibs/$abi/libcmux_mobile_ffi.so"
              "$strip" --strip-all -o "$RUNNER_TEMP/stripped-$abi.so" "$so"
              echo "| $abi | $(stat -c %s "$so") | $(stat -c %s "$RUNNER_TEMP/stripped-$abi.so") | $(stat -c %s "$packed/jni/$abi/libcmux_mobile_ffi.so") |"
            done
            echo "| AAR | | | $(stat -c %s "$RUNNER_TEMP/aar/cmux-mobile-ffi-release.aar") |"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload AAR
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-mobile-ffi-android
          retention-days: 7
          path: |
            ${{ runner.temp }}/aar
            ${{ runner.temp }}/jniLibs
            ${{ runner.temp }}/uniffi-kotlin
          if-no-files-found: error

  publish:
    name: publish release
    needs: apple
    # The branch tip only (no `ref` input): the tag names the commit this run is for.
    if: ${{ !cancelled() && needs.apple.result == 'success' && github.ref == 'refs/heads/feat-cmux-next' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && inputs.ref == '' }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || 'cmux-linux' }}
    timeout-minutes: 15
    # Never cancelled: two runs of one commit publish one at a time, so the
    # second sees the first's release and checks its checksum.
    concurrency:
      group: cmux-mobile-ffi-publish-${{ github.sha }}
      cancel-in-progress: false
    # The FFI release App credentials (feat-cmux-next only, as app-ffi-release.yml).
    environment: ffi-release
    permissions:
      contents: read
    env:
      TAG: ${{ needs.apple.outputs.tag }}
      CHECKSUM: ${{ needs.apple.outputs.checksum }}
      HAND_PUBLISH: >-
        gh run download ${{ github.run_id }} --repo ${{ github.repository }} --name CmuxMobileFFIFFI.xcframework --dir mobile-ffi-${{ github.sha }}
        && (cd mobile-ffi-${{ github.sha }}/xcframework && shasum -a 256 -c SHA256SUMS && test "$(cat SOURCE_SHA)" = ${{ github.sha }}
        && gh release create ${{ needs.apple.outputs.tag }} CmuxMobileFFIFFI.xcframework.zip CmuxMobileFFI.swift SHA256SUMS SOURCE_SHA
        --repo ${{ github.repository }} --target ${{ github.sha }} --title ${{ needs.apple.outputs.tag }}
        --notes "cmux-mobile-ffi CmuxMobileFFIFFI.xcframework, source ${{ github.sha }}, SwiftPM checksum ${{ needs.apple.outputs.checksum }}"
        --prerelease --latest=false)
        && scripts/cmux-next/repin-mobile-ffi.sh ${{ github.sha }} ${{ needs.apple.outputs.checksum }}
        && scripts/cmux-next/check-mobile-ffi-pin.sh --verify-release
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: CmuxMobileFFIFFI.xcframework
          path: ${{ runner.temp }}/artifact

      - name: Mint the release App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.CMUX_FFI_RELEASE_APP_ID }}
          private-key: ${{ secrets.CMUX_FFI_RELEASE_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Create the release (never overwrite)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          assets="$RUNNER_TEMP/artifact/xcframework"
          (cd "$assets" && sha256sum --check --strict SHA256SUMS)
          [[ "$(tr -d '[:space:]' < "$assets/SOURCE_SHA")" == "$GITHUB_SHA" ]]
          grep -qxF "$CHECKSUM  CmuxMobileFFIFFI.xcframework.zip" "$assets/SHA256SUMS"
          notes="cmux-mobile-ffi for the iOS app: CmuxMobileFFIFFI.xcframework (static, iOS arm64, iOS simulator arm64/x86_64, macOS arm64/x86_64) and the uniffi Swift bindings generated from the same build (CmuxMobileFFI.swift). Source $GITHUB_SHA. SwiftPM binaryTarget checksum: $CHECKSUM"
          # Only gh's "release not found" means absent; any other failed read is asked again.
          exists=""
          probe="$(mktemp)"
          for attempt in 1 2 3 4 5 6; do
            if gh release view "$TAG" >/dev/null 2>"$probe"; then exists=1; break; fi
            if grep -qi "release not found" "$probe"; then exists=no; break; fi
            echo "read $attempt of release $TAG failed: $(tr '\n' ' ' < "$probe")"
            [[ "$attempt" == 6 ]] || sleep 10
          done
          if [[ -z "$exists" ]]; then
            echo "::error title=Publish by hand::could not read release $TAG after 6 tries; rerun this job, or publish by hand: $HAND_PUBLISH"
            exit 1
          fi
          if [[ "$exists" == 1 ]]; then
            existing="$(mktemp -d)"
            gh release download "$TAG" --pattern "CmuxMobileFFIFFI.xcframework.zip" --dir "$existing"
            published="$(sha256sum "$existing/CmuxMobileFFIFFI.xcframework.zip" | awk '{print $1}')"
            if [[ "$published" != "$CHECKSUM" ]]; then
              echo "::error::release $TAG exists with checksum $published, not $CHECKSUM; it is never overwritten" >&2
              exit 1
            fi
            echo "release $TAG already has the matching archive"
          elif ! gh release create "$TAG" \
              "$assets/CmuxMobileFFIFFI.xcframework.zip" "$assets/CmuxMobileFFI.swift" \
              "$assets/SHA256SUMS" "$assets/SOURCE_SHA" \
              --target "$GITHUB_SHA" --title "$TAG" --notes "$notes" --prerelease --latest=false; then
            echo "::error title=Publish by hand::the release App token could not create release $TAG (see the gh error above). Publish by hand: $HAND_PUBLISH"
            exit 1
          fi
          echo "release: https://github.com/$GH_REPO/releases/tag/$TAG"

      - name: The latest release is not an FFI tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          latest="$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name 2>/dev/null || true)"
          echo "latest release: ${latest:-none}"
          if [[ "$latest" == cmux-mobile-ffi-* ]]; then
            echo "::error::the repository's latest release now points at $latest" >&2
            exit 1
          fi

      # The last word, as in app-ffi-release.yml: green only when an anonymous
      # download of the release has this run's checksum (the public URL, so its
      # retries spend no API token). Runs after a failed step too.
      - name: The release exists with this run's archive
        if: ${{ !cancelled() }}
        env:
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          check="$(mktemp -d)"
          url="https://github.com/$GH_REPO/releases/download/$TAG/CmuxMobileFFIFFI.xcframework.zip"
          found=""
          for attempt in 1 2 3 4 5 6; do
            rm -f "$check/archive.zip"
            if curl -fsSL -o "$check/archive.zip" "$url" 2>"$check/read.err"; then found=1; break; fi
            echo "read $attempt of $url failed: $(tr '\n' ' ' < "$check/read.err")"
            [[ "$attempt" == 6 ]] || sleep 10
          done
          if [[ -z "$found" ]]; then
            echo "::error title=Publish by hand::release $TAG does not exist; this run published nothing. Publish by hand: $HAND_PUBLISH"
            exit 1
          fi
          published="$(sha256sum "$check/archive.zip" | awk '{print $1}')"
          [[ "$published" == "$CHECKSUM" ]] || { echo "::error::release $TAG has checksum $published, not $CHECKSUM" >&2; exit 1; }
          echo "release $TAG exists with checksum $CHECKSUM"

  repin:
    name: pin the new release
    needs: [apple, publish]
    # Only after this run published: the re-pin pins the newest published
    # release newer than the current pin, so a run whose build failed leaves the
    # pin to the next one (check-mobile-ffi-pin.sh fails base after 90 min).
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    environment: ffi-release
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || 'cmux-linux' }}
    timeout-minutes: 20
    permissions:
      contents: read
    concurrency:
      group: cmux-mobile-ffi-repin
      cancel-in-progress: false
    steps:
      - name: Mint the release App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.CMUX_FFI_RELEASE_APP_ID }}
          private-key: ${{ secrets.CMUX_FFI_RELEASE_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-workflows: write

      # A separate token: a mint that asks for a permission the App lacks fails whole.
      - name: Mint the release App token for the pull request
        id: pr-token
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.CMUX_FFI_RELEASE_APP_ID }}
          private-key: ${{ secrets.CMUX_FFI_RELEASE_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-pull-requests: write

      # The base autofix's push identity (the bypass actor of feat-cmux-next's
      # required check), as app-ffi-release.yml's re-pin pins on the base.
      - name: Mint the base pin token
        id: base-token
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.CMUX_PR_AUTOFIX_APP_ID }}
          private-key: ${{ secrets.CMUX_PR_AUTOFIX_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: refs/heads/feat-cmux-next
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true
          fetch-depth: 0
          filter: tree:0

      - name: Pin the new release (base, else the re-pin pull request)
        env:
          GH_TOKEN: ${{ steps.pr-token.outputs.token }}
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          BASE_TOKEN: ${{ steps.base-token.outputs.token }}
          BASE_PIN_ENABLED: ${{ vars.CMUX_NEXT_BASE_AUTOFIX == '1' }}
          SOURCE: ${{ needs.apple.outputs.source }}
          CHECKSUM: ${{ needs.apple.outputs.checksum }}
          GIT_HTTP_LOW_SPEED_LIMIT: "1"
          GIT_HTTP_LOW_SPEED_TIME: "60"
        shell: bash
        run: bash scripts/cmux-next/publish-mobile-ffi-repin.sh
