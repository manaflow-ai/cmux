name: Test integrity

on:
  # This workflow is evaluated from the default branch, so a pull request
  # cannot remove or weaken the guard it is asking us to run.
  pull_request_target:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-integrity-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}

jobs:
  deleted-or-weakened-tests:
    name: deleted-or-weakened-tests
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || contains(fromJSON('["ubuntu-24.04","blacksmith-2vcpu-ubuntu-2404","blacksmith-4vcpu-ubuntu-2404","blacksmith-8vcpu-ubuntu-2404"]'), vars.CI_TRUSTED_RUNNER) && vars.CI_TRUSTED_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 5
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Flag deleted or weakened tests
        env:
          TEST_INTEGRITY_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: |
          set -euo pipefail
          base="${TEST_INTEGRITY_BASE_SHA:-HEAD^1}"
          if ! git fetch --no-tags origin "$base"; then
            echo "test-integrity: base commit is unavailable" >&2
            exit 2
          fi
          if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "test-integrity: base commit is unavailable" >&2
            exit 2
          fi
          # Load the checker from the base so a PR cannot edit its own guard.
          if ! git cat-file -e "$base:scripts/ci/test_integrity.py" 2>/dev/null; then
            echo "test-integrity: base predates this guard; no comparison yet"
            exit 0
          fi
          merge_base="$(git merge-base "$base" HEAD)"
          git show "$base:scripts/ci/test_integrity.py" > "$RUNNER_TEMP/test_integrity.py"
          python3 "$RUNNER_TEMP/test_integrity.py" --base "$merge_base" --strict
