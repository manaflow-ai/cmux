# CI/CD for the device hub (workers/device-hub; DEPLOY.md).
#
# Pull requests touching the hub run the checks: frozen install, typecheck, the vitest suite on
# workerd, and a `wrangler deploy --dry-run` of both environments.
#
# A push to feat-cmux-next touching the hub runs the checks, deploys dev (`cmux-device-hub-dev`),
# then production (`cmux-device-hub`), each followed by a /v1/health check. Before this workflow a
# person deployed by hand, so merged hub changes could sit undeployed with nothing noticing.
# A manual run (target prod or dev) redeploys one environment from feat-cmux-next.
#
# Code only. `wrangler deploy` uploads the code and applies the Durable Object migrations declared
# in wrangler.toml atomically with it. The Worker secrets (SESSION_KEY, TICKET_KEY, TURN_KEY_ID,
# TURN_KEY_API_TOKEN) were set once per environment with `wrangler secret put`, survive every
# deploy, and this workflow never reads or writes them.
#
# Credentials: CLOUDFLARE_API_TOKEN (Workers Scripts:Edit on Lawrence's account), the token
# backend.yml uses for the NEXT API on the same account. The jobs run in the GitHub environments
# backend.yml uses, cmux-next-development and cmux-next-production, whose branch policy bounds who
# gets the token (tests/test_supplychain_security.py wants every dispatchable credential job in an
# environment). The account id is not a secret: backend.yml and DEPLOY.md name it too.

name: device-hub

on:
  pull_request:
    paths:
      - .github/workflows/device-hub.yml
      - workers/device-hub/**
  push:
    branches: [feat-cmux-next]
    paths:
      - .github/workflows/device-hub.yml
      - workers/device-hub/**
  workflow_dispatch:
    inputs:
      target:
        description: "Hub to deploy"
        type: choice
        options:
          - prod
          - dev
        default: prod

permissions:
  contents: read

concurrency:
  # A pull request gets a group of its own, and a new push cancels its older run. Every deploy
  # shares one group and is never cancelled halfway (a newer push queues behind it).
  group: ${{ github.event_name == 'pull_request' && format('device-hub-pr-{0}', github.event.pull_request.number) || 'device-hub-deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Temporary REST budget attribution: one gh-call line per GitHub API call (scripts/ci/api_call_log/env.sh, fetched at a fixed commit when the checkout has no copy).
  BASH_ENV: '$({ w="${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh"; t="${RUNNER_TEMP:-/nonexistent}/api-call-log-src"; if [ -f "$w" ]; then echo "$w"; elif [ -n "${RUNNER_TEMP:-}" ]; then if [ ! -f "$t/env.sh" ] && [ ! -e "$t.tried" ] && { [ "${RUNNER_OS:-}" = Linux ] || [ "${RUNNER_OS:-}" = macOS ]; } && [ "$(date -u +%Y%m%d%H)" -lt 2026112300 ]; then : > "$t.tried"; mkdir -p "$t.part" && for x in env.sh gh sitecustomize.py isolated.py; do curl -fsSL --max-time 5 -o "$t.part/$x" "https://raw.githubusercontent.com/manaflow-ai/cmux/27647ffd3ae838c63be28ca3e5883dcd68c34518/scripts/ci/api_call_log/$x" || break; done; [ -s "$t.part/isolated.py" ] && mv "$t.part" "$t"; fi; if [ -f "$t/env.sh" ]; then echo "$t/env.sh"; else echo unset BASH_ENV > "$t.off.sh" && echo "$t.off.sh"; fi; fi; } 2>/dev/null)'

jobs:
  test:
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-4vcpu-ubuntu-2404' || !startsWith(vars.LINUX_RUNNER, 'blacksmith-') && vars.LINUX_RUNNER || vars.CI_CLOUD_OVERFLOW_SAVED && fromJSON(vars.RUNNER_POOLS).linux_8 || fromJSON(vars.RUNNER_POOLS).linux_4 }} # owned-pool-unfit: vitest on workerd timed out twice on cmux-linux hosts (#48644); stays on its old pool until it fits
    timeout-minutes: 20
    defaults:
      run:
        working-directory: workers/device-hub
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Wrangler and workerd need Node >= 22; the Blacksmith ubuntu-2404 image ships Node 20.
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Tests (vitest on workerd)
        run: npx vitest run

      - name: Wrangler dry-run build (production and dev)
        run: |
          npx wrangler deploy --dry-run --env="" --outdir "$RUNNER_TEMP/dist-prod"
          npx wrangler deploy --dry-run --env dev --outdir "$RUNNER_TEMP/dist-dev"

  deploy-dev:
    needs: test
    if: github.ref == 'refs/heads/feat-cmux-next' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.target == 'dev'))
    environment: cmux-next-development
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && (vars.CI_FORK_LINUX_RUNNER || 'ubuntu-24.04') || 'cmux-linux' }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: workers/device-hub
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Check Cloudflare secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::The device hub deploy needs CLOUDFLARE_API_TOKEN (environment cmux-next-development or the repository): an API token with Workers Scripts:Edit on account 0c1675e0def6de1ab3a50a4e17dc5656."
            exit 1
          fi

      - name: Deploy dev
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 0c1675e0def6de1ab3a50a4e17dc5656
        run: |
          set -o pipefail
          # The wrangler pinned in package-lock.json. Code and DO migrations only; secrets untouched.
          npx wrangler deploy --env dev 2>&1 | tee "$RUNNER_TEMP/deploy.log"
          # `|| true`: a log without the line must reach the warning below, not end the step under pipefail.
          version="$(grep -oE 'Current Version ID: [0-9a-f-]+' "$RUNNER_TEMP/deploy.log" | tail -n 1 | sed 's/.*: //' || true)"
          if [ -z "$version" ]; then
            echo "::warning::wrangler printed no Current Version ID."
            version=unknown
          fi
          echo "Deployed cmux-device-hub-dev version $version at $GITHUB_SHA"
          echo "Deployed \`cmux-device-hub-dev\` version \`$version\` at \`$GITHUB_SHA\`." >> "$GITHUB_STEP_SUMMARY"

      - name: Health check
        run: |
          for attempt in 1 2 3 4 5 6; do
            if body="$(curl -fsS --max-time 10 https://cmux-device-hub-dev.debussy.workers.dev/v1/health)"; then
              echo "/v1/health: $body"
              echo "\`https://cmux-device-hub-dev.debussy.workers.dev/v1/health\`: \`$body\`" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "attempt $attempt: /v1/health did not answer 2xx"
            sleep 5
          done
          echo "::error::https://cmux-device-hub-dev.debussy.workers.dev/v1/health did not answer after the deploy."
          exit 1

  deploy-prod:
    needs: [test, deploy-dev]
    # On a push, production follows a good dev deploy; a manual prod run skips dev.
    if: >-
      !cancelled() && needs.test.result == 'success'
      && github.ref == 'refs/heads/feat-cmux-next'
      && ((github.event_name == 'push' && needs.deploy-dev.result == 'success')
        || (github.event_name == 'workflow_dispatch' && inputs.target == 'prod'))
    environment: cmux-next-production
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && (vars.CI_FORK_LINUX_RUNNER || 'ubuntu-24.04') || 'cmux-linux' }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: workers/device-hub
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Check Cloudflare secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::The device hub deploy needs CLOUDFLARE_API_TOKEN (environment cmux-next-production or the repository): an API token with Workers Scripts:Edit on account 0c1675e0def6de1ab3a50a4e17dc5656."
            exit 1
          fi

      - name: Deploy production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 0c1675e0def6de1ab3a50a4e17dc5656
        run: |
          set -o pipefail
          # The wrangler pinned in package-lock.json. Code and DO migrations only; secrets untouched.
          npx wrangler deploy --env="" 2>&1 | tee "$RUNNER_TEMP/deploy.log"
          # `|| true`: a log without the line must reach the warning below, not end the step under pipefail.
          version="$(grep -oE 'Current Version ID: [0-9a-f-]+' "$RUNNER_TEMP/deploy.log" | tail -n 1 | sed 's/.*: //' || true)"
          if [ -z "$version" ]; then
            echo "::warning::wrangler printed no Current Version ID."
            version=unknown
          fi
          echo "Deployed cmux-device-hub version $version at $GITHUB_SHA"
          echo "Deployed \`cmux-device-hub\` version \`$version\` at \`$GITHUB_SHA\`." >> "$GITHUB_STEP_SUMMARY"

      - name: Health check
        run: |
          for attempt in 1 2 3 4 5 6; do
            if body="$(curl -fsS --max-time 10 https://cmux-device-hub.debussy.workers.dev/v1/health)"; then
              echo "/v1/health: $body"
              echo "\`https://cmux-device-hub.debussy.workers.dev/v1/health\`: \`$body\`" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "attempt $attempt: /v1/health did not answer 2xx"
            sleep 5
          done
          echo "::error::https://cmux-device-hub.debussy.workers.dev/v1/health did not answer after the deploy."
          exit 1
