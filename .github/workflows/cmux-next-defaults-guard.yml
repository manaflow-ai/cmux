name: cmux-next defaults guard

# Fails a feat-cmux-next pull request that changes a default (an action's
# default keys, a setting's default, a Ghostty keybind cmux writes, a compiled
# feature flag) until a call owner other than its author approves its head
# (scripts/ci/defaults_guard.py; owners in .github/defaults-call-owners.json).
# Leo 2026-10-13: defaults changed without a call (#15382, #15398, #19788).
#
# Fast: no build. It sparse-checks-out only the guard's files of the merge base
# and the head (about 40 MiB of a 340 MiB tree) and reports within a minute.
# Every changed default is a warning annotation and a sticky comment that says
# who must approve; both stay after it passes, and the merge adds a receipt.
#
# Lives on main: GitHub takes a pull_request_target workflow from the default
# branch whatever the pull request's base, so the feat-cmux-next copy never ran
# (#23105 merged a new default with no call). The guard and the owners file are
# still the feat-cmux-next base's: both are checked out at the pull request's
# base commit below, never from main. This copy is the one that runs, so change
# it here; the feat-cmux-next copy keeps the file name the review re-run
# (cmux-next-defaults-guard-review.yml) looks this run up by.
#
# Trust: only pull_request_target runs this, so the workflow, the guard and
# the owners file are always the base's. The head is only read as data (JSON
# exports and Swift text); nothing from it runs, so a pull request can neither
# edit the owners file nor the guard to pass itself, and a change to either is
# listed as a default change too. A review does not run this workflow (a
# pull_request_review run would use the pull request's own copy):
# cmux-next-defaults-guard-review.yml re-runs this run, which reads the
# reviews afresh. A fork's review event cannot re-run it (read-only token):
# a maintainer re-runs the check, or the next push does.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, closed]
    branches: [feat-cmux-next]

permissions: {}

concurrency:
  # The merge receipt (closed) never waits behind or cancels a review's re-run.
  group: cmux-next-defaults-guard-${{ github.event.pull_request.number }}-${{ github.event.action == 'closed' && 'merged' || 'open' }}
  cancel-in-progress: ${{ github.event.action != 'closed' }}

env:
  # Temporary REST budget attribution: one gh-call line per GitHub API call (scripts/ci/api_call_log/env.sh, fetched at a fixed commit when the checkout has no copy).
  BASH_ENV: '$({ w="${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh"; t="${RUNNER_TEMP:-/nonexistent}/api-call-log-src"; if [ -f "$w" ]; then echo "$w"; elif [ -n "${RUNNER_TEMP:-}" ]; then if [ ! -f "$t/env.sh" ] && [ ! -e "$t.tried" ] && { [ "${RUNNER_OS:-}" = Linux ] || [ "${RUNNER_OS:-}" = macOS ]; } && [ "$(date -u +%Y%m%d%H)" -lt 2026112300 ]; then : > "$t.tried"; mkdir -p "$t.part" && for x in env.sh gh sitecustomize.py isolated.py; do curl -fsSL --max-time 5 -o "$t.part/$x" "https://raw.githubusercontent.com/manaflow-ai/cmux/27647ffd3ae838c63be28ca3e5883dcd68c34518/scripts/ci/api_call_log/$x" || break; done; [ -s "$t.part/isolated.py" ] && mv "$t.part" "$t"; fi; if [ -f "$t/env.sh" ]; then echo "$t/env.sh"; else echo unset BASH_ENV > "$t.off.sh" && echo "$t.off.sh"; fi; fi; } 2>/dev/null)'

jobs:
  defaults:
    name: defaults guard
    if: ${{ github.event.pull_request.base.ref == 'feat-cmux-next' && (github.event.action != 'closed' || github.event.pull_request.merged) }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.CI_PR_CONTROL_SKIP_FLEET != '1' && 'cmux-gcp-pr-control-jit-x64' || contains(fromJSON('["ubuntu-24.04","blacksmith-2vcpu-ubuntu-2404","blacksmith-4vcpu-ubuntu-2404","blacksmith-8vcpu-ubuntu-2404","cmux-gcp-secret-jit-x64"]'), vars.CI_TRUSTED_RUNNER) && vars.CI_TRUSTED_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }} # ephemeral-required: trusted pull-request-write token; CI_TRUSTED_RUNNER picks Blacksmith (default) or GitHub-hosted
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    env:
      # Every path the guard reads, at the merge base and at the head: both data checkouts take this
      # list, and the inputs step below skips the judge when the head changes none of them.
      DEFAULTS_DATA: |
        schemas/defaults
        plans/cmux-next/action-surfaces.json
        schemas/settings/settings-schema.json
        Packages/macOS/CmuxNext/Sources
        scripts/ci/defaults_guard.py
        .github/defaults-call-owners.json
        .github/workflows/cmux-next-defaults-guard.yml
        .github/workflows/cmux-next-defaults-guard-review.yml
    steps:
      - name: Check out the trusted guard (base)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
          persist-credentials: false
          # pr_status.py: the guard imports it to write its section of the PR status
          # comment (feat-cmux-next #28451). A base before that has no such file; the
          # pattern then matches nothing. receipt_grammar.py: the guard imports it to read a review
          # receipt (feat-cmux-next #36941), the same way. risk_tier.py: #36950 moved that grammar
          # into it, so a base at or after #36950 imports it, a base before it matches nothing.
          sparse-checkout: |
            scripts/ci/defaults_guard.py
            scripts/ci/pr_status.py
            scripts/ci/receipt_grammar.py
            scripts/ci/risk_tier.py
            .github/defaults-call-owners.json
          sparse-checkout-cone-mode: false

      - name: Find the merge base
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        # git, not the API: the compare call failed when the installation ran
        # out of quota (#23427). A treeless fetch of both tips (commits only,
        # about 3 s and 33 MiB) gives git merge-base the history it needs; the
        # API stays as the fallback. The fetch carries the job token (an
        # extraheader in the environment, never written to the repo's config or
        # argv): anonymous, it took about 90 s and failed on fsr-* runners, whose
        # defaults guard success p50 was 101 s (32 runs) against 13 s on the
        # cloud pool, and 9 runs cancelled at the 5-minute timeout (2026-11-22,
        # 11-15:30Z).
        # timeout 120 bounds a stall so the API fallback still runs in time.
        run: |
          history="$RUNNER_TEMP/merge-base.git"
          git init -q --bare "$history"
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          if GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader GIT_CONFIG_VALUE_0="$auth" \
            timeout 120 git -C "$history" fetch -q --filter=tree:0 --no-tags "https://github.com/$REPO" "$BASE_SHA" "$HEAD_SHA" \
            && merge_base="$(git -C "$history" merge-base "$BASE_SHA" "$HEAD_SHA")"; then
            :
          else
            echo "::warning::git could not find the merge base; asking the API"
            merge_base="$(gh api "repos/$REPO/compare/$BASE_SHA...$HEAD_SHA" --jq .merge_base_commit.sha)"
          fi
          echo "sha=$merge_base" >> "$GITHUB_OUTPUT"

      # The guard's defaults come only from DEFAULTS_DATA, so a head that changes none of those paths
      # since the merge base changes no default: the judge would list nothing and pass. About three in
      # four feat-cmux-next heads change none (42 of 166 merges, 13-19Z on 2026-11-21, touched them),
      # and the two data checkouts and the judge took about 110 of each run's 122 s. The names come from
      # the two commits' trees alone (a depth-1 blobless fetch, a few MiB), not the API, so no file-count
      # cap applies. Any failure here runs the judge, as before. The fetch carries the job token as the
      # merge-base step's does, for the same reason (anonymous fetches stalled on fsr-* runners).
      - name: Does the head change what the guard reads
        id: inputs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          MERGE_BASE: ${{ steps.base.outputs.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          trees="$RUNNER_TEMP/inputs.git"
          git init -q --bare "$trees"
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          if [ -n "$MERGE_BASE" ] \
            && GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader GIT_CONFIG_VALUE_0="$auth" \
            timeout 120 git -C "$trees" fetch -q --depth=1 --filter=blob:none --no-tags "https://github.com/$REPO" "$MERGE_BASE" "$HEAD_SHA" \
            && GIT_NO_LAZY_FETCH=1 git -C "$trees" diff-tree -r -z --no-renames --name-only "$MERGE_BASE" "$HEAD_SHA" > "$RUNNER_TEMP/changed.txt"; then
            touched="$(python3 -c 'import os, sys
          inputs = [line.strip() for line in os.environ["DEFAULTS_DATA"].splitlines() if line.strip()]
          names = [name for name in open(sys.argv[1], "rb").read().decode("utf-8", "surrogateescape").split("\0") if name]  # -z: unquoted, any byte
          hits = [n for n in names if any(n == p or n.startswith(p + "/") for p in inputs)]
          print("true" if hits else "false")
          print(f"{len(names)} changed paths, {len(hits)} the guard reads", file=sys.stderr)' "$RUNNER_TEMP/changed.txt")"
          else
            echo "::warning::could not list the head's changed paths; judging it in full"
            touched=true
          fi
          echo "touched=$touched" >> "$GITHUB_OUTPUT"
          if [ "$touched" = false ]; then
            echo "The head changes nothing the defaults guard reads since the merge base: no default changed." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Check out the merge base's defaults (data)
        if: ${{ steps.inputs.outputs.touched != 'false' }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ steps.base.outputs.sha }}
          path: .defaults/base
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: ${{ env.DEFAULTS_DATA }}
          sparse-checkout-cone-mode: false

      - name: Check out the head's defaults (data, never run)
        if: ${{ steps.inputs.outputs.touched != 'false' }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: .defaults/head
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: ${{ env.DEFAULTS_DATA }}
          sparse-checkout-cone-mode: false

      # A skipped judge would leave an earlier head's sticky comment naming an approver for a change
      # this head no longer has (a reverted default). The base's own guard rewrites that section to
      # "No defaults change at <head>", and writes nothing on a pull request that never had one.
      - name: Clear an earlier head's default changes
        if: ${{ steps.inputs.outputs.touched == 'false' && github.event.action != 'closed' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 -c 'import os, sys
          sys.path.insert(0, "scripts/ci")
          try:
              import defaults_guard as guard
              guard.post_comment(os.environ["REPO"], int(os.environ["PR"]), {}, guard.comment_body([], None, os.environ["HEAD_SHA"]), [])
          except Exception as error:  # a comment that cannot be written never fails the guard
              print(f"::warning title=Defaults comment not cleared::{error}")'

      - name: Judge the default changes
        if: ${{ steps.inputs.outputs.touched != 'false' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          python3 scripts/ci/defaults_guard.py check --base .defaults/base --head .defaults/head
          --head-sha "$HEAD_SHA" --repo "$REPO" --pr "$PR" --comment
