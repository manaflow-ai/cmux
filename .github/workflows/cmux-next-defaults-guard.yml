name: cmux-next defaults guard

# Fails a feat-cmux-next pull request that changes a default (an action's
# default keys, a setting's default, a Ghostty keybind cmux writes, a compiled
# feature flag) until a call owner other than its author approves its head
# (scripts/ci/defaults_guard.py; owners in .github/defaults-call-owners.json).
# Leo 2026-10-13: defaults changed without a call (#15382, #15398, #19788).
#
# Fast: no build. It sparse-checks-out only the guard's files of the merge base
# and the head (about 40 MiB of a 340 MiB tree) and reports within a minute.
# Every changed default is a warning annotation and a sticky comment that says
# who must approve; both stay after it passes, and the merge adds a receipt.
#
# Lives on main: GitHub takes a pull_request_target workflow from the default
# branch whatever the pull request's base, so the feat-cmux-next copy never ran
# (#23105 merged a new default with no call). The guard and the owners file are
# still the feat-cmux-next base's: both are checked out at the pull request's
# base commit below, never from main. This copy is the one that runs, so change
# it here; the feat-cmux-next copy keeps the file name the review re-run
# (cmux-next-defaults-guard-review.yml) looks this run up by.
#
# Trust: only pull_request_target runs this, so the workflow, the guard and
# the owners file are always the base's. The head is only read as data (JSON
# exports and Swift text); nothing from it runs, so a pull request can neither
# edit the owners file nor the guard to pass itself, and a change to either is
# listed as a default change too. A review does not run this workflow (a
# pull_request_review run would use the pull request's own copy):
# cmux-next-defaults-guard-review.yml re-runs this run, which reads the
# reviews afresh. A fork's review event cannot re-run it (read-only token):
# a maintainer re-runs the check, or the next push does.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, closed]
    branches: [feat-cmux-next]

permissions: {}

concurrency:
  # The merge receipt (closed) never waits behind or cancels a review's re-run.
  group: cmux-next-defaults-guard-${{ github.event.pull_request.number }}-${{ github.event.action == 'closed' && 'merged' || 'open' }}
  cancel-in-progress: ${{ github.event.action != 'closed' }}

jobs:
  defaults:
    name: defaults guard
    if: ${{ github.event.pull_request.base.ref == 'feat-cmux-next' && (github.event.action != 'closed' || github.event.pull_request.merged) }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || contains(fromJSON('["ubuntu-24.04","blacksmith-2vcpu-ubuntu-2404","blacksmith-4vcpu-ubuntu-2404"]'), vars.CI_TRUSTED_RUNNER) && vars.CI_TRUSTED_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }} # ephemeral-required: trusted pull-request-write token; CI_TRUSTED_RUNNER picks Blacksmith (default) or GitHub-hosted
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out the trusted guard (base)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            scripts/ci/defaults_guard.py
            .github/defaults-call-owners.json
          sparse-checkout-cone-mode: false

      - name: Find the merge base
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        # git, not the API: the compare call failed when the installation ran
        # out of quota (#23427). A treeless fetch of both tips (commits only,
        # about 3 s and 33 MiB) gives git merge-base the history it needs; the
        # API stays as the fallback.
        run: |
          history="$RUNNER_TEMP/merge-base.git"
          git init -q --bare "$history"
          if git -C "$history" fetch -q --filter=tree:0 --no-tags "https://github.com/$REPO" "$BASE_SHA" "$HEAD_SHA" \
            && merge_base="$(git -C "$history" merge-base "$BASE_SHA" "$HEAD_SHA")"; then
            :
          else
            echo "::warning::git could not find the merge base; asking the API"
            merge_base="$(gh api "repos/$REPO/compare/$BASE_SHA...$HEAD_SHA" --jq .merge_base_commit.sha)"
          fi
          echo "sha=$merge_base" >> "$GITHUB_OUTPUT"

      - name: Check out the merge base's defaults (data)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ steps.base.outputs.sha }}
          path: .defaults/base
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            schemas/defaults
            plans/cmux-next/action-surfaces.json
            schemas/settings/settings-schema.json
            Packages/macOS/CmuxNext/Sources
            scripts/ci/defaults_guard.py
            .github/defaults-call-owners.json
            .github/workflows/cmux-next-defaults-guard.yml
            .github/workflows/cmux-next-defaults-guard-review.yml
            Packages/macOS/CmuxNext/Sources/CmuxNextActions/KeyBindingDefaults.swift
          sparse-checkout-cone-mode: false

      - name: Check out the head's defaults (data, never run)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: .defaults/head
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            schemas/defaults
            plans/cmux-next/action-surfaces.json
            schemas/settings/settings-schema.json
            Packages/macOS/CmuxNext/Sources
            scripts/ci/defaults_guard.py
            .github/defaults-call-owners.json
            .github/workflows/cmux-next-defaults-guard.yml
            .github/workflows/cmux-next-defaults-guard-review.yml
            Packages/macOS/CmuxNext/Sources/CmuxNextActions/KeyBindingDefaults.swift
          sparse-checkout-cone-mode: false

      - name: Judge the default changes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          python3 scripts/ci/defaults_guard.py check --base .defaults/base --head .defaults/head
          --head-sha "$HEAD_SHA" --repo "$REPO" --pr "$PR" --comment
