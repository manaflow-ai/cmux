name: Merge-group policy checks

# "CLA Assistant" and "CLA policy guard" are required on main, and their own
# workflows judge a pull request's author and head through pull_request_target
# and issue_comment events. A pull request may not edit those workflows. A merge
# group holds only pull requests that already passed both, so this workflow
# reports the same check names for the queue's merge commit without running
# candidate code.
on:
  merge_group:

permissions: {}

jobs:
  cla-assistant:
    name: CLA Assistant
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: echo "Passed on every pull request in this merge group."

  cla-policy-guard:
    name: CLA policy guard
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: echo "Passed on every pull request in this merge group."
