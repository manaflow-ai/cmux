name: CI status fallback

on:
  # CI now runs its cheap router for every pull request, so this fallback must
  # never manufacture a green ci-status for a source change that skipped CI.
  # Keep it dispatchable for operators diagnosing a missing check.
  workflow_dispatch: {}

permissions: {}

jobs:
  ci-status:
    name: CI diagnostic
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 5
    steps:
      - name: Report manual diagnostic status
        run: |
          echo "This operator-triggered diagnostic does not satisfy ci-status."
          echo "Inspect the CI workflow to diagnose the missing required check."
