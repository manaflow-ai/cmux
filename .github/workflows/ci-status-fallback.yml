name: CI status fallback

on:
  # CI now runs its cheap router for every pull request, so this fallback must
  # never manufacture a green ci-status for a source change that skipped CI.
  # Keep it dispatchable for operators diagnosing a missing check.
  workflow_dispatch: {}

permissions: {}

jobs:
  ci-status:
    name: ci-status
    runs-on: ${{ vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 5
    steps:
      - name: Report filtered CI as successful
        run: |
          echo "CI workflow was skipped because no routed CI trigger path changed."
          echo "No CI area was selected for this pull request; ci-status is satisfied."
