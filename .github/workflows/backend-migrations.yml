# Trusted pre-merge migrations for PlanetScale `cmux-next` (skills/cmux-backend-migrations).
#
# pull_request_target: this file and the tooling (backend/db/migrate.ts, its lockfile)
# always come from the BASE branch. From the PR head we only read the SQL text under
# backend/db/migrations; no head code is installed or executed, so a PR cannot change the
# gate, the apply rules, or reach the database secrets except through reviewed SQL.
#
#   plan      list changed files (GitHub API), extract the head's migration files, guard:
#             append-only, numbers above the base, contract only alone and only into main,
#             parsed-SQL lint.
#   apply     adding the label `backend:apply-migrations` (same-repo PRs) consumes it and
#             applies to staging, then production; a later push never applies without a new label.
#   gate      `backend migrations applied` (required on feat-cmux-next and main): passes at
#             once when nothing under backend/db/migrations changed; otherwise the tree's
#             migrations must be exactly what staging and production have. In a merge
#             group it checks nothing (the queue runs PR-controlled workflow content, so it
#             gets no secrets; each queued PR already passed this gate).

name: backend-migrations

on:
  # Only PRs into main and feat-cmux-next: the tooling comes from the PR base branch, so a PR
  # into any other branch (whose tooling its author controls) must never run here.
  pull_request_target:
    # edited: a base-branch change (for example main -> feat-cmux-next) re-runs the gate. A title or
    # body edit into feat-cmux-next takes no runner. labeled: into feat-cmux-next only
    # `backend:apply-migrations` and `full-ci` change anything; every other label takes no runner.
    # GitHub runs this file (main's) for PRs into feat-cmux-next too, so feat-cmux-next's copy of these
    # skips never ran: a review bot's label queued a second plan behind the push's on the one-job
    # gate pool, about 10 more minutes on every iOS head (cmux#47511 ace3ada7: runs 44999637100 and
    # 44999671870). Into main every label and edit still plans and gates (#13871).
    types: [opened, synchronize, reopened, labeled, edited]
    branches: [main, feat-cmux-next]
  merge_group:
    branches: [main, feat-cmux-next]

permissions:
  contents: read

concurrency:
  # A title or body edit or an ignored label into feat-cmux-next gets a group of its own (its jobs all
  # skip), so it never queues behind or ahead of the push's run.
  group: backend-migrations-${{ github.event.pull_request.number || github.event.merge_group.head_sha }}${{ github.event_name == 'pull_request_target' && github.event.action == 'edited' && !github.event.changes.base && github.event.pull_request.base.ref == 'feat-cmux-next' && format('-edit-{0}', github.run_id) || '' }}${{ github.event_name == 'pull_request_target' && github.event.pull_request.base.ref == 'feat-cmux-next' && (github.event.action == 'labeled' || github.event.action == 'unlabeled') && !contains(fromJSON('["backend:apply-migrations","full-ci"]'), github.event.label.name) && format('-label-{0}', github.run_id) || '' }}
  cancel-in-progress: false

env:
  # Temporary REST budget attribution until 2026-11-22 00:00 UTC: one gh-call line per GitHub API call
  # (scripts/ci/api_call_log/env.sh). GitHub runs this file from main, and it had no attribution.
  BASH_ENV: '$({ w="${GITHUB_WORKSPACE:-/nonexistent}/scripts/ci/api_call_log/env.sh"; t="${RUNNER_TEMP:-/nonexistent}/api-call-log-src"; if [ -f "$w" ]; then echo "$w"; elif [ -n "${RUNNER_TEMP:-}" ]; then if [ ! -f "$t/env.sh" ] && [ ! -e "$t.tried" ] && { [ "${RUNNER_OS:-}" = Linux ] || [ "${RUNNER_OS:-}" = macOS ]; } && [ "$(date -u +%Y%m%d%H)" -lt 2026112300 ]; then : > "$t.tried"; mkdir -p "$t.part" && for x in env.sh gh sitecustomize.py isolated.py; do curl -fsSL --max-time 5 -o "$t.part/$x" "https://raw.githubusercontent.com/manaflow-ai/cmux/27647ffd3ae838c63be28ca3e5883dcd68c34518/scripts/ci/api_call_log/$x" || break; done; [ -s "$t.part/isolated.py" ] && mv "$t.part" "$t"; fi; if [ -f "$t/env.sh" ]; then echo "$t/env.sh"; else echo unset BASH_ENV > "$t.off.sh" && echo "$t.off.sh"; fi; fi; } 2>/dev/null)'

jobs:
  # Every job here leads with cmux-gcp-gate-jit-x64, the required gates' reserved label: one-job VMs that only
  # the jobs behind main's required checks name, so "backend migrations applied" never queues behind the PR backlog
  # (tests/test_ci_required_gate_label.py). vars.CI_GATE_SKIP_FLEET=1 puts them back on CI_TRUSTED_RUNNER.
  plan:
    # A fix-cause:* label on a closed pull request starts no job: plan skips, and gate, which runs
    # always(), skips too (tests/test_ci_fix_cause_labels_start_no_jobs.py). An open pull request
    # still plans and gates on every label it gets.
    if: ${{ !(github.event.pull_request.state == 'closed' && (github.event.action == 'labeled' || github.event.action == 'unlabeled') && startsWith(github.event.label.name, 'fix-cause:')) && !(github.event_name == 'pull_request_target' && github.event.action == 'edited' && !github.event.changes.base && github.event.pull_request.base.ref == 'feat-cmux-next') && !(github.event_name == 'pull_request_target' && github.event.pull_request.base.ref == 'feat-cmux-next' && (github.event.action == 'labeled' || github.event.action == 'unlabeled') && !contains(fromJSON('["backend:apply-migrations","full-ci"]'), github.event.label.name)) }}
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || 'cmux-gcp-gate-jit-x64' }} # ephemeral-required: trusted tokens; the required-gate JIT label first
    # Recent runs: 20s median, 51s max (GitHub API reads and a SQL lint). The ceiling fits the worst
    # retried path: probe 3 x 60 s, base checkout 3 x 240 s plus its 180 s blob read, head fetch and blob
    # read 3 x 90 s each, plus 20 s backoff per retried read (about 28 minutes); a healthy run never comes near it.
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    outputs:
      migrations: ${{ steps.same-tree.outputs.same == 'true' && 'false' || steps.files.outputs.migrations }}
    steps:
      # Most heads never touch migrations, and the full base checkout below took 184 s at p50 on the gate
      # JIT pool for every PR head into main (11-20 13:00Z..11-21 11:00Z, controller timing feed: about
      # 3 runner-minutes a head). A treeless one-commit fetch of the base and the head answers "same
      # backend/db/migrations tree" in seconds; only when both trees resolve and match does the plan stop
      # here. Anything else (a fetch error, a missing directory, a different tree) falls through to the full
      # plan below. feat-cmux-next's copy has carried this probe since #48661.
      - name: Same migrations tree as the base?
        id: same-tree
        if: github.event_name == 'pull_request_target'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          git init -q probe && cd probe || exit 0
          git remote add origin "https://github.com/$REPO.git"
          # A dropped or stalled transfer from github.com ("Operation too slow", a reset, a 5xx, a hang) is
          # tried again: 3 tries, 5 s then 15 s apart, each bounded. A refusal (a missing commit, 401/403/404)
          # stops on its first try. The error names the tries. Job 139712437101 (cmux#55995, runner e1c-0251)
          # failed on one "Operation too slow"; handbook transient-transport-failure-as-hard-error.
          # The low-speed abort is 1 B/s for 60 s, never higher: GitHub sends next to nothing while it builds
          # the shallow, filtered pack of this 3 GB repository (p50 66 s, p95 286 s), so 1000 B/s for 30 s cut
          # healthy fetches mid-build. The wall clock (timeout LIMIT) bounds a real hang.
          git_retry() {
            local what=$1 limit=$2 try=1 tries=3 err status last; shift 2
            while :; do
              if err=$(GIT_TERMINAL_PROMPT=0 timeout "$limit" git -c http.lowSpeedLimit=1 -c http.lowSpeedTime=60 "$@" 2>&1 >/dev/null); then return 0; else status=$?; fi
              [ "$status" -ne 124 ] || err="${err:+$err
          }hung past $limit s"
              [ -z "$err" ] || printf '%s\n' "$err" >&2
              last=$(printf '%s\n' "$err" | grep -v '^[[:space:]]*$' | tail -n 1 || true)
              if printf '%s\n' "$err" | grep -qiE 'repository not found|not our ref|couldn.t find remote ref|authentication failed|could not read (username|password)|permission denied|returned error: (401|403|404)|invalid refspec|unknown revision|not a valid object name|bad revision|not a tree object|did not match any'; then
                echo "::error::$what refused on try $try of $tries, not tried again (a refusal, not a transport failure; runner ${RUNNER_NAME:-unknown}): $last"; return 1
              fi
              if [ "$try" -ge "$tries" ]; then
                echo "::error::$what failed on all $tries tries ($limit s each) on runner ${RUNNER_NAME:-unknown}; the last: $last"; return 1
              fi
              echo "::warning::$what failed on try $try of $tries, trying again: $last"
              sleep $((try == 1 ? 5 : 15)); try=$((try + 1))
            done
          }
          # A pool runner's git mirror (fetched each minute: branch tips, every PR's head and merge) holds both
          # commits nearly always; borrowing its objects answers with no network. GitHub's shallow, filtered
          # fetch of this repository is what timed out here (60 s, runs 45772484255 and 45744047896).
          mirror="${CMUX_GIT_MIRROR:-/var/lib/cmux-git/cmux.git}"
          inmirror() { [ -e "$mirror/cmux-ready" ] && git -c safe.directory="$mirror" --git-dir="$mirror" cat-file -e "$1^{commit}" 2>/dev/null; }
          if inmirror "$BASE_SHA" && inmirror "$HEAD_SHA"; then
            echo "$mirror/objects" > .git/objects/info/alternates
            echo "base and head read from the runner's git mirror"
          elif ! git_retry "treeless fetch of the base and the head" 60 -c protocol.version=2 fetch -q --no-tags --depth=1 --filter=tree:0 origin "$BASE_SHA" "$HEAD_SHA"; then
            echo "treeless fetch failed: full plan"; exit 0
          fi
          base_tree=$(GIT_TERMINAL_PROMPT=0 timeout 60 git rev-parse --verify --quiet "$BASE_SHA:backend/db/migrations") || base_tree=""
          head_tree=$(GIT_TERMINAL_PROMPT=0 timeout 60 git rev-parse --verify --quiet "$HEAD_SHA:backend/db/migrations") || head_tree=""
          # Absent on both sides is "no migration change" too (main has no backend/db/migrations): an
          # ls-tree that succeeds and lists nothing proves the path is absent, where an empty rev-parse may
          # also be a tree the lazy fetch could not read. Either side having the path still plans in full.
          absent() { local out; out=$(GIT_TERMINAL_PROMPT=0 timeout 60 git ls-tree "$1" backend/db/migrations) && [ -z "$out" ]; }
          if [ -n "$base_tree" ] && [ "$base_tree" = "$head_tree" ]; then
            echo "same=true" >> "$GITHUB_OUTPUT"
            echo "no migration changes (backend/db/migrations is $base_tree at the base and the head)"
          elif [ -z "$base_tree" ] && [ -z "$head_tree" ] && absent "$BASE_SHA" && absent "$HEAD_SHA"; then
            echo "same=true" >> "$GITHUB_OUTPUT"
            echo "no migration changes (no backend/db/migrations at the base or the head)"
          else
            echo "base ${base_tree:-unresolved}, head ${head_tree:-unresolved}: full plan"
          fi
      # Only backend/ is read from the base (migrate.ts, its lockfile, the migrations). On a pool runner the
      # base comes from the runner's git mirror (/var/lib/cmux-git/cmux.git, fetched each minute: branch tips
      # and every PR's head and merge), borrowed through objects/info/alternates: no network. Elsewhere, or
      # when the mirror lacks the commit, it is a blobless one-commit fetch from github.com. That fetch is
      # GitHub building a shallow, filtered pack of a 3 GB repository: p50 66 s, p95 286 s on the pool
      # (2026-11-24, pool.sh's mirror notes), so a 60 s bound failed both attempts on PRs 56905, 53402 and
      # 57565 on 2026-11-26 while the runner's mirror already held the base. Each network attempt is bounded
      # with a low-speed abort, tried three times with backoff (git_retry, as every read below), and a failure names its cause.
      # Freestyle guests (fsr, runner group cmux-freestyle-linux) take this job's gate label too and have no mirror: a
      # 1.3-9 MB/s link and a git store baked once a day. There the 60 s actions/checkout timed out twice on jobs
      # 139897638176, 139897631159, 139898168920, 139897472857 and 139898135049 (2026-11-26 12:12-12:15Z), each a false
      # red of plan and of `backend migrations applied`, so each try gets 240 s and the blob read 180 s.
      - name: Checkout base (trusted tooling)
        id: checkout
        if: steps.same-tree.outputs.same != 'true'
        # 3 x 240 s fetch, 20 s backoff, 180 s blob read: 920 s.
        timeout-minutes: 17
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          # A dropped or stalled transfer from github.com ("Operation too slow", a reset, a 5xx, a hang) is
          # tried again: 3 tries, 5 s then 15 s apart, each bounded. A refusal (a missing commit, 401/403/404)
          # stops on its first try. The error names the tries. Job 139712437101 (cmux#55995, runner e1c-0251)
          # failed on one "Operation too slow"; handbook transient-transport-failure-as-hard-error.
          # The low-speed abort is 1 B/s for 60 s, never higher: GitHub sends next to nothing while it builds
          # the shallow, filtered pack of this 3 GB repository (p50 66 s, p95 286 s), so 1000 B/s for 30 s cut
          # healthy fetches mid-build. The wall clock (timeout LIMIT) bounds a real hang.
          git_retry() {
            local what=$1 limit=$2 try=1 tries=3 err status last; shift 2
            while :; do
              if err=$(GIT_TERMINAL_PROMPT=0 timeout "$limit" git -c http.lowSpeedLimit=1 -c http.lowSpeedTime=60 "$@" 2>&1 >/dev/null); then return 0; else status=$?; fi
              [ "$status" -ne 124 ] || err="${err:+$err
          }hung past $limit s"
              [ -z "$err" ] || printf '%s\n' "$err" >&2
              last=$(printf '%s\n' "$err" | grep -v '^[[:space:]]*$' | tail -n 1 || true)
              if printf '%s\n' "$err" | grep -qiE 'repository not found|not our ref|couldn.t find remote ref|authentication failed|could not read (username|password)|permission denied|returned error: (401|403|404)|invalid refspec|unknown revision|not a valid object name|bad revision|not a tree object|did not match any'; then
                echo "::error::$what refused on try $try of $tries, not tried again (a refusal, not a transport failure; runner ${RUNNER_NAME:-unknown}): $last"; return 1
              fi
              if [ "$try" -ge "$tries" ]; then
                echo "::error::$what failed on all $tries tries ($limit s each) on runner ${RUNNER_NAME:-unknown}; the last: $last"; return 1
              fi
              echo "::warning::$what failed on try $try of $tries, trying again: $last"
              sleep $((try == 1 ? 5 : 15)); try=$((try + 1))
            done
          }
          mirror="${CMUX_GIT_MIRROR:-/var/lib/cmux-git/cmux.git}"
          rm -rf trusted && git init -q trusted && cd trusted || { echo "::error::could not create trusted/"; exit 1; }
          git remote add origin "https://github.com/$REPO.git"
          git config gc.auto 0
          how=""
          if [ -e "$mirror/cmux-ready" ] && git -c safe.directory="$mirror" --git-dir="$mirror" cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo "$mirror/objects" > .git/objects/info/alternates
            how="the runner's git mirror, no network"
          else
            if git_retry "base fetch of $BASE_SHA from github.com" 240 -c protocol.version=2 fetch -q --no-tags --filter=blob:none --depth=1 origin "+$BASE_SHA:refs/remotes/origin/base"; then
              how="github.com"
            else
              echo "::error::base fetch of $BASE_SHA from github.com failed (124 is the 240 s bound) on runner ${RUNNER_NAME:-unknown}, and the runner has no git mirror holding it: a fetch problem on this runner, not the PR"
              exit 1
            fi
          fi
          git sparse-checkout set --cone backend || { echo "::error::sparse-checkout of backend/ failed"; exit 1; }
          # A blobless base fetches backend/'s blobs here: bound it too.
          if ! GIT_TERMINAL_PROMPT=0 timeout 180 git -c advice.detachedHead=false checkout -q --detach "$BASE_SHA"; then
            echo "::error::checking out backend/ at $BASE_SHA failed or hung past 180 s (from $how) on runner ${RUNNER_NAME:-unknown}"
            exit 1
          fi
          echo "base $BASE_SHA backend/ from $how"
      # The file list, when the migrations tree differs, is read on the manaflow-glaeda-route
      # App's own budget (GITHUB_TOKEN's, which every workflow shares, ran out on 2026-10-21);
      # a failed mint or a refused read uses GITHUB_TOKEN. Pull requests only: a merge group
      # runs the queued commit's copy of this file.
      # Most pull requests change no migration and the step below decides that from git
      # alone, so the glaeda-route token is minted only for a head whose
      # backend/db/migrations tree differs from the base (the only case that lists files
      # through the API). A mint spends the shared installation budget even when unused.
      - name: Compare the migration trees
        id: trees
        if: github.event_name == 'pull_request_target' && steps.same-tree.outputs.same != 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # A dropped or stalled transfer from github.com ("Operation too slow", a reset, a 5xx, a hang) is
          # tried again: 3 tries, 5 s then 15 s apart, each bounded. A refusal (a missing commit, 401/403/404)
          # stops on its first try. The error names the tries. Job 139712437101 (cmux#55995, runner e1c-0251)
          # failed on one "Operation too slow"; handbook transient-transport-failure-as-hard-error.
          # The low-speed abort is 1 B/s for 60 s, never higher: GitHub sends next to nothing while it builds
          # the shallow, filtered pack of this 3 GB repository (p50 66 s, p95 286 s), so 1000 B/s for 30 s cut
          # healthy fetches mid-build. The wall clock (timeout LIMIT) bounds a real hang.
          git_retry() {
            local what=$1 limit=$2 try=1 tries=3 err status last; shift 2
            while :; do
              if err=$(GIT_TERMINAL_PROMPT=0 timeout "$limit" git -c http.lowSpeedLimit=1 -c http.lowSpeedTime=60 "$@" 2>&1 >/dev/null); then return 0; else status=$?; fi
              [ "$status" -ne 124 ] || err="${err:+$err
          }hung past $limit s"
              [ -z "$err" ] || printf '%s\n' "$err" >&2
              last=$(printf '%s\n' "$err" | grep -v '^[[:space:]]*$' | tail -n 1 || true)
              if printf '%s\n' "$err" | grep -qiE 'repository not found|not our ref|couldn.t find remote ref|authentication failed|could not read (username|password)|permission denied|returned error: (401|403|404)|invalid refspec|unknown revision|not a valid object name|bad revision|not a tree object|did not match any'; then
                echo "::error::$what refused on try $try of $tries, not tried again (a refusal, not a transport failure; runner ${RUNNER_NAME:-unknown}): $last"; return 1
              fi
              if [ "$try" -ge "$tries" ]; then
                echo "::error::$what failed on all $tries tries ($limit s each) on runner ${RUNNER_NAME:-unknown}; the last: $last"; return 1
              fi
              echo "::warning::$what failed on try $try of $tries, trying again: $last"
              sleep $((try == 1 ? 5 : 15)); try=$((try + 1))
            done
          }
          git_retry "fetch of the head $HEAD_SHA" 90 -C trusted fetch --quiet --no-tags --depth=1 origin "+$HEAD_SHA:refs/remotes/origin/head" || exit 1
          base_tree=$(git -C trusted rev-parse --verify --quiet "$BASE_SHA:backend/db/migrations" || echo none)
          head_tree=$(git -C trusted rev-parse --verify --quiet "$HEAD_SHA:backend/db/migrations" || echo none)
          if [ "$base_tree" = "$head_tree" ]; then echo "same=true" >> "$GITHUB_OUTPUT"; else echo "same=false" >> "$GITHUB_OUTPUT"; fi
      - name: Check out the App token spread action
        # Why: .github/actions/app-token-spread (mint on both Apps, spend the fuller one).
        if: vars.GLAEDA_ROUTE_APP_ID != '' && github.event_name == 'pull_request_target' && steps.trees.outputs.same == 'false'
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .app-token-spread
          sparse-checkout: .github/actions/app-token-spread
          persist-credentials: false

      - name: Mint the glaeda-route token
        id: glaeda-token
        if: vars.GLAEDA_ROUTE_APP_ID != '' && github.event_name == 'pull_request_target' && steps.trees.outputs.same == 'false'
        continue-on-error: true
        timeout-minutes: 1
        uses: ./.app-token-spread/.github/actions/app-token-spread
        with:
          route-app-id: ${{ vars.GLAEDA_ROUTE_APP_ID }}
          route-private-key: ${{ secrets.GLAEDA_ROUTE_APP_KEY }}
          bot-app-id: ${{ vars.CMUX_BOT_APP_ID }}
          bot-private-key: ${{ secrets.CMUX_BOT_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-pull-requests: read
          skip-token-revoke: true
      - name: Changed files and head migrations
        id: files
        if: steps.same-tree.outputs.same != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          READ_TOKEN: ${{ steps.glaeda-token.outputs.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          REPO: ${{ github.repository }}
          BASE_REF: ${{ github.event.pull_request.base.ref || github.event.merge_group.base_ref }}
        run: |
          set -euo pipefail
          # A dropped or stalled transfer from github.com ("Operation too slow", a reset, a 5xx, a hang) is
          # tried again: 3 tries, 5 s then 15 s apart, each bounded. A refusal (a missing commit, 401/403/404)
          # stops on its first try. The error names the tries. Job 139712437101 (cmux#55995, runner e1c-0251)
          # failed on one "Operation too slow"; handbook transient-transport-failure-as-hard-error.
          # The low-speed abort is 1 B/s for 60 s, never higher: GitHub sends next to nothing while it builds
          # the shallow, filtered pack of this 3 GB repository (p50 66 s, p95 286 s), so 1000 B/s for 30 s cut
          # healthy fetches mid-build. The wall clock (timeout LIMIT) bounds a real hang.
          git_retry() {
            local what=$1 limit=$2 try=1 tries=3 err status last; shift 2
            while :; do
              if err=$(GIT_TERMINAL_PROMPT=0 timeout "$limit" git -c http.lowSpeedLimit=1 -c http.lowSpeedTime=60 "$@" 2>&1 >/dev/null); then return 0; else status=$?; fi
              [ "$status" -ne 124 ] || err="${err:+$err
          }hung past $limit s"
              [ -z "$err" ] || printf '%s\n' "$err" >&2
              last=$(printf '%s\n' "$err" | grep -v '^[[:space:]]*$' | tail -n 1 || true)
              if printf '%s\n' "$err" | grep -qiE 'repository not found|not our ref|couldn.t find remote ref|authentication failed|could not read (username|password)|permission denied|returned error: (401|403|404)|invalid refspec|unknown revision|not a valid object name|bad revision|not a tree object|did not match any'; then
                echo "::error::$what refused on try $try of $tries, not tried again (a refusal, not a transport failure; runner ${RUNNER_NAME:-unknown}): $last"; return 1
              fi
              if [ "$try" -ge "$tries" ]; then
                echo "::error::$what failed on all $tries tries ($limit s each) on runner ${RUNNER_NAME:-unknown}; the last: $last"; return 1
              fi
              echo "::warning::$what failed on try $try of $tries, trying again: $last"
              sleep $((try == 1 ? 5 : 15)); try=$((try + 1))
            done
          }
          # The trees step above fetched the head already; fetch only a commit this clone lacks.
          fetch_head() { git -C trusted cat-file -e "$HEAD_SHA^{commit}" 2>/dev/null || git_retry "fetch of the head $HEAD_SHA" 90 -C trusted fetch --quiet --no-tags --depth=1 origin "+$HEAD_SHA:refs/remotes/origin/head"; }
          case "$BASE_REF" in refs/heads/main|refs/heads/feat-cmux-next|main|feat-cmux-next) ;; *) echo "::error::unexpected base branch"; exit 1 ;; esac
          if [ "$EVENT" = pull_request_target ]; then
            # Most PRs never touch migrations: decide that from git before using the API. The
            # installation's API quota ran out under load and failed the plan on UI PRs (#17602).
            # The same backend/db/migrations tree as the base means no migration change; a
            # different one (the PR's change, or a base move it has not merged) is listed below.
            fetch_head || exit 1
            base_tree=$(git -C trusted rev-parse --verify --quiet "$BASE_SHA:backend/db/migrations" || echo none)
            head_tree=$(git -C trusted rev-parse --verify --quiet "$HEAD_SHA:backend/db/migrations" || echo none)
            if [ "$base_tree" = "$head_tree" ]; then
              echo "migrations=false" >> "$GITHUB_OUTPUT"; echo "no migration changes (backend/db/migrations matches the base)"; exit 0
            fi
            files_jq='.[] | "\(.status)\t\(.filename)\t\(.previous_filename // "")"'
            if [ -z "${READ_TOKEN:-}" ] || ! GH_TOKEN="$READ_TOKEN" gh api --paginate "repos/$REPO/pulls/$PR/files?per_page=100" --jq "$files_jq" > changes.tsv; then
              gh api --paginate "repos/$REPO/pulls/$PR/files?per_page=100" --jq "$files_jq" > changes.tsv
            fi
          else
            gh api "repos/$REPO/compare/$BASE_SHA...$HEAD_SHA" --jq '.files[] | "\(.status)\t\(.filename)\t\(.previous_filename // "")"' > changes.tsv
          fi
          # The files API stops at 3000 (compare at 300): a list that long may hide migrations.
          if [ "$EVENT" = pull_request_target ] && [ "$(wc -l < changes.tsv)" -ge 3000 ]; then echo "::error::change too large to inspect for migrations; split it"; exit 1; fi
          touched=$(awk -F'\t' '$2 ~ /^backend\/db\/migrations\// || $3 ~ /^backend\/db\/migrations\//' changes.tsv)
          if [ -n "$touched" ]; then
            echo "migrations=true" >> "$GITHUB_OUTPUT"
          else
            echo "migrations=false" >> "$GITHUB_OUTPUT"; echo "no migration changes"; exit 0
          fi
          # Head migration files only: fetched as blobs, never checked out or executed.
          mkdir -p head-migrations
          fetch_head || exit 1
          # The base checkout is blobless, so archive fetches the head's migration blobs lazily: bound and retry it too.
          git_retry "reading the head's migrations ($HEAD_SHA)" 90 -C trusted archive -o "$PWD/head-migrations.tar" "$HEAD_SHA" backend/db/migrations || exit 1
          tar -x -C head-migrations --strip-components=3 -f head-migrations.tar && rm -f head-migrations.tar
          # Data only: flat regular files with migration names. No symlinks, devices or subdirectories,
          # so no later job can be made to read anything outside these SQL texts.
          odd=$(find head-migrations -mindepth 1 \( ! -type f -o -path 'head-migrations/*/*' -o -name '.*' \) -print -quit)
          if [ -n "$odd" ]; then echo "::error::backend/db/migrations may contain only regular .sql files"; exit 1; fi
          for f in head-migrations/*; do
            [ -e "$f" ] || continue
            case "$(basename "$f")" in [0-9][0-9][0-9][0-9]_*.sql) ;; *) echo "::error::unexpected file name in backend/db/migrations"; exit 1 ;; esac
            if ! basename "$f" | grep -qE '^[0-9]{4}_[a-z0-9_]+\.sql$'; then echo "::error::unexpected file name in backend/db/migrations"; exit 1; fi
          done
          ls head-migrations
      # Each queued PR already passed this guard; a merge group compares several PRs at once.
      - name: Guard (append-only, numbering, contract rules)
        if: steps.files.outputs.migrations == 'true' && github.event_name == 'pull_request_target'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref || github.event.merge_group.base_ref }}
        run: |
          set -euo pipefail
          bad=$(awk -F'\t' '($2 ~ /^backend\/db\/migrations\// || $3 ~ /^backend\/db\/migrations\//) && $1 != "added"' changes.tsv)
          if [ -n "$bad" ]; then echo "::error::migrations are append-only; changed: $bad"; exit 1; fi
          base_max=0
          for m in trusted/backend/db/migrations/[0-9][0-9][0-9][0-9]_*.sql; do
            [ -e "$m" ] || continue
            n=$(basename "$m"); n=$((10#${n:0:4})); [ "$n" -gt "$base_max" ] && base_max=$n
          done
          contract=""
          while IFS= read -r f; do
            n=$(basename "$f" | grep -oE '^[0-9]{4}' || echo 0000)
            if [ $((10#$n)) -le "$base_max" ]; then echo "::error::$f: number must be above the base's highest ($base_max); renumber after merging the base"; exit 1; fi
            if grep -qE '^--[[:space:]]*phase:[[:space:]]*contract' "head-migrations/$(basename "$f")"; then contract="$contract $f"; fi
          done < <(awk -F'\t' '$2 ~ /^backend\/db\/migrations\// {print $2}' changes.tsv)
          if [ -n "$contract" ]; then
            ref="${BASE_REF#refs/heads/}"
            if [ "$ref" != main ]; then echo "::error::contract migration(s)$contract: production runs main, so contract migrations go in a PR into main"; exit 1; fi
            others=$(awk -F'\t' '$2 !~ /^backend\/db\/migrations\//' changes.tsv)
            if [ -n "$others" ]; then echo "::error::contract migration(s)$contract must be alone in their PR; other files: $others"; exit 1; fi
          fi
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: steps.files.outputs.migrations == 'true'
        with:
          no-cache: ${{ !(github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && github.event_name != 'merge_group' && contains(fromJSON('["refs/heads/main","refs/heads/feat-cmux-next","refs/heads/nightly-next"]'), github.ref)) }}
          bun-version: "1.4.2"
      - name: Lint head SQL with the base's parser rules
        if: steps.files.outputs.migrations == 'true'
        run: |
          (cd trusted/backend && bun install --frozen-lockfile)
          (cd trusted/backend/db && bun migrate.ts --lint --dir "$GITHUB_WORKSPACE/head-migrations")
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.files.outputs.migrations == 'true'
        with:
          name: head-migrations
          path: head-migrations
          retention-days: 7

  apply-staging:
    needs: plan
    # Only the act of labeling applies (never a later push with the label still present), and
    # the label is removed first, so every apply follows a fresh label on the current head.
    if: >-
      needs.plan.outputs.migrations == 'true' && github.event_name == 'pull_request_target' &&
      github.event.action == 'labeled' && github.event.label.name == 'backend:apply-migrations' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || 'cmux-gcp-gate-jit-x64' }} # ephemeral-required: trusted tokens; the required-gate JIT label first
    # Real migrations: generous so a slow apply is never cut off mid-migration.
    timeout-minutes: 30
    environment: cmux-next-staging
    steps:
      - name: Consume the apply label
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: gh api -X DELETE "repos/$REPO/issues/$PR/labels/backend:apply-migrations" || true
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: head-migrations
          path: head-migrations
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          no-cache: ${{ !(github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && github.event_name != 'merge_group' && contains(fromJSON('["refs/heads/main","refs/heads/feat-cmux-next","refs/heads/nightly-next"]'), github.ref)) }}
          bun-version: "1.4.2"
      - name: Apply to cmux-next/staging
        env:
          CMUX_NEXT_PG_MIGRATOR_URL: ${{ secrets.CMUX_NEXT_PG_MIGRATOR_URL }}
        run: |
          (cd trusted/backend && bun install --frozen-lockfile)
          cd trusted/backend/db
          bun migrate.ts --env staging --dir "$GITHUB_WORKSPACE/head-migrations"
          bun migrate.ts --env staging --dir "$GITHUB_WORKSPACE/head-migrations" --verify

  apply-production:
    needs: apply-staging
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || 'cmux-gcp-gate-jit-x64' }} # ephemeral-required: trusted tokens; the required-gate JIT label first
    # Real migrations: generous so a slow apply is never cut off mid-migration.
    timeout-minutes: 30
    environment: cmux-next-production
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: head-migrations
          path: head-migrations
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          no-cache: ${{ !(github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && github.event_name != 'merge_group' && contains(fromJSON('["refs/heads/main","refs/heads/feat-cmux-next","refs/heads/nightly-next"]'), github.ref)) }}
          bun-version: "1.4.2"
      # Expand migrations are additive (parsed-SQL lint), so the code deployed from main keeps
      # working; contract migrations only come from PRs into main that contain nothing else.
      - name: Apply to cmux-next/main (production)
        env:
          CMUX_NEXT_PG_MIGRATOR_URL: ${{ secrets.CMUX_NEXT_PG_MIGRATOR_URL }}
        run: |
          (cd trusted/backend && bun install --frozen-lockfile)
          cd trusted/backend/db
          bun migrate.ts --env production --confirm-production --dir "$GITHUB_WORKSPACE/head-migrations"
          bun migrate.ts --env production --dir "$GITHUB_WORKSPACE/head-migrations" --verify

  gate:
    # Real events always start the gate VM so this expression name can publish `backend migrations applied`
    # when there are no migration changes. Ignored edits and labels, and closed fix-cause labels, still skip
    # and publish their alternate names. A literal name would make those skips look successful and mask an
    # earlier failed gate.
    name: ${{ github.event_name == 'pull_request_target' && github.event.action == 'edited' && !github.event.changes.base && github.event.pull_request.base.ref == 'feat-cmux-next' && 'backend migrations metadata edit (ignored)' || github.event_name == 'pull_request_target' && github.event.pull_request.base.ref == 'feat-cmux-next' && (github.event.action == 'labeled' || github.event.action == 'unlabeled') && !contains(fromJSON('["backend:apply-migrations","full-ci"]'), github.event.label.name) && 'backend migrations label (ignored)' || 'backend migrations applied' }}
    needs: [plan, apply-production]
    # This adds about 25 s on each real event, keeping the required check answerable without masking failures.
    if: always() && !(github.event.pull_request.state == 'closed' && (github.event.action == 'labeled' || github.event.action == 'unlabeled') && startsWith(github.event.label.name, 'fix-cause:')) && !(github.event_name == 'pull_request_target' && github.event.action == 'edited' && !github.event.changes.base && github.event.pull_request.base.ref == 'feat-cmux-next') && !(github.event_name == 'pull_request_target' && github.event.pull_request.base.ref == 'feat-cmux-next' && (github.event.action == 'labeled' || github.event.action == 'unlabeled') && !contains(fromJSON('["backend:apply-migrations","full-ci"]'), github.event.label.name)) && !(needs.plan.result == 'success' && needs.plan.outputs.migrations == 'false')
    # merge_group runs this file from the queue commit (PR content), so it never gets an
    # environment or secrets (the environments allow only main and feat-cmux-next); the queue
    # only admits PRs whose pull_request_target gate passed. Fork PRs never get secrets here.
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || 'cmux-gcp-gate-jit-x64' }} # ephemeral-required: trusted tokens; the required-gate JIT label first
    # Under 10s without migration changes; with them, bun install and a verify.
    timeout-minutes: 15
    # The environment's deployment-branch policy (main, feat-cmux-next, their merge-queue
    # refs) keeps these secrets away from PR-controlled workflows; no environment (and no
    # deployment record) when nothing changed.
    environment: ${{ github.event_name == 'pull_request_target' && needs.plan.outputs.migrations == 'true' && github.event.pull_request.head.repo.full_name == github.repository && 'cmux-next-production' || '' }}
    steps:
      - name: Plan succeeded
        env:
          RESULT: ${{ needs.plan.result }}
        run: '[ "$RESULT" = success ] || { echo "::error::migration plan $RESULT"; exit 1; }'
      - name: No migration changes, or merge queue (verified at PR time)
        if: needs.plan.outputs.migrations != 'true' || github.event_name == 'merge_group'
        run: echo "nothing to verify here (no migration changes, or a merge group of PRs whose gate passed)"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        if: needs.plan.outputs.migrations == 'true' && github.event_name == 'pull_request_target'
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        if: needs.plan.outputs.migrations == 'true' && github.event_name == 'pull_request_target'
        with:
          name: head-migrations
          path: head-migrations
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: needs.plan.outputs.migrations == 'true' && github.event_name == 'pull_request_target'
        with:
          no-cache: ${{ !(github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && github.event_name != 'merge_group' && contains(fromJSON('["refs/heads/main","refs/heads/feat-cmux-next","refs/heads/nightly-next"]'), github.ref)) }}
          bun-version: "1.4.2"
      - name: The tree's migrations are exactly what staging and production have
        if: needs.plan.outputs.migrations == 'true' && github.event_name == 'pull_request_target'
        env:
          PROD_URL: ${{ secrets.CMUX_NEXT_PG_MIGRATOR_URL }}
          STAGING_URL: ${{ secrets.CMUX_NEXT_STAGING_MIGRATOR_URL }}
        run: |
          if [ -z "$PROD_URL" ] || [ -z "$STAGING_URL" ]; then
            echo "::error::no database access for this PR (fork PRs never get it); a maintainer carries the migration on a same-repo branch"; exit 1
          fi
          (cd trusted/backend && bun install --frozen-lockfile)
          cd trusted/backend/db
          ok=1
          CMUX_NEXT_PG_MIGRATOR_URL="$STAGING_URL" bun migrate.ts --env staging --verify --dir "$GITHUB_WORKSPACE/head-migrations" || ok=0
          CMUX_NEXT_PG_MIGRATOR_URL="$PROD_URL" bun migrate.ts --env production --verify --dir "$GITHUB_WORKSPACE/head-migrations" || ok=0
          if [ "$ok" = 0 ]; then
            echo "::error::migrations are not applied (or the database has migrations this tree lacks). Merge the base, then add the label backend:apply-migrations; merging deploys."
            exit 1
          fi

  # `backend migrations applied` when the plan succeeded and found no migration change: the gate's work is then one
  # echo (no checkout, environment, token or secret), so it needs no one-job VM and takes cmux-linux, the persistent
  # pool, like merge-group-policy-checks.yml's bridges. gate (above) skips on exactly this answer and keeps every other
  # one: a plan that failed, was cancelled or skipped, or found migrations to verify with the databases' secrets. Both
  # jobs carry the same expression name, so the one that skips publishes the unevaluated expression, never the required
  # name. 2026-11-25 21:22-21:50Z: about 126 PR heads in 20 min each queued plan and gate on cmux-gcp-gate-jit-x64; 96
  # of the 127 queued gate-label jobs were this echo, and gate jobs waited about 14 min for a VM.
  gate-no-change:
    name: ${{ github.event_name == 'pull_request_target' && github.event.action == 'edited' && !github.event.changes.base && github.event.pull_request.base.ref == 'feat-cmux-next' && 'backend migrations metadata edit (ignored)' || github.event_name == 'pull_request_target' && github.event.pull_request.base.ref == 'feat-cmux-next' && (github.event.action == 'labeled' || github.event.action == 'unlabeled') && !contains(fromJSON('["backend:apply-migrations","full-ci"]'), github.event.label.name) && 'backend migrations label (ignored)' || 'backend migrations applied' }}
    needs: plan
    if: ${{ !cancelled() && !(github.event.pull_request.state == 'closed' && (github.event.action == 'labeled' || github.event.action == 'unlabeled') && startsWith(github.event.label.name, 'fix-cause:')) && !(github.event_name == 'pull_request_target' && github.event.action == 'edited' && !github.event.changes.base && github.event.pull_request.base.ref == 'feat-cmux-next') && !(github.event_name == 'pull_request_target' && github.event.pull_request.base.ref == 'feat-cmux-next' && (github.event.action == 'labeled' || github.event.action == 'unlabeled') && !contains(fromJSON('["backend:apply-migrations","full-ci"]'), github.event.label.name)) && needs.plan.result == 'success' && needs.plan.outputs.migrations == 'false' }}
    # The merge-group bridges' selector (#57252): cmux-linux behind only the fleet-wide overflow switch. test_ci_fork_runner_routing.py
    # INERT_POOL_RUNNER_LINE admits this one line only for a job with no permissions and only literal echo steps.
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.CI_OVERFLOW_LINUX || 'cmux-linux' }}
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Plan succeeded with no migration changes
        run: echo "no migration changes (the plan succeeded and found none), or a merge group of PRs whose gate passed"
