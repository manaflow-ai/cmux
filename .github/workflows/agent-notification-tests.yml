name: Agent notification semantics
on:
  pull_request:
    paths:
      - Packages/macOS/CmuxAgentJournal/**
      - CLI/*Notification*.swift
      - CLI/CMUXCLI+AgentJournalEmission.swift
      - CLI/CMUXCLI+VMTui.swift
      - CLI/VMRemoteWorkspaceResolver.swift
      - CLI/cmux.swift
      - Sources/AgentNotification*.swift
      - Sources/TerminalNotification*.swift
      - Sources/AgentFeedSemanticInput.swift
      - Sources/Feed/**
      # The files that define a suite in unit_test_suites below. ci.yml's shards
      # run all of cmuxTests, so a broader pattern only adds a second run.
      - cmuxTests/AgentDeliveryTTYBindingTests.swift
      - cmuxTests/AgentJournalLifecycleCenterTests.swift
      - cmuxTests/AgentNotificationLiveRetargetTests.swift
      - cmuxTests/AgentNotificationMoveRaceTests.swift
      - cmuxTests/AgentNotificationMutationBoundaryTests.swift
      - cmuxTests/AgentRelayTTYOwnershipTests.swift
      - cmuxTests/AgentSemanticNotificationDeliveryTests.swift
      - cmuxTests/ClaudeBackgroundWorkNotifyTests.swift
      - cmuxTests/FeedWaiterRegistryTests.swift
      - cmuxTests/MemoryPressureNotificationTests.swift
      - cmuxTests/NativeNotificationFallbackCommandTests.swift
      - cmuxTests/OpenCodeHookRegressionTests.swift
      # Shared helpers those suite files use.
      - cmuxTests/AgentHookTestNotificationPipeline.swift
      - cmuxTests/AgentJournalTestSupport.swift
      - cmuxTests/BundledCLILinkageTests.swift
      - cmuxTests/ClaudeHookLiveDeliveryTargetTestSupport.swift
      - cmuxTests/ClaudeHookSurfaceResolutionSwiftTests.swift
      - cmuxTests/ClaudeNotificationStatusLifecycleTests.swift
      - cmuxTests/TerminalControllingTTYWaiter.swift
      - Packages/macOS/CMUXAgentLaunch/**
      - .github/workflows/test-depot.yml
      - scripts/ci/classify-app-host-test-output.py
      - Sources/AgentJournalLifecycleCenter*.swift
      - .github/workflows/agent-notification-tests.yml
permissions:
  contents: read
jobs:
  agent-notification-tests:
    runs-on: ${{ vars.MACOS_RUNNER_15 || 'blacksmith-6vcpu-macos-15' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Test semantic lifecycle and durable notification admission
        run: swift test --package-path Packages/macOS/CmuxAgentJournal -Xswiftc -warnings-as-errors
      - name: Test immutable Feed ingestion
        run: swift test --package-path Packages/macOS/CMUXAgentLaunch --filter Workstream -Xswiftc -warnings-as-errors

  semantic-delivery-integration:
    needs: agent-notification-tests
    uses: ./.github/workflows/test-depot.yml
    with:
      ref: ${{ github.event.pull_request.head.sha }}
      skip_ui_tests: true
      # CLICodexResumeNotificationTests is red on main independently of this
      # change: its seeded Stop predates the Codex turn ledger's foreground
      # admission, the mock never answers agent.resolve_delivery_target, and its
      # fixture timestamp has aged past the seven-day session prune.
      unit_test_suites: AgentNotificationRegressionTests,AgentJournalLifecycleCenterTests,FeedWaiterRegistryTests,ClaudeBackgroundWorkNotifyTests,OpenCodeHookRegressionTests
