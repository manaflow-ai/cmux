name: Run E2E tests
description: >-
  Run test-e2e.yml's selected tests against a compiled app-host and UI test
  product. The build job runs this right after it packages the product, so a
  dispatch holds one macOS runner; the test job runs it only as a fallback,
  against the uploaded artifact it has already downloaded. test-e2e.yml checks
  this action out at the workflow's own revision, so a dispatch of an older
  ref still gets these steps; the scripts they call come from the tested
  revision, as they always did.
inputs:
  target:
    description: cmuxTests or cmuxUITests (the filter job's `target`).
    required: true
  filter:
    description: The first normalized filter (the filter job's `filter`).
    required: true
  selector:
    description: The first selector (the filter job's `selector`).
    required: true
  selectors:
    description: Every selector, comma-separated (the filter job's `selectors`).
    required: true
  count:
    description: How many selectors there are (the filter job's `count`).
    required: true
  record-video:
    description: Whether to record the virtual display, "true" or "false".
    required: true
  test-filter:
    description: The dispatch's raw test_filter, for the summary.
    required: true
  test-timeout:
    description: Per-test timeout in seconds.
    required: false
    default: "120"
  ref-display:
    description: The ref the dispatch named, for the summary.
    required: true
  source-revision:
    description: The full SHA the product was compiled from.
    required: true
  artifact-id:
    description: The uploaded product artifact's id.
    required: true
  artifact-digest:
    description: The uploaded product artifact's provider digest.
    required: true
  sha256:
    description: The product archive's SHA-256.
    required: true
  product-contract:
    description: The product contract key.
    required: true
  product-from-producer:
    description: >-
      "true" when this job packaged the product itself and its archive is at
      $RUNNER_TEMP/app-host-products.tar.gz; otherwise the caller has already
      downloaded it to $RUNNER_TEMP/app-host-products/.
    required: false
    default: "false"
  parallel-product-hit:
    description: Whether parallel_artifact_download.py fetched the archive.
    required: false
    default: ""
  parallel-product-transfer-seconds:
    description: How long that download took.
    required: false
    default: ""
runs:
  using: composite
  steps:
    # The product is compiled with CMUX_CI_APP_HOST_ISOLATION_REQUIRED, so
    # the app host demands the prepared home and refuses to start without it.
    # ci-macos.yml feeds the shard from its test matrix; this lane runs one
    # set of tests, so it names the only shard there is. test-without-building
    # takes no -derivedDataPath, so its result bundle would land under
    # ~/Library/Developer/Xcode and never be uploaded;
    # CMUX_APP_HOST_CAPTURE_XCRESULTS makes the app-host wrapper write it to
    # $RUNNER_TEMP/cmux-app-host-xcresults instead, where the upload reads.
    # Set here, after the compile, so the build job's compile never sees them
    # wherever these steps run.
    - name: Set the app-host test environment
      shell: bash
      run: |
        {
          echo "CMUX_CI_APP_HOST_ISOLATION_REQUIRED=1"
          echo "CMUX_APP_HOST_SHARD=1"
          echo "CMUX_APP_HOST_CAPTURE_XCRESULTS=1"
        } >> "$GITHUB_ENV"

    - name: Create virtual display
      if: ${{ inputs.target == 'cmuxUITests' && inputs.filter != 'DisplayResolutionRegressionUITests' }}
      shell: bash
      run: |
        set -euo pipefail
        echo "=== Display before ==="
        system_profiler SPDisplaysDataType 2>/dev/null || echo "(none)"
        echo ""
        clang -framework Foundation -framework CoreGraphics \
          -o /tmp/create-virtual-display scripts/create-virtual-display.m
        VDISPLAY_READY="$RUNNER_TEMP/cmux-virtual-display.ready"
        VDISPLAY_ID_PATH="$RUNNER_TEMP/cmux-virtual-display.id"
        VDISPLAY_LOG="$RUNNER_TEMP/cmux-virtual-display.log"
        rm -f "$VDISPLAY_READY" "$VDISPLAY_ID_PATH" "$VDISPLAY_LOG"

        /tmp/create-virtual-display \
          --ready-path "$VDISPLAY_READY" \
          --display-id-path "$VDISPLAY_ID_PATH" \
          >"$VDISPLAY_LOG" 2>&1 &
        VDISPLAY_PID=$!
        echo "VDISPLAY_PID=$VDISPLAY_PID" >> "$GITHUB_ENV"

        for _ in $(seq 1 100); do
          if [ -s "$VDISPLAY_READY" ] && [ -s "$VDISPLAY_ID_PATH" ]; then
            break
          fi
          if ! kill -0 "$VDISPLAY_PID" 2>/dev/null; then
            echo "Virtual display helper exited before readiness" >&2
            cat "$VDISPLAY_LOG" >&2 || true
            exit 1
          fi
          sleep 0.1
        done
        if [ ! -s "$VDISPLAY_READY" ] || [ ! -s "$VDISPLAY_ID_PATH" ]; then
          echo "Timed out waiting for virtual display readiness" >&2
          cat "$VDISPLAY_LOG" >&2 || true
          exit 1
        fi
        echo "Virtual display ready: $(tr -d '\n' < "$VDISPLAY_ID_PATH")"
        cat "$VDISPLAY_LOG"
        echo "=== Display after ==="
        system_profiler SPDisplaysDataType 2>/dev/null || echo "(none)"

    - name: Install ffmpeg
      if: ${{ inputs.record-video == 'true' }}
      shell: bash
      run: |
        brew install --quiet ffmpeg
        FFMPEG_PATH=$(which ffmpeg)
        echo "ffmpeg: $FFMPEG_PATH"
        ffmpeg -version | head -1
        echo "FFMPEG_PATH=$FFMPEG_PATH" >> "$GITHUB_ENV"

    - name: Grant TCC screen recording permission
      if: ${{ inputs.record-video == 'true' }}
      shell: bash
      run: |
        FFMPEG_BIN="${FFMPEG_PATH:-/opt/homebrew/bin/ffmpeg}"

        # System-level TCC database (where kTCCServiceScreenCapture lives)
        SYS_TCC="/Library/Application Support/com.apple.TCC/TCC.db"
        if [ -f "$SYS_TCC" ]; then
          echo "Granting screen capture in system TCC database"
          for client in "$FFMPEG_BIN" /opt/homebrew/bin/ffmpeg /usr/local/bin/ffmpeg /usr/sbin/screencapture; do
            sudo sqlite3 "$SYS_TCC" \
              "INSERT OR REPLACE INTO access (service, client, client_type, auth_value, auth_reason, auth_version, csreq, policy_id, indirect_object_identifier_type, indirect_object_identifier, indirect_object_code_identity, flags, last_modified) VALUES ('kTCCServiceScreenCapture', '$client', 1, 2, 4, 1, NULL, NULL, 0, 'UNUSED', NULL, 0, $(date +%s));" 2>&1 || echo "  (failed for $client)"
          done
        fi

        # User-level TCC database (fallback)
        USER_TCC="$HOME/Library/Application Support/com.apple.TCC/TCC.db"
        if [ -f "$USER_TCC" ]; then
          echo "Granting screen capture in user TCC database"
          for client in "$FFMPEG_BIN" /opt/homebrew/bin/ffmpeg /usr/local/bin/ffmpeg; do
            sqlite3 "$USER_TCC" \
              "INSERT OR REPLACE INTO access (service, client, client_type, auth_value, auth_reason, auth_version, csreq, policy_id, indirect_object_identifier_type, indirect_object_identifier, indirect_object_code_identity, flags, last_modified) VALUES ('kTCCServiceScreenCapture', '$client', 1, 2, 4, 1, NULL, NULL, 0, 'UNUSED', NULL, 0, $(date +%s));" 2>&1 || echo "  (failed for $client)"
          done
        fi

        # Suppress Sequoia's ScreenCaptureApprovals prompt by pre-dating approval
        APPROVALS_PLIST="$HOME/Library/Group Containers/group.com.apple.replayd/ScreenCaptureApprovals.plist"
        if [ -d "$(dirname "$APPROVALS_PLIST")" ]; then
          echo "Pre-dating ScreenCaptureApprovals"
          # Set approval date far in the future so the monthly prompt never fires
          defaults write "$APPROVALS_PLIST" "$FFMPEG_BIN" -date "3000-01-01T00:00:00Z" 2>&1 || echo "  (failed)"
        fi

    # The display-churn regression establishes its own display later.
    # Keep its existing recorder startup check at that point.

    - name: Verify screen capture before dependency setup
      if: ${{ inputs.record-video == 'true' && inputs.filter != 'DisplayResolutionRegressionUITests' }}
      shell: bash
      run: python3 scripts/ci/preflight-e2e-screen-capture.py

    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version: "1.3.14"

    - name: Install tmux
      shell: bash
      run: |
        if ! command -v tmux >/dev/null 2>&1; then
          brew install --quiet tmux
        fi
        tmux -V

    - name: Prepare isolated DerivedData
      shell: bash
      run: |
        set -euo pipefail
        # Only a destination for the restored product: these steps run
        # test-without-building and compile nothing, so there is no
        # compilation cache here to key, seed or discard.
        #
        # It sits under RUNNER_TEMP because app-host cleanup refuses to
        # inspect a host whose DerivedData lives anywhere else, which is
        # also where ci-macos.yml puts its test shards.
        DERIVED_DATA_PATH="$RUNNER_TEMP/cmux-e2e-products-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
        rm -rf -- "$DERIVED_DATA_PATH"
        mkdir -p "$DERIVED_DATA_PATH"
        echo "CMUX_DERIVED_DATA_PATH=$DERIVED_DATA_PATH" >> "$GITHUB_ENV"

    - name: Restore the compiled test product
      env:
        ARTIFACT_ID: ${{ inputs.artifact-id }}
        ARTIFACT_PROVIDER_DIGEST: ${{ inputs.artifact-digest }}
        EXPECTED_SHA256: ${{ inputs.sha256 }}
        CMUX_PRODUCT_CONTRACT: ${{ inputs.product-contract }}
        CMUX_PRODUCT_SOURCE_REVISION: ${{ inputs.source-revision }}
        CMUX_PRODUCT_PRODUCER_RUN_ID: ${{ github.run_id }}
        CMUX_PRODUCT_PRODUCER_RUN_ATTEMPT: ${{ github.run_attempt }}
        CMUX_PRODUCT_FROM_PRODUCER: ${{ inputs.product-from-producer }}
        CMUX_PARALLEL_PRODUCT_HIT: ${{ inputs.parallel-product-hit }}
        CMUX_PARALLEL_PRODUCT_TRANSFER_SECONDS: ${{ inputs.parallel-product-transfer-seconds }}
      shell: bash
      run: |
        set -euo pipefail
        # The build job restores the archive it just packaged and uploaded,
        # as compile admission does for its changed suites, so the tests run
        # the exact bytes every other consumer downloads.
        if [ "$CMUX_PRODUCT_FROM_PRODUCER" = true ]; then
          mkdir -p "$RUNNER_TEMP/app-host-products"
          ln -f "$RUNNER_TEMP/app-host-products.tar.gz" "$RUNNER_TEMP/app-host-products/app-host-products.tar.gz"
        fi
        scripts/ci/restore-app-host-test-product.sh

    - name: Prepare isolated app-host home
      id: prepare-app-host-home
      if: ${{ inputs.target == 'cmuxTests' }}
      shell: bash
      run: scripts/ci/prepare-app-host-home.sh

    - name: Resolve selectors against the built tests
      id: resolve-selectors
      if: ${{ inputs.target == 'cmuxTests' }}
      env:
        TEST_SELECTORS: ${{ inputs.selectors }}
      shell: bash
      run: |
        set -euo pipefail
        # A Swift Testing method selector without its call suffix, such as
        # cmuxTests/Suite/method instead of cmuxTests/Suite/method(), matches
        # nothing, and xcodebuild reports zero executed tests as success.
        # Enumerate what the restored product contains, the same way the
        # app-host shards do, and give each selector the name the inventory
        # records before anything runs.
        #
        # This job runs the tested revision's scripts. A revision older than
        # the resolver keeps its selectors as given; the executed-count
        # guards in the next step still apply.
        if [ ! -f scripts/ci/focused_test_selectors.py ]; then
          echo "::notice::This revision predates selector resolution; running selectors as given."
          exit 0
        fi
        enumeration_json="$RUNNER_TEMP/cmux-app-host-test-enumeration.json"
        inventory_json="$RUNNER_TEMP/cmux-app-host-test-inventory.json"
        enumeration_log="$RUNNER_TEMP/cmux-app-host-test-enumeration.log"
        rm -f -- "$enumeration_json" "$inventory_json" "$enumeration_log"
        if ! bash scripts/ci/run-and-capture.sh "$enumeration_log" \
          scripts/ci/run-in-console-session.sh \
          xcodebuild test-without-building \
          -enumerate-tests \
          -xctestrun "$CMUX_APP_HOST_XCTESTRUN" \
          -destination "platform=macOS" \
          -test-enumeration-style hierarchical \
          -test-enumeration-format json \
          -test-enumeration-output-path "$enumeration_json" \
          || [ ! -s "$enumeration_json" ] \
          || ! python3 scripts/ci/app_host_result_accounting.py inventory \
            "$enumeration_json" --output "$inventory_json"; then
          echo "::warning::Could not enumerate the built tests; running selectors as given."
          exit 0
        fi
        resolved="$(python3 scripts/ci/focused_test_selectors.py resolve \
          --inventory "$inventory_json" --selectors "$TEST_SELECTORS")"
        echo "Resolved selectors: $resolved"
        echo "selectors=$resolved" >> "$GITHUB_OUTPUT"

    # test-e2e.yml turns this into a failed top-level step of the same name
    # as the step above, which main_regression_bisect.py reads as "this test
    # does not exist at this revision".
    - name: Record a selector that matched no built test
      if: ${{ failure() && steps.resolve-selectors.outcome == 'failure' }}
      shell: bash
      run: touch "$RUNNER_TEMP/cmux-e2e-selectors-unresolved"

    - name: Run selected tests
      id: tests
      env:
        TEST_FILTER: ${{ inputs.test-filter }}
        TEST_TARGET: ${{ inputs.target }}
        TEST_SELECTOR: ${{ inputs.selector }}
        TEST_SELECTORS: ${{ steps.resolve-selectors.outputs.selectors || inputs.selectors }}
        TEST_SELECTOR_COUNT: ${{ inputs.count }}
        NORMALIZED_FILTER: ${{ inputs.filter }}
        TEST_TIMEOUT: ${{ inputs.test-timeout }}
        RECORD_VIDEO: ${{ inputs.record-video }}
        # App-host crash recovery must not stall on interactive backtraces
        # (mirrors ci.yml's tests job hardening).
        SWIFT_BACKTRACE: "interactive=no,timeout=0s,symbolicate=off,color=no"
        CMUX_XCODEBUILD_NONINTERACTIVE_POST_TEST_TIMEOUT_SECONDS: "45"
      shell: bash
      run: |
        set -euo pipefail
        # One -only-testing: per selector. xcodebuild unions repeated flags,
        # so a batch of filters runs against a single compile.
        ONLY_TESTING=()
        rest="$TEST_SELECTORS"
        while [ -n "$rest" ]; do
          case "$rest" in
            *,*) entry="${rest%%,*}"; rest="${rest#*,}" ;;
            *) entry="$rest"; rest="" ;;
          esac
          ONLY_TESTING+=("-only-testing:$entry")
        done
        DISPLAY_ENV_PREFIX=()

        if [ "$TEST_SELECTOR_COUNT" = "1" ] && [ "$TEST_TARGET" = "cmuxUITests" ] && [ "$NORMALIZED_FILTER" = "DisplayResolutionRegressionUITests" ]; then
          HELPER_PATH="/tmp/create-virtual-display"
          MANIFEST_PATH="/tmp/cmux-ui-test-display-harness.json"

          rm -f "$MANIFEST_PATH"
          trap 'rm -f "$MANIFEST_PATH"' EXIT

          clang -framework Foundation -framework CoreGraphics \
            -o "$HELPER_PATH" scripts/create-virtual-display.m

          printf '%s\n' "{\"helperBinaryPath\":\"$HELPER_PATH\"}" > "$MANIFEST_PATH"
        fi

        # Start recording right before the test (after build/resolve).
        # The display churn regression creates its own virtual display above,
        # so recording must start after that harness is ready.
        if [ "$RECORD_VIDEO" = "true" ]; then
          # A persistent AVFoundation capture session prevents
          # XCUIApplication from foregrounding a macOS app on self-hosted
          # VMs. Capture independent JPEG frames instead, then assemble
          # them after XCTest exits. No recorder owns the display while the
          # app is activating.
          GUI_USER="$(stat -f %Su /dev/console 2>/dev/null || true)"
          if [ -z "$GUI_USER" ] || [ "$GUI_USER" = "root" ]; then
            echo "::error::No logged-in GUI user is available for screen recording"
            exit 1
          fi
          GUI_UID="$(id -u "$GUI_USER")"
          FRAME_DIR=/tmp/test-recording-frames
          rm -rf "$FRAME_DIR"
          mkdir -p "$FRAME_DIR"
          (
            frame=0
            while true; do
              output="$(printf '%s/frame-%06d.jpg' "$FRAME_DIR" "$frame")"
              sudo -n launchctl asuser "$GUI_UID" sudo -n -H -u "$GUI_USER" \
                /usr/sbin/screencapture -x -t jpg -D 1 "$output" || exit 1
              frame=$((frame + 1))
              sleep 0.5
            done
          ) </dev/null >/tmp/screencapture.log 2>&1 &
          RECORD_PID=$!
          echo "RECORD_PID=$RECORD_PID" >> "$GITHUB_ENV"
          sleep 2

          if kill -0 "$RECORD_PID" 2>/dev/null && [ -s "$FRAME_DIR/frame-000000.jpg" ]; then
            echo "Frame capture started (PID $RECORD_PID)"
          else
            echo "::error::screen frame capture failed to start"
            cat /tmp/screencapture.log
            exit 1
          fi
        fi

        XCODEBUILD_ENV=(
          "DEVELOPER_DIR=$DEVELOPER_DIR"
          "PATH=$PATH"
          "HOME=$HOME"
          "USER=$USER"
          "LOGNAME=${LOGNAME:-$USER}"
          "CI=${CI:-true}"
          "GITHUB_ACTIONS=${GITHUB_ACTIONS:-true}"
          "GITHUB_WORKSPACE=${GITHUB_WORKSPACE:-$PWD}"
          "RUNNER_TEMP=${RUNNER_TEMP:-}"
          "TMPDIR=${TMPDIR:-/tmp}"
        )
        if [ "${#DISPLAY_ENV_PREFIX[@]}" -gt 0 ]; then
          XCODEBUILD_ENV+=("${DISPLAY_ENV_PREFIX[@]}")
        fi

        RUN_XCODEBUILD=(env "${XCODEBUILD_ENV[@]}")
        if [ "$TEST_TARGET" = "cmuxUITests" ]; then
          CURRENT_USER="$(id -un)"
          GUI_USER="$(stat -f %Su /dev/console 2>/dev/null || true)"
          if [ -n "$GUI_USER" ] && [ "$GUI_USER" != "root" ] && GUI_UID="$(id -u "$GUI_USER" 2>/dev/null)"; then
            echo "Console GUI user: $GUI_USER ($GUI_UID); current user: $CURRENT_USER"
            if command -v automationmodetool >/dev/null 2>&1; then
              sudo -n automationmodetool enable-automationmode-without-authentication \
                || echo "::warning::Could not enable Automation Mode"
            fi

            if sudo -n true 2>/dev/null; then
              RUN_XCODEBUILD=(
                sudo -n launchctl asuser "$GUI_UID"
                sudo -n -H -u "$GUI_USER" /usr/bin/env "${XCODEBUILD_ENV[@]}"
              )
              echo "Running xcodebuild in console user's GUI bootstrap"
            else
              echo "::warning::Passwordless sudo unavailable; running xcodebuild in current bootstrap"
            fi
          else
            echo "::warning::No non-root console GUI user found; running xcodebuild in current bootstrap"
          fi
        fi

        # The product was compiled once by the `build` job and restored
        # above, so this runs the tests and nothing else. `-only-testing:`
        # narrows execution; it never narrowed compilation, which is why a
        # one-class dispatch used to pay a full cold build.
        if [ "$TEST_TARGET" = "cmuxTests" ]; then
          XCTESTRUN_PATH="$CMUX_APP_HOST_XCTESTRUN"
          XCODEBUILD_CMD=(
            scripts/ci/run-in-console-session.sh
            scripts/ci/run-app-host-xcodebuild.sh
            -xctestrun "$XCTESTRUN_PATH"
            -destination "platform=macOS"
            -maximum-test-execution-time-allowance "$TEST_TIMEOUT"
            "${ONLY_TESTING[@]}"
            test-without-building
          )
        else
          XCTESTRUN_PATH="$CMUX_UI_XCTESTRUN"
          mkdir -p "$RUNNER_TEMP/cmux-app-host-xcresults"
          XCODEBUILD_CMD=(
            xcodebuild
            -xctestrun "$XCTESTRUN_PATH"
            -resultBundlePath "$RUNNER_TEMP/cmux-app-host-xcresults/cmuxUITests.xcresult"
            -destination "platform=macOS"
            -maximum-test-execution-time-allowance "$TEST_TIMEOUT"
            "${ONLY_TESTING[@]}"
            test-without-building
          )
        fi
        if [ ! -f "$XCTESTRUN_PATH" ]; then
          echo "::error::restored product has no $TEST_TARGET test manifest"
          exit 1
        fi
        set +e
        # Keep the tested command on a regular file descriptor. The capture
        # helper owns the live log tail, so a detached test descendant cannot
        # keep this job alive after xcodebuild exits.
        bash scripts/ci/run-and-capture.sh /tmp/xcodebuild-e2e.log \
          "${RUN_XCODEBUILD[@]}" "${XCODEBUILD_CMD[@]}"
        EXIT_CODE=$?
        set -e
        OUTPUT=$(cat /tmp/xcodebuild-e2e.log)

        # Save summary for the issue
        SUMMARY=$(echo "$OUTPUT" | grep -E "(Test Suite|Executed|FAIL|PASS)" | tail -20)
        {
          echo "test_summary<<EOFSUM"
          echo "$SUMMARY"
          echo "EOFSUM"
        } >> "$GITHUB_OUTPUT"

        if ! EXECUTED_TESTS=$(./scripts/ci/require_selected_test_execution.sh \
          /tmp/xcodebuild-e2e.log \
          "$TEST_SELECTOR"); then
          echo "::error::Selected test execution guard rejected $TEST_SELECTOR"
          echo "test_result=failed" >> "$GITHUB_OUTPUT"
          {
            echo "test_output<<EOFOUT"
            echo "$OUTPUT" | tail -200
            echo "EOFOUT"
          } >> "$GITHUB_OUTPUT"
          exit 1
        fi

        # That guard proves some tests ran, never which ones. In a batch, a
        # selector that matched nothing hides behind one that ran, so hold
        # every selector to its own typed results: each must account for at
        # least one executed Test Case.
        if [ -f scripts/ci/focused_test_selectors.py ]; then
          if [ "$TEST_TARGET" = "cmuxUITests" ]; then
            ui_bundle="$RUNNER_TEMP/cmux-app-host-xcresults/cmuxUITests.xcresult"
            if [ -d "$ui_bundle" ]; then
              xcrun xcresulttool get test-results tests --path "$ui_bundle" --compact \
                > "${ui_bundle%.xcresult}.tests.json" 2>/dev/null || true
            fi
          fi
          shopt -s nullglob
          typed_results=("$RUNNER_TEMP"/cmux-app-host-xcresults/*.tests.json)
          shopt -u nullglob
          if [ "${#typed_results[@]}" -eq 0 ]; then
            echo "::warning::No typed test results; only the aggregate executed-count guard applied."
          else
            set +e
            python3 scripts/ci/focused_test_selectors.py check-executed \
              --selectors "$TEST_SELECTORS" --tests-json "${typed_results[@]}"
            selector_status=$?
            set -e
            if [ "$selector_status" -ne 0 ] && [ "$selector_status" -ne 3 ]; then
              echo "test_result=failed" >> "$GITHUB_OUTPUT"
              {
                echo "test_output<<EOFOUT"
                echo "$OUTPUT" | tail -200
                echo "EOFOUT"
              } >> "$GITHUB_OUTPUT"
              exit 1
            fi
          fi
        fi

        # Name each
        # requested suite in the log as well. This is advisory on purpose.
        #
        # Three output shapes reach this log and only two are matchable:
        #   XCTest              Test Suite 'Name' started
        #   swift-testing bare  Suite Name started.
        #   swift-testing named Suite "A Display Name" started.
        # A @Suite("...") display name is not the identifier that
        # -only-testing: takes, and 293 of the 821 suites in cmuxTests carry
        # one. Failing on an unmatched name would turn those green runs red,
        # so report and let require_selected_test_execution.sh above own the
        # pass/fail decision.
        missing_suites=""
        rest="$TEST_SELECTORS"
        while [ -n "$rest" ]; do
          case "$rest" in
            *,*) entry="${rest%%,*}"; rest="${rest#*,}" ;;
            *) entry="$rest"; rest="" ;;
          esac
          suite="${entry#*/}"
          suite="${suite%%/*}"
          if ! grep -Eq "(Test Suite '${suite}')|(Suite \"${suite}\")|(^[^A-Za-z0-9_]*Suite ${suite}[ .])" \
            /tmp/xcodebuild-e2e.log; then
            missing_suites="${missing_suites:+$missing_suites, }$entry"
          fi
        done
        if [ -n "$missing_suites" ]; then
          echo "::warning::Not named in the log (a @Suite display name never is): $missing_suites"
        fi

        echo "Executed tests for $TEST_SELECTOR: $EXECUTED_TESTS"

        if [ "$EXIT_CODE" -eq 0 ]; then
          echo "test_result=passed" >> "$GITHUB_OUTPUT"
        else
          echo "test_result=failed" >> "$GITHUB_OUTPUT"
          # Save full output for the issue body
          {
            echo "test_output<<EOFOUT"
            echo "$OUTPUT" | tail -200
            echo "EOFOUT"
          } >> "$GITHUB_OUTPUT"
          exit 1
        fi

    - name: Stop recording and trim
      if: ${{ always() && inputs.record-video == 'true' && env.RECORD_PID != '' }}
      shell: bash
      run: |
        # Stop frame capture, then assemble the independent images into a
        # video. This avoids holding an AVFoundation display session while
        # XCTest foregrounds and relaunches the app.
        kill -TERM "$RECORD_PID" 2>/dev/null || true
        for i in $(seq 1 15); do
          if ! kill -0 "$RECORD_PID" 2>/dev/null; then
            echo "Recording stopped after ${i}s"
            break
          fi
          sleep 1
        done
        kill -9 "$RECORD_PID" 2>/dev/null || true

        FRAME_COUNT="$(find /tmp/test-recording-frames -type f -name 'frame-*.jpg' 2>/dev/null | wc -l | tr -d ' ')"
        echo "Captured frames: ${FRAME_COUNT:-0}"
        if [ "${FRAME_COUNT:-0}" -eq 0 ]; then
          echo "No recording frames"
          cat /tmp/screencapture.log 2>/dev/null || true
          exit 1
        fi

        ffmpeg -y -framerate 2 -i /tmp/test-recording-frames/frame-%06d.jpg \
          -c:v libx264 -preset ultrafast -pix_fmt yuv420p \
          /tmp/test-recording-raw.mp4 2>/dev/null

        echo "=== raw recording ==="
        ls -lh /tmp/test-recording-raw.mp4

        # Trim: detect first non-black frame and cut from there
        BLACK_END=$(ffmpeg -i /tmp/test-recording-raw.mp4 \
          -vf "blackdetect=d=0.3:pic_th=0.95:pix_th=0.1" \
          -an -f null - 2>&1 \
          | grep "black_end" | tail -1 \
          | sed 's/.*black_end:\([0-9.]*\).*/\1/' || true)

        if [ -n "$BLACK_END" ] && [ "$BLACK_END" != "0" ]; then
          echo "Trimming ${BLACK_END}s of black frames from start"
          ffmpeg -y -i /tmp/test-recording-raw.mp4 -ss "$BLACK_END" \
            -c:v libx264 -preset ultrafast -pix_fmt yuv420p \
            /tmp/test-recording.mp4 2>/dev/null
        else
          echo "No black frames detected, using raw recording"
          mv /tmp/test-recording-raw.mp4 /tmp/test-recording.mp4
        fi

        echo "=== final recording ==="
        ls -lh /tmp/test-recording.mp4
        # Print duration
        ffprobe -v error -show_entries format=duration \
          -of default=noprint_wrappers=1:nokey=1 /tmp/test-recording.mp4 2>/dev/null \
          | xargs -I{} echo "Duration: {}s"

    - name: Upload recording artifact
      id: recording
      if: ${{ always() && inputs.record-video == 'true' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: test-recording
        path: /tmp/test-recording.mp4
        if-no-files-found: warn
        retention-days: 30

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: test-results
        path: ${{ runner.temp }}/cmux-app-host-xcresults/**/*.xcresult
        if-no-files-found: warn
        retention-days: 7

    - name: Publish test summary
      if: always()
      env:
        TEST_RESULT: ${{ steps.tests.outputs.test_result || 'failed' }}
        TEST_SUMMARY: ${{ steps.tests.outputs.test_summary }}
        TEST_OUTPUT: ${{ steps.tests.outputs.test_output }}
        TEST_FILTER: ${{ inputs.test-filter }}
        COMMIT_SHA: ${{ inputs.source-revision }}
        REF_DISPLAY: ${{ inputs.ref-display }}
        RUN_ID: ${{ github.run_id }}
        RECORD_VIDEO: ${{ inputs.record-video }}
        RECORDING_URL: ${{ steps.recording.outputs.artifact-url }}
      shell: bash
      run: |
        set -euo pipefail

        if [ "$TEST_RESULT" = "passed" ]; then
          STATUS_EMOJI="PASSED"
        else
          STATUS_EMOJI="FAILED"
        fi

        RUN_URL="https://github.com/${{ github.repository }}/actions/runs/$RUN_ID"
        {
          echo "## E2E test result"
          echo
          echo "**Status:** $STATUS_EMOJI"
          echo "**Ref:** \`$REF_DISPLAY\`"
          echo "**SHA:** [\`${COMMIT_SHA:0:12}\`](https://github.com/${{ github.repository }}/commit/$COMMIT_SHA)"
          echo "**Test:** \`$TEST_FILTER\`"
          echo "**Workflow run:** $RUN_URL"

          if [ "$RECORD_VIDEO" = "true" ]; then
            if [ -n "$RECORDING_URL" ]; then
              echo "**Recording:** [Download artifact]($RECORDING_URL) (retained for 30 days)"
            else
              echo "**Recording:** unavailable"
            fi
          fi

          if [ -n "$TEST_OUTPUT" ]; then
            echo
            echo "<details><summary>Test output (last 200 lines)</summary>"
            echo
            echo '```'
            printf '%s\n' "$TEST_OUTPUT"
            echo '```'
            echo
            echo "</details>"
          fi

          if [ -n "$TEST_SUMMARY" ]; then
            echo
            echo '```'
            printf '%s\n' "$TEST_SUMMARY"
            echo '```'
          fi
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Clean owned app-host home
      if: always() && steps.prepare-app-host-home.outcome == 'success'
      shell: bash
      run: scripts/ci/cleanup-app-host-home.sh

    - name: Clean owned DerivedData
      if: always()
      shell: bash
      run: |
        set -euo pipefail
        derived_data_path="${CMUX_DERIVED_DATA_PATH:-}"
        case "$derived_data_path" in
          "$RUNNER_TEMP/cmux-e2e-products-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}")
            rm -rf -- "$derived_data_path"
            ;;
          "")
            echo "DerivedData was not prepared; nothing to clean"
            ;;
          *)
            echo "::error::refusing to remove unowned DerivedData path: $derived_data_path"
            exit 1
            ;;
        esac
