name: Reuse a green result for the same input tree
description: >-
  restore: look up a green result of this job for its input tree (scripts/ci/affected_jobs.py result_key) and say
  whose it is; `hit` is true only for that exact key. save: record this run as that key's green result. See
  scripts/ci/tree_result.py.

inputs:
  mode:
    description: "`restore` (first step of the job) or `save` (last step, after every tested step passed)."
    required: true
  job:
    description: The job's id in scripts/ci/affected-jobs.json.
    required: true
  key:
    description: The job's input-tree key, from the router's `<job>_tree` output. Empty means no reuse.
    required: true

outputs:
  hit:
    description: "`true` when a green result for this exact input tree exists; the job skips its tested steps."
    value: ${{ steps.restore.outputs.cache-hit == 'true' && steps.said.outcome == 'success' }}

runs:
  using: composite
  steps:
    - name: Look up a green result for this input tree
      id: restore
      # Only a pull request reuses: a push to the base is the safety net and runs every job.
      if: ${{ inputs.mode == 'restore' && inputs.key != '' && github.event_name == 'pull_request' }}
      uses: ./.github/actions/cache-restore
      with:
        path: .tree-result
        key: tree-result-${{ inputs.job }}-${{ inputs.key }}
    - name: Say whose result it is
      id: said
      if: ${{ inputs.mode == 'restore' && steps.restore.outputs.cache-hit == 'true' }}
      continue-on-error: true  # a record that does not name this job and key is no hit: the job runs
      shell: bash
      env:
        TREE_JOB: ${{ inputs.job }}
        TREE_KEY: ${{ inputs.key }}
      run: python3 "$GITHUB_ACTION_PATH/../../../scripts/ci/tree_result.py" said --dir .tree-result --job "$TREE_JOB" --key "$TREE_KEY"
    - name: Record this green result
      if: ${{ inputs.mode == 'save' && inputs.key != '' }}
      shell: bash
      env:
        TREE_JOB: ${{ inputs.job }}
        TREE_KEY: ${{ inputs.key }}
      run: python3 "$GITHUB_ACTION_PATH/../../../scripts/ci/tree_result.py" mark --dir .tree-result --job "$TREE_JOB" --key "$TREE_KEY"
    - name: Save it under the input tree
      if: ${{ inputs.mode == 'save' && inputs.key != '' }}
      continue-on-error: true  # an entry another run saved first holds the same verdict
      uses: ./.github/actions/cache-save
      with:
        path: .tree-result
        key: tree-result-${{ inputs.job }}-${{ inputs.key }}
