name: Mint a read token on the App with the most budget
description: >-
  Mints an installation token on both the manaflow-glaeda-route App and the
  cmux-bot App with the same permissions, reads each token's free
  GET /rate_limit, and outputs the token whose installation has the most core
  calls left. One installation's hourly 5,000 drained while the other sat idle
  (2026-11-22: glaeda-route at 0 with cmux-bot spare), so every read mint asks
  both and spends the fuller one. A failed mint (that App lacks a requested
  permission, or no key: a fork, or the App id unset) leaves the other; both
  failing leaves the token empty and fails this step, exactly as the one
  create-github-app-token step it replaces did, so `outcome == 'failure'`
  fallbacks and `continue-on-error: true` callers behave as before.

# The job's checkout needs .github/actions/app-token-spread (a sparse checkout of
# that one path at github.sha is enough). Only for read-only permissions: a
# write token's author would change with the App that won.
inputs:
  route-app-id:
    description: vars.GLAEDA_ROUTE_APP_ID
    required: false
    default: ""
  route-private-key:
    description: secrets.GLAEDA_ROUTE_APP_KEY
    required: false
    default: ""
  bot-app-id:
    description: vars.CMUX_BOT_APP_ID
    required: false
    default: ""
  bot-private-key:
    description: secrets.CMUX_BOT_APP_KEY
    required: false
    default: ""
  owner:
    description: Passed to both mints as is.
    required: false
    default: ""
  repositories:
    description: Passed to both mints as is.
    required: false
    default: ""
  skip-token-revoke:
    description: Passed to both mints as is.
    required: false
    default: "false"
  permission-actions:
    required: false
    default: ""
  permission-administration:
    required: false
    default: ""
  permission-checks:
    required: false
    default: ""
  permission-contents:
    required: false
    default: ""
  permission-issues:
    required: false
    default: ""
  permission-pull-requests:
    required: false
    default: ""
  permission-organization-self-hosted-runners:
    required: false
    default: ""
  probe:
    description: The label of this mint in the app-budget log line.
    required: false
    default: ""

outputs:
  token:
    description: The picked installation token, or empty when neither App minted one.
    value: ${{ steps.pick.outputs.token }}
  app:
    description: glaeda-route, cmux-bot, or empty.
    value: ${{ steps.pick.outputs.app }}
  remaining:
    description: The picked installation's core remaining at mint time (-1 unread).
    value: ${{ steps.pick.outputs.remaining }}

runs:
  using: composite
  steps:
    - name: Mint on the glaeda-route App
      id: route
      if: inputs.route-app-id != '' && inputs.route-private-key != ''
      continue-on-error: true
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        app-id: ${{ inputs.route-app-id }}
        private-key: ${{ inputs.route-private-key }}
        owner: ${{ inputs.owner }}
        repositories: ${{ inputs.repositories }}
        skip-token-revoke: ${{ inputs.skip-token-revoke }}
        permission-actions: ${{ inputs.permission-actions }}
        permission-administration: ${{ inputs.permission-administration }}
        permission-checks: ${{ inputs.permission-checks }}
        permission-contents: ${{ inputs.permission-contents }}
        permission-issues: ${{ inputs.permission-issues }}
        permission-pull-requests: ${{ inputs.permission-pull-requests }}
        permission-organization-self-hosted-runners: ${{ inputs.permission-organization-self-hosted-runners }}

    - name: Mint on the cmux-bot App
      id: bot
      if: inputs.bot-app-id != '' && inputs.bot-private-key != ''
      continue-on-error: true
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        app-id: ${{ inputs.bot-app-id }}
        private-key: ${{ inputs.bot-private-key }}
        owner: ${{ inputs.owner }}
        repositories: ${{ inputs.repositories }}
        skip-token-revoke: ${{ inputs.skip-token-revoke }}
        permission-actions: ${{ inputs.permission-actions }}
        permission-administration: ${{ inputs.permission-administration }}
        permission-checks: ${{ inputs.permission-checks }}
        permission-contents: ${{ inputs.permission-contents }}
        permission-issues: ${{ inputs.permission-issues }}
        permission-pull-requests: ${{ inputs.permission-pull-requests }}
        permission-organization-self-hosted-runners: ${{ inputs.permission-organization-self-hosted-runners }}

    - name: Pick the token with the most budget
      id: pick
      shell: bash
      env:
        ROUTE_TOKEN: ${{ steps.route.outputs.token }}
        BOT_TOKEN: ${{ steps.bot.outputs.token }}
        PROBE: ${{ github.workflow }}/${{ inputs.probe || github.job }}
      run: |
        # GET /rate_limit is free: it does not count against the installation's budget.
        remaining() {
          [ -n "$1" ] || { echo none; return; }
          local body
          body="$(curl -sS --max-time 10 -H "Authorization: Bearer $1" \
            -H "Accept: application/vnd.github+json" "${GITHUB_API_URL:-https://api.github.com}/rate_limit" 2>/dev/null)" || body=""
          # The API pretty-prints ("core": {), so drop all whitespace before matching.
          body="$(printf '%s' "$body" | tr -d ' \t\r\n')"
          local core="${body#*\"core\":}"
          core="${core%%\}*}"
          local value
          value="$(printf '%s' "$core" | grep -o '"remaining":[0-9]*' | head -n 1 | cut -d: -f2)"
          echo "${value:--1}"
        }
        route="$(remaining "$ROUTE_TOKEN")"
        bot="$(remaining "$BOT_TOKEN")"
        app="" token="" left=""
        # An unread budget (-1) ranks just above a spent one (0); glaeda-route wins a tie,
        # and when neither budget was read: today's pick.
        rank() { if [ "$1" = -1 ]; then echo 1; else echo "$1"; fi; }
        if [ "$route" != none ] && { [ "$bot" = none ] || [ "$(rank "$route")" -ge "$(rank "$bot")" ]; }; then
          app=glaeda-route token="$ROUTE_TOKEN" left="$route"
        elif [ "$bot" != none ]; then
          app=cmux-bot token="$BOT_TOKEN" left="$bot"
        fi
        echo "app-budget $PROBE picked=${app:-none} glaeda-route=$route cmux-bot=$bot at=$(date +%s)"
        {
          echo "token=$token"
          echo "app=$app"
          echo "remaining=$left"
        } >> "$GITHUB_OUTPUT"
        if [ -z "$token" ]; then
          echo "::warning::Neither the glaeda-route nor the cmux-bot App minted a token for $PROBE."
          exit 1
        fi
