name: Mint a read token on the App with the most budget
description: >-
  Mints an installation token on both the manaflow-glaeda-route App and the
  cmux-bot App with the same permissions, reads each token's free
  GET /rate_limit, and outputs the token whose installation has the most core
  calls left. One installation's hourly 5,000 drained while the other sat idle
  (2026-11-22: glaeda-route at 0 with cmux-bot spare), so every read mint asks
  both and spends the fuller one. A failed mint (that App lacks a requested
  permission, or no key: a fork, or the App id unset) leaves the other; both
  failing leaves the token empty and fails this step, exactly as the one
  create-github-app-token step it replaces did, so `outcome == 'failure'`
  fallbacks and `continue-on-error: true` callers behave as before.
  A caller whose read fits a quota-goblin pool token (pool-tokens: the
  one-hour, this-repository tokens the key home pushes as Actions secrets,
  e.g. CI_POOL_TOKEN_1/2) gets that token when its installation has at least
  pool-floor calls left, and then neither App is minted: the reads move off
  the routing App's 5,000 (spent to 0 every hour on 2026-11-25..27).

# The job's checkout needs .github/actions/app-token-spread (a sparse checkout of
# that one path at github.sha is enough). Only for read-only permissions: a
# write token's author would change with the App that won.
inputs:
  route-app-id:
    description: vars.GLAEDA_ROUTE_APP_ID
    required: false
    default: ""
  route-private-key:
    description: secrets.GLAEDA_ROUTE_APP_KEY
    required: false
    default: ""
  bot-app-id:
    description: vars.CMUX_BOT_APP_ID
    required: false
    default: ""
  bot-private-key:
    description: secrets.CMUX_BOT_APP_KEY
    required: false
    default: ""
  owner:
    description: Passed to both mints as is.
    required: false
    default: ""
  repositories:
    description: Passed to both mints as is.
    required: false
    default: ""
  skip-token-revoke:
    description: Passed to both mints as is.
    required: false
    default: "false"
  permission-actions:
    required: false
    default: ""
  permission-administration:
    required: false
    default: ""
  permission-checks:
    required: false
    default: ""
  permission-contents:
    required: false
    default: ""
  permission-issues:
    required: false
    default: ""
  permission-pull-requests:
    required: false
    default: ""
  permission-organization-self-hosted-runners:
    required: false
    default: ""
  pool-tokens:
    description: >-
      Space- or comma-separated pre-minted quota-goblin tokens for this
      repository (secrets.CI_POOL_TOKEN_1, ...). Used only when the requested
      permissions are within contents, pull-requests, actions and checks read
      on this repository (the pool tokens' scope); an expired or unreadable
      token is skipped.
    required: false
    default: ""
  pool-floor:
    description: A pool token is picked before any mint when its core remaining is at least this.
    required: false
    default: "500"
  probe:
    description: The label of this mint in the app-budget log line.
    required: false
    default: ""

outputs:
  token:
    description: The picked installation token, or empty when neither App minted one.
    value: ${{ steps.pick.outputs.token }}
  app:
    description: quota-goblin-pool-N, glaeda-route, cmux-bot, or empty.
    value: ${{ steps.pick.outputs.app }}
  remaining:
    description: The picked installation's core remaining at mint time (-1 unread).
    value: ${{ steps.pick.outputs.remaining }}

runs:
  using: composite
  steps:
    - name: Read the quota-goblin pool tokens
      id: pool
      if: inputs.pool-tokens != ''
      shell: bash
      env:
        POOL_TOKENS: ${{ inputs.pool-tokens }}
        POOL_FLOOR: ${{ inputs.pool-floor }}
        WANT_OWNER: ${{ inputs.owner }}
        WANT_REPOS: ${{ inputs.repositories }}
        P_ADMIN: ${{ inputs.permission-administration }}
        P_ISSUES: ${{ inputs.permission-issues }}
        P_RUNNERS: ${{ inputs.permission-organization-self-hosted-runners }}
        P_ACTIONS: ${{ inputs.permission-actions }}
        P_CHECKS: ${{ inputs.permission-checks }}
        P_CONTENTS: ${{ inputs.permission-contents }}
        P_PRS: ${{ inputs.permission-pull-requests }}
      run: |
        # The pool tokens hold contents, pull-requests and checks read plus actions on this
        # repository only (leo-workspace machines/gh-app-roles.json quota-goblin-9008/9009,
        # quota-goblin-9006). Any other permission or repository keeps today's two mints.
        fits=1
        [ -z "$P_ADMIN$P_ISSUES$P_RUNNERS" ] || fits=0
        for v in "$P_ACTIONS" "$P_CHECKS" "$P_CONTENTS" "$P_PRS"; do
          case "$v" in ""|read) ;; *) fits=0 ;; esac
        done
        [ -z "$WANT_OWNER" ] || [ "$WANT_OWNER" = "${GITHUB_REPOSITORY%%/*}" ] || fits=0
        [ -z "$WANT_REPOS" ] || [ "$WANT_REPOS" = "${GITHUB_REPOSITORY#*/}" ] || fits=0
        best="" best_left=-1 best_n="" n=0 seen=""
        if [ "$fits" = 1 ]; then
          for t in ${POOL_TOKENS//,/ }; do
            n=$((n + 1))
            # GET /rate_limit is free; an expired token answers 401 with no "core" and is skipped.
            body="$(curl -sS --max-time 10 -H "Authorization: Bearer $t" \
              -H "Accept: application/vnd.github+json" "${GITHUB_API_URL:-https://api.github.com}/rate_limit" 2>/dev/null | tr -d ' \t\r\n')" || body=""
            case "$body" in *'"core":'*) ;; *) seen="$seen pool-$n=unread"; continue ;; esac
            core="${body#*\"core\":}"; core="${core%%\}*}"
            left="$(printf '%s' "$core" | grep -o '"remaining":[0-9]*' | head -n 1 | cut -d: -f2)"
            [ -n "$left" ] || { seen="$seen pool-$n=unread"; continue; }
            seen="$seen pool-$n=$left"
            if [ "$left" -gt "$best_left" ]; then best="$t" best_left="$left" best_n="$n"; fi
          done
        fi
        if [ -n "$best" ] && [ "$best_left" -ge "${POOL_FLOOR:-500}" ]; then
          {
            echo "token=$best"
            echo "app=quota-goblin-pool-$best_n"
            echo "remaining=$best_left"
          } >> "$GITHUB_OUTPUT"
        fi
        echo "pool-budget fits=$fits floor=${POOL_FLOOR:-500}${seen}"

    - name: Mint on the glaeda-route App
      id: route
      if: steps.pool.outputs.token == '' && inputs.route-app-id != '' && inputs.route-private-key != ''
      continue-on-error: true
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        app-id: ${{ inputs.route-app-id }}
        private-key: ${{ inputs.route-private-key }}
        owner: ${{ inputs.owner }}
        repositories: ${{ inputs.repositories }}
        skip-token-revoke: ${{ inputs.skip-token-revoke }}
        permission-actions: ${{ inputs.permission-actions }}
        permission-administration: ${{ inputs.permission-administration }}
        permission-checks: ${{ inputs.permission-checks }}
        permission-contents: ${{ inputs.permission-contents }}
        permission-issues: ${{ inputs.permission-issues }}
        permission-pull-requests: ${{ inputs.permission-pull-requests }}
        permission-organization-self-hosted-runners: ${{ inputs.permission-organization-self-hosted-runners }}

    - name: Mint on the cmux-bot App
      id: bot
      if: steps.pool.outputs.token == '' && inputs.bot-app-id != '' && inputs.bot-private-key != ''
      continue-on-error: true
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        app-id: ${{ inputs.bot-app-id }}
        private-key: ${{ inputs.bot-private-key }}
        owner: ${{ inputs.owner }}
        repositories: ${{ inputs.repositories }}
        skip-token-revoke: ${{ inputs.skip-token-revoke }}
        permission-actions: ${{ inputs.permission-actions }}
        permission-administration: ${{ inputs.permission-administration }}
        permission-checks: ${{ inputs.permission-checks }}
        permission-contents: ${{ inputs.permission-contents }}
        permission-issues: ${{ inputs.permission-issues }}
        permission-pull-requests: ${{ inputs.permission-pull-requests }}
        permission-organization-self-hosted-runners: ${{ inputs.permission-organization-self-hosted-runners }}

    - name: Pick the token with the most budget
      id: pick
      shell: bash
      env:
        ROUTE_TOKEN: ${{ steps.route.outputs.token }}
        BOT_TOKEN: ${{ steps.bot.outputs.token }}
        POOL_TOKEN: ${{ steps.pool.outputs.token }}
        POOL_APP: ${{ steps.pool.outputs.app }}
        POOL_LEFT: ${{ steps.pool.outputs.remaining }}
        PROBE: ${{ github.workflow }}/${{ inputs.probe || github.job }}
      run: |
        # GET /rate_limit is free: it does not count against the installation's budget.
        remaining() {
          [ -n "$1" ] || { echo none; return; }
          local body
          body="$(curl -sS --max-time 10 -H "Authorization: Bearer $1" \
            -H "Accept: application/vnd.github+json" "${GITHUB_API_URL:-https://api.github.com}/rate_limit" 2>/dev/null)" || body=""
          # The API pretty-prints ("core": {), so drop all whitespace before matching.
          body="$(printf '%s' "$body" | tr -d ' \t\r\n')"
          local core="${body#*\"core\":}"
          core="${core%%\}*}"
          local value
          value="$(printf '%s' "$core" | grep -o '"remaining":[0-9]*' | head -n 1 | cut -d: -f2)"
          echo "${value:--1}"
        }
        if [ -n "$POOL_TOKEN" ]; then
          echo "app-budget $PROBE picked=$POOL_APP $POOL_APP=$POOL_LEFT glaeda-route=unminted cmux-bot=unminted at=$(date +%s)"
          {
            echo "token=$POOL_TOKEN"
            echo "app=$POOL_APP"
            echo "remaining=$POOL_LEFT"
          } >> "$GITHUB_OUTPUT"
          exit 0
        fi
        route="$(remaining "$ROUTE_TOKEN")"
        bot="$(remaining "$BOT_TOKEN")"
        app="" token="" left=""
        # An unread budget (-1) ranks just above a spent one (0); glaeda-route wins a tie,
        # and when neither budget was read: today's pick.
        rank() { if [ "$1" = -1 ]; then echo 1; else echo "$1"; fi; }
        if [ "$route" != none ] && { [ "$bot" = none ] || [ "$(rank "$route")" -ge "$(rank "$bot")" ]; }; then
          app=glaeda-route token="$ROUTE_TOKEN" left="$route"
        elif [ "$bot" != none ]; then
          app=cmux-bot token="$BOT_TOKEN" left="$bot"
        fi
        echo "app-budget $PROBE picked=${app:-none} glaeda-route=$route cmux-bot=$bot at=$(date +%s)"
        {
          echo "token=$token"
          echo "app=$app"
          echo "remaining=$left"
        } >> "$GITHUB_OUTPUT"
        if [ -z "$token" ]; then
          echo "::warning::Neither the glaeda-route nor the cmux-bot App minted a token for $PROBE."
          exit 1
        fi
