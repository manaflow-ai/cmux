name: Set up cmux-tui Rust
description: Install the repository-pinned cmux-tui Rust toolchain.

inputs:
  toolchain-file:
    description: Exact rust-toolchain.toml file to read with this trusted action.
    required: false
    default: ""
  python-command:
    description: Pre-resolved trusted Python 3 command. The action resolves Python when omitted.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install pinned Rust toolchain
      shell: bash
      env:
        REQUESTED_TOOLCHAIN_FILE: ${{ inputs.toolchain-file }}
        REQUESTED_PYTHON_COMMAND: ${{ inputs.python-command }}
        DEFAULT_TOOLCHAIN_FILE: ${{ github.action_path }}/../../../cmux-tui/rust-toolchain.toml
      run: |
        if [[ -n "$REQUESTED_PYTHON_COMMAND" ]]; then
          python_cmd="$REQUESTED_PYTHON_COMMAND"
        elif command -v python3 >/dev/null 2>&1; then
          python_cmd="$(command -v python3)"
        elif command -v python >/dev/null 2>&1; then
          python_cmd="$(command -v python)"
        else
          echo "::error::Python is required to read the pinned Rust toolchain" >&2
          exit 1
        fi
        "$python_cmd" -c 'import sys; raise SystemExit(sys.version_info < (3, 9))'
        "$python_cmd" <<'PY'
        import os
        import pathlib
        import re
        import subprocess

        requested = os.environ["REQUESTED_TOOLCHAIN_FILE"]
        toolchain_file = pathlib.Path(requested or os.environ["DEFAULT_TOOLCHAIN_FILE"])
        contents = toolchain_file.read_text(encoding="utf-8")

        def value(name):
            match = re.search(rf'^\s*{name}\s*=\s*"([^"]+)"', contents, re.MULTILINE)
            if match is None:
                raise SystemExit(f"missing {name} in cmux-tui/rust-toolchain.toml")
            return match.group(1)

        channel = value("channel")
        profile = value("profile")
        components_match = re.search(r"^\s*components\s*=\s*\[([^]]*)\]", contents, re.MULTILINE)
        if components_match is None:
            raise SystemExit("missing components in cmux-tui/rust-toolchain.toml")
        components = re.findall(r'"([^"]+)"', components_match.group(1))

        command = ["rustup", "toolchain", "install", channel, "--profile", profile]
        for component in components:
            command.extend(["--component", component])
        subprocess.run(command, check=True)
        subprocess.run(["rustup", "default", channel], check=True)

        cargo = subprocess.run(
            ["rustup", "which", "cargo"],
            check=True,
            capture_output=True,
            text=True,
        ).stdout.strip()
        with open(os.environ["GITHUB_PATH"], "a", encoding="utf-8") as path_file:
            print(pathlib.Path(cargo).parent, file=path_file)
        PY
        cargo --version
        rustc --version
