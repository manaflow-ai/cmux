name: Fleet client from the controller
description: >-
  Fetches the build fleet's client (ci-client.py) from the controller, checks each file's sha256 against the
  controller's manifest, and exports CMUX_CI_CLIENT (a `cmux-ci` wrapper) and CMUX_CI_CONTROLLER for later steps.
  A gateway job only runs this client and waits; the suites build and run on a fleet Mac, so the job itself runs on
  Linux (Leo, 2026-11-26: "How about freeing up the Mac's from doing things that don't need Mac's asap?").
  When the controller is unset or unreachable nothing is exported: a caller's `no client` path gives no verdict,
  exactly as a gateway Mac without ~/.local/bin/cmux-ci did.
inputs:
  controller:
    description: The controller's URL (vars.CMUX_FLEET_CONTROLLER).
    required: true
runs:
  using: composite
  steps:
    - name: Fetch the fleet client
      shell: bash
      env:
        CONTROLLER: ${{ inputs.controller }}
      run: |
        set -uo pipefail
        if [[ -z "$CONTROLLER" ]]; then
          echo "::warning title=fleet client::no CMUX_FLEET_CONTROLLER variable; no client"
          exit 0
        fi
        client="$RUNNER_TEMP/fleet-client"
        mkdir -p "$client"
        ok=0
        for try in 1 2 3; do
          if curl -fsS -m 30 "$CONTROLLER/v1/client/manifest" -o "$client/manifest.json" &&
            python3 -I - "$client" "$CONTROLLER" <<'PY'
        import hashlib, json, sys, urllib.request
        from pathlib import Path
        root, controller = Path(sys.argv[1]), sys.argv[2]
        for name, digest in json.loads((root / "manifest.json").read_text())["files"].items():
            if "/" in name or name.startswith("."):
                raise SystemExit(f"bad client file name {name!r}")
            data = urllib.request.urlopen(f"{controller}/v1/client/files/{name}", timeout=30).read()
            if hashlib.sha256(data).hexdigest() != digest:
                raise SystemExit(f"{name}: sha256 mismatch")
            (root / name).write_bytes(data)
        PY
          then ok=1; break; fi
          sleep $((try * 5))
        done
        if [[ "$ok" != 1 || ! -f "$client/ci-client.py" ]]; then
          echo "::warning title=fleet client::the controller's client could not be fetched; no client"
          exit 0
        fi
        printf '#!/bin/sh\nexec python3 -I %q "$@"\n' "$client/ci-client.py" > "$client/cmux-ci"
        chmod +x "$client/cmux-ci"
        echo "CMUX_CI_CLIENT=$client/cmux-ci" >> "$GITHUB_ENV"
        echo "CMUX_CI_CONTROLLER=$CONTROLLER" >> "$GITHUB_ENV"
