name: Set up JDK 17
description: >-
  Put a JDK 17 on PATH and JAVA_HOME. GitHub-hosted and Blacksmith images
  export JAVA_HOME_17_X64; the persistent cmux-linux pool does not, so this
  falls back to the distribution's OpenJDK 17 and installs it once per runner.

runs:
  using: composite
  steps:
    - name: Select or install JDK 17
      shell: bash
      run: |
        set -euo pipefail
        jdk=""
        if [[ -n "${JAVA_HOME_17_X64:-}" && -x "$JAVA_HOME_17_X64/bin/javac" ]]; then
          jdk="$JAVA_HOME_17_X64"
        else
          distro_jdk="/usr/lib/jvm/java-17-openjdk-$(dpkg --print-architecture)"
          if [[ ! -x "$distro_jdk/bin/javac" ]]; then
            sudo apt-get -o DPkg::Lock::Timeout=120 update
            sudo DEBIAN_FRONTEND=noninteractive apt-get -o DPkg::Lock::Timeout=120 install -y --no-install-recommends openjdk-17-jdk-headless
          fi
          jdk="$distro_jdk"
        fi
        test -x "$jdk/bin/java"
        test -x "$jdk/bin/javac"
        echo "$jdk/bin" >> "$GITHUB_PATH"
        {
          echo "JAVA_HOME=$jdk"
          echo "JAVA_HOME_17_X64=$jdk"
        } >> "$GITHUB_ENV"
        "$jdk/bin/java" -version
        "$jdk/bin/javac" -version
