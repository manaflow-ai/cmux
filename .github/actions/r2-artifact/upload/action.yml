name: Upload an artifact to the fleet store
description: >-
  actions/upload-artifact's inputs, kept in the fleet store (R2) instead of Actions artifact storage,
  whose private-repository quota runs out (2026-11-17). The job needs `permissions: id-token: write`.
  See ../artifact.py.
inputs:
  name:
    description: The artifact's name.
    default: artifact
  path:
    description: Files, directories or globs, one per line; a leading ! excludes.
    required: true
  retention-days:
    description: Days the store keeps it, 1 to 14.
    default: "3"
  if-no-files-found:
    description: warn, error or ignore.
    default: warn
  include-hidden-files:
    description: Upload files and directories whose names start with a dot.
    default: "false"
  overwrite:
    description: Accepted for upload-artifact's sake; a name is written once per run attempt (a second upload fails).
    default: "true"
  compression-level:
    description: Accepted for upload-artifact's sake; the store keeps a gzip tarball.
    default: "6"
outputs:
  failure_kind:
    description: Set to infrastructure when the bounded artifact-store retry window is exhausted.
    value: ${{ steps.upload.outputs.failure_kind }}
runs:
  using: composite
  steps:
    - name: Upload to the fleet store
      id: upload
      shell: bash
      env:
        INPUT_NAME: ${{ inputs.name }}
        INPUT_PATH: ${{ inputs.path }}
        INPUT_RETENTION_DAYS: ${{ inputs.retention-days }}
        INPUT_IF_NO_FILES_FOUND: ${{ inputs.if-no-files-found }}
        INPUT_INCLUDE_HIDDEN_FILES: ${{ inputs.include-hidden-files }}
      run: |
        if [ "$RUNNER_OS" = Windows ]; then py=python; else py="$(command -v python3 || command -v python)"; fi
        "$py" -I "$GITHUB_ACTION_PATH/../artifact.py" upload
