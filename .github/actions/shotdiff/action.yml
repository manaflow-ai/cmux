name: Screenshots against goldens (cmux-shotdiff)
description: >-
  The one screenshot gate step (F1, docs in cmux-tui/crates/cmux-shotdiff/README.md). Builds cmux-shotdiff from
  this checkout, checks every HEADS/<name>.png against the golden store's <name>, writes the report and diff
  images under OUT, appends a table to the step summary, and fails on a changed, new (unless allow-new) or
  unreadable screenshot. Works on Linux and macOS runners alike.

inputs:
  store:
    description: Golden store directory (goldens.json plus objects/).
    required: true
  heads:
    description: Directory of fresh screenshots; ios/home/light.png is checked against the golden ios/home/light.
    required: true
  out:
    description: Where report.json and diff/<name>.png go (upload it as an artifact).
    required: false
    default: shotdiff-out
  title:
    description: Step summary heading.
    required: false
    default: Screenshots against goldens
  allow-new:
    description: "true: a screenshot with no golden passes (a gate's first shadow run)."
    required: false
    default: "false"
  require-all:
    description: "true: a golden with no screenshot fails."
    required: false
    default: "false"
  setup-rust:
    description: "false when the job already installed the pinned cmux-tui toolchain."
    required: false
    default: "true"

outputs:
  pass:
    description: "true or false"
    value: ${{ steps.batch.outputs.pass }}
  report:
    description: Path of report.json (schema cmux-shotdiff.report/v1).
    value: ${{ steps.batch.outputs.report }}

runs:
  using: composite
  steps:
    - name: Set up pinned Rust
      if: ${{ inputs.setup-rust == 'true' }}
      uses: ./.github/actions/setup-cmux-tui-rust

    - name: Build cmux-shotdiff
      shell: bash
      working-directory: cmux-tui
      run: |
        set -euo pipefail
        timeout 900 cargo build --locked --release -p cmux-shotdiff --bin cmux-shotdiff
        echo "CMUX_SHOTDIFF=$PWD/target/release/cmux-shotdiff" >> "$GITHUB_ENV"

    - name: Compare
      id: batch
      shell: bash
      env:
        STORE: ${{ inputs.store }}
        HEADS: ${{ inputs.heads }}
        OUT: ${{ inputs.out }}
        TITLE: ${{ inputs.title }}
        ALLOW_NEW: ${{ inputs.allow-new }}
        REQUIRE_ALL: ${{ inputs.require-all }}
      run: |
        set -uo pipefail
        args=(batch --store "$STORE" --heads "$HEADS" --out "$OUT" --title "$TITLE" --summary "$GITHUB_STEP_SUMMARY")
        [[ "$ALLOW_NEW" != true ]] || args+=(--allow-new)
        [[ "$REQUIRE_ALL" != true ]] || args+=(--require-all)
        status=0
        timeout 600 "$CMUX_SHOTDIFF" "${args[@]}" || status=$?
        echo "report=$OUT/report.json" >> "$GITHUB_OUTPUT"
        if [[ $status -eq 0 ]]; then echo "pass=true" >> "$GITHUB_OUTPUT"; else echo "pass=false" >> "$GITHUB_OUTPUT"; fi
        if [[ $status -eq 1 ]]; then echo "::error::screenshots differ from their goldens: $OUT/report.json, diffs in $OUT/diff/"; fi
        exit "$status"
