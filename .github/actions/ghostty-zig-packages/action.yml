name: Ghostty Zig packages
description: >-
  Hydrate Zig's packages for a Ghostty source with as little network as possible: none when
  every package is already on the machine (a mini's persistent cache), else the cache store
  (keyed by every build.zig.zon of the source), else the deadlined, retried download in
  scripts/ci/fetch-ghostty-zig-packages.sh. Only a push saves what it fetched (never a pull request or pull_request_target run),
  or a workflow_dispatch run of a caller that sets save-on-dispatch.

inputs:
  source:
    description: The Ghostty source directory.
    required: false
    default: ghostty-next
  save-on-dispatch:
    description: >-
      `true` also saves on a workflow_dispatch run. For a dispatch-only workflow (cmux-tui.yml):
      without it, its runs never save. Set it only where a later run restores the save: the
      GitHub store (owned minis) does, per branch. On Blacksmith runners the next dispatch
      run on the same branch missed in 14 of 15 jobs (2026-11-08), so callers there pass it only for the
      one job that restored a save across runs (Rust MSRV).
    required: false
    default: "false"

runs:
  using: composite
  steps:
    # Zig's own default (ZIG_GLOBAL_CACHE_DIR, else %LOCALAPPDATA%\zig on Windows, else
    # $XDG_CACHE_HOME/zig or ~/.cache/zig), so the build after this reads the same place.
    # `present` is true when every hashed package of the source's build.zig.zon files is
    # already unpacked (zig-pkg/<hash>, Zig 0.16) or archived (<cache>/p/<hash>[.tar.gz]).
    - name: Find the Zig package cache
      id: probe
      shell: bash
      env:
        SOURCE: ${{ inputs.source }}
      run: |
        set -euo pipefail
        dir="${ZIG_GLOBAL_CACHE_DIR:-}"
        if [[ -z "$dir" ]]; then
          if [[ "$RUNNER_OS" == Windows ]]; then dir="$LOCALAPPDATA\\zig"; else dir="${XDG_CACHE_HOME:-$HOME/.cache}/zig"; fi
        fi
        # A commented-out dependency (`//     .hash = ...`) is no package: counting it made
        # `present` false on every owned mini, so each run restored and saved the cache it
        # already had. awk reads each manifest on its own and drops a // comment outside a
        # quoted string (a URL's // is inside one), as the seed does. No hash is an empty list.
        hashes="$(find "$SOURCE" -name build.zig.zon -not -path '*/zig-pkg/*' -not -path '*/.zig-cache/*' -print0 \
          | xargs -0 awk '{
              line = $0; code = ""; quoted = 0
              for (i = 1; i <= length(line); i++) {
                c = substr(line, i, 1)
                if (c == "\\" && quoted) { code = code c substr(line, i + 1, 1); i++; continue }
                if (c == "\"") quoted = !quoted
                if (!quoted && c == "/" && substr(line, i + 1, 1) == "/") break
                code = code c
              }
              while (match(code, /\.hash[[:space:]]*=[[:space:]]*"[^"]*"/)) {
                h = substr(code, RSTART, RLENGTH); code = substr(code, RSTART + RLENGTH)
                sub(/^[^"]*"/, "", h); sub(/"$/, "", h); print h
              }
            }' \
          | sort -u)"
        present=true missing=0
        for hash in $hashes; do
          if [[ ! -e "$SOURCE/zig-pkg/$hash" && ! -e "$dir/p/$hash" && ! -e "$dir/p/$hash.tar.gz" ]]; then
            present=false; missing=$((missing + 1))
          fi
        done
        echo "Zig packages: $(wc -w <<<"$hashes" | tr -d ' ') hashed, $missing not on this machine (cache $dir)"
        { echo "dir=$dir"; echo "present=$present"; echo "zig=$("${CMUX_ZIG:-zig}" version)"; } >> "$GITHUB_OUTPUT"

    - name: Restore the Zig packages
      id: restore
      if: ${{ steps.probe.outputs.present != 'true' }}
      uses: ./.github/actions/cache-restore
      with:
        path: ${{ steps.probe.outputs.dir }}/p
        key: ghostty-zig-packages-v1-${{ runner.os }}-zig${{ steps.probe.outputs.zig }}-${{ hashFiles(format('{0}/**/build.zig.zon', inputs.source), format('!{0}/zig-pkg/**', inputs.source)) }}
        # After a build.zig.zon change, an older set still holds most packages: Zig downloads
        # only the new ones, and checks every package against its pinned hash.
        restore-keys: |
          ghostty-zig-packages-v1-${{ runner.os }}-zig${{ steps.probe.outputs.zig }}-

    # On a restore or a machine that has them, Zig unpacks from <cache>/p with no download.
    - name: Fetch the Zig packages (deadlined, retried)
      shell: bash
      run: ./scripts/ci/fetch-ghostty-zig-packages.sh "${{ inputs.source }}"

    - name: Save the Zig packages
      if: ${{ steps.probe.outputs.present != 'true' && steps.restore.outputs.cache-hit != 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' && inputs.save-on-dispatch == 'true') }}
      continue-on-error: true
      uses: ./.github/actions/cache-save
      with:
        path: ${{ steps.probe.outputs.dir }}/p
        key: ghostty-zig-packages-v1-${{ runner.os }}-zig${{ steps.probe.outputs.zig }}-${{ hashFiles(format('{0}/**/build.zig.zon', inputs.source), format('!{0}/zig-pkg/**', inputs.source)) }}
