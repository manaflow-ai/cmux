name = "cmux-next-mobile"
main = "src/index.ts"
account_id = "0c1675e0def6de1ab3a50a4e17dc5656"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = false

# Console logs only. Invocation logs would record request URLs, and the
# deprecated `/v1/signal?token=` form carries a credential in the URL.
[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = false

[vars]
# Stack Auth projects accepted by /v1/auth/stack. The dev project is open to
# anyone who signs up there; it is accepted only while DEV_STACK_ENABLED is
# "true" (Debug builds use it) and never links accounts by email.
STACK_PROJECT_ID = "9790718f-14cd-4f7e-824d-eaf527a82b82"
STACK_DEV_PROJECT_ID = "454ecd03-1db2-4050-845e-4ce5b0cd9895"
DEV_STACK_ENABLED = "true"
APPLE_AUDIENCES = "dev.cmux.next.drawer,dev.cmux.next.tabs"
# Custom URL schemes the OAuth flow may redirect back to.
OAUTH_REDIRECT_SCHEMES = "cmux-next,dev.cmux.next.drawer,dev.cmux.next.tabs"
# Sender address for login codes. Must be on a domain onboarded for
# Cloudflare Email Sending. Empty disables email login (503).
EMAIL_FROM = ""

[[durable_objects.bindings]]
name = "SIGNAL_ROOM"
class_name = "SignalRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SignalRoom"]

# Cloudflare Email Sending. The sender domain is set by EMAIL_FROM.
[[send_email]]
name = "EMAIL"

# Per-IP limit on unauthenticated auth and pairing routes.
[[ratelimits]]
name = "AUTH_LIMITER"
namespace_id = "73141"
simple = { limit = 30, period = 60 }
