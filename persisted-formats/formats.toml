# Every on-disk format the app (Swift) and its webviews leave for the next build to read, and how an update
# crosses it. cmux-tui's formats (the acpmux store, terminal and agent hosts) are in
# cmux-tui/persisted-formats/formats.toml; settings keys in schemas/settings/published-keys.txt and retired-keys.json.
#
# Leo, 2026-11-24 06:03Z (ask-1f9e8b7422): "we need to make sure in the future these kinds of cutovers always have
# proper migrations. in the future." Leo, 2026-11-25: "we need to not only build, but use."
#
# scripts/ci/persisted_formats.py checks this file on every pull request (ci/steps.toml `persisted-formats`).
#
# [[format]]: a version constant, found by `file` (repository-relative) + `const`:
#   Swift       `static let <x>Version = N` under Packages/*/*/Sources and cmux-next-ios/*/Sources whose name says
#               it is stored (Record, Format, Schema, State, Store, Journal, Cache, Snapshot, Ledger, Manifest, Index)
#   TypeScript  `const *_VERSION = N` under webviews/src, unless it says PROTOCOL, WIRE or ABI
# Its `policy` says what an update does with data an older build wrote, as in cmux-tui's registry:
#   migrate     The next build reads it. `fixtures` names a folder under persisted-formats/ of files an older build
#               wrote (v<N>.json, v<N>-2.json ...), never edited or deleted (only below a raised `floor`); the current
#               version has a fixture; `test` names the test (in the Swift package's Tests, or a webviews *.test.ts)
#               that loads every fixture through the real reader.
#   rebuild     Recomputed, or not stored at all; losing it costs time, not work. `why` says so.
#   unreviewed  Listed when this file was made (2026-11-25). A change to its version must give it a policy first.
#               This list only shrinks.
# A constant never goes down, and an entry is never deleted while its constant exists.
#
# [[storage_key]]: a localStorage/sessionStorage key webviews/src names (a `cmux.` string in a *Key/*Prefix
# constant, or a literal passed to getItem/setItem/removeItem). What a key holds is gone after an update once the code
# stops naming it, so renaming a key (a `.v1` to `.v2` cutover) keeps reading the old key once and moves its value
# (the old key stays named, so stays registered), or the old entry says `retired = "why losing it costs no work"`.
# A retired key is never named again, and an entry is never deleted.

