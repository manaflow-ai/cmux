<!doctype html>
<!-- The code editor of the shared page host: cmux-page://cmux.editor/ serves this file from the
     webviews-app build (PageDescriptor.entry). No CSP meta: the scheme handler's header is the
     page's only policy (the strict PageCSP; Monaco and its worker need nothing more). The page asks
     the host for its file (src/pages/editor/host.ts). -->
<html lang="en" data-cmux-page="editor" data-cmux-webview-kind="editor">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Editor</title>
  </head>
  <body>
    <main id="root"></main>
    <script type="module" src="./src/pages/editor/main.tsx"></script>
  </body>
</html>
