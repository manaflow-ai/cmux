<!doctype html>
<!-- One gallery stage: one state of one entry under the controls in the query (frame/main.ts). -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>cmux gallery stage</title>
    <!-- The pages' own sheets zero the body's margin, but they arrive with the module after the first
         paint: on about 4 loads in 10 the body then moved from the browser's 8 px to 0 and the stage
         recorded a 0.0105 layout shift under `body` that no entry made (ui-climb's load-shift check
         dropped arms on it). Zero it before the first paint, as every page's sheet does after. -->
    <style>
      html,
      body {
        margin: 0;
      }
    </style>
  </head>
  <body>
    <main id="root"></main>
    <script type="module" src="./frame/main.ts"></script>
  </body>
</html>
