# cargo-nextest settings for the cmux-tui workspace.
#
# A hung test fails instead of holding a builder: nextest marks a test SLOW
# after each 60 s period and terminates it (TIMEOUT, a failure) after two
# periods. The slowest tests take about 30 s on the rbx builder, so 120 s
# is a 4x margin under load. A test that must run longer sets its own
# override below, with the reason.

[profile.default]
slow-timeout = { period = "60s", terminate-after = 2, grace-period = "5s" }

# Gates and flake measurement: every test runs once (a retry hides a flake),
# all failures are listed, and a JUnit file is written to
# target/nextest/ci/junit.xml.
#   cargo nextest run --workspace --profile ci
[profile.ci]
retries = 0
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 2, grace-period = "5s" }
failure-output = "immediate-final"

[profile.ci.junit]
path = "junit.xml"
