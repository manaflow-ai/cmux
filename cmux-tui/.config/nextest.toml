# cargo-nextest settings for the cmux-tui workspace.
#
# A hung test fails instead of holding a builder: nextest marks a test SLOW
# after each 60 s period and terminates it (TIMEOUT, a failure) after two
# periods. The slowest tests take about 30 s on the rbx builder, so 120 s
# is a 4x margin under load. A test that must run longer sets its own
# override below, with the reason.

[profile.default]
slow-timeout = { period = "60s", terminate-after = 2, grace-period = "5s" }

# Gates and flake measurement: every test runs once (a retry hides a flake),
# all failures are listed, and a JUnit file is written to
# target/nextest/ci/junit.xml.
#   cargo nextest run --workspace --profile ci
[profile.ci]
retries = 0
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 2, grace-period = "5s" }
failure-output = "immediate-final"

[profile.ci.junit]
path = "junit.xml"

# Start the slowest tests first (nextest test priorities, 0.9.91+; higher runs
# first, the default is 0), so none of them starts near the end of a run and
# holds it open alone. Measured on macOS (aws-m4pro, 3 shards of b7b706a0e064):
# the 300-terminal open_file_limit test took 101 s and started last in its
# shard, which ended at 147 s while the other shards ended at 96-99 s. The
# rest of the list took 30-59 s each. A test belongs here when it takes 30 s
# or more on macOS and opens few PTYs (the 100-terminal close_path tests, 47-59
# s, keep the default: started beside the 300-terminal test they slowed it to
# 120 s); a test that waits a fixed 30 s is a bug for its owner
# (cx-ngrtv, cx-086x8), and leaves this list when it is fixed.
[[profile.default.overrides]]
filter = 'test(=cmux_next_owner_runs_300_terminals_with_a_256_open_file_soft_limit)'
priority = 100
# 101 s on a quiet start, 120 s when it started beside the 100-terminal tests
# (4fa5d0fc348d): 240 s keeps a 2x margin; a hang still fails.
slow-timeout = { period = "60s", terminate-after = 4, grace-period = "5s" }

[[profile.default.overrides]]
filter = '''
test(=cmux_next_daemon_idle_has_no_periodic_wakeups)
| test(=cmux_next_daemon_idle_ignores_writes_below_a_missing_settings_folder)
| test(=terminal_creates_under_output_commit_effect_receipts_in_writer_batches)
| test(=machine_provider_runtime::tests::stale_connection_closed_event_preserves_the_current_connection)
| test(=machine_provider_runtime::tests::snapshot_event_replaces_dynamic_ui_with_stable_machine_key)
| test(=machine_provider_runtime::tests::initial_durable_replay_suppresses_the_legacy_snapshot_notice)
'''
priority = 50

# Wall-clock budget tests: the subject of each one is a latency (a ready time,
# a hold time, an adoption time). In a full workspace run every CPU is busy
# beside it and it fails, but it passes alone (2026-10-21 full runs: startup
# 160 ms of a 100 ms budget, a hung login shell 6.0 s of 6 s, an adoption 5.4
# s of 4 s; terminal #8 created in 1.05 s of 1 s, 100 closes in 10.4 s of 10
# s, a restart with 60 terminals answering in 5.3 s). The terminal tests wait
# on F_FULLFSYNC, which macOS runs one at a time for the whole device, so
# every other test daemon's commits queue in front of theirs. They run in the
# timing-alone group and take every test thread, so no other test runs beside
# them; their budgets do not change. Add a test
# only when its subject is latency; a test that fails under load for another
# reason (a shared resource, a race) gets that cause fixed instead.
[test-groups]
timing-alone = { max-threads = 1 }
fork-count-alone = { max-threads = 1 }

[[profile.default.overrides]]
filter = '''
(binary_id(acpmux::startup_load) & test(=a_restart_over_long_chats_loads_within_budget_and_keeps_queues_and_tails))
| (binary_id(acpmux::claude_auth_env) & test(=a_hung_login_shell_holds_agents_at_most_three_seconds))
| (binary_id(acpmux::durable_agents) & test(=a_claude_host_with_a_long_backlog_is_adopted_at_once_and_still_moves_its_work))
| (binary_id(cmux-tui::terminal_host_recovery) & test(=close_path::kitty_create::terminals_created_across_kitty_budget_buckets_start_fast_with_kitty_enabled))
| (binary_id(cmux-tui::terminal_host_recovery) & test(=close_path::closing_one_hundred_terminals_updates_the_tree_at_once_and_ends_every_host))
| (binary_id(cmux-tui::terminal_host_recovery) & test(=restart_with_many_live_terminals_answers_within_budget))
'''
test-group = 'timing-alone'
threads-required = 'num-test-threads'

# The shell-integration fork counts on Linux: a count is the gap in the
# system PID counter, so a process any other test starts in the window
# counts as a fork of the shell. nextest runs each test in its own process;
# this group runs them one at a time, and taking every test thread keeps the
# rest of the run out of their windows. Not on macOS: there the kernel counts
# the shell's own forks (shell_integration/fork_watch.rs) and nothing else on
# the host changes them, so the run stays parallel.
[[profile.default.overrides]]
platform = 'cfg(not(target_os = "macos"))'
filter = 'binary_id(cmux-tui-core) & test(/^shell_integration::fork_count_tests::/)'
test-group = 'fork-count-alone'
threads-required = 'num-test-threads'

# Every platform: a passing fork-count or prompt-redraw test keeps its
# output, so the step log shows its FORK-COUNT line (both counts and how they
# were taken), the bash version it ran, its FORK-COUNT-SKIP and
# PROMPT-REDRAW-SKIP lines (Linux: a shell that is not installed; a skip
# never reads as a pass), and on macOS the pinned-shell build line.
[[profile.default.overrides]]
filter = 'binary_id(cmux-tui-core) & test(/^shell_integration::(fork_count|prompt_redraw)_tests::/)'
success-output = "final"

# macOS: the first bash and fish runs on a host also get the pinned shells
# (scripts/ci/pinned-shell.sh downloads and compiles bash 5.3, and unpacks
# fish; cached after that) before they count or redraw. That time is not
# measured yet: pinned-shell.sh prints it ("ready in N s"); set this margin
# from the first fleet runs. A hang still fails.
[[profile.default.overrides]]
platform = 'cfg(target_os = "macos")'
filter = 'binary_id(cmux-tui-core) & test(/^shell_integration::(fork_count_tests::fork_count|prompt_redraw_tests::prompt_redraw)_(bash|fish)_/)'
slow-timeout = { period = "60s", terminate-after = 4, grace-period = "5s" }

# The lifecycle latency test (perf-10x lifecycle) prints its LIFECYCLE lines
# on stderr; a fleet step shows them only when a passing test's output is kept.
[[profile.ci.overrides]]
filter = 'test(=lifecycle_latency_creates_and_closes_in_a_populated_session)'
success-output = "final"

# Fuzz catalog row h (cmux-remote tests/netdrop_fuzz_e2e.rs) and its red tests print their
# NETDROP lines on stdout; a fleet step shows them only when a passing test's
# output is kept.
[[profile.ci.overrides]]
filter = 'test(/^netdrop_/)'
success-output = "final"

# Fuzz row g (the acpmux crash fuzz, tests/fuzz_crash_durable.rs) prints its FUZZ-G lines on
# stdout; a fleet step shows them only when a passing test's output is kept. One test fuzzes
# three seeds for up to 70 s each and shrinks a failure for up to 90 s more. It does nothing
# outside a fleet step keyed fuzz-g.
[[profile.ci.overrides]]
filter = 'binary_id(acpmux::fuzz_crash_durable)'
success-output = "final"
slow-timeout = { period = "60s", terminate-after = 8, grace-period = "5s" }
