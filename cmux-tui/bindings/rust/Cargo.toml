[package]
name = "cmux-sdk"
version = "1.0.0"
edition.workspace = true
rust-version = "1.88"
license.workspace = true
description = "Typed Rust SDK for the cmux terminal multiplexer"
repository = "https://github.com/manaflow-ai/cmux"
homepage = "https://github.com/manaflow-ai/cmux/tree/main/cmux-tui/bindings/rust"
publish = true

[lib]
name = "cmux"

[lints]
workspace = true

[features]
default = ["socket-path-hash"]
# Derive hashed socket paths for over-long session names (pulls in sha2).
# Embedders that always pass an explicit socket path can turn it off.
socket-path-hash = ["dep:sha2"]
# `cmux::local_socket` on every platform: the local socket transport with its
# same-user checks (on Windows: AF_UNIX, owner-only socket directory, peer
# user and sandbox refusals). The cmux daemon uses the SDK with only this
# feature, so one copy of those checks serves daemon and clients. Adds no
# dependency; on Windows the module is always built (the SDK connects
# through it).
local-socket = []

[dependencies]
base64 = { workspace = true }
getrandom = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
# SHA-256 socket-path digests; see src/socket_hash.rs.
sha2 = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

# Windows: AF_UNIX (uds_windows, as the daemon listens) and the Win32 calls
# of the same-user checks (src/local_socket; plans/cmux-next/windows-daemon.md).
[target.'cfg(windows)'.dependencies]
uds_windows = { workspace = true }
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }

[dev-dependencies]
# tests/catalog_manifest.rs hashes the generated sources in every feature set.
sha2 = { workspace = true }
