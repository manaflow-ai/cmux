[package]
name = "cmux-agent-screen-detection"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
# The package contains manaflow code under GPL-3.0-or-later and detector material
# adapted from herdr under Apache-2.0. Keep both obligations visible to packagers;
# license texts are LICENSE and manifests/LICENSE.
license = "GPL-3.0-or-later AND Apache-2.0"
publish = false

[dependencies]
cmux-sdk = { version = "=1.0.0", path = "../../rust" }
libc = "0.2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"

# This reference package is intentionally independent from the cmux-tui
# workspace. The version is the public SDK contract. The path resolves the
# unreleased SDK in this source tree; a standalone checkout must keep a matching
# SDK checkout at this path or remove `path` after the SDK release.
[workspace]

# The cmux-next app and the npm packages ship this binary, so it is built for
# size the way cmux-tui's release profile is: fat LTO, one codegen unit.
[profile.release]
lto = "fat"
codegen-units = 1
# panic=abort drops the landing pads and unwind cleanup code (CMUX-570, cut 3 of
# cmuxterm-hq docs/perf/bundle-size.md). Nothing here catches a panic (no
# catch_unwind, panic hook or joined-thread result). A panic on a wake-stream thread
# used to end that thread alone and leave the detector without its wakes; now it ends
# the process, and the daemon's plugin supervisor starts it again after its backoff
# (journal_plugin.rs), as after any exit.
panic = "abort"
