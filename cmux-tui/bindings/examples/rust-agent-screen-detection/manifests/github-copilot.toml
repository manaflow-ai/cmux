id = "copilot"
# Local patch 1: detect Copilot's background-agent waiting row. Keep the
# upstream version/date and use a numeric local suffix so a future catalog
# refresh cannot present this rule as an upstream replacement.
version = "2026.07.07.1.1"
min_engine_version = 1
updated_at = "2026-07-07T14:15:00Z"
aliases = ["github-copilot", "ghcs"]

[[rules]]
id = "selection_blocker"
state = "blocked"
priority = 300
region = "whole_recent"
visible_blocker = true
all = [
  { any = [
    { contains = ["esc to cancel"] },
    { contains = ["esc cancel"] },
  ] },
  { any = [
    { contains = ["enter to select"] },
    { contains = ["enter to confirm"] },
    { contains = ["enter to submit"] },
    { contains = ["enter accept"] },
  ] },
]

[[rules]]
id = "background_agents_working"
state = "working"
priority = 110
region = "bottom_non_empty_lines(6)"
visible_working = true
line_regex = ['^\s*◎\s+Waiting for background agents(?:\s|·|$)']

[[rules]]
id = "working_cancel_hint"
state = "working"
priority = 100
region = "whole_recent"
visible_working = true
any = [
  { contains = ["esc to cancel"] },
  { contains = ["esc cancel"] },
  { contains = ["esc again to cancel"] },
  { contains = ["esc interrupt"] }
]
