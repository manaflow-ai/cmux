[package]
name = "cmux-conformance-rust"
version = "0.0.0"
license = "GPL-3.0-or-later"
edition = "2024"
publish = false

[workspace]

[dependencies]
cmux_sdk = { package = "cmux-sdk", path = "../../../../rust" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.clippy]
# cmux-tui/clippy.toml disallows std thread spawns and sleep; this package has not opted in.
disallowed_methods = "allow"
disallowed_types = "allow"
