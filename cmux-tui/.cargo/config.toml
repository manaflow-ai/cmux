[target.x86_64-pc-windows-gnu]
# GNU Binutils 2.47 can finalize Rust stack-probe relocations before it selects
# the libgcc archive member that defines this compiler runtime symbol. Mark the
# symbol required, then scan libgcc again so archive order cannot hide it.
rustflags = [
    "-C",
    "link-arg=-Wl,--undefined=___chkstk_ms",
    "-C",
    "link-arg=-lgcc",
]
