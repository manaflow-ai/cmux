[workspace.package]
# The cmux-next version: the one source of truth for every version surface
# (bundled CLIs, app CFBundleShortVersionString, nightly 1.0.0-nightly.<build>).
# Read by scripts/ci/nightly_version.py next-base; checked on every built app by
# scripts/cmux-next/check-version-surfaces.sh.
version = "1.0.0"
edition = "2024"
rust-version = "1.91"
license = "GPL-3.0-or-later"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_qualifications = "warn"
# `cargo kani` sets cfg(kani) for the proof harnesses in cmux-layout-reducer.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

[workspace.lints.clippy]
uninlined_format_args = "warn"
semicolon_if_nothing_returned = "warn"
redundant_clone = "warn"
# A std/parking_lot guard or RefCell borrow held across `.await` stalls every other locker on the
# runtime's thread until the task is polled again. 0 findings when enabled. "deny", not "warn": pull request
# clippy runs keep warnings soft (scripts/ci/warnings_policy.py), and this one must stay red. Proof:
# crates/cmux-tui-core/tests/lock_scope_lints.rs.
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
# Evaluated and dropped for the same lock-held-across-work class (counts on 2026-11-07's tree, all
# targets): significant_drop_tightening 1742 (and silent on #32326's shape, whose guard is written
# after the commit), significant_drop_in_scrutinee 195, large_futures 330 (311 in acpmux).
# Evaluated and dropped: needless_pass_by_value causes signature churn across cmux-tui-core call sites.

