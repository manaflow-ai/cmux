[workspace.package]
# The cmux-next version: the one source of truth for every version surface
# (bundled CLIs, app CFBundleShortVersionString, nightly 1.0.0-nightly.<build>).
# Read by scripts/ci/nightly_version.py next-base; checked on every built app by
# scripts/cmux-next/check-version-surfaces.sh.
version = "1.0.0"
edition = "2024"
rust-version = "1.91"
license = "GPL-3.0-or-later"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_qualifications = "warn"
# `cargo kani` sets cfg(kani) for the proof harnesses in cmux-layout-reducer.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

[workspace.lints.clippy]
uninlined_format_args = "warn"
semicolon_if_nothing_returned = "warn"
redundant_clone = "warn"
# Evaluated and dropped: needless_pass_by_value causes signature churn across cmux-tui-core call sites.

[workspace.dependencies]
cmux-coderouter = { path = "crates/cmux-coderouter" }
ghostty-vt-sys = { path = "crates/ghostty-vt-sys" }
ghostty-vt = { path = "crates/ghostty-vt" }
cmux-tui-core = { path = "crates/cmux-tui-core" }
cmux-git = { path = "crates/cmux-git" }
cmux-worktree-care = { path = "crates/cmux-worktree-care" }
cmux-feed-core = { path = "crates/cmux-feed-core" }
cmux-layout-reducer = { path = "crates/cmux-layout-reducer" }
cmux-unix-socket = { path = "crates/cmux-unix-socket" }
cmux-panic-log = { path = "crates/cmux-panic-log" }
cmux-agent-pane-policy = { path = "crates/cmux-agent-pane-policy" }
cmux-chat-index = { path = "crates/cmux-chat-index" }
cmux-tui-cdp = { path = "crates/cmux-tui-cdp" }
cmux-pty = { path = "crates/cmux-pty" }
cmux-holder = { path = "crates/cmux-holder" }
cmux-process = { path = "crates/cmux-process" }
cmux-flow-trace = { path = "crates/cmux-flow-trace" }
cmux-remote-protocol = { path = "crates/cmux-remote-protocol" }
cmux-conversation = { path = "crates/cmux-conversation" }
cmux-history = { path = "crates/cmux-history" }
cmux-local-auth = { path = "crates/cmux-local-auth" }
cmux-config = { path = "crates/cmux-config" }
cmux-tui-cloud-conversations = { path = "crates/cmux-tui-cloud-conversations" }
cmux-tui-platform = { path = "crates/cmux-tui-platform" }
cmux-tui-image-paste = { path = "crates/cmux-tui-image-paste" }
cmux-tui-hooks = { path = "crates/cmux-tui-hooks" }
cmux-tui-util = { path = "crates/cmux-tui-util" }
cmux-kitty-media = { path = "crates/cmux-kitty-media" }
cmux-api-compat = { path = "crates/cmux-api-compat" }
cmux-tui-remote-access = { path = "crates/cmux-tui-remote-access" }
cmux-link = { path = "crates/cmux-link" }
cmux-build-identity = { path = "crates/cmux-build-identity" }
cmux-remote = { path = "crates/cmux-remote", default-features = false, features = ["wireguard-transport"] }
cmux-wg = { path = "crates/cmux-wg" }
cmux-server = { path = "crates/cmux-server" }
cmux-server-core = { path = "crates/cmux-server-core" }
cmux-host = { path = "crates/cmux-host" }
cmux-tui-machine-agent-protocol = { path = "crates/cmux-tui-machine-agent-protocol" }
cmux-tui-machine-protocol = { path = "crates/cmux-tui-machine-protocol" }
cmux-app-manifest = { path = "crates/cmux-app-manifest" }
cmux-terminal-iface = { path = "crates/cmux-terminal-iface" }
cmux-app-host = { path = "crates/cmux-app-host", default-features = false }
cmux-terminal-sizing = { path = "crates/cmux-terminal-sizing" }
cmux-mobile-core = { path = "crates/cmux-mobile-core" }
cmux-cloud-wire = { path = "crates/cmux-cloud-wire" }
cmux-vnc = { path = "crates/cmux-vnc" }
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["ws", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
# Same version toml 0.8 already pulls in; used for comment-preserving edits of
# the user's codex config.toml when syncing hook trust state.
toml_edit = "0.22"
portable-pty = "0.9"
crossterm = "0.29"
crossbeam-channel = "0.5"
ratatui = "0.30"
unicode-width = "0.2"
unicode-segmentation = "1"
unicode-normalization = "0.1"
base64 = "0.22"
# In-process WireGuard for Cloud VM attach (crates/cmux-wg). boringtun's
# `noise` module is the sans-IO WireGuard session; no tun device, no ffi.
boringtun = { version = "0.7", default-features = false }
# ip_network is what boringtun already uses for AllowedIPs, so it adds no code.
ip_network = "0.4"
# smoltcp is the userspace TCP/IP stack those tunnels terminate in. Without a
# congestion-control feature it runs with none and bursts a full window into
# any bottleneck; CUBIC is the controller cmux-wg selects.
smoltcp = { version = "0.14", default-features = false, features = ["std", "medium-ip", "proto-ipv4", "proto-ipv6", "socket-tcp", "socket-tcp-cubic", "async"] }
png = "0.17"
libc = "0.2"
memchr = "2"
tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
uds_windows = "1.2"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Threading"] }
regex = "1"
# reqwest and time are already in the dependency graph via iroh; declaring
# them here adds no new transitive code. chatmux-relay uses reqwest for the
# single pairing bootstrap POST and time for enrollment expiry parsing.
# rustls-no-provider: ride the ring provider the tree already enables via
# tungstenite instead of pulling in aws-lc-rs (cmake/nasm native builds).
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
time = { version = "0.3", default-features = false, features = ["parsing", "std"] }
jsonschema = { version = "0.34", default-features = false }
# QuickJS-ng for the app host (one VM per app process). Exact pin: the app
# host is a sandbox boundary, so engine upgrades are deliberate. `allocator`
# lets the host count every byte the VM allocates (32 MiB limit per app).
rquickjs = { version = "=0.14.0", default-features = false, features = ["std", "allocator"] }
flate2 = "1"
bindgen = "0.72"
smallvec = "1"
getrandom = "0.3"
glob = "0.3"
bytes = "1"
diffy = "0.4"
fs4 = "1.1.0"
terminput = "=0.5.11"
terminput-crossterm = { version = "=0.4.7", default-features = false, features = ["crossterm_0_29"] }
futures-util = "0.3"
hmac = "0.12"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1", features = ["service", "tokio"] }
# chatmux-relay workspace verbs: `ignore` is ripgrep's own gitignore walker
# (fs_tree/fs_search stay correct without shelling out to rg), `notify` is
# the cross-platform fs-event backend for the fs_watch stream family.
ignore = "0.4"
notify = "8"
# platform-verifier: iroh-relay verifies relay TLS against the OS trust store
# (Apple Security.framework, Windows, Linux native roots), not its compiled-in
# webpki list, which still trusted the leaked emSign (eMudhra) roots (#25452).
iroh = { version = "1.0.3", default-features = false, features = ["fast-apple-datapath", "portmapper", "tls-ring", "platform-verifier"] }
subtle = "2.6.1"
parking_lot = "0.12"
wait-timeout = "0.2"
# rusqlite 0.40's libsqlite3-sys build script requires Rust 1.95 without
# declaring that MSRV. Keep the workspace's advertised Rust 1.91 support.
rusqlite = { version = "=0.39.0", default-features = false, features = ["bundled", "hooks", "limits"] }
# Unicode normalization for history search folding (cmux-history). Already in
# the graph through url -> idna -> idna_adapter at this version; compiled
# data only, no new transitive code.
icu_normalizer = { version = "2.2", default-features = false, features = ["compiled_data"] }
sha2 = "0.10"
# XML parser for the SVG icon sanitizer (cmux-tui-core). Already in the graph
# through plist at this version; no DTD support, MIT licensed.
quick-xml = { version = "0.41", default-features = false }
# Ed25519 verification of the signed channel manifest (cmux-server-core).
# ring is already in the graph through rustls; this adds no new code.
ring = "0.17"
# TCP keepalive on accepted daemon WebSocket sockets (cmux-tui-core).
socket2 = { version = "0.6", features = ["all"] }
snow = "0.10"
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "handshake", "rustls-tls-native-roots"] }
tokio-util = { version = "0.7", features = ["rt"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["limit", "timeout"] }
hex = "0.4"
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
zeroize = { version = "1", features = ["derive"] }

[patch.crates-io]
# Crossterm 0.29 discards Kitty's shifted key, base-layout key, and associated
# text while parsing CSI-u input. cmux needs those fields to preserve keyboard
# layouts across its shortcut layer and nested terminals.
crossterm = { path = "vendor/crossterm" }
# The cmux Crossterm patch adds `Event::EnhancedKey`. Keep the adapter's
# exhaustive event mapping in the same source-controlled compatibility layer.
terminput-crossterm = { path = "vendor/terminput-crossterm" }

# Fat LTO with one codegen unit, as on main (#19666): the nightly-next client is
# 79 MB stripped on thin LTO. Each release link takes about 2 minutes longer.
[profile.release]
lto = "fat"
codegen-units = 1

# Debug builds are what mux-dev dogfood runs; opt-level 0 makes the
# per-frame render/diff path visibly laggy. Light optimization for our
# code, full for dependencies (ratatui/crossterm do the heavy lifting).
[profile.dev]
opt-level = 1
# opt-level 1 with many codegen units turns on rustc's crate-local ThinLTO,
# which reruns over every codegen unit of the edited crate: 5.3 s of a 9.8 s
# cmux-tui rebuild after a one-line edit (-Z time-passes, crate-split lane 3).
# Off: about 11 s -> 5.5 s per edit; release builds keep lto = "thin".
lto = "off"
# Line tables keep file:line in panics, backtraces and profiles; full DWARF made
# each worktree's target about twice the size (Huge Blue, 10-19: 11 GB -> 5.4 GB
# cold, with cold builds 360 s -> 251 s). Use `debug = true` locally to step
# through locals in a debugger.
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false

# acpmux's own code does not make its tests faster when optimized (rbx,
# 2026-10-17: cargo nextest -p acpmux 16.2 s at opt-level 1, 16.5 s at 0), but
# optimizing it is most of the edit loop: an edit in acpmux rebuilt its test
# library in 24.5 s at opt-level 1 and 4.4 s at 0. cmux-tui-core keeps 1: its
# tests take 16.1 s at 1 and 30.0 s at 0. Measure a package the same way
# before it joins this list.
[profile.dev.package.acpmux]
opt-level = 0

# The JSON rewriter sits on every translated daemon message; tests and the
# Rex parity bench (tests/rex_parity_bench.rs) measure it optimized.
[profile.dev.package.cmux-api-compat]
opt-level = 3
