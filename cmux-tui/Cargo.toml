cmux-tui-machine-agent-protocol = { path = "crates/cmux-tui-machine-agent-protocol" }
cmux-tui-machine-protocol = { path = "crates/cmux-tui-machine-protocol" }
cmux-app-manifest = { path = "crates/cmux-app-manifest" }
cmux-terminal-iface = { path = "crates/cmux-terminal-iface" }
cmux-app-host = { path = "crates/cmux-app-host", default-features = false }
cmux-terminal-sizing = { path = "crates/cmux-terminal-sizing" }
cmux-mobile-core = { path = "crates/cmux-mobile-core" }
cmux-cloud-wire = { path = "crates/cmux-cloud-wire" }
cmux-cloud-disk = { path = "crates/cmux-cloud-disk" }
cmux-vnc = { path = "crates/cmux-vnc" }
cmux-computer-use = { path = "crates/cmux-computer-use", default-features = false }
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["ws", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
indexmap = "2"
toml = "0.8"
# Same version toml 0.8 already pulls in; used for comment-preserving edits of
# the user's codex config.toml when syncing hook trust state.
toml_edit = "0.22"
portable-pty = "0.9"
crossterm = "0.29"
crossbeam-channel = "0.5"
ratatui = "0.30"
# ratatui-core 0.1 adds one cell for each halfwidth katakana sound mark
# (U+FF9E, U+FF9F) because unicode-width gave them 0; unicode-width 0.2.3
# gives them 1 itself, so with 0.2.3 each mark takes 2 cells in every layout
# and table. Lift this bound together with a ratatui-core that drops its
# own adjustment.
unicode-width = ">=0.2.2, <0.2.3"
unicode-segmentation = "1"
unicode-normalization = "0.1"
base64 = "0.22"
# In-process WireGuard for Cloud VM attach (crates/cmux-wg). boringtun's
# `noise` module is the sans-IO WireGuard session; no tun device, no ffi.
boringtun = { version = "0.7", default-features = false }
# ip_network is what boringtun already uses for AllowedIPs, so it adds no code.
ip_network = "0.4"
# smoltcp is the userspace TCP/IP stack those tunnels terminate in. Without a
# congestion-control feature it runs with none and bursts a full window into
# any bottleneck; CUBIC is the controller cmux-wg selects.
smoltcp = { version = "0.14", default-features = false, features = ["std", "medium-ip", "proto-ipv4", "proto-ipv6", "socket-tcp", "socket-tcp-cubic", "socket-tcp-bbr", "async"] }
png = "0.17"
libc = "0.2"
# One poller for every idle terminal-host link (cmux-tui-core surface/idle_links.rs); tokio
# already links mio with these features.
mio = { version = "1", features = ["os-poll", "os-ext"] }
memchr = "2"
# SIMD UTF-8 validation for ghostty-vt's neutral-run scan; already in the
# graph via tokio-websockets and encoding_rs, so no new transitive code.
simdutf8 = "0.1.5"
tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
# Debug-only daemon hot-patching (cmux-tui-core feature `hotpatch`); pinned to
# the Dioxus CLI that sends the patches (dx 0.7.10).
subsecond = "=0.7.10"
uds_windows = "1.2"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Threading"] }
regex = "1"
# A cache the caller owns (`cmux-local-url`): `regex::Regex` keeps one per thread that ever searched.
regex-automata = "0.4"
# reqwest and time are already in the dependency graph via iroh; declaring
# them here adds no new transitive code. chatmux-relay uses reqwest for the
# single pairing bootstrap POST and time for enrollment expiry parsing.
# rustls-no-provider: ride the ring provider the tree already enables via
# tungstenite instead of pulling in aws-lc-rs (cmake/nasm native builds).
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
time = { version = "0.3", default-features = false, features = ["parsing", "std"] }
jsonschema = { version = "0.34", default-features = false }
# QuickJS-ng for the app host (one VM per app process). Exact pin: the app
# host is a sandbox boundary, so engine upgrades are deliberate. `allocator`
# lets the host count every byte the VM allocates (32 MiB limit per app).
rquickjs = { version = "=0.14.0", default-features = false, features = ["std", "allocator"] }
flate2 = "1"
# Journal segments at rest (`zstd-json-v1`). No dictionary builder: whole-segment
# frames compress the repeated records better than per-record dictionaries.
zstd = { version = "0.13", default-features = false }
bindgen = "0.72"
smallvec = "1"
getrandom = "0.3"
glob = "0.3"
bytes = "1"
diffy = "0.4"
fs4 = "1.1.0"
terminput = "=0.5.11"
terminput-crossterm = { version = "=0.4.7", default-features = false, features = ["crossterm_0_29"] }
futures-util = "0.3"
hmac = "0.12"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1", features = ["service", "tokio"] }
# chatmux-relay workspace verbs: `ignore` is ripgrep's own gitignore walker
# (fs_tree/fs_search stay correct without shelling out to rg), `notify` is
# the cross-platform fs-event backend for the fs_watch stream family.
ignore = "0.4"
notify = "8"
# platform-verifier: iroh-relay verifies relay TLS against the OS trust store
# (Apple Security.framework, Windows, Linux native roots), not its compiled-in
# webpki list, which still trusted the leaked emSign (eMudhra) roots (#25452).
iroh = { version = "1.0.3", default-features = false, features = ["fast-apple-datapath", "portmapper", "tls-ring", "platform-verifier"] }
subtle = "2.6.1"
parking_lot = "0.12"
# One-load published snapshots (cmux-tui-core `published.rs`, R-DAEMON-STATE); already in the tree through iroh-dns.
arc-swap = "1.9"
# Persistent maps: the peers' rows (acpmux `hub/remote_rows.rs`) clone in O(1), so a writer
# changes a structurally shared copy while readers hold a published snapshot (`remote_table.rs`).
imbl = "7"
wait-timeout = "0.2"
# rusqlite 0.40's libsqlite3-sys build script requires Rust 1.95 without
# declaring that MSRV. Keep the workspace's advertised Rust 1.91 support.
rusqlite = { version = "=0.39.0", default-features = false, features = ["bundled", "cache", "hooks", "limits"] }
# Unicode normalization for history search folding (cmux-history). Already in
# the graph through url -> idna -> idna_adapter at this version; compiled
# data only, no new transitive code.
icu_normalizer = { version = "2.2", default-features = false, features = ["compiled_data"] }
# Git blob ids of prefetched files (acpmux hub/prefetch.rs). Already in the
# graph at this version (RustCrypto, beside sha2).
sha1 = "0.10"
sha2 = "0.10"
tar = "0.4"
# XML parser for the SVG icon sanitizer (cmux-tui-core). Already in the graph
# through plist at this version; no DTD support, MIT licensed.
quick-xml = { version = "0.41", default-features = false }
# Ed25519 verification of the signed channel manifest (cmux-server-core).
# ring is already in the graph through rustls; this adds no new code.
ring = "0.17"
# TCP keepalive on accepted daemon WebSocket sockets (cmux-tui-core).
socket2 = { version = "0.6", features = ["all"] }
snow = "0.10"
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "handshake", "rustls-tls-native-roots"] }
tokio-util = { version = "0.7", features = ["rt"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["limit", "timeout"] }
hex = "0.4"
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
zeroize = { version = "1", features = ["derive"] }

[patch.crates-io]
# Crossterm 0.29 discards Kitty's shifted key, base-layout key, and associated
# text while parsing CSI-u input. cmux needs those fields to preserve keyboard
# layouts across its shortcut layer and nested terminals.
crossterm = { path = "vendor/crossterm" }
# The cmux Crossterm patch adds `Event::EnhancedKey`. Keep the adapter's
# exhaustive event mapping in the same source-controlled compatibility layer.
terminput-crossterm = { path = "vendor/terminput-crossterm" }
# smoltcp 0.14.0 starts CUBIC at 2 × 1024 bytes; the cmux patch starts it at
# RFC 6928's 10 segments (vendor/smoltcp/CMUX_PATCH.md).
smoltcp = { path = "vendor/smoltcp" }

# Thin LTO with one codegen unit (Leo, 2026-11-14: "yes"). Every NEXT nightly
# waits on this build, so its time is merge-to-feed time. Built natively on one
# fleet Mac (aarch64-apple-darwin), thin took 653 s against fat's 871 s (-25%);
# the stripped binary grew 116.5 -> 133.3 MB (xz 34.61 -> 36.28 MB) and CLI p50
# went ~4.93 -> ~5.20 ms. #27830 measured thin with 16 codegen units on x86_64
# at +24% size; the package overrides below keep one unit per heavy crate.
# cmux-tui-build-package.yml's `lto: fat` input means "this profile"; its
# `lto: thin` is the machine channel's LTO-off build.
#
# opt-level "z" everywhere, with the hot path kept at 3 (goal bundle-size-falls,
# CMUX-570; Leo: "decreasing bundle size"). Cross-built for aarch64-apple-darwin
# on the fleet Linux pool at 618a36c442d4 (scripts/measure/optlevel-size.sh on
# lane/bundle-size-falls-optlevel-exp): fully stripped 139.16 -> 115.47 MB
# (-23.7), strip -x 146.24 -> 137.65 MB (-8.6), xz 41.14 -> 40.08 MB. "s"
# instead of "z" saved only 4.7 MB stripped and grew the strip -x file by
# 6.3 MB. The hot list: the per-frame render/diff path (cmux-tui-core,
# ghostty-vt, ghostty-vt-sys, ratatui, ratatui-core, crossterm), the runtime
# (tokio) and the JSON rewriter on every translated daemon message
# (cmux-api-compat). acpmux (19.1 MiB of .text, the largest crate) goes to "z".
# A crate joins the hot list only with a bench that shows "z" costs it more
# than noise.
[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1

[profile.release.package.cmux-tui]
opt-level = "z"
codegen-units = 1

[profile.release.package.cmux-tui-core]
opt-level = 3
codegen-units = 1

[profile.release.package.ghostty-vt]
opt-level = 3

[profile.release.package.ghostty-vt-sys]
opt-level = 3

[profile.release.package.tokio]
opt-level = 3

[profile.release.package.ratatui]
opt-level = 3

[profile.release.package.ratatui-core]
opt-level = 3

[profile.release.package.crossterm]
opt-level = 3

[profile.release.package.cmux-api-compat]
opt-level = 3

[profile.release.package.acpmux]
codegen-units = 1

# The agent service v2 gates (god against small, 1.2x) in `acpmux`'s own tests
# build here: `cargo test --profile gate -p acpmux --lib NAME -- --ignored`. It is release's
# code generation without its link-time cost. A release test build of `acpmux`
# does not end on an 8-vCPU CI runner: with one codegen unit rustc for the test
# library was killed (signal 9) after 16 minutes under fat LTO, and with LTO off
# by environment it still ran past 40 minutes, because the package override
# above keeps `acpmux` at one unit. A gate is a ratio of two sides measured in
# one build, so it does not need the shipped binary's size settings. Nothing
# ships from this profile, so it keeps opt-level 3: the gates time optimized
# code, and release's "z" would change what they time.
[profile.gate]
inherits = "release"
opt-level = 3
lto = "off"
codegen-units = 16

[profile.gate.package.acpmux]
codegen-units = 16

# A custom profile inherits its parent's package overrides too, so every
# `[profile.release.package.X]` above that sets codegen-units = 1 needs its
# line here. cmux-tui-core at one unit (from #47836) made its gate test build
# take 35 minutes, and the v2 gate step ran out its limit before the last group
# (acpmux-v2-connection, the `v2.pr04.*` rows) started. cmux-tui gets opt-level
# 3 too: the gates time optimized code, not release's "z".
# test_gate_profile_overrides_every_single_unit_release_package keeps this whole.
[profile.gate.package.cmux-tui-core]
codegen-units = 16

[profile.gate.package.cmux-tui]
opt-level = 3
codegen-units = 16

# Debug builds are what mux-dev dogfood runs; opt-level 0 makes the
# per-frame render/diff path visibly laggy. Light optimization for our
# code, full for dependencies (ratatui/crossterm do the heavy lifting).
[profile.dev]
opt-level = 1
# opt-level 1 with many codegen units turns on rustc's crate-local ThinLTO,
# which reruns over every codegen unit of the edited crate: 5.3 s of a 9.8 s
# cmux-tui rebuild after a one-line edit (-Z time-passes, crate-split lane 3).
# Off: about 11 s -> 5.5 s per edit; release builds use fat LTO for size.
lto = "off"
# Line tables keep file:line in panics, backtraces and profiles; full DWARF made
# each worktree's target about twice the size (Huge Blue, 10-19: 11 GB -> 5.4 GB
# cold, with cold builds 360 s -> 251 s). Use `debug = true` locally to step
# through locals in a debugger.
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false

# acpmux's own code does not make its tests faster when optimized (rbx,
# 2026-10-17: cargo nextest -p acpmux 16.2 s at opt-level 1, 16.5 s at 0), but
# optimizing it is most of the edit loop: an edit in acpmux rebuilt its test
# library in 24.5 s at opt-level 1 and 4.4 s at 0. cmux-tui-core keeps 1: its
# tests take 16.1 s at 1 and 30.0 s at 0. Measure a package the same way
# before it joins this list.
[profile.dev.package.acpmux]
opt-level = 0

# The JSON rewriter sits on every translated daemon message; tests and the
# Rex parity bench (tests/rex_parity_bench.rs) measure it optimized.
[profile.dev.package.cmux-api-compat]
opt-level = 3
