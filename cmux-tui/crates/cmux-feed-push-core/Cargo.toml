[package]
name = "cmux-feed-push-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Feed push rules shared by the Mac and the phones: the approve proof's signed bytes, banner categories and actions, the answer each action sends, the /v1/ops bodies and replies (was Packages/Shared/CmuxFeedPushCore)"

[lints]
workspace = true

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
# Device names are cut on a character (grapheme cluster) boundary, as Swift does.
unicode-segmentation.workspace = true
