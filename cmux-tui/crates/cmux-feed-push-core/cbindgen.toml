# include/cmux_feed_push.h is cbindgen's output for src/ffi.rs (the one
# file it reads, so no other item of the crate reaches the header).
# cmux-app-ffi's tests/feed_push_header.rs regenerates it and fails with
# the diff when the committed header differs;
# CMUX_APP_FFI_HEADER_BLESS=1 cargo test --test feed_push_header
# (in cmux-tui/crates/cmux-app-ffi) rewrites it.
language = "C"
include_guard = "CMUX_FEED_PUSH_H"
header = """
/* The feed push rules of the cmux apps (cmux-tui/crates/cmux-feed-push-core,
 * src/ffi.rs): the approve proof's signed bytes, the banner categories and
 * actions, the answer each action sends, the /v1/ops bodies and replies.
 * Every rule is a JSON op of cmux_feed_push_call (src/ops.rs lists them). */"""
autogen_warning = """
/* Generated by cbindgen (cmux-tui/crates/cmux-feed-push-core/cbindgen.toml); do not edit.
 * Regenerate: CMUX_APP_FFI_HEADER_BLESS=1 cargo test --test feed_push_header (cmux-app-ffi) */"""
sys_includes = ["stdbool.h", "stddef.h", "stdint.h"]
no_includes = true
usize_is_size_t = true
style = "type"
documentation_style = "c"
line_length = 120
tab_width = 4

[export]
item_types = ["constants", "structs", "opaque", "functions"]
