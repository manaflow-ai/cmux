[package]
name = "cmux-git"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "The git reads and checkpoint writes cmux runs: bounded git runs, a repository handle, parsers, diff scopes and branch refs. No terminal dependencies, so the diff sidecar links it too."

[lints]
workspace = true

[dependencies]
# git runs spawn through it: no inherited descriptor, and the child's class
# (`HELPER_CHILD`) set on the spawn, not the calling thread's.
cmux-process.workspace = true
cmux-threads.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true
