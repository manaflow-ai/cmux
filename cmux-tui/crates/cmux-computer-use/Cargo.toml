[package]
name = "cmux-computer-use"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# cmux Computer Use is its own MIT-licensed component so it can ship on every
# platform on its own (docs/computer-use/README.md, "Licensing").
license = "MIT"
publish.workspace = true
description = "cmux Computer Use: the platform-agnostic engine (tools, policy, sessions, frames) and the macOS, Windows and Linux desktops"

[lints]
workspace = true

[features]
default = ["desktop"]
# The real platform desktops. Without it the crate is the engine only
# (acpmux links it for the tool catalog and the wire types).
desktop = ["dep:x11rb", "dep:windows"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
png = { workspace = true }
libc = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.14", optional = true, features = ["xtest", "randr", "composite"] }

[target.'cfg(target_os = "macos")'.dependencies]
# NSWorkspace / NSRunningApplication messages and the launch completion
# block. CoreFoundation, CoreGraphics and Accessibility are plain C, declared
# in src/platform/macos/sys.rs.
objc2 = "0.6"
block2 = "0.6"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", optional = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_Storage_Xps",
] }

[dev-dependencies]
