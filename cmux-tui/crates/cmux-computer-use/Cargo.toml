[package]
name = "cmux-computer-use"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# cmux Computer Use is its own MIT-licensed component so it can ship on every
# platform on its own (docs/computer-use/README.md, "Licensing").
license = "MIT"
publish.workspace = true
description = "cmux Computer Use: the platform-agnostic engine (tools, policy, sessions, frames) and the macOS, Windows and Linux desktops"

[lints]
workspace = true

[features]
default = ["desktop", "server"]
# The real platform desktops. Without it the crate is the engine only
# (acpmux links it for the tool catalog and the wire types).
desktop = ["dep:x11rb", "dep:windows"]
# The worker side: the agent socket server (server.rs) and the worker's
# control channel (worker.rs). acpmux and the daemon leave it off.
server = ["dep:windows-sys"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
png = { workspace = true }
libc = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.14", optional = true, features = ["xtest", "randr", "composite"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", optional = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_Storage_Xps",
] }

# The agent socket's named pipe (server/windows.rs).
[target.'cfg(windows)'.dependencies.windows-sys]
workspace = true
optional = true
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
]

[dev-dependencies]
