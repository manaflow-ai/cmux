[package]
name = "cmux-launch-preread"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "The login-time pre-read of cmux NEXT (app.backgroundReady = warmAtLogin, off by default): reads the app's executable and frameworks once into the page cache, bounded by bytes and wall time, and exits. std and libc only"

[lints]
workspace = true

[[bin]]
name = "cmux-launch-preread"
path = "src/main.rs"

# setpriority(PRIO_DARWIN_PROCESS, 0, PRIO_DARWIN_BG) and syslog(3) on macOS.
[target.'cfg(target_os = "macos")'.dependencies]
libc.workspace = true
