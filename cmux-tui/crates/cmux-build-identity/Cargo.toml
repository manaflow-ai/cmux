[package]
name = "cmux-build-identity"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "The cmux-tui build identity (HEAD, plus a hash of the dirty source tree), in a leaf crate so a source edit does not recompile cmux-remote"

[lints]
workspace = true

[build-dependencies]
# This root package uses Cargo's Git-aware default fingerprint to notice new
# workspace-root files without recursively walking target/.
cmux-tui-source-watch = { path = "../.." }
