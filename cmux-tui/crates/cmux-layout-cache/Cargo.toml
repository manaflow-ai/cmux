[package]
name = "cmux-layout-cache"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "GPL-3.0-or-later"
publish = false
workspace = "../cmux-app-ffi"
description = "Every window's last computed layout (frames, splits, tab strip, sidebar rows, scroll anchors, theme) kept across restarts, so the launch draws it already placed instead of recomputing and settling; the app only measures and draws"

[dependencies]
serde = { version = "1", features = ["derive"] }
# float_roundtrip: a cached frame reads back as the very `f64` written, or "zero move" is a rounding away from true.
serde_json = { version = "1", features = ["float_roundtrip"] }

[dev-dependencies]
proptest = "1"
