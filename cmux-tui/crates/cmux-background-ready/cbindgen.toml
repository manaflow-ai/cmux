# cmux-app-ffi/include/cmux_background_ready.h is cbindgen's output for src/ffi.rs (the one
# file it reads, so no other item of the crate reaches the header).
# cmux-app-ffi's tests/background_ready_header.rs regenerates it and fails with
# the diff when the committed header differs;
# CMUX_APP_FFI_HEADER_BLESS=1 cargo test --test background_ready_header
# (in cmux-tui/crates/cmux-app-ffi) rewrites it.
language = "C"
include_guard = "CMUX_BACKGROUND_READY_H"
header = """
/* cmux NEXT's background ready copy (setting app.backgroundReady, off by
 * default): the owner of its decisions (cmux-tui/crates/cmux-background-ready,
 * src/ffi.rs). Swift is the window and AppKit glue: it asks these functions
 * whether a quit stays hidden, how the hidden copy holds its windows, whether
 * to register the login item, what a launch does, when the hidden copy exits
 * for an update and whether Chromium warms up. Every value is a uint8_t or a
 * bool; no memory crosses the boundary. */"""
autogen_warning = """
/* Generated by cbindgen (cmux-tui/crates/cmux-background-ready/cbindgen.toml); do not edit.
 * Regenerate: CMUX_APP_FFI_HEADER_BLESS=1 cargo test --test background_ready_header (cmux-app-ffi) */"""
sys_includes = ["stdbool.h", "stdint.h"]
no_includes = true
style = "type"
documentation_style = "c"
line_length = 120
tab_width = 4

[export]
item_types = ["constants", "functions"]
