[package]
name = "cmux-sync"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "One sync engine for chat and session state, and presence: hybrid logical clocks, a delta-state last-writer-wins map that merges offline edits without conflicts, version vectors for have/want delta sync, and a who's-here table (pure, no I/O)"

[lints]
workspace = true

[dependencies]
serde.workspace = true
# A synced revision is content-addressed: its id is the SHA-256 of its bytes (two_way.rs).
sha2.workspace = true

[dev-dependencies]
serde_json.workspace = true
# The two-way tests merge text by line with a real diff3, as the host does.
diffy.workspace = true
