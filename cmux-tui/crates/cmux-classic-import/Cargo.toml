[package]
name = "cmux-classic-import"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "The one-time move from classic cmux: reads classic's saved session (bounded against a damaged or hostile file), finds which save to read, decides whether a launch runs, plans what a run makes, and keeps the migration ledger and backups so upgrade, downgrade and upgrade again never duplicate a workspace."

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = "3"
