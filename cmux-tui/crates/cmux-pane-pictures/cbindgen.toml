# include/cmux_pane_pictures.h is cbindgen's output for src/ffi.rs (the one file
# it reads, so no other item of the crate reaches the header).
# cmux-app-ffi's tests/pane_pictures_header.rs regenerates it and fails with the
# diff when the committed header differs;
# CMUX_APP_FFI_HEADER_BLESS=1 cargo test --test pane_pictures_header
# (in cmux-tui/crates/cmux-app-ffi) rewrites it.
language = "C"
include_guard = "CMUX_PANE_PICTURES_H"
header = """
/* When a pane's live thumbnail must be captured again (cmux-tui/crates/cmux-pane-pictures,
 * src/ffi.rs): after the content changed, leading edge then throttled, one capture in flight.
 * The app captures; the caller passes the clock and arms one timer. */"""
autogen_warning = """
/* Generated by cbindgen (cmux-tui/crates/cmux-pane-pictures/cbindgen.toml); do not edit.
 * Regenerate: CMUX_APP_FFI_HEADER_BLESS=1 cargo test --test pane_pictures_header (cmux-app-ffi) */"""
sys_includes = ["stdbool.h", "stddef.h", "stdint.h"]
no_includes = true
usize_is_size_t = true
style = "type"
documentation_style = "c"
line_length = 120
tab_width = 4

[export]
item_types = ["constants", "structs", "opaque", "functions"]
