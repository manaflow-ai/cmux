# include/cmux_health.h is cbindgen's output for src/ffi.rs (the one file it
# reads, so no other item of the crate reaches the header).
# cmux-app-ffi's tests/health_header.rs regenerates it and fails with the diff
# when the committed header differs;
# CMUX_APP_FFI_HEADER_BLESS=1 cargo test --test health_header
# (in cmux-tui/crates/cmux-app-ffi) rewrites it.
language = "C"
include_guard = "CMUX_HEALTH_H"
header = """
/* The cmux app's health model (cmux-tui/crates/cmux-health-core,
 * src/ffi.rs): which part is slow, stuck or failed, the repair ladder,
 * pending user actions and the receipts the status indicator shows. Every
 * rule is a JSON op of cmux_health_call (src/ops.rs lists them). */"""
autogen_warning = """
/* Generated by cbindgen (cmux-tui/crates/cmux-health-core/cbindgen.toml); do not edit.
 * Regenerate: CMUX_APP_FFI_HEADER_BLESS=1 cargo test --test health_header (cmux-app-ffi) */"""
sys_includes = ["stdbool.h", "stddef.h", "stdint.h"]
no_includes = true
usize_is_size_t = true
style = "type"
documentation_style = "c"
line_length = 120
tab_width = 4

[export]
item_types = ["constants", "structs", "opaque", "functions"]
