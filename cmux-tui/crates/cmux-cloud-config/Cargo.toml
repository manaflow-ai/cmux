[package]
name = "cmux-cloud-config"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "NEXT Cloud's configuration rules (pure; the macOS app asks them over the app FFI, the cmux vm CLI links them): the backend pick, the auth rules around the Keychain, and the VM agent-key mint"

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
unicode-segmentation = { workspace = true }

[dev-dependencies]
# The selection a fresh build resolves, for the sign-in allowlist test (stack_redirects_tests.rs).
cmux-cloud-environment = { workspace = true }

[lints]
workspace = true
