[package]
name = "cmux-cellgrid-bench"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false
description = "Measures a terminal pane streamed as VT bytes, as render-delta cell diffs and as H.264 video, on the same recorded workload: bytes per second, keystroke-to-render, exact text and colour error (HQ#7146 G5)"

# Own workspace, as cmux-rd-host: it builds OpenH264 from source for its decoder
# and a font rasterizer, which the cmux-tui workspace build should never pull in.
[workspace]

[[bin]]
name = "cmux-cellgrid-bench"
path = "src/main.rs"

[dependencies]
ghostty-vt = { path = "../ghostty-vt" }
cmux-encode = { path = "../cmux-encode", features = ["openh264-source"] }
openh264 = { version = "=0.9.8", default-features = false, features = ["source"] }
fontdue = "0.9"
unicode-width = "0.2"
flate2 = "1"
serde_json = "1"

[profile.release]
debug = 1
