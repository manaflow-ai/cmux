[package]
name = "cmux-cloud-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "NEXT Cloud's API calls (classic /api/runs, the API Worker's person routes, previews, machine files and exec): one library the cmux daemon's cloud.* ops and the cmux CLI share"

[dependencies]
base64.workspace = true
bytes.workspace = true
cmux-cloud-client.workspace = true
cmux-cloud-machine.workspace = true
reqwest = { workspace = true, features = ["stream"] }
rustls.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
cmux-json.workspace = true
sha2.workspace = true
tempfile = "3"
tokio = { workspace = true, features = ["time", "rt"] }
uuid.workspace = true
zeroize.workspace = true

[dev-dependencies]
# Paused time: the preview deadline tests run in no wall time.
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
