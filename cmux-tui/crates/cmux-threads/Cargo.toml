[package]
name = "cmux-threads"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Named threads with a declared QoS (Chrome's ThreadType table) and a process-wide thread registry: std and libc only (crossbeam-channel behind the crossbeam feature)"

[lints]
workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[features]
# Wrapped crossbeam channels (cmux_threads::sync::crossbeam) for crates that use crossbeam-channel.
crossbeam = ["dep:crossbeam-channel"]

[dependencies]
crossbeam-channel = { workspace = true, optional = true }
