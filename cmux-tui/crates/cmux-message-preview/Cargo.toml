[package]
name = "cmux-message-preview"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "A message's Markdown as the one line a preview shows (the daemon's Home rows, the Chief's push): the Rust port of CmuxHomeCore's MessagePreview, held to the same case file"

[dependencies]
# home_table walks text by grapheme, as Swift walks a String's Characters.
unicode-segmentation.workspace = true

[dev-dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[lints]
workspace = true
