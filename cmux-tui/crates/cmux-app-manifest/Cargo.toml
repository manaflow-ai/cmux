[package]
name = "cmux-app-manifest"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "cmux app manifest v2 validator: the one validator for the CLI, the app supervisor and the registry"

[lints]
workspace = true

[dependencies]
# The typed app global compiled in compressed (src/capabilities.rs).
cmux-embed.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
jsonschema.workspace = true
regex.workspace = true
# contributes.wallpapers (package.rs): the manifest check; the program check only
# with the feature wallpaper-programs below.
cmux-wallpaper = { path = "../cmux-wallpaper" }

[features]
# The WGSL program check of `contributes.wallpapers` (naga, about 1.8 MB):
# author tooling only. Without it validate_package checks each wallpaper's
# folder, wallpaper.json and program size, and reports the program as
# `wallpaper.programNotChecked` (a warning). The app, the daemon and the CLI
# (cmux-tui, cmux-tui-core, cmux-customize) never turn it on.
wallpaper-programs = ["cmux-wallpaper/compile"]

[dev-dependencies]
# The tests check programs too (tests/fixtures.rs, tests/wallpaper_memory.rs).
# A dev-dependency's features reach only test builds, never a shipped binary.
cmux-wallpaper = { path = "../cmux-wallpaper", features = ["compile"] }
