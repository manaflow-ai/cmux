[package]
name = "cmux-browser-rules"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "The browser pane's rules for the cmux macOS app, out of its Swift: where a clicked or page-requested link opens (the link click mapping and the Chromium window policy) and the typed address rules (top-level domains, the typo fix, the https upgrade fallback), the omnibox calculator, and browser profiles (which profile a tab gets, the profile book, proxies, off-the-record lifetime). Pure: the app reports the facts and applies the result"

[lints]
workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
unicode-segmentation.workspace = true
