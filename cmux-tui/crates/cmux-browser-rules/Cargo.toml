[package]
name = "cmux-browser-rules"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "The browser pane's rules for the cmux macOS app, out of its Swift: where a clicked or page-requested link opens (the link click mapping and the Chromium window policy), the typed address rules (top-level domains, the typo fix, the https upgrade fallback), the omnibox calculator and the tab state machine. Pure: the app reports the facts and applies the result"

[lints]
workspace = true

[dependencies]
# Foundation's URL parts, for the URL filter (src/url_filter.rs).
cmux-url-input.workspace = true
serde.workspace = true
serde_json.workspace = true
