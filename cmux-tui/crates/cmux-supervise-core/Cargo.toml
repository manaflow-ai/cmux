[package]
name = "cmux-supervise-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "One supervisor contract for cmux Remote and Cloud: an owner record written before start, restarts only through the restart command and only on proof, an intentional stop that never respawns, a persisted per-day restart budget, a death event, and a make-before-break swap"

[lints]
workspace = true

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
cmux-process.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# The one-pid start read (`process_start`), shared with the daemon: no /proc read of our own.
cmux-tui-platform.workspace = true
