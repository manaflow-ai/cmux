# include/cmux_system_calendar.h is cbindgen's output for src/system_calendar.rs alone (no other item of
# the crate reaches it). tests/system_calendar_header.rs regenerates it and fails with the
# diff when the committed header differs;
# CMUX_APP_FFI_HEADER_BLESS=1 cargo test --test system_calendar_header rewrites it.
language = "C"
include_guard = "CMUX_SYSTEM_CALENDAR_H"
header = """
/* The system_calendar.* app ops' rules (cmux-tui/crates/cmux-app-ffi,
 * src/system_calendar.rs): params, the window to read and the answer an app
 * gets, as JSON ops of cmux_system_calendar_call. EventKit stays in the app. */"""
autogen_warning = """
/* Generated by cbindgen (cmux-tui/crates/cmux-app-ffi/cbindgen-system-calendar.toml); do not edit.
 * Regenerate: CMUX_APP_FFI_HEADER_BLESS=1 cargo test --test system_calendar_header (cmux-app-ffi) */"""
sys_includes = ["stdbool.h", "stddef.h", "stdint.h"]
no_includes = true
usize_is_size_t = true
style = "type"
documentation_style = "c"
line_length = 120
tab_width = 4

[export]
item_types = ["constants", "structs", "opaque", "functions", "typedefs"]
