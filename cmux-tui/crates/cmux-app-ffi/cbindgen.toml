# include/cmux_motion_ffi.h is generated from src/motion.rs, src/hover.rs and
# cmux-motion's hover::c structs by cbindgen (the dev-dependency pinned in
# Cargo.toml). tests/c_header.rs regenerates it and fails with the diff when
# the committed header differs; CMUX_APP_FFI_HEADER_BLESS=1 cargo test --test
# c_header rewrites it. Doc comments on the Rust items become the C comments.
language = "C"
include_guard = "CMUX_MOTION_FFI_H"
header = """
/* cmux-motion's C ABI (cmux-tui/crates/cmux-app-ffi/src/motion.rs): the
 * closed-form spring, the spec's motion tokens and the ui.animations.*
 * switches, and the tab strip's tweens and geometry
 * (Chrome's strip motion), the color transition's curves and color mix, and
 * the hover rules (cmux-app-ffi/src/hover.rs, cmux-motion src/hover: the hover
 * card machine, tooltip hover intent, the safe triangle, the row card's
 * placement and the hover timing tokens). Pure functions; no globals.
 * cmux_motion_ffi_abi_version() returns ABI_VERSION (src/motion.rs). */"""
autogen_warning = """
/* Generated by cbindgen (cmux-tui/crates/cmux-app-ffi/cbindgen.toml); do not edit.
 * Regenerate: CMUX_APP_FFI_HEADER_BLESS=1 cargo test --test c_header */"""
sys_includes = ["stdbool.h", "stddef.h", "stdint.h"]
no_includes = true
usize_is_size_t = true
style = "type"
documentation_style = "c"
line_length = 120
tab_width = 4

# The hover structs live in cmux-motion (hover::c); no other dependency's
# items belong in this header.
[parse]
parse_deps = true
include = ["cmux-motion"]

# Functions and the structs they reach only: cmux-motion's pub consts
# (PHASE_*, EVENT_*) are not part of the app's ABI.
[export]
item_types = ["structs", "functions"]

[export.rename]
"HoverPoint" = "CmuxHoverPoint"
"HoverRect" = "CmuxHoverRect"
