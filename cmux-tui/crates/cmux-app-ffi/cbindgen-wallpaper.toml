# include/cmux_wallpaper_ffi.h is cbindgen's output for src/wallpaper.rs (the
# one file it reads, so no other item of the crate reaches the header).
# tests/wallpaper_header.rs regenerates it and fails with the diff when the
# committed header differs; CMUX_APP_FFI_HEADER_BLESS=1 cargo test --test
# wallpaper_header rewrites it. Doc comments on the Rust items become the C comments.
language = "C"
include_guard = "CMUX_WALLPAPER_FFI_H"
header = """
/* cmux-wallpaper's C ABI (cmux-tui/crates/cmux-app-ffi/src/wallpaper.rs): live
 * wallpapers (plans/cmux-next/live-wallpapers.md). The first-party set with
 * its Metal translated at build time (no shader compiler), the manifest check, the
 * draw scheduler, the Frame uniform packer (CMUX_WALLPAPER_FRAME_FLOATS floats), and the pointer's, its trail's and
 * agent activity's smoothing, and motion scenes' player (an opaque handle that packs the
 * 2048-byte Scene block; plans/cmux-next/motion-scenes.md). No globals; results that own
 * strings and handles have their own free function. cmux_wallpaper_abi_version() returns ABI_VERSION (src/wallpaper.rs). */"""
autogen_warning = """
/* Generated by cbindgen (cmux-tui/crates/cmux-app-ffi/cbindgen-wallpaper.toml); do not edit.
 * Regenerate: CMUX_APP_FFI_HEADER_BLESS=1 cargo test --test wallpaper_header */"""
sys_includes = ["stdbool.h", "stddef.h", "stdint.h"]
no_includes = true
usize_is_size_t = true
style = "type"
documentation_style = "c"
line_length = 120
tab_width = 4

[export]
item_types = ["constants", "structs", "opaque", "functions"]
