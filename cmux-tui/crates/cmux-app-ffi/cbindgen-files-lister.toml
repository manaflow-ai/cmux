# include/cmux_files_lister.h is cbindgen's output for src/files_lister.rs alone (no other item of
# the crate reaches it). tests/files_lister_header.rs regenerates it and fails with the
# diff when the committed header differs;
# CMUX_APP_FFI_HEADER_BLESS=1 cargo test --test files_lister_header rewrites it.
language = "C"
include_guard = "CMUX_FILES_LISTER_H"
header = """
/* The client of cmux-tui's __files-lister child (cmux-tui/crates/cmux-app-ffi,
 * src/files_lister.rs): starts it, sends list and entry requests, matches
 * replies and stops after repeated failures. The app's ProcessDirectoryLister
 * resolves its argv and builds FileEntry values from the replies. */"""
autogen_warning = """
/* Generated by cbindgen (cmux-tui/crates/cmux-app-ffi/cbindgen-files-lister.toml); do not edit.
 * Regenerate: CMUX_APP_FFI_HEADER_BLESS=1 cargo test --test files_lister_header (cmux-app-ffi) */"""
sys_includes = ["stdbool.h", "stddef.h", "stdint.h"]
no_includes = true
usize_is_size_t = true
style = "type"
documentation_style = "c"
line_length = 120
tab_width = 4

[export]
item_types = ["constants", "structs", "opaque", "functions", "typedefs"]
