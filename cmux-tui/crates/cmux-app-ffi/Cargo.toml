[package]
name = "cmux-app-ffi"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "GPL-3.0-or-later"
publish = false
description = "The one Rust static library the cmux macOS app links: the C ABIs of the remote desktop core, the sidebar layout reducer, the palette ranker and cmux-motion"

# Own workspace, like its members: built only for the app xcframework
# (scripts/cmux-next/build-app-ffi.sh), so cmux-tui workspace builds and
# cmux-tui/Cargo.lock do not change.
[workspace]

[lib]
crate-type = ["staticlib"]

[dependencies]
# The panic boundary of every export and the ring cmux_ffi_take_panic reads.
cmux-ffi-guard = { path = "../cmux-ffi-guard" }
cmux-rd-ffi = { path = "../cmux-rd-ffi" }
cmux-layout-reducer-ffi = { path = "../cmux-layout-reducer-ffi" }
cmux-palette-ranker = { path = "../cmux-palette-ranker" }
# The spring step and motion tokens (src/motion.rs). No `settings`: the app
# passes its own settings per call, so no AppKit or env reading here.
cmux-motion = { path = "../cmux-motion", default-features = false }

[dev-dependencies]
cmux-ffi-guard = { path = "../cmux-ffi-guard", features = ["testing"] }

[profile.release]
opt-level = 3
codegen-units = 1
# Line tables, not full debug info: Rust frames of an app crash symbolicate
# to file and line from the app's dSYM, for a fraction of
# full DWARF's size. Nothing strips them here; the app's own strip step
# removes them from the shipped binary after dsymutil copied them.
debug = "line-tables-only"
strip = "none"
lto = "off"

[lints.clippy]
# cmux-tui/clippy.toml disallows std thread spawns and sleep; this package has not opted in.
disallowed_methods = "allow"
disallowed_types = "allow"
