[package]
name = "cmux-app-ffi"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "GPL-3.0-or-later"
publish = false
description = "The one Rust static library the cmux macOS app links: the C ABIs of the remote desktop core, the sidebar layout reducer, the palette ranker, cmux-motion and the host budget"

# Own workspace, like its members: built only for the app xcframework
# (scripts/cmux-next/build-app-ffi.sh), so cmux-tui workspace builds and
# cmux-tui/Cargo.lock do not change.
[workspace]

[lib]
crate-type = ["staticlib"]

[dependencies]
cmux-rd-ffi = { path = "../cmux-rd-ffi" }
cmux-layout-reducer-ffi = { path = "../cmux-layout-reducer-ffi" }
cmux-palette-ranker = { path = "../cmux-palette-ranker" }
# The spring step and motion tokens (src/motion.rs). No `settings`: the app
# passes its own settings per call, so no AppKit or env reading here.
cmux-motion = { path = "../cmux-motion", default-features = false }
# The host CPU/RAM budget (src/host_budget.rs). No `tokio`: the app reads the
# meter synchronously on its own queue.
cmux-host-budget = { path = "../cmux-host-budget", default-features = false }

[profile.release]
opt-level = 3
codegen-units = 1
debug = false
strip = "debuginfo"
lto = "off"
