[package]
name = "cmux-app-ffi"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "GPL-3.0-or-later"
publish = false
description = "The one Rust static library the cmux macOS app links: the C ABIs of the remote desktop core, the sidebar layout reducer, the palette ranker, cmux-motion, the agent pane policy, the action catalog, the daemon connection rules, the daemon launch rules, the staged-update pre-warm record, the app health model, the launch images, the pane pictures schedule, the Screenshots pane rules, the cmux SDK daemon client, the agent list client, the Chrome cookie sync and live wallpapers"

# The workspace of the app's C ABIs, with one Cargo.lock for all four: this
# crate and the FFI crates it links, which name it in `package.workspace`.
# Built only for the app xcframework (scripts/cmux-next/build-app-ffi.sh), so
# cmux-tui workspace builds and cmux-tui/Cargo.lock do not change. One lock: a
# dependency change in a crate they share needs one lock edit, not one per FFI
# crate (#40883, #40898).
[workspace]
members = ["../cmux-launch-record", "../cmux-launch-shell", "../cmux-layout-cache","../cmux-layout-reducer-ffi", "../cmux-rd-ffi", "../cmux-sdk-ffi"]

[lib]
crate-type = ["staticlib"]

[dependencies]
# The no-I/O agent list client (src/ffi.rs); the app owns the socket.
acpmux-client = { path = "../acpmux-client" }
cmux-rd-ffi = { path = "../cmux-rd-ffi" }
cmux-layout-reducer-ffi = { path = "../cmux-layout-reducer-ffi" }
cmux-palette-ranker = { path = "../cmux-palette-ranker" }
# The keymap layer of app.keyStyle and app.shortcutLayout (cmux-keymap src/ffi.rs, include/cmux_keymap.h).
cmux-keymap = { path = "../cmux-keymap" }
# The action catalog (descriptors, titles in every app language, default bindings), read at launch.
cmux-action-catalog = { path = "../cmux-action-catalog" }
# cmux-next.json's reads for the app (src/settings.rs: cmux-config's app_ops).
cmux-config = { path = "../cmux-config" }
# The Mac Home, chat list and Chief rules (src/home.rs: cmux-home-rules' ops).
cmux-home-rules = { path = "../cmux-home-rules" }
# The agent pane relay policy (src/ffi.rs: one check per page frame).
cmux-agent-pane-policy = { path = "../cmux-agent-pane-policy" }
# Predictive local echo for a terminal on another machine (cmux-terminal-prediction src/ffi.rs).
cmux-terminal-prediction = { path = "../cmux-terminal-prediction" }
# The typed address-bar policy: what the omnibox and New Tab field load or search
# (cmux-url-input src/ffi.rs, include/cmux_url_input.h; one call per key).
cmux-url-input = { path = "../cmux-url-input", features = ["ffi"] }
# The control connection rules (cmux-daemon-conn-core src/ffi.rs: retry pacing,
# the heartbeat, the request-latency probe, the command scope and JSON ops).
cmux-daemon-conn-core = { path = "../cmux-daemon-conn-core" }
# Which imported Chrome cookie domains changed (src/ffi.rs: a watching thread that calls the app back).
cmux-cookie-sync = { path = "../cmux-cookie-sync" }
# How the app starts and keeps its daemon (src/ffi.rs: JSON ops, the watch, stderr lines).
cmux-daemon-launch-core = { path = "../cmux-daemon-launch-core" }
# The staged-update pre-warm record (src/ffi.rs: the marker line and the launch verdict as JSON ops).
cmux-update-prewarm-core = { path = "../cmux-update-prewarm-core" }
# The app health model (cmux-health-core src/ffi.rs: JSON ops, the repair ladder, the snapshot).
cmux-health-core = { path = "../cmux-health-core" }
# Each window's last frame for the launch's first frame (cmux-launch-image src/ffi.rs: naming, caps, pruning, when to capture).
cmux-launch-image = { path = "../cmux-launch-image" }
# When a pane's live thumbnail is captured again (cmux-pane-pictures src/ffi.rs: the schedule; the app captures).
cmux-pane-pictures = { path = "../cmux-pane-pictures" }
# The Screenshots pane rules (cmux-screenshots src/ffi.rs: what a source lists, the listing, sources, the gate; the app reads disks and draws).
cmux-screenshots = { path = "../cmux-screenshots" }
# The spring step and motion tokens (src/motion.rs). No `settings`: the app
# passes its own settings per call, so no AppKit or env reading here.
cmux-interactivity = { path = "../cmux-interactivity" }
cmux-motion = { path = "../cmux-motion", default-features = false }
# The daemon client the cmux CLI uses (cmux-tui/bindings/rust) as a C ABI:
# the app's connect, call, command and subscribe (include/cmux_sdk_ffi.h).
cmux-sdk-ffi = { path = "../cmux-sdk-ffi" }
cmux-launch-record = { path = "../cmux-launch-record" }
# Live wallpapers (src/wallpaper.rs, include/cmux_wallpaper_ffi.h): the program check
# and its Metal translation (naga), the scheduler, the Frame packer.
cmux-wallpaper = { path = "../cmux-wallpaper" }
# What the stage-0 launch window shows and which input it holds (src/ffi.rs, include/cmux_launch_shell.h).
cmux-launch-shell = { path = "../cmux-launch-shell" }
# Every window's last computed layout across restarts (src/ffi.rs, include/cmux_layout_cache.h): read, validity, reconcile, the write coalescer, the swap wait.
cmux-layout-cache = { path = "../cmux-layout-cache" }
# The files lister's child, owned (src/files_lister.rs): it ends with its lister.
cmux-process = { path = "../cmux-process" }
# The files lister client and the system calendar ops' JSON (src/files_lister.rs, src/system_calendar.rs).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Text caps count grapheme clusters, as Swift does (src/system_calendar.rs).
unicode-segmentation = "1"

# Generates include/cmux_motion_ffi.h (cbindgen.toml); tests/c_header.rs fails
# when the committed header differs. A test, not a build.rs: no build rewrites
# a tracked file.
[dev-dependencies]
cbindgen = { version = "=0.29.2", default-features = false }
# The wallpaper ABI test reads the manifest JSON it returns (src/wallpaper.rs).
serde_json = "1"

[profile.release]
opt-level = 3
codegen-units = 1
debug = false
strip = "debuginfo"
# Machine code from rustc's own LTO: scripts/cmux-next/build-app-ffi.sh.
lto = "fat"
