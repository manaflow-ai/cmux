# include/cmux_home.h is cbindgen's output for src/home.rs alone (no other item of
# the crate reaches it). tests/home_header.rs regenerates it and fails with the
# diff when the committed header differs;
# CMUX_APP_FFI_HEADER_BLESS=1 cargo test --test home_header rewrites it.
language = "C"
include_guard = "CMUX_HOME_H"
header = """
/* The Mac Home, chat list and Chief rules for the app (cmux-tui/crates/cmux-app-ffi,
 * src/home.rs): the JSON ops of cmux-home-rules, run by cmux_home_call. */"""
autogen_warning = """
/* Generated by cbindgen (cmux-tui/crates/cmux-app-ffi/cbindgen-home.toml); do not edit.
 * Regenerate: CMUX_APP_FFI_HEADER_BLESS=1 cargo test --test home_header (cmux-app-ffi) */"""
sys_includes = ["stdbool.h", "stddef.h", "stdint.h"]
no_includes = true
usize_is_size_t = true
style = "type"
documentation_style = "c"
line_length = 120
tab_width = 4

[export]
item_types = ["constants", "structs", "opaque", "functions", "typedefs"]
