# include/cmux_updater.h is cbindgen's output for src/updater.rs alone (no other item of
# the crate reaches it). tests/updater_header.rs regenerates it and fails with the
# diff when the committed header differs;
# CMUX_APP_FFI_HEADER_BLESS=1 cargo test --test updater_header rewrites it.
language = "C"
include_guard = "CMUX_UPDATER_H"
header = """
/* The macOS app updater's decisions (cmux-tui/crates/cmux-app-ffi,
 * src/updater.rs): JSON ops run by cmux_updater_call. */"""
autogen_warning = """
/* Generated by cbindgen (cmux-tui/crates/cmux-app-ffi/cbindgen-updater.toml); do not edit.
 * Regenerate: CMUX_APP_FFI_HEADER_BLESS=1 cargo test --test updater_header (cmux-app-ffi) */"""
sys_includes = ["stdbool.h", "stddef.h", "stdint.h"]
no_includes = true
usize_is_size_t = true
style = "type"
documentation_style = "c"
line_length = 120
tab_width = 4

[export]
item_types = ["constants", "structs", "opaque", "functions", "typedefs"]
