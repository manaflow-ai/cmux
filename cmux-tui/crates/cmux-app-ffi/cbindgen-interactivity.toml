# include/cmux_interactivity.h is cbindgen's output for src/interactivity.rs alone (no other item of
# the crate reaches it). tests/interactivity_header.rs regenerates it and fails with the
# diff when the committed header differs;
# CMUX_APP_FFI_HEADER_BLESS=1 cargo test --test interactivity_header rewrites it.
language = "C"
include_guard = "CMUX_INTERACTIVITY_H"
header = """
/* Priority by interactivity (cmux-tui/crates/cmux-app-ffi, src/interactivity.rs): note what the person touches and
 * read the QoS of a class of work. cmux_interactivity_abi_version() returns ABI_VERSION. */"""
autogen_warning = """
/* Generated by cbindgen (cmux-tui/crates/cmux-app-ffi/cbindgen-interactivity.toml); do not edit.
 * Regenerate: CMUX_APP_FFI_HEADER_BLESS=1 cargo test --test interactivity_header (cmux-app-ffi) */"""
sys_includes = ["stdbool.h", "stddef.h", "stdint.h"]
no_includes = true
usize_is_size_t = true
style = "type"
documentation_style = "c"
line_length = 120
tab_width = 4

[export]
item_types = ["constants", "structs", "opaque", "functions", "typedefs"]
