[package]
name = "cmux-server"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "cmux server and VM software, I/O: store apply and rollback, service units, Postgres runner, health probes and the `cmux server` verbs (plans in cmux-server-core)"

[lints]
workspace = true

[[bin]]
name = "cmux-server"
path = "src/main.rs"

[dependencies]
base64.workspace = true
cmux-server-core = { path = "../cmux-server-core" }
flate2.workspace = true
getrandom.workspace = true
libc.workspace = true
# Blocking HTTPS for package downloads. reqwest's blocking client runs a
# private tokio runtime on its own thread; the crate itself stays sync.
reqwest = { workspace = true, features = ["blocking"] }
# The install key (ES256, server.md 6.1) for `cmux server pair`.
ring.workspace = true
rustls.workspace = true
# The pair wait socket's TLS trust: the same platform verifier reqwest uses,
# already in the lock file through reqwest.
rustls-platform-verifier = "0.7"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tar = { version = "0.4", default-features = false }
# The blocking `/v1/pair/wait` WebSocket client.
tungstenite.workspace = true
# The server's WireGuard key (server.md 6.1).
x25519-dalek.workspace = true

[dev-dependencies]
tempfile = "3"
