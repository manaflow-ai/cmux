# include/cmux_chat_markdown.h is cbindgen's output for src/ffi.rs (the one file
# it reads, so no other item of the crate reaches the header).
# cmux-app-ffi's tests/chat_markdown_header.rs regenerates it and fails with the
# diff when the committed header differs;
# CMUX_APP_FFI_HEADER_BLESS=1 cargo test --test chat_markdown_header
# (in cmux-tui/crates/cmux-app-ffi) rewrites it.
language = "C"
include_guard = "CMUX_CHAT_MARKDOWN_H"
header = """
/* The agent chat transcript's markdown parser (cmux-tui/crates/cmux-chat-markdown, src/ffi.rs):
 * CommonMark with GFM tables, task lists, strikethrough and autolinks, returned as bytes
 * (src/encode.rs) the app decodes and renders. */"""
autogen_warning = """
/* Generated by cbindgen (cmux-tui/crates/cmux-chat-markdown/cbindgen.toml); do not edit.
 * Regenerate: CMUX_APP_FFI_HEADER_BLESS=1 cargo test --test chat_markdown_header (cmux-app-ffi) */"""
sys_includes = ["stdbool.h", "stddef.h", "stdint.h"]
no_includes = true
usize_is_size_t = true
style = "type"
documentation_style = "c"
line_length = 120
tab_width = 4

[export]
item_types = ["constants", "typedefs", "structs", "opaque", "functions"]
