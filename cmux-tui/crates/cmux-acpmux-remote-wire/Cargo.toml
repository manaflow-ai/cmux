[package]
name = "cmux-acpmux-remote-wire"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "The wire of an agent chat whose acpmux runs on another machine: the page's acpmux JSON-RPC frames in, typed calls on the owning session daemon out (as effects the app runs), and the daemon's pushes back as acpmux notifications. No I/O, no clock, no threads: the macOS app runs the effects"

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
