# include/cmux_acpmux_remote_wire.h is cbindgen's output for src/ffi.rs (the one file it reads).
# cmux-app-ffi's tests/acpmux_remote_wire_header.rs regenerates it and fails with the diff when the
# committed header differs; CMUX_APP_FFI_HEADER_BLESS=1 cargo test --test acpmux_remote_wire_header
# (in cmux-tui/crates/cmux-app-ffi) rewrites it.
language = "C"
include_guard = "CMUX_ACPMUX_REMOTE_WIRE_H"
header = """
/* The remote chat wire (cmux-tui/crates/cmux-acpmux-remote-wire, src/ffi.rs): the page's acpmux
 * JSON-RPC in, the daemon calls and page frames to run out, as JSON effects. */"""
autogen_warning = """
/* Generated by cbindgen (cmux-tui/crates/cmux-acpmux-remote-wire/cbindgen.toml); do not edit.
 * Regenerate: CMUX_APP_FFI_HEADER_BLESS=1 cargo test --test acpmux_remote_wire_header (cmux-app-ffi) */"""
sys_includes = ["stdbool.h", "stddef.h", "stdint.h"]
no_includes = true
usize_is_size_t = true
style = "type"
documentation_style = "c"
line_length = 120
tab_width = 4

[export]
item_types = ["constants", "structs", "opaque", "functions"]
