# include/cmux_keymap.h is cbindgen's output for src/ffi.rs (the one file it
# reads, so no other item of the crate reaches the header).
# cmux-app-ffi's tests/keymap_header.rs regenerates it and fails with the diff
# when the committed header differs;
# CMUX_APP_FFI_HEADER_BLESS=1 cargo test --test keymap_header
# (in cmux-tui/crates/cmux-app-ffi) rewrites it.
language = "C"
include_guard = "CMUX_KEYMAP_H"
header = """
/* The keymap layer of app.keyStyle and app.shortcutLayout
 * (cmux-tui/crates/cmux-keymap, src/ffi.rs; the table is
 * schemas/keymap/key-styles.json). One handle per list surface keeps its list
 * state (a pending gg); cmux_keymap_stroke_matches needs none.
 * A key is its macOS virtual key code (kVK_*, or CMUX_KEYMAP_NO_KEY_CODE), what
 * the layout types on it without and with Shift (UTF-8, "Dead" for a dead key,
 * or a named key: escape, enter, up, down, left, right, pageup, pagedown) and
 * the modifier bits: cmd = 1, ctrl = 2, alt = 4, shift = 8. */"""
autogen_warning = """
/* Generated by cbindgen (cmux-tui/crates/cmux-keymap/cbindgen.toml); do not edit.
 * Regenerate: CMUX_APP_FFI_HEADER_BLESS=1 cargo test --test keymap_header (cmux-app-ffi) */"""
sys_includes = ["stdbool.h", "stddef.h", "stdint.h"]
no_includes = true
usize_is_size_t = true
style = "type"
documentation_style = "c"
line_length = 120
tab_width = 4

[export]
item_types = ["constants", "structs", "opaque", "functions"]
