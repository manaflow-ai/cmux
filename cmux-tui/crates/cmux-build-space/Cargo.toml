[package]
name = "cmux-build-space"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "A dev build's cloud data space (X-Cmux-Build-Space: dev:<slug>): the one value every Rust cloud client of a process sends, read once from CMUX_BUILD_SPACE, and refused (fail closed) when a dev build's launcher gave none or a malformed one"

[lints]
workspace = true

[dependencies]
# The bundle rule that says whether CMUX_BUNDLE_ID names a tagged dev build
# (the Rust mirror of the app's BuildIdentity). A literal path, so the
# cmux-next-ios workspace resolves it too.
cmux-agent-pane-policy = { path = "../cmux-agent-pane-policy" }
http.workspace = true

[features]
# `testing::Heads`: a loopback listener that records request heads, for the
# cloud clients' header tests (dev-dependencies only).
testing = ["dep:tokio", "dep:cmux-scope"]

[dependencies.cmux-scope]
path = "../cmux-scope"
optional = true

[dependencies.tokio]
workspace = true
optional = true
features = ["net", "io-util", "rt", "sync", "macros", "time"]
