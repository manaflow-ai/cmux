# include/cmux_cookie_sync.h is cbindgen's output for src/ffi.rs (the one
# file it reads, so no other item of the crate reaches the header).
# cmux-app-ffi's tests/cookie_sync_header.rs regenerates it and fails with
# the diff when the committed header differs;
# CMUX_APP_FFI_HEADER_BLESS=1 cargo test --test cookie_sync_header
# (in cmux-tui/crates/cmux-app-ffi) rewrites it.
language = "C"
include_guard = "CMUX_COOKIE_SYNC_H"
header = """
/* Chrome cookie sync for the cmux macOS app
 * (cmux-tui/crates/cmux-cookie-sync, src/ffi.rs): watches each imported
 * Chromium profile's Cookies database on this Mac and reports, as JSON on
 * the crate's own thread, which cookie domains changed since the app's last
 * import. It never decrypts a value and sends nothing anywhere; the app
 * re-imports the reported domains with its own importer and then commits. */"""
autogen_warning = """
/* Generated by cbindgen (cmux-tui/crates/cmux-cookie-sync/cbindgen.toml); do not edit.
 * Regenerate: CMUX_APP_FFI_HEADER_BLESS=1 cargo test --test cookie_sync_header (cmux-app-ffi) */"""
sys_includes = ["stdbool.h", "stddef.h", "stdint.h"]
no_includes = true
usize_is_size_t = true
style = "type"
documentation_style = "c"
line_length = 120
tab_width = 4

[export]
item_types = ["constants", "opaque", "typedefs", "functions"]
