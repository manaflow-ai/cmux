[package]
name = "cmux-api-compat"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Forwards and backwards JSON API compatibility: per-revision change rules on JSON pointers, compiled lazily into a path trie and applied by a forward-only streaming JSON rewriter"

[lints]
workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }

[[bench]]
name = "rex_parity"
harness = false
