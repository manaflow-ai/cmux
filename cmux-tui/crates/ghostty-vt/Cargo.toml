[package]
name = "ghostty-vt"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Safe Rust wrapper around libghostty-vt"

[lints]
workspace = true

[dependencies]
base64.workspace = true
ghostty-vt-sys.workspace = true
memchr.workspace = true
simdutf8.workspace = true
png.workspace = true

# Only the explicit example enables Valgrind; normal app/test builds need no headers.
[features]
phone-speed = ["dep:crabgrind"]

[dependencies.crabgrind]
version = "=0.6.0"
optional = true

[[example]]
name = "phone_default_speed"
required-features = ["phone-speed"]
