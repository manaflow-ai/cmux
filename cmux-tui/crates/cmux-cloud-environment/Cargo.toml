[package]
name = "cmux-cloud-environment"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Runtime NEXT Cloud backend allowlist, client-config cache and per-bundle selection"

[lints]
workspace = true

[features]
default = ["fetch"]
# The backend's client-config over HTTP (`Resolver::client_config`). The macOS app's launch read
# (`Resolver::launch_read`, through cmux-daemon-launch-core's FFI) needs none of it: off there.
fetch = ["dep:reqwest", "dep:rustls"]

[dependencies]
cmux-egress.workspace = true
cmux-build-space.workspace = true
serde.workspace = true
serde_json.workspace = true
reqwest = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
url.workspace = true

[dev-dependencies]
tokio.workspace = true
# Seeded-secret tests: gated clients send to a local capture server.
cmux-egress = { workspace = true, features = ["capture"] }
