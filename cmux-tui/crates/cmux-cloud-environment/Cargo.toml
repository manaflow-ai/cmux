[package]
name = "cmux-cloud-environment"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Runtime NEXT Cloud backend allowlist, client-config cache and per-bundle selection"

[lints]
workspace = true

[features]
default = ["http"]
# The app reads the same validated cache in process, without an HTTP runtime.
http = ["dep:reqwest", "dep:rustls"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
reqwest = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
url.workspace = true

[dev-dependencies]
tokio.workspace = true
