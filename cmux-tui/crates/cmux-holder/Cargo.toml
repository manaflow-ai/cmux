[package]
name = "cmux-holder"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "One small process that holds every PTY of an install: no VT, std and libc only (plus the std+libc flow marks, trace ring, cmux-ipc descriptor passing, cmux-memory budget constants, cmux-threads QoS and the std-only panic log)"

[lints]
workspace = true

[[bin]]
name = "cmux-holder"
path = "src/main.rs"

[dependencies]
cmux-flow-trace.workspace = true
cmux-ipc.workspace = true
# RING_BYTES and LINK_QUEUE_BYTES come from the daemon memory budget (std and libc only).
cmux-memory.workspace = true
# holder-panics.jsonl through the std-only writer: no serde_json (the path, not
# the workspace entry, so default-features = false takes effect).
cmux-panic-log = { path = "../cmux-panic-log", default-features = false, features = ["minimal"] }
# The trace ring a granted TRACE_START and TRACE_STOP drive (std and libc only).
cmux-trace.workspace = true
# The daemon-side link reader's QoS and registry row (std and libc only).
cmux-threads.workspace = true
libc.workspace = true

[dev-dependencies]
# The spawn-race test only: the holder binary stays std and libc.
cmux-process.workspace = true
# The panic-log test parses the hand-escaped line.
serde_json.workspace = true
