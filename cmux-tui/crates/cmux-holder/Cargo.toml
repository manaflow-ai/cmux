[package]
name = "cmux-holder"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "One small process that holds every PTY of an install: no VT, std and libc only (plus the std+libc flow marks, trace ring, cmux-ipc descriptor passing, cmux-memory budget constants and cmux-threads QoS)"

[lints]
workspace = true

[[bin]]
name = "cmux-holder"
path = "src/main.rs"

[dependencies]
cmux-flow-trace.workspace = true
cmux-ipc.workspace = true
# RING_BYTES and LINK_QUEUE_BYTES come from the daemon memory budget (std and libc only).
cmux-memory.workspace = true
# The trace ring a granted TRACE_START and TRACE_STOP drive (std and libc only).
cmux-trace.workspace = true
# The daemon-side link reader's QoS and registry row (std and libc only).
cmux-threads.workspace = true
libc.workspace = true

[dev-dependencies]
# Test-only; the holder binary stays std and libc (tests/host_spans.rs).
cmux-process.workspace = true
# The panic-log test parses the holder's line (tests/panic_log.rs).
serde_json.workspace = true
