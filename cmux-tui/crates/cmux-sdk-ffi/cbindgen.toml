# include/cmux_sdk_ffi.h is generated from src/lib.rs by cbindgen (the
# dev-dependency pinned in Cargo.toml). tests/c_header.rs regenerates it and
# fails with the diff when the committed header differs;
# CMUX_SDK_FFI_HEADER_BLESS=1 cargo test --test c_header rewrites it.
language = "C"
include_guard = "CMUX_SDK_FFI_H"
header = """
/* The cmux SDK's daemon client as a C ABI (cmux-tui/crates/cmux-sdk-ffi):
 * the client the cmux CLI uses, so the app reaches the daemon through the
 * same code. JSON in, JSON out. Every reply in *out is one JSON object:
 * {"ok": true, "result": ...} or {"ok": false, "error": {"code", "message",
 * "details"?, "retryable"?, "idempotency_key"?}}, except cmux_sdk_next's
 * {"item": ...} | {"end": ...} | {"timed_out": true} | an error. Free every
 * *out with cmux_sdk_bytes_free. Return codes: 0 OK (read *out), -1 a null
 * pointer, -2 invalid input (not UTF-8, params not a JSON object, a kind
 * without its key), -3 a conversation rule this build does not know, -4 a
 * panic inside (caught), -5 a request that could not be sent (the
 * connection is closed); on any code but 0, *out is empty. Every function
 * may run on any thread.
 * cmux_sdk_ffi_abi_version() returns CMUX_SDK_FFI_ABI_VERSION (src/lib.rs). */"""
autogen_warning = """
/* Generated by cbindgen (cmux-tui/crates/cmux-sdk-ffi/cbindgen.toml); do not edit.
 * Regenerate: CMUX_SDK_FFI_HEADER_BLESS=1 cargo test --test c_header */"""
sys_includes = ["stdbool.h", "stddef.h", "stdint.h"]
no_includes = true
usize_is_size_t = true
style = "type"
documentation_style = "c"
line_length = 120
tab_width = 4

[export]
item_types = ["structs", "opaque", "functions", "constants"]
