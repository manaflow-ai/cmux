# include/cmux_screen_stream.h is cbindgen's output for src/ffi.rs (the one file
# it reads, so no other item of the crate reaches the header).
# cmux-app-ffi's tests/screen_stream_header.rs regenerates it and fails with the
# diff when the committed header differs;
# CMUX_APP_FFI_HEADER_BLESS=1 cargo test --test screen_stream_header
# (in cmux-tui/crates/cmux-app-ffi) rewrites it.
language = "C"
include_guard = "CMUX_SCREEN_STREAM_H"
header = """
/* The screen stream's protocol and policy (cmux-tui/crates/cmux-screen-stream, src/ffi.rs):
 * data channel messages as JSON in and out, the quality's encoder settings, the viewer's
 * demanded size, image paste chunks and the cursor shapes a host has sent. */"""
autogen_warning = """
/* Generated by cbindgen (cmux-tui/crates/cmux-screen-stream/cbindgen.toml); do not edit.
 * Regenerate: CMUX_APP_FFI_HEADER_BLESS=1 cargo test --test screen_stream_header (cmux-app-ffi) */"""
sys_includes = ["stdbool.h", "stddef.h", "stdint.h"]
no_includes = true
usize_is_size_t = true
style = "type"
documentation_style = "c"
line_length = 120
tab_width = 4

[export]
item_types = ["constants", "structs", "opaque", "functions"]
