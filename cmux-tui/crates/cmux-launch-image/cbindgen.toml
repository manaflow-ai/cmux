# include/cmux_launch_image.h is cbindgen's output for src/ffi.rs (the one file
# it reads, so no other item of the crate reaches the header).
# cmux-app-ffi's tests/launch_image_header.rs regenerates it and fails with the
# diff when the committed header differs;
# CMUX_APP_FFI_HEADER_BLESS=1 cargo test --test launch_image_header
# (in cmux-tui/crates/cmux-app-ffi) rewrites it.
language = "C"
include_guard = "CMUX_LAUNCH_IMAGE_H"
header = """
/* Each cmux window's last committed frame for the launch's first frame
 * (cmux-tui/crates/cmux-launch-image, src/ffi.rs): naming, atomic publish,
 * caps, pruning, and when a capture is due. The app captures and encodes. */"""
autogen_warning = """
/* Generated by cbindgen (cmux-tui/crates/cmux-launch-image/cbindgen.toml); do not edit.
 * Regenerate: CMUX_APP_FFI_HEADER_BLESS=1 cargo test --test launch_image_header (cmux-app-ffi) */"""
sys_includes = ["stdbool.h", "stddef.h", "stdint.h"]
no_includes = true
usize_is_size_t = true
style = "type"
documentation_style = "c"
line_length = 120
tab_width = 4

[export]
item_types = ["constants", "structs", "opaque", "functions"]
