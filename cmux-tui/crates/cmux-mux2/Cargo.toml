[package]
name = "cmux-mux2"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "First-principles terminal multiplexer engine: one process, raw byte stream, exact VT state"

[lints]
workspace = true

[[bin]]
name = "mux2d"
path = "src/bin/mux2d.rs"

[[bin]]
name = "mux2"
path = "src/bin/mux2.rs"

[[bin]]
name = "mux2-verify"
path = "src/bin/mux2-verify.rs"

[[bin]]
name = "mux2-parsebench"
path = "src/bin/mux2-parsebench.rs"

[[bin]]
name = "mux2-spawnbench"
path = "src/bin/mux2-spawnbench.rs"

[[bin]]
name = "mux2-ctty-probe"
path = "src/bin/mux2-ctty-probe.rs"

[[bin]]
name = "mux2-wrapcheck"
path = "src/bin/mux2-wrapcheck.rs"

[[bin]]
name = "mux2-resumecheck"
path = "src/bin/mux2-resumecheck.rs"

[[bin]]
name = "mux2-query-probe"
path = "src/bin/mux2-query-probe.rs"

[dependencies]
ghostty-vt.workspace = true
libc.workspace = true

[target.'cfg(windows)'.dependencies]
uds_windows.workspace = true
windows-sys = { workspace = true, features = [
    "Win32_Networking_WinSock",
    "Win32_Security_Authorization",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_ProcessStatus",
] }
