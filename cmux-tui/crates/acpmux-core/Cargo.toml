[package]
name = "acpmux-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "The v2 agent service core: published summaries and bounded stream frames"

[features]
default = []
allocation-metrics = []

# Every `unsafe` block, impl and `pub unsafe fn` here states why it is sound: a `// SAFETY:`
# comment above it, or a `# Safety` doc section on the fn. Cargo cannot extend
# `[workspace.lints]`, so the inheriting crates mirror it here; the workspace lint drift test
# (.github/scripts/test_cmux_tui_unsafe_lints.py) keeps the copy equal.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_qualifications = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

[lints.clippy]
uninlined_format_args = "warn"
semicolon_if_nothing_returned = "warn"
redundant_clone = "warn"
await_holding_lock = "warn"
await_holding_refcell_ref = "warn"
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"

[dependencies]
acpmux-book = { path = "../acpmux-book" }
acpmux-client = { path = "../acpmux-client" }
arc-swap.workspace = true
cmux-scope.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
sha2.workspace = true
thiserror = "2"
tokio = { version = "1.52", features = ["io-util", "macros", "rt", "sync", "time"] }

[dev-dependencies]
# Release gates print and compare their rounds through `acpmux_book::gate_rounds`.
acpmux-book = { path = "../acpmux-book", features = ["gate-rounds"] }
# The list helper's tests against the hub (`src/tokio_list_tests.rs`).
acpmux-client = { path = "../acpmux-client", features = ["tokio"] }
serde = { workspace = true, features = ["derive"] }
tempfile = "3"
tokio = { version = "1.52", features = ["macros", "rt-multi-thread", "sync", "net", "time", "test-util"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
libc.workspace = true
