[package]
name = "acpmux-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "The v2 agent service core: published summaries and bounded stream frames"

[lints]
workspace = true

[dependencies]
acpmux-book = { path = "../acpmux-book" }
arc-swap.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
thiserror = "2"
tokio = { version = "1.52", features = ["sync", "rt", "time"] }
cmux-scope.workspace = true

[dev-dependencies]
serde = { workspace = true, features = ["derive"] }
tempfile = "3"
tokio = { version = "1.52", features = ["macros", "rt", "sync", "time", "test-util"] }
