[package]
name = "cmux-rd-link"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "cmux remote desktop secure link: Noise_XX handshake bound to the session, sealed datagrams with a replay window, an ordered reliable control channel, path probes and a TURN client (pure, injected clock, no I/O)"

# Every `unsafe` block, impl and `pub unsafe fn` here states why it is sound: a `// SAFETY:`
# comment above it, or a `# Safety` doc section on the fn. Cargo cannot extend
# `[workspace.lints]`, so the inheriting crates mirror it here; the workspace lint drift test
# (.github/scripts/test_cmux_tui_unsafe_lints.py) keeps the copy equal.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_qualifications = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

[lints.clippy]
uninlined_format_args = "warn"
semicolon_if_nothing_returned = "warn"
redundant_clone = "warn"
await_holding_lock = "warn"
await_holding_refcell_ref = "warn"
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"

[features]
# The UDP driver (a thread, one socket, STUN candidates) for the host and the viewer.
net = ["dep:libc", "cmux-transport/local-networks"]

[dependencies]
libc = { version = "0.2", optional = true }
snow.workspace = true
cmux-transport = { path = "../cmux-transport" }
# TURN long-term credentials (RFC 8489): HMAC-SHA1 keyed with MD5(username:realm:password).
hmac = "0.12"
sha1 = "0.10"
md5 = { package = "md-5", version = "0.10" }

[[test]]
name = "net"
required-features = ["net"]

[[test]]
name = "turn"
required-features = ["net"]

[[test]]
name = "dlink_turn"
required-features = ["net"]
