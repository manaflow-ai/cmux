[package]
name = "cmux-rd-link"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "cmux remote desktop secure link: Noise_XX handshake bound to the session, sealed datagrams with a replay window, an ordered reliable control channel, path probes and a TURN client (pure, injected clock, no I/O)"

[lints]
workspace = true

[features]
# The UDP driver (a thread, one socket, STUN candidates) for the host and the viewer.
# Unix waits with poll(2) (libc); Windows with WSAPoll (windows-sys, net_windows.rs).
# TURN over TCP or TLS (stream_relay.rs) for networks that block UDP: socket2 for the
# nonblocking connect, rustls with the OS trust store for TLS.
net = [
    "dep:cmux-rd-proto",
    "dep:libc",
    "dep:windows-sys",
    "dep:rustls",
    "dep:rustls-native-certs",
    "dep:socket2",
    "cmux-transport/local-networks",
]

[dependencies]
cmux-rd-proto = { path = "../cmux-rd-proto", optional = true }
libc = { version = "0.2", optional = true }
rustls = { workspace = true, optional = true }
rustls-native-certs = { version = "0.8", optional = true }
socket2 = { workspace = true, optional = true }
snow.workspace = true
cmux-transport = { path = "../cmux-transport" }
# TURN long-term credentials (RFC 8489): HMAC-SHA1 keyed with MD5(username:realm:password).
hmac = "0.12"
sha1 = "0.10"
md5 = { package = "md-5", version = "0.10" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Networking_WinSock",
    "Win32_System_Performance",
    "Win32_System_SystemInformation",
], optional = true }

[[test]]
name = "net"
required-features = ["net"]

[[test]]
name = "turn"
required-features = ["net"]

[[test]]
name = "dlink_turn"
required-features = ["net"]
