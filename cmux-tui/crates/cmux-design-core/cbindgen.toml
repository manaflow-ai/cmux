# include/cmux_design.h is cbindgen's output for src/ffi.rs (the one file
# it reads, so no other item of the crate reaches the header).
# cmux-app-ffi's tests/design_header.rs regenerates it and fails with the
# diff when the committed header differs;
# CMUX_APP_FFI_HEADER_BLESS=1 cargo test --test design_header
# (in cmux-tui/crates/cmux-app-ffi) rewrites it.
language = "C"
include_guard = "CMUX_DESIGN_H"
header = """
/* The design system's rules for the macOS app (cmux-tui/crates/cmux-design-core, src/ffi.rs):
 * one JSON op call per decision; the app draws, Rust decides. */"""
autogen_warning = """
/* Generated by cbindgen (cmux-tui/crates/cmux-design-core/cbindgen.toml); do not edit.
 * Regenerate: CMUX_APP_FFI_HEADER_BLESS=1 cargo test --test design_header (cmux-app-ffi) */"""
sys_includes = ["stdbool.h", "stddef.h", "stdint.h"]
no_includes = true
usize_is_size_t = true
style = "type"
documentation_style = "c"
line_length = 120
tab_width = 4

[export]
item_types = ["constants", "structs", "opaque", "functions"]
