[package]
name = "cmux-link"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "The cmux link contract: the peer identity stamp, the daemon remote entry path, link.dial frames, overlay addresses, and caller verification for the link's Unix sockets"

