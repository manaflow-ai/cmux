[package]
name = "cmux-wg"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "In-process WireGuard transport for cmux clients: boringtun plus a userspace TCP stack"

# Every `unsafe` block, impl and `pub unsafe fn` here states why it is sound: a `// SAFETY:`
# comment above it, or a `# Safety` doc section on the fn. Cargo cannot extend
# `[workspace.lints]`, so the inheriting crates mirror it here; the workspace lint drift test
# (.github/scripts/test_cmux_tui_unsafe_lints.py) keeps the copy equal.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_qualifications = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

[lints.clippy]
uninlined_format_args = "warn"
semicolon_if_nothing_returned = "warn"
redundant_clone = "warn"
await_holding_lock = "warn"
await_holding_refcell_ref = "warn"
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"

[dependencies]
base64.workspace = true
boringtun.workspace = true
bytes.workspace = true
cmux-transport = { path = "../cmux-transport", features = ["local-networks"] }
# Only the `testing` loopback harness needs randomness (fresh keypairs);
# production callers bring their own keys.
getrandom.workspace = true
ip_network.workspace = true
# Each receive buffer tracks up to 32 out-of-order ranges, not smoltcp's 4:
# past 4 holes (a few percent loss on a full window) it dropped every further
# out-of-order segment, and SACK can only describe ranges it keeps.
smoltcp = { workspace = true, features = ["assembler-max-segment-count-32"] }
tokio.workspace = true
tokio-util.workspace = true
x25519-dalek.workspace = true
zeroize.workspace = true

[target.'cfg(unix)'.dependencies]
# ENOBUFS, which UDP sends answer on macOS when the interface queue is full.
libc.workspace = true

[dev-dependencies]
# MAC1 of a handshake initiation the tests forge.
blake2 = "0.10"
tokio = { workspace = true, features = ["test-util"] }
# `remote_stream_bench --path rd-link`: Cloud desktop media on the datagram path.
cmux-rd-core = { path = "../cmux-rd-core" }
cmux-rd-engine = { path = "../cmux-rd-engine" }
cmux-rd-link = { path = "../cmux-rd-link" }
cmux-rd-proto = { path = "../cmux-rd-proto" }
