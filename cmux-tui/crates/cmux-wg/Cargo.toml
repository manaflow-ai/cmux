[package]
name = "cmux-wg"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "In-process WireGuard transport for cmux clients: boringtun plus a userspace TCP stack"

[lints]
workspace = true

[features]
# Exposes the crate-private packet parsers to cmux-tui/fuzz (`fuzzing` module).
fuzzing = []
# The lab's tokio slow-poll detector (cmux-blocking; RUSTFLAGS="--cfg tokio_unstable").
cmux-stability = ["cmux-blocking/cmux-stability"]

[dependencies]
cmux-blocking.workspace = true
cmux-panic-log.workspace = true
base64.workspace = true
boringtun.workspace = true
bytes.workspace = true
cmux-transport = { path = "../cmux-transport" }
# Only the `testing` loopback harness needs randomness (fresh keypairs);
# production callers bring their own keys.
getrandom.workspace = true
ip_network.workspace = true
smoltcp.workspace = true
tokio.workspace = true
tokio-util.workspace = true
x25519-dalek.workspace = true
zeroize.workspace = true

[target.'cfg(unix)'.dependencies]
# ENOBUFS, which UDP sends answer on macOS when the interface queue is full.
libc.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
