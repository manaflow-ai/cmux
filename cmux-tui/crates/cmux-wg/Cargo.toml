[package]
name = "cmux-wg"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "In-process WireGuard transport for cmux clients: boringtun plus a userspace TCP stack"

[lints]
workspace = true

[dependencies]
base64.workspace = true
boringtun.workspace = true
bytes.workspace = true
cmux-transport = { path = "../cmux-transport", features = ["local-networks"] }
# Only the `testing` loopback harness needs randomness (fresh keypairs);
# production callers bring their own keys.
getrandom.workspace = true
ip_network.workspace = true
# Each receive buffer tracks up to 32 out-of-order ranges, not smoltcp's 4:
# past 4 holes (a few percent loss on a full window) it dropped every further
# out-of-order segment, and SACK can only describe ranges it keeps.
smoltcp = { workspace = true, features = ["assembler-max-segment-count-32"] }
tokio.workspace = true
tokio-util.workspace = true
x25519-dalek.workspace = true
zeroize.workspace = true

[target.'cfg(unix)'.dependencies]
# ENOBUFS, which UDP sends answer on macOS when the interface queue is full.
libc.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
# `remote_stream_bench --path rd-link`: Cloud desktop media on the datagram path.
cmux-rd-core = { path = "../cmux-rd-core" }
cmux-rd-engine = { path = "../cmux-rd-engine" }
cmux-rd-link = { path = "../cmux-rd-link" }
cmux-rd-proto = { path = "../cmux-rd-proto" }
