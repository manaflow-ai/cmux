[package]
name = "cmux-weft"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Weft: cmux's own WireGuard mesh (userspace client, policy and wire types; the coordinator and relay were deleted)"

[lints]
workspace = true

[[bin]]
name = "weft"
path = "src/bin/weft.rs"

[dependencies]
cmux-egress.workspace = true
anyhow.workspace = true
base64.workspace = true
cmux-wg = { path = "../cmux-wg" }
futures-util.workspace = true
getrandom.workspace = true
hex.workspace = true
reqwest.workspace = true
ring.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
x25519-dalek.workspace = true
zeroize.workspace = true

[dev-dependencies]
cmux-egress = { workspace = true, features = ["capture"] }
proptest = { version = "1", default-features = false, features = ["std"] }
