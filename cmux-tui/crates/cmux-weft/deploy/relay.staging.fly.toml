# weft-relay, staging. One machine per region; /v1/relay/<region> lands on
# that region's machine through fly-replay.
app = "cmux-weft-relay-staging"
primary_region = "sjc"

[processes]
  app = "/usr/local/bin/weft-relay"

[env]
  PORT = "8080"

[http_service]
  processes = ["app"]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 5000
    hard_limit = 10000

[[http_service.checks]]
  grace_period = "10s"
  interval = "15s"
  method = "GET"
  path = "/healthz"
  timeout = "3s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
