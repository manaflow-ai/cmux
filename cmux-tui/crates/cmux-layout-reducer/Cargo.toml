[package]
name = "cmux-layout-reducer"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Pure layout reducer and tab-conservation invariants for the cmux workspace store"

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
# Swift String and Character semantics for the group hover summary (canonical equality, grapheme
# clusters). Both are already in the app FFI through cmux-palette-ranker and cmux-focus-core.
unicode-normalization = { workspace = true }
unicode-segmentation = { workspace = true }

[dev-dependencies]
# The spring the scroll tests step to rest (src/scroll/tests.rs), as the app does.
cmux-motion = { path = "../cmux-motion", default-features = false }
proptest = { version = "1", default-features = false, features = ["std"] }

[lints]
workspace = true
