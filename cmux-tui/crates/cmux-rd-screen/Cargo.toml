[package]
name = "cmux-rd-screen"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "The WebRTC screen stream's rules (Packages/Shared/CmuxVNCWebRTC): the hub ticket and fingerprint signatures, signaling frames, follow mode's focus signals, viewer demand and the cursor shape (pure, time as an argument)"

[lints]
workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
# The ticket's fingerprint signatures (ECDSA P-256 SHA-256), as cmux-hub-host checks them.
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }
