[package]
name = "cmux-bounded"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "A state machine whose every waiting state declares its bound and its recovery: an unbounded wait does not compile, and a driver fires the recovery edge when the bound passes"

[lints]
workspace = true

[features]
# `Driver<M, tokio::time::Instant>` and its async `expired()`/`run()`, so a paused test clock moves it.
tokio = ["dep:tokio", "cmux-deadline/tokio"]

[dependencies]
cmux-deadline.workspace = true
serde = { workspace = true, features = ["derive"] }
tokio = { workspace = true, optional = true }
tracing = "0.1"

[dev-dependencies]
serde_json.workspace = true
# span-locations: a finding's line number comes from its span.
proc-macro2 = { version = "1", features = ["span-locations"] }
syn = { version = "2", default-features = false, features = ["full", "parsing", "printing", "visit"] }
tokio = { workspace = true, features = ["test-util"] }
