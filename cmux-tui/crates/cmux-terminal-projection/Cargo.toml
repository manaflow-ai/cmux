[package]
name = "cmux-terminal-projection"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "A phone's own view of a terminal it does not size: a VT model at the host's grid, fed the PTY bytes, and its primary screen re-wrapped at the phone's width as VT bytes for the phone's terminal. The host PTY never resizes for the phone"

[lints]
workspace = true

[dependencies]
unicode-segmentation.workspace = true
unicode-width.workspace = true

[dev-dependencies]
# The parity harness's oracle: Ghostty's VT core, the emulator the Mac pane
# and the phone's surface both run.
ghostty-vt = { path = "../ghostty-vt" }
