[package]
name = "cmux-ipc"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "The cmux binary IPC wire: binary frames, a zero-copy reader, the SCM_RIGHTS descriptor FIFO, and bindings (schema identity, method tables) built from spec/sdk-schema.json and spec/resource-operations-v2.json at build time"

[dependencies]
bytes.workspace = true
libc.workspace = true
memchr.workspace = true
# Name -> id lookup (methods.rs): a perfect-hash map that build.rs writes, so a
# lookup hashes once and never allocates.
phf = { version = "0.11", default-features = false }
# The generated client request types (src/client.rs) build JSON lines; only
# crates that send them turn the feature on, so cmux-holder stays std+libc.
serde_json = { workspace = true, optional = true }

[features]
client = ["dep:serde_json"]

# build.rs reads both schema files; it writes only to OUT_DIR.
[build-dependencies]
phf_codegen = "0.11"
serde_json.workspace = true

[dev-dependencies]
# The method-table tests include the build-support reader and emitter.
phf_codegen = "0.11"
serde_json.workspace = true

[lints]
workspace = true
