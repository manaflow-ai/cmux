[package]
name = "cmux-ipc"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Binary frames of the cmux app-daemon connection: the 16-byte header, frame kinds, a zero-copy reader and the schema's method tables"
build = "build.rs"

[dependencies]
bytes.workspace = true
memchr.workspace = true
# Name -> id lookup (methods.rs): a perfect-hash map that build.rs writes, so a
# lookup hashes once and never allocates.
phf = { version = "0.11", default-features = false }

[build-dependencies]
phf_codegen = "0.11"
serde_json.workspace = true

[dev-dependencies]
# The method-table tests include the build-support reader and emitter.
phf_codegen = "0.11"
serde_json.workspace = true

[lints]
workspace = true
