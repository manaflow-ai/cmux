[package]
name = "cmux-ipc"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "The cmux app-daemon connection: binary frames, a zero-copy reader, and bindings (schema identity, method tables) built from spec/sdk-schema.json and spec/resource-operations-v2.json at build time"

[dependencies]
bytes.workspace = true
memchr.workspace = true
# Name -> id lookup (methods.rs): a perfect-hash map that build.rs writes, so a
# lookup hashes once and never allocates.
phf = { version = "0.11", default-features = false }

# build.rs reads both schema files; it writes only to OUT_DIR.
[build-dependencies]
phf_codegen = "0.11"
serde_json.workspace = true

[dev-dependencies]
# The method-table tests include the build-support reader and emitter.
phf_codegen = "0.11"
serde_json.workspace = true

[lints]
workspace = true
