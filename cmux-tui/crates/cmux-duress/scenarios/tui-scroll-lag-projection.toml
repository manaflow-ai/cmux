name = "tui-scroll-lag-projection"
summary = "tui-scroll-lag on the opt-in path (Agent CLI Screen Changes on): hybrid/lean frames, stage by stage"
sources = [
  "cmux-next-ios/CmuxMobileKit/Sources/CmuxMobileTerminal/Demo/TerminalDemo.swift tuiPan phases (#49954): tuipan-mouse-load / tuipan-keys-load run `claudefull 12000 <screen> stream=16`, a row added and the screen redrawn every 16 ms",
  "MockTerminalSession.swift:18-19: the mock grid is 50x40",
  "TerminalTUILocalPanUITests (#49954): a 10 s pan, drags swap direction every 3",
  "TerminalScrollBench.swift (#48951): toReply (wheel to the Mac's first output) maps to mac_queue_ms + mac_grid_ms + mac_diff_ms + mac_encode_ms + wire_ms; toPresent (wheel to the next present) maps to scroll_to_paint_ms",
]
spec = "idle,link=lte"
headless = true
# Added failing by #51584 (scroll_to_paint_ms p95 150 > 80, mac_queue_ms p95 21.8 > 16 on feat-cmux-next
# 097ddbd6f, run 45221463725); it kept every cmux-duress run red, so no run was ever a baseline.
known_failing = "Leo's TUI scroll lag on the projection path is open (Agent CLI Screen Changes on); the fix lanes are #51214 and #51766"
path = "projection"
cols = 50
rows = 40

# claudefull 12000 stream=16: 12000 lines, one row and one redraw every 16 ms (about 62 a second).
[tui]
doc_lines = 12000
append_lines_per_s = 62
redraw_fps = 62
seconds = 10

[[event]]
kind = "scroll"
every_ms = 50
rows = -3
steps_each_way = 3

[[check]]
metric = "paint_mismatch"
max = 0

[[check]]
metric = "scroll_to_paint_ms"
stat = "p95"
max = 80

# Budgets below are ours, not a harness's: the Mac keeps up with claudefull's 16 ms redraw,
# a scroll paints within about 5 frames, the phone's apply fits in half a frame.
[[check]]
metric = "mac_queue_ms"
stat = "p95"
max = 16

[[check]]
metric = "phone_paint_ms"
stat = "p95"
max = 8

[sim]
ui = ["TerminalTUILocalPanUITests"]
duress = "duress"
covers = "the phone's local pan gesture and the Ghostty surface's paint on device-class hardware (frames, p50/p95/max, hitches)"
