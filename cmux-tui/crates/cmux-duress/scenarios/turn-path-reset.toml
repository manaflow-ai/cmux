name = "turn-path-reset"
summary = "TURN relay path on a dual-homed Mac that resets every 60-100 s: recovery stays bounded"
sources = [
  "relayed by the mobile-speed coordinator from the failover work (cmux#50916): relay-30 measures 24.5 ms p50 / 27.7 ms p95 echo, a path reset's max is about 3.0 s",
  "the reset cadence (every 60-100 s, Mac dual-homed on en7/en0/utun16) is the reported case",
]
spec = "duress,stream_seconds=420,chat_records=0"
headless = true

# The relay hop as a cmux-fault link profile; its address_change stall is each reset's.
[link]
name = "turn-relay"
version = 1
down_kbit = 12000
up_kbit = 12000
rtt_ms = 21
jitter_ms = 4
disruption = { kind = "address_change", stall_ms = [1000, 2800] }
source = "cmux#50916 relay-30, as relayed"

[[event]]
kind = "path_reset"
every_ms = [60000, 100000]

[[event]]
kind = "echo"
every_ms = 250

[[check]]
metric = "reset_count"
min = 4

[[check]]
metric = "reset_recovery_ms"
max = 3500

[[check]]
metric = "reset_catch_up_frames"
max = 4

[[check]]
metric = "unfinished_marks"
max = 0

[[check]]
metric = "echo_ms"
stat = "p50"
min = 20
max = 28

[[check]]
metric = "echo_ms"
stat = "p95"
max = 30

[sim]
ui = ["TerminalScrollBench"]
duress = "duress,link=5g-lte-handoff"
covers = "the app's reconnect policy and the real relay; the sim's link is a builtin profile, without the periodic reset"
