name = "steady-rtt-echo"
summary = "a steady 80 ms RTT link under a streaming TUI: typed echo stays within two round trips"
sources = [
  "ReconnectChainTimingTests.swift: oneWayLatency 40 ms each way (line 195), so one round trip is 80 ms",
  "the echo bound (max 2 x RTT + slack) is an initial goal, not a measured baseline; tighten it from the first CI run",
]
spec = "duress,stream_seconds=60,chat_records=0"
headless = true

# The reconnect tests' link: 40 ms each way, no loss, mild jitter.
[link]
name = "steady-rtt80"
version = 1
down_kbit = 20000
up_kbit = 5000
rtt_ms = 80
jitter_ms = 4
source = "ReconnectChainTimingTests.swift oneWayLatency 40 ms"

[[event]]
kind = "echo"
every_ms = 250

[[check]]
metric = "echo_ms"
stat = "p50"
min = 75
max = 120

[[check]]
metric = "echo_ms"
stat = "p95"
max = 200

[[check]]
metric = "unfinished_marks"
max = 0

[[check]]
metric = "frame_ms"
stat = "p95"
max = 16.7

[sim]
only = ["CmuxMobileLiveTests/ReconnectChainTimingTests"]
covers = "the app's reconnect chain at the same 40 ms one-way latency; the sim does not time typed echo, which only this headless run measures"
