[package]
name = "cmux-chief"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Sans-I/O core of the Chief brain host: inbox, turns, supervisor, outbox, memory views (plans/cmux-next/chief-mac.md)"

[lints]
workspace = true

[dependencies]
cmux-conversation.workspace = true
serde.workspace = true
# float_roundtrip: exact float text parsing, so a count written as `9007199254740991.0` or
# `1790985600002.0` reads as that integer (JSON.parse is exact; the default parser may be one
# ULP off, which makes an integral value look fractional).
serde_json = { workspace = true, features = ["float_roundtrip"] }
