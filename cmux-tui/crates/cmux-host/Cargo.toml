[package]
name = "cmux-host"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "`cmux host run`: the machine bind agent and session host supervisor (clone detection, per-clone identity, park, supervision; plans/cmux-next/vm-image.md 6)"

[lints]
workspace = true

[[bin]]
name = "cmux-host"
path = "src/main.rs"

[features]
# The lab's tokio slow-poll detector (cmux-blocking; RUSTFLAGS="--cfg tokio_unstable").
cmux-stability = ["cmux-blocking/cmux-stability"]

[dependencies]
# Named threads at a declared QoS (plans/cmux-next/chrome-parity/p02-threads.md).
cmux-threads.workspace = true
cmux-blocking.workspace = true
cmux-panic-log.workspace = true
# Roles (the store update check and later app servers) come from
# cmux-server; dependency direction is cmux-host -> cmux-server ->
# cmux-server-core, never the reverse.
cmux-server = { path = "../cmux-server" }
cmux-server-core = { path = "../cmux-server-core" }
libc.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
# The composed bootstrap journey reuses cmux-server’s signed-channel fixtures.
flate2.workspace = true
ring.workspace = true
sha2.workspace = true
tar = { version = "0.4", default-features = false }
tokio.workspace = true
proptest = { version = "1", default-features = false, features = ["std"] }
tempfile = "3"
