[package]
name = "cmux-host"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "`cmux host run`: the machine bind agent and session host supervisor (clone detection, per-clone identity, park, supervision; plans/cmux-next/vm-image.md 6)"

[lints]
workspace = true

[[bin]]
name = "cmux-host"
path = "src/main.rs"

[dependencies]
cmux-cloud-environment.workspace = true
cmux-json.workspace = true
base64.workspace = true
cmux-cloud-wire.workspace = true
cmux-link.workspace = true
url.workspace = true
x25519-dalek.workspace = true
zeroize.workspace = true
# Roles (the store update check and later app servers) come from
# cmux-server; dependency direction is cmux-host -> cmux-server ->
# cmux-server-core, never the reverse.
cmux-server = { path = "../cmux-server" }
cmux-server-core = { path = "../cmux-server-core" }
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
# Hand-off ids (`cloud/handoff.rs`), named as the Cloud API names them.
sha2.workspace = true
ring.workspace = true
# gh's hosts.yml, read for the own-login check (`github_cli::parse_gh_hosts`).
yaml-rust = "0.4.5"
# The relay-first chat path (`cloud/relay.rs`): the machine's held socket to the platform.
futures-util.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true

[dev-dependencies]
# The composed bootstrap journey reuses cmux-server’s signed-channel fixtures.
flate2.workspace = true
ring.workspace = true
tar = { version = "0.4", default-features = false }
tokio.workspace = true
proptest = { version = "1", default-features = false, features = ["std"] }
tempfile = "3"
