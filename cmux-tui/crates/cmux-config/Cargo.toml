[package]
name = "cmux-config"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Owner of the settings file (~/.config/cmux/cmux-next.json) in the cmux daemon: schema validation, comment-preserving JSONC edits, managed (MDM and team) layers, the settings reducer, atomic publish, the cold-start cache and the file watcher."

[lints]
workspace = true

[dependencies]
cmux-json.workspace = true
# The one cmux.particles/1 validator (src/particles.rs), for agentPane.display.thinking.glyph:
# only its wire types, no VM (`default-features = false` in the workspace).
cmux-app-host.workspace = true
# The sidebar row layout reducer: the bounds of sidebar.workspaceRow.lines/linesByKind/linesByAgent
# (schema/sidebar_rows.rs). Pure, serde only.
cmux-layout-reducer.workspace = true
# The settings schema compiled in compressed (src/schema/mod.rs).
cmux-embed.workspace = true
cmux-theme-tokens.workspace = true
base64.workspace = true
notify.workspace = true
plist = "1"
# The app manifest schema's id pattern (tabs.newTabApp, schema/app_id.rs).
regex.workspace = true
serde.workspace = true
# raw_value: the embedded settings schema keeps each row as a slice of its text.
serde_json = { workspace = true, features = ["raw_value"] }
sha2.workspace = true
uuid.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-foundation-sys = "0.8"

[dev-dependencies]
jsonschema.workspace = true
