# include/cmux_daemon_conn.h is generated from src/ffi.rs, src/retry.rs and
# src/heartbeat.rs by cbindgen (cmux-app-ffi's pinned dev-dependency).
# cmux-app-ffi's tests/daemon_conn_header.rs regenerates it and fails with the
# diff when the committed header differs;
# CMUX_APP_FFI_HEADER_BLESS=1 cargo test --test daemon_conn_header
# (in cmux-tui/crates/cmux-app-ffi) rewrites it.
language = "C"
include_guard = "CMUX_DAEMON_CONN_H"
header = """
/* The cmux app's control connection rules (cmux-tui/crates/cmux-daemon-conn-core,
 * src/ffi.rs): retry pacing, the heartbeat, the request-latency probe, the
 * command scope, and the JSON ops of cmux_daemon_conn_call (src/ops.rs: the
 * handshake verdicts, compatibility, error classes, the owner idle probe).
 * Return codes: 0 OK, -1 a null pointer, -2 invalid input, -3 an unknown op,
 * -4 a panic inside (caught). cmux_daemon_conn_abi_version() returns
 * ABI_VERSION (src/ffi.rs). */"""
autogen_warning = """
/* Generated by cbindgen (cmux-tui/crates/cmux-daemon-conn-core/cbindgen.toml); do not edit.
 * Regenerate: CMUX_APP_FFI_HEADER_BLESS=1 cargo test --test daemon_conn_header (cmux-app-ffi) */"""
sys_includes = ["stdbool.h", "stddef.h", "stdint.h"]
no_includes = true
usize_is_size_t = true
style = "type"
documentation_style = "c"
line_length = 120
tab_width = 4

[export]
item_types = ["structs", "functions", "opaque"]
