[package]
name = "cmux-blocking"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "The tokio layer of cmux_threads blocking policy (Chrome's ScopedBlockingCall): block_in_place on multi_thread workers, stall records on runtime driving threads"

[lints]
workspace = true

[features]
default = []
# The lab's tokio slow-poll detector (`poll_watch`), built
# only with RUSTFLAGS="--cfg tokio_unstable" in the lab lane. Off in every
# shipped build. Consumer crates forward their own `cmux-stability` here.
cmux-stability = []

[dependencies]
cmux-panic-log.workspace = true
cmux-threads = { workspace = true, features = ["tokio"] }
serde_json.workspace = true
tokio.workspace = true
