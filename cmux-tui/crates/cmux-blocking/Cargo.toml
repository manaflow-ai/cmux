[package]
name = "cmux-blocking"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Blocking calls on tokio threads, Chrome's MayBlock and ScopedBlockingCall: compensated on multi_thread workers, counted and recorded on current_thread runtimes"

[lints]
workspace = true

[features]
default = []
# The lab's tokio slow-poll detector (p10-stability-033, `poll_watch`), built
# only with RUSTFLAGS="--cfg tokio_unstable" in the lab lane. Off in every
# shipped build. Consumer crates forward their own `cmux-stability` here.
cmux-stability = []

[dependencies]
cmux-panic-log.workspace = true
serde_json.workspace = true
tokio.workspace = true
