[package]
name = "cmux-cloud-codex-holder"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "The NEXT app's Codex access holder for its Cloud machines: one private holder per account scope, device-code sign-in, access-only delivery, renewal, the delivery record and the Mac's own Codex sign-in, run by `cmux cloud codex-holder`"

[dependencies]
async-trait.workspace = true
base64.workspace = true
# The broker dies with the holder (`ChildGroup`).
cmux-process.workspace = true
futures-util.workspace = true
libc.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["io-std", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
tokio-util.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["io-std", "io-util", "macros", "process", "rt-multi-thread", "sync", "time", "test-util"] }

[lints]
workspace = true
