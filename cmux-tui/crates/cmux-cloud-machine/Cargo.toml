[package]
name = "cmux-cloud-machine"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "NEXT Cloud's machine record as the app shows it, and its rules (pure; the macOS app asks them over the app FFI): reading a server record, the Pause, Resume and Kill overlay, the pushed state's frames, the machine cap card, the API's failures and the small Cloud API models"

[dependencies]
# The app FFI pin scanner follows explicit path dependencies.
cmux-lifeline = { path = "../cmux-lifeline" }
# The guest disk report a record carries (`disk_health`).
cmux-cloud-disk = { path = "../cmux-cloud-disk" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[lints]
workspace = true
