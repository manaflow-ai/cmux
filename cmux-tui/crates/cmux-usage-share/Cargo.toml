[package]
name = "cmux-usage-share"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Opt-in team usage sharing for acpmux: one record per agent turn (tokens, time, tool calls, hashed ids, never content) spooled locally and uploaded in batches to cmux-platform's /v1/usage/records. Off until diagnostics.usageSharing is on."

[dependencies]
chrono.workspace = true
cmux-config.workspace = true
getrandom.workspace = true
hex.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2.workspace = true

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
