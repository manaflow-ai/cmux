[package]
name = "cmux-auto-session"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Auto mode's shared core (plans/cmux-next/auto-mode/DESIGN.md): the Cloud API's wire types, the holder's state machine as one pure step, snapshot chunks, and the Cloud store as a trait with an in-memory fake (sans-I/O)"

[lints]
workspace = true

[features]
# `fake::FakeAutoCloud`: the Cloud store in memory, under the real store's rules. For another
# crate's dev-dependencies only; never in a shipped build.
test-support = []

# The conformance vectors (fixtures/conformance.json) against the fake store:
# `cargo test -p cmux-auto-session --features test-support --test conformance`. The Cloud API's
# test replays the same file against the real routes.
[[test]]
name = "conformance"
path = "tests/conformance/main.rs"
required-features = ["test-support"]

[dependencies]
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
