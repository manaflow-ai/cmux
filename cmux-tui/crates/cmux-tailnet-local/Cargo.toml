[package]
name = "cmux-tailnet-local"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Read-only client for the system tailscaled LocalAPI: per-peer path (direct, DERP, peer relay) with a cached snapshot for hot paths. Pure Rust, no Go."

[dependencies]
serde.workspace = true
serde_json.workspace = true
base64.workspace = true

# The CLI fallback's child is owned (killed and reaped with its handle);
# iOS has no CLI to run.
[target.'cfg(not(target_os = "ios"))'.dependencies]
cmux-process = { path = "../cmux-process" }

[lints]
workspace = true
