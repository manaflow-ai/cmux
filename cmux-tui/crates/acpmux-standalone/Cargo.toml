[package]
name = "acpmux-standalone"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "The shipped standalone acpmux binary: acpmux without its build-id feature, the build id stamped in this binary only"

# The packages stage it as `acpmux` (cmux-tui-build-package.yml). Its own name
# here: a second `acpmux` binary in the workspace would collide with the acpmux
# package's, which the acpmux tests run (CARGO_BIN_EXE_acpmux).
[[bin]]
name = "acpmux-standalone"
path = "src/main.rs"

[dependencies]
# Without `build-id`: the acpmux lib then has no per-commit input, and a new
# commit that leaves acpmux's sources alone recompiles only acpmux-build-id
# and this binary (acpmux-build-id docs).
acpmux = { path = "../acpmux", default-features = false }
acpmux-build-id = { path = "../acpmux-build-id" }
anyhow = "1"

[target.'cfg(all(target_os = "linux", target_env = "musl"))'.dependencies]
# The daemon's allocator on musl Linux, the shipped packages (src/main.rs); gnu builds keep glibc.
mimalloc = { version = "0.1", default-features = false }

# acpmux's shipping features, passed through: the package builds this binary
# with scripts/ci/acpmux-build-features.sh's flags on this manifest, as it builds
# `-p acpmux` with them on acpmux's. Without these the Linux package's acpmux had
# no hub carrier at all (c10f26a1a on Linux, 2026-11-15).
[features]
tailnet = ["acpmux/tailnet"]
hub-carrier = ["acpmux/hub-carrier"]

[lints]
workspace = true
