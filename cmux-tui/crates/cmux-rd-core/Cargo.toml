[package]
name = "cmux-rd-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "cmux remote desktop engine core: FEC, packetizer, reassembly, flow and congestion control, input, sessions and access policy (pure, injected clock)"

[features]
# The Mac app's Mac Screen rules over JSON (`rd_hub`: the device hub side).
app = ["dep:serde", "dep:serde_json", "cmux-rd-proto/serde"]

[lints]
workspace = true

[dependencies]
cmux-rd-proto = { path = "../cmux-rd-proto" }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }
