[package]
name = "cmux-forum-hosted"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Hosted forum client for the daemon: wire model, auth, feed cursor and thread cache"

[features]
default = []
# The reqwest transport. Off by default so tests and callers with their own transport build without it.
http = ["dep:reqwest"]

[dependencies]
reqwest = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
url = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }

[lints]
workspace = true
