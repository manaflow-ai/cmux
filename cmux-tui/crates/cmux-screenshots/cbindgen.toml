# include/cmux_screenshots.h is cbindgen's output for src/ffi.rs (the one file
# it reads, so no other item of the crate reaches the header).
# cmux-app-ffi's tests/screenshots_header.rs regenerates it and fails with the
# diff when the committed header differs;
# CMUX_APP_FFI_HEADER_BLESS=1 cargo test --test screenshots_header
# (in cmux-tui/crates/cmux-app-ffi) rewrites it.
language = "C"
include_guard = "CMUX_SCREENSHOTS_H"
header = """
/* The Screenshots pane's rules (cmux-tui/crates/cmux-screenshots, src/ffi.rs): which files and
 * folders a source lists, the newest-first listing, the sources and where tools save, the page
 * address, the access gate and file names. The app reads disks and preferences and draws. */"""
autogen_warning = """
/* Generated by cbindgen (cmux-tui/crates/cmux-screenshots/cbindgen.toml); do not edit.
 * Regenerate: CMUX_APP_FFI_HEADER_BLESS=1 cargo test --test screenshots_header (cmux-app-ffi) */"""
sys_includes = ["stdbool.h", "stddef.h", "stdint.h"]
no_includes = true
usize_is_size_t = true
style = "type"
documentation_style = "c"
line_length = 120
tab_width = 4

[export]
item_types = ["constants", "structs", "opaque", "functions"]
