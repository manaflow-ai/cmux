# include/cmux_update_prewarm.h is cbindgen's output for src/ffi.rs (the one
# file it reads, so no other item of the crate reaches the header).
# cmux-app-ffi's tests/update_prewarm_header.rs regenerates it and fails with
# the diff when the committed header differs;
# CMUX_APP_FFI_HEADER_BLESS=1 cargo test --test update_prewarm_header
# (in cmux-tui/crates/cmux-app-ffi) rewrites it.
language = "C"
include_guard = "CMUX_UPDATE_PREWARM_H"
header = """
/* The cmux macOS app's staged-update pre-warm record
 * (cmux-tui/crates/cmux-update-prewarm-core, src/ffi.rs): the marker line
 * each pre-warm step writes and what a build's first launch reads from it.
 * Every rule is a JSON op of cmux_update_prewarm_call (src/ops.rs lists
 * them). */"""
autogen_warning = """
/* Generated by cbindgen (cmux-tui/crates/cmux-update-prewarm-core/cbindgen.toml); do not edit.
 * Regenerate: CMUX_APP_FFI_HEADER_BLESS=1 cargo test --test update_prewarm_header (cmux-app-ffi) */"""
sys_includes = ["stdbool.h", "stddef.h", "stdint.h"]
no_includes = true
usize_is_size_t = true
style = "type"
documentation_style = "c"
line_length = 120
tab_width = 4

[export]
item_types = ["constants", "structs", "opaque", "functions"]
