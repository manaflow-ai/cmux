[package]
name = "cmux-device-hub-client"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Device hub client for cmux-tui on Windows and Linux: device keys, signed requests, the User DO socket and Computer Use approvals"

[lints]
workspace = true

[dependencies]
async-trait.workspace = true
base64.workspace = true
futures-util.workspace = true
hex.workspace = true
reqwest.workspace = true
ring.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
url.workspace = true
uuid.workspace = true
zeroize.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# The Secret Service (GNOME Keyring, KWallet) over D-Bus. libdbus is vendored
# (through `dbus`, so no OpenSSL) and no system headers are needed to build.
dbus = { version = "0.9", features = ["vendored"] }
keyring = { version = "3", default-features = false, features = ["sync-secret-service"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[dev-dependencies]
axum.workspace = true
tempfile = "3"
tokio = { workspace = true, features = ["test-util"] }
