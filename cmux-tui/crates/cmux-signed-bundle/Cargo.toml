[package]
name = "cmux-signed-bundle"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "A verified copy of a signed macOS helper bundle outside its app: its content digest, its signature checked against a code requirement, and one copy per helper bundle id at a fixed path, replaced in place under a lock (the Screen Sharing helper for the cmux-tui daemon's Computer Use and the acpmux share host, the DEV files host)"

[lints]
workspace = true

[dependencies]
# `codesign`, `ditto` and `plutil`, each an owned child.
cmux-process.workspace = true
# The folder's lock, which every stager of a helper takes.
cmux-file-lock.workspace = true
sha2.workspace = true

[target.'cfg(unix)'.dependencies]
# `renamex_np(RENAME_SWAP)` and `O_NOFOLLOW`.
libc.workspace = true

[dev-dependencies]
tempfile = "3"
