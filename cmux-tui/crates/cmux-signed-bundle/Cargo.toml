[package]
name = "cmux-signed-bundle"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "A verified copy of a signed macOS helper bundle outside its app: its content digest, its signature checked against a code requirement, one staged copy per digest, and the old copies pruned (the Computer Use helper, whose one copy the daemon's supervisor and the acpmux share host both run, and a separate Screen Sharing helper)"

[lints]
workspace = true

[dependencies]
# `codesign`, `ditto` and `plutil`, each an owned child.
cmux-process.workspace = true
# The staging root's lock: two stagers of one root (the daemon's supervisor and the acpmux
# share host) take turns.
cmux-file-lock.workspace = true
sha2.workspace = true

[dev-dependencies]
tempfile = "3"
