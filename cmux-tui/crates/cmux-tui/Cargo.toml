[package]
name = "cmux-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "cmux-tui: tmux-like terminal multiplexer TUI backed by libghostty-vt"

[lints]
workspace = true

[features]
default = []
iroh-transport = ["cmux-remote/iroh-transport"]
# Windows only (cx-w0uha): build cmux-tui.exe as a thin launcher that loads
# the whole program from cmux_tui.dll beside it. The DLL is the library
# target built with `cargo rustc -p cmux-tui --lib --crate-type cdylib`.
# Windows Defender scans every large image in a new shell's process lineage
# when PowerShell 7 starts (about 470 ms per terminal for the 41 MB daemon);
# a loaded DLL is not scanned that way. Without this feature cmux-tui.exe is
# the whole program on every platform (dev builds, tests).
windows-thin-exe = []

# The whole program. src/main.rs stays the crate root (its dispatch tables are
# where they always were); the cmux-tui binary is a small entry point that
# calls `cmux_tui::main`, or, with `windows-thin-exe` on Windows, loads the
# program from cmux_tui.dll.
[lib]
name = "cmux_tui"
path = "src/main.rs"

[[bin]]
name = "cmux-tui"
path = "src/bin/cmux-tui.rs"

[[bin]]
name = "cmux-tui-hook"
path = "src/bin/cmux-tui-hook.rs"

# The per-terminal host (cx-1vlzr): a small sibling binary the daemon spawns
# instead of re-exec'ing itself. On Windows Defender's first-child image scan
# (cost scales with the creator's image size) stays cheap per terminal; on
# macOS an idle host no longer maps the monolith's ~390 dylib images
# (host_exe.rs; build.rs links it with -dead_strip_dylibs). Built on every
# platform for one packaging contract; Linux re-execs /proc/self/exe. Links
# only the terminal-host runtime, so dead-code elimination keeps it small.
[[bin]]
name = "cmux-tui-host"
path = "src/bin/cmux-tui-host.rs"

[dependencies]
ghostty-vt.workspace = true
cmux-tui-core.workspace = true
# `cmux vm`: the cmux-vm child starts through the daemon-safe spawn.
cmux-process.workspace = true
cmux-api-compat.workspace = true
# `cmux settings list|schema|validate`: the settings schema and owner state.
cmux-config.workspace = true
# `cmux agent hooks` and the hook paths the Claude wrapper reads.
cmux-tui-hooks.workspace = true
cmux-tui-cdp.workspace = true
cmux-tui-machine-agent-protocol.workspace = true
cmux-tui-machine-protocol.workspace = true
# `cmux server …`, the machine server verbs (plans/cmux-next/server.md).
cmux-server.workspace = true
cmux-server-core.workspace = true
ratatui.workspace = true
crossterm.workspace = true
crossbeam-channel.workspace = true
anyhow.workspace = true
bytes.workspace = true
unicode-width.workspace = true
unicode-segmentation.workspace = true
serde.workspace = true
serde_json.workspace = true
cmux-panic-log.workspace = true
# `cmux agents wait --regex` checks a pattern as the daemon's terminal.wait does.
regex.workspace = true
# `cmux mcp serve` code mode: `cmux_exec` scripts run in an embedded engine.
rquickjs.workspace = true
toml.workspace = true
base64.workspace = true
getrandom.workspace = true
glob.workspace = true
libc.workspace = true
smallvec.workspace = true
zeroize.workspace = true
terminput.workspace = true
terminput-crossterm.workspace = true
parking_lot.workspace = true
sha2.workspace = true
uuid.workspace = true
wait-timeout.workspace = true
# Verifies the signed invite-wave flags (feature_flags.rs); tests sign with it.
ring.workspace = true
# `cmux acp` and the `acpmux` multicall name (plans/cmux-next/cli.md), unix
# only; on every platform, the tailnet CLI wrapper `remote_host` shares
# (acpmux::tailnet). `-p acpmux` checks on Windows in the same CI job.
acpmux = { path = "../acpmux" }

[target.'cfg(unix)'.dependencies]
cmux-holder.workspace = true
# `cmux host …`, the machine supervisor and process roles (server.md 5.1).
cmux-host.workspace = true
# Reads the enclosing app bundle's Info.plist (app_identity.rs).
plist = "1.10"
# The build identity (daemon skew, SSH re-bootstrap). Only this crate reads
# it, so an edit does not recompile cmux-remote (cmux-build-identity docs).
cmux-build-identity.workspace = true
cmux-remote.workspace = true
cmux-remote-protocol.workspace = true
cmux-wg.workspace = true
cmux-link.workspace = true
cmux-agent-pane-policy.workspace = true
cmux-unix-socket.workspace = true
x25519-dalek.workspace = true
tokio.workspace = true
# Machine spend readout: one small JSON GET every few minutes from inside a
# Cloud VM. chatmux-relay already uses reqwest for pairing bootstrap.
# `stream`: attachment files upload from disk, never read whole.
reqwest = { workspace = true, features = ["stream"] }
rustls.workspace = true
url.workspace = true
async-trait.workspace = true
# The cloud conversations proxy (`cloud-conversations-v1`): cmux.wire/1
# sockets to the cmux Cloud API. Both are already in the graph via acpmux.
tokio-tungstenite.workspace = true
futures-util.workspace = true
# cmux NEXT's Chief home adoption copies live SQLite databases with
# `VACUUM INTO` (build_adopt/copy.rs); already in the graph via cmux-tui-core.
rusqlite.workspace = true

[target.'cfg(windows)'.dependencies]
tokio.workspace = true
windows-sys = { workspace = true, features = ["Win32_System_LibraryLoader"] }

[build-dependencies]
# build.rs reads the browser registry's ids and names.
serde_json.workspace = true

[dev-dependencies]
cmux-pty.workspace = true
cmux-unix-socket = { workspace = true, features = ["test-support"] }
tempfile = "3"
rusqlite.workspace = true
