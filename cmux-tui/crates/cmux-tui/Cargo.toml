[package]
name = "cmux-tui"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "cmux-tui: tmux-like terminal multiplexer TUI backed by libghostty-vt"

[lints]
workspace = true

[[bin]]
name = "cmux-tui"
path = "src/main.rs"

[[bin]]
name = "cmux-tui-hook"
path = "src/bin/cmux-tui-hook.rs"

[dependencies]
ghostty-vt.workspace = true
cmux-tui-core.workspace = true
cmux-tui-cdp.workspace = true
cmux-tui-machine-agent-protocol.workspace = true
cmux-tui-machine-protocol.workspace = true
ratatui.workspace = true
crossterm.workspace = true
crossbeam-channel.workspace = true
anyhow.workspace = true
unicode-width.workspace = true
unicode-segmentation.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
base64.workspace = true
getrandom.workspace = true
glob.workspace = true
libc.workspace = true
smallvec.workspace = true
zeroize.workspace = true
terminput.workspace = true
terminput-crossterm.workspace = true
parking_lot.workspace = true
sha2.workspace = true
uuid.workspace = true
wait-timeout.workspace = true
fs4.workspace = true

[target.'cfg(unix)'.dependencies]
cmux-remote.workspace = true
cmux-remote-protocol.workspace = true
tokio.workspace = true
url.workspace = true
async-trait.workspace = true

[target.'cfg(windows)'.dependencies]
tokio.workspace = true
windows-sys.workspace = true

[dev-dependencies]
cmux-pty.workspace = true
tempfile = "3"
rusqlite.workspace = true
