[package]
name = "cmux-tui-test-modules"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "The module list of cmux-tui's one integration-test binary (tests/it), read from the files in tests/"

# Its own package, not cmux-tui's build script: a build script that reruns on every edit under
# tests/ would rebuild the cmux-tui library each time a test changes.
[lib]
path = "lib.rs"

[lints]
workspace = true
