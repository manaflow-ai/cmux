[package]
name = "cmux-launch-shell"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "GPL-3.0-or-later"
publish = false
workspace = "../cmux-app-ffi"
description = "The stage-0 launch window's plan (what it shows) and input hold, and the relaunch cover (an update's relaunch shows each window's last picture until its live content is ready), in Rust"

[dependencies]
cmux-launch-record = { path = "../cmux-launch-record" }
cmux-window-rules = { path = "../cmux-window-rules" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
proptest = "1"
