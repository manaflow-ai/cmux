[package]
name = "cmux-tui-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Terminal multiplexer core: workspaces, tabs, panes, PTY runtime, control socket"

[lints]
workspace = true

[features]
# In-place hot-patching under `dx serve --hot-patch` (src/hotpatch.rs). Debug
# builds only; no shipped build enables it.
hotpatch = ["dep:subsecond"]

[dependencies]
cmux-transport-rewrite.workspace = true
# What a Cloud machine state frame means (machine_state_push.rs, apps-machine-state-watch).
cmux-cloud-machine.workspace = true
cmux-presence.workspace = true
cmux-egress.workspace = true
cmux-build-space.workspace = true
cmux-json.workspace = true
# Names a crash sidecar's backtrace in a stripped release binary.
cmux-panic-log.workspace = true
# Locks that unlock before they close (a forked child keeps none).
cmux-file-lock.workspace = true
cmux-agent-pane-policy.workspace = true
# The hybrid stream of agent CLI terminals (server/agent_cli_hybrid.rs).
cmux-agent-cli-render = { path = "../cmux-agent-cli-render" }
ghostty-vt.workspace = true
# Cmd-F over the whole retained history (server/cmd_terminal_find.rs).
cmux-terminal-find.workspace = true
cmux-tui-cdp.workspace = true
cmux-layout-reducer.workspace = true
# The tab a pane selects after a close (close_focus::tab), the app's own rule.
cmux-focus-core.workspace = true
# The daemon checks URLs with the URL parser (`url`); the app links the crate without it.
cmux-bookmarks-core = { workspace = true, features = ["url"] }
cmux-bookmarks-ops = { workspace = true }
cmux-unix-socket.workspace = true
cmux-url-input.workspace = true
cmux-pty.workspace = true
cmux-terminal-host-protocol.workspace = true
cmux-holder.workspace = true
cmux-process.workspace = true
# cmux Remote's stop intent: a person's Quit never respawns (remote_host/unix.rs, F17).
cmux-supervise-core.workspace = true
cmux-flow-trace.workspace = true
cmux-interactivity.workspace = true
cmux-remote-protocol.workspace = true
cmux-conversation.workspace = true
cmux-git.workspace = true
cmux-tag-cache.workspace = true
cmux-classic-import.workspace = true
cmux-conductor-import.workspace = true
# Another browser's files for the app's browser import (resource_router/browser_import.rs).
cmux-browser-import.workspace = true
cmux-palette-ranker.workspace = true
cmux-theme-tokens.workspace = true
cmux-config.workspace = true
# The person's saved prompts (`apps.composer.list`), in the format `cmux agent-config commands` writes.
cmux-agent-customize.workspace = true
# The Computer Use policy and wire types (the engine only; the worker is the cmux-tui binary).
cmux-computer-use.workspace = true
cmux-usage-patterns.workspace = true
cmux-feed-core.workspace = true
cmux-history.workspace = true
# The Tasks page link (tasks_link.rs): the owner socket protocol and its client.
cmux-tasks.workspace = true
cmux-tasks-core.workspace = true
cmux-tui-cloud-conversations.workspace = true
cmux-tui-platform.workspace = true
cmux-tui-image-paste.workspace = true
cmux-tui-remote-access.workspace = true
cmux-tui-util.workspace = true
cmux-kitty-media.workspace = true
cmux-api-compat.workspace = true
cmux-terminal-iface.workspace = true
cmux-terminal-sizing.workspace = true
# This machine's device kind for `identify` (`machine_device`, `machine_symbol`).
cmux-device-kind.workspace = true
serde.workspace = true
subsecond = { workspace = true, optional = true }
# float_roundtrip, unbounded_depth: the cached session snapshot keeps its public values as JSON text
# and each read parses them back to the same values, at any depth (resource_api/committed_snapshot.rs
# `CompactJson`). cmux-layout-reducer already turns both on for this build.
serde_json = { workspace = true, features = ["float_roundtrip", "unbounded_depth"] }
uuid.workspace = true
toml.workspace = true
anyhow.workspace = true
base64.workspace = true
memchr.workspace = true
libc.workspace = true
regex.workspace = true
jsonschema.workspace = true
flate2.workspace = true
zstd.workspace = true
# The JSON catalogs compiled in compressed (src/packed_catalogs.rs).
cmux-embed.workspace = true
wait-timeout.workspace = true
tungstenite.workspace = true
cmux-local-auth.workspace = true
cmux-local-url.workspace = true
cmux-link.workspace = true
getrandom.workspace = true
rusqlite.workspace = true
parking_lot = { workspace = true, features = ["arc_lock"] }
arc-swap.workspace = true
fs4.workspace = true
sha2.workspace = true
# cmux Remote's verified copy outside the app (`remote_host/macos.rs`).
cmux-signed-bundle.workspace = true
# A store package's `STORE.sig`, checked against the store keys (`apps/store_trust.rs`).
cmux-signed-envelope.workspace = true
quick-xml.workspace = true
notify.workspace = true
zeroize.workspace = true
url.workspace = true
cmux-app-manifest.workspace = true
cmux-app-host.workspace = true

[dev-dependencies]
# Seeded-secret tests: gated clients send to a local capture server (server/forum_routed.rs).
cmux-egress = { workspace = true, features = ["capture"] }
# The headless Mac output to iPhone paint row (server/output_to_paint_tests.rs).
cmux-output-paint.workspace = true
cmux-tui-cloud-conversations = { workspace = true, features = ["test-support"] }
cmux-tui-platform = { workspace = true, features = ["test-support"] }
cmux-tui-remote-access = { workspace = true, features = ["test-support"] }
cmux-tui-util = { workspace = true, features = ["test-support"] }
cmux-unix-socket = { workspace = true, features = ["test-support"] }
proptest = { version = "1", default-features = false, features = ["std"] }
# Signs the test store packages (`apps/store_trust_tests.rs`).
ring.workspace = true
# The worker's control channel in-process, for the Computer Use supervisor's tests.
cmux-computer-use = { workspace = true, features = ["server"] }

# The app supervisor's net.fetch egress (same versions the cmux-tui binary
# already links).
[target.'cfg(unix)'.dependencies]
# Idle terminal-host links wait on one shared poller, not a thread each (surface/idle_links.rs).
mio.workspace = true
# Projected folders (projection.rs): the manifest, the stream to the Mac and the mount.
cmux-projection.workspace = true
# The agent service's v2 list: the list callers' one source (server/agent_session_list_source.rs).
acpmux-client = { path = "../acpmux-client", features = ["tokio"] }
acpmux-list-types = { path = "../acpmux-list-types" }
# The Cloud API calls the daemon's cloud.* ops answer (server/cloud_api.rs).
cmux-cloud-api.workspace = true
reqwest.workspace = true
rustls.workspace = true
tokio.workspace = true
# The Forum page's hosted forum (server/forum_routed.rs): the /v1/forum client and its times.
cmux-forum-hosted = { path = "../cmux-forum-hosted", features = ["http"] }
time.workspace = true
# The link share bridge's room socket (agent_session_share_room.rs), the
# client the cmux-tui binary already links for cmux.wire/1.
tokio-tungstenite.workspace = true
futures-util.workspace = true
# The app's language packs (language_packs.rs): a zstd tar, the reader the cmux-tui binary
# already links for `cmux customize use pr:N`, and git installs: the archive of a repository at a
# commit (apps/git_source.rs).
tar.workspace = true

[target.'cfg(unix)'.dev-dependencies]
# The SDK's raw client drives the cloud.* operations in server/cloud_api_tests.rs.
cmux-sdk = { path = "../../bindings/rust", default-features = false }
# An agent service in the test's process that serves the v2 list (acpmux's `test-support`
# module, never in a shipped build): the list callers' recorded runs and v2.pr07c gates.
acpmux = { path = "../acpmux", default-features = false, features = ["test-support"] }

[target.'cfg(windows)'.dependencies]
# The local socket transport and its same-user checks (cmux::local_socket),
# shared with the SDK's clients; the SDK's client code is not built.
cmux-sdk = { path = "../../bindings/rust", default-features = false, features = ["local-socket"] }
uds_windows.workspace = true
windows-sys = { workspace = true, features = [
    "Wdk_System_Threading",
    "Win32_Foundation",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Kernel",
    "Win32_System_Pipes",
    "Win32_System_ProcessStatus",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
] }
