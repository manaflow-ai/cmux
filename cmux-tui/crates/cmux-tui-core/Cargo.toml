[package]
name = "cmux-tui-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Terminal multiplexer core: workspaces, tabs, panes, PTY runtime, control socket"

[lints]
workspace = true

[dependencies]
ghostty-vt.workspace = true
cmux-tui-cdp.workspace = true
cmux-layout-reducer.workspace = true
cmux-unix-socket.workspace = true
cmux-pty.workspace = true
cmux-remote-protocol.workspace = true
cmux-conversation.workspace = true
cmux-terminal-iface.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
base64.workspace = true
libc.workspace = true
regex.workspace = true
jsonschema.workspace = true
flate2.workspace = true
wait-timeout.workspace = true
tungstenite.workspace = true
cmux-local-auth.workspace = true
cmux-link.workspace = true
getrandom.workspace = true
rusqlite.workspace = true
fs4.workspace = true
sha2.workspace = true
zeroize.workspace = true
url.workspace = true
cmux-app-manifest.workspace = true
cmux-app-host.workspace = true

[dev-dependencies]
cmux-unix-socket = { workspace = true, features = ["test-support"] }
proptest = { version = "1", default-features = false, features = ["std"] }

# The app supervisor's net.fetch egress (same versions the cmux-tui binary
# already links).
[target.'cfg(unix)'.dependencies]
reqwest.workspace = true
rustls.workspace = true
tokio.workspace = true

[target.'cfg(windows)'.dependencies]
# The local socket transport and its same-user checks (cmux::local_socket),
# shared with the SDK's clients; the SDK's client code is not built.
cmux-sdk = { path = "../../bindings/rust", default-features = false, features = ["local-socket"] }
uds_windows.workspace = true
windows-sys.workspace = true
