[package]
name = "cmux-mobile-last-place"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Where the person was on the phone (workspace, chat or terminal, scroll anchor, selection): saved on change with a debounce, read synchronously on launch from one small file, and checked against the cached workspaces. No network, no clock of its own."

[lints]
workspace = true

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
