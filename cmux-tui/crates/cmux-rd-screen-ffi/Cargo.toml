[package]
name = "cmux-rd-screen-ffi"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "C ABI of the screen stream's rules (cmux-rd-screen's screen_* and cmux-vnc's vnc_* JSON ops) for processes outside the app: cmux Remote's Screen Sharing worker and cmux-vnc-host (libcmux_rd_screen.dylib)"

[lib]
name = "cmux_rd_screen_ffi"
doctest = false
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
cmux-rd-screen = { path = "../cmux-rd-screen" }
cmux-vnc = { path = "../cmux-vnc" }
serde_json.workspace = true
