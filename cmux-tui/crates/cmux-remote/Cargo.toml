[package]
name = "cmux-remote"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Authenticated remote daemon, transports, and workspace services for cmux-tui"

[lints]
workspace = true

[features]
default = ["iroh-transport"]
iroh-transport = ["dep:iroh", "dep:socket2"]

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
axum.workspace = true
base64.workspace = true
bytes.workspace = true
cmux-pty.workspace = true
cmux-remote-protocol.workspace = true
cmux-tui-core.workspace = true
diffy.workspace = true
fs4.workspace = true
futures-util.workspace = true
getrandom.workspace = true
ghostty-vt.workspace = true
hmac.workspace = true
http.workspace = true
hyper.workspace = true
hyper-util.workspace = true
iroh = { workspace = true, optional = true }
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
socket2 = { workspace = true, optional = true }
snow.workspace = true
subtle.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
tower.workspace = true
tower-http.workspace = true
url.workspace = true
uuid.workspace = true
x25519-dalek.workspace = true
zeroize.workspace = true

[build-dependencies]
# This root package uses Cargo's Git-aware default fingerprint to notice new
# workspace-root files without recursively walking target/.
cmux-tui-source-watch = { path = "../.." }

[dev-dependencies]
cmux-relay = { path = "../cmux-relay" }
rcgen = "0.14"
tempfile = "3"
tokio = { workspace = true, features = ["test-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
