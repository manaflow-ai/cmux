[package]
name = "cmux-wg-tun"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "WireGuard over a macOS utun fd for the opt-in cmux Cloud Tunnel system extension: boringtun with no TCP stack"

# Every `unsafe` block, impl and `pub unsafe fn` here states why it is sound: a `// SAFETY:`
# comment above it, or a `# Safety` doc section on the fn. Cargo cannot extend
# `[workspace.lints]`, so the inheriting crates mirror it here; the workspace lint drift test
# (.github/scripts/test_cmux_tui_unsafe_lints.py) keeps the copy equal.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_qualifications = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

[lints.clippy]
uninlined_format_args = "warn"
semicolon_if_nothing_returned = "warn"
redundant_clone = "warn"
await_holding_lock = "warn"
await_holding_refcell_ref = "warn"
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"

# staticlib: linked into the Cloud Tunnel system extension
# (scripts/cmux-next/build-wg-tun.sh). rlib: the crate's own tests.
[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
boringtun.workspace = true
# WgConfig (the wg-quick parser the userspace hub uses) and TimerSchedule
# (zero wakeups on an idle tunnel); smoltcp and the rest are dead-stripped.
cmux-wg = { path = "../cmux-wg" }
libc.workspace = true
tokio.workspace = true
x25519-dalek.workspace = true

[dev-dependencies]
base64.workspace = true
getrandom.workspace = true
