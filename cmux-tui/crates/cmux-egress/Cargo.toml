[package]
name = "cmux-egress"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "The daemon's egress gate: every HTTP client cmux makes for itself is built here, and a connection to a host docs/privacy.md does not list is refused in dev and nightly builds."

[features]
# blocking_client_builder: a gated reqwest::blocking client.
blocking = ["reqwest/blocking"]
# capture::install: the seeded-secret tests' local TLS server (dev-dependencies only, never a shipped build).
capture = ["dep:bytes", "dep:cmux-scope", "dep:http-body-util", "dep:hyper", "dep:hyper-util", "dep:rcgen", "dep:tokio-rustls", "tokio/rt"]

[dependencies]
reqwest.workspace = true
rustls.workspace = true
tokio = { workspace = true, features = ["net"] }
tokio-tungstenite.workspace = true
bytes = { workspace = true, optional = true }
cmux-scope = { workspace = true, optional = true }
http-body-util = { workspace = true, optional = true }
hyper = { workspace = true, optional = true }
hyper-util = { workspace = true, features = ["service", "tokio"], optional = true }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "pem"], optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"], optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
# The seeded-secret tests (tests/seeded_secret.rs) run with capture on.
cmux-egress = { path = ".", features = ["capture"] }

[lints]
workspace = true
