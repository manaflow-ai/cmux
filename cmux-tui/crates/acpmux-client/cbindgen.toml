# Generated from src/ffi.rs; cmux-app-ffi tests/acpmux_client_header.rs checks it.
language = "C"
include_guard = "ACPMUX_CLIENT_H"
header = """
/* The no-I/O agent list client. The caller owns the socket, serializes calls
 * on each handle, and frees returned buffers with acpmux_client_bytes_free. */"""
autogen_warning = """
/* Generated by cbindgen (cmux-tui/crates/acpmux-client/cbindgen.toml); do not edit.
 * Regenerate: CMUX_APP_FFI_HEADER_BLESS=1 cargo test --test acpmux_client_header (cmux-app-ffi) */"""
sys_includes = ["stdbool.h", "stddef.h", "stdint.h"]
no_includes = true
usize_is_size_t = true
style = "type"
documentation_style = "c"
line_length = 120
tab_width = 4

[export]
item_types = ["constants", "structs", "opaque", "functions"]

[export.rename]
"Bytes" = "AcpmuxClientBytes"
