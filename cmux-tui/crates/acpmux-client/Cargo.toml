[package]
name = "acpmux-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "The v2 agent service client core"

# Every `unsafe` block, impl and `pub unsafe fn` here states why it is sound: a `// SAFETY:`
# comment above it, or a `# Safety` doc section on the fn. Cargo cannot extend
# `[workspace.lints]`, so the inheriting crates mirror it here; the workspace lint drift test
# (.github/scripts/test_cmux_tui_unsafe_lints.py) keeps the copy equal.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_qualifications = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

[lints.clippy]
uninlined_format_args = "warn"
semicolon_if_nothing_returned = "warn"
redundant_clone = "warn"
await_holding_lock = "warn"
await_holding_refcell_ref = "warn"
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"

[features]
default = []
tokio = ["dep:tokio"]

[dependencies]
acpmux-list-types = { path = "../acpmux-list-types" }
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
tokio = { version = "1.52", optional = true, features = ["io-util", "macros", "rt", "sync", "time"] }
