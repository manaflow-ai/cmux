[package]
name = "cmux-layout-reducer-ffi"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "GPL-3.0-or-later"
publish = false
# In cmux-app-ffi's workspace (its Cargo.lock), outside cmux-tui's.
workspace = "../cmux-app-ffi"
description = "C ABI for the app's pure Rust rules: the JSON channel's ops (one op module per file in src/) and the typed per-handle C functions"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
# One line per crate, in name order: add yours at its place, not at the end.

# Without its `url` feature: the app links no URL parser (cmux-bookmarks-core `validate_url`).
cmux-bookmarks-core = { path = "../cmux-bookmarks-core" }
cmux-browser-rules = { path = "../cmux-browser-rules" }
cmux-app-closed-tabs = { path = "../cmux-app-closed-tabs" }
cmux-cloud-config = { path = "../cmux-cloud-config" }
cmux-cloud-handlers = { path = "../cmux-cloud-handlers" }
cmux-cloud-machine = { path = "../cmux-cloud-machine" }
cmux-cloud-start-core = { path = "../cmux-cloud-start-core" }
cmux-cloud-tasks = { path = "../cmux-cloud-tasks" }
cmux-focus-core = { path = "../cmux-focus-core" }
cmux-imessage = { path = "../cmux-imessage" }
cmux-layout-reducer = { path = "../cmux-layout-reducer" }
cmux-mobile-host-core = { path = "../cmux-mobile-host-core" }
cmux-rd-core = { path = "../cmux-rd-core", features = ["app"] }
# The WebRTC screen stream's rules (src/screen.rs: `screen_*`).
cmux-rd-screen = { path = "../cmux-rd-screen" }
cmux-tab-discard = { path = "../cmux-tab-discard" }
cmux-tasks-core = { path = "../cmux-tasks-core" }
# The VNC client's rules (src/vnc.rs: `vnc_*`).
cmux-vnc = { path = "../cmux-vnc" }
cmux-window-rules = { path = "../cmux-window-rules" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_qualifications = "warn"
