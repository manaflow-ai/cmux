# include/cmux_terminal_prediction.h is cbindgen's output for src/ffi.rs (the
# one file it reads, so no other item of the crate reaches the header).
# cmux-app-ffi's tests/terminal_prediction_header.rs regenerates it and fails
# with the diff when the committed header differs;
# CMUX_APP_FFI_HEADER_BLESS=1 cargo test --test terminal_prediction_header
# (in cmux-tui/crates/cmux-app-ffi) rewrites it.
language = "C"
include_guard = "CMUX_TERMINAL_PREDICTION_H"
header = """
/* Predictive local echo for the cmux macOS app
 * (cmux-tui/crates/cmux-terminal-prediction, src/ffi.rs): decides which typed
 * characters of a remote terminal may be drawn in an overlay before the
 * remote echoes them. One handle per surface, called from one thread with
 * the host's monotonic clock in nanoseconds; it never draws into the grid
 * and reads no clock of its own. */"""
autogen_warning = """
/* Generated by cbindgen (cmux-tui/crates/cmux-terminal-prediction/cbindgen.toml); do not edit.
 * Regenerate: CMUX_APP_FFI_HEADER_BLESS=1 cargo test --test terminal_prediction_header (cmux-app-ffi) */"""
sys_includes = ["stdbool.h", "stddef.h", "stdint.h"]
no_includes = true
usize_is_size_t = true
style = "type"
documentation_style = "c"
line_length = 120
tab_width = 4

[export]
item_types = ["constants", "opaque", "structs", "typedefs", "functions"]
