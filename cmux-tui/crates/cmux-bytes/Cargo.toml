[package]
name = "cmux-bytes"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "The cloud bytes path: per-chunk codec choice (store, zstd by link speed, per-kind dictionaries), content-defined chunks deduped by hash, frames that never grow a payload, priority lanes, and the harness and hill-climb that tune them"

[lints]
workspace = true

[[bin]]
name = "cmux-bytes"
path = "src/bin/cmux-bytes.rs"

[dependencies]
base64.workspace = true
blake3 = "1"
cmux-cas.workspace = true
flate2.workspace = true
libc.workspace = true
zstd = { workspace = true, features = ["zdict_builder"] }
