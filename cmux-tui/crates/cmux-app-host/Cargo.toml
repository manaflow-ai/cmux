[package]
name = "cmux-app-host"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "cmux app host: one sandboxed QuickJS VM per app, driven by the daemon's app supervisor over fd 3"

# Every `unsafe` block, impl and `pub unsafe fn` here states why it is sound: a `// SAFETY:`
# comment above it, or a `# Safety` doc section on the fn. Cargo cannot extend
# `[workspace.lints]`, so the inheriting crates mirror it here; the workspace lint drift test
# (.github/scripts/test_cmux_tui_unsafe_lints.py) keeps the copy equal.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_qualifications = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

[lints.clippy]
uninlined_format_args = "warn"
semicolon_if_nothing_returned = "warn"
redundant_clone = "warn"
await_holding_lock = "warn"
await_holding_refcell_ref = "warn"
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"

[lib]
name = "cmux_app_host"
path = "src/lib.rs"

[[bin]]
name = "cmux-app-host"
path = "src/main.rs"
required-features = ["engine"]

[features]
default = ["engine"]
# The VM, the process loop and the OS sandbox. The daemon's supervisor uses
# only the wire types (`default-features = false`).
engine = ["dep:rquickjs", "dep:chrono", "dep:chrono-tz"]

[dependencies]
cmux-json.workspace = true
rquickjs = { workspace = true, optional = true }
# `cmux.time.zone`: QuickJS has no Intl, so the host answers zone offsets from
# the IANA database built into chrono-tz (the sandbox can open no zoneinfo file).
chrono = { workspace = true, optional = true }
chrono-tz = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }
