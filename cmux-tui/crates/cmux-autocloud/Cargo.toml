[package]
name = "cmux-autocloud"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "cmux stripped to the essentials: one binary that signs in, starts an AutoCloud chat, shows readiness and streams the agent in a terminal (RFD 0139)"

[[bin]]
name = "cmux-autocloud"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
clap = { version = "4.5", features = ["derive"] }
cmux-cloud-config.workspace = true
cmux-egress.workspace = true
cmux-process.workspace = true
cmux-scope.workspace = true
crossterm = { version = "0.29", features = ["event-stream"] }
futures-util.workspace = true
ratatui = "0.30"
reqwest.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
# The seeded-secret test (login.rs) sends through the capture server.
cmux-egress = { workspace = true, features = ["capture"] }
