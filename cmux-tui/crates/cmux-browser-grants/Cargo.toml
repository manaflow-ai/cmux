[package]
name = "cmux-browser-grants"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Browser grants (RFD 0125 D7.2): an agent's lease on a site of the person's browser profile, its rules (tiers, scopes, 8 h expiry, commit never remembered) and the registrable-domain function both the daemon and the browser host use"

[lints]
workspace = true

[dependencies]
# The Public Suffix List (ICANN and private sections), compiled in: a
# grant's site is its registrable domain under the full list.
psl = "2"
# IDNA: a Unicode host and its punycode name are one site.
url.workspace = true
