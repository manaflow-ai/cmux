# include/cmux_daemon_launch.h is cbindgen's output for src/ffi.rs (the one
# file it reads, so no other item of the crate reaches the header).
# cmux-app-ffi's tests/daemon_launch_header.rs regenerates it and fails with
# the diff when the committed header differs;
# CMUX_APP_FFI_HEADER_BLESS=1 cargo test --test daemon_launch_header
# (in cmux-tui/crates/cmux-app-ffi) rewrites it.
language = "C"
include_guard = "CMUX_DAEMON_LAUNCH_H"
header = """
/* How the cmux macOS app starts and keeps its cmux-tui daemon
 * (cmux-tui/crates/cmux-daemon-launch-core, src/ffi.rs): the version
 * handoff, server ensure's command line, environment and answer, start
 * failures, the unresponsive-owner watch, the login and terminal
 * environments, Ghostty shell integration, the bundled CLI layer, the
 * install key and the legacy channel session. Most rules are JSON ops of
 * cmux_daemon_launch_call (src/ops.rs; tests/cases/*.json list them). */"""
autogen_warning = """
/* Generated by cbindgen (cmux-tui/crates/cmux-daemon-launch-core/cbindgen.toml); do not edit.
 * Regenerate: CMUX_APP_FFI_HEADER_BLESS=1 cargo test --test daemon_launch_header (cmux-app-ffi) */"""
sys_includes = ["stdbool.h", "stddef.h", "stdint.h"]
no_includes = true
usize_is_size_t = true
style = "type"
documentation_style = "c"
line_length = 120
tab_width = 4

[export]
item_types = ["constants", "structs", "opaque", "functions"]
