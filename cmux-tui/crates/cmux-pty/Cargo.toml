[package]
name = "cmux-pty"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Shared PTY allocation and process spawning for cmux"

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
libc.workspace = true
portable-pty.workspace = true

[target.'cfg(unix)'.dependencies]
cmux-process.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_JobObjects"] }

[target.'cfg(windows)'.dev-dependencies]
# The Ctrl+C test starts its probe as the terminal owner is started.
cmux-process.workspace = true

[target.'cfg(unix)'.dev-dependencies]
# The child-QoS test reads a PTY child's priority with its probe.
cmux-threads.workspace = true
