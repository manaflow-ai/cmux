[package]
name = "cmux-auth-coordinator"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "The sign-in and session state machine of the app's AuthCoordinator as a pure reducer: published session state, session generations, restore and sign-in decisions, team scope. No I/O, no Keychain, no UI."

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

[dev-dependencies]
# The harness runs effects against the real client and its fake Stack.
base64.workspace = true
cmux-stack-auth = { path = "../cmux-stack-auth" }
tokio = { workspace = true, features = ["rt", "time"] }

[lints]
workspace = true
