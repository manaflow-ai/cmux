# include/cmux_auth_coordinator.h is cbindgen's output for src/ffi.rs (the one file it
# reads, so no other item of the crate reaches the header).
# cmux-app-ffi's tests/auth_coordinator_header.rs regenerates it and fails with the diff
# when the committed header differs;
# CMUX_APP_FFI_HEADER_BLESS=1 cargo test --test auth_coordinator_header
# (in cmux-tui/crates/cmux-app-ffi) rewrites it.
language = "C"
include_guard = "CMUX_AUTH_COORDINATOR_H"
header = """
/* The cmux app's auth coordinator (cmux-tui/crates/cmux-auth-coordinator,
 * src/ffi.rs): the sign-in and session state machine as a pure reducer, in
 * the app's process. Events in, effects and the snapshot out, as JSON
 * (src/wire.rs describes it). */"""
autogen_warning = """
/* Generated by cbindgen (cmux-tui/crates/cmux-auth-coordinator/cbindgen.toml); do not edit.
 * Regenerate: CMUX_APP_FFI_HEADER_BLESS=1 cargo test --test auth_coordinator_header (cmux-app-ffi) */"""
sys_includes = ["stdbool.h", "stddef.h", "stdint.h"]
no_includes = true
usize_is_size_t = true
style = "type"
documentation_style = "c"
line_length = 120
tab_width = 4

[export]
item_types = ["constants", "structs", "opaque", "functions"]
