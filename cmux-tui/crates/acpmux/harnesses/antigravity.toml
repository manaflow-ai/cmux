# Google Antigravity's CLI (`agy`) in its ACP mode. Sign in once with `agy acp --login`,
# or give it GEMINI_API_KEY: acpmux then signs it in with the key at each start.
schema = 1
id = "antigravity"
name = "Antigravity"
icon = "gemini"
protocol = "acp"
command = "agy"
args = ["acp"]

[capabilities]
permission_modes = true
resume = true

[auth]
login = "agy acp --login"
docs = "https://antigravity.google/docs"
