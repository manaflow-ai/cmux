# Cursor's agent CLI speaks ACP itself: `cursor-agent acp`. Sign in once with
# `cursor-agent login`, or give it a Cursor API key as `CURSOR_API_KEY`.
schema = 1
id = "cursor"
name = "Cursor"
icon = "cursor"
protocol = "acp"
command = "cursor-agent"
args = ["acp"]

[capabilities]
resume = true

[auth]
login = "cursor-agent login"
docs = "https://cursor.com/docs/cli/acp"
