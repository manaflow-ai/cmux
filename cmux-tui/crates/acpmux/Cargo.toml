[package]
name = "acpmux"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "tmux for ACP agents: a session multiplexer daemon with CLI and TUI"
license.workspace = true
publish.workspace = true
readme = "README.md"
repository = "https://github.com/manaflow-ai/cmux"
homepage = "https://github.com/manaflow-ai/cmux/tree/main/cmux-tui/crates/acpmux"
keywords = ["acp", "agents", "multiplexer", "tmux", "tui"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "acpmux"
path = "src/main.rs"

[features]
default = ["build-id"]
# The stamped build id (acpmux-build-id) as the default of `hub::build()`.
# The cmux-tui binary turns it off and installs the same value at start, so
# a new stamp does not recompile this crate (acpmux-build-id docs).
build-id = ["dep:acpmux-build-id"]
tailnet = ["dep:cmux-tailnet", "dep:tokio-rustls"]
# The deterministic simulation's in-process agent seam (src/sim_agent.rs, tests/sim.rs). Never in
# a shipped build: only `cargo test --features sim --test sim` turns it on.
sim = []
# Dev only: the sign-in output parser from a WebAssembly module that a debug daemon swaps live
# when ACPMUX_HOT_MODULE's file changes (crates/acpmux-hot). Never in a shipped build.
hot-modules = ["dep:acpmux-hot"]

[target.'cfg(unix)'.dependencies]
signal-hook-registry = "1.4"
cmux-tailnet = { workspace = true, optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"], optional = true }

[dependencies]
acpmux-build-id = { path = "../acpmux-build-id", optional = true }
acpmux-hot = { workspace = true, optional = true, features = ["wasm"] }
chrono.workspace = true
chrono-tz.workspace = true
cmux-server = { path = "../cmux-server" }
cmux-json.workspace = true
# NEXT Cloud's generated client: the join's hub calls (redeem, credentials/self).
cmux-cloud-client.workspace = true
# The event log's journal (R-DURABILITY S2, `store.journal`).
cmux-journal.workspace = true
cmux-chat-index.workspace = true
cmux-palette-ranker.workspace = true
cmux-coderouter.workspace = true
cmux-local-auth.workspace = true
cmux-mcp-connect.workspace = true
cmux-link.workspace = true
cmux-git.workspace = true
cmux-worktree-care.workspace = true
cmux-wg.workspace = true
anyhow = "1"
cmux-agent-pane-policy.workspace = true
# The host CPU/RAM budget (src/host_pressure.rs re-exports it); the macOS app is to link the same crate (cmux-app-ffi).
cmux-host-budget.workspace = true
cmux-unix-socket.workspace = true
cmux-panic-log.workspace = true
clap = { version = "4.5", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
dirs = "6"
# Read the containing app identity for DEV helper discovery and the app orphan exit
# (src/daemon/app_orphan.rs).
plist = "1.10"
futures = "0.3"
futures-util = "0.3"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
# raw_value: an OpenCode config keeps its keys as written (src/opencode_ask.rs).
serde_json = { version = "1", features = ["raw_value"] }
jsonschema.workspace = true
sha2.workspace = true
# P-256 signatures of the person's phones (src/hub/approvers.rs); ring is
# already in the graph through rustls.
ring.workspace = true
toml.workspace = true
thiserror = "2"
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "process", "io-util", "io-std", "net", "sync", "time", "fs", "signal"] }
tokio-tungstenite.workspace = true
# Compressed frames for large messages on a WebSocket (src/frame_compress.rs).
flate2.workspace = true
tokio-util = { version = "0.7", features = ["codec"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.20", features = ["v7"] }
x25519-dalek.workspace = true
libc = "0.2"
notify.workspace = true
# Session tokens and secrets (the OS generator on every platform).
getrandom.workspace = true
base64 = "0.22"
bytes.workspace = true
tempfile = "3"
# Model-sized copies of large PNG uploads (src/model_copies.rs).
png.workspace = true
unicode-width = "0.2"
# NFC tool call paths on macOS, as git shows them (src/path_canon.rs).
unicode-normalization.workspace = true
wait-timeout.workspace = true
zeroize.workspace = true
regex = "1"
time.workspace = true
# Log lines a reader passes on their head are searched, not parsed (src/store.rs `scan_heads`).
memchr.workspace = true
# The typed protocol registry (src/protocol): JSON Schema for spec/acpmux-protocol.json.
schemars = "1"
# The model catalog fetch (src/catalog/fetch.rs): HTTPS only, through the
# workspace's reqwest and ring rustls provider.
reqwest.workspace = true
tar.workspace = true
rustls.workspace = true
pulldown-cmark = { version = "0.13", default-features = false }
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
# Codex over `codex app-server` as an ACP agent, in process
# (src/codex_app_server.rs). Pinned to an exact commit.
cmux-codex-acp = { git = "https://github.com/manaflow-ai/cmux-codex-acp", rev = "3b8fa33adad103ce04a1b622f1657bdc091a2a6d", default-features = false }
cmux-host.workspace = true
# The vault egress proxy (src/vault/egress.rs): agents get placeholders.
cmux-vault-egress.workspace = true

# Windows: the daemon socket is `cmux::local_socket` (AF_UNIX with its
# same-user checks); the detached start (CreateProcess with a handle list),
# owner-only ACLs and agent job objects use windows-sys.
[target.'cfg(target_os = "macos")'.dependencies]
# MCP connection secrets (`hub/mcp_secrets.rs`): items this binary writes itself, so the
# Keychain's access list names acpmux, not `/usr/bin/security`. Already in the tree via rustls.
security-framework = { version = "3.7", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
# The login-env watcher's change-only inotify (`login_env/watch.rs` `quiet`); `notify` asks for
# every open. Already in the tree through `notify`, with its features.
inotify = { version = "0.11", default-features = false }

[target.'cfg(windows)'.dependencies]
cmux-sdk = { path = "../../bindings/rust", default-features = false, features = ["local-socket"] }
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[dev-dependencies]
# The simulated crash file system, for the journal store's crash tests.
cmux-journal = { workspace = true, features = ["sim"] }
cmux-server-core = { path = "../cmux-server-core" }
rcgen = "0.14"
# Paused time for the media handle sweeper's tests (`hub/media_handles_tests.rs`).
tokio = { version = "1.52", features = ["test-util"] }
cmux-unix-socket = { workspace = true, features = ["test-support"] }
# The deterministic simulation's runtime (tests/sim.rs): hosts on one thread with simulated
# time, a simulated network, crash and restart.
turmoil = "0.7.2"
# The MCP sign-in tests read and build OAuth URLs and forms (`tests/hub_integration/mcp_connections.rs`).
url.workspace = true

# The deterministic simulation of the daemon (HQ#6740): `cargo test --features sim --test sim`.
[[test]]
name = "sim"
path = "tests/sim.rs"
required-features = ["sim"]
