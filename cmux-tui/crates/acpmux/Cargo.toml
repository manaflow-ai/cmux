[package]
name = "acpmux"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "tmux for ACP agents: a session multiplexer daemon with CLI and TUI"
license.workspace = true
publish.workspace = true
readme = "README.md"
repository = "https://github.com/manaflow-ai/cmux"
homepage = "https://github.com/manaflow-ai/cmux/tree/main/cmux-tui/crates/acpmux"
keywords = ["acp", "agents", "multiplexer", "tmux", "tui"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "acpmux"
path = "src/main.rs"

# The agent tool relay (src/mcp_relay.rs): std and serde_json only, under 1 MB.
[[bin]]
name = "acpmux-mcp-relay"
path = "src/mcp_relay_main.rs"

[lints.rust]
# The stability lab builds with RUSTFLAGS="--cfg tokio_unstable" (cmux-tui/lab/stability.env).
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(tokio_unstable)"] }

[features]
# The lab's tokio slow-poll detector (cmux-blocking; RUSTFLAGS="--cfg tokio_unstable").
cmux-stability = ["cmux-blocking/cmux-stability"]
# Crash injectors for the fleet's crash matrix (`_acpmux/debug_panic`,
# src/debug_crash_inject.rs): code behind cfg(any(debug_assertions,
# feature = "bench")), so release builds never have it. Off by default.
bench = []
tailnet = ["dep:cmux-tailnet", "dep:tokio-rustls"]

[target.'cfg(unix)'.dependencies]
cmux-tailnet = { workspace = true, optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"], optional = true }

[dependencies]
# Named threads at a declared QoS (plans/cmux-next/chrome-parity/p02-threads.md).
cmux-threads.workspace = true
cmux-blocking.workspace = true
cmux-lock-rank.workspace = true
# Memory pressure and the consumer registry (`src/memory.rs`); a leaf crate, no tokio.
cmux-memory.workspace = true
# The daemon's features and their sources, shared with the cmux-tui owner (the leftover
# daemon idle exit, src/daemon_lifecycle.rs), and `memoryAcpmuxPressure`.
cmux-features = { workspace = true, features = ["sources"] }
cmux-chat-index.workspace = true
cmux-coderouter.workspace = true
cmux-local-auth.workspace = true
cmux-link.workspace = true
cmux-git.workspace = true
cmux-worktree-care.workspace = true
anyhow = "1"
cmux-agent-pane-policy.workspace = true
cmux-unix-socket.workspace = true
cmux-panic-log.workspace = true
# The daemon's blocking-pool items and sync threads are hang-watched.
cmux-hang-watch.workspace = true
# The launchd process-roles table (units::LaunchdJob) for the daemon's agent plist.
cmux-server-core.workspace = true
# Background priority of pooled agents and of the idle daemon (hub/pool, daemon_lifecycle.rs);
# already in the graph through cmux-features' sources.
cmux-tui-platform.workspace = true
clap = { version = "4.5", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
dirs = "6"
# Read the containing app identity for DEV helper discovery.
plist = "1.10"
futures = "0.3"
futures-util = "0.3"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
# raw_value: an OpenCode config keeps its keys as written (src/opencode_ask.rs).
serde_json = { version = "1", features = ["raw_value"] }
sha2.workspace = true
# P-256 signatures of the person's phones (src/hub/approvers.rs); ring is
# already in the graph through rustls.
ring.workspace = true
toml.workspace = true
thiserror = "2"
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "process", "io-util", "io-std", "net", "sync", "time", "fs", "signal"] }
tokio-tungstenite.workspace = true
tokio-util = { version = "0.7", features = ["codec"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# The real target and line of `log` crate events (src/trace_layer.rs); already in the graph
# through tracing-subscriber.
tracing-log = { version = "0.2", default-features = false }
# The Release trace ring (src/trace_layer.rs): event instants and request slices.
cmux-trace.workspace = true
# Catalog refresh, the health check and the upload sweep on one MaintenanceClock
# (src/maintenance.rs), and Energy Saver (src/energy_control.rs).
cmux-wake.workspace = true
uuid = { version = "1.20", features = ["v7"] }
libc = "0.2"
notify.workspace = true
# Session tokens and secrets (the OS generator on every platform).
getrandom.workspace = true
base64 = "0.22"
# Model-sized copies of large PNG uploads (src/model_copies.rs).
png.workspace = true
unicode-width = "0.2"
# NFC tool call paths on macOS, as git shows them (src/path_canon.rs).
unicode-normalization.workspace = true
wait-timeout.workspace = true
zeroize.workspace = true
regex = "1"
# Log lines a reader passes on their head are searched, not parsed (src/store.rs `scan_heads`).
memchr.workspace = true
# The typed protocol registry (src/protocol): JSON Schema for spec/acpmux-protocol.json.
schemars = "1"
# The model catalog fetch (src/catalog/fetch.rs): HTTPS only, through the
# workspace's reqwest and ring rustls provider.
reqwest.workspace = true
rustls.workspace = true
pulldown-cmark = { version = "0.13", default-features = false }
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
# Codex over `codex app-server` as an ACP agent, in process
# (src/codex_app_server.rs). Pinned to an exact commit.
cmux-codex-acp = { git = "https://github.com/manaflow-ai/cmux-codex-acp", rev = "ffa7aa863bcdb3f995b0c4b96ea2349e817fed1a", default-features = false }

# Windows: the daemon socket is `cmux::local_socket` (AF_UNIX with its
# same-user checks); the detached start (CreateProcess with a handle list),
# owner-only ACLs and agent job objects use windows-sys.
[target.'cfg(windows)'.dependencies]
cmux-sdk = { path = "../../bindings/rust", default-features = false, features = ["local-socket"] }
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"
rcgen = "0.14"
# Paused time for the media handle sweeper's tests (`hub/media_handles_tests.rs`).
tokio = { version = "1.52", features = ["test-util"] }
cmux-unix-socket = { workspace = true, features = ["test-support"] }
# `log` crate events in tests/trace_layer.rs, forwarded by tracing-log's LogTracer.
log = "0.4"
tracing-log = "0.2"

[lints.clippy]
# cmux-tui/clippy.toml disallows std thread spawns and sleep; this package has not opted in.
disallowed_methods = "allow"
disallowed_types = "allow"
