[package]
name = "acpmux"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "tmux for ACP agents: a session multiplexer daemon with CLI and TUI"
license.workspace = true
publish.workspace = true
readme = "README.md"
repository = "https://github.com/manaflow-ai/cmux"
homepage = "https://github.com/manaflow-ai/cmux/tree/main/cmux-tui/crates/acpmux"
keywords = ["acp", "agents", "multiplexer", "tmux", "tui"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "acpmux"
path = "src/main.rs"

[dependencies]
cmux-local-auth.workspace = true
anyhow = "1"
cmux-unix-socket.workspace = true
clap = { version = "4.5", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
dirs = "6"
futures = "0.3"
futures-util = "0.3"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml.workspace = true
thiserror = "2"
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "process", "io-util", "io-std", "net", "sync", "time", "fs", "signal"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
tokio-util = { version = "0.7", features = ["codec"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.20", features = ["v7"] }
libc = "0.2"
base64 = "0.22"
unicode-width = "0.2"
wait-timeout.workspace = true
regex = "1"
pulldown-cmark = { version = "0.13", default-features = false }
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }

[dev-dependencies]
cmux-unix-socket = { workspace = true, features = ["test-support"] }
