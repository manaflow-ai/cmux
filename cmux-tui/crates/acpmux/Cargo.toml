[package]
name = "acpmux"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "tmux for ACP agents: a headless session multiplexer daemon and CLI (its TUI: the acpmux-tui crate)"
license.workspace = true
publish.workspace = true
# All ordinary integration tests share one harness so Cargo links acpmux once.
autotests = false
readme = "README.md"
repository = "https://github.com/manaflow-ai/cmux"
homepage = "https://github.com/manaflow-ai/cmux/tree/main/cmux-tui/crates/acpmux"
keywords = ["acp", "agents", "multiplexer", "tmux", "headless"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "acpmux"
path = "src/main.rs"

# Dev only: the pause-policy replay (src/bin/pause_replay.rs) scores Cloud agent VM pause
# policies over recorded session timelines. Never in a shipped build.
[[bin]]
name = "pause-replay"
path = "src/bin/pause_replay.rs"
required-features = ["pause-replay"]

[[bench]]
name = "v2"
harness = false

# A turn's cost by stage with a stand-in model that answers at once (benches/turn_overhead.rs).
[[bench]]
name = "turn_overhead"
harness = false

[features]
default = ["build-id"]
# The stamped build id (acpmux-build-id) as the default of `hub::build()`.
# The cmux-tui binary and the shipped standalone acpmux (acpmux-standalone)
# turn it off and install the same value at start, so a new stamp does not
# recompile this crate (acpmux-build-id docs).
build-id = ["dep:acpmux-build-id"]
tailnet = ["dep:cmux-tailnet", "dep:tokio-rustls"]
# The deterministic simulation's in-process agent seam (src/sim_agent.rs, tests/sim.rs). Never in
# a shipped build: only `cargo test --features sim --test sim` turns it on.
sim = []
# Dev only: builds the pause-replay bin above. Never in a shipped build.
pause-replay = []
# Another crate's tests' in-process daemon that serves the v2 list (src/test_support.rs; row 7c,
# cmux-tui-core's list callers). Never in a shipped build: only a crate's dev-dependencies turn it
# on. Its gates print and compare their rounds through `acpmux_book::gate_rounds`.
test-support = ["acpmux-book/gate-rounds"]
# Dev only: the sign-in output parser from a WebAssembly module that a debug daemon swaps live
# when ACPMUX_HOT_MODULE's file changes (crates/acpmux-hot). Never in a shipped build.
hot-modules = ["dep:acpmux-hot"]
# The hub carrier (src/hub_carrier.rs): the live acpmux stream between two of one person's own
# machines through the Cloud carrier's relay, Noise end to end (cmux-remote's relay client and
# handshake). Opt-in because cmux-remote builds libghostty-vt with zig; the shipping build turns it
# on (scripts/ci/acpmux-build-features.sh).
hub-carrier = ["dep:cmux-remote", "dep:cmux-remote-protocol", "dep:async-trait", "dep:url"]
# The heap by allocation site (dhat) for the god-fixture profile (`tests/god_daemon.rs`): the
# binary's allocator records every block and writes `ACPMUX_DHAT_OUT` when the daemon stops
# (`heap_profile.rs`). Never in a shipped build: it slows every allocation.
dhat-heap = ["dep:dhat"]

[target.'cfg(unix)'.dependencies]
signal-hook-registry = "1.4"
# `acpmux fork-run` (`src/cli/fork_run.rs`): cmux Cloud's fork runs, called with the caller's own
# Cloud credential.
cmux-cloud-api.workspace = true
# The share host (`src/share_host/`): this Mac's device hub device, its hub link and serving one
# share through the Screen Sharing helper, the same code `cmux-rd linux-host` runs.
cmux-hub-host.workspace = true
cmux-felt.workspace = true
# The share host's verified copy of the Screen Sharing helper outside the app.
cmux-signed-bundle.workspace = true
cmux-tailnet = { workspace = true, optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"], optional = true }

[dependencies]
# A hybrid start's tool calls: held, then routed (`hub/hybrid_hold.rs`); the Cloud account and hybrid
# rule a new chat's place weighs (place_mode.rs). One dependency, named once: the base merge that
# brought both comments in also brought the line twice, which is a TOML duplicate key.
cmux-cloud-start-core.workspace = true
cmux-session-cloud.workspace = true
acpmux-book = { path = "../acpmux-book" }
# The model catalog, RPC schema, secret rules and web page compiled in compressed.
cmux-embed.workspace = true
# The list's read and follow for the CLI and MCP list callers (`cli/list_read.rs`).
acpmux-client = { path = "../acpmux-client", features = ["tokio"] }
acpmux-core = { path = "../acpmux-core" }
# cmux.share-approval.v1, shared with the iPhone that asks with it (share_approval.rs).
cmux-share-approval.workspace = true
acpmux-build-id = { path = "../acpmux-build-id", optional = true }
acpmux-hot = { workspace = true, optional = true, features = ["wasm"] }
arc-swap.workspace = true
dhat = { version = "0.3", optional = true }
imbl.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
cmux-server = { path = "../cmux-server" }
cmux-json.workspace = true
cmux-netwatch.workspace = true
# The settings file's path and JSONC reader (src/user_settings.rs), the settings owner's.
cmux-config.workspace = true
# NEXT Cloud's generated client: the join's hub calls (redeem, credentials/self).
cmux-build-space.workspace = true
cmux-cloud-client.workspace = true
# The `cmux.wire/1` op trait the earned-access record read implements (`hub/earned_events.rs`).
cmux-cloud-wire.workspace = true
# Each deployment's device hub origin, for the share host's machine sign-in (`share_host/`).
cmux-cloud-environment.workspace = true
# A browser's own email-code sign-in on the web listener (`server/web_device.rs`).
cmux-stack-auth.workspace = true
# The event log's journal (R-DURABILITY S2; always on).
cmux-journal.workspace = true
cmux-chat-index.workspace = true
cmux-palette-ranker.workspace = true
cmux-coderouter.workspace = true
cmux-local-auth.workspace = true
# Loopback URLs a background process prints, for its preview (src/hub/process_preview.rs).
cmux-local-url.workspace = true
cmux-mcp-connect.workspace = true
cmux-link.workspace = true
# The Computer Use tool catalog and wire types (`computer_use/`): the engine
# only, no desktops (they run in the worker, never in acpmux).
cmux-computer-use.workspace = true
# The cmux-tui daemon socket path (`computer_use/client.rs`); on Windows also the
# daemon socket itself (`cmux::local_socket`, AF_UNIX with its same-user checks).
cmux-sdk = { path = "../../bindings/rust", default-features = false, features = ["local-socket"] }
# The path selector (RTT with hysteresis) a peer link picks its carrier with (`peer_paths.rs`).
cmux-transport = { path = "../cmux-transport" }
# Where the running cmux link registers its socket (`peer_carriers.rs`).
cmux-tui-platform.workspace = true
# SKILL.md frontmatter, read as YAML (`agent_guidance::frontmatter`), shared with `cmux agent-config skills`.
cmux-agent-customize.workspace = true
cmux-file-lock.workspace = true
# Session Info's per-chat usage stats, invalidated by chat and transcript tag (`hub/usage_view.rs`).
cmux-tag-cache.workspace = true
cmux-supervise-core.workspace = true
cmux-git.workspace = true
# The trusted session-flag hook a Codex start at a repository head gets (src/codex_repo_gate.rs).
cmux-tui-hooks.workspace = true
cmux-worktree-care.workspace = true
cmux-wg.workspace = true
anyhow = "1"
cmux-agent-pane-policy.workspace = true
# The host CPU/RAM budget (src/host_pressure.rs re-exports it); the macOS app is to link the same crate (cmux-app-ffi).
cmux-host-budget.workspace = true
# What kind of device this machine is (`host_health` `device`), for the glyph every machine row draws.
cmux-device-kind.workspace = true
cmux-unix-socket.workspace = true
cmux-panic-log.workspace = true
cmux-usage-patterns.workspace = true
cmux-usage-share.workspace = true
# What package installs a shell call runs (`hub/tool_installs.rs`).
cmux-command-class.workspace = true
clap = { version = "4.5", features = ["derive"] }
dirs = "6"
# Read the containing app identity for DEV helper discovery and the app orphan exit
# (src/daemon/app_orphan.rs).
plist = "1.10"
futures = "0.3"
futures-util = "0.3"
serde = { version = "1", features = ["derive", "rc"] }
# raw_value: an OpenCode config keeps its keys as written (src/opencode_ask.rs).
serde_json = { version = "1", features = ["raw_value"] }
jsonschema.workspace = true
sha2.workspace = true
# Diffs of a proposed carried-memory change (src/agent_home.rs).
diffy.workspace = true
# P-256 signatures of the person's phones (src/hub/approvers.rs); ring is
# already in the graph through rustls.
ring.workspace = true
toml.workspace = true
toml_edit.workspace = true
thiserror = "2"
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "process", "io-util", "io-std", "net", "sync", "time", "fs", "signal"] }
tokio-tungstenite.workspace = true
cmux-process.workspace = true
cmux-scope.workspace = true
# Compressed frames for large messages on a WebSocket (src/frame_compress.rs).
flate2.workspace = true
# A cold-archived chat's log, one compressed file (src/store/cold.rs).
zstd.workspace = true
# A moved chat's history follows it as a session pack (`hub/transfer_history.rs`).
cmux-session-pack = { path = "../cmux-session-pack" }
tokio-util = { version = "0.7", features = ["codec"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.20", features = ["v7"] }
x25519-dalek.workspace = true
libc = "0.2"
notify.workspace = true
# Session tokens and secrets (the OS generator on every platform).
getrandom.workspace = true
glob.workspace = true
base64 = "0.22"
bytes.workspace = true
tempfile = "3"
# Model-sized copies of large PNG uploads (src/model_copies.rs).
png.workspace = true
cmux-image-linear.workspace = true
# NFC tool call paths on macOS, as git shows them (src/path_canon.rs).
unicode-normalization.workspace = true
wait-timeout.workspace = true
zeroize.workspace = true
regex = "1"
time.workspace = true
# Log lines a reader passes on their head are searched, not parsed (src/store.rs `scan_heads`).
memchr.workspace = true
# The chats page's search by what was said: case-blind word search over held text (src/chats/text.rs).
aho-corasick = "1"
# The typed protocol registry (src/protocol): JSON Schema for spec/acpmux-protocol.json.
schemars = "1"
# The model catalog fetch (src/catalog/fetch.rs): HTTPS only, through the
# workspace's reqwest and ring rustls provider.
reqwest.workspace = true
tar.workspace = true
rustls.workspace = true
# Codex over `codex app-server` as an ACP agent, in process
# (src/codex_app_server.rs). Pinned to an exact commit.
cmux-codex-acp = { git = "https://github.com/manaflow-ai/cmux-codex-acp", rev = "dfa59bc25deb4328b06c6a8a1ada74e86f447408", default-features = false }
cmux-host.workspace = true
# The vault egress proxy (src/vault/egress.rs): agents get placeholders.
cmux-vault-egress.workspace = true
# The egress gate every outbound client passes (docs/privacy.md, Egress gate).
cmux-egress.workspace = true
# The hub carrier (feature `hub-carrier`).
cmux-remote = { workspace = true, optional = true }
cmux-remote-protocol = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
url = { workspace = true, optional = true }

# Windows: the daemon socket is `cmux::local_socket` (AF_UNIX with its
# same-user checks); the detached start (CreateProcess with a handle list),
# owner-only ACLs and agent job objects use windows-sys.
[target.'cfg(target_os = "linux")'.dependencies]
# The change-only, path-following inotify watch (`quiet_dirs.rs`) of the harness, settings and
# login-env watches; `notify` asks for every open. Already in the tree through `notify`, with its features.
inotify = { version = "0.11", default-features = false }
# The daemon's allocator on Linux (src/main.rs, acpmux-standalone): musl's malloc, the shipped
# static build's, never gave freed pages back, and a daemon up 12 h held 2.5 GB with a flat live
# heap (RFD 0156). mimalloc returns them on its own.
mimalloc = { version = "0.1", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[dev-dependencies]
cmux-build-space = { workspace = true, features = ["testing"] }
# Release gates print and compare their rounds through `acpmux_book::gate_rounds`.
acpmux-book = { path = "../acpmux-book", features = ["gate-rounds"] }
# Property tests of the stores under random operations, restarts and torn writes (src/stress/).
proptest = { version = "1", default-features = false, features = ["std"] }
# The NEXT Cloud network list (`vm.networks`), whose id the tunnel tests attach with.
cmux-cloud-api.workspace = true
# The simulated crash file system, for the journal store's crash tests.
cmux-journal = { workspace = true, features = ["sim"] }
cmux-server-core = { path = "../cmux-server-core" }
rcgen = "0.14"
# Paused time for the media handle sweeper's tests (`hub/media_handles_tests.rs`).
tokio = { version = "1.52", features = ["test-util"] }
cmux-unix-socket = { workspace = true, features = ["test-support"] }
# `read_timeout_or_ended`: a read timeout for a test socket whose peer can have closed first.
cmux-tui-platform = { workspace = true, features = ["test-support"] }
# The deterministic simulation's runtime (tests/sim.rs): hosts on one thread with simulated
# time, a simulated network, crash and restart.
turmoil = "0.7.2"
# The native relay the hub carrier's integration test runs in process (tests/hub_carrier.rs).
cmux-relay = { path = "../cmux-relay" }
axum.workspace = true
# The Remote and Cloud fault harness (tests/rc_faults.rs: disk-full mid-turn).
cmux-fault.workspace = true
# WireGuard's construction hash, which the hub carrier's Noise hash must equal (tests/hub_carrier.rs).
blake2 = "0.10"
# A Codex state database for the Codex desktop bridge's tests (`codex_desktop_tests.rs`).
rusqlite.workspace = true
# The test-hooks check over this crate's own sources (`src/test_hooks_tree.rs`, cmux#41350).
cmux-source-scan = { path = "../cmux-source-scan" }
# The crate's own sources, read by the detector of writes under the home by path
# (`src/home_writers_by_path_tests.rs`); span-locations for its rows' line numbers.
syn = { version = "2", default-features = false, features = ["full", "parsing", "visit", "printing"] }
proc-macro2 = { version = "1", features = ["span-locations"] }

[target.'cfg(unix)'.dev-dependencies]
# The share host's device channel test seals a relay secret as a viewer does (`share_host/tests.rs`).
hpke = { version = "0.13", default-features = false, features = ["alloc", "p256"] }

