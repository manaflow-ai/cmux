[package]
name = "cmux-tailnet"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "An embedded Tailscale node for cmux daemons"
build = "build.rs"
links = "tailscale"

[dependencies]
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
rustls.workspace = true
reqwest = { workspace = true, features = ["blocking"] }
libc = "0.2"

# Every `unsafe` block, impl and `pub unsafe fn` here states why it is sound: a `// SAFETY:`
# comment above it, or a `# Safety` doc section on the fn.
[lints.clippy]
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"
