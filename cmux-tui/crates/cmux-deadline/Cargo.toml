[package]
name = "cmux-deadline"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "One deadline for a whole operation, declared where it starts, that every layer under it takes its timeout from (a port of leo-workspace tools/deadline.py)"

[lints]
workspace = true

[features]
# `Deadline<tokio::time::Instant>`, so a paused test clock moves it.
tokio = ["dep:tokio"]

[dependencies]
tokio = { workspace = true, optional = true }

[dev-dependencies]
regex.workspace = true
tokio = { workspace = true, features = ["test-util"] }
