[package]
name = "cmux-cas"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "cas/1 (RFD 0166): content-addressed artifacts. FastCDC chunks, a manifest of what a tree holds, a signed pointer naming it, and the plan that moves only the chunks the client lacks, from R2 pack files by Range GET as the floor"

[lints]
workspace = true

[[bin]]
name = "cas-replay"
path = "src/bin/cas-replay.rs"

[[bin]]
name = "cas-lazy-bench"
path = "src/bin/cas-lazy-bench.rs"

[[bin]]
name = "cas-publish-public"
path = "src/bin/cas-publish-public.rs"

[[bin]]
name = "cas-dedup"
path = "src/bin/cas-dedup.rs"

[[bin]]
name = "cas-seed"
path = "src/bin/cas-seed.rs"

[dependencies]
blake3 = "1"
cmux-process.workspace = true
cmux-signed-envelope = { path = "../cmux-signed-envelope" }
flate2.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tar.workspace = true
zstd.workspace = true

[dev-dependencies]
base64.workspace = true
ring.workspace = true
tempfile = "3"
sha2.workspace = true
tar.workspace = true
flate2.workspace = true

[target.'cfg(unix)'.dev-dependencies]
libc.workspace = true
