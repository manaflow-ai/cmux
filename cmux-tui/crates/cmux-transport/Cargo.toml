[package]
name = "cmux-transport"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Pure core of the cmux overlay transport: datagram classes, STUN, relay frames, probes and the path selector"

[features]
# getifaddrs for `medium::local_networks`; the rest of the crate stays pure.
local-networks = ["dep:libc"]

[dependencies]
libc = { version = "0.2", optional = true }
# The three-way hub's end-to-end seal (src/hub.rs); both already in the workspace graph.
blake3 = "1"
chacha20poly1305 = "0.10"

[dev-dependencies]
cmux-wire-lockstep.workspace = true
proptest = { version = "1", default-features = false, features = ["std"] }

[lints]
workspace = true
