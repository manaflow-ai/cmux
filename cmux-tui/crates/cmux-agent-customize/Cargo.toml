[package]
name = "cmux-agent-customize"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Reads and edits what the person configured for Claude Code and Codex in those agents' own files (MCP servers, hooks, skills and slash commands, settings), for cmux Settings and `cmux agent-config`"

[lints]
workspace = true

[dependencies]
# settings.json edits in place, byte for byte outside the edited value (cmux-config jsonc).
cmux-config.workspace = true
# Codex's app-server ends with the read that started it.
cmux-process.workspace = true
# The codex config.toml lock every cmux writer of it takes.
cmux-tui-platform.workspace = true
# poll(2) on the app-server's stdout, so a silent Codex cannot hold a read past its deadline.
libc.workspace = true
# Codex hook trust hash, state keys and cmux's own hook markers.
cmux-tui-hooks.workspace = true
anyhow.workspace = true
indexmap.workspace = true
sha2.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
toml_edit.workspace = true
# SKILL.md frontmatter is YAML (block scalars, quotes); the version cmux-host already builds.
yaml-rust = "0.4.5"

[dev-dependencies]
tempfile = "3"
