[package]
name = "cmux-agent-customize"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Claude Code and Codex customization from cmux: read and edit each agent's own config (skills and slash commands, MCP servers, hooks, settings) in the agent's own files, round-tripping what cmux does not know"

[lints]
workspace = true

[dependencies]
# Codex's app-server ends with the read that started it.
cmux-process.workspace = true
# The codex config.toml lock every cmux writer of it takes.
cmux-tui-platform.workspace = true
# poll(2) on the app-server's stdout, so a silent Codex cannot hold a read past its deadline.
libc.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
toml_edit.workspace = true
# SKILL.md frontmatter is YAML (block scalars, quotes); the version cmux-host already builds.
yaml-rust = "0.4.5"

[dev-dependencies]
tempfile = "3"
