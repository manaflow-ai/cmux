[package]
name = "cmux-rd-ffi"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "GPL-3.0-or-later"
publish = false
# In cmux-app-ffi's workspace (its Cargo.lock), outside cmux-tui's.
workspace = "../cmux-app-ffi"
description = "C ABI of the cmux remote desktop viewer core: cmux.rd/1 bytes in, access units and feedback datagrams out (no I/O, no threads)"


[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
cmux-rd-core = { path = "../cmux-rd-core" }
# `serde`: the app line reader reads the host's typed lines (app_line::AppLine).
cmux-rd-proto = { path = "../cmux-rd-proto", features = ["serde"] }
# The remote browser tab client reducer (REMOTE-TAB-R1 Q4: rb client reducers link here).
cmux-remote-browser = { path = "../cmux-remote-browser" }
serde_json = "1"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_qualifications = "warn"
