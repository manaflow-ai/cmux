[package]
name = "cmux-rd-host"
version = "0.2.9"
edition = "2021"
license = "GPL-3.0-or-later"
readme = "README.md"
publish = false
description = "cmux remote desktop host engine: Linux (virtual X display: damage capture, H.264 with Cisco's OpenH264 binary by default, x264 opt-in waiting for a legal decision, XTest input) and macOS (ScreenCaptureKit, VideoToolbox from the captured IOSurface, CGEvent input); cmux.rd/1 over UDP or a stream; plus the bench client"

# Own workspace: links C libraries (x264, openh264 for the bench), so it stays out of
# the cmux-tui workspace build until those dependencies are feature-gated for every OS.
[workspace]

[lib]
name = "cmux_rd_host"
path = "src/lib.rs"

[[bin]]
name = "cmux-rd"
path = "src/main.rs"

[dependencies]
cmux-rd-proto = { path = "../cmux-rd-proto", features = ["serde"] }
cmux-rd-core = { path = "../cmux-rd-core" }
cmux-rd-engine = { path = "../cmux-rd-engine" }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cmux-encode = { path = "../cmux-encode" }
# The secure link of device hub sessions (`cmux-rd serve`).
cmux-rd-link = { path = "../cmux-rd-link", features = ["net"], optional = true }
# The bench decoder only (OpenH264 from source never ships in the host).
openh264 = { version = "0.9", default-features = false, features = ["source"], optional = true }
# VP9 and AV1 for measurement (features `vp9`, `av1`).
cmux-codecs = { path = "../cmux-codecs", default-features = false, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.14", features = ["shm", "damage", "xtest", "xinput", "present", "dri3", "randr"] }
# `dri3` only because x11rb 0.14's `present` names dri3 types without enabling that module.
# `cmux-rd linux-host` (src/linux_host/) and `cmux-rd view`: the device hub host shared with
# the acpmux share host on macOS (the device key, the hub client over rustls with the ring
# provider and the platform trust store, serving one session through `cmux-rd serve`).
cmux-hub-host = { path = "../cmux-hub-host" }
# The host's `cmux-rd serve` children: owned, ended with their session.
cmux-process = { path = "../cmux-process" }
# The identity lock every writer of the records holds (src/linux_host/serving.rs).
cmux-file-lock = { path = "../cmux-file-lock" }
# Wayland capture (features `portal-dbus` and `portal`: src/portal.rs, src/pipewire_capture.rs):
# the xdg-desktop-portal ScreenCast and RemoteDesktop handshakes over D-Bus and the PipeWire
# stream they open.
# pipewire links libpipewire-0.3 (build needs libpipewire-0.3-dev, libspa-0.2-dev, clang).
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"], optional = true }
pipewire = { version = "0.10", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
# cmux Computer Use's engine: the helper hosts its macOS worker and gives it ScreenCaptureKit
# screenshots (src/mac/cu_host.rs). Behind the `computer-use` feature.
cmux-computer-use = { path = "../cmux-computer-use", features = ["desktop", "server"], optional = true }
# The Computer Use worker child src/mac/cu_host.rs spawns: owned, killed with its host.
cmux-process = { path = "../cmux-process" }

[target.'cfg(windows)'.dependencies]
# `cmux-rd windows-host` (src/windows_host.rs): the same device hub client as `linux-host`.
cmux-hub-host = { path = "../cmux-hub-host" }
windows = { version = "0.62.2", features = [
    "Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi",
] }
# COM wrappers for Desktop Duplication; user32/gdi32 remain the fallback and
# SendInput implementation. Both paths feed the same OpenH264 encoder.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_RemoteDesktop",
    "Win32_System_StationsAndDesktops",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }


[build-dependencies]
cc = "1"

[features]
# `cmux-rd serve`: device hub sessions over the secure link (cmux-rd-link).
link = ["dep:cmux-rd-link"]
# `cmux-screen-sharing __computer-use-worker` (src/computer_use_worker.rs): the macOS Computer Use
# worker and its ScreenCaptureKit screenshots. Only the Screen Sharing helper turns it on: cmux-tui
# links this crate for `cmux rd`, and the Linux pool's macOS cross SDK cannot link the engine's
# AppKit and Accessibility desktop into it (cmux-tui tests/macos_bin_no_computer_use_desktop.rs).
computer-use = ["dep:cmux-computer-use"]
default = ["bench", "openh264", "link", "portal", "computer-use"]
# Wayland screen sharing through xdg-desktop-portal: `portal-dbus` is the ScreenCast and
# RemoteDesktop handshakes over D-Bus (the one-time grant `linux-host enable` makes, and the
# input calls), pure Rust; `portal` adds the PipeWire capture (links libpipewire-0.3).
# Their dependencies are Linux-only, so on macOS and Windows the features compile nothing.
portal-dbus = ["dep:zbus"]
portal = ["portal-dbus", "dep:pipewire"]
# The default encoder: Cisco's OpenH264 binary downloaded from Cisco at run time
# (`cmux-rd openh264-install`; Cisco pays the royalties), loaded after its pinned SHA-256.
# `cmux-rd view` decodes with the same downloaded binary (Cisco's library has the decoder too).
openh264 = ["cmux-encode/openh264-download"]
# Opt-in only (links libx264.a statically; needs libx264-dev at build time). x264 waits
# for Lawrence's legal decision on H.264 patent royalties; never in a release build.
x264 = []
# The bench client (decodes with openh264) and the OpenH264 source build for tests and
# the bench only (plans/cmux-next/remote-desktop-c7.md section 4).
bench = ["dep:openh264", "cmux-encode/openh264-source"]
# Royalty-free codecs for measurement only (`--codec vp9|av1` on the host, `--decoder vp9|av1`
# on the bench viewer), through cmux-codecs: VP9 builds libvpx from source, AV1 is rav1e and
# rav1d. Never in a release build until the codec table in their pull request says so.
vp9 = ["bench", "dep:cmux-codecs", "cmux-codecs/vp9"]
av1 = ["bench", "dep:cmux-codecs", "cmux-codecs/av1"]

[profile.release]
opt-level = 3
debug = 1
lto = "thin"
