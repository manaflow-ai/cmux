[package]
name = "cmux-projection"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Projected folders (RFD 0007): a Mac folder on a Cloud machine, or a git commit on a lane VM, from a stat-only manifest, file bytes fetched on first read, edits kept in an upper folder on the machine"

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
cmux-process.workspace = true
bincode = "1.3.3"
flate2.workspace = true
# Blocking HTTP(S) for the blob seeding chain (peers.rs); reqwest's blocking client runs a
# private tokio runtime on its own thread, so the crate stays sync (as cmux-server does).
reqwest = { workspace = true, features = ["blocking"] }
rustls.workspace = true
serde.workspace = true
sha1 = "0.10"
sha2.workspace = true
zstd.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# abi-7-12: the notifier, which tells the kernel to drop a re-listed file's attributes and pages.
fuser = { version = "=0.14.0", default-features = false, features = ["abi-7-12"] }
libc.workspace = true

[dev-dependencies]
tempfile = "3"
