[package]
name = "cmux-projection"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Projected folders (RFD 0007): a Mac folder on a Cloud machine from a stat-only manifest, file bytes fetched on first read, edits kept in an upper folder on the machine"

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
bincode = "1.3.3"
serde.workspace = true
zstd.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# abi-7-12: big writes (128 KiB a request, not 4 KiB) and the notifier that drops what the kernel
# cached of a file that changed outside the mount.
fuser = { version = "=0.14.0", default-features = false, features = ["abi-7-12"] }
libc.workspace = true

[dev-dependencies]
tempfile = "3"
