[package]
name = "cmux-tui-platform"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "OS primitives of the cmux-tui daemon: paths, users and peers, the terminal-host executable, process identity and resources, the Unix process scope"

[lints]
workspace = true

[features]
# Test seams (the process scope's final-scan gate), for dev-dependencies only.
test-support = []

[dependencies]
cmux-link.workspace = true
cmux-pty.workspace = true
cmux-unix-socket.workspace = true
libc.workspace = true
serde_json.workspace = true
sha2.workspace = true
url.workspace = true

[target.'cfg(unix)'.dependencies]
getrandom.workspace = true

[target.'cfg(windows)'.dependencies]
# The local socket transport and its same-user checks (cmux::local_socket),
# shared with the SDK's clients; the SDK's client code is not built.
cmux-sdk = { path = "../../bindings/rust", default-features = false, features = ["local-socket"] }
uds_windows.workspace = true
windows-sys = { workspace = true, features = [
    "Wdk_System_Threading",
    "Win32_Security",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Kernel",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }
