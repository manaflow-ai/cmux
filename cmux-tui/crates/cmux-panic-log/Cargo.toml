[package]
name = "cmux-panic-log"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "The panic and hang logs of cmux's background processes: one JSON line per panic or hung scope, which the cmux-next app sends to Sentry"

[lints]
workspace = true

[features]
default = ["tokio"]
# `Supervisor::supervise_task*`; FFI crates without a runtime turn it off.
tokio = ["dep:tokio", "dep:tokio-util"]

[dependencies]
cmux-trace.workspace = true
serde_json.workspace = true
tokio = { workspace = true, optional = true }
tokio-util = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
tokio.workspace = true
