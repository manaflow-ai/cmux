[package]
name = "cmux-panic-log"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "The panic and hang logs of cmux's background processes: one JSON line per panic or hung scope, which the cmux-next app sends to Sentry"

[lints]
workspace = true

[dependencies]
# The hang watcher's thread (std and libc only).
cmux-threads.workspace = true
serde_json.workspace = true

[dev-dependencies]
# The hang tests stop a hung thread for its stack and name its top frame.
backtrace = "0.3"
cmux-tui-platform.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true
