[package]
name = "cmux-panic-log"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "The panic log of cmux's background processes: one JSON line per panic, which the cmux-next app sends to Sentry"

[lints]
workspace = true

[features]
default = ["json", "minimal"]
# The serde_json writer: `Fields`, `install`, `record`, `append`.
json = ["dep:serde_json"]
# The std-only writer (`minimal`) for processes that must stay std and libc (the holder).
minimal = []

[dependencies]
serde_json = { workspace = true, optional = true }

[dev-dependencies]
serde_json.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true
