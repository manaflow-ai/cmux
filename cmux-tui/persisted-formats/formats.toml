# Every on-disk format a cmux-tui build leaves for the next build to read, and how an update crosses it.
#
# Leo, 2026-11-24 06:03Z (ask-1f9e8b7422): "we need to make sure in the future these kinds of cutovers always have
# proper migrations. in the future." The update that prompted it (the NIGHTLY on Leo's Mac, 05:34Z) lost live work:
# the old build wrote the state and started the processes, and the new build has to adopt them.
#
# scripts/ci/persisted_formats.py checks this file on every pull request that touches cmux-tui (ci/steps.toml
# `persisted-formats`). A format here is found by its version constant (`file` + `const`), and its `policy` says
# what an update does with data an older build wrote:
#
#   migrate     The next build reads it. `fixtures` names a folder of files an older build wrote, one per shape:
#               v<N>.json, then v<N>-2.json, v<N>-3.json ... for each additive change at the same version. A fixture
#               is never edited or deleted (only below a raised `floor`, the oldest version this build still reads,
#               and only together with that raise), the constant never goes down, and the current version has a
#               fixture. `test` names the Rust test (a cmux_next_ test, so the daemon-tests step runs it) that
#               loads every fixture through the real reader and fails when the writer's shape is not the newest
#               fixture's: a changed struct ships with its new fixture, and the old ones still load.
#   rebuild     Derived data the next build recomputes; losing it across an update costs time, not work. `why`
#               says so.
#   unreviewed  Listed when this file was made (2026-11-25), not yet given a policy. A pull request that changes
#               its version must give it one (migrate with fixtures, or rebuild with a why). This list only
#               shrinks: a new entry, or a new version constant anywhere in cmux-tui/crates, cannot be unreviewed.
#
# A version constant is any `const *VERSION: uN = N;` under cmux-tui/crates/*/src whose name says it is stored
# (RECORD, FORMAT, SCHEMA, STATE, STORE, JOURNAL, CACHE, SNAPSHOT, LEDGER, MANIFEST, INDEX); a wire or ABI version
# is not one. An unlisted one fails the check.
#
# The app's Swift and webviews formats and webviews storage keys: persisted-formats/formats.toml. Settings keys:
# schemas/settings/published-keys.txt and retired-keys.json. One check covers all three.
#
# The handbook page: cmuxterm-hq docs/handbook/cutover-ships-its-migration.md.

[[format]]
file = "crates/acpmux/src/agent_host/mod.rs"
const = "RECORD_VERSION"
name = "agent-host-record"
about = "<hosts dir>/<session id>.json: how the next acpmux daemon finds and adopts a live agent host (a chat mid-turn)"
policy = "migrate"
floor = 1
fixtures = "agent-host-record"
test = "cmux_next_persisted_agent_host_record"

