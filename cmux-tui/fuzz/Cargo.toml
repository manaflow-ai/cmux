# libFuzzer targets for the parsers of outside bytes in cmux-tui
# (plans/cmux-next/rust-panic-free.md section 7). Its own workspace with its
# own Cargo.lock (seeded from ../Cargo.lock), so adding a fuzz dependency never
# changes the cmux-tui lock. Build and run with ./run.sh (pinned stable
# toolchain, sanitizer coverage flags, --cfg fuzzing); see README in run.sh.

[package]
name = "cmux-tui-fuzz"
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]
members = ["."]

[dependencies]
libfuzzer-sys = "0.4"
acpmux = { path = "../crates/acpmux" }
bytes = "1"
cmux-api-compat = { path = "../crates/cmux-api-compat" }
cmux-config = { path = "../crates/cmux-config" }
cmux-pane-protocol = { path = "../crates/cmux-pane-protocol" }
cmux-rd-proto = { path = "../crates/cmux-rd-proto", features = ["serde"] }
cmux-remote-protocol = { path = "../crates/cmux-remote-protocol" }
cmux-transport = { path = "../crates/cmux-transport" }
cmux-tui-core = { path = "../crates/cmux-tui-core" }
crossterm = "0.29"
ghostty-vt = { path = "../crates/ghostty-vt" }
serde_json = "1"
tokio = { version = "1", features = ["rt"] }

[[bin]]
name = "ghostty_vt"
path = "fuzz_targets/ghostty_vt.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tui_input"
path = "fuzz_targets/tui_input.rs"
test = false
doc = false
bench = false

[[bin]]
name = "terminal_host_frame"
path = "fuzz_targets/terminal_host_frame.rs"
test = false
doc = false
bench = false

[[bin]]
name = "socket_line"
path = "fuzz_targets/socket_line.rs"
test = false
doc = false
bench = false

[[bin]]
name = "pane_protocol"
path = "fuzz_targets/pane_protocol.rs"
test = false
doc = false
bench = false

[[bin]]
name = "remote_protocol"
path = "fuzz_targets/remote_protocol.rs"
test = false
doc = false
bench = false

[[bin]]
name = "transport"
path = "fuzz_targets/transport.rs"
test = false
doc = false
bench = false

[[bin]]
name = "rd_proto"
path = "fuzz_targets/rd_proto.rs"
test = false
doc = false
bench = false

[[bin]]
name = "acp_lines"
path = "fuzz_targets/acp_lines.rs"
test = false
doc = false
bench = false

[[bin]]
name = "config_jsonc"
path = "fuzz_targets/config_jsonc.rs"
test = false
doc = false
bench = false

[[bin]]
name = "journal_segment"
path = "fuzz_targets/journal_segment.rs"
test = false
doc = false
bench = false

[[bin]]
name = "output_store"
path = "fuzz_targets/output_store.rs"
test = false
doc = false
bench = false

[[bin]]
name = "api_compat"
path = "fuzz_targets/api_compat.rs"
test = false
doc = false
bench = false

# Same crossterm the daemon and TUI use (../Cargo.toml [patch.crates-io]).
[patch.crates-io]
crossterm = { path = "../vendor/crossterm" }

# run.sh builds --release: optimized, with debug assertions, overflow checks
# and line tables for crash stacks.
[profile.release]
opt-level = 3
debug = "line-tables-only"
debug-assertions = true
overflow-checks = true
codegen-units = 16
incremental = false
