# libFuzzer targets for cmux-tui decoders (plans/cmux-next/chrome-parity/p10-stability.md,
# tasks 017-021). Its own workspace and lock, so the main cmux-tui Cargo.toml and
# Cargo.lock never change for a fuzz target. Build and run with cargo-fuzz on the
# nightly in rust-toolchain.toml; seeds are in corpus/<target>/. Task 018 created this
# workspace; later batches (017, 019-021) add [[bin]] entries, dependencies and their lock
# delta here and never add these files again (p10-stability.md, 017's landing order).
[package]
name = "cmux-tui-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]
members = ["."]

[dependencies]
libfuzzer-sys = "0.4"
cmux-link = { path = "../crates/cmux-link" }
cmux-rd-proto = { path = "../crates/cmux-rd-proto" }
cmux-transport = { path = "../crates/cmux-transport" }
cmux-wg = { path = "../crates/cmux-wg", features = ["fuzzing"] }
serde = "1"
# Batch 3 (task 019): acpmux.
acpmux = { path = "../crates/acpmux" }
serde_json = "1"
tokio = { version = "1", features = ["rt", "time"] }
toml = "0.8"
# Batch 1 (task 017): ghostty-vt output, terminal-host, pane and remote
# protocols, config JSONC, holder.
cmux-config = { path = "../crates/cmux-config" }
cmux-holder = { path = "../crates/cmux-holder" }
cmux-pane-protocol = { path = "../crates/cmux-pane-protocol" }
cmux-remote-protocol = { path = "../crates/cmux-remote-protocol" }
# Task 020 reaches the host codec, journal, output store and page listener
# decoders through `cmux_tui_core::fuzz_entry`, behind its `fuzz` feature.
cmux-tui-core = { path = "../crates/cmux-tui-core", features = ["fuzz"] }
ghostty-vt = { path = "../crates/ghostty-vt" }
bytes = "1"
# Batch 5 (task 021): cmux-tui input schedulers and keys, cmux-config, cmux-server-core.
cmux-tui = { path = "../crates/cmux-tui", features = ["fuzzing"] }
cmux-server-core = { path = "../crates/cmux-server-core" }
# Batch 4 (task 020): host codec, journal, output store, page listener.
anyhow = "1"
arbitrary = { version = "1", features = ["derive"] }
base64 = "0.22"
flate2 = "1"
sha2 = "0.10"

# The same Crossterm patch as the main workspace, so any crate here that
# reaches Crossterm builds the code cmux ships.
[patch.crates-io]
crossterm = { path = "../vendor/crossterm" }
terminput-crossterm = { path = "../vendor/terminput-crossterm" }

# A wrapped integer or a broken debug_assert! is a finding, as Chrome's fuzzers
# build with DCHECKs on.
[profile.release]
debug = 1
debug-assertions = true
overflow-checks = true

