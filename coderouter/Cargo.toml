[package]
name = "coderouter"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
description = "coderouter - route Codex/Claude Code traffic across multiple ChatGPT Pro/Claude Max/OpenCode subscriptions and API keys."
repository = "https://github.com/manaflow-ai/cmux"
publish = false

[lib]
name = "coderouter"
path = "src/lib.rs"

[[bin]]
name = "coderouter"
path = "src/main.rs"

[[bin]]
name = "cr"
path = "src/bin/cr.rs"

[dependencies]
crossterm = "0.29"
base64 = "0.22"
dirs = "6"
libc = "0.2"
portable-pty = "0.9"
rand = "0.10"
ratatui = "0.30"
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "json",
    "rustls-tls-native-roots",
    "rustls-tls-webpki-roots",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
time = { version = "0.3", features = ["parsing"] }
tiny_http = "0.12"
url = "2"
webbrowser = "1"
zeroize = { version = "1", features = ["derive", "serde"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[package.metadata.maturin]
bindings = "bin"
strip = true
