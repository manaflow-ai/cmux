[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "coderouter"
version = "0.2.0"
description = "Run Codex across your CodeRouter subscription pool"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.maturin]
bindings = "bin"
strip = true
