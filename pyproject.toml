[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "coderouter"
version = "0.2.0"
description = "coderouter - route Codex/Claude Code traffic across multiple ChatGPT Pro/Claude Max/OpenCode subscriptions and API keys."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.maturin]
bindings = "bin"
strip = true
