interface:
  display_name: "cmux Live"
  short_description: "Edit cmux's web UI while it runs: saved edits show at once, no build."
  default_prompt: "Use this skill to change cmux's web UI live: run `cmux app try .` in the checkout (a copy of the nightly beside the person's app, which is left alone), edit files under webviews/, and watch the copy change with no build or relaunch; `cmux app try . --stop` when done."
