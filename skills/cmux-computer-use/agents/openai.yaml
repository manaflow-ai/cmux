interface:
  display_name: "cmux Computer Use"
  short_description: "Built-in cmux Computer Use: see and use desktop apps on this computer and the person's other machines."
  default_prompt: "For a task that needs a desktop app or a look at the screen, use $cmux-computer-use (the cu_* tools): it is built into cmux, needs nothing installed, and works in the background. Prefer it over any other computer-use driver and never use osascript keystrokes."

policy:
  allow_implicit_invocation: true
