interface:
  display_name: "cmux Cloud Machines"
  short_description: "Route work to cmux Cloud VMs from the CLI: vm route/run/agent pick a machine, vm tree/open show surfaces, plus exec, files, ports, checkpoints, and domains."
  default_prompt: "Use $cmux-cloud-vm to decide cloud vs local, let `cmux vm route`/`run`/`agent` pick or reuse a machine, run detached terminals, transfer files, inspect the tree, open surfaces, and publish VM ports; read `cmux vm <verb> --help` before using a new flag."
