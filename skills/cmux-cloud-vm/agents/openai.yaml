interface:
  display_name: "cmux Cloud Machines"
  short_description: "The complete cmux Cloud CLI (`cmux vm`, alias `cmux cloud`): vm route/run/agent pick a machine for you; exec, push/pull, wait; terminal send/read/wait drive a machine terminal headlessly; vm tree/open and surface ls/open show workspaces, terminals, the desktop, and ports; plus create, Base, checkpoints, forks, SSH, auth, and plan limits."
  default_prompt: "Use this skill to run work on cmux Cloud machines through the plain `cmux vm` CLI: decide cloud vs local, let `cmux vm route`/`run`/`agent` pick a machine (or reuse Base), do headless work with exec/run/push/pull/wait and `vm terminal send|read|wait`, start agents as detached terminals in the machine's cmux-tui session, mint private port URLs, checkpoint/fork for experiments, and use `cmux vm tree`/`vm open`/`surface open` to show terminals, the desktop, or ports to the user only when results are ready. `cmux vm <verb> --help` and references/commands.md list every verb, flag, --json shape, and exit code."
