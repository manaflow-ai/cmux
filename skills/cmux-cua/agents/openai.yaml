interface:
  display_name: "cmux-cua"
  short_description: "cmux Computer Use: operate desktop apps on the person's Mac from a cmux chat."
  default_prompt: "For a task that needs an app on the person's Mac or a look at their screen, use $cmux-cua (the cua_* tools), never osascript keystrokes; cmux shows the person a setup card once per Mac, then asks nothing more, so keep to the request."

policy:
  allow_implicit_invocation: true
