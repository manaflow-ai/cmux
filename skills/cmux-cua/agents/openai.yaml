interface:
  display_name: "cmux-cua"
  short_description: "cmux Computer Use: operate desktop apps on the person's Mac from a cmux chat."
  default_prompt: "For a task that needs an app on the person's Mac or a look at their screen, use $cmux-cua (the cua_* tools), never osascript keystrokes; cmux asks the person for setup and for each app."

policy:
  allow_implicit_invocation: true
