# cmux device hub: device keys, Mac Screen permissions, session tickets and
# WebRTC signaling. Contract: docs/device-hub/PROTOCOL.md.
#
# No account_id here: the account comes from the deploy environment
# (CLOUDFLARE_ACCOUNT_ID). Both targets are in Lawrence's account.
# The top level is production (cmux-device-hub on workers.dev, deploy with
# --env=""); [env.dev] is dev. The app builds both addresses in. DEPLOY.md.
#
# Secrets (wrangler secret put, or .dev.vars for wrangler dev):
#   SESSION_KEY        private P-256 JWK (JSON) that signs account session JWTs
#   TICKET_KEY         private P-256 JWK (JSON) that signs session tickets
#   TURN_KEY_ID        optional, Cloudflare Realtime TURN key id
#   TURN_KEY_API_TOKEN optional, its API token. The hub's own mint, the fallback
#                      until it is removed; without both it mints nothing.
#   DEVICE_HUB_TURN_TOKEN optional, bearer for cmux-platform's one TURN minter
#                      (POST /v1/relay/ice-servers); put by a cmux-platform
#                      workflow. Without it the hub mints locally.
# `npm run dev-secrets` writes a fresh .dev.vars with both keys.

name = "cmux-device-hub"
main = "src/index.ts"
compatibility_date = "2026-09-01"
# Outbound fetch goes over the public internet: cmux-platform (machine.ts) is a
# workers.dev Worker on this same account, which a plain same-account fetch is
# refused with (Cloudflare error 1042). Every other fetch here is already public.
compatibility_flags = ["global_fetch_strictly_public"]
workers_dev = true
preview_urls = false

[observability]
enabled = true

[observability.logs]
enabled = true
# Ticket URLs carry a credential in the query string.
invocation_logs = false

[vars]
# Which deployment this is (src/buildSpace.ts): production serves no dev build
# space. A dev build's X-Cmux-Build-Space is refused here (403), never served
# as NIGHTLY's space; only env.dev (and a tag's stack, which runs env.dev) serves them.
ENVIRONMENT = "production"
# Stack Auth projects accepted by /v1/auth/stack (comma list; STACK_PROJECT_ID
# is the fallback when this is empty). Production: cmux prod only.
STACK_PROJECT_IDS = "9790718f-14cd-4f7e-824d-eaf527a82b82"
# cmux web backend per Stack project, asked with the caller's own Stack token
# (GET /api/billing/plan) before each cmux relay grant: Pro, Max or Team get
# it; anything else, or a failed lookup, gets none. src/billing.ts.
BILLING_ORIGINS = "9790718f-14cd-4f7e-824d-eaf527a82b82=https://cmux.com"
# Optional public origin used in signalURL (e.g. https://hub.example). Empty:
# derived from the request URL.
PUBLIC_BASE_URL = ""
# cmux-platform per Stack project, asked whose a joined machine's credential is
# (POST /v1/auth/machine, src/machine.ts). The production platform, which the
# join enrolls with by default (cmux-cloud-environment PRODUCTION_PLATFORM) and
# whose STACK_PROJECT_ID is cmux prod.
MACHINE_ORIGINS = "9790718f-14cd-4f7e-824d-eaf527a82b82=https://cmux-platform-production.debussy.workers.dev"
# Where the cmux relay ICE comes from (src/turn.ts): cmux-platform's one TURN
# minter first, the hub's own mint (TURN_KEY_*) when the platform fails. Also
# `local` or `platform`.
TURN_SOURCE = "platform-first"
PLATFORM_TURN_ORIGIN = "https://cmux-platform-production.debussy.workers.dev"

[[durable_objects.bindings]]
name = "USER_DO"
class_name = "UserDO"

[[durable_objects.bindings]]
name = "SESSION_DO"
class_name = "SessionDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["UserDO", "SessionDO"]

# ---- dev deployment: cmux-device-hub-dev on workers.dev ----
# Bindings, vars and migrations are not inherited by environments, so they are
# repeated here. Deploy steps: DEPLOY.md.
[env.dev]
name = "cmux-device-hub-dev"
workers_dev = true
preview_urls = false

[env.dev.observability]
enabled = true

[env.dev.observability.logs]
enabled = true
invocation_logs = false

[env.dev.vars]
# Serves dev build spaces: each tagged build's devices and sessions are its own
# User DO (src/buildSpace.ts).
ENVIRONMENT = "dev"
# cmux prod and the Stack development project used by DEBUG/tagged builds.
STACK_PROJECT_IDS = "9790718f-14cd-4f7e-824d-eaf527a82b82,454ecd03-1db2-4050-845e-4ce5b0cd9895"
# Prod-project users ask cmux.com; development-project users ask the staging
# web deployment (its Stack project is the development one).
BILLING_ORIGINS = "9790718f-14cd-4f7e-824d-eaf527a82b82=https://cmux.com,454ecd03-1db2-4050-845e-4ce5b0cd9895=https://cmux-staging.vercel.app"
PUBLIC_BASE_URL = ""
# The production platform for prod-project users; the development and staging
# platforms (both on the Stack development project) for development-project users.
MACHINE_ORIGINS = "9790718f-14cd-4f7e-824d-eaf527a82b82=https://cmux-platform-production.debussy.workers.dev,454ecd03-1db2-4050-845e-4ce5b0cd9895=https://cmux-platform-development.debussy.workers.dev,454ecd03-1db2-4050-845e-4ce5b0cd9895=https://cmux-platform-staging.debussy.workers.dev"
# The development platform's TURN minter, then the hub's own mint.
TURN_SOURCE = "platform-first"
PLATFORM_TURN_ORIGIN = "https://cmux-platform-development.debussy.workers.dev"

[[env.dev.durable_objects.bindings]]
name = "USER_DO"
class_name = "UserDO"

[[env.dev.durable_objects.bindings]]
name = "SESSION_DO"
class_name = "SessionDO"

[[env.dev.migrations]]
tag = "v1"
new_sqlite_classes = ["UserDO", "SessionDO"]
