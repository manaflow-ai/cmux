# cmux mobile relay — Cloudflare Worker + one Durable Object class.
#
# One HostRelay Durable Object per host device (idFromName from the VERIFIED
# Stack user id + host device UUID, never client input). The host (a Mac today,
# any cmux host later) keeps one outbound WebSocket to its own object; each
# phone keeps one WebSocket to the object of the host it is attached to. The
# object relays opaque per-session data frames between them and stores nothing
# durable, so deploys never need data migrations beyond the class list below.
#
# This worker is deliberately separate from workers/presence (cmux-presence)
# and cmux-tui/relays/cloudflare-do (cmux-remote-relay): separate name, domain,
# secrets, and migration lineage, so a bad deploy here cannot touch either.
#
# Deploys run from .github/workflows/mobile-relay.yml. The [[migrations]]
# block is append-only; never hand-edit past tags.
#
# No secrets: connect auth verifies the endpoint's own Stack access token
# against the Stack API using only the project's public client configuration
# below (the same values every shipped app embeds).

name = "cmux-mobile-relay"
main = "src/index.ts"
compatibility_date = "2026-05-01"

[vars]
STACK_PROJECT_ID = "1467bed0-8522-45ee-a8d8-055de324118c"
STACK_PUBLISHABLE_CLIENT_KEY = "pck_pt4nwry6sdskews2pxk4g2fbe861ak2zvaf3mqendspa0"

[observability]
enabled = true

[[durable_objects.bindings]]
name = "HOST_RELAY"
class_name = "HostRelay"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["HostRelay"]

# Production custom domain on the cmux.dev zone (same Cloudflare account).
# `custom_domain = true` provisions DNS + TLS with the deploy; the workers.dev
# URL stays as the dev/staging entrypoint.
[[routes]]
pattern = "mr.cmux.dev"
custom_domain = true
