# Dev/staging deployment of the mobile relay: same code, separate worker name,
# no custom domain (served from workers.dev). Deploy with:
#   wrangler deploy --config wrangler.dev.toml
# Verifies against the DEV Stack project, so dev and prod accounts never mix.

name = "cmux-mobile-relay-dev"
main = "src/index.ts"
compatibility_date = "2026-05-01"

[vars]
STACK_PROJECT_ID = "454ecd03-1db2-4050-845e-4ce5b0cd9895"
STACK_PUBLISHABLE_CLIENT_KEY = "pck_xb63160bwe9699vtxfzfj6emmxpafg5mkjrtp6ehzxv5g"

[observability]
enabled = true

[[durable_objects.bindings]]
name = "HOST_RELAY"
class_name = "HostRelay"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["HostRelay"]
