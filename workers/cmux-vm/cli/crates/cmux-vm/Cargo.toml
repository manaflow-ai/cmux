[package]
name = "cmux-vm"
description = "Command-line client for the cmux VM API"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[[bin]]
name = "cmux-vm"
path = "src/main.rs"

[dependencies]
clap.workspace = true
cmux-vm-client = { path = "../cmux-vm-client" }
futures.workspace = true
reqwest.workspace = true
# SHA-256 of resumable uploads (already in the lock through the TLS stack).
ring = "0.17"
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
# `signal`: abandon a resumable upload on Ctrl-C, revoke an ssh session on
# SIGHUP/SIGTERM. `process`: wait for ssh without blocking a runtime thread.
# `time`: retry backoff and the upload stall watchdog.
tokio = { workspace = true, features = ["process", "signal", "time"] }

[dev-dependencies]
wiremock.workspace = true

[lints]
workspace = true
