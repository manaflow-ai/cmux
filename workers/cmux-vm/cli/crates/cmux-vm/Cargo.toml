[package]
name = "cmux-vm"
description = "Command-line client for the cmux VM API"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[[bin]]
name = "cmux-vm"
path = "src/main.rs"

[features]
default = ["default-tls", "system-proxy", "preserve-order"]
default-tls = ["cmux-vm-client/default-tls"]
system-proxy = ["cmux-vm-client/system-proxy"]
# --json prints the server's keys in the server's order. Off in the cmux CLI: Cargo unifies
# features, so it would turn on preserve_order for every serde_json map in that binary.
preserve-order = ["serde_json/preserve_order"]

[dependencies]
clap.workspace = true
base64.workspace = true
cmux-vm-client = { path = "../cmux-vm-client", default-features = false }
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
security-framework.workspace = true
# The user's home from the user database, for the token store lock (token.rs).
nix = { workspace = true, features = ["user"] }

[dev-dependencies]
wiremock.workspace = true

[lints]
workspace = true
