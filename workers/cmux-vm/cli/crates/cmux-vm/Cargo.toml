[package]
name = "cmux-vm"
description = "Command-line client for the cmux VM API"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[[bin]]
name = "cmux-vm"
path = "src/main.rs"

[features]
default = ["default-tls", "system-proxy"]
default-tls = ["cmux-vm-client/default-tls"]
system-proxy = ["cmux-vm-client/system-proxy"]

[dependencies]
clap.workspace = true
base64.workspace = true
cmux-vm-client = { path = "../cmux-vm-client", default-features = false }
futures.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
tokio.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
security-framework.workspace = true

[dev-dependencies]
wiremock.workspace = true

[lints]
workspace = true
