[package]
name = "cmux-vm-client"
description = "Rust client for the cmux VM API, generated from its OpenAPI document"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

# The generated method docs indent plain text, which rustdoc would compile
# as doctests. The crate has no hand-written examples to test.
[lib]
doctest = false

[features]
default = ["default-tls"]
# reqwest's own TLS (rustls with aws-lc). Off when a host binary brings its own rustls
# provider (the cmux CLI).
default-tls = ["reqwest/default-tls"]

[dependencies]
bytes.workspace = true
futures.workspace = true
progenitor-client.workspace = true
regress.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true
