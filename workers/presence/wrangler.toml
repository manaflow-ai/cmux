# cmux device presence service — Cloudflare Worker + Durable Objects.
#
# One TeamPresence Durable Object per team holds the team's ephemeral presence
# map. Durable device identity lives in the Aurora `devices` /
# `device_app_instances` registry (web/db/schema.ts); this service is the
# realtime layer on top and stores nothing durable beyond a 24h "last seen"
# window in DO storage.
#
# Deploys run from .github/workflows/presence.yml on push to main. The
# [[migrations]] block below is the service's schema migration story: wrangler
# applies Durable Object class migrations atomically with every deploy, so the
# code and its storage classes can never drift the way lagging SQL migrations
# can. Never hand-edit past migration tags; append a new one.
#
# Stack Auth configuration is intentionally NOT in [vars]: values set here
# overwrite dashboard-set values on every deploy. They are provisioned once as
# Worker secrets (see README.md) and survive deploys:
#   wrangler secret put STACK_PROJECT_ID
#   wrangler secret put STACK_PUBLISHABLE_CLIENT_KEY
# Optional plain var STACK_API_URL defaults to https://api.stack-auth.com.

name = "cmux-presence"
main = "src/index.ts"
compatibility_date = "2026-05-01"

# Worker Previews (.github/workflows/worker-previews.yml) serve each same-repo
# pull request at https://pr-<number>-cmux-presence.debussy.workers.dev. This
# only allows preview URLs; the production workers.dev URL stays disabled
# because of the custom-domain route below.
preview_urls = true

[observability]
enabled = true

[[durable_objects.bindings]]
name = "TEAM_PRESENCE"
class_name = "TeamPresence"

# Account control plane: one DO per verified Stack user id serving the
# /v1/control/socket WebSocket (directory + hint + relay-pass facts, proxied
# from the Vercel broker with the connecting client's own bearer token). The
# Vercel base URL is the optional plain var CMUX_WEB_BASE_URL (defaults to
# https://cmux.com in code, same pattern as STACK_API_URL).
[[durable_objects.bindings]]
name = "ACCOUNT_CONTROL_PLANE"
class_name = "AccountControlPlane"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TeamPresence"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["AccountControlPlane"]

# Production custom domain on the cmux.dev zone (same Cloudflare account).
# `custom_domain = true` provisions the DNS record + TLS cert with the deploy;
# the workers.dev URL stays as the dev/staging entrypoint.
[[routes]]
pattern = "presence.cmux.dev"
custom_domain = true

# Previews get ONLY the bindings declared here, never the production Worker
# secrets. Durable Object classes are recreated per Preview, so a preview can
# never read or write production presence state. Auth uses the public
# development Stack project (the same values Debug builds ship), and the
# control plane proxies to staging web, matching wrangler.dev.toml.
# CONNECTIVITY_INVALIDATION_SECRET and SENTRY_DSN are intentionally absent:
# publisher calls fail closed and Sentry reporting is a no-op.
[previews.vars]
STACK_PROJECT_ID = "454ecd03-1db2-4050-845e-4ce5b0cd9895"
STACK_PUBLISHABLE_CLIENT_KEY = "pck_xb63160bwe9699vtxfzfj6emmxpafg5mkjrtp6ehzxv5g"
CMUX_WEB_BASE_URL = "https://cmux-staging.vercel.app"

[[previews.durable_objects.bindings]]
name = "TEAM_PRESENCE"
class_name = "TeamPresence"

[[previews.durable_objects.bindings]]
name = "ACCOUNT_CONTROL_PLANE"
class_name = "AccountControlPlane"
