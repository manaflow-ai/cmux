# DEV-ONLY config for cmux-presence-dev: same worker + DO as production, but on
# the workers.dev URL (cmux-presence-dev.<account>.workers.dev), NOT the
# production presence.cmux.dev custom domain. Use:
#   bunx wrangler deploy --config wrangler.dev.toml
name = "cmux-presence-dev"
main = "src/index.ts"
compatibility_date = "2026-05-01"
workers_dev = true

[observability]
enabled = true

# Dev builds authenticate against the shared staging web deployment (the same
# origin AuthEnvironment.irohBrokerBaseURL resolves for Debug builds), so the
# control-plane DO must proxy discovery/mint upstream calls there too.
[vars]
CMUX_WEB_BASE_URL = "https://cmux-staging.vercel.app"

[[durable_objects.bindings]]
name = "TEAM_PRESENCE"
class_name = "TeamPresence"

# Account control plane (see wrangler.toml). Dev deploys usually also want
# CMUX_WEB_BASE_URL pointed at a dev/preview web deployment.
[[durable_objects.bindings]]
name = "ACCOUNT_CONTROL_PLANE"
class_name = "AccountControlPlane"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TeamPresence"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["AccountControlPlane"]
