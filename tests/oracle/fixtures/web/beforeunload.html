<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Before unload</title></head>
<body>
<h1>Before unload</h1>
<p>Leaving this page asks first. Browsers show the prompt only after a user activation of the page.</p>
<form><label>Draft <input id="draft" name="draft" autocomplete="off"></label></form>
<p><a id="other" href="other.html">Other</a></p>
<script>
addEventListener("beforeunload", (event) => {
  event.preventDefault();
  event.returnValue = "";
});
</script>
</body>
</html>
