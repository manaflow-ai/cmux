<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Popup</title></head>
<body>
<h1>Popup</h1>
<p><button id="open" type="button">Open popup</button></p>
<p><a id="blank" href="popup-target.html" target="_blank">Open in a new tab</a></p>
<p>popup.html?auto opens the popup on load, without a user gesture, so the popup blocker decides.</p>
<script>
const openPopup = () => window.open("popup-target.html", "fixture-popup", "popup,width=480,height=360");
document.getElementById("open").addEventListener("click", openPopup);
if (location.search === "?auto") {
  openPopup();
}
</script>
</body>
</html>
