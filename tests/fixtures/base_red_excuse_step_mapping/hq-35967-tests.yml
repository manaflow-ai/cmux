name: fleet-reconcilers tests

# The fleet reconcilers (tools/fleet-reconcilers): next-autoland, base-red-watch and the reconcilers that follow
# them out of leo-workspace. Their suites run here on Linux; no test reaches GitHub or a host.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - build-fleet/data/job-needs.json  # now_memory.py reads it (through now.py; #35398)
      - tests/git_fixture_env.py  # its tests load the git fixture
      - goals/ios-quality-climb.md  # a test here reads it (test_workflow_paths_cover_inputs.py names the chain)
      - docs/rfd/0017-pausing-agent-machines.md  # test_resume_tiers.py reads its resume-tiers block
      - goals/session-move-matrix-green.md  # test_session_move_matrix_probe.py reads it
      - goals/auto-ui-preview-under-60s.md  # test_now_ui_preview.py reads its check lines
      - docs/design/ci-v2.md  # test_ci_v2_rows.py verifies its generated row count
      - docs/design/ci-v2-rows*.json  # the same test
      - docs/design/customization-capability-matrix.md  # test_customization_matrix_probe.py parses it
      - docs/handbook/review-follow-ups.md  # test_review_followups.py checks the page's examples against the matcher
      - docs/ci/synthetic-probes-workflow.md  # test_probe_watchdog.py reads it (the watchdog's page)
      - tools/fleet-reconcilers/**
      - tools/lane-gh-broker/parts/20-broker.py  # test_now_broker_saturation.py reads served_tools() (#29446)
      - .github/actions/cmux-files/fetch.sh  # test_cmux_files_fetch.py runs it
      - build-fleet/autodeploy/hq_autodeploy.py  # test_pool_pack.py reads it (#27570)
      - build-fleet/gui-ci-users.json  # test_release_rollback_drill.py reads it (the rollback_drill account)
      - build-fleet/images/linux-simsdk/bake.sh  # provider_trial.py uploads it to a simsdk trial runner (test_provider_trial.py)
      - build-fleet/images/linux-simsdk/gce-bake.sh  # test_runner_pool.py runs its bake_create zone walk
      - build-fleet/swift-linux-builder/gha-runners/bake-create.sh  # test_runner_pool.py runs bake_create with a fake gcloud
      - build-fleet/gcp-lane-runners/guest-install.sh  # test_runner_pools.py checks its ghrunner-fw fences the tailnet (FENCED_LABELS)
      - docs/findings/2026-11-25-ci-provider-trials.md  # provider_trial.py appends its rows there
      - docs/handbook/review-follow-ups.md  # test_review_followups.py reads it
      - scripts/microvm-lanes/**  # test_microvm_exp.py packs them into the experiment VM's metadata
      - build-fleet/microvm-host/**  # test_microvm_host_provision.py checks provision.sh; microvm_host.py carries it in metadata
      - tools/rfd_index.py  # now_rfd_open.py loads it (test_now_rfd_decide_by.py)
      - tools/agent-guards/workflow_paths_cover_inputs.py  # select_affected_tests.py walks each test's inputs with it
      - scripts/skills_shard_inputs.py  # select_affected_tests.py places what the walker cannot (unknown_inputs)
      - build-fleet/console_steps.py  # screen_share_e2e_probe.py checks the pins (test_screen_share_e2e_probe.py)
      - build-fleet/console-steps.json  # console_steps.py reads it
      - build-fleet/data/job-needs.json  # now_memory.py reads it (CI job peak-memory rows, #35398)
      - build-fleet/ci-dash/runner_drift.py  # runner_offline_why.py imports it (test_runner_offline_why.py)
      - tools/cloud-golden-path/**  # the start matrix's golden-path row (its suite runs below)
      - triggers/checks/**  # the condition-trigger checks (their suite runs below; NOW reads their panel)
      - tools/own-machines/*.py  # the own-machines probe and its app job (they import probes and cloud_chat_app_probe)
      - tools/screenshare-e2e/**  # the screen-share-e2e fleet steps (e2e.py imports cloud_chat_app_probe and walk_home)
      - tools/screenshare-bench/provision/mac/in-launcher.sh  # e2e.py runs its --screenshare-e2e entry
      - tools/screenshare-bench/provision/mac/lib.sh  # e2e.py runs its install_launcher and launcher_grants
      - tools/screenshare-bench/viewer/adapters/mac-input.swift  # e2e.py builds it for the key and click
      - tools/screenshare-bench/viewer/driver.py  # in-launcher.sh runs it
      - build-fleet/signin_session.py  # screen-share-e2e's e2e.py exchanges the delivered session with it
      - build-fleet/codex-lane-reconciler/**  # the Codex swarm VMs' reconciler and guest hooks
      - tools/freestyle-lane-vms/**  # the Freestyle lane VMs (freestyle-lane-vms.yml; it imports state_branch and freestyle_runners from tools/fleet-reconcilers)
