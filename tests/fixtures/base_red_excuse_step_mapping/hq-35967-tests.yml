      - build-fleet/swift-linux-builder/pool/recipe-swift-check.sh  # test_freestyle_steps.py reads it (the swift-check probe's preflight paths)
      - build-fleet/cmd/controller/ci_step_linux_route.go  # test_freestyle_steps.py reads stepLinuxOwnedFirst (GCP_FIRST_S)
      - tools/freestyle-workflow/pool-guest.sh  # test_freestyle_pool.py reads its labels, registration and job-done hook
      - tools/freestyle-workflow/runners.mjs  # test_freestyle_runners.py reads its peer labels and vCPU sizes
      - .github/actions/bun/action.yml  # test_freestyle_runners.py reads the Bun floor (#28062)
      - scripts/freestyle-run/bun.lock  # test_freestyle_runners.py reads the lockfile version (#28062)
      - build-fleet/mini-ops/share_grant.py  # screen_share_zero_touch_probe.py reads its grant states (test_screen_share_zero_touch_probe.py)
