# Land tier (Leo, 2026-11-21: "de facto, im asking for 99% fewer minutes of ci time, period."): a pull request head
# starts none of this workflow's jobs until it carries `ready-to-land` (land-judge adds it when asked to land) or
# `full-ci`; hq-land-tier.yml posts the commit status `hq/land-tier` pending on such a head, so land-judge waits for the
# full tier instead of landing on a skipped one. Pushes to main run everything as before.
permissions:
  contents: read

concurrency:
  group: fleet-reconcilers-tests-${{ github.ref }}${{ github.event.action == 'labeled' && github.event.label.name != 'ready-to-land' && github.event.label.name != 'full-ci' && format('-label-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  tests:
    if: ${{ (github.event_name != 'pull_request' || ((contains(github.event.pull_request.labels.*.name, 'ready-to-land') || contains(github.event.pull_request.labels.*.name, 'full-ci')) && (github.event.action != 'labeled' || github.event.label.name == 'ready-to-land' || github.event.label.name == 'full-ci'))) }}
    runs-on: ${{ vars.CI_OVERFLOW_LINUX || 'cmux-linux' }}
    timeout-minutes: 18  # worst case: 420 s modules (test_goal_owner_moves, parallel_suite SLOW_TIMEOUT_S) + 540 s test_order_leaks (two 240 s phases) + setup; a hang now ends with its output (parallel_suite.py), not this limit
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Two commits: a PR's merge commit and its first parent, the base tip it merged onto, for the diff below.
          fetch-depth: 2
          persist-credentials: false
      # A PR runs only the test files its changed paths can reach (what each test imports, sources, runs or opens,
      # by the walker that holds path filters to their tests' inputs), and skips a suite with none. 15 s. A push to
      # main, an unreadable diff or any error writes no output here, and every gate below defaults to running all
      # (docs/handbook/ci-runs-suites-it-cannot-affect.md; Leo, 2026-11-21: "de facto, im asking for 99% fewer
      # minutes of ci time, period.").
      - name: Pick the tests this PR can affect
        id: select
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          set -uo pipefail
          if git rev-parse --verify --quiet HEAD^2 >/dev/null \
            && git diff --name-only HEAD^1 HEAD > "$RUNNER_TEMP/changed-paths" \
            && out=$(timeout 180 python3 tools/fleet-reconcilers/select_affected_tests.py < "$RUNNER_TEMP/changed-paths"); then
            echo "$out" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::test selection unavailable; running every suite"
          fi
      - name: Loop-ledger cross-repo pin — unchecked (lw is private)
        # Best effort with this workflow's existing read token; no private access means unchecked, never pass.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/fleet-reconcilers/loop_ledger_pin_check.py
      - name: fleet-reconcilers suite
        if: steps.select.outputs.run_fleet != 'false'
        env:
          OUR_IDENTITIES_MACHINES: ${{ github.workspace }}/tools/fleet-reconcilers/fixtures/our-identities  # who is us in tests
          M: ${{ steps.select.outputs.m_fleet }}  # the test files a PR can affect; empty runs the whole suite
          ORDER_LEAKS_MODULES: ${{ steps.select.outputs.order_leaks_modules }}  # what test_order_leaks shuffles; empty: all
        run: |
          git config --global user.email ci@example.invalid
          git config --global user.name ci
          git config --global init.defaultBranch main
          # One module per process on the runner's CPUs (at most 8 of a shared pool VM's 32), then test_order_leaks alone: the one-process discover ran 385 s on
          # one of the runner's 8 vCPUs (main run 45118496761). Every test still runs once; see parallel_suite.py.
          # The test files are named, not discovered, so tools/agent-guards' path-coverage detector sees what this runs.
          if [ -n "$M" ]; then
            # shellcheck disable=SC2086  # M is a space-separated list of tracked test paths
            python3 tools/fleet-reconcilers/parallel_suite.py $M
          else
            python3 tools/fleet-reconcilers/parallel_suite.py tools/fleet-reconcilers/test_*.py
          fi
      - name: condition-trigger checks suite
        if: ${{ !cancelled() && steps.select.outputs.run_triggers != 'false' }}
        env:
          K: ${{ steps.select.outputs.k_triggers }}  # -k filters; empty runs the whole suite
        run: python3 -m unittest discover -s triggers/checks -p 'test_*.py' -v $K
      - name: cloud golden-path suite
        if: ${{ !cancelled() && steps.select.outputs.run_golden_path != 'false' }}
        env:
          K: ${{ steps.select.outputs.k_golden_path }}  # -k filters; empty runs the whole suite
        # Was golden-path.yml (cmuxterm-hq#7395); here it runs read-only, with no persisted credentials.
        run: python3 -m unittest discover -s tools/cloud-golden-path -p 'test_*.py' -v $K
      - name: freestyle-lane-vms suite
        if: ${{ !cancelled() && steps.select.outputs.run_freestyle != 'false' }}
        env:
          K: ${{ steps.select.outputs.k_freestyle }}  # -k filters; empty runs the whole suite
        run: python3 -m unittest discover -s tools/freestyle-lane-vms -p 'test_*.py' -v $K
      - name: screen-share-e2e suite
        if: ${{ !cancelled() && steps.select.outputs.run_screenshare != 'false' }}
        env:
          K: ${{ steps.select.outputs.k_screenshare }}  # -k filters; empty runs the whole suite
        run: python3 -m unittest discover -s tools/screenshare-e2e -p 'test_*.py' -v $K
      - name: own-machines suite
        if: ${{ !cancelled() && steps.select.outputs.run_own_machines != 'false' }}
        env:
          K: ${{ steps.select.outputs.k_own_machines }}  # -k filters; empty runs the whole suite
        run: python3 -m unittest discover -s tools/own-machines -p 'test_*.py' -v $K
      - name: runner-pool self-deploy suite
        if: ${{ !cancelled() && steps.select.outputs.run_runner_pool != 'false' }}
        env:
          K: ${{ steps.select.outputs.k_runner_pool }}  # -k filters; empty runs the whole suite
        run: python3 -m unittest discover -s build-fleet/swift-linux-builder/gha-runners/service -p '*_test.py' -v $K
      - name: codex-lane-reconciler suite
        if: ${{ !cancelled() && steps.select.outputs.run_codex_lane != 'false' }}
        env:
          K: ${{ steps.select.outputs.k_codex_lane }}  # -k filters; empty runs the whole suite
        run: python3 -m unittest discover -s build-fleet/codex-lane-reconciler -p '*_test.py' -v $K
      - name: actionlint the reconciler workflows
        # Only when a workflow it lints changed (select_affected_tests.py ACTIONLINT); a push to main always lints.
        if: ${{ !cancelled() && steps.select.outputs.actionlint != 'false' }}
        env:
          GH_TOKEN: ${{ github.token }}
        # A workflow GitHub cannot parse never runs at all (fleet-reconciler-gce.yml shipped `runner.temp` in job env
        # and every dispatch got HTTP 422), and no unit test sees that. Pinned release, checked by sha256. The download
        # retries: one 504 from the release host failed this step on main and on hq#7775 (2026-11-08), lint unread.
        run: |
          set -euo pipefail
          v=1.7.12; sum=8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          f="actionlint_${v}_linux_amd64.tar.gz"
          # github.com's release URL answered 504 for 25 s straight from these runners (run 42470445045), retries and all,
          # so the fallback fetches the same asset through the API's route. The sha256 below checks either copy.
          if ! curl -fsSL --retry 3 --retry-delay 5 --retry-all-errors --max-time 60 "https://github.com/rhysd/actionlint/releases/download/v$v/$f" -o "$RUNNER_TEMP/al.tgz"; then
            echo "::warning::actionlint release URL failed; fetching the same asset through the GitHub API"
            gh release download "v$v" -R rhysd/actionlint -p "$f" -O "$RUNNER_TEMP/al.tgz" --clobber
          fi
          echo "$sum  $RUNNER_TEMP/al.tgz" | sha256sum -c --quiet -
          tar -xzf "$RUNNER_TEMP/al.tgz" -C "$RUNNER_TEMP" actionlint
          # ci-oops asks for every minute (#25984); GitHub runs it at most every 5 min anyway, so that lint is noise and
          # it failed every PR touching a reconciler workflow (hq#27478 run 45738918665).
          "$RUNNER_TEMP/actionlint" -shellcheck= -pyflakes= -ignore 'scheduled job runs too frequently' .github/workflows/fleet-reconciler-*.yml .github/workflows/next-dogfood.yml .github/workflows/fleet-nightly-promotion-admission.yml .github/workflows/fleet-reconcilers-tests.yml .github/workflows/own-machines-e2e.yml .github/workflows/freestyle-lane-vms.yml
