      - build-fleet/mini-ops/linux-vm/runner-fork-guard.sh  # linux-vm-supervisor.py (test_mac_vm_runners.py loads it) reads it
      - build-fleet/mini-ops/linux-vm/guest-reclaim.py  # linux-vm-supervisor.py (test_mac_vm_runners.py loads it) copies it into slot VMs
      - tools/lane-gh-broker/parts/49-calls-runner-jit.py  # test_runner_work_folder.py: its work_folder
      - tools/lane-gh-broker/parts/59-caller-admission.py  # test_now_broker_saturation.py: the admission line it reads
