name: fixture
on: push
jobs:
  tests-policy:
    name: Skill policy tests
    runs-on: fixture
    steps:
      - name: "Checkout"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: "Every compile, build or test job names its warm sources or why it starts cold (.github/warm-sources.json)"
        run: "python3 tests/test_warm_sources.py -v"
      - name: "Runner label policy (no GitHub-hosted runners)"
        run: "set -euo pipefail"
      - name: "Skills tests run each suite once and every job has a timeout"
        run: "python3 tests/test_skills_workflow_budget.py"
      - name: "No password is piped into sudo -S (root steps go through sudo_ssh or fleet-sudo)"
        run: "python3 tests/test_no_piped_sudo.py -v"
      - name: "No test writes the host's git hooks or global git config"
        run: "python3 tests/test_tests_isolate_git_config.py -v"
      - name: "Every tests/test_*.py runs in a workflow (a short allowlist only shrinks)"
        run: "python3 tests/test_tests_run_in_ci.py -v"
      - name: "The deleted-or-weakened-tests guard judges tests by what they do and what runs them"
        run: "python3 tests/test_test_integrity.py -v"
      - name: "The guard's shell invocation detector names what bash runs (vendored from cmux)"
        run: "python3 tests/test_shell_invocations.py -v"
      - name: "Validate coordinator receipts, effect replay and burst coalescing"
        run: "python3 -m unittest discover -s skills/agents/parallel-work-coordinator/tests -p 'test_*.py'"
      - name: "nightly-next workflows initialize ghostty-next before the bundle notice check (cx-x7hwx)"
        run: "python3 tests/test_nightly_next_workflow_guards.py"
      - name: "linux-pool-overflow runs a Swift check with no controller (cmuxterm-hq#8647)"
        run: "python3 tests/test_linux_pool_overflow_controller_free.py -v"
      - name: "Compile and fallback workflows key concurrency by PR/SHA and never cancel in progress"
        run: "python3 build-fleet/ci-shadow/workflow_concurrency_test.py"
      - name: "A push to main never cancels a running main run; the shard aggregate tells superseded from failed"
        run: "python3 tests/test_main_push_concurrency.py -v"
      - name: "Nightly, promote and publish workflows never share a group that drops a queued delivery run"
        run: "python3 tests/test_delivery_concurrency.py"
      - name: "upload-artifact keeps 3 days or less and large kinds go to R2 (artifact storage quota)"
        run: "python3 tests/test_upload_artifact_retention.py"
      - name: "Bash scripts keep here-documents out of short macOS pipes (heredoc_write hang)"
        run: "python3 tests/test_bash_heredoc_pipe_guard.py"
      - name: "The gh guard hands calls to glaeda's broker and never loses one"
        run: "python3 tests/test_gh_guard_broker.py"
      - name: "An agent's acpmux new on a busy idle_only host goes through lane-place"
        run: "python3 tests/test_acpmux_guard.py"
      - name: "The gh poll guard still refuses a fast watch and lets writes through"
        run: "python3 tests/test_gh_poll_guard.py -v"
      - name: "Validate tsadmin account listing stays entry-scoped"
        run: "./scripts/test-tsadmin-accounts.sh"
      - name: "Validate fleet devices never carry an expiring node key"
        run: "./tests/test_ts_key_expiry_guard.sh"
      - name: "Tailscale SSH never asks Leo's login for a browser check on fleet hosts"
        run: "python3 tests/test_tailnet_fleet_ssh.py -v"
      - name: "The fleet Tailscale rollout changes only what it plans, against a fake API"
        run: "python3 tests/test_tsadmin_fleet_rollout.py -v"
      - name: "Validate the Testbox skill's documented shell blocks"
        run: "./tests/test_testbox_doc_blocks.sh"
      - name: "Validate the shared Testbox warmup wrapper (registration and gate)"
        run: "./tests/test_testbox_warmup.sh"
      - name: "Testbox release ends a box through the release marker"
        run: "./tests/test_testbox_release.sh"
      - name: "Fast checks preserve snapshots and wait for exact runs"
        run: "python3 -m unittest discover -s tests -p test_testbox_test.py"
      - name: "Fast checks Actions did not start run on the Linux pool, then an owned Mac"
        run: "python3 -m unittest discover -s tests -p test_fast_checks_fleet.py"
      - name: "A cmux-ci test box gets a read-only GitHub credential (Actions and the fleet fallback)"
        run: "python3 -m unittest discover -s tests -p test_fast_checks_box_credentials.py"
      - name: "Testbox run uses umask 022"
        run: "./scripts/test-testbox-run-umask.sh"
      - name: "Testbox run dates synced source changes so Cargo rebuilds them"
        run: "./scripts/test-testbox-run-mtimes.sh"
      - name: "Worktree scripts refresh shared primaries concurrently (cx-95l)"
        run: "./tests/test_worktree_refresh_concurrency.sh"
      - name: "Shared blobless clone starts no auto repack and compacts offline"
        run: "./tests/test_shared_clone_git_limits.sh"
      - name: "Shared clone maintenance LaunchAgent runs the compaction daily"
        run: "./tests/test_shared_clone_maintenance_launchagent.sh"
      - name: "Dev build links open in a background cmux tab, not the default browser"
        run: "./tests/test_open_dev_build.sh"
      - name: "Agents cannot launch a dev build over the user's focus"
        run: "./tests/test_tag_url_guard_hook.sh"
      - name: "Validate nx-remote path scope classifier"
        run: "python3 tests/test_skills_test_scope.py"
      - name: "Sync paths never copy credentials or scratch files"
        run: "for branch in main feat-cmux-next; do"
      - name: "cbx-mac never maps the off-limits AWS hosts"
        run: "python3 scripts/test-cbx-mac-hosts.py"
      - name: "Local dev pulls and keeps development Vercel env only"
        run: "python3 scripts/test-vercel-dev-env-guard.py"
      - name: "cmux.com production only moves forward (vercel guard, prod-env-apply)"
        run: "python3 scripts/test-vercel-prod-guard.py"
      - name: "Validate the cmux-cua build skill source wiring"
        run: "./tests/test_cmux_cua_build_skill.sh"
      - name: "The nightly skill dispatches nightly-next-tick.yml for the NEXT nightly and nightly.yml for main's"
        run: "./tests/test_run_nightly_fast_default.sh"
      - name: "Validate the Cloud Chief units"
        run: "python3 tools/cloud-chief/boot_units_test.py"
      - name: "Validate the previews tool"
        run: "python3 -m unittest discover -s tools/previews -p 'test_*.py'"
      - name: "new-cmux-worktree.sh derives submodules from the base commit"
        run: "./scripts/test-new-cmux-worktree-submodule-sharing.sh"
      - name: "Validate private platform worktree and backend wiring"
        run: "./tests/test-new-platform-worktree.sh"
