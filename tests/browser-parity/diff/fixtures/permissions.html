<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="icon" href="data:,"><title>Permissions</title></head><body><h1>Permissions</h1>
<button id="geo">Geolocation</button><p id="out-geo">idle</p>
<button id="notify">Notifications</button><p id="out-notify">idle</p>
<button id="camera">Camera</button><p id="out-camera">idle</p>
<button id="clip">Clipboard read</button><p id="out-clip">idle</p>
<script>
const put = (k, v) => (document.getElementById("out-" + k).textContent = v);
geo.onclick = () => { put("geo", "pending"); navigator.geolocation.getCurrentPosition(() => put("geo", "granted"), (e) => put("geo", "error " + e.code), { timeout: 3000 }); };
notify.onclick = async () => { put("notify", "pending"); try { put("notify", "result " + (typeof Notification === "undefined" ? "unsupported" : await Notification.requestPermission())); } catch (e) { put("notify", "error " + e.name); } };
camera.onclick = async () => { put("camera", "pending"); try { const s = await navigator.mediaDevices.getUserMedia({ video: true }); s.getTracks().forEach((t) => t.stop()); put("camera", "granted"); } catch (e) { put("camera", "error " + e.name); } };
clip.onclick = async () => { put("clip", "pending"); try { await navigator.clipboard.readText(); put("clip", "granted"); } catch (e) { put("clip", "error " + e.name); } };
</script></body></html>
