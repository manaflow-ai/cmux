<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="icon" href="data:,"><title>Diff files</title><script src="/diff/log.js"></script></head><body>
<h1>Files</h1>
<label for="file">Single file</label><input id="file" type="file">
<label for="multi">Many files</label><input id="multi" type="file" multiple>
<label for="text-only">Text only</label><input id="text-only" type="file" accept=".txt,text/plain">
<button id="pick" onclick="document.getElementById('hidden-file').click()">Choose via button</button><input id="hidden-file" type="file" hidden>
<div id="dropzone" style="width:200px;height:60px;border:2px dashed">Drop files here</div>
<p id="result">none</p>
<a id="dl-cd" href="/download/cd?n=a">Download attachment</a>
<a id="dl-blob" href="#" onclick="event.preventDefault();const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['blob body\n'],{type:'text/plain'}));a.download='blob.txt';document.body.append(a);a.click();a.remove()">Download blob</a>
<a id="dl-data" href="data:text/plain;charset=utf-8,data%20body%0A" download="data.txt">Download data URL</a>
<form id="post-form" method="POST" action="/download/post"><input name="q" value="posted"><button id="dl-post">Download via POST</button></form>
<button id="dl-two" onclick="for(const n of ['x','y']){const a=document.createElement('a');a.href='/download/slow?ms=600&n='+n;a.download='';document.body.append(a);a.click();a.remove()}">Two downloads</button>
<script>
const show = async (id, files) => { const texts = await Promise.all([...files].map((f) => f.text())); document.getElementById("result").textContent = id + ": " + [...files].map((f, i) => f.name + "(" + texts[i].trim() + ")").join(","); };
for (const id of ["file", "multi", "text-only", "hidden-file"]) document.getElementById(id).addEventListener("change", (e) => show(id, e.target.files));
const dz = document.getElementById("dropzone");
dz.addEventListener("dragover", (e) => e.preventDefault());
dz.addEventListener("drop", (e) => { e.preventDefault(); __log("drop", "dropzone", e.isTrusted, [...e.dataTransfer.types]); show("dropzone", e.dataTransfer.files); });
</script></body></html>
