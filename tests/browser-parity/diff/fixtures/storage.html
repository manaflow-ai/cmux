<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="icon" href="data:,"><title>Storage</title></head><body><h1>Storage</h1><button id="set" onclick="localStorage.setItem('ls','L'); sessionStorage.setItem('ss','S'); read()">Set</button><button id="read" onclick="read()">Read</button><p id="out"></p>
<script>function read() { document.getElementById("out").textContent = "ls=" + localStorage.getItem("ls") + " ss=" + sessionStorage.getItem("ss") + " cookie=" + document.cookie.split("; ").filter(Boolean).map((c) => c.split("=")[0]).sort().join(","); } read();</script></body></html>
