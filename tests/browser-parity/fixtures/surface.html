<!doctype html><html><head><title>Surface Fixture</title><script src="/log.js"></script></head><body>
<h1>Surface</h1>
<input id="ph" placeholder="Search here">
<button data-testid="counter" id="counter" onclick="this.dataset.n=(+this.dataset.n||0)+1;this.textContent='Count '+this.dataset.n">Count 0</button>
<label><input type="checkbox" id="cb"> Check me</label>
<input id="text" aria-label="Text field" value="start">
<p id="events"></p>
<button id="late-btn" hidden>Late</button>
<button id="off" disabled>Off</button>
<details><summary>More</summary><p>Details body</p></details>
<div id="pad" style="width:200px;height:100px;border:1px solid" onmousedown="this.dataset.down=1" onmouseup="this.dataset.up=1" ondblclick="this.textContent='pad dbl'"></div>
<div id="drag" draggable="true" style="width:60px;height:30px;background:#ccc">Drag</div><div id="drop" style="width:120px;height:60px;border:1px solid">Drop zone</div>
<iframe id="outer" title="Outer" width="400" height="200" srcdoc="<p>Outer</p><iframe id=inner title=Inner width=300 height=120 srcdoc='<label>Inner label <input placeholder=Inner-ph data-testid=inner-tid></label><p>Inner text</p>'></iframe>"></iframe>
<div id="far" style="margin-top:1500px">Far text</div>
<script>
const text = document.getElementById("text");
text.addEventListener("focus", () => document.getElementById("events").textContent += "focus;");
text.addEventListener("blur", () => document.getElementById("events").textContent += "blur;");
setTimeout(() => document.getElementById("late-btn").hidden = false, 300);
const drop = document.getElementById("drop");
document.getElementById("drag").addEventListener("dragstart", (e) => e.dataTransfer.setData("text/plain", "mouse"));
drop.addEventListener("dragover", (e) => e.preventDefault());
drop.addEventListener("drop", (e) => { e.preventDefault(); drop.textContent = "Dropped " + e.dataTransfer.getData("text/plain"); });
</script></body></html>
