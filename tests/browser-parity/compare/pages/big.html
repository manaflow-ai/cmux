<!doctype html><html><head><title>Big form</title></head><body>
<!-- A larger page for the change-reporting scenario: one field and one
     checkbox change among ~300 unchanged elements. -->
<header><nav aria-label="Sections" id="nav"></nav></header>
<main><h1>Account settings</h1>
<form id="f"><label>Email <input id="email" type="email" placeholder="you@x.com"></label>
<label><input id="tos" type="checkbox"> Accept terms</label>
<button type="submit">Save</button></form>
<table aria-label="Invoices"><thead><tr><th>Invoice</th><th>Date</th><th>Amount</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table>
</main>
<script>
const nav = document.getElementById("nav");
for (let i = 1; i <= 40; i++) nav.insertAdjacentHTML("beforeend", `<a href="/section/${i}">Section ${i}</a> `);
const rows = document.getElementById("rows");
for (let i = 1; i <= 60; i++) rows.insertAdjacentHTML("beforeend", `<tr><td>INV-${1000 + i}</td><td>2026-0${1 + (i % 9)}-1${i % 10}</td><td>$${(i * 37) % 500}.00</td><td><a href="/invoice/${i}">Download</a> <button>Dispute</button></td></tr>`);
document.getElementById("f").onsubmit = (e) => e.preventDefault();
</script></body></html>
