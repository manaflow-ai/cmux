# cmux Computer Use as an AgentEnv computer driver (README.md).
type = "computer_driver"
module = "driver.py:CmuxDriver"
port = 18765

# Linux (X11, amd64): the cmux binary staged beside this file as bin/cmux-tui.gz (overlay.py puts it there) is
# unpacked by install.sh and checked against driver.py's EXECUTABLES; the daemon service starts the cmux daemon with
# CMUX_CU_HEADLESS=0 once X answers, and the driver serves the computer/v1 operations (X11Driver) and cmux's tools.
[install.linux]
python = "requirements.txt"
run = [{ script = "install.sh" }]
services = [
    { name = "daemon", command = "venv/bin/python driver.py" },
    { name = "driver", command = "venv/bin/python -m agentenv_protocol.computer.serve driver.py:CmuxDriver" },
]

# macOS (arm64), laid out but unverified: install-macos.sh puts the cmux CLI in /usr/local/bin and the signed
# cmux Remote (dev).app in /Applications from the files overlay.py stages (bin/cmux-macos.tar.gz); cmux Remote holds
# the TCC grants and runs the Computer Use worker, and the daemon runs as a direct LaunchAgent of the CLI.
[install.macos]
python = "requirements-macos.txt"
run = [{ script = "install-macos.sh", scope = "session" }]
grants = [
    { app = "/Applications/cmux Remote (dev).app", services = ["accessibility", "post_event", "screen_capture"] },
]
services = [
    { name = "daemon", command = "/usr/local/bin/cmux daemon start", direct = true, environment = { CMUX_CU_HEADLESS = "0" } },
    { name = "driver", command = "venv/bin/python -m agentenv_protocol.computer.serve driver.py:CmuxDriver" },
]
