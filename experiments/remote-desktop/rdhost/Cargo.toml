[package]
name = "rdhost"
version = "0.1.0"
edition = "2021"
publish = false
description = "Measurement prototype for the remote desktop lane: X11 host agent, test app, and Linux test client (rdproto/0)."

# Own workspace: never part of any other Cargo workspace in this repo.
[workspace]

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
x11rb = { version = "0.14", features = ["shm", "damage", "xtest"] }
openh264 = { version = "0.9", default-features = false, features = ["source"] }
openh264-sys2 = { version = "0.9", default-features = false, features = ["source"] }

[build-dependencies]
cc = "1"

[features]
# Optional x264 encoder (links the system libx264.a statically; GPL, measurement only).
x264 = []

[profile.release]
opt-level = 3
debug = 1
codegen-units = 4
lto = "thin"
