<!doctype html>
<!-- The markdown editor of the shared page host: cmux-page://cmux.markdown/ serves this file from
     the webviews-app build (PageDescriptor.entry). No CSP meta: the scheme handler's header is the
     page's only policy. The page asks the host for its file (src/pages/markdown/host.ts). -->
<html lang="en" data-cmux-page="markdown" data-cmux-webview-kind="markdown">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Markdown</title>
    <script type="module" crossorigin src="./chunks/markdown-page.mjs"></script>
    <link rel="stylesheet" crossorigin href="./assets/markdown-page.css">
  </head>
  <body>
    <main id="root"></main>
  </body>
</html>
