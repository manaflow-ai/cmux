<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- AgentCursorPointerView's exact Sky path, gradient, and direction on the
       dark Icon Composer plate used by the helper fallback. -->
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#313131"/>
      <stop offset="1" stop-color="#141414"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="cur" x1="0.68" y1="0.68" x2="11" y2="11" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#12c7f5"/>
      <stop offset="0.59" stop-color="#2d8cff"/>
      <stop offset="1" stop-color="#6c5cff"/>
    </linearGradient>
  </defs>
  <!-- Icon Composer owns this plate and rim in the .icon source. These
       vectors document the same dark fallback used by the legacy helper. -->
  <rect width="1024" height="1024" rx="224" fill="url(#plate)"/>
  <rect width="1024" height="1024" rx="224" fill="none" stroke="url(#rim)" stroke-width="28"/>
  <!-- The values below are the approved SolidJS logo-lab draft. Scaling is
       centered on the source bounds before translation. -->
  <g transform="translate(257.8472 257.8472) translate(266.7589 266.7589) rotate(0) scale(45.79 45.79) translate(-5.8257 -5.8257)">
    <path
      d="M0.68 1.83 L3.63 9.78 Q4.67 12.59 5.3 9.66 L5.44 9.01 Q6.08 6.08 9.01 5.44 L9.66 5.3 Q12.59 4.67 9.78 3.63 L1.83 0.68 Q0 0 0.68 1.83 Z"
      fill="url(#cur)"
      stroke="url(#cur)"
      stroke-width="0.72068137"
      stroke-linecap="round"
      stroke-linejoin="round"
      paint-order="stroke fill"/>
  </g>
</svg>
