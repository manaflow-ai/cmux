<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- AgentCursorPointerView's exact Sky path, gradient, and direction on the
       same measured rounded tile used by the runtime helper icon. -->
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#313131"/>
      <stop offset="1" stop-color="#141414"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="cur" x1="0.68" y1="0.68" x2="11" y2="11" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#12c7f5"/>
      <stop offset="0.5" stop-color="#2d8cff"/>
      <stop offset="1" stop-color="#6c5cff"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="224" fill="url(#plate)"/>
  <rect x="7" y="7" width="1010" height="1010" rx="217" fill="none" stroke="url(#rim)" stroke-width="14"/>
  <!-- Center the kite's measured bounding box, not its asymmetric ink mass. -->
  <g transform="translate(251.0085 251.0085) scale(44.8)">
    <path
      d="M0.68 1.83 L3.63 9.78 Q4.67 12.59 5.3 9.66 L5.44 9.01 Q6.08 6.08 9.01 5.44 L9.66 5.3 Q12.59 4.67 9.78 3.63 L1.83 0.68 Q0 0 0.68 1.83 Z"
      fill="url(#cur)"/>
  </g>
</svg>
