<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- AgentCursorPointerView's exact Sky path, gradient, direction, and
       outside-only white outline on an opaque white canvas. -->
  <defs>
    <linearGradient id="cur" x1="0.68" y1="0.68" x2="11" y2="11" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#12c7f5"/>
      <stop offset="0.5" stop-color="#2d8cff"/>
      <stop offset="1" stop-color="#6c5cff"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="#FFFFFF"/>
  <g transform="translate(138.8 138.8) scale(64)">
    <!-- A one-pixel-at-menu-size neutral rim supplies the contrast that the
         live cursor normally gets from the app beneath its white outline. -->
    <path
      d="M0.68 1.83 L3.63 9.78 Q4.67 12.59 5.3 9.66 L5.44 9.01 Q6.08 6.08 9.01 5.44 L9.66 5.3 Q12.59 4.67 9.78 3.63 L1.83 0.68 Q0 0 0.68 1.83 Z"
      fill="none" stroke="#5A6370" stroke-opacity="0.45" stroke-width="2.2"
      stroke-linejoin="round"/>
    <path
      d="M0.68 1.83 L3.63 9.78 Q4.67 12.59 5.3 9.66 L5.44 9.01 Q6.08 6.08 9.01 5.44 L9.66 5.3 Q12.59 4.67 9.78 3.63 L1.83 0.68 Q0 0 0.68 1.83 Z"
      fill="url(#cur)" stroke="#FFFFFF" stroke-width="1.7" stroke-linejoin="round"
      paint-order="stroke fill"/>
  </g>
</svg>
