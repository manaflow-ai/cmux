# The switch for Swift PGO in cmux-next Release builds (plans/cmux-next/chrome-parity/p08-startup.md, section F,
# task 052), committed next to the profile pin cmux-next.profdata.sha256, as Chrome commits
# chrome/build/mac-arm.pgo.txt. scripts/cmux-next/pgo/release-env.sh reads it for check-release-compile.sh and for
# the Nightly's Release build (scripts/ci/run-with-helper-prebuild.py), so turning PGO on is a reviewed
# risk:high commit and no .github change.
#
#   use=1         fetch the pinned profile and give the CmuxNext Swift targets -profile-use; 0 or absent: off
#   companions=   task 110's adopted variants, comma-separated: thinlto, cmo (startup-DESIGN.md section 10);
#                 they ship only with the profile
#
# CMUX_NEXT_PGO_USE and CMUX_PGO_COMPANIONS in the environment override these for one build (an A/B).
use=0
companions=
