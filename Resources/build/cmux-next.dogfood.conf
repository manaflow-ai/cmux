# The dogfood tags whose `scripts/reload.sh --release` builds the bench configuration (first-seconds-lag.md, step 4,
# 2026-10-27): Release optimization (-O, whole module, no debug dylib, no previews, no DEBUG) plus CMUX_BENCH_HOOKS, so
# an optimized dogfood app keeps the debug.* socket commands and the debug.input latency sections the dogfood gate,
# the journeys and the benches drive. The fleet's `cmux-ci build cmux --release` passes only --release to reload.sh, so
# the tags live here, in the checkout the fleet builds. `--config release` is the plain Release build for any tag.
#
#   release_bench_tags=   space-separated shell globs matched against --tag; empty: every --release is plain Release
#
# A bench build never ships: reload.sh checks its marker (check-no-bench-hooks.sh --expect), and the release and
# nightly pipelines refuse an app that has it.
release_bench_tags=chrome-parity-*
