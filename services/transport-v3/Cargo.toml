[workspace]
members = ["crates/grants", "crates/authority", "crates/transport"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
anyhow = "1"
cedar-policy = { version = "4.12", default-features = false }
ed25519-dalek = { version = "2.2", features = ["pkcs8", "rand_core"] }
futures = "0.3"
jsonwebtoken = "9.3"
libp2p = { version = "0.56", default-features = false, features = ["tokio", "quic", "tcp", "dns", "websocket", "noise", "yamux", "relay", "dcutr", "identify", "ping", "macros", "request-response", "json", "ed25519"] }
libp2p-identity = { version = "0.2", features = ["ed25519", "peerid", "rand"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
