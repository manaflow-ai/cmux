[workspace]
members = ["crates/grants", "crates/authority", "crates/transport", "crates/relay-server", "crates/control-server", "crates/ffi"]
resolver = "2"

# The UniFFI boundary never permits Rust unwinding into Swift or C. The final
# application link still requires removal of legacy native Rust runtimes.
[profile.release]
panic = "abort"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
anyhow = "1"
bytes = "1"
axum = "0.8"
base64 = "0.22"
cedar-policy = { version = "4.12", default-features = false }
clap = { version = "4", features = ["derive", "env"] }
ed25519-dalek = { version = "2.2", features = ["pkcs8", "rand_core"] }
futures = "0.3"
hex = "0.4"
jsonwebtoken = "9.3"
libp2p = { git = "https://github.com/manaflow-ai/rust-libp2p", rev = "a996f703a7586a72398ea58dcdd535acc5ae858e", default-features = false, features = ["tokio", "quic", "tcp", "dns", "websocket", "noise", "yamux", "relay", "dcutr", "identify", "ping", "macros", "request-response", "json", "ed25519"] }
libp2p-identity = { version = "0.2", features = ["ed25519", "peerid", "rand"] }
multiaddr = "0.18"
libp2p-stream = { git = "https://github.com/manaflow-ai/rust-libp2p", rev = "a996f703a7586a72398ea58dcdd535acc5ae858e" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
tokio-util = { version = "0.7", features = ["codec", "compat", "rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
prometheus-client = "0.23"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "json", "uuid", "migrate", "macros"] }
