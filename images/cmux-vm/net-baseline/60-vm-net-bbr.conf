# the Cloud VM image (web/scripts/cmux-vm-image/net-baseline.ts; fleet VMs: leo-workspace tools/vm_net_baseline.py), only where the kernel has tcp_bbr: BBR as the default congestion control.
# Cubic halves its window at each loss, so a path that drops a few percent of segments stays slow; BBR paces to the
# measured bottleneck rate instead. Remove this file and vm-net-bbr.conf in modules-load.d to go back to cubic.
net.ipv4.tcp_congestion_control = bbr
