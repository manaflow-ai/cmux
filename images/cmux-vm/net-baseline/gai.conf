# /etc/gai.conf from the Cloud VM image (web/scripts/cmux-vm-image/net-baseline.ts; fleet VMs: leo-workspace tools/vm_net_baseline.py), baked unconditionally here: the image keeps
# public IPv6 routed on purpose (ipv6-route.ts, RFD 0067 item 5), since on a Freestyle VM IPv6 is the fast family.
#
# Why: glibc's default RFC 6724 labels give fc00::/7 label 6 and ::/0 label 1, so where rule 2 (scope) does not
# already decide it, a ULA source fails rule 5 against a public AAAA and IPv4 sorts first. Measured 2026-11-23 in a
# netns with a 10.x IPv4 and a ULA IPv6 source: a glibc lookup answered A first without this file and AAAA first
# with it. On three Freestyle lane VMs glibc already answered AAAA first; there this file changes nothing. Giving
# fc00::/7 the label of ::/0 makes rule 5 match for IPv6 too, and rule 6 (precedence ::/0 40 over ::ffff:0:0/96 10)
# then puts IPv6 first. musl (acpmux is a static musl binary) never reads this file; acpmux orders IPv6 first itself.
#
# Any `label` line replaces glibc's whole default label table, so the table is written out in full; precedence is
# glibc's default, written out for the reader.
label ::1/128 0
label ::/0 1
label 2002::/16 2
label ::/96 3
label ::ffff:0:0/96 4
label fec0::/10 5
label fc00::/7 1
label 2001:0::/32 7
precedence ::1/128 50
precedence ::/0 40
precedence 2002::/16 30
precedence ::/96 20
precedence ::ffff:0:0/96 10
