# cmux-next-ios app project. Generate with `xcodegen generate` in cmux-next-ios/.
# The project file is generated and not checked in.
name: CmuxMobileApp
configs:
  Debug: debug
  Release: release
  # Demo: optimized like Release, with the DEBUG developer surface
  # (dev sign-in, Settings → Developer, scripted demos). Built by
  # scripts/demo-build.sh for hand-installed demo builds; never uploaded.
  Demo: release
  # Production: a real production build for verification. Release
  # optimization (-O), no DEBUG (no dev sign-in, no Settings → Developer, no
  # mock data or demo drivers compiled in), the production Stack project, its
  # own bundle id (dev.cmux.mobile.prod) and keychain group so it installs beside
  # the Demo build. Built by scripts/demo-build.sh --config Production.
  Production: release
  # TestFlight: the shipping build for App Store Connect app "cmux INTERNAL"
  # (bundle dev.cmux.app.internal, ASC app id 6791408425). Everything
  # Production has (no DEBUG, production Stack project) plus the production
  # Worker, App Store distribution signing, push (production APNs) and Sign in
  # with Apple. Built only by scripts/testflight-build.sh. See
  # verify/testflight-readiness.md.
  TestFlight: release
  # TestFlightStaging: the TestFlight build (same app record, bundle, signing,
  # push and Sign in with Apple) pointed at staging: the development Stack
  # project, the dev cmux-mobile-api Worker and the staging Cloud service
  # (cloud-api-staging, where Cloud Chief brains are on). Built only by
  # `scripts/testflight-build.sh --config TestFlightStaging`; production
  # (TestFlight) stays the default.
  TestFlightStaging: release
options:
  bundleIdPrefix: dev.cmux.mobile
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    CMUX_MOBILE_TAG: ""
    CMUX_MOBILE_SOURCE_COMMIT: ""
    CMUX_MOBILE_DISPLAY_NAME: cmux
    # The cmux-mobile-api base URL baked into Info.plist (CmuxMobileAPIBase). DEBUG
    # builds fall back to the dev Worker when it is empty; a non-DEBUG build
    # with no value has no live data, so every shipping config sets it.
    CMUX_MOBILE_API_BASE: ""
    # The production Worker (backend/wrangler.jsonc env "prod"). Shipping
    # configs (Release, TestFlight) use it. scripts/testflight-build.sh checks
    # its /v1/health before archiving; override with CMUX_MOBILE_PROD_API_BASE=... when
    # the Worker moves to a custom domain.
    CMUX_MOBILE_PROD_API_BASE: https:/$()/mobile-api.cmux.dev
    # The Cloud service (backend/apps/api, CmuxMobileCloudAPIBase) where the user's
    # Cloud Chief lives. Its Stack project must match the build's sign-in:
    # production for shipping configs, staging (the development Stack
    # project) for Debug and Demo, which sign in to the development project.
    CMUX_MOBILE_PROD_CLOUD_API_BASE: https:/$()/cloud-api.cmux.dev
    CMUX_MOBILE_STAGING_CLOUD_API_BASE: https:/$()/cloud-api-staging.cmux.dev
    CMUX_MOBILE_CLOUD_API_BASE: $(CMUX_MOBILE_STAGING_CLOUD_API_BASE)
    # The dev cmux-mobile-api Worker (backend/wrangler.jsonc env "dev"; accepts the
    # development and production Stack projects).
    CMUX_MOBILE_STAGING_API_BASE: https:/$()/cmux-mobile-api-dev.debussy.workers.dev
    # The Stack project of a non-DEBUG build (CmuxMobileStackEnvironment): empty is
    # production; "development" is the development project (staging).
    CMUX_MOBILE_STACK_ENVIRONMENT: ""
    # User-facing version. Must stay at or above the highest version ever
    # uploaded to cmux INTERNAL (TestFlight orders builds by it first);
    # testflight-build.sh checks this against App Store Connect. The build
    # number (CURRENT_PROJECT_VERSION) is stamped per upload by that script.
    MARKETING_VERSION: 1.2.0
    # The app's bundle id; the notification extensions are `<it>.notification-content`
    # (and, with the encrypted fallback, `.notification-service`), and the App Group
    # both share is `group.<it>` (verify/rich-push.md "Extensions and signing").
    CMUX_MOBILE_APP_BUNDLE_ID: dev.cmux.mobile$(CMUX_MOBILE_TAG)
    # Whether this build is signed with the App Group (`group.<app bundle id>`):
    # the outbox and chat snapshots the notification content extension shares
    # with the app. Simulator builds always are (no profile needed). Device
    # builds are not until the group exists in the developer portal and the
    # profiles include it: the team wildcard profile hand-installed builds use
    # cannot carry an App Group, and adding the capability to
    # dev.cmux.app.internal invalidates its distribution profiles. Pass
    # CMUX_MOBILE_APP_GROUP=YES once they do. Without it the extension still
    # shows the notification and its buttons; its composer and option rows open
    # the app instead of handing over what was typed.
    CMUX_MOBILE_APP_GROUP: "NO"
    "CMUX_MOBILE_APP_GROUP[sdk=iphonesimulator*]": "YES"
    # Info.plist `CmuxMobileAppGroup`: the group only in a build signed with it,
    # so a build without it never asks containermanagerd for one (the app also
    # checks its own signed entitlements, PushAppGroup.swift).
    CMUX_MOBILE_APP_GROUP_ID_YES: group.$(CMUX_MOBILE_APP_BUNDLE_ID)
    CMUX_MOBILE_APP_GROUP_ID_NO: ""
    # App Store profiles (by name) the TestFlight configurations sign with;
    # testflight-build.sh passes the downloaded profiles' UUIDs instead.
    CMUX_MOBILE_APP_PROFILE: cmux Internal Distribution
    CMUX_MOBILE_CONTENT_EXTENSION_PROFILE: cmux Internal Distribution Notification Content
    CMUX_MOBILE_SERVICE_EXTENSION_PROFILE: cmux Internal Distribution Notification Service
    # The keychain group the app shares with its notification service
    # extension: the push key and the Macs' trust record (verify/notifications-trust.md).
    CMUX_MOBILE_KEYCHAIN_GROUP: $(DEVELOPMENT_TEAM).$(CMUX_MOBILE_APP_BUNDLE_ID).push
    CURRENT_PROJECT_VERSION: "1"
  configs:
    Release:
      # Release (the `xcodebuild archive` default) is a production build too.
      CMUX_MOBILE_API_BASE: https:/$()/mobile-api.cmux.dev
      CMUX_MOBILE_CLOUD_API_BASE: $(CMUX_MOBILE_PROD_CLOUD_API_BASE)
    Demo:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG CMUX_MOBILE_DEMO
      SWIFT_OPTIMIZATION_LEVEL: -O
    Production:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: CMUX_MOBILE_PRODUCTION
      SWIFT_OPTIMIZATION_LEVEL: -O
      CMUX_MOBILE_TAG: .prod
      CMUX_MOBILE_DISPLAY_NAME: cmux mobile
      # The production Worker (cmux-mobile-api-prod; production Stack project only).
      CMUX_MOBILE_API_BASE: https:/$()/mobile-api.cmux.dev
      CMUX_MOBILE_CLOUD_API_BASE: $(CMUX_MOBILE_PROD_CLOUD_API_BASE)
    Release:
      # A non-DEBUG build with no service address signs in to an empty app.
      CMUX_MOBILE_API_BASE: $(CMUX_MOBILE_PROD_API_BASE)
      CMUX_MOBILE_CLOUD_API_BASE: $(CMUX_MOBILE_PROD_CLOUD_API_BASE)
    TestFlight:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: CMUX_MOBILE_PRODUCTION CMUX_MOBILE_TESTFLIGHT
      SWIFT_OPTIMIZATION_LEVEL: -O
      CMUX_MOBILE_TAG: ""
      CMUX_MOBILE_APP_BUNDLE_ID: dev.cmux.app.internal
      # The App Store Connect record's name.
      CMUX_MOBILE_DISPLAY_NAME: cmux INTERNAL
      CMUX_MOBILE_API_BASE: $(CMUX_MOBILE_PROD_API_BASE)
      CMUX_MOBILE_CLOUD_API_BASE: $(CMUX_MOBILE_PROD_CLOUD_API_BASE)
    TestFlightStaging:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: CMUX_MOBILE_PRODUCTION CMUX_MOBILE_TESTFLIGHT
      SWIFT_OPTIMIZATION_LEVEL: -O
      CMUX_MOBILE_TAG: ""
      CMUX_MOBILE_APP_BUNDLE_ID: dev.cmux.app.internal
      CMUX_MOBILE_DISPLAY_NAME: cmux INTERNAL
      CMUX_MOBILE_API_BASE: $(CMUX_MOBILE_STAGING_API_BASE)
      CMUX_MOBILE_CLOUD_API_BASE: $(CMUX_MOBILE_STAGING_CLOUD_API_BASE)
      CMUX_MOBILE_STACK_ENVIRONMENT: development
packages:
  CmuxMobileKit:
    path: CmuxMobileKit
  CmuxChiefVoiceCore:
    path: ../Packages/Shared/CmuxChiefVoiceCore
  CmuxConversation:
    path: ../Packages/iOS/CmuxConversation
targets:
  CmuxMobileApp:
    type: application
    platform: iOS
    sources:
      - App
      - path: ../AppIcon.icon
        buildPhase: resources
    dependencies:
      - package: CmuxMobileKit
        product: CmuxMobileShell
      - package: CmuxMobileKit
        product: CmuxMobileAuth
      - package: CmuxMobileKit
        product: CmuxMobileModel
      - package: CmuxMobileKit
        product: CmuxMobileTerminal
      - package: CmuxMobileKit
        product: CmuxMobileVoice
      - package: CmuxMobileKit
        product: CmuxMobileChief
      - package: CmuxChiefVoiceCore
      # Long-press view of every cmux notification (verify/rich-push.md).
      - target: CmuxMobileNotificationContent
      # Opens sealed pushes (verify/notifications-trust.md).
      - target: CmuxMobileNotificationService
    # UI tests run with `xcodebuild test -scheme CmuxMobileApp` on one simulator (verify/parity/pq_tabs.py).
    scheme:
      testTargets:
        - CmuxMobileAppUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(CMUX_MOBILE_APP_BUNDLE_ID)
        PRODUCT_NAME: CmuxMobileApp
        # Entitlements by App Group choice (CMUX_MOBILE_APP_GROUP above).
        CMUX_MOBILE_ENTITLEMENTS_NO: App/CmuxMobileApp-Keychain.entitlements
        CMUX_MOBILE_ENTITLEMENTS_YES: App/CmuxMobileApp-Group.entitlements
        CODE_SIGN_ENTITLEMENTS: $(CMUX_MOBILE_ENTITLEMENTS_$(CMUX_MOBILE_APP_GROUP))
        # Simulator builds also claim cmux's universal links (associated domains). Device
        # builds do not until the App IDs have the Associated Domains capability and
        # their profiles include it: the team wildcard profile cannot carry it, and
        # dev.cmux.app.internal does not have it yet (verify/deep-links.md).
        "CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]": App/CmuxMobileApp-Simulator.entitlements
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        # App/Info.plist (generated by xcodegen from `info:` below) is the
        # whole Info.plist: Xcode's generated one would replace CFBundleName
        # with PRODUCT_NAME ("CmuxMobileApp"), which system prompts show.
        GENERATE_INFOPLIST_FILE: NO
        DEVELOPMENT_TEAM: 7WLXT3NR37
        CODE_SIGN_STYLE: Automatic
        # Only TestFlight builds carry aps-environment: the APNs key is scoped
        # to dev.cmux.app.internal, and hand-installed builds are signed with
        # the team wildcard profile, which cannot include push.
        CMUX_MOBILE_PUSH: "NO"
        # Only TestFlight builds carry the Sign in with Apple entitlement; the
        # welcome hides "Continue with Apple" everywhere else (it could only fail).
        CMUX_MOBILE_APPLE_SIGN_IN: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
      configs:
        Production:
          # Its own keychain access group ($(AppIdentifierPrefix)dev.cmux.mobile.prod):
          # Stack tokens never mix with the Demo or Debug installs. No app group:
          # the app shares no container with anything.
          CMUX_MOBILE_ENTITLEMENTS_NO: App/CmuxMobileApp-Production.entitlements
          CMUX_MOBILE_ENTITLEMENTS_YES: App/CmuxMobileApp-Production-Group.entitlements
        TestFlight:
          # Push (production APNs), Sign in with Apple, and its own keychain
          # group. The "cmux Internal Distribution" App Store profile
          # authorizes each key; testflight-build.sh signs manually with it.
          CMUX_MOBILE_ENTITLEMENTS_NO: App/CmuxMobileApp-TestFlight.entitlements
          CMUX_MOBILE_ENTITLEMENTS_YES: App/CmuxMobileApp-TestFlight-Group.entitlements
          CMUX_MOBILE_PUSH: "YES"
          CMUX_MOBILE_APPLE_SIGN_IN: "YES"
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: $(CMUX_MOBILE_APP_PROFILE)
        TestFlightStaging:
          # Push (production APNs), Sign in with Apple, and its own keychain
          # group. The "cmux Internal Distribution" App Store profile
          # authorizes each key; testflight-build.sh signs manually with it.
          CMUX_MOBILE_ENTITLEMENTS_NO: App/CmuxMobileApp-TestFlight.entitlements
          CMUX_MOBILE_ENTITLEMENTS_YES: App/CmuxMobileApp-TestFlight-Group.entitlements
          CMUX_MOBILE_PUSH: "YES"
          CMUX_MOBILE_APPLE_SIGN_IN: "YES"
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: $(CMUX_MOBILE_APP_PROFILE)
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: $(CMUX_MOBILE_DISPLAY_NAME)
        # The name system prompts use ("cmux" Wants to Use … to Sign In),
        # in every configuration. The home screen shows CFBundleDisplayName,
        # which keeps side-by-side installs apart (demo-build.sh sets it).
        # PRODUCT_NAME stays CmuxMobileApp: the scripts look for CmuxMobileApp.app.
        CFBundleName: cmux
        # The languages the CmuxMobileKit string catalogs carry. Without them
        # the app declares only English and iOS picks English for every
        # package bundle on a non-English device.
        CFBundleLocalizations: [en, de, fr, ar, es, zh-Hant, zh-Hans, ko, ja]
        CFBundleAllowMixedLocalizations: true
        LSRequiresIPhoneOS: true
        CmuxMobileTag: $(CMUX_MOBILE_TAG)
        CmuxMobileAPIBase: $(CMUX_MOBILE_API_BASE)
        CmuxMobileCloudAPIBase: $(CMUX_MOBILE_CLOUD_API_BASE)
        CmuxMobileStackEnvironment: $(CMUX_MOBILE_STACK_ENVIRONMENT)
        # The commit an archive was built from (testflight-build.sh sets it;
        # --from-archive refuses an archive of another commit).
        CmuxMobileSourceCommit: $(CMUX_MOBILE_SOURCE_COMMIT)
        CmuxMobilePush: $(CMUX_MOBILE_PUSH)
        CmuxMobileAppleSignIn: $(CMUX_MOBILE_APPLE_SIGN_IN)
        # The App Group the notification content extension shares (when signed with it).
        CmuxMobileAppGroup: $(CMUX_MOBILE_APP_GROUP_ID_$(CMUX_MOBILE_APP_GROUP))
        CmuxMobileKeychainGroup: $(CMUX_MOBILE_KEYCHAIN_GROUP)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # A browser tab opened on the iPhone loads a Mac's `localhost:<port>` dev
        # server, forwarded over the link (SECURITY.md `localhost`), usually plain
        # http. Local hosts only: other http:// sites stay refused.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # WireGuard (boringtun), WebRTC (DTLS-SRTP) and rustls use standard
        # algorithms outside the OS. Lawrence 2026-10-15: standard algorithms
        # only, no proprietary crypto, not on the French App Store. App Store
        # Connect records exactly that answer as usesNonExemptEncryption=false
        # ("you can specify this in Info.plist"), offers no encryption
        # declaration for it, and refuses YES without a compliance code (90592).
        ITSAppUsesNonExemptEncryption: false
        # The Mac link dials the Mac's LAN address directly (WireGuard UDP,
        # WebRTC host candidates) before falling back to the relay.
        NSLocalNetworkUsageDescription: Connect directly to your Mac on this network for a faster, private link.
        NSCameraUsageDescription: Take a photo to attach to a message for your agent, or scan the pairing code on your Mac.
        # A Mac's pairing code (`cmux-next://pair?…`, MobileHostPairInvite): the Camera
        # opens it here. Every configuration registers it; side-by-side installs share the scheme.
        # cmux links (CmuxLink: `cmux://tab/tab_…`, `cmux://agent/claude/…`) in each Mac
        # build's scheme open what they name, from Safari, Messages, Notes or a QR code.
        # (`cmux-dev-<tag>` links of a tagged Mac open only when tapped inside the app.)
        CFBundleURLTypes:
          - CFBundleURLName: dev.cmux.mobile.pair
            CFBundleURLSchemes: [cmux-next]
          - CFBundleURLName: dev.cmux.mobile.link
            CFBundleURLSchemes: [cmux, cmux-nightly, cmux-rc, cmux-dev]
        NSPhotoLibraryAddUsageDescription: Save images from your sessions to Photos.
        NSPhotoLibraryUsageDescription: Attach photos to messages for Chief and your agents.
        NSMicrophoneUsageDescription: Talk to Chief on calls and record audio messages for Chief and your agents.
        NSSpeechRecognitionUsageDescription: Turn your voice notes for Chief into text on this device. Audio is not sent for recognition.
        # The Action Button Chief call keeps recording while the phone is locked.
        UIBackgroundModes: [audio]
        NSFaceIDUsageDescription: Approve agent actions and unlock cmux with Face ID.
        CADisableMinimumFrameDurationOnPhone: true
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchMark
          UIImageRespectsSafeAreaInsets: false
        # Portrait, but a shared Mac screen turns with the phone (CmuxMobileAppDelegate,
        # ScreenSharingOrientation): the delegate allows landscape only there.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
  # Notification Content Extension: the long-press view of every cmux
  # notification (verify/rich-push.md). Small on purpose: only
  # CmuxMobileNotifications, no chat, Markdown or WebKit modules, so it stays
  # far inside the extension memory budget.
  CmuxMobileNotificationContent:
    type: app-extension
    platform: iOS
    sources:
      - NotificationContent
    dependencies:
      - package: CmuxMobileKit
        product: CmuxMobileNotifications
      # The Messages bubble outline the app's chats draw (CoreGraphics only).
      - package: CmuxConversation
        product: CmuxConversationGeometry
      # iOS finds the extension's context class in UserNotificationsUI: without the
      # framework loaded the extension traps at launch (scripts/check-notification-extension.sh).
      - sdk: UserNotificationsUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(CMUX_MOBILE_APP_BUNDLE_ID).notification-content
        PRODUCT_NAME: CmuxMobileNotificationContent
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        DEVELOPMENT_TEAM: 7WLXT3NR37
        CODE_SIGN_STYLE: Automatic
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
        # The shared push keychain group always (sealed pushes open in the long look),
        # and the App Group when it is on.
        CMUX_MOBILE_ENTITLEMENTS_NO: NotificationContent/NotificationContent.entitlements
        CMUX_MOBILE_ENTITLEMENTS_YES: NotificationContent/NotificationContent-Group.entitlements
        CODE_SIGN_ENTITLEMENTS: $(CMUX_MOBILE_ENTITLEMENTS_$(CMUX_MOBILE_APP_GROUP))
      configs:
        TestFlight:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: $(CMUX_MOBILE_CONTENT_EXTENSION_PROFILE)
        TestFlightStaging:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: $(CMUX_MOBILE_CONTENT_EXTENSION_PROFILE)
    info:
      path: NotificationContent/Info.plist
      properties:
        CFBundleDisplayName: cmux
        CFBundleName: cmux
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CmuxMobileAppGroup: $(CMUX_MOBILE_APP_GROUP_ID_$(CMUX_MOBILE_APP_GROUP))
        CmuxMobileKeychainGroup: $(CMUX_MOBILE_KEYCHAIN_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.content-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationViewController
          NSExtensionAttributes:
            UNNotificationExtensionCategory:
              - CMUX_MOBILE_QUESTION
              - CMUX_MOBILE_QUESTION_FORM
              - CMUX_MOBILE_PERMISSION
              - CMUX_MOBILE_COMPLETED
              - CMUX_MOBILE_FAILED
              - CMUX_MOBILE_CHIEF
              - CMUX_MOBILE_TERMINAL
            UNNotificationExtensionDefaultContentHidden: true
            UNNotificationExtensionUserInteractionEnabled: true
            UNNotificationExtensionInitialContentSizeRatio: 1.2
  # Notification Service Extension: opens a sealed push (the Mac sealed it to
  # this phone's push key and signed it) and writes its banner, category and
  # payload. Only CmuxMobileNotifications (CryptoKit), no UI.
  CmuxMobileNotificationService:
    type: app-extension
    platform: iOS
    sources:
      - path: NotificationService
        excludes: ["*.entitlements"]
    dependencies:
      - package: CmuxMobileKit
        product: CmuxMobileNotifications
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(CMUX_MOBILE_APP_BUNDLE_ID).notification-service
        PRODUCT_NAME: CmuxMobileNotificationService
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        DEVELOPMENT_TEAM: 7WLXT3NR37
        CODE_SIGN_STYLE: Automatic
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
        CODE_SIGN_ENTITLEMENTS: NotificationService/NotificationService.entitlements
      configs:
        TestFlight:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: $(CMUX_MOBILE_SERVICE_EXTENSION_PROFILE)
        TestFlightStaging:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: $(CMUX_MOBILE_SERVICE_EXTENSION_PROFILE)
    info:
      path: NotificationService/Info.plist
      properties:
        CFBundleDisplayName: cmux
        CFBundleName: cmux
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CmuxMobileKeychainGroup: $(CMUX_MOBILE_KEYCHAIN_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
  # XCUITest: real touches on a simulator (a long press then a drag reorders grid cards,
  # which simulated HID drags could not do). Runs against mock data, or the paired Mac
  # when TEST_RUNNER_CMUX_MOBILE_UI_WORKSPACE names a live workspace.
  CmuxMobileAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: CmuxMobileApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.cmux.mobile.uitests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        TEST_TARGET_NAME: CmuxMobileApp
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: 7WLXT3NR37
        CODE_SIGN_STYLE: Automatic
