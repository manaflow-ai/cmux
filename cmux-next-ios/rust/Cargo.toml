[workspace]
resolver = "2"
members = ["crates/cmux-mobile-link", "crates/cmux-mobile-host", "crates/cmux-mobile-link-ffi"]

[workspace.package]
edition = "2024"
rust-version = "1.91"
license = "GPL-3.0-or-later"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
uninlined_format_args = "warn"
semicolon_if_nothing_returned = "warn"
redundant_clone = "warn"

[workspace.dependencies]
cmux-mobile-link = { path = "crates/cmux-mobile-link" }
cmux-wg = { path = "../../cmux-tui/crates/cmux-wg" }
cmux-transport = { path = "../../cmux-tui/crates/cmux-transport" }
# cmux.rd/1 + cmux.rb/1 (streamed browser tabs, verify/browser-stream.md).
cmux-rd-proto = { path = "../../cmux-tui/crates/cmux-rd-proto", features = ["serde"] }
cmux-rd-core = { path = "../../cmux-tui/crates/cmux-rd-core" }
cmux-rd-engine = { path = "../../cmux-tui/crates/cmux-rd-engine" }
cmux-rd-ffi = { path = "../../cmux-tui/crates/cmux-rd-ffi" }
anyhow = "1"
base64 = "0.22"
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
getrandom = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time", "fs", "signal"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
tokio-util = { version = "0.7", features = ["codec"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }
uuid = { version = "1", features = ["v4", "serde"] }
webrtc = "0.17"
x25519-dalek = { version = "2", features = ["static_secrets"] }
zeroize = "1"

[profile.release]
lto = "off"
