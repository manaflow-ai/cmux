[package]
name = "cmux-mobile-link"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "cmux-next-ios link: framed channel mux, signaling client, WebRTC and WireGuard dialers"

[lints]
workspace = true

[features]
# The in-process fake signaling server and test TURN server (tests here
# and in cmux-mobile-host).
testing = ["dep:rcgen"]

[dependencies]
aes-gcm = "0.10"
anyhow.workspace = true
async-trait = "0.1"
base64.workspace = true
bytes.workspace = true
cmux-braid-carrier.workspace = true
cmux-braid-class.workspace = true
cmux-braid-path.workspace = true
cmux-build-space.workspace = true
cmux-bundle.workspace = true
cmux-egress.workspace = true
cmux-rd-core.workspace = true
cmux-rd-proto.workspace = true
# The phone's viewport sync receiver (src/viewport.rs) renders its screens as VT bytes.
cmux-terminal-projection.workspace = true
cmux-remote-protocol.workspace = true
# The relay cache client (src/relay_cache.rs): opens sealed snapshots and deltas under a floor.
cmux-relay-snapshot.workspace = true
cmux-transport.workspace = true
cmux-wg.workspace = true
flate2.workspace = true
futures-util.workspace = true
getrandom.workspace = true
hkdf = "0.12"
# The mailbox seal and signature checks (src/mailbox_client), the same crates the host opens with.
p256 = { version = "0.13", features = ["ecdh", "ecdsa"] }
reqwest.workspace = true
rcgen = { version = "0.13", optional = true }
rustls.workspace = true
# The OS trust store for the link's own TLS (signaling, `/v1/ice`, TURN over TLS): the Apple
# Security framework on iOS and macOS, so a root an MDM profile installed (a company network that
# inspects TLS) is trusted like Safari trusts it (src/egress/tls.rs).
rustls-platform-verifier = "0.7"
serde.workspace = true
serde_json.workspace = true
# The local ad's key tag (local.rs); already in the graph.
sha2 = "0.10"
# Larger UDP socket buffers for the tunnel (a replay burst after a roam).
socket2 = { version = "0.6", features = ["all"] }
# if_nametoindex: the cellular interface a second socket is bound to.
libc.workspace = true
thiserror.workspace = true
tokio.workspace = true
# TURN over TLS (dial/turn.rs); ring only, like every other TLS here.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
tokio-tungstenite.workspace = true
tokio-util.workspace = true
tracing.workspace = true
url.workspace = true
uuid.workspace = true
webpki-roots = "1"
webrtc.workspace = true
x25519-dalek.workspace = true
zeroize.workspace = true

[target.'cfg(target_vendor = "apple")'.dependencies]
# The system's proxy settings (manual, PAC, WPAD, MDM) through CFNetwork (src/egress/apple.rs);
# already in the graph through rustls-platform-verifier.
core-foundation = "0.10"
core-foundation-sys = "0.8"

[dev-dependencies]
cmux-fault.workspace = true
# Seeded-secret tests (tests/seeded_secret.rs): gated clients send to a local capture server.
cmux-egress = { workspace = true, features = ["capture"] }
# The Mac's relay publisher for the pair matrix's `relay-cache` path (tests/pair_matrix_mac_asleep.rs). A
# dev-dependency cycle: cmux-mobile-host depends on this crate, which Cargo allows for tests.
cmux-mobile-host = { path = "../cmux-mobile-host" }
cmux-wire-lockstep.workspace = true
cmux-mobile-link = { path = ".", features = ["testing"] }
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber.workspace = true
