[package]
name = "cmux-mobile-host"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "cmux-next-ios Mac bridge: registers the Mac, answers WebRTC and WireGuard dials, serves link channels"

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
base64.workspace = true
bytes.workspace = true
cmux-build-space.workspace = true
# Silence bounds for a cloud prompt and a mailbox round trip (src/cloud_acp.rs, src/mailbox_apply.rs).
cmux-deadline.workspace = true
# The `bundle` service (src/bundle.rs): attachments as sealed content-defined chunks.
cmux-bundle.workspace = true
blake3 = "1"
# The Chief's push body as words, not Markdown (src/notify.rs).
cmux-message-preview.workspace = true
cmux-mobile-link.workspace = true
# JSONC to JSON for cmux-next.json's transport.tailnetCarrier (src/lan.rs, RFD 0164 T5).
cmux-json.workspace = true
# The relay publisher (src/relay_publish.rs): seals the newest snapshot and each delta per phone.
cmux-relay-snapshot.workspace = true
# Mac output to phone paint (src/output_paint.rs): its ring and window math.
cmux-output-paint.workspace = true
cmux-egress.workspace = true
cmux-rd-core.workspace = true
# This Mac's interface table, for which interfaces a session uses (src/netwatch.rs).
cmux-transport.workspace = true
# The shared rd media engine: the in-hostd host of a simulator surface (src/surface.rs).
cmux-rd-engine.workspace = true
cmux-rd-proto.workspace = true
# The `tabs` service's frames, producer and sessions (src/tab_snapshots.rs).
cmux-tab-snapshots.workspace = true
cmux-phone-page.workspace = true
# Viewport state sync (src/viewport_sync.rs): the host's screen model and its diffs, and the
# overlay datagram port they go on.
cmux-terminal-projection.workspace = true
cmux-wg.workspace = true
# Compressed acpmux messages on the phone link (src/link_deflate.rs).
flate2.workspace = true
futures-util.workspace = true
libc = "0.2"
# The local link's Bonjour ad and the dial tool's browse (src/local_link.rs, ultra-connectivity P7).
mdns-sd = { version = "0.22", default-features = false, features = ["async"] }
reqwest.workspace = true
# The local link's one-shot mDNS query on each interface, and the Mac's
# answer to a QU question on port 5353 beside mdns-sd (src/local_link.rs).
socket2 = { version = "0.6", features = ["all"] }
rustls.workspace = true
# P-256 verification of the phone's pairing keys (src/pairing.rs); already in
# the graph through rustls.
ring = "0.17"
# Sealed pushes and mailbox replies (src/seal.rs): P-256 ECDH, HKDF-SHA256 and
# AES-256-GCM, as CryptoKit does them on the phone; already in the graph through
# webrtc (dtls).
p256 = { version = "0.13", features = ["ecdh", "ecdsa"] }
hkdf = "0.12"
aes-gcm = "0.10"
sha2 = "0.10"
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["process"] }
tokio-tungstenite.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[features]
# cmux-mobile-fake-backend: the fake backend from cmux-mobile-link's test support.
fake-backend = ["cmux-mobile-link/testing"]

[[bin]]
name = "cmux-mobile-fake-backend"
required-features = ["fake-backend"]

[dev-dependencies]
cmux-fault.workspace = true
# The relay-cache catch-up rows (tests/catch_up_conditions.rs): the phone's reader.
cmux-mobile-core.workspace = true
p256 = { version = "0.13", features = ["ecdh", "ecdsa"] }
rand_core = { version = "0.6", features = ["getrandom"] }
# Seeded-secret test (tests/seeded_secret.rs): gated clients send to a local capture server.
cmux-egress = { workspace = true, features = ["capture"] }
# Paused time for the silence-bound tests (src/mailbox_apply.rs).
tokio = { workspace = true, features = ["test-util"] }
cmux-mobile-link = { workspace = true, features = ["testing"] }
cmux-rd-core.workspace = true
cmux-rd-engine.workspace = true
tempfile = "3"
