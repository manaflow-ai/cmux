[package]
name = "cmux-mobile-host"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "cmux-next-ios Mac bridge: registers the Mac, answers WebRTC and WireGuard dials, serves link channels"

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
base64.workspace = true
bytes.workspace = true
cmux-build-space.workspace = true
# The Chief's push body as words, not Markdown (src/notify.rs).
cmux-message-preview.workspace = true
cmux-mobile-link.workspace = true
cmux-egress.workspace = true
cmux-rd-core.workspace = true
# This Mac's interface table, for which interfaces a session uses (src/netwatch.rs).
cmux-transport.workspace = true
# The shared rd media engine: the in-hostd host of a simulator surface (src/surface.rs).
cmux-rd-engine.workspace = true
cmux-rd-proto.workspace = true
# The `tabs` service's frames, producer and sessions (src/tab_snapshots.rs).
cmux-tab-snapshots.workspace = true
# Compressed acpmux messages on the phone link (src/link_deflate.rs).
flate2.workspace = true
futures-util.workspace = true
libc = "0.2"
# The local link's Bonjour ad and the dial tool's browse (src/local_link.rs, ultra-connectivity P7).
mdns-sd = { version = "0.22", default-features = false, features = ["async"] }
reqwest.workspace = true
# The local link's one-shot mDNS query on each interface, and the Mac's
# answer to a QU question on port 5353 beside mdns-sd (src/local_link.rs).
socket2 = { version = "0.6", features = ["all"] }
# P-256 verification of the phone's pairing keys (src/pairing.rs); already in
# the graph through rustls.
ring = "0.17"
# Sealed pushes and mailbox replies (src/seal.rs): P-256 ECDH, HKDF-SHA256 and
# AES-256-GCM, as CryptoKit does them on the phone; already in the graph through
# webrtc (dtls).
p256 = { version = "0.13", features = ["ecdh"] }
hkdf = "0.12"
aes-gcm = "0.10"
sha2 = "0.10"
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["process"] }
tokio-tungstenite.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[features]
# cmux-mobile-fake-backend: the fake backend from cmux-mobile-link's test support.
fake-backend = ["cmux-mobile-link/testing"]

[[bin]]
name = "cmux-mobile-fake-backend"
required-features = ["fake-backend"]

[dev-dependencies]
# The seeded-secret tests (tests/seeded_secret.rs) send through the capture server.
cmux-egress = { workspace = true, features = ["capture"] }
cmux-fault.workspace = true
cmux-mobile-link = { workspace = true, features = ["testing"] }
cmux-rd-core.workspace = true
cmux-rd-engine.workspace = true
tempfile = "3"
