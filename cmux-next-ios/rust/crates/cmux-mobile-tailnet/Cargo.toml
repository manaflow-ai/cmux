[package]
name = "cmux-mobile-tailnet"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "The phone's own userspace tailnet node (no VPN entitlement): which route a cmux link takes (tailnet direct, else the relay), the Keychain item a key lives in, and the node itself behind a trait"

[lints]
workspace = true

[features]
# The real node: libtailscale (tsnet) linked into the app's process through cmux-tailnet. Off by
# default; the route rules, key rules and fallback are pure and build without Go.
tsnet = ["dep:cmux-tailnet"]

[dependencies]
# The join request's checks (key shape, https-only login server unless chosen per server).
cmux-tailnet-join.workspace = true
cmux-tailnet = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[[example]]
name = "phone_probe"
required-features = ["tsnet"]
