[package]
name = "cmux-mobile-link-ffi"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "uniffi bindings of cmux-mobile-link for the cmux-next-ios app"

[lints]
workspace = true

[lib]
crate-type = ["lib", "staticlib", "cdylib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]

[dependencies]
cmux-mobile-link.workspace = true
cmux-rd-ffi.workspace = true
cmux-rd-proto.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uniffi = "=0.31.1"
uuid.workspace = true

[dev-dependencies]
cmux-mobile-link = { workspace = true, features = ["testing"] }
cmux-mobile-host = { path = "../cmux-mobile-host" }
cmux-rd-core.workspace = true
cmux-rd-engine.workspace = true
sha2 = "0.10"
tempfile = "3"
tokio = { workspace = true, features = ["test-util"] }
