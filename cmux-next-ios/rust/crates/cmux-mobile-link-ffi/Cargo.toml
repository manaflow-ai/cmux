[package]
name = "cmux-mobile-link-ffi"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "uniffi bindings of cmux-mobile-link for the cmux-next-ios app"

[lints]
workspace = true

[lib]
crate-type = ["lib", "staticlib", "cdylib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]

[dependencies]
cmux-mobile-core.workspace = true
# The terminal composer's keyed Send (src/composer_outbox.rs).
cmux-composer-send.workspace = true
cmux-follow-cam.workspace = true
# The launch's last place (src/last_place.rs).
cmux-mobile-last-place.workspace = true
cmux-mobile-link.workspace = true
cmux-rd-ffi.workspace = true
cmux-rd-link.workspace = true
cmux-rd-proto.workspace = true
cmux-tab-snapshots.workspace = true
cmux-terminal-prediction.workspace = true
cmux-terminal-projection.workspace = true
cmux-window-rules.workspace = true
libc.workspace = true
# Share a Mac from the phone (src/share_approval.rs): the approval format the target admits,
# and the P-256 check of the phone's signature (ring is the link's TLS crypto already).
cmux-share-approval.workspace = true
base64.workspace = true
ring = "0.17"
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uniffi = "=0.31.1"
url.workspace = true
uuid.workspace = true

[dev-dependencies]
cmux-mobile-link = { workspace = true, features = ["testing"] }
cmux-mobile-host = { path = "../cmux-mobile-host" }
cmux-rd-core.workspace = true
cmux-rd-engine.workspace = true
sha2 = "0.10"
tempfile = "3"
tokio = { workspace = true, features = ["test-util"] }
