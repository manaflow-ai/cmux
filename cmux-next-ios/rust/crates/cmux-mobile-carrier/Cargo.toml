[package]
name = "cmux-mobile-carrier"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "The phone's own Cloud carrier: a cmux-remote client session to a Cloud machine's daemon over its relay slot, admitted by the person's carrier grant"

[lints]
workspace = true

[dependencies]
# The client half only: no daemon, no PTY, no libghostty-vt (cmux-remote's `host` feature is off).
cmux-remote = { path = "../../../../cmux-tui/crates/cmux-remote", default-features = false }
cmux-remote-protocol = { path = "../../../../cmux-tui/crates/cmux-remote-protocol" }
cmux-link = { path = "../../../../cmux-tui/crates/cmux-link" }
async-trait = "0.1"
getrandom.workspace = true
reqwest.workspace = true
rustls.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
url = "2"
webpki-roots = "1"
zeroize.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread"] }
