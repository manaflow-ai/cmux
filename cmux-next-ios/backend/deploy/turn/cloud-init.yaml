#cloud-config
# One-paste deploy of the relay on a fresh Ubuntu/Debian box (RFD 0088). Replace the two values, paste
# into the host's user-data. Needs DNS for relay.cmux.dev pointing at the box before first boot (certbot).
package_update: true
packages: [curl, git, ca-certificates]
write_files:
  - path: /root/relay.env
    permissions: "0600"
    content: |
      ETURNAL_SECRET=REPLACE_WITH_TURN_SELF_SECRET
      RELAY_DOMAIN=relay.cmux.dev
runcmd:
  - git clone --depth 1 --filter=blob:none --sparse https://github.com/manaflow-ai/cmux /root/cmux
  - git -C /root/cmux sparse-checkout set cmux-next-ios/backend/deploy/turn
  - bash -c 'set -a; . /root/relay.env; set +a; /root/cmux/cmux-next-ios/backend/deploy/turn/install.sh'
  - ufw allow 3478 || true
  - ufw allow 443/udp || true
  - ufw allow 443/tcp || true
  - ufw allow 49152:65535/udp || true
