# The relevance map: path glob -> product area -> the benches, targeted tests and check template that cover it.
#
# Leo, 2026-11-27: "like we can have fast retrieval of bench reference per product area".
#
#   scripts/bench/cmux-bench for-paths FILE...            what a change needs (benches, tests, templates)
#   scripts/bench/cmux-bench for-paths --diff BASE         the same for `git diff BASE...HEAD`
#   scripts/bench/cmux-bench for-paths --run FILE...      also run the areas' `run` benches against `budget_s`
#   scripts/bench/cmux-bench for-paths --coverage          % of the last 7 days' merged paths a mapping covers
#   scripts/bench/cmux-bench for-paths --write             regenerate the [[unit]] section from the repo layout
#
# This is the machine-readable side of docs/benches/coverage-map.md (the page people read). An [[area]] here
# carries the same area name and paths as a row of that page's risky paths table, and every bench it names is
# a row of one of that page's bench tables; tests/test_bench_relevance_map.py holds both joins.
#
# Globs are ci/steps.toml's: `**` crosses '/', `*` and `?` do not; a bare path covers itself and everything
# under it. A path takes its most specific [[area]] and [[unit]] (longest literal prefix, then file order) and
# every [[situation]] it matches. A path neither maps falls back to its top-level folder and warns: fail open.
#
# [[area]]       name, paths, benches (names in coverage-map.md), tests (commands), budget, situations
#                run (Linux bench commands `for-paths --run` runs), budget_s (seconds; over it fails the run)
# [[situation]]  name, paths, template (docs/benches/templates/<name>.md: the minimal check this kind of change needs)
# [[unit]]       generated: one per Rust crate, Swift module or test target, webviews/src folder, tooling folder

schema = "cmux-bench/relevance-map/v1"

# ---- situations: the check a kind of change needs, whatever its area -------------------------------------------

[[situation]]
name = "main-thread"
template = "docs/benches/templates/main-thread.md"
paths = [
  "Packages/macOS/CmuxNext/Sources/**/*.swift",
  "cmux-next-ios/CmuxMobileKit/Sources/**/*.swift",
]

[[situation]]
name = "bridge"
template = "docs/benches/templates/bridge.md"
paths = [
  "cmux-tui/crates/*-ffi/**",
  "cmux-next-ios/rust/crates/*-ffi/**",
  "cmux-tui/crates/cmux-home-rules/**",
  "cmux-tui/bindings/**",
  "Packages/macOS/CmuxNext/Sources/CmuxNextBridge/**",
  "Packages/macOS/CmuxNext/Sources/CmuxNextApp/Home/HomeRules.swift",
  "Packages/macOS/CmuxNext/Sources/CmuxNextChiefPetWiring/WelcomeRule.swift",
  "**/*FFI*.swift",
]

[[situation]]
name = "protocol"
template = "docs/benches/templates/protocol.md"
paths = [
  "cmux-tui/crates/*-protocol/**",
  "cmux-tui/crates/*-wire/**",
  "cmux-tui/crates/cmux-rd-proto/**",
  "backend/packages/protocol/**",
  "webviews/src/protocol/**",
  "schemas/control-plane/**",
  "schemas/agent-bridge/**",
  "schemas/agent-pane/**",
  "**/*.proto",
  "**/*Protocol*.swift",
]

[[situation]]
name = "persisted-format"
template = "docs/benches/templates/persisted-format.md"
paths = [
  "persisted-formats/**",
  "cmux-tui/persisted-formats/**",
  "schemas/settings/**",
  "**/*Store.swift",
  "**/*Journal*.swift",
  "**/*Ledger*.swift",
  "**/*Snapshot*.swift",
  "**/*Record.swift",
]

[[situation]]
name = "migration"
template = "docs/benches/templates/migration.md"
paths = [
  "web/db/migrations/**",
  "backend/db/migrations/**",
  "workers/cmux-vm/migrations/**",
  "**/*Migration*.swift",
  "**/*migrat*.rs",
  "schemas/settings/retired-keys.json",
]

[[situation]]
name = "visible-ui"
template = "docs/benches/templates/visible-ui.md"
paths = [
  "webviews/src/**/*.tsx",
  "webviews/src/**/*.css",
  "Packages/macOS/CmuxNext/Sources/CmuxNextDesign/**",
  "Packages/macOS/CmuxNext/Sources/**/*View.swift",
  "cmux-next-ios/CmuxMobileKit/Sources/**/*View.swift",
  "cmux-next-ios/CmuxMobileKit/Sources/CmuxMobileDesign/**",
]

# ---- areas: coverage-map.md's risky paths, with their benches and targeted tests -------------------------------

[[area]]
name = "Swift↔Rust bridge (sync calls from the main actor)"
paths = ["Packages/macOS/CmuxNext/Sources/CmuxNextApp/Home/HomeRules.swift"]
situations = ["bridge", "main-thread"]
benches = []
tests = ["swift test --package-path Packages/macOS/CmuxNext --filter CmuxNextAppTests"]

[[area]]
name = "Swift↔Rust bridge"
paths = [
  "Packages/macOS/CmuxNext/Sources/CmuxNextChiefPetWiring/WelcomeRule.swift",
  "cmux-tui/crates/cmux-home-rules",
  "cmux-tui/crates/cmux-app-ffi",
]
situations = ["bridge"]
benches = ["ChiefFaceFlushBenchTests"]
tests = [
  "cargo test --manifest-path cmux-tui/Cargo.toml -p cmux-home-rules",
  "cargo test --manifest-path cmux-tui/Cargo.toml -p cmux-app-ffi",
]
budget = "sidebar flush of 1,104 rows x 5 Chiefs under 250 ms"

[[area]]
name = "Sidebar row feed and flush"
paths = ["Packages/macOS/CmuxNext/Sources/CmuxNextSidebar"]
situations = ["main-thread"]
benches = ["SidebarLagBench", "SidebarScrollBench", "SidebarStructuralChangeBenchTests", "SidebarHoverCardRetargetBenchTests", "ChiefFaceFlushBenchTests"]
tests = ["swift test --package-path Packages/macOS/CmuxNext --filter CmuxNextSidebarTests"]
budget = "flush under 250 ms at 1,104 rows"

[[area]]
name = "Sidebar row mapping"
paths = ["Packages/macOS/CmuxNext/Sources/CmuxNextBridge/SidebarMapping+Face.swift"]
situations = ["bridge", "main-thread"]
benches = ["ChiefFaceFlushBenchTests"]
tests = ["swift test --package-path Packages/macOS/CmuxNext --filter CmuxNextBridgeTests"]

[[area]]
name = "Chief pictures"
paths = ["Packages/macOS/CmuxNext/Sources/CmuxNextChiefPetWiring/ChiefMascotPicks.swift"]
situations = ["main-thread"]
benches = ["ChiefFaceFlushBenchTests"]

[[area]]
name = "Agent pane transport (daemon → pane)"
paths = ["Packages/macOS/CmuxNext/Sources/CmuxNextAgentPane"]
situations = ["main-thread"]
benches = ["AgentPaneTransportBench", "AgentPaneTransportBenchParse", "AgentPaneBridgeHopBench", "AgentPageProviderBridgeGapBench", "ChatTailJSONPathBench", "AcpmuxPaneInboundScanBench", "app-stream-bytes"]
tests = ["swift test --package-path Packages/macOS/CmuxNext --filter CmuxNextAgentPaneTests"]

[[area]]
name = "acpmux daemon (send, watch, list)"
paths = ["cmux-tui/crates/acpmux"]
benches = ["v2", "icount", "turn_overhead", "acpmux-watch-bytes", "agent-turn", "daemon-latency", "coord-sim", "session-benches", "AcpmuxChatRowsBench"]
tests = [
  "cargo test --manifest-path cmux-tui/Cargo.toml -p acpmux",
  "cargo bench --manifest-path cmux-tui/Cargo.toml --profile gate -p acpmux --bench icount --locked -- check",
]
budget = "icount within 2% of benches/icount_baseline.json; AcpmuxChatRowsBench 100k-row p95 within 1.2x of 100 rows"

[[area]]
name = "acpmux core"
paths = ["cmux-tui/crates/acpmux-core"]
benches = ["v2", "icount"]
tests = ["cargo test --manifest-path cmux-tui/Cargo.toml -p acpmux-core"]

[[area]]
name = "Chat index and transcripts (Rust)"
paths = ["cmux-tui/crates/cmux-chat-index"]
situations = ["persisted-format"]
benches = ["chat-size", "transcript-shifts"]
tests = ["cargo test --manifest-path cmux-tui/Cargo.toml -p cmux-chat-index"]

[[area]]
name = "Agent chat transcript (web)"
paths = ["webviews/src/agent-session"]
benches = ["webviews/bench/transcript-*.bench.ts", "webviews/bench/chat-*.bench.ts", "webviews/bench/million-event-chat.bench.ts", "snappy", "typing", "pane-resize-drag"]
tests = ["bash scripts/ci/run-webviews-tests.sh src/agent-session"]

[[area]]
name = "Sidebar chat list (web)"
paths = ["webviews/src/sidebar"]
benches = ["webviews/bench/sidebar-chats-*.bench.ts", "webviews/bench/all-chats-list.bench.ts", "webviews/bench/session-*.bench.ts"]
tests = ["bash scripts/ci/run-webviews-tests.sh src/sidebar"]

[[area]]
name = "Main-actor work in the app target"
paths = ["Packages/macOS/CmuxNext/Sources/CmuxNextApp"]
situations = ["main-thread"]
benches = ["MainTaskRecordBench", "ActionBudgetMonitorBench", "stress", "typing-native"]
tests = ["python3 scripts/cmux-next/check-main-actor-work.py", "swift test --package-path Packages/macOS/CmuxNext --filter CmuxNextAppTests"]

[[area]]
name = "Terminal"
paths = ["Packages/macOS/CmuxNext/Sources/CmuxNextTerminal"]
situations = ["main-thread"]
benches = ["TerminalLaunchFrameKeeperBenchTests", "terminal-throughput-quick"]
tests = ["swift test --package-path Packages/macOS/CmuxNext --filter CmuxNextTerminalTests"]

[[area]]
name = "Tabs, panes, spaces"
paths = ["Packages/macOS/CmuxNext/Sources/CmuxNextPages"]
situations = ["main-thread"]
benches = ["TabSwitchPathBench", "TabSwitchCycleBench", "TabSwitchViewSwapBench", "TabStripSelectionBench", "TabStripFollowsPaneTickBench", "SpaceSwitchBench", "PaneMotionBench", "PaneContentPolicyBench", "LayoutDragBench", "PageHostPoolClaimReadyBenchmark", "KeyRouterBench"]
tests = ["swift test --package-path Packages/macOS/CmuxNext --filter CmuxNextPagesTests"]

[[area]]
name = "Palette and omnibar"
paths = ["Packages/macOS/CmuxNext/Sources/CmuxNextPalette"]
situations = ["main-thread"]
benches = ["PaletteBenchmarkTests", "CmdPRankBench", "OmniboxPhaseABenchmarkTests", "OmnibarOpenTabsPerKeyBench", "omnibar", "newtab"]
tests = ["swift test --package-path Packages/macOS/CmuxNext --filter CmuxNextPaletteTests"]
budget = "median and p99 per keystroke at 1,000-2,000 items"

[[area]]
name = "iOS workspace sync and live link"
paths = ["cmux-next-ios/CmuxMobileKit/Sources/CmuxMobileLive"]
situations = ["main-thread"]
benches = ["WorkspaceSyncPerformanceTests", "LinkSmoothnessBenchTests", "CloseTabRoundTripBench", "ResumeLiveBenchTests", "ResumeMatrixBenchTests", "TerminalLoadBench", "TranscriptReadFirstR1Bench", "mobile-flows"]

[[area]]
name = "iOS terminal"
paths = ["cmux-next-ios/CmuxMobileKit/Sources/CmuxMobileTerminal"]
situations = ["main-thread"]
benches = ["TerminalHistoryWindowBench", "TerminalScrollBenchUITests"]

[[area]]
name = "Cloud relay and sync"
paths = ["cmux-tui/crates/cmux-relay"]
benches = ["cloud-turn", "bytes-path", "projection-scale", "projection-way-back"]
tests = ["cargo test --manifest-path cmux-tui/Cargo.toml -p cmux-relay"]

[[area]]
name = "Cloud wire"
paths = ["cmux-tui/crates/cmux-cloud-wire"]
situations = ["protocol"]
benches = ["bytes-path"]
tests = ["cargo test --manifest-path cmux-tui/Cargo.toml -p cmux-cloud-wire"]

[[area]]
name = "Browser chrome"
paths = ["Packages/macOS/CmuxNext/Sources/CmuxNextBrowser"]
situations = ["main-thread"]
benches = ["BrowserChromeSwitchBench", "BrowserChromeMemoryBench", "xbench", "web-vitals"]
tests = ["swift test --package-path Packages/macOS/CmuxNext --filter CmuxNextBrowserTests"]

# ---- areas beyond the risky table: high-traffic paths with their own checks ------------------------------------

[[area]]
name = "CI pipeline and workflows"
paths = [".github/workflows", "ci", "scripts/ci", "tests/test-execution.d"]
benches = ["agent-quota", "ci-vm-idle"]
tests = ["python3 tests/test_ci_step_table.py", "python3 tests/test_ci_test_execution_registry.py"]

[[area]]
name = "Settings schema and window"
paths = ["schemas/settings", "Packages/macOS/CmuxNext/Sources/CmuxNextSettings", "Packages/macOS/CmuxNext/Sources/CmuxNextSettingsWindow", "cmux-tui/crates/cmux-config"]
situations = ["persisted-format"]
benches = ["ChiefFaceFlushBenchTests"]
budget = "a 160 KB settings fileRoot never crosses the bridge per row (cmux#59531)"

[[area]]
name = "Bench tooling"
paths = ["scripts/bench", "docs/benches"]
tests = ["python3 -I tests/test_bench_relevance_map.py"]
# for-paths itself, as a bench: load + plan on 2,000 tracked paths with 10x the map's rules (flat at 10x).
run = ["python3 -I scripts/bench/cmux-bench for-paths --self-bench 2000 --scale 10"]
budget_s = 2.0

[[area]]
name = "cmux-next scripts and their tests"
paths = ["scripts/cmux-next"]
tests = ["python3 -I scripts/cmux-next/tests/run-script-tests.py", "python3 tests/test_cmux_next_checks_workflow.py"]

[[area]]
name = "Measurement scripts"
paths = ["scripts/measure"]
tests = ["bash scripts/measure/tests/run-all.sh"]

[[area]]
name = "CI workflow notes"
paths = ["docs/ci"]
tests = ["python3 tests/test_cmux_next_checks_workflow.py", "python3 tests/test_cmux_next_fast_gates.py"]

[[area]]
name = "OptChat (Chief runtime, Rust)"
paths = ["Native/OptChat"]
tests = [
  "cargo test --manifest-path Native/OptChat/optchat-chief/Cargo.toml --workspace",
  "cargo test --manifest-path Native/OptChat/chief-turn/Cargo.toml",
]

[[area]]
name = "Backend apps (api, dashboard, home-server)"
paths = ["backend/apps"]
tests = [
  "cd backend/apps/api && bun run test",
  "cd backend/apps/dashboard && bun run test:server",
  "cd backend/apps/home-server && bun run test",
]

