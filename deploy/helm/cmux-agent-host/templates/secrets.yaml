{{- if and (not .Values.join.existingSecret) (not .Values.join.token) }}
{{- fail "set join.existingSecret (recommended: a sealed or external Secret holding the join token) or join.token" }}
{{- end }}
{{- if not .Values.join.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cmux-agent-host.joinSecret" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cmux-agent-host.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.join.existingSecretKey }}: {{ .Values.join.token | quote }}
---
{{- end }}
# Written by the agent after it redeems the join token. Created empty here because a Role cannot grant
# `create` on one Secret name; Helm's three-way merge leaves the data the agent wrote on upgrade.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cmux-agent-host.hostCredentialSecret" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cmux-agent-host.labels" . | nindent 4 }}
  {{- if .Values.hostCredential.keep }}
  annotations:
    helm.sh/resource-policy: keep
  {{- end }}
type: Opaque
