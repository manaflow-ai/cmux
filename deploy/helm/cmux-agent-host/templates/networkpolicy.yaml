{{- if .Values.networkPolicy.enabled }}
# Agent slots: no ingress at all; egress to cluster DNS and public addresses only (RFD 0100 sections 7, 9).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "cmux-agent-host.fullname" . }}-slots
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cmux-agent-host.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "cmux-agent-host.slotSelector" . | nindent 6 }}
  policyTypes: ["Ingress", "Egress"]
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.dnsNamespace }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.dnsPodLabels | nindent 14 }}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - ipBlock:
            cidr: {{ .Values.networkPolicy.egressCIDR }}
            {{- with .Values.networkPolicy.egressExcept }}
            except:
              {{- toYaml . | nindent 14 }}
            {{- end }}
    {{- with .Values.networkPolicy.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
