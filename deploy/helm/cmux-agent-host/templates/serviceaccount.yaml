apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "cmux-agent-host.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cmux-agent-host.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
