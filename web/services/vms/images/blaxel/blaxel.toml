name = "cmux-devbox"
type = "sandbox"
description = "cmux Cloud machine: chatmux-devbox tool parity plus an openbox/TigerVNC desktop with Ghostty, Chrome, and noVNC on 6901"

[runtime]
generation = "mk3"
memory = 4096

# cmux-tui remote daemon (1337) needs no declaration here: the driver mints
# control-plane previews for it, which only require the sandbox to exist.

# noVNC web client served by websockify; the desktop wrapper opens this port.
[[runtime.ports]]
name = "novnc"
target = 6901
protocol = "tcp"
