[package]
name = "optchat-chief"
version = "0.1.0"
edition = "2024"
description = "An OptChat Chief for cmux-next Home: the brain-host contract of mux/host, with OptChat memory and one fresh acpmux session per turn"
license = "GPL-3.0-or-later"
publish = false

# Its own workspace and lockfile (like Native/DiffSidecar): the Chief ships in the app bundle.
[workspace]

[lib]
name = "optchat_chief"
path = "src/lib.rs"

[[bin]]
name = "optchat-chief"
path = "src/main.rs"

[dependencies]
optchat-core = { path = "../optchat-core" }
optchat-host = { path = "../optchat-host" }
# The daemon client (local-conversations-v1 over the session socket).
cmux-sdk = { path = "../../../cmux-tui/bindings/rust" }
# Wire types of the conversation owner, and the pure ports of mux/host's wake
# rule, turn folding and acpmux types.
cmux-conversation = { path = "../../../cmux-tui/crates/cmux-conversation" }
cmux-chief = { path = "../../../cmux-tui/crates/cmux-chief" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
libc = "0.2"
# The native engine's Messages API client (blocking, like optchat-host's).
ureq = { version = "2", features = ["json"] }
# Link previews (src/link_preview): URLs as the guard checks them (ureq's own
# url), and the preview picture decoded and re-encoded as a small JPEG.
url = "2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
# The codex compactor slots' config.toml, kept keys copied from the user's.
toml = "0.8"
# The brain host's cloud install key (ES256) and its base64url encodings.
ring = "0.17"
base64 = "0.22"
# `cloud pair`: the server pairing wait socket and the declared WireGuard key.
tungstenite = { version = "0.29", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
sha2 = "0.10"
# The four fingerprint words, the same list and derivation the app shows.
cmux-server-core = { path = "../../../cmux-tui/crates/cmux-server-core" }

[dev-dependencies]
tempfile = "3"
