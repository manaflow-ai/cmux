[package]
name = "optchat-chief"
version = "0.1.0"
edition = "2024"
description = "An OptChat Chief for cmux-next Home: the brain-host contract of mux/host, with OptChat memory and one fresh acpmux session per turn"
license = "GPL-3.0-or-later"
publish = false

# The OptChat workspace and its one lockfile (like Native/DiffSidecar, apart from
# cmux-tui's): the Chief ships in the app bundle. The other OptChat crates it
# builds are members and name it in `package.workspace`. chief-turn stays a
# workspace of its own: backend/chief-cc/bake.sh builds its runner from that
# directory alone (Cargo.toml, Cargo.lock, src) in the Cloud Chief's image.
[workspace]
members = ["../chief-kernel", "../optchat-core", "../optchat-host", "../optchat-wasm"]

[lib]
name = "optchat_chief"
path = "src/lib.rs"

[[bin]]
name = "optchat-chief"
path = "src/main.rs"

[dependencies]
optchat-core = { path = "../optchat-core" }
chief-kernel = { path = "../chief-kernel" }
optchat-host = { path = "../optchat-host" }
# Claude Code's stream-json lines and token counts, shared with the Cloud
# Chief's turn runner (Native/OptChat/chief-turn); the library only.
chief-turn = { path = "../chief-turn", default-features = false }
# The daemon client (local-conversations-v1 over the session socket).
cmux-sdk = { path = "../../../cmux-tui/bindings/rust" }
# Wire types of the conversation owner, and the pure ports of mux/host's wake
# rule, turn folding and acpmux types.
cmux-conversation = { path = "../../../cmux-tui/crates/cmux-conversation" }
cmux-chief = { path = "../../../cmux-tui/crates/cmux-chief" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
libc = "0.2"
# The `watch` tool's `until` (src/watch.rs).
regex = "1"
# The native engine's Messages API client (blocking, like optchat-host's).
ureq = { version = "2", features = ["json"] }
# Link previews (src/link_preview): URLs as the guard checks them (ureq's own
# url), and the preview picture decoded and re-encoded as a small JPEG.
url = "2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
# The codex compactor slots' config.toml, kept keys copied from the user's.
toml = "0.8"
# The brain host's cloud install key (ES256) and its base64url encodings.
ring = "0.17"
base64 = "0.22"
# `cloud pair`: the server pairing wait socket and the declared WireGuard key.
tungstenite = { version = "0.29", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
sha2 = "0.10"
# `move`: consistent SQLite copies (VACUUM INTO) and row counts; the same
# rusqlite optchat-host links.
rusqlite = { version = "0.32", features = ["bundled"] }
# The four fingerprint words, the same list and derivation the app shows.
cmux-server-core = { path = "../../../cmux-tui/crates/cmux-server-core" }
# The longest socket path every host binds (src/acpmux_daemon.rs).
cmux-unix-socket = { path = "../../../cmux-tui/crates/cmux-unix-socket" }
# The settings file's path and JSONC dialect (src/agent_memory/settings.rs),
# the daemon's own reader.
cmux-config = { path = "../../../cmux-tui/crates/cmux-config" }
# The MCP hub (src/mcp_hub): URL, command and OAuth rules, tool screening.
cmux-mcp-connect = { path = "../../../cmux-tui/crates/cmux-mcp-connect" }

[features]
# Only the tests' in-process fake acpmux daemons: a socket peer that is this
# process passes the peer check (acpmux_peer). Never in a shipped build; the
# tests turn it on through the self dev-dependency below.
test-in-process-peer = []

[dev-dependencies]
optchat-chief = { path = ".", features = ["test-in-process-peer"] }
tempfile = "3"
# The Chief fast evals (examples/chief_eval.rs): check regexes.
regex = "1"

# The Chief ships in the app bundle (Resources/bin): fat LTO with one codegen
# unit, like the cmux-tui client, keeps it small.
[profile.release]
lto = "fat"
codegen-units = 1

# optchat-wasm's release build for the hosted placement (experiments/chief-optmem/
# scripts/build-optchat-wasm.sh: --profile wasm-release): the settings it had as
# its own workspace (opt-level "s", lto, the default codegen units). A member's
# own [profile] is ignored, so they live here.
[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 16
