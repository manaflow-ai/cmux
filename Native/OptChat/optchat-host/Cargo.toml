[package]
name = "optchat-host"
version = "0.1.0"
edition = "2021"
description = "OptChat I/O for the MacBook and Mac mini placements: file store, single-writer lock, compactor runner"
license = "MIT"
publish = false

# Its own workspace and lockfile (like Native/DiffSidecar): the Chief ships in the app bundle.
[workspace]

[dependencies]
optchat-core = { path = "../optchat-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
ureq = { version = "2", features = ["json"] }
libc = "0.2"

[dev-dependencies]
tempfile = "3"
