[package]
name = "optchat-host"
version = "0.1.0"
edition = "2021"
description = "OptChat I/O for the MacBook and Mac mini placements: SQLite store, single-writer lock, compactor runner"
license = "GPL-3.0-or-later"
publish = false
# In the OptChat workspace (optchat-chief's Cargo.lock).
workspace = "../optchat-chief"


[dependencies]
optchat-core = { path = "../optchat-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
ureq = { version = "2", features = ["json"] }
libc = "0.2"
# The memory store: one SQLite file per Chief home (bundled SQLite with FTS5).
# 0.39: the one cmux-tui pins (=0.39.0; its graph allows one `links = "sqlite3"`), so the
# multicall bin/cmux can carry the Chief (CMUX-570). `fallible_uint` keeps the u64/usize
# conversions 0.32 had built in.
rusqlite = { version = "0.39", features = ["bundled", "fallible_uint"] }

[dev-dependencies]
tempfile = "3"
