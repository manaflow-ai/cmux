# cargo-fuzz needs a nightly (-Zsanitizer); pinned here only. The channel must
# equal [nightly] in scripts/cmux-next/linux/tool-versions.toml (the same pin as
# cmux-tui/fuzz); scripts/cmux-next/rust-fuzz.sh refuses to run when they differ.
# rustfmt: scripts/cmux-next/base-autofix.sh runs cargo fmt in every
# Native/OptChat crate, this one too.
[toolchain]
channel = "nightly-2026-10-20"
profile = "minimal"
components = ["llvm-tools", "rustfmt"]
