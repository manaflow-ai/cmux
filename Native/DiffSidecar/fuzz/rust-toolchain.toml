# cargo-fuzz needs a nightly (-Zsanitizer); pinned here only, the sidecar itself
# stays on ../rust-toolchain.toml. The channel must equal [nightly] in
# scripts/cmux-next/linux/tool-versions.toml (as cmux-tui/fuzz/rust-toolchain.toml);
# scripts/cmux-next/rust-fuzz.sh refuses to run when they differ.
[toolchain]
channel = "nightly-2026-10-20"
profile = "minimal"
components = ["llvm-tools"]
